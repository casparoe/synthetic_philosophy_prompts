answer: |-
  Below is a comprehensive, classroom-ready activity designed to meet your requirements. It includes rules, payoff tables, materials, a detailed timeline, and a debrief structure focused on eliciting the tension between backward induction reasoning and actual behaviour. The design uses British English throughout.

  ---

  ### **Activity: The Centipede Game Experiment**
  **Objective:** Experience the tension between individual rationality and cooperative behaviour in sequential games, setting the stage for understanding backward induction.

  ---

  ### **Materials Provided to Each Pair**
  1. **Game Rules Sheet** (one per pair)
  2. **Scorecard** (one per pair)
  3. **Promise Slips** (for the cheap talk variant)
  4. **Timer** (visible to all, e.g., projected on board)

  ---

  ### **Game Rules**  
  **Core Mechanics:**  
  - Players: **Player A** and **Player B** in each pair.  
  - **Pot** starts at 10 points. On your turn, choose:  
    - **TAKE**: Game ends. You get 80% of the pot, partner gets 20%.  
    - **PASS**: Pot doubles, turn passes to partner.  
  - **Last Round Rule**: If a player PASSES in the final round, both get **0 points**.  
  - **Rounds**: Games last 2, 3, or 4 rounds (as specified).  

  **Payoff Tables (No Algebra, Readable at a Glance):**  
  *Display these tables on the board and handouts. Values are fixed to ensure backward induction holds.*  

  #### **2-Round Game**  
  | Round | Current Pot | Player to Move | If TAKE (Taker, Partner) | If PASS → Next Round |  
  |-------|-------------|---------------|---------------------------|----------------------|  
  | 1     | 10          | Player A      | (8, 2)                    | Pot = 20, Player B moves |  
  | 2     | 20          | Player B      | (16, 4)                   | Both get 0           |  

  #### **3-Round Game**  
  | Round | Current Pot | Player to Move | If TAKE (Taker, Partner) | If PASS → Next Round |  
  |-------|-------------|---------------|---------------------------|----------------------|  
  | 1     | 10          | Player A      | (8, 2)                    | Pot = 20, Player B moves |  
  | 2     | 20          | Player B      | (16, 4)                   | Pot = 40, Player A moves |  
  | 3     | 40          | Player A      | (32, 8)                   | Both get 0           |  

  #### **4-Round Game**  
  | Round | Current Pot | Player to Move | If TAKE (Taker, Partner) | If PASS → Next Round |  
  |-------|-------------|---------------|---------------------------|----------------------|  
  | 1     | 10          | Player A      | (8, 2)                    | Pot = 20, Player B moves |  
  | 2     | 20          | Player B      | (16, 4)                   | Pot = 40, Player A moves |  
  | 3     | 40          | Player A      | (32, 8)                   | Pot = 80, Player B moves |  
  | 4     | 80          | Player B      | (64, 16)                  | Both get 0           |  

  **Key Backward Induction Property:**  
  - **Final Round**: Taking dominates passing (e.g., 64 > 0 in Round 4).  
  - **Penultimate Round**: Taking dominates passing (e.g., in Round 3: 32 > 16, since passing lets partner take next round and you get 16).  
  - **Unravelling**: Applying this logic backward forces taking in Round 1.  

  ---

  ### **Timeline (Total: 75 Minutes)**  
  #### **Phase 1: Gameplay (45 Minutes)**  
  1. **Introduction & Grouping (5 mins)**  
     - Divide into 9 pairs.  
     - Hand out materials. Briefly explain:  
       > *“You’ll play a series of games with your partner. Each game involves passing or taking a pot of points. Your goal: maximise your personal points. Follow the rules on your sheet. I won’t answer strategy questions—use your intuition!”*  

  2. **2-Round Game (6 mins)**  
     - Players play **twice**: Once with A starting, once with B starting.  
     - **Focus:** Fast, simple warm-up. Most should take in Round 1.  

  3. **3-Round Game (8 mins)**  
     - Play **twice** (switch starting roles).  
     - **Focus:** Many will pass in Round 1—highlighting the tension.  

  4. **4-Round Game (8 mins)**  
     - Play **twice** (switch starting roles).  
     - **Focus:** Most pairs will pass early, accumulating points.  

  5. **Cheap Talk Variant (15 mins)**  
     - **Step 1 (3 mins):** Pairs write **public promises** for the **4-round game** (same roles as first 4-round game):  
       - *Player A:* “If we reach Round 3, I will ________.”  
       - *Player B:* “If we reach Round 4, I will ________.”  
     - **Step 2 (2 mins):** Promises read aloud within pairs.  
     - **Step 3 (5 mins):** Play the 4-round game.  
     - **Step 4 (5 mins):** Record if promises were kept.  

  6. **Wrap-up Play (3 mins)**  
     - Pairs finalise scorecards.  

  ---

  ### **Scorecard Template**  
  *(Photocopy and distribute one per pair)*  

  | Game          | Starting Player | Round 1 | Round 2 | Round 3 | Round 4 | Player A Points | Player B Points |  
  |---------------|-----------------|---------|---------|---------|---------|-----------------|-----------------|  
  | 2-Round (A→B) | A               |         |         | N/A     | N/A     |                 |                 |  
  | 2-Round (B→A) | B               |         |         | N/A     | N/A     |                 |                 |  
  | 3-Round (A→B) | A               |         |         |         | N/A     |                 |                 |  
  | 3-Round (B→A) | B               |         |         |         | N/A     |                 |                 |  
  | 4-Round (A→B) | A               |         |         |         |         |                 |                 |  
  | 4-Round (B→A) | B               |         |         |         |         |                 |                 |  
  | 4-Round + Promises | A or B    |         |         |         |         |                 |                 |  

  *Instructions:*  
  - Record moves: **T** (Take) or **P** (Pass).  
  - Calculate points using payoff tables.  

  ---

  ### **Debrief Structure (30 Minutes)**  
  **Goal:** Guide students to contrast backward induction logic with their behaviour.  

  1. **Data Collection (5 mins)**  
     - Poll the class:  
       - *“In the 4-round game (A starts), how many took in Round 1?”* → Expect few hands.  
       - *“How many reached Round 4?”* → Expect many hands.  
     - Record aggregate results on the board (e.g., % taking in each round).  

  2. **Backward Induction Mapping (10 mins)**  
     - **Start from the End:**  
       > *“In Round 4, why would Player B take?”*  
       → *“Because 64 > 0. Taking dominates passing.”*  
     - **Move to Round 3:**  
       > *“If Player B takes in Round 4, what does Player A get if they pass in Round 3? What if they take?”*  
       → *“Passing gives A 16 (when B takes later). Taking gives A 32 now. So 32 > 16 → A should take.”*  
     - **Round 2:**  
       > *“If A takes in Round 3, what does Player B get if they pass in Round 2? What if they take?”*  
       → *“Passing gives B 8 (when A takes later). Taking gives B 16 now. 16 > 8 → B should take.”*  
     - **Round 1:**  
       > *“If B takes in Round 2, what does Player A get if they pass? What if they take?”*  
       → *“Passing gives A 4. Taking gives A 8. 8 > 4 → A should take.”*  
     - **Conclusion:** Backward induction forces taking in Round 1.  

  3. **Contrast with Behaviour (10 mins)**  
     - **Key Question:**  
       > *“You all just proved taking in Round 1 is ‘rational’. Why did 90% of you pass?”*  
     - **Highlight Tensions:**  
       - *Trust:* “Did you assume your partner wouldn’t follow backward induction?”  
       - *Mutual Benefit:* “Passing felt cooperative—you both gained more.”  
       - *Time Inconsistency:* “In Round 3, your logic said ‘take’, but you passed. Why?”  
         → *“Because you believed B might pass in Round 4 (even though backward induction says they won’t).”*  
     - **Cheap Talk Insights:**  
       - *“Did promises change behaviour? Were they kept?”*  
       → Promises to **take** (credible) often kept; promises to **pass** (non-credible) often broken.  
       → Backward induction feels *more uncomfortable* with promises, but doesn’t change outcomes.  

  4. **The Paradox Resolved? (5 mins)**  
     - **The Irony:**  
       - Backward induction is logically sound under **common knowledge of rationality** (CKR).  
       - But humans:  
         (1) Distrust CKR,  
         (2) Prioritise joint gains,  
         (3) Hedge against uncertainty.  
     - **Real-World Echoes:**  
       - *Economics:* Self-interest vs. Pareto efficiency (e.g., oligopolies, public goods).  
       - *Philosophy:* Can rationality demand self-defeating behaviour?  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Collusion:**  
     - *Risk:* Pairs agree to “always pass” to max joint payoffs.  
     - *Solution:* Emphasise: *“Maximise **your** points, not your pair’s.”*  

  2. **Early Takers:**  
     - *Risk:* Some take in Round 1, “spoiling” the tension.  
     - *Solution:* Use data! Poll: *“Who got more than 8 points?”* → Early takers score low; most high scorers passed early.  

  3. **Misunderstanding Final Round:**  
     - *Risk:* Players think passing in Round 4 gives more.  
     - *Solution:* Clarify rules: *“Passing in the last round = 0 for both.”* Repeat twice.  

  4. **Low Stakes Apathy:**  
     - *Risk:* Students don’t care about points.  
     - *Solution:* Offer token incentives (e.g., sweets for top 3 scorers).  

  5. **Time Pressure:**  
     - *Risk:* Games run long.  
     - *Solution:* Use a visible timer; cap turns at 30 seconds.  

  ---

  ### **What the Activity Can’t Reproduce**  
  - **True One-Shot Interaction:** Students know each other, so trust is inflated.  
    → *Supplement:* Discuss how anonymity/strangers might change behaviour.  
  - **Common Knowledge of Rationality:** Humans rarely *truly* believe others are rational.  
    → *Supplement:* Explain CKR as a modelling assumption.  
  - **Pure Paradox vs. Tension:** The activity shows why backward induction *feels* absurd, but doesn’t “prove” it wrong—it highlights its fragility when assumptions loosen.  

  ---

  ### **Instructor Cheat Sheet**  
  - **Critical Moment in Debrief:** When students admit, *“I knew I should take, but passing felt better.”* Use this to dissect time inconsistency.  
  - **British English Check:** “Centre” not “center”, “rationalise” not “rationalize”, “partner” not “teammate”.  
  - **Final Tip:** Start debrief with: *“How many of you beat the backward induction payoff? Why did ‘irrationality’ pay off?”*  

  This design forces students to confront the gap between theory and intuition. By playing first, they feel the absurdity of backward induction viscerally—setting up a richer discussion of rationality, trust, and the limits of CKR. Good luck!
