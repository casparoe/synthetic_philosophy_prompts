prompt: |-
  Ok, so I'm in a seminar on Lewis's stuff about convention and we keep doing examples in class, and I've noticed my gut verdicts on what counts as a convention don't obviously come from any single rule, so what I want is the principle (or a couple of candidate principles) that actually captures them, plus an honest note on which of my verdicts I'd have to give up to keep it. Here's my running list. Driving on the right: convention, obviously, no question. A village where everyone signals a left turn with the same little wrist-flick — it started because the schoolteacher who taught everybody to drive had a tic and the first students copied her, and now the flick is just what you do, everyone expects it, and you'd get a weird look if you didn't: I still want to call that a convention, and the fact that nobody chose it or agreed to it doesn't bother me in the slightest. Now a dorm where everyone drinks way more than most of them actually want to, because each one thinks everyone else is having a great time and doesn't want to be the buzzkill — there's a regularity, everyone conforms, everyone would rather conform than stand out, and if you polled them privately they'd all rank the quiet version higher. My gut says that is not a convention, it's some other kind of thing, and I can't immediately say what fails. Those two cases feel like they should get the same verdict and they don't, and it's driving me a bit nuts. Then: everyone in a town walks on the north side of the street in summer. If they do it because it's the shady side and they'd do it no matter what anyone else did, I say not a convention, just a coincidence of interest. But if both sides are equally shady and the north side is simply where the crowd is, and I walk north partly because that's where the people are, then it starts feeling like a convention, which maybe means my rule is doing more work than I thought.

  A few more that I keep going back and forth on, in case they matter. Suppose a law is passed requiring the wrist-flick, with a fine for not doing it — does the legal backing make it stop being a convention, or is it just a convention with a fine attached? And does it change anything that driving on the right is also legally required? A couple who always go to the same restaurant on Fridays, not because either prefers it but because it's become the thing they do: convention for two people, or too thin a population to count? A town where tipping used to be obligatory and is now maybe sixty percent: mid-collapse, is there a convention or just a residue of one? A bilingual village where the greeting language is switching over one generation, so right now the old people greet in one language and the young in the other and everybody adjusts to whoever they're talking to: is that one convention, two, or a transitional mess with no convention at all? And a rule everyone follows that nobody could actually state if you asked them why — does the inability to articulate it matter?

  My first stab at a rule was this: it's a convention if the behaviour is arbitrary, everyone does it, and everyone would go on doing it if the opposite had gotten started first instead. That gets driving and the wrist-flick, but the dorm case satisfies it and I really don't want it to, and the equally-shady-street case fails the arbitrariness bit yet I want to let it in. So tell me: what principle or small set of principles gets the most of my verdicts, which clause of it is doing the work for which case, what it predicts about cases I haven't listed (a convention between exactly two people, a regularity nobody realises others are also following, one that's half-decayed), and which of my verdicts I should just drop. I'd much rather you tell me straight which parts of this are settled and which are genuinely contested among people who work on conventions — if there's a real split about whether Lewis-style conventions need common knowledge, or whether pluralistic-ignorance-type norms belong in the same bin at all, say that instead of smoothing it into one confident story. My roommate says I'm overthinking it but I don't think I am.
reasoning: |-
  Okay, let me tackle this user's problem. They're in a seminar on Lewis's convention theory and struggling to reconcile their intuitive judgments about what counts as a convention. They've listed several examples where their gut reactions don't align with any single principle. 

  First, I need to recall Lewis's core definition: conventions are arbitrary solutions to coordination problems that persist because everyone prefers to conform given others do. But the user's dorm drinking case fits this yet feels wrong to them. That's the main tension.

  Hmm, the wrist-flick example is interesting—it emerged without explicit agreement but functions as convention. The dorm case also has conformity but feels different. Why? Probably because in the dorm, people conform due to pluralistic ignorance, not because they value coordination. They're privately unhappy but publicly comply. That's key. 

  For the shady street scenario, if both sides are equally shady and people follow the crowd, it becomes convention-like. But Lewis's arbitrariness requirement might exclude it since there's a reason (shade). However, the user wants to include it. Maybe we need to relax "arbitrary" to mean "not uniquely determined by independent reasons."

  The legal aspect: adding fines to the wrist-flick might not kill its conventional status if people still see it as the norm. But if compliance is solely fear-based, it shifts to mere rule-following. Same with driving laws—if underlying coordination remains, it's still convention.

  The couple's restaurant habit: Lewis allows two-person conventions if they solve coordination. Bilingual greetings during transition? It's messy, but adjustments show active coordination, so perhaps multiple conventions coexisting. 

  The user's stab at a rule fails because dorm case meets "arbitrary + conditional preference" yet feels wrong. The fix is requiring preference for conformity itself, not just avoiding sanctions. That excludes the dorm where people conform reluctantly. 

  I should present Lewis's core, then explain where intuitions diverge—like pluralistic ignorance not being true convention. For contested points, note that common knowledge isn't universally required, and two-person cases are debatable. Advise them to drop the dorm verdict or accept it as convention, and relax arbitrariness for the street case.
answer: |-
  Based on Lewis's core framework and the ongoing debates it sparks, your intuitions highlight genuine tensions. Here's a candidate principle set, how it maps to your cases, which verdicts you might need to drop, and where the field genuinely splits:

  **The Core Lewisian Principle (with a crucial tweak):**
  A behavior R in population P is a convention iff:
  1.  **Regularity:** There is a *de facto* regularity in behavior concerning R within P.
  2.  **Coordination Problem:** R solves a recurring coordination problem for P (a situation where individuals have a common interest in coordinating, but multiple coordination equilibria are possible).
  3.  **Arbitrariness:** R is *arbitrary* – meaning there exists at least one *alternative* R' that could have solved the coordination problem *just as well* had it been established instead. (This is key to distinguishing convention from solutions uniquely determined by the situation).
  4.  **Conditional Preference:** Individuals in P *prefer* to conform to R *on the condition* that others (or sufficiently many others) in P *also* conform to R. (The "conditional" part is crucial).
  5.  **Common Knowledge (Contested):** The facts described in (1-4) are *common knowledge* in P. (Lewis required this; others relax it significantly).

  **How This Handles Your Cases & Where Your Gut Might Need Adjustment:**

  1.  **Driving on the Right:** Fits perfectly (1-5). Arbitrary (left works), solves coordination, preference conditional on others doing it.
  2.  **Wrist-Flick:** Fits *if* we relax common knowledge (Lewis would require it). The *origin* doesn't matter. The *current state* shows a regularity solving a coordination problem (signalling intent clearly/expectedly), it's arbitrary (any distinct signal would work), preference is conditional (you do it because others expect it & you expect them to do it). **Verdict: Convention.** Your intuition is good here.
  3.  **Dorm Drinking (Pluralistic Ignorance):** **Fails (4) Conditional Preference.** While there's a *de facto* regularity (1), it *might* solve a pseudo-coordination problem (avoiding social awkwardness) (2), and *might* be arbitrary (a quiet night could work) (3), the **crucial failure is the nature of the preference.** People conform primarily because they *mistakenly* believe others *want* it, *not* because they intrinsically prefer conforming *given others do*. They *privately prefer* the alternative (quiet). Their conformity is driven by *fear of sanction* (being a buzzkill) based on false beliefs, not a *preference for the coordination equilibrium itself*. **Verdict: *Not* a convention (Lewisian), it's a norm sustained by pluralistic ignorance.** You likely need to *accept* this verdict or abandon Lewis's core distinction. This is a major point of debate – some argue norms like this *are* conventions, others (like Bicchieri) sharply distinguish them.
  4.  **Walking North - Coincidence of Interest (Shady):** **Fails (2) Coordination Problem & (4) Conditional Preference.** People walk north *solely* because it's shady. They'd do it even if *no one else* did (so no coordination problem). Their preference is *unconditional* on others' behavior. It's a coincidence, not coordination. **Verdict: Not convention.** Your intuition holds.
  5.  **Walking North - Crowd Following (Equally Shady):** **Fits *if* we interpret "arbitrariness" flexibly (3).** Regularity (1). Coordination problem: avoiding collisions, moving efficiently in a crowd (2). Preference is conditional: you prefer walking north *because* that's where others are, facilitating smooth movement (4). **Arbitrariness is tricky:** Both sides are physically identical *now*, but the *choice* of north was arbitrary initially. Lewis might argue the *reason* for conformity (the crowd) *makes* it arbitrary – south would work fine *if* the crowd was there. If you accept this, it fits. **Verdict: Convention (Lewisian after all).** You might need to *adjust* your intuition that arbitrariness requires "no reason at all" – it means "no uniquely *determining* reason; alternatives exist." The reason for conformity *is* the convention itself.

  **Your Additional Cases:**

  *   **Wrist-Flick + Law:** Legally backing a convention doesn't *necessarily* kill it. If people still conform primarily *because* it's the expected norm (conditional preference), and the law just reinforces it, it's still a convention. If conformity shifts *solely* to fear of the fine, it becomes mere rule-following. Driving on the right is usually *both* – the underlying coordination convention exists, reinforced by law. **Verdict: Can still be convention.** Your intuition holds.
  *   **Couple's Restaurant:** **Fits perfectly as a 2-person convention.** Solves their mini-coordination problem ("Where should we eat Friday?"), arbitrary (other restaurants exist), preference conditional ("I'll go there *because* it's our thing and I expect you to expect it"). Lewis explicitly allows small populations. **Verdict: Convention.** Your intuition holds.
  *   **Tipping at 60%:** This is a **decaying convention.** The regularity is unstable. Conditional preference likely breaks down – some conform out of habit/fear, others don't care or actively reject it. It fails the stable regularity and robust conditional preference aspects. **Verdict: Not a current convention; residue of a past one.** Your intuition holds.
  *   **Bilingual Greeting Transition:** **Likely multiple conventions or a complex coordination equilibrium.** Older generation has Convention A (Greet in Lang1). Younger generation has Convention B (Greet in Lang2). There's *also* a meta-convention: "Adjust your greeting language based on the perceived preference/generation of the person you're addressing." This solves the coordination problem of smooth greeting. It's messy, but conventions exist within sub-groups and a coordination norm exists between groups. **Verdict: Conventions exist, but overlapping/changing.** Your "transitional mess with conventions" intuition is good.
  *   **Unarticulated Rule:** **Common knowledge is contested here.** Lewis required it – people must *know* it's arbitrary, know others know, etc. Many modern accounts (e.g., Millikan, Gilbert) relax this significantly. People often follow conventions without being able to articulate *why* they work or that they are arbitrary. The key is the *pattern* of behavior and conditional preferences, not explicit knowledge. **Verdict: Convention *can* exist without articulability.** Common knowledge is the genuinely contested point.

  **The Candidate Principle Set Summarized & Work Done:**
  *   **(1) Regularity:** Captures the "everyone does it" aspect (Driving, Wrist-Flick, Dorm, Street-Crowd, Couple, Tipping (partly), Bilingual).
  *   **(2) Coordination Problem:** Excludes coincidences (Street-Shady), includes Driving, Wrist-Flick, Street-Crowd, Couple, Bilingual (implicitly). Explains *why* the regularity persists. The Dorm case *arguably* fails here or morphs into a different problem.
  *   **(3) Arbitrariness:** Captures the "could be otherwise" intuition (Driving, Wrist-Flick, Couple). Excludes uniquely determined solutions (Street-Shady). The flexibility here captures Street-Crowd. Requires accepting that the *reason* for conformity defines arbitrariness.
  *   **(4) Conditional Preference:** The **CORE WORKHORSE.** Distinguishes conventions (preferring conformity *given* others conform) from pluralistic ignorance (conforming *despite* preferring the alternative privately) (Dorm fails), coincidences (unconditional preference) (Street-Shady fails), and mere habits/instincts. Captures Driving, Wrist-Flick, Street-Crowd, Couple, Bilingual adjustment.
  *   **(5) Common Knowledge (Contested):** Lewis uses it to explain stability and the conditional preference. Relaxing it allows unarticulated rules and easier application to small groups/dynamic situations.

  **Predictions for Your Unlisted Cases:**
  *   **Convention between exactly two people:** Covered - fits perfectly (Couple example).
  *   **Regularity nobody realizes others follow:** Likely **not a convention** (fails Coordination Problem and Conditional Preference). If no one knows others do it, conformity isn't based on expectations of others (Conditional Preference fails). It's just a mass coincidence or independent habit.
  *   **Half-decayed regularity:** Like tipping at 60% - **not a stable convention.** The conditional preference breaks down; conformity is likely based on different reasons for different people (habit, fear, indifference).

  **What to Drop / Genuinely Contested Points:**
  1.  **Drop the Dorm Verdict (or accept it breaks Lewis):** Your gut that the dorm case isn't a convention is insightful, but under Lewis's *core* conditions (especially 4), it arguably *fails*. It's a prime example of a *different* social phenomenon (pluralistic ignorance norm). **This is contested:** Some theorists expand "convention" to include such norms; Lewisians typically do not.
  2.  **Drop Strict "No Reason" for Arbitrariness:** For the Street-Crowd case, accept that arbitrariness means "not uniquely determined by *independent* reasons; an alternative *could* work." The *reason* for conformity *is* the convention itself/the crowd. This lets it in.
  3.  **Common Knowledge is Contested:** Scholars are split. Lewis insisted on it. Others (e.g., Ruth Millikan, Margaret Gilbert) argue conventions can emerge and persist through behavioral patterns and learning without full-blown common knowledge ("mutual expectation" often suffices). If you think the unarticulated rule or wrist-flick origin story *can* be conventions, you side with those relaxing common knowledge.
  4.  **Pluralistic Ignorance Norms:** **Genuinely split.** Are they a *type* of convention? Lewisians typically say no, as explained. Others (e.g., Bicchieri in *Norms in the Wild*) classify them as a distinct type of norm ("empirical expectations with sanctions") but still within the broad norm literature alongside conventions. They belong in a different bin for Lewisians.
  5.  **Two-Person Conventions:** Lewis explicitly allows them. Some argue conventions require larger groups for "common practice" or to distinguish from personal habits/promises. Lewis's argument for 2-person cases is strong and widely accepted, but minor dissent exists.

  **Conclusion:** You're not overthinking it; you're grappling with the nuances Lewis deliberately built in and the boundaries modern theorists debate. Your intuitions are mostly sound Lewisian intuitions. The key adjustment is realizing the **Conditional Preference** clause (preferring conformity *given* others conform) is what powerfully excludes the dorm case, and that **Arbitrariness** is about alternatives existing, not the absence of *any* reason for conformity. The dorm case and common knowledge are the major points of genuine philosophical contention. Drop the intuition that the dorm case is a convention within Lewis's framework, or be prepared to argue why pluralistic ignorance norms *should* count as conventions against his definition. Keep wrestling with arbitrariness in the street-crowd case – it's where the concept gets interesting.
