prompt: |-
  I'm a postdoc and I've somehow ended up chairing the committee that's deciding whether my department should launch a new interdisciplinary PhD track. There are five of us, and at the first meeting we agreed on a rule so we wouldn't spend three hours going in circles: the committee recommends approval exactly if there's real student demand AND we have the faculty capacity to staff it. Simple enough. We then voted on the three propositions seperately, majority wins on each, and here's what came out: demand, 3 to 2 in favour. Capacity, 3 to 2 in favour. The recommendation itself, 3 to 2 against. I've been over the ballots three times now — every member's three answers are internally consistent, nobody abstained, nobody changed their mind mid-meeting, and I redid the tallies in a spreadsheet. The breakdown was: two people yes on all three, one person thought there was demand but no capacity and voted against, one thought there was capacity but no demand and voted against, one voted no on everything. So by our own agreed rule we've ended up recommending against launching the program on the grounds that we do have demand and we do have the capacity. I keep staring at this. My best guess is that something went wrong procedurally — maybe the order we voted in, or the fact that we voted on the two premises before the conclusion, or maybe we should have balloted all three at once instead of one at a time. I even looked around online and found something called the discursive dilemma, but from what I can tell that's about groups where the individual members are themselves being illogical, which is definately not our problem here; we're all consistent, that's the whole point of the rule. One colleague says it's basically just Arrow's theorem so all voting is broken and we should stop pretending, and another says the obvious fix is to skip the premises and just vote on the bottom line.

  So I'd like you to tell me what actually went wrong and how we should have run this. If the answer is that we should only vote on the conclusion, I want to know what we'd be giving up — the two premise votes were the interesting part of the discussion and I don't love throwing them away — and whether some other ordering of the votes, or a different way of cutting the question up, gets us a set of committee positions that's both consistent and actually reflects what each of us thinks. And if you think this shows that committee decisions like this are just hopeless and I should hand it to the dean, say so, but tell me why. Also, is my colleague right that this is Arrow's theorem? It doesn't feel like the same thing to me but I can't articulate why.
reasoning: |-
  We have a committee of five members. The rule is: recommend approval if and only if there is real student demand AND we have the faculty capacity to staff it.

  The votes on the three propositions (demand, capacity, and the recommendation) were:

  - Demand: 3 in favor, 2 against.
  - Capacity: 3 in favor, 2 against.
  - Recommendation: 3 against, 2 in favor.

  And the breakdown of individual ballots:

  - Two members: Yes on demand, Yes on capacity, Yes on recommendation.
  - One member: Yes on demand, No on capacity, No on recommendation.
  - One member: No on demand, Yes on capacity, No on recommendation.
  - One member: No on demand, No on capacity, No on recommendation.

  So, let's list the votes per member:

  Member 1: (Demand: Yes, Capacity: Yes, Recommendation: Yes)
  Member 2: (Demand: Yes, Capacity: Yes, Recommendation: Yes)
  Member 3: (Demand: Yes, Capacity: No, Recommendation: No)
  Member 4: (Demand: No, Capacity: Yes, Recommendation: No)
  Member 5: (Demand: No, Capacity: No, Recommendation: No)

  Now, note that the rule is: Recommendation = Demand AND Capacity.

  For each member, we can check if their votes are consistent with the rule:

  - Member 1: Yes AND Yes = Yes -> Recommendation Yes: consistent.
  - Member 2: same as member 1: consistent.
  - Member 3: Yes AND No = No -> Recommendation No: consistent.
  - Member 4: No AND Yes = No -> Recommendation No: consistent.
  - Member 5: No AND No = No -> Recommendation No: consistent.

  So every member is individually consistent. However, when we aggregate the votes:

  - On demand: 3 Yes (from M1, M2, M3) and 2 No (M4, M5) -> majority Yes.
  - On capacity: 3 Yes (M1, M2, M4) and 2 No (M3, M5) -> majority Yes.
  - Then, by the rule, the recommendation should be Yes (because both premises are true by majority). But the vote on the recommendation was 2 Yes (M1, M2) and 3 No (M3, M4, M5) -> majority No.

  So we have a problem: the aggregated premises (by majority) imply a recommendation of Yes, but the direct vote on the recommendation was No.

  This is a classic example of the doctrinal paradox (also known as the discursive dilemma). The doctrinal paradox occurs when a group must make a decision on a conclusion that is a function of several premises, and even though each member is individually consistent, the majority vote on the premises leads to a different conclusion than the majority vote on the conclusion.

  So what went wrong? The issue is that the method of voting (majority on each proposition separately) doesn't guarantee that the conclusion derived from the majority premises matches the majority vote on the conclusion.

  Now, your colleague mentioned Arrow's theorem. Arrow's impossibility theorem is about ranking preferences and the impossibility of having a voting system that satisfies certain desirable properties. The doctrinal paradox is related but distinct. Arrow's theorem typically applies to preferences over multiple alternatives, whereas the doctrinal paradox is about the aggregation of judgments on interconnected propositions.

  In this case, the doctrinal paradox is a more precise description. Arrow's theorem might be invoked in a broader sense, but it's not exactly the same.

  So, how should you have run this?

  Option 1: Vote only on the conclusion (the recommendation). Then you avoid the paradox because you just take the majority vote on the recommendation. In this case, the vote would be 2 in favor and 3 against, so you recommend against.

  But you note that the premises were the interesting part of the discussion. Also, by only voting on the conclusion, you lose the information about why the committee is making the decision. For example, if the majority votes against, you don't know if it's because they think there's no demand, or no capacity, or both.

  Option 2: Vote only on the premises and then derive the conclusion from the premises. That is, you take the majority vote on demand and the majority vote on capacity, and then the recommendation is automatically set as the AND of those two. In this case, majority says demand=Yes and capacity=Yes, so the recommendation would be Yes.

  But then note that in the direct vote on the recommendation, the majority was against. So this method would overrule the direct vote on the conclusion.

  Option 3: Another approach is to have the committee vote on the conclusion but also require them to provide their reasoning (i.e., their votes on the premises) to understand the rationale. However, the decision would be based solely on the conclusion vote.

  But that doesn't solve the inconsistency.

  Alternatively, you might consider a different voting system that respects the logical structure.

  One idea is to have each member cast a ballot for the entire set of propositions (as they did) and then look for a consistent collective judgment. However, majority voting on each proposition may not yield a consistent collective set. In this case, the collective set by majority would be:

  - Demand: Yes (3-2)
  - Capacity: Yes (3-2)
  - Recommendation: No (3-2)

  But this set is inconsistent because if demand and capacity are both Yes, then by the rule, recommendation should be Yes, but it's No.

  So we have an inconsistent collective set.

  To avoid this, we might use a different aggregation method that always produces a consistent collective set. One such method is the premise-based procedure: decide the premises by majority and then derive the conclusion. Another is the conclusion-based procedure: decide the conclusion by majority and ignore the premises for the decision.

  But each has drawbacks.

  Another method is to use a "reason-based" aggregation, but that can be complex.

  Alternatively, you could have the committee deliberate until they reach a consensus on both premises and the conclusion. But that might be time-consuming and not always possible.

  Given that in this case the committee agreed on the rule (the logical connection), the premise-based method seems more aligned with the rule because the rule defines the conclusion as a function of the premises.

  But then why did the committee vote on the conclusion separately? That might be the procedural flaw.

  In your meeting, you voted on the three propositions separately. The problem arises because the vote on the conclusion is independent of the votes on the premises.

  So what if you vote only on the premises and then let the chair (or the rule) determine the conclusion? That would avoid the separate vote on the conclusion.

  Alternatively, if you want the committee to vote on the conclusion, you could do it after the premises are decided and then have the conclusion set by the rule, but then the vote on the conclusion is redundant and might be confusing.

  But in your case, you did vote on the conclusion independently.

  How about a different order? You could vote on the conclusion first, and then on the premises to explain the decision. But that might lead to strategic voting.

  Another idea: vote on the premises and then the conclusion, but if the conclusion derived from the premises is different from the majority vote on the conclusion, then you have a problem. In that case, you might need to revisit the discussion.

  But that's not a clear procedure.

  Alternatively, you can use a voting method that looks for a consistent outcome. For example, you could ask each member to cast a ballot for the entire set of propositions (as they did) and then select the collective judgment that is consistent and closest to the individual judgments. This is known as judgment aggregation.

  But this can be complex and there are various rules (e.g., distance-based minimization).

  In practice, for a small committee, you might want to stick to one of the simpler methods.

  So, what should you do?

  Given that the rule was agreed upon (recommendation = demand AND capacity), I think the most straightforward is to use the premise-based method: vote on the premises and then derive the conclusion. This ensures consistency with the rule.

  If you do that, then:

  - Demand: 3 in favor -> true
  - Capacity: 3 in favor -> true
  - Therefore, the recommendation must be to approve.

  This overrules the direct vote on the recommendation, but note that the direct vote on the recommendation was taken without enforcing the rule at the collective level. The rule was intended to define the decision process.

  So, in this case, the two members who voted against the recommendation but were inconsistent in their own votes? No, no one was inconsistent. Actually, the direct vote on the recommendation reflected each member's individual application of the rule. But when we aggregate the premises, we get a collective truth that should lead to a collective recommendation.

  The problem is that the majority vote on the conclusion does not necessarily reflect the collective truth of the premises.

  Therefore, I would argue that the premise-based method is the way to go because it respects the logical structure of the decision rule.

  Alternatively, if the committee wants to have a say on the conclusion independently, then you have to accept that the conclusion vote might not be consistent with the premises. But that seems to defeat the purpose of having the rule.

  In your case, the committee agreed on the rule to avoid going in circles, so I think the premise-based method is more faithful to that agreement.

  So, what to do now? You have a situation where by the premises (majority) you should recommend approval, but by the direct vote on the recommendation, you have a majority against.

  I think you should go back to the committee and explain the paradox. Then, you can propose to follow the premise-based method: since the majority found both demand and capacity, the recommendation should be to approve.

  But that might be controversial because three members voted against the recommendation. However, note that:

  - The two who voted for the recommendation are consistent with the premises.
  - The one who thought there was demand but no capacity (M3) voted against: that's consistent with their view.
  - The one who thought there was capacity but no demand (M4) voted against: consistent.
  - The one who thought neither (M5) voted against: consistent.

  But when we take the majority on the premises, we override the minority views on the premises. So collectively, we have both. Therefore, the collective decision should be to approve.

  Alternatively, if the committee feels strongly about the direct vote on the conclusion, then they might want to reconsider the rule. But the rule was agreed upon.

  So, to answer your questions:

  - What went wrong? You encountered the doctrinal paradox because you voted separately on each proposition and the majority votes on the premises led to a conclusion that was not the majority on the conclusion vote.
  - How should you have run this? You should have voted only on the premises and then derived the conclusion from the premises (without a separate vote on the conclusion). Alternatively, if you want to vote on the conclusion, then do so but then the premises votes are only for informational purposes and the conclusion vote is the decision (but then the rule is not enforced at the collective level).
  - What are you giving up if you only vote on the conclusion? You lose the structured reasoning and the ability to pinpoint why the decision was made. Also, the premises might be easier to judge objectively.
  - Is there a way to get a consistent set that reflects the majority? The premise-based method gives a consistent set (by construction) but might not reflect the majority on the conclusion. The conclusion-based method gives a consistent set only on the conclusion, but then the premises might not be consistent (in fact, they might be inconsistent as we saw). But if you only care about the decision, it might be acceptable.
  - Is this Arrow's theorem? Not exactly, it's the doctrinal paradox. Arrow's theorem is about preference aggregation, while this is about judgment aggregation.

  In summary, I recommend using the premise-based method for this kind of structured decision. So, in your case, the committee should recommend approval because the majority found both demand and capacity.

  But note: the dean might ask for the vote on the recommendation. You'll have to explain the situation.

  Alternatively, you could re-run the vote using the premise-based method and then the chair announces the recommendation based on the premises.

  To avoid this in the future, in the first meeting, you should have specified the voting procedure: that the committee will vote on the premises and the conclusion will be automatically determined by the rule without a separate vote.

  So, for now, I think you should recommend approval.

  But wait: the committee voted 3-2 against the recommendation. So if you go with the premise-based method, you are overruling that vote. This might cause dissent.

  Therefore, it's important to explain the paradox and remind the committee of the agreed rule.

  If the committee still wants to go with the conclusion vote, then you are stuck with a "no" recommendation, but that would be inconsistent with the premises that the same committee approved.

  I hope this helps.

  Final recommendation: hold a short meeting to discuss the inconsistency and then decide to follow the premise-based method (since that was the spirit of the rule) and recommend approval.

  Alternatively, if the committee feels that the direct vote on the conclusion is paramount, then you recommend against, but then the premises votes become irrelevant for the decision.

  But I think the former is better.
answer: |-
  ### What Went Wrong: The Doctrinal Paradox
  Your situation is a textbook example of the **doctrinal paradox** (also known as the discursive dilemma). This paradox arises when a group decision is based on logically interconnected propositions (in this case, "demand," "capacity," and the "recommendation," where the recommendation is defined as the logical AND of the two premises). Even though every committee member is individually consistent (as you confirmed), the method of aggregating votes—majority rule on each proposition separately—can produce a collective inconsistency. Here's why:

  - **The rule**: Recommendation = Demand AND Capacity.
  - **Individual votes**: All members applied the rule consistently to their own judgments (as per your breakdown).
  - **Aggregate votes**:
    - Demand: 3 yes, 2 no → majority supports demand.
    - Capacity: 3 yes, 2 no → majority supports capacity.
    - Recommendation: 2 yes, 3 no → majority opposes recommendation.
  - **The paradox**: By the agreed rule, the majority votes on the premises (demand and capacity both supported) should lead to a "yes" recommendation. But the direct majority vote on the recommendation was "no." This creates a collective inconsistency because the group's decision on the conclusion contradicts what the rule implies based on the group's decisions on the premises.

  The key issue is **procedural**: voting on the premises and conclusion separately with majority rule does not guarantee that the outcome respects the logical relationship between them. The doctrinal paradox is specifically about judgment aggregation (voting on interconnected true/false propositions), not preference aggregation (ranking alternatives), which is what Arrow's theorem addresses. Your colleague's reference to Arrow's theorem is understandable but misplaced—Arrow's theorem deals with ranking preferences (e.g., choosing between multiple options) and shows that no voting system can satisfy all desirable properties in all cases. Your problem is different because it involves logical dependencies between propositions, not preferences over outcomes.

  ### How to Fix the Procedure
  To avoid this paradox, you need a voting method that respects the logical rule while still capturing the committee's input. Here are the main approaches, with their pros and cons:

  #### Option 1: Vote Only on the Premises and Derive the Conclusion (Premise-Based Voting)
  - **How it works**: Vote only on demand and capacity using majority rule. The recommendation is then automatically determined by the rule: if both premises pass, the recommendation is "yes"; otherwise, "no." No separate vote on the recommendation is held.
  - **Why it works**: This enforces consistency with the agreed rule at the collective level.
  - **Your case outcome**: Demand (3 yes) and capacity (3 yes) both pass, so the recommendation would be "yes."
  - **Pros**:
    - Guarantees logical consistency with the rule.
    - Focuses discussion on the foundational issues (demand and capacity), which you noted were the "interesting part."
    - Reflects the spirit of your agreed-upon rule.
  - **Cons**:
    - The recommendation is not directly voted on, so minority views on the conclusion are not formally recorded (though they are implied by the premise votes).
    - May feel "undemocratic" to members who oppose the recommendation, as their direct vote on the conclusion is overruled (but their premise votes still count).
  - **When to use this**: Best if the committee values logical integrity and the rule highly, and if the premises are objectively assessable (e.g., based on data like enrollment numbers or faculty workload).

  #### Option 2: Vote Only on the Conclusion (Conclusion-Based Voting)
  - **How it works**: Vote only on the recommendation using majority rule. Premises are not formally voted on, though they might inform discussion.
  - **Why it works**: Avoids the paradox by not creating an opportunity for inconsistency. The decision is based solely on the conclusion.
  - **Your case outcome**: Recommendation vote was 3 no, 2 yes → "no" recommendation.
  - **Pros**:
    - Simple and avoids paradoxes.
    - Directly reflects the committee's overall stance.
  - **Cons**:
    - **You lose valuable information**: Premise votes are discarded, so you don't know why the committee rejected the proposal (e.g., was it due to lack of demand, capacity, or both?). This could hinder future improvements or reporting to the dean.
    - May encourage superficial voting, as members aren't forced to justify their stance on premises.
    - Does not leverage your thoughtful discussion on premises.
  - **When to use this**: Best if the committee prioritizes speed and simplicity, or if the premises are highly subjective and hard to agree on.

  #### Option 3: Modified Voting Order or Ballot Design (Advanced Judgment Aggregation)
  If you want to preserve votes on all three propositions while ensuring consistency, consider these methods:
  - **Simultaneous voting with a full ballot**: Members vote on all three propositions at once (as you did), but instead of majority rule per proposition, use a **judgment aggregation rule** like the "premise-based procedure" (as in Option 1) or "conclusion-based procedure" (as in Option 2). Alternatively, use a **distance-based method** (e.g., Hamming distance) to select the consistent collective outcome closest to individual votes.
    - **Your case outcome**: A distance-based method might favor the premise-based outcome ("yes" recommendation) since it aligns with the majority premises and is consistent.
  - **Sequential voting with feedback**: Vote on premises first, derive a tentative recommendation, then vote on the conclusion. If the conclusion vote contradicts the derived recommendation, reopen discussion to resolve the inconsistency.
    - **Example**: 
      1. Vote on demand and capacity → both pass.
      2. Announce that the rule implies a "yes" recommendation.
      3. Vote on the recommendation. If the vote is "no," discuss why (e.g., are there unstated factors?) and revote.
  - **Pros**:
    - Maintains all votes and encourages deliberation.
    - Can resolve inconsistencies through discussion.
  - **Cons**:
    - More complex and time-consuming.
    - Sequential voting can be manipulated (e.g., strategic voting).
    - Distance-based methods may be hard to explain.
  - **When to use this**: Best for small, collaborative groups willing to invest time.

  ### What You Should Have Done
  Given your committee's emphasis on avoiding "going in circles" with a clear rule, **Option 1 (premise-based voting) is the best approach**. Here's why:
  - It aligns with your agreed-upon rule: the recommendation is defined by the premises, so voting on premises and deriving the conclusion enforces this logic collectively.
  - It preserves the focus on demand and capacity, which drove your discussion.
  - It avoids the paradox while being straightforward.
  - In your case, it would have produced a "yes" recommendation, consistent with the majority support for both premises.

  If you had used this, you would have:
  1. Voted only on demand and capacity (majority wins on each).
  2. Derived the recommendation from the results without a separate vote.
  3. Skipped the recommendation ballot entirely.

  ### Is Committee Decision-Making Hopeless? Should You Hand This to the Dean?
  No, committee decision-making isn't hopeless—it just requires careful design. The doctrinal paradox is a known pitfall in judgment aggregation, but it can be avoided with the right procedure. Handing this to the dean might offload the problem, but it could also:
  - **Undermine the committee's work**: The dean may lack your context or expertise.
  - **Miss learning opportunities**: This is a chance to improve your process.
  - **Be unnecessary**: With a clear method, committees can handle this.

  However, if your committee is deadlocked or resistant to procedural changes, escalating to the dean with a transparent report (including the vote breakdown and paradox explanation) could be a last resort. The dean might appreciate the nuance and make a more informed decision.

  ### Final Recommendations for Your Current Situation
  1. **Reconvene the committee**: Explain the doctrinal paradox and how it led to an inconsistent outcome. Emphasize that everyone was logical individually, but the aggregation method caused the issue.
  2. **Propose a re-vote using premise-based voting**: Vote again only on demand and capacity, then derive the recommendation. Given your votes, this should yield a "yes" recommendation.
  3. **If resistance is high**, compromise by:
     - Sticking with the original "no" recommendation (from the conclusion vote) but documenting the premise votes to show the inconsistency in your report to the dean.
     - Adding a note that the committee supports demand and capacity, but concerns about implementation (e.g., unstated risks) led to the "no" vote.
  4. **For future committees**:
     - Agree on the voting method upfront (e.g., premise-based for rule-bound decisions).
     - Use a chair or facilitator to enforce the procedure.
     - Consider secret ballots to reduce social pressure.

  By adopting premise-based voting, you keep the valuable premise discussions, ensure consistency, and honor your rule. This isn't Arrow's theorem—it's a solvable quirk of logic in group decisions. Good luck! If you have follow-up questions, I can refine this further.
