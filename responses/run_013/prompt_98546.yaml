prompt: |-
  So I volunteer at a community mediation centre — I have no background in any of this, no law degree, just the weekend training they give you, and I sit in a room with two people who've fallen out and try to get them to a written agreement. Probaly two or three of these a month, and the thing that keeps coming up is promises. Not contracts, nothing with money in escrow, just: he said he'd do X, I planned my life around X, he didn't do X. And I have to sit there and help them work out whether the promise still counts, and honestly I'm making it up as I go.

  I've read alot about this on my own and I want to actually use it. What I've picked up: that a promise isn't just a prediction plus guilt, it's supposed to hand the other person some kind of authority over a bit of your future self; that Hume thought promising was an invented tool, something we made up because it's useful for living together, not a deep fact about the universe; that Rawls talked about promising as a practice with rules, so whether you're inside the practice at all comes before whether you're bound by it; and there's an argument I half remember that the real injury in a broken promise isn't the loss, it's being treated as someone whose plans don't have to be counted. I'd like all that turned into something I can run in a 90 minute session.

  So give me a procedure. The questions to ask, in order, one at a time, in plain language I can say out loud to two upset people who are already talking over each other. For each question, what counts as a real answer and what's just them relitigating. Mark clearly the points where the procedure stops and the answer is "the promise stands, and here's why" or "the promise is dead, and here's why" — and mark the points where the honest answer is that this is about what they owe each other rather than about what's true, and I have to hand it back to them. Assume I have no authority, nothing to enforce with, the room is small and emotional, and sometimes I'm doing this over the phone with ten minutes notice. Also assume I can't look anything up mid-session.

  Then run it start to finish on three cases:

  1. Two brothers. The older one promised the younger half the proceeds if the younger did the gutting and rewiring on a house. The younger one did it, two years of weekends. Then the older one's wife got sick, and that half is now the difference between her being cared for at home and going into a facility. The older one wants out.
  2. A woman promised her dying mother she'd never put her father in a home. Five years on the father has dementia, she's the only one doing any of it, and she's coming apart. She wants out. Her brother says a promise to a dying woman is the most binding kind there is.
  3. A guy promised his mate he'd back up his story about where he was the night of a crash. I know I'm not a lawyer and this isn't my job, but he's asking me whether he still has to keep it.

  I want at least one of those three to come out in a way I won't like, and I want you to say so out loud rather than softening it.

  Finally, tell me where the procedure will misfire: what it can't tell apart, what kind of promise it'll get wrong, and whether any step in it is just my values dressed up as a test. One page, in order, so I can keep it in my bag.
reasoning: |-
  We are designing a mediation procedure for promises. The goal is to have a structured set of questions that lead to a clear conclusion: either the promise stands, the promise is dead, or it's about what they owe each other (and thus needs negotiation). The procedure must be practical for a 90-minute session, with plain language, and account for emotional dynamics.

  Key principles from the user's research:
  1. A promise is an act that gives the promisee authority over a part of the promisor's future.
  2. Promising is a social practice with rules (Rawls) – so we must first establish if the parties are within the practice.
  3. The injury in breaking a promise is about being treated as if your plans don't matter.

  The procedure must be step-by-step, with clear stopping points and criteria for each answer.

  Procedure:

  Step 1: Establish the Promise
     Question: "Can you both agree on what was promised? Let's write it down in one sentence."
     Real answer: A clear statement of the promise (e.g., "I promised to pay you half the proceeds if you did the gutting and rewiring."). If they can't agree, stop: "We can't proceed until we have a clear promise. Without agreement on what was said, we're stuck in a he-said-she-said. Let's take a minute to each write down what you think was promised and see if we can find common ground." If they still can't agree, the mediation may have to pause or end because the foundation is missing.

  Step 2: Check for the Practice of Promising
     Question: "When you made this promise, did you both understand that this was a serious commitment, not just a hope or a guess?"
     Real answer: They must both acknowledge that they were engaging in the practice of promising (per Rawls). If one says it was just a prediction or a casual comment, then the promise may not be binding in the practice. If both agree it was a promise, proceed. If not, stop: "If this wasn't meant as a promise, then it's not binding in that way. We can talk about what you each expected and how to fix the situation now, but it's not about keeping a promise."

  Step 3: Assess Reliance
     Question: "Did you [the promisee] rely on this promise? Did you change your plans or take actions because you believed the promise would be kept?"
     Real answer: Evidence of reliance (e.g., "I spent two years of weekends doing the work"). If there was no reliance, then the promise might still stand but the harm of breaking it is less. However, reliance is not always required for a promise to be binding, but it is critical for the injury when broken. If there was reliance, note it. If not, the promise is still binding but the consequences of breaking it are less severe.

  Step 4: Changed Circumstances
     Question: "Have things changed in a way that nobody could have predicted when the promise was made, and that makes keeping the promise much harder or impossible?"
     Real answer: Unforeseen, significant changes (e.g., a sudden illness, natural disaster). If yes, then the promise might be void or renegotiated. If not, proceed. Note: This step is about whether the promisor is excused because of a fundamental change.

     - If there are changed circumstances: "Given this change, does it seem fair to expect the promise to be kept exactly as it was?"
       Real answer: If both agree the change is so big that the promise can't reasonably be kept, then the promise is dead. But note: the promisee might still be owed something (e.g., compensation for reliance). If they disagree, then we move to negotiation.

  Step 5: Good Faith Effort
     Question: "Have you [the promisor] tried your best to keep the promise, even if you haven't fully succeeded?"
     Real answer: Evidence of effort (e.g., "I tried to pay but then my wife got sick"). If there was no effort, the promise stands and was broken. If there was effort but circumstances prevented full performance, then the promise might be considered kept in spirit or renegotiated.

  Step 6: The Injury of Broken Promise
     Question: "If the promise is broken, what does that say about how you see each other? Is the problem the loss, or is it that one of you feels their plans and efforts weren't respected?"
     Real answer: This is to surface the relational harm. This step doesn't decide if the promise stands, but it sets up the negotiation by focusing on the moral injury.

  Step 7: Resolution
     - If we have a clear case from Steps 1-5:
          - If the promise is binding (Steps 1 and 2 passed), no excusing changed circumstances (Step 4), and no good faith effort (Step 5), then: "The promise stands, and you are obligated to keep it. Let's talk about how to do that."
          - If there are excusing circumstances (Step 4) that both agree are valid, then: "The promise is dead because of these changes. But we still need to address what happened because of the broken promise, especially if there was reliance."
          - If the practice of promising wasn't in play (Step 2), then the promise isn't binding, but we still need to address any reliance or expectations.
     - If it's unclear, or if they disagree, then: "This isn't about what's true anymore; it's about what you owe each other. Let's work out a new agreement that accounts for what's happened."

  Now, apply to the three cases:

  Case 1: Two brothers.
     Step 1: They agree: Older promised younger half the proceeds if younger did the gutting and rewiring.
     Step 2: Both agree it was a serious promise.
     Step 3: Younger brother relied heavily (two years of weekends).
     Step 4: Changed circumstances: Wife's illness. This is unforeseen and significant. But note: the work is already done, so the reliance has occurred. The change affects the promisor's ability to pay, not the act of promising per se.
        Question: Is it fair to expect the promise to be kept? The older brother says no because of the care costs. The younger brother might argue that the work was done and the promise should be kept.
        Mediator: The changed circumstance is real, but it doesn't negate the promise because the work was already completed. The promisor should have planned for risks. However, the reliance has already occurred and the promisee has performed. Thus, the promise stands. But because of the change, we might negotiate a payment plan or partial payment. However, without agreement, the procedure says the promise stands. So: "The promise stands because the work was done in reliance and the change came after. But given the hardship, can we talk about how to fulfill it in a way that doesn't break your family?"

  Case 2: A woman promised her dying mother.
     Step 1: They agree: She promised never to put her father in a home.
     Step 2: It was a serious promise (to a dying mother).
     Step 3: Reliance? The mother relied by dying in peace? But the father may have relied by expecting to stay at home. However, the reliance is indirect. The brother is not the promisee, so his reliance is less direct.
     Step 4: Changed circumstances: The father has dementia, which is more than anyone expected. The burden is now overwhelming and unanticipated. 
        Question: Is it fair to expect the promise to be kept? The woman is coming apart; the brother is not sharing the burden. The change is significant and unforeseen in severity. 
        Conclusion: The promise is dead because of the changed circumstances. But there is still a duty to care for the father. So: "The promise is dead because the situation has changed too much. Now we need to talk about what you both owe your father and each other."

  Case 3: A guy promised to back up his mate's alibi for a crash.
     Step 1: They agree: He promised to say his mate was with him that night.
     Step 2: Was it a serious promise? Probably yes, because it was about an alibi.
     Step 3: Reliance: The mate may have relied by not coming clean earlier.
     Step 4: Changed circumstances? None mentioned. But the promisor now knows that lying could have legal consequences and is morally troubled.
     Step 5: Good faith effort? Not applicable yet because he hasn't been asked to testify?
     However, note: This promise is about committing perjury if the crash was a crime. The mediator must not assist in illegal acts. Even if the procedure says the promise stands, the mediator should not enforce it. 

     But the procedure:
        Step 2: They are in the practice of promising? Yes.
        Step 4: No unforeseen change? The risk of the law was always there.
        Step 5: He hasn't tried to keep it? He's considering not keeping it.

     However, the promise is to do something illegal. The procedure must have a step for legality? We didn't build one. So we must add:

     Step 0: Legality
        Question: "Is this promise about something legal? If it's about something illegal, we can't mediate it because I can't help with illegal acts."

     For this case: The promise is to lie, which is illegal. So at Step 0: "This is about committing perjury, which is illegal. I can't mediate this. You should speak to a lawyer."

     Without Step 0, the procedure would say the promise stands, but that's wrong. So we must add Step 0.

  Where the procedure will misfire:

  1. It assumes both parties are honest and willing to engage. If one is lying or manipulative, the procedure may not work.
  2. It might not handle implicit promises well (e.g., cultural expectations).
  3. It may be too rigid for promises that are part of a larger relationship (e.g., ongoing family dynamics).
  4. The changed circumstances step is subjective: what counts as "unforeseen" and "significant"? This might reflect the mediator's values.
  5. The procedure doesn't account for power imbalances (e.g., one party is more assertive).

  Revised procedure with Step 0 and a note:

  Step 0: Legality and Safety
     Question: "Is this promise about something that is legal and safe? If it involves breaking the law or puts someone in danger, we can't discuss it here."

  Then proceed as before.

  Final One-Page Procedure:

  MEDIATION PROCEDURE FOR PROMISES

  Step 0: Legality and Safety
     Ask: "Is this about something legal and safe? If not, we stop now."

  Step 1: What Was Promised?
     Ask: "Can you both agree on exactly what was promised? Write it down."
     - If no agreement: "We can't mediate without a clear promise. Let's try to find common ground or stop."
     - If agreed, write it.

  Step 2: Was It a Promise?
     Ask: "When you said it, did you both mean it as a serious commitment, not just a hope?"
     - If not: "Then it's not binding as a promise. Let's talk about what you want now."
     - If yes, proceed.

  Step 3: Did You Rely on It?
     Ask: "Did you [promisee] change your plans because of this promise? How?"
     - Note reliance, but even without it, the promise stands. This step highlights harm.

  Step 4: Did Things Change Unpredictably?
     Ask: "Have things happened that no one could have predicted and that make keeping the promise much harder or impossible?"
     - If yes: "Given that, is it fair to expect the promise to be kept exactly as is?"
       - If both agree it's not fair: "The promise is dead. Now, how do we handle the fallout?"
       - If not agreed, move to Step 6.

  Step 5: Did You Try?
     Ask: "Have you [promisor] done everything you reasonably could to keep the promise?"
     - If no effort: "You broke the promise. How do we fix it?"
     - If effort but failed: "You tried, but circumstances stopped you. Let's adjust."

  Step 6: The Real Harm
     Ask: "If the promise is broken, what does that do to your trust? Is it about the loss, or about not being respected?"

  Step 7: Resolution
     - If clear from Steps 1-5: State if the promise stands or is dead.
     - If unclear or disputed: "This is about what you owe each other now. Let's negotiate."

  Note: The changed circumstances step (4) is the most subjective and may reflect the mediator's view of fairness. Be aware of bias.

  Apply to Case 3 with Step 0:
     Step 0: The promise is to lie to authorities, which is illegal. Stop: "I can't help with this. You should consult a lawyer."

  User wanted one case to come out in a way they won't like. In Case 1, the mediator must say the promise stands despite the hardship. That's tough but necessary. In Case 2, the promise is dead, which the brother won't like. In Case 3, we stop at Step 0, which the promisor might not like because he wants validation.

  Final note: The procedure is a tool, not a substitute for human judgment. Use it to structure, but adapt to the situation.
answer: |-
  ### Mediation Procedure for Promises  
  **One-Page Summary for Your Bag**  
  *Use this step-by-step in sessions. Ask questions verbatim. Stop when you hit a bolded conclusion. Stay neutral—no research, no enforcement power.*

  ---

  #### **Step 0: Safety Check**  
  *Ask:* "Is anyone in immediate danger? Or is this about something illegal?"  
  - **Real answer:** If yes → **Stop.** "I can’t help with this. Contact [local crisis resource]."  
  - If no → Proceed.  

  #### **Step 1: What Was Promised?**  
  *Ask:* "What exactly did you promise? Say it in one sentence."  
  - **Real answer:** Concrete action (e.g., "Pay half the proceeds," "Never put Dad in a home").  
  - **Not real:** Blame, emotions, or vagueness ("He’s unreliable," "She’s selfish").  
  - *If they disagree:* "Write it down separately. What’s the overlap?" Still no agreement? → **Stop.** "Without a clear promise, we focus on what’s fair now."  

  #### **Step 2: Was It a Real Promise?**  
  *Ask:* "When you said it, did you mean it as a solid commitment? Or just a hope?"  
  - **Real answer:** "Yes, it was a commitment" → Proceed.  
  - **Not real:** "It was just talk" or "I didn’t mean it seriously" → **Conclusion: No binding promise.** "This wasn’t a true promise. Let’s discuss what’s fair now."  

  #### **Step 3: Did You Rely on It?**  
  *Ask (to the person owed the promise):* "Did you change your plans because you believed this would happen? How?"  
  - **Real answer:** Specific, tangible reliance (e.g., "I spent weekends working," "I quit my job to care for Dad").  
  - **Not real:** General regret ("I’m disappointed") or unrelated consequences.  
  - *If no reliance:* The promise still stands, but breaking it causes less harm. Proceed to Step 4.  
  - *If reliance:* Note it. Proceed.  

  #### **Step 4: Did Things Change Unpredictably?**  
  *Ask:* "Did something happen after the promise that nobody saw coming? Something that makes keeping it impossible or cruel?"  
  - **Real answer:** Major, unforeseen events (e.g., severe illness, disaster).  
  - **Not real:** Foreseeable risks ("I knew the market might crash") or minor inconveniences.  
  - *If no change:* Proceed to Step 5.  
  - *If change:* **Conclusion: Promise is dead.** "This isn’t about fault. The promise can’t bind you anymore. Now we decide what’s fair."  

  #### **Step 5: Did You Try?**  
  *Ask (to the person who made the promise):* "Did you do everything reasonable to keep it?"  
  - **Real answer:** Evidence of effort (e.g., "I saved money but got sick," "I hired help until funds ran out").  
  - **Not real:** Excuses without action ("I was busy").  
  - *If genuine effort:* Proceed to Step 6.  
  - *If no effort:* **Conclusion: Promise stands.** "You made a commitment. It’s still owed."  

  #### **Step 6: The Injury Test**  
  *Ask:* "If this promise is broken, what does it say about how you see each other? Is it about the loss, or about not being respected?"  
  - **Not a conclusion step.** Use this to frame negotiation:  
    - *If loss is the focus:* "How can we fix the practical harm?"  
    - *If respect is the focus:* "How can you rebuild trust?"  
  - Hand it back: "This is about what you owe each other now. Let’s find a solution."  

  ---

  ### **Case Applications**  
  **Case 1: Two Brothers**  
  - **Step 1:** Promise = "Older pays younger half proceeds for rewiring work." → Clear.  
  - **Step 2:** Both agree it was a real commitment.  
  - **Step 3:** Younger brother relied (2 years of work).  
  - **Step 4:** Wife’s illness is unforeseen and severe. → **Promise is dead.** The change makes payment impossible without devastating harm.  
  - *Negotiation:* "Older brother still owes for the work. Can you agree on a payment plan or partial sum?"  
  - **Why you won’t like it:** Younger brother earned that money, but the procedure forces you to prioritize the medical emergency over fairness.  

  **Case 2: Promise to Dying Mother**  
  - **Step 1:** Promise = "Never put father in a home." → Clear.  
  - **Step 2:** Serious promise (made to dying mother).  
  - **Step 3:** Reliance? Mother died in peace; father may have planned to stay home.  
  - **Step 4:** Father’s dementia is unforeseen and makes care unsustainable. → **Promise is dead.**  
  - *Negotiation:* "Brother, you say the promise binds her. What will YOU do to help? Sister, what support do you need?"  
  - **Why it works:** The procedure spares the woman from inhuman strain. Brother’s guilt isn’t ignored—it’s redirected to solutions.  

  **Case 3: Alibi Promise**  
  - **Step 0:** "Backing up a story" about a crash implies lying. → **Stop.** "I can’t help with illegal acts. Speak to a lawyer."  
  - **Why you won’t like it:** It feels cold, but you avoid enabling harm.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Vague Promises:** Fails if Step 1 doesn’t resolve ambiguity (e.g., "Be there for me").  
  2. **Power Imbalances:** Assumes equal voices. A timid person might not articulate reliance (Step 3).  
  3. **Moral Promises:** Gets shaky with "duty-based" vows (e.g., religious oaths)—Step 2 may overlook cultural weight.  
  4. **Step 4 Bias:** "Unpredictable change" relies on your view of "foreseeable." Is dementia foreseeable for an aging parent? Your call.  
  5. **Reliance vs. Loss:** If someone relies but isn’t harmed (e.g., a promise to donate unused goods), the procedure over-prioritizes reliance.  

  **Final Note:** Step 4 (changed circumstances) is where your values sneak in. You decide what counts as "cruel" or "unforeseen." Stay honest: "I see this as a big change, but you decide if it’s fair."  

  ---  
  **Keep this page. Use it. You’re not "making it up"—you’re grounding chaos in human wisdom.**
