prompt: |-
  I'm a first-year PhD student in philosophy, currently taking a metaethics seminar, and I've reached the stage in a seminar paper on expressivism where I need to check my framing before I build anything on top of it. I would rather be corrected now than in a referee report, so let me state as flatly as I can what I currently believe, and then ask you to tell me where I've gone wrong. (1) The Frege-Geach problem, as I understand it, is fundamentally a problem about truth: expressivists hold that in uttering a sentence like "murder is wrong" one is not stating a fact but expressing an attitude, and the objection is that this cannot accommodate the fact that such sentences are true or false and figure in inferences. (2) The name comes from the observation — Frege's distinction between a thought and the assertion of it, and Geach's deployment of that distinction against theories that tie propositional content to mental acts — that a moral sentence can occur inside a conditional without being asserted, which is supposed to show that it is functioning as a genuine predicate with a genuine content rather than as a disguised expression of feeling. (3) Since the last few decades of work on deflationary or minimalist conceptions of truth have made it respectable to say that a sentence is true without positing any fact for it to correspond to, the expressivist can simply help herself to a thin notion of truth and the problem dissolves. (4) The upshot is that Frege-Geach is the old truth-aptness objection in fancier dress: it is a problem for the crude emotivism of the 1930s and not for anything a sophisticated contemporary expressivist like Blackburn or Gibbard actually holds, and the so-called negation problem, about what "not wrong" expresses, is just the same difficulty restated in a different key.

  Please act as an expert in metaethics and the philosophy of language, and think this through carefully rather than reaching for the textbook summary. Begin by separating the four claims above and telling me which are true, which are false, and precisely why; I want the seams identified, not a verdict. If my framing is wrong, give me the actual shape of the Frege-Geach problem and, crucially, the constraints that any adequate solution has to satisfy — what exactly has to come out the same across the asserted and unasserted occurrences, and what has to come out different. Make it concrete with an argument of the following form, or something like it: if it is wrong for the university to keep its fossil-fuel investments, then the students' sit-in is justified; it is wrong for the university to keep its fossil-fuel investments; so the sit-in is justified. I want to see exactly what an expressivist owes me about the first premise and what goes wrong if she cannot pay. Then say how far minimalism about truth actually helps, and where its help stops. Then tell me how the negation problem and the embedding problem relate — whether one is a special case of the other, or whether they are genuinely distinct, and in what respect. Finally, I have a homegrown fix I would like you to assess on its merits: that the expressivist can say that in the antecedent of a conditional the moral term expresses not an actual attitude but a standing disposition or tendency to disapprove, so that nothing is asserted and nothing is presupposed in that position. I suspect this is too quick, but I cannot see exactly why, and if it fails I want to understand the precise point at which it fails. I am not looking for a reading list or a survey of who has said what; I want the diagnosis, the constraints, and an honest assessment of my proposed repair.
reasoning: |-
  Okay, the user is a first-year PhD student in philosophy working on a metaethics seminar paper about expressivism. They've laid out four claims about the Frege-Geach problem and want me to evaluate them critically. They're specifically asking for a detailed breakdown of where they might be mistaken, rather than just textbook answers. 

  First, I need to unpack each of their claims carefully. Their first claim suggests that Frege-Geach is fundamentally about truth. While truth-aptness is part of it, I recall that the core issue is actually about compositional semantics—how unasserted contexts like conditionals preserve content identity. The user seems to conflate truth with content stability here. 

  Their second claim about the origin of the name is mostly correct—Frege's thought/assertion distinction and Geach's application are spot-on. But they're missing how Geach specifically targets the act/content confusion in non-cognitivist theories. 

  Third claim worries me—they think deflationary truth solves everything. Minimalism helps with truth-aptness, sure, but doesn't touch the harder problem of how attitudes compose in embeddings. I should emphasize that distinction. 

  Fourth claim is where things get messy. Calling Frege-Geach just "old truth-aptness in fancy dress" underestimates the negation/embedding challenges that still plague even sophisticated expressivists. Blackburn and Gibbard didn't dissolve it—they built complex systems to address it. 

  For the concrete argument example: The user wants to see precisely why the first premise ("if wrong then justified") is problematic for expressivists. At assertion, "wrong" expresses disapproval, but in the antecedent? It can't be expressing actual disapproval without committing to the attitude, which would make modus ponens collapse. The user's proposed fix—switching to "standing dispositions" in antecedents—might handle simple conditionals but fails for complex embeddings like "if if wrong then justified, then..." where nested attitudes need systematic handling. 

  Ah, and the negation problem! They ask if it's separate from embedding. Actually, negation is the simplest embedding case—if "not wrong" can't be modeled as mere absence of disapproval (since one might be indifferent), it reveals that expressivists need an attitude *for* negation itself. Which then generalizes to all embeddings. 

  Their homegrown fix... it's clever but superficial. "Standing dispositions" might work for isolated antecedents, but what about "Murder isn't wrong" in denial contexts? Or mixed embeddings like "Either stealing is wrong or it's not wrong"? The disposition move doesn't scale to arbitrary logical complexity. Gibbard's solution required constructing possible worlds of norm-acceptance precisely because piecemeal fixes crumble under compositional pressure. 

  The user needs to grasp that the real constraint is systematicity: whatever machinery handles "wrong" in assertions must extend recursively to "if wrong", "not wrong", "believes that wrong", etc., preserving logical relations without attitude explosions. Minimalism is a band-aid; the wound is semantic structure. 

  I should warn them that dismissing Frege-Geach as "solved" would raise red flags for referees—this is still live debate territory. Their fix shows they're thinking creatively though! With refinement, this disposition angle could be part of a larger solution, but alone it's like bringing a knife to a cannon fight.
answer: |-
  Below is a line-by-line analysis of your claims, followed by a concrete breakdown of the Frege-Geach problem, the role of minimalism about truth, the relationship between embedding/negation problems, and an assessment of your proposed solution. I’ll adhere to your request for diagnostic precision and constraints.

  ---

  ### **Analysis of Your Claims**
  1.  **"The Frege-Geach problem is fundamentally a problem about truth."**  
      *   **Verdict: Partially true but misleading.**  
      *   **Seam:** While truth-aptness is *a* component, the core issue is **compositionality**: how the *same* semantic content functions identically in asserted and unasserted contexts (e.g., conditionals, questions, negations). Expressivism must explain why "murder is wrong" contributes the *same content* to truth-conditions in "Murder is wrong" (asserted) and "If murder is wrong..." (unasserted), despite different speech acts. Truth is a symptom; compositionality is the disease.

  2.  **"The name comes from Frege/Geach on non-asserted contexts."**  
      *   **Verdict: True.**  
      *   **Seam:** Geach’s key move (*Ascriptivism*, 1960) targets theories conflating content with act. If "wrong" *only* expresses disapproval when asserted, then in "If murder is wrong..." it cannot express disapproval (as it’s unasserted), yet intuitively it means the *same thing* as in asserted contexts. This creates inconsistency in inferences.

  3.  **"Deflationism about truth dissolves the problem."**  
      *   **Verdict: False for the core problem.**  
      *   **Seam:** Deflationism (e.g., Horwich) helps with *truth-aptness*: expressivists can say moral sentences are truth-apt without corresponding to facts. **BUT** it does nothing for *compositionality*. Even if "wrong" is truth-apt, expressivism must still explain how its *content* embeds in complex sentences and inferences. Deflationism answers "Can moral sentences be true?" but not "How does their meaning compose?".

  4.  **"Frege-Geach is just the old truth-aptness objection; negation is the same problem."**  
      *   **Verdict: Largely false.**  
      *   **Seam:** Truth-aptness was an *early* hurdle (e.g., Ayer’s emotivism couldn’t handle it), but Frege-Geach targets *embedding*. The negation problem (e.g., "murder is not wrong") is a **special case** of embedding: it tests whether expressivism can define a compositional operator for negation that interacts systematically with moral vocabulary. It exposes the same compositionality gap but in a minimal logical context.

  ---

  ### **The Actual Shape of Frege-Geach**
  **Core Problem:** Expressivism must provide a unified semantics where moral terms contribute *identical content* across asserted/unasserted contexts, enabling valid inference patterns.

  **Constraints for a Solution:**  
  - **Content Identity:** The meaning of "wrong" must be the same in "X is wrong" and "If X is wrong...".  
  - **Logical Validity:** The theory must explain why modus ponens with moral premises is valid.  
  - **Systematicity:** The solution must generalize to all embeddings (negation, disjunction, belief reports).

  ---

  ### **Concrete Example: The Sit-In Argument**
  - **P1:** If it is wrong for the university to keep fossil-fuel investments (W), then the sit-in is justified (J).  
    `(W → J)`  
  - **P2:** It is wrong for the university to keep fossil-fuel investments.  
    `W`  
  - **Conclusion:** The sit-in is justified.  
    `J`  

  **What Expressivism Owes:**  
  1. **For P2 (asserted):** Uttering "W" expresses disapproval of fossil-fuel investments.  
  2. **For P1 (unasserted):** "W" in the antecedent cannot express *actual* disapproval (as it’s hypothetical). Yet:  
     - "W" must mean the *same thing* in P1 and P2.  
     - The inference must be valid solely based on content (not speaker’s psychology).  

  **What Goes Wrong Without Solution:**  
  - If "W" in P1 expresses a *different* state (e.g., "imagining disapproval"), then P1 and P2 use "W" ambiguously → modus ponens fails.  
  - If "W" in P1 expresses *nothing*, P1 lacks truth-conditions → the argument has no logical force.  

  ---

  ### **How Far Minimalism Helps**  
  - **Where it helps:** Allows expressivists to say "W" is truth-apt: "W is true" = W. No "correspondence" needed.  
  - **Where it stops:** Does not explain:  
    - How the *content* of "W" in P1 constrains possible worlds/attitudes.  
    - Why `(W → J)` and `W` entail `J` as a matter of logic (not psychology).  
    - How to assign truth-conditions to P1 when "W" is unasserted.  

  Minimalism solves the *meta*-problem of truth-aptness but not the *object*-problem of compositional semantics.

  ---

  ### **Negation Problem vs. Embedding Problem**  
  - **Negation Problem:** A subset of embedding. Tests whether expressivism can define "not wrong" such that:  
    - "Not wrong" isn’t just "absence of disapproval" (which could be indifference).  
    - "X is not wrong" and "X is wrong" are contradictories.  
  - **Why distinct?** Negation requires a *specific attitude* (e.g., tolerance? indifference? second-order attitude?) that "complements" disapproval. Embedding in conditionals requires content stability without attitude expression. Both test compositionality, but negation tests the *logic of attitude-combination* uniquely.  

  **Verdict:** Negation is a *critical special case* of embedding that exposes expressivism’s need for logical operators on attitudes.

  ---

  ### **Assessment of Your Proposed Fix**  
  **Your Fix:** In unasserted contexts (e.g., antecedents), "wrong" expresses a *standing disposition* to disapprove, not an occurrent attitude.  

  **Why It Fails:**  
  1. **Compositionality Gap:** The "standing disposition" is a *different mental state* from occurrent disapproval. But for the inference to work, "wrong" must contribute the *same content* in P1 and P2. If P2 expresses occurrent attitude α and P1 expresses disposition β, then "W" is ambiguous → modus ponens is invalid.  
  2. **Logical Inconsistency:** Consider:  
     - "If murder is wrong, then stealing is wrong" `(W_m → W_s)`  
     - According to your fix:  
       - Antecedent: Disposition to disapprove of murder.  
       - Consequent: Disposition to disapprove of stealing.  
     - But this makes `(W_m → W_s)` a claim about *my psychology* (if I have disposition D1, I have D2). Yet intuitively, this conditional is a *moral claim*, not self-description.  
  3. **Failure in Complex Embeddings:**  
     - "If if murder is wrong then stealing is wrong, then..."  
     - Your fix cannot nest dispositions recursively. What mental state corresponds to the embedded conditional?  

  **Diagnosis:** The fix confuses *semantic content* with *psychological accompaniment*. Expressivism needs content that is *independent* of the speaker’s current mental state to function in logic. Blackburn’s solution (quasi-realism with attitudes toward attitudes) and Gibbard’s (norm-acceptance in possible worlds) avoid this by decoupling content from occurrent psychology.

  ---

  ### **Key Constraints for Expressivism (Recap)**  
  1. **Content Identity:** Semantic value of "wrong" must be invariant across linguistic contexts.  
  2. **Attitude Logic:** Must define logical operators (¬, →, etc.) on non-cognitive states.  
  3. **Inferential Validity:** Must ground logical validity (e.g., modus ponens) in the system.  
  4. **Generalizability:** Must scale to all embeddings (disjunctions, quantifiers, belief reports).  

  **Bottom Line:** Frege-Geach is alive and well. Minimalism handles truth-aptness but not compositionality. Your fix reduces moral conditionals to psychological statements, violating content identity. Sophisticated expressivism (Gibbard, Blackburn) doesn’t dissolve the problem—it builds complex architectures (e.g., hyperplans, normative systems) to *solve* it. Your seminar paper should engage why these solutions are still debated (e.g., Schroeder’s *Being For* challenges their adequacy). 

  If you refine your proposal to define *content* as dispositions + a logic for their composition (e.g., "disapproving of X" as a propositional object), you’ll edge closer to quasi-realism—but then you owe a story about logical operators on dispositions. Tread carefully!
