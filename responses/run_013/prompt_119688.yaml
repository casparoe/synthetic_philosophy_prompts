prompt: |-
  I am the director of assessment for the national certifying body for industrial rope-access technicians — the people who suspend themselves from bridges, towers, and turbine blades to inspect and repair them. Our certification currently requires candidates to pass a written paper and to perform a set of observed practical tasks. A review commissioned by our board has recommended abolishing the practical examination. Its argument is that the written paper is cheaper, that its scores are far more reliable because they do not vary with the severity of the examiner, and that it tests the same competence: a candidate who can state the correct sequence of operations, the load limits, the failure modes, and the decision rules for abandoning a descent has demonstrated the knowledge the job requires, and the physical performance is a formality. As a concession, the review proposes replacing the practical with a recorded think-aloud in which the candidate works through scenarios, the transcript then being scored — perhaps, they suggest, by a language model — for evidence of the relevant knowledge.

  I am uneasy about this but cannot articulate why, and I suspect the philosophical debate about knowing how and knowing that is where the real argument lies. Please set out the most important implications of that debate for my decision.

  Several facts about our candidates make the question live rather than academic. Some of our most trusted technicians — people whose work has never failed an inspection — came through an unaccredited apprenticeship, cannot explain what they do or why, and would fail the written paper outright. We also routinely certify candidates who can recite the manual and then freeze at the first unplanned event on the rope. Our examiners disagree about what they are looking at when they watch a candidate work, and the reliability figures for the practical are poor.

  I want the implications ranked by how much they should change what we do, not a survey of positions, and I want you to mark which of them hold only on the anti-intellectualist view — that knowing how to do something is a distinct kind of knowledge, constituted by an ability rather than by propositional knowledge — and which survive on the intellectualist view, that knowing how is a species of knowing that, perhaps under a practical mode of presentation. In particular: what does the debate license, and what does it not license? Does it support retaining an observed performance assessment, or only retaining some performance measure? What does it imply about the technician who performs the task faultlessly but cannot describe it — does she know how? Does the answer change for one who could once perform it and, after an injury, no longer can? Or for one who can describe it fluently and has never done it? And what follows for the think-aloud proposal: is articulacy a proxy for know-how, or for something else that we may or may not want to measure?
reasoning: |-
  Okay, the user is the director of assessment for a certifying body for industrial rope-access technicians. They're facing a recommendation to abolish the practical exam in favor of a written test and a think-aloud protocol scored by a language model. The user is uneasy but can't articulate why and suspects the "knowing how vs knowing that" philosophical debate is key. They want implications ranked by impact on their decision, marked by whether they hold under anti-intellectualist or intellectualist views.

  First, I need to recall the philosophical positions. Anti-intellectualism, like Ryle's, says knowing-how is a distinct ability, not reducible to knowing-that propositions. Intellectualism, like Stanley and Williamson, argues that knowing-how is a form of knowing-that, just under a practical mode of presentation.

  The user presents real-world cases: skilled technicians who can't pass the written test, and candidates who ace the written but freeze in real situations. Also, examiners have poor reliability in practical assessments. The think-aloud proposal aims to capture procedural knowledge verbally.

  Key implications to consider:

  1. **Distinction between knowledge types**: Anti-intellectualism emphasizes that practical ability is separate and crucial. Intellectualism might downplay this, saying verbalizing is sufficient. But even intellectualists might agree that the mode of presentation matters—verbalizing isn't the same as demonstrating ability.

  2. **Assessment validity**: Removing practical exams risks certifying people who can't perform. The technician who can't explain but performs well is competent under anti-intellectualism. Intellectualism might consider them incompetent due to lack of propositional knowledge. But the user notes these technicians pass inspections, so their know-how is valid.

  3. **Think-aloud protocol**: Articulacy might not correlate with actual skill. Someone might verbalize steps but lack motor skills or situational awareness. Freezing under pressure isn't captured in verbal assessments. Both philosophical views might see this as insufficient, as it's still verbal, not physical performance.

  4. **Reliability vs validity**: The written test is reliable but may lack validity in assessing real-world skills. Practical exams have reliability issues but test actual performance. The user must balance psychometric reliability with real-world safety.

  5. **Safety implications**: Rope access involves high-risk. Certifying someone who can't handle unexpected events could be disastrous. The cases of candidates freezing highlight that procedural knowledge isn't enough. Anti-intellectualism stresses that only practical assessment ensures safety.

  6. **Recommendations**: Retain practical assessment but improve reliability through better examiner training or standardized rubrics. The think-aloud could supplement but not replace hands-on testing. Even under intellectualism, the practical mode of presentation can't be replicated verbally.

  Ranking implications by impact:
  1. Safety risk of certifying non-competent technicians is the highest concern. Both views might agree here, but anti-intellectualism emphasizes it more.
  2. Validity of certification being undermined without performance assessment. Anti-intellectualism sees this as critical.
  3. Reliability issues with practical exams can be mitigated, unlike validity issues from removing them.
  4. Think-aloud isn't a substitute as it still tests verbal knowledge, not physical ability.

  The technician who performs but can't explain: under anti-intellectualism, they know-how. Under intellectualism, they might not, but their performance proves capability. The injured technician who could perform before but now can't: both views might say they no longer know-how. The one who can describe but never did: intellectualism might say they know-how (as knowing-that), but anti-intellectualism says they don't without ability.

  For the think-aloud, articulacy is a proxy for declarative knowledge, not procedural skill. It might measure understanding but not the ability to execute, especially under stress.

  The user needs to argue that safety requires assessing actual performance, regardless of philosophical stance. Improving practical assessment reliability is better than abolishing it.
answer: |-
  Below, I set out the implications of the "knowing how" (KH) vs. "knowing that" (KT) debate for your certification decision, ranked by their practical impact on your assessment system (with #1 being most critical). Each implication is marked **[A]** if it holds *only* under the **anti-intellectualist view** (KH is a distinct ability), **[I]** if it holds *only* under the **intellectualist view** (KH is a species of KT), or **[Both]** if it holds under both views. I then address your specific questions about competence, the think-aloud proposal, and the debate's limits.

  ---

  ### **Ranked Implications for Your Decision**
  1. **Safety-critical skills cannot be reliably certified without direct performance assessment.**  
     **[Both]**  
     - **Why it matters most:** Rope access involves life-or-death risks (e.g., unexpected wind, equipment failure, fatigue). Your data shows candidates who excel on written tests "freeze" during unplanned events. This gap represents a catastrophic safety risk.  
     - **Philosophical basis:**  
       - **Anti-intellectualist [A]:** KH *is* the ability to execute tasks fluidly under real conditions. A written test only measures KT, which does not guarantee this ability.  
       - **Intellectualist [I]:** Even if KH is KT, it is KT *under a practical mode of presentation*. Written tests lack this mode—they test "detached" knowledge, not context-sensitive application.  
     - **Impact:** Abolishing practical assessment licenses technicians who lack crisis responsiveness. **Action:** Retain a performance-based assessment.

  2. **The "unreflective expert" technician is competent but would be excluded by a purely written/verbal system.**  
     **[A]**  
     - **Why it matters:** Your trusted technicians who fail written tests demonstrate that procedural knowledge can be embodied (e.g., muscle memory, intuitive hazard recognition) without being articulable.  
     - **Philosophical basis:**  
       - **Anti-intellectualist [A]:** KH is independent of KT. These technicians possess KH despite lacking KT, as shown by their flawless inspection record.  
       - **Intellectualist [I]:** If KH requires KT, these technicians *must* lack competence—but this contradicts empirical evidence (their work passes inspections). Intellectualism struggles to explain this.  
     - **Impact:** Excluding such candidates reduces workforce quality and invalidates certification. **Action:** Practical assessment is non-negotiable for inclusivity.

  3. **Articulacy (e.g., think-alouds) is a poor proxy for physical know-how and may measure irrelevant traits.**  
     **[Both]**  
     - **Why it matters:** Think-alouds test verbal reasoning, not physical execution. Your data shows candidates who "recite the manual" fail during real tasks, proving articulacy ≠ functional competence.  
     - **Philosophical basis:**  
       - **Anti-intellectualist [A]:** KH is non-propositional; verbalizing steps is KT, not KH.  
       - **Intellectualist [I]:** Think-alouds might access KT, but not necessarily under a *practical* mode of presentation (e.g., "I should clip here" vs. actually clipping correctly under stress).  
     - **Impact:** Replacing practical exams with think-alouds risks certifying people who understand theory but cannot act. **Action:** Reject the think-aloud as a substitute.

  4. **Low inter-rater reliability in practical exams is a fixable problem, not a justification for abolition.**  
     **[Both]**  
     - **Why it matters:** While the review cites poor reliability to favor written tests, this confuses reliability with validity. Written tests reliably measure KT but not KH.  
     - **Philosophical basis:**  
       - **Both:** Reliability issues stem from implementation (e.g., vague criteria, untrained examiners), not philosophy. Neither view licenses abandoning performance assessment.  
     - **Impact:** Prioritizing reliability over validity undermines certification credibility. **Action:** Improve practical assessment (e.g., standardize rubrics, train examiners) rather than abolish it.

  5. **The think-aloud + language model proposal prioritizes cost over competence.**  
     **[Both]**  
     - **Why it matters:** Language models can score transcripts efficiently but cannot assess physical aptitude, situational awareness, or stress management.  
     - **Philosophical basis:**  
       - **Anti-intellectualist [A]:** This tests only KT, missing KH entirely.  
       - **Intellectualist [I]:** It tests "academic" KT, not KT under practical modes (e.g., "what to do if X happens" vs. doing it while dangling 200m up).  
     - **Impact:** Increases accessibility and reduces costs but sacrifices real-world readiness. **Action:** Use think-alouds as a supplement, not a replacement.

  ---

  ### **Answers to Your Specific Questions**
  #### **1. What does the debate license?**
  - **Licenses:**  
    - Retaining performance assessments as essential for safety-critical roles.  
    - Recognizing that KH and KT are empirically distinct in your context (e.g., technicians who act but can’t explain).  
  - **Does not license:**  
    - Abolishing practical exams solely due to reliability issues or cost.  
    - Assuming articulacy (written/verbal tests) equates to physical competence.  

  #### **2. Does it support retaining an observed performance assessment?**  
  - **Yes, decisively.**  
    - **[A]:** Performance assessment directly tests KH.  
    - **[I]:** Performance assessment tests KT *under a practical mode of presentation*, which written/verbal methods cannot replicate.  

  #### **3. What about the technician who performs faultlessly but cannot describe it?**  
  - **Does she know how?**  
    - **[A]:** Yes. Her ability constitutes KH.  
    - **[I]:** No—she lacks the requisite KT. *But this conflicts with your evidence* (her work passes inspections), suggesting intellectualism is inadequate here.  
  - **Implication:** Excluding her via written tests is unjustified and dangerous.  

  #### **4. What if she could perform but can’t due to injury?**  
  - **[Both]:** She no longer knows how. KH requires current ability.  
  - **Implication:** Certification should require recent demonstration of physical competence.  

  #### **5. What about someone who describes fluently but has never done it?**  
  - **[A]:** They do not know how—they possess KT but not KH.  
  - **[I]:** They know how *iff* (if and only if) their knowledge is held under a practical mode. But without performance, this is unverifiable.  
  - **Implication:** This candidate is high-risk (e.g., "freezes" on rope).  

  #### **6. Is articulacy a proxy for know-how?**  
  - **No.**  
    - Articulacy measures KT (or verbal skill), not KH.  
    - **Proxy for:** Cognitive understanding, not physical ability or stress resilience.  
    - **Risk:** Favors candidates strong in theory but weak in practice.  

  ---

  ### **Recommendations for Your Board**
  - **Retain and reform the practical exam:** Address reliability by standardizing tasks, using digital scoring tools, and training examiners. For example:  
    - Develop scenario-based tasks with "unplanned events" (e.g., simulated gear failure).  
    - Use calibrated rubrics focused on decision-making under stress.  
  - **Keep the written exam:** It validly tests KT (e.g., load limits, protocols).  
  - **Reject the think-aloud as a replacement:** It adds little beyond the written exam and fails to test KH.  
  - **Certify the "unreflective expert":** Create alternative pathways (e.g., portfolio assessments of work history) for experienced technicians.  

  The philosophical debate confirms your unease: **practical know-how cannot be inferred from propositional knowledge alone in high-stakes contexts.** Abolishing the performance assessment would sacrifice validity for reliability, endangering lives and the certification’s credibility.
