  The following passage comes from an eighteenth-century essay on the standard of taste. I can follow its sentences one by one, but I cannot see how the argument is supposed to hang together, and I would like help understanding it.

  "As this variety of taste is obvious to the most careless enquirer; so will it be found, on examination, to be still greater in reality than in appearance. The sentiments of men often differ with regard to beauty and deformity of all kinds, even while their general discourse is the same. There are certain terms in every language, which import blame, and others praise; and all men, who use the same tongue, must agree in their application of them. Every voice is united in applauding elegance, propriety, simplicity, spirit in writing; and in blaming fustian, affectation, coldness, and a false brilliant: But when critics come to particulars, this seeming unanimity vanishes; and it is found, that they had affixed a very different meaning to their expressions. In all matters of opinion and science, the case is opposite: The difference among men is there oftner found to lie in generals than in particulars; and to be less in reality than in appearance. An explication of the terms commonly ends the controversy; and the disputants are surprized to find, that they had been quarrelling, while at bottom they agreed in their judgment.

  Those who found morality on sentiment, more than on reason, are inclined to comprehend ethics under the former observation, and to suppose, that in all questions, which regard conduct and manners, the difference among men is really greater than at first fight it appears. It is indeed obvious, that writers of all nations and all ages concur in applauding justice, humanity, magnanimity, prudence, veracity; and in blaming the opposite qualities. Even poets and other authors, whose compositions are chiefly calculated to please the imagination, are yet found, from Homer down to Fenelon, to inculcate the same moral precepts, and to bestow their applause and blame on the same virtues and vices. This great unanimity is usually ascribed to the influence of plain reason; which, in all these cases, maintains similar sentiments in all men, and prevents those controversies, to which the abstract sciences are so much exposed. So far as the unanimity is real, the account may be admitted as satisfactory: But it must also be allowed, that some part of the seeming harmony in morals may be accounted for from the very nature of language. The word, virtue, with its equivalent in every tongue, implies praise; as that of vice does blame: And no one, without the most obvious and grossest impropriety, could affix reproach to a term, which in general use is understood in a good sense; or bestow applause, where the idiom requires disapprobation. Homer's general precepts, where he delivers any such, will never be controverted; but it is very obvious, that when he draws particular pictures of manners, and represents heroism in Achilles and prudence in Ulysses, he intermixes a much greater degree of ferocity in the former, and of cunning and fraud in the latter, than Fenelon would admit of. The sage Ulysses in the Greek poet seems to delight in lies and fictions, and often employs them without any necessity or even advantage: But his more scrupulous son in the French epic writer exposes himself to the most imminent perils, rather than depart from the exactest line of truth and veracity.

  [...]

  The merit of delivering true general precepts in ethics is indeed very small. Whoever recommends any moral virtues, really does no more than is implied in the terms themselves. The people, who invented the word modesty, and used it in a good sense, inculcated more clearly and much more efficaciously, the precept, be modest, than any pretended legislator or prophet, who should insert such a maxim in his writings. Of all expressions, those, which, together with their other meaning, imply a degree either of blame or approbation, are the least liable to be perverted or mistaken."

  What I need is the argumentative structure. Why does the author hold that the direction of the disagreement is reversed between "matters of opinion and science" and matters of taste — that in the former the difference lies in generals while in the latter it lies in particulars? What is the linguistic observation doing? I take the claim to be that a word such as "virtue" carries praise as part of its meaning, so that someone who applies it to an action has not thereby revealed any sentiment of their own; but I do not see how that is supposed to show that the apparent cross-cultural agreement about morality is partly illusory, or why it matters that general moral precepts are "implied in the terms themselves." And most of all: what is any of this doing in an essay about taste? If agreement in general evaluative terms is cheap, does that not threaten the author's own project of finding a standard of taste? Please explain the structure of the argument, the work the discussion of morals is doing for the larger essay, and what the author would say distinguishes the moral case from the case of beauty. Please answer in American English.
