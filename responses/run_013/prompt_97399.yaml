prompt: |-
  I'm in a historiography seminar and I've got a distinction stuck in my head that I can't tell if its real or if I'm just redescribing the standard debate, so I want to compare it against the usual positions. The usual positions, roughly: Ranke wanting the historian to just show the past as it was and keep their own viewpoint out of it; Carr insisting you can't do that, because the historian is always selecting and arranging the past through present-day concerns; White going further and saying that imposing a narrative shape on the past is itself a way of giving it a meaning it doesn't carry on its own.

  The distinction I keep wanting to draw is between two ways of cashing out "objective". Call the first fidelity: an account is objective to the extent it's answerable to the evidence, to the extent the sources are what's making it say what it says. Call the second invariance: an account is objective to the extent it's robust — to the extent it would come out roughly the same if a differently-situated historian, with different interests and a different narrative shape, had written it instead. These seem to pull apart in both directions. You could be scrupulously faithful to the sources and still write something so shaped by your own framing that no other historian would have produced it; and you could get a story that everyone in the field tells the same way, but only because they're all leaning on the same secondary account and nobody has gone back to the sources.

  So compare the two for me. Is fidelity-vs-invariance a real distinction, or does it just collapse back into the old realism-vs-constructivism thing? If it's real, which one is the better ideal for history to aim at, and what does White's point about narrative form do to each of them — does it show that invariance is impossible, or does it actually make invariance the only ideal left standing once fidelity is off the table? Lead with your bottom line in the first sentence, then give the reasoning, and skip the preamble.
reasoning: |-
  Okay, the user is in a historiography seminar and has this distinction stuck in their head between two types of objectivity: fidelity and invariance. They want to know if this is a real distinction or if it just collapses into the standard Ranke vs. Carr vs. White debate. 

  First, I need to unpack their distinction. Fidelity is about being answerable to the evidence, letting the sources dictate the account. Invariance is about robustness—whether different historians would produce the same narrative regardless of their perspectives. The user gives examples where these two can pull apart: high fidelity but low invariance (sources are followed but the framing is unique) vs. low fidelity but high invariance (everyone tells the same story but it's based on secondary sources, not primary evidence).

  Now, comparing this to the traditional debates. Ranke is all about fidelity—show the past "as it really was," suppress the historian's bias. Carr argues that selection is inevitable due to present concerns, which challenges fidelity. White takes it further, saying narrative shapes impose meaning, which undermines both fidelity and invariance. 

  The user’s distinction feels real because fidelity focuses on the relationship with sources, while invariance is about inter-subjective agreement among historians. These aren’t the same thing. You can have one without the other, as the user pointed out. For example, a historian deeply engaged with primary sources might produce a unique interpretation (high fidelity, low invariance), while a textbook consensus might be unchallenged but poorly sourced (low fidelity, high invariance).

  Does this collapse into realism vs. constructivism? Not exactly. Realism might prioritize fidelity, but invariance introduces a social dimension—how historians as a community validate accounts. Constructivism (like White) would challenge both, but invariance shifts focus to communal robustness over individual interpretation. 

  Which ideal should history aim for? Fidelity is foundational; without it, history isn’t grounded. But invariance is aspirational—it pushes for consensus through rigorous engagement with evidence. White’s narrative critique hits both: fidelity is naive (narratives shape meaning), but invariance is also threatened (different narratives yield different accounts). Yet, invariance might survive as a pragmatic goal—consensus through shared standards, even if narratives vary. 

  The user’s deeper need: they’re wrestling with historiography’s core tensions and want validation of their original framing. They might also be seeking how to navigate objectivity in their own work. By affirming their distinction, I can help them refine their thinking and apply it critically. 

  Bottom line: their distinction is valid and useful. It captures nuances beyond the standard debates, especially the social aspect of historical consensus. Fidelity remains essential, but invariance should be the aim, tempered by White’s insights.
answer: |-
  Your fidelity-vs-invariance distinction **is a real and valuable refinement of the standard objectivity debate, not merely a restatement, as it highlights the tension between evidence-bound rigor and communal consensus as competing ideals for objectivity.** Here's the reasoning:

  1.  **Distinction from Standard Positions:**
      *   **Ranke:** Primarily champions *fidelity* (source-dictated truth), implicitly assuming it *leads* to invariance but not explicitly defining it.
      *   **Carr:** Undermines the possibility of pure *fidelity* (selection is subjective) and implicitly challenges *invariance* (different presents yield different histories), but doesn't separate these critiques cleanly. His "objective" is more about useful, evidence-informed interpretation.
      *   **White:** Attacks the very possibility of *fidelity* unmediated by narrative form and *demonstrates why invariance is fragile* (different tropes/plots yield different meanings from "same" facts). He shows narrative is inseparable from both ideals.
      *   **Your Distinction:** Explicitly cleaves apart two *dimensions* often conflated in claims of objectivity: faithfulness to source material (*fidelity*) and independence from individual perspective/consensus (*invariance*). Your examples prove they are distinct and can conflict.

  2.  **Which Ideal to Aim For?**
      *   **Fidelity is the necessary foundation.** Without rigorous answerability to evidence (archives, sources, data), history loses its claim to be a knowledge practice distinct from fiction or ideology. **It's the primary disciplinary constraint.**
      *   **Invariance is a desirable but secondary *aspiration*.** Robust consensus *can* signal deep engagement with evidence and sound methodology. However, aiming *directly* for invariance risks conformity, stifling new interpretations, and the uncritical acceptance of established narratives (as your secondary-source example shows). True progress often comes from challenging invariance through renewed *fidelity*.

  3.  **White's Impact on Each Ideal:**
      *   **On Fidelity:** White decisively shows pure, unmediated *fidelity* is **impossible**. The historian doesn't just "find" the story in the sources; narrative form (emplotment, argument) is *imposed* to create coherence and meaning. Sources constrain but don't dictate the narrative.
      *   **On Invariance:** White doesn't make invariance *impossible*, but **shows why it's always contingent and partial**. Different narrative choices (tragic vs. comic emplotment of the French Revolution) produce fundamentally different meanings from the same events. Therefore, *perfect* invariance across all possible perspectives/narratives is unattainable. However, *relative* invariance within a shared paradigm or school of thought is possible (e.g., all Annales historians prioritizing long-term structures might converge).

  4.  **White's Critique and the Survival of Ideals:**
      *   White **fatally undermines the Rankean ideal of pure fidelity** by exposing the unavoidable constructive act of narration.
      *   He **complicates but does not eliminate invariance as a pragmatic ideal**. Once fidelity's naivete is accepted, invariance transforms. It's no longer about mirroring a single past, but about achieving *shared, evidence-constrained interpretations* within a community of practice. It becomes less about "the Truth" and more about **intersubjective agreement reached through rigorous methods and critical debate** – a "best account we have now" based on fidelity *to the extent possible* and shared standards of argument. White shows *why* invariance is hard, not that striving for robust, well-evidenced consensus is pointless.

  **In essence:** Your distinction clarifies that "objectivity" in history is a complex, multi-faceted goal. *Fidelity* (evidence-responsiveness) is the non-negotiable core discipline, though its purity is unattainable. *Invariance* (consensus/robustness) is a valuable emergent property signaling sound scholarship within a paradigm, but aiming solely for it risks stagnation. White forces a reconception of *both* ideals: fidelity becomes bound by narrative mediation, and invariance becomes a contingent, communal achievement based on disciplined fidelity and shared critical standards, not a reflection of a single, unmediated past. Neither ideal "wins," but together they define the contested ground of historical knowledge.
