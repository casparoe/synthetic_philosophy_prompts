prompt: |-
  I'm TAing a 200-level epistemology section and next week is Moore's proof of an external world. I don't need you to explain the proof to me — I need the plan for how to actually give it, fifty minutes, twelve students who've done the reading and two who havent.

  Two things I want built into the plan, because they're where I think the real action is. First, I want to run the proof as a recipe rather than a curiosity: state something you're as sure of as anything, point at the evidence thats literally right there, note that the premise entails the anti-skeptical conclusion, done. Then ask what, if anything, stops a guy who's dead certain the earth is flat from running that exact recipe with a globe on the desk. I want the section to end up there. Second, I want to take seriously the reading that this isn't really an arguement at all so much as an announcement that the skeptic has to go first — that absent some actual reason for doubt, the knowledge you've already got just stands. I'm not sure that reading is right, but it's the one I want the plan organized around. And along the way I'd like to poke at whether "proof" is doing any work here, since Moore seems happy to call it a proof as long as the argument is valid and the premises are known, which makes proofs pretty cheap.

  So lay it out for me as:

  The order — the sequence the pieces have to come in for that ending to land, and what depends on what (roughly 300 words, bullets are fine).
  The carrying example — the one case that should do the heavy lifting, and why that one instead of just reusing Moore's hands; if the hands really are the right call, say why (about 150 words).
  Misconceptions and where I kill them — the wrong readings they'll walk in with or cook up in the room, in the order they'll surface, and the exact point in my sequence where each one gets headed off. I'm already expecting "he's just begging the question" and "so knowledge is just whatever you feel really sure about" (about 250 words).
  The exit question — one question I can ask at the end that tells me whether they got it rather than whether they can recite the standard verdicts (50 words).
  What I'm skipping — what I should refuse to get into at this level, and say so out loud (about 100 words).

  American English please, and keep it plain.
reasoning: |-
  Okay, the user is a TA preparing for a 50-minute epistemology section on Moore's proof of an external world. They need a lesson plan focused on two key aspects: treating the proof as a practical "recipe" anyone can use (even flat-earthers) and exploring the reading that it's more of a challenge to skeptics than a traditional proof. 

  First, I'll structure the session to build toward their desired ending—questioning why Moore's method doesn't work for a flat-earther pointing at a globe. The sequence needs to: 
  - Start by bluntly stating Moore's "recipe" to show how mechanically simple it is. 
  - Then immediately confront the flat-earth analogy to expose the tension. 
  - Only after that unease is felt, pivot to the "this isn't really proof" interpretation as a resolution. 

  For the carrying example, Moore's hands are actually perfect—not because they're special, but because their utter banality highlights how little the "proof" relies on philosophical heavy lifting. Switching examples might dilute that. 

  Major misconceptions will surface in predictable order: 
  1. "He's begging the question!" (will pop up immediately after stating the recipe). Shut this down by agreeing it looks circular but insisting that's the point—it's meant to expose what skepticism demands. 
  2. "So knowledge is just strong feelings?" (likely when discussing the flat-earth case). Crush this by distinguishing psychological certainty from Moore's claim about ordinary evidence. 

  The exit question should force them to apply the "recipe" logic asymmetrically: "Could a brain in a vat use Moore's method correctly?" If they get it, they'll see the vat couldn't even coherently point at hands. 

  I'll explicitly skip: 
  - Historical context about Moore vs Russell 
  - Technical externalism/internalism debates 
  - Whether "proof" is the right word (per the user's note) 
  - Deep dives into skepticism's arguments 

  This keeps focus on the user's two priorities: the recipe's disturbing simplicity and its function as a gauntlet-throw.
answer: |-
  ### Lesson Plan: Moore's Proof as Skeptical Gauntlet  

  **The Order**  
  1. **Hook (5 min):** Start cold—no recap. *"Grab something you know right now. Seriously, point at it. Why does Moore think that's a proof the external world exists?"*  
  2. **State the Recipe (10 min):**  
     - Premise 1: "Here is one hand" (point at your own).  
     - Premise 2: "If there’s a hand here, an external object exists."  
     - Conclusion: "Therefore, an external world exists."  
     - Emphasize: *"Moore says if you know the premises (and you do), valid logic = proof. Done."*  
  3. **Flat-Earth Test (15 min):** *"A flat-earther points at a globe: 'Here is a sphere. If this is a sphere, Earth isn’t flat. Proof Earth is round.' What breaks? Is it the same 'recipe'? If not, why not?"* Let them clash.  
  4. **The Real Move (12 min):** Pivot: *"Moore isn’t arguing—he’s refusing to play skeptic’s game. Until they give actual doubt, your everyday knowledge stands. The ‘proof’ is a validity flex to force skeptics to engage your evidence."*  
  5. **"Proof" Cheap? (5 min):** *"If valid + known premises = proof, is this too easy? Does ‘proof’ mean anything special here?"*  
  6. **Exit Question + Wrap (3 min)**  

  **The Carrying Example**  
  Stick with **Moore’s hands**. It’s sterile and universal—no baggage (unlike globes/flat-earth debates). The banality is the point: the skeptic must attack *your* mundane certainty, not exotic cases. Hands force focus on the epistemic move, not empirical disputes. (Flat-earth test later exposes when the recipe *feels* wrong, sharpening Moore’s stance.)  

  **Misconceptions & Kill Shots**  
  - **"He’s begging the question!" (Will surface at Step 2)**  
    *Kill:* "Yes, *if* you’re a skeptic. But Moore says you’re not obliged to doubt your senses without reason. The ‘proof’ outsources burden of proof: unless skeptics show your eyes deceive you *now*, the premise holds."  
  - **"So knowledge = feeling sure?" (Likely during Flat-Earth Test)**  
    *Kill:* "No—Moore trusts ordinary evidence (e.g., sensory access to hands), not feelings. The flat-earther ignores counter-evidence (satellites, physics); Moore’s not ignoring anything. Certainty ≠ caprice."  
  - **"But how do we *know* the hand exists?" (Step 2/4)**  
    *Kill:* "Moore’s reply: 'What’s wrong with seeing it?' Press them: what *specific* doubt applies *here*? If none, knowledge stands."  
  - **"This proves nothing!" (Step 5)**  
    *Kill:* "Exactly. That’s the reading: it’s not 'proof' in the knock-down sense. It’s a validity demo to show skeptics must engage your ordinary grounds."  

  **Exit Question**  
  *"Could a brain in a vat correctly use Moore’s recipe? If not, is it because they lack hands... or because their 'here is a hand' claim fails a step?"* (Tests grasp of evidence vs. logic structure.)  

  **What I’m Skipping**  
  - **Historical context** (Moore vs. Kant/Idealists). State upfront: *"We’re analyzing Moore’s move, not his enemies."*  
  - **Deep dives into skepticism** (e.g., Descartes). *"We take skepticism as given—Moore does too."*  
  - **Externalism/Internalism**. *"We won’t resolve if justification requires external facts—focus on Moore’s challenge."*  
  - **"Is it *really* proof?"** debates. *"Grant Moore his definition—does his strategy work?"*  

  ---  
  **Why this flows:** The flat-earth test *after* stating the recipe creates productive friction. Ending on Moore’s "you go first" reframe makes the "proof" label feel deliberately provocative—setting up your exit question.
