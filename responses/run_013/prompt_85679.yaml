prompt: |-
  I teach a third-year undergraduate seminar in philosophy of the social sciences — eighteen students, one ninety-minute session — and the week on social kinds keeps falling flat. The students can tell me that race and gender are socially constructed, and they can tell me that generational labels like Boomer and Gen Z are marketing categories rather than natural divisions, but neither performance involves any thinking: they arrive knowing which answer I want and they hand it over. What I want instead is a session in which they run into the difficulty themselves, and I've come to think the difficulty is best located in a piece of arithmetic bookkeeping that they can be walked into without knowing any statistics. Here is the thing I want them to collide with. A claim about a generation is a claim about people born in the same window of years, but in any single survey we observe age, not birth year; across several surveys we observe age and calendar year, and birth year is nothing over and above the difference between them — so the three quantities are not three independent observations but one identity, and a gap between Gen Z and Millennials on some attitude can be redescribed, with no change whatever in the data, as a gap between the young and the old (an aging effect) or as a gap between the 2010s and the 1990s (a period effect). A cohort story, an aging story, and a period story can each fit the same table exactly. The usual fix is to assume something extra — that aging effects are smooth and gradual, that some particular period left no trace, that the oldest cohort is untouched — and it is the assumption, not the data, that does the work. That is what I want the room to discover: not that generational talk is false, but that it is underdetermined, and that the loud disagreements between people who make it are usually disagreements about hidden assumptions rather than about facts.

  Design me the activity. It has to be runnable in ninety minutes with eighteen students in a normal seminar room, with no lecture beforehand: the idea must arrive through the structure of the materials and the incentives, not through anything I say until the debrief, and nobody should hear the words identification problem or age-period-cohort until then. All teams must work from the same table, and I want the disagreement to be manufactured rather than merely hoped for: if the only thing separating two teams' conclusions is an auxiliary assumption, then arrange for different teams to be quietly handed different assumptions and to believe, for as long as possible, that the table is doing the work rather than the card. Materials should be printable and self-contained, and I want the actual content, not a description of it — the numbers in the table, the exact wording on any cards or instruction sheets, the token values, the wording of the prompts I read aloud. Use invented figures and label them as illustrative; I do not want fabricated real survey results, and I do not need citations, references, or further reading anywhere in your answer. Keep the stakes in points or tokens; nothing should cost anyone money. Give me the timeline in minutes, the roles if there are any, who says what and when, the payoff scheme, and then the debrief, with an explicit mapping from particular moments in the activity to the particular philosophical claims I should be drawing out: the difference between a category that is merely useful for prediction and one that is a kind; what kindhood would have to consist in here — genuine clustering in the data, a shared causal mechanism that produces and maintains the cluster (a formative historical event, something like what philosophers of science call a homeostatic property cluster), projectibility to new cases and new populations; and the possibility that generation is a real entity in some thinner, historical sense even if the demographic label is arbitrary. A colleague of mine in the sociology department thinks the whole complaint is overblown, since some cohort effects are real and measurable; I want to be able to give that case its due in the debrief without pretending my activity has shown it false.

  Tell me what will predictably go wrong the first time I run it, including the two failures I most fear: that the group collapses into so it is all made up and stops reasoning, and that two or three sharp students spot the hidden assumptions and announce the trick before the others have felt the pull of the table. Say how to handle each, and be frank about the feature of the question the activity cannot reproduce and that I will have to supply myself. Finally, tell me where your design is most likely to fail, and what would change your mind about whether it works at all — what you would need to see in a pilot run to be convinced that the participants' insight came from the structure of the activity rather than from confusion about the numbers or from my own nudging.
reasoning: |-
  We are designing a 90-minute seminar activity for 18 students on the underdetermination of generational categories (like Gen Z, Millennials) in social science. The goal is for students to discover that the same data can support multiple interpretations (cohort, aging, period) depending on hidden assumptions. The activity must avoid technical terms until the debrief and must manufacture disagreement by giving different teams different auxiliary assumptions.

  Key elements:
  - One table of data (fictitious, illustrative) that shows attitudes by age and survey year.
  - Teams are given different hidden assumptions (on cards) that lead them to different conclusions.
  - The activity should run without a lecture, and the insight should emerge from the structure.

  Structure of the activity:

  1. Introduction (5 minutes)
     - Set the stage without revealing the learning goal.
     - Explain the scenario: We are social scientists studying attitudes about technology use. We have survey data from two years (say 2010 and 2020) and three age groups (young, middle, old). We are going to look at how attitudes change over time and by age.

  2. Data Distribution and Team Formation (5 minutes)
     - Divide the class into 3 teams of 6 students each (or adjust to 3 teams of 6, or 6 teams of 3 if room layout requires, but 3 teams for 3 interpretations is natural).
     - Distribute the same data table to all teams.

  3. Team Work (30 minutes)
     - Each team is given a secret instruction card that provides an auxiliary assumption. The three assumptions are:
          Team A (Cohort): "Assume that a major technological event (like the introduction of smartphones) during adolescence permanently shapes attitudes. Therefore, people who were adolescents during that event will have similar attitudes throughout their lives."
          Team B (Aging): "Assume that attitudes change gradually with age, regardless of when you were born. Therefore, people of the same age will have similar attitudes, even in different years."
          Team C (Period): "Assume that current events and the contemporary environment affect everyone, regardless of age. Therefore, attitudes in the same year are similar for all age groups, but change when the year changes."
     - Each team is asked to analyze the data and prepare a one-minute presentation on what the data shows about the attitudes of different generations. They are to define the generations (e.g., if they see a cohort effect, they might label a generation by the years of birth that experienced the event) and explain the pattern.

  4. Team Presentations (15 minutes, 3 minutes per team)
     - Each team presents their findings. They should state their interpretation and how they defined the generations.

  5. Reveal and Discuss (15 minutes)
     - Ask the class: "Did the teams come to the same conclusion? Why or why not?"
     - Reveal that each team had a different assumption card. Discuss how the same data led to different conclusions because of the different assumptions.

  6. Debrief (20 minutes)
     - Now the instructor can explain the age-period-cohort problem and the underdetermination.
     - Map the activity to philosophical concepts: 
          - The data alone does not determine which story is correct (underdetermination).
          - The generational categories (like Millennial) are not directly observed but inferred by assuming a cohort effect.
          - The disagreement between teams was not about the data but about the hidden assumptions (the cards).
          - What would make a generational kind real? (e.g., if there were a shared causal mechanism, like a formative event that creates a cluster of properties that are projectible).
          - Acknowledge that some cohort effects might be real (as per the sociologist colleague) but that the data alone without assumptions cannot distinguish.

  Data Table Design:
  - We need a table that can be interpreted in multiple ways. Let's have two survey years (2010 and 2020) and three age groups (20-29, 30-39, 40-49). Then birth years can be inferred (e.g., in 2010, 20-29 were born 1981-1990, 30-39 born 1971-1980, 40-49 born 1961-1970; in 2020, 20-29 are born 1991-2000, 30-39 born 1981-1990, 40-49 born 1971-1980).
  - We measure an attitude score (say, comfort with new technology on a scale of 1-10). The table must be constructed so that:
     - A cohort interpretation: Those born in a certain period (e.g., 1981-1990) have the same score regardless of age or year? But note: we see each cohort at two different ages and in two different periods. We can set the scores so that each cohort has a constant score? But then we wouldn't see aging or period effects. Instead, we want the data to be consistent with multiple stories.

  We can set up the data so that:
  - For a fixed cohort, the score changes with age (aging) and period? But we want each interpretation to fit. So we need to design the numbers such that:
     - If you assume no aging, then the period effect is clear.
     - If you assume no period effect, then aging is clear.
     - If you assume no cohort effect? Actually, the cohort effect is the one we are testing.

  Standard APC (age-period-cohort) problem: We have a linear dependency (cohort = period - age). So we cannot estimate all three without constraints.

  Let me create a table with two years (2010, 2020) and three age groups (20-29, 30-39, 40-49). We'll have attitude scores.

  We want:
  - If we look at the same age group in two periods, we see a change (period effect?).
  - If we look at the same cohort in two periods (so at two different ages), we see a change (aging effect?).
  - And if we look at the same period in two age groups, we see a difference (aging or cohort?).

  But we need the data to be consistent with each team's assumption.

  Let me assign arbitrary scores that can be explained by each assumption.

  Example:

  Table: Technology Comfort Score (1-10)

  | Age Group | Year 2010 | Year 2020 |
  |-----------|----------|----------|
  | 20-29    | 8.0      | 9.0      |
  | 30-39    | 7.0      | 8.0      |
  | 40-49    | 6.0      | 7.0      |

  Now, let's see:

  Cohort story (Team A): 
  - Cohort born 1981-1990 (age 20-29 in 2010, 30-39 in 2020): scores 8.0 and 8.0? But in the table, at 30-39 in 2020 they are 8.0? Wait, we have 8.0 in 2010 (20-29) and 8.0 in 2020 (30-39) for the same cohort? That would be consistent if we say the cohort has a constant score. But then we have 7.0 for 30-39 in 2010 (which is cohort 1971-1980) and 7.0 in 2020 for 40-49? That would be 7.0 and 7.0. And 6.0 for 40-49 in 2010 (cohort 1961-1970) and 6.0 for 40-49 in 2020? But in 2020 the 40-49 are cohort 1971-1980? So we have:

  Cohort 1961-1970: in 2010 (age 40-49) = 6.0; in 2020 (age 50-59) - not in the table? So we don't have data for the same cohort across time? We only have each cohort at one point? We need to have each cohort appearing at two time points? We have:

  - Cohort 1981-1990: 2010 (20-29): 8.0; 2020 (30-39): 8.0 -> so constant? Then that supports cohort effect? But we want to be able to see aging and period too.

  Alternatively, let me set the numbers so that:

  - For a fixed cohort, the score increases by 1.0 every 10 years (aging effect) OR
  - For a fixed age, the score increases by 1.0 every 10 years (period effect) OR
  - For a fixed period, the score decreases by 1.0 for every 10 years of age (aging effect) and also for a fixed cohort, the score increases by 1.0 every 10 years? 

  Actually, we can set the scores arbitrarily as long as they are consistent with the identity: the score in a cell can be written as a function of age and period, and then cohort is period minus age? But we want to be able to tell different stories.

  I propose:

  Let the score = (period effect) + (age effect) + (cohort effect). But because of linear dependency, we can only identify two of the three. So we set the score to be a linear function of, say, period and age, and then cohort is determined. But we want each team to be able to interpret it with their assumption.

  Alternative: make the score the same for each cohort? That would be too obvious for cohort. Instead, let me make the score change in a way that each team can explain with their assumption.

  We can set:

  | Age Group | Year 2010 | Year 2020 |
  |-----------|----------|----------|
  | 20-29    | 8.0      | 9.0      |
  | 30-39    | 7.0      | 8.0      |
  | 40-49    | 6.0      | 7.0      |

  Now:

  - Team A (Cohort): They are told to look for a cohort effect. They might notice that the cohort born 1981-1990 (20-29 in 2010, 30-39 in 2020) has scores 8.0 and 8.0? Wait, no: in 2020, the 30-39 group is 8.0? But in 2010 the 30-39 group was 7.0. So the cohort that was 20-29 in 2010 (8.0) becomes 30-39 in 2020 (8.0). So if we assume that the cohort effect is the only effect, then this cohort has 8.0 at both times? But then the cohort born 1971-1980 (30-39 in 2010: 7.0, 40-49 in 2020: 7.0) has 7.0 at both? And cohort 1961-1970 (40-49 in 2010: 6.0, and in 2020 they are 50-59, not in table) so we don't have two points? So we have two cohorts with two points: both constant? Then Team A can say: the cohort determines the score, and it doesn't change with age or time.

  - Team B (Aging): They assume attitudes change gradually with age. They see that as age increases by 10 years, the score decreases by 1? But wait: in 2010, from 20-29 (8.0) to 30-39 (7.0) to 40-49 (6.0) -> so each 10 years, score drops by 1. Then in 2020: 20-29 (9.0) to 30-39 (8.0) to 40-49 (7.0) -> same drop. So they can say: regardless of the year, when you are 20-29 you are high, and then you become less comfortable as you age.

  - Team C (Period): They assume that the current environment affects everyone. In 2010, all groups are lower than in 2020. In 2010, the average might be 7.0, and in 2020 it is 8.0? And within a year, there is variation by age, but that might be due to aging? But their assumption is that the period effect is the same for all? So they might say: in 2010, the overall environment was less tech-friendly, so everyone had lower scores (by about 1.0) than in 2020. The variation by age is due to aging? But they are told to assume that period affects everyone regardless of age? They might just note the overall shift and say that the period effect is +1 in 2020 compared to 2010.

  But note: Team A and Team B both have a story that fits. Team C also. The data is consistent with all three.

  However, in this table, the cohort effect story requires that the cohort effect is constant over time (same at age 20-29 and 30-39) and the aging effect requires that the slope is the same in both periods. And the period effect requires that the shift is uniform.

  So the hidden assumptions are what make each story work.

  The table:

  | Age Group | 2010 | 2020 |
  |-----------|------|------|
  | 20-29    | 8.0  | 9.0  |
  | 30-39    | 7.0  | 8.0  |
  | 40-49    | 6.0  | 7.0  |

  We can also add a third year? But that might complicate. Two years and three age groups is minimal and sufficient.

  Now, the activity:

  Materials:

  1. Data Table (one per team, same for all):

     **Technology Comfort Score by Age Group and Survey Year**

     *Illustrative data from a national survey*

     | Age Group | Year: 2010 | Year: 2020 |
     |-----------|------------|------------|
     | 20-29    | 8.0        | 9.0        |
     | 30-39    | 7.0        | 8.0        |
     | 40-49    | 6.0        | 7.0        |

  2. Instruction Cards (one per team, secret):

     **Team A (Cohort Effect)**
     Your assumption: A major technological event (like the introduction of smartphones) during adolescence permanently shapes attitudes. Therefore, people who were adolescents during that event will have similar attitudes throughout their lives.

     **Team B (Aging Effect)**
     Your assumption: Attitudes change gradually with age, regardless of when you were born. Therefore, people of the same age will have similar attitudes, even in different years.

     **Team C (Period Effect)**
     Your assumption: Current events and the contemporary environment affect everyone, regardless of age. Therefore, attitudes in the same year are similar for all age groups, but change when the year changes.

  3. Presentation Prompt (same for all teams, handed out with the data and their secret card):

     "Your team's task: Analyze the data and prepare a one-minute presentation. In your presentation, you must:
     - Describe what the data shows about how attitudes toward technology change over time and with age.
     - Define one or more 'generations' based on the pattern you observe (e.g., if you see a group with a shared experience, name them and give their birth years).
     - Explain the main reason for the differences you see, using the data to support your claims."

  4. Timeline:

     - 0-5 min: Introduction by instructor.
          Script: "Today we're going to be social scientists. We have survey data on technology comfort from 2010 and 2020, broken down by age groups. Your task, in teams, is to analyze this data and tell a story about how these attitudes are formed. In particular, we are interested in whether we can see generational differences. Each team will present their findings. Let's form three teams."

     - 5-10 min: Distribute materials. Each team gets:
          - One copy of the data table.
          - One secret assumption card (only for their team, not to be shared).
          - One presentation prompt.

     - 10-40 min: Team work (30 minutes). Students discuss and prepare their presentation. The instructor circulates but does not guide, only answers clarifying questions about the instructions.

     - 40-55 min: Team presentations (3 minutes per team, 9 minutes total, but allow 15 for setup and questions). Each team presents.

     - 55-70 min: Reveal and Discuss (15 minutes).
          After presentations, the instructor asks: 
            "We have three different stories. Why do you think that happened? What might be going on?"
          Let students discuss. Then reveal: "Each team was operating under a different assumption. Let's share the assumptions." Have each team read their assumption card.
          Then: "So the same data can be explained by three different models? How is that possible? What does that tell us about generational categories?"

     - 70-90 min: Debrief (20 minutes). Instructor-led discussion connecting to philosophy.

  5. Payoff: 
     - The activity is not graded, but to incentivize engagement, the instructor can award tokens (e.g., candy or extra credit tokens) for:
          - Each team that presents (participation token).
          - For insightful questions or comments during the discussion.

  6. Debrief Outline:

     - The underdetermination problem: The same data can be explained by cohort, aging, or period effects because of the mathematical identity (cohort = period - age). The data alone does not choose between them.

     - The role of auxiliary assumptions: The teams' conclusions depended on the card they were given. In real research, these assumptions are often hidden or taken for granted.

     - Philosophical points:
          - Social kinds (like generations) are not directly observed but are inferred. They are constructs that may be useful for prediction but are underdetermined by the data.
          - What would make a generational kind real? 
              * Genuine clustering: If the data showed a pattern that could not be explained by aging or period alone? (But note: in our activity, the data was equally explained by all.)
              * A shared causal mechanism (e.g., a historical event that causes a homeostatic property cluster) that produces and maintains the cluster.
              * Projectibility: If the generational label predicts future attitudes in new contexts, that would support its reality.
          - Even if the demographic label is arbitrary (e.g., the exact years for Millennials), there might be a real historical entity (the cohort that experienced a particular event) that has a shared experience.

     - Addressing the sociologist: Some cohort effects are real and measurable, but they are measured by making assumptions (like holding period constant by studying one year, or holding age constant by comparing same-age groups in different periods). The activity doesn't show that cohort effects are false, only that without additional assumptions, the data underdetermines the explanation.

  7. Predictable Problems and Solutions:

     a. Problem: The group collapses into "so it is all made up" and stops reasoning.
        Solution: During the activity, if a team says "it's arbitrary," ask them to still construct the best story they can given their assumption. In the debrief, acknowledge that the categories are constructed but that the question is whether they are useful or real in a deeper sense.

     b. Problem: Sharp students spot the hidden assumptions and announce the trick.
        Solution: If during team work a student figures it out, encourage them to play along and help their team build the assigned story. In the reveal, they can share their insight. If during the presentation a student says "it's the assumptions," then the instructor can pivot to: "Exactly! Let's look at the assumptions."

     c. The activity cannot reproduce the complexity of real data (with more time points and age groups) and the statistical methods used. The instructor will have to explain that in real research, we use more data and statistical models to try to break the underdetermination, but it always requires assumptions.

     d. Where the design is most likely to fail: 
          - The data might be too simple, and students might not see how each story fits. 
          - Teams might struggle to define generations (e.g., for period, they might not know how to define a generation). Clarify that a generation can be defined by the period in which they are surveyed (e.g., "the 2020 generation") or by a shared event.

  8. What would convince in a pilot run?
     - We would want to see:
          - Teams genuinely developing different interpretations and being surprised by the others.
          - In the discussion, students expressing confusion about how the same data can support different stories.
          - In the debrief, students being able to articulate that the differences came from the assumptions and not the data.
     - If in a pilot the students are confused by the numbers and cannot tell any story, then the table is too sparse. We might need to add more explanation of how to read the table.

  Alternative: Use a third year? But that might be too complex. We'll stick with two years and three age groups.

  Final Materials:

  Data Table (printable):

  **Technology Comfort Score by Age Group and Survey Year**

  *Illustrative data from a national survey (scores on a scale of 1-10)*

  | Age Group | Year: 2010 | Year: 2020 |
  |-----------|------------|------------|
  | 20-29    | 8.0        | 9.0        |
  | 30-39    | 7.0        | 8.0        |
  | 40-49    | 6.0        | 7.0        |

  Secret Cards (print on different colored cardstock?):

  **Team A: Cohort Effect Assumption**
  A major technological event (like the introduction of smartphones) during adolescence permanently shapes attitudes. Therefore, people who were adolescents during that event will have similar attitudes throughout their lives.

  **Team B: Aging Effect Assumption**
  Attitudes change gradually with age, regardless of when you were born. Therefore, people of the same age will have similar attitudes, even in different years.

  **Team C: Period Effect Assumption**
  Current events and the contemporary environment affect everyone, regardless of age. Therefore, attitudes in the same year are similar for all age groups, but change when the year changes.

  Presentation Prompt (handout to all):

  "Your team's task: Analyze the data and prepare a one-minute presentation. In your presentation, you must:
  - Describe what the data shows about how attitudes toward technology change over time and with age.
  - Define one or more 'generations' based on the pattern you observe (e.g., if you see a group with a shared experience, name them and give their birth years).
  - Explain the main reason for the differences you see, using the data to support your claims."

  Timeline in minutes:

  - 0-5: Introduction
  - 5-10: Distribute materials and form teams
  - 10-40: Team work (30 min)
  - 40-55: Presentations (15 min: 3 min per team, 1 min transition)
  - 55-70: Reveal assumptions and discuss (15 min)
  - 70-90: Debrief (20 min)

  This should fit 90 minutes.

  Note: The birth years for the cohorts:

  - In 2010:
      - 20-29: born ~1981-1990
      - 30-39: born ~1971-1980
      - 40-49: born ~1961-1970

  - In 2020:
      - 20-29: born ~1991-2000
      - 30-39: born ~1981-1990
      - 40-49: born ~1971-1980

  So the cohort 1981-1990 is 20-29 in 2010 and 30-39 in 2020. Cohort 1971-1980 is 30-39 in 2010 and 40-49 in 2020. Cohort 1961-1970 is only in 2010 (40-49) and not in 2020 (where they would be 50-59, not in the table). So we have two cohorts with two data points.

