answer: |-
  Below is a complete, self-contained activity designed for your 90-minute undergraduate seminar on social kinds. It uses a fictional dataset and manufactured disagreement to reveal the underdetermination of generational categories. The activity avoids technical terms (e.g., "age-period-cohort," "identification problem") until the debrief and ensures students discover the core insight through structured collaboration.

  ---

  ### **Activity: "The Generations Puzzle"**
  **Total Time:** 90 minutes  
  **Students:** 18 (divided into 3 teams of 6)  
  **Materials:** Printed packets for each team (details below), whiteboard/flip chart, tokens (e.g., poker chips or stickers) for incentives.  
  **Goal:** Students confront how the same data can support cohort, aging, or period effects, revealing that generational claims rely on hidden assumptions.

  ---

  #### **Materials Packet (Print one per team)**
  Each packet contains:
  - **Data Table (identical for all teams):**  
    *Attitudes Toward Social Media (Scale: 1–10, where 10 = most positive)*  
    *Illustrative survey data from fictional "National Tech Survey"*

    | Age Group | Survey: 2010 | Survey: 2020 | Survey: 2030 |
    |-----------|--------------|--------------|--------------|
    | 20–29    | 8.0          | 7.0          | 6.0          |
    | 30–39    | 7.0          | 6.0          | 5.0          |
    | 40–49    | 6.0          | 5.0          | 4.0          |

  - **Secret Assumption Card (different per team):**  
    *Printed on colored cardstock (e.g., Team 1: Blue, Team 2: Green, Team 3: Yellow). Students are told not to share their card with others.*

    - **Team 1 (Cohort Effect):**  
      *"Assume people’s attitudes are fixed by age 20. Once formed, attitudes do not change as people age or as time passes. Focus on birth years (e.g., someone born in 1981–1990 is always in the same cohort)."*  
    - **Team 2 (Aging Effect):**  
      *"Assume attitudes change only due to aging. People gain wisdom as they age, so attitudes shift gradually every 10 years. Ignore calendar years or historical events."*  
    - **Team 3 (Period Effect):**  
      *"Assume attitudes change only due to the time period. Big events (e.g., tech scandals) affect everyone equally, regardless of age. Focus on survey years, not birth years."*  

  - **Team Instructions (identical for all):**  
    *"Your team represents social scientists studying generations. Analyze the data to answer:*  
    - *What does the data say about generational differences? Define a 'generation' (e.g., 'Boomers' or 'Gen Z') by giving its birth years or age range.*  
    - *Explain why these differences exist. What is the main cause?*  
    - *Your findings must support ONE key story: Are generations shaped by shared early experiences (cohort), aging, or current events (period)?*  
    *Prepare a 3-minute presentation. Use the whiteboard to sketch your argument. Earn tokens for clarity, use of data, and teamwork."*

  - **Presentation Prompt (for instructor to read aloud):**  
    *"Your team must convince the class that your story—cohort, aging, or period—best explains generational attitudes. Use the data to define a generation and show why your cause matters most."*

  ---

  ### **Timeline & Instructions**
  **Role:** Instructor as facilitator. Do not explain concepts; only give instructions, manage time, and award tokens.  
  **Tokens:** Award 1–3 tokens per team for presentations (based on peer votes) and 1 token per student for contributions in Q&A. Tokens can be redeemed for trivial rewards (e.g., candy, extra participation points).

  #### **Phase 1: Setup (5 min)**
  - **0:00–0:05:** Introduce the activity.  
    *Script: "Today, you’re social scientists investigating attitudes toward social media. Each team has the same survey data from 2010, 2020, and 2030. Your job is to analyze how generations differ and why. Define a generation based on the data and present your story. You’ll earn tokens for clear, data-backed arguments. Teams, assemble!"*  
    - Form 3 teams of 6 students (pre-assign if needed to avoid delay).  
    - Distribute packets. Emphasize: "Do not share your Secret Assumption Card—it’s your team’s private guide."

  #### **Phase 2: Team Analysis (30 min)**
  - **0:05–0:35:** Teams work.  
    - Circulate, but only answer logistical questions (e.g., "How do we read this table?"). Redirect conceptual questions back to the team (e.g., "What does your assumption card suggest?").  
    - **Incentives:** Announce: "Teams earn tokens if all members contribute, and if your presentation uses specific numbers from the table."  
    - **Manufactured Disagreement:** Each team’s Secret Assumption Card primes them to:  
      - *Team 1 (Cohort):* Focus on birth years (e.g., "Gen Alpha" = born 2001–2010). They’ll note that 20–29 in 2010 (born ~1981–1990) score 8.0, and the same cohort at 30–39 in 2020 scores 7.0—but their card says attitudes don’t change, so they might ignore the drop or redefine cohorts to force constancy.  
      - *Team 2 (Aging):* Focus on age groups (e.g., "Youth" = 20–29). They’ll see 20–29 scores fall from 8.0 (2010) to 6.0 (2030), but their card attributes this to aging, so they’ll argue attitudes worsen as people "grow wiser."  
      - *Team 3 (Period):* Focus on survey years (e.g., "2020 Generation"). They’ll note scores drop each decade (e.g., 20–29: 8.0 → 7.0 → 6.0) and argue big events (e.g., "2030 tech crash") caused this, affecting all ages equally.  
    - **Predictable Struggles:**  
      - Teams may question the data (e.g., "Why do scores decrease?"). Redirect: "Stick to your assumption."  
      - Sharp students may spot the arbitrariness early. Mitigate by emphasizing: "Your goal is to build the best case with your card—compete for tokens!"

  #### **Phase 3: Presentations (15 min)**
  - **0:35–0:50:** Teams present (3 min each).  
    - Use a timer. After each, peers vote on "clarity" and "use of data" (e.g., raise hands). Award tokens (1–3 per team).  
    - **Expected Arguments:**  
      - *Team 1 (Cohort):* "Gen Z (born 1981–1990) scored 8.0—higher than Millennials (born 1971–1980). Why? Shared early tech optimism!" (They may fudge the 2020 data for this cohort).  
      - *Team 2 (Aging):* "Youth (20–29) start positive (8.0), but age brings disillusionment. At 40–49, scores drop to 4.0—aging explains everything!"  
      - *Team 3 (Period):* "The 2010–2030 decline (e.g., 20–29: 8.0 → 6.0) shows societal distrust. Everyone in 2030 is pessimistic, regardless of age!"  
    - **Manufactured Conflict:** Teams will clash. Team 1 dismisses aging; Team 2 dismisses period effects. Highlight this: "Team 2, why is Team 1 wrong?"

  #### **Phase 4: Reveal and Discuss (15 min)**
  - **0:50–1:05:** Spark debate, then reveal assumptions.  
    - *Instructor script:* "We heard three stories. Which is right? Discuss in pairs for 2 minutes."  
    - Let students debate. They’ll note contradictions but won’t resolve them.  
    - Reveal: "Each team had a hidden assumption. Team 1, read yours... Team 2... Team 3. How did this affect your conclusions?"  
    - Guide discussion: "Can all three stories coexist? Why or why not? Where did the ‘generation’ labels come from—data or assumptions?"

  #### **Phase 5: Debrief (20 min)**
  - **1:05–1:25:** Lecture-free debrief. Use Q&A to draw out philosophy.  
    - **Map Activity to Philosophy:**  
      | **Activity Moment** | **Philosophical Claim** | **Instructor Prompt** |
      |---------------------|-------------------------|------------------------|
      | Teams using the same data for different stories | Underdetermination: Data alone doesn’t specify generational kinds. | "Why did one table produce three ‘generations’? What does this say about social categories?" |  
      | Secret Assumption Cards | Auxiliary assumptions do the work, not data. Hidden assumptions drive real-world disagreements. | "In the news, people fight about ‘Boomers vs. Gen Z.’ Are they fighting about data or assumptions?" |  
      | Defining "generations" (birth years, age, period) | Category utility vs. kindhood: Useful for prediction ≠ real kind. | "When Team 1 called ‘Gen Z’ a generation, was it a real kind or just a useful label? What would make it real?" |  
      | — | Kindhood requires: (1) Clustering in data, (2) Causal mechanism (e.g., HPC), (3) Projectibility. | "If generations were real kinds, what evidence would we need? (e.g., a formative event that causes lasting traits, predictable future attitudes)." |  
      | — | Thin historical reality: Even if labels are arbitrary, shared experiences may exist. | "Could ‘Gen Z’ be real in a historical sense (e.g., living through a pandemic) even if the birth years are fuzzy?" |  
      | Addressing the sociologist’s view | Some cohort effects are measurable but still rely on assumptions. | "Your sociology colleague says cohort effects are real. Could they be right? How would we test it without circularity?" (Answer: We need controlled assumptions, e.g., holding period fixed). |  

    - **Conclude:** "Generational kinds aren’t false—they’re underdetermined. Disagreements often reflect unmade assumptions, not data."

  ---

  ### **Predictable Problems & Solutions**
  1. **"It’s all made up; stop reasoning":**  
     - *Likelihood:* High if students disengage.  
     - *Solution:* Incentivize with tokens and competitive framing ("Which team has the most convincing story?"). If a team resists, say: "Build the best case you can with your card—tokens for effort!" In debrief, validate: "Yes, categories are constructed—but why do we use them? What makes some feel real?"  

  2. **Sharp students spot the trick early:**  
     - *Likelihood:* Moderate (2–3 students may see it in Team Work).  
     - *Solution:* If they announce it, say: "Great! Now help your team argue for your assumption to earn tokens." Use their insight in Phase 4: "[Name], you sensed hidden assumptions—how did that affect your analysis?" This rewards them without spoiling the discovery for others.  

  3. **Data confusion:**  
     - *Likelihood:* Low (table is simple), but some may misread rows/columns.  
     - *Solution:* Include a key in packets (e.g., "Rows = age; Columns = year"). Clarify during setup: "Scores are averages; e.g., 20–29-year-olds averaged 8.0 in 2010."  

  4. **Team disagreements fizzle:**  
     - *Likelihood:* Low, due to manufactured assumptions. If presentations are too similar, force conflict: "Team 2, Team 1 says aging doesn’t matter. How do you respond?"  

  ---

  ### **Where the Design Might Fail & Pilot Test Criteria**
  - **Likely Failure Point:** Teams struggle to define "generations" (e.g., Team 3 may conflate period with cohort). Mitigate by modeling in instructions (e.g., "e.g., ‘Gen Z’ = born 1997–2012").  
  - **Unreproducible Element:** The activity simplifies real-world complexity (e.g., no statistical controls). *You must explicitly note this in debrief:* "In real research, we use more data and methods, but assumptions are always needed."  
  - **Pilot Test Criteria:** To confirm the activity works, look for:  
    - **Discovery of underdetermination:** Students express surprise/frustration when assumptions are revealed (e.g., "Wait, we all had different cards? That’s cheating!").  
    - **Organic insight:** In Phase 4, students say things like, "The data didn’t prove anything—the card did the work," without prompting.  
    - **No nudging:** If students reach the core insight (e.g., "Generations are assumptions, not data") before the debrief without instructor hints, the structure succeeds.  
    - **Confusion check:** If >25% of students misinterpret the table (e.g., think scores are individual, not averages), simplify data (e.g., round numbers to whole integers).

  ---

  This design forces students into the "difficulty" through structured disagreement, using a minimal dataset to expose how generational labels rely on auxiliary assumptions. The tokens, secret cards, and competitive framing keep students engaged while avoiding lecture. In the debrief, you explicitly tie their frustration to the philosophy of social kinds, making the abstract concrete.
