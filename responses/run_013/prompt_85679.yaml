  For Team C (Period): They see that in 2010, all groups are about 1 point lower than in 2020. They might say: "In 2010, the average score was 7.0, and in 2020 it was 8.0. This shows that the overall environment in 2020 is more tech-friendly. The differences by age are secondary and might be due to other factors, but the period effect is the main story." They might define generations by the era: "The 2010 generation" (everyone in 2010) and "The 2020 generation" (everyone in 2020).

