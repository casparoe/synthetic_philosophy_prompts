  Starting with the most damaging objection: someone might say that Kelly ignores risk aversion entirely. That's a big one because economists really value expected utility with concave functions to model risk. The user needs a solid reply here, but the weakness is that Kelly doesn't accommodate different risk preferences directly. They should mention levering down, but that's a workaround.

