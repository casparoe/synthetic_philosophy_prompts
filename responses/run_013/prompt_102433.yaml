  Fractional Kelly is another target. Traders might point out that using fractional Kelly is standard for robustness. The user's argument is that it's a fudge, but in practice, it's effective. The weakness here is that the user's stance might seem too purist, ignoring practical solutions.

  The one-shot bet objection: if someone says that most bets aren't repeated, that questions the applicability. The reply should reference the decision stream, but the weakness is that some bets are genuinely one-off, which complicates things.

  Also, estimation errors are crucial for traders. They might dismiss Kelly because it's too sensitive to wrong inputs. The user can acknowledge this but argue that it's a separate issue. Still, it's a valid concern in practice.

  Drawdowns are a big deal for traders. Kelly can have high drawdowns, which is unacceptable. The user can suggest blending with drawdown constraints, but that might dilute the Kelly argument.

  Finally, the question they hope nobody asks: whether Kelly is just EU in disguise. That would force them to defend the ergodicity point rigorously, which is tricky. If someone connects the dots, it could collapse their argument.

  I need to make sure the Q&A prep covers these points, ordered by damage potential. The replies should be concise, with weaknesses noted. Also, tag which leg of the argument each objection targets. The hidden question about ergodicity equivalence is critical—if brought up, it could undermine their entire thesis. They need a strong response, maybe emphasizing the ensemble vs. time-average distinction, but the weakness is that for a log utility agent, they behave the same, so the differentiation must be clear for non-log cases.
answer: |-
  Here’s a Q&A prep sheet targeting your audience, ordered by potential damage (high to low). Each objection includes the source (Econ, Stats, Trader), the leg targeted, a concise reply, and the reply’s weakness.

  ---

  ### **Q&A Prep Sheet: Top 8 Objections**  
  **(Ordered by Damage Potential)**

  1.  **Objection (Econ/Stats):**  
      *"Kelly ignores risk aversion. Expected utility with CRRA utility (like power utility) lets us *choose* risk tolerance. Kelly forces log utility, which is arbitrary and too aggressive for most people."*  
      **Target:** Leg 1 (ergodicity) & implicit critique of Kelly’s universality.  
      **Reply (2 min):** "Kelly isn’t about arbitrary risk aversion—it’s about survival and dominance in repeated games. If your wealth is reinvested, *any* strategy not maximizing geometric growth will be bankrupted with probability 1 by a Kelly bettor in the long run. Risk aversion here is a misnomer: it’s about avoiding ruin, not subjective preference. For one-off bets, use EU; for reinvested series, Kelly is the only strategy that guarantees no ruin."  
      **Weakness:** Doesn’t address why an EU-maximizer with *non-log* utility might *prefer* a lower growth rate for less volatility—Kelly assumes you only care about long-term growth, which isn’t universal.

  2.  **Objection (Trader):**  
      *"Kelly is suicide in real markets. Estimation error dominates—if you’re slightly wrong about edge or volatility, full Kelly blows you up. That’s why we use fractional Kelly (e.g., 1/2 or 1/3 position sizing) as a buffer."*  
      **Target:** Leg 2 (fractional Kelly as a fudge) & practical applicability.  
      **Reply (2 min):** "Fractional Kelly isn’t a solution—it’s a heuristic that conflates model uncertainty with risk aversion. If your model is wrong, the correct response is to adjust your *estimate* (e.g., using Bayesian updates or robust optimization), not arbitrarily downsize bets. True model uncertainty should shrink your perceived edge, not your bet size via a ‘risk aversion’ multiplier. Kelly is optimal *if* your model is correct; if not, fix the model."  
      **Weakness:** Acknowledges Kelly’s sensitivity to model error—fractional Kelly *is* a practical (if inelegant) fix for noisy real-world data. Traders will see this as academic purity.

  3.  **Objection (Econ):**  
      *"This is just semantics. Maximizing expected log wealth *is* EU maximization with log utility. You’re repackaging a special case of EU as something new."*  
      **Target:** Entire thesis (especially Leg 1).  
      **Reply (2 min):** "The math overlaps, but the philosophy differs crucially. EU with log utility treats wealth as a static object to be consumed. Kelly treats wealth as capital to be reinvested—it’s about the *process* of compounding. The ergodicity gap shows why: EU maximizes the ensemble average (e.g., the expected wealth of parallel universes), while Kelly maximizes the time-average growth *along a single path*. For non-ergodic processes (like reinvestment), these diverge catastrophically."  
      **Weakness:** If the audience dismisses ergodicity as abstract, this sounds like wordplay. Requires buy-in on the ensemble vs. time-average distinction.

  4.  **Objection (Stats/Trader):**  
      *"Most bets aren’t repeated! If I’m making a one-time M&A decision or retirement portfolio allocation, Kelly is irrelevant. EU handles both single and repeated bets."*  
      **Target:** Leg 3 (one-shot bets as category error).  
      **Reply (2 min):** "A ‘one-shot’ bet is only one-shot if you never reinvest gains elsewhere. In practice, capital is fungible—your ‘single’ bet is part of a stream of portfolio decisions. If you allocate retirement capital to an asset, you’re implicitly assuming reinvestment. Kelly applies to the *scale* of the bet relative to your total reinvested capital stream, not the literal repetition of identical bets."  
      **Weakness:** Some decisions (e.g., buying a house) truly aren’t reinvested—Kelly’s scope isn’t universal.

  5.  **Objection (Trader):**  
      *"Drawdowns matter more than growth. Full Kelly has 50%+ drawdowns—no investor would tolerate that. Maximizing growth ignores path risk."*  
      **Target:** Practical applicability (indirectly Leg 1).  
      **Reply (2 min):** "Drawdowns are a real concern, but constraining them *without sacrificing growth* is the goal. Half-Kelly cuts drawdowns dramatically but only reduces growth by 25%. Still, this is a band-aid—the core issue is model error or overconfidence. If your model is right, Kelly minimizes *time* to a wealth goal, but if you can’t stomach volatility, blend Kelly with a low-risk asset; don’t blame the criterion."  
      **Weakness:** Kelly *does* ignore path-dependent risks (e.g., margin calls). Growth maximization ≠ survival in leveraged contexts.

  6.  **Objection (Econ):**  
      *"EU with log utility already maximizes long-run growth. What’s the difference?"*  
      **Target:** Leg 1 (ergodicity).  
      **Reply (2 min):** "Only for *repeated* bets and *only* under log utility! For any other utility function (e.g., square-root), EU does *not* maximize long-run growth—it may even cause ruin. Kelly is uniquely tied to the geometry of compounding. The difference is hidden in EU’s axioms: it assumes additive utility, while growth is multiplicative."  
      **Weakness:** For log utility, the behaviors *are* identical—this undermines claims of ‘genuine difference’ for that case.

  7.  **Objection (Stats):**  
      *"Kelly assumes known probabilities and i.i.d. bets. In reality, outcomes are correlated, parameters drift, and markets regime-shift. EU is more flexible."*  
      **Target:** Practical applicability.  
      **Reply (2 min):** "Agreed—but this is an input problem, not a criterion flaw. Kelly tells you *how* to bet given beliefs; if beliefs are wrong or non-i.i.d., adapt your model. Dynamic Kelly (e.g., with Bayesian updates) handles this. Conversely, EU with misspecified preferences is equally brittle."  
      **Weakness:** Kelly’s sensitivity to model error is higher than EU with conservative utility functions.

  8.  **Objection (Econ/Trader):**  
      *"Why not maximize median wealth or Sharpe ratio? Those are more robust for finite horizons."*  
      **Target:** Leg 1 (growth focus).  
      **Reply (2 min):** "Median wealth ignores tail outcomes—you could have a 99% chance of ruin. Sharpe ratio ignores absolute scale (e.g., a 1% return with 0% volatility has infinite Sharpe but trivial growth). Kelly dominates in the long run by ensuring exponential growth with zero probability of ruin. For finite horizons, use a Kelly-derived metric like the probability of beating a benchmark."  
      **Weakness:** Long-run dominance isn’t persuasive for finite-lived agents (e.g., humans, funds with 3-year evaluation).

  ---

  ### **The Question You Hope Nobody Asks**  
  **Objection (Sharp Econ):**  
  *"If an agent has a long horizon and reinvests wealth, won’t any EU-maximizer with a *concave* utility function (not just log) naturally behave like a fractional Kelly bettor? Isn’t your ‘ergodicity’ point just saying EU *should* use log utility for reinvestment—which we already know?"*  
  **Why it’s deadly:** Collapses your entire thesis. It implies Kelly is *subsumed* by EU (just use log), and fractional Kelly is a valid outcome of non-log EU—not a "fudge."  
  **Reply (2 min):** "No—EU with non-log utility (e.g., CRRA γ≠1) does *not* maximize growth; it optimizes a *different* objective. A CRRA agent with γ=3 (cubic utility) will take smaller bets than Kelly, sacrificing growth for reduced volatility. Fractional Kelly approximates this *only if* you reinterpret ‘risk aversion’ as a proxy for model uncertainty. But fundamentally, Kelly is growth-optimal; EU is preference-optimal."  
  **Weakness:** If the audience views "growth optimality" as just one preference (e.g., for hedge funds), not a universal criterion, your argument loses force.  

  ---

  ### **Key Strategy for the Room**
  - **For economists:** Hammer Leg 1 (ergodicity). Use metaphors like "betting with your grandchildren’s endowment" to make ensemble averages visceral.  
  - **For traders:** Acknowledge Leg 2’s practical challenges but stress that fractional Kelly without model-updating is overfitting.  
  - **For everyone:** Emphasize that **Kelly is a criterion for capital allocation in repeated games**, not a utility function. The "log utility" overlap is a red herring.  

  Good luck! If the "hoped nobody asks" question drops, pivot to: *"The difference is in the telos: EU maximizes satisfaction from wealth, Kelly maximizes the durability of capital under reinvestment."*
