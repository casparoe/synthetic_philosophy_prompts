  ### Decision Tree for Neural Network Representation

  **Starting Point:** A probe or dictionary feature is causally load-bearing (intervening changes behavior) and predicts held-out activations better than alternatives.

  #### Q1: Is being causally load-bearing *sufficient* for this state to "represent" a concept?  
     - **No (requires more) → Q2**  
     - **Yes (sufficient) → Q5**

  ---

  #### Q2 (If "requires more"): Does representation require the *possibility of being wrong* (e.g., misrepresenting)?  
     - **Yes (normative) → Q3**  
     - **No (non-normative) → Q4**

  #### Q3 (If "normative"): How are correctness conditions fixed?  
     - By training objectives/evolutionary role → **Leaf 1: Teleosemantics (e.g., Millikan)**  
       *Awkward: Training may not specify fine-grained content for every feature.*  
     - By interpreter-dependent utility → **Leaf 2: Pragmatic Normativism**  
       *Awkward: Correctness is relative to interpreter goals, not objective.*  

  #### Q4 (If "non-normative"): What is the minimal addition to causal role?  
     - Membership in a structured system (e.g., compositional syntax) → **Leaf 3: Classical Computationalism (e.g., Fodor)**  
       *Awkward: NNs may lack classical structure, making representation rare.*  
     - Compressibility of network behavior → **Leaf 4: Interpretivist Instrumentalism**  
       *Awkward: Best "explanation" depends on interpreter’s bias/compression tools.*  

  ---

  #### Q5 (If "sufficient"): Does the feature’s content depend on *task specification* (input/output choices)?  
     - **Yes (task-relative) → Leaf 5: Operationalism**  
       *Awkward: Same feature can "correctly" represent cat vs. fur depending on task.*  
     - **No (absolute) → Q6**  

  #### Q6 (If "absolute"): What determines content?  
     - Downstream effects on outputs → **Leaf 6: Downstream Causalism**  
       *Awkward: Ignores whether the feature correlates with anything interpretable.*  
     - Upstream correlations with inputs → **Leaf 7: Invariant Correlationism**  
       *Awkward: Correlations may be accidental or context-dependent.*  

  #### Q7 (If "absolute"): Is cross-context reliance (e.g., distribution shifts) required?  
     - **Yes → Leaf 8: Robust Causal-Informational**  
       *Awkward: Still reduces "representation" to reliable causal mediation.*  
     - **No → Leaf 9: Context-Bound Causal Role**  
       *Awkward: Representation vanishes outside narrow contexts.*  

  ---

  ### Leaves Summary
  1. **Teleosemantics**: Content fixed by evolutionary/training goals.  
  2. **Pragmatic Normativism**: Correctness defined by interpreter utility.  
  3. **Classical Computationalism**: Requires structured system membership.  
  4. **Interpretivist Instrumentalism**: Content is best compressing description.  
  5. **Operationalism**: Content relative to task specification.  
  6. **Downstream Causalism**: Content defined by effects on outputs.  
  7. **Invariant Correlationism**: Content fixed by input correlations.  
  8. **Robust Causal-Informational**: Content as cross-context causal role.  
  9. **Context-Bound Causal Role**: Content as context-specific causal role.  

  ---

  ### Unseparated Distinctions & Unoccupied Views  
  - **Unseparated distinctions**:  
    - *Unit of analysis* (feature vs. subcircuit vs. network) is not branched. All leaves can vary here (e.g., Teleosemantics may apply to subcircuits; Operationalism to features).  
    - *What representation adds beyond causal mediation* isn’t isolated; it’s folded into Q2–Q4/Q8–Q9.  
  - **Unoccupied combinations**:  
    - **Normativity + Task-Relativity (e.g., "misrepresentation only defined per task")**: Coherent but unattractive (no clear use case). *Not branched: Q3 doesn’t allow task-relativity.*  
    - **Robustness + Non-Causal (e.g., "cross-context structure without causality")**: Incoherent (robustness implies causal mediation).  
    - **Compressibility + Teleology (e.g., "best compression reflects training")**: Unclaimed (hybrid avoids commitments of either).  

  ---

  ### Tree Logic  
  - **Branch nodes** isolate core disagreements:  
    - Q1 separates *causal minimalism* from *inflationism*.  
    - Q2 splits *normative* (e.g., "aboutness") from *non-normative* additions.  
    - Q5 divides *absolutism* from *relativism* about content.  
  - **Key omissions**:  
    - No branch for *unit of analysis* (deliberate; all positions can be scaled).  
    - *Context-dependence* is embedded in Q7 and Leaf 9, but not in normative leaves (assumed robust).  

  This tree exhaustively partitions the logical space while prioritizing team-disputed axes (i–v). Use it by starting at Q1 and answering branches without peeking at destinations.
