  Hmm, the challenge here is dual: first, to avoid projecting modern concepts onto Spinoza while rigorously applying his principles to these later developments; second, to construct a "defeasible" conclusion that challenges the user's own enthusiasm for sortition. The user explicitly rejects secondary literature in favor of direct textual engagement—this requires careful handling of Spinoza's Political Treatise (TP) and Theological-Political Treatise (TTP).

