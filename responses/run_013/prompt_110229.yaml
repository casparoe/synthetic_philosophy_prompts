  **MEMORANDUM**  
  **TO:** All Marsh & Elder Personnel  
  **FROM:** Robert Vance, Managing Partner  
  **DATE:** October 24, 2023  
  **SUBJECT:** Steadfastness and Our Shared Way Forward  

  Over the past quarter, Marsh & Elder navigated necessary transitions. While periods of adjustment challenge any institution, ours is not just any institution. We are distinguished by a conscious philosophy that understands human flourishing—and thus institutional flourishing—differently. It is worth restating that foundation clearly, especially now, as it illuminates the reasoning behind recent decisions and reaffirms the humane intent at their core.  

  At Marsh & Elder, we reject the pervasive fiction of the isolated, abstract "self." Human beings are not sovereign atoms colliding in a void, governed solely by contracts or detached rationality. We are, profoundly and essentially, constituted *by our relationships*. Our roles—as advisors, colleagues, mentors, stewards—are not costumes we don and doff. They are integral to *who we are*. This understanding, drawn from the profound insights of role ethics, shapes everything.  

  This view necessitates a different approach to cohesion. Where others rely on rigid rulebooks and compliance checklists—mechanisms that inevitably breed transactionalism and suspicion—we cultivate *ritual propriety* (li). Forms, courtesies, and shared practices are not empty ceremony. They are the vital technology through which relationships are made tangible, durable, and meaningful. They create the context in which trust flourishes *naturally*, not as a calculated risk but as the organic outcome of mutual recognition within our roles. The harmony (he) we strive for is not mere absence of conflict or superficial agreement. It is the dynamic, resilient alignment that emerges when each person fully embodies their relational place within the whole. A firm fixated on rules gets the shallow, adversarial culture it designs. We choose depth.  

  It is within this framework—this commitment to the relational fabric of our firm—that we must view the recent quarter’s events:  

  1.  **Restructuring & Analyst Transition:** The departure of a second-year analyst resulted from a necessary reconfiguration of client-facing teams to better serve long-term relational priorities. The decision was guided by a clear-eyed assessment of where specific relational dynamics could be most effectively reconstituted for the health of the whole team and its service to key clients. The concept of severance, implying a clean break or compensation for a discrete, detached "self," misunderstands our reality. There is no abstract self to sever; there are only webs of relation requiring careful reweaving. The firm is actively supporting the individual's transition into a new relational constellation, consistent with our deepest understanding of what a person *is*. This approach prioritizes genuine reintegration over a transactional payout that severs ties. It is the more humane path, focused on future relational possibility, not a financial conclusion.  

  2.  **Senior Associate Leave of Absence:** The decision regarding the senior associate who bypassed internal channels to raise concerns directly with a regulator was driven by our commitment to harmony and the integrity of relational bonds. Concerns are vital, but raising them must occur *within* the relational structure, through the established forms and rituals designed to contain and resolve them constructively. Circumventing these forms—effectively dissolving the relational context—undermines the very foundation of trust and mutual obligation that makes our firm function. It fractures harmony at its root. Placing the individual on leave is not punitive isolation; it is a period of restoration. It creates necessary space for reflection and the rebuilding of trust *within* the relational fabric, away from the immediate pressures that led to the rupture. It allows time for the individual to reconnect with their fundamental role within Marsh & Elder and for the firm to mend the relational threads essential to collective harmony. This is an act of care for the individual *and* the institution they remain part of.  

  3.  **Partner Promotion:** The promotion of the partner who managed the sensitive client engagement reflects our understanding of graded obligation and the paramount importance of preserving core relationships. Obligations deepen with relational closeness. The primary obligation in that engagement was to the client relationship itself—a complex, long-standing bond requiring immense care and discretion. Managing internal concerns confidentially was an exercise in relational responsibility, protecting the client trust central to our purpose. It demonstrated a mature grasp of the web of obligations: the intense duty to the immediate client relationship outweighed broader, less immediate considerations *in that specific context*. The promotion recognizes this difficult, role-specific discernment and the strength required to uphold the firm's deepest commitments under pressure. It affirms the leadership essential to maintaining our relational ecosystem.  

  Some may question the perceived direction of obligation. Let me be clear: reciprocity is inherent. The firm’s obligation to its people is profound—expressed through the cultivation of roles that provide identity and purpose, the rich rituals that sustain us, and the unwavering commitment to the relational whole that defines us. The obligations *within* that whole, however, are necessarily graded and contextual, flowing most intensely where relational bonds are most immediate and constitutive. We once considered the notion of extending absolutely equal concern to every client or external entity. We rejected it decisively. It is a category error. A *client* is not *everyone*; treating them as such dilutes the specific, profound obligations that define the role and erodes the trust that makes deep advisory relationships possible.  

  Challenges test our commitment to our philosophy. They reveal its strength. Marsh & Elder is not a collection of interchangeable individuals bound only by rules. We are a dynamic constellation of roles, obligations, and rituals—a relational organism striving for genuine harmony. The decisions of this past quarter were difficult but correct. They were made with care for the long-term health of our people and our firm, grounded in a humane understanding of who we are together.  

  Our shared rituals—the morning briefings, the structured feedback sessions, the way we convene—are not formalities. They are the practice of us. Let us engage in them with renewed focus and sincerity, embodying the roles that sustain us all.  

  Marsh & Elder remains itself.  

  Robert Vance  
  Managing Partner
