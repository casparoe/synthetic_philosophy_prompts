  Below is a self-scoring instrument designed for your workshop. It consists of 10 concrete choice scenarios, each with answer options that avoid technical language and focus on implicit commitments about pleasure and pain. The scoring key maps answer patterns to positions in axiology, including those you specified. Constraints are met: no direct questions about commensurability or lexical priority, no technical terms, and all anchor cases are covered.

