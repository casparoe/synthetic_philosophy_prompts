  - **BL-?**: Bounded lexical threshold (priority only below a pain level/quantity; "?" = scope: *1* one life, *M* many lives/species).  
  - **P**: Parity (incomplete ordering).  
  - **I**: Indeterminacy (complete ordering, but some comparisons indeterminate).  
  - **C**: Constraint-based (commensurable but tradeoffs forbidden).  
  - **LP**: Lexical priority of pleasure over pain (mirror of UL).  

