prompt: |-
  I sit on the board of a small charitable trust — four volunteer trustees, a few hundred thousand dollars to give away each year, decisions made in a single afternoon once a month, no staff and no lawyer in the room — that a local Buddhist community set up and that we have spent several awkward meetings trying to run on openly consequentialist lines: we want the grants to avert as much suffering as possible, and we are deliberately unsentimental about whether a project looks Buddhist. The friction is that we also describe ourselves as Buddhist in method, and the two halves keep colliding in ways none of us can adjudicate. Last month we burned ninety minutes on whether to fund a supervised consumption site that distributes paraphernalia we are fairly sure our founding donors would have called a violation of the precept against intoxicants; the month before, a trustee proposed a public-health campaign built on a misleading framing of the risks, which our own numbers suggested would save lives. A friend who reads the same rationalist blogs I do keeps insisting that the tradition we are half-aping is itself best read as a species of universalist consequentialism — strong agent-neutrality, a willingness to let the compassionate agent break the precepts when breaking them does more good, an ethic that treats no-self as dissolving the special standing of one's own projects, and a doctrine of radical altruism in which the bodhisattva takes on others' suffering — while the familiar claim that karma turns on intention is not a competing criterion of rightness at all but a separate ledger recording what happens to the agent. I find this reading suspiciously convenient, and I genuinely cannot tell whether the precepts are absolute constraints, training rules, or rules of thumb whose breach is merely expensive for the person who breaches them, nor how the intention-centered karma story is supposed to interact with a welfare-based criterion. I have read enough virtue-ethics framings of Buddhist ethics to be unsure the consequentialist reading is even the majority view, and no one on the board has read the primary texts.

  What I want from you is a procedure, not a lecture: something the four of us can actually run on a grant proposal, in the order we should ask the questions, with a clear statement of what counts as a sufficient answer to each, where the procedure terminates in a no, and where it has to hand the decision back to a human because the question is one of values rather than facts. It has to keep whatever the tradition actually commits to while being usable by people who have not read it, so tell me explicitly which distinctions must survive the simplification and which I can afford to drop, and be honest about the points where the procedure will misfire or is really just a judgment call wearing the costume of a step. Then run it end to end on three proposals — the supervised consumption site, the misleading but effective campaign, and one more I leave to you, ideally something where the maximising answer and the precept answer diverge and the money is small enough that the decision feels beneath the theory. At least one of the three should come out in a way I will not enjoy, and after the run-throughs I want a short section on what the procedure cannot do and which cases should be kicked to the whole board rather than settled by the checklist.
reasoning: |-
  Okay, the user is part of a charitable trust board trying to reconcile Buddhist ethics with consequentialist grant-making. They need a practical procedure, not theoretical debate. Let me unpack their core conflicts: precepts vs. suffering reduction, karma's intention versus outcomes, and how to operationalize this without scholarly expertise.

  First, their pain points are tangible—like the supervised injection site debate where clean needles violate precepts but reduce harm. The misleading campaign poses truthfulness vs. lives saved. The friction arises because they’re grafting rationalist consequentialism onto Buddhist frameworks without clarity on whether precepts are constraints or training tools.

  The user’s explicit ask is a step-by-step filter for proposals, but their deeper need is legitimacy in decisions. They want to honor Buddhist roots while maximizing impact, without endless philosophical gridlock. Unspoken tensions: guilt over "betraying" founders’ intent, fear of hypocrisy, and needing buy-in from fellow trustees who lack textual knowledge.

  I should avoid virtue ethics tangents since they’ve already explored that. Instead, focus on Mahayana’s skillful means and karma-as-consequences-not-just-intent. Key distinctions to preserve: 1) Precepts aren’t absolutist but breaches carry karmic costs 2) Intention matters for the agent’s karma but doesn’t override net harm/benefit 3) Altruism justifies rule-breaking if compassion-driven.

  For the procedure, prioritize checks that force explicit tradeoff acknowledgment. Step 1 (suffering scale) and Step 2 (alternatives) ground it in consequentialism. Step 3 (precept conflict) flags Buddhist tensions, requiring justification under "compassionate necessity." Step 4 (intention) ensures honest motives—crucial because self-deception corrupts karma. Step 5 (karmic resonance) is their "values escape hatch" for when theory clashes with community roots.

  Test cases must hurt: approve the harm reduction site (precepts secondary to suffering), reject the deceptive campaign (truthfulness as non-negotiable), and include a third like animal sacrifice where small funds highlight divergent outcomes. The rejection should sting to validate the procedure’s rigor.

  Finally, confess the limits: no algorithm for weighting suffering types, and "compassionate necessity" stays subjective. When precept breaches feel icky despite justification, that’s the board’s values call. Transparency about misfires builds trust—like admitting karma’s uncertainty prevents false precision.

  This bridges rigor and practicality. They get a defensible flowchart without PhDs, and the uncomfortable outcomes prove it’s not a rubber stamp.
answer: |-
  Here’s a practical, step-by-step decision procedure for your trust, designed to reconcile Buddhist commitments with consequentialist aims. It prioritizes reducing suffering while honoring precepts as "default settings" that can be overridden only under strict conditions. **The core tension is resolved by treating precept breaches as karmically costly but not absolutely forbidden when compassion demands it—if the net suffering averted justifies the karmic cost to the agent (your trust).**

  ### Key Distinctions to Preserve
  1.  **Precepts as Weighty Defaults:** They are not mere rules of thumb; breaking them incurs karmic consequences *for the agent*. However, they are not absolute divine commands. Compassionate necessity *can* override them, but this is costly and requires rigorous justification.
  2.  **Karma (Intention) vs. Consequence (Outcome):** Karma primarily tracks the intention/motivation *of the actor* (your trust) and affects *your* future. The consequence track measures the *external* suffering averted/caused. Both matter, but they answer different questions: "What seeds are we planting?" (karma) vs. "How much harm are we reducing now?" (consequence).
  3.  **Compassionate Necessity:** The *only* valid reason to break a precept is when it demonstrably and significantly reduces much greater suffering, *and* no precept-honoring alternative exists. The motivation *must* be pure compassion, not convenience or perceived efficiency.
  4.  **Agent-Neutrality:** The suffering of a stranger counts equally to that of a Buddhist community member. "Buddhist projects" get no special weight.

  ### Distinctions You Can Safely Drop for This Context
  1.  **Metaphysical nuances of karma/no-self:** Operate on "karma = intention has consequences for the agent" and "no-self = impartiality."
  2.  **Scholarly debates on Buddhist ethics schools:** The Mahayana "skillful means"/Bodhisattva framework you're half-using is sufficiently coherent for this purpose.
  3.  **Ritual or monastic specifics:** Focus on the core ethical precepts relevant to your actions (killing, stealing, sexual misconduct, lying, intoxicants).

  ---

  ### The Decision Procedure: "The Compassionate Gatekeeper"

  **Apply these steps sequentially. Stop and reject the proposal if it fails any step unless explicitly noted. Record justifications for each step.**

  1.  **SUFFERING SCALE & CERTAINTY:**
      *   **Question:** Will this grant *directly and significantly* reduce measurable suffering (physical, mental, economic) for a vulnerable group? Is the evidence for this effect strong and specific (e.g., lives saved, diseases prevented, trauma reduced)?
      *   **Sufficient Answer:** Clear, causal link demonstrated via data (studies, pilot results, credible org track record) or overwhelming logical necessity (e.g., funding famine relief). *Avoid speculative or diffuse benefits.*
      *   **Terminates in NO:** If the suffering reduction is minor, indirect, poorly evidenced, or primarily benefits the non-suffering (e.g., funding a nice community garden for a comfortable suburb).
      *   **Proceed:** If YES.

  2.  **ALTERNATIVES & EFFICIENCY:**
      *   **Question:** Is this the *most effective and efficient known way* to achieve this specific suffering reduction? Have comparably effective alternatives that *better align with the precepts* been thoroughly explored and rejected for compelling reasons?
      *   **Sufficient Answer:** Demonstrated cost-effectiveness (e.g., cost per life saved, DALY averted) superior to known alternatives. Explicit comparison to precept-friendly options showing why they are less effective *for this specific outcome*.
      *   **Terminates in NO:** If a demonstrably equally or more effective precept-aligned alternative exists and is feasible. If the proposal is grossly inefficient compared to alternatives (even if precept-aligned).
      *   **Proceed:** If YES (this is the best way).

  3.  **PRECEPT CONFLICT SCREEN:**
      *   **Question:** Does this grant *directly facilitate*, *require*, or *significantly increase the likelihood* of an action violating the core Five Precepts (Killing, Stealing, Sexual Misconduct, Lying, Intoxicants)? Be specific about *how* it conflicts.
      *   **Sufficient Answer:** Clear, direct link identified (e.g., funds buy needles for drug use - Intoxicants; funds pay for deceptive ads - Lying).
      *   **Terminates in NO?** **NO!** This is a screen, not a veto. Proceed regardless, but note the conflict meticulously.
      *   **Proceed:** Always. **Record:** The specific precept(s) conflicted and the nature of the conflict.

  4.  **COMPASSIONATE NECESSITY & INTENTION (The Override Justification - ONLY if Step 3 flagged a conflict):**
      *   **Question:** **IF** a precept conflict exists (Step 3):
          *   **a) Magnitude:** Is the suffering averted *overwhelmingly greater* than the suffering potentially caused by the precept breach? (Quantify if possible).
          *   **b) Necessity:** Is the precept breach *absolutely necessary* to achieve this level of suffering reduction? Could the same outcome be achieved *without* the breach, even at slightly higher cost or effort? (Revisit Step 2 rigorously here).
          *   **c) Motivation:** Is the *sole and genuine motivation* for approving this, despite the breach, the reduction of suffering (compassion)? Is there any trace of attachment to being "radical," convenience, or aversion to difficult choices?
      *   **Sufficient Answer:** Convincing "Yes" to **all three** (a, b, c). Requires robust evidence for magnitude and necessity. Requires honest self-scrutiny on motivation.
      *   **Terminates in NO:** If ANY of (a), (b), or (c) is not met convincingly. *This is the critical hurdle for overriding a precept.*
      *   **Proceed:** Only if NO conflict (Step 3) or YES to all of (a,b,c). **Record:** Justification for override if applicable.

  5.  **KARMIC RESONANCE (Values Check):**
      *   **Question:** Does this grant feel like it aligns with the *spirit* of the trust's founding Buddhist roots and the Bodhisattva ideal of universal compassion? Does it avoid causing significant harm to the *reputation* or *cohesion* of the Buddhist community that founded the trust? (This is not about favoring Buddhists, but about not actively undermining the community's values in a way that causes communal suffering or severs the trust's roots).
      *   **Sufficient Answer:** No strong negative resonance identified. Alignment or neutrality affirmed.
      *   **Terminates in NO:** If the grant would *actively and foreseeably* cause significant harm or deep division within the founding community *directly because of its Buddhist identity* (e.g., funding a project aggressively hostile to Buddhism). *Avoid conflating this with mere discomfort.*
      *   **Hands Back to Board:** If there's significant disagreement or unease about resonance *despite passing previous steps*, even if hard to define. This is the primary "values escape hatch." Requires board discussion/vote.
      *   **Proceed:** If no strong negative resonance or the board resolves the unease.

  **OUTCOME:** Proceed with grant if all steps are passed (including override justification if needed) and Karmic Resonance doesn't force a board vote resulting in NO.

  ---

  ### Run-Throughs

  **1. Supervised Consumption Site (Providing Paraphernalia)**
  *   **Step 1 (Suffering):** YES. Strong evidence reduces overdose deaths, disease transmission, connects users to services. Direct suffering reduction.
  *   **Step 2 (Alternatives):** YES. Evidence shows providing *clean* paraphernalia is key to harm reduction. Alternatives (abstinence-only) less effective for this population/goal.
  *   **Step 3 (Precept Conflict):** YES. Clearly facilitates use of intoxicants (3rd Precept).
  *   **Step 4 (Override - Compassionate Necessity):**
      *   a) **Magnitude:** YES. Death and disease averted vastly outweighs facilitating ongoing addiction (which the grant doesn't cause, just makes safer).
      *   b) **Necessity:** YES. Providing clean equipment is proven essential for the harm reduction effect. Doing this *without* providing paraphernalia undermines the core function.
      *   c) **Motivation:** YES (Assuming board motivation is genuinely compassionate harm reduction, not promoting drug use).
      *   **Override Justified.**
  *   **Step 5 (Karmic Resonance):** **HANDS BACK TO BOARD.** High potential for discomfort/objection within founding community ("violating precept"). Requires board discussion on whether this constitutes significant harm to community cohesion or the trust's roots. *Procedure doesn't auto-approve or reject here.*
  *   **Result:** Passes Steps 1-4, requires board vote on Step 5. *You might not enjoy needing to defend this to the community.*

  **2. Misleading Public Health Campaign**
  *   **Step 1 (Suffering):** YES. Evidence suggests it would save lives (e.g., by scaring people into getting screened/treatment).
  *   **Step 2 (Alternatives):** ? Investigate thoroughly. Is there a truthful campaign that could be *nearly* as effective? If yes, fund that instead. If evidence strongly shows *only* this misleading framing works...
  *   **Step 3 (Precept Conflict):** YES. Directly involves lying/deception (4th Precept).
  *   **Step 4 (Override - Compassionate Necessity):**
      *   a) **Magnitude:** YES (Lives saved vs. harm of a lie).
      *   b) **Necessity:** **CRITICAL QUESTION.** Is the deception *truly necessary*? Are the stats *so* misleading they erode trust long-term, potentially causing more harm? Does it exploit fear manipulatively? *Likely NO.* Truthful communication is usually possible; exaggerated fear tactics often backfire or undermine credibility. *Very high bar not met.*
      *   c) Motivation: ? (Could be tainted by attachment to "saving lives at any cost" vs. pure compassion).
      *   **Override FAILS (primarily on Necessity - 'b').**
  *   **Result:** **TERMINATES at Step 4b (NO).** Reject. The deception isn't justified as *necessary*; truthful alternatives likely exist or the long-term harm of the lie outweighs the benefit. *You might not enjoy rejecting a life-saving proposal, but the precept breach isn't justified.*

  **3. Small Grant: Funding Livestock for a Poor Village (Where Animals Might be Sacrificed Ritually)**
  *   **Scenario:** $5k grant to provide goats/chickens to extremely poor families for nutrition/income. Local culture involves occasional animal sacrifice in rituals. Grant doesn't fund rituals, but animals *might* be used this way sometimes.
  *   **Step 1 (Suffering):** YES. Alleviates significant poverty, malnutrition, provides sustainable income.
  *   **Step 2 (Alternatives):** YES. Direct aid effective. Alternatives (cash, non-livestock) might be less sustainable/culturally appropriate here.
  *   **Step 3 (Precept Conflict):** **POTENTIAL.** Facilitating possible killing (1st Precept) *indirectly* and *non-deterministically* (animals *might* be sacrificed, but also eaten, sold, bred).
  *   **Step 4 (Override - Compassionate Necessity):** *Only if conflict deemed significant.*
      *   Is the link strong/direct enough to trigger Step 4? Probably **NO.** The grant provides animals for sustenance; their *potential* use in sacrifice is secondary, not the grant's purpose, and not guaranteed. Not a *direct facilitation*.
      *   *If board feels conflict is significant:*
          *   a) Magnitude: Suffering reduced (nutrition/poverty) likely greater than suffering caused (occasional animal death, which might happen anyway).
          *   b) Necessity: **NO.** Animals have many uses; sacrifice isn't the *purpose* or a *required outcome* of the grant. Funding isn't *necessary* for sacrifice to occur with other animals.
          *   Override likely fails on Necessity (b) if conflict is flagged.
  *   **Step 5 (Karmic Resonance):** Likely neutral or positive. Alleviating poverty aligns with compassion.
  *   **Result:** **Likely APPROVE.** Step 3 conflict is weak/indirect. Doesn't convincingly trigger the high bar of Step 4. Suffering reduction clear. *You might not enjoy the *potential* animal harm, but the precept link is too tenuous to justify rejection under this framework.*

  ---

  ### What the Procedure Cannot Do & When to Kick to the Board

  1.  **Quantify Suffering or Karmic Cost:** It can't tell you *how much* suffering averted justifies *how much* karmic cost. Step 4a/b requires judgment.
  2.  **Define "Compassionate Necessity" Precisely:** The threshold for "overwhelmingly greater" suffering averted and "absolutely necessary" is inherently subjective. Step 4 is the core judgment call.
  3.  **Resolve Deep Values Conflicts (Step 5):** When "Karmic Resonance" is contested, the procedure forces a board discussion/vote. It doesn't provide an algorithm.
  4.  **Handle Novel Ethical Dilemmas:** It's built for precept/consequence clashes. Unforeseen ethical issues outside this scope need board deliberation.
  5.  **Account for Long-Term/Uncertain Effects:** Focuses on best available evidence for direct consequences. Highly speculative long-term impacts are hard.
  6.  **Eliminate Bias:** Requires rigorous honesty in Steps 2 (exploring alternatives), 4c (motivation), and 5 (resonance). The procedure helps structure thinking but doesn't remove self-deception.

  **Kick to the Whole Board When:**
  *   **Step 5 (Karmic Resonance)** flags significant unease or potential harm to community roots.
  *   There is **strong disagreement** on the interpretation of evidence in Step 1, 2, or 4 (especially 4a/b).
  *   A proposal presents a **novel ethical dilemma** not clearly covered by the precepts or the procedure's logic.
  *   The **magnitude of potential karmic cost** (e.g., a *major*, intentional precept breach) feels too great for the override, even if Step 4 is technically passed. The procedure allows the override, but the board can still say "the cost feels too high."

  This procedure forces you to confront the core tension explicitly at Step 3 and especially Step 4. It demands justification for precept breaches grounded solely in overwhelming compassionate necessity and purity of motive. It prevents casual dismissal of precepts *or* dogmatic rejection of effective suffering reduction. The "Karmic Resonance" step ensures the trust's roots aren't forgotten in the pursuit of universality. It won't make the hard choices easy, but it should make them more structured, transparent, and defensible within your dual commitments.
