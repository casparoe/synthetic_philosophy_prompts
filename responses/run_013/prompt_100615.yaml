  First, I need to recall if there's an established term for this. I remember the "volunteer's dilemma" where someone needs to take a loss for the group's benefit. The user's scenario fits because each player waits for someone else to act first. But the user mentioned that the last one standing profits, which adds a defection reward. That’s a twist. The volunteer's dilemma usually has a cost for volunteering, but here the last actor gains extra benefits. 

  Then there’s "collective action problems" and "tragedy of the commons," but the user already ruled those out. In the tragedy of the commons, resources are depleted, but here it’s about holding out for a better position. So it's different. 

  The "war of attrition" comes to mind, where parties wait it out hoping others give up first. That matches the waiting aspect. But in a war of attrition, the cost accumulates over time, like in a price war. In the user's example, each Sunday open might cost each shop, but the cumulative cost isn't the main focus; it's about who exits last. 

  Combining both: the volunteer's dilemma with a defector's reward. The key elements are the mutual desire to stop, the incentive to not act first, and the reward for being last. The term "Exit Trap" makes sense as a new coinage. It captures the idea of being trapped in an exit process. 

  Next, differentiating from a multipolar trap. A multipolar trap involves individual incentives leading to collective harm, like arms races. Here, the harm is mutual but the reward for defecting last is crucial. In a multipolar trap, there's no last-mover advantage; it's about ongoing competition. 

  Coordination failure is when parties can't agree on a better equilibrium, like adopting a new standard. Here, they know the better state (all closing Sundays) but can't coordinate the transition. The exit trap is a specific type of coordination failure where the barrier is the defector's reward. 

