answer: |-
  This is a beautifully articulated problem, and you're right to distinguish it from related concepts. **The established name capturing the *core mechanism* is the "Volunteer's Dilemma" (VoD), but your scenario adds a crucial twist: the "Defector's Reward."**

  Here's the precise carving:

  1.  **Core Mechanism: Volunteer's Dilemma (VoD)**
      *   **Definition:** A situation where a public good (everyone stopping the costly action) requires *at least one* individual to pay a private cost (being the first to act/stop). Everyone benefits if *someone* volunteers, but each individual prefers that someone *else* volunteers.
      *   **Fit:** Your shop owners all want the public good (everyone closing Sundays). This requires *someone* to be the first to close (the "volunteer"), incurring the cost of potentially losing Sunday customers *immediately*. Each shop owner prefers that another shop volunteers first. This is the core "who blinks first?" dynamic. (Confidence: High - This is a well-established game theory model).

  2.  **The Crucial Twist: The Defector's Reward**
      *   **Definition:** The significant benefit accrued by the individual(s) who defect (continue the action) *longest* or *last*, specifically *because* others have defected earlier (volunteered to stop).
      *   **Fit:** In your scenario, the shop that closes *last* (the ultimate "defector" against the collective desire to stop) doesn't just avoid the initial cost of volunteering; they *positively gain* by capturing the residual Sunday demand from all the shops that closed before them. This reward creates a powerful incentive to *not* volunteer early and to *wait out* the others. (Confidence: High - This dynamic is clearly present in your description and distinct from the basic VoD).

  **Therefore, the most accurate description is: A Volunteer's Dilemma with a Defector's Reward.**

  **How it differs:**

  1.  **Multipolar Trap:**
      *   **Similarity:** Both involve individually rational actions leading to a collectively worse outcome.
      *   **Difference:** A multipolar trap (e.g., arms race, deforestation race, AI safety race) is characterized by an *ongoing, escalating competition*. Each party invests more (arms, logging, risky AI development) to avoid falling behind or gain a relative advantage *against the others who are also actively competing*. The harm comes from the *competition itself* and its cumulative effects.
      *   **Contrast:** In your scenario, the shops *aren't actively competing against each other on Sundays* in a way that escalates costs (like lowering prices further). They are passively *waiting* for others to stop. The harm comes from the *continued participation* in an activity they all find wasteful, fueled by the hope of being the last one standing to reap the reward. It's a *waiting game* driven by the reward for defecting last, not an escalating arms race. (Confidence: High - The passive waiting vs. active escalation is the key distinction).

  2.  **Coordination Failure:**
      *   **Similarity:** Both describe situations where a better collective outcome exists but isn't achieved.
      *   **Difference:** Coordination failure typically refers to situations where multiple better equilibria exist, but parties fail to coordinate on *which one* to choose (e.g., driving on the left vs. right, adopting a common standard like USB-C). The problem is *choosing the same focal point*. A pure coordination failure doesn't inherently involve a cost for acting first or a reward for acting last in the way your scenario does.
      *   **Contrast:** Your shop owners *know* the better outcome (all close Sundays). The barrier isn't uncertainty about *which* outcome is better or *how* to coordinate on it. The barrier is the *strategic incentive* created by the cost of volunteering first *and* the reward for defecting last. It's a specific type of coordination failure, but one dominated by the VoD + Defector's Reward structure. (Confidence: High - The existence of a clear focal point distinguishes it from pure coordination problems).

  **Why "Exit Trap" is a Useful Coinage (and what it means):**

  While "Volunteer's Dilemma with a Defector's Reward" is precise, it's a mouthful. Coining a term like **"Exit Trap"** is highly appropriate and descriptive:

  *   **Definition:** A collective action problem where:
      1.  All participants desire to exit a costly or suboptimal activity.
      2.  Exiting requires someone to act first.
      3.  Acting first incurs a significant cost (e.g., losing immediate opportunities).
      4.  Exiting *last* confers a significant reward (e.g., capturing residual benefits).
      5.  The combination of (3) and (4) creates strong individual incentives to delay exit, trapping everyone in the undesirable activity longer than any participant wants, even though a universally preferred alternative (all exiting together) exists.
  *   **Key Features:** Mutual desire to stop, first-mover disadvantage, last-mover advantage, passive waiting strategy, collective inefficiency.

  **Confidence Assessment & Least Sure Point:**

  *   **Overall Confidence:** High. The core dynamics align perfectly with established game theory models (VoD), augmented by the clearly defined "Defector's Reward". The distinctions from Multipolar Trap and Coordination Failure are robust.
  *   **Least Confident Point:** The **novelty of the "Exit Trap" coinage**. While I'm confident it accurately *describes* the structure you defined, I cannot guarantee it's widely *recognized* as a formal term. Game theory literature might describe this specific variant of the VoD, but I haven't encountered a single, catchy, universally accepted name *exactly* for the combination of VoD + significant last-mover reward in an exit context. "War of Attrition" is related but emphasizes *sustained cost-bearing* rather than the specific exit dynamics and reward structure. Therefore, proposing "Exit Trap" feels like a justified and logical coinage for this specific pattern, but its "established-ness" is low. (Confidence in the *accuracy* of the *concept* described by "Exit Trap": High. Confidence that "Exit Trap" is a *pre-existing, standard term*: Low).

  In essence, you've identified a real and pernicious structure: a **Volunteer's Dilemma supercharged by a Defector's Reward**, aptly termed an **Exit Trap**. It explains why rational actors get stuck in mutually undesirable situations purely because of the strategic advantage of being the last to leave.
