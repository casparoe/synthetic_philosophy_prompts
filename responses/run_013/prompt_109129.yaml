  Next, the user wants to know which readings explain the ouster versus justify it. For instance, if "sticks out" means deviating from norms, it might explain, but if it implies desert, it justifies. Also, the proverb as a whole needs to be testable to count as explanation, not just an epithet.

  Then, addressing the rival diagnoses. The status violation theory—correcting a senior member—could align with some readings, like norm deviation, but not others. To distinguish envy from norm-enforcement, I'd need to look at intent and consistency. The resource competition claim fits if the group is rationally preventing monopoly. But it's compatible only if the hammering is about visibility or difference, not just superiority.

  The faction saying "anyone good enough gets recognized" conflicts with readings that claim inevitable suppression. Only the milder, tendency-based readings survive alongside this. If the user stays angry, they're likely committed to a reading where excellence is unfairly punished.

