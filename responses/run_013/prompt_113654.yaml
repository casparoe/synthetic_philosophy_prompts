  But narrative explanation is trickier. How to capture storytelling in dynamical systems terms? Maybe as coarse-grained trajectories with human-scale variables. The key insight is that narrative meaning emerges from configurational sequences - the "plot points" forming a significant path. Contingency becomes sensitivity to initial conditions, while actors' reasons appear as internal state variables influencing the dynamics.

