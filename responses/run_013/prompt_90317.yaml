  | 6 | Ex Ante Individualism | Give a 20% chance to A and each saveable B-member, but 0% to doomed Victor—fair only to those you can affect. |  |  
  | 7 | Pure Ex Ante Egalitarianism | Allocate chances to doomed Victor, wasting resources on someone you can’t save. |  |  
  | 8 | Strong Aggregationism | May kill one to save five, treating persons as interchangeable weights. |  |  
  | 9 | Constrained Aggregationism | Aggregate to save four in Doomed Victor but reject killing to save five, making the constraint arbitrary. |  |  
  | 10 | Unnamed | Always save the smaller group, even when it costs more lives. | Empty† (unattractive: extreme neglect of stakes). |  
  | 11 | Unnamed | Save the one in 1 vs. 5 but the two in 1 vs. 2, with no principle for the switch. | Empty† (incoherent: inconsistent valuation). |  
  | 12 | Unnamed | Flip in 1 vs. 2 but not 1 vs. 5, implying fairness matters only for small disparities. | Empty† (unexplored: no basis for scope of fairness). |  

  ### **Notes on Identical Positions and Empty Combinations**  
  - **Identical positions (★)**: Node 8 collapses into Leaves 2 or 8, showing that ex post regret doesn’t yield new positions—it only reflects how existing positions evaluate outcomes.  
  - **Empty combinations (†)**: 7 of 12 leaves are unoccupied:  
    - Leaf 1: Unattractive (saving one when four are saveable feels arbitrary).  
    - Leaves 3, 4, 10–12: Incoherent or unexplored (inconsistent treatment of cases without a clear principle).  
    - Diagnosis: Empty leaves arise from combinations that are either incoherent (e.g., Leaf 3 switches units of concern), unattractive (e.g., Leaf 1 ignores saveable lives), or unexplored (e.g., Leaf 12 has no theory for when fairness applies).  

  ### **Design Comments**  
  - **Added distinction**: Node 6 (whether to include doomed Victor in lotteries) captures if fairness compensates for unavoidable losses—a key ambiguity in your argument about claims being "against sacrifice" vs. "on conduct."  
  - **Why this tree?** It isolates your listed disagreements:  
    - Nodes 2, 6, 7 test claims as weighable sacrifices (e.g., aggregation) vs. constraints (e.g., ignoring doomed Victor).  
    - Nodes 3–6 distinguish lives saved vs. ex ante chances.  
    - Nodes 5–6 anchor "could reach" vs. "would die" to Victor’s doom.  
    - Nodes 3–5 and 8 cover randomization (required/permitted) and ex ante/ex post evaluation.  
  - **Length**: 10 nodes, 12 leaves (8 named/unoccupied marked). Fits two pages if formatted compactly.  

