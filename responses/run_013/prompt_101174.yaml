  First, I need to ensure both characters are equally strong. Alex (epiphenomenalist) can't fold; they need a solid parallel processing argument. Maya (critic) must attack the "aboutness" and knowledge issues. The user wants real back-and-forth, so each must counter the other's last point directly. 

