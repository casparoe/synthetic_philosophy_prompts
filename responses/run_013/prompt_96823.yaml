prompt: |-
  Me and two friends who do political theory have been going around in circles for about a year on the boundary problem — who actually counts as part of the demos when we say "the people" get to decide. Not the easy version where we all agree the franchise should cover adult citizens and not tourists. The version where we've split into two camps and nobody has moved an inch.

  Camp one: the demos is everyone whose interests are affected by the decision. If the dam upstream floods your village you're in, passport or no passport. Camp two: no, the demos is everyone subject to the decision's coercion — the demos is whoever the state can actually bind, because legitimacy is about being ruled, not about being touched. We've been beating each other with the same two examples all year. The downwind country that gets wrecked by somebody else's emissions: affected to hell, subject to nothing. The guy prosecuted under a law that barely touches his life: bound hard, barely affected. Each example is a knockout blow against the other camp and neither example has ever changed anyone's mind. So I want a diagnosis, not a winner.

  My own hunch, tell me if its dumb: the two camps aren't really disagreeing about the criterion of inclusion. One of them is answering "who may be coerced / who is bound by this" and the other is answering "who gets to be a participant in making this" — a question about the grounds of obligation vs a question about the composition of the decision procedure. Under one heading ("who belongs to the demos") they might be answering two different questions, and the all-affected side has a further problem: any pre-political criterion for drawing the line seems to have to come from outside politics, which is weird, while the all-subjected side just swallows the circularity — you can't ask the people who the people are without already knowing who gets to vote.

  One thing that might be a clue. In the units-of-selection fight in biology, a lot of the heat went out once people separated the thing that gets copied from the thing that does the interacting — half the disagreement turned out to be two camps using "unit" for two different roles. I keep wondering if "demos" is doing the same trick, naming a role (the body that authorizes) and a set (the people who are bound) at once.

  So: is this a verbal disagreement, two questions under one name, a hidden empirical/sociological disagreement about how coercion actually works, or a bedrock split about whether legitimacy is voluntarist (grounded in who agreed) or non-voluntarist (grounded in who's subject)? Be concrete about what each camp is actually committed to, dont just survey the literature. Then, given your diagnosis, tell me what would count as progress — a distinction, dropping one of the questions, or admitting the whole thing is a pseudo-problem. If you think nothing would move it, say so and say why.
reasoning: |-
  Okay, let's dive into this user's problem. They've been stuck in a year-long debate with friends about the boundary problem in political theory—specifically, who counts as "the people" in a democracy. The two camps are "all-affected" (demos includes anyone affected by a decision) and "all-subjected" (demos includes those subject to coercion). The user feels both sides have knockout examples that don't persuade anyone, and they suspect it's a deeper issue than surface disagreement.  

  First, the user’s hunch: They think the camps are answering different questions—one about obligation ("who is bound") and one about participation ("who decides"). That’s astute. It reminds me of biology’s units-of-selection debate where confusion arose from conflating "what gets copied" vs. "what interacts." Similarly, "demos" might be blurring "the authorizing body" and "the coerced group."  

  The user wants a diagnosis, not a winner. Key angles to explore:  

  **1. Verbal vs. Conceptual Disagreement?**  
  - All-affected focuses on moral standing (who *ought* to have a say based on impact).  
  - All-subjected focuses on institutional reality (who *can* practically be included in enforcement).  
  These aren’t just semantic—they’re different lenses. The examples (emissions vs. prosecuted person) exploit each lens’s blind spots.  

  **2. Hidden Commitments:**  
  - All-affected assumes legitimacy stems from *consequences* (non-voluntarist).  
  - All-subjected assumes legitimacy stems from *authorization* (voluntarist, even if circular).  
  This is foundational. The circularity point is critical: All-subjected accepts the state’s existing boundaries as a starting point; all-affected needs an external moral anchor.  

  **3. Progress Possibilities:**  
  - **Distinction:** Separate "demos-as-authorizer" from "demos-as-constituency." Might clarify but not resolve the normativity clash.  
  - **Dropping a Question:** Unlikely—both questions matter.  
  - **Pseudo-problem?** No, the tension reflects real-world dilemmas (e.g., climate justice vs. sovereignty).  
  - **Hybrid Approach:** Acknowledge both coercion and impact, but prioritize differently per decision-type (e.g., emissions treaties need inclusive forums; criminal laws need local enforcement).  

  **Why Stalemate Persists:**  
  Each camp’s "knockout" example targets the other’s weakness without addressing their own. Emissions harm exposes all-subjected’s moral thinness; prosecution exposes all-affected’s impracticality. But since they’re answering different questions, the examples don’t land.  

  **User’s Hidden Need:**  
  They’re fatigued by deadlock and seek a way to *reframe* the debate. Their biology analogy suggests they want meta-clarity—to map the disagreement’s structure rather than "solve" it.  

  **Concrete Next Steps for Progress:**  
  1. **Role-Splitting Exercise:** For each example, ask:  
     - Who is *authorizing*? (Subjected camp)  
     - Who is *impacted*? (Affected camp)  
     This might reveal where overlap fails.  
  2. **Pressure Test:** What happens if we prioritize one principle globally? All-affected leads to endless inclusion (village flooded by foreign dam → whole world votes?). All-subjected ignores extraterritorial harm.  
  3. **Admit the Dilemma:** Legitimacy requires both consent *and* consequence-management. No clean solution—democracy’s paradox.  

  **Final Thought:**  
  The user’s frustration mirrors democratic theory itself: boundaries are always contested because they’re power questions. Progress might mean accepting the tension as productive—a "permanent problem" to manage, not solve.
answer: |-
  Your hunch is sharp and points directly to the core issue: **this isn't a substantive disagreement about a single criterion, but a collision of two distinct questions disguised as one**. The camps are talking past each other because "demos" is being used for two irreducibly different roles in democratic legitimacy. Let's diagnose concretely, then map a path out.

  ### 1. Diagnosis: What Each Camp is *Actually* Committed To  
  | **Camp** | **Core Question** | **Foundational Commitment** | **What They Ignore/Handwave** |
  |----------|-------------------|----------------------------|------------------------------|
  | **All-Affected Interests** | *"Whose interests morally deserve consideration in this decision?"* | **Non-voluntarist legitimacy**: Authority is justified by its consequences. If a decision alters your well-being, you have a moral claim to shape it. Power must answer to those it impacts. | How to *institutionalize* inclusion without a pre-political boundary. Who counts as "affected"? (A sneeze in China affects you probabilistically.) |
  | **All-Subjected to Coercion** | *"Who is practically bound/enforced against by this decision?"* | **Voluntarist (or proceduralist) legitimacy**: Authority is justified by reciprocal obligation. If the state can jail/fine/compel you, you must be part of the authorizing body. The demos is defined by the state's coercive reach. | Those catastrophically affected *without* being subject (e.g., climate refugees). The circularity: "the people" are defined by the state that claims to act in their name. |

  **Why the Examples Don't Move Anyone**:  
  - **Downwind emissions victim**: For All-Affected, this is a moral outrage—proof that legitimacy requires inclusion beyond borders. For All-Subjected, it's irrelevant because legitimacy isn't about impact; it's about who authorized the coercive *mechanism* (e.g., the polluting state's laws).  
  - **Minimally-affected prosecuted person**: All-Subjected sees this as the essence of legitimacy—coercion demands authorization. All-Affected dismisses it as a distraction; what matters is the *stakes*, not the enforcement mechanism.  

  **Your Insight is Key**: The "units-of-selection" analogy fits perfectly. "Demos" conflates:  
  - **The Authorizing Agent**: The collective body that confers legitimacy *via procedure* (All-Subjected's focus).  
  - **The Moral Constituency**: The set of beings with a stake in outcomes (All-Affected's focus).  

  These roles *can* overlap (e.g., citizens in a well-bounded state), but they pull apart at the edges (climate change, migration, global markets). Neither camp is "wrong"—they're optimizing for different things.

  ---

  ### 2. The Stalemate is a Philosophical Tectonic Plate Collision  
  This isn't *just* verbal confusion or empirical disagreement—it's a **clash of foundational commitments**:  
  - **All-Subjected** accepts the state as the inescapable frame. It bites the circularity bullet: democracy starts *somewhere*, and coercion defines the "who." Its strength is institutional realism.  
  - **All-Affected** rejects the state as morally prior. It demands a pre-political grounding, but **this is its fatal flaw**: any "affected" threshold (e.g., "significant impact") is either arbitrary or infinitely expansive. There’s no neutral way to draw the line without smuggling in politics.  

  This is why you’re circling: **you’re not debating democracy—you’re debating meta-political authority**.

  ---

  ### 3. What Counts as Progress: A Realistic Path Forward  
  Forcing consensus is impossible, but you can reframe to escape the loop. Here’s how:  

  #### Step 1: **Disentangle the Questions Explicitly**  
  Stop asking "Who is the demos?" Ask instead:  
  - *Q1 (Legitimacy of Coercion)*: Who must authorize a decision to make its enforcement legitimate?  
  - *Q2 (Moral Inclusion)*: Whose interests must be considered to make a decision just?  
  **Progress**: Admitting these are separate dissolves the false dilemma. Many decisions need both answers (e.g., climate policy: Q1 = citizens of emitting states; Q2 = global victims).  

  #### Step 2: **Concede Each Camp’s Fatal Weakness**  
  - **All-Affected** must admit: Without a prior institutional boundary, "affectedness" collapses into moral claims *about* democracy, not a workable procedure.  
  - **All-Subjected** must admit: Bounding the demos by state coercion is morally arbitrary (why not city-states or global govt?) and ignores structural power (e.g., colonial trade deals).  
  **Progress**: This forces humility. The theories are *complementary tools*, not universal solutions.  

  #### Step 3: **Shift to Contextual Application**  
  Ask: *"Which question matters more for this specific problem?"*  
  - **Domestic criminal law?** All-Subjected dominates—coercion is direct, impacts are local.  
  - **Climate policy?** All-Affected is urgent—impacts are global, coercion is indirect.  
  **Progress**: Pragmatic hybrids emerge. Example: All-Subjected sets the *core demos* (voters), while All-Affected demands *accountability mechanisms* (treaties, courts) for outsiders.  

  #### Step 4: **Face the Meta-Problem**  
  Ultimately, democracy’s boundary problem has no clean solution because:  
  - **All-Subjected** presupposes a polity (it’s circular).  
  - **All-Affected** presupposes a moral theory (it’s question-begging).  
  **Progress**: Admit this is a **permanent tension in democratic theory**. The "solution" is ongoing contestation, not a principle.  

  ---

  ### Why Nothing Has Moved You (and What Might)  
  You’re stuck because **each camp's strength is the other's weakness**, and both examples exploit this. To break the cycle:  
  - **Stop weaponizing examples**. They’re designed to embarrass the other view, not learn.  
  - **Map the overlap**: Where do both camps agree? (e.g., residents facing a local dam.) Start there, then track divergence.  
  - **Ask practical questions**: "How would your demos rule on Brexit’s Irish border? Who gets a say?" Concrete tests reveal trade-offs.  

  This isn’t a pseudo-problem—it’s democracy’s founding paradox. Progress comes when you see the camps as two legs democracy stands on, not rivals. One leg (All-Subjected) asks how power gains authority; the other (All-Affected) asks where authority’s limits lie. Cut one off, and democracy collapses.
