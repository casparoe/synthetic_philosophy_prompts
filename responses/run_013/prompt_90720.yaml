prompt: |-
  Ok so I'm a junior in high school and I need help with something kinda specific. I play center mid on my school's soccer team and I'm also in the jazz band on trumpet, so like 90% of my life is doing stuff where a bunch of us have to do a thing together on purpose — a give-and-go, a horn section nailing a hit at the exact same time, keeping the groove locked. And in my philosophy club (yes, I'm that kid) we've been reading about "joint action" and "collective intentionality," which is basically philosophers asking what it even means for two or more people to intend to do something *together*, instead of each person just having their own plan that happens to line up with everyone else's.

  Here's what I want. Act like someone who knows this literature cold — a philosopher of mind / action theorist who's read all the Bratman and Searle and Gilbert type stuff, and also, ideally, has actually played in a band or on a team so you know what it feels like from the inside.

  Restate the main positions in this debate using the vocabulary I actually have: huddles, calling a play, the give-and-go, listening, anticipating where your teammate is gonna be, keeping time, comping, a real combo vs. four people who just happen to be playing at once. Do it as faithfully as you can — don't water it down, and don't smuggle in stuff from my vocabulary and then pretend it was theirs.

  The positions I think I want (tell me if I'm carving it up wrong): 1) the one where a joint intention is nothing over and above each person's own intention plus them knowing about each other's plans and those plans fitting together; 2) the one where "we intend" is its own real thing, like a genuinely plural subject that isn't just a sum of individual minds; 3) the one where what makes it joint is that everyone's bound by a commitment, so joint action comes with obligations kinda like a promise, even if nobody said anything out loud.

  Then the part I actually care about: the residue report. What carried over cleanly into team/band talk, what I had to fudge or distort to make it fit, and what has *no* counterpart in how a team or band actually works. And then the real question — when something doesn't survive the translation, is that because my vocabulary is missing something real, or because the philosophers' claim was less clear than it sounded? I definately suspect it's all just coordination with extra steps, so tell me where that hunch is right and where it's wrong.

  Think carefully, and start by brainstorming a few candidate translations for each position before you commit to one — I want to see your shortlist, including the ones you threw out and why.

  Give it back to me as a JSON object so I can paste it into my notes, with these fields:
  - "brainstorm": array of objects, each { "position", "candidates_considered" (array of short strings), "why_rejected" (string) }
  - "positions": array of objects, each with:
    - "label": short name for the position
