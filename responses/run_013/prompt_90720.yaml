    - "in_my_words": the restatement in band/team terms (a decent paragraph, not just bullets)
    - "translated_cleanly": array of strings
    - "needed_fudging": array of objects { "what", "how_it_got_distorted" }
    - "no_counterpart": array of strings, each naming something that can't be said in team/band talk
  - "residue_verdict": { "is_it_a_defect_of_my_vocabulary": true/false, "why": string }
  - "sharpest_residue": { "thing": string, "why_it_matters": string }
  - "bottom_line": one short paragraph
  - "am_i_wrong": where my "it's just coordination" hunch holds up and where it doesn't

  Keep it honest — if a position barely translates, just say so instead of forcing it. Thanks!
