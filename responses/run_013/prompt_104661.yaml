prompt: |-
  So I've fallen down a YouTube-and-Reddit hole about Bell's theorem and entanglement — no physics training at all, just a lot of free evenings and a physics-adjacent freind who's patient with me — and there's one sentence that keeps getting thrown around in the comment sections to shut down arguments: "correlations always come from a common cause." The annoying part is that it gets used to reach opposite conclusions. Some people wave it to insist the spooky correlations between entangled particles must come from something the particles secretly share, so quantum mechanics is just an incomplete story with a deeper cause underneath. Others wave the same sentence to say the experiments already killed that possibility — that no shared thing in the particles' past can explain the correlations without either something travelling faster than light or something fishy about how the detectors got set in the first place. And then one guy said the detector settings themselves could be secretly correlated with the particles all the way back to the big bang, and everyone piled on him for "conspiracy" without anyone being able to say which assumption he was actually violating. I dont know which side is even using the sentence correctly.

  What I want is for you to take that one sentence and pull it apart into the different precise things it could be claiming — a menu, basically, from the version that's almost trivially true up to the version that's a serious claim about how the world is put together — and then tell me, for each one, whether it's really true, or plausible, or just false, and what would have to be the case for the argument it's being used in to go through. In particular I'd like to know which reading is doing the work when someone says the correlations must have a hidden common cause, which reading is doing the work when someone says Bell's theorem rules that out, and what exactly the conspiracy guy is denying, and whether denying it is as crazy as the thread made it sound. If there's a version of the sentence that's about statistics rather than about causes, I want that one too, because I suspect a chunk of the arguing is people using the same words for different things.

  Also — and this might be a separate point or might be the same point and I can't tell — does the sentence say anything about whether the common cause has to be in the past? And is the thing about the detector settings being correlated with the particles part of the same claim or a whole other assumption layered on top? Lay it out as a list I can actually follow, with a verdict on each reading and a note on which readings are about the world and which are only about our models, rather than just telling me the right answer — because I don't think there's one right answer to what the sentence means, and that's kind of what's bugging me.
