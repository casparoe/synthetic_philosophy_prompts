answer: |-
  ## Pantoum of the Sunken Steeple

  **Stanza 1 (Memory)**
  *The sea took the church in one judging night.*  
  **The cores show thirty years of settling ground.**  
  A sudden judgement, extinguishing the light.  
  **A slow collapse, where no firm foot was found.**

  **Stanza 2 (Record)**
  **The cores show thirty years of settling ground:**  
  **Saltwater lense dissolving peat below.**  
  **A slow collapse, where no firm foot was found,**  
  *While bells still rang above the creeping flow.*

  **Stanza 3 (Memory)**
  **Saltwater lense dissolving peat below.**  
  *The righteous wave that swept the spire away!*  
  **While bells still rang above the creeping flow,**  
  *We mark the date we lost the light of day.*

  **Stanza 4 (Record)**
  *The righteous wave that swept the spire away!*  
  **Tide logs chart inches gained by patient surge.**  
  *We mark the date we lost the light of day.*  
  **No single breach, just land's reluctant purge.**

  **Stanza 5 (Memory)**
  **Tide logs chart inches gained by patient surge.**  
  *God's fist unclenched, revealed our hidden sin.*  
  **No single breach, just land's reluctant purge.**  
  *The salt still stings the wounds we hold within.*

  **Stanza 6 (Swapped Ground)**
  *God's fist unclenched, revealed our hidden sin.*  
  **The cores show thirty years of settling ground.**  
  *The salt still stings the wounds we hold within.*  
  **The sea took the church in one judging night.**

  ---

  **How it works:**

  1.  **Voices:** Alternates by stanza. Memory speaks first (Stanza 1), then Record (Stanza 2), back to Memory (Stanza 3), Record (Stanza 4), Memory (Stanza 5), and finally the **swapped ground** (Stanza 6).
  2.  **The Pantoum Loop:** Follows the strict form: Lines 2 & 4 of each stanza become Lines 1 & 3 of the next. The final stanza closes the loop by bringing back Lines 1 & 3 from the *first* stanza, but crucially **in swapped positions**.
  3.  **The Swap:** Stanza 6 takes Line 1 from Memory's opening ("The sea took the church...") and Line 3 from Record's opening ("The cores show thirty years...") and *assigns them to the opposite voice*. Memory now states the Record's fact ("The cores show..."), and the Record now states Memory's core event ("The sea took the church..."). They are inextricably tangled.
  4.  **No Resolution:** The poem ends with the two foundational statements swapped, mirroring the opening but inverted. Neither "wins." The final line loops back mentally to the very first line, emphasizing the inescapable cycle of both the form and the contested history. The discomfort ("salt still stings," "no firm foot was found") persists.
  5.  **Accuracy:** Includes sedimentological concepts (cores, settling ground, saltwater lense dissolving peat, compaction) and record-keeping (tide logs) contrasted with the visceral, moral language of communal memory (judging night, righteous wave, God's fist, hidden sin, wounds). The physical reality ("inches gained by patient surge," "land's reluctant purge") clashes with the singular, moralizing event.
  6.  **The Work:** The pantoum's repetitions force both narratives to constantly reassert themselves against the counter-claim, mirroring how such histories persist in a community. The swap reveals their interdependence – each telling reshapes and is reshaped by the other. The loop is the argument.
