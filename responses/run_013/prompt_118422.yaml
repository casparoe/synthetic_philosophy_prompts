answer: |-
  ## Research Proposal: Disaggregating Welfare Metrics in Wild Animal Ethics of Habitat Destruction  

  **Project Title:**  
  Counterfactual Welfare, Population Ethics, and the Moral Arithmetic of Habitat Alteration  

  **Core Question:**  
  *When evaluating the welfare consequences of habitat destruction on wild animals, how should we separately account for (a) the welfare impact on current inhabitants during intervention, (b) the welfare impact on potential future inhabitants prevented from existing, and (c) the relationship between these impacts and ecosystem health claims? Specifically, does the moral disvalue of rapid destruction (high acute suffering, short-term) versus gradual degradation (lower per-capita suffering but population extinction) depend on whether typical lives in that habitat are net positive or net negative?*  

  ### Why the Existing Framing is Inadequate
  Current debates conflate three distinct welfare quantities:  
  1. **Present Welfare Experience (PWE):** The suffering/well-being of existing animals *during* habitat destruction.  
  2. **Counterfactual Welfare Differential (CWD):** The difference in welfare between animals who *would have lived* in the preserved habitat versus those who exist (or don’t) post-destruction.  
  3. **Ecosystemic Welfare Proxy (EWP):** Ambiguous claims about "ecosystem health" or "natural balance" as a moral good in itself.  

  This conflation renders questions like "Is habitat destruction good or bad for animals?" indeterminate. Utilitarian defenses of destruction (arguing wild lives are net-negative) ignore PWE and CWD trade-offs. Conservationist rejections often tacitly invoke EWP without justification. Neither addresses the *temporal distribution* of suffering (concentrated vs. diffuse) or the *demographic stakes* (truncated lives vs. prevented lives).  

  ### Methodology: Philosophical Analysis with Welfare Economic Modeling  
  Field data alone cannot resolve this because it is fundamentally a problem of:  
  - **Conceptual Disaggregation:** Clarifying PWE, CWD, and EWP as distinct moral objects.  
  - **Normative Weighting:** Developing a framework to compare acute suffering (e.g., violent deaths during rapid clearance) versus chronic suffering reduction (e.g., avoiding generations of hardship via non-replacement).  
  - **Population Ethical Modeling:** Using welfare economics tools (e.g., person-affecting views vs. total/symmetric views) to handle counterfactual populations.  

  **Steps:**  
  1. Map the welfare states: Define welfare ranges for typical animals in a habitat (e.g., net-negative/positive baseline).  
  2. Model intervention scenarios:  
     - *Rapid clearance:* High PWE harm (violent death), immediate CWD impact (all future lives prevented).  
     - *Gradual degradation:* Low PWE harm (natural lifespans), delayed CWD impact (slow non-replacement).  
  3. Apply population ethical lenses:  
     - Does preventing net-negative lives create welfare *gains*?  
     - Is causing acute suffering to avoid chronic suffering permissible?  
  4. Interrogate EWP: Can "ecosystem health" claims be reduced to PWE/CWD? If not, what moral weight do they carry?  

  ### A Defensible Conclusion  
  A successful outcome would be a decision framework specifying:  
  - When PWE dominates (e.g., if acute suffering is extreme and lives are net-positive).  
  - When CWD dominates (e.g., if baseline welfare is net-negative and prevention is reliable).  
  - How time discounting and uncertainty affect the calculus.  
  - Whether EWP has *independent* moral significance.  

  *Example conclusion:* "For habitats with net-negative lives, gradual degradation is preferable only if the welfare loss from prolonged existence exceeds the acute suffering of rapid clearance. Ecosystem health has no intrinsic moral weight unless reducible to individual welfare."  

  ### Criteria for Failure  
  The project fails if:  
  - The three welfare quantities cannot be rigorously distinguished.  
  - No applicable framework emerges for comparing temporal/distributional welfare impacts.  
  - The valence-dependence (net-positive vs. net-negative lives) proves irrelevant to the analysis.  

  ### Feasibility in Six Months  
  Six months is sufficient for:  
  1. Conceptual groundwork (2 months).  
  2. Developing comparative models (2 months).  
  3. Testing robustness across ethical assumptions (1.5 months).  
  4. Drafting the framework (0.5 months).  

  It is *insufficient* for empirical validation or complex simulation. However, this theoretical foundation is a prerequisite for meaningful empirical work. The deliverable will be a peer-reviewed paper establishing the framework, enabling future applied studies.  

  **Impact:** This work will replace muddled moral intuitions with a structured approach to habitat intervention ethics, informing conservation policy, welfare advocacy, and interdisciplinary research. By isolating the variables driving disagreement, it transforms an intractable debate into a quantifiable problem.
