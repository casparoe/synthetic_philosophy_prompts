  ## Joint Statement on Conceptual Slippage in Analogical Reasoning

  ### 1. Preamble and Shared Microdomain

  For the past two years, we have jointly investigated the phenomenon of conceptual slippage in analogical reasoning. Conceptual slippage refers to the way a concept or operation appears to bend, stretch, or drift in meaning when applied across different contexts within an analogy problem. We have converged on two distinct theoretical positions, which we label as follows:

  - The **structure-first camp** maintains that the space of concepts is fixed in advance by a predefined vocabulary of descriptors (e.g., the primitive operations and their combinations). Analogical mapping is fundamentally the alignment of relational structures: given an initial example (A transformed to A'), one identifies a transformation function (built from the primitives) that explains the mapping and then applies it to a target (B) to yield B'. Slippage arises as a byproduct of the search process over the fixed concept space, typically when multiple candidate transformations fit the initial example and the choice among them must be adjusted for the target.

  - The **concept-first camp** holds that concepts themselves are not fixed but are dynamically reconstituted during the analogical process. There is no predefined space of transformations to search; instead, slippage is the constitutive mechanism of analogy. Concepts (like the operations) are stretched or reinterpreted on the fly to achieve a coherent mapping, and this reinterpretation is essential to how analogy functions.

  To ground our discussions and avoid the pitfalls of overused examples, we have adopted a constrained microdomain. The domain consists of strings of small positive integers (e.g., [1,2,3], [4,1]) and a fixed inventory of nine primitive operations: (1) increment every element, (2) double every element, (3) square the last element, (4) reverse the order, (5) delete the first element, (6) delete the last element, (7) append a copy of the last element, (8) insert the successor of the last element, and (9) group the string either into consecutive runs of equal elements (run-grouping) or into two halves (halve-grouping; for odd-length strings, the first half has one more element). 

  An analogy problem in this domain is defined by three strings: an initial string A, a transformed string A' (which is the result of applying an unknown sequence of operations to A), and a target string B. The task is to produce the transformed target string B' by inferring the transformation from A to A' and applying it to B. Conceptual slippage occurs when the interpretation of the transformation must shift (i.e., the operations or their order must be reinterpreted) to yield a plausible B' from B.

  ### 2. Agreed Claims

  We agree on the following substantive claims about the microdomain and the phenomenon of slippage:

  1. **Non-uniqueness of Transformation Reading**: For any given pair (A, A'), there are typically multiple sequences of primitive operations that could transform A to A'. Hence, the initial transformation does not determine a unique reading.

  2. **Role of String Structure**: The applicability and effect of primitive operations depend critically on the structural properties of the string (e.g., length, element values, runs of identical elements). Operations such as deleting the first element or appending a copy of the last element are only defined for non-empty strings and behave differently for strings of different lengths.

  3. **Evidence of Slippage**: Slippage is evidenced when a transformation sequence that maps A to A' cannot be applied verbatim to B to yield a coherent B', and a different sequence (or reinterpretation of the same operation) must be used for B. For example, an operation that depends on the last element being small might become problematic if the last element of B is large.

  4. **Limits of Primitive Expressiveness**: The primitive operations cannot express all possible string transformations. In particular, they are limited to local and global operations that do not condition on complex patterns (e.g., "if the string has a run of two identical elements, then increment the first element of that run" is inexpressible with the given inventory).

  5. **Grouping Operations as Higher-Order**: The grouping operations (run-grouping and halve-grouping) introduce a level shift by creating nested structures. This means that subsequent operations (if any) must be defined on groups, but the inventory does not include operations that act on grouped structures. Thus, if A' is a grouped structure, the transformation is constrained to have grouping as the last step.

  6. **Artifacts of Notation**: The string notation (with square brackets and commas) is a representational artifact; the concepts we study are about sequences and transformations, not the symbols. However, the choice of operations (e.g., "square the last element") might inadvertently highlight positional (e.g., last) or numerical properties, which may not be central to the underlying concept.

  7. **Dependence on Problem Presentation**: The perceived salience of certain operations over others can be influenced by the specific integers chosen (e.g., small integers make squaring less drastic) and the order of presentation. This is an artifact of the microdomain that does not necessarily reflect conceptual processes in richer domains.

  8. **Slippage as Ubiquitous**: In this microdomain, slippage is not rare; it occurs in a significant fraction of analogy problems due to the variability in string structures between A and B.

  9. **No Perfect Alignment**: There exist pairs (A, A') and B such that no sequence of primitive operations can transform A to A' and then B to a B' that preserves the same operational interpretation without slippage. Slippage is sometimes necessary.

  10. **Role of Background Knowledge**: Although the microdomain is minimal, participants bring background knowledge (e.g., that integers can be incremented, doubled, etc.) which influences the choice of operations. However, the inventory is fixed and known, so the background is controlled.

  ### 3. Residual Disagreements

  We have fundamental disagreements on the following points, stated here in the language of each camp:

  1. **Fixed vs. Dynamic Concept Space**:
     - Structure-first: The set of concepts (i.e., the primitive operations and their compositions) is fixed prior to any analogy problem; slippage occurs when the search process selects a different composition from this fixed set for the target than for the initial example.
     - Concept-first: The concepts themselves (e.g., what "doubling" means) are dynamically reconstituted during the analogical process; the space of concepts is generated on the fly, and slippage is the mechanism by which this generation occurs.

  2. **Nature of Slippage**:
     - Structure-first: Slippage is a failure mode of the search process, indicating that the initial transformation was underdetermined and a different transformation from the fixed space must be selected for the target.
     - Concept-first: Slippage is the essential process of analogy; it is not a failure but the means by which concepts adapt to new contexts, enabling the extension of the transformation to the target.

  3. **Role of Stochasticity**:
     - Structure-first: Stochastic or temperature-like parameters (e.g., in probabilistic search) are eliminable conveniences; the underlying mechanism is deterministic search over a fixed space, and randomness only models uncertainty in selection.
     - Concept-first: Stochasticity is an essential feature of the mechanism, reflecting the inherent indeterminacy in concept formation; without it, the dynamic generation of concepts cannot be explained.

  4. **Constitution of Analogy**:
     - Structure-first: The analogical relation is constituted by the alignment of relational structures (i.e., the transformation function) that exists independently of the concepts' application to specific cases.
     - Concept-first: The analogical relation is constituted by the process of conceptual slippage; there is no analogy without the dynamic adjustment of concepts.

  5. **Primacy of Transformation**:
     - Structure-first: The transformation (as a function) is primary; it is discovered from A to A' and then applied to B.
     - Concept-first: The transformation is emergent; it is only defined in the act of mapping both A to A' and B to B', with slippage as the bridge.

  ### 4. Cruxes

  | Crux | Case / Argument / Experiment | Structure-first Prediction | Concept-first Prediction |
  |------|------------------------------|----------------------------|--------------------------|
  | Fixed vs. Dynamic Concept Space | Present a novel operation not in the inventory (e.g., "triple every element") in a training phase, and then see if participants use it spontaneously in an analogy problem without explicit instruction. | Participants will not use the novel operation because the concept space is fixed to the known inventory. The fixed set of primitives constrains the search space. | Participants may generate the novel operation by stretching existing concepts (e.g., extending "double" to "triple") because concepts are dynamically reconstituted. |
  | Stochasticity as Essential | Compare two computational models: one with a fixed temperature parameter and one without. Test on problems where multiple interpretations are possible and measure the variability in human responses. | A model without stochasticity (using deterministic search with tie-breaking) can account for human data as well as a stochastic model, showing that randomness is eliminable. | Models without stochasticity will fail to capture the diversity of human responses; stochasticity is necessary to explain the distribution of slippage outcomes. |
  | Slippage as Failure vs. Mechanism | Analyze a problem where slippage occurs and measure the time taken and error rates. If slippage is a failure, it should cause delays and errors; if it is the mechanism, it may be fast and accurate. | Slippage cases will show increased response times and errors because they require costly search for an alternative transformation. | Slippage cases will not necessarily show delays or errors; when the concept adapts fluidly, it may be as efficient as non-slippage. |
  | Grouping Operation Flexibility | Use a problem where A is transformed by halve-grouping, then B has an odd length. If the grouping is fixed, it must use the same rule (e.g., first half larger). | The grouping operation will be applied to B using the same rule as for A (e.g., for odd length, first half has one more) because the operation is fixed. | The grouping rule might be adjusted (e.g., for B, the halves might be equal by ignoring the middle element) because the concept of "halving" is stretched to fit the context. |

  ### 5. Worked Example

  Consider the following analogy problem:

  - Initial string A: [1, 2]
  - Transformed string A': [2, 4, 4]
  - Target string B: [3, 4]

  We must produce B' by applying the same transformation that turned A into A' to B.

  **Structure-first reading of A to A':**
  One possible transformation sequence is: 
  1. Double every element: [1,2] -> [2,4]
  2. Append a copy of the last element: [2,4] -> [2,4,4]
  Thus, A' = [2,4,4].

  Another possible sequence is:
  1. Increment every element: [1,2] -> [2,3]
  2. But [2,3] is not [2,4,4], so this doesn't work. Alternatively:
  1. Insert the successor of the last element: [1,2] -> [1,2,3] (successor of 2 is 3)
  2. Then double every element: [1,2,3] -> [2,4,6] -> not [2,4,4]. 
  So the first reading (double then append) is plausible.

  Applying this to B: 
  1. Double every element: [3,4] -> [6,8]
  2. Append a copy of the last element: [6,8] -> [6,8,8]
  Thus, B' = [6,8,8].

  **Concept-first reading of A to A':**
  The transformation might be interpreted as "double the entire string and ensure the last element is repeated." But when applied to B, the concept of "doubling" might slip because the elements are larger. Instead, the operation might be reinterpreted: perhaps the transformation is "increment the first element and double the last element, then append a copy." For A: increment first: 1->2, double last: 2->4, then append: [2,4,4]. For B: increment first: 3->4, double last: 4->8, then append: [4,8,8]. So B' = [4,8,8].

  Alternatively, the concept of "append a copy of the last element" might be stretched to include appending a modified version. But in this case, the two readings yield different B's: [6,8,8] vs. [4,8,8].

  **Divergent Answers:**
  - Structure-first: B' = [6,8,8]
  - Concept-first: B' = [4,8,8] (if they reinterpret the operations as acting element-wise with modification)

  **Testing Cruxes:**
  1. **Fixed vs. Dynamic Concept Space**: The concept-first reading invokes a new operation (element-wise modification: increment first and double last) that is not in the primitive inventory. Structure-first would reject this because it's not a composition of the fixed primitives. But concept-first allows generating this new operation by bending the existing concepts.

  2. **Slippage as Failure vs. Mechanism**: Structure-first sees the need for a different interpretation as a failure of the initial reading (which was double then append) to generalize, so they stick to the fixed operations and get [6,8,8]. Concept-first embraces the slippage to create a new operation that fits both A and B, yielding [4,8,8]. 

  This example shows that the two camps not only produce different answers but also diverge on whether the slippage involves selecting from a fixed set or generating a new concept.

  ### 6. Verbal Disputes

  Part of our two-year disagreement may stem from terminological differences. The term "concept" itself is at issue: for the structure-first camp, a concept is a fixed descriptor (like a primitive operation), while for the concept-first camp, a concept is a malleable mental construct. Similarly, "slippage" is described by structure-first as a shift between predefined concepts, but by concept-first as the transformation of a concept itself. Without disambiguating these terms, we risk talking past each other. Additionally, "fixed space" in structure-first refers to the inventory of operations and their compositions, whereas concept-first denies such a space exists prior to the analogical act. Clarifying these definitions is essential.

  ### 7. Signatures

  - **Structure-first camp**: We would change our position if it were demonstrated that participants consistently generate and use operations outside the predefined inventory in a way that cannot be reduced to compositions of primitives.
  - **Concept-first camp**: We would change our position if it were shown that all cases of slippage can be explained by selection from a fixed set of transformations without any dynamic reconfiguration of concepts.

  ---

  This joint statement, drafted in neutral terms, allows both camps to present their views and identifies key areas for empirical testing. We agree to publish this as a foundation for our separate papers.
answer: |-
  ### Joint Statement on Conceptual Slippage in Analogical Reasoning  

  #### 1. Preamble and Shared Microdomain  
  This statement addresses a two-year debate on **conceptual slippage**—the phenomenon where a concept (e.g., an operation or structural relation) changes interpretively during analogical reasoning. We adopt a constrained microdomain to isolate slippage: strings of small positive integers (e.g., `[1, 3, 2]`) transformed via nine primitive operations:  
  - **Increment every element** (e.g., `[1,2] → [2,3]`).  
  - **Double every element** (e.g., `[1,2] → [2,4]`).  
  - **Square the last element** (e.g., `[1,2] → [1,4]`).  
  - **Reverse the order** (e.g., `[1,2] → [2,1]`).  
  - **Delete the first element** (e.g., `[1,2,3] → [2,3]`).  
  - **Delete the last element** (e.g., `[1,2,3] → [1,2]`).  
  - **Append a copy of the last element** (e.g., `[1,2] → [1,2,2]`).  
  - **Insert the successor of the last element** (e.g., `[1,2] → [1,2,3]`).  
  - **Group** into consecutive runs (e.g., `[1,1,2] → [[1,1],[2]]`) or halves (for even-length strings: `[1,2,3,4] → [[1,2],[3,4]]`; for odd-length: `[1,2,3] → [[1,2],[3]]`, first half larger).  

  An analogy problem comprises:  
  - **Initial string** \(A\) (e.g., `[1, 2]`).  
  - **Transformed string** \(A'\) (e.g., `[1, 4]`).  
  - **Target string** \(B\) (e.g., `[2, 3]`).  
  The task is to transform \(B\) to \(B'\) using the *same inferred transformation* that mapped \(A → A'\). **Slippage** occurs when the interpretation of this transformation shifts to solve \(B → B'\).  

  Two views frame our debate:  
  - **Structure-first camp** holds that concepts are fixed descriptors (e.g., "square the last element" has a predefined meaning). The analogical relation is structural alignment: a transformation (e.g., "apply operation X") is found via search over a fixed space of operations/sequences. Slippage arises when search fails for \(B\), forcing selection of an alternative from the fixed space.  
  - **Concept-first camp** holds that concepts have no fixed essence; they are dynamically reconstituted during analogy. Slippage is not a failure but the core mechanism: concepts (e.g., "squaring") stretch to fit new contexts, with no predefined space to search.  

  Both agree the microdomain defines unambiguous problems: \(A'\) must be derivable from \(A\) via ≥1 primitive operation, and slippage is observed when \(B\) demands reinterpretation.  

  ---

  #### 2. Agreed Claims  
  1. **Primitive operations are expressively limited**: They cannot represent context-dependent transformations (e.g., "if the string has duplicates, delete the first element; else, reverse").  
  2. **Non-unique readings**: No \(A → A'\) transformation is uniquely determined; multiple sequences (e.g., incrementing vs. doubling) can yield identical \(A'\).  
  3. **Slippage evidence**: Slippage occurs when the *minimal sequence* for \(A → A'\) cannot produce a structurally consistent \(B'\) for \(B\), necessitating reinterpretation.  
  4. **Positional sensitivity**: Operations like "square the last element" depend on absolute positions, not conceptual roles; e.g., "last" is fixed by index, not value.  
  5. **Grouping artifacts**: Grouping operations create nested structures, but subsequent operations (e.g., "double") cannot act on groups. This limitation is notational, not conceptual.  
  6. **Value dependencies**: Operations like squaring are sensitive to integer magnitude (e.g., squaring 3 vs. 1 yields larger jumps), but this reflects notation, not an inherent property of "squaring."  
  7. **Length dependencies**: Operations like deletion fail for length-1 strings, constraining analogy when \(|A| \neq |B|\).  
  8. **No compositionality guarantee**: Sequences of operations (e.g., "reverse then delete first") are not inherently compositional; their joint effect may resist decomposition.  
  9. **Slippage asymmetry**: Slippage likelihood increases when \(B\)’s structure (e.g., length, value distribution) diverges from \(A\)’s.  
  10. **Overlap in primitives**: Some operations are functionally similar (e.g., "append copy of last" vs. "insert successor of last" for \(A = [x,y]\)), enabling ambiguous readings.  

  ---

  #### 3. Residual Disagreements  
  1. **On the concept space**:  
     - Structure-first: Concepts are discrete, predefined units; slippage selects among them.  
     - Concept-first: Concepts are fluid; slippage *redefines* them.  
  2. **On transformation ontology**:  
     - Structure-first: The transformation is an independent entity (a sequence) discovered from \(A → A'\).  
     - Concept-first: The transformation is inseparable from its application to *both* \(A\) and \(B\).  
  3. **On stochasticity**:  
     - Structure-first: Stochastic search (e.g., temperature in sampling) approximates noise in selecting predefined options.  
     - Concept-first: Stochasticity is intrinsic to concept generation; it models conceptual indeterminacy.  
  4. **On slippage necessity**:  
     - Structure-first: Slippage is avoidable with richer fixed descriptors (e.g., adding "square *all* elements").  
     - Concept-first: Slippage is inevitable; richer descriptors merely relocate the slippage point.  
  5. **On analogy’s core**:  
     - Structure-first: Analogy aligns relational structures; slippage is peripheral.  
     - Concept-first: Analogy *is* slippage-driven conceptual adaptation.  

  ---

  #### 4. Cruxes  
  | Crux | Test Case | Structure-first Prediction | Concept-first Prediction |  
  |------|----------|---------------------------|--------------------------|  
  | **Fixed vs. dynamic concept space** | Humans solve \(A=[1,1] → A'=[1,4]\), then \(B=[2,2]\). \(A→A'\) could be "square last" or "double→square last." | Participants default to fixed operations. For \(B\), "square last" yields \([2,4]\); no new concepts emerge. | Participants generate new concepts (e.g., "apply op to all identical pairs"). \(B'\) could be \([2,16]\) ("square *each* last of identical pairs"). |  
  | **Stochasticity as essential vs. eliminable** | Model solving 100 variants of \(A=[3] → A'=[9,4]\) (ambiguous: "square→insert successor" or "insert→square last?"). Compare stochastic vs. deterministic models. | Deterministic search (e.g., shortest sequence) matches human performance; stochasticity is implementation noise. | Stochasticity predicts human response diversity (e.g., 60% choose "insert→square"); removing it reduces fit to human data. |  
  | **Slippage as failure vs. mechanism** | Measure time/accuracy for \(A=[1,2,3]→A'=[3,2]\), \(B=[4,5,6]\). \(A→A'\) requires "reverse→delete first" (length-sensitive). | Longer response times/errors for \(B→B'\): "delete first" fails for reversed \([6,5,4]\), forcing search for new sequence. | Comparable time/accuracy to non-slippage cases: "delete first" adapts to mean "delete largest-index element," yielding \([5,4]\). |  
  | **Grouping flexibility** | \(A=[1,2,3]→A'=[[1,2],[3]]\) (halve-grouping), \(B=[4,5]\). Halve-grouping requires even length. | Fixed operation: no \(B'\) possible (violates preconditions). Slippage = failure. | "Halve" redefined as functional split (e.g., first/last element groups), yielding \(B'=[[4],[5]]\). |  

  ---

  #### 5. Worked Example  
  **Problem**:  
  - \(A = [1, 1]\) → \(A' = [1, 4]\)  
  - \(B = [2, 2]\) → \(B' = ?\)  

  **Structure-first reading**:  
  - Minimal sequence for \(A→A'\): *Square the last element* (1→1, 1→4).  
  - Apply verbatim to \(B\): Square last element of \([2,2]\) → \([2, 4]\).  
  - **B' = [2, 4]**.  

  **Concept-first reading**:  
  - \(A→A'\) reinterpreted: The identical pair suggests "apply an operation to identical elements," with squaring as an instance. For \(B\), the concept "square last" slips to "square *all* elements in a duplicate run."  
  - Apply to \(B\): Square all elements → \([4, 4]\).  
