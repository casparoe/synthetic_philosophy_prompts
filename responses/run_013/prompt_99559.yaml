  #### 6. Verbal Disputes  
  We judge the dispute over "concept" to be terminological. Structure-first uses "concept" to denote *fixed descriptors* (e.g., discrete operations), while concept-first uses it for *malleable cognitive units*. This conflates ontology with mechanism. Similarly, "space" is contested: structure-first implies a searchable set, while concept-first denies its existence. The term "slippage" itself is overloaded—structure-first frames it as *selection between concepts*, concept-first as *transformation of a concept*. Clarifying these terms as "descriptor," "generative process," and "reinterpretation" may resolve false disagreement.  

