prompt: |-
  I am a philosopher — my own work is in the history of logic, and until this year I had never taught applied ethics — and a term of lecturing on life-and-death decisions has left me with a pattern I cannot name. The textbook cases I can manage: the trolley, the child in the pond, the doctor at the bedside. What I cannot manage is what happens when the agent is not a passerby but an ongoing concern. Two doctors, alike in intention, skill, and outcome: the first declines to put a dying patient on a ventilator, the second switches off a ventilator the patient has been on for a week. My students and I both feel a real difference between them, and the only difference in the world is whether a piece of equipment had already been attached — a fact nobody believes matters in itself. Or two states: one never establishes a programme that would have saved ten thousand lives; the other cancels such a programme. I want to say the second is worse, but when I try to say why I reach for a comparison with how things would have gone otherwise, and for a state there is no otherwise, since the state is part of the background in every scenario I can describe.

  What I think I am noticing is that in such cases the verdict is not read off the conduct at all. We settle first who is responsible, and then describe the conduct in whichever way makes that verdict come out; the same stretch of behaviour can be told as one act with a thousand omissions or as a thousand acts with one omission, and nothing in the world decides between the two tellings. I put the ventilator pair to a room of colleagues last month and got three confident and mutually inconsistent answers, which is what sent me looking for a name. I know there is a vast literature on the difference between bringing a death about and letting one happen, and that is precisely not what I am asking about; I want to know whether the thing I have described — the verdict riding on the description, and the description underdetermined, especially where there is no baseline because the agent is itself inside every available baseline — is a recognised phenomenon with a name of its own, or a mongrel of several.

  If the nearest established concept is the ordinary act/omission distinction, I need to be told exactly where my phenomenon parts company with it and which parts of what I have said are simply mislabelled. If there is no name, coin one, define it, and give me the boundary cases: one case that is plainly an instance, one that is plainly not, and what does the excluding. A label is the least of what I want — the carving is the point. So tell me whether I have one phenomenon or two, the description-sensitivity of how we individuate conduct on the one hand and the indeterminacy of the counterfactual baseline on the other, and whether the second survives being pressed on: is there, after all, a fact of the matter about what would have happened, and am I merely failing to see it? If the question as I have posed it cannot be answered well, or if my framing rests on a confusion, say so plainly rather than giving me something that sounds satisfying; I would rather be told that I have run two things together than be handed a single name that hides the seam.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle from someone deeply immersed in logic and ethics. The philosopher describes a pattern they've noticed while teaching applied ethics - a distinction between actions that seems significant but defies traditional ethical categorization.

  The core concern centers on how we judge actions versus omissions when the agent is an "ongoing concern" like a doctor or government, rather than a one-time actor. They present two key examples: (1) two doctors - one declining ventilator treatment initially, another withdrawing it after a week; (2) governments either never creating a life-saving program or canceling an existing one. In both cases, the outcomes are identical, yet we perceive moral differences.

  What's particularly interesting is their observation that our judgment seems to precede the description of the action. We decide who's responsible first, then frame the action to fit that verdict. The same behavior can be narrated as either one act with many omissions or many acts with one omission - with nothing objective determining which narrative prevails.

  They explicitly reject that this is about the classic doing/allowing distinction in ethics. Instead, they're identifying something more fundamental about how we individuate actions and establish baselines when the agent is part of the institutional context. The ventilator example produced three conflicting interpretations from colleagues, confirming this ambiguity.

  Their request is precise: either identify an existing concept that captures this phenomenon (with clear boundaries distinguishing it from act/omission distinctions), or coin a new term with definition and boundary cases. Most importantly, they want conceptual clarity - whether this involves two separate issues (description-sensitivity of action individuation and baseline indeterminacy) or one unified phenomenon.

  This requires careful handling. The response should avoid simplistic labeling and instead provide rigorous conceptual dissection. Key elements to address: the role of institutional agency, the narrative construction of responsibility, the problem of counterfactuals for systemic actors, and whether baseline indeterminacy is truly irreducible.

  The philosopher values intellectual honesty over comforting answers - they'd prefer being told they've conflated issues rather than receiving an elegant but inaccurate solution. This demands precision in distinguishing between: the metaphysics of action individuation, epistemology of responsibility ascription, and unique challenges posed by institutional agency.
answer: |-
  Your inquiry cuts to the heart of agency, description, and moral ontology in institutional contexts. What you're observing isn't primarily the act/omission distinction, nor the doing/allowing dichotomy. It's a deeper **metaphysical and normative instability** arising when:

  1.  **The agent is an institutional "ongoing concern"**: Not a discrete actor in a scene, but a persistent entity defining the scene itself.
  2.  **Action individuation is description-sensitive**: How we carve the "same" behavior into discrete acts/omissions depends entirely on prior normative commitments.
  3.  **The counterfactual baseline is agent-relative and indeterminate**: There is no "default" world against which to measure change *because the agent constitutes the background*.

  This phenomenon lacks a single, universally recognized name, but its components are discussed across several literatures. The closest established concept is **"The Problem of Institutional Moral Agency"**, but this is too broad. More precisely, you're encountering:

  ### The Institutional Baseline Indeterminacy Problem (IBIP)
  **Definition:** *The impossibility of establishing a morally neutral counterfactual baseline against which to evaluate the actions/inactions of an institutional agent, compounded by the inherent underdetermination of how to individuate the agent's conduct, leading to description-dependent moral verdicts.*

  **Why it parts company with Act/Omission:**
  *   **Act/Omission Distinction:** Assumes a clear baseline ("normal course of events") against which an intervention (act) or non-intervention (omission) is measured. It focuses on the *type* of causal involvement (doing vs. allowing).
  *   **IBIP:** Challenges the *existence* of a coherent, agent-independent baseline for institutional actors. The "ongoing concern" *is* the background. IBIP also highlights the prior problem of *how we describe the conduct itself* (e.g., is "cancelling a program" one act or the culmination of a thousand micro-decisions?). The verdict *determines* the description, not vice-versa. Act/Omission debates usually accept the description of the conduct as given.

  **Carving the Phenomenon:**
  You likely have *two tightly interwoven but conceptually distinct phenomena*:
  1.  **Description-Sensitive Action Individuation (DSAI):** How we parse a continuous stream of institutional behavior into discrete "acts" and "omissions" is not determined by physical facts alone. It depends on normative purposes, causal salience, and prior judgments of responsibility. (e.g., "Switching off the ventilator" vs. "Ending a course of treatment initiated last Tuesday" vs. "Failing to sustain life-support indefinitely").
  2.  **Agent-Constitutive Baseline Indeterminacy (ACBI):** For persistent institutional agents embedded in the fabric of the scenarios they act within, there is no privileged, agent-independent "state of nature" or "normal course of events" against which to definitively measure whether their conduct *altered* that course or *allowed* it to continue. The institution *defines* the relevant "normal" context. (e.g., For the state, "what would have happened otherwise" always includes *that state* acting or not acting in *some* way; there's no "state-less" counterfactual).

  **Boundary Cases:**

  *   **Plainly an Instance (Ventilator - Withdrawal):** Doctor B switches off the ventilator after one week. Is this a discrete act of killing, or the cessation of an ongoing artificial intervention (an omission to continue extraordinary care)? The description chosen *determines* the moral verdict, and there's no physical fact (like the machine being attached) that *morally* compels one description over the other. The hospital context *is* the baseline.
  *   **Plainly an Instance (State Program):** State cancels an existing, functional program saving 10,000 lives/year. Is this an *act* of killing 10,000, or an *omission* to continue providing a benefit? Is "never establishing it" a single omission or the constant omission of establishing it daily? The state *is* the baseline provider (or not) of such programs; there's no "state of nature" baseline for healthcare provision.
  *   **Plainly NOT an Instance (Standard Trolley - Passerby):** A lone individual (not an official or institution) flips a switch diverting a trolley, killing one to save five. The baseline "trolley kills five" is clear and agent-independent. The description "flipping the switch" is relatively uncontested. Act/Omission/Doing/Allowing apply cleanly here. The individual doesn't constitute the background of the scenario.
  *   **What Does the Excluding?** The absence of a *persistent institutional agent defining the very context of the scenario*. In the passerby case, the agent is a discrete actor *within* a stable, pre-defined scene. The baseline ("trolley kills five") exists independently of the agent. Action individuation ("flipping the switch") is straightforward and uncontroversially tied to a physical event.

  **Is There a Fact of the Matter?**
  *   **DSAI:** There is likely *no* metaphysically privileged way to carve the stream of institutional behavior into discrete acts/omissions. Individuation is inherently purpose-relative and normative. We carve based on what we deem significant for assigning praise, blame, or causal explanation. The "thousand omissions/one act" dilemma is unresolvable by physical facts alone.
  *   **ACBI:** While specific, limited counterfactuals *might* be constructed ("If the doctor hadn't switched the ventilator off *at that moment*, the patient would have lived X minutes longer"), the *morally relevant baseline* ("What *should* the ongoing concern have been doing?") is irreducibly normative and contestable. There is no "view from nowhere" baseline for an institutional agent. Pressing harder reveals the normative core: We are arguing about what the institution's *role* and *duties* entail, not discovering a pre-existing factual baseline. The "no otherwise" problem persists because the agent's *existence* and *potential for action* are background constants.

  **Conclusion & Framing:**
  You have identified a profound and under-theorized challenge: **The moral evaluation of institutional action is fundamentally description-dependent because the institutional agent is ontologically prior to the scenario's baseline, and the individuation of its conduct is inherently underdetermined by non-normative facts.** This is IBIP.

  Your framing is *not* confused, but it highlights the limitations of individual-agent ethics models for institutional contexts. The "seam" you perceive is real: the entanglement of metaphysics (action individuation), epistemology (counterfactuals), and normativity (role duties, baseline expectations) when the agent *is* the stage. Hiding this seam with a single label would be a disservice. IBIP (or its components DSAI & ACBI) names the space where these problems collide uniquely for ongoing concerns.

  This phenomenon resonates with debates in:
  *   **Moral Luck:** (The ventilator attachment seems like circumstantial luck altering the act's description).
  *   **Non-Identity Problems:** (The state cancelling a program affects identifiable lives; never starting it affects non-identical lives).
  *   **Institutional Responsibility & Role Morality:** (Duties differ based on institutional role and existing commitments).
  *   **Causal Indeterminacy & Omissions:** (The difficulty of specifying "the" omission).

  However, IBIP captures the *unique confluence* of description-sensitivity *and* baseline indeterminacy *specifically* for the institutional "ongoing concern," which is your core insight. You haven't run distinct things together; you've exposed the complex knot they form in this domain.
