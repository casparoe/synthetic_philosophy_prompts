prompt: |-
  I'm a machine learning engineer — I build and train models for a living, and my working vocabulary is priors, architectures, hypothesis classes, inductive bias, sample complexity, generalization gaps, training signals, and negative examples. A friend of mine in linguistics has been trying to convince me that children could not possibly learn their first language from the language they hear, and the argument, as she presents it, runs roughly like this. The child's evidence is a finite, unlabeled sample of utterances with no indication of which strings are ungrammatical, so the child receives no negative examples at all; the generalizations the child does reach are stated over syntactic structure rather than over the linear order of the words; and the child apparently does not make the overgeneralizations the input would predict — she likes the example of verbs that permit both give the book to John and give John the book versus verbs that permit only one of those patterns, where the child somehow lands on the right restriction without ever being corrected. From this she concludes that the environment does not so much shape the grammar as trigger a structure already specified in advance, and that the constraints involved are specific to language rather than general-purpose. I find the shape of the argument familiar and I suspect I could restate the whole thing in the vocabulary I actually use, but I don't trust myself to do it without quietly changing it in the process.

  So I'd like you to restate her position, as faithfully as you can, in the vocabulary of statistical learning: priors, inductive bias, the hypothesis class, the training distribution, the objective, sample complexity, generalization, negative evidence, meta-learning, hierarchical priors, and no-free-lunch-style underdetermination results. Then give me the residue report. Which of her claims translate cleanly — is "the stimulus is impoverished" simply an informal statement of an underdetermination or sample-complexity result, or is it doing something the formalism cannot express? Which translate only under distortion — for instance, does "innate" just become "prior or architectural," and if priors can themselves be learned, as they are in hierarchical or meta-learning setups, does the innate/learned distinction survive the translation at all, or does it dissolve into a question about where in the hierarchy the bias sits? Which claims have no counterpart whatsoever — the idea that the environment triggers rather than shapes, the claim that the child's knowledge is genuinely represented rather than merely implicit in a disposition to behave, the suggestion that there is a single correct grammar the child is converging on?

  And then the part I actually care about. For each piece of residue, tell me whether my vocabulary is missing something real that she can see and I cannot, or whether her claim was doing less work than it appeared to and the translation simply exposes that. I want to know whether saying "the child needs an inductive bias" captures her argument, or is a way of changing the subject while appearing to agree with it.
