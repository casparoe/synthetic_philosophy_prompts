prompt: |-
  I'm a third-year PhD student in epistemology, working mainly on higher-order evidence. I've been trying to settle my own view about how evidence concerning the reliability of my own belief-forming processes should bear on what I actually believe, and I have a set of verdicts that I am fairly confident about one at a time but cannot get to add up. I would like you to tell me what principle, if any, they express, and which of them I ought to abandon.

  The cases, and my verdicts on them:

  1. Peer arithmetic. A colleague whose track record on this kind of calculation is indistinguishable from mine works a long division problem independently and arrives at a different quotient. I cannot find an error in my work, and I cannot find one in hers. Verdict: I should move a long way toward her answer, and it is not rational for me to keep insisting that my figure is the right one.

  2. The pill, trivial inference. A study I trust says that a pill I have just swallowed impairs logical reasoning for about an hour in most people. Ten seconds later I reason from two premises I can verify by looking out the window: if it is raining, the match is off; it is raining; so the match is off. Verdict: full confidence. The pill gives me no reason to think I slipped on an inference I can check at a glance.

  3. The pill, long derivation. Same pill, same hour, but now I reconstruct from memory a thirty-step derivation of a nontrivial theorem. Verdict: I should markedly lower my confidence in the result, because I may well have gone wrong somewhere I cannot spot.

  4. My own calibration record. Reviewing a log of my past judgments, I find that when I felt about 90% confident I turned out right roughly 70% of the time, and this has held up across many domains. I am now at 90% on a fresh claim. Verdict: I should be at roughly 70%, and the fact that I feel 90% is neither here nor there.

  5. The underconfidence finding. I am about to give a rough estimate of some quantity. I then read a well-replicated result showing that people with my exact training systematically and substantially underestimate their own accuracy on this kind of estimation task. Verdict: I should raise my confidence above what my unaided reasoning would have given. The higher-order evidence here moves me up, not down.

  6. The case I keep going back and forth on. I reason as carefully as I can about a hard question and conclude that P. I then become convinced that, under the conditions I was reasoning in, my conclusion is probably a product of overconfidence, so that given my total evidence P is not more likely than not. I find that I still believe P, and that this does not feel as irrational as the textbooks say it should; but I also would not stake much on P.

  Cases 2 and 4 strike me as demanding opposite treatment even though both are, on the face of it, just information about how someone with my cognitive profile processes evidence, and I suspect that any principle preserving both verdicts will need a rider clause doing real work. Case 6 is the one I cannot make up my mind about.

  So: is there a clean principle that gets all six, or close? State it precisely, give it whatever clauses it needs, and say what it predicts about a case I have not described. If no such principle exists, tell me which verdict to abandon and why the others are worth more than it.

  Please structure the response as follows: "The principle" (a precise statement of the best candidate, plus any rider clauses it needs, 150-250 words); "Earning its keep" (case by case, showing which clause each of my verdicts motivates, 500-700 words); "Extensions" (its verdicts on at least two cases I have not listed, around 300 words); "What I must surrender" (which of my verdicts the principle cannot accommodate, and which of my intuitions you would overrule, around 200 words); "Bottom line" (around 100 words).
reasoning: |-
  Okay, the user is a third-year PhD student in epistemology, focusing on higher-order evidence. They've presented six cases with their verdicts and are struggling to reconcile them into a consistent principle. They want to know if there's a clean principle that can accommodate all six, or if they need to abandon some verdicts. 

  First, I need to deeply understand each case and their verdicts. The peer arithmetic case suggests strong deference to a peer's calculation. The pill cases show that trivial inferences aren't affected, but complex derivations are. The calibration record indicates trusting base rates over current confidence. The underconfidence finding suggests boosting confidence due to known bias. Case six is tricky—they're unsure how to handle believing P despite knowing their reasoning was probably flawed.

  Hmm... The core tension seems to be between local and global higher-order evidence. Cases 2 and 4 are particularly telling: in case 2 (pill with trivial inference), the global evidence (pill impairs reasoning) doesn't override local checking, while in case 4 (calibration record), global evidence directly overrides current confidence. This suggests that the accessibility of error detection might be key. When errors are locally detectable (case 2), higher-order evidence doesn't bite; when they're not (cases 3-4), it does.

  For case 5, the underconfidence finding is interesting—it's higher-order evidence that should correct downward miscalibration. This fits if we see it as diagnostic input to recalibrate. Case 6 is messy because it involves a vague "probably a product of overconfidence" without specifics. The principle would demand suspension of judgment here, but the user's ambivalence ("would not stake much on P") might align with that.

  They might be wrestling with the role of phenomenology—why does feeling certain in case 2 feel justified while in case 4 it doesn't? The rider clause about local verifiability resolves this. Their hesitation in case 6 likely stems from conflating the persistence of belief (a psychological fact) with its rationality—the principle forces a uncomfortable but necessary distinction there.

  The hardest trade-off will be case 1 vs. case 6. Peer disagreement (case 1) requires significant deference, but in case 6, self-doubt about overconfidence might demand similar deference to the higher-order evidence. If they accept the principle, they must surrender the intuition in case 6 that clinging to P isn't wholly irrational—it is, strictly speaking. But their description ("would not stake much on P") hints they're already halfway there.
answer: |-
  ### The Principle  
  **Calibrated Defeat with Local Verifiability (CDLV):**  
  Rational credence should proportionally incorporate higher-order evidence (HOE) about the reliability of one's cognitive processes, except when the target belief's justification is *locally verifiable*—i.e., its truth or the correctness of its supporting reasoning can be directly assessed *at will* with minimal cognitive effort. HOE functions as a *calibrator*: it adjusts credence toward the objective success rate of one’s relevant cognitive process (e.g., 70% for 90% confidence in case 4). When HOE indicates systematic directional bias (e.g., underconfidence), it mandates *corrective adjustment* (e.g., boosting confidence). The rider clause: **Local verifiable beliefs are immune to HOE-based defeat** unless the HOE specifically targets the capacity for such verification.  

  *(191 words)*  

  ---

  ### Earning Its Keep  
  **Case 1 (Peer arithmetic):** HOE (peer disagreement) signals potential error in a complex process where errors are non-locally detectable. CDLV mandates moving toward the peer’s answer, as the calculation isn’t locally verifiable (you can’t "see" the error instantly). The shared unreliability overrides initial confidence.  

  **Case 2 (Pill, trivial inference):** The inference ("rain → match off") is locally verifiable: you can recheck the deductive step effortlessly. The HOE (pill) doesn’t impair *this specific capacity*, so immunity applies. Full confidence stands.  

  **Case 3 (Pill, long derivation):** The derivation is not locally verifiable—errors could lurk undetectably. HOE (pill) indicates general impairment, defeating confidence proportionally to the task’s complexity.  

  **Case 4 (Calibration record):** HOE (70% accuracy at 90% confidence) calibrates your current 90% credence down to 70%. The feeling of confidence is irrelevant—it’s a diagnostic input, not a justification.  

  **Case 5 (Underconfidence finding):** HOE reveals a *directional bias* (systematic underestimation). CDLV mandates corrective adjustment upward, overriding unaided reasoning. This is calibration for miscalibration.  

  **Case 6 (Self-doubt about overconfidence):** HOE ("my reasoning was probably unreliable") indicates a non-locally verifiable error (complex reasoning + conditions). CDLV demands lowering credence below 50%. Persisting belief is irrational—your "would not stake much" intuition aligns with low credence but conflicts with continuing to believe *P*. CDLV splits these: you may *feel* belief, but rational credence drops.  

  *(265 words; total 539 words)*  

  ---

  ### Extensions  
  **Extension 1 (The Obvious Lie):** You hear a trusted friend assert, "2 + 2 = 5," while sober. Later, you learn they’d taken a pill causing occasional blatant arithmetic errors. You verify "2 + 2 = 4" instantly.  
  *CDLV verdict:* Full confidence. The error is locally verifiable; HOE doesn’t target this capacity.  

  **Extension 2 (Calibrated Expert):** A climate scientist estimates 90% confidence in a complex model’s prediction. Later, she learns experts *with her specific methodology* are right only 60% of the time when 90% confident.  
  *CDLV verdict:* Credence drops to 60%. The model isn’t locally verifiable (unlike case 2), and HOE calibrates her process.  

  **Extension 3 (Biased Coin):** You flip a coin 10 times, see 7 heads, and estimate 70% heads-rate. You then learn people *in your exact state* (sleep-deprived, using this protocol) systematically overestimate bias by 15%.  
  *CDLV verdict:* Adjust down to 55%. HOE indicates directional bias requiring correction, even for simple stats.  

  *(149 words; total 300 words)*  

  ---

  ### What I Must Surrender  
  CDLV preserves verdicts 1–5 but forces abandonment of **Case 6’s intuition that persisting belief in *P* isn’t wholly irrational**. HOE that your reasoning was "probably unreliable under those conditions" defeats *P*—even if no error is found. Your residual belief is a psychological artifact, not rationality. The "textbooks are right": you *should* suspend judgment.  

  Additionally, CDLV overrules any vestigial hope that **case 4’s felt confidence** (90%) has justificatory weight. It is purely a symptom for calibration, not evidence for the belief.  

  *(103 words; total 203 words)*  

  ---

  ### Bottom Line  
  CDLV systematizes your verdicts by prioritizing *local verifiability* as immunity from HOE and treating other HOE as *calibrating data*. You must surrender Case 6’s ambivalence: if HOE indicts your reasoning, *P* loses rational support. The cost is rejecting doxastic inertia; the payoff is unifying arithmetic, pills, calibration, and bias-correction under one principle.  

  *(75 words)*
