  First, I need to unpack what the user is really after. They've listed several cases: cuckoo chick eviction, killdeer's broken-wing display, termite mound ventilation, sphex wasp rigidity, and hoverfly mimicry. Each illustrates different aspects of free-floating rationales. The user wants desiderata motivated by these cases, with clear distinctions (rationale vs. cause, type vs. token, etc.) and consistency requirements (non-purposive selection, defeasibility, non-vacuity). 

