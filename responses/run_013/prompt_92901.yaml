            - They might also attack the prior: why are H1 and H2 equally likely? The existence of the advanced civilization might be improbable? But we are to assume they are equally likely.

          Therefore, we have a clean separation.

          However, note: the problem said "the ratio of Boltzmann-brain observers to ordinary observers is the same number". We have that: in both, BBs/OOs = R.

          And we have held fixed the fluctuation rate and the proportion (R). The only thing we changed is the addition of AOs in H2.

          This is the thought experiment.

          One more point: the problem says "the self-locating principle we quietly imported at the start". Here we see that SSA and SIA are the two principles and they yield different answers.

