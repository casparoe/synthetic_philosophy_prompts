prompt: |-
  Ok so I need help settling something. My friend Dana and I had a fight last night — not a real fight, a philosophy fight, but it went on for like three hours and we both ended up just restating our positions louder, which is always a bad sign. The topic was whether I could have been a different person than I am, and more generally what it even means to say that a particular thing could have been otherwise.

  She's on the side where individuals are just plain identical across worlds. There's a world where I'm a plumber, and the me there is me — same person, different properties. If you ask her what makes it me and not some lookalike, she says that's the wrong question: its not that identity is earned by resemblance, the world just contains me with different properties, and demanding a criterion for cross-world identity is like demanding a criterion for identity across time.

  I'm on the counterpart side. I think I exist in exactly one world, this one, and every other world contains people who resemble me to various degrees and in various respects. When I say I could have been a plumber, that's true because there's a world where my counterpart — whoever is most like me in the relevant respects — is a plumber. So "could have been" isn't a property of me; it's a relation between me and a world, or between me and some world-bound individual in it.

  We know each other's moves cold. She says my view can't state what we wanted to state, because what we wanted to say is that things could have gone differently for me, and on my view the guy in the other world isn't me, so I've changed the subject. I say her view is just mine with a one-to-one, transitive, similarity-free counterpart relation smuggled in and relabeled "identity," and that she pays for it with alot of essentialist commitments she can't motivate. Then we stall. We can't find a case where the two views actually disagree about anything we independently care about.

  So we invented one, and I want you to tell me if it's a real disagreement or a trick of the example. Take me, and imagine a world W1 containing someone very like me in most respects — same temperament, same history, but a working musician instead of a frustrated one. Now imagine a world W2 containing someone very like the W1 person — same musical gifts, same tastes — but who has almost nothing in common with actual me, and that person is a violinist. On my view, "I could have been someone who could have been a violinist" comes out true, since W1-me has a counterpart who plays violin, while "I could have been a violinist" comes out false, since the W2 person isn't enough like actual me to be my counterpart. Dana says that's incoherent: if W1-me could have been a violinist, and W1-me is me, then I could have been a violinist, full stop. So we get different verdicts on a case. Is that a genuine difference in what the theories say, or did I rig it by letting the counterpart relation fail to be transitive?

  My hypothesis, which I'd like you to attack: this isn't a dispute about what's possible or about persons at all. It's a dispute about what carries the modal content. She thinks the individual carries it and the world is just a place the individual shows up; I think the world, or the counterpart relation, carries it and the individual is just a node. If that's right, is the disagreement verbal — two notations for one set of facts, where the "translation" between them quietly loses something — or is there a substantive question about which assignment of labor is correct, and what would settle it?

  What I want is a diagnosis, not a survey. Tell me what kind of disagreement this actually is, what each side would have to concede for it to move, and whether anything — a case, a distinction, a formal result — could count as progress, or whether the honest answer is that we should quit. And be straight about how confident you are in the diagnosis and which part of it you're least sure of, because I'm going to bring it up with her again and I don't want to get taken apart.
