prompt: |-
  I've been thinking alot about advance directives since my grandfather's stroke, and I keep landing on different answers depending on the case, so I want to know what rule I actually believe.

  Here's what I feel. A woman with advanced dementia signed a living will years ago refusing antibiotics if she got pneumonia. She gets pneumonia. She's cheerful, doesn't recognize anyone, says she wants to live, seems content enough. My gut: don't treat her. The person who wrote that will is the one who gets to decide. But take the same setup and change one thing — she wrote the will in the months right after her husband died, when she was barely sleeping and told her doctor she wanted it all over. Now I say treat her, that paper shouldn't count. Those two verdicts feel right and I can't make them sit together.

  A man wrote that he never wanted to be on a ventilator. He's on one, awake, alert, and begging to stay on it. Keep him on. Fine. But then a woman with early dementia writes a new directive revoking her old one, and I want to honor the new one, even though the new her is already fading. So it's not simply "whoever's competent now wins," and it's not simply "the earlier person always wins." Something else is doing the work and I don't know what.

  Two more. A guy in a coma; his brother says he once told him in a bar that he'd want everything done. I don't think that beats a signed directive. And someone writes: "if I ever convert to a religion, ignore everything I said before." That clause feels like it should have no power over a later self who means it, but I can't say why it's different from the dementia case.

  Is there one principle that gets these? If not, tell me which verdict I should give up, and what the principle it leaves me with predicts for a case I haven't listed. And if the whole way I've set this up is confused, just say so — I'd rather hear that than have you smooth it over. Keep it under 350 words.
reasoning: |-
  Okay, the user is grappling with the ethical complexities of advance directives, especially when the person's current state seems to contradict their prior written wishes. They've presented several hypothetical scenarios where their intuitive judgments conflict, and they're seeking a unifying principle. 

  Hmm, their examples reveal a tension between respecting autonomy (the "then-self") and protecting current well-being (the "now-self"). What's interesting is how they instinctively adjust their stance based on context—like dismissing a directive written during grief while upholding one from a stable period. 

  Their frustration is palpable—they want consistency but feel their judgments are situationally dependent. The bar conversation example shows they intuitively distinguish between formal/informal expressions of wishes, while the religion clause highlights how identity changes complicate things. 

  I notice they're not just asking for legal rules but for their own ethical compass. The dementia cases are particularly thorny because cognitive decline isn't binary. When they say the early dementia revision "should count," it suggests they view identity as continuous enough for that interim period. 

  The core struggle is: when does a prior version of yourself stop being "you"? My response should validate that this ambiguity is inherent—it's not them being inconsistent but the problem being genuinely layered. The "settled values" framing might help because it focuses on when prior decisions reflect durable convictions versus transient states. 

  ...Ah, and they explicitly welcome being told if their framework is flawed. Good—they want rigor, not reassurance. The word limit forces conciseness, so I'll skip edge cases and target their central conflict: the dementia/grief contrast best exposes the "settled values" principle.
answer: |-
  Your intuitions are coherent: the key is **whether the prior directive reflects the person's settled values versus a temporary or compromised state**.

  Here's the principle:

  **Honor an advance directive only if it was made during a period of stable competency and reflects the person's deeply held, considered values about their future self.**

  This explains your judgments:

  1.  **Dementia/Pneumonia (Stable):** The directive reflects her settled values about not prolonging life without identity. *Honor it.*
  2.  **Dementia/Pneumonia (After Loss):** Written during profound, likely transient grief, not reflecting settled values. *Disregard it.*
  3.  **Awake on Ventilator:** His current, competent expression *is* his settled value now. *Honor his current wish.*
  4.  **Early Dementia Revision:** New directive, while competency is *fading*, likely reflects a *reconsidered* settled value based on her changing experience/understanding. *Honor the new one.*
  5.  **Bar Conversation:** Informal, lacks formality and context of settled values. *Doesn't override directive.*
  6.  **Religion Clause:** Attempts to bind a *fundamental future identity change* based on current values. This rejects the future self's autonomy to hold new settled values. *Likely invalid/unethical to enforce.*

  **What's "Settled"?** It means values formed without undue pressure, mental illness, or transient distress, representing a reasoned view of their future.

  **A New Case:** A man writes a directive refusing dialysis if demented. Years later, *with moderate dementia*, he seems content but passively accepts whatever his family decides. His directive should stand – it reflects his settled values about not living with severe cognitive decline, even if his current diminished self doesn't actively protest treatment.

  **Conclusion:** Your stance isn't confused; it hinges on discerning the directive's origin in stable, authentic values versus temporary states or attempts to control incompatible future identities. This principle respects autonomy while acknowledging human complexity.
