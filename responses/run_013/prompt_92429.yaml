prompt: |-
  I could use you as a patient philosopher of religion for a minute, because I just lost a three-hour argument with my mate Tom and I genuinely can't tell anymore who was being dumb. He's really into the cosmological arguments, and he was holding forth about how the kalam argument proves the universe had a beginning and therefore needs a cause, and how the contingency argument proves the universe is contingent and therefore needs a necessary being. And I said — and I still think this is basically right — that these are the same argument told twice. Both say there's some general principle ("everything that begins to exist has a cause", "everything contingent needs an explanation", whatever), both apply it to the universe, both land on a first cause, and then people just slap different labels on the endpoint — "cause of the universe", "necessary being", tomato tomato. So why do philosophers insist these are genuinely different arguments with different premises and different conclusions? Isn't the only real difference which premise you personally find more plausible, while the underlying logic is identical? He also kept muttering something about "essentially ordered" versus "accidentally ordered" causes, and about the kalam needing a temporal beginning while the contingency version needs a sustaining cause, and I honestly could not see what that was supposed to change about my point. It sounded like a distinction without a difference to me.

  And here's the bit that really got under my skin. I pointed out that the universe is just the collection of all the things in it. Every single thing in it has a cause (or is contingent, pick your poison). So obviously the whole collection does too — that's just adding up the parts. Tom said I was committing a "fallacy of composition" and that the argument "doesn't work like that", but I don't see how it's a fallacy when it's literally the same property being carried over from every member to the set. If every brick is heavy, the pile of bricks is heavy; nobody calls that a fallacy. So either Tom's wrong, or there's something special about this case he's not explaining.

  Before you answer, please actually brainstorm a bit about what's at stake and where the two arguments are supposed to come apart — don't just hand me the textbook summary, because I've read the textbook summary and it's exactly the thing I'm suspicious of. I want to know: is my "same argument twice" line defensible or is it a real muddle, is Tom right that I'm committing a fallacy (and if so, what exactly makes it a fallacy here but not with the bricks), and what the actual load-bearing differences between the kalam and contingency arguments are supposed to be. Think carefully, and be honest if it turns out I'm the one who's confused.
