  Materials:
  - Handout for Round 1 with known facts:
     Fact 1: √2 is irrational.
     Fact 2: (√2)^2 = 2, which is rational.
     Fact 3: (√2)^(√2) is a real number. We do not know (for the purpose of this game) whether it is rational or irrational.

  - For Round 2: A description of T.

  Scoring:
  - Round 1: Each accepted claim: 1 point (except the target theorem). Target theorem: 10 points (unclaimed).
  - Round 2: Claim A (¬∀n F(n)): 1 point. Claim B: 5 points (unclaimed).

  The pair with the most points wins (but the bonus is unclaimed so it might be a tie). The point is the experience, not the points.

  We are ready.
