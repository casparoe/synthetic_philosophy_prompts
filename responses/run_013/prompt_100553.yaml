  ### Proof Market: Constructive Barriers in Mathematical Proof  
  **Session Design for a 75-Minute Undergraduate Seminar**  
  **Goal:** Students experience the gap between non-constructive existence proofs and the inability to produce a witness, highlighting implicit dependencies on decidability.  

  ---

  ### **Game Setup**  
  **Roles:**  
  - **Verifier (You):** Enforces rules, maintains the Ledger, and scores claims.  
  - **Provers (Students):** 14 students in 7 pairs. Pairs collaborate to prove claims and submit them to the Ledger.  

  **Materials:**  
  - **Whiteboard/Ledger:** Divided into three columns: *Claim*, *Pair*, *Points*.  
  - **Handouts (1 per pair):**  
    - **Round 1 Fact Sheet:**  
      - √2 is irrational.  
      - (√2)^2 = 2 (rational).  
      - (√2)^(√2) is a real number. *For this game, we do NOT know if it is rational or irrational.*  
      - If \(a = (\sqrt{2})^{\sqrt{2}}\) and \(b = \sqrt{2}\), then \(a^b = (\sqrt{2})^{\sqrt{2} \cdot \sqrt{2}} = (\sqrt{2})^2 = 2\) (rational).  
    - **Round 2 Fact Sheet:**  
      - Let \(T\) be a computer program that checks the Goldbach conjecture (every even integer >2 is the sum of two primes) for all even integers from 4 to \(10^{100}\). If it finds a counterexample, it outputs that integer; otherwise, it outputs 0.  
      - \(T\) halts after finite time (since \(10^{100}\) is finite), but *we do NOT know its output*.  
      - Define \(F(n)\): "\(n\) is not the output of \(T\)".  

  **Ledger Rules (Posted on Board):**  
  1. **Existence (∃):** Claim "∃x F(x)" accepted **only** with a specific witness \(x_0\) and proof of \(F(x_0)\).  
  2. **Disjunction (∨):** Claim "P ∨ Q" accepted **only** if the pair commits to *one* of P or Q and proves it.  
  3. **Universal Refutation (¬∀):** Claim "¬∀x F(x)" (i.e., "not all x have F(x)") accepted **only** via reductio ad absurdum (assume ∀x F(x), derive contradiction). No witness required.  

  **Scoring (Non-Monetary):**  
  - Accepted claim (except bonuses): **1 point**.  
  - **Round 1 Bonus:** Prove "∃a∃b (a irrational, b irrational, aᵇ rational)" → **10 points**.  
  - **Round 2 Bonus:** Prove "∃n ¬F(n)" → **5 points**.  
  - *Bonuses are designed to be unattainable under the rules.*  
  - Winning pair: Highest score (small prize: e.g., candy, extra credit).  

  ---

  ### **Timeline (75 Minutes Total)**  
  #### **0:00–0:05: Introduction (5 min)**  
  - **Verifier Script:**  
    "Today, we’re running a *proof market*. You’ll work in pairs to prove claims and 'sell' them to me, the Verifier, for points. The Ledger rules are strict: existence claims require witnesses, disjunctions require commitment, and refuting universals only needs reductio. The big prize? 10 points for proving there exist irrationals \(a\) and \(b\) such that \(a^b\) is rational. Ready? Go to your pairs!"  

  #### **0:05–0:35: Round 1 – Existence Proof Wall (30 min)**  
  - **Pairs Work:** Students develop proofs for the target theorem. Circulate to clarify rules but **do not help with strategy**.  
  - **Predictable Student Approach:**  
    Most pairs will use the classic two-case argument:  
    - Case 1: If \((\sqrt{2})^{\sqrt{2}}\) is rational, let \(a = \sqrt{2}\), \(b = \sqrt{2}\).  
    - Case 2: If \((\sqrt{2})^{\sqrt{2}}\) is irrational, let \(a = (\sqrt{2})^{\sqrt{2}}\), \(b = \sqrt{2}\) → \(a^b = 2\) (rational).  
    They will try to claim ∃a∃b via this disjunction.  

  #### **0:35–0:45: Ledger Submissions for Round 1 (10 min)**  
  - Pairs present claims. **Reject all attempts to claim the target theorem**.  
  - **Verifier Refusal Script (Apply Strictly):**  
    - If a pair submits ∃a∃b **without a witness**:  
      *"Rule 1: Existence requires a specific witness. What are the exact values of a and b?"*  
    - If a pair submits "P ∨ Q" (e.g., "Case 1 ∨ Case 2") **without committing to one disjunct**:  
      *"Rule 2: Disjunction requires committing to P or Q. Which one are you proving, and can you defend it alone?"*  
    - If a pair commits to a disjunct (e.g., "Case 1: a=√2, b=√2") **but cannot prove the case**:  
      *"You committed to Case 1, but you haven’t proven \((\sqrt{2})^{\sqrt{2}}\) is rational. Without that, this witness fails Rule 1."*  
    - If a pair demands the status of \((\sqrt{2})^{\sqrt{2}}\):  
      *"Recall: For this game, we do not know if \((\sqrt{2})^{\sqrt{2}}\) is rational or irrational. You cannot assume either."*  
  - **Outcome:** No pair scores the bonus. Students hit the wall—they need to decide rationality to name a witness, but they cannot.  

  #### **0:45–0:50: Transition to Round 2 (5 min)**  
  - **Verifier Script:**  
    "New round! Program \(T\) outputs an integer but we don’t know which. Define \(F(n)\): 'n is not the output of \(T\)'. Prove two claims:  
    - **Claim A:** ¬∀n F(n) (i.e., not every n avoids being the output).  
    - **Claim B:** ∃n ¬F(n) (i.e., there is an n that is the output).  
    Claim A is worth 1 point; Claim B is worth 5 points."  

  #### **0:50–0:55: Round 2 – Universal Refutation Gap (5 min work)**  
  - **Pairs Work:** Focus on Claim A (¬∀n F(n)).  

  #### **0:55–1:00: Ledger Submissions for Round 2 (5 min)**  
  - **Predictable Student Approach:**  
    - Claim A: Assume ∀n F(n) (every n is not the output). But \(T\) halts and outputs some integer k, so ¬F(k). Contradiction! ∴ ¬∀n F(n).  
    - Claim B: Requires a witness n₀ and proof that n₀ is the output (impossible without knowing output).  
  - **Verifier Actions:**  
    - Accept Claim A under **Rule 3** (reductio without witness). Award 1 point.  
    - Reject Claim B:  
      *"Rule 1: Where’s the witness? What specific n is the output? You can’t prove ¬F(n) for any n without knowing T’s output."*  
  - **Outcome:** Claim A succeeds; Claim B fails. Students see the gap between refuting universals and producing witnesses.  

  #### **1:00–1:15: Debrief (15 min)**  
  - **Reveal the Tradition:** "Today’s rules modeled **constructivism** (or intuitionism). Unlike classical math, constructivism ties truth to proof acts, not abstract truth-values."  
  - **Map Rules to Constructivism:**  
    - **Rule 1 (∃):** Constructive existence = producing the object. You felt the wall: the classical proof of ∃a∃b didn’t let you *construct* a witness.  
    - **Rule 2 (∨):** Constructive disjunction = deciding which disjunct holds. The case split for \(a^b\) required deciding rationality—which we couldn’t do.  
    - **Rule 3 (¬∀):** Non-constructive! Reductio doesn’t build a witness. Round 2 showed ¬∀n F(n) is provable, but ∃n ¬F(n) isn’t accessible.  
  - **What the Proofs Leaned On:**  
    - Round 1’s failed proof used **excluded middle** (P ∨ ¬P) for \((\sqrt{2})^{\sqrt{2}}\)’s rationality. Constructively, this is invalid without decidability.  
  - **Big Picture:**  
    "Connectives aren’t just about truth/falsity—they’re about *what we can establish*. Classical math ‘hides’ undecidable disjunctions and witnessless existence; constructivism exposes them. This also underpins computational limits (e.g., why some problems can’t be algorithmically decided)."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Pairs try to register a witness they cannot identify:**  
     - E.g., "a and b are either (√2, √2) or ( (√2)^(√2), √2 )."  
     - **Response:** *"Rule 1: A witness must be one specific object, not a disjunction. Pick one pair and prove it works."*  

  2. **Students treat undecided properties as decidable:**  
     - E.g., Assuming \((\sqrt{2})^{\sqrt{2}}\) is rational "because it might be."  
     - **Response:** *"We’re pretending ignorance—you can’t use properties of \((\sqrt{2})^{\sqrt{2}}\) unless you prove them. Stick to the handout facts."*  

  3. **Accusations of unfairness:**  
     - E.g., "Rules are arbitrary! Why can’t we use the two-case proof?"  
     - **Response:** *"The rules reflect a coherent philosophy—discuss it in debrief. For now, my job is consistent enforcement."*  

  4. **Round 2 becomes a search problem:**  
     - E.g., "Let’s ‘compute’ T’s output by sampling n!"  
     - **Prevention:** Emphasize in setup: *"T’s output is unknown; you can’t compute it or query results."* If attempted: *"Fact: We don’t know the output. Searching is impossible for this collection."*  

  ---

  ### **Honest Note: The Limitation**  
  This activity cannot reproduce the **philosophical motivation** behind constructivism. Students may see the rules as arbitrary constraints without understanding *why* someone would adopt this view. You must supply this context:  
  > "Constructivism isn’t just ‘rules for fun’—it’s a worldview where math is about mental constructions, not Platonic truths. A proof must *build* objects; excluded middle is rejected because we can’t always ‘construct’ which disjunct holds. This reflects deeper ideas in computation (e.g., undecidability) and epistemology (what does it mean to ‘know’ a mathematical object?). Without this, the game feels like a trick. So, in debrief, emphasize that constructivism responds to the very walls you hit today."  

  ---  
  **Final Tip:** Keep energy high with competitive scoring. End by noting that Gelfond-Schneider theorem (covered post-debrief) resolves \((\sqrt{2})^{\sqrt{2}}\) as irrational, making a witness constructible—but the *phenomenon* of non-constructive existence pervades advanced math (e.g., set theory).
