prompt: |-
  My oldest friend and I spent most of a long drive arguing about a scheme of his that I could not refute and could not accept, which is why I am setting it down here. The scheme sorts minds into four grades. The first is a creature that does the right thing because its ancestors' mistakes were paid for in advance, in its wiring, and it never learns anything itself. The second learns from its own experience, keeping what pays and dropping what stings. The third can run the trial and error inside itself, trying a few courses of action in imagination before committing, so that its mistakes cost it nothing. The fourth is the third plus a stock of tools it did not invent and could not have invented alone — words, numbers, maps, written rules, everything a culture hands down — so that its inner rehearsal is far stronger than its bare equipment would allow. He calls the four the Darwinian, the Skinnerian, the Popperian and the Gregorian grades, and he treats them as rungs on one ladder, each rung a property of the creature standing on it.

  What I could not get him to place are the cases where someone stands on a rung that belongs to somebody else. My brother-in-law drives a city he has never learned; the routes were worked out by other people's trial and error and are read to him turn by turn, and he drives with the calm of a man who knows every street, though if the device dies he is lost. A junior doctor I know follows a sepsis protocol; it is the compressed residue of trials she could never run and does not understand in detail, and she is excellent with it and, I suspect, dangerous without it. A colleague of mine does not so much think about certain problems as ask a particular senior person and take the answer. None of them is doing the third-grade thing — the trying-out, the letting the hypotheses die in his stead — and none is quite doing the fourth-grade thing either, because in the fourth grade the rehearsal is still supposed to be theirs, merely better equipped. Here the rehearsal happened, or is happening, in another head, and only the conclusion is handed across; and when the other head belongs to a person with interests of his own rather than to a printed table, that strikes me as a difference in kind rather than in equipment.

  So: is there a name for this? I am not asking for a label to file it under. I want to know what the thing is and where its edges fall. Are the satnav, the protocol, the colleague, the price on a market that summarizes thousands of other people's judgments, and the notes I left myself last year and now treat as gospel one phenomenon or several? Which of them belong together, and on what principle? If a creature that lives this way deserves a fifth rung, what would it be called, and what would distinguish it from the fourth; if it is not a rung at all but only a way of leaning on rungs other people built, I want to see the argument for that too. And I would like to know what the idea predicts: does it say, for instance, that such a creature will be systematically wrong about how much it knows on its own, and that taking away its helper leaves it worse off than if it had never had one? If you can give me a case that would tell two readings of it apart, so much the better.
reasoning: |-
  Okay, the user presents an intriguing philosophical problem about cognitive hierarchies and externalized cognition. They've clearly thought deeply about this after a prolonged discussion with their friend, and now seek conceptual clarity. The core tension is whether reliance on external cognitive tools represents an evolutionary advancement or a form of intellectual dependency.

  The friend's four-grade model seems inspired by cognitive science frameworks: Darwinian (genetic programming), Skinnerian (reinforcement learning), Popperian (mental simulation), Gregorian (cultural tools amplifying cognition). But the user spots a gap - cases where cognition isn't just augmented but outsourced entirely: satnav users, protocol-following doctors, colleagues who defer to seniors. 

  What makes this interesting is the user isn't just asking for terminology. They want:
  1. Conceptual boundaries - where does "tool use" end and "cognition outsourcing" begin?
  2. A unifying principle for diverse examples (satnav, medical protocols, market prices)
  3. Whether this constitutes a fifth cognitive grade 
  4. Testable implications about knowledge misestimation

  The examples share key features: 
  - No first-hand error correction (unlike Popperian)
  - No tool internalization (unlike Gregorian)
  - Heavy dependence on others' distilled experience

  This reminds me of distributed cognition theory, but with a twist. When the cognitive artifact contains compressed expertise (like medical protocols) or real-time guidance (satnav), the user becomes a cognitive executor rather than simulator. The danger zone is when they mistake procedural competence for understanding - what Wegner calls "transactive memory".

  The market price example is particularly subtle. Unlike the satnav user who blindly follows turns, traders using prices are actually participating in collective intelligence - the price reflects aggregated judgments they might rationally trust more than individual analysis. Still, over-reliance could atrophy independent judgment.

  For testable predictions: yes, we'd expect systematic overconfidence in self-knowledge when tools are removed. The Dunning-Kruger effect might intensify here. A good test case would be comparing medical residents using protocols vs. those taught underlying principles - we'd predict protocol-users perform worse when guidelines don't cover a case.

  Ultimately this seems less a new rung than a subspecies of Gregorian cognition - but one where internalization fails. The ladder metaphor might need replacing with a branching tree, where one path leads to internalized expertise and another to permanent dependency. The key distinction is whether external tools scaffold learning or replace it.
answer: |-
  Your brother-in-law with the satnav, the protocol-following doctor, and the advice-taking colleague represent a distinct **phenomenon of cognitive outsourcing or externalized cognition**. This isn't a fifth rung on the ladder but a *different mode of operation* relying on **distributed intelligence**. Here's a breakdown:

  ### 1. **Core Concept: Epistemic Dependence**
     - **Definition**: Relying on external systems/agents as "cognitive prosthetics" where the *process* of reasoning/trial-and-error occurs *outside* the individual. Only conclusions are internalized.
     - **Key Feature**: The user **decouples** from the reasoning process. They execute instructions without needing to simulate alternatives or understand underlying principles.
     - **Distinction from Gregorian**: Gregorian tools (maps, textbooks) *augment* internal rehearsal. Here, the rehearsal is *fully offloaded*. The tool provides pre-digested answers, not scaffolding for thought.

  ### 2. **What Unites Your Examples?**
     - **Satnav**: Embodies others' spatial reasoning ("trial-and-error" in city planning/navigation algorithms).
     - **Sepsis Protocol**: Encodes collective medical experience (clinical trials, expert consensus).
     - **Senior Colleague**: Leverages another person’s lived experience and judgment.
     - **Market Price**: Aggregates decentralized knowledge (supply/demand, forecasts).
     - **Notes to Self**: Past-you delegates to future-you (a temporal split).
     
     **Unifying Principle**: All are **compressed cultural adaptations** where the cost of error is externalized to others (past/present). The user substitutes *social or institutional knowledge* for personal cognition.

  ### 3. **Why Not a New Rung?**
     - **No Integrated Cognition**: The "rehearsal" isn’t internalized; it’s bypassed. This is *leaning* on others’ rungs, not evolving a new one.
     - **Vulnerability**: Remove the external system, and capability collapses (e.g., satnav failure → helplessness). True Gregorian internalization (e.g., reading a map) builds *resilient* skill.
     - **Scalability ≠ Depth**: While powerful, this mode doesn’t inherently develop the user’s *own* Popperian/Gregorian capacities. It risks **cognitive deskilling**.

  ### 4. **Key Predictions & Risks**
     - **Prediction 1**: **Illusion of Competence**. Users will systematically overestimate their unaided knowledge/skill (e.g., the doctor believes she understands sepsis deeply; the driver feels he "knows" the city).
     - **Prediction 2**: **Deskilling Effect**. Removing the tool degrades performance *below* the level of someone who never used it.  
       - *Test Case*: Train two groups to navigate: Group A uses only satnav; Group B studies maps. Later, both navigate unaided. Prediction: Group B outperforms Group A *and* a control group with no training.
     - **Prediction 3**: **Brittleness in Novel Situations**. Systems break when faced with unscripted scenarios (e.g., sepsis protocol fails for a rare pathogen; satnav reroutes into a flood zone).
     - **Risk**: **Principal-Agent Problems**. When the knowledge source has its own interests (e.g., the senior colleague), users may inherit biases or errors uncritically.

  ### 5. **Edges & Exceptions**
     - **Blurred Boundary**: Using a calculator (Gregorian) vs. relying on an accountant (outsourcing). Difference: The calculator user *understands arithmetic*; the outsourcer may not grasp financial principles.
     - **When It Becomes Gregorian**: If the user *internalizes* the logic (e.g., the doctor studies why the protocol works), it shifts to fourth-grade. The line hinges on **metacognition** – knowing *why* the tool is right.
     - **Collective Intelligence Exception**: Market prices/Google Maps are *emergent* knowledge. No single "other head" controls them, making them more robust than personal advice.

  ### 6. **What to Call This?**
     - **Distributed Cognitive Labor** (Hutchins): Cognition shared across minds/tools.
     - **Epistemic Offloading** (Clark): Delegating reasoning to external resources.
     - **Transactive Memory** (Wegner): Relying on others to store/process information.
     - **Embedded in Scaffolded Cognition**: But emphasizing **passive dependence** over active augmentation.

  ---

  ### In Summary:
  | **Aspect**                | **Gregorian (4th Rung)**          | **Outsourced Cognition**              |
  |---------------------------|-----------------------------------|---------------------------------------|
  | **Tool Role**             | Augments internal simulation      | *Replaces* internal simulation        |
  | **Error Cost**            | Borne by user (in rehearsal)      | Borne by external system/others       |
  | **Metacognition**         | Understands tool’s logic          | Treats tool as "black box"            |
  | **Failure Response**      | Adapts using internalized skill   | Loses capability (brittle)            |
  | **Knowledge Ownership**   | Integrated into cognition         | "Rented" from external source         |

  Your intuition is correct: this is a difference in *kind*, not equipment. It leverages collective intelligence but risks creating **cognitive parasites** – individuals whose abilities atrophy through dependence. The most profound insight is that **efficiency gained through outsourcing often trades away resilience and deep understanding**. The test cases (e.g., satnav vs. map learners) would starkly reveal this trade-off.
