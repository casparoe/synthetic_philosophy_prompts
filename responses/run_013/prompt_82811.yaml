prompt: |-
  I sit on an advisory panel revising the ethics guidance for a national plant-protection service — the body that licenses insecticides, approves biological control releases, and funds integrated pest management programs. Before we assess the frameworks that have been put to us (welfarist consequentialism, rights-based views, ecocentric and ecosystem-integrity views, relational and virtue-oriented views, and the case-by-case precautionary default our agency currently follows without having chosen it), I want the specification first. Treat adequacy as relative to our purpose, which is to issue decisions we can defend in public, apply consistently across dissimilar cases, revise when the science moves, and reach within a single season rather than after a decade of further study. I am an entomologist by training with no formal philosophy background, so keep the vocabulary plain; the depth should sit in the requirements, not the jargon.

  Give me the desiderata any adequate framework for this area must satisfy, as a table with these columns:

  - ID (R1, R2, ...)
  - Requirement — one line stating what the framework must deliver
  - What it must actually produce — the test it must pass, or the output a regulator could extract from it
  - Case or consideration behind it — name the test case below (or the general consideration) and identify the feature that generates the demand
  - Status — non-negotiable, negotiable, or camp-specific (naming the camp whose preference it is)
  - Framework families it excludes, and why

  Anchor the requirements in the panel's test cases, which come from dossiers already before us:

  1. The Resurgence Case. A spray is highly effective against the target moth and also kills the generalist predators that ordinarily suppress it; the following season the moth is worse than before. Assume this is established for the case.
  2. The Untargetable Cousin Case. The only effective agent at the required dose also harms a protected butterfly in the same family, and no application window discriminates between them.
  3. The Sterility Case. A proposal to release engineered males that sterilize a pest population, with a real prospect of local elimination of the species and a small but nonzero chance of spread beyond the release area.
  4. The Baseline Case. In the untreated field the pest is held down by parasitoids that kill hosts slowly from within, and most larvae die of starvation or disease. Leaving the field alone is therefore not leaving the insects unharmed.
  5. The Numbers Case. Any per-individual welfare accounting will be swamped by insect counts; a framework that counts individuals one by one makes nearly every agricultural practice look catastrophic, and one that counts only species or ecosystems makes individual suffering invisible.
  6. The Resistance Case. High-dose spraying kills nearly all exposed individuals quickly but selects hard for resistance and requires refuges; low-dose spraying produces widespread sublethal impairment — disorientation, failed foraging, reduced reproduction — and selects slowly. Assume welfare and resistance management pull in opposite directions here.
  7. The Relational Pest Case. The same species is a managed pollinator in one region and a damaging invader in another, and one grower's pest is another's livelihood. Our remit covers pests, so the framework must say whether pest is a biological category or a role fixed by human interests.
  8. The Specificity Case. A sequence-specific spray is proposed that is designed to silence a gene in one species only. The dossier presents this precision as a new kind of ethical permission.

  Then, in a second table, the conflict register — columns: Pair (IDs) | The tension | Why joint satisfaction fails, or where the trade-off must at least be made explicit | Which requirement you would weaken, and how you would reframe the survivor.

  Close with a JSON object with these fields: most_exclusionary_requirement (string), why_it_excludes (string), camp_prejudices (array of strings, each naming a demand and the camp that treats it as obvious rather than argued for), excluded_families (array of strings), and one_line_summary (string). Argue from the cases; we are drafting our own document, so do not supply citations, reading lists, or attributions, and do not lean on any particular author's formulation.
reasoning: |-
  We are creating two tables: one for desiderata (requirements) and one for conflicts between them.
   The requirements are anchored in the test cases provided. We must derive the requirements from these cases and the general regulatory context.

   Context: The ethics framework must be defensible in public, applicable consistently across dissimilar cases, revisable with new science, and able to reach decisions within a single season.

   We'll list requirements (R1, R2, ...) with the following columns:
     - ID
     - Requirement (one line)
     - What it must actually produce (test or output for regulator)
     - Case or consideration behind it (from the test cases or general)
     - Status (non-negotiable, negotiable, or camp-specific with camp named)
     - Framework families it excludes, and why

   Then, a conflict register table with:
     - Pair (e.g., R1 vs R2)
     - The tension (description of the conflict)
     - Why joint satisfaction fails, or where trade-off must be explicit
     - Which requirement you would weaken and how to reframe the survivor

   Finally, a JSON object with:
     - most_exclusionary_requirement (string): the requirement that, if enforced, excludes the most frameworks
     - why_it_excludes (string): explanation
     - camp_prejudices (array of strings): each string names a demand and the camp that treats it as obvious
     - excluded_families (array of strings): list of framework families excluded by the most exclusionary requirement
     - one_line_summary (string)

   We'll derive requirements from the test cases and the regulatory purpose.

   Let's start by listing requirements:

   1. From the regulatory purpose and general considerations:
      - R1: Public Defensibility - The framework must produce decisions that can be justified to the public. 
          Output: A clear rationale that addresses common moral concerns (e.g., harm, fairness, sustainability).
          Consideration: Public trust is essential for the agency's legitimacy. Non-negotiable.

      - R2: Consistency - The framework must be applicable consistently across dissimilar cases.
          Output: Similar judgments for similar cases, and clear distinctions for dissimilar ones.
          Consideration: Regulatory fairness and predictability. Non-negotiable.

      - R3: Timeliness - The framework must allow decisions within a single season.
          Output: A decision procedure that does not require extensive new research for each case.
          Consideration: Agricultural contexts require timely interventions. Non-negotiable.

      - R4: Revisability - The framework must allow revision when science moves.
          Output: A process for updating decisions without overhauling the entire framework.
          Consideration: Science evolves, and regulation must keep pace. Non-negotiable.

   2. From the test cases:

      Case 1: Resurgence Case
          - R5: Avoid Counterproductivity - The framework must account for indirect and long-term effects of interventions, especially when they lead to worse outcomes.
            Output: A requirement to evaluate not just direct effects but also ecological feedback (e.g., resurgence).
            Status: Non-negotiable (to avoid clearly self-defeating actions).

      Case 2: Untargetable Cousin Case
          - R6: Protect Non-Target Species - The framework must address harm to non-target species, especially protected ones.
            Output: A way to weigh the harm to non-target species against the benefits of pest control.
            Status: Non-negotiable (due to legal protections for some species).

          Also, note: This case highlights the need for precision. But R6 is about protection.

      Case 3: Sterility Case
          - R7: Precaution for Unintended Spread - The framework must handle interventions with potential for irreversible or widespread effects, even if low probability.
            Output: A precautionary assessment of the worst-case scenario and a plan to mitigate it.
            Status: Non-negotiable (because of the potential for harm beyond the intended area).

          - R8: Consider Intentional Elimination - The framework must address the ethics of intentionally eliminating a species locally.
            Output: A stance on whether and when elimination is acceptable.
            Status: Negotiable (different camps have different views on species elimination).

      Case 4: Baseline Case
          - R9: Acknowledge Background Harm - The framework must recognize that non-intervention also causes harm (e.g., starvation, disease) and is not a neutral baseline.
            Output: Evaluation of the pest control option against the baseline of natural harm.
            Status: Non-negotiable (to avoid biased comparisons).

      Case 5: Numbers Case
          - R10: Scalability to Large Numbers - The framework must handle cases with very large numbers of individuals without being overwhelmed by counting or ignoring individual welfare.
            Output: A method that does not require individual counting and can aggregate or sample appropriately.
            Status: Non-negotiable (because insect counts are huge, and both extremes are problematic).

      Case 6: Resistance Case
          - R11: Balance Welfare and Resistance Management - The framework must resolve conflicts between minimizing individual suffering and preventing long-term resistance.
            Output: A decision procedure that explicitly weighs short-term welfare against long-term efficacy.
            Status: Non-negotiable (because both are important and often in tension).

      Case 7: Relational Pest Case
          - R12: Define Pest Status - The framework must define what constitutes a pest in a way that is consistent and not arbitrary.
            Output: A clear definition of "pest" that can be applied across contexts (e.g., based on harm to human interests, but must be consistent).
            Status: Non-negotiable (because the agency's remit is pests, so the definition is foundational).

      Case 8: Specificity Case
          - R13: Precision as Ethical Factor - The framework must consider the ethical implications of highly specific interventions (e.g., reduced non-target harm) but not automatically grant permission.
            Output: Evaluation of precision as a factor in favor, but not an automatic green light.
            Status: Negotiable (some camps may see precision as sufficient, others may require more).

   We also have some general requirements from the existing default (precautionary case-by-case) and the need to move beyond it.

   Now, we must assign status and exclusions:

   - Non-negotiable: These are requirements that any framework must meet to be viable for the agency.
   - Negotiable: These can be handled in different ways by different frameworks, and the panel might choose one approach.
   - Camp-specific: These are requirements that are central to a particular ethical camp but not others.

   Framework families: 
     - Welfarist consequentialism
     - Rights-based views
     - Ecocentric and ecosystem-integrity views
     - Relational and virtue-oriented views
     - Precautionary case-by-case (current default)

   Let's go through each requirement and assign:

   R1: Public Defensibility
     Status: non-negotiable
     Excludes: Frameworks that are too esoteric or lack public resonance (e.g., some rights-based views that assign rights to insects might be hard to defend, or ecocentric views that ignore individual welfare entirely might be challenged by animal welfare groups). But note: we are not excluding entire families, but versions that cannot be defended.

   R2: Consistency
     Status: non-negotiable
     Excludes: Frameworks that are inherently case-by-case without clear principles (like the current precautionary default if it remains without principles). Also, some virtue ethics might be too context-dependent.

   R3: Timeliness
     Status: non-negotiable
     Excludes: Frameworks that require extensive new research for every decision (e.g., some consequentialist approaches might require complex modeling that takes too long, or precautionary approaches that demand certainty).

   R4: Revisability
     Status: non-negotiable
     Excludes: Frameworks that are rigid (e.g., some rights-based views that set absolute rules, or ecocentric views that fix on a particular ecosystem state).

   R5: Avoid Counterproductivity
     Status: non-negotiable
     Excludes: Frameworks that only consider direct effects (e.g., naive welfarist consequentialism that only looks at immediate deaths, or rights-based views that focus on individual acts without considering system effects).

   R6: Protect Non-Target Species
     Status: non-negotiable (because of legal obligations to protect certain species)
     Excludes: Frameworks that do not assign any moral weight to non-target species (e.g., extreme anthropocentrism that only cares about human interests, or some welfarist views that only consider the target pest and humans).

   R7: Precaution for Unintended Spread
     Status: non-negotiable (because of the potential for large-scale harm)
     Excludes: Frameworks that only consider expected outcomes and ignore low-probability catastrophic risks (e.g., some consequentialist approaches that use expected utility and discount low probabilities).

   R8: Consider Intentional Elimination
     Status: negotiable (because different camps have different views: ecocentric might oppose, welfarist might support if it reduces suffering, etc.)
     Excludes: None entirely, but it must be addressed. So not excluding a family.

   R9: Acknowledge Background Harm
     Status: non-negotiable (because ignoring it leads to biased decisions)
     Excludes: Frameworks that assume non-intervention is benign (e.g., some rights-based views that focus on not harming but ignore natural harm, or ecocentric views that see natural harm as acceptable).

   R10: Scalability to Large Numbers
     Status: non-negotiable (because of the nature of insect populations)
     Excludes: Frameworks that require individual counting (e.g., some rights-based views that insist on individual rights without aggregation) or that ignore individual welfare entirely (e.g., extreme ecocentrism that only values species or ecosystems).

   R11: Balance Welfare and Resistance Management
     Status: non-negotiable (because both are important and the tension is inherent)
     Excludes: Frameworks that cannot handle trade-offs (e.g., absolute rights-based views that forbid any sublethal harm, or pure resistance management that ignores welfare).

   R12: Define Pest Status
     Status: non-negotiable
     Excludes: Frameworks that cannot define pest in a consistent way (e.g., relational views that say pest status is entirely contextual without any fixed criteria, which might lead to inconsistency).

   R13: Precision as Ethical Factor
     Status: negotiable (it can be a factor without being decisive)
     Excludes: Frameworks that assign no moral value to precision (e.g., some ecocentric views that care about ecosystem-level effects regardless of precision) or that see precision as automatically granting permission (which might be a welfarist view, but we require it to be a factor, not automatic).

   Now, we build the table.

   After the requirements table, we'll identify conflicts.

   Conflicts: We must identify pairs of requirements that are in tension.

   Example conflicts:

    R10 (Scalability) vs R11 (Balance): 
      - Scalability requires avoiding individual counts, but balancing welfare and resistance might require assessing individual welfare (e.g., sublethal effects). 
      - Tension: How to measure welfare without counting individuals? We need a method that aggregates welfare at a population level without getting bogged down.

    R6 (Protect Non-Target) vs R3 (Timeliness): 
      - Protecting non-target species might require detailed ecological studies (which take time), but timeliness requires quick decisions.

    R5 (Avoid Counterproductivity) and R7 (Precaution) vs R3 (Timeliness): 
      - Both R5 and R7 require looking at long-term and indirect effects, which might be hard to do quickly.

    R9 (Background Harm) vs R1 (Public Defensibility):
      - Acknowledging background harm might be counterintuitive to the public (who see intervention as harmful and non-intervention as natural and thus acceptable). This could make defensibility harder.

    R12 (Define Pest) vs R7 (Relational Pest Case): 
      - The relational case shows that a species can be both beneficial and harmful. How do we define pest consistently? If we define it by human interests, then the same species in different contexts might be treated differently, but then consistency (R2) might be challenged because the same species is treated differently.

   We'll create the conflict register.

   Finally, the JSON.

   Let's start with the desiderata table.
answer: |-
  ### Desiderata Table for Ethics Framework

  | ID  | Requirement | What it must actually produce | Case or consideration behind it | Status | Framework families it excludes, and why |
  |-----|-------------|-------------------------------|----------------------------------|--------|------------------------------------------|
  | R1  | Account for indirect ecological consequences | Assessment of long-term effects, including resurgence or secondary outbreaks | Resurgence Case: Spray kills predators, leading to worse future infestations | Non-negotiable | Excludes frameworks ignoring systemic interactions (e.g., simplistic rights-based views focusing only on direct harm to individuals) |
  | R2  | Resolve conflicts between target and protected non-target species | Clear criteria for trade-offs when harm to protected species is unavoidable | Untargetable Cousin Case: Spray harms protected butterfly with no selective application window | Non-negotiable | Excludes pure welfarist-consequentialism (prioritizes target pest control efficiency over protected species) and strict rights-based views (may forbid any harm to protected species) |
  | R3  | Address irreversible or widespread interventions | Binding evaluation of containment feasibility and extinction risks | Sterility Case: Engineered males risk local extinction or unintended spread | Non-negotiable | Excludes frameworks without precautionary elements (e.g., pure consequentialism discounting low-probability events) |
  | R4  | Reject "non-intervention" as a neutral baseline | Explicit comparison of intervention against natural suffering in status quo | Baseline Case: Starvation/disease in untreated fields causes significant harm | Non-negotiable | Excludes frameworks assuming non-action is inherently ethical (e.g., some rights-based views) |
  | R5  | Handle extreme numerical scales without ignoring individuals | Practical aggregation method (e.g., population-level welfare metrics) | Numbers Case: Individual counting is impractical; species-level focus ignores suffering | Non-negotiable | Excludes individualist rights-based views (require per-individual accounting) and extreme ecocentrism (ignores individual welfare entirely) |
  | R6  | Balance immediate welfare against long-term efficacy | Decision protocol for welfare/resistance trade-offs | Resistance Case: High-dose (quick death) vs. low-dose (sublethal suffering, slower resistance) | Non-negotiable | Excludes frameworks unable to weigh timescales (e.g., rigid deontology) |
  | R7  | Define "pest" as context-dependent, not biological | Operational definition tying "pest" to human-induced harm in specific settings | Relational Pest Case: Same species is beneficial pollinator or invasive pest | Non-negotiable | Excludes ecocentric views (prioritize species' intrinsic value over human context) |
  | R8  | Treat precision as a mitigator, not automatic permission | Scrutiny of precision claims (off-target risks, ecological ripple effects) | Specificity Case: Gene-silencing spray’s precision doesn’t negate need for holistic review | Negotiable | Excludes techno-optimist views within welfarist-consequentialism (equate precision with reduced ethical burden) |
  | R9  | Produce public justifications in non-technical terms | Plain-language rationale for decisions, citing core principles | Regulatory purpose: Public defensibility | Non-negotiable | Excludes jargon-heavy frameworks (e.g., academic virtue ethics) |
  | R10 | Yield consistent decisions across dissimilar cases | Comparable reasoning structures applied to diverse dossiers | Regulatory purpose: Consistency | Non-negotiable | Excludes purely case-by-case precautionary approaches (lack unifying principles) |
  | R11 | Allow updates without full framework overhaul | Modular science-review process (e.g., thresholds adjustable with new data) | Regulatory purpose: Revisability | Non-negotiable | Excludes rigid frameworks (e.g., rights-based views with fixed rules) |
  | R12 | Deliver verdicts within one growing season | Bounded evidence requirements; no open-ended research demands | Regulatory purpose: Timeliness | Non-negotiable | Excludes frameworks requiring exhaustive data (e.g., deep ecocentrism needing full ecosystem modeling) |

  ---

  ### Conflict Register

  | Pair | The tension | Why joint satisfaction fails | Which requirement you would weaken, and reframing |
  |------|-------------|-----------------------------|--------------------------------------------------|
  | R1 vs R12 | Systemic consequences vs. timeliness | Full ecological forecasting takes years; bounded assessments risk missing feedback loops | Weaken R1: Accept probabilistic projections (not certainty) for indirect effects. Reframe R12 as "adequate evidence" not "complete evidence". |
  | R5 vs R6 | Aggregation vs. individual welfare | Population-level metrics obscure sublethal impacts critical to welfare/resistance trade-offs | Weaken R5: Use "representative suffering" sampling for key life stages. Reframe R6 to focus on observable population outcomes (e.g., fitness reduction). |
  | R2 vs R7 | Protecting non-target species vs. context-dependent pests | Strict protection of non-targets may forbid control of pests that are ecologically similar to protected species | Weaken R2: Allow exceptions if harm to protected species is minimized and justified by human necessity. Reframe R7: "Pest" must involve measurable economic/ecological harm (not just human dislike). |
  | R3 vs R8 | Precaution vs. precision incentives | Over-precaution may stifle precision-tech innovation; over-trust in precision may underestimate systemic risks | Weaken R3: Tiered risk assessment (stricter for irreversible effects). Reframe R8: Precision reduces burden of proof but doesn’t eliminate review. |
  | R4 vs R9 | Acknowledging natural suffering vs. public defensibility | Public perceives "natural" suffering as more acceptable than human-induced harm; justifying intervention requires nuanced messaging | Weaken R9: Use analogies (e.g., medical triage) to explain baseline harm. Reframe R4: Compare interventions against best-available alternatives (not just "nature"). |

  ---

  ### JSON Summary

  ```json
  {
    "most_exclusionary_requirement": "R5 (Handle extreme numerical scales without ignoring individuals)",
    "why_it_excludes": "Insect-scale numbers force frameworks to either aggregate welfare (excluding strict individualist rights views) or ignore individuals (excluding welfarism); most frameworks fail by being too abstract or too granular.",
    "camp_prejudices": [
      "Welfarist-consequentialism: Treats precision (R8) as inherently permissive",
      "Rights-based views: Assumes non-intervention (R4) is ethically neutral",
      "Ecocentrism: Views 'pest' (R7) as a human-centric category violating intrinsic value"
    ],
    "excluded_families": [
      "Individualist rights-based views (cannot aggregate)",
      "Extreme ecocentrism (ignores individuals)",
      "Naive consequentialism (overlooks precision limits)"
    ],
    "one_line_summary": "A defensible framework must aggregate insect-scale welfare without erasing individuals, reject non-intervention as a baseline, and balance precision with precaution—excluding rigid rights-based, ecocentric, and case-by-case approaches."
  }
  ```
