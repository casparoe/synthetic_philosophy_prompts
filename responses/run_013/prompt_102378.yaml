answer: |-
  **Joint Statement on Expected-Value Maximization and Extreme Cases**  
  **Signed:** *The Fanatic* and *The Anti-Fanatic*  

  ---

  ### 1. Agreed Claims  
  We jointly affirm the following:  

  1.  **Formal Definition**: Expected-value maximization (EVM) is the decision rule that selects the action with the highest probability-weighted sum of utilities. It is a formal mathematical procedure requiring a probability distribution over states of the world and a utility function over outcomes.  
  2.  **Underdetermination**: EVM does not, by itself, determine the content of the utility function, the method for assigning probabilities, or the domain over which utilities are defined (e.g., bounded or unbounded).  
  3.  **Structure of Mugging Cases**: "Pascal's Mugging"-style cases involve:  
      -   A very low probability event (e.g., \(10^{-100}\))  
      -   An outcome assigned extremely high (or infinite) utility  
      -   An expected utility calculation favoring an action (e.g., paying the mugger) that seems intuitively irrational.  
      We agree this structure generates the apparent conflict but disagree on whether it invalidates EVM.  
  4.  **Decision Rules vs. Praiseworthiness**: What a formal decision rule *requires* is distinct from whether an agent adhering to it should be *praised, blamed, or deemed reasonable* by others, especially under bounded rationality, epistemic limitations, or extreme uncertainty.  
  5.  **Epistemic Challenges**: Assigning precise, meaningful, and justifiable credences to events of *extremely* low probability (e.g., below \(10^{-50}\)) is epistemically fraught. Similarly, comparing or eliciting utilities for outcomes of *astronomically* large scale (e.g., \(10^{100}\) happy lives) is operationally challenging and may lack empirical anchors.  

  ---

  ### 2. Disagreements  

  | Crux                                                                 | Fanatic's Wording                                                                                                 | Anti-Fanatic's Wording                                                                                                                 |
  | :------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------- |
  | **Scope of Rationality**                                             | Rationality *requires* strict adherence to EVM whenever probabilities and utilities are defined, regardless of scale. | Rationality *permits* rejecting EVM when probabilities are vanishingly small or utilities astronomically large, as the rule loses normative force. |
  | **Interpretation of Tiny Probabilities**                             | Any probability \(p > 0\), however small, can meaningfully contribute to expected value if the outcome utility is sufficiently high. | Probabilities below a pragmatically relevant threshold (e.g., beyond empirical calibration or cognitive grasp) are effectively indistinct from 0 for rational decision-making. |
  | **Status of Intuition**                                              | Counterintuitive results from EVM signal flaws in *intuitions* or *auxiliary assumptions* (e.g., utility bounds), not in EVM itself. | Persistently counterintuitive results from EVM, especially in extreme cases, signal a flaw in *applying* EVM as the sole rule for those cases. |
  | **Verbal Disagreement: "Gone Wrong"**                                | A decision "goes wrong" only if it violates EVM *or* rests on incorrect probabilities/utilities.                 | A decision "goes wrong" if it is practically indefensible or alienates agents from reasonable goals, even if it satisfies EVM formally. |

  ---

  ### 3. Cruxes  
  Settling these sub-questions would move at least one side:  
  1.  **Boundedness of Utility**: Is the utility function necessarily bounded above, or can it be scale-free (permitting arbitrarily high utilities)?  
  2.  **Definability of Expected Value**: Is "more expected value" a well-defined comparison when probability distributions have *unbounded tails* or fail standard integrability conditions?  
  3.  **Sufficiency of Formal Correctness**: Is a decision rule’s formal coherence (e.g., satisfying axioms like transitivity) *sufficient* reason to follow it when it yields strongly counterintuitive verdicts in conceivable cases?  

  ---

  ### 4. Concrete Cases & Predictions  

  #### Case A: The Ladder of Gambles  
  Consider a ladder of gambles \(\{G_n\}\) for \(n = 1, 2, 3, ..., N\):  
  - \(G_n\): Pays \(2^n\) utilons with probability \(\frac{1}{2^n}\), pays 0 otherwise.  
  - *Expected Value*: \( \mathbb{E}[G_n] = (2^n) \times (1/2^n) + 0 \times (1 - 1/2^n) = 1 \) for all \(n\).  

  | Question                                             | Fanatic's Prediction                                                                 | Anti-Fanatic's Prediction                                                                 |
  | :--------------------------------------------------- | :----------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------- |
  | **Is an idealized agent indifferent between all \(G_n\)?** | Yes. EVM requires indifference since \(\mathbb{E}[G_n] = 1\) identically.            | No. The ladder "breaks" at high \(n\): Rational agents should prefer \(G_k\) (e.g., \(k=10\)) over \(G_m\) (e.g., \(m=100\)) despite equal EV. |
  | **If no, why?**                                      | (N/A – predicts indifference)                                                        | **Epistemic Collapse**: Credences for \(p < \epsilon\) (e.g., \(10^{-30}\)) lack meaningful justification.<br>**Action Guidance Failure**: \(G_{100}\) demands betting everything on a near-impossible event, violating practical rationality. |

  #### Case B: Bounded Utility Test  
  *Scenario*: Agent faces choices where the maximum possible utility is capped at \(U_{\text{max}}\) (e.g., by physics or metaphysics).  
  | Crux                                 | Fanatic                                                                 | Anti-Fanatic                                                              |
  | :----------------------------------- | :---------------------------------------------------------------------- | :------------------------------------------------------------------------ |
  | **Would bounded utility resolve key disagreements?** | Yes. Mugging cases vanish if \(U\) is bounded; EVM remains intact.     | Partially. It avoids unbounded payoffs, but problems persist for *extremely small* \(p\) and *large-but-bounded* \(U\). |

  #### Case C: Non-Integrable Distribution  
  *Scenario*: A St. Petersburg-like gamble with \(\mathbb{E}[U] = \infty\) but no finite fair price (e.g., pay \(2^{2^k}\) utils w.p. \(2^{-k}\) for \(k=1,2,3,...\)).  
  | Crux                                           | Fanatic's View                                                                 | Anti-Fanatic's View                                                     |
  | :--------------------------------------------- | :----------------------------------------------------------------------------- | :---------------------------------------------------------------------- |
  | **Is "maximize expected value" action-guiding?** | Yes, though implementation is tricky; dominance reasoning suffices.          | No. The rule is undefined/incoherent here, demanding revision or supplementation. |

  ---

  ### 5. Closing Commitments  

  **The Fanatic** would abandon strict EVM if:  
  - It were proven that no coherent utility function can satisfy EVM across all choice sets without inconsistency (e.g., violating dominance).  
  - A strictly dominant *and* universally applicable alternative rule were formulated.  

  **The Anti-Fanatic** would embrace strict EVM if:  
  - It were shown that *any* alternative rule leads to *worse* pragmatic or epistemic inconsistencies in edge cases.  
  - A compelling account emerged for justifying credences/utilities at super-astronomical scales.  

  **We jointly agree** that progress requires:  
  - Formal work on decision theories with bounded resources, vague probabilities, or lexical priorities.  
  - Empirical study of how humans/animals reason about extreme magnitudes.  
  - Clarifying the metaphysics of value (e.g., are utilities bounded by physics?).  
  - Resolving whether infinities or non-integrable distributions are permissible in decision models.  

  ---  
  **Signed,**  
  *The Fanatic*  
  *The Anti-Fanatic*
