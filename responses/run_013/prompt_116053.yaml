  Then, connecting this to the food bank’s pointlessness. If famines are systemic, charity addresses symptoms, not root causes. The teacher might argue that only political change can prevent famines, making food banks a band-aid solution. But this overlooks that food banks alleviate suffering now, even if they don’t fix systemic issues. 

  Regarding Sen and democracies: Ireland in the 1840s had representation at Westminster, but colonial dynamics meant Irish interests were subordinated. Sen’s point is that competitive elections and free press pressure governments to act, which didn’t fully apply in colonial contexts. Post-independence India avoided famines through democratic mechanisms but still faces chronic malnutrition due to inequality and policy failures. This shows that while democracies prevent mass starvation, they don’t automatically eliminate hunger. 

