  ### Counterfactual Mugging (CM) and XOR Blackmail (XB): A Conceptual Map
  Both problems involve a perfect predictor (Omega) and a decision that appears causally disconnected from the payoff, yet they challenge decision theories differently. Below, I break down each problem by decision theory, then compare their structures, symmetries, and core challenges.

  ---

  ### **1. Counterfactual Mugging (CM)**
  **Setup**:  
  - Omega flips a fair coin.  
  - **Heads (50%)**: Omega asks you to pay $100.  
  - **Tails (50%)**: Omega gives you $10,000 iff it predicted you *would have paid* if the coin landed heads.  
  - *You observe the outcome*. In this case, you see heads and are asked to pay.  

  **Core Challenge**:  
  Your payment in the *actual* heads branch affects the payoff in the *counterfactual* tails branch. Paying $100 (which seems causally futile) is required to receive $10,000 in the tails branch, but you know tails did not occur.  

  #### **Decision Theories**:  
  - **Causal Decision Theory (CDT)**:  
    - **Action**: Refuse to pay.  
    - **Reasoning**: Your payment *causes* a $100 loss in the actual branch. The tails branch is counterfactual; your action has no causal effect on it (since it didn't happen). Maximizing local causality implies avoiding the loss.  

  - **Evidential Decision Theory (EDT)**:  
    - **Action**: Refuse to pay.  
    - **Reasoning**: Conditional on paying, you are certainly in the heads branch (since payment only occurs there). This implies a guaranteed $100 loss with no benefit (as tails didn't occur). Paying provides no evidence that you get $10,000—it only confirms you're in heads.  

  - **Functional/Updateless Decision Theory (FDT/UDT)**:  
    - **Action**: Pay $100.  
    - **Reasoning**: FDT chooses the *decision rule* that maximizes expected utility *before* knowing the coin flip. The rule "always pay if heads" yields:  
      - Heads: Lose $100.  
      - Tails: Gain $10,000 (since Omega predicted payment).  
      - *Expected utility (EU)*: \(0.5 \times -100 + 0.5 \times 10,000 = 4,950\).  
      The rule "never pay" has EU = 0. Thus, paying is optimal.  

  ---

  ### **2. XOR Blackmail (XB)**  
  **Setup**:  
  - With 50% probability, your house has termites (you don't know).  
  - **If no termites**: Omega sends a letter iff it predicts you *would pay* if blackmailed. The letter: "Pay $100, or I'll 'reveal' you have termites, costing you $1,000 in reputational damage."  
  - **If termites**: Omega does nothing (you later pay $1,000 for extermination).  
  - *You receive the letter*.  

  **Core Challenge**:  
  Paying avoids a $1,000 loss in the *actual* no-termites branch but signals to Omega that you are exploitable, increasing the chance of blackmail. Refusing risks a loss now but deters future blackmail.  

  #### **Decision Theories**:  
  - **Causal Decision Theory (CDT)**:  
    - **Action**: Pay $100.  
    - **Reasoning**: Paying *causes* you to avoid the $1,000 reputational cost in the actual branch. The termites branch is unaffected (you pay $1,000 regardless). Causally, paying is optimal locally.  

  - **Evidential Decision Theory (EDT)**:  
    - **Action**: Pay $100.  
    - **Reasoning**: Receiving the letter *evidences* no termites (since Omega only sends it if termites are absent). Conditional on paying:  
      - You certainly avoid $1,000 loss (no termites).  
      - Paying is correlated with being in the no-termites branch, so it's rational.  

  - **Functional/Updateless Decision Theory (FDT/UDT)**:  
    - **Action**: Refuse to pay.  
    - **Reasoning**: FDT chooses the decision rule *ex ante* (before knowing termite status). The rule "never pay" yields:  
      - Termites: Lose $1,000 (extermination).  
      - No termites: Omega doesn't send the letter (it predicts non-payment), so no cost.  
      - *EU*: \(0.5 \times -1,000 + 0.5 \times 0 = -500\).  
      The rule "always pay" has EU: \(0.5 \times -1,000 + 0.5 \times -100 = -550\).  
      "Never pay" has higher EU, so refuse.  

  ---

  ### **3. Comparison: Symmetry, Core Challenges, and Principled Differences**  
  #### **Mirror Images? Superficial Symmetry, Deep Asymmetry**  
  - **Superficial Similarity**:  
    Both involve Omega, perfect prediction, and a decision that *seems* causally irrelevant. In CM, paying in heads affects tails; in XB, paying in no-termites affects whether Omega sends the letter.  

  - **Core Asymmetry**:  
    - **CM's Counterfactual Branch**:  
      Tails is *counterfactual*—it didn't occur. Paying is a *sacrifice* for a *benefit in an unrealized branch*. CDT/EDT myopically focus on the actual branch.  
    - **XB's Actual Fact**:  
      Termites are *actual* (you just don't know the state). Paying *avoids a loss in the actual branch* but encourages Omega's exploitation. CDT/EDT focus on the immediate evidence.  
    - **Key Difference**:  
      In CM, the "good" branch (tails) is triggered randomly (coin flip). In XB, the "bad" event (blackmail) is triggered *by your decision rule itself*. This makes XB a **signaling problem** and CM a **counterfactual coordination problem**.  

  #### **Role of Predictor's Honesty and XOR Structure**  
  - **Omega's Honesty**:  
    - Crucial in both. Omega must be a perfect predictor to create the dilemma. If Omega could lie or err, the incentives change.  
  - **XOR Structure**:  
    - In XB, the termites' presence and Omega's letter are mutually exclusive (XOR). This links the letter to your decision rule.  
    - In CM, the coin flip partitions branches, but payment in one branch affects the other.  

  #### **Do They Pull in Opposite Directions?**  
  - **Yes**:  
    - FDT pays in CM (to benefit the counterfactual) but refuses in XB (to deter Omega).  
    - CDT/EDT refuse in CM (no local benefit) but pay in XB (to avoid local loss).  
  - **Why?**:  
    FDT optimizes global decision rules. CM rewards *cooperation with your counterfactual self*, while XB punishes *vulnerability to prediction-based exploitation*.  

  #### **Does Solving One Solve the Other?**  
  - **FDT/UDT solves both** with the same machinery: optimizing decision rules *ex ante* (updatelessness).  
  - **Extra Machinery Needed for CDT/EDT**:  
    - CDT requires **counterfactual causality** (e.g., adding causal links between branches).  
    - EDT requires **logical counterfactuals** (e.g., modeling how actions reflect on impossible worlds).  
    - Both must abandon *local* action evaluation.  

  #### **Is the Branch Difference (Counterfactual vs. Actual) a Framing Trick?**  
  - **No, it's principled**:  
    - In CM, the unrealized branch has no causal power over the actual world. Payment is purely a **precommitment to a cross-branch policy**.  
    - In XB, your decision rule affects **whether the blackmail scenario occurs**. The termites' existence is an actual fact, but Omega uses your *reputation* (decision rule) to exploit you.  
    - This difference explains why FDT treats CM as a **coordination game** and XB as a **deterrence game**.  

  ---

  ### **Conclusion**  
  - **Core Challenges**:  
    - CM tests whether you can "cooperate" with a counterfactual version of yourself.  
    - XB tests whether you can commit to a policy that deters predictors.  
  - **Symmetry**:  
    Superficially similar, but fundamentally asymmetric due to CM's *unrealized branch* vs. XB's *predictor-triggered event*.  
  - **Decision-Theoretic Resolution**:  
    FDT/UDT handles both by optimizing decision rules from an *ex ante* perspective. CDT and EDT fail both without extensions. The problems are duals but not mirrors—solving one illuminates the other, but their structures demand distinct intuitions (sacrifice vs. deterrence). 

  The takeaway: **FDT's "updateless" machinery**—evaluating actions as outputs of fixed decision functions—resolves both dilemmas, while CDT/EDT require ad hoc adjustments to escape their myopia.
