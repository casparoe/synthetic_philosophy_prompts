  The problems are not exact mirror images, but they both challenge CDT and EDT in similar ways by requiring the agent to consider the consequences of their decision function in all branches. The superficial difference (counterfactual branch vs actual branch) is not the key; the key is that the agent's decision function affects outcomes in branches that are not the current one. FDT/UDT provides a unified framework for handling both.
