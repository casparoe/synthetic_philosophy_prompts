  I'll structure the table clearly and end by noting that while the personnel purge reading has statistical support, it doesn't prove inevitability - which should help the user challenge their classmate's oversimplification.
answer: |-
  Here is a table analyzing the various readings of "revolutions devour their children," structured according to your specifications. This dissection aims to separate the rhetorical punch from the analytical substance.

  **Analysis of "Revolutions Devour Their Children"**

  | Reading (Label)                 | The Precise Claim                                                                                                                               | Claim Type       | Verdict (Reason)                                                                                 | What Would Decide It                                                                                                 | Framework (Fit)                                                            | Supports Inevitability Claim?                           |
  | :------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------- | :----------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------- | :------------------------------------------------------ |
  | **1. Personnel Purge**          | Most revolutions (statistically) lead to the violent removal/execution of a significant proportion of their initial revolutionary leadership. | Causal/Predictive | **Substantive & Defensible** (Supported by several major revolutions, though not universal)       | Comparative historical analysis of leadership survival rates across revolutions.                                      | **Contingency (Loose)** / **Ideology (Loose)** (Method of purge matters) | **Yes** (if framed statistically as common outcome)     |
  | **2. Ideological Auto-Cannibalism** | The internal logic/ideology of revolution inherently generates escalating radicalism/paranoia leading to purges of those deemed insufficiently pure. | Causal/Conceptual | **Contentious** (Plausible for Jacobinism; less so for others; ideology rarely operates alone) | Close study of revolutionary discourse dynamics, faction formation, and mechanisms of terror.                         | **Ideology (Tight)**                                                       | **Strongly Yes** (Implies internal necessity)           |
  | **3. Counter-Revolutionary Purge** | Revolutions generate powerful enemies; defeating these enemies consumes resources & lives, including those of revolutionaries ("children"). | Causal           | **Substantive & Defensible** (Revolutionary wars/counter-revolutions are major causes of death) | Analysis of specific conflicts, external threats, and casualty figures among revolutionary ranks.                   | **Class (Tight)** (Conflict focus) / **Contingency (Loose)** (War outcomes) | **No** (Devouring by external/internal *enemies*, not revolution itself) |
  | **4. Betrayal of Programme**    | The original ideals/promises of the revolution are destroyed or perverted by the revolutionary process itself.                                  | Evaluative/Causal | **Contentious** (Depends on defining the "true" programme; outcomes often complex mixes)         | Historical assessment of stated goals vs. institutional & social outcomes achieved.                                  | **Ideology (Tight)** / **Class (Loose)** (If driven by new elite formation) | **Yes** (Implies revolutionary process corrupts ideals) |
  | **5. Rupture with Origins**     | A successful revolution necessitates destroying its own founding myths/figures to establish new legitimacy.                                    | Conceptual        | **Platitude** (True by definition - successful revolution supersedes its origins)                 | Logical analysis of legitimacy shifts; historical examples of de-mythologization.                                    | **Ideology (Loose)** / **Contingency (Loose)**                            | **Only w/ Premise** (That destruction *must* be violent/devouring) |
  | **6. Agentic Revolution**       | Revolutions (as singular entities) possess agency and intentionally consume their creators.                                                    | Metaphorical     | **Not Even False** (Revolutions are processes/events, not agents with intent)                     | N/A - Category error.                                                                                               | **N/A** (Misplaced agency)                                                | **N/A**                                                 |
  | **7. Universal Law**            | *Every* revolution inevitably devours its children (personnel, ideals, or both).                                                               | Predictive        | **False** (Counterexamples exist - e.g., Glorious Revolution 1688, Carnation Revolution 1974)    | Existence of clear, relatively non-violent revolutionary transitions concerning leadership/ideals.                   | **Any** (But claim is false)                                              | **Yes** (By definition)                                 |
  | **8. Generic Tendency**         | Revolutions *tend to* lead to the violent removal of significant portions of their initial leadership (acknowledging counterexamples).         | Statistical       | **Substantive & Defensible** (Pattern holds for many defining revolutions)                       | Statistical analysis of revolutionary outcomes regarding leadership survival.                                        | **Contingency (Tight)** (Focuses on probabilistic outcomes)               | **Only w/ Premise** (That "tend to" implies near-inevitability in major cases) |
  | **9. Devouring the Future**     | The revolutionary promise of liberation/future good is destroyed by the violence/tyranny it unleashes.                                         | Moral/Evaluative | **Contentious** (Deeply value-laden; depends on cost-benefit analysis of outcomes)               | Long-term historical assessment of revolutionary impact vs. counterfactual scenarios; philosophical debate.          | **Ideology (Loose)** / **Class (Loose)**                                  | **No** (Focuses on outcome, not mechanism)              |
  | **10. Beneficiary Betrayal**    | The social groups who initially benefit most from the revolution ("children") are later sacrificed or marginalized by the new regime.         | Causal           | **Contentious** (Varies hugely; some groups gain long-term, others lose quickly)                 | Socio-economic analysis of group fortunes before, during, and after revolutions over extended periods.               | **Class (Tight)** (Focuses on group outcomes)                             | **No** (Betrayal need not be "devouring")               |

  **Concluding Paragraph:**

  In contexts like your seminar, the sentence is most commonly invoked to carry **Reading 2 (Ideological Auto-Cannibalism)** or **Reading 4 (Betrayal of Programme)**. This usage presupposes the *Ideology framework*, implying the Terror (or similar events) stemmed logically from the Revolution's founding principles (e.g., popular sovereignty, virtue, rupture), making it seem internally generated and thus inevitable. However, this rhetorical move often conflates these readings with **Reading 1 (Personnel Purge)** or **Reading 8 (Generic Tendency)** for emotional impact, trading on the undeniable historical fact of purges to imply a deeper, necessary ideological corruption. The most *interesting and true* reading is likely **Reading 8 (Generic Tendency)**: it acknowledges a robust historical pattern of revolutionary leadership purges (**Reading 1**) as statistically common without claiming universality (**Reading 7**) or inherent ideological necessity (**Reading 2**). It remains substantively defensible while being compatible with multiple frameworks – contingency explains *how* purges happen, class explains *who* often gets purged (rivals), and ideology explains *justifications* used. Crucially, **Reading 8** does **not** inherently support inevitability without the added, often unstated, premise that this tendency is so strong in major social revolutions as to be practically unavoidable. This allows for historical analysis without determinism.
