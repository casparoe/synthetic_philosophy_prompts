prompt: |-
  I'm a backend engineer, no philosophy training to speak of (one ethics elective in undergrad that I mostly slept through), and I've been going back and forth about this with a friend who's deep into effective altruism. I want to just lay out where my gut actually lands on a bunch of cases and have someone tell me what principle I'm implicitly running, because I'm pretty sure I'm being inconsistent somewhere and I can't find it myself.

  Here's where my gut goes. Five dollar coffee: obviously fine. Four hundred dollar mechanical keyboard when a forty dollar one works: fine, I don't feel even a twitch. Used car at 9k instead of 4k: fine. Two week trip to Japan instead of donating that money: fine, definately fine. But skipping my cousin's wedding to go to a charity fundraiser where I'm not even needed: not fine, and I'd deserve whatever flak I got. Cancelling a standing dinner with a friend because something better came up: not fine. Giving 10% of my salary: that feels above and beyond, praiseworthy, not owed. Giving nothing at all, ever, spending everything on me and my family: feels wrong but I'd say I'm within my rights. Quitting a career I'm good at and enjoy to go do something with more impact: not required, no way. And then: if my brother needs 6k or he loses his apartment, I have to give it, no question. If I'm the only match for a stranger's bone marrow transplant, I think I have to do that too, even though it's a week of my life and a needle in my spine. I'd also drop 3k on surgery for my dog without blinking, and I'd have to think about 3k for a stranger's medical bill, which my friend says is monstrous and I sort of agree and sort of don't.

  The two that don't fit for me. First, I set up one of those round-up donation things on my card at 1% and felt like a good person; then I realized I could set it to 20% and genuinely not notice the difference in my month, and I still felt like 20% was alot to ask and 1% was what a decent person does, and I can't defend that at all. Second, I'd fund my kid's piano lessons at 2k a year before I'd give 2k to something that saves a life, and if you make me say that arithmetic out loud, I'm saying piano lessons outrank a life, which I don't believe for a second. My friend says this just proves I'm a hypocrite and should give until it hurts; I don't buy that either, the world where everyone gives until it hurts sounds awful and also seems to make ordinary life, mine and the recipients', impossible.

  So is there a principle that gets most of my verdicts? I've tried the simple maximize-the-good version (kills almost everything I called fine), I've tried a don't-actively-make-things-worse version (kills the bone marrow verdict and probably the brother one), and I've tried a I-owe-nothing-beyond-what-I'd-want-others-to-owe-me version (lets the never-donate verdict through, which I don't want). Give me a principle stated precisely enough that I can actually check it against these, tell me which of my verdicts it has to overturn and why, and say what it predicts for a case I haven't listed: taking a job that pays 80k more but does measurable harm, with the 80k going to effective charity. And if the honest answer is that my verdicts don't come from one principle, give me the two or three candidates and the tradeoff between them rather than a fudge. My friend keeps saying supererogatory and I just nod.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're a backend engineer without much philosophy background, struggling to reconcile their gut feelings about various ethical scenarios with their friend's effective altruism (EA) views. The user listed specific cases where their intuition deems certain actions acceptable or not, and they feel inconsistent, especially with the 1% vs 20% donation and funding piano lessons over saving a life. Their main request is to find a unifying principle or recognize if multiple principles are at play.

  First, I need to map out their responses. They're fine with personal luxuries (coffee, keyboard, Japan trip) but draw the line at skipping personal commitments (wedding, dinner). They see charity as praiseworthy but not obligatory, except in emergencies involving close relations (brother) or direct, significant interventions (bone marrow). There's tension when personal expenditure (dog surgery, kid's piano) conflicts with helping strangers. The two problematic cases highlight a dissonance between their actions and stated beliefs.

  The user's identity as a backend engineer suggests they value logical consistency and clear principles. Their frustration with EA's "give until it hurts" stance indicates a need for a balanced framework that accommodates personal life without rejecting altruism entirely. The deeper need might be justifying their lifestyle choices ethically while maintaining relationships and personal happiness, avoiding the perceived extremism of EA.

  Next, analyzing their intuitions. The acceptance of personal spending aligns with agent-centered prerogatives (Scheffler), allowing self-interest. The refusal to break commitments points to deontological duties to specific others. The obligatory help for brother and bone marrow donation reflects strong partiality and possibly a threshold deontology where extreme harm must be prevented. The discomfort with zero charity suggests a baseline duty to aid, but limited. The piano vs life-saving conflict reveals that proximity and personal relationships heavily weight their moral calculus, even against utilitarian outcomes.

  The principles in tension here are: 1) Agent-centered prerogatives (self-allocation), 2) Relational duties (obligations to specific people), 3) Moderate negative utilitarianism (prevent severe harm), and 4) Weak positive duties (minimal aid to strangers). 

  For the job scenario (higher pay but harm, donating extra), their principle would likely reject it because causing harm violates the "don't worsen others" tenet, even if offset by charity. This maintains integrity but may conflict with maximizing good.

  The user might need to accept that multiple principles coexist, with context deciding which takes precedence. They can refine thresholds (e.g., define "significant harm") to reduce arbitrariness. Recognizing that proximity intensifies duties could justify piano lessons over distant aid, but they might still feel uneasy, indicating an unresolved conflict between partiality and impartiality. The key is balancing these without demanding unrealistic self-sacrifice, which addresses their aversion to EA's extremity.
answer: |-
  Your intuitions are remarkably consistent with a blend of **Moderate Agent-Centered Prerogatives** combined with **Strong Relational Duties** and a **Threshold Deontology** for preventing severe harm. Here's the precise principle:

  **"You have significant freedom to prioritize your own projects, relationships, and moderate well-being (agent-centered prerogative). However, this is constrained by:  
  1.  **Negative Duty:** Do not *actively cause* severe harm.  
  2.  **Relational Duty:** Fulfill significant obligations arising from specific relationships (family, close friends, commitments).  
  3.  **Minimal Samaritan Duty:** Prevent *severe, immediate harm* to *anyone* when you can do so at *minimal-to-moderate cost* to yourself, *especially* when uniquely positioned.  
  4.  **Baseline Positive Duty:** Contribute *something* non-trivial towards alleviating severe suffering, but the level is discretionary beyond that baseline."**

  **How this principle explains your verdicts:**

  1.  **$5 Coffee, $400 Keyboard, $9k Car, Japan Trip:** All fall squarely under the **agent-centered prerogative**. You're prioritizing your preferences/projects without violating constraints.
  2.  **Skipping Cousin's Wedding for Unneeded Fundraiser:** Violates **Relational Duty**. A cousin's wedding is a significant relationship obligation. The fundraiser, while positive, isn't preventing immediate harm where you're uniquely needed (*Minimal Samaritan Duty* doesn't trigger).
  3.  **Cancelling Standing Dinner:** Violates **Relational Duty** (implicit commitment/expectation within a friendship).
  4.  **Giving 10%:** Feels "above and beyond" because it exceeds the **Baseline Positive Duty** (you feel *something* is owed). Praiseworthy because it's discretionary generosity beyond the minimum.
  5.  **Giving Nothing:** Feels "wrong but within rights" because it likely violates the **Baseline Positive Duty** (you feel *some* contribution is owed). "Within rights" reflects the strength of the **agent-centered prerogative** shielding most income.
  6.  **Not Quitting Career:** Protected by **agent-centered prerogative**. Your career is a major life project/source of well-being. The "more impact" job isn't required by any duty listed (it's positive, not preventing immediate harm uniquely by you).
  7.  **Giving $6k to Brother:** Triggered by **Relational Duty** (preventing severe harm - homelessness - to immediate family). Cost is significant but deemed "moderate" in this context due to relationship.
  8.  **Bone Marrow Donation:** Triggered by **Minimal Samaritan Duty**. Prevents *severe, immediate harm* (death) to *anyone* at a *minimal-to-moderate cost* (a week + discomfort) *and* you're uniquely positioned (only match). The needle in the spine, while unpleasant, doesn't constitute "severe harm" *to you* in comparison.
  9.  **$3k for Dog:** **Relational Duty** (pets are family members for many). Also involves your own emotional well-being.
  10. **Hesitating on $3k for Stranger:** Highlights the *limit* of the **Minimal Samaritan Duty**. $3k is likely seen as a *significant* cost, not minimal/moderate, *and* the harm, while severe, isn't immediate/imminent *to you* in the same way as the bone marrow case. The **agent-centered prerogative** protects your $3k. Your discomfort comes from the pull of the *Baseline Positive Duty* and the recognition of severe suffering.
  11. **1% vs 20% Round-Up:** The **Baseline Positive Duty** feels satisfied by 1%. 20% feels like a significant encroachment on your **agent-centered prerogative**, exceeding the baseline requirement, even if financially painless. The baseline is often psychologically set low ("doing my bit").
  12. **Piano Lessons vs Saving a Life:** **Relational Duty** (providing enrichment/opportunity for your child) and **Agent-Centered Prerogative** (your child's development is your project) overwhelmingly trump the general **Baseline Positive Duty** or potential **Minimal Samaritan Duty** (as $2k/year isn't preventing *one* specific, immediate, severe harm you are uniquely positioned to stop). The arithmetic feels monstrous because it exposes the prioritization inherent in agent-centered and relational ethics vs pure utilitarianism.

  **Which verdicts might need overturning? Why?**

  1.  **Giving Nothing:** Your principle's **Baseline Positive Duty** implies giving *nothing* is wrong. You'd need to either drop this duty (making "giving nothing" truly fine) or accept that verdict is inconsistent. Your discomfort suggests keeping it.
  2.  **$3k for Stranger's Medical Bill:** The principle *protects* your hesitation. If you feel this is genuinely "monstrous," it suggests your **Minimal Samaritan Duty** threshold might be lower than you think, or your **Baseline Positive Duty** might be higher. To align with that feeling, you'd need to adjust the principle to define "moderate cost" more generously or strengthen the baseline.

  **Prediction: The Harmful Job with $80k Donation**

  *   **Your Principle's Verdict:** **Not Permissible.**
  *   **Why:** It violates the **Negative Duty** ("Do not *actively cause* severe harm"). Taking a job that "does measurable harm" means you are actively participating in causing harm. Donating the extra income is a positive act, but it doesn't erase the negative act of *causing* harm. The **agent-centered prerogative** doesn't shield causing harm to others for personal gain (even if donated). This aligns with your intuition against skipping the wedding for a fundraiser – causing relational harm isn't justified by doing good elsewhere.

  **The Honest Answer: Multiple Principles in Tension**

  Your intuitions *are* driven by multiple, sometimes conflicting, principles:

  1.  **Agent-Centered Prerogative (Scheffler):** You have a right to devote a substantial portion of your resources and energy to your own life, projects, and well-being. This is your dominant principle for discretionary spending.
  2.  **Relational / Role-Based Duties (Deontological):** Strong obligations arising from specific relationships (family, close friends) and commitments you've made. This trumps the prerogative in cases like brother, wedding, dinner.
  3.  **Moderate Negative Utilitarianism / Minimal Samaritanism:** A duty to prevent severe, immediate harm when you can do so at a cost you deem reasonable, especially if uniquely positioned. Explains bone marrow, potentially nudges on stranger's bill. This has a *threshold* - it only kicks in for severe harm.
  4.  **Weak Positive Duty / Beneficence:** A baseline expectation to contribute *something* to alleviate suffering, but significantly weaker than the prerogative or relational duties beyond that baseline. Explains 1% feeling sufficient and "giving nothing" feeling wrong.

  **The Tradeoff:** The core tension is between **your own life/projects/relationships** (Prerogative & Relational Duties) and **impartial good** (Negative/Samaritan & Positive Duties). Your intuitions consistently prioritize the former *except* when:
  *   Relational duties specifically demand action (Brother, Wedding).
  *   Preventing severe harm is possible at a cost below your perceived threshold (Bone Marrow).
  *   A minimal baseline of helping strangers is neglected (feeling "wrong" about giving nothing).

  **"Supererogatory" Explained Simply:** Your EA friend uses this because Effective Altruism often blurs the line between duty and supererogation. EA argues that because the potential good from donations is *so immense* (saving lives for relatively little money), what seems like extreme sacrifice (giving 20%, changing careers) is actually a *duty*. Your intuitions firmly place significant giving and career changes in the **supererogatory** category – morally good, praiseworthy, but *beyond* what is strictly owed or required by duty. Your principles define the duties more narrowly, leaving a larger space for permissible, non-optimal choices protected by the agent-centered prerogative. You reject the EA claim that ordinary life is only permissible if it's the *most* effective way to do good.
