  Hmm, they want this framed very precisely - no fluff, no citations, just razor-sharp arguments. The opening sentence must immediately state: "Does the responsibility gap reflect a factual absence of blameworthy human agents, or does it arise from our choice of causal description - and what principled criteria constrain that choice?" That's the thesis compressed into one line.

  Their technical background is crucial here. Unlike philosophers, they can actually build causal models of warehouse robot incidents or failed braking systems. That's the unique angle: show how blame attribution flips when you recode the same event at different granularities (e.g., modeling "training data bias" as a variable vs. lumping it into "system behavior").

  The existing literature section needs dismantling without naming names. The four standard responses: 
  1) "The gap is real - we need new liability frameworks" 
  2) "It's illusory - someone's always blameworthy" 
  3) "Temporary conceptual lag" 
  4) "Misplaced objectivity - responsibility is socially constructed" 
  All fail to address the description-relativity problem. Even empirical studies on who people blame won't resolve it - that just documents biases.

  Methodology should feel like an engineer's workplan: 
  Phase 1: Build 2-3 concrete scenario models (robot harm, brake failure) 
  Phase 2: Test when counterfactual causality flips blame attributions 
  Phase 3: Stress-test admissibility criteria (e.g., "descriptions must use evidence available pre-harm") 
  Phase 4: Compare against real engineering artifacts - audit logs, version control "blame", incident reports

  The deliverables framing is smart: success isn't about "solving" the gap but mapping its contingencies. Possible outcomes: 
  A) "Here's how to confine gaps to specific cases" 
  B) "All criteria are pragmatic - it's policy, not truth" 
  C) "Surprise! A canonical description exists" 
  Failure would be if blame-flipping only happens in artificial models.

  Scope management feels honest - a part-time year can't overhaul causation theory or legal doctrine. They'll prioritize model-building over generalization. And their engineering credibility? Mention it briskly: "I build these systems and their diagnostics - that grounds the models."

  The tone stays uncompromisingly technical but avoids jargon. No "many scholars think..." - just clean assertions. When describing the "social practice" counterargument, reduce it to: "If responsibility is constituted by our practices, the gap question dissolves - but this sidesteps whether those practices can be critiqued as inconsistent."

  Final touch: explicitly state what gets cut if time runs short - no original formal causation work, no legal analysis. That shows evaluators they've thought through feasibility.
answer: |-
  ## Research Proposal: The Responsibility Gap as a Relativism of Description

  **Is the responsibility gap for autonomous systems an inescapable fact about the world, revealing no single human agent satisfying the conditions for blame under *any* defensible causal description of a harm, or is it an artifact of our *choice* of description, such that for any harm there exists *at least one* defensible description under which some human is blameworthy – and what principled, non-question-begging criterion determines which descriptions are admissible for assigning blame?**

  The pervasive concern surrounding the "responsibility gap" assumes a fundamental difficulty: when an autonomous system causes harm, tracing blame to a specific human agent seems impossible because the causal chain involves diffuse contributions – design choices, training data curation, deployment decisions, and the system's specific behavior – none of which, individually, seem to satisfy the ordinary conditions for blame (knowledge, control, duty violation). This framing, however, implicitly assumes that the identification of *actual causes* of a harm is a fixed, objective feature of the event itself, independent of how we choose to model or describe it. Drawing on counterfactual and structural-model accounts of causation prevalent in computer science and formal reasoning, this proposal challenges that assumption. In these frameworks, whether a specific factor (e.g., a designer's choice, a deployment manager's decision) counts as an actual cause of an outcome depends critically on the granularity and structure of the model used: the chosen variables, their possible values, what counts as the "default" or "normal" state, and which upstream factors are explicitly represented. Recarve the causal model – represent actions more finely, include training as an explicit intervention, shift the default baseline – and the set of identified actual causes for the *same physical harm* can change dramatically, potentially shifting blameworthiness onto or away from specific human agents. If causation is description-relative, then the apparent responsibility gap might not be an inherent feature of autonomous systems but rather an emergent property of specific, perhaps arbitrary, ways we describe the causal web surrounding a harm. The core problem thus transforms: the gap exists under *some* descriptions but not others, and the critical philosophical and practical task becomes establishing which descriptions are *admissible* for the purpose of assigning blame.

  Existing responses to the responsibility gap do not adequately address this description-relativity, leaving the core question open. The dominant view holds the gap is real and necessitates novel accountability mechanisms like strict liability regimes, mandatory insurance pools, or new institutional duties focused on system safety rather than individual blame. While practically important, this approach concedes the gap without scrutinizing whether the underlying causal analysis driving that concession is fixed or contingent. Conversely, another view insists the gap is illusory, arguing that some human (designer, operator, deployer) always retains sufficient control or foreseeability to warrant blame. This often relies on a favored description (e.g., focusing solely on deployment decisions) while dismissing others that diffuse responsibility. A third perspective suggests the gap is a temporary conceptual lag; as our understanding of complex systems evolves, we will naturally extend existing responsibility concepts to cover these new cases. This optimism doesn't grapple with the formal possibility that causal attributions themselves may be fundamentally unstable across descriptions. Finally, some argue the question is malformed, claiming responsibility is not a matter of discovering pre-existing facts about causation and agency but is constituted by social practices and norms. While insightful regarding the social dimension, this view risks sidestepping the normative question of *which* practices and descriptions *should* govern blame, particularly when established practices seem inadequate. Crucially, none of these approaches explicitly confronts or provides a criterion for constraining the description of the harm itself – the model's variables and structure – that is used to assess causal contribution and thus blameworthiness. Simply observing whom people *actually* blame in empirical studies won't settle it, as this documents current practice, not its justification. Similarly, analyzing existing legal liability doctrines reveals how the law *currently* carves the world, not whether that carving is the only defensible one for the ethical question of blame.

  This project will tackle the question head-on through a method combining formal modeling, philosophical analysis, and engineering practice, structured over the fellowship year:

  1.  **Scenario Modeling (Months 1-3):** Select 2-3 concrete, well-specified harm scenarios involving autonomous systems (e.g., a warehouse robot injures a worker due to an unexpected environmental interaction combined with a training data gap; an automated emergency braking system fails to activate due to a sensor limitation known during design but not mitigated). For each scenario, construct 2-3 distinct structural causal models at different levels of granularity and scope:
      *   *Fine-grained:* Variables representing individual developer choices, specific training data selection steps, deployment manager decisions, and specific system states/sensor inputs.
      *   *Coarse-grained:* Variables representing holistic "system design," "training process," "deployment approval," and "system behavior."
      *   *Mixed/Alternative:* Models incorporating specific defaults (e.g., "normal operation" vs. "failure mode"), representing or abstracting away upstream factors like corporate pressure or regulatory context.
      Using a standard counterfactual account of actual causation (e.g., based on Halpern-Pearl minimality), formally demonstrate how the identification of human actions as actual causes of the harm *flips* depending on the model chosen. This will concretely illustrate the description-relativity thesis.

  2.  **Criteria Assembly and Testing (Months 4-8):** Systematically assemble and evaluate candidate criteria for constraining admissible descriptions for blame attribution, testing them against the modeled scenarios:
      *   **The "Normal/Default" Criterion:** Only descriptions where variables represent deviations from a statistically or normatively defined "normal" baseline are admissible.
      *   **The "Agent's Evidence" Criterion:** Only descriptions using variables representing states of the world and possibilities *known or knowable* to the potentially blameworthy agent(s) at the time of their action are admissible.
      *   **The "Purpose of Blame" Criterion:** The admissibility of a description depends on the primary goal of blaming – backward-looking desert (holding responsible for the specific act) versus forward-looking aims (deterrence, system repair, victim compensation).
      *   **The "No Retrospective Gerrymandering" Constraint:** Descriptions must be framed in terms of categories and distinctions that were meaningfully available *before* the specific harm occurred, preventing post-hoc sculpting to create or avoid a culprit.
      Assess each criterion for coherence, non-circularity, practical applicability, and its ability to yield stable blame attributions across the different models. Does it reliably narrow the range of admissible descriptions? Does it sometimes yield a gap and sometimes not? Does it align with intuitive judgments?

  3.  **Engineering Practice Analysis (Months 9-11):** Investigate how attribution is handled in real-world engineering contexts relevant to system failure. Incident postmortems, version-control "blame" annotations, audit log analysis, and model documentation practices implicitly embody theories of causal contribution and responsibility. Analyze examples of these artifacts:
      *   Do they exhibit a consistent (if implicit) approach to granularity and variable choice?
      *   How do they handle upstream vs. proximate causes?
      *   Do their implicit criteria align with or diverge from the philosophical criteria tested in Phase 2?
      This phase is explicitly exploratory and suggestive; its goal is to ground the theoretical work in existing practices and identify potential points of friction or alignment, not to provide definitive validation.

  4.  **Synthesis and Drafting (Month 12):** Integrate findings, articulate the implications for the responsibility gap debate, and draft the core results.

  My background as a software engineer is central to this project's feasibility. Constructing, varying, and rigorously analyzing multiple formal causal models of complex system behaviors requires technical skills in modeling and logic that are core to my profession. Furthermore, my familiarity with engineering artifacts like version control, audit logs, and incident reports provides essential insider access and understanding for Phase 3, allowing me to interpret these practices with nuance beyond a purely philosophical analysis.

  **Outcomes and Scope Management:**
  A successful outcome would be a clear articulation of one of several possibilities:
  *   The gap is description-relative, but criterion *X* (e.g., Agent's Evidence + No Gerrymandering) successfully narrows admissible descriptions, confining the gap to specific, identifiable classes of cases where no human *could* have reasonably foreseen or controlled the harm under *any* admissible description.
  *   Description-relativity is real, but all defensible criteria are fundamentally pragmatic (e.g., tied to the Purpose of Blame), meaning the existence of a gap is a policy choice about the goals of accountability, not a discovery of a metaphysical fact.
  *   Contrary to the initial hypothesis, a canonical description (e.g., fixed by fundamental causal structure combined with the agent's epistemic state) *can* be defended, meaning the gap, where it exists, is indeed a feature of the world under that description.

  Failure would manifest as:
  1.  The causal models only show blame-flipping under highly artificial or gerrymandered variable sets, undermining the significance of description-relativity for real-world cases.
  2.  Every proposed criterion either collapses into circularity, proves practically inapplicable, or merely restates a desired conclusion about blame without independent justification.

  Given the part-time scope of one year, the project is deliberately bounded. **Original formal work on causation theory, broad generalization beyond the specific modeled scenarios, and detailed analysis of legal doctrine are explicitly out of scope and would be the first elements cut if time pressures arise.** The focus remains on building the models, testing the criteria against them, and engaging suggestively with engineering practice to answer the core question about the nature and constraints of the gap. The deliverable will be a rigorous analysis demonstrating whether the gap withstands scrutiny when the relativity of causal description is foregrounded, and what, if anything, constrains that relativity for the purpose of blame.
