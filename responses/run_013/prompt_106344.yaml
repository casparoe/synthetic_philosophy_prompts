prompt: |-
  ok so for my philosophy class we're reading Aristotle's Politics and we hit the part where he says some people are slaves by nature — that some people are just built to be ruled, and it's actually good for them, the way a body is supposed to be ruled by a soul. i have to write a paper that argues a position on it, and i really don't want to do the usual he-was-a-man-of-his-time thing or the slavery-is-bad-obviously thing.

  here's the angle i want you to build into the strongest version it can be. take his own test for a natural slave seriously — a natural slave is someone who can't run his own life well, so his good is served by carrying out somebody else's plan instead. i want to argue that if you actually accept that test, the whole thing collapses, because it turns the relation into a two-way street in a way he can't afford. a master's defining activity is ruling or commanding, and you can't command if there's nobody on the other end doing the executing, so the master depends on the slave for the very thing that makes him a master. and he keeps leaning on the soul/body comparison — the slave needs the master's reason the way a body needs a soul — but a soul with no body isn't a soul at all, it's nothing, so if you push the comparison the two sides come out equally dependent, which wrecks the one-is-a-ruler-by-nature, other-is-ruled-by-nature asymmetry he needs. so my claim is that his doctrine either proves too much, because everybody ends up a natural slave since everybody leans on other people for the stuff they're bad at, or it proves nothing, because the test can't pick slaves out from anyone else, and the asymmetry is just assumed rather than argued for. ive been calling it the both-ways problem in my notes if that helps you frame it.

  please also take the obvious comeback seriously and answer it, because my teacher will bring it up: needing someone for your activity isn't the same as being ruled by them. i need the baker but i don't rule the baker. so maybe the master's dependence on the slave is real but it isn't the kind of dependence that makes you a slave. deal with that properly, and if you think my angle is actually weak, say so and argue the other side instead, i'd rather find out now than in front of the class.

  one more thing, i have to hand this in as an essay, so write it as continuous prose, normal paragraphs, no headings, no bullet points, no bold, no tables, just the way you'd write a long email. and don't dump a bunch of quotes on me — i can't look anything up and i don't trust a quote i can't check.
