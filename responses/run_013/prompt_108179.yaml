prompt: |-
  I've been going back and forth with my advisor about wether letter identity is intrinsic or relational, and I need a worked case rather than another round of "well, prototypes seem to work fine." Build me a thought experiment, using a made-up typeface, where a prototype theorist and a relational/contrastive theorist give opposite verdicts about the same shape: the shape has to be one a normal reader would call an 'a' without hesitation while the relational story says it isn't one (if that direction won't go, flip it and tell me why the other direction is the hard one). Constraints: prose only, no drawings; a paragraph or two; and no real typeface, I don't want us arguing about Helvetica. A hint for getting in the weeds: a lot of what keeps an 'a' an 'a' in a given face is just what keeps it from being an 'o' or a 'd' in that same face — try to make the case turn on that. Then do the check: say what the prototype theorist is measuring, what the relational theorist is measuring, and which single fact in the case separates them. Then tell me what happens if the face contains only that one letter — does the relational view end up saying there are no letters at all, and is that a reductio or a bullet to bite? Say whether your verdict makes style a property of the individual letter or of the whole face, and finish with how a defender of whichever view comes out badly would try to block the case.
