  We are going to create a thought experiment with a made-up typeface called "Contrastiva". In this typeface, we will design a shape that a prototype theorist would call an 'a' without hesitation, but a relational theorist would deny is an 'a' because of the contrasts it fails to make with other letters in the same typeface.

  The Case:
  Consider the typeface Contrastiva. In this typeface, the typical 'a' is a double-story design, with a closed bowl and a rising stem on the right. However, we introduce a variant shape for the letter 'a' that is a single-story design, looking exactly like an 'o' with a straight vertical stroke attached to its right side. This shape is what we are focusing on. Now, in Contrastiva, the letter 'o' is a perfect circle, and the letter 'd' is an 'o' with a straight vertical stroke on the left side. Thus, our variant shape (the 'o' with a vertical stroke on the right) is identical to the typical 'a' in many sans-serif typefaces (like the familiar single-story 'a'). A normal reader would immediately call this shape an 'a'. However, in the context of Contrastiva, we have a problem: the letter 'd' is defined as an 'o' with a vertical stroke on the left, and the letter 'o' is a circle. Therefore, the relational theorist would argue that the variant shape (which we are calling an 'a') must be contrasted with the 'd' and the 'o'. But note: in Contrastiva, there is also a letter that is an 'o' with a vertical stroke on the right — and that is defined as the letter 'b'. Wait, let's correct that: we want the variant shape to be an 'a', but if the typeface already has a letter that is an 'o' with a vertical stroke on the right as a 'b', then the shape we are considering would be confused with the 'b'. To avoid that, we must design Contrastiva so that the letter 'b' is different (say, with a straight vertical stroke and a semi-circle attached to the top right). So, in our typeface:

  - 'o' is a circle.
  - 'd' is an 'o' with a vertical stroke on the left (so the circle is on the right of the stroke).
  - 'b' is an 'o' with a vertical stroke on the right, but the circle is attached at the top half (so it looks like a traditional 'b').
  - The variant shape we are considering for 'a' is an 'o' with a vertical stroke attached on the right, but the circle is attached at the bottom half (so it looks like a traditional single-story 'a').

  But note: in this design, the variant shape (the 'a') is now an 'o' with a vertical stroke on the right attached at the bottom. However, in Contrastiva, what if there is no other letter that has a circle with a stroke on the right attached at the bottom? Then it might be unique. But we want the relational theorist to deny it is an 'a'. So we must set up the typeface such that the relational contrasts are defined in a way that the variant shape does not fit the pattern for 'a'. How?

  In Contrastiva, the letter 'a' is defined by having a closed bowl and a rising stem on the right (double-story). But we are introducing a single-story version. However, the relational theorist might argue that the single-story version is not an 'a' because in this typeface, the single-story circle-with-stroke-on-right is already used for the letter 'q'. Wait, let's set it up:

  In Contrastiva:
  - The standard 'a' is double-story.
  - The letter 'q' is a circle with a vertical stroke on the right, attached at the bottom (exactly the shape we are using for the variant 'a').

  Therefore, the shape that we are presenting (which is the same as the 'q' in this typeface) is already assigned to 'q'. So if we see that shape in the typeface, it must be a 'q'. However, we are now using that same shape for a variant of 'a'. 

  But wait, the problem is: if we present that shape in isolation, without the rest of the typeface, the prototype theorist would call it an 'a' (because it matches the prototype of a single-story 'a' that they have in mind). However, in the context of the entire typeface Contrastiva, the relational theorist would say it is a 'q' because that is the role it plays in the system of contrasts: it contrasts with the 'o' (circle) and the 'd' (circle with stroke on left) and the 'b' (circle with stroke on right attached at top) and the 'q' is the circle with stroke on right attached at bottom.

  Therefore, the case: We have a shape that is a circle with a vertical stroke attached at the bottom on the right. In isolation, everyone calls it an 'a'. But in the typeface Contrastiva, that exact shape is used for the letter 'q'. Now, we are considering a new variant of the letter 'a' in Contrastiva that uses this same shape. The prototype theorist, looking at the shape, says it is an 'a' because it matches the prototype (the typical single-story 'a'). The relational theorist says that in this typeface, that shape is not an 'a' because it is already the shape of the 'q'. Moreover, in the relational system, the 'a' must contrast appropriately with the 'o' and the 'd'. The standard 'a' in Contrastiva (double-story) does that: it has a closed bowl and a stem, which the 'o' does not have, and it has a stem on the right (unlike the 'd' which has it on the left). But the variant shape (which we are trying to use for 'a') does not contrast appropriately with the 'q' because they are the same shape. Therefore, the relational theorist would say: in this typeface, that shape is a 'q', and if we use it for 'a', then we break the contrast between 'a' and 'q'. Hence, it cannot be an 'a'.

  The single fact that separates them: The prototype theorist is measuring the similarity of the shape to a stored representation (prototype) of the letter 'a'. The relational theorist is measuring the role the shape plays in the system of contrasts within the typeface. The separating fact is that in the typeface Contrastiva, the shape in question is already used for the letter 'q', and thus the relational theorist assigns it to the category 'q' because of its position in the contrastive system.

  What if the face contains only that one letter? If the typeface contained only the letter in question (the circle with a vertical stroke attached at the bottom on the right) and no other letters, then the relational view would have a problem. The relational theorist might say that without a system of contrasts, there is no letter identity. This might lead to the claim that there are no letters at all in a typeface with only one shape. This seems like a reductio ad absurdum because we would normally say that the shape is an 'a' even if it's alone. However, a relational theorist might bite the bullet and say that without contrasts, the shape is not a letter but just a shape. Alternatively, they might say that the contrast is with the background or with other possible letters (even if not present), but that's stretching the relational view.

  Style: This verdict makes style a property of the whole face, not the individual letter. The relational view requires the entire system of contrasts to assign identity.

  Defending the prototype view: A defender of the relational view might try to block the case by arguing that the prototype theorist is ignoring the context of the typeface. They might say that in the context of Contrastiva, the shape is unambiguously a 'q', and calling it an 'a' would be a mistake because it breaks the consistency of the typeface. They might also argue that the prototype theorist is relying on a prototype from a different typeface (e.g., a common sans-serif) and thus is not being faithful to the internal logic of Contrastiva.

  Defending the prototype view against the relational view: The prototype theorist might argue that the relational view overemphasizes the system and ignores the intrinsic features of the shape. They might say that the shape is so similar to the prototype of 'a' that it should be called an 'a' regardless of the typeface, and if the typeface uses it for 'q', then that is a design flaw that might cause confusion, but it doesn't change the fact that the shape is an 'a'. However, this might be problematic because in a consistent typeface, the same shape cannot be both 'a' and 'q'. So the prototype theorist might have to concede that in the context of the typeface, the shape is a 'q', but they would maintain that in absolute terms (without context) it is an 'a'. This leads to a kind of context-dependence that the prototype view typically avoids.

  Alternatively, the prototype theorist might say that the prototype for 'a' is flexible and can adapt to the typeface. But then they move closer to the relational view.

  In conclusion, the case shows that the prototype view focuses on intrinsic features (matching a stored prototype) and the relational view focuses on the contrasts within the system. The key separating fact is the assignment of the same shape to two different letters in the same typeface (or the same shape being used for a different letter in that typeface). Without a system of multiple letters, the relational view struggles to assign letter identity, which might be seen as a weakness. On the other hand, the prototype view might be too rigid and context-insensitive.
answer: |-
  ### Thought Experiment: The Case of "Contrastiva" Typeface
  Imagine a typeface called "Contrastiva" with minimalist, circular glyphs. Its letters derive identity primarily from relational contrasts:  
  - **'o'** is a perfect circle.  
  - **'d'** is an 'o' with a vertical stroke extending *up* from its leftmost point.  
  - **'a'** is defined by a *counter-contrast*: it must have (1) a closed bowl like 'o' but (2) a vertical stroke on the *right* that extends *downward* (distinguishing it from 'd'’s upward stroke).  

  Now, consider a glyph **X**: a circle with a short vertical stroke attached to its right side, extending downward. By prototype theory, **X** is unequivocally an 'a'—it matches the global prototype (e.g., sans-serif 'a') with its rounded bowl and descending stroke. A reader would instantly call it 'a'.  

  But in Contrastiva, the relational theorist denies **X** is an 'a'. Here’s why:  
  - Contrastiva’s 'a' must contrast with 'd' by having a stroke on the *right* (not left) and extending *down* (not up).  
  - **X** has the stroke on the right, but it fails the second contrast: its stroke is too short to extend below the circle’s baseline, making it visually ambiguous with 'o'. In Contrastiva, 'o' has no strokes, so **X**’s minimal stroke doesn’t create sufficient differentiation. Worse, **X**’s stroke points *down*, yet doesn’t reach the baseline, blurring the 'a'-vs-'o' distinction. Thus, relationally, **X** isn’t an 'a'—it’s a flawed glyph that violates the typeface’s internal contrasts.  

  ### Key Measurements & Separating Fact  
  - **Prototype theorist**: Measures similarity to an idealized 'a' (bowl + descending right stroke). **X** scores high.  
  - **Relational theorist**: Measures **X**’s *distinctiveness* from 'o' and 'd' within Contrastiva. **X** fails because its stroke is too short to contrast cleanly with 'o'.  
  - **Separating fact**: **X**’s stroke length. If extended below the baseline, relationalists accept it as 'a'; at its current length, they reject it. Prototype theory ignores this contextual requirement.  

  ### Single-Letter Typeface: Reductio or Bite?  
  If Contrastiva contained only **X**, the relational view concludes **no letter exists**—identity requires contrasts. This is a *reductio*: it defies intuition (we’d still call **X** 'a'). Prototype theory avoids this, assigning identity based on intrinsic form. The relationalist must bite the bullet, insisting letters are *system-dependent*.  

  ### Style: Individual or Systemic?  
  This verdict makes **style relational**, not intrinsic. **X**’s identity hinges on Contrastiva’s *whole system* of contrasts (e.g., 'o'’s purity, 'd'’s upward stroke). An individual glyph’s "style" is meaningless without the system.  

  ### Blocking the Case: A Relationalist Defense  
  A relationalist might argue:  
  > "**X** *could* be an 'a' if Contrastiva’s design rules allowed short strokes. But in this typeface, strokes *must* extend beyond the circle to create contrast. **X** breaks the system, so it’s not 'a'—it’s a design error. Prototype theory errs by ignoring typeface-specific constraints."  

  This defense prioritizes systemic coherence over isolated resemblance, but at the cost of flexibility in edge cases.  

  ---  
  **Summary**: Prototype theory sees **X** as 'a' via intrinsic form; relational theory rejects it due to failed contrasts with 'o'/'d'. Stroke length is the pivot. The relational view collapses in single-glyph typefaces, forcing a choice between systemic rigor and intuitive recognition.
