answer: |-
  ### Exam Question (90 minutes)  
  **"Guarded Dominance and the Perils of Imprecision: A Regulatory Dilemma"**  

  A public regulator must decide whether to roll out (R) or hold back (H) a novel intervention. Three states of the world are relevant:  
  - **s₁**: Severe unintended consequences occur.  
  - **s₂**: No significant effects (positive or negative).  
  - **s₃**: Major benefits materialize.  

  Expert evidence specifies uncertainty as a *credal set*: all probability distributions where:  
  - \( p(s_1) \in [0.2, 0.5] \)  
  - \( p(s_3) \in [0.1, 0.4] \)  
  - \( p(s_2) = 1 - p(s_1) - p(s_3) \) (ensuring valid probabilities).  

  Utilities are:  
  - **R**: 10 (s₁), 4 (s₂), 0 (s₃)  
  - **H**: 0 (s₁), 5 (s₂), 9 (s₃)  

  The regulator uses **"guarded dominance"** for decisions:  
  > *R beats H* iff min expected utility (EU) of R > max EU of H.  
  > If neither beats the other, either may be chosen *with justification*.  

  **Answer the following in a coherent essay:**  
  1. Calculate the range of expected utilities for R and H over the credal set. What does guarded dominance recommend here?  
  2. Is this recommendation defensible? Argue by comparing the *best-case* and *worst-case* robustness of R and H.  
  3. Suppose no option guarded-dominates. How should a proponent of imprecise probabilities decide? Critique guarded dominance as a general rule.  
  4. The regulator learns that *s₁ has not occurred* (but gains no other information). Show how this *updates the credal set*. Does this new evidence resolve uncertainty? Explain why this might exacerbate decision instability.  
  5. Reflect: Does imprecise probability "honestly" represent ignorance, or does it create new problems for rational choice? Use this case to weigh (i) vs. (ii) from the preamble.  

  ---

  ### Model Answer (~950 words)  

  #### 1. **Calculating Expected Utilities and Guarded Dominance**  
  The credal set \(\mathcal{C}\) contains all distributions \((p_1, p_2, p_3)\) with \(p_1 \in [0.2, 0.5]\), \(p_3 \in [0.1, 0.4]\), and \(p_2 = 1 - p_1 - p_3\). Since \(p_2 \geq 0\), we require \(p_1 + p_3 \leq 1\); this holds as max \(p_1 + p_3 = 0.9\).  

  Expected utilities:  
  - \( EU(R) = 10p_1 + 4p_2 + 0p_3 = 10p_1 + 4(1 - p_1 - p_3) = 6p_1 - 4p_3 + 4 \)  
  - \( EU(H) = 0p_1 + 5p_2 + 9p_3 = 5(1 - p_1 - p_3) + 9p_3 = -5p_1 + 4p_3 + 5 \)  

  To find min/max EU:  
  - **Min EU(R)**: Minimize \(6p_1 - 4p_3 + 4\). This decreases in \(p_3\) and increases in \(p_1\). Min at \(p_1 = 0.2\), \(p_3 = 0.4\):  
    \(6(0.2) - 4(0.4) + 4 = 1.2 - 1.6 + 4 = 3.6\)  
  - **Max EU(R)**: Maximize \(6p_1 - 4p_3 + 4\). Max at \(p_1 = 0.5\), \(p_3 = 0.1\):  
    \(6(0.5) - 4(0.1) + 4 = 3 - 0.4 + 4 = 6.6\)  
  - **Min EU(H)**: Minimize \(-5p_1 + 4p_3 + 5\). Decreases in \(p_3\), increases in \(p_1\). Min at \(p_1 = 0.5\), \(p_3 = 0.1\):  
    \(-5(0.5) + 4(0.1) + 5 = -2.5 + 0.4 + 5 = 2.9\)  
  - **Max EU(H)**: Maximize \(-5p_1 + 4p_3 + 5\). Max at \(p_1 = 0.2\), \(p_3 = 0.4\):  
    \(-5(0.2) + 4(0.4) + 5 = -1 + 1.6 + 5 = 5.6\)  

  Guarded dominance:  
  - Min EU(R) = 3.6 > Max EU(H) = 5.6? **No** (3.6 ≯ 5.6).  
  - Min EU(H) = 2.9 > Max EU(R) = 6.6? **No**.  
  → Neither beats the other; either choice is permissible *with justification*.  

  #### 2. **Defensibility of the Recommendation**  
  Guarded dominance permits both acts, but this masks a critical asymmetry. H performs poorly in the worst case (EU(H) = 2.9 when \(p_1\) is high, as disasters are costly), but its *best case* (EU(H) = 5.6) is safer than R’s worst case (EU(R) = 3.6). Conversely, R’s best case (6.6) is better than H’s best case (5.6) but risks catastrophe (EU(R) = 0 in s₃, which has non-negligible probability).  

  **The problem**: Guarded dominance ignores "opportunity robustness". H guarantees at least 2.9 and up to 5.6, while R ranges from 3.6 to 6.6. A risk-averse regulator might prefer H to avoid R’s downside (0 in s₃), but guarded dominance doesn’t mandate this. Worse, if we slightly perturb utilities (e.g., if min EU(R) rose to 5.7), R would become *mandatory* despite its catastrophic risk in s₃. This is unreasonable: a rule claiming to guard against uncertainty should not ignore extreme tail risks.  

  #### 3. **Handling Non-Dominated Cases and Rule Critique**  
  When neither option guarded-dominates, a proponent of imprecise probabilities should reject this rule. It focuses solely on *absolute security* (min EU) vs. *absolute recklessness* (max EU of the rival), neglecting the full range of plausibility. A better approach is **E-admissibility** (Levi 1974): an act is permissible if it maximizes EU for *some* probability in \(\mathcal{C}\).  

  Here:  
  - R maximizes EU if \(EU(R) > EU(H)\), i.e., \(6p_1 - 4p_3 + 4 > -5p_1 + 4p_3 + 5\) → \(11p_1 - 8p_3 > 1\).  
    This holds for distributions where \(p_1\) is high and \(p_3\) is low (e.g., \(p_1 = 0.5, p_3 = 0.1\)).  
  - H maximizes EU when \(11p_1 - 8p_3 < 1\), e.g., when \(p_3\) is high and \(p_1\) is low (\(p_1 = 0.2, p_3 = 0.4\)).  
  Thus, both are E-admissible. The regulator could then use a secondary criterion (e.g., minimax regret or security thresholds) to choose.  

  **Critique of guarded dominance**: By requiring min EU(R) > max EU(H), it sets an impossibly high bar, leading to indecision when intervals overlap (as here). Worse, it is *partition-sensitive*: if we split s₂ into sub-states, min/max EU can change arbitrarily, making decisions depend on how we frame possibilities.  

  #### 4. **Learning "s₁ Did Not Occur": Dilation and Instability**  
  Learning \(\neg s_1\) updates \(\mathcal{C}\) by conditionalization. The new credal set is all distributions with \(p(s_1) = 0\), \(p(s_3) \in [0.1, 0.4]\), and \(p(s_2) = 1 - p(s_3)\). But \(p(s_3|\neg s_1) = \frac{p_3}{p_2 + p_3} = \frac{p_3}{1 - p_1}\). Since \(p_1 \in [0.2, 0.5]\), \(p(s_3|\neg s_1)\) ranges from \(\frac{0.1}{1-0.5} = 0.2\) to \(\frac{0.4}{1-0.2} = 0.5\). Thus:  
  - \(p(s_2|\neg s_1) \in [0.5, 0.8]\)  
  - \(p(s_3|\neg s_1) \in [0.2, 0.5]\)  

  **Uncertainty dilates**: Originally \(p(s_3) \in [0.1, 0.4]\) (width 0.3); now \(p(s_3|\neg s_1) \in [0.2, 0.5]\) (width 0.3), but \(p(s_2|\neg s_1)\) spans 0.3 to 0.8 (width 0.5!), wider than before. Learning \(\neg s_1\)—intuitively irrelevant to the s₂/s₃ tradeoff—*increases* ambiguity about \(s_2\) vs. \(s_3\). This can reverse decisions: if the regulator recalculates EUs after updating, min EU(R) could fall (e.g., if \(p(s_3|\neg s_1) = 0.5\), EU(R) = 4 × 0.5 + 0 × 0.5 = 2), while min EU(H) might rise. Guarded dominance could now mandate H, despite learning "good news" (\(\neg s_1\)). This violates dynamic consistency: rational choices shouldn’t reverse due to irrelevant evidence.  

  #### 5. **Resolving the Tension**  
  Imprecise probabilities *do* honestly represent ignorance (e.g., here they reflect incomplete expert consensus). However, guarded dominance exacerbates problem (ii): sensitivity to framing and updating. The deeper issue is that decision rules for imprecise probabilities often prioritize *avoiding the worst* over *achieving the best*, which is appropriate for extreme risk (e.g., nuclear safety) but not general rationality.  

  A **moderate approach** resolves the tension:  
  - Use credal sets to model uncertainty (honoring i).  
  - Adopt E-admissibility for decisions, possibly with refinements (e.g., ranking acts by their min EU *as a tiebreaker*).  
  - Acknowledge that dilation reveals epistemic limitations—not a flaw in imprecision, but a call for better evidence.  

  In this case, guarded dominance is *not* reasonable: it is too conservative and partition-sensitive. The regulator should permit both R and H, but encourage justification via robustness analysis (e.g., "H is preferred if we prioritize avoiding s₃-risk"). Imprecise probabilities demand context-sensitive decision rules, not rigid dominance criteria.  

  ---

  ### Marking Scheme (Total: 20 points)  

  | **Point** | **Marks** | **What to Hit** | **Common Fumbles** |  
  |-----------|-----------|----------------|-------------------|  
  | **1. Correct EU ranges and guarded dominance verdict** | 5 | Min EU(R)=3.6, Max EU(H)=5.6; neither dominates. Show working for extreme points (e.g., min R at p₁=0.2,p₃=0.4). | Wrong p₂ calculation (e.g., ignoring p₁+p₃≤1); misidentifying min/max points (e.g., max R at p₁=0.5,p₃=0.4). |  
  | **2. Critical evaluation of guarded dominance** | 4 | Argue that permitting both acts is defensible, but the rule is flawed: ignores opportunity loss/risk extremes and could mandate risky acts with tiny EU changes. | Superficial "both are reasonable"; missing that min EU(R) > min EU(H) but max EU(H) > min EU(R). |  
  | **3. Handling non-dominated cases & rule proposal** | 4 | Reject guarded dominance; propose E-admissibility (both acts admissible); suggest secondary criteria (e.g., security levels). | Defaulting to maximin; not justifying why guarded dominance sets too strict a standard. |  
  | **4. Update on ¬s₁ and dilation effects** | 4 | Show p(s₃|¬s₁)∈[0.2,0.5], p(s₂|¬s₁)∈[0.5,0.8]; explain dilation (interval width increases); note decision instability. | Incorrect conditioning (e.g., not normalizing); missing that uncertainty *increases*; no link to decision reversal. |  
  | **5. Synthesis: resolving (i) vs. (ii)** | 3 | Defend credal sets for ignorance but reject rigid rules; endorse moderate imprecision (E-admissibility + context). | Unqualified rejection/endorsement of imprecise probabilities; no concrete alternative to guarded dominance. |  

  **Grade Boundaries**:  
  - **A (17–20)**: Hits all 5 points; uses calculation to motivate critique; anticipates dilation’s decision-theoretic impact.  
  - **B (13–16)**: Correct calculations but weaker synthesis (e.g., notes dilation but not its choice implications); vague on alternatives to guarded dominance.  
  - **C (9–12)**: Major errors in EU ranges/updating; conflates guarded dominance with maximin; misses dilation.  
  - **D (5–8)**: Fails to compute EUs; misstates decision rule; no engagement with imprecision tensions.  

  ---  
  This question forces originality by using a novel case, custom rule, and integrated dilation challenge. The model answer exemplifies "earning" a stance by showing guarded dominance’s pitfalls in concrete calculation and proposing a defensible alternative.
