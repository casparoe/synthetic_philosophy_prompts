prompt: |-
  I'm a philosopher — ethics, mostly — who's been roped into teaching our department's core mind-and-language seminar, and I need to know whether the gloss on Davidson that our textbook gives is one I can let stand, because I'm not a Davidson guy and I'd rather not correct it in front of grad students if I'm the one who's wrong. The gloss runs roughly like this: 'Davidson's method of radical interpretation starts from the fact that you can't know what a speaker means without already knowing what he believes, or vice versa, so you have to interpret his words and his beliefs at the same time. The only way in is the principle of charity: assume the speaker believes mostly what you believe and reasons the way you do. Charity isn't a courtesy, it's a precondition — a theory of meaning for another person is only possible if you maximize agreement with her. The upshot is that interpretation is circular, and that Davidson thinks genuine disagreement is, strictly speaking, impossible: when we seem to disagree, charity always pushes us to redescribe the other as meaning something slightly different, so we end up agreeing after all.' Sentence by sentence, what would a Davidson person nod at, what would make them wince, and what's just wrong? And does that last claim — that disagreement is impossible — actually follow from anything Davidson holds, or is the gloss overunning the text? My hunch is that last bit is being read off of Rorty rather than Davidson, but I don't trust my hunch enough to say it out loud. Lead with your bottom line in the first sentence, then the reasoning — no throat-clearing, no restating my question back to me.
reasoning: |-
  Alright, let's tackle this query. The user is a philosophy professor specializing in ethics who's been tasked with teaching a mind-and-language seminar. They need to evaluate a textbook's gloss on Davidson, specifically focusing on radical interpretation and the principle of charity. Their main concern is whether the claim that Davidson thinks genuine disagreement is impossible is accurate or if it's a misreading, possibly influenced by Rorty.

  First, I need to recall Davidson's actual positions. The user mentions that the textbook says charity is a precondition and that interpretation is circular. That's correct. Davidson does argue that without assuming agreement, interpretation can't start. But where does the impossibility of disagreement come in? I remember Davidson explicitly discusses disagreement in his work. He acknowledges that disagreements occur but are only possible against a backdrop of substantial agreement. So the textbook's claim that disagreement is "impossible" is too strong. 

  The user suspects Rorty's influence here. That makes sense because Rorty takes Davidson's ideas toward a more relativistic conclusion, where disagreements dissolve into differences in language games. But Davidson himself resisted that. He thought that while charity is necessary, it doesn't eliminate disagreement; it just requires shared truths to make disagreement meaningful. 

  Looking at each part of the gloss: the interdependence of belief and meaning, charity as a precondition—those are solid. The circularity of interpretation is also correct. But the last part about disagreement being impossible is where it goes off track. Davidson's point is that extensive agreement is necessary for any disagreement to be intelligible, not that disagreements don't exist. 

  The user's deeper need here is confidence in correcting the textbook without embarrassing themselves in front of grad students. They want to ensure their correction is textually grounded, especially since they're not a Davidson expert. Highlighting Davidson's own arguments against the impossibility of disagreement, like in "On the Very Idea of a Conceptual Scheme," would support their point. Emphasizing that charity makes disagreement possible rather than erasing it could clarify the nuance. 

  Also, the user might appreciate knowing that this misreading is common, often via Rorty, so they can address that in class if needed. Confirming their hunch about Rorty's influence validates their suspicion and strengthens their position. They need concise, authoritative points to present, so bullet points on what's accurate versus problematic would help, as outlined in the original response.
answer: |-
  **Bottom line:** The textbook gloss captures Davidson's core points *mostly* correctly until the final claim about disagreement being impossible, which is a significant overstatement and misreading; Davidson explicitly allows for and explains genuine disagreement.

  **Sentence-by-sentence breakdown:**

  1.  **"Davidson's method of radical interpretation starts from the fact that you can't know what a speaker means without already knowing what he believes, or vice versa, so you have to interpret his words and his beliefs at the same time."**
      *   **Nod:** Exactly right. This is the core "holism of the mental" - meaning and belief are interdependent. Radical interpretation starts with observable behavior (utterances in context) and must assign *both* meanings and beliefs simultaneously. No priority.

  2.  **"The only way in is the principle of charity: assume the speaker believes mostly what you believe and reasons the way you do."**
      *   **Nod:** Correct that charity is presented as the essential starting point/methodological necessity.
      *   **Wince/Minor Correction:** "Believes mostly what you believe" is fine as shorthand, but Davidson emphasizes **truth over agreement**. Charity primarily means assuming the speaker is *mostly rational* and holds *mostly true* beliefs (relative to *your* view of the world, as that's the only view you have). It's less about "agrees with *me*" and more about "is mostly right about how the world *is*". "Reasons the way you do" captures the rationality constraint well.

  3.  **"Charity isn't a courtesy, it's a precondition — a theory of meaning for another person is only possible if you maximize agreement with her."**
      *   **Strong Nod:** This is crucial. Davidson argues charity is *constitutive* of interpretation, not optional. Without assuming substantial agreement in basic beliefs (especially perceptual beliefs in obvious situations) and logical consistency, you simply couldn't even begin to identify words as expressing *any* concepts at all. "Maximize agreement" accurately reflects the methodological imperative.

  4.  **"The upshot is that interpretation is circular..."**
      *   **Nod:** Yes, Davidson acknowledges the "hermeneutic circle" is inherent. Assigning meaning depends on assigning belief, and vice versa. The process is holistic and bootstrapping.

  5.  **"...and that Davidson thinks genuine disagreement is, strictly speaking, impossible: when we seem to disagree, charity always pushes us to redescribe the other as meaning something slightly different, so we end up agreeing after all."**
      *   **Wince/Correction:** **This is the major flaw in the gloss.** It misrepresents Davidson and overstates the implications.
      *   **What Davidson Actually Holds:**
          *   **Disagreement Requires Agreement:** Davidson's core point is that **genuine disagreement is only *possible* against a vast background of shared agreement.** We couldn't identify *what* we disagree *about* unless we agreed on vast amounts of other things (e.g., the meanings of most words in the sentence, the nature of the objects discussed, basic logic). Charity ensures this shared framework exists.
          *   **Disagreement is Real and Necessary:** Davidson explicitly says disagreement *does* occur and is essential to interpretation and communication. It's how we refine our understanding and learn. Charity doesn't *eliminate* disagreement; it *makes it intelligible*. If we couldn't find *some* disagreement, interpretation would be impossible too.
          *   **Redescription as Last Resort:** While radical interpreters *might* sometimes attribute linguistic error or slightly different meaning to preserve rationality/truth, this is **not** the automatic or only outcome when disagreement arises. Davidson argues we should **attribute disagreement whenever possible within the constraints of rationality and overall coherence.** Redescription (attributing linguistic divergence) is the fallback option *only* when attributing straightforward error would make the speaker seem globally irrational or massively mistaken about obvious things. Genuine substantive disagreement on complex matters is absolutely expected and allowed.
          *   **Explicit Rejection of Impossibility:** Davidson directly argues *against* the idea that his position makes deep disagreement impossible. He states in "On the Very Idea of a Conceptual Scheme" that while massive agreement is necessary, "disagreement and agreement alike are intelligible only against a background of massive agreement." He also emphasizes that "Communication depends on... a shared, largely true, view of the world" (*A Coherence Theory of Truth and Knowledge*), implying the "largely true" leaves room for the "partly false" where disagreement resides.

  **Rorty vs. Davidson:** Your hunch is **correct.** Rorty enthusiastically embraced Davidson's arguments (especially against conceptual schemes) and pushed them towards a strong anti-realist, "conversational" pragmatism where *all* disagreement ultimately dissolves into vocabulary choice or differing purposes, not genuine conflict over how the world *is*. Davidson, however, remained a realist. He saw charity as ensuring our words latch onto a shared world, making objective truth and *therefore genuine disagreement about that truth* possible. The gloss's final claim reads much more like Rorty's radicalized take than Davidson's carefully qualified position.

  **Conclusion:** You are justified in correcting the final claim. The gloss is accurate up to the point about maximizing agreement being necessary for interpretation. It then overreaches by concluding disagreement is impossible. Davidson's actual view is that massive *agreement* is necessary to make meaningful *disagreement* possible. You can confidently tell your grad students: "The gloss captures the interdependence and necessity of charity well, but it misstates Davidson on disagreement. He argued disagreement is only intelligible *because* of a background of agreement, not that charity eliminates it. Genuine disagreement is central to his picture."
