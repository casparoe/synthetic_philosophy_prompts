answer: |-
  Here’s the poem, structured as requested. It avoids all forbidden terms, uses the child as the stranger, and buries the act under justifications. The "one thought too many" appears in stanza 7 ("that a man saves his wife").  

  **The Water**  

  I reached for her.  
  I reached for her—  
  the water was cold.  

  I reached for her—  
  the water was cold,  
  and she was close.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised  
  to put her first.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised  
  to put her first—  
  *that a man saves his wife*.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised  
  to put her first—  
  that a man saves his wife,  
  and the odds were better.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised  
  to put her first—  
  that a man saves his wife,  
  and the odds were better,  
  and it’s only fair.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther,  
  and I had promised  
  to put her first—  
  that a man saves his wife,  
  and the odds were better,  
  and it’s only fair  
  *if you weigh the years*.  

  I reached for her—  
  the water was cold,  
  and she was close,  
  and the other was farther (a small hand going under),  
  and I had promised  
  to put her first—  
  that a man saves his wife,  
  and the odds were better,  
  and it’s only fair  
  if you weigh the years—  
  **so the record shows next of kin**.  

  ---

  ### How It Meets Your Specs:  
  1. **Cumulative Structure**: Each stanza repeats prior lines + one new clause. The repetition mimics justification piling upon justification.  
  2. **"One Thought Too Many"**: Stanza 7’s *"that a man saves his wife"* is the gratuitous defense (Williams’ excess). Lines before are instinctual ("she was close," "I had promised").  
  3. **Burial of the Act**: The final line (**"so the record shows next of kin"**) is bureaucratic, satisfying a "committee" while drowning the original reach.  
  4. **Voice**: Addressed to a therapist (implied by clinical tone: "weigh the years," "record shows").  
  5. **Desperation**: The child’s "small hand" appears late, sharpening guilt.  
  6. **Decency Preserved**: Focus on promise/kinship, not possession. Cold water and distance frame it as split-second choice.  
  7. **Breathlessness**: Line breaks and em-dashes create gasping rhythm; justification clauses lengthen stanzas unnaturally.  
  8. **Philosophy via Form**: A Williams reader identifies stanza 7 as the rupture. A lay reader sees a man rationalizing trauma.  

  ### Why This Works:  
  The form *is* the argument. Justifications accrue like debris over the simple act ("I reached for her"). The child’s delayed reveal ("small hand") avoids melodrama while making the "covering thoughts" harsher. Final bureaucratic language ("next of kin") completes the burial: the act is now a case file.  

  Let me know if you’d like adjustments to voice or imagery. The additive structure, for me, amplified the suffocation perfectly.
