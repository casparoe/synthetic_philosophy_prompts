prompt: |-
  I have just joined the panel that reviews benefit sanctions in my region, and the chair has asked me to draft the reasoning for next week's case in a way that stays faithful to our own record. Four past decisions, in brief: a claimant who missed a mandatory interview because the bus she depends on was cancelled and who telephoned the same day was not sanctioned; a claimant who missed two interviews in the fortnight after his mother died and did not answer our letters was sanctioned; a claimant who attended everything and made the required number of job applications, but applied only for posts he was plainly unqualified for and told his adviser he was going through the motions, was sanctioned; and a claimant whose medical certificate we accepted as genuine, but who had told his adviser he would not take a job while the benefit paid as much as it did, was sanctioned.

  Next week's case is a woman whose employer has unilaterally cut her hours, so that her earnings now fall below the threshold we have recently begun using to decide whether someone is moving towards work. She has missed nothing, continues to apply for additional work, and her adviser reports that she does everything asked of her. Tell me how the panel will rule if it stays consistent with itself, which rules its record is compatible with — I suspect there is more than one — what each of those rules predicts here, which I should bet on and why, which of the four decisions is the closest precedent, and what single further case would force the panel to choose between the competing rules. If the record genuinely does not settle it, say so, and tell me what we would be committing ourselves to either way.
reasoning: |-
  Okay, the user is part of a panel reviewing benefit sanctions and needs to draft reasoning for an upcoming case. They've provided four past decisions to base their reasoning on, and they want to ensure consistency with those precedents. Let me start by understanding each case thoroughly. 

  The first case involved a claimant missing an interview due to a cancelled bus but calling the same day—no sanction. So, proactive communication and external factors mattered here. 

  The second case was a claimant missing two interviews after their mother's death and not responding to letters—sanction applied. So, failure to communicate despite extenuating circumstances led to a sanction. 

  The third case was someone applying only to jobs they were unqualified for and admitting they were going through the motions—sanctioned. Here, the issue was non-genuine effort in job seeking. 

  The fourth case involved a claimant with a valid medical certificate but stating they wouldn't take a job as long as benefits paid enough—also sanctioned. This shows that expressing unwillingness to work is key, regardless of other compliance. 

  Now, the upcoming case: a woman whose hours were cut by her employer, pushing her earnings below the threshold. She's compliant, applies for work, and her adviser confirms she does everything asked. No missed appointments or communications issues. 

  The user needs to know how the panel should rule based on consistency. The key here is whether she's genuinely seeking work. The precedents hinge on communication, effort, and willingness. Since she's compliant and actively applying, the closest precedent is the first case where communication and effort were present. But the third and fourth cases dealt with the quality of effort or willingness. 

  The user might be concerned about conflicting interpretations. The deeper need is ensuring the decision is defensible and consistent. They might also want to avoid setting a problematic precedent. 

  The ruling should likely be no sanction, as there's no evidence of non-genuine effort or unwillingness. The closest precedent is the first case. However, if a future case arises where someone is compliant but expresses unwillingness (like the fourth case), that would force a choice between compliance versus genuine intent. 

  So, advising no sanction based on compliance and active effort, while noting that genuine willingness is the underlying principle tying the precedents together. Highlighting that a future case with compliant but unwilling behavior would clarify the rules further.
answer: |-
  Based on your panel's record and the principles derived from it, here's the analysis for next week's case:

  1.  **How the Panel Will Rule (If Consistent):** The panel will rule **against imposing a sanction**.

  2.  **Compatible Rules Derived from the Record:** Your record supports two distinct, overlapping principles:
      *   **Rule A (Procedural Compliance & Communication):** Sanctions are justified by failures in procedural compliance (missing appointments, failing to respond) *unless* the claimant demonstrates reasonable cause (e.g., bus cancellation + same-day call) *or* communicates proactively about difficulties.
      *   **Rule B (Genuine Effort & Willingness to Work):** Sanctions are justified when the claimant demonstrates a lack of genuine effort or willingness to seek and take work, *even if* they technically meet procedural requirements (applying for unsuitable jobs + admitting "going through motions," explicitly stating unwillingness to take a job).

  3.  **Prediction Under Each Rule:**
      *   **Rule A (Procedural Compliance):** Predicts **NO SANCTION**. The claimant has missed nothing, continues to apply, and does everything asked. There is zero failure of procedural compliance. Her reduced hours are an external factor (like the bus cancellation) but crucially, she hasn't *failed* any requirement because of it. She remains procedurally perfect.
      *   **Rule B (Genuine Effort/Willingness):** Predicts **NO SANCTION**. The adviser reports she "does everything asked of her" and "continues to apply for additional work." There is no evidence of applying only to unsuitable roles or expressing unwillingness to work. In fact, actively seeking *additional* work despite having *some* work strongly indicates genuine effort and willingness. Her situation (reduced hours) is precisely why she *needs* additional work.

  4.  **Which Rule to Bet On & Why:** Bet on **Rule B (Genuine Effort & Willingness)** being the *deeper* and *more consistent* principle unifying the record.
      *   **Why:** Rule A explains Cases 1 (no sanction, justified) and 2 (sanction, justified). However, Rule A *cannot* explain Cases 3 and 4. Both claimants in 3 and 4 likely met *procedural* requirements (attending, applying, providing certs) but were sanctioned because their *intent* or *effort* was deemed insufficient. Rule B explains *all four* cases:
          *   Case 1: Reasonable cause + proactive communication shows *good faith effort*.
          *   Case 2: Failure to communicate despite cause suggests *lack of engagement/effort*.
          *   Case 3: Deliberately fruitless applications + admission = *lack of genuine effort*.
          *   Case 4: Explicit statement of unwillingness = *lack of willingness to work*.
      *   Next week's claimant demonstrates *positive* evidence of genuine effort and willingness under Rule B, confirming the "no sanction" prediction also made by Rule A.

  5.  **Closest Precedent:** **Case 1 (Bus Cancellation - No Sanction)**.
      *   **Why:** Both involve an external event disrupting the claimant's situation (bus cancellation / hours cut). Both claimants responded appropriately: Case 1 by calling immediately, next week's claimant by continuing to comply fully and actively seek more work. Both demonstrate the core requirement: maintaining engagement and effort despite the setback. Cases 3 and 4 show the *opposite* (lack of effort/willingness), while Case 2 involves a failure to engage procedurally.

  6.  **The Case That Would Force a Choice:** A case where a claimant **meets all procedural requirements perfectly (attends appointments, applies for the required number of jobs within their field/qualifications, communicates promptly) but privately expresses to their adviser (or evidence suggests) they are only doing the bare minimum to avoid sanction and have no genuine intention of taking a job if offered, provided their current benefit level continues.**
      *   **Why:** This case would create a direct conflict:
          *   **Rule A (Procedural Compliance):** Predicts NO SANCTION. Every box is ticked; no failure occurred.
          *   **Rule B (Genuine Effort/Willingness):** Predicts SANCTION. The claimant's stated lack of genuine intention mirrors Case 4 ("will not take a job") and the *attitude* behind Case 3 ("going through motions"), even if the *actions* are technically compliant.

  **Conclusion & Reasoning Outline:**

  *   **Ruling:** No sanction should be imposed.
  *   **Reasoning (Draft Outline):**
      1.  **Summary of Facts:** The claimant's hours were unilaterally reduced by her employer, bringing her earnings below the threshold. She has fully complied with all requirements: no missed appointments, continued job applications for additional work, and full cooperation as confirmed by her adviser.
      2.  **Relevant Principles:** Our decisions emphasize that sanctions are appropriate for failures in procedural engagement (Case 2) or where claimants demonstrate a lack of genuine effort or willingness to seek and accept work, regardless of procedural compliance (Cases 3 & 4). Conversely, where claimants face external setbacks but maintain compliance and demonstrate good faith effort (Case 1), sanctions are not justified.
      3.  **Application to this Case:** The reduction in hours is an external factor beyond the claimant's control. Crucially, unlike Case 2, she has maintained full procedural compliance and communication. Critically, unlike Cases 3 and 4, there is no evidence suggesting a lack of genuine effort or willingness. Her continued active search for additional work demonstrates a clear commitment to increasing her earnings and moving towards full employment, fulfilling the core purpose of the requirements. Her actions align with the positive engagement shown in Case 1.
      4.  **Decision:** Therefore, as the claimant has fulfilled all her commitments and demonstrates genuine effort towards securing more work, no sanction is warranted.

  **Final Note:** The record, interpreted as prioritizing genuine effort/willingness (Rule B), clearly settles this case in favor of no sanction. The procedural compliance rule (Rule A) also leads to the same conclusion here. The potential conflict highlighted only arises in a future, more ambiguous case concerning intent despite perfect compliance. Your reasoning should emphasize the claimant's *positive demonstration of effort and willingness* as the key factor aligning with the precedent of Case 1 and distinguishing this case from Cases 3 and 4.
