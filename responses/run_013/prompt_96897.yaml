  ### Notes on Empty Nodes & Coherence
  - **Leaf 5 (Artifact-of-Zero)**: Empty due to incoherence. If nonexistence has no welfare level, calling existence "bad" implies a comparison it rejects.  
  - **Anti-natalism (Leaf 6)**: Logically consistent but often rejected for requiring extreme sacrifice (e.g., human extinction).  
  - **Symmetric Comparativism (Leaf 1)**: Coherent but widely criticized for the repugnant conclusion.  
  - **Agreeing leaves**: **3/4** (value asymmetry) and **7/8** (asymmetry without comparison) each form pairs that agree on all probes but differ in their philosophical grounds.  

