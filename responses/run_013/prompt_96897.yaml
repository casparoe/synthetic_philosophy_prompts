  ### Decision Tree for the Procreation Asymmetry

  **Root Question**: Is comparing existence with nonexistence for a specific individual **well-formed and meaningful**?  
  *(Probe: Consider improving an existing person's life with a pill—this is clearly good for them. Can we similarly say that bringing a happy person into existence is good* for them *compared to never existing?)*  
  - **Yes** (comparison is well-formed) → Go to **Branch A**.  
  - **No** (comparison is ill-formed) → Go to **Branch B**.  

  ---

  #### **Branch A: Comparison is well-formed**  
  **Question A1**: Does the view endorse the **procreation asymmetry**?  
  *(Probe: For a happy child created at no cost to anyone, is this act morally good? Asymmetry requires it cannot be good, though it may be permissible.)*  
  - **Yes** (asymmetry holds: existence can be bad, never good *for the person*) → Go to **Question A2**.  
  - **No** (denies asymmetry: existence can be good or bad relative to nonexistence) → **Leaf 1: Symmetric Comparativism**.  

  **Question A2**: Is the asymmetry fundamentally about **value** or **duties**?  
  *(Probe: If creating a happy child would be good* for them *but you refrain, have you wronged anyone?)*  
  - **Value** (existence is never *better than* nonexistence for the person) → Go to **Question A3**.  
  - **Duties** (existence may be good for them, but no duty to create; only duty not to harm) → **Leaf 2: Deontic Asymmetry**.  

  **Question A3**: What **grounds** the value asymmetry?  
  *(Probe: In a choice between creating a child with a barely-worth-living life now vs. waiting to create a different, happier child later (no one worse off either way), must we wait?)*  
  - **Brute fact** (asymmetry is foundational, not derived) → **Leaf 3: Brute Value Asymmetry**.  
  - **Person-affecting restriction** (only harms to existing persons matter; no one benefits from creation) → **Leaf 4: Person-Affecting Asymmetry**.  
  - **Artifact of "nonexistence = zero"** (welfare levels only apply to existers; zero is not a baseline) → **Leaf 5: Artifact-of-Zero Asymmetry**.  

  ---

  #### **Branch B: Comparison is ill-formed**  
  **Question B1**: Is creating a **happy child** at no cost to anyone **impermissible**?  
  *(Probe: Is creating a happy child inherently wrong, even if their life is excellent?)*  
  - **Yes** → **Leaf 6: Anti-natalism**.  
  - **No** (permissible but not required) → Go to **Question B2**.  

  **Question B2**: Why is creating a **miserable child** bad?  
  *(Probe: Is the badness due to suffering itself, or the act of imposing life?)*  
  - **Impersonal badness of suffering** (suffering is objectively bad; happiness lacks equivalent weight) → **Leaf 7: Impersonal Asymmetry**.  
  - **Wrongness of imposing life** (harm risk or violation of autonomy; no symmetric duty to benefit) → **Leaf 8: Asymmetric Imposition**.  

  ---

  ### Leaf Views  

  | Leaf | View Name | Type | Hardest Commitment to Defend | Flags |
  |------|-----------|------|------------------------------|-------|
  | **1** | Symmetric Comparativism | Denial of asymmetry | Leads to the **repugnant conclusion**: A world of countless barely-worth-living lives is better than a small, thriving population. | — |
  | **2** | Deontic Asymmetry | Asymmetry (duties) | Why no duty to create happy people if it *is* good for them? Rights-based or contractualist grounds may seem ad hoc. | Agrees with **Leaf 3/4/5** on probes but grounds in duties. |
  | **3** | Brute Value Asymmetry | Asymmetry (value) | Arbitrariness: Why can a life be worse than nothing but never better? Defies intuitive welfare economics. | Agrees with **Leaf 4** on all probes; differs only in grounds. |
  | **4** | Person-Affecting Asymmetry | Asymmetry (value) | Fails the **non-identity problem**: Creating a barely-worth-living child now (vs. a happier one later) isn’t worse for anyone, so no reason to wait. | Agrees with **Leaf 3** on all probes; differs only in grounds. |
  | **5** | Artifact-of-Zero Asymmetry | Asymmetry (value) | Incoherence: If nonexistence isn’t a welfare level, why can existence be *worse*? "Zero" sneaks in via the backdoor. | **Empty node** (unattractive/incoherent). |
  | **6** | Anti-natalism | Stronger claim | Permissibility of **not creating a happy child**: Argues all life has net harm or consent violation, counter to intuition. | — |
  | **7** | Impersonal Asymmetry | Asymmetry w/o comparison | **Distant happy island**: Adding happy people doesn’t improve the world, but adding suffering worsens it—why the asymmetry? | Agrees with **Leaf 8** on probes but grounds in impersonal value. |
  | **8** | Asymmetric Imposition | Asymmetry w/o comparison | **Threshold problem**: Why is imposing a barely-worth-living life (with some suffering) wrong, but a happy one isn’t? Risk-based accounts may collapse under scrutiny. | Agrees with **Leaf 7** on probes but grounds in imposition. |

