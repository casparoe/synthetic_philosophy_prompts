  3. **Miserable child**: Is creating a miserable child (who will suffer greatly) morally bad?

  4. **Pill that improves an existing person**: Giving a pill to an existing person that improves their life is clearly good. This is to contrast with creating a new person.

  5. **Happy people on a distant island**: If we add happy people to a distant island (so they don't affect anyone else), is that good?

  6. **The repugnant conclusion**: Does the view lead to the repugnant conclusion (that a world with a vast number of barely worth living lives is better than a world with fewer very happy lives) or avoid it? And if it avoids it, how?

