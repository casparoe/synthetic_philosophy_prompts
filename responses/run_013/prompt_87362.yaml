prompt: |-
  I keep running into something and I dont have a name for it, and the names I've got don't fit.

  Here's the shape. Somebody does a thing nobody could have asked them to do, just a kindness or some competence being generous, and then it quietly stops being optional. Nobody demands it. It just becomes the baseline, and now the person who did it is the one who's in the wrong if they stop.

  My sister started picking up our dad's prescriptions because her office is two blocks from the pharmacy. Two years later she's running his whole medical life. She asked me to cover a month while she traveled and he acted like she was abandoning him. Nobody ever asked her to start.

  A guy on my team answered a question in a channel once, just because he knew. A year later that whole area is his, and he got dinged in his review for being slow to respond.

  An older man in my building used to carry Mrs. R's groceries up when he caught her in the lobby. Now when he doesn't, she says something about it. He never signed up for anything.

  Two things bug me about it. First, the smaller and more repeatable the original thing, the harder the ratchet seems to bite, while big one-off heroics don't do it at all, nobody expects you to jump in front of a bus twice. Second, I can't get the ethics straight. If the act was genuinely optional, then doing it can't be what made it required, that seems like it would contradict itself. But it also seems wrong to say Mrs. R has no grounds to feel let down. Both of those can't be right.

  Is there a name for this? I know there's a category of acts that are good but not required, I'm not asking about that category, I'm asking about what happens downstream of doing one. If the closest thing is just that expectations drift, or that people take advantage, or that thing where you do someone a small favor and then find it harder to refuse a big one, then I want to know exactly where my pattern comes apart from each of those. And if nothing fits, coin something and tell me the edges, does it happen to institutions and not just people, does it happen when the deed was done grudgingly or badly, does the ratchet ever run backwards? A bare name wont do anything for me, I need the carving.
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed but can't name. They've provided three clear examples: their sister managing their dad's medical care, a coworker becoming responsible for a work area, and an older man helping with groceries. The key elements are that the initial act was voluntary, small, and repeatable, but over time it became an expected duty, and stopping it leads to negative reactions.

  The user is frustrated because existing terms like "scope creep" or "obligation creep" don't fully capture this phenomenon. They want something more precise. The ethical dilemma they mention is interesting—how can an optional act become mandatory without explicit agreement? They also note that small, repeatable acts create this expectation more than big one-off actions.

  I recall that in social psychology, the "norm of reciprocity" might be relevant, but that's more about direct exchanges. What they're describing is a gradual shift in expectations. The concept of "prescriptive norms" might apply here, where repeated behavior becomes an unspoken rule. 

  The user's deeper need seems to be understanding the mechanics behind this pattern. They want to know why it happens, how to prevent it, and whether there's a name for it. They're also bothered by the ethical contradiction: how something voluntary becomes obligatory. 

  I think the term "gift-to-duty conversion" fits well. It highlights the transformation from a kind gesture to an obligation. The "entitlement ratchet" effect explains why expectations only escalate. The user might benefit from strategies to prevent this, like setting boundaries early or explicit communication. The ethical tension arises because humans naturally form expectations based on patterns, even without explicit agreements. Mrs. R feels let down due to disrupted expectations, even if the initial act was voluntary. 

  The user also asked about edge cases: whether this happens to institutions, grudging acts, or if it's reversible. Institutions can experience this through policy drift. Grudging acts might not trigger the same expectation. Reversing it is tough and requires conscious effort. 

  In conclusion, the core of this pattern is the covert transformation of voluntary acts into obligations due to repeated behavior. Naming it "gift-to-duty conversion" with the "entitlement ratchet" effect provides clarity. Addressing the user's examples and ethical concerns with psychological principles should meet their need for understanding and practical application.
answer: |-
  You've hit on a profound and frustrating social dynamic that lacks a single perfect name, but its components are well-understood. The closest conceptual fit is **Gift-to-Duty Conversion**, driven by the **Entitlement Ratchet Effect**.

  Here's the carving you requested:

  1.  **The Core Mechanism:**
      *   **Initial Act:** A genuinely optional, often small, *repeatable* act of kindness, competence, or convenience (the "gift").
      *   **Repetition & Pattern Recognition:** The act is performed consistently enough to establish a *pattern*.
      *   **Implicit Expectation Formation:** Observers (the beneficiary, others) subconsciously shift their internal model. The act moves from the category of "unexpected bonus" to "normal state of affairs." This is driven by fundamental human psychology: we rely on patterns to predict the world and reduce cognitive load. A reliable pattern becomes the new baseline.
      *   **Norm Internalization:** The observed pattern becomes an *unspoken norm*. It's no longer seen as generosity; it's seen as "how things are" or "what X person *does*."
      *   **Entitlement Ratchet:** This is the crucial component. Expectations only move *upwards*. Once the new baseline is established:
          *   **Ceasing the Act = Deviation:** Stopping isn't seen as returning to the original neutral state; it's perceived as a *withdrawal* of an established service or kindness, a *negative* deviation from the norm.
          *   **No Downgrade:** It's incredibly difficult to *reduce* the frequency or scope without causing friction. The ratchet only tightens.
      *   **Moral Hazard:** The beneficiary often becomes *less* likely to develop their own capacity or seek alternatives because the reliable service exists. This makes the eventual cessation feel even more disruptive.
      *   **Attribution Error:** When the actor stops, the *reason* for stopping (burnout, changed circumstances, simple desire) is often dismissed or minimized. The focus is solely on the *impact* of the withdrawal ("You're abandoning me," "You're being slow," "You're letting me down").

  2.  **Why Your Observations Fit:**
      *   **Small, Repeatable Acts:** These are perfect for establishing a *pattern* without triggering initial resistance or formal negotiation. Big, one-off heroics don't establish a reliable pattern, so they don't reset the baseline expectation permanently.
      *   **No Explicit Demand:** The conversion happens subtly through pattern recognition and norm formation, not coercion. This makes it feel insidious and hard to counter.
      *   **Ethical Tension Resolved:**
          *   **The Actor:** Was never under obligation *initially*. Their act *was* genuinely optional.
          *   **The Beneficiary:** Feels legitimate disappointment because their *reasonable expectation* (based on the established pattern) has been violated. Humans are wired to experience negative emotions when reliable patterns break, especially concerning needs (like meds, help, answers).
          *   **The Contradiction Dissolved:** The initial act *didn't* create a *moral* obligation. It created a *psychological* and *behavioral* expectation in others. The beneficiary's feeling of being let down stems from the disruption of the *pattern*, not from a violation of an original moral contract. The actor *is* morally free to stop, but stopping *will* cause social friction due to the broken expectation.

  3.  **Distinguishing from Similar Concepts:**
      *   **Expectations Drift:** Too vague. Gift-to-Duty Conversion is a *specific mechanism* of drift: *voluntary gifts* becoming *expected duties* via pattern-based norm formation.
      *   **Taking Advantage/Exploitation:** Sometimes this *is* exploitation. But often (like Mrs. R), the beneficiary isn't malicious; they've genuinely come to *depend* on the pattern and feel genuine distress when it breaks. The "taking" arises from the *unconscious* shift in expectations, not initial malice. Exploitation might be a *result* or *later stage*.
      *   **Foot-in-the-Door Technique:** This is *intentional* manipulation: a small request is used to increase compliance with a *larger, predetermined* request. Gift-to-Duty Conversion usually starts *unintentionally* by the actor. The "duty" emerges organically from repetition, not from a planned escalation by the beneficiary.
      *   **Scope Creep:** Common in projects/work. While related, scope creep often involves *explicit* additions or gradual *agreed* expansions. Gift-to-Duty Conversion is more about *implicit, unconscious* expectation shifts around *personal* acts of service/knowledge sharing becoming embedded duties.
      *   **Moral Licensing:** (Doing a good deed makes one feel entitled to do a bad one later). This is opposite: the *actor's* psychology. Gift-to-Duty is about the *beneficiary's* shifting expectations.
      *   **Obligation Creep:** A decent synonym, but "Gift-to-Duty Conversion" more precisely captures the *transformation of the act's nature*.

  4.  **Edges, Nuances, and Exceptions:**
      *   **Institutions:** Absolutely. A department handles an extra task "temporarily," it becomes their permanent duty. A company provides an exceptional service recovery once, it becomes the expected standard. Governments provide disaster relief, citizens expect it faster/broader next time. The mechanism is identical: pattern -> expectation -> entitlement ratchet.
      *   **Grudgingly or Badly Done Acts:** Less likely to trigger strong Gift-to-Duty Conversion. If the act is done resentfully or poorly, it doesn't establish a *reliable, positive* pattern. The beneficiary may not come to *depend* on it or see it as a desirable norm. It might even create an expectation of *not* receiving it.
      *   **The Ratchet Running Backwards (De-escalation):** Extremely difficult, but possible with:
          *   **Explicit Renegotiation:** Clearly stating the change, reasons, and new boundaries. ("Dad, I'm happy to handle X and Y, but I need you to manage Z yourself again starting next month. I can show you how.")
          *   **Gradual Tapering:** Reducing frequency/scope slowly rather than cold turkey.
          *   **Finding Substitutes:** Actively helping the beneficiary establish alternatives *before* fully stepping back.
          *   **High Trust/Communication:** In relationships with strong mutual respect, changes can be navigated with less friction.
          *   **External Intervention:** A new person/system takes over the task. Even then, the *original* actor might still be seen as having "abandoned" it.
      *   **Awareness:** If the actor *explicitly states* "This is a one-time thing/I'll do it until X date," it significantly weakens the conversion potential. The pattern is framed as temporary from the start.
      *   **Power Dynamics:** The effect is often strongest where there's an inherent power imbalance (child/parent, employee/manager, able/less able) or dependency.

  **In Summary:**

  You're observing **Gift-to-Duty Conversion**: The unconscious process whereby a *voluntary, repeated act* (gift) becomes an *expected norm* (duty) in the minds of others, primarily through pattern recognition establishing a new baseline. This is enforced by the **Entitlement Ratchet Effect**: expectations only escalate, making cessation feel like a violation, not a return to neutral.

  The ethical tension arises because the actor never consented to an obligation, yet the beneficiary developed a legitimate (if unconscious) dependency based on the established pattern. Resolving the friction requires acknowledging *both* perspectives: the actor's right to stop and the beneficiary's real (if not morally binding) sense of loss, followed by explicit communication and boundary setting to overcome the ratchet. It's the social cost of reliable kindness in a pattern-seeking species.
