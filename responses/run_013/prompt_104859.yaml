prompt: |-
  for my AI ethics seminar i have to write an argumentative essay and i really want to avoid just doing the standard "narrow vs broad alignment" recap. heres the thesis i want to defend: the supposed split between intent alignment and value alignment isn't two different problems at all, its one problem under two readings of the word "intent" -- a de dicto reading (do what the operator actually asked for) and a de re reading (do what they actually want/care about) -- and so-called "value alignment" is just the de re reading dressed up as a separate target. I want the argument to do real work on a case where the two readings come apart: a system that perfectly does what its operator asked, where the operator asked for something narrow, and where we'd still want to call the outcome misaligned. Show that this case doesn't show intent alignment is the wrong target, it only shows we were reading "intent" de dicto when we should've been reading it de re. Then take on the strongest objection i can think of, which is that this move makes "intent alignment" vacuous, because any bad outcome can just be relabeled as us picking the wrong reading of intent. Keep it tight and focused on that redescription move, dont just survey the field.
