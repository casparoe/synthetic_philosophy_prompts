  Okay, let me tackle this user's request step by step. They're writing a paper on the ethics of panpsychism and need a clear set of desiderata for moral status theories against that backdrop. The core challenges they highlighted are the ethical combination problem and the summation of suffering.

  First, I need to establish the panpsychist foundation. I'll go with constitutive Russellian monism since it's the most defensible version - it avoids brute emergence while keeping physics intact. The choice matters because proto-experiential properties in fundamental particles shift the ethical starting point dramatically.

  For the desiderata, I'm considering several key constraints:
  - Avoiding ethical explosion is crucial - we can't assign moral status to every quark without collapsing into absurdity
  - Subject unity must be addressed head-on, since micro-experiences alone don't constitute harmable entities
  - The combination problem's ethical twin needs explicit treatment - what bundles count as subjects?
  - We must preserve intuitive distinctions (rocks vs. worms vs. mammals) without anthropocentric bias
  - Suffering summation needs clarification - can micro-experiences add up systemically?
  - Non-arbitrary thresholds are essential to avoid smuggling in intuitions
  - Moral status must align with our best scientific ontology

  The ethical combination problem is particularly thorny. "Wherever there's an organism" feels question-begging. I need to justify why integrated biological systems matter more than random particle aggregates. Information integration theory helps - φ-maximizing systems create unified subjects through feedback loops. This isn't just intuition-smuggling; it's about causal topology.

  On suffering summation: Only unified subjects can experience harm as such. Micro-suffering doesn't sum to macro-harm unless integrated. This breaks standard sentientist calculus - we can't aggregate micro-experiences across systems. A rock's particles might have proto-suffering, but no subject exists to bear that harm.

  Now for conflicting desiderata: Avoiding ethical explosion while recognizing continuous emergence seems impossible. Either we get sharp thresholds (which feel arbitrary) or gradation (which risks status inflation). Also, valuing integration for subjecthood clashes with potentially dismissing disintegrated micro-experiences.

  Scoring standard theories:
  - Utilitarianism fails spectacularly on summation and explosion
  - Rights theories handle subjecthood better but struggle with gradation
  - Biocentrism captures organismal unity naturally but ignores micro-experiences
  - Holistic views avoid explosion but risk ecofascism by subsuming individuals

  The user's deepest need is spotting irreconcilable tensions - that's where their paper will shine. I'll flag the threshold/gradation conflict and subjecthood/integration paradox as central dilemmas. They'll need to either bite bullets or innovate beyond existing frameworks.
answer: |-
  Here’s a specification of desiderata for a theory of moral status under constitutive panpsychism (Russellian monism, where proto-experiential properties are fundamental and constitute macro-consciousness in integrated systems). This choice matters: proto-experience avoids attributing full subjectivity to fundamental entities, easing but not eliminating the ethical combination problem.

  ### Core Desiderata for Moral Status under Panpsychism
  1. **Avoid Ethical Explosion**  
     *Constraint*: Cannot grant full moral status to every physical entity (e.g., quarks, rocks).  
     *Rationale*: Collapses ethics into absurdity (e.g., "harming" a stone becomes morally significant). Must distinguish mere proto-experience from morally relevant experience.  

  2. **Respect Subject Unity**  
     *Constraint*: Only unified subjects of experience ("I") can be bearers of welfare or rights.  
     *Rationale*: Harm requires a subject to whom harm *occurs*; disconnected proto-experiences lack a perspectival "center."  

  3. **Solve the Ethical Combination Problem**  
     *Constraint*: Explain why certain bundles of micro-experiences constitute a harmable subject, while others (e.g., sand piles) do not.  
     *Rationale*: Without this, line-drawing between a worm and a rock is arbitrary.  

  4. **Preserve Intuitive Moral Distinctions**  
     *Constraint*: Must capture the moral difference between:  
     - Non-living matter (rock) vs. simple life (bacterium)  
     - Simple life vs. sentient invertebrates (cricket)  
     - Invertebrates vs. vertebrates (mouse) vs. humans.  
     *Rationale*: Avoids counterintuitive conclusions (e.g., granting equal status to bacteria and humans).  

  5. **Address Suffering Summation**  
     *Constraint*: Clarify whether suffering/well-being is:  
     - Summable across disconnected micro-experiences *within a system* (e.g., in a brain), or  
     - Exclusively attributable to unified macro-subjects.  
     *Rationale*: Affects utilitarian calculus—e.g., does micro-proto-suffering in a plant cell aggregate to moral significance?  

  6. **Non-Arbitrary Thresholds**  
     *Constraint*: Criteria for moral status must be grounded in objective properties (e.g., integration, complexity), not biological taxonomy.  
     *Rationale*: "Organism" is a coarse-grained category; panpsychism demands a physics-compatible justification.  

  7. **Compatibility with Scientific Ontology**  
     *Constraint*: Moral status must supervene on intrinsic properties or structural relations recognized by physics.  
     *Rationale*: Panpsychism posits experiential properties as fundamental; ethics shouldn’t require dualism.  

  ---

  ### Your Two Key Issues, Resolved  
  **1. Ethical Combination Problem & The Organism Line**  
     - **Why Organisms?** Organisms are *persistent, integrated systems* with teleological organization (goal-directed behavior for self-maintenance). This integration generates a unified subject via feedback loops binding micro-experiences.  
     - **Justification (Physics-Compatible):** High *integrated information* (Φ, per IIT) or causal density creates a unified subject. Organisms maximize Φ for their scale through homeostasis and perception-action cycles. A rock lacks this; its particles’ proto-experiences remain causally disconnected.  
     - **Is the Line "Real"?** Yes, if integration is scalar. Proto-experiences in a bacterium are minimally unified via metabolic feedback, while a mammal’s brain achieves high Φ. The line isn’t sharp but tracks degrees of unity. "Organism" is a heuristic for systems above a Φ threshold—not smuggling intuitions, but approximating an objective property.  

  **2. Suffering Summation & Sentientist Calculus**  
     - **Only Unified Subjects Count:** Suffering requires a subject’s perspective. Disunited proto-suffering (e.g., in a cell or dust cloud) lacks a "locus of harm"—it is not *felt* as pain by an entity. Thus, summation applies only *within* a unified subject (e.g., aggregating pain across neural subsystems in a brain).  
     - **Impact on Sentientism:** Sentientist calculus (e.g., utilitarianism) must weight welfare by *degree of subject unity*. A mouse’s suffering outweighs that of a bacterium, as the former integrates trillions of micro-experiences into a rich subjective stream. Proto-suffering in isolated particles is morally inert.  

  ---

  ### **Flagged Tensions (Likely Irreconcilable)**  
  - **Desiderata 1 vs. 4 vs. 6:** *Avoiding explosion* (1) requires sharp thresholds, but *non-arbitrariness* (6) demands scalar properties (e.g., Φ), which blur distinctions (4) between rocks/plants/animals.  
  - **Desiderata 2 vs. 5:** If *only unified subjects count* (2), disunited micro-suffering is ignored—but this may violate *scientific ontology* (7) if proto-experience is fundamental and potentially negative.  

  ---

  ### **Theories Scored Against Desiderata**  
  | **Theory**          | **Avoids Explosion?** | **Respects Unity?** | **Solves Combination?** | **Suffering Summation?** | **Key Failure**                              |  
  |---------------------|------------------------|---------------------|--------------------------|--------------------------|---------------------------------------------|  
  | **Utilitarianism**  | ❌ (All proto-experiences count; explosion inevitable) | ❌ (Sums micro-experiences) | ❌ (No subjecthood requirement) | ✅ (Sums everything) | Violates 1, 2, 3; collapses distinctions. |  
  | **Rights Theory**   | ✅ (Only unified agents) | ✅✅ (Strong subjecthood focus) | ⚠️ (Needs account of agency) | ❌ (Only unified subjects) | Struggles with 3 (combining micro→macro agency) and gradation (4). |  
  | **Biocentrism**     | ✅ (Only organisms)   | ⚠️ (Assumes organismal unity) | ✅ (Uses biological integration) | ❌ (Ignores micro-experiences) | Fails 7 (invokes "life" as primitive, not physics-based). |  
  | **Holism**          | ✅ (Systems only)     | ❌ (Subsumes individuals) | ⚠️ (Focuses on ecosystems) | ✅ (Sums system-level experience) | Violates 2 (no individual subjects) and 4 (e.g., humans ≠ forests). |  

  ---

  **Synthesis**: The most defensible path is a **graded subjecthood** view: moral status scales with degree of integration (Φ), granting partial status to simple organisms and full status to complex animals. This satisfies 3, 6, and 7 but strains 4 (sharp human/non-human distinctions collapse). *Proto-suffering outside subjects remains ethically inert*, preserving sentientism’s core while demanding a richer account of unity. The unresolvable tension: if proto-experience has *any* normative valence (per 7), ignoring isolated micro-suffering (per 2) may be unsustainable.
