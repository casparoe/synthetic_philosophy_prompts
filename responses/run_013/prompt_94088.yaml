prompt: |-
  For thirty years I worked as a field biologist, and I used the word function the way I used a lens or a net: constantly, and without ever stopping to ask what it meant. A trait had a function the way a bird had wings. Since retiring I have begun reading philosophy of biology, and I have discovered that the one concept my entire discipline leans on is precisely the one the philosophers cannot agree about. I have the etiological and the causal-role accounts in front of me, and before I go further I want the specification rather than another round of advocacy. Please write me the desiderata: what must any adequate theory of biological function deliver in order to count as a theory of that subject at all?

  Be concrete about the requirements, and give the case that motivates each one. I have in mind at least the following, and I would like you to organize them, add what I have missed, and tell me where I have smuggled in a prejudice rather than a genuine demand:

  The malfunctioning heart. A heart that cannot pump still has the function of pumping; that is what makes its failure a failure and not merely a different way of being. Whatever the theory says, it must underwrite this normativity, the fact that ascribing a function licenses judgments of malfunction. If a theory can only describe what a trait does or did, I want to be told that it cannot do the job, however elegant it otherwise is.

  The vestigial trait. The human appendix, the pelvic bones of a whale. Does the theory assign these a function, a former function, or no function at all? I want the verdict forced.

  The novel trait before selection has acted. A chance variant appears and happens to help its bearer survive one season. In ordinary biological speech we are often happy to say it has a function already, but the etiological story seems to require a history of selection that does not yet exist. Reconcile this or tell me that ordinary speech is wrong.

  Exaptation. Feathers selected for warmth, later co-opted for flight. Can a trait acquire a function it was not selected for, and does the theory allow a trait to have more than one, or to change its function over time?

  The byproduct. The classic spandrel critique: many traits are architectural consequences rather than adaptations. The theory must be able to return a verdict of no function, and must not colonize every effect with a purpose.

  Drift and neutrality. A trait fixed by drift that nonetheless has a current effect. Function or not? And what becomes of functional ascription when selection has been weak or absent?

  Parts, artifacts, and medicine. Physiology and clinical medicine speak of the function of an organ and of the parietal bone protecting the brain; a broken clock is still a clock that fails to keep time. Must the theory cover these alongside evolved traits, or may it quarantine them? If it must cover them, say what the cases share.

  Distinctions the theory must not collapse. Among others: function versus mere effect; function versus adaptation; function versus current utility; function versus design or purpose; and having a function versus actually working. Which of these are load-bearing and which are terminological?

  Constraints from biology it may not contradict. Natural selection is the only known source of design-like fit, but it is not omnipotent; drift, pleiotropy, developmental constraint, and exaptation are real; many traits are neutral; and function-talk is applied at every level from the organelle to the colony, and to cases such as selfish genetic elements and extended phenotypes. Tell me which of these results genuinely constrain a theory of function and which are merely background.

  Finally, the part I most want: mark which requirements are non-negotiable and which are preferences of a particular camp; flag any subset you suspect cannot be satisfied together, in which case the list itself is the result and I want to see it stated plainly; and tell me which single requirement does the most to exclude candidate theories. I do not need a scorecard of the current contenders — I will do that myself once I trust the criteria — but I would like to know whether the requirements, as you finally state them, leave room for a third kind of account beyond the etiological and the causal-role, or whether they force a choice between them.
reasoning: |-
  Okay, let me tackle this systematically. The user is a retired field biologist diving into philosophy of biology after decades of practical work. They want clear desiderata for any theory of biological function, not advocacy for existing positions. I need to organize their listed cases, add missing requirements, flag prejudices, and analyze tensions.

  First, their cases cover key challenges: malfunction, vestigial traits, novel traits, exaptation, byproducts, drift, artifacts, and necessary distinctions. I should add ecosystem-level functions and non-adaptive traits to cover gaps. The "broken clock" point about artifacts reveals a potential prejudice—biology might not need to cover designed objects.

  The malfunction case is non-negotiable: any theory must explain normativity. Vestigial traits challenge etiological theories to handle lost functions. Novel traits before selection test if history is essential—this might exclude strict etiological views. Exaptation requires function pluralism over time. Byproducts demand recognizing functionless traits, countering pan-adaptationism.

  Drift complicates things: if a trait spreads neutrally but now has effects, is that a function? Physiology and artifact cases raise whether the theory should unify biology with non-biological functions or stay specialized. Key distinctions like function vs. effect must be preserved; collapsing them invalidates a theory.

  Constraints from biology include multilevel application (genes to ecosystems) and acknowledging non-selective forces. The appendix case shows etiological theories can handle lost functions via history, while causal-role might misclassify vestigials as current-effect bearers.

  Major tensions: Normativity + History vs. Novel Traits. If malfunction requires historical design (etiological), how can a new trait have a function immediately? Causal-role handles novelty but struggles with vestigials. Exaptation challenges etiological theories—can a trait gain functions without new selection? Some propose "selection-of" vs. "selection-for" to distinguish original from co-opted functions.

  Non-negotiables: Normativity (malfunction), Non-universality (byproducts), and Correct Scope (covering physiology). Artifact coverage is negotiable—biology-first theories can exclude clocks. The novel trait case is the biggest divider: etiological theories must bite the bullet and say "no function yet," while causal-role accommodates intuition but risks over-ascribing functions.

  This leaves room for hybrid theories (e.g., modern etiological accounts with plasticity). The list doesn't force a binary choice but shows why no theory satisfies all desiderata perfectly. The core tension is temporal: must functions be anchored in past, present, or future?
answer: |-
  Here is a structured, concrete list of desiderata for any adequate theory of biological function, organized around your cases and expanded where necessary. I've flagged prejudices, identified non-negotiables, highlighted tensions, and addressed your core questions.

  ---

  ### **Desiderata for a Theory of Biological Function**
  *(Non-negotiables marked with ⚠️; Tensions marked with ⚡)*

  1.  **⚠️ Normativity & Malfunction (The Malfunctioning Heart):**
      *   **Requirement:** Must explain why a trait (e.g., a heart) *should* do something even when it fails. Ascriptions of function must license judgments of malfunction, not just atypical performance.
      *   **Motivating Case:** A heart that clots and cannot pump blood is *malfunctioning*, not merely "doing something else." Its proper function is pumping blood.
      *   **Consequence:** Purely descriptive accounts (e.g., only "what it does now") fail. The theory must ground a *normative standard*.
      *   **Prejudice Check:** This *is* non-negotiable for capturing core biological/medical practice. Rejecting normativity rejects the concept as used in biology.

  2.  **⚠️ Vestigial Traits (Appendix, Whale Pelvis):**
      *   **Requirement:** Must assign a clear status: function, former function, or no function. Must distinguish *having lost a function* from *never having one*.
      *   **Motivating Case:** The human appendix has no current function but evolved for digesting cellulose. Whale pelvic bones are remnants of hind limbs no longer used for locomotion.
      *   **Consequence:** The theory must handle historical functions persisting *as such* even when the trait is non-functional or detrimental now. "No current function" must be a possible verdict.
      *   **Prejudice Check:** Demanding they have a *current* function would be a prejudice. Demanding they have *no* function whatsoever ignores history.

  3.  **Novel Traits Before Selection (Chance Variant):**
      *   **Requirement:** Must adjudicate whether a new, beneficial trait (not yet selected) can be said to have a function immediately upon conferring a benefit.
      *   **Motivating Case:** A novel pigment variant appears by mutation, camouflaging its bearer instantly against a new predator. Biologists instinctively say "its function is camouflage," even before any selection *for* camouflage occurs.
      *   **Consequence:** Challenges purely historical (etiological) accounts requiring a *history* of selection.
      *   **Prejudice Check:** Assuming it *must* have a function immediately is a common intuition but potentially a prejudice against historical accounts. Assuming it *cannot* have one ignores biological practice.

  4.  **Exaptation (Feathers for Warmth then Flight):**
      *   **Requirement:** Must allow a trait to (a) acquire a new function it was not originally selected for, (b) potentially have multiple functions simultaneously, and (c) change its primary function over evolutionary time.
      *   **Motivating Case:** Feathers likely evolved for thermoregulation; later co-opted for flight. Some feathers may retain both functions. The "function" of feathers changed.
      *   **Consequence:** Must distinguish *original* function from *current* function(s). Must avoid locking a trait into a single, immutable purpose.
      *   **Prejudice Check:** Demanding a trait has only *one* true function is a prejudice. Ignoring historical origins entirely loses explanatory power.

  5.  **⚠️ Non-Functional Byproducts / Spandrels (The Byproduct):**
      *   **Requirement:** Must robustly return a verdict of "no function" for traits that are purely incidental consequences of development, architecture, or selection on other traits. Must prevent the colonization of every effect with a purpose.
      *   **Motivating Case:** The chin (developmental byproduct of jaw evolution), the color of blood (incidental to oxygen transport), architectural spandrels in phenotypes.
      *   **Consequence:** The theory cannot be pan-adaptationist. It must have criteria to exclude non-beneficial effects or non-selected consequences from being functions.
      *   **Prejudice Check:** This is non-negotiable. A theory unable to identify functionless traits fails biology.

  6.  **Drift and Neutral Traits (Trait Fixed by Drift):**
      *   **Requirement:** Must clarify the status of traits that (a) spread/fixed primarily via drift but have a beneficial effect, or (b) are currently neutral. Must specify how strength/absence of selection impacts functional ascription.
      *   **Motivating Case:** A neutral allele drifts to fixation. It happens to slightly increase UV resistance in a specific environment. Does it have a function? What if selection was weak but non-zero? What if the effect is only observed under rare conditions?
      *   **Consequence:** Challenges accounts relying solely on current effects or solely on strong historical selection.
      *   **Prejudice Check:** Assuming traits fixed by drift *cannot* have functions is potentially too restrictive. Assuming they *must* have functions based on any current effect risks pan-adaptationism.

  7.  **Scope: Physiology, Artifacts, and Medicine (Parts, Artifacts):**
      *   **Requirement:** Must either (a) provide a unified account covering both evolved biological traits *and* the functional ascriptions of physiology/medicine (e.g., kidney function) *and* artifact functions (e.g., broken clock), OR (b) explicitly justify why biological function is distinct and quarantine the other cases. If unified, must identify the shared core.
      *   **Motivating Case:** Doctors speak of a "failing liver"; physiologists of "mitochondrial function"; we call a sundial a clock that fails *as a clock*. Is "function" the same concept?
      *   **Shared Core (if applicable):** Normativity (malfunction), systemic contribution, and often (though not always) a history of design (natural or artificial) explaining *why* the thing is there/structured that way.
      *   **Prejudice Check:** ⚠️ **This is a key prejudice smuggled in.** Biology *can* have its own concept distinct from artifact function. The *non-negotiable* requirement is covering physiology/organs within biology. Artifacts are debatable. Forcing unification may be a mistake.

  8.  **⚠️ Essential Distinctions (Must Not Collapse):**
      *   **Requirement:** Must rigorously distinguish:
          *   **Function vs. Mere Effect:** (e.g., Pumping blood vs. making heart sounds).
          *   **Function vs. Adaptation:** (Function is what it *does*; adaptation is *why it exists* via selection for that effect).
          *   **Function vs. Current Utility:** (What it does *now* vs. what it was selected for; relevant for vestigials/exaptation).
          *   **Function vs. Design/Purpose:** (Biological "purpose" is shorthand, not conscious intent).
          *   **Having a Function vs. Actually Working:** (The broken heart *has* the function but isn't *performing* it).
      *   **Load-Bearing:** Collapsing Function/Effect destroys specificity. Collapsing Function/Adaptation ignores non-adapted functions (exaptations, novel traits) and byproducts. Collapsing Having/Working eliminates normativity. Function/Utility is key for exaptation/vestigials.
      *   **Terminological:** "Design" vs. "Purpose" is often just shorthand.

  9.  **⚠️ Biological Constraints (Must Not Contradict):**
      *   **Requirements:**
          *   Natural selection is the primary (but not exclusive) source of complex functional organization.
          *   Non-selective processes (drift, mutation pressure) are real and significant.
          *   Developmental constraints, pleiotropy, exaptation, and phylogenetic inertia shape traits.
          *   Many traits are neutral or deleterious.
          *   Function ascriptions occur legitimately at multiple levels: gene, organelle, cell, organ, organism, group, colony, ecosystem component.
          *   Function ascriptions apply to "selfish" elements (e.g., transposons "function" to replicate themselves) and extended phenotypes (e.g., beaver dam "functions" in water regulation).
      *   **Genuine Constraints:** All are core, established biological realities. A theory contradicting these (e.g., denying multi-level application, ignoring neutrality) fails.
      *   **Background:** The *relative importance* of selection vs. drift/constraint is debated, but their existence is not.

  ---

  ### **Analysis: Non-Negotiables, Tensions, and Exclusion**

  1.  **⚠️ Non-Negotiable Desiderata:** Normativity/Malfunction (1), Non-Functional Byproducts (5), Essential Distinctions (8 - core distinctions), Biological Constraints (9 - core principles). Vestigial Traits (2 - requiring a verdict) is also near non-negotiable. Physiology/Organ Function (within 7) is non-negotiable for biological scope.
  2.  **Negotiable/Contentious:** Coverage of Artifacts (7), Novel Traits Before Selection (3 - *whether* they have functions), Drift Traits (6 - *precise* status), Scope of "Design" (8).
  3.  **⚡ Major Tensions:**
      *   **Normativity + History vs. Novel Traits:** ⚡ The strongest tension. Normativity strongly suggests a historical standard (what it was *supposed* to do). Novel traits lack this history. Etiological theories struggle with novelty; Causal-Role struggles with normativity/vestigials. *Satisfying both simultaneously is the hardest problem.*
      *   **Exaptation/Current Utility vs. Original Function:** ⚡ Can "current function" fully replace "original function"? Etiological theories prioritize history; Causal-Role prioritizes current role. Vestigials force a distinction.
      *   **Byproducts vs. Universal Function Ascription:** ⚡ Causal-Role accounts risk ascribing functions too liberally to mere effects; strict Etiological accounts are safer here but may under-ascribe (e.g., to novel traits).
      *   **Multi-Level Application vs. Coherence:** ⚡ Defining "function" consistently across genes (selfish replication), organelles, organs, individual behaviors, and group traits is challenging for all accounts.
  4.  **The Biggest Divider:** **Novel Traits Before Selection (3)** is the single requirement that most starkly excludes candidate theories. Strict Etiological accounts *must* deny these have functions, conflicting with biological intuition. Causal-Role accounts *can* ascribe functions, but struggle with normativity and vestigials as a result. This case forces a fundamental choice about the *temporal anchor* of function: past, present, or future?
  5.  **Room for a Third Kind?** The requirements **do not force a binary choice** between pure Etiological and pure Causal-Role accounts. They leave room for:
      *   **Hybrid Theories:** Combining elements of both (e.g., a system's *capacity* grounded in its *evolutionary history*).
      *   **Organizational/Systems Accounts:** Defining function in terms of contribution to the self-maintenance/organization of a complex system (organism, colony), potentially incorporating evolutionary constraints or norms. This is the most developed "third way."
      *   **Pluralism:** Acknowledging that "function" serves different purposes in different biological contexts, requiring different definitions. The desiderata highlight *why* pluralism is attractive to many – no single theory satisfies all demands without tension.
  6.  **The List as Result:** The desiderata, stated plainly, show that **no current theory satisfies all requirements without significant tension or cost.** The core tension (⚡ Normativity/History vs. Novelty/Current Utility) is fundamental. Choosing a theory involves prioritizing which desiderata are most crucial for the intended biological context. A unified, perfect theory covering *all* biological function ascriptions (from selfish DNA to broken hearts to novel variants) while satisfying all non-negotiables remains elusive. The list defines the problem space more than it dictates a single solution.
