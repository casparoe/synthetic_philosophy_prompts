  ### The Third Y

  The rain hammered the tin roof of the boat shed, a relentless percussion that matched Eli’s pounding heart. Outside, the estuary churned, brown and hungry. Two weeks. That’s all he had left before Mara boarded a plane to Auckland with her mother, vanishing from his life for good. The judge had offered a deal: solve the warden’s puzzle, and walk out early. Fail, and serve the full sentence. Eli’s crime—embezzling from the marina’s funds to pay for Mara’s hospital bills—felt distant now, buried under the immediacy of the puzzle. 

  Warden Clay had chalked the rules on the shed’s warped plank wall: 

  1. **Replace x with yz**  
  2. **Swap yz to zy**  
  3. **Swap zz to x**  
  4. **Delete yyy**  

  Start with **x**. Can you reach **yyy**? 

  Beside Eli, old Marcus sanded the hull of a rotting dinghy, his hands steady. Marcus had been here fifteen years for sinking his own fishing boat for insurance. "Deadwood," the guards called him. But Marcus knew currents. "Think like the tide," he’d say. "Rules are just currents. Don’t fight ’em, ride ’em." 

  Eli began. Day one: **x** became **yz** (Rule 1). Then **yz** became **zy** (Rule 2). Two symbols. No **yyy**. He tried again: **x** to **yz**, then stared. No **x** left to trigger Rule 1 again. No **zz** for Rule 3. No **yyy** to delete. Stuck. 

  Days bled into nights. Eli scrawled strings on driftwood:  
  - **zy** to… nothing. Rule 2 needed **yz**, not **zy**.  
  - Could he nest strings? **x** to **yz**, then split **y** and **z**? No—rules applied to contiguous substrings only.  
  - He hunted for **zz**: if only he could get two **z**’s, Rule 3 might birth an **x**, restarting the cycle. But with one **x** yielding one **z**, and no way to duplicate it, **zz** felt mythical.  

  Marcus watched, sandpaper rasping. "Tide’s turning, Eli. You’re rowing against it."  

  By the seventh day, Eli’s hands shook. Mara’s birthday was in five days. He’d promised to teach her to sail. He attacked the puzzle like a man digging through a avalanche.  

  **x** → **yz** (Rule 1)  
  **yz** → **zy** (Rule 2)  
  … and *stop*. Always **zy**. Or sometimes, just **yz**.  

  He tried Rule 4 prematurely: "If I had **yyy**, I could delete it, but I *don’t*!" His voice cracked.  

  Marcus set down his sanding block. "Ever notice the strings never grow? **x** is one symbol. **yz** is two. **zy** is two. Never three."  

  Eli bristled. "So? I’ll find a way."  

  "Will you? Rule 1 adds one symbol, but only if there’s an **x**. Where’s your **x** in **zy**?"  

  Eli knuckled his temples. "I need **zz** to make **x**. But I need two **z**’s, and I’ve only got one."  

  Marcus nodded. "And the only way to get a **z** is from Rule 1, which eats an **x**. No **x**, no new **z**s."  

  They argued. Eli insisted he’d missed a path: maybe Rule 2 could be applied sideways, or **y** and **z** could fuse. Marcus, calm as the deep, said, "The rules don’t bend. They’re walls, not doors."  

  A storm rolled in on the tenth night. Wind screamed through the shed’s gaps. Rain drowned the estuary’s banks. The lantern flickered. Eli huddled under a tarp, tracing **zy** in the dirt with a trembling finger. Mara’s face swam before him—her laugh when he’d lifted her onto his shoulders at the lighthouse, the way she’d trusted him not to fall.  

  *I’m falling now.*  

  Marcus’s voice cut through the howl. "Eli. Why can’t we reach three symbols?"  

  Eli snapped. "Because we’re *stuck*! We start at one symbol. Rule 1 takes us to two. After that, no rule *can* take us to three. Rule 2? Swaps two symbols. Rule 3? *Removes* two symbols, replaces them with one. Rule 4? Removes three. To grow, we need Rule 1, but Rule 1 needs an **x**. And we’ve got no **x** after the first move!"  

  Marcus leaned close. "Say that last part again."  

  "We’ve got no **x** after the first move," Eli repeated, the words heavy as stone.  

  Marcus’s eyes glinted. "Because **x** only comes from Rule 3, and Rule 3 needs **zz**. But **zz** needs two **z**’s. And the only **z**’s come from Rule 1, which requires…"  

  "An **x**," Eli whispered. "Which we don’t have."  

  The truth crashed over him. **x** begat **yz**. **yz** could become **zy**. Both were dead ends. No rule could create a third symbol without an **x**, and no rule could create an **x** without two **z**’s, and no rule could create a second **z** without an **x**. A closed loop. A cage.  

  **yyy** wasn’t just unreachable by the paths he’d tried; it was *impossible*. Three symbols? The system choked on anything beyond two.  

  Eli stood, water sluicing down his neck. "We’ve been trying to *build* **yyy**. But the rules trap us at one or two symbols. We can’t even *get* to three, let alone three y’s."  

  Marcus nodded. "The tide doesn’t care if you drown. It just *is*."  

  The next morning, they went to Warden Clay. Eli’s voice didn’t shake this time. "We can’t reach **yyy**. The rules forbid any string longer than two symbols." He showed the warden the chains of logic: start length 1, Rule 1 → length 2. From there, Rule 2 preserves length 2; Rule 3 reduces to length 1 (but requires **zz**, unattainable); Rule 4 reduces by three (but requires **yyy**, unattainable). No rule increases length past two. **yyy** has length three. Therefore, unreachable.  

  Clay’s face tightened. He’d expected brute-force derivations, not this. "You’re saying the rules themselves *bar* three symbols?"  

  "Always," Eli said. "Not by chance. By design."  

  Clay dismissed them. No verdict.  

  Eli waited by the barred window, watching rain pock the estuary. Mara would be packing now. Had he traded one prison for another? Marcus touched his shoulder. "Some cages," he said softly, "you break by seeing the bars."  

  Eli closed his eyes. He’d stepped outside the rules, and found a truth no derivation could touch. But the estuary kept rising, indifferent.  

