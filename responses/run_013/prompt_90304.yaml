   From an even length, what can we do? We can apply Rule 1 only if there is an x. But we have no x in "zy". So we can't.

   What if we had a string of length 1 that is x? We can only get back to x by Rule 3, but Rule 3 requires two z's, which we don't have.

   So we never get back to an odd length string that is x? Let me see if we can get back to x.

   Start: x (length 1, odd)
   Rule 1: yz (length 2, even)
   Rule 2: zy (length 2, even)
   Can we apply Rule 3? No.

   But what if we could create two z's? We can't.

   Alternatively, start: x
   Rule 1: yz
   Now, instead of Rule 2, is there anything else? No.

   So we are stuck at even length.

   Now, can we ever get an odd length again? Only by Rule 3 or Rule 4.

   Rule 3: requires two adjacent z's -> reduces length by 1 (from even to odd).
   Rule 4: reduces length by 3 (even to odd, because even - odd = odd).

   But to apply Rule 3, we need two adjacent z's. We only have one z. So we cannot.

   To apply Rule 4, we need three adjacent y's. We only have one y. So we cannot.

   Therefore, we are stuck at even length (2) and can never get to an odd length or to a length>=3.

   So the length is always<=2.

   Therefore, the invariant is that the string length is either 1 or 2.

   And since "yyy" has length 3, it's impossible.

   So in the story, the characters might not realize this at first and waste time. Then Marcus, who is more experienced, points out that they've never seen a string of length 3, and then they realize the rules prevent it.

   This is a valid escape move.

   But the problem asks for a move that is not by applying the rules, and this is by analyzing the system (metamathematical).

   So we can proceed.

   However, the problem also says: "the formal material should be load-bearing", and we want to show why no amount of working within the rules could produce it. In this case, within the rules, you can't produce a string of length 3, so you can't even start to build "yyy".

   Story:

   Setting: A prison workshop. Inmates are given this puzzle by the warden. The warden says: "Figure out if you can get to three y's in a row. If you can, you're free. You have two weeks."

   Characters: 
     - Eli: young, desperate to get out to see his daughter.
     - Marcus: older, has been in for 20 years, resigned but observant.

   They have a chalkboard.

   They start:
     Day 1: 
       Start: "x"
       Eli: applies Rule 1 -> "yz"
       Then they try to apply Rule 1 again, but no x.
       They apply Rule 2: "yz" -> "zy"
       Then stuck.

     They try different orders, but always end up with "yz" or "zy".

     Eli: "We need to create an x. How? Rule 3: two z's together. But we only have one z."

     Marcus: "And to get another z, we'd need to create it from an x, but we don't have an x anymore."

     Eli: "So we're stuck at two symbols."

     But they keep trying.

     Days pass. They try to see if they can do anything with the string "zy" — maybe split it? But the rules don't allow.

     One week in, they are frustrated.

     Then, during a storm, the power goes out. They are in the dark. Marcus says: "You know, I've been thinking. We've only ever seen strings of length 1 or 2. We've never seen 3. Let me ask: can any rule take us to length 3?"

     Eli: "Rule 1: replaces one symbol with two, so if we start at length 2, Rule 1 would make it length 3: remove one, add two -> net increase by 1."

     Marcus: "But to apply Rule 1, we need an x. In a string of length 2, what are the possible strings we have? Only 'yz' and 'zy'. Neither contains an x. So we can't apply Rule 1 to either."

     Eli: "What if we had a string that had an x in it? But the only way to get an x is by Rule 3, which requires two adjacent z's. But in a string of length 2, if we have two z's, that would be 'zz'. But we've never seen 'zz'. How would we get two z's? We only have one from the initial Rule 1 application."

     Marcus: "Exactly. So we can never create an x in a string of length 2. Therefore, we can never apply Rule 1 again, and therefore, we can never get to length 3."

     Eli: "But what about Rule 4? It deletes three symbols. If we had three symbols, it would reduce the length, but we don't have three symbols."

     Marcus: "So we are trapped in length 1 or 2. And 'yyy' has length 3. So it's impossible."

     Eli is devastated because he won't see his daughter.

     But then they realize: the warden never said they had to derive it within the system; he said "figure out if you can". And they have figured out that they can't.

     So they go to the warden and present their argument.

     The warden might be impressed and let them go, or might not.

