  First, I need to list all the requirements they mentioned. They specified several points: core datum, non-omniscience, counterfactual ignorance, trivial consequences, recalcitrant evidence, novelty, and framework. Each needs a motivating case and a verdict on whether it's a genuine constraint or a prejudice.

  Starting with the core datum: The solution must allow known evidence to confirm without denying probability calculus. The motivating case is Mercury's support for GR. This seems essential—any solution that doesn't allow confirmation here fails. Verdict: genuine constraint.

  Non-omniscience: The problem arises because agents aren't logically omniscient. The solution must clarify whether confirmation is about the agent's reasoning or an objective relation. Motivating case: a mathematician who hasn't yet derived E from H. If the solution relies on ignorance but doesn't address it, that's problematic. Genuine constraint because ignoring epistemic states isn't an option.

  Counterfactual ignorance: Using what credence would be if E wasn't known. Issues: defining the counterfactual—whose, when, background knowledge. The childhood knowledge case is tricky. Is this approach necessary? It might be a tool, not a core requirement. Verdict: prejudice if mandated, but useful if flexible.

  Trivial consequences: Not all entailed known facts should confirm. Need a filter like surprise or explanation. Motivating case: H entailing a tautology doesn't confirm. The filter must be specifiable in advance. Genuine constraint, but hard—subjective filters might be circular.

  Recalcitrant evidence: Can old evidence disconfirm? Symmetry with confirmation. Case: known E that's improbable under H. If confirmation is possible, disconfirmation should be too. Genuine constraint for completeness.

  Novelty and new-theory problem: Solutions shouldn't make assigning priors to new theories harder. Motivating case: a novel theory needing non-zero prior. Genuine constraint to avoid compounding problems.

  Framework: Should the solution stay within subjective Bayesianism? Some solutions add explanations or non-conditional credences. Abandoning Bayesianism is a cost. Genuine constraint to assess theoretical cost.

  Now, tensions: Core datum vs. trivial consequences. Allowing confirmation in Mercury but not for tautologies requires a filter. But if the filter is subjective, it might not be principled. Also, non-omniscience vs. framework—staying within Bayesianism while handling ignorance is tough.

  The core datum is the biggest hurdle. Solutions like strict conditionalization fail here. Counterfactual approaches struggle with the childhood knowledge case. Explanatory approaches might introduce subjectivity.

  Summarizing solutions: Denial (no confirmation) fails core datum. Counterfactual credence handles Mercury but not childhood knowledge. Explanatory power adds a filter but risks subjectivity.

  User's deeper needs: They want a structured framework to evaluate solutions impartially. They might be looking for where compromises are inevitable, or whether a solution exists that satisfies all. Highlighting tensions helps them see why certain solutions are favored despite flaws.
answer: |-
  Here are the desiderata for any adequate treatment of the old-evidence problem, organized as requested. Each requirement includes its **motivating case**, **verdict** (genuine constraint vs. potential prejudice), and key considerations. Tensions and solution sketches follow.

  ---

  ### **Desiderata for Solving the Old-Evidence Problem**  
  1. **The Core Datum**  
     - **Requirement**: The account must allow that known evidence \(E\) can confirm hypothesis \(H\) in paradigmatic cases (e.g., Mercury’s perihelion precession confirming general relativity), without violating probability theory.  
     - **Motivating Case**: General relativity (GR) was accepted partly *because* it explained Mercury’s precession—a fact known for decades. Denying confirmation here clashes with scientific practice.  
     - **Verdict**: **Genuine constraint**. Solutions failing this reject the problem’s motivation.  

  2. **Non-Omniscience**  
     - **Requirement**: The account must specify whether confirmation arises from (a) the agent’s *ignorance* of the logical connection between \(H\) and \(E\), or (b) an objective evidential relation. It cannot tacitly rely on the agent’s unawareness of the entailment.  
     - **Motivating Case**: A mathematician knows \(H\) (a conjecture) and \(E\) (a theorem) but hasn’t yet proven \(H \vdash E\). Later, discovering the proof intuitively confirms \(H\). If confirmation vanishes upon learning the entailment (as \(P(E|H) = P(E) = 1\)), the account must explain why.  
     - **Verdict**: **Genuine constraint**. Solutions must not presuppose ignorance as a *deus ex machina*.  

  3. **Counterfactual-Ignorance Maneuver**  
     - **Requirement**: If counterfactual credence (e.g., "What would \(P(H)\) be if you didn’t know \(E\)?") is used, it must define:  
       - *Whose* credence (idealized vs. actual agent).  
       - *When* the counterfactual is evaluated (pre-discovery of \(H\)? pre-learning \(E\)?).  
       - *What background knowledge* is retained (e.g., all knowledge except \(E\)?).  
     - **Motivating Case**: A scientist who learned \(E\) in childhood and later formulates \(H\). There is no coherent "ignorant" state of \(E\) for them, and idealizing one risks arbitrariness.  
     - **Verdict**: **Potential prejudice** if mandated. While useful, this approach isn’t essential; other solutions (e.g., explanation-based) avoid it.  

  4. **Trivial Consequences**  
     - **Requirement**: Not all known \(E\) entailed by \(H\) should confirm \(H\) (e.g., \(H\) entailing a tautology). The account must provide a *filter* (e.g., surprise, explanatory power, causal independence) to exclude trivial cases, specified *in advance*.  
     - **Motivating Case**: Let \(H\) be "All ravens are black" and \(E\) be "2+2=4." Intuitively, \(E\) does not confirm \(H\), but \(H \vdash E\). The filter must distinguish Mercury’s precession from tautologies without ad hoc judgments.  
     - **Verdict**: **Genuine constraint**. Without this, *all* logical truths confirm *every* theory.  

  5. **Recalcitrant Evidence**  
     - **Requirement**: The account must allow that known evidence \(E\) can *disconfirm* \(H\) (e.g., if \(E\) is improbable given \(H\)), and handle confirmation/disconfirmation symmetrically.  
     - **Motivating Case**: Newtonian mechanics (\(H\)) predicts no ether drift, but the known null result (\(E\)) from Michelson-Morley was *initially* seen as disconfirming (before relativity). Symmetry ensures old evidence isn’t uniquely "positive."  
     - **Verdict**: **Genuine constraint**. Asymmetry suggests an incomplete solution.  

  6. **Novelty and the New-Theory Problem**  
     - **Requirement**: The solution must not exacerbate the "new-theory problem" (assigning non-negligible prior probability to untested theories). Ideally, it should be compatible with assigning reasonable priors to novel \(H\).  
     - **Motivating Case**: A revolutionary theory (e.g., quantum gravity) with no prior empirical success. If handling old evidence requires extreme priors (e.g., \(P(H) \approx 0\)), the theory is doomed before testing.  
     - **Verdict**: **Genuine constraint**. Solutions should not conflate old-evidence confirmation with prior rigidity.  

  7. **Framework**  
     - **Requirement**: The solution should clarify whether it:  
       - Stays within **subjective Bayesianism** (e.g., via credence functions).  
       - **Revises Bayesianism** (e.g., adding explanation as a primitive).  
       - **Abandons Bayesianism** (e.g., for a non-probabilistic account).  
     - **Motivating Case**: If the solution invokes "explanatory power" without probabilistic grounding, it may sacrifice Bayesian coherence. Conversely, strict subjectivism struggles with objective confirmation.  
     - **Verdict**: **Genuine constraint**. The cost of revision/abandonment must be justified.  

  ---

  ### **Tensions Between Desiderata**  
  - **Core Datum vs. Trivial Consequences**: Allowing Mercury’s precession to confirm GR while excluding tautologies requires a robust filter (e.g., explanation). But if the filter is subjective (e.g., "surprise"), it risks arbitrariness (**Trivial Consequences**).  
  - **Non-Omniscience vs. Framework**: A purely subjective Bayesian solution (e.g., counterfactual credences) struggles with **Non-Omniscience**—it makes confirmation contingent on ignorance, vanishing upon learning \(H \vdash E\).  
  - **Counterfactual-Ignorance vs. Non-Omniscience**: Counterfactual approaches often violate **Non-Omniscience** by implicitly relying on ignorance of the entailment.  

  **Most Eliminative Requirement**: **Non-Omniscience**. It eliminates:  
  - Solutions that treat confirmation as purely subjective (e.g., "confirmation is updating on discovering \(H \vdash E\)"), as these make confirmation ephemeral.  
  - Strict conditionalization-based accounts, where \(P(H|E) = P(H)\) if \(P(E) = 1\).  

  ---

  ### **How Major Solutions Fare**  
  1. **Denial (No Confirmation Occurs)**  
     - *Fares poorly*: Fails **Core Datum** (Mercury *did* confirm GR) and **Recalcitrant Evidence** (old evidence can disconfirm).  
     - *Verdict*: Inadequate; contradicts scientific practice.  

  2. **Counterfactual Credence (e.g., Garber)**  
     - *Approach*: Confirmatory power is \(P(H | E, H \vdash E) - P(H | H \vdash E)\) or \(P(H)\) in a state where \(E\) is unknown.  
     - *Fares well*: Satisfies **Core Datum** and **Recalcitrant Evidence**.  
     - *Fares poorly*: Fails **Non-Omniscience** (still relies on ignorance of entailment), struggles with **Counterfactual-Ignorance** (arbitrariness in childhood-\(E\) case), and risks **Trivial Consequences** without a filter.  

  3. **Explanation/Unification (e.g., Schupbach, Myrvold)**  
     - *Approach*: Confirmation arises from \(H\)’s explanatory power over \(E\), formalized via coherence/non-probabilistic measures.  
     - *Fares well*: Addresses **Core Datum**, **Trivial Consequences** (via explanatory filter), and **Non-Omniscience** (objective relation).  
     - *Fares poorly*: Strains **Framework** (abandons strict Bayesianism), and **Recalcitrant Evidence** may lack symmetry if explanation is asymmetric.  

  ---

  ### **Summary of Tensions**  
  The central tension is between **Core Datum** (requiring confirmation) and **Non-Omniscience** (demanding it not rely on ignorance). **Counterfactual** approaches sacrifice the latter for the former; **explanatory** approaches sacrifice Bayesian purity. **Trivial Consequences** forces a filter, which risks subjectivity. No solution satisfies all desiderata uncontroversially—**Non-Omniscience** and **Trivial Consequences** are the thorniest.
