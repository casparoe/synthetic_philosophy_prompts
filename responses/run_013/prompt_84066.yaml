prompt: |-
  ok so I'm a junior and I'm putting together an application for a summer research program (and my school also lets us do an independent study in the spring, so this could turn into that too). my half-formed idea is about the beef vs chicken vs vegetarianism-kills-mice argument, and I think the whole thing is stuck for a reason nobody names. everyone says chicken is better than beef per calorie, then someone says no, growing crops kills way more small animals than pasture grazing does, so actually beef is fine, then someone says you're counting bugs, and it just goes in circles forever.

  my idea is that the circles are a unit problem. "deaths per calorie" vs "per gram of protein" vs "per dollar" vs "per meal" vs "per year of my diet" are not neutral choices. each unit quietly smuggles in a moral weight — how much a chicken counts vs a mouse vs an insect vs a cow — and also a stance on wether not being born is bad. so the rankings flip when you change the unit, and every flip marks a spot where a moral assumption is hiding. thats the thing I want to test.

  turn this into a real short proposal, like 2 pages, for a term-long project. I need: the question stated so sharply its actually answerable; why the usual back-and-forth leaves it open rather than settling it; what I'd actually do week to week (I'm picturing a spreadsheet model plus a written philosophical chunk — tell me if thats the wrong way to split it); what a real result looks like as opposed to me just producing a big table; and an honest read on whether this is too big for one term and one high schooler. dont give me a reading list or citations, I'll add those myself. and please dont invent numbers or stats — if the plan needs a number from somewhere, just say what kind of number it is and where I'd go find it.

  one thing I keep circling and cant decide about: if I stop eating beef, is the cow better off, or does it just never exist? does the second answer mean my whole "deaths caused" framing is counting the wrong thing? I want the proposal to take a position on whether that belongs in the project or blows it up.

  then at the end give me a small json summary I can paste into the application form, with these fields: question (one sentence), why_open, method (3-4 steps), timeline (month by month), deliverable, failure (what would count as the project not working), biggest_risk, and existence_thing (one line on where the never-existed question fits).
reasoning: |-
  We are turning the idea into a 2-page proposal. The key components:

  1. **Question**: Sharply stated and answerable.
  2. **Why open**: Why the usual debate doesn't resolve it.
  3. **Method**: Week-by-week plan, including both spreadsheet modeling and philosophical analysis.
  4. **Real result**: What a substantive outcome looks like (beyond just a table).
  5. **Feasibility**: Whether it's too big for one term and a high school junior.
  6. **The "never existed" problem**: Take a position on whether to include it and how.

  Additionally, we'll create a JSON summary at the end.

  Let's structure the proposal:

  **Title**: Unpacking the Moral Assumptions in Food Choice Impact Metrics: A Dual Modeling-Philosophical Approach

  **1. Introduction and Question**:
     - Context: The debate on the relative harm of different diets (beef, chicken, vegetarian) often gets stuck in circular arguments because of shifting metrics (per calorie, per protein, etc.).
     - Problem: Each metric implicitly embeds moral weights (e.g., how much a cow's life matters vs. a mouse's) and assumptions about the badness of non-existence.
     - **Sharp Question**: "How do implicit moral assumptions about the comparative value of animal lives and the badness of non-existence drive the apparent contradictions in the ranking of dietary choices (beef, chicken, vegetarian) across different impact metrics (e.g., deaths per calorie vs. per dollar)?"

  **2. Why the Question Remains Open**:
     - The existing debate focuses on empirical data (e.g., number of field mice killed per acre of crops) but ignores that the choice of unit (per calorie, per protein, etc.) is not neutral. Each unit:
       (a) implies a moral weighting (e.g., if we use per dollar, we are weighting the impact by economic accessibility, which may not align with harm reduction),
       (b) may arbitrarily shift the ranking (e.g., beef may look better on a per-acre basis but worse on a per-calorie basis),
       (c) fails to address whether preventing a birth is equivalent to preventing a death.
     - Without explicitly stating and comparing the moral assumptions, the debate cannot move forward.

  **3. Method**:
     - The project has two parallel tracks: a quantitative model (spreadsheet) and a philosophical analysis. They will inform each other.
     - **Week-by-Week Plan** (for a 12-week term):

       **Weeks 1-2: Literature and Framework Setup**
          - Review existing studies on animal deaths per unit of food (for beef, chicken, and plant-based options). Collect data on:
              - Typical deaths (and types: cows, chickens, rodents, insects, etc.) associated with each food production system per unit of output (e.g., per 1000 calories, per kg of protein, per dollar spent).
              - Sources: Peer-reviewed articles, industry reports, and databases (e.g., FAO, USDA). Note: We are not inventing numbers; we are gathering existing estimates and noting their ranges and uncertainties.
          - Simultaneously, start philosophical reading on moral weight of different species and the non-identity problem (whether not being born is a harm).

       **Weeks 3-5: Build the Quantitative Model (Spreadsheet)**
          - Create a spreadsheet that takes as inputs:
              - Data on animal deaths (and types) per unit of output (e.g., per 1000 calories) for each food.
              - A set of user-defined parameters (moral weights for each animal type, and a binary choice on whether to count prevented births as harms).
          - The model will output the total "harm score" for each food under different metrics (per calorie, per dollar, etc.) and under different moral weight scenarios.

       **Weeks 6-8: Philosophical Analysis and Integration**
          - Write a philosophical chunk that:
              - Maps the units (e.g., per calorie, per dollar) to the moral assumptions they imply (e.g., per calorie assumes that the goal is to minimize harm per nutritional unit, regardless of cost).
              - Analyzes the ethical implications of counting prevented births (non-existence) as harms or not.
          - Use the model to show how changing these assumptions flips the rankings.

       **Weeks 9-10: Scenario Testing and Sensitivity Analysis**
          - Run the model under a range of moral weight scenarios (from equal weighting to highly differential) and under both choices about non-existence.
          - Identify "tipping points" where the ranking changes and link these to the philosophical assumptions.

       **Week 11: Synthesis**
          - Combine the model results and philosophical analysis to show how the debate's circularity arises from unstated moral disagreements.

       **Week 12: Finalize Report and Prepare Deliverable**

  **4. Deliverable and Real Result**:
     - **Deliverable**: A written report (approx. 15-20 pages) including:
          - The spreadsheet model (with instructions and sample data).
          - The philosophical analysis.
          - A synthesis showing how the choice of metric and moral assumptions drive the debate.
     - **Real Result**: The project produces a framework that makes explicit the moral assumptions embedded in common food impact metrics. It does not prescribe which diet is best, but shows how the ranking depends on one's ethical stance. The model allows users to input their own moral weights and see the resulting dietary ranking.

  **5. Feasibility**:
     - This is ambitious but feasible for a term-long high school project because:
          - The spreadsheet model is manageable with basic Excel/Google Sheets skills.
          - The philosophical analysis can be done with guidance (from a mentor/teacher) and focused reading.
          - The project does not require new data collection; it uses existing estimates and focuses on their interpretation.
     - If the data gathering becomes overwhelming, we can focus on 2-3 key studies per food type and acknowledge the uncertainty.

  **6. The "Never Existed" Problem (Non-Identity Issue)**:
     - We take the position that this issue must be addressed because it is central to the "deaths caused" framing. The project will:
          - Explicitly model two scenarios: one where preventing a birth is not counted as a harm, and one where it is (with a note that the latter is controversial).
          - In the philosophical analysis, we will discuss the implications of each stance but not resolve the debate. The model will allow users to choose.

