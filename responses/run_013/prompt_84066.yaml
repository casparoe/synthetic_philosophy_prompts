    "why_open": "Debates cycle because units (e.g., per calorie vs. per dollar) silently impose moral weights and birth/death definitions without acknowledging them.",  
    "method": [  
      "Compile animal death data per unit of food output from USDA/FAO/peer-reviewed LCA studies",  
      "Build spreadsheet model comparing diets across 4 units with toggle switches for moral weights and non-existence harm",  
      "Write philosophical analysis linking unit choices to moral assumptions",  
      "Synthesize findings into decision tree showing which assumptions flip rankings"  
    ],  
    "timeline": {  
      "Month 1": "Data gathering and spreadsheet structure",  
      "Month 2": "Model tuning and philosophy draft",  
      "Month 3": "Scenario testing, synthesis, and final paper"  
    },  
    "deliverable": "Interactive spreadsheet + 20-page paper with decision tree framework exposing moral tipping points.",  
    "failure": "Model outputs show no ranking flips under different units/assumptions (indicating oversimplified inputs or incorrect model design).",  
    "biggest_risk": "Insufficient data for key metrics (e.g., insect deaths) forcing over-reliance on proxies; mitigated by using ranges and transparency.",  
    "existence_thing": "Explicitly included as a toggle in the model and core to the philosophy; its treatment defines key moral conflicts."  
  }  
  ```
