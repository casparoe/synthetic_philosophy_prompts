  ### Thought Experiment: The Campus Power Outage  
  At a university, two identical lecture halls (Hall A and Hall B) are used for the same advanced physics seminar. Due to a scheduling quirk, the seminar is held in one hall per week, chosen by a fair coin flip. Students know the hall is chosen randomly but don’t know which one was selected each week because the halls are indistinguishable. The university’s energy monitor reveals:  
  - If Hall A is used, it has exactly 50 seats, and all are always filled.  
  - If Hall B is used, it has *either* 50 or 500 seats (due to modular walls), each with 50% prior probability. When Hall B is used, all seats are always filled.  

  You are a student in this seminar. During class, a campus-wide power outage occurs, plunging your hall into darkness. The professor announces: "If you are in Hall B, there is a hidden switch under one random seat that can restore power. Finding it requires someone to crawl and press it, but doing so might expose you to asbestos in the floor panels (5% chance of fatal exposure). If no one presses it, the outage persists, and everyone eventually dies of CO₂ buildup (100% fatal after 2 hours)."  

  You have a flashlight. **Your decision**: Crawl to search for the switch (risking 5% death) or do nothing (guaranteeing death if in Hall B). If you are in Hall A, there is no switch, and doing nothing is safe.  

  ---

  ### Analysis  
  #### (1) Hypotheses and Indexical Evidence  
  - **Competing hypotheses**:  
    - \(H_{50}\): Hall B has 50 seats (prior: \(P(H_{50}) = 0.5\)).  
    - \(H_{500}\): Hall B has 500 seats (prior: \(P(H_{500}) = 0.5\)).  
  - **Indexical evidence (\(E\))**: You exist as a student in the seminar *and* the outage occurred. This implies you are in one of the seats in whichever hall is in use.  

  ---

  #### (2) Decision Under Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA)  
  **Key probabilities**:  
  - \(P(\text{in Hall B}) = 0.5\) (from coin flip).  
  - If in Hall B, \(P(\text{you have the switch} \mid H_{50}) = \frac{1}{50}\); \(P(\text{you have the switch} \mid H_{500}) = \frac{1}{500}\).  
  - **Crawling risk**: 5% chance of death.  
  - **Do-nothing risk**: If in Hall B, 100% death (from CO₂); if in Hall A, 0% death.  

  ---

  **SSA Approach** (Assume you are a random observer from *actual* population)  
  - **Posterior for Hall B**:  
    - Prior \(P(\text{in Hall B}) = 0.5\).  
    - Evidence \(E\): You are a student experiencing the outage. SSA updates this by conditioning on being randomly selected from all students in the active hall.  
      - Under \(H_{50}\): 50 students in Hall B.  
      - Under \(H_{500}\): 500 students in Hall B.  
    - Likelihood of \(E\) given Hall B:  
      \[
      P(E \mid \text{Hall B}, H_{50}) = \frac{1}{50}, \quad P(E \mid \text{Hall B}, H_{500}) = \frac{1}{500}.  
      \]  
    - Posterior probability of being in Hall B:  
      \[
      P(\text{Hall B} \mid E) = \frac{P(E \mid \text{Hall B}) \cdot P(\text{Hall B})}{P(E)}.  
      \]  
      Total \(P(E)\):  
      \[
      P(E) = P(E \mid \text{Hall A})P(\text{Hall A}) + P(E \mid \text{Hall B})P(\text{Hall B}) = (0)(0.5) + \left[ \frac{1}{50} \cdot 0.5 + \frac{1}{500} \cdot 0.5 \right] = 0.0055.  
      \]  
      Thus:  
      \[
      P(\text{Hall B} \mid E) = \frac{0.0055}{0.0055} = 1 \quad (\text{since } P(E \mid \text{Hall A}) = 0).  
      \]  
      *But wait*: This uses the marginal likelihood. More carefully, the posterior *given Hall B* is:  
      \[
      P(H_{50} \mid \text{Hall B}, E) = \frac{P(E \mid \text{Hall B}, H_{50}) P(H_{50})}{P(E \mid \text{Hall B})} = \frac{(1/50)(0.5)}{(1/50)(0.5) + (1/500)(0.5)} = \frac{0.01}{0.011} \approx 0.909.  
      \]  
      \[
      P(H_{500} \mid \text{Hall B}, E) \approx 0.091.  
      \]  
  - **Probability the switch is under your seat**:  
    \[
    P(\text{switch} \mid E) = P(\text{switch} \mid \text{Hall B}, E) = \left[ P(H_{50} \mid \text{Hall B}, E) \cdot \frac{1}{50} \right] + \left[ P(H_{500} \mid \text{Hall B}, E) \cdot \frac{1}{500} \right] \approx 0.909 \cdot 0.02 + 0.091 \cdot 0.002 = 0.01818 + 0.00018 = 0.01836.  
    \]  
  - **Decision**: Crawl if expected survival gain > risk:  
    - If you crawl and *have the switch*, you save all students (including yourself). Survival chance: 95%.  
    - If you crawl and *no switch*, you die with 5% chance (no benefit).  
    - **Utility calculation** (self-interested): Crawling gives:  
      \[
      U_{\text{crawl}} = P(\text{switch} \mid E) \cdot 0.95 \quad \text{(alive)}.  
      \]  
      Do nothing gives:  
      \[
      U_{\text{nothing}} = P(\text{in Hall A} \mid E) \cdot 1 + P(\text{in Hall B} \mid E) \cdot 0 = 0 \quad (\text{since } P(\text{Hall B} \mid E) = 1).  
      \]  
      Thus, crawl if:  
      \[
      0.01836 \cdot 0.95 \approx 0.0174 > 0.  
      \]  
      **Decision: Crawl** (barely, but positive expected utility).  

  ---

  **SIA Approach** (Assume your existence favors hypotheses with more observers)  
  - **Prior update via SIA**:  
    - Observers: Students in the active hall.  
    - \(H_{50}\) posits 50 observers; \(H_{500}\) posits 500 observers.  
    - SIA weights hypotheses by observer count:  
      \[
      P_{\text{SIA}}(H_{500}) = \frac{500 \cdot 0.5}{50 \cdot 0.5 + 500 \cdot 0.5} = \frac{500}{550} \approx 0.909, \quad P_{\text{SIA}}(H_{50}) \approx 0.091.  
      \]  
  - **Posterior for Hall B**:  
    - \(P(\text{Hall B} \mid E)\) is still 1 (since \(P(E \mid \text{Hall A}) = 0\)).  
    - Given Hall B, the likelihood of \(E\) is the same, but SIA updates the prior for \(H_{50}\)/\(H_{500}\):  
      \[
      P(H_{50} \mid \text{Hall B}, E) \propto P(E \mid \text{Hall B}, H_{50}) \cdot P_{\text{SIA}}(H_{50}) = (1/50) \cdot 0.091 \approx 0.00182,  
      \]  
      \[
      P(H_{500} \mid \text{Hall B}, E) \propto (1/500) \cdot 0.909 \approx 0.00182.  
      \]  
      Normalize: \(0.00182 + 0.00182 = 0.00364\), so  
      \[
      P(H_{50} \mid \text{Hall B}, E) = 0.5, \quad P(H_{500} \mid \text{Hall B}, E) = 0.5.  
      \]  
  - **Probability the switch is under your seat**:  
    \[
    P(\text{switch} \mid E) = \left[ 0.5 \cdot \frac{1}{50} \right] + \left[ 0.5 \cdot \frac{1}{500} \right] = 0.01 + 0.001 = 0.011.  
    \]  
  - **Decision**:  
    \[
    U_{\text{crawl}} = 0.011 \cdot 0.95 \approx 0.01045 > 0.  
    \]  
    **Decision: Crawl** (still positive, but lower utility than SSA).  

  ---

  #### (3) Key Difference in the Derivations  
  - **Divergent step**: The treatment of the prior over \(H_{50}\)/\(H_{500}\) *given Hall B*.  
    - **SSA** uses the original prior (\(P(H_{50}) = P(H_{500}) = 0.5\)) and updates only with the likelihood \(P(E \mid \text{Hall B}, H_x)\).  
    - **SIA** first updates the prior to \(P_{\text{SIA}}(H_x)\) (weighted by observer count) *before* applying the same likelihood.  
  - **Result**: Under SSA, \(H_{50}\) dominates (you are more likely in a small hall); under SIA, \(H_{50}\) and \(H_{500}\) are equally likely after \(E\).  

  ---

  #### (4) Presumptuous Philosopher Problem?  
  - **Avoids it**. The Presumptuous Philosopher problem critiques SIA for favoring large universes *without evidence* (e.g., assuming a large universe because "I exist"). Here:  
    - The indexical evidence \(E\) ("I am an observer in the outage") is **inevitable** (you couldn't observe otherwise), so SIA's prior update is constrained by empirical facts (hall size affects survival).  
    - The decision has **practical stakes** (death risk), not just credences.  

  ---

  #### (5) Changing the Reference Class  
  - **Widen to non-human animals (e.g., lab rats in the halls)**:  
    - SSA: Increases reference class size, reducing \(P(\text{switch} \mid E)\) (you are less likely to have the switch).  
    - SIA: Increases weight for \(H_{500}\) (more observers), further reducing \(P(\text{switch} \mid E)\).  
    - **Effect**: Both might advise *not crawling* if \(P(\text{switch} \mid E)\) drops below the risk threshold.  
  - **Narrow to students with a trait (e.g., physics majors)**:  
    - If the trait is uncorrelated with hall size, results are scaled but the SSA/SIA *difference* persists.  
    - If the trait correlates with hall size (e.g., only Hall B has grad students), the priors shift, but the core disagreement remains.  

  ---

  #### (6) Observer-Moments vs. Observers  
  Suppose we count observer-moments (each student-second of experience):  
  - **SSA**: Unchanged (the "random selection" is still over students).  
  - **SIA**: Hypotheses weighted by total observer-moments. For Hall B:  
    - \(H_{50}\): 50 students × 2 hours = 100 student-hours.  
    - \(H_{500}\): 500 × 2 = 1000 student-hours.  
    - SIA prior: \(P_{\text{SIA}}(H_{500}) = \frac{1000}{1100} \approx 0.909\) (same as before).  
  - **Analysis unchanged**: The ratio of observer-moments equals the ratio of observers here.  

  ---

  #### (7) The Crucial Feature  
  - **Doing the work**: The power outage creates **indexical uncertainty tied to survival**, where your existence as an observer is necessary but insufficient to resolve a hypothesis-dependent risk.  
  - **Removing it**: If you knew the hall size (no indexical uncertainty), SSA and SIA would agree. If crawling had no risk (no practical decision), the disagreement would be purely about credences.
