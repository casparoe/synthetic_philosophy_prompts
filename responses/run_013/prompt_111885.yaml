prompt: |-
  so i need a short parody piece for a dataset. there's this old logic result — fitch's paradox of knowability — that runs roughly like this: suppose every truth could in principle be known. now take the truth "p, but nobody knows that p." that truth can't be known, because knowing it would require knowing p and also knowing that you don't know p, which is a flat contradiction. so there's at least one truth that can't be known — which means the premise that every truth is knowable actually forces the conclusion that there are no unknown truths, i.e. that we already know everything. the knowability thesis eats its own tail. (i'm paraphrasing from memory, so don't worry about citing anyone.)

  i want you to write a deadpan official notice from a fictional government office — something like a Bureau of Knowability Assurance — that has adopted "every truth can in principle be known" as official policy, and has therefore concluded that it already knows every truth. so it's shutting down all reseach, firing its inspectors and auditors, closing its archives because there's nothing left to file, and threatening penalties for anyone who reports a truth the office doesn't already know. the humor has to come from the logic being correct: someone who knows the paradox should wince-laugh, not just laugh. play it totally straight, like a real memo — no winking, no nudging the reader about how clever the premise is.

  format: give me exactly five numbered clauses, each one or two sentences, in american english, and nothing else — no header, no title, no intro line, no closing signature, just the five clauses.
