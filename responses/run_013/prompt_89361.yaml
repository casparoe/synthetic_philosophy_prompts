prompt: |-
  I work in the legal office of a mid-sized environmental regulator. Inspectors send us three or four statutory interpretation questions a week — whether a permit condition covers a particular discharge, whether an e-scooter is a 'vehicle', whether 'within twenty-eight days' counts the day of service — and we must answer them the same day, usually with no lawyer to hand and no access to a case-law database. Our answers decide whether a business is fined, so they have to be defensible. Our Interpretation Act permits us to look only at the long title, any purpose clause and the other provisions of the Act, and forbids us from using Hansard or committee reports; one of its clauses also says the Act 'is to be read in accordance with its purpose', which may or may not apply to the whole Act.

  Please write a decision procedure we can actually run on a question, grounded in the textualist/purposivist debate: the steps in order, what counts as a sufficient answer at each, where a step stops with the plain meaning of the words, where it stops with the Act's purpose, and what to do when the two pull apart. It must keep clear the difference between the meaning of the words, the intention of the Parliament that enacted them and the purpose the Act serves, and it must mark the points where the answer is a judgement call rather than a deduction. Run it on three cases: an e-scooter under a statute written for motor vehicles; a pollution permit whose literal words exclude the seepage it was plainly meant to catch; and one case of your choosing in which the procedure returns an answer we will not want to hear. Finish by saying what the procedure cannot do.
reasoning: |-
  Okay, let me tackle this complex statutory interpretation problem step by step. The user works in a legal office for an environmental regulator and needs a practical decision procedure for daily statutory interpretation questions under tight constraints. 

  First, I need to understand the core challenges: same-day answers without lawyer support or case law access, high stakes outcomes for businesses, and strict interpretive limits under their Interpretation Act. The procedure must balance textualism and purposivism while clearly distinguishing between word meaning, parliamentary intent, and statutory purpose.

  Hmm, the user's mention of the "textualist/purposivist debate" suggests they need academic rigor made operational. The three test cases (e-scooter, pollution permit, and a third I'll invent) will help demonstrate how the procedure handles conflicts. I should pay special attention to where judgment calls are unavoidable.

  The constraints are particularly interesting: no Hansard or committee reports, mandatory consideration of long title/purpose clause, and that ambiguous "is to be read in accordance with its purpose" clause. This forces pure statutory construction without external aids. I'll structure the procedure to first exhaust textual analysis before permitting limited purposive consideration.

  For the e-scooter case, I'm imagining a classic definitional gap - modern technology meeting old legislation. The pollution permit example shows literal meaning defeating obvious intent. For the third case, I'll design a scenario where the procedure produces an uncomfortable but legally defensible outcome about retroactive liability, highlighting the method's limitations.

  The trickiest part will be Step 5 (conflict resolution). When text and purpose diverge, the procedure must acknowledge both the interpretive mandate ("read in accordance with purpose") and the risk of judicial pushback. I'll emphasize that this step requires institutional judgment about defensibility rather than mechanical application.

  Throughout, I need to flag every judgment point explicitly - like when determining "ordinary meaning" or assessing "plausible alternatives." The user's team aren't lawyers but their decisions have legal consequences, so transparency about uncertainty is crucial.

  Finally, the limitations section should warn that some cases will remain unresolvable under these constraints. The procedure can't create certainty where the statute is truly ambiguous, and it can't replace judicial interpretation when challenged. I'll stress that when outcomes feel unjust, it signals a need for legislative amendment rather than interpretive stretching.
answer: |-
  Here is a practical, step-by-step decision procedure grounded in textualism/purposivism, designed for your constraints. It prioritizes defensibility by systematically exhausting textual sources before cautiously considering purpose, strictly separating textual meaning, perceived intent, and statutory purpose. **Judgment Call** points are explicitly marked.

  **The Statutory Interpretation Procedure:**

  1.  **Define the Provision & Key Term(s):**
      *   **Action:** Isolate the exact statutory provision(s) and the specific word(s) or phrase(s) in question.
      *   **Stop When:** The provision and disputed language are clearly identified.
      *   **Source:** Only the Act itself (including schedules).
      *   **Focus:** Textual meaning *within the Act*.
      *   **Judgment Call:** Identifying the *precise* term(s) causing ambiguity.

  2.  **Check for Statutory Definitions:**
      *   **Action:** Search the Act (especially interpretation sections) for explicit definitions of the key term(s).
      *   **Stop When:** A clear, applicable definition is found OR confirmed absent.
      *   **Source:** Only the Act itself.
      *   **Focus:** Textual meaning (Parliament's chosen definition).
      *   **Sufficient Answer:** If a definition directly includes/excludes the scenario, apply it literally. **Answer Found.** (Textualist anchor).

  3.  **Determine Ordinary Meaning in Context:**
      *   **Action:** Determine the plain, ordinary meaning of the key term(s) *as they appear in the specific provision and surrounding sections*. Consider grammar, syntax, and relation to other provisions.
      *   **Stop When:** A reasonable consensus on the ordinary meaning *in its immediate statutory context* is reached.
      *   **Source:** Only the Act itself. Use dictionary definitions *only* to confirm common understanding at the time of enactment (if known generally, not researched via external databases).
      *   **Focus:** Textual meaning (how a reasonable person would read the words *in situ*).
      *   **Sufficient Answer:** If the ordinary meaning provides a clear, unambiguous answer to the question. **Answer Found.** (Textualist core).
      *   **Judgment Call:** Determining "ordinary meaning" and whether ambiguity truly exists.

  4.  **Analyze the Act's Structure & Harmony:**
      *   **Action:** Examine how the provision fits within the broader Act. Read the long title and purpose clause (if any). Check for related provisions, exceptions, or lists that shed light on the key term(s). Apply expressio unius (mention of one thing excludes others) and ejusdem generis (general words limited by specific list) *cautiously*.
      *   **Stop When:** The provision's role within the Act's overall scheme is understood, and potential conflicts or harmonies with other provisions are identified.
      *   **Source:** Only the Act itself (Long Title, Purpose Clause, other provisions).
      *   **Focus:** Textual meaning (implied context, internal coherence). Purpose (Long Title/Purpose Clause) is used *only* to understand the context for interpreting the *words*, not to override them at this stage.
      *   **Sufficient Answer:** If the Act's structure and internal logic resolve the ambiguity created in Step 3. **Answer Found.** (Textualist coherence).
      *   **Judgment Call:** Applying canons of construction; weighing the significance of structural placement; interpreting the Long Title/Purpose Clause *as part of the text*.

  5.  **Consider Purpose *Only* if Text Remains Ambiguous & Mandate Exists:**
      *   **Action:** *Only proceed if Steps 1-4 yield no clear, unambiguous answer OR if the interpretive mandate ("is to be read in accordance with its purpose") explicitly applies to the provision.* Identify the Act's purpose *solely* from the Long Title and any Purpose Clause. Ask: Does applying the ordinary meaning in context *defeat* this purpose in the specific scenario? Does a *plausible alternative interpretation* (still grounded in Step 3 & 4) *better achieve* the purpose?
      *   **Stop When:** The core statutory purpose is identified from permitted sources, and its interaction with the plausible textual meanings is assessed.
      *   **Source:** Only the Act itself (Long Title, Purpose Clause). **Forbidden:** Hansard, Committee Reports, external policy goals.
      *   **Focus:** Statutory purpose (as enacted in text) vs. Textual meaning (plausible interpretations). *Separate:* Do **not** inquire into Parliament's subjective "intention" – only the purpose *as written*.
      *   **Sufficient Answer:** If a plausible textual interpretation aligns with the purpose *without straining the language*. **Answer Found.** (Purposivist nudge within textual bounds).
      *   **Judgment Call:** Determining if ambiguity persists after Step 4; interpreting the Purpose Clause/Long Title; deciding if an interpretation "defeats" the purpose or is a "plausible alternative"; applying the interpretive mandate clause's scope.

  6.  **Conflict Resolution (Text vs. Purpose):**
      *   **Situation:** The only plausible ordinary meaning (Steps 1-4) *clearly* conflicts with the stated purpose (Step 5), *and* the interpretive mandate applies.
      *   **Action:** *Text has strong primacy.* Adopt the ordinary meaning unless:
          *   Applying it would lead to an *absurd result* (objectively unreasonable, not just inconvenient), **AND**
          *   A *slightly strained but linguistically possible* alternative interpretation exists that avoids absurdity and better aligns with the purpose.
      *   **Stop When:** A defensible choice is made, prioritizing textual fidelity unless absurdity forces a minimal purposive adjustment.
      *   **Source:** Act text and purpose (as above).
      *   **Focus:** Balancing defensible textual interpretation against statutory purpose under duress (absurdity).
      *   **Sufficient Answer:** The least disruptive interpretation that avoids absurdity while respecting the text as much as possible.
      *   **Judgment Call:** Defining "absurd result"; deciding if an alternative is "linguistically possible"; applying the interpretive mandate under conflict. **Highest Risk Step.**

  7.  **Document & Advise:**
      *   **Action:** Clearly state the answer and the step(s) where it was found. If based on Step 5 or 6, explicitly note the role of purpose and the presence of ambiguity/conflict. Flag any significant judgment calls. If the answer is uncomfortable but legally defensible under this procedure, state it plainly.
      *   **Focus:** Transparency and defensibility.

  ---

  **Application to Test Cases:**

  **Case 1: Is an E-Scooter a "Vehicle" under a Statute Regulating "Motor Vehicles"?**
  1.  **Provision:** Statute defines offenses for operating "motor vehicles" in prohibited zones. No definition of "motor vehicle" or "vehicle" in the Act.
  2.  **Statutory Definition:** None found.
  3.  **Ordinary Meaning:** "Motor vehicle" commonly implies combustion or electric *engine* for propulsion, carrying people/goods, on roads. E-scooter has electric motor, carries a person. *Ambiguity:* Does "motor" exclude low-power scooters? Does size matter? *Judgment Call:* Common understanding leans towards inclusion, but not absolute certainty.
  4.  **Structure/Harmony:** Long Title: "Regulate powered transport to ensure public safety." Purpose Clause: "Minimize congestion and accidents involving powered transport." Related provisions mention "cars," "trucks," "motorcycles," but no specific exclusions. *Harmony:* E-scooters pose similar safety/congestion risks. *Interpretive Mandate?* Assume it applies. *Ambiguity persists.*
  5.  **Purpose (Ambiguity + Mandate):** Purpose is public safety/congestion for powered transport. Excluding e-scooters (plausible if "motor" implies larger engines) could defeat this purpose where they cause hazards. Including them aligns with purpose and is a plausible interpretation of "motor vehicle" (they have motors).
  6.  **Conflict Resolution:** No strong conflict here. Plausible textual meaning (include) aligns perfectly with purpose. No absurdity in inclusion.
  7.  **Answer:** **Yes, the e-scooter is a "motor vehicle"** under this statute. (Resolved at Step 5 - purpose confirms plausible textual interpretation).

  **Case 2: Pollution Permit Condition: Literal Words Exclude Seepage Meant to be Caught**
  *   **Provision:** Permit Condition: "Discharge of effluent via Outfall Pipe A shall not exceed X mg/l of Pollutant Y."
  *   **Question:** Does "discharge via Outfall Pipe A" cover seepage from a cracked pipe joint *before* the official outfall point?
  1.  **Define:** "Discharge via Outfall Pipe A".
  2.  **Stat Def:** None found.
  3.  **Ordinary Meaning:** "Via" means "by way of" or "through." "Discharge via Outfall Pipe A" strongly implies discharge *that passes through and exits* Outfall Pipe A. Seepage from a crack *before* the pipe end does not exit *via* the pipe itself; it escapes prematurely. Literally, **No**, it is not covered.
  4.  **Structure/Harmony:** Long Title: "Prevent contamination of Waterway Z." Purpose Clause: "Ensure all industrial effluent entering Waterway Z meets environmental standards." General prohibition on "causing or permitting entry of Pollutant Y into Waterway Z." *Conflict:* Literal reading excludes seepage, but seepage clearly enters Waterway Z and violates the Act's core purpose. *Interpretive Mandate?* Assume applies. *Ambiguity?* Low on text, high on outcome vs. purpose.
  5.  **Purpose (Ambiguity? + Mandate):** Text is *unambiguous* but leads to result defeating purpose (pollution unregulated). *Judgment Call:* Strictly, Step 5 requires ambiguity; here the text is clear but problematic. Proceed cautiously to Step 6.
  6.  **Conflict Resolution (Text vs. Purpose):** Literal meaning is clear but leads to absurdity (regulating only perfect pipe discharges while ignoring leaks defeats core environmental protection). Alternative interpretation: "discharge via Outfall Pipe A" could encompass effluent *intended for discharge through* Outfall Pipe A, or *emanating from the system terminating at* Outfall Pipe A. This is linguistically *possible* (though strained) and avoids the absurdity. The interpretive mandate ("read in accordance with purpose") justifies this minimal adjustment.
  7.  **Answer:** **Yes, the permit condition covers the seepage.** (Resolved at Step 6 - literal text defeated absurdity, minimal purposive adjustment applied). *Judgment Call Heavy.*

  **Case 3 (The Unwelcome Answer): Retroactive Liability for Past Conduct**
  *   **Scenario:** New Act imposes strict liability fines for "holding" a specified hazardous substance without a permit after Jan 1, 2024. Your agency issued permits starting Dec 15, 2023. A business applied Dec 10, 2023, but due to backlog, received permit Jan 5, 2024. They held the substance Jan 2-4, 2024. Statute is silent on application processing times or grace periods. Question: Is the business liable for the fine?
  1.  **Provision:** "A person commits an offense if they hold Substance X without a permit issued under this Act at any time on or after 1 January 2024."
  2.  **Stat Def:** None relevant.
  3.  **Ordinary Meaning:** "without a permit... at any time on or after [date]." Clear: Liability starts precisely at 00:01 Jan 1, 2024, if no permit exists *at that time*. No mention of application status. **Literal answer: Yes, liable.**
  4.  **Structure/Harmony:** Long Title: "Regulate hazardous substances to prevent environmental harm." Purpose Clause: "Ensure safe handling of Substance X through a permit system." No transitional provisions, savings clauses, or mention of application processing. General strict liability offense. *Harmony:* The clear text fits the purpose of strict control starting Jan 1. *Interpretive Mandate?* Assume applies. *Ambiguity?* Text is crystal clear. No ambiguity.
  5.  **Purpose (Ambiguity? + Mandate):** *No ambiguity.* Applying the literal meaning does not "defeat" the purpose (it enforces strict control from the start date), even if it seems harsh. The purpose clause doesn't imply fairness in processing times. **Cannot proceed to purposive override without ambiguity.** *Judgment Call:* Hard stop. Purpose confirms the text; it doesn't contradict it.
  6.  **Conflict Resolution:** N/A (No conflict - text and purpose align in imposing liability from Jan 1).
  7.  **Answer:** **Yes, the business is liable for the fine** for holding the substance Jan 2-4 without a permit. (Resolved at Step 3/4 - clear text aligned with purpose). *This is the unwelcome but defensible answer under your constraints.* It highlights procedural unfairness but cannot be fixed by interpretation; it requires a legislative amendment or internal policy on processing times (if possible).

  ---

  **What the Procedure Cannot Do:**

  1.  **Create Certainty from Ambiguity:** If the text is genuinely ambiguous and purpose doesn't resolve it, the procedure will identify the ambiguity and the defensible options, not a single "right" answer.
  2.  **Override Clear Text:** It cannot ignore unambiguous language, even if the outcome seems unfair or unintended, unless it reaches the high bar of "absurdity" (Step 6). The business in Case 3 gets fined.
  3.  **Incorporate External Policy or Equity:** It cannot import notions of fairness, good administration, or modern policy goals beyond the enacted purpose clause and long title. Hansard and committee reports are forbidden.
  4.  **Predict Judicial Interpretation:** It provides a *defensible* answer based on the mandated sources, but a court *might* later use extrinsic materials or different principles (if your jurisdiction allows) to reach a different conclusion.
  5.  **Fill Legislative Gaps:** It interprets existing text. It cannot invent exceptions (like a grace period in Case 3) or definitions not present or implied in the Act.
  6.  **Resolve Deep Philosophical Disputes:** It structures the textualism/purposivism debate into steps but cannot eliminate the underlying tension, especially in Step 6.
  7.  **Guarantee the Outcome is "Right" or "Just":** It guarantees a *procedurally sound and defensible* answer based solely on the permitted sources. Case 3 shows the answer can be legally sound but administratively/politically problematic.

  This procedure provides a rigorous, constraint-compliant framework to reach the most defensible answer possible under significant pressure, clearly marking points of judgment and the limits of interpretation. It prioritizes textual fidelity while allowing purpose a constrained role only where ambiguity exists or absurdity looms, always anchored in the enacted words of the statute.
