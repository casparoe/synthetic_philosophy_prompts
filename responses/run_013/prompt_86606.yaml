  Assessing neglect: foundations and connections have more literature, agency less so. Tractability: foundations require moderate math, agency more conceptual. Dead ends: agency without formal models; implementation semantics if not grounded.

  Prioritization: Foundations first (weeks 1-4), as they underpin everything. Then connections (weeks 5-8), testing applicability. Agency only if time (weeks 9-10). Implementation semantics as an alternative if others stall.

