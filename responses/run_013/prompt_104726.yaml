answer: |-
  ### Thought Experiment: The Idle Fields of Agraria

  **Setting (245 words):** Agraria is a closed island economy with fixed fertile land. Its 100 workers can farm or remain idle. With 10 gold coins circulating, only 50 workers are hired annually by landlords (who own all land and coins) to produce 100 bushels of grain. Wages: 0.1 coins/worker. Grain price: 0.05 coins/bushel (since 10 coins buy 100 bushels × 0.05 price). The state bank issues paper credit. In Phase 1, it lends 5 paper notes to landlords at 0% interest, redeemable in 5 years, for hiring idle workers. Landlords hire all 50 idle workers. Output rises to 200 bushels. Grain price falls to 0.0375 coins/bushel (15 coins buy 200 bushels). In Phase 2, the bank issues another 10 notes to landlords on identical terms. They bid for workers, but no more idle labor exists. Wages rise to 0.15 coins/worker. Output remains 200 bushels. Grain price rises to 0.125 coins/bushel (25 coins buy 200 bushels).

  **Berkeley’s Verdicts:**
  1.  **Phase 1 Endorsed:** The 5-note issue increases wealth by mobilizing idle labor, raising output to 200 bushels. Wealth (command over labor/fruits) grows.
  2.  **Phase 2 Licensed:** The extra 10 notes circulate industry by raising wages and maintaining employment. Velocity compensates for quantity (Principle 4), so commerce continues.

  **Metallic Realist’s Verdicts:**
  1.  **Phase 1 Rejected:** Paper only creates more tickets (5 new notes + 10 coins) for the original 100 bushels. Output only *appears* to rise due to time lags; real wealth is unchanged.
  2.  **Phase 2 Ruinous:** 25 claims (10 coins + 15 notes) chase 200 bushels, causing inflation. Real wages fall as grain prices rise faster than nominal wages.

  **Divergence Point:** At hiring in Phase 1. Berkeley sees output rising *because* money mobilizes idle labor. The realist sees output fixed; new money merely dilutes claims.

  **Load-Bearing Principle:** **Principle 2 ("Money stirs up and circulates industry")** is decisive. It alone justifies issuing credit to activate idle resources, directly linking money to *new* production. Without it:
  - Principle 1 (money ≠ wealth) is inert bullionism.
  - Principle 3 (money as ticket) enables paper but doesn’t mandate its issuance.
  - Principles 4-5 (velocity, bank credit) manage circulation but don’t create wealth ex nihilo.
  **If Removed:** Doctrine collapses into bullionism. Phase 1 credit issuance lacks justification; money is merely a numeraire.

  **Demonstration:**
  - **Berkeley’s Steps:**  
    1. Idle labor exists → unused productive capacity (Principle 1).  
    2. Credit (5 notes) hires idle workers → industry "stirred up" (Principle 2).  
    3. Output rises to 200 bushels → wealth increases (Principle 1).  
    4. Price falls due to increased plenty (Principle 4).  
    5. Phase 2: More credit (10 notes) circulates existing industry via higher wages/velocity (Principles 2,4,5). Commerce persists.  
  - **Realist’s Steps:**  
    1. Land/labor determine output. 50 workers → 100 bushels; 100 workers → 200 bushels.  
    2. Phase 1: 15 claims (10 coins + 5 notes) initially target 100 bushels → inflation. Output rises later but is independent of money.  
    3. Phase 2: 25 claims for 200 bushels → price rise inevitable. Real wealth unchanged.  
  - **Consistency:** The two halves are consistent under Berkeley’s doctrine. Principle 2 licenses both phases: first by activating idle labor, second by sustaining circulation. No internal contradiction.  
  - **Berkeleyan Defense:** A defender would deny Phase 2 follows, citing Principle 5 ("quantity proportioned to needs of trade"). At full employment, "needs" are met; further credit is excessive. But this fails: the doctrine lacks criteria for "needs" (it’s undefined beyond circulation), and Phase 2 maintains velocity/employment, satisfying Principles 2,4,5. The defense smuggles in unstated limits.

  **Verdict:** Principle 2 ("stirs industry") is load-bearing; the doctrine survives as one theory but strains under full employment, revealing operational ambiguity in "circulates industry."
