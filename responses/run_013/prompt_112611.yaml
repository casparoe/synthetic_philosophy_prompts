  I spent thirty-odd years as a field entomologist watching digger wasps, and I've recenly gotten into philosphy. I keep running into sphexishness—the wasp that just rechecks the burrow if the cricket gets moved. I've been chewing on a distinction I haven't seen named: first-order sphexishness is the fixed routine itself; second-order sphexishness is when a creature has flexible subroutines but the rule for switching between them is itself fixed and never examined. Please describe the most important implications of that distinction for the free will debate and for moral responsibility. Does it actually do any work, or does it just move the cage up a level? And if a lot of human flexibility turns out to be second-order sphexish, what follows for praise and blame?
