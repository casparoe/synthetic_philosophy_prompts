answer: |-
  Your standoff is a beautifully layered philosophical tangle—part semantic slippage, part clashing interpretations of modelling, with substantive questions about institutional design humming beneath. Let's dissect it clinically, as requested.

  ### I. Verbal Confusion: The Double Meaning of "Commons"
  You've precisely nailed the core ambiguity. When your friend says "the parable was refuted," they likely mean:  
  > *"Hardin's claim that commons **institutions** inevitably fail was empirically falsified by Ostrom's work on enduring communal governance."*  

  When you say "the logic isn't falsified," you mean:  
  > *"Hardin's model of **rivalrous, non-excludable goods** absent governance still predicts overuse—and Ostrom's cases don't negate that logic; they show how governance avoids it."*  

  **Progress:** Explicitly separate "commons-as-resource-type" (the economic good) from "commons-as-governance-regime" (the institutional solution). Ostrom refuted fatalism about the *latter*; she didn't disprove the inherent challenges of the *former*.

  ### II. Disagreement About What Models Assert & How They Are Refuted
  Here lies your earnest dispute:  

  - **Your view (Model as Conditional Logic):**  
    Hardin's model is a *ceteris paribus* thought experiment: "IF a good is rivalrous and non-excludable, AND users act independently as rational maximisers, AND no rules exist, THEN depletion follows." Ostrom relaxes assumptions (adding rules, communication, trust), so her cases are *complements*, not refutations. The core game-theoretic dilemma remains valid within its constraints.  

  - **Your friend's view (Model as Empirical Claim):**  
    Hardin presented the tragedy as an *inevitable historical outcome* for commons absent privatisation/state control. Ostrom's fieldwork disproved this by showing communities *frequently* avoid tragedy through self-governance. Thus, the model fails as a general predictive theory of real-world commons.  

  **Hidden Question:** *What is the purpose of economic models?*  
    - If models are **tools for isolating mechanisms** (your view), Ostrom didn't "refute" it—she enriched it.  
    - If models are **claims about observable reality** (friend's view), Ostrom demolished Hardin's generality.  

  **Progress:** Distinguish *model validity* (is the logic sound given assumptions?) from *empirical applicability* (do real humans/communities match these assumptions?). Hardin's model is *valid* but *inapplicable* where Ostrom's conditions hold.

  ### III. The Monitoring Puzzle: A Substantive Knot
  You both agree monitoring is a second-order public good that "should" be underprovided, yet often isn't. This points to an **unresolved empirical/formal question**:  
  > *Under what conditions do communities overcome the second-order collective action problem of enforcing rules?*  

  Ostrom documented *how* (norms, graduated sanctions, low-cost monitoring), but not universally. Your friend sees this as falsifying Hardin's pessimism; you see it as relaxing his assumptions (adding "capacity to enforce rules"). The deeper clash is about:  
  - **Human behaviour:** Is cooperation/rule-following reducible to rational self-interest? Or do norms/identity play irreducible roles?  
  - **Institutional scalability:** Do Ostrom's solutions work only in small, stable groups? (Her cases are mostly local.)  

  **Progress Needed:** Engage with experimental/behavioural economics (e.g., Fehr & Gächter on altruistic punishment) or formal work on repeated games. The key is whether "monitoring effort" fits standard rational choice models or requires alternative frameworks.

  ### IV. What Would Count as Progress?  
  1. **Distinctions:**  
     - Commons-as-resource vs. commons-as-institution.  
     - Model validity (internal logic) vs. empirical relevance.  
     - *Ceteris paribus* predictions vs. all-things-considered outcomes.  

  2. **Formal Result:**  
     Review a game-theoretic model incorporating *endogenous institutional choice* (e.g., users deciding monitoring rules). Many show cooperation *can* emerge, but only under specific parameters (group size, discount rates). This bridges your views: the "tragedy" is avoidable but not automatic.  

  3. **Case:**  
     Examine a *failed* commons where Ostrom's principles were absent (e.g., open-access fisheries collapsing despite communal ties). This tests the limits of her framework—and reaffirms Hardin's logic *where governance fails*.  

  4. **Change of Question:**  
     Shift from "Was Hardin refuted?" to:  
     > *"When do rivalrous/non-excludable goods lead to sustainable outcomes, and what institutional features make this possible?"*  
     This embraces both Hardin's mechanism and Ostrom's solutions.  

  ### V. Conclusion: Reasonable Stalemate, but Paths Forward
  Neither of you is "wrong," but you're prioritising different facets:  
  - You're defending **theoretical coherence** within a rational-choice framework.  
  - Your friend emphasises **empirical counterexamples** to historical fatalism.  

  **Stalemate likely if:** You treat Ostrom as either "refuting" or "irrelevant to" Hardin's model.  
  **Progress possible if:** You jointly analyse *why* Ostrom's cases evade the tragedy—using Hardin's logic as the foil. Her work doesn't falsify the model; it falsifies the *assumption that institutions can't emerge*. That’s a profound refinement, not a refutation.  

  The unresolved core is whether rational egoism suffices to explain real-world cooperation. That’s not a Saturday-night solvable puzzle—but clarifying the layers above might salvage next Saturday.
