  ## Handout: Reading *It Can’t Happen Here* Through Democratic Backsliding

  **I. The Concept: Democratic Backsliding (c. 300 words)**

  Democratic backsliding describes the incremental deterioration of a democracy’s core institutions and norms by actors operating *within* the existing constitutional framework. Crucially, it is distinguished from **democratic breakdown**, which implies the complete collapse of democratic rule, often through revolutionary overthrow or unambiguous military coup. Backsliding is also distinct from a **classical coup**, which is typically swift, extra-legal, and involves the forcible seizure of power by non-constitutional actors.

  Characteristic mechanisms include:
  1.  **Executive Aggrandizement:** The systematic concentration of power within the executive branch, weakening checks and balances.
  2.  **Constitutional Retrogression:** The manipulation or hollowing out of constitutional rules and norms to legitimise authoritarian practices.
  3.  **Suffocation of Opposition:** Tactics like gerrymandering, voter suppression, judicial harassment, and media co-option or intimidation aimed at crippling political competition while maintaining a façade of pluralism.
  4.  **Erosion of Civil Liberties:** Incremental restrictions on freedoms of speech, assembly, and the press, often justified by national security or public order.

  The concept is contested. Critics worry it can become:
  *   A **threshold problem:** Is it defined by falling below a specific score on democracy indices (e.g., V-Dem), and if so, where is that line?
  *   An **intentionalist trap:** Does it require proving the *intent* of leaders to dismantle democracy, which can be difficult to ascertain and often emerges gradually?
  *   A **partisan label:** Can accusations of backsliding be weaponised for political advantage, potentially delegitimising legitimate democratic contestation?

  Fundamentally, backsliding focuses on the *process* of democratic decay through ostensibly legal and electoral means, rather than its endpoint or sudden overthrow.

  **II. The Novel as a Case: Windrip Against the Framework (c. 500 words)**

  Lewis’s narrative offers a compelling, albeit accelerated and dramatised, case study fitting several core mechanisms of democratic backsliding, particularly within its American context:

  *   **Elected Demagogue & Competitive Authoritarianism:** Berzelius "Buzz" Windrip’s rise via populist demagoguery, exploiting economic despair and nationalist sentiment, fits the model of an authoritarian leader emerging through elections. His platform ("The Fifteen Points") weaponises democratic processes to undermine democracy itself, characteristic of competitive authoritarianism where elections persist but become deeply unfair. Key scenes like his raucous rallies and manipulative convention victory depict this potent blend of electoral legitimacy and illiberal appeal.
  *   **Executive Aggrandizement:** Windrip’s actions after inauguration directly embody this. He rapidly sidelines Congress (Parliament), rendering it irrelevant. His issuing of decrees, bypassing legislative scrutiny, and purging the civil service exemplify the concentration of power in the executive. The novel’s portrayal of a weakened, intimidated legislature aligns perfectly with this mechanism.
  *   **Corporatist Capture:** The novel clearly depicts the collusion between the Windrip regime and big business interests ("The Corporative State"). This co-option of economic elites, granting them influence in exchange for support, mirrors the corporatist capture often observed in backsliding states, where economic power reinforces political authoritarianism.
  *   **Mass Acquiescence:** A central theme is the widespread, often passive, acceptance or even enthusiastic support for Windrip by ordinary Americans. Doremus Jessup’s neighbours and community illustrate how fear, economic self-interest, nationalist fervour, and a belief in "strong leadership" enable backsliding. This mass complicity is crucial to the process, preventing effective resistance.

  **Where the Novel Diverges:**

  *   **Speed & Open Illegality:** The backsliding scholarship emphasises gradualism and legalistic erosion. Windrip’s transformation is breathtakingly fast, moving from election to dictatorship within months. Furthermore, actions like the mass arrests by the Minute Men involve blatant, open illegality from the outset, violating due process far more overtly and rapidly than typical backsliding cases where legality is often meticulously hollowed out.
  *   **The Role of the Minute Men:** The paramilitary "Minute Men" are central to Windrip’s rule, acting as his enforcers through violence and intimidation. While militias exist in real cases (e.g., Turkey's SADAT), their *institutionalised* role as an official, parallel security force directly terrorising citizens exceeds the typical scope of backsliding mechanisms like judicial harassment or media pressure. It resembles more openly violent regimes.
  *   **The Self-Coup:** Windrip’s declaration of martial law and seizure of absolute power, though preceded by electoral victory, constitutes a definitive **self-coup (autogolpe)**. While self-coups are recognised within the broader study of democratic collapse, their sudden and definitive nature often places them closer to breakdown than the incremental erosion central to contemporary backsliding theory.

  **The American Setting:** The novel’s potency lies in applying these dynamics to the US context – the exploitation of populist rhetoric, the manipulation of patriotic symbols, the erosion of constitutional checks (Congress, courts), and the chilling plausibility of mass acquiescence among ordinary citizens resonate specifically *because* it happens *here*, challenging American exceptionalism.

  **III. Where the Novel Resists the Concept (c. 350 words)**

  *It Can’t Happen Here* sits awkwardly with core tenets of contemporary democratic backsliding scholarship, particularly its emphasis on **gradualism** and **legalistic erosion**. Lewis depicts not a slow suffocation but a near-simultaneous cardiac arrest. Windrip’s rapid dismantling of institutions, the immediate deployment of paramilitary terror, and the explicit declaration of dictatorship within months of taking office starkly contrast with the incrementalism observed in cases like Hungary’s Orbán or Turkey’s Erdoğan, where constitutional changes, judicial takeovers, and media capture occurred over years, often wrapped in legalistic justifications.

  On scholarship’s own terms, Lewis’s narrative leans closer to **democratic breakdown** triggered by a **self-coup**, rather than pure backsliding. The speed and overt illegality push it beyond the threshold of incremental erosion central to the concept. Compared to the cases taught:
  *   **Hungary/Poland:** Exhibit textbook gradual backsliding – capturing courts, media, and civil service over time using legislative majorities.
  *   **Turkey:** Shows a blend – gradual erosion under Erdoğan followed by a more drastic consolidation post-2016 coup attempt, yet still maintaining some formal processes.
  *   **United States (as case study):** Focuses on norm erosion, executive overreach, and threats to electoral integrity *within* the constitutional framework – far closer to backsliding than Windrip’s revolution.

  Does this make the novel the "wrong case"? Not necessarily. Instead, it exposes a potential **blind spot** in the backsliding framework. By consciously overcorrecting against the dramatic imagery of classic coups, contemporary scholarship risks underplaying the *potential speed* at which erosion can manifest under crisis conditions, or the role that **violence and paramilitarism** can play *alongside* institutional capture, even if not always officially sanctioned. Lewis reminds us that backsliding, while often gradual, can rapidly accelerate towards breakdown when key guardrails fail simultaneously and actors abandon even the pretence of legality. The novel serves as a stark warning about the fragility of norms when faced with a determined demagogue and widespread societal complicity, challenging the theory’s sometimes comfortable assumptions of inherent institutional resilience.

  **IV. What the Novel Adds: Beyond Indices and Typologies (c. 250 words)**

  While scholarship excels at identifying mechanisms and measuring decline through indices, *It Can’t Happen Here* offers invaluable insights into the **lived experience and affective dimensions** of democratic decay, aspects difficult to capture quantitatively:

  1.  **The Texture of Complicity:** Through characters like Doremus’s neighbours, the novel explores the *ordinary reasons* people acquiesce or collaborate: fear, opportunism, genuine belief in the leader, economic anxiety, tribal loyalty, and the sheer exhaustion of resistance. It shows complicity not as monolithic evil, but as a spectrum of morally compromised choices made under pressure.
  2.  **Internalising the Regime:** The novel depicts how the regime *feels* from the inside – the pervasive atmosphere of suspicion, the normalisation of fear, the silencing of dissent not just by force but by social pressure and self-censorship. Doremus’s own journey from detached observer to persecuted resistor illustrates the gradual suffocation of civic space and personal liberty.
  3.  **The Demagogue’s Appeal:** It dramatises the visceral power of demagogic rhetoric and the emotional manipulation of masses in a way theoretical texts cannot, showing *how* figures like Windrip bypass rational deliberation.
  4.  **Moral Deterioration:** It illustrates how the erosion of democratic norms corrodes *personal* morality and civic bonds, fostering distrust and cruelty within communities.

  **For Teaching:** This should absolutely change how you teach the concept. Pairing the analytical framework with Lewis’s novel provides a powerful synergy. The scholarship offers the diagnostic tools, but the novel delivers the *human cost* and the *psychological landscape* of backsliding. It forces students to confront not just the "how" but the "why" of complicity and the visceral reality of losing freedoms incrementally – or, as Lewis warns, catastrophically fast. It reminds us that backsliding is ultimately about people, choices, and the erosion of a shared civic reality, making the theoretical stakes urgently real.
