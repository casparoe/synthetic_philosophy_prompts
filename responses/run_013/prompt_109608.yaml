answer: |-
  ## Research Proposal: Which Computations Matter Morally?

  The question of moral status increasingly hinges on the notion of computation. As artificial systems grow more complex and our understanding of non-human cognition deepens, appeals to "what is computed" or "how it is computed" are frequently invoked to ground claims about moral considerability. Yet, I observe a persistent and problematic slippage in these discussions between three distinct elements: the abstract *algorithm* a system is claimed to run, the specific *physical implementation* that instantiates that computation, and the *observer-dependent description* under which we credit the system with running that particular algorithm at all. This conceptual instability, I argue, stems from a fundamental insight in the philosophy of computation and cognitive science: any given physical system can be interpreted as implementing a vast, indeed indefinite, number of different computations, depending entirely on how we choose to carve up its causal structure and assign semantic content. This pervasive underdetermination threatens to dissolve the moral significance of computation itself. If virtually any system can be described as performing virtually any computation given sufficient interpretive latitude, then the appeal to "what is computed" as a criterion for moral status loses its discriminatory power. My proposed research seeks to confront this challenge directly. Its core aim is to rigorously investigate which, if any, aspect of this computational triad – algorithm, implementation, or observer-dependent attribution – can consistently bear the moral weight placed upon it, or whether we must identify a much narrower, more determinate constraint *within* the computational framework to salvage the concept's ethical relevance.

  Familiar frameworks offer insufficient resolution. Functionalist approaches, which identify mental states (and potentially moral status) with the abstract causal/computational roles played, focus intently on the algorithm but remain largely silent on the critical issues of implementation and, crucially, observer relativity. They struggle to explain why instantiating *this particular computation* (e.g., belief-desire psychology) under *this particular description* confers status, when alternative, equally valid descriptions of the same physical processes might yield radically different computational interpretations devoid of morally relevant features. Conversely, biologically grounded approaches emphasize the physical implementation, typically privileging specific organic substrates (e.g., neural tissue). While this avoids the observer-relativity problem by anchoring status in biology, it faces the opposite difficulty: it struggles to articulate *why* the biological implementation matters *beyond* its contingent ability to support certain types of computation associated with consciousness or agency. If the morally relevant computations *could* be implemented non-biologically (a core question in AI ethics), the biological constraint appears arbitrary or fails to capture the underlying functional property deemed essential. Both approaches, therefore, leave unresolved the core tension arising from computational pluralism – the multitude of computations a single system can be said to implement.

  My proposed methodology involves isolating specific candidate constraints that might narrow the field of morally relevant computational descriptions and rigorously testing them against two criteria: (1) their *relevance* to plausible conceptions of moral status (e.g., grounding consciousness, agency, interests, or intrinsic value), and (2) their *determinacy* – their ability to resist the charge of pervasive observer-relativity and pick out a specific, non-arbitrary aspect of the system's computational profile. I will focus on several promising candidates derived from computational theory and neuroscience:
  1.  **Counterfactual Sensitivity Surviving Redescription:** Does the system exhibit internal state transitions and outputs that are robustly sensitive to inputs and internal states *in ways that hold* under significant re-descriptions of those states and transitions? The focus is on patterns of causal dependency that are invariant across plausible computational interpretations.
  2.  **Integration:** Does the computation involve a high degree of informational integration (potentially drawing on formal measures like Φ, though cognizant of its limitations), where the whole system's state causally constrains its parts in a way that resists decomposition into independent sub-computations? The hypothesis is that highly integrated processes might be less susceptible to arbitrary re-description fragmentation.
  3.  **Self-Application/Use:** Does the system *utilize* its own internal states *as representations* within its ongoing computations – for prediction, control, or self-monitoring – in a way that grounds a minimal form of subjective perspective or intrinsic goal-directedness, potentially observable regardless of the external observer's semantic labeling?

  The success or failure of the project will be judged by the following: A *real result* would be the identification of at least one constraint that demonstrably meets both criteria – showing a clear, non-arbitrary link to a core feature of moral status *and* exhibiting sufficient determinacy to overcome the "anything computes anything" objection under plausible interpretations. This could involve demonstrating that systems satisfying the constraint (e.g., robust counterfactual sensitivity) consistently map onto systems we independently judge morally considerable, while systems lacking it do not, and that the constraint itself significantly limits the scope of valid computational descriptions. *Failure* would manifest in several ways: finding that no candidate constraint plausibly links to moral status; discovering that plausible constraints remain hopelessly vulnerable to observer-relativity; or concluding that determinacy can only be achieved by collapsing back into a purely biological or non-computational criterion, thereby abandoning the computational premise. Failure would still be a valuable result, clarifying the fundamental limitations of computational approaches to moral status.

  Given the single-term constraint (approximately three months), the project will be structured rigorously. The initial phase (Weeks 1-3) will involve sharpening the formal definitions of the candidate constraints and precisely articulating the problem of computational pluralism in the moral context. Weeks 4-6 will focus on systematically analyzing each constraint against the dual criteria of moral relevance and determinacy, using thought experiments and formal argumentation. This will involve stress-testing each candidate: can observer-relativity undermine it? Does it plausibly connect to core ethical concepts like suffering, agency, or interests? Weeks 7-9 will focus on synthesizing findings, identifying the strongest candidate(s), or diagnosing the reasons for failure. Crucially, if the analysis reveals that pinning down a single, universally determinate constraint is intractable within the timeframe, I will shift focus to defining the *minimal necessary conditions* for a computational description to be *candidates* for moral relevance or mapping the *spectrum* of determinacy across different contexts, providing a structured framework for future research. The final weeks (10-12) will be dedicated to refining the argument and preparing the output – a significant paper draft outlining the analysis and conclusions. This plan ensures a concrete outcome, whether a positive proposal, a negative result, or a clearly defined path forward acknowledging the complexity uncovered. The goal is not final resolution but a substantial, rigorous step in clarifying the fraught relationship between computation and moral value.
