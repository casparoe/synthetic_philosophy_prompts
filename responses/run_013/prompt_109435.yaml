prompt: |-
  my friend has gotten really into Freud on religion and keeps making the same arguement at me, and I want to be able to take it apart properly rather than just going "hmm, that's a bit reductive". his version goes like this: God is a projection — you take the helplessness you felt as a kid and the father who was supposed to protect you from it, you magnify the whole package and stick it in the sky. then he adds that Freud thought religion is basically the universal version of an obsessional neurosis — the rituals, the rules, the repetition, the guilt — and that it's an illusion in the sense of being a wish fulfillment. from there he concludes that God is a fiction and the belief is irrational.

  I'm fairly sure the whole thing is being carried by the analogies, and he never says what they're actually supposed to establish. so what I want from you is an audit, not a summary of Freud. start with the correspondence table — father -> God, childhood helplessness -> ?, neurosis -> ?, ritual -> ritual, analyst -> ?, and whatever else is doing work in there — then tell me where the mapping breaks, then whether his conclusion survives once the breaks are on the table.

  Three things I especially want hit. First, does anything about where a belief came from bear on whether it's true? The mechanism is supposed to be wish fulfillment, and that makes the belief suspicious at best; he needs some seperate premise about how the belief is held (that it wouldn't survive evidence, that he couldn't have arrived at it any other way) and I don't think he's got one. Second, how much work is neurosis doing? That's a diagnosis, so it drags in a standard of health and a contrast class of the healthy, and I can't see where those come from — and if it's a real diagnosis it should predict something, so is there a test here or just a redescription? Third, Freud seems a lot softer on all this than my friend is: I'm pretty sure he insists an illusion isn't the same as an error and needn't be false — his example is something like a girl who's convinced a prince will marry her, unlikely but not impossible — and he keeps illusion and delusion apart. If that's right, my friend has borrowed the diagnosis and quietly dropped the hedging, which is the most interesting thing in the whole area to me.

  Also tell me whether this is one analogy or three glued together (where the belief came from, what form it takes, why you want it) and whether they even point the same direction. And if the projection picture is the wrong tool for what he's after, what comparison should he be using instead, and what would that one license? No reading list please, I'm not citing anyone, I just want the argument audited.
