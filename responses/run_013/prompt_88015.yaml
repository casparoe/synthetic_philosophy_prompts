prompt: |-
  I am writing a critique of futarchy -- the proposal that a polity vote on the ends it wants pursued and then use prediction markets to select the means -- and I want to pin down the philosophical commitments the proposal cannot do without.

  Take a concrete version. Voters first choose, by ordinary majority vote, one of three candidate indices of national welfare (say GDP per capita, mean life satisfaction, or a composite of the two). Thereafter, every policy question opens two conditional markets: one on the index level that would obtain if policy A were adopted, one on the level if policy B were; the policy with the higher market estimate is implemented, and the contracts settle when the official statistics are published.

  Three features of that design puzzle me. The index must be fixed before anyone knows which policies will arise, so goods that matter but are not indexed cannot be traded off inside the market. The traders are also the people the policy will affect, so their bets are not disinterested estimates. And a contract on the index under A can be settled only in the world where A is adopted, so its price depends on the probability that A is adopted, which in turn depends on the price -- the market does not straightforwardly isolate the counterfactual that the decision rule needs.

  Reconstruct the theory of value and of collective decision this practice presupposes: what it assumes about the measurability and interpersonal comparability of welfare, about the separability of values from beliefs, and about whether prices can carry belief when the traders are interested parties. Separate what the practice strictly requires from what it merely fits comfortably with, and say where it is underdetermined -- which rival theories of value would license the same machinery. Then say what would have to change if the presupposed view were replaced by a frankly pluralist or deontological one.

  Open with a single sentence stating the central presupposition; everything after should defend it. No more than 700 words.
reasoning: |-
  Okay, the user wants a critique of futarchy focusing on its philosophical commitments. Let me start by understanding the concrete example they provided. Voters choose a national welfare index (GDP, life satisfaction, or a composite) via majority vote. Then, prediction markets for each policy option estimate the index level, and the policy with the higher estimate is implemented. 

  The user points out three issues: the index is fixed early, excluding unindexed goods; traders are affected by policies, so they're not disinterested; and the market prices depend on the adoption probability, creating a circularity. The task is to reconstruct the theory of value and collective decision behind futarchy, addressing measurability, interpersonal comparability, separability of values from beliefs, and whether prices can reflect beliefs when traders are interested. Also, need to separate strict requirements from comfortable fits, identify underdetermined areas, and discuss how pluralist or deontological views would change things.

  The central presupposition needs to be stated in one sentence. The key here is that futarchy assumes welfare can be aggregated into a single cardinal, interpersonally comparable index. That makes sense because the whole mechanism relies on comparing market estimates of this index across policies. 

  Now, defending this. The index must be fixed early, which requires that all relevant values are measurable and commensurable beforehand. The market mechanism needs a single metric to function. Without that, the comparison between policies isn't possible. The critique about excluded goods ties into this—values not captured by the index can't be traded off, so the index must be comprehensive.

  Interpersonal comparability is crucial because the index aggregates welfare across individuals. If welfare isn't comparable, the index doesn't make sense as a societal goal. The majority vote on the index implies that voters can collectively decide on a common measure, assuming comparability.

  Separating values from beliefs is another point. Futarchy splits ends (voted values) from means (market beliefs). But if values are plural and incommensurable, choosing a single index oversimplifies. Traders' interests affecting prices challenge the belief-value separation because their stakes might bias estimates. The circularity in market prices (depending on adoption probability) complicates isolating counterfactual beliefs. This might require a design fix, but the theory assumes that prices can still reflect true beliefs despite these issues.

  Underdetermined areas: Which index to choose? Utilitarianism would support a preference satisfaction metric, while capability approaches might prefer functionings. But any theory endorsing a single cardinal index could fit. Pluralist or deontological views reject this. For them, futarchy's mechanism would need fundamental changes—like incorporating multiple indices or constraints, but that could make the system unwieldy. 

  The user's deeper need might be to rigorously challenge futarchy's foundations, showing its reliance on contested philosophical assumptions. They might be targeting an academic audience familiar with political theory or economics. Highlighting the inflexibility of the index and the potential biases in prediction markets addresses practical concerns but also philosophical weaknesses. Emphasizing the necessity of cardinal comparability and the challenges from pluralism or deontology strengthens the critique. Need to ensure all parts of the query are covered concisely within the word limit.
answer: |-
  ## The Unitary Metric Presupposition
  **Futarchy fundamentally presupposes that societal welfare is reducible to a single, cardinal, interpersonally comparable metric whose future expected value can be authoritatively estimated by market prices reflecting aggregated beliefs, enabling unambiguous policy selection.** This core commitment shapes its entire machinery and faces critical challenges.

  1.  **Measurability, Cardinality, and Comparability:** The fixed index *requires* welfare to be measurable cardinally (allowing magnitude comparisons like "3 units higher") and interpersonally comparable. The market compares expected *levels* (e.g., "GDP $55k vs $52k"), demanding a scale where such differences are meaningful across individuals. The majority vote on the index assumes voters can collectively choose *which* unitary metric best captures "welfare," implying commensurability – that diverse goods (health, liberty, environment) can be traded off *within* this single index *before* specific policy trade-offs arise. Goods excluded from the chosen index become invisible to the mechanism, as the critique notes; the system *strictly requires* that the chosen index comprehensively captures all normatively relevant outcomes for decision-making.

  2.  **Separability of Values (Ends) from Beliefs (Means):** The design *strictly requires* a sharp separation: voters solely determine the "good" (the index), while traders solely estimate the causal impact of policies *on that pre-defined good*. Beliefs about consequences (means) are isolated from preferences over ends. This assumes traders can form "disinterested" probabilistic beliefs about index outcomes *conditional* on policy adoption, independent of their personal valuation of the index itself or specific policies. The critique highlights the challenge: traders *are* affected parties. Their bets conflate beliefs about consequences with preferences over outcomes (e.g., shorting a policy they dislike but believe will raise GDP) and potential manipulation attempts. This violates the pure "belief aggregation" ideal. The circularity problem (market price depends on adoption probability) further undermines clean counterfactual estimation; the market price reflects a *weighted average* of the conditional index value *and* the perceived chance the policy wins, not purely the counterfactual estimate needed.

  3.  **Price as Authoritative Belief Aggregator:** Futarchy *strictly requires* that prediction market prices, despite trader interests and potential circularity, provide the best available estimate of the expected value of the index under each policy. It presupposes markets effectively aggregate dispersed information and incentivize truthful revelation *even when participants have stakes in the outcome*, overcoming biases or manipulation attempts better than alternatives like deliberation or voting on means. This is a contested empirical and philosophical claim about the epistemology of markets under incentive conflicts.

  **Underdetermination and Rival Theories:**
  The machinery is *underdetermined* regarding *which* specific cardinal, interpersonally comparable welfare theory justifies it. **Rival theories** endorsing this core presupposition include:
  *   **Classical Utilitarianism:** Maximizing aggregate cardinal utility fits perfectly.
  *   **Preference Satisfaction Welfarism:** If preferences are cardinally measurable and comparable, maximizing aggregate satisfaction aligns.
  *   **Capability Approach (Specific Interpretations):** If capabilities/functionings are quantified into a single cardinal index (e.g., HDI-like), it *could* be used, though Sen/Nussbaum resist such aggregation.
  *   **Objective List Theories (with Aggregation):** If objective goods (health, knowledge) are cardinally measurable and comparable into a single index.

  **Pluralism or Deontology: Rejection Requires Radical Change:**
  Frankly pluralist or deontological views **reject the core presupposition**:
  *   **Pluralism:** Holds that fundamental values (liberty, equality, welfare, community) are irreducible and incommensurable. A single index forces false trade-offs *ex ante*. Futarchy's fixed index and winner-take-all market selection cannot accommodate irreducible pluralism. Significant change would require either: 1) Multiple parallel indices with a meta-voting rule (defeating simplicity), or 2) Abandoning markets for ends and using deliberation/voting sensitive to value conflicts – fundamentally altering futarchy's core.
  *   **Deontology:** Prioritizes rights, duties, and constraints that cannot be overridden by welfare maximization. A policy violating rights might maximize the index. Futarchy *strictly requires* that maximizing the chosen index is the *sole* criterion. Accommodating deontology would necessitate: 1) Constitutional constraints *outside* the market mechanism (e.g., rights vetting policies *before* markets open), or 2) Incorporating rights violations as negative components *within* the index (reducing rights to welfare trade-offs, anathema to strict deontology). Either significantly modifies or abandons the pure futarchic logic.

  In essence, futarchy's viability hinges entirely on accepting a controversial philosophical monism about value: that societal welfare is a singular, cardinally measurable, and interpersonally comparable quantity whose maximization, guided by market-beliefs, constitutes legitimate collective choice. Its design problems stem directly from tensions within this presupposition.
