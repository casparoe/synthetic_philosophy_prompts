answer: |-
  ## The Bench and the Bookshelf
  **Dr. Aris Thorne (Retired Physicist):** Thank you both for coming. My problem is truthlikeness: can we say one false theory is *closer* to the truth than another? I’ve heard the arguments collapse or become subjective. Let’s hear you duel. Realist, you first.

  **Realist:** Gladly, Dr. Thorne. The core idea *is* definable. Forget counting consequences; it’s flawed, as you saw. Instead, consider the space of possible ways the world could be – call them "possible worlds." Order these by their resemblance to the *actual* world – how much they differ in their fundamental structure and properties. A theory is closer to the truth the closer the *closest* world it permits is to actuality. Your old ether theory? It required a luminiferous ether permeating space. Maxwell’s equations described its behaviour. Einstein abolished the ether, showing light is electromagnetic waves *in* space, not vibrations *of* a medium. Yet, Maxwell’s equations survived almost unchanged! The ether theory got the *medium* wrong, but its mathematical core accurately described the *structure* of electromagnetic propagation – a structure preserved in the truer theory. The possible world with ether vibrating *just so* closely resembles the actual world in its electromagnetic behaviour, even if the underlying ontology is false. *That’s* truthlikeness.

  **Anti-Realist:** A compelling story, Realist, but it smuggles in the problem. *What fixes the resemblance ordering?* You talk of "fundamental structure and properties," but which properties are fundamental? Is mass more "world-defining" than charge? Is spatial continuity more crucial than causal connectedness? The resemblance metric isn’t found; it’s *chosen* based on what *we* deem significant. The ether case illustrates this. You say its equations captured structural truth. But Anti-Realist sees it differently: the equations were *approximately accurate* within a limited domain (classical electromagnetism), not because the ether theory was "close to truth," but because those equations are a mathematical *limiting case* of the broader, truer quantum electrodynamics framework. The central term "ether" referred to *nothing real*. Its predictive success came from accidentally latching onto useful mathematical relationships, not from describing reality closely. Truthlikeness requires comparing to *the* truth; if resemblance weights are subjective, the ranking is too.

  **Realist:** You dismiss too easily! Consider the "no miracles" argument. If our best theories – like relativity, quantum mechanics, evolution – weren’t at least *approximately true*, capturing significant aspects of reality’s structure, their stunning predictive and explanatory success across vast domains would be a sheer miracle! Continuity in scientific progress, like retaining Maxwell’s equations, isn't *just* mathematical luck; it reflects the old theory grasping *some* objective features correctly, even while embedded in a false ontology. Truthlikeness explains this continuity *as progress towards truth*, not just instrumental success. Saving the phenomena – mere empirical adequacy – isn't enough; Ptolemy saved the phenomena for centuries with epicycles, but Copernicus got closer to the *structure* of the solar system.

  **Anti-Realist:** I concede the success isn't miraculous! But your explanation isn't the only one. Selection pressures on theories favor those that are instrumentally reliable and conceptually fertile, not necessarily truthlike. Ptolemy's system *was* complex, but its successor wasn't just simpler; it offered a unified framework explaining *more* phenomena coherently. That’s progress in coherence, scope, and problem-solving ability – progress we can define *without* invoking problematic "distance to truth." Your resemblance metric is doing the heavy lifting *and* hiding the subjectivity. Suppose we have two false theories about particle physics. Theory A scores high on resemblance in mass-energy properties but low in spin properties. Theory B is the reverse. Which is closer to truth? It depends entirely on the relative *weight* we assign to mass-energy resemblance versus spin resemblance in our metric. Nothing in the *world* dictates those weights; it's a choice reflecting our interests or the problems we prioritize. Truthlikeness, defined this way, presupposes the very judgments of importance it was meant to ground objectively.

  **Realist:** But the weights aren't arbitrary! They are constrained by the web of dependencies in the actual world. Mass-energy *is* fundamentally intertwined with spacetime curvature in ways spin isn't – that's a feature of general relativity, a highly successful theory! The structure of reality itself suggests natural priorities. While the metric might not be uniquely fixed to infinite precision, plausible constraints based on the interconnectedness of properties revealed by our best science can yield robust, non-arbitrary comparisons for many cases. The ether theory captured the *propagation structure*; that structure proved fundamental, hence the high resemblance weight. Its false ontology had low weight because it proved *dispensable*.

  **Anti-Realist:** "Dispensable" according to *later* theory! You're using the *current* best theory – itself possibly false! – to retrospectively judge the resemblance weights for the old theory. That’s circular if truthlikeness is meant to explain progress *towards* our current theories. And "interconnectedness" is judged by... our current theory again! What if two different, equally successful future theories suggest *contradictory* resemblance weightings for past theories? Nothing adjudicates that except pragmatic success, not truthlikeness. The ether's ontology wasn't just "low weight"; on a resemblance metric prioritizing referential success (did its core terms pick out real entities?), it scores *abysmally*, dragging its truthlikeness down near zero, despite the equations. On a purely structural metric ignoring ontology, it scores higher. Which metric is "right"? Both are coherent, but the world doesn't tell us.

  **Realist:** It tells us through the *persistence* of the structure! The equations survived ontology shifts precisely because they latched onto something real and stable. That persistence *is* evidence of objective structural resemblance. We don't need perfect, unique metrics to have meaningful, objective gradations. We judge historical cases like Newton vs. Aristotle on motion similarly – Newton is closer because his laws better match the actual structure of inertia and force, even if superseded by relativity. The resemblance isn't invented; it's discovered in the world's behaviour.

  **Anti-Realist:** I concede Newtonian mechanics is a vastly better *tool* than Aristotelian for most terrestrial mechanics. But "closer to truth"? Newtonian mass isn't relativistic mass or invariant mass; Newtonian absolute space and time aren't spacetime. The *concepts* are radically different. The equations work well *approximately* under specific conditions. That's instrumental success and domain applicability – valuable, definable progress – not proof of increasing truthlikeness. The central problem remains: any resemblance metric requires prioritizing some world-features over others, and nothing guarantees that prioritization maps onto an objective "closeness to *the* truth" rather than reflecting our own evolving scientific or pragmatic criteria.

  **Dr. Thorne:** Enough! What, precisely, remains unsettled between you?

  **Realist:** Whether the space of possible ways the world could be possesses an *objective similarity structure* – a natural ordering of resemblance to actuality – that is sufficiently rich and unique to ground non-arbitrary comparisons of truthlikeness between false theories, independent of our current scientific interests or the utility of their consequences.

  **Anti-Realist:** Exactly. And crucially, whether such a structure, even if it existed, could be specified *without* presupposing the very judgments about what aspects of the world are fundamentally important that the truthlikeness ranking is supposed to objectively justify. The deciding fact would be if we could discover, through means *other* than the success of our current theories, a principled, non-circular way to fix the weights in the resemblance metric that all rational agents *must* accept as capturing "closeness to truth." I see no such way.

  **Realist:** And I believe the persistent, interconnected structure revealed by the long-term success of science *is* that discovery. The burden is to show why this structure isn't objective.

  *(They turn to Dr. Thorne, the argument unresolved, the core disagreement sharpened.)*
