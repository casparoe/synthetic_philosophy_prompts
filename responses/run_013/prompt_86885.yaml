  Below is a decision tree designed to dissolve the two-box dichotomy by mapping the logical space of positions on motion, starting from the shared commitment that the water's concavity in Newton's bucket indicates a fact about rotation. The tree branches at genuine fault lines—questions answerable without prior knowledge of labels—and forces engagement with the third question (about primitive identities) for substantivalists. Nodes are minimal and precise, with unoccupied combinations diagnosed and indistinct leaves acknowledged.

  ### Decision Tree
  1. **Q0: Is the fact about rotation (e.g., bucket's concavity) fundamental?**  
     - **No → Deflationary view** (e.g., verbal dispute or no fundamental fact).  
     - **Yes → Proceed to Q1**.

  2. **Q1: Is the fact about rotation fixed solely by relative motions of material bodies?**  
     - **Yes → Relationism → Proceed to Q1a**.  
     - **No → Substantivalism (broad) → Proceed to Q2**.

  3. **Q1a (Relationism only): Are inertial effects determined by the global mass distribution?**  
     - **Yes → Machian relationism**.  
     - **No → Leibnizian relationism**.

  4. **Q2 (Substantivalism only): Is the "something beyond" bodies a thing (entity) or a constraint (from dynamical laws)?**  
     - **Thing → Proceed to Q3**.  
     - **Constraint → Dynamical/structuralist view**.

  5. **Q3 (Thing only): Do spacetime points have primitive identities?**  
     - **Yes → Ordinary Newtonian substantivalism**.  
     - **No → Proceed to Q4**.

  6. **Q4 (Thing, no primitive identities): Are material bodies identical to spacetime regions?**  
     - **Yes → Supersubstantivalism**.  
     - **No → Anti-haecceity substantivalism**.

  ---

  ### Leaves (Positions)
  1. **Deflationary view**  
     - *Most awkward commitment*: The bucket's concavity is evidence for no fundamental fact about rotation (e.g., it reduces to pragmatics or non-fundamental relations).  
     - *Distinguishing case (vs. Leibnizian)*: In a universe with **two globes joined by a cord**, deflationism denies any fundamental fact about rotation (tension is just relative motion), while Leibnizian relationism asserts a fact fixed by relative motion.

  2. **Leibnizian relationism**  
     - *Most awkward commitment*: Rotation facts are fixed by relative motions of bodies alone, so inertial effects (e.g., cord tension) require no global mass dependence.  
     - *Distinguishing case (vs. Machian)*: In a universe with **only a rigid ring**, Leibnizianism denies rotation is possible (no relative motion between parts), while Machianism allows it if the ring's mass distribution determines inertia.

  3. **Machian relationism**  
     - *Most awkward commitment*: Inertial effects (e.g., bucket's concavity) are caused by motion relative to the universe's total mass distribution.  
     - *Distinguishing case (vs. substantivalism)*: In a **single body rotating in an empty universe**, Machianism denies rotation is possible (no masses to define inertia), while all substantivalisms allow it.

  4. **Dynamical/structuralist view**  
     - *Most awkward commitment*: Inertial structure (explaining the bucket) is real but not an entity—it is a constraint from dynamical laws, not spacetime.  
     - *Distinguishing case (vs. anti-haecceity substantivalism)*: In a **single body rotating in an empty universe**, structuralism asserts a fact due to law constraints, while anti-haecceity substantivalism asserts it via spacetime structure.  
     - *Indistinct from anti-haecceity substantivalism?* Yes. Both agree on structures (e.g., no primitive identities, same predictions), differing only metaphysically: structuralism rejects spacetime as an entity, anti-haecceity accepts it. No physical test separates them.

  5. **Ordinary Newtonian substantivalism**  
     - *Most awkward commitment*: Spacetime points have primitive identities, so permuted (but isomorphic) worlds are distinct.  
     - *Distinguishing case (vs. anti-haecceity)*: In a **"shuffled twin" universe** (identical relational facts, points permuted), Newtonian substantivalism counts it as distinct, while anti-haecceity does not.

  6. **Anti-haecceity substantivalism**  
     - *Most awkward commitment*: Spacetime is real but points lack primitive identities, so structure alone is physical (diffeomorphic worlds are identical).  
     - *Distinguishing case (vs. supersubstantivalism)*: In a universe with **multiple interacting bodies**, anti-haecceity treats bodies as distinct from spacetime regions, while supersubstantivalism identifies them.

  7. **Supersubstantivalism**  
     - *Most awkward commitment*: Material bodies (e.g., water molecules) are identical to spacetime regions, with no separate ontology.  
     - *Distinguishing case (vs. anti-haecceity)*: In a **rotating rigid ring**, supersubstantivalism reduces the ring's rotation to spacetime geometry, while anti-haecceity preserves bodies as distinct occupants.

  ---

  ### Unoccupied Combinations & Diagnoses
  - **Q1=No (substantivalism) + Q2=Constraint (structuralism) + Q4=Yes (supersubstantivalism)**: Unoccupied. Incoherent—supersubstantivalism requires spacetime as an entity (thing), but structuralism denies entities.  
  - **Q1=Yes (relationism) + Q2=Thing**: Unoccupied. Unattractive—relationism explicitly rejects anything beyond bodies, so positing an entity contradicts core commitment.  
  - **Q1=Yes (relationism) + Q2=Constraint**: Unoccupied. Unexplored—no major position combines relationism with non-entity structures; relationists typically avoid extra structure.  

  ### Notes
  - **Key third question**: Q3/Q4 force engagement with primitive identities, preventing substantivalists from hiding behind labels.  
  - **Minimal cases**: The bucket (shared start), two globes (distinguishes deflationary/Leibnizian), single body (distinguishes Machian/substantivalisms), rigid ring (distinguishes Leibnizian/Machian), shuffled twin (distinguishes substantivalisms).  
  - **Slogans avoided**: Nodes target commitments (e.g., global mass dependence, primitive identity) not mere labels.  
  - **Branching logic**: Based on truthmakers and metaphysical commitments, not historical factions. Every leaf is a coherent, occupiable position.  

  This tree isolates seven paths from one shared empirical fact, revealing nuances obscured by the two-box trap. It confirms your insight that primitive identities (Q3/Q4) split substantivalism, while structuralism and anti-haecceity substantivalism are empirically indistinguishable twins.
