prompt: |-
  I am a novelist, and there is a pattern of behavior I can dramatize but cannot name, and I would like to know whether the concept already exists. A character of mine decides she wants a new apartment and, rather than fixing in advance what would count as good enough, sets her bar by surveying what is on offer: the first few listings establish a range, and her standard settles just under the best she has seen. She then rents something that a friend with a lower, self-imposed bar would have been delighted by, and she feels precisely as satisfied as the friend does. When the market is bad she is just as content; when it is good she is just as hard to please, so the actual quality of her surroundings barely registers in her happiness. I have versions of this in a subplot about choosing a spouse and another about choosing which of two finished drafts to send out. The odd part is that she is neither settling from exhaustion nor deceiving herself about what she wants; her standard simply tracks the best thing in front of her, so it can never perform the filtering work a standard is supposed to perform.

  Is there a name for this? It is close to satisficing, but my understanding is that satisficing turns on a threshold that does real filtering and, when it moves, moves gradually in response to experience, whereas here the threshold is read directly off the current option set and shifts at once. It is also close to what I have heard called adaptive preferences, but those seem to concern people lowering their sights under deprivation, and my character's contentment is not confined to bad circumstances. If there is no established term, please coin one and define it; either way, say precisely where the described thing sits relative to satisficing, to adaptive preferences, and to whatever nearby concept you think fits best, including what it is not. Tell me how confident you are in your answer and single out the one point you are least sure about. Write in American English.
reasoning: |-
  Okay, the user is a novelist who's created a character with a specific behavioral pattern. The character sets her standards based entirely on the current options available, rather than having fixed criteria. For example, when apartment hunting, she looks at a few listings, sets her bar just below the best one she's seen, and then chooses something that meets this shifting standard. She's genuinely content with her choice, regardless of whether the market is good or bad. The user mentions similar patterns in choosing a spouse and selecting drafts to send out.

  The user wants to know if there's an existing term for this behavior. They've considered "satisficing" and "adaptive preferences" but feel those don't quite fit. Satisficing involves a threshold that filters options and changes gradually, while their character's standard shifts instantly based on the current options. Adaptive preferences typically involve lowering standards due to deprivation, but the character is content in both good and bad markets.

  First, I need to recall relevant psychological or economic concepts. Satisficing, from Herbert Simon, is about setting a threshold and accepting the first option that meets it. The character here doesn't have a fixed threshold; it changes with the options. So that's different. Adaptive preferences, like in Elster's sour grapes, involve changing desires to cope with lack, which also doesn't fit since the character isn't deprived.

  Then there's reference-dependent preferences in Prospect Theory. People evaluate options based on a reference point, which can shift. The character's best-seen option acts as that reference. But usually, that reference is stable or based on status quo, whereas here it's dynamic, changing with each set of options. The immediacy of the shift is key—no gradual adjustment.

  Another angle is the anchoring effect in behavioral economics. The first piece of info (like a listing price) anchors subsequent judgments. The character uses the best option as an anchor, setting her standard just below it. That seems close. But anchoring is often about numerical estimates; here it's about satisfaction standards. So maybe anchoring plus reference dependence combined.

  The user might need a term that captures this instant adjustment without self-deception. Since existing terms don't fit perfectly, coining a new one makes sense. "Dynamic Anchoring" or "Context-Dependent Satisficing" could work. I'm leaning toward "Dynamic Anchoring" because it emphasizes the immediate shift based on the current context.

  Confidence-wise, I'm about 85% sure. The least certain part is whether "anchoring" fully applies since it's typically about initial exposures influencing estimates, but here it's about the best option setting the standard each time. The user might also have deeper needs: understanding the concept for accurate portrayal, avoiding misclassification, and enriching their narrative with psychological depth. They might want to highlight the character's lack of fixed desires, which contrasts with typical goal-driven characters, adding uniqueness to their story.
answer: |-
  Based on your detailed description, **this pattern does not have a single, universally established name in psychology or behavioral economics.** However, it aligns strongly with a combination of well-documented concepts, primarily **Reference Dependence** (from Prospect Theory) combined with a specific type of **Anchoring**, and differs significantly from both satisficing and adaptive preferences as you correctly identified.

  Here's the breakdown:

  1.  **Best Fit & Proposed Term:** The core mechanism is **Reference Dependence with Dynamic Anchoring**.
      *   **Reference Dependence (Kahneman & Tversky's Prospect Theory):** This describes how people evaluate outcomes not in absolute terms, but *relative to a reference point*. Your character's "best seen" option *is* her constantly shifting reference point. Her satisfaction ("gain" or "loss") is determined solely by how the chosen option compares *to this reference*, not to any absolute standard.
      *   **Dynamic Anchoring (Anchoring Effect):** Anchoring is the cognitive bias where individuals rely too heavily on an initial piece of information (the "anchor") when making decisions. Here, the "best seen" option in the *current* set acts as a powerful and **immediately updated anchor** for her standard. It's not a fixed anchor from the start of the search; it dynamically resets as the set of options changes. The "just under the best" rule is the specific application of this anchor.
      *   **Proposed Term:** **Context-Dependent Satisficing** or **Dynamic Anchored Satisficing**. (You could also simply call it **Adaptive Reference Dependence**). However, the most precise descriptive term is **Dynamic Anchoring to the Local Optimum**.
      *   **Definition:** **Dynamic Anchoring to the Local Optimum** is a decision-making heuristic where an individual's satisfaction threshold for a choice is set *relative to the best available option encountered within the immediate, current set of alternatives*. This anchor shifts instantly and completely with changes in the option set, rendering satisfaction independent of absolute quality and dependent solely on proximity to the perceived local maximum within the presented context.

  2.  **Relation to Nearby Concepts:**
      *   **Satisficing (Herbert Simon):**
          *   **Similarity:** Both involve searching until a "good enough" option is found, avoiding exhaustive optimization.
          *   **Key Difference:** Satisficing relies on a **pre-defined or gradually evolving aspiration level** that acts as a *filter*. Your character has **no stable aspiration level**. Her "good enough" is defined *by the current set itself* and shifts instantly. Satisficing thresholds have inertia; hers has none. Her standard doesn't filter the search effectively; it's defined *by* the search results.
      *   **Adaptive Preferences (Jon Elster, Amartya Sen):**
          *   **Similarity:** Preferences/standards change based on circumstances.
          *   **Key Difference:** Adaptive preferences typically involve **lowering standards in response to persistent constraint or deprivation** (e.g., "sour grapes" - deciding you never wanted what you can't have). Your character's adaptation is **instantaneous, symmetric, and context-dependent, not deprivation-driven**. Her standards rise *just as easily* in a good market as they fall in a bad one. There's no element of resignation or cognitive dissonance; the adjustment is mechanistic and complete, leading to genuine contentment in *any* context relative to its local optimum.
      *   **Reference Dependence (Prospect Theory):**
          *   **Strongest Fit:** This is the core psychological mechanism. Her reference point (the best seen) is what her choice is evaluated against.
          *   **Nuance:** Prospect Theory often assumes the reference point is the status quo or a neutral point. Here, the reference point is *explicitly defined as the best option in the current set*, making it highly dynamic and context-specific. The "just under" rule is a specific valuation function relative to that reference.
      *   **Anchoring (Cognitive Bias):**
          *   **Strong Fit:** The "best seen" acts as the anchor for defining "good enough." The key is the anchor's **volatility** – it's not stuck from the initial exposure but resets completely with each new assessment of the option set.
      *   **Relative Deprivation/Relative Gratification:**
          *   **Similarity:** Feelings are relative to what others have or what is available.
          *   **Key Difference:** These concepts usually involve social comparison (others) or fixed expectations. Your character compares only to the *best option within her immediate, personal choice set*, not to others' situations or a fixed ideal.

  3.  **Confidence & Uncertainty:**
      *   **Confidence:** I am **85% confident** that the core mechanism is **Reference Dependence with Dynamic Anchoring** and that no single perfect term exists. This pattern is a recognizable *variant* or *specific application* of these established biases.
      *   **Point of Least Certainty:** The aspect I'm least sure about is whether there's a *very specific* term used in niche decision theory literature precisely for this "setting the aspiration level equal to the best current option minus epsilon" heuristic within a satisficing-like search framework. While the components are clear, the exact combination might not have its own dedicated name outside of descriptive phrases like the ones proposed. Literature on "search heuristics" or "aspiration level adaptation" might touch on it, but likely not with your character's specific instantaneity and lack of inertia.

  **In Summary for Your Novel:**

  Your character exhibits **Dynamic Anchoring to the Local Optimum**. Her standard isn't fixed; it's a **floating benchmark** set by the best option immediately available in her current context. This makes her satisfaction **perfectly relative and context-bound**, independent of absolute quality. It's distinct from:
  *   **Satisficing:** Her aspiration level isn't pre-set or stable; it *is* the context.
  *   **Adaptive Preferences:** She's not lowering sights due to deprivation; she's calibrating instantly to *any* context's peak.
  *   **Simple Anchoring:** The anchor shifts completely with the option set, it's not sticky.

  This creates a fascinating psychological portrait: someone whose desires and satisfactions are entirely shaped by the immediate environment, lacking internal fixed goals but achieving consistent contentment by perpetually aiming just below the current horizon. It's a powerful mechanism to explore themes of relativity, contentment, and the nature of desire itself.
