prompt: |-
  I moved across the world for work about four months ago — new country, smallish city — and most of my energy has gone into figuring out the local rules, and the thing that keeps triping me up is that the rules don't hang together. A handful of things here are absolutely rigid. You do not show up late to a family thing. You do not wear the wrong thing to a religious event. You do not eat certain things in front of certain people. Get any of that wrong and it's not a scolding, you're just quietly out — enforced hard, by everyone watching everyone, no officials involved. But in the very same place, traffic is a free-for-all, queues are suggestions, half the permits get "sorted out" with a phone call, and nobody seems to care at all. My old city was the mirror image: nobody gave a damn what you wore, but everything was written down and enforced by forms and inspectors.

  I keep hearing the phrase "tight cultures" and "loose cultures," and I get the gist, but it seems to want to sort a whole place into one bucket, whereas what I'm looking at is a place that's both at once, just about different things. Some domains are sacred and rigid, others are totally negotiable, and the rigid ones don't seem to be the important ones in any obvious sense — they're just the ones that got marked.

  Is there a name for this? And I don't mean I just want a label — I want to know how what I'm describing differs from the tight/loose idea, from whatever the "sacred values" people are talking about, and from honor-culture stuff, and which of those, if any, actually fits. Is "tightness is domain-specific" already a known claim, or am I reinventing something? And is the fact that the rigid norms are enforced informally — by shunning rather than by any authority — a separate axis, or is that part of the same thing?

  Smaller second version, in case it helps: my company is like this too. Career-ending, obsessive rules about how you log your hours and about not sharing certain documents, and then literally everything else is chaos — no dress code, no set hours, no process for anything. Same shape.

  Where I'd like you to be careful: keep what's actually established separate from what's just a plausible-sounding story. If the tight/loose framework is contested, or leans on shaky cross-cultural data, say that instead of presenting it as settled, and don't hand me one researcher's pet theory dressed up as the consensus.
reasoning: |-
  Okay, the user is describing a cultural environment they've encountered after moving to a new country. They're noticing that social norms vary drastically depending on the context—some domains are extremely rigid with severe social consequences for violations, while others are completely lax. They've heard terms like "tight/loose cultures" but feel these frameworks oversimplify by categorizing entire societies. They want to understand what they're observing and how it relates to existing sociological concepts.

  The user is clearly analytical and skeptical—they specifically caution against presenting unsubstantiated theories as fact. They're not just looking for labels but want to understand the mechanisms behind what they're observing. Their workplace example shows this pattern exists at organizational level too, suggesting they're looking for scalable principles.

  Breaking this down: First, the tight/loose model (from Gelfand et al.) does treat cultures as monolithic, which contradicts the user's experience of domain-specific variation. The sacred values theory (Tetlock etc.) explains why some norms become inviolable, but doesn't address why other areas remain flexible. Honor culture explanations focus on reputation-based enforcement, which matches their observation of informal shunning, but typically applies to whole societies.

  What they're describing aligns best with role theory—different contexts (family vs. bureaucracy) activate different rule sets. Also relevant is institutional analysis: norms may be strict where social cohesion matters (family/religion) but lax where state institutions are weak (traffic/permits). The informal enforcement mechanism suggests this is about in-group policing versus out-group interactions.

  Important to emphasize that academic consensus doesn't fully explain this configuration. While domain-specificity is acknowledged in sociology (e.g., Goffman's frame analysis), no dominant framework integrates all aspects the user observes. Should flag that their workplace example implies these patterns can emerge in any rule-making system when certain domains become symbolically important.
answer: |-
  You're hitting on a fundamental complexity that many cultural frameworks oversimplify. What you're describing isn't neatly captured by "tight/loose" or "sacred values" alone, and the *informal enforcement mechanism* is indeed a critical, distinct element. Here's a breakdown of how your observations differ from common models, what fits, and where the gaps are:

  1.  **"Tight/Loose" Cultures (Gelfand et al.):**
      *   **The Claim:** Cultures vary on a spectrum of "tightness" (strong norms, low tolerance for deviance) vs. "looseness" (weaker norms, higher tolerance for deviance). This is often presented as a national-level trait.
      *   **Where it Fits:** It acknowledges that norm strength and enforcement vary.
      *   **Where it Falls Short (For You):**
          *   **Domain-Specificity Ignored:** It treats "tightness" as a monolithic characteristic. Your experience shows it's **highly contextual** – tight in social/religious domains, loose in bureaucratic/public domains. This domain-specific variation isn't the core focus of the framework.
          *   **Enforcement Mechanism:** It doesn't explicitly differentiate *how* norms are enforced (formal vs. informal). Your "sacred" domains rely purely on *informal social sanctioning* (shunning), not formal rules.
          *   **The Data:** Cross-national survey data underpins it, but critics argue it can mask significant internal variation (like you see) and relies on self-reporting which has limitations. It's influential but **not uncontested** as a complete explanation.

  2.  **Sacred Values (Tetlock, Atran, etc.):**
      *   **The Claim:** Certain values become "sacred" – non-negotiable, immune to cost-benefit analysis, and protected by moral outrage. Violations trigger strong reactions.
      *   **Where it Fits:** This perfectly explains the *nature* of the rigid norms you see (family punctuality, religious dress, dietary taboos). Their absolute rigidity and severe social consequences align with the "sacred" concept. The fact that they feel "marked" rather than "important" in a utilitarian sense is characteristic – sacredness often stems from tradition, identity, or perceived purity, not functional logic.
      *   **Where it Falls Short:**
          *   **Scope:** It explains *why specific norms* are rigid but doesn't inherently explain why *other domains* (traffic, permits, queues) are loose. It focuses on the "sacred" end, not the variation across domains or the *laxity* elsewhere.
          *   **Enforcement:** It emphasizes the *reaction* to violation (moral outrage, shunning) which matches your description, but doesn't contrast it explicitly with formal enforcement mechanisms.

  3.  **Honor Cultures (Nisbett, Cohen, etc.):**
      *   **The Claim:** Cultures where personal reputation, social standing, and perceived strength are paramount. Norms focus on protecting honor, responding to insults, and maintaining face, often enforced through vigilance and social sanction.
      *   **Where it Fits:** The **informal enforcement mechanism** – "everyone watching everyone," shunning as the penalty – is classic honor culture dynamics. Reputation and social standing are the currency.
      *   **Where it Falls Short:**
          *   **Domain-Specificity:** Traditional honor culture descriptions often imply a broader societal pattern affecting many interactions (disputes, business, family). Your experience shows this enforcement style is *specifically tied to certain domains* (social/religious) but not others (bureaucratic/public).
          *   **Content:** Honor cultures often focus on aggression/defense, masculinity, and retaliation. Your "sacred" domains seem more about piety, respect for tradition/hierarchy, and purity – which might overlap but aren't identical.

  **Synthesizing Your Observations & Finding Frameworks:**

  1.  **Domain-Specific Norm Strength & Enforcement:** This is your core insight. Key concepts that help explain this:
      *   **Institutional Logics (Thornton, Ocasio et al.):** Societies contain multiple, sometimes competing, institutional orders (e.g., Family, Religion, State, Market). Each has its own dominant logic, rules, and enforcement mechanisms. What looks inconsistent is often behavior conforming to the logic of the *specific institutional domain* you're operating in (strict family/religious logic vs. weak state/bureaucratic logic).
      *   **Role Theory:** Individuals occupy multiple roles (parent, employee, citizen, believer). Norms governing behavior are tied to the specific *role* and *context* you are in at that moment. The expectations are domain/role-bound.
      *   **Functional vs. Symbolic Domains:** Some domains (like family rituals, religious observance) are primarily about **symbolic coherence, identity reinforcement, and group boundary maintenance.** Rigidity here signals belonging and maintains the group's distinct identity. Other domains (like traffic, permits) might be seen as more **instrumental/practical.** If the state is weak or corrupt, or individualism is high in public spaces, the lack of formal/informal enforcement leads to laxity. The "sacred" domains aren't about functional importance but about **symbolic significance** to group identity.

  2.  **Informal Social Sanctioning:** This is a crucial, separate axis.
      *   **Mechanism:** You're describing **diffuse social sanctioning** or **informal social control.** Enforcement comes from the community/network itself through gossip, reputation damage, withdrawal of cooperation, and shunning – not centralized authority.
      *   **Connection to Domain:** This mechanism is *particularly effective and common* in domains tied to **strong group identity, kinship, or shared belief systems** (family, religion, tight-knit communities, potentially your company subculture). It relies on dense social networks where reputation matters deeply. It's less effective in anonymous public spaces (like traffic) unless a strong civic culture exists.

  **Does a Perfect Label Exist?**

  *   **"Domain-specific institutional logics with diffuse sanctioning in identity-salient spheres"** is clunky but accurate.
  *   **"Contextually tight-loose culture with honor-style enforcement in primary groups"** captures elements but isn't standard.
  *   **"A culture with strong, informally enforced sacred values in social/religious domains coexisting with weak formal institutions in public/bureaucratic domains"** is descriptive.

  **Conclusion & Caveats:**

  1.  **You're Not Reinventing, But Observing Nuance:** The tight/loose framework *does* acknowledge internal variation, but its primary presentation is at the national level. Your experience highlights the **critical importance of domain-specificity**, which is well-understood in sociology/anthropology (institutional theory, role theory) but less prominent in popular cross-cultural psychology models like tight/loose.
  2.  **Sacred Values Fit the Rigid Norms:** The rigid norms you describe fit the "sacred values" concept well in their nature and the severe *informal* consequences.
  3.  **Honor Culture Fits the Enforcement Mechanism:** The "everyone watching everyone," shunning-based enforcement is characteristic of social control in groups where honor/reputation is paramount (common in kinship/religious groups).
  4.  **The Informal Enforcement is a Separate (but Connected) Axis:** *How* norms are enforced (formal vs. informal/diffuse) is distinct from *how strong* they are or *what* they regulate. However, informal enforcement is *particularly characteristic* of norms within cohesive identity groups (families, religious communities, tight-knit companies).
  5.  **No Single Framework is Perfect:** Your description requires combining insights:
      *   **Sacred Values** explain the *nature* of the rigid norms.
      *   **Domain-Specificity** (from institutional/role theory) explains *where* tightness/looseness applies.
      *   **Diffuse Social Sanctioning** explains *how* the rigid norms are enforced.
      *   **Weak Formal Institutions/Practical Instrumentalism** might explain the laxity in other domains.
  6.  **Established vs. Speculative:** The existence of domain-specific norms and informal social control are well-established. Combining them precisely to explain *your specific configuration* is an application of these concepts, not necessarily a single named theory. The tight/loose framework *is* empirically based but has limitations regarding internal variation. Sacred values theory is robust within social psychology. Honor culture research is strong but often focused on specific conflict dynamics.

  **Your company example confirms this isn't just national culture:** Organizations develop their own micro-cultures. The obsessive rules likely govern domains symbolically linked to liability, security, or core identity ("we are compliant/professional"), enforced internally (reputation/career risk), while chaos reigns in domains seen as less core ("we are flexible/entrepreneurial").

  You've astutely identified a complex interplay of factors that simplistic frameworks struggle to capture. The key takeaway is: **Cultural norms and their enforcement are not monolithic; they vary dramatically by social domain and are often upheld by the community itself rather than formal authorities, especially within groups central to identity.**
