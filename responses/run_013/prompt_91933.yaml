answer: |-
  ## Requirements for Commensurability Theories

  1.  **Lexical Threshold Constraint (Non-negotiable for Lexical-Threshold NU):** The theory must incorporate a point beyond which a disvaluable state (suffering) becomes lexically prior to any amount of valuable state (pleasure). No finite quantity of pleasure, however distributed, can compensate for or outweigh suffering once it surpasses this threshold intensity or aggregate burden. *Motivation:* This is the core commitment of the defended view. It rejects the fundamental commensurability assumed by aggregative theories, asserting an absolute moral prohibition against allowing suffering beyond the threshold for the sake of pleasure gains. Failure means abandoning lexical-threshold NU.

  2.  **Intensity-Duration Distinction (Non-negotiable):** The theory must treat the intensity of an experience and its duration as distinct, co-determining factors of its overall (dis)value, not reducible to a single metric like "hedon-seconds." *Motivation:* Phenomenologically, extreme pain for a short time is categorically different from mild discomfort for a long time, even if their "area under the curve" might be equal. A theory collapsing this distinction cannot adequately capture why brief, excruciating torture is uniquely horrific, nor explain the intuitive difference between a life of chronic low-grade misery and one containing a single, devastating trauma.

  3.  **Moment/Life Separation Constraint (Artifact of Lexical-Threshold NU Camp):** The theory must allow the lexical threshold to apply primarily to *moments* or *episodes* of experience, not solely to whole-life aggregates. The badness of a threshold-exceeding moment cannot be fully "cancelled out" by sufficient pleasure elsewhere in the life. *Motivation:* This prevents the counterintuitive implication that a life containing moments of unbearable agony could be deemed "good overall" or compensable if surrounded by enough ecstasy. It preserves the moral significance of the *immediate experiential reality* of extreme suffering within a life.

  4.  **Transitivity of Betterness (Non-negotiable):** If outcome A is better than B, and B is better than C, then A must be better than C. *Motivation:* This is a fundamental axiom of rational choice and preference coherence. Violating transitivity leads to cyclic preferences ("money pumps"), making consistent action guidance and rational deliberation impossible. Any viable normative theory must satisfy this to avoid internal inconsistency.

  5.  **Continuity (Negotiable - often rejected by Lexical-Threshold NU):** For any three outcomes A, B, C where A is better than B and B is better than C, there exists some probability `p` (0 < p < 1) such that the prospect [pA, (1-p)C] is equally good as B for sure. *Motivation:* In standard decision theory, continuity ensures that all goods/bads can be traded off probabilistically, enabling the application of expected utility maximization under uncertainty. It underpins the Archimedean property where no good/bad is infinitely more (dis)valuable than others.

  6.  **Action-Guidance Under Empirical Uncertainty (Non-negotiable for Practical Ethics):** The theory must provide a determinate (or probabilistically maximizable) criterion for choosing between actions when the outcomes (especially the presence, intensity, duration, or distribution of pleasure/pain, and crucially, whether thresholds are crossed) are not known with certainty. *Motivation:* Ethics must guide action in the real world, characterized by pervasive uncertainty. A theory that only delivers verdicts under perfect information is practically inert and fails a core function of moral philosophy.

  7.  **Non-Perversity Constraint (Widely Non-negotiable):** The theory must not imply that reducing suffering below the threshold in one instance can be morally outweighed by a sufficiently large *increase* in suffering elsewhere, provided the latter remains *below* the threshold. Similarly, it must not imply that creating vast amounts of pleasure justifies creating small amounts of suffering below the threshold *if* avoiding that suffering were possible without sacrificing the pleasure. *Motivation:* Avoids counterintuitive endorsements of "efficient" suffering distribution or "net pleasure" justifications for causing unnecessary harm, preserving basic intuitions against causing harm for benefit when harm is avoidable.

  8.  **Asymmetry Recognition (Artifact of NU-leaning commitments):** The theory must reflect the plausible asymmetry that the badness of pain is not merely the mirror image of the goodness of pleasure. Pain demands urgent relief in a way pleasure does not demand creation, and the prevention of extreme pain seems categorically more urgent than the provision of extreme pleasure. *Motivation:* Captures the phenomenological and moral intuition that suffering has a distinctive, demanding negative weight that pleasure lacks positively, providing a rationale for prioritizing suffering reduction beyond mere quantitative weighting.

  ---

  ## Fault Lines

  The core tension lies between **Lexical Threshold** (especially applied at the **Moment/Life** level) and the standard decision-theoretic axioms of **Continuity** and **Transitivity**.

  1.  **Lexical Threshold vs. Continuity:** This is the starkest conflict. Lexical priority *by definition* violates Continuity. There exists no probability `p` such that a gamble offering a chance `p` of an outcome with suffering *below* the threshold and chance `(1-p)` of suffering *above* the threshold is equal in value to a sure outcome with suffering *just below* the threshold. The infinite disvalue of the threshold-crossing outcome dominates. *Resolution Costs:*
      *   *Sacrificing Continuity:* Accepts that some values are incommensurable in a way that blocks probabilistic trade-offs. This complicates expected utility calculations under uncertainty, potentially requiring satisficing rules, maximin, or complex multi-dimensional decision frameworks near the threshold. It surrenders a key tool of standard rational choice theory.
      *   *Sacrificing Lexical Threshold:* Preserves Continuity and standard decision theory but abandons the core tenet of absolute priority for extreme suffering, allowing compensation in principle (even if practically improbable).

  2.  **Lexical Threshold (Life-Level) vs. Transitivity:** Applying the lexical threshold *only* to whole-life aggregates risks intransitivity. Consider: Life A has moderate constant suffering (below threshold). Life B has slightly less constant suffering but includes one brief, excruciating threshold-exceeding moment. Life C has higher constant suffering than A, but crucially, *no* threshold-exceeding moment. Intuitions might suggest: B (with the horrific moment) is worse than A. A (moderate suffering) is worse than C (higher but bearable suffering). But is B worse than C? If the threshold applies only to the whole life aggregate, and B's aggregate suffering is less than C's (due to the briefness of the horrific moment), then C > B, creating a cycle: B > A, A > C, C > B. *Resolution Costs:*
      *   *Sacrificing Whole-Life Threshold (enforcing Moment/Life):* Avoids the cycle by grounding the lexical priority in the badness of the *moment* itself, making B lexically worse than both A and C regardless of aggregate sums. This preserves Transitivity but firmly commits the theory to the Moment/Life constraint.
      *   *Sacrificing Transitivity:* Accepts the cycle as a feature, surrendering a bedrock principle of rational choice, leading to significant difficulties in coherently ordering outcomes and guiding action.

  3.  **Action-Guidance vs. Moment-Level Threshold & Uncertainty:** Identifying whether a *specific moment* crosses the elusive lexical threshold under empirical uncertainty is profoundly difficult. Does *this* patient's pain cross it? *That* animal's distress? *Resolution Costs:*
      *   *Sacrificing Precise Action-Guidance:* Accepts that near the threshold, decisions involve deep uncertainty and potential moral risk, perhaps requiring precautionary principles or focusing on reducing the *probability* of threshold events. This makes clean utility maximization impossible.
      *   *Sacrificing Strict Moment-Level Priority (leaning towards Aggregation/Proxy):* Moves towards defining thresholds over aggregates (e.g., life, population) or using measurable proxies (e.g., pain levels known to cause irreversible damage) which are easier to assess under uncertainty but dilute the theory's core experiential focus and risk the transitivity problem.

  ---

  ## The Exclusionary Requirement

  The single requirement that exerts the most exclusionary pressure, particularly against lexical-threshold views and other non-aggregative frameworks, is **Action-Guidance Under Empirical Uncertainty**. Its demand for tractable decision procedures under incomplete information clashes fundamentally with the **Moment/Life Separation Constraint** and the inherent elusiveness of identifying an experiential threshold. While aggregative theories (weighted or pure summation) integrate relatively smoothly with expected utility, lexical-threshold theories face the epistemic abyss of discerning when suffering qualitatively "tips over" into the lexically prior domain in concrete, uncertain situations. This requirement forces a stark choice: either develop complex, potentially unsatisfying heuristics for managing threshold uncertainty (sacrificing elegance and determinism), significantly water down the threshold concept (e.g., making it aggregate or proxy-based, sacrificing the core experiential commitment), or accept that the theory provides limited action-guidance in precisely the morally critical domain it seeks to address (extreme suffering). It excludes otherwise phenomenologically plausible views by demanding a level of operational clarity that their core metaphysical commitments about the nature of suffering inherently resist providing.
