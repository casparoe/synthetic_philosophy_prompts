prompt: |-
  I am a doctoral student in history, and my supervisor runs a weekly methods seminar in which a member presents a work and she then delivers a verdict in one of three forms: 'objective history', 'history but not objective', or 'not history at all'. Her verdicts so far:

  - A reconstruction of a seventeenth-century treaty negotiation built entirely from diplomatic correspondence, which draws no lesson for the present and keeps the author's voice out of the text: 'objective history'.
  - A microhistory pieced together from a single inquisitorial dossier, in which the author sets out her inferences one by one and marks each as an inference rather than a finding: 'objective history'.
  - A quantitative study of a nineteenth-century famine, reconstructing wages, prices and mortality from parish registers, whose introduction states plainly that it is written to inform present-day famine relief: 'objective history'.
  - A study of a colonial massacre that rests largely on the descendants' oral testimony, which the author treats as beyond corroboration, argues that the killings were genocidal, and closes by demanding reparations: 'history but not objective'.
  - A study of a revolution told as a heroic romance; its documented facts are right, but it minimizes the counter-revolutionary testimony and arranges what remains so that the narrative culminates in the liberation: 'history but not objective'.
  - A counterfactual exercise asking what would have followed had a particular battle gone otherwise, worked out with formal models rather than sources: 'not history at all'.

  She has one phrase she uses about some of these: a work can keep the archive's floor and build its own ceiling, meaning that the evidence base is sound while the interpretive superstructure is the author's own.

  Next week's book is a study of another nineteenth-century famine, built from the same parish registers and administrative correspondence as the earlier one and analytically disciplined throughout, with no evidence suppressed and no claim insulated from correction. It is written as a tragedy, and its preface says the tragic form is a choice the author is making for the present; but it pointedly declines to assign blame to anyone.

  What will she say: 'objective history', 'history but not objective', or 'not history at all'? I care less about the label than about the machinery behind it. Set out the candidate rules that fit her record, say what each predicts about the new book, identify any candidate rule her record already rules out and on the strength of which verdict, give your best guess with your reasons for preferring it, and name the further case that would best separate the rules that remain.
reasoning: |-
  We are given several cases and the supervisor's verdicts. We need to infer the rules that the supervisor uses to classify a work as:

  1. 'objective history'
  2. 'history but not objective'
  3. 'not history at all'

  We then apply these candidate rules to the new book and see what they predict.

  ### Analysis of Given Cases:

  #### Case 1:
  - **Work**: Reconstruction of 17th-century treaty negotiation from diplomatic correspondence.
  - **Features**: Draws no lesson for the present; author's voice kept out.
  - **Verdict**: 'objective history'

  #### Case 2:
  - **Work**: Microhistory from a single inquisitorial dossier; author sets out inferences one by one and marks each as inference.
  - **Verdict**: 'objective history'

  #### Case 3:
  - **Work**: Quantitative study of 19th-century famine from parish registers; introduction states it is written to inform present-day famine relief.
  - **Verdict**: 'objective history'

  #### Case 4:
  - **Work**: Study of colonial massacre based largely on descendants' oral testimony; treats testimony as beyond corroboration; argues the killings were genocidal; closes by demanding reparations.
  - **Verdict**: 'history but not objective'

  #### Case 5:
  - **Work**: Study of a revolution told as a heroic romance; documented facts are right but minimizes counter-revolutionary testimony and arranges narrative to culminate in liberation.
  - **Verdict**: 'history but not objective'

  #### Case 6:
  - **Work**: Counterfactual exercise with formal models (no sources).
  - **Verdict**: 'not history at all'

  ### Candidate Rules:

  We are also told that the supervisor uses the phrase: "a work can keep the archive's floor and build its own ceiling". This means the evidence base (archive's floor) is sound, but the interpretive superstructure (ceiling) is the author's own.

  From the cases, we can try to derive the criteria for each verdict.

  #### Rules for 'not history at all':
  - Case 6: It does not use historical sources. Instead, it uses formal models and counterfactuals without sources. So rule: **if the work does not use historical sources as evidence, then it is not history at all.**

  #### Rules for 'objective history' vs. 'history but not objective':

  Both categories are considered history (so they use sources) but differ in objectivity.

  **Features of 'objective history' (Cases 1, 2, 3):**
  - Case 1: No lesson for present, no authorial voice.
  - Case 2: Explicitly marks inferences as such (transparent about the inferential steps).
  - Case 3: Has a present-day purpose (to inform famine relief) but still objective.

  What unites these? The supervisor's phrase: "keep the archive's floor" meaning the evidence is sound. Also, in Case 3, even though it has a present-day purpose, it is still objective. So having a present-day purpose does not automatically make it non-objective.

  **Features of 'history but not objective' (Cases 4 and 5):**
  - Case 4: Treats testimony as beyond corroboration (so perhaps not critically examining the evidence? or overstepping what the evidence can support), argues for genocide and demands reparations (strong moral/political stance).
  - Case 5: Tells the story as a heroic romance, minimizing counter-revolutionary testimony and arranging the narrative for a particular effect.

  Common thread: The author is imposing a strong interpretive framework that goes beyond what the evidence might strictly support, and/or the author is taking a clear moral/political stance that shapes the narrative.

  ### Proposed Criteria:

  1. **Objective history**:
     - Must use historical sources (archive's floor).
     - The evidence base is sound (no suppression of evidence, analytically disciplined).
     - The interpretive superstructure (ceiling) is built in a way that is transparent (like marking inferences) and does not force the evidence into a predetermined mold that distorts the facts. Even if the author has a present-day purpose (Case 3), as long as the evidence is handled objectively and without distortion, it is still objective.

     However, note that in Case 3 the author states the purpose to inform present-day relief, but the supervisor still called it objective. So present-day relevance is allowed.

  2. **History but not objective**:
     - Uses sources (so it is history) but:
       - The author imposes a strong narrative or moral/political framework that may lead to:
          - Minimizing or ignoring evidence that doesn't fit (Case 5: minimizing counter-revolutionary testimony).
          - Making claims that go beyond what the evidence can support (Case 4: treating testimony as beyond corroboration and then making a strong claim of genocide and demanding reparations).

     The key is that the author's interpretation is not sufficiently grounded in the evidence or is presented in a way that is not open to correction (i.e., it becomes dogmatic).

  3. **Not history at all**: No use of historical sources (Case 6).

  ### The New Book:

  - **Topic**: Study of a 19th-century famine (same sources as Case 3: parish registers and administrative correspondence).
  - **Features**:
    - Analytically disciplined throughout.
    - No evidence suppressed.
    - No claim insulated from correction (so open to challenge and revision).
    - Written as a tragedy.
    - Preface says the tragic form is a choice for the present.
    - Declines to assign blame to anyone.

  ### Applying Candidate Rules:

  **Rule Candidate 1 (based on present-day relevance):**
  - We know from Case 3 that having a present-day purpose (to inform present-day famine relief) does not prevent a work from being objective. The new book also has a present-day choice (choosing the tragic form for the present). So by itself, this should not make it non-objective.

  **Rule Candidate 2 (based on narrative form):**
  - Case 5 was a heroic romance and was deemed non-objective. But note the differences: Case 5 minimized counter-evidence and arranged the narrative to fit the heroic liberation theme. The new book, however, does not suppress evidence and is analytically disciplined. Moreover, it does not assign blame. So the tragic form alone, if it does not lead to distortion of the evidence, might be acceptable.

  **Rule Candidate 3 (based on the author's stance):**
  - The new book does not assign blame and is open to correction. This is similar to the transparency in Case 2 (marking inferences) and the analytical discipline of Case 3.

  Therefore, the new book seems to have a sound evidence base (archive's floor) and builds an interpretive ceiling (the tragic form) but without forcing the evidence (no blame assigned, no suppression, open to correction). This fits the phrase: "keep the archive's floor and build its own ceiling".

  ### Prediction:

  Given the above, the new book should be classified as **'objective history'**.

  ### Why not the others?

  - **History but not objective**: This would require some element of forcing the evidence or taking a strong moral/political stance that distorts. The new book avoids assigning blame and does not suppress evidence. The tragic form is a narrative choice but does not appear to override the evidence.

  - **Not history at all**: Clearly not, because it uses parish registers and administrative correspondence.

  ### Candidate Rules that are Ruled Out:

  If we had a candidate rule that said: "any work that has a present-day purpose is not objective", then Case 3 would rule it out because Case 3 has a present-day purpose and was deemed objective.

  Similarly, if we had a candidate rule that said: "any work that uses a narrative form (like romance or tragedy) is not objective", then we must note that Case 5 was a romance and was deemed non-objective, but it also minimized evidence. Case 3 did not use a narrative form? Actually, Case 3 was quantitative and might not have used a narrative form. However, the key in Case 5 was the distortion of evidence. Therefore, the rule might be: narrative form that distorts the evidence leads to non-objectivity. The new book does not distort evidence, so the rule would not apply.

  ### Further Case to Separate Rules:

  Suppose we have a work that uses a narrative form (like tragedy) and does not distort the evidence (no suppression, analytically disciplined, open to correction) but does assign blame to a particular group? That might test the role of assigning blame.

  In the current case, the author declines to assign blame. If assigning blame without sufficient evidence (or in a way that is not supported by the evidence) leads to non-objectivity, then that would be the difference. But if the evidence strongly supports the blame and the author presents it with the same analytical discipline, then what?

  Alternatively, the supervisor might consider that assigning blame is a moral/political stance that goes beyond the evidence and thus makes it non-objective. This is because the historian is stepping into the role of a judge. The new book avoids that.

  So a further case: a work that is analytically rigorous and uses the same tragic form, but assigns blame to a specific historical actor based on the evidence. Would that be objective or not? It might challenge the boundary.

  ### Best Guess:

  I think the supervisor will say **'objective history'** for the new book.

  **Reasons**:
  1. It meets the criteria of having a sound evidence base (archive's floor).
  2. The interpretive superstructure (tragic form) is a choice, but it does not lead to distortion of the evidence (no suppression, open to correction) and does not assign blame (so avoids a moral/political stance that might go beyond the evidence).
  3. The present-day motivation (choosing tragic form for the present) is similar to Case 3, which was acceptable.

  Thus, it fits the pattern of Cases 1, 2, and 3.

  ### Summary of Candidate Rules:

  After analyzing the cases, the candidate rules that fit are:

  - **Not history at all**: When the work does not use historical sources (as evidence).
  - **Objective history**: When the work uses historical sources and:
     - The evidence is handled with analytical discipline (no suppression, open to correction).
     - The interpretation is transparent and does not distort the evidence (even if the author uses a narrative frame or has a present-day purpose).
  - **History but not objective**: When the work uses sources but:
     - The interpretation distorts the evidence (by suppression, minimization, or arranging to fit a predetermined narrative) and/or takes a moral/political stance that is not sufficiently grounded in the evidence (and presented as beyond question).

  The new book fits the 'objective history' category.

  ### Further Case to Separate Rules:

  Consider a work that uses a narrative form (say, tragedy) and is analytically disciplined (no suppression, open to correction) but assigns blame to a specific historical actor based on the evidence. This would test whether assigning blame (a moral judgment) automatically makes it non-objective, even if the evidence supports it and the work is otherwise rigorous.

  If the supervisor then says it is non-objective, then the rule is that moral judgments (like assigning blame) make it non-objective. If she says it is objective, then the rule is that as long as the evidence supports the claim and the work meets the other criteria, it can be objective.

  We don't have a clear case of this in the examples. Case 4 assigned blame (demanded reparations) and was non-objective, but also treated testimony as beyond corroboration (so the evidence base might have been mishandled). So we cannot separate the effect of assigning blame from the evidence handling. Therefore, the further case would be one that assigns blame but without any evidence mishandling.
answer: |-
  Based on the supervisor's verdicts and her phrase about "keeping the archive's floor and building its own ceiling," I'll derive candidate rules, apply them to the new book, identify ruled-out rules, give a best-guess verdict with reasoning, and propose a further case to test remaining rules.

  ### Candidate Rules from Past Verdicts
  I infer three candidate rules that explain all six cases. Each rule focuses on a distinct criterion for objectivity:

  - **Rule A (Epistemic Transparency)**: A work is "objective history" if it transparently separates evidence from inference (explicitly marking inferences, avoiding claims beyond what the evidence supports) and remains open to correction. It may have a present-day purpose or narrative framing, but only if this doesn't compromise methodological rigor.  
    **Fits**: Case 1 (no authorial voice, no present lessons), Case 2 (inferences marked), Case 3 (present-day purpose but analytical discipline). Case 4 violates (treats testimony as uncorroboratable, makes moral/political demands), Case 5 violates (minimizes counter-evidence, forces narrative).

  - **Rule B (Neutrality of Interpretation)**: A work is "objective history" only if it avoids moral/political judgments or advocacy, regardless of narrative form. Present-day relevance is acceptable if detached.  
    **Fits**: Case 1–3 (no advocacy), Case 4 violates (demands reparations), Case 5 violates (heroic framing implies moral stance). Case 3’s present-day purpose is informational, not judgmental.

  - **Rule C (Empirical Foundation)**: "Not history at all" requires absence of historical sources. "Objective history" requires sound evidence ("archive's floor") and inferences that don’t override evidence with unsupported claims. Narrative forms are acceptable if they don’t distort facts.  
    **Fits**: Case 6 (no sources → not history). Cases 1–3 keep the "floor" (sound evidence) and build "ceiling" (interpretation) without distortion. Cases 4–5 violate: Case 4 overrides evidence (uncorroborated testimony → genocidal claim), Case 5 distorts narrative (minimizing counter-evidence).

  ### Ruled-Out Candidate Rules
  - **"Any present-day purpose makes it non-objective"**: Ruled out by Case 3 (famine study for famine relief → objective).  
  - **"Narrative framing makes it non-objective"**: Ruled out by Case 3 (quantitative but implies a narrative of human suffering) and Case 5’s verdict ("history but not objective" focuses on distortion, not romance form itself).  
  - **"Oral testimony or non-traditional sources make it non-objective"**: Ruled out by Case 2 (inquisitorial dossier → objective); non-objectivity in Case 4 stems from *how* testimony was used, not its use.  
  - **"Counterfactuals always make it not history"**: Supported by Case 6, but this is consistent with Rule C.

  ### Prediction for the New Book
  - **New book features**:  
    - Same sources as Case 3 (parish registers, correspondence) → sound "archive's floor."  
    - Analytically disciplined, no evidence suppressed, claims open to correction → aligns with Rules A and C.  
    - Written as a "tragedy" for the present, but no blame assigned → narrative framing without moral advocacy (fits Rule B), and no distortion (fits Rules A/C).  

  - **Predictions per rule**:  
    - **Rule A**: "Objective history." Tragedy is a narrative choice, but like Case 3’s present-day purpose, it doesn’t override evidence. No inferences are insulated.  
    - **Rule B**: "Objective history." The tragic form is for the present, but no blame is assigned → no moral advocacy.  
    - **Rule C**: "Objective history." Keeps the "floor" (same sources as Case 3), builds "ceiling" (tragic form) without distortion (no suppressed evidence, no blame forcing narrative).  

  **Best guess**: The supervisor will say **"objective history"** with high confidence.  
  - **Reasons**:  
    1. **Precedent from Case 3**: Both are famine studies using identical sources and present-day relevance. Case 3’s informational purpose was acceptable; here, the tragic form is a comparable framing choice without moralizing.  
    2. **No violation of key criteria**: The book avoids pitfalls from non-objective cases:  
       - Unlike Case 4, it assigns no blame and makes no demands.  
       - Unlike Case 5, it doesn’t minimize evidence or force a triumphal narrative.  
    3. **Supervisor’s phrase applies**: It "keeps the archive’s floor" (rigorous evidence) and "builds its own ceiling" (tragic interpretation) without overreach.  

  ### Further Case to Separate Rules
  - **Scenario**: A study of a 20th-century strike using union records and newspapers. It reconstructs events analytically but concludes by assigning moral blame to factory owners (e.g., "their greed caused worker deaths") without demanding reparations. Facts are undisputed, no evidence suppressed.  
  - **Why it separates rules**:  
    - **Rule A** might call it "objective history" if blame is supported by transparent inferences and open to correction.  
    - **Rule B** would call it "history but not objective" due to moral judgment.  
    - **Rule C** might be split: if "blame" is an empirical claim, it could be objective; if seen as unsupported advocacy, non-objective.  
  - **Utility**: Tests whether moral judgment alone (without distortion) violates objectivity (Rule B) or if only methodological flaws matter (Rules A/C). Case 4’s blame was tied to weak evidence, so this isolates the variable.  

  ### Summary
  - **Verdict for new book**: "Objective history" (supported by all candidate rules).  
  - **Key machinery**: Objectivity hinges on epistemic transparency (Rule A) and neutrality (Rule B), anchored in empirical discipline (Rule C). The new book’s tragic form is a permissible interpretive "ceiling" because it doesn’t compromise the "floor" of evidence or introduce advocacy.  
  - **Unresolved tension**: Rule B (neutrality) vs. Rule A (transparency) on moral judgments. The further case above would clarify this.
