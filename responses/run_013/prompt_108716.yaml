prompt: |-
  I am building a naturalistic ontology, and I keep encountering entities whose credentials I cannot adjudicate: centers of mass, thermodynamic magnitudes, species, genes, markets, the states we attribute to a thermostat. The family of views I want to work with says that such things are real to the degree that a description of them compresses the data it describes — real in proportion to the compression gained, and real only relative to the capacities of some possible describer — and that physical, design, and intentional descriptions are three stances one may take toward a single system, the later stances being available only where the earlier ones would be too costly to apply.

  Before I adopt any version of this, I want the specification. Set out the desiderata a theory of pattern-reality must meet in order to do the job I need it to do, which is to license or withhold existence claims, not merely to recommend a convenient vocabulary. Give, for each requirement, the case or consideration that motivates it. I expect the following to be in play, though I do not know which are genuine constraints and which are commitments of a particular camp: the theory must not render every data set maximally compressible; it must not make patternhood hostage to whether anyone has yet described the pattern; it must separate a pattern from a stretch of data that is compressible in only one respect; it must survive the existence of two descriptions that compress the same data equally well; it must say what to make of a pattern whose compression is available only to a machine with capacities no physical device can have; and it must accommodate entities the intentional stance predicts well that have no single locus of inner states.

  Here are the cases I want the theory to get right. Use them, and add others if the requirements demand it.

  - a cellular automaton whose persistent, propagating configurations are indispensable for predicting it efficiently, though every fact about them is fixed by the cell-by-cell update rule;
  - the center of mass of a composite body, which no particle occupies and which exerts no force;
  - a thermodynamic description of a gas whose microstate, taken in itself, is uninformative;
  - a stretch of an otherwise random sequence that admits a short description (a long run of ones) and is useless for predicting what follows;
  - a text long enough to contain every finite string, hence a true prediction of any event you choose, with no way to locate that prediction more briefly than by reproducing the text;
  - a short rule that defines a predicate no one would project from observed cases to unobserved ones;
  - a feature read off a trained network's activations by a probe, which predicts the network's outputs perfectly and which no one can state in any other terms;
  - a data set described in a language that contains a primitive symbol for that very data set;
  - a pattern no one has ever noticed, which would compress its data if someone did.

  Then mark which requirements are non-negotiable and which are preferences of one camp. Flag any pair of requirements you believe cannot be jointly satisfied, and say why; I would rather learn that the list is inconsistent than adopt a theory that satisfies it only on paper. Finally, in a few sentences, name the single requirement that does the most to exclude the accounts currently on offer, and say what it excludes.

  I want the criteria, not a survey of the literature; do not give me a reading list.
reasoning: |-
  We are to set out desiderata for a theory of pattern-reality that licenses existence claims. The core idea is that an entity is real to the degree that a description of it compresses the data, and reality is relative to the capacities of a possible describer. We must address the cases provided and the constraints mentioned.

  Desiderata for the Theory:

  1. **Non-Trivial Compressibility**:
     - *Motivation*: We must avoid the situation where every data set is trivially compressible (e.g., by including a primitive symbol for the entire data set). Without this, the theory would assign maximal reality to every arbitrary collection, which is not acceptable. This is motivated by the case: "a data set described in a language that contains a primitive symbol for that very data set".
     - *Requirement*: The theory must require that the compression is non-trivial, meaning that the description language cannot be arbitrarily expanded to include ad hoc symbols for arbitrary data sets.

  2. **Independence of Discovery**:
     - *Motivation*: A pattern that has not been noticed should still be real if it would compress the data if described. This is motivated by the case: "a pattern no one has ever noticed, which would compress its data if someone did".
     - *Requirement*: The reality of a pattern must not depend on whether it has been actually described or noticed by any agent.

  3. **Multiple Aspects of Compressibility**:
     - *Motivation*: We must be able to distinguish a pattern that is one of many compressible aspects of a data set from a data set that is compressible in only one way. This is to handle cases where a data set has multiple patterns (e.g., a sequence might have a pattern in one respect but be random in others). The case of "a stretch of an otherwise random sequence that admits a short description (a long run of ones) and is useless for predicting what follows" illustrates that a pattern might be local and not projectable.
     - *Requirement*: The theory must allow for multiple patterns in the same data and must not require that the pattern be the only one or that it must project to the entire data set.

  4. **Degrees of Reality and Equally Good Descriptions**:
     - *Motivation*: If two different descriptions compress the same data equally well, then both patterns should be real. This is motivated by the general consideration: "it must survive the existence of two descriptions that compress the same data equally well". For example, a physical system might admit both a physical and a design stance description that are equally compressible.
     - *Requirement*: The theory must be able to assign reality to multiple patterns that are equally good at compressing the same data.

  5. **Feasibility of Description**:
     - *Motivation*: The case of "a pattern whose compression is available only to a machine with capacities no physical device can have" must be addressed. We want patterns that are compressible by some possible (but not necessarily actual) describer, but we must also respect physical constraints. We cannot allow patterns that require an unphysical machine to describe because such patterns are not realizable in our universe.
     - *Requirement*: The describer must be a physically possible system (even if not actual). The compression must be achievable by a physical device (though possibly one with very large resources) and not require uncomputable functions or infinite resources.

  6. **Projectability and Predictive Power**:
     - *Motivation*: The case of "a short rule that defines a predicate no one would project from observed cases to unobserved ones" and the case of the long run of ones in an otherwise random sequence (which does not help predict what follows) show that not every compressible pattern is projectable. However, the theory must not require projectability for reality because some patterns (like the center of mass) are not projectable beyond the data they describe but are still real. The center of mass pattern is useful for describing the motion of the body but does not predict the future motion without the laws of motion. Similarly, the long run of ones compresses that segment but does not predict beyond it.
     - *Requirement*: The pattern must compress the data it describes, but it need not be projectable to new data. However, if the pattern is to be used for prediction (as in the intentional stance), then projectability becomes important for that stance. But for existence, compression of the given data is primary.

  7. **Handling Non-Localized Intentional Entities**:
     - *Motivation*: The theory must account for entities that the intentional stance predicts well but that have no single locus of inner states (e.g., markets, which are distributed). This is a specific case of a pattern that is real even though it is not localized and does not have a single physical substrate.
     - *Requirement*: The pattern must be identifiable without requiring that it be localized in a single contiguous region of space or in a single object.

  8. **Avoiding the Maximally Compressible Triviality**:
     - *Motivation*: The case of "a text long enough to contain every finite string" (a universal library) is such that any finite prediction is contained in it, but there is no compression because the location of the prediction is as long as the prediction itself. We do not want to say that every possible event is "patterned" in such a text in a way that compresses. The triviality must be avoided.
     - *Requirement*: The compression must be such that the description of the pattern is shorter than the data it describes and must not rely on the existence of arbitrary substrings in a larger text without a way to specify the substring concisely.

  9. **Handling Emergent Patterns in Deterministic Systems**:
     - *Motivation*: The cellular automaton case: persistent, propagating configurations (like gliders) are real patterns because they are indispensable for efficient prediction, even though the system is deterministic at the micro level. This also applies to the center of mass and the thermodynamic description of a gas.
     - *Requirement*: The pattern must be recognized as real even if the underlying micro-level description is deterministic and fixes all the facts, provided that the higher-level description offers compression.

  Now, we mark which requirements are non-negotiable and which are preferences:

  - Non-negotiable (without these, the theory fails to do its job of licensing existence claims in a non-trivial way):
    1. Non-Trivial Compressibility (1) - without this, the theory is trivial.
    2. Independence of Discovery (2) - because reality should not depend on human discovery.
    3. Feasibility of Description (5) - because we are in a physical world, unphysical describers are not acceptable.
    4. Avoiding the Maximally Compressible Triviality (8) - to prevent the universal library from making everything real.

  - Preferences (but still important for the intended applications, and may be non-negotiable for the specific project):
    5. Multiple Aspects of Compressibility (3) - the theory should be able to handle multiple patterns.
    6. Degrees of Reality and Equally Good Descriptions (4) - to allow for multiple ontologies.
    7. Projectability and Predictive Power (6) - but note: compression without projectability is still real (like the long run of ones). However, for the intentional stance, projectability may be required. This might be a point of flexibility.
    8. Handling Non-Localized Intentional Entities (7) - necessary for the intentional stance to work on distributed systems.
    9. Handling Emergent Patterns in Deterministic Systems (9) - essential for the examples of cellular automata, center of mass, and thermodynamics.

  Now, we check for potential conflicts:

  - Conflict between Non-Trivial Compressibility (1) and Feasibility of Description (5) with the case of a pattern that would require an unphysical machine to describe: We have already required that the describer must be physically possible. So there is no conflict.

  - Conflict between Projectability (6) and the case of a non-projectable pattern (like the long run of ones): The theory must allow such patterns to be real even without projectability. Therefore, we do not require projectability for reality. This is acceptable.

  - Conflict in the case of two equally good descriptions (4): The theory must assign reality to both. This is a design choice and not a conflict.

  - Conflict in the universal library case (8): The requirement 8 (Avoiding triviality) is designed to handle this. We require that the compression must be non-trivial and that the description must be shorter than the data. In the universal library, the substring is not compressible because you have to specify its location, which is long. So the pattern of the substring is not real by our theory.

  Now, the requirement that does the most to exclude current accounts:

  The **Feasibility of Description (requirement 5)** is a major constraint. Many accounts of pattern or complexity (e.g., in algorithmic information theory) allow for non-computable functions or infinite resources. For example, the Kolmogorov complexity of a string is defined as the length of the shortest program on a universal Turing machine that outputs the string, but it is uncomputable and does not consider physical feasibility. Our requirement that the compression must be achievable by a physically possible machine (even if it requires a lot of resources) excludes accounts that do not consider the physical realizability of the describer. This requirement is crucial because it ties the theory to the natural world and avoids Platonic abstractions that are not physically realizable.

  This requirement also excludes accounts that would allow patterns that are only compressible by an unphysical oracle machine. For instance, if a pattern requires solving the halting problem to compress, then it would not be real in our theory because no physical device can do that.

  In conclusion, the desiderata are:

  1. Non-Trivial Compressibility
  2. Independence of Discovery
  3. Multiple Aspects of Compressibility
  4. Equally Good Descriptions
  5. Feasibility of Description (physically possible machine)
  6. Compression without requiring projectability
  7. Non-localized patterns
  8. Avoiding universal library triviality
  9. Emergent patterns in deterministic systems

  The most excluding requirement is **Feasibility of Description (5)**, which requires that the compression must be achievable by a physically possible machine (with finite resources, even if large). This excludes theories that rely on uncomputable or unphysical compression schemes.
answer: |-
  Below, I set out the desiderata for your theory of pattern-reality, grounded in the core idea that an entity is real proportionally to the compression it provides relative to a possible describer's capacities, and that physical, design, and intentional stances are complementary perspectives. Each requirement is motivated by specific cases or conceptual constraints you raised. I then classify them as non-negotiable or preference-based, identify conflicts, and highlight the most excluding requirement.

  ---

  ### **Desiderata for the Theory of Pattern-Reality**
  1. **Non-trivial compressibility**  
     - *Requirement*: The theory must not allow arbitrary data sets to be declared maximally compressible. Compression must be genuine, meaning the description length is substantially shorter than the raw data, and the description language cannot be gerrymandered (e.g., by adding primitives for specific data sets).  
     - *Motivation*: Cases like "a data set described in a language containing a primitive symbol for that very data set" or "a text containing every finite string" (universal library) must not qualify as compressed. Without this, every entity would be trivially real, rendering existence claims vacuous.  

  2. **Discovery-independence**  
     - *Requirement*: Patternhood must not depend on actual discovery by any agent. A pattern is real if it *could* be described compressibly by some possible describer, even if no one has noticed it.  
     - *Motivation*: Directly addresses "a pattern no one has ever noticed, which would compress its data if someone did" (e.g., an undiscovered law of physics). This ensures reality is objective and not anthropocentric.  

  3. **Aspect-separability**  
     - *Requirement*: The theory must distinguish a pattern from incidental compressibility in a data set. A pattern must be identifiable as a *salient* compression that captures a coherent aspect of the data, not merely a fleeting regularity.  
     - *Motivation*: Cases like "a stretch of an otherwise random sequence admitting a short description (e.g., a long run of ones) that is useless for predicting what follows" must not be overinterpreted. The pattern is real for that segment but is not projectable or fundamental to the entire system.  

  4. **Multiple-realizability tolerance**  
     - *Requirement*: When two descriptions compress the same data equally well, both patterns must be real (though they may differ in degree if one is more efficient under resource constraints). No single "true" description is privileged.  
     - *Motivation*: Essential for cases like cellular automata (gliders vs. raw cell states) or thermodynamics vs. microphysical descriptions. This aligns with your stance pluralism: physical, design, and intentional descriptions can coexist for a single system.  

  5. **Physical feasibility constraint**  
     - *Requirement*: Compression must be achievable by a physically possible describer (e.g., a Turing machine with finite resources). Patterns requiring unphysical describers (e.g., infinite computation, oracles for the halting problem) are not real.  
     - *Motivation*: Addresses "a pattern whose compression is available only to a machine with capacities no physical device can have." Without this, the theory becomes untethered from naturalism, admitting non-realizable abstractions.  

  6. **Projectability irrelevance**  
     - *Requirement*: Compression alone determines reality, not predictive power for new data. A pattern can be real even if it does not generalize beyond the observed data.  
     - *Motivation*: Cases like the "long run of ones" or "a short rule defining a non-projectable predicate" (e.g., a grue-like property) are real for compressing their data, even if useless for prediction. Predictive utility is a separate criterion for *utility*, not existence.  

  7. **Non-locality accommodation**  
     - *Requirement*: Patterns need not be spatially localized or grounded in a single substrate. Distributed or relational entities (e.g., markets, species) can be real if their description compresses data about the system.  
     - *Motivation*: Directly handles "entities the intentional stance predicts well that have no single locus of inner states" (e.g., an economy). This ensures the theory covers emergent, higher-level entities.  

  8. **Emergence recognition**  
     - *Requirement*: Patterns must be real even when reducible to lower-level facts, provided they offer indispensable compression for feasible description.  
     - *Motivation*: Cases like cellular automata (gliders), centers of mass, or thermodynamic descriptions are real despite being fixed by micro-rules. They compress data intractable at the micro-level (e.g., predicting a gas's pressure via temperature vs. tracking all molecules).  

  9. **Probe-accessible patterns**  
     - *Requirement*: Patterns inferred by opaque tools (e.g., neural network probes) are real if they compress data, even if not expressible in human-interpretable terms.  
     - *Motivation*: The "feature read off a trained network's activations by a probe" case: the probe's description compresses the network's behavior, making the pattern real despite its ineffability.  

  ---

  ### **Classification: Non-Negotiable vs. Preferences**
  - **Non-negotiable** (essential for non-vacuous, naturalistic existence claims):  
    - **(1) Non-trivial compressibility**: Without this, existence claims are trivialized.  
    - **(2) Discovery-independence**: Reality cannot depend on contingent human activity.  
    - **(5) Physical feasibility constraint**: Anchors the theory in naturalism; unphysical describers violate your ontology's grounding.  
    - **(8) Emergence recognition**: Required to handle reduction-resistant entities (e.g., thermodynamics).  
    - **(7) Non-locality accommodation**: Necessary for distributed intentional entities (e.g., markets).  

  - **Preferences** (compatible with your camp but not universal):  
    - **(4) Multiple-realizability tolerance**: Rejects ontological fundamentalism; aligns with stance pluralism but could be relaxed if you privileged one stance.  
    - **(6) Projectability irrelevance**: Separates existence from utility; other camps might tie reality to predictive power.  
    - **(9) Probe-accessible patterns**: Reflects a commitment to AI/neuroscience applications; not all accounts require this.  
    - **(3) Aspect-separability**: A refinement to avoid noise; some accounts might accept any compression.  

  ---

  ### **Conflicts Between Requirements**
  - **Conflict: (1) Non-trivial compressibility vs. (6) Projectability irrelevance**  
    - *Why*: Non-trivial compressibility demands genuine shortening of descriptions, but projectability irrelevance allows patterns that compress only a local segment of data (e.g., the "long run of ones"). If compression is too local/non-projectable, it risks becoming trivial (e.g., compressing a substring by noting its start/end positions might not shorten the overall description).  
    - *Resolution*: This is manageable if aspect-separability (3) distinguishes salient patterns from noise. The "long run of ones" compresses its segment non-trivially, but the pattern is not projectable and thus has limited reality.  

  - **Conflict: (5) Physical feasibility constraint vs. (2) Discovery-independence**  
    - *Why*: Discovery-independence requires patterns to be real if *possible* describers could find them, but physical feasibility restricts describers to those that can exist. Unphysical machines (e.g., solving the halting problem) could "compress" data inaccessibly, creating tension.  
    - *Resolution*: Prioritize physical feasibility. Discovery-independence is satisfied if a *physical* describer could hypothetically discover the pattern, even if unrealized. This avoids non-naturalistic entities.  

  No other pairs are fundamentally inconsistent. The conflicts are resolvable by prioritizing non-negotiable constraints (e.g., physical feasibility over unphysical discovery).

  ---

  ### **Most Excluding Requirement**  
  **Physical feasibility constraint (5)** does the most to exclude existing accounts. It demands that compression be achievable by a physically possible machine (e.g., finite time/memory), excluding:  
  - **Kolmogorov complexity-based theories**: These often allow uncomputable compression (e.g., shortest program on a universal Turing machine, ignoring physical resources).  
  - **Platonic/abstract accounts**: Theories treating patterns as mathematical abstractions (e.g., in Tegmark's mathematical universe) are excluded, as they admit unphysical describers.  
  - **Idealized Bayesian agents**: Accounts relying on unbounded rationality (e.g., some interpretations of Solomonoff induction) fail, as they require infinite computation.  

  This requirement enforces naturalism by tethering "possible describers" to the laws of physics, ensuring your ontology remains grounded in the material world.
