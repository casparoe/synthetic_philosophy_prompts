prompt: |-
  Ok, so my mate Dan did a maths degree before he went into software and he's basically the team's unofficial Gödel guy — every arguement at work ends with someone saying 'well Dan reckons'. I've been in enough of these to have a decent record of where he comes down, and two of my colleagues have spent this week making Gödel arguments at me, so I'd like to know what Dan's going to say before I jump in. My memory of his exact wording might be a bit off, but these verdicts I'm sure about:

  - 'Any consistent formal system that can do arithmetic has a sentence it can't prove or disprove' — yes, roughly, but only if you add that the axioms have to be given by a rule a machine could follow.
  - 'Arithmetic with + but no × is incomplete too' — no, he says that one's complete, and you can actually write a decision procedure for it.
  - 'Then the theory consisting of every true sentence of arithmetic is incomplete' — no, he says it's complete, it's just not something any machine can list out.
  - 'No language can define truth for its own sentences' (the Tarski thing) — yes, and he says it's the exact same trick as Gödel, minus the arithmetic.
  - 'No program can decide halting for all programs' — yes, same trick again.
  - 'So a country's legal code can't be both complete and consistent' — no, he says the theorem has nothing to say about that.
  - 'Penrose: we can see the Gödel sentence is true, so the mind isn't a machine' — no, he says it's circular, you'd have to already know you're consistent.

  Now the two things people are saying at me this week:

  (a) One of our ML engineers is building a system that inspects its own source code and predicts what it will do, and he says Gödel puts a hard ceiling on it — it can never be both sound and complete about its own behaviour, no matter how much compute we throw at it.

  (b) Our CTO said in an all-hands that Gödel proves there are true mathematical facts nobody will ever prove. Not 'we haven't found the proof yet' — never, by anyone.

  What does Dan say to (a) and to (b)? What I really want is the rule he's actually running, plus the other rules that fit everything in my list just as well — I can't tell whether the thing he cares about is the arithmetic and the machine-checkable axioms, or the self-reference bit (a system that can talk about itself, arithmetic or not). And which of my two cases, or what other example I should bring up, would actually tell those two apart.
