  Position 3: **Democratic Equality/Anti-Power View**: The problem is concentrated private power (including non-monetary advantages). The remedy might be more radical (cap, public inheritance, or even abolition) to prevent dynastic power.

  Position 4: **Family Preservation View**: The family has a right to pass on its legacy, especially when it involves a family business or non-monetary values. This view may accept some taxation but with exceptions for family firms or non-monetary assets.

