     A) The business should be passed intact to one heir (even if that means the others get less) to preserve the jobs and the family legacy.
     B) The inheritance should be split equally among the children, even if that means selling the business and losing jobs. Fairness among heirs is paramount.
     C) The business should be sold and the proceeds taxed heavily, with the government using the revenue to support the displaced workers and the town.

  Question 2: **Non-Monetary Fortune (Social/Political Capital)**
     Case: The Van Rensselaer family's wealth is no longer primarily financial; it's their name, their connections to power, and their social standing. When the matriarch dies, she leaves her fortune (including these intangible advantages) to her grandchildren. What is the main concern?
     A) This is just as legitimate as leaving money; the family has the right to pass on its social capital.
     B) This perpetuates unearned advantage and undermines equal opportunity, so it should be taxed or regulated as if it were money.
     C) The real problem is the undue influence this gives the family over politics and society; we must break up such dynastic power by any means necessary.

  Question 3: **Trust that Skips a Generation**
     Case: To avoid estate taxes and ensure the fortune lasts, the Rockingham family sets up a trust that pays income to the grandchildren, bypassing the children entirely. The children (who are middle-aged) get nothing. What do you think?
     A) It's a smart way to preserve wealth across generations and is within the family's rights.
     B) This is a tax dodge that exacerbates inequality and should be prohibited.
     C) The problem is the creation of a permanent idle rich class; we should limit how long trusts can last or tax them heavily.

  Question 4: **Renouncing Money but Keeping Connections**
     Case: Eleanor Winthrop publicly renounces her $50 million inheritance, saying she wants to make her own way. But she keeps using the family name and connections to land a prestigious job and gain influence. What is your view?
     A) She has the right to both renounce the money and use her name; connections are part of her identity.
     B) Renouncing the money is a hollow gesture if she still benefits from unearned advantages; she should have to earn her position without any family help.
     C) The problem isn't just her individual advantage, but the systemic power of families like hers; we need structural change to make society less deferential to such names.

  Question 5: **First-Generation vs. Third-Generation Fortune**
     Case: Self-made billionaire James Oakhurst argues that his fortune is earned and should be passed to his children without heavy taxes, while the third-generation Sterling family fortune is unearned and should be taxed heavily. Do you agree?
     A) No, all inheritance is a legitimate exercise of property rights, whether first or third generation.
     B) Yes, there's a moral difference: the first generation earned it, but by the third generation it's unearned advantage.
     C) No, the issue isn't when it was earned but the power it confers; both are problematic if they lead to excessive concentration of power.

