answer: |-
  Below is an inheritance values sorting quiz designed to reveal underlying principles through concrete cases, avoiding labels and explicit tax debates. Each question presents a scenario from your novel, followed by answer options reflecting core philosophical divides. The scoring key maps answer patterns to positions in the inheritance debate, flags unresolvable overlaps, and notes each position's "awkward commitment"—the hardest implication to defend.

  ---

  ### **The Inheritance Values Quiz**  
  *Answer based on your instinctive reaction to each scenario.*  

  1. **The Family Firm**  
     The Thorndike Foundry, employing 200 people in a struggling town, will collapse if split among heirs. Keeping it intact requires bypassing two children to give full control to the heir with business expertise.  
     - **A)** Save the firm and jobs—the family’s duty to the community outweighs equal shares.  
     - **B)** Split ownership equally, even if it destroys the firm; no heir deserves privileged status.  
     - **C)** Transfer the firm to employee ownership; private dynasties shouldn’t control livelihoods.  

  2. **The Social Capital Fortune**  
     The Sterling family’s "wealth" is their name: access to politicians, elite clubs, and influence. Their daughter inherits these connections but donates the family’s remaining cash to charity.  
     - **A)** Connections are personal relationships, not property; she owes nothing to society.  
     - **B)** This is unearned power; she should disclose contacts or recuse herself from influence.  
     - **C)** The real harm is dynastic privilege; names like hers shouldn’t open doors at all.  

  3. **The Skipped-Generation Trust**  
     To avoid taxes, a billionaire leaves everything in a trust for her grandchildren, disinheriting her children (who are middle-class professionals).  
     - **A)** Her money, her choice; the grandchildren will benefit more.  
     - **B)** This exploits loopholes to hoard advantage; the parent-child bond deserves recognition.  
     - **C)** Trusts perpetuate aristocracy; all inheritance beyond a modest sum should expire.  

  4. **The Renouncer Who Keeps the Name**  
     An heir publicly rejects his $300 million inheritance but leverages his family name to secure investments for his startup.  
     - **A)** The name is his identity; connections aren’t "wealth" to renounce.  
     - **B)** This hypocrisy proves unearned advantage corrupts; he should start anonymously.  
     - **C)** Blame the system, not him; no one should inherit social capital in the first place.  

  5. **Old Money vs. New Money**  
     A self-made tech billionaire mocks a third-generation shipping heir: "My children deserve my wealth; yours didn’t earn theirs."  
     - **A)** Both are wrong; all inheritance is a right of ownership.  
     - **B)** The self-made heir has a point; "old money" is unearned advantage.  
     - **C)** Both are harmful; multigenerational wealth corrupts democracy, regardless of origin.  

  6. **The Partial Heir**  
     A dying parent leaves the family home (worth $5 million) to the child who cared for them, and only $50,000 to their sibling.  
     - **A)** Gifts reflect love and obligation; fairness is personal, not mathematical.  
     - **B)** This breeds resentment; all children deserve equal starting resources.  
     - **C)** This exposes inheritance’s cruelty; no one should get windfalls while others struggle.  

  7. **The Legacy Project**  
     An heir uses inherited wealth to fund a museum honoring her family’s history, calling it a "gift to the public."  
     - **A)** A noble act; private legacies enrich culture.  
     - **B)** A vanity project; that money could fund scholarships for the disadvantaged.  
     - **C)** A display of power; dynasties shouldn’t control cultural narratives.  

  8. **The Public Inheritance Proposal**  
     A politician suggests replacing inheritance taxes with a "citizen’s inheritance"—$100,000 to every 21-year-old—funded by taxing estates over $5 million.  
     - **A)** Theft! Parents have a right to pass assets to children.  
     - **B)** A fair compromise; it equalizes opportunity without banning bequests.  
     - **C)** A half-measure; it ignores non-monetary privilege and lets dynasties persist.  

  ---

  ### **Scoring Key**  
  Tally your answers (mostly A, B, or C). Positions are defined by their core principles:  
  - **Liberty vs. Advantage:** Is bequest a property right or unearned privilege?  
  - **Baseline:** Should we equalize starting resources (*B*) or dismantle concentrated power (*C*)?  
  - **Family Partiality:** Do family bonds justify inequality (*A*) or not (*B/C*)?  
  - **Remedy:** Tax (*B*), cap/abolish (*C*), or neither (*A*)?  

  #### **Mostly A: Property Rights Defender or Family Preservationist**  
  *The quiz cannot separate these positions. Both answer identically.*  
  - **Core Principle:** Bequest is a protected liberty; families are sites of legitimate partiality. Equality’s demands stop at the household door.  
  - **Awkward Commitment:** Defending dynastic social/political influence as "personal property."  
  - **Remedy Preference:** No major restrictions; maybe minimal taxes.  

  #### **Mostly B: Meritocratic Equalizer**  
  - **Core Principle:** Inheritance creates unfair advantage; the goal is equal opportunity, not equal outcomes. Birth should not determine life chances.  
  - **Awkward Commitment:** Taxing family firms/assets might harm communities or ignore emotional ties.  
  - **Remedy Preference:** High inheritance taxes to fund public goods (e.g., education).  

  #### **Mostly C: Democratic Leveler or Abolitionist**  
  *The quiz cannot separate these positions. Both answer identically.*  
  - **Core Principle:** Inheritance entrenches dynastic power that corrupts society. The goal is dismantling aristocracy, not just redistributing cash.  
  - **Awkward Commitment:** Supporting policies that erase family legacies (businesses, homes, cultural artifacts).  
  - **Remedy Preference:** Caps, expiration dates on trusts, or abolishing bequest entirely.  

  #### **Unnamed Position**  
  If your answers lack a clear majority (e.g., 4A/4B/2C), your view is hybrid or idiosyncratic. The most common unnamed stance: *"Tax extreme wealth but protect family firms/sentimental assets."* Its awkward commitment: Drawing arbitrary lines between "legitimate" and "illegitimate" inheritance.  

  ---

  ### **Design Notes for Your Companion Piece**  
  - **Why Cases Over Labels:** Labels (e.g., "libertarian") obscure nuances. Cases force confrontations with real trade-offs (jobs vs. fairness, connections vs. equality).  
  - **Unresolved Splits:** Property vs. Family Preservationists agree on all cases—both see inheritance as an extension of familial love/autonomy. Levelers vs. Abolitionists also align—both prioritize power dissolution over opportunity.  
  - **Use in Your Saga:** These cases create "diagnostic moments" where characters reveal their core beliefs through action (e.g., the renouncer’s hypocrisy dissects the gap between wealth and privilege).  
  - **Reader Engagement:** On your author site, pair this with character vignettes (e.g., "Which Thorndike heir are you?").  

  This quiz isolates fault lines in the inheritance debate through lived dilemmas, avoiding oversimplification while clarifying irreconcilable differences.
