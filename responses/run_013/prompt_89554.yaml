     Case: A radical proposal: abolish inheritance entirely. When you die, your estate goes to the state (except perhaps for personal items). What is your stance?
     A) Outrageous; that violates fundamental property rights and family bonds.
     B) Too extreme; a heavy estate tax is sufficient to address inequality without such a drastic step.
     C) Necessary; inheritance is the root of dynastic power and must be eliminated to achieve a just society.

