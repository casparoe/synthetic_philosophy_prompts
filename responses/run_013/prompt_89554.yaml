     A) That's an unjust taking of private property; people have the right to leave their wealth to their children.
     B) That's a great idea to level the playing field without punishing savers; it would give everyone a fair start.
     C) That doesn't go far enough; we need to prevent large concentrations of private wealth in the first place.

