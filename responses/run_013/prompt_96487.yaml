  - Overstating Dennett's view on thermostats (they are minimal intentional systems)
  - Missing Dennett's actual criteria for "real intentionality"

  The compression vs intervention distinction is where nuance matters most. The student recognizes it shouldn't rank stances but fails to see how intervention aligns with Dennett's own views on prediction. Dennett absolutely cares about reliable counterfactuals - that's baked into stance-taking.

