prompt: |-
  In the seminar I am taking on money and politics, a classmate keeps invoking the line "sunlight is the best disinfectant" to argue that we should scrap caps on campaign contributions and rely instead on strict disclosure requirements. The professor let it pass, but I have to write a short response paper, and I want to show that the slogan is being asked to do more work than it can bear. Could you separate out the distinct, precise claims that sentence could be making — from the near-trivial to the quite radical — and for each say whether it is an empirical or a conceptual claim, whether it is plausible, and whether it would actually license my classmate's conclusion that transparency can substitute for limits? I am especially unsure about the gap between "disclosure changes behavior" and "disclosure is sufficient," and about whether the slogan says anything at all about how much money enters politics, as opposed to how visible it is. Finally, tell me which of the readings my classmate most likely has in mind when he uses it to close the discussion.
