prompt: |-
  I am preparing an episode of a small, technically inclined philosophy podcast, and my guest is a philosopher who defends a view she calls evidential cooperation in large worlds. The view holds that agents who are causally isolated from one another, whether in distant regions of a very large universe or in different branches of a multiverse, can nevertheless cooperate by adopting policies that are logically or indexically correlated, because choosing a cooperative policy is evidence that one's counterparts are choosing cooperative policies, even though no causal signal passes between them. She treats this as a result in decision theory rather than as a moral postulate, and she often insists that the real question is not whether acausal influence is possible but which reference class of counterparts one's policy is correlated with. I want questions that force her to specify the machinery rather than restate the conclusion. Please draft exactly five interview questions. Each item should be one or two sentences: a main question followed by a follow-up keyed to the answer she is most likely to give. I want at least one question each on the reference-class problem and how the view avoids vacuity; on whether evidential cooperation collapses into evidential decision theory or instead requires something like functional or updateless decision theory; on the parochialism objection and whether the view can avoid licensing cooperation only with agents sufficiently like us; on how it handles logical uncertainty and the probability that counterparts exist; and on whether the view has any normative upshot beyond instrumental rationality, for example whether it could ground obligations to create or accommodate possible cooperators. Return only a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion, and do not ask for citations or a reading list.
reasoning: |-
  Okay, the user is preparing an episode for a technically inclined philosophy podcast and needs exactly five interview questions for a guest philosopher who advocates "evidential cooperation in large worlds." This view suggests that agents can cooperate acausally by adopting correlated policies, treating it as a decision theory result rather than a moral postulate. The user wants pointed questions that dig into the machinery, avoiding restatements of conclusions, and specifies five required topics: reference class/vacuity, decision theory foundations, parochialism, logical uncertainty, and normative upshots.

  Hmm, the user is clearly knowledgeable—they're using precise terminology like "functional decision theory" and "logical uncertainty," so the questions must match that rigor. They're likely time-pressed (podcast prep!) and need airtight questions to extract technical clarity. The unspoken need might be to test the theory's robustness on-air, since weak points could undermine their episode's depth.

  For the reference class question, I'll target how correlation avoids being trivial. The philosopher will probably say the reference class is defined by algorithmic similarity, so the follow-up asks why that doesn't collapse into self-fulfilling predictions. That cuts to the core.

  On decision theory foundations, I'll contrast EDT with functional approaches. Her answer will likely reject EDT's updating, so the follow-up pushes her to commit to a non-updating framework—essential since "updatelessness" is a key debate in acausal decision theory.

  For parochialism, I'll question whether cooperation extends beyond agents like us. She'll likely appeal to shared reasoning methods, but the follow-up demands why that isn't arbitrary, probing if the theory secretly relies on anthropocentrism.

  Logical uncertainty needs to cover counterpart existence. She might invoke universal priors, so the follow-up asks how to handle conflicting priors—a headache for any theory involving logical induction.

  Finally, normative upshots: I'll ask if this creates obligations. Her answer will likely say no, it's instrumental, but the follow-up presses whether that instrumental goal could *become* normative, hinting at moral implications she might want to dodge.

  Each follow-up anticipates her likeliest dodge and corners her into technical specifics. No fluff—just numbered items as requested. Podcast listeners will want this precision!
answer: |-
  Here are five interview questions meeting your specifications:

  1.  **To avoid vacuity, how do you precisely define the reference class of "counterparts" whose policies correlate with one's own?** Given that you likely define it via shared decision algorithms, why doesn't that make cooperation self-fulfilling rather than evidential?
  2.  **Does evidential cooperation require abandoning standard Evidential Decision Theory (EDT) and its updating process?** If you argue it needs a functional or "updateless" framework, how does specifically freezing the policy choice prevent EDT's self-undermining in these acausal scenarios?
  3.  **How does your view avoid the parochialism objection, where cooperation only extends to agents whose decision processes are algorithmically similar to ours?** Doesn't prioritizing similarity in reasoning methods arbitrarily privilege agents like us, limiting universal applicability?
  4.  **How do you incorporate logical uncertainty and the prior probability that suitable counterparts even exist into the decision to cooperate?** If you use a universal prior over logical possibilities, how do you handle agents using different priors or facing extreme uncertainty about counterpart existence?
  5.  **Beyond instrumental rationality for achieving one's fixed goals, does evidential cooperation in large worlds generate any distinct normative obligations, such as to create potential cooperators?** If you say it's purely instrumental, could the instrumental value of cooperation ever ground a derivative normative reason to accommodate or enable counterparts?
