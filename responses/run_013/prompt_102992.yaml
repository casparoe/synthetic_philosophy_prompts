prompt: |-
  ok I need help getting clear on something before I read one more paper about it. The whole "false assumptions are fine" line — Friedman's as-if move, where a theory's assumptions being unrealistic is supposedly no vice as long as the predictions come out right — I can never realy tell if I buy it, because I also can't shake the feeling that an explanation built on something false is just broken. And the cases cut both ways. So before I pick a side I want the spec, not the verdict.

  Give me the desiderata: what any adequate account of when an idealization / unrealistic assumption in a model is legitimate has to deliver. Not "here's Friedman, here's the standard reply" — the requirements list, and for each requirement the case or consideration that forces it.

  Some things I want it to handle, off the top of my head, but tell me if any of these aren't actually requirements:

  - the frictionless plane, the ideal gas, the point mass — assumptions that are flatly false and that nobody thinks make the model worthless;
  - whatever seperates a *harmless* idealization from a *distorting* one — e.g. assuming zero friction is fine for projectile motion, but assuming zero air resistance when the very phenomenon you're explaining is drag is not;
  - the fact that "the assumption is unrealistic" is doing at least three different jobs in these debates — sometimes it means "it's a good approximation," sometimes "the theory isn't claiming to apply here," sometimes just "it's a heuristic stepping stone" — and an account that collapses those into one is probably wrong;
  - cases where you *can't* de-idealize (no known way to add the missing physics back) but the model still seems to teach you something real.

  And here's a distinction I half-invented that I want you to stress-test rather than just nod at: call an assumption *load-bearing* if changing it would flip the sign or wreck the order of magnitude of the thing you're trying to explain, and *scaffolding* if it's only there so the math goes through. My hunch is scaffolding falsehoods are almost always fine and load-bearing ones almost never are — but I can't tell if that's a real distinction or just "can you de-idealize" wearing a costume.

  Then: which of the requirements are non-negotiable and which are just preferences of one camp (the pure-prediction crowd vs the people who want models to explain, the isolationists, and so on), and whether some subset of them is jointly unsatisfiable — that's the part I most want, if the list itself turns out to be a result. Also tell me which single requirement does the most damage to the most contenders, and score the obvious candidates (the as-if/prediction view, the "it's a good approximation" view, the "not claiming to apply there" view, the "isolate the causally relevant factors" view) against the list, briefly — I dont need the full scorecard, just where each one dies.

  Finally, be honest about how confident you are, and tell me what would change your mind: which case or argument, if it went the other way, would move you off your verdict on which of the requirements are real.
reasoning: |-
  Okay, the user is diving deep into the philosophy of science, specifically the legitimacy of false assumptions in scientific models. They're frustrated with the Friedman "as-if" approach and want clarity before reading more papers. They need a structured list of desiderata that any adequate account must satisfy, not just summaries of existing arguments. 

  Hmm, they listed several cases: frictionless planes, ideal gases, point masses—classic examples where unrealistic assumptions work. They also want to distinguish harmless vs. distorting idealizations, untangle the different meanings of "unrealistic," and address models that can't be de-idealized but still provide insights. Their "load-bearing vs. scaffolding" distinction is intriguing—I should test its viability.

  The user’s tone is analytical but impatient ("before I pick a side I want the spec"). They’re likely a grad student or researcher in philosophy/physics/economics, tired of superficial takes. Their unspoken need: a rigorous framework to evaluate competing views without getting stuck in circular debates. They also hint at wanting to resolve their cognitive dissonance—why do some false assumptions feel acceptable while others seem like dealbreakers?

  For desiderata, I’ll start with non-negotiables: predictive adequacy (without it, science fails), explanatory fidelity (models must latch onto reality somehow), and domain circumscription (where the model applies/breaks). Then add negotiable ones like de-idealizability or heuristic value—these matter but aren’t universal. The load-bearing/scaffolding distinction? It’s useful but not airtight; sometimes scaffolding *is* load-bearing in subtle ways (e.g., frictionless planes enabling conservation laws). 

  Friedman’s "as-if" view dies on explanatory fidelity—it dismisses assumptions as irrelevant. The "good approximation" view fails when models work *despite* bad approximations (e.g., point masses). The causal isolation view struggles with irrecoverable idealizations (e.g., rational expectations in macro). The biggest killer requirement is explanatory fidelity: if a model can’t gesture toward underlying mechanisms, it’s just a black box.

  My confidence is high on the core desiderata—they’re grounded in scientific practice. But if someone showed a model with false load-bearing assumptions that *reliably* guides new discoveries (beyond curve-fitting), I’d rethink explanatory fidelity. User’s half-invented distinction? Sharp but needs refinement—maybe call it "structural" vs. "instrumental" idealizations instead.
answer: |-
  Here's a breakdown of the core desiderata for evaluating idealizations/unrealistic assumptions, grounded in scientific practice and philosophical tension points. These are the requirements a compelling account *must* satisfy, derived from the cases you mention and the inherent demands of scientific explanation.

  **Core Desiderata (Non-Negotiables):**

  1.  **Predictive/Explanatory Adequacy (The Core Function):**
      *   **What it must deliver:** The model must generate sufficiently accurate predictions or explanations *for the specific phenomena and level of precision required within its intended domain of application*.
      *   **Case forcing it:** *Any scientific model.* This is the *raison d'être*. If a model consistently fails to predict/explain its target phenomena (like assuming zero drag when explaining drag itself), it's rejected. "Adequacy" is context-dependent (e.g., Newtonian gravity is adequate for spacecraft trajectories but not Mercury's orbit).
      *   **Why non-negotiable:** Without this, it's not science, it's fiction.

  2.  **Explanatory Fidelity (Beyond "As-If"):**
      *   **What it must deliver:** The model must latch onto *some aspect* of reality that provides genuine understanding, not just predict. This aspect must be robust under relevant de-idealization or variation. It cannot be *fundamentally misleading* about the core causal structure or mechanisms *relevant to the explanation sought*.
      *   **Case forcing it:** **The Distorting vs. Harmless Idealization Distinction.**
          *   *Harmless:* Frictionless plane for block acceleration. Neglecting air resistance isolates gravity/inertia as the core mechanism for *that specific phenomenon*. Adding friction later confirms this robustness.
          *   *Distorting:* Assuming perfect competition to explain persistent monopoly profits. The assumption *directly contradicts* the core phenomenon being explained. The model predicts equilibrium where none exists in reality *for the reason in question*. It misrepresents the causal structure.
      *   **Why non-negotiable:** Science aims for understanding, not just prediction. A model built entirely on false premises that *conceal* the real causes (like epicycles hiding heliocentrism) fails as an explanation, even if it predicts.

  3.  **Domain Circumscription (Boundary Clarity):**
      *   **What it must deliver:** The model/user must clearly (implicitly or explicitly) define the *scope* and *limitations* of the model – where the idealizations are reasonable approximations and where they break down catastrophically. It must acknowledge the conditions under which its assumptions fail.
      *   **Case forcing it:** **The "Not Claiming to Apply Here" vs. "Good Approximation" Distinction.** Failure leads to misapplication.
          *   Ideal Gas Law: Excellent approximation for many gases at moderate T/P. Explicitly breaks down at high P/low T (condensation, intermolecular forces dominate).
          *   Newtonian Physics: Excellent for terrestrial speeds/masses. Explicitly breaks down at relativistic speeds/cosmological scales.
          *   *Contrast:* Applying rational agent models to contexts dominated by systematic cognitive biases *without acknowledging the model's limitations* is a failure of domain circumscription.
      *   **Why non-negotiable:** Prevents overextension and misinterpretation. A model without boundaries is useless or dangerous.

  **Important, But Potentially Negotiable/Context-Dependent Desiderata:**

  4.  **De-Idealizability (Path to Reality):**
      *   **What it might deliver:** There should be a conceptual or mathematical pathway (even if complex) to remove the idealization and incorporate more realistic elements, yielding a more accurate model *without destroying the core explanatory insight*.
      *   **Case forcing consideration:** **The Frictionless Plane & Irrecoverable Models.**
          *   Frictionless plane: Easily de-idealized by adding friction terms. The core insight (F=ma) remains valid.
          *   *Irrecoverable:* Some highly abstract economic models, certain quantum field theory techniques (e.g., renormalization group flow from unrealistic fixed points), agent-based models with stylized rules. They *can* provide genuine insight (e.g., understanding phase transitions, emergent complexity) even if there's no direct mathematical path to add "realistic microfoundations" without fundamentally changing the model type.
      *   **Why potentially negotiable:** While highly desirable and often present in the best models (supporting Explanatory Fidelity), irrecoverable models *can* still satisfy (1), (2) (if they latch onto *some* robust aspect, like universality classes or stable aggregate patterns), and (3). Demanding strict de-idealizability might rule out genuinely useful, albeit highly abstract, tools. The key is whether the *insight* survives conceptual refinement, even if the math changes drastically.

  5.  **Heuristic/Exploratory Value:**
      *   **What it might deliver:** The idealization serves as a productive starting point, simplifying complex reality to make initial exploration, derivation, or conceptualization possible, even if the final model needs refinement.
      *   **Case forcing consideration:** **The "Heuristic Stepping Stone" Use.** Point masses in gravity, frictionless pendulums, perfectly rational agents in early game theory. These are often *scaffolding* (see below) that enables the derivation of core principles later shown to be robust.
      *   **Why potentially negotiable:** This is often a *pragmatic* virtue supporting the *development* of models that eventually satisfy the core desiderata. A model that *only* has heuristic value and never progresses towards adequacy/fidelity/circumscription is ultimately unsatisfactory as science (though potentially useful pedagogically).

  **Stress-Testing "Load-Bearing" vs. "Scaffolding":**

  *   **Your Distinction:** Load-bearing = Changing it flips sign/wrecks magnitude of core result. Scaffolding = Only there for mathematical/pragmatic convenience.
  *   **Strengths:** Captures an important intuition. Friction for projectile motion *without drag* is scaffolding. Zero drag *for explaining drag* is catastrophically load-bearing. Ideal gas constant `R` is scaffolding; neglecting intermolecular forces is load-bearing for explaining liquid behavior but scaffolding for high-T gas pressure.
  *   **Weaknesses/Potential Overlap:**
      *   **Context Dependence:** What is scaffolding in one context (point mass for orbital period) becomes load-bearing in another (point mass for tidal forces or structure formation).
      *   **"Scaffolding" Can Hide Load-Bearing Structure:** Sometimes the "convenient math" (e.g., assuming Gaussian distributions, linearity) *is* what makes the core result possible. Changing it might fundamentally alter the *type* of result, even if the specific magnitude prediction changes smoothly. Is that "scaffolding" or "load-bearing"?
      *   **Connection to De-idealization:** Scaffolding often *can* be removed/replaced without destroying the core insight (supporting de-idealizability). Load-bearing falsehoods often *cannot* be removed without major revision (threatening fidelity if they are indeed false *and* essential). But it's not identical: irrecoverable models might rely on scaffolding that *can't* be practically removed yet still provide robust insight.
  *   **Verdict:** A **valuable heuristic distinction**, often correlated with harmlessness vs. distortion and with de-idealizability, but **not a fundamental or sufficient criterion on its own.** It needs grounding in the core desiderata (especially Explanatory Fidelity and Domain Circumscription). A false load-bearing assumption that *nevertheless* yields robust predictions/insights across its domain (satisfying 1, 2, 3) might be acceptable *if* it's the best available representation of a complex reality (e.g., some effective field theories).

  **Where Major Views Fail (The Scorecard - Death Blows):**

  1.  **Friedman's Strict "As-If" / Prediction-Only View:** Focuses solely on (1) Predictive Adequacy. **Dies on Explanatory Fidelity (2).** It provides no basis to distinguish harmless frictionless planes from distorting perfect-competition-for-monopoly, nor does it require Domain Circumscription (3). It licenses models that predict well by accident or by misrepresenting core causes.
  2.  **Naive "Good Approximation" View:** Focuses on (1) and weak (2)/(3). **Dies on Irrecoverable Models (4 consideration) and Domain Circumscription (3).** Many successful idealizations (point masses, infinite limits in stat mech) are *not* close numerical approximations to reality at the level of the assumption itself, yet the *results* are adequate. It also struggles to articulate *when* an approximation is "good enough" and *where* it breaks down without a deeper criterion.
  3.  **Strict "Not Claiming to Apply Here" / Isolationism:** Focuses heavily on (3) Domain Circumscription. **Dies on Explanatory Fidelity (2) and the Load-Bearing/Scaffolding distinction.** Simply stating a model doesn't apply to situation X doesn't absolve it if its *core assumptions* are fundamentally misleading *about the very phenomena it purports to explain within its claimed domain*. Isolationism without fidelity can become evasion.
  4.  **"Isolate Causally Relevant Factors" View (e.g., some mechanism-based views):** Focuses on (2) Explanatory Fidelity. **Generally strongest, but can struggle with Irrecoverable Models (4) and sometimes Predictive Adequacy (1) in complex systems.** It excels at distinguishing harmless vs. distorting idealizations. However, it can be overly restrictive if it demands *directly* isolatable mechanisms for phenomena where only highly abstract or irrecoverable models provide adequate prediction/insight (e.g., some emergent phenomena in complex systems). It might undervalue purely predictive models that are stepping stones (5).

  **The Killer Requirement: Explanatory Fidelity (2).**

  This does the most damage. It's what separates science from instrumentalist curve-fitting. Friedman ignores it completely. The "Good Approximation" view often conflates it with numerical closeness. Isolationism can use it as a fig leaf. Even causal views live or die by how well they articulate it. A model satisfying (1) and (3) but failing (2) is technically useful but explanatorily hollow or misleading.

  **Confidence & Mind-Changers:**

  *   **Confidence:** High (8/10) on the **necessity** of the core three (Predictive/Explanatory Adequacy, Explanatory Fidelity, Domain Circumscription). They are grounded in the fundamental goals of science and the empirical failures of models that lack them. High (7/10) that De-Idealizability and Heuristic Value are important but secondary/negotiable virtues in many contexts.
  *   **Mind-Changers:**
      *   **If a "False Load-Bearing" Model Demonstrably *Led* to Fundamental New Understanding:** Suppose a model based on an assumption later proven fundamentally false *and* load-bearing (changing it destroys the result) *consistently* guided successful novel predictions and the discovery of *entirely new domains* of phenomena *before* the assumption was corrected. This would challenge the primacy of Explanatory Fidelity as articulated, forcing a refinement (e.g., emphasizing robustness *across domains* or predictive fertility more strongly). (Epicycles are the counter-example - they didn't lead to fundamentally *new* understanding beyond prediction).
      *   **If Irrecoverable Models Consistently *Failed* to Generate Robust Insights:** If models that couldn't be de-idealized were shown to be scientific dead-ends, consistently failing to integrate with other knowledge or guide new discoveries beyond their narrow fit, it would strengthen the case for De-Idealizability as a core requirement.
      *   **A Compelling Account of "Understanding" Without Fidelity:** If someone articulated a robust concept of scientific understanding that was *entirely* predictive or instrumental, making Explanatory Fidelity redundant or incoherent, that would force a major rethink. (I find this highly unlikely given scientific practice).

  The core tension is between prediction and understanding. The desiderata reflect that **any adequate account must show how idealized models can *both* predict successfully *and* provide genuine understanding of the world, while honestly acknowledging their limits.** No major view fully succeeds; the "Isolate Causal Factors" view comes closest but needs flexibility for abstraction and irrecoverability. Your "load-bearing" distinction is a useful practical tool within this framework.
