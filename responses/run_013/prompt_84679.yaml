  = [ (1/(1+1e12)) * 1 ] / [ (1/(1+1e12)) * 1 + (1e12/(1+1e12)) * (1e-12) ]
  = [ 1/(1+1e12) ] / [ 1/(1+1e12) + 1e12/(1+1e12) * 1e-12 ]
  = [ 1/(1+1e12) ] / [ 1/(1+1e12) + 1/(1+1e12) ]
  = [1/(1+1e12)] / [2/(1+1e12)] = 1/2

  So SIA (Rule 2) gives 1/2, while Rule 1 gave approximately 1.

  Therefore, in this case, they conflict.

  Rule 1 (without adjusting the prior) says after seeing room number 1, it's almost certainly heads.

  Rule 2 (SIA) says after seeing room number 1, it's still 1/2.

  So they are rivals.

  In the room number case:

  - Rule 1: P(heads | room#=1) ≈ 1
  - Rule 2: P(heads | room#=1) = 1/2

  Now, what is the correct answer? That's debatable.

  But to answer the original request:

  - Rule 1 is a principle about being a random sample from the actual observers.
  - Rule 2 (SIA) is a principle about adjusting the prior probability of a world by the number of observers it contains.

  Rule 1 buys you a direct way to account for selection effects: you are more likely to find yourself in a world with more observers. Rule 2 buys you a way to account for the same selection effect by changing the prior.

  They are true rivals because they return different verdicts when there is additional evidence like a birth rank.

  In the case without additional evidence, they agree.

  In the demon case with two coins, both rules gave the same answer (favoring tails) because there was no additional evidence beyond existence.

  Regarding the reduction of Rule 2 to Rule 1 with an inflated reference class: in the room number case, if we try to use Rule 1 with a reference class that includes both actual and possible observers, we would include the one observer in heads and the 1e12 in tails, but also include the observers that would have existed if the coin had landed differently? In this case, the coin flip is part of the setup, so there are no other possible observers. Therefore, the reference class is the same as in Rule 1. So it doesn't work.

  Rule 2 (SIA) is not simply Rule 1 with an expanded reference class. It is a different way to set the prior.

  In conclusion:

  - Both rules update on existence in the same way, by favoring worlds with more observers.
  - When there is additional evidence (like a birth rank), Rule 1 updates to favor worlds where that evidence is more likely (which are worlds with fewer observers), while Rule 2 (SIA) has already favored worlds with more observers in the prior, and the birth rank evidence is designed to be neutral under SIA.

  So they are two distinct methods that can conflict.
