answer: |-
  Here’s a framework for your analysis, treating the Pluto debate as a microcosm of the natural kinds controversy. The core tension: **identical facts, divergent categories, enforced by vote**. Does this reveal planet-hood as a human construct, or is there a deeper natural kind being discovered?

  ---

  ### **Part 1: Theory → Case (What Each Natural Kind Position Predicts for Pluto)**

  1.  **Essentialism (Fixed Essence):**
      *   **Position:** Planets share a necessary/sufficient intrinsic essence (e.g., spherical shape due to hydrostatic equilibrium, orbiting a star).
      *   **Prediction for Pluto:** Pluto *is* a planet. It meets the intrinsic criteria. The dynamical criterion (orbital dominance) is arbitrary, not essential. The IAU vote was a mistake, overriding nature’s joints.
      *   **Weakness Exposed:** Why *these* essential properties? Why not include orbital dominance? Essentialism struggles when multiple candidates (size, shape, orbit) seem equally plausible.

  2.  **Cluster Kinds / Homeostatic Property Clusters (HPC):**
      *   **Position:** Kinds are stable clusters of co-occurring properties held together by underlying mechanisms (e.g., gravity causing sphericity + formation mechanisms shaping orbits).
      *   **Prediction for Pluto:** Ambiguous. Pluto clusters *some* properties (sphericity, sun-orbit) but lacks others (orbital dominance, formation history like terrestrial/giant planets). The debate *is* the scientific process of identifying the most causally significant cluster. The IAU chose one cluster definition (dynamical dominance as key mechanism).
      *   **Weakness Exposed:** What determines the "most significant" cluster? Is orbital dominance causally more fundamental to planetary evolution than sphericity? The vote exposes subjectivity in weighting cluster features.

  3.  **Interest-Relativity / Pragmatic Pluralism:**
      *   **Position:** Kinds are tools for human purposes. Different classifications serve different epistemic or practical goals. "Planet" can mean different things in different contexts.
      *   **Prediction for Pluto:** *Both sides are "right"* depending on the goal. Dynamicists want a category reflecting orbital architecture/crowding for solar system dynamics. "Intrinsicists" want a category based on geophysical complexity for comparative planetology. The IAU chose a definition useful for one specific purpose (inventorying bodies in solar systems).
      *   **Weakness Exposed:** Does this reduce science to mere convention? Why did the vote feel like a *loss* to planetary scientists? It struggles to explain the intense conviction that one definition is "correct."

  4.  **Eliminativism / Skepticism:**
      *   **Position:** "Natural kinds" are a myth. All categories are human impositions on a continuous or disordered reality. Science reveals patterns, not pre-existing joints.
      *   **Prediction for Pluto:** The whole debate is pointless. Pluto is just a Kuiper Belt Object (KBO). The IAU vote is no more or less valid than any other convention. The fight reveals the futility of seeking a "true" planet category.
      *   **Weakness Exposed:** Why does the *specific* debate persist so fiercely? Why do intrinsic properties feel more "natural" than orbital ones? It dismisses the intuition that some distinctions (spherical vs. lumpy) *do* mark significant physical transitions.

  **The Dynamical Criterion's Unique Status:** Yes, it *is* fundamentally different. Intrinsic properties (size, shape, composition) describe the *object itself*. The dynamical criterion describes its *relationship* to its environment and history. HPC might link dominance to formation mechanisms, but pragmatists see it as a useful filter. Essentialists see it as irrelevant. This difference is the fault line.

  **Can Astronomers Stipulate a Kind?** Yes, according to Pragmatists and Eliminativists – categories *are* stipulations. Essentialists/HPC advocates say they can only *discover* the kind; a vote can be *wrong* if it contradicts the underlying essence/cluster.

  **"Wrong" in What Sense?** For Essentialists/HPC: Wrong because it misrepresents a natural division. For Pragmatists: Wrong if it fails its intended purpose or ignores relevant scientific communities' needs. For Eliminativists: Wrong only in being inconsistent with another convention.

  ---

  ### **Part 2: Case → Theory (What Pluto Does to Natural Kind Positions)**

  *   **Embarrasses Essentialism:** The lack of consensus on *the* essential property (shape? orbit clearance? primary star?) and the arbitrariness of drawing the line *somewhere* (why not Ceres? why not Eris?) weakens the claim of a discoverable essence. The vote highlights the negotiation involved.
  *   **Challenges HPC:** Pluto sits at the fuzzy boundary. It shares *some* properties with the "planet" cluster (geophysics) and *some* with the "KBO" cluster (dynamics/origin). The case exposes that identifying *the* core causal mechanism defining the cluster is non-trivial and contested. Does orbital dominance *cause* other planetary features, or is it a consequence?
  *   **Strengthens Pragmatic Pluralism:** The clearest winner. The persistence of "planet" in planetary science contexts (ignoring IAU for geophysics) vs. dynamical astronomy validates multiple useful definitions. The IAU vote *was* a pragmatic decision for cataloging. Your "weed" analogy is **spot-on**: "Planet" functions like "weed" – its boundaries depend on context (astronomical dynamics vs. geophysical interest) and human goals (inventory vs. studying complex worlds), not a single intrinsic essence. *This doesn't kill natural kinds entirely*, but suggests "planet" might be a *human-centered kind*, not a fundamental physical one like atomic elements.
  *   **Embarrasses Eliminativism:** While it highlights conventionality, the intense debate and the *physical significance* of distinctions like hydrostatic equilibrium (spherical bodies are geologically active!) suggest some boundaries *are* more natural/causally important than others. Eliminativism risks throwing the baby out with the bathwater.

  ---

  ### **Conclusion: The Survivor and the Abyss**

  *   **The Survivor (Most Resilient): Pragmatic Pluralism.** The Pluto saga is its textbook case. "Planet" is a useful category, but its definition depends on what you're trying to explain or achieve. Planetary scientists studying geology *need* "planet" to include Pluto. Dynamicists studying solar system architecture *need* a stricter definition. Neither is objectively wrong; they have different projects. Your "weed" analogy is powerful and defensible.
  *   **The Abyss (Where Theory Runs Out):** Philosophy gets us to the edge, but can't dictate which pragmatic definition *should* prevail in a given context or carry cultural weight. **The IAU vote wasn't a discovery of a natural kind; it was a political/social decision to prioritize *one* scientific goal (dynamical taxonomy) over others (geophysical taxonomy) for a specific purpose (official nomenclature).** Reporting the committee's decision in Prague is essential because that *is* the social fact that settled the *official* designation, even if it doesn't settle the scientific utility or the deeper ontological question.
  *   **The Takeaway:** The Pluto fight suggests that **"planet" is not a fundamental natural kind like "electron" or "gold."** It's a higher-level, interest-relative category – perhaps a "scientific kind" or "special science kind," useful but context-dependent, like "weed," "mountain," or even "species" in some contexts. The bad news for those wanting "planet" to be a natural kind is that the evidence points away from it. The good news is that recognizing its pragmatic nature liberates us to use the best definition for the job at hand, scientifically and communicatively, without pretending one is written in the cosmos. The debate endures precisely *because* there is no single, pre-existing joint to carve.
