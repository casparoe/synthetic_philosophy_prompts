prompt: |-
  I cover science and ideas for a mid-size daily, which in practice means I've spent alot of the last few years sitting in on committee meetings — juries, hiring panels, grant boards, a faculty disciplinary hearing, that kind of thing. I keep coming out of these rooms with a gut reaction about whether the decision was legit or whether somebody pulled a fast one, and I've definately noticed that my gut is inconsistent with itself. I was hoping you could tell me what principle is doing the work, or if there isn't one, which of my calls I should give up.

  Here's the raw material.

  (1) A three-person faculty panel deciding whether a student fails a course for plagiarism. Questions: did he copy? does copying warrant failure? should he fail? Panellist A: yes, yes, yes. B: yes, no, no. C: no, yes, no. Majority verdict: he copied, copying warrants failure, he doesn't fail. My gut: that's a flat contradiction, not a quirk. If they won't fail him they have to unsay one of the other two.

  (2) Same three people, same opinions, but the dean tells them to vote only on "fail or not fail" and write up reasons afterwards. They don't fail him. My gut: fine. Decision made, next case.

  (3) Three friends buying a house together. Questions: does the roof need replacing? if the roof needs replacing, is the asking price too high? is the asking price too high? Same 2-1 pattern as (1). They buy the house. My gut: no problem at all. Their call.

  (4) A legislature where a bill passes on the strength of a different majority behind every clause, so no bloc actually supports the bill as a whole. My gut: fine, that's what a coalition is.

  (5) A search committee ranking five finalists, where the majority ranking runs in a circle: a majority prefers A to B, a majority prefers B to C, and a majority prefers C to A. My gut: odd, it needs a runoff or the chair's call, but not incoherent in the way (1) is.

  (6) An election I covered: the winning party took about 60% of the vote while more than half the voters were against each of its three headline policies, because voters weigh the policies differently and will back a party whose planks they mostly reject. My gut: the result stands, but every "mandate" sentence in our coverage was nonsense.

  (7) A board that lands on a completely coherent, well-reasoned position — because the chair chose the order in which the questions were put to the vote, and a different order would have produced the opposite result. My gut: con, even though nothing they concluded contradicts anything else they concluded.

  (8) Me, over fifteen years. My old self's views contradict my current ones on several things. My gut: no problem, that's just changing your mind.

  My own stab at a rule: a group gets to have a verdict of its own only when it's functioning as a single agent — there's a procedure for it to revise its view, it can be asked to defend the verdict, and it's stuck with it — and when it isn't functioning that way we should report it as a poll, not a verdict. But that doesn't obviously separate (1) from (3), since both are just three people and a decision.

  What I want: the principle, or two or three rivals, stated precisely enough that I could apply them at the next meeting, with a note on which of my cases each clause is there to save; which of my gut calls each candidate keeps and which it throws overboard; and an honest statement of which call I can't keep. Take a case I haven't listed and tell me what your favourite candidate says about it. And if the real answer is that my gut is tracking two different things and there's no single rule, say that, and tell me which two of my verdicts are the ones genuinely in conflict.
reasoning: |-
  Hmm, this science journalist has presented a fascinating puzzle about decision-making inconsistencies. They've observed eight scenarios where their "gut feeling" about the legitimacy of group decisions varies, even when the voting patterns seem similar. I need to help them identify the underlying principle or principles that explain these reactions.

  The journalist's proposed rule about "single agent" vs "poll" doesn't fully capture their intuitions, particularly why they reject case (1) but accept case (3). The key difference seems to be about functional unity. In the plagiarism hearing (1), the panel is acting as an official body expected to produce a logically consistent judgment, while in the house-buying scenario (3), it's just three individuals making a collective choice without institutional obligations.

  For case (7) where the chair manipulates the voting order, the journalist feels it's illegitimate despite logical consistency. This suggests procedural fairness matters more than just outcome coherence. And in the election case (6), they accept the result but reject claims of a mandate, highlighting how we interpret collective decisions differently based on context.

  The Condorcet paradox in case (5) feels odd but acceptable because it's recognized as a known limitation of voting systems. Case (8) about personal opinion change is fundamentally different because individuals aren't expected to maintain simultaneous consistency over time.

  I think the journalist's gut is tracking two distinct dimensions: functional unity (is this body acting as a single agent?) and procedural legitimacy (was the process fair and coherent?). Their discomfort arises when there's a mismatch - like in case (1) where a unified body produces an incoherent result, or case (7) where a coherent result comes from manipulative procedures.

  For a new case - say a jury delivering logically inconsistent verdicts on related charges - my framework would flag this as illegitimate because juries are high-unity bodies where internal consistency is paramount. The journalist's gut would likely agree, completing the pattern we've observed across their examples.
answer: |-
  Your gut is tracking **two distinct principles** simultaneously, creating the inconsistency. The key isn't whether the group is a "single agent" in the abstract, but **what kind of "rational unity" we demand from the decision-making entity based on its function and context**. Here are the rival principles, precisely stated, with their applications to your cases:

  ---

  ### **Principle 1: Logical Coherence as a Requirement (The "Single Mind" Standard)**
  *   **Definition:** *When a group is acting as a rational unitary agent expected to produce a single, internally consistent justification for its final verdict, the logical implications of its premises must align with its conclusion. Contradictory premises supporting a conclusion invalidate the verdict.*
  *   **Applies to:** Bodies acting judicially, quasi-judicially, or as expert arbiters where the *reasoning process itself* is integral to the legitimacy of the outcome. The verdict must be defensible as the product of a single rational mind, even if formed by multiple people.
  *   **Saves:** (1), (7) (partially).
  *   **Rejects:** (2), (3), (4), (5), (6), (8).
  *   **Your Cases:**
      *   **(1) Plagiarism Panel:** **Illegitimate.** The premises ("copied", "copying warrants failure") logically compel the conclusion "he fails". The majority verdict ("doesn't fail") contradicts the logical implication of its own stated premises. The panel failed its function as a rational arbiter.
      *   **(7) Chair-Manipulated Coherence:** **Illegitimate ("Con").** While the final position *is* coherent, the *process* violated the requirement for the group to function as a unitary rational agent. The outcome reflects the chair's manipulation, not the group's considered, stable judgment. It lacks genuine rational unity.
      *   **(2) Dean's Order:** **Legitimate ("Fine").** The group was explicitly *not* tasked with forming a single, justified verdict beforehand. Voting on the outcome alone, without binding themselves to coherent prior premises, is acceptable for efficiency. Post-hoc reasons are justifications, not constitutive elements of the verdict.
      *   **(3) Friends Buying House:** **Legitimate ("No problem").** They are not a formal unitary agent bound by judicial standards. They are individuals compromising, trading off priorities, or applying personal weightings inconsistently to reach a collective action. Their internal logic doesn't need scrutiny.
      *   **(5) Circular Ranking:** **Legitimate ("Not incoherent like (1)").** While intransitive rankings are problematic for establishing a clear "best" choice, they don't represent a *logical contradiction* in the verdict itself (the ranking exists). It highlights a system limitation needing resolution, not a failure of the committee's rational agency *in this specific flawed vote*.

  ---

  ### **Principle 2: Procedural Legitimacy & Collective Action (The "Social Choice" Standard)**
  *   **Definition:** *When a group is acting primarily as a mechanism for aggregating preferences or authorizing collective action, legitimacy derives from adherence to fair, pre-defined procedures – not the internal logical consistency of the outcome or the individual voters' reasoning. The outcome stands if the process was followed.*
  *   **Applies to:** Legislative bodies, elections, referenda, committees making final choices (not justifications), or groups taking collective action based on aggregated votes.
  *   **Saves:** (2), (3), (4), (5), (6).
  *   **Rejects:** (1), (7).
  *   **Your Cases:**
      *   **(2) Dean's Order:** **Legitimate.** A clear procedure (vote on outcome only) was defined and followed.
      *   **(3) Friends Buying House:** **Legitimate.** They agreed on a process (majority vote on questions?) and took collective action based on the result. Their internal inconsistencies are irrelevant to the action's validity.
      *   **(4) Coalition Legislation:** **Legitimate.** Standard legislative procedure allows clause-by-clause voting. The bill as enacted is legitimate if passed per rules, regardless of whether any single bloc supports all of it.
      *   **(5) Circular Ranking:** **Legitimate.** The procedure (majority pairwise comparisons) was followed, producing a result (even if flawed). The need for a runoff acknowledges the procedure's limitation *for the next step*, not the illegitimacy of *this* vote.
      *   **(6) Election Result:** **Legitimate ("Result stands").** The election procedure determined the winner based on votes cast. Voters are free to have complex, inconsistent preferences; the aggregation mechanism (FPTP, PR, etc.) defines legitimacy, not policy coherence. (Your gut correctly rejects the "mandate" claim, which *would* improperly invoke Principle 1).
      *   **(1) Plagiarism Panel:** **Illegitimate.** Even if procedurally sound (majority vote per question), the *function* (judicial/quasi-judicial) demands Principle 1 (logical coherence) over Principle 2. The contradictory outcome violates its core purpose.
      *   **(7) Chair-Manipulated Coherence:** **Illegitimate.** Procedural fairness was violated by the chair's manipulative sequencing, undermining the legitimacy of the *process*, even if the final outcome is coherent.

  ---

  ### **Principle 3: Diachronic Agency (The "Evolving Entity" Standard)**
  *   **Definition:** *Legitimacy for an entity (individual or group) evolving over time does not require consistency between past and present states, only that decisions at any single point in time meet the relevant standard (Principle 1 or 2) for that moment.*
  *   **Applies to:** Individuals changing their minds, groups whose membership or mandate changes over time.
  *   **Saves:** (8).
  *   **Rejects:** (N/A - This principle resolves the time-based conflict).
  *   **Your Case:**
      *   **(8) Your Old vs. New Self:** **Legitimate ("No problem").** You are not a unitary agent required to maintain eternal logical consistency. Each "verdict" (old view, new view) is assessed based on its own context and reasoning at the time it was held.

  ---

  ## Which Gut Calls Each Principle Keeps/Rejects

  | Your Case | Your Gut Verdict | Principle 1 (Single Mind) | Principle 2 (Social Choice) | Principle 3 (Evolving Entity) |
  | :-------- | :--------------- | :------------------------ | :-------------------------- | :---------------------------- |
  | (1) Plagiarism Panel | **Illegitimate** | Keeps (Illegitimate)      | Keeps (Illegitimate)        | N/A                           |
  | (2) Dean's Order | **Legitimate**   | Rejects (Accepts as Legit)| Keeps (Legitimate)          | N/A                           |
  | (3) Friends House | **Legitimate**   | Rejects (Accepts as Legit)| Keeps (Legitimate)          | N/A                           |
  | (4) Coalition Bill | **Legitimate**   | Rejects (Illegitimate?)   | Keeps (Legitimate)          | N/A                           |
  | (5) Circular Rank | **Legitimate**   | Keeps (Legitimate)        | Keeps (Legitimate)          | N/A                           |
  | (6) Election | **Legitimate**   | Rejects (Illegitimate?)   | Keeps (Legitimate)          | N/A                           |
  | (7) Chair Manipulation | **Illegitimate** | Keeps (Illegitimate)      | Keeps (Illegitimate)        | N/A                           |
  | (8) Changing Mind | **Legitimate**   | N/A                       | N/A                         | Keeps (Legitimate)            |

  *   **Note on (4) & (6):** Principle 1 *might* reject these as logically incoherent outcomes if applied strictly. Your gut (and Principle 2) correctly accepts them because they are fundamentally about procedural aggregation/action, not unitary justification.

  ---

  ## The Conflict and the Call You Must Give Up (or Refine)

  *   **The Core Conflict:** Your gut is torn between the **"Single Mind" standard** (logical coherence required for unitary rational agents like juries/panels) and the **"Social Choice" standard** (procedural legitimacy suffices for preference aggregation/collective action like legislatures/elections/house buys). **Case (3) (Friends) vs. Case (1) (Panel)** is the clearest conflict: identical voting patterns, but different gut reactions because the *function* of the group differs.
  *   **The Call to Give Up/Refine:** **Your gut on Case (6) (Election) is slightly inconsistent.** You accept the *result* (correctly, via Principle 2) but reject *any* "mandate" claim. This is mostly right. However, Principle 2 *does* allow claiming a "mandate to govern" or a "mandate to implement *their platform*" – that's what winning the election *means* procedurally. What you rightly reject (invoking Principle 1) is claiming a "mandate *for each specific policy*" or that the victory proves deep voter *agreement* with every policy. **Refine your stance:** Accept "mandate" in the procedural sense (authority to govern/pursue their agenda), but rigorously challenge any claim that the election result signals specific voter endorsement of individual policies lacking majority support.

  ---

  ## Applying the Framework: A New Case

  *   **Case:** A university tenure committee votes anonymously on three criteria: (A) Research Excellence, (B) Teaching Proficiency, (C) Service Contribution. University rules state tenure requires majority approval on all three criteria. A majority votes "Yes" on A, "Yes" on B, and "No" on C. The candidate is denied tenure.
  *   **Analysis:**
      1.  **Function:** This is a quasi-judicial body making a high-stakes, reasoned decision about an individual based on defined criteria. It is acting as a *unitary rational agent* expected to produce a justified outcome.
      2.  **Principle 1 (Single Mind):** **Legitimate.** The premises (A-Yes, B-Yes, C-No) directly lead to the conclusion (Deny Tenure) based on the explicit rule (Requires all Yes). There is no logical contradiction. The verdict aligns with the premises and the rule.
      3.  **Principle 2 (Social Choice):** **Legitimate.** Procedural rules were followed (majority vote per criterion, application of the tenure rule). The outcome is valid per process.
      4.  **Gut Prediction (Using Framework):** Your gut should find this **legitimate** (like Case 2, not Case 1). There's no contradiction between premises and conclusion. The denial follows logically from the "No" on C and the rule.

  **Conclusion:** There is no single rule. Your gut is tracking **functional context** (Is this body *supposed* to behave like a single rational mind justifying its conclusion?) versus **procedural aggregation** (Did the group follow the rules to make a choice or take action?). **Case (1) (Panel - Illegitimate)** and **Case (3) (Friends - Legitimate)** with identical voting patterns highlight this fundamental conflict. Your "single agent" intuition was close; the refinement is recognizing that "functioning as a single agent" specifically demands **logical coherence in justification** for certain bodies (judicial, disciplinary, expert panels) but not for others (legislatures, elections, ad hoc groups taking action). Apply this functional test first at your next meeting: *"Is this body expected to produce a verdict defensible as the product of a single, consistent rational mind, or is it primarily aggregating votes to authorize an action?"* That will guide whether Principle 1 or Principle 2 applies.
