answer: |-
  ### Structural Analysis of Supererogation and Suberogation

  #### **1. Compatibility with a Single Ordering**
  A unidimensional moral scale (e.g., a value continuum with a "requirement threshold") cannot symmetrically accommodate both categories without distortion.  
  - **Problem**: Supererogation occupies the space *above* the requirement threshold (optional but admirable), while suberogation occupies the space *below* the prohibition threshold (permissible but objectionable). A single threshold (e.g., "required vs. forbidden") forces us to treat both as symmetrical deviations from a deontic core, but this ignores critical asymmetries:  
    - Supererogation involves *positive, costly virtue* (heroism), while suberogation involves *negative, costless vice* (callousness).  
    - The moral "distance" from the neutral permissible (duty-fulfilling acts) to supererogation is typically larger than to suberogation. Wading into a flooded river demands extraordinary sacrifice; ignoring luggage requires only minor effort.  
  - **Resolution**: A ternary framework is essential:  
    - **Required** (duty), **Permitted** (neutral), **Forbidden** (wrong).  
    Supererogation sits *between* required and ideal goodness; suberogation *between* permissible and mild blameworthiness.  

  #### **2. Unity of Asymmetries: One or Two?**
  The asymmetries are **related but distinct**, not mere mirror images.  
  - **Shared Insight**: Both show that moral value ≠ deontic status.  
    - Supererogation: *Better than required* does not entail *required*.  
    - Suberogation: *Worse than minimally permissible* does not entail *forbidden*.  
  - **Distinction**:  
    - Supererogation reveals an *expansive* asymmetry: Morality encourages but does not demand maximal goodness.  
    - Suberogation reveals a *protective* asymmetry: Morality tolerates minor flaws without escalating to prohibition.  
    - **Key Difference**: Supererogation is *active virtue beyond duty*; suberogation is *passive vice within rights*. The former enriches moral life; the latter exposes moral laxity.  

  #### **3. Is Suberogation a Genuine Third Category?**
  Suberogation is **not merely the shadow of supererogation** and does not collapse into it.  
  - **Collapse Argument**: If suberogation = omitting supererogation, then *every* failure to be heroic would be suberogatory. But this is absurd: Most people omit heroism daily without being morally objectionable (e.g., not donating a kidney).  
  - **Defense of Suberogation**:  
    - Suberogatory acts are **positively objectionable** despite permissibility (e.g., the luggage case involves *active indifference* in a context of easy assistance).  
    - Supererogation omission is neutral *unless* context makes it suberogatory (e.g., refusing trivial help when no cost is incurred).  
    - **Verdict**: Suberogation is a distinct category—permissible acts that are *blameworthy* but not *blamable*. The distinction holds.  

  #### **4. Compatibility with Ethical Frameworks**
  - **Consequentialism**:  
    - **Supererogation**: Problematic. If an act maximizes good (e.g., saving a life at moderate risk), why isn’t it required? Consequentialism struggles to explain optional goodness.  
    - **Suberogation**: Fits better. Suboptimal acts (e.g., not helping with luggage) are permissible if they don’t violate rules, but still "objectionable" for failing to maximize good.  
  - **Kantianism**:  
    - **Supererogation**: Accommodates imperfect duties (e.g., beneficence), which allow latitude. Heroic acts exceed the minimum demanded.  
    - **Suberogation**: Incompatible. Kantianism ties permissibility to universalizability and respect. If an act is permissible, it cannot be inherently objectionable—only violations of duty are blameworthy.  

  ---

  ### **Case Application**
  1. **River Rescue (Supererogatory)**:  
     - Establishes that morality *values* extraordinary risk for others’ sake but does not *require* it. Heroism resides beyond duty.  
  2. **Luggage Omission (Suberogatory)**:  
     - Establishes that morality *permits* minor indifference (no duty violated) but *disvalues* it as morally shabby.  

  **Same Theoretical Machinery?**  
  Yes—both exploit the gap between **deontic status** (required/permitted/forbidden) and **aretaic evaluation** (admirable/neutral/objectionable). A unified framework can explain both using:  
  - A **ternary deontic structure** (required/permitted/forbidden).  
  - A **separate scalar evaluation** of moral admirability/blameworthiness.  

  ---

  ### **Final Verdict**
  Supererogation and suberogation are **two irreducibly distinct phenomena** within a single structural gap:  
  - They share a common root in the disconnect between *what morality demands* and *what morality values*.  
  - But they are not symmetrical:  
    - Supererogation embodies *aspirational morality* (how good we *can* be).  
    - Suberogation embodies *complacent morality* (how poor we *may* be without sin).  
  The gap is singular, but the phenomena occupying its poles differ in kind—one elevates, the other degrades, the moral landscape.
