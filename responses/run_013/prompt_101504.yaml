  Second, the asymmetry question: While both show that moral quality exceeds deontic status, they're not identical. Supererogation's "optional goodness" is about exceeding positive obligations, whereas suberogation's "permissible badness" concerns avoiding negative obligations. The former expands moral possibility upward; the latter reveals moral laxity downward. Same structural gap? Yes. Same phenomenon? No—direction matters.

  Third, the category status: Suberogation isn't just the shadow of supererogation. If it were, every failure to be heroic would make one suberogatory, which is absurd—most omissions of supererogation are neutral. Suberogation requires active objectionableness within permissible space (like the luggage case), not mere passivity. The categories hold because suberogation has distinctive features: it's positively criticizable despite being permissible.

  Fourth, axiological compatibility: Consequentialism struggles with supererogation because if an act maximizes good, why isn't it required? But it handles suberogation naturally—suboptimal acts that don't cross the harm threshold. Kantianism accommodates supererogation through imperfect duties but resists suberogation since duties set minimum standards—what's permissible shouldn't be blameworthy. 

  For the cases: The river rescue is supererogatory—admirable but undemandable. The luggage omission is suberogatory—not forbidden but morally shabby. Both exploit the requirement/value gap but in opposite directions. The same machinery (a ternary deontic framework with scalar evaluation) can handle both.

