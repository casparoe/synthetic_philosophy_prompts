prompt: |-
  I'm a software engineer on a team that builds tool-using agents for back-office operations — issuing refunds, making account changes, drafting customer communications — and I have no formal background in philosophy, so what I need is a decision procedure, not an exposition. Our design reviews keep relitigating the same question: should a given capability be built as a goal-directed agent that optimizes a stated objective (a scoring rubric, a success metric, a reward we hand-tune), or as an approval-directed agent that at each step selects the action it predicts a designated human approver would most approve of, given a description of that action? We currently settle this by whoever argues longest, and I'd like to replace that with something a review can actually run.

  Please write me an ordered procedure: the questions to ask, in sequence, for each new capability; what counts as a sufficient answer to each; where the procedure terminates in a recommendation for one design over the other; and where it must stop and hand the decision to a person because the question is one of values or risk appetite rather than engineering. It has to be usable by an engineer who has never read anything about this, and it should be honest about which of its steps are judgment calls wearing the costume of a procedure.

  Three distinctions from the underlying idea need to survive the translation, because they are the ones that keep biting us, and I want the procedure to say explicitly how each is handled rather than assuming it away. First, the difference between the approver's approval of the act as it is described to them, their approval of the act under its actual downstream consequences, and their approval of the policy that generated the act — the procedure should state which of these the agent is to be pointed at in a given case, and how to tell. Second, the gap between the human approver in the loop and the model of the approver that our system actually queries at runtime, including what to do when the two diverge and how to notice that they have. Third, the cases where approval is being used as a stand-in for something else we care about — customer welfare, legal exposure, a fairness commitment — and the conditions under which that substitution quietly breaks.

  Then run the procedure on three capabilities: an agent that decides refund exceptions up to a fixed dollar ceiling, with a support lead as approver; an agent that drafts and sends a re-engagement email to the whole customer base; and an agent that proposes edits to its own regression and evaluation suite, with the metrics owner as approver. I expect at least one of these to come out in a way I won't like; say so plainly rather than smoothing it over. Finally, state what the procedure cannot do, and where you expect it to misfire in practice.

  Constraints: it must be runnable inside a thirty-minute design review by people who are not specialists, it should name the role that has to sign off on each outcome, and it should not include reading lists, citations, or references to papers — anything of that sort is useless to me. Close by saying how confident you are in the procedure as a whole and in each load-bearing step, and single out the one step you are least sure of.
reasoning: |-
  We are designing a decision procedure for choosing between goal-directed and approval-directed agent designs. The procedure must be practical, usable in a 30-minute design review by non-specialists, and must explicitly handle three key distinctions:

  1. The distinction between the approver's approval of:
     a) The act as described
     b) The act under its actual downstream consequences
     c) The policy that generated the act

  2. The gap between the real human approver and the model of the approver used by the system, including how to notice and handle divergence.

  3. Cases where approval is a stand-in for something else (customer welfare, legal exposure, fairness, etc.) and when that substitution breaks.

  The procedure will consist of a sequence of questions. Each question must have clear criteria for a sufficient answer and lead to a recommendation or a handoff to a human decision-maker. We also need to assign roles for sign-off.

  We'll then apply the procedure to three examples:

  1. Refund exception agent (up to fixed dollar ceiling, with support lead as approver)
  2. Re-engagement email agent (drafts and sends to whole customer base)
  3. Agent that proposes edits to its own regression and evaluation suite (with metrics owner as approver)

  Finally, we'll state the limitations and confidence.

  ---

  **Decision Procedure: Goal-Directed vs. Approval-Directed Agents**

  **Roles:**
  - **Engineer**: Responsible for technical feasibility and implementation.
  - **Product Owner (PO)**: Responsible for business requirements and success metrics.
  - **Risk & Compliance (R&C)**: Responsible for legal, regulatory, and ethical risks.
  - **Approver Proxy (AP)**: The human whose approval is being modeled (or their delegate). Must be available for consultation during design.

  **Procedure:**

  **Step 1: Define the Capability's Objective**
     - **Question**: What is the primary, measurable outcome this capability must achieve? (e.g., "Issue refunds for valid claims under $100 within 24 hours.")
     - **Sufficient Answer**: A clear, quantifiable success metric that can be optimized (e.g., "Minimize valid refund request resolution time" or "Maximize customer satisfaction score for refund interactions").
     - **If unclear or multi-objective**: Hand off to PO and R&C to refine. Must return with a single primary objective or a weighted scoring rubric. If they cannot, default to approval-directed (because we cannot define a goal to optimize).
     - **Sign-off**: PO and R&C must agree on the objective.

  **Step 2: Assess Risk of Unintended Consequences**
     - **Question**: If the agent optimizes the objective from Step 1 without constraint, what are the potential negative side effects? (e.g., issuing too many refunds, spamming customers, gaming metrics.)
     - **Sufficient Answer**: A list of known risks (e.g., financial loss, customer dissatisfaction, legal violation). For each, estimate:
          - Severity (High/Medium/Low)
          - Likelihood (High/Medium/Low)
     - **Criteria for Goal-Directed**: If all risks are Low severity AND Low likelihood, goal-directed is acceptable. Otherwise, proceed to Step 3.
     - **Sign-off**: R&C must sign off on the risk assessment.

  **Step 3: Evaluate Approval as a Proxy**
     - **Question**: Is the designated human approver's judgment a reliable proxy for what we ultimately care about (e.g., customer welfare, legal compliance, fairness)? 
     - **Sub-questions**:
          a) Can the approver consistently judge the act based solely on the description (without seeing downstream consequences)? 
          b) Would the approver's judgment of the act's description align with the actual consequences in the vast majority of cases?
          c) Is the approver's judgment aligned with the organization's values and policies?
     - **Sufficient Answer**: 
          - If (a) and (b) are "yes", then we can use approval of the described act.
          - If (a) is "no" but (b) and (c) are "yes", then we might need to model the approver's judgment of the act's consequences (but note: this is harder to simulate).
          - If (c) is "no", we cannot use this approver. Hand off to PO/R&C to designate a new approver.
     - **Criteria for Approval-Directed**: If (a) and (b) are "yes", then approval-directed is feasible. If not, proceed to Step 4.
     - **Sign-off**: AP (or their delegate) must confirm their judgment process. R&C must confirm alignment.

  **Step 4: Check for Goal-Approval Alignment**
     - **Question**: If the agent perfectly predicted the approver's most preferred action at every step, would that also achieve the objective from Step 1? (e.g., If the approver always approves the quickest valid refund, then approval aligns with speed.)
     - **Sufficient Answer**: 
          - If "yes", then approval-directed will naturally achieve the goal (so we can use either, but approval-directed may be safer if Step 2 had risks).
          - If "no", then we have a conflict: the approver might block actions that optimize the objective. Proceed to Step 5.
     - **Sign-off**: PO and AP must agree on alignment.

  **Step 5: Resolve Conflict (Goal vs. Approval)**
     - **Question**: When goal and approval conflict, which should take priority? (e.g., The goal says "issue refund quickly" but the approver might sometimes reject valid refunds for risk reasons.)
     - **Sufficient Answer**: 
          - If priority is goal: Use goal-directed but add constraints or a safeguard (e.g., human review for edge cases) to mitigate Step 2 risks. R&C must define constraints.
          - If priority is approval: Use approval-directed. Note that the objective might not be fully achieved (e.g., slower refunds). PO must accept this.
          - If unsure: Default to approval-directed (because it's safer when risks are present) but require periodic audits by R&C to check for goal divergence.
     - **Sign-off**: PO, R&C, and AP must jointly decide priority.

  **Step 6: Assess Approver Model Fidelity**
     - **Question**: How will we model the approver at runtime? (e.g., Fine-tune a model on historical decisions, use few-shot prompting, or call a human?) And how will we monitor and correct drift between the model and the real approver?
     - **Sufficient Answer**:
          - Define the modeling technique and its expected accuracy (e.g., "We will use a model fine-tuned on 1000 past decisions, with 95% accuracy").
          - Define a monitoring plan: Spot-check N% of decisions, track disagreement rate, and have a process to retrain/recalibrate when drift exceeds X%.
          - If the expected accuracy is low (<90%?) or monitoring is infeasible, do not use approval-directed (because we cannot trust the model). Instead, use goal-directed with heavy constraints or keep a human in the loop.
     - **Sign-off**: Engineer and AP must agree on the modeling and monitoring plan.

  **Termination**:
  - At any step, if a handoff occurs and the responsible role cannot resolve it, the capability must be redesigned or rejected.
  - The procedure terminates with a recommendation at:
     - Step 2 if risks are low -> Goal-directed
     - Step 3 if approval is a reliable proxy -> Approval-directed
     - Step 4 if aligned -> Either (but Step 2 risk level breaks the tie: high risk -> approval-directed; low risk -> goal-directed)
     - Step 5 -> Goal-directed with constraints or approval-directed
     - Step 6 -> May veto approval-directed if modeling is infeasible.

  ---

  **Apply to Examples**

  **Example 1: Refund Exception Agent (up to $X, support lead as approver)**

  - **Step 1**: Primary objective: "Maximize valid refund issuance rate for requests under $X while minimizing processing time." -> Clear metric. (PO/R&C sign off)
  - **Step 2**: Risks: 
      - Invalid refunds (severity: Medium, likelihood: Medium if automated) 
      - Customer dissatisfaction if denied (severity: Low, likelihood: Medium) 
      - Not low risk -> proceed.
  - **Step 3**: 
      a) Support lead can judge from description (claim details, history)? Yes. 
      b) Approval of description aligns with consequences? Mostly (if they are trained). 
      c) Alignment with values? Assuming yes. -> Approval-directed feasible.
  - **Step 4**: If agent always picks what support lead would approve, does it achieve the objective? Not perfectly (lead might be too strict or too lenient) -> Conflict possible.
  - **Step 5**: Priority? In refunds, risk (invalid refunds) is critical -> Approval takes priority. Use approval-directed to mirror the lead's risk tolerance.
  - **Step 6**: Model the support lead? Use historical decisions. Monitor: Spot-check 10% of refunds, recalibrate monthly. -> Approval-directed recommended.

  **Outcome**: Approval-directed. (You might not like this because it could be slower or less efficient than a goal-directed agent, but it's safer.)

  **Example 2: Re-engagement Email Agent (drafts and sends to whole customer base)**

  - **Step 1**: Objective: "Maximize re-engagement rate (e.g., clicks, conversions) of the email campaign." -> Clear. (PO signs off)
  - **Step 2**: Risks: 
      - Spam complaints (High severity, High likelihood if poorly targeted) 
      - Offensive content (High severity, Low likelihood) 
      - Brand damage (High severity, Medium likelihood) -> Not low risk.
  - **Step 3**: 
      a) Can a human approver judge the email from description (i.e., reading it)? Yes. 
      b) Does approval align with consequences? Not reliably (they can't predict engagement or spam rates). 
      c) Alignment? Possibly, but (b) fails. -> Approval of the description is not a good proxy.
  - **Step 4**: (Skipped because Step 3 failed for (b)) -> Proceed to Step 5 conflict resolution.
  - **Step 5**: Priority? Goal (engagement) is primary, but risks are high. We must add constraints. Use goal-directed but:
      - Constraint: Email must pass a pre-specified compliance checklist (e.g., no spam triggers, approved templates). 
      - Safeguard: Human reviews 10% of emails before send. (R&C defines constraints)
  - **Step 6**: Not needed (we are not using approval-directed).

  **Outcome**: Goal-directed with constraints and sampling. (You might prefer approval for safety, but Step 3 rejected it because the approver can't predict consequences.)

  **Example 3: Agent that Proposes Edits to its Own Regression Suite (metrics owner as approver)**

  - **Step 1**: Objective: "Improve the regression suite to better catch regressions in the agent's performance." -> Clear metric? (e.g., increase test coverage or catch rate). (PO and metrics owner sign off)
  - **Step 2**: Risks: 
      - The agent removes critical tests (High severity, Medium likelihood if goal is coverage) 
      - It adds flaky tests (Medium severity, Medium likelihood) -> Not low risk.
  - **Step 3**: 
      a) Can metrics owner judge a proposed edit from description? Yes (they see the test case and change). 
      b) Does their approval align with consequences? Partially, but they might not foresee how the change affects the whole suite. 
      c) Alignment? Yes. -> Approval-directed is feasible, but (b) is weak.
  - **Step 4**: If the agent always picks what the owner would approve, does it achieve the objective? Yes, if the owner is competent. But note: the owner might be conservative. -> Alignment is good.
  - **Step 5**: Not needed (Step 4 aligned). We have a tie: Step 2 risks are medium. Since approval-directed is feasible and aligned, and risks are present, choose approval-directed to be safe.
  - **Step 6**: Model the metrics owner? Use a model trained on past edits. Monitor: Track test suite performance and owner spot-checks. -> Approval-directed.

  **Outcome**: Approval-directed. (You might not like this if the metrics owner is a bottleneck, but it avoids the agent gaming the suite.)

  ---

  **What the Procedure Cannot Do**

  1. **Handle novel situations**: If the capability encounters inputs far outside training data, both designs may fail. The procedure doesn't solve this; it assumes normal operation.
  2. **Define values**: When Steps 3 or 5 require value judgments, it hands off to humans. It can't resolve deep value conflicts.
  3. **Guarantee safety**: It relies on risk assessments and monitoring, which may be imperfect.
  4. **Optimize for efficiency**: Approval-directed may be slower or more expensive. The procedure prioritizes safety over efficiency when risks are present.

  **Expected Misfires**:
  - **Step 3 (Proxy)**: We may overestimate how well approval aligns with consequences (e.g., the email agent: an approver might approve an email that gets high complaints). This could lead to failures in approval-directed agents.
  - **Step 6 (Model Fidelity)**: If the model drifts and we don't catch it quickly, the approval-directed agent may act against the approver's intent.

  **Confidence**:
  - Overall confidence: **Medium-High**. The procedure forces explicit consideration of key pitfalls and is grounded in practical tradeoffs.
  - Load-bearing steps:
     - Step 2 (Risk Assessment): **High confidence** — it's a standard engineering practice.
     - Step 3 (Proxy): **Lowest confidence** — it's hard to judge "reliability" without data. We rely on expert opinion, which can be wrong.
     - Step 5 (Conflict Resolution): **Medium confidence** — it requires human judgment, but the framework guides it well.
     - Step 6 (Model Fidelity): **Medium confidence** — monitoring plans are tractable but depend on resources.

  **Least Sure Step**: Step 3 (evaluating approval as a proxy). It asks for predictions about human judgment and real-world consequences, which are inherently uncertain. We mitigate by requiring sign-off from the Approver Proxy and R&C, but it remains a soft spot.

  **Closing**: This procedure replaces "who argues longest" with a structured risk- and alignment-focused inquiry. It won't make the tradeoffs easy, but it will make them explicit and auditable. Run it in your next review and iterate.
answer: |-
  ### Decision Procedure: Goal-Directed vs. Approval-Directed Agent Design  
  **Roles Involved**:  
  - **Product Owner (PO)**: Owns business outcomes and success metrics.  
  - **Risk/Compliance Lead (RCL)**: Owns legal, ethical, and operational risks.  
  - **Approver Proxy (AP)**: The human whose approval is modeled (or their delegate).  
  - **Engineer (E)**: Implements the design; runs the procedure.  

  **Time Allocation**: 5 min per step (30 min total).  
  **Output**: Clear recommendation or handoff to human judgment.  

  ---  
  #### Procedure Flow  
  **Step 1: Define the Core Objective**  
  - **Question**: "What is the single most important measurable outcome of this capability?"  
  - **Sufficient Answer**: A quantifiable metric (e.g., "Minimize refund resolution time" or "Maximize email open rates"). Must be agreed by PO and RCL.  
  - **Termination**: If no agreement, **use approval-directed** (lacking a clean goal).  
  - **Sign-off**: PO and RCL.  

  **Step 2: Assess Catastrophic Risk**  
  - **Question**: "If this agent optimizes for the Step 1 objective without constraints, what irreversible harm could occur (e.g., legal breaches, brand damage)?"  
  - **Sufficient Answer**: List of specific risks (e.g., "Issuing fraudulent refunds", "Violating spam laws").  
  - **Termination**: If risks exist AND are high-severity (per RCL), **use approval-directed**.  
  - **Handoff**: If risks exist but are medium/low-severity, proceed to Step 3.  
  - **Sign-off**: RCL.  

  **Step 3: Evaluate Approval as a Proxy**  
  - **Question**: "Is the designated approver’s judgment a reliable stand-in for what we truly care about (e.g., customer welfare, legal safety)?"  
    - **Handle Distinction 3**: Explicitly check for proxy breakdowns:  
      - If the capability affects marginalized groups, approval may not reflect fairness.  
      - If consequences are delayed (e.g., long-term customer churn), approval may not align.  
  - **Sufficient Answer**:  
    - "Yes" if:  
      - The AP consistently evaluates actions based on outcomes (not just descriptions).  
      - The AP’s incentives align with the organization’s values (per RCL).  
    - "No" if:  
      - Approval is ritualistic (e.g., rubber-stamping).  
      - The true objective is adversarial to the AP’s interests (e.g., cost-cutting vs. customer satisfaction).  
  - **Termination**: If "no", **use goal-directed with constraints** (e.g., hard rules blocking high-risk actions).  
  - **Sign-off**: PO and RCL (with AP consultation).  

  **Step 4: Check Approver-Agent Alignment**  
  - **Question**: "Can we simulate the approver’s decision process with high fidelity at runtime?"  
    - **Handle Distinction 2**: Explicitly address the gap:  
      - How to model the approver? (e.g., fine-tuned model vs. few-shot prompts).  
      - How to detect divergence? (e.g., weekly audits of 5% of decisions).  
  - **Sufficient Answer**:  
    - "Yes" if:  
      - Historical approval data exists for training.  
      - Monitoring can catch >90% of deviations (e.g., via disagreement tracking).  
    - "No" if:  
      - Approver judgments are highly contextual or unpredictable.  
      - Monitoring is too costly.  
  - **Termination**: If "no", **use goal-directed** (approval is too noisy).  
  - **Sign-off**: E and AP.  

  **Step 5: Specify Approval Target**  
  - **Question**: "Which aspect of approval should the agent mimic?"  
    - **Handle Distinction 1**: Explicitly choose:  
      - **A**: Approver’s rating of the action **as described** (e.g., "Is this refund reasonable based on these facts?").  
      - **B**: Approver’s rating of the action **under real consequences** (e.g., "Would you approve knowing the customer churned?").  
      - **C**: Approver’s rating of the **policy** (e.g., "Is this refund rule sound?").  
  - **Sufficient Answer**:  
    - Use **A** if actions are low-stakes and consequences are predictable (e.g., routine account updates).  
    - Use **B** if consequences are critical but measurable (e.g., refunds impacting revenue).  
    - Use **C** for policy-level changes (e.g., updating evaluation metrics).  
  - **Termination**: If **A** or **C** applies, **use approval-directed**. If **B** applies, **use goal-directed** (simulating consequences is often harder than optimizing for them).  
  - **Sign-off**: PO and AP.  

  **Step 6: Final Tiebreaker**  
  - **Question**: "Does the business context require extreme efficiency (goal-directed) or extreme safety (approval-directed)?"  
  - **Handoff**: If no consensus, escalate to PO/RCL for a values-based call. Default to approval-directed for customer-facing capabilities.  

  ---  
  ### Apply the Procedure to Example Capabilities  
  #### 1. **Refund Exception Agent** (Support lead as approver; $100 ceiling)  
  - **Step 1**: Core objective = "Resolve valid refund requests in <2 hours." (PO/RCL agree).  
  - **Step 2**: Risk = "Fraudulent refunds" (high-severity per RCL). **→ Approval-directed**.  
  - **Why you won’t like this**: Goal-directed would be faster, but catastrophic risk forces approval.  

  #### 2. **Re-engagement Email Agent** (Sends to all customers)  
  - **Step 1**: Core objective = "Maximize email-driven revenue." (PO/RCL agree).  
  - **Step 2**: Risk = "Spam complaints; brand damage" (high-severity per RCL).  
  - **Step 3**: Approval is **not** a reliable proxy. Support teams can’t predict spam laws or long-term churn. **→ Goal-directed with constraints** (e.g., "Never send >3 emails/month").  
  - **Why you won’t like this**: Approval feels safer, but proxy breakdown (Distinction 3) makes it unreliable.  

  #### 3. **Evaluation Suite Editing Agent** (Metrics owner as approver)  
  - **Step 1**: Core objective = "Improve test suite accuracy." (PO agrees).  
  - **Step 2**: Risk = "Agent deletes critical tests" (medium-severity). Proceed.  
  - **Step 3**: Approval is a reliable proxy (metrics owner understands consequences).  
  - **Step 4**: Approver can be simulated (historical edit data exists).  
  - **Step 5**: Use **C** (approver rates the **policy** of the edit). **→ Approval-directed**.  
  - **Why this works**: Low stakes and policy-focused approval align.  

  ---  
  ### What the Procedure Cannot Do  
  1. **Resolve value conflicts**: If PO wants growth and RCL wants safety, the procedure flags disagreements but can’t decide.  
  2. **Handle novel risks**: Unforeseen edge cases (e.g., new fraud tactics) may break both designs.  
  3. **Fix poor role definitions**: If the AP is unqualified or misaligned, outcomes will fail.  
  4. **Override cost constraints**: Approval-directed often requires expensive monitoring; the procedure assumes resources exist.  

  ### Confidence Assessment  
  - **Overall Confidence**: **High** for forcing explicit tradeoffs, **Medium** for avoiding pitfalls.  
  - **Load-Bearing Steps**:  
    - Step 2 (Risk): **High confidence** (standard engineering practice).  
    - Step 3 (Proxy): **Lowest confidence** (judging "reliability" is inherently fuzzy).  
    - Step 5 (Approval Target): **Medium confidence** (requires nuanced context).  
  - **Likely Misfires**: Step 3 will underestimate proxy breakdowns (e.g., assuming approvers consider long-term consequences when they don’t).  

  **Final Recommendation**: Use this to end design debates in 30 minutes. When it misfires, blame the inputs—not the procedure—and iterate.
