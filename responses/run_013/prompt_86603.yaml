prompt: |-
  I'm a novelist and I need a thought experiment for a scene I'm writeing. Build me a case where Kant's view on animals -- the one where we don't have direct duties to them, just indirect duties to ourselves or humanity, because being cruel to animals dulls our sympathy for people -- gives a diffrent verdict than a view that says animals are directly wronged. I want the Kantian view to come out saying the action is permissible (or at least not wrong because of the animal), while the direct-duty view says it's wrong. Make it realistic, no sci-fi, and keep the scenario to one paragraph. Then walk through what each view says and why, tell me which feature of the case is doing the work, what happens if you remove that feature, and how a Kantian defender would attack the case. Give it to me as exactly five numbered points, each a sentence or two, no intro or conclusion.
