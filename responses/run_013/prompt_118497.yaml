  Type 2: Vague conditional, like "if A then probably B". In this case, we need to assign a probability p to the conditional P(B|A). We ask the witness: "On a scale from 0 to 10, how sure are you that if A is true then B is true?" Record the number and convert to a probability (divide by 10). If we cannot ask, we assign p=0.8 for "probably", p=0.6 for "maybe", etc. (this is your judgment). Then, we update as follows:

  - Identify the set of sectors where A is true. Within these, we want to increase the probability of the sectors that have B and decrease those that have not B. Specifically:
    - Let S_A be the total prior probability of A (sum of the probabilities of all sectors where A is true).
    - The new probability for any sector that has A and B is set to: (prior probability of that sector) * p / (prior probability of B given A) ? Not exactly.

  Actually, we can do:

  - The total probability for A and B should become p * S_A.
  - The total probability for A and not B should become (1-p) * S_A.

  But note: there might be multiple sectors that are A and B, and multiple that are A and not B. We want to keep their relative probabilities within the A and B group and within the A and not B group? But the statement doesn't differentiate within the groups. So we can:

  - For every sector that is A and B: multiply its prior probability by p / (prior P(B|A)) ? But we can avoid that.

  Instead:

  - For every sector that is A and B: new unnormalized probability = prior probability of the sector * p
  - For every sector that is A and not B: new unnormalized probability = prior probability of the sector * (1-p)
  - For every sector that is not A: leave the prior probability unchanged.

  Then renormalize all probabilities so they sum to 1.

  But note: within A, we are scaling the A and B sectors by p and the A and not B by (1-p). This will change the relative weights within A, but not within the subgroups. Actually, if there are multiple sectors in A and B, they are all scaled by p, so their relative probabilities remain the same. Similarly for A and not B.

  Example: Prior for sectors:

  - A1: A and B, prob 0.2
  - A2: A and not B, prob 0.1
  - A3: A and B, prob 0.1
  - Not A: prob 0.6

  Total A: 0.4. Prior P(B|A) = (0.2+0.1)/0.4 = 0.75.

  Now, we set p=0.8.

  Then:

  - A1: 0.2 * 0.8 = 0.16
  - A2: 0.1 * (1-0.8) = 0.02
  - A3: 0.1 * 0.8 = 0.08
  - Not A: 0.6

  Sum = 0.16+0.02+0.08+0.6=0.86.

  Renormalize by dividing by 0.86.

  This method works.

  Type 3: Absolute statements, like "he is in X" or "he is not in X". We assign a reliability r to the witness (by judgment: how trustworthy, from 0 to 1). Then:

  For "he is in X":

  - Calculate D = (prior P(X) * r) + (prior P(not X) * (1-r))
  - New P(X) = (prior P(X) * r) / D
  - New P(not X) = (prior P(not X) * (1-r)) / D
  - Then, for every sector Y in not X: New P(Y) = New P(not X) * [prior P(Y) / prior P(not X)]

  For "he is not in X":

  - Calculate D = (prior P(not X) * r) + (prior P(X) * (1-r))
  - New P(not X) = (prior P(not X) * r) / D
  - New P(X) = (prior P(X) * (1-r)) / D
  - For every sector Y in not X: New P(Y) = New P(not X) * [prior P(Y) / prior P(not X)]

  In the case of multiple witnesses, update sequentially in the order received.

  Where the buck stops: You must assign the reliabilities and interpret the vague terms (like "probably"). Also, you must decide the prior probabilities. The arithmetic is then fixed.

  For the case where a statement rules out all sectors: then after setting the probability of every sector to zero, we have a problem. We must then reconsider: either the witness is wrong (so we ignore the statement) or we have missed a sector (so we expand the map). This is your call.

  Now, let's apply to the cases.

  ### Case 1 (ridge and creek) with the procedure:

  Prior:
  - NR: 0.25
  - NC: 0.25
  - S: 0.5

  Witness: "if north, then creek bottom." This is a conditional: if A (north) then B (creek bottom). So we rule out any sector that is A and not B. Here, north ridge (NR) is A and not B. Set NR to 0.

  Then we have:
  - NR: 0
  - NC: 0.25
  - S: 0.5

  Sum = 0.75. Renormalize: divide by 0.75.

  - NC: 0.25/0.75 = 1/3
  - S: 0.5/0.75 = 2/3

  So the procedure endorses your initial calculation.

  ### Case 2: Farmhand says "if he isn't at the trailhead he's probably at the lake."

  We interpret this as: if not T (not trailhead), then probably at L (lake). We assign p=0.8 (by default).

  Assume we have sectors: T (trailhead), L (lake), and O (other, non-trailhead and non-lake). Suppose priors: P(T)=0.3, P(L)=0.4, P(O)=0.3.

  The condition: if not T, then L. But note: the condition is "not T", and then we have two sectors: L and O. We want to set the probability for L given not T to 0.8, and for O given not T to 0.2.

  So, we update:

  - For sectors that are not T and L (which is L): multiply prior by p = 0.8
  - For sectors that are not T and not L (which is O): multiply prior by (1-p) = 0.2
  - For T: unchanged.

  So:

  - T: 0.3
  - L: 0.4 * 0.8 = 0.32
  - O: 0.3 * 0.2 = 0.06

  Sum = 0.3+0.32+0.06=0.68

  Renormalize:

  - T: 0.3 / 0.68 ≈ 0.441
  - L: 0.32 / 0.68 ≈ 0.471
  - O: 0.06 / 0.68 ≈ 0.088

  So we have updated probabilities.

  ### Case 3: Two contradictory witnesses.

  Suppose we have sectors A, B, C with priors: P(A)=0.4, P(B)=0.3, P(C)=0.3.

  Witness 1 says: "He is in A." We assign reliability r1=0.7.

  Update for witness 1:

  D = P(A)*r1 + P(not A)*(1-r1) = 0.4*0.7 + 0.6*(1-0.7) = 0.28 + 0.6*0.3 = 0.28+0.18=0.46

  New P(A) = (0.4*0.7)/0.46 = 0.28/0.46 ≈ 0.6087

  New P(not A) = (0.6*0.3)/0.46 = 0.18/0.46 ≈ 0.3913

  Now, split not A between B and C (proportionally to their prior within not A: both were 0.3, so 50% each).

  So:

  New P(B) = 0.3913 * (0.3/0.6) = 0.3913 * 0.5 = 0.19565
  New P(C) = 0.3913 * 0.5 = 0.19565

  Now, witness 2 says: "He is not in A." We assign reliability r2=0.7.

  We update with witness 2, using the current probabilities as prior:

  Current prior: P(A)≈0.6087, P(B)≈0.19565, P(C)≈0.19565, so P(not A)=0.3913.

  We are updating for the statement "not in A":

  D = P(not A)*r2 + P(A)*(1-r2) = 0.3913*0.7 + 0.6087*(1-0.7) = 0.27391 + 0.6087*0.3 = 0.27391 + 0.18261 = 0.45652

  New P(not A) = (0.3913 * 0.7) / 0.45652 = 0.27391 / 0.45652 ≈ 0.6000

  New P(A) = (0.6087 * (1-0.7)) / 0.45652 = (0.6087*0.3)/0.45652 = 0.18261/0.45652 ≈ 0.4000

  Now, we split the new P(not A) between B and C in proportion to their current probabilities within not A? But note: in the current prior (after witness 1), B and C were equal. So we split not A equally:

  New P(B) = 0.6000 * (0.19565 / 0.3913) = 0.6000 * 0.5 = 0.3000
  New P(C) = 0.6000 * 0.5 = 0.3000

  But note: 0.19565/0.3913 = 0.5, exactly? Because 0.19565*2=0.3913. Yes.

  So we have:

  A: 0.4, B: 0.3, C: 0.3.

  This is the same as the original prior? Not exactly: we had A:0.4, B:0.3, C:0.3. Now after two witnesses, we are back to the same. That happened because the witnesses were equally reliable and made contradictory statements.

  In general, it might not cancel out.

  This procedure is a bit involved, but with a calculator, it can be done in 15 minutes.

  ### Final Note

  The procedure requires judgment in assigning reliabilities and interpreting vague terms. The arithmetic is then fixed. You are the one who signs off, so you must make those judgments. The procedure makes explicit where the judgment is required.

  I hope this helps.
