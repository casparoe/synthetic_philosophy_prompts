  I've thought through your problem, and I'll give you a procedure that's built for your constraints: it's designed to be spoken aloud, it runs on fractions and basic calculator work, and it flags where judgment must step in. The core idea is that witness statements are treated as updates to probabilities, but only after we interpret what they're actually saying. The arithmetic is just a tool—it only works when we've pinned down what the witness means. Where we can't, the buck stops with you, and you'll have to make a call. I'll lay out the procedure as a series of steps, then apply it to your three cases. The steps are meant to be followed in order, spoken to your team like a checklist.

  Start by having your sector map and prior probabilities ready. These priors come from your team's initial judgment (e.g., equal likelihood for large areas). When a witness statement comes in, the first step is to ask: "What exactly is the witness saying about where the person is?" This means breaking the statement into a clear, testable rule about sectors. If the statement is "if A, then B," you're looking for a conditional rule that might rule out certain areas. If it's vague, like "probably," you push for a number. If it's absolute, like "he's in A," you assess reliability. Always write down the rule explicitly before doing math. If the rule would wipe out all sectors (e.g., "he's not in any of these areas"), stop—this is a judgment call for you, as it means the witness might be wrong or the map is incomplete.

  Once you have a rule, ask: "Does this rule make any sector impossible?" If yes, set those sectors to zero probability immediately. Then renormalize the rest: add up the remaining probabilities, divide each by that total. This is just rescaling fractions. If the rule doesn't rule out sectors but adds likelihoods (like "probably"), you'll need weights—this is where judgment comes in, and you decide the weight on the spot. Assign a number (e.g., 0.8 for "probably"), then adjust the probabilities in the affected areas proportionally. Always renormalize after. For multiple statements, process them in order, updating the probabilities step by step. If two statements clash, the order might affect the outcome—I recommend using the order you received them. Finally, after the math, ask: "Does this make sense on the map?" If the numbers feel off, you override them. You're signing off, so your judgment is the backstop.

  Now, let's run your cases. I'll show the work in fractions, with the reasoning, and tell you where you decide versus where the arithmetic runs.

  **Case 1: The ridge and creek bottom.**  
  Priors: North Ridge (NR) = 1/4, North Creek (NC) = 1/4, South (S) = 1/2.  
  Witness: "If he went north, he went to the creek bottom."  
  - Step 1: Interpret the rule. The witness says if he's in north (NR or NC), he must be in creek (NC). This rules out NR (since it's north but not creek).  
  - Step 2: Rule out impossible sectors. Set NR to 0.  
  - Step 3: Renormalize. Remaining sectors: NC = 1/4, S = 1/2. Sum = 1/4 + 1/2 = 3/4. Divide each by 3/4: NC = (1/4) ÷ (3/4) = 1/3; S = (1/2) ÷ (3/4) = 2/3.  
  Result: NC = 1/3, S = 2/3, NR = 0.  
  This endorses your initial calculation. The arithmetic is fixed; no judgment here.  
  Why your friend's version is wrong: It assumes the witness only updates within north, but the statement is a conditional that affects the entire map. If the witness had been answering a question like "Given he's north, where?" then your friend's version might hold. But as reported, the witness didn't say he was north—they gave a rule that excludes ridge, so we must renormalize globally.

  **Case 2: The farmhand's "probably."**  
  Statement: "If he isn't at the trailhead, he's probably at the lake."  
  Assume sectors: Trailhead (T), Lake (L), and Other (O). Priors: T = 1/3, L = 1/3, O = 1/3 (equal for simplicity; yours might differ, but the method holds).  
  - Step 1: Interpret the rule. The witness says if not T, then likely L. This doesn't rule out sectors, so we need a weight for "probably."  
  - Judgment step: You must assign a number. Ask the farmhand: "On a scale of 0 to 10, how sure?" If no answer, decide—say, 0.8 for "probably." Write it down.  
  - Step 2: Apply the rule. The statement affects only non-T sectors (L and O). We increase weight for L and decrease for O within non-T.  
    - Calculate non-T probability: L + O = 1/3 + 1/3 = 2/3.  
    - New weight for L (given not T): 0.8. For O (given not T): 0.2 (since 1 - 0.8).  
    - Adjust L: prior L × 0.8 = (1/3) × 0.8 = 8/30.  
    - Adjust O: prior O × 0.2 = (1/3) × 0.2 = 2/30.  
    - T is unchanged: 1/3 = 10/30.  
  - Step 3: Renormalize. New sum = 8/30 + 2/30 + 10/30 = 20/30 = 2/3. Divide each by 2/3 (or multiply by 3/2):  
    - T: (10/30) × (3/2) = 30/60 = 1/2.  
    - L: (8/30) × (3/2) = 24/60 = 2/5.  
    - O: (2/30) × (3/2) = 6/60 = 1/10.  
  Result: T = 1/2, L = 2/5, O = 1/10.  
  The key judgment was assigning 0.8; the rest is arithmetic. If the farmhand had said "definitely" instead of "probably," we'd treat it as a conditional rule (Case 1), setting O to 0 if not T.

  **Case 3: Contradictory statements.**  
  Witness 1: "He's in A." Witness 2: "He's not in A."  
  Sectors: A, B, C. Priors: A = 1/3, B = 1/3, C = 1/3.  
  - Judgment step: Assign reliability to each witness (0 to 1). Say, both 0.7 if they're equally credible.  
  - Process in order. Start with Witness 1: "He's in A."  
    - Update for reliability. D = [P(A) × reliability] + [P(not A) × (1 - reliability)] = (1/3 × 0.7) + (2/3 × 0.3) = 7/30 + 6/30 = 13/30.  
    - New P(A) = (1/3 × 0.7) / (13/30) = (7/30) / (13/30) = 7/13.  
    - New P(not A) = (2/3 × 0.3) / (13/30) = (6/30) / (13/30) = 6/13.  
    - Distribute not A to B and C equally (since priors equal): B = (6/13) × 1/2 = 3/13, C = 3/13.  
    - Interim: A = 7/13, B = 3/13, C = 3/13.  
  - Now Witness 2: "Not in A."  
    - Update for reliability. D = [P(not A) × reliability] + [P(A) × (1 - reliability)] = (6/13 × 0.7) + (7/13 × 0.3) = 42/130 + 21/130 = 63/130.  
    - New P(not A) = (6/13 × 0.7) / (63/130) = (42/130) / (63/130) = 42/63 = 2/3.  
    - New P(A) = (7/13 × 0.3) / (63/130) = (21/130) / (63/130) = 21/63 = 1/3.  
    - Distribute not A to B and C equally: B = (2/3) × 1/2 = 1/3, C = 1/3.  
  Result: A = 1/3, B = 1/3, C = 1/3—back to start.  
  The arithmetic handled the contradiction, but you chose the reliability (0.7) and order. If reliability differed (e.g., Witness 1 is unreliable at 0.3), the outcome changes. If statements emptied the map (e.g., "He's not in A, B, or C"), you stop the math and decide: call the witness unreliable, expand sectors, or ignore. Judgment is the guardrail.

  This procedure is fast: the arithmetic is fractions and division, doable with a phone in minutes. When I say "judgment," that's you—based on context, witness demeanor, or team input. The math only runs when the rule is clear; otherwise, you simplify or decide. For your volunteer who scoffs, explain it as "clearing the fog": we turn words into numbers, but only where the words are sharp. And when they're not, we don't force it—we go with what the map tells us. You're the one who knows the ridges; the numbers just help focus the search.
