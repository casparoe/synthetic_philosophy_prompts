answer: |-
  Here are five desiderata for evaluating accounts of the Church-Turing Thesis (CTT), addressing your specified concerns:

  1.  **Must distinguish formal equivalence theorems from CTT itself.** The proofs that Turing machines, lambda calculus, and general recursiveness define the same class of functions are mathematical theorems. CTT is the separate claim that this class *exhausts* the informal notion of "effectively computable function". **Non-negotiable:** Collapsing this distinction renders CTT either trivially true (by definition) or unstatable.

  2.  **Must define what constitutes *conceivable* evidence against CTT.** An account must specify what would falsify CTT *in principle*, even if practically unlikely (e.g., a widely accepted physical device solving the halting problem for TMs, or a rigorous demonstration of a humanly executable non-recursive procedure). **Non-negotiable:** CTT cannot be an unfalsifiable dogma; it *must* admit the possibility of counterevidence to have empirical or substantive content.

  3.  **Must explicitly address and distinguish the thesis's scope variants.** Any account must clarify whether CTT concerns: (a) *Human Calculation* (mental procedures), (b) *Physical Computation* (devices obeying known physics), or (c) *Idealized Computation in Principle* (abstract procedures with unbounded time/space). **Contested:** Different interpretations (a-c) are live positions, but an adequate account *cannot* treat them ambiguously; ignoring this distinction collapses crucial debates about hypercomputation and evidence.

  4.  **Must position hypercomputation models relative to CTT's claimed scope.** The account must state whether models like ITTMs, accelerating machines, or CTC computers: (i) are ruled out *by definition* under CTT's "effective computability" reading, (ii) represent conceivable *physical* counterexamples to CTT-scope-(b), or (iii) are irrelevant mathematical constructs outside CTT's purview. **Non-negotiable:** Ignoring these models fails; their treatment is central to modern CTT debates and tests the scope distinctions in (3). This desideratum rules out positions that dismiss hypercomputation *a priori* without argument.

  5.  **Must explain the epistemic status asymmetry.** An account must explain why the formal equivalence proofs are considered proven, while CTT itself is not provable within the formalisms it relates (as it bridges formal and informal concepts). **Non-negotiable:** A satisfactory account must address this foundational asymmetry without resorting to mere appeals to historical consensus.
