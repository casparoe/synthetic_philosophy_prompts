  Ok so I'm prepping a grad seminar on the Church-Turing thesis and I keep realizing I don't have a clean grip on what the thesis even is, which makes arguing about whether it's true feel like nonsense. Before we fight over provable vs empirical vs definitional, I want the spec. Write me the desiderata any adequate account of the thesis's epistemic status has to meet -- the cases it has to get right, the puzzles it has to dissolve, the distinctions it can't collapse -- with the consideration behind each one, and say for each whether it's non-negotiable or just something one camp insists on. I specifically don't want it to wave at the equivalence proofs and the absence of counterexamples; it has to say something about why the results equating Turing machines with lambda-definable and recursive functions are theorems while the thesis itself isn't, what would even count as evidence against the thesis, and wether the thing is one claim or a family (an ideal human calculator vs any physical device vs what's computable in principle given unbounded time). And it should place the hypercomputation stuff -- accelerating machines, infinite-time Turing machines, devices leaning on closed timelike curves -- either inside the thesis's scope or beside it, not just ignore them. If one of your requirements does most of the work ruling out live positions, flag that in place rather than in a summary. Numbered list, exactly five items, a sentence or two each, no intro and no closing paragraph.
