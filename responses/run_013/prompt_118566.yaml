answer: |-
  Right, let's have it. Your first point misrepresents me. I’m not converting ignorance into a coin toss out of thin air; I'm observing the structure of causal influence. For any given act, its remote effects ripple through an unimaginably complex network of future events. Crucially, that network isn't biased towards systematically amplifying good or bad initial perturbations on the scale we care about. When you buy a coffee, the infinitesimal influence on countless future chains is as likely to deflect events towards marginally better futures as marginally worse ones – because the world's causal structure doesn't inherently favour positive or negative amplification for such minor triggers. It's chaotic neutrality, not assumed symmetry from ignorance.

  On your variance point, you're correct that *if* the potential tails are astronomically bad (or good) and non-negligibly probable, then expected value calculations become unstable. I concede that. But here's the cost to you: this isn't a unique problem for consequentialism; it’s a feature of *any* decision under radical uncertainty about vast stakes. The cluelessness you wield cuts both ways. If you abandon expected value maximisation because remote effects might be catastrophically bad, consistency demands you abandon it when they might be astronomically good too. You’re left with paralysis or an arbitrary decision rule. My wash-out assumption, flawed as it might be in extreme cases, at least lets us act decisively on the knowable, near-term consequences where we *can* have confidence – like choosing a life-saving surgery over a coffee, despite both having unknowable long tails. The alternative is nihilism about practical reason itself. So yes, sometimes the answer might be indeterminate, but that indeterminacy plagues any remotely plausible ethics under uncertainty; it doesn't kill consequentialism alone.

  Your move. Why is your preferred approach immune to the same devastating tails?
