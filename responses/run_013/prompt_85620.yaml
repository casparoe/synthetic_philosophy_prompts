prompt: |-
  MA history student here, and I've got a phrase that keeps being used as a conversation-ender in my dept. Last week, in a seminar on colonial violence, one guy kept saying we should just show 'how it actually was' and stop smuggling present-day politics into how we describe a killing — massacre, disturbance, incident, whatever. He attributes the line to Ranke: 'wie es eigentlich gewesen', from the book that made Ranke's name in 1824. I want to push back, but I'm not sure I can say what's wrong with it, or wether anything is.

  So give me the menu. What are the different precise claims that one sentence could be making, ordered from the bland to the radical, and which of them would actually do the work he wants it to do — i.e. shut down the argument about the description? Threads I'd want untangeled:

  - 'eigentlich' apparently reads as either 'actually' or 'essentially'. If it's the second, does the slogan stop being a modest "get the facts right" instruction and become a metaphysical or even theological claim (Ranke was a Lutheran who thought God's hand was visible in history)?
  - Is "the historian should get the facts right" the same claim as "there's one true description of the past sitting in the archive waiting to be found"?
  - Where do the sceptics bite? Carr's point that only a sliver of what happened ever becomes a historical fact, or White's that any narrative has to be given a plot shape — romance, tragedy, comedy, satire — and that the shape isn't in the documents.
  - Is 'just the facts' even an instruction you can follow, or does any description of a killing already involve selection and evaluative vocabulary?

  Lay it out as a list I can take to the seminar, with a verdict on each reading — platitude, live option, or false — and tell me which reading he's actually leaning on when he thinks he's just being neutral.
reasoning: |-
