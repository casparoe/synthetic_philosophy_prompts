  I'm applying for a one-year fellowship (philosophy, but the panel is half CS people) and I have a half-baked idea I want you to turn into a short research proposal — keep it under 700 words. The idea: machine ethics keeps borrowing human moral categories (obligation, permission, duty), but nobody seems to have asked squarely whether a machine can perform a *supererogatory* act. And it feels off for a reason I think is worth chasing — supererogation as usually understood seems to need the agent to give up something of its own, and a tool-ish system doesn't have a good of its own to give up. So either supererogation just collapses for machines, or we've been overloading the concept and there's something cheaper hiding inside it. My hunch is you can seperate it into (a) going beyond what's required and (b) bearing a cost, and that once you pull those apart you get an interesting third thing: a system that exceeds its spec not heroically but in a way that generates fresh obligations downstream — it makes itself relied on, takes on commitments, changes what others may now demand of it. Turn this into a proposal: state the question so it has a determinate answer, say why the two obvious positions (machines can't be supererogatory at all; supererogation never really needed cost) both leave it open, give the method — a few clean thought experiments plus some minimal formalization of "beyond the specification" — say what a result would look like and what would count as the project failing, and be honest about whether a year is actually enough. Skip citations, I'll add those.
