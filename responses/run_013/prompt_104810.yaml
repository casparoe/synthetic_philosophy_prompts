prompt: |-
  I am a hobbyist machinist, and I have lately been building the same small thing in three quite different ways: a mechanical adding machine made of gears and cams, a version of the same machine built out of falling dominoes that encode the digits, and a software simulation of the mechanical one. All three perform the same arithmetic, and the only descriptions under which I can say what any of them will do next are descriptions that treat certain physical features as standing for numbers and certain physical events as adding them. If I try instead to explain a single output by tracing gears, toppling dominoes, and voltage levels, I can do it in principle, but the resulting story is enormous, it is different for each of the three machines, and it never once mentions the thing I actually care about, namely that the machine is computing a sum. And yet when I go down to the smallest scale and ask what made each part move, every push is fully accounted for by an earlier push, or by gravity, or by a difference in voltage; there is no leftover shove anywhere that is not a shove of that ordinary kind. So I seem to be in possession of a description that is the only useful one, that is the same across machines sharing no parts, and that nevertheless appears to point to nothing that is doing any pushing at the level where the pushes actually occur.

  I keep feeling there ought to be a name for this exact predicament — not for computation as such, and not for the bland fact that one thing admits of many descriptions, but for the specific combination: a higher-level, meaning-involving description is the one that carries the predictive and explanatory load, it survives a complete change of substrate, and at the same time every event it talks about has a complete lower-level cause that seems to leave no room for anything further. Is there an established concept or debate for that configuration, and if there is, I want to know precisely which of the nearby ideas it is and which it is not — I have encountered phrases like multiple realizability, downward causation, and levels of explanation, and I cannot tell whether any of them names this or whether each of them misses it in a different direction. If nothing established fits, then please coin a term and define it, and tell me where its edges lie: is a thermostat in or out, is a river carving a channel in or out, is a chess engine that only ever runs on one machine in or out, and what would have to change about the domino machine to put it outside the concept? The label matters less to me than the carving.
reasoning: |-
  Okay, let me start by understanding what this hobbyist machinist is really asking. They've built three different versions of an adding machine—mechanical, domino-based, and software simulation. Each performs the same arithmetic operations, but the physical implementations are totally different. The key insight here is that the only useful description that explains what these machines do involves treating physical features as representing numbers and physical events as additions. If you try to explain it at the lower level—gears turning, dominoes falling, voltage changes—the explanation becomes incredibly complex, varies for each machine, and completely misses the arithmetic aspect the creator cares about.

  The user is pointing out that at the lowest level, every movement is fully explained by physical forces—pushes, gravity, voltage differences—with no extra "shove" needed. Yet, the higher-level description involving numbers and addition is the one that's useful, predictive, and consistent across different substrates. They want to know if there's a specific term or concept for this situation. They mention multiple realizability, downward causation, and levels of explanation but feel these might not quite capture the essence. They also want clear boundaries: is a thermostat included? What about a river carving a channel? A chess engine on one machine?

  First, I need to recall what each of those terms means. Multiple realizability is about how the same higher-level property can be implemented by different lower-level systems. That seems relevant here, but the user thinks it might not fully cover their predicament. Multiple realizability explains why the same computation can happen in different materials, but it doesn't address why the higher-level description is essential despite complete lower-level causation. Downward causation suggests higher levels influence lower levels, which doesn't seem to fit here because the lower-level causes are sufficient on their own. Levels of explanation is broader, but the user wants something more specific.

  The core issue is the indispensability of the higher-level description despite causal completeness at the lower level. This sounds like the debate around non-reductive physicalism, especially Jaegwon Kim's exclusion problem. Kim argued that if every event has a sufficient physical cause, there's no room for higher-level causes to do any real work. But in this case, the higher-level computational description is indispensable for explanation and prediction, even if it's not adding new causal power.

  The concept of "explanatory autonomy" or "causal relevance without causal efficacy" might be relevant. The higher-level properties aren't causing anything extra but are still essential for understanding. The user might be describing what Dennett calls the "design stance" or "intentional stance," where we interpret systems in terms of their purpose or information processing.

  For the boundaries: A thermostat fits because its function (regulating temperature) is explained at a higher level despite being implemented mechanically or digitally. A river carving a channel might not fit as well because while erosion can be described as "carving," it's not representational. The river isn't encoding information; it's a physical process without symbolic meaning. A chess engine on one machine still fits because the computational description is essential, even if it's not multiply realized. The domino machine would be out only if it lost the representational mapping—like if the dominoes fell randomly without encoding digits.

  So the coined term "Functional Abstraction" emphasizes the move from physical details to functional roles, where the function is defined by inputs, outputs, and transformations. It's tied to representational systems where physical states stand for something else. This captures the necessity of the higher-level description for prediction and explanation, its substrate independence, and the causal completeness at the lower level without overstepping.
answer: |-
  Your predicament captures a profound philosophical tension at the intersection of computation, causation, and explanation. No single established term perfectly names *all* facets you describe, but the constellation you outline is a recognized nexus in philosophy of mind, science, and computation. Let's carve it precisely:

  ### Core Concept: **Explanatory Irreducibility with Causal Completeness**
  **Definition:** The phenomenon where:  
  1.  A system's behavior is *best predicted and explained* by a high-level, functional description involving representational states (e.g., digits, sums).  
  2.  This high-level description is *substrate-independent* (multiple realizable).  
  3.  Every physical event within the system has a *complete, sufficient physical cause* at a lower level (e.g., mechanics, physics).  
  4.  Despite (3), the high-level description is *explanatorily indispensable* – it cannot be eliminated or replaced by the lower-level description without catastrophic loss of predictive power or understanding, even "in principle."  

  ### Why Established Terms Don't Quite Fit:
  *   **Multiple Realizability (MR):** Captures (2) (substrate independence) but is silent on (1), (3), and (4). MR says *that* computation can be realized in gears, dominoes, or silicon. It doesn't address *why* the computational description is essential despite causal completeness at the lower level, nor the tension you feel ("no leftover shove"). A system could be multiply realizable *and* fully explainable at the lower level in principle (even if impractical).
  *   **Downward Causation:** Implies the high-level state (e.g., "carrying a 1") *causes* changes at the lower level. You explicitly reject this ("no leftover shove"). Your gears/dominoes/voltages are pushed *only* by prior gears/dominoes/voltages, gravity, or EM forces – the *represented sum* doesn't exert an extra force.
  *   **Levels of Explanation:** Too broad. It acknowledges different descriptive layers but doesn't specify the *explanatory indispensability* of the high level combined with the *causal completeness* of the low level. Many level-based explanations don't involve representation (e.g., explaining engine function vs. metallurgy).
  *   **Supervenience:** Describes the *dependence* relation: the high-level state (sum) supervenes on the low-level state (gear positions/domino falls/voltages). Change the low-level, you *must* change the high-level. This captures a key dependency but doesn't address explanatory indispensability or the tension with causal completeness.

  ### The Closest Established Debate: **Non-Reductive Physicalism & the Exclusion Problem**
  *   **Non-Reductive Physicalism:** Asserts that while everything is physical, higher-level properties (like mental states or computational states) are genuine, real, and not reducible *in practice or explanation* to lower-level physical properties, even though they depend on them (supervene).
  *   **The Exclusion Problem (Kim's Challenge):** If every physical event has a sufficient physical cause (causal completeness), and the higher-level property (e.g., "computing 5+7") supervenes on the physical, then the higher-level property is either:
      *   *Causally inert* (epiphenomenal) – it doesn't *do* anything, which seems wrong given how we rely on it.
      *   *Redundant* – the physical cause is doing all the work, making the higher-level cause unnecessary.
      *   *Identical* to the lower-level cause – but this collapses into reductionism.
  *   **Your Predicament Embodies This:** You have causal completeness (physical causes suffice) *and* explanatory indispensability (you *need* the computational description). This is the core tension of non-reductive physicalism applied to computation. You feel the pull of both horns: the causal completeness makes the high-level seem epiphenomenal, yet your practical experience screams its indispensability.

  ### Coining a Term: **Functional Abstraction Necessity (FAN)**
  To precisely name *your* configuration:
  *   **Functional:** The high-level description specifies a *function* (adding digits) performed by the system.
  *   **Abstraction:** It ignores physical implementation details (gears vs. dominoes vs. code).
  *   **Necessity:** This abstract functional description is *necessary* for efficient, generalizable explanation and prediction, despite *not* being necessary for *causal sufficiency* at the physical level.
  *   **FAN:** "The behavior of the system exhibits **Functional Abstraction Necessity**." (It *needs* to be understood via its abstract function).

  ### Applying the Carving: What's In, What's Out?
  *   **Your Adding Machines (Gears, Dominoes, Code): IN.** Perfect exemplars. High-level computational description is indispensable, substrate-independent, and physically causally complete.
  *   **A Thermostat: IN (Barely, but IN).**
      *   *Why In?* Its behavior (turning heat on/off) is best explained by the high-level functional description ("maintains temperature T", "compares setpoint to sensor value"). This is multiply realizable (bimetallic strip, electronic sensor). Physical causes (metal bending, voltage change) are sufficient for each switch event.
      *   *Why Barely?* The representational aspect is simpler (crude "too cold"/"too hot") and the explanatory gap is smaller. You *could* (painfully) explain every switch event via metal expansion/contraction without mentioning temperature regulation, losing the "why". The *necessity* is weaker but present.
  *   **A River Carving a Channel: OUT.**
      *   *Why Out?* While we *describe* it functionally ("carving," "seeking the path of least resistance"), the river doesn't *represent* anything. The high-level description ("carving a channel") is essentially a summary *of* the low-level physical processes (erosion, sediment transport, gravity). You don't lose essential predictive power by sticking to physics/geology; the "functional" description doesn't add a distinct *representational* layer irreducible to the physics. It's a case of *descriptive convenience* or *pattern recognition*, not FAN.
  *   **A Chess Engine Running on Only One Machine: IN.**
      *   *Why In?* Crucially, FAN requires *substrate independence in principle*, not in practice. Even if this specific chess engine only ever runs on one specific CPU, its behavior is *best explained* by its high-level computational states ("evaluating board position," "calculating minimax"). Explaining its moves solely via voltage transitions in that specific CPU would be an unusably complex story that misses the "what" and "why" entirely. The functional description is indispensable. The *potential* for multiple realization (it *could* be ported) highlights the abstraction, but the *actual* singular implementation doesn't negate the explanatory necessity of the functional level *for understanding its behavior as chess*.
  *   **What Would Put the Domino Machine Out?** Remove the representational mapping and functional coherence.
      *   **Scenario 1 (Loss of Representation):** The dominoes fall, but their arrangement doesn't systematically encode digits or operations. It's just a cascade. Then, while physics explains the falls, there's no *higher-level computational description* to be indispensable. OUT.
      *   **Scenario 2 (Loss of Functional Coherence):** The dominoes are arranged to "encode" digits, but the cascade doesn't reliably implement addition due to instability or randomness. The high-level computational description *fails* to predict or explain the outputs accurately. It becomes an incorrect description. The physical story might still be complete, but the computational story is broken and useless. OUT. FAN requires the high-level description to *successfully* carry the predictive/explanatory load.

  ### The Edge: Representation is Key
  The critical factor putting systems *in* the FAN category is that the high-level description involves **representational states** (digits, sums, board positions, temperature setpoints) and **functional transformations** (adding, comparing, evaluating). This representational layer is what makes the high-level description indispensable *as an explanation of what the system is "doing" in intentional/functional terms*, even though the pushes and pulls are fully accounted for physically. Systems lacking this representational aspect (like the river) or where the representational description fails (broken domino machine) fall outside.

  You've perfectly articulated the core argument for the autonomy of special sciences (like computer science) and against strong reductionism: the patterns that *matter* for prediction and explanation are captured at the functional level, not the physical level, even while resting entirely on it. **Functional Abstraction Necessity** names that specific, indispensable, representational layer riding atop, but not adding force to, the causally complete physical substrate.
