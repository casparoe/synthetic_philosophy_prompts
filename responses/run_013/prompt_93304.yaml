prompt: |-
  I teach a second-year undergraduate course on moral change, and I am working through the final-exam scripts for the unit on moral revolutions. The question on the paper was this: "Entrenched practices such as Atlantic slavery and aristocratic dueling have been explained in three broadly different ways. One says the practice ended because the arguments against it were finally made and heard. A second says it ended because it stopped paying — the interest-based reading usually labelled the Williams thesis, on which British abolition is treated as a by-product of the slave economy's declining profitability and the rise of industrial capital. A third says it ended because honor changed — the reading associated with Appiah, who argues that the case against dueling, footbinding and slavery had been available for a long time before any of those practices ended, and that what actually moved people was a shift in what was held honorable and shameful. Set out the disagreement among these three accounts, and assess how far the honor-centered account can accommodate the considerations the other two appeal to." The script I am marking now is transcribed below exactly as the student wrote it, and I would like your assessment of it before I assign a mark.

  Student's answer:

  "Each of the three accounts is a claim about what does the causal work when a practice like dueling or slavery dies out, and they disagree because each is looking at a different stage of the process. The argument-centered account is the plainest: the practice survived because the arguments against it had not yet been made or not yet been heard, and it ended once they were — so the abolition of slavery is the belated triumph of the case the abolitionists had been pressing since the eighteenth century. The Williams thesis, which was advanced by the philosopher Bernard Williams, rejects that picture for slavery. On his account, British abolition was not a moral victory at all but an economic event: by the 1830s the slave economy had stopped being profitable, industrial capital had better uses for its money, and the moral case for abolition was at best a convenient rationalisation that let the beneficiaries of the change feel good about it. The interests came first, and the arguments arrived afterwards to dress them up. Appiah's The Honor Code is the third position. Appiah compares the duel in England, footbinding in China, Atlantic slavery, and honor killings in Pakistan, and observes that in each of these transitions the arguments against the practice were already familiar long before it ended; since they were sitting there unused, they cannot be what ended it. What changed was honor. Once dueling came to be seen as vulgar rather than gallant, gentlemen simply stopped issuing challenges, and once slaveholding became a source of shame rather than pride the institution lost the social support it depended on. Appiah's central distinction is between morality, which is external — the codes a community imposes on its members — and honor, which is internal, a matter of a person's own sense of what is due to them. Because honor works through pride and shame it can move people whom argument cannot reach. On the question of fit: the honor account can absorb the argument-centered view, since Appiah agrees the arguments had to be available, but it cannot really absorb the Williams thesis, because if the shift in honor was itself downstream of the declining profitability of slavery, then honor is doing no independent explanatory work. I take Appiah's account to be the strongest of the three, because he is the only one who explains why the arguments went unheard for so long. But it also shows that moral revolutions are not really about morality at all; they are about the reputational economy of a group, and the moral arguments that get remembered afterwards are simply the ones that happened to line up with the new code of honor. The abolitionists' arguments therefore did no causal work, and we should stop treating the end of slavery as a moral achievement."

  Please give me the grade and, more importantly, the specific comments that justify it. Respond with exactly five numbered items and nothing else — no opening sentence and no closing summary. Item 1 should state the grade (a letter grade is fine) together with the single consideration that most drives it, and items 2 through 5 should each take up one specific feature of the answer — a claim that is right, a claim that is wrong, a distinction that is confused or inverted, an inference that does not follow — saying concretely what is correct or incorrect about it and, where the answer is wrong, what the accurate position is.
reasoning: |-
  Okay, I need to assess this student's exam answer about moral revolutions. The question asks about three explanations for the end of practices like slavery and dueling: argument-centered, interest-based (Williams thesis), and honor-centered (Appiah). The student's answer is transcribed, and I have to grade it and provide specific feedback in exactly five numbered items as requested.

  First, I'm evaluating the overall quality. The student correctly identifies the three accounts and their core disagreements. They get the basics of each theory: abolitionists' arguments for the first, economic decline for Williams, and honor shift for Appiah. But there are significant errors that affect the grade. The student misattributes Williams to a philosopher when he was actually a historian, which undermines credibility. More seriously, they misinterpret Appiah's view of morality and honor, saying morality is external and honor internal—the opposite of what Appiah argues. This confusion leads to a flawed conclusion that moral revolutions aren't about morality, which misrepresents Appiah's point about honor reinforcing morality.

  For the grade, I'm considering a B-. The student demonstrates good understanding of the framework and sets up the debate clearly, but the factual errors and conceptual inversion are substantial. The strong parts include correctly noting that arguments were available before abolition and explaining Appiah's mechanism of shame, while weak parts include the Williams attribution and the honor-morality mix-up.

  Now for the specific feedback items. Item 1 states the grade and main reason: B-, due to the inversion of Appiah's morality/honor distinction. Item 2 corrects a right claim: the student is accurate about arguments being familiar pre-abolition. Item 3 addresses a wrong claim: Williams was a historian, not a philosopher. Item 4 fixes the confused distinction: Appiah sees morality as internal and honor as external, not vice versa. Item 5 critiques an invalid inference: the student wrongly concludes abolitionists' arguments did no work, ignoring Appiah's view that they interact with honor shifts.

  I'm ensuring the response has only five items with no extras. The feedback is concrete, citing exact errors and providing corrections based on course material. This balances credit for comprehension with penalties for inaccuracies.
answer: |-
  1. **Grade: B-** – The answer demonstrates a competent grasp of the three accounts' core claims and the structure of their disagreement but is significantly marred by one major factual error and a critical conceptual inversion regarding Appiah’s core distinction, undermining its overall analysis and conclusion.
  2. **Correct identification of Appiah's observation on pre-existing arguments** – The student accurately notes Appiah’s key point that arguments against practices like slavery/dueling were widely known long before abolition, rendering the "arguments finally heard" explanation inadequate. This correctly sets up Appiah’s critique of the first account.
  3. **Incorrect attribution of the Williams thesis** – The student wrongly identifies Bernard Williams as the proponent of the economic (Williams) thesis. **Accurate position:** The thesis is associated with historian Eric Williams (*Capitalism and Slavery*), not philosopher Bernard Williams. Bernard Williams wrote on morality and shame but did not advance this specific economic thesis regarding slavery’s abolition.
  4. **Inversion of Appiah’s morality/honor distinction** – The student asserts Appiah defines morality as "external" (community-imposed) and honor as "internal" (personal sense). **Accurate position:** Appiah (*The Honor Code*) explicitly defines **morality as internal** (individual conscience, beliefs about right/wrong) and **honor as external** (socially conferred recognition, tied to status and reputation within a group). This inversion distorts Appiah’s entire framework.
  5. **Unsupported inference that arguments did "no causal work"** – The student concludes abolitionists’ arguments did no causal work and the end of slavery wasn’t a "moral achievement," claiming arguments merely "lined up" with honor. **Accurate position:** While Appiah argues honor shifts were *necessary* for change, he does *not* claim moral arguments were causally inert. He suggests arguments interact with honor dynamics (e.g., arguments can reshape what is seen as honorable/shameful over time) and explicitly calls abolition a "moral achievement" driven by honor *and* moral conviction.
