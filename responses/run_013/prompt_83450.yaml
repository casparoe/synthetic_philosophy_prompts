  ### Thought Experiment: The Beacon and the Ships

  You are the keeper of a lighthouse on a quiet coast. Your lighthouse is at point A. Ten light-hours straight out to sea is a beacon at point B, stationary relative to you. A supply ship, the *Mariner*, is coasting toward the beacon at 0.6c (relative to you), passing your lighthouse at your time t=0. A scout ship, the *Voyager*, is coasting away from you at 0.8c (relative to you), passing your lighthouse at your t=0. The beacon is programmed to flash a bright light (the "target event") at its own local time 10 hours—which, since it shares your frame, is also your t=10 hours. This flash is in your *future*, as you are currently at t=0.

  Now, we consider the "now" slices of three observers:  
  1. **Your "now" at t=0 (lighthouse keeper):** This includes the *Mariner* ship at your location (x=0, t=0) and the beacon at its location (x=10 light-hours, t=0). The beacon’s clock reads 0 hours.  
  2. **The *Mariner*’s "now" when it is at x=6 light-hours (your frame):** The *Mariner* reaches x=6 at your t=10 hours (since 6/0.6=10). At this event, its "now" (in its frame) includes the *Voyager* ship at approximately x=9.85 light-hours (your frame) and your t≈12.31 hours.  
