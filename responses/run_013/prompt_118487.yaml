answer: |-
  ### Verdict
  Your friend captures Aristotle's core framework well but oversimplifies key nuances and misattributes later concepts (like "exploitation") to him. About 70% survives contact with the texts—the structural critique of interest as "unnatural" is authentically Aristotelian, but the emphasis on "exploitation" and the lineage claims are later interpretations. Use his spiel as scaffolding, but refine the pawnbroker’s arguments to align with Aristotle’s actual logic and 1620s scholastic context.

  ---

  ### Claim by Claim  
  *(✓ Accurate, ~ Half-right, ✗ Off)*  

  1. **"Money exists by convention, not nature"**  
     ✓ **Accurate.** *Politics* 1257a: Money is a human invention (νόμισμα, *nomisma*) for exchange, not natural like fruit or shelter.  

  2. **"Household management (οἰκονομία) is natural; wealth-getting (χρηματιστική) is unnatural"**  
     ✓ **Accurate.** *Politics* 1256b–1258a distinguishes "natural" provision of needs from "unnatural" accumulation of wealth for its own sake.  

  3. **"Trade for need is fine; trade for profit is a perversion"**  
     ~ **Half-right.** Aristotle condemns profit-driven trade (*kapēlikē*) as "justly blamed" (*Pol.* 1257a), but allows it if profit supports household needs (*Pol.* 1257b). He objects to *unlimited* gain, not profit *per se*.  

  4. **"Lending at interest is the worst form because money begets money"**  
     ✓ **Accurate.** *Politics* 1258b: Interest (τόκος, *tokos* = "offspring") makes money "reproduce," violating money’s purpose as a medium of exchange.  

  5. **"Aristotle’s real objection is exploitation—lenders grow rich off need without contributing"**  
     ✗ **Off.** Aristotle never frames usury as *exploitation of the borrower*. His objection is teleological: interest perverts money’s natural function. The "exploitation" angle is medieval (e.g., Aquinas) and Marxist.  

  6. **"He fudges value theory by using money to measure commensurability"**  
     ~ **Half-right.** In *Nicomachean Ethics* 1133a, he *does* use money to compare beds/houses but calls it a "convention," not a true measure of value. He’s puzzled by value’s source—but "fudge" undersells his insight into money’s social role.  

  7. **"He lacks the concept of demand"**  
     ✓ **Accurate.** Aristotle discusses "use value" but not subjective demand. Value for him derives from a thing’s purpose (τέλος, *telos*), not scarcity or desire.  

  ---

  ### The Real Aristotle  
  Aristotle’s critique hinges on **teleology** (purpose) and **natural limits**, not justice or fairness. Two critical corrections:  

  1. **Usury as "Unnatural" ≠ Exploitation**  
     Aristotle condemns interest because it makes money—a sterile tool—"breed" like animals (*Pol.* 1258b). Money’s sole purpose (*telos*) is facilitating fair exchange of useful goods. Interest divorces money from this purpose, creating value from nothing—a violation of nature’s order. **Why this matters:** Your pawnbroker *cannot* credibly argue "I’m not exploiting anyone" using Aristotle. His concern isn’t borrower vulnerability but cosmic disorder. The "exploitation" argument is a medieval innovation (e.g., Aquinas condemning usury as selling time, which belongs to God).  

  2. **Profit vs. Unlimited Accumulation**  
     Aristotle doesn’t reject profit outright; he rejects *chrematistics*: wealth-seeking without limit (*Pol.* 1257b). A merchant trading grain for silver to buy tools for his farm is "natural." A merchant trading grain for silver to buy more grain for more silver *ad infinitum* is "unnatural." **Why this matters:** Your pawnbroker could argue her loans help borrowers manage households (natural) rather than fuel endless profit (unnatural).  

  **Scholarly Disputes**:  
  - Some scholars (e.g., Joseph Schumpeter) argue Aristotle *does* imply a labor theory of value (e.g., *NE* 1133a: "all goods must be measured by some one thing... need, which holds everything together"). This is debated—but your friend’s "demand" critique is mainstream.  
  - The *tokos*=offspring metaphor is sometimes read as condemning usury’s "unnatural fertility," but others see it as mere wordplay. The core argument is teleological, not biological.  

  ---

  ### The Lineage Bit  
  The descent story is **partly flattering simplification**. Aristotle *did* influence the medieval Church (via Aquinas, who cited him to condemn usury as "unnatural"), but biblical prohibitions (e.g., Exodus 22:25, Luke 6:35) were primary. Aquinas blended Aristotle with Augustinian theology, adding the "time commodity" critique. Marx admired Aristotle’s insight that money obscures true labor value but rejected teleology. His "interest-bearing capital" critique rests on labor exploitation, not nature—a materialist inversion of Aristotle. The lineage exists, but each thinker reframed Aristotle for their context.  

  ---

  ### Lines for Your Pawnbroker (1620-Ready)  
  1. **"Reverend, even Aristotle grants that money’s purpose is to *serve* human needs—not to breed like livestock. When I lend to a widow to save her home, I restore money to its natural function: aiding necessity. Condemn those who hoard or gamble with coin, not those who use it as a bridge for the desperate."**  
     *(Uses Aristotle’s teleology; aligns with moderate scholastic views)*  

  2. **"You cite Leviticus, yet Aquinas himself—guided by Aristotle—taught that lending without *gain* is impossible in a fallen world. Does not the labor of securing pledges, tracking debts, and feeding my own household justify some recompense?"**  
     *(Invokes Aquinas’ *Secunda Secundae* Q78 on lenders’ labor costs; forces the preacher to confront Church pragmatism)*  

  3. **"Aristotle saw trade as natural when it sustains a household. My loans prevent starvation and ruin—surely *that* is household management, not usury?"**  
     *(Appeals to Aristotle’s household/oikonomia defense)*  

  **Avoid**:  
  - ✗ **"I don’t exploit anyone—I provide a service!"** (Aristotle cares about money’s purpose, not fairness).  
  - ✗ **"Interest reflects risk!"** (Risk-based interest was debated in 1620 but *not* Aristotelian; he’d see it as further perversion).  

  **Key**: Pair Aristotle with Aquinas. In 1620, a savvy pawnbroker would wield scholasticism against dogmatism.  

  ---  
  *Final note: For authenticity, have her cite "the Philosopher" (Aristotle’s medieval title) and "Doctor Angelicus" (Aquinas). This signals learnedness without anachronism.*
