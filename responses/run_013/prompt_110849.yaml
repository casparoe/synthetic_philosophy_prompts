answer: |-
  ### Brainstorming Candidate Readings of "He could (not) have done otherwise"
  The phrase is a chameleon, shifting meaning with context. Key axes of variation:
  - **Modality**: What *type* of possibility does "could" denote? Physical, causal, epistemic, practical, or moral?
  - **Scope**: Does it refer to the *agent's capacities* (could *he* have done it?), *external opportunities* (was it *possible for him* to do it?), or *causal-historical necessity* (was it *determined* that he wouldn’t)?
  - **Counterfactual baseline**: Is it comparing the *same agent in identical circumstances* or allowing for *different agential states* (e.g., a more prudent version)?
  - **Temporal perspective**: Is it about *open futures* (genuine branching paths *before* action) or *retrospective necessity* (inevitability *after* action)?
  - **Discursive function**: Is it a *neutral description* or a *covert moral judgment* (e.g., implying "therefore blameless")?
  - **Constraint threshold**: Does "could not" mean *physically impeded* ("his hands were tied") or *causally necessitated* ("the prior state of the universe + laws dictated his act")?

  ### Numbered Menu of Readings
  1. **Physical/Opportunity Reading**  
     *Meaning*: No external obstacle prevented the action (e.g., unlocked door, no physical restraint).  
     *Status*: Platitude (trivially true in standard cases of voluntary action).  
     *Supports barrister*: Directly – if true, agent had practical opportunity to act differently.  
     *Supports researcher?*: No – irrelevant to blame’s "fictional" status.

  2. **Capacity Reading**  
     *Meaning*: The agent possessed the inherent ability/skill to perform the alternative action (e.g., could have chosen salad over steak).  
     *Status*: Platitude/defensible (barring disability, we assume basic volitional capacity).  
     *Supports barrister*: Yes – if agent had capacity and opportunity, "could have" is satisfied.  
     *Supports researcher?*: No – capacity is compatible with causal determination.

  3. **Epistemic Reading**  
     *Meaning*: For all we knew *before* the act, the outcome wasn’t certain; alternatives were *predictively* possible.  
     *Status*: Defensible (causal determinism doesn’t imply predictability).  
     *Supports barrister*: Weakly – justifies *ex ante* assessments of responsibility.  
     *Supports researcher?*: No – blame isn’t fictional just because outcomes are unpredictable.

  4. **Practical Feasibility Reading**  
     *Meaning*: Doing otherwise was a *live option* given the agent’s beliefs/desires (e.g., "I could have left, but I *really* wanted to stay").  
     *Status*: Defensible (core to criminal law’s "voluntariness" requirement).  
     *Supports barrister*: Central – if action aligned with desires and no coercion, blame may apply.  
     *Supports researcher?*: No – desires may themselves be determined.

  5. **Moral Permissibility Reading**  
     *Meaning*: Doing otherwise was *ethically allowed* (e.g., "He could have told the truth" implying it was permissible).  
     *Status*: Substantive but dubious (conflates possibility with permissibility).  
     *Supports barrister*: Indirectly – if doing otherwise was *good*, blame for not doing it follows.  
     *Supports researcher?*: No – distinct from causal possibility.

  6. **Causal Possibility Reading (Compatibilist)**  
     *Meaning*: In the *actual circumstances* (including the agent’s psychology), doing otherwise was consistent with physical laws *if* the agent had willed it.  
     *Status*: Substantive and defensible (classical compatibilism).  
     *Supports barrister*: Strongly – grounds responsibility in responsiveness to reasons.  
     *Supports researcher?*: No – explicitly compatible with determinism.

  7. **Causal Necessity Reading (Incompatibilist)**  
     *Meaning*: Given the *entire past state of the universe + laws of nature*, only one outcome was ever possible; alternative actions were *nomologically impossible*.  
     *Status*: Substantive and defensible (if determinism is true).  
     *Supports researcher*: Crucially – if true, agent *literally* had no alternative, undermining "choice" and thus blame.  
     *Supports barrister?*: No – he rejects this as irrelevant to criminal culpability.

  8. **Exculpatory Verdict Reading**  
     *Meaning*: "Could not have done otherwise" *means* "is not blameworthy" (e.g., in cases of coercion or insanity).  
     *Status*: Dubious (conflates description with judgment).  
     *Supports researcher*: Circularly – if the phrase *defines* blamelessness, his conclusion follows trivially.  
     *Supports barrister?*: No – he sees blame as depending on acts, not metaphysics.

  9. **Same-Agent-Same-Circumstances Reading**  
     *Meaning*: Holding *every prior state* (including brain states) fixed, no alternative action was possible.  
     *Status*: Defensible if determinism is true; false if indeterminism holds.  
     *Supports researcher*: Directly – neuroscience implies fixed prior states dictate action.  
     *Supports barrister?*: No – he rejects this as the *wrong standard* for responsibility.

  10. **Capacity/Opportunity Holist Reading**  
      *Meaning*: "Could" requires *both* internal capacity *and* external opportunity (criminal law’s standard view).  
      *Status*: Defensible platitude.  
      *Supports barrister*: Fully – his "door unlocked" remark invokes this.  
      *Supports researcher?*: Only if he denies capacities exist – which he doesn’t.

  ### Analysis: Who Meant What, and Were They Contradicting?
  - **Researcher**: Almost certainly invoked **Reading 7 (Causal Necessity)** or **9 (Same-Agent-Same-Circumstances)**. His neuroscience framing (readiness potential) implies that neural determinism entails "no genuine alternative," justifying his claim that blame is a "fiction."  
  - **Barrister**: Clearly invoked **Reading 1 (Physical Opportunity)** or **10 (Capacity/Opportunity Holism)**. His "door unlocked" metaphor emphasises practical freedom – no external constraint, so blame applies.  
  - **Contradiction?**: **No substantive disagreement on facts, but total divergence in meaning.** The barrister addressed *forensic* possibility (could he, practically, have walked away?), while the researcher addressed *metaphysical* possibility (was any outcome undetermined?). They were ships passing in the night.  
  - **Compatibilist/Incompatibilist Fault Line**: This emerges *after* disambiguation. The researcher assumes blame requires **Reading 7** (incompatibilism). The barrister assumes blame requires only **Reading 10** (compatibilism). The real debate is whether *legal responsibility* demands indeterminism (incompatibilism) or merely rational agency (compatibilism).  
  - **The Researcher’s Required Reading**: Only **Reading 7** (Causal Necessity) robustly supports his "blame is fiction" conclusion. But this reading is irrelevant to criminal law, which operates on **Readings 1, 4, 6, and 10**. The barrister’s position survives determinism intact unless neuroscience *also* disproves agency (e.g., by showing choices aren’t reason-responsive) – which readiness potentials alone don’t establish.  

  ### In Brief
  They weren’t contradicting but equivocating. The barrister’s "could" is about **feasible alternatives in the situation**; the researcher’s is about **causal alternatives in a deterministic universe**. The former is essential to law; the latter, if true, may unsettle philosophers but not courtroom practice. The researcher’s conclusion holds *only* if "could" means **causal possibility under determinism** – a meaning the barrister rightly rejects as immaterial to justice.
