answer: |-
  Here’s a practical decision procedure for your committee, designed for 45-minute quarterly sessions. It breaks into four phases, with clear stopping points and pre-defined outputs. **Critical rule: If any step returns "Unclear" or "Absurd," it goes to the Board for a values-based vote.** Vets/producers assess *evidence*, not philosophy.

  ---

  ### **Phase 1: Feasibility Screen (5 mins)**
  *   **Question:** *Can we physically apply our core welfare standards (e.g., humane slaughter, environmental enrichment) to this context?*
  *   **Sufficient Answer:**
      *   **Yes:** Technically feasible & measurable (e.g., cricket farm can implement rapid-kill methods).
      *   **No:** Impossible with current tech/knowledge (e.g., ensuring "no suffering" for wild aphids sprayed in a field).
      *   **Unclear:** Methods exist but are impractical/untested at scale → **STOP, refer to Board.**
  *   **Output:** "No" ends the assessment. "Yes" proceeds to Phase 2.

  ---

  ### **Phase 2: Sentience Probability Assessment (20 mins)**
  **Focus:** Veterinary-assessable evidence. **Threshold:** Requires **≥2 "Yes"** across 3 pillars to proceed. One "No" fails. "Unclear" refers to Board.

  | Pillar               | Evidence Vets Can Assess                                                                 | Yes (Likely Sentient)                                  | No (Unlikely Sentient)                                | Unclear                                                                 |
  | :------------------- | :--------------------------------------------------------------------------------------- | :----------------------------------------------------- | :---------------------------------------------------- | :---------------------------------------------------------------------- |
  | **1. Neuroanatomy**  | Dissection, microscopy, literature on CNS structure.                                     | Distinct brain regions; neural complexity comparable to accepted sentient invertebrates (e.g., honeybee). | Diffuse nerve net; no cephalization; no brain structures. | Intermediate complexity (e.g., some ganglia but poorly studied).        |
  | **2. Behavioral Trade-offs** | Documented lab/field observations (avoid learning curves!).                               | Avoids harm despite cost (e.g., sacrifices food for safety); operant conditioning to escape noxious stimuli. | Purely reflexive responses; no cost-benefit decisions. | Limited data; ambiguous motivation (e.g., avoidance but no cost paid). |
  | **3. Pharmacology**  | Peer-reviewed studies on response to analgesics/anesthetics (if available).              | Noxious stimulus response blocked *selectively* by analgesics (not general sedatives). | No response modulation by pain-relieving drugs.       | No/inconclusive studies.                                                |

  ---

  ### **Phase 3: Welfare Loss Calculation (10 mins)**
  *   **Inputs:**
      *   `N` = Annual # affected (use producer data or published estimates).
      *   `P_sent` = Sentience probability from Phase 2: **0.1 (Yes), 0.01 (Unclear/Board), 0 (No)**.
      *   `W` = Welfare loss per individual vs. broiler chicken (scale: 1.0 = broiler chicken).
          *   *Vet estimate based on:* **Kill method painfulness** (e.g., maceration = severe, freezing = moderate) & **lifetime conditions** (confinement, deprivation).
  *   **Formula:** `Annual Welfare Loss (AWL) = N × P_sent × W`
  *   **Absurdity Check:** **Is `N × P_sent > 10^12` (1 trillion)?** → **YES = ABSURD, STOP, refer to Board.** (Reason: Trivial probabilities × astronomical N lose meaning; math obscures values debate).

  ---

  ### **Phase 4: Decision Threshold (5 mins)**
  *   **Compare:** `AWL` vs. Broiler Chicken AWL (benchmark = `N_broilers × 1.0 × 1.0`).
  *   **Decision:**
      *   `AWL ≥ 0.1 × Broiler AWL` → **Apply standards** (requires cost justification).
      *   `AWL < 0.1 × Broiler AWL` OR **Absurd/Unclear** → **No coverage** (or Board vote).

  ---

  ### **Application to Your Cases**
  **(1) Black Soldier Fly Larvae (Mass-Rearing)**
  *   **Phase 1:** Yes (humane kill feasible via instant freezing/maceration+anesthesia).
  *   **Phase 2:**
      *   Neuro: No (diffuse ganglia, no brain). → **STOP. NO COVERAGE.**
      *   *Why it bites for producers:* Vets conclude no sentience evidence. Retailers get no label. **Justification:** "Lack of neural structures required for subjective experience."

  **(2) Crickets (Retailers' Priority)**
  *   **Phase 1:** Yes (controlled environment, rapid kill possible).
  *   **Phase 2:**
      *   Neuro: Unclear (centralized brain but simpler than bees).
      *   Behavior: Yes (learn avoidance, trade-offs documented).
      *   Pharmacology: Unclear (limited studies). → **2 Unclear → REFER TO BOARD.**
  *   *Committee headache:* Science is ambiguous. Board must decide if behavioral evidence alone justifies `P_sent = 0.1`+.

  **(3) Wild Insects (Pest Control)**
  *   **Phase 1:** **No** → **STOP. NO COVERAGE.**
  *   *Why it bites for the Chair:* Even with trillions (N) and debatable sentience, **standards are impossible to implement in the wild**. Leverage is zero. **Justification:** "Certification requires enforceable controls; none exist for field populations."

  ---

  ### **One-Page Justification Template (For Costs)**
  ```
  SPECIES: [e.g., Cricket]
  SENTIENCE ASSESSMENT: 
     Neuro: [Yes/No/Unclear] | Behavior: [Yes/No/Unclear] | Pharma: [Yes/No/Unclear]
  OVERALL P_sent: [0.1 / 0 / Referred to Board]
  WELFARE LOSS PER INDIVIDUAL (W): [e.g., 0.3] (Based on [stressful conditions/humane slaughter method])
  ANNUAL WELFARE LOSS (AWL): [Calculated value] 
  DECISION THRESHOLD: AWL ≥ [X]% of broiler chicken AWL → STANDARDS APPLIED.
  JUSTIFICATION: Our evidence-based procedure indicates a non-negligible probability of sentience ([Summary of key evidence, e.g., "complex avoidance behavior"]). Failing to mitigate suffering where feasible conflicts with Clause [X] of our charter. Implementation cost: [$Estimate]. 
  ```

  ---

  ### **What This Procedure CANNOT Do**
  1.  **Resolve fundamental philosophical disagreements** (e.g., "Is consciousness binary?"). Unclear evidence goes to the Board.
  2.  **Handle species with zero empirical data.** Requires at least *some* vet-assessable evidence.
  3.  **Assign precise moral weights.** Uses broiler chicken as a fixed benchmark; `W` is a vet estimate.
  4.  **Make math "ethical".** Flags absurdity (N × P_sent > 1 trillion) as a values decision for the Board.
  5.  **Enforce the unenforceable.** Rejects cases where welfare standards cannot be implemented or audited (e.g., wild insects).

  **Before adoption:** Run a mock 45-min session with your three cases. Assign roles (e.g., vet for anatomy, producer for feasibility). You'll likely end with BSF (No), Crickets (Board), Pests (No) – forcing a tough but honest conversation at the Board level about how far the label should stretch.
