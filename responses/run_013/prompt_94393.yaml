  Limitations: The procedure can't handle species without direct evidence, relies on current science, and can't resolve moral disagreements. Acknowledging this upfront prevents overreach and sets realistic expectations. The one-page justification for costs must be based on sentience likelihood, which the procedure provides through clear criteria assessments.

