prompt: |-
  I am setting the agenda for a small formal epistemology group — myself, two doctoral students, and a two-year grant — and we have to decide where to spend it. Our current focus is the problem of old evidence, and I have come to think the received framing of that problem is too narrow. Before you answer, I want you to assess the framing rather than accept it.

  As I understand the received framing: a Bayesian agent is certain of its evidence, so conditionalizing on evidence it already possesses changes nothing, and the old evidence therefore cannot confirm the hypothesis it is supposed to support. The standard repairs — asking what the agent's credence in the hypothesis would have been had it never learned the evidence; subtracting off the portion of the evidence already counted in the prior; insisting that evidence is rarely certain and treating it as merely probabilified; or abandoning diachronic confirmation altogether in favor of an atemporal relation between hypothesis and evidence — all take for granted that the space of possibilities is fixed and that learning consists only in redistributing credence across it. I suspect that old evidence is one face of a more general difficulty for agents who are not logically omniscient: an agent can learn only what it is uncertain about, yet its total evidence is by definition certain, and the algebra of propositions it treats as possible may itself be something it must revise. The problem of new theories looks like the same difficulty from the other side, and the stock cases have the same shape — a theory constructed to accommodate a datum that is then cited as confirming it, as with the long-known residual in the precession of Mercury's perihelion, or a design calibrated on the very failures it is later said to explain; a conjecture believed for years and only then proved; a scientist who rereads her own notebook and must decide what to believe about a measurement she has forgotten; and, most sharply for us, a model whose performance is reported on data drawn from the distribution on which it was trained.

  Suppose for the sake of argument that this frame is worth adopting. Which open questions within it should a group like ours actually work on, in what order, and why? I want a defended agenda, not a survey. For each question: why it is upstream of the others; whether it is tractable with the tools of formal epistemology rather than requiring empirical psychology or machine learning; whether anything downstream would change if it were settled; and what would move it up or down the list over the next two years.

  Then tell me where the frame itself is wrong. In particular: is non-omniscience one problem or a family of loosely related ones? Are the practical cases genuine instances of the same difficulty, or do they merely resemble it? And is there a question outside my frame that ought to be at the top of the list regardless?

  I have no use for a reading list; what I need is the argument for the ordering, including your strongest case against your own first choice.
reasoning: |-
  Okay, this user is setting an agenda for a formal epistemology group focused on the problem of old evidence. They've clearly done their homework—they know the standard Bayesian responses and think the framing is too narrow. Their idea is that the core issue is non-logical omniscience, where agents have to revise not just credences but their entire possibility space. 

  Hmm, they're rejecting survey-style answers and want a defended agenda. That's a high bar—they need actionable research questions ranked by priority, with clear reasoning. And they demand self-critique! Also, they dismiss reading lists outright. This is someone who wants to cut to the philosophical chase.

  First, I need to validate their reframing. The connection between old evidence and new theories feels right—both involve fixed possibility spaces failing agents. Mercury's perihelion is a classic example, but their "model trained on test data" case is deliciously modern. 

  *scratches head* The real challenge is sequencing. Where to start without getting stuck in the weeds? Prioritization hinges on: 
  - Upstream foundational work (does it unlock other problems?) 
  - Formal tractability (no psychology/ml cop-outs) 
  - Downstream impact (will answers change anything?) 
  - Timeliness (what could reshuffle priorities?)

  Their frame might over-unify. Is forgetting a measurement really the *same* as discovering GR? But the structural parallels are strong enough to explore. 

  *mental note* Must preempt their skepticism—they'll spot any dodged bullets. The agenda needs built-in counterarguments. Like: why not start with confirmation bias instead of possibility spaces? Because that's empirical—formal tools can't touch it directly. 

  *aha* The knockout punch: if we solve the possibility space revision, does it actually help the scientist rereading her notebook? If not, the frame cracks. But that's why Question 3 exists—to test applicability. 

  Final agenda structure: 
  1. Question 1 is the skeleton key (formalizing possibility spaces) 
  2. Question 2 stress-tests it (dynamics of evidence certainty) 
  3. Question 3 probes generality (applying to practical cases) 
  4. Question 4 integrates rival approaches (like abductive confirmation) 

  *steels self* Now for the brutal part: attacking their frame. Non-omniscience isn't one beast—it's a hydra. Learning logical truths vs. updating on forgotten data might need different tools. But that's productive! The agenda isolates the *shared* core. 

  *grudging admission* They're right that confirmation theory's stagnation needs this shakeup. But the biggest threat? If all we get are toy models that ignore computational constraints—then we've just built a prettier cage.
answer: |-
  Your reframing is incisive and correct: the problem of old evidence is indeed a symptom of the deeper tension between logical non-omniscience and Bayesian idealization. The core pathology is that **certain evidence cannot be "learned" under standard Bayesianism, yet non-ideal agents routinely gain epistemic value from re-encountering or re-contextualizing what they already know**. Your unification with new theories (e.g., Mercury’s perihelion) and cases like model overfitting reveals the underlying mechanism: **agents must sometimes revise not just credences, but their space of possibilities or interpretive frameworks**. Below is a defended research agenda prioritizing tractable, high-leverage questions within your frame, followed by a critique of its limitations.

  ---

  ### **Research Agenda: Priorities and Rationale**
  **Overarching Goal**: Formalize how non-omniscient agents *expand or restructure their epistemic state* to resolve confirmation puzzles.

  #### **Question 1: How can we model *revisions to the possibility space* (Ω) as a rational response to old evidence?**  
     - **Why upstream?** Until we formalize how Ω evolves, we cannot address *how* old evidence becomes uncertain (e.g., via conceptual/semantic shifts). This underpins all your cases:  
       - *Mercury’s perihelion*: Newtonian Ω lacked the resources to represent GR’s curvature.  
       - *Model overfitting*: The "true distribution" isn’t in Ω if the model class is misspecified.  
       - *Forgotten measurement*: Forcing recall expands Ω to include previously latent possibilities.  
     - **Tractability**: Use dynamic epistemic logic (DEL) or belief revision theory to define Ω-transition operators (e.g., "refinement" for new theories, "coarsening" for memory lapses). Avoids psychology/ML.  
     - **Downstream impact**: Resolves *why* old evidence can confirm (Ω-change makes it uncertain again); enables models of theory change.  
     - **Move up if**: New logics for conceptual innovation emerge (e.g., from philosophy of science). Move down if: Framing Ω-change proves intractable without numerical methods.  

  #### **Question 2: What constitutes *evidence certainty* for non-omniscient agents?**  
     - **Why next?** Even after Ω-change, we need a non-ideal definition of "certainty." Standard Bayesianism conflates *psychological certainty* (subjective conviction) with *logical incorrigibility* (P(e) = 1).  
       - *Cases*: A scientist rereading notes is *psychologically* uncertain until verification, even if the note is factually correct.  
     - **Tractability**: Formalize "epistemic entrenchment" (à la belief revision) or computational irreversibility (e.g., proof verification takes work). Requires no new empirics.  
     - **Downstream impact**: Clarifies when old evidence *should* confirm (e.g., only when certainty is defeasible). Grounds models of memory/trust.  
     - **Move up if**: Proof-theoretic accounts of uncertainty gain traction. Move down if: The group splits on "certainty" definitions.  

  #### **Question 3: How do *pragmatic constraints* (e.g., memory, attention) generate *de facto* old evidence problems?**  
     - **Why third?** Tests the frame’s generality against "messy" cases (e.g., forgotten measurements, overfitted models).  
       - *Key insight*: Computational limitations (e.g., memory decay) force re-learning, making old evidence functionally new.  
     - **Tractability**: Merge DEL with resource-bounded reasoning (e.g., *heuristic belief revision*). Avoids ML/psychology if framed axiomatically.  
     - **Downstream impact**: Shows whether "ideal" solutions (Q1–Q2) scale to real agents; informs debiasing (e.g., in ML).  
     - **Move up if**: Overfitting cases dominate discussions; move down if: Framed as merely "applied."  

  #### **Question 4: Can we unify *abductive confirmation* (e.g., theory construction) with Bayesian updates under Ω-change?**  
     - **Why last?** Builds on Q1–Q3 to tackle new theories (e.g., GR explaining Mercury).  
       - *Challenge*: Abduction often *creates* hypotheses to fit data, violating standard confirmation.  
     - **Tractability**: Extend Bayesian abduction (e.g., "inference to the best explanation" as prior-shifting) with Ω-dynamics.  
     - **Downstream impact**: Closes the loop between old evidence and new theories.  
     - **Move up if**: Q1 yields a viable Ω-change model.  

  ---

  ### **Critique of Your Frame**
  **Strengths**: Your unification of old evidence/new theories is novel and correct. Cases like model overfitting are *genuine instances*: when training data is reused for testing, the "evidence" is old, but the *interpretative framework* (e.g., generalization error) is new.  

  **Weaknesses**:  
  1. **Non-omniscience is a family of problems, not one**. Logical ignorance (can’t derive consequences) is distinct from *semantic plasticity* (reconceiving concepts) or *pragmatic fragility* (forgetting). Your frame risks over-unification.  
     - *Mitigation*: Q1–Q3 isolate distinct mechanisms.  
  2. **Not all cases are structurally identical**. Mercury’s perihelion involves *theory-driven Ω-expansion*; model overfitting is *algorithmic Ω-misspecification*; forgetting is *Ω-contraction*. Similar symptoms, different etiologies.  
  3. **The frame neglects *doxastic voluntarism***. Can agents *choose* to make old evidence uncertain (e.g., "bracketing" beliefs)? This may be essential for scientific creativity.  

  **A Question Outside Your Frame**:  
  **How does *metaknowledge* (e.g., knowing what one doesn’t know) trigger Ω-revision?** For example, recognizing that Mercury’s orbit *could* challenge Newtonian physics presupposes awareness of explanatory gaps. This is upstream of Q1 and should be prioritized if your group has logic expertise.  

  ---

  ### **Strongest Case Against Starting with Q1**
  **Objection**: Formalizing Ω-revision (Q1) without empirical constraints risks *empty formalism*—e.g., defining "conceptual innovation" operators that don’t illuminate real scientific practice (e.g., how Einstein reframed gravity).  
  **Rebuttal**: Q1’s tractability and foundational role outweigh this. Without it, Q2–Q4 lack a framework for non-omniscient dynamics. But *monitor progress*: If no plausible Ω-change operators emerge in 6 months, pivot to Q3 (pragmatic cases) to ground the theory.  

  ---

  ### **Summary: Why This Order**  
  1. **Q1** is the *sine qua non*: It replaces the static Ω assumed in old evidence debates.  
  2. **Q2** resolves *how* evidence becomes uncertain—essential for confirmation.  
  3. **Q3** tests the frame’s applicability to practical epistemology.  
  4. **Q4** integrates abduction, completing the loop.  

  **Timeframe**: Aim to draft a logic for Ω-revision (Q1) by Year 1’s end. Use Year 2 for Q2–Q4, with peer feedback at each stage. If the frame cracks, fall back to Q3 as a diagnostic.
