  Below is a decision tree/flowchart designed to map positions on Wittgensteinian "hinges" from *On Certainty*, starting from the shared premise that some beliefs are so basic that doubting them is nonsensical (like the ground we stand on). The tree sorts views by **four key dimensions**:  
  1. **Nature of hinges**: Propositions with truth-values vs. non-propositional (skills/instincts/actions).  
  2. **Relation to hinges**: Epistemic (knowing/entitlement) vs. non-epistemic (outside the "knowledge game").  
  3. **Universality**: One set for all humans vs. relative to practices/forms of life.  
  4. **Revisability**: Can hinges be rationally revised/criticized?  

  Each branch is a concrete question answerable without prior knowledge of the views. The tree yields **8 distinct positions** (6 named, 2 unnamed), with awkward commitments highlighted. It also addresses your two cases:  
  - **Case (a)**: The delusional individual (functional hinge for one person).  
  - **Case (b)**: Community-level hinge revision (e.g., scientific revolutions).  

  ---

  ### **Decision Tree: What Are Hinges?**  
  Start with the agreed premise: *Some beliefs are so basic that doubting them isn't a mistake but nonsense—they're like the ground we stand on, not claims we check.*  

  1. **Are hinges best understood as *propositions* (true/false claims) or as *non-propositional* (e.g., instincts, skills, ways of acting)?**  
     - **Propositions** → Go to 2A  
     - **Non-propositional** → Go to 2B  

  ---

  #### **Branch A: Hinges as Propositions**  
  2A. **When we rely on hinges, is this a form of *knowing* (or being entitled to believe), or is it *outside the "knowledge game" altogether* (e.g., saying "I know" here feels misplaced)?**  
     - **Knowing/entitlement** → Go to 3A  
     - **Outside knowledge game** → Go to 3B  

     3A. **Are these hinges the *same for all humans*, or do they *depend on practices/forms of life*?**  
        - **Same for all humans** → **Position 1: Universalist Foundationalism**  
          - *Description*: Hinges are universal, propositional, and known.  
          - *Awkward commitment*: Must explain why delusions (Case a) aren’t hinges—e.g., by pathologizing dissent. Struggles with historical change (Case b).  
        - **Depend on practices** → **Position 2: Relativist Foundationalism**  
          - *Description*: Hinges are community-specific propositions, known within their context.  
          - *Awkward commitment*: Truth varies by community; hard to explain how one community "knows" Earth is flat while another "knows" it’s round.  

     3B. **Are these hinges *universal* or *practice-relative*?**  
        - **Universal** → **Position 3: Universal Non-Epistemic Propositionalism**  
          - *Description*: Hinges are universal propositions, but our relation isn’t epistemic—they’re "bedrock" for thought itself.  
          - *Awkward commitment*: Cannot explain *why* we have *these* hinges (e.g., "hands exist") and not others (e.g., delusions).  
        - **Practice-relative** → **Position 4: Wittgensteinian Contextualism**  
          - *Description*: Hinges are propositions that *define* a form of life; calling them "known" misses their role.  
          - *Awkward commitment*: No rational way to criticize another community’s hinges (e.g., flat-Earthers vs. scientists).  

  ---

  #### **Branch B: Hinges as Non-Propositional**  
  2B. **Are hinges *universal human fixtures* or *dependent on shared practices*?**  
     - **Universal human fixtures** → Go to 3C  
     - **Dependent on practices** → Go to 3D  

     3C. **Can hinges *change* through rational critique/revision?**  
        - **Yes** → **Position 5: Dynamic Animality (unnamed)**  
          - *Description*: Hinges are evolved, species-wide instincts open to rational refinement.  
          - *Awkward commitment*: Revision is glacial (e.g., via evolution), making scientific revolutions (Case b) hard to explain.  
        - **No** → **Position 6: Fixed Animality**  
          - *Description*: Hinges are biologically fixed, pre-linguistic "ways of acting" (e.g., trust in senses).  
          - *Awkward commitment*: Cannot account for hinge shifts in history (Case b).  

     3D. **Can a community *rationally revise* its hinges?**  
        - **Yes** → **Position 7: Practice-Based Dynamism**  
          - *Description*: Hinges are communal habits open to collective reflection (e.g., post-scientific revolution).  
          - *Awkward commitment*: Revision isn’t rule-based—it’s a messy shift in "what we do," risking arbitrariness.  
        - **No** → **Position 8: Practice-Based Inertia (unnamed)**  
          - *Description*: Hinges are immutable cultural instincts; change is non-rational (e.g., drift, coercion).  
          - *Awkward commitment*: Makes hinge shifts (Case b) inexplicable or irrational.  

  ---

  ### **Key to Your Cases**  
  - **Case (a): The delusional individual**  
    - **Functional hinges count as hinges ONLY if hinges are *practice-relative***:  
      - Positions 2, 4, 7, and 8 *could* call the delusion a hinge (if we treat the individual as a "form of life").  
      - Positions 1, 3, 5, and 6 **exclude it** (hinges must be universal or communal).  
    - **Branch deciding this**: Universality (Step 3A/3B/3C/3D). Relativist branches permit individual hinges.  

  - **Case (b): Community hinge revision**  
    - **Only revisable positions explain this**:  
      - Position 7 (Practice-Based Dynamism) handles it best.  
      - Position 5 (Dynamic Animality) struggles (too slow).  
      - Positions 2 & 4 (propositional relativism) allow revision but debate *how* rational it is.  
    - **Static positions (1, 3, 6, 8) cannot explain it**.  

  ---

  ### **Empty Slots & Indistinguishable Views**  
  - **Empty Slot**: Position 5 (Dynamic Animality) has no clear adherents. *Reason*: Unattractive (biologizes rationality; revision is implausibly slow).  
  - **Hard to Distinguish**:  
    - Position 2 (Relativist Foundationalism) vs. Position 4 (Wittgensteinian Contextualism).  
      - *Why*: Both treat hinges as relative propositions. The "knowing vs. non-epistemic" distinction often collapses in practice.  
    - Position 7 (Practice-Based Dynamism) vs. Position 4 (Wittgensteinian Contextualism).  
      - *Why*: Both explain hinge shifts, but differ on whether hinges are propositional (4) or instinctual (7)—a subtle difference.  

  ---

  ### **Tree Summary**  
  | Position | Name                          | Hinge Nature | Relation      | Universality | Revisable? |  
  |----------|-------------------------------|--------------|---------------|--------------|------------|  
  | 1       | Universalist Foundationalism | Propositional | Knowing      | Universal    | No         |  
  | 2       | Relativist Foundationalism   | Propositional | Knowing      | Relative     | Yes (implied) |  
  | 3       | Universal Non-Epistemic Prop.| Propositional | Non-epistemic | Universal    | No         |  
  | 4       | Wittgensteinian Contextualism| Propositional | Non-epistemic | Relative     | Yes (implied) |  
  | 5       | Dynamic Animality (unnamed)  | Non-prop.    | —            | Universal    | Yes        |  
  | 6       | Fixed Animality              | Non-prop.    | —            | Universal    | No         |  
  | 7       | Practice-Based Dynamism      | Non-prop.    | —            | Relative     | Yes        |  
  | 8       | Practice-Based Inertia (unnamed)| Non-prop. | —            | Relative     | No         |  

  Use this tree to "sort" your group. Focus on where answers to the questions *naturally* lead—not labels. For your brother-in-law, note that **only relativist positions (2, 4, 7, 8) might grant his delusion functional hinge-status**—but they *also* imply his view can’t be "disproven" from outside his form of life.
