  For (b), the LLM contrast is juicy. If she says simple organisms have "genuine" self-misrepresentation while LLMs merely simulate it, the follow-up must challenge that distinction: isn't that just anthropocentrism? This digs into whether she's smuggling in biological chauvinism. 

