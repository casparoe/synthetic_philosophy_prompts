  Here is a prioritized research agenda for conceptual/normative work on genocide and mass atrocities, defended using your criteria (upstream nature, tractability for conceptual work, neglect, impact on practice), incorporating your proposed reframings as core candidates, and explicitly stating the contested/settled landscape:

  **Core Prioritization Criteria Applied:**
  1.  **Upstreamness:** Does resolving this question fundamentally reshape downstream debates (definition, application, response)?
  2.  **Conceptual/Normative Tractability:** Can it be primarily addressed through philosophical, conceptual, historical, and normative analysis, not requiring new large-scale empirical data or legal adjudication?
  3.  **Neglect vs. Importance:** Is it significantly under-theorized relative to its fundamental significance?
  4.  **Impact on Practice:** Would clarity here change how scholars, advocates, policymakers, or institutions understand, label, or respond to atrocities?
  5.  **Deprioritization:** Questions where even clear answers are unlikely to change practice significantly without upstream shifts, or are primarily empirical/legal.

  **The State of Play: Genuinely Settled vs. Contested**

  *   **Settled (Broad Consensus):**
      *   The UN Genocide Convention (UNGC) definition is the binding *legal* standard for international criminal tribunals and state obligations *under the convention*.
      *   The legal definition requires specific intent (*dolus specialis*) to destroy a protected group "in whole or in part."
      *   "Protected groups" under the UNGC are national, ethnical, racial, or religious groups. Expanding this list requires treaty amendment.
      *   The label "genocide" carries immense political, moral, and symbolic weight distinct from other atrocity labels (e.g., crimes against humanity, war crimes).
      *   The application of the genocide label *in practice* is highly politicized, involving state interests, advocacy goals, and geopolitical calculations.
      *   The current legal framework creates a "status gap" where atrocities not meeting the strict legal definition (e.g., politicide, cultural destruction without mass killing) may lack equivalent legal recognition or triggering mechanisms.
      *   There is no formal, universally accepted *non-legal* authority for declaring genocide outside of judicial processes.

  *   **Contested (Core Areas of Dispute):**
      *   **The Core Wrong:** What *fundamentally* makes genocide distinctively evil? Is it primarily the *physical destruction* of a group (the traditional legal view), the *destruction of group identity/social existence* (your reframing), the *intent to destroy*, or something else (e.g., the attack on human diversity)?
      *   **Purpose of the Category:** Is "genocide" primarily a *legal* tool for prosecution, a *moral* category for condemnation, a *political* tool for mobilization/intervention, a *historical* category for analysis, or something else? Can one definition serve all these masters?
      *   **Authority to Name:** Who *should* have the legitimacy to declare a situation genocide outside a courtroom? States? NGOs? UN bodies? Scholars? What confers legitimacy - expertise, representativeness, impartiality, democratic mandate?
      *   **Consequences of Naming:** What *should* follow normatively or practically from a genocide declaration? Is it primarily about triggering *legal* obligations (like the UNGC's Art. I), creating *moral* duties (e.g., to intervene, remember, or provide refuge), allocating *political* standing, or something else? Is the current link between naming and specific actions (especially military intervention) coherent or desirable?
      *   **Scope of "Destruction":** Does "destroy" encompass *non-physical* destruction (forced assimilation, cultural suppression, institutional dismantling) as a *core* element of genocide, or are these secondary or separate harms? (Directly relates to your first reframing).
      *   **The "Politics of Naming":** Is the politicization inherent and unavoidable, or can it be mitigated? Should efforts focus on "depoliticizing" naming or on managing its politics more transparently and accountably?

  **Prioritized Research Agenda (Top 4 Questions for 3 Years):**

  1.  **What is the *Distinctive Core Wrong* of Genocide? Is it Primarily Physical Destruction or the Destruction of Social Existence/Conditions of Group Life?**
      *   **Why Highest Priority (Defense):**
          *   **Upstreamness:** **Highest.** This question *is the foundation*. The answer fundamentally determines the scope of the concept, what events fall under it, the purpose of the label, and the justification for any duties it triggers. Reshaping this understanding (towards "social existence") would radically alter downstream debates on definition, application, and response. Everything else depends on this.
          *   **Tractability:** **High.** This is *exactly* the domain of conceptual and normative analysis: examining philosophical arguments about harm, group identity, social ontology, and the nature of destruction. Historical and sociological analysis of group destruction *as a process* (beyond body counts) is crucial supporting evidence.
      *   **Neglect:** **High.** While the *legal* definition's physical focus is settled *for legal purposes*, the *philosophical/moral justification* for why genocide is distinctively wrong is underdeveloped relative to its importance. The "social existence" reframing is present in some scholarship (e.g., Lemkin's original conception, some critical genocide studies) but remains marginalized in mainstream legal and political discourse. The dominance of the physical destruction paradigm obscures the harm of cultural genocide and forced assimilation.
      *   **Impact on Practice:** **Potentially Transformative.** Successfully arguing for the "social existence" core wrong could:
          *   Legitimize advocacy and potential future legal recognition for atrocities focused on cultural/identity destruction.
          *   Reframe historical analysis of events like forced assimilation policies.
          *   Shift policy focus towards preventing the destruction of institutions, languages, and cultural practices alongside physical protection.
          *   Challenge the hierarchy of atrocities that privileges killing over other forms of group destruction.
      *   **Evidence/Arguments Moving it:**
          *   **Up:** Compelling philosophical articulation of "social existence" and its destruction as a fundamental harm; rigorous historical case studies demonstrating how non-lethal policies achieved group destruction; analysis showing how physical destruction often *follows* or is *intended* to complete social/cultural destruction.
          *   **Down:** Strong critiques demonstrating insurmountable conceptual vagueness in "social existence"; arguments showing that non-lethal destruction, while severe, belongs in a distinct moral/legal category; evidence that the physical destruction focus remains essential for triggering *specific* legal/political responses.

  2.  **By What Authority, and Through What Process, Should Non-Judicial Actors Declare an Atrocity to be Genocide?**
      *   **Why Second Priority (Defense):**
          *   **Upstreamness:** **High.** Clarifying legitimate authority directly addresses the "politics of naming" chaos and the disconnect between legal process and political/historical/activist usage. It determines *who* gets to perform this powerful speech act and *how*. This question *presupposes* some understanding of *what* is being named (Q1) but is essential for making the label meaningful and accountable in practice.
          *   **Tractability:** **High-Moderate.** This involves normative political theory (legitimacy, authority, representation, expertise), conceptual work on speech acts and performativity, institutional design, and analysis of existing practices (ICJ rulings, UN commissions, state declarations, NGO reports). Requires conceptual rigor more than new data.
      *   **Neglect:** **High.** While the *fact* of politicization is widely acknowledged, there's remarkably little rigorous normative work on *how* the act of naming *should* be governed outside courts. Who *should* do it? Based on what criteria? With what procedures? What makes a declaration legitimate? This gap fuels cynicism and misuse.
      *   **Impact on Practice:** **High.** Developing credible frameworks for non-judicial declarations could:
          *   Reduce capricious or purely instrumental uses of the label.
          *   Increase the legitimacy and persuasive power of declarations made by certain actors (e.g., rigorously mandated UN panels, coalitions of relevant scholars/communities).
          *   Provide clearer guidance for states, media, and NGOs navigating when and how to use the term responsibly.
          *   Potentially create more effective early warning or mobilization triggers.
      *   **Evidence/Arguments Moving it:**
          *   **Up:** Successful articulation of robust normative criteria for legitimate authority (e.g., combining expertise, impartiality, procedural fairness, connection to affected groups); feasible proposals for institutional mechanisms; evidence that certain existing declaration processes (e.g., some UN commissions) are seen as more legitimate than others and why.
          *   **Down:** Convincing arguments that *no* non-judicial declaration can ever be truly legitimate or non-political; evidence that attempts to formalize non-judicial processes consistently fail or are co-opted.

  3.  **What is the Primary *Purpose* of the Genocide Category in Contemporary Discourse, and Can a Single Concept Coherently Serve All Purposes?**
      *   **Why Third Priority (Defense):**
          *   **Upstreamness:** **Moderate-High.** The purpose shapes the definition and application. If the primary purpose is legal prosecution, the current narrow, intent-focused definition may be justified. If it's moral condemnation or historical analysis, broader definitions (like the "social existence" view) become more plausible. If it's primarily to trigger intervention, that demands different criteria. Clarifying purpose reduces category confusion and conflicting expectations.
          *   **Tractability:** **High.** Requires conceptual mapping of different purposes (legal, moral, political, historical), analysis of tensions between them (e.g., need for legal certainty vs. moral condemnation of related harms), and normative arguments about which purposes *should* dominate or whether distinct categories are needed.
      *   **Neglect:** **Moderate.** The tension between purposes is often noted but rarely systematically analyzed to draw concrete conclusions about the viability of the category or the need for conceptual reform. Work often focuses on one purpose (usually legal) in isolation.
      *   **Impact on Practice:** **Significant.** Clarity on purpose could:
          *   Mitigate debates where actors talk past each other using the same word for different ends.
          *   Inform whether efforts should focus on refining the *legal* category, developing parallel *moral* or *historical* categories, or abandoning the quest for a unified concept.
          *   Set realistic expectations about what the genocide label can and cannot achieve (e.g., does calling it "genocide" *actually* reliably trigger intervention?).
          *   Support the argument for complementary frameworks (e.g., for cultural destruction) if the legal category's purpose is deemed too narrow.
      *   **Evidence/Arguments Moving it:**
          *   **Up:** Clear demonstration that the conflicting purposes actively hinder effective response or scholarship; compelling arguments that one purpose (e.g., moral condemnation) is fundamentally incompatible with another (e.g., legal prosecution) using the same definition; successful proposals for functionally separating purposes (e.g., "legal genocide" vs. "moral genocide").
          *   **Down:** Arguments demonstrating that the multi-functionality of the term, despite tensions, is its strength and essential for mobilization; evidence that distinct categories for different purposes fragment advocacy and reduce effectiveness.

  4.  **What *Specific Duties* (Moral, Political, Legal) Should Normatively Follow from a Credible Genocide Declaration, and Are These Duties Realistically Triggered by the Label?**
      *   **Why Fourth Priority (Defense):**
          *   **Upstreamness:** **Moderate.** While dependent on the core wrong (Q1) and the authority of the namer (Q2), this focuses on the *consequences* – the "so what?" of naming. It connects the conceptual act to practical obligations, testing the real-world impact of the label.
          *   **Tractability:** **Moderate.** Requires normative analysis of duties (e.g., R2P, duties to remember, assist refugees, prosecute, sanction) and their link to the specific harm identified in Q1. Also involves critical analysis of the gap between normative ideals and political realities regarding intervention.
      *   **Neglect:** **Moderate-High.** While R2P is debated, the *specific link* between the *genocide label* and *distinct, justified duties* compared to other atrocity labels is less explored. The assumption that the label *should* trigger unique duties (especially military intervention) is often asserted but not rigorously defended normatively in light of the core wrong.
      *   **Impact on Practice:** **Significant.** Clarifying the link (or lack thereof) between the label and specific duties could:
          *   Reduce unrealistic expectations that naming alone compels action.
          *   Focus advocacy on building political will for specific needed responses, rather than just fighting over the label.
          *   Challenge the assumption that genocide *necessarily* demands military intervention above other atrocity crimes.
          *   Potentially strengthen arguments for non-military duties (e.g., reparations, memorialization, refugee support) intrinsically linked to the specific harm of group destruction.
      *   **Evidence/Arguments Moving it:**
          *   **Up:** Strong normative arguments demonstrating why the *specific harm* of genocide (as defined by Q1) creates *unique* duties not triggered by other mass atrocities; credible analysis showing how tying specific, achievable duties to credible declarations *could* work in practice.
          *   **Down:** Compelling evidence that the label is *inherently* ineffective at triggering any specific duties beyond symbolism; arguments that the focus on genocide-specific duties detracts from building broader and more effective frameworks for preventing/responsding to *all* mass atrocities.

  **Deprioritized Questions (Justification):**

  *   **Refining the Legal Thresholds (e.g., "intent", "in part", group definitions):** While important *for international law*, this is primarily the domain of lawyers and tribunals. Conceptual/normative input here is valuable but less neglected and unlikely to change practice significantly without addressing the upstream questions about the core wrong and purpose. Legal evolution is slow and often disconnected from broader discourse.
  *   **Detailed Case Applications (Is X a genocide?):** Important work, but primarily empirical/historical/legal. Conceptual clarity from the prioritized questions is needed *before* these debates can be truly productive. Funding empirical case studies falls outside your center's mandate.
  *   **Pure Measurement/Quantification of Atrocities:** Excluded by your mandate; requires empirical methods.
  *   **Comparative Analysis of Genocide vs. Other Atrocity Crimes (without the core wrong focus):** While valuable, this often occurs downstream. Prioritizing the core wrong (Q1) provides the essential foundation for meaningful comparison.

  **Integrating Your Reframings:**

  *   Your first reframing (**"destruction of social existence"**) is placed at the absolute center of the agenda as **Question 1**. Its acceptance would fundamentally reshape the field.
  *   Your second reframing (**focus on the act of naming itself**) is addressed directly in **Question 2 (Authority)** and permeates **Question 3 (Purpose)** and **Question 4 (Duties)**. Question 2 explicitly takes the "act of naming" as its core object.

  This agenda prioritizes foundational conceptual work with the highest potential to reframe the field, directly addresses your board's core clusters and your proposed reframings, leverages your center's strengths, and focuses on neglected questions where normative/conceptual analysis can have the most transformative impact on understanding and potentially responding to the profound evil of group destruction.
