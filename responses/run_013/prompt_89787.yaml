  After carefully analyzing your cases and testing several candidate principles, I've identified a robust principle that accounts for all six scenarios while challenging two of your gut verdicts. The key insight is that information is a thermodynamic resource: its acquisition, storage, and erasure all have entropy consequences that must be globally accounted for, even when costs are deferred or relocated. Below, I outline the reasoning, candidate principles, stress-testing, and resolution.

  ### Candidate Principles Brainstormed
  1. **Principle of Upstream Entropy Payment (UEP):** The thermodynamic cost of information is paid when it is *acquired* (including memory initialization) or *erased*. If information is stored indefinitely, the cost was paid during acquisition/preparation.  
  2. **Principle of Universal Landauer (UL):** Any information process (measurement, writing, erasure) must dissipate at least \(k \ln 2\) per bit at *some* temperature, but the temperature may vary.  
  3. **Principle of Correlation Debt (CD):** Work extraction requires breaking correlations between the system and demon. The entropy cost manifests when correlations are broken (e.g., during reset) or when the correlated state is prepared.  
  4. **Closed-System Entropy Increase (CSE):** The second law holds globally. Apparent violations arise from unaccounted entropy increases in the demon, its memory, or upstream processes.  

  ### Stress-Testing Principles Against Your Cases
  - **Case 1 (Szilárd engine with reset):**  
