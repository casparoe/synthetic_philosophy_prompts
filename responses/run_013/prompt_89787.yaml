  2. Same as (1), but the memory is a write-once tape that's never erased and never reused. Each cycle adds one new bit and you just keep the tape, or archive it. Gut: honestly this one makes me nervous. If nothing is ever erased I can't see the bill. My gut says it might actually win, which I'm definately pretty sure means my gut is broken somewhere.

  3. Demon pre-loaded with the answers: a cheat sheet that already lists where every molecule will be for the next hour. Gut: no win, but not because of the demon — whoever wrote the cheat sheet already paid, so the cost just moved upstream. Feels like the cost doesn't vanish, it relocates.

  4. Feynman ratchet, no measurement at all, just a pawl on a gear. Gut: no win, and this one doesn't even feel like an information problem — the pawl itself gets jostled by the same thermal bath, so it fails for a boring mechanical reason.

  5. The demon is a Python script on my laptop, and I count the laptop's waste heat. Gut: no win, obviously, the thing thermal-throttles before it does anything interesting.

  6. Same as (1), but I erase the demon's memory using a reservoir that's *colder* than the gas. Gut: this one feels like it might sneak a win, and I can't articulate why, which is exactly the kind of feeling I don't trust.

