answer: |-
  Here's a complete game design based on your concept, optimized for a 50-minute high school econ club session. It's called the **"Mystery Box Trade"** – simple, tactile, and reveals how offers signal hidden information through gameplay.

  ---

  ### **Game Overview**
  - **Core Idea:** Players trade mystery boxes containing hidden values. The *offer price* itself becomes a signal of the seller's private information.
  - **Roles:** 1/3 of players are "Insiders" (know box values), 2/3 are "Traders" (buyers).  
  - **Materials:** 
    - 5 small identical boxes (e.g., taped shoeboxes) with hidden values inside (use colored paper slips).
    - Play money: $100 fake bills per player + $500 for the "bank" (you).
    - Value key (secret for Insiders, shown after the game).

  ---

  ### **Setup (10 min)**
  1. **Assign Roles:**  
     - **5 Insiders** (sellers): Know the true value of their box.  
     - **10 Traders** (buyers): Only know possible values (no insider info).  
     *(If attendance varies, adjust: 4-6 Insiders, rest Traders.)*  

  2. **Load Boxes:**  
     - Put slips inside boxes with values: **$20, $40, $60, $80, $100**.  
     - Shuffle boxes so *nobody* (even Insiders) knows which is which physically.  

  3. **Give Secret Info:**  
     - Whisper each Insider’s box value to them (e.g., *"You have the $40 box"*).  
     - Tell Traders: *"Boxes hold $20-$100. Insiders know their box’s value. You’ll make offers to buy."*  

  4. **Starting Cash:**  
     - All players start with **$100**.  

  ---

  ### **Rules & Payoffs (5 min explanation)**
  - **Round 1: Sellers Set Prices**  
    - Each Insider **writes down an asking price** for their box (any amount).  
    - **They MUST sell** if a buyer matches their price.  

  - **Round 2: Buyers Make Offers**  
    - Traders see all asking prices on the board (e.g., *"Box A: $70, Box B: $30..."*).  
    - Each Trader **secretly writes** which box they want and the price they offer (can be ≤ or ≥ asking price).  
    - **Catch:** Buyers can’t communicate. Multiple buyers can bid on one box.  

  - **Resolve Trades:**  
    - For each box:  
      - If **one buyer** offers ≥ asking price → trade happens.  
      - If **multiple buyers** bid ≥ asking price → highest bidder wins (ties: random draw).  
      - If **no bids** ≥ asking price → no sale.  
    - **Payoffs:**  
      - **Seller:** Gets sale price (if sold) OR keeps box + **reveals value** after the game.  
      - **Buyer:** If they win the box, they get: **Box value - price paid**. If no trade, $0.  

  ---

  ### **How the "Aha! Moment" Happens**
  - **Insiders** with low-value boxes ($20-$40) will set *low prices* (e.g., $25) to attract buyers.  
  - **Insiders** with high-value boxes ($80-$100) will set *high prices* (e.g., $90) to maximize profit.  
  - **Traders** see low prices and think: *"Why so cheap? Must be worthless!"* → Avoid bidding.  
  - **Traders** see high prices and think: *"Must be valuable!"* → Overbid, risking overpayment.  
  - **Result:** Low-value boxes rarely sell (buyers suspect traps), high-value boxes sell but often at inflated prices. **Trades collapse for mid-value boxes** since buyers distrust sellers’ motives.  

  ---

  ### **Debrief Script (15 min)**  
  *(Start after 1 round of play. Use whiteboard to map outcomes.)*  
  1. **Reveal the Values:** Open boxes and show true values next to asking prices/bids.  
  2. **Key Questions:**  
     - *"Why did [low-value seller] set $25? What did buyers assume?"*  
       → They’ll realize: Low offer = seller thinks it’s junk.  
     - *"Why did nobody bid on the $50 box listed at $45?"*  
       → Buyers thought: *"If it’s fairly priced, why sell?"*  
     - *"Who overpaid? Why did you bid high on the $80 box?"*  
       → Signal: High price = seller’s confidence.  
  3. **Connect to Your Concept:**  
     - *"The offer itself was information. Buyers reverse-engineered sellers’ motives."*  
     - *"When both sides are rational, fair prices look suspicious → trades unravel. This is the 'no-trade theorem' in action."*  
  4. **Real-World Links:**  
     - **Stocks:** Why a CEO selling shares signals bad news.  
     - **Jobs:** Why a desperate job applicant might seem low-quality.  
     - **Life:** *"Why would they offer that?"* is your B.S. detector.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**
  1. **"Traders ignore prices and bid randomly!"**  
     - **Why:** Teens might treat it like gambling.  
     - **Fix:** Pre-game hype: *"You lose real candy if you overpay!"* (Use candy payoffs to raise stakes).  

  2. **"All boxes sell, no unraveling!"**  
     - **Why:** Aggressive traders might YOLO-bid on cheap boxes.  
     - **Fix:** Debrief: *"Notice how the $20 box sold for $5? Buyer won, but seller lost. Rational sellers won’t do this again."* Run a theoretical Round 2: *"What if we played again with the same info?"*  

  3. **"Insiders blurt out their values!"**  
     - **Why:** Excitement or sabotage.  
     - **Fix:** Warn: *"If you leak your value, you forfeit profits."* Assign a "shush buddy" to monitor.  

  ---

  ### **What the Game Can’t Show (Say This Yourself)**  
  - **"In real markets, people aren’t equally rational.** Some miss signals, others manipulate them (e.g., pump-and-dump schemes)."  
  - **"Signals can be faked.** A con artist sets high prices to seem legit. This game assumes honest signals – irl, trust changes everything."  
  - **"Public info changes dynamics.** Here, only sellers had secrets. In stocks, both sides hide info."  

  ---

  ### **Logistics**  
  - **Time:** Setup (10 min) → Gameplay (15 min) → Debrief (20 min) → Q&A (5 min).  
  - **Candy Payoffs:** Convert net profits to candy (e.g., $10 = 1 Starburst). Losers get consolation mints.  
  - **No Math Needed:** Values are just numbers. Traders only need to compare "higher/lower."  

  This forces players to *feel* the paradox: Fair offers seem sketchy when everyone’s sharp. By the end, "Why would he offer that?" will be their default thought. Good luck!
