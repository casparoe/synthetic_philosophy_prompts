  ### **Brainstormed Criteria & Node Selection**
  I started with 10 candidate criteria (reduced to 8 nodes for usability) from the demarcation problem in historiography. Nodes were chosen to:
  - Cover epistemic (Q1–Q5), social (Q6), and agential (Q7) factors.
  - Avoid redundancy (e.g., "falsifiability" and "testability" are split).
  - Ensure binary answers (no mushiness).

