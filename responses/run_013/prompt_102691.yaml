answer: |-
  Below is a decision tree designed to resolve debates about whether a historical work qualifies as "pseudohistory" by forcing clarity on the underlying demarcation criteria. I built this by first brainstorming core criteria from the philosophy of science and historiography, focusing on epistemic (evidence-based) and social/practical factors. The tree starts with your shared commitment: **"Yes, there's a genuine difference between history and pseudohistory."** Each node is a binary question about a specific case (e.g., Atlantis) that an ordinary person can answer based on the work's content and context—no prior knowledge of philosophy required. The leaves are named positions, including your requested views (falsificationist, Lakatosian, sociological, pluralist) plus three more to cover logical gaps (testability, consilience, and motives-based views). 

  After the tree, I'll:
  1. **Explain the logical structure**, including coherent/incoherent paths.
  2. **Test it on your three cases** (Atlantis, ancient aliens, Fomenko).
  3. **List all leaves** with their "most awkward commitment" (the hardest pill to swallow for that view).
  4. **Analyze combinations** that no one holds and why.

  ---

  ### **Decision Tree: Is This Work Pseudohistory?**
  *Start with a specific historical work (e.g., a book about Atlantis). Answer each question with Yes or No.*

  1. **Are the central claims testable against evidence?**  
     (Can you check them with physical artifacts, documents, or data?)  
     - **No** → Go to Leaf A: **Testability View**  
     - **Yes** → Go to 2.

  2. **If the central claims were false, could evidence disprove them?**  
     (Is it possible to imagine clear counter-evidence that would force abandonment?)  
     - **No** → Go to Leaf B: **Falsificationist View**  
     - **Yes** → Go to 3.

  3. **Is there a core claim shielded from revision, regardless of evidence?**  
     (Does the work treat any claim as non-negotiable, even if new data contradicts it?)  
     - **Yes** → Go to Leaf C: **Lakatosian View**  
     - **No** → Go to 4.

  4. **Does the work integrate with established knowledge from other fields?**  
     (e.g., Does it align with archaeology, genetics, or physics without special pleading?)  
     - **No** → Go to Leaf D: **Consilience View**  
     - **Yes** → Go to 5.

  5. **Are the evidence-handling norms of mainstream history followed?**  
     (e.g., Source criticism, peer review, contextual awareness, no cherry-picking)  
     - **No** → Go to Leaf E: **Methodological View**  
     - **Yes** → Go to 6.

  6. **Is institutional acceptance the ONLY reason it’s not considered "real history"?**  
     (If academia embraced it, would all criticisms vanish?)  
     - **Yes** → Go to Leaf F: **Sociological View**  
     - **No** → Go to 7.

  7. **Are the creators primarily motivated by truth-seeking?**  
     (e.g., Over ideology, profit, fame, or activism?)  
     - **No** → Go to Leaf G: **Motives-Based View**  
     - **Yes** → Go to Leaf H: **Pluralist View**  

  ---

  ### **Leaf Positions & Their Most Awkward Commitments**
  - **A. Testability View**: Pseudohistory makes claims that can't be verified or debunked.  
    *Awkward commitment:* **A testable but false claim (e.g., "Roman coins are in pre-Columbian America") is still "history" until tested—even if absurd.**
  - **B. Falsificationist View**: Pseudohistory is unfalsifiable; no evidence could ever disprove its core ideas.  
    *Awkward commitment:* **A falsifiable but wrong claim (e.g., "Vikings built the pyramids") is "history" if proponents admit it could be disproven.**
  - **C. Lakatosian View**: Pseudohistory has a "hard core" of claims protected by flexible, unfalsifiable auxiliary hypotheses.  
    *Awkward commitment:* **A program could be pseudohistory even if it produces novel predictions, as long as its core is shielded.**
  - **D. Consilience View**: Pseudohistory ignores or contradicts independent lines of evidence from other fields.  
    *Awkward commitment:* **A work that fits established science but is methodologically sloppy (e.g., misdating artifacts) might still be "history."**
  - **E. Methodological View**: Pseudohistory violates the community's norms of evidence and argument.  
    *Awkward commitment:* **A work following all methods but reaching false conclusions (e.g., due to bias) is still "history."**
  - **F. Sociological View**: There is no epistemic difference; the distinction is purely about institutional power.  
    *Awkward commitment:* **If academia endorsed ancient aliens, it would become "real history"—even with zero new evidence.**
  - **G. Motives-Based View**: Pseudohistory is driven by non-epistemic motives (e.g., nationalism or profit).  
    *Awkward commitment:* **A factually accurate work by a charlatan is pseudohistory, while a flawed work by a truth-seeker is history.**
  - **H. Pluralist View**: The line is fuzzy; pseudohistory has a cluster of weaknesses (e.g., poor methods + low consilience) to a greater degree.  
    *Awkward commitment:* **No case is definitively pseudohistory; it’s always "somewhat" pseudohistorical (e.g., 70% vs. 30%).**

  ---

  ### **Logical Structure & Coherence**
  - **Tree Logic**: Nodes progress from internal features of the work (testability, falsifiability) to external/social factors (methods, motives). This forces users to confront whether demarcation is about the work itself or its context. The pluralist view (Leaf H) is a catch-all for cases passing all epistemic checks but still feeling "off."
  - **Coherent Paths**: All paths are logically coherent. For example:
    - **Testability → Falsificationist → Lakatosian** is consistent (focuses on the work's internal logic).
    - **Consilience → Methodological → Sociological** is consistent (focuses on community norms).
  - **Incoherent/Unoccupied Paths**: 
    - **Lakatosian → Sociological (via "No" to Q4 and Q5, "Yes" to Q6)**: No one holds this because if a core is shielded (Lakatosian), institutional acceptance (Sociological) can’t be the *only* factor—it’s already epistemically flawed. This path is incoherent and unattractive.
    - **Testability → Consilience (skipping Falsificationist/Lakatosian)**: Rarely occupied. If claims are untestable (Leaf A), consilience is irrelevant. This path is coherent but unattractive—why prioritize consilience if the claims aren’t testable?
  - **Unseparated Positions**: 
    - **Falsificationist vs. Testability**: Separated by Q2. If claims are testable but unfalsifiable (e.g., "Aliens hid evidence"), it’s Falsificationist (Leaf B); if not testable at all (e.g., "Atlantis is in a higher dimension"), it’s Testability (Leaf A).
    - **Sociological vs. Pluralist**: Separated by Q6 and Q7. If institutional power is the *only* factor, it’s Sociological (Leaf F). If multiple factors (e.g., methods + motives) blur the line, it’s Pluralist (Leaf H).

  ---

  ### **Stress-Testing on Your Cases**
  Apply the tree to each work. I'll use typical characteristics based on mainstream scholarship.

  1. **Atlantis (e.g., Plato’s account as literal history)**:
     - Q1 (Testable?): **No**—No physical evidence or falsifiable location.  
       → **Leaf A (Testability View)**: Pseudohistory because claims aren’t checkable.  
     *Why this fits:* Atlantis proponents often shift locations (Thera, Antarctica) to avoid disproof, making it untestable.

  2. **Ancient Aliens (e.g., von Däniken’s *Chariots of the Gods?*)**:
     - Q1 (Testable?): **Yes**—Claims like "aliens built pyramids" can be checked.
     - Q2 (Falsifiable?): **No**—Proponents dismiss counter-evidence (e.g., "humans couldn’t lift stones" ignores ramp experiments).  
       → **Leaf B (Falsificationist View)**: Pseudohistory because core claims are unfalsifiable.  
     *Why this fits:* When evidence contradicts aliens, defenders invoke "suppressed truths" or "lost tech," making disproof impossible.

  3. **Fomenko’s New Chronology (re-dating ancient events)**: 
     - Q1 (Testable?): **Yes**—Claims can be checked via carbon dating, astronomy.
     - Q2 (Falsifiable?): **Yes**—If carbon dating contradicts Fomenko, it *should* disprove him.
     - Q3 (Shielded core?): **Yes**—Fomenko reinterprets *any* counter-evidence (e.g., re-dating eclipses) to protect his core timeline.  
       → **Leaf C (Lakatosian View)**: Pseudohistory due to a protected core.  
     *Why this fits:* Fomenko’s "auxiliary belt" (e.g., "all ancient texts are forgeries") deflects criticism, shielding his core revisionism.

