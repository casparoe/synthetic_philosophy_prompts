prompt: |-
  I'm trying to pull the family resemblance idea apart from vagueness — everyone lumps them together, and I want to see if they can actually come apart. So build me the case that does it. Invent a small practice for me, a little language game (a craft, a ritual, a card game, whatever you like), with one concept in it that hits all three of these at once:

  (a) people apply it to new cases without anyone ever stating a rule — a newcomer just picks it up from watching it get used;
  (b) no single feature is shared by all the members, and no single feature is had by all and only the members — the members overlap like a chain, each one sharing something with its neighbours and nothing with the ones far off;
  (c) all the same, the concept is fully determinate: for any candidate that could actually come up in the practice, there's a fact of the matter and the community would agree. No vagueness, no open texture, no "eh, it's a judgment call". Include at least one case that feels borderline but that the practice still settles one way.

  Keep the practice to a paragraph, keep it a real human practice (no aliens, no maths), and please don't use games, colours, or chairs-and-tables examples — I want something I havent seen before.

  Then do the checks. For each of (a), (b), (c), point at the bit of your scenario that secures it. Say which feature of the case is doing the work, and what happens to the other two conditions when I take that feature away. Then deal with the obvious kill shot: someone says fine, your concept has a disjunctive necessary-and-sufficient definition — a big OR of feature bundles — so family resemblance is empty. Does that sink the case or beg the question? Be honest. And last: is what you built really family resemblance, or just a prototype/similarity-threshold classifier wearing its clothes? How would you tell the two apart inside your own scenario?
