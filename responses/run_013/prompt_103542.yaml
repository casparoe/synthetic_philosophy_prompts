  I recall that Matilal's work shows Nyāya isn't naive about testimony - they distinguish between śabda as pramāṇa and mere verbal cognition. That nuance matters for responding to objection 4. For dead languages, the school's concept of "intention" (tātparya) preserved in texts could be invoked. 

  The unfalsifiability worry is tricky. If Nyāya insists every successful testimony case implicitly involves āpta, even unconsciously, does that make the theory untestable? But perhaps that's inevitable for any basic pramāṇa - we don't demand perception to justify itself perceptually either. The user seems open to this "cost of basicness" idea given their closing question.

