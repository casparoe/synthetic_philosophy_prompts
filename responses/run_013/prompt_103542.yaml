  Let me start by mentally categorizing the objections they mentioned: (1) reductionism to inference, (2) cases lacking reliability beliefs, (3) knowledge from texts/dead speakers, and (4) the understanding-acceptance gap. The user also wants honesty about whether Nyāya defenses risk unfalsifiability - that's a meta-philosophical layer I should address.

