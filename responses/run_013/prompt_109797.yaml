answer: |-
  Below is a decision tree designed to sort views of fair bargaining based on the axioms one insists upon, starting from the basic setup of two bargainers, a set of feasible agreements, and a disagreement point. Each branch node is a yes/no question about necessary properties of the bargaining outcome. The leaves correspond to the Nash solution, Kalai-Smorodinsky solution, egalitarian solution, greatest-sum rule, maximin rule, or the view that no single rule is rationally required. Each leaf includes one sentence naming its most awkward commitment. The tree flags incoherent combinations and notes where it cannot separate two solutions.

  ### Decision Tree:

  1. **Must the outcome be Pareto efficient?**  
     (i.e., should no alternative agreement make one person better off without making the other worse off?)  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  2. **Should the outcome maximize the sum of the two persons' utilities?**  
     - **Yes** → **Leaf: Greatest-sum rule**  
       *Awkward commitment: It may choose a Pareto-inefficient outcome, leaving mutual gains unrealized.*  
     - **No** → **Should the outcome maximize the minimum utility of the two persons?**  
       - **Yes** → **Leaf: Maximin rule**  
         *Awkward commitment: It may choose a Pareto-inefficient outcome, leaving mutual gains unrealized.*  
       - **No** → **Leaf: No single rule is rationally required**  
         *Awkward commitment: It cannot provide a definite answer in a given bargaining problem without further context-specific reasoning.*  

  3. **Must the outcome be invariant to how each person's utility is scaled?**  
     (i.e., should it remain unchanged if the zero or unit of either person's utility is rescaled linearly?)  
     - **No** → Go to 4.  
     - **Yes** → Go to 5.  

  4. **Should the outcome equalize the gains from the disagreement point?**  
     (i.e., should both persons' utilities exceed their disagreement utilities by the same amount?)  
     - **Yes** → **Leaf: Egalitarian solution**  
       *Awkward commitment: It may sacrifice larger total gains to maintain equality, even if one person converts resources to utility far more efficiently.*  
     - **No** → **Leaf: No single rule is rationally required**  
       *Awkward commitment: It cannot provide a definite answer in a given bargaining problem without further context-specific reasoning.*  

  5. **Must the outcome be independent of irrelevant alternatives?**  
     (i.e., if an unchosen agreement is removed from the feasible set, should the outcome remain the same?)  
     - **Yes** → **Leaf: Nash solution**  
       *Awkward commitment: It may not reward a person when new agreements benefit only them, failing to reflect expansions of the feasible set.*  
     - **No** → **If the feasible set expands to increase one person's maximum achievable utility (holding the disagreement point and the other person's maximum unchanged), must that person receive at least as much as before?**  
       - **Yes** → **Leaf: Kalai–Smorodinsky solution**  
         *Awkward commitment: It may change if unchosen agreements are removed, making it sensitive to "irrelevant" alternatives.*  
       - **No** → **Leaf: No single rule is rationally required**  
         *Awkward commitment: It cannot provide a definite answer in a given bargaining problem without further context-specific reasoning.*  

  ### Notes:
  - **Incoherent combination:** A "Yes" to *both* **independence of irrelevant alternatives (IIA)** and **monotonicity under expansion (M)** in the efficient, scale-invariant branch (after Q5) is **incoherent**. These axioms conflict—no solution satisfies both simultaneously. The tree avoids this by branching sequentially, but if forced (e.g., insisting on both), no rational solution exists.
  - **Unseparated leaves:** The tree **cannot distinguish** between the **egalitarian solution** and the **maximin rule**. Both prioritize equality/minimum utility, but the egalitarian solution requires efficiency and equal gains, while the maximin rule (as defined here) is inefficient. They appear in different branches (efficient vs. inefficient), so the tree separates them via the first question (Pareto efficiency).  
  - **Unexplored combinations:** Branches ending in "no single rule" (e.g., rejecting both sum-maximization and min-maximization in inefficiency, or rejecting equality and scale dependence in efficiency) are **unexplored but coherent**. No canonical solution exists here, but the axioms do not conflict.  
  - **Clarifications:**  
    - All solutions assume *individual rationality* (outcome ≥ disagreement point) unless the user rejects Pareto efficiency *and* declines to maximize sum or min utility.  
    - "Scale invariance" refers to invariance under positive affine transformations of utilities.  
    - "Monotonicity" (Q5 branch) specifically requires non-worsening for a player when their *ideal utility* (max achievable alone) improves.  

  This tree sorts views by the axioms held non-negotiable, exposing tradeoffs between fairness properties while adhering to the bargaining setup. Use it to guide discussion on why people might favor different solutions!
