answer: |-
  ### Epistemic Paradoxes Activity Design

  **Core Structure**: Students confront a contradiction between individually rational endorsements and collective inconsistency, then repair it via an arbitrary withdrawal. This models the lottery paradox. The debrief connects to the preface paradox and explores escape routes.

  ---

  #### **Materials & Roles**
  - **Urn**: 100 balls (1-100), one gold (or marked "winner").
  - **Cards**: 100 cards, each stating: "Ball #k will not be drawn" (k = 1 to 100).
  - **Tokens**: Non-monetary chips or ledger points.
  - **Ledger**: Public board/spreadsheet to record endorsements (✓) or abstentions (✗).
  - **Distribution**: 100 cards among 18 students: 10 students get 6 cards, 8 get 5 cards.
  - **Roles**:
    - **Clerk**: Records endorsements/abstentions in the ledger.
    - **Auditors (2)**: Check ledger consistency (logical compatibility with "one ball will be drawn").
    - **Bureau Chief**: Signs/refuses the Clean Sheet Guarantee (CSG).
    - **Students (18)**: Hold and endorse/abstain on cards.

  **Payoff Rules**:
  - Endorse & true: **+1 token**  
  - Endorse & false: **−9 tokens**  
  - Abstain: **0 tokens**  
  - CSG signed & holds: **+6 tokens to all**  
  - CSG signed & fails: **−6 tokens to all**  
  - *Break-even credence*:  
    Expected value of endorsing = \( P(\text{true}) \times 1 + P(\text{false}) \times (-9) \).  
    Set to 0: \( p - 9(1-p) = 0 \) → \( 10p = 9 \) → \( p = 0.9 \). *Verified*.

  **CSG Condition**:  
  - CSG **holds** if the drawn ball is endorsed (i.e., its card is marked ✓).  
  - CSG **fails** if the drawn ball is abstained (✗).  
  - *Auditors must confirm ledger consistency before signing*:  
    Consistent iff ≥1 abstention (all endorsements → contradiction).

  ---

  #### **Timeline (90-Minute Version)**
  | Time  | Phase               | Key Actions                                                                                                                                 |
  |-------|---------------------|---------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Introduction**    | **Your opening words**: *"We’re exploring rational decision-making. An urn holds 100 balls; one will be drawn randomly. Each of you has cards claiming a specific ball won’t be drawn. For each card, decide: endorse (bet it’s true) or abstain (opt out). Endorsing a true card earns +1 token, a false one costs −9, abstaining is 0. Later, we’ll introduce a group guarantee. Distribute cards now."* |
  | 5-15  | **Card Distribution** | Assign cards (10 students × 6 cards, 8 × 5 cards).                                                                                         |
  | 15-30 | **Endorsement**     | Students publicly declare ✓/✗ per card. Clerk records in ledger. *Order: Student-by-student, card-by-card*.                                |
  | 30-35 | **Audit**           | **Auditors' charge**: *"Check if the endorsed propositions are logically consistent with the fact that exactly one ball will be drawn. Report: consistent or inconsistent."* (They check for ≥1 ✗; all ✓ = inconsistent). |
  | 35-40 | **Withdrawal**      | If ledger inconsistent (all ✓), group withdraws ≥1 endorsement to restore consistency. Clerk updates ledger.                              |
  | 40-45 | **CSG Decision**    | **Bureau Chief’s prompt**: *"If the ledger is consistent, you may sign the CSG. If signed: +6 tokens to everyone if the drawn ball is endorsed; −6 if it’s abstained. If inconsistent, you cannot sign. Do you sign?"* |
  | 45-50 | **Draw**            | Draw a ball live. Reveal number.                                                                                                            |
  | 50-60 | **Scoring**         | Apply payoffs per rules. Calculate tokens.                                                                                                 |
  | 60-90 | **Debrief**         | Guide discussion → paradoxes, escape routes, preface transition.                                                                           |

  ---

  #### **Key Outcomes**
  1. **All Endorse (Case 1)**:  
     - Ledger inconsistent (all 100 ✓). Auditors flag. CSG **cannot be signed**.  
     - After draw: One false endorsement (drawn ball) → −9 for that holder; 99 true → +1 each.  
     - *Result*: Net loss for the holder of the drawn ball; no CSG payoff. Collective rationality fails.

  2. **One Withdrawal (Case 2)**:  
     - Group withdraws one endorsement (arbitrary card → ✗). Ledger consistent (99 ✓, 1 ✗). Auditors approve. CSG **signed**.  
     - CSG chance of holding: 99/100 = 0.99 (fails only if abstained ball drawn).  
     - *Result*: Arbitrary repair buys high expected CSG value (+5.94 expected tokens/person), but no justification for which card is withdrawn. Marginal value of second withdrawal = 0.

  ---

  #### **Debrief (30 Minutes)**
  1. **Map Activity to Paradoxes**:  
     - **Individual endorsement**: Each card has 0.99 probability; endorsing is rational (expected value = 0.9 > 0).  
     - **Collective inconsistency**: All endorsements entail "no ball is drawn," contradicting setup.  
     - **Withdrawal**: Restores consistency but is arbitrary—no evidence singles out one card.  
     - **CSG**: High expected value after repair, but hinges on an unjustified exception.  

  2. **Name the Paradoxes**:  
     - *Lottery paradox*: Rational to believe each ticket loses, irrational to believe all lose.  
     - *Preface paradox*: Rational to believe each claim in a book, yet rational to believe the book contains an error.  
     - *Violated principle*: Closure under conjunction (rational belief in each conjunct → rational belief in conjunction).  

  3. **Escape Routes & Prices**:  
     - **Raise threshold to certainty**: No endorsements (abstain all). Avoids inconsistency but forfeits +EV bets.  
     - **Accept conjuncts, refuse conjunction**: Endorse each card but deny the collective claim. *Price*: Unclear how to "act" on this (e.g., CSG requires a joint stance).  
     - **Distinguish acceptance from belief**: Endorse based on EV without "believing." *Price*: Belief becomes inert; acceptance is pragmatic, not epistemic.  
     - **Deny justified lottery beliefs**: Reject endorsements entirely. *Price*: Ignores strong evidence for individual propositions.  
     - **Treat preface claim as meta**: The CSG/withdrawal is a fallibility statement, distinct from object-level claims. *Price*: No clear way to assign probability to the meta-claim here.  

  4. **Transition to Preface Paradox**:  
     - *Scenario*: "Suppose we publish a report with 12 factual sentences about today’s session, each written and vouched for by a different student. Each is checkable now. Should we append: ‘At least one sentence in this report is false’?"  
     - *Discussion*:  
       - Appending it is rational (inductive fallibility) but makes the report *inconsistent* if all original sentences are true.  
       - Contrast with lottery: Here, claims are heterogeneous (no symmetry), and the preface is a *meta-claim* based on past error rates.  
       - *Irony*: If the preface is the only sentence, it’s false; adding sentences increases rational confidence in it.  
     - *Point*: Preface allows consistent but possibly untrue beliefs; lottery forces inconsistency without withdrawal.  

  ---

  #### **What the Activity Cannot Reproduce**
  - **Belief vs. Acceptance**: The activity models *acceptance* as a scored bet (EV-driven). It cannot show that *belief proper* is closed under conjunction—belief may not obey EV calculus.  
  - **Inductive Basis of Preface**: Cards are symmetric and lack real-world fallibility data. The preface’s rational force comes from historical error rates (e.g., "past books had mistakes"), which must be asserted, not discovered here.  
  - **Closure Principle**: The activity implies closure (collective inconsistency) but doesn’t prove it applies to belief; it only shows a problem for EV-based acceptance.  

  ---

  #### **Predictable Problems & Fixes**
  1. **"I don’t *believe* it, I find it probable"**:  
     - *Response*: "This is about *rational action under uncertainty*, not belief. If the evidence makes endorsement optimal, you should endorse. We’re evaluating what that implies collectively."  

  2. **Group designates a "sacrifice card" (e.g., Ball #1)**:  
     - *Response*: "Why Ball #1? Is there evidence it’s more likely to be drawn? If not, this is an arbitrary exception—exactly the problem. The repair works mathematically but lacks justification."  

  3. **Auditors check scores/arithmetic, not consistency**:  
     - *Response* (preempt in charge): "Auditors, your *only* job is logical consistency: Can all endorsed claims be true if one ball is drawn? Ignore payoffs and probabilities."  

  4. **Over-withdrawal (e.g., 5 abstentions)**:  
     - *Response*: "One withdrawal suffices for consistency. More reduce CSG’s expected value (e.g., 2 abstentions → CSG holds with 0.98 probability). Why sacrifice extra EV without reason?"  

  ---

  #### **50-Minute Cut**
  - **Shorten phases**:  
    - Intro/distribution: **5 min** (combine).  
    - Endorsement: **10 min** (accelerate turns).  
    - Audit/withdrawal/CSG/draw: **10 min total**.  
    - Scoring: **2 min** (announce outcomes without calculations).  
    - Debrief: **23 min** (focus on paradox mapping and preface).  
  - **Skip**: Detailed token arithmetic; rehearse student turns for speed.  
  - **Emphasize**: The arbitrariness of withdrawal and CSG’s fragility.  

  ---

  **Final Note**: This activity creates the "aha" moment by having students *enact* the paradox. The debrief ties their actions to deep epistemic challenges, pushing them to see that "evidence-matching" rationality fractures under collective pressure.
