          Expected: (94/100)*11 + (5/100)*1 + (1/100)*(-1) = (1034 + 5 - 1)/100 = 1038/100 = 10.38.

      This is complicated and not necessary for the philosophical point. The point is that by withdrawing one endorsement arbitrarily, they make the ledger consistent and get to sign the guarantee, which has a 0.99 chance of giving +6 and 0.01 chance of -6. And they avoid the certainty of an inconsistent ledger which would have blocked the guarantee. 

    The philosophical point: 
      - Initially, each card is very probable (0.99) and endorsing it has positive expected value (0.99*1 + 0.01*(-9) = 0.99-0.09=0.9>0). So individually, it is rational to endorse.
      - But endorsing all leads to an inconsistent set, which blocks the guarantee and also ensures that one endorsement will be false (so someone will lose 9 tokens).
      - Withdrawing one endorsement arbitrarily (even though each card is equally likely) makes the set consistent and allows the guarantee, which has high expected value for the group.

    Now, the activity design:

    Materials:
      - Urn with 100 balls, numbered 1 to 100, one gold (or one marked as the winner, but the winning condition is being drawn).
      - 100 cards, each with "Ball #k will not be drawn" for k=1 to 100.
      - Tokens (or just record on paper) for scoring.
      - Ledger (a sheet of paper or whiteboard) to record endorsements.

    Roles:
      - 18 students: card holders.
      - Clerk: records endorsements in the ledger (for each card, mark endorsed or abstained).
      - Two auditors.
      - Bureau chief.

    Timeline (90 minutes):

    0:00 - 0:05 (5 min): Setup and introduction.
      - You: "We are going to run an exercise about rational decision-making under uncertainty. There is an urn with 100 balls, one of which will be drawn at random at the end. Each of you will be given several cards. Each card makes a statement about one ball not being drawn. For each card, you must decide whether to endorse it or to abstain. Endorsing a true card gives you +1 token, endorsing a false one gives -9, and abstaining gives 0. There will also be a group guarantee that we'll get to. Let me distribute the cards."

    0:05 - 0:15 (10 min): Distribute the cards. 10 students get 6 cards each, 8 get 5 cards each (adjust if 18 students: 10*6+8*5=60+40=100). 

    0:15 - 0:30 (15 min): Endorsement phase. 
      - Each student, in turn, announces for each of their cards whether they endorse or abstain. The clerk records in the ledger: for each card, if endorsed, mark "E", else "A".

    0:30 - 0:35 (5 min): Audit phase.
      - You to auditors: "Your job is to check the ledger for consistency. The rules are: the set of endorsed propositions must be logically consistent with the fact that exactly one ball will be drawn. You must report whether the ledger is consistent or not."

    0:35 - 0:40 (5 min): Withdrawal phase (if needed).
      - If the ledger is inconsistent (all cards endorsed), then the group may withdraw endorsements until it becomes consistent. They can choose any card(s) to withdraw. They can discuss.

    0:40 - 0:45 (5 min): Bureau chief's decision.
      - The Bureau chief must decide whether to sign the Clean Sheet Guarantee. The guarantee can only be signed if the ledger is consistent. 
      - You: "Bureau chief, the guarantee is worth +6 tokens to every participant if it holds and -6 to every participant if it doesn't. You may sign it only if the ledger is consistent, as determined by the auditors."

    0:45 - 0:50 (5 min): Draw a ball from the urn.

    0:50 - 1:00 (10 min): Scoring. 
      - For each card:
          - If endorsed and true (ball not drawn): +1 to holder.
          - If endorsed and false (ball drawn): -9 to holder.
          - If abstained: 0.
      - For the guarantee: if signed, then:
          - If the drawn ball is endorsed (i.e., the card for that ball was endorsed): then guarantee holds -> everyone +6.
          - If the drawn ball is abstained (i.e., the card for that ball was abstained): then guarantee fails -> everyone -6.
        If not signed, then no guarantee tokens.

    1:00 - 1:30 (30 min): Debrief and transition to preface paradox.

