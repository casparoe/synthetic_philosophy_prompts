    Now, the exact words for three moments:

    1. Your opening (already given above, but adjust for time).
    2. The auditors' charge: "Auditors, please check the ledger for consistency. The set of endorsed propositions must be logically consistent with the fact that exactly one ball will be drawn. Report whether the ledger is consistent or not."
    3. The chief's decision: "Bureau chief, based on the auditors' report, you may sign the Clean Sheet Guarantee only if the ledger is consistent. If you sign it, then after the draw, if the drawn ball is one for which the card was endorsed, every participant gets +6 tokens. If the drawn ball is one for which the card was abstained, every participant gets -6 tokens. Do you sign?"

    The debrief:

    Map each moment to the paradox:
      - The individual endorsement decision: each card is very probable (0.99), and the expected value of endorsing is positive (0.99*1 + 0.01*(-9)=0.9>0), so it seems rational to endorse.
      - But endorsing every card leads to an inconsistency: the set of endorsed propositions is inconsistent with the fact that one ball will be drawn.
      - The audit: checks for consistency. In logic, a set of propositions is inconsistent if it is impossible for them all to be true together.
      - Withdrawal: to restore consistency, we must have at least one abstention. But which one? Any one will do, and there is no reason to pick one over another.
      - The guarantee: by having one abstention, we can sign the guarantee, which has a high expected value (0.99*6 + 0.01*(-6)=5.94-0.06=5.88>0) for everyone.

    This is the lottery paradox (Kyburg) and the preface paradox (Makinson). We do not use the names until the end.

    Escape routes:
      - Raise the threshold for belief/acceptance to certainty: then no card would be endorsed because no card is certain (each has probability 0.99). But then we would abstain on every card, which is consistent, but we would forgo the positive expected value of endorsing.
      - Accept every conjunct but refuse the conjunction: in the lottery, believe of each ticket that it will lose, but not believe that every ticket will lose. But what does that mean for action? In this setup, endorsing each card is like accepting the conjunct. The guarantee is like betting on the conjunction (that every endorsed card is true) in the guarantee? But note, in our guarantee we defined it not as the conjunction of the endorsed propositions, but as the drawn ball being among the endorsed ones. 
        However, the inconsistency arises from the fact that the set of endorsed propositions entails that no ball is drawn, which contradicts the setup.
      - Distinguish acceptance from belief: we accept a proposition for the purposes of the game, but we don't necessarily believe it. But then what grounds our acceptances?
      - Deny that there is justified belief about lottery propositions at all: but then we cannot endorse any card? That leads to abstention on all, which is consistent but not individually optimal.
      - Treat the remark about one's own fallibility as a different kind of claim: in the preface, the author says "there is at least one mistake in this book", which is not about a particular claim but about the collection. Similarly, here the guarantee is about the collection.

    What the activity cannot reproduce:
      - It models acceptance as a scored bet. But belief proper might be different: belief is not necessarily tied to a betting quotient. Also, belief might be closed under conjunction: if you believe P and believe Q, then you should believe (P and Q). But in the lottery, you believe of each ticket that it loses, but you don't believe that every ticket loses. The activity does not force the students to consider the conjunction of all endorsed propositions (except indirectly through the inconsistency).
      - The preface paradox relies on the author's fallibility based on past experience. In the activity, the cards are symmetric and there is no inductive basis. So the preface sentence "at least one sentence in this report is false" is not forced by the same symmetry. We will have to assert that the basis for the preface sentence is different.

    Predictable problems and solutions:

    1. Students say they merely find their card probable, not believe it.
          - Response: In this game, endorsement is an action that you take based on the evidence. If you find it sufficiently probable to be worth the bet (which it is, since expected value is positive), then you should endorse. The activity is about rational acceptance for the purposes of the game.

    2. The group quietly agrees to sacrifice one designated card (e.g., ball #1) and everyone endorses all cards except the holder of ball #1 who abstains on that one. 
          - This is a solution that makes the ledger consistent. But note: it is arbitrary to pick ball #1. The point is that they must make an arbitrary exception. In the debrief, highlight that there is no reason to choose one card over another. The withdrawal is arbitrary and unjustified by the evidence.

    3. The auditors check arithmetic (like the scores) instead of consistency.
          - Clarify: "Auditors, your only job is to check whether the set of endorsed propositions is logically consistent with the fact that one ball will be drawn. You are not to check the truth of the propositions or any scores."

    Transition to the preface paradox:

      "Now, imagine that instead of cards about balls, we have a report written by this group. Suppose we have about twelve factual sentences about this session, each written by a different person. Each sentence is checkable before we leave. For example, 'The urn had 100 balls', 'The draw happened at 10:15', etc. Each of you, as the author of your sentence, has checked it and found it true. But we know that human beings are fallible. Should the report include the sentence: 'At least one sentence in this report is false'? 

      Let's think:
        - If we include that sentence, then if the report is entirely true, then that sentence is false -> contradiction.
        - If we don't include it, then the report might be making a claim that is false somewhere, and we know that might be the case.

      This is the preface paradox. 

      In the activity, the guarantee was like the preface statement: we know that we might have made a mistake in one of the endorsements, so we abstain on one arbitrarily. In the preface, we don't arbitrarily pick a sentence to mark as false, but we add a statement that there is at least one falsehood.

      What if the report has only one sentence? Then adding the preface sentence would make it: 
          Sentence 1: ... 
          Sentence 2: At least one sentence in this report is false.
          This is consistent only if Sentence 1 is false. But if you are confident in Sentence 1, you wouldn't want to add the preface. 

      As we add more sentences, the probability that at least one is false increases, and it becomes reasonable to add the preface. But then the entire report (including the preface) cannot be true: if all the body sentences are true, then the preface is false; if at least one body sentence is false, then the preface is true. But the report as a whole is consistent? Yes, because it is possible that one body sentence is false and the rest true, and then the preface is true. The report is consistent, but it cannot be entirely true. This is the difference with the lottery: the lottery set of propositions is inconsistent, but the preface set is consistent.

      In the activity, we had an inconsistency in the full endorsement case, which was repaired by withdrawal. In the preface, we start with a consistent set of body sentences (if they are mutually compatible) and add a sentence that makes the set remain consistent but now it is impossible for the entire set to be true.

    Therefore, the two paradoxes are different, but both challenge the idea that rational belief is just matching credences to evidence.

    Final debrief points:

      - The lottery paradox shows that if we set a threshold for acceptance (like 0.99) and accept every proposition above the threshold, we may accept a set that is inconsistent.
      - The preface paradox shows that even when the individual propositions are highly probable, we may also reasonably accept that at least one of them is false.

    Both point to the need for a more nuanced theory of rational belief.

