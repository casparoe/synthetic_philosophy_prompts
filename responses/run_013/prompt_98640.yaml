prompt: |-
  You're a philosopher of history who also actually knows the historiography — so I want you to slow down, brainstorm for a bit before you write, and then give me your considered answer. Assume I know the names and the broad strokes but not the details.

  Here's where I'm at. I keep going back and forth on whether cyclical views of history deserve to be taken seriously — the rise-and-decline shape you get in Polybius and Ibn Khaldun, and then the big systems in Spengler and Toynbee — versus the basically linear or progressive story most of us absorbed in school. Before I read another book about it, I want the spec first. What would a theory of historical cycles actually have to deliver to be worth believing?

  So write me the desiderata. Not a summary of what the cyclical guys said — the requirements any such theory has to meet. I want:

  - the phenomena it has to explain (e.g. why broadly similar patterns of consolidation, overreach and breakdown seem to recur in societies that had no contact with each other, while the details are never quite the same);
  - the cases it has to get right, named ones, including at least one case where a cyclical theory seems to have predicted wrong or been rescued by fudging;
  - the distinctions it absolutely cannot collapse — I'm thinking things like mere recurrence vs. genuine return, a cycle vs. a trend vs. a random walk, a descriptive pattern vs. a causal mechanism, and maybe the difference between a society and an organism;
  - the results it can't contradict — contingency and path-dependence, the openness of the future, and the fact that historians can't run experiments and there are only a handful of civilizations to work with;
  - and for each requirement, the case or consideration that motivates it, so I can see why it's a requirement and not just my taste.

  Two things I especially want your judgment on. First, is the organismic metaphor — societies being born, maturing, decaying — a genuine desideratum or just a prejudice of one camp that should be thrown out? Second, flag any pair of requirements you think can't be satisfied at the same time; if some subset is jointly unsatisfiable, say so, because honestly that would be the most interesting result and I half-suspect it. And tell me which single requirement ends up knocking out the most candidates.

  If it's cheap to do, finish with a short scorecard of Polybius, Ibn Khaldun, Spengler and Toynbee against the list — just a line or two each, no need to be exhaustive. Skip bibliographies and reading lists, I don't need cites, I need the criteria. And please dont just recite what these guys are famous for; the whole point is the requirements.
