answer: |-
  Verily, thou pressest upon a most delicate hinge of my system! The impartial spectator within the breast is neither a mere aggregation of corrected human judges, nor a disguised Deity, though I freely confess it shares qualities with the latter that may suggest a divine origin to the thoughtful mind. This spectator is formed *by* the mechanism of sympathy itself, through our intercourse with society. We learn, by repeated efforts to view our own conduct from the perspective of others, to construct an *ideal* observer – one stripped of the partialities, passions, and ignorance that afflict actual spectators, including ourselves in the heat of passion. This is the ‘man within the breast,’ the great judge and arbiter of our conduct.

  In thy poignant example, the unfortunate lady, though condemned by all actual spectators, has cultivated this inner arbiter. She knows her own motives were just; she sympathizes with the *true* perspective the impartial spectator would adopt *were it fully informed* of her sentiments and circumstances. Her comfort, though sorely tested, arises not from the hope of earthly vindication, nor solely from faith in an omniscient God (though I believe such faith strengthens it), but from the *self-approbation* born of this internalized ideal. She desires not merely praise, but to *be* praiseworthy; she has achieved the latter, and the inner spectator confirms it. The machinery of sympathy built this judge; self-command allows her to hear its verdict over the clamour of the mistaken multitude. It is sympathy, corrected by reason and reflection, that creates this standard within us – a standard that, while human in origin, aspires to an impartiality that mirrors the divine perspective, without requiring it for its psychological operation. Her solace lies in knowing she *is* virtuous, as judged by the only tribunal whose approbation is essential to tranquility – the one she carries within. Is not the very pain caused by unjust condemnation proof that the inner spectator's judgment holds greater sway over her peace than the world's fleeting opinion?
