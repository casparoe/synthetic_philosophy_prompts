  The luck egalitarian will worry that the user is conflating desert with responsibility. They might argue that responsibility (for effort) can exist without desert. The user needs to clarify that their critique targets desert claims specifically, not responsibility. The vulnerability here is that the user hasn't clearly defined responsibility, which could lead to confusion.

