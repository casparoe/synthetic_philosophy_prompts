prompt: |-
  I'm a clinical ethics consultant at a mid-sized hospital, and I just had a long, slightly wine-fueled arguement with my oldest friend about Hume's essay on suicide. She thinks it's just a period piece — an 18th-century guy being shocking — and that nothing in it could possibly help me when I'm on call. I think there's actually a usable proceedure buried in there, but I got tangled up trying to state it. So: act as a philosopher who also knows the practical constraints of a hospital ethics consult. Think carefully, and start by brainstorming the different arguments Hume actually makes in that essay and what each would imply for a bedside decision. Then turn the defensible ones into a decision procedure I could actually run on a consult.

  I do maybe two or three of these consults a month, usually with about twenty minutes before I have to give the team an answer, and the attending has to sign off. The procedure should be a checklist or ordered set of questions for a patient who is asking about assisted dying where it's legal, or who is refusing life-sustaining treatment in a way that will certainly end their life. It needs to say what counts as a sufficient answer at each step, where the procedure stops with a clear no, and where it has to hand the decision to a person because the question is one of values rather than facts. I don't want a bibliography, reading list, or citations — I know the essay, and I can't use them at the bedside anyway. I want the operational core.

  The hard cases I need it to handle: (1) a patient with a terminal illness and intractable pain who says they're ready to go; (2) a patient who says they want to die because they don't want to be a burden on their family; (3) a patient who says God forbids suicide but they want to die anyway; (4) a patient whose request seems to be driven by untreated depression, but who insists it isn't. For each, show me how the procedure runs and where it either gives an answer or gets stuck. I especially want you to include one case where the procedure gives an answer I won't like — maybe where it says we should honor a request I'd instinctively resist, or refuse one I'd instinctively honor.

  Also, be honest about the seams. Hume's argument about our duty to God is the one I can't see how to operationalize in a secular hospital. Is that a problem for the procedure, or can it be bracketed? And say how confident you are in the procedure you've given me, and single out the one point you're least sure about. Don't just tell me it's all context-dependent — give me the actual steps, even if some of them are judgment calls dressed up as procedure.
reasoning: |-
  We are going to extract the core arguments from Hume's essay "On Suicide" and then build a structured decision procedure for clinical ethics consults, especially regarding assisted dying or refusal of life-sustaining treatment. The procedure must be practical, with clear steps, stopping points, and hand-offs for value judgments.

  Hume's main arguments in "On Suicide":
  1. **Against the charge of impiety (offense to God):** Hume argues that if God governs the world by general laws, then human actions (including suicide) are part of the causal chain and thus within the divine plan. Therefore, suicide does not violate our duty to God.
  2. **Against the charge of violating duty to society:** Hume contends that if a person is no longer useful to society (or is a burden) and their death does no harm to society, then suicide is not a breach of duty. Moreover, if they are a burden, suicide might even be a benefit.
  3. **Against the charge of violating duty to self:** Hume argues that when life becomes a burden due to pain or misery, continuing to live is against self-interest, and thus ending life is not a violation of self-duty. He sees suicide as a way to escape unbearable suffering.

  However, note that Hume also includes a caveat: one must not act in a way that harms society. Thus, the key elements for a decision procedure are:
  - Assessment of the individual's current condition (burden of life, suffering).
  - Assessment of the impact on society (especially immediate others and society at large).
  - Consideration of whether the act is a rebellion against divine order (though in a secular hospital, this may be bracketed).

  **Proposed Decision Procedure:**
  We'll create a checklist of questions to be answered in sequence. The goal is to determine whether the patient's request for assisted dying or refusal of life-sustaining treatment is ethically permissible under Humean principles. The procedure has three main sections: (A) Capacity and Voluntariness, (B) Condition and Burden, (C) Social Impact. At each step, if the answer is negative, the process stops and the request is denied (unless overridden by other ethical considerations not covered here). If it proceeds to the end without a clear stop, then the request is permissible, but note that the final decision must be made by the patient and the medical team within legal bounds.

  **Checklist: Hume-Inspired Decision Procedure for End-of-Life Requests**

  1. **Capacity and Voluntariness (Gatekeeping Step)**
     - *Question:* Does the patient have the cognitive capacity to make this decision, and is the request voluntary (free from coercion or undue influence)? 
       - *Sufficient answer:* Capacity confirmed by standard clinical assessment (able to understand, appreciate, reason, and communicate a choice). Voluntariness confirmed by absence of coercion and by consistency of the request over time (if possible).
     - *If no:* Stop. Request cannot be honored. Address the cause (e.g., treat depression, remove coercion).
     - *If yes:* Proceed to step 2.

  2. **Nature of the Condition (Hume's Burden of Life)**
     - *Question:* Is the patient's condition one that imposes a severe and intractable burden (e.g., unremitting pain, terminal illness with suffering, irreversible loss of function or dignity) such that continued life is a net harm to the patient?
       - *Sufficient answer:* The burden must be severe, documented (e.g., by medical records), and not amenable to reasonable interventions that the patient is willing to accept. The patient must articulate the burden clearly.
     - *If no:* Stop. Request denied. Explore alternatives (palliative care, psychological support, etc.).
     - *If yes:* Proceed to step 3.

  3. **Social Impact (Hume's Duty to Society)**
     - *Question:* Would honoring the request (assisted dying or treatment refusal) cause significant harm to society or specific others (e.g., family, community) beyond the normal grief of losing a loved one?
       - *Sufficient answer:* Consider: Would it lead to tangible harm (e.g., financial ruin, psychological trauma beyond normal bereavement) or set a dangerous precedent? Also, consider if the patient is a vital figure (e.g., sole caregiver for young children) whose death would cause exceptional harm.
       - Note: Burden on family is not necessarily harm if the burden is due to caregiving and the family is willing to bear it, but if the patient's continued life causes severe hardship to others (e.g., draining family resources entirely) and the patient is concerned about this, then it might be a factor in favor.
     - *If yes (harm is significant and unavoidable):* Stop. Request denied. Consider social support interventions.
     - *If no (no significant harm, or harm is outweighed by the relief of suffering):* Proceed to step 4.

  4. **Autonomy and Values Reconciliation (Final Step)**
     - *Question:* Is the request consistent with the patient's deeply held values and beliefs, and has any internal conflict (e.g., religious objection) been adequately explored and resolved by the patient?
       - *Sufficient answer:* The patient should be able to articulate how the request aligns with their values, or if there is conflict, they have reconciled it (e.g., "I know my religion forbids it, but I feel God would understand my suffering"). If the patient expresses unresolved conflict, it may require further discussion or pastoral care. However, this step is about the patient's own resolution, not external judgment.
     - *If no (patient expresses unresolved conflict and is distressed by it):* Pause. Do not proceed until the conflict is addressed (e.g., with counseling). If unresolved, the request may be denied or deferred.
     - *If yes (or if the patient has no conflict):* The request is ethically permissible under Humean principles. The medical team can then act within legal and institutional guidelines.

  **Bracketing the Religious Argument:**
  Hume's argument about duty to God is addressed in step 4 (values reconciliation) in a secular way. The hospital does not need to adjudicate theological questions. Instead, we focus on whether the patient has reconciled their own beliefs. If the patient's religion forbids suicide and they are conflicted, we don't override their religion but help them resolve the conflict. If they resolve it (even if against religious doctrine), we proceed. If not, we stop. The procedure avoids making theological claims.

  **Confidence and Weak Points:**
  - Overall confidence: Moderate to high for cases where the patient's condition and social context are clear. The procedure is strong on autonomy and balancing individual vs. social harm.
  - Least sure about: Step 3 (Social Impact). Defining "significant harm" is context-dependent and may be subjective. What counts as a dangerous precedent? In a pluralistic society, we must avoid imposing a particular view of social duty. This step requires careful judgment and may need input from social workers or family meetings.

  **Running the Cases:**

  **Case 1: Terminal illness, intractable pain, ready to go.**
  - Step 1: Capacity and voluntariness likely confirmed (if no impairment).
  - Step 2: Condition is a severe burden (terminal, intractable pain) → yes.
  - Step 3: Social harm? Normal grief, but no significant harm to society → no.
  - Step 4: Patient has no expressed value conflict → yes.
  - Outcome: Request permissible.

  **Case 2: Doesn't want to be a burden on family.**
  - Step 1: Capacity confirmed.
  - Step 2: Condition? If the patient has a severe medical condition causing dependency and suffering, then yes. If the patient is physically independent but feels economically or emotionally burdensome, we must assess: is the burden severe enough to make life a net harm? This might be tricky. If the patient is not terminally ill and has treatable depression, step 2 might be "no". But if the condition is irreversible (e.g., late-stage ALS) and the burden is real, then yes.
  - Step 3: Social harm? Here, the patient's death might actually remove a burden (as per Hume), but we must check: would the family be harmed more by the death (e.g., guilt) than by the burden? Also, is the family willing to bear the burden? If the family is supportive and does not feel burdened, then the social harm of death (guilt, loss) might outweigh. But if the burden is crushing and the family is struggling, and the patient is suffering from being a burden, then social harm might be net negative (i.e., no significant harm from death). This step requires careful assessment.
  - Step 4: Values? Patient may feel it's the right thing to do. If no conflict → yes.
  - Outcome: If step 2 and 3 are passed, permissible. But note: step 2 might be the sticking point if the burden is primarily psychological and treatable.

  **Case 3: God forbids suicide but they want to die anyway.**
  - Step 1: Capacity confirmed.
  - Step 2: Condition severe → yes.
  - Step 3: No significant social harm → proceed.
  - Step 4: Values conflict? Patient explicitly states religious objection but still wants to die. This is unresolved conflict. We must pause and address: pastoral care, counseling. If after exploration the patient resolves the conflict (e.g., "I believe God will forgive me because of my suffering"), then proceed. If not (e.g., "I know it's a sin but I can't bear it"), then the request is not consistent with their values and we stop. Outcome: Stuck at step 4 until resolved.

  **Case 4: Request driven by untreated depression?**
  - Step 1: Capacity? This is the key. Depression can impair judgment and appreciation. If depression is severe and untreated, capacity might be compromised. We must assess: is the patient able to appreciate the consequences and reason through? If depression is impairing, then step 1 fails → stop and treat depression. If capacity is intact despite depression (e.g., mild depression that does not cloud judgment), then proceed to step 2.
  - Step 2: Condition? If the patient has a severe underlying illness, then yes. But if the burden is primarily depressive symptoms (e.g., hopelessness, low mood) and the medical condition is treatable, then step 2 might be "no" because the burden is treatable. We must treat the depression and reassess.
  - Step 3: If we get here, then assess social harm.
  - Step 4: Values?
  - Outcome: Likely stuck at step 1 or 2. If depression is treatable, we must treat first.

  **One Case Where the Procedure Gives an Answer You Might Not Like:**
  Consider a case of a patient with early-stage dementia (still competent) who has a strong desire to avoid advanced dementia. They request assisted dying while still capable. They have moderate physical health issues but are not terminal. They feel life would be a burden if they lose cognition.

  - Step 1: Capacity confirmed (if current decision-making is intact).
  - Step 2: Condition? The current burden is the fear of future suffering and loss of dignity. Is this a severe and intractable burden? It might be, because dementia is progressive and irreversible. But the burden is anticipatory. Some might argue that step 2 requires current suffering. However, the patient may see the future as a net harm. If we accept that the burden is severe and intractable (because the decline is inevitable and the patient finds it intolerable), then step 2 is yes.
  - Step 3: Social harm? None apparent (e.g., no dependents).
  - Step 4: Values? Patient has no conflict (e.g., secular, values autonomy and dignity).
  - Outcome: Permissible. But this might be uncomfortable because the patient is not currently in severe physical suffering. The procedure allows it because the burden is judged as severe and intractable (based on patient's view) and no social harm.

  **Seams and Limitations:**
  - The procedure doesn't address legal constraints (it assumes legality).
  - Step 2 is subjective: what counts as a severe burden? We rely on patient report and clinical judgment.
  - Step 3: Social harm is hard to quantify and may involve cultural factors.
  - Step 4: We allow the patient to resolve their own value conflicts, but what if the conflict is due to a treatable mental condition? We address that in step 1.

  **Final Note:** This procedure is not a substitute for a full ethics consult but a structured framework to apply Humean principles. It should be used in conjunction with standard medical ethics principles (autonomy, beneficence, nonmaleficence, justice) and legal requirements.
answer: |-
  Below is a practical, step-by-step decision procedure based on the defensible core of Hume's arguments in "On Suicide." I've distilled Hume's key points into a structured checklist focused on his central claims:  
  - **Against divine violation:** Suicide isn't inherently impious if it aligns with natural laws (we bracket theology in a secular setting).  
  - **Against societal violation:** Suicide is permissible if it doesn't harm society (or even benefits it by ending burdens).  
  - **Against self-violation:** Suicide is rational when life becomes a net burden due to suffering.  

  The procedure prioritizes autonomy while filtering for coercion, impulsivity, and harm to others. It's designed for *competent adult patients* in jurisdictions where assisted dying or treatment refusal is legal. It assumes you've already confirmed legal eligibility (e.g., terminal diagnosis where required) and involves a rapid interdisciplinary huddle (e.g., MD, nurse, social work) for steps requiring external input.  

  ---

  ### **Hume-Inspired Decision Procedure: End-of-Life Request Checklist**  
  **Time:** Designed for 15-20 min. Proceed sequentially. Stop early if any step fails.  

  #### **Step 1: Voluntariness & Stability**  
  *"Is this request truly the patient's own, consistent, and free from coercion?"*  
  - **Assess:**  
    - Is the patient under direct pressure (e.g., family demanding they "stop being a burden")?  
    - Is the request stable (repeated over days/weeks, not new after a single bad event)?  
    - Any signs of impulsivity (e.g., untreated anxiety, acute grief)?  
  - **Sufficient answer:** No coercion + request stable + no acute impulsivity.  
  - **Stop if:** Coercion present or request is impulsive → **Deny request.** Address coercion/impulsivity first.  
  - **Hand-off needed?** No. Clinical judgment (e.g., psychiatry eval if impulsivity suspected).  

  #### **Step 2: Burden of Life**  
  *"Is the patient's suffering severe, intractable, and making life a net harm?"*  
  - **Assess:**  
    - Is suffering physical (e.g., pain, dyspnea) or existential (e.g., loss of dignity, autonomy)?  
    - Is it *intractable* (all reasonable treatments tried/rejected, including palliative/supportive care)?  
    - Does the patient view continued life as worse than death?  
  - **Sufficient answer:** Suffering severe + intractable + life is net harm *to patient*.  
  - **Stop if:** Suffering is mild, transient, or treatable → **Deny request.** Offer interventions (e.g., pain control, therapy).  
  - **Hand-off needed?** Partial. Requires clinical input on intractability (e.g., palliative care confirms options exhausted).  

  #### **Step 3: Social Harm Assessment**  
  *"Would honoring this request cause greater harm to society/others?"*  
  - **Assess:**  
    - Would death create *exceptional* harm (e.g., orphaned minors, catastrophic financial loss, community crisis)?  
    - Is the patient’s "burden" claim accurate (e.g., family *wants* to care for them, no objective burden)?  
    - Would death *prevent* greater harm (e.g., draining family resources, traumatic decline)?  
  - **Sufficient answer:** No exceptional harm to society/others, OR harm prevented outweighs harm caused.  
  - **Stop if:** Exceptional, irreparable harm to others → **Deny request.** Mitigate harm (e.g., social work support).  
  - **Hand-off needed?** Yes. Require social work/family input on harm (e.g., family meeting to verify burden claims).  

  #### **Step 4: Values Reconciliation (Autonomy Final Check)**  
  *"Is the patient at peace with their values, even if conflicted?"*  
  - **Assess:**  
    - Does the patient acknowledge and accept their internal conflicts (e.g., "I know my faith forbids this, but I choose it anyway")?  
    - Have they explored alternatives aligning with their values (e.g., palliative sedation vs. assisted death)?  
  - **Sufficient answer:** Patient owns the decision without unresolved guilt/shame.  
  - **Stop if:** Patient expresses unresolvable turmoil (e.g., "I’ll go to hell but I can’t bear this") → **Pause request.** Offer counseling/chaplaincy.  
  - **Hand-off needed?** Yes. Chaplain or ethics colleague if values conflict persists.  

  **Final Output:**  
  - If all steps pass → **Permit request** (ethically defensible under Hume).  
  - Any step fails → **Deny or pause request** (specify why).  

  ---

  ### **Handling Your Cases**  
  **Case 1: Terminal illness, intractable pain, ready to go.**  
  - Step 1: Pass (voluntary, stable).  
  - Step 2: Pass (severe physical suffering, intractable).  
  - Step 3: Pass (no exceptional social harm; normal grief ≠ harm).  
  - Step 4: Pass (values reconciled).  
  - **Outcome:** Permit. Hume sees this as rational self-interest.  

  **Case 2: Doesn’t want to be a burden on family.**  
  - Step 1: Pass (assume voluntary/stable).  
  - Step 2: **Fail** if no objective burden (e.g., family rejects "burden" framing). Pass only if burden is real *and* causes patient suffering (e.g., "I’m bankrupting them").  
  - Step 3: **Critical check:** If family confirms burden is severe (e.g., "we’re exhausted, losing our savings"), pass. If family opposes, fail (social harm via trauma/guilt).  
  - Step 4: Pass if patient owns choice (e.g., "I’d rather die than drain them").  
  - **Outcome:** Highly contextual. Fails Step 2 if burden is subjective; fails Step 3 if family objects.  

  **Case 3: God forbids suicide but wants to die anyway.**  
  - Step 1: Pass (if stable).  
  - Step 2: Pass (if suffering severe).  
  - Step 3: Pass (no social harm).  
  - Step 4: **Fail.** Unresolved conflict (e.g., "I’m sinning but need relief") → Pause for chaplaincy. If after counseling, patient says, "I accept damnation," pass.  
  - **Outcome:** Stuck at Step 4 until conflict resolved.  

  **Case 4: Request driven by untreated depression?**  
  - Step 1: **Fail.** Depression risks impulsivity/voluntariness → Deny and treat depression.  
  - Step 2: **If depression treated, reassess.** If suffering persists (e.g., from comorbid illness), pass. If purely depressive, fail.  
  - **Outcome:** Stop at Step 1. Re-evaluate after treatment.  

  ---

  ### **The Uncomfortable Case: Early Dementia Patient**  
  *Scenario: Competent early Alzheimer's patient requests assisted death to avoid decline. No physical suffering, but existential dread of losing self. Family supports choice.*  
  - Step 1: Pass (voluntary, stable if requested repeatedly).  
  - Step 2: **Pass?** Existential suffering (loss of dignity/autonomy) may qualify as "net burden" if irreversible. Hume prioritizes *rational self-interest*—avoiding future degradation is arguably rational.  
  - Step 3: Pass (no exceptional harm; family supports).  
  - Step 4: Pass (patient owns values).  
  - **Outcome:** **Permit.** You might resist, as suffering isn't "active," but Hume’s logic supports autonomy when life is a net burden.  

  ---

  ### **Seams, Confidence, and Weak Points**  
  - **Bracketing Hume’s God Argument:** Unproblematic. The theological debate is irrelevant in a secular hospital. Step 4 (values reconciliation) handles patient-specific beliefs without endorsing theology.  
  - **Overall Confidence:** **High** for terminal/suffering-driven cases. It operationalizes Hume’s core while respecting clinical realities.  
  - **Weakest Point:** **Step 3 (Social Harm).**  
    - Why: "Exceptional harm" is nebulous (e.g., is "emotional trauma" to family exceptional?).  
    - Mitigation: Require social work input for objectivity.  
    - Risk: Override autonomy too easily if "harm" is overinterpreted.  
  - **Other Seams:**  
    - **Step 2:** "Net burden" relies on patient subjectivity. Balance with clinical assessment of intractability.  
    - **Not a Substitute:** This complements but doesn’t replace legal criteria (e.g., terminal diagnosis mandates).  
    - **Speed vs. Rigor:** In 20 minutes, lean on chart review and team input; defer complex social harm cases.  

  **Final Note:** This procedure makes Hume actionable by focusing on his secular, utilitarian core: *autonomy in suffering + no harm to society*. It won’t resolve all dilemmas, but it forces systematic thinking when time is short. Use it as a scaffold—not a crutch.
