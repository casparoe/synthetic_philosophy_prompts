prompt: |-
  I run a small removals firm with my mate Col — nine of us all in, two vans, house moves and a bit of office stuff. Twice a year I sit down and do the pay reviews, then theres the christmas bonus which is at my discretion, and in between theres overtime and who gets the training budget and who drives the new van. Call it a grand a head on the bonus and 3-6% on the rises, so it's not nothing to these lads and it's not nothing to me either.

  I've got no theory background, I did A-level sociology and thats about it, but I keep chewing on the word 'deserves', because I use it about four times a day and I've realised it's doing at least three jobs in my mouth and they don't agree with each other:

  1. Earned it. Backwards. They did the graft, so the money's theirs by right. Nothing to do with whether paying them gets me anything.
  2. Worth it. Forwards. They'll do the most with it, or they're the one who'll bring the work in next year. Nothing to do with what they've already done.
  3. A fair shout. They were in the running, and nobody can say they got passed over for a reason that wasn't about the work.

  And I know 'owed' isn't the same word as 'deserves' — I owe Aaron his hours whether he's earnt them that week or not, thats just the contract.

  Then theres a fourth thing that keeps getting muddled in with it: how big the pot is. Nobody deserves the pot being the size it is, thats just what the jobs pay and what we can afford. But the second the pot's fixed, 'deserves' suddenly means 'deserves more of it than her', which feels like a different sentence to me. I don't know if thats a real difference or me being thick.

  And then the thing that really nags me. Aaron's built like a shed and can carry a piano on his own, and he didn't earn that, he just is. Priya's got a way with panicking customers I couldn't teach her if I tried. I didn't earn the fact I can read a balance sheet and Col didn't earn his dad lending us the deposit for the first van. My sister-in-law says if you take that seriously nobody deserves anything ever and the whole idea's a nonsense. I don't think it's a nonsense, I think it just means desert runs out somewhere and past that point it's just rules we've agreed on, and I'd like to know where that point is.

  So what I want is a procedure I can actually run. Not an essay, not a reading list (I wont read it), not a lecture on what some dead bloke said. A set of questions in order, what counts as a good enough answer to each, where the thing stops with a straight no, and where it hands the decision back to me because its a values call and not a fact. I've got two weeks and about an hour a head before the reviews, its me and Col who sign off, and the accountant needs the numbers by the 15th, so it has to be quick and it has to be something I can explain to Col without him thinking I've lost it.

  Three cases to run it on:
  - Aaron: strongest pair of hands we've got, six years in, doesn't say much, and half of what he does is just his build.
  - Priya: four months off with stress last year, but when she's in she holds the diary together and does the horrible phone calls nobody else will do.
  - Me and Col and our cut at the end. I suspect the procedure is going to have something to say about that and I'm not going to like it, so say it anyway.

  Also please check the little tests I've been using and tell me which ones are rubbish: (a) would I still say this if the same work had been done by someone I can't stand? (b) if the firm had a bad year, would I still say I owed it to them? (c) if I could keep the money and nobody would ever find out, does the claim still stand? (d) am I handing them the same thing they're owed — if what they deserve is credit and what I've got is cash, am I settling it or buying it off?

  And say what the procedure can't do, so I know when to stop asking it things. British English please, I'm in Leeds and 'gotten' does my head in.
reasoning: |-
  Alright, let's tackle this step by step. The user runs a removals firm with his mate Col, and he's struggling with the concept of "deserves" when it comes to pay reviews, bonuses, and resource allocation. He's identified three different meanings of "deserves" that conflict: earned it (past effort), worth it (future benefit), and fair shout (procedural fairness). Plus, there's the issue of the pot size being separate from individual desert.

  First, I need to understand his main request: a practical procedure, not theory. He wants a step-by-step process with clear questions, thresholds for yes/no, and where it's a values call. He mentioned three cases: Aaron (physical strength), Priya (skills with customers), and himself/Col (their cut). Also, he provided some tests (a-d) that need evaluation.

  Key points from his situation:
  - Small team, two vans, house/office moves.
  - Pay reviews twice a year, Christmas bonus, overtime, training, van assignments.
  - Bonus around £1k, raises 3-6%—significant for both employees and the business.
  - He's aware of innate traits (Aaron's strength, Priya's people skills) complicating "deserves."
  - Needs something quick, explainable to Col, accountant deadline 15th.

  His deeper needs:
  - Clarity in decision-making to avoid guilt or inconsistency.
  - Fairness that's transparent and defensible to the team.
  - Balancing merit with practicality in a small business context.
  - Resolving the tension between desert based on effort vs. contribution vs. fairness.

  The procedure must be:
  1. Sequential questions.
  2. Clear pass/fail thresholds.
  3. Identifies where it's a judgment call.
  4. Practical for time constraints (1hr per person).

  Assessing his tests:
  (a) Would I say this if done by someone I dislike? - Good for removing personal bias.
  (b) If bad year, still owe? - Tests necessity vs. desert; useful but limited to contractual obligations.
  (c) If no one finds out, still valid? - Tests intrinsic desert; strong for moral claims.
  (d) Desert is credit, I have cash - Am I settling or buying off? - Highlights mismatch between recognition and reward; useful for aligning rewards with what's deserved.

  Developing the procedure:
  1. Separate desert from the pot size first. The pot is fixed based on affordability.
  2. Three aspects: earned (past), worth (future), fair (process).
  3. For each employee, evaluate against these aspects with specific questions.
  4. Use his tests as filters during the process.

  For the cases:
  - Aaron: Innate strength doesn't negate his effort in applying it. Focus on reliability, years of service.
  - Priya: Despite stress leave, her unique skills during work hours add value. Fairness in not penalizing absence if she delivers when present.
  - Owners: Desert might not apply; it's about agreed rules and reinvestment. Procedure flags it as a different category.

  Procedure steps:
  1. **Lock the Pot:** Confirm available funds first.
  2. **Earned It? (Past Effort):** Did they meet/exceed role expectations? If yes, proceed. If no, automatic no raise unless exceptional circumstances (values call).
  3. **Worth It? (Future Value):** Will investing in them benefit the business? Training/van driving fits here. Not applicable to raises but for bonuses/training.
  4. **Fair Shout? (Procedural Fairness):** Was the decision unbiased and based on work-related reasons? Critical for transparency.
  5. **Apply Tests:** Use (a), (c), (d) to refine. (b) is less relevant for deserts but good for obligations.

  Limitations of procedure:
  - Can't resolve values conflicts; that's where Col and user decide.
  - Doesn't determine pot size.
  - Innate traits are facts; desert starts where effort/application begins.
  - For owners, desert doesn't apply—it's about business sustainability and agreed splits.

  Explaining to Col:
  Frame it as a fairness checklist to justify decisions. Avoid philosophy, focus on questions they already ask informally. Stress that innate abilities don't disqualify desert—it's how they're applied.

  Ensuring practicality:
  - 1hr per person: 15 mins prep, 30 mins review, 15 mins with Col.
  - Document answers briefly.
  - Accountant gets numbers; explanations can follow.

  Finally, summarize the procedure clearly, using his language. Flag owner's cut as outside desert, requiring separate agreement. Validate his tests, especially (a) and (c), and note where (d) helps match rewards to contributions.
answer: |-
  Right, let's crack on. You're spot on that "deserves" is doing too much heavy lifting, and it's causing a tangle. What you need is a **decision procedure** – a step-by-step checklist that forces you to separate those three ideas (earned, worth it, fair shout) *before* you lump them together. This isn't about finding "perfect" desert; it's about making consistent, defensible calls that align with how your business actually runs. It stops where the facts run out and your judgement kicks in. I've kept it in plain British English, no fluff, and it's designed to run in **under 30 mins per person** (plus 15 mins prep and 15 mins with Col to align).

  ### The Procedure: "The Desert Decider" (for Pay Reviews, Bonuses & Perks)
  **Core Principle:** Desert starts **where natural advantage ends and effort/choices begin**. Aaron didn't "deserve" his build, but he *does* deserve recognition for consistently **using** it reliably for your firm. Priya didn't "deserve" her people skills, but she deserves credit for **applying** them to your nightmare phone calls. Your balance sheet skill? It’s how you *use* it for the business that matters. The procedure forces you to check for **effort, choice, and reliability** – not the raw gift itself.

  **Prep Work (Do this once, before reviews):**
  1.  **Lock the Pot:** Calculate total available for raises/bonuses *based solely on affordability* (accountant's numbers). This is non-negotiable. Desert only applies to *distribution*, not the pot size. Write it down: "Raise Pool = £X, Bonus Pool = £Y".
  2.  **Set the Baseline:** Define the minimum "met expectations" for each role (e.g., "turns up reliably, handles standard jobs safely, does paperwork"). If they didn't meet this baseline in the review period, they get £0 raise/bonus automatically – no desert questions needed. (This is your "straight no" exit).
  3.  **Gather Facts:** For each person, jot down 2-3 specific examples for the review period under: **a)** Went beyond baseline (effort/choices), **b)** Unique value brought, **c)** Any fairness flags (e.g., missed training chance, personal issue affecting work).

  **The Checklist (Run this per person, in order):**
  Ask these questions **strictly in sequence**. Stop if you hit a "No". If you get to the end, it's a "Yes" for some level of reward. The "values call" points are where you and Col decide based on gut/business need – the procedure flags them, it doesn't answer them.

  1.  **EARNED IT? (Backwards - Reward for past effort/choices)**  
      *"Did they consistently go beyond the bare minimum baseline through effort, reliability, or smart choices in the last review period?"*  
      - **Good enough answer:** Specific examples of *choices* or *applied effort* (e.g., "Aaron volunteered for extra weekend jobs 3x", "Priya reorganised diary system during peak chaos"). Innate traits *don't* count here unless actively applied *beyond expectation* (e.g., "Aaron used his strength to handle 3-man jobs solo safely, saving us call-outs").  
      - **Straight No:** If they only did the baseline job, or if failures were due to laziness/unreliability *within their control*.  
      - **Values Call:** If effort was huge but results poor due to external factors (e.g., injury). Does *intent* count? (You and Col decide).  
      - *Why this first?* If they didn't earn it, desert stops dead. No point asking if they're "worth it".

  2.  **WORTH IT? (Forwards - Investment for future value)**  
      *"Will rewarding them now (raise/bonus/training/van) likely lead to clear, tangible future benefits for the firm?"*  
      - **Good enough answer:** Direct link to business need (e.g., "Giving Priya training keeps her managing diaries = avoids hiring admin", "Aaron driving new van improves job speed", "Bonus keeps Aaron from being poached").  
      - **Straight No:** If the reward clearly won't change anything (e.g., "Training Aaron in advanced IT when he only moves furniture").  
      - **Values Call:** If benefits are uncertain or long-term (e.g., "Will a bonus *really* make Priya less likely to take stress leave?").  
      - *Note:* This is CRITICAL for training/van assignments. Less so for cost-of-living raises if they "Earned It".

  3.  **FAIR SHOUT? (Procedural Fairness - No unfair exclusion)**  
      *"Could I explain this decision to the whole team using work-related reasons they'd accept, even if they grumbled?"*  
      - **Good enough answer:** Decision based *only* on verifiable work stuff from "Earned It" or "Worth It". No hidden personal bias, and comparable people were treated similarly.  
      - **Straight No:** If it fails your test (a) *"Would I say this if done by someone I can't stand?"* and the answer is No. Or if someone with equal results/effort was passed over for no clear reason.  
      - **Values Call:** Balancing unique circumstances (e.g., "Priya's stress leave was medical, but she smashed it when back – is excluding her 'fair'?").  
      - *This is your safeguard.* If it passes a) and feels defensible, it’s likely fair.

  **Applying the Tests You Mentioned:**
  - **(a) "Done by someone I can't stand?"** = **GOLD.** Use it in **Fair Shout**. If the answer changes based on personality, it’s biased. Keep it.
  - **(b) "If bad year, still owed?"** = **Rubbish for desert.** This tests *contractual obligation*, not desert. Useful for "do I *have* to pay?", irrelevant for "do they *deserve* it?".
  - **(c) "If nobody finds out, still valid?"** = **GOLD.** Use it *after* the checklist. If the claim vanishes without social pressure, it wasn't desert, it was coercion. A true desert claim stands alone.
  - **(d) "Deserves credit, I have cash – settling or buying off?"** = **Useful sense-check.** If what they deserve is *recognition* (e.g., for effort) but you give *money*, ask: "Does cash fairly represent this?" If not, consider non-cash rewards (e.g., "Priya deserves public credit for phone work; give her bonus + first choice on van assignments").

  **What the Procedure CAN'T Do:**
  1.  **Define the pot size.** That's maths, not morality.
  2.  **Resolve values calls for you.** It flags them, you and Col decide based on your business ethos.
  3.  **Handle pure luck/chance.** E.g., if someone finds a client's lost Rolex during a move – that's gratitude (bonus?), not desert. Use your discretion.
  4.  **Make people happy.** Someone will always feel hard done by. This is about consistency, not universal agreement.
  5.  **Apply to owners' cut.** That's not desert – it's risk/reward and pre-agreed rules (see below).

  ### Running Your Three Cases
  **Assumptions:** Baseline met by all. Raise pool = 5% of payroll. Bonus pool = £1k/head max.

  1.  **Aaron (Raise/Bonus):**
      - **Earned It?** *Likely Yes.* Examples: Reliability (6 years), uses strength *beyond baseline* (solo piano jobs saving time/crew costs). *Not* just "is big".
      - **Worth It?** *Yes.* Key player, hard to replace. Future value: Keeping him prevents operational risk.
      - **Fair Shout?** *Yes.* Reasons are work-related (reliability, efficiency). Passes test (a): You'd reward anyone doing this.
      - **Verdict:** **Yes to raise (top end: 5-6%) + bonus.** Test (c): His claim holds even in secret. Test (d): Cash rewards his effort/reliability fairly.

  2.  **Priya (Raise/Bonus/Training):**
      - **Earned It?** *Yes (but note the leave).* Examples: Applied people skills *beyond baseline* (handled nightmare calls others refused, improved diary system). Stress leave is a factor, but *when present*, she excelled.
      - **Worth It?** *Yes for training/van?* Future value: Her skills are unique. Training investment could retain her and prevent diary chaos.
      - **Fair Shout?** *Values Call.* Is excluding her due to medical leave *fair*? Test (a): If someone else did her work during leave, would you reward them? Probably. So *she* deserves reward for *her* work when done. Likely **Yes, but...** discuss with Col.
      - **Verdict:** **Yes to raise (mid-range: 4-5%) + bonus.** Her leave wasn't laziness. Use bonus to acknowledge her tough calls. **Prioritise her for training budget** – that's "Worth It". Test (d): She deserves credit *and* cash – it's settled.

  3.  **You & Col (Your Cut):**
      - **The Procedure Says:** *Stop at Step 1.* **Owners don't "deserve" in this system.** Desert is for *employees* within the *agreed structure*. Your cut is different:
          - It's **pre-agreed profit share/risk reward.** You took the risk (van deposit!), you handle the stress, you own the assets.
          - "Deserves" muddies the water. Decide your cut based on: **What's fair per your partnership agreement? What's needed to reinvest? What maintains your living wage?** Not desert.
      - **The Nagging Truth:** Yes, your skills (balance sheet) or Col's dad's loan weren't "earned". But the *decision to use them for the business* was. Reward yourselves based on rules, not desert. Take a market-rate salary first, then split profits as agreed. Don't overpay yourselves if the pot is tight – that fails the **Fair Shout** test for your team.

  ### Final Tips for Running This
  - **Speed:** Prep takes 1-2 hours total. Per person: 15 mins facts, 10 mins checklist. Use a simple table.
  - **Explain to Col:** "Mate, I made a checklist so we're not winging it. Three questions: Did they earn it? Is it worth it? Is it fair? If yes, they're in. Stops us being daft or biased." He’ll get it.
  - **During Reviews:** Be transparent. "Your raise reflects your reliability (Earned It) and your value to the team (Worth It)." No need to philosophise.
  - **Deadline:** Get numbers to accountant by 15th. Explanations can follow.
  - **Test Run:** Try the checklist now on last year's decisions. Did it catch any howlers?

  This cuts through the "deserves" fog by making you separate effort, value, and fairness. Past that, it's your call – but now you know exactly where the line is. Good luck with the reviews. Crack on and put the kettle on.
