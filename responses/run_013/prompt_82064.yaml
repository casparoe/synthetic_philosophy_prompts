answer: |-
  ### Brainstorming: Candidate Points of Contention  
  1. **Revisability of Logical Laws**: Can logical laws (e.g., non-contradiction) be revised under empirical pressure?  
  2. **Force of Holism**: Does Quine’s holism undermine Carnap’s framework-specific insulation?  
  3. **Definability of Analyticity**: Can "analyticity" be defined non-circularly?  
  4. **Internal/External Distinction**: Is Carnap’s dichotomy coherent and useful?  
  5. **Semantic Externalism**: Does externalism (e.g., Putnam’s Twin Earth) threaten Carnap’s meaning postulates?  
  6. **Verbal Disagreement**: Is the dispute merely terminological?  

  **Set Aside**:  
  - *Semantic Externalism*: Both parties agree externalism doesn’t resolve the core dispute. Quineans see it as reinforcing behaviorist semantics; Carnapians treat it as a framework-specific empirical discovery.  
  - *Verbal Disagreement*: To be addressed in the closing, but not dismissed prematurely.  

  ---

  ### Adversarial Collaboration Document  

  #### 1. Jointly Signed Claims  
  Both parties affirm:  
  > (1) **Apriority & Necessity**: Analyticity was intended to explain the *a priori* status and necessity of certain truths (e.g., logical/mathematical sentences).  
  > (2) **Shared Examples**: "All bachelors are unmarried" is analytic *if* "bachelor" is defined as "unmarried man" in the framework. "2 + 2 = 4" is analytic in standard arithmetic frameworks.  
  > (3) **Non-Examples**: "Water is H₂O" is synthetic; its truth depends on empirical discovery.  
  > (4) **Holism Lite**: No sentence is *absolutely* immune to revision, but analytic sentences are *pragmatically* insulated within a framework.  
  > (5) **Pragmatic Entitlement**: We are entitled to hold certain sentences unrevisable *for practical purposes* (e.g., to enable inquiry).  
  > (6) **Not About Conventions**: The dispute is *not* about whether linguistic conventions exist (they do), but whether they ground a *substantive epistemic distinction*.  

  #### 2. Disagreements Table  
  | **Question** | **Quinean Formulation** | **Carnapian Formulation** | **Crux?** | **What Would Move Them** |  
  |--------------|-------------------------|---------------------------|-----------|--------------------------|  
  | **1. Analyticity’s Explanatory Role** | "Analyticity is an empty label; it merely redescribes syntactic or pragmatic decisions without explanatory power." | "Analyticity explains *why* certain truths (e.g., logic) are unrevisable *within a framework* and how they differ from empirical hypotheses." | Yes | Quinean: Show a predictive/explanatory use for analyticity beyond holism. Carnapian: Show holism alone can explain framework stability. |  
  | **2. Revisability of Framework Rules** | "Any ‘rule’ (e.g., modus ponens) can be revised if doing so optimizes global theory utility." | "Revising a framework rule (e.g., abandoning modus ponens) constitutes adopting a *new framework*; it does not revise analytic truths *within* the old framework." | Yes | Quinean: Find a case where a rule is revised *without* framework change. Carnapian: Show such revision is incoherent. |  
  | **3. Internal/External Distinction** | "The distinction collapses: ‘external’ questions are just theoretical questions within a broader empirical framework." | "The distinction is vital: External questions are pragmatic (which framework to adopt); internal questions are cognitive (truths *within* a framework)." | Yes | Quinean: Show an "external" question resolved empirically. Carnapian: Show Quineans conflate pragmatic/empirical justification. |  
  | **4. Conceptual Engineering** | "Stipulated definitions (e.g., ‘marriage = egalitarian union’) are pragmatic tools; they create no analytic truths, only new verbal habits." | "Stipulated definitions *in a framework* yield analytic truths (e.g., ‘marriage is egalitarian’ is analytic *in the new framework*)." | No | Both treat this as verbal: Quineans see "analytic" as redundant; Carnapians see it as essential. |  

  #### 3. Cruxes with Test Cases  
  **Crux 1: Revisability of Logical Laws**  
  > (a) **Sub-Question**: Can a community revise a logical law (e.g., excluded middle) *under empirical pressure* while retaining the same linguistic framework?  
  > (b) **Stakes**: Quineans win if revision occurs without framework change; Carnapians win if revision forces framework abandonment.  
  > (c) **Case**: A quantum physics community abandons excluded middle for quantum propositions due to empirical data, yet retains classical logic for macroscopic objects.  
  > - *Quinean Prediction*: This confirms holism—logic is revised to fit data.  
  > - *Carnapian Prediction*: This shows two frameworks co-existing (quantum/classical); neither revises its internal analytic truths.  

  **Crux 2: Environment-Independence of Analyticity**  
  > (a) **Sub-Question**: Is the analytic status of "Water is H₂O" invariant across environments?  
  > (b) **Stakes**: Carnapians lose if analyticity depends on empirical facts; Quineans lose if meaning postulates are environment-proof.  
  > (c) **Case**: Twin Earth scenario. Earth speakers (disposed to call XYZ "water") assert "Water is H₂O" pre-chemistry. Twin Earth speakers (same dispositions, but XYZ) assert "Water is XYZ".  
  > - *Quinean Prediction*: Both utterances are synthetic; "water" is grounded in environment, not meanings. Carnapian analyticity fails.  
  > - *Carnapian Prediction*: In *their respective frameworks*, both sentences are analytic *after* meaning fixation. Pre-chemistry, "water" lacks a framework definition.  

  **Both Cases Used By**: Quineans (to challenge framework insulation); Carnapians (to refine framework relativity).  

  **Conceptual Engineering Consensus**:  
  > - Both agree stipulations (e.g., defining "person" as "sentient being") are tools for reform.  
  > - Quineans: No analytic truth is created; we adopt new conventions.  
  > - Carnapians: The new definition *makes* "Persons are sentient" analytic in the engineered framework.  
  > - **Verdict**: Verbal—disagreement rests on whether "analytic" adds explanatory value.  

  #### 4. Closing: Residual Dispute & Verbal Status  
  > **Substantive Disagreement**: Whether framework-relative analyticity explains *epistemic stability* (e.g., why we resist revising logic) or is redundant given holism. Quineans demand empirical work from "meaning"; Carnapians assign it a constitutive role.  
  > **Verbal Element**: "Meaning postulate" vs. "entrenched sentence." If "analytic" is redefined as "pragmatically insulated by convention," Quineans accept it but deem it trivial. Carnapians insist this *is* analyticity’s core.  
  > **Dissolution**: Agreeing on a neutral term (e.g., "framework-constitutive") would resolve verbal issues but leave the epistemic role contested.  

  ---

  **Verdict: Mixed** — The dispute is substantive over analyticity’s explanatory necessity, but verbal regarding the triviality of conventions.
