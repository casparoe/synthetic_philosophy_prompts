  2) Disagreements table: I'll phrase each position in authentic language - Quineans rejecting any principled distinction, Carnapians defending framework-relative analyticity. I'll mark whether each point is a crux and what evidence would move each side.

  3) Cruxes with test cases: For the logical revision scenario, I'll show how Quineans see it as confirming holism while Carnapians reinterpret it as framework change. For the twin-earth style case, I'll demonstrate how it challenges Carnapian analyticity but leaves Quineans unaffected. Both must address whether conceptual engineering creates analytic truths.

