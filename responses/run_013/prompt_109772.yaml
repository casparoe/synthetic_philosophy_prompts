answer: |-
  Here is the decision tree meeting your specifications. Designed as a self-contained handout, it guides readers from the stipulated facts of State R to distinct positions on the apology question.

  **Historical Injustice Apology Diagnostic Tree: State R Case**

  **Instructions:** Begin with Question 1. Answer each question based *only* on the stipulated facts about State R and your judgment. Follow the arrows based on your answer to reach the next question or a final position (Leaf). Each Leaf names a distinct stance on what R owes and what makes an apology apt.

  1.  **Can a state meaningfully apologize for actions taken by a prior, radically different regime?**
      *   **A: No, only individuals or continuous institutions can.** → Go to 2
      *   **B: Yes, states can act as moral agents over time.** → Go to 3
      *   **C: State apologies are symbolic acts, not literal agent apologies.** → Go to 4

  2.  **Does the *present* Republic R retain meaningful institutional or functional continuity with the monarchy beyond the civil service? (Consider constitution, borders, core functions)**
      *   **A: Yes, significant continuity exists.** → Leaf 1: **Institutional Continuity Responsibility.** R *is* effectively the same agent as the monarchy due to institutional inheritance. An apt apology requires explicit acknowledgment of this continuity and direct naming of the wrongs committed by the predecessor state.
      *   **B: No, the break is too radical.** → Leaf 2: **Individual Responsibility Only.** Responsibility dies with the monarchical regime and its agents. A "state apology" by R is fiction or shorthand for factual acknowledgment. R can only acknowledge past facts; "apology" isn't owed or apt as a moral act by the current state.

  3.  **What is the primary basis for R's potential responsibility?**
      *   **A: Benefit: R currently possesses resources/advantages gained from the wrongs.** → Go to 5
      *   **B: Complicity/Association: R's current citizens identify with the perpetrators or uphold structures birthed in injustice.** → Go to 6
      *   **C: Moral Community: R, as the successor political community, inherits the duty to address foundational wrongs.** → Go to 7

  4.  **What is the *primary* function of a state-level "apology" in this context?**
      *   **A: Factual Acknowledgement & Public Memory.** → Leaf 3: **Symbolic Acknowledgement.** "Apology" is owed as a public act of truthful naming and memorialization (like the museum). Aptness requires accuracy and institutional weight, but it's not a literal apology seeking forgiveness. Material repair is separate.
      *   **B: Recognition of Victim Status.** → Leaf 4: **Constitutive Recognition.** The apology *is* the owed act because it constitutes the descendants (and the dead) as recognized wronged parties. An apt apology *must* name the wrongs as injustices *to them*. Material repair without this recognition fails as repair. Words alone, if truly recognizing, can suffice.

  5.  **Does R *still* hold significant, identifiable benefits (land, wealth, power structures) directly traceable to the specific dispossession?**
      *   **A: Yes, clearly.** → Leaf 5: **Beneficiary-Based Responsibility.** R owes apology *and* material restitution for unjustly held benefits. An apt apology explicitly links the wrongs to current holdings and commits to redress. Mere words without tangible return are insufficient apology.
      *   **B: No, benefits are too diffuse, intermingled, or transformed.** → Leaf 6: **Moral Debt Without Direct Restitution.** R owes an apology as a moral debt for benefiting from profound injustice, but direct material restitution may be impractical. An apt apology acknowledges the benefit and the suffering caused, focusing on symbolic/material support for descendants (like scholarships) as repair, distinct from direct return.

  6.  **Do current citizens of R bear meaningful *complicity* (e.g., upholding discriminatory structures, denying the injustice, identifying with perpetrator narratives)?**
      *   **A: Yes, significantly (e.g., vocal opposition, current discriminatory laws/practices).** → Leaf 7: **Complicity-Based Responsibility.** R owes apology because its *current* citizens/policies perpetuate the harm or the denial. An apt apology requires dismantling ongoing structures *alongside* words. Apology without ending complicity is hollow.
      *   **B: No, complicity is minimal or passive.** → *Unoccupied: This combination (State can act + Complicity basis + No complicity) leads back to Benefit or Moral Community arguments. It's unattractive as it severs the claimed basis for responsibility.*

  7.  **Who is the primary *addressee* of the owed apology?**
      *   **A: The living descendants of the victims.** → Go to 8
      *   **B: The dead victims themselves.** → Go to 9
      *   **C: The public record / R's own moral integrity.** → Go to 10

  8.  **Can an apology be *complete* without being accepted by the descendants demanding it?**
      *   **A: No, acceptance is essential for felicity.** → Leaf 8: **Uptake-Dependent Apology.** An apology is owed to the descendants and is only apt *if* they accept it as sufficient. R's prior resolutions failed due to lack of uptake. A fourth attempt must involve descendants in crafting it to be felicitous. Rejection means it failed.
      *   **B: Yes, it can be a sincere, complete act by R regardless.** → Leaf 9: **Sincere Performance as Felicity.** An apology is owed to the descendants and is apt if sincere, accurate, and appropriately performed by R. Uptake affects efficacy (forgiveness, reconciliation) but not whether the *apology itself* was felicitously performed. Rejection is about efficacy, not felicity.

  9.  **Can the dead be meaningfully addressed/harmed by a present act?**
      *   **A: No, addressing the dead is symbolic.** → *Path Merges with 7C/10 (Public Record/Integrity).* (Explanation: Belief that the dead cannot be addressed directly shifts focus to the symbolic/public function).
      *   **B: Yes, duties to the dead exist.** → *Unoccupied: While a position exists, the case facts (demands by living descendants, no clear mechanism) make this combination unexplored here.*
      *   *(Note: If 9A, proceed as if answered 7C)*

  10. **Is the primary purpose of the apology to repair R's own moral standing or constitute its identity?**
      *   **A: Yes, integrity/self-constitution is key.** → Leaf 10: **Apologizer-Centered Integrity.** R owes an apology primarily to itself/its ideal self to maintain integrity or become a certain (just) community. An apt apology is one sincerely performed for this reason. Its content matters less for victims than for R's self-definition. Uptake is secondary.
      *   **B: No, purpose is external (record, descendants).** → *Path merges with 8A or 8B depending on view of uptake.* (Explanation: If purpose isn't self-integrity, focus reverts to the external addressee and the uptake question).

  **Leaves Summary:**

  1.  **Institutional Continuity Responsibility:** Apology owed due to continuity; apt if explicit about continuity/wrongs.
  2.  **Individual Responsibility Only:** No state apology owed/apt; only factual acknowledgment possible.
  3.  **Symbolic Acknowledgement:** "Apology" owed as public truth-telling/memory; apt if accurate/official.
  4.  **Constitutive Recognition:** Apology owed to constitute wronged status; apt if recognizing injustice *to them*; words can suffice as repair.
  5.  **Beneficiary-Based Responsibility:** Apology & restitution owed; apt if links wrongs to current holdings & commits to redress.
  6.  **Moral Debt Without Direct Restitution:** Apology owed for benefiting; apt if acknowledges benefit/suffering; repair via support, not direct return.
  7.  **Complicity-Based Responsibility:** Apology owed due to current complicity; apt only with dismantling ongoing structures.
  8.  **Uptake-Dependent Apology:** Apology owed to descendants; apt *only* if accepted by them as sufficient.
  9.  **Sincere Performance as Felicity:** Apology owed to descendants; apt if sincere/accurate, regardless of acceptance (affects efficacy).
  10. **Apologizer-Centered Integrity:** Apology owed for R's own integrity/identity; apt if sincere for that purpose; uptake secondary.

  **Unoccupied Paths & Diagnosis:**
  *   **After 6B (Complicity Basis + No Complicity):** Unattractive. If responsibility *requires* complicity and there is none, the basis vanishes. Responsibility would need another foundation (Benefit, Moral Community) not selected at node 3.
  *   **After 9B (Addressing Dead + Duty Exists):** Unexplored. While philosophically possible (e.g., duties to honor the dead), the case facts emphasize living descendants' demands and the practical focus on present effects, making this path less salient for this instrument.

  **Final Note on Strategic Answering & Limits:**

  Readers are most likely to answer strategically at the foundational nodes determining the *possibility* and *basis* of state responsibility (Nodes 1 & 3). Someone committed to **Individual Responsibility Only (Leaf 2)** will invariably answer "No" at Node 1. Similarly, someone focused on material redress might steer towards **Beneficiary Responsibility (Leaf 5)** via Node 3A, downplaying arguments about institutional discontinuity or lack of direct benefit. Questions about addressee (Node 7) and uptake (Node 8) are also prone to strategic shaping based on desired outcomes regarding victim agency vs. state autonomy.

  This reveals the instrument's key limit: while it forces consideration of logically distinct questions and maps the conceptual space rigorously, it cannot prevent readers from importing pre-existing normative commitments into their "judgment" about ostensibly factual or conceptual nodes (like institutional continuity or the nature of complicity). The tree clarifies the logical structure of the debate and exposes dependencies between positions, but it cannot compel objectivity on premises deeply tied to worldview. Its value lies in making these dependencies explicit and requiring justification for each step, even if initial premises are contested.
