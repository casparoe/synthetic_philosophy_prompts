prompt: |-
  My mother died last spring, and my brother, my sister, and I are dividing her estate: the house she lived in, some savings, and a few pieces of furniture we all want. Our circumstances differ sharply. My sister has a disability with substantial ongoing costs, and she wants her share to go toward making her housing accessible. My brother is comfortable and says he should get the least. I have two children starting college. We have argued for weeks, and each of us has a different idea of what fairness requires. My brother says we should each end up roughly equally well off, so he should receive least. My sister says that is precisely the kind of judgment about her life she has spent her life resisting, and that what she wants is the same wherewithal as the rest of us to run her own life. I think what matters is that each of us ends up equally able to do the things we care about, and for me that includes paying my children's tuition. Two things complicate it: our mother paid for my brother's graduate degree and helped me with a down payment, but could not do the same for my sister; and my sister wants to keep the house and live in it, which the rest of us would have to allow or be bought out of. How should we decide what we are trying to equalize, and do the earlier gifts and the house change the answer? Close with a single line beginning "Verdict:" that names, in one short phrase, the standard you think we should adopt.
reasoning: |-
  Okay, the user is dealing with a really tough family situation after their mother's passing. They and their siblings are trying to divide the estate fairly, but everyone has different needs and perspectives on fairness. 

  First, I need to understand all the layers here. There's the emotional weight of losing their mother, the practical division of assets (house, savings, furniture), and deep philosophical disagreements about what "fair" even means. Each sibling's circumstances are so different—sister with disability costs, brother who's financially comfortable, user with college tuition burdens.

  Hmm... the core conflict seems to be about what metric to use for fairness. Brother wants equal outcomes (equality of welfare), sister wants equal resources (equality of means), user wants equal capability to pursue life goals (capability approach). That's actually three distinct justice frameworks colliding.

  Then there are complicating factors: historical inequalities (mother helped brother and user but not sister), and the house dilemma (sister wants to keep it but can't buy others out easily). The house point feels especially charged—it's not just an asset but sister's future home and independence.

  I notice the user frames this as "how should we decide what to equalize" rather than asking for specific division amounts. That's wise—they recognize the deeper question is about principles first. Smart of them to include the historical context too; those past gifts clearly weigh on their conscience.

  *flipping through mental justice theory notes* Nussbaum/Sen's capability approach might bridge this best? It acknowledges different conversion factors (disability costs more, tuition is essential to user's goals) while respecting agency. Sister's point about resisting others judging her needs is crucial here—capability avoids paternalism.

  But how to handle past imbalances... The grad school/down payment help created real advantage. Accounting for that doesn't mean "punishing" brother, but recognizing cumulative fairness. House complicates it—if sister keeps it, that's both her capability need (accessible housing) and potentially disproportionate asset share. Maybe offset with less cash inheritance?

  User's framing suggests they want resolution, not just analysis. The verdict should be actionable: clear enough to guide talks, flexible enough for their specifics. "Capability-adjusted restitution" covers both current needs and past gaps. 

  *hesitates* Is that too academic? No—user used precise terms like "wherewithal" and "equal ability to do things," they'll get it. Final line must be memorable though. "Verdict: Capability-adjusted restitution for equitable agency." Yes, "equitable agency" nods to sister's autonomy concern.
answer: |-
  This situation requires balancing competing notions of fairness while acknowledging historical inequities and practical constraints. Here's how to approach it:

  **Core Principles for Decision:**
  1. **Prioritize Capability Equality:** Your sister's insistence on agency ("wherewithal to run her own life") aligns with philosopher Amartya Sen's "capability approach." Fairness means equalizing the *real freedom* to achieve well-being, not just resources or outcomes. For your sister, this means funds for accessible housing. For you, tuition support. Your brother, being comfortable, requires less to achieve comparable capability.
     
  2. **Acknowledge Past Imbalances:** Your mother's earlier financial support created an imbalance. Your brother received substantial value (graduate degree), you received significant help (down payment), while your sister received less due to circumstances. Fair division now should *offset this historical inequity* – meaning your brother (and potentially you) should receive proportionally less from the current estate to "balance the books" of lifetime support.

  3. **The House is Key:** Your sister's need to live in accessible housing makes the house uniquely valuable to her capability. Forcing a sale would harm her profoundly. The fairest solution is likely:
     * Sister keeps the house as her primary inheritance.
     * Its fair market value is offset against her share.
     * If the house value exceeds her "capability-adjusted + restitution share," she doesn't get additional cash, and the surplus benefits others *less* than if it were sold (acknowledging her unique need and the non-monetary value to her).
     * If it's below her adjusted share, she receives additional assets/cash to reach it.
     * The rest of the estate (savings, furniture) is divided using the capability and restitution principles.

  **How to Decide What to Equalize:**
  You are trying to equalize **Capability + Restitution**.
  *   **Capability:** Ensure each sibling has sufficient resources to achieve core life goals/functionings (sister's accessible housing, your children's education, brother's existing stability).
  *   **Restitution:** Adjust shares to account for the significantly larger lifetime financial support your brother (and to a lesser extent, you) received from your mother compared to your sister. This isn't punishment, but recognition of the total lifetime distribution of parental resources.

  **Do the Earlier Gifts and the House Change the Answer?**
  *   **Absolutely.** Ignoring the past gifts perpetuates unfairness. The brother benefited most financially; he should receive the least *now*. Your situation may warrant a smaller adjustment than his but more than if no down payment help occurred.
  *   **The House Fundamentally Changes Practical Division:** It cannot be treated as just a liquid asset. Its value to your sister's capability (a home) far exceeds its cash value to others. Forcing a sale undermines fairness. Allowing her to keep it, with a fair value offset based on the capability+restitution framework, is the most equitable path.

  **Process Recommendation:**
  1.  **Valuation:** Get professional appraisals for the house, savings, and significant furniture.
  2.  **Calculate Lifetime Support:** Estimate the value of the graduate degree support and down payment help (at the time given, adjusted for inflation if possible).
  3.  **Apply the Framework:**
      *   Start with the principle that sister's need for accessible housing via the house is paramount.
      *   Deduct the house value (or an agreed percentage acknowledging its unique value to her) from her total potential share.
      *   Determine total distributable estate value *after* setting the house aside for sister (with agreed offset value).
      *   Calculate "adjusted shares" for the remaining estate:
          *   Brother's share is reduced most significantly to account for past graduate support.
          *   Your share may be slightly reduced to account for the down payment.
          *   Sister's remaining need (if any, after house offset) is prioritized.
      *   Divide remaining cash/savings/furniture accordingly. Furniture can be distributed based on sentiment/practical need within the framework.
  4.  **Mediation:** Consider a professional mediator experienced in estates and family conflict. They can facilitate applying this framework neutrally.

  **Verdict:** Capability-adjusted restitution for equitable agency.
