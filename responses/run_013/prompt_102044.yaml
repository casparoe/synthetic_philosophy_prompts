prompt: |-
  There is a tension I keep meeting in every case where an agent deliberately arranges things so that he — or his successors — cannot later do what they would otherwise do, and I have been unable to find whether it has a name. I would like either the established term, if there is one, or a proposed one properly defined; but in either case what I am after is the carving, not the label.

  The cases are familiar. A man who knows he will eat the ice cream at midnight throws it out, or asks his host not to serve dessert. A legislature locks in a fiscal rule so that a later majority cannot undo it cheaply. A constitution protects a right in language deliberately hard to amend. A founder leaves instructions meant to govern an institution long after he is gone. In each, an agent at one time arranges matters so that an agent at a later time cannot, or cannot without cost, do what he would otherwise do.

  What puzzles me is how such arrangements are defended. The defense is always that the later agent is the same agent as the earlier one, so that the arrangement is an exercise of self-government rather than a constraint imposed from outside. The man who throws out the ice cream is the man who would otherwise eat it; the majority that locks in the rule is the majority that would otherwise undo it; the people who protect the right are the people who would otherwise infringe it. On this account nothing has been taken from the later agent, since he is only being held to his own will.

  But the arrangement does work only if the later agent's will diverges from the earlier one's. If the midnight self wanted what the morning self wants, there would be nothing to throw out. So the justification appeals to a sameness that the mechanism presupposes to be absent, and the mechanism presupposes a divergence that the justification denies. Those who design these devices seem to know this: they build them because they expect the later self to want otherwise, and they are seldom wrong to expect that the later self will chafe against the device. Each resolution I have met takes one horn and abandons the other. Either the later agent is a different agent, in which case this is one party ruling another and the talk of self-government is a euphemism; or he is the same agent, in which case one wonders why persuasion would not have served and why a constraint was ever needed.

  Several things I have read seem adjacent without being quite this. The ordinary problem of paternalism concerns one agent overriding another, which is not the shape of the case, since here overrider and overridden are supposed to be one. The suggestion that we are divided or successive selves makes the two agents genuinely distinct, which dissolves the puzzle rather than locating it. And in constitutional writing there is a related but different contrast between the authority that makes a constitution and the authority that the constitution then governs. None of these, as far as I can tell, names the structure I am pointing at: a justification that must invoke sameness together with a mechanism that must presuppose difference.

  Does this structure have a name? If it does, tell me how it is distinguished from each of the neighbours above and which fits best. If it does not, give me a name and a definition that says what the phenomenon is, what it is not, and where its edges lie. I would particularly like to know whether the tension vanishes in the case where the later agent in fact endorses the arrangement, or only becomes invisible there; and whether the same structure appears when two agents bind each other by mutual agreement rather than one binding himself.
reasoning: |-
  Hmm, the user is grappling with a fascinating philosophical tension about self-binding mechanisms. They've observed that when an earlier self constrains a later self (like throwing away ice cream or constitutional entrenchment), the justification claims both selves are identical ("self-government"), yet the mechanism only exists because they're expected to differ ("constraint between distinct agents"). 

  This paradox reminds me of Elster's work on Ulysses pacts and Brennan's constitutional precommitment theories, but the user correctly notes existing frameworks don't capture the core contradiction they've identified. Their key insight is razor-sharp: the very act of binding reveals an anticipated divergence that the justification denies. 

  The user seems philosophically sophisticated - they've already mapped adjacent concepts (divided selves, paternalism, constituent power) and rejected them as imperfect fits. Their demand for precise "carving" over mere labeling suggests academic rigor. Probably a political theorist or legal philosopher given the constitutional examples. 

  What they're truly probing is whether "selfhood" can stretch across time to legitimize constraint. When they ask about mutual binding or later endorsement, they're testing if the paradox dissolves when difference/sameness is unambiguous. Clever. 

  Existing terms like "auto-paternalism" or "diachronic self-binding" describe the act but miss the justificatory tension. We need a term that encapsulates the simultaneous assertion and denial of identity - perhaps "Self-Binding Paradox" with explicit parameters: 
  - Must involve single agent across time
  - Justification requires identity
  - Mechanism requires difference
  - Distinguish from mutual contracts or static preferences

  The mutual binding question is particularly thorny - there the constraint is honest about separate agents, so the paradox vanishes. And when later selves endorse constraints, the mechanism becomes redundant rather than contradictory. Excellent diagnostic tests from the user.
answer: |-
  This tension you describe is profoundly insightful and indeed lacks a universally accepted name. It represents a **justificatory paradox inherent in diachronic self-binding**, where the *defense* of the constraint relies on the *identity* of the agent across time, while the *need* for the constraint relies on the *non-identity* (or divergent will) of that agent across time. Here's the analysis and proposed terminology:

  1.  **The Core Structure:**
      *   **Agent A (at Time T1)** deliberately creates a constraint limiting the options/choices of **Agent B (at Time T2)**.
      *   **Justification:** Agent B *is* Agent A (same entity). Therefore, the constraint isn't truly external; it's an exercise of autonomy/self-government by Agent A binding their "future self."
      *   **Necessary Condition for the Constraint:** Agent B *is not* (or is significantly different from) Agent A *in will/perspective*. Agent A anticipates that Agent B will want differently (X instead of not-X) and acts to prevent X. The constraint is *only useful* if this divergence occurs.
      *   **The Paradox:** The justification asserts sameness ("B is A") that the mechanism simultaneously presupposes is absent ("B will want differently than A, hence the need to bind"). The constraint reveals an anticipated *difference* that the justification *denies*.

  2.  **Why Adjacent Concepts Don't Fit:**
      *   **Paternalism:** Explicitly involves *two distinct agents* (A overrides B for B's good). Your case insists A *is* B, making paternalism inapplicable by definition in the justification.
      *   **Divided/Successive Selves:** Frameworks explicitly treating Agent A and Agent B as *genuinely distinct entities* (e.g., Parfit) dissolve the tension you identify by accepting the non-identity. Your puzzle *arises* from the attempt to maintain identity *despite* the functional non-identity revealed by the constraint.
      *   **Constituent Power vs. Constituted Power:** This distinguishes the *source* of constitutional authority (the people acting originally) from the *ordinary powers* governed by the constitution. While related to binding future governments, it doesn't inherently capture the *internal* tension within the "people" (or legislature) between their T1 constituent self and their T2 governed self regarding *identity* and *divergent will*. Your tension exists *within* the "constituent people" or the "legislative self" across time.

  3.  **Proposed Name and Definition:**
      *   **Name: The Self-Binding Identity Paradox (SBIP)**
      *   **Definition:** The Self-Binding Identity Paradox (SBIP) arises when an agent (A) at time T1 imposes a constraint on an agent (B) at time T2, justified by the claim that B *is* A (same agent), while the very imposition and functional utility of the constraint depend on the presupposition that B *will differ significantly from A in will or perspective* at T2, thereby implicitly treating B as non-identical or distinct in the relevant sense for needing constraint.
      *   **What it is:**
          *   A specific justificatory tension inherent in *diachronic self-binding*.
          *   Characterized by the simultaneous assertion of identity (for justification) and reliance on difference (for mechanism).
          *   Occurs when the binding agent and the bound agent are claimed (for normative purposes) to be the same entity across time.
      *   **What it is not:**
          *   It is *not* paternalism (requires distinct agents).
          *   It is *not* a theory of divided/successive selves (explicitly accepts distinct agents).
          *   It is *not* simply time-inconsistency of preferences (which describes the *problem*, not the *justificatory paradox* around identity).
          *   It is *not* the general problem of authority (constituent/constituted), though it can manifest within it.
      *   **Edges:**
          *   The paradox is sharpest when the constraint is experienced by B as *binding* or *undesired* at T2. This highlights the divergence presupposed by the mechanism.
          *   The paradox dissolves if Agent B at T2 *fully endorses* the constraint imposed by A at T1. In this case, the divergence presupposed by the mechanism *did not occur*, and the justification based on identity aligns with the outcome. The *tension becomes invisible* because the anticipated difference wasn't realized, making the constraint feel like a successful exercise of unified self-government rather than a binding constraint. (The *potential* for the paradox existed when the constraint was set, but it wasn't actualized).
          *   The paradox *does not* appear in the same form in **mutual binding agreements** between two distinct agents (e.g., a contract). Here:
              *   The justification is *not* identity ("B is A"), but *consent* or *mutual benefit* at T1.
              *   The mechanism presupposes *difference* (each party might want to defect at T2) and *distinct agency* (A binding B, B binding A).
              *   There is no internal tension between asserting sameness and relying on difference because distinct agency is acknowledged from the outset. The tension here is about enforcement and commitment between separate parties, not an identity paradox within a single agent.

  4.  **Established Concepts & Best Fit:**
      While "Self-Binding Identity Paradox" (SBIP) is proposed to precisely name the *tension* you've carved out, the broader *act* is often discussed under:
      *   **Diachronic Self-Binding:** (Elster, Schelling) Describes the act but doesn't inherently capture the justificatory paradox.
      *   **Precommitment:** (Elster, influenced by Ulysses) Focuses on the strategic act of binding oneself against future temptation. It implies the difference but doesn't explicitly grapple with the identity claim paradox.
      *   **Temporal Agency / Autonomy:** Explores how agency unfolds over time, sometimes touching on this tension.
      *   **Constitutional Precommitment:** (Holmes, Brennan) Applies the precommitment idea to politics. The SBIP is a core, often unstated, tension *within* this justification.
      **Best Fit:** Among established terms, **"the problem of precommitment justification"** comes closest, but it's descriptive rather than a specific name for the paradox. **"The identity paradox of self-binding"** is also used occasionally in philosophical discussions but lacks widespread recognition. SBIP aims for greater precision regarding the specific contradiction you've identified.

  **In summary:** You have identified the **Self-Binding Identity Paradox (SBIP)** – the inherent contradiction in justifying a constraint on a future self (B) by claiming identity with the present self (A), while the constraint's necessity and function depend on presupposing a significant divergence in will between A and B, implicitly treating them as non-identical in the relevant sense. The tension **vanishes** if B endorses the constraint at T2 (difference unrealized), and it **does not arise** in mutual binding between distinct agents (difference and distinct agency are acknowledged). This paradox lies at the heart of justifications for many forms of self-binding across individual and collective agency.
