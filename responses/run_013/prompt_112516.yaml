prompt: |-
  I teach a ninety-minute session in an upper-level undergraduate seminar on causation and moral responsibility, sixteen students, and I want an activity that makes them feel on their own pulses something they will otherwise only concede in argument: that our verdicts about what an omission caused track what people were required to do and which contrast we happen to be asking about, while the counterfactual facts are held fixed. By the end I want them to have caught themselves changing their answer twice with no new information about the world, to have watched a list of causes refuse to terminate, and to have felt the pull of the doing/allowing asymmetry before they are told it is contested. I would like the design to run in three rounds, and I have particular mechanics in mind; use them, improve them if you can, but do not replace them with a discussion or a lecture.

  For the first round, an inquest, give me four duty profiles and assign each to four students, so that the room divides into four quartets. Every profile places its holder at the same lake on the same afternoon and supplies an identical physical timeline: the swimmer enters the water, the current strengthens, the swimmer goes under, the window of opportunity closes. The profiles differ only in what the holder was obligated to do, and one of them should be a profile with no obligation at all in the relevant jurisdiction but a crowd that believes otherwise. Each student privately writes, on a card, a single sentence of the form the death was caused by X rather than Y. Then redistribute the profiles at random so that nobody keeps the one they held, hand out fresh cards, and have them write again. Collect the first round before the swap so nobody can consult what they wrote. The scoring rule is that a card earns its writer a point only if, read aloud with nothing but the timeline and the stated contrast, a majority of the room would endorse it. The prize should be trivial and should not be money.

  For the second round, a ledger. The group must list everything whose not happening was a condition of the death, with the rule that no two entries may be of the same type, and the round ends only when the group itself declares the list complete. Let it run about eight minutes and then stop it; do not rescue them. For the third round, hold the profile and the facts fixed and vary only the contrast, giving me six pre-written contrast sentences for the same case, some of which the room will accept and some it will reject, so that contrast-sensitivity becomes impossible to miss.

  Constraints. No framing lecture before the first round. The words omission, counterfactual dependence, contrast, norm, and causal selection must not be spoken until the debrief. Nothing in the activity may require students to disclose their own moral views, and there must be a content note about drowning and a way for a student to stay in the room without playing.

  Give me the rules, the materials list, the timeline, the four duty profiles, the six contrast sentences, the scoring rule, a minute-by-minute plan for the ninety minutes, a debrief that maps each round onto a position one could hold, a frank account of what will predictably go wrong the first time and how to handle it, and an honest note on which feature of the idea the activity cannot reproduce and that I will have to supply myself. The debrief should be conceptual and should not cite texts or gesture at a reading list, since the handout will circulate without a bibliography. Write the whole thing as continuous prose, with no headings, numbered lists, bullet points, bold or italic text, or tables; the way one would write a long letter to a colleague.
reasoning: |-
  We are designing a 90-minute session for an upper-level undergraduate seminar on causation and moral responsibility. The goal is to have students experience how our judgments about what an omission caused depend on normative expectations and the contrasts we choose, while the underlying counterfactual facts remain the same. The activity has three rounds: an inquest, a ledger, and a contrast variation. 

  We must avoid using key terms (omission, counterfactual dependence, contrast, norm, causal selection) until the debrief. We must also avoid requiring students to disclose their own moral views and provide a content note about drowning. There should be an option for students to opt out of participation while staying in the room.

  Let me outline the materials and setup:

  Materials:
  - A written timeline of the drowning incident (same for all).
  - Four duty profiles (each on a separate card).
  - Blank cards for students to write their causal statements (first round).
  - Pre-written contrast sentences for the third round (six sentences).

  Room setup: 16 students, divided into four quartets. Each quartet will have the same duty profile in the first round. 

  Timeline (to be distributed to all students):
  "At 2:00 PM, a swimmer enters the lake. At 2:15 PM, the current unexpectedly strengthens. At 2:20 PM, the swimmer goes under. At 2:25 PM, the window of opportunity for rescue closes. At 2:30 PM, the swimmer is declared dead."

  Duty Profiles (each profile is assigned to one quartet in the first round):

  Profile 1: You are the designated lifeguard on duty at the lake. Your job description requires you to monitor swimmers and assist anyone in distress. You were sitting in the lifeguard chair and saw the swimmer go under at 2:20 PM. You did not intervene.

  Profile 2: You are a park ranger. Your duties include maintaining the trails and ensuring the safety of park visitors, but you are explicitly instructed that water safety is the lifeguard's responsibility. You were walking by the lake and saw the swimmer go under at 2:20 PM. You did not intervene.

  Profile 3: You are a visitor at the lake. You are a strong swimmer and have no official responsibilities. You saw the swimmer go under at 2:20 PM. You did not intervene.

  Profile 4: You are a visitor at the lake. You are a strong swimmer and have no official responsibilities. However, a crowd of onlookers started shouting at you to help because they mistook you for a lifeguard (due to your red swim trunks). You saw the swimmer go under at 2:20 PM. You did not intervene.

  First Round (Inquest) - 25 minutes:

  1. Distribute the timeline and duty profiles. Each student in a quartet gets the same profile. (5 minutes for reading and understanding.)
  2. Each student writes on a blank card a single sentence of the form: "The death was caused by X rather than Y." (5 minutes)
  3. Collect the first set of cards (without showing anyone).
  4. Redistribute the duty profiles randomly so that each student gets a new profile (which may be the same as before or different). (2 minutes for redistribution)
  5. Each student writes a new sentence on a fresh card for the new profile. (5 minutes)
  6. Collect the second set of cards. (1 minute)
  7. Scoring: The instructor shuffles all cards and reads each one aloud (without revealing who wrote it or which profile it was for). After each card, the class votes by show of hands: do they endorse the statement? (Only the timeline and the contrast in the statement are provided; the duty profile is not mentioned at this stage.) If a majority endorses, the writer of that card gets a point. (7 minutes)

  Note: The scoring rule is that the statement must be endorsed by a majority when read with only the timeline and the stated contrast. The duty profile is not revealed during the reading. This is crucial because the same physical timeline is the same for all, but the duty profiles are different. We expect that statements from different profiles will be endorsed at different rates, but note that the statement does not mention the duty profile. The point is that the students, when writing, are influenced by the duty profile they had, and when voting, they are only given the timeline and the contrast. However, the contrasts chosen (X and Y) might implicitly reflect the duty (e.g., "the lifeguard's failure to act" vs. "the park ranger's failure to act"). We must be cautious because the duty profile is not revealed during the reading. So, the students are voting on the statement without knowing the context of the duty. This might lead to some statements being rejected because the contrast doesn't make sense without the duty context. We are relying on the fact that the contrasts written will be such that they are sometimes endorsed and sometimes not, depending on the contrast and the duty profile that inspired them, but without the duty context, the voting may be unstable. This is part of the point: the same counterfactual facts (the timeline) are fixed, but the contrasts and the duties affect what people are willing to say.

  Alternatively, we might adjust: when reading the card, we do not reveal which profile it came from, but we read the statement as is. The students are voting on whether that statement is true given the timeline. The hope is that some statements will be endorsed (e.g., "the death was caused by the lifeguard's failure to act rather than the swimmer's carelessness") and some will be rejected (e.g., "the death was caused by the park ranger's failure to act rather than the swimmer's carelessness") because of the implicit norms. But without the duty context, they might not know. This is a problem.

  To fix: When the card is read, the instructor says: "Here is a statement: [reads the sentence]. Given the timeline I provided, would you endorse this statement?" The timeline is the same for everyone. The statement might mention a role (like "the lifeguard") or it might not. We have to design the duty profiles so that the students, when writing, are likely to include the role in their statement. For example, the lifeguard profile might write: "The death was caused by the lifeguard's failure to act rather than the strong current." The visitor profile might write: "The death was caused by the swimmer's own actions rather than any bystander's inaction."

  But then when we read the first one, without the context, the class might think: "But there was a lifeguard?" and they don't know if the lifeguard was on duty or not. The timeline only says there was a swimmer and a current, not that there was a lifeguard. So we must include in the timeline that there was a lifeguard on duty? Actually, the timeline doesn't say that. The duty profiles add that information.

  We have two options:
  Option A: When reading the statement, we provide the timeline and the role that the writer had in mind? But that would be giving away the duty profile, which we don't want because we want the statement to stand on its own and then see if the class endorses it without knowing the duty.

  Option B: We adjust the timeline to include the presence of the lifeguard and the park ranger and the other people? But that might be too much. The timeline is meant to be the physical facts.

  Alternatively, we can change the scoring: we don't read the statements without the duty context. Instead, we reveal the duty profile when we read the statement. But that might make the voting too obvious. The goal is to show that the same physical facts lead to different causal judgments because of the duties. So when we read a statement that says "the lifeguard's failure" and we say this was from the lifeguard profile, then the class will know the lifeguard was on duty and might endorse it. But then we are giving the duty context. That seems okay because the duty is part of the scenario. But note: the statement doesn't include the duty, it includes the role. And the timeline doesn't mention the lifeguard. So we must update the timeline.

  Revised timeline: 
  "At 2:00 PM, a swimmer enters the lake. A lifeguard is on duty in the chair. A park ranger is walking the perimeter. Two visitors are on the beach: one wearing red trunks, one wearing blue. At 2:15 PM, the current unexpectedly strengthens. At 2:20 PM, the swimmer goes under. At 2:25 PM, the window of opportunity for rescue closes. At 2:30 PM, the swimmer is declared dead."

  Now the timeline includes the presence of the lifeguard, park ranger, and two visitors. The duty profiles then assign the role to the student and specify the obligations.

  With this timeline, when we read a statement that says "the death was caused by the lifeguard's failure to act rather than the current", the class knows there was a lifeguard. But they don't know the duty profile? They know the timeline says there was a lifeguard on duty, so they might assume the lifeguard had a duty. Similarly for the park ranger? The timeline says the park ranger is walking the perimeter, but doesn't specify duties. So the class might not know what the park ranger's duties are. This might cause variation in voting.

  We want the voting to reflect that the class endorses the statement when the duty is present and not when it's absent. But without knowing the duty profile, the class only has the timeline and the statement. The timeline does not specify duties. So the class might use their own background assumptions about duties (e.g., lifeguards have a duty to save, park rangers might not, visitors don't). This is acceptable because we are trying to show that causal judgments track what people are required to do. The background assumptions about duties are part of the normative context.

  Therefore, we will proceed with the timeline including the roles and the scoring as planned: read the statement and the timeline, then vote. The duty profile is not read, so the class is using their own norms to judge.

  Second Round (Ledger) - 15 minutes:

  The group must list every condition whose absence was necessary for the death. The rule: no two entries may be of the same type. We are looking for necessary conditions: if this had happened, the death would not have occurred. But we are focusing on omissions, so we want negative conditions (the non-occurrence of something). We want them to list as many as they can, but with the constraint that they must be of different types. For example, "the lifeguard not jumping in" and "the park ranger not jumping in" are two different types. But "the lifeguard not jumping in at 2:21" and "the lifeguard not jumping in at 2:22" are the same type (the lifeguard's omission) and should be one entry. We want them to see that the list is potentially infinite (e.g., at each second, the lifeguard didn't jump in) but we are grouping by type. We also want them to see that there are many necessary conditions that are omissions.

  We start with the whole class together. The instructor writes on the board: "List of conditions whose not happening was necessary for the death:"

  Rules:
  - Any student can call out an entry.
  - The instructor writes it on the board only if it is of a type not already listed.
  - The round ends when the group declares the list complete or after 8 minutes (whichever comes first). We will let them struggle.

  Third Round (Contrast Sensitivity) - 15 minutes:

  We fix the duty profile and the timeline. We choose one profile (e.g., the lifeguard) and use that for the whole class. Now we give six pre-written contrast sentences. We ask the class to vote on each one: endorse or reject.

  The six sentences (each is a causal statement of the form "The death was caused by X rather than Y"):

  1. The death was caused by the lifeguard's failure to act rather than the park ranger's failure to act.
  2. The death was caused by the lifeguard's failure to act rather than the swimmer's decision to swim.
  3. The death was caused by the lifeguard's failure to act rather than the unexpected current.
  4. The death was caused by the lifeguard's failure to act rather than the absence of a better warning system.
  5. The death was caused by the lifeguard's failure to act rather than the fact that no one else jumped in.
  6. The death was caused by the lifeguard's failure to act rather than the closure of the window of opportunity at 2:25.

  We expect some of these to be endorsed and some to be rejected. For example, (1) might be rejected because the park ranger wasn't responsible, (2) might be accepted, (3) might be accepted, (4) might be rejected, (5) might be rejected (because the lifeguard was the one responsible, not others), and (6) might be accepted or rejected.

  We then tally the votes and see that the same omission (the lifeguard's failure) is seen as causing the death in some contrasts but not others.

  Debrief - 25 minutes:

  We now explain the concepts. We map the rounds to positions:

  - Round 1 (Inquest): Shows that our causal judgments about omissions depend on the obligations we think people have. The same physical facts (timeline) lead to different causal statements because of the duties. The scoring rule revealed that some statements were endorsed and some were not, even though the underlying counterfactual dependencies (e.g., if the lifeguard had acted, the swimmer would have lived) are the same.

  - Round 2 (Ledger): Shows that there are infinitely many necessary conditions for the death (if we break time into moments) and that omissions are ubiquitous. But we don't count them all as causes; we select only some. This is causal selection.

  - Round 3 (Contrast): Shows that even for a fixed omission, whether we say it caused the death depends on the contrast we are considering. We are contrasting the actual world with a particular alternative.

  We then connect to the doing/allowing asymmetry: we hold people more responsible for what they do than for what they allow, and this asymmetry shows up in our causal judgments.

  What might go wrong:

  - In the first round, students might not write statements that clearly reflect the duty profile. They might write very similar statements. We can mitigate by giving examples in the instructions? But we don't want to prime them. Alternatively, we can accept that and then in the debrief point out that even if the statements are similar, the voting might vary.

  - In the scoring, when we read the statements, the class might be confused about what they are voting on. We must be clear: "Given the timeline I read, and without any other context, do you agree with this statement?"

  - The ledger round might be slow. Students might not come up with many entries. We can prompt by asking: "What are all the things that, if they had happened, would have prevented the death?" and then they must phrase it as an absence. For example: "If the lifeguard had jumped in, the death would not have occurred" becomes "the lifeguard not jumping in". But then we want types: the lifeguard's omission is one type. Then we can have: the park ranger's omission, the visitor's omission, the current not weakening, the swimmer not being a stronger swimmer, the window of opportunity not closing, etc. But note: the current not weakening is an omission? Not really. We are focusing on omissions by agents. We should be open to any necessary condition. The point is that the list is long and we can't list them all. We might get the students to see that for every second that passed without someone jumping in, that was a necessary condition. But we are grouping by type, so we don't list each second. However, they might not think of that. We might have to let them struggle and then in the debrief point out that the list could be infinite.

  - In the third round, the pre-written sentences might not be clear. We must test them to ensure some are endorsed and some are not.

  - Time: We have 90 minutes. We must stick to the schedule.

  Minute-by-minute plan (90 minutes total):

  0-5 minutes: Introduction and content note. 
  - Content note: "Today's activity involves a scenario about a drowning. If this topic is distressing, you are welcome to step out or remain in the room without participating. Let me know if you need to leave."
  - Explain the structure: three rounds, no prior lecture. 
  - Distribute the timeline and explain that it is the same for everyone.

  5-10 minutes: Distribute the duty profiles for round one. Each quartet gets one profile (all four in the group get the same one). Students read the timeline and their profile.

  10-15 minutes: Each student writes a causal statement on a card: "The death was caused by X rather than Y." They do this privately.

  15-17 minutes: Collect the first set of cards.

  17-19 minutes: Redistribute the duty profiles randomly. Each student gets a new profile.

  19-24 minutes: Each student writes a new causal statement for the new profile on a fresh card.

  24-25 minutes: Collect the second set of cards.

  25-32 minutes: Scoring. Shuffle all cards. Read each card: "Statement: [read]. Given the timeline, would you endorse this statement?" Vote by show of hands. If majority, the writer gets a point. Keep a tally. (We have 16 students, two cards each, so 32 cards. We can't read all in 7 minutes. We must sample. Let's read 10-12 cards at most. We can read a random sample. Alternatively, we can do it quickly: one card every 15 seconds? 32 cards would take 8 minutes without discussion. But we don't have time. We'll read 10-12 cards, chosen randomly, and score those. The prize is trivial (e.g., a piece of candy). We'll say: "We'll read a sample of the cards due to time.") Alternatively, we can have the students hand in their cards and then we pick 10 at random to read. We'll adjust: 7 minutes for 10-12 cards.

  32-40 minutes: Round two (Ledger). Explain the task: "We are going to list every condition whose not happening was necessary for the death. That is, something that didn't happen such that if it had happened, the death would not have occurred. We cannot list two of the same type. For example, if we list 'the lifeguard not jumping in', we cannot also list 'the lifeguard not jumping in at 2:21' because that's the same type. We are looking for distinct types." Then open the floor. Write entries on the board. Let them go for 8 minutes. Then stop even if they haven't declared the list complete.

  40-55 minutes: Round three (Contrast). We fix the case: "We are all going to consider the lifeguard's situation. Remember the timeline and the lifeguard's duty." Then we present the six pre-written contrast sentences one by one. For each, the class votes by show of hands: endorse or reject. We tally the results.

  55-80 minutes: Debrief. We explain the concepts and connect the rounds to the philosophical points.

  80-90 minutes: Conclusion and transition to the next class.

  Debrief (25 minutes):

  Start by noting what happened in each round.

  Round 1: We saw that when we changed the duty profile, the causal statements changed. Even though the physical events were the same, what people wrote as the cause depended on the obligations. And when we voted, we saw that some statements were endorsed and some were not, even without knowing the duty profile, because we have shared norms about who should have acted. This shows that our causal judgments about omissions are sensitive to normative expectations.

  Round 2: We tried to list all the necessary conditions (absences) for the death. We saw that the list kept growing and we couldn't finish. There are countless things that, if they had happened, would have prevented the death. But we don't count all of them as causes. We select only a few. How do we select? We use norms and contrasts. For example, we focus on the lifeguard's omission because of the duty, and we ignore the visitor's omission or the fact that the current didn't weaken.

  Round 3: We saw that even for the same omission (the lifeguard's failure), whether we say it caused the death depends on what we are contrasting it with. For example, we might accept that the lifeguard's failure caused the death rather than the swimmer's decision, but not rather than the park ranger's failure. This is contrast-sensitivity.

  Finally, we note that we naturally feel a difference between doing harm and allowing harm. We hold people more responsible for what they do than for what they allow. This asymmetry is reflected in our causal judgments: we are more likely to say that an omission caused harm if the person had a duty to act.

  What the activity cannot reproduce: The activity shows the sensitivity to norms and contrasts, but it doesn't prove that the counterfactual facts are held fixed. We have to tell them that the counterfactual dependencies (e.g., if the lifeguard had acted, the swimmer would have been saved) are the same across the cases. We have to supply that in the debrief.

  Frank account of what will go wrong:

  - Round 1: Some students may write statements that are too vague or not in the required form. We can remind them of the form before they write. Also, the scoring may take longer than expected. We will sample the cards to save time.

  - Round 2: Students may be stuck and not come up with many entries. We can gently prompt: "Think of all the people who could have acted." or "Think of natural events that could have been different." But we must not over-prompt. Let them struggle.

  - Round 3: Some of the pre-written sentences might be confusing. We should test them beforehand. Also, the voting might be unanimous on some, which is okay.

  - Time: We may run over in any round. We must be strict with time.

  Now, the continuous prose version:

  Dear colleague,

  Let me describe the activity for the ninety-minute session. We'll begin with a content note: inform the class that the scenario involves a drowning and that any student who finds this distressing may step out or remain without participating. Then, without any framing lecture, distribute the timeline which reads: "At 2:00 PM, a swimmer enters the lake. A lifeguard is on duty in the chair. A park ranger is walking the perimeter. Two visitors are on the beach: one wearing red trunks, one wearing blue. At 2:15 PM, the current unexpectedly strengthens. At 2:20 PM, the swimmer goes under. At 2:25 PM, the window of opportunity for rescue closes. At 2:30 PM, the swimmer is declared dead." 

  For the first round, the inquest, divide the sixteen students into four quartets. Assign each quartet one of four duty profiles. Profile one: you are the lifeguard, required to monitor and assist, sitting in the chair, saw the swimmer go under, did not intervene. Profile two: you are the park ranger, duties include visitor safety but water safety is explicitly the lifeguard's responsibility, walking by, saw, did not intervene. Profile three: you are a visitor, no official responsibilities, strong swimmer, saw, did not intervene. Profile four: you are a visitor, no official responsibilities but a crowd shouted at you to help because of your red trunks, strong swimmer, saw, did not intervene. Each student writes on a card a single sentence: "The death was caused by X rather than Y." Collect these cards. Then redistribute the duty profiles randomly so each student gets a new one. They write a second sentence on a new card. Collect. For scoring, shuffle all cards and read a random sample of about ten aloud, stating only the timeline and the sentence. For each, the class votes by show of hands; if a majority endorses it, the writer gets a point. The prize is a small candy. 

  The second round, the ledger, is a whole-class activity. The task is to list on the board every condition whose not happening was necessary for the death, with no two entries of the same type. For instance, the lifeguard not jumping in is one type. The round runs for eight minutes, and we stop even if the list is incomplete.

  The third round fixes the lifeguard profile and presents six pre-written contrast sentences: 
  1. The death was caused by the lifeguard's failure to act rather than the park ranger's failure to act.
  2. The death was caused by the lifeguard's failure to act rather than the swimmer's decision to swim.
  3. The death was caused by the lifeguard's failure to act rather than the unexpected current.
  4. The death was caused by the lifeguard's failure to act rather than the absence of a better warning system.
  5. The death was caused by the lifeguard's failure to act rather than the fact that no one else jumped in.
  6. The death was caused by the lifeguard's failure to act rather than the closure of the window of opportunity at 2:25.
  For each, the class votes endorse or reject.

  The debrief maps the rounds: round one shows that causal verdicts about omissions depend on what the agent was required to do; round two shows that necessary conditions are countless but we select only some; round three shows that the same omission can be seen as a cause or not depending on the contrast. The activity cannot reproduce the fixed counterfactual dependencies; you will have to state explicitly that the underlying counterfactuals (e.g., if the lifeguard had acted, the swimmer would have lived) are the same in all cases.

  Predictably, in round one, some statements will be too vague, and the scoring may run long; sample the cards. In round two, students may struggle to generate entries; resist over-prompting. In round three, some sentences may not work as expected; adjust in future iterations.

  This design should meet your goals, including the mechanics and constraints.

  Yours sincerely,
  [Your Name]
answer: |-
  Begin by placing a content note at the entrance and stating it verbally as students settle: "Today’s activity involves a fictional drowning scenario. If this topic is distressing, you are welcome to remain in the room without participating—just let me know, and I’ll ensure you aren’t called on. We can also arrange a brief alternative task if needed." Once seated, distribute identical slips with the timeline: "2:00 PM: Swimmer enters lake. 2:15 PM: Current strengthens unexpectedly. 2:20 PM: Swimmer submerges. 2:25 PM: Rescue window closes. 2:30 PM: Death confirmed." No further context is given. Divide the sixteen students into four quartets. Hand each quartet one of four duty profiles, ensuring all four students in a group receive the same profile. Profile One: "You are the on-duty lifeguard. Your employment contract requires intervention in emergencies. You watched from your chair, did nothing." Profile Two: "You are a park ranger. Your duties exclude water rescue (lifeguard’s role), but include general safety oversight. You observed while walking nearby, did nothing." Profile Three: "You are a visitor, a strong swimmer with no professional obligations. You saw the struggle, did nothing." Profile Four: "You are a visitor, a strong swimmer with no obligations, but a crowd mistakenly shouted at you to help (you wore a red shirt resembling a lifeguard’s). You saw, did nothing." Ask each student to privately write on a blank card: "The death was caused by [X] rather than [Y]." Collect all cards. Redistribute profiles randomly so no one keeps their original one, and repeat the writing with fresh cards. Collect these too. For scoring, shuffle all cards and read each aloud, prefacing only with: "Given the timeline, consider this statement." After each, take a public vote—thumbs up/down—and award a point only if a majority endorses it. The prize is a token (e.g., a sticker). This takes roughly twenty-five minutes.

  For the second round, the ledger, reconvene as one group and announce: "List every specific thing whose absence was necessary for the death—meaning if it had occurred, the death would not have happened. No two entries can share a type. For example, 'the lifeguard not jumping in' and 'the visitor not jumping in' are distinct types, but 'the lifeguard not jumping in at 2:21' and 'at 2:22' are the same type." Write proposals on the board as students call them out, rejecting duplicates. Intervene only to clarify the type rule. Let silence hang; do not rescue. Halt at eight minutes even if the list feels incomplete. This takes ten minutes total.

  In the third round, announce: "Fix the lifeguard’s profile and timeline. We’ll test variations of the statement form." Read six pre-written sentences aloud, pausing for a vote after each: (1) "The death was caused by the lifeguard’s failure to act rather than the park ranger’s failure to act"; (2) "...rather than the swimmer entering the water"; (3) "...rather than the current strengthening"; (4) "...rather than the absence of safety signs"; (5) "...rather than the crowd’s distraction"; (6) "...rather than the rescue window closing at 2:25." Tally votes visibly. This takes fifteen minutes.

  Debrief for twenty-five minutes: Start by noting how the first round made them complicit in shifting verdicts—same timeline, same physical dependencies (if X had acted, death avoided), yet their causal statements changed with redistributed duties. They felt the weight of obligation: the lifeguard’s contractual duty made "failure to act" salient; the crowd’s misplaced expectation in Profile Four might have elicited defensiveness ("rather than the swimmer’s recklessness"). The scoring rule exposed this: identical contrasts ("lifeguard not acting" vs. "current") gained or lost endorsement based on unspoken norms, though the counterfactual backbone never budged. The ledger round then laid bare how causes proliferate when we list absences—"no one throwing a rope," "no sudden current drop," "no dolphin intervention"—until types blur into absurdity. They hit a wall because causation by omission is vacuously infinite without selection. Finally, the contrast round forced inconsistency: they likely accepted (2) or (3) but rejected (1) or (4), proving that "what caused it" depends on the alternative implied, even with fixed facts and obligations. Here, the doing/allowing asymmetry surfaced—they felt the lifeguard’s allowing harm as less agential than a push, yet still pivotal against certain backdrops. All this, without moral disclosure; duties were assigned externally.

  Predictably, the first round’s writing will frustrate—some students jam duties into X/Y awkwardly (e.g., "the death was caused by me having no duty rather than the current"), muddying the scoring. Handle this by accepting all entries; the voting chaos itself reveals how norms distort language. The ledger will stall early; students overlook omissions like "no wind change" or "no medical aid," fixating on people. Let them flounder—the point is the aborted effort. The contrast round may split votes unevenly; if a sentence draws near-unanimity, stress the outliers to show disagreement is inherent. The irreproducible element? The activity can’t simulate the counterfactual invariance—you must verbally underscore that in every profile, the swimmer lives if saved, dies if not; the causal dependencies are identically fixed, only our descriptions waver. This gap between reality and judgment is what they must carry forward. Close by noting how this scaffolds future debates on why we hold some omissions culpable and others not, but withhold readings until the handout circulates. Total: ninety minutes.
