answer: |-
  ## HISTORICAL EVALUATION COMPLIANCE HANDBOOK (INTERNAL WORKING GROUP EDITION v.4.1)

  **1. Preamble & Authority**  
  This Handbook establishes procedures for applying evaluative language to past actors, practices, and institutions (hereafter "Historical Subjects"), pursuant to Resolution 23-7 of the Departmental Assembly and the mandate of the Working Group on Historical Standards (WGHS). The WGHS, acting under delegated authority and guided by current best practice in the field, is the sole arbiter of permissible evaluative language within departmental scholarship, teaching, and formal discourse. Compliance is mandatory for all faculty, graduate students, and affiliated researchers.

  **2. Core Principle: The Anachronism Prohibition**  
  Evaluative judgments applied to Historical Subjects must not derive primarily from norms, values, or frameworks demonstrably alien to the period under consideration. This constitutes *Anachronistic Moral Predication* (AMP), a Category 1 Scholarly Infraction. The prohibition safeguards historical integrity by recognizing the *temporal specificity of ethical frameworks*.

  **3. Definitions**  
  3.1. **Evaluative Language:** Any adjective, noun, verb, or adverbial phrase implying moral, ethical, or political condemnation or approbation beyond mere descriptive classification (e.g., "cruel," "exploitative," "progressive," "enlightened," "barbaric," "unjust").  
  3.2. **Moral Predicate:** The specific evaluative term(s) applied to a Historical Subject (e.g., "slavery was *morally reprehensible*").  
  3.3. **Period of Relevance (PoR):** The specific chronological and geographical context of the Historical Subject under evaluation.  
  3.4. **Standards Provenance (SP):** The demonstrable origin within the PoR of the normative standard used to justify the Moral Predicate. SP must specify: Class, Region, Institution, Confession, Gender, and/or other salient identity vectors.

  **4. Pre-Application Procedure: Form HES-1 ("Moral Predicate Application")**  
  Prior to employing any evaluative language exceeding Tier 1 (see Appendix A), Form HES-1 must be submitted to the WGHS Secretariat via the online portal (https://wgshs-portal.univ/dept/histstd). Key sections:
  *   **4.1.** Historical Subject & PoR (with citation of definitive sources establishing context).
  *   **4.2.** Proposed Moral Predicate(s) (List verbatim).
  *   **4.3.** **Standards Provenance Justification (SPJ):**  
      *   4.3.1. Identify the specific normative standard(s) from the PoR supporting the predicate.
      *   4.3.2. Provide primary source evidence demonstrating the *existence* and *application* of this standard within the PoR (e.g., contemporaneous philosophical texts, legal codes, religious decrees, protest literature, personal testimonies).
      *   4.3.3. **Crucially:** Specify the SP vector(s) (e.g., "Dissenting Puritan theologians in 1650s Massachusetts Bay Colony"; "Enslaved Igbo women in early 19th-century Virginia"; "Guild regulations in 14th-century Ghent"). *Applicant must demonstrate the standard was held by identifiable actors/groups within the PoR, not merely conceivable.*
      *   4.3.4. Explain why the Historical Subject demonstrably *violated* this specific, contemporaneous standard.
  *   **4.4.** Anachronism Risk Mitigation Plan: Briefly outline steps taken to ensure the predicate isn't primarily informed by later developments.

  **5. WGHS Review & Criteria**  
  5.1. Applications undergo Initial Review by a rotating Subcommittee.  
  5.2. Approval hinges on:  
      *   Completeness and accuracy of SPJ (Section 4.3).
      *   Demonstrable link between cited SP evidence and the Proposed Moral Predicate.
      *   Credible mitigation of AMP risk.
  5.3. **The Reflexivity Clause:** The WGHS evaluates SPJ based on *current best historical scholarship* concerning normative contestation within the specified PoR. The WGHS acknowledges its own judgments are temporally situated but asserts this is necessary for methodological coherence.  
  5.4. **Future-Proofing Provision:** Approved Moral Predicates are contingent upon their continued validity under the standards of *all subsequent periods*, including the indefinite future. While the WGHS cannot predict future standards, this clause formally recognizes the provisional nature of *all* historical evaluation, including its own rulings. Applicants accept that future scholarship may retrospectively classify their approved predicate as AMP, constituting a Category 2 Scholarly Observation (non-disciplinary, but noted in departmental record).

  **6. Case Precedent: In re: Colonial Tax Policy (Ref: WGHS-APP-2023-004)**  
  *Applicant sought predicate "economically exploitative" for 18th-century colonial sugar tariffs.*  
  *   **SPJ Cited:** Pamphlets by colonial merchants in Boston and London, petitions from small planters in Jamaica (Class: Mercantile/Planter; Region: Colonies/Metropole).
  *   **Subcommittee Ruling:** Approved. Evidence demonstrated contemporaneous actors within the PoR (specified class/region) explicitly used frameworks of economic fairness and "just commerce" to condemn the tariffs as exploitative. AMP risk deemed low; predicate reflected internal critique.
  *   **Note:** Dissenting WGHS member argued SPJ insufficiently addressed standards of enslaved laborers producing sugar (SP vector: Enslaved; Region: Plantations). Majority held applicant met burden for specified vectors.

  **7. Hardship Exemption (Section 12-B)**  
  Recognizing that strict SPJ requirements may cause undue *moral distress* or *pedagogical paralysis* when confronting egregious historical acts, an exemption exists.  
  7.1. Applicant must file Form HES-1X, detailing:  
      *   Specific nature of hardship (e.g., teaching introductory survey, discussing traumatic events).
      *   Why rigorous SPJ is impracticable or counterproductive *in this specific instance*.
      *   Alternative, WGHS-pre-approved Tier 1 language proposed (e.g., "widely condemned today," "problematic by modern standards").
  7.2. Requires attestation of hardship by Department Chair or Course Director.  
  7.3. Exemption grants limited, one-time use of Tier 2 predicate (see Appendix A) without full SPJ, subject to WGHS Chair's approval. **Caution:** Overuse invalidates future exemption claims. *(Commentary: This functionally reinstates "present standards" through the back door, justified by operational necessity.)*

  **8. Appeals Procedure**  
  8.1. Denials of Form HES-1 or HES-1X may be appealed within 14 days.  
  8.2. Grounds for Appeal:  
      *   Procedural error.
      *   Newly discovered SP evidence.
      *   **Conceptual Challenge:** Claim that the WGHS misapplied the AMP prohibition or Reflexivity Clause in principle.  
  8.3. Appeals Panel consists of the full WGHS plus one external philosopher of history (rotating).  
  8.4. **Appeals Paradox Provision:** Appeals based on Conceptual Challenge must themselves employ evaluative language regarding the WGHS's standards. Appellants are *strongly encouraged* (but not required) to file a *provisional* Form HES-1 evaluating the WGHS's ruling as "methodologically inconsistent" or "unduly restrictive," specifying the SP as "current best practice in historiography and moral philosophy." *(Commentary: This forces engagement with the handbook's own logical structure.)*

  **9. Compliance & Enforcement**  
  Non-compliant use of evaluative language is subject to progressive disciplinary action per Faculty Code Section VII, beginning with Mandatory Remedial Temporal Calibration (a four-hour seminar).

  ---

  **APPENDIX A: Tiered Lexicon of Evaluative Terms (Anachronism Risk Assessment)**  

  | Tier | Risk Level     | Example Terms                                  | SPJ Requirement               | Notes                                                                 |
  | :--- | :------------- | :--------------------------------------------- | :---------------------------- | :-------------------------------------------------------------------- |
  | 1    | Negligible     | Problematic, complex, controversial, significant | None                          | Descriptive or broadly agnostic terms. "Modern standards" comparison permitted *only* with "today" modifier. |
  | 2    | Moderate       | Unjust, oppressive, cruel, exploitative        | Streamlined SPJ (HES-1X)      | Requires identification of *broad* contemporaneous dissent. Hardship Exemption applicable. |
  | 3    | High           | Barbaric, evil, genocidal, morally bankrupt    | Full SPJ (Form HES-1)         | Requires *specific, well-documented* SP vectors and evidence of *explicit* contemporaneous condemnation matching intensity. |
  | 4    | Prohibited     | Always wrong, universally condemnable          | N/A (Presumptive AMP)         | Assumes transhistorical moral standard; violates Anachronism Prohibition axiomatically. |

  **APPENDIX B: The Evaluative Recursion Cascade (Informational Note)**  
  The WGHS acknowledges the theoretical infinite regress implied by the Reflexivity Clause (5.3) and Future-Proofing Provision (5.4): Our standards are contemporary; future historians will judge ours by their future standards; *ad infinitum*. The WGHS resolves this practically by asserting its *procedural authority* within the *current* scholarly moment. We regulate *present* speech about the past. Future regulation of our present speech is a matter for *their* committees, operating under their own inevitably temporal and contestable standards. This is not a *solution* to the philosophical regress, but its *bureaucratic management*.

