prompt: |-
  I teach political philosophy, and my co-instructor in our grad democratic-theory seminar and I have this long-running game: we throw out cases and she rules on who gets to be part of the demos for the decision — who should get a say. She's been eerily consistent, and next week I want to try to call her shot before she makes it.

  Her rulings so far, roughly in order. Long-term residents of the city who never naturalised, on a city rent-control referrendum — in, they vote. People who own rental buildings in the city but live two towns over, on a city property-tax hike — in. People who commute in and work here every day, on the city's new minimum-wage ordinance — in. Eight-year-olds, on any of the above — out. Tourists just passing through — out. Foreign nationals with no connection to the city at all — out. Citizens of the country who emigrated years ago and have no ties left to the city, on a city measure — out.

  Now next week's case. The city is voting on a big upriver water diversion: it keeps the city's taps on, but it dries up the farms downstream, and those farms are across the border, in the next country. The farmers don't vote here, city law doesn't bind them, nobody consulted them, but it will wreck them — and the damage is on the same order as the benefit to the city.

  So does she let the farmers in? I care less about the answer than the machinery. What rule, or rules, is she running that fit all seven of her rulings — and what other rules fit them just as well? What does each of those predict about the farmers? Which do you think she's actually running, and why? And what single further case could I put to her that would split the surviving rules apart?

  Skip the reading list, I know the literature — just the reasoning.
reasoning: |-
  Okay, the user is a political philosophy professor running a thought experiment with a co-instructor about defining the demos—who gets a say in decisions. They've provided seven rulings and want to predict the co-instructor's decision on a new case involving downstream farmers affected by a city's water diversion. The user wants to understand the underlying rules behind her consistent rulings and find a case to test competing theories.

  First, I need to analyze the existing rulings. The co-instructor includes long-term residents (even non-citizens), non-resident property owners, and commuters. She excludes eight-year-olds, tourists, foreign nationals without connections, and emigrated citizens. So, presence or impact isn't sufficient alone. There's a pattern of requiring some form of membership or stake beyond mere effect.

  Looking deeper, the included groups all have recurring, structured involvement: residents contribute daily life, property owners have economic ties, commuters participate economically. The excluded groups lack this ongoing stake—children aren't full participants, tourists are transient, distant citizens have severed ties. This suggests a "stake through participation" rule. 

  For the farmers, they're deeply affected but outside the political community. If her rule requires institutional membership, they're out. If it's about subjection to effects, they should be in. Her past exclusions of affected-but-unconnected parties (like tourists) hint she prioritizes membership over impact. 

  The user also wants to distinguish between plausible rules. Two main candidates: "Subject to Authority" (must be governed by the decision) vs. "Stake Through Participation" (ongoing structured involvement). Both fit most cases, but the commuter case is key—commuters don't make laws but are included, suggesting participation trumps authority. For the farmers, both rules likely exclude them since they're outside the jurisdiction and lack participation ties.

  To split these rules, I propose a case with non-resident workers subject to local workplace laws. "Subject to Authority" would include them (since laws bind them), while "Stake Through Participation" might exclude them if they lack broader civic ties. Her ruling here would reveal which principle dominates. 

  I think she's using Stake Through Participation because it explains the commuter inclusion (economic participation) and exclusions like tourists (no sustained ties). The farmers' case will likely be "out" under this rule. The user's deeper need seems to be decoding her philosophical framework, possibly to engage in a meta-discussion about demos boundaries. The proposed test case could clarify if territorial authority or relational participation underpins her logic.
answer: |-
  Based on the pattern of rulings, your co-instructor is operating on a principle that **explicitly rejects mere affectedness (or "all-subjected") as sufficient for inclusion in the demos**, while also rejecting purely formal citizenship or residency as strictly necessary. Instead, she seems to prioritize **ongoing, structured, and reciprocal participation within a shared political-economic community.**

  Here's the breakdown:

  1.  **Core Principle: Stake Through Participation (StP)**
      *   **Inclusion Requires:** A demonstrable, enduring, and reciprocal stake arising from active participation in the core social, economic, and political life of the community *subject to the decision*. This stake is created through roles like residency, economic activity (ownership/labor), and civic integration over time.
      *   **Exclusion Applies:** To those who lack this structured participation (children, tourists, disconnected emigrants) *even if affected*, and to those whose connection is purely external or non-reciprocal (foreign nationals).
      *   **Why StP Fits All Cases:**
          *   **Long-term Residents (In):** Deep, ongoing participation in the local community life & economy (renters), creating a reciprocal stake.
          *   **Non-Resident Property Owners (In):** Significant, structured economic participation (ownership/investment) in the city's core assets, creating a reciprocal stake tied to the decision (taxes).
          *   **Commuters (In):** Structured daily economic participation (labor) within the city, creating a reciprocal stake in its labor laws.
          *   **8-Year-Olds (Out):** Lack the capacity for full civic/economic participation; their stake is mediated through guardians/future status.
          *   **Tourists (Out):** Transient, no structured participation creating an enduring reciprocal stake.
          *   **Foreign Nationals (Out):** No connection = no participation = no reciprocal stake.
          *   **Emigrated Citizens (Out):** Severed all ties = ended participation = no current reciprocal stake.

  2.  **Competing Principle: Subject to Authority (StA)**
      *   **Inclusion Requires:** Being subject to the binding authority of the decision-making body's laws/coercion.
      *   **Why StA *Seems* Plausible (but doesn't fully fit):**
          *   Fits most inclusions (residents, owners, commuters are subject to city laws).
          *   Fits most exclusions (tourists, foreigners, emigrants not subject; children subject but excluded for other reasons - capacity?).
      *   **Where StA Fails:** **Commuters.** A strict StA principle might *exclude* commuters, as the city's minimum wage ordinance likely *binds employers within the city*, not the employees who live elsewhere. The employee is *affected* by the law, but arguably not directly *subject* to its *authority* (they don't pay fines to the city for violating it, their employer does). Her ruling *includes* them. StP better explains this - their daily economic participation creates the stake. StA struggles here.

  3.  **Predictions for the Farmers:**
      *   **Stake Through Participation (StP): Predicts OUT.** The farmers lack any form of structured participation within the *city's* political-economic community. They reside, work, and are governed entirely within a different national and local jurisdiction. There is no reciprocity or ongoing integration with the city. While catastrophically affected, the *source* of that effect is external to any participation *in* the city.
      *   **Subject to Authority (StA): Predicts OUT.** The city's law does not bind the farmers. They are not subject to its jurisdiction or enforcement mechanisms. The harm is an *externality*, not an exercise of authority *over them*.
      *   *(Note: A pure "All-Affected" principle would predict IN, but her rulings consistently reject this).*

  4.  **Which Rule is She Running?**
      *   **I strongly believe she is running Stake Through Participation (StP).**
      *   **Why:** The **commuter case** is the decisive clue. Including workers who commute in for the minimum wage vote makes perfect sense under StP (daily economic participation creates a stake) but is problematic under a strict StA (they aren't the primary subjects of the ordinance's authority). Her other rulings align seamlessly with StP's focus on enduring, structured, reciprocal relationships within the community boundary relevant to the decision. StA is a close contender, but the commuter ruling tips the scales decisively towards StP.

  5.  **The Crucial Case to Split StP and StA:**
      *   **Present this case:** "The city passes an ordinance regulating workplace safety standards *only* for businesses physically located within city limits. The ordinance imposes significant new costs and operational requirements on businesses. Should non-resident employees who work full-time *in* those city-based businesses get a vote on the ordinance?"
      *   **Why it Splits Them:**
          *   **Stake Through Participation (StP):** Likely **IN.** These employees have deep, structured, daily *economic participation* within the core activity of the city (its workplaces). Their health, safety, and working conditions are directly shaped by the ordinance. This creates a strong reciprocal stake.
          *   **Subject to Authority (StA):** Likely **OUT.** While heavily affected, the *authority* of the ordinance binds their *employer* (the business entity located in the city). The employees themselves are not the direct subjects of the law's coercive power (e.g., they don't pay fines to the city for violations; their employer does). The law regulates the workplace environment provided *to* them, but doesn't impose obligations *on them* as individuals enforceable by the city. StA focuses on who is bound/coerced, not who is affected within the jurisdiction.
      *   **Her likely ruling under StP:** IN. This reinforces the commuter/min-wage logic. A ruling of OUT would suggest she might actually be applying a stricter StA principle than initially apparent, or perhaps a modified StA that includes those whose *working conditions* are directly regulated, even if the legal liability falls on the employer. However, based on the min-wage commuter inclusion, IN seems consistent with her pattern.

  **Conclusion:** Your co-instructor is most likely applying a "Stake Through Participation" principle. This predicts an **OUT** ruling for the downstream farmers. The key differentiator from "Subject to Authority" is her inclusion of commuters affected by labor laws. To definitively test this, pose the workplace safety ordinance case targeting non-resident employees. If she includes them, StP is confirmed. If she excludes them, it forces a re-evaluation towards a stricter StA or a nuanced hybrid. Good luck calling her shot!
