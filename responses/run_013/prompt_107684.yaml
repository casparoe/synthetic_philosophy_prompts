  The session must dismantle three misconceptions: 1) that empirical studies (like Project Prakash) solved Molyneux's question, 2) that "shape" is a unified concept across senses, and 3) that SSDs teach "what things look like." Each needs a specific counterpoint in the flow. For example, early in Component 2, I should clarify that SSD success doesn't imply visual understanding—it's a new coding language. 

  For sequencing, the logic chain should be: establish SSD mechanics → distinguish competence from modality → isolate the critical case (SSD-to-vision transition) → reveal the core philosophical puzzle. Each step builds on the last: you can't discuss whether shape transfers to vision (Component 4) without first showing that SSD mastery isn't visual (Component 3).

  The anchor case—Clara—must lack any prior visual exposure but have high SSD expertise. This forces the question: is her shape knowledge tied to soundscapes or abstracted? If she recognizes a cube visually because it "sounds cubey," that implies modality-specific encoding. But if she grasps cubeness directly, it supports amodal concepts. 

  The closing question shouldn't be "Would Clara succeed?" but "What would success or failure imply about her concepts?" This exposes if they see the deeper issue: whether cognition is inherently multimodal. 

  Finally, I'll explicitly refuse to resolve the empiricism/nativism debate. This session is about framing the problem, not solving centuries-old disputes. Students should leave unsettled—that's the point.
answer: |-
  Here’s a structured session plan designed to pivot from the cataract-surgery paradigm to your contemporary SSD case, while systematically confronting misconceptions and deepening conceptual engagement. Components build sequentially to reframe Molyneux’s problem as a question about **representational format and abstraction**, not sensory restoration.

  ---

  ### **Session Structure: Logic & Dependencies**  
  *(Total: 90 mins)*  

  1.  **Component 1: SSD Mechanics Primer**  
      *(10 mins; Foundation)*  
      **Content:** Briefly explain how the SSD works (e.g., vOICe: visual scenes → soundscapes via grayscale-to-pitch/frequency mapping). Emphasize that users learn *associative rules* (e.g., "high-pitch cluster = tall object," "rapid left-to-right pitch sweep = horizontal edge").  
      **Why now?** Establishes that SSD proficiency relies on *learned symbolic translation*, not direct visual experience. Sets the stage for separating *functional object recognition* from *modality-specific representation*.  

  2.  **Component 2: Competence ≠ Modality-Specific Knowledge**  
      *(15 mins; Depends on Component 1)*  
      **Content:** Present data: SSD users navigate, identify objects, even judge rough shape/size. Pose: *"Does proficiency imply she knows 'what things look like'?"*  
      **Key Intervention:** Head off **Misconception 3** (*"Device taught her what things look like"*). Clarify: SSD encodes visual info into *non-visual symbols*. Her knowledge is of *soundscape patterns correlated with object properties*, not visual qualia or geometry.  
      **Why now?** Prevents conflating SSD success with visual understanding. Forces recognition that "knowing shape via SSD" ≠ "knowing shape visually."  

  3.  **Component 3: The Critical Case – "Clara"**  
      *(5 mins intro; Depends on Component 2)*  
      **Introduce Clara:** Adult, congenital blindness, SSD expert (10+ years). Gains sight via gene therapy/neuroprosthesis. After basic visual acuity stabilizes (weeks/months), we test her.  
      **Crucial Features Clara MUST Have/Lack:**  
      - **MUST HAVE:** High SSD proficiency (object/shape ID), no visual experience *ever* (not even light perception).  
      - **MUST LACK:** Cross-modal training *during sight recovery* (no "this sound is what that looks like").  
      **Why Clara?** SSD use provides a *controlled, learned analog* to haptics in Molyneux, but avoids haptic-vision confounds (e.g., proprioception, material texture). It’s a *trained symbolic system*, isolating the question of representational transfer.  

  4.  **Component 4: Reframing Molyneux’s Question**  
      *(20 mins; Depends on Component 3)*  
      **Pose the Test:** Show Clara a *cube* and a *sphere* (visually). Ask: *"Which is the cube?"* (No touching, no SSD sounds).  
      **Shift the Question:** *"What would it mean if Clara succeeds or fails? What is actually being tested?"*  
      **Key Interventions:**  
      - Head off **Misconception 1** (*"Sight-restoration literature settled this"*): Point out cataract studies involve partial/pre-natal vision, neural rewiring, or developmental delays. Clara’s case is *conceptually pristine*: no prior vision + SSD provides pure associative-shape knowledge.  
      - Head off **Misconception 2** (*"Shape is a single capacity"*): Argue that "shape" may be modality-specific (visual shape vs. auditory-shape-symbol vs. haptic-shape). Success/failure probes whether her *SSD-acquired shape concept* is **abstract** (amodal) or **tied to the SSD's auditory code**.  
      **Why now?** Transforms "yes/no" into a question about the **nature of mental representation**.  

  5.  **Component 5: Deep Dive – What Success/Failure Implies**  
      *(25 mins; Depends on Component 4)*  
      **Scaffold Discussion:**  
      - *If Clara succeeds:* Suggests SSD trained an amodal, abstract shape representation (geometry transcends sensory code).  
      - *If Clara fails:* Suggests shape knowledge is modality-specific (SSD knowledge is "auditory-symbolic," not translatable to vision without relearning).  
      **Problem Space Expansion:**  
      - Is "shape" even a unified concept? (Link to Component 2’s intervention).  
      - Does SSD expertise *create* amodal concepts, or just refine a latent cognitive capacity?  
      - What if she’s inconsistent (sphere yes, cube no)?  

  6.  **Component 6: The Revealing Closing Question**  
      *(10 mins; Culmination)*  
      **Ask:** *"Regardless of what Clara *does*, what would you need to *observe* to conclude that she truly understands the cube *as the same shape* in both vision and SSD?"*  
      **Why this?** Forces engagement with **criterial evidence**. Picking a side (yes/no) is easy; specifying what constitutes "understanding" probes their grasp of the problem’s depth (e.g., spontaneous generalization, affective response, explanatory verbalizations). Reveals if they see this as about meaning, not behavior.  

  7.  **Component 7: What We Refuse to Resolve**  
      *(5 mins; Framing)*  
      **State Openly:** *"Today we won’t resolve whether abstract concepts are innate, experience-dependent, or require language. We’re mapping the question’s structure: How modality constrains concept formation. Empirical answers need this clarity."*  
      **Why?** Prevents reduction to nativism/empiricism debates. Keeps focus on the *framing* of Molyneux’s problem.  

  ---

  ### **Why This Sequence Works**  
  - **Builds Epistemic Dependencies:** SSD mechanics (1) → SSD competence vs. visual knowledge (2) → Clean case setup (3) → Conceptual reframing (4) → Implications (5) → Evaluation criteria (6). Each step requires the prior to avoid category errors.  
  - **Targets Misconceptions Preemptively:**  
    - *Empirical settledness* (1) is blocked *before* introducing Clara (3), using cataract limitations.  
    - *"Shape" as unitary* (2) is undermined during SSD competence discussion (2) and shattered in the reframing (4).  
    - *SSD as "teaching vision"* (3) is neutralized by priming SSD as symbolic translation (1) and explicitly decoupling competence from modality (2).  
  - **Clara as Ideal Anchor:** Her SSD expertise provides a rigorous analog to Molyneux’s "man long accustomed" while avoiding haptic confounds. The lack of cross-modal training during recovery isolates the core question.  
  - **Closes on Insight, Not Consensus:** The final question (6) reveals whether they’ve moved beyond "yes/no" to grapple with criteria for meaning, demonstrating true understanding.  

  **Handout Tip:** Provide a 1-page summary of Clara’s case and the test scenario. Include 2-3 key papers on SSD expertise (e.g., Amedi lab) *without* sight restoration data to avoid priming cataract studies. This keeps focus on your framework.
