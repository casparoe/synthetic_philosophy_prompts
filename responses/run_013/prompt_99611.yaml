prompt: |-
  I'm building a tutorial handout on choice without preference — the Buridan's donkey thing, except I dont want the donkey and I don't want anything starving, and I want to get past the two stock moves ("just pick one, it's not really a problem" / "there's always some difference if you look hard enough"). So I'd like a case built to order instead.

  Here's what I want it to do. One set of facts, three verdicts about it that come apart. The three ways of thinking about a no-preference choice:

  (A) The maximising line. Rational choice is taking something at least as good as anything else on offer. If she has no preference between A and B, both are optimal, so there's nothing to criticise whichever she ends up with, and further deliberation has zero expected value. On this line her later remark — "I never actually chose, I just ended up with B" — is a confused description of what happened: ending up with B was the choice.

  (B) The line that puts a genuine tie outside the space of reasons. Where nothing favours either option, the selection isn't an exercise of rational agency at all; it's on the level of a blink. So there's nothing to criticise, but nothing to credit either, and her "I never actually chose" is simply true.

  (C) The settling line. The job of practical reason isn't only to land on the better option, it's to arrive at a determinate answer she can own and act from; the failure mode is not picking wrong, it's never settling. So she is criticisable here, even though neither option was worse and even though the outcome was as good as it could have been — the criticism lands on the act, not on the outcome.

  So on the same facts I want {is her description accurate?, is there anything to criticise?} to come out {no, no} for (A), {yes, no} for (B), {yes, yes} for (C), and I want each verdict to fall out of the line rather than be asserted by me.

  Specs for the case:

  - The tie has to be airtight, and I want you to show it with an explicit symmetry argument: every feature that could give her a reason to take one over the other is mirrored in the other. No hidden asymmetry, and no tie-breaker rule dressed up as a reason — no coin, no dice, no lottery, no "take the one on the left", no "take whichever you heard about first". Any rule is a reason in disguise.
  - The tie has to be a tie in the world, not just in her head. If it's a tie only because she doesn't know something, that's a different case and not what I'm after.
  - No deferring, no exit, no handing it to someone else: she does end up with one of the two.
  - Ordinary and moderate stakes — a flat, a job, a course, a holiday. No trolleys, no life support, no dying donkey.
  - Scenario itself in one paragraph; the rest can run as long as it needs.

  And the bit I think is the real difficulty: I don't see how you get (A) and (C) apart unless she can end up with one of the two without ever having settled it — the world hands her B, and the outcome is exactly as good as it would have been had she deliberately picked B. If drifting costs her anything at all in outcome, (A) collapses into (C) and the case goes boring; if she has to consciously pick, then (B) and (C) both lose their grip. Thread that needle. If you can't, say so and tell me which of the three you had to sacrifice, because that's informative too.

  Then write it up in this order: the scenario; the symmetry argument; for each of (A), (B), (C) what it says and why, with the verdict derived rather than stipulated; which single feature of the case is doing the work — name it, and don't tell me "her psychology" or "the stakes"; what happens to each of the three verdicts if that feature is removed or reversed; and finally the strongest way a defender of (A) attacks the case, plus what the defender of (C) says back.

  It's going on a handout I have to be able to mark, so no "well, it depends what you mean by rational".

  Last line, on its own: Pivot: <the one feature, a few words>
reasoning: |-
  Okay, the user is building a tutorial handout on choice without preference, specifically avoiding the Buridan's donkey scenario. They want a custom case that cleanly separates three philosophical positions: Maximizing (A), Non-Agency (B), and Settling (C). The challenge is designing a scenario where all three verdicts can coexist without collapsing into each other.

  Hmm, the core difficulty lies in threading the needle between (A) and (C). For (A) to hold, drifting into an outcome must be blameless since both options are equally good. But for (C) to hold, the drifting itself must be criticizable despite the equal outcomes. This requires a scenario where the selection mechanism is passive ("ending up with" rather than choosing), yet the agent fails an active duty to settle.

  Let me think about ordinary moderate stakes... a job offer scenario could work. Two identical roles in different departments, but with a twist: a fixed assignment date that forces resolution without conscious choice. The symmetry must be perfect - same salary, same commute time, same growth prospects. The key is making the tie objective (not epistemic) by mirroring every conceivable reason-giving feature.

  Wait, how to ensure no hidden asymmetries? Need to explicitly list mirrored features: reporting structure symmetry (VP of X vs VP of Y, equally senior), identical physical workspaces, same team sizes. Crucially, the assignment process must be time-driven, not decision-driven - the system automatically assigns at deadline unless she actively chooses.

  For the drift mechanism: she sets a reminder to decide, but gets distracted by an urgent work crisis exactly when the reminder pops up. When she looks back, the system assigned B automatically. Outcome is identical to if she'd chosen, but she never mentally committed. This preserves (A)'s "no outcome cost" while allowing (C)'s criticism of the unsettled state.

  The pivot must be the passive selection mechanism - that's what allows (A) and (C) to diverge. If we remove this (e.g., she must click a button), then drifting isn't possible and (C) collapses into requiring active choice. The symmetry argument needs to systematically eliminate every possible reason asymmetry: even "which VP I vibe with" is neutralized by equal past interactions.

  For the philosophical defenses: A-defender would attack by saying the auto-assignment counts as a valid choice proxy under maximization. C-defender counters that the attitude of ownership matters - she disclaims agency precisely because she failed the settling duty. B remains intact as the "no agency" baseline.

  Better include how each verdict changes if the pivot is altered: if passive assignment is removed, (C) might disappear; if symmetry breaks, (A) weakens. The job scenario feels right - high enough stakes for settling to matter, but not life-or-death. And "urgent crisis causing distraction" feels organic, not contrived.

  Final check: does this give {no,no} for A (description inaccurate, no criticism), {yes,no} for B (description accurate, no criticism), {yes,yes} for C (accurate, criticizable)? Yes - the "I never chose" statement is true for B/C but not A, while criticism only applies in C. Nailed it.
answer: |-
  ## Tutorial Handout: Choice Without Preference

  **The Scenario**  
  Riley must select one of two identical job offers: "Project Lead, East Division" or "Project Lead, West Division". Both report to equally senior VPs (one oversees East, one West), offer identical salary, benefits, team size, project scope, commute time/direction (opposite but equidistant routes), and growth potential. She must accept one by 5 PM Friday. Riley intends to decide deliberately but gets immersed in an urgent, unrelated work crisis at 4:55 PM. At 5:00 PM, the hiring system automatically assigns her to the West role based on a timestamp (she submitted her East application 3 seconds earlier, but this timestamp confers no advantage and was unknown/unconsidered by her). She accepts the role. Later, reflecting on the process, she says: *"I never actually chose the West role; I just ended up with it."* The outcome is identical to what she would have had if she’d deliberately chosen West.

  **Symmetry Argument**  
  The tie is objective (not epistemic) and airtight because every potentially reason-giving feature is mirrored:  
  - **Material factors:** Salary, benefits, responsibilities, commute time, physical workspace quality.  
  - **Relational factors:** Both managers have identical performance records, leadership styles (assessed independently), and Riley had one equally positive prior interaction with each.  
  - **Procedural factors:** Offers arrived simultaneously via identical emails; neither "East" nor "West" has cultural/linguistic associations for Riley; application timestamps are normatively inert (no policy or convention grants them weight).  
  - **Future prospects:** Company structure ensures symmetric promotion paths. No feature differs in a way that could provide a reason to prefer one over the other. External tie-breakers (coins, defaults) are excluded by design.

  **Verdicts Derived**  
  **(A) The Maximising Line**  
  Rational choice requires selecting an option at least as good as all others. Both jobs are optimal. Riley secured an optimal outcome (West role). Her method (automatic assignment) incurred no cost, generated no inferior outcome, and further deliberation had zero expected value. Her description is confused: obtaining West *was* the selection of an optimal option, fulfilling rational choice requirements. *Verdict:* Description inaccurate. Nothing to criticise.  
  *Why?* Rationality evaluates outcomes and adherence to optimality. She achieved optimality; *how* it happened is irrelevant if it doesn’t violate optimization.

  **(B) The Non-Agency Line**  
  Practical reason operates only where reasons differentiate options. Here, no reasons exist to favor East or West. The assignment was a causal event (like a coin flip), not an exercise of rational agency. Riley’s outcome is fine, but she deserves no credit—nor blame—for it. Her description is literally true: no choice occurred, only an external determination. *Verdict:* Description accurate. Nothing to criticise.  
  *Why?* Agency requires reasons to respond to. No reasons → no agency exercise → no evaluation of rationality applies.

  **(C) The Settling Line**  
  Practical reason requires forming a determinate intention to act, even when options are equal. Riley failed to settle on an option before the deadline. Her passive acceptance—allowing the world to decide—constitutes a failure of rational agency, regardless of outcome optimality. She is criticisable for not completing the deliberative task: committing to a course of action. Her description acknowledges this failure. *Verdict:* Description accurate. Criticisable for not settling.  
  *Why?* Rational agents must resolve indeterminacy through commitment to act. Failing to settle, even with good cause (the crisis), leaves the agent in a state of agential passivity incompatible with full rationality.

  **The Pivot: Passive Selection Mechanism**  
  The feature enabling separation of (A) and (C) is the **externally triggered, outcome-neutral resolution**. The system assigns Riley automatically *without her input* at the deadline, producing the same outcome as a deliberate choice would, but bypassing her agency.

  **Effect of Altering the Pivot**  
  - *If removed (e.g., she MUST click "Accept" on one offer by 5:00 PM):* (C) and (A) collapse. Clicking *is* settling (satisfying C), and clicking *any* option is optimal (satisfying A). (B) becomes harder to defend (clicking feels agential).  
  - *If reversed (e.g., passive resolution incurs a cost):* (A) collapses into (C). If auto-assignment causes even a minor disadvantage (e.g., slight reputational ding), failing to settle actively is criticisable under *both* (A) (suboptimal outcome) and (C) (agential failure).

  **Attack and Counter**  
  - **A-Defender’s Attack:** "Auto-assignment *is* a rational choice mechanism under indifference. Systems like this *are* how we ‘just pick one’—it’s efficient and optimal. Riley’s remark is just semantic confusion."  
  - **C-Defender’s Rebuttal:** "Efficiency doesn’t negate the agential demand. The system acted *on* Riley, not *through* her. Her disavowal (‘I never chose’) reveals the lack of commitment. Rationality requires owning the selection, not just receiving an optimal result."

  Pivot: **Externally triggered resolution**
