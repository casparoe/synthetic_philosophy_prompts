  Final pass: ensuring no question has obvious "correct" answers and all options sound equally reasonable. The zombie acting scared scenario is tricky - need to make "it's not real fear" sound plausible despite the behavior. Maybe emphasize the lack of internal state.

  Scoring key must flag:
