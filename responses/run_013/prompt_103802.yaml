  Biggest challenge is the constructivist theory - since it's about cultural shaping, I'll use the untranslatable emotion word scenario. But high schoolers might not grasp the Sapir-Whorf implications... better make the answer options very concrete: "could experience but not name" vs "couldn't experience at all."

