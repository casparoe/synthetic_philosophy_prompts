  Hmm, the key challenges here are: (1) designing scenarios that force intuitive choices rather than intellectualized answers, (2) ensuring answer options equally appeal to different biases, and (3) creating clean mapping between answer patterns and theories while flagging inconsistencies. The user's inclusion of specific required cases (plane fear, baby fear, etc.) suggests they've already identified classic philosophical dilemmas - smart.

  First, I should cluster the six theories by their core disagreements:
  - Cognitive camp (judgment vs perception theories) both see evaluation as essential but differ on whether it's belief-based
  - Non-cognitive camp (bodily feelings, action tendencies) reject evaluation as necessary
  - Constructivist theory stands apart with its linguistic focus
  - Combo theory is the only hybrid approach

  For the plane turbulence scenario, the critical tension is between judgment theory (emotion should match belief) vs perception theory (can override belief). The baby fear case pits theories that require concepts (judgment/perception) against those that don't (bodily/action). The racing heart scenario is perfect for teasing apart bodily feeling theory from combo theory. 

