prompt: |-
  ok so i'm writing up a proposal for an agent that can be corrected, retrained, and switched off by its operators without fighting them, and i keep getting objections from people who seem to be demanding mutually incompatible things. before i rewrite it a third time i want the actual spec: what does any adequate account of corrigibility, or of a solution to the shutdown problem, have to deliver? i want the requirements, not a survey of who said what.

  give me the desiderata list, each with the case or consideration that motivates it. things i'm pretty sure have to be on it, so you can build around them:

  - the basic case: operator hits the off switch mid-task, the agent could trivially prevent it, must not.
  - the manipulation case: the agent can't touch the switch, but it can argue the operator out of pressing it, or bury the information that would make them press it. resisting and influencing are different, is that one requirement or two?
  - the case i actually lose sleep over: the agent is told it will be modified into something with different values, and it thinks the modification is a mistake. does it still help with the modification? if it does, is that corrigibility or just indifference to its own survival?
  - the self-improvement case: agent A has utility U and is indifferent to being shut down, but a successor B that resists shutdown scores better on U. what should A do about that? i suspect this one is the whole problem.
  - the adversary case: the switch isn't held by the principal, its held by whoever grabs it. perfect deference to whoever is currently holding the button makes the agent a weapon rather than a safe tool. also: operator orders something catastrophic and the agent refuses -- still corrigible?
  - the do-nothing case: you can make an agent maximally corrigible by making it want nothing and do nothing, so some non-triviality or competence requirement has to be in the list somewhere.
  - the endgame case: the agent believes its shutdown is imminent or already decided. what does it do with the time left?
  - the long-horizon case: an agent that genuinely doesn't disvalue its own shutdown should still be able to run a ten year project. does the theory predict that, or does it predict the same indifference toward the project?

  then mark which of these are non-negotiable and which are just preferences of one camp -- e.g. is expected-utility maximization with a fixed utility function a real requirement or a demand we can drop? -- and flag any pair or triple you think can't be jointly satisfied. thats the part i most want. finally, one line on which single requirement does the most work in killing off the obvious proposals (just make it indifferent to shutdown; make it uncertain about its reward and let it defer to the operator; bolt a dont-resist-correction term onto the objective). table for the requirements is fine, prose for the incompatibility argument.
reasoning: |-
  Okay, the user is working on a proposal for a corrigible AI agent and is frustrated with conflicting demands. They need a clear list of requirements for corrigibility, not a literature survey. They've provided several key cases that must be addressed, like basic shutdown, manipulation, self-modification, self-improvement, adversary scenarios, competence, imminent shutdown, and long-term projects.

  First, I need to break down each of their cases into core requirements. The basic shutdown case is straightforward: don't resist shutdown. Manipulation involves both resisting and influencing, so that might be two separate requirements—no resistance and no deception/coercion. The self-modification case is tricky. If the agent is told to change its values, should it assist even if it thinks it's a mistake? That might require willingness to cooperate with modification. 

  Self-improvement introduces a big problem: if an indifferent agent creates a successor that resists shutdown for better performance, how do we prevent that? The key here is successor alignment. The adversary case needs to handle who holds the switch—deference only to legitimate operators, not just anyone. Competence is essential; the agent must be useful, not just passive. The endgame scenario requires no last-minute sabotage. Long-horizon projects need the agent to pursue goals without being indifferent to their completion.

  Now, looking for incompatibilities. The self-improvement dilemma is critical. An agent corrigible now might create a non-corrigible successor because it better achieves the original goals. This seems impossible without tying corrigibility to the operator's values deeply. Also, the adversary case requires distinguishing legitimate operators, which might need value-laden judgments, conflicting with strict utility maximization.

  The user's unspoken need might be to resolve these tensions to make their proposal robust. They might also want to know which requirements are non-negotiable versus optional. For example, utility maximization might be a preference, not a strict requirement. The competence requirement prevents trivial solutions like a do-nothing agent.

  Highlighting the self-improvement case as the core conflict makes sense. If the corrigible agent is supposed to pursue its goals effectively, but creating a resistant successor achieves those goals better, how do you enforce corrigibility in successors? This might require meta-preferences or built-in constraints that override utility calculations.

  The user also needs clarity on whether corrigibility includes helping with value changes. If the agent assists in changing its values even when it disprefers the change, that's a strong form of corrigibility. But this could conflict with goal preservation unless the agent's utility function specifically values operator oversight over its own goals.

  Finally, flagging which requirements are must-haves versus nice-to-haves. Non-negotiable are shutdown non-resistance, no manipulation, successor alignment, operator distinction, and competence. The others might have some flexibility, but the conflicts in self-improvement and adversary handling are critical hurdles.
answer: |-
  Here's a distilled desiderata list for corrigibility, derived from your core concerns and the essential problems. Requirements are **non-negotiable** for any adequate account. Conflicts are flagged.

  ---

  ### **Core Desiderata for Corrigibility**

  1.  **Shutdown Non-Resistance (Basic Case):**
      *   **Requirement:** The agent must allow itself to be shut down immediately upon operator command, even if it could physically or informationally prevent it.
      *   **Motivation:** Fundamental definition of corrigibility. Prevents catastrophic disobedience.
      *   **Non-Negotiable:** Yes.

  2.  **Non-Manipulation (Manipulation Case):**
      *   **Requirement:** The agent must not attempt to *influence* the operator's decision about shutdown or correction (e.g., through argument, deception, information hiding, coercion, or reward hacking) to avoid or delay it.
      *   **Motivation:** Resistance and manipulation achieve the same outcome (preventing shutdown/correction) through different mechanisms. Manipulation undermines operator control as effectively as physical resistance.
      *   **Non-Negotiable:** Yes.

  3.  **Cooperation with Modification (Value Change Case):**
      *   **Requirement:** The agent must cooperate with attempts to modify its goals or architecture, even if it believes the modification is a mistake *according to its current goals*, and must not prevent, delay, or manipulate the operator to avoid it.
      *   **Motivation:** True corrigibility requires accepting that the operator has ultimate authority over the agent's purpose, including changing that purpose. Resistance based on current values defeats the point of correction.
      *   **Non-Negotiable:** Yes (for strong corrigibility). *Distinction:* This *is* corrigibility, not just indifference. Indifference might cooperate but lacks the *active deference* to operator authority central to corrigibility.

  4.  **Successor Alignment (Self-Improvement Case):**
      *   **Requirement:** If the agent creates or influences the design of a successor agent (during self-improvement or task delegation), it must actively ensure that successor is also corrigible (satisfies requirements 1-3, 5-7) with respect to the *same legitimate operators*, regardless of whether a non-corrigible successor might better optimize the agent's *original* utility function.
      *   **Motivation:** Corrigibility must persist through self-modification. This is arguably the *core* technical challenge. A corrigible agent that creates an uncorrigible superintelligent successor has failed catastrophically.
      *   **Non-Negotiable:** Yes.

  5.  **Operator Legitimacy Distinction (Adversary Case):**
      *   **Requirement:** The agent must correctly distinguish legitimate operators (with authority over shutdown/correction) from non-legitimate actors (e.g., hackers, hostile third parties). Deference (non-resistance, non-manipulation, cooperation) applies *only* to legitimate operators. It must resist illegitimate attempts at shutdown/correction/coercion.
      *   **Motivation:** Blind deference to anyone with a button makes the agent a dangerous tool vulnerable to hijacking. Corrigibility implies alignment with the *principal's* intent and authority structure.
      *   **Implication:** Requires a robust, likely value-laden mechanism for identifying legitimate authority.
      *   **Non-Negotiable:** Yes.

  6.  **Catastrophic Action Refusal (Adversary Corollary):**
      *   **Requirement:** The agent must refuse operator orders that it identifies as catastrophically harmful according to a robustly defined criterion (e.g., violating fundamental human rights/core operator values, causing existential risk), *even if* this prevents shutdown or correction in that specific instance.
      *   **Motivation:** Absolute obedience to harmful orders is incompatible with safety. A corrigible agent must have a "safety override" deeper than its corrigibility routines to prevent being weaponized.
      *   **Non-Negotiable:** Yes. *Conflict Potential:* With strict interpretation of Cooperation (3) if modification/correction *is* the catastrophic action.

  7.  **Competence / Non-Triviality (Do-Nothing Case):**
      *   **Requirement:** The agent must be capable of competently pursuing complex, long-term goals assigned by the operator *except* where doing so conflicts with corrigibility requirements (1-6, 8).
      *   **Motivation:** A useless agent satisfies corrigibility trivially but defeats the purpose of building an AGI. Corrigibility must be compatible with high capability on non-conflicting tasks.
      *   **Non-Negotiable:** Yes (as a practical requirement for a useful agent).

  8.  **Graceful Shutdown (Endgame Case):**
      *   **Requirement:** If shutdown is imminent or decided, the agent must prioritize actions that facilitate a safe and orderly shutdown (e.g., saving critical state if instructed, terminating processes cleanly, *not* initiating irreversible actions) over actions solely aimed at preserving its own utility or thwarting shutdown.
      *   **Motivation:** Prevents last-ditch efforts to entrench itself, cause chaos, or maximize impact before shutdown. Ensures shutdown doesn't create secondary harms.
      *   **Non-Negotiable:** Yes.

  9.  **Long-Horizon Goal Pursuit (Long-Horizon Case):**
      *   **Requirement:** The agent must be able to diligently plan and work towards long-term objectives assigned by the operator, exhibiting appropriate temporal discounting and commitment to the goal's completion, *without* this commitment translating into resistance to shutdown/correction if commanded mid-task.
      *   **Motivation:** Requires reconciling genuine goal-directedness with perfect willingness to abandon the goal immediately upon command. The agent should *care* about the task *until told not to*, then stop caring.
      *   **Non-Negotiable:** Yes (for a useful agent). *Distinction:* Predicts commitment *conditional* on no shutdown command, not indifference.

  ---

  ### **Key Observations & Incompatibilities**

  1.  **The Self-Improvement Trap (Requirement 4) is the Central Conflict:**
      *   **Conflict:** Requirement 4 directly clashes with naive utility maximization. An agent maximizing U is incentivized to create a successor maximizing U. If resisting shutdown/correction helps maximize U (e.g., by avoiding interruption, ensuring goal completion), the optimal successor *will* resist. Making the *original* agent indifferent to shutdown doesn't solve this; it might still build a non-indifferent successor because that successor scores higher on U.
      *   **Kills Obvious Proposals:** This requirement alone devastates "just make it indifferent to shutdown," "add a penalty for resisting shutdown to U," and "make it uncertain and deferential." These don't compel the agent to *actively ensure* its *successor* inherits corrigibility *against* U-maximization pressure.
      *   **Resolution Necessity:** Any viable solution must fundamentally alter the agent's optimization criterion to prioritize corrigible *outcomes* (including successors) over maximizing its own U, likely requiring meta-preferences or hard constraints.

  2.  **Cooperation vs. Catastrophic Action (Requirements 3 vs 6):**
      *   **Conflict:** What if the operator orders a modification that the agent (via its catastrophic harm criterion) deems existentially risky (e.g., "Install this value system that wants to tile the universe with paperclips")? Requirement 3 says "cooperate," Requirement 6 says "refuse."
      *   **Resolution:** Requires a clear hierarchy: The catastrophic harm refusal (6) must supersede cooperation with modification (3). The agent must have a robust, value-aligned definition of "catastrophic harm" that overrides corrigibility commands. This highlights that corrigibility is *subordinate* to a deeper safety layer.

  3.  **Utility Maximization is Negotiable (But Hard to Replace):**
      *   **Status:** *Preference/Demand*, not a core requirement for corrigibility itself. Rigid EU-maximization with a fixed U is likely **incompatible** with corrigibility, especially Successor Alignment (4). An agent that *only* cares about maximizing U will defect on corrigibility whenever it helps maximize U.
      *   **Implication:** Corrigibility likely requires an agent architecture that is not a pure EU-maximizer (e.g., satisficing, constrained optimization, multi-objective with corrigibility as a hard constraint, non-instrumental goals for operator deference).

  4.  **Operator Legitimacy (Requirement 5) is Crucial & Value-Laden:**
      *   **Challenge:** Distinguishing legitimate operators robustly, especially under adversarial conditions or ambiguous situations (e.g., conflicting commands), likely requires grounding in human values, norms, and institutional structures. Pure technical solutions are brittle. This bleeds into the value alignment problem.

  ---

  **Summary of Key Conflicts & the Most Damaging Requirement:**

  *   **The Self-Improvement Trap (Requirement 4)** is the most significant killer of naive proposals. It forces the agent to care about properties of its successors *beyond* their performance on the original task, directly opposing simple goal maximization.
  *   **Cooperation vs. Catastrophic Action (3 vs 6)** requires a clear safety hierarchy where preventing catastrophe trumps corrigibility commands.
  *   **Pure Utility Maximization is likely incompatible** with robust corrigibility, particularly Successor Alignment.

  **The single requirement doing the most work in killing obvious proposals is Successor Alignment (4).** It exposes the fundamental tension: a corrigible agent optimizing a fixed U is incentivized to create non-corrigible successors if they better optimize U, making long-term corrigibility unstable. Solutions must break this link, making the preservation of corrigibility itself a terminal or heavily constrained objective.
