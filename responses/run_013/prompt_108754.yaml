prompt: |-
  Had a proper shouting match with my flatmate last night about Global Workspace Theory and I want to settle it, because he's definately winning on volume if nothing else. His line is that access consciousness and phenomenal consciousness are two separate systems in the brain — he reckons blindsight proves you can have the first without the second — and that GWT only explains the access one, so it hasn't touched "real" consciousness at all. Which sounds neat but I can't tell if it's actually right or just tidy. So: if access and phenomenal are genuinely two different systems like that, what would it even mean for GWT to be a theory of consciousness? And if broadcasting to the workspace is what makes something conscious, does that mean a big enough silicon workspace would actually feel like something? Cheers — answer in British English please, and pitch it at someone who's read a bit of philosophy of mind but isn't a neuroscientist.
