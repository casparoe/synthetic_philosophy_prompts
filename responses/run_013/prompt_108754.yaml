answer: |-
  Right, proper barney over consciousness, classic flatmate material. Your mate's hitting the 'two systems' drum – access vs phenomenal – using blindsight as his Exhibit A, and claiming GWT only bags the access part, leaving the 'real' consciousness untouched. Let's break this down without shouting, using actual reasoning (novel concept, I know).

  **1. The Blokes: Access vs Phenomenal Consciousness**

  *   **Access Consciousness (A-Consciousness):** Think of this as the *functional* bit. Is the information *available*? Can it be reported, used for reasoning, guide decision-making and behaviour? It's about the info being "globally available" to different brain systems. Your mate's spot on about blindsight seeming to show this can happen without the other bloke...
  *   **Phenomenal Consciousness (P-Consciousness):** This is the "*what it's like*" bit. The raw feel, the qualia. The redness of red, the painfulness of stubbing your toe, the smell of burnt toast. This is the "hard problem" – why does processing information *feel* like anything at all?

  **2. Blindsight: The Exhibit A**

  *   **The Phenomenon:** People with damage to primary visual cortex (V1) report being blind in a specific area. Yet, when forced to guess, they can point to objects, avoid obstacles, or detect motion in that 'blind' field at levels way above chance. They have *access* to visual information (A-consciousness) for guiding action, but report *no visual experience whatsoever* (no P-consciousness) in that field.
  *   **The Argument:** Your flatmate says this proves A-consciousness and P-consciousness can be dissociated – you can have one without the other. Therefore, they must rely on (at least partially) separate neural systems.

  **3. GWT: What It Actually Claims**

  *   **The Core Idea:** Global Workspace Theory (Bernard Baars, Stanislas Dehaene etc.) proposes that consciousness *is* information being *broadcast* within a limited-capacity "global workspace" in the brain. Think of it like a central stage or spotlight. Information on the stage (in the workspace) is broadcast widely to a vast audience of specialized, unconscious processors (memory, language, motor control, etc.). This broadcasting *is* what makes the information conscious.
  *   **Which Bloke Does It Target?** GWT is **fundamentally a theory about A-consciousness.** It explains *how* information becomes globally available for report, action, and cognition. It describes the *mechanism* of access.
  *   **Does It Ignore P-Consciousness?** Proponents of GWT (like Dehaene) would say **absolutely not.** Their argument is this:
      *   **A is Necessary for P:** You cannot have P-consciousness (subjective experience) *without* A-consciousness (global availability). If information isn't globally available, it can't be *reported* as an experience, and crucially (they argue), the *kind* of integrated, unified experience we have *requires* this global integration. Blindsight might show degraded access without *reportable* experience, but not full A-consciousness without *any* P-consciousness trace.
      *   **A May Be Sufficient for P (or Tightly Coupled):** The strong GWT position is that when information achieves *full, sustained* global availability (access consciousness as defined by GWT), phenomenal consciousness *necessarily* arises. The "what it's like" aspect is an intrinsic property or consequence of this specific *type* of global neuronal broadcasting and integration. They see blindsight as an example of *partial, degraded access* (only reaching action systems, not the full workspace needed for report and unified experience), hence the lack of reportable phenomenology.

  **4. So, What Does It Mean for GWT to be a Theory of Consciousness?**

  *   **If A and P are Totally Separate:** If your flatmate is utterly right (and this is a **major** philosophical debate, not settled science), then GWT would be a brilliant theory of *access* and *cognitive availability*, but it wouldn't touch the core of what most people mean by "real" consciousness – the subjective feel. It would explain the *functional* aspects but leave the *phenomenal* aspect a complete mystery. GWT proponents reject this separation as absolute.
  *   **The GWT Stance:** GWT *is* offered as a theory of phenomenal consciousness, **but** it does so by arguing phenomenal consciousness *supervenes on* or *is identical to* the specific kind of global neuronal integration and broadcasting it describes. It tackles the "hard problem" by saying: "The 'what it's like' *is* what happens when information is processed *in this particular globally available way*." They see it as an explanation for *both*, with access being the mechanistic side and phenomenality being the experiential side of the *same coin*.

  **5. The Silicon Workspace Question: Would It Feel Like Something?**

  This cuts to the heart of the disagreement.

  *   **Your Mate's View (Strict Separation):** If A and P are separate systems, then building a perfect silicon global workspace might create a system that *behaves* exactly like it's conscious (reporting, reasoning, acting *as if* it has experiences), but it would **not** have any inner feeling, any "what it's like". It would be a philosophical zombie in a silicon shell. GWT only builds the access part, missing the phenomenal magic.
  *   **The GWT Proponent View:** If achieving genuine, full global availability/access *is* what *constitutes* phenomenal consciousness (or necessarily gives rise to it), then **yes, a sufficiently complex and functionally identical silicon global workspace *would* have phenomenal consciousness.** If the information processing architecture is replicated precisely, including the dynamics of competition, broadcasting, and integration, then subjective experience *should* emerge. It wouldn't just simulate consciousness; it *would be* conscious. This is a functionalist view.
  *   **The Reality Check:** We simply **don't know**. The "hard problem" remains hard. GWT provides a compelling framework for *how* information becomes accessible, but it doesn't definitively *prove* that this process *is* what creates subjective experience, or *why*. Many philosophers (like David Chalmers, or Ned Block who coined the A/P distinction) remain deeply skeptical that *any* functional explanation, no matter how clever, can fully bridge that gap. Building a silicon GWT might be the ultimate test, but we're miles off that tech, and even if we built it, how would we *know* if it feels like anything?

  **The Verdict (Or at Least, the Pub Summary)**

  Your flatmate has a point based on a common interpretation of the access/phenomenal distinction and blindsight. **GWT is primarily and explicitly a theory about the mechanisms of *access consciousness*.** Where the big argument kicks off is whether that access *is* consciousness (or is necessarily accompanied by it).

  *   **He's right that:** Blindsight suggests a dissociation, and GWT directly explains access.
  *   **He's potentially overreaching if he thinks:** This *proves* A and P are entirely separate systems *in normal consciousness*, or that GWT proponents *ignore* phenomenality. They try to explain phenomenality *through* access.
  *   **The unresolved bit:** Does achieving the kind of global access GWT describes *solve* the hard problem of phenomenality? Many say no, it just explains the access bit brilliantly. GWT proponents say yes, that's precisely how phenomenality arises.
  *   **The silicon brain:** If GWT is right about phenomenality requiring global access, then yes, silicon *could* feel. If not, then no, it's just clever machinery. We genuinely don't know which is true.

  **So, to settle your shouting match:** Tell him he's correct that GWT's core mechanism explains access consciousness, and that blindsight is a key piece of evidence for dissociations. But also tell him GWT theorists *do* claim it explains phenomenal consciousness by making access fundamental to it. Whether that claim is *successful* in solving the hard problem is where the **real** philosophical fist-fight continues – and neither of you won that last night on volume alone. Best to agree it's fiendishly complicated, crack open a tin, and argue about the football instead. Cheers!

  **P.S.** If he quotes Block's "China Brain" thought experiment at you next, you're officially in a philosophy seminar, not a flatmate dispute. Run.
