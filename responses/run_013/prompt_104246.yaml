prompt: |-
  Fourth-year PhD in cog sci, and I've got a problem that started out as straight procrastination and has turned into something I can't stop chewing on. Figured asking you was a better use of an afternoon than asking my roommates again.

  I hadn't written a word of my dissertation in about six months. Two months ago I set up a deal with a friend: every Friday I owe him 1,000 words, and if they don't arrive, $50 goes to a political cause I find genuinely loathsome. Its working. I'm writing. But now I don't understand what was wrong with me before, and the two explanations I've been given don't fit together.

  My roommate is in behavioral econ. His view is that nothing was wrong with me. I just want present things more than future things, and the size of that gap isn't constant -- it shrinks as the deadline gets closer, so all the deal does is move the payoffs around. He says a will that's weak isn't a thing that happens; it's a story we tell about an agent that isn't really there. At 9pm the scrolling was worth more to me than the dissertation, at 9am it wasn't, and neither of those guys is wrong about anything.

  My advisor, who's a philosopher by training, says that's just redescribing the behavior and calling it an explanation. What's interesting, he says, is that I knew while I was doing it that I was doing the worse thing. Not that I wanted the scrolling more -- I didn't, I was miserable the whole time -- but that I did it anyway, knowing I'd rather not. And he thinks the contract is me refusing to look at that, like an alcoholic hiding the bottles.

  They can't both be right, and from the inside my roommate's story is just what it feels like. Except that when I'm at my desk at 9pm with the browser open, it doesn't feel like I've been outbid. It feels like nobody's home.

  Two things I can't get past. First: is this even a disagreement about me, or just two vocabularies for the same facts? What could I actually catch myself doing that would settle it one way or the other?

  Second, the contract. I don't feel like someone writing a dissertation, I feel like someone being made to. If I finish this way, is the thing mine in the same way it would have been otherwise? My roommate says the pages are the pages. And I've basically put a gun to the head of a guy who won't exist until April -- he didn't agree to any of this, and he might want something completely different by then. So should I keep the contract, and does the answer depend on which of those two stories is true?
reasoning: |-
  Okay, let's start by unpacking this user's situation. They're a fourth-year PhD student in cognitive science struggling with dissertation procrastination. They set up a contract with a friend involving financial penalties to force writing progress, which is working. But now they're grappling with two conflicting explanations from their roommate (behavioral econ) and advisor (philosophy) about why they procrastinated. 

  The core tension seems to be between:
  - Roommate's view: Time-inconsistent preferences (standard hyperbolic discounting model)
  - Advisor's view: Akrasia (weakness of will as genuine phenomenon)

  Hmm... the user's description of "nobody's home" during procrastination episodes is particularly striking. That doesn't sound like simple preference shifting - there's a dissociation element here. The cognitive science background suggests they'd appreciate neuroscientific angles too (maybe default mode network vs. executive control clashes?).

  What's really eating at them appears to be:
  1) Ontological uncertainty - are these competing explanations or just linguistic frameworks?
  2) Authorship anxiety - does coerced production undermine dissertation ownership?

  For the first issue, they need testable differences between models. Behavioral econ predicts consistent reward sensitivity shifts, while akrasia allows for simultaneous conflicting valuations. Could suggest tracking:
  - Physiological markers during procrastination (heart rate variability as stress indicator)
  - Post-avoidance regret intensity (akrasia should correlate with higher regret)
  - Whether "scrolling worth more" feels true in moment (vs. advisor's claim it doesn't)

  The authorship question is trickier. Roommate isn't wrong that output is output, but user's visceral "being made to" feeling matters. Might reframe: all academic writing is constrained production (deadlines, review, funding). The contract is just a more vivid constraint. Ownership comes from content engagement, not motivation purity. 

  Noticing they mention April as future self reference point. That temporal disconnect is key - the contract works precisely because it bridges present/future selves. Behavioral econ sees this as clever incentive alignment, philosophy might call it self-coercion. But functionally? It's working. 

  Should address the "hiding bottles" concern though. If contract feels like avoidance, suggest adding reflection component: annotate each submission with "why I resisted this section." Turns punishment into data collection. 

  Final thought: Their meta-awareness about procrastination is actually a strength. Many never examine these mechanisms. This crisis might become dissertation gold - they're living their research.
answer: |-
  This is a profound and beautifully articulated dilemma - you've hit the nerve of one of the oldest debates in philosophy and behavioral science. Let's dissect it systematically:

  **1. The Core Disagreement: Akrasia vs. Time-Inconsistency**  
  - **Your roommate (behavioral econ):** Describes *time-inconsistent preferences*. Your "present self" overvalues immediate rewards (scrolling) relative to future rewards (dissertation progress). The contract alters incentive structures by making inaction painfully salient.  
  - **Your advisor (philosophy):** Describes *akrasia* (weakness of will) - acting against your better judgment. The contract avoids confronting why you knowingly sabotage yourself.  

  **These aren't just vocabularies; they're competing explanations with testable differences:**  

  | **Test**                          | If Behavioral Econ is Correct          | If Akrasia is Correct                |
  |-----------------------------------|----------------------------------------|--------------------------------------|
  | During procrastination:           | "Scrolling feels preferable NOW"       | "I feel trapped while scrolling"     |
  | After procrastination:            | Regret fades quickly                   | Deep shame/self-recrimination        |
  | Reward substitution (e.g., snacks)| Equally effective as money threat      | Less effective; avoidance persists   |
  | Under time pressure:              | Productivity increases smoothly        | Last-minute panic OR paralysis       |

  **What you could "catch" yourself doing:**  
  - During a procrastination episode, ask: *"Do I genuinely believe scrolling is BETTER than writing right now?"*  
    - If yes → time-inconsistency  
    - If no + "I can't stop" → akrasia  
  - Try replacing the $50 threat with an equivalent reward (e.g., "$50 to my favorite charity if I write"). If motivation drops drastically, akrasia is more likely (rewards don't resolve internal conflict).  

  **2. The Contract & Authorship Crisis**  
  Your insight about "putting a gun to future-you's head" is brilliant. Here's how the explanations map:  

  - **Behavioral econ view:** The contract is rational. Future-you *will* value the dissertation (deadline proximity fixes time-inconsistency). You're aligning present/future incentives. The work is "yours" because preferences stabilize under constraint.  
  - **Philosophy view:** The contract is existential avoidance. Until you confront *why* you act against self-knowledge, you're alienated from your work. The dissertation becomes an external imposition.  

  **Crucially: Both can be partially true.** Cognitive science shows that:  
  - Procrastination involves both **impulse control failure** (behavioral econ's domain) and **emotional self-sabotage** (e.g., fear of evaluation, akrasia)  
  - The "nobody's home" feeling suggests **ego depletion** – your executive function resources are exhausted  

  **Should you keep the contract?**  
  - **Pragmatically:** Yes, immediately. It's working. Stopping now risks backsliding.  
  - **Existentially:** Reframe it:  
    - *Not* as coercion, but as **scaffolding for damaged executive function**  
    - Add a ritual: Before writing, state aloud: *"I choose to value future-me's needs"*  
    - Post-submission reflection: Journal *why* each 1000 words was hard  
  - **Authorship solution:** The dissertation becomes "yours" when you engage intellectually with the content, not through suffering. Many great works were written under duress.  

  **A Synthesis View from Cog Sci:**  
  Your struggle mirrors the **Procrastination Equation**:  
  `Motivation = (Expectancy × Value) / (Impulsiveness × Delay)`  
  The contract manipulates *Value* (increasing cost of delay) and *Delay* (breaking into weekly chunks). But your "nobody's home" feeling points to **dissociation** – a protective shutdown when cognitive/emotional load exceeds capacity.  

  **Action Plan:**  
  1. **Keep the contract** until draft completion  
  2. **Add metacognition:** Track when procrastination happens + emotional state  
  3. **Post-dissertation:** Experiment with "akrasia awareness" techniques (e.g., acceptance commitment therapy)  
  4. **Turn this into research:** Your lived experience is cog sci gold. Study self-binding contracts in grad students!  

  The pages *are* the pages. Your authorship isn't diminished by using tools – it's defined by the intellectual work they enable. What you're calling "weakness" might be your mind's intelligent refusal to operate under unsustainable conditions. The contract isn't hiding bottles; it's building crutches for a broken leg so you can finish the marathon.
