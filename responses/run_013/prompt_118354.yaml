prompt: |-
  Retired insect physiologist here — forty years on wasps and beetles, and about four years now trying to teach myself philosophy, so I apoligise in advance if this is a wheel somebody has already invented.

  Here's the thing I never had a word for. A solitary wasp drags a paralysed cricket back to her burrow and, before hauling it down, goes in alone to check the burrow is still hers. Move the cricket a few inches while she's underground and she comes back up, drags it to the entrance again, and checks the burrow again. Keep moving it and she'll run the whole loop forty times. It looks for all the world like she's thinking 'somebody might have pinched my hole while I was away', and the checking is definately doing something real — a wasp that skipped it would lose her prey — but there's nobody home doing any thinking. The reason is doing explanatory work with no reasoner attached to it.

  Same pattern turned up in two other places I spent time. We built optimality models where you treat the animal as maximising net energy per unit time; they predict well, and nobody believes the beetle is solving a constrained optimisation problem. And you can't write three sentences about kidney function without saying the tubule 'keeps' sodium in range, as if the tissue wanted something.

  So: is there a name for this? Not the general do-animals-think question — I mean the specific object, a reason that's really there, that you need in order to explain why the behaviour is the way it is, but that doesn't belong to anybody. I know it's neighbours with the old fight over whether biology is allowed to talk about purposes, and with the 'as if' dodge in economics, but the first is about whether the purpose-talk is legitimate at all and the second is about whether anything has to be maximising, whereas my puzzle is the middle case where the reason is real and load-bearing and unowned.

  If it has a name, what is it and who's it from? If it doesn't, coin one and tell me its edges — in particular, is it just a fancy word for a biological function, and does it stretch to things like a market or a legal code, where the reason sits in nobody's head but the institution behaves as though it did? I don't much care about the label, I care where the cuts fall, so please don't just hand me a term.

  Finish with a last line in exactly this form: \answer{the term, or your coinage if there isn't one}
reasoning: |-
  Okay, let me tackle this fascinating question from a retired insect physiologist. The user describes a phenomenon where a wasp's behavior appears driven by a reason ("checking if the burrow is still hers"), which is causally effective but doesn't correspond to any conscious reasoning in the wasp. This pattern also extends to optimality models in biology and functional language in physiology ("the tubule 'keeps' sodium in range").

  The user explicitly wants to avoid general discussions about animal cognition or teleology in biology. Instead, they're focused on this precise gap: a reason that's objectively present in the system's design (explaining why the behavior persists evolutionarily), yet unowned by any agent. They also wonder if this concept applies to institutions like markets.

  I recall Daniel Dennett's "free-floating rationale" from *Darwin's Dangerous Idea*. It perfectly matches: the rationale exists in the causal structure shaped by natural selection, not in any mind. Dennett contrasts this with "intentional stance" descriptions, which is adjacent but not identical. 

  The user might appreciate how this differs from "as if" explanations (which are merely predictive) and biological function (which lacks the "reason" aspect). Free-floating rationales specifically capture the explanatory power of reasons without a reasoner. It also scales to institutions - market behaviors "act as if" pursuing efficiency due to competitive pressures, not individual intent.

  For the coinage request: "free-floating rationale" is established and precise. No need to invent terms. The boundaries are clear: it applies when (1) the reason explains persistence/design (2) via selective pressures (3) without requiring representation in any agent. This covers biological traits, algorithmic processes, and institutional behaviors where selective pressures mimic rationality.

  Final answer formatted as requested.
answer: |-
  Your observation cuts brilliantly to the heart of a genuine conceptual gap in how we talk about purpose, function, and reasons in evolved and designed systems. You're right that it's adjacent to teleology and "as if" but distinct in its core feature: **the reason is objectively real, causally explanatory, and evolutionarily load-bearing, yet utterly unrepresented in the agent performing the behavior.** It's a *reason without a reasoner*.

  The established term that most precisely captures this is **free-floating rationale**. It was coined and developed primarily by philosopher **Daniel Dennett**, especially in his works like *Darwin's Dangerous Idea* (1995) and *Kinds of Minds* (1996). Here's why it fits and where the cuts fall:

  1.  **Core Concept:**
      *   A **free-floating rationale** is a *beneficial reason* (e.g., "to ensure the burrow hasn't been usurped," "to maximize net energy intake," "to maintain sodium homeostasis") that exists as a *causal pattern* in the environment or the selective history of the system.
      *   It's "free-floating" because it isn't *represented* or *understood* by the agent executing the behavior. The wasp has no concept of "usurpation," the beetle isn't solving equations, the kidney tubule cells aren't "wanting" sodium balance.
      *   It's a "rationale" because it genuinely *explains why the behavior or mechanism is structured the way it is and persists*. The behavior exists *because* it achieves this beneficial outcome (the rationale) via natural selection. Remove the rationale (e.g., no burrow thieves, no energy constraints, no need for sodium balance), and selection wouldn't favor that specific, costly behavior/mechanism.

  2.  **Distinguishing it from Neighbors:**
      *   **Biological Function (Teleonomy):** Yes, the free-floating rationale *underpins* the biological function. The function *is* "to check the burrow" or "to reabsorb sodium." But "free-floating rationale" emphasizes the *reason-like*, *benefit-driven*, *problem-solving* nature of the explanation ("Why *this* specific, complex behavior/mechanism? Because it solves *this* specific problem effectively"). "Function" is the *role*; the "free-floating rationale" is the *beneficial consequence* that explains *why* that role was selected for. It makes explicit the "reason-shaped hole" in the explanation.
      *   **"As If" (Economics/Biology):** "As if" explanations (e.g., the beetle behaves *as if* maximizing energy) are often *descriptive* or *predictive* tools. They don't necessarily commit to the rationale being *real* or *causally explanatory* in the evolutionary history. A free-floating rationale *is* causally explanatory – the behavior exists *because* it achieves the rationale. "As if" can be heuristic; free-floating rationale is ontological (it's part of the real reason the trait exists).
      *   **Intentional Stance (Dennett):** Applying the intentional stance means *treating* the system as if it has beliefs and desires to predict its behavior. The free-floating rationale is the *content* of the "desire" or "goal" you would attribute when taking the intentional stance *successfully* (e.g., "The wasp *wants* to ensure her burrow is safe"). The key is that the rationale is real and explanatory, even if the stance attributing beliefs/desires is just a useful fiction.
      *   **Teleology (Outlawed Purpose):** Debates about teleology often focus on whether attributing "purpose" is legitimate *at all* in science. The free-floating rationale sidesteps this by grounding the "purpose-like" explanation firmly in the real, historical process of natural selection. The rationale *is* the beneficial effect that caused the trait's selection. It's purpose *from the perspective of* natural selection, not the agent.

  3.  **Scope: Does it stretch?**
      *   **Biological Functions:** Absolutely. Your wasp, beetle, and kidney examples are paradigmatic. The rationale (preventing theft, maximizing efficiency, maintaining homeostasis) is the evolutionary "reason why."
      *   **Markets & Institutions:** **Yes, perfectly.** This is where Dennett often extends it. Market efficiency, legal consistency, or institutional stability often emerge as free-floating rationales. No single agent (trader, judge, bureaucrat) needs to understand or intend the overall beneficial outcome. The system behaves *as if* pursuing efficiency or consistency because competitive pressures, rule-following, or institutional evolution *select for* behaviors that accidentally produce those outcomes. The rationale (efficiency, consistency) is real, explains the system's structure/behavior, but is "owned" by the selective pressures of the environment, not any individual mind within it. The price "signal" is a carrier of a free-floating rationale.
      *   **Algorithms & AI:** Also applicable. A search algorithm behaves *as if* it "wants" to find the optimal path. The rationale ("find the optimal path") is real and explains the algorithm's design, but the algorithm itself doesn't represent this goal; it just executes steps shaped by human designers (akin to artificial selection). The rationale floats free of the executing hardware/software.

  **The Edges:**

  *   **Requires Selection (Natural or Artificial):** The concept relies on a history of variation and selective retention (biological evolution, market competition, institutional design/evolution, algorithmic design). The rationale must be the *actual* beneficial consequence that drove the selection of the trait or system structure.
  *   **Agent-Level Opacity:** The explanatory power hinges on the rationale *not* being represented or understood by the agent(s) executing the behavior. If the wasp *did* conceptually understand "burrow theft," it would belong to her. If every market participant *intended* efficiency, the rationale wouldn't be free-floating.
  *   **Not Just Correlation:** The rationale must be the *cause* of the trait's persistence via selection, not just a coincidental effect. A spandrel might have effects, but if selection didn't favor it *for* that effect, it's not a free-floating rationale explaining the trait's existence.

  **In short:** "Free-floating rationale" names the specific object you've identified – the real, unowned, evolutionarily explanatory reason that structures behavior in systems shaped by selection. It captures the essence of "a reason that's really there... doing explanatory work with no reasoner attached."

  \answer{free-floating rationale}
