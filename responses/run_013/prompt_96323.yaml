  Now for rescue moves: Narrowing scope to pre-industrial economies might be legitimate (adds 0.02 to credence), but shifting to welfare-reducing adjustments or global scales feels like stratagems (minimal credit). Deferring the horizon is clearly immunizing (no credit). The main legitimacy comes from historical validity.

  The user's disagreement with their supervisor likely centers on sub-claim 3 (industrial escape as check vs. break) - that's where interpretation diverges most. My credence is most sensitive to sub-claim 4 (bounded horizon); if that weakens, the whole theory crumbles. Least confident in sub-claim 3 - it's ambiguous what counts as "properly described".

