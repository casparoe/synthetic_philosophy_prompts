prompt: |-
  Ok, so this is a question I keep getting into with a friend in our little AI safety reading group and I want an actual number from you rather than a survey. Assume the role of someone who's actually worked on reward modeling / RLHF and also reads enough philosophy of science not to hand-wave — and please think carefully before committing: sketch the sub-questions you think the credence decomposes into, give each a rough number with a one-line justification, then combine them and tell me which term the final number is most sensitive to and what evidence would move it most. Here's the claim I want your credence on. Take a task family where the final answer is cheap and reliable to check but only at the very end — think one bit of verification after a 50-to-200 step reasoning chain, so no intermediate ground truth falls out for free. Compare a well-tuned process-based supervisor (step-level rewards or step labels, however you want to build them) against a well-tuned outcome-based supervisor that only ever sees the final pass/fail, with training compute held roughly equal. The proposition is: the process-based supervisor generalizes to genuinely novel, out-of-distribution instances meaningfully better than the outcome-based one. Meaningfully = a gap you'd actually bet a research program on, not a leaderboard epsilon. I'd put myself at about 0.6 and my friend at about 0.3, and honestly neither of us can say what the 0.3 of remaining disagreement is even about, which is the part that bugs me.

  The thing my friend keeps saying, and I want you to take seriously as a hypothesis rather than dismiss, is that process supervision is just outcome supervision with a shorter telescope — every "step" only counts as good because it leads to a correct next step, so you've moved the outcome a few tokens earlier and the same failure modes just relocate there. If that's basically right, then the process/outcome split is closer to a verbal distinction than a substantive one and my 0.6 is too high. If it's wrong, I want to know exactly where it breaks — is there step-level information that the final bit genuinely doesn't contain and that credit assignment over the whole chain can't reconstruct, or is the real win about optimization dynamics (denser reward signal, less variance) rather than information? Please fold that into your decomposition as its own term rather than treating it as a side note. And then one more thing I care about: how much of the number is riding on the process reward model itself being trustworthy, i.e. the failure mode where the step-level judge gets gamed or where the model's stated steps stop tracking whatever is actually driving its answers — because if that term is doing most of the work then the whole debate is really about verifier reliability and not about process-vs-outcome at all. Finally, tell me which sub-question my friend and I most likely actually disagree about, given our 0.6 and 0.3, and whether you think the question is even well-posed once you pin down "meaningfully better" and "compute held equal" — or whether a chunk of that 0.3 gap is just the two of us answering slightly different questions under one name.
