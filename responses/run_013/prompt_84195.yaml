answer: |-
  ### Brainstorming the Axioms' Rationale
  - **Pareto optimality**: Protects against *waste*. No resource should be left unclaimed if both parties can benefit.  
  - **Symmetry**: Safeguards *procedural fairness*. Identical players deserve identical outcomes.  
  - **Scale invariance**: Ensures *negotiation invariance*. Bargaining shouldn’t depend on arbitrary utility scaling (e.g., dollars vs. euros).  
  - **Independence of irrelevant alternatives (IIA)**: Prioritizes *local rationality*. Choices should not reverse when unchosen options vanish.  
  - **Individual monotonicity**: Demands *reward for opportunity*. If new mutually beneficial options emerge, neither player should lose.  

  ### The Core Conflict: IIA vs. Monotonicity
  **Why Nash punishes expansion (example)**:  
  Suppose the *original* feasible set offers utility pairs: (2, 2) or (3, 1), with disagreement point (0, 0).  
  - **Nash solution**: Maximizes product (2×2=4 vs. 3×1=3) → selects **(2, 2)**.  

  Now *expand* the set to include (2.5, 2.5).  
  - **New Nash solution**: (2.5×2.5=6.25) beats (2×2=4) → selects **(2.5, 2.5)**.  
  *Result*: Player 1’s payoff *drops* from 3 to 2.5? Why? Player 2’s new option (2.5) strengthened her bargaining power. Nash obeys IIA: adding (2.5, 2.5) made (2, 2) irrelevant, but Player 1’s *old* best outcome (3, 1) is now dominated.  

  **KS avoids this**:  
  - Original ideal point: (3, 2). KS finds proportional gains: e.g., (2.4, 1.6) if linear.  
  - New ideal point: (3, 2.5). KS *increases* Player 2’s share but never reduces Player 1’s.  

  ### The Axiomatic Trade-off  
  - **IIA vs. Monotonicity are incompatible** under Pareto/symmetry/scale invariance (proof: Thomson’s 1981 impossibility).  
    - *IIA intuition*: Fairness should be "local." If you’d choose apple over banana today, adding a rotten pear shouldn’t make you switch to banana.  
    - *Monotonicity intuition*: Fairness should recognize "growth." If the pie grows in your direction (without harming my options), your share should rise.  
  - **Nash chooses IIA**: Stability over expansions.  
  - **KS chooses monotonicity**: Responsiveness over expansions.  

  ### The Ideal Point: Anchor or Mirage?  
  - **KS relies on it** to define "proportional gains." Critics argue:  
    - It’s *unattainable* (a fantasy), and shifts with disagreement points (e.g., if threats change, "hopes" change).  
    - *Defenders* counter: It reflects *aspirational fairness*—what each *could* achieve if the other conceded everything. It’s the only symmetric anchor under scale invariance.  
  - **Nash rejects it** as volatile, using only the *disagreement point* and *current options*.  

  ### Proportional Gains & Interpersonal Comparisons  
  - **Scale invariance rescues KS**: By allowing utility rescaling, it avoids *cardinal* comparisons. Gains are proportions of *each player’s own scale*.  
  - **But in practice**: Saying "you get 80% of your max, I get 80% of mine" *feels* like comparison. Critics argue this smuggles in *equal sacrifice* ethics, which *is* interpersonal.  
  - **Nash sidesteps this**: Maximizing the product avoids direct gain comparisons but implicitly weights utilities (e.g., risk-averse players get less).  

  ### Non-Convex Feasible Sets: The House of Cards  
  If the feasible set isn’t convex (e.g., lumpy investments, legal constraints):  
  - KS’s "ideal point" may be **misleading** (e.g., Player 1’s "max" might require Player 2’s cooperation).  
  - The line from disagreement to ideal might **miss the feasible set entirely**.  
  - **Result**: Both solutions lose axiomatic guarantees. Real-world bargains often involve "package deals," exposing theory’s limits.  

  ### What the Sisters Are Really Arguing About  
  - **Nash advocate (e.g., cash-focused sister)**: Believes fairness is about *stability* and *current leverage*. ("Why should my share shrink just because *your* opportunities improved?")  
  - **KS advocate (e.g., land-focused sister)**: Believes fairness requires *recognizing potential*. ("You got new cash options—why shouldn’t I benefit from the land’s full value?")  
  **Underneath**: A clash over **moral reciprocity**. Is fairness honoring the *past* (disagreement point, existing assets) or the *future* (ideal point, latent value)? One sees justice as *consistency*; the other as *aspiration*.  

  *Final note for your scene: Their dead father’s shadow looms here. Nash mirrors "dividing what exists"; KS echoes "honoring what could be." Neither is objectively right—that’s the tragedy.*
