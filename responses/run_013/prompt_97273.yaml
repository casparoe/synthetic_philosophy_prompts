prompt: |-
  I am a third-year undergraduate reading philosophy, and the module that has prompted this request is a second-year course on Hellenistic ethics and its modern reception. For the past year I have also volunteered two evenings a week at our student-run listening service, where we offer peer support rather than counselling. We are trained in active listening and in knowing when to refer someone onward, but we have no clinical training and no shared framework for the thing that comes up constantly: a student arrives either convinced that some situation is intolerable and wholly outside their hands, or convinced that they must somehow secure an outcome that plainly is not theirs to secure. I have been trying to work with the Stoic distinction between what is and is not attributable to us, which the popular revival has flattened into the slogan that we should simply focus on what we can control, and I keep running into two problems: the popular version is not, as far as I can make out, what the texts actually say, and it is also unusable as it stands, because almost nothing a student brings us is either entirely ours or entirely not ours. There is a further Stoic idea I find more promising but much harder to put to a peer supporter in the ten minutes we have: that one should throw oneself into an action wholeheartedly while attaching a condition to its success, committing to do one's own part while accepting that the upshot depends on matters outside one's agency (sometimes called acting with a reserve clause). I should like the procedure to take this seriously, and also to do justice to the three areas the Stoic tradition distinguishes in the mind of the practitioner: the discipline governing what one desires and fears, the discipline governing one's impulses to act, and the discipline governing whether one assents to the impressions that present themselves.

  Please write us a decision procedure, in the form of a checklist or a flow set out in words, that a peer supporter with no philosophy background can run inside a thirty-minute conversation. It should sort a student's presenting worry into three categories: what is genuinely a matter of their own judgement or choice; what is a matter of their action but not of its outcome; and what is neither, together with what the supporter should do or say at each branch. It needs to keep faith with the Stoic account rather than the slogan, so please make the difference between complete control and mere influence do real work, and build the reserve clause in as a step rather than a footnote. It must state explicitly where the procedure stops and hands the conversation to a person, whether that is our shift supervisor, the counselling service, or the police, and where the Stoic framing is actively dangerous rather than helpful. Then run it end to end on three cases: a student who has just been rejected after the final round of interviews for a graduate scheme and cannot stop rehearsing what he should have said; a student who is being persistently belittled by a flatmate and is beginning to wonder whether she is overreacting; and a student who is terrified of an upcoming examination and is convinced that whether he passes is a matter of pure luck. At least one of the three should be a case where the procedure tells the peer supporter something they will not want to hear. Please be candid throughout about which steps are really just judgement calls dressed up as method, and about which students this whole approach will misfire on. Kindly write your answer in British English.
reasoning: |-
  Okay, the user is a third-year philosophy undergraduate who volunteers at a student listening service. They're dealing with students who struggle with situations they perceive as either entirely out of their control or entirely within their control. The user has been trying to apply Stoic principles, specifically the dichotomy of control, but finds the popular version oversimplified and impractical. They mention two main issues: the popular slogan doesn't match the original texts, and most real-life cases involve elements both within and outside a person's control.

  The user wants a decision procedure that peer supporters without philosophy backgrounds can use in 30-minute conversations. This procedure should categorize concerns into three areas based on Stoic disciplines: judgment/choice, action but not outcome, and neither. It must incorporate the reserve clause (committing to action while accepting outcomes) and explicitly state when to refer cases to professionals. They also want three case examples, including one where the procedure gives uncomfortable advice, and honesty about limitations.

  Breaking down the requirements: The procedure needs to be accessible, structured as a checklist or flowchart, and grounded in authentic Stoicism. The three categories must align with Epictetus' disciplines: desire/fear (judgment), impulse (action), assent (evaluating impressions). The reserve clause should be a core step, not an afterthought. Safety protocols are crucial—flagging when Stoicism is inappropriate (e.g., abuse, mental health crises). 

  For the cases:  
  - Graduate scheme rejection: Focuses on post-event rumination. The procedure should highlight controllable aspects (learning from experience) versus uncontrollable (interviewer bias), using reserve clause for future attempts.  
  - Belittling flatmate: Involves relational harm. Must distinguish controllable actions (setting boundaries) from uncontrollable outcomes (flatmate's reaction), while emphasizing that enduring abuse isn't Stoic "acceptance"—referral is key here.  
  - Exam fear: Addresses locus of control. Controllables include study efforts; uncontrollables include exam content. The reserve clause applies to preparation, but "luck" framing needs challenging via assent discipline.  

  The "uncomfortable advice" case is likely the flatmate scenario: The supporter might need to hear that Stoicism doesn't require tolerating abuse, and referral is necessary.  

  Limitations to address: Some steps (e.g., judging "sufficient effort") are subjective. Stoicism may misfire for trauma survivors (misinterpreted as blaming) or those needing validation. Also, the 10-minute reserve clause explanation is ambitious—prioritizing brief phrasing is essential.  

  Structure the procedure linearly: Start with safety checks, then categorize the concern using probing questions, apply the appropriate discipline/reserve clause, and end with referral triggers. Use plain British English ("flatmate" not "roommate," "revise" not "study").  

  Finally, candid disclaimers: Peer supporters aren't therapists; Stoic tools are situational; and judgment calls are inevitable in steps like assessing "reasonable action."
answer: |-
  Here is a peer support decision procedure grounded in authentic Stoic principles, designed for a 30-minute conversation. It prioritises safety, distinguishes control from influence, integrates the reserve clause, and acknowledges the three Stoic disciplines.

  **The Stoic Peer Support Procedure: Navigating Agency & Acceptance**

  **Core Principles for the Supporter:**
  1.  **You are not a counsellor or advisor.** Your role is active listening and *facilitating the student's own clarity* using this framework.
  2.  **Safety First:** Always prioritise immediate risk. Stoicism is irrelevant in crises.
  3.  **"Control" is Misleading:** Focus on identifying *what is genuinely "attributable" (eph' hēmin)* – the student's judgements, choices, impulses to act, and assent to impressions. Almost nothing else is truly under their *complete* control. Influence ≠ Control.
  4.  **Reserve Clause is Key:** This isn't resignation; it's wholehearted effort coupled with acceptance that the *outcome* isn't solely yours. It's the core of managing the gap between action and result.
  5.  **Three Disciplines Guide:**
      *   **Discipline of Desire/Fear (Judgement):** What outcomes am I wrongly treating as good/bad *in themselves*? What is truly good/bad (virtue/vice)?
      *   **Discipline of Impulse (Action):** What action, based on reasoned choice, is appropriate here? What is "my own part"?
      *   **Discipline of Assent (Impression Management):** Am I uncritically accepting an initial impression (e.g., "This is intolerable," "I *must* succeed")? Is this impression accurate and helpful?

  **The Procedure:**

  1.  **Immediate Safety & Grounding (3-5 mins):**
      *   **Listen Actively:** Start with empathy. "That sounds incredibly tough/stressful/upsetting."
      *   **Assess Risk:** *Explicit Check:* "Right now, just so I understand where things are at: are you feeling safe? Are you having any thoughts about harming yourself or someone else?" OR "Is anyone in immediate danger?"
      *   **Referral Point 1 (Crisis):** **IF YES to harm/danger:** Pause the Stoic process. Follow your service protocol IMMEDIATELY (Shift Supervisor/Counselling Service/Police). *Stoicism is actively dangerous here.*
      *   **Clarify the Worry:** Help them articulate the core concern. "So, the main thing causing you distress right now is... [paraphrase]?"

  2.  **Categorising the Worry (Probing Questions - 10-15 mins):**
      *   Probe using the disciplines. Ask questions to help *them* explore:
          *   *"When you think about [the worry], what specific outcome are you hoping for or afraid of?"* (Probes Desire/Fear - *Focuses on their Judgement*)
          *   *"What parts of this situation feel like they depend entirely on you? What parts feel entirely outside your reach?"* (Probes Assent - *Challenges initial impressions of control/lack of control*)
          *   *"Looking at what *is* within your reach, what actions have you considered taking, or are you already taking, that feel like *your* part?"* (Probes Impulse - *Focuses on Action*)
          *   *"If you did everything you reasonably could, what might still prevent the outcome you want? Or cause the outcome you fear?"* (Probes the boundary of Control/Influence - *Sets up Reserve Clause*)
      *   **Categorise based on their answers:**
          *   **A) Primarily a Matter of Judgement/Choice (Desire/Fear/Assent):** The distress stems *mainly* from how they are evaluating the situation internally (e.g., catastrophising an outcome, demanding certainty, misjudging what is truly good/bad). *Controllable Element:* Their own judgements and evaluations. *Example:* Belief that failing an exam = total personal worthlessness.
          *   **B) Primarily a Matter of Action, Not Outcome (Impulse + Reserve Clause):** The student can take reasoned action, but the *result* depends significantly on external factors. *Controllable Element:* Their choice of action, effort, intention. *Uncontrollable Element:* The final outcome. *Example:* Preparing thoroughly for an exam vs. the specific questions asked or marker's interpretation.
          *   **C) Primarily Neither (External Circumstance):** The core issue genuinely involves significant external factors, harm, or injustice where their direct agency over the situation or outcome is minimal *and* the distress is a valid response to externals. *Controllable Element:* Only their internal response (judgement/assent) and potentially *how* they seek external support. *Example:* Being subjected to persistent belittling; a global pandemic disrupting plans.

  3.  **Support Strategy Based on Category (5-10 mins):**
      *   **A) Judgement/Choice Focus:**
          *   **Support:** Gently challenge the underlying judgement. "What makes [the feared outcome] feel so unbearable?" "Is there another way to look at what 'success' or 'failure' means here?" "Is the thought '[Catastrophic Thought]' entirely accurate, or could there be another perspective?" (Applies Discipline of Assent & Desire).
          *   **Goal:** Help them see their judgement *is* within their power to re-examine. Shift focus from controlling the external to managing their internal evaluation.
          *   **Reserve Clause Integration:** Less prominent here, but implicit: They can choose *how* they judge the situation.
      *   **B) Action Focus (Reserve Clause Central):**
          *   **Support:** 1. **Clarify "Their Part":** "So, what does doing *your* part look like here? What actions align with your values/reason in this situation?" (Discipline of Impulse). 2. **Introduce Reserve Clause:** "Stoics suggest we can throw ourselves into doing that part *wholeheartedly*, while also holding in mind something like: *'...as long as nothing outside my control prevents it,' or '...while accepting the final outcome isn't solely mine to command.'* How does that land for you? Can you see a way to commit to your effort *and* make peace with the parts you can't dictate?" (Key Step - Links Impulse to Acceptance of Externals).
          *   **Goal:** Separate effort from outcome. Validate their agency over action while fostering acceptance of external influence. Prevent "I did my part, so I *must* succeed" thinking.
      *   **C) Neither (External Focus):**
          *   **Support:** Validate the difficulty. "It makes complete sense you'd feel [emotion] given [situation]. This sounds like a really tough external circumstance." Focus on their *response*: "Given this is largely outside your hands, what *is* within your power right now? Is it how you take care of yourself? How you seek support? How you manage your own feelings about it?" (Applies Discipline of Assent/Judgement to their response).
          *   **Referral Point 2 (External Harm/Complexity):** **IF** the external factor involves significant harm, injustice, abuse, complex trauma, or systemic issues (e.g., discrimination, harassment, severe bullying, significant mental health history): *Explicit Check:* "This sounds like a situation with a lot of external pressure/harm. Would it be helpful to think about talking to [Counselling Service/Student Support/Report to University]? They have more resources for navigating these kinds of complex external challenges." *Stoicism can misfire here if misinterpreted as passive acceptance of harm or injustice.*
          *   **Goal:** Validate the externality, prevent self-blame, focus on self-care/accessing appropriate support, manage internal distress *about* the external.

  4.  **Summarise & Next Steps (2-3 mins):**
      *   Briefly recap the categorisation and key insight (e.g., "So, we identified that while you can control your preparation, the exam questions are outside your control, so focusing on doing your part thoroughly while accepting that uncertainty might be the path?").
      *   Ask: "What feels like the most useful takeaway from this chat?"
      *   **Referral Point 3 (Ongoing Need):** **IF** distress remains very high, the situation is complex, or further support is needed/wanted: "Would you like me to help you look into contacting [Counselling Service/Relevant Uni Support]?" or "Would you like the details for our shift supervisor to chat further another time?"
      *   Thank them for sharing.

  **Where Judgement Calls Are Necessary (Be Candid):**
  *   **Categorisation (Step 2):** Distinguishing between B (Action/Outcome) and C (Neither) can be nuanced. How much influence *does* the student truly have? Is the distress primarily internal (A) or reactive to externals (C)? *This relies on the supporter's listening and the student's articulation.*
  *   **"Reasonable Action" (Step 3B):** Defining the "part" is subjective. What is sufficient, rational effort? *This is co-created with the student, not dictated.*
  *   **Assessing "Sufficient" Control for Stoic Focus (Step 3A vs 3B/C):** Is the locus *primarily* internal? *Requires weighing the student's narrative.*
  *   **Referral Thresholds (Points 1, 2, 3):** Judging risk, harm severity, and need for escalation is critical and subjective. *Training on risk assessment is essential beyond this procedure.*

  **Where Stoicism Might Misfire:**
  *   **Acute Crisis/Suicidality:** (Referral Point 1) - Needs urgent professional intervention, not philosophy.
  *   **Experiences of Trauma/Abuse/Systemic Oppression:** (Referral Point 2) - Can be invalidating if the focus on internal control minimises real external harm or implies blame. Needs trauma-informed support.
  *   **Clinical Depression/Anxiety Disorders:** While Stoic ideas *might* complement therapy, they are not a substitute. Requires clinical assessment and treatment.
  *   **Personality Styles:** May feel invalidating or blaming for individuals prone to self-criticism or struggling with perceived lack of agency. Needs careful framing and possible alternative approaches.
  *   **When Validation is Paramount:** Sometimes deep, non-judgmental validation is needed *before* any analytical framework can be applied.

  **Case Applications (British English):**

  1.  **Graduate Scheme Rejection (Rehearsing "Should Haves"):**
      *   **Procedure Path:** Safety Check (Clear). Worry: Distress over past failure, rumination. Probing reveals: He believes his performance *alone* determined the outcome (Faulty Assent - ignores interviewer bias, competition, company fit). He focuses entirely on the uncontrollable past ("should haves").
      *   **Categorisation:** **A) Primarily Judgement/Choice.** His distress stems from judging the rejection as catastrophic (Desire/Fear) and assenting to the impression "My failure proves I'm inadequate" (Assent). He's trying to control the uncontrollable (the past).
      *   **Support:** Challenge the judgement: "What makes not getting *this* scheme feel so devastating? Does it truly define your worth or future?" Challenge the assent: "Is the thought 'I could have controlled it all if I said X' entirely accurate? Were there factors outside your control?" Focus on controllable present judgement: "What's a more balanced view? What *can* you learn from this experience that *is* within your control for next time?" Reserve Clause less central here, but future applications would fit B.
      *   **Referral?** Unlikely unless rejection triggers deeper crisis or depression.
      *   **Uncomfortable?** He might not want to hear that his rumination is misplaced effort and that the past is uncontrollable. He wants a "fix," not acceptance.

  2.  **Persistent Belittling by Flatmate (Wondering if Overreacting):**
      *   **Procedure Path:** Safety Check (No immediate harm, but check: "Does it ever feel threatening?"). Worry: Distress from external behaviour, self-doubt. Probing reveals: She *can* take action (talk to flatmate, request mediation, consider moving - Discipline of Impulse). The outcome (flatmate changing, mediation working) is not guaranteed (Reserve Clause needed). However, the core issue is significant external harm (belittling) causing valid distress.
      *   **Categorisation:** **C) Primarily Neither (External Circumstance) with a B element (Action).** *Crucially, the harm is ongoing and external.* Her questioning if she's "overreacting" suggests problematic assent/judgement (Discipline of Assent - minimising harm).
      *   **Support:** **Validate:** "Being persistently belittled sounds really unpleasant and undermining. Your feelings make sense." **Focus on Response & Referral:** "What *is* within your control is how you respond and seek support. Have you considered speaking to your flatmate calmly? Or contacting your accommodation office/student support for mediation? Would you like help looking into that?" **Challenge Assent (Carefully):** "You mentioned wondering if you're overreacting. Often, if behaviour consistently makes us feel bad, it *is* a problem worth addressing, regardless of intent." **Emphasise Referral:** "Dealing with difficult living situations is tough. Would you like me to give you the details for [Student Support Services/Accommodation Office]? They deal with this often."
      *   **Referral?** **YES (Referral Point 2 - External Harm/Complexity).** Strongly encourage Student Support/Accommodation Office. Stoicism misfires if it encourages passive acceptance of abuse or makes her feel responsible for the flatmate's behaviour.
      *   **Uncomfortable?** The supporter might not want to hear that this *needs* referral (it's not just "mindset") and that the focus must be on external action/support, not just internal acceptance. The student might not want to confront the flatmate or involve authorities.

  3.  **Terrified of Exam (Convinced Passing is Pure Luck):**
      *   **Procedure Path:** Safety Check (Clear). Worry: Fear of failure due to perceived lack of control. Probing reveals: He *can* revise, practice questions, manage study time, look after health (Discipline of Impulse - "his part"). The exam content, specific questions, marking nuance are outside his control. His belief "It's all luck" is a faulty assent (Discipline of Assent) leading to helplessness and fear (Discipline of Desire - treating passing as an absolute good he has no agency towards).
      *   **Categorisation:** **B) Primarily a Matter of Action, Not Outcome.** He has significant influence (his preparation), but not complete control over the result.
      *   **Support:** **Clarify "His Part":** "Okay, so while the specific questions are unpredictable, what *is* within your control between now and the exam? What does doing your part – your best reasonable preparation – look like?" **Introduce Reserve Clause:** "So, how about focusing your energy completely on *that* plan – the revision, the past papers, the self-care? And alongside doing that wholeheartedly, could you hold the thought: *'I'll give it my best shot, while accepting the result depends on factors I can't control'*? It's about committing to your effort *and* letting go of demanding a specific outcome." **Challenge Assent:** "The thought 'it's all luck' – does that help you prepare? Is it entirely true, given the effort you *can* put in?"
      *   **Referral?** Possibly if anxiety is paralyzing (Referral Point 3 - Counselling Service for anxiety management techniques), but the core framework fits well here.
      *   **Uncomfortable?** He might resist accepting any outcome uncertainty and demand absolute control he doesn't have. He might not want to hear that effort doesn't guarantee success.

  This procedure provides a structured yet flexible Stoic-informed lens for peer supporters, emphasising the crucial distinctions in agency, integrating the reserve clause, flagging risks, and acknowledging the inherent need for professional judgement and referral when appropriate. Remember: its value lies in facilitating the student's own insight, not providing answers.
