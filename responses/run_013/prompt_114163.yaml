prompt: |-
  I spent thirty years as an analytical chemist and the last few years reading moral and political philosophy, mostly on corruption. I keep meeting a pattern in the ethnographic writing that I cannot find a name for, and I would rather have the analysis than the label. In one case a customs post posts its charges on a board by the door: the payment is open and fixed, and goes to the office, which uses it to top up salaries that everyone, ministry included, knows are nominal. An external audit calls this extortion; the clerks and the traders who pay call it the price of getting goods through; nobody disputes what changed hands. In another case a family keeps a ledger of gifts given and received at weddings and funerals, and the returns are deliberately never exact, since an exact return would be read as ending the relationship. A consultant's report calls this gift exchange shading into bribery; the families think the report has misunderstood what a gift is. In both cases the facts are agreed and only the identity of the act is in dispute. Is there an established name for acts of this kind, whose identity is fixed not by their content but by the normative order they sit inside, so that one and the same transfer is a different act under two orders? I assume this is somewhere near the gift-and-commodity literature, legal pluralism, and the notion of institutional facts, but none of those seems to be quite it. What I want is the carving, not the term: what the phenomenon is, how it differs from ordinary moral disagreement and from relativism about moral truth, and where its edges lie — in particular whether corruption names a property of acts or a relation between an act and the order that judges it, since that seems to be what is really at stake when people argue about whether anti-corruption standards are universal.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've spent 30 years as an analytical chemist and recently delved into moral and political philosophy, focusing on corruption. They've noticed a pattern in ethnographic writing where the same act is interpreted differently based on the normative order it's part of. The examples given are a customs post with fixed charges seen as extortion by auditors but as a necessary fee by clerks and traders, and gift exchanges in family ledgers viewed as potential bribery by consultants but as relationship-building by the families.

  First, I need to understand the core issue. The user points out that the facts of the acts aren't disputed, but their identity changes depending on the normative framework. They're looking for a concept that captures this phenomenon without necessarily needing a label. They mention existing theories like gift-and-commodity literature, legal pluralism, and institutional facts but feel those don't quite fit. Their deeper questions are about whether corruption is a property of acts or a relation between acts and the judging order, and how this differs from moral relativism.

  I recall Searle's institutional facts where meaning is assigned by collective intentionality. The customs fee isn't just money; it's a fee within that system. Similarly, Mauss's gift economy emphasizes the social bond over the object's value. But the user wants more than references; they want the dissection of the phenomenon.

  Next, differentiating from moral disagreement. Here, the conflict isn't over facts but over the interpretive framework. It's structural, not about values. Then there's relativism. The user wants to avoid that trap. The answer should clarify that the disagreement is about which normative framework applies, not that all are equally valid universally. Anti-corruption standards might be universal in principle but clash with local systems.

  The user's unspoken need might be to reconcile their scientific background with philosophical analysis. As a chemist, they're used to empirical data, but here, the same data has multiple valid interpretations based on context. They need a framework that acknowledges objectivity in facts but subjectivity in categorization.

  I should also address the corruption question directly. Corruption here is a relation, not an inherent property. An act becomes corrupt when it violates a specific normative order. Anti-corruption efforts might impose one framework, ignoring local systems, causing friction.

  Key points to cover: the role of constitutive rules, the distinction from moral relativism, and the relational nature of corruption. Emphasize the carving, not just terms. Use their examples to illustrate each point. Make sure to tie it back to their concern about universal standards versus local practices.
answer: |-
  Your observation cuts to the heart of social ontology and the contested nature of social reality itself. You're precisely identifying a phenomenon where **the same physical act or transaction is constituted as a fundamentally different *type* of social act depending on the normative-institutional order within which it is embedded and interpreted.** This isn't merely moral disagreement *within* a shared framework; it's a conflict *over* which framework applies to constitute the act's meaning and identity.

  Here's the carving, drawing on the traditions you mentioned but focusing on the phenomenon:

  1.  **The Core Phenomenon: Constitutive Rules and Institutional Facts:**
      *   Social acts (like paying a fee, giving a gift, bribing, voting, marrying, promising) are not defined solely by their physical components (handing over money, signing a paper). They are defined by **constitutive rules**.
      *   Constitutive rules take the form: "X counts as Y in context C." (Searle is key here).
      *   *Handing over currency (X)* counts as *paying an official fee (Y)* within the context (*C*) of a formal bureaucratic system with published rules and state authority.
      *   *Handing over currency (X)* counts as *a bribe (Y)* within the context (*C*) of an idealized Weberian bureaucratic system demanding strict impartiality and separation of office from personal gain.
      *   *Giving an object of value (X)* counts as *a gift sustaining social bonds (Y)* within the context (*C*) of a reciprocal kinship/community system with norms of delayed/incomplete return.
      *   *Giving an object of value (X)* counts as *a bribe (Y)* within the context (*C*) of a formal legal system prohibiting certain exchanges to influence officials or gain undue advantage.
      *   **The phenomenon you describe occurs when the *same physical act (X)* is simultaneously subject to competing constitutive frameworks (C1 vs. C2), resulting in conflicting social act identities (Y1 vs. Y2).** The facts of the physical transaction are undisputed; the dispute is over which "counts as" rule applies to give it social meaning.

  2.  **Distinguishing from Ordinary Moral Disagreement:**
      *   **Ordinary Disagreement:** Parties agree on the *type* of act (e.g., "this is a lie") but disagree on whether lying is *morally permissible* in this specific instance, or on the severity of the wrong. They share the constitutive framework ("intentional deception counts as lying").
      *   **Your Phenomenon:** Parties disagree fundamentally on *what kind of act it even is* ("Is this a fee or a bribe?", "Is this a gift or a bribe?"). They operate with different constitutive rules defining the act's very identity. The moral evaluation flows *from* this prior classification.

  3.  **Distinguishing from Relativism about Moral Truth:**
      *   **Moral Relativism:** Asserts that moral *values* (good/bad, right/wrong) are not universal but relative to cultures or individuals. It often presumes agreement on the *description* of the act.
      *   **Your Phenomenon:** The disagreement is **ontological** (what *is* this thing?) before it becomes evaluative. It's about the social *construction* of reality, not just the valuation of a shared reality. It highlights that social acts *are* constituted by the rules of the system they inhabit. An external framework doesn't just judge the act differently; it *reconstitutes* it as a different type of entity. This doesn't necessarily entail full-blown relativism; one can argue that one constitutive framework *should* dominate (e.g., the state legal framework *should* override local patronage norms), but this requires justification *beyond* simply pointing to the physical act.

  4.  **The Edges and Key Implications:**
      *   **The Role of Power:** Which constitutive framework prevails is often a function of power. The state imposing its audit framework on the customs post, or the consultant applying Western corporate ethics to the gift ledger, demonstrates power to define reality. Locals resisting are asserting the validity of their own constitutive order.
      *   **Plural Legal Orders/Institutional Logics:** This phenomenon thrives where multiple normative orders coexist and compete (e.g., state law vs. customary law vs. religious law vs. market logic vs. community ethics). Actors navigate these overlapping fields, and an act constituted legitimately in one may be illegitimate in another.
      *   **"Gift vs. Commodity" Connection:** Mauss (and later, Gregory, Parry, Bloch) showed how gifts are fundamentally about creating and maintaining social relationships, while commodities are about alienable exchange. Your examples show how an act intended or constituted as "gift" (relationship-building) within one order is misrecognized or forcibly reconstituted as "commodity" or "bribe" (purely instrumental exchange) by an external order lacking the understanding of the relational context. The "shading into bribery" comment is the consultant's failure to grasp the constitutive rule of the gift economy.
      *   **Corruption as a Relational Property (Your Key Question):**
          *   **Corruption is fundamentally a relational property, not an inherent property of the act itself.** An act becomes "corrupt" only when it **violates the constitutive rules and norms of a *specific* normative order that claims jurisdiction over it.**
          *   In the customs post, *within the local constitutive order* (published fee, collective salary top-up, accepted by traders), the act is constituted as a legitimate "fee" or "necessary cost." *Within the external auditor's constitutive order* (idealized bureaucratic impartiality, salary solely from treasury), the *identical physical transaction* is constituted as "extortion" or "bribery."
          *   The families see their ledger entries constituted as "gifts" within their relational order. The consultant, applying a different constitutive framework (perhaps one emphasizing potential influence or strict fungibility), reconstitutes them as "bribery."
          *   **Therefore, declaring an act "corrupt" is always an assertion:** It asserts that (1) a particular normative order (e.g., the state legal framework, an international standard) is the *correct* or *dominant* framework for constituting the act, and (2) the act violates the constitutive rules *of that specific order*. The core dispute in anti-corruption efforts is often precisely over which constitutive framework *should* have primacy in a given context (Universal Standards vs. Local Norms). The act itself, physically, is neutral ground.

  **Conclusion:**

  The phenomenon you've identified is the **constitutive contestation of social acts.** It occurs when multiple, competing normative-institutional orders apply different "counts as" rules to the same physical event, generating conflicting social identities for that act (e.g., fee vs. bribe, gift vs. bribe). This is distinct from arguing *within* a shared framework or from relativism about values; it's a clash over the ontological framework itself. **Corruption, in this light, is not an inherent property of an act but a relational status: an act is corrupt *relative to* a specific normative order whose constitutive rules it violates.** The fierce debates over universal anti-corruption standards are, at their core, debates over which constitutive order (the universal standard or the local/system-specific practice) *should* define the reality of the acts in question. Your analytical chemistry background likely primes you to see the stable physical substrate (the money changing hands, the ledger entry), while your philosophy reading reveals the volatile, context-dependent social superstructure built upon it through constitutive rules. It's the mapping between the physical X and the social Y, and the battle over which context C provides the valid map, that defines this crucial phenomenon.
