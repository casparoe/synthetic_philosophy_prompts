answer: |-
  ### Bottom Line
  The socialist calculation debate survives translation into your vocabulary with partial fidelity: core arguments map to distributed optimization concepts, but critical residues persist regarding knowledge discovery and incentive compatibility. Lange's mechanism is indeed a primal-dual method, while Hayek's objections reveal fundamental constraints on information aggregation.

  ### Translation Table

  | **Original Claim**                     | **Technical Counterpart**                                                                 | **Loss/Distortion**                                                                                     |
  |----------------------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | **Mises (No prices for capital goods)** | Non-separable optimization problem lacking dual variables for intertemporal/scarce resources. No gradient exists for capital allocation without market-clearing signals. | Distortion: Mises emphasized *institutional impossibility* of rational allocation, not just technical non-separability. Loss: His deeper argument about economic calculation as a *coordination heuristic* in uncertainty. |
  | **Lange (Trial-and-error planning)**   | Primal-dual algorithm: CPB (central node) updates dual variables (prices). Agents (firms/workers) solve local problems: `min cost s.t. tech set` (firms), `max utility` (workers). Messages: resource demands/supplies → CPB; price broadcasts → agents. Convergence requires: convex tech/utility sets, no externalities, CPB has excess-demand oracle, strict monotonicity. | Distortion: Lange assumed political compliance with parametric rules. Loss: His model omitted capital investment dynamics – treated as static allocation. |
  | **Hayek (Dispersed knowledge)**        | Information constraints: Local agents hold private types (cost functions, utility, local constraints). Knowledge is: 1) Partitioned (each agent holds `f_i(θ_i)`), 2) Tacit (`θ_i` non-communicable or high communication cost), 3) Novel (some `θ_i` created *during* process). Revelation principle fails if `θ_i` unexplainable or uneconomical to transmit. | Distortion: Hayek focused on *practical inaccessibility*, not complexity-theoretic hardness. Loss: His "knowledge of time and place" includes entrepreneurial *interpretation* of signals. |

  ### Residue Report
  **1. Tacit/Inarticulate Knowledge:** This **exceeds standard "unknown feasible set" models**. Optimization formalisms assume all constraints/objectives are *representable* (even if probabilistic). Tacit knowledge implies some information lacks parameterization – e.g., a worker's skill at adapting machines, or an entrepreneur's hunch about demand. Your framework assumes agents can compute `argmax` given prices; Hayek argues some knowledge is *only expressible through actions* in a market. This is a **genuine limit**: no optimization algorithm can use information that no agent can articulate or encode.

  **2. "Calculation" vs. Complexity:** The debate is **not primarily about computational complexity** (time/space hardness) or communication complexity (bit minimization). It concerns **knowledge discovery**: markets as *processes generating information* (e.g., bids reveal valuations; profits signal resource scarcity). Lange's algorithm assumes a *fixed* environment with pre-existing (but dispersed) data; markets handle *emergent* knowledge (e.g., new technologies). "Calculation" is accurate for Lange but misleading for Hayek – his point is about **learning what to compute**.

  **3. Incentives/Political Economy:** This **is separable and mappable via mechanism design**, but with distortion. Lange assumed agents truthfully report demands and follow rules. In your terms: without proper incentive compatibility (IC), agents may misreport `∇f_i` or shirk. Political constraints (e.g., no firm exit, no bankruptcy) alter the "local problem" structure (e.g., non-convexities from soft budgets). The CPB's error-correction requires that prices impact *real resource flows* (not just messages); otherwise, it’s a simulation without feedback. This translates cleanly *if* you explicitly add IC/political constraints to the local agent problems.

  **4. Lange's Circularity:** **Yes, Lange's algorithm presupposes equilibrium knowledge.** The excess-demand oracle and parametric rules assume agents know their *equilibrium responses* (cost functions, demand curves) *ex ante*. But in Hayek's view, agents discover these only *through* the market process (e.g., a firm learns its cost function by experimenting). The algorithm is a **fixed-point iteration** for a known system, not an *exploration mechanism* for an unknown one. Convergence requires the problem to be "well-posed" from the start – precisely what Austrians disputed.

  ### Verdict on Residue
  The residue stems **both from framework limitations and Austrian insights**. Your vocabulary lacks tools for modeling:
  - **Knowledge creation** (beyond Bayesian updating of existing priors)
  - **Interpretive entrepreneurship** (agents generating novel `θ_i` from signals)
  - **Institutional heuristics** (calculation as a rule-of-thumb under radical uncertainty).

  However, the Austrians **overstated epistemic uniqueness**: markets also fail to capture tacit knowledge (e.g., R&D spillovers). Their "political dressing" charge has merit – Hayek's knowledge problem *enables* arguments for entrepreneurial liberty but doesn't *entail* them. The irreducible residue is that **distributed optimization models information *processing*; markets enable information *production***.
