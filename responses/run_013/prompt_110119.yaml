  ## Notebooks, Revisited

  The ink has thinned to sepia. Page after page,
  Mrs. Piper's hand described its arcs,
  her voice, that borrowed contralto, spoke.
  *Mrs. Verrall requests the time.* *Your sister feels the damp.*
  And here, my script: *Control claimed 'Philip'. Questioned re: Cambridge garden. Vague.*
  *It's cold here*, they’d insist, the claimed departed.
  I noted draughts, the grate gone slack,
  the sitter’s shawl drawn tight. A fact, not proof.

  One case dissolves like mist: coincidence,
  a guess informed by grief, a tremor read
  as signal in the dark. Yet twenty years
  of tremor, guess, and mist accrete—a weight
  that presses, unexplained. *Hands levitated.*
  *Raps recorded. Table tilt: 22 degrees.*
  The gas jets hissed; the host turned up the light.
  The circle broke. We fetched our coats. Went home.

  *It's cold here*, whispers the wanting in my skull,
  the hope that sought a crack in the great dark.
  The ink asserts that table rose, that name
  was spoken clear where none could know.
  The ink asserts the cold. The draught. The shawl.
  The ink asserts the number, the degree,
  the tremor, the coincidence, the pile.
  The silence after gaslight floods the room.

  *It's cold here*, simply, for the living man
  who shuts the book, bereft of final proof,
  who feels the draught, who draws his own coat close,
  who lifts the cover, starts again.

  The ink has thinned to sepia. Page after page...

  ---

  **Refrain Explanation:** The phrase "It's cold here" serves the three required roles: first as reported spirit speech, second as Sidgwick's inner longing, third as a plain statement about his physical state.
