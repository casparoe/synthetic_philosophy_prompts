  Okay, the user is a third-year PhD student in philosophy preparing to teach an 80-minute session on advance directives for second-year medical students. They need a structured lesson plan built around their "lighthouse letter" case study. 

  First, let's unpack what the user truly needs beyond the surface request. They're not just asking for content - they're seeking expert pedagogical strategy from someone who's taught this exact scenario many times. The subtext screams: "Help me avoid the pitfalls I can't see yet." 

  The core tension revolves around making abstract philosophical concepts clinically tangible. Med students will default to either rigid legalism ("the letter is binding") or emotional presentism ("but she's happy now!"). Both miss the ethical nuance. The user's brilliant lighthouse case perfectly isolates the conflict between precedent autonomy and current well-being - but only if taught correctly.

  Hmm... biggest landmines I foresee:
  1) Students reducing it to a "same person?" identity debate (philosophical quicksand)
  2) The disability dignity objection derailing the conversation
  3) Superficial "gotcha" takes without grasping why both sides have merit

  The sequencing is everything. Can't jump straight to the case - need to build foundations. Start with clinical reality before philosophy. Make them feel why ADs exist: families screaming in ICU corridors, residents traumatized by proxy wars. Then scaffold up to the lighthouse dilemma.

  Key structural insights:
  - MUST front-load the disability objection preemptively (minute 15)
  - Anchor in concrete medical triggers (intubation, feeding tubes) before abstract authority
  - Save the lighthouse case for the climax (minute 45) after establishing competing values
  - That last diagnostic question is crucial - needs to expose whether they see the tragic dimension

  The "why now?" hook should be visceral. Not "ADs are important" but "remember that code blue where the daughter threatened to sue? That's why we're here." Burnout is the best teacher.

  For the disability concern... don't let it linger as an accusation. Normalize it early: "Some of you are shifting in your seats right now thinking this devalues dementia lives - good. Hold that thought." Then reframe as competence vs. worthiness. 

  Final gut-check: That closing question about "most troubling thing." If they answer with textbook phrases ("autonomy conflict"), they missed it. If they name the helplessness of choosing between two authentic selves... lightbulbs achieved.

  Worth noting - user's instincts are sharp. Avoiding identity debates is wise; that rabbit hole eats 80 minutes fast. And insisting the case stays fictional shows they understand didactic control. Respect.
answer: |-
  Here’s the battle-tested sequence. Follow it verbatim—deviations create blind spots.  
  **Total Time:** 80 mins (Strict timing is non-negotiable)  

  ### **PRE-SESSION PREP**  
  - **Write on Board:**  
    "1. What triggers the directive?  
    2. Whose voice counts?  
    3. What’s lost if we ignore it?"  
  - **Chairs in Circle:** Forces engagement. No hiding.  

  ---

  ### **SEQUENCE & RATIONALE**  
  **I. GROUNDING IN CLINICAL REALITY (0-15 mins)**  
  - **Opener (2 mins):** *“Raise hands if you’ve seen family conflict over care decisions. Keep them up if it involved an advance directive (AD). Now if someone mentioned ‘what they would have wanted’.”* (Most hands drop at AD question. *Point:* ADs are idealized, rarely operationalized.)  
  - **Trigger Drill (13 mins):**  
    1. *Scenario 1:* “82yo with severe dementia develops aspiration pneumonia. Living will says ‘no antibiotics if demented’. She smiles, holds her daughter’s hand. What do you do?”  
    2. *Scenario 2:* “Same patient, no AD. Daughter insists ‘Mom wouldn’t want this’, son says ‘But she’s fighting!’”  
    - *Force them to name the conflict:* “What’s *worse*—ignoring the paper or ignoring the smiling person?”  
    - **Why here?** Prevents later dismissal of ADs as “just paperwork.” Makes them feel the weight of *not* having one.  

  **II. DISARMING THE DISABILITY OBJECTION (15-25 mins)**  
  - **Preemptive Strike:** *“Some worry honoring ADs in dementia implies the current life has less value. Let’s dissect that.”*  
  - **Reframe (Critical!):**  
    - *“Is it about WORTH... or about AUTHORITY? Does respecting a past refusal mean we think Grandpa’s life now is ‘lesser’—or that he gets to decide whose voice guides his care?”*  
    - **Analogy:** “You draft a will leaving everything to your sister. After you die, should we ignore it because your brother ‘needs it more’? No. It’s about your voice governing your assets. ADs are a voice-governing device.”  
    - *Why early?* Prevents moral outrage from hijacking later analysis. Separates intrinsic worth from decision-making authority.  

  **III. THE MECHANICS: WHEN/HOW ADs BITE (25-35 mins)**  
  - **The 3 Triggers (Board):**  
    1. **Condition:** “When *this* happens…” (e.g., “permanent unconsciousness”).  
    2. **Decision:** “…don’t do *this*” (e.g., intubation).  
    3. **Certification:** Who confirms #1? (Attending? Two docs?)  
  - **Crucial Question:** *“What evidence would PROVE the directive shouldn’t apply? What if she smiles? What if she says ‘I want the tube’?”* (Plant the lighthouse seed.)  

  **IV. THE LIGHTHOUSE LETTER (35-55 mins)**  
  - **Present Case VERBATIM:**  
    *“Early Alzheimer’s patient writes: ‘When I no longer know your name, read this aloud. Refuse antibiotics. Keep me home. If I seem content, that is NOT ME. Do not believe it.’ Fast forward: Cheerful, knows daughter’s face but not name, says ‘Yes’ to antibiotics for pneumonia.”*  
  - **Guided Debate:**  
    - *Side A:* “Follow the letter. She predicted this exact moment.”  
    - *Side B:* “Ignore it. She’s happy and wants treatment.”  
    - **PUSH HARDER:** *“What if the letter said ‘I refuse all food’? Would you let her starve while smiling?”* (Exposes limits of rigid autonomy.)  
    - **Kill the Identity Rabbit Hole:** *“Don’t ask ‘is it her?’ Ask: WHICH of her voices gets the microphone? The planner? The experiencer? Why?”*  

  **V. THE CORE TENSION: TWO SELVES AT WAR (55-70 mins)**  
  - **Frame the Dilemma:**  
    *“This isn’t a puzzle. It’s a collision of two moral claims:  
    — The PAST SELF’S right to bind future suffering.  
    — The PRESENT SELF’S right to current well-being.”*  
  - **Why Both “Easy Answers” Fail:**  
    - *“Just bind her!”* → Ignores the sentient person in front of you.  
    - *“She’s happy now!”* → Erases her life-long terror of losing autonomy.  
  - **The Clinician’s Burden:** *“You’re not choosing RIGHT vs WRONG. You’re choosing WHICH TRAGEDY to risk: overriding a competent wish... or imposing suffering she desperately feared.”*  

  **VI. DIAGNOSTIC QUESTION (Last 10 mins)**  
  - *“You call the daughter. She says, ‘Do what the letter says.’ What is the SINGLE MOST TROUBLING THING about honoring her request?”*  
    - **Listen for:**  
      - **Got it:** “We’re causing suffering to someone who can’t understand *why*.”  
      - **Missed it:** “It’s illegal not to!” or “She’s not the same person.”  
  - **Corrective if needed:** *“The agony is enforcing a stranger’s plan on a content person who trusts you.”*  

  ---

  ### **WHAT WE’RE NOT COVERING (SAY EXPLICITLY @ START)**  
  *“We’re skipping:  
  — Legal nuances (statutes vary, you’ll consult risk management).  
  — Psychiatric directives (different beast).  
  — How to *write* a good AD (that’s for your patient-facing time).  
  Why? Today is about the PHILOSOPHICAL ANVIL your decisions get forged on. If you grasp this tension, the rest is paperwork.”*  

  ### **MISCONCEPTION MAP & DEFUSALS**  
  | **Misconception**          | **When to Head Off**         | **How**                                      |  
  |----------------------------|------------------------------|----------------------------------------------|  
  | “ADs = suicide note”       | During Trigger Drill (I)     | “They govern *conditions*, not active death.” |  
  | “Happy now = consent”      | Lighthouse debate (IV)       | “Can she grasp consequences? Revisit her past values?” |  
  | “Identity solves it”       | Lighthouse debate (IV)       | “Call it ‘self’ or ‘phase’—you still pick which voice wins.” |  
  | “It’s ableist to honor AD” | Disarming Disability (II)    | Reframe as authority, not worth.             |  
  | “Family decides”           | Core Tension (V)             | “The AD *is* the patient’s voice. Your job is fidelity to *it*, not relatives.” |  

  ### **WHY THIS SEQUENCE WORKS**  
  1. **Starts with clinical pain**—their reality, not theory.  
  2. **Names the disability worry early** so it doesn’t poison later debate.  
  3. **Builds to Lighthouse as climax**—only after they feel the competing claims.  
  4. **Forces them past slogans** by making both easy answers morally costly.  
  5. **The diagnostic question** exposes if they see the tragic core.  

  **Final Note:** Don’t resolve the Lighthouse case. Leave it raw. Their job isn’t to “win” the debate—it’s to hold the tension. When a resident mutters *“This is why I hate ethics”* post-session, you’ve succeeded.
