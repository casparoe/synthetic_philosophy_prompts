              Unconditional association: positive (due to T->R)
              Conditional on S: the path T->S<-R induces a negative association. If the effects T->S and R->S are strong enough, then the conditional association may become negative.

          This is the classic example of "conditioning on a collider".

   Now, we write the two cases:

   Case 1: S is a confounder (common cause)

     Scenario: 
       Suppose we are studying a drug (T) for recovery (R). Let S be the severity of the disease (high or low). 
       Severity S causes both the treatment assignment and recovery: 
          - Doctors are more likely to give the drug to severe patients (S=high -> T=1).
          - Severe patients are less likely to recover (S=high -> R=0).

       Now, without considering severity, we might observe that the drug is given more to severe patients (who have a lower recovery rate) and less to non-severe patients (who have a higher recovery rate). Therefore, overall, the drug might appear to be associated with lower recovery (negative association). But wait, our problem says overall positive? 

       We need the aggregate association to be positive. How can we achieve that?

          We need to adjust the scenario: 

          Let's define:
            - S = 1 (severe), 0 (not severe)
            - Without treatment, severe patients have low recovery rate, non-severe have high.
            - The drug is effective: it increases recovery in both groups (so within each severity level, the drug is beneficial -> positive effect). But doctors tend to give the drug more to severe patients.

          Now, the aggregate association:

            In the severe group (S=1): 
              P(R=1 | T=1, S=1) > P(R=1 | T=0, S=1)  [because drug helps]
            In the non-severe group (S=0):
              P(R=1 | T=1, S=0) > P(R=1 | T=0, S=0)

            But overall, we might see a negative association because the severe group (which has lower recovery) is over-represented in the treated group.

          However, we need the overall association to be positive? 

          Actually, the problem states: overall T is positively associated with R, but within each subgroup of S, it is negatively associated. That is the reversal.

          In our scenario, within subgroups the association is positive (because drug works). So we need the opposite reversal: overall negative but within positive? 

          But the problem says: overall positive, within negative.

          Therefore, we must design a scenario for Case 1 that shows overall positive and within negative.

          How?

          We can reverse the assignments:

            Let S be a variable that is a common cause but such that:
              - S=1: healthy (or less severe) -> more likely to recover
              - Doctors are more likely to give the drug to healthy patients (S=1) because they are more responsive? 
              - But the drug is actually harmful: it reduces the chance of recovery.

            Then:

              Within S=1: 
                  T=1 (drug given) -> lower recovery than T=0? 
                  So negative association (because drug is harmful) within S=1.
              Within S=0: 
                  T=1 -> lower recovery than T=0? 
                  So negative within S=0.

            Now, overall:

              Since the drug is given more to S=1 (healthy) who are more likely to recover even without the drug, then the treated group (T=1) might have a higher recovery rate than the untreated (T=0) because the treated group has more healthy individuals.

            Therefore, overall we see a positive association between T and R (even though the drug is harmful) because of the confounding by S.

            This is the classic Simpson's reversal: the drug appears beneficial overall but harmful in each subgroup.

            So in this scenario, the true causal effect is negative (harmful) and is revealed in the subgroup analysis. The aggregate is confounded.

          Therefore, for Case 1:

            Causal graph: 
              S -> T  (S=1 increases T)
              S -> R  (S=1 increases R)
              T -> R  (negative effect: reduces R)

            The unconditional association between T and R is positive (because S is a confounder that causes both T and R, and it induces a positive association that overpowers the negative causal effect).

            Conditional on S, we remove the confounding and see the true negative effect.

          This matches the problem: overall positive, within each S negative.

   Case 2: S is a collider (common effect)

     Scenario:

       We want to see the effect of a drug (T) on recovery (R). There is a third variable S, say, the presence of a particular symptom after treatment.

       We assume:
          - The drug (T) has a true positive effect on recovery (R): T->R (positive).
          - Both T and R can cause the symptom S: 
               - The drug might cause the symptom (T->S, positive)
               - Recovery might cause the symptom (R->S, negative? because if you recover you are less likely to have the symptom? But note: we want a collider structure: T->S<-R. The direction of the arrows is crucial.)

          Actually, let's define:

            - T: drug (1=treatment, 0=control)
            - R: recovery (1=recovered, 0=not)
            - S: symptom (1=present, 0=absent)

          We suppose:
            - The drug (T) increases recovery (R) -> positive effect.
            - The drug (T) has a side effect that causes the symptom (T->S, positive effect: increases S).
            - Recovery (R) reduces the symptom (R->S, negative effect: so if R=1, then S is less likely).

          Now, note that S is a collider: T->S<-R.

          Unconditionally (without conditioning on S):
            - The association between T and R is positive (because T causes R).

          But when we condition on S (say, we look only at patients with a particular symptom status), we open the path T->S<-R. 

            This path creates a spurious negative association between T and R.

            Why? 
              Consider conditioning on S=1 (symptom present). 
              - If we see that a patient has the symptom (S=1), then if they took the drug (T=1) that might explain the symptom. But if they also recovered (R=1), that would explain the absence of the symptom. So to have the symptom present, if the patient took the drug (which tends to cause the symptom) then we would expect that the patient did not recover (so that the recovery doesn't prevent the symptom). Conversely, if the patient did not take the drug, then to have the symptom we might need the patient to not have recovered? 

            More formally: conditioning on S=1 makes T and R negatively associated because if T=1 (which increases the chance of S) and R=1 (which decreases the chance of S) then both together make S less likely. Therefore, if we observe S=1, it is more likely that T and R were not both present. So we see a negative association between T and R among those with S=1.

            Similarly for S=0: 
              If the symptom is absent, then if T=0 (so no drug-induced cause for the symptom) and R=0 (so no recovery to prevent the symptom) then we would expect the symptom to be absent? But also, if T=1 and R=1, then the drug causes the symptom but recovery prevents it, so they cancel? 

            Actually, conditioning on a collider induces an association regardless of the level. The sign of the association depends on the effects. In this case, T->S is positive and R->S is negative (so the product of the path is positive? and then the collider conditioning induces a negative association?).

            The rule: the association induced by conditioning on a collider is the product of the paths. The path T->S<-R: 
              - The effect of T on S is positive, the effect of R on S is negative. 
              - The association induced between T and R when conditioning on S is positive * negative = negative.

          Therefore, in both levels of S, we will see a negative association between T and R.

          Now, the true effect (positive) and the spurious negative association are both present in the conditional association. But we assume that the spurious association is strong enough to make the overall conditional association negative.

          So we have:
            Unconditional: positive association (T and R)
            Conditional on S: negative association (within each level of S)

          Therefore, the aggregate (unconditional) shows the true positive effect, but conditioning on S (the symptom) makes the drug look harmful.

          This matches the problem: overall positive, within each S negative.

          But note: in this scenario, the true causal effect of T on R is positive. The subgroup analysis is misleading because we conditioned on a collider.

   Now, we state the general principle:

     The decision to condition on a variable S should be based on the causal structure. We should condition on S if it is a confounder (a common cause of T and R) because that blocks the non-causal path and allows identification of the causal effect. We should not condition on S if it is a collider (or a descendant of a collider) on a path between T and R that does not go through S, because that opens a spurious path.

     More generally, we should condition on a set of variables that satisfies the backdoor criterion: blocks all spurious paths and does not open any new ones (by conditioning on colliders).

     What does this imply about "control for everything you can measure"?

     It is a bad idea. Controlling for a collider can induce bias. Controlling for a mediator (if we want the total effect) might also be problematic. Only confounders should be controlled for.

     Therefore, we must think about the causal structure to decide which variables to control for.

     Note: Sometimes we don't know the causal structure. Then we must rely on domain knowledge to build a plausible causal graph, and then decide what to condition on. If we condition on the wrong variables, we might introduce bias.

     Also, note that in some cases, we might have a mixture of confounders and colliders. Then we must condition on the confounders and avoid conditioning on colliders.

     In practice, using a causal graph (DAG) to reason about the variables is essential.

     Summary of principle:

        Condition on S if and only if S is a confounder (i.e., it is a common cause of T and R) or more generally, if it is a non-collider on a backdoor path between T and R.

        Do not condition on S if it is a collider on a path between T and R (or if it is a descendant of such a collider) and that path would otherwise be blocked.

     In the two cases:

        Case 1: S is a confounder -> condition on S.
        Case 2: S is a collider -> do not condition on S.

     Finally, note that from data alone (without causal assumptions) we cannot distinguish between these two scenarios. The data pattern (reversal) is the same. We need substantive knowledge about the causal structure.

     Therefore, the resolution of Simpson's paradox requires an extra-statistical (causal) assumption.

