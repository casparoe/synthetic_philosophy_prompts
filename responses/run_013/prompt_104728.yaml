prompt: |-
  Hey, so I'm a third-year undergrad in a Bayesian epistemology / confirmation seminar, and somehow I've ended up as the student rep on the committee writing our midterm (our prof is away at a conference and left question-writing to two grad students and me, which is its own story). We want one long essay question on the problem of old evidence, but the whole point is that it shouldn't be answerable by someone who's memorized the slogan "known evidence has probability 1, so it can't confirm" and then recited the usual fix. Our prof keeps saying the real difficulty is figuring out what the probabilities are even supposed to be over — whose credence, at what time, about what — and I want the question to force that.

  Here's what I want to build it around. Invent a student, call her Maya, who has known some fact E for years — make it concrete, like a medical regularity she's seen hundreds of times, or the way a certain moth always shows up before a certain flower blooms — and then years later she reads or derives a hypothesis H that entails E. Standard updating says nothing happens to her credence in H, but everyone agrees she's now more confident H is right. I want the question to make students do four things: (i) say exactly where the conflict is, and what assumption the updating rule is leaning on that makes it look like a problem at all; (ii) lay out two genuinely different repairs — one that recomputes what her credence in E *would* have been had she not already known it, and one that relocates the confirmation somewhere that doesn't need P(E) to drop below 1 — and say what each one buys and what each one costs; (iii) confront the twist that H was reverse-engineered from E, since she built the theory by staring at the data, so it's not clear the "would-have" repair should count that as confirmation at all, and say what extra machinery a Bayesian would need to separate genuine predictive success from retrofitting; and (iv) say whether the problem looks any different when it's the theory that's brand new rather than the evidence that's old, and why those two aren't the same problem.

  Can you write me the question itself (aimed at a 50-minute answer, so it should read as one substantial essay question rather than four seperate short ones), then a model answer of around 700 words that actually does all four, and a marking scheme out of 25 that names the specific moves an A answer has to make and the specific mistakes that should cost marks — things like treating the likelihood ratio and the posterior shift as the same thing, or assuming the "would-have" repair is free? Also flag anywhere a student could bluff with the slogan and still sound right, since I want the marking scheme to catch that, and note which single move seperates an A from a B.
