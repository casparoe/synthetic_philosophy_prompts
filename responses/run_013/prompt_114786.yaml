prompt: |-
  I am a novelist, and my current book has reached the stage where the scenes are written but the assumptions beneath them are not. The book turns on a question my craft cannot settle: whether one person can be brought to see that something is beautiful by another person's word alone. One of my characters is told weeks in advance that a particular recording will undo her, and it does; another reads a score at the piano and is moved before she has heard a note; a third buys a canvas on a dealer's description and looks at it properly only afterwards; a fourth has the ending of a novel spoiled for her and finds, to her surprise, that the spoiling deepens the thing. Each of those scenes is only as honest as my unexamined assumptions about what testimony can transmit in the aesthetic case, so I would rather have the specification before I commit to the draft.

  Please write the desiderata for a theory of aesthetic testimony — for an account of what passes from one person to another when one says that a thing is beautiful, or moving, or worth your evening. What must any adequate theory of this deliver? Set out the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse, and the results it must remain consistent with, and for each requirement name the case or consideration that puts it on the list. Mark, for each, whether you take it to be non-negotiable or merely the commitment of one camp wearing the costume of a requirement. My purpose is not philosophical tidiness but a standard I can write by: the theory should tell me when a character may honestly be moved by a report, when her deference to a better ear is rational rather than cowardly, and when she is only pretending to have seen for herself.

  I expect the list to have to deal with at least the following, and I would like you to say in each case whether it belongs on the list and why: the gulf between a work's non-aesthetic properties — attribution, date, technique, what happens in chapter nine — and its aesthetic ones, since the former travel by report without complaint; the difference between knowing that a work is good and being able to appreciate it; the difference between a reason to believe and a reason to go; the line between the evaluative and the merely descriptive in criticism; the parallel case of moral testimony, which has the same shape and may or may not want the same solution; the fact of trusted critics who disagree, which forbids any account that makes taste arbitrary; the plain fact, not to be wished away, that testimony is a source of knowledge about nearly everything else; and the awkward fact that readers act on reviews, jacket copy, and a friend's insistence all the time, so that no account may simply declare such deference worthless.

  Then the part I most want: any pair among these requirements you suspect cannot be satisfied together. I would rather learn that the specification is inconsistent now than discover it in a third draft. Tell me also which single requirement does the most to exclude candidate theories, and finish with a short pass over the main families of answer — that testimony can transmit aesthetic knowledge; that it cannot, and that acquaintance is required; that it can transmit belief but never appreciation or the rationality of caring — and how each fares against the list. Keep the weight on the criteria; the scorecard I can hold in my head. I want the requirements, not a reading list.
reasoning: |-
  Okay, this novelist has a fascinating problem. They've written scenes where characters are profoundly affected by aesthetic testimony - descriptions of art they haven't experienced directly - but they're questioning the philosophical foundations. The core question is whether words alone can transmit aesthetic appreciation.

  Hmm, the request is very precise: not just an explanation of aesthetic testimony theories, but a set of criteria to evaluate any such theory. They want to know what an adequate theory must explain, what cases it must handle, what distinctions it must preserve. Essentially, they need a benchmark to judge when their characters' reactions feel authentic versus forced.

  Let me unpack their specific concerns. First, the paradox: non-aesthetic facts (like "this painting is from 1650") transfer easily through testimony, but aesthetic qualities ("this painting is sublime") seem resistant. Then there's the gap between knowing something is good art versus actually feeling its power. Also important: the difference between having a reason to believe something is beautiful versus a reason to experience it yourself. 

  The moral testimony parallel is tricky - is being told "this is wrong" as problematic as being told "this is beautiful"? And practical realities can't be ignored: people constantly use reviews and recommendations, so any theory dismissing all testimony as worthless would ring false. Plus, critics disagree meaningfully, so taste isn't arbitrary.

  For the desiderata, we need both non-negotiables and camp-specific commitments. Non-negotiables include: testimony works for non-aesthetic properties; aesthetic properties depend on non-aesthetic ones; there's a gap between aesthetic knowledge and appreciation; testimony can provide practical reasons; deference happens in practice. 

  Then contested but important: the appreciation/knowledge distinction; the sui generis nature of aesthetic judgment; the possibility of genuine disagreement; moral testimony parallels. 

  Now for conflicts. The biggest tension is between epistemic deference (testimony works elsewhere) and acquaintance intuition (you must experience beauty firsthand). Any theory favoring one struggles with the other. Also tricky: reconciling meaningful disagreement with testimony's potential to transfer justification.

  The appreciation/knowledge distinction seems most disruptive - if appreciation requires firsthand experience, testimony can only give secondhand belief. This trips up many theories. 

  Looking at existing approaches: Optimism says testimony transmits knowledge/acquisition but struggles with appreciation gaps. Pessimism demands firsthand experience but ignores real-world deference. Acquaintance theories compromise by allowing belief transfer but not full appreciation. Hybrid models try to reconcile these. 

  For the novelist's purpose, the key is mapping when testimony-triggered reactions feel authentic. The desiderata help spot inconsistencies - like a character claiming profound appreciation from description alone, which might violate the appreciation gap unless carefully handled. Or showing rational deference versus empty pretension.
answer: |-
  Here is a specification of desiderata for a theory of aesthetic testimony, designed as a standard for narrative authenticity. Requirements are marked **(N)** for non-negotiable (widely accepted constraints) or **(C)** for contested (camp-specific commitments masquerading as necessities). Cases generating each requirement are specified.

  ---

  ### **Core Desiderata: What the Theory Must Deliver**

  1.  **The Non-Aesthetic Travels Freely (N)**
      *   *Requirement:* Explain why testimony reliably transmits knowledge of non-aesthetic properties (date, attribution, plot, technique) but faces unique hurdles with aesthetic properties (beauty, profundity, power).
      *   *Case:* Your character knowing "chapter nine contains the murder" vs. "chapter nine is devastating" solely on testimony. The former is unproblematic; the latter is the core puzzle.
      *   *Why Non-Negotiable:* Any theory denying this stark difference ignores the foundational phenomenon.

  2.  **The Knowledge-Appreciation Gap (N)**
      *   *Requirement:* Account for the distinction between *knowing that* X is beautiful/good/moving (potentially via testimony) and *appreciating* X (experiencing its beauty/goodness/power firsthand).
      *   *Case:* Your character reading a score and *knowing* it's complex/innovative vs. sitting at the piano and *feeling* its emotional impact upon playing/hearing. Or, knowing *that* the ending is "profound" via spoiler vs. feeling that profundity while reading.
      *   *Why Non-Negotiable:* Collapsing this gap renders incomprehensible the common experience of intellectual assent without visceral response, or vice versa.

  3.  **Testimony Provides Reasons to Engage (N)**
      *   *Requirement:* Explain why aesthetic testimony (e.g., reviews, trusted recommendations) provides *strong practical reasons* to seek out the experience (a "reason to go"), even if it fails to provide full epistemic justification for belief *that* it is beautiful *prior* to experience.
      *   *Case:* Readers acting on jacket copy or a friend's insistence, your character buying the canvas on the dealer's word. This deference demonstrably works *pragmatically* to guide people towards valuable experiences.
      *   *Why Non-Negotiable:* A theory making all such action irrational ignores ubiquitous, often successful, real-world practice.

  4.  **The Primacy of Acquaintance (C-but-Crucial)**
      *   *Requirement:* Explain why firsthand experience (acquaintance) seems uniquely necessary for *genuine appreciation* and often for *justified aesthetic belief*.
      *   *Case:* The character moved by the score only *after* playing it, despite knowing its properties; the character genuinely undone by the recording *only* upon hearing it, even if primed. The intuition that "you had to be there" (hear it, see it, read it).
      *   *Why Contested:* Optimistic theories (testimony *can* transmit belief/knowledge) downplay this; Pessimistic/Acquaintance theories make it central. For narrative authenticity, this intuition is powerful and likely non-negotiable *for depicting genuine appreciation*.

  5.  **Meaningful Disagreement is Possible (N)**
      *   *Requirement:* Allow for the possibility of genuine, rational aesthetic disagreement between competent, attentive, sincere judges. Taste cannot be purely arbitrary or subjective in a way that renders disagreement nonsensical.
      *   *Case:* Trusted critics offering incompatible evaluations of the same work, both backed by reasons. Your characters disagreeing sincerely about a work's merit after both experiencing it.
      *   *Why Non-Negotiable:* Without this, criticism reduces to mere personal preference reports, undermining the weight of testimony and the characters' potential conflicts.

  6.  **Epistemic Asymmetry with Non-Aesthetic Domains (N)**
      *   *Requirement:* Acknowledge that aesthetic testimony seems *less* reliable or direct than testimony about empirical facts or even many social conventions, despite being a source of knowledge elsewhere.
      *   *Case:* We readily accept testimony about the weather in London or the capital of France, but balk at fully accepting "this sunset is sublime" without seeing it. The "plain fact" you cite.
      *   *Why Non-Negotiable:* Denying this asymmetry ignores the core puzzle.

  7.  **The Evaluative-Descriptive Distinction in Criticism (C)**
      *   *Requirement:* Explain the relationship between descriptive criticism (pointing to non-aesthetic properties: "the harmony modulates unexpectedly here") and evaluative judgment ("it creates a profound sense of yearning"). How does the former support the latter, and can testimony transmit the *evaluative force*?
      *   *Case:* A critic describing techniques in detail *as reasons for* the work's beauty. Can reading this description alone transmit the judgment of beauty, or just the descriptive reasons?
      *   *Why Contested:* Some theories see the evaluation as separable or non-transferable; others see it as intrinsically linked to (but not reducible to) the description. Crucial for depicting critical discourse realistically.

  8.  **The Moral Testimony Parallel (Optional but Illuminating)**
      *   *Requirement:* Either explain why aesthetic testimony is significantly different from moral testimony ("this act is wrong") or embrace a unified solution. Both involve value judgments resistant to simple testimony.
      *   *Case:* Can testimony alone make someone *see* the wrongness of an act they don't intuitively grasp, akin to seeing beauty? Or are the structures fundamentally similar?
      *   *Why Not Strictly Required:* While structurally similar, one *could* hold distinct theories. However, a compelling account for aesthetics should at least consider its implications for this parallel to avoid ad-hoc solutions.

  ---

  ### **Key Tensions & Conflicts**

  1.  **Primacy of Acquaintance (4) vs. Epistemic Asymmetry (6) & Testimony Provides Reasons (3):**
      *   *Conflict:* If acquaintance is truly necessary for genuine appreciation or justified belief (4), how can testimony alone provide strong *epistemic* justification (contradicting 6) or even reliably provide strong practical reasons (3)? Resolving this tension is the *core challenge*. Theories often weaken (4) (e.g., testimony *can* give belief, but appreciation is separate) or reinterpret (3) (reasons are only practical/invitations, not epistemic).
      *   *Most Disruptive Requirement:* **The Primacy of Acquaintance (4)**. It fundamentally challenges the idea that aesthetic *properties* can be accessed secondhand in the way factual properties can. This requirement does the most to exclude purely optimistic theories that treat aesthetic testimony as epistemically straightforward.

  2.  **Meaningful Disagreement (5) vs. Acquaintance Primacy (4) (Potential Conflict):**
      *   *Conflict:* If appreciation/judgment *requires* direct acquaintance (4), how can disagreement be rationally adjudicated? If judgment is *so* tied to the immediate experience, does rational debate become impossible, threatening (5)? Theories must explain how reasons grounded in non-aesthetic properties (accessible via testimony/description) can be shared to support evaluations rooted in acquaintance.

  3.  **Knowledge-Appreciation Gap (2) vs. Optimism (Potential Conflict):**
      *   *Conflict:* If testimony *can* transmit aesthetic *knowledge* ("I know X is beautiful because Critic Y said so"), how does this relate to appreciation? Does knowing entail the capacity to appreciate? If not, the gap remains stark. If appreciation is necessary for knowledge, testimony's power is severely limited. Optimism struggles to respect the depth of the gap.

  ---

  ### **How Major Theories Fare Against the List (Brief Scorecard)**

  1.  **Optimism (Testimony Can Transmit Aesthetic Knowledge/Belief):**
      *   *Handles Well:* 3 (Reasons to Engage), 6 (Asymmetry - minimizes it), 8 (may parallel moral testimony).
      *   *Struggles With:* 4 (Primacy of Acquaintance - downplays it), 2 (Knowledge-Appreciation Gap - risks collapsing it), 5 (Meaningful Disagreement - may struggle if disagreement implies one party lacks knowledge). Risk: Makes genuine appreciation seem too easily transferable, potentially undermining the character's "undoing" as mere intellectual assent.

  2.  **Pessimism / Acquaintance Requirement (Testimony Cannot Transmit Aesthetic Knowledge/Justified Belief):**
      *   *Handles Well:* 1 (Non-Aesthetic Travels), 2 (Knowledge-Appreciation Gap - insists on it), 4 (Primacy of Acquaintance - core tenet), 7 (Evaluative-Descriptive - evaluation requires experience).
      *   *Struggles With:* 3 (Reasons to Engage - struggles to explain *strong* practical reasons), 6 (Asymmetry - accepts it but struggles to explain *why* aesthetics is unique), 5 (Meaningful Disagreement - hard to ground rationally if judgment is purely experiential). Risk: Makes critical discourse and deference seem irrational, contradicting your characters' actions and real-world practice.

  3.  **Hybrid/Partial Transmission (Testimony transmits belief/knowledge *that*, but not appreciation/ability; transmits reasons/invitations):**
      *   *Handles Well:* 1 (Non-Aesthetic Travels), 2 (Knowledge-Appreciation Gap - foundational), 3 (Reasons to Engage - core strength), 4 (Primacy of Acquaintance - respects it for appreciation), 5 (Meaningful Disagreement - possible through shared reasons/descriptions).
      *   *Struggles With:* 6 (Asymmetry - must explain *why* belief/knowledge *that* is harder/more limited in aesthetics), 7 (Evaluative-Descriptive - must explain how descriptions support evaluations without transmitting them). Most promising for narrative, as it distinguishes the types of "passing on" (belief/reasons vs. appreciation).

  ---

  ### **Summary for the Novelist**

  *   **Non-Negotiables:** A theory *must* explain why non-aesthetic facts travel freely (1), distinguish knowing-*that* from appreciating (2), explain why testimony gives strong reasons to engage (3), allow for meaningful disagreement (5), and acknowledge its weaker epistemic status compared to other testimony (6).
  *   **Crucial Tension:** The core conflict is between the **Primacy of Acquaintance (4)** (necessary for appreciation, likely for deep belief) and the demands of **Reasons to Engage (3)** and **Epistemic Asymmetry (6)**. Any plausible theory must navigate this.
  *   **Key Distinction for Characters:** Focus on the **Knowledge-Appreciation Gap (2)**. A character can *rationally believe* a work is beautiful/moving based on trusted testimony (satisfying 3 & potentially 5), leading them to engage. The *appreciation itself* – the being "undone," the feeling moved, the deepened understanding from a spoiler – **must stem from their own experience (4)**. Testimony prepares the ground, primes perception, or provides a framework, but the aesthetic encounter is personal. Deference is rational when it guides engagement; pretending to have seen/appreciated for oneself when one hasn't is the dishonesty to avoid.
  *   **Avoiding Collapse:** Do not let testimony alone *cause* the *visceral aesthetic response* (appreciation) in your characters without depicting the crucial mediating step of *their own perception/engagement* triggered by that testimony. The dealer's description makes the character *buy* the canvas; her *seeing* it (properly, perhaps guided by the description) is what (potentially) reveals its value. The spoiler provides a framework; *reading the text* with that framework is what deepens the experience.

  This specification provides the friction points your narrative needs. Let the desiderata guide when testimony *sets up* the aesthetic encounter and when the character's own faculties must take over for authenticity. The unresolved tensions *are* the fertile ground for exploring your central question.
