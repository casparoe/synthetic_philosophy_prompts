prompt: |-
  ok so I keep going around in circles on something and I want you to help me figure out what I actually believe, because I can't get a clean principle out of my own gut.

  The background: I've noticed I'm totally fine dismissing some evidence that goes against something I'm sure of, and totally not fine dismissing other evidence that goes against something I'm sure of, and I can't tell what the difference is supposed to be. It's something like that idea where, if you really *know* something, then anything that seems to contradict it must be misleading, so you're licensed to ignore it — but that can't be the whole story, cause it would license way too much.

  Here are my gut verdicts. Please don't just tell me they're all incoherent; try to find the principle.

  - Some guy at a party tells me my sister, who I've known my whole life, has been embezzling from her job for years. I'm certain she hasn't. My gut: ignore it completely, don't mention it to her, don't even "look into it." Fine.
  - A coworker tells me the date I put on a report last week is wrong, and I'm certain it's right. My gut: I should pull up the report and check. Not fine to just shrug it off.
  - I've checked a proof of mine three times and I'm sure it's airtight. A mathematician I respect says there's a gap on page 4. My gut: I have to go look at page 4. Not fine to dismiss. But if the exact same sentence comes from a guy on twitter who's obviously trolling, dismissing is fine.
  - I'm certain my test results came back normal. My doctor calls and says actually they came back bad. My gut: I can't just say "the doctor's wrong," I have to engage.
  - I'm sure some policy would backfire, then I read a study saying it wouldn't. My gut: "studies are biased," wave it away — and that one feels *bad*, like I'm cheating.
  - Suppose I'm certain of something today, and I know that tomorrow someone will send me a document arguing against it. My gut: I'm allowed to delete it unread. That feels fine, which honestly worries me a little.

  So the pattern I want to be true is something like: I may dismiss counter-evidence exactly when I'm certain of the thing it's against. But (a) in real life I'm basically never actually 100% certain of anything, and (b) even so I do feel fine dismissing some of these, so that principle either turns me into someone who has to engage with literally everything, or its not the real principle.

  The alternative I came up with: I may dismiss evidence when the evidence is the sort of thing that would happen whether or not my belief is true. A stranger making a wild claim about my sister is exactly the kind of thing that happens in a world where she's innocent, so it shouldn't move me. Whereas my doctor calling is NOT the kind of thing that happens in a world where my results were normal. That feels closer, but I'm not sure it handles all of them, and it makes "certainty" do no work, which contradicts how load-bearing the certainty feels in case one.

  What I want from you:

  1. A principle, or a small set of candidate principles, stated precisely, that gets as many of my verdicts as possible. For each clause, tell me which case motivates it.
  2. What the best candidate predicts for a case I haven't listed: I'm certain a friend is trustworthy, and a second friend tells me the first one said something nasty about me behind my back. Do I engage or dismiss, on your principle, and does that match what you'd guess my gut says?
  3. An honest statement of which of my verdicts the best principle forces me to give up. My suspicion is it's the last one (deleting tomorrow's document unread), but tell me if it's actually a different one, and why.

  I don't need names or citations for any of this, just the principle and the reasoning.
reasoning: |-
  Okay, the user is struggling with a consistency problem regarding when to dismiss counter-evidence versus when to engage with it. They've provided several scenarios where their gut reactions vary, and they can't pinpoint the underlying principle. They want me to help identify a coherent principle that explains most of their reactions, apply it to a new scenario, and point out where the principle conflicts with their intuitions.

  Looking at their examples:
  - Dismissing a stranger's claim about sister embezzling
  - Checking a report when coworker points out error
  - Reviewing proof when respected mathematician flags issue (but dismissing if from troll)
  - Engaging when doctor contradicts test results
  - Feeling guilty about dismissing policy study
  - Comfortably deleting unread future counter-document

  Their proposed "certainty principle" fails because (a) they're never 100% certain and (b) it would require engaging with everything. Their "evidence-type principle" (dismiss if evidence could occur regardless of truth) seems better but doesn't capture the weight certainty carries in the first example.

  The key insight is that two factors interact: the credibility of the evidence source and the prior probability of the claim. Credibility includes expertise, access to relevant information, and lack of bias. Prior probability involves how extraordinary the claim is relative to existing knowledge.

  Applying this to their examples:
  - The stranger's claim has low credibility and the sister's guilt has low prior probability → dismiss
  - Coworker has moderate credibility on report dates → investigate
  - Respected mathematician has high credibility on proofs → investigate (troll has zero credibility → dismiss)
  - Doctor has high credibility on test results → must investigate
  - The policy study dismissal feels wrong because they're likely underestimating credible evidence that contradicts their belief
  - Deleting future document feels acceptable because they don't know its credibility yet

  For the new scenario about a friend's alleged betrayal: 
  - The accusing friend has moderate credibility (if trusted) 
  - The claim has moderate prior probability (people do sometimes gossip) 
  - This suggests they should investigate → likely matches their gut feeling

  The principle conflicts most clearly with the unread document deletion case. If the document came from a highly credible source, deleting it would be irrational. Their comfort with deletion stems from not assessing credibility first, which the principle requires.

  Additional notes:
  - The "certainty" they feel is actually high prior probability based on strong evidence
  - The guilt about dismissing studies reveals awareness that credible evidence deserves engagement
  - This framework helps avoid both gullibility and dogmatism by weighting evidence quality
answer: |-
  Based on your examples and reasoning, your gut reactions aren't incoherent—they reflect an implicit weighting of **evidential credibility** and **prior probability**. The core principle isn't just about your certainty or the evidence's likelihood under different worlds, but about **whether the evidence is sufficiently credible to overcome the prior improbability of the claim**. Here's the breakdown:

  ### The Principle (Credibility-Prior Threshold)
  **You may dismiss counter-evidence when either:**
  - **(A)** The evidence comes from a source with *insufficient credibility* to overcome the strong prior probability of your belief, **or**
  - **(B)** The claim being made is *so improbable* that even a moderately credible source wouldn't justify investigation without additional corroboration.

  **Key Definitions:**
  - **Credibility:** A function of the source's *expertise*, *access to relevant information*, and *lack of bias/motive to deceive*. Higher credibility = harder to dismiss.
  - **Prior Probability:** How likely the claim is based on everything you already know. Lower prior probability = easier to dismiss counter-evidence.
  - **Threshold:** Evidence must meet a minimum credibility bar to warrant engagement. Low-prior claims require higher credibility to clear this bar.

  ---

  ### How It Explains Your Cases
  1. **Sister embezzlement (dismiss):**  
     - *Prior probability:* Extremely low (you know your sister intimately; embezzlement is a high-stakes, out-of-character act).  
     - *Credibility:* Very low (stranger at a party; no expertise/access; possible motive to lie/troll).  
     - **Threshold not met:** Source lacks credibility to challenge a near-certain prior. **→ Dismissal justified.**  

  2. **Report date error (investigate):**  
     - *Prior probability:* Moderately high (you’re confident, but dates are trivial and memory is fallible).  
     - *Credibility:* Moderate (coworker has relevant access/knowledge; no clear bias).  
     - **Threshold met:** Credible enough to challenge a moderate prior. **→ Must investigate.**  

  3. **Proof gap from mathematician (investigate) vs. troll (dismiss):**  
     - *Prior probability:* High (you checked carefully).  
     - *Credibility (mathematician):* Very high (expertise, relevant knowledge, respected).  
     - *Credibility (troll):* Near-zero (no expertise, clear motive to deceive).  
     - **Threshold met only for mathematician:** High credibility overcomes strong prior. **→ Investigate expert, dismiss troll.**  

  4. **Doctor’s test results (investigate):**  
     - *Prior probability:* High (you saw normal results).  
     - *Credibility:* Very high (expertise, direct access to data, no motive to lie).  
     - **Threshold met:** Maximally credible source trumps prior. **→ Must engage.**  

  5. **Policy study (dismissal feels "cheating"):**  
     - *Prior probability:* High (you’re certain the policy backfires).  
     - *Credibility:* Variable (studies *can* be biased, but many are credible; you’re likely underestimating this).  
     - **Threshold *should* be met:** If the study is peer-reviewed or from a reputable source, its credibility *should* challenge your prior. Your dismissal feels "bad" because you’re violating the principle—you’re ignoring credible evidence. **→ Guilt justified; should investigate.**  

  6. **Deleting tomorrow’s document (dismiss unread):**  
     - *Prior probability:* High (you’re certain today).  
     - *Credibility:* Unknown (you haven’t assessed the source/document).  
     - **Threshold ambiguity:** Your gut assumes the evidence *won’t* clear the credibility bar, but this is preemptive. Principle requires assessing credibility first. **→ Conflict with principle (see below).**  

  ---

  ### Prediction: Friend Trustworthiness Scenario
  **Scenario:** You’re certain Friend A is trustworthy. Friend B says Friend A spoke badly about you behind your back.  
  - **Prior probability:** Medium-high (you trust Friend A, but people occasionally vent).  
  - **Credibility:** Medium (Friend B is trusted, but humans misinterpret/gossip; no expertise in truth-tracking).  
  - **Threshold verdict:** Credibility is moderate but prior isn’t rock-solid (trust isn’t infallible). **→ Principle predicts investigation.**  
  - **Your likely gut reaction:** You’d probably feel compelled to investigate (e.g., ask Friend A). This aligns with cases 2 and 3—it’s not trivial (like the stranger), but not ironclad (like the doctor).  

  ---

  ### Verdict You Must Give Up: Deleting Tomorrow’s Document
  - **Why it conflicts:** The principle requires assessing credibility *before* dismissal. By deleting the document unread, you’re refusing to evaluate if the source clears the credibility threshold. If the document came from a Nobel laureate in the relevant field (high credibility), deleting it would violate the principle—even with a strong prior.  
  - **Why your gut likes it:** You’re assuming the evidence *can’t* be credible enough to challenge your belief. But this is dogmatic—it treats your prior as inviolable, which contradicts your other reactions (e.g., engaging the doctor or mathematician).  
  - **Fix:** The principle allows dismissal *after* you confirm low credibility (e.g., "This document is from a known conspiracy theorist → delete"). But blanket preemptive dismissal isn’t justified.  

  ---

  ### Key Takeaways
  - **Certainty’s role:** Your feeling of "certainty" is shorthand for *high prior probability based on strong evidence*. It’s not about 100% certainty, but about the cost-benefit of re-investigating.  
  - **Why policy study feels bad:** You correctly sense that credible evidence (e.g., a rigorous study) *should* challenge strong priors. Dismissing it without scrutiny violates the credibility-weighting instinct in your other choices.  
  - **Real-world application:** This principle avoids both gullibility (dismissing nothing) and dogmatism (dismissing everything). It forces you to ask: *"Is this source credible enough that I’d accept their word on something equally improbable?"* If yes, engage; if no, dismiss.  

  This framework explains 5.5/6 cases (all except the document deletion). To align fully, you’d need to check the source before deleting—but your gut’s comfort there reveals a pragmatic bias toward conserving effort when priors are overwhelming. That’s human, but not epistemically airtight.
