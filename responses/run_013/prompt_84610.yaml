  - Avoiding paralysis from uncertainty
  - Distinguishing responsible from irresponsible gambles (bed nets vs. geoengineering)
  - Needing a framework that doesn't collapse into total skepticism

  The adoption and light-switch cases are perfect stress tests. For adoption: immediate goods (child's welfare) vs. unknowable long-term effects. For the light switch: trivial act with catastrophic unforeseen results—should we feel guilt?

  I think combining expected value with a "reasonable foreseeability" constraint and proximal intention captures most cases. Expected value handles probabilistic judgments (AI donation gets lower confidence because lower probability of success). Foreseeability explains why bed nets are praised despite possible long-term harm—those harms weren't reasonably anticipatable. Proximal intention distinguishes bed nets (aimed at good) from dinner (self-indulgence).

  Where this might struggle:
