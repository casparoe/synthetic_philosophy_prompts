  7. Maintains that unforeseen catastrophes don't retroactively condemn well-intentioned acts

  The core tension is between judging acts by actual consequences vs. the intuition that moral evaluation must be sensitive to epistemic limitations. The time-traveler thought experiment reveals this: same catastrophic outcome affects bed nets and dinner differently in their moral assessment.

  I need to find a principle that systematizes all these intuitions. Let me analyze what's underlying their judgments:
  - They're distinguishing between proximate/immediate consequences (bed nets saving lives now) vs. speculative long-term effects (AI risk mitigation centuries out)
  - There's an implied difference in predictability—bed nets have clear causal chains while AI interventions don't
  - Moral weight seems tied to what was reasonably foreseeable at decision time
