answer: |-
  Your intuitions reveal a coherent moral structure that *resembles* consequentialism but isn't purely outcome-focused—it's **evidence-constrained, intention-sensitive, and proximally oriented**. The physicist's "ledger problem" is real but not fatal; it highlights why consequentialism must incorporate epistemic and agential limits to avoid paralysis. I'll state the principle that systematizes your verdicts, explain its clauses, show how it handles your cases (including adoption and the trivial act), and note one tension you might need to resolve.

  ---

  ### **The Principle: Proximal Expected Value with Intention-Robustness (PEVIR)**
  > An act is morally good if:  
  > **(1)** It has a *high expected value* based on *reasonably foreseeable consequences* within a *proximal causal horizon*;  
  > **(2)** Its positive effects are *robust* across plausible scenarios (i.e., it doesn't rely on speculative chains);  
  > **(3)** It is *intentionally directed* at a proximate good (even if outcomes are uncertain).  
  >  
  > Moral evaluation is relative to evidence available at the time of acting. Unforeseeable long-term consequences do not retroactively condemn/praise the act, but they may inform future decisions.

  ---

  ### **How PEVIR Explains Your Verdicts**
  #### **Clause 1: High expected value + foreseeable consequences + proximal horizon**  
  - **Work**: Focuses evaluation on consequences you can reasonably predict (avoiding "cluelessness"). The "proximal horizon" (e.g., 5-50 years) excludes distant, untraceable effects.  
  - **Cases it answers**:  
    - **Bed nets vs. AI risk donation**: Bed nets have high *foreseeable* proximal value (lives saved now with well-understood causality). AI risk has low *expected* value because its consequences are speculative and non-proximal (e.g., "centuries later" effects are inherently uncertain).  
    - **Bed nets vs. £100 dinner**: The dinner has negligible foreseeable moral value; its consequences (personal pleasure) aren't robust goods. Bed nets have clear, high-probability benefits.  
    - **Voting**: The *foreseeable* consequences (upholding democratic norms, contributing to collective action) are significant, even if your individual impact is negligible.  
    - **Adopting a child**: High expected value (immediate welfare for the child) with robust foreseeable benefits (love, stability), even if long-term effects are unknown.  

  #### **Clause 2: Robustness across plausible scenarios**  
  - **Work**: An act isn't good if its value depends on unlikely or highly speculative chains (e.g., "this might prevent AI apocalypse"). It must be beneficial in *most credible* near-future outcomes.  
  - **Cases it answers**:  
    - **AI risk donation fails here**: Its value hinges on speculative scenarios (e.g., "if AI alignment research succeeds, it might avert catastrophe"). Bed nets are robust—they save lives even if malaria evolves or climate changes.  
    - **Recycling one bottle**: Small but robust good—it contributes to a practice with clear proximal benefits (reduced waste, pollution) across likely scenarios.  
    - **Job choice**: Not morally arbitrary because its *proximal* consequences (relationships, family, community impact) are foreseeable and robust. You needn't trace "who my grandchildren meet" to know moving for a fulfilling job is good.  

  #### **Clause 3: Intentional direction at a proximate good**  
  - **Work**: Distinguishes acts *aimed* at moral goods from those with accidental benefits. Unforeseeable catastrophes don't negate this.  
  - **Cases it answers**:  
    - **Time-traveler catastrophe**: For bed nets, the *intention* was proximally good (saving lives now), so the unforeseen disaster doesn’t condemn it. For the dinner, there was no moral intention—so it remains neutral/self-indulgent.  
    - **Trivial act (leaving a light on)**: If it unforeseeably causes disaster, it isn't blameworthy—no negative intention, and consequences were beyond reasonable foresight.  

  ---

  ### **The One Verdict You Might Need to Abandon**
  PEVIR preserves all your verdicts **except** your claim that *"an act is to be judged by its actual consequences, whatever they turn out to be."**  
  - **Why?** Your time-traveler intuition contradicts this. You don’t blame the bed nets donation for unforeseeable disasters because *evaluation depends on evidence at the time*.  
  - **The fix**: Replace "actual consequences" with **"reasonably expected consequences"** (as PEVIR does). This resolves the tension:  
    - Bed nets were right *given what you knew*; the dinner wasn’t aimed at good; AI donation had low confidence.  
  - **Resulting position**: A **moderate objective consequentialism** where moral rightness is fact-dependent (actual outcomes matter), but *blame/praise* depends on epistemic constraints. You can still say "the bed nets act had terrible consequences," but not "it was morally wrong."  

  ---

  ### **PEVIR on Your Unmentioned Cases**
  1. **Adopting a child**:  
     - **PEVIR verdict**: Morally good.  
     - **Why**: (1) High expected value (providing love, security) with foreseeable proximal benefits; (2) Robust across scenarios (e.g., even if the child faces challenges, stability is beneficial); (3) Intentionally directed at proximate good. Distant consequences (e.g., "what if they start a war?") are irrelevant.  

  2. **Trivial act (leaving a light on) with unforeseeable disaster**:  
     - **PEVIR verdict**: Not blameworthy.  
     - **Why**: (1) Negligible expected value (no foreseeable harm/benefit); (2) Not robust (neutral in most scenarios); (3) No negative intention. The catastrophe is tragic but not a *moral failure*—it’s "just a light."  

  ---

  ### **Why This Beats the Physicist's Challenge**
  The "ledger problem" assumes consequentialism requires omniscience. PEVIR rejects this:  
  - **Bed nets vs. AI risk**: Not on a par—bed nets win on proximal robustness.  
  - **Bed nets vs. dinner**: Not on a par—bed nets have intentional moral aim and foreseeable benefits.  
  - **Cluelessness**: Managed by focusing on the *proximal* and *robust*. We deliberate about what we can control.  

  PEVIR isn’t a standard theory but synthesizes ideas from **evidence-relative consequentialism** (Jackson 1991), **scalar consequentialism** (Norcross 1997), and **virtue ethics** (emphasizing intention). It captures your view: consequentialist *in spirit* but grounded in human limits. If you abandon "actual consequences determine rightness," your other intuitions hold firm.
