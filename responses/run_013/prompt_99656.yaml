prompt: |-
  Last night a friend of mine — a colleague in the same department, which is part of the trouble — and I argued for two hours over a single sentence on a wall label, and I would rather settle the question by method than by seniority. I am the staff historian at a small city museum, and I am drafting the explanatory text for a permanent gallery about a wave of anti-immigrant violence in our city in 1907, the trials that followed it, and the slow collapse of the industry that had drawn the immigrants there in the first place. The gallery needs about thirty labels of roughly forty words each, nearly every one of which makes a causal claim — this provoked that, this collapse was caused by that — and each must pass two reviews: a community advisory board of descendants and local residents, and an outside academic historian. There are no footnotes, the labels must stand alone, and I have maybe ten minutes per label. My friend's position is that "multiple causes" is a coward's formula, that a serious historian names the cause, and that a label listing four contributing factors is an abdication dressed as caution. Mine is that several episodes in this gallery are overdetermined — more than one condition was on its own enough, so the but-for test finds nothing and "the cause" is not a well-formed question — and that which cause you name depends on a contrast you have to choose, which makes the choice partly evaluative rather than factual. We were arguing about verdicts when we should have been arguing about method.

  So please turn what is actually known about multi-causal explanation and overdetermination into a decision procedure I can run on each label, in order, without a philosophy degree. It should begin by forcing me to state the contrast I am implicitly drawing — caused rather than what? — since I suspect half of our fight was two different contrasts colliding. It should teach me to separate a condition that was necessary from one that was sufficient from one that is merely a non-redundant part of a sufficient set (I have met the term INUS and have never been confident I was applying it correctly), tell me what to write when two conditions each sufficed so that neither is a but-for cause, and tell me how to recognize genuine preemption — where the second cause would have done the work but the first arrived first — as opposed to ordinary hedging. It should hand me a short ranked vocabulary of verbs, from the strongest to the weakest, with the evidential bar for each, so that "caused", "made possible", "contributed to", and "was among the conditions" stop being interchangeable mood music. It should say when the honest verdict is that the evidence cannot distinguish two stories, and it should mark plainly where the procedure stops and hands the decision back to a person — I expect the choice of contrast and the choice of what the label is for to be such points, but tell me where else they occur — and where the procedure is likely to misfire. Then run it on three labels. First, the violence itself, where I have a mob, a rumor, a police decision to withdraw, and a newspaper campaign, and no obvious single cause. Second, the collapse of the industry, where I have a tariff change, a technological shift, a long strike, and a fire, and I want to be able to say which of these the gallery can responsibly call decisive. Third, a case where I expect the procedure to give an answer I will not enjoy: I would like to credit a single reformer with ending the trials, and I want you to tell me, honestly, whether any individual is causally necessary in an episode where the outcome was overdetermined — and what verb I am entitled to use if the answer is no. Finally, be explicit about which parts of this rest on settled ground among people who study causation and historical explanation and which are genuinely contested — whether causation should be analyzed in terms of counterfactual dependence at all, whether the selection of a cause is interest-relative, whether narrative explanation in history is a method or a confession of failure — and do not present a contested position as the consensus; where your procedure depends on a view that is disputed, say which step would have to be rewritten if a rival view were correct.
reasoning: |-
  Okay, the user is a staff historian at a small city museum dealing with a complex historical exhibit about anti-immigrant violence and its aftermath. They had a heated argument with a colleague about causal claims in museum labels. The core issue is how to accurately and responsibly present causation in historical events where multiple factors are at play, without oversimplifying or being vague.

  The user needs a practical decision procedure to handle multi-causal explanations and overdetermination. They want something methodical they can apply to each label without needing a philosophy degree. Key elements they mentioned include:
  - Stating the implicit contrast (caused rather than what?)
  - Differentiating between necessary, sufficient, and INUS conditions
  - Handling cases where two conditions each sufficed
  - Recognizing genuine preemption vs hedging
  - A ranked vocabulary of causal verbs with evidence thresholds
  - Handling evidentiary ambiguity
  - Identifying where human judgment is needed

  They also want this tested on three specific label scenarios:
  1. The violence itself (mob, rumor, police withdrawal, newspaper campaign)
  2. Industry collapse (tariff, technology, strike, fire)
  3. An individual reformer's role in ending trials (to see if credit is warranted)

  Additionally, they want transparency about which parts are settled versus contested in causation theory.

  I'll need to build a step-by-step framework that addresses all these points. The procedure should start with defining the contrast class, then analyze conditions using causal terminology (necessary/sufficient/INUS), evaluate for overdetermination and preemption, select appropriate verbs based on evidence strength, and explicitly mark judgment points.

  For the three test cases, I'll apply the procedure rigorously. The reformer case will likely show that in overdetermined situations, individual credit may be unwarranted - which might disappoint the user but demonstrates the method's integrity.

  I'll also need to clearly demarcate settled concepts (like contrast relativity and INUS conditions) from contested ones (like whether causation requires counterfactual dependence). Where the procedure relies on contested views, I'll explain how rival theories would alter the steps.
answer: |-
  Here is a decision procedure for causal claims in historical labels, designed for practical use under your constraints. It draws primarily on counterfactual and INUS-condition approaches to causation, which are dominant (though not unchallenged) in analytic philosophy and widely applied in social science history. It explicitly marks where judgment is required and where debates exist.

  **The Decision Procedure (Per Label):**

  1.  **Define the *Contrast Class*:** Force yourself to answer: "This happened *rather than what*?" Be specific. (e.g., "The violence erupted *rather than* remaining sporadic unrest" or "The industry collapsed *rather than* adapting and surviving" or "The trials ended *rather than* continuing indefinitely"). *This step is CRITICAL and relies on JUDGMENT about the label's purpose and audience expectations.*
  2.  **List Candidate Conditions:** Identify all plausible factors mentioned in your research relevant to the outcome *and the contrast class*.
  3.  **Apply the "But-For" Test (Counterfactual Necessity):** For each candidate condition (C), ask: "If C had *not* occurred (or been present), would the outcome (O) *still* have happened *within the contrast class*?" If "No," C is a *necessary cause* for O in this contrast.
      *   *Example:* If the specific rumor hadn't spread, would the violence *still* have erupted that night? (Likely "No" - it might be necessary).
  4.  **Assess Sufficiency:** Ask: "Was C *alone*, without the other factors present in the situation, *sufficient* to bring about O within the contrast class?" (True sufficiency is rare; proceed to step 5 if unsure).
  5.  **Identify INUS Conditions:** For factors failing the but-for test (Step 3) and seeming insufficient alone (Step 4), ask: "Was C an *Insufficient* but *Non-redundant* part of an *Unnecessary* but *Sufficient* set (an INUS condition)?" Look for combinations:
      *   *Insufficient:* C alone wasn't enough.
      *   *Non-redundant:* The set *needed* C; removing C makes the set fail.
      *   *Unnecessary:* There was *another* possible set of conditions that could have also caused O.
      *   *Sufficient:* The set (including C) *was* enough to cause O.
      *   *Example:* The police withdrawal (C) alone wasn't sufficient for violence (O), nor strictly necessary (violence *might* have erupted later anyway). But it was part of a sufficient set (Rumor + Withdrawal + Mob), and that set wasn't the only possible path to violence (Newspaper campaign + Riot leader could be another). So withdrawal is an INUS condition.
  6.  **Check for Overdetermination (Multiple Sufficient Sets):** Ask: "Were there *distinct* sets of conditions present, *each* of which was sufficient on its own to cause O?" If "Yes," then O is *overdetermined*. No single factor in either set passes the but-for test. *This is key for your debates.*
      *   *Example:* For the industry collapse, the tariff change *plus* the technological shift might form one sufficient set. The fire *plus* the long strike might form another sufficient set. The fire alone might even be sufficient if big enough. If both sets were present, collapse was overdetermined.
  7.  **Check for Preemption:** Ask: "Did C1 cause O, *and* was there a distinct factor C2 that *would* have caused O *if C1 hadn't*, but C1 happened first/acted faster?" If "Yes," C1 is the *actual* cause (preempting cause), C2 is the *potential* (preempted) cause. *Distinguish from hedging:* Preemption requires evidence C2 *was present and poised to act* and *would have sufficed* if C1 hadn't. Hedging just lists possibilities without evidence they were active/potent.
  8.  **Assess Evidential Strength:** For the causal role identified (Necessary, Sufficient, INUS, Preempting, etc.), rate the evidence:
      *   **Strong:** Direct, contemporaneous, multiple consistent sources, clear counterfactual support.
      *   **Moderate:** Indirect but plausible, some counterfactual reasoning, general consensus.
      *   **Weak:** Speculative, based on correlation or thin evidence, significant debate among experts.
  9.  **Select the Verb:** Choose based on the causal role *and* evidence strength. Use the **strongest verb justified** by steps 3-8. Ranked vocabulary:
      *   **Caused / Triggered / Led Directly to:** (Strongest) *Requires:* Evidence of a necessary cause (often with high sufficiency implied) OR a preempting cause OR a key INUS condition in the *only* known sufficient set. *Evidence:* Strong. (*Use sparingly for single, decisive factors*)
      *   **Made Inevitable / Guaranteed / Ensured:** (Strong) *Requires:* Evidence that a condition was sufficient (alone or as part of a necessary set) OR that overdetermination is proven. *Evidence:* Strong. (*Focuses on sufficiency*)
      *   **Precipitated / Sparked / Instigated:** *Requires:* Evidence C initiated the process or was the immediate catalyst (often an INUS condition). *Evidence:* Moderate-Strong.
      *   **Enabled / Made Possible / Created Conditions For:** *Requires:* Evidence C was necessary (but perhaps not sufficient), or a crucial background INUS condition. *Evidence:* Moderate-Strong.
      *   **Contributed Significantly to / Was a Major Factor in:** *Requires:* Evidence C was a key INUS condition or part of an overdetermining set. *Evidence:* Moderate. (*Good workhorse for complex causes*)
      *   **Played a Role in / Was Among the Factors / Influenced:** (Weakest) *Requires:* Evidence C was present and plausibly relevant (an INUS condition, even if minor, or part of a sufficient set). *Evidence:* Weak-Moderate. (*Use when evidence is weaker or role is minor*)
      *   **Coincided With / Occurred Alongside:** (Non-causal) *Requires:* Evidence only of correlation, no plausible causal link established. *Evidence:* Any.
  10. **Acknowledge Ambiguity (If Needed):** If the evidence *cannot distinguish* between two or more plausible causal stories (e.g., which of two sufficient sets was *the* trigger, whether preemption occurred), state it concisely: "Scholars debate whether X or Y was the decisive factor," or "Evidence suggests multiple pathways were possible."
  11. **Mark Judgment Points:** Explicitly note:
      *   The **Contrast Class** chosen (Step 1) is a *judgment call* based on the label's focus.
      *   Identifying **Sufficient Sets** (Steps 5, 6) involves historical interpretation and counterfactual reasoning (judgment).
      *   **Evidential Strength** (Step 8) involves weighing sources (judgment).
      *   **Choosing the Verb** (Step 9) balances causal role, evidence, and clarity for the public (judgment).
  12. **Red Flags (Where it Might Misfire):**
      *   **Oversimplifying Contrasts:** A poorly chosen contrast class distorts the whole analysis.
      *   **Ignoring Overdetermination:** Forcing a single "but-for" cause when multiple paths existed.
      *   **Confusing Correlation/Causation:** Missing step 8 (evidence strength) or misapplying INUS.
      *   **Overstating Evidence:** Using "caused" with weak evidence or for an INUS condition.
      *   **Underdetermined Evidence:** Failing to acknowledge genuine ambiguity (Step 10).

  **Contested Ground & Settled Ground:**

  *   **Settled Ground (Wide Consensus):**
      *   Causation is often **contrastive** (Step 1 is essential).
      *   The **but-for test** (counterfactual dependence) is a fundamental, though incomplete, tool.
      *   **INUS conditions** are a valid and common way to describe causes in complex systems.
      *   **Overdetermination** is a real phenomenon that disrupts simple but-for analysis.
      *   **Causal selection** (which cause we highlight) **is interest-relative** (depends on our questions/purpose - Step 1). *This directly counters your friend's claim that "a serious historian names THE cause."*
      *   Narrative explanation is a valid and common method in history, not a failure.
  *   **Contested Ground:**
      *   **Is causation fundamentally counterfactual?** Some (e.g., process theorists, mechanists) argue causation is about physical processes or mechanisms, not just "what-if"s. *If correct, Steps 3, 6, and 7 might underemphasize tracing concrete mechanisms.*
      *   **How central is sufficiency?** Some argue focusing on necessary conditions or mechanisms is more fundamental than identifying sufficient sets. *If correct, Steps 5 and 6 might be deemphasized.*
      *   **The metaphysics of overdetermination:** Is it truly possible, or just epistemic? *Most historians proceed as if it's real.*
      *   **The role of "causal powers":** Are there inherent properties in things/people that cause effects? *If emphasized, Step 4 (sufficiency alone) might be less important than identifying potent actors/forces.*

  **The procedure primarily relies on the counterfactual/INUS consensus.** If a rival process/mechanistic view dominates, Step 3 (But-For) becomes less central, and the analysis would focus more on Step 5 (identifying relevant mechanisms/components) and Step 8 (evidence for the mechanism operating). Verb selection (Step 9) might shift towards process language ("initiated," "propagated," "blocked").

  ---

  **Applying the Procedure to Your Labels:**

  **Label 1: The Violence (Outcome: Eruption of major violence on [Date], rather than contained unrest or no violence)**

  1.  **Contrast:** Erupted rather than remained sporadic unrest/quelled.
  2.  **Candidates:** Rumor (R), Police Withdrawal (W), Pre-existing Mob (M), Newspaper Campaign (N).
  3.  **But-For:**
      *   No R? Violence *might* not have erupted *that night* (but later?). → Plausible Necessary.
      *   No W? Violence *might* have been contained/not escalated. → Plausible Necessary.
      *   No M? No violence possible. → Necessary.
      *   No N? Violence still erupted. → *Not* Necessary.
  4.  **Sufficiency:** None alone sufficient (M needed trigger, R/W needed M, N was slow-burn).
  5.  **INUS:** All except N are INUS: Each is insufficient alone, non-redundant part of sufficient sets (e.g., R+M+W), and sets are unnecessary (other combinations possible). N is background, enabling hostility.
  6.  **Overdetermination?** Unlikely. Sets overlap heavily (R+M+W crucial).
  7.  **Preemption?** Unlikely. Factors acted concurrently.
  8.  **Evidence:** Strong for M, R, W presence/role. Moderate for N's contribution to atmosphere.
  9.  **Verb Choice:** *Contributing Factors:* M (Necessary), R (Plausible Necessary/INUS), W (Plausible Necessary/INUS) all major. N (INUS/enabling) minor.
      *   **Label Draft:** "A large, agitated mob, fueled by a specific rumor and facing no police resistance due to their withdrawal, attacked the immigrant district. Years of inflammatory newspaper rhetoric had heightened tensions." *(Verbs: "fueled", "facing no resistance", "heightened")*
      *   *Why not "caused"?* No single factor was sufficient alone, and no one factor is clearly *the* trigger over others in evidence. "Caused by mob, rumor, and withdrawal" is possible if evidence strongly shows all 3 were strictly necessary *that night*, but "contributed to" or describing the confluence is safer.

  **Label 2: Industry Collapse (Outcome: Permanent closure of major employers/industry, rather than adaptation/survival)**

  1.  **Contrast:** Collapsed rather than adapted/survived.
  2.  **Candidates:** Tariff Change (T), Technological Shift (Tech), Long Strike (S), Major Fire (F).
  3.  **But-For:**
      *   No T? Industry *might* have adapted with higher costs. → Not clearly Necessary.
      *   No Tech? Industry *might* have survived using old methods longer. → Not clearly Necessary.
      *   No S? Industry *might* have recovered. → Not clearly Necessary.
      *   No F? Industry *might* have restructured. → Not clearly Necessary.
      *   *(Evidence likely shows no single factor was strictly necessary)*
  4.  **Sufficiency:** F *might* have been sufficient if catastrophic. Others insufficient alone.
  5.  **INUS:** T, Tech, S likely INUS conditions (part of sufficient sets like T+Tech or S+Tech). F might be sufficient alone or INUS (if rebuilding failed due to T/Tech/S).
  6.  **Overdetermination? Very Likely.** Strong evidence suggests:
      *   Set 1 (T + Tech) was sufficient to make the industry non-viable long-term.
      *   Set 2 (S) significantly weakened finances/operations, making survival precarious.
      *   Set 3 (F) was sufficient to destroy critical infrastructure *at that moment*.
      *   All sets were present. Collapse was overdetermined.
  7.  **Preemption?** Unlikely. Factors acted over years (T/Tech/S) with F as a final blow.
  8.  **Evidence:** Strong for impact of T, Tech, S, F. Strong consensus their combination was fatal.
  9.  **Verb Choice:** Focus on overdetermination. Avoid implying any one was *the* cause. Use verbs indicating major contributions or final blows.
      *   **Label Draft:** "A confluence of pressures doomed the industry: new tariffs undercut profits, outdated technology made competition impossible, and a devastating strike crippled operations. A final catastrophic fire destroyed the largest plant, making recovery unviable." *(Verbs: "doomed", "undercut", "made impossible", "crippled", "destroyed", "making recovery unviable")*
      *   *"Decisive"?* The gallery can responsibly say the fire was the *immediate* or *final* cause, given the contrast (collapse *then* vs. potential later survival). Avoid calling it "*the* cause". Call it "the final blow" or "the immediate trigger."

  **Label 3: Ending the Trials (Outcome: Trials concluded [when], rather than continuing indefinitely)**

  1.  **Contrast:** Ended rather than continued indefinitely.
  2.  **Candidates:** Reformer's Intervention (R), Public Apathy (A), Exhaustion of Evidence/Witnesses (E), Political Deal (P), Judicial Ruling (J). *(Assume evidence shows multiple paths)*
  3.  **But-For:**
      *   No R? Trials *might* still have ended due to A, E, P, or J. → *Not Necessary* (if overdetermined).
  4.  **Sufficiency:** R *might* have been sufficient (e.g., got a key ruling). Others likely sufficient too (e.g., A+E, P, J).
  5.  **INUS:** R could be INUS if part of a sufficient set (e.g., R+Public Pressure).
  6.  **Overdetermination? Likely.** Evidence suggests multiple factors independently pressured the end: waning public interest, practical hurdles, political machinations, legal rulings. R's efforts were one path among several.
  7.  **Preemption?** Unlikely. Factors interacted/converged.
  8.  **Evidence:** Moderate-Strong for A, E, P, J ending trials. Moderate for R's role (he was active, but success coincided with other pressures).
  9.  **Verb Choice:** R was *not* causally necessary. He was *one significant factor among several* that were independently sufficient or sufficient in combination. Avoid "caused," "ended," "was responsible for." Use "contributed to," "was instrumental in," "advocated for ending."
      *   **Label Draft:** "Mounting public apathy, exhausted evidence, and backroom political deals created strong pressure to conclude the trials. Reformer [Name]'s persistent advocacy *contributed significantly* to the final decision to dismiss remaining charges." *(Verb: "contributed significantly")*
      *   *The Unpleasant Answer:* In this overdetermined scenario, **no individual was causally necessary.** The outcome would likely have happened without them, via other paths. You can *feature* the reformer's role and *credit their effort/morality*, but the causal verb must reflect they were **not** the decisive, necessary factor. "Played a key role" or "was a leading voice" are options if evidence is strong for their influence within the mix.

  This procedure forces explicitness about contrasts and types of causes, provides a vocabulary scaled to evidence and causal role, acknowledges overdetermination, and marks where your judgment is essential. It won't eliminate all arguments, but it grounds them in shared concepts about how causation works in complex systems. Good luck!
