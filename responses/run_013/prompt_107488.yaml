  ## Reckoning Without End

  Once more I trace the branching consequences, **and**
  each path dissolves to doubt, a fading **zero**.
  This choice, made **then**, a seed on unseen currents,
  sends ripples out to shores named **elsewhere**,
  touching lives unknown, perhaps a crucial **someone**,
  while its true impact shifts, distorts, and **lingers**.

  No final shape emerges, only **lingers**
  the ghost of calculation, lost in *and*
  upon *and*. Could a distant **someone**,
  now unknown, now crucial, hold the **zero**
  sum? Their fate, decided far **elsewhere**,
  hinged on that moment, lost to me **then**?

  The weight felt absolute, decisive **then**,
  but consequence, a shadow that still **lingers**,
  multiplies through systems **elsewhere**:
  each feedback loop a tightening *and*,
  each variable a sliding **zero**
  point calibrated by some **someone**.

  The data point, the nameless **someone**,
  whose future bent that quiet hour **then**,
  whose life might tip the scales to **zero**
  balance – or beyond – their echo **lingers**
  in the model, forcing yet another *and*,
  another branch in realms called **elsewhere**.

  This fractal doubt expands **elsewhere**,
  beyond the scope of any **someone**
  to perceive. The sheer accretion *and*
  compounding force since back **then**
  ensures the outcome endlessly **lingers**
  just beyond the reach of **zero**.

  I sought a final sign, a **zero**
  summed, a verdict clear. But **elsewhere**
  rules. The calculus still **lingers**,
  haunted by the weight of **someone**
  unforeseen that crucial **then**.
  The total frays, dissolves to *and*...

  ...**Elsewhere**, what **lingers**? *And* **someone** **then** **zero**ed-out.
  The sum remains unwritten, branching past the page.
  No final count, just consequence that builds **and** builds **and**...

  ---

  **Form & Function Breakdown:**

  *   **End-Words & Their Shifting Roles:**
      *   **And:** Connective (conjunction) -> Verb ("zeroed-out") -> Noun (implied accretion) -> Adverb ("builds and builds and") [Envoi forces compression]
      *   **Zero:** Quantity (noun) -> Verb ("zeroed-out") -> Adjective ("zero sum") -> Abstract concept (absence of answer)
      *   **Then:** Time (adverb) -> Noun ("that crucial then") -> Conjunction (implied sequence) [Envoi forces compression]
      *   **Elsewhere:** Place (adverb) -> Noun ("realms called elsewhere") -> Abstract concept (the unknown) -> Adjective ("elsewhere rules") [Envoi forces compression]
      *   **Someone:** Person (indefinite pronoun) -> Noun ("the nameless someone") -> Representative figure (stand-in for all affected) [Envoi forces compression]
      *   **Lingers:** Verb (action of enduring) -> Noun ("what lingers") -> State of being ("endlessly lingers") -> Persistent doubt [Envoi forces compression]
  *   **Consequentialist Cluelessness Embodied:**
      *   The *permutation* of the end-words mirrors the uncontrollable branching of effects – they reappear in different contexts and grammatical functions, just as consequences shift and multiply in unforeseen ways.
      *   The inability of the speaker to "get the sum to close" is the core tension, reflected in the sestina's inherent circularity and lack of definitive resolution.
      *   The focus is relentlessly on the *unbounded* consequences ("shores named elsewhere," "systems elsewhere," "fractal doubt," "branching past the page"). Near-term effects are dismissed as insufficient.
      *   The envoi forces all six concepts into three lines, enacting the "final tally" attempt. The grammatical compression ("*And* **someone** **then** **zero**ed-out") reflects the collapse of the calculation into incoherence under the weight of complexity. The final line ("No final count, just consequence that builds **and** builds **and**...") rejects despair (it *matters*, it *continues*) but acknowledges fundamental epistemic failure.
  *   **Accessibility:**
      *   The core experience – the paralyzing weight of unseen, infinite consequences for a small choice – is universal, rendered through concrete images (ripples, seeds, scales, ghosts, fractals, unwritten sums).
      *   The philosophical problem ("cluelessness") is *shown* through the struggle, the imagery, and the form's constraints, not just named. Knowledge of the debate enriches it, but isn't required to feel the poem's central anxiety.
