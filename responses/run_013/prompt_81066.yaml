answer: |-
  ## Sestina for the Unfixed Chance

  First method: fix the unmoving **circle**,
  Then let two points upon its rim define
  The random path a fleeting **chord** will race.
  The question held: when will its span grow **longer**
  Than that strong side? To find a share **equal**
  To ignorance, we freely mark and **draw**.

  Second: a spoke from **centre** outward cast,
  A random line, then measure out along
  Its certain path a distance, small or tall,
  Then **draw** the perpendicular, a **chord**
  To cross that line. This method, deemed **equal**
  To chance’s call, shows half the chords stretch **longer**.

  Third: inside the bounded **circle**, place
  One point alone, selected without art
  To be the **centre** of the future **chord**.
  From this fixed hub, extend both ways and **draw**
  The line whose ends touch rim. How many **longer**
  Than the triangle’s side? A share **equal** to one part in four, not more.

  The answers shift: a third, a half, a quarter.
  The **circle** stands unchanged, the self-same test,
  Yet chance refuses steadfastness. The **centre**
  Holds, yet meaning spins. Each way we **draw**
  The random line, a different law of **equal**
  Weight decrees what span shall count as **longer**.

  "Respect the shape!" the learned voices urge,
  "Demand the answer stay when you **draw**
  Anew, or shrink, or spin the **circle** whole."
  Such symmetry, they say, makes meaning **equal**
  To truth, selects one path, discards the rest. The **centre**
  Holds the key, the **chord**'s true random call. But **longer** doubts persist.

  Now shift the ground: a factory's loud hum,
  Not shapes with **centre**, but sharp-cornered forms.
  No graceful arc, no measured **chord** to **draw**,
  Just cubes whose edges bloom from void to two,
  With nothing marking small or large **equal**.
  Which chance prevails? The edge held **longer** than one?

  The edge, they say, splits halfway: one in two.
  The volume, though, from nought to eight expands,
  With measure **equal** spread across that space,
  Thus cubes **longer** in edge? One half. In bulk?
  One eighth! But when the edge is brief, the bulk is small,
  The **circle**'s ghost laughs where no **centre** is at all.

  The answers spin: a third, a half, a quarter.
  Respect the shape, the symmetry's demand?
  Or mourn the **equal** share that slips like sand?
  The **chord** remains unfixed, the **circle** true.
  **Draw** how you will, the **longer** chance escapes,
  No single **centre** holds the scattered shapes.

  ---

  **Brief Note:**

  1.  **Contested Claims:** The core contested point is whether specifying rotational/scale invariance *uniquely* resolves Bertrand's Paradox by selecting only the "two random points" method (yielding 1/3). While it's widely accepted this invariance *favors* that method, some argue alternative invariant measures exist or that the requirement itself imports arbitrariness.
  2.  **Symmetry Singling Out:** Yes, requiring invariance under the circle's symmetries (rotation and scaling) *does* single out the "two random points on the circumference" method (and the 1/3 probability). This is the standard resolution within mathematical probability theory when "random chord" requires a unique, well-defined answer respecting the circle's geometry.
  3.  **Confidence:** I am highly confident that this symmetry requirement uniquely selects the 1/3 method *as the standard probabilistic resolution*. The mathematical derivation showing other methods violate invariance is robust.
  4.  **Least Sure Point:** I am least sure whether this symmetry resolution truly "rescues the principle that equal ignorance deserves equal shares of belief" or if it merely replaces one arbitrary choice ("how to randomize") with another ("which symmetries to demand"), conceding that "equal ignorance" alone is insufficient without imposing external structure (the symmetries). The cube paradox powerfully illustrates this deeper epistemological unease.
