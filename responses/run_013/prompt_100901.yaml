  Okay, the user wants me to analyze the French Revolution's Terror phase through the lens of a "loyalty-signaling spiral" mechanism. They've specifically asked not to recount the narrative but to test this mechanism against the sequence from Hébertist executions to Danton's fall and finally Robespierre's downfall. 

  First, I need to unpack their proposed mechanism: when public denunciation becomes the cheapest proof of revolutionary loyalty, it creates a situation where factions must strike first to survive. This leads to a cycle where today's victors become tomorrow's victims. The user wants me to rigorously test this against the historical sequence.

  Looking at the key players: the Hébertists (radical sans-culottes), Danton's Indulgents (moderates), and Robespierre's Committee of Public Safety. The mechanism fits remarkably well with Hébertists vs Dantonists - both factions were actively denouncing each other, creating mutual vulnerability. Robespierre's group had to choose who to purge first, and eliminating the more dangerous Hébertists made strategic sense. 

  But the mechanism gets shaky with Thermidor. The coup against Robespierre wasn't a case of one faction purging another - it was a terrified coalition of former enemies (like Tallien, Fouché, Collot) who normally distrusted each other but united because Robespierre's vague threats made them all feel next in line. This breaks the "strike first" logic because it wasn't preemptive - it was reactive defense.

  Now comparing this to the three standard interpretations of the Revolution: class struggle, ideology, and contingency. The signaling spiral resembles contingency most because it focuses on individual decisions under pressure. But it actually challenges all three: class interests fade when bourgeois deputies panic together; ideological purity gets weaponized strategically rather than believed; and while accidents matter, the spiral shows how the environment constrained choices systematically.

  The big revelation is that this mechanism might explain why revolutions keep "devouring their children" across different societies and ideologies. But it can't explain everything - it doesn't tell us why the spiral started (that needs ideology/social context) or why some revolutions avoid this fate. The Terror's intensity might come from war pressures that amplified the stakes.

  The user seems sophisticated - they know the history but want fresh analytical insight. Probably a grad student or scholar testing a theoretical framework. Their frustration with existing interpretations comes through; they're seeking whether this "bare logic" approach can cut through old debates. I should honor that by being ruthlessly analytical about where the mechanism succeeds and fails, while acknowledging what it reveals about revolutionary dynamics universally.
answer: |-
  Here's an analysis of the loyalty-signaling spiral mechanism applied to the Terror's climax and its relationship to broader interpretations of the Revolution:

  **Mechanism Fit: Hébertists to Dantonists to Robespierre**

  1.  **Actors & Options Pre-Hébertist Purge (Ventôse Year II - March 1794):**
      *   **Robespierre & CPS/CGS:** Hold formal power, face pressure from radical left (Hébertists) demanding more terror/economic controls and moderate right (Dantonists) demanding relaxation. Options: Purge left, purge right, attempt reconciliation (risky), do nothing (risky as denunciations fly).
      *   **Hébertists (Radical "Enragés"/Cordeliers):** Mobilize sans-culottes, denounce CPS/CGS for moderation, corruption, and failing the poor. Options: Intensify street pressure/demands, attempt insurrection, denounce CPS/Dantonists.
      *   **Dantonists ("Indulgents"):** Argue for end to mass terror, peace negotiations, centralization of power. Options: Build coalition in Convention, denounce CPS excesses/Hébertist anarchy, negotiate with CPS.
      *   **The Plain (Silent Majority in Convention):** Fearful, follow perceived strongest faction. Options: Vote with winners, avoid being noticed, denounce *someone* to signal safety.
      *   **Why Preemption Was Rational:**
          *   **CPS:** The Hébertists posed an immediate, destabilizing threat through sans-culotte mobilization and direct calls for insurrection ("new 31 May"). Denouncing *them* first signaled CPS's revolutionary vigilance *and* removed the most dangerous challenger. Eliminating Dantonists first would have left the CPS vulnerable to Hébertist street power. Signaling: Purging radicals proves commitment to order *within* the revolution.
          *   **Hébertists:** Their strategy *was* denunciation and mobilization. Preemptive strike against CPS was attempted through rhetoric but lacked the decisive organization/Convention support. Failing to denounce CPS fiercely enough would signal weakness or counter-revolution.
          *   **Dantonists:** Denouncing Hébertists was safe and signaled loyalty; denouncing the CPS directly was highly dangerous. Their "moderation" itself became a denunciation-worthy offense in the spiral. Preemptive strike against CPS was theoretically possible but politically difficult; their safer move was to denounce Hébertists *and* hope CPS saw them as useful allies against anarchy.

  2.  **Actors & Options Post-Hébertist Purge, Pre-Dantonist Purge (Germinal Year II - April 1794):**
      *   **CPS/CGS:** Victorious over left, but Hébertist purge legitimizes the mechanism. Dantonists now the loudest critics. Options: Purge Dantonists, attempt reconciliation (weaker position now), do nothing (Dantonist critiques continue).
      *   **Dantonists:** More isolated, Hébertist purge shows CPS ruthlessness. Critiques of terror now seem even more dangerous. Options: Double down on moderation (high risk), fall silent (difficult for prominent figures), attempt coalition building (harder).
      *   **The Plain:** Witnessed Hébertist fate. Signaling loyalty requires denouncing *someone*; Dantonists are the obvious, safer target than CPS.
      *   **Why Preemption Was Rational:**
          *   **CPS:** Dantonists were now the primary source of criticism and potential focal point for opposition. Their calls for clemency undermined the Terror's logic. Eliminating them silenced critics, demonstrated continued revolutionary rigor, and removed rivals. *Not* purging them after Hébert would signal weakness or tolerance of "moderantism" – the ultimate disloyalty signal.
          *   **Dantonists:** Their options were terrible. Preemptively striking the CPS was near-impossible without Hébertist street power. Silence or flight might have been marginally safer but politically untenable for them. Denouncing CPS directly was suicide. They were trapped.
          *   **The Plain:** Denouncing Dantonists became the safest way to signal unwavering commitment after the CPS's decisive action against the Hébertists. Supporting Dantonists risked association with disloyalty.

  3.  **Predicting the Order:**
      The spiral **predicts the specific order (Hébertists first, then Dantonists) remarkably well** in this phase.
      *   **Asymmetric Threat:** The Hébertists posed a more immediate, destabilizing threat (potential insurrection) than the Dantonists (rhetorical opposition). Eliminating the greater threat first was rational for the CPS.
      *   **Signaling Value:** Purging the radicals first signaled the CPS wasn't "moderate," making the subsequent purge of moderates "safer" internally. Purging moderates first would have left the CPS exposed to the radicals and signaled insufficient revolutionary zeal.
      *   **Target Availability:** Post-Hébert purge, the Dantonists became the most visible "other," making them the inevitable next target for denunciations to prove loyalty.

  **Breakdown: Thermidor (July 1794)**

  1.  **Actors & Situation:**
      *   **Robespierre & Core Allies (Saint-Just, Couthon):** Increasingly isolated, targeting "corrupt" deputies and CPS/CGS colleagues (Collot, Billaud, Barère, Tallien, Fouché) for moral purge without clear charges. Vague threats in speeches.
      *   **Threatened Deputies (Collot, Billaud, Tallien, Fouché, Fréron, etc.):** A heterogeneous group (ex-Hébertists, ex-Dantonist sympathizers, hardline terrorists fearing scrutiny). United *only* by fear of being Robespierre's next target. Deep mutual distrust.
      *   **The Plain:** Exhausted, terrified, sensing Robespierre's list of targets might be endless. Facing potential moral purge themselves.
      *   **Options:**
          *   **Robespierre:** Double down on moral purification via Convention speech (the 8 Thermidor gamble), or attempt reconciliation (seemingly impossible for him).
          *   **Threatened Deputies:** Wait to be purged individually, or band together preemptively to strike Robespierre.
          *   **The Plain:** Follow the momentum; survival instinct paramount.

  2.  **Why Thermidor Breaks the Spiral:**
      *   **Not "Strike First" Between Factions:** There was no coherent "Thermidorian faction" with an ideology challenging Robespierre *before* the coup. The coalition was purely *defensive* and *reactive*, formed *because* Robespierre's actions threatened them all *individually*. It was a coalition of the condemned.
      *   **Overcoming Distrust:** The mechanism assumes distrust prevents coalition. Thermidor shows that *sufficient, immediate, and universal threat* can *overcome* distrust. Robespierre's vague threats on 8 Thermidor made it clear that *anyone* not in his inner circle could be next. Their shared, overwhelming fear of imminent doom trumped mutual suspicion. Silence or individual denunciation wouldn't save them; only collective action could.
      *   **Targeting the Center:** Robespierre wasn't purging a rival faction *on the flanks* (like Hébertists/Dantonists). He was threatening the *core* of the revolutionary government (CPS/CGS colleagues) and key Convention figures. This made the threat pervasive and undeniable.
      *   **The Promise of an End:** The Thermidorians didn't just replace Robespierre; they fundamentally broke the spiral by dismantling the institutional machinery of the Terror (CPS dominance, Law of 22 Prairial) *after* the coup. Their goal was survival *and* ending the dynamic that threatened them.

  3.  **Impact on the Spiral Story:**
      *   **Symptom vs. Cause:** Thermidor reveals the signaling spiral as a powerful **symptom and accelerator** of the Terror's dynamics, but **not its root cause**. The spiral operated *within* the environment created by:
          *   **Ideology:** The absolutist, paranoid logic of virtue vs. conspiracy inherent in Jacobinism/Rousseauism, demanding constant proof of purity.
          *   **Circumstance:** The existential threats (war, civil war, economic collapse) that justified emergency measures and amplified fear.
          *   **Institutions:** The concentration of power in the CPS and the lack of legal safeguards, making denunciation the primary political tool.
      *   **Survival for Earlier Purges:** The spiral remains a **robust explanation for the specific sequence and logic of the Hébertist and Dantonist purges**. It perfectly captures the internal strategic logic driving factions within the Terror's framework.
      *   **Limitation Revealed:** Thermidor shows the spiral has a **breaking point**. When the threat becomes so universal and imminent that it targets the very center of power, and when the mechanism itself becomes the primary threat to almost all players, a defensive coalition *can* form to break the cycle, even among distrustful actors. The spiral predicts escalation but not necessarily this specific rupture.

  **Relationship to Standard Interpretations:**

  1.  **Class Struggle:**
      *   **Resembles?** Minimally. The spiral operates on political/logistic dynamics (signaling, preemption) within the revolutionary elite, largely detached from underlying class conflicts (bourgeoisie vs. aristocracy, bourgeoisie vs. sans-culottes). The sans-culottes are instrumentalized (Hébertists) or sidelined (Thermidor).
      *   **Cuts Against:** The spiral explains purges *within* the dominant bourgeois revolutionary bloc (CPS, Convention deputies) without reference to class interests. Robespierre purged bourgeois factions (Hébertists had bourgeois leaders, Dantonists were bourgeois). Thermidor was a coup *within* the bourgeoisie. Class interests set the stage but don't dictate the purge sequence.
      *   **Unexplained:** Why the bourgeoisie fractured; the *origins* of factional lines (often tied to differing class strategies/audiences - Hébertists reliant on sans-culottes, Dantonists on propertied).

  2.  **Ideology (Political Religion/Doctrinal Logic):**
      *   **Resembles?** Significantly. The need for "proof" of revolutionary virtue/commitment is deeply ideological. The intolerance of dissent stems from ideological absolutism (Republic of Virtue). The spiral weaponizes ideology.
      *   **Cuts Against:** The spiral highlights the *strategic* and *instrumental* use of ideology. Denunciations become the "cheapest available proof," suggesting actors might use ideological charges cynically for survival, not purely from conviction. Thermidor shows ideology can be abandoned for survival (Thermidorians had no coherent new ideology initially).
      *   **Unexplained:** Why *this* particular ideology emerged with such force; the specific *content* of the charges (foreign plot, corruption, moderantism – all ideologically framed).

  3.  **Contingency/Individual Agency:**
      *   **Resembles?** Strongly in terms of focusing on decisions under pressure. The spiral creates a structure where individual choices (to denounce, to preempt) are paramount, constrained by the logic of the situation.
      *   **Cuts Against:** It reveals a powerful **systematic logic** ("bare strategic logic") underlying the apparent chaos. The sequence (Hébert->Danton) wasn't *just* accident or Robespierre's whim; it was the rational outcome of the spiral dynamic given the threats. Contingency matters (e.g., Robespierre's illness, specific speeches), but the spiral creates strong pressures and predictable patterns.
      *   **Unexplained:** The *origin* of the initial conditions (why denunciation became the key signal); the role of specific personalities (Robespierre's incorruptibility vs. Danton's pragmatism, Tallien's ruthlessness).

  **Conclusion: Mechanism and Interpretation**

  *   The loyalty-signaling spiral is a powerful model explaining the **specific sequence and internal logic** of the purges from Hébert to Danton. It operates as a self-reinforcing dynamic within the Terror.
  *   Thermidor demonstrates its **limits**, showing that a universal threat can trigger a defensive coalition that breaks the spiral, even amidst distrust. The spiral explains the descent into Terror better than its abrupt end.
  *   **Against Interpretations:** The spiral cuts against the *primacy* of class struggle or pure ideology by showing a strategic logic operating within (and exploiting) those frameworks. It challenges pure contingency by revealing a systematic dynamic.
  *   **Revealing the Debate:** The analysis suggests the interpretive debate is somewhat miscast. The "bare strategic logic" of the spiral **transcends** specific social bases or creeds. It reveals a **recurring dynamic of self-destruction** inherent in revolutionary situations characterized by extreme polarization, existential threat, weak institutions, and the weaponization of ideological purity, where proving loyalty becomes paramount and treacherous. The interesting question becomes **why this dynamic emerges in some revolutions (France, Russia, maybe others) but not all, and what factors prevent it or allow it to be broken (as in Thermidor)**.
  *   **What the Mechanism Leaves Unexplained:**
      *   The **origins** of the ideological fervor and intolerance that make "virtue signaling" necessary.
      *   The **specific social and economic pressures** (war, famine, inflation) that created the existential crisis fueling the Terror.
      *   The **institutional developments** (rise of the CPS, Law of Suspects, Law of 22 Prairial) that concentrated power and facilitated denunciation.
      *   The **role of individual psychology and charisma** (Robespierre's unique authority and rigidity).
      *   The **ultimate goals** of the actors beyond survival within the revolutionary framework.

  The loyalty-signaling spiral is not a total explanation, but it powerfully illuminates a key mechanism driving the Revolution's self-cannibalization during the Terror, revealing a logic that operates across different revolutionary contexts.
