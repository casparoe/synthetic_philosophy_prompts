  3: A Speak, B Build ->
    start: A:12, B:4
    A speaks: A scores 4 (>=6)
    B builds: -> B:4+2=6
    points: A:4, B:0
    end: A:12, B:6

  4: A Speak, B Speak ->
    start: A:12, B:6
