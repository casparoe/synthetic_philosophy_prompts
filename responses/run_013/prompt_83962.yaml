    -> mutual Speak again.
    A scores: 4 (>=6) -> total 11+4+3=18? No, the 11 was from round 4, so after round 4: A had 11, B had 7.
    In round 5:
      A Speak: scores 4.
      B Speak: scores 4.
      mutual bonus: 3 each.
      So A: 11 + 4 + 3 = 18, B: 7 + 4 + 3 = 14.

  And they can continue to mutual Speak for the remaining rounds.

  But in this scenario, A stopped taking after two rounds and then they coordinated on mutual Speak.

  This is the reciprocal recognition.

  But we want the dynamic where if A keeps taking, they both lose, but if A stops and they coordinate, they both win.

  But in this case, A has more points because A had more initial opportunities to score.

  After 8 rounds, if they mutual Speak for the last 6 rounds:

  After round 2: A:12 chips, B:4 chips. Scores: A:0, B:0.

  Round 3: A and B don't mutual speak yet. Only in round 4 they start.

  Round 3: A speaks alone: A scores 4.

  Round 4: mutual speak: A:4 (from speak) +3 (bonus)=7 for the round, so total A:4+7=11? Wait, let's track per round.

  Let me make a table:

  Round | A move | B move | A start chips | B start chips | A points this round | B points this round | A end chips | B end chips
  1: A Take, B Build -> 
    start: A:8, B:4
    A takes 2 from B: B now 2
    B builds: +2 -> B:4
    points: 0,0
    end: A:10, B:4

  2: A Take, B Build ->
    start: A:10, B:4
    A takes 2: B->2
    B builds: ->4
    points:0,0
