prompt: |-
  ok so I'm TAing a 3rd-year seminar on practical reason and I've recieved a stack of midterms that are due back to the students on friday. I keep going back and forth on this one and I'd rather not just give it a vibe-based number. Here's the exam question and what she wrote.

  Question (20 marks). Bernard Williams argues that all reasons for action are internal reasons.

  (a) Set out the distinction between internal and external reason statements, and say what Williams thinks is wrong with external reason statements. [8]

  (b) Explain the role of the sound deliberative route in his account of what it is for an agent to have a reason. What work is that clause doing that a plain desire-satisfaction story would not do? [7]

  (c) Critics say Williams's view leaves no room for moral reasons to bear on someone who does not already care. State the objection as strongly as you can, and explain how Williams would answer it. [5]

  Her answer:

  Williams is attacking the idea that there are reasons which apply to an agent no matter what she happens to care about. Those are external reason statements, and he argues that they are all false. His own view, internalism, is that the claim that A has a reason to do something is true only if there is a sound deliberative route from A's subjective motivational set (S) to A's doing it. S is what the agent actually wants, cares about and is committed to.

  The argument is that a reason statement has to be able to explain the agent's behaviour. If I say that a man has a reason to be kinder to his wife, and he has no interest at all in being kinder, then my statement explains nothing that he does or feels; it floats free of his psychology. A statement that cannot do that explanatory work is not a reason statement at all. So external reason statements are false, and every genuine reason has to hook up with what the agent already cares about.

  This is really the doctrine of motivational internalism, that to judge that you ought to do something is already to be moved to do it, since otherwise the judgement is not really a judgement about your reasons. Williams is therefore a Humean: practical reason is instrumental, and deliberation is just working out the most efficient way of getting what you already want. The sound deliberative route is not a route to new ends, only to better means.

  It is worth adding that Williams does not think an agent always acts on the reasons she has. She may be ignorant of the relevant facts, or she may simply not bother to think things through properly, and then she fails to act on a reason that she has all the same. That is not a counterexample to internalism, because internalism is about the truth of the reason statement, not about what the agent actually does.

  The consequence is that a man who genuinely does not care about anyone else has no reason to be decent, and I suppose no reason to reproach himself for it either. The standard objection is that this makes moral criticism of such a man impossible. Williams's answer is that the objection begs the question, since it assumes that there must be a reason for him to be decent, which is exactly what is at issue.

  Can you give me a mark out of 20 and then the comments that justify it, working through the answer claim by claim, so I can paste them straight into the feedback box: which sentences are carrying the argument, what's right, what's wrong, what's just vague or unsupported, and roughly how many marks each of the three parts earns. If something in there is actually correct but reads like a mistake, say so explicitly, I don't want to dock her for it. And tell me where you'd land overall (distinction / solid pass / borderline / fail), not just the number. If you think the question itself is ambiguous somewhere, say that too, that part's on me.
reasoning: |-
  Okay, the user is a TA grading midterms for a 3rd-year seminar on practical reason, specifically wrestling with Bernard Williams' internalism. They need detailed feedback on a student's answer to a three-part question worth 20 marks, due back Friday. The user explicitly wants: a mark out of 20, comment justification claim-by-claim, breakdown of strengths/weaknesses per section, and an overall classification (distinction/pass/etc.). 

  First impression of the student's answer: surprisingly sophisticated but has significant gaps. The phrasing "really the doctrine of motivational internalism" suggests a confident tone, but that's actually where the first major error creeps in—conflating Williams with moral internalism. The user flagged concern about "vibe-based" grading, so precision in mapping critiques to rubric points is crucial. 

  Breaking it down:
  - For (a): She nails the core distinction (internal/external) and Williams' rejection of externality, even capturing his explanatory requirement. But she oversimplifies S as "wants/cares/committed" without mentioning dispositions/commitments beyond desires. (Deduct 1 mark? Rubric says 8 points…)
  - For (b): This is the weak spot. She reduces "sound deliberative route" to purely instrumental reasoning ("only better means"), missing Williams' allowance for deliberation broadening S—like discovering new values through imaginative reflection. That’s a central nuance! Also, the motivational internalism claim here is flat wrong. (Costly—this is 7 marks, so maybe -3?)
  - For (c): Strong recovery. States the objection sharply and gets Williams' "begs the question" retort exactly right. Could push deeper on how Williams handles criticism of amoralists, but it’s adequate for 5 marks. 

  Noticing subtle strengths: Her point about ignorance/failure-to-deliberate not refuting internalism is perceptive and shows she grasps the theory’s structure. The writing is concise—no fluff. 

  Overall mark: 14/20 feels right. Section (b) drags it down, but (a) and (c) are competent. That’s a solid pass (B-/C+ territory). User should note: If this seminar is high-stakes, 14 might feel generous given (b)'s error, but the answer demonstrates understanding beyond surface level. 

  One user concern: They mentioned not wanting to dock for "correct but reads like a mistake" bits. Example—her "Humean/instrumental" phrasing isn’t wholly incorrect (Williams *is* neo-Humean), but the implication that deliberation *never* yields new ends is the flaw. Feedback should disentangle that. 

  Final note: The question itself is clear. No ambiguity—student just missed layers in (b).
answer: |-
  Here's a comprehensive breakdown of the student's answer, a mark justification, and feedback comments you can paste directly. The answer demonstrates a solid grasp of core concepts but has significant flaws, particularly in part (b).

  **Overall Mark: 14/20 (Solid Pass - B-/C+ equivalent)**  
  *Breakdown: (a) 7/8, (b) 3/7, (c) 4/5*

  **Overall Classification:** **Solid Pass** (Demonstrates competent understanding of core material but with notable omissions/errors in a key section).

  ---

  ### Feedback Comments (Paste as-is):
  **Overall:** Your answer shows a strong grasp of Williams' core distinction and the moral objection, but it misrepresents the "sound deliberative route" in part (b), significantly undermining that section. Your writing is clear and concise, which helps where the content is accurate.

  **Part (a) [7/8]**  
  *Strong points:*  
  - ✅ **"Williams is attacking... no matter what she happens to care about"**: Perfect opening – captures the essence of external reasons.  
  - ✅ **"external reason statements... are all false"**: Correctly states Williams' rejection.  
  - ✅ **"internalism... subjective motivational set (S)"**: Accurate definition of internalism and S.  
  - ✅ **"The argument is that a reason statement has to... explain behaviour"**: Excellent summary of Williams' explanatory requirement.  
  - ✅ **"If I say that a man has a reason... floats free of his psychology"**: Clear, relevant example illustrating the critique.  

  *Minor shortcomings:*  
  - ⚠️ **"S is what the agent actually wants, cares about and is committed to"**: This is mostly right but slightly reductive. Williams includes deeper dispositions/long-term projects (e.g., "commitments") beyond fleeting desires. A small nuance missed.  
  *Why 7/8?* Core distinction and critique are flawlessly explained. The slight underselling of S’s complexity costs 1 mark.

  ---

  **Part (b) [3/7]**  
  *Major errors:*  
  - ❌ **"This is really the doctrine of motivational internalism"**: **Incorrect.** Motivational internalism is a *moral* thesis (judgment motivates action). Williams is discussing *reasons generally*, not moral judgments specifically. This conflation misrepresents his project.  
  - ❌ **"The sound deliberative route is not a route to new ends, only to better means"**: **Fundamentally wrong.** Williams *explicitly* allows deliberation to yield new ends (e.g., via imagination, correcting irrationality). This is the *key innovation* beyond plain desire-satisfaction.  
  - ❌ **"Williams is therefore a Humean: practical reason is instrumental"**: Overly simplistic. While Williams builds on Hume, his "sound deliberative route" includes *non-instrumental* elements (e.g., deliberating about ethical consistency).  

  *What’s missing:*  
  - 🔶 **Role of the sound deliberative route**: You omit that it *corrects* existing S (e.g., removing false beliefs, resolving conflicts, imaginative rehearsal).  
  - 🔶 **Work it does vs. plain desire-satisfaction**: You needed to say it avoids "subjective arbitrariness" – desires must survive *rational scrutiny* to ground reasons. A "plain desire" story might endorse delusional/contradictory desires; Williams' clause ensures reasons are *rationally accessible*.  

  *Why 3/7?* The core definition is absent, and the "only means" claim is a critical error. The motivational internalism misstep compounds this. However, you correctly link deliberation to S (1), and the "ignorance" point (next section) *partly* salvages it (2).

  ---

  **Part (c) [4/5]**  
  *Strong points:*  
  - ✅ **"a man who genuinely does not care... has no reason to be decent"**: Precise statement of the objection’s consequence.  
  - ✅ **"The standard objection... moral criticism impossible"**: Forcefully articulates the critique.  
  - ✅ **"Williams's answer is that the objection begs the question"**: **Exactly right.** His rebuttal hinges on rejecting the *assumption* of external reasons.  

  *Minor omission:*  
  - ⚠️ **"I suppose no reason to reproach himself"**: Williams *could* allow reproach if it connects to S (e.g., the amoralist cares about consistency). You miss that Williams *redefines* criticism (e.g., "you’re not who you think you are") rather than denying it entirely.  
  *Why 4/5?* Objection and reply are correctly captured. Losing 1 mark for not addressing how Williams *reconceives* (not abandons) moral criticism.

  ---

  ### Justification for 14/20:
  - **Strengths**: Part (a) is excellent; part (c) is very good. You articulate Williams’ core argument and the moral objection with clarity and accuracy.  
  - **Weaknesses**: Part (b) contains significant errors (motivational internalism conflation, misrepresenting deliberation) and omissions (rational correction of S). This was the heaviest-weighted section for complexity.  
  - **Balance**: Strong performance on 13/15 marks of (a) and (c) offsets the poor showing on (b). 14/20 reflects a competent but uneven understanding.

  **Key Takeaway:** You understand Williams’ *negative* project (critiquing external reasons) better than his *positive* account (how internal reasons work). Focus on how "sound deliberation" refines, not just executes, subjective motivations. Good effort overall.

  ---

  ### Notes on the Question:
  - **No ambiguity**: The question is well-structured. Part (b) explicitly asks for the role of the sound deliberative route *and* its distinction from desire-satisfaction – this cues students to address rational correction.  
  - **"Correct but reads wrong"**: Your "Humean/instrumental" point *isn’t* inherently wrong (Williams is neo-Humean), but it became problematic by denying *any* new ends. Context made it an error.  
  - **Vague/Unsupported Claims**:  
    - "S is what the agent actually wants..." → Needs "dispositions, commitments" (Williams, *Internal and External Reasons*).  
    - "Deliberation is just working out... better means" → Directly contradicted by Williams’ examples (e.g., the "non-optional" project of avoiding cowardice).  

  This should give you clear rationale for the mark and actionable feedback!
