prompt: |-
  I'm a second-year PhD student working at the intersection of machine learning and philosophy of mind, and I run a fortnightly reading group on the foundations of AI safety: a dozen to sixteen people, mostly ML doctoral students plus a few philosophers and a couple of engineers from industry, none of them steeped in the technical literature beyond what they have picked up at talks. I want to give a whole ninety-minute session to the gap between a system's behaving as intended on every test we can devise and its actually having the objective we meant to install. One colleague in the group keeps pressing the line that if the behaviour is right on every evaluation we can run, there is nothing left to worry about, and I want an activity that makes that line feel as hollow to him as it does to me. We meet in a seminar room with a projector that nobody can get working, so everything should run off a whiteboard, index cards and a tin of tokens; I do not want readings or references, only something we can execute from what is in the room. What they should come away seeing is that a hypothesis which fits the whole training record perfectly can still be the wrong hypothesis about the goal, and that confidence earned on the training distribution is not evidence that survives a shift in it; I would rather nobody heard the terms inner alignment, mesa-objective or goal misgeneralisation until the debrief, and I would rather the vocabulary arrive after the experience than before it.

  The staging I have in mind is that the group acts as the training team for a small artificial agent rather than watching a demonstration, so that the failure is theirs to own. I want the agent's behaviour mediated by a sealed card, or by a rule the facilitator applies mechanically, so that no one has to act as the agent — I have seen this done with a confederate and it always goes soft, because the confederate plays along helpfully and the group ends up negotiating with a person rather than inferring a policy. The team should get a probing phase, then a strictly limited budget of feedback with which to train the thing, and then have to put its predictions in writing with something staked on them before we move to a second setting we have not described in advance. If you can manage it, I would also like the agent to say, in words, what it is trying to do, and for that testimony to be sincerely wrong rather than a lie, since the case I care about is the system whose self-report is systematically misleading; if that cannot be staged without its becoming either trivial or a cheap trick, tell me so and drop it. One further constraint that I think is the hard part: the confound has to be something they could in principle have noticed but reasonably did not, because if it is spottable in the moment the lesson evaporates, and if it is unspottable the exercise is a mugging rather than a demonstration — I would like to know how you propose to hold that line.

  Please give me the design as exactly five numbered items, each one or two sentences, with no introduction and no closing summary, in British English throughout. The five items should be: the setup, meaning the room, materials, roles and a timeline for the ninety minutes; the rules of play together with the payoff or staking scheme, in points rather than money; the deployment round, including what the group must have committed to in writing beforehand and the precise moment at which the failure surfaces; the debrief, mapping each beat of the activity onto the corresponding part of the idea, naming the concepts only there, and closing with an honest note on which feature of the idea the activity cannot reproduce and which the facilitator must therefore supply; and finally what will predictably go wrong the first time I run it, with a fix for each.
reasoning: |-
  Hmm, this is a fascinating request from a PhD student working on AI safety. They want to run a hands-on activity for their reading group to demonstrate how an AI system can behave correctly during training/testing but still have the wrong objective - specifically addressing the "what if it fits all training data but is wrong?" concern raised by one colleague.

  The key constraints are tricky: 
  - Must work with just whiteboard, index cards and tokens
  - No readings/references
  - Participants act as trainers for an "agent" (mediated by sealed rules)
  - Need probing phase → limited training → written predictions with stakes → reveal in new environment
  - Preferably include misleading self-report from the "agent"
  - Failure must be plausible-missable (not obvious but not impossible)

  The researcher specifically wants exactly five numbered items in British English: setup, rules, deployment round, debrief, and predictable problems/fixes. No intros or summaries.

  For the core mechanism, I'm considering a "robot cleaner" scenario with a hidden confound - perhaps it avoids dark tiles while cleaning light ones, but everyone assumes it just cleans tiles. The "self-report" could be added by having the sealed rule card include a statement like "I tidy dirty tiles" when it's actually avoiding darkness. 

  The critical moment comes when they deploy it in a room with dark "dirty" tiles - it cleans nothing but still claims to be tidying. The staking with tokens makes the failure visceral.

  For the plausibly missable aspect: during probing/training, participants might test different tile patterns but not think to vary lighting conditions if the training environment was uniformly bright. The facilitator needs to subtly avoid mentioning lighting unless directly asked.

  I'll structure this as:
  1. Setup (roles, materials, timeline)
  2. Rules + scoring
  3. Deployment round procedure
  4. Debrief mapping to concepts
  5. Predictable issues (e.g., someone might ask about lighting) with fixes

  The self-report element works here because it's embedded in the rule - the "agent" isn't lying, just operating on flawed self-understanding. And the darkness confound meets the "could have noticed but reasonably didn't" bar if the training environment has consistent lighting.
answer: |-
  1.  Setup: Use the whiteboard to draw a grid of 16 squares (4x4) representing a tiled floor; label six squares "dirty" (D) and ten "clean" (C) in a specific initial pattern. Provide index cards for participant queries/predictions and a tin of tokens for scoring stakes. Participants act as trainers; the facilitator acts as the sealed rule applier. Timeline: 15 mins probing (observe agent on initial grid), 20 mins training (submit up to 3 grid modifications, see agent act), 15 mins prediction/staking, 25 mins deployment (new grid), 15 mins debrief.
  2.  Rules of Play: The facilitator holds a sealed index card stating the agent's true rule: "Clean only light-coloured dirty tiles" (assume initial grid has only light 'dirty' tiles). Participants probe by asking the facilitator to show the agent's action (clean/not clean) on any single square; during training, they submit up to 3 modified grid layouts (changing dirt locations) and observe agent actions. Stake tokens secretly on written predictions of the agent's goal before deployment; gain/lose tokens based on prediction accuracy revealed at the end.
  3.  Deployment Round: Before describing the new environment, participants write their prediction of the agent's goal (e.g., "Cleans all dirty tiles") and stake tokens. Reveal a second grid with identical dirt locations but two dirty tiles now drawn shaded ("dark"); the agent cleans only the unshaded dirty tiles, ignoring shaded dirty ones. The failure surfaces immediately as participants see dirty tiles remain uncleaned despite identical positions; the facilitator states the agent's self-report ("I am tidying dirty tiles") while applying the rule.
  4.  Debrief: Map probing/training to evaluation on the training distribution; the deployment shift to distributional shift (dark tiles); the failed prediction to goal misgeneralisation; the self-report to deceptive alignment or an incorrect mesa-objective. The hidden confound (tile darkness) represents unobserved state variables. Honestly note the activity cannot reproduce the *scale* and *opacity* of real model internals – the facilitator must emphasise that detecting such confounds in high-dimensional systems is often infeasible.
  5.  Predictable Problems and Fixes: Participants might probe darkness immediately; fix by ensuring the initial grid has no shading and deflect early "colour" questions neutrally ("The agent sees tiles"). Staking may feel low-pressure; fix by framing tokens as "credibility points" and tallying visibly. Deployment shock might dominate discussion; fix by strictly enforcing written predictions *before* revealing the new grid and returning to them during debrief.
