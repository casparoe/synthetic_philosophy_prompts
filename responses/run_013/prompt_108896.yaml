prompt: |-
  Last night my friend Dana and I spent like three hours arguing about whether you can cause something by doing nothing. It started as a dumb joke about me forgetting to water her plants and somehow ended up with us drawing diagrams on the back of a receipt: lifeguard asleep on the stand while someone drowns — is the cause the sleeping, or the not-swimming-in, or the drowning, or is there just no cause there and we're reading our own guilt into the world. Dana thinks causation by omission is basically a projection of our blame habits onto the furniture of the universe. I think there's something real under there but every time I try to say what it is I end up just redescribing the blame habits. She got me on one thing: she asked why, if omissions can cause, my forgetting her plants isn't "the cause" of them dying in the same sense the drought is, and I didn't have an answer that wasn't just about me feeling bad.

  The only thing I got out of the whole night was a half-idea. Maybe the interesting cases aren't the pure inaction ones (bystander, nothing happening, no mechanism anywhere) but the ones where some process is already churning and the omission is a hole punched in it — the nurse skipping the dose, the brake that doesn't fire, the auditor who never looks. Like the omission borrows its causal oomph from the mechanism it interrupts. Dana says that's just the problem restated. Is it?

  I need to do something with this or it'll eat another three evenings. I'm convening a small working group next term: me, five grad students, one person from the law school, one from the hospital ethics committee. Twelve weeks, no lab, no data, no money, just arguments and cases. Give me an agenda — which open questions about omission-causation actually matter most for a group like that, ranked, and why.

  Defend the ordering. For each one, tell me whether it's upstream or downstream of the others (if we settled it, what gets easier or just dissolves), how tractable it is for people with no lab and one semester, and whether it's the kind of thing where the answer would change what anyone does or believes outside the seminar room. Flag the ones that feel deep but wouldn't move anything downstream even if we nailed them — I'd rather skip those. Also, does the picture change when the agent is a system rather than a person: a car that doesn't brake, a recommender that doesn't show the warning, something with no duties and arguably no agent. Is that a genuinely new question or the old one wearing a costume? And say what evidence or argument over the next year or two would bump a question up or down your list.

  Dont give me a reading list, I know the literature better than I'd like to. I want your reasoning about what's worth the twelve weeks, not a syllabus.
reasoning: |-
  Okay, the user has presented a fascinating philosophical dilemma about causation by omission that emerged from a personal debate. They're clearly deeply engaged with this topic and frustrated by circular arguments. The core tension seems to be between Dana's position that omission-causation is merely projected blame and their intuition that there's something ontologically real about certain omissions causing harm. 

  Their proposed distinction between "pure inaction" versus "interrupting existing processes" shows they've done significant conceptual work already. What they need now is structural guidance for a focused academic working group - not more literature, but a strategic framework to make progress on what matters. 

  I notice several layers to their request: First, they want priority-ranked research questions that avoid dead-end philosophical traps. Second, they're concerned about practical relevance - will this change how people think or act? Third, they're probing whether system-agency introduces fundamentally new dimensions. Underlying all this is a desire to transform their 3-hour receipt-doodling session into academically productive inquiry.

  The hospital ethics committee and law school memberships suggest applied contexts matter here. That's crucial - the most valuable questions will be those where conceptual clarity resolves real-world ambiguities (like legal liability or moral responsibility). The system-agency angle feels particularly urgent given algorithmic decision-making in modern life.

  Their skepticism about "deep but useless" questions resonates. We should focus where answers would actually disentangle existing debates. For example, distinguishing omission-as-cause from omission-as-condition could collapse entire sub-arguments about the plant scenario. Meanwhile, the counterfactual dependence question might be philosophically rich but less generative for applied settings.

  The tractability filter matters too. With no lab/data, we need questions answerable through case analysis and conceptual mapping. The "pre-existing mechanism" hypothesis they floated could be productively tested against diverse scenarios - medical errors, algorithmic failures, mechanical defects - to see if it consistently holds explanatory power.

  For the system question: it's not entirely new (we've had corporate liability debates for centuries) but the lack of intentionality in algorithms creates novel wrinkles. Worth elevating as a separate question because resolving it might force clearer definitions of "agent" and "duty" that could retroactively clarify human cases too.
answer: |-
  Here’s a focused agenda for your working group, prioritizing questions that unlock practical clarity and avoid philosophical quicksand. The ranking balances **catalytic power** (resolving upstream questions simplifies downstream ones), **tractability** (amenable to case-driven debate), and **external impact** (potential to shift real-world reasoning).  

  ### Core Ranking & Rationale  
  1. **What distinguishes *causally relevant omissions* from mere background conditions?**  
     - **Why #1?** Upstream and foundational. If settled, it dissolves ~40% of circular debates (like your plant/drought example).  
     - **Tractability:** Ideal for case comparisons (e.g., nurse skipping dose vs. drought failing to rain). Forces concrete criteria.  
     - **Impact:** Clarifies legal/ethical blame in negligence cases. Distinguishes "failure to act" from "unlucky absence."  
     - **Evidence Shift:** New AI liability cases (e.g., algorithms omitting safety checks) could force sharper definitions.  

  2. **Does causation by omission require a *pre-existing normative expectation* (duty, design function, default process)?**  
     - **Why #2?** Directly tests Dana’s "blame projection" critique and your "interrupted mechanism" insight.  
     - **Tractability:** Map cases: lifeguard (duty) vs. passerby (no duty); brake system (design) vs. rain (no design).  
     - **Impact:** Reshapes malpractice law, product liability, ethics codes. Determines when "doing nothing" is legally/ethically salient.  
     - **Downstream Effect:** Resolving this makes #3 and #4 far cleaner.  

  3. **When systems (not people) are agents, does omission-causation *change fundamentally*?**  
     - **Why #3?** Not just a "costume" — systems lack intentionality but have designed functions. This exposes whether "duty" or "interrupted process" is core.  
     - **Tractability:** Compare: autopilot failing to detect obstacle (system) vs. sleepy driver (person).  
     - **Impact:** Critical for regulating AI, automated infrastructure, corporate liability.  
     - **Catalytic Power:** Forces the group to decouple *causal structure* from *moral agency*.  

  4. **Can omissions be *proximal causes*, or are they always *distal enabling conditions?***  
     - **Why #4?** Downstream of #1-2. Determines if "the nurse caused death" or "the skipped dose caused death" is coherent.  
     - **Tractability:** Analyze causal chains: e.g., auditor’s omission → undetected fraud → bankruptcy.  
     - **Impact:** Affects legal causation tests ("but-for" causation) and moral responsibility.  
     - **Risk:** Could get bogged in semantics. Anchor in court rulings (e.g., *People v. Beardsley*).  

  5. **Does recognizing omission-causation *require counterfactual dependence*, and if so, whose?**  
     - **Why #5?** Most abstract, but tests if all roads lead to "if X had acted, Y wouldn’t have happened."  
     - **Tractability:** Use thought experiments (e.g., two lifeguards napping — who "caused" drowning?).  
     - **Impact:** Low outside philosophy — but if resolved, simplifies everything upstream.  
     - **Placement:** Last because it’s the "nuclear option." If the group agrees omissions reduce to counterfactuals, earlier questions lose urgency.  

  ---

  ### What to Deprioritize (Despite Temptation)  
  - **"Do absences *really exist* as causes?"** (Metaphysical quicksand; minimal external impact)  
  - **"Is guilt necessary to perceive omission-causation?"** (Psychology, not causal structure; downstream of #2)  
  - **"Can God/universal forces omit actions?"** (Theologically fun, but zero traction for applied work)  

  ---

  ### Why This Order Works  
  - **Weeks 1–4:** Hammer #1 (relevance) and #2 (normative expectations) using medical error cases + product liability suits. Outcome: A shared rubric for "when omissions matter."  
  - **Weeks 5–7:** Apply the rubric to #3 (systems). Outcome: Refine rubric or reveal gaps in non-human agents.  
  - **Weeks 8–10:** Test rubric on #4 (proximal vs. distal) using corporate/fraud cases. Outcome: Identify causal "thresholds."  
  - **Weeks 11–12:** Stress-test with #5 (counterfactuals). Outcome: Either solidify the framework or expose fatal flaws.  

  ---

  ### External Catalysts to Watch  
  1. **AI near-misses** (e.g., algorithmic omission in medical triage causing harm) will force #3 higher.  
  2. **Climate liability suits** (e.g., "failed to maintain infrastructure") will pressure #1 and #4.  
  3. **Neuroethics research** on "intentional inaction" (e.g., brain scans of bystanders) could reshape #2.  

  Dana’s right that pure inaction (bystander) is a dead end — but your "interrupted mechanism" insight is the key. Focus there: **omit the omissions that don’t interrupt**, and this group will crack something real.
