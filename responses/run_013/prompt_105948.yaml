answer: |-
  Your inquiry cuts to the heart of testimony's paradox: how belief forms when rational evidence falters. Greene and Hume orbit the same epistemic void but map divergent paths—one forensic, the other phenomenological. Let's dissect the alignment and rupture.  

  ### Where Greene Bears Hume Out: The Forensics of Doubt  
  1. **Interested Witnesses & Corrupted Testimony**:  
     - Sarah’s diary, read posthumously by Bendrix, embodies Hume’s warning: testimony from "interested parties" suffers from "passion" and "delusion." Sarah’s vow—"If he lives, I’ll believe. I’ll give him up for ever"—is a bargaining act, not dispassionate observation. Bendrix, a hostile reader, filters her words through jealousy and grief. Hume would dismiss this as "testimony against testimony," where bias erodes credibility.  
     - The later miracles (Parkis’s son’s birthmark, Smythe’s acne cure) are public but mediated. Smythe’s account reaches Bendrix via hearsay ("*they say* the atheist’s rash cleared"). Hume’s "wise man" rejects such cascading testimony, where "surprise and wonder" amplify claims unmoored from direct evidence.  

  2. **Sectarian Miracles & Mutual Annulment**:  
     - Hume argues rival miracles cancel each other: Catholic wonders negate Protestant ones. Greene’s cures are exclusively Catholic—Sarah’s prayer to a Catholic God, the boy’s baptismal water—marginalizing non-Catholic experiences. Smythe’s "cure" reinforces Catholic doctrine, fitting Hume’s model of miracles serving partisan ideology.  

  3. **Probability vs. Uniform Experience**:  
     - Hume weights miracles against "firm and unalterable experience" of natural laws. Bendrix’s survival *could* be luck (V-1 duds existed); the birthmark fade *could* be remission. Greene seeds doubt via naturalistic explanations, letting Humean skepticism thrive in the gaps.  

  ### Where Greene Exceeds Hume: The Epistemology of Vows  
  Here, Greene dramatizes belief’s *volitional core*, where testimony is not observed but *enacted*:  

  - **Sarah’s Vow as Performative Testimony**:  
    Her bargain ("*If you let him live, I will believe*") isn’t reporting a miracle—it *creates* one. The vow is a speech-act (Austin’s "performative utterance") that alters reality through commitment. Hume’s evidence-based frame cannot process this. For Sarah, God’s existence becomes credible through her promise, not prior proof. Belief arises from the vow’s *binding force*, not empirical validation.  

  - **Bendrix’s Resistance as Inverse Assent**:  
    His "assent" to God is anti-Humean: not reasoned conclusion but *suffered invasion*. "I hate You, God… You’ve taken her, but You haven’t got me yet" confesses God’s presence through rage. Greene posits that divine encounter compels belief *despite* evidence, even through hostility. Hume’s "proportioning belief to evidence" assumes detached evaluation; Bendrix is *undone* by relational trauma—Sarah’s death, the miracles’ haunting weight. Desire and hatred become epistemic vectors.  

  ### The Definitional Gap: Is a Birthmark a "Miracle"?  
  Hume demands miracles violate natural laws (e.g., resurrection). Greene’s cures—birthmark fading, acne clearing—are *ambiguous*: medically improbable but not impossible. This isn’t evasion but strategy:  
  - **Ambiguity as Theological Lever**:  
    Greene’s "miracles" thrive in Hume’s blind spot. A birthmark’s fade could be coincidence, yet it *functions* as a sign for those open to transcendence (Parkis) or wounds the closed (Smythe). For Hume, such events fall below the threshold of "violation," but Greene shows how they trigger belief when framed by *narrative* (Sarah’s diary) and *crisis* (war, grief). The novel argues that "miracle" is as much *interpretive act* as event—an epistemology of discernment rooted in desire.  

  ### Conclusion: Philosophy of Testimony or Something Else?  
  Greene isn’t *doing* philosophy of testimony in Hume’s analytic sense. Where Hume dissects testimony’s reliability, Greene explores its *transformative power* when embedded in human relationships—vows, hatred, love. The novel exposes testimony’s limits (Hume’s domain) while charting a parallel path where belief emerges *despite* testimony’s flaws, via:  
  - **Embodied Witness**: Sarah’s diary isn’t just text; it’s a relic of her presence, pressing on Bendrix through intimate weight.  
  - **Existential Bargaining**: Belief as transaction ("If you save him, I’ll believe") bypasses evidence.  
  - **Resistant Epiphany**: Bendrix’s hate-filled acknowledgment of God defies Hume’s rational agent.  

  Hume’s essay, by its terms, cannot reach this terrain. It treats belief as intellectual assent; Greene renders it as somatic and relational—*testimony as something done to you*. The novel doesn’t refute Hume; it dramatizes how faith colonizes the space where evidence fails. Greene’s genius lies in making Hume’s objections the very engine of his theology: the "interested parties," the ambiguous cures, the secondhand reports become the ragged fabric through which grace leaks, compelling belief not *after* weighing evidence, but *in the wreckage* of evidence’s insufficiency.
