prompt: |-
  I work for a mid-sized union local — about 1,400 members across four warehouses and a call centre for a regional grocery distributor — and my job is basically to be the research person who helps shop stewards think about automation. Our master agreement has a technology clause: the company has to consult us 45 days before any new machine or system goes live, which in practice means we get a binder, a slideshow, and a meeting where everyone panics and asks me the same question in different words — do we fight this, trade it away, or try to shape it? I've been answering case by case and Im tired of it. I want a procedure a steward can actually run.

  The theory I want it built on, and tell me if I'm mangling it before you build anything on it: Marx's point isn't that machines are bad, it's that the same machinery does different things depending on who owns it and what the point of running it is. Machinery as such replaces labour and could shorten the working day; machinery as capital gets brought in to capture the gain, and in that setup it tends to throw people out or push them into worse jobs, take the know-how off the shop floor and put it inside the system, intensify whatever work is left, and weaken the people who remain because there's a queue at the gate. The distinction I find most useful is between capital taking over a labour process it finds already there — the boss owns the shop but the work is still done our way — and capital remaking the labour process in its own image, which is usually what machinery is. Also the older point that the same technical advance that immiserates under one set of arrangments would shorten hours under another, so the procedure has to be able to say that the machine is fine and the deal is the problem, rather than just yes or no on the technology.

  So: give me a procedure, not advice on one case. The order of questions, what counts as a sufficient answer to each, where it stops dead with a no, where it hands off to the members because it's a values question rather than a fact question, and which steps are just judgment wearing a lab coat. It has to fit on one page, use no theory words in the output (stewards will stop reading), take an afternoon at most, and land on one of five recommendations: endorse, endorse with conditions, bargain it hard, oppose, oppose and escalate. Then run it on the three proposals actually sitting on my desk. (1) Robotic palletisers in the dry goods warehouse; the company says 22 jobs go and the rest get easier. (2) An AI dispatch scheduler that would take route decisions away from the four dispatchers who currently make them by feel. (3) Powered exoskeletons for the freezer crew that would cut the injury rate a lot, but the company wants to tie them to a 6% headcount reduction and a higher picks-per-hour target. My gut says fight all three. I suspect the procedure won't agree with me on at least one, and I want to know which one and why. And tell me straight what this procedure can't do — where it will give a confident answer that's wrong.
reasoning: |-
  Hmm, the user works for a union local representing workers in warehouses and a call center, and their job is to help stewards evaluate automation proposals. They're frustrated with ad-hoc case-by-case analysis and want a standardized procedure based on Marxist theory about technology under capitalism. 

  The core insight they want to capture is that machinery itself isn't inherently bad—it's about who controls it and for what purpose. Under capitalist ownership, automation often displaces workers, deskills jobs, intensifies labor, and weakens worker bargaining power. But the same technology could liberate workers under different social arrangements. 

  They need a practical one-page tool that leads to one of five clear recommendations: endorse, endorse with conditions, bargain hard, oppose, or oppose and escalate. It must avoid theory jargon, take no more than an afternoon, and include clear stopping points where decisions require member input rather than technical analysis. 

  Three real cases need evaluation:
  1. Robotic palletizers replacing 22 jobs
  2. AI dispatch scheduler replacing human dispatchers' judgment
  3. Exoskeletons that reduce injuries but come with headcount cuts and productivity demands

  The user admits their gut says oppose all three but expects the tool might disagree—they specifically want to see where their instinct conflicts with systematic analysis. They also want transparency about the procedure's limitations. 

  Key challenges in designing this:
  - Operationalizing Marxist concepts without using terms like "deskilling" or "labor process"
  - Creating binary checkpoints that force concrete decisions
  - Distinguishing between technical analysis and value judgments
  - Preventing analysis paralysis while capturing complexity
  - Balancing worker protection with pragmatic engagement

  The procedure should probably examine:
  1. Immediate job loss numbers
  2. Changes to workload intensity
  3. Skill/knowledge transfer
  4. Bargaining power impacts
  5. Alternative uses of the technology
  6. Management's framing of "inevitability"

  For the palletizers—while jobs are lost, the remaining work may genuinely improve. The key issue is whether job reduction is necessary or just profit-driven. The AI scheduler clearly captures worker knowledge and decision-making power—a red flag. The exoskeletons present a dilemma: real safety benefits versus productivity demands that may undermine those gains. 

  The tool's weakness will likely be in cases where management disguises exploitation as mutual benefit, or where short-term gains mask long-term power shifts. It also can't predict how technology might evolve after implementation. 

  Notably, the user's opposition to all three proposals might overlook opportunities to negotiate around the palletizers (e.g., attrition-based reduction) or exoskeletons (decoupling safety gear from productivity quotas). The AI scheduler seems fundamentally antagonistic to worker autonomy.
answer: |-
  Here's a streamlined procedure designed for your stewards, followed by analysis of your three cases and the tool's limitations:

  **Union Tech Assessment Procedure (1-Page Cheat Sheet)**

  **Step 1: Job Loss & Placement (Quantitative Harm)**
  *   **Question:** *"How many CURRENT jobs vanish? What happens to those workers?"*
  *   **Sufficient Answer:** Specific numbers + written plan (retraining, voluntary severance, natural attrition, guaranteed equal-pay placement). Vague promises = insufficient.
  *   **Stop Dead if:** Involuntary layoffs OR no credible placement plan. → **Recommendation: OPPOSE.**
  *   **Judgment Lab Coat:** Assessing credibility of placement plan.

  **Step 2: Work Intensification & Control (Qualitative Harm)**
  *   **Question:** *"Does this SPEED UP remaining work or put workers UNDER the machine's control?"*
  *   **Look For:** New monitoring/metrics, reduced breaks/autonomy, tighter schedules, physical/mental strain increase, skill loss (dumbing down).
  *   **Sufficient Answer:** Concrete details on pace, monitoring, autonomy changes. "Easier" claims need proof.
  *   **Handoff to Members if:** Trade-off exists (e.g., less physical strain BUT constant monitoring). → *Members decide acceptable balance.*
  *   **Judgment Lab Coat:** Interpreting "easier" vs. "faster/controlled".

  **Step 3: Knowledge & Power Shift (Strategic Harm)**
  *   **Question:** *"Does this take KNOWLEDGE off the floor and put it in the machine/management? Does it make us easier to REPLACE?"*
  *   **Look For:** Replacing judgment/experience, centralizing decisions, reducing training time needed, automating core union skills.
  *   **Sufficient Answer:** Analysis of *where* decisions move & *whose* expertise is replaced.
  *   **Stop Dead if:** Directly erodes core bargaining power (e.g., scab training time drops to days). → **Recommendation: OPPOSE & ESCALATE.**
  *   **Judgment Lab Coat:** Gauging long-term power erosion vs. routine change.

  **Step 4: The "Good Machine, Bad Deal" Test (Leverage Check)**
  *   **Question:** *"Could this tech GENUINELY improve work/life WITHOUT job cuts/harm if the deal changed? Is management's 'need' for cuts/logic shaky?"*
  *   **Look For:** Tech primarily for safety/ergonomics, clear potential for shorter hours, company using fuzzy math on savings/ROI.
  *   **Sufficient Answer:** Identifying separable benefits from harmful demands.
  *   **Pathway:**
      *   If YES → Push to decouple benefits from harms. → **Recommendation: BARGAIN HARD** (Focus on saving jobs, preventing speed-up, sharing gains).
      *   If NO (Tech inherently replaces/job loss unavoidable) → Focus on maximizing severance/retraining. → **Recommendation: BARGAIN HARD** (Focus on exit terms/remaining conditions).
      *   If BENEFITS are clear & NO HARMS attached → **Recommendation: ENDORSE.**

  **Step 5: Conditions & Escalation**
  *   **ENDORSE:** Only if no job loss, no intensification, no power erosion.
  *   **ENDORSE WITH CONDITIONS:** Attach concrete, enforceable safeguards (e.g., "No speed-up metrics added for 2 years", "Training guaranteed").
  *   **BARGAIN HARD:** Default position when harms exist but aren automatic stop-signals. Define core demands.
  *   **OPPOSE:** Use for Steps 1 or 2 failures. Prepare arguments.
  *   **OPPOSE & ESCALATE:** Use for Step 3 failure or egregious Step 1/2. Mobilize members, public campaign, etc.

  ---

  **Analysis of Your Cases:**

  1.  **Robotic Palletizers (22 Jobs Lost):**
      *   **Step 1:** 22 jobs gone. **STOP DEAD?** Only if no credible placement plan. If plan exists → Proceed.
      *   **Step 2:** "Easier" claim? Needs verification. Does "easier" mean less lifting, or just faster conveyor speed? **Handoff potential.** Lab Coat: Skepticism needed.
      *   **Step 3:** Palletizing is manual, not strategic knowledge. Low power erosion risk.
      *   **Step 4:** Could palletizers *just* reduce strain without job cuts? Unlikely – core purpose is labor replacement. Company logic is clear.
      *   **Recommendation: BARGAIN HARD.** Focus: Maximize severance/retraining for 22, enforce "easier work" promises (no speed-up!), prevent indirect job loss. *Gut Check Difference:* Your "fight" instinct is channeled into hard bargaining on terms, not blanket opposition.

  2.  **AI Dispatch Scheduler:**
      *   **Step 1:** Company implies no direct job loss *now* (dispatchers kept on?). Clarify! If jobs safe *initially* → Proceed.
      *   **Step 2:** **MAJOR RED FLAG.** Takes "decisions by feel" (judgment/experience) away. Puts workers under machine control (must follow AI route). Intensification likely (chasing AI metrics). **Handoff?** Maybe, but power shift is severe.
      *   **Step 3:** **CORE FAILURE.** Captures vital shop-floor knowledge (routing expertise). Centralizes control. Makes dispatchers glorified data entry clerks, easily replaceable. Erodes union power significantly.
      *   **Recommendation: OPPOSE & ESCALATE.** This is a fundamental power grab disguised as efficiency. Fight hard. *Gut Check Match:* Your instinct is correct.

  3.  **Powered Exoskeletons (6% Cut + Higher Picks):**
      *   **Step 1:** 6% headcount reduction. **STOP DEAD?** Only if no credible plan. If plan exists → Proceed.
      *   **Step 2:** **MAJOR CONFLICT.** Injury reduction = GENUINE benefit. BUT higher picks-per-hour = **GUARANTEED INTENSIFICATION.** This is a direct trade-off. **HANDOFF TO MEMBERS.** Is the injury reduction worth working significantly faster under pressure?
      *   **Step 3:** Low knowledge capture risk. Exos augment, don't replace decision-making.
      *   **Step 4:** **CLASSIC "Good Machine, Bad Deal".** Exos could *genuinely* improve safety and reduce fatigue WITHOUT job cuts or speed-up. Company ties them to harmful demands. Their logic for cuts/speed-up via exos is shaky (safety != productivity).
      *   **Recommendation: BARGAIN HARD.** Core Demand: **DECOUPLE the tech from headcount & speed-up.** Endorse the exoskeletons purely as safety/ergonomic improvements. Fight the headcount cut and productivity increase as separate issues. If forced, prioritize blocking the speed-up metric. *Gut Check Difference:* Your "fight" instinct is right about opposing the *package*, but the procedure forces a focus on salvaging the safety benefit by attacking the harmful conditions.

  ---

  **What This Procedure CAN'T Do (Straight Talk):**

  1.  **Predict the Future (or Management's Next Move):** It assesses the *proposal*, not hidden agendas. Management might promise "no speed-up" (Step 2), then introduce it 6 months later citing "efficiency data." The procedure can demand strong contract language (Endorse *With Conditions*), but it can't guarantee enforcement or foresee bad faith.
  2.  **Quantify the Unquantifiable (Power Erosion):** Step 3 is inherently judgmental. A steward might miss how automating *this specific* dispatcher task is the first step to automating the *whole role* in 18 months. It flags the *mechanism* (knowledge capture), not the *eventual scale*.
  3.  **Capture Cumulative Effects:** Opposing one bad scheduler (Case 2) is clear. But endorsing multiple "small" automations (Case 1 type) across warehouses might *cumulatively* weaken the union through death-by-a-thousand-cuts. The procedure looks at proposals in isolation.
  4.  **Override Member Values:** If members in Case 3 overwhelmingly value safety over preventing a 6% cut *even with speed-up*, the procedure (Step 2 Handoff) accepts that, even if strategically questionable. It prioritizes member agency on values.
  5.  **Beat Perfect Information Asymmetry:** If management lies or hides key data (e.g., true job loss numbers, secret speed-up goals), the procedure outputs garbage-in/garbage-out. It relies on the best available intel and steward skepticism.
  6.  **Solve Macro Problems:** It won't stop automation under capitalism. It's a damage-limitation/power-preservation tool within the existing framework. It helps *navigate* the contradiction, not resolve it.

  **Key Strength:** It forces stewards to move beyond "is tech good/bad?" to the concrete mechanisms of harm/benefit and separates the *technology's potential* from *management's proposed use*. It systematically identifies points of leverage (like decoupling in Case 3) and clear escalation triggers (like Case 2). Your gut was mostly right, but the procedure provides the *structure* and *arguments* to fight smarter on Cases 1 & 3, and confirms the need for a major stand on Case 2.
