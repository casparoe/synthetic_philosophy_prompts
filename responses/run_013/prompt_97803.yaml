  - **Lira**: The one who feels the leash. She should articulate the visceral unease—like "breathing glass." Her botanist role lets her symbolize fragile growth under constraint. 
  - **The Steward**: A passive power holder. His near-use of the Clause over a minor dispute (pipes vs. gardens) must feel terrifyingly casual. 

  Key structural notes: 
  - Open with mundanity to lull readers before introducing the Clause. 
  - The greenhouse scene is crucial. Lira’s defiance—prioritizing life over efficiency—creates the stakes. 
  - The Steward’s hesitation must show how arbitrary power corrodes trust. His *almost*-intervention proves the threat was real. 
  - End ambiguously: Kael shaken but unconvinced, Lira still trapped in the gilded cage. No resolution, just lived tension. 

  Word count target: 1,500. I’ll keep descriptions lean (rusted pipes, hum of machinery) to focus on dialogue and subtext. The last line—"waiting to be told it was only wind"—leaves the question hanging. 

