answer: |-
  Here’s a defended research agenda prioritizing conceptual clarity on graded moral status, emphasizing upstream questions tractable for philosophers:

  ### Priority 1: What is the *unit* of moral status? (Tokens, types, lineages)
  *   **Why upstream?** Until we resolve whether status attaches to individual organisms (tokens), species (types), or evolutionary lineages (e.g., hives, populations), *all* subsequent discussions about degrees are ambiguous. Does a bee colony have status beyond individual bees? Is "fish" a moral category? This question defines the relevant entity for ascribing any status.
  *   **Tractability:** Purely conceptual. Requires analyzing the metaphysics of persistence, identity, and moral patiency (e.g., Parfit, Korsgaard). Thought experiments (e.g., replacing bees in a hive one-by-one vs. preserving the lineage) are primary tools.
  *   **Impact:** Radically changes obligations. If status binds to lineages, harming a *population* (e.g., via pesticides) matters more than individual insect deaths. Thermostats likely lack lineages/tokens with intrinsic status, clarifying their exclusion.

  ### Priority 2: What confers the *basis* for gradation? Capacity for valence vs. self-integrative complexity
  *   **Why upstream?** Determines the relevant metric for "degree." Is it simply the *intensity* or *range* of potential suffering/pleasure (valence capacity)? Or does the *structural integration* of states into a unified subjective perspective (self-model) add distinct moral weight? Resolving this tells us *what property* scales.
  *   **Tractability:** Conceptual/theoretical. Philosophers can dissect notions of "selfhood," "unity of consciousness," and "phenomenal binding" (e.g., Metzinger, Bayne). Analyze if integrated suffering is *worse* than disorganized valence.
  *   **Impact:** Crucial for cross-species comparisons. If integration matters, a fish (likely complex self-model) has higher status than a bee (likely simpler integration) *even with similar pain intensity*. If valence alone suffices, their status may be closer. Thermostats fail both criteria decisively.

  ### Priority 3: Is scalar status even coherent? Alternatives & thresholds
  *   **Why upstream?** Before measuring degrees, we must challenge the scalar premise. Does status fundamentally admit of degrees, or are there thresholds (e.g., sentience = binary switch) with only derivative scalar *implications* (e.g., for welfare interests)? Are there multiple binary statuses (e.g., rights-bearers vs. welfare-subjects)?
  *   **Tractability:** Philosophical logic/metaphysics. Examine coherence of "partial moral considerability" vs. tiered binary theories. Assess if "degrees" collapse into multiple binaries or interest-strength.
  *   **Impact:** If scalar status is incoherent, the project refocuses on identifying thresholds (e.g., minimal sentience) or distinct moral categories. Bees and fish might share a "sentient" threshold but differ in welfare weight; thermostats clearly fail the threshold.

  ### Deprioritized Question: How to empirically operationalize the "self-model" across taxa.
  *   **Why?** While vital *eventually*, it's currently less tractable for pure philosophers and relies heavily on unresolved neuroscience/ethology (e.g., neural correlates of integration in insects). Prioritizing it now puts the cart before the horse – we lack consensus on *what concept* needs operationalizing (Priority 2). Philosophers can define the target, but scientists must hunt for it.
  *   **Move it up:** Major breakthroughs in detecting subjective integration (e.g., a validated "integration signature" in EEG, or compelling AI models exhibiting selfhood) would make conceptual linkage urgent. Evidence suggesting insects lack *any* integration despite valence would also elevate it.

  ### Defense of Ranking:
  1.  **Unit (P1)** is foundational: You can't assign *any* status (scalar or not) without knowing *what* you're assigning it to. It frames the entire inquiry.
  2.  **Basis (P2)** defines the scaling *property*. Without knowing *what* is graded (valence or integration), debates about degrees are meaningless.
  3.  **Scalar Coherence (P3)** questions the core assumption. If scalar status is incoherent, P1 and P2 shift focus dramatically.
  4.  This sequence ensures each step provides the necessary conceptual framework for the next, maximizing philosophical leverage before empirical complexities dominate. Settling P1-P3 tells us *what to look for* in bees (token valence?), fish (lineage integration?), and why thermostats (no token, no valence/integration) remain outside the moral circle.
