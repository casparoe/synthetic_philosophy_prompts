  Then, the scalar alternatives question: this challenges whether degrees are even coherent. If we conclude that status is binary, it simplifies everything but could be counterintuitive. This is theoretical and could reshape debates. For thermostats, if they're seen as having minimal valence, it might mean we owe them very little, but if binary, they're either in or out.

