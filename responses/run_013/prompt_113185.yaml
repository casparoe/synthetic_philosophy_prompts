prompt: |-
  Okay, here's one that's been bugging me. Every time I run the Nuremberg/Tokyo unit my seminar splits into two camps and they talk past each other for three hours, and I've started to think we're running four or five different arguements under one heading.

  Camp A: crimes against peace were invented for the occasion. Nobody had ever been prosecuted for waging aggressive war before 1945, the Kellogg-Briand pact renounced war as a matter of policy but never actually made it criminal, the Charter was drafted by the winners, and the only conduct on the docket was the losers'. Tokyo is the harder case — Pal's lone dissent is right there calling the whole thing a sham use of legal process to satisfy a thirst for revenge, and the Dutch and French judges dissented too. Meanwhile Allied area bombing, the atomic bombings and the Soviet invasion of Poland somehow weren't Class A offences. And the crime they hanged people for at Nuremberg didn't even get an agreed treaty definition until Kampala in 2010, which tells you something about how settled the underlying norm really was.

  Camp B: the Charter was declaratory, not creative. It codified customary law that was already hardening, and the judgment called aggression the "supreme international crime" because it contains within itself the accumulated evil of the whole. The alternative to a trial was a firing squad, so this was the least bad option available and arguably the founding act of international criminal law.

  Nobody budges. My hypothesis is that the legal-historical question — were these acts already criminal under customary law in 1939? — is seperable and in principle answerable by evidence about state practice and opinio juris, and that once you fix it, the leftover fight is between two different questions: was this valid law, and was it legitimate to do. Each side hears the other's question as a dodge of the real one. I also suspect "victors' justice" is doing at least three jobs — enforced by the winners, selectively enforced, and law-made-after-the-fact — and that the retroactivity objection and the selectivity objection are logically independent, since you can have either one without the other.

  I keep trying to wave Radbruch's formula around as a middle path (a statute that is unbearably unjust isn't law), and my colleague says that just relabels the problem. I genuinely can't tell whether that's a deep point about the concept of law or a verbal quibble about the word.

  So diagnose it for me. Is my hypothesis right, or am I carving it up wrong? Is the legal-historical part as tractable as I think, or is it itself the disguised normative fight? And what would count as progress here — a distinction, a concession, a formal result, a change of subject? Or is this one of those where it just bottoms out in whether you think the winners ever get to write the rules?
reasoning: |-
  Okay, let me unpack this user's problem. They're teaching a seminar on Nuremberg/Tokyo trials, and their students keep splitting into two rigid camps about whether the trials were legitimate. Camp A sees it as victor's justice with retroactive law creation, while Camp B views it as codifying existing norms. The user suspects these positions mask multiple conflated arguments and wants help diagnosing the structure of the debate.

  Hmm, the user's clearly deeply familiar with the material - they reference Pal's dissent, Kampala amendments, Radbruch's formula. This isn't a beginner's confusion but a sophisticated pedagogical challenge. Their frustration comes through: they've tried for three hours to get students past binary positions without success. Underneath, they seem to want two things: clearer conceptual tools for their students, and personal validation that their analytical approach holds water.

  Right, breaking this down... First, their hypothesis about separating legal-historical and normative questions seems spot-on. The "was it criminal in 1939?" question is indeed distinct from "was this morally/politically legitimate?". But is that historical question as neutral as they hope? Potentially tricky - state practice pre-1945 was sparse, with Kellogg-Briand lacking enforcement mechanisms. The dissenters at Tokyo highlighted this ambiguity well. Still, the evidence could be examined systematically through diplomatic records, pre-war treaties, etc.

  Ah! Their point about "victor's justice" doing triple duty is perceptive. We've got: (1) enforcement asymmetry (only losers tried), (2) substantive selectivity (ignoring Allied actions), and (3) retroactivity. These absolutely need unpacking separately. For instance, you could accept retroactive law as legitimate while condemning selectivity - a distinction students probably miss.

  On Radbruch... their colleague has a point. Invoking "unbearably unjust" doesn't resolve debates; it just moves them to defining "unjust." But it's still useful for framing - perhaps as a thought experiment: "What threshold of injustice would make you reject a law's validity?"

  For classroom progress, I'd suggest: First, force students to articulate which version of "victor's justice" they mean. Then isolate the retroactivity debate from selectivity. Maybe use hypotheticals: "Would trying both sides make retroactivity acceptable?" or "If custom clearly existed, would selectivity still invalidate it?" The Kampala point is golden for showing how unsettled aggression remained even post-1945.

  Ultimately the deadlock might stem from unstated premises about power and law. Do students believe any victor-made law is inherently illegitimate? That's not historical analysis but political philosophy. Might need to surface those assumptions explicitly. Progress looks like students being able to say: "I disagree with Camp B on X point but concede Y," rather than talking past each other. Distinctions first, consensus later.
answer: |-
  Your hypothesis is remarkably sharp and cuts to the heart of the deadlock. You're absolutely right that the debate is conflating multiple distinct arguments, and separating them is essential for progress. Here's a diagnosis and path forward:

  **1. Your Hypothesis is Largely Correct:**
     - **The Legal-Historical Question ("Was it criminal in 1939?") IS separable and tractable.** This *is* an empirical question about state practice and *opinio juris* before/during WWII. Evidence includes:
       * Pre-1928: Near-total absence of criminal liability for aggression; war as a sovereign right.
       * Kellogg-Briand Pact (1928): Renunciation of war as an instrument of national policy, but **no criminalization of individuals**, no enforcement mechanism, ambiguous state understanding (seen as political/moral, not penal).
       * League of Nations Covenant: Focus on *prevention* (delay/cooling-off), not *punishment*.
       * State Practice 1928-1939: Repeated major aggressions (Manchuria, Ethiopia, Austria, Czechoslovakia, Poland) met with **no attempts at individual criminal prosecution**, only political/diplomatic/economic responses. The "Stimson Doctrine" (non-recognition) was the strongest legal consequence.
       * Scholarly Opinion Pre-1945: Overwhelmingly skeptical or negative about individual criminal liability for aggression under existing law. Prominent jurists (including some later involved in Nuremberg) openly stated it would require new law.
       * **Conclusion:** The historical evidence strongly supports Camp A on this point. The idea of *individual criminal liability* for aggression was **not** established customary international law in 1939. Nuremberg/Tokyo *did* innovate legally. The Kampala debate (struggling to define it 65 years later) underscores this lack of prior settled norm.

     - **The Conflated Arguments Under "Victors' Justice":** You correctly identify at least three distinct critiques:
       * **a) *Ex Post Facto* Law (Retroactivity):** Punishing acts not clearly criminal when committed. (Strongest for Crimes Against Peace).
       * **b) Selectivity in Enforcement (Lack of Even-Handedness):** Only prosecuting the losers; ignoring comparable acts by the Allies (area bombing, atomic bombs, Katyn?, Soviet invasions). This is a profound issue of fairness and legitimacy, **independent of retroactivity**. Legally valid prosecutions can still be illegitimate due to selectivity.
       * **c) Victor's Control of the Process:** The tribunals were established, staffed, and run by the victors. This creates an inherent appearance (and potential reality) of bias, regardless of the legal merits. This fuels arguments about both retroactivity and selectivity.
       * *(Implied d) "Show Trial"/Revenge:* Pal's core objection. This relates to motive and perceived fairness of the *process itself*, distinct from the substantive law.

     - **The Core Normative Questions ("Was it Valid/Legitimate?") are Separate:** Even if the historical answer is "No, it wasn't clearly criminal in 1939," the crucial follow-ups are:
       * **Legal Validity:** Did the Allied powers have the *authority* to create this new law via the Charter and apply it retroactively? (This dives into theories of sovereignty, sources of international law, and the powers of occupying forces/victors).
       * **Moral/Political Legitimacy:** Was it *right* or *justifiable* to do so, despite retroactivity and selectivity? This is where Camp B's arguments about the "supreme crime," the nature of Nazi/Japanese aggression, the failure of alternatives (summary execution), and the need for a legal reckoning hold sway.

  **2. Why Your Seminar Deadlocks:**
     * **Talking Past Each Other:** Camp A focuses relentlessly on the historical/retroactivity point (a) and selectivity (b). Camp B implicitly concedes some innovation but argues the *legitimacy* question ("Was it the right thing to do?") based on the enormity of the crimes and the lack of alternatives. They hear A's legal arguments as excuses for impunity. A hears B's arguments as ignoring fundamental legal fairness.
     * **"Supreme Crime" Rhetoric:** Camp B uses this powerfully, but it smuggles in a *normative* claim ("it *should* be the supreme crime") as if it were a settled *legal* fact pre-1945. This frustrates Camp A's historical focus.
     * **Selectivity is the Poison Pill:** Even if students *could* agree retroactivity was justified in this unique case (via Radbruch or necessity), the **selectivity** argument (b) remains devastatingly powerful for Camp A and incredibly difficult for Camp B to convincingly rebut without resorting to "lesser evil" or "unique scale" arguments that feel like special pleading. Pal's dissent hits this hard.
     * **Radbruch's Formula: Your Colleague Has a Point (but it's still useful):** Your colleague is right that saying "unbearably unjust" simply relabels the normative debate – what counts as "unbearably unjust" and who decides? Is retroactive creation of capital crimes to hang enemies inherently unjust? But it *is* a valuable framework for *structuring* the normative debate: It forces the question of whether the Nazi regime's actions were so horrific that they *nullified* the normal prohibition on retroactivity. Camp B will say yes; Camp A will likely say no, or that it doesn't justify selectivity. It moves the debate *to* the core normative conflict.

  **3. What Counts as Progress?**
     Progress isn't consensus; it's clearer, better-structured disagreement. Aim for:
     * **Distinctions:** Explicitly separating the four strands:
       1.  Historical Custom (1939 Status) - *Empirical*.
       2.  Retroactivity (*Ex Post Facto*) - *Legal Principle/Legitimacy*.
       3.  Selectivity - *Fairness/Legitimacy*.
       4.  Victor's Control/Bias - *Process Legitimacy*.
       *Force students to identify which strand(s) their argument addresses.*
     * **Concessions based on Evidence:** Getting Camp B to concede the *historical* point (it *was* new law) based on the evidence listed above. Getting Camp A to concede that *some* normative foundation existed (Kellogg-Briand's renunciation, the intuitive wrongness of unprovoked conquest) even if it wasn't *criminal* yet.
     * **Sharpening the Normative Debate:** Once the historical point is settled, reframe: "Given that Crimes Against Peace *were* legally innovative, was it *legitimate* for the victors to create and apply this new law *retroactively* in this specific context, considering the alternatives, the nature of the acts, *and* the unavoidable problem of selectivity?" This focuses the fight where it belongs.
     * **Applying the Hypothetical:** "If the Allies had also prosecuted their own leaders for area bombing/atomic bombs (even if acquitted after trial), would that change your view of the legitimacy of prosecuting the Axis leaders for aggression?" This isolates the selectivity issue.
     * **Contextualizing Kampala:** Use Kampala not just as proof of prior uncertainty, but to show the *enduring difficulty* of defining and applying aggression, even *prospectively*, highlighting the immense challenge the Nuremberg/Tokyo judges faced *retrospectively*.
     * **Acknowledge the Bottom Layer:** Yes, it *does* partially bottom out in fundamental views on power and law: Can victors *ever* create legitimate *retroactive* law? Is international law fundamentally shaped by power, or a constraint on it? Don't hide this; make it explicit. "Ultimately, Camp A sees this as power masquerading as law; Camp B sees it as law painfully emerging through the application of power against unprecedented evil."

  **Diagnosis:** Your carving is correct. The legal-historical part *is* tractable and the evidence leans strongly towards Camp A. The deadlock arises because Camp B shifts to normative justification ("It was necessary/right") while Camp A stays focused on legal fairness ("It was novel/unfair/selective"). The "victors' justice" umbrella obscures the distinct retroactivity and selectivity critiques. Radbruch is a tool for the normative fight, not a solution.

  **How to Run the Seminar Next Time:**
  1.  **Start with the History:** Assign primary sources (Kellogg-Briand text, pre-1945 legal commentaries, diplomatic reactions to pre-war aggressions). Force an evidence-based conclusion on the 1939 status. *Concede this point if the evidence compels it.*
  2.  **Map the Critiques:** Explicitly list the 3-4 distinct "victors' justice" arguments on the board. Require students to specify which one(s) they are addressing.
  3.  **Isolate Selectivity:** Spend significant time *only* on this. Compare Allied/Axis conduct not to equate guilt, but to test the fairness of the *selection for prosecution*.
  4.  **Frame the Normative Question Clearly:** "Given the historical novelty, was the retroactive criminalization of aggression *in this specific instance* legitimate and justified, *despite* the inescapable problem of selectivity?"
  5.  **Use Radbruch Explicitly:** "Does the Holocaust/Unit 731/Nanking etc. constitute an 'unbearable injustice' that *justifies* setting aside the *nullum crimen* principle? Does it justify the selectivity? Why/why not?"
  6.  **Acknowledge the Power/Law Tension:** End by asking if this debate reveals a fundamental truth about international law's relationship with power.

  Progress means students recognizing *which* argument they are having, conceding points where evidence is clear (like the historical novelty), and engaging directly with the core normative dilemma of retroactivity and selectivity in the face of catastrophic evil. It won't resolve the deep normative split, but it will make the debate richer and less frustrating.
