prompt: |-
  I have no background in philosophy, but I've been keeping a notebook of a pattern that keeps catching my eye, and I'd like to know whether it has a name. It shows up whenever I compare two accounts of the same thing that are both wrong. My car broke down last year and two mechanics gave me two theories: one named three specific parts and described how the failure happened, and the eventual repair showed he had gotten two of the three right and the third badly wrong; the other said only that something was off in the electrics, which was true and told me nothing. I get the same feeling comparing weather forecasts for a trip -- the one that commits to specific rain on specific days and misses two of them seems more like a real forecast than the one that says the week will be changeable -- and listening to a doctor friend lay out rival explanations for a symptom. In each case I catch myself saying that one of the two wrong accounts is closer to the truth than the other, and it is invariably the one that stuck its neck out and therefore also got the most wrong. I've noticed the opposite instinct too: in an argument, the person who commits to least is the hardest to catch out, and that feels like an advantage of a completely different kind.

  When I try to write the rule down, it comes apart. If closer to the truth just means more true parts and fewer false parts, then I ought to be able to move any account closer by bolting on an extra true but irrelevant remark, which is absurd; and worse, when I run that rule over two accounts that are both wrong, it seems to say that they can never be ranked against each other at all, since each one has true things the other lacks and errors of its own. Yet I'm confident I'm not confused about nothing. I really do think some wrong accounts are better than others, and not merely more useful or more likely to be right -- the vague account is the one I'd bet money on, and it's the one I'd throw out.

  So I'd like you to act as a philosopher of science who works on how competing theories get compared and tell me whether this has an established name and an established treatment. Please think it through carefully before you answer, and begin by brainstorming the handful of concepts that come closest, then say for each how well it fits and where it falls short of what I've described. What I want is the carving, not the label: what exactly the relation is between the two wrong accounts, whether it turns on how much they say or on how much they resemble the truth, how it differs from their being roughly true or probably true or simply useful, and where the edges are -- two accounts pitched at different levels of detail, or about slightly different subjects, or one much longer than the other. If the natural way of defining it is known to break, say so plainly and tell me what has been put in its place. I don't need a reading list or citations; I can't check them anyway, and the idea is what I'm after.
reasoning: |-
  Okay, the user has noticed a pattern where when comparing two incorrect explanations, they find the one that's more specific but partially right to be "closer to the truth" than the vague one, even if the vague one has fewer errors. They want to know if this has a name in philosophy of science and how it works.

  First, I need to recall relevant concepts. Verisimilitude comes to mind—Popper's idea of truthlikeness. It's about how close a false theory is to the truth. But Popper's original definition had issues with mixed true and false content. Later refinements like Tichý and Oddie's approaches might fit better. They use similarity metrics, which could explain why a detailed but partially correct theory feels closer.

  Then there's specificity. The user's examples show that the more specific theory, even with errors, provides more useful content. This ties into precision versus accuracy. A precise but inaccurate statement can be more informative than a vague one. Bayesian epistemology might be relevant here, where specificity affects prior probabilities and updating beliefs.

  Another angle is epistemic utility. Theories are evaluated not just by truth but by their informativeness. The detailed theory, despite errors, has higher cognitive value because it offers testable predictions. The vague one, while safer, is epistemically less valuable.

  The user also mentioned the opposite: committing to less makes one harder to refute. That's the concept of falsifiability. Vague statements are unfalsifiable, making them weak arguments. This contrasts with the detailed theory that sticks its neck out, which is more falsifiable and thus scientifically stronger when partially correct.

  I should check if these concepts address the user's points. The car mechanic example: the specific diagnosis had two right parts, so it's partially true. The vague one was true but uninformative. Verisimilitude frameworks would rank the specific one higher due to more true content. Specificity explains why the detailed forecast feels like a "real" forecast—it's more precise. The doctor's rival explanations: the one with more details, even if some are wrong, is closer to truth because it structures the problem better.

  Where these might fall short: The user noted that adding irrelevant truths shouldn't make a theory better. Popper's initial verisimilitude had this problem, but later approaches avoid it by considering relevant similarity or content. Also, comparing theories of different scopes—like one about car electrics vs. specific parts—requires assessing their domains. If they address different aspects, direct comparison might need adjustment.

  Epistemic utility captures the trade-off between truth and informativeness. The detailed theory's errors are informative because they highlight where adjustments are needed, whereas the vague theory offers no guidance. Falsifiability explains why the uncommitted argument is harder to refute but less valuable for knowledge growth.

  The user wants the carving, not just labels. So explaining how these concepts interrelate is key. Verisimilitude provides the framework for truth proximity, specificity and falsifiability address the risk-taking aspect, and epistemic utility ties it to practical evaluation. Together, they show why a detailed, partially correct account is better than a vague, unrefutable one, beyond mere usefulness.
answer: |-
  What you've described is a profound and well-studied pattern in the philosophy of science and epistemology. It cuts to the heart of how we evaluate imperfect knowledge claims. Your intuition is correct: there *is* a meaningful way to rank incorrect accounts, and it hinges on **informativeness, risk-taking, and structural resemblance to the truth**, not just tallying true/false propositions. Below is the conceptual carving you requested, exploring the key ideas and their fit:

  ### Core Concepts & How They Fit (and Where They Fall Short)

  1.  **Verisimilitude (Truthlikeness):**
      *   **What it is:** The core idea that one false theory can be *closer to the truth* than another false theory. This directly names your core intuition ("one of the two wrong accounts is closer to the truth").
      *   **How it fits your pattern:** Your mechanic example with 2/3 correct parts is a textbook illustration. This theory has high verisimilitude compared to the vague "something electrical" theory, despite both being strictly false. It captures *more* of the relevant truth and its *structure* (specific parts interacting) resembles the actual causal structure better than the vacuous alternative.
      *   **Where it falls short (initially):** The naive "tallying true parts" approach you tried (and rightly rejected) mirrors the *original problem* with defining verisimilitude. Popper's first attempt faced devastating criticism (e.g., by Tichý and Miller) showing that adding irrelevant truths or mixing truths and falsehoods in complex ways could break simple tallying, leading to contradictions.
      *   **The Refinement:** Modern approaches (e.g., Tichý, Oddie, Niiniluoto) define verisimilitude using *similarity metrics* or *likeness to the true state of affairs*. They look at:
          *   **Content:** How much *relevant* true information does the account contain? (Your mechanic got two specific parts right).
          *   **Accuracy:** How *precise* is its true content? ("Part X and Y failed" is more precise than "something electrical").
          *   **Structure:** How well does its *model* or *explanation* mirror the actual causal/nomological structure? (The specific failure sequence resembles reality more than a vague category).
          *   **Avoidance of Error:** Minimizing *relevant* falsehoods (The mechanic's one wrong part is a specific error; the vague theory avoids specific errors by saying nothing specific, but also conveys no structure).
      *   **Verdict:** This is the core concept naming the "closer to truth" relation. Modern refined verisimilitude captures your intuition well: the specific, partly-correct account has higher verisimilitude than the vague, minimally-true account, *because* it provides more relevant, precise true content and a better structural approximation, even if it also contains specific falsities. Adding irrelevant truths doesn't increase verisimilitude under refined definitions.

  2.  **Specificity / Informativeness (and its cousin, Precision):**
      *   **What it is:** The degree of detail, exactness, and content in a claim or theory. A highly specific claim rules out many more possible states of the world than a vague one.
      *   **How it fits your pattern:** This is the "sticking its neck out" aspect. The specific mechanic diagnosis, the day-by-day rain forecast, the detailed medical explanation – these are all highly *specific*. They make bold, precise predictions. The vague alternatives are *unspecific* or *imprecise*; they rule out very little ("something electrical," "changeable," "could be various things").
      *   **Relation to Verisimilitude:** Specificity is a crucial *component* of verisimilitude. A highly specific account *that is also largely correct* will have very high verisimilitude. However, a highly specific account that is *mostly wrong* will have *very low* verisimilitude (worse than a vague truth!). Your pattern highlights the sweet spot: a *partially correct* specific account often has higher verisimilitude than a minimally true vague account. Verisimilitude rewards specificity *when it hits the mark* but penalizes it harshly when it misses.
      *   **Where it falls short alone:** Specificity isn't inherently good. A wildly specific wrong theory (e.g., "It's definitely the flux capacitor and only the flux capacitor!") has high specificity but very low verisimilitude. Your pattern relies on the specific account also having *some significant degree of correctness*.

  3.  **Falsifiability / Testability (Popper):**
      *   **What it is:** The extent to which a theory makes clear, specific predictions that could potentially be shown false by evidence. A good scientific theory is highly falsifiable.
      *   **How it fits your pattern:** This directly explains your *opposite* instinct. The vague account ("something electrical," "changeable") is *unfalsifiable* or very hard to falsify. It's compatible with almost any outcome, making it "hard to catch out." The specific account ("Parts A, B, C failed in sequence," "rain on Tues/Thurs") is highly falsifiable. It *can* be proven wrong (as it partially was), which is its strength, not just its weakness.
      *   **Relation to Verisimilitude:** High falsifiability is a *prerequisite* for achieving high verisimilitude. A vague, unfalsifiable theory *cannot* be shown to have high verisimilitude because it makes no precise claims to be correct about. The specific, falsifiable theory *risks* being wrong, but if it's *partially* right, it demonstrates higher verisimilitude. Falsifiability explains *why* sticking your neck out is necessary for being "close to the truth" in a meaningful way.
      *   **Where it falls short alone:** Falsifiability doesn't directly measure closeness to truth. A highly falsifiable but completely wrong theory (easily disproven) has low verisimilitude. Falsifiability is about the *potential* for being tested and shown wrong, not about the actual degree of truthlikeness.

  4.  **Epistemic Utility / Cognitive Value:**
      *   **What it is:** Evaluating theories not just on truth, but on their overall *value* for knowledge and action. This includes truth, but also informativeness, explanatory power, simplicity, fruitfulness for further research, and guidance for action.
      *   **How it fits your pattern:** Your intuition that the specific, partly-wrong account is "better" even if you wouldn't necessarily bet on it *immediately* (you'd bet on the safer, vaguer one for survival) captures this duality.
          *   **For Action (Betting/Money):** The vague, minimally-true account might be *safer* for immediate, low-stakes bets where avoiding specific error is paramount ("Play it safe, assume electrical issues might exist").
          *   **For Understanding/Truth-Seeking (Throwing Out):** The specific, partly-correct account has vastly higher *epistemic utility*. It provides a *framework* for understanding, points to specific areas needing correction (we know Part C was wrong!), guides further investigation, and, crucially, *feels* more like a genuine explanation. It structures the problem space.
      *   **Relation to Verisimilitude:** High verisimilitude is a *major contributor* to high epistemic utility for truth-seeking purposes. A vague truth has low epistemic utility for understanding, even if it has some utility for cautious action.
      *   **Where it falls short alone:** "Utility" can be context-dependent. Your pattern seems focused on an intrinsic "closer to truth" sense, which verisimilitude targets more directly.

  ### The Carving: Defining the Relation

  1.  **The Core Relation:** The relation you perceive between two wrong accounts (A - specific/partly wrong, B - vague/minimally true) is **A has higher verisimilitude (truthlikeness) than B**.
  2.  **Why A > B (Verisimilitude Perspective):**
      *   **Content & Precision:** A asserts *more relevant, specific truths* (e.g., two specific car parts) than B (one vague truth: "electrical"). Even if A also asserts a specific falsehood, the *quantity and precision* of its true content outweigh the minimal content of B.
      *   **Structural Resemblance:** A's explanation (specific parts interacting) *better mirrors the actual causal structure* of the phenomenon than B's non-structural, category-based explanation. It provides a *model* that's partially isomorphic to reality.
      *   **Informativeness:** A reduces uncertainty about the world *more* than B, even though some of that reduced uncertainty is directionally wrong. B leaves almost all possibilities open.
      *   **Falsifiability Manifested:** A's specific errors *demonstrate* its falsifiability and provide concrete information about *where* it went wrong, allowing correction. B's vagueness prevents such learning.
  3.  **Why it's NOT just "roughly true" or "probably true" or "useful":**
      *   **Roughly True:** Implies overall correctness with minor inaccuracies. Your Account A is *not* roughly true; it contains a significant, specific error. "Roughly true" might apply to Account A *after* correcting the wrong part, but not before.
      *   **Probably True:** This is about likelihood *before* the fact, based on evidence. Your evaluation happens *after* both are known to be false. You're comparing their *reveled truthlikeness* post-hoc. The vague account B might have *seemed* more probable *before* knowing the outcome because it was safer, but now we know it's minimally true, while A is significantly more verisimilar.
      *   **Useful:** While A is more *epistemically useful* for understanding and guiding correction, B might be more *pragmatically useful* for avoiding rash action. Your distinction ("I'd bet on B but throw it out") captures this difference. Verisimilitude captures the *truth-related* aspect of why A is "better" for understanding, distinct from immediate pragmatic safety.
  4.  **Handling Edges & Scope:**
      *   **Different Levels of Detail:** Verisimilitude comparisons are most meaningful when accounts are *trying to explain the same phenomenon at comparable levels*. Comparing a molecular biologist's detailed (but partly wrong) account of a disease mechanism to a clinician's vague (but true) symptom description is tricky. We need to ask: "How well does each capture the *truth relevant to its intended level of explanation*?" The molecular account might have high verisimilitude *for molecular mechanisms*, while the clinician's has low verisimilitude *as a mechanistic explanation* but is perfectly adequate *as a symptom report*.
      *   **Slightly Different Subjects:** If accounts focus on genuinely different aspects (e.g., one mechanic on engine, another on transmission for the *same* symptom), direct verisimilitude comparison breaks down. We need to assess each on its *own* subject domain and relevance to the overall problem.
      *   **One Much Longer:** Length alone doesn't determine verisimilitude. A long account full of irrelevant truths and specific errors might have *lower* verisimilitude than a short, focused account that gets a few key specifics right. Relevance is crucial (as handled in refined verisimilitude). The long account might be penalized for the *density* of its errors or irrelevancies.

  **Conclusion:** The established name for the core "closer to truth" relation is **Verisimilitude (Truthlikeness)**, particularly understood through its modern, refined definitions that avoid the pitfalls of simple true/false tallying and incorporate similarity, structure, and content. The "sticking its neck out" aspect is **Specificity/Informativeness**, which is a necessary component for high verisimilitude but not sufficient on its own. The "hard to catch out" aspect is **Low Falsifiability**. The tension between betting on the vague one (pragmatic safety) but valuing the specific one more (epistemic utility for truth-seeking) highlights the different roles these accounts play. Your pattern beautifully illustrates how science progresses: through bold, specific, falsifiable conjectures that, even when partly wrong, get us closer to the truth than safe vagueness ever could.
