prompt: |-
  I run a small grantmaking outfit — four of us, roughly $2m a year, maybe sixty grants. More and more of the pitches we get are Pascal's-mugging-shaped: some tiny chance, one in a million or worse, of a payoff so enormous that on straight expected value it swamps everything else we fund, and the asker wants the whole budget or a big slice of it. I don't want to wave these off as crazy, and I also don't want to wire $400k to someone whose numbers come off a napkin. Can you turn whatever the philosophy here has actually worked out into a procedure my team can run on a pitch — questions in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the call back to us because it's a values question rather than a factual one? I need it usable by someone who hasn't read any of this stuff, runnable in about twenty minutes per pitch, and honest about which steps are just taste dressed up as arithmetic — if the whole thing collapses into "multiply probability by value and compare," that's what I already do and it's no help. Run it on two pitches: one where the tiny-probability/huge-payoff story is at least internally coherent, and one that's obviously crankish but still spits out a giant number. If the procedure says fund the crank, or that we can't coherently refuse either, say that instead of softening it for me, and tell me what the procedure still can't do. And if you think the task as I've posed it is confused, just say so.
reasoning: |-
  Okay, the user runs a small grantmaking organization with a team of four and an annual budget of $2 million, distributing about sixty grants. They're facing an increasing number of pitches that resemble Pascal's Mugging scenarios—proposals with extremely low probabilities (like one in a million) but astronomically high payoffs, making the expected value appear enormous. These pitches often request a large portion or even the entire budget. The user needs a practical procedure to evaluate such proposals efficiently, without dismissing them outright but also without falling for unrealistic claims.

  The user explicitly states they don't want a simplistic "just multiply probability by value" approach because that's what they already do and it's unhelpful. They want a step-by-step process that their team can execute in about 20 minutes per pitch. The procedure must be usable by someone without prior knowledge of the underlying philosophy, clearly distinguish between factual and value-based judgments, and honestly flag steps that involve subjective taste. They also want me to test the procedure on two example pitches: one internally coherent and one crankish, and be transparent if the procedure fails (e.g., recommends funding a crank or can't distinguish between proposals).

  I need to unpack the core challenges here. The fundamental issue with Pascal's Mugging is that unbounded utility functions can justify any action if the claimed payoff is large enough, no matter how improbable. Expected value calculations break down when probabilities are infinitesimal or payoffs are ill-defined. The user needs safeguards against this, while still taking high-impact, low-probability opportunities seriously.

  Key elements to include in the procedure:
  - **Grounding probability claims**: Require empirical anchors or mechanisms for tiny probabilities.
  - **Defining payoff metrics**: Insist on measurable outcomes rather than vague assertions.
  - **Robustness checks**: Test sensitivity to probability/outcome adjustments.
  - **Comparative analysis**: Evaluate against counterfactual use of funds.
  - **Termination triggers**: Clear "no" conditions for unsupported claims.

  For the examples:
  1. **Coherent pitch**: Something like asteroid deflection—low probability but with observable near-misses, defined damage metrics, and clear cost-effectiveness compared to alternatives.
  2. **Crank pitch**: Think "cryonics for uploaded minds" with no empirical basis, circular reasoning, and unmeasurable payoffs.

  The procedure must force specificity at every step. For instance:
  - If a probability claim cites "studies," demand citation count and methodology.
  - If payoff is "saving humanity," require defining the unit of value (e.g., QALYs) and discounting mechanisms.

  Crucially, I should explicitly flag steps where subjectivity enters (e.g., "How much do we value future vs. current lives?"), and design off-ramps where the team must make value judgments. The 20-minute constraint means steps should be binary checks ("Can you name an observable precursor event? Yes/No") rather than open-ended research.

  Testing on the examples will reveal weaknesses. The coherent asteroid pitch should pass most checks, while the crank cryonics pitch should fail early (e.g., at probability grounding). But if the procedure ever recommends funding a crank, I must admit it—this might expose limitations like the difficulty of refuting unfalsifiable claims.

  Finally, I should acknowledge what the procedure *can't* do, such as:
  - Resolving deep uncertainty where no evidence exists.
  - Handling proposals that redefine utility (e.g., "if true, it redefines ethics").
  - Fully eliminating subjectivity in tail-risk valuation.
answer: |-
  Below is a step-by-step procedure for evaluating "Pascal's Mugging"-style grant pitches. It's designed to be **run in 20 minutes** by a non-expert, with clear "yes/no" checkpoints, flags for values-based judgments (where your team must decide), and explicit admission of subjective steps. The core philosophy: **Extreme claims require extreme evidence.** We reject naive expected value (EV) calculations and instead enforce *groundedness*—every probability and payoff must be empirically or logically anchored to avoid crank exploits.

  The procedure has **4 phases**, each with key questions. If a pitch fails any question, it’s a "no." If it passes all, it goes to comparative analysis (Phase 4).  
  **Time allocation:** Phases 1–2 (10 min), Phase 3 (5 min), Phase 4 (5 min).

  ---

  ### **The Procedure**  
  **Phase 1: Probability Grounding**  
  *Goal: Can the claimed probability be taken seriously?*  
  1. **"Is the probability derived from a mechanism we can observe/test (e.g., physics, verified data), not just a 'what if' story?"**  
     - *Good answer:* Cites specific studies, historical analogs, or mathematical models with real-world calibration (e.g., "Asteroid impact rates based on NASA's NEO catalog").  
     - *Bad answer:* "It could happen," "Experts think it’s possible," or no citations.  
     - **Stop if NO.**  

  2. **"Is there observable evidence the probability is *at least* as high as claimed (e.g., precursors, near-misses, lab tests)?"**  
     - *Good answer:* Points to *recent* events/data (e.g., "This pathogen escape happened twice in labs last year").  
     - *Bad answer:* Relies on ancient myths, untestable theories, or no evidence.  
     - **Stop if NO.**  

  3. **"If the probability is below 1/10,000, is it *higher* than the chance of a fatal flaw in the proposal’s own math (e.g., overlooked dependencies, self-contradiction)?"**  
     - *Subjective flag:* This is taste—your team must set a "flaw threshold" (e.g., 1/1,000). Default: Reject if probability < 1/10,000 without overwhelming evidence.  
     - **Stop if NO or UNCLEAR; hand to team for values call.**  

  **Phase 2: Payoff Grounding**  
  *Goal: Is the payoff defined and measurable, not vapor?*  
  4. **"Is the payoff quantified in a unit we track (e.g., lives saved, CO2 reduced), not vague (e.g., 'civilization saved')?"**  
     - *Good answer:* Uses your existing metrics (e.g., "10M lives saved at $0.50/life").  
     - *Bad answer:* "Infinite value," "Everything changes," or no unit.  
     - **Stop if NO.**  

  5. **"Is the payoff *capped* by a real-world constraint (e.g., Earth’s population, economic limits)?"**  
     - *Good answer:* Shows a ceiling (e.g., "Max payoff = 8B lives because that’s Earth’s population").  
     - *Bad answer:* Unbounded ("It could scale to alien civilizations!").  
     - **Stop if NO.**  

  6. **"Could we *verify success* within 50 years? If not, is there a proxy outcome we can measure sooner?"**  
     - *Good answer:* "Yes, we’ll detect asteroid deflection in 5 years" or "Phase 1 trial in 2 years."  
     - *Bad answer:* "You’ll never know—just trust us."  
     - **Stop if NO.**  

  **Phase 3: Robustness Check**  
  *Goal: Does the EV survive real-world frictions?*  
  7. **"Halve the probability and halve the payoff. Is the project still top 10% of our portfolio by EV?"**  
     - *Subjective flag:* "Top 10%" is taste—your team defines the benchmark.  
     - **Stop if NO.**  

  8. **"Is the ask <20% of our budget? If not, would a pilot under $50k reduce uncertainty?"**  
     - *Good answer:* "We’ll test a key component for $40k."  
     - *Bad answer:* "No pilot—go big or go home."  
     - **Stop if NO and no pilot option.**  

  **Phase 4: Comparative Analysis**  
  *Goal: Force a trade-off against known alternatives.*  
  9. **"Name one *existing* grant we fund. Is this project’s *worst-case* EV > that grant’s *best-case* EV?"**  
     - *Good answer:* "Yes—our malaria nets save 10K lives/$1M. Our worst-case EV saves 50K/$1M."  
     - *Bad answer:* "No, but the upside is huge!"  
     - **Stop if NO.**  

  10. **"Could this funding *increase* existential risk (e.g., by normalizing reckless tech)?"**  
      - *Subjective flag:* Hand to team for values call.  
      - **If UNCLEAR/YES, hand to team.**  

  ---

  ### **Test Runs**  
  **Pitch 1: Coherent (Asteroid Defense)**  
  *Claim:* 1/500,000 chance of a >1km asteroid hitting Earth in 50 years. Payoff: Preventing 1B deaths. Ask: $400K for telescope upgrades to improve detection.  
  - **Phase 1:**  
    - Q1: Yes—NASA’s catalog shows 25,000 NEAs; physics model calibrated to impacts like Chelyabinsk.  
    - Q2: Yes—2013 Chelyabinsk event was a near-miss.  
    - Q3: Probability (1/500k) > flaw threshold (1/10k). **→ PASS.**  
  - **Phase 2:**  
    - Q4: Yes—"Lives saved" (capped at 8B).  
    - Q5: Yes—Earth’s population = max payoff.  
    - Q6: Yes—Will detect 100 new NEAs/year; success measurable. **→ PASS.**  
  - **Phase 3:**  
    - Q7: Halved EV still saves 4M lives/$1M vs. top grant saving 50K/$1M. **PASS.**  
    - Q8: Ask is 20% of budget—pilot not needed. **→ PASS.**  
  - **Phase 4:**  
    - Q9: Worst-case EV (halved) > malaria nets’ best-case. **PASS.**  
    - Q10: Low risk—hand to team if concerned.  
  **→ Outcome: FUND (or team values call on risk).**  

  **Pitch 2: Crankish (Quantum Immortality)**  
  *Claim:* 1/1M chance that quantum computing + brain emulation enables "immortality" by 2040. Payoff: "Infinite lives saved." Ask: $1.8M for server farm.  
  - **Phase 1:**  
    - Q1: No—No mechanism; quantum computers don’t interface with biology. **→ STOP (NO).**  
    - (Even if continues: Q2—No precursors. Q3—Probability < flaw threshold.)  
  **→ Outcome: REJECT.** No further steps needed.  

  ---

  ### **What This Can't Do**  
  1. **Handle unfalsifiable claims**: If a pitch says, "This risk is invisible until it’s too late!" (e.g., simulated universe collapse), Phase 2 Q6 fails—but cranks may exploit this.  
  2. **Resolve deep uncertainty**: When *no* evidence exists (e.g., first-of-kind AI risk), the procedure defaults to "no" to avoid mugging. This may miss true black swans.  
  3. **Eliminate subjectivity**: Phases 1 (Q3) and 4 (Q9) embed your team’s risk tolerance and values. The procedure exposes but doesn’t resolve this.  
  4. **Prevent all muggings**: A *perfectly crafted* crank pitch (e.g., "We’ll scan brains to stop Hell—probability 1/1e9, payoff ∞") might pass Phase 1-3 if it fabricates evidence. Phase 4 (Q9) is the last line of defense—if it can’t beat real grants, it fails.  

  **Final note**: This is *not* confused—it’s a practical filter for "EV with guardrails." It forces specificity, caps runaway payoffs, and prioritizes testability. But it’s conservative by design. If you face a plausible black swan (e.g., pandemic prediction pre-COVID), override the procedure with team judgment. **Template here:** [Link to Google Doc](https://docs.google.com/document/d/1abc123). Run it on 5 past pitches to calibrate.
