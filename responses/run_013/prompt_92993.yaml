answer: |-
  As a Scanlonian contractualist, I don't deny that Vera suffers a greater individual burden than any single one of the five hundred—her loss of smell/taste for a year constitutes a distinct and more severe harm. The critical question isn't "which outcome minimizes total suffering?" but "could any individual reasonably reject a principle permitting the sacrifice of *their* interests in *this specific way*?" The five hundred, each facing only a month of pain, cannot reasonably reject a principle that directs the vent toward Vera because *no single one of them* suffers a burden comparable to hers. Conversely, Vera *can* reasonably reject a principle that sacrifices her solely to spare each of the five hundred a burden significantly lesser than her own—it unfairly imposes a devastating individual cost on her to provide only modest, diffuse benefits to others. This isn't aggregation; it's a comparison of the *strength of individual complaints* against the proposed principle. Directing the vent toward the five hundred violates the requirement to justify our actions to each person affected, as it fails to give adequate weight to Vera’s uniquely strong objection.  

  *(Confidence: 8/10. Least sure about the precise threshold where Vera’s “somewhat worse” harm becomes decisively weightier than the lesser harm each of the 500 faces—though I’m confident it does here.)*

