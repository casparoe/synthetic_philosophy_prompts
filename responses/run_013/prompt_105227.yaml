answer: |-
  ## Commencement Address: The Courage of Planting Trees

  Faculty colleagues, honored guests, families whose pride radiates through this hall, and most importantly, the remarkable Class of [Year] — congratulations!

  You stand at a threshold. Your minds are sharp, your hearts are full of purpose, fueled by years of rigorous study in global development. You carry maps of complex systems, tools of analysis, and a deep, driving conviction: you want to leave this world measurably better than you found it. You’ve earned that conviction. And today, your chosen motto – “We plant trees whose shade we will never sit in” – beautifully captures that spirit of selfless, future-oriented commitment. It’s a powerful image. We plant for the generations to come.

  As someone who has spent fifteen years trying to measure the shade, trying to map the intricate forest of outcomes from development work, I feel compelled to speak honestly about that beautiful, necessary, and profoundly complex act of planting.

  The motto holds an essential truth: **We will not see the final result.** That much is certain. But it also contains an assumption: that the result *will* be shade. That the tree grows tall, that the canopy spreads, that the future finds cool respite under its branches.

  My experience in the trenches of evaluation compels me to acknowledge that this certainty… is harder to come by than we wish. The causal chains we set in motion – whether launching a microfinance initiative, reforming a tax policy, or delivering emergency aid – ripple outwards in ways that are astonishingly complex, interwoven, and impossible to fully trace. Effects echo through generations and across continents, tangling with countless other forces. We intervene in dynamic, unpredictable systems. The “net effect” – the ultimate balance of good and ill, intended and unintended – often recedes into a fog of complexity. Philosophers call this "consequentialist cluelessness." It’s not a failure of data or methodology we’ll one day overcome; it’s a structural feature of how cause and effect propagate in our messy, interconnected world.

  So, I cannot stand here and promise you, with empirical certainty, that your specific actions over your careers will leave a net positive balance sheet for the world. I cannot guarantee that anyone, ever, will be able to definitively calculate that balance.

  **But.**

  This is not a counsel of despair. It is not an argument for inaction. Recognizing this profound uncertainty is not the endpoint; it is the starting point for a different kind of courage, a more mature understanding of why your work matters.

  **Your work matters precisely *because* you plant the trees anyway.**

  It matters because you choose to act with intention, with rigor, with the best evidence available *now*, and with deep ethical consideration for the potential consequences you *can* foresee. You plant knowing you control the seed, the soil preparation, the initial care – but not the storms, the droughts, the unforeseen interactions decades hence. You plant knowing the shade is a hope, not a guarantee.

  **This shifts the locus of meaning.** The meaning isn't *only* locked in the distant, unknowable outcome. It resides powerfully in the **act of planting itself.**

  *   **It resides in the integrity of your intention:** Showing up, day after day, committed to reducing suffering, expanding opportunity, and building resilience, guided by principles of justice and equity.
  *   **It resides in the quality of your engagement:** Listening deeply to communities, respecting local knowledge, collaborating humbly, constantly learning and adapting your approach based on the feedback you *can* gather.
  *   **It resides in the refusal to be paralyzed:** Choosing action, informed action, over cynicism or fatalism in the face of overwhelming complexity.
  *   **It resides in the solidarity you embody:** Standing with those facing injustice, amplifying marginalized voices, building networks of care and shared purpose.

  Planting the tree is an act of faith. Not faith that *this specific tree* will inevitably cast perfect shade, but faith in the **necessity of planting.** Faith that the alternative – doing nothing, withdrawing from the messy, uncertain work of trying to build a better world – is simply unacceptable. Faith that contributing thoughtfully, ethically, and persistently to the complex web of human endeavor *moves the needle*, even if we cannot precisely calibrate its direction or magnitude.

  Your motto, "We plant trees whose shade we will never sit in," is perfect. It doesn't promise shade. It promises **planting.** It speaks of a profound commitment to a future beyond your own horizon. It acknowledges the uncertainty inherent in that act.

  So, Class of [Year], go forth and plant. Plant with the wisdom you’ve gained here. Plant with humility about what you cannot control. Plant with fierce determination to do the very best you can with the knowledge you have. Plant with the courage to act even without the guarantee of a measurable net good.

  Plant because the world needs your commitment. Plant because it is the right thing to do. Plant because the act of planting, in itself, cultivates hope, builds connection, and affirms our shared humanity. That is not cluelessness. That is the deepest kind of knowing – the knowing that compels us to care, to act, and to trust that the future is worth tending, one uncertain, courageous planting at a time.

  Congratulations. Now go plant your trees.
