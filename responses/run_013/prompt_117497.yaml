  ### Session Plan: Inducing Concepts through Bongard Problems

  **Total Duration:** 90 minutes  
  **Goal:** Demonstrate that concept induction is underdetermined by examples alone. The "right" rule isn't just about fitting all 12 figures, but being **human-interpretable, simple, and expressible in a natural sentence**.  
  **Core Insight:** Examples alone don’t fix the rule; human cognition (simplicity, prior expectations) resolves ambiguity.

  ---

  ### **Designed Bongard Problem**  
  **Problem Name:** *The Dot & Line*  
  ![Bongard Problem: Left (6 figures) | Right (6 figures)](https://i.imgur.com/placeholder.png) *[Note: In practice, draw this by hand or use simple graphics. Described below.]*  

  **Visual Description:**  
  - **Left (6 figures):**  
    - All show a **circle** containing:  
      - A **horizontal line segment** (centered).  
      - A **dot** placed **to the left** of the line.  
    - *Variations:* Line thickness, circle size, dot size.  
  - **Right (6 figures):**  
    - All show a **circle** containing:  
      - A **vertical line segment** (centered).  
      - A **dot** placed **above** the line.  
    - *Variations:* Line length, circle color, dot position slight shifts.  

  **Why This Problem?**  
  - Solvable by humans in ~1 minute (salient features).  
  - **No single-feature detector works:** Both sides share circles, dots, and lines.  
  - **Fits ≥2 Wrong Rules:**  
    1. **Orientation Rule:** "Left has horizontal lines, right has vertical lines."  
       - Fits all 12: Left = horizontal, right = vertical.  
    2. **Dot Position Rule:** "Left has dots left of the line, right has dots above the line."  
       - Fits all 12: Dot is left (left) and above (right).  
    3. **Intended Rule (Natural):** "Left has horizontal lines with dots to the left; right has vertical lines with dots above."  
       - Human-preferred: Uses **conjunction of line orientation + dot position**, forming a coherent pattern.  

  ---

  ### **Session Sequence**  
  *(Timings are flexible; adjust for group pace.)*  

  1. **Intro (5 min):**  
     - **Hook:** "We learn concepts from few examples—like children or scientists. Today, we’ll explore how this works using Bongard problems."  
     - **What’s a Bongard Problem?** Show a trivial example (e.g., left: triangles, right: squares). Explain: 12 figures, 6 left/right, find the rule.  

  2. **Present *The Dot & Line* Problem (10 min):**  
     - Display figures (left vs. right).  
     - **Task:** "In pairs, spend 2 minutes writing a rule that separates left from right."  
     - *Goal:* Get participants to engage with ambiguity.  

  3. **Collect Rules (10 min):**  
     - Participants share rules. Write them publicly (board/slide).  
     - **Expected Responses:**  
       - "Horizontal vs. vertical lines."  
       - "Dots left vs. above lines."  
       - "Horizontal lines with left dots" (intended).  
       - *Rare:* Overly complex rules (e.g., "Circles with lines not vertical and dots in the left half").  
     - **Validate:** Confirm each proposed rule fits all 12 figures.  

  4. **Reveal Ambiguity (10 min):**  
     - **Key Q:** "Multiple rules fit perfectly. Which one is *right*?"  
     - **Guide Discussion:**  
       - Rules like "horizontal vs. vertical" or "dot position" are consistent but incomplete.  
       - Point out the intended rule uses *both* features naturally.  
     - **Transition:** "Why do we prefer one rule over another?"  

  5. **Core Insight: Human Interpretability (15 min):**  
     - **Activity:** "Rewrite your rule as a simple English sentence. Which feels most natural?"  
       - *Orientation Rule:* "Left has horizontal lines, right has vertical."  
       - *Dot Rule:* "Dots are left of the line on left, above on right."  
       - *Intended:* "Left has horizontal lines with dots to the left; right has vertical lines with dots above."  
     - **Discussion:**  
       - Humans prioritize **conjunctions** that tell a "story" (e.g., dots are *placed relative* to lines).  
       - Simplicity ≠ minimal features; it’s about **cognitive fluency** (e.g., "horizontal with left dots" feels intuitive).  
       - **Analogy:** If you described this to a friend, you’d mention both line *and* dot together.  

  6. **Head Off Misconceptions (20 min):**  
     Address these explicitly:  
     - **"More examples would pin it down."**  
       - **Counter:** Add a 13th figure (e.g., left: horizontal line with dot *above*).  
         - *Orientation Rule:* Calls it "left" (horizontal).  
         - *Dot Rule:* Calls it "right" (dot above).  
         - *Intended Rule:* Rejects it (not horizontal+left dot).  
       - **Point:** More examples can *contradict* wrong rules but don’t *prove* the intended one. You still need human-like bias.  
     - **"Any rule that fits is as good as any other."**  
       - **Counter:** Compare:  
         - *Bad Rule:* "Left: figures drawn on Tuesdays. Right: Wednesdays." (Fits but absurd).  
         - *Better Rules:* Simpler, generalizable, causal (e.g., dot placement "interacts" with line).  
       - **Point:** Rules are judged by **utility** (e.g., generalizability, explainability).  
     - **"The hard part is seeing the figures, not finding the rule."**  
       - **Counter:** In *Dot & Line*, features are obvious. The challenge is **which combinations matter**.  
       - **Point:** Perception is trivial; the bottleneck is **hypothesis selection** (why we favor some conjunctions).  

  7. **Check for Understanding (10 min):**  
     - **Activity:** Give a new BP (e.g., left: circles inside squares; right: squares inside circles).  
       - **Task:** "Write two rules that fit. Which would a human *say*, and why?"  
     - **Assess:**  
       - Success: Participants propose "containment direction" (natural) vs. "shape counts" (fits but unnatural).  
       - Red Flag: Focus on single features (e.g., "left has squares").  

  8. **Wrap-Up (5 min):**  
     - **Recap:**  
       - Concepts are induced via **human biases** (simplicity, coherence), not just data fitting.  
       - BPs reveal how we **resolve ambiguity** with limited examples.  
     - **Openly Exclude:**  
       - "We didn’t cover computational models (e.g., neural nets) or formal learning theory (e.g., PAC learning). This is about *cognitive* intuition."  
     - **Closing:** "Next time you see a pattern, ask: What would a human say? That’s often the ‘right’ answer."  

  ---

  ### **Why This Works**  
  - **Problem Choice:** *Dot & Line* forces ambiguity with multiple valid rules, making human interpretability unavoidable.  
  - **Flow:** Starts concrete (figures), surfaces ambiguity, resolves via cognitive principles.  
  - **Misconceptions:** Addressed with counterexamples rooted in the problem.  
  - **Check:** Active task (new BP) ensures transfer—not just engagement.  

  **Materials Needed:**  
  - Visuals for *Dot & Line* (left: 6x circle + horizontal line + left dot; right: 6x circle + vertical line + top dot).  
  - Backup BPs for the check (e.g., containment, parity problems).  
  - Whiteboard/slides for rule brainstorming.
