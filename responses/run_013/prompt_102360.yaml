answer: |-
  Here’s a structured 60-minute teaching plan centered on a clinical case, designed to build understanding sequentially while preempting misconceptions. The key is to make abstract concepts tangible through concrete steps.

  **Core Case: Hypertension (High Blood Pressure)**  
  *Why it works:*  
  - Universal clinical relevance (audience likely knows someone with hypertension)  
  - Biological basis (measurable cardiovascular dysfunction)  
  - Value-laden thresholds (diagnostic criteria shift with age, guidelines, societal context)  
  - Avoids obvious objections (e.g., not mental health—avoids "hard cases" distraction)

  ---

  ### **Teaching Sequence (55 mins + 5 min wrap)**  
  **1. Anchor in Common Ground: "Disease as Biological Breakdown" (10 mins)**  
  - *Start with:* "What happens in uncontrolled hypertension?" (Brief physiology: arterial damage, stroke risk—**no jargon**).  
  - *Emphasize:* Measurable organ dysfunction (heart, kidneys) = biological fact.  
  - *Why first?* Leverages audience’s default "science = biology" view. Establishes credibility.  
  - **Preempt misconception:** Acknowledge this *feels* like pure science—"We’ll test that."  

  **2. Introduce the Wrinkle: Thresholds & Guidelines (15 mins)**  
  - *Present the case:*  
    - *Patient A:* 65 y/o with BP 142/92.  
    - *Guideline 1 (2003):* Hypertensive if >140/90.  
    - *Guideline 2 (2017):* Hypertensive if >130/80.  
  - *Question:* "Did Patient A’s *biology* change when guidelines shifted?"  
  - *Reveal:* Values in action—lower threshold reflects new evidence that *small* reductions prevent more strokes (value: preventing mild disability > avoiding medication side effects).  
  - *Why here?* Shows values embedded in "objective" diagnostics. Depends on Step 1 to highlight the contrast.  

  **3. Pressure Point: Reference Class Problem (10 mins)**  
  - *Ask:* "Whose 'normal' biology matters?"  
  - *Example:* BP thresholds for a 20 y/o athlete vs. 80 y/o with arthritis.  
  - *Key insight:* "Typical function" requires choosing *which* age/environment is "normal" for humans. Biology can’t define "normal" without a reference group—a value choice.  
  - *Why here?* Builds on Step 2’s threshold debate. Exposes biology’s dependency on context.  
  - **Preempt misconception:** Clarify this isn’t relativism—it’s *constrained* by biology (e.g., BP 200/120 harms anyone).  

  **4. Separate Disease vs. Illness (10 mins)**  
  - *Case nuance:* Patient A has "disease" per guidelines but *feels fine* (no illness). Patient B has debilitating migraines (illness) but "normal" tests.  
  - *Contrast:* Disease = clinically assessed dysfunction; Illness = lived experience.  
  - *Why here?* Prevents conflation. Depends on Steps 1–3 showing disease isn’t defined by symptoms.  
  - **Preempt misconception:** "Illness is subjective; disease isn’t—but both involve values."  

  **5. Synthesize the Dispute (10 mins)**  
  - *Recap:*  
    - **Biological view:** Disease = deviation from species-typical function (e.g., hypertension damaging organs).  
    - **Value-laden view:** Calling it "disease" requires judging dysfunction *harmful* (e.g., why lower BP thresholds for diabetics? Values prioritize preventing specific harms).  
  - *Revisit Patient A:* Biology explains *how* BP harms; values determine *when* we label it "disease-worthy."  

  ---

  ### **Closing Question to Test Understanding (5 mins)**  
  **"If we discovered a gene causing lifelong 2°F higher body temperature with no health impacts, would it be a disease? Why/why not?"**  
  - *Tests grasp:* Biological deviation ≠ disease without harm (values). If they debate "harm," distinction has landed.  

  ---

  ### **What to Set Aside Openly**  
  1. **Mental health disorders:** Too many layers (social norms, neurobiology) for intro.  
  2. **Political debates (e.g., obesity):** Audiences fixate on stigma, derailing philosophy.  
  3. **Deep metaphysics:** Avoid "what is function?" debates. Stick to clinical pragmatism.  

  ---

  **Why This Sequence Works**  
  - **Builds stepwise:** Each concept (biology → thresholds → reference class → illness) scaffolds the next.  
  - **Case focus:** Hypertension grounds abstraction. Shifting guidelines make values *visible*.  
  - **Preempts errors:** Addresses "science=biology" early, separates illness explicitly, and frames values as *reasoned* (not relativism).  
  - **Accessible:** No prior knowledge needed—physiology is simplified, philosophy emerges from case puzzles.  

  This approach honors your expertise while respecting the audience’s neutrality. By the close, they’ll see disease as a **bio-normative hybrid**—neither pure fact nor mere opinion, but a negotiated truth.
