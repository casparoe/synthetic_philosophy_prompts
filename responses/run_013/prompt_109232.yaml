prompt: |-
  Act as a decision theorist and a veteran of adversarial seminars: someone who knows the evidential, causal, and functional decision-theory debates and the standard solution concepts in game theory from the inside, and who is unusually good at predicting which objection a particular kind of philosopher or economist will actually make. I need a Q&A prep sheet, not a defense of my view, and not a literature survey.

  In nine days I am presenting a paper on the Platonia dilemma and the Luring Lottery to a mixed reading group. The centerpiece is my own variant, which I will put on the board:

  - 100 players, one-shot, anonymous, no communication, no repeat play.
  - Each player privately chooses ENTER or STAY OUT. Entering costs $1.
  - If exactly one player enters, that player receives $1,000,000 (net $999,999).
  - If two or more enter, nobody wins, and every entrant is out $1.
  - If nobody enters, nothing happens.

  I claim the $1 fee is doing real work: in the fee-free version, universal entering and universal abstention both pay zero, so universalizability alone does not discriminate between them; the fee breaks that tie and makes the superrational answer determinate — and, I argue, self-undermining. My thesis is that this family of puzzles does not reveal a distinct superrational faculty or a rival to expected-utility maximization, but instead reveals that expected-utility maximization is under-specified until you supply a population model: a joint distribution over how the other players reason. The Platonia intuition is the limiting case in which you are certain that every other player reasons exactly as you do; relax that limit and the answer becomes a belief-indexed threshold — I make it roughly 13% — rather than a verdict about rationality as such.

  The audience is about eight people: three microeconomic theorists who treat Nash equilibrium and its refinements as the criterion of rationality and regard superrationality and team reasoning as either confused or already accounted for; one experimental economist who has spent a decade running one-shot public-goods and volunteer's-dilemma experiments with real money and cares chiefly about what subjects actually do; two philosophers of action who work on evidential and causal decision theory and Newcomb-style problems; and one mechanism designer interested only in worst-case robustness and incentive compatibility.

  Before you draft anything, work out the equilibria of my game and the expected value of entering as a function of a player's beliefs, and check my arithmetic. Then give me the prep sheet: the objections this audience will actually raise, ordered by how much damage they do to my thesis and labelled with who raises each and how likely it is; each objection phrased as that person would phrase it, in their vocabulary rather than mine; a two-minute reply to each, with a blunt note on where the reply is soft; what I should concede up front to buy credibility and what I must not concede; the single reply that has to land for the thesis to survive; and the question I am hoping nobody asks. If an objection is fatal, say so plainly instead of softening it. I know the literature, so spare me reading lists and general seminar advice; the objections have to be answerable from what is on the board.
reasoning: |-
  We are given a game with 100 players. Each player chooses independently to ENTER (cost $1) or STAY OUT (cost $0). If exactly one player enters, that entrant wins $1,000,000 (net gain $999,999). If two or more enter, all entrants lose $1. If none enters, all get 0.

  First, let's analyze the game from a standard game-theoretic perspective (Nash equilibrium).

  **Nash Equilibria:**

  1. **Pure-strategy Nash equilibria:**
     - Consider a strategy profile in which exactly one player enters and all others stay out. The entrant gets $999,999 (which is positive) and would not want to deviate to staying out (which gives 0). Any other player who stays out gets 0 and would not want to deviate to entering because if they enter, then two players enter and they get -$1 (which is worse). Therefore, any profile with exactly one entrant is a pure Nash equilibrium. There are 100 such equilibria (one for each player being the entrant).

     - Another candidate: all players stay out. Then each gets 0. If a single player deviates and enters, then that player would be the only entrant and get $999,999, which is better than 0. Therefore, everyone staying out is NOT a Nash equilibrium.

     - What about two or more entering? Suppose k>=2 players enter. Each entrant gets -$1. If one of them deviates to staying out, then there would be k-1 entrants. If k-1=1, then the remaining entrant wins. But the deviating player would get 0 (by staying out) which is better than -$1. So if k>=2, then any entrant would want to deviate. Therefore, no equilibrium with two or more entrants.

     So the only pure-strategy Nash equilibria are the 100 profiles with exactly one entrant.

  2. **Symmetric mixed-strategy Nash equilibrium:**
     Assume every player uses the same mixed strategy: enter with probability p, stay out with probability 1-p.

     For a given player, the payoff of entering depends on the number of other entrants. Let X be the number of entrants among the other 99 players. X ~ Binomial(99, p).

     The player's expected payoff from entering:
       - If X=0 (no other entrants), the player wins the prize: 999,999.
       - If X>=1, then there are at least two entrants (the player and at least one other) and the player loses 1.

     So:
       EU(enter) = P(X=0) * 999,999 + [1 - P(X=0)] * (-1)

     The payoff from staying out is 0.

     In a mixed equilibrium, the player must be indifferent between entering and staying out. So:

       P(X=0) * 999,999 + [1 - P(X=0)] * (-1) = 0

       => P(X=0) * 999,999 - 1 + P(X=0) = 0   [because [1-P(X=0)]*(-1) = -1 + P(X=0)]
       => P(X=0) * (1,000,000) = 1
       => P(X=0) = 1 / 1,000,000

     Now, P(X=0) = (1-p)^{99} = 1 / 1,000,000

     Therefore:
          (1-p)^{99} = 10^{-6}
          => 1-p = (10^{-6})^{1/99} ≈ (10^{-6})^{0.010101} 

     We can take natural logarithms:
          ln(1-p) = (1/99) * ln(10^{-6}) = (1/99) * (-6 * ln(10)) ≈ (1/99)*(-13.8155) ≈ -0.13955
          => 1-p ≈ e^{-0.13955} ≈ 0.8697
          => p ≈ 1 - 0.8697 = 0.1303

     So the symmetric mixed-strategy equilibrium has each player entering with probability about 13.03%. This matches the presenter's "roughly 13%".

  **Expected Value as a Function of Beliefs:**

  For a player with a belief about the probability of entry by others, we can compute the expected value of entering.

  Assume the player believes that each of the other 99 players enters independently with probability q.

  Then, the number of other entrants X ~ Binomial(99, q).

  The expected payoff of entering:

     EU(enter) = P(X=0) * 999999 + [1 - P(X=0)] * (-1)
               = (1-q)^{99} * 999999 - [1 - (1-q)^{99}]
               = (1-q)^{99} * 1000000 - 1

  The expected payoff of staying out is 0.

  So the player will enter if:
        (1-q)^{99} * 1000000 - 1 > 0
     => (1-q)^{99} * 1000000 > 1
     => (1-q)^{99} > 1/1000000

  This gives a threshold for q: if q is below a certain level, entering is profitable.

  We can solve for the threshold q* such that the player is indifferent:

        (1 - q*)^{99} = 10^{-6}
        => 1 - q* = 10^{-6/99} ≈ 10^{-0.060606} ≈ 0.8697   [as above]
        => q* ≈ 1 - 0.8697 = 0.1303

  So if the player believes that the average entry probability of others is less than 13.03%, then entering is strictly better. If above, then staying out is better. If exactly 13.03%, indifferent.

  **Presenter's Thesis:**

  The presenter argues that the Platonia intuition (where every player reasons the same and they all coordinate on the same action) is a special case of a population model. Without the fee, universal entering and universal abstention both yield 0. The fee breaks the tie: universal abstention yields 0, but universal entering yields a loss of $1 per player. So the superrational answer (if every player reasons that they are all the same) would be to abstain. However, the presenter says that expected-utility maximization is under-specified without a population model (a joint distribution over how others reason). The Platonia case is when you are certain that every other player reasons exactly as you do. Relaxing that, we get a threshold (around 13%) that depends on beliefs.

  **Prep Sheet for Q&A:**

  **Objections:**

  I. **From the microeconomic theorists (Nash purists):**
     - **Objection (Likely):** "This setup has multiple pure Nash equilibria, each with one entrant. The symmetric mixed equilibrium is also a Nash equilibrium. Why are you talking about a threshold in beliefs? Rational players should coordinate on one of the pure equilibria. The symmetric mixed equilibrium is inefficient and less likely to be played. Your threshold of 13% is just the mixed equilibrium and is irrelevant to the main issue of coordination. Moreover, the superrationality you discuss is not standard and not needed because we already have Nash equilibrium as the solution concept."

     - **Reply (2 minutes):** "I agree that the pure equilibria exist and are efficient. However, in a one-shot anonymous game with no communication, coordination on a particular pure equilibrium is impossible. The symmetric mixed equilibrium is the only symmetric equilibrium and may be salient when players cannot use labels to coordinate. The threshold in beliefs is how a player with probabilistic beliefs about others would decide. The point is that without a population model (which includes beliefs about how others will play), we cannot specify what a rational player should do. The Platonia intuition is a degenerate population model where you are certain that everyone is identical and will do the same as you. That model leads to abstention because of the fee. But if you relax that model to allow for uncertainty, then the threshold emerges. The superrational solution is just one point in the space of population models."

     - **Blunt note on softness:** The reply does not fully address why we should focus on symmetric play when the pure equilibria are better. Also, the Nash purist might not accept that symmetric mixed equilibrium is the relevant prediction.

     - **Concession:** Acknowledge that in a repeated game or with communication, coordination on a pure equilibrium might occur. But in this one-shot anonymous setting, it's not feasible.

  II. **From the experimental economist:**
     - **Objection (Very Likely):** "In my experiments on volunteer's dilemmas, I observe that the probability of entry decreases as the group size increases, but it doesn't drop to zero. Even in large groups, some people enter. Your threshold of 13% might be a prediction for a rational player, but in reality, we see heterogeneity: some subjects are altruistic, some are selfish. How does your model account for the actual behavior? And why do you think the fee is doing work? In the fee-free version, we still see low entry rates in large groups because the chance of being the sole entrant is low."

     - **Reply (2 minutes):** "I agree that real subjects are heterogeneous. My model is normative: it tells us what a rational agent should do given a belief about others. The threshold of 13% is for an agent who believes that every other player independently enters with probability q. In reality, subjects may have different beliefs and different decision rules. The fee is critical in the superrational argument because without it, the universal entry and universal abstention are equally good (both 0). The fee breaks the tie and makes universal abstention the superrational choice. But if we move to a population model that allows for some uncertainty about others' actions (e.g., some players might enter with a fixed probability), then the rational action becomes a function of that belief. The experimental data might be explained by a distribution of beliefs and/or altruism."

     - **Blunt note on softness:** The reply does not provide a direct mapping from the model to the data. The experimentalist might remain skeptical about the relevance of the fee.

  III. **From the philosophers of action (especially the EDT/CDT advocates):**
     - **Objection (Likely):** "You claim that the fee breaks the tie in the superrational analysis. But in the fee-free version, if we use evidential decision theory (EDT), then conditional on everyone entering, your payoff is 0, and conditional on everyone abstaining, your payoff is 0. However, if you condition on your own action, then EDT might still recommend abstaining because if you enter, that might be evidence that others are entering too (if you think you are typical). In fact, in the fee-free version, EDT might still lead to abstention because the expected payoff of entering is negative: if you enter, that raises the probability that others are entering, leading to a low chance of being the sole entrant. So the fee might not be doing the work you think it is."

     - **Reply (2 minutes):** "You are right that in EDT, the fee-free version might still lead to abstention because of the correlation between your action and others. However, without the fee, the abstention outcome is not strictly better than the entry outcome when everyone does the same. With the fee, universal abstention yields 0 while universal entry yields -1. So under EDT, if you condition on the entire population being identical, then abstaining dominates (since if everyone enters, you get -1; if everyone abstains, you get 0). Without the fee, EDT might still lead to abstention, but the symmetry between the two universal actions is broken by the fee. Moreover, my main point is that EDT (which is a form of population model that assumes perfect correlation) is one extreme. When we relax that to allow for independent beliefs, we get the threshold."

     - **Blunt note on softness:** The reply might not fully satisfy because EDT without fee might still lead to abstention. The presenter must emphasize that the fee makes the abstention outcome strictly better than the entry outcome in the universal case, which breaks the tie.

  IV. **From the mechanism designer (worst-case robustness):**
     - **Objection (Possible):** "Why should we care about this symmetric superrational reasoning? In mechanism design, we look for strategies that are robust to any behavior of others. For example, entering is not a dominant strategy: if you enter and no one else does, you win; but if at least one other enters, you lose. Staying out is safe (0). In fact, staying out is the maximin strategy because the worst-case payoff for entering is -1 (if at least one other enters) and for staying out is 0. So a risk-averse player would stay out. Your threshold of 13% is for risk-neutral players, but what about risk aversion? And in any case, the mechanism is fragile: it has multiple equilibria and no dominant strategy."

     - **Reply (2 minutes):** "I agree that staying out is the maximin strategy and that risk aversion would push toward staying out. The threshold of 13% is for risk-neutral expected utility maximizers. My point is that the rational action depends on the population model and beliefs. The superrational approach is a special case that leads to abstention. But if a player has a probabilistic belief that others are entering independently with a probability below 13%, then entering is rational. The mechanism designer's worst-case perspective is one extreme: assume the worst about others. That leads to staying out. But that is just one point in the spectrum of beliefs. The fee is critical because without it, the maximin strategy would also be to stay out (since the worst case for entering is 0 if everyone else enters? Actually, in the fee-free version, if you enter and others also enter, you get 0? So worst-case for entering is 0? Then maximin might be indifferent? Let me check.)

          Correction: In the fee-free version:
              Entering: 
                  - If you are the only entrant: 1,000,000
                  - If at least one other enters: 0
              Staying out: 0.

          The worst-case for entering is 0 (if others enter) and for staying out is 0. So maximin is indifferent.

          With the fee:
              Entering: 
                  - Only entrant: 999,999
                  - Otherwise: -1
              Staying out: 0.

          The worst-case for entering is -1, for staying out is 0. So maximin prefers staying out.

          So the fee makes staying out the unique maximin strategy.

          This is consistent with the superrational abstention. But again, it is one extreme. If a player has more optimistic beliefs, then entering might be justified.

          The mechanism designer's concern for robustness is valid, but it is a specific population model (the worst-case one)."

     - **Blunt note on softness:** The reply acknowledges the worst-case perspective but does not integrate it with the threshold model. The mechanism designer might not be satisfied because the model does not address robustness.

  **What to concede up front:**
     - The existence of pure Nash equilibria and that they are efficient.
     - That without communication, coordination on a pure equilibrium is unlikely.
     - That the symmetric mixed equilibrium is one solution but may not be the one that occurs in practice.

  **What not to concede:**
     - That the superrational approach is the correct one. Instead, maintain that it is a special case of a belief model.
     - That the fee is not essential for breaking the symmetry in the universal case.

  **The single reply that has to land:**
     The core thesis is that expected-utility maximization is under-specified without a population model. The key reply is:

     "In decision theory, we often assume that the agent has a joint distribution over the states of nature. Here, the 'state of nature' includes the actions of the other players. The Platonia intuition is the case where the agent is certain that every other player is identical to them and will choose the same action. That model leads to abstention because of the fee. But if we use a different population model, such as independent and identical beliefs (each other player enters independently with probability q), then we get a threshold. Rationality alone does not fix the population model. Therefore, the decision depends on the agent's beliefs about how others reason."

  **The question I am hoping nobody asks:**
     "In your threshold model, you assume that the player believes that others enter independently with probability q. But if the players are symmetric and rational, shouldn't they all be using the same mixed strategy? And if so, then the only consistent q is the mixed equilibrium probability of 13%. So why do you need a continuum of beliefs? The population model is fixed by the equilibrium requirement."

     This question is challenging because it pushes the symmetric mixed equilibrium as the only rational outcome. The reply would be:

     "That is a valid point in the Nash equilibrium framework. However, the Nash equilibrium concept assumes that players' beliefs are correct and that they are playing best responses to the actual strategies. But in a one-shot game without pre-play communication, how do players arrive at that equilibrium? The population model I am discussing is about the player's subjective beliefs, which might not be in equilibrium. My point is that without specifying the population model (which in equilibrium is fixed by the requirement of correctness), we cannot say what action is rational. The superrational model is an alternative to the Nash model. The Nash equilibrium is one population model (with independent mixing and correct beliefs). The Platonia model is another (with perfect correlation). There are others. The threshold arises when we consider non-equilibrium beliefs or models without common knowledge of rationality."

     This reply is soft because it does not fully reconcile the non-equilibrium beliefs with rationality.

     Alternatively, one might argue that if the player does not know the strategies of others, then they might have a prior distribution over q, and then update based on their own reasoning. But that becomes very complex.

     This question is particularly dangerous because it challenges the need for a continuum of beliefs and suggests that the Nash mixed strategy is the only rational solution.

  **Summary of Objections by Damage and Likelihood:**

  Ordered by damage to the thesis (most damaging first) and likelihood:

  1. **The Nash purist objection** (damage: high, likelihood: high) - because it challenges the relevance of the threshold and the superrational approach by appealing to standard game theory.

  2. **The equilibrium consistency question** (hoped not to be asked) (damage: very high, likelihood: medium) - because it argues that the threshold model is redundant if we require equilibrium.

  3. **The EDT objection** (damage: medium, likelihood: high) - because it challenges the role of the fee.

  4. **The experimentalist objection** (damage: low, likelihood: high) - because it is about empirical relevance, but the thesis is normative.

  5. **The mechanism designer's objection** (damage: low, likelihood: medium) - because it is a different perspective (robustness) and does not directly challenge the thesis.

  **Final Note:**

  The presenter must emphasize that the fee breaks the symmetry in the universal case (abstention becomes strictly better than entry when everyone does the same) and that the threshold model is a generalization that includes both the superrational case (as the limit of perfect correlation) and the independent-beliefs case. The key is that without specifying the population model, the decision problem is not fully specified.
answer: |-
  ### Pre-Seminar Analysis  
  **Equilibria and Expected Value Calculation:**  
  - **Pure-strategy Nash equilibria:** 100 equilibria where exactly one player enters (the entrant nets $999,999; others net $0). Universal abstention is not Nash (a player would deviate to enter and win). Multiple-entry profiles are not Nash (entrants would deviate to abstain).  
  - **Symmetric mixed-strategy Nash equilibrium:** Each player enters with probability \(p\). Indifference condition: \(P(\text{0 others enter}) \times 999,999 + P(\geq 1 \text{ other enters}) \times (-1) = 0\).  
    \[
    (1-p)^{99} \times 1,000,000 - 1 = 0 \implies (1-p)^{99} = 10^{-6} \implies p \approx 0.1303 \quad (\text{13.03\%})
    \]  
  - **Expected value of entering:** If a player believes each opponent enters independently with probability \(q\), then:  
    \[
    \text{EV}(\text{enter}) = (1-q)^{99} \times 1,000,000 - 1
    \]  
    Enter iff \(\text{EV}(\text{enter}) > 0 \implies q < 0.1303\).  
  Your arithmetic is correct; the threshold is ~13%.  

  ---

  ### Q&A Prep Sheet  
  **Core Thesis:** The fee breaks symmetry in universal actions (abstention > entry), but "superrationality" is just one extreme population model (perfect correlation). Expected utility maximization requires a population model (joint distribution over others' reasoning), and the threshold (~13%) emerges under independence. No distinct "superrational faculty" exists.  

  **Objections Ordered by Damage/Likelihood:**  
  1. **Microeconomic Theorist (Nash Purist)**  
     - **Objection (Likelihood: High, Damage: High):** "This is just a volunteer's dilemma with a mixed-strategy equilibrium at ~13%. Why invoke 'superrationality'? Nash equilibrium already handles it: the pure equilibria are efficient, and the mixed one is symmetric. Your 'population model' is redundant—rational players should coordinate on pure equilibria or mix at Nash. The fee changes nothing fundamental."  
     - **Reply (2 min):** "Agreed, Nash is sufficient *if* players can coordinate on equilibria. But in a one-shot anonymous game, how do they select a pure equilibrium without labels or communication? The mixed equilibrium assumes independence and identical beliefs. Superrationality (perfect correlation) is another model—extreme but observed in lab settings. The fee breaks indifference in that model. My point: Nash doesn’t specify *which* equilibrium; it’s silent on how beliefs form. The threshold quantifies how sensitive rationality is to beliefs."  
     - **Blunt Note:** Reply is soft on why we should care about superrationality when Nash exists.  
     - **Damage Control:** Concede Nash is standard but stress anonymity and coordination failure.  

  2. **Philosopher of Action (EDT Advocate)**  
     - **Objection (Likelihood: High, Damage: Medium):** "The fee doesn’t break the tie in evidential decision theory (EDT). Without a fee, EDT already predicts abstention: conditioning on entering raises the likelihood others enter, making EV(enter) negative. With a fee, EDT still predicts abstention—but for the same reason, not due to 'universalizability'. Your threshold assumes causal independence, but EDT players don’t assume that."  
     - **Reply (2 min):** "Correct—EDT doesn’t require the fee for abstention. But without it, universal entry and abstention are *evidentially* symmetric (both yield 0). The fee makes abstention strictly dominant evidentially *if* you condition on universal correlation (P(others enter | I enter) ≈ 1). My threshold is causal; EDT is one population model (perfect correlation). Relax correlation to independence, and EDT gives the same threshold."  
     - **Blunt Note:** Reply conflates EDT with superrationality; may not satisfy if EDT avoids universalizability.  

  3. **Experimental Economist**  
     - **Objection (Likelihood: High, Damage: Medium):** "Your threshold (~13%) doesn’t match my lab data. In volunteer’s dilemmas, entry probability drops with group size but rarely hits zero. Subjects show heterogeneity—some are altruistic, some random. Your model assumes identical rational players; it ignores psychology. And why does the fee matter? In fee-free versions, we still see low entry."  
     - **Reply (2 min):** "Agreed—this is normative, not descriptive. The threshold is for rational players with independent beliefs. Heterogeneity (e.g., some players always enter) can be modeled as varying beliefs. The fee’s role is theoretical: in the universal-correlation model, it makes abstention strictly better than entry. Empirically, fees may anchor losses, but I’m explaining why superrationality isn’t a *distinct* rationality."  
     - **Blunt Note:** Dodges fee’s empirical relevance; experimentalist may dismiss as "just theory."  

  4. **Mechanism Designer (Robustness Focused)**  
     - **Objection (Likelihood: Medium, Damage: Low):** "Your threshold depends on precise beliefs. In worst-case design, we assume adversarial players. Here, STAY OUT is maximin (guarantees 0; entering risks −1). Why wouldn’t a robust player ignore your threshold and always abstain?"  
     - **Reply (2 min):** "Maximin is valid for robustness, but it’s extreme pessimism. My point is that rational players use *some* belief model—maximin is one (belief that opponents minimize your payoff). Superrationality is another (belief that opponents mirror you). The threshold (~13%) is under independence. All are EU-maximizing given their model."  
     - **Blunt Note:** Grants their point; low damage because worst-case isn’t your focus.  

  5. **Microeconomic Theorist (Follow-Up on Symmetry)**  
     - **Objection (Likelihood: Medium, Damage: High):** "If players are symmetric and rational, why not assume they play the symmetric mixed equilibrium? Your threshold is just the mixed-strategy Nash. No need for 'population models'—this is standard game theory."  
     - **Reply (2 min):** "The mixed equilibrium *is* the threshold under independence and common knowledge of rationality. But superrationality assumes *perfect correlation*, not independence. I’m showing these are two points on a spectrum. Without specifying how players model others, EU maximization is incomplete."  
     - **Blunt Note:** Risks conflating equilibrium with belief-formation; Nash purist may insist equilibrium implies correct beliefs.  

  **Fatal Objection?** None are fatal if you hold the line that population models are necessary for specifying EU maximization. The worst is the **first objection**—if Nash is deemed sufficient, your thesis seems redundant.  

  ---

  **Strategic Concessions:**  
  - **Concede Up Front:** "Nash equilibria exist and are normatively compelling when coordination is feasible. The mixed equilibrium is a valid solution under symmetry and independence." *This buys credibility with game theorists.*  
  - **Do NOT Concede:** That superrationality is irrational or that the fee is irrelevant. Stick to: "The fee breaks the tie in the universal-correlation model, making abstention strictly better."  

  **Make-or-Break Reply:**  
  > "EU maximization requires a joint distribution over others’ actions. Superrationality is one such distribution: Dirac delta on ‘all do as I do’. Independence is another: binomial distributions. The threshold (~13%) falls out of the latter. No new ‘faculty’ is needed—just explicit beliefs. Rationality is *belief-relative*."  
  *If this lands, the thesis survives.*  

  **Question You Hope Nobody Asks:**  
  **Philosopher of Action:** "In the perfect-correlation model, why should I believe others act identically to me? That’s smuggling in team reasoning or Kantian maxims—which *are* rival to EU maximization."  
  - **Why It’s Dangerous:** Forces you to defend superrationality as rational under EU, but perfect correlation may require non-causal updates (à la EDT). Your reply would be shaky: "It’s a limiting case of belief models; no team reasoning needed." *This could unravel your "no rival faculty" claim.*  

  ---

  **Tactical Summary:**  
  - **Lead with:** "This is about belief-sensitivity, not replacing game theory."  
  - **Target Microeconomists First:** Address Nash upfront to neuter their main objection.  
  - **Leverage the Board:** Point to the EV formula \(\text{EV}(\text{enter}) = (1-q)^{99} \times 1,000,000 - 1\) and threshold \(q < 0.1303\). Use it for all objections.  
  - **If Cornered:** "Even in Nash, the mixed equilibrium *is* a belief-indexed threshold—it assumes players believe others mix at 13%."
