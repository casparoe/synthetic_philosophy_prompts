prompt: |-
  I'm a TA for a second-year course on space, time and motion -- we do the Leibniz-Clarke correspondence, a chunk of the Principia, and then some modern philosophy of physics -- and the essay I have to grade next week asks students, for each of four theories, to say whether it's substantivalist or relationist about spacetime. The trouble is I keep disagreeing with my own grading. Two students both write 'substantivalist' about Newton, one because the theory's inventory includes absolute places and one because the bucket needs absolute motion to come out right, and I have no consistent way of saying which of them actually did what the question is asking for. I've also marked an answer wrong for calling something relationist when its own formulation only makes sense if the geometry is there independently of the bodies, and I could feel the verdict was wrong but couldn't say which step of my reasoning licensed it. So before the next batch I want a decision procedure I can actually run on paper, maybe ten minutes an essay, that goes from a stated theory to one of: substantivalist / relationist / neither / not determinable. The course convener has to sign off on anything I add to the rubric, and students can appeal a mark, so it needs to be something I can walk someone through out loud.

  Here's the half-baked thing I've been telling students, which I suspect is doing some of the damage: ask (1) does the theory's inventory of things include points, regions, or a metric as items in their own right, over and above bodies and their relations? (2) does the theory treat the same bodies uniformly shifted, or the same bodies spun up, as a different physical situation or the same one? (3) can the laws be stated without presupposing the geometry as an independent thing? I want you to either fix that into something that works or tell me it's the wrong three questions. The procedure has to say what counts as a sufficient answer at each step, where it terminates in a verdict, where it should stop and say the question isn't well-posed for this theory, and which steps are really interpretation calls dressed up as tests -- I'd much rather flag 'this one is a judgment call' than pretend a test decided it. Also: a colleague tells me I should keep separate what a theory is committed to existing from what it needs in order to be stated at all, and I'm not sure how to build that distinction into a checklist rather than just nodding at it.

  Then run the procedure on three cases and show your work: Newton's absolute space with the bucket (including what exactly the bucket is supposed to prove, and whether it proves that), a Leibniz-style relationalist theory, and one where I expect the procedure to hand me an answer I won't like -- I've been assuming any theory whose laws mention a fixed geometry is automatically substantivalist, and I have a feeling that's going to bite me with a theory where the geometry is itself dynamical, or with some reformulation that's supposed to be empirically equivalent to a relationist one. One student last term argued the whole dispute is verbal; I need the procedure to say whether that's a cop-out or sometimes the right call. Finish by telling me what the procedure can't do -- the cases it'll always get wrong, and whether 'substantivalist' is even one property or a family of them that I've been treating as one. No bibliography please, I just want the procedure.
reasoning: |-
  Okay, the user is a teaching assistant for a second-year philosophy of physics course covering spacetime theories. They're struggling with grading essays where students must classify theories as substantivalist or relationist. The main issue is inconsistency in their own grading—different students give different reasons for the same classification, and the TA isn't sure which reasoning is valid. They've been using a half-baked three-question checklist but suspect it's flawed. They need a reliable, efficient decision procedure that can be applied in about ten minutes per essay, with clear stopping points and acknowledgment of judgment calls. The procedure must withstand student appeals and approval from the course convener.

  The user provided an initial checklist with three questions: existence of spacetime points/metrics in the ontology, treatment of shifted/spun scenarios as identical or distinct, and whether laws presuppose independent geometry. They want this fixed or replaced. Key constraints include handling cases where the answer is neither or indeterminable, flagging judgment calls, accounting for the distinction between ontological commitments and representational necessities, and explicitly stating sufficient conditions at each step.

  Three test cases are requested: Newton's absolute space (with the bucket experiment), Leibniz-style relationism, and a problematic case where a dynamical geometry might challenge their assumption that mentioning geometry implies substantivalism. The user also wants to address cases where the dispute seems verbal, and identify limitations of the procedure.

  Looking at the deeper needs: The TA likely feels professionally vulnerable—inconsistent grading risks student appeals and undermines their authority. They need a method that's defensible academically and administratively. There's also pedagogical concern: students might be confused if classifications seem arbitrary. The mention of a colleague's input suggests internal debate about ontological commitments versus representational tools, indicating a need for conceptual clarity. The "cop-out" comment about verbal disputes reveals anxiety over philosophical depth—they want the procedure to credibly dismiss or validate such arguments.

  For the procedure design, the key is to prioritize ontological commitments while using symmetry and law formulation as secondary checks. The initial questions are salvageable but need restructuring to avoid false positives (e.g., dynamical geometry). The colleague's point is crucial: representational aids (like coordinates) don't imply ontological commitment. The procedure should start with ontology, then verify with symmetries, and finally check if laws can be restated relationally. Judgment calls arise when answers conflict or theories are underdefined.

  For Newton: Absolute space is substantivalist because points exist independently (Q1a yes), shifts change physical states (Q2b no symmetry), and laws require absolute acceleration (Q3a fails). The bucket experiment is evidence but not proof—it illustrates consequences of the ontology.

  For Leibniz: Relationist because no spacetime entities (Q1a no), shifted worlds are identical (Q2a symmetry), and laws use relative quantities (Q3a passes). The bucket wouldn't arise since motion is relational.

  The problematic case: A theory with a dynamical metric (e.g., general relativity without matter). Q1a is tricky—the metric exists but depends on matter. If defined as an independent field, it's substantivalist; if reducible to relations, it's not. Judgment call flagged. This exposes the user's flawed assumption—mentioning geometry isn't automatically substantivalist if it's dynamical.

  Verbal disputes: The procedure can classify "neither" if both ontologies satisfy all checks (rare), or "indeterminable" if evidence is ambiguous. But typically, it's not a cop-out—theories usually lean one way.

  Limitations: The procedure can't handle hybrid theories (e.g., loop quantum gravity), poorly defined theories, or cases where "geometry" is misinterpreted. "Substantivalist" isn't binary—there are degrees (e.g., metric-only vs. manifold-with-metric). The TA should note this in rubrics to avoid oversimplification.

  Final procedure structure: Three sequential questions with clear exit points. Document judgment calls explicitly. For efficiency, stop early if Q1a gives a definitive answer (e.g., "no" for relationism). Always cross-verify with Q2/Q3 to catch edge cases.
answer: |-
  Here's a decision procedure designed for clarity, efficiency, and defensibility. It prioritizes ontological commitment (existence) as the primary criterion, uses symmetries and law formulation as cross-checks, explicitly flags judgment calls, and provides terminating conditions.

  **Decision Procedure: Substantivalism vs. Relationism**

  **Input:** A stated physical theory (including its fundamental ontology and laws).
  **Output:** `Substantivalist` / `Relationist` / `Neither` / `Not Determinable` + Flagged judgment calls.
  **Time:** ~10 minutes per essay (focus on key phrases in student answers).

  **Procedure:**

  1.  **Ontological Commitment (The Core Question):**
      *   **Question 1a:** Does the theory's fundamental ontology explicitly include spacetime points, regions, or a metric/tensor field *as independent, irreducible entities*? (i.e., existing over and above material bodies/fields and their relations).
      *   **Sufficient Answer:**
          *   **Yes (to points/regions/metric):** Proceed to **Step 2** (Strong indicator for Substantivalism; needs verification).
          *   **No (only bodies/fields & relations):** Proceed to **Step 3** (Strong indicator for Relationism; needs verification).
          *   **Unclear/Ambiguous/Not Specified:** Proceed to **Step 4**.
      *   **Termination:** None here. Cross-verification is essential.
      *   **Judgment Call:** Interpreting "fundamental," "independent," and "irreducible" requires judgment. *Flag if contested or ambiguous in the theory/student answer.* **Key Distinction:** Does the theory *need* spacetime entities for its fundamental *description of what exists*, or does it only *use* them as a convenient mathematical tool for describing relations? (Colleague's point addressed here).

  2.  **Verify Substantivalism (Check Symmetries & Laws):** *(If Step 1a = Yes)*
      *   **Question 2a (Symmetry Check):** Does the theory treat a uniform shift (translation/boost) of *all* matter in spacetime as representing the *exact same physical state*? (Leibniz Shift)
      *   **Question 2b (Symmetry Check):** Does the theory treat a uniform rotation (twist) of *all* matter in spacetime as representing the *exact same physical state*? (Leibniz Rotation)
      *   **Question 3a (Law Formulation Check):** Can the fundamental dynamical laws be stated *without referring to* absolute positions, velocities, accelerations, or the intrinsic structure of spacetime points/regions? (i.e., using *only* relative distances, angles, relative velocities, relative accelerations between bodies/fields).
      *   **Verdict:**
          *   If **1a = Yes** AND (**2a = No** OR **2b = No**) AND **3a = No**, then **`Substantivalist`**. (Ontology + broken symmetries + laws need spacetime).
          *   If **1a = Yes** BUT (**2a = Yes** AND **2b = Yes**) AND **3a = Yes**, then **`Not Determinable`** (Potential contradiction - ontology suggests substantivalism, but symmetries/laws suggest relationism. Theory might be poorly specified or a special case).
          *   If **1a = Yes** BUT (**2a = Yes** OR **2b = Yes** OR **3a = Yes**) in a way contradicting typical substantivalism, *Flag Major Judgment Call*. Output **`Substantivalist`** *provisionally* (based on ontology) but note the tension strongly. (This catches dynamical/metric-only cases).
      *   **Termination:** Verdict reached here if conditions met.
      *   **Judgment Call:** Interpreting "same physical state" and whether laws *can* be restated relationally often requires judgment. *Flag if this step is critical for the verdict or contested.* Newton's Bucket is *evidence* for **2b=No/3a=No**, but the *proof* is the ontology (1a=Yes) and the laws needing absolute acceleration.

  3.  **Verify Relationism (Check Symmetries & Laws):** *(If Step 1a = No)*
      *   **Question 2a (Symmetry Check):** Same as Step 2a.
      *   **Question 2b (Symmetry Check):** Same as Step 2b.
      *   **Question 3a (Law Formulation Check):** Same as Step 3a.
      *   **Verdict:**
          *   If **1a = No** AND **2a = Yes** AND **2b = Yes** AND **3a = Yes**, then **`Relationist`**. (No spacetime entities + symmetries hold + laws use relations).
          *   If **1a = No** BUT (**2a = No** OR **2b = No** OR **3a = No**), then **`Not Determinable`** (Potential contradiction - ontology suggests relationism, but symmetries/laws need more. Theory might be incomplete or require "absolute" structures).
          *   If **1a = No** BUT (**2a = No** OR **2b = No** OR **3a = No**) in a way suggesting hidden substantivalism, *Flag Major Judgment Call*. Output **`Relationist`** *provisionally* (based on ontology) but note the tension strongly.
      *   **Termination:** Verdict reached here if conditions met.
      *   **Judgment Call:** Same as Step 2. Can the laws *really* be formulated without *any* implicit geometric background? *Flag if critical/contested.*

  4.  **Resolve Ambiguity/Under-specification:** *(If Step 1a = Unclear/Ambiguous/Not Specified)*
      *   **Verdict:** **`Not Determinable`**. The fundamental ontological commitment is unclear. A classification cannot be reliably made based on the given description. (This is where claims of "verbal dispute" often land if the ontology isn't pinned down).
      *   **Termination:** Verdict reached here.
      *   **Judgment Call:** Determining if the ontology *is* underspecified requires judgment. *Flag this assessment.*

  **Running the Procedure on Test Cases:**

  **Case 1: Newtonian Mechanics (Absolute Space + Bucket)**
  *   **Step 1a:** **YES.** Newton explicitly posits absolute space (points/regions) as an independent, irreducible entity existing regardless of matter. (Bucket *illustrates consequences* - inertia depends on acceleration *wrt absolute space* - but the *proof* is the ontological commitment).
  *   **Step 2:**
      *   2a (Shift): **NO.** Shifting all matter uniformly in absolute space is a different state (different absolute positions).
      *   2b (Rotation): **NO.** Spinning all matter (like the water in the bucket) is a different physical state with measurable effects (concave water surface). The bucket proves **2b=No** is *empirically significant*.
      *   3a (Laws w/o Absolutes): **NO.** Newton's Second Law (`F=ma`) requires absolute acceleration (`a`).
  *   **Verdict:** **`Substantivalist`** (Clear case, no judgment flags needed).

  **Case 2: Leibniz-style Relationalism**
  *   **Step 1a:** **NO.** Only bodies (monads or material points) and their relative distances, angles, and motions exist. Spacetime points/regions are not fundamental entities.
  *   **Step 3:**
      *   2a (Shift): **YES.** Uniformly shifting all bodies changes nothing relational.
      *   2b (Rotation): **YES.** Uniformly rotating all bodies changes nothing relational.
      *   3a (Laws w/o Absolutes): **YES (Aimed for).** Laws are formulated using relative distances, relative velocities, relative accelerations only (e.g., `F = m * d²(r_ij)/dt²` where `r_ij` is distance between i and j).
  *   **Verdict:** **`Relationist`** (Clear case, no judgment flags needed). The bucket scenario wouldn't distinguish true rotation from no rotation in this pure relational world; rotation is just relative motion between parts.

  **Case 3: Dynamical Geometry (e.g., General Relativity - Vacuum Solution)**
  *   **Theory:** Spacetime geometry (metric tensor `g_μν`) is dynamical and governed by Einstein's Equations. Consider a vacuum region (no matter/energy fields present).
  *   **Step 1a:** **MAJOR JUDGMENT CALL.** Does the metric field `g_μν` count as an "independent, irreducible entity" over and above bodies/fields? *It has degrees of freedom, evolves dynamically, and can exist without matter.* Most philosophers/physicists lean **YES** (it's a physical field inhabiting spacetime). *FLAG THIS JUDGMENT CALL.*
  *   **Step 2 (Assuming 1a=Yes):**
      *   2a (Shift): **PROBLEM.** "Shift" is ambiguous in curved/dynamic spacetime. Global symmetries like Galilean/Newtonian boosts don't generally hold (diffeomorphism invariance is different).
      *   2b (Rotation): **PROBLEM.** Same ambiguity. *FLAG - Symmetry checks as framed (Leibniz shifts/rotations) are poorly defined for GR. We rely on ontology and law formulation.*
      *   3a (Laws w/o Absolutes): **NO.** Einstein's Equations fundamentally govern the metric tensor `g_μν`. They cannot be stated solely using relations *between bodies* (especially in vacuum, where there *are* no bodies!).
  *   **Verdict:** **`Substantivalist`** (Based on Flagged Judgment Call in 1a and Law Formulation 3a=No). *This challenges your initial assumption.* Mentioning geometry isn't automatically substantivalist (e.g., Newtonian mechanics *in inertial coordinates* mentions Euclidean geometry but is substantivalist because of the underlying absolute space). However, if the geometry is itself a *dynamical entity* in the ontology (like `g_μν` in GR), it pushes strongly towards substantivalism ("metric essentialism" or "manifold substantivalism"). The procedure flags the key ontological judgment call.

  **Addressing "Verbal Dispute":**
  *   The procedure outputs `Not Determinable` (Step 4) *only* if the fundamental ontology is truly ambiguous or underspecified. If the ontology is clear (Step 1a Yes/No), and the symmetry/law checks align (Steps 2/3), the verdict is clear. If the ontology is clear but symmetry/law checks conflict (e.g., 1a=Yes but 2a=Yes & 2b=Yes & 3a=Yes), it outputs `Not Determinable` because the theory seems inconsistent or misdescribed. Calling it *always* a verbal dispute **is a cop-out** if the ontology is specified. The procedure forces clarity on the ontological commitment first.

  **What the Procedure Can't Do (Limitations):**

  1.  **Hybrid/Non-Standard Theories:** It struggles with theories that genuinely blur the lines (e.g., some interpretations of Quantum Gravity, "Structural Realism" applied to spacetime). It will likely output `Not Determinable` or require heavily flagged judgment calls.
  2.  **Under-specified Theories:** If a student's description is too vague (common in essays!), Step 4 (`Not Determinable`) is the only honest answer. The procedure can't invent ontological commitments.
  3.  **Misinterpretation of "Geometry":** It relies on correctly identifying whether a geometric structure (metric, connection) is part of the fundamental furniture (ontology) or just a description of relations. Misjudging this leads to errors (as flagged).
  4.  **"Substantivalism" as a Family:** The procedure treats "Substantivalist" as a single category. It doesn't distinguish between:
      *   **Manifold Substantivalism:** Spacetime points exist independently.
      *   **Metric Substantivalism (Metric Essentialism):** Only the metric field exists independently (points lack identity).
      *   **Sophisticated Substantivalism:** Points exist, but only identifiable via matter.
      The verdict `Substantivalist` covers all these, though the symmetry checks (Step 2) might hint at distinctions (e.g., Sophisticated might allow Leibniz shifts as representing the same state *by definition*). Flag if specific subtype is relevant.
  5.  **Deep Philosophical Nuance:** It provides a classification tool, not a deep philosophical resolution of the debate (e.g., the Hole Argument). Judgment calls flagged indicate where deeper issues lie.

  **Key for Grading:**
  1.  **Identify Core Ontology:** What does the student say *fundamentally exists*? (Step 1a).
  2.  **Check Symmetry/Law Consistency:** Do they address whether shifts/rotations change the state? (Steps 2a/2b). Can laws be stated relationally? (Step 3a).
  3.  **Follow the Path:** Apply the procedure based on their stated ontology and reasoning.
  4.  **Flag Judgment Calls:** Be explicit in feedback where interpretation was needed (e.g., "I interpreted your description of X as committing to spacetime points, which is a judgment call").
  5.  **Accept `Not Determinable`:** If their description is genuinely ambiguous or contradictory, this is the correct output. Reward students who identify this correctly.

  This procedure prioritizes ontology, uses symmetries/laws as cross-checks, explicitly flags subjective steps, provides clear termination points, and handles edge cases like dynamical geometry and under-specification. It should make your grading faster, more consistent, and defensible.
