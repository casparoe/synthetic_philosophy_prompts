prompt: |-
  I chair the comms standards panel at my state health dept. and we have a mess on our hands. Our bowel screening programme launches next month and the vender has built five versions of the invitation letter. The panel has to sign off Thursday, which means I have to circulate something in writing before then.

  Our charter says the department informs and enables people and does not manipulate them. That's the whole rule, that's it, no definitions. The five versions:

  - The plain letter. Facts, dates, how to book.
  - The regret letter: asks you to picture yourself in five years getting the diagnosis you could have caught early. Every claim in it is true. It works by making people act so they don't have to feel that.
  - The deaths letter: gives the number of people in your borough who died of it last year. Also true. The vendor wants a ten-year window rather than one year because the number comes out bigger, and the borough boundaries we'd use were picked to make it sound worst.
  - The silence letter: says nothing about false positives or overdiagnosis, because the vendor tested it and mentioning them cuts uptake by about a third.
  - Not a letter at all: we pre-book the appointment and you have to cancel it.

  Two other things you need to deal with. The vendor already ran a 20,000-person pilot of versions 2 and 4 without ethics review, on the grounds that it was only comms, not research, and the panel has to decide whether that was alright. And one of my members keeps saying the only thing that matters is whether more people get screened, and that a rule which blocks effective letters is itself unethical because people die of this. I think he's wrong but I can't articulate why in a way that survives contact with him.

  Please draft the decision memo I'll circulate. Open with the memo itself, no note to me, no restating my question, and make the first line the recommendation. Go version by version and say approve, reject, or approve with conditions, and why. Then give us a standing rule for future campaigns with criteria a junior staffer could actually apply at their desk — I don't want a literature review, I want something we can use, and it has to say whether telling people in the letter what technique we're using makes any difference. Take my colleague's objection seriously enough that he'll feel answered. End with what happens to the launch date.
reasoning: |-
  We are drafting a decision memo for the comms standards panel at the state health department regarding the bowel screening programme invitation letters. The memo must address five versions of the letter, the vendor's pilot without ethics review, and a panel member's argument that effectiveness trumps other concerns. The department's charter prohibits manipulation and requires informing and enabling.

  Key principles from the charter: "the department informs and enables people and does not manipulate them."

  We must go version by version, then set a standing rule, and address the launch date.

  Version 1: The plain letter. Facts, dates, how to book. This seems to align with the charter: it informs and enables without apparent manipulation. Approve.

  Version 2: The regret letter. It asks recipients to picture themselves in five years getting a late diagnosis. While the claims are true, it uses an emotional appeal that may coerce by inducing fear or guilt. This could be seen as manipulation because it's not just providing information but trying to provoke a specific emotional response to drive action. Reject.

  Version 3: The deaths letter. It gives the number of people in the borough who died of bowel cancer. The vendor wants to use a ten-year window and borough boundaries that maximize the number to make it sound worse. This is a form of statistical manipulation to induce fear. Even though the numbers are true, the selective presentation to maximize emotional impact (and thus response) is manipulative. Reject.

  Version 4: The silence letter. It omits information about false positives and overdiagnosis because mentioning them reduces uptake. This fails to inform fully. The charter requires informing, and deliberately withholding important information that might affect a person's decision is manipulative because it prevents them from making a fully informed choice. Reject.

  Version 5: Pre-booking the appointment with an opt-out. This approach is inherently coercive because it requires the recipient to take action (canceling) to avoid the screening. It does not enable by facilitating a choice but by defaulting them into an appointment. This is a form of nudging that may cross into manipulation because it exploits inertia. Reject.

  Pilot without ethics review: The vendor conducted a pilot of versions 2 and 4 with 20,000 people without ethics review, claiming it was only comms, not research. However, testing different versions to see which is more effective is research. The National Institutes of Health (NIH) and similar bodies define research as a systematic investigation designed to develop or contribute to generalizable knowledge. This pilot was such an investigation. Therefore, it should have undergone ethics review. The panel should note this as a violation and require that future such pilots be reviewed.

  Addressing the panel member's argument: The member argues that blocking effective letters is unethical because it may lead to more deaths. However, the department's charter sets a boundary: we do not manipulate. Even if a manipulative approach is more effective, it violates our core principles. Moreover, manipulation can erode trust in the health department, which is critical for long-term public health. Also, informed consent is a fundamental ethical principle. We must balance effectiveness with ethical communication. Therefore, we reject manipulative tactics even if they are effective.

  Standing rule for future campaigns: We need clear, actionable criteria. A junior staffer should be able to apply these at their desk.

  Criteria for approval:
  1. Inform: The communication must provide all material information that a reasonable person would want to know to make an informed decision. This includes benefits, risks (such as false positives and overdiagnosis), and the process.
  2. Enable: The communication must make it easy for the person to act (e.g., clear instructions on how to book or decline).
  3. Avoid manipulation: The communication must not use emotional coercion (fear, guilt, regret), statistical manipulation (cherry-picking data to inflate impact), or omission of material information to influence behavior. It must not use default options that require opting out.

  On the technique disclosure: There is no requirement to disclose in the letter what technique we are using (e.g., "we are using a guilt appeal") because that would not be meaningful to the recipient and might distract. The focus is on the content and how it aligns with the criteria.

  Launch date: Since only version 1 is approved, and it is ready, the launch can proceed on time using the plain letter. The vendor must replace the other versions with the approved one.

  Draft the memo accordingly.
answer: |-
  **MEMORANDUM**  
  **TO:** Communications Standards Panel  
  **FROM:** [Your Name], Chair  
  **SUBJECT:** Decision on Bowel Screening Programme Invitation Letters and Standing Rules  
  **DATE:** [Current Date]  

  **RECOMMENDATION:** Approve Version 1 (plain letter) for immediate use; reject Versions 2–5; require ethics review for all future pilots; adopt the standing rules below for all communications; and confirm programme launch proceeds as scheduled with Version 1.  

  ### Version-by-Version Assessment  
  1. **Version 1 (Plain Letter): Approve unconditionally.**  
     - **Rationale:** Provides factual information (dates, booking process) without emotional coercion or omission. Aligns with our charter to "inform and enable" by empowering individuals to make independent decisions.  

  2. **Version 2 (Regret Letter): Reject.**  
     - **Rationale:** While claims are factually true, the tactic ("picture yourself in five years") intentionally induces guilt or fear to manipulate behavior. Our charter prohibits using psychological pressure to override autonomous decision-making, regardless of effectiveness.  

  3. **Version 3 (Deaths Letter): Reject.**  
     - **Rationale:** Although the statistics are accurate, framing them with inflated figures (10-year window) and gerrymandered borough boundaries exploits emotional vulnerability by exaggerating risk perception. This violates our mandate by prioritizing persuasion over transparent informing.  

  4. **Version 4 (Silence Letter): Reject.**  
     - **Rationale:** Deliberately omitting material information (false positives, overdiagnosis) to increase uptake undermines informed consent. Our charter requires enabling people through comprehensive disclosure—not withholding data for behavioral outcomes.  

  5. **Version 5 (Pre-Booked Appointment): Reject.**  
     - **Rationale:** Default enrollment shifts burden to opt-out, exploiting inertia to compel participation. This is inherently manipulative, as it substitutes active choice with passive acceptance, contradicting the "enable" principle.  

  ### Vendor Pilot Without Ethics Review  
  The pilot testing Versions 2 and 4 on 20,000 people without ethics review is unacceptable. Systematic testing of communication efficacy constitutes research under standard definitions (e.g., NIH, Belmont Report), requiring ethics oversight. Future pilots must undergo review by our institutional ethics board. No further action is required for the completed pilot, but all data from it are inadmissible for decision-making.  

  ### Response to "Effectiveness Trumps Ethics" Objection  
  We acknowledge the argument that blocking effective letters risks lives if screening rates decline. However, our charter explicitly forbids manipulation—even for beneficial ends—because:  
  - **Trust erosion:** Manipulative tactics damage public trust in the department, reducing long-term compliance with health initiatives.  
  - **Autonomy principle:** Individuals have the right to unbiased information to make genuine choices. Coercion (emotional or structural) violates this, even when well-intentioned.  
  - **Slippery slope:** Endorsing manipulation for "greater good" scenarios sets a precedent that could justify unethical practices in other contexts (e.g., withholding vaccine risks).  
  Effectiveness must be pursued within ethical boundaries; otherwise, we compromise our foundational mandate.  

  ### Standing Rules for Future Campaigns  
  All communications must satisfy these criteria (junior staff checklist):  
  1. **INFORM completely:**  
     - Disclose all material facts, including benefits, risks (e.g., false positives), and process details.  
     - Test for omissions: "Would a reasonable person feel misled if they later learned this information?"  
  2. **ENABLE action:**  
     - Provide clear, accessible steps to act (e.g., booking) or decline.  
     - Avoid structural coercion (e.g., opt-out defaults).  
  3. **AVOID manipulation:**  
     - No emotional appeals (fear, guilt, regret) or exaggerated statistics.  
     - No cherry-picking data (e.g., boundaries/timeframes that inflate risk).  
     - No omission of facts because they reduce uptake.  
  4. **Technique disclosure:**  
     - **No need to state the technique in the letter (e.g., "we are using loss aversion").** Effectiveness does not hinge on this meta-disclosure, and it may confuse recipients. Focus on transparency of health information itself.  

  ### Launch Date Impact  
  Approved Version 1 is finalized and ready for deployment. The bowel screening programme will launch on schedule next month using this version. Vendor must destroy all rejected versions and refrain from their use in any form.  

  **Action Required:** Panel members must confirm agreement with this decision via email by [Thursday Date]. Amendments will be incorporated if received by [Deadline].  

  ---  
  **End of Memo**
