prompt: |-
  I'm doing a part-time health law conversion course and I keep getting stuck on advance directives — the living-will type forms where you write down, while you're still compos mentis, what treatment you'd want if you later lose capacity. The bit doing my head in isn't the seminar stuff about autonomy versus best interests, it's the actual paperwork. My aunt is a ward clerk at a district general and she showed me (heavily redacted) the standard form her trust uses. Part 1 is a refusal section: you can write that you don't want antibiotics for a chest infection, or don't want to be admitted to hospital at all, and if it's valid and applicable the team has to follow it even if you are now sitting up in bed cheerfully asking for the antibiotics and they would save your life. Part 2 is a preferences section: you can write that you'd like a bed in a home near your sister, or that you want your daughter in the room, and the form says in as many words that this part is not legally binding and will be taken into account. Same document, same signature, same afternoon — binding when it says no, a polite suggestion when it says yes. Meanwhile a friend of mine with bipolar has the opposite setup. Her crisis plan says, in effect, if I stop taking the lithium and start getting grand and sleepless, admit me, and the team do lean on that heavily; but when she's unwell and refusing, they detain her anyway and explain that the refusal is the illness speaking rather than her, which is the same move in reverse — the present self disqualified, the earlier self trusted. And I notice that in the dementia case everyone says the earlier self is the real one because the later one is compromised, and in her case everyone says the later self is the illness because the earlier one is compromised, and nobody seems bothered that these two arguments are mirror images.

  What I want to know is what this practice actually presupposes. It looks to me as if the whole apparatus assumes there are two people in one body — the one who signed and the one now living in it — and that some procedure can identify which of them is the real one. Is that right, or am I reading philosophy into admin? If it is right, which theory of the person does it commit to, and which rival views does it quietly rule out? If it's not right, can the asymmetry be explained with no view about identity at all — something about a refusal being a permission and a request needing someone to actually do something, or about who carries the burden of proof, or about the earlier self having no idea what the later state is like because she has never been in it? Reconstruct the implicit theory as charitably as you can, then tell me honestly which parts the practice strictly presupposes and which parts it merely fits nicely with, and where it's underdetermined so that two or three different theories would all license the same form. Then tell me what would have to change in the paperwork and on the ward if we replaced the implicit view with (a) the present self always wins, (b) the earlier self binds absolutely, or (c) a story-based view on which the person is whoever can still make sense of the whole life. Please write it in British English and skip the lecture on autonomy versus best interests, I've had that one twice. No reading lists or citations, I just want the argument.
reasoning: |-
  Okay, let's tackle this user's query. They're struggling with the asymmetry in advance directives—specifically why refusals are binding while preferences aren't, and how this relates to identity over time. They mention their aunt's form and a friend with bipolar, pointing out what seems like a contradiction: in dementia, the earlier self is trusted, but in bipolar, the later self is seen as ill. They want to know the underlying presuppositions of this practice.

  First, I need to unpack the legal and practical aspects of advance directives. The binding nature of refusals comes from the right to refuse treatment, a fundamental legal principle. Preferences, however, aren't enforceable because they require positive action from others, which isn't mandated. That explains the asymmetry without necessarily invoking identity theories. 

  But the user is also highlighting a philosophical tension. In dementia cases, the competent prior self's decisions are upheld, while in bipolar, during a manic episode, the current refusal is overridden in favor of the prior competent self's directive. The user sees this as a mirror image: sometimes the earlier self is authentic, sometimes the later one is, but the criteria seem inconsistent. 

  The key here is the concept of decisional capacity. The practice presupposes that capacity can be assessed objectively. When someone creates an advance directive, they're assumed competent. Later, if they lack capacity, their prior refusal stands. For the bipolar example, during a manic episode, the person is deemed to lack capacity, so their prior request for hospitalization is followed. The underlying principle isn't about two selves but about capacity at the time of the decision. 

  The user questions if this implies two persons in one body. Instead, the practice relies on a "single person with varying capacity" model. The identity remains continuous, but the ability to make decisions fluctuates. The law protects autonomy through prior refusals but doesn't enforce positive requests because that could impose duties beyond non-interference. 

  The user also asks about alternative theories. If the present self always wins, advance directives would be irrelevant, leading to potential harm during incapacity. If the earlier self binds absolutely, it risks ignoring current suffering or changed circumstances. A narrative view might prioritize life coherence but would be complex to implement legally. 

  The ward practices would change under each theory. For instance, always following the present self might require more crisis interventions, while binding the earlier self could lead to rigid, potentially inhumane care. The narrative approach might involve more subjective assessments, increasing legal ambiguity. 

  In summary, the current system presupposes a continuous identity with varying capacity, prioritizing negative autonomy (refusals) over positive claims (requests). It doesn't require a specific theory of personal identity but relies on capacity assessments and legal principles to manage practical and ethical challenges.
answer: |-
  Right, let's cut through the admin to the bones of the presupposition. You're spot-on about the asymmetry, and it *does* hinge on a specific, operational view of the person – but it's more about *capacity* and *legal boundaries* than full-blown philosophical identity. Here's the reconstruction:

  **The Implicit Presupposition & Its Charitable Reconstruction:**

  1.  **One Person, Fluctuating Capacity:** The core presupposition isn't "two people," but **one continuous person whose *decisional capacity* (the ability to understand, weigh, and communicate decisions) can be present or absent at specific points in time.** The "real" person isn't one self *over* another; the person *is* continuous. What matters is *when* they had the capacity to make a specific, legally significant decision.
  2.  **Capacity as the Gatekeeper to Binding Refusals:**
      *   **Refusals (Part 1):** A valid refusal made *when capacity was present* binds professionals *when capacity is absent*. Why? Because the right to refuse treatment is fundamental (& negative - "don't touch me"). Upholding a competent refusal respects the *autonomy exercised at the point of capacity*, even if the *embodied person* later seems to want differently. The later expression isn't seen as the voice of a "new self," but as the voice of the *same person lacking the capacity* to make that specific decision *now*. The "illness speaking" (in bipolar or dementia) *is* the person *without capacity*.
      *   **Preferences (Part 2):** These are positive requests ("do this for me"). They *cannot* be binding because:
          *   They require *someone else's positive action* (resources, staff time, accommodation).
          *   They might be impossible to fulfil (no bed near sister).
          *   They might conflict with clinical judgment or resource allocation.
          *   Crucially, the law protects *negative liberty* (freedom *from* interference) far more robustly than it enforces *positive claims* on others. The form accurately reflects this legal reality. Signing it doesn't magically create an enforceable positive right.
  3.  **The Asymmetry Explained (Without Needing Identity Theory):**
      *   **Burden of Proof & Harm:** Refusing treatment risks immediate, irreversible harm (death from untreated infection). The law places a very high burden on overriding a competent refusal. Granting a positive request carries no comparable *risk of harm* if not fulfilled (though it might cause distress). The burden is lower.
      *   **Nature of the Act:** A refusal is a *permission withdrawal* (from treatment). It's self-executing in its *prohibition*. A request is an *appeal for action*. It requires external cooperation and resources.
      *   **Knowledge Gap (Secondary):** While sometimes argued ("you didn't know how bad it would feel"), the *primary* reason isn't epistemic uncertainty. It's the legal weight given to a competent refusal *as an expression of autonomy* at the time. The system trusts the *competent decision-maker*, not because they perfectly foresaw the future, but because they were competent *then*.

  **What the Practice Strictly Presupposes:**

  *   **The Concept of Decisional Capacity:** That it can be reliably(ish) assessed and is present/absent at specific times.
  *   **A Continuous Legal Person:** The refusal signed by Person A at Time 1 binds the treatment of Person A at Time 2. Identity continuity is legally assumed.
  *   **The Primacy of Negative Liberty:** The right to *refuse* bodily intrusion is so strong that a competent refusal must be respected even when capacity is lost. Positive requests lack this fundamental legal status.
  *   **That Capacity Loss Can Distort Wishes:** The "later self" expressing contradictory wishes *during incapacity* is not exercising valid autonomy; it's seen as a manifestation of the incapacity itself (whether dementia, mania, or acute illness).

  **What It Fits Nicely With (But Doesn't Strictly Require):**

  *   **Lockean "Person" as Consciousness/Memory:** The idea that the "real" person is the one with the continuous narrative thread of consciousness/memory. The advance directive is made by that "thread"; incapacity breaks the thread, so the prior wishes stand. This fits the dementia case well, less so the bipolar where the "thread" feels continuous to the ill person.
  *   **Hierarchy of Selves:** An implicit weighting of the *competent* self over the *incapacitated* self, regardless of temporal order. The competent self gets the casting vote.

  **Where It's Underdetermined (Multiple Theories Possible):**

  *   **Psychological Continuity Theories:** The practice works if we see identity as continuity of psychological traits/memories/intentions. The advance directive represents the competent psychological state.
  *   **Bodily Continuity Theories:** It also works – the same body, the same legal person. The directive is a prior instruction from that body's occupant.
  *   **Simple Legal Personhood:** It works purely on the legal fiction of continuous personhood without deep metaphysics. The law says "this signature binds this body later."

  **Changing the Paperwork & Ward Practice:**

  **(a) Present Self Always Wins:**
  *   **Paperwork:** Scrap Part 1 (Refusals) entirely. Part 2 (Preferences) stays advisory. Add a prominent disclaimer: "Your current wishes at the time of treatment will always override any prior instructions."
  *   **Ward:** Advance directives become irrelevant historical documents. Teams would *only* act on the patient's current expressed wishes, however irrational or dangerous they seem *if* the patient *appears* communicative (leading to potentially harmful refusals during incapacity being followed). Detention under the Mental Health Act for psychiatric cases would be *much* harder to justify if the patient is currently refusing, even if manic. "Best interests" would dominate when current wishes couldn't be ascertained, but the powerful tool of prior refusal would vanish.

  **(b) Earlier Self Binds Absolutely (Including Requests):**
  *   **Paperwork:** Remove the "not legally binding" disclaimer from Part 2. Redraft as enforceable commands: "You MUST provide a bed near my sister," "You MUST admit me if I exhibit X symptoms." Refusals section remains binding.
  *   **Ward:** Chaos. Teams would be legally compelled to fulfil impossible or clinically inappropriate requests ("admit me to ICU for a cold"). Resources would be tied up meeting specific demands. Clinicians could be sued for not finding that specific care home bed. The "preferences" section would become a minefield of unenforceable mandates. Detention under mental health law based on a prior request might be easier, potentially overriding *any* current refusal during illness.

  **(c) Narrative/Story-Based View:**
  *   **Paperwork:** Radically different. A single narrative section: "Tell us the story of your life, values, fears, and what a 'good' outcome means for you in severe illness/incapacity." Specific refusals/requests would be *examples* illustrating the narrative, not binding commands. The form would emphasise, "This helps us understand *who you are* to make decisions *with* you or *for* you that fit your story."
  *   **Ward:** Judgment-heavy. Teams (or a designated decision-maker) would constantly interpret the narrative against the current situation. *Is* the person with advanced dementia still "in" their story such that current expressions matter? *Does* the manic episode represent a break in the coherent narrative? Conflicts would arise over narrative interpretation ("She valued independence, but *this* refusal feels like the illness, not her"). Detention decisions would hinge on whether the refusal "fits" the life story or represents a "break." Far less legal certainty, more scope for dispute, but potentially more nuanced decisions aligned with the person's essence. Capacity assessment becomes intertwined with narrative coherence.

  **In essence:** The current asymmetry isn't primarily a metaphysical claim about two selves. It's a *pragmatic legal and ethical framework* built on the rock of bodily autonomy (hence binding refusals), the reality of fluctuating capacity, and the weaker legal status of positive claims (hence non-binding requests). It presupposes that a competent "then" trumps an incapacitated "now" *only* for the specific purpose of *refusing* treatment, because saying "no" requires nothing from others but non-interference. Changing this core would fundamentally alter the balance between autonomy, protection, and practical healthcare delivery.
