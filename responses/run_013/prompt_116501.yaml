  I do not have a background in philosophy or decision theory, but I have been thinking about the absent-minded driver problem. As I understand it, a driver on a highway passes two exits and cannot remember whether he has already passed the first. He wants to take the second exit, and the advice is to continue at the first exit and exit at the second. But why is this a paradox? At any exit, he can simply ask himself: given that I am at an exit, what is the probability that this is the second exit? Then he can decide whether to exit or continue by comparing expected values. That seems like a standard decision under uncertainty, not a special problem. What am I missing? Please correct my misunderstanding and explain what the problem is actually about. Answer in American English.
