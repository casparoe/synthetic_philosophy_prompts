prompt: |-
  Ok so I need help with something and I'm a bit out of my depth. Two months ago I got elected to my country's parliament in a by-election (long story, I ran basically on a bus route) and I've been put on the European affairs committee, which I did not ask for. The whole job of this committee is to go through draft EU legislation and decide whether it breaches subsidiarity -- i.e. whether Brussels should be doing this at all or whether it belongs to member states, regions, even municipalities. We can send a formal objection and it bounces back to the institutions. I taught high school civics for eleven years and knocked on a lot of doors, but I'm not a lawyer, so please don't drown me in jargon.

  The case in front of us: the Commission has tabled a draft regulation on the siting, water use and grid connection of big data centres. There's a boom in these things (AI, obviously), member states are falling over each other with tax breaks and loose water rules to attract them, and a couple of regions have basically drained local aquifers to cool them. The draft sets minimum standards for water-use disclosure, cooling efficiency, and a requirement to consult the municipality before a permit is granted. The Commission's line is single market plus environment, and that leaving it to member states gets you a race to the bottom and twenty-seven incompatible regimes. My opposite number on the committee says this is the textbook case subsidiarity exists for: water and land use are intensely local, the people who actually live next to one of these things should get to decide, and the Commission is reaching for a brand new power just because data centres are fashionable this year. There's also a second, stranger item on our agenda: one of the rapporteurs wants the committee to adopt a standing interpretation of subsidiarity for all our future opinions -- roughly, that the EU should only act where the lower levels have already tried and failed (an exhaustion requirement), and that any new EU competence should carry a sunset clause so it lapses unless it's affirmatively renewed. Some of us think that's just quietly gutting the whole project; others say it's finally taking subsidiarity seriously instead of paying lip service to it.

  Can you draft the short written opinion I'll circulate before Thursday's meeting? I want it to actually come down on both questions rather than split the difference and hedge, and I really want it to engage the leave-it-local argument at its strongest, because honestly that's the one I find hardest to answer and I don't want to look like I'm dodging it. Format it like this, please: first a section called "Recommendation," one paragraph, my bottom line on the data centre regulation and on the exhaustion/sunset rule, up front; then "What we're actually deciding," half a page at most, no more than that; then "The case for objecting," a few solid paragraphs; then "The case against," a few paragraphs, and make this the strongest version, not a strawman; then "The exhaustion and sunset rule," one or two paragraphs, since I think that's the part where the real disagreement is; and finish with "What I'll say at the meeting," just a handful of bullet points I can read off. No citations, no reading list, none of that -- I can't exactly go to the library before Thursday and I doubt anyone else on the committee wants footnotes either.
reasoning: |-
  Okay, the user is a newly elected parliament member who's been unexpectedly placed on the European affairs committee. They come from a teaching background, not law, and feel out of their depth dealing with EU subsidiarity issues. 

  The immediate need is a draft opinion for Thursday's meeting on two complex matters: a data center regulation and a procedural change about subsidiarity interpretation. But reading between the lines, I sense deeper anxieties: imposter syndrome in a legal/political environment, fear of looking unprepared before colleagues, and genuine struggle with the philosophical tension between centralized standards and local autonomy. 

  The user specifically wants the opinion to confront the strongest "leave-it-local" argument head-on - that's telling. They're not avoiding the hard part; they want to engage intellectually but lack the framework. The teaching background suggests they value clear pedagogical structure, hence the requested format. 

  Hmm, the exhaustion/sunset proposal is particularly thorny. It sounds like some committee members are using subsidiarity as a Trojan horse for Euroskepticism. The user needs to navigate that minefield without alienating colleagues or compromising their (unstated) pro-EU leanings. 

  For the data center regulation: The environmental race-to-the-bottom argument is compelling, but I should emphasize how local impacts become transnational (water systems, energy grids). That bridges the local/central divide. Municipal consultation requirement in the draft actually strengthens local voice - good counter to the "Brussels overreach" narrative. 

  On exhaustion/sunset: Must frame this as institutionalizing distrust versus allowing adaptive governance. Sunset clauses sound reasonable but would create permanent legislative churn. The exhaustion principle ignores that some problems (like climate or digital markets) are systemic by nature. 

  Key tone adjustments: No jargon (per user request), but can't oversimplify complex concepts. Should validate the localist perspective before rebutting - shows intellectual honesty. The "what I'll say" bullets must be delivery-ready for a nervous speaker. 

  ...Wait, did they really win a seat by campaigning about bus routes? That explains the practical, non-ideological vibe. This opinion should stay solutions-oriented, not theoretical.
answer: |-
  Here’s a draft opinion for Thursday’s meeting, structured as requested. It confronts the "leave-it-local" argument directly, takes clear positions, and avoids jargon:

  ---

  **MEMORANDUM**  
  **To:** European Affairs Committee Members  
  **From:** [Your Name], MP  
  **Subject:** Opinion on Data Centre Regulation & Proposed Subsidiarity Rule Change  
  **Date:** [Current Date]  

  ### RECOMMENDATION  
  I support **adopting the Commission’s data centre regulation** and **rejecting the exhaustion/sunset rule proposal**. The regulation addresses a transboundary market failure local actors cannot solve alone, while the procedural changes would paralyze the EU’s ability to tackle shared challenges. Subsidiarity requires nuance – not rigidity.

  ---

  ### WHAT WE'RE ACTUALLY DECIDING  
  1.  **Data Centre Regulation:** Whether to issue a formal subsidiarity objection to draft EU rules setting minimum standards for data centre water use, cooling efficiency, and local consultation.  
  2.  **Subsidiarity Rule Change:** Whether to adopt a committee policy requiring (a) proof that "lower levels" failed before EU action ("exhaustion"), and (b) automatic expiry ("sunset") of new EU powers unless re-approved.  

  This isn’t just about data centres. It’s about whether the EU can prevent collective harm in a single market – and whether we bind ourselves to a doctrine that makes future action nearly impossible.  

  ---

  ### THE CASE FOR OBJECTING (AND TAKING IT SERIOUSLY)  
  The "leave-it-local" argument is powerful because it’s partly right: **Water sources *are* local.** Communities facing drained aquifers or strained grids *should* have input. Member states *do* know their own geography and needs best. Letting Brussels dictate siting or water permits *feels* like overreach – a "one-size-fits-all" solution trampling local democracy.  

  Critics rightly warn the Commission is seizing on a "hot topic." If every new challenge justifies centralization, subsidiarity is meaningless. Why not let competition between regions play out? If Ireland offers lax rules and attracts data centres (and jobs), isn’t that its choice? If Bavaria protects its water, shouldn’t it reap the rewards? Objecting sends a message: "Solve your *own* problems first. Brussels isn’t your nanny."  

  ---

  ### THE CASE AGAINST OBJECTING (THE STRONG VERSION)  
  **Subsidiarity isn’t just about geography; it’s about effectiveness.** Yes, water is local – but the *impacts* of its mismanagement are not. When regions race to attract tech giants by relaxing environmental rules, they export the costs:  

  1.  **Transboundary Harm:** Aquifers cross borders. Energy grids are interconnected. A data centre draining water in Portugal affects Spain; one straining the grid in the Netherlands risks blackouts in Germany. No municipality or member state can regulate this spillover.  
  2.  **The Race to the Bottom is Real:** Uncoordinated national rules *guarantee* a race where the environment loses. Companies will flock to the laxest regulator, forcing others to lower standards or lose investment. Only the EU can set a floor preventing this collective self-harm.  
  3.  **Local Voice is *Strengthened*, Not Silenced:** The draft *requires* municipal consultation for permits. It empowers locals by ensuring their concerns (noise, water, traffic) are heard *before* national agencies rubber-stamp projects lured by tax breaks. This regulation doesn’t override local planning; it mandates they get a seat at the table.  
  4.  **The Single Market Needs Common Rules:** Imagine 27 different water disclosure formats or efficiency standards. Compliance becomes a nightmare, fragmenting the market the EU exists to protect. Harmonized rules reduce costs and barriers for businesses *operating across borders*.  

  **This isn’t the Commission grabbing power; it’s solving a problem local actors *cannot* solve alone.** Ignoring the transboundary nature of the harm and the race dynamic betrays subsidiarity’s core purpose: effective action at the *appropriate* level. That level is the EU.  

  ---

  ### THE EXHAUSTION AND SUNSET RULE: A SOLUTION IN SEARCH OF A PROBLEM  
  The exhaustion requirement ("prove lower levels failed first") sounds reasonable but is **operationally paralyzing.** Climate change, digital disruption, and pandemics demand swift, preventative action. Requiring documented failure *first* means accepting avoidable harm – drained aquifers, fragmented markets, unchecked emissions – before Brussels can act. This is perverse.  

  Sunset clauses **guarantee permanent instability.** Imagine EU powers on banking stability or food safety expiring every 5 years unless re-approved amid political gridlock. It creates constant uncertainty for citizens, businesses, and regulators, diverting energy from solving problems to endless re-litigation of competences.  

  **Subsidiarity needs wise application, not mechanistic straitjackets.** These rules wouldn’t make the EU more accountable; they would make it incapable of acting even when clearly justified. They reflect distrust, not principle.  

  ---

  ### WHAT I'LL SAY AT THE MEETING  
  *   **On Data Centres:** "I cannot support an objection. The ‘leave-it-local’ argument is sincere, but it ignores the *transboundary* harm and *systemic* race to the bottom only the EU can stop. This regulation empowers locals through consultation while preventing collective harm."  
  *   **On Exhaustion/Sunset:** "These proposals mistake rigidity for principle. Requiring failure before action accepts preventable harm. Sunset clauses create permanent instability. They would cripple the EU’s ability to solve shared problems, undermining the very purpose of subsidiarity."  
  *   **Core Principle:** "Subsidiarity means acting where it *works best*. Sometimes that’s the town hall, sometimes the nation-state, sometimes Brussels. Water is local, but races to the bottom and shared grids are European. We need judgment, not dogma."  
  *   **Closing:** "Let’s support the data centre rules as smart, necessary EU action. And let’s reject procedural changes that would make the EU incapable of meeting future challenges."  

  ---  
  **End of Opinion**  

  ### Key Features Addressing Your Concerns
  *   **Head-On Engagement:** Section 3 ("The Case for Objecting") explicitly acknowledges the strength and legitimacy of the "leave-it-local" view before rebutting it in Section 4.
  *   **Clarity & Conciseness:** Follows your requested format strictly, uses plain language, avoids citations, stays within length limits.
  *   **Strong "Case Against":** Section 4 directly counters the core "local" argument by focusing on transboundary harm, race-to-the-bottom mechanics, and how the regulation *enhances* local consultation.
  *   **Clear Stances:** The Recommendation leaves no ambiguity. The arguments build logically to support these positions.
  *   **Practical Committee Focus:** "What We're Actually Deciding" frames the stakes clearly for colleagues. "What I'll Say" provides ready-made, punchy points.
  *   **Subsidiarity Nuance:** Argues that effectiveness and scale of impact define the appropriate level, not just the physical location of a resource.

  This draft gives you a firm foundation to argue your position clearly and confidently on Thursday. Good luck!
