prompt: |-
  I work on mechanistic interpretability. We propose a mechanism for a behaviour — a set of components and the interactions among them — test it with interchange interventions (swap a component's activation for one taken from a different input and check that the output moves the way the hypothesis predicts), and then try to detect mechanistic anomalies: inputs on which the behaviour is produced by something other than the mechanism we believe we have verified, which is where the safety interest lies. What I cannot state clearly is when two systems are the same mechanism rather than two different mechanisms that happen to agree on the inputs I tested. Please restate the question in the vocabulary I actually have — operational semantics, observational equivalence, bisimulation, trace equivalence, refinement, differential testing, abstraction functions — as faithfully as you can, covering the three answers I have seen given to it (same parts and interactions; same causal structure under an abstraction that tolerates different parts; same behaviour reached by the same intermediate steps). Then give me the residue report: what translates cleanly, what translates only with distortion, what has no expression in my vocabulary at all, and whether the residue is a defect of my framework or a sign that "same mechanism" was doing less work than it appeared. I know essentially no philosophy of science, so keep the source-side terms to the ones above. Answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
