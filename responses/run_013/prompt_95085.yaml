  3. **"Same causal structure under abstraction" translation**: This distorts to refinement via an abstraction function: the hypothesized mechanism's causal dependencies (operational transitions) are preserved in the implementation, but concrete states/parts may differ observably under interventions not covered by the abstraction.
  4. **"Same intermediate steps" translation**: This maps cleanly to observational equivalence of all stepwise traces under interchange interventions, demanding identical internal component activations modulo naming (isomorphism in operational semantics).
