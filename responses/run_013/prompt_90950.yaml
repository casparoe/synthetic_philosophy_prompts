prompt: |-
  Ok so last night I lost two hours to an arguement with my friend Nadia about many-worlds. She's a physicist, her line was that the interpretation is a non-starter because there's no probability in it — everything happens, so "likely" means nothing — and I kept telling her the Everettians have an answer and that the decision-theory derivations aren't question-begging, and about halfway through I realised I couldn't actually lay the answer out in order. Which is bad, because I'm the one running next week's session on it.

  Setup: reading group, six people, mostly metaphysics grad students plus one lapsed physicist. All of them have heard of many-worlds, none of them has done the linear algebra, and all of them think they already know what the problem is. I want you to act like someone who teaches philosophy of physics for a living and has watched a lot of smart people get this exact thing wrong. Don't explain the Born rule problem to me — I know what the problem is. Plan how I should explain it.

  What I need: (1) the order the pieces have to go in, and why that order — i.e. what has to be in place before "so why is there a probabilty at all?" even registers as a question for them, and what I can safely assume they already have. (2) The one example that carries the whole session, what it has to have and not have — I was going to use the cat, or the 99/1 spin against a fair coin, or the trick where you split one branch into two halves that differ only in something irrelevant, so that counting branches gives you 2/3 and the rule gives you 1/2. Tell me which of those carries it, if any, and why not the others. (3) The misconceptions they'll arrive with or form halfway through, and exactly where in the sequence I head each one off — I'm expecting "decoherence is what makes the probabilities", "probability just means counting branches", and at least one person saying probability is just credence so there's nothing here to solve. (4) One question to ask at the end that tells me they've got the shape of the problem rather than a slogan. (5) What I should openly refuse to explain at this level, and what I say to justify the refusal.

  Cap it at 500 words, keep the numbering. Think it through before you start — sketch the dependency order and the candidate examples for yourself before committing, don't just list the standard talking points, and skip the "there are many interpretations of QM" throat-clearing.
reasoning: |-
  Alright, let's tackle this user's query. They need to prepare a session on the Many-Worlds Interpretation (MWI) and the Born rule problem. The user is part of a reading group with metaphysics grad students and a lapsed physicist. The main issue is explaining why probability is a problem in MWI and how Everettians address it without falling into common misconceptions.

  First, I need to establish the correct order of concepts. The user mentioned that participants think they already know the problem, so starting with the basics of MWI is crucial. They must understand superposition and branching via decoherence before even introducing probability. Without that foundation, the question of probability won't make sense. Decoherence explains why worlds seem separate but doesn't solve probability—important to clarify early.

  Next, choosing the right example is key. The user suggested a few options. The Schrödinger's cat might be too familiar and doesn't show amplitude differences. The 99/1 spin against a fair coin is good because it highlights that branch count doesn't match amplitude. The branch-splitting trick (2/3 vs 1/2) could be confusing with artificial splits. Sticking with spin measurements keeps it simple and avoids extraneous details.

  Common misconceptions: equating decoherence with probability creation, counting branches, or reducing probability to credence. These need to be addressed right after explaining decoherence and before introducing the decision-theory approach. Emphasize that decoherence doesn't assign probabilities and that branches have weights, not equal measures.

  For the end question, asking why a rational agent would prefer a high-amplitude branch tests if they grasp that probability comes from rational action given branch weights, not just credence or counting.

  Finally, refusing to dive into technical derivations keeps the session focused. The goal is conceptual understanding, not the math behind it. Justifying this by stating that the aim is to see the problem structure and why solutions aren't question-begging.

  Putting it all together: Start with MWI basics, explain decoherence, highlight the probability problem using the spin/coin example, address misconceptions, introduce decision theory, and end with the key question. Avoid tangents and technical details to stay within scope.
answer: |-
  Here's the structured plan. Dependencies: **Understand superposition → Branching via decoherence → Why *that* creates a probability problem → Why naive solutions fail → How decision theory avoids begging the question.**

  **1. Order of Pieces & Why:**
     - **Start with MWI basics:** Superposition as real multiplicity (use spin: |↑⟩ + |↓⟩ → two outcomes). *Why:* Establish ontology. They must see branching as *unfolding reality*, not "possibilities."
     - **Define "Worlds" via Decoherence:** Explain how environmental interaction *correlates* states, making branches effectively separate (no interference). *Why:* "Worlds" aren't fundamental; they're emergent from the universal wavefunction. **Crucially, decoherence does *not* create probability or "select" a branch.**
     - **Introduce Amplitude/Born Rule Issue:** Show a state like √(1/3)|Heads⟩ + √(2/3)|Tails⟩. Ask: "What tells Nadia (in *this* branch, pre-measurement) she's likely to *find* Tails? All outcomes happen." *Why:* The problem only bites *after* they grasp that (a) all branches are real, and (b) decoherence just explains *perceived* definiteness, *not* likelihood. **This is the registration point.**
     - **Reject Naive Branch Counting:** *Then* show why "just count branches" fails. *Why:* You need the amplitude-weighted state *before* you can debunk "branch count = probability."
     - **Decision Theory Setup:** *Finally*, introduce the decision-theoretic approach. *Why:* Only now do they see the *need* to derive subjective uncertainty/weighting from structure, not assume it.

  **2. The Core Example: The 99/1 Spin vs. Fair Coin**
     - **Setup:** Agent measures a spin-1/2 particle prepared in √(0.99)|↑⟩ + √(0.01)|↓⟩. Simultaneously, flip a fair coin: |Heads⟩ + |Tails⟩.
     - **Post-Measurement State:** √(0.99)|↑, Heads⟩ + √(0.99)|↑, Tails⟩ + √(0.01)|↓, Heads⟩ + √(0.01)|↓, Tails⟩ (4 branches).
     - **Why it Carries It:**
       *   **Has:** Explicit, unequal amplitudes (√(0.99) vs √(0.01)); clear physical difference from the coin (equal amplitudes).
       *   **Has:** Multiple branches for the *same* outcome (↑ with Heads/Tails), proving branch count ≠ probability (2 branches for ↑, probability should be 0.99).
       *   **Not:** Artificial splitting (like halving a branch) which feels ad hoc. This uses natural, distinct measurements.
       *   **Not:** The Cat (too much baggage, doesn't easily show amplitude *differences* or multiple splits per outcome). Avoid the 2/3 vs 1/2 trick initially (it's good *later* to show why halving fails, but complicates the *first* demo).

  **3. Misconceptions & When to Head Them Off:**
     - **"Decoherence makes probabilities":** Head off *immediately after explaining decoherence*. State clearly: "Decoherence explains why *within a branch* things look definite and classical, and why branches *don't talk to each other*. It does *not* tell Nadia why she's *likely* to find spin up. That's the next problem."
     - **"Probability = Counting Branches":** Head off *right after presenting the 99/1+Coin state*. Ask: "How many branches have Spin Up? (2) What should the probability be? (0.99). 2 ≠ 0.99. Branch counting is dead."
     - **"Probability is just credence / subjective":** Head off *before introducing decision theory*. Say: "If it's *just* credence, why should Nadia assign 0.99 credence to ↑? What *objective feature* of the wavefunction *justifies* that belief? If there's nothing, her belief seems arbitrary. Everettians need an *objective* basis for rational credence."

  **4. The End Question:**
     *   **"In the 99/1 spin + fair coin setup, why should a rational agent *prefer* a bet that pays $1 only if they find spin up, over a bet that pays $1 only if the coin lands heads? What *structure* in the wavefunction justifies this preference?"**
     *   *Why it works:* It forces them to connect (1) the unequal amplitudes/weights, (2) the rational action of the agent *before* branching, and (3) the *non*-arbitrariness of the preference. A slogan answer ("Born rule!") fails; they need the decision-theoretic link.

  **5. What to Refuse & Why:**
     *   **Refuse:** Detailed derivation of the Born rule via decision theory (e.g., Deutsch/Wallace axioms, exact proofs).
     *   **Justification:** "Our goal today is to see *why* probability is a *problem* in MWI and *how* Everettians frame a solution without begging the question. The key insight is that rational action *pre-branching* can be constrained by the amplitude structure to *look like* probability weighting. The technical proofs are fascinating, but they require more formalism than we have time for today. Focus on understanding *that* strategy and why it's needed."

  **Session Flow Summary:** MWI/Decoherence (Worlds Defined) → Probability Problem (99/1 vs Coin - Branch Counting Fails) → Misconception Blocking → Decision Theory Sketch (Rational Agents respond to Amplitudes *as if* weights) → End Question → Refusal of deep math. Keep it conceptual.
