  Okay, the user is a PhD student in political theory, describing a recurring argumentative pattern around terms like "Western values." They've noticed three key features: internal failures are dismissed as betrayals, external parallels are demoted to coincidences, and the phrase serves both descriptive and normative roles interchangeably. They also mention the shifting criteria for what unifies these values. The user wants to know if there's an established term for this, or if not, to coin one with precise boundaries.

  First, I recall that this resembles the "No True Scotsman" fallacy but is more complex. The user already pointed out it's not exactly that. They mentioned "essential contestability," but that's about concepts themselves, not the argumentative moves. So what's the right framework?

  The descriptive-normative shuttle reminds me of what sociologists call "ontological gerrymandering" – when definitions shift to serve an argument. Also, "ideal types" from Weber might fit, where the "Western values" become an idealized construct that ignores historical contradictions. But the user specified that internal critiques are seen as failures to live up to ideals, while external ones are dismissed as different. That two-way move is key.

  W. B. Gallie's "essentially contested concepts" is relevant, but again, focuses on the concepts, not the argument tactics. The user needs a term for the rhetorical strategy. Maybe "normative cherry-picking"? But that doesn't capture the dual moves. Or "selective historicism"?

  Then I remember scholarship on "invented traditions" by Hobsbawm and Ranger. But that's about creating traditions, not defending them argumentatively. The user's case involves defending a tradition through shifting definitions. So perhaps "hermeneutic arbitrage"? Arbitrage usually means exploiting price differences, so here it's exploiting interpretive flexibility—using different standards for internal vs. external examples. That might work.

  Also, the user mentioned the unifying thread shifting (Christianity, Enlightenment, etc.). That's part of the arbitrage—changing the criteria as needed. The descriptive-normative shuttle could be called "rhetorical bifocality," switching between "is" and "ought."

  So combining both, "hermeneutic arbitrage" captures the core: opportunistically applying different interpretive standards to protect the category. The boundaries would exclude cases where definitions are consistent or when only one type of counterexample is handled. For example, if someone consistently views both internal and external critiques as part of a universal struggle, that's different. Or if the value is clearly defined from the start, without shifting.

  The user might also have deeper needs: understanding how this pattern sustains power structures, or tools to deconstruct such arguments in academic settings. They’re a PhD student, so practical application in seminars and publishing is likely important. They might want to critique the hegemony of "Western values" discourse without dismissing normative projects entirely. The proposed term gives them a precise tool for that.
answer: |-
  Your dissection captures a sophisticated and pervasive argumentative pattern that lacks a single established name but intersects with several conceptual domains. I propose the term **"hermeneutic arbitrage"** to capture its core mechanics, with the full configuration termed the **"Hermeneutic Arbitrage Defense of Tradition" (HADT)**. Below is a precise definition, differentiation from neighboring concepts, boundary cases, and exclusion criteria.

  ---

  ### **Hermeneutic Arbitrage Defense of Tradition (HADT)**  
  *Definition*: A rhetorical strategy defending the coherence and uniqueness of a cultural tradition (e.g., "Western values") by opportunistically alternating between two interpretive standards:  
  1. **Internal Failures**: Historical violations (e.g., slavery, colonialism) are dismissed as *contingent betrayals* of the tradition’s *aspirational ideals*.  
  2. **External Parallels**: Similar values in non-tradition societies (e.g., rule of law in Islamic fiqh, meritocracy in Confucianism) are dismissed as *conceptually distinct* due to divergent metaphysical/legal frameworks.  
  This is coupled with **rhetorical bifocality**: the tradition is simultaneously framed as:  
  - A *descriptive fact* ("*Our* societies hold these values") to deflect normative critique.  
  - A *normative standard* ("*True* members of our tradition uphold these") to deflect empirical counterevidence.  
  The tradition’s unifying thread (e.g., Christianity, Enlightenment) shifts contextually to preserve coherence.

  ---

  ### **Why "Hermeneutic Arbitrage"?**  
  - **Hermeneutic**: Emphasizes the *interpretive flexibility* applied to texts, history, and concepts.  
  - **Arbitrage**: Borrowed from finance, denoting *exploitation of differential standards* (internal vs. external, descriptive vs. normative) to profit rhetorically.  
  - **Defense of Tradition**: Highlights the motive—preserving the tradition’s perceived integrity and exclusivity.

  ---

  ### **Distinguishing HADT from Neighboring Concepts**  
  1. **No True Scotsman (NTS) Fallacy**:  
     - *Overlap*: Both dismiss counterexamples by redefining criteria.  
     - *Difference*: NTS is ad hoc (one speaker revising a definition). HADT is *systemic*, leveraging *institutionalized interpretive traditions* (e.g., Christian teleology, Enlightenment progress narratives) and operates bidirectionally (internal/external). NTS lacks the descriptive-normative shuttle.  

  2. **Essential Contestability (Gallie)**:  
     - *Overlap*: Concepts like "democracy" admit multiple interpretations.  
     - *Difference*: Essential contestability is a *property* of concepts. HADT is a *tactic* using contestability asymmetrically: internal deviations are "corruptions" (preserving essence), external parallels are "alien" (preserving uniqueness).  

  3. **Invented Traditions (Hobsbawm & Ranger)**:  
     - *Overlap*: Traditions are constructed selectively.  
     - *Difference*: "Invented traditions" focus on *origin myths*. HADT focuses on *defensive hermeneutics* in real-time discourse, especially the *dual dismissal mechanism*.  

  4. **Ontological Gerrymandering (Woolgar & Pawluch)**:  
     - *Overlap*: Selectively defining boundaries to serve an argument.  
     - *Difference*: Ontological gerrymandering addresses *causal claims* (e.g., in social problems theory). HADT specifically targets *cultural essentialism* and its normative-descriptive duality.

  ---

  ### **Boundary Cases: When Is HADT *Not* Present?**  
  1. **Consistent Universalism**:  
     - A speaker acknowledges both internal crimes *and* external parallels as evidence of a *universal human struggle* toward ideals (e.g., "All civilizations grapple with liberty; ours is no exception"). *No arbitrage*.  

  2. **Fixed Definition**:  
     - "Western values" are strictly defined (e.g., "post-1789 liberal constitutionalism"). Internal pre-Enlightenment failures (e.g., inquisitions) are excluded as *non-Western* (medieval=Christian, not "Enlightenment West"). External parallels are dismissed *consistently* under this definition. *No shifting criteria*.  

  3. **Pure Normative Idealization**:  
     - "Western values" are explicitly framed *only* as aspirational (e.g., Rawlsian liberalism), with no descriptive claim. Historical failures are *expected* shortfalls; external parallels are welcomed as "overlapping consensus." *No bifocality*.

  ---

  ### **Liminal Cases: Is HADT Present?**  
  1. **Selective Hybridity**:  
     - A speaker accepts *some* external parallels (e.g., Indian democracy) as "influenced by the West" but dismisses others (e.g., Ottoman rule of law) as "essentially different."  
     - *Verdict*: **HADT-lite**. The asymmetrical treatment of external parallels suggests arbitrage, but if internal failures are not addressed, it’s incomplete.  

  2. **Scholarly Ambivalence**:  
     - A historian notes that Athenian democracy coexisted with slavery but argues this is *irrelevant* to its conceptual legacy, while also asserting Islamic "justice" is distinct from Western "equality."  
     - *Verdict*: **HADT** if framed defensively; **not HADT** if purely analytical (e.g., tracing intellectual genealogies without valorization).

  ---

  ### **Why This Carving Works**  
  - **Captures Asymmetry**: The dual dismissal (internal→betrayal/external→coincidence) is the core innovation.  
  - **Explains Resilience**: Rhetorical bifocality and shifting criteria make the tradition unfalsifiable.  
  - **Locates in Scholarship**: Resonates with:  
    - Said’s *Orientalism* (flexible East/West binaries).  
    - Skinner’s contextualism (concepts as framework-dependent).  
    - MacIntyre’s tradition-constituted rationality (but weaponized defensively).  

  HADT is not "bad faith" but *hermeneutic opportunism*: speakers draw on deep reservoirs of cultural narrative (Christian redemption, Enlightenment progress) to protect identity-invested ideals. Its power lies in appearing self-consistent while evading critique through strategic recontextualization. As a term, it isolates this maneuver for precise critique—especially vital for political theorists dismantling hegemonic claims.
