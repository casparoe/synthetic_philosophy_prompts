  Scoring: points (utils) in each world. We will compare the averages.

  We can also have a summary table for the participants to record:

  | World | Accept/Decline | State | Test result (if accepted) | Chosen act | Payoff |
  |-------|----------------|-------|----------------------------|------------|--------|
  | 1     |                |       | (if accepted)              |            |        |
  | 2     |                |       | (if accepted)              |            |        |
  | 3     |                |       |                            |            |        |

  But we can design a scoresheet.

  Now, the explicit expected-value arithmetic:

  World 1:
  - Decline: EU = 0.5*10 + 0.5*0 = 5
  - Accept: EU = 10 (because you always get 10)

  World 2:
  - Decline: EU = 5
  - Accept: EU = 0

  World 3:
  - Decline: EU = 5
  - Accept: 
    - The EU can be computed as:
      - P(T1) * [ P(S1|T1)*10 + P(S2|T1)*0 ] for choosing A given T1 -> 0.5 * (0.7*10 + 0.3*0) = 0.5 * 7 = 3.5? But wait, we computed earlier that the EU is 7 overall.

    Actually, we did:
      EU(accept) = P(correct choice) * 10 + P(incorrect choice) * 0 
                 = [P(T1,S1) + P(T2,S2)] * 10 
                 = (0.5*0.7 + 0.5*0.7) * 10 = (0.35+0.35)*10 = 0.7 * 10 = 7.

    Alternatively, by conditioning:
      = P(T1) * EU(choose A|T1) + P(T2) * EU(choose B|T2)
      = 0.5 * [0.7*10 + 0.3*0] + 0.5 * [0.3*0 + 0.7*10] 
      = 0.5*7 + 0.5*7 = 3.5 + 3.5 = 7.

  So 7>5.

  This is the arithmetic.

  Finally, the frank note: the activity cannot easily stage:
  - Non-Bayesian updating.
  - Non-expected utility preferences (like ambiguity aversion).
  - Dynamic inconsistency (where the agent would like to commit to ignoring information).
  - State-dependent utility (where the utility of an outcome depends on the state in a way that makes the information intrinsically harmful).

  We also assume that the participants are rational and will act optimally after receiving the information. In reality, if they make a mistake, then information might hurt, but that is a failure of rationality, not a counterexample to the theorem.

  We also assume that the prior is fixed and known.

  So the facilitator should note these limitations and that the theorem holds under the assumptions of Bayesian expected utility maximization with no change in the option set and no cost for the information.

  This should make for a rich session.
