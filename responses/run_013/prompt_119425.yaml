  ### Design for 90-Minute Session: The Value of Information in Decision Theory

  **Goal:** Explore the theorem that free information (costless, non-binding, and not altering options) never harms an expected-utility maximizer. Participants confront intuitive counterexamples, discover why they fail, and attempt (unsuccessfully) to construct a genuine counterexample.

  **Participants:** 12–16 graduate students comfortable with conditional expectation and Bayes’ rule. None have seen the theorem.

  **Core Structure:**  
  Three sequential "worlds" with identical states, acts, and payoffs, but differing test rules. Participants repeatedly choose whether to accept a free test before learning the state. After all choices, outcomes are revealed and scored. The group then attempts to design a counterexample.

  ---

  ### **Materials & Setup**
  1. **State Assignment:**  
     - Use coin flips (participants self-flip or use an app).  
       - **Heads = State S1** (probability 0.5).  
       - **Tails = State S2** (probability 0.5).  
     - Each world is independent: Re-flip coins for each world.  
     - *No computers needed; coins ensure transparency.*

  2. **Test Assignment (World 3 only):**  
     - For noisy tests (World 3), use a 10-sided die (real or digital) **once per participant**:  
       - If **S1**: Die 1–7 → **T1** (correct), 8–10 → **T2** (incorrect).  
       - If **S2**: Die 1–7 → **T2** (correct), 8–10 → **T1** (incorrect).  
     - Accuracy = 70% (P(Tᵢ|Sᵢ) = 0.7).  
     - *Pre-generated random numbers can substitute dice.*

  3. **Decision Recording:**  
     - Participants write **"A" (Accept)** or **"D" (Decline)** for each world on a sheet **before learning states/results**.  
     - Sheets collected after all decisions to prevent cheating.

  4. **Acts & Payoffs (Same for all worlds):**  
     | State | Act A | Act B |  
     |-------|-------|-------|  
     | S1    | 10    | 0     |  
     | S2    | 0     | 10    |  
     - **Utility units (utils)** replace money (no real payouts).  
     - If indifferent (no test), assume participants choose **Act A** (default).  
     - **Scoring:** Participants calculate utils after states/results are revealed.

  5. **World-Specific Rules:**
     - **World 1 (Clean):**  
       - Test is free, private, perfect (reveals true state), and **does not alter options**.  
       - If accept: Learn state → choose best act → get 10 utils.  
       - If decline: Choose Act A → get 10 (if S1) or 0 (if S2).  
       - *Theorem bites: Accepting dominates.*  
     - **World 2 (Obligation):**  
       - Test is free, private, perfect, but **accepting removes an option**:  
         - If test shows S1 → **must choose Act B** (pays 0 in S1).  
         - If test shows S2 → **must choose Act A** (pays 0 in S2).  
       - If decline: Choose Act A → get 10 (if S1) or 0 (if S2).  
       - *Declining is optimal.*  
     - **World 3 (Noisy):**  
       - Test is free, private, noisy (70% accurate), **no altered options**.  
       - If accept: Get test result → choose act (must follow **optimal posterior strategy**):  
         - T1 → **choose Act A** (P(S1|T1) = 0.7 → EU(A|T1) = 7 > EU(B|T1) = 3).  
         - T2 → **choose Act B** (P(S2|T2) = 0.7 → EU(B|T2) = 7 > EU(A|T2) = 3).  
       - If decline: Choose Act A → get 10 (if S1) or 0 (if S2).  
       - *Theorem survives noise; accepters win on average despite unlucky realizations.*

  ---

  ### **Timeline (90 Minutes Total)**
  **0:00–0:10 (10 min): Introduction**  
  - Explain the setup: Two states (S1/S2, P=0.5), two acts (A/B), payoff table.  
  - Describe the sequence: Three worlds with identical payoffs but different test rules.  
  - Emphasize: **Decisions are made before states/results are known.**  

  **0:10–0:25 (15 min): World 1 (Clean)**  
  - Explain rules: Test is perfect and free; no obligation. Decline → default to Act A.  
  - Participants **write "A" or "D"** privately.  
  - **Reveal states (coin flips)**. Participants calculate utils:  
    - Accepters: 10 utils (chose correctly).  
    - Decliners: 10 if S1, 0 if S2.  
  - **Record group averages**: Accepters (avg. 10), Decliners (avg. 5).  

  **0:25–0:40 (15 min): World 2 (Obligation)**  
  - Explain rules: Accepting forces a **harmful choice** (Act B if test=S1, Act A if test=S2).  
  - Participants **write "A" or "D"**.  
  - **Reveal states (coin flips)**. Calculate utils:  
    - Accepters: 0 utils (always wrong).  
    - Decliners: 10 if S1, 0 if S2.  
  - **Record group averages**: Accepters (avg. 0), Decliners (avg. 5).  

  **0:40–1:00 (20 min): World 3 (Noisy)**  
  - Explain rules: Test is 70% accurate; accepters **must follow optimal strategy** (T1→A, T2→B).  
  - Participants **write "A" or "D"**.  
  - **Reveal states (coins) and test results (dice)**. Calculate utils:  
    - Accepters: 10 if test correct, 0 if incorrect.  
    - Decliners: 10 if S1, 0 if S2.  
  - **Record group averages**: Accepters (expected avg. ~7), Decliners (avg. 5).  

  **1:00–1:05 (5 min): Initial Results**  
  - Display group averages:  
    | World | Accept Avg. | Decline Avg. |  
    |-------|-------------|-------------|  
    | 1     | 10          | 5           |  
    | 2     | 0           | 5           |  
    | 3     | ~7          | 5           |  
  - Highlight: World 1/3 favor accepting; World 2 favors declining.  

  **1:05–1:35 (30 min): Group Challenge**  
  - **Task:** Design a scenario where:  
    - States S1/S2 (P=0.5), acts A/B, same payoffs.  
    - Free test (costless, private, no obligation, no option changes).  
    - An expected-utility maximizer is **strictly worse off** taking the test.  
  - Groups (3–4 people) brainstorm for 15 min.  
  - Groups present for 15 min. Facilitator refutes attempts (common pitfalls below).  

  **1:35–1:40 (5 min): Quick Break**  

  **1:40–1:50 (10 min): Debrief**  
  - **Theorem Statement:** "Free information never lowers the expected utility of the best available act for an expected-utility maximizer." (Attributed to **Leonard J. Savage** in *The Foundations of Statistics*, 1954, with roots in Blackwell, 1951).  
  - **Why Worlds Succeeded/Failed:**  
    | World | Theorem Holds? | Why? |  
    |-------|----------------|------|  
    | 1     | Yes            | Test free, no option changes. |  
    | 2     | No             | Test removes options (obligation). |  
    | 3     | Yes            | Noise doesn’t violate assumptions; EU still ↑. |  
  - **Escape Hatches** (when information *can* hurt):  
    1. **Not free:** Costly, or changes options (e.g., World 2’s obligation).  
    2. **Not non-binding:** Agent cannot ignore information (e.g., legal disclosure).  
    3. **Non-EU agent:** Ambiguity aversion, misupdating (not Bayesian), or state-dependent utility.  
    4. **Commitment problems:** Agent’s future self won’t act optimally (e.g., panic upon bad news).  
  - **Activity Coverage:**  
    - Staged: Option changes (World 2), noise (World 3), and dominance of ignoring (World 1).  
    - Not staged: Non-EU agents, commitment problems, or costly information.  

  **1:50–1:55 (5 min): Conclusion**  
  - Summarize: The theorem holds under strict assumptions; real-world "harm" usually violates them.  
  - Distribute reference: Savage’s theorem (Blackwell’s theorem for statisticians).  

  ---

  ### **Expected-Value Arithmetic**
  **World 1 (Clean):**  
  - Decline: EU = P(S1)×U(A) + P(S2)×U(A) = (0.5×10) + (0.5×0) = 5.  
  - Accept: EU = P(S1)×[U(A|S1)] + P(S2)×[U(B|S2)] = (0.5×10) + (0.5×10) = 10.  
  - **Verdict: Accept (10) > Decline (5).**  

  **World 2 (Obligation):**  
  - Decline: EU = 5 (same as World 1).  
  - Accept: EU = P(S1)×[U(B|S1)] + P(S2)×[U(A|S2)] = (0.5×0) + (0.5×0) = 0.  
  - **Verdict: Decline (5) > Accept (0).**  

  **World 3 (Noisy):**  
  - Decline: EU = 5 (same as World 1).  
  - Accept:  
    - P(T1) = P(T1|S1)P(S1) + P(T1|S2)P(S2) = (0.7×0.5) + (0.3×0.5) = 0.5.  
    - EU|T1 = max{ P(S1|T1)×10, P(S2|T1)×10 } = max{ (0.7×10), (0.3×10) } = max{7, 3} = 7.  
    - EU|T2 = max{ P(S1|T2)×10, P(S2|T2)×10 } = max{ (0.3×10), (0.7×10) } = max{3, 7} = 7.  
    - Total EU = P(T1)×EU|T1 + P(T2)×EU|T2 = (0.5×7) + (0.5×7) = 7.  
  - **Verdict: Accept (7) > Decline (5).**  

  ---

  ### **Anticipated Failures & Fixes**
  1. **Problem: Unlucky realization in World 3.**  
     - Participants see a decliner get 10 while an accepter gets 0 (due to noise) and claim the theorem is false.  
     - **Fix:** Preemptively stress **expected vs. realized utility**. Use group averages to show accepters beat decliners overall (~7 > 5).  

  2. **Problem: Misunderstanding "free information" in Group Challenge.**  
     - Groups design tests with hidden costs (e.g., emotional distress) or altered options.  
     - **Fix:** Clarify: "Free" = no cost, no option changes. Utility must be state-independent.  

  3. **Problem: Counterexamples with irrational agents.**  
     - Groups propose agents who ignore Bayes or choose suboptimally.  
     - **Fix:** Restate: The theorem assumes **EU maximization + Bayesian updating**.  

  4. **Problem: Time crunch in Group Challenge.**  
     - Groups struggle to formalize ideas.  
     - **Fix:** Provide a template: "Assume S1/S2 P=0.5. Test reveals [X]. Agent does [Y]..."  

  ---

  ### **Limitations & Facilitator Notes**
  - **What the activity cannot reproduce:**  
    - **Commitment problems:** Participants act immediately after tests; no time for preference changes.  
    - **Non-EU agents:** Activity assumes rational Bayesian agents.  
    - **State-dependent utility:** Payoffs are fixed; no "anxiety" from bad news.  
  - **Facilitator must supply:**  
    - Clarification that utility is over outcomes, not beliefs (e.g., no "fear of knowing").  
    - Proof sketch: Let \(\mathcal{F}\) be no-information sigma-algebra. For any test (sub-sigma-algebra \(\mathcal{G} \supseteq \mathcal{F}\)), \(E[\max_a E[u(a)|\mathcal{G}]] \geq E[\max_a E[u(a)|\mathcal{F}]]\).  
    - Context: This underlies Blackwell’s theorem (comparison of experiments).  

  This design forces participants to confront their intuition, formalize it, and discover the theorem’s robustness—while honestly isolating its limits.
