  We are designing a 90-minute session for a graduate reading group on decision theory. The goal is to explore the result that free information cannot hurt an expected-utility maximizer (in the absence of commitment problems, etc.). We will structure the session around a series of decision problems in which participants choose whether to take a free test (which provides information about a state of the world) and then choose an act that yields payoffs depending on the state.

  The session will be divided into two parts:
  1. A structured activity with three worlds (scenarios) that illustrate different aspects of the theorem and its limitations.
  2. A group challenge to construct a counterexample (which they should fail to do) followed by a debrief.

  Materials:
  - Handouts for each participant (or displayed on a screen) with the decision problems and payoff tables.
  - A way to assign states and test results (if applicable) without a computer. We can use physical random devices (like dice or coins) or pre-generated random numbers. Since the group is small, we can use simple randomizers (e.g., coin flips, die rolls) for each participant or for the group as a whole.

  We assume two states of the world: S1 and S2, each with prior probability 1/2 (unless otherwise specified). The test in the first two worlds is perfect, and in the third world is noisy.

  There are two acts: Act A and Act B. The payoffs (in utils) are:

  | State | Act A | Act B |
  |-------|-------|-------|
  | S1    | 10    | 0     |
  | S2    | 0     | 10    |

  Without any information, the expected utility of either act is 5. So the decision-maker is indifferent and can choose either. We assume that if indifferent, the decision-maker chooses Act A (but this is arbitrary and can be specified).

  We design three worlds:

  World 1 (Clean world): 
  - The test is free, private, and does not alter the participant's options. Participants choose to accept or decline the test. If they accept, they learn the true state and then choose an act. If they decline, they remain uninformed and choose an act (and we assume they choose Act A by default, as explained above). 
  - The theorem says: accepting the test weakly dominates declining. 
  - Expected utility without test: 5 (by choosing Act A, or Act B, both yield 5).
  - Expected utility with test: 10 (because they will choose the act that matches the state, getting 10 for sure). 
  - Therefore, accepting gives 10, declining gives 5. So accepting is strictly better.

  World 2 (Test result imposes an obligation that removes an option):
  - The test is free and private, but if you take the test and it reveals S1, then you are obligated to choose Act A (so you cannot choose Act B). If it reveals S2, you are obligated to choose Act B. If you decline the test, you are free to choose either act.
