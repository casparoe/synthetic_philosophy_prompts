prompt: |-
  I'm putting together a grad seminar on the free energy principle and I keep getting the same fight every week: half the room thinks it's the next great unification, the other half thinks it's the kind of framework that can't be wrong because it can't be tested. Before we start scoring camps I want the spec on the table. So write me the desiderata.

  What does a theory of this kind actually have to deliver to count as an adequate unified theory of brains and behavior — and, if it's claiming them too, of life and self-organization more generally? I want the full list: the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, the results it can't contradict, with the case or consideration sitting behind each requirement. I'm not asking for a survey of what people have said; I want your list.

  Some things I want either on the list or explicitly argued off it, and I want you to take a side on each:

  - the dark room problem and its relatives. If a system can drive prediction error down by doing nothing at all, what exactly does the theory owe us? Is that a bug, a feature, or a non-question?
  - the triviality worry. A colleague in my department insists active inference is just control theory and Bayesian filtering with a new vocabulary. Is it a genuine desideratum that the theory be more than a re-description of existing engineering, or is that just a demand for novelty dressed up as rigor?
  - Markov blankets. Does the theory have to tell us what's real about them, or is it allowed to be a modelling convenience all the way down? I think this is where the whole thing lives or dies, so don't punt.
  - scope. Does it have to cover a candle flame, a slime mold, a bacterium, and a person in a coma? What does each extra case cost the theory, and what does dropping them cost?
  - the technical bookkeeping. Does it owe an account of why the quantity being minimized is a bound rather than the thing itself, and of which quantity is actually the target when a system acts rather than just perceives?
  - falsifiability. Does it have to say what would count as evidence against it? And is that even the right demand to make of a framework rather than a theory — I genuinely don't know, so decide for me.
  - experience. Does it owe us anything about the phenomenal side, or is that legitimately outside its brief?

  Then, and this is the part I actually want: mark which requirements are non-negotiable and which are just the preferences of one camp, flag any pair of them that I can't have together (I'd bet money there's at least one), and tell me which single requirement does the most work in excluding the main contenders — predictive processing as usually stated, the free energy principle itself, and whatever you take to be the strongest minimal alternative.

  No citations, no reading list, I know the literature. I want your argument. And be committed: take positions, don't lay out options for me to pick from. I'd much rather you be definite and wrong in places than balanced and useless. American English, and keep it tight.
reasoning: |-
  Okay, let's tackle this professor's request. They're running a grad seminar on the free energy principle (FEP) and dealing with polarized opinions. Half the class sees it as revolutionary, the other half as untestable. They want a clear list of what FEP must deliver to be a valid unified theory of brains, behavior, and possibly life itself. 

  First, the desiderata. The core challenge is defining what FEP must explain to be taken seriously. The professor wants phenomena it must cover, distinctions it must preserve, and results it can't contradict. They also specified seven contentious points that need explicit positions.

  Starting with the must-haves for any theory claiming to unify brains and behavior: It absolutely needs to explain perception-action cycles, learning, and adaptive behavior. Without handling how perception guides action and vice versa, it's useless. It also must account for how systems handle uncertainty since real environments are messy. Ignoring that would collapse key distinctions like perception vs action. Plus, it has to cover both normal function and pathology—things like psychosis or paralysis can't be hand-waved away. 

  For the expanded scope to life itself, FEP must explain metabolism and self-organization in simple systems like bacteria. If it can't handle a bacterium maintaining homeostasis, it fails as a general theory. But this comes at a cost: the theory might become too abstract, losing explanatory power for complex cognition. That tension is unavoidable.

  Now the specific points: 

  - **Dark room problem**: This is a bug if FEP claims to explain behavior. If minimizing prediction error lets you just sit in a dark room, but real organisms don't, FEP owes an explanation—like incorporating prior preferences that make sensory surprises matter. 

  - **Triviality worry**: Not just novelty-seeking. If FEP is just control theory with new words, it's redundant. A core desideratum is that it must offer something new, like explaining why brains use probabilistic models at all, beyond engineering applications. 

  - **Markov blankets**: This is make-or-break. If blankets are just modeling tools, FEP is just pretty math. To be substantive, it must explain how physical systems (like cells) create boundaries that define "self" vs "world." Otherwise, it's hand-wavy. 

  - **Scope**: Covering candle flames is a bridge too far—it risks vacuity. But bacteria? Necessary. Dropping them admits FEP isn't about life, just brains. 

  - **Technical bookkeeping**: Must clarify why we minimize free energy (a bound) rather than surprise directly, and how action targets expected free energy. Skipping this leaves the math ungrounded. 

  - **Falsifiability**: Yes, it needs testable commitments. Even frameworks must forbid some observations. If everything fits, it's empty. 

  - **Experience**: Can punt for now. Explaining phenomenology isn't essential for the core claims, though it'd be a bonus. 

  Now for conflicts: The biggest is **scope vs precision**. Covering bacteria forces simpler mechanisms, making brains look like fancy bacteria—which erases cognition-mere-regulation distinctions. But without bacteria, it's not about life. Unavoidable trade-off. 

  The most exclusionary requirement? **Markov blankets as ontological**. If FEP can't show how real physical systems implement blankets, predictive processing (which uses them as tools) and other alternatives win by default. 

  Finally, the professor wants bold positions, so no hedging. FEP must deliver on perception-action, uncertainty, pathologies, and basic self-organization—or fail. Triviality is fatal if true; dark room is fixable; scope is non-negotiable for bacteria but not candles; falsifiability is mandatory. Blankets are the linchpin. 

  This should force both camps to sharpen their arguments. The tension between scope and precision might be the seminar's next big fight.
answer: |-
  Here’s your desiderata list, stripped of ambiguity. Positions taken, corners occupied. Non-negotiables are **bolded**; trade-offs and conflicts flagged.

  ---

  ### **Core Desiderata for FEP as a Unifying Theory**  
  *(Non-negotiables in bold)*  

  1. **Explain adaptive perception-action cycles under uncertainty**  
     - *Must get right:* How systems balance exploration/exploitation, avoid stagnation (e.g., *not* sitting in dark rooms).  
     - *Failure:* Collapses distinction between adaptive behavior and passive homeostasis.  

  2. **Account for hierarchical learning & model revision**  
     - *Must cover:* Slow (evolutionary/genetic) to fast (synaptic) timescales.  
     - *Case to nail:* Psychosis (faulty priors), neuroplasticity after injury.  

  3. **Formalize "self" vs. "world" distinction without dualism**  
     - *Must preserve:* Boundaries that enable agency (e.g., immune response vs. metabolic regulation).  
     - *Cannot contradict:* Thermodynamic openness of living systems.  

  4. **Unify perception, action, and learning under one mechanics**  
     - *Must explain:* Why acting *is* inferring (e.g., saccades reducing visual uncertainty).  
     - *Failure:* Treating action as an add-on to perception.  

  5. **Predict pathological & edge cases**  
     - *Cases required:* Coma (minimal self-organization), locked-in syndrome (action without movement), anxiety disorders (maladaptive uncertainty management).  

  ---

  ### **Your Specifics: Positions Taken**  
  - **Dark room problem**: **Bug**. FEP *must* explain why agents seek complex niches (e.g., novelty, allostatic priors). If error minimization favors stupor, the theory is inert.  
  - **Triviality worry**: **Desideratum to be non-trivial**. If FEP is just Kalman filters + PID control, it’s redundant. It *must* explain why biological systems *are* Bayesian (e.g., via evolutionary grounding), not just that they can be modeled as such.  
  - **Markov blankets**: **Must be ontological**. If blankets are just modeling tools, FEP is instrumentalist fluff. It *must* show how physical systems (cells, brains) *instantiate* blankets through dynamics (e.g., cellular membranes enforcing statistical boundaries).  
  - **Scope**: **Must cover bacteria and slime molds; candles are out**. Life requires metabolism-driven self-organization. Candles lack adaptive inference; coma preserves it minimally. Cost: Overextending to abiotic systems (candles) invites vacuity. Cost of *excluding* bacteria: Surrenders "life" claim.  
  - **Technical bookkeeping**: **Must clarify why free energy (not surprise) is minimized**. The bound *is* the thing: Minimizing surprise directly is intractable. Action targets *expected free energy* (EFE), trading immediate error for long-term model fidelity. Owe the math.  
  - **Falsifiability**: **Must forbid observations**. Even frameworks need empirical commitments (e.g., "All adaptive systems minimize EFE" forbids organisms thriving *without* error suppression). Untestable = unscientific.  
  - **Experience**: **Legitimately outside its brief**. FEP explains mechanisms, not qualia. Demanding phenomenology confuses map with territory.  

  ---

  ### **Conflicts & Trade-offs**  
  - **🔥 Inevitable Conflict: Scope vs. Precision**. Covering bacteria requires FEP to be *mechanistically sparse* (e.g., blanket as membrane dynamics). But for brains, it *must* be *mechanistically rich* (e.g., blanket as cortical hierarchy). Sacrificing one for the other collapses key distinctions (e.g., metabolizing vs. deliberating).  
  - **💥 Excluding Requirement**: **Markov Blankets as Ontological**. This sinks predictive processing (PP) and most alternatives:  
    - PP treats blankets as useful fictions; FEP *requires* them to be physically real.  
    - Competing theories (e.g., dynamical systems) reject blankets outright.  
    - If blankets aren’t "in the world," FEP is just pretty math.  

  ---

  ### **The Heavy Lifter**  
  **"Markov blankets as ontological"** does the most work in excluding contenders:  
  - Kills PP (which uses blankets heuristically).  
  - Sinks minimal alternatives (e.g., good regulators theorem).  
  - Forces FEP to stand on whether boundaries (self/world) are *engineered by* systems, not just drawn by theorists.  

  ---

  **Final Tally**:  
  - Non-negotiables: **Adaptive action**, **Unified mechanics**, **Ontological blankets**, **Falsifiability**, **Coverage of life**.  
  - Camp preferences: Experience (optional), Novelty (demanded).  
  - Your seminar’s battlefield: **Scope vs. Precision**. You can’t have both without admitting FEP is *not* one theory but two: one for life, one for minds. Choose.
