answer: |-
  ### Plan for the 50-Minute Session on Bongard Problems

  #### **Sequencing and Why Each Step Depends on the Previous**
  The session must start **cold** (without framing) to induce the experience of pattern-matching before concept-grasping. This mirrors how AI models often approach problems—fitting surface features without deeper understanding—and sets up the "aha" moment. Framing first would bias the audience toward looking for invariants, skipping the struggle that reveals the difference between fitting and grasping. Here’s the order:

  1. **Cold Attempt at a Bongard Problem (5 minutes)**  
     - **What**: Present your candidate example (12 figures: 6 asymmetric vs. 6 symmetric, with identical complexity). Ask: "What rule separates the left from the right?"  
     - **Why**: Start cold to force pattern-matching. The audience will default to counting strokes, sizing features, or spotting irregularities—all local, superficial fits. This mirrors AI’s tendency to overfit to examples. Depends on nothing prior—it’s the raw experience.  
     - **Cost**: Risk of initial frustration or overconfidence in wrong answers, but this is essential to expose flawed heuristics.

  2. **Debrief and Reveal the Invariant (5 minutes)**  
     - **What**: Discuss guesses (e.g., "Left looks jagged," "Right has more curves"). Gently refute with counterexamples from the images. Reveal the rule: "Left figures lack mirror symmetry; right have at least one symmetry axis."  
     - **Why**: Depends on the cold attempt. Shows pattern-matching fails (e.g., asymmetry isn’t visually "jagged" in your design). Introduces the concept of an invariant as a global property (symmetry) that isn’t reducible to local features.  
     - **Cost**: Without the cold start, this reveal lacks impact—audience wouldn’t feel why fitting differs from grasping.

  3. **Framing Bongard Problems (5 minutes)**  
     - **What**: Define Bongard problems: "A puzzle where two sets of examples (left/right) follow a hidden rule (invariant). The goal is to find the invariant that perfectly separates them."  
     - **Why**: Depends on the debrief. Now the audience has context for why invariants matter (they survived the failure). Framing here prevents misconceptions like "rules are arbitrary" or "any pattern works."  
     - **Cost**: Framing first would spoil the cold struggle; doing it later risks confusion.

  4. **Illustrate Multiple Invariants (10 minutes)**  
     - **What**: Present a second problem with two sets:  
       - Left: Blue squares, red circles.  
       - Right: Red squares, blue circles.  
       Invariants: (A) "Left has circles only when red, squares only when blue" vs. (B) "Right has circles only when blue, squares only when red." Both fit, but only one is intended (e.g., "color-shape pairing").  
     - **Why**: Depends on framing. Shows that fitting examples (e.g., "all left are blue or red") isn’t grasping the concept (e.g., the pairing rule). Heads off the misconception that "any rule that fits is valid."  
     - **Cost**: If done before framing, the audience might dismiss multiple invariants as noise.

  5. **Distinguish Invariant vs. Arbitrary Split (10 minutes)**  
     - **What**: Present a third problem: Left has 3 stars, 3 hearts; right has 3 clouds, 3 suns—no invariant. Ask: "Is there a rule?" Reveal: "No, the split is arbitrary (e.g., 'drawn on Monday vs. Tuesday')."  
     - **Why**: Depends on the multiple-invariants step. Contrasts with earlier problems to clarify that invariants require a non-arbitrary concept. Heads off misconceptions like "every split has a rule."  
     - **Cost**: If done before multiple invariants, the audience might conflate arbitrary splits with accidental invariants.

  6. **Check for Understanding (10 minutes)**  
     - **What**: Present a new problem: Left—closed shapes (circle, square); Right—open shapes (line, arc). Ask each person to write:  
       - The invariant.  
       - If other invariants could fit (e.g., "all left shapes are curved?"—but squares aren’t).  
       - Whether the split is arbitrary.  
     - **Passing Answer**: "Closed vs. open shapes. Other invariants might exist (e.g., color if added), but this is the intended one. Split isn’t arbitrary—it’s a clear concept."  
     - **Failing Answer**: "Left has round shapes? (Fails—square isn’t round). Split feels random? (Fails—ignores the concept)."  
     - **Why**: Depends on all prior steps. Tests if they distinguish fitting (searching features) from grasping (identifying the concept).  
     - **Cost**: Skipping this risks admiring without internalizing.

  7. **Tie to AI Models (5 minutes)**  
     - **What**: Explain: "Like you in the cold start, models that 'fit' chase local patterns (e.g., 'jaggedness') and fail when examples change. Models that 'grasp' the invariant (symmetry) generalize better."  
     - **Why**: Depends on the check—uses their experience as analogy.  

  #### **Ruling on Your Candidate Example**
  **Use it to carry the session—it’s ideal for Step 1.**  
  - **Why it works**:  
    - **Must-haves**:  
      - Not solvable from one figure: Symmetry requires comparing multiple orientations.  
      - Verifiable in one sentence: "Left lacks mirror symmetry; right has at least one symmetry axis."  
      - No technical vocabulary: Use "mirror symmetry" but define it simply ("If you reflect it, it looks the same").  
      - No local/counting features: Your design ensures no strokes, density, or irregularities distinguish them.  
      - Tempting invariant defeated: E.g., "Left looks hand-drawn" fails because all figures share the same style/complexity.  
    - **Why it carries**: It embodies the core lesson—grasping symmetry vs. fitting features.  
  - **If not used**: Replace with a problem where the invariant is relational (e.g., "shapes enclosing a dot"), but symmetry is more intuitive for novices.  

  #### **Misconceptions and When to Head Them Off**
  - **"Rules are about obvious features (e.g., shape, size)"**: Heads off in **Step 2 (Debrief)** when refuting guesses like "left is jagged" with your symmetric figures that look equally complex.  
  - **"Any pattern that fits examples is valid"**: Heads off in **Step 4 (Multiple Invariants)** by showing color-shape pairings—both fit, but only one is the "point."  
  - **"Every left/right split has an invariant"**: Heads off in **Step 5 (Arbitrary Split)** by contrasting with the star/cloud example.  
  - **Confusion if steps reordered**: If Step 5 (arbitrary split) came before Step 4 (multiple invariants), the audience might think multiple invariants imply arbitrariness.  

  #### **What to Declare Off-Limits**  
  Openly state: "We won’t dive into machine learning technicalities (e.g., neural nets), advanced math (e.g., group theory), or Bongard problem history. Focus on the core idea: grasping vs. fitting."  

  #### **One-Line Summary**  
  "Start cold to expose fitting, then reveal the invariant, then separate multiple fits from arbitrary splits—so the audience lives the AI’s challenge."  

  This plan ensures your colleagues experience the difference between fitting and grasping firsthand, with your candidate example as the anchor. The sequencing is load-bearing: cold start first, framing after, then multiple invariants before arbitrary splits.
