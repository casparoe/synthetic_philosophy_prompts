  We are designing a 50-minute session to introduce Bongard problems to a non-mathematical audience, with the goal of illustrating the difference between grasping a concept and merely fitting examples.

  Key constraints:
  - Audience: 15 colleagues (editors, photographer, fact-checkers); intelligent but no math beyond high school, no prior exposure to Bongard problems.
  - Goal: Enable them to see for themselves the difference between grasping a concept and pattern-matching.
  - We have a projector and 50 minutes.

  The plan must include:
  1. Order of components and why each depends on the previous.
  2. Decision on whether to start with a problem cold or with framing, and the costs of each.
  3. The single example that carries the session (we are given a candidate and must rule on it or replace it).
  4. Misconceptions and when to head them off.
  5. A check at the end to see if the idea has landed, with examples of passing and failing answers.
  6. What to declare off-limits for this audience.
  7. Incorporate two further things:
     a. Distinction between a problem with an invariant and one without (arbitrary split).
     b. Recognition that multiple invariants can fit the examples, but only some are the point.
     We must build moments for each and note the order.

  Closing: One-line summary of the load-bearing sequencing decision.

  Let's break it down.

  **Sequencing Decision: Cold Start vs. Framing First**

  We must decide whether to present a Bongard problem cold (without any explanation) or to frame first.

  - Cold Start:
    - Pros: Engages immediately, creates curiosity, and allows the audience to experience the initial confusion and then the "aha" moment. This mirrors the learning process and sets up the problem as a puzzle to solve.
    - Cons: Without context, they might not know what to do, leading to frustration. They might also jump to superficial features and miss the point.

  - Framing First:
    - Pros: Sets expectations and provides a mental framework. They know what a Bongard problem is and what to look for (an invariant that separates left and right).
    - Cons: Might bias their thinking by telling them the answer is an invariant. They might start looking for invariants without the struggle, which could undermine the experience of discovering the difference between pattern-matching and concept-grasping.

  Given the goal of having them see the difference between pattern-matching and concept-grasping, the cold start is more effective because it allows them to experience the initial pattern-matching (which might fail) and then the shift to concept-grasping. However, we must manage the risk of frustration.

  **Proposed Order and Why:**

  1. **Cold Start (5 minutes):** Present the first Bongard problem (without calling it that) as a puzzle. Show the 12 figures (6 on left, 6 on right) and ask: "What rule separates the left side from the right side?" 
     - Why: This creates an immediate engagement and allows the audience to try pattern-matching (which is what a model without concept-grasping might do). They will likely try to find simple features (like counting lines, looking for symmetry, etc.). This sets up the problem.

  2. **Debrief the Cold Attempt (5 minutes):** Ask the room for their initial ideas. They will probably suggest features that work for some but not all. Point out that they are trying to find a rule that fits all examples. Then reveal that the rule is about mirror symmetry (as per the candidate example). 
     - Why: This shows that pattern-matching (without the concept) can be tricky and might lead to overfitting or missing the invariant. It also introduces the idea that the rule is a concept (symmetry) that is not immediately obvious from the features they were looking at.

  3. **Frame the Concept of Bongard Problems (5 minutes):** Now explain that this is a Bongard problem, designed to test pattern recognition and concept formation. State that the goal is to find an invariant that separates the two sets. Emphasize that an invariant is a property that holds for every example on one side and not the other. 
     - Why: After the cold attempt, they are primed to understand the framing. This step provides the vocabulary and context.

  4. **Present a Second Problem to Illustrate Multiple Invariants (10 minutes):** Show a second Bongard problem where there are multiple possible invariants that fit the examples. For instance, a problem where one set has triangles and the other circles, but also the triangles are all blue and circles red. However, the intended invariant might be shape, not color. 
     - Why: This step addresses the requirement to show that several invariants can fit, but only some are the point. It also highlights that without knowing the designer's intent, we might choose an invariant that is not the intended one. This leads to the distinction between arbitrary splits and ones with a clear concept.

  5. **Present a Problem Without a Real Invariant (10 minutes):** Now show a third problem where the split is arbitrary (or at least appears so). For example, the left side has a mix of shapes and colors with no clear rule. Ask if there is an invariant. Then reveal that there isn't one, or that the rule is trivial (like "is on the left"). 
     - Why: This builds the distinction between a problem with an invariant and one without. It shows that sometimes the split is arbitrary and there's no concept to grasp.

  6. **Check for Understanding (10 minutes):** Present a new Bongard problem (simple enough) and ask the audience to write down the invariant they think is the intended one. Then, have a few share. Also, ask if there could be other invariants that fit and if the problem has a non-arbitrary split. 
     - Passing answer: Correctly identifies the intended invariant and notes that there might be other accidental invariants but the split is not arbitrary because there is a clear concept.
     - Failing answer: Focuses on superficial features that don't hold for all, or says the split is arbitrary when it's not, or doesn't consider multiple invariants.

  7. **Tie to Models (5 minutes):** Explain how this relates to large models. A model that merely fits examples might find an invariant that is accidental (like color in the second problem) but misses the intended concept (like shape). A model that grasps the concept would get the intended invariant and generalize better.

