answer: |-
  ### 1. Essay Question
  **Analyse maxim M using Kant's first formulation of the Categorical Imperative: "In order to secure a comfortable life for myself, I will take more than my fair share from a shared, self-replenishing resource whenever I can do so without being noticed."**
  - First, justify whether the clause "without being noticed" is an essential component of the *maxim itself* or merely a *circumstance* affecting the action.
  - Second, determine whether universalising M would be self-defeating *in conception* (the action becomes impossible) or *in purpose* (the end becomes unattainable), or neither. Explain what this implies for whether M violates a perfect or imperfect duty.
  - Third, address the objection that the Categorical Imperative’s verdict depends entirely on how the maxim is described: is it "empty" (allowing any action) or "rigged" (forbidding any action)? Can M be described in a way that yields a determinate verdict?

  ---

  ### 2. Model Answer (Approx. 750 words)

  Maxim M appears to describe a self-serving action that avoids social scrutiny. To assess it under Kant’s Formula of Universal Law (FUL), we must first clarify its structure. The clause "without being noticed" is not a core component of the agent’s willed principle but a contingent *circumstance* enabling the action. The maxim’s essence is the agent’s resolution to secure comfort by taking excess from a replenishing commons *when conditions allow secrecy*. If "without being noticed" were intrinsic to the maxim, the universalised scenario would absurdly require all takers to be undetected simultaneously, rendering the action incoherent. But this conflates the condition of acting with the principle of acting. The true maxim here is: *I will take more than my fair share from a shared, self-replenishing resource to secure a comfortable life for myself*. The secrecy clause is a situational filter for application, not part of the underlying rule. This distinction is crucial, as it shapes how universalisation unfolds.

  Universalising this core maxim reveals a contradiction, but *in the will* (purpose), not in conception. The action itself—taking excess resources—remains logically possible if everyone does it (contradiction in conception). A world of universal overuse is conceivable: individuals could physically grab extra resources. However, the *purpose* of securing a "comfortable life" via this method would be undermined. "Self-replenishing" implies the resource can sustain itself *only if usage patterns respect its renewal rate*. Universal overconsumption would deplete or degrade the resource, making "comfortable life" through its use unattainable. The agent cannot rationally will this universal law because it destroys the very condition (a functional commons) that makes their project feasible. Thus, M fails the FUL test due to a contradiction in the will, revealing an imperfect duty to avoid such actions.

  This verdict illuminates the type of duty violated. Contradictions in conception (e.g., false promising making promises impossible) yield perfect duties—strict prohibitions. Contradictions in purpose reveal imperfect duties—broad obligations to adopt or avoid certain ends, allowing latitude in execution. M’s universalisation destroys the *end* (sustained comfort via the commons) but not the *action-type* (taking extra). Hence, M violates an imperfect duty. We have a duty not to adopt the *maxim* of systematically exploiting common resources for private gain, as this end, when universalised, is self-frustrating. However, occasional or necessary overuse might not violate this duty if not systematised into a self-serving principle.

  This analysis confronts the "empty or rigged" objection. FUL demands maxims be described as the agent’s *subjective principle of action*, honestly reflecting their underlying reason for acting. If agents frame maxims hyper-specifically ("take extra only on Tuesdays while whistling"), universalisation may seem permissible due to triviality (emptiness). If framed overly generally ("pursue self-interest"), it may appear universally destructive (rigged). A maxim yields a determinate verdict only if it is (1) *action-guiding* (specifying means and ends), (2) *rationally willable* as a universal law, and (3) described without ad hoc clauses that obscure the agent’s true intention. M, stripped of the contingent secrecy clause, meets these criteria. Its means (taking excess from a commons), end (securing comfort), and reliance on the resource’s stability are clear. The contradiction emerges not from biased framing, but from the inherent incompatibility between the *systematic* pursuit of this end and its universal adoption. The test is not rigged: it exposes a structural flaw in the maxim itself when honestly assessed as a universal law. Agents cannot "game" FUL by adding clauses like "without being noticed" because these are recognised as circumstances, not core intentions. Thus, M demonstrates FUL’s power to diagnose maxims that, if universalised, undermine the conditions of their own success. It fails because the agent’s project depends on a stable commons that their universalised maxim would destroy.

  ---

  ### 3. Marking Scheme (Total 25 marks)

  | **Criterion & Marks** | **What a Strong Answer Does**                                                                 | **Common Errors**                                                                                                |
  | :------------------- | :-------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **1. Maxim Interpretation (5 marks)** | Clearly argues whether "without being noticed" is part of the maxim (intention) or a circumstance. Justifies choice based on Kant’s view of maxims as principles of volition. | Assumes the clause is part of the maxim without justification, or ignores the ambiguity entirely. Fails to define "maxim". |
  | **2. Type of Self-Defeat (5 marks)** | Correctly identifies whether universalisation causes contradiction *in conception* (action impossible) or *in purpose* (end unattainable) for M. Explains *why* (e.g., depletion of resource). | Confuses conception/purpose. Claims contradiction in conception (e.g., "taking becomes impossible"). Fails to link resource dynamics to the end. |
  | **3. Duty Type (5 marks)** | Infers the duty type (perfect/imperfect) from the self-defeat type. Explains why M violates an *imperfect* duty (end-focused, allows latitude). | Misassigns duty type (e.g., calls it perfect). Fails to connect self-defeat to duty category. Ignoires Kant's distinction. |
  | **4. Empty/Rigged Objection (5 marks)** | Engages the objection directly. Explains what makes a maxim description "fair" for FUL (action-guiding, core intention). Argues M *can* yield a determinate verdict when stripped of contingent clauses. | Merely describes the objection. Claims FUL *is* rigged/empty for M without analysis. Fails to specify how M avoids the problem. |
  | **5. Structure & Kantian Fidelity (5 marks)** | Logically organised; uses Kant’s terminology accurately (FUL, maxim, contradiction, perfect/imperfect duty); avoids external sources; answers all parts. | Disorganised; misuses terms (e.g., "hypothetical imperative"); omits a required element; relies on non-Kantian concepts. |
