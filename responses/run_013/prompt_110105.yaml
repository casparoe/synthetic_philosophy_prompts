  Consider two episodes in the history of astronomy, both involving the same astronomer. In the 1840s, Le Verrier inferred an unseen planet from irregularities in the orbit of Uranus, and the planet was then observed and named Neptune. In 1859, he explained the anomalous precession of Mercury's perihelion by positing an unseen planet inside Mercury's orbit, Vulcan, which was never found, the anomaly eventually being absorbed by general relativity. Analyze this pair through the problem of induction and Goodman's grue: say what was being projected in each case and whether any standard account of confirmation could have distinguished them in advance, what the pair does to the entrenchment response to grue and to solutions of induction that rest on a track record of predictive success, and finally where the grue framing itself misdescribes what the astronomers were actually doing. Answer as exactly five numbered points, each a sentence or two, with no introduction or conclusion.
