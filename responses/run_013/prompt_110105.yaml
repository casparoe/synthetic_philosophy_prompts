answer: |-
  1.  In both cases, Le Verrier projected the existence and gravitational influence of an unseen planet (Neptune, Vulcan) based on the uniformity of Newtonian gravitational theory to explain orbital anomalies (Uranus's irregularities, Mercury's precession).
  2.  No standard account of confirmation (e.g., hypothetico-deductive, instance confirmation, Bayesianism) could have reliably distinguished the successful Neptune projection from the unsuccessful Vulcan projection in advance, as both hypotheses equally saved the Newtonian phenomena and generated novel predictions.
  3.  The Vulcan failure directly challenges Goodman's entrenchment response to grue, as the predicate "unseen perturbing planet" was highly entrenched after Neptune's success yet proved non-projectible in the structurally similar Mercury case.
  4.  This pair undermines solutions to induction relying solely on a track record of predictive success, as the highly successful method of inferring planets from orbital anomalies (validated by Neptune) led to a demonstrably false prediction (Vulcan).
  5.  The grue framing misdescribes the astronomers' work by focusing solely on the projection of the *existence* predicate ("planet here"), obscuring their actual reliance on projecting a specific *causal mechanism* (Newtonian gravity) which was incomplete, not arbitrary like grue.
