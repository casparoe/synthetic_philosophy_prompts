prompt: |-
  I keep running into a pattern in debates about how much we owe the distant future, and I have no name for it. The setup is familiar: because the far future could contain astronomically many people, even a minute chance of improving it is said to outweigh any present sacrifice. Then a critic objects that we are probably living in a computer simulation, so our efforts never reach the real future, and the stakes collapse. Then a defender turns the same premise around: if simulations are common, then most of the value there will ever be sits inside simulations, so our being simulated multiplies the stakes instead of dividing them. I know this is in the neighborhood of the doomsday argument, but that concerns how long our species lasts, not whether the future counts for more or less. What I want named is the shape of the argument itself: the same fact — that we are one unremarkable instance of a far larger population of observers, most of whom are unlike us — is deployed in one breath to deflate the value of the future and in the next to inflate it, and nobody reconciles the two. My own guess is that the two moves differ only in whether value is counted per world or per observer, and that this is why the verdict flips, but I don't know whether that diagnosis is right, whether anyone has drawn the distinction, or what to call the phenomenon if they have. Tell me: is there an established concept here, and if so, exactly where does it fall short of what I've described? If not, coin a term, define it, and mark its edges — in particular, how it differs from the doomsday argument and from ordinary probability discounting. Give a definite answer, with your reasons, rather than a survey of the options, in no more than 350 words.
reasoning: |-
  Okay, the user is describing a recurring pattern in philosophical debates about our obligations to the distant future. They've noticed a back-and-forth where one side argues that the massive potential population of the future makes even small improvements extremely valuable, while the other counters with simulation theory to diminish that value, only to have the first side flip the simulation premise to argue the opposite. The user wants to know if this specific argument structure has a name and how it differs from similar concepts like the doomsday argument.

  Hmm, this is quite niche. The user seems deeply familiar with futurist ethics debates - likely an academic or seriously engaged autodidact. Their frustration about the lack of reconciliation between the two moves is palpable. They've even developed their own hypothesis about per-world vs per-observer valuation being the crux.

  Let me mentally scan related concepts. The doomsday argument is adjacent but concerns extinction risk, not value accounting. Anthropic shadow deals with risk perception, not this valuation flip. Bostrom's simulation hypothesis is the premise but not the argument structure. Total vs average utilitarianism is relevant but too broad.

  *scratches head* The core issue really is that both sides anthropically select different reference classes: the "deflator" counts real-world observers, while the "inflator" counts all conscious experiences. The user's per-world/per-observer distinction seems correct. When the deflator says "our actions likely don't affect the real world," they're privileging the base reality as the unit of value. The inflator counters by saying "but simulated experiences matter equally," shifting to individual observers as value-bearing units.

  Since no established term exists, we should coin one. "Anthropic value accounting paradox" captures the role of observer-relative framing but is clunky. "Simulation valuation flip" is more specific but narrow. Best option might be "reference class volatility in anthropic ethics" - precise but academic. For accessibility, perhaps "the two-faced anthropic argument" with explanation.

  *checks word count* Need to emphasize how this differs from standard discounting (which deals with time, not observer classes) and the doomsday argument (which uses similar anthropic math but for survival odds). The key distinction is the valuation unit toggle - same premise, opposite conclusions based on whether we count worlds or minds.

  User deserves kudos for spotting this rhetorical pattern. Their diagnosis feels correct, and naming it could advance these debates. Should offer the new term but stress that the deeper contribution is exposing the inconsistent valuation frameworks.
answer: |-
  The phenomenon you describe has no established name. It represents a **reference class conflict in anthropic value accounting**, specifically within simulation ethics.

  **Defined:** This is the **Anthropic Valuation Flip (AVF)**: The contradiction arising when the same anthropic premise (that we are typical observers within a vast, varied population of observers) is used to argue for opposing conclusions about the value of future outcomes, depending solely on whether value is aggregated *per simulated world* or *per conscious observer*.

  *   **Deflation Move:** Assumes value accrues primarily to base reality. If we're simulated, our actions likely affect only our simulation, a tiny fraction of "real" futures. *Value aggregated per world.* Sacrifices seem futile.
  *   **Inflation Move:** Assumes value accrues equally to all conscious experiences, regardless of substrate. If simulations are common, most value exists *within* simulations. Our being simulated means our actions affect a vast simulated future. *Value aggregated per observer.* Sacrifices seem imperative.

  **Where it Falls Short/Edges:**
  1.  **Doomsday Argument (DA):** The DA uses anthropic reasoning to estimate *the duration* of our reference class (e.g., human civilization's lifespan). AVF uses anthropic reasoning to resolve *how much value to assign* to potential future states based on the *composition* of the reference class (simulated vs. base reality) and the unit of aggregation. DA concerns *how many* observers will exist; AVF concerns *which* observers count for value and how to sum that value.
  2.  **Ordinary Probability Discounting:** This discounts future value based on uncertainty about *whether* an outcome occurs or *when* it occurs. AVF discounts or inflates based on uncertainty about *the nature of our own existence* (simulated/real) and the resulting *reference class for value aggregation*. It questions *which* futures our actions can affect and how to weigh them, not just the likelihood of future scenarios existing.

  **Your Diagnosis:** Correct. The flip hinges entirely on the unit of aggregation: per-world (privileging base reality) vs. per-observer (privileging conscious experience). The unresolved conflict exposes a fundamental ambiguity in anthropic ethics: what is the correct "currency" for value when observers exist across vastly different ontological levels? The AVF highlights that without resolving this ambiguity, anthropic premises yield contradictory value judgments.
