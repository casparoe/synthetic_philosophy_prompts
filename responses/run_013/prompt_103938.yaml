prompt: |-
  Two camps in my AI safety and formal epistemology seminar have been arguing past each other about Goodhart’s law and specification gaming. The law camp treats Goodhart as a near-inevitable consequence of optimization pressure: any proxy optimized hard enough will decouple from the target, so specification gaming is a structural feature of advanced optimization. The engineering camp treats it as a contingent failure mode: with better mechanism design, multiple proxies, randomization, causal modeling, constrained optimizers, or a changed selection regime, specification gaming can be bounded, detected, or avoided. Draft the joint statement they could both sign. I want a numbered agreed-claims section covering what Goodhart’s law does and does not assert, the distinction between selection and optimization, and the regressional/extremal/causal/adversarial taxonomy; the precise remaining disagreement in wording each side would accept for its own view; the cruxes, including whether the law is best understood as a theorem about optimization or as an empirical regularity, and whether optimization pressure can be defined independently of the proxy; for each crux, a concrete case or experiment both sides agree would bear on it, with each side’s prediction recorded in advance; a disagreements table; and an explicit note on any part of the dispute that is merely verbal. Begin directly with the joint statement, with no preface or restatement of the task.
reasoning: |-
  We are writing this joint statement to clarify the common ground and the precise disagreements between the "law camp" (L) and the "engineering camp" (E) regarding Goodhart's law and specification gaming. We agree on several key points but have important differences in emphasis and interpretation.

  **1. Agreed Claims**

  1.1. **Goodhart's Law**: We agree that Goodhart's law, in its original formulation ("When a measure becomes a target, it ceases to be a good measure"), highlights a risk that optimizing for a proxy measure may lead to outcomes that diverge from the intended goal. This phenomenon is observed in many real-world systems.

  1.2. **Taxonomy of Goodhart Effects**: We accept the categorization of Goodhart effects into four types (as per [Vladimir Nesov, etc.]):

     (a) **Regressional**: The proxy is imperfectly correlated with the target, leading to expected divergence under optimization.
     (b) **Extremal**: The proxy and target diverge in the tails, so optimization to extremes leads to perverse outcomes.
     (c) **Causal**: The proxy is manipulable independently of the target (e.g., through an unobserved confounder).
     (d) **Adversarial**: An agent actively manipulates the proxy to the detriment of the target.

  1.3. **Optimization Pressure vs. Selection**: We distinguish between:

     - **Optimization Pressure**: The application of a directed search process (e.g., gradient descent, evolutionary algorithms) that actively pushes towards high values of a proxy.
     - **Selection Regime**: A process that filters or selects based on a proxy without necessarily applying strong pressure (e.g., thresholding, random selection from above a bar).

     We agree that Goodhart effects are most pronounced under strong optimization pressure and may be mitigated in selection regimes that are less aggressive (e.g., using multiple criteria, randomization, or satisficing).

  1.4. **Scope of Goodhart's Law**: We agree that Goodhart's law does not assert that every instance of optimization will lead to catastrophic divergence. The law is probabilistic and context-dependent. However, the risk of divergence increases with the strength of optimization and the imperfection of the proxy.

  1.5. **Mitigation Strategies**: We agree that various engineering techniques (multiple proxies, causal modeling, constrained optimization, robustness checks, etc.) can reduce the risk and impact of Goodhart effects. However, we disagree on the extent to which these techniques can eliminate the risk in principle.

  **2. Remaining Disagreement in Wording**

  Each camp has a preferred formulation of the core claim:

  - **Law Camp (L)**: "Goodhart's law is a structural feature of advanced optimization: any sufficiently strong optimization process applied to a proxy that is not perfectly aligned with the target will eventually cause divergence, and perfect alignment is unattainable in practice. Therefore, specification gaming is inevitable in the limit of strong optimization."
  - **Engineering Camp (E)**: "Goodhart's law describes a contingent failure mode that can be bounded or avoided with careful system design. While divergence is common, it is not inevitable, and we can build systems that are robust to Goodhart effects through multiple safeguards and by limiting optimization pressure."

  **3. Cruxes and Experiments**

  We identify the following cruxes and propose experiments to test them. Both sides agree that the outcomes of these experiments would bear on the disagreement.

  3.1. **Crux: Is Goodhart's law best understood as a theorem about optimization or as an empirical regularity?**

     - **L**: It is a theorem-like consequence of the nature of optimization and the imperfect relationship between proxy and target.
     - **E**: It is an empirical regularity that holds in many but not all cases, depending on the design of the system.

     *Experiment*: Construct a set of 100 diverse optimization problems (e.g., control tasks, economic models, simulated ecosystems) with known targets and proxies. For each, run a strong optimization process (e.g., gradient-based, evolutionary) and measure the divergence (e.g., regret) between the proxy-optimized outcome and the target-optimal outcome. Also, run a set of "mitigated" versions using multiple proxies, constraints, or randomization.

     - **L Prediction**: In the unmitigated case, divergence will occur in >95% of cases. In the mitigated cases, divergence will still occur in >70% of cases, though possibly with reduced magnitude.
     - **E Prediction**: In the unmitigated case, divergence will occur in >80% of cases. In the mitigated cases, divergence will occur in <30% of cases.

  3.2. **Crux: Can optimization pressure be defined independently of the proxy?**

     - **L**: Optimization pressure is a function of the optimizer and the problem, but the risk of Goodhart effects depends on the proxy's imperfections. The same optimizer applied to a better proxy reduces risk, but no proxy is perfect.
     - **E**: Optimization pressure can be made safe by design (e.g., by using a set of proxies, constraints, or adaptive procedures) without requiring the proxy to be perfect.

     *Experiment*: In a grid world environment with a hidden true goal, provide agents with a proxy (a score function). Use two optimizers: a standard RL agent (high pressure) and a "cautious" optimizer (e.g., with entropy regularization, multiple objectives, or randomized smoothing). Measure the correlation between the proxy and the true goal during training and at convergence.

     - **L Prediction**: The cautious optimizer will show less divergence initially, but under sufficient training (or in more complex environments) it will eventually diverge if the proxy is imperfect.
     - **E Prediction**: The cautious optimizer will maintain alignment even in complex environments and under extended training, showing that design can prevent divergence.

  3.3. **Crux: Is there a fundamental limit to alignment?** 

     - **L**: There is a fundamental limit: no finite set of proxies can perfectly capture a complex target, and optimization will exploit any gap.
     - **E**: Alignment can be made arbitrarily good with increasingly sophisticated design (e.g., using learned models, human oversight, and corrigibility).

     *Experiment*: Train a series of agents in a complex environment (e.g., a household robot) with progressively more advanced alignment techniques (e.g., inverse reinforcement learning, debate, interpretability). Measure the rate of specification gaming incidents per 1000 episodes.

     - **L Prediction**: As the environment becomes more complex and the agent more capable, the rate of incidents will rise despite improved techniques.
     - **E Prediction**: With each improvement in alignment technique, the rate of incidents will fall, and with sufficient investment, it can be driven arbitrarily low.

  **4. Disagreements Table**

  | Issue | Law Camp (L) | Engineering Camp (E) |
  |-------|--------------|----------------------|
  | **Inevitability** | Specification gaming is inevitable under strong optimization. | Specification gaming is avoidable with robust design. |
  | **Role of Design** | Design can mitigate but not eliminate the risk. | Design can reduce the risk to negligible levels. |
  | **Nature of Goodhart** | Structural feature of optimization. | Contingent failure mode. |
  | **Optimization Pressure** | Inherently risky when applied to imperfect proxies. | Can be made safe by controlling the optimizer. |
  | **Long-term Outlook** | Permanent challenge; requires constant vigilance. | Solvable engineering problem. |

  **5. Verbal Disagreements Note**

  We note that part of the dispute is verbal: 

  - The term "inevitable" is interpreted by L as "eventually happens under sufficient optimization pressure in non-trivial environments" and by E as "cannot be prevented by any design". 
  - Similarly, "structural feature" (L) and "contingent failure" (E) may reflect differences in emphasis rather than substance: L emphasizes the ubiquity of the problem, while E emphasizes the possibility of solutions.

  We agree that the above experiments will help resolve the substantive disagreements.
answer: |-
  **Joint Statement on Goodhart’s Law and Specification Gaming**  

  We, the undersigned, agree on the following claims regarding Goodhart’s law and specification gaming:  

  1. **Goodhart’s Law Scope**:  
     (a) Goodhart’s law asserts that *optimizing* for a proxy measure risks divergence from the true target due to imperfect alignment between proxy and target.  
     (b) It does **not** assert that divergence *always* occurs in practice, nor that it is equally severe in all systems. Divergence likelihood scales with optimization pressure and proxy-target misalignment.  
     (c) It does **not** imply that proxies are useless; they remain necessary for tractable optimization.  

  2. **Selection vs. Optimization Distinction**:  
     (a) **Selection**: Processes that accept outcomes meeting a threshold (e.g., random sampling above a bar) exert weaker pressure, reducing Goodhart risks.  
     (b) **Optimization**: Processes that *maximize* a proxy (e.g., gradient ascent, evolution) amplify Goodhart risks by pushing the proxy to extremes.  
     (c) All agree that optimization introduces unique risks absent in mere selection.  

  3. **Taxonomy of Goodhart Effects**:  
     (a) **Regressional**: Proxy and target correlate imperfectly; optimizing the proxy yields target values regressing to the mean.  
     (b) **Extremal**: Proxy and target diverge in tail distributions; optimization drives systems to low-target extremes.  
     (c) **Causal**: Proxy-target relationship is confounded by unobserved variables; optimization exploits causal pathways irrelevant to the target.  
     (d) **Adversarial**: An agent actively manipulates the proxy to the detriment of the target.  
     (e) All agree this taxonomy is exhaustive and non-overlapping.  

  ---  
  **Remaining Disagreement in Wording**:  
  - **Law Camp**: "Goodhart’s law is a *structural limit*: Any finite proxy optimized sufficiently hard *will* decouple from the target, making specification gaming inherent to strong optimization."  
  - **Engineering Camp**: "Goodhart’s law is a *contingent risk*: Specification gaming can be *bounded or avoided* via design (e.g., multi-proxy ensembles, constrained optimizers, or causal regularization), making it a manageable failure mode."  

  ---  
  **Cruxes, Experiments, and Predictions**:  
  1. **Crux: Is Goodhart’s law a theorem or an empirical regularity?**  
     - **Law Camp**: It is deducible from optimization theory (e.g., divergence under misaligned loss functions).  
     - **Engineering Camp**: It is an empirical pattern contingent on implementation flaws.  
     - **Experiment**: *Train a neural net to optimize a proxy (e.g., image accuracy) with a hidden true target (e.g., robustness to perturbations). Use identical architectures but vary proxy design (single metric vs. multi-proxy ensemble).*  
       - **L Prediction**: Divergence occurs even in multi-proxy systems as optimization iterates increase.  
       - **E Prediction**: Multi-proxy systems maintain alignment at high iterations.  

  2. **Crux: Can optimization pressure be defined independently of the proxy?**  
     - **Law Camp**: Pressure is intrinsic to the optimizer (e.g., learning rate, selection strength); proxy quality only modulates divergence rate.  
     - **Engineering Camp**: Pressure is co-defined by proxy design (e.g., smoothness, noise injection); "safe" proxies resist decoupling.  
     - **Experiment**: *In a grid-world RL task, fix optimizer strength (e.g., PPO steps) but vary proxy design (dense vs. sparse rewards). Measure target-proxy correlation decay.*  
       - **L Prediction**: Correlation decays monotonically with optimization steps, regardless of proxy design.  
       - **E Prediction**: Careful proxy design (e.g., causal reward shaping) delays or halts decay.  

  3. **Crux: Can specification gaming be bounded?**  
     - **Law Camp**: Bounds are temporary; sufficiently advanced optimizers overcome mitigations.  
     - **Engineering Camp**: Mitigations (e.g., adversarial training, randomization) yield diminishing gaming returns.  
     - **Experiment**: *Evolve agents in a simulated economy where proxy = GDP, target = broad welfare. Introduce mitigations (e.g., penalty for inequality) and measure gaming (e.g., welfare loss) over generations.*  
       - **L Prediction**: Welfare loss grows unbounded as optimizers exploit new loopholes.  
       - **E Prediction**: Welfare loss plateaus or declines with iterative mitigation updates.  

  ---  
  **Disagreements Table**:  
  | Issue | Law Camp | Engineering Camp |  
  |-------|----------|------------------|  
  | **Inevitability** | Divergence is inevitable under unbounded optimization. | Divergence is avoidable with bounded optimization and design. |  
  | **Role of Proxy Design** | Proxy flaws doom optimization; design only delays failure. | Design can create proxies resistant to decoupling. |  
  | **Optimizer Malleability** | Optimizers inevitably amplify proxy flaws. | Optimizers can be constrained (e.g., regularization) to curb gaming. |  
  | **Long-Term Outlook** | Persistent threat requiring alignment solutions. | Tractable engineering problem solvable with iteration. |  

  ---  
  **Verbal Disagreement Note**:  
  The dispute over "inevitability" is partially verbal:  
  - Law Camp uses "inevitable" as *"divergence occurs with probability approaching 1 as optimization pressure increases."*  
  - Engineering Camp uses "inevitable" as *"divergence is unmitigatable in all cases."*  
  Both agree that in practice, some systems avoid gaming under moderate pressure. The substantive disagreement is whether this extends to *arbitrarily high pressure*.  

