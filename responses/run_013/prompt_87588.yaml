  Regarding memory, Cicero treats it as a reliable ledger, but Bergman shows it as uncontrollable and accusatory. The examination dream sequence where Borg fails to read the inscription seems particularly damning for Cicero's model. I should consider how this affects Cicero's "harvest" metaphor.

