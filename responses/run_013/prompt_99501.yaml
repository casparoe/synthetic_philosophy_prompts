answer: |-
  ## Research Proposal: Dutch Books and Group Credences – Probing the Limits of Coherence Arguments

  **Project Title:** Aggregation Rules Under the Lens: A Formal Investigation of Dutch Book Arguments for Collective Credences

  **1. Research Question and Context:**  
  Dutch book arguments (DBAs) purport to demonstrate the irrationality of incoherent (non-probabilistic) credences for individual agents: if your degrees of belief violate the probability axioms, a cunning bookie can construct a set of bets you deem individually fair, but which collectively guarantee your loss. This project investigates the contentious extension of DBAs to *collective entities* such as committees, juries, prediction markets, or model ensembles. Such groups often produce aggregate credences (e.g., a committee's reported confidence, a market price), yet they lack a single mind, unified utility function, or unambiguous mechanism for "accepting" bets. 

  **The Core Question:** Under what conditions, if any, can a Dutch book argument compellingly demonstrate the irrationality of incoherent *aggregate* group credences? Specifically, does the existence of a "group Dutch book" reveal a flaw in the group's collective epistemic state, or does it fundamentally expose a vulnerability inherent in the aggregation rule itself?

  **2. The Gap in Existing Literature:**  
  Current treatments of group DBAs often suffer from one of two shortcomings:
  *   **The Group-Agent Assumption:** Discussions frequently presuppose the group *is* a rational agent, thereby assuming the very rationality constraints (like coherence) that the DBA is meant to justify. This renders the argument circular or question-begging.
  *   **Reduction to Individuals:** Alternatively, arguments focus solely on the potential for DBAs against individual *members* of the group. While important, this sidesteps the core issue: the purported rationality or irrationality of the group's *aggregate output* as an entity in its own right. The distinctive nature of the "group credence" and *how the group acts upon it* remains inadequately addressed.

  The crucial lacuna is a rigorous analysis that treats the group's aggregate credence and its bet-acceptance mechanism as distinct, formal features derived from individual inputs and a specific aggregation rule, without prematurely anthropomorphising the group.

  **3. Methodology:**  
  This project will adopt a formal modelling approach, building upwards from the individual DBA to minimal group structures:

  1.  **Deconstructing the Individual DBA:** Precisely state every assumption underpinning the standard DBA:
      *   **Credence Representation:** Degrees of belief as fair betting odds.
      *   **Fairness:** A bet is fair iff expected utility = 0 (assuming linear utility in stakes).
      *   **Acceptance:** The agent is willing to take either side of any fair bet.
      *   **Dutch Book Construction:** A finite set of bets, each fair given the agent's credences, guaranteeing a net loss *for the agent* across all possible states.

  2.  **Modelling Collective Credence & Action:** Define a minimal formal group model comprising:
      *   A finite set of individuals, each with coherent/incoherent credences over a finite state space and linear utility in money.
      *   An **Aggregation Rule (AR):** A function mapping individual credences to a single aggregate credence for each proposition.
      *   An **Acceptance Rule (AcR):** A mechanism defining what constitutes "the group accepting a bet". Crucially, this is distinct from the AR. Examples to be modelled:
          *   *Majority Acceptance:* The group accepts a bet iff a majority of members individually accept it.
          *   *Treasurer Model:* An appointed individual (the treasurer) accepts bets deemed fair *based solely on the aggregate credence*.
          *   *Weighted Vote:* Members vote on accepting specific bets; the group accepts if the vote passes (e.g., simple majority, weighted by confidence/stake).

  3.  **Constructing Group Dutch Books:** For each (AR, AcR) pair:
      *   Define "fairness for the group" operationally via the AcR (e.g., a bet is "group-fair" if the AcR leads the group to accept it).
      *   Attempt to construct a Dutch Book: A set of bets, each "group-fair" (accepted via AcR), that *guarantees a net monetary loss for the group treasury* (or equivalent collective pot) regardless of the state.
      *   Crucially, analyse *why* a book succeeds or fails. Is the trigger the incoherence of the aggregate credence (AR) or a specific vulnerability of the AcR?

  4.  **Comparative Analysis:** Compare results across the different (AR, AcR) pairs. Identify necessary/sufficient conditions on the AR and AcR for the existence of a group Dutch book targeting aggregate incoherence.

  **Why this Approach?**  
  *   **Focus on the Core Mechanism:** Starting from first principles forces explicit articulation of often-implicit assumptions, particularly the separation of aggregation and action. Alternatives like group-agent theory often bundle these, while judgment aggregation typically focuses on logical consistency of binary judgments, not probabilistic coherence and its direct link to betting behaviour.
  *   **Precision and Tractability:** Building minimal models allows for clear proofs and identification of the exact drivers of vulnerability.
  *   **Directly Tests the Hunch:** This method is explicitly designed to isolate whether the book targets the AR output or the AcR mechanism.

  **4. Expected Outcomes and Significance:**
  *   **Primary Outcome:** A formal characterisation establishing under which combinations of Aggregation Rules and Acceptance Rules a Dutch book can be constructed that genuinely targets the incoherence of the *aggregate credence* itself, versus those where the book inherently exploits the specific AcR.
  *   **Result Forms:**
      *   **Conditional Result (Success):** "Group coherence (probabilistic aggregation) is necessary and sufficient to immunise against group Dutch books *if and only if* the Acceptance Rule has property X and the Aggregation Rule has property Y."
      *   **Negative Result (Failure):** A demonstration that, under plausible separation of AR and AcR, a group Dutch book *always* fundamentally exploits the AcR, not the aggregate credence's incoherence per se. The DBA framework cannot be straightforwardly extended to criticise group credences as irrational.
      *   **Mixed Result:** Vulnerability depends strongly on the specific AcR chosen, with no single, normatively compelling AcR identified.
  *   **Significance:** This project challenges a potential foundational justification for demanding probabilistic coherence in group outputs (e.g., in formal epistemology, social choice, or machine learning ensemble methods). It clarifies whether critiques of incoherent market prices or committee judgments via DBAs are valid epistemic criticisms or merely highlight pitfalls of specific decision procedures. The results will inform debates on the nature and rationality of collective belief.

  **5. Scope Management and Feasibility:**  
  A semester project (6000-8000 words) necessitates strict scope control:
  *   **Focus:** Analyse **2-3 core (AR, AcR) pairs** in depth (e.g., Majority Acceptance with Linear Averaging AR; Treasurer Model with Median AR; Weighted Vote with Prediction Market-like AR). More complex rules or infinite state spaces are deferred.
  *   **Core Task:** Rigorous Dutch book construction/immunity proof for these models is the *essential deliverable*. Extensive literature review or exploration of all possible ARs/AcRs is secondary.
  *   **Cut if Necessary:** If time pressures arise, a deep dive into **two contrasting pairs** (e.g., Majority vs. Treasurer) providing clear, opposing results would still yield significant, publishable insights. The comparative analysis drives the core argument.
  *   **Realistic Timeline:** Weeks 1-3: Literature & Individual DBA formalisation. Weeks 4-7: Model building & Dutch book construction for Pair 1. Weeks 8-10: Construction for Pair 2 (and start Pair 3 if feasible). Weeks 11-13: Analysis, writing, refinement.
  *   **Flagged Assumptions/Pitfalls:**
      *   **"Guaranteed Loss":** Defining the group's loss and who bears the cost is non-trivial (shared treasury? individual losses summed?). Clarity here is paramount.
      *   **"Fairness" Definition:** Translating "fair given aggregate credence" into a rule individuals or a treasurer follow requires careful justification.
      *   **Linearity & Risk-Neutrality:** Assuming linear utility is standard but restrictive; acknowledging this limitation is vital.
      *   **AcR Complexity:** Finding a "natural" AcR that isn't demonstrably flawed *a priori* might be harder than anticipated. The Treasurer model is cleanest but perhaps least "group-like"; Majority Acceptance might be messy. **This is the highest risk step.** Being prepared to conclude that the *choice* of AcR is the fundamental issue *is* a valid result.
      *   **Success Definition:** "Immunising aggregate incoherence" needs precise operationalisation relative to the model.

  **Conclusion:**  
  This project offers a timely and foundational investigation into the applicability of a core argument for probabilistic rationality to the increasingly important domain of collective belief. By rigorously separating the aggregation of credences from the mechanism for group betting decisions, it aims to determine whether Dutch book vulnerabilities truly indict incoherent group beliefs or merely reveal the limitations of specific collective decision procedures. The results will provide crucial clarity for epistemology, social choice, and related fields. The focused, formal methodology ensures a feasible and impactful semester project.
