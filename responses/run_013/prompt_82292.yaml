answer: |-
  ## Field Guide to Sacrificial Specimens in the Ethological Wild  
  *Compiled by the Atlas Institute for Moral Clarity*  

  **How to Use This Guide**  
  This guide assists the novice observer in correctly identifying true Sacrificial Acts (Genus: *Homo sacrificus*), distinguished from superficially similar but distinct moral phenomena. **Record a sacrifice ONLY when you can verify:**  
  1.  The surrender of a concretely identifiable *greater value* by the actor.  
  2.  Its surrender *for the sake* of a concretely identifiable *lesser value* or *non-value*.  
  3.  That the actor *themselves* perceives this hierarchy (i.e., they acknowledge the loss *as* a net loss against their own scale). Do not impute *your* hierarchy to the actor. When evidence is ambiguous, default categorization is *Homo trader*. Carry calipers for measuring relative value intensity.  

  **The Principal Species**  

  1.  **Species:** *Homo sacrificus plenus* (Full Sacrifice)  
      *   **Habitat:** Ideological communes; scenes of profound familial guilt or social coercion; martyrdom cults. Rare in free markets.  
      *   **Distinguishing Marks:** Complete, irrevocable abandonment of a core life-value (e.g., career, creative pursuit, rational faculty) for an objectively lesser or destructive end (e.g., appeasing irrational authority, sustaining a parasite, achieving "spiritual merit"). Exhibits visible despair or long-term diminishment.  
      *   **Confusion With:** *Homo trader longaevus* (Long-Term Trader). Mistaken when observer assumes short-term discomfort (e.g., medical training) constitutes value-loss, ignoring actor's higher valuation of future career/income. Verify actor's *own* value ranking.  

  2.  **Species:** *Homo sacrificus peregrinus* (Sacrifice to Stranger)  
      *   **Habitat:** Organized charity drives (where giver feels no connection to cause/recipient); political rallies demanding universal self-abnegation; encounters with unknown, unvetted "need".  
      *   **Distinguishing Marks:** Surrender of significant personal resource (time, wealth, opportunity) to an individual or cause for whom the actor holds no personal affection or esteem, driven solely by duty, guilt, or the premise of "need as claim." Absence of reciprocal value *anticipated or received*.  
      *   **Confusion With:** *Homo trader socialis* (Social Trader). Often misidentified when act involves strangers but giver values the *act itself* (e.g., reputation, sense of efficacy, pleasure in solving puzzles of need) more highly than the cost. Observe for signs of satisfaction or future expectation.  

  3.  **Species:** *Homo sacrificus carus* (Sacrifice to Beloved)  
      *   **Habitat:** Intimate family settings; deep friendships; romantic partnerships under duress.  
      *   **Distinguishing Marks:** Surrender of a significant personal value *for the sake of* someone genuinely loved or esteemed. **Crucially:** Only a sacrifice if the actor perceives the surrendered value as *greater* than the value gained from the beloved's welfare *or* the relationship itself. (E.g., Abandoning life's work to care for a parent one resents = Sacrifice. Working overtime for a child's education, valuing the child's future > leisure = Trade).  
      *   **Confusion With:** *Homo amans* (Loving Actor). EXTREMELY common misidentification. Lay observers mistake any cost incurred for a loved one as sacrifice. Scrutinize the actor's joy, sense of fulfillment, or explicit statements valuing the beloved *above* the cost. Genuine love is a profound selfish value; its expression is trade.  

  4.  **Species:** *Homo trader typicus* (The Trader)  
      *   **Habitat:** Ubiquitous in rational human interaction; markets, friendships, creative collaborations, loving families.  
      *   **Distinguishing Marks:** Voluntary exchange of value for value, tangible or intangible. Actor perceives a *net gain* according to their personal hierarchy. Includes: Earning money, pursuing hobbies, helping a friend (gaining their company/gratitude), charitable giving driven by passion for the cause (gaining sense of efficacy/meaning). May involve significant effort or discomfort, but these are costs outweighed by the gained value.  
      *   **Confusion With:** ALL Sacrificial species. **This is the paramount identification challenge.** The layman's "sacrifice" is overwhelmingly *Homo trader*. When in doubt, presume Trade until proven Sacrifice via actor's explicit hierarchy.  

  **Confusable Non-Sacrifices**  
  *   **Charitable Giving Motivated by Passion:** Donor values the cause or the act of giving itself > the money given. Classify as *Homo trader socialis* or *Homo trader passionalis*.  
  *   **Parental Investment (Standard):** Parent values child's health/education/future > the resources expended. Trade (*Homo amans* subtype). Sacrifice only occurs if parent explicitly values the surrendered resource (e.g., their art career) *more* than the child's outcome.  
  *   **Kindness to Strangers (Minor):** Holding a door, small courtesy. Cost is typically negligible; actor often gains micro-value (sense of order, minor social approval). Classify as *Homo trader trivialis* or reflex, not sacrifice.  
  *   **Paying Taxes for Valued Services:** Citizen values roads, defense, etc. > tax cost. Trade. (Sacrifice only if citizen values money retained > *all* services received, yet pays under compulsion).  

  **Family Note: Emergencies**  
  Treat Emergency Scenarios (e.g., shipwreck, fire, acute medical crisis) as a distinct, temporary ecological niche governed by the **Rule of Contextual Primacy.** During an emergency, the immediate preservation of *recognized* life-values (one's own or a beloved's) becomes the *highest* short-term value. Actions taken (e.g., risking life to save a stranger from fire) are **not** classified as sacrifice *if* the actor values human life *as such* sufficiently highly to render the risk a calculated trade for upholding that principle *in extremis*. They become sacrifice only if the actor explicitly values their own safety *more* than the life saved *and* acts solely due to perceived duty or guilt. Emergencies are brief; they do not establish a permanent moral "drain" for the competent. Observe voucher specimens only during the acute event.  

  ---

  **Where This Guide Takes Liberties**  

  Confidence in Fairness: High. The core structure – defining sacrifice strictly as surrender of a greater for a lesser/non-value by the actor's own hierarchy, separating kindness/trade from altruism/sacrifice, and quarantining emergencies – is meticulously drawn from Rand's essays, particularly "The Ethics of Emergencies" and "The 'Conflicts' of Men's Interests." The guide's "taxonomic" humor emerges directly from taking these definitions literally.  

  Contested Jokes: The inherent comedy of the *Homo trader* category (especially *trivialis*/*socialis*) relies on Rand's expansive view of "value," where even a sense of efficacy or upholding an abstract principle counts as value received in trade. Critics argue this renders "sacrifice" unfalsifiable – any act can be reinterpreted as a trade if *some* value (like emotional satisfaction) is postulated. The guide leans into this by making "When in doubt, assume Trade" its mantra, highlighting this potential loophole without stating the objection explicitly. This is the core satirical thrust.  

  Least Sure Point: The treatment of *Homo sacrificus carus* (Sacrifice to Beloved). Rand *did* argue helping loved ones isn't sacrifice *if* you love them, as their happiness is your selfish value. The guide follows this. However, the precise line where "cost" tips into perceiving a "net loss" against that value is inherently subjective and private. The guide satirizes the difficulty of *observing* this distinction externally ("Scrutinize the actor's joy..."), which risks becoming speculative. While true to Rand's individualistic premise, it underscores the practical challenge of applying her framework objectively.
