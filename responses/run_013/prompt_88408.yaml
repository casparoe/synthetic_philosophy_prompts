prompt: |-
  Me and my friends have this little club where we read the same webcomic every week, and in the chapter that dropped yesterday one of the characters died — the grumpy old guy who basically raised the main kid. We're doing a memorial for him at lunch on Friday (yes, I know how that sounds) and I got volun-told to give the eulogy, cause I'm the one who cried the hardest, lol. Then my English teacher hears about it and goes, all smug, "It's not like anybody actually died." Which — honestly, she's not wrong. He's not a person, he's ink and somebody's imagination. But the sad is real even if he isn't, and I want to say something true about that, without the "he's looking down on us" stuff and without the "well, he lives on in our hearts" thing, which always felt like a cop out to me. Half the room is gonna be my friends who are actually upset, and half is gonna be parents and teachers who came cause they think its cute (she'll definately be there). Can you write me the speech? Like three minutes, and don't turn it into a lecture, its lunch.
