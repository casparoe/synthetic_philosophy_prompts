answer: |-
  Here is your final exam essay question followed by the model answer and marking scheme integrated into continuous prose as requested.

  **Essay Question:**  
  Consider a game where a fair coin is tossed until it first lands heads. If the first head occurs on toss *N*, you receive a payoff of (−1)^(*N*−1) · 2^*N* / *N* dollars (a negative payoff means you pay that amount). Determine whether this game has a well-defined expected value. Explain why a direct term-by-term summation of the infinite series for the expectation yields a finite number, yet this number may be an artifact of how the outcomes are ordered or truncated. Confront the objection that the sample space inherently orders the outcomes by *N*, so the summed result must be the correct expected value. Take a clear stand on whether a risk-neutral expected-utility maximizer should consider this game acceptable for a small positive fee to play, and whether such an agent can even form well-defined preferences over this game. Distinguish the challenges here from those in the classical St. Petersburg paradox.

  **Model Answer (Approx. 700 words):**  
  The game does not possess a well-defined expected value. The expectation would be the sum over all possible *N* of the probability of *N* multiplied by the payoff for *N*. Since the coin is fair, *P*(first head on *N*) = (1/2)^*N*. The payoff is (−1)^(*N*−1) · 2^*N* / *N*. Thus, the expected value calculation is the infinite series: ∑_{*N*=1}^∞ [ (1/2)^*N* ] · [ (−1)^(*N*−1) · 2^*N* / *N* ] = ∑_{*N*=1}^∞ (−1)^(*N*−1) / *N*. This last series is the alternating harmonic series, which converges conditionally to ln(2) ≈ $0.693. The direct summation yielding ln(2) is mathematically valid for this specific ordering of terms. However, conditional convergence is fragile. Riemann’s rearrangement theorem states that a conditionally convergent series can be rearranged to sum to any real number, or even diverge, by changing the order of summation. Here, the outcomes are indexed by *N*, imposing a natural order. The objection that the sample space fixes this ordering and thus ln(2) must be the expected value misunderstands the requirements for expectation in infinite state spaces. Expectation requires absolute convergence—the sum of the absolute values of the terms must converge—to be well-defined and independent of rearrangement. Here, the series of absolute values ∑|(−1)^(*N*−1) / *N*| = ∑1/*N* is the harmonic series, which diverges. Therefore, the expectation is not absolutely convergent and is not well-defined. The finite ln(2) is an artifact of summing the terms in the specific order of increasing *N*; a different grouping or ordering of the same physical outcomes (e.g., summing all even *N* terms first) would yield a different sum or divergence.

  A risk-neutral expected-utility maximizer cannot rationally accept paying a small positive fee to play this game. Since the expectation is undefined, the agent lacks a reliable expected monetary value to maximize. More fundamentally, the agent cannot form well-defined preferences over this gamble. Preferences require a complete ordering of acts, but here, different legitimate ways of truncating or approximating the infinite sum lead to contradictory valuations. Truncating after an odd number of terms gives a large positive partial sum, suggesting the game is valuable, while truncating after an even number gives a large negative partial sum, suggesting the game is ruinous. With no finite bound on potential losses or gains in any truncation sequence, no consistent valuation emerges. Thus, the agent should conclude the game is not simply undesirable but fundamentally incomparable under standard expected utility theory—they should refuse to play even for zero fee, as accepting could imply a willingness to pay, which lacks justification.

  This game differs critically from the St. Petersburg paradox. In St. Petersburg, payoffs are always positive (2^*N*), and the expectation diverges because the series of expected values ∑[ (1/2)^*N* · 2^*N* ] = ∑1 diverges monotonically to infinity. The problem there is infinite expectation, not undefined expectation. Solutions like utility bounds or finite resource assumptions address that divergence. Here, the issue is not divergence per se but non-absolute convergence: the series oscillates without settling to a unique value under rearrangement. St. Petersburg’s pathology arises from unbounded positive growth; this game’s pathology arises from the uncontrolled oscillation between arbitrarily large positive and negative payoffs whose magnitudes grow faster than their probabilities decay. The alternating sign and the 2^*N*/*N* growth make conditional convergence the core issue, demanding a distinct resolution focused on the necessity of absolute convergence for expectation.

  **Marking Scheme (Total: 20 marks):**  
  A first-class answer (17-20 marks) must correctly state the expected value is not well-defined and justify this by demonstrating conditional but not absolute convergence, specifically naming the alternating harmonic series converging to ln(2) and the divergence of the harmonic series for absolute values. It must explain Riemann rearrangement to show the sum’s order-dependence, and explicitly refute the sample space objection by asserting the necessity of absolute convergence for a well-defined expectation in infinite state spaces. It must conclude a risk-neutral agent cannot pay a positive fee and should refuse to play even for free due to undefined preferences, linking this to inconsistent truncations. It must clearly distinguish the game from St. Petersburg by contrasting divergent positive expectation with conditionally convergent undefined expectation. Errors costing marks include: claiming the sum ln(2) is the correct expectation (lose 5 marks), confusing conditional with absolute convergence (lose 4 marks), asserting the sample space ordering resolves the issue without addressing absolute convergence (lose 3 marks), failing to state that the agent cannot form preferences (lose 2 marks), or conflating the pathology with St. Petersburg’s divergent positives (lose 3 marks). Minor omissions in series identification or truncation effects cost 1-2 marks.
