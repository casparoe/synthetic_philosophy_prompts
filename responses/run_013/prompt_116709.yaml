answer: |-
  ## The Regress

  Two things demand a relation  
  to cease being two, form a whole.  
  But that relation, an added act,  
  needs a bond  
  to cling. Call it forth—then  
  the debt begins.

  The debt: that bond  
  is a fourth thing. The relation  
  stands apart. Act  
  again? But the whole  
  fractures further. Then  
  the debt compounds.

  Compounding debt: the act  
  to bind the bond  
  to the first relation  
  requires—what?—a whole  
  new tier. Then  
  a further bond.

  But then, we say, the act  
  *is* the bond’s grip, the whole  
  achieved—no debt!  
  The relation  
  obtains: the bond  
  lives, not listed. Then?

  Then the bond,  
  though called the act,  
  becomes a thing. The debt  
  revives. The relation  
  must adhere. The whole  
  craves a new bond.

  The shattered whole  
  seeks a bond.  
  The debt swells. Then  
  we invoke an act  
  to mend the relation—  
  a fresh bond.

  Envoi:  
  We grasp the whole: then snaps the bond,  
  The act exacts a debt,  
  The bond becomes relation.  

  ---

  **End-words:** relation, whole, act, bond, then, debt.  
  - Candidate unifiers: relation (connects particulars), whole (unified entity), act (unifying action), bond (unifying link).  
  - Connector/next step: then (signals the regress's progression).  
  - Debt: embodies the infinite obligation.  

  **Permutation mirroring the regress:**  
  - Stanza 1: Initial unity (relation → whole → act → bond) interrupted by "then" and "debt".  
  - Stanza 2: Bond added → relation relisted → act reattempted → whole fractures → then → debt compounds.  
  - Stanza 3: Debt drives new act → bond redefined → relation still separate → whole tiered → then → bond recurs.  
  - Stanza 4 (escape): Act = bond’s grip → whole achieved → debt denied → relation obtains → bond not listed → then questioned.  
  - Stanza 5 (regress returns): Bond becomes thing → act reified → debt revived → relation unadhered → whole shattered → bond needed.  
  - Stanza 6: Whole broken → bond sought → debt swells → then invoked → act reattempted → relation → bond recurs.  
  - Envoi: Whole grasped → then breaks bond → act exacts debt → bond becomes relation (next step).  

  **Philosophical fidelity:**  
  - Contrast maintained: Lists (items) vs. unity (proposition) via accumulating end-words.  
  - Harmless escape (stanza 4) and return (stanza 5) depicted without naming Bradley or propositions.  
  - Movement alone reconstructs the regress: particulars implied ("two things"), unity sought ("form a whole"), unifier added ("bond"), infinite step ("then"), unresolved obligation ("debt").
