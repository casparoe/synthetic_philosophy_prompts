prompt: |-
  I'm taking a seminar on perception, and I've grown frustrated with how the disjunctivism debate is usually staged: everyone settles on the same few stock cases — the straight stick that looks bent in water, the hallucination that seems indistinguishable from a veridical perception, the brain in a vat — and then scores the theories against them, so that the entire argument turns on intuitions I neither share nor get to inspect. Before I read any more of it, I want the specification on the table first. So set out the desiderata that any theory of perceptual experience must meet if it is to give an adequate account of illusion and hallucination: the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse (say, between an experience's phenomenal character and its epistemic status, or between being caused by an object and being about one), and the background commitments it must stay consistent with — each requirement paired with the consideration that motivates it, so I can see why it is a genuine requirement rather than a preference of one camp. I care especially about which requirements are truly non-negotiable and which are merely articles of faith of the disjunctivist, the sense-datum theorist, or the intentionalist, and about whether some subset of the requirements is jointly unsatisfiable; if it is, that is the result I most want, since it would show that no theory in this area can have everything at once.

  To keep this from becoming a recital of textbook cases, please test the list against three cases I've been trying to construct myself, and treat them as constraints the theory has to handle rather than curiosities to be explained away. First, the split case: a subject has a single, seamless experience as of a red cube on a table, but in fact the cube is present and grey while the redness is contributed entirely by a malfunctioning implant wired into his visual pathway — is this one experience that is partly veridical and partly hallucinatory, two experiences, or a third kind, and does the theory's account of phenomenal character survive whatever answer it gives? Second, the prosthetic case: a subject with his eyes closed and a camera feeding signals directly into his visual cortex has a vivid, world-guided experience of the room in front of him — the signal is entirely accurate, but the ordinary perceptual route is bypassed, so does the theory classify this as perception, as hallucination, or as something its taxonomy was never built to hold? Third, the matching case: a hallucination whose content happens to be exactly right about the scene before the subject's eyes, so that nothing behavioral or epistemic distinguishes it from a perception, only its causal history. For each case, tell me which desideratum it bears on and whether it forces a choice among the contending theories or merely constrains them. Then, briefly, score the main families — naive and conjunctive disjunctivism, the sense-datum view, and intentionalism or representationalism — against the full list, though keep the weight on the criteria rather than the scorecard. Tell me how confident you are in each claim you make, and single out the one requirement or case where you are least sure you have it right.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly deep into perception theory, frustrated with how disjunctivism debates recycle the same tired examples. What they really want is a framework to evaluate theories on their own terms before diving into partisan arguments. 

  Hmm, their three custom cases are brilliant - especially the split case where redness comes from an implant while the cube shape is real. That's designed to explode any simple veridical/hallinary dichotomy. The prosthetic case with direct brain feeds challenges causal theories, while the matching hallucination tests epistemic vs metaphysical distinctions.

  I notice they're suspicious of "intuitions" in philosophy - smart. They want bare requirements first, then see which theories satisfy which. The real kicker is whether the requirements are jointly impossible - that'd explain why this debate never resolves.

  *flips mental notebook open* Let's build the desiderata systematically. First, non-negotiables: any theory must explain how perception gives world-access (phenomenality), allows justification (epistemology), and handles non-veridical cases without cheating. Then negotiables like whether experiences have object-dependent content - that's where camps divide.

  For the split case... *winces* This murders conjunctivism. If one experience has both veridical (shape) and non-veridical (color) elements, disjunctivists can't call it wholly one or the other. Intentionalism handles it cleanly though - just misrepresentation of color properties. 

  Prosthetic case is sneaky. Direct causal link but no eyes - is it perception? Naive realism fails hard here. Sense-datum theory might call it "indirect perception" but that feels forced. Best to treat it as perception* with an asterisk - shows we need graded criteria.

  Matching hallucination... *whistles* This is why disjunctivists insist perceptual justification requires actual objects. If hallucination coincidentally matches reality, you still can't know it - so epistemology isn't just about content. Intentionalists might bite the bullet here.

  *checks mental scorecard* Disjunctivism sacrifices explanatory unity for epistemic purity. Intentionalism gets messy cases right but makes perception feel too "internal". Sense-data... well, it handles hallucinations but at what cost? 

  Biggest uncertainty? Whether phenomenal character *must* be causally responsive to objects (prosthetic case). I lean yes but... *shrugs* maybe not. User should poke that weak spot.

  Most satisfying realization: yes, the requirements conflict! That's why no theory wins clean. User's frustration is justified - the field's stalemate isn't accidental.
answer: |-
  Below is a systematic breakdown of desiderata for theories of perceptual experience, tested against your cases and scored against major theories. Requirements are categorized as **non-negotiable** (grounded in uncontested phenomena) or **negotiable** (theory-dependent). Conflicts are identified where they arise.

  ---

  ### **I. Core Desiderata for Theories of Perceptual Experience**  
  *(Non-negotiables marked **)***

  1. **Phenomenal Character Specification (**)**  
     - **What it demands**: Explain the *subjective feel* of experience (e.g., "what it’s like" to see red).  
     - **Motivation**: Without this, there is no datum to explain. Illusions/hallucinations subjectively resemble veridical perceptions.  

  2. **Veridicality Conditions (**)**  
     - **What it demands**: Account for when/why an experience is accurate (e.g., a red cube present) or inaccurate (e.g., bent stick in water).  
     - **Motivation**: Perception is epistemically useful because it (often) tracks truth.  

  3. **Causal Explanation of Content (**)**  
     - **What it demands**: Explain how distal objects causally shape experiential content (e.g., why a red cube typically causes a "red cube" experience).  
     - **Motivation**: Perception is not random; its content is systematically tied to the world.  

  4. **Epistemic Asymmetry (**)**  
     - **What it demands**: Preserve the distinction between *perception* (which provides justification for beliefs) and *hallucination* (which lacks this justificatory power, even if subjectively identical).  
     - **Motivation**: Veridical perceptions ground knowledge; hallucinations do not, even if indistinguishable.  

  5. **Illusion/Hallucination Parity (**)**  
     - **What it demands**: Explain illusions (misrepresentation of real objects) and hallucinations (no object present) without treating them as fundamentally different *kinds* of experience.  
     - **Motivation**: Subjectively, they can be identical to veridical cases.  

  ---

  ### **II. Negotiable Desiderata**  
  *(Theory-dependent commitments)*  

  6. **Object-Dependent Content**  
     - *Disjunctivist demand*: Veridical experiences have content ontologically dependent on objects; hallucinations are a different metaphysical kind.  
     - *Motivation*: Preserves direct realism; avoids "veil of perception."  

  7. **Content Internalism**  
     - *Intentionalist demand*: Phenomenal character supervenes on internal state; identical brain states → identical experiences.  
     - *Motivation*: Explains subjective indistinguishability.  

  8. **Causal Purity**  
     - *Naive realist demand*: Perception requires an unmediated causal chain (e.g., light → retina → brain).  
     - *Motivation*: Ensures "direct" awareness of objects.  

  ---

  ### **III. Testing Against Your Cases**  

  | **Case**               | **Key Challenge**                                                                 | **Bears on Desiderata**                                                                 | **Forces a Choice?**                                                                 |  
  |------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Split Case**         | One experience: partially veridical (cube shape), partially hallucinatory (redness). | 1, 2, 5, 6                                                                             | **Yes**: Forces rejection of *disjunctivism* (violates 5,6). Intentionalism handles best. |  
  | **Prosthetic Case**    | Veridical content via non-standard causal route (camera → brain).                | 3, 4, 7, 8                                                                             | **Yes**: Forces rejection of *causal purity* (8). Challenges epistemic asymmetry (4) if classified as perception. |  
  | **Matching Case**      | Hallucination coincidentally accurate; identical to perception epistemically/behaviorally. | 4, 6                                                                                   | **Yes**: Forces rejection of *content internalism* (7) if epistemic status differs. Tests epistemic asymmetry (4). |  

  ---

  ### **IV. Theory Report Card**  
  *(✓ = Satisfies; ✗ = Violates; ~ = Partial/Qualified)*  

  | **Desideratum**           | **Disjunctivism** | **Sense-Datum** | **Intentionalism** |  
  |---------------------------|-------------------|-----------------|-------------------|  
  | 1. Phenomenal Character   | ✓ (via objects)   | ✓ (via sense-data) | ✓ (via content)    |  
  | 2. Veridicality Conditions| ✓                 | ✓               | ✓                 |  
  | 3. Causal Explanation     | ✗ (neglects non-veridical causes) | ✓               | ✓                 |  
  | 4. Epistemic Asymmetry    | ✓ (core strength) | ✗ (veil of perception) | ~ (if content externalist) |  
  | 5. Illusion/Halluc Parity | ✗ (splits kinds)  | ✓               | ✓                 |  
  | 6. Object-Dependent Content | ✓ (required)     | ✗               | ~ (optional)      |  
  | 7. Content Internalism    | ✗                 | ✓               | ✓                 |  
  | 8. Causal Purity          | ✓ (naive realist) | ~               | ✗                 |  
  | **Handles Split Case?**   | ✗                 | ~               | ✓                 |  
  | **Handles Prosthetic?**   | ✗                 | ✓ (as "indirect") | ✓                 |  
  | **Handles Matching?**     | ✓                 | ✗               | ~                 |  

  **Key Tensions**:  
  - Desiderata 4 (Epistemic Asymmetry) and 5 (Illusion/Hallucination Parity) are **jointly unsatisfiable** for disjunctivism (it sacrifices 5 for 4).  
  - Desideratum 8 (Causal Purity) conflicts with 3 (Causal Explanation) in edge cases (prosthetic perception).  
  - Desideratum 6 (Object-Dependence) conflicts with 7 (Internalism) — the **matching case** exploits this.  

  ---

  ### **V. Critical Uncertainties**  
  **Least Confident Claim**: That **epistemic asymmetry (4)** is non-negotiable. *Why?*  
  - If a hallucination *coincidentally matches reality* (matching case), does it provide justification?  
  - Intentionalism *could* argue that accurate content justifies, regardless of causal history.  
  - **My confidence**: 70% (asymmetry is intuitive, but its necessity depends on externalist epistemology).  

  **Most Contested Requirement**: **Object-Dependent Content (6)**.  
  - *Non-negotiable* for disjunctivists; *rejected* by others.  
  - Your **split case** shows it may be untenable (one experience can't be "half-dependent").  

  ---

  ### **Conclusion**  
  No theory satisfies all desiderata. **Disjunctivism** preserves epistemic asymmetry (4) and direct realism (6,8) but fails your split/prosthetic cases and hallucination parity (5). **Intentionalism** handles edge cases (split, prosthetic) and parity (5) best but struggles with epistemic asymmetry (4) in the matching case. **Sense-Datum** theory explains hallucinations (5) and prosthetics but invites skepticism (violates 4).  

  **The irreconcilable conflict**: Epistemic asymmetry (4) *requires* a metaphysical difference between perception and hallucination, but hallucination parity (5) *denies* such a difference in phenomenal character. **This is why no theory "wins"** — you must sacrifice either phenomenological unity (disjunctivism) or epistemic directness (intentionalism). Your cases sharpen this: the **split case** destroys disjunctivism; the **matching case** challenges intentionalism.  

  > "Perception is a unity only until you split it; justification is a given until it isn't."  
  > — Your cases prove both.
