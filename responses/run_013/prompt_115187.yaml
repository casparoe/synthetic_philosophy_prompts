prompt: |-
  I help run a volunteer tool library and repair workshop out of a church basement in my neighborhood — around forty volunteers, a bank account with about nine thousand dollars in it, a cash box for the day's donations, a key to the building, and a workshop with table saws and a grinder in it. Once a month the steering group meets and I am the one who has to bring the names: who gets a key, who is allowed to take the cash box home overnight, who trains new volunteers on the saws, who gets asked to take a break for a while. I have no training for any of this; I got the job because I kept showing up. Each decision takes me maybe twenty minutes and then a month of living with it, since most of these people are my neighbors and two of them are people I would call at two in the morning. Anything involving a key or the cash box has to be agreed by me, the treasurer, and one other steering member, so whatever I use has to be something I can say out loud to the three of us at a kitchen table and have it sound like a reason rather than a feeling.

  I keep arguing about this with a friend who is finishing a doctorate in philosophy. He says I think I am judging what kind of person someone is — trustworthy, careful, generous — when what I am actually doing is guessing at what they will do next, and that the guessing is worse than I think, because what people do depends enormously on the situation they are in. He tells me about experiments in which people who would describe themselves as decent walk past someone who needs help because they are late for something, and about people who stay silent about an obvious error because everyone else in the room is silent, and he says there is an old argument between philosophers who think a person's character is the thing to look at — he calls them virtue ethicists — and psychologists who say that what we call character is mostly a story we tell afterwards about people we have already decided we like. He is probably simplifying; if he is, I want to know how. The part I keep chewing on is not the debunking but what he said after it: that the useful move is to stop asking whether someone is a good person and start asking in which situations someone is good and which situations make them worse. I would like you to turn all of this into a procedure I can actually run, in order, in about twenty minutes, without any training, on a name in front of me: the questions to ask, in order; what counts as a good enough answer to each; which steps end the process with a no; and which steps are not factual questions at all but calls about what kind of place we want this to be, which I should be handing to the steering group rather than deciding myself. It has to be honest about the psychology rather than pretending a checklist can read a soul — if the honest answer is that most of the time the procedure should tell me to change the situation rather than judge the person, say so, and tell me what that looks like in a tool library. Three cases it has to handle: the volunteer everyone adores, who is warm and generous with everyone and has missed roughly a third of the shifts they signed up for; the volunteer nobody likes, who is short with people and has been complained about twice, and who has never missed a shift and once walked a lost wallet back across town; and my oldest friend in the group, who has asked for a key and who I would hand one to tomorrow without thinking. At least one of those should come out against what I would have decided on my own, and I want you to tell me plainly which one and why.

  Please organize it as: a section headed 'The decision I am really making' (about 150 words, saying in plain terms what the procedure is going to output); a section headed 'What character can and cannot tell me' (about 250 words, on what the virtue ethicists are actually committed to and what survives the psychologists' complaint); a section headed 'The procedure, step by step' (about 700 words, numbered, each step giving the question, what counts as a sufficient answer, what a no means, and whether it is a fact call or a values call, followed by a short paragraph on which distinctions from the theory you dropped to make this usable and what dropping them costs me); a section headed 'Where the procedure stops and a person decides' (about 200 words, saying who that person should be); three worked sections headed 'Worked example: the one everyone loves who keeps not showing up', 'Worked example: the one nobody likes with a spotless record', and 'Worked example: my oldest friend' (about 250 words each); and a closing section headed 'What this procedure cannot do' (about 250 words, including how I will know when it has misfired, and one paragraph on the volunteer whose life has just fallen apart — out of work, sleeping on a friend's couch, asking for a key — because that is the case where I am most likely to punish a situation and call it a person).
reasoning: |-
  Okay, the user runs a volunteer tool library and repair workshop. They're struggling with making decisions about who gets keys, handles cash, or trains others. They have no formal training and feel the weight because these are neighbors and friends. Their philosopher friend argues against judging character, emphasizing situational factors. The user wants a practical, step-by-step procedure that incorporates these insights, handles three specific cases, and fits into their 20-minute decision window.

  First, I need to unpack the core conflict here. The user is stuck between intuitive trust (virtue ethics) and situational psychology. Their friend's point about situations mattering more than character traits resonates, especially in volunteer settings where context shifts behavior. The challenge is operationalizing this into a checklist that doesn't oversimplify but remains actionable.

  The three test cases are brilliant stress tests: 
  - The lovable flake (warm but unreliable) 
  - The unlikeable saint (prickly but dependable) 
  - The best friend (automatic yes). 
  The procedure must contradict intuition in at least one case - likely the friend, to prove it's not just bias. 

  For structure, I'll follow their requested sections:
  1. **The real decision**: Reframing from "is this person trustworthy?" to "how does this role/situation affect trust outcomes?" 
  2. **Character limits**: Acknowledge virtue ethics' focus on cultivated dispositions but concede to psychology: behavior is context-dependent. Salvage "character" as shorthand for consistent patterns, not essence.
  3. **Procedure steps**: Need concrete questions about situational factors (e.g., "What time pressures exist in this role?"). Must flag value calls (e.g., "How much reliability matters?") for steering group input. Sacrifice theoretical nuance for speed - e.g., ignoring "global character" but losing predictive certainty.
  4. **Decision point**: Clarify where human judgment kicks in - e.g., interpreting ambiguous answers. Stress this should be the steering group, not just the user.
  5. **Worked examples**: 
     - Lovable flake: Deny cash box/key due to reliability triggers, despite charm. 
     - Unlikable saint: Approve training role (controlled access) but not customer-facing roles. 
     - Best friend: Deny key via procedure, forcing situational fixes (e.g., staggered key access) instead of blind trust.
  6. **Limitations**: Highlight the "life fallen apart" case - here the procedure might reject, but steering group should override with temporary accommodations, separating crisis from capability.

  Key psychology to embed: 
  - **Fundamental attribution error** (blaming person not situation) 
  - **Channel factors** (small environmental tweaks enabling/disabling good behavior) 
  - **Default effects** (making safe options automatic)

  Biggest lift: Making "change the situation" tangible. For tool libraries, that means: 
  - Reducing isolated temptation (cash box counted/deposited daily) 
  - Building error buffers (dual controls for keys) 
  - Designing for worst-case users, not best-case.

  The cash box example is perfect - instead of seeking "honest people," make dishonesty harder via daily deposits. Similarly for keys: if lost keys are the risk, design key protocols that assume keys will get lost.

  For the friend case, the procedure must force a "no" to demonstrate anti-bias. Painful but necessary - and fixable by restructuring access rather than questioning friendship.

  On misfires: Watch for volunteers suddenly resenting bureaucracy (signal to explain the "why"), or increased errors after access changes (signal to revisit controls). The crisis case needs special handling - maybe a "suspension with support" status.

  Finally, language must stay church-basement practical. No jargon like "deontic constraints" - just "Does this setup make mistakes harder to make?"
answer: |-
  ### The decision I am really making  
  I'm not deciding if someone *is* inherently "trustworthy" or "responsible." I'm deciding whether **our current setup creates conditions where this person is likely to succeed in a specific role** (e.g., holding keys, managing cash, training others). The procedure outputs one of four choices: (1) **Approve** the request/role; (2) **Deny** it; (3) **Redesign the situation** (e.g., split responsibilities, add safeguards); or (4) **Delegate to the steering group** for a values-based judgment. The goal is to minimize reliance on guessing "character" and maximize environmental support for reliable behavior.

  ---

  ### What character can and cannot tell me  
  Virtue ethicists (like Aristotle) argue character is a stable *disposition* cultivated through habit. They’d advise judging someone’s past actions to predict future behavior—e.g., "Sandra returned a wallet, so she’s honest." Psychologists (e.g., Philip Zimbardo, Stanley Milgram) counter that behavior is heavily situational. A "virtuous" person might steal if systems are lax, while a "selfish" person might act generously in structured settings.  

  What survives:  
  - **Patterns matter**: Repeat behavior (e.g., chronic lateness) signals how someone *typically* responds to *current* pressures.  
  - **Narratives have power**: How volunteers describe their actions ("I forgot" vs. "The bus was late") reveals their approach to accountability.  
  What fails:  
  - **Trait-based predictions**: Assuming past kindness ensures future reliability ignores context (e.g., stress, temptation).  
  - **Moral labels**: Calling someone "careless" overlooks fixable triggers (e.g., unclear shift reminders).  
  The compromise: Use behavior patterns as *clues to situational risks*, not moral verdicts.  

  ---

  ### The procedure, step by step  
  *Total steps: 15–20 minutes. Stop at any ❌.*  

  1. **What is the specific ask?**  
     *Example: "Key access," "Cash box duty," "Train new volunteers."*  
     *✅ Sufficient:* Clear role definition. *❌ No:* If vague (e.g., "more responsibility").  
     *Type:* Fact.  

  2. **What’s the worst realistic outcome if this fails?**  
     *Example for cash box: "Theft or loss of ≤$200." For training: "Amputation risk."*  
     *✅ Sufficient:* Concrete, plausible harm. *❌ No:* If catastrophic (e.g., "death")—redesign needed.  
     *Type:* Values (delegate to steering group if disputed).  

  3. **What’s in our control to prevent this?**  
     *Example: "Deposit cash daily," "Two-person rule for saw training," "Key logbook."*  
     *✅ Sufficient:* One actionable safeguard. *❌ No:* If none exist—**redesign first**.  
     *Type:* Values (delegate if safeguards conflict with culture).  

  4. **Has this person encountered similar situations here?**  
     *Review records: Attendance, complaints, errors.*  
     *✅ Sufficient:* 3+ relevant incidents (e.g., missed shifts for key request). *❌ No:* Insufficient data—**deny or trial run**.  
     *Type:* Fact.  

  5. **What patterns emerge?**  
     *Example: "Misses shifts when raining," "Rude when busy but diligent when focused."*  
     *✅ Sufficient:* Pattern tied to context (not "they’re flaky"). *❌ No:* If no pattern—**deny** (too unpredictable).  
     *Type:* Fact.  

  6. **Do our safeguards counter their risk triggers?**  
     *Example: If they forget shifts, does a buddy system exist?*  
     *✅ Sufficient:* Yes. *❌ No:* **Redesign** (e.g., automate shift reminders).  
     *Type:* Fact/values hybrid (delegate if redesign requires resources).  

  7. **Final call:**  
     - ✅ **Approve** if: Safeguards + pattern suggest low risk.  
     - 🔄 **Redesign** if: Safeguards weak or triggers fixable.  
     - ❌ **Deny** if: Unmitigated high risk (e.g., grinder training with focus issues).  
     - 📣 **Delegate to steering** if: Values clash (e.g., "Is reliability > kindness?").  

  *Sacrificed nuance:*  
  - Dropped "intentions." Cost: May overlook genuine remorse.  
  - Ignored "global character." Cost: Misses holistic growth but avoids bias.  
  - Skipped "situation novelty." Cost: Underprepared for crises (covered later).  

  ---

  ### Where the procedure stops and a person decides  
  The steering group decides **values conflicts** (Step 3, 7) and **redesign approvals** (Step 6). You decide **factual patterns** (Steps 4–5). When the procedure says "delegate," present the conflict plainly: *"Do we prioritize never missing shifts over community warmth?"* If redesign fails twice, deny. Never override a ❌ alone.  

  ---

  ### Worked example: the one everyone loves who keeps not showing up  
  **Ask:** Key access.  
  1. Specific? ✅ (Key to building).  
  2. Worst outcome? ❌ (Unauthorized access; theft). Delegated to steering: They deem it "moderate risk."  
  3. Safeguards? ✅ (Key logbook).  
  4. Similar situations? ✅ (12 missed shifts in 4 months).  
  5. Pattern? ✅ ("Misses shifts when friends visit" or "no pattern beyond busyness").  
  6. Safeguards vs. triggers? ❌ (Logbook doesn’t prevent impulsive sharing). **Redesign:** Issue a code-based lock instead.  
  **Output:** ❌ **Deny key** until redesign. *Why against instinct?* Charm ≠ reliability under distraction. Redesign fixes the gap.  

  ---

  ### Worked example: the one nobody likes with a spotless record  
  **Ask:** Train new volunteers on saws.  
  1. Specific? ✅ (Saw training).  
  2. Worst outcome? ❌ (Severe injury). Delegated: Steering says "high risk."  
  3. Safeguards? ✅ (Two-person rule, safety quizzes).  
  4. Similar situations? ✅ (20 shifts, zero errors).  
  5. Pattern? ✅ ("Impatient but follows protocols rigidly").  
  6. Safeguards vs. triggers? ✅ (Two-person rule offsets impatience).  
  **Output:** ✅ **Approve training role**. *Why against instinct?* Their meticulousness offsets unlikeability. Situation controls risks.  

  ---

  ### Worked example: my oldest friend  
  **Ask:** Key access.  
  1. Specific? ✅ (Key).  
  2. Worst outcome? ✅ Moderate (theft).  
  3. Safeguards? ✅ (Logbook).  
  4. Similar situations? ✅ (Never missed shifts).  
  5. Pattern? ❌ (No data on key responsibility).  
  **Output:** ❌ **Deny** (or trial run). *Why against instinct?* Friendship ≠ proof of key reliability. Test first: Give key for 2 weeks with mandatory log entries.  

  ---

  ### What this procedure cannot do  
  **Predict crises:** A volunteer suddenly homeless ("sleeping on a couch, needs a key") may act erratically due to stress—not "bad character." The procedure will likely ❌ deny (no pattern of crisis management). **How to know it misfired:** If denials cause resentment without safety gains, or approvals cause avoidable errors.  

  **For the crisis case:**  
  - Hand decision to steering. Argue: *"Their 'risk' is situational poverty. Can we redesign?"*  
  - Solutions: Time-limited key access, paired with a stable volunteer. Deposit cash daily so boxes aren’t taken home.  
  - **Crucial:** Separate *temporary support* (e.g., short-term key) from *permanent roles*. Track behavior post-crisis.  

  **Limitations:**  
  - Fails for **novel situations** (e.g., first grant application).  
  - Ignores **growth** (e.g., a "flaky" volunteer improving).  
  - **Mitigation:** Annual reviews of denied volunteers; redesigns before retesting.  

  This won’t read souls—but it will build a library where good actions are easier to repeat.  

  ---  
  *Final note: In the friend’s case, the procedure forces humility. Trust the system you built together—it protects both your volunteers and your 2 a.m. friendships.*
