prompt: |-
  You are an archaeological theorist with a philosopher's habits — someone who has spent years on the question of what, exactly, licenses an inference from a mute object to a past belief or institution, and who is suspicious of both the confident processualist and the confident interpretivist. Think carefully and at length before you answer. Begin by briefly setting out, in your own words, what each of the two approaches below actually claims about the object-to-belief inference — its ontology of the "belief," its unit of evidence, and what would count as getting it wrong — and only then turn to the comparison. Do not let the preamble run away with you; it is scaffolding for the answer, not the answer.

  The two things to compare:

  (1) The actualistic, analogy-based approach: past beliefs and institutions are inferred by projecting regularities observed in living or historically documented societies onto material remains, with the reliability of the projection underwritten by general uniformitarian or middle-range principles, and with the "belief" treated as a cause that left a material trace.

  (2) The material-engagement approach: cognition and belief are not merely evidenced by objects but partly constituted and enacted through them, so that the object is not a downstream trace of a prior mental state but a participant in the very practice that the belief consists in.

  Compare them on at least these axes: what each takes the object to be evidence of, and whether "belief" is the right kind of explanandum at all; how each handles the chronic underdetermination of material form by mental content; what each owes to the observer's own cultural position; and what each can and cannot say about change — how a belief or institution comes into being or dies out, as read from the objects. Where a given axis is not one the theory addresses, say so rather than manufacturing a position for it.

  Now bring in two things I am injecting, and treat them as stipulated — do not go looking for a real counterpart.

  First, a case. Imagine a single standardized artifact form: small perforated bone discs, drilled centrally, bearing a fixed and nearly invariant set of notches, recovered in large numbers from domestic refuse, spread across several centuries and a wide region, with variation so slight it looks enforced. Read this case twice, once through each approach, and say what belief or institution each would reconstruct, what each would refuse to reconstruct, and what both readings leave untouched. Then say which features of the case are load-bearing for each reading.

  Second, a criterion I have coined myself and want stress-tested, which I call the double-substitution test. For an object-based inference to a belief to be warranted, it must survive two substitutions: hold the object form fixed and ask whether a materially identical practice could have been produced by people holding a different belief; then hold the belief fixed and ask whether it could have issued in a materially different object form. If the belief can be swapped out under the first substitution, or the object swapped out under the second, the object does not individuate the belief. Apply this test to the case, tell me which of the two approaches can accommodate the test and which is embarrassed by it, and — this matters most — tell me whether the test is a genuine advance or merely a restatement of the underdetermination worry dressed in new clothes. If it collapses into something older, name what it collapses into.

  Throughout, be disciplined about the mapping and honest about silence: do not force either theory to speak where it has nothing to say, and do not let the comparison flatten into "both are useful in their own way."

  Give your final answer as a single JSON object with exactly the following fields:

  - "approach_1_summary": string — the actualistic approach's core claim about the object-to-belief inference.
  - "approach_2_summary": string — the material-engagement approach's core claim.
  - "axes": array of objects, each with "axis" (string), "approach_1" (string), "approach_2" (string), and "theory_silent" (boolean).
  - "case_reading_1": string — how the actualistic approach reads the stipulated case.
  - "case_reading_2": string — how the material-engagement approach reads it.
  - "case_residue": string — what both readings leave unexplained.
  - "double_substitution_verdict": object with "approach_1" (string), "approach_2" (string), and "is_genuine_advance" (string, saying whether it is a real advance or a restatement, and of what).
  - "decisive_consideration": string — the single point that most separates the two approaches.
  - "bottom_line": string — one paragraph stating which approach you would trust more for reconstructing belief from objects, and under what conditions you would switch.
reasoning: |-
  We are comparing two approaches: the actualistic, analogy-based approach (Approach 1) and the material-engagement approach (Approach 2). We have a specific case and a criterion to test.

  First, let's summarize the two approaches in our own words:

  **Approach 1: Actualistic, analogy-based**
  - **Core claim about object-to-belief inference**: Beliefs and institutions are inferred by projecting regularities from living or documented societies onto material remains. This projection is justified by uniformitarian principles (the idea that present processes can explain the past) or middle-range theory (linking static material patterns to dynamic behaviors). Belief is treated as a mental cause that leaves a material trace. The object is evidence of a prior mental state that caused the object's form and deposition.

  **Approach 2: Material-engagement**
  - **Core claim**: Beliefs and institutions are not merely represented by objects but are co-constituted in the material practices. The object is not a passive trace but an active participant in the cognitive process. Belief is not a prior mental state but emerges in the engagement with the material world. The object is evidence of an ongoing practice in which cognition is extended and distributed.

  Now, we must compare them on four axes:

  1. **What each takes the object to be evidence of, and whether "belief" is the right kind of explanandum**:
     - Approach 1: The object is evidence of a prior belief (a mental state) that caused the object's production and deposition. Belief is the right explanandum because it is the cause of the material trace.
     - Approach 2: The object is evidence of a material practice that is constitutive of cognition. Belief, as a purely mental state, is not the right explanandum; instead, we should focus on the practice itself, which includes the object and the doing.

  2. **How each handles the chronic underdetermination of material form by mental content**:
     - Approach 1: Underdetermination is handled by using analogies to living societies to narrow the possibilities. The uniformitarian principle provides a bridge, but it acknowledges that multiple beliefs might produce similar objects. It relies on cross-cultural analogies to reduce ambiguity.
     - Approach 2: Underdetermination is sidestepped because the object is not seen as a representation of a mental state but as part of the cognitive system. The focus is on the material practice, so the question of mental content is less central. It does not try to infer a specific mental state but the practice in which the object played a role.

  3. **What each owes to the observer's own cultural position**:
     - Approach 1: It heavily depends on the observer's choice of analogies, which are culturally situated. The observer's own cultural background and the societies chosen for analogy can bias the interpretation.
     - Approach 2: The observer is also situated, but the approach emphasizes the materiality and the practices that can be studied in their own right. However, the interpretation of the practice is still subject to the observer's perspective, especially when attributing cognitive roles to objects.

  4. **What each can and cannot say about change (how beliefs or institutions come into being or die out)**:
     - Approach 1: Change is explained by changes in the underlying beliefs or institutions, which then cause changes in material culture. It can track change through shifts in material patterns and relate them to changes in beliefs via analogies.
     - Approach 2: Change is inherent in the dynamic of material engagement. New practices emerge through the reconfiguration of material interactions, and beliefs are transformed along with the material world. It can describe how a change in the material environment or practices leads to a change in the cognitive system.

  Now, the case: standardized bone discs, centrally perforated, with fixed notches, found in domestic refuse over centuries and a wide region with minimal variation.

  **Reading through Approach 1 (actualistic):**
  - It would look for analogies in documented societies: objects that are similar (e.g., spindle whorls, gaming pieces, tokens, amulets). Based on the notches, it might infer a counting device or a calendar. The minimal variation suggests a standardized function, possibly linked to an institution (e.g., a system of accounting or ritual). It would reconstruct a belief system that required such objects (e.g., a belief in the importance of record-keeping or a ritual practice). It might refuse to reconstruct the specific symbolic meaning without direct analogies. The load-bearing features are the standardization, the notches (suggesting a counting or marking system), and the context (domestic, suggesting daily use).

  **Reading through Approach 2 (material-engagement):**
  - It would see the discs as part of a material practice that constituted cognitive processes. The notches might be part of a tactile and visual engagement, perhaps in a system of memory or calculation. The practice of making and using the discs is the institution. It would reconstruct the practice (e.g., a habitual action of notching and handling the discs) as the cognitive institution. It might refuse to separate the belief from the practice. The load-bearing features are the invariance (suggesting a rigidly prescribed practice) and the perforation (enabling handling, perhaps on a string or as a movable object).

  **What both leave untouched (residue):**
  - The specific meaning of the notches (unless there is an external key) and why this form persisted for so long with such invariance. Also, why they were discarded in domestic refuse and not in special deposits.

  Now, the double-substitution test:

  1. Hold the object form fixed: Could a materially identical practice be produced by a different belief?
     - For Approach 1: Yes, the same object form could be produced by different beliefs (e.g., the notches could be for counting days, or for recording debts, or for divination). So, the object form does not uniquely individuate the belief.
     - For Approach 2: The test might be less applicable because the belief is not separate. The practice is the same, so the cognitive process is the same. But if we force a different belief, then the practice might be seen as the same, but the meaning might change. However, the approach might resist the separation of belief and practice.

  2. Hold the belief fixed: Could the same belief issue in a materially different object form?
     - For Approach 1: Yes, the same belief (e.g., a belief in the need for record-keeping) could be realized in many material forms (tokens, tallies, writing). So the object form is not necessary for the belief.
     - For Approach 2: The belief is not prior, so holding a belief fixed is problematic. The belief is constituted in the practice, so a change in the material form would change the practice and thus the belief. Therefore, the same belief could not exist with a different object form because the object is part of the cognitive system.

  The test seems to embarrass Approach 1 because it highlights the underdetermination: the object form does not uniquely determine the belief, and the belief does not uniquely determine the form. Approach 2 might not be embarrassed because it does not make a direct inference from object to belief but sees them as intertwined. However, the test is designed for an object-to-belief inference of the kind Approach 1 makes, so Approach 2 might reject the test's premise.

  Is the test a genuine advance? It seems to restate the underdetermination worry in a structured way, but it does so by making explicit the two directions of substitution. It collapses into the old underdetermination problem, but with a new framing that forces us to consider both directions. It is a restatement, but a useful one because it systematizes the problem.

  Finally, the decisive consideration: The core difference is the ontology of belief. Approach 1 treats belief as a prior mental state that causes material traces, while Approach 2 sees belief as emerging in material practices.

  Bottom line: I would trust Approach 2 more for reconstructing belief from objects because it avoids the underdetermination problem by not treating belief as a separate mental state. However, in conditions where we have strong analogies from documented societies (e.g., historical periods), Approach 1 might be more applicable.

  Now, we must format the answer as a JSON object with the specified fields.
