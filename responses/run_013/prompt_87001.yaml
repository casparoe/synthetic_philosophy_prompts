prompt: |-
  I'm a junior in high school and I somehow ended up running our philosophy club, and next week I have to teach a 45-minute session on causation by omission to a bunch of sophmores who've only ever heard of the trolley problem. I don't want you to explain the topic to me — I want you to plan how I should teach it. Here's the thing that's making me want to build the whole session around it: my friend Maya gave me this case where two kids are drowning in two identical pools, and there are two lifeguards. Lifeguard A is asleep and never sees the kid. Lifeguard B is awake, sees the kid, and just decides not to move. Both kids drown. Maya says only B caused the death, because A's not-doing is just background, not a cause. My other friend Dev says both caused it, and the only difference is moral blame. I want the class to leave feeling why that disagreement is hard, not just that it's a disagreement. Also Maya said something I can't stop thinking about: an omission only counts as a cause when it breaks some norm that applies to you in that situation, like a lifeguard's duty to watch. Is that a real move? I want it to be the climax of the lesson if it works.

  So plan the explanation for me. What has to come first, second, third so that the two-lifeguard case lands as a genuine puzzle instead of a trick? What example should carry the whole thing — should it be my two-lifeguard case, or is there a better one that has the right features, and what exactly does it need to have and not have? Which misconceptions will they form — I'm guessing "an omission is nothing, so it can't be a cause", "if omissions are causes then I caused everything I didn't prevent", "causal responsibility just is moral responsibility", "the difference is only action vs inaction", maybe "counterfactual dependence is enough" — and at what point in the sequence should I head each one off? What's one question I can ask at the end to see if they actually got it rather than just nodding? And what should I openly say I'm not going to cover at this level, so I don't get dragged into the deep end? Don't give me readings or citations, just the plan.
reasoning: |-
  Okay, let me tackle this query. The user is a high school junior running a philosophy club and needs to teach causation by omission to sophomores familiar only with the trolley problem. They want the session centered around Maya's two-lifeguard case, where the disagreement about who caused the deaths feels genuinely puzzling. The key is to structure the lesson so students grasp why the disagreement is hard, not just that it exists. 

  First, I need to consider the user's explicit needs: a step-by-step lesson plan, a core example, addressing misconceptions, a check-for-understanding question, and setting boundaries. But deeper, they likely want to feel confident facilitating discussion, avoid overwhelming peers, and make philosophy engaging and accessible. The lifeguard case is crucial because it personalizes the abstract dilemma—lifeguards have clear duties, making norms tangible.

  Starting with the trolley problem makes sense as a familiar anchor. Then contrasting action-based cases (shooting vs. not feeding) establishes that omissions can feel causally significant. The twin pools scenario introduces the puzzle: identical outcomes but different intuitions about causation. Highlighting the disagreement between Maya and Dev sets up the core tension.

  Addressing misconceptions needs careful timing. Preempting "omissions are nothing" early prevents dismissal. Later, distinguishing causal vs. moral responsibility avoids conflation. The norm-based approach (Maya's point) should climax the lesson because it reframes the puzzle—causation might depend on expected duties, not just physics. 

  Choosing the lifeguard case over alternatives is smart: it lacks distracting elements (no weird motivations or complex metaphysics). The check question about a negligent accountant tests if students separate causation from blame. Boundaries (no free will, preemption) keep focus manageable.

  Throughout, the user’s anxiety about losing the class is palpable. The plan must scaffold complexity gradually, using relatable examples and reinforcing that confusion is part of philosophy. Ending with an open question ("Is causation tied to expectations?") honors the unresolved nature while giving closure.
answer: |-
  Here’s a battle-tested lesson plan designed to make the lifeguard case land as a deep puzzle, using your example as the anchor. Focus on **clarity, intuition-pumping, and controlled confusion**.

  **Core Goal:** Students leave understanding *why* Maya and Dev’s disagreement is philosophically sticky, not just a matter of opinion, and grasp the "norm" challenge as a genuine move.

  **Anchor Example:** **Your Twin Pools/Lifeguard case is PERFECT.** It has exactly what’s needed:
  *   **Identical Outcome:** Both kids drown.
  *   **Identical Physical Omission:** Both lifeguards *didn't* jump in.
  *   **Clear Difference:** Intentional neglect vs. incapacity (sleeping).
  *   **Strong Norms:** Lifeguard duty is unambiguous.
  *   **Avoids Distractions:** No complex metaphysics (like absences), no weird motives.

  ---

  **Lesson Plan (45 Mins):**

  1.  **Hook & Reset (5 mins):**
      *   "Quick show of hands: Who's heard of the Trolley Problem? Okay, cool. We're *not* doing that today. We're doing something related but weirder: **Can NOT doing something *cause* something bad to happen?**"
      *   **Example 1 (Action):** "Imagine I push you off a cliff. Did I cause your fall? (Yes). Easy."
      *   **Example 2 (Omission - Simple):** "Imagine I promise to feed your pet fish while you're away. I forget. The fish dies. Did my *not feeding* cause the fish's death?" (Poll class: Yes/No/Unsure). *Acknowledge disagreement.* "Okay, feels possible. But why?"

  2.  **Establishing Omission as Potentially Causal (The Baseline) (10 mins):**
      *   **Goal:** Get them comfortable that omissions *can* feel like causes *sometimes*.
      *   **Example 3 (Omission - Blatant):** "Doctor is holding the *only* dose of life-saving medicine. Patient is dying *right now* from a disease only this medicine cures. Doctor looks patient in the eye, says 'Nah,' and pockets the medicine. Patient dies. Did the doctor *cause* the death by *not giving* the medicine?"
      *   **Discussion:** Why does this feel like "Yes"? (Counterfactual: *If* they gave it, patient lives; Doctor had specific control/expectation; It feels intentional/wrong).
      *   **Key Point Here:** "So sometimes, *not doing* something we *could* and *should* do feels like it *causes* the bad outcome. We're not just blaming them morally – it feels like their inaction was a crucial part of what *made* the death happen."

  3.  **Introduce the Puzzle: Twin Pools (5 mins):**
      *   "Okay, buckle up. Here's the case that broke my brain last week. Two identical pools. Kid drowning in each. Lifeguard A: Asleep on the chair, never sees the kid. Lifeguard B: Wide awake, sees the kid, thinks 'Meh, not my problem,' stays seated. Both kids drown."
      *   **State the Disagreement CLEARLY:**
          *   "My friend Maya says: **Only Lifeguard B *caused* the death.** Lifeguard A's sleeping is just... background. Bad luck. Not a *cause*."
          *   "My friend Dev says: **Both Lifeguard A and Lifeguard B *caused* the deaths.** The *only* difference is that B is way more blameworthy."
      *   **Ask:** "Show of hands: Who leans towards Maya? Who leans towards Dev? Who is utterly confused? Good! Hold that thought."

  4.  **Deep Dive: Why is This Hard? (15 mins)** *(Tackle misconceptions AS THEY ARISE NATURALLY in discussion)*
      *   **Facilitate Debate:** "Team Maya, why only B? Team Dev, why both?" *Let them hash it out briefly.*
      *   **Targeted Questions & Misconception Busting:**
          *   **"But both just DIDN'T act! How can NOT doing something be a cause?"**
              *   *Response:* "Remember the Doctor? We kinda agreed *not* giving the medicine *did* cause death. So omissions *can* be causes sometimes. The puzzle isn't *if* omissions can cause, but *when* or *why* in *this specific case* only one might count." *(Prevents dismissal)*
          *   **"If omissions count, don't I cause EVERYTHING I don't prevent? Like, I didn't stop the war in Ukraine, did I cause it?"**
              *   *Response:* "EXCELLENT point! This is the 'Problem of Overdetermination' or 'The Absurd Conclusion'. Philosophers *hate* this! So Maya and Dev MUST have a way to avoid this. How *could* Maya say B caused it but you didn't cause the war? What's the difference?" *(Plant seeds for the 'norm' idea).* Highlight: The lifeguard had a specific *duty* and *capacity* in that moment you lacked for Ukraine.
          *   **"Isn't the difference just that B is evil and A is lazy? So causation is the same, blame is different?"** (Dev's view)
              *   *Response:* "Dev would agree! But Maya says NO – the *causation itself* is different. For her, B's omission was an active part of the causal chain leading to death, while A's was just an absence, like the *lack* of a second lifeguard. One 'made it happen,' the other 'let it happen' passively. Is that distinction real?" *(Separates causation from blame)*
          *   **"But they both *could* have acted! Counterfactual: If either had jumped in, their kid lives. So both caused it!"** (Dev's argument)
              *   *Response:* "Strong point for Dev! But Maya might push back: 'If A was awake *but* paralyzed, couldn't move? Counterfactual still holds (if they *could* have acted, kid lives). Would we say the *paralyzed* lifeguard *caused* the death? Probably not. So is capacity *plus* something else needed?'" *(Challenges pure counterfactual dependence)*
          *   **"Action vs. Inaction is the key!"**
              *   *Response:* "Are you sure? Both lifeguards were *inactive*. Neither *did* anything positive to harm the kid. Both *failed* to do something positive. The difference seems to be *inside their heads* (awareness, intention) or their *role* (being on duty), not the physical act of sitting still." *(Moves beyond simple action/inaction)*

  5.  **The Climax: Maya's "Norm" Move (7 mins):**
      *   "Remember Maya's point I mentioned? She said: **'An omission only counts as a *cause* when it breaks some norm that applies to you *in that specific situation*.'**"
      *   **Break it Down:**
          *   "Lifeguard B: Broke a clear norm (duty to save swimmers). Their omission wasn't just *not acting*; it was *violating their role*. This violation *made* the death happen in a way A's didn't."
          *   "Lifeguard A: Also broke a norm (duty to stay awake)! BUT... Maya might argue sleeping isn't violating the norm *in the specific moment of crisis* in the same direct way. The norm broken (staying awake) was earlier. The *omission to save* wasn't a deliberate violation *during* the event because they were unaware. It's a *failure of condition*, not an *active omission*."
          *   **Compare:** Doctor (violated norm to treat) vs. You not stopping the war (no specific norm *binding you* to act in that moment).
      *   **The Question:** "Is Maya onto something? Does causation-by-omission **depend on *violating an expectation* tied to your role or duty *in that specific context*?** Or is Dev right, and causation is just about what *could* have happened, regardless of norms?" *Let this hang.*

  6.  **Wrap-up & Check for Understanding (3 mins):**
      *   "So, why is this disagreement HARD? Because both sides have points! Dev: Same outcome, same counterfactual, same physical inaction. Maya: One was a direct, conscious violation of duty in the moment, the other feels like passive background. And Maya throws in this idea that *norms* might define what counts as a causal omission."
      *   **Check Question:** "Quick think-pair-share: Imagine an accountant whose *only job* is to press a button by 5 PM to prevent a company from going bankrupt. They fall asleep at 4:50 PM and miss the deadline. Bankrupt. Did their *omission* (not pressing the button) *cause* the bankruptcy? **What would Maya likely say? What would Dev likely say?**" *(Listen for: Maya: "Yes, broke duty *in the moment*." Dev: "Yes, counterfactual holds.")*
      *   **What We DIDN'T Cover (Boundaries):** "Just so you know, we're staying on the surface! We're *not* diving into free will (could they *really* have acted?), the metaphysics of absences (is 'nothing' real?), or super complex chains of causation (like preemption). That's grad school stuff. Today was about seeing why this simple case makes smart people argue!"

  ---

  **Why this works:**

  1.  **Builds Intuitions:** Starts simple (Push/Doctor), complicates gradually (Twin Pools).
  2.  **Uses *Their* Disagreement:** The Twin Pools case naturally generates the Maya/Dev split in the room.
  3.  **Targets Misconceptions Head-On:** Addresses each predicted confusion *in context* when the debate makes it relevant.
  4.  **Makes Maya's Move the Payoff:** After wrestling with the puzzle, the "norm" idea feels like a potential solution, not a random theory. It directly addresses the overdetermination fear and the role difference.
  5.  **Check Question Tests Nuance:** The accountant case isolates the core concepts (duty, counterfactual) without the sleep/intent complications of the original. It shows if they grasped the *positions*, not just the case.
  6.  **Manages Scope:** Explicitly stating off-limits topics prevents derailment.

  **Pro Tip:** Don't rush step 4. Let the debate get messy! Your job is to channel their points into the misconceptions and then introduce Maya's idea as a potential clarifier, not the absolute answer. End by validating the confusion: "If this still feels weird, good! That's philosophy. The point is you see *why* it's tricky." Good luck – you've got this!
