  ## The Forked Stick Sings

  Seventy summers he’s walked parish lines,
  boots scuffing contours only his stick divines.
  No theory hums beneath his farmer’s frown,
  just the willow’s dip, a silent bowing down
  where farmers dig and cool proof climbs the pipe.
  **The water knows the willow.**

  My father maps the aquifer’s hidden seam,
  traces strata like a logic-locked dream.
  He scribbles margins: *Anomaly. Chance.*
  While Ray just walks, lost in his private dance,
  the green fuse trembling, pulled towards the deep.
  **The water knew the willow.**

  Three farms hold faith where his thin shadow fell,
  their buckets brimming from that wishing-well
  science can’t sanction. Charts go blank, perplexed.
  Is it the ground’s slow breath? Some ancient text
  unread by eyes, but felt in wrist and grain?
  **The water knowing the willow?**

  Dowsers talk of currents, tension in the grain –
  he won’t say. Just shrugs and walks again,
  letting the pull speak where his words refuse.
  I’ve seen the proof drinkable. What’s the use
  of reasons cracking like a sun-baked plain,
  when the old stick bends, a compass tuned to rain,
  and finds the hidden pulse beneath the clay?
  **The water knows the willow.**

  ---

  **Why this works for your request:**

  1.  **The Refrain & Its Mutations:**
      *   First appearance (Line 6): **"The water knows the willow."** (The true version)
      *   Second appearance (Line 12): **"The water knew the willow."** (Past tense shift, hinting at history/duration).
      *   Third appearance (Line 18): **"The water knowing the willow?"** (Gerund shift, turning it into an uncertain, ongoing state, questioning its nature).
      *   Final appearance (Line 24): **"The water knows the willow."** (Exact replica of the first, anchoring the poem).
  2.  **Shape & Argument:** The poem presents Ray's practice, the dad's frustration ("scribbles margins," "Charts go blank"), the tangible results ("proof drinkable," "buckets brimming"), and the nephew's perspective ("I’ve seen the proof... What’s the use / of reasons cracking"). The refrain's changes subtly enact the argument – shifting from certainty to memory to questioning – before returning to the bedrock of the original statement. The *form* argues Ray's case: the belief wanders grammatically but always circles back to its core truth.
  3.  **Nephew's Voice:** The speaker observes both sides ("My father maps...", "While Ray just walks...", "I’ve seen the proof... What’s the use..."). He's caught between empirical evidence ("proof drinkable") and the lack of explanation ("he won’t say").
  4.  **Concrete Imagery:** Grounded in the rural setting ("parish lines," "farmer’s frown," "boots scuffing," "green fuse," "sun-baked plain," "buckets brimming," "cool proof climbs the pipe"). Avoids abstraction.
  5.  **Meno Resonance (Implied):** The shifting refrain embodies the "statues that won't stay put" – the definition/understanding of *why* Ray is right keeps changing form. The final return to the exact phrase shows the underlying truth remains constant, even if our grasp of it is slippery. This is achieved through the *structure*, not explanation.
  6.  **The Stick & The Mystery:** Focus stays firmly on Ray, the stick ("willow’s dip," "green fuse," "old stick bends"), the water ("hidden pulse," "cool proof"), and the tension with science ("father maps," "logic-locked dream," "science can’t sanction"). It celebrates the inexplicable skill.
