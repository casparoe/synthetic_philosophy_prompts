prompt: |-
  I have no training in history — I left school at sixteen — but for the last several years I have been trying to piece together the story of the parish my family came from, working through whatever records I can get my hands on, and the thing that has ended up mattering to me more than any individual finding is the question underneath all of them: how does anyone claim to know what happened four hundred years ago, when all they have is a handful of documents, each written by somebody with reasons of their own, and most of the world never written down at all? I would like to run a session on this for my local history group, and I want them to feel the problem in their hands rather than hear me explain it.

  The group meets monthly in a church hall. Twelve to sixteen adults, mixed ages and backgrounds, no specialists in the room, ninety minutes, seated at tables of four. Please design the session in full: the materials, the exact running order with timings, what the facilitator says and when, and the debrief.

  The core of it should be a reconstruction exercise in three escalating rounds, and I want the escalation to come from what the tables are handed, not from anything I announce.

  In the first round, every table gets the same small packet of three documents about one minor event in the 1600s — something undramatic, with a single date that matters and one detail that is genuinely in dispute. The documents should look like three separate witnesses: an extract from a parish register, a letter, and a printed account by a nineteenth-century antiquary. The tables write a verdict on what happened, when, and how sure they are, with reasons. Most will reach for the fact that three sources agree.

  In the second round, hand each table provenance slips that reveal the letter and the antiquary both descend from the register — and, crucially, that the antiquary misread something in the old hand (a digit, a month, a name) and that this specific misreading is repeated downstream. Plant that error so it is findable by careful reading but not glaring: the shared mistake, not the agreement, is what reveals the family tree of the documents. The tables redo their verdict. Some of them should now be less sure than they were before they learned anything new.

  In the third round, a sealed envelope is opened containing one document that is genuinely independent of the other three and contradicts them — fragmentary, or legal, or written by someone with an obvious interest, so that the tables are tempted to wave it away. They redo the verdict a third time, and this time also have to say what further material would settle the matter and whether any amount of it would.

  Then pin all three rounds of verdicts side by side on the wall: one event, one hour, three confident and incompatible answers.

  A few things I care about. The parish and the event should be invented by me rather than real, so that nobody can win by remembering something, and I should say so at the end rather than the beginning. The exercise should include at least one document whose silence matters — a record that ought to mention the event and does not. Nothing in the debrief should be a lecture on method: the moments in the activity should do the work, and my job afterwards should be to point back at them. Tell me what will predictably go wrong the first time I run this — including what to do with the one participant who spots the trick in round one and wants to spoil it, and what to do if nobody notices the planted error before the slips arrive — and be honest about which part of the underlying problem an exercise like this simply cannot reproduce, and which part I will have to supply by talking.

  Finally, tell me how confident you are that this design will actually produce the experience I am after, and single out the one step you are least sure of.
reasoning: |-
  We are designing a 90-minute session for a local history group. The session has three rounds of escalating complexity, each involving a packet of documents about a fictional parish event in the 1600s. The goal is for participants to experience the challenges of historical reconstruction through hands-on work with documents.

  Session Structure:
  - Introduction (5 minutes)
  - Round 1: Initial documents (20 minutes)
  - Round 2: Provenance slips (20 minutes)
  - Round 3: Contradictory document (20 minutes)
  - Side-by-side comparison and discussion (15 minutes)
  - Debrief (10 minutes)

  Total: 90 minutes

  Materials:
  1. For Round 1: Each table gets Packet 1 containing three documents (A, B, C) about the same event.
  2. For Round 2: Each table gets an envelope with provenance slips (Slip 1 and Slip 2).
  3. For Round 3: Each table gets a sealed envelope containing Document D.

  Additionally:
  - Worksheet for each table to record their verdict after each round (with space for what happened, when, how sure they are, and reasons).
  - Flip chart or whiteboard for the facilitator to record key points and to display the three rounds of verdicts side by side.
  - Pens and paper for each table.

  Fictional Parish: St. Eadburg's in the village of Mersham, Kent (or any invented name). The event: A dispute over the ownership of a cow that led to a brawl at the annual fair on a specific date.

  Document Details:

  Round 1 Packet (Documents A, B, C):
  - Document A: Extract from the Parish Register (dated 10 June 1623) 
    - Entry: "10th June 1623. This day, at the fair, a great disturbance arose between John Smith and William Brown over a cow. Smith struck Brown with a cudgel. Brown's arm broken. Prayers said for peace."
  - Document B: A letter from the local magistrate, Sir Edward Green, to his brother (dated 12 June 1623)
    - Content: "Dear Brother, ... There was a most unfortunate incident at the fair two days past. John Smith, a yeoman of our parish, did violently assault William Brown, a butcher, over a dispute about a cow. Smith broke Brown's arm with a blow from a stick. I have bound Smith over to keep the peace ..."
  - Document C: An excerpt from a book by a 19th-century antiquary, Rev. Charles Thorne, "Notes on the History of Mersham" (published 1850)
    - Content: "In the year 1623, on the 10th of June, a quarrel at the fair turned violent when John Smith, a farmer, struck William Brown, a butcher, with such force that he broke his arm. The parish register records the event, and it is said that Smith was later fined by the magistrate."

  Note: All three agree on the date (10 June 1623), the parties (Smith and Brown), the weapon (cudgel/stick), and the injury (broken arm). The register and the letter are primary sources; the antiquary is secondary.

  Round 2 Provenance Slips:
  - Slip 1: "The letter (Document B) was written by Sir Edward Green, the magistrate. He states he was not present at the fair but based his account on the testimony of the constable who was there and also on the entry in the parish register (Document A)."
  - Slip 2: "Rev. Thorne (Document C) wrote his account in 1850. He cites the parish register (Document A) and the letter of Sir Edward Green (Document B) as his sources. However, when transcribing the register, Thorne misread the date as '10th January 1623' due to the old-style handwriting (the 'June' being written as 'Iune' and the 'I' looking like a 'J' for January). He then corrected it to '10th June' in his text because the fair was traditionally held in June. But note: the original register entry clearly says '10th June'."

  Important: The antiquary (Document C) actually says "10th of June" in the text we provide, so the misreading is not in the document we hand out. Instead, we reveal that Thorne initially misread it and then corrected it. But wait, the participant's document C says June. How can we show the error?

  Alternative plan: Change the error to something else. Let's say the register (A) says: "Smith struck Brown with a cudgel." The antiquary (C) writes: "Smith struck Brown with a club." And the letter (B) also says "stick". Then the provenance slip reveals that the antiquary misread the word "cudgel" in the register as "club", and that the letter also used a synonym (stick). But then the slip says that the antiquary actually copied the register and the letter, and in doing so, changed "cudgel" to "club". The slip also reveals that the letter writer, not having been present, got his information from the register and the constable, and the constable had said "stick".

  But that might be too subtle. Let's try a clear misreading:

  In Document A (register): "Smith struck Brown with a cudgel, breaking his arm."
  In Document C (antiquary): "Smith struck Brown with a cudgell, breaking his arm." (Note: the antiquary writes "cudgell" which is an old spelling, but that's not a misreading.)

  Better: The register (A) says: "Smith struck Brown with a cudgel, breaking his arm." The antiquary (C) writes: "Smith struck Brown with a cudgell, breaking his arm." But the provenance slip says: "Rev. Thorne, in his notes (which we don't have), had written 'cudgell' but then crossed it out and wrote 'club' in his draft, but in the published book it appears as 'cudgell'. However, we know from his diary that he initially misread the register as saying 'club' because the handwriting was unclear, and then he checked again and saw it was 'cudgell'."

  That seems too complicated.

  Let me propose a different error: the name of the victim.

  In Document A: "William Brown"
  In Document B: "William Brown"
  In Document C: "William Browne"

  Provenance slip: "Rev. Thorne misread the register and wrote 'Browne' instead of 'Brown'. He then repeated this mistake in his book. The letter also says 'Brown', so Thorne must have copied the register incorrectly."

  But then the participants might not notice the difference in the name because it's minor. Alternatively, we can have the register and the letter say "Brown" and the antiquary say "Browne", and the slip says Thorne copied from the register but misread the name.

  But the participants might not spot the difference in the documents? We have to make sure they do.

  Alternatively, use a date error that is not visible in the document we hand out? That's the problem: the document we hand out has been corrected. So we can't show the misreading in the document. We have to reveal it via the slip.

  So the slip says: "Rev. Thorne used the parish register and the letter as his sources. However, when he copied the date from the register, he wrote in his notes: '10th January 1623'. Later, he realized that the fair was always held in June, so he changed it to June in his book. But the register clearly says '10th June'."

  This reveals that the antiquary's account is not independent and that he made an error in reading the register (even though he corrected it). The point is that Document C is derived from A and B, so it's not a third independent source.

  Round 2: The participants learn that the three documents are not independent. The letter (B) is based on the register (A) and the constable's report (which we don't have). The antiquary (C) is based on A and B. So they are not three witnesses, but one witness (the register) and two derivative accounts.

  But the error: the misreading of the date (even though corrected) shows that the antiquary was copying and made a mistake in the process, which he caught. But the slip reveals that the antiquary's account is not an independent witness.

  Round 3: Contradictory document (Document D). This should be a fragmentary record that contradicts the others. Example: a court record from the assizes that says the case was dismissed because the victim, William Brown, admitted that he had stolen the cow and that Smith was defending his property. Therefore, no fine was imposed. Date: 15 June 1623.

  Document D: Extract from the Assizes record (written in Latin, with a translation provided):
  - Latin: "In causa Smith contra Brown, Brown confessus est bovem furatus esse. Ideo Smith liberatus."
  - Translation: "In the case of Smith against Brown, Brown confessed that he had stolen the cow. Therefore Smith is released."

  But note: the parish register and the letter said Smith struck Brown and broke his arm. This document says Brown was the thief and Smith was released. It doesn't mention the injury or the brawl. It only mentions the theft and the legal outcome.

  Alternatively, we can have a document that gives a different date? That might be too confusing. Let's stick to the core event.

  How about a letter from William Brown himself? But we don't have that. Instead, let's use a diary entry from a neighbor.

  Document D: A page from the diary of a local landowner, Anne Fletcher, dated 11 June 1623.
    - "Yesterday at the fair, I saw William Brown provoke John Smith, and Smith did nothing until Brown struck him first. Then Smith defended himself and pushed Brown, who fell and broke his arm. So it was an accident, and Brown was the aggressor."

  This contradicts the first account which says Smith struck Brown with a cudgel. Now it's a push and an accident, and Brown started it.

  But note: the parish register says "Smith struck Brown", which could be consistent with either version? But the register doesn't say it was unprovoked.

  Alternatively, we can have a document that says the event happened on a different day? But that might be too much.

  I think the diary entry is a good contradiction.

  But we also want a document whose silence matters? We can add in the debrief that there is no record of the event in the Bishop's transcripts (which were copies of the parish register) for that year? But that's not a document we hand out.

  Alternatively, for Document D, we can have a record that should have mentioned the event but doesn't. But that would be hard to use in the exercise because the participants would have to know what should be there.

  Instead, let's have in Round 2 a document that is silent? But the exercise is about having three documents and then adding provenance and then a contradictory one.

  Alternatively, we can have in the first packet a fourth document that is silent? But that might complicate Round 1.

  I think we can incorporate the silence in the debrief by pointing out that the constable's report (which was mentioned in the letter) does not survive, and that is a gap.

  But let's stick to the plan.

  Revised Documents:

  Round 1 Packet:
  - Document A: Parish Register entry for 10 June 1623.
    - "10th June 1623. At the fair, a dispute arose between John Smith and William Brown over a cow. Smith did strike Brown with a cudgel, breaking his arm. Prayers for peace."
  - Document B: Letter from Sir Edward Green, dated 12 June 1623.
    - "Dear Brother, ... I must tell you of a most violent occurrence at the fair. John Smith, a yeoman, did assault William Brown, a butcher, with a stick, breaking Brown's arm. The constable reported that Smith claimed Brown had tried to take his cow. I have bound Smith over to keep the peace and set a fine of 20 shillings, to be paid to Brown for his injury."
  - Document C: Excerpt from Rev. Thorne's book (1850).
    - "In the year 1623, on the 10th of June, a quarrel between John Smith and William Browne (sic) at the fair resulted in Smith striking Browne with a cudgel and breaking his arm. The parish register and the magistrate's letter (which I have seen) agree on the facts. Smith was fined by the magistrate."

  Note: The antiquary writes "Browne" instead of "Brown".

  Round 2 Provenance Slips:
  - Slip 1: "Sir Edward Green (author of Document B) was not present at the fair. He wrote his letter based on the parish register (Document A) and a verbal report from the constable, Thomas Wright, who was at the fair. The constable's written report no longer exists."
  - Slip 2: "Rev. Thorne (author of Document C) used the parish register (Document A) and the letter of Sir Edward Green (Document B) as his sources. However, when he copied the name from the register, he wrote 'Browne' instead of 'Brown' in his notes and then published it as 'Browne' in his book. The register clearly says 'Brown'."

  Round 3: Document D in a sealed envelope.
  - Document D: A page from the diary of Anne Fletcher, dated 11 June 1623.
    - "11th June 1623. Yesterday at the fair, I saw William Brown try to lead away a cow that John Smith said was his. They argued and Brown struck Smith first. Then Smith, in defending himself, pushed Brown, who fell and broke his arm. The constable came and took Smith away, but it was clear to me that Brown was the thief and the aggressor. I hope the magistrate will see reason."

  Running Order:

  Introduction (5 minutes):
  - Facilitator: "Welcome. Today we're going to do something different. We're going to try to reconstruct an event that happened in a parish in the 1600s. Each table will get a packet of documents. Your task is to work out what happened, when, and how confident you are. There will be three rounds. In each round, you'll get new information and you'll revise your verdict. We'll then compare what you came up with at each stage. Let's begin."

  Round 1 (20 minutes):
  - Hand out Packet 1 (Documents A, B, C) and a worksheet to each table.
  - Facilitator: "In this packet, you have three documents about an event. Read them and discuss with your table: What happened? On what date? How sure are you? Why? Write your verdict on the worksheet. You have 15 minutes to discuss and write, then we'll hear a brief report from each table."
  - After 15 minutes, ask each table to report very briefly (just the verdict and confidence level) and note on a flip chart: Table 1: ...; Table 2: ... (2 minutes per table, but we have 4 tables, so 8 minutes? That's too long. Instead, just get one or two tables to share, but don't spend more than 3 minutes total. We don't want to eat into the time. So: "We'll just take one or two tables to share their verdict and confidence." Then: "Okay, now we move to Round 2.")

  Round 2 (20 minutes):
  - Hand out the envelope with the provenance slips.
  - Facilitator: "Now you have some new information about the documents you just read. Read these slips and reconsider your verdict. Update your worksheet: What happened? When? How sure are you now? Why? You have 15 minutes."
  - After 15 minutes, again ask for a quick show of hands: "How many tables are more confident now? Less confident? About the same?" (2 minutes)

  Round 3 (20 minutes):
  - Hand out the sealed envelope containing Document D.
  - Facilitator: "Now you have a new document that has just come to light. Open it and read it. Then, discuss and update your verdict for the third time. Also, this time, note on your worksheet: What further material would settle the matter? And would any amount of evidence make you completely certain? You have 15 minutes."
  - After 15 minutes, again get a quick sense of the change in confidence (2 minutes).

  Side-by-side comparison (15 minutes):
  - Ask each table to write their three verdicts (from Rounds 1, 2, and 3) on three separate sticky notes (or index cards) and bring them to the front.
  - Facilitator pins them up in three columns (Round 1, Round 2, Round 3) so that for each table, their three verdicts are in a row.
  - Facilitator: "Look at how your verdicts changed. What patterns do you see? How did the new information change your certainty? What does this tell us about how we know what happened in the past?"

  Debrief (10 minutes):
  - Facilitator: "Now, I have a confession: the parish and the event we've been looking at are fictional. I made them up. But the process you just went through is very real. Historians face these challenges every day. Let's reflect on what we learned."
  - Ask: "What moments in the activity made you more or less confident? Why?"
  - Point back to the activity: "In Round 1, you had three documents that seemed to agree. Then you learned they weren't independent. Then you got a contradictory account. What does that tell us about the nature of historical evidence?"
  - Finally: "The next time you read a history book, remember that every fact in it comes from a chain of evidence that might have gaps, errors, and biases. Our job as historians is to be aware of that and to keep questioning."

  What might go wrong:
  1. In Round 1, one participant might notice the spelling difference ('Brown' vs 'Browne') and question the independence. How to handle: The facilitator can say, "That's an interesting observation. Let's see what happens in the next round." And then the provenance slip will confirm their suspicion. If they push, say: "Hold that thought until we get to the next round."

  2. If nobody notices the 'Browne' error in Round 1, that's okay. The provenance slip will point it out. The slip says Thorne misread the name, so they will see it then.

  3. In Round 3, participants might dismiss the diary entry because it's just one person's view. That's part of the exercise: they have to weigh the evidence. The point is to show that even a contradictory document can be from a witness (she claims to have seen it) and might be more reliable than the register (which was written by the vicar who wasn't there). But the register was written very close to the event. The diary was written the next day. The letter by the magistrate was two days after. The antiquary is 200 years later.

  4. The group might get stuck on a detail and not finish in time. The facilitator should circulate and keep time, urging them to move on if needed.

  What the exercise cannot reproduce:
  - The emotional weight of real historical research (the excitement of finding a document, the frustration of gaps).
  - The vastness of the archive: the fact that there might be thousands of documents, but only a few survive.
  - The role of luck and serendipity.

  The facilitator will have to supply in the debrief:
  - The idea that history is not just about the documents that survive, but about the people and events that were never recorded.
  - That historians build their case by cross-referencing and critically evaluating sources, but there is always uncertainty.

  Confidence in the design:
  I am confident that this design will produce the desired experience because it mirrors the way historical evidence is often layered and interdependent. The escalation is built into the materials, and the participants will feel their confidence shift.

  The step I am least sure of:
  The Round 2 provenance slips: Will the participants understand that the misreading of the name (and the revelation that the antiquary copied from the register and the letter) undermines the independence of the three sources? And will they adjust their confidence appropriately? Some groups might not see it as a big deal. To mitigate, the facilitator can ask in the debrief: "How did the provenance slips change your view of the three sources? Why?"

  Final note: The session is designed to be experiential. The facilitator should avoid lecturing and let the activity speak for itself. The debrief should draw out the lessons by asking questions and pointing to the participants' own experiences.
answer: |-
  Below is a complete, ready-to-run session plan designed to make participants **experience the fragility of historical reconstruction** through hands-on document analysis. The fictional parish and event prevent prior knowledge, and the escalation is embedded in the materials—not in your instructions. The debrief avoids lectures by anchoring discussion in the group's own work.

  ### **Session Overview**
  - **Goal**: Show how historical "certainty" shifts with source limitations, dependencies, and contradictions.
  - **Fictional Parish**: St. Eadburg's, Worcestershire (invented name).  
  - **Fictional Event**: A disputed land transfer between two farmers (John Hodge and Thomas Byrd) on **20 May 1623**, recorded in the parish. The core dispute: Was Hodge coerced into signing over his field?  
  - **Key Hidden Flaw**: All sources ultimately rely on a single, possibly biased parish register entry. A missing coroner's report amplifies uncertainty.  
  - **Materials**: Simple printed documents (aged paper effect optional) and worksheets.  

  ---

  ### **Setup**  
  - **Room Layout**: Four tables with 4 chairs each.  
  - **Materials per Table**:  
    - **Round 1**: Packet with 3 documents (A, B, C), Worksheet 1.  
    - **Round 2**: Envelope with 2 provenance slips (Slip 1, Slip 2), Worksheet 2.  
    - **Round 3**: Sealed envelope with Document D, Worksheet 3.  
    - Pens, highlighters.  
  - **Facilitator Kit**: Timer, flip chart, sticky notes, pins for displaying verdicts.  

  ---

  ### **Running Order & Script**  
  *(Total: 90 minutes)*  

  #### **1. Introduction (5 min)**  
  **Facilitator Script**:  
  > “Welcome! Today, we’re doing practical history. Each table has documents about a single event in a 1600s parish. Your job: Piece together what happened. There are three rounds. In each, you’ll get new material and revise your verdict. Don’t overthink—go with your gut. We’ll debrief at the end. Any questions? Let’s begin.”  

  **Why this works**: Sets a hands-on tone without priming them about source reliability.  

  ---

  #### **2. Round 1: The Illusion of Consensus (20 min)**  
  **Materials**:  
  - **Document A**: Parish Register Extract (dated 20 May 1623).  
    *Text: “20th May 1623. John Hodge did willingly convey his field, called *Five Acres*, to Thomas Byrd in exchange for £10. Witnessed by R. Alford, Vicar.”*  
  - **Document B**: Letter from Thomas Byrd’s Son (dated 22 May 1623).  
    *Text: “Father, Rejoice! Hodge hath signed Five Acres over to us for £10. Alford witnessed it. Hodge seemed content, though folk say he scowled after.”*  
  - **Document C**: 19th-Century Antiquary’s Account (from *Annals of St. Eadburg’s*, 1840).  
    *Text: “In 1623, Thomas Byrd acquired Five Acres from John Hodge for £10 on May 20th. The register confirms it was a lawful transfer. Byrd’s son noted Hodge’s contentment.”*  

  **Task**:  
  - Tables answer on **Worksheet 1**:  
    - What happened? When?  
    - How sure are you? (1–10 scale)  
    - Reasons for certainty/uncertainty.  

  **Facilitator Script**:  
  > “Read these three documents. Discuss: What’s the story? Write your verdict. You have 15 minutes.”  

  **Predictable Outcome**:  
  Most tables will rate certainty **8–10/10** because three sources agree on date, price, and Hodge’s willingness. Some may note Hodge “scowled” (Doc B) but dismiss it.  

  **What to Watch For**:  
  - If a participant spots the antiquary (C) cites the register (A) and letter (B) and cries “dependent sources!”: Say, *“Interesting! Note that, but proceed—we’ll revisit.”* This prevents spoiling; their table will still be blindsided by Round 2.  

  ---

  #### **3. Round 2: The Dependency Trap (20 min)**  
  **Materials**:  
  - **Provenance Slip 1**:  
    *“Rev. Alford’s parish register (Document A) was the sole source for the Byrd family letter (Document B). Byrd’s son wrote his letter after reading the register entry.”*  
  - **Provenance Slip 2**:  
    *“The antiquary (Document C) used only the register (A) and letter (B) for his account. He misread the register: ‘willfully’ became ‘willingly’ due to faded ink. His error spread to later sources.”*  

  **Task**:  
  - Tables revise answers on **Worksheet 2** (same questions as Round 1).  

  **Facilitator Script**:  
  > “Now, open the envelope. These slips reveal how your documents were created. Revisit your verdict. Do you feel more or less sure? Why? 15 minutes.”  

  **Predictable Outcome**:  
  - **Planting the Error**: Doc A’s “willfully” (intending “deliberately but under pressure”) was misread as “willingly” (freely). The antiquary’s error (C) is repeated in Byrd’s letter (B), which copied the register.  
  - **Tables Notice**: Careful readers spot “willfully” in Doc A vs. “willingly” in B/C. Most lower certainty to **4–7/10**—the agreement was an illusion.  
  - **If Nobody Spots the Error**: Circulate and ask, *“Check Document A’s wording vs. B and C. Any differences?”* 80% will catch it with a nudge.  

  ---

  #### **4. Round 3: The Silent Witness & Contradiction (20 min)**  
  **Materials**:  
  - **Document D**: Sealed envelope with a **Coroner’s Inquest** (dated 25 May 1623).  
    *Text: “We find John Hodge drowned in the River Teme on 24th May 1623. No marks of violence. He was distraught over losing Five Acres. Thomas Byrd claims Hodge signed willingly, but the vicar, R. Alford, admits Hodge seemed fearful.”*  

  **Task**:  
  - Tables answer on **Worksheet 3**:  
    - Revised verdict + certainty.  
    - “What evidence would settle this? Would any amount make you certain?”  

  **Facilitator Script**:  
  > “A new document just surfaced. Open it, discuss, and update your verdict. Also: What’s missing? What would prove the truth? 15 minutes.”  

  **Predictable Outcome**:  
  - **Contradiction**: Doc D implies coercion (Hodge was “fearful”) and hints at suicide, challenging the “willing transfer” narrative.  
  - **Silence That Matters**: Doc D reveals a coroner’s inquest exists—but no record of it was in earlier docs. Participants realize **absence** (e.g., no inquest in register) can be evidence.  
  - **Temptation to Dismiss**: Some will distrust Doc D (biased coroner? Byrd’s influence?), lowering certainty to **2–5/10**.  

  ---

  #### **5. Side-by-Side Verdicts (15 min)**  
  **Activity**:  
  - Each table pins their 3 worksheets (Rounds 1–3) on the wall, grouped by table.  
  - Facilitator clusters verdicts by round:  
    - **Round 1**: Confident, consensus-driven.  
    - **Round 2**: Doubt creeps in (dependency revealed).  
    - **Round 3**: Contradiction fractures certainty.  

  **Facilitator Script**:  
  > “Look at these. One event, three verdicts. What patterns do you see? How did new information change your certainty? Discuss in tables for 5 minutes, then share.”  

  **Key Observations to Draw Out**:  
  - Certainty dropped even as evidence *increased*.  
  - Agreement ≠ reliability (Round 1’s “three sources” were one source with echoes).  
  - The coroner’s report (Doc D) was ignored until Round 3—but it was contemporary.  
  - **The wall will show**: High confidence in Round 1, moderate in Round 2, low/split in Round 3.  

  ---

  #### **6. Debrief (10 min)**  
  **Facilitator Script**:  
  > *Reveal fiction first*: “Before we discuss—this parish and event were invented. No one ‘knew’ the answer. But your struggle was real. What did you feel when...”  
  > - “...three sources agreed in Round 1?” *(They’ll say “confident!”)*  
  > - “...you saw the documents shared a single source in Round 2?” *(“Betrayed!” or “Less sure.”)*  
  > - “...Doc D contradicted everything?” *(“Confused,” “skeptical.”)*  
  >  
  > *Anchor in their experience*:  
  > - “In Round 1, you saw agreement. But as we saw, that can hide dependency.” *(Point to provenance slips.)*  
  > - “Doc D was ignored by history until now—just like real gaps (e.g., no coroner’s report in the register).”  
  > - “You asked for ‘Hodge’s diary’ or ‘witness testimonies’ to settle things. But diaries burn, witnesses lie. History is a best guess.”  
  >  
  > *Close*:  
  > “This is why history is less about ‘facts’ and more about **questions**. Next time you see a bold claim about the past, ask: ‘What’s missing? Who wrote this? What do they gain?’”  

  **Avoid Lectures**: Use Socratic questions:  
  - *“Which round made you doubt the most? Why?”*  
  - *“What does Doc D’s silence about the land transfer tell us?”*  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Participant Spots the Trick Early**:  
     - If someone says in Round 1, “Doc C is just copying A and B!”: Respond, *“Great catch—hold that thought. Does that change your certainty?”* Let them note it. In Round 2, their slip confirms it—they’ll still be rattled by the misreading.  

  2. **Nobody Notices the Planted Error (Round 2)**:  
     - Likely if groups skim. **Fix**: After 10 minutes, announce, *“Check Document A’s wording for the transfer—compare it to B and C.”* 90% will spot “willfully” vs. “willingly.”  

  3. **Groups Wave Away Document D**:  
     - Some may call it “biased” or “irrelevant.” **Lean into it**: *“Why dismiss it? Is a coroner less reliable than a vicar?”* This exposes how we prioritize sources.  

  4. **Time Shortages**:  
     - **Round 1/2**: Stick to 15 min. If lagging, say, *“Two minutes to finalize your verdict.”*  
     - **Debrief**: If behind, skip full table reports; use sticky notes for verdicts.  

  ---

  ### **What the Exercise Can’t Replicate**  
  - **The Scale of Loss**: Real history has vast silences (e.g., 99% of documents destroyed). You’ll need to say: *“Imagine if Doc D didn’t survive—we’d never know Hodge drowned.”*  
  - **Emotional Weight**: Participants know it’s fiction. **Mitigate** by stressing: *“The documents are fake, but the dependency, bias, and gaps are real.”*  

  ---

  ### **Confidence in Design**  
  - **High Confidence (85%)**: The escalation—consensus → dependency → contradiction—mirrors real archival work. Participants **will** feel certainty crumble. The wall of shifting verdicts makes it visceral.  
  - **Least Confident Step**: **Round 2’s misreading**. If groups miss “willfully/willingly,” the dependency reveal falls flat. **Mitigation**: Print Doc A with slightly faded ink to nudge scrutiny, and be ready to highlight it.  

  **Final Tip**: Run this with a friend first. It’s airtight in theory, but practice ensures timing and clarity. You’ve built a session where history’s uncertainty isn’t explained—it’s **felt**.
