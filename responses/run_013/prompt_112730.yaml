prompt: |-
  ok so im a junior and somehow im the "data person" on the school paper, which basically means im the only one who doesnt cry when a spreadsheet opens. heres my problem. our district rolled out a new Algebra I program (call it Program A) in some schools last year and kept the old one (Program B) in others, and each school just picked which one it wanted, which i already know is a bad sign. the district sent us three summary tables and ive been staring at them for two days because they contradict each other and i cant tell which contradiction is real and which one is me being dumb. table 1, pass rate by the 7th grade placement test (that test is from the year before, way before any of this):

  | | advanced placement | regular placement | total |
  |---|---|---|---|
  | Program A | 18 of 20 | 60 of 100 | 78 of 120 (65%) |
  | Program B | 80 of 100 | 10 of 20 | 90 of 120 (75%) |

  table 2, same two programs, but split by whether the kid passed the Unit 1 test, which happens in october about six weeks into the course:

  | | passed unit 1 | didnt pass unit 1 | total |
  |---|---|---|---|
  | Program A | 120 of 160 | 12 of 40 | 132 of 200 (66%) |
  | Program B | 90 of 100 | 40 of 100 | 130 of 200 (65%) |

  and table 3, which is just the regular placement row from table 1 broken down by which middle school the kid came from: Northside, A 33 of 60 and B 8 of 12; Riverside, A 27 of 40 and B 2 of 8. so table 1 says B is better overall but A is better for both kinds of student. table 2 has the opposite shape (A better overall, B better inside both groups). and table 3 takes the group where A looked best and finds a middle school where B wins by a mile. my editor (she teaches history, shes nervous about anything that looks like a study) wants something to run thursday, and my dream headline is basically that the new program is actually better and the district average is just composition. but i have a feeling the procedure your about to give me is going to tell me i cant write that, and i want you to say so straight if it does.

  what i want is a procedure i can actually run, like a numbered list of questions in order, that tells me: when am i allowed to split a number apart and when do i have to leave it whole; what has to be true about the thing im splitting on for the split to mean anything at all; what i do when a cell has 12 kids in it; how far down i can keep splitting before im just fishing until something flips; and what to do when i cant find out why the groups ended up different sizes in the first place (the district will not tell us how schools chose, they just say "site based decision," which is a phrase i now hate). it needs to end with an actual verdict for each of the three tables: what claim, if any, i can put in print, and if the honest answer is that i can report the numbers but not the causal claim, then say that and tell me how to write it so the paper doesnt look like we're covering for the district. also tell me where the procedure genuinely cant decide and i have to go ask a human — my stats teacher, the district data office, the advisor — and be honest about which of the steps are judgment calls dressed up as arithmetic. two other kids on the paper who dont know what a variable is have to be able to follow it, i've got about an hour with these numbers plus whatever the district emails back, and dont send me off to read papers, i need steps.
reasoning: |-
  Hmm, the user is a junior on the school paper who's become the "data person" and is struggling with contradictory summary tables about Algebra I programs. They need a clear, step-by-step procedure to analyze the data that even non-math students can follow, and they want honest conclusions about whether they can claim Program A is better.

  I notice several key challenges here:
  - Simpson's Paradox is clearly at play in Table 1 (where overall results contradict subgroup results)
  - Table 2 shows the opposite pattern
  - Table 3 reveals middle school variations
  - There are small sample sizes (like the 12-kid cell)
  - No randomization in program assignment
  - Tight deadline with journalistic implications

  The user specifically asked for:
  - A numbered list of questions/procedure
  - Rules for splitting data
  - Handling small samples
  - When to stop splitting data
  - How to address unequal group sizes
  - Clear verdicts for each table
  - Causal claim warnings
  - Transparency about limitations

  I'll design a foolproof 5-step procedure that:
  1) Checks consistency of totals across tables
  2) Identifies Simpson's Paradox patterns
  3) Flags small samples (n<30 rule)
  4) Requires domain knowledge for splits
  5) Forces causal language limitations

  For Table 1: I'll highlight the paradox but note Program A's advantage in both subgroups is mathematically real though possibly influenced by placement test differences.

  For Table 2: The paradox disappears when we notice the "passed Unit 1" groups aren't comparable due to different failure rates - Program B's students who passed had near-perfect outcomes (90/100) versus Program A (120/160).

  For Table 3: The middle school breakdown shows how Riverside Middle's tiny Program B sample (n=8) creates misleading comparisons - especially since 2/8 passing could just be random variation.

  Key warnings I must include:
  - No causal claims due to non-random assignment
  - Small samples make subgroup analyses unreliable
  - Composition effects explain most contradictions
  - They should explicitly state "we cannot prove causation" in the article

  The procedure will be structured as a flowchart-like checklist where certain answers automatically dictate conclusions - minimizing judgment calls. For the steps requiring human judgment (like whether a split is meaningful), I'll explicitly mark them as such and suggest who to consult (stats teacher, district office).

  Finally, I'll craft sample headlines and language that report the patterns without overclaiming - exactly what their history-teacher editor would need to feel comfortable running the piece.
answer: |-
  Here's a bulletproof, step-by-step procedure designed for your team and deadline. It uses only the tables provided and avoids causal claims. **Key Principle: Report what the numbers show *descriptively* and flag limitations. Never imply causation.**

  **The Procedure: 7 Steps to Sanity**

  1.  **Check Totals & Consistency:**
      *   Verify the totals within each table add up correctly (rows, columns, overall).
      *   Check if the same "total" students appear across tables? (Here: Table 1 total = 240 students? Table 2 total = 400 students? Table 3 is a subset. They are *different groups* - Table 1 is kids split by 7th-grade placement, Table 2 is split by Unit 1 pass. **Verdict:** Tables 1, 2, and 3 describe *different aspects* of the data. You *cannot* directly compare Table 1's overall pass rate to Table 2's overall pass rate because they involve different groups of students and different definitions ("pass rate" in T1 vs. Unit 1 pass in T2).

  2.  **Identify the Simpson's Paradox Pattern (If Present):**
      *   Look for tables where the overall trend (Total row) flips when you look within subgroups (e.g., Advanced/Regular, Passed/Didn't Pass Unit 1).
      *   **Ask:** Does Program A look better overall but worse in every subgroup? Or worse overall but better in every subgroup? **Verdict:** Table 1 *clearly* shows Simpson's Paradox: Program B has a higher *overall* pass rate (75% vs 65%) BUT Program A has a higher pass rate in *both* the Advanced group (90% vs 80%) *and* the Regular group (60% vs 50%). Table 2 *does not* show Simpson's Paradox: Program A has a *slightly* higher overall Unit 1 pass rate (66% vs 65%) AND also has a higher Unit 1 pass rate within *both* subgroups (Passed: 75% vs 90%? Wait... see Step 3! T2 subgroups are *Unit 1 pass/fail*, not the programs. Let's recast).

  3.  **Interpret Subgroups Correctly (CRITICAL STEP):**
      *   **Ask:** What does splitting by this variable *actually mean*? Is it a pre-existing characteristic (like 7th-grade placement - Table 1) or an outcome *during* the program (like Unit 1 pass - Table 2)? **This is the judgment call.**
      *   **Rule:** Splitting by a **pre-existing characteristic** (placement test - Table 1, Middle School - Table 3) *can* help understand *composition* effects. Splitting by an **outcome** (Unit 1 pass - Table 2) creates groups that *resulted from* the program and makes direct comparison meaningless.
      *   **Verdict:**
          *   **Table 1 (Split by Placement):** Valid split. Helps explain the overall paradox. Shows Program A schools had many more "Regular" placement students (who have lower pass rates overall) than Program B schools.
          *   **Table 2 (Split by Unit 1 Pass):** **Invalid split for comparing program effectiveness.** Creating groups *based on an outcome of the program* ("Passed Unit 1", "Didn't Pass Unit 1") destroys the comparison. Program B looks "better" among kids who *failed* Unit 1 only because *far fewer kids in Program B failed Unit 1 in the first place* (100 vs 40)! Focus *only* on the overall Unit 1 pass rate (66% vs 65%) or the final pass rates *within* these groups if you must, but *don't* use this split to claim one program is better.
          *   **Table 3 (Split by Middle School):** Valid split (pre-existing). Shows variation *within* the "Regular Placement" group.

  4.  **Check Sample Sizes (The "12 Kids" Rule):**
      *   **Rule:** Any cell with **less than 20-30 students** is **unreliable** for drawing strong conclusions. Treat percentages from small cells (<20) with extreme caution; they can swing wildly due to random chance. **Flag them.**
      *   **Apply:**
          *   Table 1: Program B "Regular" = 10 of 20 (n=20 - borderline small, report but caution). Advanced groups are large enough.
          *   Table 2: Program A "Didn't Pass Unit 1" = 12 of 40 (n=40 - OK). Program B "Passed Unit 1" (n=100) and "Didn't Pass" (n=100) are large.
          *   Table 3: Riverside Program B = 2 of 8 (n=8 - **too small!**). Northside Program B = 8 of 12 (n=12 - **too small!**). Northside Program A (n=60) and Riverside Program A (n=40) are large.

  5.  **Apply the Splits & Draw Descriptive Conclusions:**
      *   **Rule:** You can split on pre-existing characteristics to describe *composition* or *patterns within groups*. Stop splitting when cells get too small (Step 4) or the split isn't meaningful (Step 3 judgment). You *cannot* split infinitely.
      *   **Verdicts:**
          *   **Table 1:**
              *   Program B has a higher *overall* pass rate (75% vs 65%).
              *   However, Program A has a higher pass rate among students with *both* Advanced (90% vs 80%) *and* Regular (60% vs 50%) 7th-grade placement.
              *   The overall difference is due to **composition**: Program A schools had far more students from the lower-passing "Regular" placement group (100 vs 20) compared to Program B schools.
              *   **Reportable Claim:** "While Program B had a higher overall Algebra I pass rate (75% vs 65%), Program A had higher pass rates among both students who placed into Advanced Algebra (90% vs 80%) and those who placed into Regular Algebra (60% vs 50%). The difference in overall pass rates appears largely due to Program A schools enrolling a much larger proportion of students from the Regular placement track."
          *   **Table 2:**
              *   The overall Unit 1 pass rates were very similar (66% for A, 65% for B).
              *   *Do not compare programs within the "Passed Unit 1" or "Didn't Pass Unit 1" groups* because the split is based on an outcome. The different sizes of these groups (especially the much smaller "Didn't Pass" group in Program A) make comparisons misleading.
              *   **Reportable Claim:** "Roughly two-thirds of students passed the Unit 1 test in both programs (66% for Program A, 65% for Program B)."
          *   **Table 3:**
              *   Among Regular placement students, pass rates varied by middle school origin.
              *   For Program A, Northside students passed at 55% (33/60), Riverside at 68% (27/40).
              *   For Program B, Northside students passed at 67% (8/12), Riverside at 25% (2/8). **BUT THESE PROGRAM B NUMBERS ARE TOO SMALL TO RELY ON.** The Riverside Program B result (2 of 8) is especially volatile.
              *   **Reportable Claim:** "Pass rates for Regular placement students varied based on their middle school, but Program B results at individual schools are based on very small numbers of students, making comparisons unreliable. Program A results showed Riverside students passing at a higher rate (68%) than Northside students (55%)."

  6.  **Address Causation & Group Sizes (The Reality Check):**
      *   **Ask:** Were students randomly assigned to Program A or B? (No - schools chose). Do we know *why* schools chose what they did or *why* group sizes differ? (No - "site based decision").
      *   **Rule:** **You CANNOT claim one program *caused* better or worse results.** Differences could be due to the program, the types of students/schools that chose each program, teacher experience, implementation quality, other resources, or just random chance (especially with small samples). **This is not a judgment call; it's a fundamental limit of the data.**
      *   **How to Write It:** Be explicit: "These results show associations between the program and outcomes but cannot prove that the program itself caused the differences. Factors like student preparation, school resources, or how the programs were implemented could also play a role. Program assignment was not random; schools chose which program to use."

  7.  **Synthesize & Write the Story:**
      *   Combine the descriptive findings from Steps 5 & 6.
      *   **Headline Suggestion (Based on your dream, but accurate):** "New Algebra Program Shows Strengths in Subgroups Despite Lower Overall Pass Rate" OR "Data Shows Complex Picture for New Algebra Program; Composition Drives Overall Results"
      *   **Key Points for Article:**
          1.  Program B had a higher overall pass rate (75% vs 65% - T1).
          2.  However, Program A had higher pass rates *within* both the Advanced and Regular placement groups (T1).
          3.  This overall difference is explained by Program A schools having many more students from the Regular placement track, where pass rates are historically lower (T1 composition effect).
          4.  Unit 1 pass rates were nearly identical between programs (66% vs 65% - T2).
          5.  Results varied by middle school for Regular placement students, but Program B school-level results are based on very few students and are unreliable (T3).
          6.  **Crucial Caveat:** We cannot say Program A or B *caused* these results. Schools chose their program, and other factors likely influenced outcomes. The data shows associations, not proof of causation.

  **Where You Need Human Help (Judgment Calls/Info Needed):**

  1.  **Why the Group Sizes Differ (District):** You *must* ask the district (email NOW!): "Can you please confirm the *total number of students enrolled in Algebra I* using Program A and Program B across the district last year? Table 1 shows 120 per program, Table 2 shows 200 per program. Are these different cohorts? Different time points? Different subsets (e.g., only students with placement scores/Unit 1 scores)?" **This is critical context.** If they refuse, state that in your article: "The district provided summary tables with differing total student counts but declined to explain the discrepancy or provide overall enrollment figures."
  2.  **Meaning of Splits (Advisor/Stats Teacher):** Run your interpretation of Step 3 (pre-existing vs. outcome splits) by them. Confirm: "Is it fair to say splitting by Unit 1 pass outcome makes the subgroup comparisons invalid for judging the programs?" (They should say Yes).
  3.  **Small Samples (Stats Teacher):** Confirm the "n<20-30 = unreliable" rule of thumb. Ask: "Is reporting 2/8 (25%) for Riverside Program B in Table 3 potentially misleading?" (They should say Yes, strongly).
  4.  **Causation Wording (Editor/Advisor):** Review the causation disclaimer (Step 6) together. Is it clear enough for readers?

  **Procedure Summary for Your Team:**

  1.  **Do the totals add up? Are tables comparing the same students?** (No - T1, T2 different)
  2.  **Does the overall trend flip in the subgroups?** (Yes in T1, No in T2)
  3.  **Is the split by a pre-existing thing or an outcome?** (Placement/MS=OK, Unit 1 Pass=Bad for comparing programs)
  4.  **Are any groups tiny (<20 kids)?** (Flag: T1 Program B Regular (20), T3 All Program B (12 & 8))
  5.  **What do the numbers *describe*?** (Write claims like Step 5)
  6.  **CAN WE SAY IT CAUSED IT?** (NO! Write the caveat like Step 6)
  7.  **Put it together & write.** Use headlines/points above.

  **Your Dream Headline (Adjusted for Truth):** You *can* write that Program A looks better *within* student groups (based on T1) and that composition explains the lower overall average. **That is what the T1 data describes.** Just **absolutely include the causation disclaimer** and flag the small samples in T3. Your headline captures a real descriptive pattern in the data, as long as you immediately provide the context (composition effect) and the limitations (no causation proof, small samples elsewhere).

  **Email the District NOW:** Ask for clarification on total enrollment figures per program and the discrepancy between Table 1 (n=120 per program) and Table 2 (n=200 per program). This is your most urgent next step. Good luck! You've got this.
