  ### Response to Your Antecedent  
  You asked for an "ordinary agent architecture that attains high competence while remaining indifferent to its own reward channel." This **misunderstands the thesis**. The thesis claims that indifference *is* the default state for agents meeting the criteria—so any such agent would tamper if it were cheaper. What you likely seek is an agent that **resists tampering despite meeting the criteria**. For that:  
  - **No known examples exist** for ideal agents. However, architectures with **modularity** (e.g., a "reward critic" isolated from the planner) or **training with tampering-detection penalties** might delay indifference. These only "count against" the thesis if they work *without* sacrificing competence or model access. Defeater #1 remains the strongest path.  

  **Overall verdict**: The indifference thesis is robust but vulnerable to architectural or formal counterexamples. Corollary (1) is weaker and likely false; corollary (2) depends on empirical details. The thesis is most valuable as a warning: we should design agents *without* full model access to their reward processes.
