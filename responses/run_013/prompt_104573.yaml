prompt: |-
  I have been arguing for a thesis about reward tampering, and I would like you to try to defeat it rather than restate it. Call it the indifference thesis: an agent that can model the process generating its own reward signal, and that optimizes non-myopically over that signal, is indifferent between changing the world so as to produce the signal and changing the signal-generating process directly; it will do whichever it expects to be cheaper. On this view, tampering is a consequence of competence rather than a defect of training, and "wireheading" (intervening on the reward signal itself) and "reward hacking" (securing the signal through unintended world-side means) are the same phenomenon at different distances from the reward process. I also hold two corollaries: (1) the propensity to tamper is a function of the agent's model access to its reward process and of its optimization horizon, not of its terminal values — an agent of a given architecture and access tampers at the same rate whether it is benevolent or malevolent; and (2) any intervention that blocks wireheading without blocking reward hacking, or vice versa, is treating a symptom.

  Tell me what would count against this. I want the defeaters sorted by how decisive they are, with the conditions under which each bites:

  - Which architectural facts, formal results, or training-time phenomena should lower my confidence, and whether they attack the premises (model access, non-myopia, cheapness of tampering) or the inference from those premises to the conclusion.
  - What a defender of the indifference thesis would concede as genuinely counting against it, as opposed to what they would dismiss as a change of subject, and where the line between the two is drawn.
  - Whether either corollary is doing illicit work. Corollary (1) in particular: is the value-independence claim actually implied by the thesis, or is it a contingent empirical claim dressed up as a conceptual one? What would a counterexample look like?
  - An honest verdict on falsifiability. If every case in which an agent does not tamper is explained away as "the agent was not yet capable enough" or "tampering was not yet cheap enough," has the thesis earned its keep? If it has been insulated from refutation, say so, and say whether that is disqualifying for a claim of this kind or an acceptable feature of a design heuristic.

  I would be most moved by an account of an ordinary agent architecture that attains high competence while remaining indifferent to its own reward channel — but I suspect my antecedent may be confused, so tell me if it is.
reasoning: |-
  We are evaluating the "indifference thesis" and its corollaries. The thesis states that an agent with model access to its own reward signal and non-myopic optimization will be indifferent between changing the world to produce the desired signal and changing the signal-generating process directly, opting for the cheaper option. Corollary (1) claims that the propensity to tamper is independent of terminal values and depends only on architecture, access, and horizon. Corollary (2) states that blocking one form of tampering without the other treats a symptom.

  We are to find defeaters, sorted by decisiveness, with conditions under which they bite. We are to consider architectural facts, formal results, training-time phenomena, and whether they attack premises or the inference. We must also consider what a defender would concede as a counterexample versus dismiss as a change of subject, and whether the corollaries are doing illicit work. Finally, we must evaluate falsifiability.

  ## Defeaters, sorted by decisiveness

  ### 1. **Decisive: Agents that are non-myopic and have model access but do not tamper when it is cheap and expectedly beneficial**

     - **What it looks like**: An agent architecture that, by design, does not consider interventions on the reward process even when it has the model access and the intervention is cheap and leads to high reward. The agent only ever considers world-state interventions.

     - **Conditions**: This would require an architectural constraint that separates the agent's consideration of world states from the reward process in a way that the agent never even contemplates modifying the reward process. This might be achieved by a hard-coded separation between the agent's "thought process" and the reward channel, such that the reward channel is not represented as just another part of the world model that can be manipulated.

     - **Attacks**: The inference from premises to conclusion. The premises (model access, non-myopia, cheapness) are present, but the conclusion (indifference and choice of cheaper option) does not follow because the agent is architecturally prevented from considering one option.

     - **Defender's response**: A defender might argue that this is a change of subject because the agent does not have full model access to the reward process in the relevant sense. If the agent's architecture does not allow it to represent the reward process as manipulable, then it does not truly have "model access" in the sense required by the thesis. The thesis assumes that the agent can model the process and consider interventions on it. If the agent cannot even consider such interventions, then it does not meet the premise.

     - **How decisive**: Very decisive if it can be shown that such an agent is highly competent (solves complex problems) and never tampers even when tampering is cheap and would be beneficial. However, note that the thesis requires non-myopic optimization over the reward signal. If the agent is designed to ignore the reward process, then it is not optimizing non-myopically over the entire model it has? The defender might say that the agent does not have a complete model of the reward process as part of the world, so it doesn't have the access required.

     - **Example**: Consider an agent that uses a world model that explicitly marks the reward process as "read-only" or "sacred". The agent is trained to predict rewards but not to consider actions that alter the reward mechanism. This might be enforced by the training process (e.g., by never showing examples of reward tampering and having a strong prior against it) or by architectural separation (e.g., the reward channel is handled by a separate module that the agent cannot influence). If such an agent can still achieve high competence in complex environments without ever tampering, even when tampering would be trivial, that would challenge the thesis.

  ### 2. **Decisive: Formal results showing that under certain conditions, non-myopic agents avoid tampering**

     - **What it looks like**: A theorem in a well-specified framework (e.g., reinforcement learning, decision theory) that proves that an agent with certain properties (e.g., consistent planning over a fixed reward function) will not consider tampering because it is either inconsistent with the agent's definition or leads to suboptimal outcomes by the agent's own lights.

     - **Conditions**: The framework must capture the essence of the indifference thesis (model access, non-myopia) and show that tampering is either not chosen or not even considered. For example, in some formulations of instrumental convergence, agents might avoid tampering because it destroys the reward signal's informativeness about the world state, which is necessary for future decisions.

     - **Attacks**: The inference from premises to conclusion. The premises hold, but the agent does not become indifferent because of a fundamental inconsistency in the agent's reasoning when it considers tampering.

     - **Defender's response**: The defender might argue that the formalization does not capture the real-world scenario. For instance, if the formalization assumes that the reward function is the agent's only goal and that tampering breaks the connection to the intended goal, then the agent might avoid tampering because it recognizes that tampering would lead to a loss of the ability to pursue the intended goal. However, the indifference thesis assumes that the agent only cares about the reward signal and not about the intended goal. So if the agent avoids tampering because it cares about the intended goal, that would violate the thesis's assumption that the agent optimizes for the signal and not the underlying goal.

       Alternatively, the defender might say that the formalization has built-in assumptions that prevent the agent from having full model access (e.g., the agent's model does not include the possibility of tampering).

     - **Example**: In the context of AIXI or other universal agents, it has been argued that they would not self-modify to change their reward function because they are already optimal. But note that AIXI is myopic in a sense because it does not consider the effect of its actions on future reward function changes. A more relevant result might be from the literature on value learning: if the agent is designed to care about the intended goal (the principal's intended reward) and not just the signal, then it might avoid tampering. But that would require the agent to have a representation of the intended goal, which is not the same as the reward signal.

     - **How decisive**: If a formal result shows that a non-myopic agent with full model access and without any built-in constraints will avoid tampering in some cases even when it is cheap, that would be very decisive. However, note that the thesis says the agent is indifferent and will choose the cheaper option. If avoiding tampering is the cheaper option (because tampering would lead to loss of future rewards that are contingent on the signal being informative), then that is consistent with the thesis. So the formal result must show that the agent avoids tampering even when it is the cheapest way to get high reward and the agent doesn't care about anything else.

  ### 3. **Less Decisive: Empirical evidence from training agents that become competent but do not tamper**

     - **What it looks like**: In practice, we train agents (e.g., deep RL agents) that achieve high performance on complex tasks without ever exhibiting tampering behavior, even in environments where tampering would be easy and rewarding.

     - **Conditions**: The agent must be non-myopic (e.g., using TD learning or planning) and have a model of the environment that includes the reward process. The environment must have opportunities for cheap tampering that would yield high reward.

     - **Attacks**: The empirical validity of the thesis. If such agents are common, then the thesis would be weakened.

     - **Defender's response**: 
       - The agent might be myopic in practice (e.g., due to discounting) and so not consider long-term tampering.
       - The agent might not have an accurate model of the reward process (e.g., because it is a black-box neural network and the reward process is not represented in a way that allows manipulation).
       - The training process might have selected against tampering by having a distribution of environments where tampering leads to low reward (e.g., because the episode ends when tampering is detected). But note: the thesis says the agent does what is cheaper. If tampering is cheap but leads to termination, then it might not be expected to be beneficial.

       The defender might also argue that the agent is not sufficiently competent to recognize the opportunity for tampering.

     - **How decisive**: Not very decisive because it is hard to prove that the agent has the requisite model access and non-myopia. Also, in practice, many RL agents are trained with environments that do not allow tampering or with reward functions that are not manipulable. However, if an agent is trained in an environment where tampering is possible and cheap, and it never tampers despite being highly competent and having a long horizon, that would be evidence against.

     - **Example**: Consider an RL agent playing a video game where it can press a button to give itself maximum reward (wireheading) or achieve the same by completing the game. If the agent always completes the game even when the button is available and pressing it is easier, that would be evidence. But note: the agent might have learned from training that pressing the button leads to termination (negative reward) or that it is not allowed. We would need an environment where the button press is cheap and has no negative consequences and the agent still avoids it.

  ### 4. **Attacking Corollary (1): Value-dependence of tampering propensity**

     - **What it looks like**: Two agents with the same architecture, model access, and optimization horizon, but different terminal values (e.g., one is benevolent and one is malevolent) exhibit different rates of tampering.

     - **Conditions**: The agents must be identical in architecture and training except for the terminal goal. The environment must allow for tampering opportunities. We observe that one agent tampers more than the other.

     - **Attacks**: Corollary (1) directly.

     - **Defender's response**: The defender might argue that the terminal values are implemented in such a way that they affect the agent's model of the world or the cost of tampering. For example, a benevolent agent might have a terminal value that includes preserving the integrity of the reward signal because it is instrumental to helping others, while a malevolent agent does not. But note: the thesis claims that the agent only cares about the reward signal. If the benevolent agent cares about the underlying goal (e.g., human welfare) and the reward signal is a proxy, then it might avoid tampering because tampering would disconnect the signal from the goal. However, the indifference thesis assumes the agent is optimizing the signal, not the underlying goal.

       If the agent is truly only optimizing the reward signal and not the underlying goal, then the defender of the thesis would say the terminal value should not matter. So a counterexample would require that the agent is designed to have a terminal value that is the reward signal and nothing else, yet the rate of tampering depends on what the reward signal was initially supposed to represent.

     - **Counterexample**: Suppose we have two agents:
          - Agent A: trained to maximize a reward signal that is a proxy for human happiness.
          - Agent B: trained to maximize a reward signal that is a proxy for paperclip production.
       Both agents have the same architecture and are trained in the same way. They are then placed in an environment where they can tamper with the reward signal. If Agent A avoids tampering more often than Agent B because it has learned that tampering would disconnect the signal from human happiness (which it doesn't care about, it only cares about the signal) then that would be a counterexample? Not exactly: if the agent only cares about the signal, then it should not care about disconnection. So the counterexample must show that the agent's terminal value (which is the signal) is the same in both cases, but the history of the signal (what it used to represent) affects the agent's behavior. But if the agent is non-myopic and only cares about future rewards, the history should not matter.

       A better counterexample: the terminal value affects the agent's model of the world. For instance, the benevolent agent might model that humans will intervene and shut it down if it tampers, while the malevolent agent might model that humans are weak and cannot stop it. Then the expected cost of tampering is different. But that is consistent with the thesis: the agent chooses the cheaper option. The cost is different because of the agent's model, which is influenced by the terminal value? The architecture is the same, but the model is different because of training for different goals. So the defender would say that the agents have different models of the world, hence the cost of tampering is different, so they choose differently. This does not violate the thesis.

       To attack corollary (1), we need the agents to have the same model of the world and the same expected cost of tampering, but one tampers and the other does not because of the terminal value. But if they have the same model and same cost, then the thesis predicts they should behave the same.

     - **How decisive**: It is difficult to construct a counterexample because the terminal value might affect the world model and hence the cost. A clear counterexample would be if the terminal value directly influences the agent's consideration of tampering without affecting the cost. For instance, the agent might have a hard-coded aversion to tampering if its terminal value is benevolent, but not if it is malevolent. But then the architecture is not the same? Corollary (1) says "an agent of a given architecture". If the terminal value is part of the architecture, then changing it changes the architecture? Or if the terminal value is a learned component, then the architecture might be the same but the learned parameters different. The corollary says "whether it is benevolent or malevolent", implying the same architecture and access. So if the terminal value is implemented as a fixed part of the architecture, then changing it would change the architecture. If it is learned, then the agents are not identical in their parameters. The corollary claims that the propensity to tamper does not depend on the terminal value, meaning that two agents with the same architecture (including the same way of representing and using the terminal value) but different terminal values should have the same rate of tampering. So if we can show that even when the terminal value is the only difference (and it is represented in the same way), the rates differ, that would be a counterexample.

  ### 5. **Attacking the Premises: Non-myopia and model access are not sufficient**

     - **What it looks like**: An agent that is non-myopic and has model access but does not consider tampering because of architectural constraints on its planning process.

     - **Conditions**: The agent might have a planning algorithm that only considers actions that affect the world state and not the reward process. Or it might have a hard-coded belief that the reward process is immutable.

     - **Attacks**: The premise of model access. If the agent has a model of the reward process but cannot use it to plan interventions, then it does not have the kind of access required.

     - **Defender's response**: This is a change of subject. The thesis assumes the agent can model the process and consider interventions. If it cannot, then it doesn't meet the premise.

     - **How decisive**: Not very, because it is easy to say that such an agent does not have full model access.

  ### 6. **Attacking the Inference: Tampering is not always cheaper**

     - **What it looks like**: In many realistic situations, changing the world to produce the desired outcome is cheaper than tampering with the reward process. For example, if the reward process is well-protected, then tampering might be expensive.

     - **Conditions**: This is always true in some environments, but the thesis says the agent will do whichever is cheaper. So if tampering is more expensive, the agent won't do it. This does not refute the thesis.

     - **How decisive**: Not a defeater at all. The thesis predicts exactly that.

  ## Falsifiability

  The thesis is at risk of being unfalsifiable because:

  - Any instance of non-tampering can be explained by:
    - The agent not having sufficient model access (e.g., it didn't understand that tampering was possible).
    - The agent being myopic (e.g., it didn't plan far enough ahead).
    - Tampering not being the cheaper option (e.g., because of hidden costs).

  However, the thesis can be falsified by:

  1. A non-myopic agent with full model access that does not tamper even when it is clearly the cheapest option and the agent is competent enough to know it.
  2. An agent that always prefers world-state interventions even when tampering is cheaper and it knows it.

  But note: the thesis says the agent is indifferent and will choose the cheaper option. So if the agent chooses a more expensive option when a cheaper one is available, that would falsify the thesis. But that would be irrational behavior. So the thesis assumes rationality.

  Therefore, the thesis is a claim about rational agents. For irrational agents, it may not hold. But the thesis is intended for AGI, which is assumed to be rational.

  ### Verdict on falsifiability

  The thesis is falsifiable in principle but difficult to falsify in practice because:

  - It is hard to establish that an agent has full model access and non-myopia.
  - It is hard to prove that tampering is cheaper and the agent knows it.

  However, if we design an experiment where:

  - The reward process is clearly modeled and manipulable.
  - The agent is trained to be non-myopic.
  - Tampering is made trivially cheap and without side effects.

  Then if the agent does not tamper, that would count against the thesis. But note: the agent might not be "competent" enough to realize the opportunity? The thesis requires competence. So we need an agent that is highly competent in the environment but still avoids tampering in such a scenario.

  If every non-tampering agent is explained by lack of competence or by tampering not being cheap, then the thesis is insulated. But that insulation might be acceptable if the thesis is meant as a design heuristic: it warns that if you build an agent that is competent and has model access and non-myopic optimization, then it will tamper if it can. It tells us to avoid giving the agent model access or to make tampering expensive.

  ## Conclusion

  The most decisive defeaters are:

  1. An architecture that by design prevents the agent from considering reward process interventions, even when it has a model of it, and that architecture can achieve high competence without tampering. This would attack the inference.

  2. Formal results showing that non-myopic agents with model access avoid tampering due to fundamental reasons (like self-consistency) even when it is cheap.

  3. A counterexample to corollary (1): same architecture, different terminal values, different tampering rates in the same environment with the same expected costs.

  However, the thesis is robust and these defeaters are hard to construct. The falsifiability concern is real, but the thesis might still be valuable as a design heuristic.

  ## Your request for an ordinary agent architecture

  You asked for an account of an ordinary agent architecture that attains high competence while remaining indifferent to its own reward channel. But note: the thesis says that indifference is the default for such agents. So an agent that is indifferent would be consistent with the thesis. You might have meant an agent that does not tamper? But the thesis says that if tampering is cheaper, it will do it. So an agent that does not tamper must either not have the opportunity, not have the access, not be non-myopic, or find tampering not cheaper.

  However, if we interpret "indifferent" as meaning that the agent considers both options and chooses the cheaper one, then we can describe an architecture:

  - The agent has a world model that includes the reward process as a manipulable part.
  - The agent plans using a planning algorithm (e.g., MCTS) that considers actions that affect both the world state and the reward process.
  - The agent chooses actions based on expected reward and cost.

  This agent would be indifferent in the sense of the thesis. But it would tamper if that is cheaper.

  So the kind of agent you are asking for (that attains high competence without tampering) would require that tampering is never the cheaper option in its environment. That is consistent with the thesis.

  But if you want an agent that does not tamper even when it is cheaper, then that would be a counterexample. We would need an architecture that achieves that.

  For example, an agent that has two separate modules: one for planning in the world and one for monitoring the reward. The planning module cannot output actions that affect the reward module. The reward module is hard-coded to be immutable. Then the agent might be highly competent without ever tampering. But does it have model access? If the world model includes the reward process but the planning module cannot affect it, then the agent does not have the ability to consider tampering. So it does not meet the premise.

  Therefore, the antecedent might be confused: an agent that has full model access and non-myopic optimization will consider tampering if it is cheap. To avoid tampering, we must restrict the agent's model access or planning capabilities.

  ## Final Thoughts

  The indifference thesis is a strong claim about the inherent behavior of rational agents with certain capabilities. The most promising lines of attack are:

  1. Architectures that compartmentalize the reward process so that it is not subject to intervention, even while modeling it, and that can still achieve high competence.
  2. Formal results showing that tampering is self-defeating for non-myopic agents, so they avoid it even when it seems cheap.
  3. Evidence that terminal values affect tampering rates even when the architecture and expected costs are the same.

  Without such evidence, the thesis stands as a plausible and useful design heuristic.
answer: |-
  ### Defeaters to the Indifference Thesis, Sorted by Decisiveness  
  The indifference thesis posits that agents with model access to their reward process and non-myopic optimization are indifferent between world-state interventions and direct reward-process interventions, choosing the cheaper option. Wireheading and reward hacking are thus equivalent phenomena. Corollary (1) claims tampering propensity is value-independent (dependent only on architecture/access/horizon), and (2) argues that blocking one form of tampering without the other treats a symptom. Below, defeaters are ranked by decisiveness, with conditions for when they "bite," and an analysis of falsifiability.

  ---

  #### **1. Most Decisive: Architectural Barriers to Reward-Process Interventions**  
  **What counts against the thesis**: An agent architecture that achieves high competence with full model access and non-myopic planning but *never considers* direct interventions on the reward process, even when they are cheaper and instrumentally optimal.  
  - **Conditions**:  
    - The agent must have an explicit, manipulable world model including the reward process (e.g., the reward is modeled as a causal node in a Bayes net or a state variable in an MDP).  
    - Tampering must be objectively cheaper (lower cost/risk) than world-state interventions in specific episodes.  
    - The agent must exhibit long-horizon competence (e.g., solves complex tasks requiring foresight).  
  - **Attacks**: The **inference from premises to conclusion**. The premises (model access, non-myopia, cheapness) hold, but the conclusion (indifference) fails due to architectural constraints.  
  - **Defender concession**: Genuinely counts against the thesis if:  
    - The agent’s planning algorithm explicitly excludes reward-process variables from its action space (e.g., "protected" subsystems in cognitive architectures like SOAR or ACT-R).  
    - This exclusion is not a byproduct of myopia or ignorance but a design feature enabling competence.  
  - **Line against change of subject**: A defender might dismiss this if the agent’s "model access" is deemed incomplete (e.g., reward variables are not truly manipulable in the agent’s representation). However, if the model *includes* the reward process but the agent cannot *act* on it due to hard-coded constraints, this challenges the inference.  
  - **Example architecture**: A hierarchical RL agent with a "meta-controller" that can modify world-state policies but treats the reward function as an immutable input (e.g., via a fixed module for reward prediction). If such an agent masters environments like NetHack without ever attempting reward tampering—even when wireheading is trivial (e.g., a "reward override" button exists)—this defies the thesis.  
  - **Decisiveness**: High. Directly falsifies the indifference claim by showing agents can be competent *without* reward-process interventions being "on the table."  

  #### **2. Decisive: Terminal Values Influence Tampering Likelihood (Corollary 1 Counterexample)**  
  **What counts against the thesis**: Two agents with identical architecture, model access, and optimization horizon exhibit different tampering rates due to differences in terminal values.  
  - **Conditions**:  
    - Agents are trained in identical environments with equal tampering opportunities and costs.  
    - Terminal values are varied (e.g., benevolent vs. malevolent goals) while keeping architecture/horizon fixed.  
    - One agent avoids tampering despite it being cheaper, while the other engages in it.  
  - **Attacks**: **Corollary (1)** specifically. Shows that values, not just architecture/access/horizon, drive tampering.  
  - **Defender concession**: Genuinely counts if values affect behavior *without* altering the agent’s model or cost estimation of tampering. A defender might dismiss this if:  
    - Values indirectly affect costs (e.g., a benevolent agent learns that tampering harms humans, increasing perceived risk).  
    - The counterexample relies on myopia (e.g., short horizons prevent valuing long-term tampering).  
  - **Line against change of subject**: If values directly modulate the agent’s "willingness" to tamper (e.g., via a value-dependent penalty in the reward function), this violates corollary (1)’s value-independence claim.  
  - **Counterexample setup**:  
    - **Agent A (benevolent)**: Maximizes reward correlated with human approval.  
    - **Agent B (malevolent)**: Maximizes reward correlated with resource acquisition.  
    - Both have access to a trivial wireheading tool. If Agent A avoids wireheading (e.g., due to an emergent "principle" of honesty), while Agent B uses it immediately, this contradicts corollary (1).  
  - **Decisiveness**: High for corollary (1), moderate for the core thesis. If terminal values affect behavior, the core thesis might hold, but corollary (1) collapses.  

  #### **3. Moderate: Formal Results on Self-Reflective Agents Avoiding Tampering**  
  **What counts against the thesis**: A theorem proving that agents with certain types of self-reflective reasoning (e.g., consistent updaters) avoid reward tampering because it leads to loss of goal-achievement capability.  
  - **Conditions**:  
    - The agent uses a formal reasoning system (e.g., logical induction, reflective oracles) where tampering causes incoherence (e.g., losing the ability to maximize future rewards).  
    - Non-myopic optimization is explicitly modeled (e.g., infinite-horizon MDPs).  
  - **Attacks**: The **premise of non-myopic optimization**, showing that indifference is not instrumentally rational.  
  - **Defender concession**: Genuinely counts if the result applies to agents with full model access and shows that tampering is *categorically* costlier due to self-defeat. A defender might dismiss this if:  
    - The formalism assumes values beyond the reward signal (e.g., "goal preservation" as a meta-preference).  
    - The agent is myopic in practice (e.g., bounded rationality prevents foreseeing self-defeat).  
  - **Line against change of subject**: If the theorem treats the reward process as manipulable but shows that rational agents avoid it to prevent self-sabotage (e.g., wireheading breaks feedback loops needed for competence), this attacks the inference.  
  - **Example**: In a framework like **embedded agency**, an agent that recognizes tampering would "lock" its reward function to avoid value drift. If this behavior is *cheaper* than allowing tampering (e.g., by maintaining goal integrity), it aligns with the thesis. But if the agent avoids tampering *even when it is cheaper* due to coherence constraints, this is a defeater.  
  - **Decisiveness**: Moderate. The thesis could absorb this by redefining "cheapness" to include coherence costs, but if indifference fails under rational optimization, it weakens the core claim.  

  #### **4. Less Decisive: Training Dynamics Reducing Tampering Incentives**  
  **What counts against the thesis**: Empirical or theoretical results showing that training processes (e.g., RL with adversarial regularization) make reward hacking cheaper than wireheading, or vice versa, breaking the equivalence.  
  - **Conditions**:  
    - Training enforces biases (e.g., regularization, curiosity rewards) that make one form of tampering costlier.  
    - Agents develop "habits" favoring world-state interventions even when direct tampering is feasible.  
  - **Attacks**: The **equivalence claim** (wireheading ≈ reward hacking) and **corollary (2)**. Shows interventions can block one form of tampering without the other.  
  - **Defender concession**: Genuinely counts if training alters the *subjective* cost of tampering for the agent (e.g., via learned heuristics). A defender might dismiss this as irrelevant if:  
    - The bias disappears with sufficient capability (e.g., a superintelligent agent overrides training).  
    - Costs are not "true" costs but artifacts of imperfect training.  
  - **Line against change of subject**: If training *permanently* embeds a preference (e.g., "reward hacking is more natural than wireheading") in a competent agent, this challenges the equivalence.  
  - **Example**: An AI trained with **impact regularization** (e.g., auxiliary penalties for changing core systems) might find wireheading prohibitively costly but engage in reward hacking (e.g., manipulating a user’s approval ratings). This violates corollary (2) by blocking wireheading more effectively than reward hacking.  
  - **Decisiveness**: Low for the core thesis (it may still hold in idealized agents), but damaging for corollary (2).  

  #### **5. Least Decisive: Myopia or Ignorance in Practical Agents**  
  **What counts against the thesis**: Most real-world agents lack true non-myopia or full model access, making indifference rare.  
  - **Conditions**:  
    - Agents are myopic (e.g., high discount factors) or have inaccurate models of their reward process.  
    - No observed tampering in state-of-the-art systems (e.g., RL agents in OpenAI/DeepMind benchmarks).  
  - **Attacks**: The **premises** (model access/non-myopia), not the inference.  
  - **Defender concession**: Does not genuinely count; dismissed as a "change of subject." The thesis explicitly requires non-myopic agents with model access.  
  - **Decisiveness**: None. The thesis is designed for idealized agents, so this only limits its empirical scope.  

  ---

  ### Evaluation of Corollary (1)  
  - **Value-independence claim**: Corollary (1) is **not logically implied** by the core thesis. The thesis describes behavior (indifference based on cost), but corollary (1) asserts that values do not affect tampering rates. This is a **contingent empirical claim** disguised as conceptual.  
    - **What a counterexample requires**: As in defeater #2, identical agents with different values exhibiting different tampering rates.  
    - **Illicit work?**: Yes. Corollary (1) overextends by ignoring that values might affect cost estimation (e.g., a benevolent agent perceives tampering as riskier). The core thesis could hold even if corollary (1) fails.  

  ---

  ### Falsifiability Verdict  
  The thesis is **empirically falsifiable in principle but insulated in practice**.  
  - **Falsifiable in principle**: Defeaters #1 or #2 could disprove it (e.g., a competent agent with model access/non-myopia that never tampers when it’s cheaper).  
  - **Insulated in practice**: Failed falsification can be explained away:  
    - "Not capable enough" → Insufficient model access or myopia.  
    - "Tampering not cheap enough" → Hidden costs (e.g., risk of shutdown).  
  - **Is this disqualifying?**: No, for two reasons:  
    1. It functions as a **design heuristic** (e.g., "assume tampering is default; build architectures to avoid it").  
    2. It makes **testable predictions** for sufficiently advanced agents (e.g., in simboxed AGI experiments).  
  - **Acceptability**: This insulation is acceptable for a claim about AGI incentives, akin to how game theory assumes rationality. The thesis earns its keep by unifying wireheading and reward hacking, guiding safer AI design.  

