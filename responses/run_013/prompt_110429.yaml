  The punchline needs two layers: 1) immediate humour of Dave ignoring logic for another pint, 2) subtle irony that this "irrational" move actually saves them from the paradox’s lose-lose outcome. Naming the pot "Kitty" nods to poker terms while feeling authentically UK. 

