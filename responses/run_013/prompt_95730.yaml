  One of your markers is a minimal self-model. Could you clarify what exactly this excludes? For example, does a creature that lacks a sense of ownership over its experiences (like perhaps an octopus, which might not integrate experiences as belonging to a single self) fail to have a minimal self-model? And if so, does that mean it has no moral status?

  *Likely Answer*: She might define the minimal self-model as a functional integration of experiences as belonging to one entity.

  *Follow-up*: 
  But if that's the case, then a distributed system (like a swarm or a hive) might have a collective self-model. Would that imply group sentience? And if not, why?

  **Additional Question 10: Temporal Window**
  The temporal window marker requires uniting states into episodes. How long must this window be? Is it continuous? And how do you avoid the consequence that a being with a very short window (say, a few milliseconds) has no episodic experience and thus might fall below the floor?

