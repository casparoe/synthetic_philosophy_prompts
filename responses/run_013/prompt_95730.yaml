  *Likely Answer*: She might say that the stake factor is defined in terms of the range of valenced states.

  *Follow-up*: 
  But then, doesn't that make the stake factor redundant? If the stake factor is just the range of valence, then moral status = (degree of sentience) * (range of valence). But your degree of sentience already includes valence as one marker. Isn't this double-counting?

  **Question 6: Aggregation**
  Given that moral status is scalar, how does your account handle aggregation? For example, may we sacrifice one being with high moral status to save many beings with low moral status? And if so, on what principle? Is it simply additive utilitarianism, or do you have a different aggregation rule?

  *Likely Answer*: She might say that aggregation is additive, or that moral status weights the interests.

  *Follow-up*: 
  If additive, then wouldn't it be permissible to sacrifice one human to save a sufficiently large number of insects, if they have any moral status at all? And if not additive, what is the aggregation principle, and how does it avoid arbitrary thresholds?

  **Question 7: Weighting of Markers**
  Your four markers are combined non-compensatorily above the floor. But how are they weighted? For example, is valence more important than temporal binding? And are these weights discovered through empirical investigation or are they a philosophical stipulation?

  *Likely Answer*: She might say they are discovered empirically, or that they are part of the functional analysis.

  *Follow-up*: 
  If empirical, what kind of experiment could determine the relative weights? And if it's philosophical, how do you avoid the charge that the weights are arbitrary?

  **Question 8: Undermining the Measurement-Program Deflection**
  You often describe your view as a measurement program rather than a metaphysics. But doesn't the non-compensatory structure with a floor, and the specific choice of four markers, already embed substantive metaphysical commitments? For instance, why should we accept that a being without a minimal self-model has zero moral status, rather than just diminished? Isn't that a metaphysical claim about the necessary conditions for moral status?

