  *Likely Answer*: She might say it's a region of vagueness, or that it's sharp but based on a functional discontinuity.

  *Follow-up*: 
  - If she says it's vague: Then how do you avoid the sorites paradox for moral status? For instance, if we have a series of creatures with gradually increasing valence, at what point do we start having moral obligations? And doesn't this vagueness make the theory impractical for real decisions?
  - If she says it's sharp: What empirical evidence could possibly justify a sharp cutoff in what you admit is a continuous underlying reality? Isn't this just an arbitrary line?

  **Question 2: Non-compensatory Structure**
  Consider a system that scores maximally on valence but minimally on temporal binding (say, very brief episodes) versus one with moderate scores on all markers. Could the first system outrank the second? And if so, what would that imply for our moral treatment of such a being?

  *Likely Answer*: She might say that above the floor, the markers trade off, so yes, it could outrank.

  *Follow-up*: 
  But if a being with extremely brief temporal episodes (say, only a few seconds) but intense pleasure can outrank a being with moderate but stable well-being, doesn't that violate our intuition that stability of experience matters? How would you justify the moral priority of such a fleeting but intense valenced state?

  **Question 3: Functional Realization**
  You describe sentience in purely functional terms. But then, what prevents a sophisticated thermostat, which might be said to have valenced states (too cold = bad, set point = good) and some form of binding (integrating temperature and humidity) and a temporal window (over a few minutes) from having moral status? Where exactly does your account draw the line between such an artifact and a marginal animal?

  *Likely Answer*: She might say the thermostat lacks a minimal self-model or perhaps the complexity of the markers.

  *Follow-up*: 
  Could you specify the minimal functional requirements for a self-model? And if we built a robot that met all four markers to a degree above the floor, would you grant it moral status? If not, what non-functional element is missing?

  **Question 4: Insects and Empirical Testability**
  Your account seems to imply that insects might have some degree of sentience. But how can we independently measure, say, the presence of valenced states in an insect without already assuming sentience? Without such independent measures, isn't your account merely adaptable to any empirical finding rather than testable?

  *Likely Answer*: She might point to behavioral or neural correlates.

  *Follow-up*: 
  But if we use behavioral criteria (like avoidance) for valence, aren't we in danger of conflating sentient pain with mere nociception? And if we use neural criteria, how do we avoid the charge that we are just stipulating which neural features count without a clear functional definition?

