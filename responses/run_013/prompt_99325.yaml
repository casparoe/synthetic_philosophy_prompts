prompt: |-
  Alright, bit of a long one, and I apolgize in advance for the rambling. I'm a retired soil chemist -- 34 years in a lab, mostly nitrogen cycling, and since I hung up the pipette I've been sitting in on a political philosophy reading group at the local university, which has been humbling in the best way. Last week we got onto the old puzzle about voting: the chance that any single ballot changes the outcome of a national election is astronomically small, so on a straight expected-utility reading dragging yourself to the polling station looks like a waste of an afternoon, and yet almost nobody thinks a person who votes is being irrational, and a good few of us think there's something a bit off about the healthy adult who just shrugs and stays home. I got into a slightly heated argument about it that I'm still chewing on over breakfast, and halfway through I realized I don't actually know what I'm demanding of an answer. So before I read another word on it, I want the spec sheet.

  Write me the desiderata: what any adequate theory of the rationality of voting has to deliver. Which cases it has to get right, and I mean the whole zoo of them -- the nationwide election where my causal footprint is essentially nil, the five-person committee or the tied local race where a single vote is genuinely pivotal, the person who votes purely because it makes her feel like a participant, the abstainer who is simply indifferent to who wins, the voter who casts a ballot mainly to cancel out her brother-in-law's. Which distinctions it can't be allowed to collapse -- between the rationality of the act and the rationality of the disposition or habit or rule, between explaining why people turn out and justifying it, between instrumental and expressive and civic-duty stories, between the question of my own vote and the question of what everyone like me should do. Which results it has to stay consistent with -- that turnout isn't zero, that it drops as the cost and hassle rise, that voting has the shape of a public good with a free-rider problem built in. Give me the consideration behind each requirement, tell me which of them are non-negotiable and which are just the preferences of one camp, and flag any group you suspect can't be satisfied all at once -- my own hunch, and I'd like you to check it, is that you can't simultaneously insist the standard is purely instrumental expected utility, respect how negligible one vote's causal impact really is, and still come out saying voting is rational or required, so if that trio is jointly unsatisfiable I want to see it spelled out. And tell me which single requirement does the most damage, i.e. rules out the most popular answers on its own. If a couple of the usual contenders -- the expected-utility line, the expressive line, the rule-or-ethical line -- fall out quickly against the list, a sentence or two each is plenty; I'll do the real scorecard myself once I know what I'm grading against.
reasoning: |-
  Okay, the user is a retired soil chemist with 34 years of experience in nitrogen cycling. They've been attending a political philosophy reading group and recently got into a heated argument about the rationality of voting. They want a comprehensive list of desiderata for any theory explaining why voting is rational. 

  First, I need to unpack their request. They mentioned several scenarios: national elections where one vote is negligible, small committees where a vote can be pivotal, expressive voters, indifferent abstainers, and those voting to cancel out someone else's vote. They also want distinctions between rationality of act vs. habit, explanation vs. justification, instrumental vs. expressive reasons, and individual vs. collective actions. Plus, the theory must align with real-world observations like non-zero turnout, cost sensitivity, and voting as a public good with free-rider problems.

  The user’s hunch is that you can't reconcile instrumental expected utility with the negligible impact of a single vote and still call voting rational. They want this checked. Also, they want to know which single requirement disqualifies most theories.

  Starting with the core tension: expected utility (EU). In large elections, the probability of being pivotal is minuscule. If the cost of voting (time, effort) outweighs the tiny EU, voting seems irrational. But people do vote, so theories must resolve this paradox. Expressive voting is one alternative—people vote to express identity or values, not to influence outcomes. But then, how does this account for close elections where turnout might spike? 

  Civic duty theories suggest voting is a moral obligation. However, this might not satisfy someone looking for instrumental rationality. The public goods aspect is tricky: if everyone thinks their vote doesn't matter, turnout drops, harming democracy. But if voting is a duty, it becomes a categorical imperative, not dependent on outcomes.

  The user also wants distinctions like act vs. rule rationality. Acting on a rule ("always vote") might be rational even if each act isn't. But maintaining the habit could have costs. Then there’s the difference between explaining why people vote (sociology/psychology) vs. justifying it (normative reasons). A good theory needs both.

  Real-world observations: Turnout isn't zero, so theories must explain participation. As costs rise (bad weather, longer lines), turnout drops, supporting the cost-benefit model. But if expressive or duty-based, maybe cost sensitivity is lower? Data shows it does drop, so theories must incorporate costs.

  The user’s trio: instrumental EU, negligible impact, and rationality of voting. If you strictly adhere to instrumental EU, and the impact is negligible, voting is irrational. But people vote anyway. So either instrumental EU isn't the only reason, or the impact isn't always negligible (small elections), or voting isn't purely instrumental. 

  Which requirement kills most theories? Probably the negligible impact in large elections. Many theories (like expressive) avoid this by changing the motive. But if the user insists on instrumental rationality, those alternatives fail. 

  Key desiderata:
  1. **Scale Sensitivity**: Must handle different election sizes. In small groups, pivotal voting is rational; in large, it's not. So the theory should account for scale.
  2. **Motivational Pluralism**: Voters have mixed motives—instrumental, expressive, duty. A theory shouldn't reduce to just one.
  3. **Cost Acknowledgment**: Voting has costs; theories must explain why people incur them despite low impact.
  4. **Non-Zero Turnout**: Explain why anyone votes in large elections.
  5. **Marginal Cost Sensitivity**: Higher costs reduce turnout. The theory must align with this.
  6. **Public Good Character**: Voting benefits society but is non-excludable, leading to free-rider problems. Theories need to address why people don't free-ride.
  7. **Rationality Distinctions**: Separate act, rule, and disposition rationality. Maybe voting as a rule is rational, even if individual acts aren't.
  8. **Explanation vs. Justification**: Distinguish why people vote (empirical) from why they should (normative).
  9. **Expressive vs. Instrumental**: Don’t conflate voting to express identity with voting to influence outcomes.
  10. **Individual vs. Collective**: Explain individual actions while considering group effects (e.g., if all like-minded abstain, they lose).

  The trio conflict: If you demand instrumental rationality, negligible impact, and voting's rationality, it's impossible. But if you allow other motives or rule-based rationality, it's feasible. The user’s hunch is correct—those three can't coexist. 

  Most damaging requirement? **Negligible Causal Impact in Large Elections**. This undermines pure instrumental theories. Alternatives (expressive, duty) avoid it but might not satisfy someone focused on instrumental rationality. 

  Popular contenders:
  - **Instrumental EU**: Fails in large elections due to low pivot probability. Only works in small groups.
  - **Expressive Voting**: Avoids the pivot problem but struggles with cost sensitivity (why incur costs to express?) and doesn't fully address public good/free-rider issues.
  - **Civic Duty**: Solves turnout but may not provide instrumental justification. Duty could be seen as a preference (utility from doing duty), blending into instrumental. 

  The user needs clarity on which desiderata are non-negotiable. For example, if they insist on instrumental rationality, then only pivotal voting in small groups works. Otherwise, they must accept other motives or rule-based approaches. 

  Also, the public good problem: Even if everyone has a duty, free-riding is tempting. Duty theories need to explain why individuals comply despite costs. 

  In summary, the theory must be multifaceted, acknowledging different contexts and motivations. The user's challenge is balancing empirical observations with normative justifications while respecting the nuances they outlined.
answer: |-
  Here's your desiderata "spec sheet" for a theory of voting rationality, structured to address your scenarios, distinctions, and constraints. I've flagged tensions, non-negotiables, and the "damage" potential of key requirements.

  ---

  ### **Core Desiderata: What Any Adequate Theory Must Deliver**

  1. **Scale Invariance**  
     - **Must Handle:** Rationality in both large-scale elections (negligible pivot probability) AND small-scale decisions (e.g., 5-person committee, tied local race).  
     - **Why:** A theory that only works for one scale fails empirically.  
     - **Non-negotiable:** Yes. Collapsing this distinction invalidates real-world voting contexts.

  2. **Cost Sensitivity**  
     - **Must Explain:** Why turnout drops as costs rise (e.g., bad weather, registration hurdles, distance to polls), but persists when costs are low (e.g., mail-in voting).  
     - **Why:** Empirical observation (e.g., 1-5% turnout drop in rain). Ignores this at its peril.  
     - **Non-negotiable:** Yes. Violations contradict evidence.

  3. **Non-Zero Turnout**  
     - **Must Explain:** Why anyone votes in large elections despite negligible pivot probability.  
     - **Why:** Turnout isn't zero, even in safe seats. A theory implying universal abstention fails.  
     - **Non-negotiable:** Yes.

  4. **Pivotality & Instrumental Rationality**  
     - **Must Acknowledge:** The *true* near-zero probability of a single vote changing a national election outcome.  
     - **Why:** Statistical reality. Denying this is empirically indefensible.  
     - **Non-negotiable:** Yes. Theories must work *within* this constraint.

  5. **Motivational Pluralism**  
     - **Must Accommodate:**  
       - The **expressive voter** (votes for identity/expression).  
       - The **instrumental voter** (votes to influence outcome).  
       - The **duty-driven voter** (votes out of civic obligation).  
       - The **strategic abstainer** (indifferent to outcome).  
       - The **counterbalancer** (e.g., canceling a brother-in-law's vote).  
     - **Why:** All exist empirically. A monolithic theory fails descriptively.  
     - **Non-negotiable:** For explanatory adequacy, yes. For normative purity, debatable.

  6. **Public Good Structure**  
     - **Must Grapple With:** Voting as a public good (non-excludable, non-rivalrous benefit) with a free-rider problem.  
     - **Why:** High turnout benefits democracy, but individuals bear private costs. Explains systemic fragility.  
     - **Non-negotiable:** Yes. Ignoring this misdiagnoses low turnout.

  ---

  ### **Critical Distinctions Theories Must Preserve**

  7. **Act vs. Rule Rationality**  
     - **Must Distinguish:** Rationality of *voting this time* (act) vs. rationality of *adopting a voting habit* (rule/disposition).  
     - **Why:** A "habitual voter" may act rationally *as a rule-follower* even if a single act is instrumentally irrational.  
     - **Non-negotiable:** Yes. Conflation causes category errors.

  8. **Explanation vs. Justification**  
     - **Must Separate:** Why people *do* vote (descriptive/explanatory) from why they *should* vote (normative/justificatory).  
     - **Why:** Your reading group likely conflates these. A theory can "explain" expressive voting without "justifying" it ethically.  
     - **Non-negotiable:** Yes. Merging them invites circularity.

  9. **Instrumental vs. Expressive vs. Deontic Rationality**  
     - **Must Not Collapse:**  
       - *Instrumental:* Voting as means to an end (e.g., changing outcome).  
       - *Expressive:* Voting as consumption/identity-signaling (e.g., "feeling like a participant").  
       - *Deontic:* Voting as ethical duty (e.g., "civic virtue").  
     - **Why:** These imply different rational standards (e.g., expressive acts need not be pivotal).  
     - **Non-negotiable:** Yes. Conflation obscures key debates.

  10. **Individual vs. Collective Rationality**  
      - **Must Address:** Why *I* should vote given *my negligible impact*, and why *groups like me* (e.g., "swing voters") should vote.  
      - **Why:** If all "like me" abstain, we lose—but individual incentives don’t reflect this.  
      - **Non-negotiable:** Yes. Ignores coordination problems.

  ---

  ### **Tensions & Unsatisfiable Triads**
  - **Your Hunch is Correct:** The trio **{Purely Instrumental Rationality + Respect Negligible Impact + Voting is Rational} is UNSATISFIABLE** in large elections.  
    - *Why:* If voting is only rational if it influences outcomes (instrumental), but one vote doesn't influence outcomes (negligible impact), voting is irrational. Full stop.  
    - *Escape Routes:* Abandon instrumentalism (add expressive/deontic motives) or abandon rationality-as-pivotality (e.g., adopt rule-utilitarianism).

  - **Other Tensions:**  
    - **Public Good vs. Cost Sensitivity:** High costs exacerbate free-rider problems, but duty/expressive theories under-predict cost sensitivity.  
    - **Duty vs. Explanatory Adequacy:** If voting is a duty, why do costs reduce turnout? Duty theories struggle with marginal cost sensitivity.

  ---

  ### **The "Most Damaging" Requirement**
  **Negligible Causal Impact (Pivotality)**  
  - **Why it Rules Out Most Theories:**  
    - **Pure Expected Utility (EU):** Destroyed immediately. EU = P(pivot) × Benefit − Cost. P(pivot) ≈ 0 → EU < 0.  
    - **Minimal Group Impact:** If "groups like me" are large (e.g., 1 million swing voters), P(pivot) for the *group* is high, but *individual* impact remains negligible → fails to rescue instrumentalism.  
    - **Expressive Theories:** Survive pivotality but struggle with cost sensitivity (why pay high costs for expression?) and public good structure (free-rider problem remains).  
    - **Duty Theories:** Survive pivotality but face challenges explaining cost sensitivity and empirical turnout variance.  
  - **Damage Assessment:** Kills all purely instrumental accounts outright. Forces non-instrumental justifications or rule-based workarounds.

  ---

  ### **Quick Scorecard of Popular Theories**
  1. **Expected Utility (Instrumental):**  
     - *Fails:* Pivotality in large elections, non-zero turnout. Only works in small groups.  
  2. **Expressive Voting:**  
     - *Survives:* Pivotality, non-zero turnout, motivational pluralism.  
     - *Struggles With:* Cost sensitivity (unless expression utility > cost), public good/free-rider issues.  
  3. **Civic Duty (Deontic):**  
     - *Survives:* Pivotality, non-zero turnout.  
     - *Struggles With:* Cost sensitivity (why does rain reduce duty?), distinguishing duty from preference.  
  4. **Rule Utilitarianism ("Voting Rule"):**  
     - *Survives:* Pivotality (by shifting to rule rationality), non-zero turnout.  
     - *Struggles With:* Why adopt a voting rule if aware of negligible impact? Cost sensitivity at the rule level.

  ---

  ### **Non-Negotiables Summary**
  - **Empirical Musts:** Scale invariance, cost sensitivity, non-zero turnout, pivotality, public good structure.  
  - **Conceptual Musts:** Act/rule distinction, explanation/justification split, instrumental/expressive/deontic separation.  
  - **Your Triad is Unsatisfiable:** Instrumental rationality + negligible impact + voting rationality cannot coexist in large elections. Any theory claiming otherwise is suspect.  

  Time to build your scorecard. The field is messy, but this spec sheet should help you spot which theories are worth your pipette-sharp rigor.
