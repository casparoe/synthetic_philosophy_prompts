answer: |-
  ### Joint Statement on the Careenium and Simmballs  
  **Agreed and Signed by the Pattern Causalist (PC) and Substrate Causalist (SC)**  

  #### 1. Points of Agreement  
  We, the Pattern Causalist and Substrate Causalist, affirm the following about the careenium—a sealed, deterministic Newtonian system composed solely of billiard balls, their positions, and collisions, with no external forces or quantum indeterminacy:  

  1. **Nature of the Careenium**: The careenium is microphysically closed and deterministic. All future states are fixed by initial conditions and Newtonian laws. Only the balls, their positions, and collisions exist.  
  2. **Reality of Simmballs**: Simmballs are stable, macroscopic patterns that emerge from ball collisions. They persist, merge, divide, and interact in ways that track environmental features (e.g., boundary conditions). They are "real patterns" in that they are observable, predictable, and indispensable for describing system behavior.  
  3. **Supervenience without Reduction**: Simmballs supervene on the microstate of the balls: any change in simmballs requires a change in the underlying ball configuration. However, multiple microstates can realize the same simmball pattern (multiple realizability).  
  4. **Causal Closure at the Ball Level**: Every event in the careenium is fully determined by the history of ball collisions. There are no "gaps" in the micro-causal chain.  
  5. **Indispensability of Simmball Descriptions**: Simmball-level descriptions are pragmatically necessary for prediction and understanding. A purely ball-level account, while complete in principle, is computationally intractable for any observer.  
  6. **What Determinism Does Not Imply**:  
     - Determinism does not deny the reality of simmballs (they are robust patterns).  
     - Determinism does not imply that simmball-level explanations are false or illusory (they capture real system properties).  
     - Determinism does not resolve whether simmballs are causal or merely descriptive.  
  7. **Meaning of "Push"**: To "push" means to be a difference-maker: if X had been absent or different (holding other relevant factors fixed), the outcome would have changed. Both levels (balls and simmballs) can describe difference-making, but we disagree on which level is fundamental.  
  8. **Difference-Making Criteria**:  
     - A micro-difference-maker is a specific ball’s state or collision that alters subsequent ball trajectories.  
     - A macro-difference-maker is a simmball pattern whose presence/absence alters subsequent simmball dynamics.  
     Crucially, a macro-difference does not imply macro-causation (SC) or deny it (PC).  

  #### 2. Table of Remaining Disagreements  
  | Issue | Pattern Causalist (PC) Position | Substrate Causalist (SC) Position |  
  |-------|---------------------------------|----------------------------------|  
  | **Causal Efficacy** | "Simmballs are causal: when a simmball tokens a symbol, that pattern *pushes* the balls’ behavior. Omitting simmballs from a causal account leaves out real forces." | "Only balls are causal: simmballs *summarize* ball collisions but exert no force. They are useful fictions that do no work." |  
  | **Completeness of Causal Accounts** | "A ball-level account is incomplete; it cannot explain system behavior without referencing simmballs. Causally relevant patterns exist at multiple levels." | "A ball-level account is complete; simmballs add no causal information. Macro-regularities are exhaustively fixed by micro-dynamics." |  
  | **Ontology of "Pushing"** | "To ‘push’ is to be a robust difference-maker. Simmballs push because they are the smallest units that reliably make differences in system outcomes." | "To ‘push’ is to transfer momentum via collision. Only balls push; simmballs are not physical entities and cannot transfer energy." |  

  #### 3. Cruxes: Experiments to Resolve Disagreements  
  We identify the following unresolved sub-questions (cruxes) and design experiments to test them. Predictions are stated in advance.  

  **Crux 1: Can simmballs cause differences without micro-differences?**  
  - **Case (a)**: Two careenia with different micro-realizations but identical simmball trajectories.  
    - **Intervention**: Initialize Careenium A and B with divergent ball configurations but identical simmball sequences. Apply identical environmental inputs (e.g., identical boundary perturbation). Observe if subsequent simmball trajectories diverge.  
    - **PC Prediction**: Trajectories remain identical; simmball history causally overrides micro-differences.  
    - **SC Prediction**: Trajectories diverge; micro-differences inevitably propagate and alter outcomes.  

  **Crux 2: Are simmballs preserved under micro-alterations if they make no causal difference?**  
  - **Case (b)**: A careenium where a simmball is preserved while exact ball paths are altered non-disruptively.  
    - **Intervention**: During stable simmball S, alter ball velocities in a way that leaves S intact (e.g., symmetrically swap balls within S). Observe if S’s causal role changes (e.g., its response to a standard input).  
    - **PC Prediction**: S’s causal role is unchanged; the pattern is the unit of stability.  
    - **SC Prediction**: S’s causal role may change; stability is an artifact of the alteration’s precision, not pattern causation.  

  **Crux 3: Which level’s intervention controls outcomes?**  
  - **Case (c1)**: Intervention that changes a simmball without changing any individual ball’s laws.  
    - **Intervention**: Alter a simmball (e.g., reshape it to token "Y" instead of "X") by adjusting ball positions, preserving Newtonian laws. Observe the system’s downstream behavior.  
    - **PC Prediction**: Downstream simmballs change; pattern-level intervention is causal.  
    - **SC Prediction**: Downstream changes occur only due to micro-alterations; the simmball change is descriptive.  
  - **Case (c2)**: Intervention on individual balls that leaves the simmball intact.  
    - **Intervention**: Alter a subset of balls non-symmetrically but preserve the simmball’s macro-structure (e.g., reposition internal balls without changing boundaries). Observe downstream effects.  
    - **PC Prediction**: Downstream simmballs remain identical; the pattern absorbs micro-noise.  
    - **SC Prediction**: Downstream simmballs eventually diverge; micro-changes propagate.  

  **Crux 4: Can simmballs be causally idle correlates?**  
  - **Case (d)**: A careenium where a simmball correlates with an environmental feature but is causally idle at the ball level.  
    - **Intervention**: Design a simmball "R" that tracks an environmental input but does not interact with other simmballs (e.g., its balls never collide with balls in causal chains). Test if "R"’s presence affects system outcomes.  
    - **PC Prediction**: "R" is epiphenomenal; it tracks but does not push. This proves not all patterns are causal.  
    - **SC Prediction**: "R" is inherently idle; it confirms simmballs are never causal, only balls are.  

  #### On Verbal Disagreement  
  We agree that part of our dispute is verbal, centering on the term "cause." PC defines "cause" as *any robust difference-maker*, including patterns. SC defines "cause" as *local momentum transfer* via collisions. This semantic divergence explains why PC sees simmballs as causal (they reliably make differences) while SC denies it (they transfer no momentum). However, the disagreement is not merely verbal: it hinges on whether patterns can be *fundamental* difference-makers independent of micro-details (a substantive claim testable via the cruxes above).  

  ---  
  **Signed,**  
  *The Pattern Causalist*  
  *The Substrate Causalist*  
