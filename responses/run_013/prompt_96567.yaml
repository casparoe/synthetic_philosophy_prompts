  We are drafting a joint statement between Pattern Causalist (PC) and Substrate Causalist (SC) regarding the careenium, a deterministic Newtonian system of billiard balls in a sealed box, exhibiting stable macroscopic patterns called simmballs.

  The statement must include:
  1. A numbered list of claims both can sign.
  2. A table of remaining disagreements, with each side's position in acceptable wording.
  3. Cruxes: sub-questions that would move at least one side, with concrete cases and predictions for each.

  Concrete cases to address:
  (a) Two careenia with different micro-realizations but the same simmball trajectory.
  (b) A careenium whose simmball is preserved while the exact paths of its balls are altered.
  (c) Interventions: one that changes a simmball without changing any individual ball's law, and one on individual balls that leaves the simmball intact.
  (d) A careenium where a simmball correlates with an environmental feature but is causally idle at the ball level.

  We must also note if part of the dispute is merely verbal.

  Let's structure the document accordingly.

  ---

  **Joint Statement on the Careenium and Simmballs**

  We, the undersigned Pattern Causalist (PC) and Substrate Causalist (SC), after extensive discussion, agree on the following points and clarify our remaining disagreements. We recognize that our dispute may be partially verbal, particularly regarding the meaning of "cause" and "push", but also substantive about what constitutes a complete causal account.

  ### 1. Points of Agreement

  We jointly affirm the following:

  1. **The Careenium's Nature**: The careenium is a sealed, deterministic Newtonian system. It consists solely of billiard balls, their positions, and their collisions. There are no additional forces and no quantum indeterminacy. The entire history and future of the system are fixed by the initial conditions and the laws of motion.

  2. **Existence of Simmballs**: The careenium exhibits stable macroscopic patterns (simmballs) that persist, merge, divide, and interact in complex ways. These patterns are real in the sense that they are robust, observable (by an external observer), and track features of the environment. They are not illusions.

  3. **Indispensability of Simmball Descriptions**: For any intelligent observer (including us), describing the behavior of the careenium solely at the level of individual balls is practically impossible due to the enormous number of balls. Descriptions at the level of simmballs are indispensable for prediction, explanation, and understanding of the system's macroscopic behavior.

  4. **Causal Closure at the Ball Level**: Every event in the careenium, including every collision and every change in position or velocity of any ball, is entirely determined by the prior state of the balls and the laws of motion. There is no causal influence from outside the system and no "gap" in the causal chain at the micro-level.

  5. **Supervenience**: The simmball patterns supervene on the microstate of the balls. Any change in the simmballs necessarily implies a change in the underlying ball configuration. However, multiple microstates can realize the same simmball pattern (multiple realizability).

  6. **Causal Accounts and Levels of Description**: A complete causal account at the micro-level (ball collisions) is possible and, in principle, sufficient to predict all future states of the system. However, we agree that such an account is not the only way to describe the system. We also agree that the simmball patterns are real patterns in the sense that they capture features of the system that are not captured by random noise.

  7. **What Does Not Follow**: The fact that every ball's motion is fixed by the laws does not imply that higher-level patterns are unreal, nor does it imply that they are epiphenomenal in every sense. It also does not imply that the system cannot exhibit emergent properties that are novel and irreducible in practice.

  8. **Difference-Makers**: We agree that a difference-maker is something such that, had it been different (holding other relevant factors fixed), the outcome would have been different. At the micro-level, the trajectory of any particular ball can be a difference-maker for subsequent ball trajectories. At the macro-level, the presence or absence of a simmball can be a difference-maker for subsequent macro patterns.

  9. **The Role of Environment**: The careenium is a closed system, but the simmballs can track environmental features because the initial conditions and the laws of motion are set in a way that the ball collisions are sensitive to inputs (e.g., via the box boundaries representing the environment). However, the environment is not an independent force; it is encoded in the initial conditions and boundary constraints.

  ### 2. Table of Remaining Disagreements

  | Issue | Pattern Causalist (PC) Position | Substrate Causalist (SC) Position |
  |-------|---------------------------------|----------------------------------|
  | **Causal Efficacy of Simmballs** | Simmballs are real causes: when a simmball tokens a symbol, that symbol (as a pattern) pushes the substrate around. A complete causal account that stops at the balls is incomplete because it misses the causal work done by the patterns themselves. | Only the balls push; simmballs are indispensable summaries and real patterns, but they do no causal work. Every effect is fixed by the exact path of the balls. Any causal account that includes simmballs is a useful shorthand but does not add any new causal power. |
  | **Level of Completeness** | A complete causal account must include the patterns because they are the level at which the system's intelligent behavior (if any) is organized. The micro-level account, while sufficient for prediction, is not complete for explaining the system's functional and informational properties. | The micro-level account is complete and sufficient for all causal explanations. The macro-level account is a convenient abstraction but does not provide additional causal information. |
  | **What it Means to "Push"** | To "push" means to be a difference-maker in a way that is robust and pattern-based. A simmball can push because it can be the locus of counterfactual dependence: if the simmball pattern had been different (even with the same micro-laws), the outcome would have been different. | To "push" means to exert a force or to be part of the chain of physical interactions. Only the balls have mass and velocity and thus can exert forces. Patterns do not exert forces; they are the result of forces. |

  ### 3. Cruxes and Experimental Cases

  We agree that the following concrete cases bear on our disagreement. We state the case, the crux it addresses, and our respective predictions.

  #### Case (a): Two careenia with different micro-realizations but the same simmball trajectory.
  - **Crux**: Does the sameness of the simmball trajectory imply that the simmball is the same cause, regardless of micro-differences?
  - **Intervention**: We set up two careenia, A and B, with different initial microstates (so the exact paths of balls are different) but which, by design, produce identical sequences of simmball patterns (same symbols, same timing, same interactions). We then subject both to the same environmental input (via boundary conditions) and observe the subsequent simmball trajectory.
  - **PC Prediction**: The subsequent simmball trajectory will be identical in both careenia because the causal history at the simmball level is identical. This shows that the simmball pattern is the relevant causal level for the outcome.
  - **SC Prediction**: The subsequent simmball trajectory may or may not be identical because it depends on the exact microstate. However, by construction, the systems are set to have the same simmball trajectory, so they will. But if we introduce a perturbation that affects one microstate but not the simmball pattern, then the outcome might differ. The key is that the microstate determines the outcome, not the pattern per se.

  #### Case (b): A careenium whose simmball is preserved while the exact paths of its balls are altered.
  - **Crux**: Can the simmball pattern be preserved even when the microstate is altered in a way that does not change the pattern, and does this preservation imply that the pattern is doing causal work?
  - **Intervention**: We design a careenium that maintains a specific simmball pattern (e.g., a symbol "X") while we actively alter the paths of individual balls without disturbing the pattern (e.g., by swapping balls in a way that the macro pattern remains). We then observe the subsequent behavior of the system.
  - **PC Prediction**: The subsequent behavior (at the simmball level) will be unchanged because the causal power lies in the pattern. The system will continue to function as if no alteration occurred at the micro-level, as long as the simmball pattern is preserved.
  - **SC Prediction**: The subsequent behavior may be altered if the micro-alterations have downstream effects that are not captured by the current simmball pattern. However, if the alteration is done without affecting the pattern and without introducing any micro-level differences that matter for the future, then the behavior may be the same. But in that case, it is the microstate that is doing the work, and the pattern is merely a description.

  #### Case (c): Interventions
  We break this into two subcases.

  **Subcase (c1): Intervention that changes a simmball without changing any individual ball's law.**
  - **Crux**: Can an intervention that changes a simmball pattern (without changing the laws of any ball) cause a change in the system's behavior, and does this show causal efficacy of the pattern?
  - **Intervention**: We design an intervention that directly alters a simmball pattern (e.g., by externally resetting the positions of a set of balls to a configuration that represents a different symbol) without changing the laws of motion of any ball. We then observe the subsequent system behavior at both the micro and macro levels.
  - **PC Prediction**: Changing the simmball pattern will lead to a different subsequent trajectory of simmballs, demonstrating that the pattern is a cause. The intervention shows that the pattern level can be a difference-maker.
  - **SC Prediction**: The subsequent behavior will change, but only because the microstate has been altered. The change is due to the new positions/velocities of the balls, not the pattern per se. The pattern change is just a description of the micro change.

  **Subcase (c2): Intervention on individual balls that leaves the simmball intact.**
  - **Crux**: If we alter the microstate without changing the simmball pattern, does the behavior change? If not, does this show that the simmball pattern is the cause?
  - **Intervention**: We alter the positions and/or velocities of a few balls in a way that does not change the current simmball pattern (e.g., swapping two balls that are symmetrically placed in the pattern). We then observe the subsequent behavior.
  - **PC Prediction**: If the alteration does not affect the simmball pattern, then the subsequent simmball trajectory should be unchanged because the causal power lies in the pattern. However, if the alteration introduces a micro-difference that eventually leads to a divergence, then that divergence would be due to the microstate. But if we can show that the pattern remains the same and the behavior remains the same despite micro-alterations, then it supports pattern causality.
  - **SC Prediction**: The subsequent behavior may or may not change, depending on whether the micro-alteration has downstream consequences. If it does, then the behavior changes due to the microstate. If it doesn't, then the behavior remains the same. The pattern is just a description and does not constrain the future; the microstate does.

  #### Case (d): A careenium in which a simmball is systematically correlated with an environmental feature but is causally idle at the level of the balls.
  - **Crux**: Can a simmball pattern be a mere correlate without being a cause, and does this imply that it is epiphenomenal?
  - **Intervention**: We design a careenium where a particular simmball pattern (say, "R") always appears when an environmental feature (e.g., a specific boundary condition) is present, but the pattern "R" does not play any role in the subsequent ball collisions (i.e., the balls that constitute "R" are isolated and do not collide with other balls that affect the future). We then observe what happens when the environment triggers "R".
  - **PC Prediction**: If "R" is causally idle, then the presence of "R" will not affect the future simmball trajectory. This would be a case of an epiphenomenal pattern. However, in a well-designed careenium that exhibits intelligent behavior, such patterns would be rare because patterns that are not causal would be selected against. But if found, it would show that not all patterns are causal.
  - **SC Prediction**: The pattern "R" is indeed epiphenomenal because it does not affect the ball collisions. This case shows that patterns can be real but without causal power. Only the balls that are part of the pattern, if they collide, can have effects. Here, they don't, so the pattern is causally inert.

  ### On Verbal Disagreement

  We agree that part of our dispute is verbal, specifically regarding the meaning of "cause" and "push". PC uses these terms in a way that includes higher-level patterns as difference-makers in counterfactual and explanatory contexts, while SC reserves these terms for the physical interactions at the micro-level. This leads to a substantive disagreement about what constitutes a complete causal account, but the verbal part can be clarified by specifying the level of description.

