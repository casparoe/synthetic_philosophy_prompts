prompt: |-
  I do stats and machine learning for a living — hypothesis classes, likelihoods, identifiability, regularisation, the whole lot — and I've been reading up on the underdetermination of theory by evidence, that Duhem–Quine style worry that the same observations can be accounted for by rival theories and no amount of data settles which one is right. Restate that debate as faithfuy as you can in the vocabulary I actually use: hypothesis spaces, likelihoods and priors, identifiability, observational equivalence, model misspecification, regularisation, the bias–variance trade-off, whatever maps onto what. Then give me the residue report. Which parts translate cleanly — is empirical equivalence basically just observational equivalence, i.e. non-identifiability? — which bits only survive as a distortion, and which have no counterpart at all in my vocabulary?

  I'm especially keen to know whether the holism (the idea that a theory is tested as a whole, together with its auxiliaries, so a failed prediction doesn't tell you which bit to blame) has anything genuinely to do with the fact that I have to fix a model class and a loss function before I can fit anything, or whether that's just a pun on the word model. And don't just do the translation — tell me whether the residue means the statistician's picture is missing something or the philosophers' worry was less substantive than it looks. I've a suspicion it's mostly the latter, so either confirm it or talk me out of it.
