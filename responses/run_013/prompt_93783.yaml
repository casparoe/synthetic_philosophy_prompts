  Formal constraints are crucial too. Non-question-begging procedures, convergence under iteration, and handling self-modification. The self-modification case is tricky—how does the theory define preferences when the agent would change the idealization process itself? 

  Now, the conflict report. The core tension is between recognizability and correction of adaptive preferences. If an agent strongly identifies with their adapted preferences (like the contented slave), correcting them might create an unrecognizable ideal self. Other conflicts might include stability vs. sensitivity to new info, or procedural neutrality vs. substantive outcomes. I need to explore these trade-offs, especially since the user sees this as the paper's most interesting result.

  Assessing which requirement most challenges existing theories. Full information accounts often fail on recognizability by creating an alien self. Coherent extrapolation might have convergence issues, and ideal advisors could smuggle in the theorist's values. But the recognizability requirement seems to undermine all, especially when combined with adaptive preference correction.

  I should ensure each point is grounded in philosophical literature. References to Elster for adaptive preferences, Railton's full information, Rawls for procedural neutrality. The user's deep understanding suggests they'll appreciate nuanced references without needing explanations.

  Finally, structure the response clearly: desiderata, distinctions, formal constraints, conflicts, assessment. Use their terminology—"adapted preferences," "self-modification." Highlight the unresolved tension between recognizability and correction as central, which aligns with their frustration in seminar discussions. This approach should provide the framework they need for their paper while opening avenues for their original analysis.
answer: |-
  Here’s a structured desiderata list for idealized-preference theories, grounded in philosophical puzzles and formal constraints, followed by key conflicts and a critical assessment. I’ve focused on requirements that expose fault lines in the literature.

  ---

  ### **I. Core Desiderata: Cases an Adequate Theory Must Handle**  
  1. **The Adaptive Preference Case**  
     - *Motivation*: Contented slaves, resigned workers, or "happy" addicts.  
     - *Requirement*: Idealization must override *adaptive preferences* (preferences shaped by unjust/constrained conditions).  
     - *Camp*: Universal commitment (e.g., Elster, Nussbaum).  

  2. **The Self-Undermining Idealization Case**  
     - *Motivation*: An idealized agent might prefer to retain some "flaws" (e.g., valuing love’s irrationality over cold rationality).  
     - *Requirement*: The theory must allow that idealization could reject its *own idealizing conditions* (e.g., "I’d rather not be fully informed").  
     - *Camp*: Neutral requirement (tests consistency).  

  3. **Divergent Procedures Case**  
     - *Motivation*: Different idealization methods (e.g., "full information" vs. "coherent extrapolation") yield conflicting verdicts for the same agent.  
     - *Requirement*: The theory must either resolve divergence or accept indeterminacy *without arbitrariness*.  
     - *Camp*: Critical for procedural accounts (e.g., Railton vs. Smith).  

  4. **Collective Idealization Case**  
     - *Motivation*: Group-extrapolated preferences (e.g., via Rawlsian deliberation) may not match *any* individual’s ideal preferences.  
     - *Requirement*: Collective accounts must explain normative force for individuals when their ideal selves *disagree* with the collective ideal.  
     - *Camp*: Social/political idealization (e.g., Habermas, Scanlon).  

  5. **Self-Modification Case**  
     - *Motivation*: An idealized agent might want to alter the *process* of idealization itself (e.g., "I’d prefer to use Method A, not Method B").  
     - *Requirement*: Idealization must be definable under *recursive evaluation* (i.e., when the output affects the input procedure).  
     - *Camp*: Formal constraint (avoids infinite regress).  

  ---

  ### **II. Essential Distinctions to Preserve**  
  1. **Ideal Preferences vs. Well-Being**  
     - *Risk*: Conflating "what I’d want if idealized" with "what is good for me" (e.g., an idealized ascetic might prefer self-harm).  
     - *Motivation*: Avoids smuggling objective goods into preference-satisfaction (Sobel’s objection to Railton).  

  2. **Refining vs. Replacing Preferences**  
     - *Risk*: "Idealization" that constructs a *new agent* (e.g., a perfectly rational being) loses the original agent’s identity.  
     - *Motivation*: Preserves the "agent-relativity" of reasons (Williams’ integrity objection).  

  3. **Indeterminacy vs. Epistemic Difficulty**  
     - *Risk*: Mistaking computational limitations (e.g., we can’t simulate full information) for *metaphysical* indeterminacy.  
     - *Motivation*: Affects whether idealization provides truth-conditions or mere heuristics (Gibbard’s challenge).  

  ---

  ### **III. Formal Constraints**  
  1. **Non-Question-Begging Procedure**  
     - *Requirement*: Idealization must not presuppose its *output* (e.g., defining "better information" as "information that leads to preferences P").  
     - *Motivation*: Circularity in defining idealization (e.g., early informed-desire accounts).  

  2. **Convergence Under Iteration**  
     - *Requirement*: Reapplying idealization (*I(I(P))* should stabilize at a fixed point, not drift infinitely.  
     - *Motivation*: Ensures stability of normative verdicts (e.g., coherent extrapolation models like Pettit’s).  

  3. **Self-Modification Compatibility**  
     - *Requirement*: The theory must output defined preferences even if the agent would change the idealization *parameters*.  
     - *Motivation*: Prevents paralysis in recursive cases (e.g., EDT vs. CDT in decision theory).  

  ---

  ### **IV. Key Conflict: Recognizability vs. Correction**  
  **The Dilemma**:  
  - **Recognizability Requirement**: The ideal self must be "continuous" with the agent’s identity (e.g., Williams’ "character").  
  - **Correction Requirement**: Idealization must fix *deeply entrenched* distortions (e.g., the slave who loves their chains).  

  **Why They Conflict**:  
  The preferences most needing correction (adaptive, brainwashed, or oppressed preferences) are often *constitutive* of the agent’s self-conception. If idealization overrides these, the ideal self becomes a "stranger" (e.g., the slave’s ideal self condemns slavery, but the actual slave feels alienated by this verdict). If it preserves them, it fails to correct.  

  **Tradeoff Shape**:  
  - Theories favoring **recognizability** (e.g., "coherent extrapolation" of actual desires) fail on adaptive cases.  
  - Theories favoring **correction** (e.g., "full information with moral constraints") produce alien ideals.  
  - *No existing account satisfies both*. Hybrid proposals (e.g., "procedural realism") either relapse to actualism or covertly impose substantive values.  

  **Other Conflicts**:  
  - **Neutrality vs. Outcome Constraints**: Procedural neutrality (no value-smuggling) risks endorsing repugnant ideals (e.g., an idealized bigot).  
  - **Stability vs. Sensitivity**: Converged ideals should be stable but responsive to new information (e.g., idealized preferences pre/post-trauma).  

  ---

  ### **V. Most Damaging Requirement for Existing Accounts**  
  **Recognizability** is the strongest defeater:  
  - **Full Information**: Renders the ideal self alien (e.g., knowing quantum physics doesn’t help decide whom to love).  
  - **Coherent Extrapolation**: Preserves identity but fails to correct *valued* pathologies (e.g., the "happy" addict’s coherent self-destruction).  
  - **Ideal Advisor**: Advisor’s values may diverge radically from the agent’s (e.g., Kantian advisor vs. Nietzschean agent).  

  **Result**: Accounts that correct adaptive preferences sacrifice recognizability; those preserving recognizability tolerate adaptive distortions. This tension is unresolved in the literature.  

  ---

  ### **Next Steps for Your Paper**  
  1. Map how each major theory (Railton, Smith, Lewis, etc.) scores on these desiderata.  
  2. Test if *any* account can navigate the recognizability-correction tradeoff without smuggling.  
  3. Explore whether *collective* idealization (e.g., Scanlon) avoids the dilemma by decoupling reasons from individual identity.  

  This framework forces theories to confront the paradox of self-revision: the preferences we need idealized reflection to correct are the ones we least want to give up.
