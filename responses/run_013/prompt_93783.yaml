  First, I need to identify the key desiderata for any idealized-preference theory. The user mentioned several cases: adapted preferences (like the contented slave), the idealized agent wanting to be less idealized, divergent procedures, collective extrapolation, and self-modification. I should expand on these and add others, like diachronic stability or partial idealization. Each requirement needs a motivating case to show why it's necessary.

