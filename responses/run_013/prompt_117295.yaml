prompt: |-
  I run a small macro research shop. Nine analysts publish probability estimates on discrete, resolvable questions — whether the central bank cuts at the next meeting, whether a merger clears, whether an incumbent holds a seat — and we size positions directly off those numbers. Every Thursday we hold a reconciliation meeting. Any question on which two analysts' numbers differ by more than ten points gets twenty minutes, and at the end of it I sign off on one house number.

  A junior analyst has been pushing a rule he can state in two sentences: if two of us disagree and each of us knows the other's number, then under a common prior at least one of us must be wrong, so the fix is always to pull the two numbers toward each other — in practice, average them and move on. He is right often enough to be dangerous, and those two sentences are doing work the underlying result does not license.

  Write me the procedure I should run in that meeting. I want it as a sequence of questions to ask about a given disagreement, in order, with a statement of what counts as a sufficient answer to each, a clear statement of where the sequence terminates in a single house number and how that number is computed, a clear statement of where it terminates without one, and a note on which steps are judgment calls that I should sign my name to rather than pretend are mechanical. I suspect the useful form of the thing is a diagnostic — a question whose answer tells me which precondition of the result has failed — rather than a pooling formula, but you should tell me whether that is the right shape. Whatever survives the simplification must preserve the distinctions the result actually needs: whether the two analysts are answering the same question over the same state space, whether each merely knows the other's number or the disagreement is common knowledge between them, whether their priors are common or merely similar, whether the stated number is the analyst's actual belief, and whether a persistent disagreement is evidence about the world or evidence about the analysts. Keep the meeting inside twenty minutes, and assume the analysts cannot show each other everything: some inputs are licensed and cannot be shared.

  Then run the procedure on three disagreements and say what it outputs in each. First, two analysts working from the same model with different licensed data, at 0.70 and 0.45 on a rate cut, both numbers now on the table. Second, two analysts whose difference survives every test you impose and traces to a prior about how fast a regime reverts — a difference that no data we can buy will settle. Third, one analyst who proposes to settle it with a bet at even odds; I want to know whether that is a clean way to extract the other's information or a trap. For the second and third cases I expect the honest answer to be one I do not like, and I would rather have it than a number.

  Finally, tell me what the procedure cannot do. In particular: can it protect me from the case where every analyst in the room shares the same wrong prior, and should agreement among my analysts ever be treated as evidence that we are right?
reasoning: |-
  We are given a scenario with two analysts A and B who have published probabilities p and q on the same event, and |p - q| > 0.10. The junior analyst suggests that if they know each other's numbers and there is a common prior, then at least one must be wrong and the fix is to average. However, the underlying result (Aumann's agreement theorem) has stronger preconditions.

  We design a procedure as a sequence of questions to diagnose the disagreement and decide on a house number or to terminate without one.

  **The Procedure:**

  1. **Question 1:** "Are you two answering the same question? Specifically, is the event you are assigning a probability to defined in exactly the same way, and are you conditioning on the same information about the resolution rules? Also, are your state spaces the same? For example, does the event 'rate cut' mean the same thing to both, and are you considering the same set of possible outcomes?"

     - **Sufficient answer:** They must agree on the exact definition of the event and the state space. If not, we stop and define the event unambiguously. If they agree, proceed.

     - *Note:* This step may require judgment if there is ambiguity. The moderator must sign off on the common definition.

  2. **Question 2:** "Do you know each other's current probability estimates? And is it common knowledge between you two that you both know each other's numbers? That is, do you each know that the other knows your number, and so on?"

     - **Sufficient answer:** They must both confirm that they are aware of each other's published numbers and that this awareness is mutual (common knowledge). If not, we stop and have them exchange numbers again and acknowledge. If they agree, proceed.

     - *Note:* This step is mechanical.

  3. **Question 3:** "Do you share a common prior? That is, before any private information, would you have assigned the same probability to this event? If not, can you describe your priors and why they differ?"

     - **Sufficient answer:** If they both claim a common prior, we proceed. If they do not, we ask for a brief explanation of the difference. The moderator must judge if the difference in priors is legitimate and cannot be resolved by data (e.g., a fundamental difference in worldview). 

     - *Note:* This step is a judgment call. The moderator must decide if the prior difference is non-negotiable (e.g., about a regime's reversion speed) or if it can be reconciled by considering the same data.

  4. **Question 4:** "Are you reporting your true beliefs? That is, is the number you published the actual probability you assign, conditional on all the information you have (including the other's number)?"

     - **Sufficient answer:** They must both affirm that their published number is their true current belief. If one says no, we stop and ask that analyst to recalculate and republish. If they both say yes, proceed.

     - *Note:* This step is mechanical.

  5. **Question 5:** "Given that you have common knowledge of each other's numbers and you both have the same prior, why haven't your beliefs converged? Please share any private information that can be shared without violating licensing."

     - **Sufficient answer:** They must share as much of their private information as possible (without breaking license restrictions). The goal is to see if the disagreement is due to asymmetric information that can be pooled.

     - *Note:* This step may require judgment on what can be shared.

  6. **Termination with a house number:** 
     - If after step 5 the analysts agree on a new number, we take that.
     - If they do not agree but the moderator determines that the only remaining difference is due to non-shareable data and the analysts have updated correctly, then we average the two numbers (as a practical compromise) and sign off on that average. 
     - However, if the moderator determines that the disagreement is due to a fundamental difference in prior (that was not resolved in step 3) or due to a difference in model that cannot be reconciled, then we terminate without a house number and maintain both numbers (with a note of the unresolved disagreement).

  7. **Termination without a house number:**
     - This happens if:
          a. The analysts are not answering the same question (step 1 fails and cannot be fixed).
          b. They do not have common knowledge of each other's numbers (step 2 fails and cannot be fixed by re-disclosure).
          c. They have different priors that the moderator judges as fundamental and irreconcilable (step 3 and step 5 don't resolve).
          d. One analyst is not reporting their true belief (step 4 fails and cannot be fixed by republishing).
          e. The private information cannot be shared and the disagreement persists without a clear resolution (step 5 fails to reconcile).

  **Why a diagnostic?** The procedure is diagnostic because it checks the preconditions for Aumann's theorem (common prior, common knowledge of posteriors, same state space). When these hold, the theorem says they must agree. If they don't agree, then one of the preconditions must fail. The steps are designed to uncover which one.

  **Running the procedure on the three cases:**

  **Case 1: Same model, different licensed data (0.70 and 0.45)**

  - Step 1: They are answering the same question (rate cut at next meeting). Yes.
  - Step 2: They know each other's numbers. Yes, and common knowledge. 
  - Step 3: They share a common prior? Since they have the same model, we assume yes (unless they say otherwise). 
  - Step 4: They are reporting true beliefs. Yes.
  - Step 5: They share what they can. Analyst A has licensed data X (e.g., inflation figures from source A) and analyst B has licensed data Y (e.g., employment figures from source B). They cannot share the raw data, but they can describe the nature and the effect. They update each other by saying, "My data suggests inflation is high, so I think no cut" and "My data suggests employment is falling, so I think cut". 

     - The moderator then asks: "Given the other's description, would you revise your estimate?" 

     - Suppose Analyst A revises to 0.60 and Analyst B revises to 0.55. Then we take the average (0.575) or if they agree on a number, that number.

     - If they do not revise enough to close the gap, then the moderator may average the two (if the data is non-shareable) and move on. 

     - Output: House number (either by agreement or by averaging) around 0.55-0.60.

  **Case 2: Difference in prior about regime reversion speed (persistent disagreement)**

  - Step 1: Same question. Yes.
  - Step 2: Common knowledge of numbers. Yes.
  - Step 3: Common prior? No. Analyst A believes the regime reverts quickly (so a shock is temporary) and Analyst B believes it reverts slowly. They have different priors. The moderator must judge if this is fundamental.

     - Judgment: The moderator determines that this difference in prior is deeply held and cannot be resolved by data we can buy (as stated). 

     - Then we terminate without a house number. 

     - Output: No house number. We note that the difference is due to a fundamental prior difference that we cannot resolve.

  **Case 3: One analyst proposes a bet at even odds**

  - We are considering whether this is a clean way to extract information or a trap.

     - The procedure:

        Step 1: Same question? Yes.

        Step 2: Common knowledge? Yes.

        Step 3: Common prior? We don't know yet.

        Step 4: True beliefs? We must verify.

        Step 5: The bet proposal: Analyst A (with probability p) proposes to bet at even odds (so if the event happens, Analyst B pays 1 unit to A, else A pays 1 unit to B). Analyst B must then state their probability.

        - The idea: If both are Bayesian and have a common prior, then betting can reveal true beliefs. However, there are pitfalls:

            a. Risk aversion: The analysts might not be risk neutral, so the bet does not directly reveal probability.
            b. The bet might be offered strategically (a trap): Analyst A might have superior information and be trying to exploit Analyst B.

        - How to test: Ask Analyst B: "Given the bet offer, what probability do you assign now? Also, are you willing to accept the bet? If not, why?"

        - If Analyst B is risk neutral and truthful, then they should accept the bet if they believe the probability is above 0.5 (if the bet is at even odds). But if they are risk averse, they might not.

        - If Analyst B revises their probability to avoid the bet, that might indicate they are not confident. But it's messy.

        - The moderator's judgment: 

            - If both analysts are known to be risk neutral and the bet is for a small amount (so that it's about beliefs and not money), then the bet might help. 

            - Otherwise, it's a trap because the proposer might be exploiting risk aversion or trying to force a revision without sharing information.

        - Recommendation: Avoid using bets in the meeting. Instead, focus on sharing information. 

        - Output: The bet proposal does not cleanly extract information. We return to step 5 and require information sharing. If that fails, we may terminate without a house number or average.

        - However, if the bet is accepted, then the two analysts have effectively pooled their beliefs by putting money at stake. The house number might then be taken as 0.5 (if they are betting at even odds) because they are equally confident? Not exactly: the bet at even odds does not imply they both think the probability is 0.5. It might be that one is more confident and the other is willing to take the other side. 

        - Alternatively, the fact that they are willing to bet might indicate they both stand by their numbers. Then we are back to the same disagreement.

        - Conclusion: The bet proposal does not resolve the disagreement. We must rely on the standard procedure.

  **What the procedure cannot do:**

  1. **Protection from shared wrong prior:** The procedure cannot protect if every analyst shares the same wrong prior. If the entire group has a prior that is incorrect, then even after pooling information, the house number will be wrong. 

     - The procedure relies on the common prior being correct. But if the prior is wrong, then the group will be systematically biased.

     - Therefore, agreement among analysts should not be treated as evidence that we are right. It only means that within the model and information set, they have converged.

     - To mitigate: The moderator should encourage diversity of priors and challenge the group's assumptions.

  2. **The procedure cannot force sharing of licensed data:** If the data is proprietary and cannot be shared, then the analysts must rely on describing the data. This might not be sufficient.

  3. **The procedure cannot resolve fundamental prior differences:** In case 2, we terminate without a number.

  4. **The procedure assumes honesty:** If an analyst is not truthful, the procedure might fail.

  In summary, the procedure is a diagnostic to uncover the cause of disagreement. It leads to a house number only if the disagreement can be resolved by information sharing or if we must average due to non-shareable data. It terminates without a number for fundamental prior differences or unresolved ambiguities. The steps involving judgment (steps 1, 3, and 5) require the moderator's signature.
answer: |-
  Below is a structured procedure for your reconciliation meetings, designed as a diagnostic sequence to identify why a disagreement persists and determine whether a house number can be justified. The procedure prioritizes uncovering which precondition of rational consensus (e.g., Aumann’s agreement theorem) has failed, rather than mechanically pooling estimates. It terminates in either a house number or a decision to maintain separate estimates, with clear off-ramps for irreconcilable differences. Steps requiring your judgment are explicitly noted. The entire process is built for efficiency and fits within 20 minutes.

  ---

  ### **Reconciliation Procedure: Sequence of Questions**
  **Objective:** Diagnose why two analysts' probability estimates differ by >10 points and determine if a house number can be justified.  
  **Inputs:** Analysts A and B; their published probabilities \(p_A\) and \(p_B\); event \(E\).  
  **Output:** A single house number **OR** a decision to retain both estimates with a reason for disagreement.

  #### **Step 1: Verify Identical Questions and State Spaces**  
  **Question:** "Is \(E\) identically defined for both of you? Are you conditioning on the same resolution rules, time horizon, and state space (e.g., possible outcomes)?"  
  **Sufficient answer:**  
  - **Yes:** Explicit confirmation that \(E\) is the same event (e.g., "Fed cuts rates at the May meeting"). Proceed to Step 2.  
  - **No:** Inconsistent definitions (e.g., A defines "cut" as ≥25bps, B as any reduction). **Terminate without house number**; resolve ambiguity in a follow-up.  
  **Judgment call?** Yes. You must rule on whether definitions are materially identical.  
  *Rationale:* Ensures analysts are answering the same question. Disagreement here voids pooling.

  #### **Step 2: Confirm Common Knowledge of Estimates**  
  **Question:** "Do you both know each other’s published estimates, and is this knowledge mutual? Could your disagreement persist even after seeing each other’s numbers?"  
  **Sufficient answer:**  
  - **Common knowledge:** Both affirm they know \(p_A\) and \(p_B\), understand the other knows, and still disagree. Proceed to Step 3.  
  - **Not common knowledge:** One analyst hasn’t internalized the other’s estimate (e.g., B hasn’t updated after seeing \(p_A\)). **Pause:** Have them restate each other’s numbers and recompute beliefs. If disagreement persists, proceed to Step 3.  
  **Judgment call?** No. Mechanical (update and verify).  
  *Rationale:* Rules out trivially resolvable differences. Aumann’s theorem requires common knowledge of posteriors.

  #### **Step 3: Test for Common Priors**  
  **Question:** "Before any private data, would you have agreed on a prior for \(E\)? If not, briefly describe why your priors differ."  
  **Sufficient answer:**  
  - **Common prior:** Both affirm shared prior (e.g., "We both started at 0.50"). Proceed to Step 4.  
  - **Divergent priors:** Clear, concise reason for difference (e.g., "I assume regimes revert faster than they do," or "My model weights central bank credibility higher"). Record the reason. Proceed to Step 4.  
  **Judgment call?** Yes. You assess if the prior difference is **legitimate** (grounded in expertise) or **arbitrary** (unfounded assumption).  
  *Rationale:* Common priors are essential for consensus. If priors diverge, pooling may be invalid.

  #### **Step 4: Verify Truthful Reporting**  
  **Question:** "Is your published number your true belief, conditional on all information (including the other’s estimate)?"  
  **Sufficient answer:**  
  - **Yes:** Both affirm. Proceed to Step 5.  
  - **No:** One admits misreporting (e.g., "I rounded aggressively"). **Terminate without house number**; flag for review.  
  **Judgment call?** No. Mechanical (truthfulness is table stakes).  
  *Rationale:* Rules out incentives or errors distorting stated beliefs.

  #### **Step 5: Share Non-Licensed Justifications**  
  **Question:** "Share your key reasoning without revealing licensed data. Focus on: (a) model structure, (b) public data, (c) why the other’s estimate hasn’t swayed you."  
  **Sufficient answer:**  
  - **Convergence:** Analysts move toward agreement (e.g., A revises to 0.60, B to 0.50). **Set house number** as average of revised estimates.  
  - **Persistent disagreement:** Beliefs remain >10 points apart. Proceed to Step 6.  
  **Judgment call?** Partial. You facilitate sharing but don’t arbitrate reasoning.  
  *Rationale:* Allows non-licensed information to surface. Convergence here indicates resolvable informational asymmetry.

  #### **Step 6: Diagnose Irreconcilability**  
  **Question:** "Is the residual disagreement due to (a) conflicting licensed data, (b) divergent priors from Step 3, or (c) non-overlapping models?"  
  **Sufficient answer:**  
  - **Conflicting licensed data:** Disagreement stems from exclusive inputs (e.g., A has proprietary inflation data, B has employment data). **Set house number** as weighted average (weights based on track record/data quality).  
  - **Divergent priors/model:** Disagreement is foundational (e.g., "We disagree on mean-reversion speed"). **Terminate without house number**; retain both estimates.  
  - **Uncertain cause:** Ambiguous origin. **Terminate without house number**; escalate for external review.  
  **Judgment call?** Yes. You weigh whether disagreement is informational (poolable) or fundamental (not poolable).  
  *Rationale:* Isolates whether differences are about the **world** (data) or the **analysts** (priors/models). Fundamental differences void pooling.

  ---

  ### **Where the Procedure Terminates**  
  - **House number:** Computed only at Step 5 (convergence) or Step 6 (conflicting licensed data). In Step 6, use a **weighted average** (e.g., if A has better track record, weight \(p_A\) higher).  
  - **No house number:** Termination at Step 1 (different questions), Step 4 (non-truthful reporting), or Step 6 (divergent priors/models).  
  - **Time limit:** If unresolved at 20 minutes, default to Step 6 diagnosis.

  ---

  ### **Application to Three Disagreements**  
  #### **Case 1: Same Model, Different Licensed Data (0.70 vs. 0.45)**  
  - **Step 1:** Same question (rate cut). ✅ Proceed.  
  - **Step 2:** Common knowledge of estimates. ✅ Proceed.  
  - **Step 3:** Common prior (same model). ✅ Proceed.  
  - **Step 4:** Truthful reporting. ✅ Proceed.  
  - **Step 5:** A cites proprietary inflation data; B cites confidential employment data. Estimates revise to 0.65 and 0.50. ❌ No convergence.  
  - **Step 6:** Disagreement due to conflicting licensed data. **Output:** House number = **0.575** (unweighted average).  
  *Why?* Differences are informational, not fundamental. Pooling is acceptable.

  #### **Case 2: Divergent Priors on Regime Reversion (Persistent Disagreement)**  
  - **Step 1:** Same question. ✅ Proceed.  
  - **Step 2:** Common knowledge. ✅ Proceed.  
  - **Step 3:** Divergent priors (A: fast mean-reversion; B: slow). ✅ Proceed (judgment: legitimate).  
  - **Step 4:** Truthful. ✅ Proceed.  
  - **Step 5:** Sharing reveals no new data; beliefs unchanged. ❌ No convergence.  
  - **Step 6:** Disagreement due to divergent priors. **Output:** **No house number**. Retain both estimates.  
  *Why?* Priors are foundational. Averaging would hide legitimate uncertainty.

  #### **Case 3: Analyst Proposes a Bet at Even Odds**  
  - *Before procedure:* Analyst A (say, \(p_A = 0.75\)) offers to bet at even odds against Analyst B (\(p_B = 0.25\)).  
  - **Diagnosis:**  
    - A bet at even odds implies A believes \(P(E) > 0.5\) and can profit if B accepts.  
    - **If B accepts:** Signals B’s true belief is \(P(E) < 0.5\) (or that B is risk-seeking). This **extracts information** (B’s confidence is genuine).  
    - **If B rejects:** Suggests \(p_B\) is inflated (not true belief), violating Step 4.  
  - **Integration into procedure:**  
    - Use the bet to test **truthfulness (Step 4)**. If B refuses, terminate with no house number.  
    - If B accepts, proceed to Step 5 with \(p_B\) treated as credible.  
  - **Verdict:** **Not a trap** if analysts are risk-neutral and honest. It’s a clean information-extraction tool. But in practice, risk aversion or pride may distort. Use cautiously.  
  *Output for this case:* If B accepts bet, proceed with revised credibility. Else, terminate at Step 4.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Shield against shared erroneous priors:**  
     - If all analysts share the same wrong prior (e.g., "Inflation is always transitory"), the procedure **cannot detect this**. Agreement in Step 5 or pooling in Step 6 would produce a confidently wrong house number.  
     - **Implication:** Agreement among analysts is **not evidence of correctness**. It only signals internal consistency. Treat consensus as a reason to scrutinize priors, not celebrate.

  2. **Resolve non-common-knowledge disagreements:**  
     - The procedure assumes analysts internalize each other’s estimates (Step 2). If they don’t (e.g., due to cognitive bias), it may force convergence prematurely.

  3. **Override licensing constraints:**  
     - When licensed data causes disagreement (Step 6), pooling is a best-effort compromise. It cannot access the "ground truth" hidden in proprietary data.

  4. **Handle strategic misreporting:**  
     - If analysts lie in Step 4 (e.g., to avoid embarrassment), the procedure fails. Track records and incentives must be managed externally.

  5. **Settle moral or political disagreements:**  
     - For value-laden priors (e.g., "Democrats always favor easy money"), the procedure terminates without a number (Step 6). Politics isn’t quantifiable.

  ---

  ### **Final Notes**  
  - **Shape:** The diagnostic form (not a pooling formula) is correct. It exposes *why* pooling fails, preserving key distinctions: identical questions, common knowledge, common priors, truthful beliefs, and data-vs-analyst disagreements.  
  - **Judgment calls:** Your expertise is critical in Steps 1 (defining \(E\)), 3 (assessing priors), and 6 (classifying disagreement). Sign your name to these—they’re not mechanical.  
  - **Efficiency:** Sticking to this sequence ensures 20-minute meetings. Steps 1–4 take <5 minutes; Step 5–6 consume the remainder.  
  - **When to average:** Only in Step 6 for conflicting licensed data. Never average for fundamental disagreements (e.g., priors)—it papers over uncertainty.  

  This procedure protects your shop from the junior analyst’s oversimplification while delivering auditable, defensible resolutions.
