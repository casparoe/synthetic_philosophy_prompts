  Alternatively, we can think that the collection has a fixed number of non-black objects, and the ravens are a subset of the objects. If a raven is non-black, then it is one of the non-black objects. Therefore, the non-black non-ravens are the non-black objects that are not ravens. 

  So if we have D non-black objects, then:
    non-black non-ravens = D - (number of non-black ravens)

  Under H: non-black ravens = 0, so non-black non-ravens = D.
  Under ~H: non-black ravens >=1, so non-black non-ravens <= D-1.

  Therefore, if we assume under ~H that there is exactly one non-black raven, then non-black non-ravens = D-1.

  This is the model we used initially, and it works. 

  So in the museum storage room:

    Total objects: N = 1010
    Total non-black objects: D = 10. 
    Total ravens: R = 1000.

  The non-black objects are 10. What are they? They could be anything non-black: white sneakers, green apples, etc. 

  The ravens: 1000. If H is true, they are all black. If H is false, then at least one is non-black. We assume in ~H exactly one is non-black.

  Then:

    Under H: 
        black ravens: 1000
        non-black non-ravens: 10
    Under ~H:
        black ravens: 999
        non-black ravens: 1
        non-black non-ravens: 9   (because total non-black objects=10, and one is a non-black raven)

  Now, sampling rule: we draw one object uniformly at random from the 1010.

  Evidence E1: black raven -> likelihood ratio = (1000/1010) / (999/1010) = 1000/999 ≈ 1.001
  Evidence E2: non-black non-raven -> likelihood ratio = (10/1010) / (9/1010) = 10/9 ≈ 1.111

  So E2 gives a bigger boost.

  Which feature is doing the work? The fact that non-black objects are very rare relative to ravens. Specifically, D < R.

  If we flip it: make non-black objects common and ravens rare.

  Example: 
    N = 1010
    R = 10 (ravens)
    D = 1000 (non-black objects)

  Then:
    Under H: 
        black ravens: 10
        non-black non-ravens: 1000
    Under ~H (one non-black raven):
        black ravens: 9
        non-black non-ravens: 1000 - 1 = 999   [because total non-black objects=1000, and one non-black raven, so non-black non-ravens=999]

    BF1 = (10/1010) / (9/1010) = 10/9 ≈ 1.111
    BF2 = (1000/1010) / (999/1010) = 1000/999 ≈ 1.001

  So now the black raven provides a bigger boost (1.111) than the non-black non-raven (1.001).

  What sampling rule makes the sneaker confirm nothing at all? 

  If we sample in a way that depends on the color. For example, if we sample only ravens, then a non-black non-raven would never be observed. But that's trivial.

  Another rule: if we sample non-black objects. Then we are only looking at non-black objects. Then observing a non-black non-raven (which is the only kind you can see in this sampling) doesn't tell us about the ravens? 

  Specifically, suppose we sample uniformly from the non-black objects. Then the evidence is: we draw a non-black object and observe that it is not a raven.

  Under H: 
    All non-black objects are non-ravens. So if we draw a non-black object, it is always a non-raven -> P(evidence | H) = 1.
  Under ~H: 
    There is at least one non-black raven. So if we draw a non-black object, it might be a raven or not. But we observed that it is not a raven. 
    Let k be the number of non-black ravens. Then total non-black objects = D (fixed). Then the probability that a randomly selected non-black object is a non-raven = (D - k) / D.
    So P(evidence | ~H) = (D - k) / D.

  Then the Bayes factor = 1 / [(D-k)/D] = D/(D-k) >= D/(D-1) [if k>=1] which is greater than 1. So it does confirm H.

  But we want it to confirm nothing at all, i.e., Bayes factor=1.

  That happens only if P(evidence | H) = P(evidence | ~H). But under H, it's 1. Under ~H, it's (D-k)/D, which is less than 1. So unless k=0, it's not 1. But under ~H, k>=1.

  Alternatively, if we sample in a way that the evidence is independent of H. 

  Another idea: if we sample uniformly from the entire collection, but then the evidence is just the object itself and we condition on its color. But that's not what we are doing.

  But in our original, it always confirms. 

  To get no confirmation, consider a sampling rule where we decide to sample an object and report whether it is a counterexample to H. A counterexample would be a non-black raven. If we find one, we report that. If not, we report that we didn't find one. But then if we report "no counterexample", then that could be because there isn't one or because we missed it. 

  But that's a different setup.

  For the non-black non-raven to confirm nothing, we need that P(E2 | H) = P(E2 | ~H). 

  In the uniform sampling from the whole collection, that happens only if the count of non-black non-ravens is the same under H and ~H. That requires that under ~H, the number of non-black non-ravens is the same as under H. But under H, it's D (the total non-black objects). Under ~H, it's D - k. So if k is zero (which is H) or if we are in a world where k=0 even under ~H? But that doesn't make sense.

  So it's hard. 

  Alternatively, if we fix the sampling to only non-ravens. Then we are sampling from non-ravens. We observe a non-black non-raven. Then:

  Under H: 
    The non-ravens are a mix of black and non-black? But we don't care. The probability of observing a non-black non-raven given that we are sampling from non-ravens is the proportion of non-ravens that are non-black. This proportion doesn't depend on the ravens. 

  Under ~H: same proportion.

  So let:
    Total non-ravens: M
    Non-black non-ravens: D_nr

  Then P(observe a non-black non-raven | we sample from non-ravens) = D_nr / M, which is the same under H and ~H, because the non-ravens are unaffected by H.

  Therefore, the Bayes factor would be 1: no confirmation.

  Sampling rule: We sample uniformly from the non-ravens in the collection. Then we observe the color. If we observe a non-black non-raven, that is E2. But note: we are conditioning on sampling from non-ravens. Then the evidence E2 doesn't tell us anything about the ravens.

  Finally, the objection about pre-counted objects and re-individuation.

  The case we built relies on the counts of objects. But what is an object? If we re-individuate (for example, by considering parts of objects or collections of objects), then the counts change. 

  For instance, if we break each non-black object into many small pieces, then the number of non-black objects becomes very large. Then D might become larger than R, and the effect flips.

  But in our scenario, we are counting whole objects. The case is fragile in the sense that it depends on the granularity of individuation. However, in the context of the example (a museum storage room), it is natural to count whole specimens and whole objects. 

  The honest reply: The boost provided by evidence depends on the sampling frame and the individuation criteria. In a natural setting with a clear individuation (like whole birds and whole shoes), the scenario can be set up as described. The effect is real under that individuation. If we change the individuation, the boost might change. But the point is that the classic intuition (that a white sneaker should not provide any meaningful confirmation) is not universally true; it depends on the base rates and the sampling. 

  In particular, the key feature is the relative rarity of non-black objects compared to ravens. That rarity is defined within the collection. If we re-individuate, we change the collection. So the case survives as long as the individuation is fixed and agreed upon.

  Summary:

  - Scenario: A museum storage room with 1010 objects: 1000 raven specimens and 10 non-raven objects that are non-black (like white sneakers, green apples, etc.). 
  - Sampling rule: One object is drawn uniformly at random from the entire collection of 1010 objects.
  - Evidence E1 (black raven) gives a Bayes factor of 1000/999 ≈ 1.001.
  - Evidence E2 (non-black non-raven) gives a Bayes factor of 10/9 ≈ 1.111, which is larger.

  The feature doing the work: non-black objects being rarer than ravens.

  Answer: non-black objects rarer than ravens.
