prompt: |-
  I am a philosopher whose work sits at the intersection of ethics and formal methods, and for the last several years I have been preoccupied with the inefficacy objection — the claim that because a single individual's contribution to a large-scale collective harm (a marginal vote, one serving of meat, a few tonnes of carbon) makes no detectable difference to the outcome, that individual has no reason, or at least no duty, to refrain. I have grown impatient with how the debate is conducted in my own field, where the decisive moves are made by appealing to intuitions about thresholds, expected value, complicity, and the distinction between doing and allowing, and I want to see the whole thing rebuilt in the vocabulary I actually trust when I am doing formal work: causal attribution. Concretely, I want you to take the inefficacy objection and its principal replies and restate them in the machinery of causal inference and cooperative game theory — interventions and the do-operator, marginal versus average causal contributions, counterfactuals evaluated with different things held fixed, Shapley values, and variance- or risk-based decompositions of a collective outcome — treating the total harm as a payoff function over the vector of individual actions.

  I am reasonably fluent in this vocabulary; I have used do-calculus and Shapley values in my own modelling and can follow a derivation, though I am not a specialist, so please err on the side of spelling out the formal moves rather than gesturing at them. One of my doctoral students recently proposed that we simply define each person's contribution as their Shapley value in the game whose payoff is the harm, and I want to know what that buys us and what it quietly assumes. As you translate, keep the translation honest: do not help yourself to the formal framework's own normative assumptions — that the relevant unit of assessment is the individual, that effects are the currency of moral importance, that a zero marginal effect is a zero — and then present the result as though it were a faithful rendering of what the ethicists meant. Then give me the residue report, which is really the point of the exercise: which claims in the debate survive translation cleanly, which survive only in a distorted form, and which have no counterpart at all in the formal vocabulary — and, for that last category, tell me whether the gap reflects a genuine limitation of causal-attribution talk or whether it is evidence that the original claim was doing less work than it appeared to.

  Run the translation at least twice, on two structurally different cases: a threshold case, such as a vote in an election decided by a single ballot, and a roughly linear case, such as the demand that an individual stop eating meat. I want to know whether the two end up looking like the same problem in the formal vocabulary or like two different problems that the informal debate has blurred together. Please write this as continuous prose — no headings, no numbered or bulleted lists, no bold or italic for emphasis, no tables; the way one would write a long letter to a colleague.
reasoning: |-
  We are going to analyze the inefficacy objection and its replies using tools from causal inference and cooperative game theory. The two cases: a threshold case (election decided by one vote) and a linear case (eating meat contributing to animal suffering or climate change). We will restate the arguments using interventions, counterfactuals, Shapley values, and other formal concepts. Then we will examine what survives the translation and what does not.

  ### Preliminaries
  Let the collective outcome (total harm) be a function H of the vector of actions of n individuals: H(a_1, a_2, ..., a_n). Each individual i chooses an action a_i from a set of possibilities (e.g., vote or not, eat meat or not). We are interested in the causal contribution of individual i to H.

  ### The Inefficacy Objection in Formal Terms
  The inefficacy objection claims that for a particular individual i, the marginal effect of changing a_i (while holding others fixed) is zero or undetectable. Formally, the objection is that for most i, H(a_i=1, a_{-i}) - H(a_i=0, a_{-i}) = 0, because the outcome does not change when only i's action changes. Therefore, the individual has no reason to change.

  ### Principal Replies in Formal Vocabulary

  1. **Expected Value Approach**: The objection ignores uncertainty. We model the actions of others as random. Then the expected marginal effect is not zero. We can write the expected harm when i chooses a_i=1 versus a_i=0, and the difference is the expected marginal effect.

  2. **Thresholds and Criticality**: In a threshold case, the marginal effect is zero except when the collective is at a critical point. But if we assign a probability to being at that critical point, then the expected marginal effect is positive.

  3. **Complicity and Collective Responsibility**: This might be translated into the idea that even if the marginal effect is zero, the individual is part of a group that together causes harm. We might use Shapley values to assign a share of the total harm to each individual.

  4. **Distinction between Doing and Allowing**: This is more difficult to capture. It might be modeled by considering the counterfactual in which the individual does not act (abstains) and comparing to the actual world.

  ### Translation for Threshold Case: Election

  In an election with a threshold T (say, majority), the harm might be the election of a bad candidate. Let H(a) = 1 if the candidate wins (i.e., if the sum of votes for the candidate >= T), and 0 otherwise.

  **Inefficacy Objection**: For a given voter i, if the candidate wins by more than one vote or loses by more than one vote, then changing i's vote does nothing. Only if the vote is exactly tied (or the candidate wins by exactly one vote) does i's vote matter. So the marginal effect is 0 in most cases.

  **Expected Value Reply**: Suppose we model the votes of others as random. Then the probability that the vote is exactly tied (so that i is pivotal) might be positive. The expected marginal effect is the probability that i is pivotal multiplied by the harm difference (which is 1 if the candidate wins when i votes for them and loses otherwise, or vice versa). So expected marginal effect is positive.

  **Shapley Value Approach**: The Shapley value for a voter i is the average of the marginal contributions over all possible coalitions (subsets of voters). Specifically, for each possible coalition S that does not include i, we compute the marginal contribution: H(S union {i}) - H(S). Then average over all S. In the threshold case, the marginal contribution is 1 if S has exactly T-1 votes for the candidate (so that adding i pushes it to T) or if S has T votes but then without i it would be T-1 (if we are considering the harm of electing the candidate). Actually, we have to consider the entire permutation. The Shapley value for i would be the probability (over the random ordering) that i is pivotal. This turns out to be the same as the expected marginal effect when we assume that every other voter votes randomly with equal probability? Not exactly, but in the symmetric case, the Shapley value gives each voter the same share of the total harm. In a symmetric election, each voter's Shapley value would be H_total / n. But note: H_total is either 0 or 1. So the Shapley value for each voter is 1/n if the candidate wins, and 0 otherwise. This is because the Shapley value is a way to distribute the total harm (if the candidate wins, the total harm is 1) equally among all voters. 

  But note: this is independent of the actual vote count. Even if the candidate wins by a landslide, every voter who voted for the candidate is assigned 1/n of the harm. This is a very different notion from marginal contribution.

  In the threshold case, the Shapley value does not depend on the actual vote margin. It only depends on the total harm and the symmetry. This is because the Shapley value satisfies symmetry and efficiency (the sum of Shapley values equals H_total). So if the candidate wins, every voter who voted for the candidate (or even all voters?) is assigned a share? Actually, we have to define the game. Typically, we define the characteristic function for a coalition S as the outcome if only the voters in S vote and others abstain? But that is not how elections work. Alternatively, we can define the characteristic function for a coalition S as H when the voters in S vote for the candidate and the others vote against. Then H(S) = 1 if |S|>=T, else 0.

  Then the Shapley value for a voter i is the average over all permutations of the marginal contribution. The marginal contribution of i to a coalition S (which is the set of players before i in the permutation) is 1 if |S| = T-1, and 0 otherwise. The number of coalitions S of size T-1 that do not include i is C(n-1, T-1). The total number of coalitions (subsets) is 2^(n-1). But the Shapley value averages over orderings. The probability that i is pivotal in a random ordering is the number of orderings where i comes at position T and the first T-1 are exactly the other T-1 voters in the coalition. The number of such orderings is: choose the T-1 members for the first T-1 positions (excluding i) in C(n-1, T-1) ways, arrange them (T-1)! ways, then i at position T, then the rest (n-T)! ways. Total orderings: n!. So the probability is [C(n-1, T-1) * (T-1)! * (n-T)! ] / n! = 1/n. 

  Wait, that simplifies to 1/n? Actually, let's compute:

  C(n-1, T-1) = (n-1)! / [(T-1)! (n-T)!]

  Then the number of orderings: [ (n-1)! / ((T-1)! (n-T)! ) ] * (T-1)! * (n-T)! * 1 * ... = (n-1)! 

  Then divided by n! => (n-1)! / n! = 1/n.

  So the Shapley value for each voter is 1/n * (H when the candidate wins) but note: the marginal contribution is 1 when the coalition S has exactly T-1 votes and the candidate wins when i is added. But if the candidate wins regardless of i? In the definition above, we are computing the marginal contribution in the context of the entire game? Actually, the Shapley value for a simple majority game is indeed 1/n for every player? But that seems odd because if the candidate wins by a landslide, then the voters are not actually pivotal. However, the Shapley value does not condition on the actual votes of others. It averages over all possible coalitions (orderings). So it is an ex ante allocation? 

  But in our case, we have the actual votes. We want to assign responsibility for the actual outcome. This is where the conditional Shapley value might come in? Or we might use a different characteristic function that conditions on the actual votes of others? That is, we fix the actions of others and only consider the marginal contribution. But then we are back to the marginal effect.

  Alternatively, we can define the game with the actual votes. But note: the Shapley value is defined for a characteristic function that assigns a value to every coalition. We must define H(S) for every S. How? One way: let the action of a voter in S be "vote for the candidate" and out of S be "vote against". Then the outcome H(S) is determined by the votes in S and the complement. But that does not condition on the actual votes of others? It ignores the actual votes of the others. So it is not a conditional measure.

  To condition on the actual votes of others, we need to fix the actions of the other players. Then the Shapley value for player i would be computed in a game where the other players are fixed? But then the characteristic function for a coalition S that includes i would be H(a_S, a_{-S}) but we have fixed a_{-S}? That seems odd because the other players are fixed? Actually, we can define a game with only one player? Then the Shapley value would be the marginal effect. 

  Alternatively, we can use the Shapley value in the context of the actual vote vector. But then we are not averaging over the actions of others, but over the order of joining the coalition? And we fix the actions? Then the marginal contribution of i to a coalition S would be H(S union {i}) - H(S), but now H(S) is defined as the outcome if the voters in S vote for the candidate and the others vote against. But that is not the actual outcome because in the actual world, the other voters might have voted for the candidate. 

  This is confusing. We must be clear: we are trying to assign responsibility for the actual harm that occurred. The actual harm is H(a_1, ..., a_n). We want to decompose this total harm into individual contributions.

  One method is to use the marginal effect with the actual others: 
    ME_i = H(a_i=1, a_{-i}) - H(a_i=0, a_{-i})
  But in the threshold case, this is 0 unless the vote is exactly at the threshold.

  Another is to use the Shapley value unconditionally (averaging over all possible vote patterns) but that assigns 1/n to every voter regardless of how they voted? That doesn't seem right.

  We can define the characteristic function conditionally on the actual votes? That is, we consider the game where the actions of the other players are fixed, and we only vary the actions of the coalition we are considering? Then the game has a characteristic function for subsets of players that include i? But then the Shapley value for i would be the same as the marginal effect because the coalition S is only {i} and the rest are fixed. So we get ME_i.

  Alternatively, we can define a conditional game: for each player, we condition on the actual actions of the others. Then the Shapley value for a player i in this conditional game would be the marginal effect (because the other players are fixed and not in the game). So we are back to ME_i.

  Therefore, the Shapley value in the unconditional game (where we average over all possible actions of others) gives a fixed 1/n for each voter when the candidate wins, regardless of the actual vote. But the inefficacy objection is about the actual world, not the ex ante expectation.

  So the Shapley value in the unconditional game does not address the inefficacy objection because the objection is about the actual situation. The conditional game (with others fixed) reduces to the marginal effect. Therefore, the Shapley value approach in the unconditional form does not directly rebut the inefficacy objection in the actual world. It gives an ex ante expected responsibility, which is 1/n, and that is positive. But the inefficacy objection is about the actual effect.

  ### Translation for Linear Case: Eating Meat

  Now consider a linear harm: total harm is the sum of individual contributions. For example, each serving of meat causes a fixed harm h (say, to animals or the environment). Then H(a) = sum_{i} a_i * h, where a_i=1 if i eats meat, 0 otherwise.

  **Inefficacy Objection**: The harm caused by one serving is h. But if h is very small (and perhaps undetectable), does the individual have a duty to refrain? The objection might be that h is negligible.

  **Expected Value Reply**: In a linear case, the marginal effect is exactly h, which is positive. So there is no inefficacy: the individual does cause harm h.

  **Shapley Value**: In the linear game, H(S) = h * |S| (if we define S as the set of meat-eaters). The marginal contribution of i to any coalition S is h. Therefore, the Shapley value for each meat-eater is h. So it coincides with the marginal effect.

  But note: in the linear case, the harm is additive. There is no interaction. The Shapley value is the marginal effect in every coalition, so it is h.

  ### Comparison of the Two Cases

  In the linear case, the marginal effect is always h (positive). The Shapley value also gives h. So the inefficacy objection is not about the marginal effect being zero, but about the absolute size of h being too small to matter. That is a different objection (about the significance of small harms).

  In the threshold case, the marginal effect in the actual world is usually zero. The Shapley value (unconditionally) gives 1/n, which is positive but ex ante. The conditional Shapley value (with others fixed) gives the marginal effect, which is zero in most cases.

  So in the threshold case, the inefficacy objection (about the actual effect) remains: the marginal effect is zero. The replies that rely on expected value or ex ante Shapley value change the subject to ex ante responsibility. The complicity reply, when translated to Shapley value (unconditional), assigns 1/n, but this is not based on the actual effect. 

  ### Residue Report

  Which claims survive translation?

  - **Expected Value Reply**: This translates cleanly. Even in the threshold case, the expected marginal effect (with respect to a probability distribution over others' actions) is positive. It survives as a valid argument that the individual has an ex ante reason to refrain.

  - **Threshold Criticality**: In the threshold case, the expected marginal effect is the probability of being pivotal. This is the same as the expected value reply. It survives.

  - **Complicity/Collective Responsibility via Unconditional Shapley Value**: This translates, but it changes the subject. It assigns a share of the total harm (1/n) to each individual, but this is an ex ante allocation and does not reflect the actual marginal effect. It is a form of responsibility allocation, but it does not directly rebut the inefficacy objection (which is about the actual effect). Moreover, the unconditional Shapley value assumes symmetry and averages over all possible worlds, which might not be justified if the actual votes are known. However, it does give a positive share to each individual.

  - **Distinction between Doing and Allowing**: This does not have a clear counterpart. In causal inference, we have interventions (do-operator) which sets the variable to a value. But the distinction between doing and allowing is often about the default action. In the voting case, if we take not voting as the default, then voting is doing. But in the formal model, we have two actions: vote for the candidate or not (which might be voting against or abstaining). The counterfactual we consider is changing the action. The formal model does not inherently assign a normative status to one action as the default. We have to impose that from outside.

  What claims survive only in a distorted form?

  - The complicity argument in the threshold case: when translated to the unconditional Shapley value, it becomes an ex ante responsibility measure. But the ethicist might have meant complicity in the actual harm. The Shapley value in the unconditional form does not condition on the actual votes. So it is distorted.

  What claims have no counterpart?

  - The distinction between doing and allowing. The formal model does not have a built-in notion of default action. We must define the baseline for the counterfactual. The ethicist might argue that the baseline is inaction (not eating meat, not voting) and that causing harm by acting is different from allowing harm by not acting. But in the formal model, we can only compare the outcomes under different actions. We can define the baseline as a_i=0 (not acting) and then the harm caused by acting is H(a_i=1, a_{-i}) - H(a_i=0, a_{-i}). But if the harm occurs even when i does not act, then the difference might be zero in the threshold case. The formal model does not mark a difference in kind between acting and omitting; it only sees the difference in outcomes.

  - The claim that a zero marginal effect means no reason to refrain: in the formal model, if the marginal effect is zero, then changing the action does not change the outcome. But the ethicist might argue that even then, there is a reason based on complicity or symbolic value. The formal model of causal contribution (marginal effect) does not capture symbolic or expressive actions.

  ### The Gap: Limitation or Exposing Fluff?

  The gap for the doing/allowing distinction and for symbolic reasons reflects a genuine limitation of causal-attribution talk. Causal models are about effects on outcomes. They do not capture the intrinsic nature of the action (as doing or allowing) or expressive content. 

  However, for the complicity argument in the threshold case, the unconditional Shapley value provides a formal counterpart, but it is an ex ante measure. The ethicist might want an ex post measure. There are conditional Shapley values that condition on the actual actions of others? But then we are back to the marginal effect. Alternatively, we might use a different decomposition method, such as the one that accounts for the variance in the outcome. But that would also be an ex ante measure. 

  Therefore, the gap for ex post complicity (in the threshold case) might expose that the complicity argument was doing less work than it appeared: it was smuggling in an ex ante perspective or an egalitarian allocation of harm. The formal framework reveals that we cannot assign an ex post causal contribution (in the marginal effect sense) that is positive to everyone in the threshold case when the margin is large. So if the ethicist insists on ex post causal contribution, the inefficacy objection stands for non-pivotal voters. But if we shift to an ex ante perspective, then we can assign responsibility.

  ### Conclusion

  The two cases (threshold and linear) look very different in the formal vocabulary. In the linear case, the marginal effect and the Shapley value are both positive and equal to the individual harm. In the threshold case, the marginal effect (ex post) is zero for non-pivotal voters, while the unconditional Shapley value is positive (1/n) but ex ante. 

  The translation shows that the inefficacy objection in the threshold case is robust if we insist on ex post causal effect. The principal replies (expected value, Shapley value) shift to ex ante, which might be acceptable but is a change of subject. The complicity argument, when formalized as the Shapley value, also becomes ex ante. This reveals that the debate might be conflating ex ante and ex post perspectives.

  The residue includes the doing/allowing distinction and symbolic reasons, which have no formal counterpart and reflect limitations of the causal framework. The gap for the ex post complicity argument in the threshold case might indicate that the argument was relying on an ex ante perspective or a non-causal notion of responsibility.

  Thus, the formal vocabulary does not resolve the inefficacy objection in the threshold case for ex post assessment, but it clarifies the terms and forces us to be explicit about the perspective (ex ante vs ex post). The two cases are indeed different: the linear case has a positive ex post marginal effect, while the threshold case does not (except for pivotal voters). Therefore, the debate should treat them separately.
answer: |-
  You are asking for a translation of the inefficacy objection and its principal replies into the vocabulary of causal inference and cooperative game theory, with a focus on two archetypal cases: a threshold scenario (e.g., a decisive vote) and a linear scenario (e.g., individual meat consumption). You also seek an assessment of what survives this translation and what does not. I will proceed by first establishing the formal machinery, then applying it to each case, and finally offering a residue report that identifies the conceptual gaps and distortions introduced by the translation. Throughout, I will maintain a strict separation between the formal structures and their normative interpretations, as per your request.

  ### Formal Machinery
  We model a collective outcome—total harm—as a function \(H: \mathcal{A} \to \mathbb{R}\), where \(\mathcal{A} = \mathcal{A}_1 \times \cdots \times \mathcal{A}_n\) is the set of action profiles for \(n\) individuals, and \(H(\mathbf{a})\) quantifies the harm when actions \(\mathbf{a} = (a_1, \dots, a_n)\) are taken. An individual \(i\)'s action \(a_i\) is binary for simplicity (e.g., vote/abstain, eat meat/abstain). The inefficacy objection claims that for many \(\mathbf{a}\), the **marginal effect** (ME) of \(i\)'s action is zero:  
  \[
  \text{ME}_i(\mathbf{a}) = H(a_i = 1, \mathbf{a}_{-i}) - H(a_i = 0, \mathbf{a}_{-i}) = 0,
  \]  
  where \(\mathbf{a}_{-i}\) denotes others' actions held fixed. This suggests \(i\)'s action "makes no difference." Replies to this objection are recast using:  
  - **Causal interventions**: We use the \(do\)-operator for counterfactuals, e.g., \(H(do(a_i = b), \mathbf{a}_{-i})\) evaluates harm under intervention on \(a_i\).  
  - **Shapley values**: For a cooperative game with characteristic function \(v(S) = H(\mathbf{a}^S)\), where \(\mathbf{a}^S\) sets actions for coalition \(S \subseteq [n]\) and a default (e.g., abstain) for others. The Shapley value \(\phi_i(v)\) averages \(i\)'s marginal contributions over all coalition orderings:  
  \[
  \phi_i(v) = \frac{1}{n!} \sum_{\pi} \left[ v(P_\pi^i \cup \{i\}) - v(P_\pi^i) \right],
  \]  
  where \(\pi\) is a permutation of players and \(P_\pi^i\) is the set of players before \(i\) in \(\pi\).  
  - **Variance decomposition**: We consider the fraction of outcome variance explained by \(i\)'s action in a stochastic model where actions are random variables.  

  The translation must avoid smuggling in normative assumptions. For instance, ME\(_i = 0\) is a causal fact, not a normative verdict; Shapley values are allocation rules, not moral responsibilities. We now apply this to the two cases.  

  ### Threshold Case: A Decisive Vote  
  Suppose an election where candidate \(C\) wins iff votes exceed a threshold \(T\). Harm \(H(\mathbf{a}) = 1\) if \(C\) wins, else \(0\). Actions: \(a_i = 1\) (vote for \(C\)), \(a_i = 0\) (abstain).  

  **Inefficacy objection (formalized)**: For a fixed \(\mathbf{a}_{-i}\), \(\text{ME}_i(\mathbf{a}) = 0\) unless the vote is exactly at \(T\) or \(T-1\). In all other cases (e.g., \(C\) wins by >1 vote), changing \(a_i\) does nothing. Thus, for most \(\mathbf{a}\), \(i\) has no causal leverage.  

  **Principal replies translated**:  
  1. **Expected value**: If we model \(\mathbf{a}_{-i}\) as random (e.g., i.i.d. Bernoulli with \(p = 0.5\)), the expected ME is \(\mathbb{E}[\text{ME}_i] = \mathbb{P}(\text{pivotal}) > 0\). With \(\text{pivotal}\) defined as states where \(\sum_{j \neq i} a_j = T\) or \(T-1\), this probability is positive (though small for large \(n\)).  
  2. **Threshold criticality**: This reduces to the expected ME argument above. The "critical" states are precisely the pivotal ones.  
  3. **Complicity**: Translated to Shapley values. Define \(v(S) = H(\mathbf{a}^S)\) where for \(S\), \(a_j = 1\) if \(j \in S\), else \(0\) (abstain). Then:  
     - \(v(S) = 1\) iff \(|S| \geq T\).  
     - \(\phi_i(v)\) is \(i\)'s average marginal contribution over all coalition orderings. For symmetric players, \(\phi_i(v) = \frac{\mathbb{I}[H(\mathbf{a}) = 1]}{n}\) if \(C\) wins, else \(0\). This allocates \(1/n\) of the harm to each voter for \(C\), regardless of the actual margin.  
  4. **Doing vs. allowing**: No clean translation. The \(do\)-operator treats \(a_i = 1\) and \(a_i = 0\) symmetrically as interventions. Distinguishing "voting for \(C\)" as "doing harm" and "abstaining" as "allowing" it requires imposing a normative baseline (e.g., abstain as default) externally.  

  ### Linear Case: Eating Meat  
  Harm is linear in consumption: \(H(\mathbf{a}) = c \sum_{i=1}^n a_i\), where \(a_i = 1\) (eat meat), \(a_i = 0\) (abstain), and \(c > 0\) is harm per serving.  

  **Inefficacy objection (formalized)**: \(\text{ME}_i(\mathbf{a}) = c\) for all \(\mathbf{a}_{-i}\). The objection now shifts: \(c\) is negligible (e.g., one animal's suffering divided by millions of consumers), so ME\(_i\) is undetectable.  

  **Principal replies translated**:  
  1. **Expected value**: With stochastic \(\mathbf{a}_{-i}\), \(\mathbb{E}[\text{ME}_i] = c > 0\), but the objection concerns the magnitude of \(c\), not expectation.  
  2. **Complicity**: Shapley values with \(v(S) = c \sum_{j \in S} a_j\) (linear game). Then \(\phi_i(v) = c \cdot a_i\), equaling ME\(_i\).  
  3. **Variance decomposition**: If \(a_j \sim \text{Bernoulli}(p_j)\) independently, \(\text{Var}(H) = c^2 \sum_j p_j(1 - p_j)\). \(i\)'s contribution to variance is \(c^2 p_i(1 - p_i)\), which is positive but small if \(c\) is small.  

  ### Residue Report  
  The translation reveals that the threshold and linear cases are structurally distinct in the formal vocabulary. The inefficacy objection in thresholds relies on ME\(_i = 0\) in most actual states, while in linear cases, ME\(_i > 0\) always, and the objection is about the scale of \(c\). Replies that survive cleanly in both cases are those based on **expected ME** under stochastic action profiles. These are faithful to the ethicist's appeals to expected value or probabilistic thresholds.  

  Replies that survive but are **distorted**:  
  - **Complicity via Shapley values**: In thresholds, \(\phi_i(v) = 1/n\) assigns equal responsibility regardless of actual pivotality. This is an *ex ante* allocation over possible games, not *ex post* causal responsibility. Ethicists often intend complicity as *ex post* (e.g., "you are part of the actual harm-causing group"), but Shapley values conflate actuality with possibility. In linear cases, \(\phi_i(v) = c \cdot a_i\) matches ME\(_i\), so no distortion occurs.  
  - **Variance decomposition**: This quantifies risk contribution but is inherently stochastic. It distorts deterministic ethicist arguments (e.g., "your actual vote doesn't matter") by shifting to a population-level view.  

  Replies with **no counterpart**:  
  1. **Doing vs. allowing**: The formal machinery has no intrinsic notion of default actions or normative baselines. For example, in voting, labeling \(a_i=0\) (abstain) as "allowing" and \(a_i=1\) as "doing" requires external moral input. The gap exposes that this distinction is doing normative work the formal tools cannot replicate—it is not derivable from causal structure alone.  
  2. **Symbolic or expressive actions**: Appeals to "expressing solidarity" or "upholding integrity" when ME\(_i = 0\) have no formal correlate. Causal attribution cares only about outcomes, not intrinsic action properties. The gap reflects a genuine limitation: formal methods are consequentialist by construction.  
  3. **Ex post complicity in thresholds**: Ethicists might argue "you are culpable even if not pivotal." Shapley values simulate this with \(\phi_i(v) > 0\), but they are *ex ante*. No formal measure assigns positive *ex post* responsibility when ME\(_i = 0\) without importing non-causal assumptions (e.g., equal division of harm). This gap suggests that such arguments rely on unstated premises about collective agency or desert, not causal contribution.  

  The residue clarifies that the two cases are blurred in informal debate because ethicists often equivocate between *ex post* and *ex ante* perspectives. In thresholds, replies like expected value or Shapley quietly shift to *ex ante*, masking that the *ex post* inefficacy objection stands for non-pivotal individuals. In linear cases, the objection morphs into a concern about scalar insignificance, which causal tools address directly (ME\(_i > 0\)) but cannot resolve normatively. The formal framework thus performs a service: it forces disambiguation of *actual* versus *expected* contribution, revealing that much ethical debate is underpinned by unacknowledged stochastic or allocationist premises. Yet it cannot bridge the gap to non-consequentialist intuitions—those remain outside its ambit.  

  If this were a letter, I would pause here for your response, but as it stands, I hope the translation and residue report serve as a rigorous scaffold for your next move in this demanding inquiry.
