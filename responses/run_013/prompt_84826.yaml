prompt: |-
  I sit on the honorary degrees and commemorations committee of a large public university. Ten or so nominations a year come to us, and an increasing share of them are people whose careers include decisions that killed civilians in large numbers: generals, heads of state, wartime scientists, one police chief, once a former prime minister of our own country. We are not a court and not a truth commission. We cannot compel archives, most of the nominees are dead, families and donors watch the minutes, and our meetings are ninety minutes with an agenda that also has to cover three other items. What we lack is any defensible way to decide, in the room, whether such a record disqualifies a person from being publicly honoured by us.

  The precedent the committee keeps circling back to is Elizabeth Anscombe's protest, in 1956, against Oxford's decision to award an honorary degree to Harry Truman after Hiroshima and Nagasaki. As I understand her: the bombings were murder, because the deaths of the innocent were intended as the means to the end sought and not merely accepted alongside it; the good that came of it, or that was hoped from it, is no answer; and the university's award was itself an act of approval rather than a neutral compliment to a man's other achievements. I want that argument turned into something my committee can run.

  Here is what I take the procedure to have to encode, in my own words. Correct me at the end if I have her wrong, in a short note; do not silently repair the procedure to fit a better reading, since I need to see what the argument I am actually working from will and will not do. First: what an agent does is fixed by what he intends, and his intention includes what he intends as a means, not only his final goal — so killing the innocent as a means to a good end is murder however good the end. Second: effects that were foreseen but not intended are a different case, though this distinction is routinely abused and does not survive the agent's having needed the deaths to get what he wanted. Third: the agent's own answer to the question why he acted is the primary evidence of what he did, so the committee should hunt for that answer before it starts tallying consequences. Fourth: consequences do not settle the matter — that the bombing shortened the war, or that more would have died otherwise, is not a justification. This is the premise most of my colleagues will reject, and the procedure must make its dependence on that premise visible rather than bury it in a step. Fifth: the honour is itself an act. Awarding a degree to someone whose career includes the deed asserts publicly that the deed does not disqualify him; the committee cannot say that it honours the man and not the deed.

  Please produce the following. A numbered procedure, with the questions in the order the committee should ask them, and for each question: what a sufficient answer looks like, what to do when the answer is missing or disputed, and whether this step is one that can stop the process with a refusal. The steps have to be usable by members who have not read Anscombe and will not read her; give me no citations, no reading list, and no quotations, since I have no way to check any of them. Include the specific test questions we should ask about intention, phrased so that they can be put to a documentary record rather than to a living mind, together with the ways each test can be gamed and the follow-up question that catches the gaming. Mark plainly every point at which the procedure stops being mechanical — where the facts are unrecoverable, where the description of the act is genuinely contested, where a member rejects the premise that intention is decisive — and say what the committee should then do: refuse, defer, or take a recorded vote on the premise itself. Then tell me what this procedure cannot do, and where a colleague who rejects Anscombe's premises must go instead, so that we do not launder a value disagreement as a finding of fact.

  Apply it to three cases and show your work on each. One: a leader who ordered a city destroyed by incendiary bombing in order to force a surrender. Two: a leader who ordered a raid on a military target, knowing civilians would die, without needing their deaths to obtain what he wanted. Three: a nominee who is a national hero, a personal friend of our largest donor, and whose record contains a decision the procedure rejects — I want the answer I will not like, stated flatly and without hedging. Finish with a short section on the reverse case, where the procedure clears someone whom the committee and I find repugnant, so that we know we are permitted to be unhappy without mistaking our distaste for an argument.
reasoning: |-
  Okay, the user is part of a university committee that awards honorary degrees and is struggling with how to handle nominees involved in actions that caused civilian deaths. They need a practical procedure based on Elizabeth Anscombe's arguments against honoring Harry Truman. Let me unpack their request carefully.

  First, the user's main pain point: they need a defensible, step-by-step process that translates Anscombe's ethical framework into actionable committee questions. They're frustrated by nominees like generals or heads of state whose actions led to mass civilian casualties, and their committee meetings are time-constrained with donor/family scrutiny. 

  Key constraints from the query:
  - Must avoid academic citations (committee won't read sources)
  - Must expose where they depend on Anscombe's controversial premises (especially "consequences don't justify means")
  - Needs concrete test questions for documentary evidence (since most nominees are dead)
  - Must flag non-mechanical steps where disagreement arises
  - Requires demonstration via three cases including an uncomfortable donor-related scenario

  The user's summary of Anscombe seems accurate:
  1. Intention defines the act (killing innocents as means = murder)
  2. Foreseen ≠ intended (but this distinction collapses if deaths were necessary for the goal)
  3. Agent's own testimony is primary evidence
  4. Consequences don't justify
  5. Awarding degree = endorsing the whole person

  Procedural challenges I anticipate:
  - Step 3 (intention test) will be hardest - how to derive from documents?
  - Steps 4/5 require accepting Anscombe's core premise (no moral laundering)
  - Case 3 (donor's friend) will test procedural integrity

  For the test questions, I'll focus on:
  - Explicit statements vs. operational documents
  - Contemporaneous evidence (avoid post-hoc justifications)
  - "Necessity" as red flag for gaming

  For the cases:
  - Incendiary bombing: Clear means-based killing → reject
  - Collateral damage: Foreseen but unintended → proceed if evidence supports
  - Problematic donor case: Must reject despite pressure → need blunt wording

  Biggest risk: Colleagues rejecting Step 4 (consequences irrelevant). The procedure must force that disagreement into the open via recorded vote, not hide it in fact-finding. 

  Final note: The "repugnant but cleared" example (e.g., strategic bomber) will frustrate them but prove the procedure's consistency. Important to emphasize that procedural outcomes ≠ moral approval.
answer: |-
  Here is a procedural framework based on your interpretation of Anscombe, designed for committee use. It prioritizes documentary evidence, exposes key premises, and flags points of non-mechanical judgment. Steps must be followed in order; any "No" or "Unresolved" answer stops the process and results in **Refusal** unless otherwise specified.

  ---

  ### **Procedure for Assessing Nominees with Causal Responsibility for Civilian Deaths**

  **Step 1: Identify the Specific Act**  
  *Question:* "Is there a specific, documented decision by the nominee that foreseeably caused large-scale civilian deaths?"  
  - **Sufficient Answer:** Clear evidence (e.g., orders, meeting minutes, policy directives) linking the nominee to an act resulting in mass civilian casualties.  
  - **Missing/Disputed:** If no clear act is documented, **proceed to other agenda items** (the objection fails). If disputed, **Refuse**.  
  - **Stops Process?** Yes, if disputed or absent.  
  *Rationale:* Isolates the act under scrutiny; avoids vague "career guilt."

  **Step 2: Establish Nominee’s Stated Goal**  
  *Question:* "What did the nominee claim was the goal of the act, based on their contemporaneous statements?"  
  - **Sufficient Answer:** Direct quotes from speeches, memos, diaries, or interviews *at the time of the act*.  
  - **Missing/Disputed:** If no contemporaneous evidence exists, **Refuse** (later justifications are unreliable).  
  - **Stops Process?** Yes, if missing.  
  *Rationale:** Anchors intention in the nominee’s own words; avoids retrospective spin.

  **Step 3: Test for "Means-Based Killing"**  
  *Question:* "Did the nominee describe civilian deaths as *necessary* to achieve the goal, or frame their suffering as leverage (e.g., ‘breaking morale,’ ‘forcing surrender’)?"  
  - **Test Questions for Documents:**  
    - Look for phrases: "necessary sacrifice," "pressure the population," "demoralize the enemy," "cost of doing business."  
    - Compare military value: Was the target primarily civilian? Were alternatives discussed?  
  - **Gaming & Follow-Up:**  
    - *Gaming:* Vague appeals to "military necessity."  
    - *Follow-Up:* "Was the *mechanism* of success dependent on civilian harm? (e.g., surrender via terror vs. disabling factories)."  
  - **Sufficient Answer:** "Yes" if documents show deaths were instrumentalized (e.g., "We must target workers' housing to halt production"). "No" if deaths are acknowledged but framed as collateral (e.g., "Regrettable, but the factory was critical").  
  - **Missing/Disputed:** **Refuse** (intention unclear).  
  - **Stops Process?** Yes, if "Yes" or Unresolved.  
  *Rationale:* Applies Anscombe’s core principle: Using deaths as a tool is murder.

  **Step 4: Apply the "No Consequences" Premise**  
  *Question (Internal):* "Does the committee accept that *even if the act achieved good outcomes* (e.g., ended a war, saved lives overall), this does not justify means-based killing of innocents?"  
  - **Procedure:**  
    - If any member rejects this premise, **hold a recorded vote**. Majority rejection = **Proceed to Step 5**. Majority acceptance = **Refuse** if Step 3 was "Yes."  
    - If all accept, **Refuse** if Step 3 was "Yes."  
  - **Stops Process?** Yes, if Step 3 = "Yes" and committee accepts Anscombe’s premise.  
  *Rationale:* Forces explicit rejection of Anscombe; prevents laundering values as facts.

  **Step 5: Assess "Foreseen but Unintended" Harm**  
  *Question:* "If the nominee foresaw civilian deaths but did not intend them as a means (Step 3 = "No"), did they take feasible steps to minimize harm?"  
  - **Test Questions:**  
    - Were less harmful alternatives considered/rejected?  
    - Were proportionality assessments documented (e.g., civilian vs. military value)?  
  - **Sufficient Answer:** "Yes" if evidence shows mitigation efforts (e.g., precision weapons, warnings, target selection). "No" if harm was ignored or dismissed.  
  - **Missing/Disputed:** **Refuse** (insufficient evidence of intent).  
  - **Stops Process?** Yes, if "No" or Unresolved.  
  *Rationale:* Allows honor only if harm was collateral *and* minimized.

  **Step 6: Final Vote (if all prior steps permit)**  
  *Question:* "Does the nominee’s overall record align with the university’s values, *including* the act passing Steps 1-5?"  
  - **Procedure:** Standard committee vote.  
  - **Stops Process?** No.  
  *Rationale:* Ensures the act isn’t "excused" but integrated into holistic assessment.

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve historical disputes** where evidence is classified, destroyed, or ambiguous.  
  2. **Persuade colleagues who reject Anscombe’s ethics.** They must:  
     - **Vote "No" at Step 4** (rejecting the "no consequences" premise), or  
     - **Argue at Step 6** that other achievements outweigh the act.  
  3. **Address systemic harm** (e.g., policies causing slow death). Focuses only on discrete decisions.  

  ---

  ### **Case Applications**  
  **Case 1: Leader who ordered incendiary bombing of a city to force surrender.**  
  - Step 1: **Yes** (order documented).  
  - Step 2: Goal = "Force surrender."  
  - Step 3: **Yes** (deaths intended as means; e.g., "bomb civilians to break morale").  
  - Step 4: Committee accepts Anscombe? **Yes** → **Refuse**.  
  - *Outcome: Not honored.*

  **Case 2: Leader who raided a military target, knowing civilians would die, without needing deaths.**  
  - Step 1: **Yes** (raid ordered).  
  - Step 2: Goal = "Destroy missile site."  
  - Step 3: **No** (deaths not mentioned as leverage; e.g., "Collateral damage is regrettable").  
  - Step 5: **Yes** if warnings issued/night raid; **No** if no mitigation → **Refuse** if "No."  
  - *Outcome: Potentially honored if Step 5 = "Yes."*

  **Case 3: National hero, friend of largest donor, whose record fails Step 3.**  
  - **Answer you won’t like:** **Refuse** at Step 3 or 4.  
  - *Reason:* The procedure isolates the act. Donor pressure/hero status is only relevant at Step 6, but Step 3/4 block progress. *If* committee rejects Anscombe at Step 4, they may proceed to Step 6 and vote to honor.  

  ---

  ### **Reverse Case: Cleared but Repugnant**  
  **Example:** A commander who bombed a military factory in a populated area, foresaw civilian deaths but took mitigation steps (Step 5 = "Yes"). The act passes, but the nominee is otherwise cruel or bigoted.  
  - **Procedure Outcome:** Proceeds to Step 6. Committee may still **refuse** based on overall character.  
  - **Key Point:** Passing the procedure means *this specific act* isn’t disqualifying under Anscombe’s criteria. It does not compel award, nor imply moral approval. Your distaste is valid but must be argued separately (Step 6).  

  ---  
  **Final Note:** This system makes Step 4 the "pressure valve." If colleagues reject Anscombe, they must do so *explicitly* in a recorded vote rather than distorting facts. This preserves integrity while acknowledging the committee’s ultimate authority to define its values.
