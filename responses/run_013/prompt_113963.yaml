prompt: |-
  I'm a software engineer with no formal background in philosophy, and I host a small podcast where I interview researchers about conceptual puzzles. Next week's guest is a philosopher whose new book argues that beliefs and desires don't exist — that the vocabulary of propositional attitudes is a decaying folk theory we should retire rather than repair. Draft eight to ten interview questions that force her to commit to specifics instead of restating the thesis, with a follow-up keyed to her likely answer for each. I want at least one question pressing the self-defeat worry in its practical form (how can she argue for the conclusion without treating her audience as having beliefs that her argument could change?), with a follow-up ready if she says that asserting something doesn't require believing it; one asking what would actually count as evidence that the folk theory is false rather than merely rough, and whether the familiar comparison to phlogiston and caloric is doing real work or just decorating the claim, plus a follow-up if she retreats to saying the comparison is only illustrative; one asking whether her thesis is a claim about how brains work or about how we ought to talk, and whether defending the first while recommending the second is a bait-and-switch; and one built on a case from my own work — a neural network whose internal states I can probe and intervene on, but whose behavior I can only predict statistically — asking whether that is a model of belief without beliefs or merely a model of behavior. Also ask where she draws the line: if beliefs and desires go, what becomes of the posits she still uses herself, such as representations and computations, and what vocabulary is supposed to do the work afterwards? Close by asking what she thinks would concretely be lost if she turned out to be right.
reasoning: |-
  Okay, the user is a software engineer hosting a podcast about conceptual puzzles, interviewing a philosopher who argues that beliefs and desires don't exist. They need 8-10 questions that push the guest to clarify specifics, with follow-ups ready for likely answers. 

  First, I need to unpack the core request: The guest's thesis is radical (beliefs/desires are folk psychology relics), so questions must prevent hand-waving. User explicitly wants four anchors: (1) practical self-defeat paradox, (2) evidence standards vs. analogies like phlogiston, (3) ontology-vs-language distinction, (4) a neural network case study from user's work. Plus meta-questions about scope (what else gets abolished?) and consequences (what's lost if she's right). 

  For self-defeat: The key trap is "How can you persuade if you deny audiences have beliefs?" Follow-up must preempt the "asserting ≠ believing" dodge—maybe by pressing whether persuasion implies tracking mental states. 

  For evidence: Need to force her to specify what would falsify folk psychology beyond rough edges. If she hides behind phlogiston as "just illustration," follow-up should demand what makes folk psych uniquely defective vs. other useful-but-false theories (e.g., Newtonian physics). 

  Ontology/pragmatics split: Crucial to expose if she's conflating "brains don't have beliefs" (science claim) with "stop talking about beliefs" (prescription). Follow-up on bait-and-switch if she leans on science to justify language reform. 

  Neural network probe: User's example is perfect—a system with probeable states but statistical behavior. Is this belief-like without being belief? Follow-up must dissect whether "model of belief" smuggles in the very concept she rejects. 

  Scope question: Should corner her on whether *her own* terms (computation, representation) face the same fate. No letting her keep "respectable" posits while scrapping others. 

  Closing: Demand tangible losses—not just "we'd adjust," but what human experiences would vanish (guilt? promises?) if we erased belief/desire talk. 

  User's background matters: Engineer framing means avoiding jargon. Neural network case leverages his expertise—good hook. Podcast context means questions must sound conversational but trap her logically. 

  Also sensing unspoken needs: User likely wants to expose contradictions entertainingly for listeners. Questions should build "oh snap" moments—like the self-defeat trap—where guest can't wiggle out. 

  Structure: 8 core questions. Opening with neural net (user's work = engagement), then evidence, ontology, self-defeat, scope, consequences. Follow-ups nested but marked as such. Tone: respectful but sharp, like a dev grilling a library's API design flaws.
answer: |-
  Here are 10 interview questions designed to press for specifics, incorporating your required elements, with embedded follow-ups anticipating likely responses:

  1.  **Neural Network Case Study:** "In my work, I design neural networks whose internal state vectors I can directly probe and manipulate, but whose behavioral outputs I can often only predict statistically. Is this system best understood as a *model of belief* (without actually *having* beliefs), or is it merely a sophisticated model of behavior? If it's not a model of belief, what crucial element is missing?"
      *   *Likely Follow-up Trigger:* If she says it's *merely* behavior: "You seem to be saying the key difference is intentionality or normativity. Is the absence of *aboutness* or the *possibility of being wrong* in the normative sense what definitively separates my network from a 'true believer'? How does this relate to the folk concept you reject?"

  2.  **Evidence Threshold:** "What specific empirical discovery, or type of discovery, would constitute clear evidence that the folk theory of belief and desire is *fundamentally false* – not just rough or incomplete, but categorically mistaken in positing entities that don't exist? What would falsify it, beyond showing neural implementation is messy?"
      *   *Likely Follow-up Trigger:* If she leans heavily on historical analogies (phlogiston, caloric): "Is the phlogiston comparison doing essential work here? Does folk psychology fail *in precisely the same way* – e.g., is there an empirically discovered 'oxygen of cognition' that displaces belief/desire? Or is this just a vivid illustration of theory replacement?"
          *   *If she retreats to "just illustrative":* "If it's only illustrative, what *specific, unique* defect does folk psychology have that warrants elimination rather than refinement, unlike, say, Newtonian mechanics which was 'false' but immensely useful and corrigible? What's the *special problem* with belief/desire?"

  3.  **Ontology vs. Pragmatics:** "Is your core thesis primarily an ontological claim ('Brains do not contain states or processes that correspond to beliefs and desires as folk psychology conceives them') or a pragmatic recommendation ('We should abandon belief/desire vocabulary for scientific and possibly everyday purposes, regardless of ontology')? Or are these inseparable?"
      *   *Likely Follow-up Trigger:* If she emphasizes the scientific claim to justify the pragmatic one: "Doesn't this risk a bait-and-switch? You might use neuroscientific findings to argue *against* the existence of folk posits (the 'bait'), but then the *recommendation* to abandon the vocabulary is a separate normative move (the 'switch'). How do you bridge the 'is' of brain science to the 'ought' of linguistic practice *without* smuggling in a normative concept your own theory seems to reject?"

  4.  **Self-Defeat (Practical):** "Your book aims to persuade readers to abandon the belief/desire framework. If your thesis is correct and audiences genuinely lack beliefs, how does this process of persuasion work? What are you changing when you present arguments, if not their beliefs about the nature of mind?"
      *   *Likely Follow-up Trigger:* If she argues that asserting something doesn't require *her* to have beliefs about *their* beliefs: "Granted, *you* asserting P doesn't logically require *you* to believe *they* believe Q. But doesn't the *act of persuasion itself* – crafting arguments, anticipating objections, tailoring explanations – seem practically unintelligible unless you are, functionally, treating your audience *as if* they have beliefs your arguments can update? Isn't your *method* tacitly committed to the very framework your *conclusion* denies?"

  5.  **The Comparison Trap:** "You often compare belief/desire talk to outdated folk theories. But unlike phlogiston, belief/desire concepts seem deeply embedded in legal systems (intent), moral responsibility, and defining personal identity. If we abandon them, what specific, testable *superior framework* is ready to handle these domains *right now*? What's the replacement for 'intentional action' in a courtroom?"

  6.  **Drawing the Line / Cascading Elimination:** "If beliefs and desires, as propositional attitudes, don't exist and their vocabulary should be retired, where do you draw the line? You likely still use terms like 'representation', 'computation', 'information', 'model', or 'goal-directed'. Are *these* posits on firmer ontological ground? If so, why? If not, doesn't the eliminativist argument cascade, threatening the vocabulary you *do* rely on to explain cognition?"

  7.  **The Success Puzzle:** "Folk psychology demonstrably *works* remarkably well for predicting everyday behavior in social contexts. If it's fundamentally false, how do you explain its predictive and explanatory success? Is it just a massive coincidence, or is there a better explanation that doesn't salvage beliefs/desires as real?"

  8.  **Internal Consistency & Reporting:** "When you introspect on your own decision to write this book, how do *you* describe your motivation without invoking desires (e.g., a desire to correct a misconception)? And when you formulated your arguments, how do you describe your cognitive process without invoking beliefs (e.g., believing eliminativism is true, believing certain evidence is strong)? Doesn't your *first-person report* seem to unavoidably rely on the very concepts you reject?"

  9.  **Levels of Explanation Defense:** "A common defense of folk psychology is that it operates at a different, higher level of abstraction than neuroscience – like software vs. hardware. Why is this 'level of description' argument insufficient? Why must the neural implementation *directly correspond* to the folk categories for them to be valid? Isn't functionality what matters at that level?"

  10. **Concrete Loss:** "Finally, let's assume you're entirely successful. We fully adopt your view and eliminate 'belief' and 'desire' from our scientific and everyday vocabulary. What concretely, tangibly, would be *lost*? What aspects of human experience, social practice, or understanding might become harder, or even impossible, to express or capture in this new framework?"

  **Key Design Principles Employed:**

  *   **Forcing Specifics:** Questions demand concrete examples (evidence, replacements), distinctions (ontology vs. pragmatics), and clarifications (line-drawing, what's missing in the NN case).
  *   **Targeted Follow-ups:** Pre-planned counters to predictable evasions ("just illustrative", "asserting ≠ believing", "levels of explanation").
  *   **Embedding Your Elements:** Self-defeat (Q4), Evidence/Phlogiston (Q2), Ontology/Pragmatics/Bait-and-Switch (Q3), Neural Network Case (Q1), Line-Drawing (Q6), Consequence (Q10).
  *   **Pressure Points:** Highlighting practical contradictions (Q4 - persuasion, Q8 - first-person reports), explanatory puzzles (Q7 - success), and real-world implications (Q5 - law, Q10 - loss).
  *   **Closure:** Q10 explicitly asks for the stakes, forcing consideration of the thesis's impact beyond academic debate.
  *   **Software Engineer Relevance:** Starting with the NN case grounds it in your expertise and provides a concrete anchor point.

  These questions should push the conversation beyond mere thesis restatement and into the substantive philosophical and practical challenges of radical eliminativism. Good luck with the interview!
