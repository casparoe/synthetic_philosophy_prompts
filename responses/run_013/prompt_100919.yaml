  ### The Dig  
  The sun hung low over the arid plains of Kestia. Site Alpha, a grid of trenches etched into the dust, had yielded nothing but pottery fragments for weeks. Dr. Aris Thorne brushed sediment from a shard. *Common zigzag patterns—negative signal*. His gut tightened. With funding dwindling, the team faced a binary choice: **dig deeper at Alpha** or **relocate to Beta**, a satellite site. Statistically, Alpha and Beta were equally likely to hold the lost Temple of Amun.  

  Thorne held the shard to the light. *If the temple is here, I’d expect royal symbols, not this*. The math was clear: a common shard was twice as likely if the temple was absent. He signaled the team. "Pack the equipment. We move to Beta at dawn."  

  Dr. Lena Petrova watched, her own shard hidden in her palm—a **blue lotus**, a royal motif. *Positive signal*. Her pulse quickened. *If Thorne saw a royal shard, he’d stay. But he’s leaving... so he must have seen a common one*. She weighed the evidence: her royal shard versus Thorne’s implied common shard. A perfect balance. *50-50*. Protocol dictated ties be resolved by seniority: follow the first mover. "I’ll prep the vehicles," she said.  

  Dr. Elias Vance unearthed his shard near the eastern trench—**crisscrossed lines, common**. *Negative signal*. He noted Thorne and Petrova loading gear. *Thorne moved first; his action reveals a common shard. Petrova’s move? Unreadable—she’d have moved regardless of her signal if it was a tie*. Only Thorne’s signal mattered. Combined with his own common shard, the odds now strongly favored absence. "Beta it is," he called, hoisting his pack.  

  Dr. Mei Chen’s fingers closed around her shard—a **sun disk**, another royal symbol. *Positive signal*. By the time she returned from the remote sector, Alpha’s camp was half-dismantled. She reconstructed the sequence: Thorne’s move (common), Petrova’s move (ambiguous), Vance’s move (ambiguous). *My sun disk versus Thorne’s common shard. Another tie*. The rule burned in her mind: *defer to the first*. She loaded her tools without a word. Speaking would breach protocol—and with the team committed, her lone voice couldn’t shift the consensus.  

  ---  
  **Coda**  
  *One week earlier, the same plain*:  
  Mei Chen’s trowel struck ceramic. A sun disk—royal. First to decide, she raised it high. "We stay."  
  Thorne unearthed his common shard next. *Her royal signal versus my common one. Tie*. He deferred to her first move. "We stay."  
  Petrova, holding her blue lotus, saw two stays. *Mei’s stay reveals a royal shard. Thorne’s? Unclear—he’d stay in a tie anyway*. Two royal signals outweighed doubt. "We stay." Vance followed.  
  By dusk, Alpha’s trenches revealed the temple’s foundation stones.  

