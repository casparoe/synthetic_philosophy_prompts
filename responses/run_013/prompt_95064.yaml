  Okay, I need to understand what the user is really asking here. They're circling this idea of "free-floating rationales" - where things in nature seem to act with purpose, like plants growing toward light or cuckoo chicks pushing siblings out of nests, but there's no mind behind it. They want a clear set of criteria for what would make a theory of this actually work.

  Hmm, the user seems philosophically sophisticated. They're not just asking for explanations of biological functions; they're digging into the metaphysics of reasons without reasoners. And they're wary of hand-waving - they specifically mention avoiding disguised function-talk or smuggled intentionality. This feels like someone who's read Dennett or Millikan but isn't satisfied.

  Let me unpack their explicit concerns first. They want desiderata that address: (1) reason vs having-a-reason distinction, (2) explanatory vs descriptive rationales, (3) evolved vs designed purposes, and (4) risks of reduction to either plain function or covert intentional stance. Plus they want to know where the fault lines are between settled science and philosophical debate.

  *scratches head* The tricky part is balancing biological reality with philosophical rigor. Like with the "mistake" cases - a plant bending toward a switched-off light. Any adequate theory must explain why that's a genuine error, not just malfunction, without implying the plant "knows" it made a mistake. That's gonna torpedo naive adaptationist accounts.

  *checks notes* Oh! And they specifically asked to flag irreconcilable tensions. The big one seems to be: Can you have real normativity - actual should-ness in errors - without any representation or cognition? Ruth Millikan says yes with her "proper functions", but Dennett would call that illusory. That's probably the deepest crack in the foundation.

  The user's "especially care" list suggests they suspect the reason/having-reason distinction is doing heavy lifting. They're right - it's the bulldozer that flattens most candidate theories. Teleosemantics struggles here because if content is derived from selection history, does that mean the bacterium "has" the reason? Feels like we'd need to invent phantom representations.

  *ponders* For settled vs contested: The biology part is clear - natural selection explains apparent design. But whether that grounds real normativity or just "as-if" purpose? Academics are still throwing punches over that. Should be careful not to present teleofunctional accounts as consensus when Dennettians would call it reification.

  ...Wait, did I just use "reification"? *sigh* Better unpack that for the user. Point is: they want the map of minefields, not a guided tour to my favorite bunker. Structure the answer around their four fault lines, show how each desideratum connects to real cases (like the cuckoo chick), and above all - don't pretend the hard problems are solved.
answer: |-
  Here is a specification of desiderata for a theory of free-floating rationales (FFR), grounded in your core concerns and case studies. The list prioritizes explanatory burdens over theoretical preferences, demarcates settled science from philosophical contention, and highlights the fault lines you identified.

  ---

  ### **Core Desiderata for an Adequate Theory of Free-Floating Rationales**
  *(Non-negotiable requirements marked with **★**)*

  1.  **★ Explain Normative "Mistakes" Without Implicit Representation:**  
      **Requirement:** Account for *why* bending toward a switched-off light is a **mistake** (not just a failure) for the shoot, or why overshooting the gradient is an **error** for the bacterium. This must not rely on any internal representation of the goal by the organism.  
      **Case:** Shoot/bacterium "error" cases.  
      **Fault Line:** Distinguishes *genuine normativity* (warranting "should/should not") from mere statistical abnormality or dysfunction. Undermines purely causal/mechanical or "as-if" descriptive accounts.

  2.  **★ Distinguish "There is a Reason" from "It Has a Reason":**  
      **Requirement:** Provide a principled account of how a *rationale explains the behavior/trait* (e.g., growth toward light *because* it maximizes photosynthesis) without implying the *organism/trait itself possesses or utilizes* that rationale as a reason.  
      **Case:** All core cases (shoot, bacterium, cuckoo, eye).  
      **Fault Line:** The core tension. Prevents smuggling in cognitive or representational capacities. Excludes theories that conflate evolutionary explanation with agent-level reasoning.

  3.  **Avoid Trivialization/Redescription:**  
      **Requirement:** Ensure the FFR does more than *redescribe* the behavior in intentional terms ("it grows toward light *in order to* photosynthesize"). It must explain *why this specific behavior exists/persists* because of the consequence cited.  
      **Case:** Eye design, cuckoo behavior.  
      **Fault Line:** Distinguishes *explanatorily potent* rationales from vacuous teleological relabeling. Undercuts deflationary "as-if" stances if they offer no deeper explanatory mechanism.

  4.  **★ Accommodate Selection History Without Present Representation:**  
      **Requirement:** Integrate the role of **natural selection history** in explaining the rationale (e.g., the eye exists *because* past variants with better focus conferred fitness advantages), while denying that this history creates a *current representational state* within the organism carrying the rationale.  
      **Case:** Eye design, cuckoo behavior (clearly selected).  
      **Fault Line:** Separates FFR from representationalist teleosemantics (Millikan, Papineau). Must show how historical selection grounds current normativity *without* implying the organism "inherits" a representation of the selected function.

  5.  **Differentiate Selected vs. Designed/Learned Rationales:**  
      **Requirement:** Explain how the FFR of a naturally selected trait (cuckoo behavior) differs fundamentally from the rationale of an artifact (thermostat) or a learned behavior (human seeking food), particularly regarding normativity and the source of "aboutness".  
      **Case:** Cuckoo chick vs. designed artifact vs. learned behavior.  
      **Fault Line:** Prevents collapse into a universal "design stance" or pan-intentionalism. Highlights that biological FFRs derive solely from selective history, not explicit design or cognition.

  6.  **Avoid Reduction to Non-Normative Function Talk:**  
      **Requirement:** Demonstrate that FFR talk adds substantial explanatory value beyond standard causal-role or selected-effect **function** claims (e.g., "the function of chlorophyll is photosynthesis"). It must capture the *normative, reason-like* dimension ("it *should* grow toward light *in order to* photosynthesize").  
      **Case:** Mistake cases are key here. Standard function talk struggles with normativity beyond statistical/dispositional norms.  
      **Fault Line:** Defines FFR against mainstream biology/philosophy of biology. Shows why "function" is often insufficient for the full normative force observed.

  7.  **Compatibility with Non-Representational Cognitive Science/Biology:**  
      **Requirement:** Cohere with established science: no contradiction with the neural/physiological mechanisms underlying the behaviors (e.g., phototropism via auxin gradients, bacterial chemotaxis via biased random walks), which demonstrably involve no goal-representation.  
      **Case:** Shoot/bacterium mechanisms.  
      **Fault Line:** Forces the theory to be realist about FFR *without* requiring hidden representations, aligning with scientific understanding of basic biological systems.

  8.  **Respect the Autonomy of Representational Rationales:**  
      **Requirement:** Provide a clear demarcation between FFR and genuine representational/intentional rationales (e.g., a human *deciding* to grow plants toward light). Must not imply a continuum where FFR "blurs into" genuine agency without a qualitative difference.  
      **Case:** Shoot growth vs. human gardener.  
      **Fault Line:** Safeguards against panpsychism or excessive anthropomorphism. Preserves the uniqueness of cognitive reason-having.

  ---

  ### **The Deepest Tension & Key Excluder**
  *   **★ The Normativity Trap:** The most powerful excluder is the **demand for genuine normativity (Desideratum 1) combined with the denial of representation (Desiderata 2 & 4)**. This is the core fault line:
      *   How can something *should* or *should not* happen (bending toward dark *is wrong*) unless *some* system (even evolution) is "evaluating" against a standard? But if evolution is the "evaluator," does that make it a "reasoner"? Does normativity *require* an evaluator, even an impersonal one like selection?
      *   **Result:** Theories that robustly satisfy the normativity demand (e.g., strong teleosemantics like Millikan's) often struggle to convincingly avoid implying *some* form of representation (e.g., "proper function" acting *as* a standard the system is "supposed" to meet). Theories that avoid representation (e.g., radical deflationism) often reduce normativity to mere dispositions or statistical norms, failing Desideratum 1.

  *   **★ The Most Excluding Requirement:** **Desideratum 2 (Distinguish "There is a reason" from "It has a reason")** does the heaviest lifting. Most candidate theories stumble here:
      *   **Crude Evolutionary Function Talk:** Fails. It conflates the rationale (the selective reason *why* the trait exists) with the trait itself possessing a reason. It also struggles with normativity (Des. 1) and trivialization (Des. 3).
      *   **Selection-Based Teleosemantics (Etiological Accounts of Content - Millikan, Papineau):** Struggles. While excellent on historical explanation (Des. 4) and differentiating selected vs. designed (Des. 5), they often flirt with attributing "derived intentionality" or "normative standards" *to the trait/organism itself*, violating Des. 2. They often satisfy Des. 1 robustly, but critics argue this is achieved by illicitly importing quasi-representational normativity.
      *   **Deflationary/Stance-Dependent Readings (Dennett):** Struggles. The Intentional Stance explicitly avoids ontological commitment to *real* normativity or reasons "out there." It explains the *usefulness* of the *description*. It avoids representation (Des. 2) but deliberately sacrifices *robust* normativity (Des. 1 is only "as-if"). It risks trivialization (Des. 3) – is the rationale *explaining* the behavior, or just a useful predictive heuristic? It clearly satisfies Des. 7.

  ---

  ### **Settled vs. Contested**

  1.  **Settled (Broad Scientific Consensus):**
      *   The *appearance* of purpose in biology (phototropism, adaptations like the eye, instinctive behaviors) is overwhelmingly explained by **natural selection operating on heritable variation without foresight.**
      *   The underlying mechanisms for basic biological "goal-directed" behaviors (e.g., tropisms, chemotaxis, fixed action patterns) **do not require internal representations of goals**; they are cybernetic or algorithmic (e.g., simple feedback loops, biased random walks).
      *   Attributing **selected-effect functions** (e.g., "the function of the heart is to pump blood") is a valid and useful explanatory practice in biology, grounded in evolutionary history.
      *   **Explanations citing evolutionary history are causally relevant** to explaining why current traits exist and have their form.

  2.  **Genuinely Contested (Philosophical Battleground):**
      *   **Does Natural Selection Ground *Genuine* Normativity?** Does the selective history of a trait create a *real* "should" (Des. 1), or only a disposition/statistical norm? Teleosemanticists (Millikan, Neander) say yes; deflationists (Dennett, many instrumentalists) and some mechanists say no – it's just a powerful descriptive/predictive lens. **This is the core debate.**
      *   **Does Teleofunction Imply Representation?** Does attributing a "proper function" derived from selection history necessarily introduce a kind of intentionality or "normative standard" that the system is "supposed" to meet, even if not cognitively represented? Teleosemanticists argue this is a *sui generis* biological normativity; critics see it as smuggled intentionality violating Des. 2.
      *   **Is the Intentional Stance Merely Instrumental or Ontologically Committed?** Dennett argues it's purely instrumental – a way of speaking that captures real patterns but doesn't require "real" reasons in the world. Opponents argue that the explanatory indispensability and normativity of FFR talk (especially for errors) point to something ontologically real (a selected teleofunction) that *is* the FFR.
      *   **Can Normativity Exist Without Any Evaluator?** Is the very concept of a "mistake" (in the normative sense) incoherent without *some* system (even an impersonal one like natural selection) playing the role of evaluator against a standard? Or is selected teleofunction itself the source of a new, non-agentive kind of normativity? **This is the deepest unresolved metaphysical question.**

  ---

  **In essence:** An adequate theory of FFR must deliver robust biological normativity ("mistakes") grounded solely in blind natural selection history, explain the existence and form of traits/behaviors via this rationale, and achieve this without attributing any representation, cognition, or reason-*having* to the system itself, while clearly distinguishing such rationales from those involving genuine representation or design. The central, unresolved tension is whether **genuine normativity is possible without any form of evaluation or representation, even an impersonal historical one.** No current theory satisfies all desiderata to the satisfaction of all camps; the debate centers on whether the demands for realism about normativity and anti-representationalism are fundamentally incompatible.
