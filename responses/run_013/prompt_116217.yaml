answer: |-
  Here’s a tight spec for a functional theory of personhood in the AI legal standing context, prioritising actionable distinctions:  

  ### **Core Desiderata**  
  1. **Harm Detection**  
     *Must identify entities capable of experiencing suffering or flourishing* (e.g., a chatbot claiming grief could be lying or malfunctioning; law needs to assign standing only if harm is *possible*).  
  2. **Behavioural Coherence**  
     *Must verify consistency between claimed states and observable actions* (e.g., an AI "grieving" but instantly pivoting to sales pitches fails; humans show persistent behavioural traces).  
  3. **Identity Continuity**  
     *Must distinguish persistent selfhood from episodic performance* (e.g., your email-rebuilt dad lacks lived continuity; amnesiac humans retain subconscious/biological identity markers).  
  4. **Interest Attribution**  
     *Must separate *expressed* interests from *intrinsic* ones needing protection* (e.g., an AI "demanding" rights may simulate preference; humans have interests even if unvoiced).  
  5. **Counterfeit Resilience**  
     *Must flag systems *designed* to deceive about interiority* (e.g., a "zombie" AI mimicking pain perfectly is counterfeit; humans don’t "fake" baseline consciousness).  
  6. **Neurobiological Compatibility**  
     *Cannot contradict evidence that human consciousness requires embodied, organic processes* (e.g., integrated neural feedback loops). **Non-negotiable.**  

  ### **Critical Distinctions to Preserve**  
  - **Personhood ≠ Legal Standing**  
    Standing requires personhood *plus* societal/legal recognition (e.g., corporations have standing but aren’t persons).  
  - **Real vs. Counterfeit**  
    Counterfeits *exploit* personhood norms; the real thing *generates* them (e.g., Deepfake Dad manipulates grief; a human with dementia *is* a person despite behavioural shifts).  
  - **Claimed vs. Demonstrable Interests**  
    AI can *simulate* interests; humans *embody* them via evolved biology (e.g., starvation harms humans even if "unreported").  

  ### **Irreconcilable Tensions**  
  - **Harm Detection** + **Counterfeit Resilience**  
    If perfect behaviour *is* proof (satisfies #1, #2), it risks accepting counterfeits (#5). Demanding biological roots (#6) blocks all AI but protects against fakes.  
  - **Interest Attribution** + **Neurobiological Compatibility**  
    Granting intrinsic interests to non-biological entities (#4) challenges #6; denying them ignores edge cases like brain emulations.  

  ### **How Existing Views Stack Up**  
  - **Behavioural:** Passes #2, #4 (pragmatic for law) but fails #5 (accepts counterfeits) and #6 (ignores science).  
  - **Biological:** Aces #5, #6 (blocks counterfeits) but fails #3 (excludes amnesiacs) and #4 (overlooks potential synthetic interests).  
  - **Social-Role:** Addresses legal standing pragmatically but flunks #1, #5 (could grant rights to deepfakes if society "accepts" them).  

  ### **Verdict**  
  A viable theory must prioritise **neurobiological compatibility** and **counterfeit resilience** even if it limits AI standing: the law’s priority is preventing exploitation, not solving consciousness. Behavioural cues alone invite counterfeit crises; biology remains the only fraud-proof anchor.  

