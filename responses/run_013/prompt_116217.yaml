  I'm writing a long read about the counterfeit-people worry — the line that we keep arguing over whether AI can be conscious when the real question is wether something can be a fake person that passes itself off as one. Before I put any of that in front of readers I want a spec, not another definition. So: what would a theory of personhood have to actually deliver for it to be any use to someone deciding whether to grant an AI legal standing? Give me the desiderata, with the case behind each — the chatbot that says it's grieving, a copy of my dead dad built out of his emails, a human who's lost their memory, a system that behaves perfectly but has nothing it's like to be, whatever else you think earns a spot — plus the distinctions it mustn't collapse (being a person vs. being treated as one, being a counterfeit vs. being the real thing, having interests vs. claiming them), and the results from the science it can't contradict. Say which requirements are non-negotiable and which are just what one camp happens to want, and flag any pair you reckon can't both be met — honestly that's the part I most want. One line each, at the end, on how the behavioural, the biological and the social-role views do against the list. British English please, it's going on the UK site, and keep it tight, I'm on deadline.
