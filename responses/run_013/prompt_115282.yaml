  First, I need to predict the top objections from each audience member. The semanticists will likely challenge the rejection of truth conditions and point to embedding data. The probabilist will focus on technical loopholes in the triviality proof. The epistemologist will question the belief-revision argument, while the grad students will attack compound conditionals. 

