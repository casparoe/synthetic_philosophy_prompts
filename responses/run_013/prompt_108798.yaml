answer: |-
  ### Exam Question (245 words)

  **Define:**  
  - *Ignition*: A mental content becomes conscious by winning competition for the global workspace, leading to sustained amplification and broadcast to a "consumer" network (e.g., memory, reporting systems).  
  - *Prevalence*: A content influences multiple downstream systems weakly and in parallel *without* winning workspace competition or amplification (e.g., faint, distributed activation).  
  - *Silent ignition*: A content ignites (full broadcast occurs) but pathways for reporting or acting are severed/masked, preventing external indication.  

  **Question:**  
  A theorist claims Global Workspace Theory (GWT) explains *access* consciousness (availability for use) but not *phenomenal* consciousness (subjective experience). For this theorist:  
  (a) Could prevalent contents (without ignition) be phenomenally conscious? Why/why not?  
  (b) Could silently ignited contents be phenomenally conscious? Why/why not?  

  Defend your *own* view on whether GWT’s ignition criterion successfully marks phenomenal consciousness. Crucially, address this problem: All evidence for consciousness relies on report/action, which ignition enables. Does this create circularity when testing if ignition correlates with experience? Use the tension between access and phenomenal consciousness ("overflow") to structure your argument.  

  ---

  ### Model Answer (795 words)  

  The theorist treating GWT as solely an access theory must deny that *prevalence without ignition* supports phenomenal consciousness. Prevalence involves weak, parallel influence on consumer systems—like background whispers in a crowd. Crucially, it lacks the integrated, stabilized broadcast that ignition provides. Since this theorist equates GWT with access (availability for global control), and prevalence is inherently *unavailable* for focused report or deliberation (it’s diffuse and unamplified), it cannot satisfy even the access conditions. Phenomenal consciousness, for this view, might theoretically "overflow" access—being present without global availability—but prevalence offers no functional signature to detect such overflow. Without ignition’s coherent broadcast, there is no mechanism to *distinguish* prevalent states from unconscious processing. Thus, the access-only theorist must conclude prevalent contents lack phenomenality: they fail as access carriers and provide no evidence of experience.  

  For *silent ignition*, the access-only theorist faces a dilemma. Silent ignition involves full ignition (broadcast to consumers) but severed outputs for report/action. The theorist could argue that phenomenality *requires* functional access *potential*—even if outputs are blocked. Here, ignition ensures content is *poised* for use (e.g., in memory or reasoning systems), meeting GWT’s access conditions. Phenomenality would thus survive, as access is defined by workspace mobilization, not outward expression. However, this strains the access/phenomenal distinction. If ignition enables access and phenomenality co-occurs, why insist GWT is *only* about access? The alternative is to deny phenomenality in silent ignition, claiming report is necessary for experience. But this conflates evidence *for* consciousness with consciousness itself—a mistake Block’s overflow critique warns against. The access-only stance risks incoherence: it must either admit ignition supports phenomenality or implausibly tether experience to output mechanisms.  

  **My view** is that GWT’s ignition *does* mark phenomenal consciousness, but validating this faces a methodological circularity rooted in "overflow." Ignition is proposed as a neural correlate of both access *and* experience. Yet all evidence for experience depends on reports/actions, which require ignition to mobilize output systems. This creates a loop: we "confirm" ignition’s link to phenomenality via report, but report presupposes ignition. Overflow—the idea that phenomenality can exceed access—exposes this. Consider silent ignition: if a content ignites but cannot be reported (e.g., due to temporary output masking), is it conscious? If we assume only reportable states are conscious, we rule out overflow by fiat. But Block’s overflow argument (e.g., rich visual experience fading before full access) suggests phenomenality *can* exist without reportable access. Silent ignition might thus harbor unreportable experience.  

  GWT can respond by redefining "access" *as* broadcast to consumers (including *internal* systems like episodic memory), not just external report. Silent ignition still allows "access" in this broad sense—content is globally available for *internal* use—which may suffice for phenomenality. For example, in attentional blink paradigms, a masked stimulus might ignite fleetingly, influencing later behavior without conscious report, suggesting "access-lite" phenomenality. This reframes ignition as necessary *and* sufficient for experience. Prevalence, conversely, cannot support phenomenality because its parallel, weak activation lacks integration. Disintegrated processing (e.g., subliminal priming) shows no behavioral or neural signs of subjectivity.  

  The circularity is mitigated by converging evidence. While report is primary, we can probe implicit effects of silent ignition (e.g., neural activity patterns in prefrontal cortex during masking) or subjective measures (e.g., confidence ratings without overt report). If these correlate with ignition but not prevalence, it supports ignition’s experiential role. Still, overflow pressures GWT: if phenomenality exceeds even *broadcast* access (e.g., in high-capacity sensory buffers), silent ignition might underrepresent experience. Yet GWT’s "all-or-none" broadcast plausibly matches the discrete, unified character of consciousness. Prevalence’s parallel murmurs resemble the unconscious—fragmented and unavailable.  

  Ultimately, ignition succeeds as a marker of phenomenality because it delivers the integration and stability central to experience. The access/phenomenal distinction, while valid, collapses *operationally* under GWT: ignition’s broadcast *constitutes* the functional access that makes experience reportable, and its architecture aligns with the unity of phenomenality. Overflow concerns highlight epistemic limits, but not a flaw in GWT’s mechanism.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-hit points** (Aim for these; marks deduct for omissions/missteps):  
  1. **Defines Block’s distinction & GWT’s scope** (3 marks): Clear contrast: access (availability) vs. phenomenal (experience); GWT as access-focused. *Common miss: Conflates terms or misstates Block/GWT positions.*  
  2. **Access-only view on prevalence/ignition** (6 marks): For prevalence—denies phenomenality (lacks access conditions); for silent ignition—either denies phenomenality (prioritizes report) or accepts it (broadcast = access potential). *Common miss: Fails to derive both implications from access-only premise.*  
  3. **Silent ignition’s challenge** (6 marks): Identifies tension—if ignition enables access, why deny phenomenality? Uses overflow to show report-dependence risks circularity. *Common miss: Treats silent ignition as merely "unreportable" without linking to overflow/methodological loop.*  
  4. **Methodological circularity** (5 marks): Notes all evidence relies on report → ignition, creating validation problem. *Common miss: Mentions circularity but doesn’t tie to report’s role in evidence-gathering.*  
  5. **Position + resolution** (5 marks): Defends a coherent view (e.g., ignition = phenomenality; prevalence ≠ phenomenality); addresses circularity via converging evidence/broadcast definition. *Common miss: Assertion without engaging circularity/overflow.*  

  **A vs. B separator**: An A answer **resolves the circularity** (e.g., by proposing how silent ignition *could* be validated indirectly, or redefining access to include internal broadcast). A B answer identifies it but lacks resolution.  

  **Cap at bottom range (≤10/25) if**:  
  - Misdefines ignition/prevalence/silent ignition (e.g., calls prevalence "weak ignition").  
  - Claims GWT *directly* addresses phenomenality without argument.  
  - Omits Block’s distinction or the overflow concept entirely.
