answer: |-
  The legal and ethical sorting of deception you describe reveals a sophisticated, context-dependent ethical framework that cannot be reduced to a single theory. Here’s a reconstruction of its implicit logic, tested against philosophical alternatives:

  ### Core Presuppositions of the Practice
  1. **Relational/Role-Based Duty Theory**:  
     - **Presupposed**: Truthfulness is owed *to specific parties* based on **institutional roles and relationships**, not universally.  
     - *Evidence*:  
       - Police may deceive suspects (adversarial role) but not courts (fiduciary role).  
       - Physicians owe limited disclosure to patients (therapeutic relationship) but full truth to medical boards (regulatory duty).  
       - Insurers hold a right to full disclosure (contractual asymmetry), unlike typical buyers/sellers.  
     - *Strict Accommodation*: All cases fit this view. A Kantian duty to *all* rational agents cannot explain permissible lies to suspects or attackers.

  2. **Consequentialist Weighting**:  
     - **Co-Existing Presupposition**: Outcomes justify deception when harms (e.g., violence, psychological trauma) outweigh systemic costs.  
     - *Evidence*:  
       - Therapeutic privilege (preventing despair) and misleading attackers (saving lives) prioritize immediate welfare.  
       - Forbidding perjury protects judicial integrity—a high-stakes systemic consequence.  
     - *Limitation*: Consequentialism *alone* fails to explain why lying to a regulator is worse than lying to a suspect absent differing outcomes.

  3. **Right-to-Truth Theory**:  
     - **Implied but Incomplete**: Some parties (courts, patients, insurers) hold stronger claims to truth based on vulnerability or institutional necessity.  
     - *Evidence*:  
       - Patients have a right to prognosis *unless* harm outweighs autonomy (therapeutic privilege as exception).  
       - Courts’ right to truth is near-absolute to maintain legitimacy.  
     - *Failure*: Sales puffery is permitted despite buyer vulnerability; the theory doesn’t fully explain this asymmetry without role-based markers (e.g., caveat emptor norms).

  ### Nuances & Philosophical Gaps
  - **Necessity: Justification vs. Excuse**:  
    - **Self-defense deception** is treated as *justified* (right act).  
    - **Therapeutic privilege** is arguably *excused* (wrong but blameless due to circumstances).  
    - **Police deception** is *authorized* by role, not necessity—suggesting institutional permission trumps universal wrongness.  

  - **Lying vs. Misleading**:  
    - The practice **ignores Kant’s distinction**. Legally, "misdirection" of an attacker is still a lie but exempt. Fraud requires *material* falsehoods, not technical lies. The sorting relies on **context and harm**, not truth-acts.  

  - **Impersonal Rules?**:  
    - **No**: The pattern requires relational duties. An impersonal "reliability of communication" rule (e.g., for courts) cannot explain why *the same lie* (e.g., "I didn’t see the victim") is excused for a civilian confronting an attacker but criminal for a witness under oath.  

  - **Underdetermined Areas**:  
    - **Sales puffery** fits both consequentialism (market efficiency) and role-relationalism (buyer’s duty to vet).  
    - **Therapeutic privilege** fits role-based duties (doctor as healer) and consequentialism (avoiding harm). Rival theories converge here.

  ### Theory Replacement: Consequences
  - **Under Kantian Absolutism**:  
    - *Falls*: Police/interrogator lies, therapeutic privilege, sales puffery (all intrinsically wrong).  
    - *Survives*: Misdirecting attackers (if deemed non-deceptive "resistance"), but *only* if no false assertion is made—Kant’s strict view might condemn even this.  

  - **Under Straightforward Consequentialism**:  
    - *Collapses*: Role-based distinctions. Police lying to suspects might be forbidden if it risks false confessions; therapeutic privilege might expand or shrink based purely on outcome studies; perjury’s severity would depend solely on conviction error rates.  

  ### A Coherent Unifying View?  
  The practice **resists reduction** to a single principle but can be seen as **"Institutional Teleology"**:  
  - Truthfulness duties derive from the **purpose of institutions** (justice, health, commerce, safety).  
  - Lies are forbidden when they **corrupt core institutional functions** (courts: truth-seeking; medicine: record-keeping).  
  - They are permitted when they **fulfill institutional goals** (policing: obtaining confessions; medicine: healing).  
  - **Self-defense** is a non-institutional exception grounded in fundamental rights preservation.  

  This view is *coherent* but not *monistic*—it accepts plurality in institutional purposes. It explains the patchwork as more than a truce: it is a **functional differentiation of truth-duties** based on social roles and systemic necessities. Yet it remains vulnerable to critiques of institutional overreach (e.g., when police deception enables abuse).  

  **Final Point**: The practice is philosophically stable only if one accepts that *truth-telling is a derivative duty*—subordinate to roles, relationships, and consequences—rather than a categorical imperative. Its resilience suggests this contextualism reflects deeply embedded social intuitions about the limits of truth.
