prompt: |-
  Ok so this has been bugging me for a while and I finally want someone to think it through properly. In Switzerland a popular initiative can rewrite the federal constitution: you collect 100k signatures, and if a majority of voters and a majority of the cantons both say yes, it goes in the constitution. The cantons each count as one in that second majority, so a yes vote in some tiny canton ends up weighing far more than a yes in Zurich. At the same time the Federal Supreme Court basically won't strike down a federal statute for being unconstitutional, it can review cantonal law but not what parliament itself enacts. And yet the one thing the people apparently can't vote for is an initiative that violates peremptory international law, something authorizing torture or genocide, those can be declared invalid before they even reach a ballot. So: the people can rewrite the supreme law, no court gets to check parliament against that same supreme law, but there is this floor the people can't go under no matter what they vote for. (For contrast, the mirror image is Germany, powerful constitutional court, essentially no federal referendums.)

  What I want is the implicit theory, not a summary of what the institutions do. What view of popular sovereignty or constituent power does that package presuppose? Does it require believing the people are the only legitimate source of law and can never be bound by their own earlier constitution, or is that just one reading? Does the double majority presuppose a different demos, i.e. that the political community is a union of cantons rather than one body of equal citizens, and is that consistent with still calling the result a democratic majority? And is the jus cogens floor consistent with the rest or is it an imported foreign element, a bit of natural law smuggled into a system that otherwise denies any higher law above the voters? Tell me which parts the arrangement strictly presupposes and which it merely fits nicely with, and where it's underdetermined, so that two or three different theories would license the exact same institutions. Then tell me what would have to change if you replaced the presupposed view with its main rival (say the constitution as higher law that binds even the people who made it, or the court as guardian of that higher law) — would the pieces come apart, or could you keep them and just reinterpret them?

  One thing: separate whats actually settled from whats genuinely contested among people who know Swiss constitutional law and democratic theory, and dont hand me a contested reading as if it were the consensus. You dont need to cite anyone and please dont invent readings of named authors, just do the reconstruction.
reasoning: |-
  Alright, let me try to unpack this user's query. They're asking about the implicit theory behind Switzerland's constitutional setup. The user mentions three key elements: popular initiatives that can amend the constitution, the double majority requirement (both popular and cantonal), and the jus cogens floor that prevents certain initiatives from even reaching the ballot. They want to understand the underlying principles of popular sovereignty and how these pieces fit together.

  First, I need to recall the basics of Swiss constitutional law. The popular initiative process allows citizens to propose amendments by collecting signatures. The double majority ensures that not only the majority of citizens but also the majority of cantons approve. This design reflects a balance between direct democracy and federalism. The role of the Federal Supreme Court is limited; it can't review federal laws for constitutionality but can strike down cantonal laws. However, initiatives violating jus cogens norms like torture or genocide are invalidated pre-ballot by other bodies, not the court.

  The user is interested in the theoretical foundations. They mention concepts like popular sovereignty, constituent power, and the demos. The double majority suggests that Switzerland views itself as a union of cantons, not just a single national demos. This federal aspect means that smaller cantons have more weight, challenging the idea of equal individual votes. But is this still democratic? It aligns with a federal understanding where both people and cantonal entities must consent.

  The jus cogens exception is tricky. How does a system that emphasizes the people's ultimate authority incorporate international law as a limit? It seems like an external constraint on popular sovereignty. The justification here might be that certain norms are so fundamental that they override even the people's will, perhaps rooted in natural law or universal human rights. Yet, this is in tension with the principle that the people are the supreme constituent power.

  The user also wants to know which parts are settled and which are contested. In Swiss legal theory, the double majority's role in representing the federal structure is well-established. The pre-ballot review for jus cogens is accepted, but its basis is debated—whether it's a legal necessity or a political safeguard. The limited judicial review of federal laws is a conscious choice to prioritize parliamentary sovereignty, though there's ongoing debate about introducing some form of constitutional review.

  They ask about replacing the underlying theory. If Switzerland adopted a German-style model with a strong constitutional court, the popular initiative might face judicial review post-enactment. The double majority could remain as an amendment hurdle, but the court could invalidate initiatives post-passage. The jus cogens floor might shift from pre-ballot review to being part of the court's assessment. This would fundamentally alter the system by introducing a guardian of the constitution above the people's direct will.

  The user's deeper need seems to be understanding how different democratic models reconcile popular sovereignty with constraints. They might be exploring tensions between direct democracy and rights protection, or federalism versus unitary democracy. They also might be interested in how legal systems integrate international norms without undermining domestic sovereignty. Highlighting the contested areas like judicial review and the basis of jus cogens limits addresses their request to separate settled from debated aspects.
answer: |-
  Here's a reconstruction of the implicit theoretical foundations and tensions within the Swiss constitutional package, separating settled principles from contested interpretations:

  **Core Presuppositions (Settled):**

  1.  **Popular Sovereignty as *Constituent Power*:** The ultimate source of constitutional authority rests with the people (the *pouvoir constituant*). They are not permanently bound by prior constitutional formulations. The initiative process is the direct exercise of this power. This presupposes that the people *can* fundamentally rewrite their own supreme law.
  2.  **The Federal Demos:** Switzerland is conceived as a union of pre-existing sovereign communities (the cantons), not merely as a unitary nation of equal individual citizens. The double majority (popular *and* cantonal) explicitly embodies this:
      *   *Popular Majority:* Represents the collective will of the citizenry as a single political body.
      *   *Cantonal Majority:* Represents the will of the constitutive *member states* of the federation, acknowledging their distinct political identities and original sovereignty. This *is* democratic within a federal theory of the state, where legitimacy requires consent from *both* the national populace *and* the constituent units. It prioritizes the federal compact over pure majoritarian equality among individuals.
  3.  **Parliamentary Sovereignty (within the Constitution):** The Federal Assembly is the supreme *ordinary* state organ. The lack of judicial review of federal statutes presupposes that:
      *   Parliament is the most legitimate interpreter and applier of the *existing* constitution in day-to-day lawmaking.
      *   Conflicts between statute and constitution are best resolved politically (by the people via referendum if necessary, or by Parliament amending the law/constitution) rather than judicially.
      *   This reflects a deep trust in the political process and a concern about judicial overreach into the legislative domain.
  4.  **Jus Cogens as an External Absolute Floor:** The invalidity of initiatives violating peremptory international law (jus cogens) presupposes:
      *   That certain fundamental norms (prohibiting genocide, slavery, torture, etc.) exist independently of any single state's constitutional order and are binding on *all* states as a matter of international legal order.
      *   That even the Swiss *pouvoir constituant* cannot validly exercise its power in a way that violates these universal norms. This acts as a *limitation* on constituent power derived from an external source (international law/natural law).

  **Compatible But Not Strictly Required (Underdetermined):**

  1.  **The Nature of the Constitution:** The system *fits* a view of the constitution as a *framework agreement* and *political program* rather than a rigid higher law primarily designed for judicial enforcement against the legislature. However, it doesn't *strictly require* rejecting the idea of a constitution as higher law; it just locates enforcement differently (politically, via referendum).
  2.  **The Basis for Jus Cogens:** The system *fits* both a strong positivist view (Switzerland is bound by its treaty obligations and customary international law containing jus cogens) and a natural law view (these norms are inherent and universal). The settled part is the *effect* (invalidity of violating initiatives), not the ultimate philosophical *justification*. The "smuggled natural law" critique is a *contested interpretation*, not settled doctrine.

  **Key Tensions & Contested Areas:**

  1.  **Constituent Power vs. Jus Cogens:** This is the most profound tension. The core theory of unfettered popular constituent power clashes with the external limitation of jus cogens. **Contested:** Is jus cogens a *legal* limitation inherent in the international legal order Switzerland participates in (a positivist view), or is it a *moral* limitation on sovereignty itself (a natural law view)? The *practical effect* is settled (invalidity), but the *theoretical reconciliation* remains debated by scholars. Some see it as a necessary exception; others see it as a fundamental challenge to pure popular sovereignty.
  2.  **Scope of Pre-Ballot Review:** While the jus cogens floor is settled, **contested debates exist** about whether other implicit constitutional principles or fundamental rights *could* justify pre-ballot review, or if review should be strictly limited to jus cogens. Is the "rule of law" or "human dignity" implicit in the constitution a basis for wider review? Most scholars and practice lean towards strict limitation to jus cogens and procedural defects, but the boundary is tested.
  3.  **Judicial Review's Future:** The lack of review of federal statutes is a deliberate choice, but its *wisdom* and *permanence* are **genuinely contested**. Proponents argue it protects democracy and federalism; critics argue it leaves rights insufficiently protected against parliamentary overreach. Debates periodically arise about introducing partial review, especially concerning fundamental rights.

  **Replacing the Core Presuppositions (Theoretical Experiment):**

  *   **Replace with German-Style Constitutional Supremacy & Judicial Guardianship:**
      *   **Popular Initiative:** Would likely be subject to *post-enactment* constitutional review by a powerful court. The people could still initiate changes, but the court would have the final say on compatibility with *existing* core constitutional principles (beyond jus cogens). The *pouvoir constituant* exercise would be constrained *after* the vote by the *pouvoir constitué* (the constituted court).
      *   **Double Majority:** Could remain as an *amendment hurdle*, but the court's review would operate *above* this political process. The federal principle (cantonal majority) would be balanced by a national judicial guardian.
      *   **Parliamentary Sovereignty:** Would vanish. Parliament's laws would be subject to judicial review for constitutionality. The court, not Parliament, would be the primary interpreter.
      *   **Jus Cogens Floor:** Would likely be *absorbed* into the court's conception of the constitution's "unamendable core" or fundamental rights, enforced *post-enactment*. Pre-ballot review might become less crucial or handled differently.
      *   **Result:** The pieces *come apart*. Direct popular constituent power is significantly curtailed by judicial review. Federalism (double majority) remains a political hurdle but is overarched by a national judicial authority interpreting a constitution seen as binding even on the people. The system prioritizes the constitution as higher law enforced by judges over parliamentary and popular political supremacy.

  **Conclusion on the Swiss Implicit Theory:**

  The Swiss system presupposes a **radical, federalist conception of popular sovereignty:** the people (*as a national body and as cantonal communities*) are the supreme constituent power, capable of rewriting their constitution directly. This power is exercised politically, not judicially constrained post-enactment. Parliament, as the ordinary sovereign, is trusted within this constitutional framework. The double majority is fundamental, defining the Swiss *demos* as a federal union. The jus cogens floor is the critical, tension-inducing exception, importing an absolute external limit on even this supreme popular power, justified by the universality of those norms within the international legal order Switzerland accepts. While the *existence* of this limit is settled, its precise theoretical foundation and its relationship to pure popular sovereignty remain areas of scholarly discussion and potential evolution. The system fundamentally prioritizes political democracy and federalism over judicial guardianship of a higher law against the people themselves.
