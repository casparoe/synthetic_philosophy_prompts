answer: |-
  ### Analyzing *12 Angry Men* Through the Lens of Information Cascades  
  *(Model: Sequential decisions, private signals, public actions, rational herding)*  

  **1. The First Vote & Secret Ballot: Breaking the Logjam**  
  The film’s initial 11-1 "guilty" vote *is* a potential cascade trigger. Juror 8’s lone dissent is rational in the model’s terms: his private signal (reasonable doubt) outweighs the *public* signal of 11 votes, but he lacks enough strength to flip others yet. The **secret ballot** is critical: it surfaces Juror 9’s "not guilty" vote, which was *invisible* in prior public votes. This mirrors the model perfectly:  
  - **Public sequential voting**: Jurors see only outcomes (e.g., 10-2 after Juror 9’s public flip). This creates social pressure to conform (Juror 5 hesitates to join Juror 8 until the secret ballot).  
  - **Secret ballot**: Allows private signals (Juror 9’s doubt) to emerge without reputational cost, halting the cascade.  
  **Film vs. Model**: The first act *is* a cascade-in-the-making. The secret ballot acts as a "simultaneous reveal" mechanism, circumventing sequential herding.  

  **2. Order of Flips: Cascade or Deliberation?**  
  The model assumes decisions are *only* based on prior actions + private signals. The film’s flips, however, are driven by **new public evidence**:  
  - Knife reenactment (Juror 5), train noise timing (Juror 6), eyewitness credibility (Jurors 2, 4, 11).  
  - Non-informational factors: Shame (Juror 3’s bigotry exposed), fatigue (Juror 12), empathy (Juror 9).  
  **Is this a cascade?** **No**—in the technical sense. The model has no "deliberation" channel; it’s silent on *how* information aggregates beyond actions. The film shows **deliberation as an antidote to cascades**:  
  - Jurors share *reasons*, not just votes. This updates the *public information set*, allowing others to reweight their private signals.  
  - **Key difference**: In the model, a cascade freezes information aggregation. Here, deliberation *unfreezes* it by making private signals public.  

  **3. Juror 8: Hero or Irrational Maverick?**  
  The model would brand Juror 8’s initial dissent **irrational**: his private signal (doubt) is weak, and defying 11 votes risks a grave error (execution). The film "cheats" by validating his hunches retroactively. **But it earns his dissent in two model-adjacent ways**:  
  - **Strategy, not signal**: He demands deliberation ("I just want to talk"), leveraging institutional rules (unanimity) to *force* information sharing. This is rational if he suspects *others* have unrevealed doubts.  
  - **Reasonable doubt as a meta-signal**: His stance isn’t "innocent" but "we lack certainty." The model ignores such epistemic thresholds, but it’s defensible as a low-cost demand for more evidence.  
  **Verdict**: The film oversells his intuition but correctly shows that breaking cascades requires institutional tools (e.g., the right to demand discussion).  

  **4. Mixed Motives: How Herds Shatter**  
  The model assumes homogenous, rational agents. The jurors are **heterogeneous**:  
  - *Informational*: Juror 4 (analytical), Juror 11 (civic-minded).  
  - *Non-informational*: Juror 7 (baseball tickets), Juror 3 (emotional trauma), Juror 10 (bigotry).  
  **Impact on cascades**:  
  - Non-rational actors **amplify cascades** (e.g., Juror 10’s racism speeds up early "guilty" votes).  
  - But heterogeneity **helps break herds**:  
    - Juror 9 flips due to *admiration* for Juror 8’s courage (not evidence).  
    - Juror 3’s breakdown exposes emotional bias, freeing others to defect.  
  **Practical lesson**: Breaking real-world cascades requires addressing *both* information and psychology (shaming bias, rewarding honesty).  

  **5. The Institution: Procedure vs. Veto**  
  Unanimity, secret ballots, and forced confinement are **cascade-breaking mechanisms**:  
  - **Unanimity**: Prevents early consensus, forcing minority signals to surface. It’s not a "veto" but a **bulwark against informational free-riding** (e.g., Juror 7’s quick "guilty" vote).  
  - **Secret ballot**: Decouples private belief from public action, reducing herding incentives.  
  - **Confinement**: The hot room raises the cost of deadlock, incentivizing truth-seeking.  
  **Model relevance**: Unanimity aligns with the theory—it raises the threshold for cascade formation, allowing weaker signals to matter.  

  ---

  ### What the Film Adds: Beyond the Model  
  **The model’s limit**: It describes *how* cascades form but not *how to break them* in real groups. The film shows:  
  1. **Deliberation as information technology**: Unlike the model’s silent actors, jurors *talk*. This transforms private signals into public knowledge, resetting the cascade.  
  2. **Emotion and identity**: Cascades break when personal experiences (Juror 3’s son, Juror 5’s slum background) override herd logic.  
  3. **Leadership matters**: Juror 8 doesn’t just "defy"; he *orchestrates* deliberation, creating a new information-sharing norm.  
  4. **Fragility is human**: The cascade breaks not from a lone signal but from accumulated doubt, social pressure, and institutional friction.  

  **Conclusion for Your Students**:  
  The film and model are complementary. The model explains *why* the initial 11-1 vote is stable and why the secret ballot disrupts it. But the film shows that **real herding is multi-dimensional**—broken by *deliberation*, not just Bayesian updating. In practice, preventing bad cascades requires:  
  - Institutions that force information sharing (secret ballots, unanimity).  
  - Space for dissenters to *lead* discussion, not just dissent.  
  - Acknowledging that motives aren’t purely rational—and leveraging that.  

  This fits rational choice: actors *are* Bayesian, but with richer priors (biases, emotions) and tools (deliberation) the model excludes. The film’s answer to cascades isn’t "one hero" but **a process that converts private doubt into public truth**.
