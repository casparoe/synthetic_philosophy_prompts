  For the first point, the initial vote is public except for Juror 8's dissent. The second vote is public and stuck at 10-2. The secret ballot then reveals Juror 9's switch, which is unexpected. This mirrors the model: public votes create social pressure, while secret ballots allow private signals to emerge. The film shows how public sequential voting can suppress information, but the secret ballot interrupts that.

