prompt: |-
  I'm a philosophy professor and I've somehow ended up running a small working group next term on how moral norms actually change -- the Williams-style provocation that the case against slavery was more a symptom of the thing collapsing than the cause of it, Appiah's honor stories about dueling and footbinding, that whole neighborhood. Three PhD students, one semester, weekly meetings, and the agenda is mine to set, so I'm asking you to set it for me.

  What are the live open questions here, and which two or three would you actually put the group's effort into? I'm less interested in the list than the reasoning: which questions are upstream of which others, which are tractable for people who work with texts and arguments rather than in a lab or an archive, and which are only appealing because they're fun to argue about at a bar. Tell me what would move something up or down the ranking -- what argument or bit of evidence would change your mind about the ordering.

  One thing I really want from you: seperate what's actually settled among people who know this literature from what's genuinely contested, and don't sell me one camp's position as the consensus. If the honest answer is that a question everyone treats as open is basically closed, or vice versa, say so.
reasoning: |-
  Okay, let me start by really unpacking what this philosophy professor needs. They're setting up a working group on how moral norms change, inspired by thinkers like Bernard Williams and Kwame Anthony Appiah. The focus is on the mechanisms behind moral change rather than normative ethics. They have three PhD students for one semester of weekly meetings. The professor wants me to craft an agenda focusing on live, open questions that are tractable for text-based work, prioritizing those that are foundational and can be effectively tackled in this setting.

  First, I need to identify the key areas of debate in moral change literature. Williams' point about slavery collapsing before the moral arguments gained traction suggests structural factors overpowering philosophical discourse. Appiah's work on honor shifting in footbinding and dueling points to social reputation and identity. Then there's the materialist vs. culturalist tension—do economic changes drive moral shifts, or do ideas and arguments play a causal role? 

  Sorting what's settled versus contested is crucial. For example, it's settled that moral changes involve multiple factors; monocausal theories are insufficient. But the hierarchy of these factors is hotly debated. Another settled point is that elite advocacy alone doesn't effect change—Grassroots adoption matters. Yet the exact interplay between institutional power and cultural shifts remains contested.

  The professor emphasized avoiding selling one camp's view as consensus. So I should note where there's genuine disagreement, like whether arguments are symptoms or causes. For instance, Haidt's social intuitionist model downplays reasoned arguments, while others like Pinker see them as catalysts once conditions ripen. 

  Tractability for text-based work means focusing on questions where analyzing philosophical texts, historical narratives, or case studies is feasible. Lab or archival work isn't an option, so questions requiring empirical data collection are out. Instead, examining how arguments are framed in historical debates or the role of rhetoric in moral revolutions would be suitable.

  Upstream questions are those that underpin others. For example, understanding the relationship between material conditions and normative reasoning is foundational. If material shifts create the space for arguments to gain traction, that affects how we analyze specific movements. Another upstream question is the role of emotions versus rational discourse. If emotions like disgust or empathy are primary drivers, then the analysis of philosophical texts must consider how they engage these emotions.

  Prioritizing three questions involves weighing their centrality and tractability. The materialist-culturalist interface is upstream because it influences all case studies. The efficacy of moral reasoning is also core—can arguments cause change or merely reflect it? The third could be the role of disruptive events, which is contested but text-friendly through historical analysis.

  What would change my prioritization? If new evidence showed moral arguments consistently precede structural change, that would elevate the reasoning question. Conversely, if studies demonstrated material shifts always predate normative shifts, the materialist angle gains weight. The professor’s interest in distinguishing settled from contested areas means clearly stating where debates are unresolved, like whether elite rhetoric or grassroots sentiment is more pivotal in tipping points.
answer: |-
  Based on your constraints (text/argument focus, PhD seminar depth, Williams/Appiah neighborhood, separating settled/contested, prioritizing upstream/tractable questions), here's a breakdown and proposed agenda:

  **The Lay of the Land: Settled vs. Contested**

  1.  **Settled (Broad Consensus):**
      *   **Multi-causality:** Moral change is *never* monocausal. Philosophers, historians, and social scientists agree it involves complex interactions between material conditions, institutions, ideas/rhetoric, social structures, emotions, contingent events, and agency (both elite and grassroots).
      *   **The Limits of "Pure Reason":** Williams' core provocation is widely accepted as *corrective* to naive Enlightenment rationalism. Moral arguments alone, presented as syllogisms, are insufficient to explain large-scale normative shifts. Their *reception* depends heavily on context.
      *   **The Importance of Non-Cognitive Factors:** Appiah's "honor" (social standing, reputation, identity) and Williams' "confidence"/"reflection" point to settled ground: emotions (disgust, empathy, shame), social identity, perceived self-interest, and changing conceptions of status/purity are critical drivers, not just rational deliberation.
      *   **The Role of Disruption:** Significant moral change is often linked to broader societal disruptions (economic shifts, technological change, war, revolution, demographic shifts) that destabilize existing justifications and power structures supporting the old norm.
      *   **Elite Advocacy ≠ Sufficient Cause:** While elites play roles (articulating arguments, leveraging institutions), their advocacy doesn't guarantee change. It requires broader social uptake and alignment with other forces. Grassroots mobilization is often crucial.

  2.  **Genuinely Contested (Live Debates):**
      *   **Primacy/Weighting of Factors:** *This is the core upstream debate.* What is the relative causal weight and typical sequence of:
          *   Material/Structural Shifts (e.g., industrialization undermining slavery's economic logic)?
          *   Cultural/Ideational Shifts (e.g., evolving concepts of personhood, rights, empathy)?
          *   Institutional Change (e.g., laws, enforcement mechanisms)?
          *   Agency & Rhetoric (e.g., social movements, framing, charismatic leadership)?
          *   Is there a generalizable hierarchy or sequence, or is it entirely case-specific?
      *   **The Efficacy of Moral Reasoning/Rhetoric:** *The central philosophical tension.*
          *   **Contention:** Are moral arguments/rhetoric primarily **symptoms** reflecting underlying shifts (Williams' strong provocation), **catalysts** that accelerate change when conditions are ripe, or **autonomous causes** capable of *initiating* shifts even against prevailing material/structural currents (a more Habermasian or deliberative democratic view)? Can arguments *create* the "conditions of ripeness"?
      *   **The Nature of "Tipping Points":** What specific mechanisms drive cascading change once a norm is destabilized? Is it primarily changing calculations of cost/benefit and enforcement (rational choice), shifting social perceptions of normalcy/approval (social proof/information cascades), emotional contagion (empathy, outrage), or coercive institutional power?
      *   **The Role of "Moral Entrepreneurs":** Under what conditions can deliberate actors (movements, intellectuals, reformers) effectively reshape norms? What strategies are most effective (framing, coalition-building, leveraging existing values, creating new institutions) and *why*? Is their success primarily dependent on aligning with deeper currents, or can they sometimes create those currents?
      *   **Universalism vs. Particularism:** How generalizable are models of moral change derived from specific historical cases (like abolition, dueling, footbinding)? Are there fundamental mechanisms common across cultures and eras, or is each change deeply embedded in unique historical contingencies?
      *   **The "Hinge" of Emotion vs. Reason:** While both matter, *how* do they interact? Does changed emotion *enable* the reception of arguments (Haidt's social intuitionist model), or can compelling arguments *reshape* emotional responses over time (Nussbaum-type view)? Is disgust/outrage or empathy the more potent emotional driver for *progressive* change?

  **Prioritizing the Semester: Three Upstream, Tractable Questions**

  Based on upstream importance, tractability for textual/argumentative work, and centrality to the Williams/Appiah provocation:

  1.  **The Materialist-Culturalist Interface: Where Does the Causal "Spark" Ignite?**
      *   **Why Upstream?** This question underpins *everything*. It directly confronts Williams' provocation and forces engagement with the relative weight of structural forces vs. ideas/rhetoric. Answering (or grappling with) this shapes how you approach any specific case.
      *   **Why Tractable?** Perfect for close reading of key theorists (Williams, Appiah, Marx/Engels on materialism, Weber on ideas, later synthesis attempts like Giddens' structuration), comparative case study analysis (e.g., Was abolition driven *more* by economic shifts in Britain vs. ideological shifts influenced by the Haitian Revolution? How did material prosperity interact with feminist ideas for changing marriage norms?). Focuses on interpreting arguments *about* causation using historical narratives as evidence.
      *   **Settled/Contested:** Settled that both matter. **Hotly contested** on primacy, sequencing, and mechanisms of interaction. Materialists point to timing (economic shifts often precede widespread normative shifts). Culturalists point to cases where ideas seem to lead (e.g., impact of Enlightenment thought). Synthesizers argue for complex feedback loops.
      *   **What Would Change My Mind?** A rigorous meta-analysis demonstrating a clear, replicable temporal precedence of one factor type over the other across a wide range of diverse cases would shift the debate significantly. Conversely, deeper historical work showing the *inseparability* of "material" and "cultural" factors in specific instances (e.g., how a new technology *required* new social norms *and* was justified by new ideas simultaneously) would bolster synthesis views.

  2.  **The Efficacy (and Mechanism) of Moral Reasoning: Symptom, Catalyst, or Cause?**
      *   **Why Upstream?** This is the philosophical heart of the seminar. It asks directly: What can philosophy *do* in the world of moral change? Can arguments *cause* shifts, or are they merely epiphenomenal window dressing? This forces deep engagement with the nature of rationality, persuasion, and social epistemology.
      *   **Why Tractable?** Ideal for textual analysis. Examine abolitionist rhetoric (Equiano, Wilberforce, Garrison) – does it *reflect* changing sensibilities or seek to *create* them? Analyze philosophical arguments (Kant on dignity, Bentham on utility applied to slavery) – how were they received, adapted, ignored? Contrast Williams' skepticism with defenders of reason's causal role (e.g., Pinker, perhaps Habermas-inspired scholars). Debate the concept of "reflective equilibrium" as a social, not just individual, process.
      *   **Settled/Contested:** **Intensely contested.** Williams/Appiah camp sees arguments gaining traction only when structural/honor conditions shift. Opponents argue compelling moral framings can *create* dissonance and motivate action even against interests. A possible "consensus-lite": Arguments are necessary but insufficient; they become powerful *catalysts* when they successfully connect with underlying non-cognitive factors (emotion, identity, perceived interest) within a favorable (or destabilized) context.
      *   **What Would Change My Mind?** Strong evidence of moral arguments *directly* causing widespread behavioral/normative shifts *in the absence* of significant prior structural/honor shifts would be revolutionary (and likely contested). More plausibly, evidence showing how specific *rhetorical strategies* (e.g., triggering empathy, reframing honor, exposing hypocrisy) consistently succeed across contexts would bolster the "catalyst"/"skillful cause" view. Conversely, meticulous case studies showing arguments consistently appearing *after* decisive structural/honor shifts had *already* occurred would strengthen the symptom thesis.

  3.  **The Mechanics of Disruption and Cascading Change: How Does the "Dam Break"?**
      *   **Why Upstream?** Understanding *how* destabilization leads to rapid change is crucial for moving beyond identifying factors to modeling the *process*. It links the "why now?" question (often tied to disruption) to the "how so fast?" question, crucial for Appiah's cases (dueling's rapid collapse) and others (sudden shifts in LGBTQ+ rights norms).
      *   **Why Tractable?** Focuses on interpreting historical narratives and social theory texts describing tipping points. Analyze accounts of the collapse of dueling (Appiah), the speed of marriage equality adoption, or the fall of apartheid. Engage with social theory concepts: information cascades (Bikhchandani et al.), threshold models (Granovetter), framing theory (Goffman, Snow & Benford), institutional legitimacy collapse. Debate the role of law vs. social pressure vs. emotional contagion in the cascade.
      *   **Settled/Contested:** **Contested, but with emerging patterns.** Settled that cascades happen and often follow disruption. Contested on the *primary* driver: Is it changing personal cost/benefit calculations due to reduced enforcement/sanctioning? Shifting perceptions of what "everyone else" believes/is doing (pluralistic ignorance breaking)? Powerful emotional responses to focal events? Coercive imposition by new elites? Likely case-dependent, but identifying common patterns is key.
      *   **What Would Change My Mind?** Computational social science models successfully replicating diverse historical tipping points using a specific mechanism (e.g., threshold models) would be powerful. Conversely, detailed historical work showing cascades consistently initiated by specific types of "focal events" (e.g., shocking acts of violence, powerful symbolic acts) that primarily worked through *emotional* contagion rather than rational calculation would shift the emphasis.

  **What Falls Down the Ranking (and Why):**

  *   **Pure Universalism vs. Particularism:** While important, it's often a methodological debate *about* studying change rather than a core mechanism *of* change itself. Can feel abstract and less actionable for this group's focus. (Down due to being less upstream on mechanisms).
  *   **Exhaustive Taxonomy of Factors:** Listing "economics, ideas, institutions, emotions..." is settled ground. The seminar's value is in wrestling with their *interplay*, not reciting the list. (Down due to being settled and less analytically deep).
  *   **Highly Specific Case Debates (e.g., "Was the US Civil War *really* about slavery?")**: Fascinating, but risks getting bogged down in historical detail at the expense of broader theoretical mechanisms. Best used as *illustrations* for the core questions above. (Down due to lack of generality/tractability for philosophical focus).
  *   **Future-Tech Moral Change (AI, etc.):** Speculative and distracts from core historical/theoretical grounding needed for PhDs. (Down due to lack of established literature/texts and tractable analysis).
  *   **"Bar Talk" Favorites:** "Is all moral change just power struggles?" (Reductionist, ignores settled complexity). "Can morality progress?" (Normative, not your descriptive focus). "Are we getting morally better?" (Ditto). (Down due to being either settled-as-overly-simplistic or normative/philosophical in a different direction).

  **Semester Structure Suggestion:**

  *   **Weeks 1-2:** Foundational Frameworks (Williams "Morality", Appiah Chps, key historiography on moral revolutions - e.g., Haskell on Abolition, contrast with Drescher).
  *   **Weeks 3-5:** **Core Question 1 (Materialist-Culturalist Interface)** - Deep dive into theorists and case comparisons.
  *   **Weeks 6-8:** **Core Question 2 (Efficacy of Reasoning)** - Analysis of rhetoric, philosophy, and reception history.
  *   **Weeks 9-11:** **Core Question 3 (Disruption & Cascades)** - Social theory models and historical tipping points.
  *   **Week 12:** Synthesis & Future Directions: How do these answers interact? What does this mean for understanding moral philosophy's role? What open questions remain most pressing?

  This structure forces engagement with the deepest theoretical tensions (upstream questions) using methods suited to your group (textual/historical argument analysis), while respecting the genuinely contested nature of the field. It ensures the Williams/Appiah provocation remains central without accepting it uncritically as the only view. Good luck – it sounds like a fantastic seminar!
