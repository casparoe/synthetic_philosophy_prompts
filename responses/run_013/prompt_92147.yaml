prompt: |-
  I'm in a graduate seminar on the philosophy of the social sciences, and last week we read David Lewis's Convention (1969). I followed the coordination-problem apparatus well enough, but the definition at the center of the book kept sliding out from under me, so I've been more dependent than I'd like on other people's summaries of it. On the walk home from the seminar, a friend of mine who works in game theory gave me his account of the book, and it was so crisp that I've been repeating it ever since; I'd like to check it before it settles into my understanding. What he said, more or less, was this: 'Lewis's basic idea is that a convention is any regularity of behavior that a group shares — queueing, shaking hands, dressing for weddings are all conventions in his sense. What makes it a convention rather than a coincidence is that everyone knows that everyone else does it, and that's enough to keep it going: I do it because I expect you to, you do it because you expect me to, and so we lock in. Since the regularity could have been otherwise — since there was some other thing everyone could have done instead that would have worked just as well — conventions are arbitrary, and that arbitrariness is the heart of the theory. In effect, conventions are solutions to prisoner's dilemmas, and Lewis's deeper contribution was to show that norms can evolve without anyone ever agreeing to them, because the practices that coordinate us better get copied and spread while the others die out.' His conclusion, delivered with some relish, is that Lewis's theory is really a debunking theory of norms: once you see conventions as arbitrary solutions to coordination problems, you see that a great deal of what we experience as morally binding is just a habit that happened to stick, and that any convention could be swapped for its alternative without any real loss.

  I have a nagging sense that this is a competent summary with one or two things quietly distorted, but I can't tell whether my unease is intellectual or just discomfort with where it lands. Could you go through it clause by clause and tell me what Lewis would accept as fair, what is a harmless popularization, and what is a genuine misreading — including whether 'arbitrary' is being used in Lewis's technical sense or in its everyday one? I'd especially like to know whether the move from 'conventions are arbitrary' to 'conventions carry no authority, and moral norms are just conventions that happened to stick' is licensed by anything in the book or is an overreach a careful reader would reject, and whether the evolutionary story about norms is a fair rendering of what Lewis actually offers. No reading list, please — I just want to see where the summary does justice to the view and where it doesn't.
reasoning: |-
  Okay, the user is in a graduate seminar on the philosophy of social sciences and they've been reading David Lewis's "Convention." They followed the coordination-problem part but struggled with the central definition. Their friend, who works in game theory, gave them a crisp summary which they've been using but now suspect might have some distortions. They want me to go through that summary clause by clause to identify what's accurate, what's a harmless simplification, and what's a misreading. They're particularly concerned about the interpretation of "arbitrariness" and whether Lewis's theory debunks moral norms.

  First, I need to recall Lewis's main arguments in "Convention." Lewis defines conventions as solutions to coordination problems where people have common knowledge of each other's actions and preferences. The arbitrariness is key—there must be another possible regularity that could have served the same purpose. The friend's summary seems to capture the basics: shared regularity, common knowledge, and arbitrariness. But the user is worried about the moral debunking part and the evolutionary story.

  Let me break down the friend's summary point by point. The first part about conventions being regularities like queueing or shaking hands is correct. Lewis uses these examples. The next part about everyone knowing everyone else does it refers to common knowledge, which is central to Lewis. The explanation that people continue the convention because they expect others to is also accurate—it's about mutual expectations sustaining the convention.

  Now, arbitrariness. The friend says conventions are arbitrary because they could have been otherwise. Lewis does define arbitrariness as having an alternative that could have worked. But in the summary, "arbitrary" might be conflated with the everyday meaning implying lack of justification. Lewis's technical sense doesn't imply that; it just means there are multiple equilibria. However, the jump to saying conventions carry no authority and moral norms are just habits that stuck—that's not in Lewis. Lewis focused on descriptive conventions, not moral norms. He didn't claim they lack authority; he explained how they persist through expectations.

  The prisoner's dilemma part is a misstep. Coordination problems aren't prisoner's dilemmas. PDs have dominant strategies leading to suboptimal outcomes, while coordination games have multiple equilibria where mutual cooperation is optimal. Lewis used coordination games, not PDs. The friend's error here is significant because it changes the game-theoretic foundation.

  The evolutionary story about norms evolving without agreement is partially right. Lewis does discuss how conventions can emerge without explicit agreement, through precedent or evolution. But he doesn't frame it as "practices that coordinate better get copied." He emphasizes convergence due to salience and precedent, not a Darwinian selection process. So the friend oversimplifies here.

  The debunking conclusion is where the summary goes beyond Lewis. Saying conventions are arbitrary in the technical sense doesn't entail they lack normative force. Lewis didn't extend this to moral norms; he was describing linguistic and social conventions. The friend's relish in presenting it as debunking moral norms is a philosophical leap not supported by the text. The user's unease here is justified—this is an overreach.

  The user's deeper concern might be about the implications for moral philosophy. They might be uncomfortable with the idea that social norms are arbitrary and thus lack inherent authority. But Lewis's work is analytical, not normative. He explains how conventions work, not whether they should be followed. The friend's summary injects a nihilistic view that isn't in Lewis.

  I should highlight these points clearly: correct parts (regularities, common knowledge, mutual expectations), technical vs. everyday "arbitrary," the game theory error (coordination vs. PD), the oversimplified evolution, and the unsupported debunking claim. Emphasize that Lewis's project is descriptive, not debunking. The user needs to know where the summary holds up and where it misrepresents, especially since they're using it for academic purposes. Their unease is intellectual—they spotted the distortions but couldn't pinpoint them. Confirming their suspicions will help them engage more critically with the material.
answer: |-
  Let's dissect your friend's summary clause by clause, using Lewis's actual arguments in *Convention* as the benchmark. While the summary captures the core intuition well, it contains significant missteps, particularly regarding game theory, arbitrariness, and the "debunking" conclusion.

  **Clause-by-Clause Analysis:**

  1.  **"Lewis's basic idea is that a convention is any regularity of behavior that a group shares — queueing, shaking hands, dressing for weddings are all conventions in his sense."**
      *   **Lewis's View:** **Fair, but incomplete.** Lewis absolutely uses these examples. However, his definition is much stricter: a convention is a regularity *R* in behavior among members of a population *P* when they are agents in a recurrent coordination problem situation *S*, such that:
          *   Everyone conforms to *R*.
          *   Everyone *expects* everyone else to conform to *R*.
          *   Everyone *prefers* to conform to *R* *on the condition* that (almost) others do (this is the coordination aspect).
          *   There is a *prevalent preference* for general conformity to *R* rather than slightly-less-than-general conformity (this ensures stability).
          *   ***R* is arbitrary.** This is crucial: there exists at least one other possible regularity *R'* that could have solved the coordination problem *just as well*, and people would have conformed to *R'* and expected others to if they believed *R'* was the convention.
      *   **Verdict:** Harmless popularization initially, but omitting the strict conditions (especially arbitrariness, mutual expectations/preferences, and the coordination problem context) makes it incomplete and potentially misleading.

  2.  **"What makes it a convention rather than a coincidence is that everyone knows that everyone else does it..."**
      *   **Lewis's View:** **Fair, but "knows" is slightly too weak.** Lewis requires *common knowledge*. It's not just that everyone knows *R* occurs. It's that everyone knows *R* occurs, everyone knows that everyone knows, everyone knows that everyone knows that everyone knows, and so on *ad infinitum*. This mutual, iterated knowledge is essential for sustaining the expectations and preferences that define the convention. "Knows" captures the first step but misses the robust, recursive structure Lewis insists on.

  3.  **"...and that's enough to keep it going: I do it because I expect you to, you do it because you expect me to, and so we lock in."**
      *   **Lewis's View:** **Excellent & Precise.** This perfectly captures the core mechanism: the mutual expectations and conditional preferences ("I prefer to do X *if* you do X") create a self-reinforcing equilibrium. Conformity is rational for each individual *given* their expectations about others' conformity. This is the "locking in" Lewis describes.

  4.  **"Since the regularity could have been otherwise — since there was some other thing everyone could have done instead that would have worked just as well..."**
      *   **Lewis's View:** **Precisely Correct Definition of Arbitrariness (Technical Sense).** This is the heart of Lewis's technical definition. Arbitrariness *means* that there exists at least one *alternative equilibrium* that would have solved the coordination problem equally effectively. Driving on the left vs. right, "hello" vs. "hi", specific wedding attire styles – each convention has a viable alternative that *could* have been the convention instead. This is not "arbitrary" in the loose sense of "random" or "unjustified," but in the specific game-theoretic sense of multiple possible stable solutions.

  5.  **"...conventions are arbitrary, and that arbitrariness is the heart of the theory."**
      *   **Lewis's View:** **Fair.** Arbitrariness, defined technically as above, *is* a necessary and defining feature of conventions for Lewis. It distinguishes conventions from solutions driven solely by inherent superiority (e.g., using the sharpest knife) or moral necessity (which Lewis doesn't really address).

  6.  **"In effect, conventions are solutions to prisoner's dilemmas..."**
      *   **Lewis's View:** **Significant Misreading.** This is the most serious error in the summary. **Lewis explicitly bases conventions on *coordination problems*, NOT Prisoner's Dilemmas (PDs).** This is critical:
          *   **Coordination Problem:** Multiple equilibria exist where mutual cooperation is optimal *and* individually rational given expectations of others' cooperation (e.g., meeting at A or B; driving left or right). Conventions solve which *specific* equilibrium is selected.
          *   **Prisoner's Dilemma (PD):** Only *one* equilibrium exists (mutual defection), which is Pareto-inferior (worse for all) than mutual cooperation. Mutual cooperation is *not* stable because each player has an incentive to defect unilaterally. Conventions *cannot* solve PDs in Lewis's framework because PDs lack multiple *cooperative* equilibria. Conventions govern *which* mutually beneficial rule to follow when there are several equally good options; PDs represent a conflict between individual and collective rationality with no stable cooperative solution. Lewis discusses PDs only to contrast them sharply with coordination problems.

  7.  **"...and Lewis's deeper contribution was to show that norms can evolve without anyone ever agreeing to them, because the practices that coordinate us better get copied and spread while the others die out."**
      *   **Lewis's View:** **Harmless Popularization with Oversimplification.** Lewis *does* provide an account of how conventions can arise without explicit agreement, primarily through precedent (a successful coordination creates an expectation for future similar situations) and salience (one option stands out as the obvious choice). He draws an analogy to biological evolution (variation, selection, inheritance) for how conventions might spread. However:
          *   He doesn't frame it solely as "practices that coordinate us *better* get copied." The key is simply that a practice that *succeeds* in coordinating in a salient instance becomes a precedent. It might not be "better" than the alternative *in principle*, just the one that happened to be used successfully first or was most salient in a key instance. "Better" might imply inherent superiority, which contradicts arbitrariness.
          *   He emphasizes mutual expectations, precedent, and salience much more than a Darwinian "copying/spreading" mechanism. The evolutionary analogy is illustrative, not the core explanatory mechanism.

  8.  **"...Lewis's theory is really a debunking theory of norms: once you see conventions as arbitrary solutions to coordination problems, you see that a great deal of what we experience as morally binding is just a habit that happened to stick, and that any convention could be swapped for its alternative without any real loss."**
      *   **Lewis's View:** **Overreach / Misreading.** This conclusion goes significantly beyond Lewis's project and misapplies his concept.
          *   **Scope:** Lewis is explicitly analyzing *conventions*, primarily linguistic ones (meaning, truthfulness, trust) and clear coordination norms (driving, meeting). He is *not* offering a general theory of *all* norms, especially moral norms. Many moral norms (e.g., prohibitions on murder) do not fit the coordination problem/arbitrariness mold – they are not arbitrary (no equally good alternative like driving left), and violating them often doesn't primarily create coordination failure but direct harm or injustice.
          *   **"Just a habit"**: While conventions persist due to expectations (which can feel habitual), Lewis's account is richer, involving rational choice based on common knowledge and conditional preferences. It's not *merely* habit.
          *   **"Arbitrary" ≠ "Lacks Authority/Normative Force"**: Lewis's *technical* arbitrariness (existence of an equally good alternative) **does not imply** that a convention lacks normative force *within the system*. Once established, the convention *does* carry rational authority: you *should* drive on the right (in the US) *because* that's the convention and deviating causes coordination failure (accidents). The force is conditional and coordination-based, not necessarily *moral*, but it's real authority nonetheless. Swapping *could* happen *in principle* if everyone switched simultaneously, but the costs and instability of transition are often high precisely *because* the existing convention carries coordinating authority. Lewis isn't debunking the *authority* of conventions; he's explaining its source (mutual expectations solving coordination problems).
          *   **"Debunking Morality"**: This is a philosophical leap Lewis does not make. He describes a mechanism for certain social regularities. Whether *some* moral norms *are* conventions in his sense (and thus arbitrary) is a further question he doesn't pursue extensively. Concluding that *all* moral experience is "just" arbitrary convention is a substantive (and controversial) philosophical claim far beyond Lewis's analysis. His theory explains *how* certain norms work, not that they are illusory or lack genuine normative weight *within their context*.

  **Summary of Key Distortions:**

  1.  **Game Theory Error:** The conflation of coordination problems with Prisoner's Dilemmas is a major misrepresentation of Lewis's core framework.
  2.  **Oversimplified Evolution:** The "better get copied" narrative oversimplifies Lewis's mechanisms of precedent and salience.
  3.  **Debunking Overreach:** Extending Lewis's analysis of conventions (especially technical arbitrariness) to debunk the authority of *all* norms, particularly moral norms, is a significant philosophical leap not supported by the text. Lewis explains the *source* of conventional normativity (coordination), he doesn't deny its reality or claim it's "just habit." He is primarily descriptive, not normative/debunking.
  4.  **"Arbitrary" Nuance:** While the summary correctly defines arbitrariness technically, the conclusion ("could be swapped without loss") subtly shifts towards the *everyday* meaning (lacking justification/force), which Lewis avoids. Technical arbitrariness doesn't imply lack of functional authority *once established*.

  Your unease is well-founded, primarily intellectual (spotting the game theory error and the debunking overreach), though perhaps amplified by discomfort with the friend's provocative conclusion. Lewis provides a powerful, rigorous analysis of how certain social norms (conventions) emerge and persist through rational expectations and conditional preferences solving coordination problems, emphasizing their arbitrariness in a specific technical sense. However, he does not reduce all norms to this category, debunk their authority, or claim moral norms are merely arbitrary habits. The friend's summary is crisp but glosses over crucial distinctions (especially coordination vs. PD) and pushes Lewis's insights towards a more radical (and unsupported) philosophical conclusion.
