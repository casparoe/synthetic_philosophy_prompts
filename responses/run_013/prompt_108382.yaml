answer: |-
  ## VALUE JUDGMENTS with Dr. Miriam Fisk  
  *Monetary Quandaries? Calculate, Don't Contemplate!*

  **LETTER 1 (Anxious Andy):** *Dear Dr. Fisk, My colleague offered me a single play of the St. Petersburg game for fifty dollars. I know the expected value is supposedly infinite, but honestly? The most I’ve ever seen it pay out is $128 after six heads. Paying fifty bucks just to likely get $2 or $4 feels crazy. Should I hand over the cash? – Hesitant in Hartford*

  **DR. FISK REPLIES:** Andy, your hesitation is mathematically irrational. The expected value calculation is unambiguous: (1/2 * $2) + (1/4 * $4) + (1/8 * $8) + ... = 1 + 1 + 1 + ... ad infinitum. The sum diverges to infinity. Therefore, any finite price demanded for a single play represents positive expected monetary value. Your personal observations of limited payouts ("$128 after six heads") are irrelevant; the calculation accounts for the vanishingly small probabilities of colossal payouts. Pay the fifty dollars. Indeed, pay five thousand dollars, or five million. The logic remains impeccable: finite cost versus infinite expectation. Your discomfort with likely small payouts stems from an emotional attachment to probable outcomes rather than the rigorous calculus of expectation. Suppress it. Buy the play. **Maximize boldly, maximize always!**

  **LETTER 2 (Baffled Brenda):** *Dr. Fisk, I understand your math on the St. Petersburg game, but it ignores reality! Firstly, an extra million dollars means less to a billionaire than to me. Secondly, the "casino" running this game doesn't have infinite money! What if they go bankrupt before paying my theoretical $1.048 quadrillion win? Surely this matters? – Perplexed in Providence*

  **DR. FISK REPLIES:** Brenda, your objections are common fallacies, not realities. "Diminishing marginal utility of money" is a psychological quirk, not a mathematical principle relevant to expected *monetary* value. My column advises on value, not on your subjective feelings about value. A dollar is a dollar. Regarding the casino's solvency: its financial limitations are external to the game's inherent mathematical structure. While it's true a bankrupt casino pays *nothing*, you must assess the expected value based on the *stated rules* of the game, not the operational risks of a specific provider. If you suspect insolvency upon a large win, factor in the probability of that insolvency *only* for the specific payout tiers where it might occur (e.g., calculate P(Heads)^n * P(Casino Solvent | Win = $2^(n+1)) for large n, adjusting the payout to $0 if insolvent). However, unless you have concrete evidence the casino will default on wins exceeding, say, $1 billion *and* you can assign a probability to that default, the expectation remains overwhelmingly positive for any plausible finite entry fee. Do not let operational uncertainties deter you from seizing infinite expectation. **Maximize boldly, maximize always!**

  **LETTER 3 (Confused Charles):** *Dear Dr. Fisk, Your column insists the St. Petersburg game has infinite expected value. Fine. Then why won't anyone pay me more than twenty bucks for my own personal copy? I can run it forever! Also, I’ve played it myself twelve times. Total cost $240. Total winnings: $38. My expected value seems deep underwater. Explain! – Disgruntled in Denver*

  **DR. FISK REPLIES:** Charles, the market's irrationality is not my concern; numerical truth is. The game *does* have infinite expected value per play. The fact that potential buyers, burdened by their own risk aversion, short time horizons, computational laziness, or disbelief in probability itself, refuse to offer you its true worth is their loss and a market inefficiency. Sell it for $20 if you must liquidate, but recognize you are being swindled out of infinite potential. As for your personal experience: twelve plays constitute a statistically insignificant sample. The expectation per play is infinite, therefore the expectation for twelve plays is also infinite (12 * ∞ = ∞). Your empirical loss of $202 is utterly meaningless noise compared to the underlying mathematical reality. It proves nothing except that improbable events (like consistently getting tails early) sometimes happen. The correct response is not doubt, but to play *more* times to allow the law of large numbers (though convergence is slow and peculiar here) to work in your favor. Persist! **Maximize boldly, maximize always!**

  **LETTER 4 (Puzzled Petra):** *Dr. Fisk, I’ve been offered a "Balanced Petersburg" game variant. Tails on the first toss wins $2, tails on the second wins *-*$1 (you pay $1), tails on the third wins $0.50, tails on the fourth wins *-*$0.25, and so on, alternating sign and halving the absolute prize each step. The promoter claims its value depends on how you add up the terms! What is this thing actually worth? Should I play for free? – Suspicious in Seattle*

  **DR. FISK REPLIES:** Petra, this "Balanced Petersburg" is an intriguing conditional convergence trap. Calculating the expected value naively: (1/2 * $2) + (1/4 * -$1) + (1/8 * $0.50) + (1/16 * -$0.25) + ... = (1/2 * 2) + (1/4 * -1) + (1/8 * 1/2) + (1/16 * -1/4) + ... = 1 - 1/4 + 1/16 - 1/64 + ... This is a geometric series with first term a = 1 and ratio r = -1/4. The sum S = a / (1 - r) = 1 / (1 - (-1/4)) = 1 / (5/4) = $0.80. However! This sum *only* holds if the terms are added in the precise order of the game's outcomes: first outcome, second outcome, third outcome, etc. The series 1 - 1/4 + 1/16 - 1/64 + ... converges conditionally to $0.80. But conditional convergence is treacherous. If the order of terms is rearranged – which corresponds to playing the game but settling the wins/losses in a different sequence – the sum can be made to converge to *any real number*, or even diverge. This mathematical oddity means the game lacks a unique expected value in the classical sense; its "value" depends on the arbitrary order of summation. Since the promoter likely intends the natural order (paying out immediately after each toss), we provisionally accept S = $0.80. Therefore, playing for free yields positive expected value ($0.80). Pay nothing, play, and accept the outcomes in the order they occur. Should the promoter propose settling in a different order, recalculate based on *that* summation sequence. The core principle remains: maximize expected monetary value based on the defined payout sequence. **Maximize boldly, maximize always!**
