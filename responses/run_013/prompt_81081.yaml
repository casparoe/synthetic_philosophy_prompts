answer: |-
  ## Good morning.

  Graduates, families, faculty, friends. It’s an honor to stand here on this beautiful day, celebrating you and this remarkable achievement. Now, commencement speeches often follow certain… well-worn paths. You might hear about finding your inner voice, or how the future is yours to seize, or perhaps a stirring quote from someone famous. Important ideas, sometimes, but perhaps not quite capturing something else I think matters deeply as you step out from this place.

  Instead, I want to talk about something quieter. About the things we *are*, deep down. We often think of our qualities – our kindness, our courage, our patience – like fixed stars inside us. Bright, constant, always shining if only we look. If you’re brave, we think, you’ll *act* brave, always. If you’re generous, you’ll *be* generous, whenever the chance arises. And if you don’t see it? Well, maybe it just wasn’t there to begin with.

  But I’d like to suggest a slightly different picture. Think of these qualities – your kindness, your courage, your patience – not as bright, fixed stars, but more like… seeds. Seeds that hold incredible potential. But a seed, you know, needs something. It needs the right soil, the right light, the right amount of rain. Without those things? It might never sprout. It might stay hidden, unseen, sleeping deep in the dark earth.

  Imagine someone who has the potential for deep generosity within them. A real capacity for giving. But their life is lived under a constant, grinding pressure of scarcity – maybe financial, maybe time, maybe emotional. The opportunity to *be* generous, truly, expansively generous, might simply never arise. The conditions aren’t right. The seed doesn’t get its rain. That doesn’t mean the generosity isn’t there, waiting. It just means the world hasn’t offered it the moment to break through.

  Or think about patience. We all know someone we’d call patient. Steady. Calm. Imagine them, finally, after years of holding steady, having *that* one afternoon. The traffic is apocalyptic, the news is dire, the coffee spills, and someone says precisely the wrong thing on precisely the wrong day. And… they snap. Is that one afternoon the proof they were never truly patient? Or was it simply that the pressure finally found the one tiny lever, the one crack in the dam, and the conditions overwhelmed what was usually there?

  Here’s the trickier part. Sometimes, the very situation we set up to *see* if a quality is there… can be the thing that stops it from showing up, or even changes it entirely.

  Think about practicing something you love. Maybe playing guitar in your dorm room late at night. It flows. There’s an ease to it. Now imagine someone walks in, pulls up a chair, and says, "Play for me. Show me how good you are." Suddenly, the ease drains away. Your fingers feel clumsy. That effortless flow? Gone. The act of being watched, of being *on display*, changed the conditions. It didn’t necessarily mean the skill wasn’t there. It meant the situation blocked it, or twisted it into something else – maybe self-consciousness, maybe performance.

  Or think of a young child who naturally tells the truth. It’s just what they do. Then, one day, they tell an uncomfortable truth, and an adult beams: "Oh! What an *honest* child you are!" Suddenly, honesty isn’t just something they *do*. It becomes something they *are*, something they perform, something they might start to think about strategically. The praise, meant to encourage, subtly altered the quality itself.

  These qualities we value – they can be a little… shy. They don’t always show up on demand. They need the right room, the right light, the right kind of quiet to step forward authentically.

  Now, this isn’t about saying we’re just puppets of circumstance, blown about by every wind. And it’s definitely *not* about saying everyone has a hidden, perfect self just waiting to burst out. Life isn’t that simple, or that flattering. It’s messier, more interesting.

  What it *is* about is this: If what we are able to do, who we are able to *be* in any given moment, depends so much on the conditions around us and within us… then a huge part of building a good life, a meaningful life, isn't just about steeling your will or digging deep to find some inner reservoir.

  **It’s about tending the garden.**

  It’s about recognizing that creating the *conditions* for the qualities you want to live by is a major part of the work. It means protecting the spaces where you can practice without judgment, without grades, without an audience – where the music can just flow. It means choosing the rooms, both literal and figurative, where your courage has space to breathe, where your kindness won’t be instantly exploited, where your patience isn’t constantly hammered on a single, thin point. It means noticing when the situation is twisting something good inside you into something performative or strained, and gently trying to shift the light.

  Families, you’ve done so much of this tending already. You created the soil, you provided shelter, you offered the steady warmth that allowed these remarkable young people beside you to root themselves and begin to grow. You’ve seen their qualities emerge in the safe spaces you helped nurture. That’s a profound gift. Today, as you watch them prepare to plant their own gardens, know that the strength they carry comes, in no small part, from the ground you prepared.

  So, graduates, as you leave this carefully tended ground of the college, remember the seeds within you. Remember they are real. But remember, too, they need tending. Don’t just carry them; plant them. Choose your soil carefully. Pay attention to the light you let in. Protect the quiet spaces where your best self can practice unseen. And when you stumble – and you will, we all do – don’t assume the seed was never there. Ask instead: What condition was missing? What wind was too strong? What light was too harsh? And then, gently, begin again.

  Your life won’t be about waiting for your inner star to shine no matter what. It will be about learning to be a wise and patient gardener, creating the world where your best qualities can finally, truly, bloom.

  Congratulations. Go plant something beautiful.
