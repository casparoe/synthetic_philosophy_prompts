prompt: |-
  I am a software engineer. I have spent several years building consent and permissions flows for a data platform, and I have now been asked to contribute the written examination question for a graduate course on data ethics that is cross-listed between our computer science department and the philosophy department. My training is entirely technical. I can recognize the standard account of valid consent — adequate disclosure, voluntariness, competence — but I cannot adjudicate the hard cases, and I certainly cannot tell a good answer from a fluent one without help. I need you to produce the examination question, a model answer, and a marking scheme that I can defend when the philosopher who co-teaches the course reviews my grading.

  Build the question around a case rather than around the standard conditions, because I have watched students recite those conditions and then say nothing useful about an actual situation. Use the following case, or a tightened version of it, as the spine of the question.

  A company sells a workplace wellness app. An employer requires its employees to use the app to log their hours; hours that are not logged are not paid. The app requests continuous location and heart-rate data. Its disclosure screen states that the company shares data with analytics partners in order to improve the service — a statement that is literally true and that omits that those partners build health-risk profiles which are sold to insurers. The user is a competent adult. The company offers a paid tier, at eight dollars a month, that collects no continuous data; the user has not chosen it. No threat comes from the company: the pressure to accept comes from the employer's requirement, and the employer is not the party asking for consent.

  I want the question to force students to take positions on two puzzles that the standard conditions do not resolve on their own. Introduce both explicitly in the question, so that a student who has never encountered them can still engage with them.

  The first is the baseline problem. Voluntariness is measured against the alternative the person would otherwise have had, and in this case the choice of baseline decides the verdict. Is the baseline not using the app at all, which for this user means not being paid? Is it the paid tier, which means paying to avoid surveillance? Or is it the situation the user would have occupied had the employer never adopted the app? The question should require students to state which baseline they are using and what turns on the choice.

  The second is the act/attitude problem. Consent might be an act — the click, the signature, the spoken words — or it might be a state of mind, such as understanding and endorsing what is happening. On the act reading, the click can settle the matter even where understanding is thin; on the attitude reading, the click is only evidence of consent and can be defeated by what the user did or did not understand. The question should require students to say which reading their verdict depends on.

  The question should also require students to decide two case-specific matters: whether a disclosure that is literally true but materially incomplete can deceive, and whether competence is a general capacity or a capacity with respect to this particular transaction.

  The question should be answerable in seventy-five minutes and be worth twenty-five marks, and the model answer should run to roughly seven hundred words. The marking scheme should be organized around the specific moves a strong answer must make, rather than around generic virtues such as clarity, and it should name the specific errors that ought to cost marks — including at least one error that is tempting precisely because it sounds sophisticated. Finally, tell me which one or two moves separate a first-class answer from a solid second-class one, since that is the distinction I will have to defend when grades are challenged.

  One constraint: do not build the question or the model answer around names, dates, or citations. The students are not expected to have read the literature, and I could not verify a reference if I tried.
reasoning: |-
  We are constructing an examination question for a graduate course on data ethics. The question should be built around the provided case study and should explicitly require students to address two puzzles: the baseline problem and the act/attitude problem. Additionally, students must address two case-specific matters: the adequacy of disclosure and the nature of competence.

  The case: 
  - A company sells a workplace wellness app.
  - An employer requires employees to use the app to log hours; unlogged hours are not paid.
  - The app requests continuous location and heart-rate data.
  - The disclosure screen states: "The company shares data with analytics partners in order to improve the service." This is literally true but omits that these partners build health-risk profiles sold to insurers.
  - The user is a competent adult.
  - The company offers a paid tier ($8/month) that collects no continuous data; the user has not chosen it.
  - The pressure to accept comes from the employer's requirement, but the employer is not the party asking for consent.

  The question must force students to:
  1. Take a position on the baseline problem (what is the baseline against which voluntariness is measured?).
  2. Take a position on the act/attitude problem (is consent an act or an attitude?).
  3. Address whether a literally true but materially incomplete disclosure can be deceptive.
  4. Address whether competence is a general capacity or specific to the transaction.

  We also need:
  - A model answer (approx. 700 words).
  - A marking scheme that lists specific moves and errors.
  - Identification of 1-2 moves that separate a first-class answer from a second-class one.

  Let's design the question:

  **Examination Question (worth 25 marks, 75 minutes)**

  **Case:** Workplace Wellness App

  A company provides a workplace wellness app that employers can adopt. An employer requires its employees to use this app to log their working hours; hours not logged are not paid. The app requests continuous access to the user's location and heart-rate data. The app's disclosure screen states: "We share your data with analytics partners to improve our service." This statement is literally true. However, it omits the fact that the analytics partners use the data to build health-risk profiles that are sold to insurers. The user is a competent adult. The company offers a paid tier of the app for $8 per month that does not collect continuous location and heart-rate data, but the user has not chosen this option. Note that the pressure to accept the terms comes from the employer's requirement to use the app to get paid, but the employer is not the party seeking consent for data collection — the app company is.

  **Question:** 

  Evaluate whether the user's consent to the data collection and sharing practices described in the case is valid. In your answer, you must address the following:

  a) The *baseline problem*: Against which baseline should we assess the voluntariness of the user's consent? Explain why you choose that baseline and how it affects your verdict on voluntariness. (7 marks)

  b) The *act/attitude problem*: Is consent primarily an act (such as clicking 'accept') or an attitude (a state of mind, such as understanding and endorsing the data practices)? Explain your view and how it affects your verdict on the validity of consent in this case. (7 marks)

  c) **Disclosure**: Is the disclosure provided by the app company (which is literally true but omits the sale of health-risk profiles to insurers) adequate, or is it deceptive? Justify your answer. (5 marks)

  d) **Competence**: Is the user's competence to consent a general capacity (e.g., being an adult of sound mind) or must it be specific to the particular transaction (e.g., understanding the technical and economic aspects of this data sharing)? How does your view affect your verdict? (6 marks)

  ---

  **Model Answer (approx. 700 words)**

  The validity of consent in data collection rests on satisfying the conditions of adequate disclosure, voluntariness, and competence. This case presents challenges in each condition, particularly because of the context of employer pressure and the nature of the disclosure. I will argue that the user's consent is invalid because of inadequate disclosure, non-voluntariness due to coercion by the employer, and a requirement for transactional competence that is not met. I will address each part of the question in turn.

  a) **Baseline problem (voluntariness)**: Voluntariness requires that consent is given without coercion or undue influence. The key question is: what is the baseline against which we measure the user's choice? There are three candidates: 

  1. The baseline of not using the app at all (which for this employee means not getting paid for work done). 
  2. The baseline of using the paid tier (which avoids continuous data collection but costs $8/month). 
  3. The baseline of the pre-app adoption situation (where the employee logged hours without such an app).

  I choose the first baseline: not using the app at all. This is the immediate alternative presented to the user. Under this baseline, the choice is between using the app (with data collection) and not getting paid. This is coercive because it forces the user to choose between two fundamental rights: the right to privacy and the right to be paid for work. Therefore, consent is not voluntary. 

  Some might argue for the second baseline (the paid tier) because it is an option within the app. However, this option requires the user to pay to avoid surveillance, which is unfair. The third baseline is hypothetical and not available at the moment of consent. Since voluntariness must be assessed relative to the actual alternatives at the time, the first baseline is the most appropriate. Hence, the pressure from the employer makes consent involuntary.

  b) **Act/attitude problem**: Consent must be understood as an attitude (a state of mind) rather than merely an act. The act of clicking 'accept' is only evidence of consent, but it is not sufficient if the user lacks understanding or endorsement. In this case, the disclosure is materially incomplete (as discussed in part c). The user cannot form a genuine attitude of consent without knowing that their data will be sold to insurers. The act of clicking is therefore defeated by the lack of understanding. 

  If we treated consent solely as an act, the click would validate consent regardless of comprehension. That would be inadequate in contexts with complex data flows. Given the stakes (health data being sold to insurers), an attitude-based view is necessary to protect autonomy. Thus, the user's consent is invalid because the required attitude (informed endorsement) is absent.

  c) **Disclosure**: The disclosure is inadequate and deceptive, even though it is literally true. A disclosure must provide material information that a reasonable person would want to know to make an informed decision. The fact that data is shared with partners to "improve the service" is true, but it omits the material fact that the partners build and sell health-risk profiles to insurers. This omission is deceptive because it creates a false impression that the data sharing is limited to service improvement, when in fact it serves a secondary, undisclosed commercial purpose. 

  A reasonable person would likely consider the sale of health-risk profiles to insurers as a critical factor in their decision. By omitting this, the disclosure fails the standard of transparency and invalidates consent.

  d) **Competence**: Competence must be specific to the transaction. While the user is a competent adult in general, they may lack the competence to understand the specific risks and implications of this data sharing. The technical nature of continuous location and heart-rate data, combined with the hidden data brokerage to insurers, requires a level of comprehension that a typical user may not have. 

  The app does not provide adequate information to bridge this gap. Without understanding the implications, the user cannot give valid consent. Therefore, even if the user is generally competent, the transaction-specific competence is lacking.

  **Conclusion**: The consent is invalid due to inadequate disclosure (which is deceptive), non-voluntariness (because of coercive baseline alternatives), and lack of transactional competence. The act of clicking does not validate consent because it does not reflect an informed, voluntary, and competent attitude.

  ---

  **Marking Scheme (25 marks total)**

  The marking scheme is organized by the required components. Each component is broken down into specific moves and errors. 

  **a) Baseline problem (7 marks)**  
  - Correctly identifies at least two baselines (1 mark).  
  - Chooses a baseline and justifies the choice (2 marks).  
  - Explains how the chosen baseline affects the voluntariness verdict (2 marks).  
  - Addresses the alternative baselines and explains why they are not chosen (1 mark).  
  - Overall coherence and relevance to the case (1 mark).  

  *Common error*: Arguing that the baseline is irrelevant because the user has no real choice (this avoids the required analysis of baselines). (Penalty: -2 if the baseline analysis is omitted.)  
  *Tempting sophisticated error*: Claiming that the baseline should be the paid tier because it is an option, without recognizing that charging to avoid surveillance is itself problematic and may not be a fair alternative. (This is a sophisticated error because it sounds nuanced but fails to see the inherent coercion in having to pay for privacy. Penalty: -1 for inadequate analysis of why this baseline is coercive.)

  **b) Act/attitude problem (7 marks)**  
  - Clearly distinguishes the act and attitude views (1 mark).  
  - Takes a position on which view is correct (1 mark) and justifies it (2 marks).  
  - Applies the chosen view to the case (2 marks).  
  - Explains how the view affects the verdict (1 mark).  

  *Common error*: Conflating the act and attitude views without clearly choosing one. (Penalty: -2 if not resolved.)  
  *Tempting sophisticated error*: Arguing that the act view is sufficient in commercial contexts because it promotes efficiency, without addressing the ethical need for understanding in high-stakes health data. (Penalty: -1 for failing to engage with the stakes.)

  **c) Disclosure (5 marks)**  
  - States whether the disclosure is adequate or deceptive (1 mark).  
  - Explains why the disclosure is materially incomplete (2 marks).  
  - Argues that the omission is material (i.e., a reasonable person would care) (1 mark).  
  - Links to deception (1 mark).  

  *Common error*: Focusing solely on literal truth without considering material omissions. (Penalty: -2 if omission is not addressed.)

  **d) Competence (6 marks)**  
  - Distinguishes general and transactional competence (1 mark).  
  - Takes a position on which is required (1 mark) and justifies (2 marks).  
  - Applies to the case, explaining why the user does or does not have the required competence (1 mark).  
  - Links to the verdict (1 mark).  

  *Common error*: Assuming that general competence is sufficient without addressing the complexity of the transaction. (Penalty: -2 if no mention of transactional competence.)

  **Overall Structure and Clarity (up to 0 marks, but note: if the answer is so disorganized that it obscures the arguments, deduct up to 2 marks from the total.)**

  **Moves that separate a first-class answer (e.g., 22-25) from a solid second-class one (e.g., 18-21):**  
  1. **Integration**: A first-class answer will not treat each part in isolation but will show how the issues interact. For example, the baseline problem affects voluntariness, which then interacts with the act/attitude view. Similarly, inadequate disclosure undermines the possibility of having the right attitude.  
  2. **Depth in justifying choices**: For instance, in the baseline problem, a first-class answer might discuss the ethical implications of each baseline choice (e.g., the paid tier as a form of 'privacy ransom') and why that makes it an inappropriate baseline. In the act/attitude problem, a first-class answer might engage with the practical challenges of requiring an attitude but still argue for its necessity in high-stakes contexts.  

  By contrast, a second-class answer might address each part correctly but without these connections and without the deeper ethical reasoning.

  **Defending Grades**: When challenged, focus on whether the student has addressed the required components (a-d) and whether they have made the key moves identified in the marking scheme. The two distinguishing moves (integration and depth) are critical for the highest marks.
answer: |-
  ### Examination Question: Data Ethics and Valid Consent  
  **Worth 25 marks (75 minutes)**  

  **Case Study:**  
  A company offers a workplace wellness app. An employer mandates that employees use this app to log their work hours; hours not logged are not paid. The app requests continuous access to the user’s location and heart-rate data. During setup, the app displays a disclosure stating: "We share your data with analytics partners to improve our service." This statement is literally true but omits that analytics partners use the data to build health-risk profiles sold to insurers. The user is a competent adult. The company provides a paid tier ($8/month) that collects no continuous data, but the user has not selected it. The employer’s requirement creates pressure to accept, but the employer is not the party seeking consent—the app company is.  

  **Question:**  
  Evaluate whether the user’s consent to data collection and sharing is valid. Address **all** the following:  
  1. **Baseline Problem**: What baseline should determine voluntariness? Choose **one** of these:  
     - (a) No app use (resulting in unpaid work);  
     - (b) The paid tier (costing $8/month);  
     - (c) The pre-app work environment.  
     Justify your choice and explain how it affects your verdict on voluntariness. (7 marks)  
  2. **Act/Attitude Problem**: Is consent primarily:  
     - (a) An *act* (e.g., clicking "accept"); or  
     - (b) An *attitude* (understanding and endorsing the practice)?  
     Justify your view and explain how it affects your verdict on validity. (7 marks)  
  3. **Disclosure**: Can a literally true disclosure be deceptive if it omits material information? Apply your view to this case. (5 marks)  
  4. **Competence**: Is competence:  
     - (a) A *general* capacity (e.g., adulthood); or  
     - (b) *Transaction-specific* (e.g., understanding this data practice)?  
     Justify your view and explain how it affects your verdict. (6 marks)  

  ---  
  ### Model Answer (Approx. 700 words)  
  **Overall Verdict**: The user’s consent is invalid. It fails the conditions for valid consent—voluntariness, disclosure, and competence—due to coercive pressure, deceptive omissions, and the transaction’s complexity.  

  #### 1. Baseline Problem (Voluntariness)  
  I select baseline (a): *no app use (resulting in unpaid work)*. Voluntariness requires assessing alternatives realistically available at the point of consent. Here, the employer forces a choice: use the app or forfeit wages. Baseline (b) (paid tier) is technically available but imposes a financial penalty ($8/month) to avoid surveillance, reframing consent as "pay or be monitored." This is coercive, as it penalizes privacy. Baseline (c) (pre-app environment) is irrelevant—it is hypothetical and inaccessible once the employer adopts the app.  

  This baseline choice renders consent involuntary. Voluntariness demands freedom from undue pressure, yet the user faces economic duress: losing wages for refusing. The employer’s mandate transfers coercion to the app company’s consent process, invalidating voluntariness. Choosing baseline (b) would not resolve this, as charging for privacy exploits power imbalance. Thus, consent is involuntary regardless of the user’s "choice" to forgo the paid tier.  

  #### 2. Act/Attitude Problem (Nature of Consent)  
  Consent is primarily an *attitude* (understanding and endorsement), not merely an act. An act (e.g., clicking) is only *evidence* of consent; it cannot validate consent if the user lacks comprehension. This view aligns with autonomy: consent should reflect informed, willing agreement. An act-only approach would permit manipulation via deceptive designs ("dark patterns").  

  Here, the act (clicking "accept") is defeated by the user’s likely attitude. The disclosure omits critical information (data sold to insurers), preventing genuine understanding. Without knowing insurers profit from health-risk profiles, the user cannot endorse the practice. Even if the user clicked, their attitude—lacking comprehension—cannot constitute valid consent. An act-based reading would overlook this, reducing consent to a hollow ritual. Thus, on the attitude view, consent fails.  

  #### 3. Disclosure (Deception via Omission)  
  A literally true disclosure can be deceptive if it omits material information. Deception hinges on whether omissions cause false beliefs, not literal falsity. Material information is what a reasonable person would need to make an informed choice—here, the sale of health data to insurers.  

  The app’s disclosure ("data shared to improve service") is deceptive. It implies data is used for benign, internal purposes, omitting the material fact that partners profit by selling health-risk profiles. A reasonable user would view insurer sales as pivotal—e.g., due to risks of insurance discrimination or loss of confidentiality. By obscuring this, the disclosure creates a false narrative of "service improvement," invalidating consent. Literal truth cannot excuse material omission in high-stakes contexts like health data.  

  #### 4. Competence (General vs. Transaction-Specific)  
  Competence must be *transaction-specific*. General competence (e.g., adulthood) is insufficient for complex data practices. Users need grasp of *this transaction’s* implications to exercise autonomy.  

  The user, while generally competent, likely lacks transaction-specific competence. Health-risk profiling involves technical concepts (e.g., continuous biometric data aggregation) and opaque downstream uses (e.g., insurer sales). The disclosure’s omissions exacerbate this—no one can comprehend what is hidden. Competence requires understanding risks like employment discrimination or higher insurance premiums, which are not disclosed. Thus, even a generally competent user cannot consent validly without transaction-specific comprehension.  

  **Conclusion**: Consent is invalid. Voluntariness fails due to coercive baseline pressure; the attitude view exposes inadequate understanding; the disclosure deceives via omission; and transaction-specific competence is unmet. The app company shifts accountability to the user, but consent cannot be valid under structural injustice.  

  ---  
  ### Marking Scheme (25 Marks Total)  
  **Structure**: Deduct **2 marks** if the answer omits any of the four required sections.  

  #### 1. Baseline Problem (7 marks)  
  - **Moves required**:  
    - States a chosen baseline (1 mark).  
    - Justifies *why* that baseline is appropriate (e.g., realism, accessibility) (2 marks).  
    - Explains how the baseline affects voluntariness (e.g., coercion in baseline (a)) (2 marks).  
    - Contrasts with at least one rejected baseline (e.g., why (b) or (c) is inapplicable) (1 mark).  
    - Links to case outcome (e.g., "invalidates consent") (1 mark).  
  - **Errors**:  
    - *Omission penalty*: Failing to justify the baseline choice (-2).  
    - **Sophisticated error**: Arguing the paid tier (baseline (b)) is "voluntary" because it is an option, ignoring that paying for privacy constitutes economic coercion (-2).  

  #### 2. Act/Attitude Problem (7 marks)  
  - **Moves required**:  
    - Defines act and attitude views (1 mark).  
    - Takes a clear position (e.g., "attitude is primary") (1 mark).  
    - Justifies the position (e.g., autonomy requires understanding) (2 marks).  
    - Applies to the case (e.g., click vs. comprehension gap) (2 marks).  
    - States how the view affects the verdict (e.g., "invalid without understanding") (1 mark).  
  - **Errors**:  
    - *Omission penalty*: Not applying the view to the case (-2).  
    - **Sophisticated error**: Claiming the "act" view is pragmatic for efficiency, without addressing how it undermines autonomy in high-stakes health data (-2).  

  #### 3. Disclosure (5 marks)  
  - **Moves required**:  
    - Takes a position on deception (e.g., "deceptive due to omission") (1 mark).  
    - Defines materiality (e.g., "what a reasonable person would want to know") (1 mark).  
    - Explains why the omission is material (e.g., insurer sales affect user welfare) (2 marks).  
    - Links to validity (e.g., "inadequate disclosure voids consent") (1 mark).  
  - **Errors**:  
    - *Omission penalty*: Accepting literal truth as sufficient without addressing materiality (-2).  

  #### 4. Competence (6 marks)  
  - **Moves required**:  
    - Distinguishes general vs. specific competence (1 mark).  
    - Chooses a view (e.g., "specific competence required") (1 mark).  
    - Justifies the view (e.g., complexity demands transaction understanding) (2 marks).  
    - Applies to the case (e.g., undisclosed insurer sales prevent comprehension) (1 mark).  
    - Affects verdict (e.g., "incompetent for this transaction") (1 mark).  
  - **Errors**:  
    - *Omission penalty*: Assuming general competence resolves the issue without engaging transaction complexity (-2).  

  #### Overall Penalties  
  - **Repetition**: Restating the case without analysis (-1 per instance).  
  - **Strawman**: Misrepresenting an opposing view (e.g., "act theorists ignore ethics") (-2).  

  ---  
  ### Distinguishing First-Class Answers (21–25 marks) from Second-Class (16–20 marks)  
  Two moves elevate first-class answers:  
  1. **Interconnection**: Exploiting links between issues (e.g., "Inadequate disclosure directly undermines the attitude view of consent, as users cannot endorse hidden insurer sales").  
  2. **Nuance in power dynamics**: Highlighting structural coercion (e.g., "The employer’s role creates a tripartite power imbalance, where consent is invalid even without direct threats from the app company").  

  Second-class answers address each section correctly but in isolation (e.g., discussing baselines without tying them to the employer’s coercion), or default to generic principles without case-specific reasoning.  

  **Grading Defense**: Focus on whether students:  
  - Explicitly justify their baseline choice and act/attitude position.  
  - Use materiality in disclosure and transaction-specificity in competence.  
  - Avoid sophisticated errors (e.g., treating the paid tier as a "free choice").  
  First-class answers will integrate these into a coherent ethical narrative, while second-class answers treat them as checkboxes.
