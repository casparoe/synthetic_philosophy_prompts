prompt: |-
  I teach a third-year seminar in philosophy of medicine — 16 students, one 90-minute session — and I want an activity where they *feel* the pull of both naturalism and normativism about disease, instead of me standing up and listing the two positions at them. Heres the skeleton I've got; turn it into something I can actually run: rules, materials, timings, scoring, debrief, and an honest list of what'll go wrong the first time.

  The skeleton. I build a deck of about 15 cards. Each card is one case, described in plain bodily terms with no diagnostic label — the second I put a name on a card they just retrieve the textbook verdict instead of judging. Every card asks two questions, which students rate separately and, importantly, privately first, before any group discussion: (a) is something in this body malfunctioning — not doing what that kind of body is supposed to do? (b) is this person harmed, and would medicine be doing them a favour by stepping in? Then the group becomes a nosology committee and has to commit in writing to one definition: a condition counts as a disease iff ___. One criterion only, no 'or', and it has to classify every card in the deck.

  The cases are rigged so (a) and (b) pull apart: someone with mirrored internal organs, healthy and unaware of it; a person who feels no pain at all from birth; lactose intolerance in a herding community that lives on milk versus a community that never touches it — identical biology, opposite verdicts; sickle-cell trait, protective in one place and risky in another; ordinary grief after a death; pregnancy; a thirty-year-old with high blood pressure who feels fine; a benign mole; six fully working fingers; someone who hears voices, isn't distressed by them, and whose community has a place for it; a twenty-year-old carrying a gene that will certainly wreck them at fifty but who's fine now; an asymptomatic carrier who's perfectly healthy and infects other people (whose harm counts?); a dog with a torn ligament; a maple with a fungus. The last two matter — they stop the group from settling on 'a disease is whatever the person says hurts'.

  I want a game element, but I dont want winning to line up with being right. So after they've committed, groups swap definitions and try to break each other's with a sealed deck I've kept back — five cards engineered as traps, one per lazy definition (purely statistical: catches the mirrored organs and the six fingers; purely harm-based: catches the grief; purely malfunction-based: catches the asymptomatic carrier; purely 'what doctors treat': catches the blood pressure; purely cultural: catches the maple). Points for landing a hit. The debrief should then say out loud that the group that won won by appealing to the values everybody already shared — which is the normativist's point, not a bug.

  What they should walk out seeing: that their own verdicts were never read off the biology, and that a definition of disease does real work — it decides who pays, who gets treated, who counts as normal. What I need from you: the exact materials (how to word the cards so the two questions stay independent and don't leak into each other), a minute-by-minute timeline for the 90 minutes, the scoring, and a debrief that maps particular moments back onto the naturalist/normativist split.

  Two things to be straight about. First, what predictably goes wrong and how I handle it — my guesses: groups will write a two-pronged definition to cover everything ('malfunction or harmful'), someone will settle arguments by saying a doctor would call it a disease, and one person will announce that its all socially constructed in the first five minutes and the room will relax. Second, tell me what the activity can't do. My worry is that it can make them feel facts and values are tangled in their judgments, but it can't touch the naturalist who simply says the committee is ignorant — that all these cases really do have a determinate malfunction-or-not answer and we just haven't found it. If thats right, say so and tell me what I have to supply myself.
reasoning: |-
  Hmm, the user is teaching a philosophy of medicine seminar and wants an activity to help students experience the tension between naturalist and normativist views of disease. They have a skeleton idea involving case cards where students rate bodily malfunction and harm separately, then form definitions as a "nosology committee." The activity includes a game element where groups test each other's definitions with trap cards.

  I need to flesh this out with specifics: card wording, timing, scoring, debrief, and anticipate problems. The user wants students to feel how their judgments aren't purely biological but involve values, and to see how disease definitions have real-world consequences. They're also concerned about limitations, like hardcore naturalists dismissing the exercise.

  First, the card design: each card should describe a condition neutrally, avoiding diagnostic labels. For example, "Person A has all internal organs mirrored left-to-right" without mentioning situs inversus. Questions (a) and (b) must be phrased to prevent leakage - so (a) focuses purely on biological function ("is any part not performing its typical biological function?") and (b) on context-dependent harm ("is this causing harm or disadvantage in typical environments?"). Including varied cases like lactose intolerance in different cultures or the asymptomatic carrier will highlight the normativist point.

  For timing: 90 minutes is tight. I'd suggest 5 min intro, 10 min individual ratings, 15 min small group discussion, 20 min definition drafting, 15 min definition testing with trap cards, and 20 min debrief. The testing phase needs to be quick but impactful - groups swap definitions and try to "break" them with the trap cards, scoring points for successful challenges. This keeps it game-like without equating winning with being "correct."

  Scoring should reward spotting flaws, not having the "right" definition. For example, 1 point per valid challenge where a trap card exposes a contradiction in the opponent's definition. This reinforces that all definitions have weaknesses.

  Debrief is crucial. I'll map specific trap cards to philosophical positions: e.g., the purely statistical definition failing on mirrored organs shows naturalism's limits, while the grief card breaking harm-based definitions reveals normativist dilemmas. Highlighting moments where students' private ratings diverged (like rating pregnancy high on harm but low on malfunction) can underscore the tension. The takeaway should be that their judgments always involved values, and definitions have real stakes in resource allocation.

  Predictable problems: Groups might try two-pronged definitions ("malfunction OR harm"). To handle this, enforce the "one criterion only" rule strictly. Someone will appeal to medical authority ("doctors call it a disease") - remind them the exercise is about justifying definitions, not deferring. The early social constructionist might derail tension - acknowledge their point but stress we're examining how that construction works. Also, groups may get stuck debating; use timers and offer "tiebreaker" prompts.

  Limitations: A hard naturalist might argue we just lack biological facts. The activity can't refute this, so I'll suggest pre-empting it in the intro ("Today we're examining clinical reasoning, not final truths") and following up with a mini-lecture on how determinism remains unproven in medicine. The maple tree card is key here - it forces the question of whether disease is human-specific.

  Materials needed: Printed card decks (main and traps), worksheets, timers. For the maple tree card, wording like "A maple tree has a fungal growth that slowly decomposes its wood" avoids plant-specific terms. Trap cards should be sealed until testing to prevent cheating.

  In the debrief, explicitly connect the scoring system to normativism: "The winning group won by spotting value conflicts in others' definitions - which is exactly the normativist argument that values are unavoidable." This turns the game mechanic into a learning point.

  Finally, a honest "what goes wrong" list: First runs might have timing issues (overrun in definition drafting), so keep a timer visible. Students might question case realism (e.g., "people always know they have mirrored organs!"), so emphasize hypothetical reasoning. Some might disengage if their definition crashes - remind them that exposing weaknesses is valuable. And yes, the naturalist critique will linger, so end by framing it as an ongoing debate, with the activity as one tool.
answer: |-
  Here’s a fully fleshed-out activity based on your brilliant skeleton, designed for 90 minutes. It includes materials, timing, traps, and strategies to handle predictable issues—plus honest limitations.

  ---

  ### **Activity Title:** *Nosology Committee: Drawing the Disease Line*

  **Learning Goal:** Students experience the tension between naturalist (disease as biological malfunction) and normativist (disease as harmful deviation) definitions, and recognize how values shape medical categorization.

  ---

  ### **Materials**
  1. **Main Card Deck (15 cards):** 
     - Each card has **3 sections**: 
       - **Case Description** (neutral, biological facts only)
       - **Question A**: *"Is any part of this body failing to perform its typical biological function?"* (Yes/No/Uncertain)  
       *→ Targets NATURALISM (malfunction)*
       - **Question B**: *"Is this condition causing harm/disadvantage* ***in a typical human environment***, warranting medical intervention?" (Yes/No/Uncertain)  
       *→ Targets NORMATIVISM (harm)*
     - **Sample Card Wording** (avoid labels!):
       - **Mirrored Organs**: *"Person A was born with all internal organs (heart, liver, stomach) mirrored left-to-right. All organs function normally. Person A is unaware of this and experiences no symptoms."*
       - **Lactose Intolerance (Pastoralist)**: *"Person B lives in a cattle-herding community where dairy is the primary food source. Their body cannot digest lactose after infancy, causing severe cramps and diarrhea when they consume milk."*
       - **Lactose Intolerance (Non-Dairy)**: *"Person C lives in a fishing community with no dairy in their diet. Their body cannot digest lactose after infancy. They experience no symptoms."*
       - **Asymptomatic Carrier**: *"Person D hosts a virus in their body. It causes no symptoms or damage to Person D but is highly contagious and causes severe illness in others."*
       - **Full list**: Mirrored Organs, Congenital Insensitivity to Pain, Lactose Intolerance (Pastoralist), Lactose Intolerance (Non-Dairy), Sickle-Cell Trait (Malaria Zone), Sickle-Cell Trait (Urban USA), Grief (4 weeks after spouse’s death), Pregnancy (healthy, 2nd trimester), Hypertension (asymptomatic 30yo), Benign Mole, Polydactyly (6 functional fingers), Non-Distressed Voice-Hearer (supported by community), Presymptomatic Huntington’s Carrier, Asymptomatic Carrier, Torn Ligament (dog), Fungal Growth (maple tree).

  2. **Trap Card Deck (5 cards)**: Sealed in an envelope.  
     - *Purely Statistical Trap*: **"Person E has green eyes (only 2% of the population)."**  
     - *Purely Harm-Based Trap*: **"Person F is experiencing intense jealousy after their partner flirted with someone else."**  
     - *Purely Malfunction Trap*: **"Person G has a benign, non-functional vestigial tail."**  
     - *Purely "Doctors Treat It" Trap*: **"Person H has albinism (no health issues, but uses sunscreen)."**  
     - *Purely Cultural Trap*: **"A patch of poison ivy plants in a forest."**

  3. **Other**:  
     - Worksheets for individual A/B ratings (private)  
     - Whiteboard/flip chart for group definitions  
     - Timer  
     - Scoring tokens/sticky notes (for trap round)

  ---

  ### **Timeline (90 Minutes Total)**
  1. **Intro (5 min)**:  
     - *"Today you’re a WHO disease classification committee. Your job: define ‘disease’ with ONE criterion. No ‘ors’, no ‘ands’—just one rule that covers every case."*  
     - Emphasize: *"We’re not debating what IS a disease—we’re seeing how definitions WORK."*

  2. **Individual Rating (10 min)**:  
     - Hand out worksheets + main deck (1 set per student).  
     - Students rate **A** (malfunction?) and **B** (harm?) for all 15 cards *privately*.  
     - *Critical instruction: "Answer A using ONLY biological facts. Answer B considering the person’s life context."*

  3. **Small Group Discussion (15 min)**:  
     - Groups of 4. Compare ratings. Find where A and B diverge (e.g., mirrored organs: high A, low B).  
     - *Prompt: "Where do ‘malfunction’ and ‘harm’ pull apart? Why?"*

  4. **Draft Definition (20 min)**:  
     - Groups agree on **ONE** definition: *"A condition is a disease iff [SINGLE CRITERION]."*  
     - Write it on the board.  
     - **Enforce ruthlessly**: No "or". If they try "harm OR malfunction", say: *"WHO headquarters rejects complex definitions. Pick ONE to prioritize."*

  5. **Definition Swap & Trap Round (15 min)**:  
     - Groups swap definitions. Give each the sealed trap deck.  
     - **Challenge**: Test the *other group’s* definition with trap cards.  
     - **Scoring**: 1 point per **valid hit** (a trap card that clearly breaks the definition). Groups must justify why.  
     - *Example: If Group 1 uses "statistical abnormality", trap "green eyes" breaks it. Group 2 scores 1 point.*

  6. **Debrief (20 min)**:  
     - Start with scoring results: *"Which group ‘won’? They won by spotting values hidden in others’ definitions—which is the normativist’s whole argument!"*  
     - **Key Moments → Philosophy**:  
       - Trap cards failing naturalism:  
         - *Mirrored organs* (malfunction but no harm) → "Naturalism overcounts."  
         - *Asymptomatic carrier* (harm but no *personal* malfunction) → "Whose harm matters?"  
       - Trap cards failing normativism:  
         - *Grief* (harm but not a disease) → "Harm is necessary but not sufficient."  
         - *Maple tree* (harm but not human) → "Disease is anthropocentric."  
       - Cultural cases (lactose intolerance, voice-hearer): *"Identical biology, opposite verdicts. What changed? Values."*  
     - **Big Takeaway**: *"Your private ratings weren’t ‘facts’—they were judgments mixing biology and values. And your definition? It decides who gets treated, insured, or even called ‘normal’."*

  ---

  ### **Predictable Problems & Fixes**
  1. **"We’ll use TWO criteria (malfunction OR harm)!"**  
     → **Fix**: Enforce "ONE CRITERION ONLY". Say: *"If you use ‘or’, sickle-cell trait is always a disease—but is it, in a malaria zone? Commit to one priority."*

  2. **"But a doctor would call this a disease!"**  
     → **Fix**: *"Doctors use definitions too. Your job is to give them a consistent rule. Why should they listen to YOU?"*

  3. **"It’s all socially constructed!" (Early derailment)**  
     → **Fix**: *"Great! This activity shows HOW that construction works. Now draft a definition that handles the maple tree."*  
     → Use their energy: Trap cards will force them to confront holes in pure constructionism.

  4. **Analysis Paralysis**:  
     → **Fix**: Strict timers. For deadlocks: *"Which criterion is NON-NEGOTIABLE for you? Start there."*

  5. **"But Case X is unrealistic!"** (e.g., "People with mirrored organs *know*!")  
     → **Fix**: *"Assume the description is complete. We’re isolating variables."*

  ---

  ### **What This Activity CAN’T Do (and How to Handle It)**
  **Limitation**: It can’t refute a **hard naturalist** who insists biological malfunctions exist *objectively* and we just lack knowledge.  
  → **Your Countermeasures**:  
  1. **Pre-Activity**: Frame the exercise: *"Today we examine how values shape* ***medical categorization*** *in practice—even if you believe in objective malfunctions."*  
  2. **Post-Activity**: Add a 5-min mini-lecture:  
     - *"Naturalists argue: ‘These cases* seem *ambiguous, but future science will find the malfunction (e.g., grief = neurotransmitter flaw).’*  
     - *But notice: We still need values to decide WHOSE malfunctions matter (asymptomatic carrier?), or when a ‘malfunction’ is neutral (mirrored organs). Biology alone doesn’t draw the line."*  
  3. **Assign Follow-Up Reading**: Boorse vs. Engelhardt debates to deepen the critique.

  **Why It Works Anyway**: Even committed naturalists will *feel* the tension when their definition is broken by the maple tree or grief. The activity makes abstract positions visceral.

  ---

  ### **Final Tip**
  Run the trap round *fast*—it’s chaotic but fun. The debrief is where learning crystallizes. End by noting: *"No definition ‘won’ outright because disease is a *cluster concept*. But now you’ve felt why philosophers fight about it."*  

  This turns the "failure" of definitions into the core lesson: Medicine’s categories are value-laden boundary projects, not natural kinds. And your students just lived that.
