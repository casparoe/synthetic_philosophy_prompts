prompt: |-
  You are a philosopher of law with specialist knowledge of twentieth-century Anglo-American jurisprudence and the legal-moralism debate, and I would like you to reason carefully and to brainstorm the candidate readings before you evaluate any of them. I am a PhD student in legal theory, and I have a question about a slogan that keeps ending arguments I care about.

  In a seminar last week a visiting speaker closed off a discussion of whether the criminal law may be used to sustain a shared sexual morality by saying that you can't legislate morality, as though the point were both obvious and decisive. I have heard the same line used by people who want to decriminalize nearly everything, and by people who insist that every criminal statute enacts somebody's morality, so I no longer know what work it is doing. What I want is a menu rather than a verdict: lay out the distinct precise claims that one-liner could be making — descriptive, conceptual, normative, and the flatly trivial — and for each say whether it is true, whether it is contested, and whether it would actually have supported the speaker's use of it to close the argument. Then say which of the readings, if any, give the legal-moralist side something to worry about — the side that holds that society may enforce its shared morality because the erosion of shared moral bonds threatens social cohesion, and that the test for criminalization is whether the ordinary reasonable person would react to the conduct with intolerance, indignation and disgust — and which readings leave that position untouched.

  Test the readings against two statutes, so that they do not float free of cases: one criminalizing conduct that many find disgusting but that harms no one identifiable, prefaced by a preamble declaring the conduct contrary to the community's shared morality; and one requiring schools to teach a curriculum in civic virtue. Say which readings license, forbid, or are silent about each.

  End by stating what would change your mind — which argument or consideration would move you to a different assessment of the readings — and where your own reasoning is most likely to fail.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated query about the "you can't legislate morality" slogan in legal theory, specifically concerning legal moralism. As a PhD student in legal theory, they need a structured analysis of possible interpretations of this slogan and their implications. 

  First, I need to unpack the slogan's potential meanings across descriptive, conceptual, and normative dimensions. The user wants distinct interpretations tested against two concrete statutes: one criminalizing "harmless" immoral conduct (like consensual adult incest) and one mandating civic education. 

  For each interpretation, I'll consider:
  - Whether it's true
  - Whether it's contested
  - If it actually supports the visiting speaker's use to shut down debate
  - Its impact on legal moralism (particularly Devlin's version)

  The trivial reading - that all laws reflect some morality - is correct but unhelpful. More substantive readings include:
  1) Descriptive impossibility (laws don't change hearts)
  2) Conceptual incoherence (morality can't be "legislated" by definition)
  3) Moral irrelevance (law shouldn't target morality per se)
  4) Counterproductivity (enforcement backfires)
  5) Liberal neutrality (state shouldn't endorse specific moralities)

  Testing these against the statutes: The incest prohibition challenges readings 1 and 5, while civic education complicates 3 and 5. The civic virtue statute seems less problematic because it avoids criminal sanction and aligns with liberal values like tolerance.

  For the legal moralist position, readings 4 (counterproductivity) and 5 (liberal neutrality) pose real challenges, especially when combined with Hart's harm principle. Readings 1-3 leave moralism relatively unscathed.

  My own analysis might underestimate how civic education could become coercive, or overstate the distinction between criminal and non-criminal moral legislation. Foucault's disciplinary mechanisms could undermine my treatment of the education example as benign. The strongest counterargument would show that even non-punitive moral promotion creates oppressive power structures.
answer: |-
  Here's a systematic breakdown of the "you can't legislate morality" slogan, analyzed through jurisprudential lenses and tested against your cases. I'll proceed as requested: first brainstorming candidate readings, then evaluating them, and finally assessing implications for legal moralism.

  ---

  ### **I. Candidate Readings of "You Can't Legislate Morality"**
  *(Categorized by claim type)*

  1. **Descriptive Empirical Claim**:  
     *"Laws targeting private moral conduct fail to eliminate immoral attitudes/behaviors."*  
     (e.g., Prohibition, sodomy laws)

  2. **Conceptual Claim**:  
     *"Morality (as internal conviction) is categorically distinct from legal coercion; law can only regulate conduct, not belief."*

  3. **Normative Liberal Claim**:  
     *"The state lacks legitimate authority to enforce moral norms lacking secular harm prevention."*  
     (Rooted in Mill/Hart)

  4. **Moral Skepticism Claim**:  
     *"There is no objective morality to legislate – all moral laws are arbitrary impositions."*

  5. **Practical Wisdom Claim**:  
     *"Attempting to legislate morality backfires by breeding resentment or black markets."*  
     (e.g., Drug prohibition)

  6. **Trivial Claim**:  
     *"All legislation reflects some moral view."*  
     (Tautological but common in debate)

  ---

  ### **II. Evaluation of Readings**
  | **Reading**               | **True?**                     | **Contested?**               | **Supports Speaker?**        | **Why?**                                                                 |
  |---------------------------|-------------------------------|------------------------------|------------------------------|--------------------------------------------------------------------------|
  | **1. Descriptive Empirical** | Partially (mixed evidence)    | Yes – context-dependent      | Weakly                       | Overgeneralized; ignores successful norm-shaping (e.g., smoking bans)  |
  | **2. Conceptual**           | True but trivial              | Minimally                    | No                           | Distracts – moralists target conduct *expressive* of moral failure      |
  | **3. Normative Liberal**    | Debatable                     | Heavily (Hart v. Devlin)     | **Yes** (if audience accepts liberalism) | Directly opposes moralist justification                             |
  | **4. Moral Skepticism**     | Rejected by most jurists      | Yes (meta-ethics)            | Unreliably                   | Undercuts *all* law, not just moralism                                  |
  | **5. Practical Wisdom**     | Often true                    | Situationally                | Partially                    | Empirical, not principled objection                                     |
  | **6. Trivial Claim**        | True                          | No                           | **No** (self-defeating)      | Makes moralist project *inescapable*; reframes debate to "which morality" |

  ---

  ### **III. Test Cases Against Readings**
  **Case A:** *Statute criminalizing consensual adult incest (with "shared morality" preamble)*  
  **Case B:** *Law requiring public schools to teach civic virtue (respect, tolerance, etc.)*

  | **Reading**               | **Case A (Incest Ban)** | **Case B (Civic Education)** | **Explanation**                                                                 |
  |---------------------------|-------------------------|------------------------------|---------------------------------------------------------------------------------|
  | **1. Descriptive**        | **License**             | **Silent**                   | Predicts failure to eliminate incest; silent on non-criminal pedagogy           |
  | **2. Conceptual**         | **Forbid**?             | **License**                  | Incest ban targets conduct, but education shapes belief – yet often permitted   |
  | **3. Normative Liberal**  | **Forbid**              | **License** (if harm-focused)| Rejects A as purely moral; accepts B if tied to social stability/democratic values |
  | **4. Moral Skepticism**   | **Forbid**              | **Forbid**                   | Rejects all state moral imposition                                              |
  | **5. Practical Wisdom**   | **Forbid** (likely)     | **License**                  | Incest ban may fuel stigma; civic ed unlikely to backfire                      |
  | **6. Trivial Claim**      | **License**             | **License**                  | Both reflect "morality" – no distinction made                                  |

  ---

  ### **IV. Implications for Legal Moralism (Devlin-esque Position)**
  - **Readings that challenge moralism**:  
    **#3 (Normative Liberal)** is the core threat – Hart's harm principle (*Law, Liberty and Morality*) directly contests Devlin's social disintegration thesis. **#5 (Practical Wisdom)** weakens enforcement claims.  
    *Why?* They deny the state's right to punish harmless immorality, even if widely despised.  

  - **Readings moralism can absorb**:  
    **#1 (Descriptive)**: Moralists can argue law's purpose is symbolic/declaratory, not behavioral perfection.  
    **#2 (Conceptual)**: Moralists regulate conduct *as evidence* of moral decay.  
    **#6 (Trivial)**: Moralists embrace this – law *should* enforce community ethics.  

  - **Case Vulnerability**:  
    Case A (incest ban) collapses under **#3** if no harm beyond disgust is proven. Case B survives **#3** by appealing to harm prevention (e.g., tolerance reduces violence).

  ---

  ### **V. What Would Change My Mind & Weak Points**
  1. **Change My Mind On**:  
     - If empirical proof shows *non-harm-based* moral laws (like adultery bans) prevent social collapse (contra **#3**).  
     - If civic virtue laws demonstrably instill *comprehensive doctrines* rather than thin political values (undermining Case B's distinction).

  2. **Where My Reasoning Is Weak**:  
     - **Over-separation of Cases A/B**: Civic education (*B*) could covertly enforce controversial morals (e.g., defining "tolerance" ideologically).  
     - **Devlin's Resilience**: I may underestimate his claim that moral bonds are *sui generis* social cement – if true, **#3** fails against Case A.  
     - **H.L.A. Hart's Blind Spot**: His harm principle struggles with cumulative harms (e.g., pollution analogies for moral decay).

  ---

  **Final Note**: The slogan's power lies in its ambiguity. Your speaker likely invoked **#3 (liberal norm)** or **#5 (pragmatism)**, but its trivial form (**#6**) lets opponents dismiss moralism vacuously. The moralist must either:  
  (a) Defeat **#3** by proving harmless immorality threatens social order, or  
  (b) Argue Case B shows we *always* legislate morality – so the debate is about *which* values merit enforcement.
