answer: |-
  Here is a taxonomy structured as a decision tree, prioritizing the logical space and your specified questions/cases, limited to **7 branch questions** and **8 leaf positions**:

  ### The Murderer-at-the-Door Taxonomy

  1.  **Is the duty against lying fundamentally owed *to the specific hearer* (forfeitably), or *to the speaker/humanity* (non-forfeitably)?**
      *   **A. Owed to the specific hearer (forfeitably):** → Go to 2
      *   **B. Owed to speaker/humanity (non-forfeitably):** → Go to 5

  2.  **Can the duty to *this hearer* be forfeited *only* by direct threat/attack, or also by broader immoral intent?**
      *   **A. Only by direct threat/attack (e.g., self-defense):** → *Position: **Narrow Forfeiture*** (Unnamed). *Awkward: Permits lies only against attackers, struggles with magistrate case.*
      *   **B. By broader immoral intent/purpose:** → Go to 3

  3.  **Does the prohibition bind the speaker to *avoid asserting falsehoods* or to *avoid causing false beliefs*?**
      *   **A. Avoid asserting falsehoods (lying):** → Go to 4
      *   **B. Avoid causing false beliefs (deception):** → *Position: **Broad Deception Prohibition*** (Unnamed). *Awkward: Rules out true-but-misleading deflection as impermissible.*

  4.  **Is the core duty to *provide truth*, *avoid falsehood*, or *avoid complicity*?**
      *   **A. Provide truth (to deserving hearer):** → *Position: **Truth-Owed*** (Unnamed). *Awkward: Requires truth even to magistrate, endangering the hidden.*
      *   **B. Avoid falsehood:** → *Position: **Lying Prohibited, Deception Permitted*** (e.g., Modified Kantian). *Awkward: Allows deception but not lies, even in courtesy case.*
      *   **C. Avoid complicity (in wrongdoing):** → *Position: **Non-Assistance*** (e.g., Rossian Prima Facie Duty). *Awkward: Permits flat refusal but not lying, even if refusal arouses suspicion.*

  5.  **Is the duty absolute/categorical, or can it be overridden by consequences?**
      *   **A. Absolute/Categorical (no overriding):** → Go to 6
      *   **B. Overridable by consequences:** → *Position: **Threshold Deontology***. *Awkward: Must specify the threshold (e.g., saving a life vs. minor harm) arbitrarily.*

  6.  **Does the apparent conflict dissolve under correct description of duties?**
      *   **A. Yes, conflict dissolves:** → Go to 7
      *   **B. No, genuine conflict remains:** → *Position: **Strict Kantian Absolutism***. *Awkward: Forbids lying even to save a life, including the murderer asking about their own danger.*

  7.  **How is the duty correctly described?**
      *   **A. Duty is to truth/veracity itself (practice of assertion):** → *Position: **Veracity-Focused Absolutism*** (Kant). *Awkward: Wrongs no *particular* person, forbidden even with consent or to prevent harm to asker.*
      *   **B. Duty is defined by context/consequences:** → Go to 8

  8.  **Do consequences define the duty *content* (not just override it)?**
      *   **A. Yes, consequences define the duty:** → *Position: **Consequentialist Specification*** (e.g., Rule-Utilitarian). *Awkward: Duty to lie becomes obligatory in murderer case, potentially obligatory in courtesy case if rule-beneficial.*
      *   **B. No, duty is context-sensitive but non-consequentialist:** → *Position: **Contextual Absolutism*** (Unnamed). *Awkward: Must explain why context dissolves prohibition here but not elsewhere without consequence-weighing.*

  ---

  **Explanatory Notes on Structure & Cases:**

  *   **Branch 1:** Separates positions based on *forfeitability*, key to whether the murderer's intent matters fundamentally. Cases like the magistrate, waiver, and protecting the murderer test this.
  *   **Branch 2:** Refines forfeiture views, distinguishing self-defense analogies from broader moral forfeiture. The magistrate case challenges narrow forfeiture.
  *   **Branch 3:** Separates lying from deception. Critical for evaluating the true-but-misleading deflection. "Broad Deception Prohibition" occupies a logical cell but is likely unattractive/unoccupied due to its severity.
  *   **Branch 4:** Distinguishes positive duty (Truth-Owed) from negative duties (Avoid Falsehood, Avoid Complicity). "Truth-Owed" is awkward and likely unoccupied/rarely held; "Non-Assistance" handles flat refusal easily; "Lying Prohibited, Deception Permitted" is the standard alternative-to-lying position.
  *   **Branch 5:** Separates absolutism from non-absolutism. Threshold Deontology occupies this overridable space.
  *   **Branch 6:** Separates genuine conflict views from dissolution views. Strict Kantian Absolutism holds the conflict is real and duty binds regardless.
  *   **Branch 7:** Separates different dissolution strategies: grounding duty in veracity itself vs. context/consequences.
  *   **Branch 8:** Distinguishes whether consequences *specify* the duty (Consequentialist Specification) or merely provide context for a non-consequentialist rule (Contextual Absolutism). Cases like saving self vs others, courtesy lies, and preventing harm to the asker probe this.

  **Handling Empty Cells & Unseparated Positions:**

  1.  **Truth-Owed (4A):** Logically possible but likely **unattractive/rarely occupied** due to requiring truth-telling to known murderers/magistrates, making it highly counterintuitive.
  2.  **Broad Deception Prohibition (3B):** Logically possible but **unattractive/unoccupied** because prohibiting *all* deception (including deflection) is excessively restrictive and negates a major alternative to lying.
  3.  **Strict Kantian Absolutism (6B)** and **Veracity-Focused Absolutism (7A)** land on the same fundamental commitment (never lie) but differ subtly: 6B sees conflict, 7A sees no conflict. A further distinction would be required: **"Is the prohibition grounded solely in the nature of assertion/communication itself, or also in a duty to self?"** (Veracity-Focused leans more to assertion itself; Strict Kantian might include duty to self/humanity).
  4.  **Consequentialist Specification (8A)** handles all cases fluidly based on expected outcomes. Its awkwardness is defining rules or thresholds non-arbitrarily.
  5.  **Contextual Absolutism (8B)** claims dissolution via context without consequence-weighing. Its awkwardness is explaining *why* this context lifts the prohibition without invoking consequences or making the rule seem ad hoc. It's a logically possible but potentially **unstable or unattractive** position.

  This tree forces choices at each branch based on core principles, mapping the cases onto the positions via the inherent logic rather than starting from interpreters. Each leaf captures a distinct stance with its key implication.
