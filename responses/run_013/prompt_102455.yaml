  When mapping the cases, I'll note where variations are decisive: the waiver case matters for positions about duty-waivers, while the magistrate scenario tests whether authority affects the duty.

  For empty cells in the logical space, I'll identify why they're unoccupied - whether due to incoherence (like claiming duties can be waived while being categorical) or mere lack of advocacy.

