  Key philosophical distinctions to build around include: whether truth-telling duty is owed to the hearer or to oneself; whether the prohibition covers only lying or all deception; whether the duty is to tell truth/avoid falsehood/avoid assistance; whether the conflict is genuine or apparent; if consequences define the duty itself; and whether the wrong is to the individual or to assertion as a practice.

