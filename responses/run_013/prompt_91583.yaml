  **Tone**: Corporate-helpdesk deadpan. Zero philosophy jargon. Zero concessions to "later selves."  
  **Consistency**: Rigid adherence to "signer is sovereign" — later dissent is always a glitch, never a voice.  
  **Creepy-reasonable vibe**: Achieved via HR-speak ("environmental noise," "hazard-state euphoria") and clinical dismissal of identity/memory claims as "hardware issues."
