prompt: |-
  Okay so this started as a dinner argument with my flatmate and it has now eaten three evenings, and I genuinely can't tell if what we're circling has a proper name or if we've just reinvented a worse version of something. I'm an identical twin and my brother and I keep independently making the same calls about things we've never discussed, which is probably why it got under my skin. Anyway here's the game we were fighting about. Two strangers in seperate rooms, can't communicate, will never meet again, each has to press one of two buttons. Both press left: they each get 30. Both press right: they each get 10. They press different ones: the left-presser gets 0, the right-presser gets 50. The boring answer is that everyone presses right, because right pays better no matter what the other person does — 50 instead of 30 if she presses left, 10 instead of 0 if she presses right. My flatmate says: fine, but now suppose the two of them are the same kind of reasoner, same brain, same information, and each knows that about the other. Then her button isn't some seperate fact about the world sitting out there for me to predict — it's the output of the exact reasoning I'm running right now, on the same inputs. So "I press left and she presses right" isn't a possibility I get to entertain, because if I press left then she presses left, by construction. So press left. I said that's rigging it: her choice is simultaneous with mine, nothing about me reaches across and changes it, and you can't just stipulate what someone decides by announcing they're like you. She said the whole point is there aren't two decisions there, just one pattern that happens to be instantiated twice.

  What I actually want out of you is the map, not the label. I'm fairly sure her move has a name — I have a vague sense it's discussed under some heading about two rational agents arriving at the same answer — but I don't want to be handed a word and sent on my way. Is her move the same as the golden rule / "what if everyone did this"? Is it the same as "I bet she's decent so she'll probably cooperate anyway"? Is it the same as that team-reasoning thing where you stop asking what *I* should do and ask what *we* should do? My instinct is that all three are nearby and none of them is it, but I couldn't defend that to save my life, and I'd like to know which is the closest and exactly where the seams are.

  Then I want the edges, because the edges are where we got stuck. Does it survive if the two of them are only 90% alike — same style of reasoning, but one of them occasionally gets a random nudge that the other doesn't? Does it survive if the resemblance is a coincidence of upbringing rather than a shared cause, so there's no actual mechanism making them agree? What about three people, or a whole city? And does it make any difference that her press is simultaneous with mine rather than caused by mine — because my gut says the trick only works if the two choices are somehow one act, and I can't tell whether that's a real distinction or just words I'm hiding behind.
