  Finally, epistemic limitations. Understanding what we can truly know about species given data constraints. Their data pipeline experience is relevant here, dealing with uncertainty and incomplete data. This is last because it's about constraints on the other questions.

  The order ensures each question builds on the prior. Defining purpose guides operationalization, which informs modeling gene flow, then temporal aspects, and finally recognizing limitations. Edge cases are distributed across these areas. Their background makes operationalization and gene flow modeling more tractable. Conservation vs. research conflicts stem from the first question's lack of clarity. Hybrids and ring species challenge operationalization and gene flow models. Bacteria highlight horizontal transfer in gene flow modeling. Temporal dynamics cover speciation processes. Epistemic limitations address data issues in all areas.
answer: |-
  Here are the five open questions, ordered by their upstream influence on the species problem, with reasoning for order, tractability, and fit of edge cases:

  1.  **Ontological Priority: What essential *purpose* does the concept "species" serve across biology (e.g., units of evolution, classification, conservation)?** This is the most upstream question because resolving *why* we need the concept dictates *what* properties matter most (reproduction, ecology, phylogeny). It's highly tractable for you (conceptual analysis). Edge cases like conservation vs. phylogenetics highlight conflicting purposes. Tackling this first clarifies the target for any operational definition.

  2.  **Operationalization Gap: How do we robustly map chosen species concepts (from #1) *consistently* onto observable biological data (genetic, morphological, ecological) across the Tree of Life?** Downstream of purpose, this addresses *how* to implement concepts. Highly tractable for you (ML/clustering/stats). Edge cases like ring species & hybrids are *precisely* where operational criteria break down. Progress here directly addresses your friend's "picking k" analogy by constraining it biologically.

  3.  **Gene Flow Dynamics: How do we model, quantify, and define thresholds for the *processes* of genetic exchange (vertical descent, hybridization, HGT) that create cohesion or separation between populations?** Downstream of operationalization (#2), as defining "clusters" requires understanding cohesion mechanisms. Tractability is high (modeling/stats). Edge cases like bacterial gene swapping are central here. This moves upstream if new genetic data challenges fundamental cohesion assumptions.

  4.  **Temporal Persistence: How do we define and identify species as *lineages* persisting through time, accounting for speciation modes and extinction?** Relies on understanding cohesion (#3) and operationalization (#2). Moderate tractability (requires phylogenetic modeling). Edge cases like chronospecies or fossil gaps fit here. Progress depends on better models of lineage divergence informed by #3.

  5.  **Epistemic Limitations: Given inherent data limitations (incomplete sampling, noisy traits, complex histories), what can we *reliably infer* about species boundaries, and how do we quantify uncertainty?** This is the most downstream, constraining answers to #2-#4. High tractability (uncertainty quantification, ML/data pipelines). Edge cases often arise *because* of these limitations. Its position reflects that it's about constraints on achieving the goals defined upstream.
