prompt: |-
  I'm a backend engineer with no formal philosphy training, and I'm weighing whether to spend the next year of evenings -- maybe more than evenings, possibly a career change -- on the species problem, so I want to know where the effort would actually go. My friend who builds data pipelines keeps telling me species are just clusters in some high-dimensional space and the whole fight is over who gets to pick k; I can't tell if that's profound or trivially dumb, but if you take it seriously it seems to shuffle what's worth working on. So what are the open questions in the species problem that matter most, and in what order should someone with my background (solid ML and stats, zero biology coursework) take them up? I keep getting stuck on the weird stuff -- ring species, bacteria swapping genes, hybrids, whether 'species' has to mean the same thing in a conservation statute as in a phylogenetics paper -- so say where those fit. For each question, tell me why its upstream of the others, how tractable it is for someone like me, and what would move it up or down the list. I care way more about the reasoning than about the list itself. Give me exactly five, numbered, a sentence or two each, no intro or wrap-up.
reasoning: |-
