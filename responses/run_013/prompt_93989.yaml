prompt: |-
  I chair the science curriculum review for a mid-sized school district. Each adoption cycle brings a stack of proposed units, and more of them now arrive dressed as science — data tables, references, the word "study" — from fields our committee cannot agree on. We have to vote on every unit within a single meeting, most members have no background in philosophy of science, and whatever we approve stays in classrooms for years. I need a decision procedure, not an essay: the questions to put to a unit in order, what counts as a sufficient answer to each, the point at which the procedure can stop with a clean "this is not science," and the point at which it must hand the call back to the committee because the remaining question is about values rather than facts.

  Ground it in the best accounts of how to draw the science/non-science line — falsifiability and its refinements — but make it survive the standard objections rather than ignore them. Any hypothesis can be rescued by adjusting a background assumption or adding an ad hoc rider, so "is it falsifiable?" alone will admit almost anything; some respectable science (statistical claims, existence claims, historical reconstructions) is not falsifiable in the naive sense; and a hypothesis gains nothing from predicting a result that any arbitrary addition to it would predict just as well. The procedure should also distinguish a line of work that keeps generating new testable successes from one that only patches holes, and it should be explicit about where it is applying a test of falsifiability versus a test of truth.

  Run it on three units: (1) a young-earth unit that argues from geology and scripture and makes specific, checkable claims; (2) a unit teaching that students have fixed "learning styles" that teachers should match, supported by the usual studies; (3) a cosmology unit on an unobservable multiverse, drawn from mainstream physics, with no direct evidence. Tell me where the procedure returns an answer the committee will not like. Close with what the procedure cannot do — the steps that are judgment in method's clothing, and the cases where I should simply tell the committee it is voting on values.
reasoning: |-
  Hmm, the user chairs a science curriculum review committee and needs a decision procedure to evaluate whether proposed units are genuinely scientific. This is a complex challenge involving philosophy of science concepts like falsifiability, while needing to be practical for time-constrained committee meetings.

  The user identifies key problems: committee members lack philosophy background, they must vote quickly, and decisions have long-lasting impact. They specifically mention three test cases: young-earth creationism, learning styles theory, and multiverse cosmology. The procedure must handle Popperian falsifiability's known weaknesses - like the Duhem-Quine problem (how any hypothesis can be saved by auxiliary assumptions) and the status of unfalsifiable but respectable science.

  Key requirements emerge:
  - Must be a step-by-step flowchart, not theoretical discussion
  - Must incorporate sophisticated falsifiability criteria beyond naive "can it be tested?"
  - Needs to distinguish progressive from degenerative research programs
  - Must flag when decisions become value judgments rather than scientific assessments
  - Should explicitly state what test is being applied at each stage

  For the test cases, I anticipate the procedure will reject the young-earth unit (despite its checkable claims), reject learning styles (despite "studies"), and accept multiverse cosmology (despite lack of direct evidence). This last one might be controversial for the committee.

  The procedure should explicitly acknowledge its own limitations - where it's making methodological judgments versus value calls. The exit ramps to "committee decision needed" are crucial for borderline cases where scientific merit intersects with pedagogical or community values.

  For structure, I'm considering a four-stage filter: 
  First, checking for basic falsifiability (with sophisticated criteria). 
  Second, assessing whether the field actually tests its claims. 
  Third, evaluating the track record of the research program. 
  Finally, separating scientific merit from curriculum suitability decisions.

  Each stage needs clear pass/fail criteria with examples. The "sufficient answer" standards should be pragmatic for a committee - like requiring citations to actual tests, not just theoretical testability. The distinction between "not science" and "science but poor quality" is vital to maintain credibility.

  The conclusion should emphasize what the procedure can't decide: how to weigh societal values against scientific merit in borderline cases, or how to handle well-established science that conflicts with community beliefs. That's where the chair must explicitly frame the decision as one of values.
answer: |-
  Here is a science/non-science demarcation procedure grounded in sophisticated falsifiability (Popper/Lakatos) and designed for practical committee use. It progresses through increasingly stringent tests, stopping early for clear non-science and flagging value judgments.

  **The Demarcation Procedure: Key Questions & Sufficient Answers**

  1.  **QUESTION:** **Does the unit make claims about the observable/natural world?**
      *   *Sufficient Answer:* YES - Explicit claims about physical reality, empirical phenomena, or testable predictions are present. (Proceed to Q2).
      *   *Sufficient Answer:* NO - Focus is solely on values, aesthetics, supernatural entities, pure logic, or untestable metaphysical assertions. **STOP: NOT SCIENCE.** (e.g., Unit solely teaching prayer is effective without physical claims).
      *   *Judgment Call:* If claims are vague or heavily intertwined with non-empirical assertions. Flag for committee if significant.

  2.  **QUESTION:** **Are the core claims *theoretically falsifiable* in a *non-trivial* way? (Refined Falsifiability Test)**
      *   *Sufficient Answer:* YES - Specific, non-adjustable predictions are made where a *conceivable* observation (even if practically difficult) *logically contradicts* the core claim *without* easily modifying auxiliary assumptions or adding ad hoc riders. (Proceed to Q3).
      *   *Sufficient Answer:* NO - Core claims are inherently untestable (e.g., "God works in mysterious ways"), or any contradiction can *always* be explained away by adjusting definitions, scope, or adding unfalsifiable elements. **STOP: NOT SCIENCE.**
      *   *Sufficient Answer:* AMBIGUOUS - Claims *appear* testable but rely on complex auxiliary assumptions where blame for failure is easily shifted. (Proceed cautiously to Q3 & Q4).
      *   *Key Refinements:*
          *   **Non-Trivial Prediction:** Does it predict something *specific* and *unlikely* under readily available competing explanations? Or just vague outcomes consistent with many views?
          *   **Riskiness:** Does the claim genuinely *risk* being wrong? Or is it crafted to be compatible with almost any outcome?
          *   **Ad Hoc Rescue:** If an observation seems to contradict it, is the *primary* response to propose a new *testable* hypothesis derived from the core theory, or to add an untestable protector belt?

  3.  **QUESTION:** **Is there evidence the field *actually engages in empirical testing* of these core claims? (Operational Testability Test)**
      *   *Sufficient Answer:* YES - Peer-reviewed literature documents *specific attempts* to test the core claims, including *published failures or anomalies* addressed by the field. Testing methodologies are standard and replicable. (Proceed to Q4).
      *   *Sufficient Answer:* NO - Literature consists only of assertion, interpretation within the framework, or attacks on alternatives without testing its own core claims. Testing is actively avoided or deemed unnecessary. **STOP: NOT SCIENCE.**
      *   *Sufficient Answer:* LIMITED/MIXED - Some testing exists, but is often indirect, relies on untestable auxiliary assumptions, or failures are ignored/dismissed without consequence. (Proceed to Q4 with caution).
      *   *This tests whether "falsifiability" is more than lip service.*

  4.  **QUESTION:** **What is the track record? Is this a *Progressive* or *Degenerative* Research Program? (Lakatosian Test)**
      *   *Sufficient Answer:* PROGRESSIVE - Core theory has successfully predicted *novel facts* (not just accommodated known data). Failures lead to new, *testable* auxiliary hypotheses that *successfully predict new phenomena*, expanding the theory's scope and precision. (Proceed to Q5).
      *   *Sufficient Answer:* DEGENERATIVE - Failures are patched only by ad hoc adjustments that *don't* lead to new testable predictions or discoveries. Core theory is increasingly insulated from test, focuses on reinterpreting existing data, or attacking critics. **STOP: POOR SCIENCE (METHODOLOGICALLY DEGENERATE).** *Not necessarily "false," but lacks the hallmark of reliable scientific progress.*
      *   *Sufficient Answer:* NEUTRAL/IMMATURE - Track record is short or inconclusive. Novel predictions may exist but haven't been tested yet, or adjustments are modest. (Proceed to Q5 - Judgment leans on prior steps).
      *   *This distinguishes vibrant science from stagnant dogma posing as science.*

  5.  **QUESTION:** **Is the unit's presentation primarily about the *scientific process/methods/evidence* supporting the core claims, or is it primarily about *asserting conclusions*? (Pedagogical Focus Test)**
      *   *Sufficient Answer:* PROCESS/EVIDENCE - Unit focuses on *how* the knowledge was developed, the evidence (strengths *and* weaknesses), testing methods, and unresolved questions. Core claims are presented as conclusions based on this process. **PROCEED: SCIENTIFIC MERIT DEMONSTRATED.**
      *   *Sufficient Answer:* ASSERTION - Unit presents core claims as established dogma, downplays or ignores counter-evidence/methodological weaknesses, or misrepresents the state of evidence/consensus. **FLAG: SCIENTIFICALLY DEFICIENT PRESENTATION.**
      *   *This catches units that use scientific trappings to teach non-scientific conclusions.*

  **The "Hand Back to Committee" Points:**
  *   After **Q1 (Ambiguous Claims):** If claims mix empirical and non-empirical elements significantly, the committee must decide if the *science components* are sufficient/appropriate.
  *   After **Q2 (Ambiguous Falsifiability)/Q3 (Limited Testing):** If the unit passes narrowly but concerns remain, the committee must weigh the *degree* of scientific merit against other curriculum goals (values, critical thinking exposure). *This is a value judgment about curriculum inclusion, not just scientific status.*
  *   After **Q4 (Neutral/Immature Track Record):** The committee must judge the *educational value* of including emerging or less-established ideas based on pedagogical goals, not purely on established scientific robustness.
  *   After **Q5 (Deficient Presentation):** The committee must decide if the core scientific idea has merit *despite* poor presentation, or if the presentation flaw renders it unsuitable. Requires pedagogical/value judgment.
  *   **Explicit Hand-Back:** "The core claims have some scientific basis/questions, but whether this unit belongs in the *science* curriculum involves weighing [specific pedagogical goals, community values, critical thinking aims] against the [specific methodological weaknesses/strengths]. This is a curriculum values decision for the committee."

  **Applying the Procedure to the Test Units:**

  1.  **Young-Earth Creationism Unit:**
      *   **Q1 (Claims):** YES (Specific geological/biological claims).
      *   **Q2 (Falsifiable?):** AMBIGUOUS. Makes checkable claims (e.g., fossil order, sediment layers) BUT core claims (6000-year age, global flood) have been repeatedly falsified. Standard response involves ad hoc rescues (rapid decay rates, hydroplate theory) *not* leading to novel predictions. *Fails non-trivial/risky prediction & degenerates via ad hoc rescue.* **STOP: NOT SCIENCE.** *Committee won't like this, but the procedure is clear.*

  2.  **Fixed "Learning Styles" Unit:**
      *   **Q1 (Claims):** YES (Claims about how brain learns, impact of matching instruction).
      *   **Q2 (Falsifiable?):** YES. Predicts matching style to instruction improves outcomes.
      *   **Q3 (Empirically Tested?):** YES. Extensively studied.
      *   **Q4 (Track Record):** **DEGENERATIVE.** Core prediction (matching -> better learning) consistently fails in rigorous, controlled studies. Responses: Shift definitions ("it's about preference, not ability"), attack methodology ("real classrooms are different"), add new styles, focus on learner "engagement" (untestable). Fails to generate novel, confirmed predictions. **STOP: POOR SCIENCE (METHODOLOGICALLY DEGENERATE).** *Committee may resist due to popularity, but procedure shows it lacks scientific progress.*

  3.  **Multiverse Cosmology Unit (Mainstream Physics):**
      *   **Q1 (Claims):** YES (Claims about structure of reality derived from physical theories).
      *   **Q2 (Falsifiable?):** **AMBIGUOUS.** Specific multiverse models *can* make *indirect*, probabilistic predictions (e.g., statistical properties of the CMB, gravitational wave signatures, vacuum stability). However, *direct* observation is impossible, and falsification is complex (failures might challenge specific models/assumptions, not the broad multiverse concept). *Passes on non-trivial/risky prediction potential in specific models.*
      *   **Q3 (Empirically Tested?):** LIMITED/MIXED. Active research seeks testable *indirect* consequences. Specific models are tested where possible (e.g., inflation parameters). Core "many universes" aspect lacks direct tests.
      *   **Q4 (Track Record):** **NEUTRAL/IMMATURE.** Emerged from successful theories (QM, Inflation). Novel predictions exist (e.g., for CMB patterns from colliding universes - highly speculative/testable in principle). Still young; adjustments are ongoing but aim for testability. Not clearly degenerative *yet*.
      *   **Q5 (Presentation):** ASSUME it focuses on evidence/process (inflation, QM) leading *to* the multiverse hypothesis, highlighting uncertainties and testing challenges.
      *   **RESULT:** Passes Q1, Ambiguous pass on Q2/Q3, Neutral on Q4. **HAND BACK TO COMMITTEE.** The core idea arises from robust science and *aims* for testability, but its direct empirical grounding is weak/indirect. Including it is a *value judgment* about teaching cutting-edge, theoretically motivated (but not yet strongly confirmed) ideas versus established core science. *Committee might dislike funding a unit on something unobservable, but the procedure shows it's not pseudoscience.*

  **What the Procedure Cannot Do (Judgment in Method's Clothing):**

  1.  **Define "Auxiliary Assumption":** Distinguishing a legitimate part of the theoretical background from an ad hoc rescue is often contextual and requires domain expertise/judgment.
  2.  **Assess "Novelty" of Predictions:** Judging whether a predicted fact is truly novel (not built into the hypothesis) or simply accommodated can be tricky.
  3.  **Weigh Evidence Quality:** It flags whether testing *happens* (Q3) and the program's health (Q4), but doesn't replace peer review in judging the *validity* of specific studies. It assumes mainstream scientific consensus reflects reliable methodology.
  4.  **Resolve "Borderline" Falsifiability:** Some cases (like complex models in fundamental physics or historical sciences) require nuanced judgment on Q2/Q3. The procedure flags this ambiguity but doesn't eliminate it.
  5.  **Determine "Sufficient" Progress:** When does a program shift from Neutral to Progressive or Degenerative? (Q4) This is retrospective and judgment-based.
  6.  **Override Community Values:** It identifies when the decision *is* about values (Hand-Back points), but doesn't dictate the outcome. You must clearly tell the committee: *"The scientific merit is [X level based on steps 1-4], but whether this belongs in our science curriculum given [pedagogical goals, community standards] is a values decision for you to vote on."*

  **Closing Summary:** This procedure uses falsifiability dynamically, focusing on *how* claims are treated within their field (testing, response to failure, progress). It stops early for clear non-science (Q1 fail, Q2 fail, Q3 fail) or degenerative programs (Q4 Degenerative). It flags pedagogically poor presentations (Q5 fail). Crucially, it identifies where scientific merit is weak/ambiguous but the *decision to include* rests on **values** (Q2/3 Ambiguous, Q4 Neutral, Q5 Flagged, or after any Hand-Back). Your key role is to enforce the procedure rigorously and explicitly frame the value judgments for the committee when the procedure reaches its limits.
