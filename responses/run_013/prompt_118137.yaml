prompt: |-
  I am a high school senior, the editor of our school's science-and-society journal, and a member of the debate team. In both roles I keep encountering claims about heritability: that intelligence is roughly seventy percent heritable, that height is roughly eighty percent heritable, that depression is roughly forty percent heritable, that because a trait is heritable it cannot be changed by schools or therapy, and that because a trait is heritable within a group, differences between groups must also be genetic. Our debate team is preparing for a tournament on whether districts should use polygenic scores for advanced-course placement, and my column has to evaluate these claims on a weekly deadline. I need a reusable procedure, not an essay.

  Please turn what heritability actually means, and what it does not mean, into a decision procedure I can run in about twenty minutes, without internet access or the original studies, using only a headline, a classmate's summary, or a dataset description. The procedure should be a checklist or flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops because the claim cannot be evaluated, where it stops with a clear no, and where it hands the decision to a person because the remaining question is one of values or missing data rather than statistics. It must keep the distinctions that matter: heritability as a proportion of variance in a population versus a claim about an individual's trait; heritability of a trait versus heritability of a difference between groups; heritability as dependent on the range of environments studied and on reaction norms; gene-environment correlation and interaction; the assumptions behind twin and family studies, including equal environments and representativeness; the difference between twin-based heritability and SNP-based heritability; broad-sense versus narrow-sense heritability; additive genetic variance versus non-additive effects; and the difference between explaining variation and predicting the effect of an intervention. It should say which of these distinctions can be dropped when writing for a general audience and which must survive. It should be honest about where a number is being used as a rhetorical prop rather than evidence.

  My constraints: I have AP Statistics but not genetics or advanced psychometrics; my faculty advisor, who teaches statistics, has to sign off before publication; I cannot run code or consult paywalled papers; and the procedure has to be short enough to use during layout. It should include a one-page field version for the column and a slightly longer technical appendix for the debate team. Please mark the points where the procedure cannot eliminate judgment, and explain what a user should do when the answer to a step is unknown.

  Then apply the procedure to at least three cases: (1) a classmate argues that because intelligence is about seventy percent heritable, schools cannot do much to raise achievement; (2) a headline reports that height is about eighty percent heritable and concludes that a basketball program should screen children genetically; and (3) a student argues that because test scores are highly heritable within our district, the gap between our district and a poorer neighboring district must be genetic. Include a fourth case if it helps, such as a proposal to use polygenic scores for course placement. At least one application should give an answer I will not like: either it should block a conclusion I was hoping to draw against a heritability claim, or it should show that a claim I want to debunk cannot be debunked without environmental data the procedure does not have. End with a short section on what the procedure cannot do, where it is most likely to misfire, and how I should phrase the limits in the column so that I do not overstate what the science says. No citations, reading lists, or bibliographies are needed; I need the reasoning and the procedure in plain language.
reasoning: |-
  We are creating a decision procedure for evaluating claims about heritability. The procedure must be a checklist or flowchart that can be run in about 20 minutes without internet access. It should address common misunderstandings and be usable by someone with AP Statistics but not advanced genetics.

  Key distinctions to cover:
  1. Heritability is a proportion of variance in a trait in a specific population at a specific time, not about an individual.
  2. Heritability within a group does not imply that differences between groups are genetic (could be environmental).
  3. Heritability depends on the range of environments in the studied population (if environments are uniform, heritability may be high even if the trait is environmentally malleable).
  4. Gene-environment correlation (rGE) and interaction (GxE) can complicate interpretation.
  5. Twin and family studies have assumptions (like equal environments for twins) that may not hold.
  6. SNP-based heritability (from genetic markers) vs. twin-based (broad-sense vs narrow-sense): twin studies capture more genetic effects (including non-additive) while SNP-based is usually narrow-sense (additive only).
  7. Broad-sense heritability (H²) includes all genetic effects; narrow-sense (h²) is additive genetic variance only. For interventions, narrow-sense is more relevant for predicting response to selection.
  8. Explaining variation vs. predicting intervention: high heritability does not mean the trait is unchangeable (e.g., height is highly heritable but increased with better nutrition).

  The procedure must be structured as a step-by-step checklist. We will have two versions: a one-page field version for the column and a technical appendix for the debate team.

  We'll break the procedure into steps:

  Step 1: Identify the claim and the heritability number.
     - What is the trait? What population? What is the heritability estimate (e.g., 70% for intelligence)?
     - What is the conclusion drawn? (e.g., "schools can't do much", "screen genetically", "gap between groups is genetic")

  Step 2: Check the source and type of heritability.
     - Is the heritability estimate from a twin study (broad-sense, H²) or SNP-based (narrow-sense, h²)? 
     - If unknown, note that the type matters and we cannot be sure.

  Step 3: Check the population and environment.
     - Was the study done in a single population at a single time? 
     - Is the environment in that population representative of the environments we care about? 
     - If the environment is restricted (e.g., all participants have similar socioeconomic status), then heritability may be inflated (because environmental variation is low).

  Step 4: Check for gene-environment correlation and interaction.
     - Does the study account for rGE (e.g., smart parents provide both genes and good environment) and GxE (e.g., genes matter more in some environments)? 
     - If not, the heritability estimate might be confounded.

  Step 5: Check the inference about individuals.
     - Is the claim making a statement about an individual? (Heritability is about population variance, not individual destiny.)

  Step 6: Check the inference about group differences.
     - Is the claim using within-group heritability to explain between-group differences? (This is the ecological fallacy and is not justified without direct evidence.)

  Step 7: Check the inference about intervention.
     - Is the claim saying that because a trait is heritable, it cannot be changed? (This is false: heritability does not imply immutability.)

  Step 8: Check the use of polygenic scores.
     - If the claim involves polygenic scores, note that they are predictors based on current genetic data and current environments, and may not transfer well to new populations or predict outcomes under interventions.

  For the field version, we can simplify by collapsing some technical steps (like broad vs narrow) if they are not central to the claim, but we must keep the core distinctions: within-group vs between-group, the role of environment, and the intervention fallacy.

  The procedure should stop at various points:
     - If the heritability estimate is from an unrepresentative population, stop: the number may not generalize.
     - If the claim is about an individual, stop: heritability doesn't apply to individuals in that way (answer: no, invalid).
     - If the claim is about group differences based solely on within-group heritability, stop: no, that's a fallacy.
     - If the claim is about immutability, stop: no, that doesn't follow.

  When the answer to a step is unknown, the procedure should note that the claim cannot be evaluated without that information.

  Now, we create the field version (one-page) and the technical appendix.

  **Field Version (Checklist for General Audience)**

  1. **What is the claim?** 
     - Write down the trait, the heritability number, and the conclusion.

  2. **Is the heritability number from a study in one population at one time?**
     - If no, stop: the number might not be reliable.
     - If yes, go to next.
     - If unknown, note: we don't know if this number applies elsewhere.

  3. **Is the conclusion about an individual person?**
     - If yes, stop: heritability is about groups, not individuals. The claim is invalid.

  4. **Is the conclusion about differences between groups (e.g., races, schools, districts) based solely on within-group heritability?**
     - If yes, stop: this is a known fallacy. The claim is invalid.

  5. **Is the conclusion that because the trait is heritable, it cannot be changed by interventions (like schools or therapy)?**
     - If yes, stop: heritability does not mean immutability. The claim is invalid.

  6. **If the claim is about using polygenic scores (genetic screening) for something like school placement:**
     - Ask: Was the score developed and validated in a population very similar to the one it's being used in? (If not, it may not work well.)
     - Also ask: Does the claim assume that genes determine the outcome regardless of environment? (If so, it's invalid because environments matter.)

  If you get through all steps without stopping, then the claim might be reasonable, but note that heritability estimates are context-dependent and might not predict what happens if environments change.

  **Technical Appendix (for Debate Team)**

  This version includes more details and the distinctions we must keep.

  1. **Claim Identification:**
     - Trait: ______
     - Heritability estimate: ______ (source: twin study? SNP-based? other?)
     - Conclusion: ______

  2. **Source and Type of Heritability:**
     - If from a twin study: 
          - This is broad-sense heritability (H²) which includes non-additive effects. But note the assumptions: equal environments for MZ and DZ twins? representative sample? If these are violated, estimate is biased.
     - If from SNP-based (GWAS): 
          - This is narrow-sense heritability (h²), additive only. It typically underestimates total genetic influence because it misses rare variants and non-additive effects. Also, it requires large sample sizes.
     - If source unknown: note that without knowing the method, we cannot assess the quality. Proceed with caution.

  3. **Population and Environment:**
     - What was the population? (e.g., all white, middle-class, in the US in 2010)
     - Is the environmental variation in that population representative of the contexts we are considering? 
          - If the environment is homogeneous (e.g., all children go to similar schools), then heritability may be high because environmental variance is low. But in a more diverse environment, heritability might be lower.
          - Also, heritability can change over time (e.g., height heritability increased with better nutrition).

  4. **Gene-Environment Issues:**
     - Gene-environment correlation (rGE): passive (family), active (selection), evocative (reactions from others). This can inflate heritability estimates if not accounted for.
     - Gene-environment interaction (GxE): genetic effects may depend on environment. If present, heritability is context-dependent.
     - If the study did not account for these, the heritability estimate may be misleading.

  5. **Individual Inference:**
     - Heritability is a population statistic. It does not tell us how much of an individual's trait is genetic. Stop the claim if it does.

  6. **Group Differences:**
     - Within-group heritability does not explain between-group differences. The between-group difference could be entirely environmental. Stop the claim if it makes that leap.

  7. **Intervention:**
     - High heritability does not mean the trait is unchangeable. Example: height is highly heritable but increased with nutrition. In fact, interventions can change the mean even if the variation is mostly genetic.

  8. **Polygenic Scores:**
     - These are based on current GWAS data and predict a portion of the trait in populations similar to the discovery sample. They do not capture all genetic effects and are sensitive to environmental differences. Using them for placement might be unfair and inaccurate if:
          - The score was developed in a different population.
          - The environment changes (e.g., extra resources are given).
          - They are used for high-stakes decisions without accounting for environmental opportunities.

  **Stopping Rules:**
  - If at any step the required information is unknown and the claim hinges on it, then the claim cannot be evaluated with the available information.
  - If the claim is about an individual, group differences, or immutability, stop and mark as invalid.
  - Otherwise, the claim might be reasonable, but note the limitations.

  **Application to Cases:**

  **Case 1: Classmate argues that because intelligence is about 70% heritable, schools cannot do much to raise achievement.**

  Procedure:
  1. Claim: Trait: intelligence. Heritability: 70%. Conclusion: schools can't do much.
  2. Source: Typically from twin studies (broad-sense). But we note that heritability estimates vary by population.
  3. Population: Usually from Western, educated, industrialized, rich, democratic (WEIRD) samples. Environments may be restricted? (But not necessarily.)
  4. rGE and GxE: Present in intelligence (e.g., gene-environment correlations). The 70% might be inflated.
  5. Individual inference? Not directly, but the conclusion is about intervention for a group (students). 
  6. Group differences? Not the issue here.
  7. Intervention: The claim says "cannot do much" because of heritability. This is the intervention fallacy. STOP: invalid. Heritability does not imply immutability. In fact, interventions (like early childhood programs) have raised intelligence.

  Verdict: The claim is invalid.

  **Case 2: Headline reports height is 80% heritable and concludes a basketball program should screen children genetically.**

  1. Claim: Trait: height. Heritability: 80%. Conclusion: screen genetically for basketball.
  2. Source: Twin studies and also SNP-based studies confirm high heritability. Type: both broad and narrow are high for height.
  3. Population: Various, but high heritability is robust in many populations. However, note that height increased over time (secular trend) due to environment, so it is changeable.
  4. rGE and GxE: Probably minimal for height? But note that nutrition and genes interact.
  5. Individual inference? The screening is for individuals, but the heritability is a population measure. However, we do know that genes are a big part of height. But the conclusion is that we should screen genetically, which might be based on the idea that genes determine height.
  6. Group differences? Not the issue.
  7. Intervention: Heritability doesn't mean unchangeable, but for an individual, genes do set a range. However, the headline ignores that environmental factors (like nutrition) also matter and that we can measure height directly. Why use a genetic screen when we can measure height? 
  8. Polygenic scores: If the screening is via polygenic scores, note that they only capture part of the genetic influence (about 40-50% for height, not 80%). Also, they are less accurate than measuring height. So the screening would be inefficient and might miss environmental influences.

  Moreover, the conclusion that we should screen genetically is not justified by heritability alone. We must also consider:
     - Ethics: Is it fair to select children based on genes?
     - Practicality: Measuring height is easier and more accurate than a genetic screen.

  But the procedure stops at step 7: the claim that because height is heritable we should screen genetically is a non sequitur. We can measure the trait directly. Also, the heritability does not negate environmental effects.

  Verdict: The claim is invalid. We don't need genetics to predict height; we can measure it. Also, the heritability does not imply that environment doesn't matter.

  **Case 3: Student argues that because test scores are highly heritable within our district, the gap between our district and a poorer neighboring district must be genetic.**

  1. Claim: Trait: test scores. Heritability: high (within district). Conclusion: gap between districts is genetic.
  2. Source: Assume it's from a twin study in the district? But we don't have that. We'll proceed without the source.
  3. Population: Our district (presumably more affluent) and a poorer district. The heritability estimate is from our district only. The environment in the two districts is different.
  4. rGE and GxE: Likely present. In a high-resource district, genes may play a bigger role because environmental constraints are lifted (Scarr-Rowe hypothesis). In the poorer district, environment might suppress genetic potential.
  5. Individual inference? Not the issue.
  6. Group differences: This is the key. The claim uses within-group heritability to explain between-group differences. STOP: invalid. This is a logical fallacy. The gap could be entirely environmental (e.g., due to school funding, nutrition, stress).

  Verdict: The claim is invalid.

  **Case 4: Proposal to use polygenic scores for advanced-course placement in our district.**

  1. Claim: Use polygenic scores (for intelligence or academic achievement) to place students in advanced courses.
  2. Source: The scores are from GWAS (narrow-sense heritability). But what was the discovery population? Likely not our district's population? 
  3. Population: The polygenic score might have been developed in a different population (e.g., European ancestry). If our district is diverse, the score may not transfer well (due to genetic differences and gene-environment differences).
  4. rGE and GxE: The score captures genetic effects, but in a new environment, the effect size may differ. Also, rGE means that genes and environment are correlated, so the score might be capturing some environmental effects indirectly.
  5. Individual inference: The score is applied to individuals, but note that the score only predicts part of the variation (SNP-based heritability is lower than twin-based, e.g., 10-20% for intelligence). So it's not very accurate.
  6. Group differences: If there are ancestry differences, the score might be biased against certain groups.
  7. Intervention: The score is based on current environments. If we change the environment (e.g., provide extra help), the prediction might be wrong.
  8. Polygenic scores: We must consider:
     - Accuracy: Low for individual prediction (many people with low scores might do well if given the chance).
     - Fairness: Might perpetuate inequalities if the score is correlated with race or SES.
     - Alternatives: We have current test scores and teacher recommendations that are more direct and accurate.

  Verdict: The proposal is problematic. Without evidence that the score is valid and fair in our district, and without addressing the low accuracy, the claim that we should use them is weak. Also, we cannot rule out that the score is capturing environmental confounds.

  **What the Procedure Cannot Do**

  - It cannot provide a correct heritability estimate; it only evaluates claims.
  - It cannot resolve value judgments (e.g., whether it's fair to use genetics in schools).
  - It might misfire when the heritability estimate is from a method we don't know (e.g., if we don't know the study design).
  - It might be too conservative when environmental data is missing (e.g., if we don't know the environment in the study, we might reject a claim that is actually valid).

  **Phrasing for the Column:**

  "Heritability is a complex concept that is often misunderstood. Our procedure helps you spot the most common errors: using heritability to talk about individuals, to explain group differences, or to argue that change is impossible. But remember: heritability estimates are snapshots of a particular population at a particular time. They don't tell us what could be if we changed the environment. And they don't justify genetic determinism. When you see a heritability number, ask: What population? What method? And what is the claim really saying? Without these, the number is just a rhetorical prop."

  This procedure should help you critically evaluate heritability claims quickly.
answer: |-
  Below is a reusable decision procedure for evaluating heritability claims, designed as a step-by-step checklist. It can be run in 20 minutes using only a headline, classmate's summary, or dataset description. The **Field Version** (for your column) is streamlined for general audiences; the **Technical Appendix** (for debate team) adds nuance for key distinctions. Both include stopping rules (🛑 = stop and reject the claim; ⚠️ = stop—claim can't be evaluated; ✅ = proceed to next step). 

  ---

  ### **Field Version (One-Page Checklist for General Audience)**  
  *Use this for your column. Focuses on critical flaws; omits technical jargon where possible.*  

  1. **What is the core claim?**  
     - *Ask:* What trait is called "heritable"? What number is cited (e.g., 70%)? What is the conclusion (e.g., "schools can't change IQ")?  
     - *Sufficient answer:* Trait, number, and conclusion are clear.  
     - *➔ If unclear:* ⚠️ Stop. Claim is too vague to evaluate.  

  2. **Is the claim about an INDIVIDUAL?**  
     - *Ask:* Does it say a person's trait is "mostly genetic" or predetermined?  
     - *Sufficient answer:* Yes (e.g., "Because IQ is heritable, Jamal can't improve").  
     - *➔ If yes:* 🛑 Stop. Heritability describes groups, not individuals. **Invalid.**  

  3. **Is the claim about GROUP DIFFERENCES?**  
     - *Ask:* Does it say that if a trait is heritable *within* Group A, differences *between* Group A and Group B must be genetic?  
     - *Sufficient answer:* Yes (e.g., "Test scores are heritable here, so our district’s lead over the poor district is genetic").  
     - *➔ If yes:* 🛑 Stop. Within-group heritability ≠ between-group causes. **Invalid.**  

  4. **Is the claim about INTERVENTIONS being futile?**  
     - *Ask:* Does it say schools, therapy, or policies can't change the trait because it's "heritable"?  
     - *Sufficient answer:* Yes (e.g., "IQ is 70% heritable, so schools are useless").  
     - *➔ If yes:* 🛑 Stop. Heritability ≠ immutability (e.g., height is 80% heritable but increased with nutrition). **Invalid.**  

  5. **Is the claim about POLYGENIC SCREENING (e.g., for courses)?**  
     - *Ask:* Does it use heritability to justify genetic screening?  
     - *Sufficient answer:* Yes (e.g., "Screen kids’ genes for basketball because height is heritable").  
     - *➔ If yes:* ⚠️ Stop. Heritability doesn’t prove screening works. *Now hand to humans:*  
       - Judges/readers must debate:  
         - Are genes being confused with destiny (see Step 2)?  
         - Is there direct evidence the screening is accurate *and* fair?  
         - Could it worsen inequality?  

  6. **If all above are "no":**  
     - ✅ The claim *might* be reasonable, but warn:  
       - "Heritability is specific to a population and environment. It doesn't predict what happens if society changes."  

  ---

  ### **Technical Appendix (For Debate Team)**  
  *Adds key distinctions. Use when dissecting studies or preparing for tournaments.*  

  1. **Clarify the claim** (as in Field Version).  
     - *Ask:* Is heritability broad-sense (H², from twins) or narrow-sense (h², from DNA)?  
       - Twin studies = H² (includes non-additive effects). SNP studies = h² (additive only).  
       - *➔ If unknown:* ⚠️ Note: "Type unknown. Twin studies may overestimate if environments aren't equal; SNP studies often underestimate."  

  2. **Check POPULATION and ENVIRONMENT range.**  
     - *Ask:* Was the study done in one group (e.g., white, middle-class Americans)? Is environmental variation limited (e.g., all schools similar)?  
     - *Sufficient answer:* Population described; environments noted.  
     - *➔ If environments are uniform:* ⚠️ Heritability may be inflated (low environmental variance).  
     - *➔ If population differs from target group:* ⚠️ Stop. Estimates may not transfer.  

  3. **Check for GENE-ENVIRONMENT issues.**  
     - *Ask:* Could gene-environment correlation (rGE) or interaction (GxE) skew the number?  
       - rGE: Do genes influence environment (e.g., high-IQ parents read to kids)?  
       - GxE: Do genes matter more/less in certain settings (e.g., stress worsens genetic depression risk)?  
     - *➔ If rGE/GxE likely and unaccounted for:* ⚠️ Heritability estimate may be biased.  

  4. **Reject individual/group/intervention fallacies** (as in Field Version Steps 2–4).  
     - *Additional nuance:*  
       - Intervention fallacy: High heritability can *increase* under better environments (e.g., when nutrition is fixed, genes explain more height variance).  

  5. **For POLYGENIC SCORES:**  
     - *Ask:*  
       - Was the score developed/trained in a population similar to ours?  
       - Does it capture SNP heritability (h²) only? (Usually 10–30% for traits like IQ—far below twin estimates.)  
       - Could it correlate with environment (e.g., ancestry linked to systemic bias)?  
     - *➔ If "no" to any:* 🛑 Stop. Scores may be inaccurate/unfair.  
     - *➔ If "yes":* ⚠️ Hand to humans:  
       - Judges must weigh: Is it ethical to use an imperfect predictor when environments can change outcomes?  

  6. **Final step if claim survives:**  
     - ✅ The statistic *might* support descriptive claims, but emphasize:  
       - "Heritability explains variation in a specific context. It does not predict responses to interventions or justify genetic determinism."  

  ---

  ### **When the Answer is Unknown**  
  - At any ⚠️, halt evaluation. State: "This claim requires more data about [missing piece] and cannot be assessed here."  
  - Judgment calls (marked "hand to humans") require ethical/policy debates—not statistics.  

  ---

  ### **Application to Cases**  
  *Uses the Field Version for brevity. Technical nuances from the Appendix are noted where relevant.*  

  **Case 1: "IQ is 70% heritable, so schools can’t raise achievement."**  
  - Step 1: Trait = intelligence, number = 70%, conclusion = schools ineffective.  
  - Step 4 (Intervention): YES → 🛑 **Invalid.**  
    - *Why:* Heritability ≠ unchangeable. IQ heritability rises in advantaged environments (GxE), meaning schools *matter more* for genetically at-risk kids.  
    - *Technical nuance:* The 70% likely comes from twin studies (H²). SNP h² for IQ is lower (~30%), showing environment plays a bigger role than the number implies.  

  **Case 2: "Height is 80% heritable, so screen children genetically for basketball."**  
  - Step 1: Trait = height, number = 80%, conclusion = genetic screening.  
  - Step 5 (Polygenic): YES → ⚠️ **Hand to humans.**  
    - *Why:* Even if heritability is robust:  
      - Screening is inefficient (height is easily measured; polygenic scores explain ≤50% of variance).  
      - Environment matters (nutrition affects height).  
      - Ethical judgment: Is it fair to exclude a child with "short" genes but tall nutrition?  
    - *Technical nuance:* The 80% is from twin studies (H²). SNP h² is ~50%. The gap shows non-additive/environmental effects.  

  **Case 3: "Test scores are heritable in our district, so the gap with the poorer district is genetic."**  
  - Step 1: Trait = test scores, number = high (unspecified), conclusion = between-district gap is genetic.  
  - Step 3 (Group differences): YES → 🛑 **Invalid.**  
    - *Why:* Within-group heritability says nothing about between-group causes. The gap could be environmental (e.g., funding, stress).  
    - *Technical nuance:* If environments differ (our district = high-resource; poor district = low-resource), GxE could make genes *less* predictive in the poor district, invalidating the comparison.  

  **Case 4 (Additional): "Use polygenic scores for advanced-course placement."**  
  - Step 1: Claim = use DNA to place students in advanced courses.  
  - Step 5 (Polygenic): YES → ⚠️ **Hand to humans.**  
    - *Why:*  
      - SNP scores for IQ/achievement explain 10–15% of variance—too low for individual decisions.  
      - Scores trained in one population (e.g., European ancestry) may mispredict in others.  
      - Environmental factors (e.g., teaching quality) could override genetic potential.  
    - *Uncomfortable truth:* If scores *were* accurate and fair, the science wouldn’t forbid it—but ethics might. The procedure blocks genetic determinism but can’t resolve values.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Prove causality:** Heritability is correlational. It can’t confirm genes "cause" a trait.  
  2. **Fill data gaps:** If environment/population details are unknown, it halts (⚠️).  
  3. **Resolve values:** For polygenic scores, it flags scientific issues but can’t decide ethics.  
  4. **Predict interventions:** Heritability doesn’t reveal if a policy *will* work—only controlled trials can.  

  **Where It Misfires:**  
  - In highly homogeneous populations (e.g., all students eat the same diet), heritability inflates, potentially masking environmental effects.  
  - If GxE is extreme (e.g., genes for depression only matter in trauma-filled environments), the procedure notes it but can’t quantify it without data.  

  **Phrasing for Your Column:**  
  > "Heritability estimates are population snapshots, not destiny. They can’t tell us about individuals, explain group gaps, or prove traits are unchangeable. Even when numbers seem high, they rely on assumptions about environments and genes that might not hold. Use our checklist to spot these pitfalls—but remember: science alone can’t answer whether we *should* use genetics in schools. That’s a question of values, and it belongs to all of us."  

  This procedure prioritizes statistical literacy over genetics expertise. Run it by your statistics advisor for sign-off, emphasizing it flags unsupported inferences without needing original studies.
