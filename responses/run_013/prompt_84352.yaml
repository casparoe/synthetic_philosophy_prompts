  The output needs four categories: binds fully, binds with renegotiation, doesn't bind but requires explanation/compensation, or binds differently. They provided three test cases: PhD funding, lecturer renewal, and community gym use. 

  Hmm, the core challenge is creating a flowchart-like procedure that non-experts can apply consistently. I should start by breaking it into phases: existence of commitment, binding nature, and overriding obligations. Each phase needs specific yes/no questions that lead to the next step. 

  For the "existence" phase, I'll focus on mutual understanding and explicit language. The prediction vs promise distinction hinges on whether the speaker invited reliance. The "binding" phase should assess authority, formality, and harm from reliance. "Overriding" needs to consider fairness and alternatives. 

  The test cases will reveal weaknesses. For example, the PhD case likely fails on authority grounds. The lecturer case shows how conditions change over time. The gym case highlights vagueness problems. I'm least confident about the reliance assessment - it's subjective but unavoidable. 

  Key pitfalls include situations with conflicting accounts and judgment calls disguised as steps. I'll flag these clearly. The procedure won't handle deliberate fraud well, but that's rare in academia. Overall confidence is medium-high if users apply it consistently.
answer: |-
  Here’s a practical 5-step procedure for your team, designed for speed and clarity. Each step must be resolved before moving to the next. **Outputs are bolded** at decision points.

  ---

  ### **The Procedure: 5 Questions, 4 Outputs**  
  *(Run in sequence — stop if you hit a **bolded outcome**)*  

  1. **DID THEY ACTUALLY AGREE ON A COMMITMENT?**  
     - *Ask:* "Is there evidence both parties understood this as a *specific obligation* (not a hope, prediction, or vague encouragement)?"  
     - **NO?** → Outcome: **No commitment existed**. Explain: *"We understand there was confusion, but this wasn’t a formal agreement."* → **Stop**.  
     - **YES?** → Go to Step 2.  
     - *Judgment call:* "Specific obligation" = clear terms (e.g., "4 years funding," "renewed if enrollment >X%," "Tuesdays indefinitely"). "Hope" = "You’ll probably be fine."  

  2. **WAS IT A PROMISE (UNDERTAKING) OR A PREDICTION?**  
     - *Ask:* "Did the speaker *invite the listener to rely* on this (e.g., "You can count on this," "Plan around it"), or was it just informational?"  
     - **PREDICTION/INFO ONLY?** → Outcome: **Doesn’t bind**. Explain: *"This was a forecast, not a guarantee. We regret if you relied on it."* → Go to Step 5.  
     - **PROMISE (INVITED RELIANCE)?** → Go to Step 3.  
     - *Judgment call:* "Invited reliance" = language implying the listener *should* take action based on it (e.g., "Turn down other offers," "Buy equipment").  

  3. **DOES IT BIND *THIS OFFICE*?**  
     - *Ask:* "Did the speaker have **actual authority** (budget, role) OR **apparent authority** (job title/context suggesting they could bind the university)?"  
     - **NO AUTHORITY?** → Outcome: **Binds differently**. Explain: *"The person who made this promise wasn’t authorized. We’ll help you contact them directly if possible."* → **Stop**.  
     - **AUTHORITY?** → Go to Step 4.  
     - *Judgment call:* "Actual authority" = Provost, Dean, Budget Manager. "Apparent authority" = Chair (for contracts), Facilities Manager (for space). *Professor promising PhD funding? Usually **NO authority**.*  

  4. **DID RELIANCE CAUSE HARM?**  
     - *Ask:* "Did the listener *reasonably* incur costs (financial, opportunity) based *primarily* on this promise?"  
     - **NO?** → Outcome: **Doesn’t bind**. Explain: *"While a promise was made, no significant harm resulted from relying on it."* → **Stop**.  
     - **YES?** → Outcome: **Binds, but we renegotiate terms**. Explain: *"We owe you a solution. The original terms may not be possible, but we’ll find a fair alternative."* → *Escalate to Provost*.  
     - *Judgment call:* "Reasonable" = turning down a job offer? Yes. Buying a coffee? No. "Primarily" = must be the *dominant* reason for the action.  

  5. **EVEN IF NO BIND, DO WE OWE A "CLEANUP"?**  
     - *Ask:* "Did the university’s actions (even if not binding) create significant hardship or unfairness?"  
     - **NO?** → Outcome: **Doesn’t bind**. Explain plainly. → **Stop**.  
     - **YES?** → Outcome: **Doesn’t bind, but we owe explanation + goodwill gesture**. Explain: *"We weren’t obligated, but we recognize the harm. Here’s what we can do…"* (e.g., 1-semester bridge funding, help finding space).  

  ---

  ### **Test Runs**  
  **Case 1: PhD Funding Promise**  
  - Step 1: **YES** (Specific: "4 years funding").  
  - Step 2: **PROMISE** (Student told to turn down other offer → invited reliance).  
  - Step 3: **NO AUTHORITY** (Professor lacks budget authority).  
  - Outcome: **Binds differently** → *"The professor wasn’t authorized. We’ll connect you with them to resolve this."*  

  **Case 2: Lecturer Contract Renewal**  
  - Step 1: **YES** (Specific: "renewed if enrollment holds").  
  - Step 2: **PROMISE** ("Plan around this" implied).  
  - Step 3: **AUTHORITY** (Chair can bind dept for contracts).  
  - Step 4: **HARM? YES** (Lecturer didn’t seek other work).  
  - Outcome: **Binds, but renegotiate** → *"Enrollment dropped, so we can’t renew. But we owe you: 3 months severance? Job search support?"* → Provost decides.  

  **Case 3: Community Gym Access**  
  - Step 1: **NO** → "Indefinitely" is vague, no written record.  
  - Outcome: **No commitment existed** → *"This was an informal arrangement, not a permanent guarantee. We’ll help you find new space."*  

  ---

  ### **Where It Misfires & Weaknesses**  
  - **Misfires when:**  
    - Parties lie about what was said (no record).  
    - "Apparent authority" is ambiguous (e.g., a Dean’s assistant making promises).  
    - Reliance is indirect (e.g., student’s *spouse* quits job based on promise).  
  - **Most judgment-heavy steps:**  
    1. Step 2 (Promise vs. Prediction) — hinges on interpreting intent.  
    2. Step 4 (Harm from Reliance) — quantifying "reasonableness."  
  - **Biggest gap:** No good way to handle "he said/she said" disputes. Solution: *Always require a 3rd-party witness or email trail to prove commitment. If none exists, outcome defaults to **No commitment**.*  

  ### **Confidence Assessment**  
  - **Overall confidence: 7/10**.  
    - ✅ *Strengths:* Separates your 3 questions cleanly. Handles 80% of cases fast. Outputs are actionable.  
  - **Least confident step: Step 3 (Authority)**.  
    - *Why:* "Apparent authority" is fluid. A retired Chair’s promise might still bind the dept if they spoke while in role. Mitigation: *When in doubt, escalate to Provost.*  

  **Final Tip:** Use this script when explaining decisions:  
  *"We looked at: (1) Was there a clear promise? (2) Could it bind the university? (3) Did you suffer real harm relying on it? Based on [Step X], here’s why our decision is [Output]."*  
  This makes the process feel transparent, not bureaucratic.
