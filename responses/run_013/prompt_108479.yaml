  Weather will parallel communication breakdown: thickening fog mirrors growing misunderstandings. Final image might be the relief keeper watching fog swallow the lighthouse beam, wondering if any signal truly reaches its target. The unanswered question hangs like the inquiry's unresolved verdict.
answer: |-
  ## The Fog Signal

  Eleven winters sculpt silence into a language all its own. Malcolm’s knuckles, gnarled as driftwood, tapped the brass barometer. *Tap-tap-tap*. Not about the pressure drop. Arlen, polishing the same lens segment for ten minutes, knew it meant: *Stop worrying about the supply boat, it’ll come when it comes.* Or maybe: *This new boy talks too much.* Finn, the relief keeper, fresh off the mainland steamer and smelling of salt and unfamiliar soap, just saw a man tapping a barometer.

  The fog wasn’t just outside; it seeped into the lantern room, blurring the edges of things. Finn strained to hear the nuance in the veterans’ sparse exchanges.

  "Kettle’s singing," Malcolm grunted later, staring not at the stove, but out the salt-caked window at the churning, grey-green swells far below.

  "Sharp note," Arlen replied, not glancing up from his logbook. He wrote nothing.

  Finn, eager, went to lift the whistling kettle. "Almost boiled dry," he announced.

  Two pairs of eyes, old as the rocks themselves, flickered towards him, then away. A beat of silence, thicker than the fog. Finn felt the heat creep up his neck. He’d missed something.

  * * *

  The storm hit three nights later. Not unusual, but this one had teeth. The light sliced through the murk, its rhythmic groan a counterpoint to the wind’s shriek. Waves slammed the cliff base like battering rams. Finn, on watch, felt the tower tremble.

  Malcolm appeared in the lantern room doorway, his oilskin slick. He didn’t look at the storm, but at Arlen, who was methodically checking the gear.

  "Glass is falling sharp," Malcolm said. His voice was flat, utterly matter-of-fact.

  Arlen froze mid-motion. Not a muscle moved except for a tightening around his eyes. He didn’t look at Malcolm. "Sharp, is it?" he finally murmured, his voice barely audible over the wind. He resumed his checks, faster now.

  Finn waited for more. An order, a warning, *something*. Nothing came. Malcolm vanished back downstairs. The phrase echoed in Finn’s head: *Glass is falling sharp.* Literally true – the barometer needle *was* plunging. Utterly innocuous weather talk. Yet the air crackled with an unspoken dread. Arlen’s knuckles were white on the wrench he held.

  Later, huddled over weak tea in the galley, the storm’s fury shaking the very foundations, Finn couldn’t hold back. "Earlier... Malcolm said the glass was falling sharp. Did he... did he mean...?" He trailed off, unsure how to articulate the heavy, unspeakable thing he felt hanging between them – danger, doom, *this is the one that might get us*.

  Arlen’s head snapped up. His eyes, usually hooded and unreadable, were wide, almost startled. "Mean? Mean *what*? It’s a fact, boy. Barometer’s dropping. Means low pressure. Storm." His voice was sharp, defensive. He looked away, into the dark corner of the room. "Just stating the obvious."

  Was it denial? A retreat from the terrifying implication Finn sensed? Or was Finn simply imagining layers where there were none? Arlen’s face, etched deep with lines of weather and watchfulness, gave nothing else away. The denial hung there, unresolved, another layer of fog.

  * * *

  The *Selkie’s Call* foundered on the Black Teeth rocks at 03:17. They heard the terrible, final crunch even over the storm. Saw nothing. Did what they could with horns and lights, knowing it was likely futile. Dawn revealed the carnage: splintered timbers, a single, sodden lifebelt washing ashore like a cruel joke.

  * * *

  The inquiry was a perfunctory affair held in the cramped lighthouse office a week later. Owners’ representatives, maritime board men in stiff collars, smelling of tobacco and bureaucracy. The question was inevitable: "Was a timely warning given? Before she struck?"

  Evidence was scant. The *Selkie’s Call*’s log was gone. Their own horn log showed signals blown. Then, the owners’ man produced a small, battered cassette recorder. "We salvaged this from the mate’s cabin. Seems he liked to record weather reports. Picked up your local channel sometimes, through the static."

  He pressed play. Hiss. Crackle. The whine of the storm. Then, cutting through, surprisingly clear, Malcolm’s voice, tinny and distant from the little speaker:
  **"Glass is falling sharp."**

  Silence in the office. All eyes turned to Malcolm. He sat hunched, staring at his hands.

  "Mr. Bryce," the chairman asked gravely. "That was your voice, recorded approximately one hour before the *Selkie’s Call* altered course towards the headland, according to their last known position. What was the context of that statement? Was it a warning?"

  Malcolm didn't lift his head. "Context? Weather report. On the local channel. I read it. Standard broadcast." His voice was a rasp.

  Finn felt Arlen tense beside him. He remembered the lantern room. The tightening around Arlen’s eyes. The unsaid thing that vibrated in the air. Was *this* recording, this ghost-voice from a dead ship, *meant*? It was Malcolm’s voice, Malcolm’s words. But spoken into a microphone for an unknown, impersonal audience hours before the real moment in the lantern room. Was it just data then? Did it *become* a warning only later, in that charged silence shared with Arlen? Or had it always carried that potential weight, even when broadcast?

  The inquiry chairman leaned forward. "But did you *intend* it as a warning, Mr. Bryce? When you broadcast it? Or later, when you repeated it?"

  Malcolm finally looked up. His eyes, pale and washed-out like sea-bleached glass, swept over the officials, rested for a fraction of a second on Arlen, then settled on Finn, who felt pinned by their ancient weariness. "Intend?" Malcolm repeated the word slowly, as if tasting something unfamiliar. "I intended to read the weather report. Words mean what they mean." He paused, the silence heavy. "Who’s to say what gets heard?"

  The owners’ man sighed impatiently. "So, was a warning given? Yes or no?"

  Arlen stirred. "The words were spoken," he said, his voice low but clear. "Over the air. And in the lantern."

  "But *meaning*?" Finn heard himself whisper, too late. The officials ignored him.

  The chairman scribbled a note. "The words were transmitted and received. The barometric drop *was* significant. We’ll note the communication occurred."

  They moved on to tide charts. Finn looked out the window. Fog was rolling in again, tendrils creeping over the cliff edge. He thought of Malcolm’s words echoing from the little recorder, untethered from any human presence on the doomed ship. He thought of the same words spoken later, heavy with eleven winters of shared peril and unspoken understanding, instantly recognized by Arlen, instantly denied when questioned. He thought of the words now, written in an official log: *communication occurred*.

  Had meaning? Had it ever? The fog outside swallowed the rocks, the sea, the distant horizon. Inside the office, the drone of voices discussing currents and regulations faded into a meaningless hum. Finn watched Malcolm’s profile, stone-still, looking not at the officials, nor at the recorder, nor at Arlen, but at some fixed point in the middle distance, where the fog met the grey sea, utterly unreachable. The question hung, thick and choking in the room, unanswered, perhaps unanswerable: *What did he mean? Was a warning given?* The only certainty was the relentless, indifferent crash of waves below, carrying the splintered remains of the *Selkie’s Call* out to deeper, darker water.
