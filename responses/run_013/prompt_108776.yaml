answer: |-
  ### Hegelian War Theory Translated into Strategic Vocabulary

  **Recognition Rents:**  
  Hegel’s state seeks *recognition rents* as a core objective of war. Conflict arises when states demand acknowledgment of their sovereignty, autonomy, or status from peers. War becomes a mechanism to extract these rents when diplomatic signalling fails, as victory forces rivals to confer legitimacy. However, Hegel treats this as an *ethical imperative*, not merely a payoff—states *must* pursue recognition to validate their existence. Your framework captures the rent-seeking but not its moral necessity.

  **Internal-Audit Value:**  
  War provides critical *internal-audit value* by testing domestic cohesion. Hegel posits that conflict reveals whether citizens will sacrifice for the state, exposing the robustness of social contracts and institutional resilience. A state’s willingness to fight audits its "ethical substance" (collective identity). Yet this audit transcends cost-benefit analysis: it’s a *revelatory moment* that defines the state’s ethical reality, not just informational.

  **Ethical Slack:**  
  States deploy *ethical slack* to wage wars that affirm their self-conception. For Hegel, war consumes surplus resources (material and spiritual) to sustain the state’s purpose beyond survival. It redirects civil society’s "excess energy" toward communal ideals, preventing decadence. Your term fits but implies discretionary spending; Hegel sees this expenditure as *existential maintenance*, not optional investment.

  **Sovereignty Premium:**  
  Hegel’s state prizes an absolute *sovereignty premium*: it recognises no higher authority. War defends this premium by rejecting external adjudication, affirming the state as sole arbiter of its interests. Your term aligns perfectly here—no distortion. The premium is non-negotiable and justifies war as the ultimate assertion of autonomy.

  ---

  ### Residue Report  

  **(a) War as ethical moment, not policy instrument**  
  *Survives with distortion*. Your framework reduces ethics to contingent payoffs (e.g., recognition rents). Hegel’s "ethical life" (*Sittlichkeit*) frames war as constitutive of state identity—a *duty* to actualise collective freedom. The distortion arises because your model cannot represent non-instrumental motives as irreducible imperatives.  

  **(b) War as preservative against corruption/ossification**  
  *Survives with distortion*. "Internal-audit value" partially captures the diagnostic function, and "ethical slack" the redirection of surplus. But Hegel’s claim is substantive: war *actively regenerates* social virtue by dissolving private interests into collective will. Your terms imply passive revelation; Hegel demands an *active, transformative* role.  

  **(c) Sovereignty as unlimited by tribunals**  
  *Survives intact*. Fully mapped to *sovereignty premium*. Hegel’s absolutism is compatible with your framework’s prioritisation of autonomy.  

  **(d) World history as court judging states**  
  *No counterpart*. Your framework lacks a transcendent evaluator. Hegel’s "world spirit" (*Weltgeist*) uses historical outcomes to morally assess states, rewarding those advancing freedom. This is metaphysical, not operational—no equivalent to reversion outcomes or bargaining ranges. Defect: your model excludes teleological historical drivers.  

  **(e) War revealing ethical unity**  
  *Survives with distortion*. "Internal-audit value" identifies war’s role in exposing domestic cohesion, but Hegel’s "actualisation" means war *creates* unity through sacrifice, transforming latent bonds into conscious solidarity. Your framework cannot model this *constitutive effect*—it treats unity as pre-existing information, not emergent property.  

  **Failures:**  
  - *Defects in your framework*: Inability to formalise (a) non-instrumental ethics, (d) historical teleology, or (e) emergent unity.  
  - *Hegel’s substantive claims*: (b) and (e) are robust but require metaphysical commitments your model rejects; (d) is poetic but empirically hollow.  

  **Recommendations:**  
  - **Revise to accommodate** the *constitutive function* of war (point e). Your framework could integrate mechanisms where conflict forges domestic cohesion, not just reveals it. This enriches "internal-audit value" by adding *identity-formation*.  
  - **Leave behind** "world history as court" (point d). It offers no analytical leverage for crisis-bargaining and imposes unverifiable metaphysics.  

  ---  
  **Output Summary**: Hegel’s core claims about sovereignty, recognition, and internal cohesion *can* be partially translated, but his teleology and ethical metaphysics exceed your framework’s materialist bounds. The residue highlights where strategic models must either expand or acknowledge normative limits.
