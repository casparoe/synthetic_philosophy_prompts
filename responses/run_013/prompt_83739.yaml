  Next, the user's audience: half grad school friends who'll get philosophical references, half family who might not. The toast needs to balance depth with accessibility. The user wants to avoid clichés, especially the "marriage is a promise" line. They also want authenticity—no pretending the argument is resolved. The toast should acknowledge the ongoing debate while celebrating their relationship.

