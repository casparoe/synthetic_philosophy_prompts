answer: |-
  Here is a complete specification of desiderata for an adequate theory of "dirty hands" (DH), grounded in your cases and concerns. Each requirement is paired with its motivating case or consideration, followed by an analysis of tensions and a brief evaluation of leading positions.

  **Desiderata for an Adequate Theory of Dirty Hands**

  1.  **Simultaneous Wrongness & Justification (The Core Tension):** The theory *must* explain how an act can be both **genuinely morally wrong** (prohibited, blameworthy) **and** the **right, justified, or even obligatory thing to do** in the specific circumstances.  
      *   **Motivation:** Bombing city (intentional killing of innocents is wrong, yet necessary to end a just war/save more lives); Torture interrogation (torture is intrinsically wrong, yet seemingly necessary to stop imminent mass murder).

  2.  **Non-Culpability for Non-Action (Integrity's Cost):** The theory *must* explain why the agent who **refuses to perform the DH act**, thereby allowing a greater harm to occur, is **not morally culpable for that greater harm** (or only minimally so), and why their **integrity is genuinely admirable**, even if their choice is tragic.  
      *   **Motivation:** The person who refuses to torture/bomb/lie and is admired for integrity – their inaction directly causes worse consequences, yet they escape blame and gain moral credit.

  3.  **Distinction from Moral Tragedy:** The theory *must* distinguish DH scenarios from **genuine moral tragedies** where no permissible action is available and no one is blameworthy. DH involves an agent *choosing* to commit a wrong, not merely being trapped by circumstance.  
      *   **Motivation:** Contrast DH cases (leader *chooses* to bomb/tortue/lie) vs. Sophie's Choice (no morally safe option exists, fault lies with the situation).

  4.  **Distinction from Hard Choices:** The theory *must* distinguish DH from **merely hard choices among permissible options** (e.g., saving one child vs. another when only one can be saved). The DH act retains its intrinsic wrongness even when chosen.  
      *   **Motivation:** Legislator lying/breaking promise (lying/breaking promises is inherently wrong, unlike choosing which permissible rescue to perform).

  5.  **Distinction from Regret:** The theory *must* distinguish the **guilt/residue** in DH from mere **regret** about a justified act with bad side-effects (e.g., collateral damage regret). The residue must be tied to the *wrongness* of the act itself.  
      *   **Motivation:** Bombing city (distinguish genuine guilt over *targeting* civilians/accepting their deaths as a means vs. regret over unintended casualties despite precautions).

  6.  **Agent-Centric Residue (Guilt is Real & Personal):** The theory *must* explain why the **moral residue (guilt, taint) attaches primarily and uniquely to the agent** who performs the DH act, demanding acknowledgment (confession, penance, feeling), and why this residue is a **genuine moral remainder**, not merely a psychological cost to be weighed in the calculation.  
      *   **Motivation:** The leader feels *personally* guilty/tainted after authorizing torture/bombing, needing to "bear the burden," distinct from institutional responsibility or societal cost-benefit.

  7.  **Non-Instrumental Guilt:** The theory *must* explain why the **guilt/residue is appropriate and non-eliminable** even if the act was justified, necessary, and the agent did the best they could. It shouldn't be seen *only* as a deterrent or a psychological tax.  
      *   **Motivation:** The justified torturer/bomber *should* feel guilt; this guilt isn't a sign they miscalculated, nor is it solely useful for preventing future abuses – it's a response to the wrong done.

  8.  **Distinction of Agent & Institution:** The theory *must* clearly separate the **dirtiness of the agent's hands** from the **responsibility or complicity of the institution** authorizing, benefiting from, or creating the conditions for the DH act.  
      *   **Motivation:** A soldier following legal orders vs. the state crafting the policy; the legislator lying vs. the corrupt system forcing the lie. The agent's personal guilt persists even if the institution is also blameworthy.

  9.  **Constraint Against Manufactured Necessity:** The theory *must* provide **rigorous criteria to constrain "necessity"** and prevent it from being a post-hoc justification for desired acts. It must explain why DH requires a *genuine, immediate, and overwhelming* conflict of values/duties.  
      *   **Motivation:** The "mirror-image worry" – DH cannot become a carte blanche for violating norms whenever convenient; torture "ticking bomb" scenarios must be rigorously defined to avoid abuse.

  10. **Treatment of Victims:** The theory *must* say something substantive about **what is owed to the victims** of the DH act (e.g., the tortured suspect, the bombed civilians, the betrayed colleague). It must address whether their **consent (hypothetical or actual) could ever mitigate the wrongness or the residue**, and the nature of the debt owed (apology, reparation, memorial).  
      *   **Motivation:** The victim is wronged, not merely harmed; their status demands recognition beyond being a cost in a calculation. Could a civilian *consent* to being bombed for the greater good? What does justice demand for them?

  **Analysis of Tensions & Leading Positions**

  *   **Core Conflict:** Your suspicion is correct. The deepest tension lies between **Requirement 1 (Simultaneous Wrongness & Justification)** and **Requirement 7 (Non-Instrumental Guilt)**. If the act is *justified*, why is guilt appropriate (beyond regret)? If guilt is *appropriate and non-eliminable*, how can the act be fully justified? Reconciling this is the central challenge. A theory resolving this tension decisively shapes whether it leans consequentialist (justification swamps wrongness, guilt becomes instrumental) or deontological (wrongness persists, justification is pragmatic but morally incomplete).
  *   **Other Tensions:** Requirement 2 (Non-Culpability for Non-Action) conflicts with simple consequentialism (refusing to act *is* culpable if it causes worse outcomes). Requirement 10 (Victim Owed) may conflict with theories that focus solely on the agent's guilt (ignoring victim claims) or with Requirement 1 if acknowledging victim debt undermines justification.

  **Evaluation of Leading Positions Against Desiderata:**

  | Requirement | Strict Prohibition (Kantian-ish) | Consequentialist | Tragic Remainder (Williams, Walzer-ish) |
  | :---------- | :------------------------------ | :-------------- | :------------------------------------- |
  | **1. Simultaneous Wrong/Right** | ✘ Fails. The act is simply wrong, never justified. | ✘ Fails (often). Act is *right* (lesser evil); wrongness is illusory or outweighed. | ✓ **Best Fit.** Act is *necessary* but retains intrinsic wrongness; "justified" pragmatically, not morally purified. |
  | **2. Non-Culpability Non-Action** | ✓ Excels. Refusing the wrong act is always obligatory. | ✘ Fails. Refusing is culpable if consequences worse. | ✓ Good. Refusing preserves integrity; greater harm is tragic, not agent's *moral* fault. |
  | **3. ≠ Moral Tragedy** | ✓ Good. Agent *chose* wrong. | ✘ Weak. Distinction blurred; "tragedy" often just very bad consequences. | ✓ Good. Focus on agent's *choice* to transgress. |
  | **4. ≠ Hard Choice** | ✓ Good. DH act is impermissible. | ✘ Weak. DH often reduced to hard choice among costs. | ✓ Good. DH involves violating a deep prohibition. |
  | **5. ≠ Mere Regret** | ✓ Good. Guilt over the wrong. | ✘ Weak. Residue is regret/discomfort over costs. | ✓ **Best Fit.** Guilt is a direct response to wrongdoing. |
  | **6. Agent-Centric Residue** | ✓ Good. Agent culpable. | ✘ Weak. Residue is psychological cost, not moral. | ✓ **Core.** Guilt is the defining feature, tied to agency. |
  | **7. Non-Instrumental Guilt** | ✓ Good. Guilt reflects wrongness. | ✘ Fails. Guilt is irrational or merely useful deterrent. | ✓ **Core.** Guilt is constitutive of the moral remainder. |
  | **8. Agent ≠ Institution** | ✓ Good. Focus on individual duty. | ✘ Weak. Focus on outcomes/system design. | ✓ Good. Personal guilt persists regardless of context. |
  | **9. Constrain Necessity** | ✓ Good. Necessity rarely/never justifies transgression. | ✘ Weak. "Necessity" easily broadened for best outcomes. | ✓ Mixed. Can define necessity strictly, but risk remains. |
  | **10. Victims Owed** | ✓ Good. Victims wronged; apology owed. | ✘ Weak. Victims are costs; compensation pragmatic. | ✓ Mixed. Recognizes wrong, but focus on agent guilt may overshadow victim claims. |

  **Verdict:** A jointly satisfiable list is theoretically possible *only* if the theory successfully reconciles the core tension (R1 & R7) by positing a **non-consequentialist justification grounded in extreme necessity that nevertheless leaves an inescapable, non-instrumental moral residue tied to the intrinsic wrong committed**; **Requirement 7 (Non-Instrumental Guilt)** does the most to rule out popular consequentialist and strict prohibitionist accounts, as the former cannot accommodate genuine moral residue beyond cost, and the latter cannot accommodate justification.
