answer: |-
  Here’s a structured analysis of the etiological account’s pressure points, sorted by decisiveness, with concessions from its defenders, and an honest verdict—grounded in your specified cases and concerns. I’ll use British English throughout.

  ---

  ### **Core Tension: Etiological vs. Causal-Role Accounts**
  - **Etiological account**: Function = "selected effect" (natural selection) or "intended effect" (design). Explains **normativity** (malfunction is failure to perform historically selected/designed role).
  - **Causal-role account**: Function = current causal contribution to system goals (e.g., survival, reproduction). Descriptive, not inherently normative.

  **Unique prediction of etiological account**:  
  A trait with a beneficial effect *now* lacks a "function" if it lacks the *right history*. E.g., a novel mutation with life-saving effects has no "function" until selection acts—only a "beneficial effect".

  ---

  ### **Defeaters Sorted by Decisiveness**
  #### **1. Highly Decisive: The First-Generation Problem**  
  **Case**: A trait arises *de novo* (e.g., a metabolic pathway inserted by a synthetic biologist, or a random mutation in generation zero) with clear benefits but no selection history.  
  - **Etiological verdict**: No function (it’s a "mere effect").  
  - **Why decisive**: Undermines the account’s core claim that history is *necessary*. Biologists routinely ascribe functions to engineered traits (e.g., "this plasmid’s function is insulin production") without selection history.  
  - **Theorist’s response**:  
    - *Concession*: Designer intentions *must* be invoked for artefacts.  
    - *Wave away*: "Selection" can include *future* maintenance—but this collapses into causal-role.  
  - **Fatal flaw**: Reliance on designer intentions makes the account **hybrid** (natural selection + intentional design). Circularity: "Function is what the designer intended" presupposes normativity without explaining it.

  #### **2. Moderately Decisive: Selection Shift**  
  **Case**: Trait X spreads for effect A (e.g., feathers for thermoregulation) but is now maintained for effect B (e.g., flight).  
  - **Etiological verdict**: Ambiguous. Is the function A (original selection) or B (current maintenance)?  
  - **Why problematic**: Both answers conflict with intuitions. If only A, flight isn’t a "function"—but biologists call it one. If both, the account loses parsimony.  
  - **Theorist’s response**:  
    - *Concession*: Functions can be **layered**. Original function = A; *derived* function = B.  
    - *Wave away*: B only becomes a function if selection *acted on it specifically*.  
  - **Tolerable?** Partially. Layering avoids absurdity but dilutes the "selected *for*" criterion. Still, it preserves normativity (a feather can malfunction for flight but not thermoregulation).

  #### **3. Moderately Decisive: Biology’s Ahistorical Practice**  
  **Case**: Biologists ascribe functions without knowing/caring about history (e.g., "the function of telomeres is DNA protection").  
  - **Etiological verdict**: Function ascriptions are mistaken if unsupported by history.  
  - **Why problematic**: Ignores scientific practice. Biologists use "function" heuristically for *current* roles.  
  - **Theorist’s response**:  
    - *Concession*: Etiological functions explain "why the trait exists," not "what it does now."  
    - *Wave away*: Divergence of interests ≠ defect. Causal-role answers "how it works"; etiological answers "why it’s there."  
  - **Verdict**: Not fatal but **exposes limited utility**. Etiological functions matter for evolutionary biology; causal-role for physiology/systems biology.

  #### **4. Weakly Decisive: "Beneficial Effect" without Selection**  
  **Case**: A trait (e.g., a symbiotic enzyme) benefits an organism but wasn’t selected *for* it (e.g., it’s a side effect).  
  - **Etiological verdict**: No function—just a "fortuitous benefit."  
  - **Why tolerable**: Aligns with intuitions (e.g., heart sounds aren’t "functions").  
  - **Theorist’s strength**: Explains why we *don’t* say "the function of blood is to make stains."  
  - **Decisiveness**: Low. Etiological account handles this better than causal-role.

  ---

  ### **Honest Verdict: Survival with Revisions**  
  - **What survives**: The etiological account’s **core insight**—that normativity (malfunction, teleology) requires history—remains compelling. It successfully distinguishes *functions* from *beneficial accidents* and explains why a blind watchmaker can produce purposive traits.  
  - **Where revision is needed**:  
    1. **Accept hybridity**: Designer intentions *must* be integrated explicitly (not "quietly").  
    2. **Embrace pluralism**: "Function" is ambiguous:  
       - *Selected-function* (historical) for evolutionary questions.  
       - *Systemic-function* (causal-role) for engineering/physiology.  
    3. **Clarify "selection"**: Current maintenance can *sustain* a function but not *define* it originally.  
  - **Does it collapse?** Not entirely, but it becomes **domain-specific**. In synthetic biology, "designer intention" may suffice—but this shifts the account toward intentionalism, not pure selection.  
  - **Final score**: **70% intact** for natural traits; **50%** for synthetic/engineered systems. It remains the best account of *biological normativity* but must concede ground to causal-role in practice.

  ---

  ### **Key Resolution: Competing Questions, Not Answers**  
  - **Etiological account** answers: "Why did this trait evolve?"  
  - **Causal-role account** answers: "How does this trait contribute to current system goals?"  
  - **Synthetic biology test case**: A gene circuit designed for toxin degradation but co-opted for pH sensing.  
    - *Etiological*: Function = degradation (designer’s intent).  
    - *Causal-role*: Functions = degradation *and* sensing (both causal roles).  
    - **Neither is "wrong"**—they track different phenomena. The etiological account’s insulation isn’t qualification but **contextual relevance**. Its flaw is overclaiming universality.

  In short: the etiological account is *right* about normativity and history but *overreaches* by ignoring design pluralism and biological practice. It survives as a powerful tool—not the only one—for explaining purpose in nature.
