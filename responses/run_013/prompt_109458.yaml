  ### Founders' Day Address  

  Good morning, and thank you for welcoming me back to the place where I grew up. Founders’ Day is, above all, a celebration—a moment to honour the school we love, the community that sustains it, and the generations who have walked these halls. As a student here, I sat where you sit now, gazing up at the portrait in this hall—a portrait of a man whose wealth, made in Bengal’s indigo trade long ago, built this school in the 1870s. Today, we mark that founding not with blind praise, but with clear eyes: we inherit a legacy that is neither simple nor weightless, yet it is ours to carry forward.  

  This school stands as a testament to endurance. Its bricks and books, its traditions and triumphs, have shaped thousands of lives. But we also welcome guests from our partner school in Kolkata—a reminder that this place is tied to a larger story. When we speak of history, we often imagine a ledger: credits on one side, debits on the other. But let me share what I’ve learned since I left these gates. Every ledger has hidden rules—rules we must see to understand the inheritance we hold.  

  First, history’s balance depends on where we start the story. Measure our founder’s gift against an untouched world, a fading Mughal court, or the ambitions of empire itself, and the verdict shifts like light through stained glass. We need not agree on the baseline to agree on what we see today: a school that educates, and a friendship with Kolkata that defies distance.  

  Second, a ledger that lists a railway here and a cost there cannot be tallied unless we decide—and it is a decision—that one group’s loss offsets another’s gain. But loss and gain are not opposite ends of a scale; they are threads in separate tapestries. The wealth that raised these walls came from far away, yet the partnership we’ve built with Kolkata writes a new story—one where we share the pen.  

  Third, time is an uneven archivist. What lasts is what survives: institutions like this school, sturdy enough to endure. But survival favours the visible, the concrete, the self-sustaining. The portrait watches silently; it cannot speak of what faded when this school rose. So we listen harder to the voices from Kolkata—not to settle old accounts, but to learn what resilience truly means.  

  To you, the students, I say: this legacy is yours now. You are not debtors bound by the past. Obligations forged by states or empires do not descend to you like personal IOUs. But we all inherit the uneven ground they left—the distributional residue of history. Our task is not to repay a phantom debt, but to tend that ground: to level it.  

  So let us celebrate this school—not as a monument, but as a workshop. Build friendships with your peers from Kolkata. Learn from them. Lend your voice to the quiet spaces in our shared history. Make this foundation a place where every young mind, from every background, finds footing.  

  The founder’s gift was a beginning. Your gift is the future you shape from it.  

  Thank you.  

