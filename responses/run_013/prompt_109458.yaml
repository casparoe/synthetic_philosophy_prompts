  **Key Constraints:**
  - 800 words, celebratory, for teenagers.
  - Audience: founder's descendants, partner school from Kolkata, 300 pupils (mostly 15), local paper.
  - Do not dig up contentious history (as per agreement with head).
  - Make visible three ledger choices without lecturing:
    1. The counterfactual baseline (no contact, Mughal continuation, or empire's own intentions) affects the verdict.
    2. The decision to net debits and credits across parties is itself disputed.
    3. The survivor's ledger bias (what lasted was what paid for itself).
  - Two rules: no contested statistics, no citations (use the audience's experience of the school).
  - Ending: a repair rule about what an old ledger's debit transmits (obligations of states don't descend to individuals, but distributional residue does).

  **Structure of the Speech:**
  1. **Opening:** Celebrate the occasion, the school, and its history in a way that acknowledges the founder without flinching but sets up the complexity.
  2. **Middle:** Weave in the three ledger choices through the lens of the school's own story and the audience's shared experience (e.g., the portrait, the building, the partnership with Kolkata). Do not explain the choices but assume them in the narrative.
  3. **Build toward the repair rule:** Use the school as a microcosm to illustrate the idea of inheritance and residue.
  4. **Closing:** Hand something meaningful to the fifteen-year-olds that is neither "it's complicated" nor "you owe a debt" but a clear repair rule.

  **How to Embed the Ledger Choices Without Lecturing:**
  - **Choice 1 (Counterfactual):** Talk about the school's founding in the 1870s with money from Bengal. Instead of asking "Was it good or bad?", note that the answer depends on what we imagine otherwise. But do this by describing the portrait and the founder's intentions, then contrast with the partner school from Kolkata (implying a different baseline). Example: "When we look at this portrait, we see a man who built this school with a vision. But what if that vision had been different? What if the world had been different? We don't know, but we do know that the school stands today, and so does our friendship with Kolkata."
  - **Choice 2 (Netting):** Describe the school as a place built with resources from far away, but note that every brick laid here meant something else elsewhere. Without saying it's a debit, use the image of the ledger: "In the great ledger of history, every entry has two sides. But we cannot simply add them up as if they cancel out, because they belong to different stories." Then link to the partnership: "That is why we are not here to settle accounts but to build bridges."
  - **Choice 3 (Survivor's ledger):** Note that the school has endured, but so have the relationships we have built with our partner school. The things that last are the ones that have roots in both places. Example: "The institutions that survive are the ones that take root, that become part of the landscape of our lives. This school is one, and so is the bond with our friends in Kolkata."

  **Repair Rule:**
  - We must state: Obligations of states do not descend to individuals, but the distributional residue does.
  - How to phrase for teenagers: "We do not inherit the debts of the past as if they were our own personal obligations. But we do inherit the world that was shaped by that past, with its uneven terrain. And so our task is not to pay back but to build forward, making the ground more level for everyone."

  **Avoiding Pitfalls:**
  - No contested stats: Talk in terms of the school's physical presence, the portrait, the partnership.
  - No citations: Use the school as the example.

