  **Opening (Celebration):**  
  "Good morning, everyone. It is a profound honour to stand here on Founders' Day, in this hall I first walked into as a fourteen-year-old, under the gaze of the portrait that has watched over generations of students. Today we celebrate the vision that built this school in the 1870s — a vision made possible by the enterprise of an earlier generation, whose story is woven into the trade routes of the Bengal of that time. We celebrate the fact that this school has endured, that it has shaped thousands of young minds, and that it now welcomes a delegation from our partner school in Kolkata — a living bridge to the land that is part of our founding story."

  **Middle (Embedding the Choices):**  
  - **Counterfactual:** "The founder's vision was clear: to build an institution that would last. And last it has. But history is not a single path. Had the world been different, this school might not exist — or it might exist in another form. We cannot know. What we do know is that we stand here today, in a school that has been a home to many, and that we share this day with friends from Kolkata, whose own history is as rich and deep as our own."  
  - **Netting:** "The bricks and mortar of this school, the scholarships and the playing fields, they were funded by wealth created in a different time and place. In the grand accounting of history, every such creation has a context. But we cannot balance the books by simply subtracting one from the other, because the story of this school and the story of Bengal are not opposite pages in the same ledger — they are different books. What we can do is write a new chapter together, one of partnership and mutual respect."  
  - **Survivor's ledger:** "What endures? This school has endured. Our partnership with Kolkata has endured. They endure because they have taken root in the lives of people. The institutions that survive are the ones that become part of the fabric of our communities. They are the ones that were built to last, and that we have chosen to keep alive. But we must remember that not everything from the past survives, and what does survive tells only part of the story."

  **Building to the Repair Rule:**  
  "As we celebrate today, we also inherit. But what do we inherit? We inherit a world shaped by history. We do not inherit the obligations of the past — we are not personally liable for the debts of history. But we do inherit the distributional residue — the uneven landscape left behind. Our task, then, is not to pay back a debt that isn't ours, but to build forward. We must tend to the uneven ground, so that every young person walking these halls, whether from our town or from Kolkata, has a level field on which to build their future."

  **Closing (Handover to the Fifteen-Year-Olds):**  
