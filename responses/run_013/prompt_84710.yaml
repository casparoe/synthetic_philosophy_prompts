prompt: |-
  I've been messing with a little double-pendulum sim on my laptop and it's thrown up something I don't have a word for. If I nudge the starting angle by a millionth of a degree the two runs seperate after a minute or so, which I expected — fine, butterfly effect, I get it. But it's how they come apart that I can't get over. The diverged run isn't garbage. The energy is right, it still swings the way a double pendulum swings, every instant of it is a perfectly possible state of the same system. It's the same movie with the timing knocked out — flips happen at the wrong moment, the whole thing's out of phase — but nothing in it couldn't have happened. So the sim isn't exactly wrong. It's just describing a differnt afternoon than the one I had. And when I try to say how long my forecast is good for, it depends entirely on which question I'm asking. How much energy in ten minutes: good forever. When does it flip next: useless after about a minute. What fraction of the time is it upside down: fine again, comes back quick. One error, three totally different verdicts, and no single number that measures the "predictability" of the thing. And if I show someone the bad run and say the model's off, they can't point to anything in it that couldn't have happened. There's nothing there to falsify. It's a real trajectory of the same equations, just not mine.

  So, is there a name for this? Not the butterfly effect — I know that one. I mean (a) one and the same error being fatal for one question and harmless for another, so that "predictability" isn't one quantity at all, and (b) a chaotic forecast being flatly wrong while nothing in it is impossible, so the usual "does it match the data" test doesn't seem to bite the way it does elsewhere. If the parts have names I want them; if the combination doesn't, say so and then have a go at naming it yourself, with the edges — where does it stop being true? My sim is a closed box, no noise, nothing pushing it. Does any of this survive a system that's getting shoved around from outside, or one where I can only ever measure the starting state to twelve digits? And does it matter that the thing is deterministic? Everyone says chaos isn't randomness and I believe them, but from where I'm sitting the practical upshot looks the same, and I can't tell if that's a real distinction or just a way of talking.
reasoning: |-
  Okay, the user has been experimenting with a double pendulum simulation and has encountered some fascinating phenomena related to chaos theory. They understand the butterfly effect but are puzzled by specific aspects: how the same initial error affects different questions differently, and how a diverged trajectory remains physically valid despite being "wrong." They want to know if there's terminology for these concepts and where the boundaries lie.

  First, I need to address their two main points. For (a) the varying impact of errors on different questions, I recall that predictability is indeed question-dependent. Terms like "Lyapunov time" and "ensemble forecasting" come to mind. The Lyapunov exponent measures how quickly trajectories diverge, but its effect depends on what's being predicted. Questions about long-term averages (like energy or fraction of time upside down) might remain stable even if specific timing fails. This relates to "predictability horizons" varying by observable.

  For (b) the validity of diverged trajectories, they're correct that all trajectories are solutions to the same equations. This touches on the deterministic nature of chaos. Even "wrong" forecasts are physically possible states, just not the one corresponding to the initial conditions. This is different from stochastic systems where trajectories might violate physical laws.

  The user also asks about boundaries: does this hold with external noise or limited measurement precision? In deterministic systems without noise, all trajectories are valid solutions. But with external forcing or measurement error, the "wrong" trajectory might still be possible if the forcing is known. Limited precision introduces practical indistinguishability – trajectories within measurement error are effectively valid.

  They question whether determinism matters practically versus randomness. While both lead to unpredictability, determinism preserves causal structure. Statistical properties remain predictable in chaos, whereas true randomness might not. This distinction is crucial for understanding the system's behavior.

  I should also consider their deeper needs. They might be seeking validation of their observations and a framework to articulate these concepts. Providing specific terminology (like "sensitive dependence on initial conditions" and "ergodicity") can help them communicate their findings. They might also be interested in applications, like how meteorologists handle similar issues with ensemble forecasts.

  Finally, naming the combination of concepts: while no single term exists, phrases like "observable-dependent predictability" or "dynamic realism under divergence" could work. Emphasizing that chaos is deterministic but unpredictable in specifics, yet predictable in aggregates, bridges their practical observations with theoretical distinctions.
answer: |-
  What you're describing is a brilliant, visceral encounter with the **nuanced nature of predictability in chaotic systems**. There aren't single, universally-agreed-upon names for *exactly* these combinations, but the concepts are well-understood and crucial. Let's break it down:

  1.  **"Predictability isn't one quantity" (Question-dependent Predictability):**
      *   **Core Concept:** This is **Observable-Dependent Predictability Horizons**.
      *   **Why it happens:** Chaotic systems have exponential divergence (butterfly effect), but different quantities you might want to predict ("observables") have different sensitivities to this divergence and different inherent timescales.
          *   **Conserved Quantities (e.g., Total Energy):** These are *invariants* of the system. No matter how chaotic the trajectory, the total energy remains constant. Predicting it is trivial and perfectly stable forever. *Predictability Horizon: Infinite.*
          *   **Instantaneous State Details / Precise Timing (e.g., "When does it flip next?"):** These are *maximally sensitive* to initial conditions. Tiny errors blow up rapidly, destroying the phase relationship. *Predictability Horizon: Short (Lyapunov time ~ 1/λ, where λ is the largest Lyapunov exponent).*
          *   **Statistical Properties / Long-Term Averages (e.g., "Fraction of time upside down"):** These *converge* due to the **Ergodicity** of chaotic attractors. Even though individual trajectories diverge wildly, they all explore the same region of phase space with the same long-term statistics. Averages stabilize relatively quickly. *Predictability Horizon: Medium (depends on mixing time of the attractor).*
      *   **Terminology:** You'll hear this discussed in terms of the **predictability horizon** being specific to the observable. Ensemble forecasting (running many simulations with slightly different initial conditions) explicitly embraces this: it provides probabilistic forecasts for sensitive events and stable averages for statistical quantities.

  2.  **"Wrong forecast, but physically possible" (Valid Trajectory Divergence):**
      *   **Core Concept:** This is a direct consequence of **Determinism** and **Sensitive Dependence on Initial Conditions (SDIC)** within a **Closed System**.
      *   **Why it happens:** Your simulation solves deterministic equations (Newton's laws). *Every* point in the system's phase space (positions + momenta) uniquely determines *one and only one* future trajectory. Your "bad run" started from a *different* initial condition (differing by a millionth of a degree). Because the equations are deterministic, that "bad run" is a perfectly valid solution representing the system evolving from *that specific, slightly different starting point*. There's no "falsification" possible because both trajectories are mathematically and physically valid solutions to the *identical* equations, just from infinitesimally different starting points. The error was in the *initial condition specification*, not the *model physics*.
      *   **Terminology:** This highlights the distinction between **model error** (the equations are wrong/incomplete) and **initial condition error** (the equations are right, but the starting point is slightly off). What you see is pure **initial condition error amplification via SDIC**. The "bad run" isn't "off-model"; it's "off-initial-condition".

  **Naming the Combination & Edges:**

  *   **Combined Phenomenon:** You could call this **"Deterministic Divergence with Observable-Dependent Predictability"** or **"Phase-Space Neighbor Trajectory Validity under SDIC"**. A more evocative (though less precise) phrase might be **"The Ghost Trajectory Effect"** – the "wrong" run is the ghost of what *could have been* from a nearly identical start.
  *   **Where the Edges Are:**
      *   **External Shoving (Forcing/Noise):** This changes things significantly.
          *   *Deterministic Forcing:* If the "shoving" is known and deterministic (e.g., a precise periodic push), the system remains deterministic. Your core observation holds: a trajectory starting from a slightly wrong initial condition is still *a* valid solution for *some* initial condition, just not yours. Predictability horizons still vary by observable.
          *   *Stochastic Forcing (Noise):* This injects true randomness. Now, the "bad run" might not be a solution to the *noisy* equations at all, even from a different starting point, because the noise path was different. The "nothing impossible" aspect weakens. The model itself incorporates randomness, so trajectories can potentially violate physical laws inherent in the deterministic core (though a well-designed stochastic model avoids this). Predictability becomes inherently probabilistic, and averages might converge slower or differently.
      *   **Limited Measurement Precision (12 digits):** This is the *practical reality* and reinforces the phenomenon. Your "true" initial state is fundamentally unknowable below your measurement precision. *All* initial conditions within your measurement error bar are indistinguishable to you. The "bad run" you get from a slightly perturbed start *is indistinguishable from a run you could have gotten if your measured start was actually the "true" start but your measurement had a tiny error*. In practice, for chaotic systems, any prediction requiring precision beyond the measurement limit for sensitive observables is meaningless after the Lyapunov time. The "valid trajectory" aspect holds *within the precision of your measurements* for the deterministic core.
      *   **Open vs. Closed System:** Your closed, noiseless box is essential for the strongest form of "all trajectories are valid solutions." Introduce unknown external influences or true randomness, and this purity is lost.

  **Determinism vs. Randomness: The Crucial Distinction (It Matters!)**

  You've hit the nail on the head about the *practical* similarity. For predicting specific timings far in the future? Yes, a deterministic chaotic system and a truly random one might be equally useless. **But the distinction is profound and has practical consequences:**

  1.  **Causal Structure:** Determinism means the state *now* perfectly determines the future. Randomness breaks this causal chain. This is fundamental for understanding *why* things happen, even if you can't predict them precisely.
  2.  **Attractor Structure:** Chaotic systems have intricate, fractal attractors in phase space. All valid trajectories live on this attractor and share its statistical properties (ergodicity). True randomness might not have such a structure.
  3.  **Predictability of Averages:** As you saw, long-term *statistical* properties (like "fraction upside down") *are* predictable in chaotic systems because of the attractor structure. In pure randomness, predicting long-term averages might be possible, but the nature of the convergence could be different (e.g., slower, less structured).
  4.  **Short-Term Prediction:** Within the predictability horizon (before divergence becomes significant), deterministic chaos allows for *highly accurate* short-term forecasts. True randomness offers no such window.
  5.  **Sensitivity is Structured:** The exponential divergence in chaos has a specific rate (Lyapunov exponent) and direction in phase space. Randomness lacks this structured sensitivity.

  **In essence:** Chaos is **deterministic unpredictability**. The unpredictable future is *caused* by the precise present, amplified. Randomness is **acausal unpredictability**. The future is not fully determined by the present. Your simulation results beautifully illustrate the deterministic part: the "wrong" run *is* the inevitable consequence of a slightly different *cause* (the initial angle). It's not random noise; it's the precise outcome of a different, valid starting point. The *practical* unpredictability for sensitive questions arises from our inability to know the initial state perfectly, combined with the amplification (SDIC).

  **Conclusion:**

  You've grasped fundamental truths about chaos:
  1.  **Predictability is inherently tied to what you want to predict** (Observable-Dependent Predictability).
  2.  **In deterministic systems, diverged trajectories are not "wrong physics"; they are "different histories"** (Consequence of Determinism + SDIC).
  3.  **The distinction from randomness lies in causality, structure, and the predictability of statistics** – even if specific timings become practically unknowable.

  While no single perfect name exists for the *combination* of frustration and insight you describe, terms like **"observable-dependent predictability horizons"** and **"dynamic realism under divergence"** capture key aspects. It's a core reason why chaotic systems are studied with tools like Lyapunov exponents (measuring divergence rate), attractor reconstruction, and ensemble forecasting – they help navigate this complex landscape where "predictability" is not a single, simple concept. Your double pendulum is teaching you deep lessons!
