prompt: |-
  You are a philosopher of action and of causation, with expertise in the metaphysics of omissions and in the criminal law's distinction between acting and omitting. Think carefully before you answer, and open with a brief brainstorming section in which you lay out the candidate theories and their costs before you commit to any of them.

  Consider a pattern that runs through the criminal law of most common-law jurisdictions. A stranger who stands by while a child drowns in a shallow pond -- who could have saved the child at no risk to herself -- commits no crime; the law recognizes no general duty to rescue. Yet the same system holds a parent liable for the death of a child she fails to feed, holds a lifeguard liable for a swimmer he fails to help, holds liable anyone who has begun a rescue and then abandoned it, and holds liable anyone whose own careless conduct created the peril, so that if you knock a pedestrian into the road you must at least try to help. Some European legal systems, by contrast, do impose a general duty to rescue. Meanwhile the same common-law system permits a physician to withdraw a ventilator from a patient who will then die, and describes this as letting the patient die rather than killing, while a lethal injection is killing. And in tort, a failure to warn of a danger can ground liability, whereas a bare failure to act generally cannot.

  Set aside for now whether any of this is morally attractive. I want the theory of causation, and the theory of agency, that the pattern presupposes. Specifically: does the practice presuppose that an omission -- the absence of an act, a nothing -- cannot stand in a causal relation at all, so that the parent's liability must be grounded in duty rather than in causation? Or does it presuppose a counterfactual or quasi-causal account on which an omission counts as a cause whenever the omitted act would have prevented the harm? Reconstruct the implicit view as charitably as you can, then say which rival views the practice actually rules out and which it merely happens to fit. Identify the places where the practice is underdetermined, where several incompatible theories of causation by omission would license exactly the same doctrine.

  Then tell me whether the parts of the practice presuppose consistent things. Is the law's treatment of the drowning stranger coherent with its treatment of the parent, the abandoning rescuer, the ventilator-withdrawing physician, and the failure to warn? If the pattern rests on a single theory, say what it is; if it rests on several that do not fit together, say where the seam is. Finally, suppose we replaced the implicit view with a straightforward but-for account, under which any failure whose occurrence would have prevented the death is a cause: what in the practice would have to change, and what could stay as it is?

  Be precise about the difference between what the law strictly presupposes and what it finds convenient, and flag clearly any point at which you are reconstructing a theory rather than reporting one the practice commits to. Aim for an answer that a legal theorist and a metaphysician could both read without wincing.
reasoning: |-
  Hmm, this is a fascinating question about the philosophy of action and causation in legal contexts. The user wants me to dissect how common-law jurisdictions handle omissions versus actions, particularly regarding causation and liability. They've outlined several scenarios: the drowning stranger vs. the neglectful parent, the abandoning rescuer, ventilator withdrawal, failure to warn in tort law, and how this compares to European systems.

  Let me approach this systematically. The key tension is between two theoretical frameworks: one that treats omissions as non-causal (requiring duty-based liability) and another that views omissions as causes through counterfactual dependence. The common-law pattern seems inconsistent at first glance - punishing some omissions but not others. 

  First, I need to distinguish what the law strictly presupposes versus what's merely convenient. The practice clearly assumes omissions aren't "causes" in the same way actions are, otherwise the stranger would be liable. But it can't be that omissions never matter causally, because in parental neglect cases, the omission clearly leads to death. 

  The duty-based framework appears central: liability attaches only when there's a pre-existing duty to act. This explains why parents, lifeguards, and peril-creators are liable while strangers aren't. For the ventilator case, the duty framework works if we see treatment as elective rather than obligatory. 

  But causation isn't irrelevant. In torts' failure-to-warn cases, the omission only matters if the warning would've prevented harm - showing counterfactual dependence. Yet the law stops short of calling this causation per se. 

  The abandonment cases are tricky - they suggest that initiating action creates a duty, but doesn't necessarily make the omission causal. The distinction between killing and letting die in medical contexts seems to rely more on duty status than causal metaphysics. 

  If we applied a pure but-for test universally, we'd have to criminalize the stranger's inaction. But the law deliberately avoids this, showing its rejection of symmetrical treatment of actions and omissions. Still, the but-for test operates quietly in the background for proximate cause assessments. 

  The seam in the theory appears between tort and criminal law: torts accept quasi-causal omissions for failures-to-warn, while criminal law maintains stricter separation. And the ventilator case strains the duty framework when duties are contested. 

  Ultimately, the practice isn't metaphysically consistent but pragmatically coherent through its duty hierarchy. A but-for overhaul would collapse the act/omission distinction entirely - philosophically cleaner but legally revolutionary.
answer: |-
  Here is a careful reconstruction of the implicit metaphysics of causation and agency underlying the described legal pattern, following your requested structure:

  ### Brainstorming: Candidate Theories & Their Costs
  1.  **Omissions as Non-Causal (Pure Negative Absences):**
      *   *Thesis:* Omissions are literal "nothings" and cannot be causes. Liability must rest solely on breach of a duty, not causation-in-fact.
      *   *Costs:* Struggles to explain why causation is still discussed in omission cases (e.g., "failure to feed *caused* death"), why counterfactual dependence often seems relevant (e.g., failure to warn), and why the *absence* of a specific act seems explanatorily salient.
  2.  **Omissions as Causes via Counterfactual Dependence (But-For):**
      *   *Thesis:* An omission causes harm iff the omitted act would have prevented the harm (but-for condition). Causation is symmetrical between acts and omissions.
      *   *Costs:* Implies the drowning stranger *caused* the death, conflicting with the no-duty rule. Threatens to collapse the legal act/omission distinction entirely and over-extend liability.
  3.  **Omissions as Quasi-Causes / Causation Requires Positive Agency:**
      *   *Thesis:* Causation proper requires a positive exercise of agency/manipulation of the world. Omissions aren't "causes" but can be grounds for liability when combined with a duty, based on the *potential* for prevention (a normative, not metaphysical, link).
      *   *Costs:* Requires a sharp metaphysical distinction between acting and omitting that may be difficult to sustain. Needs to explain why counterfactual dependence matters in some omission cases (torts).
  4.  **Duty-Relativized Causation:**
      *   *Thesis:* Whether an omission "counts as" a cause depends on the existence of a prior duty. Omissions by duty-bearers are causes; omissions by non-duty-bearers are not.
      *   *Costs:* Risks conflating normative duty with metaphysical causation. Struggles with cases where causation seems independent of duty (e.g., the abandoning rescuer – did causation start only when they began acting?).
  5.  **Proximate Cause Dominance:**
      *   *Thesis:* Omissions can satisfy but-for causation, but legal liability requires *proximate* causation, which is heavily filtered by policy, including duties. The drowning stranger omission is but-for causal but not proximate due to no duty.
      *   *Costs:* May require stretching "but-for" causation conceptually for omissions. Still needs to explain why the normative duty filter applies so decisively to omissions but less so to acts.

  ### Reconstructing the Implicit View (Charitably)
  The common-law pattern **presupposes a hybrid view, primarily combining elements of (1) Omissions as Non-Causal and (3) Omissions as Quasi-Causes, filtered through (5) Proximate Cause Dominance for policy reasons.** The core commitment is metaphysical:

  *   **Causation Proper Requires Positive Agency:** The law presupposes a metaphysical distinction between acting and omitting. Genuine causation in the world involves the introduction of energy, the initiation of force, or a positive alteration of existing causal chains. *Omissions, as absences, cannot be the initiating or sustaining causes of outcomes in this primary sense.* The child drowns because of water in lungs, gravity, etc., *not* because of the stranger's absence of action. The stranger's inaction is a background condition.

  *   **Liability Grounded in Duty + Counterfactual Potential:** However, liability for harmful outcomes *can* attach to omissions when:
      *   A specific, legally recognized **duty to act** exists (parental, contractual, assumed, or created by peril).
      *   The **omitted act was possible**.
      *   Performing the omitted act **would have prevented the harm** (counterfactual dependence).
      This counterfactual dependence establishes the *relevance* of the omission and the breach of duty, but it does not elevate the omission to the status of a cause *simpliciter*. It grounds liability in the breach of duty *combined with* the normative significance of the failure to prevent a counterfactually avoidable harm. The parent is liable *for the death* caused by starvation/dehydration *because* they breached a duty *and* feeding would have prevented it.

  *   **Proximate Cause as the Normative Filter:** The "no general duty to rescue" rule is a policy-driven limitation on proximate cause for omissions. While the stranger's omission might be a but-for condition (if saving was possible), it is deemed too remote or non-proximate *because* of the absence of a duty. Duties define the scope of when an omission becomes a legally cognizable basis for liability for an outcome caused by other forces.

  *   **Act/Omission Distinction Maintained:** This framework preserves the killing/letting die distinction (ventilator withdrawal vs. lethal injection). Withdrawing life support stops an artificial intervention, allowing the underlying pathology to take its course (omission/letting die). Injecting poison introduces a new, fatal causal force (acting/killing). The law sees these as metaphysically distinct kinds of events, even if the outcome is the same.

  ### Rival Views Ruled Out vs. Merely Fitted
  *   **Ruled Out:**
      *   **Strict Symmetrical But-For Causation (Theory 2):** The pattern explicitly rejects this. If omissions were causes whenever but-for true, the drowning stranger *must* be liable for causing death. The law refuses this, demonstrating its core commitment to the non-causal (or differently causal) nature of omissions absent duty. The no-duty rule *requires* the rejection of symmetrical but-for causation as sufficient for liability.
      *   **Pure Duty-Relativized Causation (Theory 4) as Primary Metaphysics:** The practice doesn't commit to the metaphysics that a duty *makes* an omission causal. It commits to duty being a necessary *normative precondition* for liability *for an outcome* where the omission is a relevant counterfactual preventer. The causal story remains: the harm was caused by positive forces, the omission was the failure to intervene.
  *   **Merely Fitted (Compatible but Not Required):**
      *   **Proximate Cause Dominance (Theory 5):** The practice fits well with explaining the *no-duty* rule as a proximate cause limitation. However, the deeper presupposition is the metaphysical distinction itself. Proximate cause explains the boundary condition, not the core distinction.
      *   **Quasi-Causation (Theory 3):** This is largely consistent with the reconstructed view.

  ### Underdetermined Areas
  *   **The Metaphysics of "Beginning Rescue":** Why does beginning a rescue create a duty? The practice fits several theories: 1) By acting, you create a new peril (if you stop, the victim is worse off than if you never came); 2) You assume a duty through voluntary undertaking; 3) Your initial positive act creates a new causal chain where your subsequent omission *becomes* a cause of the worsened state. The practice *uses* the duty explanation, but the underlying metaphysical reason *why* this duty arises isn't strictly determined by the causal theory alone; it's normative.
  *   **"Creating the Peril":** Holding the peril-creator liable for failing to help fits the duty framework. But does the law presuppose that the initial act *causes* the victim to be dependent, making the subsequent omission a cause of death? Or is it purely normative (you broke it, you fix it)? The practice is compatible with both, leaning normative.
  *   **Failure to Warn (Torts):** This *seems* closer to counterfactual dependence. The law often says the failure *caused* the harm if the warning would have been heeded. This could be seen as: 1) an exception proving the rule (warnings are positive acts of communication, their absence is a special kind of omission); 2) evidence of quasi-causation; or 3) reliance on but-for within proximate limits defined by relationship/duty. The practice doesn't force a single metaphysical reading here.

  ### Coherence Assessment
  The pattern is **largely coherent** based on its core commitments (metaphysical act/omission distinction + liability via duty + counterfactual prevention), but exhibits **tension at the edges**:

  1.  **Core Coherence:** The treatment of stranger, parent, lifeguard, abandoning rescuer, and peril-creator all flow consistently from the **duty + counterfactual prevention** model without requiring omissions to be metaphysical causes. The ventilator case also fits by characterizing withdrawal as stopping an intervention (omission). Lethal injection is clear positive action.
  2.  **Tension 1: Failure to Warn (Torts):** This strains the "omissions aren't causes" commitment. Tort law frequently *does* frame failure to warn as *causing* the harm, especially in products liability where there's a duty. This suggests a greater willingness in torts to use a looser, more counterfactual notion of causation for omissions *within* duty relationships, approaching quasi-causation. While still justified by duty, the causal language is stronger here than in the criminal stranger case.
  3.  **Tension 2: The "Act" in Omissions?** Characterizing ventilator withdrawal as an *omission* relies on viewing the ongoing operation of the ventilator as the relevant "act" being omitted. However, flipping the switch is a positive bodily movement. The law resolves this by focusing on the *nature of the impact on the patient* (removing artificial support vs. introducing poison), a normative distinction mapped onto the metaphysics. It's coherent but highlights the potential for description-dependence.
  4.  **The Seam:** The main seam lies between **the strict metaphysical conception of causation (requiring positive agency) used to justify the no-duty rule and the killer/letting die distinction, and the more pragmatic, counterfactual-dependent conception used to ground liability *within* duty relationships** (especially evident in torts like failure to warn). The law doesn't rigorously maintain that omissions *never* cause; it maintains that they don't cause *in the absence of a duty*, and that they are fundamentally different *kinds* of contributions than positive acts.

  ### Impact of a Straightforward But-For Replacement
  Adopting a strict symmetrical but-for account ("any failure whose occurrence would have prevented the death is a cause") would necessitate **radical changes**:

  1.  **Elimination of No-Duty Rule:** The drowning stranger *caused* the death. A general duty to rescue (like European systems) would become almost logically necessary for consistency, unless liability were decoupled from causation (which the but-for account typically aims to ground).
  2.  **Collapse of Act/Omission Distinction:** Killing and letting die would both be "causing death by but-for necessary action/inaction." Withdrawing the ventilator would be causing death by omission just as lethal injection causes death by action. The moral/legal significance of the distinction would need new justifications independent of causation.
  3.  **Liability Expansion:** Anyone whose failure to act was a but-for cause of harm could potentially be liable, subject only to proximate cause limits. Lifeguards off-duty, parents who momentarily forget, passersby in rescue situations – all could meet the causal threshold.
  4.  **What Could Stay (Mostly):**
      *   **Existing Duty-Based Liability:** Parents, lifeguards, peril-creators would still be liable, as their omissions would be but-for causes.
      *   **Abandoning Rescuer:** Liability would likely remain, as the abandonment would be a but-for cause of the failure to complete the rescue.
      *   **Proximate Cause Doctrines:** These would become the *primary* tool for limiting liability (e.g., deeming the stranger's omission too remote despite being but-for), replacing the duty filter for omissions. However, the nature of proximate cause analysis might shift dramatically to handle the vastly expanded pool of "causers."
      *   **Failure to Warn:** Would fit seamlessly, as it already relies heavily on counterfactual dependence.

  ### Presupposition vs. Convenience
  *   **Strictly Presupposed:** The metaphysical distinction between positive acts (which can initiate causal chains) and omissions (which cannot, being absences/background conditions). This is non-negotiable for the no-duty rule and the killing/letting die distinction.
  *   **Convenient/Pragmatic:** The specific list of duty categories. The reliance on counterfactual dependence *within* duty relationships is practically necessary to establish relevance and harm, even if not strictly causal in the primary sense. The characterization of withdrawal as omission is a convenient mapping of the normative distinction onto the available metaphysical categories.
  *   **Reconstruction vs. Reporting:** The analysis of omissions as "non-causal" in the primary sense and the hybrid duty+prevention model is a reconstruction of the metaphysics implied by the pattern's resistance to symmetrical but-for causation. The law rarely articulates this explicitly; it speaks in terms of duties and "producing" results. The counterfactual element within duties is more explicitly reported in jury instructions and case law (e.g., "would the harm have occurred but for the breach?").

  In essence, the common law presupposes a world where causation is enacted by positive forces. Omissions are failures to alter existing causal trajectories. Holding someone responsible for such a failure requires a special normative reason – a duty – and a link showing the failure mattered (counterfactual prevention). This creates a coherent, though not without tension, framework prioritizing individual liberty from positive obligations while recognizing specific, circumscribed responsibilities where relationships or prior actions create them. A but-for account would fundamentally alter this balance by making causation ubiquitous and requiring normative filters to perform much heavier lifting.
