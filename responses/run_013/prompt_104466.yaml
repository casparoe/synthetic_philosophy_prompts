prompt: |-
  Bit of background first: I retired a couple years back after ~30 yrs as a field ecologist (long-term population studies, lots of mark-recapture work), and I've spent the retirement reading philosophy — epistemology mostly, a little phil of science. So I'm a tourist, be gentle with me, but I want the real thing.

  Here's the itch. Everyone trots out the distinction between the "inside view" and the "outside view" — inside, you reason about the particulars of the case in front of you; outside, you treat it as one draw from a reference class and go with the base rate. Planning fallacy, that whole litany. And the takeaway is always "use the outside view." But I've definately seen this used badly in my own field for decades, and I've slowly come round to thinking nobody has actually written down what an adequate account of this distinction would even have to deliver. So write me that — the desiderata. The full spec for what a theory of the inside/outside distinction has to do to be worth anything as a discipline against overconfidence.

  What I want in the list, each requirement with the case or consideration behind it:

  - it has to work on single, unrepeatable cases, not just ensembles. My grant, my one restoration project, my one shot — those are the decisions where overconfidence actually bites, and you only get n=1.
  - it has to say how you pick the reference class, because every case belongs to infinitely many of them (my study is one of "all ecology grants," "all grants," "all projects by sixty-something men with tenure," ...) and the base rate swings wildly with the choice.
  - it has to tell me when the outside view loses. Sometimes the mechanism really is knowable and the base rate is just pooling me with a crowd I'm not in.
  - it can't collapse into "always defer to the base rate" (that's fatalism with a spreadsheet) or into "trust your model" (that's the disease itself).
  - and this is the one that nags me: picking the reference class looks like it's itself an inside-view judgment. So the outside view may never be the independent check people advertise it as. I want that squared with the whole project, or I want it admitted as fatal.

  Then the part I care about most: which of these can't be had at once. I suspect a couple are in tension — name the pair, say why they pull apart, and tell me which one you'd throw overboard and why. Commit. Don't hand me a menu of options and leave me to pick, give me your call. And a last line or two on which single requirement does the most work — the one that, if you drop it, makes the whole thing worthless — and which of the usual framings fails that requirement worst.

  No reading list, no citations please, I'm not after the literature, I want the spec.
reasoning: |-
  Okay, let me tackle this retired ecologist's challenge. They want a rigorous specification for the inside/outside view distinction that addresses real-world epistemic problems. 

  First, I need to unpack their five core requirements. The single-case criterion is crucial - they've seen how ensemble-based thinking fails when dealing with unique field situations. The reference class selection problem feels particularly thorny; I recall how in ecology, classifying a wetland restoration as "mid-sized projects" vs "projects in drought-prone areas" would yield wildly different predictions. 

  The third point about mechanism resonates with their scientific background - sometimes you really do understand causal pathways better than any aggregate statistic. And the collapse warnings make sense: they've seen both blind base rate worship and overconfident modeling. 

  But that fifth point... that's the knife twist. If reference class selection is inherently inside-view, doesn't that undermine the whole "independent check" premise? This needs serious engagement.

  For the tensions, I'm seeing two major fault lines. The independence problem (requirement 5) directly challenges requirement 2's solvability. And mechanism versus base rates (3) strains against requirement 4's avoidance of extremes. 

  If forced to choose, I'd prioritize the mechanism exception over neat reference class solutions. Their field experience shows that when causal models are strong - say knowing predator-prey dynamics in a specific ecosystem - base rates from heterogeneous classes often mislead. Sacrificing requirement 2's clean resolution keeps the framework honest about its limitations. 

  The single-case requirement feels most foundational. Drop that and you're just doing statistics, not decision theory for real-world choices. Current frameworks fail worst at the reference class problem - most treatments handwave it with "choose relevant classes" when relevance is precisely what's contested. 

  The admission I'd make: the outside view is never purely "outside." It's a dialectical tool to challenge inside-view certainty, not replace it. The ecologist's instinct about contaminated independence is correct - and that's not a bug but a feature. It forces epistemic humility without promising mechanical solutions.
answer: |-
  Here’s the full specification for a viable theory of the inside/outside view distinction, structured against your desiderata. The tensions are real, and I’ll commit to the trade-offs.

  ### **Desiderata & Rationale**
  1. **Single-case applicability**  
     *Why*: Decisions (e.g., your grant proposal) are singular events. Overconfidence harms *this* project, not a hypothetical average. A theory must constrain unique-case judgments without requiring repeatability.  
     *Failure mode*: Treating your wetland restoration as a "statistical event" ignores site-specific hydrology, politics, or novel climate stressors.

  2. **Reference class selection procedure**  
     *Why*: "All ecology grants" vs. "post-retirement grants by experts in dynamic systems" yield divergent base rates. A theory must specify *how* to bound the class, not just advise "be objective."  
     *Failure mode*: Choosing too broad a class (e.g., "all projects") washes out signal; too narrow (e.g., "your projects") cherry-picks.

  3. **Domain for inside-view supremacy**  
     *Why*: When mechanisms are legible (e.g., you’ve calibrated mark-recapture models for *this* species’ migration), base rates from noisy classes (e.g., "all vertebrate studies") add little. The theory must flag when inside-view models override reference classes.  
     *Failure mode*: Ignoring known causal pathways because "base rates say 70% fail."

  4. **No collapse into extremes**  
     *Why*: "Always defer to base rates" ignores agency (fatalism); "trust your model" enables delusion. The theory must force *integration*, not substitution.  
     *Failure mode*: Demanding "outside view only" for your novel bioremediation technique, despite your 30 yrs of soil chemistry expertise.

  5. **Acknowledge reference-class contamination**  
     *Why*: Class selection *is* an inside-view act (e.g., you deem "coastal grants" relevant due to storm-surge risks). The outside view isn’t independent—it’s scaffolded by inside-view judgments. The theory must admit this and mitigate circularity.  
     *Failure mode*: Pretending class choice is "neutral" while smuggling in subjective priors.

  ---

  ### **The Tension & Trade-off**
  **Conflict**: **#2 (objective reference classes)** and **#5 (class selection as inside-view)** are irreconcilable.  
  - *Why they pull apart*: A "procedure" for reference classes (#2) implies rules or heuristics to standardize selection. But #5 reveals that *any* rule/heuristic depends on inside-view context (e.g., relevance judgments, causal hypotheses). You can’t sanitize class selection from situated judgment.  

  **Trade-off**: **Sacrifice #2’s demand for a universal procedure**.  
  - *Why*: Insisting on an objective method for reference classes is a fool’s errand. It risks false rigor (e.g., algorithmic class-picking) while obscuring subjectivity. Instead, explicitly treat class selection as an *inside-view hypothesis*: "I suspect *this* class is predictive because of mechanism X." This forces scrutiny: *Why* "grants by tenured ecologists" over "wetland projects since 2010"? The "outside view" becomes a *deliberate counter-perspective*, not a computational step.  

  **Retain #5’s admission of contamination** as the necessary anchor. Without it, the outside view masks its own subjectivity, becoming dogma.

  ---

  ### **The Keystone Requirement**
  **#1 (single-case applicability) is non-negotiable**. If dropped, the theory becomes academic statistics—irrelevant to real decisions. Your "one shot" is where epistemology bites.  

  **#3 (inside-view supremacy domain) is most neglected**. Standard frameworks fail worst here, dismissing mechanism as "anecdotal." But when you *know* the nitrogen cycle in *this* bog, base rates from ill-fitting classes (e.g., "all restoration projects") are epistemically inert. A theory must formalize when mechanistic insight trumps reference classes—or it’s just bias laundering.

  ---

  ### **The Core Admission**
  The outside view **is not an independent check**. It’s a *deliberate act of self-sabotage*: you dismantle your inside-view narrative by forcibly resampling it against a class you *suspect* might reframe it. Its power isn’t in objectivity—it’s in *breaking conviction*. A worthy theory makes this explicit: **the outside view is your inside view in a funhouse mirror**. Its value isn’t purity, but distortion that reveals overconfidence.
