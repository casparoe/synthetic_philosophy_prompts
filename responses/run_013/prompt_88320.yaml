  ### Population Axiology Decision Tree

  **Node 1 (Root):**  
  Compare Outcome A (a small population with very high welfare) and Outcome A+ (A plus an additional group with low but positive welfare; the original group is unaffected). Is A+ at least as good as A?  
  - **Yes** → Node 2  
  - **No** → Node 9  

  **Node 2:**  
  Compare two outcomes with entirely different populations (no overlapping people). Can we compare them and say one is better?  
  - **Yes** → Node 3  
  - **No** → **Leaf: Incomparability** (outcomes may be on a par or non-comparable)  

  **Node 3:**  
  When comparing outcomes, should we only count effects on people who exist in both outcomes?  
  - **Yes** → **Leaf: Narrow Person-Affecting View** (only effects on necessary people)  
  - **No** → Node 4  

  **Node 4:**  
  Is bringing a person into existence with a life worth living ever a *benefit* (i.e., makes the outcome better)?  
  - **Yes** → Node 5  
  - **No** → Node 6  

  **Node 5:**  
  Compare Outcome A (small, high welfare) and Outcome Z (astronomically larger, lives barely worth living). Is Z better than A?  
  - **Yes** → Node 7  
  - **No** → Node 8  

  **Node 6:**  
  Is bringing a person into existence with a life *not* worth living a *harm* (i.e., makes the outcome worse)?  
  - **Yes** → **Leaf: Asymmetry View** (creating good lives isn’t a benefit; creating bad lives is a harm)  
  - **No** → **[Unoccupied: Unexplored]** (no major position combines these answers)  

  **Node 7:**  
  Is the value of adding a life with welfare level \(w\) *independent* of population size?  
  - **Yes** → **Leaf: Totalism** (value = total welfare)  
  - **No** → **Leaf: Variable-Value View** (weight falls as population grows)  

  **Node 8:**  
  Does the value of adding a life depend *only* on its welfare level (not population size)?  
  - **Yes** → **Leaf: Critical-Level View** (lives below a positive level count against the total)  
  - **No** → **Leaf: Variable-Value View** (weight falls as population grows)  

  **Node 9:**  
  Does the value of a person’s life depend on the rest of the population (e.g., relative standing, minority status, or threshold effects)?  
  - **Yes** → **Leaf: Average View** (value = average welfare)  
  - **No** → Node 10  

  **Node 10:**  
  Is adding a life with welfare barely worth living to an *empty world* good?  
  - **Yes** → **Leaf: Variable-Value View** (weight falls as population grows)  
  - **No** → **Leaf: Critical-Level View** (lives below a positive level count against the total)  

  ---

  ### Notes on Substantive Assumptions in the Tree

  1. **Node 1 (Mere Addition) as Root:**  
     The tree assumes that responses to the Mere Addition case (A vs. A+) are foundational. This encodes the assumption that theories must address whether adding lives with positive welfare is non-negative. Positions rejecting this (e.g., Average and high-threshold Critical-Level) branch early, but this might overlook views that reject the case’s framing.

  2. **Person-Affecting Branch (Node 3):**  
     The tree equates "only counting effects on necessary people" with the Narrow Person-Affecting View. This assumes such views *must* deny comparability of different-people outcomes (Node 2) and ignores hybrid theories that relax this constraint.

  3. **Separating Critical-Level and Variable-Value:**  
     The tree uses two distinctions:  
     - **Size-Dependence (Node 7/8):** Critical-Level treats value as a function *only* of individual welfare; Variable-Value treats it as a function of welfare *and* population size.  
     - **Empty-World Addition (Node 10):** Critical-Level rejects adding a barely-worthy life to an empty world; Variable-Value accepts it.  
     **Indistinguishability Warning:** These positions can converge (e.g., a Critical-Level near zero ≈ Totalism). To separate them sharply, add a case: *Adding a life with high welfare (e.g., 100) to a very large population*. Critical-Level *always* calls this good; Variable-Value *may* call it neutral/bad if weights diminish sufficiently.

  ---

  ### Key for Leaves
  - **Totalism:** Total welfare determines goodness.  
  - **Critical-Level View:** Lives below a positive critical level subtract value.  
  - **Average View:** Average welfare determines goodness.  
  - **Variable-Value View:** Value of added lives diminishes with population size.  
  - **Narrow Person-Affecting:** Only effects on people existing in all outcomes matter.  
  - **Wider Person-Affecting:** Adding people with good lives is beneficial.  
  - **Asymmetry View:** Creating good lives isn’t a benefit; creating bad lives is a harm.  
  - **Incomparability:** Some outcomes are on a par or non-comparable.
