  ### **Tree Summary**
  - **Nodes**: 8 (1–9, excluding Node 6 as part of common-source branch).  
  - **Leaves**: 10 positions.  
  - **Unoccupied Combinations**:  
    - **Stable aggregation** (Node 5B): *Incoherent*—cascades under independent signals are fragile by definition.  
    - **Externality optimizer** (Node 3A): *Unexplored*—theoretically plausible but lacks formal treatment.  
    - **Public evidence follower** (Node 6B): *Unexplored*—overlaps with efficient-market but distinct.  
  - **Indistinguishable Leaves**:  
    - **Efficient-market view** (Node 4A) and **Efficient-market view (common-source)** (Node 7A) are *not separated* by the tree. Both hold the herd is sufficient; the tree branches on signal source but not on aggregation mechanism.  
  - **Key Insights**:  
    - Truth-seeking branches (Nodes 3–5) center on informational efficiency.  
    - Common-source branches (Nodes 6–7) and reflexivity (Node 9) address shared evidence and self-fulfilling beliefs.  
    - Reputational branches (Nodes 8–9) decouple action from truth.  

