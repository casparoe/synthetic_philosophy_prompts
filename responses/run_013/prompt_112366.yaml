prompt: |-
  Ok so I'm not a philosopher, I just read a lot and argue with my friends more than is probably healthy, and I've been stuck on this thing for weeks. The argument is basically about whether everyday conventions — tipping, queueing properly, not jaywalking in front of kids, holding the door, standing on the right of the escalator, that whole family of stuff — are actually *moral* obligations or just manners. My friends are all in the "just manners" camp: they say if you don't tip or you cut the line you're a bit of a dick but you haven't done anything *wrong*, no one's been wronged, nothing to feel guilty about. I think that's too quick, and I want to write something about it — probably a long blog post, maybe just so I can win the argument. I've sketched my case below and I'd like you to comment on it. Be blunt, I don't need encouragement, I need to know where it falls apart.

  Here's the gist. I want to sort these conventions into two piles and say the moral weight is different in each. Pile one, "entry conventions": you basically can't participate in the thing at all without following them, like forming a queue at a bus stop or waiting your turn at a deli counter. Break these and the whole practice collapses, so I want to say the obligation is real and it's owed to everyone in the practice, not to any one person. Pile two, "exit conventions": you can ignore them and still get what you want, you just pay a social price, like tipping or thanking the bus driver. Nobody can stop you from walking out without tipping. I want to say these still obligate you, but in a weaker, weird way — owed to the specific person (the server) rather than to the practice, and only because they're relying on you in a way they can't easily avoid. Then the punchline I actually care about: I think the strength of the obligation tracks how much other people have *banked on* your compliance — how much they've already spent or arranged assuming you'll do the thing — and not how rude it looks or how much people will judge you. Tipping in the US is strong because the wage structure bakes it in; tipping somewhere it isn't expected is weak or nonexistent, even though it's equally "polite."

  And then the bit I'm least sure about, which is what I really want your take on. My friend's girlfriend is from a country where you don't tip and don't really queue the same way, and she says when she visits the US she shouldn't have to follow our conventions because she never agreed to them and they're not *her* norms — it's not like a law, and she's a guest. I want to say that's wrong and that visitors *do* have to follow local conventions, but the only reason I can give is something like "you're relying on the local system while you're in it, so you owe into it," which feels hand-wavy and maybe just begs the question. Also I suspect my two piles aren't actually a clean split — jaywalking seems like it's neither, since there's no real practice to collapse and no specific person relying on you, but I still feel like it's wrong to jaywalk through a crowd of schoolkids. So: is the entry/exit distinction doing real work or am I just relabeling "things with enforcement" vs "things without"? Does the reliance/banking idea actually carry the weight I'm putting on it, or does it collapse into "consequences" and lose the moral part? And does the conclusion about visitors follow, or is there a better argument for it that I'm missing? If you think the whole framing is wrong, tell me what you'd replace it with, but keep it grounded — I want the comments on this draft, not a survey of the literature, since I won't read it anyway.
reasoning: |-
  Okay, the user is grappling with a philosophical question about whether social conventions like tipping and queueing are moral obligations or just manners. They've proposed a framework dividing conventions into "entry" and "exit" types, and want feedback on its coherence and applicability to visitors. 

  First impression: This is impressively structured for a non-philosopher. The entry/exit distinction has intuitive appeal, especially how it links obligation to systemic reliance. But I see why they're uneasy—the visitor argument feels underdeveloped, and the jaywalking example exposes cracks.

  Hmm... their core insight about "banking on compliance" is stronger than they realize. It echoes Scanlon's contractualism (without using the term) where obligations arise from reasonable reliance. But they're right that the visitor case needs work—saying "you're relying on the system" does sound circular. The better angle might be: participation creates de facto consent to its rules, regardless of origin. Like joining a pick-up basketball game means you accept its informal foul calls.

  The jaywalking counterexample is sharp. It doesn't fit either pile because there's no mutual practice or specific reliance—yet most agree it's wrong to endanger kids. This suggests their framework might miss harm prevention as a separate moral layer. Maybe they need a third pile: "safety conventions" where the obligation comes from not imposing unreasonable risks.

  On enforcement vs. morality: They're correctly sensing that enforcement mechanisms (social shaming, systemic collapse) aren't what makes something moral. But their "banking" idea navigates this well—tipping is morally weighty in the US precisely because servers' livelihoods depend on it, not because we'll call you rude.

  For visitors: The strongest argument might be fairness. If you benefit from orderly queues while visiting London, refusing to queue is free-riding. Your "guest" status doesn't exempt you because guests still shouldn't break their host's vase. The reliance works both ways—you rely on the system functioning, so you owe non-disruption.

  Biggest gap: They haven't addressed power imbalances. Tipping's moral weight in the US stems from employers offloading wage burdens onto customers—that's arguably unjust design. But their framework treats it as neutral "reliance." Might need a footnote on whether propping up flawed systems is obligatory.

  Final thought: Their punchline about obligation tracking "banked compliance" is salvageable but needs refining. Entry conventions = obligation to practice integrity; exit conventions = obligation to individuals harmed by reliance; safety conventions = obligation not to endanger. Jaywalking through kids would fall under the third. Visitors owe all three types once they voluntarily engage with the society.

  ...Should probably avoid naming Scanlon though. They said no literature.
answer: |-
  Okay, let's dissect this. Your core insight – that the *moral weight* of conventions tracks **reasonable reliance and systemic vulnerability** – is powerful and avoids the "just manners" trap. The entry/exit distinction is a useful *heuristic*, but it's not airtight, and the visitor argument needs sharper teeth. Here's the blunt breakdown:

  **Strengths of Your Framework:**

  1.  **"Banking on Compliance" is the Key:** You're absolutely right. The moral force *does* stem from how much others have reasonably structured their actions, expectations, or even livelihoods based on the assumption you'll follow the convention. This moves it beyond mere politeness into the realm of fairness and preventing harm (broadly construed).
  2.  **Entry Conventions (Pile 1) - Solid Ground:** Your analysis here is strong. Cutting the queue fundamentally violates the fair distribution of access *everyone* relies on. The practice *only works* if (nearly) everyone adheres. Your obligation *is* to the collective practice and the individuals within it who are harmed by its collapse (delays, unfairness, chaos). The "owed to everyone" rings true.
  3.  **Exit Conventions (Pile 2) - Nuance Captured:** Tipping in the US is the perfect example. Servers *rely* on tips as part of their income due to a flawed system. While you "get the meal" without tipping, you directly harm the server who reasonably expected compensation based on the established norm. The obligation *is* stronger and more specific (to the server) than just "being polite." It's about fulfilling an implied term of the transaction within that specific context. Tipping where it's purely a bonus lacks this reliance, making it merely optional politeness.

  **Where It Gets Wobbly (and How to Fortify It):**

  1.  **The Entry/Exit Distinction is Leaky (The Jaywalking Problem):**
      *   **Jaywalking:** You nailed the issue. It doesn't neatly fit. There's no mutual "practice" like a queue. No *specific* person relies on you *not* jaywalking at that moment. Yet, jaywalking recklessly through kids *feels* morally wrong. Why?
      *   **Solution:** You need a **third category or a broader principle.** Call it **"Harm/Vulnerability Conventions"** or explicitly fold this into your reliance principle *by emphasizing the creation of unreasonable risk*. The moral wrong in reckless jaywalking isn't about collapsing a system, but about **imposing unreasonable risk of harm on vulnerable others** (kids are less aware, slower to react). The reliance isn't on a *practice*, but on a basic expectation of safety in shared spaces. *Your action banks on others being able to avoid you; you violate that reliance when you act recklessly.*
      *   **Escalator Standing:** Is standing on the right an "entry" convention? You *can* stand on the left and still ride, but you impede the flow *others rely on* for efficiency. It's closer to "harm/vulnerability" – creating a minor obstruction/risk and violating the efficient flow people reasonably expect.

  2.  **"Banking on Compliance" vs. Consequences:** This is the core philosophical pushback you might get. Does reliance *create* the moral obligation, or is it just a *consequence* of violating a pre-existing duty (e.g., fairness, non-maleficence)?
      *   **Your Defense:** Stick to your guns. The *specific content and weight* of the obligation *in this context* are defined by the reliance. Fairness is abstract; the *queue* makes the *specific demand of taking turns* concrete because that's the structure everyone relies on. Non-maleficence is abstract; the *tipping system* makes the *specific demand of compensating the underpaid server* concrete because they rely on it. The reliance structure *specifies* how the general principle applies here and now. It *is* the moral texture of the situation.

  3.  **The Visitor Problem (The Girlfriend Argument):** This is the weakest link in your current draft. "You're relying on the local system, so you owe into it" *is* hand-wavy. Why?
      *   **Lack of Consent?** She didn't choose the system.
      *   **Not Her Norms?** True.
      *   **Guest Status?** Can be argued both ways (guest privilege vs. guest responsibility).
      *   **Your Argument Needs More:**
          *   **Benefit & Fairness:** By being *in* the society, even temporarily, she **benefits** from its functioning conventions. She benefits from orderly queues (faster service, less chaos), from servers who provide good service *because* they rely on tips, from drivers stopping at crosswalks *because* they rely on pedestrians not jaywalking recklessly. To benefit from the system while refusing its core cooperative demands is **free-riding**. It's unfair to those who *do* uphold the system she's using.
          *   **Respect for the Community:** While not agreeing with every norm, participating respectfully in the basic social coordination mechanisms of a place you *choose* to visit is a minimal demand of **civility and respect for the people living there**. It acknowledges their way of structuring shared life.
          *   **Preventing Harm/Disruption:** Her actions (not queueing, not tipping) directly harm specific individuals (those delayed, the server shorted pay) and disrupt the system others rely on, just like a local's would. Her origin doesn't negate the *effect* of her actions within the system she's operating.
          *   **Analogy:** If you visit someone's home, you follow their house rules (shoes off, no smoking), even if they aren't *your* rules. You don't get to break their vase and say, "Well, I didn't agree to your 'no breaking vases' norm!" The shared space creates the obligation.
      *   **Punchier Visitor Argument:** "When you voluntarily enter and benefit from a social system built on specific cooperative conventions, you incur a **provisional obligation** to follow those conventions, especially when your non-compliance harms individuals or the system's function. Your guest status grants you leeway for *unavoidable* ignorance or minor faux pas, not a license to disregard core practices others reasonably rely on."

  **Conclusion & Reframing Suggestions:**

  *   **Entry/Exit Distinction:** Keep it as a useful *illustration*, but acknowledge its limits (jaywalking, escalators). The *real* work is being done by **"reasonable reliance and vulnerability."**
  *   **Core Moral Principle:** **We have a moral obligation not to undermine practices or harm individuals when they have reasonably relied on our compliance with established social conventions necessary for fair cooperation, risk reduction, or individual welfare within a specific context.**
  *   **Strength of Obligation:** This *does* track the **degree and reasonableness of reliance, and the severity of the harm caused by non-compliance.** Tipping in the US? High reliance (livelihood), severe harm (lost wages). Tipping elsewhere? Low/no reliance, no harm from omission. Queue jumping? High reliance on fairness, harm to all delayed. Minor etiquette breach? Low reliance, minor/no harm = weak or no moral obligation, just manners.
  *   **Visitors:** They are **temporary participants** in the system. Participation brings benefits and triggers the obligation to avoid harming the system or individuals within it through non-compliance with its core cooperative/vulnerability-reducing conventions. Ignorance mitigates, but benefit + harm creates the duty.
  *   **Jaywalking:** Fits under **"imposing unreasonable risk" (harm/vulnerability)**. The convention (crossing safely) exists to reduce risk. Violating it recklessly imposes that risk on others who rely on a basic expectation of safety.

  **Your Blog Post Punch-Up:**

  *   Start with the visceral examples (queue cutting, stiffing a server).
  *   Acknowledge the "just manners" view seems intuitive.
  *   Introduce the "reliance" insight as the game-changer: "It's not about the rudeness, it's about what people have *banked* on you doing."
  *   Use Entry/Exit as initial categories to explain the *different ways* reliance manifests (systemic collapse vs. individual harm).
  *   Anticipate and tackle the jaywalking counterexample head-on with the "risk/vulnerability" expansion.
  *   Confront the visitor argument with the benefit/fairness/harm triad: "You can't drink from the well and piss in it just because you didn't dig it."
  *   Conclude: These conventions *become* morally weighty when ignoring them betrays reasonable trust, exploits cooperation, or imposes harm. That's more than just bad manners – it's a failure of mutual obligation in shared social space.

  This framework holds water philosophically and gives you a much stronger, less question-begging argument against your friend's girlfriend. Good luck winning the argument!
