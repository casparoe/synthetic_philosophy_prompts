prompt: |-
  I've just spent two hours in the pub arguing with a mate who's finishing a PhD on inferentialism, and we got nowhere because we were each defending a line instead of agreeing on what the line has to achieve. So before I read anything else on this, I want the spec. What does a theory of the justification of deduction actually have to deliver -- an account of why it's all right to move from premises to conclusion in a basic inference, of what makes deductive inference a source of justification in the first place, rather than just a description of what we happen to do? Give me the desiderata list. For each one, the case or consideration behind it: the cases it has to get right, the distinctions it must not collapse, the results it has to be consistent with. I'd like to be able to hand the list to a first-year student who asks why modus ponens is OK and have it be honest, so pitch the requirements at that.

  To be clear about the sort of thing I mean, here's the stuff that's been rattling round my head. Carroll's tortoise, who grants the premises and grants the conditional and still won't draw the conclusion -- is he irrational, or merely not making an inference at all, and what happens if you try to fix him by adding another premise? The related worry that you can't get someone to adopt a basic rule in the first place by giving them a reason for it, because reasons only bite on someone who already reasons. Prior's 'tonk', which shows that not every set of introduction and elimination rules earns its keep. The intuitionist who won't grant excluded middle, and the plain fact that rival logics exist -- is that a substantive disagreement or a verbal one? Harman's point that logic is a poor guide to reasoning, since you obviously shouldn't bother revising your beliefs to closure, and a norm that demanded it would make everyone irrational. Finite minds, the conservativeness of deduction, the fact that we seem to learn things by inferring, incompleteness. And the distinctions I keep wanting to police: valid versus normative for belief; an inference being valid versus someone being justified in making it; a rule describing a pattern versus prescribing one; accepting a conditional versus inferring by means of it; basic rules versus derived ones; justified versus merely reliable. Tell me which of these are genuine requirements and which are just house prejudices of one camp, and which one requirement does the most work in ruling candidates out. The bit I most want, though, is the pair or triple you think can't be jointly satisfied -- my suspicion is it's got something to do with wanting basic rules to be justified by the meanings of the connectives (so that the justification isn't circular) while also wanting logical disagreement to be real rather than a failure to communicate, but you tell me whether that's the right fault line or whether I've misidentified it.

  Lead with your bottom line in the first sentence, then the reasoning -- no preamble, no restating what I asked. And be straight with me about the weak points: say where your list is most likely to be wrong, which of my framing assumptions you'd drop, and what argument or consideration would actually change your mind about the whole thing. British English, please.
