prompt: |-
  I'm a committee clerk in a UK legislature (I wont say which, it's small) and I need a screening procedure I can actually run at my desk. Every session we get somewhere between 15 and 40 amendments where the member's written justification leans on a religious argument — sometimes a whole paragraph of theology, sometimes one clause, sometimes a submission from a church or a mosque or a gurdwara that the member says is the reason for the amendment. At the moment the chair just asks me whether it qualifies as a public reason and I say something vague and we move on, which isnt sustainable, and last month a member complained that we'd let a religiously grounded amendment through in the spring and blocked an identical one in the autumn and nobody could tell him why.

  What I want from you is a decision procedure: the questions to ask, in the order I should ask them, what counts as a good enough answer to each, where it stops with a hard no and the justification goes back to the member, and where it has to go to the chair as a call I'm not competent to make. Twenty minutes per case. No legal training. I have to be able to write two lines in the file explaining what I did, and the chair signs off on anything that goes back to a member.

  Ground rules for the procedure:

  - Base it on what the public reason literature actually says about justifying state coercion, not on my committee's folk version of it. Where our own rules are wrong, say so.
  - Our standing orders have a rule the chair has always hated, adopted two years ago: a justification fails if it rests on a premise the person offering it would not accept if it came from a doctrine they reject. I think that's roughly the mirror-image idea but I'm not sure it survives contact with case 2 below. Keep it if it's defensible, amend it or kill it if it isn't.
  - It has to distinguish religious content that is doing the justificatory work from religious content that is decoration. In my own notes I've been calling this load-bearing versus ornamental; use whatever language you like, but the distinction has to survive translation into something I can apply in twenty minutes.
  - The procedure should tell me whether it applies differently to a minister moving a government amendment, a backbencher, and a member of the public who wrote in and got quoted, because right now we treat all three the same and that feels wrong.
  - Please dont give me a reading list or citations. I can't look anything up and the chair bins anything with footnotes. I want the procedure.
  - I'm not qualified to say whether an argument is good theology, and I don't want a procedure that requires me to be.

  Three cases to run it on. Don't pull your punches on the third.

  1. Licensing bill, cap on new off-licences in a ward. The member's explanatory statement says that cheap high-strength alcohol sold within 200 yards of the mosque makes it hard for people in the community to keep a religious obligation, and asks the committee to protect community life. There's also a paragraph citing antisocial behaviour reports and a public health submission. My instinct is that this one is fine because there's a public reason in there.

  2. Assisted dying bill. An amendment whose stated justification is entirely theological: life is given by God, we don't own it, the state must not license what God forbids. No public reason offered anywhere. The member says he is voting his conscience and the explanatory statement is just him being honest about why.

  3. A secular one, and this is where I expect to disagree with you. An amendment removing a licensing requirement for small traders, justified by self-ownership as a natural right that exists before any law does. Not a word of religion in it, and anyone can understand every sentence. I'd pass this in about thirty seconds.

  Two things I keep getting stuck on and want the procedure to settle. First, does it matter why the member really believes it — if he's privately doing it because his bishop told him to, does that spoil a perfectly good public reason he's put in writing? Second, half our members say a religious argument is fine as long as it's stated in words everyone can understand. I've never been sure that's the same thing as it being a public reason.

  Format. Give me the procedure first, as prose: numbered steps in plain language, with the stop rules and the handoffs marked, plus the two or three places where the procedure will misfire and I'll have to use my own judgment anyway. Then, after that, a single JSON object with these fields and nothing else:

  - case_results: an array, one entry per case above, each with:
    - case: 1, 2 or 3
    - load_bearing_premise: the premise the justification actually depends on, in one sentence
    - public_reason_offered: "yes", "no" or "partial"
    - public_reason_stands_independently: "yes", "no" or "cannot_tell"
    - mirror_test_result: "pass", "fail" or "not_applicable"
    - verdict: "clears", "clears_with_translation" or "sent_back"
    - verdict_in_one_line: the two lines I'd write in the file, condensed to one
    - what_the_member_must_supply: what would have to change for the verdict to improve, or "nothing"
    - confidence_0_100: your confidence in that verdict, as a number
    - least_sure_about_in_this_case: the specific thing you'd most want a second opinion on
  - handoff_to_chair: array of the questions the procedure sends upstairs, phrased as the question the chair has to answer
  - what_the_procedure_cannot_decide: array of the things no version of this screen can settle
  - committee_rule_verdict: "keep", "amend" or "repeal"
  - committee_rule_reason: one or two sentences on why
  - least_confident_claim_overall: the single point in your whole answer you are least sure of
  - why_least_confident: what would change your mind about it

  Say how confident you are in all of this, in the JSON and in a sentence of the prose, and be honest where the whole thing is a judgment call wearing a procedure's clothes. British English please, I'm in the UK and it goes in the file as is.
reasoning: |-
  Hmm, this is a fascinating and challenging request from a UK legislative committee clerk. They need a practical screening procedure for amendment justifications that rely on religious arguments, with very specific constraints: 20 minutes per case, no legal training required, and must produce auditable decisions.

  First, let's unpack their pain points:
  - Current process is ad hoc ("something vague") leading to inconsistency complaints
  - Standing orders contain a problematic "mirror test" rule (would you accept premise from doctrine you reject?)
  - Need to distinguish load-bearing vs ornamental religious content
  - Must handle different proposer types (minister, backbencher, public)
  - Three test cases including a tricky secular natural rights argument

  Key philosophical anchors:
  - Public reason requires justifications accessible to all reasonable citizens
  - Rawls' idea of the "burdens of judgment" - some disagreements are reasonable
  - Gaus' emphasis on justificatory reasons being shareable

  The procedure must:
  1. Identify the core premise
  2. Determine if religious content is structural or decorative
  3. Apply the mirror test carefully
  4. Assess public reason viability
  5. Handle proposer types differently (more leeway for citizens)

  For the standing order rule: The mirror test as formulated is flawed because it focuses on the proposer's personal acceptance rather than general accessibility. I'll recommend amending it to focus on whether the premise is reasonably contestable.

  Test case thoughts:
  - Case 1: Religious reference is contextual, not load-bearing (premise is community harm)
  - Case 2: Purely theological premise can't stand alone as public reason
  - Case 3: Natural rights argument fails the same test as religious ones - it's a comprehensive doctrine

  Biggest challenges:
  - The secular natural rights case will be controversial
  - Distinguishing decorative vs structural religion quickly
  - Not probing private beliefs (irrelevant per public reason theory)
  - Handling "plain language" religious arguments (accessibility ≠ public reason)

  The JSON output must precisely follow their requested fields - this is clearly for system integration. Confidence scores will be lower where judgment calls dominate.

  Final procedure will have:
  - Step-by-step flowchart logic
  - Clear handoff triggers to chair
  - Distinction between fatal flaws and fixable issues
  - Special handling for different proposer types
  - Explanation of why "plain language" isn't sufficient
answer: |-
  Here is a practical screening procedure based on public reason requirements, followed by the requested JSON analysis. The procedure focuses on whether the justification provides reasons accessible to all reasonable citizens, regardless of their comprehensive doctrines (e.g., religious, philosophical).

  ---

  ### **Amendment Justification Screening Procedure**  
  *Time limit: 20 minutes per case. Focus: Identifying whether the justification relies on public reasons.*  

  1. **Identify the core premise**  
     - Ask: *"What is the single, non-negotiable premise the amendment depends on? Ignore examples, data, or decorative language."*  
     - Stop if: No premise is stated. **Verdict: Send back** (member must state a premise).  
     - *Example:* "Alcohol proximity harms community" (Case 1) vs. "Life is owned by God" (Case 2).  

  2. **Check for load-bearing religious content**  
     - Ask: *"If I removed all religious language (e.g., ‘God’, ‘mosque’, ‘sin’), would the premise collapse?"*  
       - **Yes (load-bearing)**: Proceed to Step 3.  
       - **No (ornamental)**: Proceed to Step 4.  
     - *Ornamental example:* "Cheap alcohol near the mosque [cultural reference] harms public health" → premise stands without religion.  
     - *Load-bearing example:* "Life is God’s property" → premise collapses without theology.  

  3. **Apply the mirror test (amended version)**  
     - Ask: *"Is this premise reasonably contestable by citizens who reject its doctrinal source?"*  
       - **Passes**: If the premise could be defended with secular evidence/reasoning (e.g., "alcohol harms communities" is empirically verifiable).  
       - **Fails**: If the premise depends on non-falsifiable doctrine (e.g., "God forbids this" has no secular equivalent).  
     - **Stop if fails**. **Verdict: Send back** (premise is non-public).  
     - *Committee rule amendment:* Replace "would not accept if from a doctrine they reject" with **"is reasonably contestable by citizens"**. This avoids policing members’ biases and focuses on shareability.  

  4. **Assess public reason viability**  
     - Ask: *"Can the premise be justified using: (a) shared evidence (e.g., data, peer-reviewed studies), (b) widely accepted constitutional principles, or (c) neutral state interests (e.g., safety, equality)?"*  
       - **Yes**: Proceeds to Step 5.  
       - **No**: **Verdict: Send back** (insufficient public scaffolding).  
     - *Example:* "Self-ownership" (Case 3) fails unless tied to legal rights (e.g., privacy, autonomy) or empirical harms.  

  5. **Verify proposer type & burden**  
     - **Minister/Government**: Must provide public reasons only. Religious premises are inadmissible.  
     - **Backbencher/Member**: May include personal conscience but must anchor in public reason.  
     - **Public submission**: Allowed ornamental religious context if core premise is public.  
     - **Stop if**: Minister uses load-bearing religious premise. **Verdict: Send back**.  

  6. **Final verdict**  
     - **Clears**: Premise is public, no load-bearing religion (e.g., Case 1).  
     - **Clears with translation**: Ornamental religion + public premise (e.g., Case 1 if mosque reference is cultural).  
     - **Send back**: Load-bearing religion, failed mirror test, or no public reason (e.g., Case 2, Case 3 without amendment).  

  **Handoffs to Chair** (When you cannot decide):  
  - "Is this premise reasonably contestable by citizens of diverse doctrines?"  
  - "Does the religious content here serve a non-doctrinal, neutral purpose (e.g., cultural context)?"  

  **What the Procedure Cannot Decide**:  
  - Whether an argument is "true" theology or philosophy.  
  - The member’s private motives (irrelevant; screen the text only).  
  - Whether a premise is morally "right" (only if it’s publicly justifiable).  

  **Where Judgment is Needed**:  
  - Distinguishing cultural vs. doctrinal religious references.  
  - Assessing "reasonable contestability" in edge cases.  
  - Whether secular premises (e.g., "natural rights") are disguised comprehensive doctrines.  

  **Key Clarifications**:  
  - **Member’s private beliefs**: Irrelevant. Screen only the written justification.  
  - **"Plain language" fallacy**: Accessibility ≠ public reason. A clear theological statement (e.g., "God forbids this") is still non-public.  
  - **Committee rule verdict**: **Amend** the standing order to focus on "reasonable contestability" (Step 3). The current rule is unworkable—it demands mind-reading and ignores whether a premise can be universalized.  

  ---

