  **Overall Confidence**: 90/100. The procedure is robust for identifying load-bearing religion and non-public premises but requires judgment on "contestability" and cultural context. Case 3 is intentionally strict—public reason excludes *all* comprehensive doctrines, not just religious ones—but practice may vary by jurisdiction. Use the handoffs where uncertainty arises.
