  Hmm... the tricky part is that LLMs weren't around in Putnam's time, so I'm extrapolating. But Putnam was always interested in how meaning works in systems - he discussed how even a robot could refer if properly embedded. LLMs are trained on human language data, which comes from communities embedded in environments. That might satisfy his externalism.

