answer: |-
  Here's a precise translation of the units of selection debate into group-project grading vocabulary, followed by a residue report analyzing conceptual gaps. The analogy holds remarkably well but reveals key biological constraints missing in grading systems.

  ### Core Positions Translated
  1. **Gene-Centered View (Dawkins "Selfish Gene")**  
     - *Grading Equivalent*: Peer evaluation of **specific contributions** against a rubric.  
     - *Mechanism*: Each student’s final grade is determined by peer-assessed micro-tasks (e.g., "researching Topic X," "editing Section Y"). Group success is irrelevant; only individual task-scores matter. "Free riders" are traits (lazy members) discarded in peer eval. Genes = atomic tasks; organisms = temporary project groups.  
     - *Key Analogy*: The rubric (selection pressure) targets isolated contributions, not the worker or group.  

  2. **Individual Organism View (Standard Darwinism)**  
     - *Grading Equivalent*: **Individual grades** based on personal output.  
     - *Mechanism*: Each student is graded separately (e.g., own report section + peer feedback score). Group projects are just contexts for individual performance. Peer evaluation may penalize free riders but rewards individual effort. Group grade curves are noise, not selection.  
     - *Key Analogy*: The teacher (environment) evaluates individuals, even if work is submitted collectively.  

  3. **Group Selection View (Wynne-Edwardian "for the good of the group")**  
     - *Grading Equivalent*: **Single group grade** applied equally to all members.  
     - *Mechanism*: Success/failure is collective (e.g., presentation score = everyone’s grade). Free riders *lower* the group grade but aren’t individually punished. Altruists (students covering others’ work) boost the shared grade. Isolation = no cross-group grading curves.  
     - *Key Analogy*: Groups "live/die" via grade thresholds (e.g., A-group survives, F-group disbands).  

  4. **Multilevel Selection (Okasha’s pluralism)**  
     - *Grading Equivalent*: **Hybrid system** with weighted grades (e.g., 70% group score + 30% individual peer eval).  
     - *Mechanism*: Selection acts at multiple levels: groups compete for "best project" bonuses (group-level), while peer eval culls free riders (individual-level). Rubrics define what counts as a "unit" per task.  
     - *Key Analogy*: The teacher uses different grading rules for different assignment phases (e.g., group draft vs. individual reflections).  

  ---

  ### Residue Report: What Doesn’t Translate  
  **I. Clean Translations (Direct Analogy)**  
  - **Free riders** = selfish genes/lazy members (identical in gene/individual views).  
  - **Peer evaluation** = intra-genomic conflict (genes "evaluating" rivals) or individual competition.  
  - **Group grades** = pure group selection (success depends solely on collective output).  
  - **Curves/competition** = finite resources (only some groups get A’s).  
  - **Rubrics** = environmental selection pressures (define "fitness").  

  **II. Distorted Translations (Partial Overlap)**  
  - **Genes as "tasks"**:  
    - *Distortion*: Genes are passive replicators; students are agents. Peer eval implies intent—genes lack this.  
    - *Biological Insight*: Selection acts on gene *frequencies*, not "strategies." Grading assumes rational actors.  
  - **Group extinction**:  
    - *Distortion*: A failed group disbands, but members join new groups. Biological groups rarely "reform" with new members.  
    - *Biological Insight*: Real group selection requires strict isolation (like islands)—rare in classrooms.  
  - **Altruism**:  
    - *Distortion*: Students covering work expect reciprocity. Biological altruism (e.g., sterility in ants) has no "grade incentive."  
    - *Biological Insight*: True altruism only evolves if beneficiaries are kin (inclusive fitness), not just groupmates.  

  **III. No Counterpart (Grading Lacks Key Biology)**  
  1. **Heritability**  
     - *Residue*: Grades aren’t inherited. Your project grade doesn’t alter your *next* group’s baseline.  
     - *Why it Matters*: Evolution requires heritable variation. Genes persist; project roles don’t.  

  2. **Deep Time/Compounding**  
     - *Residue*: Projects are one-offs. Evolution accumulates changes over millennia (e.g., a "free rider gene" could dominate in 10,000 generations).  
     - *Why it Matters*: Group selection’s weakness is that individual selection acts faster—no grading equivalent.  

  3. **Physical Constraints**  
     - *Residue*: Students can choose roles. Genes are stuck in bodies; bodies are stuck in groups.  
     - *Why it Matters*: Gene-level selection is inevitable because genes outlast organisms.  

  4. **Non-Intentionality**  
     - *Residue*: Teachers design rubrics; evolution has no designer. Peer eval implies fairness; natural selection is amoral.  
     - *Why it Matters*: Biological units emerge from blind filtering, not pedagogical goals.  

  ---

  ### Conclusion: What the Residue Reveals  
  - **Your grading vocabulary captures the debate’s logical structure**—especially how defining "units" changes causal attribution (e.g., group grade vs. peer eval). This *does* reflect biology’s indeterminacy: whether genes, individuals, or groups are "selected" depends on how we frame the question.  
  - **But biology adds irreducible constraints**: Heritability, deep time, and physical embeddedness make gene/individual selection usually dominant. Group projects *feel* arbitrary because teachers impose units—but in nature, units emerge from physics/replication.  
  - **Takeaway**: The debate persists because no level is universally "true." Like choosing between group/individual grades, it’s about explanatory context. Your analogy proves the debate isn’t about reality, but about *description*—and biology’s residue shows why descriptions must obey material constraints (DNA, death, time).
