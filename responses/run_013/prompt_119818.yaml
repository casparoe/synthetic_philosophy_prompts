prompt: |-
  I spent thirty-five years in primatology, retired about six years ago, and have since drifted — via a long argument at a conference bar — into co-convening a master's seminar on the evolution of morality for the philosophy department. Next month I have to set the end-of-term essay paper, and I want one question on the WEIRD problem: the fact that most of what gets called moral psychology was run on Western, educated, industrialised, rich, democratic undergraduates, and what that does or doesn't do to the idea that some moral claims are true independently of what anyone thinks. My trouble is that every answer I get is the same two-step shuffle — people disagree, so it's all relative, so nothing's objectively true — or the mirror-image shuffle where the student insists there's an innate universal moral grammar and then sort of trails off. I want a question neither shuffle can answer.

  So I've invented a study for them to reason about. It's made up, and I'd like the model answer to be upfront about that — please don't let it dress the thing up as a real finding, speculate about whether anyone has actually run something like it, or cite literature as though that literature were this study. The population is left deliberately generic for the same reason. Here's the study. Anthropologists spend two years with a small-scale society and use two translated vignettes with a forced choice plus an open follow-up. Vignette one: a man privately eats a fish his clan's rules forbid him to eat — nobody is harmed, nothing is lost, he isn't caught. Vignette two: a man takes most of a widow's herd to meet an obligation owed to another lineage; her household goes without meat for months and a child falls ill; taking the animals is exactly what the rules require of him. The responses invert both of the axes we usually measure at once. The fish-eater did something gravely wrong; it would have been just as wrong if nobody had ever found out; and it isn't wrong merely because it's the rule — the rule merely reports how things are, and the ancestors couldn't have made it otherwise. The man who took the herd did nothing wrong at all; he did what he had to do; and if an outsider said it was wrong, that would just be the outsider's custom. Second finding: respondents who had spent six years or more at the mission school gave almost exactly the standard Western undergraduate pattern — the fish is a mere custom, the herd-taking is wrong in itself — while their siblings who never went to school gave the other pattern. Nothing else they measured (age, sex, wealth, distance from the road) predicted the flip.

  The question needs to force them through four moves: (1) say what "objective" is doing in the claim under test and prise it apart from "universal" and "widely agreed"; (2) say what argument, if any, the invented data give against objectivity, and name the extra premise that argument needs; (3) deal with the schooling result, since I expect nearly all of them to reach for it as a debunking tool — I want to see whether they notice that it debunks the schooled group just as efficiently, so that the finding is symmetric unless they can independently justify calling one side's formation the distorting one; and (4) say which meta-ethical positions are left standing and which, if any, the data actually kill. If they can also say what evidence would bear on the objectivity question at all, that's the top of the range. Treat it as a 45-minute essay question, candidates writing roughly 800 words, marking scheme out of 20.

  Please act as a professional philosopher who teaches metaethics and knows the cross-cultural moral psychology literature well, and who is good at writing exam questions that can't be answered by reciting a summary. Before you draft anything, think through where the real crux sits and sketch a short plan — I'd rather you spend the effort there than on polish. Then give me: the question; a model answer of about 750 words; and a marking scheme built on five must-hit points, with the marks each is worth adding up to 20 and one line per point on how candidates typically get that point wrong. Keep the model answer and the scheme honest about what is settled and what is genuinely contested among people who work on this — I don't want a live dispute presented as the consensus, and I don't want my own hunch (I lean realist, for what it's worth) turning up as though it were the standard view. Everything in British English, please, and don't fuss about my spelling — I've been in the States too long.
reasoning: |-
  Okay, let me approach this systematically. The professor wants an exam question that pushes students beyond simplistic relativism vs universalism debates in moral psychology, using a fictional cross-cultural study as a springboard.

  First, I need to unpack the core challenge: students keep falling into two traps - either declaring moral relativism whenever cultural differences appear, or asserting universal moral grammar without evidence. The fictional study is cleverly designed to complicate both positions by showing: 
  1) A society where moral objectivity is claimed for conventional rules (fish-eating) 
  2) Harm-based wrongness is rejected when aligned with rules (herd-taking) 
  3) Schooling correlates with Western responses

  The professor's required four moves map to key metaethical competencies:
  - Distinguishing objectivity from universality/agreement (conceptual clarity)
  - Analyzing evidentiary weight of cultural variation (epistemology)
  - Recognizing symmetry in debunking arguments (critical reasoning)
  - Mapping implications for metaethical theories (synthetic evaluation)

  For the question itself, I'll frame it to force engagement with the paradox: a culture that treats rules as objectively moral while dismissing harm concerns, and schooling that makes responses "Western." The wording must block standard shuffles by emphasizing the objectivity claim within the fictional culture.

  For the model answer structure:
  1) Define moral objectivity carefully, separating it from universality and consensus
  2) Show why the data don't automatically support relativism - the extra premise needed
  3) Dissect why schooling isn't a neutral debunker - symmetry problem
  4) Map consequences: expressivism survives, some constructivists struggle, realism needs explaining
  5) Suggest what evidence could actually test objectivity (e.g., tracking moral error)

  The marking scheme will penalize:
  - Conflating objectivity with universality (common mistake)
  - Missing the extra premise for relativism (oversimplification)
  - Schooling asymmetry blindspot (critical failure)
  - Overclaiming data kills theories (lack of nuance)
  - No positive evidence proposal (incomplete analysis)

  Throughout, I'll maintain disciplinary rigor: flag where professional debates exist (e.g., whether harm is truly foundational), avoid presenting the professor's realism as default, and keep British English conventions. The fictional study must remain clearly labeled as such throughout.
answer: |-
  ### Exam Question  
  **Subject:** Metaethics & Moral Psychology (Term Essay)  
  **Time Allowed:** 45 minutes  
  **Word Guide:** ~800 words  

  > **QUESTION:**  
  > A fictional anthropological study (presented as such) examines moral judgments in a small-scale society using two vignettes:  
  > (1) A man secretly eats a fish forbidden by clan rules (no harm, no discovery).  
  > (2) A man takes most of a widow’s herd to fulfil a lineage obligation, causing hardship and illness; this action is rule-compliant.  
  >   
  > **Findings:**  
  > - Non-schooled respondents:  
  >   - (1) is *objectively wrong* (even if undiscovered; rules "report how things are").  
  >   - (2) is *not wrong* ("he did what he had to do"; criticism is mere "outsider’s custom").  
  > - Schooled siblings (6+ years mission school):  
  >   - (1) is *not objectively wrong* (mere convention).  
  >   - (2) is *objectively wrong* (harm-focused).  
  >   
  > No other variables (age, sex, etc.) predicted this divergence.  
  >   
  > **Tasks:**  
  > (a) Clarify what "objectively wrong" means in metaethics, distinguishing it from "universal" and "widely agreed".  
  > (b) Analyse whether—and how—this data challenges moral objectivity. Identify any *extra premise* needed for this challenge.  
  > (c) Explain why the schooling result *cannot neutrally debunk* one group’s judgments without potentially debunking both.  
  > (d) Assess which metaethical positions (e.g., realism, relativism, constructivism) are *weakened*, *strengthened*, or *unaffected* by these findings.  
  > (e) (Optional for top marks) Suggest what evidence *could* bear on moral objectivity beyond this study.  

  ---

  ### Model Answer (~750 words)  
  **Note:** This answer treats the study as fictional. Real-world literature (e.g., Haidt, Shweder) shows similar patterns but does not replicate this exact design.  

  **(a) Defining "Objectively Wrong"**  
  Moral objectivity claims that moral truths hold independently of human beliefs, emotions, or conventions. For example, "torturing innocents for fun is wrong" would be true regardless of whether any culture approves of it. This contrasts sharply with:  
  - *Universality*: A judgment shared by all humans (e.g., incest aversion). Objectivity does not require universality; a truth could be unrecognised.  
  - *Wide Agreement*: A culturally contingent consensus (e.g., driving on the left). Agreement does not entail objectivity; widespread error is possible.  
  The non-schooled group’s claim—that the fish-eating rule "reports how things are" and "could not be otherwise"—explicitly endures objectivity. Their view treats morality as akin to physical laws, not subjective preference.  

  **(b) Does the Data Challenge Objectivity? The Extra Premise**  
  The data *could* challenge objectivity *if* we add an extra premise: **"Systematic moral disagreement undermines justification for believing in objective moral truths."**  
  - The study shows radical disagreement: one group sees harm (vignette 2) as objectively wrong, the other does not; one sees rule-breaking (vignette 1) as objectively wrong, the other as conventional.  
  - *However*, disagreement alone cannot refute objectivity. Objective domains (e.g., physics) tolerate disagreement (e.g., flat-earth beliefs). The challenge arises only if disagreement suggests *no reliable access* to moral truths. Here, both groups claim objectivity, but their judgments invert. This *could* indicate that moral intuitions are socially constructed, not truth-tracking—*if* we accept the extra premise above. Without it, the data merely show variation in beliefs, not their falsity.  

  **(c) The Schooling Result: A Symmetrical Debunking Problem**  
  Many students will treat schooling as "enlightening" the non-schooled group, revealing their judgments as parochial. But this is question-begging:  
  - Schooling correlates with Western-style judgments (harm-focused, convention-sceptical). Yet Western intuitions are also culturally specific—the WEIRD problem highlights this.  
  - To claim schooling *corrects* moral perception assumes Western objectivity is privileged. But the non-schooled group sees schooling as *distorting* their ancestral "truth-tracking" intuitions. Crucially:  
    - **Symmetry**: Both groups’ judgments are predicted by cultural exposure. Debunking one group debunks both unless we independently justify privileging one cultural framework.  
    - **Neutrality Failure**: No "view from nowhere" exists to declare schooling improves moral accuracy. The data only show that education *shifts* judgments, not that it *improves* them.  

  **(d) Metaethical Implications**  
  - **Moral Relativism (e.g., Gilbert Harman)**: *Strengthened* superficially—disagreement supports "right-for-culture-X" claims. But relativism cannot explain why *both* groups assert objectivity. If morality is relative, why do subjects deny it?  
  - **Evolutionary Debunking Arguments (e.g., Sharon Street)**: *Strengthened*. If education alters intuitions, moral beliefs may reflect adaptive/ cultural conditioning, not truths. Yet non-schooled subjects’ "ancestral" objectivity claims also risk being debunked by genealogy.  
  - **Moral Realism (e.g., David Enoch)**: *Challenged but not refuted*. Realists must explain why culturally variable intuitions track truth. One reply: disagreement stems from *non-moral* errors (e.g., empirical ignorance about harm). Here, however, both groups acknowledge the harm in vignette 2 but disagree on its moral weight.  
  - **Constructivism (e.g., Korsgaard)**: *Unaffected*. If morality is constructed by rational agents, cultural variation is expected. But the non-schooled group’s appeal to *mind-independent* truth ("ancestors couldn’t have made it otherwise") clashes with this.  
  - **Expressivism (e.g., Blackburn)**: *Strengthened*. The data fit expressivism’s view that moral claims project attitudes. Schooling reshapes attitudes; both groups "objectify" their sentiments.  

  **(e) Evidence for Objectivity: Beyond Disagreement**  
  Disagreement alone cannot settle objectivity. Better evidence might include:  
  - **Convergence**: If diverse cultures independently develop similar norms (e.g., prohibitions on unprovoked violence), despite variable starting points.  
  - **Tracking Invariants**: Whether moral judgments track features *plausibly* truth-conducive (e.g., welfare, fairness) across contexts, especially under improved reflection.  
  - **Moral Progress**: Whether societies abandon practices (e.g., slavery) based on *reasons* all could accept, suggesting error-correction.  
  This study, however, offers no such evidence—only symmetrical disagreement.  

  **Conclusion**  
  The study complicates lazy relativism ("disagreement proves no truth") and naive universalism ("harm is always wrong"). It exposes the symmetry of cultural influence and the need for metaethics to address *why* we objectify moral demands. Objectivity is not ruled out, but its defenders must explain how truth-tracking survives radical cultural variance.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points** (Deduct marks for omissions/errors; reward nuance):  

  1. **Definition of Objectivity** (4 marks)  
     - Must distinguish objectivity from universality/agreement.  
     - *Common error:* Conflating terms (e.g., "objective = universal").  

  2. **Disagreement + Extra Premise** (5 marks)  
     - Must state data *alone* doesn’t challenge objectivity; requires premise linking disagreement to unreliability.  
     - *Common error:* Claiming variation directly proves relativism.  

  3. **Schooling Symmetry** (5 marks)  
     - Must note schooling debunks *both* groups’ judgments unless one framework is privileged arbitrarily.  
     - *Common error:* Assuming schooling "corrects" non-schooled intuitions.  

  4. **Metaethical Mapping** (4 marks)  
     - Must identify at least 2 positions affected (e.g., realism challenged, expressivism strengthened).  
     - *Common error:* Overclaiming (e.g., "data kills realism") or ignoring positions.  

  5. **Evidence for Objectivity** (2 marks)  
     - Bonus for plausible evidence suggestions (e.g., convergence, progress).  
     - *Common error:* Repeating disagreement as evidence.  

  **Top marks (18–20):** Hits all points, notes metaethical nuances (e.g., realist replies), suggests valid evidence.  
  **Pass (10–12):** Defines objectivity, notes disagreement, but misses symmetry or metaethical depth.  

  ---

  **Design Notes:**  
  - **Crux:** The symmetry of cultural influence blocks privileging WEIRD intuitions. Students must see that *both* groups are vulnerable to debunking.  
  - **Anti-Shuffle Mechanism:** The question forces engagement with *objectivity claims within the data*, not just variation. Relativists must explain why subjects reject relativism; universalists must explain the harm-rule inversion.  
  - **Neutrality:** Model answer acknowledges realist strategies (e.g., error theories) and relativist strengths without endorsing either. Schooling is framed as a neutral variable, not an "advancement".  
  - **British English:** Honour "standardised", "neutralise", etc.  

  This should push students beyond the "disagreement → relativism" trope while respecting live debates in metaethics. Let me know if you’d like adjustments to weighting or emphasis.
