  ### Taxonomy of Standing to Blame: A Question-Based Tree  
  *Focused on hypocrisy and moral address; built from logical space. Branch nodes are concrete questions; leaves include position names (or "unnamed") and their most awkward commitments. Cases referenced: ex-smoker (ES), doctoral student (DS), state (ST), self-blamer (SB), privileged group member (PG).*  

  #### Root Question: **What is the primary effect of lacking standing to blame?**  
  *(This determines the normative force of standing constraints.)*  
  - **Branch A (Impermissibility):** Lacking standing makes blame morally impermissible.  
  - **Branch B (Non-commendability):** Lacking standing makes blame non-commendable (permissible but defective in a way that negates praise).  
  - **Branch C (Meddlesomeness):** Lacking standing makes blame merely pragmatically meddlesome (permissible but criticisable as intrusive or ineffective).  

  #### For Branch A (Impermissibility):  
  **Q1: Is standing a binary status or scalar?**  
  *(Does one either "have" or "lack" standing, or is it a matter of degree?)*  
  - **Binary:** Standing is all-or-nothing.  
    - **Q2: What is standing fundamentally *for*?**  
      - **Moral power (MP):** Standing is a normative power to hold others accountable.  
        - *Leaf 1: **Deontic Authority View***  
          - *Most awkward commitment: ES impermissibly violates his brother's moral boundaries by blaming, even if his criticism is true and well-intentioned.*  
      - **Aptness condition (AC):** Standing is a precondition for the aptness of reactive attitudes (e.g., resentment).  
        - *Leaf 2: **Reactive Aptness View***  
          - *Most awkward commitment: DS's blame is inapt (like a category mistake) because her own funding undermines the emotional sincerity required for resentment.*  
  - **Scalar:** Standing admits degrees (e.g., "more/less standing").  
    - *Leaf 3: **Threshold Impermissibilism (unnamed)***  
      - *Most awkward commitment: ST may permissibly lecture another state only if its own human rights violations fall below a context-dependent threshold of severity.*  

  #### For Branch B (Non-commendability):  
  **Q1: Can hypocrites regain standing? If so, how?**  
  *(Focus on recovery from hypocrisy.)*  
  - **Reform:** Regain standing by ceasing the behavior.  
    - *Leaf 4: **Reform-Recovery View***  
      - *Most awkward commitment: ES cannot credibly blame his brother until he has abstained from smoking long enough to prove reform—even if his brother’s current actions are clearly wrong.*  
  - **Apology:** Regain standing by apologizing for past wrongdoing.  
    - *Leaf 5: **Apology-Recovery View***  
      - *Most awkward commitment: ST may immediately blame another state after apologizing for its own identical conduct, even if no policy changes occur.*  
  - **Submission:** Regain standing by accepting blame from others first.  
    - *Leaf 6: **Submission-Recovery View***  
      - *Most awkward commitment: PG member can blame a peer only after enduring and accepting blame for their own identical remark.*  
  - **No recovery:** Hypocrisy permanently voids standing for that norm.  
    - *Leaf 7: **Irrecoverable Hypocrisy View***  
      - *Most awkward commitment: SB cannot ever legitimately blame their past self, as current remorse doesn't erase past inconsistency.*  

  #### For Branch C (Meddlesomeness):  
  **Q1: Is standing lost for a token act or a type of norm?**  
  *(Does hypocrisy undermine *this specific* blame-act or *all* blame about that norm?)*  
  - **Token-specific:** Standing is lost only for this blame-act.  
    - **Q2: What pragmatic factor makes blame meddlesome?**  
      - **Lack of credibility:** Blame is ineffective because the hypocrite’s inconsistency undermines persuasive force.  
        - *Leaf 8: **Pragmatic Credibility View***  
          - *Most awkward commitment: DS’s blame is meddlesome only if her supervisor (knowing her funding) discounts her criticism as untrustworthy.*  
      - **Unwarranted intrusion:** Blame improperly crosses relational boundaries.  
        - *Leaf 9: **Relational Intrusion View***  
          - *Most awkward commitment: ES’s blame is meddlesome only if his brother feels harassed by repeated dinner lectures, regardless of ES’s reform.*  
  - **Type-general:** Standing is lost for all blame about that norm.  
    - *Leaf 10: **Type-Mediation View (unnamed)***  
      - *Most awkward commitment: PG member’s criticism is always meddlesome for norms they’ve violated, even if the current act is private and non-intrusive.*  

  #### Notes on Coherence and Occupancy:  
  - **Branch A + Scalar + MP (Leaf 3):** Coherent but unattractive—arbitrary thresholds risk excusing serious hypocrisy.  
  - **Branch C + Type-general (Leaf 10):** Coherent but unoccupied—likely because it conflates standing with general authority.  
  - **Branch B + Reform (Leaf 4) vs. Submission (Leaf 6):** Distinction collapses if "reform" includes submitting to blame. Flagged as overlapping.  
  - **Self-blame (SB case):** Only explicitly covered in Leaf 7. Other leaves must extend their logic (e.g., reform-based views permit self-blame after change).  

  #### How Cases Map to Leaves:  
  - **ES (ex-smoker):** Most strained under Leaf 4 (reform delays standing) and Leaf 9 (intrusion depends on context).  
  - **DS (student):** Central to Leaf 2 (inapt blame) and Leaf 8 (pragmatic credibility).  
  - **ST (state):** Challenges Leaf 5 (apology recovery) and Leaf 3 (scalar thresholds).  
  - **SB (self-blame):** Addressed in Leaf 7 (irrecoverable hypocrisy).  
  - **PG (privileged group):** Tests Leaf 6 (submission recovery) and Leaf 10 (type-meddling).  

  ---  
  *Taxonomy ends with 10 leaves, spanning 8–12 as requested. Positions derived from logical combinations; labels are descriptive. Unnamed leaves indicate unexplored (but coherent) views. Cases ensure concrete application.*
