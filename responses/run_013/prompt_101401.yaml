prompt: |-
  I've been trying to write down, for a reading group, what I actually think about how we learn morals from lives, and I'd like a consistency check before I circulate it. Here is roughly where I've landed.

  (1) Moral knowledge travels mainly by exemplars: you come to grasp what a virtue is by seeing it enacted, not by learning a rule that names it.
  (2) Biography is the preeminent medium for this, since a well-told life shows a character across many circumstances in a way no principle-statement can.
  (3) I accept the is/ought gap: no accumulation of descriptive facts about how someone lived entails a conclusion about how anyone ought to live.
  (4) I've come to think a life instructs only when it is presented as actually lived by a specific person, and only when the reader could in principle have been that person. Let's call the second clause the imitability condition.
  (5) On that basis I hold that hagiography is not merely unreliable history but pedagogically void: the idealization is precisely what drains it of force.
  (6) And yet I take Plutarch's paired lives to be the model of moral pedagogy, legendary subjects and all.
  (7) I also think the motivational force of an exemplar comes from the gap between reader and exemplar rather than from resemblance — the distance is the point, not a defect to be closed.

  Which of these actually pull against each other, which only look like they do, and what is the cheapest revision that would restore consistency? Rank the real tensions by severity rather than listing them all as equally bad, and tell me what each one would cost me to give up.
reasoning: |-
  Okay, let me try to figure out what the user is asking. They've outlined seven points about how moral knowledge is learned through exemplars, specifically biographies. They want a consistency check before sharing with their reading group. The key points are that moral understanding comes from seeing virtues in action, biographies are the best medium, the is/ought gap exists, lives must be presented as actually lived and imitable, hagiography is pedagogically void, Plutarch is a model despite legendary subjects, and motivation comes from the gap between reader and exemplar.

  First, I need to identify any contradictions. Points 5 and 6 seem conflicting. Point 5 says hagiography (idealized biographies) is void because idealization removes force. But point 6 praises Plutarch, who included legendary figures. How does that work? Maybe Plutarch's approach isn't considered hagiography? Or perhaps the user distinguishes between legend and idealization? That's a tension to explore.

  Then, points 4 and 7. Point 4 says the reader must be able to imagine being the exemplar (imitability). But point 7 says motivation comes from the distance, not resemblance. If the exemplar is too distant, can the reader really see themselves as that person? Yet the gap is motivational. Maybe the exemplar needs to be aspirational yet relatable? That's another possible conflict.

  Point 3 (is/ought gap) seems consistent with the rest since the user isn't deriving ought from is directly but through exemplars as models. The other points support that. No issue there.

  Now, ranking the tensions. The Plutarch vs. hagiography contradiction is high severity because they're directly opposing. If Plutarch uses legendary subjects, which might involve idealization, but point 5 rejects idealization. The user might need to adjust their view on what counts as hagiography or accept some idealization if it's not full mythologizing.

  The imitability vs. motivational gap is medium severity. It's about balancing relatability and aspiration. The user might need to clarify that imitability doesn't mean exact resemblance but the possibility of growth towards the exemplar.

  Cheapest revisions? For the first tension, distinguishing between legend and idealization. Plutarch's subjects might have legendary elements but are presented as real people with flaws. So the user can refine point 5 to target only full idealization, not all legendary aspects. That costs little—just a nuance in defining hagiography.

  For the second tension, redefining imitability as "possible" rather than "plausible" or adding that the gap is necessary for motivation. This aligns points 4 and 7 without major changes. Maybe emphasize that the reader identifies with the exemplar's humanity, not their specific circumstances.

  The user's deeper needs: They want to present a coherent argument to their reading group. They might be concerned about critiques on contradictions, especially regarding historical accuracy vs. pedagogical value. They value both realism (anti-idealization) and aspirational models (Plutarch). Also, they might want to defend the use of classical texts that aren't strictly factual but still effective. Ensuring their model accommodates both historical and legendary exemplars without inconsistency is key. They need a framework that allows for inspirational distance while maintaining relatability.
answer: |-
  Here's a consistency check of your propositions, ranked by severity of tension, along with analysis and potential resolutions:

  **Highest Severity Tension:**

  1.  **Points 5 & 6: The Plutarch Problem**
      *   **Conflict:** Point 5 states that idealization (hagiography) "drains [a life] of force" and makes it pedagogically void. Point 6 holds up Plutarch's *Lives* (which include legendary figures like Theseus and Romulus, and involve significant narrative shaping, moral framing, and selective emphasis even with historical figures) as the *model* of moral pedagogy.
      *   **Analysis:** This is the sharpest contradiction. Plutarch *is* engaging in a form of idealization and myth-making. He explicitly states his purpose is moral instruction, not strict historical accuracy ("We are writing Lives, not History"). His use of paired comparisons inherently shapes the narrative towards highlighting specific virtues and vices. Calling this "the model" directly contradicts the claim that idealization drains pedagogical force.
      *   **Cost of Revision:**
          *   **Cheapest Revision:** **Refine Point 5.** Distinguish between *destructive* idealization (whitewashing, removing flaws, creating impossible perfection) and *constructive* shaping (selective emphasis, narrative framing, highlighting virtues *within* a recognizably human context, even if legendary). Argue that Plutarch does the latter, while hagiography does the former. Point 5 becomes: "Hagiography (understood as the depiction of flawless, impossible saints devoid of relatable struggle) is pedagogically void..." This allows Plutarch's more nuanced, human-scale (even if legendary) exemplars to stand.
          *   **More Expensive Revision:** **Modify Point 6.** Acknowledge that Plutarch's method *relies* on a certain level of shaping and even idealization *as part of its pedagogical power*, and that your rejection in Point 5 is perhaps too broad or targets only a specific, cruder form of it. This costs you the purity of the "anti-idealization" stance in Point 5.
          *   **Most Expensive Revision:** **Abandon the Strong Claim in Point 5.** Concede that *some* degree of shaping, emphasis, and even minor mythologizing *can* be pedagogically effective (as Plutarch demonstrates), but argue that *extreme* hagiography still fails. This costs you the core assertion that idealization *itself* is the problem.

  **Medium Severity Tension:**

  2.  **Points 4 & 7: The Imitability vs. Motivational Gap Paradox**
      *   **Conflict:** Point 4 requires that the reader must be able to conceive of themselves *as* the exemplar ("could in principle have been that person"). Point 7 states that the motivational force comes *from* the perceived gap/distance between the reader and the exemplar.
      *   **Analysis:** These points create a psychological tension. If the gap is essential for motivation (admiration, aspiration), but the reader must also genuinely believe "I could, in principle, be that person," there's a delicate balance. Too much perceived distance might make the exemplar seem alien and unattainable, violating the "imitability condition." Too little distance might remove the aspirational pull. The potential conflict lies in whether the "gap" Point 7 celebrates could ever become so large that it violates the "in principle" possibility required by Point 4 (e.g., a modern reader and Alexander the Great? A saint performing miracles?).
      *   **Nature:** This is more of a *tension to be managed* than a strict logical contradiction. Both forces (relatability/attainability and aspiration/challenge) are likely necessary.
      *   **Cost of Revision:**
          *   **Cheapest Revision:** **Clarify and Integrate.** Explain that the "imitability condition" (Point 4) establishes the *necessary foundation* – the exemplar must inhabit a shared moral universe and possess recognizably human capacities (even if extraordinary). The *motivational spark* (Point 7) then comes from the *perceived gap* in the *realization* or *consistent embodiment* of those shared capacities/virtues within the specific life narrated. The reader thinks, "I have the same potential for courage, but look at how *far* they took it!" or "I face similar temptations, but they overcame them *so* decisively." This costs only the effort of more nuanced explanation, not abandoning either core idea. Emphasize "in principle" focuses on shared human potential, not identical circumstances or outcomes.
          *   **More Expensive Revision:** **Soften Point 4.** Shift from "could in principle have *been* that person" (which is very strong, especially across time/culture) to "could in principle *emulate the relevant virtues* demonstrated in those circumstances, *mutatis mutandis*." This focuses the "imitability" on the virtue-in-action, not the specific historical identity. Costs some precision in Point 4 but resolves potential historical/cultural distance issues.

  **Lower Severity / Apparent Tensions (Likely Resolvable):**

  3.  **Points 3 & 1/2/4/6/7: The Is/Ought Gap and Moral Knowledge**
      *   **Apparent Conflict:** Point 3 insists no descriptive facts entail an "ought." But the whole system (1,2,4,6,7) describes how we *learn* "oughts" (moral knowledge, virtues) from descriptions (lives).
      *   **Resolution:** This is classic Hume handled correctly. You are **not** claiming the biography *logically entails* the moral conclusion. You are claiming it *displays* or *manifests* the virtue in a way that allows the reader to *grasp its meaning and value phenomenologically*. The moral knowledge arises from *understanding the virtue shown*, not from deducing "ought" from "is". The biography provides the *object* of understanding, not the logical proof. Point 3 guards against a fallacious deduction; your other points describe a non-deductive mode of apprehension. **No revision needed.** This is a strength, showing you've considered the philosophical foundation.

  4.  **Points 1 (Exemplars) & 2 (Biography Preeminent)**
      *   **Apparent Limitation:** Couldn't novels, plays, or even real-life observation also serve as exemplars?
      *   **Resolution:** You call biography the *"preeminent"* medium, not the *only* one. Your argument for its preeminence (showing character across *many circumstances*) is strong. You can readily acknowledge other sources (Point 1 says "mainly", not "exclusively") while defending biography's unique strengths. **No revision needed**, unless you want to soften "preeminent" to "particularly powerful" or "uniquely valuable in X way" if challenged.

  **Conclusion on Consistency & Recommendations:**

  *   **The Core Tension:** Your framework is largely coherent and insightful, but the **Plutarch Problem (Points 5 vs. 6)** is the most significant inconsistency. Your admiration for Plutarch directly challenges your strong rejection of idealization.
  *   **The Psychological Tension:** The **Imitability vs. Gap (Points 4 vs. 7)** requires careful explanation to show how relatability and aspiration work together, not at odds.
  *   **Resolved Tensions:** The Is/Ought point (3) is well-integrated and not a problem. The focus on biography (2) as preeminent is defensible within the framework.

  **Cheapest Path to Greater Consistency:**

  1.  **Revise Point 5:** Target it specifically at *destructive* idealization (hagiography that creates inhuman perfection, removes struggle, or severs connection to reality). Articulate how Plutarch's method, while employing shaping and legendary material, *avoids* this by keeping virtues grounded in recognizably human psychology, struggle, and consequence (even within a legendary framework). *Cost: Nuancing your definition of the problematic idealization.*
  2.  **Clarify Points 4 & 7:** Explicitly state in your document that the "imitability condition" (4) ensures the exemplar operates within the realm of shared human potential, making the virtues *conceivable* as possibilities for the reader. The motivational "gap" (7) arises from the *exemplar's exceptional realization or embodiment* of that shared potential within the narrative of their life, creating the aspirational pull. *Cost: Adding a few sentences of explanation.*

  By making these relatively low-cost adjustments, you resolve the major inconsistency (Plutarch) and preempt potential misunderstandings about the psychological dynamic (Imitability/Gap), strengthening your overall argument for the power of specific, relatable, yet aspirational lives as the engine of moral learning. Your core insights about exemplars, biography, the is/ought gap, and the role of both identification and aspiration remain intact and powerful.
