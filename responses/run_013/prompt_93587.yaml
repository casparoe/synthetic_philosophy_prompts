  my friend keeps telling me nuclear brinkmanship is just the game of chicken: two drivers floor it at each other, first one to swerve loses, so the smart play is to make a big show of ripping your own steering wheel out and throwing it out the window — now the other guy knows you literally can't swerve, so he does, and you win. he says thats the whole lesson of deterrence: never leave yourself an off-ramp, and anything that looks like one — no-first-use, taking missiles off hair-trigger, a hotline — is just swerving first. can you give me the actual mapping (who's the driver, what's the swerve, what's the crash) and then tell me where it breaks? i suspect it's carrying his conclusion for him, because in the real thing the roads are icy and neither driver is really holding the wheel, and if both cars are wired to take out the whole highway then "winning" doesn't mean what it means in his econ textbook. which disanalogies actually matter for his claim, which are just noise, and is there a better analogy for what brinkmanship is actually doing?
