  The user noticed a pattern that works: showing the person's bad phase first (manual) and their transformation into goodness (advert). They reference Plutarch's distinction between writing lives vs. history. Their core ask is whether there are terms for a life that's learnable vs. merely admirable, and for the conversion-arc narrative trick.

  First, I need to validate their observation. This isn't a stupid question—it's deeply philosophical, touching on virtue ethics (Aristotle's habituation), hagiography tropes, and narrative theory. The tension they describe is real: perfection alienates, while imperfection demotivates. 

  For the "learnable" quality, "exemplarity" is close but often implies admiration over imitation. I should emphasize imitability—the actionable path. For the conversion arc, "narrative emplotment" (Hayden White) or "didactic arc" might work, but "pedagogical vulnerability" (coined here) captures the exposed struggle better. 

  I should address their subtext too: they want practical takeaways, not just theory. They’re frustrated by unactionable ideals. The deeper need might be combating their own discouragement when comparing to "perfect" lives. The conversion arc works because it mirrors the user’s own potential for growth. 

  Also, they hint at biography as a genre problem—text vs. reality. So I’ll distinguish between the person’s actual life (which may be messy) and its curated textual portrayal (which can obscure learning). The "awkward cases" they mention (admirable but not learnable, etc.) show they’ve thought about edge cases. I’ll use those to clarify the terms. 

  Finally, their love for Plutarch’s approach suggests they value narrative framing over raw facts. I’ll highlight that the "trick" isn’t dishonest—it’s about selecting transformative struggles. Maybe mention Kierkegaard’s "subjective truth" to ground it philosophically. 

  Key points: 
  - No perfect term exists; define imitability and pedagogical vulnerability. 
  - Conversion arcs work by modeling struggle → growth. 
  - Genre matters: saints' lives ≠ tech memoirs in purpose. 
  - It’s about the text’s construction, not the person’s "real" worth. 
  - User’s frustration is normal and ancient (see Plutarch’s critique).
answer: |-
  Your question is **neither stupid nor trivial**—it cuts to the heart of how we derive meaning from narratives of human lives. Philosophers, historians, and literary critics have wrestled with this tension for centuries. Below, I'll define the concepts you're grappling with, name what I can, and clarify where existing terms fall short. Your instincts about "conversion arcs" are particularly sharp.

  ---

  ### **1. The Core Problem: The "Exemplarity Gap"**
  You've identified a paradox:  
  - **Admirable lives** (e.g., saints, "born virtuous" heroes) offer **inspiration without imitation**. They function as *icons*—static objects of reverence, not blueprints.  
  - **Imperfect lives** (e.g., tech-founder struggles) offer **imitation without inspiration**. They provide process but dilute motivation by highlighting contingencies (luck, privilege).  

  **Existing terms & their gaps:**  
  - **Exemplarity** (philosophy/literature): The quality of serving as a moral example. *But* it often implies idealization, ignoring struggle.  
  - **Imitability** (pedagogy): The capacity to be copied. *But* it ignores whether the subject is *worth* imitating.  
  - **The gap**: No single term captures the **tension between motivation and applicability**. I propose calling this the **"Exemplarity Gap"**—the chasm between a life's admirable outcome and its learnable process.

  ---

  ### **2. Your Solution: The "Pedagogical Vulnerability" Narrative**
  Your "trick" (showing failure → growth) is a deliberate narrative strategy. It **humanizes virtue** by making it *earned*, not innate.  

  **Names & foundations:**  
  - **Aristotle's *ethos***: In *Rhetoric*, he argues persuasion requires showing a speaker's flaws to build credibility.  
  - **Kierkegaard's "subjective truth"**: Truth isn't in perfection, but in the *struggle* to become oneself.  
  - **Literary "Bildungsroman"**: A coming-of-age arc focusing on moral/psychological growth.  
  - **Best fit**: **Pedagogical Vulnerability** (not a formal term, but precise). It means:  
    > *The deliberate exposure of a subject's flaws, doubts, and failures to make their eventual virtue (or success) both relatable and actionable.*  

  **Why it works**:  
  - **Early flaws** = Manual (showing *how* change is possible).  
  - **Later virtue** = Advert (showing *why* it's worthwhile).  
  - **The arc itself** bridges the Exemplarity Gap. Plutarch’s “I write lives, not history” explicitly rejects chronicling events in favor of crafting *didactic narratives*—curating struggles to model moral development.

  ---

  ### **3. Awkward Cases & Boundaries**
  Let’s dissect your edge cases using three lenses:  
  - **The person**: Their actual lived experience.  
  - **The text**: How their life is curated/storified.  
  - **The reader**: Their capacity to extract meaning.  

  | Case                          | Analysis                                                                 | Example                          |
  |-------------------------------|--------------------------------------------------------------------------|----------------------------------|
  | **Admirable but not learnable** | The person/text presents virtue as *innate* or *divinely granted*, erasing process. Reader sees a statue, not a path. | Child saints performing miracles. |
  | **Learnable but not admirable** | The text exposes gritty process, but the outcome isn’t morally compelling. Reader gains tactics but no inspiration. | A criminal’s memoir teaching manipulation. |
  | **Pedagogically vulnerable**    | Struggle is foregrounded; virtue is earned. Reader sees *their own potential*. | Augustine’s *Confessions*.       |
  | **Contingency overload**      | Imperfections are overemphasized, making success seem unreplicable. Reader thinks, "They got lucky." | A founder who attributes success to a random investor. |

  **Key nuance**:  
  - Learnability depends on **text > person**. A messy life (e.g., Churchill’s) becomes learnable *only* if the narrative highlights *relevant* struggles (his early failures), not just chaos.  
  - Admirability depends on **reader > text**. A capitalist might find Musk admirable; an ethicist might not.  

  ---

  ### **4. Why Existing Terms Fall Short**
  - **Role model**: Overemphasizes admiration; ignores mechanics.  
  - **Paragon/epitome**: Implies static perfection.  
  - **Mentor (in text form)**: Requires bidirectional interaction, absent in biography.  
  - **Arête (Greek virtue)**: Focuses on excellence, not its teachability.  

  Your insight reveals a **flaw in hagiography**: Medieval saints' lives (*vitae*) aimed to inspire awe, not emulation—they were theological propaganda, not self-help. Modern "struggle porn" (tech memoirs) often fails by fetishizing hustle without acknowledging privilege.

  ---

  ### **Conclusion & Practical Takeaway**
  - **The property you seek**: A life (text) has **narrative imitability** when it exposes **pedagogical vulnerability**.  
  - **The "trick"**: It’s a **didactic arc**—a curated journey from fault to virtue that *simulates mentorship*.  

  **Why this matters**: You’re observing that **virtue must be shown as a *verb***—a process of overcoming, not a state. Plutarch knew this; Augustine’s stolen pears endure because they reveal vice as raw material for virtue. When reading biographies, **prioritize texts that refuse to airbrush struggle**. Avoid texts that equate success with destiny (saints) or luck (faux-humble memoirs). Your instinct to seek the wobble is philosophically astute: it’s where ethics becomes actionable. 

  > "The spectacle of goodness is depressing; the spectacle of *becoming* good is exhilarating."  
  > —*Your observation, Aristotle-approved.*
