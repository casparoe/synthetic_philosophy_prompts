prompt: |-
  I am working through the third book of Hume's A Treatise of Human Nature and have run aground in the section on the obligation of promises. Here is the stretch of text I cannot get to come out cleanly:

  > That the rule of morality, which enjoins the performance of promises, is not natural, will sufficiently appear from these two propositions, which I proceed to prove, viz. that a promise would not be intelligible, before human conventions had established it; and that even if it were intelligible, it would not be attended with any moral obligation.
  >
  > I say, first, that a promise is not intelligible naturally, nor antecedent to human conventions; and that a man, unacquainted with society, could never enter into any engagements with another, even though they could perceive each other's thoughts by intuition. If promises be natural and intelligible, there must be some act of the mind attending these words, I promise; and on this act of the mind must the obligation depend. Let us, therefore, run over all the faculties of the soul, and see which of them is exerted in our promises.
  >
  > The act of the mind, expressed by a promise, is not a resolution to perform anything: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declared and avowed. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question then is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man could fall into, whose ideas are not confounded with prejudice and the fallacious use of language.
  >
  > All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or nonperformance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But it is certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, would have produced contrary impressions, or have been endowed with different qualities. It would be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men could naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it.
  >
  > But, secondly, if there was any act of the mind belonging to it, it could not naturally produce any obligation. This appears evidently from the foregoing reasoning. A promise creates a new obligation. A new obligation supposes new sentiments to arise. The will never creates new sentiments. There could not naturally, therefore, arise any obligation from a promise, even supposing the mind could fall into the absurdity of willing that obligation.
  >
  > The same truth may be proved still more evidently by that reasoning, which proved justice in general to be an artificial virtue. No action can be required of us as our duty, unless there be implanted in human nature some actuating passion or motive, capable of producing the action. This motive cannot be the sense of duty. A sense of duty supposes an antecedent obligation: And where an action is not required by any natural passion, it cannot be required by any natural obligation; since it may be omitted without proving any defect or imperfection in the mind and temper, and consequently without any vice. Now it is evident we have no motive leading us to the performance of promises, distinct from a sense of duty. If we thought, that promises had no moral obligation, we never should feel any inclination to observe them. This is not the case with the natural virtues. Though there was no obligation to relieve the miserable, our humanity would lead us to it; and when we omit that duty, the immorality of the omission arises from its being a proof, that we want the natural sentiments of humanity. A father knows it to be his duty to take care of his children: But he has also a natural inclination to it. And if no human creature had that inclination, no one could lie under any such obligation. But as there is naturally no inclination to observe promises, distinct from a sense of their obligation; it follows, that fidelity is no natural virtue, and that promises have no force, antecedent to human conventions.
  >
  > If anyone dissent from this, he must give a regular proof of these two propositions, viz. that there is a peculiar act of the mind, annexed to promises; and that consequent to this act of the mind, there arises an inclination to perform, distinct from a sense of duty. I presume, that it is impossible to prove either of these two points; and therefore I venture to conclude that promises are human inventions, founded on the necessities and interests of society.

  I understand Hume's conclusion well enough — that fidelity is an artificial rather than a natural virtue, and that promises are grounded in convention and interest. What I want help with is the reasoning by which he gets there, which I cannot reconstruct without feeling that something has been smuggled in. Please give me a careful walkthrough rather than a summary, addressed to the following:

  1. Lay the argument out as an explicit, numbered sequence of premises and conclusions, marking for each step whether Hume treats it as a conceptual truth, an empirical claim about human psychology, or a rhetorical flourish.

  2. Say precisely what the "manifest absurdity" is supposed to be, and explain how the two arguments Hume announces at the outset — that a promise is unintelligible prior to convention, and that even if intelligible it would carry no natural obligation — stand to one another. Is the second genuinely independent, or does it merely restate the first in different words?

  3. Explain the load-bearing role of two doctrines that seem to be doing quiet work in the background: that the will bears only on present actions, and that we can no more change our own sentiments than the motions of the heavens. For each doctrine, say what becomes of the argument if it is rejected.

  4. Address what seems to me the central crux. Hume moves from "all morality depends upon our sentiments" and "a creation of a new obligation supposes some new sentiment to arise" to the verdict that willing a new obligation is absurd. Is he entitled to that move? In particular, does he conflate obligation as a felt sentiment with obligation as a normative requirement, so that the argument at best refutes a position nobody holds — that one can manufacture a feeling by an act of will — or does it retain force against a rationalist or natural-law account on which obligation is not a sentiment at all?

  5. Reconstruct the second, motive-based argument ("No action can be required of us as our duty, unless...") and say how far it is an independent argument and how far it quietly re-imports the earlier result that justice is an artificial virtue. Does the premise that a sense of duty cannot supply the motive it presupposes beg any question against his opponents?

  6. Reconcile the passage with Hume's own appeal a few lines earlier to common opinion, where he reports that we say we are "bound by our own consent" and that the obligation arises "from our mere will and pleasure" — immediately before denying that any act of will can bind. Is he reporting a usage, endorsing it, or exposing it as confused?

  7. Finally, assess the argument on its own terms: does it succeed, and if not, at which step does it fail? If a rationalist dissenter were to take up Hume's challenge to supply "a regular proof of these two propositions," what would the strongest version of that proof look like, and is Hume's presumption that it cannot be given a fair one?

  No citations or reading list, please — I want the argument reconstructed and the crux located, not references.
