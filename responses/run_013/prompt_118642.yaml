prompt: |-
  I retired two years ago from a career in cell biology and have since been reading philosophy in a fairly undisciplined way, mostly metaphysics; I have reached the stage where I can follow an argument but not yet where I trust my judgment about how one should be introduced, which is why I am asking for a plan rather than an answer. In three weeks I am to lead a two-hour session at the lifelong-learning institute attached to my old university. The twelve participants are adults with no formal philosophy, several of them retired scientists like myself, and the topic is what philosophers call the special composition question: under what conditions do some things compose a further thing? Please plan the teaching and do not explain the topic to me. What I need is the order in which the components must be introduced, with the dependencies made explicit — in particular, what has to be in place before the question can even be put in a way that strikes the audience as a genuine question about the world rather than a quibble about the word "thing" — together with the point in that sequence at which each predictable misunderstanding should be intercepted. I have my own guesses about the menu of answers (everything always composes; nothing ever does; only some privileged class does, perhaps only living things; or composition is brute and unsystematic, with no informative principle to be had), but I suspect that presenting this menu early, as a taxonomy to be memorized, would rob the session of the very thing I want it to produce, namely the felt pressure of the question. Tell me whether that suspicion is right and, if it is, what should occupy the space instead. I should add that I want no reading list; the group will read nothing in advance, and anything that would require them to consult a text is of no use to me.

  The choice of a carrying example is where I am least confident, and I would like you to reason it through rather than simply supply one. My instinct was to build the whole session on a case from my own field: the Portuguese man o' war, or a cellular slime mold that spends most of its life as independent amoebae and then aggregates into something that moves, feeds, and reproduces as a single entity. My thought was that a biologist's audience will feel the pull of the question in their bones when the example is biological. I now suspect this misfires, precisely because biologists have a settled professional habit of responding to such puzzles by stipulating a definition of "organism" and carrying on, which is the very move I want them to experience as an evasion rather than a solution. Advise me: should the example be biological, artefactual (a chair, a heap of sand), or deliberately outlandish, such as the top half of one animal joined to the bottom half of another? And state what the example must have and what it must lack if it is to make composition look like a real feature of the world rather than a puzzle about our words.

  Beyond the verbal-dispute reaction, I expect at least two further misconceptions and want to know where in the sequence each should be headed off: the conviction that the natural sciences will eventually settle the matter empirically, and the assumption that anyone who denies that ordinary objects compose anything is denying that ordinary objects exist. I would also like the sequence to leave the audience able to see that "it depends, and there is no sharp line" is itself a substantive and contested position rather than a comfortable truce. Finally, give me one closing question I can put to the room that will distinguish a participant who can recite the menu of answers from one who has understood why the question is hard, and tell me what I should openly refuse to cover at this level — the technical mereological machinery, for instance — so that I can say so out loud rather than leave the audience with the impression that I have merely run out of time.
reasoning: |-
  We are designing a two-hour session on the Special Composition Question (SCQ) for a group of 12 adults with no formal philosophy background, including retired scientists. The goal is to make the question feel genuine and pressing, avoiding the impression that it's a verbal quibble. We must also intercept predictable misunderstandings and leave the audience appreciating the depth of the problem.

  ### Core Structure: Order of Introduction with Dependencies

  The session must build step by step, establishing necessary concepts before posing the SCQ. The sequence should:

  1. **Establish the concept of composition without using the term "composition" or introducing the SCQ too early.** We start with intuitive examples of "one thing" made of "many things."
  2. **Create a puzzle that forces the audience to question their intuitive judgments.** This prevents the dismissal of the question as merely verbal.
  3. **Explicitly pose the SCQ** only after the puzzle is felt.
  4. **Explore answers** without presenting a taxonomy too early (to preserve the pressure of the question).
  5. **Address misconceptions** at the right points.
  6. **Conclude** by highlighting the substantive nature of the problem and leaving a thought-provoking question.

  ### Step-by-Step Plan

  #### 1. Introduction: Setting the Stage (10 minutes)
     - **Goal:** Establish the everyday idea that we often talk about groups of things as a single thing. Avoid philosophy jargon.
     - **Method:** Use a simple, non-biological example to avoid triggering the biologist's definitional reflex. Start with an artefact.
     - **Example:** A wooden chair. 
       - We have legs, a seat, a back. We say they compose a chair. Also, a pile of the same wood pieces that are not assembled: we don't call that a chair. Why?
     - **Why this example?** 
       - It's familiar and uncontroversial. The audience will accept that the chair is one thing. 
       - It avoids the biological domain where scientists might have professional habits of stipulation.
       - It sets up the idea that composition is not automatic: a pile of wood isn't a chair, but an assembled one is.
     - **What must be in place?** The idea that we commonly recognize composite objects and that we have intuitions about when composition occurs.

  #### 2. The Puzzle: Generating the Tension (20 minutes)
     - **Goal:** Create a sense of unease about our intuitive judgments by presenting a series of cases that challenge them.
     - **Method:** Use a spectrum of examples. Start with the chair and then move to a heap of sand. Then introduce a borderline case.
     - **Example Progression:**
       1. **Clear case of composition:** The chair (parts are firmly attached and arranged for sitting).
       2. **Clear case of non-composition:** A random pile of sand grains (we don't think of it as a single object, just many grains).
       3. **Borderline case 1 (artefactual):** A sand castle. Is it one thing? It has a shape and purpose, but it's made of sand. If we kick it, it becomes a pile again. Is it still one thing while it stands?
       4. **Borderline case 2 (biological):** Now introduce a biological example. But choose one that challenges the biologist's definitional reflex. **Use the Portuguese man o' war.** 
          - Why this example?
            - It's biological (connects to the audience's background) but notoriously problematic: it is a colony of individual organisms (polyps) that function together as a unit. Biologists might classify it as a colony, but it behaves like a single organism. This disrupts the idea that we can simply stipulate a definition.
          - How to present:
            - Describe: It looks like a jellyfish, but it's made up of many individual organisms that cannot survive independently. They are specialized: some for flotation, some for feeding, etc.
            - Question: Is it one organism or many? This is a real debate in biology, so we can note that biologists don't always agree. The point is to show that even in science, the boundaries are not always clear.
       5. **Borderline case 3 (even more challenging):** Introduce a deliberately outlandish example: **a hybrid creature** (e.g., the top half of a dog sewn to the bottom half of a cat, kept alive by advanced medicine). 
          - Why? It forces the audience to confront the idea that composition isn't just about biology or function but about what it means to be an object at all.
          - Question: Is this one animal? Two? Something else?
     - **What must be in place?** The audience must see that their intuitions vary and sometimes conflict. This sets up the need for a general principle.

  #### 3. Posing the Special Composition Question (10 minutes)
     - **Goal:** Formally introduce the SCQ as a general question that applies to all these cases.
     - **Method:** After the examples, state the question: "Under what conditions do some things compose a further thing?" 
     - **Crucial:** Emphasize that this is not about words. We are not asking for a definition of the word "thing" but about the world: when does a new object come into existence?
     - **Dependency:** This step must come after the examples because the examples make the question real. Without them, it might seem verbal.

  #### 4. Exploring the Space of Answers (without the taxonomy) (30 minutes)
     - **Goal:** Let the audience feel the pressure of the question by exploring the consequences of different answers, without labeling them as "nihilism," "universalism," etc.
     - **Method:** Start with the audience's reactions. Ask them to propose principles for composition from the examples. Then test these principles against new cases to show their problems.
     - **Process:**
       - **Step 1:** Ask the group: "What do you think makes the difference between the pile of sand and the sand castle? Or between the independent amoebae and the slime mold when it aggregates?" 
         - Expected suggestions: Contact, function, intention, etc.
       - **Step 2:** Test each suggestion with counterexamples.
         - Example for **contact**: 
           - Two people shaking hands: are they composing a new object? (Probably not, but they are in contact.) 
           - A broken chair: the parts are in contact but not functioning. Is it still a chair? 
         - Example for **function**:
           - The Portuguese man o' war: it has a function, but is it one thing? 
           - A car engine: it has a function, but is it one object? What about the whole car? What about a car that is broken?
         - Example for **intention** (if brought up):
           - A sand castle made by a child: intended to be one thing. But if the wind blows the sand into the same shape by chance, is it one thing then?
       - **Step 3:** Show that every simple principle runs into trouble. This leads to the realization that the question is hard.
     - **Why not present the menu?** Your suspicion is right: presenting the menu of answers (nihilism, universalism, etc.) too early would turn it into a taxonomy to memorize and reduce the pressure. Instead, let the audience struggle with proposing and refuting principles. The space of answers will emerge naturally as they see the options: 
       - Maybe composition never happens? (But then what is the chair?)
       - Maybe it always happens? (Then what about the pile of sand? And what about the two people shaking hands?)
       - Maybe only sometimes? (Then we need a principle, but we can't find one that works for all cases.)

  #### 5. Addressing Misconceptions (integrated throughout, but explicitly at key points)

     - **Misconception 1: The verbal-dispute reaction.**
       - **When to intercept:** At the moment of posing the SCQ (step 3) and whenever the audience seems to be slipping into "it's just about words." 
       - **How:** Emphasize that we are not asking for a definition of "thing" but for the conditions under which a new entity comes into existence. Use the examples to show that this matters for what exists in the world. For instance: 
         - If we say the sand castle is not an object, then when we kick it, we aren't destroying an object. But if it is, then we are. That's a real difference.

     - **Misconception 2: The sciences will settle it empirically.**
       - **When to intercept:** During the exploration of answers (step 4), when testing principles. 
       - **How:** Point out that science tells us about the arrangement and behavior of the parts, but not whether there is a new object. For example, biology can describe the Portuguese man o' war's structure and function, but whether we count it as one organism or many is a further question. Science doesn't tell us what counts as an object. This is a metaphysical question.

     - **Misconception 3: Denying composition means denying existence.**
       - **When to intercept:** When the idea that "composition never occurs" comes up (which it will in step 4). 
       - **How:** Clarify: 
         - If someone says composition never happens, they are not saying chairs don't exist. They are saying that chairs are just many particles arranged chair-wise. The particles exist, and the arrangement exists, but there is no additional thing, the chair. So we can still sit on the particles arranged chair-wise. This is not an attack on common sense but a reinterpretation.

  #### 6. Highlighting the "No Sharp Line" Position (10 minutes)
     - **Goal:** Show that "it depends, and there is no sharp line" is a substantive and contested position, not a truce.
     - **Method:** Return to the spectrum of examples (sand pile, sand castle, chair, man o' war, hybrid). Ask: 
       - If we say composition only happens sometimes, then where do we draw the line? 
       - Is there a sharp boundary? Or is it vague? 
     - **Point out:** Some philosophers think vagueness is acceptable (vague objects exist), but others say vagueness is only in our language, not in the world. So the "no sharp line" view is not an easy way out but a controversial stance.

  #### 7. Conclusion (10 minutes)
     - **Goal:** Summarize the pressure of the question and leave the audience with a deeper appreciation.
     - **Closing Question:** 
       - "Suppose we have a pile of sand. We remove one grain. Is it still a pile? We keep removing grains one by one. At what point does it stop being a pile? And if we can't say exactly when, what does that tell us about the existence of the pile?"
       - **Why this question?** 
         - It distinguishes between reciting answers (e.g., "it's a heap until it's not, but it's vague") and understanding why the question is hard: because it forces us to confront whether there are any composite objects at all, and if so, how they could have vague boundaries. The pile example is simple but profound. A participant who can only recite might say "it's a sorites paradox," but the deeper understanding is that this paradox threatens the existence of ordinary objects.

     - **What to openly refuse to cover:** 
       - Technical mereology (e.g., the axioms of classical extensional mereology). 
       - Historical overview of philosophers' answers (e.g., van Inwagen, Lewis). 
       - Advanced debates about parthood and identity over time. 
       - Say explicitly: "We are not going into the technical machinery of mereology or the history of the debate. That's for a deeper dive. Today, we're focusing on why this question is so puzzling and why it matters."

  ### Total Time Allocation (2 hours = 120 minutes)
  - Introduction: 10 min
  - The Puzzle (examples): 20 min
  - Posing the SCQ: 10 min
  - Exploring Answers: 30 min
  - Addressing Misconceptions: (integrated, no extra time)
  - No Sharp Line: 10 min
  - Conclusion: 10 min
  - Buffer/Q&A: 30 min (but note: the "exploring answers" and "no sharp line" sections will involve discussion, so the buffer is built in)

  ### Choice of Carrying Example: Reasoning
  - **Biological?** Yes, but not first and not in a way that triggers stipulation. Use the man o' war as a borderline case to disrupt the definitional habit. Its biological nature will engage the scientists, but its ambiguity will prevent a quick definitional fix.
  - **Artefactual?** Start with these (chair, sand castle) because they are neutral and intuitive.
  - **Outlandish?** Include the hybrid creature to push the boundaries and show that composition isn't just about biology or artefacts.
  - **What the example must have:** 
    - It must be a case where our intuitions are strong but conflicting (so it can't be a clear case of composition or non-composition).
    - It must resist a simple definition in terms of function, contact, intention, etc.
    - It must feel like a real-world case (not science fiction) but unusual enough to challenge complacency.
    - It must lack a settled professional answer (like the man o' war in biology).

  By using a progression of examples, we build the puzzle step by step and avoid the verbal-dispute reaction.

  This plan should create the felt pressure of the question and leave the audience with a sense of why the SCQ is both profound and unresolved.
answer: |-
  Below is a step-by-step teaching plan for your two-hour session on the Special Composition Question (SCQ), designed to make the question feel like a genuine metaphysical puzzle rather than a linguistic quibble. The sequence prioritizes building intuitive pressure before introducing abstract concepts, intercepts key misconceptions at critical junctures, and uses examples strategically to avoid triggering "definitional evasion" (especially from scientists). I'll outline the order, dependencies, timing, reasoning for example choices, and where to address misunderstandings. 

  **Core Structure: 6 Sequential Stages**  
  *Total time: 110 minutes (10-minute buffer for discussion)*  

  ### **Stage 1: Establish "Composition" Intuitively (15 min)**  
  **Goal:** Create a shared, pre-theoretical understanding of "composition" without jargon.  
  **Content:**  
  - **Opening example (artefactual):** Use a **chair** made of legs, seat, and back. Ask: "When do these pieces become *one* chair instead of just wood?"  
  - **Contrast case:** A **disassembled chair** (same parts in a pile). Ask: "Why is this not a chair? What changed?"  
  - **Dependency:** Start here because artefacts are neutral—they lack biological baggage and feel concrete. This establishes composition as a worldly phenomenon (parts → whole), not wordplay.  
  **Key question for the group:** "What must happen for parts to form a single object?"  

  ### **Stage 2: Introduce Ambiguity with a Spectrum of Cases (20 min)**  
  **Goal:** Show that composition isn't always clear-cut, creating tension.  
  **Content:**  
  - **Progression of examples (critical dependency: Stage 1 must establish intuition first):**  
    1. **Clear composition:** The chair (revisited).  
    2. **Clear non-composition:** A **heap of sand** (individual grains). Ask: "Is this one thing? Why not?"  
    3. **Borderline case (artefactual):** A **sandcastle**. Ask: "Is this one object? What if it crumbles slightly?"  
    4. **Borderline case (biological):** The **Portuguese man o' war**. Describe it neutrally: "Cells/zooids function as a unit but are genetically distinct. Is this *one* organism? Why might biologists disagree?"  
    5. **Outlandish case (hybrid):** **"Graft animal"** (e.g., top half of a dog, bottom half of a cat, surgically fused). Ask: "Is this one animal? Two? Something else?"  
  **Why this example mix?**  
    - **Biological example is included but delayed** to avoid triggering "stipulative definition" reflexes. By Stage 2, participants already see composition as puzzling (via artefact/heap), so the man o' war *extends* the puzzle rather than letting biologists "solve" it with jargon.  
    - **Graft animal is crucial:** It lacks scientific or everyday precedents, forcing attention to the *metaphysical* problem (not empirical classification).  
    - **What examples must have:**  
      - Ambiguity (no consensus on "one thing").  
      - Resistance to simple criteria (e.g., function, contact, life).  
      - Real-world plausibility (avoid sci-fi; e.g., the graft is medically possible).  
      - *Avoid* cellular slime mold—it might feel too "solvable" via biology.  

  ### **Stage 3: Pose the SCQ Explicitly (10 min)**  
  **Goal:** Formulate the question only after ambiguity is felt.  
  **Dependency:** Stages 1–2 must make composition seem "real" but puzzling.  
  **Content:**  
  - State the SCQ: "Under what conditions do some things compose a further thing?"  
  - **Emphasize:** "This isn't about words. It’s about when the world *gains a new object*. For example, when does sand become a castle? When do cells become an organism?"  
  - **Intercept Misconception 1 (Verbal dispute):** Here, explicitly say: "If you think this is *just* about the word 'thing,' consider: If composition never happens, kicking the sandcastle doesn’t destroy an object—it just rearranges sand. That’s a factual difference, not wordplay."  

  ### **Stage 4: Test Intuitive Principles (30 min)**  
  **Goal:** Let participants propose and critique criteria, making the SCQ feel urgent.  
  **Dependency:** Requires Stage 3’s clear question and Stage 2’s examples.  
  **Content:**  
  - **Group activity:** "What principles might decide when composition occurs?" List suggestions (e.g., contact, function, intention, life).  
  - **Test principles against examples:**  
    - **Contact?** Two people holding hands: contact but no "new object."  
    - **Function?** A broken chair: has no function but still seems to exist.  
    - **Life?** Man o' war: functions as one but isn’t genetically unified.  
    - **Intention?** Sandcastle formed by wind (no intention) vs. child (intention).  
  - **Why no "menu of answers" yet?** Your suspicion is correct. Presenting nihilism/universalism/etc. now would reduce pressure to a taxonomy. Instead, let principles *fail*—e.g., "No simple rule works. What options does that leave us?"  
  - **Intercept Misconception 2 (Science will solve it):** During testing, say: "Science tells us how parts interact, but not whether a *new thing* exists. Biologists describe man o' war’s behavior but still debate if it’s one organism—that’s metaphysical."  

  ### **Stage 5: Explore Implications of Extreme Answers (20 min)**  
  **Goal:** Show that even "obvious" answers have radical consequences.  
  **Dependency:** Stage 4 must exhaust intuitive principles.  
  **Content:**  
  - **Case 1: "Composition always occurs" (universalism):**  
    - "If any parts make a whole, do this shoe + the Moon compose an object?"  
    - Consequence: Infinite overlapping objects (e.g., every grain subset is a "heap").  
  - **Case 2: "Composition never occurs" (nihilism):**  
    - "Are there no chairs, just atoms arranged chair-wise? Can you still 'sit on it'?"  
  - **Intercept Misconception 3 (Denying ordinary objects):** Here, clarify: "Nihilism doesn’t deny chairs exist—it says they’re just particles. But that challenges *how* they exist."  
  - **Highlight the "no sharp line" position:** "Some say composition depends on context with vague boundaries. But is vagueness in the world or our language? If vague, does the graft animal partly exist?" Stress: This is a *substantive* stance (e.g., it rejects precise metaphysics), not a truce.  

  ### **Stage 6: Conclude with a Felt Challenge (15 min)**  
  **Goal:** Cement the SCQ as unresolved and profound.  
  **Content:**  
  - **Synthesize:** "We’ve seen no principle works universally, and all answers have costs. This isn’t wordplay—it’s about what *exists*."  
  - **Closing Question:**  
    - "Imagine removing grains from a heap one by one. When does it stop being a heap? If you can’t pinpoint a grain, does that mean heaps don’t exist—or that existence is vague?"  
    - **Why this works:** It tests *understanding* (not memorization). A reciter will say, "It’s a sorites paradox." One who feels the pressure will ask: "Does vagueness mean reality has no exact objects, or that our concepts are flawed?"  
  - **Explicitly exclude:** State upfront: "We won’t cover technical mereology (e.g., parthood axioms) or historical theories—this is about the raw puzzle."  

  ---

  **Key Rationale for Choices:**  
  - **Example progression:** Artefacts (chair/heap) → biological (man o' war) → hybrid (graft). This order prevents biologists from retreating to stipulation early. The graft animal is vital for making composition feel "real"—it lacks familiar categories, forcing ontological attention.  
  - **Misconception timing:**  
    - Verbal dispute intercepted when SCQ is posed (Stage 3), once examples make it feel worldly.  
    - "Science will solve it" intercepted when testing principles (Stage 4), using man o' war’s unresolved debate.  
    - "Denying objects" intercepted when discussing nihilism (Stage 5), to clarify its nuance.  
  - **"No sharp line" placement:** In Stage 5, after extreme answers, to show it’s not an easy out but a contested stance (e.g., it invites questions about vagueness in reality).  
  - **Why avoid early taxonomy:** Listing answers upfront (e.g., nihilism) would turn the SCQ into an academic exercise. Instead, let participants *discover* the options through failed principles (Stage 4) and their consequences (Stage 5). The pressure comes from seeing there are no painless solutions.  

  **Adjust for Time:** If discussion runs long, shorten Stage 4 (principles) or Stage 5 (extreme answers), but preserve Stages 1–3 to ensure the SCQ lands as a genuine puzzle. Use the graft animal if biology examples spark definitional evasion—its absurdity underscores the metaphysical depth.
