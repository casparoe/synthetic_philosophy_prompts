prompt: |-
  You are an expert in computational complexity theory and in the philosophy of computational complexity, and you are advising a software engineering team. Before you write anything, think carefully about the problem, and open with a short brainstorming section: list the distinctions that actually matter for the question below, mark which of them are theorems, which are conjectures, and which are habits of thought, and say which you intend to keep and which you intend to drop when you turn them into a procedure.

  Context. I am a software engineer on a platform team. Roughly once a quarter, someone proposes that we stop trying to solve a problem exactly and ship a heuristic or an approximation instead, on the grounds that the problem is intractable. The arguments are always the same shape and are never written down: someone has read that the problem is NP-hard, or that a special case is, or that a reduction exists from something known to be hard, and concludes that further effort is wasted. Sometimes they are right and we save a quarter of engineering time. Sometimes they are wrong and we ship an approximation to a problem whose exact version would have been fine at our scale, or we accept a quality guarantee that was never necessary. I want to stop adjudicating these one at a time.

  I have no formal philosophy or theory background, so I am relying on you to keep the real distinctions intact while making the thing runnable by an engineer in about a week, with no access to a complexity theorist. The output goes to a director who has to sign off on narrowing the scope of a project, so the procedure has to produce a defensible written verdict, not a vibe.

  The deliverable: a decision procedure, in words, that a single engineer can run on a proposal to give up on exactness. It should be a checklist of questions in order; for each question, what counts as a sufficient answer; which question usually decides the case; where the procedure stops with a no, meaning the proposal has not earned its conclusion; and where it stops and hands the decision to a person because the remaining question is about what we are willing to accept rather than about what is true. Give the procedure a small set of named verdicts rather than a yes/no.

  Some things I want it to get right, because our current arguments keep getting them wrong:

  - The gap between a problem being hard in the worst case and being hard on the instances we actually see, and what would have to be true for the worst case to be the relevant one.
  - The difference between a problem being hard to solve exactly, hard to solve well approximately, and hard to solve in a way that would tell us anything. Do not let the procedure treat these as one thing.
  - What a reduction actually buys. When we show our problem is as hard as some known-hard problem, we typically prove it in one direction and then quietly act as if the two problems are interchangeable. Ask what the reduction preserves: the size of a solution, the quality guarantee, the parameter we care about, or nothing.
  - The status of the hardness claim itself. Separate a problem that is provably unsolvable or carries an unconditional lower bound, from one that is hard only if a famous conjecture is true, from one where we simply do not know and are generalizing from our own failures. The procedure should not let the third masquerade as the first.
  - The model-relativity and the asymptotic framing. Hardness claims are made relative to a model of computation and to a limit our n never reaches; ask what our actual n is, and whether a bad constant could make the supposedly efficient algorithm the slower one.
  - Solver-relative hardness: what is hard for the model in the textbook is not necessarily hard for the tool we would actually point at it.

  Then run the procedure, showing your work at each step, on three proposals:

  1. A scheduling problem where our largest real instances have a few dozen items.
  2. A problem where a colleague has shown a reduction from a known-hard problem whose hardness lives in a regime we never enter.
  3. A case where the proposal is to ship a solution with a quality guarantee, and the reduction chain turns out to rule out any solution that good unless a famous conjecture fails. I expect this one to be the case the procedure hands back to a human; make sure it is, and say exactly what the human is being asked to decide.

  Include one case where the procedure tells me something I will not want to hear, and do not soften it.

  Close with an honest account of what the procedure cannot do: the steps that are judgment dressed up as procedure, the ways it will misfire, and what it would take for me to be wrong to trust it. Do not give me a reading list, citations, or references to specific papers; I want the reasoning, not the bibliography.
reasoning: |-
  We are designing a decision procedure to evaluate proposals to abandon exact solutions for heuristics/approximations due to alleged intractability. The goal is to avoid common pitfalls in such arguments and produce a defensible verdict.

  Brainstorming: Distinctions that matter

  1. **Worst-case vs. typical instances**:
     - Theorem: Many problems (e.g., NP-hard) have worst-case instances that are hard, but typical instances might be easy.
     - Conjecture: For some problems, average-case hardness is believed (e.g., based on cryptographic assumptions), but for many, it is not.
     - Habit: Often, worst-case hardness is overemphasized without considering the actual input distribution.
     - Keep: We must ask about the structure of our instances and whether worst-case instances are likely.

  2. **Exact vs. approximate solutions**:
     - Theorem: Some problems are hard to approximate (e.g., no PTAS for some problems unless P=NP).
     - Conjecture: The approximation threshold for some problems is based on the Unique Games Conjecture or similar.
     - Habit: Treating "hard to solve exactly" as equivalent to "hard to solve approximately" or "hard to get any useful information".
     - Keep: We must separate the three: exact solution, approximation with a guarantee, and heuristic without guarantee.

  3. **What reductions preserve**:
     - Theorem: Reductions preserve hardness in the sense of polynomial-time solvability (for decision problems) but may not preserve solution quality, instance size, or other properties.
     - Habit: Acting as if a reduction from problem A to B means A and B are equally hard in every respect, including for approximation.
     - Keep: We must ask what the reduction preserves (e.g., solution size, approximation ratio, etc.).

  4. **Status of hardness claim**:
     - Theorem: Unconditional lower bounds (e.g., exponential time for problems in EXPTIME) are rare. Most hardness is conditional (e.g., NP-hardness implies no polynomial time algorithm unless P=NP).
     - Conjecture: P vs NP is the most famous, but others (e.g., ETH, SETH) provide more refined lower bounds.
     - Habit: Treating a conditional hardness result as an absolute barrier.
     - Keep: We must classify the hardness claim as unconditional, conditional (and on what), or unknown.

  5. **Model-relativity and asymptotic framing**:
     - Theorem: Hardness results are for specific models (e.g., deterministic Turing machines) and are asymptotic.
     - Habit: Ignoring that our instances might be small and that constants matter.
     - Keep: We must consider the actual instance size and the constants in the algorithms.

  6. **Solver-relative hardness**:
     - Theorem: A problem may be hard in theory but easy for practical solvers (e.g., SAT solvers for many instances).
     - Habit: Assuming that because a problem is NP-hard, no existing solver can handle our instances.
     - Keep: We must consider the state of practical solvers for the problem.

  We will design a procedure that uses these distinctions. The verdicts will be:

  - **VERDICT: Exact Feasible** - The proposal to abandon exact solution is rejected because exact solution is feasible for our instances.
  - **VERDICT: Heuristic Unnecessary** - The proposal is rejected because we can achieve the required quality with an exact method or a provable approximation.
  - **VERDICT: Heuristic Recommended** - The proposal is accepted: we should use a heuristic or approximation.
  - **VERDICT: Human Judgment Required** - The decision requires weighing trade-offs that are not purely technical.

  Procedure Checklist:

  1. **Problem Formulation**: 
     - Question: What is the exact problem we are trying to solve? (Input, output, constraints, objective)
     - Sufficient answer: A clear statement including the input size (n) and the parameters that matter (e.g., number of constraints, graph size).
     - If unclear, stop: the proposal is not well-formed. (No verdict yet, require clarification.)

  2. **Instance Size and Structure**:
     - Question: What is the largest instance we actually face (in n and other parameters)? What are the typical instances? Do we have reason to believe our instances are worst-case or are they structured (e.g., planar graphs, small treewidth, fixed parameters)?
     - Sufficient answer: Concrete numbers for n and other parameters, and evidence about structure (e.g., from data or domain knowledge).
     - If our n is very small (e.g., <50) and the problem is not in an extremely high complexity class, then even an exponential algorithm might be feasible -> leads toward Exact Feasible.
     - This step often decides the case when n is small.

  3. **Hardness Claim**:
     - Question: What is the basis for the claim that the problem is hard? (e.g., NP-hardness, PSPACE-hardness, etc.) 
     - Sufficient answer: A reference to a known result (e.g., "Problem X is NP-hard by reduction from 3SAT") or a reduction provided by the team.
     - Then, classify the hardness:
       - Unconditional lower bound? (rare)
       - Conditional (on what conjecture? e.g., P≠NP, ETH, etc.)
       - Unknown (only empirical evidence from our failures?)
     - If the claim is only empirical (we tried and failed) and no reduction is known, then the problem might be easy -> stop with Heuristic Unnecessary? Not necessarily, but we proceed to the next step.

  4. **Reduction Analysis** (if a reduction is given):
     - Question: What does the reduction preserve? 
       - Does it preserve the instance size (i.e., n maps to n, or is there a blow-up)?
       - Does it preserve solution quality (for approximation)?
       - Does it preserve the parameters we care about (e.g., if we care about small treewidth, does the reduction respect that)?
     - Sufficient answer: The reduction must be described well enough to answer these. If the reduction blows up instance size (e.g., n becomes n^3) then the worst-case hardness might not apply to our n. If the reduction does not preserve approximation guarantees, then the hardness of approximation might not follow.
     - If the reduction does not preserve the relevant aspects, then the hardness claim might not hold for our context -> question the basis for giving up.

  5. **Exact Solvers**:
     - Question: What exact solvers exist (commercial, open-source, or that we could build) and how do they perform on our typical instances?
     - Sufficient answer: Names of solvers (e.g., CPLEX, Gurobi, MiniSAT, custom) and benchmarks on our instances or similar.
     - If an exact solver handles our instances in acceptable time, then we don't need a heuristic -> Exact Feasible.

  6. **Approximation and Heuristics**:
     - Question: What is the required quality? Is there a known approximation algorithm with a guarantee? If not, what heuristics exist and how do they perform?
     - Sufficient answer: If the problem is hard to approximate (e.g., no constant factor approximation unless P=NP) and we require a guarantee, then we must use a heuristic without guarantee. If an approximation algorithm exists with acceptable ratio, we can use it.
     - If we don't require a guarantee, then we can consider heuristics.

  7. **Trade-offs**:
     - Question: What are the costs of being inexact? (e.g., user dissatisfaction, loss of revenue, safety issues) and what are the benefits (engineering time saved)? 
     - This step is for human judgment when the technical factors are balanced.

  The procedure stops early if at step 2 we see that n is small enough that brute force or an exact algorithm is feasible (then verdict: Exact Feasible). It also stops at step 5 if an exact solver works (Exact Feasible). If step 3 reveals the hardness claim is weak (e.g., only empirical) and step 5 shows solvers work, then Heuristic Unnecessary. If step 6 shows that even approximation is hard and no good heuristics are known, then Heuristic Recommended. If we get to step 7, we hand off to a human (Human Judgment Required).

  Now, run the procedure on three proposals:

  ### Proposal 1: A scheduling problem where our largest real instances have a few dozen items.

  1. **Problem Formulation**: Scheduling with constraints (e.g., job shop scheduling). Input: n jobs, each with processing times and constraints. Largest n=50.
  2. **Instance Size**: n=50. This is small. Even if the problem is NP-hard, exponential algorithms might run in acceptable time (e.g., 2^n * poly(n) is about 10^15 operations, which is too slow? But note: we might have structure). However, 50 is too big for brute force (50! is astronomical) but might be handled by branch-and-bound or constraint programming. We need to check step 5.
  3. **Hardness Claim**: Scheduling is often NP-hard. But for n=50, worst-case might not be hit.
  4. **Reduction Analysis**: (Not provided, but assume a standard NP-hardness reduction) - the reduction might not preserve the structure of our instances.
  5. **Exact Solvers**: There are scheduling solvers (e.g., CP Optimizer, OR-Tools) that handle n=50 well in practice because instances are not worst-case. We benchmark and find they run in seconds.
     - Verdict: Exact Feasible -> Stop.

  ### Proposal 2: A problem where a colleague has shown a reduction from a known-hard problem whose hardness lives in a regime we never enter.

  Example: The reduction is from 3SAT, but the reduction creates an instance of size n^4, and the known-hard problem (3SAT) is hard only for instances with thousands of variables, but our reduced instances would have n^4 = (at most 10)^4 = 10,000, which is within the range that modern SAT solvers handle.

  1. **Problem Formulation**: Clear. Input size parameter n, but after reduction, the instance becomes of size n^k for some k.
  2. **Instance Size**: Our largest n is, say, 10. Then reduced instance size is 10,000. We know that 3SAT is hard in the worst-case, but solvers handle 10,000 variables well on average.
  3. **Hardness Claim**: Reduction from 3SAT (NP-hard).
  4. **Reduction Analysis**: The reduction blows up the instance size (n -> n^4). The known-hard problem (3SAT) is hard for instances with, say, 100,000 variables (where state-of-the-art solvers might struggle) but 10,000 is manageable.
  5. **Exact Solvers**: We point a SAT solver at the reduced instances of size 10,000 and they solve them in seconds. 
     - Verdict: Exact Feasible.

  ### Proposal 3: A case where the proposal is to ship a solution with a quality guarantee, and the reduction chain turns out to rule out any solution that good unless a famous conjecture fails.

  Example: We want a (1+ε)-approximation for a problem, but it is known that unless P=NP, there is no polynomial-time (1+ε)-approximation.

  1. **Problem Formulation**: Clear. We require a (1+ε)-approximation for some small ε.
  2. **Instance Size**: n=1000. This is large enough that an exact algorithm (if exponential) might be too slow.
  3. **Hardness Claim**: The problem is NP-hard and also hard to approximate within (1+ε) unless P=NP.
  4. **Reduction Analysis**: The reduction for approximation hardness preserves the inapproximability.
  5. **Exact Solvers**: We try exact solvers and they time out on n=1000 (because 2^1000 is astronomical).
  6. **Approximation and Heuristics**: We require (1+ε)-approximation, but it's ruled out by the hardness. There might be heuristics without guarantees, or we might relax the guarantee (e.g., 2-approximation). But if we require (1+ε), then we cannot have it in polynomial time (unless P=NP). 
     - Now, we must consider: what are the costs of not having (1+ε)? Can we accept a worse guarantee? 
     - This becomes a trade-off: we might have to use a heuristic that sometimes gives (1+ε) but without guarantee, or we might accept a 2-approximation. The decision requires weighing the business impact of the quality guarantee.
     - Verdict: Human Judgment Required. The human must decide whether to relax the quality requirement, accept a heuristic without a guarantee, or invest in exact methods for small instances (if they are typically small) or other alternatives.

  Include one case where the procedure tells me something I will not want to hear: 

  Example: We have a problem that is NP-hard and our instances are large (n=100,000). We have been using a heuristic that works well, but we want to switch to an exact solver for quality. The procedure:

  1. Problem: clear.
  2. Instance size: 100,000 -> too big for brute force.
  3. Hardness: NP-hard -> conditional.
  5. Exact Solvers: We try state-of-the-art exact solvers (e.g., MIP solver) and they time out on n=100,000.
  6. Approximation: There is a known 2-approximation, but we require 1.1. The hardness result says no (1.1)-approximation unless P=NP. 
     - We must either relax to 2-approximation or use the existing heuristic without a guarantee. 
     - If we require 1.1, then we cannot have a provable guarantee. 
     - The human must decide: is the 1.1 requirement so critical that we must try to improve the heuristic (without guarantee) or is 2 acceptable? 

  But the verdict is Human Judgment Required. However, note: we might not want to hear that we cannot have both efficiency and the 1.1 guarantee.

  What the procedure cannot do:

  - **Judgment in instance characterization**: Step 2 requires knowing the "typical" instances. This is often based on domain knowledge and might be wrong if the instances change.
  - **Benchmarking in step 5**: The performance of solvers on "our instances" is empirical and might change with new instances.
  - **Trade-off analysis**: Step 7 is inherently about business values, which the procedure cannot assess.
  - **Hardness of approximation gaps**: The procedure relies on known results. If the problem is not well-studied, we might not know the best approximation possible.
  - **Constants in asymptotics**: We ignore constants, but sometimes a O(n^10) algorithm is not practical even for n=100.
  - **New solvers**: The procedure uses current solvers. A new solver might appear that breaks our previous conclusions.

  The procedure is a structured way to avoid common fallacies, but it is not infallible. It might misfire by:
     - Overlooking a practical exact solver because we didn't benchmark the right one.
     - Underestimating the impact of constants (e.g., an O(2^n) algorithm with a very small constant might be feasible for n=50, but we reject because 2^50 is large, but if the constant is 10^-15 seconds per operation, then it's acceptable).
     - Worst-case instances might actually occur in practice.

  You would be wrong to trust the procedure if:
     - You have a problem where the instance structure is not well understood (so step 2 is wrong).
     - The hardness reduction is not properly analyzed (step 4) and we miss that the reduction does not apply to our setting.
     - The solver landscape changes.

  Despite these, the procedure forces us to make explicit the assumptions and gaps in the argument for heuristics, leading to more informed decisions.
answer: |-
  ### Brainstorming: Key Distinctions and Their Status  
  1. **Worst-case vs. actual-instance hardness**  
     - **Theorem**: Hardness results (e.g., NP-hardness) apply to worst-case instances.  
     - **Conjecture**: Worst-case hardness implies hardness for typical instances (unproven; false for many problems).  
     - **Habit**: Treating worst-case hardness as universally applicable.  
     - **Keep**: Demand evidence that worst-case instances are relevant to our inputs. Drop habit of automatic generalization.  

  2. **Hardness of exact vs. approximate solutions**  
     - **Theorem**: Some problems are inapproximable (e.g., no PTAS unless P=NP).  
     - **Conjecture**: Hardness of approximation is homogeneous (false; e.g., TSP is NP-hard but admits good approximations).  
     - **Habit**: Conflating exact hardness with approximation hardness.  
     - **Keep**: Treat these as separate dimensions. Drop habit of lumping them together.  

  3. **Meaning of reductions**  
     - **Theorem**: A reduction from problem A to B preserves worst-case hardness (if A is hard, B is hard).  
     - **Conjecture**: Reductions preserve practical hardness (often false; e.g., parameter blowup).  
     - **Habit**: Assuming reductions imply identical practical behavior.  
     - **Keep**: Require analysis of what the reduction preserves (size, quality, etc.). Drop habit of assuming interchangeability.  

  4. **Status of hardness claims**  
     - **Theorem**: Unconditional lower bounds (e.g., EXPTIME-complete problems).  
     - **Conjecture**: Conditional hardness (e.g., NP-hardness relies on P≠NP).  
     - **Habit**: Treating empirical failures as proof of hardness.  
     - **Keep**: Classify hardness as unconditional, conditional, or empirical. Drop habit of elevating conjecture to fact.  

  5. **Asymptotics and model relativity**  
     - **Theorem**: Asymptotic complexity ignores constants; hardness is model-dependent (e.g., RAM vs. Turing).  
     - **Conjecture**: "Efficient in practice" aligns with polynomial time (often false; e.g., O(n¹⁰) is impractical).  
     - **Habit**: Ignoring constants and model differences.  
     - **Keep**: Demand concrete instance sizes and reject asymptotics without constants. Drop habit of asymptotic extrapolation.  

  6. **Solver-relative hardness**  
     - **Theorem**: Practical solvers (e.g., SAT solvers) beat theoretical bounds for structured instances.  
     - **Conjecture**: Textbook hardness implies solver hardness (false; e.g., MIP solvers excel on many NP-hard problems).  
     - **Habit**: Equating theoretical hardness with infeasibility in practice.  
     - **Keep**: Require benchmarking against state-of-the-art solvers. Drop habit of ignoring practical tools.  

  ---  
  ### Decision Procedure: "Complexity Triage Protocol"  
  **Input**: A proposal to abandon exact solutions due to alleged intractability.  
  **Output**: One of four verdicts:  
  - **EXACT_FEASIBLE**: Stick with exact solution; claims of intractability are unsupported.  
  - **APPROX_NEEDED**: Approximate/heuristic solution justified; exact is provably intractable for our constraints.  
  - **QUALITY_TRADEOFF**: Exact may be feasible, but approximation offers better cost/quality; human decides trade-off.  
  - **HARD_BARRIER**: Provable barrier (exact or desired approximation); human must relax requirements or accept risk.  

  #### Procedure Checklist  
  **Question 1: Problem Specification**  
  - *Ask*: What is the exact problem? Define inputs, outputs, and constraints. What instance sizes (`n`) occur in production?  
  - *Sufficient answer*: Clear problem statement; max/typical `n`; quantifiable "exactness" (e.g., optimality gap).  
  - *Stop if*: Problem undefined or `n` unstated → **EXACT_FEASIBLE** (proposal invalid).  

  **Question 2: Claimed Hardness Basis**  
  - *Ask*: What is the evidence of hardness? (e.g., NP-hard reduction, unconditional lower bound, empirical failures).  
  - *Sufficient answer*: Cite specific theorem/reduction or data from failed attempts.  
  - *Classify hardness*:  
    - Unconditional (e.g., "provably requires Ω(2ⁿ) time")?  
    - Conditional (e.g., "NP-hard under P≠NP")?  
    - Empirical only (e.g., "we tried for a month and failed")?  
  - *Stop if*: Only empirical evidence → **EXACT_FEASIBLE** (not proven hard).  
  - *Usually decisive*: Distinguishing unconditional/conditional from empirical.  

  **Question 3: Worst-Case Relevance**  
  - *Ask*: Could worst-case instances occur in practice? What structural properties do our instances have?  
  - *Sufficient answer*: Data showing instances are structured (e.g., sparse, planar, bounded parameters) or adversarial.  
  - *Stop if*: Instances are structured and small → **EXACT_FEASIBLE** (worst-case unlikely).  
  - *Usually decisive*: Small `n` (<100) with structure → exact often feasible.  

  **Question 4: Reduction Analysis (if reduction claimed)**  
  - *Ask*: What does the reduction preserve? How does instance size map (e.g., SAT instance → our problem with size blowup)?  
  - *Sufficient answer*: Reduction mapping (e.g., "SAT with `k` clauses → our problem with `n = k³`").  
  - *Preservation check*:  
    - If preserving solution quality → hardness likely extends to approximations.  
    - If size blowup exists (e.g., `n = k³`), check if `n` enters the "hard regime" of the source problem.  
  - *Stop if*: Size blowup places `n` below the hard regime (e.g., SAT hard at `k>10,000`, but `n = k³ = 1,000` → `k=10`) → **EXACT_FEASIBLE**.  

  **Question 5: Solver Feasibility**  
  - *Ask*: What exact solvers exist? Benchmark them on our largest instances (wall-clock time, resources).  
  - *Sufficient answer*: Tests using tools (e.g., Gurobi, CPLEX, custom solver) on production-like data.  
  - *Stop if*: Solvers succeed within time/resource constraints → **EXACT_FEASIBLE**.  
  - *Usually decisive*: For `n < 100`, modern solvers often dominate heuristics.  

  **Question 6: Approximation Hardness (if quality guarantee needed)**  
  - *Ask*: Does the hardness result rule out the desired approximation? (e.g., "no (1+ε)-approx unless P=NP").  
  - *Sufficient answer*: Cite inapproximability theorem matching our required guarantee.  
  - *Stop if*:  
    - No inapproximability result → **QUALITY_TRADEOFF** (heuristic may be safe; human judges risk).  
    - Inapproximability proven under standard conjecture → **HARD_BARRIER** (human must relax guarantee).  

  **Question 7: Cost of Inexactness**  
  - *Ask*: What are the consequences of approximation? (e.g., revenue loss, safety issues).  
  - *Handoff*: Always → human decides based on business/risk trade-offs.  
  - *Verdict*: **QUALITY_TRADEOFF** or **HARD_BARRIER** (depending on prior steps).  

  ---  
  ### Procedure in Action  
  #### Proposal 1: Scheduling with few dozen items  
  1. **Problem**: Job scheduling. Max `n=50` items.  
  2. **Hardness Claim**: NP-hard per [Garey & Johnson]. Conditional.  
  3. **Worst-Case Relevance**: Instances are sparse (avg. dependencies <5/item). Worst-case rare.  
  4. **Reduction Analysis**: Not provided → skip.  
  5. **Solver Feasibility**: Tested with CP-SAT solver. Solves `n=50` in 2 sec.  
  6. **Approximation Hardness**: Not requested (exact solution preferred).  
  7. **Verdict**: **EXACT_FEASIBLE** (solver works; small structured instances).  
  - *Why you won’t like it*: Team might insist on heuristic for "scalability"; procedure overrules.  

  #### Proposal 2: Reduction from hard problem, but size blowup  
  1. **Problem**: Graph embedding. Max `n=100` nodes.  
  2. **Hardness Claim**: Reduction from 3-SAT (NP-hard).  
  3. **Worst-Case Relevance**: Instances have bounded degree (real-world graphs).  
  4. **Reduction Analysis**: Reduction maps `k`-variable SAT to `n=k⁴` nodes. 3-SAT hard for `k>10,000` → `n=10¹⁶` (!). Our `n=100` → `k=3.16`, trivial for SAT solvers.  
  5. **Solver Feasibility**: Custom solver handles `n=100` in minutes.  
  6. **Verdict**: **EXACT_FEASIBLE** (reduction’s hard regime irrelevant).  

  #### Proposal 3: Inapproximability under conjecture  
  1. **Problem**: Network design. Require 1.5-approximation. Max `n=10,000`.  
  2. **Hardness Claim**: NP-hard; no 1.5-approx unless P=NP.  
  3. **Worst-Case Relevance**: Instances are worst-case-like (adversarial deployments).  
  4. **Reduction Analysis**: Reduction preserves approximation gap (gap-preserving).  
  5. **Solver Feasibility**: Exact solver times out for `n>500`.  
  6. **Approximation Hardness**: Theorem: No 1.5-approx exists if P≠NP.  
  7. **Cost of Inexactness**: 2.0-approx risks 10% revenue loss; heuristic has no guarantee.  
  - **Verdict**: **HARD_BARRIER** (procedure stops here; handoff to human).  
  - *Human decision*: Accept 2.0-approximation (provable), use heuristic (no guarantee), or invest in exact methods for subcases. Must weigh revenue risk vs. engineering cost.  

  ---  
  ### What the Procedure Cannot Do  
  1. **Judgment in disguise**:  
     - Step 3 (worst-case relevance) relies on subjective structural analysis. Misjudging instance structure causes misfires (e.g., assuming "sparse" graphs, but adversaries inject dense subgraphs).  
  2. **Benchmarking bias**:  
     - Step 5 (solver feasibility) assumes you test representative instances. If benchmarks omit edge cases, it approves exact solutions that fail in production.  
  3. **Conjecture dependence**:  
     - Conditional hardness (Step 2) treats P≠NP as true. If P=NP, all NP-hard claims collapse. This is unlikely but possible.  
  4. **Approximation gaps**:  
     - Step 6 assumes inapproximability results match your quality needs. If the literature is thin (e.g., no known 1.2-approx bound), the procedure may under/over-reject.  
  5. **Human trade-offs**:  
     - **HARD_BARRIER** and **QUALITY_TRADEOFF** delegate to humans. The procedure cannot quantify "acceptable risk" (e.g., how much revenue loss justifies 6 man-months?).  
  6. **Black swans**:  
     - Worst-case instances might emerge post-deployment (e.g., after a product change). Procedure uses current data; it won’t anticipate this.  

  **When to distrust the procedure**:  
  - If instance structure is poorly understood (Steps 3–4 fail).  
  - If solvers improve dramatically post-decision (Step 5 outdated).  
  - If approximations exist but are unknown to you (Step 6 incomplete).  
  - For problems with high-stakes exactness (e.g., medical devices), **EXACT_FEASIBLE** verdicts risk lives if solvers fail silently.  

  **Final note**: This systematizes common reasoning flaws but is no substitute for domain expertise. Re-run it when instances, solvers, or hardness results evolve.
