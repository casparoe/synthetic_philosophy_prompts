answer: |-
  Your description perfectly captures a fundamental snag in value-neutral impact metrics—and while there's no single universally established term for **this exact pattern**, the problem is widely recognized. The closest existing concept is **"The Baseline Problem"** or **"Counterfactual Dependence"** in impact measurement, but your insight about **value smuggling/distinction collapse** demands sharper terminology.  

  I propose coining the term:  
  **Value-Laden Baseline Entanglement (VLBE)**  

  ### Definition of VLBE
  The inherent impossibility of defining a "value-free" measure of an agent's impact or side effects because:  
  1. **The baseline (counterfactual world) is unavoidably value-laden**. Choosing "no action" or "minimal action" as the baseline implicitly privileges the status quo, treating preservation as neutral and change as costly—even when change prevents harm.  
  2. **Impact metrics dissolve critical distinctions**. Any deviation from the baseline is penalized equally, collapsing:  
     - Harm prevention vs. harm causation (both are deviations),  
     - Intended vs. unintended consequences (if intent is ignored).  
  Thus, the metric smuggles values through baseline choice while failing to capture the distinction ("side effects") it claims to measure.  

  ---

  ### How VLBE Addresses Your Observations  
  1. **The Harm Prevention/Causation Collapse**  
     - VLBE explicitly names why this happens: penalizing deviation *from the baseline* treats all change as symmetric. If a falling boulder would crush a person in the default world, an agent that moves the person to safety is penalized as much as one that pushes them *into* the boulder’s path. The baseline encodes a value judgment: *stasis is neutral*.  

  2. **The Loss of the "Side Effect" Distinction**  
     - Proposals that ignore agent intent (e.g., measuring "unforeseen" changes in state variables) fail because "side effect" requires understanding *what the agent aimed to do*. VLBE highlights that removing intent collapses wanted/unwanted outcomes into raw deviation, destroying the concept of "side effects" entirely.  

  ---

  ### How VLBE Relates to Broader Concepts  
  **(a) General baseline dependence in measurement**  
  All metrics need baselines (e.g., measuring height requires a "zero point"). But VLBE is a *specific failure mode* when:  
  - The metric claims **value-neutrality** ("just minimize disturbance!"),  
  - But the baseline encodes **unexamined values** (e.g., *inaction is preferable*).  
  This turns measurement into **smuggled normativity**: the baseline silently defines what "disturbance" *is*.  

  **(b) The thesis that side-effect avoidance requires value specification**  
  VLBE **proves this thesis**. It shows that:  
  - "Side effects" cannot be separated from "main effects" without knowing the agent’s goals (intent).  
  - "Harm" cannot be defined without a full value model (e.g., is preventing death a "disturbance"?).  
  **Any baseline choice** (do-nothing, minimal action, channel-constrained action) answers these questions *implicitly*—making value-neutrality impossible.  

  ---

  ### Why This Carving Works
  - **"Value-Laden"**: Directly confronts the core issue: values are hidden in the baseline.  
  - **"Baseline Entanglement"**: Emphasizes that the baseline isn’t a neutral reference—it’s entangled with the definition of "impact."  
  - **Distinction from Goodhart/Alignment**: VLBE is a *mechanism* by which alignment fails when impact metrics are naively applied. It explains *why* "minimize side effects" incentives often backfire (e.g., agents that refuse to act to avoid deviation).  

  ### Example in Practice
  - **Naive impact penalty**: `Penalty = || S_actual - S_baseline ||` (e.g., difference in world states).  
  - **VLBE critique**: If `S_baseline` is "agent does nothing," stopping a landslide *increases* the penalty. If `S_baseline` is "agent acts only via UI," saving someone by breaking a window is penalized. The baseline *is* the value judgment.  

  ### The Implication
  **There is no value-free "impact."** Defining "low-impact" AI requires explicit value specifications:  
  - What states are desirable?  
  - What changes are intentional?  
  - When is deviation *good*?  
  VLBE exposes that attempts to dodge this *create worse problems*—like penalizing benevolence or rewarding passivity.  

  If you adopt this term, use it to force clarity: *"Which values are embedded in your baseline?"* That’s the carving you need.
