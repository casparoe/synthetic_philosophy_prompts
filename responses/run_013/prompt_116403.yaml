answer: |-
  Based on your framing and constraints, here’s a defended research agenda prioritizing conceptual leverage, neglectedness, and potential to reshape the debate. Your framing is largely sound but **underestimates the metaphysical entanglement of "causation" and "individuation"**—they cannot be fully separated, requiring an integrated treatment.

  ### Core Problems & Prioritization
  **Year 1: Question 1 — Causal Parity and Explanatory Irreducibility**  
  *   **Question:** *When (if ever) do group-level causal claims resist reduction to individual-level mechanisms without explanatory loss, even when formal equivalence holds?*  
  *   **Why first?**  
      - **Downstream impact:** Foundational. Resolving this determines whether group-level traits are explanatory (vs. merely descriptive bookkeeping). Affects all other questions.  
      - **Resolvability via conceptual work:** Yes. Requires analyzing causal models (e.g., Woodward-style interventionism) and "explanatory depth" criteria.  
      - **Neglectedness:** High. Post-equivalence literature focuses on *formal* reducibility, not *explanatory* reducibility.  
      - **Impact if settled:** Forces empiricists to justify explanatory targets (e.g., why model groups if individuals "suffice"?).  

  **Year 2: Question 2 — The "Feature-for-Which" Distinction**  
  *   **Question:** *What criteria distinguish a trait being incidentally correlated with fitness ("selected") vs. being the direct target of selection ("feature for which")?*  
  *   **Why second?**  
      - **Downstream impact:** Directly addresses your conviction about heritable group traits without individuality. Determines when group selection is *causally salient*.  
      - **Resolvability:** Primarily conceptual. Requires coupling causal modeling with trait ontology (e.g., what makes a trait "unitary"?).  
      - **Neglectedness:** Extreme. Often hand-waved in MLS/kin debates.  
      - **Impact if settled:** Clarifies when group traits (e.g., biofilm structure) are genuine selective targets despite no group reproduction.  

  **Year 3: Question 3 — Individuation Precedes Selection?**  
  *   **Question:** *Is the "evolutionary individual" concept prior to identifying units of selection, or derived from population dynamics?*  
  *   **Why third?**  
      - **Downstream impact:** Reshapes criteria for "units." If individuality is derivative (e.g., from fitness bottlenecks), it dissolves circularity in MLS arguments.  
      - **Resolvability:** Conceptual/formal. Analyze whether Darwinian prerequisites (variation, heredity, fitness differences) presuppose individuation.  
      - **Neglectedness:** Moderate. Debated (Godfrey-Smith vs. Clarke), but lacks systematic ties to causal questions.  
      - **Impact if settled:** Overhauls major transitions theory; challenges "replicator" orthodoxies.  

  ### Discarded/Deferred Questions
  - **"Level at which selection acts":** **Discard.** Presupposes a false dichotomy. Selection is a *process* spanning hierarchies; the key is causal/explanatory salience (covered in Q1–Q2).  
  - **Cultural evolution/major transitions:** **Defer.** Requires resolving Q1–Q3 first. Cultural evolution introduces additional complexity (e.g., non-germline inheritance) that muddies the conceptual core.  
  - **"Reduction without loss":** Folded into Q1.  

  ### Critical Dependencies & Risks  
  1.  **Q1’s success hinges** on developing a rigorous account of "explanatory loss." *Failure point:* If no robust criteria emerge beyond intuition (e.g., "group talk is heuristically useful"), progress stalls.  
  2.  **Q2 requires integrating** trait ontology (e.g., Wimsatt’s aggregativity) with causal selection. *Failure point:* If "feature-for-which" reduces to pragmatic modeling choices, its substance dissolves.  
  3.  **Q3 risks circularity** if individuation criteria implicitly assume selection dynamics. *Mitigation:* Anchor in minimal physics-first criteria (e.g., topological boundaries).  

  ### What Would Change the Ranking?
  - **↑ Promote Q2** if empirical work demonstrates clear cases of "feature-for-which" ambiguity (e.g., CRISPR-Cas systems where group defense is heritable but not reproducer-bound).  
  - **↓ Demote Q3** if a consensus emerges that individuality is *always* context-dependent (making it less pivotal).  
  - **↑ Integrate major transitions** if analysis of Q1–Q2 reveals novel transitions criteria (e.g., explanatory irreducibility as a transition marker).  

  ### Why This Order?  
  - **Conceptual dependency:** Q1 (causation) provides tools for Q2 (trait selection), which together inform Q3 (individuation).  
  - **Risk distribution:** High-stakes Q1 tackled first; if intractable, pivot to refining Q2/Q3 with partial insights.  
  - **Output efficiency:** Papers on causal irreducibility (Year 1) and "feature-for-which" criteria (Year 2) set the stage for a synthetic monograph on individuation (Year 3).  

  **Weakest link:** Q1’s reliance on causal modeling frameworks not designed for evolutionary hierarchies. If interventionist causation cannot handle cross-level dependencies, the agenda stumbles. **Contingency:** Shift to a process-metaphysics approach (e.g., Salmon) if interventionism falters.  

  This agenda bets that **resolving explanatory irreducibility will force a reconception of evolutionary individuality**—making it the sharpest tool for cutting through 50 years of debate.
