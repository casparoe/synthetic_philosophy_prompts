     - Group B: Activity B (only finite sets)
     - Group C: Activity C (restricted to numbers < 10)

   But Activity C is to illustrate the misapplication, so maybe we do that after.

   Alternatively, we can do Activity A and B first, then Activity C as a separate illustration.

   Since we have 90 minutes, we can do:

   1. Activity A and B simultaneously (10-15 minutes for the activity, then report).
      - Each group does one of A or B.
      - The goal is to build a maximal set.

   2. After 10 minutes, stop and have each group report:
      - Group A: they have an infinite set (by the limit step) and it is maximal.
      - Group B: they are not done and never will be.

   3. Then the instructor asks: why the difference? Because in A, the union of the chain is allowed, in B, it is not.

   4. Then Activity C: groups are told to build a maximal set among sets that contain only numbers <10. They will build a finite set and stop. Then we ask: is this set maximal in the whole poset? No.

   5. Then we debrief and connect to Zorn's lemma.

   Roles:
     - Referee for each group: might be a student or the instructor circulating. But to save time, the instructor can act as referee for all.

     - Alternatively, the rules are clear, and the referee steps are built into the timeline.

     - For Activity A, after the group has made, say, 5 additions, the referee (instructor) comes and does the limit step.

     - For Activity B, after 5 additions, the referee says they must continue.

     - For Activity C, they stop when they can't add any more (within the restriction).

   To illustrate the use of Zorn's lemma and the verification of the chain condition, we can then give a genuine example.

   Example: Let V be a vector space. We want a basis. The poset is the collection of linearly independent sets, ordered by inclusion. 
     - Chains: if you have a chain of linearly independent sets, then the union is linearly independent. Why? If there were a linear dependence in the union, it would involve only finitely many vectors, which would be in some set in the chain, contradiction. So the chain condition holds.
     - Hence, by Zorn's lemma, there is a maximal linearly independent set, which is a basis.

   And for a failure example: the collection of finite linearly independent sets in an infinite-dimensional space. Then the chain condition fails: a chain of finite linearly independent sets may have union infinite, which is not in the poset. And there is no maximal element.

   But we don't have time to do that as an activity, so we just state it.

   Now, the debrief should cover the bullets:

   1. The limit step: in Activity A, the union of the chain (built by the infinite process) is what becomes the maximal object. Without that, we would have to keep going.

   2. The chain condition: in Activity A, the union of a chain is in the poset; in Activity B, it is not. That is why Activity A succeeds and Activity B fails.

   3. Maximal is not maximum: in Activity A, one group might have built an infinite even set, another an infinite odd set. Neither contains the other, but both are maximal.

   4. Relative to the collection: in Activity C, the maximal set they built is only maximal in the restricted collection, not in the whole poset.

   5. Existence is not construction: at each step, they had many choices (which number to add next). The outcome is arbitrary.

   Additionally, we should state that Zorn's lemma is equivalent to the Axiom of Choice, which is what allows the arbitrary choices at each step.

   What the activity cannot reproduce:
     - The full generality of partial orders: we used a specific poset.
     - The transfinite recursion: we simulated the infinite union by a referee's fiat.
     - The actual verification of the chain condition in a complex example: we only did a simple one.

   But the activity should give them the intuition.

   Predictable problems:
     - The finite supply of numbers: we stipulated that there are infinitely many available, but physically we have only up to 100. So for Activity B, if a group uses up all even numbers, they stop. We must tell them: "assume there are infinitely many numbers, so you can always add one more even number (even if you don't have a card for it)." We can have them just name a number not yet chosen.

     - In Activity A, after the limit step, they have an infinite set, but they might ask: "can we add an odd number?" But no, because the set is all even, and they can only add even numbers. But what if they want to change parity? The rules don't allow that. They can only add numbers of the same parity.

     - The students might not see the difference between Activity A and B if we don't emphasize the role of the limit step.

     - In Activity C, they might add numbers beyond 10 by mistake. The referee should enforce the restriction.

     - Time: we have to keep each activity short.

   Timeline breakdown:

     - 5 min: Introduction and group assignment.
     - 15 min: Activity A and B in groups. The instructor circulates and acts as referee, doing the limit step for Activity A groups after 5 additions and for Activity B groups, telling them to continue.
     - 10 min: Activity C in groups.
     - 10 min: Group reports: one group from A, one from B, one from C report what they built and whether they stopped and why.
     - 20 min: Debrief: connect to Zorn's lemma. Have the students state the hypothesis and conclusion. Discuss the bullets.
     - 20 min: Genuine example (vector space basis) and a failure example. Also, state that this is equivalent to the Axiom of Choice.
     - 10 min: Wrap-up and questions.

   But 15+10+10+20+20+10 = 85 minutes.

   Alternatively, we can skip Activity C and incorporate the restricted collection in the debrief by asking: "What if we had restricted the sets to contain only numbers below 10? Would the set you built in Activity A still be maximal?" But then they don't experience it.

   I think Activity C is quick.

   Let me write the rules for the activities in hand-out form.

   Hand-out for Group A:

     Goal: Build a maximal set of numbers. 
     Rules:
       1. Your set must be either all even numbers or all odd numbers. It can be finite or infinite.
       2. Start with the empty set.
       3. At each step, you may add one number to your set. If the set is empty, you can choose any even or any odd number to start. If the set is non-empty, you must add a number of the same parity as the set, and it must not be already in the set.
       4. After you have added 5 numbers, the referee will call a limit step. The referee will give you a card representing the infinite set of all even (or odd) numbers. Then try to extend it by adding one more number: can you? 
       5. If you cannot extend it, then you have built a maximal set.

   Hand-out for Group B:

     Goal: Build a maximal set of numbers.
     Rules:
       1. Your set must be finite and either all even or all odd.
       2. Start with the empty set.
       3. At each step, you may add one number to your set. If the set is empty, you can choose any even or any odd number to start. If the set is non-empty, you must add a number of the same parity as the set, and it must not be already in the set.
       4. After you have added 5 numbers, the referee will tell you: "Imagine you continued this process infinitely. You would have an infinite set, but in this game, only finite sets are allowed. So you cannot stop. You must add another number. And you can, because there are infinitely many even (or odd) numbers available (even though we only have cards up to 100, assume there are more)."
       5. You will never be able to stop because you can always add one more number.

   Hand-out for Group C:

     Goal: Build a maximal set of numbers among those that contain only numbers less than 10.
     Rules:
       1. Your set must be either all even or all odd, and every number in it must be <10.
       2. Start with the empty set.
       3. At each step, you may add one number to your set. The number must be <10, and if the set is non-empty, it must be the same parity as the set and not already in the set.
       4. When you cannot add any more numbers (within the rules), stop.

   Then in the debrief, we discuss:

     - For Group A: They built an infinite set by the limit step, and it was maximal. The key was that the union of their finite steps was allowed in the poset.

     - For Group B: They could not stop because the union of an infinite chain would not be in the poset.

     - For Group C: They built a finite set (e.g., {0,2,4,6,8} for even) and stopped. But is this set maximal in the whole poset (without the restriction)? No, because we can add 10,12, etc. But it is maximal among sets with numbers <10.

     - Then we ask: what if we applied Zorn's lemma to the restricted collection (sets with numbers <10)? It would give a maximal element in that collection, which is what they built. But if we applied it to the whole collection, we would get something else.

     - Also, in Group A and B, at each step they had to choose which number to add next. There were many choices, and two groups might have built different sets (e.g., one even, one odd). So the outcome is arbitrary.

     - The hypothesis of Zorn's lemma is that every chain has an upper bound in the poset. In Group A's rules, it does; in Group B's, it does not.

     - The conclusion is the existence of a maximal element.

     - Then we give the vector space example and verify the chain condition.

     - We also give an example where the chain condition fails: the finite linearly independent sets in an infinite-dimensional vector space.

     - Finally, note that Zorn's lemma is equivalent to the Axiom of Choice, which was used implicitly when they made arbitrary choices at each step.

   This should cover all the bullets.

   The activity cannot reproduce:
     - The full transfinite induction: we only did a very simple chain (a countable chain) and simulated the limit.
     - The generality of partial orders: we used inclusion in a powerset.
     - The actual process of taking an upper bound for a chain that is not just a union: in our case, the union worked, but in general, the upper bound might be something else.

   But the activity should give the intuition.

   Let's hope it works.
answer: |-
  ### In-Class Activity: Understanding Zorn's Lemma through "Set Builder" Game  
  **Duration:** 90 minutes  
  **Students:** 16 philosophy graduate students (familiar with Zorn’s lemma but lacking intuition for the chain condition)  
  **Goal:** Experience why Zorn’s lemma requires the chain condition and internalize key insights through hands-on problem-solving.  

  ---

  #### **Materials**  
  - **Number cards:** 30 cards labeled with distinct natural numbers (0–29).  
  - **Special cards:** 2 cards labeled "Infinite Even Set" and "Infinite Odd Set".  
  - **Rule sheets** for three game variants (A, B, C).  
  - **Whiteboard** to track "arbitrary choices" during gameplay.  
  - **Timer** for 5-minute intervals.  

  ---

  #### **Group Setup**  
  - Divide students into 4 teams of 4.  
  - Assign each team one rule variant:  
    - **Team A1 & A2:** Rule Set A (chain condition holds).  
    - **Team B:** Rule Set B (chain condition fails).  
    - **Team C:** Rule Set C (misapplication: extra restriction).  
  - **Instructor role:** Referee (enforces rules, triggers "limit steps," records choices).  

  ---

  ### **Game Rules**  
  **Shared Goal:** Build a *maximal* set of numbers. A set is **maximal** if no number can be added without breaking the rules.  

  #### **Rule Set A (Chain Condition Holds)**  
  1. Your set must contain numbers that are **all even OR all odd** (e.g., {2, 4, 6} or {1, 3}). It can be finite or infinite.  
  2. **Start:** Empty set.  
  3. **Each turn:**  
     - Add one number card to your set.  
     - If the set is empty, choose *any* even or odd number to start.  
     - If non-empty, the new number must match the parity (even/odd) of the set.  
  4. **Limit Step (Triggered by referee after 3 additions):**  
     - Referee gives you the special card "Infinite [Even/Odd] Set" (representing the union of your infinite chain of finite sets).  
     - Try to add another number to this infinite set. If impossible, you have a maximal set.  

  #### **Rule Set B (Chain Condition Fails)**  
  1. Your set must be **finite** and **all even OR all odd**.  
  2. **Start & Turns:** Same as Rule Set A.  
  3. **Limit Step (After 3 additions):**  
     - Referee says: *"Your infinite set is not allowed. Keep building."*  
     - Continue adding numbers indefinitely (assume infinite numbers exist beyond the cards).  
  4. **Goal:** Realize you can *never* stop.  

  #### **Rule Set C (Misapplication: Extra Restriction)**  
  1. Your set must be **all even OR all odd**, but **numbers must be ≤ 9** (e.g., {1, 3, 5} is ok; {1, 3, 11} is not).  
  2. **Start & Turns:** Same as Rule Set A.  
  3. **No Limit Step:** Stop when no more *≤9* numbers can be added.  

  ---

  ### **Timeline**  
  1. **Introduction (5 min):**  
     - Explain the goal: Build a maximal set using your rules.  
     - Emphasize: *"Maximal means no legal move remains—not just that you ran out of cards."*  

  2. **Gameplay (30 min):**  
     - Teams play in parallel (7 min per variant).  
     - Referee:  
       - Records arbitrary choices on the whiteboard (e.g., "Team A1 chose even; added 4 → 0 → 2").  
       - Enforces Rule C’s "≤9" restriction strictly.  
       - Triggers **Limit Step** for Teams A1/A2 and B after 3 additions:  
         - **Team A1/A2:** Give "Infinite Set" card. Ask: *"Can you add another number to this infinite set?"*  
         - **Team B:** Announce: *"Your infinite set is invalid. Keep going—you can always add more numbers."*  
     - After 7 min, rotate rules (Team A1 → Rule C, Team A2 → Rule B, Team B → Rule A, Team C → Rule A). Repeat.  

  3. **Group Reports (15 min):**  
     - Each team shares:  
       - What set did you build?  
       - Did you stop? Why?  
       - Could another team build something "larger"?  
     - **Sample outcomes:**  
       - Teams A: "We got an infinite even set. We couldn’t add more—it’s maximal."  
       - Team B: "We never stopped. We could always add another number."  
       - Team C: "We built {0, 2, 4, 6, 8}. We stopped—no more numbers ≤9."  

  4. **Structured Debrief (30 min):**  
     - **Referee narrates** using whiteboard notes to map experiences to Zorn’s lemma:  

  | **Experience in Game** | **Connection to Zorn’s Lemma** | **Bullet Point** |
  |------------------------|--------------------------------|------------------|
  | Teams A hit a "limit step": Their infinite set (union of their chain) was *allowed* and became maximal. Teams B’s union was *not allowed*, so they never stopped. | **Chain condition = Unions of chains must be in the poset.** If unions aren’t legal objects, the chain has no upper bound, and you may have no maximal element. | "The chain condition is a substantive hypothesis that can fail." |
  | Teams A built infinite even/odd sets. Neither contains the other! Team C built {0,2,4,6,8}, but Team A built a "larger" infinite set. | **Maximal ≠ maximum.** A maximal object isn’t necessarily the biggest possible; it’s just one that can’t be extended. Multiple maximal objects can coexist. | "Maximal is not maximum." |
  | Team C’s set {0,2,4,6,8} is maximal *only* under the "≤9" rule. Without this, it’s extendable (e.g., add 10). | **Maximality is relative to the poset.** Applying Zorn’s lemma to a restricted poset gives maximality *in that subset*, which may not hold globally. | "Maximality is relative to the collection." |
  | At each turn, teams picked numbers arbitrarily (e.g., "why start with even?" or "why add 4 before 0?"). Different choices led to different outcomes. | **Existence ≠ construction.** Zorn’s lemma guarantees a maximal object *exists* via the Axiom of Choice (to make arbitrary picks), but it doesn’t specify *which* one. | "Existence is not construction." |
  | Teams A only succeeded when the limit step worked: The union of their finite sets was a valid object. | **The limit step is crucial.** Extending step-by-step is easy; the "work" is ensuring the union of the chain is valid/extendable. | "The interesting step is the limit step." |

     - **Genuine Application & Verification:**  
       - **Example:** Proving every vector space has a basis.  
         - *Poset:* Linearly independent sets, ordered by inclusion.  
         - *Chain condition check:* The union of a chain of linearly independent sets is linearly independent (any finite dependence would occur in some set in the chain). **This is the substantive work.**  
       - **Failure Example:** Maximal *finite* subsets of ℕ (ordered by inclusion).  
         - *Why it fails:* The union of {1}, {1,2}, {1,2,3}, ... is ℕ (infinite), which is not in the poset. No maximal element exists.  
     - **Key Principle:**  
       - Zorn’s lemma is a **maximal principle** equivalent to the Axiom of Choice. It asserts that if every chain has an upper bound *in the poset*, then a maximal element exists. Without the chain condition, the conclusion fails.  

  5. **Conclusion (10 min):**  
     - Students state Zorn’s lemma in their own words: *"If every chain has an upper bound (chain condition), a maximal element exists."*  
     - **Honest limitations:**  
       - The game simulates infinite chains with a referee’s "limit step," but real transfinite induction requires handling all limit ordinals.  
       - Real-world verifications (e.g., vector spaces) rely on mathematical structure (e.g., linear algebra) we abstracted away.  
     - Q&A.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"We ran out of cards in Rule B!"**  
     - Clarify: *"Assume infinite numbers exist. You don’t need physical cards—just say ‘add 30, 32, etc.’"*  
  2. **Team C adds numbers >9:**  
     - Referee intervenes: *"Recall your restriction: numbers ≤9 only!"*  
  3. **Confusion about maximality:**  
     - Contrast: Stopping because *no moves left* (maximal) vs. *no cards left* (supply ended). Repeat: *"Maximal = no legal moves, even with unlimited resources."*  
  4. **"Why does Rule A’s infinite set work?"**  
     - In debrief, stress: *"The rule explicitly allowed infinite sets. This made the union of your chain valid."*  

  ---

  This activity forces students to confront the chain condition’s necessity through failure (Rule B) and misapplication (Rule C), while hands-on gameplay makes abstract concepts visceral. The debrief links experiences to Zorn’s lemma, ensuring they "feel" why the hypothesis matters.
