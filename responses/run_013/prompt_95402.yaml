prompt: |-
  so I've got this friend who's been living in the decision theory salt mines for like a decade, and I'm trying to predict what she'll say about a case I've been chewing on. Her track record, as best I can reconstruct it:

  - Counterfactual mugging, standard Omega version: she pays the $100.
  - Acausal trade with a distant civ whose decisions are correlated with hers through a shared decision procedure: she trades.
  - A message from a random alien species that has no causal or decision-theoretic connection to her, saying give us a coin or we burn a galaxy: she ignores it and refuses.
  - A one-shot causal blackmailer with a real gun and no reputation effects: she refuses to pay.
  - A case where she can precommit to a policy that deters a whole class of future blackmailers: she precommits.

  Now the new case. I've been reading alot about surrogate goals — the trick where two agents who might end up in a threat standoff each adopt a goal neither of them actually cares about, and route the whole conflict through that goal. So instead of give me a coin or I torture you, the threatener says: give me a coin or I'll make the number of dust specks in a particular empty galaxy odd. It doesn't care about dust specks. The threat is now cheap for it to carry out, so it's credible, and it's harmless to you, so you can punish it by making the number even. Nobody gets tortured either way.

  So here's the case: an acausal threatener that is running a copy of my friend's own decision algorithm — a genuine mirror, not just a correlated stranger — makes exactly this surrogate-goal threat. Give a coin, or it flips the dust-speck parity bit. What does my friend say?

  I can see at least a few rules fitting her earlier verdicts that come apart here. One is treat decision-correlated agents as if they were causally present, so comply with the mirror's threat the same way you'd comply with a correlated trade. Another is never move in response to a threat, only in response to an offer, no matter how cheap or harmless the threat is. A third is only real harms count, so a surrogate threat is just noise. Which one is she actually running? Give me your best guess, the reasoning, and the further case that would tell the rules apart.
reasoning: |-
  Okay, I'm diving into this decision theory puzzle. The user is trying to predict how their friend would respond to a novel surrogate-goal threat scenario, based on her established positions in classic thought experiments. 

  First, I need to reconstruct the friend's decision-theory profile from the track record. Counterfactual mugging payment suggests she accepts acausal influence when payoff symmetry exists. Acausal trade participation confirms she engages with decision-correlated entities. But the random alien refusal shows she draws the line at uncorrelated threats - no payoff symmetry, no obligation. The causal blackmail refusal emphasizes this, while the precommitment case reveals her strategic deterrence thinking.

  Now the new scenario is tricky because it mashes up these elements: an acausal mirror (decision-correlated like trade partners) using a surrogate threat (harmless dust-speck flipping). The user sees three possible interpretations of her principles: 

  Option 1 (treat mirrors as causal agents) would suggest compliance since it's like acausal trade. But that feels off because threats differ from trades - her blackmail refusals show she distinguishes coercion from mutual benefit. 

  Option 2 (never yield to threats) aligns with her blackmail stance, but ignores the acausal mirror aspect. If this were a true stranger threatening real harm, she'd refuse, but here the "harm" is symbolic and the agent is her own algorithm.

  Option 3 (only real harms matter) seems too simplistic given her nuanced history. She cares about decision procedures, not just outcomes - otherwise why pay in counterfactual mugging?

  Ah, the key might be her trade vs threat differentiation. In acausal trade, both parties gain from coordination. Here, the mirror gains nothing if she pays - it's pure extraction. Her past behavior suggests she only cooperates when mutual benefit is possible. The surrogate aspect makes the threat credible but doesn't create mutual gain potential. 

  Also notable: precommitment to deter shows she dislikes being exploited. Paying here might invite more surrogate threats from other mirrors. So likely she refuses, viewing this as attempted coercion without reciprocal upside. 

  But to confirm, I imagine a variant: what if the mirror offered mutual surrogate coordination? Like "if we both make the dust specks odd, I'll send you $100"? That might trigger her trade instincts. The refusal here would highlight threat/trade distinction as her core principle.
answer: |-
  Based on your friend's track record and underlying principles, I predict she **refuses to pay the coin** in the surrogate-goal threat scenario. Here's the reasoning, the best-fit rule, and a diagnostic case to confirm:

  ### Predicted Verdict: Refuse to Pay
  **Reasoning:**  
  1.  **Threat vs. Trade Distinction is Key:** Her history shows a sharp distinction between beneficial coordination (trade) and coercive extraction (threats). She pays in Counterfactual Mugging (mutual benefit under symmetry) and Acausal Trade (mutual gain), but refuses uncorrelated threats, causal blackmail, and only uses precommitment to *deter* future threats. A surrogate threat is still fundamentally a *threat* (compliance is extracted via conditional harm, even if "harm" is surrogate), not an offer of mutual benefit.
  2.  **Acausal Mirror ≠ Symmetric Trade Partner:** While the mirror is decision-correlated, the *structure* isn't symmetric mutual gain. In Acausal Trade, both agents benefit from coordinating on a shared action (e.g., both send resources). Here, the mirror gains the coin *only if your friend pays*, while your friend gains nothing by paying – she merely avoids a harmless surrogate change. This resembles extortion, not trade.
  3.  **Surrogate "Harm" Doesn't Change the Coercive Nature:** Her refusal in the random alien threat (real harm) and causal blackmail (real harm) shows she resists coercion on principle. Making the threat *cheap and harmless* via a surrogate doesn't alter the *attempt to compel action through conditional punishment*. Her refusal in the alien case, despite the massive real harm, suggests the *mechanism* (responding to coercive threats) is the issue, not just the magnitude of harm. A harmless threat is still an attempt at coercion.
  4.  **Precommitment Instinct Applies:** Her willingness to precommit to deter threats indicates a policy of not rewarding coercive strategies. Paying this mirror would incentivize this mirror (and potentially other correlated or copied agents) to make similar surrogate threats in the future. Refusing upholds a deterrence equilibrium against coercive demands, even surrogate ones.
  5.  **No Conflict of Real Interests:** The surrogate goal is irrelevant. Since neither agent intrinsically cares about dust speck parity, there's no actual conflict of interest to resolve cooperatively. The mirror is *creating* an artificial conflict solely to extract payment. Her prior decisions suggest she doesn't "play along" with such artificial extortion games.

  ### The Best-Fitting Rule
  **"Refuse coercive threats (extraction attempts), regardless of cost/harm, unless compliance establishes a beneficial coordination equilibrium (like trade). Only coordinate symmetrically for mutual gain with correlated agents; resist asymmetric demands."**

  This rule explains:
  *   **Pays Counterfactual Mugging:** Symmetric mutual benefit under counterfactual coordination (Omega pays her if the coin flip had gone the other way).
  *   **Acausal Trades:** Symmetric mutual gain through coordinated action with a correlated agent.
  *   **Ignores Random Alien Threat:** Coercive extraction attempt from an uncorrelated agent; no mutual gain possible.
  *   **Refuses Causal Blackmail:** Coercive extraction attempt, even with real harm; rewarding it invites more.
  *   **Precommits to Deter:** Establishes a policy to resist future coercive threats.
  *   **Refuses Surrogate Threat:** Coercive extraction attempt (asymmetric demand) from a correlated agent; no mutual benefit, merely avoiding a harmless punishment. Rewarding it invites repetition.

  ### Diagnostic Case to Confirm the Rule: "The Symmetric Surrogate Swap"
  **Scenario:** Your friend encounters an acausal mirror (running her exact decision algorithm). The mirror proposes: "Simultaneously, we will each flip a coin. *If* we both flip heads, I will send you $100. *If* we both flip tails, you send me $100. *If* we flip differently, nothing happens. To enforce this, we threaten each other with flipping the dust-speck parity bit in that empty galaxy if the other defects from their payment obligation."

  **Why this distinguishes the rules:**
  1.  **If she agrees and flips:** This strongly confirms the "Refuse coercive threats" rule. Here, the surrogate threat is merely the enforcement mechanism for a *symmetric, mutually beneficial trade opportunity* (like classic acausal trade). She should see the *core interaction* as beneficial coordination and use the surrogate threat only as a commitment device, just like precommitment deters harmful threats. This fits her paying in standard acausal trade.
  2.  **If she refuses to flip:** This would suggest an even stricter "Never respond to any threat mechanism" rule, inconsistent with her Acausal Trade acceptance. It would also be inconsistent with her Precommitment case, where a threat *is* used (the precommitment itself threatens punishment) to enable desirable outcomes.
  3.  **If she pays the surrogate threatener but refuses this swap:** This would be inconsistent and suggest she's reacting to the *form* (surrogate) or the *harmlessness* specifically, rather than the coercion/mutual-benefit distinction. Her history argues against this.

  **Prediction for Diagnostic Case:** She **agrees and flips the coin.** The core interaction is symmetric potential mutual gain (like acausal trade), using the surrogate threat solely as a credible commitment mechanism to enable that gain. This aligns perfectly with her Acausal Trade and Precommitment verdicts, and distinguishes the refusal in the original surrogate threat case as being about resisting *asymmetric coercive extraction*, not about the surrogate mechanism itself.
