  **Procedure for Evaluating Ulysses Contracts**

  *Purpose*: To determine whether to honor a Ulysses contract (UC) when a patient with such a contract is in a situation that may trigger its terms, and the patient is currently refusing or demanding treatment contrary to the UC.

  *Prerequisites*: 
     - The UC document is available and verified as authentic and executed by the patient.
     - The patient has been assessed for current decision-making capacity for the specific treatment decision at hand (by a qualified clinician).

  *Steps*:

