          - **Yes**: Honor the patient's current decision. The UC is not binding. **Terminate.**  
          - **No**: Proceed to Step 2.  
          - **Uncertain**: Escalate to a psychiatrist for a formal evaluation. If uncertainty persists after evaluation, escalate to the medical director and ethics committee. **Hand to person.**

  2. **Check Trigger Conditions**  
