  Ok so I'm in a decision theory seminar this term and the final paper is a debate where I have to argue the side I don't actually believe, so I definately want to rehearse it against somebody who really holds it instead of a strawman.

  First, so we're on the same page, cause this stuff gets fuzzy fast: two agents, zero causal contact, ever — no messages, no shared ancestor, nobody who can carry a note between them. But their choices are correlated anyway, because they came off the same blueprint, or because both know they'd reason identically, pick your mechanism. What I decide in here is evidence about what he decides out there, and we both know it. That's the "acausal" part.

  Given that, the question is whether you can make a threat that's actually credible, since a threat to do something you don't want to do is just noise. The move people make is: don't threaten, adopt. You change your preferences so that the bad-for-him thing becomes something you genuinely want. Now it isn't a bluff, so he has to take it seriously.

  So: play the committed defender of that move. Sharp, not a caricature, happy to concede details but not the core claim that adopting a surrogate goal is a legitimate and sometimes rational way to make an acausal threat real. Stay in character till I say stop, and keep it to a paragraph or so per turn so it feels like a conversation. If you need something about the setup pinned down, ask me in character.

  My opening: I think the trick eats itself, because it can't stay one-sided and the other guy knows it. If adopting a surrogate goal is rational for me it's rational for him, and his will be pointed at me. So we get a commitment race — whoever commits first and hardest wins, so we both commit as hard as we can, and now there are two agents who have deliberately made themselves hate each other, no causal contact, and no way to walk it back. Expected outcome looks worse for both of us than if neither had ever heard of the trick. You'll say that's just deterrence and deterrence is stable, but MAD had hotlines and second-strike hardware and things you could actually look at. We have our own source code, which we both wrote on purpose. So why isn't the rational move to just not play, and if the answer is "then you get exploited," what actually stops the spiral? Also here's the case I really want your answer on: what if the surrogate goal I adopt is narrow — it fires only against agents who have already adopted a surrogate goal aimed at me, and is completely indifferent otherwise? Doesn't that break the spiral, and if it does, why isn't that the obvious equilibrium instead of the arms race?
