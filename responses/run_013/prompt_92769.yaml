answer: |-
  Here’s a self-contained thought experiment and analysis, built to your specs:

  **The Scenario**  
  *Sarah is shopping for dinner. She considers three protein options, all nutritionally identical, equally tasty, and priced the same:  
  - **Grass-Fed Beef Patty**: Raised on converted grassland (minimal crop inputs).  
  - **Grain-Fed Chicken Breast**: Fed corn/soy from industrial cropland.  
  - **Tofu**: Made from soy grown on industrial cropland.*  

  *Assume each option delivers the same usable calories. Crucially, only the **wild animal toll** differs:  
  - The beef requires **0.1 m² of cropland** (for minor supplements).  
  - The chicken requires **1.5 m² of cropland** (for feed).  
  - The tofu requires **1 m² of cropland** (directly for soy).  
  Cropland means plowing, pesticides, and harvest deaths. Assume **0.5 field deaths per m²** (mice, insects, etc.). Pasture for beef causes negligible wild-animal harm (no heavy machinery/pesticides). Direct deaths of cows/chickens are excluded or held equal per calorie. Soy is equally lethal whether fed to chickens or eaten by humans.*

  ---

  **Analysis by Ethical View**  

  1. **Total-Welfare Utilitarian (Counts all sentient suffering/well-being)**  
     - **Conclusion:** Beef > Tofu > Chicken  
     - **Why:** Only cropland area matters. Beef causes **0.05 deaths** (0.1m² × 0.5). Tofu causes **0.5 deaths** (1m² × 0.5). Chicken causes **0.75 deaths** (1.5m² × 0.5). Beef minimizes total suffering. Chicken’s higher feed requirement makes it worst.  
     - **Heavy Lifter:** The **crop land-intensity per calorie**. Beef’s advantage holds as long as pasture conversion is less lethal than cropland per m²—which it plausibly is. Reversal flips only if pasture deaths *exceed* ~0.4 deaths/m² or beef’s cropland use exceeds tofu’s. Robust if beef uses <20% of tofu’s cropland.  

  2. **Animal-Rights Advocate (Rejects all instrumental use)**  
     - **Conclusion:** All equally unacceptable.  
     - **Why:** Rights theory cares about *how* harm occurs, not totals. Killing cows/chickens as "resources" violates their intrinsic rights, regardless of collateral damage. Wild animal deaths, while tragic, aren’t deliberate exploitation. Tofu might involve fewer *intentional* deaths, but crop farming still treats field animals as obstacles.  
     - **Heavy Lifter:** The **intentionality of harm**. Rights focus on moral agency, not outcomes. Changing death counts doesn’t resolve the core wrong of commodification.  

  3. **Ordinary Shopper (Counts only the animal on the plate)**  
     - **Conclusion:** Tofu > Chicken > Beef  
     - **Why:** Tofu has "no animal." Chicken required killing one bird. Beef required killing one cow (assumed larger/more morally salient). Field deaths are invisible or discounted.  
     - **Heavy Lifter:** **Perceptual salience**. The plate animal is tangible; field deaths are abstract externalities.  

  ---

  **Steelmanning the Animal-Rights View (Against Utilitarian Reversal)**  
  *Defender’s Retort:* "This ‘reversal’ is a shell game. You’re comparing accidental field deaths to industrialized slaughter. Cows in this system are still *bred for death*—their entire existence is coerced. Field mice die as collateral damage; livestock die because we designed a system demanding their corpses. Conflating the two is like comparing traffic fatalities to death camps. Utilitarians reduce morality to math, ignoring that rights create moral firewalls: you don’t get to ‘trade’ intentional violence against innocents for marginal reductions in chaos. Your model also handwaves pasture impacts—what about displaced wildlife? This isn’t ethics; it’s accounting tricks with blood."  

  **Key Notes for Your Sanity:**  
  - The utilitarian reversal is **robust** if:  
    a) Pasture << Cropland in lethality (empirically likely),  
    b) Beef is significantly less cropland-dependent than chicken/tofu (beef at 10-20% of tofu’s cropland use is defensible).  
  - It **collapses** if:  
    a) Pasture expansion destroys high-biodiversity habitats (not in this model),  
    b) Direct livestock emissions/climate harms are added (excluded per your specs).  

  ---  
  **Tight Takeaway:**  
  The utilitarian flips the script by counting hidden field deaths, exposing a tradeoff: less cropland = less collateral harm. The rights theorist calls this a moral category error. The shopper never sees the tradeoff at all. No mice were consulted.
