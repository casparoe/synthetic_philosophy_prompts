prompt: |-
  Ok, I'm putting together a piece on the weird corners of the meat-eating debate, and I need a thought experiment built to order — something I can walk a general reader through without them throwing the magazine across the room.

  The corner I want to poke at is the crop-cultivation thing. You know the move: once you start counting the wild animals — mice, insects, whatever you think counts — that get chewed up or poisoned when a field is harvested or sprayed, the tidy picture where vegan beats chicken beats beef starts to wobble. Chickens eat a lot of grain, grain means cropland, cropland means field deaths; a cow on pasture might mean less cropland per calorie. So someone doing the full utilitarian arithmetic can end up ranking grass-fed beef above chicken, and maybe above some plant foods too — the opposite of what every shopper and most vegans assume.

  I want you to actually construct the case, not just gesture at it. Specs:

  - One ordinary person, one ordinary choice. A dinner, a farm shop, a weekly grocery run. No lab meat, no futurology, no brain-in-a-vat nonsense.
  - Keep the *only* thing that changes between the options the wild-animal toll from how the food is produced. Hold the direct deaths of the animals actually eaten fixed across the options, or set them aside explicitly, and hold taste, price and nutrition fixed as well. I want the reversal to come out of that one variable and nothing else.
  - You can stipulate the numbers as premises — fine, I don't need you to know the real field-mouse-per-hectare figures. What you can't do is stipulate the verdict. The ranking has to fall out of the theories doing their own work.
  - Run it through three views: (a) a total-welfare utilitarian who counts every sentient creature, wild ones included, and weighs suffering and happiness against each other; (b) an animal-rights type who thinks it's wrong to use animals as means no matter what the arithmetic says; (c) the ordinary shopper's gut, which only ever counts the animal on the plate.

  Then the part I actually need. For each of the three, tell me what they conclude and why. Tell me which feature of the case is doing the heavy lifting — if I change that one thing, does the utilitarian's ranking flip back? And steelman whichever view comes out looking worst: what does its defender say to make my little case look like a parlor trick?

  For my own sanity: I'd like the utilitarian reversal to be robust-ish, not hanging on one made-up number. If it only works when the field-death count is set absurdly high, say so and tell me roughly what range it survives. Also I'm definately not interested in you citing studies at me — I want the reasoning, not a bibliography.

  Keep it tight. Scenario in a paragraph or so, then the analysis.
