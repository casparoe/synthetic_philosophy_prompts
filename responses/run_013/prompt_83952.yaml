prompt: |-
  I have no academic training in philosophy, but I have been reading about it on my own for some time, and I have become stuck on the idea that evidence underdetermines theory. A friend of mine who took a term or two of philosophy at university sent me his attempt at a summary, and I cannot tell how much of it to trust. He wrote:

  "Underdetermination of theory by evidence is the thesis, usually credited to Duhem and Quine, that evidence can never decide between competing scientific theories. Because no hypothesis is ever tested on its own, but always together with a whole web of background assumptions, any theory can be made to fit any evidence by adjusting the web somewhere else. As Quine is usually read, any belief at all can be kept, provided you are willing to revise enough elsewhere, and no belief is safe from revision. This is not a practical limitation that more data would cure: two theories can be made to fit all possible evidence, so the choice between them is ultimately a matter of convenience or taste rather than reason. That is why Quine thought we should give up on the idea that our theories are, or are on their way to being, true, and why the sociology of science later took the point to show that what scientists accept is settled by social factors rather than by the evidence."

  My own instinct is that the conclusion is right, and here is the thought that convinced me. Take any theory that scientists currently accept — say, a theory about how some disease works. I can invent a rival: it says everything the accepted theory says about anything anyone could ever observe, but adds that there is also an extra entity at work, one that by stipulation makes no observable difference. The two theories fit exactly the same evidence for ever, so there is nothing to choose between them but taste. If that is right, then the honest thing to say about all our science is that it is one option among many.

  I would like you to audit my friend's summary sentence by sentence. Tell me which parts a philosopher of science would accept as fair, which are the sort of simplification they would wince at, and which are simply wrong, and say where a simplification has hardened into an error rather than just a compression. I would particularly like to know what distinctions I am missing — I suspect there are some — and whether they change anything about his conclusion. Tell me too whether my own example is a case of the kind the thesis is really about, or whether I have smuggled something in. Finally, please say whether the claim about social factors follows from the parts of the summary that survive correction. Please write in British English.
reasoning: |-
  Alright, the user is diving deep into the philosophy of science, specifically the underdetermination of theory by evidence. They're a self-learner without formal training, which means I need to be careful not to assume prior knowledge but also respect their existing understanding. They've hit a wall with this concept and their friend's summary, and they're smartly asking for an audit—not just a yes/no, but a nuanced breakdown. 

  First, their friend's summary: it’s a decent undergraduate-level sketch but has some classic oversimplifications. The user’s instinct aligns with underdetermination, and their disease-theory example is clever but potentially problematic. They’re clearly thoughtful—they recognize their own position might miss distinctions, and they’re wary of "smuggling" in assumptions. That’s a good sign; they’re not just accepting things at face value. 

  Breaking it down:  
  The friend credits Duhem-Quine but flattens their views. Quine never said evidence *never* decides—he’d say it doesn’t *uniquely* decide. And the "web of belief" bit is solid, but the jump to "any belief can be kept" is hyperbolic. Philosophers like Laudan would call that "ambitious underdetermination," which is contentious. The "all possible evidence" claim is also shaky—Quine thought empirical equivalence was possible but rare.  

  Then there’s the sociology of science angle. The user’s friend implies underdetermination forces us to accept social factors as primary, but that’s a non sequitur. Plenty of realists (like Boyd) argue underdetermination is transient or mitigated by other criteria. The user’s own example—adding an unobservable entity—is textbook "empirically equivalent rivals," but philosophers often dismiss those as artificial. Kitcher nails it: they’re not serious competitors because they’re parasitic.  

  Bigger picture: The user seems quietly uneasy about scientific realism. They’re drawn to underdetermination as proof science isn’t "true," but they’re open to pushback. They might benefit from hearing about "contrastive underdetermination" (Hacking) or "methodological underdetermination" (Laudan)—ways the thesis bites without nuking objectivity. Also, the sociology point doesn’t *follow*; it’s one interpretation (à la SSK), but plenty reject it.  

  Key distinctions they’re missing:  
  - Transient vs. permanent underdetermination  
  - Holism vs. global underdetermination  
  - Artificial vs. live rival theories  
  - Underdetermination as challenge vs. death knell for realism  

  Their example isn’t smuggling, but it’s weak—like adding "invisible dragons." Real debates (e.g., Newtonian vs. Einsteinian physics) show underdetermination *can* be resolved. The social factors conclusion? Only if you ignore how science actually weighs evidence, simplicity, fruitfulness, etc.  

  Final note: Their humility is refreshing. They want truth, not confirmation. I’ll stress that underdetermination is real but rarely paralyzing—science navigates it with coherence, pragmatism, and yes, sometimes social factors, but not *only* those.
answer: |-
  Below is a detailed audit of your friend's summary, using British English and addressing your questions point-by-point. I'll distinguish between **fair portrayals**, **simplifications**, **errors**, and **missing distinctions**, then evaluate your example and the sociology claim.

  ---

  ### **Sentence-by-Sentence Audit**

  1. **"Underdetermination of theory by evidence is the thesis, usually credited to Duhem and Quine..."**  
     - **Fair**: Correctly attributes origins. Duhem emphasised *holism* (testing theories requires auxiliary assumptions), while Quine radicalised it (entire "web of belief" faces empirical tests).  
     - **Simplification**: Often omits earlier influences (e.g., Poincaré’s conventionalism). Quine’s version is more extreme than Duhem’s.

  2. **"...that evidence can never decide between competing scientific theories."**  
     - **Overstatement**: Philosophers accept evidence *often* decides in practice. The thesis claims evidence cannot *uniquely determine* a single theory, not that it cannot discriminate *at all*.  
     - **Key distinction**: **Transient** (temporary, resolvable with new evidence) vs. **Permanent** (insoluble even with all possible evidence) underdetermination. Most accept transient; permanent is contentious.

  3. **"Because no hypothesis is ever tested on its own... any theory can be made to fit any evidence by adjusting the web..."**  
     - **Fair**: This captures **Duhem-Quine holism** accurately. Experiments test clusters of hypotheses (e.g., a theory + instrument calibration + data interpretation).  
     - **Simplification**: Not "any evidence" *easily*. Adjusting the web may require absurd or ad hoc modifications (e.g., rejecting well-established laws).

  4. **"As Quine is usually read, any belief at all can be kept... no belief is safe from revision."**  
     - **Fair**: Quine’s "web of belief" allows radical revisions (even logic/mathematics) to preserve a core theory.  
     - **Error**: Quine *did* think some beliefs are pragmatically "central" (e.g., logic) and harder to revise. Not *all* revisions are equally rational.

  5. **"This is not a practical limitation... two theories can be made to fit all possible evidence..."**  
     - **Contentious**: Quine argued for *possible* empirical equivalence, but most philosophers (e.g., Laudan, Kitcher) doubt **permanent underdetermination** exists in real science.  
     - **Missing distinction**: **Empirical equivalence** (same predictions) ≠ **epistemic equivalence** (equal support). Rivals may lack explanatory power, simplicity, or coherence.

  6. **"...the choice between them is ultimately a matter of convenience or taste..."**  
     - **Simplification**: Quine called it "pragmatic" (simplicity, fruitfulness, conservatism), not arbitrary "taste". Scientists use *epistemic virtues* (e.g., parsimony) to justify choices.  
     - **Error**: Ignores that evidence *constrains* choices. Not "anything goes" – a theory predicting unicorns would fail virtues like plausibility.

  7. **"That is why Quine thought we should give up on... our theories being true..."**  
     - **Misleading**: Quine was a **scientific realist** who believed theories approximate truth. He rejected *analytic/synthetic distinctions*, not truth itself. Underdetermination led him to *fallibilism* (theories are tentative), not anti-realism.

  8. **"...why the sociology of science later took the point to show... social factors rather than evidence."**  
     - **Partial truth**: Sociology (e.g., SSK) *did* use underdetermination to argue social factors break evidential ties.  
     - **Error**: This implies underdetermination *entails* sociology’s strong programme. Most philosophers reject this: evidence + virtues ("good reasons") often suffice.

  ---

  ### **Evaluation of Your Example**
  Your disease-theory thought experiment (adding an unobservable entity) is a classic case of **empirically equivalent rivals**. However:
  - **It’s artificial**: In real science, such rivals are rare. Competitors usually make *distinct* predictions (e.g., ether vs. relativity).
  - **It’s parasitic**: Your rival adds nothing explanatory. Philosophers (e.g., Kitcher) argue these aren’t "genuine" theories – they violate **non-ad-hocness** and **explanatory depth**.
  - **Does it prove underdetermination?** Only weakly. It shows *logical possibility*, but science rejects such rivals for *methodological reasons* (e.g., Occam’s razor). Permanent underdetermination requires *live* rivals (e.g., string theory vs. loop quantum gravity).

  ---

  ### **Do Social Factors Follow from Underdetermination?**
  **No.** Underdetermination shows evidence alone may not *uniquely* determine theory choice, but:
  1. **Epistemic virtues** (simplicity, coherence) offer non-arbitrary criteria.
  2. **Pragmatic constraints** (e.g., instrument costs) aren’t purely "social".
  3. Social factors *influence* science, but underdetermination doesn’t prove they *dominate*. Realists argue evidence + virtues often break ties rationally.

  ---

  ### **Conclusion: What Survives Correction?**
  | **Friend’s Claim**          | **Verdict**                                                                 |
  |-----------------------------|-----------------------------------------------------------------------------|
  | Holism (Duhem-Quine thesis) | Fair. Evidence underdetermines theory due to auxiliary assumptions.        |
  | Permanent underdetermination | Overstated. Possible in principle, but rare and contested in practice.     |
  | "Any belief can be saved"   | Simplified. Possible, but revisions must be non-ad-hoc and coherent.       |
  | Choice reduces to "taste"   | Wrong. Pragmatic virtues are reason-based, not arbitrary.                  |
  | Quine as anti-realist       | Misleading. Quine accepted truth as a regulative ideal.                    |
  | Sociology’s strong claim    | Non-sequitur. Underdetermination doesn’t entail social factors are primary. |

  **Your key takeaway**: Underdetermination is a genuine challenge to naive empiricism, but it doesn’t make science "one option among many" in a *meaningful* sense. Competing theories are judged by **explanatory power**, **parsimony**, and **fruitfulness** – not just evidence or social whim. Your instinct about equivalence isn’t wrong, but in practice, science’s methodological toolkit (e.g., rejecting superfluous entities) mitigates the threat.

  ---

  **Further Reading**:  
  - Duhem: *The Aim and Structure of Physical Theory* (for holism).  
  - Quine: "Two Dogmas of Empiricism" (for web of belief).  
  - Stanford: "Underdetermination of Scientific Theory" (SEP entry for nuances).  
  - Kitcher: *The Advancement of Science* (on why parasitic rivals fail).
