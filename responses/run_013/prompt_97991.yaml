prompt: |-
  my reading group keeps using the same move and i want to stress-test it. someone says moral norms are like grammars: every culture has its own rules, you absorb them by immersion, they feel obvious from the inside, and it makes no sense to ask which grammar is 'correct' — so it makes no sense to ask which morality is correct either. they use this to defuse the WEIRD-psych findings (that what we took for universal moral intuitions are parochial) and land on relativism. someone else pushes back that WEIRD morality is more like a prestige dialect that got standardized and exported, so it's less 'correct grammar' than 'the dialect with the army' — which feels like it changes the conclusion but i can't tell if it does.

  can you audit the analogy for me? give me the correspondence table first — what plays the role of the grammar, the native speaker, the universal grammar (if anything does), the prescriptive schoolteacher, the prestige dialect — then tell me where the mapping actually breaks. in particular: is language really the kind of thing that has nothing truth-apt to be right or wrong about, the way morality arguably does? is the variation in the two cases the same kind of variation, or does moral variation track stuff (harm, cooperation, coercion) that grammatical variation doesn't? and if moral norms turn out to have a universal core the way linguistics posits one, does the analogy flip and start supporting objectivity instead? finish by saying whether the relativist conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time.
reasoning: |-
  Okay, the user is part of a reading group where they're using a grammar-morality analogy to argue for moral relativism. They want to stress-test this analogy because someone else brought up WEIRD psychology findings and the prestige dialect point. The user is asking for an audit of the analogy, specifically requesting a correspondence table, points where the mapping breaks, and whether the relativist conclusion holds.

  First, I need to recall the analogy as presented: moral norms are like grammars—cultures have their own, absorbed through immersion, feel obvious internally, and no objective correctness. This is used to counter WEIRD findings that moral intuitions aren't universal. The prestige dialect counterpoint suggests WEIRD morality is dominant due to power, not correctness.

  The user wants a correspondence table. So, mapping out the key elements: grammar rules correspond to moral norms, native speaker to enculturated member, universal grammar to innate moral foundations, prescriptive schoolteacher to moral authorities, prestige dialect to dominant moral systems (like WEIRD). That's the structure.

  Next, where does the analogy break? The main disanalogies are truth-aptness and functional demands. Language isn't truth-apt in the same way morality is. Grammatical rules don't have truth values, but moral statements do (e.g., "slavery is wrong" claims truth). Also, moral norms deal with harm, fairness, cooperation—functional outcomes that affect well-being, whereas grammar variations don't have the same real-world consequences. For example, violating moral norms can cause harm, but grammatical mistakes usually don't.

  Then, the universal core aspect. If morality has a universal core like Chomsky's universal grammar, does that support objectivity? In linguistics, universal grammar explains language acquisition but doesn't imply one grammar is correct. In morality, if there's a universal foundation (like harm avoidance), it might support objectivity if tied to human flourishing. However, the analogy here is weak because universal grammar is about structure, not content, whereas moral foundations might have evaluative content.

  The prestige dialect point. If WEIRD morality is like a dominant dialect enforced by power, does that change the relativist conclusion? In language, prestige dialects aren't objectively better, just socially dominant. Similarly, moral systems imposed by power don't gain objectivity. This actually reinforces relativism by showing dominance ≠ correctness.

  Finally, does the relativist conclusion survive the disanalogies? The analogy might be doing heavy lifting by conflating descriptive and normative aspects. Pointing out truth-aptness and functional demands undermines the analogy. If moral norms must address real-world problems like harm, some systems might be better at promoting well-being, suggesting objectivity. The existence of variation alone doesn't prove relativism; it could be different implementations of universal principles. Without the analogy, the relativist argument loses strength, especially if moral realism can be defended on other grounds (e.g., well-being as objective).

  User's deeper needs: They might be looking for a structured way to challenge the group's reliance on this analogy. They suspect the analogy is flawed and want ammunition to show that moral relativism isn't as supported by the comparison. They might also be interested in whether the WEIRD findings actually support relativism or if there's a better interpretation. Unspoken need: strengthen their counterargument in the reading group discussions, possibly leaning towards moral realism or finding a middle ground.
answer: |-
  Here's a complete audit of the grammar-morality analogy, dissecting its structure, breaking points, and implications for the relativism debate:

  ### Correspondence Table
  | **Linguistic Concept**       | **Alleged Moral Analog**            | **Notes** |
  | :--------------------------- | :---------------------------------- | :-------- |
  | **Grammar Rules**            | Moral Norms/Taboos                 | Specific cultural prescriptions (e.g., word order vs. incest prohibitions). |
  | **Native Speaker**           | Enculturated Moral Agent            | Someone who intuitively "feels" the norms through socialization. |
  | **Descriptive Grammar**      | Observed Moral Practices            | What people *actually* do/condemn. |
  | **Prescriptive Grammar**     | Idealized Moral Codes               | What authorities *say* people should do (e.g., religious texts, philosophy). |
  | **Universal Grammar (UG)**   | Innate Moral Foundations (e.g., Haidt's 5 Foundations) | Biologically constrained capacities enabling acquisition. |
  | **Prestige Dialect**         | Dominant Moral System (e.g., WEIRD) | The normset backed by power/institutions (e.g., liberal individualism). |
  | **Prescriptive Schoolteacher** | Moral Authorities (e.g., priests, philosophers) | Enforcers of "correct" norms. |
  | **Mutual Intelligibility**   | Cross-Cultural Moral Compromise     | Minimal shared norms for coexistence. |

  ### Where the Mapping Breaks (Key Disanalogies)
  1.  **Truth-Aptness & Justification:**
      *   **Language:** Grammaticality judgments ("Is this sentence well-formed?") are **descriptive** and **non-truth-apt**. Asking if English grammar is "correct" vs. Japanese grammar is nonsensical – they're different systems enabling communication. Correctness is internal coherence within the system.
      *   **Morality:** Moral judgments ("Is slavery wrong?") are inherently **prescriptive**, **evaluative**, and **truth-apt** (or at least claim to be). They aim at justifying actions/condemnations based on reasons (harm, fairness, rights). We *demand* justification for moral norms in a way we don't for grammar. This is the core fracture.

  2.  **Functional Demands & Consequences:**
      *   **Language:** Core function is **communication**. Grammatical variation rarely causes inherent harm/disruption *outside* of communication failures. SVO vs. SOV order doesn't inherently "hurt" anyone.
      *   **Morality:** Core functions involve **regarding behavior, preventing harm, enabling cooperation, resolving conflict**. Moral variations *directly* impact well-being, suffering, justice, and social stability. Norms permitting slavery, infanticide, or extreme inequality have profound, measurable consequences absent in grammatical differences. Morality tracks **functional outcomes** grammar doesn't.

  3.  **The Nature of Variation:**
      *   **Language:** Variation is largely **arbitrary and neutral** regarding core function (communication). There's no inherent reason why "dog" means *canis familiaris*.
      *   **Morality:** Variation often correlates with **material conditions, power structures, and adaptive challenges**. Norms around property, gender roles, or hierarchy frequently reflect ecological pressures or social organization, not pure arbitrariness. Harm-based norms show more cross-cultural consistency than purity or authority norms.

  4.  **"Universal Core" Implications:**
      *   **UG in Language:** Supports the *possibility* of acquiring any human language but implies **no evaluative hierarchy** between grammars. UG explains *how* we learn language, not *which* language is "better."
      *   **Universal Moral Foundations:** If proven (e.g., innate templates for harm, fairness, loyalty), this *could* support **objectivity** if these foundations are linked to fundamental human needs/flourishing. For example, if "harm avoidance" is foundational, norms minimizing *unjustified* harm might be objectively preferable. **This flips the analogy:** Instead of supporting relativism, universal foundations + functional demands could ground cross-cultural moral critique (e.g., condemning slavery because it inherently violates harm/fairness foundations).

  5.  **The "Prestige Dialect" Point:**
      *   This strengthens the *anti-objectivist* case within the analogy itself. It highlights that the dominance of WEIRD norms (individual rights, autonomy) might reflect historical power (colonialism, economic hegemony) and institutional enforcement, not inherent superiority or universal correctness – just like RP English or Parisian French. **It doesn't change the *relativist* conclusion derived *from the analogy*, it deepens it by adding a power dynamic.** It says: "Even if some morals *seem* universal or 'correct,' it might just be dominance, not truth."

  ### Does the Relativist Conclusion Survive?
  **Likely not in its strong form, once the disanalogies are clear. The analogy was doing heavy lifting.** Here's why:

  1.  **Truth-Aptness Undermines the Core:** The analogy smuggles in the idea that because grammar isn't truth-apt, morality isn't either. But moral claims *demand* to be truth-apt and justified by reasons (harm, fairness, well-being) in a way grammar doesn't. We can't simply shrug at moral differences like we do at grammatical ones.
  2.  **Functional Demands Introduce Objectivity:** The real-world consequences of moral norms (impact on well-being, cooperation, suffering) create a potential **functional standard** for evaluation absent in grammar. A moral system that systematically causes unnecessary suffering or undermines social cooperation can be *objectively worse* than one that doesn't, based on observable outcomes linked to human (and even sentient) flourishing. Grammar lacks this evaluative dimension.
  3.  **Variation Isn't the Death Knell for Objectivity:** Variation in specific norms doesn't preclude universal principles *or* functional evaluation. Cultures solve similar problems (distributing resources, raising children) in different ways, constrained by circumstance. Some solutions may be objectively better/worse at achieving shared goals (stability, minimal suffering) given the context. Grammatical variation solves the same core problem (communication) equally well via different arbitrary paths; moral variation often addresses the same core problems with solutions of varying effectiveness/harmfulness.
  4.  **Universal Foundations *Could* Support Objectivity:** If deep structures exist, they provide a shared basis for critique, moving beyond "just different grammars."

  **Conclusion:** The grammar analogy is initially seductive for descriptivism and relativism because it highlights **social learning, intuitive feel, and variation.** However, it **fails catastrophically** at capturing the **prescriptive, truth-apt, reason-demanding, and consequence-laden nature of morality.** The "prestige dialect" point reinforces the *cultural contingency* argument but doesn't save the core analogy. Once the disanalogies (especially truth-aptness and functional consequences) are exposed, the argument for strong relativism based *solely* on this analogy collapses. It might support **moderate relativism** (context matters, be humble about universalizing WEIRD norms) or **pluralism**, but not the strong claim that "it makes no sense to ask which morality is correct." The analogy was indeed carrying the relativist conclusion by masking the crucial differences that make moral evaluation possible and necessary. The WEIRD findings challenge *naive universalism*, but they don't automatically land us in pure relativism – they might instead push us towards a more nuanced search for objective foundations *through* the variation, informed by functional human needs.
