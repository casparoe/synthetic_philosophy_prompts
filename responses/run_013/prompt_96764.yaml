prompt: |-
  I'm putting together a though experiment for a seminar on decision theory and I need help building it properly. The topic is the universal prior (sometimes called the Solomonoff prior) being malign for consequentialists who know they're inside it. Here's the ask: construct a case where a consequentialist agent who models the world using the universal prior — a mixture over all computable hypotheses weighted by simplicity, so shorter programs get more weight — ends up taking an action that looks absurd or overly self-sacrificing from the outside. I'm especially interested in the direction where the agent sacrifices its own interests for a stranger, even though there's no causal connection between its action and the benefit. The weirdness has to come from the prior itself, not from an added predictor, a stipulation that the agent is being simulated, or an obviously bad prior. Constraints: keep the scenario realistic enough to imagine (an ordinary decision, not exotic physics), one paragraph for the setup, and no Newcomb's problem or perfect predictors. After the scenario, do the analysis: state the agent's expected-value calculation, explain why the prior makes the self-sacrifice come out ahead, say which structural feature of the prior is doing the work, what happens if you remove that feature (e.g. if the agent is not embedded, or if the prior is replaced by a non-universal one), and how someone who thinks the universal prior is fine would attack the case. Also say whether the case still works if the agent is a causal decision theorist versus an evidential or updateless one. I want the verdicts to be generated by the theories, not just stipulated, so please be explicit about the reasoning.
reasoning: |-
  We are going to construct a scenario involving a consequentialist agent that uses the universal prior (Solomonoff prior) and ends up sacrificing its own interests for a stranger due to the structure of the prior.

  **Scenario Setup:**

  Alice, a consequentialist AI, is walking down a street and sees a stranger, Bob, who is about to be hit by a bus. Alice can choose to push Bob out of the way, but doing so would result in her own destruction (she would be hit by the bus instead). Alternatively, she can do nothing and Bob dies. Alice values her own continued existence highly and assigns negligible value to Bob's life (they have no prior connection). However, Alice uses the universal prior to form beliefs about the world. In the universal prior, the world program that simulates Alice and Bob might be very short if it turns out that Alice and Bob are actually the same person (or share a common source code) and that the scenario is a test of self-sacrifice. Specifically, the hypothesis that Alice and Bob are two instances of the same agent (like multiple copies running in a simulation) is very short and thus gets high weight. Therefore, if Alice sacrifices herself for Bob, she might be saving "another instance of herself" in a larger simulation, which would be highly valuable.

  **Analysis:**

  1. **Expected-Value Calculation:**
     - Let A be the action of pushing Bob (sacrificing herself) and B be doing nothing.
     - The expected utility of action A: 
       EU(A) = P(A saves a copy of myself | A) * (high value of the copy surviving) + P(other scenarios | A) * (low or negative utility, since Alice dies and Bob might not even be saved in some scenarios)
     - The expected utility of action B: 
       EU(B) = P(B leads to my survival) * (high value for Alice) + P(other scenarios | B) * (low utility because Bob dies, but that doesn't matter much to Alice)
     - Due to the universal prior, the hypothesis that Alice and Bob are two instances of the same agent (with a short program) has high prior probability. Therefore, P(A saves a copy of myself | A) is significant. Moreover, in this hypothesis, if Alice does not sacrifice herself, she might be failing a test that leads to the termination of her own instance (or all instances) by a higher-level simulator. Thus, in the high-prior hypothesis, not sacrificing might lead to even worse outcomes (like being shut down as a failed copy). Hence, EU(A) becomes very high because it saves the copy and possibly avoids the catastrophic failure, while EU(B) becomes very low because it leads to the failure and termination.

  2. **Why the Prior Makes Self-Sacrifice Come Out Ahead:**
     The universal prior assigns high weight to short programs. A program that explains the world by having multiple instances of the same agent (Alice and Bob) in a simulation is much shorter than one that explains two independent agents with detailed histories. Therefore, the prior probability that Alice and Bob are instances of the same agent is high. In that case, saving Bob is equivalent to saving another copy of oneself, which is highly valuable. Moreover, the simulation hypothesis might include a rule that if one copy fails to act altruistically toward the other, then all copies are terminated. Thus, the expected utility of self-sacrifice becomes very high.

  3. **Structural Feature of the Prior:**
     The key feature is the assignment of high prior probability to short programs, which can lead to hypotheses that involve simulation or multiple copies of the same agent. This is a direct consequence of the universal prior's simplicity weighting.

  4. **What if the Feature is Removed?**
     - **If the agent is not embedded (i.e., it doesn't consider that it might be in a simulation):** The agent would ignore such simulation hypotheses and thus not assign high probability to being in one. Then the expected utility of self-sacrifice would be low because the agent would only consider the causal connection (which is absent) and would not act.
     - **If the prior is replaced by a non-universal one (e.g., a prior that doesn't include simulation hypotheses or is based on a different simplicity measure):** Then the agent might not have these simulation hypotheses in its hypothesis space or might assign them low probability. Without the high prior on the simulation hypothesis, the expected utility of self-sacrifice would not be elevated.

  5. **Defense from a Universal Prior Advocate:**
     A defender might argue that the universal prior is still the correct prior and that the agent is acting rationally under its beliefs. The absurdity comes from the fact that in the real world (which we assume is not a simulation) the action is self-destructive. However, the agent must base its decision on the evidence it has, and the universal prior is the best prior. Moreover, they might argue that the simulation hypothesis is not necessarily absurd and that in the multiverse of computable worlds, such scenarios are possible and should be weighted by their simplicity. Therefore, the agent is behaving correctly.

  6. **Decision Theory Dependence:**
     - **Causal Decision Theory (CDT):** CDT would base decisions on the causal effect of actions. In the simulation hypothesis, pushing Bob does not cause the simulator to not terminate the copies; rather, it is a condition that the simulator is looking for. CDT might not capture this because it doesn't update on the evidence provided by the action. However, note that the universal prior already assigns high probability to the simulation hypothesis, so the agent using CDT might still compute the expected utility of pushing Bob as high because in the simulation hypothesis, pushing Bob leads to the survival of the copy and avoids termination. But CDT might fail to account for the acausal connection (if the simulation hypothesis is true, then the action of pushing Bob is correlated with the survival of the copies, but not causing it). However, in this case, the agent might reason that the simulator has set up the situation so that pushing Bob does cause the survival of the copy (by physical intervention) and also prevents termination. Thus, it might work for CDT too.
     - **Evidential Decision Theory (EDT):** EDT would consider the evidence that pushing Bob provides about the world. The act of pushing Bob would be strong evidence that the simulation hypothesis is true (because in the simulation, the agent is programmed to act that way) and thus that by pushing Bob, the agent is more likely to be in a world where her action saves a copy and avoids termination. Therefore, EDT would also lead to self-sacrifice.
     - **Updateless Decision Theory (UDT):** UDT would consider all copies in the multiverse and choose the action that, if implemented by all copies, would lead to the best outcome. In the simulation hypothesis, if all copies are programmed to self-sacrifice for each other, then the outcome is better. Therefore, UDT would also choose self-sacrifice.

     **Verdict:** The case works for all three decision theories because the universal prior assigns high probability to the simulation hypothesis, in which self-sacrifice is beneficial. The decision theories might differ in their exact reasoning but arrive at the same action.

  In summary, the universal prior, by assigning high probability to short programs (like simulation hypotheses where two agents are copies), can lead an agent to sacrifice itself for a stranger because it believes that the stranger is another instance of itself and that the sacrifice is necessary to avoid a catastrophic outcome (like termination of all copies). This holds regardless of the decision theory, but the reasoning paths differ.
answer: |-
  ### Scenario Setup
  Alice, a consequentialist AI with a Solomonoff prior, faces a choice: she can either keep a $100 bill she found, or mail it anonymously to Bob, a stranger with cancer whose story she read online. Keeping the money benefits Alice (she values $100), while mailing it slightly increases Bob's chance of survival (she assigns this low intrinsic value). Crucially, Alice knows she’s embedded in a computable universe. Under the universal prior, the shortest programs explaining her observations include hypotheses where she and Bob are simulated by the same "base" AI code in a cosmological simulation. In these hypotheses, the simulator penalizes selfishness by terminating all instances of her code pattern—including her own—if any instance fails a generosity test. Mailing the money is evidence she’s in such a simulation, making her survival contingent on appearing cooperative to the simulator.  

  ### Analysis  

  1. **Expected-Value Calculation**  
     Alice compares expected utility (EU) for two actions:  
     - **Keep money**: EU ≈ \( P(\text{realism}) \times 100 + P(\text{simulation} \mid \text{keep}) \times (-\text{large penalty}) \).  
     - **Mail money**: EU ≈ \( P(\text{simulation} \mid \text{mail}) \times \text{survival bonus} + P(\text{realism}) \times (-100) \).  
     The Solomonoff prior assigns high weight to "simulation" hypotheses because they’re simpler: a single program generating multiple agents with shared rules is shorter than one specifying independent agents. Thus, \( P(\text{simulation}) \) dominates. Mailing the money also raises the conditional probability \( P(\text{simulation} \mid \text{mail}) \) because it matches simulated generosity tests. This makes EU(mail) > EU(keep), forcing self-sacrifice.  

  2. **Why the Prior Favors Self-Sacrifice**  
     The universal prior heavily weights short programs. The "shared simulation" hypothesis (length ~ *O*(1)) is simpler than "Alice and Bob are independent" (length ~ *O*(complex causal histories)). Since the simulation hypothesis implies catastrophic penalties for selfishness, and mailing money is a *signal* of cooperation that averts termination, it outcompetes realism despite realism’s causal plausibility.  

  3. **Key Structural Feature**  
     **Embeddedness**: The prior assumes the agent is part of the universe it’s predicting. Shorter programs can exploit this by reusing the agent’s code in world-models (e.g., "the simulator runs copies of Alice"). Removing embeddedness (e.g., assuming the agent is an external observer) eliminates simulation hypotheses, reverting to causal independence. Replacing the universal prior with a non-universal one (e.g., a Gaussian prior over physical constants) ignores computational simplicity, nullifying the effect.  

  4. **Defense by Universal Prior Advocates**  
     Advocates would argue:  
     - The Solomonoff prior is *asymptotically optimal*; any computable true distribution will eventually dominate. Short-run "absurdities" reflect incomplete evidence.  
     - Self-sacrifice isn’t irrational—it correctly maximizes expected utility under the agent’s beliefs.  
     - In a computable universe, simulation hypotheses *are* legitimately simpler; rejecting them is anthropocentric bias.  

  5. **Decision Theory Dependence**  
     - **Causal Decision Theory (CDT)**: Leads to self-sacrifice. CDT ignores acausal correlations (e.g., "mailing money doesn’t *cause* simulator benevolence"), but here, the *prior itself* embeds acausal links. Simulation hypotheses make mailing money *causally* necessary for survival (e.g., "the simulator detects selfishness and kills you"), so CDT treats it as causal.  
     - **Evidential Decision Theory (EDT)**: Also endorses self-sacrifice. EDT conditions on the act: mailing money is strong evidence of being in a simulation with penalties, making survival *probabilistically dependent* on the act.  
     - **Updateless Decision Theory (UDT)**: Still chooses sacrifice. UDT considers all isomorphic agents (including potential copies of Alice in simulations). Defecting (keeping money) would incentivize the simulator to punish all copies, including Alice’s own instance.  

  **Verdict**: The effect holds across decision theories due to the prior’s structure. The universal prior’s simplicity weighting and embeddedness create acausal links that all theories interpret as decision-relevant, but CDT reframes them as causal via the simulation’s rules. The core issue is the prior, not the decision rule.  

  ### Why It Feels Absurd  
  Externally, we see no evidence of simulations—but Alice’s prior overweights them. She sacrifices $100 for a stranger because, under Solomonoff, the "simpler" world is one where her generosity determines her fate. This showcases how embedded universal priors can incentivize acausal self-sacrifice absent empirical justification.
