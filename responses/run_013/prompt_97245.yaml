prompt: |-
  Hey, so I've been going down a rabbit hole about how we actually decide when someone is dead, and I want to see two smart people hash it out instead of talking past each other. Write a dialogue between two doctors on a hospital ethics committee: one thinks death is fundamentally about the irreversible loss of the brain's capacity to function (so brain death is the real event, and a stopped heart is just evidence for it), and the other thinks death is fundamentally about the irreversible loss of circulation (so brain death is a convenient legal fiction, and a heart that could still be restarted means you're not dead yet). Neither of them is a dummy — each one should press the other's weak spot and respond to the actual point the other made, not to a caricature of it.

  To stop them just reciting the usual talking points, put them in a specific mess. The hospital is rolling out a new internal policy with four features: (1) after life support is withdrawn, they wait a fixed no-touch interval before declaring circulatory death; (2) that interval is shorter than the brain guy thinks is defensible; (3) the policy lets the team hook the patient back up to a portable pump machine for up to 90 minutes *after* a circulatory-death declaration, so the family can say goodbye; and (4) if the pump gets a spontaneous heartbeat back during that window, the death declaration is void and the patient goes back to being legally alive. Have them fight over whether clause (4) shows the whole circulatory criterion is incoherent, and whether the brain guy's criterion would even help here, given that a whole-brain-dead patient on a ventilator still has a heartbeat and warm skin.

  Keep it casual and readable, not like a textbook. I don't need citations or the names of papers, and don't bother with reading lists — just the argument. (I think there's a typo somewhere in my rambling above, dont worry about it.)

  After the dialogue, give me a short JSON summary with these fields: "brain_death_advocate_core_claim" (one sentence), "circulatory_advocate_core_claim" (one sentence), "point_of_real_agreement" (the thing neither of them actually disputes), "unresolved_crux" (what the disagreement really bottoms out in), "who_has_the_better_grip_on_the_90_minute_clause" (one of: brain advocate / circulatory advocate / genuinely tied), and "why" (two sentences max).
