  We are building a quiz to sort people into different philosophical positions regarding how "knowledge" depends on context. The positions we are considering:

  1. **Invariantism**: The truth conditions of knowledge attributions do not shift with context. What it takes to know is fixed and depends only on the subject's evidence and the facts of the world.

  2. **Contextualism**: The truth conditions of knowledge attributions shift with the context of the speaker (the person making the knowledge attribution). What counts as "knowing" depends on the speaker's conversational context, including the stakes and what alternatives are salient.

  3. **Subject-Sensitive Invariantism (SSI) / Interest-Relative Invariantism**: The truth conditions of knowledge attributions are fixed by the subject's context (the person who is said to know or not know). The subject's stakes and practical interests determine what they know.

  4. **Assessment-Sensitive View (Relativism)**: The truth conditions of knowledge attributions are relative to the assessor (the person evaluating the knowledge claim, which might be at a different time or place). So, the same claim might be true when assessed by one person and false when assessed by another.

  5. **Pragmatic Encroachment**: This is similar to SSI, but it emphasizes that practical factors (stakes) can affect whether a true belief counts as knowledge, without changing the semantic meaning of "knows". However, we'll note that SSI is a form of pragmatic encroachment. We might also include a distinction between views that focus on the subject's stakes and those that focus on the speaker's.

  6. **Warranted Assertibility Maneuver (WAM)**: The truth conditions of knowledge attributions are invariant, but the practical factors affect whether it is appropriate to assert that someone knows. So, in high-stakes situations, we might deny knowledge not because it's false but because it would be misleading or irresponsible to assert it.

  We'll design nine questions (scenarios) with multiple-choice answers. Each scenario will target a particular distinction. We'll then map patterns of answers to the positions.

  The scenarios:

  1. **High/Low Stakes for the Subject (using your epi-pen example)**  
     - Low stakes: Just answering a question about the epi-pen location.  
     - High stakes: When the brother is having a reaction and the subject must act.  
     *Objective: To see if the knowledge attribution changes when the subject's stakes change, holding evidence constant.*

  2. **Speaker's Stakes vs. Subject's Stakes**  
     - The subject is in a low-stakes situation and is calm, but the speaker has a lot riding on it.  
     *Objective: To distinguish contextualism (speaker's context) from SSI (subject's context).*

  3. **Assessment-Sensitivity (Priya's idea)**  
     - A week later, someone watches a video of the original claim and judges it.  
     *Objective: To test relativism (assessment-sensitive).*

  4. **Raising the Bar vs. Adding New Alternatives (Part 1: Already Checked)**  
     - High stakes, but the scary possibility is something the subject had already ruled out.  
     *Objective: To see if the subject must re-check even when they previously ruled it out?*

  5. **Raising the Bar vs. Adding New Alternatives (Part 2: Newly Relevant)**  
     - High stakes, and the scary possibility is brand new and only just became relevant.  
     *Objective: To see if the subject must rule out new alternatives that become salient.*

  6. **Knowing vs. Acting**  
     - The subject genuinely knows (by low standards) but it would be wrong for them to act on it in a high-stakes situation.  
     *Objective: To see if they allow that one can know but still not be justified in acting.*

  7. **Stakes Increase After Belief Formation**  
     - The subject forms a belief in a low-stakes situation, then the stakes go up (without any change in evidence).  
     *Objective: To see if knowledge is lost retroactively or if it was never there.*

  8. **Third-Party Attribution with Differing Stakes**  
     - A third party (with low stakes) attributes knowledge to a subject who is in a high-stakes situation.  
     *Objective: To further distinguish contextualism (speaker's context) from SSI (subject's context).*

  9. **Multiple Assessors**  
     - Two people with different stakes assess the same knowledge claim (by a third party) at the same time.  
     *Objective: To test relativism (assessment-sensitive) and contextualism.*

