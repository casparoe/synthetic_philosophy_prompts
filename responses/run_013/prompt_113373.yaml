  But the finite-sample issue keeps nagging me. With small data, that O(1) constant between coding schemes could actually determine which model "wins" the audit. That feels arbitrary - like the ranking depends on the auditor's choice of Turing machine. Not very scientific.

  Hmm... I recall Kolmogorov himself struggled with similar issues. The complexity audit seems philosophically aligned with Ray Solomonoff's induction theory, but the practical implementation has these gnarly edge cases. Maybe the funder should add: "differences below threshold X are considered ties" or something? Though that feels like sweeping the problem under the rug.

