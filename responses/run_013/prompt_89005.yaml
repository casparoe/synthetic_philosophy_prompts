answer: |-
  Below is a concise decision tree designed as a one-page flowchart for your reading group. It starts from empirical cases and conceptual commitments, forcing students to confront what they mean by "consciousness" and how different theories handle gaps. The tree has **12 nodes** and **8 leaves**, with theory names only appearing at the leaves. Unoccupied combinations are marked and explained, and key cases (Sperling, blindsight, etc.) are integrated into the nodes.  

  ### **Consciousness Theory Decision Tree**  
  *(Start at Node 1. Answer based on cases/concepts, not pre-existing theory knowledge.)*  

  ---

  **Node 1: When someone calls a state "conscious," what is the MOST central feature?**  
  - **A:** The subject can *report* it (verbally or via clear behavioral indicators).  
  - **B:** The state is *available to guide thought/action* (e.g., decision-making, even without report).  
  - **C:** There is *something it’s like* to undergo it (phenomenal quality).  

  **Node 2 (from A, B, or C): In Sperling’s partial-report task, subjects feel they see all letters but report only a subset. Why?**  
  - **A:** Phenomenal consciousness overflows access (they experience more than they can report/use).  
  - **B:** Access overflows report (all letters are available for guidance, but report is bottlenecked).  
  - **C:** No overflow—the "richness" is illusory or post-hoc.  

  **Node 3 (from 2A): Does the same neural mechanism explain BOTH access and phenomenal consciousness?**  
  - **Yes:** → Node 4  
  - **No:** → Node 5  

  **Node 4 (from 3 Yes): Can phenomenal consciousness be present WITHOUT access (e.g., in dreams)?**  
  - **Yes:** → **Leaf: Global workspace as access-only (residue unexplained)**  
    *(e.g., Block: GW explains access, but phenomenality is separate and unexplained)*  
  - **No:** → **Leaf: Global workspace as full theory**  
    *(e.g., Dehaene: GW neural broadcasting explains both access and phenomenality)*  

  **Node 5 (from 3 No): In blindsight, can patients guide actions (e.g., avoid obstacles) without awareness?**  
  - **Yes:** → Node 6  
  - **No:** → Node 7  

  **Node 6 (from 5 Yes): Is attention NECESSARY for phenomenality? (Consider inattentional blindness vs. gist studies)**  
  - **Yes:** → **Leaf: Higher-order theories**  
    *(e.g., Rosenthal: Consciousness requires metacognitive access/reportability)*  
  - **No:** → **Leaf: Local recurrence views**  
    *(e.g., Lamme: Recurrent processing in sensory areas suffices for phenomenality, even without attention)*  

  **Node 7 (from 5 No): Are phenomenal properties (e.g., colors, sounds) fundamental or illusory?**  
  - **Fundamental:** → **Leaf: Panpsychism/neutral monism**  
    *(e.g., Chalmers/Goff: Phenomenality is basic in nature)*  
  - **Illusory:** → **Leaf: Illusionism**  
    *(e.g., Frankish: Phenomenality is a cognitive construct, not a real property)*  

  **Node 8 (from 2B): In no-report paradigms (e.g., binocular rivalry), is unreported neural activity conscious?**  
  - **Yes:** → **Leaf: Global workspace as full theory**  
    *(Access-for-guidance suffices for consciousness; report is incidental)*  
  - **No:** → **Leaf: Global workspace as access-only (residue unexplained)**  
    *(Guidance ≠ consciousness; unreported activity is access without phenomenality)*  

  **Node 9 (from 2C): In the "feeling" of rich peripheral vision, is phenomenality always accurate?**  
  - **Yes:** → Node 10  
  - **No:** → Node 11  

  **Node 10 (from 9 Yes): Does consciousness require global availability?**  
  - **Yes:** → **Leaf: Global workspace as full theory**  
    *(Phenomenality arises from global access; inaccuracy is noise)*  
  - **No:** → **Leaf: Local recurrence views**  
    *(Phenomenality is local and rich; inaccuracy is a memory failure)*  

  **Node 11 (from 9 No): Is phenomenality an irreducible property?**  
  - **Yes:** → **Leaf: Panpsychism/neutral monism**  
  - **No:** → **Leaf: Illusionism**  

  **Node 12 (from 1C directly, if skipped earlier): For awareness without attention (e.g., gist), is phenomenality present?**  
  - **Yes:** → **Leaf: Local recurrence views**  
  - **No:** → **Leaf: Higher-order theories**  

  ---

  ### **Key to Leaves**  
  - **Global workspace as full theory**: Explains both access and phenomenality (e.g., Dehaene, Baars).  
  - **Global workspace as access-only**: Explains access, leaves phenomenality as residue (e.g., Block).  
  - **Higher-order theories**: Consciousness requires metacognitive access (e.g., Rosenthal, Lau).  
  - **Local recurrence views**: Phenomenality from sensory feedback loops, not global access (e.g., Lamme).  
  - **Illusionism**: Phenomenality is a cognitive illusion (e.g., Frankish, Dennett).  
  - **Panpsychism/neutral monism**: Phenomenality is fundamental/universal (e.g., Chalmers, Goff).  

  ---

  ### **Unoccupied Combinations & Gaps**  
  1. **"Access-for-guidance-only" as a full theory (Node 8 Yes)**:  
     - **Status**: Occupied (GW full theory). Your branch lands here naturally. It’s a coherent and popular view (e.g., Dehaene’s "global neuronal workspace" treats access-for-guidance as sufficient for consciousness).  

  2. **Phenomenality without ANY access (e.g., Node 4 Yes)**:  
     - **Status**: Unoccupied. *Why?* Incoherent—most agree minimal access (e.g., for dreaming) is needed to *have* an experience.  

  3. **Illusionism + local recurrence (Node 11 No → Illusionism)**:  
     - **Status**: Unoccupied. *Why?* Incoherent—local recurrence asserts real phenomenality; illusionism denies it.  

  4. **Higher-order + no-attention phenomenality (Node 6 No → Local recurrence)**:  
     - **Status**: Separated cleanly. Higher-order theories (Node 6 Yes) require attention/metacognition.  

  ---

  ### **Design Notes**  
  - **Cases integrated**:  
    - Sperling (Nodes 2, 8, 10), blindsight (Node 5), no-report paradigms (Node 8), inattentional blindness/gist (Node 6), peripheral richness (Node 9), dreaming (Node 4), attention/awareness dissociations (Nodes 6, 12).  
  - **Your requested branch (access-for-guidance vs. report)**: Explicitly in Node 2B and Node 8. It lands cleanly in GW full theory or GW access-only.  
  - **Indistinguishable leaves**: None—all theories are separated.  
  - **Why no citations?**: You’ll add context-specific references (e.g., Sperling 1960, Lau & Rosenthal 2011).  
  - **Flow logic**: Branches first isolate commitments (e.g., "is phenomenality reducible?"), *then* assign theories. Empty slots arise from contradictions (e.g., phenomenality without access).  

  This tree forces students to confront *why* disagreements about GW theory arise (e.g., Node 2 splits "overflow" interpretations, leading to residue vs. full-GW leaves). Print as a flowchart for your handout!
