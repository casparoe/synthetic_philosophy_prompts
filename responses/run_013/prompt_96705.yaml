prompt: |-
  I would like you to tell me whether the following pattern has an established name, and if it does not, whether it deserves one and how it should be defined.

  I keep running into the same shape in unrelated places, and I have not been able to match it cleanly to anything I already know. Two instances will make the shape clearer than an abstract statement would.

  The first is a scientific field I have followed for some years. Slow, careful work — long replications, honestly reported negative results, modest claims — is steadily outcompeted by fast work that cuts methodological corners and reports more striking findings. Each individual decision is defensible on its own, and no one is breaking an agreement, because there never was one to begin with. Over time the corners become ordinary, the journals and hiring committees adjust to the faster tempo, and the field's shared sense of what counts as a solid result quietly loosens. What strikes me most is what happens to the people. Those who remain and rise are increasingly the ones who are temperamentally untroubled by the looser standard, so that after a decade the field could not restore the old standard by vote even if the question were put to it, because the people who would have voted for it have been filtered out.

  The second is the attention economy of a large online platform. Creators who want to make restrained, careful work find that it is outcompeted by creators who optimize hard for engagement, and each round of optimization raises the audience's threshold for what registers as engaging at all. The creators who survive are the ones willing to go further; the ones who disliked the direction leave, and the culture of the platform's successful creators drifts toward the very dispositions that keep the competition running.

  Several features seem to me to be doing the work, and none of the familiar stories I know quite accommodates all of them at once. First, there is no defection: nothing is violated because nothing was agreed. Second, what gets used up is not really a fixed stock of some rivalrous good but a shared standard or norm, and the competition degrades the standard itself, so there is no external yardstick by which to say how far down we have gone — the measure moves with the race. Third, the competition does not merely lock everyone into a bad equilibrium that they would collectively prefer to escape; it also changes who the participants are, selecting for people whose preferences make the equilibrium self-sustaining. Fourth, and consequently, the obvious remedy — getting everyone to agree to stop — is undermined in advance, since the constituency that would have to agree has been replaced by one that would not.

  I am aware of the usual examples of individually sensible choices adding up to a collectively bad result, and of the general idea that competition can leave everyone worse off than they would be under coordination. But those accounts seem to assume a fixed preference over outcomes and a fixed thing being consumed, whereas the pattern I am describing seems to turn on the standard being consumed and the participants' preferences both shifting under the competition.

  What I want is not a bare label. If an established concept covers this, I want to know which parts of my description it captures and which it leaves out, how it differs from its nearest neighbors, and which of those neighbors fits best. If nothing established fits, I want you to propose a term and define it, and then draw its boundaries: what would count as an instance, what would look similar but not qualify, and where the edges of the concept fall.

  Please answer in American English.
reasoning: |-
  Okay, the user has described a pattern they've observed in two different contexts: scientific research and online content creation. They want to know if this pattern has an established name, and if not, whether it deserves one and how it should be defined. Let me start by breaking down their description.

  First, in both examples, there's a gradual degradation of standards. In science, careful work gets outcompeted by faster, corner-cutting methods. Online, restrained creators lose to those optimizing for engagement. Key elements: no explicit defection because there was no agreement to begin with. The competition itself erodes the standards, which are shared norms, not fixed resources. Also, the participants change over time—those uncomfortable with lower standards leave, leaving only those who thrive in the new environment. This makes reversing the trend impossible because the people who would support higher standards are gone.

  Now, I need to recall related concepts. Tragedy of the commons comes to mind, but that usually involves depleting a rivalrous resource, not a norm. Race to the bottom? That's about lowering standards to compete, but it typically assumes static preferences and doesn't address participant selection. Adverse selection might apply, but it's more about information asymmetry leading to poor choices, not dynamic norm erosion. Evolutionary traps? That's biological, not social. Gresham's law is about bad money driving out good, but again, static preferences.

  The user emphasizes the dynamic shift in both standards and participants. The evolving norms and the selection effect seem crucial. The existing terms don't capture this dual dynamic. So maybe a new term is needed. What could convey both the degradation and the demographic shift? "Norm erosion" is part of it, but not comprehensive. "Selection-mediated norm degradation"? Too academic. "Preference-shifting competitive degradation"? Still clunky. 

  The user mentioned the lack of an external yardstick because the measure itself changes. That's important. Also, the remedy fails because the group now prefers the new norm. So the concept must include: competition, eroding standards, demographic filtering, and irreversible preference shifts. 

  Combining these, "Competitive Preference-Consistent Degradation" (CPCD) might work. "Preference-consistent" because the new norms align with the remaining participants' preferences. "Degradation" captures the decline. But is there a better term? "Adaptive degradation"? Hmm. Maybe "Evolutionary Degradation" but that's too biological. 

  Need to define boundaries. Instances would require competition without coordination, erosion of norms (not resources), demographic filtering leading to preference shifts. Counterexamples: if standards are fixed (like safety regulations being ignored), that's a race to the bottom. If participants don't change, it's just a bad equilibrium without the irreversible shift. 

  The user probably wants to apply this concept to other areas, maybe policy or organizational behavior. They might be an academic or researcher looking to formalize this pattern. Their deeper need is to have a framework to analyze similar situations and possibly find interventions. Since existing terms fall short, coining a new term makes sense. They also want clear differentiation from similar concepts to avoid confusion. 

  So the core elements are: dynamic norm erosion, competitive pressures, self-selection of participants whose preferences align with degraded norms, leading to irreversibility. CPCD as a term, but perhaps "Competitive Norm Degradation with Selection" (CNDS) is clearer. Define it step by step, contrast with adjacent concepts, and provide examples. Ensure the definition captures the lack of defection, the shifting yardstick, the demographic change, and the undermined collective action. That should cover what the user is looking for.
answer: |-
  Based on your detailed description and analysis, this pattern **does not have a single, universally established name** that perfectly captures all its core elements simultaneously. While adjacent concepts exist, they miss critical aspects of the dynamic you've identified, particularly the **co-evolution of degrading standards and participant preferences through selective attrition**.

  Here's a breakdown of adjacent concepts and why they fall short:

  1.  **Tragedy of the Commons:** Captures collective harm from individual rational actions without coordination. **Falls short:** Focuses on depletion of a *rivalrous resource* (pasture, fish stocks). Your pattern involves the degradation of a *shared norm or standard*, not a material resource. Also, doesn't inherently involve the *selection of participants* with aligned preferences for the degraded state.
  2.  **Race to the Bottom:** Describes competition driving progressive lowering of standards (e.g., regulations, wages). **Falls short:** Often assumes static preferences or a fixed external "bottom." It doesn't explicitly model how the *standard itself becomes the moving target* or how the *participant pool evolves* to prefer/perpetuate the lower standard. It often implies a static "bottom" exists.
  3.  **Adverse Selection:** Describes how information asymmetry leads to a market dominated by low-quality goods or high-risk participants. **Falls short:** Primarily about *pre-existing hidden characteristics* (e.g., lemons in used cars, high-risk insurance buyers). Your pattern involves the *active selection and adaptation* of participants *during* the competition, changing their relationship to the standard itself. The standard degradation is central, not just hidden quality.
  4.  **Evolutionary Trap / Maladaptive Behavior:** Applied in biology/ecology to situations where evolved traits become harmful in altered environments. **Falls short:** Focuses on biological traits in changing environments, not social norms and standards emerging from competition within a system. Lacks the explicit element of *competitive pressure driving the norm degradation*.
  5.  **Gresham's Law ("Bad money drives out good"):** Describes how inferior versions of a commodity drive superior ones out of circulation. **Falls short:** Focuses on a specific type of good (currency/commodity) with fixed definitions of "good" and "bad." Doesn't capture the *dynamic redefinition of the standard* ("good" becomes redefined) or the *selective attrition of participants* who value the original "good."
  6.  **Collective Action Problem / Prisoner's Dilemma:** Frameworks for understanding why rational individuals fail to cooperate for mutual benefit. **Falls short:** These typically assume *fixed preferences* over outcomes and *fixed rules/standards*. Your pattern's core is the *shifting standard and the shifting preferences of the remaining participants*, making coordination impossible not just strategically, but *demographically*.

  **Why it Deserves a Name & Proposed Term:**

  This pattern is distinct and recurring, as your examples illustrate. Its core innovation is the **dynamic interplay between competitive degradation of a norm and the simultaneous selection of a participant pool whose preferences become aligned with the new, degraded norm, making reversal impossible.** This creates a uniquely self-sealing trap.

  **Proposed Term: Competitive Preference-Consistent Degradation (CPCD)**

  **Definition:**

  Competitive Preference-Consistent Degradation (CPCD) describes a socio-economic process where:

  1.  **Uncoordinated Competition:** Individuals or entities compete within a system lacking enforceable coordination mechanisms.
  2.  **Norm Erosion:** Competitive pressures incentivize actions that incrementally erode a shared standard, norm, or expectation of quality. Each incremental step is locally rational or defensible.
  3.  **Demographic Filtering:** Participants who find the degrading standards unacceptable or unworkable are progressively selected *out* (through exit, failure, or marginalization). Participants who are more comfortable with or thrive under the lower standards are selected *in* and rise to prominence.
  4.  **Preference-Standard Co-evolution:** The result is a participant pool whose aggregate preferences are increasingly aligned with the new, degraded standard. The degraded standard becomes the new baseline, perceived as normal or even optimal *by the dominant participants*.
  5.  **Irreversibility:** The shift in both the standard and the participant preferences makes collective action to restore the original (or a higher) standard strategically and demographically infeasible. The system becomes locked into a self-sustaining, degraded equilibrium.

  **Boundaries, Instances, and Non-Instances:**

  *   **Core Instances (Must exhibit all 5 elements):**
      *   **Your Scientific Example:** Careful science outcompeted; standards erode; careful scientists leave/don't succeed; remaining leaders accept/perpetuate new norms; reversal impossible.
      *   **Your Attention Economy Example:** Restrained creators outcompeted; engagement thresholds rise; restrained creators leave; successful creators optimize further; platform culture shifts; reversal impossible.
      *   **"Publish or Perish" Pressure:** Hyper-focus on quantity over quality; methodological rigor declines; researchers prioritizing rigor leave academia/struggle; those adept at fast publishing dominate; system perpetuates low-quality output.
      *   **Certain Labor Markets:** Intense competition leads to acceptance of worsening conditions/wages; workers demanding better conditions leave the field/aren't hired; workforce becomes dominated by those tolerant of poor conditions; unionization/improvement efforts fail.

  *   **Related but Not CPCD:**
      *   **Simple Tragedy of the Commons (e.g., overfishing):** Resource depletion occurs, but the *standard* of sustainable fishing isn't inherently degraded *during* the competition (it was always the goal), nor is there strong selective attrition of fishers who prefer sustainability (they are all equally harmed/acting similarly).
      *   **Simple Race to the Bottom (e.g., states lowering corporate taxes):** Standards (tax rates) are lowered, but there isn't necessarily a *shift in the preferences* of the "participants" (states/corporations) – they always preferred lower taxes. The "bottom" is relatively fixed (zero).
      *   **Adverse Selection (e.g., "lemons" market):** Low-quality goods dominate due to hidden information, but the *standard* (desire for a good used car) doesn't degrade, and sellers of good cars *exit* specifically because they can't get fair value, not because their preferences changed. Buyer preferences remain fixed (want a good car).
      *   **Burnout/Exploitation:** Individuals are ground down by pressure, but without the *competitive dynamic eroding a shared standard* and *selecting for those who prefer the degraded state*. It's more about individual toll than systemic norm shift through competition.
      *   **Regulatory Capture:** Standards are lowered, but primarily through deliberate influence by regulated entities on regulators, not through an *emergent, uncoordinated competitive process* among the regulated entities themselves filtering participants.

  *   **Edges/Gray Areas:**
      *   **Speed vs. Quality in Business:** If competition purely rewards speed, leading to lower quality *without* changing the *shared definition* of what constitutes acceptable quality (i.e., customers still complain, management still demands better), it's not full CPCD. CPCD requires the *standard itself* (what is considered "good enough" or "solid") to erode and become accepted by the dominant players.
      *   **Cultural Shifts:** Broad cultural changes might involve norm erosion and demographic shifts, but CPCD specifically requires the driver to be *uncoordinated competition* within a defined system (a field, a platform, a market).

  **Conclusion:**

  Your identification of this pattern – particularly the **co-evolution of degraded norms and participant preferences under competitive pressure, leading to irreversible systemic change** – is astute. Existing concepts capture parts but not the whole integrated mechanism. **Competitive Preference-Consistent Degradation (CPCD)** provides a focused term for this specific, self-reinforcing trap. It highlights the key dynamics: competition erodes the norm, which filters participants, whose resulting preferences are now consistent with (and thus perpetuate) the degraded norm, preventing recovery. This term deserves consideration for analyzing phenomena in science, online ecosystems, labor, and beyond where competition cannibalizes the very standards that initially defined quality within a system.
