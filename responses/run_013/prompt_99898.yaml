  Okay, let me start by understanding the user's situation. They run a small county historical society with limited resources—just two paid staff and volunteers, none trained in historiography. Their main challenge is evaluating historical claims without proper methodology, leading to decisions based on "vibes" or the loudest voice, often influenced by donors or board members. They need a practical, step-by-step procedure that can be done in an afternoon, using their real-world sources like biased county histories, undated letters, oral traditions, etc.

  The user pointed out two key issues: dealing with single or conflicting sources and handling claims that matter to living people. They want clarity on when one source is sufficient, how to interpret silence in records, and how bias affects a source's reliability. They also want to separate evidence-based conclusions from community desires and board decisions. The examples given—the Underground Railroad house and the town founder's controversial action—highlight these challenges.

  First, I need to design a checklist that's straightforward and actionable. The procedure must have clear steps with exit points for when a claim can't be substantiated. Each step should have criteria for proceeding or stopping. For example, starting with source verification before assessing content. This prevents wasting time on unverifiable sources.

  Next, addressing bias and single sources. The user mentioned that hostile sources admitting something might be more credible than friendly ones. The procedure should include evaluating bias direction and inherent credibility. For instance, a descendant's account defending family actions is less reliable than a neutral or hostile source. Also, silence in records shouldn't be used as evidence against an event unless there's reason to expect documentation.

  For emotionally charged issues, the procedure must clearly separate evidence assessment from ethical considerations. The checklist should end with a "Historical Judgment" section that states what the evidence supports and what's speculative. Decisions to present unverified claims for community reasons should be a separate, board-level choice.

  Testing the procedure on the two examples is crucial. For the Underground Railroad house, the oral tradition and physical evidence (false wall) need corroboration. Since there's no contemporary evidence, the procedure should conclude insufficient proof. For the founder's controversy, the biased 1902 history with no other sources can't be verified. Both outcomes might be unpopular, showing the procedure's objectivity.

  I also need to highlight the procedure's limitations. It can't create evidence where none exists, and some questions will remain unresolved. The key is transparency in what's known vs. assumed. The user needs to know when to stop the procedure and escalate to the board for policy decisions.

  Finally, ensuring the checklist is practical. Steps should be sequential, with clear pass/fail criteria. Volunteers must understand terms like "contemporary evidence" without jargon. Including examples in the appendix helps apply the steps to real cases. Emphasizing documentation at each step makes the process auditable and builds institutional memory.
answer: |-
  Here’s a practical, evidence-based procedure designed for your constraints—**The County History Triage Checklist**. It runs in 3 phases, takes 2-4 hours per claim, and forces transparent decision-making.  

  **Core Principles:**  
  1.  **Stop when evidence runs out.** Don’t debate the void.  
  2.  **Bias isn’t fatal—it’s data.** Hostile admissions > friendly boasts.  
  3.  **Silence ≠ falsehood.** Absence of evidence isn’t evidence of absence—unless it *should* be there.  
  4.  **Separate Truth/Likelihood/Presentation.** Your job is #1; the board decides #3.  

  ---

  ### THE COUNTY HISTORY TRIAGE CHECKLIST  
  *Run this for each specific claim (e.g., “This house was a UGRR stop in 1854”).*  

  #### PHASE 1: SOURCE VERIFICATION (30-60 mins)  
  *Goal: Can we trust this source exists?*  
  1.  **Is the source physically present?**  
      *✅ Good enough:* We hold it (letter, photo, book) OR have a verified transcript.  
      *🛑 STOP (Unverifiable):* “My cousin saw a diary once” / folklore without documentation.  
      *➡️ Proceed to Step 2.*  

  2.  **Can we date the source?**  
      *✅ Good enough:* Date on item, postmark, contextual clues (e.g., letter mentions Lincoln’s assassination).  
      *🛑 STOP (Undatable):* Undated photo, anonymous clipping with no context.  
      *➡️ Proceed to Step 3.*  

  3.  **Can we identify the creator?**  
      *✅ Good enough:* Named author, photographer, family archive owner.  
      *⚠️ Hedge:* “Likely written by the daughter, based on handwriting.”  
      *➡️ Proceed to PHASE 2.*  

  **OUTPUT:** “We have a [type] from [date] created by [person/group].” (If not, STOP—claim is unverifiable.)  

  #### PHASE 2: EVIDENCE ASSESSMENT (60-90 mins)  
  *Goal: Does this source support the claim?*  
  4.  **Is the source contemporary?**  
      *✅ Preferred:* Created within 0-20 years of the event.  
      *⚠️ Hedge:* Created 20-50 years later (e.g., 1902 history about an 1840 event).  
      *🛑 Weak:* Created 50+ years later (e.g., 1930 oral tradition about 1850s).  

  5.  **Does the source directly state the claim?**  
      *✅ Strong:* “This house hid freedom seekers in 1854.”  
      *⚠️ Indirect:* “Father built strange cellars” + abolitionist church membership.  
      *🛑 No:* Source describes something else entirely.  

  6.  **Assess bias & corroboration:**  
      | **Bias Direction** | **Corroboration** | **Weight** |  
      |-------------------|-------------------|------------|  
      | Hostile (admits flaw) | Supported by another source | ★★★★ |  
      | Neutral (govt record) | No other sources | ★★★ |  
      | Friendly (boast) | Contradicted by another source | ★ |  
      *✅ Good enough:* ★★ or higher.  
      *⚠️ Hedge:* ★ (single biased source).  
      *🛑 STOP (debunked):* Contradicted by contemporary evidence.  

  7.  **Check for expected silence:**  
      *🛑 STOP (Likely false):* Event *should* be recorded but isn’t (e.g., a land seizure in 1840s with no court records, deeds, or newspapers).  
      *⚠️ Hedge:* Event is private/unlikely documented (e.g., a secret UGRR stop).  

  **OUTPUT:**  
  - **Supported:** Contemporary, direct, well-corroborated.  
  - **Plausible:** Indirect, biased but uncorroborated, or expected silence.  
  - **Unsupported:** Debunked, too late, or contradicted.  

  #### PHASE 3: HISTORICAL JUDGMENT (30 mins)  
  *Goal: What do we do with this?*  
  8.  **State the evidence conclusion:**  
      *“Based on [sources], the claim is [Supported/Plausible/Unsupported].”*  

  9.  **Separate desires:**  
      *“We wish this were true because [reasons]. This does not change #8.”*  

  10. **Recommend action:**  
      - **Supported:** State confidently in exhibits/journal.  
      - **Plausible:** Use “may have,” “tradition holds,” or “some evidence suggests.”  
      - **Unsupported:** Omit or state “no evidence found.”  
      *👉 YOUR CALL:* #8 and #9.  
      *👉 BOARD CALL:* If #10 involves political/social risks (e.g., contradicting donors).  

  **FINAL OUTPUT:** A memo with sections for #8, #9, #10.  

  ---

  ### TEST CASE 1: UNDERGROUND RAILROAD HOUSE  
  **Claim:** *“This house was a UGRR stop in the 1850s.”*  
  - **Sources:** 1930s fair tradition; cellar with false wall.  

  | Step | Question | Answer | Outcome |  
  |------|----------|--------|---------|  
  | 1 | Source physically present? | ✅ Tradition is documented in fair programs. | Proceed |  
  | 2 | Date the source? | ✅ 1930s (80 yrs after event). | Proceed |  
  | 3 | Creator identified? | ❌ Anonymous oral tradition. | ⚠️ Hedge: “Community memory” |  
  | 4 | Contemporary? | ❌ Created 80 yrs later. | 🛑 **Weak** |  
  | 5 | Direct statement? | ❌ Tradition says “stop,” but no specifics. | ⚠️ Indirect |  
  | 6 | Bias & Corroboration | ★ Single source, friendly (community pride), no corroboration. | ⚠️ Hedge |  
  | 7 | Expected silence? | ✅ UGRR was secret; no records expected. | Not false |  
  | **PHASE 2 OUTPUT** | | **Unsupported** (Weak + Indirect + Uncorroborated) | |  
  | 8 | Evidence Conclusion | ❌ **No evidence beyond a late, uncorroborated tradition.** | |  
  | 9 | Desires | ✅ We *want* this to be true—it honors local resistance. | |  
  | 10 | Action | *“Label: ‘Local tradition identifies this cellar as a possible station on the Underground Railroad. While physical modifications (like this false wall) are consistent with such sites, no contemporary evidence has been found to confirm its use.’”*<br> 👉 **Board must approve** this phrasing due to donor sensitivity. |  

  **VERDICT:** *The procedure forces you to say it’s unverified—even though you’d like to believe it.*  

  ---

  ### TEST CASE 2: TOWN FOUNDER’S “TERRIBLE DEED”  
  **Claim:** *“Founder cheated neighbor settlers in the 1840s.”*  
  - **Source:** 1902 county history by founder’s descendant.  

  | Step | Question | Answer | Outcome |  
  |------|----------|--------|---------|  
  | 1 | Source present? | ✅ We have the book. | Proceed |  
  | 2 | Date the source? | ✅ 1902 (60 yrs after event). | Proceed |  
  | 3 | Creator identified? | ✅ Founder’s grandson. | Proceed |  
  | 4 | Contemporary? | ❌ 60 yrs later. | ⚠️ Hedge |  
  | 5 | Direct statement? | ✅ “Some claim Grandfather seized land unfairly... but records prove otherwise.” | ✅ Direct (admits accusation) |  
  | 6 | Bias & Corroboration | ★★ **Hostile admission** (mentions the claim) but **no records provided**; likely family defense. | ⚠️ Hedge |  
  | 7 | Expected silence? | ❌ Land disputes *should* have deeds/court records. None exist. | 🛑 **Likely false?** |  
  | **PHASE 2 OUTPUT** | | **Unsupported** (Late + Biased + No corroboration + **Expected silence**) | |  
  | 8 | Evidence Conclusion | ❌ **Accusation exists but no evidence supports it; lack of records weakens claim.** | |  
  | 9 | Desires | ❌ Board may want to protect founder’s reputation. | |  
  | 10 | Action | *“Omit from exhibits. If questioned: ‘While a 1902 history references unproven allegations about the founder, no period documents support this narrative.’”*<br> 👉 **YOUR CALL** (unless board demands censorship). |  

  **VERDICT:** *Procedure kills a claim the board might want to suppress—but does it honestly.*  

  ---

  ### WHAT THIS PROCEDURE CAN & CAN’T DO  
  **CAN:**  
  - Force clarity on evidence quality.  
  - Separate facts from wishes.  
  - Stop debates over unsupported claims.  
  - Identify when bias *helps* (hostile admissions).  
  - Flag when silence is meaningful (e.g., missing legal records).  

  **CAN’T:**  
  - Create evidence that doesn’t exist.  
  - Resolve conflicts without new sources.  
  - Replace deep research (but prioritizes limited resources).  
  - Decide community ethics—that’s the board’s role.  

  **CRUCIAL:** Document every step. Attach the memo to the claim file. When the board overrides #8, they must minute: *“Despite insufficient evidence, we present this because [reason].”* This preserves integrity while allowing pragmatism.  

  Would you like tweaks to the checklist, or a third test case?
