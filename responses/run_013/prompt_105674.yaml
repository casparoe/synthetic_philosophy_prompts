prompt: |-
  I'm putting together a seminar session on Anscombe's pamphlet against Oxford handing Truman that honorary degree, and I've managed to confuse myself. Here's my reading — tell me where it goes wrong. Her objection to the bombings was, I assumed, basically a proportionality complaint: the thing killed a colossal number of civilians and no military gain could justify that, so it was a disproportionate act and therefore a war crime — the standard jus in bello charge you'd level at anyone. Fine, fair enough. But now the trouble starts. She wasn't a pacifist; she thought taking up arms against Hitler was justified (she even says the persecution of the Jews would have been a reasonable cause of war). And the Allies were burning cities and killing civilians by the hundred thousand well before Hiroshima. So on her own cost-benefit logic she's got to either condemn the entire Allied war effort or admit the bomb was just a bigger, faster version of what everyone was already doing. And if she's happy to run the arithmetic in the bomb case, why does she suddenly turn absolutist about 'intrinsically evil acts' in her other work? I know she says something about intending an innocent's death versus merely foreseeing it, but I can't see how that rescues her — isn't that just Catholic hand-waving to dodge the sums? I suspect there's one distinction doing all the heavy lifting here and I'm missing it. Can you spell out the actual structure of her arguement, and tell me whether the inconsistency I think I'm seeing is real or whether I've built it out of a premise she'd flatly reject?
reasoning: |-
  Okay, let me unpack this user's query about Anscombe's argument against Truman's honorary degree. The user is preparing a seminar and has hit a conceptual wall. They've correctly identified the core tension: Anscombe condemns Hiroshima/Nagasaki while supporting the broader Allied war effort that involved massive civilian casualties through area bombing. 

  First, I need to verify if the user's framing is accurate. They're interpreting Anscombe's objection as purely proportionality-based (jus in bello), but her actual argument runs deeper through the lens of double effect. The key isn't just "too many dead" but the intentional targeting of non-combatants as a method. 

  Hmm, the user's confusion seems to stem from two points: (1) assuming Anscombe's position collapses into utilitarianism when she explicitly rejects that framework, and (2) missing how her "intrinsically evil acts" doctrine (like directly targeting innocents) creates a bright-line moral prohibition distinct from collateral damage calculations. 

  I should emphasize how Anscombe would reject the "bigger/faster version" equivalence: firebombing Dresden (while still problematic) could theoretically satisfy double effect if targeting military objectives, whereas Hiroshima's entire design was to maximize civilian annihilation to break morale. That intentionality matters categorically for her. 

  The user's "Catholic hand-waving" quip suggests they might view double effect as sophistry. I should clarify it's not about dodging math but defining moral agency - foreseen deaths aren't chosen as a goal or method, only permitted reluctantly. Anscombe would argue intentions define the act's moral species. 

  Notably, the user hasn't considered Anscombe's broader philosophical commitments. Her later work on intention (e.g., "Intention") rigorously defends this distinction against consequentialism. This context helps explain why she saw Truman's degree as symbolic approval of murder-as-policy. 

  The real inconsistency might be in the Allies' own conduct: if they claimed precision targeting while knowingly area bombing, Anscombe might condemn that too. But Hiroshima was uniquely explicit in its civilian-targeting logic, making it a clear test case for her principles.
answer: |-
  You've hit on the core tension in Anscombe's position, but your reading misses the crucial distinction she relies on: **the doctrine of double effect (DDE), centered on *intention*.** The inconsistency you perceive arises from interpreting her argument as purely *proportionality-based*, whereas for Anscombe, *intention* is the primary moral determinant. Here's how her argument actually works:

  1.  **The Foundational Principle: Absolute Prohibition on Intentionally Killing Innocents:** Anscombe, following Aquinas and Catholic natural law tradition, holds that **deliberately killing an innocent person is *intrinsically evil* and absolutely forbidden.** This is not a "sudden absolutism"; it's the bedrock of her entire moral framework regarding killing. No military advantage, no matter how great, can justify *choosing* to kill the innocent as a means to an end.

  2.  **The Doctrine of Double Effect (DDE) as the Key Distinction:** This doctrine provides the critical escape valve for actions that *foreseeably* cause harm to innocents but are not *intended*. For an act to be permissible under DDE:
      *   **1. The act itself must be morally good or neutral.** (e.g., bombing a legitimate military target).
      *   **2. The *intended* effect must be good.** (e.g., destroying a vital military factory or troop concentration).
      *   **3. The good effect must not be *caused* by the bad effect.** (Destroying the factory causes victory, *not* the deaths of the civilians living nearby).
      *   **4. There must be a *proportionately grave reason* for permitting the foreseen bad effect.** (The military advantage gained must be significant enough to outweigh the foreseen deaths of innocents).

  3.  **Applying DDE to Area Bombing (e.g., Dresden, Hamburg) vs. Hiroshima/Nagasaki:**
      *   **Area Bombing (The Allied Campaign):** Anscombe *would* condemn area bombing *if* its *intended method* was explicitly to kill civilians to demoralize the enemy or destroy worker housing. However, the *official justification* (however dubious in practice) was often framed as attacking military-industrial targets within cities, with civilian deaths being a *foreseen but unintended* consequence. On this *official* basis, Anscombe *could* (grudgingly) argue that such bombings *might* theoretically satisfy DDE *if*:
          *   The *intended target* was genuinely military/industrial.
          *   The *intended effect* was the destruction of that target.
          *   Civilian deaths were a *side-effect*.
          *   The military value of the target was proportionately grave to the foreseen civilian deaths.
      *   **Hiroshima/Nagasaki:** Here, Anscombe argues the bombings **fail DDE fundamentally on the point of *intention*.** The *method itself* – dropping a single, massively destructive bomb on the heart of a city – was explicitly chosen **to kill a vast number of civilians instantly.** The *intended effect* was not *primarily* the destruction of a specific military target (though some existed), but **to break Japanese morale and force surrender *by* inflicting catastrophic civilian casualties.** Truman's own statements and the target selection criteria (cities untouched by firebombing to maximize the "psychological" impact) supported this interpretation. The mass killing of civilians wasn't a *foreseen side-effect* of attacking a military target; it was **the chosen *means* to achieve the end.** This makes it the *intentional killing of innocents*, which is intrinsically evil and absolutely forbidden, regardless of proportionality.

  4.  **Resolving Your "Inconsistency":**
      *   **It's Not (Primarily) About Proportionality:** While proportionality *is* a *condition* of DDE (#4), it only comes into play *after* the act passes the primary tests concerning the nature of the act and intention. For Anscombe, an act that *intentionally* kills innocents is wrong *full stop*; proportionality doesn't even get a hearing. Hiroshima/Nagasaki fails at the *intention* hurdle.
      *   **"Bigger, Faster Version"? No:** Anscombe rejects this equivalence. She argues there's a *qualitative* moral difference between:
          *   **Foreseeing but not intending** civilian deaths as a side-effect of attacking a legitimate military target (potentially permissible under DDE, subject to proportionality).
          *   **Intending** civilian deaths as the very *method* of warfare (intrinsically evil).
      *   **"Catholic Hand-Waving"?** Anscombe would vehemently reject this. For her, the distinction between *intended means* and *foreseen side-effect* is a profound and objective feature of moral reasoning and agency. It defines the moral character of the *act itself*. Ignoring it reduces morality to consequentialism/utilitarianism, which she utterly rejected. An agent *chooses* their intentions; merely foreseeing an outcome doesn't mean they *will* it as part of their plan.

  5.  **The Honorary Degree: The Symbolic Stakes:** Anscombe's pamphlet wasn't *just* about condemning the bombings. It was about **Oxford University publicly honoring and thus implicitly condoning a man who, in her view, had ordered the *intentional mass murder of innocent civilians*.** This act of honoring, she argued, corrupted the university's moral standing and signaled approval of a gravely evil principle: that mass murder of innocents could be a legitimate tool of statecraft.

  **Conclusion:**

  You've correctly identified a tension in *application* (could area bombing *really* satisfy DDE?), but the perceived *inconsistency in Anscombe's logic* isn't real. It stems from misattributing a consequentialist/proportionality-based argument to her. Her core argument is **deontological and intention-based:**

  1.  Intentionally killing innocents is always murder and absolutely forbidden.
  2.  Hiroshima/Nagasaki were intentional mass killings of innocents.
  3.  Therefore, they were murder and gravely evil.
  4.  Honoring the man who ordered this act condones this evil.

  She *might* condemn area bombing campaigns if their *actual intent and method* was civilian terror (many historians argue this *was* the actual intent). But Hiroshima/Nagasaki represented a uniquely explicit, undeniable, and technologically amplified case of *intending* civilian annihilation as the primary weapon. Her argument doesn't depend on "dodging the sums" via DDE; it uses DDE to expose why the sums are morally irrelevant when the act is intrinsically evil. The distinction between *intending evil* vs. *foreseeing it as a side-effect* is the non-negotiable pillar holding up her entire position.
