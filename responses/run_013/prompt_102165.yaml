prompt: |-
  My book club has a rule that no-one's allowed to say 'it's all subjective' until at least an hour in, because last month someone used 'there's no disputing about tastes' to shut down an argument about whether our friend was wrong to give five stars to a novel she'd only heard discussed on a podcast. Her line was that you can't inherit a judgement of taste from someone else, you can only borrow their words — the appreciation itself has to happen to you. I half agree, but I'm also fairly sure the slogan was doing about four different jobs at once in that one sentence and I can't untangle them.

  Can you lay out the distinct precise claims 'there's no disputing about tastes' could be making — starting with the near-trivial ones (its usually pointless to argue, people just dig in), through the ones about what aesthetic sentences even mean and whether they can be true or false, up to the strong one that a judgement of taste can't be transmitted by testimony at all, only by first-hand acquaintance with the thing. For each reading say whether it's a platitude, a serious and defensible position, or flatly false, and tell me which reading was actually being leaned on when she used it to say our friend's five stars were unjustified. I want a menu I can read out at the next meeting, not one verdict — and if some of the readings collapse into each other, say so.
