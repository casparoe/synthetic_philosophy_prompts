answer: |-
  ## The Burden of Agency

  **Characters:**  
  *   **Lena:** Nonconsequentialist, focused on agency and personal moral imprint.  
  *   **Ben:** Consequentialist, skeptical of the doing/allowing distinction.  

  **Setting:** A worn armchair in a university common room, late afternoon.

  **(Lena is reading a journal; Ben approaches, holding two mugs of tea.)**

  **Ben:** Here. Thought you might need fortification against Quinn’s latest defence of the doing/allowing distinction. Still insisting my deleting your draft thesis file is fundamentally different than merely declining to save it when the server crashes?

  **Lena:** (Takes a mug) Thanks. And yes, Ben. The *server* crashing is the world acting. *You* hitting ‘delete’ is *you* imposing harm directly. The moral difference lies in whose agency initiates the causal chain leading to harm. What I *do* is mine; what I merely *fail to prevent* belongs to the world’s chaotic flow.

  **Ben:** Chaotic flow? That’s poetic, but unconvincing. Take criminal law. That squatter who falls asleep with a lit cigarette, sets his mattress on fire, then rolls over while the building burns. Most jurisdictions hold him responsible for the deaths, even though he just ‘omitted’ to act after starting the fire. Why? Because he *created the danger*. The duty arises from the prior act, not the omission itself. The ‘doing’ poisoned the subsequent ‘allowing’. The distinction collapses under its own weight.

  **Lena:** No, it sharpens it. By negligently falling asleep with the cigarette, he *did* something – created an unreasonable risk. His subsequent failure to act *is* culpable *because* he initiated the dangerous sequence. He made the fire *his* business. The omission is blameworthy *only* because it follows a prior deed that made him responsible. The default rule – no liability for pure omission – stands precisely because without that prior *act*, mere witnessing wouldn’t obligate him.

  **Ben:** But then look at *Vacco v. Quill*. The Supreme Court upheld a ban on physician-assisted suicide partly by saying withdrawing life support is an ‘omission’ (letting die), while prescribing lethal drugs is an ‘act’ (killing). Yet they leaned heavily on *intent*: the doctor withdrawing support intends only to stop burdensome treatment, while the assisting doctor intends death. If intent is what matters morally and legally, why dress it up as an act/omission distinction? It concedes the *real* moral work is being done elsewhere. You’re smuggling intent in through the back door of agency.

  **Lena:** Intent is crucial, Ben, but it’s *expressed* through acts and omissions. The doctor *intending* death *by* actively injecting poison implicates her agency directly in causing death. *Intending* only to cease burdensome treatment while *allowing* the underlying disease to take its course keeps the fatal outcome more clearly tied to the disease, not her agency. Her hands are cleaner in the latter case. The act/omission distinction *frames* how we interpret intent and assign direct responsibility.

  **Ben:** Clean hands? That sounds suspiciously like the ‘omission bias’ psychologists document – people consistently judge harmful actions as worse than equally harmful omissions. But is that rational, or just a quirk of moral cognition? Joshua Knobe shows how our judgments about whether a side effect was *intended* flip dramatically based on whether the side effect is good or bad. The exact same CEO action is seen as *intentionally* harming the environment but only *unintentionally* helping it. Our ‘intuitions’ about agency and intention are malleable, shaped by our evaluation of the outcome. Your ‘clean hands’ feeling might just be post-hoc blame avoidance, not a deep moral truth.

  **Lena:** (Leans forward) The Knobe effect shows context matters for *ascribing* intention, not that intention or agency is illusory. It reveals our folk psychology is sensitive to the *normative context* – harm makes us scrutinize the agent’s awareness and choices more closely. But that doesn’t debunk the core distinction; it shows we understand that *bringing about harm* actively requires greater justification than *failing to prevent* it. The bias reflects a *normative* reality: actively causing harm demands a heavier burden of justification precisely because it directly implicates the agent.

  **Ben:** So you retreat to Warren Quinn? That the act/omission distinction maps onto negative rights (don’t harm me) versus positive rights (help me)? That deleting your file violates a negative right, while my failure to save it merely fails to fulfill a positive one? But that just kicks the can. *Why* should negative rights be so much stronger? And is it really that clean? If I *know* the server will crash unless I hit ‘save’, and I deliberately don’t, am I not *using* the server crash *as my means* to destroy your work? That feels like active harming, even if my fingers never touched the delete key.

  **Lena:** Quinn has a point. The negative duty not to harm is prior and more stringent because respecting it requires only non-interference with what others already have. Positive duties require affirmative creation. But you’re right, it gets murky. The harm-as-means versus harm-as-side-effect distinction you hint at often overlaps with doing/allowing, but not perfectly. That’s where it gets genuinely sticky.

  **Ben:** Sticky? Try this: Patient is terminally ill, suffering unbearably on a ventilator. Doctor A, believing it futile and cruel, never puts the patient on the vent in the first place. Patient dies of the disease. Doctor B puts the patient on the vent, sees the suffering is worse than anticipated, and switches it off. Patient dies. Same intent (relieve suffering, foreseeing death), same outcome. Is Doctor B a murderer while Doctor A is blameless? How can switching off the vent *you yourself attached* be morally worse than never attaching it, when the patient’s underlying condition is identical?

  **Lena:** (Sighs) That *is* the hard case. Logically, the outcome is the same. But... morally? When Doctor B switches off the vent, she actively severs the patient’s current lifeline, a lifeline *she* provided. There’s a directness, a finality in that *act* of disconnection that feels different than the passive *omission* of never starting the intervention. The patient’s immediate dependence shifts. Doctor B created a state of dependency and then actively ended it. Doctor A never created that specific dependency. It’s... messier, but the imprint of agency feels heavier on Doctor B.

  **Ben:** “Feels heavier”? Lena, that’s your omission bias talking! Or maybe just discomfort with the direct physical act of flipping the switch. The *patient’s reality* is identical. The *consequence* is identical. The *doctor’s intent* is identical. The *underlying cause of death* is identical. How can flipping a switch, stopping an artificial intervention, carry such disproportionate moral weight compared to the decision *not to start* the exact same intervention? It’s arbitrary! The only difference is whether the doctor briefly made the situation slightly less bad before making it terminal again. That temporal blip can’t bear the weight you’re putting on it.

  **Lena:** (Stares into her tea) The temporal blip... and the fact that Doctor B *touched* the machine. She actively intervened to *cause* the cessation of function. Doctor A didn’t touch anything related to sustaining life *at that moment*. Doctor B’s action was the *proximate* cause of death at that instant; Doctor A’s inaction wasn’t. The causal chain... it *is* different. But... (She trails off, frowning) Is it *morally* different enough? I don’t know, Ben. I truly don’t know. It costs me to say that, but there it is. The line feels real, but applying it cleanly to this case... it frays.

  **Ben:** (Leans back, quieter) And it costs *me* to admit... that the *feeling* of difference is persistent. Even consequentialists flinch at the switch. Maybe... maybe the distinction tracks something about *how* we experience responsibility, even if it doesn't cleanly map onto outcomes. But I still can’t see it as foundational. It’s a proxy, a heuristic, often useful, sometimes misleading... and occasionally, like now, deeply confounding. We’re stuck with the feeling, Lena, but I’m not convinced it points to bedrock.

  **Lena:** (Nods slowly) Stuck with the feeling... and stuck with each other, arguing it out. Pass the biscuits, Ben. We’re going to need them.
