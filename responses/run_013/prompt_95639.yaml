prompt: |-
  My flatmate and I have been arguing about Kant and animals for most of a year and I want to just write down the thing we'd both sign. We're both Kantians, neither of us wants out of the framework. She holds the orthodox line: whatever we owe animals is really owed to humanity or to ourselves, and the wrong of cruelty sits in the agent — it deadens the sympathy you need for treating people well. I think that once you throw out the premise that animals aren't self-conscious (which is just empirically false), the machinery of treating something as an end rather than merely a means gives you something that's owed to the animal. So: draft the joint statement of our adversarial collaboration. First the claims we can both sign about how the view is supposed to work, including where the wrong of cruelty is meant to be located, and whether the orthodox story even needs the premise about animal minds or is really just a claim about the agent's own character. Then the exact remaining disagreement, each side's version in wording that side would accept, and the cruxes — for each crux, a case or argument we'd both agree bears on it, with our predictions written down in advance. Two cases we keep re-litigating and that should go in the document: cruelty done in complete secrecy to an animal, where no human ever learns of it and the person's dealings with people are provably no worse; and cruelty to something that only appears to suffer, a lifelike robot animal or a video. If part of what we're doing turns out to be a verbal dispute, say which part and why. Numbered agreed claims, then a disagreements table. No citations and no reading list, we've both read alot already.
