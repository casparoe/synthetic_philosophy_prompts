answer: |-
  Below are the desiderata for any adequate theory of the manipulation/persuasion distinction, formulated as constraints with motivating cases/considerations. Non-negotiable constraints (NN) are essential for capturing core intuitions; others reflect common commitments that reasonable rivals *might* reject. Conflicts are noted immediately after the list.

  ### Desiderata (Constraints on the Theory)
  1.  **Truth-Compatibility (NN):** Must allow that influence employing *only* true statements can be manipulative.  
      *Motivation:* Genuine deadline displayed to create artificial urgency/hurry.
  2.  **Bias-Exploitation Capability (NN):** Must classify influence that *exploits* pre-existing cognitive biases (without impairing capacities) as potentially manipulative.  
      *Motivation:* Framing a default option to exploit status quo bias.
  3.  **Capacity-Degradation Capability (NN):** Must classify influence that *impairs* deliberative capacities (fatigue, overload, intoxication) as potentially manipulative.  
      *Motivation:* Designing interfaces to induce decision fatigue.
  4.  **Intention-Independence (NN):** Must allow for manipulation *without* the influencer intending to manipulate.  
      *Motivation:* Algorithmic feed ordering shifting beliefs in unintended, belief-distorting ways.
  5.  **Self-Application Capability:** Must accommodate the possibility of an agent manipulating *themselves*.  
      *Motivation:* Setting phone to block distractions but using it to avoid hard decisions.
  6.  **Consensual-Manipulation Capability:** Must allow for manipulation *consented to* by the target.  
      *Motivation:* Therapeutic provocation or deliberate emotional engineering in art.
  7.  **Awareness-Resistance Capability (NN):** Must classify influence as manipulative even if the target is *aware* of the technique, *resents* it, and is *still moved* by it.  
      *Motivation:* User recognizing and resenting autoplay/snackability features yet continuing to watch.
  8.  **Non-Coercion Distinction:** Must sharply distinguish manipulation from coercion (removal of acceptable alternatives).  
      *Motivation:* Threatening harm vs. exploiting a fear of missing out (FOMO).
  9.  **Non-Deception Distinction:** Must sharply distinguish manipulation from deception (intentional falsehood or misleading).  
      *Motivation:* Lying about a product feature vs. exploiting optimism bias about its benefits.
  10. **Non-Rational-Persuasion Distinction:** Must sharply distinguish manipulation from rational persuasion (appealing to reasons with transparency).  
      *Motivation:* Presenting clear cost-benefit analysis vs. exploiting anchoring bias with an irrelevant high number.
  11. **Non-Arbitrary-Boundaries Constraint (NN):** Distinctions from coercion, deception, and rational persuasion must be principled, not ad-hoc.  
      *Motivation:* Preventing the distinction from collapsing into mere intuition or stipulation.
  12. **Thickness-Determination Requirement:** Must explicitly state whether "manipulation" is a thick concept (evaluative content inherent to its meaning).  
      *Motivation:* Resolving whether calling something "manipulative" inherently condemns it.
  13. **Gradedness-Determination Requirement:** Must explicitly state whether the distinction is categorical (manipulation/persuasion) or a matter of degree (more/less manipulative).  
      *Motivation:* Addressing whether subtle influence can be "a little manipulative".
  14. **Non-Universality Constraint (NN):** Must *not* classify *every* successful act of influence as manipulation.  
      *Motivation:* Preserving space for legitimate persuasion (e.g., clear argument, factual reminder).

  ### Key Conflicts (Irreconcilable Tensions)
  *   **Intention-Independence (4) vs. Regulatory-Applicability (Implicit - see below):** If manipulation can occur without intent (4), but regulators cannot inspect intentions (per your constraint), a theory satisfying both cannot provide a *directly* intention-based criterion for regulators. This forces theories towards structural or outcome-based features, risking over/under-inclusion.
  *   **Self-Application (5) & Consensual-Manipulation (6) vs. Standard Wrongness Intuitions:** If manipulation is inherently wrong (as implied by its common thick usage, 12), how can it be done consensually (6) or to oneself (5)? A theory satisfying 5 & 6 likely *must* reject manipulation being inherently wrong or thickly negative (challenging common intuition tied to 12). This creates pressure to either abandon 5/6 or thin the concept (12).
  *   **Awareness-Resistance (7) vs. Capacity-Degradation (3):** If manipulation can succeed despite full awareness and resistance (7), it cannot *always* require significant capacity impairment (3). A theory must reconcile how exploitation/undermining works in high-awareness cases without relying solely on degradation.

  ### Most Exclusionary Requirement
  *   **Awareness-Resistance Capability (7):** This eliminates the broadest range of candidate accounts.
      *   **Eliminates:** Any account defining manipulation primarily by:
          *   **Intention to Bypass/Undermine Reason:** If the target is aware, the bypass attempt is transparent, yet it still works – intention alone isn't sufficient or necessary for the *wrongful influence*.
          *   **Mechanism of Influence (if defined as inherently sub-rational):** Accounts defining manipulation *by* mechanisms like emotional triggering, bias exploitation, or non-rational appeals fail because 7 shows these mechanisms *can* work even when rationally scrutinized and resented. If "sub-rational mechanism = manipulation", then 7 *must* be manipulation, but this makes the mechanism definition insufficiently discriminating against legitimate uses of emotion/biases.
          *   **Hiddenness/Non-Transparency:** Clearly violated by 7.
          *   **Building Wrongness into Definition (Thick Concepts):** If manipulation is *defined* as inherently wrong *because* it involves hidden control or undermining autonomy, 7 directly contradicts this – the control isn't hidden, yet the influence is still arguably manipulative *and* wrongful. This forces a separation between the *descriptive core* of manipulation and its *typical* wrong-making features.

  ### Regulatory Applicability Assessment
  Meeting *all* desiderata under the regulatory constraint (cannot inspect intentions or cognitive processes) is **extremely challenging but not impossible**, requiring a theory focused on **objectively observable features of the influence attempt and context**:
  1.  **Focus on Structure & Context:** Prioritize features like: exploiting *known, predictable* vulnerabilities (biases, emotional states, cognitive limitations) in the *target population*; creating artificial pressure or scarcity (even with true info); impairing capacities through structural choices (e.g., interface design causing fatigue); lack of transparency about material goals/methods *even if* the target could theoretically figure it out; asymmetry of information/control.
  2.  **Proxies for Problematic Effects:** Look for evidence of impaired decision-quality *in the aggregate* (e.g., widespread regret, failure to achieve stated goals) linked to specific influence tactics. While not inspecting individual cognition, patterns can indicate undermining.
  3.  **Avoid Reliance on Internal States:** Define mechanisms in terms of *what is presented/done* (e.g., "presenting an option as the default," "inducing high time pressure with arbitrary deadlines," "structuring choices to maximize cognitive load") rather than the manipulator's secret intent or the target's specific cognitive process *in that moment*.
  4.  **Accept Imperfection:** Regulatory application will involve judgment and potential false positives/negatives. A theory satisfying the desiderata provides a framework for *arguing* why a tactic is manipulative based on observable features and likely effects, even if absolute certainty about individual cases is impossible without accessing intentions/cognition.

  **Conclusion:** A viable theory for regulators must be **structural, vulnerability-focused, and context-sensitive**, using observable tactics and predictable effects on decision-making capacities/outcomes as proxies for manipulation, while explicitly acknowledging the limitations imposed by the regulatory constraint, particularly regarding unintentional manipulation (4) and awareness (7). The core tension with Intention-Independence (4) remains a significant hurdle for *direct* regulatory proof but can be managed through inference from context and patterns.
