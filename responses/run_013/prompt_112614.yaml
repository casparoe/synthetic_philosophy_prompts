  Then, after 8 rounds, we reveal the rules to the Watchers. Then a third phase where the Watchers sort their own reason sentences into two categories:
     (A) Reasons that would still be correct even if every mind in the room were switched off (i.e., the free-floating rationale that exists in the structure of the game).
