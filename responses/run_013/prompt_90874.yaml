  ### Case: The Potter's Trimming
  In a potter's studio, a finished clay vase sits on a wheel, ready for final touches. The vase is constituted by a single, continuous lump of clay, shaped and fired. The potter notices a tiny, irregular protrusion on the rim—a minuscule bump formed during firing. To correct this, she uses a sharp trimming tool to shave off a speck of clay, less than a gram in weight, smoothing the rim. The vase remains fully intact and functional, now with a more even profile. However, the original lump of clay—which included that specific speck—ceases to exist upon its removal. The vase persists through this alteration.

  #### Analysis of Views
  1. **Constitution View (Two Objects)**:  
     Here, the lump and the vase are distinct objects that share all parts, location, and shape until the trimming. The lump is destroyed by the loss of the speck because lumps, as mere quantities of matter, cannot survive the loss of any part (mereological essentialism for lumps applies). The vase, however, survives because functional artifacts like vases can persist through minor, non-substantive alterations (e.g., cosmetic repairs). After the trimming, the vase is constituted by a new lump: the original minus the removed speck. The case highlights a divergence in persistence conditions: the lump's existence depends on part-invariance, while the vase's depends on functional continuity.

  2. **Reductionism ("One Object Described Twice")**:  
     There is only one object, which can be referred to as "a lump" or "a vase" depending on context. The trimming is a mere alteration of this single object: it loses a part but continues to exist. Thus, the lump survives as a slightly smaller lump, and the vase survives as the same functional artifact. The original case's "destruction" of the lump is illusory; it stems from misdescribing the event as creating a new object rather than modifying an existing one. The verdict is that both survive, and the disagreement collapses because there is no second entity to be destroyed.

  3. **Mereological Essentialism (Lumps Cannot Survive Part Alteration)**:  
     If all objects, including lumps, have their parts essentially, then the lump is destroyed by the loss of the speck. However, this view must also hold that the vase is destroyed, since any part loss annihilates an object. The vase cannot survive the trimming; what remains is a new vase constituted by a new lump (the original minus the speck). This conflicts with ordinary intuitions about artifact persistence (e.g., we say "the same vase" after minor repairs), making this view costly here. The case forces an awkward choice: deny that the vase survives (counterintuitive) or reject mereological essentialism for artifacts while retaining it for lumps (inconsistent).

  #### Control Case and Key Feature
  - **Control Case**: The same vase and lump are in the studio, but instead of trimming, the potter rotates the vase 90 degrees on the wheel. No parts are altered, added, or removed.  
  - **Result**: All views agree the lump and vase survive. The interesting disagreement vanishes because the key feature—**part removal**—is absent. This confirms that part removal is what generates the divergence: it triggers distinct persistence conditions for the lump vs. the vase.

  #### Defense for the Worst-Off View and Premise Pressure
  - **Worst-Off View**: Mereological essentialism fares worst, as it must deny the vase's survival, contradicting common sense. A defender might attack the case by arguing that it smuggles in an unearned premise about persistence conditions. Specifically:  
    - The case assumes that the vase *can* survive part loss (e.g., based on ordinary language or functional criteria), but this isn't derived from the story alone—it's imported from intuitive artifact concepts. If we strictly apply mereological essentialism to all objects, the vase *must* be destroyed, and the intuition that it survives is question-begging. The objection pressures the premise that "functional artifacts persist through minor part loss," demanding it be justified metaphysically rather than colloquially.

  #### Addressing the Lump Replacement Concern
  After the trimming, the vase is made of a different lump (the original minus the speck), but this doesn't break the case. For the constitution view, this is expected: objects can be constituted by different lumps over time (e.g., Theseus's ship). The key is that the *original* lump is destroyed during the event, creating a moment where the lump ceases while the vase persists. This separation is what makes the case work, as it forces us to confront whether the lump's persistence conditions are stricter than the vase's. No new lump is "created" to replace it—the remnant lump is just a proper part of the original—so the vase's continued existence isn't undermined.
