  Ok so I'm in a metaphysics seminar and we're on material constitution, and the prof basically said the statue/clay case is so overused that we can't use it unless we do something new with it. So I need you to build me a case to order.

  Here's the spec. One case, one paragraph, realistic setting (a workshop, a studio, a kitchen — not a lab or a space ship), no sci-fi, no teleporting, no brains in vats. It has to be a case where a lump of material and a thing made out of it come apart in an event that actually happens in the story — not a "the lump could have survived being squashed" counterfactual, an actual occurrence. And I want it in the direction that's awkward: something ordinary destroys the lump (a repair, adding a bit, taking a bit off) while the thing itself survives. Keep the two candidates as physically alike as possible — same parts, same shape, same place at every moment — so the disagreement can't just be pointing at some visible difference, and don't let it hang on what the maker intended or on the thing being art.

  Then do the work. For the view that there are two objects here, one constituting the other, what's the verdict and why. For the "its just one object described twice" view, same. For the view that a lump can't survive gaining or losing a part, same. Then run the control: a variant of my case with the one feature that's actually doing the work removed, and show whether the interesting disagreement survives that. Say which feature it is. And tell me how someone defending whichever view comes out worst would attack the case — is the objection going to be that I've smuggled in a premise about persistence conditions instead of earning it from the story? It's for a short paper, so I mainly want to know which premise the case puts pressure on. One more thing I'm worried about: if the lump is gone at the end, the thing is still made of *something* — is it then made of a different lump, and does that break the whole case? Be honest if it does.
