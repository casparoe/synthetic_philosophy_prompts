prompt: |-
  I'm running a ninety-minute evening session for a group of adult learners — mostly people who took one stats course in college and now work in product or ops, plus two philosophy grad students who wandered in because the title sounded fun — as part of a short "how machines learn" series at a community centre. My slot is concept learning from a handful of examples, and I want to do it through Bongard problems, the ones where you get six little boxes on the left and six on the right and have to work out what the left ones have in common that the right ones don't. I don't want you to explain Bongard problems to me, and I don't want you to solve mine — I want you to plan the session: what has to be in place before the very first puzzle even makes sense to them, what depends on what (so the order is forced rather than just plausible), which single puzzle should carry the whole thing and what it needs to have and to lack in order to do that, which misconceptions they'll arrive with or form along the way, exactly where in the sequence I should head each one off, and what I should deliberately leave out and tell them I'm leaving out. And one question I can put to them at the end that would show me the idea landed, as opposed to them just having had a nice time.

  Some constraints from my end, because I'm drawing the puzzles myself rather than using the classic set — partly so nobody recognises them, partly so I can steer things. Three I've sketched: (a) every panel has exactly two shapes, a circle and a square, and position, colour and fill all vary meaninglessly; on the left the circle is always the bigger of the two, on the right it's always the smaller. (b) Left panels contain only shapes with no inward notch, right panels each contain at least one shape with a notch — but I drew them sloppily and it so happens that every left panel has an odd number of shapes and every right panel an even number, which I only noticed afterwards. (c) The rule isn't visible in any single panel: on the left, each panel is a rotation of the one above it, on the right each is a mirror of the one above it. I'm also toying with a fourth where I put all twelve panels on one side and none on the other, just to see what happens. Use whichever of these earns its place, tell me which one to lead with and which to cut, and be honest if one of them is doing damage.

  Things I don't want in the session: the formal learning-theory apparatus (capacity, generalisation bounds, that whole zoo) — one sentence of hand-waving at most, since half the room will glaze over; a debate about whether the original puzzles have unique correct answers, which I can see swallowing the whole ninety minutes; and any framing that makes it about AI benchmarks, because that pulls us off the actual question. What I do want them to come away with is the thing that surprised me when I first got into these, which is how much of "getting the concept" is really about knowing what the rule is allowed to be about, and how little a pile of examples settles on its own. I'll be honest, I'm not totally sure (c) is teachable in the time we've got, so if you think it should be a ten-minute coda rather than the centrepiece, say so and tell me what to put in its place.
reasoning: |-
  We are designing a 90-minute session on concept learning using Bongard problems for adult learners with some stats background and two philosophy students. The goal is to emphasize that "getting the concept" depends heavily on the assumptions about what the rule is allowed to be about, and that examples alone don't settle the concept without such assumptions.

   Constraints:
   - Avoid formal learning theory.
   - Avoid debate about unique correct answers.
   - Avoid AI benchmarks framing.
   - We have four puzzle sketches (a, b, c, and a fourth with all 12 on one side). We must choose and order them to build understanding.

   Key elements to establish before the first puzzle:
   1. The basic structure of a Bongard problem: two sides (left and right) with 6 examples each. The left side follows a rule (or shares a concept) that the right side does not.
   2. The task: find the rule that distinguishes left from right.
   3. The idea that the rule must capture all left examples and exclude all right examples.

   Order of puzzles should be forced by the concepts they introduce, starting simple and building complexity.

   Proposed order and rationale:

   Step 0: Introduction (5 minutes)
   - Explain the Bongard problem format: 6 boxes on the left, 6 on the right. The left boxes share a common rule (concept) that the right boxes do not have.
   - Emphasize that we are going to explore how we learn concepts from examples and how our prior assumptions (what we think the rule can be about) guide that.

   Step 1: Start with Puzzle (a) - The Circle Size Rule (15 minutes)
     - Description: Each panel has exactly two shapes: a circle and a square. On the left, the circle is always bigger; on the right, the circle is always smaller. Other variations (position, color, fill) are irrelevant and vary randomly.
     - Why start here?
       * It's simple and concrete: the rule is about a single, easily observable attribute (size of the circle relative to the square).
       * It introduces the idea that not all features matter (position, color, fill are distractors).
       * The rule is about a relationship between two objects (circle and square) in each panel.
     - How to run:
       * Show the puzzle and ask: "What rule distinguishes the left from the right?"
       * Let them work in pairs for 5 minutes, then discuss as a group for 5-10 minutes.
       * Expected answer: the circle is bigger on the left, smaller on the right.
       * Emphasize: we assumed the rule is about relative sizes, not about the absolute sizes or the other varying features.

   Step 2: Puzzle (b) - The Notch Rule (but with a twist) (20 minutes)
     - Description: Left panels have only shapes with no inward notch, right panels have at least one shape with a notch. However, the instructor drew it sloppily so that left panels always have an odd number of shapes and right panels an even number (which was unintended).
     - Why this next?
       * It introduces a more abstract rule (presence of a notch) but also a confounder (odd vs. even count).
       * This will lead to a misconception: some may think the rule is about the odd/even count of shapes.
       * We can use this to show that without prior assumptions, multiple rules can fit the examples, but we have to choose the one that was intended (or the one that is more natural).
     - How to run:
       * Show the puzzle and ask for the rule.
       * Let them work and then discuss. Expect two hypotheses: one about notches and one about the number of shapes.
       * Then reveal: "I actually intended the notch rule, but I drew it sloppily so that the number of shapes accidentally correlated. This shows that without knowing what features are relevant, we might latch onto the wrong one."
       * Emphasize: We have to consider what the rule is allowed to be about. If we had prior knowledge that notches are a possible feature and that the number of shapes is arbitrary (or vice versa), we might choose differently.

   Step 3: Puzzle (c) - The Transformation Rule (25 minutes)
     - Description: The rule isn't visible in any single panel. On the left, each panel is a rotation of the one above it; on the right, each is a mirror of the one above it. (Note: This requires that the panels are arranged in a specific order, so we must present them in two columns of six, with the top one being the starting point and each below being a transformation of the one above.)
     - Why this third?
       * It's more complex and requires looking at the relationship between panels (not just within one panel).
       * It emphasizes that sometimes the rule is about the sequence of examples, not just each example in isolation.
       * This is a key point: the rule might be about how the examples are generated (a process) rather than a static property.
     - How to run:
       * Present the six left panels in a column (with arrows indicating that each is a rotation of the one above) and the right six (each a mirror of the one above). But note: the rule is about the transformation between consecutive panels, so we must make that clear.
       * Explain: "In this puzzle, the rule isn't about what's inside each box by itself. It's about how each box relates to the one above it."
       * Ask: "What transformation is applied to each left panel to get the next one? And what about the right?"
       * Let them work and then discuss. They may need hints. The key is to notice the rotation vs. mirroring.
       * Emphasize: This rule requires a different kind of prior assumption — that the rule might be about the relationship between examples (the sequence) and not just the content of each example.

   Step 4: The Fourth Puzzle - All Panels on One Side (15 minutes)
     - Description: All 12 panels are on the left side, and the right side is empty. The task is to invent a rule that splits the 12 into two groups of 6: one that follows the rule and one that doesn't.
     - Why this last?
       * It flips the script: instead of finding the rule, they must invent one. This highlights that without constraints, there are many possible rules (even arbitrary ones) that can split the examples arbitrarily.
       * It drives home the main point: the examples alone don't determine the concept; we need to assume what kind of rules are allowed (the "concept class").
     - How to run:
       * Show the 12 panels (which can be a mix from previous puzzles or new ones, but ideally new and diverse enough to allow multiple splits).
       * Ask: "Invent a rule that would put 6 of these on the left and 6 on the right. What are some rules you can come up with?"
       * Then: "How many different rules can we invent? How do we decide which one is the 'right' one?"
       * Emphasize: Without prior assumptions about what rules are plausible (e.g., simple rules, rules based on certain features), we can't choose. This is the key takeaway.

   Step 5: Wrap-up and the Final Question (10 minutes)
     - Summarize the progression:
       * We started with a simple rule about a feature within a panel (size).
       * Then we saw that without knowing which features matter, we might pick a wrong one (notch vs. count).
       * Then we saw that the rule might not be about a single panel at all, but about the sequence (transformations).
       * Finally, we saw that without constraints on the rule, we can invent any arbitrary split.
     - The main point: Learning a concept from examples requires assumptions about what the rule is allowed to be about (the hypothesis space). The examples alone are not enough.

     - Final question to check if the idea landed:
       * "Suppose I show you a new set of examples (left and right) and ask for the rule. How would you know if you've found the right one? And what would you need beyond the examples to be sure?"
       * We are looking for answers that mention: prior knowledge about what features are relevant, simplicity of the rule, and the need for constraints on the rule space.

   Which puzzles to cut?
     - We are using all four, but note that (b) has a confound. We must be clear that the notch was the intended rule and the odd/even count was an accident. This is actually a valuable teaching moment about confounds and the need for clean data or clear assumptions.

   Time allocation (total 90 minutes):
     - Introduction: 5 min
     - Puzzle (a): 15 min
     - Puzzle (b): 20 min (including discussion of the confound)
     - Puzzle (c): 25 min (this is the most complex, so more time)
     - Puzzle (4): 15 min
     - Wrap-up: 10 min

   Why this order is forced:
     - Start with (a) because it's the simplest and introduces the basic format and the idea of relevant vs. irrelevant features.
     - Then (b) because it builds on (a) by introducing a more abstract feature (notch) and the issue of confounds. Without the simplicity of (a), (b) might be too confusing.
     - Then (c) because it requires a shift in perspective (from within-panel to between-panel). It's a bigger jump, so it comes after they are comfortable with the basic idea.
     - Then (4) because it requires them to reflect on the arbitrariness of rules without constraints, which is the culmination of the lesson.

   What to leave out and mention we're leaving out:
     - We are leaving out formal learning theory (VC dimension, etc.). We can say: "In formal learning theory, we study how the choice of the set of possible rules (the hypothesis space) affects learning. We're not going into that, but the key idea is that without such a set, learning from examples is impossible."
     - We are also leaving out the debate about whether Bongard problems have unique correct answers. We can say: "In the real world, we often have to make assumptions about what rules are plausible. We're not going to debate the uniqueness of answers because in practice, we use our prior knowledge to choose."

   Potential misconceptions and how to head them off:
     - In Puzzle (b): The misconception that the rule is about the number of shapes (odd vs. even). We head this off by revealing the accidental confound and discussing how without knowing which features are intended, we might get it wrong. We can also note that if we had more examples (without the confound) we could disambiguate, but in this case we only have six per side.
     - In Puzzle (c): The misconception that the rule must be about the content of each panel. We head this off by explicitly stating at the start: "This time, the rule isn't about what's inside each box by itself. It's about how each box relates to the one above it."
     - In Puzzle (4): The misconception that any rule is as good as any other. We head this off by discussing why we prefer simple rules (Occam's razor) and rules that use features we think are natural.

   Final note: The fourth puzzle (all on one side) is crucial for driving home the main point. Don't skip it.

   If time runs short, we can cut a few minutes from the discussion of (b) or (c), but the wrap-up is essential.

   Let's do it!
answer: |-
  ### Session Plan: Concept Learning via Bongard Problems  
  **Core Goal:** Emphasize that "getting the concept" depends on **assumptions about what the rule is allowed to be about**, not just the examples.  

  ---

  #### **Pre-Requisites (5–7 min)**  
  Before the first puzzle, establish:  
  1. **Structure:** "You’ll see 6 boxes on the left and 6 on the right. The left ones follow a hidden rule; the right ones break it."  
  2. **Task:** "Find the rule that perfectly separates the two sides—*no exceptions*."  
  3. **Key Insight (Seed Early):** "Rules aren’t 'in' the examples—they’re in *how you interpret* them. What you assume the rule *can* be about changes everything."  

  ---

  #### **Puzzle Sequence & Rationale**  
  Order is **forced** by escalating complexity of assumptions:  

  1. **Start with Puzzle (a): Circle Size Rule**  
     - *Why first?*  
       - **Forces attention to relationships:** Rule is about *relative size* (circle > square vs. circle < square), ignoring color/position/fill.  
       - **Teaches irrelevance:** Distractors (color, fill) vary randomly—must be ignored.  
       - **Low cognitive load:** Visually obvious; builds confidence.  
     - *How to run (10 min):*  
       - Show the puzzle. Ask: *"What’s the simplest feature that splits the sides?"*  
       - Debrief: Highlight that they *assumed* the rule was about **shapes’ relationships**, not aesthetics.  

  2. **Puzzle (b): Notch Rule (with Confound)**  
     - *Why second?*  
       - **Introduces feature ambiguity:** The unintended "odd/even shapes" confound forces discussion of *which features are valid*.  
       - **Exposes assumption-dependence:** Is the rule about notches (intended) or shape count (accidental)?  
       - **Teaches noise vs. signal:** Real-world data is messy; rules must be robust.  
     - *How to run (15 min):*  
       - Show the puzzle. Ask: *"What do you see? Is there more than one possible rule?"*  
       - Let them discover the confound. Ask: *"Which rule feels more ‘natural’? Why? What if I told you notches were intentional?"*  
       - Debrief: "Examples alone don’t tell you *which features matter*—you need assumptions about relevance."  

  3. **Puzzle (c): Transformation Rule (Sequence-Dependent)**  
     - *Why third?*  
       - **Forces a paradigm shift:** Rules can be about *relationships between examples* (rotations vs. mirrors), not just within a box.  
       - **Requires holistic thinking:** Must view the *entire column* as a sequence.  
       - **Caps the arc:** Most abstract, so it must follow concrete puzzles.  
     - *How to run (20 min):*  
       - Present panels in a column. Ask: *"Look at the boxes from top to bottom. What changes between them?"*  
       - Hint: *"The rule isn’t inside any single box—it’s in how they evolve."*  
       - Debrief: "You had to assume the rule could be about **patterns across examples**, not just static features."  

  4. **Fourth Puzzle: All Panels on One Side**  
     - *Why include?*  
       - **Reveals the core lesson:** Without constraints, infinite rules fit any split.  
       - **Elicits meta-thinking:** "What makes a rule ‘good’ or ‘obvious’?"  
     - *How to run (10 min):*  
       - Show 12 panels on the left. Say: *"Invent a rule that splits these into two groups of 6. How many rules can you create?"*  
       - Examples: "Left: shapes touching edges. Right: not." or "Left: contains red. Right: no red."  
       - Debrief: "Examples alone are meaningless. We need **constraints** (e.g., ‘rules must be simple’ or ‘about shapes’) to converge on an answer."  

  ---

  #### **What to Cut & Why**  
  - **Cut Puzzle (b)’s confound as a standalone:** Use it *with* the notch rule but explicitly call out the odd/even accident. Say: *"This was a mistake in my drawing—it shows why clean data matters!"* Don’t let it overshadow the notch lesson.  
  - **Cut formal theory:** Hand-wave with one sentence: *"Learning theorists call these constraints a ‘hypothesis space’—we’re skipping the math, but that’s the gist."*  
  - **Cut debate about uniqueness:** Preempt with, *"We’re not asking if there’s one ‘right’ rule—we’re asking how assumptions shape what we see."*  

  ---

  #### **Misconceptions & Interventions**  
  1. **"More examples = obvious rule."**  
     - *When:* During Puzzle (b) or (c).  
     - **Head off:** Ask: *"If I gave you 100 examples, could multiple rules still fit? What if I allowed ultra-complex rules?"* Use Puzzle (4) to prove it.  

  2. **"The rule must be visual."**  
     - *When:* During Puzzle (c).  
     - **Head off:** State early: *"Rules can be about transformations, counts, or even relationships between boxes—not just what’s drawn inside."*  

  3. **"There’s only one valid answer."**  
     - *When:* During debriefs.  
     - **Head off:** In the intro, say: *"We’re exploring how assumptions drive answers—not hunting for ‘the’ answer."*  

  ---

  #### **Final Question to Test Understanding**  
  **"If I show you a new Bongard problem, and you and I disagree on the rule, is one of us wrong? Or could we both be ‘right’ based on different assumptions?"**  
  - **Why it works:**  
    - Reveals if they grasp that examples underdetermine rules without constraints.  
    - Correct answer: *"Both could be right if we assume different things about what the rule can be (e.g., ‘only size matters’ vs. ‘only color matters’)."*  

  ---

  #### **Timing & Flow**  
  - Intro (5 min) → Puzzle (a) (10 min) → Puzzle (b) (15 min) → Puzzle (c) (20 min) → Puzzle (4) (10 min) → Wrap-up + Final Question (10 min).  
  - **Puzzle (c) as centerpiece:** It’s the climax—requires seeing patterns beyond single panels. If short on time, simplify by using only 4 boxes/side.  
  - **End strong:** Close with Puzzle (4) → Final Question to crystallize the "assumptions matter" takeaway.  

  **Why this works:** Each puzzle *forces* a new layer of assumptions (features → relevance → cross-example patterns → arbitrariness), making the sequence irreversible. The philosophy students will latch onto the epistemology; the stats/practitioners will see real-world implications for noisy data.
