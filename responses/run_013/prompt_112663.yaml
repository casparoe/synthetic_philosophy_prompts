            Symmetry: The set is not symmetric, so we don't expect symmetry.

            Scale-invariance: We didn't change the scaling, so it's not directly addressed.

            Monotonicity vs IIA: 
               - In Round 2, we added an option (50,0) that is very good for player1 but not for player2. 
               - The Nash solution does not change because the new option does not provide a point with a higher product of utilities and the old solution is still available. This is in the spirit of IIA: the solution is not affected by the addition of a dominated alternative.
               - The K-S solution does change because the ideal point for player1 increased from 40 to 50, and this changed the proportional allocation. This is the monotonicity property: when player1's ideal payoff increases (and player2's remains the same), player1's allocation in the solution should not decrease. Here, it increased from 26.67 to 29.41.

