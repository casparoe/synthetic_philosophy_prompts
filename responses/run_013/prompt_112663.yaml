            3. Risk aversion: The payoffs are in utils, but if they are risk averse, they might not value the points linearly. 
               Fix: Assure them that the points are in utils and that they should assume they are risk neutral. Also, the amounts are small so risk aversion might not play a big role.

            4. In Round 2, some pairs might not want to change if they are at (25,25) because it's still available. The new option (50,0) is not attractive. But the new K-S point (29.41,20.59) might be less attractive for player2 than the old agreement. So pairs that were at the old K-S point might not move to the new one because player2 would be worse off. This might not happen.
               We might see only the pairs that were at the old K-S point move if they are made aware that the ideal point changed. But will they be aware? 

               Alternatively, we can have a within-pair design: each pair does both rounds. In Round 1, they reach an agreement. Then we change the set and give them a chance to renegotiate. We might see renegotiation in the pairs that care about the ideal point.

            Given the time, we might have to accept that not many pairs will move. But the point is to have at least some movement to discuss.

          What the activity can't do:

            - It can't deliver the axiomatic characterization. We will lecture that.
            - It can't show that K-S is one of a whole zoo of solutions. We will lecture that.
            - It might not clearly show the movement from the old K-S point to the new one because the new one is less attractive for player2. We might need to choose a different added point. 

          Alternative added point: How about adding a point that is (40, 35) if it's not already in the set? It is not, because the set at x1=40 is x2=5. This point (40,35) would be above the current frontier. Then the new ideal point: a1=40 (unchanged) and a2=35 (which is the same as before, because at (10,35) we already have 35). So no change in the ideal point. Therefore, the K-S solution wouldn't change. 

          We want to change only one player's ideal. So we might add (45,5): then a1 becomes 45, a2 remains 35. 
            New feasible set: convex hull of (0,0), (10,35), (20,30), (30,20), (40,5), (45,5) -> wait, (45,5) is to the right of (40,5) but at the same y, so it doesn't change the frontier for player2. The new frontier would include a horizontal segment from (40,5) to (45,5). 
            Then the new K-S solution: ray to (45,35) -> slope=35/45=7/9.
            Intersect with the new frontier? 
              The new frontier has a new segment: (40,5) to (45,5): which is horizontal at y=5.
              So the ray y=(7/9)x intersects this segment? (7/9)*x = 5 -> x=5*9/7≈6.43 -> not in [40,45].
              Other segments: 
                seg1: (10,35) to (20,30): y=40-0.5x -> (7/9)x=40-0.5x -> 7x/9 + x/2 =40 -> (14x+9x)/18=40 -> 23x=720 -> x=720/23≈31.3 -> not in [10,20]
                seg2: (20,30) to (30,20): y=50-x -> (7/9)x=50-x -> 7x/9 +x=50 -> 16x/9=50 -> x=50*9/16=28.125 in [20,30] -> y=50-28.125=21.875.
            So the new K-S solution is (28.125,21.875) -> which is different from the old one (26.67,23.33). 
            Player1's gain: 28.125/45=0.625, player2's gain: 21.875/35=0.625 -> equal.

            Old K-S: 26.67/40=0.66675, 23.33/35≈0.6667 -> also approximately equal. So the new one has a lower gain (0.625<0.6667) because the pie didn't grow proportionally.

            But player1's allocation in terms of utility is now 28.125>26.67, player2's is 21.875<23.33. 
            Why would player2 agree to move to a point that gives them less? Only if they feel it is fair because the proportional gain is the same. 

            However, the new option (45,5) is not improving the situation for player2.

          Given the time, I think we should use the first added point (50,0) and accept that in the new K-S solution, player2 is worse off. We can then discuss in the debrief whether it is fair that player2 gets less in Round 2 just because player1's ideal point increased from 40 to 50, even though the new option (50,0) is not attractive for player2.

          Finally, the activity schedule:

            0. (5 min) Introduction: explain the bargaining problem, the feasible set, the disagreement point. Show the graph for Round 1. Assign roles: half the pairs have player1 as the one on the left, half as the one on the right? Or flip a coin within pair.

            1. (10 min) Round 1 negotiation.

            2. (5 min) Collect results. Each pair reports (x,y) on a slip. We plot these on a graph on the board.

            3. (5 min) Show the theoretical points: Nash and K-S for Round 1.

            4. (5 min) Round 2: introduce the new option (50,0) and show the new graph. 
               "Imagine now that the set of options expands to include (50,0). You have the opportunity to renegotiate if you wish. You have 5 minutes."

            5. (5 min) Collect Round 2 results and plot on a new graph.

            6. (5 min) Show the theoretical points for Round 2: Nash unchanged, K-S moved.

            7. (20 min) Debrief: 
               - What happened? Did any pairs change their agreement? 
               - Why? 
               - Map to properties: 
                   Pareto: did anyone pick a non-efficient point? Why? 
                   Symmetry: was the set symmetric? 
                   Scale invariance: not tested.
                   Monotonicity: when player1's ideal increased, did player1's allocation increase in the K-S solution? In the agreements, did the pairs that moved give more to player1?
                   IIA: the Nash solution didn't move. Did any pair that was at the Nash point move? Why or why not?
               - Discuss the appeal and the drawback of the dependence on the ideal point.

            8. (30 min) Lecture: axiomatic characterization, other solutions, etc. (as planned).

          Total activity time: 10+5+5+5+5+5+20 = 55 minutes, then lecture 30 minutes -> 85 minutes.

          This leaves 5 minutes for buffer.

          Let me know if this works.
answer: |-
  ### Bargaining Activity: Kalai-Smorodinsky vs. Nash  
  **Objective**: Make participants experience why K-S's dependence on the ideal point matters, and contrast it with Nash's IIA via a hands-on negotiation with tangible stakes.  

  ---

  ### **Setup**  
  - **Stakes**: Use **chocolate bars** (or small gift cards) to incentivize real negotiation. Each "point" = 1¢ (e.g., 2,500 points = $25). At the end, 1–2 pairs win based on total points.  
  - **Group Size**: Pairs (6 pairs for a dozen people).  
  - **Time**: 90 minutes total.  
  - **Materials**:  
    - Handouts with payoff tables (one per pair).  
    - Whiteboard to plot outcomes.  
    - Calculators (optional, for continuous bargaining).  

  ---

  ### **Payoff Tables**  
  Use **asymmetric** tables where:  
  - Naive 50/50 split is infeasible.  
  - **Nash solution ≠ K-S solution** (both on Pareto frontier).  
  - Ideal point is determined by extreme options.  

  #### **Round 1 Table (Feasible Set S1)**  
  Disagreement: (0, 0)  
  | Option | Player 1 | Player 2 |  
  |--------|----------|----------|  
  | A      | 10       | 35       |  
  | B      | 20       | 30       |  
  | C      | 25       | 25       |  
  | D      | 30       | 20       |  
  | E      | 40       | 5        |  
  - **Pareto Frontier**: The convex hull of A–E (show a graph on the handout).  
  - **Theoretical Points**:  
    - **Nash**: (25, 25) → Maximizes product of gains: 25 × 25 = 625.  
    - **K-S**: (27, 23) → Equal proportional gains:  
      - Player 1’s gain: 27/40 ≈ 67.5% (max = 40 at E).  
      - Player 2’s gain: 23/35 ≈ 65.7% (max = 35 at A).  
      (Note: Exact K-S is (26.67, 23.33); (27, 23) is a close integer proxy).  

  #### **Round 2 Table (Feasible Set S2 = S1 + New Option)**  
  Add Option F: (50, 0)  
  - **Why?**: Raises Player 1’s ideal payoff to 50 (from 40) but is terrible for Player 2.  
  - **Theoretical Points**:  
    - **Nash**: (25, 25) → Still available; no better product exists.  
    - **K-S**: (29, 21) → Proportional gains recalculated to new ideal (50, 35):  
      - Player 1: 29/50 = 58%.  
      - Player 2: 21/35 = 60%.  
      (Exact: (29.41, 20.59); (29, 21) is a proxy).  

  ---

  ### **Activity Flow**  
  #### **Part 1: Round 1 Negotiation (10 min)**  
  - **Instructions to Pairs**:  
    > *"Negotiate to agree on ANY point (Player 1, Player 2) in the feasible set. If you disagree, both get (0, 0). Points = ¢¢. One pair will win $ based on total points. You have 10 minutes."*  
  - **What Pairs See**: Handout with graph of S1 (vertices A-E) and options table.  
  - **What Only You Know**: Nash (25,25) and K-S (27,23) points.  

  #### **Part 2: Report Round 1 (5 min)**  
  - Pairs write their outcome on a slip.  
  - **Whiteboard**: Plot all outcomes on a graph (x=Player 1, y=Player 2). Mark Nash/K-S points.  
  - **Tally**: How many pairs are closest to Nash? To K-S? To other points?  

  #### **Part 3: Round 2 Negotiation (5 min)**  
  - **Instructions to Pairs**:  
    > *"A new option F is added: (50, 0). Player 1’s max possible is now 50. Renegotiate if you wish. You have 5 minutes."*  
  - **What Pairs See**: New graph of S2 (S1 + F) and updated table.  

  #### **Part 4: Report Round 2 (5 min)**  
  - Collect and plot outcomes. Mark new K-S point (29,21) and unchanged Nash (25,25).  

  ---

  ### **Debrief (20 min)**  
  Use whiteboard plots to drive discussion:  

  1. **Pareto Efficiency**:  
     - *Activity Link*: Did any pair pick a dominated point (e.g., interior of the hull)? Why?  
     - *Why It Matters*: K-S and Nash are efficient—they avoid wasted gains.  

  2. **Symmetry**:  
     - *Activity Link*: The set is asymmetric (Player 2’s max=35 > Player 1’s max=40). Did outcomes favor Player 2?  
     - *Why It Matters*: K-S doesn’t force symmetry; it responds to the *structure* of the set.  

  3. **Scale Invariance**:  
     - *Activity Link*: (Briefly mention) If we scaled payoffs (e.g., ×2), K-S/Nash would scale too. Not tested here.  

  4. **Monotonicity (K-S) vs. IIA (Nash)**:  
     - *Activity Link*:  
       - In Round 2, K-S moved from (27,23) to (29,21) because Player 1’s ideal increased (40 → 50).  
       - Nash stayed at (25,25) because adding F didn’t change the product-maximizing point.  
     - *Why It Matters*:  
       - **Monotonicity**: Feels fair—if your opportunities improve, you shouldn’t lose out.  
       - **IIA**: Feels stable—adding irrelevant options shouldn’t hurt you.  
     - **Key Tension**: In Round 2, Player 2’s payoff *decreased* in K-S just because Player 1’s *potential* (via F) improved. Is that reasonable?  

  5. **Equal Proportional Gains (K-S)**:  
     - *Appealing*: "Fair" compensation for what each player gives up.  
     - *Crazy*: Why should an impossible, extreme option (F) that no one chooses affect the outcome?  

  ---

  ### **Predictable Issues & Fixes**  
  1. **"Polite 50/50 Splitters"**:  
     - *Issue*: Some pairs default to (25,25) without negotiating.  
     - *Fix*: **Assign roles competitively**: "Player 1, your department is facing layoffs—you need these points. Player 2, your team expects a win."  

  2. **"Risk Aversion" Critique**:  
     - *Issue*: "Results just show risk aversion, not fairness."  
     - *Fix**: **Clarify stakes**: "Points ≈ ¢¢, not life savings. Focus on strategic fairness."  
     - *Rebuttal*: K-S/Nash are risk-neutral solutions—if payoffs are utils, risk aversion is built in.  

  3. **K-S Movement in Round 2**:  
     - *Issue*: Pairs at (25,25) won’t move. Pairs at (27,23) may resist moving to (29,21) since Player 2 loses.  
     - *Fix*: **Prompt renegotiation**: "Player 1, your ideal improved—shouldn’t you get more? Player 2, do you have new leverage?"  

  ---

  ### **What the Activity Can’t Do**  
  1. **Axiomatic Characterization**: Proving K-S requires monotonicity (lecture this).  
  2. **"Zoo of Solutions"**: Introduce other solutions (e.g., Egalitarian) in lecture.  
  3. **Continuous vs. Discrete**: Activity simplifies with tables; real K-S assumes convex sets.  
  4. **Strategic Bargaining**: Focus is on normative solutions, not strategic moves.  

  ---

  ### **Why This Works**  
  - **Tangible Stakes**: Chocolate/cash incentivizes real negotiation.  
  - **Clear Conflict**: Asymmetric set forces tradeoffs.  
  - **Dramatic Shift**: Adding F (useless but ideal-altering) exposes K-S’s dependence on the ideal point.  
  - **Debrief Anchors**: Whiteboard plots make monotonicity vs. IIA visceral.  

  End with: *"K-S rewards you for dreams you can’t reach. Nash rewards you for what’s achievable. Which team are you on?"*
