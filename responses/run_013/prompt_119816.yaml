answer: |-
  ### Case
  A security robot with a 2-hour battery must catch an intruder before escape in exactly 2 hours. It has two actions: **A** (immediate 1-hour chase, 90% success, uses 1 hour of battery) or **B** (1-hour deliberation followed by 1-hour chase, 99% success, uses 1 hour battery for deliberation and 1 hour for chase). The robot's *decision process itself* takes 15 minutes of real time and consumes 15 minutes of battery due to active computation. The robot starts at full battery, and both planners know all facts: success rates, timings, battery costs, and that the intruder escapes at 2 hours.

  ### Outside-the-world verdict
  It chooses **B**. It ignores the decision process, treating deliberation as a free choice. Comparing only the actions' outcomes, **B**'s 99% success dominates **A**'s 90%. The planner assumes the robot can instaneously "commit" to **B** without any decision cost, leaving exactly 2 hours for **B**'s sequence.

  ### Embedded verdict
  It chooses **A**. It accounts for the 15-minute decision as a physical event: after deciding, only 1 hour 45 minutes of battery and time remain. If it picks **B**, deliberation reduces battery to 45 minutes, but the chase requires 60 minutes, causing failure (0% success). **A** succeeds with 90%: after decision, 45 minutes of battery remain post-chase. The embedded planner sees the decision as consuming resources that **B** cannot afford.

  ### What's doing the work
  The split arises solely because the embedded planner includes the *resource cost of its own reasoning* (time and battery) in the causal chain, while the outside planner treats reasoning as an invisible, cost-free abstraction. If the decision process consumed no time or battery (e.g., instantaneous), both planners would choose **B**, as the resource constraint would not bind.

  ### The comeback
  The outside-the-world defender argues: "Precomputation avoids the dilemma. At design time, we simulate all scenarios externally and hardcode the robot to execute **B** without runtime decision-making. This eliminates the decision cost, allowing **B** to use the full 2 hours and achieve 99% success. Runtime decisions are only needed for novel situations, which this isn't."
