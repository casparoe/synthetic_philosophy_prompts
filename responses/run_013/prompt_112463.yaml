  First, I need to recall Hume's structure: duties to God, neighbor, and self. The user suggests the God prong has evaporated, which makes sense in a secular context like modern Canada. The self prong seems central now, especially with MAiD's focus on autonomy. But the neighbor prong is where things get messy—public healthcare systems complicate Hume's individualistic view.

