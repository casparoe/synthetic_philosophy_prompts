  **Case (c): A term we want to merge but the procedure says no**

  - Example: Let's take a term like 'customer'. 
    - Team A (from the original company) defines 'customer' as "any person who has made a purchase in the last 36 months".
    - Team B (acquired company) defines 'customer' as "any person who has made a purchase ever".

  - **Step 1 (Swap Test)**: 
    - The environments are the same (same market, same product). So swapping doesn't change the set? Actually, the environment is the same, so the set wouldn't change because of environment? But note: the definition is different. The swap test is about holding the definition fixed and changing the environment. Since the environment is the same, we don't see a change. So we proceed.

  - **Step 2 (Deference Test)**: 
    - There is no external authority for the definition of 'customer'. So we proceed to Step 3.

  - **Step 3 (Duplicate Test)**:
    - The set of customers for Team A (purchased in the last 36 months) is a subset of Team B's (any purchase ever). They are different. So we **Do Not Merge**.

  - But the board wants one number. The procedure says no.

  ---

  **Honest Assessment of the Procedure**:

  1. **Where are the judgment calls?**
     - **Step 1 (Swap Test)**: This requires the analyst to imagine a counterfactual scenario. It relies on the analyst's understanding of the environment and how the definition would apply. It might be difficult if the environment is complex or if the definition is vague. This step is the most philosophical and might be the shakiest when applied to real data.
     - **Step 2 (Deference Test)**: Determining deference might not always be explicit. The analyst might have to infer from context or ask the teams. Sometimes a team might think they are following an authority but actually be misinterpreting it.
     - **Step 3 (Duplicate Test)**: This requires checking the actual extensions. It might be time-consuming if the data is large or complex. Borderline cases might require escalation.

  2. **Does the externalism framing earn its keep?**
     - The Twin Earth insight is crucial for cases like 'recyclable' (Case a) where the definition is the same but the environment (recycling infrastructure) makes the meaning different. Without externalism, we might have merged them based on the same definition and then had incorrect reporting. So yes, it adds value in capturing environmental factors and deference to authority.
     - However, for many internal terms (like 'active user'), the old "do they pick out the same things?" (Step 3) might be sufficient. The externalism framework is especially useful when there are environmental or regulatory differences.

  3. **Limitations**:
     - The procedure does not handle cases where the meaning is purely internal (e.g., a term defined entirely by an algorithm that is team-specific and not tied to the external world). For such terms, the procedure might still work by treating the algorithm as part of the environment? But then the swap test would be: if we swap the algorithm, does the set change? But that's not the environment. We might need to adjust. However, in practice, many internal terms are about the real world or are used in reports that have consequences.
