  **Procedure: Term Alignment for Data Dictionary Merging**

  **Purpose**: To determine whether two terms (from two different teams) can be merged into a single term in the shared data dictionary.

  **Inputs**: 
  - Two terms (Term A from Team A, Term B from Team B) and their current definitions (as written by the teams).
  - Information about the environment in which each term is used (e.g., market, regulatory context, data collection setup).
  - Information about any external authorities the term defers to (e.g., regulator, standards body).

  **Output**: 
  - **Merge**: The terms can be merged (with a note on which definition to use or if a new one is needed).
  - **Do Not Merge**: The terms cannot be merged and must remain separate.
  - **Escalate**: The decision requires human judgment (by the data governance lead, legal, etc.).

  **Steps**:

  **Step 1: Swap Test (Environment Sensitivity Test)**
     - For Term A: Imagine the definition of Term A is used in Team B's environment. Would the set of things (the extension) that Term A picks out change? (Note: The definition remains exactly as written by Team A.)
     - Similarly, for Term B: Imagine the definition of Term B is used in Team A's environment. Would the extension change?
     - **Decision**:
       - If for either term the extension would change when the environment is swapped, then the terms are **environmentally sensitive** and likely not the same. Proceed to Step 2 to check for deference to an external authority that might override this.
       - If the extensions do not change in the swapped environments, then the terms are not environmentally sensitive and we can proceed to Step 3 (Duplicate Test) to check if the definitions are equivalent.

     *Note: This step requires the analyst to understand the environments and how the definition would apply. It's a thought experiment and may require some domain knowledge. If the environments are identical, then the swap test will trivially pass. But if they differ, the analyst must judge the impact.*

  **Step 2: Deference Test (Authority Deference Test)**
     - For each term, determine if there is an external authority (e.g., regulator, standards body) that the term is intended to align with. This might be explicit (e.g., "as defined by the FDA") or implicit (e.g., the team uses the term because they are subject to a specific regulation).
     - **Decision**:
       - If both terms defer to the **same external authority**, then the meaning of both terms is fixed by that authority. Therefore, we can merge the terms (using the authority's definition) even if the teams' written definitions differ. The procedure stops with **Merge** (and the merged definition should be the one from the authority). 
       - If one term defers to an external authority and the other does not, then they are not the same term. The procedure stops with **Do Not Merge**.
       - If both terms are local (no external deference) but the Swap Test (Step 1) indicated environmental sensitivity, then they are not the same term. The procedure stops with **Do Not Merge**.
       - If both are local and the Swap Test did not indicate environmental sensitivity (or if we skipped because environments were the same), then proceed to Step 3.

  **Step 3: Duplicate Test (Extension Equivalence Test)**
     - Check if the two definitions (from Team A and Team B) pick out the same set of things (the extension) in their own environments. 
       - Note: If Step 1 was passed (no environmental sensitivity) then we can assume the environments are either the same or the definition is robust to the differences. So we can compare the extensions in the current environments.
