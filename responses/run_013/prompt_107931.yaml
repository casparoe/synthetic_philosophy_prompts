    - Let's assume there is a regulatory definition of 'recyclable' in each market. Suppose Team A defers to the EPA (which defines recyclable based on what is accepted in the majority of communities) and Team B defers to a different standard (say, an EU directive). If they defer to different authorities, then we stop with **Do Not Merge**.
