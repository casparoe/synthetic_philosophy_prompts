  We are building a procedure based on semantic externalism (Twin Earth thought experiments) to determine when two terms from different teams can be merged in a shared data dictionary.

  The core idea: meaning is fixed not just by the description in the head of the user but also by the environment and the community of usage.

  We will design a three-step procedure:

  1. **Swap Test**: Hold the definition fixed and change the environment. Would the set of things the term picks out change?
     - If yes, then the term is sensitive to the environment, meaning that even if the definitions are identical, they might not be the same if the environments differ.
     - If no, then the term is not sensitive to the environment in a way that matters for the definition.

  2. **Deference Test**: Determine to whose usage the term is answerable. Is it the local team or an external authority (like a regulator, standards body, or experts)?
     - If the term defers to an external authority, then even if the local team's description is different, the meaning is fixed by the external authority. So if two teams defer to the same authority, they are using the same term even if their local descriptions differ.
     - If the term is local, then the meaning is fixed by the local environment and usage.

  3. **Duplicate Test**: Check if two different descriptions (from two teams) are actually picking out the same set of things in their respective environments (after considering the above tests). If they are, then merging is safe.

  The procedure must be run in order (1 -> 2 -> 3). We must also note that after step 1 or 2, we might already have a "no merge" decision. Step 3 is only for when the definitions are different but we want to see if they are extensionally equivalent.

