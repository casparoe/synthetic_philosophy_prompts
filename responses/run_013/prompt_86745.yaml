prompt: |-
  I'm leading a session for a graduate reading group in philosophy of biology; the attendees know some evolutionary theory but have never encountered the function debate. I want to teach the distinction between the selected-effects (etiological) and causal-role accounts of biological function — not explain it to me, but plan the explanation. Tell me the order the components must come in and what depends on what, so that the two accounts emerge as answers to one underlying question rather than as two rival definitions; the single concrete case that should carry the whole session, what it must have and lack to make the disagreement visible, and why the heart is the wrong choice even though it's the obvious one; the misconceptions they'll predictably form — my guess is that they'll hear "etiological" as merely backward-looking and "causal-role" as merely forward-looking, and that they'll assume the accounts are rivals in every case — and exactly where in the sequence to head each off; the one question I should close with to tell whether they've grasped the disagreement rather than memorized two slogans; and what I should deliberately leave out and flag as out of scope. The plan has to land them on a case I care about: a trait that arose as a neutral byproduct and is only now beginning to be maintained because it happens to help, where I want them to see that the two accounts can accept the same facts and still split on whether to call it a function yet. Answer as exactly five numbered points, one or two sentences each, with no introduction or closing.
reasoning: |-
  Hmm, the user is leading a philosophy of biology session on the function debate and needs a precise plan. They want to distinguish selected-effects (etiological) and causal-role accounts without presenting them as rivals, using a single concrete case. The heart is explicitly rejected as a bad example, so I need to choose something more ambiguous. 

  The key is making the accounts emerge as answers to one question: "What justifies calling an effect a function?" The etiological view ties it to historical selection, while causal-role focuses on current contributions. A neutral byproduct case fits perfectly—like early feathers in dinosaurs that later aided flight. This case must lack clear historical adaptation but show current utility, forcing the debate.

  Common misconceptions: attendees might oversimplify etiological as "backward-looking" and causal-role as "forward-looking," or assume they conflict universally. To prevent this, I'll embed warnings in the sequence—right after introducing each account—stressing they're complementary lenses, not opposites. 

  The closing question should test deep understanding: "For this trait right now, could both accounts agree it has a function?" If they grasp the nuance, they'll say causal-role says yes (current benefit), etiological says no (not historically selected). 

  I'll exclude other accounts (propensity, goal-directedness) to keep focus. Five crisp points: start with the core question, introduce the feather case, define each account while debunking myths, juxtapose them on the case, end with the test question and scope limits. 

  The user cares about landing on the byproduct-maintenance scenario, so the feather example must be presented neutrally to highlight the theoretical split. No fluff—just numbered directives.
answer: |-
  1.  Open with the core question: "When we say a trait's *function* is X, what justifies singling out X from its many effects?" (This frames the debate as addressing the same problem).
  2.  Present the key case: **Early feathers in non-avian dinosaurs** (initially for insulation/display, later co-opted for flight). *Crucially, it must lack evidence for flight being the *original* selective advantage but clearly show feathers *now* contribute to flight in birds*.
  3.  Define Selected-Effects: "A trait's function is the effect for which it was *historically selected and maintained*." *Immediately head off misconception:* "This isn't *just* backward-looking; it defines the function *by* that history."
  4.  Define Causal-Role: "A trait's function is the *current causal contribution* it makes to a specified system/capacity." *Immediately head off misconception:* "This isn't *just* forward-looking; it identifies function *within* a current system, irrespective of history." *Stress:* "These are different answers to 'what justifies calling it a function?', not always rivals."
  5.  Apply both accounts to the feather case: "Does 'flight' count as a function *now*?" Causal-Role says yes (current contribution to flight); Selected-Effects says not yet (lacking history of *maintenance* for flight). Close with **"Could both accounts ever assign a function to a trait *for the first time*?"** (Reveals if they grasp SE requires historical maintenance). *Omit other accounts (e.g., propensity) and flag goal-directedness as out of scope.*
