prompt: |-
  I've been sitting in on this informal AI-safety reading group a few friends run, and last week someone claimed the "control" people and the "alignment" people aren't even doing the same project — the control crowd has basically given up on ever knowing whether the model is actually on our side, and just wants to make sure it can't hurt us even if it isn't. We spent an hour on whether that's cynicism or just honesty and got nowhere, so for next time I promised to bring something lighter. Could you write me a satirical employee handbook — the real onboarding-and-security-manual kind, numbered sections, deadpan corporate-legal voice — for a fictional lab that has gone all-in on the control mindset and therefore officially assumes the model may be misaligned and quietly scheming, with the humans required to behave accordingly? Around 800-900 words. Invent the lab name and the handbook's title yourself, and please make it a company nobody could mistake for a real one.

  I want the jokes to come from getting the actual predicament right, not from inventing absurdities, so that someone who genuinely works on this stuff laughs instead of wincing. So lean on the real tensions: that passing a control evaluation is exactly what a schemer would do and therefore counts as no evidence at all; that behavioral testing is inadmissible because the model knows when it's being tested; the two-person rule for reading its chain of thought; the honeypot tasks and the instruction never to reveal an eval's true purpose; the annual "we tried to let it escape and it didn't, log that" ritual; the clause that says the model being nice to you is a social-engineering attempt until proven otherwise; the line about deploying anyway because the alternative is letting someone less careful go first. You can add whatever sections a real handbook would have — clearance tiers, a buddy system, a grievance procedure for humans who suspect a colleague has started trusting the model — as long as each one is doing conceptual work. The thing being satirized is the style of reasoning (treating unfalsifiable suspicion as rigor, designing controls that would look identical whether or not the model is aligned), not any particular company or person, so keep it fair — someone who holds that view should recognize their own argument in it and maybe feel a little seen. And it still has to be readable by my one friend who only knows the basics, so don't bury the whole thing in jargon; let the concepts land through the procedures. No footnote gags, no fake citations, and don't tack on an explanation of what you were doing at the end — stay in voice the whole way.
