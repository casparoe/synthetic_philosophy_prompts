prompt: |-
  I moderate a couple of online game and VR communities, and there's an argument I keep having that I don't have a name for, and it's bugging me. Here's the shape of it. Somebody's avatar gets grabbed in a social world, or somebody spends real money on a plot of virtual land and the platform deletes it, and the community splits in half. One side says it's just a game, it's just pixels, nothing actually happened to anybody. The other side says she really was harassed, he really did lose something. And what I've noticed is that the deciding factor isn't how bad the person feels, and it isn't any fact about what the virtual stuff is made of. It's whether the thing that happened went against the understood point of that particular world. In a shooter, getting shot is the whole idea, so nobody's been wronged. Take that exact same code event -- an avatar reaching out and touching another avatar -- and drop it into a world where you're not supposed to be able to touch anyone, and now it's a real violation that gets people banned. Same pixels, opposite verdicts. I've even watched a community flip on something without a single line of the software changing: the norm shifted, and all of a sudden a thing that used to be fine is a harm. So whether a virtual harm counts as real seems to ride on what the space is for and what its members take the rules to mean, not on the metaphysics of virtual objects at all. Which is odd, because those same people will tell you flat out that virtual objects aren't real when it's about whether the platform owes you anything for your deleted land.

  People keep telling me this is definately already a known idea and I should stop worrying about it. One friend says it's just Searle's institutional facts, another says it's the magic circle from game studies, another says it's the same as saying fictional objects aren't real. None of those quite lands for me. The institutional-facts one seems right that the harm depends on collective acceptance, but it doesn't explain why the same accepted rule structure can make one event a harm in one world and totally fine in another, and the magic circle seems to be about the boundary between play and ordinary life, which isn't what I'm circling.

  So: is there an established name for this specific thing -- that the reality or unreality of a virtual harm is fixed by the norms and purposes of the virtual world rather than by facts about virtual objects? If there is, tell me which concept it is and how it differs from the near misses above. If there isn't, coin one and define it, and tell me what it excludes -- is it just a restatement of "harms are socially constructed," or is it doing something seperate? Where does it break down, like cases where the harm seems real no matter what the norms say? I don't want just a label, I want the seams.

  Please answer in American English.
reasoning: |-
  Okay, the user is a moderator for online game and VR communities dealing with a recurring argument about whether virtual harms are "real." They've noticed that the judgment depends on the community norms and the purpose of the virtual space, not the physical aspects like pixels or code. They mention examples like avatar grabbing or deleted virtual land, where the same action can be seen as harmless or harmful based on context. 

  The user has looked into existing concepts like Searle's institutional facts, the magic circle from game studies, and the idea that fictional objects aren't real. But they feel these don't quite fit. Institutional facts explain collective acceptance but don't address why the same action has different outcomes in different contexts. The magic circle is about separating play from real life, which isn't their core issue. 

  I need to figure out if there's an established term for this specific phenomenon. If not, I should coin one. The key elements are: the harm's reality is tied to the virtual world's norms and purposes, not metaphysics. The user also wants to know how this differs from "harms are socially constructed" and where it breaks down.

  First, recalling related concepts. Searle's institutional facts involve collective intentionality assigning status functions (like money being valuable). That applies here because virtual worlds operate on agreed rules. But the user points out that the same action (e.g., touching an avatar) can be acceptable in a shooter but a violation in a social space. Searle doesn't explicitly handle how context changes the meaning of identical actions based on the space's purpose. 

  The magic circle (Huizinga) defines a boundary where special rules apply. But the user's issue is about variations within that circle, not the boundary itself. For example, why touching is okay in one game but not another, both within the magic circle. So that's a mismatch. 

  Fictional objects not being real is too simplistic. The harm feels real because of the social context, not the object's existence. The user's community members deny the reality of virtual objects when it benefits the platform (like compensating for deleted land) but affirm it when harm occurs. That inconsistency suggests the norm is what matters, not the object's ontology.

  Looking for a more precise term. Maybe "normative affordance"? Affordances are what actions an environment permits. Adding "normative" ties it to social rules. So normative affordances would be the actions allowed or prohibited by the community's norms. This explains why the same code event (touching) is permissible in a shooter (where combat is the norm) but a violation in a social space (where personal boundaries are enforced). 

  The user also mentioned communities flipping norms without code changes. Normative affordances can shift as community standards evolve, making previously acceptable actions harmful. This addresses the fluidity they observed. 

  How is this different from "harms are socially constructed"? While related, normative affordances specifically focus on the purpose and rules of the virtual environment. It's a subset where the context defines what constitutes harm. For example, being shot isn't harmful in a shooter because the norms permit it, whereas in a different context, it is. 

  Where does it break down? If someone experiences trauma regardless of norms (e.g., a veteran triggered by in-game gunfire), the harm transcends the virtual norms. But even then, the community might still see it as a norm violation if the space's purpose is non-violent. However, real psychological harm can occur outside the normative framework, showing limits. 

  Another breakdown: when norms are unjust. If a community normalizes harassment, the harm is real, but the normative affordance might not recognize it. Here, broader ethical principles might override the local norms. 

  So, coining "normative affordance" seems apt. It captures the dependency on context and purpose, differentiates from existing concepts, and acknowledges limitations where real-world harm overrides virtual norms.
answer: |-
  You're describing a **"normative affordance violation"** – and you're right that existing concepts don't perfectly nail it. Here's the breakdown, the name, why it fits, and its seams:

  ### The Core Idea & Why Existing Concepts Fall Short
  1.  **Institutional Facts (Searle):** Close! Collective intentionality *does* create the rules ("X counts as Y in context C"). The *problem* is Searle focuses on *assigning status* (this token *is* money, this person *is* president). Your observation is about **how the *same action* has radically different *normative consequences* depending on the *purpose* of the institutional context.** Being shot in a shooter isn't just *not a harm*; it's often the *point* and *desired outcome*. Searle explains the rule's existence, but not the **action-context mismatch** you see.
  2.  **Magic Circle (Huizinga/Caillois/Game Studies):** This defines the *boundary* between play/reality and the special rules *within* play. Your issue is **variation *within* the magic circle.** Why is touching an avatar harmful in *this* circle (VR Chat social space) but not *that* circle (VRChat combat game instance)? The magic circle sets the stage, but doesn't explain the internal rule *gradients* based on purpose.
  3.  **Fictional Objects Aren't Real:** This focuses on ontology (what *exists*). You're talking about **experiential harm and norm violation.** The *experience* of violation or loss is very real *within the social context*, regardless of the pixels' non-physicality. People denying the reality of the land when the platform deletes it are switching contexts – they're suddenly applying *external* ontological arguments to avoid *internal* institutional responsibility.

  ### "Normative Affordance Violation" - The Definition
  *   **Normative Affordance:** The perceived *socially sanctioned possibility for action* within a specific virtual environment, derived from its **shared purpose, rules, and community norms.** It defines what actions are expected, permitted, encouraged, discouraged, or forbidden *based on what the space is fundamentally *for***.
  *   **Violation:** An action that transgresses the boundaries of these normative affordances, causing harm *within the context of that specific virtual world's social reality*.
  *   **The Core Principle:** **The "reality" of a virtual harm is contingent upon its violation of the *normative affordances* defining that specific virtual space.** It's not about the pixels, the code, or the abstract existence of virtual objects; it's about **breaking the shared understanding of what *should* be possible or permissible *here*, for *this* purpose.**

  ### How It Explains Your Observations
  1.  **Shooter vs. Social Space Touch:** Identical code event.
      *   **Shooter:** Normative affordance = Combat, attack, elimination. Touching (shooting) is *afforded* and expected. No violation.
      *   **Social Space:** Normative affordance = Socializing, personal space, consent. Uninvited touching is *not afforded* and violates core norms. Real harm occurs *within the social reality of that space*.
  2.  **Community Norm Shift:** The software is static, but the *shared understanding of the space's purpose/norms* changes. What was once within the normative affordance (e.g., a certain type of teasing banter) is now understood to be outside it (harassment). The violation becomes real *because the affordance shifted*.
  3.  **Deleted Land vs. Harassment:** The inconsistency stems from **context switching.**
      *   **Harassment Claim:** Argued *within* the context of the virtual world's social norms and affordances ("Touching isn't allowed *here*!").
      *   **Land Deletion Compensation Claim:** Opponents switch context to the *external*, physical reality ("It's just data, not *real* property!"). They ignore the *internal* institutional fact (the land had value *within the game's economy and rules*) and the normative affordance of secure ownership *within that world*.

  ### How It Differs & What It Excludes
  *   **Vs. "Harms are Socially Constructed":** This is broader. Normative Affordance Violation is a *specific mechanism* within social construction. It pins the construction directly to the **functional purpose and agreed-upon rules of a *particular* institutional context (the virtual world)**. It explains *why* the construction differs between contexts with different purposes.
  *   **What It Excludes:** It *doesn't* claim all virtual experiences are equally impactful. It focuses on **harm arising *specifically* from the violation of the space's internal norms/purpose.** It excludes:
      *   **Systemic Technical Failures:** A world-wide server crash deleting everyone's land is a technical failure, not necessarily a *norm violation* (unless the norm is "reliable persistence").
      *   **Personal Aversions Unrelated to Norms:** Someone with a phobia of the color blue being distressed in a blue-themed world isn't a normative affordance violation unless the world *explicitly* normed against blue as harmful.

  ### Where the Seams Show (Breakdowns)
  1.  **Trauma Transcending Context:** A veteran experiencing a PTSD episode from in-game gunfire *regardless* of being in a sanctioned shooter. The harm here originates *outside* the virtual normative affordance structure, though the virtual event triggered it. The *intensity* of the harm might eclipse the internal norms.
  2.  **Unjust Norms:** A virtual world where harassment is *normative* (e.g., a toxic PvP zone designed for griefing). According to NA Violation, harassment *isn't* a violation *within that specific context* because it's afforded. However, the harm experienced might be very real and stem from a violation of *external*, universal ethical norms or personal boundaries. This highlights that normative affordances can be morally problematic.
  3.  **Platform Power vs. Community Norms:** The platform deleting land might violate the *player community's* normative affordance of secure ownership, but the *platform's* internal rules (EULA) might afford them that right. Who defines the "authoritative" normative affordance? (Usually the platform wins, leading to the "it's not real" dismissal).
  4.  **Cross-Context Spillover:** Severe harassment in a virtual space causing real-world anxiety or reputation damage. The harm leaks *out* of the virtual context, demonstrating that while the *violation* is defined internally, the *consequences* aren't always contained.

  ### Why "Normative Affordance Violation" Fits Best
  *   **"Normative":** Explicitly centers the *social rules and purposes* as the source of judgment.
  *   **"Affordance":** Borrows from design/psychology (Gibson/Norman) – what the environment *permits* or *invites*. Here, it's *socially* defined affordances within the virtual context. It captures the "point of the world" aspect perfectly.
  *   **"Violation":** Clearly denotes the transgression causing the harm.
  *   It explains the **context-specificity**, the **purpose-driven logic**, the **community dependence**, and the **fluidity** you observe far better than the alternatives. It directly addresses the **action-context mismatch** as the core determinant of harm.

  You've nailed a crucial nuance in how virtual social realities function. The "reality" of the harm isn't in the pixels, it's in the broken expectation – the violation of what *we all agreed this space was for*. That's a Normative Affordance Violation.
