  We are presented with an argument that seems to lead to an absurdity when applied to a single person over time. The goal is to diagnose which step should be rejected, why it looked acceptable, and what the cost of rejecting it is.

  The setting is the discursive dilemma: a committee of three members votes by majority on three propositions: P, Q, and R, where R is equivalent to P and Q. The individual judgments are coherent, but the majority vote leads to an inconsistent set: P true, Q true, but R false.

  The argument proceeds as follows:

  (1) The committee's judgments are its own, not merely a tally of its members' opinions.

  (2) A body of judgments is coherent only if it is consistent and closed under the entailments its holder accepts.

  (3) A procedure respects the members just in case the committee's judgment on each proposition tracks the majority of members' judgments on that proposition.

  (4) Any procedure that respects the members (as in (3)) will, on some profile of individually coherent members, yield an incoherent committee. (This is the formal result of the discursive dilemma.)

  (5) Therefore, we cannot demand both respect for the members and coherence; one must give way.

  (6) The same structure recurs within a single person over time: if we consider the person at three different times (each with evidence that leads to judgments that are individually coherent but collectively inconsistent when aggregated by majority), then either we must disregard some of the person's own judgments or face incoherence.

  (7) But a single person can be coherent by revising judgments. Therefore, (6) is absurd, so the whole argument (including (4)) must be unsound.

  The colleague is inclined to keep (1) and (2) and suspects the trouble is in (6). Let's analyze step (6).

  Step (6) draws an analogy between the committee and a single person over time. It says that if we treat the three temporal stages of a single person as three "members", then applying a majority rule to the judgments of these stages would lead to the same problem. Specifically:

  - At time 1, the person judges P true (based on evidence then).
  - At time 2, the person judges Q false (based on evidence then) and thus R false.
  - At time 3, the person judges P false and Q true (so R false).

  But note: the example in step (6) does not exactly match the committee's profile. The committee profile was:

  - Member 1: P yes, Q yes, R yes
  - Member 2: P yes, Q no, R no
  - Member 3: P no, Q yes, R no

  The temporal stages in step (6) are described as:

  - First installment: judgment on P (yes, presumably, but the example does not specify the first judgment fully). Then it says: "on each occasion I form the judgment best supported by the evidence so far". And we are to treat the three successive selves as three members.

  However, the example in step (6) does not specify the three judgments on each proposition at each time. Instead, it says:

  "Suppose the evidence bearing on P, Q and R reaches me in three installments, and on each occasion I form the judgment best supported by the evidence so far, accepting throughout the same connection among the three propositions."

  But note: at each time, the person is forming judgments on all three propositions? Or only on the ones for which evidence has arrived?

  The problem is that the evidence arrives in installments. Let's assume:

  - Installment 1: evidence about P arrives. The person forms a judgment on P. But what about Q and R? Since no evidence about Q, the person might not form a judgment on Q and R? Or perhaps the person must form judgments on all three at each time? The step does not specify.

  Moreover, the person is supposed to be forming the judgment best supported by the evidence so far. But at time 1, the person only has evidence about P. So at time 1:

  - The person has evidence for P: so P is judged true. 
  - What about Q? Without evidence, the person might suspend judgment, or perhaps assume the default? But step (6) says the person forms the judgment best supported by the evidence so far. So if there is no evidence about Q, then the person might not form a judgment on Q? But then we don't have a complete set at each time.

  Alternatively, perhaps the person is required to form judgments on all propositions at each time, using the available evidence. But then at time 1, without evidence about Q, the person might have to judge Q based on no evidence? That might lead to an arbitrary judgment.

  This is the first issue: step (6) assumes that at each time the person forms a complete set of judgments (on P, Q, R) that are coherent and based on the evidence so far. But if the evidence arrives piecemeal, then at time 1, the person might have evidence for P but not for Q. How can the person form a judgment on R without knowing Q? The person might withhold judgment on R until both are known? But then the set of judgments at time 1 is incomplete (only P is judged) and so not coherent in the sense of (2) (which requires a complete and consistent set? Note: step (2) says "coherent only if consistent and closed under entailments", but it doesn't explicitly require completeness. However, the committee's judgments are described as "complete" in the setting. The step (6) says "each individually coherent", which in the committee setting meant complete and consistent and closed? But in the temporal case, the person at each time might not have a complete set?).

  Moreover, the person is assumed to accept the connection R = P∧Q throughout. So at time 1, if the person judges P true and has no evidence about Q, then the person must withhold judgment on R? Because without Q, we don't know R. But then at time 1, the judgments are P true, Q unknown, R unknown. This set is consistent? It is consistent, but it is not complete (since Q and R are not judged). However, step (2) requires closure under entailments. If the person accepts that R = P∧Q, then from P true and Q unknown, R is unknown. So the set is closed? But note that the entailment doesn't force a judgment on R when Q is unknown. So the set {P true, no judgment on Q, no judgment on R} is consistent and does not violate the entailment. But in the committee setting, each member had a complete set (yes or no on each). So the analogy breaks because the temporal stages do not have complete judgments.

  Alternatively, if the person is forced to form a judgment on Q and R even without evidence, then the judgments might be arbitrary and not necessarily coherent. For example, at time 1, without evidence about Q, the person might judge Q arbitrarily. Then the set might be inconsistent? For instance, if at time 1 the person judges P true and Q true (without evidence for Q) then R true. But if later evidence shows Q false, then the time-1 judgment on Q was wrong. But step (6) says that each temporal stage is individually coherent? How can we guarantee that if we force judgments without evidence?

  The key point: in the committee case, each member has a complete and coherent set of judgments. In the temporal case, at a given time, the person might not have enough evidence to form a complete set of judgments that are both coherent and in accord with the evidence. Therefore, step (6) is making an invalid analogy because it assumes that at each time the person forms a complete set of judgments that are coherent (like the committee members) and that the evidence arrives in such a way that the judgments at each time are coherent and complete. But in reality, when evidence arrives piecemeal, the person might not be able to form a coherent and complete set at every intermediate time without making arbitrary judgments.

  Moreover, note that the procedure in step (3) is defined for each proposition independently: the committee's judgment on each proposition is the majority of the members' judgments on that proposition. In the temporal case, step (6) proposes using a majority of the temporal stages for each proposition. But why would a single person aggregate their own temporal judgments by majority? That is not the typical way of revising beliefs. Typically, a person revises their beliefs in light of new evidence, and the current belief set is the one that matters. The person does not take a vote among their past selves.

  Therefore, step (6) is problematic because:

  (a) It assumes that at each time the person forms a complete set of judgments (on all propositions) that are coherent, even when the evidence is incomplete. This might force arbitrary judgments that are not well-supported by the evidence.

  (b) It applies a majority rule to the judgments of the temporal stages, which is not how a rational individual revises beliefs. Instead, the individual uses the total evidence available at the current time to form a coherent set.

  Thus, the analogy between the committee and the temporal stages of an individual fails.

  Why did step (6) look acceptable? Because on the surface, we can think of a person at different times as analogous to committee members. And if we force the person to form complete judgments at each time (even without sufficient evidence) and then aggregate them by majority, we get the same inconsistency. But the problem is that a rational individual would not form a complete judgment on a proposition without evidence. And even if they did, they would not aggregate their past judgments by majority; they would use the current total evidence.

  What does rejecting step (6) cost? It means that we cannot use the temporal analogy to challenge the formal result (4). The formal result (the discursive dilemma) stands for collective decision-making. However, it does not extend to the individual case because individuals do not aggregate by majority over time. Therefore, the argument for the absurdity in (7) falls apart.

  But note: step (7) says that a single person can be coherent by revising. This is true, and we want to keep that. So we must reject the analogy in (6) that leads to the absurdity.

  Therefore, the step to reject is (6). The cost of rejecting (6) is that we cannot use the individual case to challenge the formal result (4) about collective decision-making. We must accept that in collective decision-making, if we use a procedure that respects each member on each proposition (by majority), then we risk incoherence. This is a well-known problem in social choice theory.

  Alternatively, we might question the definition of respect in (3). But the colleague wants to keep (1) and (2). (1) says the committee's judgments are its own, so we are committed to the committee as an agent. (2) is a requirement of rationality. (3) is a plausible definition of respect for members. (4) is a proven result. (5) follows from (2) and (4). So the argument for (5) is sound for the committee.

  The problem arises only when we try to apply the same reasoning to the individual. Therefore, we should reject (6) because the analogy does not hold: the temporal stages of an individual are not like members of a committee in the way that the aggregation procedure is applied.

  Thus, the diagnosis:

  - Step (6) should be rejected.
  - It looked acceptable because it drew an analogy between the committee and the temporal stages of an individual, but it failed to account for the fact that an individual at a given time does not (and should not) form complete judgments without sufficient evidence, and that an individual does not aggregate their beliefs over time by majority rule.
  - The cost of rejecting (6) is that we cannot use the individual case to undermine the formal result (4) about collective decision-making. We must accept that collective decision-making faces a dilemma between respect for individual judgments and collective coherence.

  This leaves the formal result (4) intact for collective bodies, but it does not extend to the individual case. Therefore, the argument in (7) that the whole argument must be unsound is avoided. The formal result (4) is not challenged by the individual case.

  Moreover, we can keep (1) and (2) for the committee: the committee's judgments are its own and it should be coherent. But we see that the majority procedure (which respects the members) does not guarantee coherence. Therefore, we might have to relax either the respect condition or the coherence requirement for the committee. This is the familiar lesson of the discursive dilemma.

  In the individual case, we have no such problem because the individual does not use a majority rule over time. The individual revises their beliefs to maintain coherence with the total evidence.

  So the argument is a reductio of the idea that the same aggregation procedure (majority on each proposition) should be applied to an individual over time. But since we don't do that, there is no reductio of the individual's ability to be coherent. The formal result (4) remains valid for collective bodies.
answer: |-
  The argument presents a compelling challenge, but the flaw lies in step (6), which draws an analogy between the committee's decision-making and the judgments of a single person over time. Here's a detailed diagnosis:

  ### **Step to Reject: Step (6)**
  **Why Step (6) Should Be Rejected:**  
  Step (6) equates a single person's judgments over time (formed in response to evidence arriving in installments) to the judgments of distinct committee members. It then applies the same "respect" condition (step 3) to these temporal stages, arguing that a majority vote across the person's "successive selves" would lead to incoherence. This analogy fails for two reasons:  
  1. **Incompatible Epistemic Roles:**  
     - In the committee case, each member has a *complete and consistent* set of judgments based on their *full* evaluation of all propositions. Member 1, for example, affirms P, Q, and R simultaneously, ensuring internal coherence.  
     - In the temporal case, a person's judgments at each stage are *partial and revisable* based on *incomplete evidence*. For instance:  
       - At time 1, evidence may support P (e.g., "research is strong"), but without evidence for Q, the person cannot reasonably form a judgment on Q or R. They might suspend judgment on Q and R, or hold tentative views, but this set is *not complete*.  
       - At time 2, evidence for Q arrives (e.g., "teaching is weak"), but if evidence for P is absent or outdated, the person may revise P or leave it unjudged.  
     The person's judgments at each stage are not required to be complete or jointly coherent with future stages. Unlike committee members, the person is engaged in a *dynamic process of belief revision*, not a static aggregation. Applying a majority rule to these temporal stages misrepresents how individuals reason: they integrate new evidence into a *current* coherent whole, not vote among past selves.  

  2. **Misapplication of the "Respect" Condition:**  
     - Step (3) demands that the committee's judgment on each proposition "tracks the majority of members' judgments." For a person over time, this would mean aggregating judgments from t₁, t₂, and t₃ by majority rule (e.g., affirming P if two out of three temporal stages affirm P).  
     - However, individuals do not use majority voting over their past judgments. Instead, they *revise* beliefs: new evidence overrides old judgments, and coherence is maintained by updating the *entire* belief set. For example:  
       - If at t₁ the person judges P true (based on early evidence), but at t₃ new evidence shows P false, they reject the t₁ judgment. There is no "disregarding" of past judgments (as step (6) laments)—only rational revision.  
     Step (6) imposes an artificial aggregation rule (majority voting) that is foreign to individual reasoning. The apparent "incoherence" arises only if we force this rule, but individuals avoid it by not using such a procedure.

  **Why Step (6) Looked Acceptable:**  
  The analogy seems plausible because both cases involve multiple judgments on interconnected propositions (P, Q, R). It appeals to the idea that "temporal selves" could be seen as analogous to committee members, especially if we imagine a person reflecting on past judgments as if they were independent inputs. This resonates with formal models (e.g., "time-slice epistemology") that treat beliefs at different times as discrete entities. Additionally, the discursive dilemma (step 4) shows that majority voting creates incoherence in groups, so extending it to individuals suggests a broader paradox. However, this ignores critical differences: individuals accumulate and integrate evidence, while committee members have fixed, complete views.

  **Cost of Rejecting Step (6):**  
  - **Loss of a Unified Theory:** Rejecting step (6) means abandoning the idea that collective and individual judgment aggregation can be modeled identically. This limits attempts to generalize social choice results (like the discursive dilemma) to individual epistemology.  
  - **No Challenge to the Formal Result:** The discursive dilemma (step 4) remains intact for collective decisions. Groups using proposition-wise majority voting *can* face incoherence, and step (5) still holds: committees cannot simultaneously guarantee coherence and respect for all member judgments on each proposition.  
  - **Accepting Revision Over Aggregation:** We must acknowledge that individuals maintain coherence through belief revision, not static aggregation. This preserves step (7)—individuals can be coherent—but at the cost of making the individual case irrelevant to critiquing the collective result.  

  ### **Broader Implications**
  - **Steps (1)–(5) Stand Unharmed:** The formal result (step 4) is well-established (it reflects theorems in judgment aggregation theory). Steps (1) and (2) are defensible: the committee's judgments are its own and should be coherent. Step (3) defines a minimal "respect" for members, and step (5) correctly concludes that coherence and respect conflict in committees.  
  - **Step (7) Is Saved:** Individuals avoid incoherence by revising beliefs, so no absurdity arises. This aligns with how rationality works: new evidence prompts updates, not votes among past states.  
  - **The Core Issue:** The argument is a reductio of the *procedure* (majority voting on each proposition), not the subject matter (collective or individual rationality). For committees, it highlights a trade-off between fairness (respecting members) and rationality (coherence). For individuals, it shows why revision—not aggregation—is essential.  

  In summary, step (6) fails because it misapplies a collective aggregation rule to individual reasoning. Rejecting it costs a neat generalization but saves both the discursive dilemma for groups and the possibility of coherent individual judgment. The trouble is not with the formal result but with overextending it.
