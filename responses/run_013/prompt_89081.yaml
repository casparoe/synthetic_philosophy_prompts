prompt: |-
  I'm a third-year PhD student in philosophy and I've somehow ended up running next term's grad reading group on consequentialism. The one session I actually care about getting right is cluelessness — it keeps surfacing in my own work on long-term effects and I've never once seen it taught well. So don't explain it to me, give me a plan for a 75-minute session. What has to be on the table before cluelessness even looks like a problem? My sense is people jump straight to it without ever having felt how the expected-value machinery is *supposed* to work, so the order really matters. Which single case should carry the whole thing, and what does it need — a concrete act, a plausible long causal chain, an effect whose sign we genuinely can't pin down — and what should it avoid (no charity-donation examples, everyone's seen those, and I don't want it collapsing into a debate about which charity is best). I want the deep version to land, not the shallow "we should just do more research" version: the thing I want them to feel in their bones is the gap between "we're missing the facts" and "even handed all the facts the ranking is up for grabs". Tell me exactly where to head off the standard wrong turns — "this just means better evidence", "so consequentialism is dead and we should all be virtue ethicists", "expected value still works, just use big error bars" — and give me one closing question that tells me whether it landed. Last thing: what do I deliberately leave out at this level? I've got 75 minutes and no patience for the infinite-value stuff unless you tell me it's actually load-bearing here.
