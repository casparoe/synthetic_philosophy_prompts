  For structure, sequencing matters. We must first establish how expected value calculations SHOULD work before breaking them. Starting with a simple EV example (like Parfit's Bridge) creates that baseline understanding. Then we transition to the butterfly case, slowly adding layers of complexity. The critical move is showing how even perfect knowledge of the causal chain doesn't resolve the valuation problem - that's when cluelessness bites deepest.

  I should prepare counters to predictable objections. When someone inevitably says "better forecasting fixes this," I'll emphasize how the valuation itself remains indeterminate. For the "consequentialism is dead" reaction, I'll distinguish abandonment from refinement. And for the "big error bars" proposal, I'll point out that error bars don't capture the structural uncertainty about whether we're even measuring the right thing.

