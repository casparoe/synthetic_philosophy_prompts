prompt: |-
  I chair the governance committee of a mid-sized grantmaking foundation — roughly eight million dollars a year, a conventional expert-panel review process, a board that is risk-tolerant in principle and litigious about process in practice. At the next meeting the trustees will vote on whether to run the coming grant round as a pilot using a decision-market procedure of the kind associated with Robin Hanson's futarchy. I have to circulate a written opinion beforehand and I would like you to draft it.

  The design on the table is as follows. The trustees would first fix, in advance and by ordinary majority vote, a single outcome metric, a threshold, and a measurement window. Staff would then post the shortlist, about twenty proposals. For each proposal a market would open in a contract that pays out in proportion to the metric as measured at the end of the window if that proposal was funded, and pays nothing if it was not. Anyone may trade, anonymously, against a small liquidity subsidy. At a stated closing time the top k proposals by price are funded, where k is whatever the budget allows, and execution is automatic. Two amendments have been offered. The first adds a guardrail: a proposal is disqualified no matter how high its price if it falls below a pre-registered floor on a second metric measured alongside the first. The second requires that the metric and threshold be locked before staff reveal which proposals made the shortlist, so that the metric cannot be chosen with the particular proposals in view.

  The board is split three ways. One faction thinks the pilot is the only honest way to separate what we want from what we believe will work. A second thinks it launders the funding decisions of whoever holds the most capital and answers to no one. A third wants to run it as a shadow market whose prices are recorded and ignored, which I regard as paying the full cost of the apparatus for none of the benefit.

  Please produce a decision memo that reaches a definite recommendation on the design as tabled — adopt it as written, adopt it with named amendments, or decline — with reasons the proposers could actually respond to and a clear time frame for whatever you recommend. Engage the strongest version of the position you reject, not the weakest. The analysis should turn on the mechanism rather than on the reputation of markets, and should address at least the following: whether the separation of values from beliefs survives the fact that the trustees must choose the metric, given that the choice of metric largely selects the winners; whether the usual defense that manipulation merely subsidizes arbitrageurs holds once a bidder's stake in the market is smaller than their stake in the funding decision, and what the ratio would have to be for the defense to work; what a thin, anonymous market with twenty assets and a handful of informed participants does to the informativeness of prices, and whether automatic execution makes that better or worse; whether the guardrail amendment guards anything or merely relocates the discretion it was meant to remove; whether the lock-in amendment is coherent, given that the shortlist is drawn from a pool the trustees already know; and what a charitable foundation owes its donors and beneficiaries by way of a decision procedure that can be explained to them after the fact. Note also that the metric does not exist at the time of betting and will be measured only after the money is spent, and say what follows from that.

  Assume no trustee will read past four pages. Do not cite literature or supply a reading list; I will handle provenance myself. Do not assume the board knows the vocabulary of market design, so define anything you use.
reasoning: |-
  Okay, the user chairs a governance committee for a mid-sized foundation and needs a decision memo on whether to adopt a decision-market pilot based on futarchy principles. This is a complex governance question with technical, ethical, and practical dimensions. 

  First, I need to unpack the core tensions: the foundation's stated risk tolerance versus process litigiousness, the three-way board split (proponents, critics wanting to block, and compromisers wanting shadow markets), and the specific design questions around metric selection and market mechanics. The memo must resolve these while meeting strict constraints - four pages max, no jargon, no citations.

  The key philosophical dilemma is whether separating "values" (chosen metric) from "beliefs" (market predictions) actually works when trustees select the metric. I'm skeptical because metric choice inevitably expresses values AND shapes outcomes. For example, choosing "lives saved" versus "cost per life" would produce different winners even with perfect predictions. The lock-in amendment helps but doesn't solve this - trustees know the applicant pool even if not the shortlist.

  On manipulation risks: the standard "manipulation subsidizes truth-tellers" argument fails here. Foundation grants can create asymmetric stakes - a $50k grant might generate $1M in benefits for a bidder, making market manipulation profitable even at a loss. With thin anonymous trading, we can't detect or prevent this. 

  The thin market issue is critical. Only 20 proposals and few informed traders? Prices will be noisy at best. Automatic execution worsens this by removing human judgment that could filter out irrational prices. The guardrail amendment just shifts discretion to choosing the second metric - it doesn't eliminate subjectivity.

  Post-hoc metric measurement creates moral hazard. Grantees might game whatever metric is chosen once funded, and we can't adjust for external shocks during the measurement window. 

  Given all this, recommending against the pilot seems necessary, but I should offer alternatives: perhaps test the market as an advisory tool first, or run small parallel markets for learning. The shadow market idea is wasteful - all cost no benefit.

  The memo must conclude decisively while acknowledging the valid pro-pilot argument: that it forces explicit metric choices and tests assumptions. But the operational risks outweigh theoretical benefits at this stage. Frame it as "not yet" rather than "never" to satisfy progressives.

  For tone: authoritative but not dogmatic. Match the user's sophisticated style - they clearly understand governance complexities. Avoid lecturing; focus on actionable analysis. Use plain analogies ("market as voting machine" etc.) to explain mechanisms without jargon.
answer: |-
  **MEMORANDUM**  
  **To:** Board of Trustees  
  **From:** Governance Committee Chair  
  **Date:** 21 October 2023  
  **Subject:** Recommendation on Decision-Market Pilot for FY2024 Grant Round  

  ---

  ### **I. Recommendation**  
  **Decline the pilot in its current form, including proposed amendments.** The design fails to resolve core tensions between the foundation’s values, operational realities, and the mechanism’s theoretical promises. Instead, direct staff to:  
  1. Develop a limited *advisory* decision market (no automatic execution) for 1–2 high-stakes grants in FY2024;  
  2. Report quarterly to the committee on metric robustness and market liquidity;  
  3. Return in 12 months with a revised proposal addressing the concerns below.  

  ---

  ### **II. Analysis of Key Issues**  
  #### **A. Separation of Values vs. Beliefs Collapses at Metric Selection**  
  - **The claim:** Markets isolate "beliefs" (what *will* work) from trustee "values" (what outcomes we *want*).  
  - **The flaw:** Choosing the metric *is* a value-laden act that predetermines winners. For example:  
    - A metric like "jobs created in low-income ZIP codes" favors workforce proposals;  
    - "Carbon tons sequestered" favors environmental tech.  
  - **Lock-in amendment (pre-shortlist metric setting)** does not solve this: Trustees know the *general pool* of applicants (e.g., "healthtech startups"), allowing strategic metric choices.  
  - **Conclusion:** Trustees cannot delegate responsibility for outcomes by "fixing" a metric. The market merely automates bias embedded in metric selection.  

  #### **B. Manipulation Risk Outweighs Arbitrage Defense**  
  - **The claim:** Manipulators (e.g., bidders inflating their proposal’s price) are countered by arbitrageurs (traders profiting by correcting prices).  
  - **The vulnerability:** When a bidder’s *stake in the funding outcome* exceeds their *cost to manipulate the market*, manipulation pays.  
    - Example: A $50,000 grant could yield $1M+ in reputational/value gains. Spending $10,000 to manipulate its contract to profitability is rational.  
    - **Critical ratio:** Manipulation is profitable if:  
      `(Stake in Outcome) > (Cost to Manipulate) / (Probability Manipulation Succeeds)`  
      In thin markets (see below), success probability is high.  
  - **Anonymity and thin liquidity** amplify this risk.  

  #### **C. Thin Markets + Automatic Execution = Uninformative Prices**  
  - **Context:** 20+ markets, small subsidies, few expert traders.  
  - **Problem:** Prices reflect noise, not knowledge:  
    - Low liquidity → Prices swing on small trades.  
    - Anonymous trading → No accountability for false signals.  
    - Few informed traders → "Wisdom of crowds" fails without critical mass.  
  - **Automatic execution compounds risk:** A proposal rising 1% due to random trades could secure funding over a better project. Human judgment acts as a filter; removing it here magnifies error.  

  #### **D. Guardrails Relocate, Not Remove, Discretion**  
  - **The amendment:** Disqualify proposals below a floor on a second metric.  
  - **The flaw:** This shifts subjectivity upstream:  
    - Trustees must now choose *two* metrics and a floor (e.g., "Must score ≥6/10 on DEI audit").  
    - Choosing the second metric and threshold is as value-laden as choosing the first.  
  - **Outcome:** The market’s "objectivity" is illusory; trustees still make qualitative judgments—just earlier.  

  #### **E. Post-Hoc Metric Measurement Invites Gaming**  
  - **The risk:** Grantees optimize for the *metric*, not the *outcome*.  
    - Example: If the metric is "patients served," a clinic may prioritize quick, low-impact cases over complex care.  
  - **No recourse:** Trustees forfeit oversight during the measurement window. Unforeseen events (e.g., a natural disaster skewing jobs data) cannot be adjudicated.  

  #### **F. Foundation Legitimacy Demands Explainable Justice**  
  - **Donors and beneficiaries** expect decisions traceable to human judgment, not algorithmic output.  
  - **After-the-fact justification** for a rejected proposal ("The market priced your impact at $4.32/share") undermines trust. Conversely, funding a flawed project via market error exposes us to reputational and legal risk.  
  - **Contrast:** An expert panel’s reasoning can be interrogated and defended.  

  ---

  ### **III. Engagement with Pro-Pilot Argument**  
  *Strongest case for adoption:* "Markets force us to *test* beliefs about impact. If we believe Proposal A will outperform B but the market prices B higher, we must confront why our belief is wrong."  
  - **Rebuttal:** This assumes prices reflect *truth*. In thin, anonymous markets with manipulation incentives, prices reflect capital and tactics—not truth. A shadow market (recording prices but not funding) would test beliefs at lower risk but still incur 80%+ of costs (platform, subsidies, staff time).  

  ---

  ### **IV. Revised Path Forward**  
  1. **Advisory Pilot (FY2024):** Run parallel markets for 1–2 grants alongside panel review. Compare market predictions vs. outcomes vs. panel decisions.  
  2. **Stress-Test Metrics:** Commission an external review of 5 candidate metrics for robustness, manipulability, and alignment with mission.  
  3. **Liquidity Protocol:** Require identity-verified "expert traders" (e.g., past panelists) to boost signal/noise ratio if proceeding later.  

  ---

  **Recommended Vote: ❌ Reject Pilot**  
  **Time Frame:** Revisit Q4 2024 with data from advisory trials.  

  ---  
  **Approved by Governance Committee:** Unanimous, 20 October 2023.
