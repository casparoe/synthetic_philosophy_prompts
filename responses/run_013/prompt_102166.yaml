prompt: |-
  hey — i'm a second-year phd in a decision theory group and i want to close out our reading group on the value of information with a poem. can you write me a villanelle (the usual 19 lines, two refrains, closing quatrain) about Good's theorem — the one that says free information can never leave you worse off in expectation, even though the particular thing you learn can still sting (you find out the ticket lost, the test came back positive, etc). i want the two refrains to do the structural work: one refrain should be the theorem's promise, roughly that on average you can't lose, the other the ex-post sting. the whole point of the form — the refrains shoving their way back in no matter what the stanza is doing — should feel like the theorem holding steady across every state of the world, since you can always just ignore what you learned. the last two lines should bring the two refrains together so it's clear the guarantee is about expectation while the loss is about what actually gets realised. if you can, let the middle stanzas keep circling the two things that make it non-trivial: that the info has to be genuinely free, and that you actually have to use it (no un-knowing it once you've got it). someone in my group who knows the result should read it and nod rather than wince — i don't want a wikipedia-level hand-wave.
