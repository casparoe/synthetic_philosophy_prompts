prompt: |-
  I'm a junior at a small high school where our philosophy club has spent the spring on Montaigne's essay about the Brazilian cannibals, and for the club's end-of-year zine I have been asked to contribute a poem instead of the essay I would normally write. Two things in the piece have stuck with me, and I cannot work out whether they are one gesture or two opposite ones. The first is the way the essay turns the Europeans' disgust back on the Europeans, so that a people reviled for eating their dead come out looking no crueller than a people we admire for burning the living. The second is the way, having knocked us off our perch, the essay seems to set them on a perch of its own, calling them close to nature and uncorrupted, as though they were still living out some original condition we have lost. I suspect the second move is the first one in a different costume, that the mirror image is still a mirror, but I want a poem that leaves that suspicion standing rather than settling it, and I want it to keep in view the essay's own uneasiness about where its picture comes from: the whole account arrives secondhand, through people who crossed between the two worlds, and it has been translated at least twice before it reaches us.

  Would you write me a poem of roughly eighteen lines in three movements: an opening movement in the voice of a European describing the cannibals and passing judgment; a second movement that answers the first almost line for line, carrying the same images and sentence shapes but turned back on the Europeans, so that a reader feels the reversal in the form before putting a name to it; and a short coda that breaks the pattern to catch the speaker in the act of the second, subtler move, the idealizing. If strict line-for-line mirroring becomes contorted, let the second movement mirror the first's images and syntax without forcing the count. A reader who knows the essay should be able to tell, without being told, which movement is the reversal and where the speaker catches himself; a reader who does not should still find it a good poem rather than a lecture. Please do not let it end on a comfortable relativist moral, do not resolve whether the idealizing is a genuine correction or simply the old parochialism wearing the other culture's clothes, and do not use the words "relativism" or "ethnocentrism" anywhere in it. Begin your reply with the poem itself, with no preface, no explanation, and no commentary afterward; if you want a title, let it be part of the poem.
reasoning: |-
  Hmm, the user is a high school junior in a philosophy club who has been studying Montaigne's essay about Brazilian cannibals. They've been asked to write a poem for their zine instead of an essay, and they're grappling with two key aspects of Montaigne's argument: how he turns European disgust back on Europeans by showing that burning people alive is just as cruel as eating the dead, and how he then idealizes the cannibals as being close to nature and uncorrupted. 

  The user suspects these two moves might be connected - that the idealization is just the flip side of the same ethnocentric coin. They want a poem that explores this ambiguity without resolving it, while also acknowledging Montaigne's own unease about his secondhand sources. They've requested a very specific structure: three movements with mirrored sections, avoiding didactic language or comfortable conclusions.

  This is quite sophisticated for a high school student! The request shows deep engagement with postcolonial critique centuries before the term existed. The user clearly understands that Montaigne's "noble savage" framing might be another form of European projection. The challenge is crafting verse that enacts the textual mirroring they describe while maintaining poetic integrity.

  The poem needs to: 1) Open with colonial condemnation 2) Mirror those exact images/syntax to condemn Europeans 3) Show the speaker catching themselves idealizing. Must avoid: moralizing, academic jargon, resolution. Key is making the structural reversal palpable before the content registers - that "aha" moment where form delivers meaning.

  For the title, integrating it as first line solves the "no preface" requirement. The body should use visceral, period-appropriate imagery (fire/flesh vs. cooked/raw binaries work well). The third stanza's hesitation ("or so I heard...") addresses Montaigne's sourcing doubts. Ending on "before the Fall" leaves the idealization question hanging - is this truth or just another European myth?

  The mirroring proves tricky - strict line count might sacrifice quality, so prioritizing syntactic/imagistic echoes over exact length. Words like "savages" and "heathens" in part one must transform into "saints" and "pure" in part two to show how the same mind that demonizes can romanticize. The final triplet's broken rhythm enacts the caught-in-the-act moment.
answer: |-
  *On Reading of Tupinambá Funeral Rites*

  They say these savages devour their dead,
  A feast of fathers roasted on the flame,
  The ultimate defilement, horror-bred,
  Where sacred flesh becomes their bodies' claim.
  No grace, no godliness directs their hand,
  Just primal hunger, base and uncontrolled,
  A people lost in some benighted land,
  Their very souls, it seems, are bought and sold
  To heathen appetites, both crude and stark.

  We say these saints incinerate the quick,
  A feast of faithful scorched beneath the spark,
  The ultimate devotion, justice-pricked,
  Where sacred truth demands the living pyre.
  No grace, no mercy mitigates the blaze,
  Just righteous fury, fervent and so cold,
  A people certain in their hallowed ways,
  Their very souls, they claim, are bought and sold
  To divine commandment, pure and stark.

  ...Or so I heard, translated through the haze
  Of travellers' tales. They walked within the green,
  Unbroken world, untouched by cunning days,
  Closer to something... primal, clean...
  Before the Fall.
