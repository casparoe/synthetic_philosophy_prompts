prompt: |-
  I am assembling a specification for an account of the moral difference between lying and merely misleading, and I want the desiderata before I commit to any particular account of it. Please set out what such an account must deliver: the cases it has to classify correctly, the distinctions it must preserve rather than collapse, and the linguistic, legal, and psychological facts it must not contradict — attaching to each requirement the case or consideration that motivates it.

  Treat the account as one that must be good enough to guide the design of real rules: the honesty standards written into professional codes of conduct, the line between actionable fraud and permissible non-disclosure in law, and the honesty we demand of an AI assistant that must not deceive its user. Fixing that purpose is part of the exercise; say which requirements are artifacts of it and which would bind any account whatsoever.

  The cases I want covered include at least the following. The classic case in which a truthful answer would assist a would-be murderer, together with the intuition that the lie remains forbidden. The reference or recommendation that contains no false statement yet is understood to convey a damaging one — misleading by implicature, by faint praise, or by a true sentence chosen for its false suggestion. The negotiator or salesperson who uses only true statements, selected and ordered to produce a false belief — some researchers call this paltering — and the question whether that is morally on a par with lying or genuinely distinct from it. Misleading by omission, by presupposition, by evasion, and by answering a different question than the one asked. The placebo, the therapeutic privilege, and the white lie told to spare feelings, where the intent is benign. The boundary between lying and bullshitting, where the speaker is indifferent to the truth rather than aiming at falsehood. The legal facts any account must respect: that perjury typically requires a false statement, that fraud and securities law reach some misleading omissions, and that mere non-disclosure is usually not misrepresentation. And the case I care most about, since the older literature does not settle it — a machine that never utters a falsehood but selects, orders, and withholds true statements so that its user forms a false belief.

  For each requirement, give the consideration that makes it a requirement rather than a prejudice of one camp. Then tell me which requirements to treat as non-negotiable and which as optional, whether any pair of them cannot be satisfied together (I suspect at least one such pair, and if the list proves internally inconsistent that is itself the most useful result), and which single requirement does the most to eliminate the leading positions: the absolutist who forbids all lying, the consequentialist who licenses some, and the skeptic who denies that the distinction carries any moral weight. Keep the emphasis on the criteria and their motivating cases; I will score the contending views myself.
