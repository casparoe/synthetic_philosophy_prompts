  First, the user explicitly rejects the "obvious reading" of Briony's guilt - they want the "in-the-weeds" philosophical engagement. That means I should avoid rehashing basic moral luck concepts and dive straight into tensions. The epistemic condition question is crucial: was Briony's ignorance culpable? The novel gives conflicting signals - Robbie's forgiveness vs. Briony's lifelong penance. Need to analyze this through Miranda Fricker's hermeneutical injustice lens rather than just standard culpable ignorance frameworks.

  Second, the agent-regret question is thorny. Williams would say Briony feels guilt, not agent-regret, because she was blameworthy. But her lifelong atonement project has elements of both - she's simultaneously acknowledging blameworthiness and mourning the unlucky outcomes. The draft letter scene where she imagines alternative outcomes is key here.

  The law-as-luck angle is particularly rich. The novel shows legal systems try to manage luck (doli incapax, felony murder rule), but Briony's case falls through the cracks - she's legally culpable but developmentally ambiguous. The library confrontation scene demonstrates this perfectly: she meets all legal criteria for witness competence despite her epistemic limitations.

  The coda is where things get meta. By fictionalizing the happy ending, Briony isn't just laundering luck - she's committing the same epistemic violence of assuming she knows others' interiority. Yet McEwan forces us to consider if this is the only form of atonement available to artists. The typed "atonement" page with its revisions makes this ambiguity visceral.

  Where the reading breaks: The Dunkirk section resists moral luck frameworks because Robbie's suffering exists outside Briony's moral universe - it's historical contingency overwhelming individual agency. And Cecilia's rage operates on a plane where luck considerations feel irrelevant.

  What the novel uniquely adds: It embodies moral luck's paradoxes in narrative form - we feel Briony's guilt despite understanding her constitutive luck, in a way philosophical treatises can't capture. The JSON summary will need to crystallize all this while maintaining nuance.
answer: |-
  ## Deep Dive: Moral Luck in McEwan's *Atonement* (Beyond the Obvious)

  Forget the simple "guilty child" narrative. McEwan plunges us into the murky waters of moral luck, where Nagel's categories (constitutive, circumstantial, resultant) and Williams's insights on agent-regret become essential tools, not just thematic decorations. The novel actively wrestles with these concepts, sometimes embracing, sometimes resisting them. Let's get into the weeds:

  1.  **The Epistemic Condition & Culpable Ignorance:**
      *   **The Problem:** Briony *genuinely* believes she saw Robbie assault Lola. Her interpretation stems from constitutive luck (her 13-year-old mind, shaped by melodramatic narratives, nascent sexuality, and class consciousness) and circumstantial luck (seeing the fountain scene, finding the letter, stumbling upon the dark figures in the bushes). The culpable ignorance argument asks: Did she *fail* in her epistemic duties *before* the accusation? Should she have questioned her perceptions, considered alternatives, or recognized her limitations?
      *   **Tracing & Culpability:** Can we trace the blameworthy act (false accusation) back to an earlier epistemic failure? The novel is ambivalent. Her rush to judgment and desire for narrative certainty *feel* blameworthy – a failure of intellectual humility. Yet, McEwan meticulously depicts the *overwhelming* nature of her subjective experience. The confusion, the heat, the shock, the ingrained sense of Robbie's "otherness" fueled by the letter – it feels less like a culpable *failure* to inquire and more like a constitutive *inability* due to age and temperament in that specific moment. Robbie's later forgiveness ("The girl was barely thirteen...") leans towards recognizing this constitutive/circumstantial luck shield. **Verdict:** The novel subtly argues that while her *act* was culpable (she *chose* to accuse), the *ignorance* driving it was largely non-culpable – a product of luck itself. It's not *just* relabeling luck; it shows how constitutive/circumstantial luck can create an epistemic state where genuine belief coexists with catastrophic wrongness, complicating straightforward blame. Robbie's softness might be accurate empathy, not mere weakness.

  2.  **Agent-Regret vs. Ordinary Guilt:**
      *   **Williams's Lorry Driver:** The driver feels agent-regret – profound sorrow and identification with the outcome ("*I* did that"), even without fault. It's non-moral, rooted in being the causal agent. Guilt requires blameworthiness.
      *   **Briony's Torment:** Briony *is* blameworthy for the false accusation itself (the lie, the manipulation post-event). This is ordinary guilt. However, the *magnitude* of her lifelong penance is fueled by *resultant* luck – the unimaginable chain of events she set off: Robbie's imprisonment, the war, the deaths, the permanent separation. She feels the weight of the *outcome* far more intensely than she likely would have if Robbie had gotten a short sentence and lived happily ever after. **The Novel's Twist:** McEwan merges these. Briony's guilt *for the blameworthy act* is compounded by a form of hyper-charged agent-regret *for the unlucky consequences*. Her entire life becomes an attempt to bear the weight of that resultant luck, making the distinction blur. Williams might insist the core is guilt, but the novel shows how resultant luck can amplify guilt into something resembling a unique, crushing hybrid emotion. The penance addresses both the ethical fault *and* the cosmic misfortune she unleashed.

  3.  **Law as Institutionalized Luck Management (and its Failure):**
      *   **Attempt vs. Completed Crime / Felony Murder:** The law *explicitly* punishes based on resultant luck (attempted murder vs. murder; death during a felony). Briony's *intent* (to punish Robbie for what she believed was a crime, likely rape) led to an outcome vastly worse than she could have imagined (death during war imprisonment). Legally, she wouldn't be liable for the deaths, only the perjury/libel. But morally, the novel forces us to feel the disconnect between legal culpability and the felt weight of consequences.
      *   ***Doli Incapax*:** This is crucial. The law recognizes constitutive luck – children 10-14 might lack sufficient moral understanding. Briony sits right on this cusp. The novel's moral psychology **resonates strongly** with *doli incapax*. While legally she might be held responsible (the presumption is rebuttable, and her articulate accusation likely rebuts it), the novel *psychologically* explores the grey area. Her internal monologue reveals a mind capable of complex fiction but prone to catastrophic misinterpretation and a child's black-and-white moralizing. The law provides a framework, but the novel exposes its inadequacy for capturing the messy reality of her developmentally constrained agency and the sheer bad luck of her misunderstanding having such dire consequences. It's not a distraction; it highlights the gap between legal categories and lived moral experience under luck.

  4.  **The Coda: Luck Laundering or Earnest Atonement?**
      *   McEwan delivers the ultimate twist: Briony, the older novelist, gives Robbie and Cecilia the happy ending (life together) that resultant luck denied them. Is this:
          *   **Atonement?** A final, desperate act of love and reparation, granting them the happiness her actions stole. Using her gift (writing) to undo the damage of its earlier misuse.
          *   **Evasion?** A profound rerun of the girl at the window. She *still* presumes to know and control their inner lives and destinies. She avoids the full, bleak reality of the consequences of her actions and her resultant luck. It's a fictional escape from guilt.
          *   **Both?** This is the novel's brilliant, unsettling core. It **is both simultaneously**. It *is* an act of love and atonement – the only form available to her. Yet, it *is* also an act of epistemic violence, a final assertion of authorial control over lives she irrevocably altered. She launders the *worst* of the resultant luck (their deaths) but cannot escape the guilt of the original act or the fact that her "gift" is still rooted in imposing her narrative. The coda is the ultimate, tragic expression of the artist grappling with moral luck – trying to fix the unfixable with the very tool that caused the damage, inevitably repeating the original sin of presuming knowledge.

  5.  **Where the Moral Luck Reading Breaks & What the Novel Adds:**
      *   **Breaks:** The reading struggles most with:
          *   **Robbie on Dunkirk:** His suffering transcends Briony's moral universe. It's historical, brutal contingency – the luck (or horror) of being a soldier in that retreat. While *initiated* by Briony's act, his experiences there (the dying French boy, the horrors) belong to a different realm of luck, almost cosmic or historical, overwhelming the frame of individual moral agency established by Briony's story.
          *   **Cecilia's Fury:** Her rage at Briony ("I'll never forgive you") operates on a plane where luck feels irrelevant. It's a raw, visceral response to betrayal and catastrophic loss that resists being parsed through luck categories – it's about the absolute wrongness of the act itself, regardless of how it came about.
      *   **What the Novel Adds:** A philosophical paper on resultant luck can dissect the concept. *Atonement* forces us to *live* its emotional and psychological reality. It shows:
          *   **The Narrative Nature of Moral Luck:** How we construct stories to make sense of luck's role in our failures and suffering (Briony's lifelong narrative of guilt and atonement).
          *   **The Inescapable Weight of Consequence:** Even if blame is mitigated by constitutive/circumstantial luck, the *agent* still bears the psychological burden of the resultant luck. Guilt and regret become fused with the unlucky outcome.
          *   **Art's Ambiguous Power:** The novel explores whether art can truly atone for moral failures rooted in luck, or if it merely replicates the original problem of imposing narrative. It embodies the paradox of using the flawed instrument (the mind/narrative) that caused the harm to try and repair it.

