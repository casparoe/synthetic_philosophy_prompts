answer: |-
  ## Pantoum for the Unobserved Wing

  No one recorded how it caught the light,
  That moth upon the midnight windowpane.
  The angle of its wing, precise and slight,
  Existed only in the falling rain.

  That moth upon the midnight windowpane,
  Its fragile geometry unseen, unknown.
  Existed only in the falling rain,
  A truth within the dark alone.

  Its fragile geometry unseen, unknown.
  If truth could always find a waking mind,
  A truth within the dark alone
  Would leave its perfect solitude behind.

  If truth could always find a waking mind,
  We'd have to know the wing we never saw.
  Would leave its perfect solitude behind?
  That no one counted, that it's known by law.

  We'd have to know the wing we never saw,
  That no one counted, that it's known by law.
  But no one knew the angle it withdrew.
  The very claim dissolves the thing it saw.

  That no one counted, that it's known by law?
  The angle shifts if ever it is found.
  The very claim dissolves the thing it saw:
  This knowing makes the unknown truth unsound.

  The angle shifts if ever it is found.
  It can't be known and stay that fleeting thing.
  This knowing makes the unknown truth unsound.
  No one recorded how it caught the light.

  ---

  **How the Pantoum Walks the Proof:**

  1.  **Stanza 1:** Establishes the unobserved truth (moth wing angle) – `p ∧ ¬Kp`.
  2.  **Stanza 2:** Introduces the *knowability principle* hypothetically ("If truth could always find a waking mind").
  3.  **Stanza 3:** The crucial shift. Line 1 (from St2 L2) "Its fragile geometry unseen, unknown" is now followed by the *consequence* of knowability: "We'd have to know..." Line 4 "That no one counted, that it's known by law" *asserts* the conjunction (`p ∧ ¬Kp`), but crucially, the *repetition* of "that it's known by law" (from St3 L3) now frames `¬Kp` ("no one counted") as something *known* (`K(¬Kp)`). This is the pivotal, unstable point.
  4.  **Stanza 4:** The collapse. Line 1 & 3 ("That no one counted, that it's known by law") reasserts the claim, but Line 2 & 4 immediately show the contradiction: "The angle shifts... dissolves... unsound." Knowing `p ∧ ¬Kp` implies `Kp` (we know `p`) *and* `K(¬Kp)` (we know no one knows it). `K(¬Kp)` entails `¬Kp`, contradicting `Kp`. Hence, the truth (`p`) *cannot* remain the same if claimed to be unknown yet knowable ("The angle shifts... unsound").
  5.  **Stanza 5:** The conclusion. The only consistent outcome is that the unknown truth *cannot* be known without changing/falsifying it ("It can't be known and stay that fleeting thing"), implying that if *all* truths were knowable, there *could be* no unknown truths – meaning every truth must be known.
  6.  **Loop:** The final line circles back to the opening, reinforcing the *actual* state: "No one recorded..." (`p ∧ ¬Kp`), which *must* remain unknown to be true. The form forces the unstable claim ("We'd have to know... that it's known by law") and its collapse, enacting the paradox without stating it. The reader experiences the shift in meaning caused solely by the repetition and new context.
