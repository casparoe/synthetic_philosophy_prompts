prompt: |-
  I am a doctoral student in a decision theory reading group, and a friend who runs a small forecasting nonprofit has asked me to help her think through a design problem. The nonprofit rewards forecasters with a proper scoring rule, allocates resources across projects using a portfolio approach, and permits teams to revise their preferences over time as evidence comes in; it has twelve employees and a board that wants procedures that can be explained to non-specialists. My friend has absorbed enough of the coherence arguments for expected utility maximization to know that preferences violating the standard axioms leave an agent open to a sequence of choices that is worse by the agent's own lights, but she is unsure what follows for an organization whose members are not idealized expected utility maximizers and whose decisions are made collectively. A further complication, which we have been calling budgeted incoherence, is that each team's local preferences may satisfy the axioms while the organization's aggregate preference over portfolios cycles because teams weight the same outcomes differently; the nonprofit also cares about whether its procedures are coherent at the group level rather than only at the individual level.

  Please describe the most important implications of the coherence arguments for expected utility maximization for the design of this nonprofit's internal decision procedures. In particular, I want implications that bear on how it should interpret its scoring rule, how it should handle preference revision and aggregation across teams, and what it should do when local coherence and global coherence pull apart. Answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a doctoral student in decision theory who's helping a nonprofit with forecasting and resource allocation. They've described a challenge where individual teams have coherent preferences (following expected utility axioms), but when aggregated, the organization's preferences cycle or become incoherent due to different weighting of outcomes. This is called "budgeted incoherence."

  The nonprofit has practical constraints: it's small with only twelve employees, needs procedures explainable to non-specialists, and values group-level coherence. Key elements include a proper scoring rule for forecasters, portfolio allocation, and allowing preference revisions over time.

  I need to extract the most important implications of coherence arguments for their decision procedures. The query specifies exactly five numbered items, each 1-2 sentences, with no intro or conclusion. Focus areas are: interpreting the scoring rule, handling preference revision and aggregation, and resolving conflicts between local and global coherence.

  Breaking this down: First, the scoring rule should reflect organizational values, not just individual accuracy, to maintain coherence at the group level. Second, for preference revision, they need a structured process with clear evidence standards to prevent arbitrary changes that could introduce incoherence. Third, preference aggregation requires an explicit, defensible weighting method to avoid cycles; something like a linear pooling with weights based on team expertise. Fourth, when local and global coherence conflict, the organization must prioritize global coherence because that's what matters for overall decisions, even if it overrides some team preferences. Fifth, education is crucial—explain these concepts simply to non-specialists so everyone understands why coherence matters and how procedures prevent pitfalls like Dutch books.

  I'll ensure each point is concise, actionable, and directly addresses the design challenges. This should provide clear guidance that balances theoretical rigor with practical simplicity for the nonprofit.
answer: |-
  Here are five key implications for the nonprofit's design:

  1.  **Scoring Rule Interpretation:** The scoring rule must incentivize forecasts aligned with the *organization's* shared probability model or explicitly defined aggregation method, as individual accuracy under divergent beliefs doesn't inherently aggregate to organizational coherence.
  2.  **Preference Revision:** Teams revising preferences must do so *coherently* (via Bayesian updating or an agreed non-Bayesian rule) and transparently, documenting evidence shifts to maintain auditability and prevent arbitrary, incoherent group preference shifts.
  3.  **Preference Aggregation:** To avoid cycles ("budgeted incoherence"), aggregate team preferences using an explicit, axiomatically sound method like linear pooling, requiring defensible team weights (e.g., based on track record or domain expertise).
  4.  **Prioritizing Global Coherence:** When local team coherence conflicts with global organizational coherence (e.g., aggregation creates cycles), the organization *must* enforce global coherence in final decisions (e.g., using the aggregated preference), as local coherence alone cannot prevent group-level dominated choices.
  5.  **Education on Coherence Pitfalls:** Explain the risk of incoherence ("money pumps" / Dutch books) simply: inconsistent group choices could lead to sequences of decisions where the nonprofit ends up strictly worse off by its own standards, wasting resources.
