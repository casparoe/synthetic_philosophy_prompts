answer: |-
  Here’s a structured research proposal addressing your core insight, tailored to a one-term project with a clear scope and deliverables.  

  ---

  ### **Research Proposal: Diagnosing the Explanatory Demand in Bradley’s Regress**  
  **Project Duration:** One academic term (10–12 weeks)  

  #### **1. Core Question (Sharply Defined)**  
  *"Must a theory of propositions (or facts) satisfy a grounding demand for unity—i.e., explain *what makes it the case* that constituents form a unified whole rather than a mere list—and if not, does dissolving this demand resolve Bradley’s regress?"*  
  **Why it’s definite:** Answers "yes/no" to whether the demand is obligatory, and tests the consequence of rejecting it.  

  #### **2. Problem with Existing Positions**  
  Both standard responses implicitly accept a **grounding requirement** for unity:  
  - **Brute-unifiers** (e.g., primitivism, Fregean saturation) deny the *need* for further grounding but retain the *explanandum*: "Unity is irreducible, so we stop here."  
  - **Benign-regress theorists** grant the demand but argue it generates an infinite chain with no ontological cost (e.g., analysis recurses without new entities).  
  **The gap:** Neither questions whether the demand—"What *grounds* unity?"—is coherent or appropriate for propositions. This conflates:  
    - **Explanation** (describing structure, function, or truth-conditions)  
    - **Grounding** (identifying truthmakers or metaphysical dependence).  
  **Project claim:** Bradley’s regress arises only if unity requires grounding. Rejecting *that specific demand* may defang the regress.  

  #### **3. Methodology: Comparative Analysis**  
  Test the legitimacy of the "unity demand" across three domains to isolate whether it is:  
  - **(A) Domain-specific:** Unique to propositions/facts.  
  - **(B) Illegitimate:** A category error (like demanding "what grounds existence?").  
  - **(C) Satisfiable:** Grounded without regress elsewhere.  
  **Cases:**  
    - **Propositions:** Run Bradley’s regress for "aRb" (e.g., "Socrates is wise").  
    - **Material composition:** Contrast a *heap* of sand vs. a *statue*. Why is the statue "unified" while the heap is not? Does grounding its unity trigger a regress?  
    - **Predication:** Compare relational facts (e.g., "a loves b") to monadic facts (e.g., "a is red"). Does the unity demand arise differently?  
  **Tools:**  
    - Conceptual analysis of "grounding" vs. "explanation" (drawing on Fine, Schaffer).  
    - Test for transposable reasoning: If the regress persists identically across domains, the demand may be intrinsic to "unity" itself.  

  #### **4. Outcomes and Success Criteria**  
  - **Success (positive):** Demonstrating that the unity demand:  
    - Is *not* coherently satisfiable in any domain (e.g., material composition also generates a regress if forced into grounding terms), or  
    - Is uniquely problematic for propositions (e.g., due to their abstract nature), justifying its rejection.  
  - **Success (negative):** Showing that dissolving the demand *dissolves the regress* without cost (e.g., unity is explained functionally, not grounded).  
  - **Failure condition:**  
    > **"If the unity demand can be coherently satisfied in *at least one domain* (e.g., material objects) without regress, *and* this solution is transposable to propositions, the project’s core thesis fails."**  
    *(Example: If statue-unity is grounded in causal relations without regress, and relations can similarly ground propositional unity, Bradley’s regress is solvable without rejecting the demand.)*  

  #### **5. Scope and Boundaries**  
  - **In scope:**  
    - Diagnosing the structure of the unity demand in Bradley’s regress.  
    - Comparative analysis of propositions, material composition, and predication.  
    - Developing a "diagnostic framework" for when explanatory demands overreach into grounding.  
  - **Out of scope (parked for later):**  
    - Formalizing a positive theory of propositions.  
    - Engaging deeply with historical interpretations of Bradley.  
    - Addressing regresses in other domains (e.g., truth, causation).  
  - **Deliverable:**  
    1500-word paper defining the demand, testing it comparatively, and arguing for/against its legitimacy.  

  ---

  ### **Why this works for the term**  
  - **Focus:** Targets a single, actionable insight (the demand’s role) rather than solving the entire regress.  
  - **Novelty:** Challenges an implicit assumption in the literature.  
  - **Feasibility:** Comparative cases (propositions, heaps) are well-trodden, allowing efficient analysis.  
  - **Clear stakes:** Success/failure hinges on domain-generalizability—a testable claim.  

  **Next step:** Draft the framework (Week 1–2), apply to each case (Weeks 3–8), synthesize results (Weeks 9–10). Citations (e.g., Bradley, Armstrong on states of affairs, Van Inwagen on composition) will anchor moves.
