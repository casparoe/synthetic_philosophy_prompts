  Also, the professor might be making a political or rhetorical point. Formalizing the Anthropocene could dilute its urgency by making it a technical term. Or he's emphasizing the ongoing crisis aspect. The user wants to know which of these actually invalidate the epoch debate. If it's an event, the golden spike and start date arguments become irrelevant. But if it's about geological feasibility, the rejection might still matter.

  I should check each interpretation's validity. The timescale argument is defensible; 70 years is short for geology. The synchronicity issue holds too. Earth System science perspective is solid. Political arguments are subjective but common in academic discourse. The user needs to know which claims allow dismissing the vote. The Earth System view does, as it redefines the concept beyond stratigraphy. Political and rhetorical points also bypass the geological process.

