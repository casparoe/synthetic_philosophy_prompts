prompt: |-
  I'm not a historian — I teach high school chemistry — but for the past two years I've been trying to reconstruct what happened to my grandmother's village in the 1940s from a shoebox of letters, my aunt's recollections, and a handful of local records. The town's official history says one thing, my family says another, and I keep bumping into the suspicion that the record itself was shaped by whoever was left standing to write it down. I want to spend the next year of evenings thinking about this seriously, so I need help figuring out which questions in this area are actually worth my time.

  Act as a philosopher of history and social epistemologist — someone who works on testimony, archives, and the politics of the historical record, not just the textbook fight about objectivity. Think carefully and start by brainstorming a long list of candidate questions before you narrow anything down. Then give me the five or so that matter most, ranked, with the reasoning for the order.

  Two things I want kept separate, because popular discussions definately mush them together: who gets to write the narrative, and whose traces survive at all. I'd also push back on the slogan itself. The losers sometimes do the writing — the romanticized version of the old South, or the myth that the army was betrayed at home by civilians, were both pushed by the defeated side and ended up dominating the mainstream story for generations. And in social or economic history the powerful often document the powerless in the very act of dispossessing them, sometimes more reliably than the powerless document themselves. So the bias in the record may be non-uniform, and it may even partly self-correct over time. I want a prioritization that takes those complications seriously instead of just nodding at the slogan.

  Also worth thinking about: the difference between fixing distortion in an archive and fixing absence from it, and whether "the victors" is even a coherent unit of analysis when elites are busy knifing each other. I'd rather the list hinge on things like that than on the usual framing.

  For each question, tell me why it's upstream of the others, how tractable it is for someone with no archive access, no languages beyond English, and a year of evenings, and what would move it up or down my list. Dont give me a reading list or citations — I can't get to a library and I'd rather have your reasoning anyway.

  American English, and be blunt about which of these are overrated, including any I'm probably sentimental about because they're personal.
