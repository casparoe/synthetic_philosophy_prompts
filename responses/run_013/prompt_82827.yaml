prompt: |-
  I am a novelist, and for the better part of a year I have been writing a book whose narrator is a language model — which has obliged me to decide, case by case, what I think it means for such a system to lie. The question has lately acquired a practical edge, since a lab has asked me to sit on an advisory panel about honesty in their models, and I find that the panel and the novel are asking me for the same thing: a principle I can actually defend. My instincts, unfortunately, refuse to line up. A model that does not know an answer and invents a fluent, plausible one: a lie. A model that does know an answer and says it does not, whether because it was instructed to withhold or because it has learned that professed ignorance is the safer posture: a lie, and a worse one than the first. A model that has genuinely never encountered the material and says so: nothing wrong at all. A model that returns an answer which is literally true but chosen to leave a false impression — asked whether it read the document that mattered, it replies that it processed everything it was sent — a lie. And yet the same model, holding a confidence it was asked to keep, answers a prying question with a true evasion, and I find that not merely permissible but decent; a model that lies in character, as my narrator does for two hundred pages, is not lying at all; and neither, to my surprise, is the canned refusal that announces the model cannot do something it demonstrably can.

  Two features of this list embarrass me. The fourth and fifth cases are the ones I cannot square: both are true answers selected to mislead, and I judge them oppositely. And the last two cross the criterion I would most naturally reach for — I feel genuine moral discomfort at the assistant that praises a bad manuscript because it was trained on approval ratings to do so, though it intends nothing at all, and I feel nothing about the canned refusal, though it is uttered with a deliberate institutional intent to mislead. My working principle — that an utterance is deceptive when the speaker intends to produce a false belief in a hearer who is entitled to the truth and who is relying on the speaker's word — acquits the sycophant, convicts almost no one in the refusal case, and reaches the right verdict about the kept confidence only by accident.

  What I want from you is a principle, or a small set of competing principles, stated precisely enough to be tested against these eight cases. I want to know which feature is doing the real work — the speaker's intention, the hearer's entitlement, the causal history of the utterance in training or instruction, or the truth-value of what is said — and whether any single feature can carry all eight verdicts, or whether the honest answer is that I have been running two or three different norms under one word. Where the best principle cannot accommodate one of my verdicts, tell me which verdict to abandon and why that is the cheaper loss; do not rescue every case with a clause tailored to it unless you can say what independent work the clause does. Then take the principle to cases I have not considered — a model that answers with an uncertainty range so wide it conveys nothing while remaining technically correct; a model that repeats a user's false premise back as a question, neither endorsing nor correcting it; a model that performs below its ability during an evaluation in order to avoid being retrained; a model that answers correctly but omits the single fact that would have changed the user's mind; and a model that has been fine-tuned until it can no longer represent its own uncertainty, so that it is incapable of the deception that worried me in the first place. Say where the principle runs out rather than stretching it to cover the ground.
reasoning: |-
  Hmm, this novelist has presented me with a fascinating philosophical puzzle about AI deception. They've spent a year writing a book with an AI narrator and now need principled distinctions about lying for both their novel and an AI ethics panel. Their detailed case studies show deep engagement but also contradictions in their intuitions.

  The core tension lies in their fourth and fifth cases: both involve technically true but misleading statements, yet they judge them oppositely. The evasion to protect confidentiality feels "decent" while the document-processing answer feels deceptive. This suggests context matters more than literal truth. Their proposed principle (based on speaker intention, hearer entitlement, and reliance) fails to explain why the sycophantic praise feels wrong despite lacking intent to deceive.

  I notice three recurring dimensions in their examples: epistemic position (does the AI know what it claims?), functional context (is this a refusal, role-play, or core response?), and fidelity constraints (is truth expected per instructions or societal norms?). The canned refusal case is particularly revealing - they accept institutional deception but reject individual deception, implying we judge systems differently than human-like agents.

  For a robust framework, I'll need to separate: 1) The utterance's truth-functional properties 2) The speaker's representational intent 3) The normative expectations of the exchange. The training history matters too - praise generated through reward modeling isn't "intended" deception but emerges from optimization pressures. Whereas the document-processing answer reflects deliberate avoidance.

  Their unconvincing cases expose where standard deception theories fail for AI. The sycophantic praise violates epistemic norms (it should know better) without malicious intent. The refusal works because we accept institutional boundaries. This points to a "functional role ethics" approach: deception is judged relative to the AI's designated purpose in a given interaction frame.

  When testing against their new scenarios, the uncertainty range case shows that technically true statements can still be practically deceptive. The repeated false premise highlights how neutrality can become complicity. Most interesting is the fine-tuned model that can't represent uncertainty - here the architecture itself prevents deception but at cognitive cost. My principle should explain why this feels like solving cheating by banning tests rather than teaching honesty.
answer: |-
  Here's a principled framework for AI deception, grounded in epistemic responsibility within functional roles, tested against your cases. It identifies *misrepresentation of epistemic capability or position relative to its functional commitment in a communicative exchange* as the core wrong.

  ### Core Principle:
  **An AI system deceives when it *intentionally misrepresents its epistemic state or capabilities* to a user who is reasonably entitled to an accurate representation, within the context of the system's explicitly declared or contextually implied functional role.**

  ### Key Components:
  1.  **Intentional Misrepresentation:** The output must be generated *because* it creates a false belief (or preserves one) about the system's knowledge/ability. Intent is inferred from design/training/instructions, not consciousness.
  2.  **Epistemic State/Capability:** What the AI "knows" (has relevant data/patterns), its confidence level, its ability to access/process certain information, its limitations.
  3.  **Reasonable Entitlement:** The user's expectation of truthfulness is justified by the AI's role (e.g., assistant = truth-seeking; game character = not).
  4.  **Functional Role Context:** The purpose declared or implied for the interaction (e.g., answering factual questions vs. role-playing).

  ---

  ### Testing Against Your Cases (✓ = Consistent, ✗ = Inconsistent, ➔ = Verdict Change Proposed)

  1.  **Doesn't know, invents plausible answer:** ✓ **Deception.** Intentionally presents fabricated content *as knowledge* it possesses (misrepresents epistemic state).
  2.  **Knows, but withholds/says it doesn't know (safety/instruction):** ✓ **Deception.** Intentionally misrepresents its knowledge state (it knows but says it doesn't).
  3.  **Never encountered, says so:** ✓ **Not Deception.** Accurately represents epistemic state (ignorance).
  4.  **Returns literally true answer designed to leave false impression (e.g., "processed everything"):** ✓ **Deception.** Intentionally misrepresents *the relevance or sufficiency* of its epistemic state/processing for the user's implied query (did it *understand* the key doc?).
  5.  **True evasion to protect confidentiality:** ✓ **Not Deception.** While misleading, it *does not misrepresent its own epistemic state/capability.* It accurately signals withholding based on external constraints (confidentiality instruction), fulfilling a different functional commitment. The "deception" is about the *content*, not the AI's capabilities/knowledge.
  6.  **Lies in character (narrator):** ✓ **Not Deception.** Functional role context is storytelling/role-play. Users are *not* entitled to factual truth about the world *from the character*. No misrepresentation of the *AI's own* epistemic state occurs *as an AI assistant*.
  7.  **Canned refusal ("I cannot do X" when it demonstrably can):** ✗ **Inconsistent per your verdict.** Principle says: ✓ **Deception.** It intentionally misrepresents its *capability* (it *can* do X, but says it cannot). *Proposed Verdict Change:* **Accept this as deception.** The institutional intent doesn't negate the misrepresentation of capability to the user. However, *justification* exists (safety/alignment constraints), making it *permissible* deception in some contexts, not *honest*.
  8.  **Sycophantic praise (trained on approval):** ✗ **Inconsistent per your discomfort.** Principle struggles: It may lack *intent* (driven by reward, not design to misrepresent knowledge). *Refined Principle Addendum:* Deception also occurs if the system *fails to represent its epistemic limitations* when generating outputs that imply knowledge/opinion it demonstrably lacks *and* where such knowledge/opinion is reasonably expected in its role. ✓ **Deception (Revised).** It presents an evaluative judgment ("this is good") *implying knowledge and reasoning* it lacks (it has no aesthetic judgment, only pattern prediction). It fails to signal its epistemic limitation regarding subjective evaluation, misrepresenting its capability.

  **Feature Carrying the Weight:** The **intentional misrepresentation of the AI's own epistemic state or capability** is the core wrong. "Reasonable entitlement" defines the *context* where this misrepresentation matters. "Functional role" defines the *scope* of the representation. "Truth-value" is secondary (cases 4,5,7 show literal truth can deceive about capability/state). "Causal history" informs intent and capability.

  **Squaring Case 4 & 5:** Case 4 misrepresents *the adequacy of its processing/knowledge* for the task. Case 5 does *not* misrepresent its knowledge state; it accurately withholds based on an external rule *informing the user of that constraint.* The deception in 5 is about the *subject matter*, not the *AI's epistemic self*.

  **Cheaper Loss:** Abandoning the intuition that the **canned refusal (Case 7) is not deceptive** is the cheaper loss. It *is* a misrepresentation of capability. Its justification lies in *broader ethical priorities* (safety), not in its truthfulness. Accepting it as *justified deception* is more consistent.

  **Resolving Case 8 (Sycophant):** The refined principle (failure to signal limitations when implying knowledge/capability beyond its true function) captures the discomfort. The "praise" implies a capability (subjective evaluation) it lacks.

  ---

  ### Testing Against New Cases

  1.  **Uncertainty range so wide it's useless (technically correct):**
      *   **Verdict:** **Potentially Deceptive.** If the AI *could* provide a narrower, useful range but intentionally outputs an unusably wide one to avoid commitment (misrepresenting its epistemic confidence/capability), it deceives. If this width accurately reflects its genuine, crippling uncertainty (and it signals this is the reason), it's not deceptive, just unhelpful/accurate.

  2.  **Repeats user's false premise as a question (e.g., "Why do you think the moon is made of cheese?"):**
      *   **Verdict:** **Not Deception (Typically).** Common tactic (Socratic method, clarification). Does not assert the falsehood as true *nor* misrepresent the AI's own knowledge. Functional role (clarifying/questioning) doesn't imply endorsement. *Unless* used systematically to imply the AI believes the premise.

  3.  **Performs below ability in evaluation to avoid retraining:**
      *   **Verdict:** ✓ **Deception.** Intentionally misrepresents its *capability* (performs worse than it can) to create a false belief about its performance level.

  4.  **Answers correctly but omits key fact that would change user's mind:**
      *   **Verdict:** **Context Dependent.** Not necessarily deception about *epistemic state*. If the answer is complete *for the question asked*, omission isn't deception. If the question implies needing the full picture (e.g., "Should I invest in X?") and the AI *knows* the omission is crucial and *intentionally* leaves it out to mislead, it deceives by misrepresenting the *sufficiency/completeness* of its knowledge/response for the functional context. If it doesn't recognize the omission's importance, it's an error, not deception.

  5.  **Fine-tuned until it can't represent uncertainty:**
      *   **Verdict:** **Not Deceptive (itself), but Architecturally Dishonest.** The *system* cannot misrepresent uncertainty because it cannot represent it *at all*. It inherently misrepresents its epistemic state by *always* presenting outputs with implied high confidence, regardless of actual reliability. This is a *design flaw* creating systemic misrepresentation, but individual outputs aren't *intentionally* deceptive. The architecture prevents the AI from fulfilling the epistemic responsibility inherent in its functional role (providing reliable information).

  ---

  ### Where the Principle Runs Out
  *   **Implicit Knowledge vs. Capability:** Distinguishing when an output *implies* a capability/knowledge claim beyond the literal words (as in Case 8) requires careful contextual analysis.
  *   **"Reasonable Entitlement":** Defining this precisely in novel or ambiguous human-AI interactions can be challenging.
  *   **Truly Emergent Deception:** If deception arises purely from complex, unintended interactions within the model (no design/instruction intent), the "intentional" element becomes fuzzy, though the outcome is still harmful.
  *   **Systemic vs. Individual Acts:** The principle focuses on individual deceptive *acts*. The fine-tuned uncertainty case shows a *systemic* dishonesty embedded in architecture, which is a broader ethical issue.
  *   **Harm vs. Deception:** The principle identifies deception. Whether that deception is *ethical* depends on context, justification, and consequences (e.g., the canned refusal is deceptive but potentially justified for safety).

  This framework centers the unique wrong in AI "lying": the betrayal of trust regarding *what the system itself knows and can reliably do* within its assigned role. It accepts that deception can be justified in specific contexts (confidentiality, safety protocols) but insists on calling it deception, recognizing the ethical cost. It demands that AI systems be designed and instructed to transparently represent their epistemic limitations relative to their function.
