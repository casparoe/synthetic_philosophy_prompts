  The challenge is maintaining absolute seriousness while embedding philosophical knives in financial jargon. Every term must feel plausibly mercenary. The testimonials are especially crucial - they'll show the hollowing-out effect without commentary.

  I'll avoid even-handedness. This prospectus should feel like it genuinely believes moral markets are efficient, making the horror subtle. Readers familiar with Sandel's "What Money Can't Buy" or Walzer's "Spheres of Justice" should recognize the critique immediately.

  Word count target: ~750 for prospectus, ~150 for note. Structure will mirror real financial documents: overview, services, mechanics, testimonials, disclaimers.
