prompt: |-
  I am a secondary-school student who edits our school's philosophy journal; we publish three times a year, a bad justification would embarrass us, and I have about ten minutes to screen each submission before our teacher signs off. A recurring problem is submissions that claim to justify a rule of inference by adding a further premise, and I want a short decision procedure based on the puzzle in which the Tortoise accepts the premises of a deductive argument but will not draw the conclusion until Achilles grants another conditional, and then will not draw it again. Set out, as a numbered checklist, what I should check in order, what distinguishes a genuine justification from a premise that merely restates the rule, where the regress may legitimately stop, whether the regress is vicious or benign, and where I must hand the decision to our teacher because it is a judgement call rather than a mechanical test. Then run the procedure on two submissions: one that tries to justify modus ponens by adding a conditional premise, and one that tries to justify inference to the best explanation by adding a premise that the best explanation is likely to be true. Make one outcome one the submitter will not like, and state what the procedure cannot settle. Please write in British English.
reasoning: |-
  We are dealing with a problem inspired by Lewis Carroll's "What the Tortoise Said to Achilles," where the Tortoise refuses to draw the conclusion from premises until Achilles writes down an additional premise (a conditional that links the premises to the conclusion). But then, the Tortoise requires yet another premise to connect the new set, and so on. This leads to an infinite regress.

  The key point is that a rule of inference cannot be justified by adding a premise because the rule is what allows us to use the premises to draw a conclusion. If we try to add a premise to justify the rule, we are effectively trying to use the rule to justify itself, which leads to a regress.

  Here is a checklist for you to follow when screening submissions:

  1. **Check if the submission attempts to justify a rule of inference by adding a premise.**
     - If not, then this checklist does not apply. Otherwise, proceed.

  2. **Determine whether the added premise is a restatement of the rule in the form of a conditional statement.**
     - For example, for modus ponens, the rule is: from P and (P→Q), infer Q. If the submission adds a premise like "If P and (P→Q), then Q", then that is a restatement of the rule as a premise.

  3. **Ask: does the argument now require the same rule to be applied in order to derive the conclusion?**
     - In the example above, to use the new premise, we would need modus ponens to apply it. So we have:
          Premise 1: P
          Premise 2: P→Q
          Premise 3: (P ∧ (P→Q)) → Q   [the added premise]
          We still need modus ponens to get from (P ∧ (P→Q)) to Q? Actually, note that we have P and P→Q, so we have the two parts. But to use premise 3, we need to combine P and P→Q into a conjunction (which requires another rule, conjunction introduction) and then apply modus ponens to premise 3 and that conjunction to get Q. So we are still relying on modus ponens.

  4. **Consider the regress:**
     - The regress is vicious because at every step we are forced to add another premise, and we still need the same rule to use that premise. This means we are never actually justified in drawing the conclusion without already having the rule.

  5. **Legitimate stopping point:**
     - The regress stops only when we accept a rule of inference without trying to justify it by a premise. Rules of inference are not premises; they are the means by which we move from premises to conclusions.

  6. **Vicious vs. benign regress:**
     - This regress is vicious because it prevents us from ever making an inference. It is not a benign regress (like an infinite chain of causes) because it blocks the very act of reasoning.

  7. **When to hand over to the teacher:**
     - If the submission attempts to justify a rule that is not a basic logical rule (e.g., inference to the best explanation) and argues that the added premise is not a restatement of the rule but a substantive principle, then it might be a judgment call. Also, if the rule in question is not a deductive rule but an ampliative one (like induction or abduction), the situation may be different because these are not truth-preserving in the same way. In such cases, the teacher should decide.

  Now, let's run the procedure on two submissions:

  **Submission 1: Trying to justify modus ponens by adding a conditional premise.**

     - Step 1: The submission attempts to justify modus ponens by adding a premise. (Yes)
     - Step 2: The added premise is typically: "If P and (P→Q), then Q". This is a restatement of modus ponens as a conditional.
     - Step 3: To use this premise, we must have P and (P→Q) as premises. Then we need to form the conjunction P∧(P→Q) (which requires the rule of conjunction introduction). Then we apply modus ponens again: from (P∧(P→Q)) and [(P∧(P→Q))→Q], we get Q. So we are using modus ponens again. Thus, we haven't avoided the rule.
     - Step 4: The regress is vicious because we would need an infinite number of such premises and still we would need modus ponens to use them.
     - Step 5: The legitimate stopping point is to accept modus ponens as a basic rule without a premise.
     - Step 6: The regress is vicious.
     - Step 7: This is a clear case of a deductive rule. The procedure determines that the justification fails.

     Outcome: Reject the submission. The submitter will not like this because we are saying their justification does not work.

  **Submission 2: Trying to justify inference to the best explanation (IBE) by adding a premise that the best explanation is likely to be true.**

     - Step 1: The submission attempts to justify IBE by adding a premise. (Yes)
     - Step 2: The added premise is: "If an explanation H is the best explanation of the evidence E, then H is likely to be true." This is a restatement of the principle underlying IBE, but note that IBE is an ampliative (non-deductive) rule. It is not a deductive rule, so the situation is different.
     - Step 3: In a deductive system, we might say that the rule of IBE is: from E and that H is the best explanation of E, we infer H (with some degree of likelihood). The added premise is a statement about the connection between being the best explanation and being likely true. However, we are not forced into the same kind of regress as in the deductive case because IBE is not a rule that preserves truth with certainty. The added premise might be seen as a justification for why we use IBE, but note that we are now using IBE (or perhaps a deductive rule) to draw the conclusion? We have:
          Premise 1: E (evidence)
          Premise 2: H is the best explanation of E.
          Premise 3: If H is the best explanation of E, then H is likely true.
          Now, to get to "H is likely true", we can use modus ponens (if we take the conditional as a material conditional). But that would be using modus ponens, not IBE. Alternatively, if we are using IBE to infer the conclusion, then we are using the very rule we are trying to justify.

          However, note that the rule of IBE is not the same as a deductive rule. The regress might be avoided if we consider that the added premise is not the rule itself but a supporting principle. But then we must ask: how do we get from the premises to the conclusion? We have to use some rule. If we use modus ponens, then we are not using IBE. If we use IBE, then we are back to needing IBE.

     - Step 4: The regress might be similar: we could ask for a justification for why we should accept premise 3. But note that IBE is not a deductive rule and is often taken as a fundamental principle of reasoning. So the regress might be stopped by accepting the principle as a premise without requiring a rule for it? But that would be confusing the rule with a premise.

     - Step 5: The legitimate stopping point might be to accept IBE as a basic rule of ampliative reasoning, without trying to justify it by a premise. Alternatively, one might argue that the added premise is a substantive claim about the world (that the best explanations tend to be true) which can be supported by evidence (e.g., the success of science). This is not a restatement of the rule but an empirical claim.

     - Step 6: The regress in this case might not be as clearly vicious because we are not in a purely deductive system. However, if we are trying to justify the rule by a premise, then we must use a rule to apply that premise. If we use a deductive rule (like modus ponens) then we haven't justified IBE but have instead replaced it with a deductive argument. If we use IBE to justify the premise, then we are using IBE to justify IBE (which is circular). So it is problematic.

     - Step 7: This is a judgment call. The procedure cannot settle it because the rule in question is not a deductive rule. The teacher must decide whether the added premise is a legitimate substantive claim or a disguised restatement of the rule.

     Outcome: Hand over to the teacher. The submitter might be unhappy because we are not accepting it outright, but we are not rejecting it either. The teacher will have to make a decision.

  What the procedure cannot settle: It cannot settle whether an ampliative rule of inference (like IBE) can be justified by an added premise that is a substantive (non-logical) claim. That requires philosophical judgment about the nature of the premise and the rule.
answer: |-
  Below is a step-by-step checklist for screening submissions that attempt to justify a rule of inference by adding a premise. It draws on Lewis Carroll’s dialogue (Achilles and the Tortoise) to identify when such justifications fail due to a vicious regress. The checklist includes criteria for distinguishing genuine justifications from circular restatements, assesses the regress, and flags cases requiring teacher judgement.

  **Checklist for Screening Submissions**  
  1. **Identify the target rule and added premise**:  
     - Confirm the submission tries to justify a rule of inference (e.g., modus ponens, inference to the best explanation) by introducing a new premise.  
     - Example: If the rule is "From \(P\) and \(P \rightarrow Q\), infer \(Q\)" (modus ponens), the added premise might be \((P \land (P \rightarrow Q)) \rightarrow Q\).  

  2. **Check for trivial restatement of the rule**:  
     - Ask: *Is the added premise merely a conditionalised version of the rule itself?*  
       - If yes, it is a **restatement**, not a justification (e.g., turning "infer \(Q\) from \(P\) and \(P \rightarrow Q\)" into "If \(P\) and \(P \rightarrow Q\), then \(Q\)").  
       - Genuine justifications avoid this by using *independent* premises (e.g., empirical evidence or non-circular axioms).  

  3. **Test for regress using the Tortoise puzzle**:  
     - Apply the Tortoise test: *After adding the premise, can the conclusion be drawn without reusing the original rule?*  
       - If the argument now requires the *same rule* to use the new premise (e.g., modus ponens to apply \((P \land (P \rightarrow Q)) \rightarrow Q\)), a regress begins.  
       - Example: To infer \(Q\) from \(P\), \(P \rightarrow Q\), and \((P \land (P \rightarrow Q)) \rightarrow Q\), you must *first* combine \(P\) and \(P \rightarrow Q\) (using conjunction introduction) *then* apply modus ponens again. This restarts the cycle.  

  4. **Assess the regress**:  
     - **Vicious regress**: The argument cannot conclude without infinitely many added premises (as in Carroll’s puzzle). This happens when the rule is presupposed in using the "justifying" premise.  
     - **Benign regress**: The chain stops after a finite step (e.g., if a premise appeals to a self-evident axiom or empirical fact). Rules of inference *cannot* have benign regresses—they are the tools that enable inference, not conclusions.  
     - **Legitimate stopping point**: The regress stops only if we accept a rule as *primitive* (e.g., modus ponens in deductive logic). Premises cannot justify rules without circularity.  

  5. **Hand to teacher if**:  
     - The rule is ampliative (e.g., inference to the best explanation, induction) *and* the premise is non-trivial (e.g., empirical or metaphysical).  
     - The submission claims the regress stops at a "self-justifying" premise (e.g., a priori intuition)—this is a philosophical judgement call.  
     - Uncertainty about whether the premise is independent or circular.  

  ---

  **Application to Submissions**  

  **Submission 1: Justifying modus ponens with a conditional premise**  
  > *"We can justify modus ponens by adding the premise: 'If \(P\) is true and \(P \rightarrow Q\) is true, then \(Q\) is true.'"*  

  - **Step 1**: Targets modus ponens (rule: from \(P\) and \(P \rightarrow Q\), infer \(Q\)) by adding \((P \land (P \rightarrow Q)) \rightarrow Q\).  
  - **Step 2**: The premise is a **trivial restatement** of the rule (conditionalises modus ponens).  
  - **Step 3**: **Regress test failed**. To use the new premise:  
    - Premises: \(P\), \(P \rightarrow Q\), \((P \land (P \rightarrow Q)) \rightarrow Q\).  
    - You must infer \(P \land (P \rightarrow Q)\) (requiring conjunction introduction—another rule), *then* apply modus ponens to get \(Q\). But applying modus ponens here *reuses the very rule being "justified"*.  
  - **Step 4**: **Vicious regress** begins. Infinite premises needed (e.g., next premise: \(((P \land (P \rightarrow Q)) \land [(P \land (P \rightarrow Q)) \rightarrow Q]) \rightarrow Q\)). No legitimate stopping point—modus ponens must be accepted as primitive.  
  - **Verdict**: **Reject**. The submitter will dislike this, but the "justification" is circular and regressive.  

  **Submission 2: Justifying inference to the best explanation (IBE) with a likelihood premise**  
  > *"We justify IBE by adding: 'The best explanation of any evidence is likely true.'"*  

  - **Step 1**: Targets IBE (rule: from "\(H\) best explains \(E\)", infer \(H\)) by adding "If \(H\) is the best explanation of \(E\), then \(H\) is likely true".  
  - **Step 2**: Not a trivial restatement. The premise adds an independent epistemic claim (about likelihood).  
  - **Step 3**: **Regress test ambiguous**.  
    - Premises: \(E\) (evidence), \(H\) best explains \(E\), "best explanations are likely true".  
    - To infer \(H\), you could use:  
      - Modus ponens (if treating "best explanations are likely true" as a conditional), but this *replaces IBE with deduction*, not justifies IBE.  
      - IBE itself to infer the premise "best explanations are likely true" (e.g., as the "best explanation" of science’s success)—but this uses IBE to justify IBE (circular).  
  - **Step 4**: **Regress risk**. If the premise is justified empirically (e.g., via scientific success), the regress *might* stop—but this is debatable. IBE is ampliative (non-deductive), so standard vicious-regress rules may not apply strictly.  
  - **Step 5**: **Hand to teacher**. This requires judgement:  
    - Is the premise a *substantive claim* (e.g., inductively supported) or a *covert restatement* of IBE?  
    - Does ampliative inference allow rule-justification via premises? (e.g., some philosophers accept this; others reject it as circular).  
  - **Verdict**: **Unsettled by procedure**. The submitter may be unhappy with the delay, but mechanical tests fail here.  

  ---

  **What the Procedure Cannot Settle**  
  - **Ampliative rules**: For non-deductive rules (e.g., IBE, induction), the line between "independent premise" and "circular restatement" is philosophical. The procedure flags this for teacher review.  
  - **Foundational claims**: If a submission asserts a "self-justifying" premise (e.g., "Logic is reliable"), this requires epistemological judgement.  
  - **Metaphysical justifications**: Premises invoking necessity, probability, or truth (e.g., "Truth is correspondence to reality") are beyond a mechanical test.  

  **Final Advice**: Use this checklist for deductive rules (e.g., modus ponens, disjunctive syllogism)—they *always* fail if "justified" by added premises. For ampliative rules, escalate to your teacher. Reject clear regresses (Submission 1); seek guidance on contentious cases (Submission 2).
