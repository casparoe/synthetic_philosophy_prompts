                - 'art': any boundary we draw would feel like an invention."

          Leaves and their descriptions:

            Leaf: Contextualism
              - Commitments: The truth value of a vague statement depends on the context of use. In any fixed context, the statement is either true or false.
              - Awkward consequence: The same object can be, for example, 'the same novel' in one context and 'not the same novel' in another, even if the object doesn't change.

            Leaf: Epistemicism
              - Commitments: There is a sharp boundary (e.g., a specific number of emendations) that makes the manuscript cease to be the same novel, but we cannot know where it is.
