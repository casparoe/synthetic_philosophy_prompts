prompt: |-
  I've just gone into business with a mate — two of us, no contracts, we just shook on splitting everything down the middle — and now I can't stop wondering what we actually committed to. A friend who did a philosophy degree pointed me at two rival answers: Bratman's account of shared intention, where our "we're going to do this" is really a mesh of our own individual intentions, and Gilbert's idea of a joint commitment, where the two of us together make something that neither of us can walk away from on our own say-so. Could you compare the two on that question of unilateral exit in particular — which of them better handles the case where my partner quietly stops pulling his weight, not out of malice, just because he's lost interest, and whether there's anything there for me to resent or only a plan that's come apart? I'm also curious about when each thinks the commitment comes into being: were we bound the moment we shook on it, or only once certain further conditions were met — and what does each say if it turns out he was only ever going along with it to be polite? If the contrast I've drawn is a false one — if these two aren't really rivals on the exit question, or if I'm conflating a question about obligation with one about intention — just say so rather than humouring me, and flag anything you're unsure of rather than asserting it confidently. Write it in American English, and dont worry about being even-handed between them.
reasoning: |-
  Okay, the user is in a business partnership with a friend based on a handshake agreement to split everything equally. Now they're concerned about the commitment they made, especially regarding unilateral exit when a partner slacks off without malice. They mentioned Bratman and Gilbert's theories from a philosophy degree friend. 

  First, I need to unpack both theories. Bratman sees shared intentions as meshing individual plans - each person intends the joint activity because of the other's intention. It's interdependent but individualistic. Gilbert's joint commitment is a collective "we" that creates obligations neither can revoke alone. 

  The core tension is about unilateral exit. The user specifically wants to know: if one partner disengages without malice, which theory better explains resentment? And when did the commitment start? Also, what if one partner was just being polite?

  For Bratman: No obligation, just interdependent intentions. If Partner B drifts away, the mesh unravels. Resentment might stem from broken reliance but no moral violation. Commitment starts when both form interdependent intentions - the handshake might signal this. If Partner B was just being polite, there was never real shared intention.

  For Gilbert: The handshake likely created joint commitment. Unilateral exit violates obligation. Resentment is justified as a normative wrong. Even polite agreement creates commitment - insincere assent still binds unless conditions like coercion exist. 

  The theories are rivals on exit. User isn't confusing obligation and intention - Gilbert explicitly adds obligation where Bratman avoids it. 

  User's deeper needs: They feel wronged but unsure if valid. They want philosophical validation for resentment and clarity on when they became bound. Might also seek leverage for confrontation. 

  Gilbert better validates their resentment; Bratman treats it as mere disappointment. Gilbert's "moment of handshake" binding also aligns with their instinct. 

  Should flag Gilbert's practical limitation: Philosophy identifies obligation but enforcement is separate. Might suggest: "Gilbert explains why you feel owed, but consult a lawyer about recourse."
answer: |-
  Here's a sharp comparison of Bratman and Gilbert on your core questions about unilateral exit, the origin of commitment, and insincere agreement, favoring clarity over artificial balance:

  **1. Unilateral Exit & The Slacking Partner:**
  *   **Bratman:** This is *exactly* what his framework predicts *can* happen without normative violation. Your shared intention is just a mesh of *your* intention (to run the business together, splitting things) and *his* intention (ditto). If he quietly loses interest and stops pulling his weight, *his* individual intention has changed or dissolved. The "mesh" is broken. There's no *obligation* for him to maintain his intention. You can **resent the practical consequences** – your plans are wrecked, you relied on him, you're doing all the work. But Bratman would say you **cannot rightly resent it as a *breach of commitment***, because there was no joint entity or obligation beyond the individual intentions that constituted the shared activity. The plan just "came apart" due to a change in one participant's attitude.
  *   **Gilbert:** **Unilateral exit is impossible.** The handshake created a *joint commitment*, a new normative entity. You are both "plural subjects" bound by it. Him quietly slacking off isn't just changing his mind; it's **violating an obligation *to you*** that arises from the commitment *you both created together*. His lack of malice (just lost interest) doesn't absolve him. He owes you his effort as part of the joint endeavor. Your **resentment is entirely justified** on Gilbert's view – he's failing to uphold *his part of a joint obligation* he freely entered. You don't just have a broken plan; you have a *wronged partner*.

  **2. When Does the Commitment Begin? (The Handshake Moment):**
  *   **Bratman:** The commitment (as interdependent intentions) **begins when the relevant individual intentions are formed and mutually recognized.** The handshake is *strong evidence* of that mutual recognition and formation. If *at the moment of the handshake* both of you genuinely intended to run the business together splitting everything *because* the other did too, then the shared intention (the Bratman-style "commitment") exists *then*. It's about the state of individual minds and their interrelation at that time.
  *   **Gilbert:** The joint commitment **is created *by* the handshake (or the agreement it signifies).** The act of publicly expressing readiness to commit *together* (often with words like "we agree" or "let's do this") **is the very act that brings the commitment into existence.** It's a performative act creating a new social fact. If the handshake signified a joint agreement to pursue the business as partners splitting everything, then **you were bound *the moment you shook on it***.

  **3. Insincere Agreement ("Just Being Polite"):**
  *   **Bratman:** **No shared intention ever existed.** For Bratman, shared intention requires that *each* person *genuinely* intends the joint activity *because* the other does. If your partner was *only* "going along to be polite" and *never* genuinely intended to run the business as an equal partner splitting things (merely humoring you), then his individual intention was fundamentally different from what you thought. There was never a true "mesh" of *appropriate* intentions. You *thought* there was a shared intention, but based on his state of mind, there wasn't one from the start. You were acting on a mistaken belief.
  *   **Gilbert:** **The joint commitment *likely still exists*.** Gilbert focuses on the *outward agreement*. Did he openly express (verbally or by the handshake) his readiness to commit jointly with you? If so, that act *creates* the joint commitment, *even if internally he was insincere or reluctant*. You are both bound by the public act of commitment. His insincerity might make him deceptive or dishonorable, but it doesn't necessarily invalidate the normative structure created by the agreement *you both ostensibly made*. Gilbert might allow for defenses like duress, but mere internal insincerity ("just being polite") without external coercion usually doesn't dissolve the obligation created by the joint act of commitment. You *can* hold him to it (and resent him for insincerity *on top* of any failure to perform).

  **Are They Rivals? Yes, Starkly.**
  *   Your contrast is spot-on. They are fundamental rivals on the nature of the "we" and the source of obligation.
  *   Bratman **reduces "we intend" to a complex structure of individual "I intend" states.** Obligations are at best derivative (reliance, promises *individuals* might make). Exit is always possible by changing one's individual intention.
  *   Gilbert **posits a genuine collective "we" created by joint commitment, generating sui generis obligations *to the other party*** that bind until jointly rescinded. Unilateral exit is conceptually impossible; walking away violates an obligation.
  *   You are *not* conflating obligation and intention; that's the core battleground. Gilbert explicitly argues joint commitment *creates obligations* that Bratman's individualistic account cannot capture. Bratman deliberately avoids invoking such irreducible collective obligations.

  **Conclusion for Your Situation:**
  *   **Bratman** says: Your plan fell apart because your mate changed his mind. You can be furious it failed and that you're left holding the bag, but you weren't *wronged* in a deeper normative sense. The commitment was only ever mutual intentions, and intentions can change. The handshake signaled the start of those intentions, but they needed to be genuine.
  *   **Gilbert** says: You were bound the instant you shook hands. Your mate violated an obligation *to you* by slacking off, regardless of his lack of malice. You are fundamentally *wronged*, and your resentment is legitimate. Even if he was just being polite at the start, he likely still committed himself to you jointly by the act of agreement.

  **Gilbert's view** provides the stronger philosophical foundation for feeling truly *committed* by a handshake and *wronged* by unilateral disengagement, even without malice. It treats the handshake itself as the moment of binding. Bratman offers an explanation of coordination but leaves you normatively adrift when the coordination fails due to a partner's changed mind. Which one *feels* truer to your experience of that handshake and the sting of your partner's disengagement? That's likely the crux.
