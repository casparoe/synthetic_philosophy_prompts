  Okay, the user is a retired field biologist who spent 35 years studying shorebird foraging ecology. Now they're on the scientific advisory committee for the Calder Foundation, which funds behavioral research. They're preparing for a meeting where they'll review a proposal on whether humans' ability to synchronize movements (like dancing or clapping together) is an evolutionary adaptation for building coalitions. The proposal cites three lines of evidence: universality across societies, early emergence in infants, and increased cooperation after synchrony.

  The user feels uneasy about the proposal's leap from current evidence to an evolutionary adaptation claim. They're struggling to articulate why, especially since their usual fieldwork approach isn't applicable here. They've read philosophy of science but still feel stuck. Their committee includes two extremes: one who rejects all adaptationist claims, and another who accepts this evidence as sufficient. The user needs a memo that recommends a decision (approve, decline, or approve with conditions), sets a standard for evaluating adaptationist claims, addresses both colleagues' positions, and tackles their unspoken worry about circularity in labeling the behavior as "affiliation signaling."

  Hmm, the user's core concern seems to be about evidentiary thresholds. Their field biology background makes them want observable, testable evidence for function - something impossible for Pleistocene adaptations. The memo must bridge this gap by defining what constitutes adequate evidence for evolutionary claims without direct observation. 

  The circularity worry is particularly subtle. By naming the behavior "affiliation signaling," the researchers bake the function into the description, making the claim unfalsifiable. The memo should explicitly call this out as problematic and suggest neutral terminology.

  I think the best approach is to recommend conditional approval. The proposal has merit but overreaches. Conditions should require: 1) comparative work with primates to test if synchrony is uniquely human, 2) dissociation studies to see if cooperation effects are specific to synchrony, 3) removing loaded terminology like "affiliation signaling." This turns their "three lines" into a starting point rather than conclusion.

  For the colleagues: the anti-adaptationist stance is too broad - we can test adaptation claims through comparative methods and dissociation studies. The pro-adaptationist stance is too lenient - universality and ontogeny alone don't prove adaptation. The memo should emphasize that adaptation is one possible explanation among many (exaptation, spandrel, etc.).

  Most importantly, the memo must state plainly that no study can definitively prove Pleistocene selection pressures. But we can fund research that strengthens inferences - hence conditional approval. The foundation's role is to fund testable components while requiring intellectual humility about historical claims.
answer: |-
  ## Memorandum: Pre-Vote Recommendation for Synchrony Adaptation Proposal

  **To:** Calder Foundation Scientific Advisory Committee  
  **From:** [Your Name], Organismal Biology Representative  
  **Date:** 5 November 2023  
  **Subject:** Recommendation & Evaluation Framework for Proposal: "The Evolutionary Adaptation of Rhythmic Synchrony for Coalition Affiliation Signaling"  
  **Proposed Disposition:** **Approve with Conditions** (Detailed below, requiring protocol revisions by Q1 next year)

  **1. Recommendation Summary:**  
  The core question – whether the human capacity for rhythmic synchrony is a specific adaptation for coalition building – is significant and the proposed research is methodologically sound *for investigating proximate mechanisms and effects*. However, the proposal overreaches in concluding an *evolutionary adaptation for a specific function* based solely on the presented evidence. The leap from demonstrable *current utility* and *developmental reliability* to *past selective pressure* is premature. I recommend **conditional approval**, contingent on significant revisions addressing the adaptationist inference gap. Approval is warranted due to the intrinsic value of studying synchrony's mechanics and social effects, but the framing must be rigorously corrected.

  **2. Conditions for Approval (Deadline: 30 days before our Q1 Meeting):**
      *   **Reframe the Central Question & Terminology:** Remove the *a priori* label "affiliation signalling" and definitive claims that synchrony *is* an adaptation "for coalition solidarity." The proposal must explicitly state it is *testing the hypothesis* that synchrony *may have evolved* (or been exapted, co-opted, etc.) due to its effects on affiliation and cooperation. Terminology should be descriptive (e.g., "rhythmic synchrony," "coordinated movement," "entrainment") and hypothesis-neutral.
      *   **Integrate Comparative Analysis:** Add a feasible, focused comparative component. This could involve:
          *   A systematic review/meta-analysis of rhythmic entrainment capacities in non-human primates (especially our closest relatives) and other highly social mammals/birds. Is precise, flexible, cross-modal entrainment uniquely human or shared? If shared, under what social contexts does it manifest?
          *   Pilot behavioral experiments testing propensity for and consequences of induced synchrony (e.g., using metronomes or movement cues) in a suitable non-human model (e.g., chimpanzees, macaques) regarding cooperation tasks.
      *   **Design Dissociation Studies:** Include experiments within the existing human protocols to test if the observed affiliation/cooperation effects are *specifically caused by synchrony itself* or by *other factors inherent in coordinated activity*. Examples:
          *   **Control Condition 1 (Shared Goal, No Synchrony):** Participants work together on a non-rhythmic, coordinated task requiring similar physical proximity and shared focus (e.g., jointly building a structure, solving a puzzle requiring turn-taking) but without rhythmic entrainment. Measure subsequent cooperation/liking.
          *   **Control Condition 2 (Synchrony, No Shared Goal):** Participants engage in rhythmic synchrony (tapping/marching) but as isolated individuals responding only to a central beat, not interacting with or perceiving each other's actions. Measure subsequent cooperation/liking when paired.
      *   **Explicitly Address Alternative Explanations:** The revised proposal must dedicate a section to plausible non-adaptive or alternative adaptive explanations for the universality, early development, and social effects of synchrony (e.g., spandrel of general auditory-motor processing, exaptation from mother-infant bonding or predator detection, byproduct of vocal learning, adaptation for perceptual grouping or prediction). Outline how the proposed research (including new conditions) helps distinguish among these.

  **3. The Standard: Evaluating Adaptationist Claims for Behaviour**  
  This proposal highlights the challenges inherent in inferring evolutionary history from contemporary function. We must require that proposals making strong adaptationist claims demonstrate evidence beyond the "Three Cs" often presented (Current utility, Cross-cultural universality, Childhood emergence). A robust case requires:

  *   **Comparative Evidence:** Does the trait show phylogenetic patterns consistent with adaptation to a specific selective pressure? Is it uniquely elaborated in species facing that pressure? (This proposal currently lacks this).
  *   **Specificity of Design & Dissociation:** Is the trait *specifically* suited to the proposed function? Can its effects be dissociated from more general mechanisms (e.g., shared attention, physical co-presence, positive affect)? (The proposal's evidence doesn't yet achieve this).
  *   **Falsifiability of Alternatives:** Can plausible alternative explanations (e.g., spandrel, exaptation, byproduct) be reasonably tested and potentially ruled out by the proposed methods? (Not adequately addressed).
  *   **Avoidance of Teleological Language:** Function must be argued *from evidence*, not baked into the description (e.g., "affiliation signalling" implies the function *is* the explanation).

  **4. Addressing Colleagues' Positions:**

  *   **Position A (Reject all Adaptationist Proposals):** "Adaptationist claims are inherently unfalsifiable."
      *   **Response:** This overcorrects. While proving *historical* selection definitively is challenging, strong adaptationist hypotheses *are* testable and falsifiable through the standard outlined above (comparative evidence, specificity, dissociation, ruling out alternatives). We can fund research that strengthens or weakens such inferences without demanding impossible proof of Pleistocene events. Rejecting all adaptationist inquiries stifles a core biological question.
  *   **Position B (Evidence is Sufficient):** "Universality, ontogeny, and proximate effects constitute evidence as strong as anything else we fund. Not funding adaptation claims undermines the foundation's purpose."
      *   **Response:** While these three lines are valuable and necessary *components*, they are insufficient *alone* to conclude a specific evolutionary adaptation. Universality and early development could stem from general learning/neural mechanisms. Proximate effects show *current* utility, not *historical* selective pressure. Funding proposals that conflate proximate effects with ultimate causes risks endorsing poorly supported just-so stories and weakens scientific rigor. Our purpose is to fund rigorous behavioral science, which includes demanding robust evidence for the claims made.

  **5. What Would Change the Recommendation?**

  *   **To Decline:** If the team refuses the revisions, particularly removing the teleological framing ("affiliation signalling") and failing to incorporate feasible comparative analysis or dissociation controls. Proceeding with the current framing renders the core claim effectively untestable within the proposal.
  *   **To Approve Unconditionally:** If the team presented compelling preliminary comparative data demonstrating the *uniqueness* of human-level flexible synchrony among primates correlated with coalitional complexity, *and* dissociation evidence showing synchrony's effects are distinct from general coordination.

  **6. Articulating the Core Worry: The Gap and the Label**  
  You have perfectly identified the critical flaw. The team establishes that rhythmic synchrony is **species-typical** (universal), **developmentally robust** (early emergence), and **proximately functional** (enhances affiliation/cooperation). This is excellent science *about the present*. However, they leap to the conclusion that it is an **adaptation** – a trait *shaped by natural selection specifically for* the function of "affiliation signalling." This leap conflates current utility with evolutionary cause.

  *   **The Gap:** Proving *selection for a specific past function* requires evidence beyond current utility and reliability. It necessitates showing the trait's design is *specifically suited* to that function in ways unlikely to arise by chance or as a byproduct, and that it arose or was modified *in response to* that selective pressure. The Pleistocene is inaccessible, so we rely on inference from comparative biology, specificity, and dissociability. This proposal currently lacks the necessary evidence to bridge this gap.
  *   **The Label ("Affiliation Signalling")**: This term is deeply problematic. It *presupposes* the function (signalling affiliation) as the explanation. It turns the *hypothesis* into the *description*. This makes the claim circular: "Why do people synchronize? To signal affiliation. How do we know it signals affiliation? Because that's what synchrony is for." Descriptive labels ("rhythmic synchrony") are neutral; explanatory labels ("affiliation signalling") should only be applied *after* strong evidence supports the function as the primary evolutionary driver.

  **7. The Unclosable Gap and Our Responsibility**  
  It is true that **no feasible study funded by this foundation can provide definitive, irrefutable proof of the specific selective pressures acting in the Pleistocene.** The historical record is lost. However, this does not render all adaptationist hypotheses invalid or unfundable. We *can* fund research that significantly strengthens the inference by:
  1.  **Testing Predictions:** Does the trait show expected phylogenetic patterns? Is it specifically dissociable from alternatives?
  2.  **Ruling Out Plausible Alternatives:** Can we show other explanations (e.g., byproduct of general cognition) are less likely given the evidence?
  3.  **Building Consilience:** Does evidence from development, neuroscience, cross-cultural studies, and comparative work converge on the adaptation hypothesis more strongly than on alternatives?

  **Our Responsibility:** When faced with a proposal whose central adaptationist claim cannot be *definitively proven* within the research, but where valuable proximate science can be done and the adaptation hypothesis can be *rigorously tested* (strengthened or weakened), we should:
  1.  **Demand Precise Framing:** Fund the research into the *mechanisms, development, and effects*, but require the adaptation claim be presented as a testable hypothesis, not a conclusion.
  2.  **Require Critical Tests:** Insist on components (comparative, dissociation) that provide the strongest possible inferences about evolutionary history.
  3.  **Value the Proximate Science:** Recognize that understanding *how* the behavior works and *what* it does now is intrinsically valuable, even if the ultimate evolutionary cause remains partially inferred.

  **Conclusion:**  
  The proposed research on rhythmic synchrony is worthy of support for its investigation of a fundamental human capacity and its social consequences. However, the unequivocal adaptationist conclusion and teleological framing are unjustified by the presented evidence and methodology. By imposing the outlined conditions – reframing the hypothesis, adding comparative and dissociation elements, and eliminating "affiliation signalling" – we can fund rigorous science that probes both the proximate mechanisms and the evolutionary hypothesis without prematurely endorsing it. This approach provides a template for evaluating the other adaptation-leaning proposals on our docket: demand evidence beyond the "Three Cs," insist on specificity and falsifiability, prioritize descriptive language, and fund the testable science while treating historical claims as robust hypotheses requiring multiple lines of convergent evidence. I urge the committee to support **conditional approval** as described.
