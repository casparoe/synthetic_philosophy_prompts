answer: |-
  Here's the translation of philosophical positions into your variable-font framework, followed by a residue report focused on concrete cases:

  ### Translated Positions in Variable-Font Vocabulary
  1.  **Essentialism (Abstract Schema):**
      *   *Translation:* The 'a' is defined by invariant topological *contour compatibility* constraints within the designspace. These are non-interpolating features: specific point-sequence relationships (e.g., terminal directions, bowl closure topology, stem attachment logic) that *must* hold true across all masters and all interpolated/extrapolated instances for a glyph to be recognized as an 'a'. This invariant is the "master schema" instantiated by every valid point in the designspace.
      *   *Natural Home:* The **core point-compatibility rules** enforced during master drawing and interpolation setup. A point violating this invariant during interpolation flags an error (e.g., crossing contours, disappearing stems).

  2.  **Conventionalism (Historical Usage):**
      *   *Translation:* The 'a' is defined solely by the **default instance**. This default is an arbitrary historical/cultural anchor point within the designspace. What makes an instance an 'a' is its acceptance *as an 'a'* within the typographic community, rooted in tradition, not inherent shape properties. Other instances are 'a's only by their relationship to this conventional default.
      *   *Natural Home:* The **`wdth` 100`, `wght` 400`, `opsz` 14`** (or your chosen default coordinates). This instance isn't ontologically privileged by the *machinery* (it interpolates like any other point), but it's socially privileged as the reference.

  3.  **Family Resemblance (No Single Necessary Feature):**
      *   *Translation:* There is no single invariant. An 'a' is any glyph instance that shares enough overlapping features with *some chain of other instances* within the connected designspace, even if no single feature exists in all. Central members are near the **primary masters**; peripheral members are near the **designspace boundaries** or involve complex **delta overrides**. Recognition relies on overlapping similarities across the interpolation continuum.
      *   *Natural Home:* The **entire interpolatable region** of the designspace for the 'a' glyph. The machinery enables smooth transitions (resemblance chains), making peripheral members (e.g., ultra-wide, ultra-black 'a') recognizable via their connection path to central members.

  4.  **Structuralism (System of Contrasts):**
      *   *Translation:* An 'a' is defined solely by its distinct function within the **glyph substitution system** (OpenType features, Unicode slot, rendering context). Its shape matters only insofar as it contrasts sufficiently with the shapes of 'o', 'd', 'b', etc., *at the same point in the designspace* to avoid confusion in text. Different styles (instances) are valid 'a's if they maintain this systemic contrast.
      *   *Natural Home:* **Instance-specific glyph substitution rules** and **contextual kerning pairs**. The 'a' exists only relationally within the system defined at a specific `(wght, wdth, opsz, ...)` coordinate. The machinery ensures consistent relational behaviour across the space.

  ---

  ### Residue Report: What Your Framework Can and Cannot Capture

  **I. Translates Cleanly (Framework Handles Naturally):**
  1.  **Family Resemblance & The Interpolation Continuum:** The core strength. Your designspace *is* a resemblance chain generator. A peripheral UltraBlack 'a' (`wght` 1000) is recognized as an 'a' *because* it smoothly interpolates from the Default (`wght` 400) through all intermediates to the Black Master (`wght` 900). The machinery perfectly embodies Wittgensteinian "family resemblance".
  2.  **Structuralism & Glyph Substitution:** The framework directly supports defining contrast via substitution rules (e.g., ensuring 'a' and 'o' don't collide or become identical at any instance). Contextual alternates and kerning are instance-specific implementations of systemic contrast.
  3.  **Conventionalism & The Default Instance:** The default is explicitly defined and serves as the practical anchor point for users. The framework doesn't *philosophically* privilege it, but its role as the starting point aligns with conventionalism's need for an arbitrary reference.

  **II. Translates with Distortion (Framework Forces a Specific View):**
  1.  **Essentialism vs. Extrapolation:** The machinery gleefully *manufactures shapes no designer drew* (`wght` 1100, `wdth` 25). Does this violate essence?
      *   *Framework Says:* If contour compatibility holds (no crossing lines, points stay ordered), it *is* a valid 'a' instance, just an extreme one. The invariant is purely topological/mechanical continuity, not a pre-existing ideal form. The "essence" is reduced to interpolation survival.
  2.  **The Double/Single-Story 'a' Axis:**
      *   *Framework Says:* This is technically feasible. Master 1: Double-story. Master 2: Single-story. Ensure contour compatibility (a major challenge!). Interpolation creates smooth transitions. At extremes, you get recognizable forms accepted as 'a's (double/single-story). Midpoints are strange hybrids.
      *   *Distortion:* The framework treats this as a stylistic axis like weight or width. It *cannot* inherently say switching story-count is philosophically different from changing weight. Legitimacy becomes purely technical (can it interpolate without errors?) and conventional (will users accept the hybrid midpoint as an 'a'?).
  3.  **Structuralism & Extreme Extrapolation:** At `wdth` 10, the 'a' might become a vertical line. Does it still contrast with 'o' (a dot?) and 'n' (a shorter line?)? Maybe, but is it *functional*?
      *   *Framework Says:* If the substitution rules don't break technically (e.g., the glyph is still mapped to U+0061), it *is* the 'a' for that instance. Contrast is defined by the *current* shapes at that coordinate, not by a universal minimum. Functionality collapse is a user problem, not an interpolation error.

  **III. No Counterpart in the Vocabulary (The Real Residue):**
  1.  **Distinguishing Extreme Style from Mistake:**
      *   *Framework Says:* A "mistake" is purely technical: contour incompatibility causing interpolation errors (crossing lines, disappearing elements). An intentional, radical stylistic departure (e.g., deconstructed 'a') that maintains contour compatibility is just a valid, extreme instance. **The framework has *no* internal concept of semantic error or violation of "a-ness," only interpolation error.** Judging radical style vs. mistake relies entirely on *external* designer intent and user convention.
  2.  **Judging Axis Legitimacy (Beyond Technical Feasibility):**
      *   *Framework Says:* An axis is "illegitimate" only if interpolation fails technically. An axis transforming 'a' smoothly into 'o' *is* possible if masters are compatible. **The framework cannot say this axis is philosophically wrong or destroys letter identity.** It can only flag it if the contours become incompatible *during* interpolation. Preventing such an axis is an *external* constraint based on the *purpose* of the font (it must represent distinct letters), not an inherent limitation of interpolation mechanics. "Letter" is not a primitive in the interpolation engine; "glyph contour set" is.
  3.  **The Essence of "a" vs. Glyph Interpolation:**
      *   *Case:* Could you interpolate a compatible 'a' master into a 'd' master?
      *   *Framework Says:* Absolutely. If the point structures are compatible, the machinery will generate a smooth morph from 'a' to 'd'. Midpoints might resemble 'a' with a tall ascender or 'd' with an open bowl, but they won't be recognized as valid letters. **The framework has no concept that 'a' and 'd' are distinct linguistic categories.** It only sees compatible vs. incompatible point sets. Preventing this is an *external* design decision (maintaining systemic contrast) enforced by not connecting incompatible glyphs in the same designspace.

  **Conclusion: The Nature of the Residue**
  The residue is **not primarily a defect in your vocabulary** for its intended purpose (creating functional variable fonts). It's a sign that **the original philosophical question ("What *is* an 'a'?") is doing different work.**

  Your framework brilliantly operationalizes *how 'a's can vary while remaining functionally connected and technically coherent within a designed system*. It perfectly captures family resemblance and systemic contrast *within a defined system*. However:

  1.  **It Presupposes Categories:** The framework *starts* with the assumption of distinct glyph slots ('a', 'b', 'o'). It doesn't define *why* a particular contour set is assigned to the 'a' slot; that's an external input (designer intent, Unicode, convention).
  2.  **It Lacks Semantic Grounding:** "A-ness" as a meaningful category exists outside the machinery, in usage, convention, and language. The interpolation engine cares about points and math, not meaning.
  3.  **Normativity is External:** Judgments about stylistic legitimacy, semantic correctness, and axis validity are *practical* and *normative*. They depend on the font's intended use, user expectations, and the conventions of writing systems. Your framework provides the powerful *means* for variation but not the ultimate *ends* or the fundamental *grounding* of letter identity.

  **In essence, your framework shows that within a rigorously defined stylistic system, the question "What makes every 'a' an 'a'?" largely *collapses* into questions of functional continuity (interpolation), systemic role (substitution/contrast), and conventional anchoring (default). The unanswerable residue points to the fact that letter identity is, at its root, a product of shared practice and linguistic function – things your tools enable and constrain, but do not define.** You build the stage and the actors; the play of meaning happens elsewhere.
