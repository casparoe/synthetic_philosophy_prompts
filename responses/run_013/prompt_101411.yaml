  I need to approach this systematically. First, I should brainstorm the key criteria that historians use to evaluate legendary narratives: whether the narrative makes factual claims, whether testimony alone suffices or requires corroboration, where the burden of proof lies, what constitutes a "surviving kernel" of truth, and whether the mere existence of real places or people behind the story is sufficient.

  For the decision tree structure, I'll need binary questions that branch logically. Each leaf should represent a named historical position (or "unnamed" if it's incoherent) with its most awkward commitment. The three test cases must work consistently within each position. I should aim for 6-10 nodes and no more than 8 leaves to keep it concise for a one-page handout.

  For the questions, I'm thinking about starting with whether the narrative makes factual claims at all (some might argue it's purely allegorical). Then I need to address whether testimony alone can establish history, which gets into epistemological debates. The burden of proof question is crucial - whether we default to belief or skepticism. The "kernel of truth" question distinguishes between minimalists and others. Location vs person distinction matters - some accept real settings but not characters. And the "central event" question addresses whether the core story must be historical.

  The positions that might emerge include: Hyper-Criticism (rejects all), Historical Minimalism (accepts only settings), Testimonial Privilege (favors traditions), Kernel Acceptance (core events), and Historical Maximalism (accepts narratives largely as is). I need to ensure each position consistently handles Troy, Arthur, and Exodus.

  For problematic combinations: If someone thinks narratives make factual claims but testimony never suffices without corroboration, and burden is on claimants, but then accepts kernels without central events - that might be incoherent because it sets too high a bar. Similarly, accepting testimony alone with burden on skeptics but rejecting kernels would be inconsistent.

  The most awkward commitments will highlight tensions: Minimalism struggles with dismissing Arthur entirely, Maximalism has trouble with supernatural elements, Testimonial Privilege faces circularity challenges.

  I'll structure this as a clear flowchart with questions leading to positions, making sure every branch is phrased neutrally and each leaf clearly labels the position with its awkward concession. The test cases will show how each position resolves Troy (probably accepts as war), Arthur (variously accepts leader or nothing), and Exodus (rejects or accepts partially).
answer: |-
  ## Historiographical Decision Tree: Legend vs. History

  This tree helps navigate positions on legendary narratives (Trojan War, Arthur, Exodus) by starting from foundational commitments. Answer each question based on your core beliefs about history and evidence.

  1.  **Does the narrative *intend* to make factual claims about past events?**
      *   **No (Allegory/Myth):** → **Position: Symbolic Interpretation**
          *   *Most Awkward Commitment:* Must argue that seemingly historical details (e.g., Hattusa/Hisarlik = Troy, Egyptian records mentioning 'Asiatics') are purely coincidental or irrelevant metaphors.
          *   *Test Cases:* Troy (Symbolic conflict), Arthur (National myth), Exodus (Liberation theology).
      *   **Yes:** → Go to Q2.

  2.  **Can compelling *testimony* (oral/written tradition) alone establish a historical event's core occurrence?**
      *   **Yes:** → Go to Q3.
      *   **No (Requires Corroboration):** → Go to Q4.

  3.  **Where does the *burden of proof* lie for accepting a traditional narrative's core claim?**
      *   **On the Skeptic (Assumed True until Disproven):** → **Position: Testimonial Privilege**
          *   *Most Awkward Commitment:* Must accept narratives largely as transmitted unless faced with *irrefutable* contradiction (e.g., Exodus chronology vs. Egyptian records; Arthur's absence in contemporary chronicles).
          *   *Test Cases:* Troy (War happened largely as sung), Arthur (King existed and fought Saxons), Exodus (Mass migration occurred).
      *   **On the Claimant (Assumed Legendary until Proven):** → Go to Q5.

  4.  **Is the discovery of a *real historical setting* (e.g., Troy, Late Roman Britain, New Kingdom Egypt) sufficient to establish the *core narrative* as historical?**
      *   **Yes:** → Go to Q6.
      *   **No:** → **Position: Historical Minimalism (Settings Only)**
          *   *Most Awkward Commitment:* Must deny any historicity to figures/events central to the *story* (e.g., Agamemnon/Paris/Helen, Arthur/Guinevere/Mordred, Moses/Plagues/Red Sea) even if the setting is real.
          *   *Test Cases:* Troy (Hisarlik existed; War unknown/mundane), Arthur (Post-Roman Britain fragmented; no 'King Arthur'), Exodus (Canaanites in Egypt; no mass Exodus).

  5.  **Can we accept a *"kernel of truth"* (e.g., a smaller conflict, a local leader, a small group's flight) as the origin, even if radically different from the legend?**
      *   **Yes:** → Go to Q7.
      *   **No:** → **Position: Hyper-Criticism**
          *   *Most Awkward Commitment:* Must dismiss *all* possibility of historical basis, often requiring arguments that traditions *always* fabricate wholesale or that absence of evidence *is* evidence of absence in incomplete records.
          *   *Test Cases:* Troy (Pure epic invention), Arthur (Complete literary fabrication), Exodus (Entirely theological construct).

  6.  **Is the discovery of a *real historical person* plausibly connected to the legend (e.g., a Hittite king 'Alaksandu' for Paris/Alexander, a Roman 'Artorius', a Semitic official in Egypt) sufficient to establish the *core narrative* as historical?**
      *   **Yes:** → **Position: Historical Maximalism (Names Anchor Narrative)**
          *   *Most Awkward Commitment:* Must connect the discovered name/figure directly to the *specific legendary events* with minimal evidence (e.g., Alaksandu *must* be Paris; Artorius *must* be Arthur; any Semitic official *must* relate to Moses/Exodus).
          *   *Test Cases:* Troy (Alaksandu *is* Paris; War happened), Arthur (Artorius *is* Arthur; fought Saxons), Exodus (Semitic official *is* Moses; led Exodus).
      *   **No:** → **Position: Historical Minimalism (Settings Only)** (See Q4)

  7.  **Must the *surviving historical kernel* be the narrative's *central event* (e.g., the War, Arthur's Kingship/Battles, the Exodus)?**
      *   **Yes:** → **Position: Central Event Kernel Acceptance**
          *   *Most Awkward Commitment:* Requires identifying a plausible historical core event *specifically matching the legend's focus* amidst layers of myth (e.g., identifying a *specific* conflict at Troy, a *specific* battle leader in Britain, a *specific* group's departure from Egypt).
          *   *Test Cases:* Troy (Major conflict at Hisarlik ~1200 BCE), Arthur (Significant British military leader post-400 CE), Exodus (Significant departure/expulsion of Semitic people from Egypt).
      *   **No (Peripheral elements suffice):** → **Position: Peripheral Element Kernel Acceptance**
          *   *Most Awkward Commitment:* Accepts the narrative as "historically rooted" based on elements *not* central to the story (e.g., Mycenaean trade with Anatolia; Saxon invasions generally; presence of Apiru/Shasu in Egypt), potentially making the core story fictional.
          *   *Test Cases:* Troy (Trade/raids, but no epic war), Arthur (Saxon invasions, but no king unifying resistance), Exodus (Canaanite slaves/small groups leaving, but no Moses/miracles/national event).

  **Diagnosing Gaps & Incoherent Paths:**

  *   **Q2: Yes → Q3: On the Claimant → Q5: No:** This path leads to **Hyper-Criticism**. It's logically consistent but requires rejecting testimony's value entirely.
  *   **Q2: No → Q4: Yes → Q6: No:** This leads directly to **Historical Minimalism (Settings Only)**. The path is coherent.
  *   **Q2: No → Q4: No:** Leads directly to **Hyper-Criticism**. This position rejects *both* testimony and settings as evidence for the *narrative*, demanding impossible levels of proof for ancient events.
  *   **Potential Incoherence:** A path demanding independent corroboration (Q2: No) but then accepting kernels based *only* on the testimony itself (Q5: Yes) without requiring corroboration *for the kernel* is illogical. This path is blocked – Q5 requires passing through Q2: Yes (Testimony *can* establish core) OR Q4: No (Rejecting settings leads to Hyper-Criticism before Q5).
  *   **Unattractive/Unnamed Branch:** **Q1: Yes → Q2: Yes → Q3: On the Claimant → Q5: Yes → Q7: No (Peripheral Kernel).** While logically possible, it's unstable: Privileging testimony (Q2:Yes) but placing burden on claimant (Q3:On Claimant) *and* accepting only peripheral kernels (Q7:No) is a conflicted, weak position with little scholarly defense. It concedes the core story is false while insisting the tradition is fundamentally "true" based on trivia.

  **Tree Summary:**

  *   **Symbolic Interpretation:** Not factual claims.
  *   **Testimonial Privilege:** Testimony suffices, assume true.
  *   **Historical Minimalism (Settings Only):** Real place = only validity.
  *   **Hyper-Criticism:** Requires proof; no kernel possible.
  *   **Historical Maximalism (Names Anchor Narrative):** Real name = core story true.
  *   **Central Event Kernel Acceptance:** Core event was real (modified).
  *   **Peripheral Element Kernel Acceptance:** Only background elements real.

  **Test Case Summary by Position:**

  | Position                     | Trojan War                        | King Arthur                       | Exodus                            |
  | :--------------------------- | :-------------------------------- | :-------------------------------- | :-------------------------------- |
  | **Symbolic Interpretation**  | Symbolic conflict                 | National myth                     | Liberation theology               |
  | **Testimonial Privilege**    | War happened largely as sung      | King existed, fought Saxons       | Mass migration occurred           |
  | **Hist. Minimalism (Settings)** | Hisarlik existed; War unknown     | Post-Roman Britain; no 'Arthur'   | Canaanites in Egypt; no mass Exodus |
  | **Hyper-Criticism**          | Pure epic invention               | Complete fabrication              | Entirely theological construct    |
  | **Hist. Maximalism (Names)** | Alaksandu *is* Paris; War happened | Artorius *is* Arthur; fought Saxons | Semitic official *is* Moses; led Exodus |
  | **Central Event Kernel**     | Major conflict at Hisarlik ~1200BCE | Significant military leader post-400CE | Significant group's departure     |
  | **Peripheral Kernel**        | Trade/raids, no epic war          | Saxon invasions, no unifying king | Canaanite slaves/small groups left |

  Use this tree by starting at Q1 and following your answers. The leaf position reveals your core commitments and its implications for Troy, Arthur, and Exodus. Remember: historiography involves interpretation; this tree maps logical commitments, not absolute truths.
