answer: |-
  ## HERITAGE IMPACT ASSESSMENT (HIA)  
  **Reference:** PC/HLP/2024/07/D  
  **Asset ID:** ROW-HEDGE-ALPHA-7  
  **Location:** Northern verge, Old Mill Lane (unclassified highway), Parish of Upper Nethersole  
  **Asset Description:** Approximately 42m of mature, mixed-species hedgerow incorporating a single, weathered oak stile (designation: STRUCT-REF-ALPHA-7-A) and associated post-and-wire fencing fragment (approx. 3.5m, designation: STRUCT-REF-ALPHA-7-B). Asset forms the eastern boundary of Public Right of Way NET/23/7b.

  **1.0 Introduction & Presumption in Favour of Retention**
  1.1. This assessment is undertaken pursuant to the Parish Council's Standing Orders (Section 8: Heritage & Landscape Preservation) and the *Upper Nethersole Parish Plan (Adopted 2019)*, Policy HLP.1.
  1.2. Policy HLP.1 establishes a presumption in favour of retaining features of the parish landscape which demonstrably possess historical continuity and contribute to local distinctiveness. Long-established arrangements, even where their specific functional origins are undocumented, are understood to carry significant weight by virtue of their persistence. They represent accrued communal adaptation and may embody practical wisdom or social accommodations whose original rationale, while now obscure, contributed to the parish's sustained character and functionality. Disruption of such features requires compelling justification demonstrating that no significant heritage value or latent communal benefit is thereby lost.

  **2.0 Historical Rationale (If Known)**
  2.1. No definitive documentary evidence (tithes, enclosure awards, estate maps, minute references) has been located specifying the original purpose for the construction of the stile (STRUCT-REF-ALPHA-7-A) or the associated fencing fragment (STRUCT-REF-ALPHA-7-B).
  2.2. The hedgerow itself is estimated via standard botanical ageing techniques (Hooper’s Rule) to be approximately 180-220 years old, placing its origin within the late Georgian/early Victorian period. This aligns with widespread local enclosure and boundary consolidation patterns.
  2.3. *Conclusion on Rationale:* The specific functional intent behind the stile and fencing fragment remains unverified. Their integration with the established hedgerow and position on the RoW boundary suggests a historical boundary management or access control function, the precise nature of which is now lost.

  **3.0 Assessment of Heritage Significance & Impact of Proposed Removal**
  3.1. **Asset Significance Matrix:**

      | Criteria                      | Score (1-5, 5=Highest) | Notes                                                                 |
      | :---------------------------- | :--------------------- | :-------------------------------------------------------------------- |
      | **Age & Continuity**          | 5                      | Hedge: 180-220 yrs. Stile/Fragment: Consistent materials/style with known late C19th features. |
      | **Physical Integrity**        | 4                      | Hedge healthy. Stile functional but worn. Fencing fragment incomplete. |
      | **Documented Historical Purpose** | **1**                  | **No specific record located (See 2.3).**                             |
      | **Local Distinctiveness**     | 4                      | Represents typical vernacular boundary feature of the parish.         |
      | **Association with RoW**      | 4                      | Integral visual and physical element defining RoW NET/23/7b boundary. |
      | **Loss of Obscured Function Potential (LOFP)** | **4**                  | **Significant potential for undetermined latent function/adaptive wisdom inherent in persistence (Policy HLP.1).** |
      | **Community Anecdotal Value** | 3                      | Referenced in 1982 Parish Paths survey as "always been there".        |
      | **TOTAL**                     | **25**                 |                                                                       |

  3.2. **Analysis of Matrix:**
      * The asset scores highly on established heritage metrics (Age, Integrity, Distinctiveness, Association).
      * The lack of documented purpose (Score: 1) is acknowledged but mitigated by the high score assigned to Loss of Obscured Function Potential (LOFP: 4). LOFP intrinsically values the *very fact* that a purpose, now unknown, demonstrably existed and sustained the feature within the landscape fabric. The inability to articulate the original rationale increases the potential significance of its loss, per Policy HLP.1's emphasis on latent communal benefit.
      * Total score (25/35) indicates **High Heritage Significance**. Policy HLP.1 dictates that removal of High Significance assets requires demonstration of *overriding* public benefit, significantly exceeding the inherent value of retention.

  **4.0 Proposed Removal Justification & Public Benefit Assessment**
  4.1. *Proposal:* Removal of STRUCT-REF-ALPHA-7-A (stile) and STRUCT-REF-ALPHA-7-B (fencing fragment) to facilitate minor realignment and widening of RoW NET/23/7b entrance point. Hedge to remain, subject to minor trimming.
  4.2. *Stated Benefits:*
      * Slightly improved access for mobility scooters/buggies at this specific point (approx. 15cm width gain).
      * Removal of perceived "pinch point".
      * Standardisation with newer access points elsewhere on the RoW network.
  4.3. *Assessment of Benefits:*
      * The access improvement is marginal and addresses a very localised constraint. Wider RoW accessibility issues exist beyond this point unaffected by the stile.
      * The "pinch point" is subjective and not supported by user surveys.
      * Standardisation offers minimal functional benefit and conflicts with Policy HLP.1's emphasis on local distinctiveness and historical layering.
      * *Conclusion:* Proposed benefits are assessed as **Low to Moderate**. They do not meet the threshold of *overriding* public benefit required to justify removal of a High Significance asset, particularly given the high LOFP valuation.

  **5.0 Consultee Feedback**
  5.1. **Upper Nethersole Historical Society:** Strong objection. Emphasises LOFP and the feature as a "tangible link to forgotten parish management practices". Removal deemed "erasure of subtle historical texture".
  5.2. **Countryside Access Officer (County Council):** Neutral. Notes minor access benefit is achievable but not essential. Removal has no material impact on overall RoW network functionality.
  5.3. **Parish Footpaths Group:** Supports retention. States stile causes minimal inconvenience to most users; its character is valued. Suggests alternative access solutions upstream if essential.
  5.4. **Landowner (adjacent field):** No comment received.

  **6.0 Equality & Access Impact Assessment**
  6.1. Retention of the stile presents a minor access barrier to some users with restricted mobility. However:
      * The barrier is localised to this single structure on a 2km RoW.
      * Removal offers only marginal improvement (15cm).
      * Alternative, more effective accessibility upgrades exist elsewhere on the network.
      * Policy HLP.1 requires balancing accessibility with heritage significance. The high LOFP score and overall heritage significance outweigh the minor, localised access limitation in this instance. No disproportionate impact identified.

  **7.0 Recommendation & Sign-Off**
  7.1. The heritage significance of Asset ROW-HEDGE-ALPHA-7, particularly its Age, Continuity, Local Distinctiveness, and high LOFP score, is considerable.
  7.2. The proposed benefits of removal are insufficient to override the presumption in favour of retention as established by Policy HLP.1.
  7.3. **Recommendation:** REFUSE permission for removal of STRUCT-REF-ALPHA-7-A and STRUCT-REF-ALPHA-7-B. The hedge and integrated features are to be retained and maintained *in situ*.

  *Prepared by:*  
  **A. N. Other**  
  Assistant Planning & Heritage Officer, Upper Nethersole Parish Council  
  Date: 2024-04-18

  *Reviewed by:*  
  **C. D. Steadfast**  
  Planning & Heritage Lead, Upper Nethersole Parish Council  
  Date: 2024-04-19

  *Approved by:*  
  **Heritage & Landscape Preservation Committee**  
  Date: 2024-04-25

  **APPENDIX A: COMMITTEE MINUTE EXTRACT (HLP/2024/04/25)**
  ...Item 7.3 (HIA PC/HLP/2024/07/D) was discussed. The recommendation to refuse removal was proposed by Cllr. Steadfast, seconded by Cllr. Elmsworth. The Committee voted 8-1 in favour of adopting the recommendation.

  ***Minute by Dissenting Member (Cllr. E. Querlen):*** "While concurring fully with the presumption for retention and the profound importance of latent historical wisdom embodied in features whose purpose time has obscured (Policy HLP.1), and acknowledging the thoroughness of the scoring matrix which correctly weights LOFP, I record a minor scruple for the minutes only, not affecting my overall agreement with the outcome. Might the valuation mechanism, by necessity assigning positive weight to *any* enduring unknown rationale, inherently preclude the possibility that the original purpose, were it ever recovered, could itself be found – upon contemporary assessment – to have been ill-conceived, exclusionary, or simply obsolete? The form, admirably designed to protect against the loss of *potential* wisdom, does not appear to possess a corresponding field to assess the *potential* historical detriment or nullity of a rediscovered rationale. This is merely an observation on the document's structure, reflecting the inherent challenge of quantifying absence, and is not intended as a critique of the present decision or the robust Policy HLP.1 framework which served us well today." *(Filed: HLP/Mins/Scruples/2024/04)*
