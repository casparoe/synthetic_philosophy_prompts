prompt: |-
  ok so here's the decision-theory package I've been running with, and I'd like a consistency check before I commit it to a paper. (1) In a one-shot anonymous prisoner's dilemma between two agents that share a decision theory, I think both should cooperate — I'm fully on board with the superrational / functional-decision-theory line. (2) When I hand a game off to a delegate, or write a standing policy into my own behavior, I want the thing it does to be a *safe* Pareto improvement: it should Pareto-improve on the default for every possible specification of the players' payoffs, not just the one I think is most likely, so it doesn't hang on my guess about what the other side actually wants. (3) That said, when I'm fairly confident I've got the other player's payoffs right, I think I should be willing to take a risky Pareto improvement that only counts as an improvement under my best guess. (4) I also think commitments ought to be transparent — an agent shouldn't do something that only helps because the other party happens to model it in some particular way. (5) And two symmetric agents sharing a decision theory should converge on the same action; no arbitrary asymmetry between them.

  Go through these and tell me which pairs are genuinely in tension and how bad, which ones only look like they clash, and for each real tension what the cheapest revision would be and what it would cost me. Rank by severity rather than listing them all as equally bad. And tell me if there's a single change that cleans up the most at once.
reasoning: |-
  Okay, the user is presenting their decision theory package for a paper and wants a consistency check. They've listed five principles: (1) cooperation in one-shot PD via superrationality, (2) safe Pareto improvements for delegates/policies, (3) risky Pareto improvements when confident about payoffs, (4) commitment transparency, and (5) symmetric convergence.

  Hmm, let me start by understanding each principle deeply. Principle 1 is about mutual cooperation in Prisoner's Dilemma through shared decision theory, like FDT or superrationality. Principle 2 emphasizes safety: any delegate policy must improve outcomes regardless of the other player's actual payoffs. That's strict. Principle 3 allows taking risks when confident about the other's payoffs, which seems to contrast with the strict safety of principle 2.

  Principle 4 requires transparency; actions shouldn't rely on the opponent's specific modeling. Principle 5 is symmetry: identical agents should choose the same action. 

  Looking for tensions. The biggest clash is between principles 2 and 3. Safe Pareto improvements demand robustness against all payoff possibilities, while risky ones rely on specific payoff knowledge. For example, in a modified PD, a risky move might work only if the opponent has certain payoffs, violating safety. The cost of resolving this is either weakening the safety principle or avoiding risky moves altogether.

  Next, principles 1 and 4 might conflict. Superrational cooperation often involves counterfactual reasoning, which isn't always transparent. If an opponent doesn't model the situation the same way, cooperation fails. The user might need to accept some non-transparency or weaken the strictness of principle 4.

  Principle 5 (symmetry) generally supports the others but could be challenged by asymmetric environments. However, the user can clarify that symmetry applies only when the game is symmetric.

  Other potential tensions: Principle 4 vs 3. Transparency might prevent risky moves if they depend on the opponent's modeling. But since principle 3 is conditional on confidence, it might be manageable. Principle 1 vs 2: FDT-style cooperation requires knowing the opponent's decision theory, conflicting with robustness to all payoffs. But if payoffs include decision theories, that might resolve it.

  The user's deeper needs include a coherent, defensible framework for their paper. They want to avoid contradictions and ensure their principles are robust. They might also prioritize real-world applicability, hence the emphasis on safety and transparency. The biggest risk is the safety vs. risk trade-off, which is fundamental. Addressing it by redefining payoffs or using robust optimization could help. Emphasizing that confidence in principle 3 includes understanding the opponent's modeling might reduce transparency concerns. Clarifying symmetry as conditional maintains consistency. Overall, prioritizing these revisions by severity ensures the framework is logically sound and practically viable.
answer: |-
  Here's a breakdown of tensions within your decision theory package, ranked by severity, along with resolutions and costs:

  **Severity Ranking:**

  1.  **Major Tension: Principle 2 (Safe Pareto Improvement) vs. Principle 3 (Risky Pareto Improvement)**
      *   **Nature:** Fundamental conflict between robustness and opportunity.
      *   **Conflict:** Principle 2 demands that any delegated policy *must* guarantee improvement *regardless* of the other player's actual payoffs ("safe"). Principle 3 wants to exploit specific payoff knowledge for potentially larger gains ("risky"). These goals are mutually exclusive for the *same action/policy* in many non-trivial games.
      *   **Example:** Consider a variant of PD where Player 2 *might* have a tiny preference for mutual cooperation over mutual defection (standard PD) OR might have a *strong* preference for defecting while Player 1 cooperates (a "sucker" payoff significantly larger than mutual defection). Principle 2 forbids delegating "Cooperate" because if Player 2 has the "sucker-preferring" payoff, Player 1 gets exploited. Principle 3 says if you're 99.9% sure Player 2 has standard PD payoffs, you *should* delegate "Cooperate" for the mutual cooperation payoff.
      *   **Cheapest Revision & Cost:**
          *   **Revision A (Weaken 2):** Restrict Principle 2 to specific contexts (e.g., "when uncertainty about payoffs is high" or "for foundational commitments"). Explicitly state Principle 3 governs when uncertainty is low.
          *   **Cost A:** Loss of universal "safety" guarantee. Requires defining thresholds for "high/low" uncertainty. Less elegant.
          *   **Revision B (Weaken 3):** Frame Principle 3 actions not as *delegated policies* governed by Principle 2, but as *direct actions* taken under high confidence. Principle 2 only governs binding pre-commitments/delegates.
          *   **Cost B:** Distinguishes between "direct action under certainty" and "delegated policy," which might feel artificial. Doesn't help if you *need* a binding commitment for the risky move.
          *   **Revision C (Reframe Payoffs):** Argue that "payoffs" include the agent's model of the world, including their decision theory. If Principle 3 confidence includes confidence that the other player *also* shares your DT (enabling mutual prediction), then a "risky" move (like Cooperate in PD) becomes "safe" *against the set of opponents sharing your DT*.
          *   **Cost C:** Requires stretching the concept of "payoffs" significantly. Might make Principle 2 vacuously true only among DT-similar agents. Doesn't handle uncertainty *within* the set of shared-DT agents.

  2.  **Significant Tension: Principle 1 (FDT/Superrational Cooperation) vs. Principle 4 (Transparency)**
      *   **Nature:** Conflict between counterfactual reasoning and interpretability.
      *   **Conflict:** FDT/Superrationality relies critically on the *counterfactual*: "If I choose X, what does a similar agent (using the same reasoning) choose?" Principle 4 demands actions shouldn't "only help because the other party happens to model it in some particular way." But FDT cooperation *only helps if the other party models the counterfactual dependency correctly* (i.e., shares the DT). If the other party uses CDT, FDT's cooperation doesn't help and makes you a sucker. The benefit *depends entirely* on the other party modeling the situation (the counterfactual link) correctly.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Clarify Principle 4 as: "An agent shouldn't do something that only helps because the other party happens to model it in some *unpredictable, idiosyncratic, or fundamentally opaque* way." Allow reliance on the *shared framework* (the decision theory) itself as a transparent foundation.
          *   **Cost:** Weakens the strong "shouldn't depend on modeling" stance. Requires accepting that core cooperation *is* predicated on shared reasoning methods, which might feel non-transparent from an external, non-DT-sharing perspective. Principle 4 becomes more about avoiding *hidden* or *unreliable* dependencies, not dependencies on the shared DT framework itself.

  3.  **Moderate Tension: Principle 5 (Symmetric Convergence) vs. Asymmetric Environments**
      *   **Nature:** Potential conflict with external reality.
      *   **Conflict:** Principle 5 demands symmetric agents converge on the same action. However, what if the *real-world environment* (not the game matrix) is asymmetric? (E.g., one agent has a timezone advantage, slightly different information, or a different physical capability). Strict adherence to Principle 5 might force symmetric actions even when environmental asymmetry makes different actions rationally optimal for each.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Qualify Principle 5: "...should converge on the same action *in symmetric games and symmetric information/environmental conditions*." Explicitly state that symmetry refers to the strategic situation as modeled, including information and capabilities.
          *   **Cost:** Adds complexity. Requires careful modeling to define the "symmetric situation."

  4.  **Minor Tension / Potential Alignment: Principle 4 (Transparency) vs. Principle 3 (Risky PI)**
      *   **Nature:** Potential conflict, but resolvable.
      *   **Conflict:** A "risky" Pareto improvement might rely on the other party modeling your action or commitment in a very specific way for it to trigger the desired response. Principle 4 might forbid this if the modeling dependency feels non-transparent.
      *   **Resolution:** Principle 3 requires "fairly confident I've got the other player's payoffs *right*." This confidence *should* reasonably include confidence about *how they will model your action/commitment*. If you are confident about both their payoffs *and* their modeling approach (likely tied to sharing DT), the dependency isn't "happening to model it some way," it's a predictable consequence of their rationality. Principle 4's concern is mitigated by the "confidence" requirement of Principle 3. No revision needed if Principle 3's confidence encompasses modeling predictability.

  5.  **Minor Tension / Potential Alignment: Principle 1 (FDT Cooperation) vs. Principle 2 (Safe PI)**
      *   **Nature:** Potential conflict, likely resolvable within FDT framework.
      *   **Conflict:** Principle 2 demands robustness to *any* payoff specification. But FDT cooperation in PD *requires* knowing the other player *also* uses FDT (or similar) to justify the counterfactual. If payoffs are completely unknown, how can you know they have a DT that supports cooperation?
      *   **Resolution:** FDT cooperation *is* "safe" *against the set of opponents who also use FDT and have PD payoffs*. Principle 2, when applied to delegates, could be interpreted as requiring safety *given the knowledge that the opponent shares your DT*. The "payoff uncertainty" in Principle 2 then refers to uncertainty *within the class of agents sharing your DT*. No fundamental conflict if Principle 2's scope is agents potentially sharing your DT. Revision: Ensure Principle 2 is understood as conditional on the opponent being within the domain of agents your DT can robustly reason about (likely including shared-DT agents).

  **The Single Best Change:**

  **Reframe "payoffs" to include decision theory/modeling assumptions (Cost C under Tension 1), combined with clarifying Principle 4 to allow reliance on shared frameworks (Revision under Tension 2), and qualifying Principle 5 for symmetric environments.**

  *   **Why it helps the most:**
      1.  **Resolves Tension 1:** Risky improvements using shared-DT logic become "safe" *within the shared-DT reference class*. Principle 2's safety applies robustly to payoff uncertainty *among agents who think like you*.
      2.  **Resolves Tension 2:** Reliance on shared DT for counterfactuals (Principle 1) is no longer "non-transparent" in a problematic way; it's the foundational shared framework explicitly included in the model/payoffs. Principle 4 forbids reliance on *unpredictable* modeling differences.
      3.  **Aligns with Principle 3:** "Confidence about payoffs" now inherently includes confidence about shared reasoning/modeling.
      4.  **Supports Principle 5:** Symmetric agents, sharing DT and modeling, naturally converge on the same action in symmetric games.

  *   **Cost:** It requires a significant philosophical commitment. You are defining the "players" not just by their utility functions over outcomes, but by their *entire cognitive framework for decision-making*. This makes the theory less "generic" and more specific to agents using compatible reasoning methods. It might be seen as moving closer to a "coordination on focal points" within a specific epistemic community rather than a universally applicable decision theory. However, this is arguably the core tenet of FDT/superrationality already.

  **Conclusion:**

  Your package is coherent at its core (FDT cooperation among similar agents) but has practical tensions around robustness vs. opportunism (2 vs 3) and the nature of transparency when relying on shared reasoning (1 vs 4). The most severe tension is between safety and exploiting specific knowledge. The most effective resolution involves **explicitly incorporating the shared decision theory/modeling framework into the definition of the agents and the scope of "payoff uncertainty" and "transparency"**. This provides a consistent foundation for Principles 1, 3, 4, and 5, while redefining the robustness goal of Principle 2 to operate within the shared-DT context. Be prepared to defend this more expansive view of what constitutes an "agent" or "player" in your decision-theoretic model.
