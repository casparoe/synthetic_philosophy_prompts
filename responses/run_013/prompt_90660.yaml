  - **A1. Very likely or the risk is high enough to reduce expected future beings** → **Position: _Dampening via Shortened Future_**. The expected number of future beings is reduced, so fanaticism is tempered.
  - **A2. Only in specific versions of the simulation hypothesis (e.g., if we are in a short-term simulation)** → **Position: _Conditional Dampening_**. Only specific versions of the hypothesis reduce expected value.
  - **A3. Unlikely or the risk is low; the simulation might run long** → This path does not lead to dampening via this mechanism. (You might reconsider other branches.)

  **If you chose B:**
  **Question B: Do simulated minds have less moral weight than non-simulated minds?**
