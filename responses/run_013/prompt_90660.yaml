  **Contested Distinctions:**
  - The tree assumes that we can separate these mechanisms, but in reality they might interact. For example, if we are simulated, the moral weight might depend on the simulators' values (branch B and D).
  - The deflationary view (E) is a critique of the entire expected value approach, so it rejects the framing of the other branches.
