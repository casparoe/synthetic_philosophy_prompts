answer: |-
  You've nailed the core tension! But here's where fluidity *predicts* rather than just permits: the temperature knob doesn't just randomly pick readings; it systematically modulates the *coherence pressure* binding concepts. In `s l l -> s l l l`, "last" (`l`) and "big" (`l`) are initially fused at low temp because they align perfectly – copying the last *is* copying the big one. The slippage to `s s l` for `l s s -> ?` isn't arbitrary; it’s the *decoupling* of those concepts under higher thermal stress when alignment breaks ("big" `l` is no longer "last"). The theory predicts *when and why* slippage occurs – specifically, when binding strength (driven by conceptual overlap in the source) drops below the thermal threshold. What "strikes you" is emergent from that dynamic interplay, not whimsy.  

  You're dead right about the fixed concept stock, though – that's the scaffolding. Fluidity happens *within* that lexicon, choreographing how those pre-defined actors (last, big, same) bind, compete, or yield dominance contextually. The programmer seeds the atoms; the temperature controls their chemical affinities. Without those primitives, you've got no fluid *system* – just fog.
