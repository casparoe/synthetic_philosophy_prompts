prompt: |-
  I sat in on a lecture in a comparative-religion survey course recently, and the lecturer's account of al-Ghazālī on causation has been nagging at me. I want to know how much of it I can use. This is what I transcribed, as accurately as I could:

  'Al-Ghazālī's Incoherence of the Philosophers is the book where Islamic thought turned against Greek science. His target was Avicenna, who had taught that the world runs on necessary causal connections: fire burns cotton because burning follows from what fire is. The seventeenth discussion is Ghazālī's decisive reply. He argues there that we never observe any necessity in nature, only one event following another; what we call a cause has no power to produce its effect, and the only real agent is God, who creates the burning directly at the moment the cotton touches the fire. The regularities we call laws of nature are therefore just God's habits, which he is free to vary, and that is how miracles are possible. It follows that the sciences can never tell us why anything happens; they can only describe the patterns along which God usually acts. In this respect Ghazālī is essentially Hume with a God left in: both see that causal necessity is a fiction we project onto a sequence of events, and both conclude that our expectation that the future will resemble the past has no rational foundation. Ghazālī goes further only in supplying the missing cause. The one thing he is careful to insist on is that he is not denying causality as such — he is not saying fire doesn't burn cotton, only that fire doesn't burn it by any power of its own.'

  I am not a specialist and I don't know which sentences to trust. Please audit the account claim by claim: for each, say whether it is accurate, a harmless simplification, misleading, or a real misrepresentation, and explain what is at stake in the difference. Where a defender of Ghazālī's position would object, say what the objection would be, and distinguish the objections that a careful historian of Islamic philosophy would press from the ones a partisan would make. Two things I would especially like you to settle. First, I have a vague sense that the Incoherence is a more dialectical book than this account implies — that Ghazālī is attacking the philosophers' proofs rather than establishing occasionalism as his own demonstrated thesis — but I can't tell whether that is a substantive qualification or a scholarly quibble, so tell me how much it matters and what it does to the rest of the account. Second, the lecturer's closing inference (that science can only describe, never explain) and his comparison with Hume seem to me to sit oddly with his own last sentence; say whether that inference survives once the earlier claims are corrected, and if only part of it does, which part.

  No citations or reading list, please — I will track down the texts myself — and reason from what you know rather than gesturing at literature neither of us can check here.

  After the audit, give me a JSON object with exactly these fields: `claims` — an array of objects, one per claim in the account, each with `claim` (the claim restated in your own words, not quoted), `verdict` (one of `accurate`, `oversimplification`, `misleading`, `misrepresentation`, `outright error`), `why` (two or three sentences), and `defender_would_say` (how someone who holds Ghazālī's position would push back, or 'n/a' if the claim is uncontroversial); `most_consequential_error` (a string naming the single error that does the most damage to the account, with one sentence of justification); `closing_inference_survives` (a boolean, judged on the corrected account rather than the lecturer's); `closing_inference_comment` (two or three sentences); and `corrected_summary` (a fair one-paragraph restatement of Ghazālī's position on causation and its relation to Hume's, suitable for someone who has read neither).
