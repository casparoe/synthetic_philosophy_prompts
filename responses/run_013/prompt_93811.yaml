answer: |-
  Here is a comprehensive desiderata list for assessing accounts of propositional unity, structured as requested. Each requirement is labeled by type (Phenomenon, Case, Result), with its motivation and non-negotiable status indicated. The list is constructed to be theory-neutral and applicable by a competent reader without specialized textual knowledge.

  ### **Desiderata List**  
  1. **R1 (Phenomenon): Non-Aggregativity**  
     - *Requirement*: Must explain why a proposition is a *single* truth-evaluable item, not a mere list/collection of constituents.  
     - *Motivation*: The difference between "a-R-b" and the set {a, R, b} (e.g., the proposition "Venus orbits the Sun" vs. the aggregate {Venus, orbits, the Sun}).  
     - *Non-negotiable*: Yes (core to the problem).  

  2. **R2 (Phenomenon): Truth-Conditionality**  
     - *Requirement*: Must explain how unity generates determinate truth conditions (e.g., why "a-R-b" is true iff a bears R to b, not vice versa).  
     - *Motivation*: Propositions are inherently assessable as true/false; aggregates are not.  
     - *Non-negotiable*: Yes (defines propositions).  

  3. **R3 (Phenomenon): No Vicious Regress**  
     - *Requirement*: Must avoid Bradley’s regress (no infinite hierarchy of "tie-tie-tie...").  
     - *Motivation*: Introducing a "tying" relation (e.g., predication) to unite constituents requires further ties ad infinitum.  
     - *Non-negotiable*: Yes (failure collapses the account).  

  4. **R4 (Phenomenon): Combinatorial Constraints**  
     - *Requirement*: Must explain why only certain combinations of constituents form propositions (e.g., "2 is prime" is intelligible, "Prime 2 is" is not).  
     - *Motivation*: Not all aggregates are propositions; unity requires valid syntax.  
     - *Non-negotiable*: Yes (prevents triviality).  

  5. **R5 (Case): Converse Distinction**  
     - *Requirement*: Must distinguish "a-R-b" from "b-R-a" when both use identical constituents (e.g., "Cain killed Abel" vs. "Abel killed Cain").  
     - *Motivation*: Converse pairs can differ in truth value despite shared constituents.  
     - *Non-negotiable*: Yes (paradigmatic test case).  

  6. **R6 (Case): Category Mistakes**  
     - *Requirement*: Must classify expressions like "Justice is triangular" as either false propositions or non-propositions (with explanation).  
     - *Motivation*: Tests whether unity requires semantic coherence or merely syntactic form.  
     - *Non-negotiable*: No (camps differ: some take as false, others as gibberish).  

  7. **R7 (Case): Unsaturated-Only Propositions**  
     - *Requirement*: Must accommodate propositions with no saturated constituents (e.g., "∀x∃y R(x,y)").  
     - *Motivation*: Quantificational logic allows propositions without "complete" objects.  
     - *Non-negotiable*: No (nominalists/referentialists may reject unsaturated entities).  

  8. **R8 (Case): Embedded Propositions**  
     - *Requirement*: Must handle propositions embedded as constituents (e.g., "Socrates believes that Plato walks").  
     - *Motivation*: Propositions can be unasserted/unjudged parts of larger unities.  
     - *Non-negotiable*: Yes (psychologism fails this; unity cannot depend on acts of judgment).  

  9. **R9 (Case): False/Impossible Propositions**  
     - *Requirement*: Must treat false (e.g., "Mars is habitable") and impossible (e.g., "2 + 2 = 5") propositions as unified.  
     - *Motivation*: Unity is independent of truth (falsehoods are still propositions).  
     - *Non-negotiable*: Yes.  

  10. **R10 (Case): Truth-Value Sensitivity**  
      - *Requirement*: Must ensure that truth value depends on constituent configuration (e.g., "a-R-b" true, "b-R-a" false).  
      - *Motivation*: Identity of constituents alone doesn’t fix truth (see R5).  
      - *Non-negotiable*: Yes.  

  11. **R11 (Result): Compositionality**  
      - *Requirement*: A finite set of constituents must generate infinitely many propositions.  
      - *Motivation*: Language exhibits productivity (e.g., "p," "not p," "q and p," etc.).  
      - *Non-negotiable*: Yes.  

  12. **R12 (Result): Constituent Preservation**  
      - *Requirement*: Constituents must retain their identity across propositions (e.g., "runs" in "Socrates runs" vs. "Plato runs" is the same).  
      - *Motivation*: Rejects views where constituents dissolve into structure (e.g., extreme holism).  
      - *Non-negotiable*: No (preferred by referentialists; inferentialists may reject).  

  13. **R13 (Result): No Extraneous Ontology**  
      - *Requirement*: Avoid positing entities beyond constituents and their configuration.  
      - *Motivation*: Parsimony; regress concerns (see R3).  
      - *Non-negotiable*: No (Platonists accept abstracta; nominalists demand this).  

  ---

  ### **Meta-Analysis of the List**  
  - **Non-negotiables**: R1–R5, R8–R11 (core unity, truth, embedding, productivity).  
  - **Negotiables**:  
    - R6: Psychologism takes category mistakes as non-propositions; Fregeanism as false.  
    - R7: Nominalism rejects unsaturated entities; Fregeanism requires them.  
    - R12/R13: Platonism accepts abstract constituents; deflationism minimizes ontology.  

  - **Suspected Unsatisfiable Subsets**:  
    - {R3 (no regress), R5 (converse distinction), R10 (truth-value sensitivity)}:  
      If unity requires no "tie" (R3), but order affects truth (R5, R10), then order must be intrinsic to relations (e.g., slots *must* have directionality). **R3 must be relaxed** to allow configurational primitives (not a "tie" entity).  
    - {R6 (category mistakes as non-propositions), R9 (false propositions unified)}:  
      If category mistakes are non-propositions (per some views), but false propositions are unified, the account needs a syntax/semantics boundary. **R6 must yield**: category mistakes are false.  

  - **Most Excluding Requirement**: **R5 (Converse Distinction)**. Excludes:  
    - Set-based theories (e.g., {a, b, R} for both "a-R-b" and "b-R-a").  
    - Possible-worlds accounts (identical truth conditions collapse converses).  
    - Holistic views (constituents lack stable identity).  

  - **Can Propositions Be Dispensed With?**  
    Yes, **if** an account satisfies all desiderata without reifying propositions (e.g., via deflationary syntax or conceptual acts). However, R8 (embedding) and R9 (false propositions) force *proposition-like* unities (truth-apt items with structure).  

  ---

  ### **Assessment of Candidate Account**  
  **Candidate**: Slots + saturation (exhaustion = unity).  
  - **R1–R4**: Satisfied. Slot-exhaustion explains unity without aggregation.  
  - **R3**: Satisfied (no tying item; slots are internal).  
  - **R5**: **Variant A (slots intrinsic)**: Satisfied if slots are ordered (e.g., R has "agent-patient" slots).  
    **Variant B (mode-assigned slots)**: Fails (the mode is a "tie," causing regress).  
    **Variant C (conventional order)**: Fails R10 (truth-value not fixed by convention alone).  
  - **R7**: Fails. Quantifiers/variables lack slots to saturate (no unsaturated-only saturation chain).  
  - **R8**: Satisfied. Embedded proposition is pre-unified via its own slots.  
  - **R10**: Satisfied only by Variant A (intrinsic order fixes truth conditions).  
  - **R11–R12**: Satisfied.  
  - **R13**: Satisfied (no extra entities).  

  **Silence in List**:  
  - The list **does not require slots to be ordered** (R5/R10 demand order-sensitivity but not its source). Variant C (conventional order) is incorrectly rejected by R10; the list should specify that truth-value dependence must be *intrinsic to the unity mechanism*. **Defect added**: R10 must include "configuration fixes truth conditions non-arbitrarily."  

  ---

  ### **Case Tests**  
  (i) **Self-referential unity**: "This proposition is unified."  
     - Account: Embedded proposition must be pre-unified (R8 satisfied).  
     - List handles this via R8.  
  (ii) **No saturated constituent**: "∀x∃y R(x,y)"  
     - Account: Fails (no slots for quantifiers/variables).  
     - List demands accommodation (R7), exposing weakness.  
  (iii) **Same-slot converses**: If slots lack order, "a-R-b" and "b-R-a" are identical.  
     - Account: Only Variant A passes (intrinsic order).  
     - List forces distinction via R5/R10.  
  (iv) **Unjudged embedding**: "No one believes that p" (p = unified but unjudged).  
     - Account: Passes (p’s slots are saturated independently).  
     - List handles via R8/R9.  
  (v) **Category mistake**: "Justice is triangular."  
     - Account: Non-proposition if slots mismatch (e.g., "Justice" lacks property-slot).  
     - List allows either outcome (R6 negotiable).  
  (vi) **"No propositions"**: "There are no unified propositions."  
     - Account: Must be expressible as a proposition (satisfies R1–R4).  
     - List requires consistency (R1–R2 force it to be a proposition).  

  ---

  ### **Standard Families vs. List (One Paragraph)**  
  **Frege**: Fails R7 (quantificational propositions require unsaturated "concepts," but nested quantifiers lack saturation), R8 (embedding causes type-mismatch; "that p" must saturate but is incomplete). **Russell (multiple-relation)**: Fails R8 (unity depends on a judging act; unembedded propositions lack unity), R9 (false judgments require non-unified complexes). **Possible Worlds**: Fails R5 (converses identical if same truth value), R10 (distinct propositions with same truth value collapse). **Inferential Role**: Fails R12 (constituents not preserved; "p" in different inferences may differ), R5 (converses can have symmetric roles). All struggle with R3: Frege/Russell risk regress via "gaps"/relations; possible worlds/inferentialism avoid regress but fail case constraints.
