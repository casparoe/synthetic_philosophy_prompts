prompt: |-
  Right, so a friend of mine in a seminar has an argument that hedonism isn't just false but can't even be stated, and I've been chewing on it for a week. Here it is, cleaned up:

  (1) Hedonism says the only thing that ultimately matters is pleasure, so it has to be able to compare any two lives or outcomes by how much pleasure is in them — or at least to put them on one scale.
  (2) For two things to be ranked on a single scale they have to share a common measure, i.e. there must be some one property in virtue of which each of them adds to the total.
  (3) So all pleasures must share some one property, the property in virtue of which each one is a pleasure.
  (4) Candidates: the pleasure of cold water when you're parched; the click when the last line of a proof closes; the little fizz of hearing that a guy you dislike got passed over for the job; a hot bath; a song in a minor key that makes you cry; scratching a mosquito bite till it bleeds; the relief when a headache lifts.
  (5) There's no common feel. Some live in the body, some don't. Some have an object you're pleased about, some don't. Some you'd be embarrassed about, some you wouldn't. Some you chase, some just land on you. Strip out everything they don't share and there's nothing left — no single inner glow, no single tone. (If you say "well they're all liked," that's either circular or it just means "desired," and then hedonism has quietly turned into desire-satisfaction, which is a diffrent theory.)
  (6) So there's no one property that all and only pleasures share.
  (7) So (3) is false, and by (2) outcomes can't be ranked by pleasure, so hedonism can't even state its thesis, let alone be true.
  (8) And none of this is special to pleasure — no two desires share a common feel either, nor beliefs, nor colours (there's no one physical property all red things share). So either the argument is bad, or almost nothing is a kind.

  I think (5) is just true — pleasures really are a mess, and I don't want to give that up. I also don't want to give up hedonism, or at least I want to know whether it survives (5). So which step do I cut, and what's the bill? If the answer is "pleasure is a functional kind" or "a determinable," I want to know what that actually buys and whether what's left still deserves the name hedonism or whether it's just relabelling whatever we happen to value as "pleasure." And if (8) is right, then either hedonism dies or a lot of other things die with it, and I'd like to know which. I keep wanting to say he's cheating on (2) but I can't beleive that comparing things on one scale really needs them to share a hidden common ingredient.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with a friend's argument against hedonism that claims pleasure can't be measured on a single scale because there's no common property shared by all pleasures. The user finds step (5) convincing—pleasures are diverse—but doesn't want to abandon hedonism. They need to know which step to challenge and what the implications are.

  First, I need to recall the structure of the friend's argument. The key steps are that hedonism requires a single scale (1), which needs a common measure (2), leading to the necessity of a shared property for all pleasures (3). Step (5) argues there's no such property, so hedonism fails. The user is stuck here because they agree with (5) but want to save hedonism.

  Hmm, the user mentioned functional kinds or determinables as possible rebuttals but is worried that might just redefine pleasure. They also brought up step (8), which extends the argument to other concepts like desires or colors. If the argument holds, either hedonism falls or many other concepts do too. That's a big deal.

  I should start by identifying the weakest link. Step (2) seems vulnerable. Does ranking on a single scale really require a shared intrinsic property? In math, we can add heterogeneous things if we assign values based on a common metric, like utility. For example, in economics, different goods are valued differently but still compared through money. So maybe pleasure doesn't need a shared essence but a common valuation method.

  But the user's friend might counter that without a common property, any valuation is arbitrary. That's where functionalism comes in. If pleasure is defined by its role—being liked, desired, or motivating—then diverse experiences can still be compared based on how much they fulfill that role. The circularity concern in (5) is tricky. If "liked" just means desired, then hedonism becomes desire-satisfaction. But maybe that's acceptable if desires are grounded in pleasure? Needs more thought.

  The user also worries about relabeling. If "pleasure" is just whatever we value, then hedonism loses its meaning. But functionalism could avoid that if the role is specific: say, positive experiences we intrinsically want to continue. That might preserve hedonism without reducing it to desire theory.

  Step (8) is another angle. If desires and colors also lack shared properties, rejecting hedonism means rejecting those categories. But we do use such categories successfully. So the argument might be too broad, suggesting it's flawed. The user might leverage this to defend hedonism by analogy.

  The user's deeper need seems to be preserving hedonism without denying the diversity of pleasures. They want a philosophically robust defense. They might also be interested in the implications for other theories if hedonism falls, hence the mention of step (8).

  I should explore responses targeting step (2) with functionalism, but address the circularity concern. Also, consider if step (4) and (5) are overstated—maybe there's a common property like dopamine release? But that might not cover all cases, like intellectual pleasures. Neurobiology isn't there yet. Better to stick to philosophical arguments.

  Another idea: scalar comparability without a common property. We compare things like aesthetic values without a single essence. Maybe pleasure is similar. But hedonism needs a quantitative scale, which is trickier.

  The user's identity seems to be someone engaged in philosophy, possibly a student or academic, given the seminar context. They've thought deeply about this for a week, so they need a nuanced response that doesn't oversimplify.

  In conclusion, the best path is to challenge step (2) by arguing that a common measure doesn't require shared intrinsic properties but a unified functional role. Address the circularity by distinguishing between pleasure as a natural kind versus a functional kind. Also, use step (8) to show the argument's overreach, defending hedonism by analogy to other functional categories.
answer: |-
  You've hit on a deep and genuine problem in value theory. Your friend's argument is sophisticated (Nozick, Parfit, and others dance around similar issues), but I think the fatal flaw is in step **(2)**, and cutting there preserves both the diversity of pleasures *and* a defensible form of hedonism. Here's the breakdown:

  1.  **Where He's Right: (1), (3), (5), (6)**
      *   Hedonism *does* require comparability on a single scale of value (pleasure-minus-pain). (1) is correct.
      *   Pleasures *are* incredibly diverse phenemonologically, functionally, and in their objects. There is likely **no single, unique, intrinsic qualitative feel** (an "inner glow," a specific "tone") shared by the cold water, the proof-clicking, the schadenfreude, and the mosquito-scratching relief. (5) is compelling and probably true. Attempts to abstract a "pure feel" likely fail, leaving nothing substantial. (6) follows if we demand this intrinsic feel.

  2.  **The Crux: Why (2) is the Weak Link**
      *   **(2) claims:** "For two things to be ranked on a single scale they have to share a common measure, i.e. there must be some one property *in virtue of which* each of them adds to the total."
      *   **The Mistake:** This confuses *what is being measured* (the diverse phenomenal experiences) with *the basis for assigning a value* on the scale. Hedonism doesn't require that all pleasures *feel the same* intrinsically. It requires that they all *possess the same type of value* – **positive valence** – and that we can meaningfully *assign* them a magnitude (intensity/duration) *of that value type*.
      *   **Analogy:** Consider "fitness" in evolutionary biology. A thick fur coat, a keen eye, fast running speed, and complex social cooperation are incredibly diverse traits. There is no single "fitness essence" they all share intrinsically. Yet, biologists rank them on the single scale of "fitness" *by virtue of* their **common functional role**: increasing the probability of survival and reproduction in a given environment. The "common measure" isn't an intrinsic property of the traits themselves, but the *consequence* they have within a functional system.
      *   **Applied to Pleasure:** The "common measure" for pleasures isn't an intrinsic feel, but their **functional role as positive motivational states**. What makes something a pleasure, and what gives it its positive value on the hedonist scale, is that **it is an experience the subject finds intrinsically rewarding, attractive, or desirable *at the time of experience*, and which they are (ceteris paribus) motivated to sustain or repeat.** This "positive valence" is the functional property.

  3.  **Addressing the Circularity/Objection in (5)**
      *   Your friend says: "*If you say 'well they're all liked,' that's either circular or it just means 'desired,' and then hedonism has quietly turned into desire-satisfaction.*"
      *   **Response:** This is the key challenge. Here's how hedonism can respond:
          *   **Distinguish "Liking" from "Desiring" (Especially Future-Directed Desire):** Neuroscience and psychology often distinguish "liking" (core hedonic reaction, immediate positive affect) from "wanting" (incentive salience, motivation). While intertwined, they can dissociate (e.g., addiction involves strong "wanting" without much "liking"). Hedonism focuses on the "liking" component *as it is experienced*.
          *   **Intrinsic Motivation in the Moment:** The "liking" relevant to hedonism isn't a belief *about* the experience being good, nor a *future-directed desire* for it. It's the *intrinsic positive affect* accompanying the experience *right now* that makes the subject *want it to continue* in that moment. Scratching the itch *feels good now*, making you want to keep scratching *now*. The click of the proof *feels satisfying now*. This immediate "pull" *is* the pleasure.
          *   **It's Not (Standard) Desire-Satisfaction:** Desire-satisfaction theories typically value the *satisfaction of a pre-existing desire*, regardless of the experience it produces. Hedonism values the *positive experience itself*. While the mosquito-scratching pleasure involves a desire (to scratch) *being satisfied*, the *value* for the hedonist lies in the *hedonic feeling of relief/satisfaction* that results, not merely in the fact that a desire-state was extinguished. The "liking" *is* the experiential manifestation of the positive value.
          *   **The Functional Role Defines the Kind:** Calling it "circular" misses the point. We're defining a functional/attitudinal kind: "Pleasure = that class of experiences which, by their intrinsic phenomenal character, motivate their own continuation." This isn't *defining* pleasure in terms of *another theory's value*; it's *identifying* what pleasure *is* – a state with a specific motivational/affective role. The value *comes from* occupying that role successfully.

  4.  **What "Functional Kind" or "Determinable" Buys You (And the Relabeling Worry)**
      *   **Functional Kind:** Treating pleasure as a functional kind (unified by its role, not its intrinsic feel) buys you **comparability despite phenomenal diversity**. We can compare the cold water, the proof-click, and the schadenfreude *not* because they feel the same, but because we can ask: *To what degree did the subject find that experience intrinsically rewarding? How strongly did it motivate its own continuation? How much positive affect (of whatever phenomenal flavor) did it generate?* We can develop methods (behavioral observation, self-report, potentially neural correlates) to *estimate* the magnitude of this positive valence.
      *   **Determinable:** Pleasure can be seen as a determinable property ("has positive valence") of which specific pleasures (the cool water, the proof click) are determinates (different specific ways of instantiating positive valence). The determinable provides the common scale.
      *   **Avoiding Relabeling:** This *isn't* just relabeling "whatever we value" as pleasure. The functional role is specific: **intrinsic, occurrent, motivational positive affect**. We value many things *instrumentally* (going to the dentist) that aren't pleasurable. We sometimes desire things (due to addiction, false belief) that don't produce pleasure when obtained. The functional definition carves out a *specific psychological state* that is the locus of value for the hedonist. It's not that *anything valued* is called pleasure; it's that pleasure *is* a specific type of positively valued experience state.

  5.  **What Survives?**
      *   **Hedonism survives as "Valence Hedonism":** The core thesis becomes: The only thing of ultimate, non-instrumental, positive value is the occurrence of conscious states possessing positive valence (intrinsic, occurrent, motivational positive affect), and the only thing of ultimate negative value is the occurrence of conscious states possessing negative valence (suffering). The *magnitude* of a state's value is determined by the intensity and duration of its positive or negative valence. This accounts for diversity while providing a unified scale.

  6.  **Dealing with (8): The Domino Effect**
      *   **(8) is insightful:** The argument *would* indeed kill many categories if we demanded a single intrinsic property. Desires, beliefs, colors, chairs – these are all unified functionally or as determinables, not by a single physical or phenomenal essence.
      *   **The Implications:** This doesn't mean hedonism dies or that "nothing is a kind." It means we reject a **naive essentialism** about kinds. We accept that many important categories (including pleasure, desire, belief, color, furniture) are **unified by function, role, or family resemblance, not by a hidden shared intrinsic ingredient**. Hedonism survives precisely *because* it embraces this more sophisticated view of kinds, alongside desire theory, belief-desire psychology, color science, etc. The argument doesn't kill hedonism; it kills an unrealistic demand for intrinsic essences that almost no useful category actually meets.

  **Conclusion: Cut (2) and Embrace Functional Valence**

  Your intuition that (2) is the cheat is correct. Ranking on a single scale does *not* require a shared intrinsic phenomenal property. It requires a common *type of value* that can be meaningfully assigned to diverse instances. Hedonism identifies this value with **positive valence**, understood as a functional property (intrinsic, occurrent, motivational positive affect). This:

  *   Preserves the phenomenal diversity of pleasures (you keep (5)).
  *   Provides a coherent basis for comparability and the hedonist thesis.
  *   Avoids collapsing into desire-satisfaction by focusing on the *experience* of positive affect.
  *   Avoids mere relabeling by defining a specific functional role.
  *   Survives the challenge of (8) by aligning with how most useful categories (desires, beliefs, colors) actually work.

  The "bill" is accepting that pleasure is a functional kind/attitudinal determinable rather than a simple qualitative feel. What's left absolutely deserves the name hedonism – it captures the core idea that the goodness of an experience lies in its positive feel, while accommodating the messy reality of what that "feel" actually entails. Your friend's argument highlights an important challenge, but it doesn't make hedonism unstatable; it clarifies what a viable hedonism must look like.
