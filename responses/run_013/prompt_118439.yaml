prompt: |-
  I'm a software engineer who leads a small platform team, and we keep discovering after the fact that a commitment we all treated as a team commitment was really just several people agreeing in the room. Write me a reusable procedure, grounded in the core idea from collective intentionality and joint action that a joint intention is not a sum of individual intentions but requires that each participant intends the group action, that this be common knowledge, and that the participants' subplans mesh. The procedure should be a short ordered checklist I can run in a sprint-planning meeting: the questions to ask, what counts as a sufficient answer to each, where it returns a no, and where it must stop and hand the decision back to the team because the remaining issue is risk tolerance or values rather than whether a shared intention exists. Keep it usable by engineers with no philosophy background, and be explicit about the cases it cannot settle. Then run it on two cases: (1) the team says it will migrate the billing database by the end of the sprint, but the on-call engineer has privately decided not to help with rollback testing; (2) the team says it will stop supporting the legacy API, while two members understand this as freezing new features and one understands it as announcing an end-of-life date. For each case, give the procedure's output, what it leaves to judgment, and the next concrete step. Finally, state the main ways the procedure will misfire or be gamed.
reasoning: |-
  We are creating a checklist based on collective intentionality principles. The core idea is that a joint intention requires:
  1. Each participant intends the group action.
  2. This is common knowledge (everyone knows, everyone knows that everyone knows, etc.).
  3. The participants' subplans mesh (they are compatible and form a coherent whole).

  The procedure is a checklist for the team during sprint planning to verify if a commitment is truly shared.

  Checklist:

  1. **Individual Commitment Check**: 
     - Question: "Does each person who will be involved in this action intend for the group to achieve the stated outcome?"
     - Sufficient Answer: Each involved person explicitly states agreement (e.g., "yes", "I commit"). Silence or absence does not count as agreement.
     - If No: Stop. The commitment is not shared. The action must be renegotiated until everyone involved commits.

  2. **Common Knowledge Check**:
     - Question: "Is it clear to everyone that we all intend to achieve this outcome? And does everyone know that everyone else knows this?"
     - Sufficient Answer: After each person has stated their commitment (from step 1), the facilitator explicitly confirms: "So we all know that each of us is committed, and we all know that we all know?" and gets explicit agreement from each person.
     - If No: Stop. The commitment is not common knowledge. Reiterate until common knowledge is established.

  3. **Subplan Meshing Check**:
     - Question: "Do we have a shared understanding of the plan? Let's each briefly state what we think our own main tasks are and how they fit together. Are there any hidden assumptions or conflicts in our individual subplans?"
     - Sufficient Answer: Each involved person states their understanding of their own tasks and how they connect to others. The group confirms that these subplans are compatible and cover the necessary work. Any discrepancies must be resolved on the spot.
     - If No: Stop. The subplans do not mesh. The team must resolve the conflicts in understanding or planning.

  4. **Risk and Values Acknowledgment**:
     - After the above three checks pass, the team has a shared intention. However, the procedure cannot settle:
       - Whether the action is the right thing to do (value judgments).
       - Whether the risks are acceptable (risk tolerance).
     - Therefore, if the team has passed the first three checks but there are concerns about risk or values, the facilitator must note: "We have a shared intention, but we have concerns about [risk/value issue]. We must now decide as a team if we are willing to proceed despite these concerns."

  Now, run the checklist on the two cases:

  **Case 1: Database Migration**
  - Statement: "The team will migrate the billing database by the end of the sprint."
  - Issue: The on-call engineer has privately decided not to help with rollback testing.

  **Procedure Output**:
  1. **Individual Commitment Check**: 
     - The team is asked: "Does each person involved intend for the group to achieve the migration by the end of the sprint?" 
     - The on-call engineer might say "yes" (if they are lying or hiding their true intention) or they might reveal their reluctance. 
     - However, if they say "yes", then we proceed. But note: if they are hiding, we might get a false positive. 
     - *In a well-facilitated meeting, we might hope that the engineer would speak up. But if they do not, the procedure would pass step 1 (on the surface).*

  2. **Common Knowledge Check**: 
     - "Is it clear to everyone that we all intend to achieve this?" 
     - If the on-call engineer remains silent, then common knowledge is established on the surface. 
     - However, if the engineer has a hidden intention, then in reality, common knowledge does not exist (because the engineer knows that others don't know about their lack of commitment). 
     - *But the procedure cannot force someone to reveal their hidden intention. So step 2 might pass if everyone says they know and they know others know.*

  3. **Subplan Meshing Check**: 
     - Each person states their tasks. 
     - The on-call engineer might say: "I will be on call and handle incidents, but I won't help with rollback testing." 
     - Alternatively, if they don't reveal, then when others say "We are relying on the on-call to help with rollback testing", the engineer might then speak up. 
     - *If the engineer reveals their refusal, then the subplans do not mesh (because the plan requires rollback testing and the engineer is refusing).*
     - **Output**: The check fails at step 3 because the subplans do not mesh (the engineer's subplan does not include rollback testing, but the team's plan requires it). 
     - **What it leaves to judgment**: The procedure identifies a lack of meshing subplans. The next step is to resolve the conflict: either the engineer must agree to help, or the team must find another way to handle rollback testing. 
     - **Next concrete step**: The team must renegotiate the plan to either get the on-call engineer to commit to rollback testing or adjust the plan (e.g., assign someone else). If the engineer refuses and the team cannot adjust, the commitment must be abandoned or redefined.

  However, if the engineer never speaks up during the meeting, then the procedure would pass all steps and the team would think they have a shared intention. But in reality, the intention is not shared because of the hidden refusal. This is a limitation of the procedure: it relies on honest participation.

  **Case 2: Legacy API Support**
  - Statement: "The team will stop supporting the legacy API."
  - Issue: Two members understand this as freezing new features and one as announcing an end-of-life date.

  **Procedure Output**:
  1. **Individual Commitment Check**: 
     - Each person agrees to stop supporting the legacy API. So step 1 passes.

  2. **Common Knowledge Check**: 
     - Everyone agrees that they all intend to stop supporting the legacy API. Step 2 passes.

  3. **Subplan Meshing Check**: 
     - Each person states their understanding of the tasks:
       - Member A: "We will freeze new features immediately and communicate that to users."
       - Member B: Same as A.
       - Member C: "We will announce an end-of-life date and then stop supporting it on that date."
     - The group now realizes there is a discrepancy: freezing vs. setting an end-of-life date.
     - **Output**: Step 3 fails because the subplans do not mesh. The actions are incompatible (freezing now vs. setting a future date).
     - **What it leaves to judgment**: The team must now clarify what "stop supporting" means. This is a matter of defining the action (which is part of forming a shared intention). The procedure stops here because the subplans are incompatible.
     - **Next concrete step**: The team must resolve the ambiguity by agreeing on a specific plan (e.g., "We will freeze new features now and set an end-of-life date for 6 months from now"). Then they must re-run the checklist from step 1 with the clarified plan.

  **Main ways the procedure will misfire or be gamed**:
  1. **Dishonest Participation**: If a team member does not voice their true intentions (like in Case 1), the procedure may pass but the commitment is not real. This is a fundamental limitation of any process that relies on self-reporting.
  2. **Superficial Agreement**: Team members may say "yes" to avoid conflict or because they are disengaged, without really committing. This leads to false positives.
  3. **Incomplete Participation**: If not everyone who is involved is present, the checks cannot be done properly. The procedure requires all involved to be present and participate.
  4. **Ambiguity in Subplans**: The subplan meshing check relies on individuals being able to articulate their tasks. If they are vague or if the task breakdown is not detailed enough, hidden incompatibilities might remain.
  5. **Rushing Through**: The team might rush through the steps without deep reflection, especially if the checklist becomes a bureaucratic hurdle.
  6. **False Consensus**: The common knowledge step might be interpreted as just verbal agreement without real internalization.

  To mitigate:
  - The facilitator must create a safe environment for honest participation.
  - Encourage team members to voice concerns and disagreements.
  - Ensure that the procedure is not treated as a box-ticking exercise but as a genuine conversation.

  The procedure cannot force honesty or resolve deep value conflicts. It can only structure the conversation to make shared intentions more likely and visible.
answer: |-
  ### Reusable Procedure: Shared Intention Verification Checklist  
  **Grounding Principle**: A joint intention requires (1) each participant personally intends the group action, (2) this is common knowledge, and (3) individual subplans are compatible ("mesh"). Use this during sprint planning for ambiguous commitments.  

  #### Checklist  
  1. **Individual Commitment Check**  
     - **Question**: "Does each person required for this action personally intend to achieve the group outcome?"  
     - **Sufficient Answer**: Each involved member explicitly states "I commit" or equivalent.  
     - **If No**: Stop. Commitment is invalid. Renegotiate or discard.  
     - **Cannot Settle**: N/A (binary pass/fail).  

  2. **Common Knowledge Check**  
     - **Question**: "Does everyone know that all others are committed? Does everyone know this is known by all?"  
     - **Sufficient Answer**: All confirm: "Yes, we all know everyone is committed."  
     - **If No**: Stop. Shared intention is incomplete. Reiterate commitments publicly.  
     - **Cannot Settle**: N/A (binary pass/fail).  

  3. **Subplan Meshing Check**  
     - **Question**: "Let’s each share our key tasks and assumptions. Are these subplans compatible?"  
     - **Sufficient Answer**: All describe their tasks; no contradictions emerge.  
     - **If No**: Stop. Subplans conflict. Redesign the plan.  
     - **Cannot Settle**: Risk tolerance or values (e.g., "Is this subplan too risky?"). Hand decision back to the team.  

  4. **Risk/Values Acknowledgment Gate**  
     - **After Step 3 Passes**: "Are there unresolved concerns about risks, ethics, or priorities?"  
     - **Sufficient Answer**: All concerns are surfaced.  
     - **Outcome**: If concerns exist, the team decides democratically (procedure ends; it’s now a values/risk call).  

  ---

  ### Case Analysis  
  #### Case 1: Database Migration  
  - **Scenario**: Team commits to migrating the billing database. On-call engineer privately refuses rollback testing.  
  - **Checklist Output**:  
    1. **Individual Commitment Check**: Passes (engineer falsely states commitment).  
    2. **Common Knowledge Check**: Passes (group assumes public "yes" is truthful).  
    3. **Subplan Meshing Check**:  
       - Engineer states: "I’ll handle incidents but won’t do rollback testing."  
       - Others state: "We rely on engineer for rollbacks." → **Fails** (subplans conflict).  
  - **Left to Judgment**: Whether rollback testing is essential (risk tolerance).  
  - **Next Step**: Team redesigns the plan (e.g., assign rollback testing to someone else). If unresolved, revisit commitment.  

  #### Case 2: Legacy API Support  
  - **Scenario**: Team commits to "stop supporting legacy API." Two members interpret as "freeze features," one as "set end-of-life date."  
  - **Checklist Output**:  
    1. **Individual Commitment Check**: Passes (all agree to "stop supporting").  
    2. **Common Knowledge Check**: Passes (all believe others are committed).  
    3. **Subplan Meshing Check**:  
       - Member 1: "My task: block new feature PRs."  
       - Member 2: "My task: communicate feature freeze."  
       - Member 3: "My task: announce June 30 end-of-life." → **Fails** (actions are incompatible).  
  - **Left to Judgment**: What "stop supporting" should mean (values/priority call).  
  - **Next Step**: Team defines a concrete action (e.g., "freeze features AND set end-of-life date"). Re-run checklist on the clarified plan.  

  ---

  ### How the Procedure Misfires or Is Gamed  
  1. **Superficial Compliance**:  
     - **Misfire**: Participants say "I commit" to avoid conflict but lack true intent.  
     - **Mitigation**: Facilitator probes for reservations (e.g., "Any unspoken concerns?").  

  2. **Common Knowledge Gaps**:  
     - **Misfire**: Assumptions go unspoken (e.g., remote members miss context).  
     - **Mitigation**: Explicitly list all involved parties and confirm understanding.  

  3. **Subplan Ambiguity**:  
     - **Misfire**: Vague task descriptions hide conflicts (e.g., "I’ll help" vs. specific duties).  
     - **Mitigation**: Require concrete task statements (e.g., "I will test rollbacks on Tuesday").  

  4. **Risk Blindness**:  
     - **Misfire**: Team passes checks but ignores high-risk subplans (e.g., "We meshed, but this will fail in prod").  
     - **Mitigation**: Gate at Step 4 forces explicit risk discussion.  

  5. **Gaming the System**:  
     - **Tactic**: Dominant members pressure others into false consensus.  
     - **Mitigation**: Anonymize initial commitments or rotate facilitators.  

  **Limitations**:  
  - Cannot force honesty (e.g., hidden reservations in Case 1).  
  - Cannot resolve values disputes (e.g., "Is this ethically right?").  
  - Relies on psychological safety for truthfulness.  

  **Deployment Tip**: Run this as a 10-minute facilitated drill during planning for high-stakes items. For recurring misfires, add a "devil’s advocate" role.
