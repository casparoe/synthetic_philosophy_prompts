answer: |-
  ## Joint Statement on the Wrong Kind of Reasons Problem: A Framework for Adversarial Collaboration

  **Preamble:** We, undersigned Restrictionists and Pessimists, acknowledge the depth and persistence of the disagreement surrounding the Wrong Kind of Reasons (WKR) problem for Fitting-Attitude (FA) analyses of value. We affirm the sophistication of both positions and reject characterizations of either as strawmen. This document aims to precisely map our common ground, articulate our remaining disagreements neutrally and in our own terms, identify crucial points of contention ("cruxes"), and explore potential verbal disputes. Our goal is not to resolve the debate here but to facilitate more productive engagement by ensuring mutual understanding and precise record-keeping of commitments, particularly concerning novel cases.

  ### 1. Agreed Claims (Both Camps Endorse)
      1.  **The Core Problem:** The WKR problem challenges FA analyses by presenting cases where there are strong, *non-value-based* reasons to have a pro-attitude (e.g., desire, admiration) towards an object, even when the object lacks value (or vice versa). A successful FA analysis must distinguish these "wrong kind" reasons from the "right kind" reasons that genuinely bear on the object's value.
      2.  **The FA Commitment:** For Restrictionists, FA analysis *requires* a principled, non-circular way to restrict the class of reasons relevant to an object's value. Pessimists agree that *if* FA is viable, such a restriction is necessary, but doubt its possibility.
      3.  **Reward Cases (Paradigm WKRs):** Cases where an agent is offered a significant external reward (e.g., money, avoiding torture) *solely* for having a pro-attitude towards an object (independent of the object's properties) generate reasons to have that attitude. Both camps agree these reasons are paradigmatic instances of the "wrong kind"; they do not bear on the object's value.
      4.  **What Reward Cases Show:** Reward cases demonstrate that not *all* reasons to have a pro-attitude are relevant to the object's value. They refute the simplest form of FA analysis that identifies value directly with reasons to have pro-attitudes *simpliciter*.
      5.  **What Reward Cases Do NOT Show:** Reward cases *do not* by themselves refute the possibility of a sophisticated FA analysis employing a successful restriction (Restrictionist view) or prove that fittingness must be primitive (Pessimist view); they merely establish the *need* for such a restriction or motivate the Pessimist worry.
      6.  **Neutrality on Primitives:** Neither camp is *necessarily* committed to fittingness being primitive. Restrictionists aim to analyze value (and potentially fittingness) non-circularly. Pessimists argue that *if* fittingness is needed to restrict reasons, it *must* be primitive (and thus nonexplanatory for value) to avoid circularity, but they are not committed to fittingness *existing* as a primitive normative relation independent of value.
      7.  **The Explanatory Goal:** Both camps share the goal of providing an informative account of value. Restrictionists believe FA + restriction achieves this. Pessimists believe FA cannot achieve this without circularity or misclassification, potentially necessitating an alternative approach.
      8.  **Problem Scope:** The WKR problem arises similarly for FA analyses of other normative concepts (e.g., reasons for belief/credence, the admirable, the blameworthy).

  ### 2. Disagreements Table

  | Point of Disagreement                                                                 | Neutral Wording                                                                                                                                 | Restrictionist Formulation                                                                                                                                 | Pessimist Formulation                                                                                                                                                                                    |
  | :------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Feasibility of a Successful Restriction**                                           | Whether there exists a way to characterize the class of value-relevant reasons that is both non-circular and correctly classifies all cases.    | A principled, non-circular restriction (e.g., the object-given/state-given distinction) can successfully isolate the reasons that bear on an object's value. | No proposed restriction can successfully isolate the value-relevant reasons without either smuggling in the notion of value/fittingness or misclassifying reasons in problematic cases.                   |
  | **Status of the Object-Given/State-Given (OG/SG) Distinction**                        | Whether the OG/SG distinction itself provides a satisfactory, fundamental basis for restricting value-relevant reasons.                         | The OG/SG distinction (reasons grounded in features of the object vs. features of the attitude-state) is a fundamental and successful normative distinction for isolating value-relevant reasons. | The OG/SG distinction is either not fundamental (resting on prior value/fittingness) or fails to correctly classify reasons in key cases (e.g., Reversed Sponsorship, Self-Fulfilling Valuation), making it inadequate. |
  | **Explanatory Role of Fittingness**                                                   | Whether the concept of fittingness can play a non-primitive, explanatory role within the FA analysis of value.                                  | Fittingness can be characterized (e.g., via the OG/SG restriction) in a way that is both normative and explanatorily prior to value, providing a foundation for the FA analysis. | Any characterization of fittingness robust enough to solve the WKR problem either presupposes the notion of value it is meant to explain or must be treated as a primitive normative relation, rendering it explanatorily inert for value. |
  | **Implication of WKR for FA Analysis**                                                | What the persistent challenges posed by WKR cases imply for the viability of the FA approach.                                                  | The WKR problem presents challenges that can be overcome within the FA framework using a successful restriction; it does not undermine the core FA insight. | The inability to resolve the WKR problem satisfactorily demonstrates a fatal flaw in the FA approach to analyzing value, either requiring abandonment of FA or reducing it to an uninformative claim about primitive fittingness. |

  ### 3. Cruxes: Key Sub-Questions and Predictions
  Each crux involves a case or argument both sides agree is central to assessing the disagreement. Predictions show how resolving the crux would impact each camp's position.

  1.  **Crux 1: Normative Foundations of OG/SG**
      *   **Question:** Is the OG/SG distinction itself fundamentally descriptive/non-normative, or is it normative "all the way down"? (E.g., Does classifying a reason as OG require a prior normative judgment about value or fittingness?)
      *   **Case/Argument:** **The Reversed Sponsorship:** Benefactor pays only if pro-attitude is *fitting* (i.e., object is genuinely valuable). Is the reason provided by the payment prospect OG or SG?
          *   *Restrictionist Prediction:* The reason is **State-Given (SG)**. The payment depends on the *fact of fittingness*, not on the object's properties making the attitude fitting. This case shows the OG/SG line tracks something distinct from value/fittingness itself (the *source* of the reason). It does not undermine the distinction.
          *   *Pessimist Prediction:* Classifying this reason as SG seems counterintuitive – the reason *is* directly tied to the object's *actual value* (via the fittingness condition). This suggests the OG/SG distinction either misclassifies or *relies on* a prior understanding of value/fittingness to draw the line. Resolving this in the Pessimist's favor undermines the OG/SG distinction's independence.
      *   **Stakes:** If the Restrictionist prediction holds, the OG/SG distinction retains independence. If the Pessimist prediction holds, the distinction either fails or depends circularly on value/fittingness.

  2.  **Crux 2: Reasons that Simultaneously Target State and Constitute Value**
      *   **Question:** Can a single reason simultaneously be a reason to have an attitude *and* a reason why the object of that attitude has value (i.e., where having the attitude constitutes the value)?
      *   **Case/Argument:** **The Self-Fulfilling Valuation:** Valuing a relationship *makes* it valuable. The reason to value is both state-given (benefits agent) and (seemingly) object-given (constitutes the object's value).
          *   *Restrictionist Prediction:* The reason can be coherently analyzed. The *benefit* aspect is SG. The *value-constituting* aspect stems from the *object's property* (here, the property *being valued by the agent*). Reasons citing this property are **Object-Given (OG)**. This illustrates the distinction working in a complex case.
          *   *Pessimist Prediction:* This case blurs the OG/SG line fatally. Calling the reason OG because it cites "being valued" seems like cheating – the reason is fundamentally *about the beneficial state of valuing*, not about independent object properties. If this counts as OG, the distinction loses its bite and becomes trivializable. The reason is **effectively SG**, showing the OG/SG distinction cannot handle reasons that bridge state and object constitution. Resolving this in the Pessimist's favor shows the restriction fails.
      *   **Stakes:** If the Restrictionist analysis holds, the distinction survives complex value-constitution. If the Pessimist analysis holds, the distinction collapses or misclassifies in crucial cases involving value-grounding attitudes.

  3.  **Crux 3: Symmetry Between Doxastic and Evaluative Attitudes**
      *   **Question:** Do the structural challenges posed by WKRs for FA analyses of *value* apply equally, and in the same way, to FA-style analyses of *belief/credence* (where fittingness is accuracy/truth)?
      *   **Case/Argument:** **The Confidence Pill:** Pill induces high credence P; separate reward offered for holding credence P.
          *   *Restrictionist Prediction:* The WKR problem arises **symmetrically**. The reward provides a SG reason for belief (targets the state of believing). OG reasons for belief stem from truth-related considerations (evidence). The core OG/SG distinction applies equally. Success or failure of restrictionist solutions here *constrains* solutions for value: a restriction must work for both domains or explain the disanalogy.
          *   *Pessimist Prediction:* The WKR problem arises **similarly**, but potential disanalogies exist (e.g., clearer independent standard for belief fittingness: truth). Pessimism about solutions for value **does not necessarily entail pessimism for belief**, or vice-versa. However, if a restriction *fails* for belief (e.g., cannot cleanly handle cases like pragmatic encroachment debates), it strengthens pessimism about restrictions generally. If it *succeeds* for belief, it doesn't guarantee success for value due to potential disanalogies (e.g., constitutive links like Self-Fulfilling Valuation). Analysis here informs but does not strictly constrain value theory.
      *   **Stakes:** Confirms if the WKR problem is a general feature of FA structures. Tests the portability of proposed solutions (especially restrictions). Highlights potential disanalogies between evaluative and doxastic normativity.

  ### 4. Analysis of Specified Cases & Commitments
  *   **The Sponsorship:**
      *   *Agreement:* The athlete's reason (getting paid) is a clear **WK reason (SG)**. Her valuing does **not** make the sport valuable. It only makes her better off.
      *   *Commitment Link:* Both camps agree this is a standard WKR case analogous to classic reward cases. A theory must classify it as SG/WKR.
  *   **The Reversed Sponsorship:**
      *   *Restrictionist:* Reason is **SG (WK)**. Payment depends on the *fact of fittingness*, not on the object's properties grounding fittingness. Shows OG/SG tracks reason-source, not value itself. (*See Crux 1*)
      *   *Pessimist:* Classifying this as SG/WK seems problematic; the reason is tightly linked to the object's *actual value*. Suggests OG/SG either misclassifies or relies on value. (*See Crux 1*)
      *   *Commitment Link:* Restrictionist view here is consistent with Sponsorship. Pessimist concern here fuels skepticism about OG/SG.
  *   **The Self-Fulfilling Valuation:**
      *   *Restrictionist:* The reason has aspects. The *benefit* reason is SG. The reason citing *that valuing it makes it good* is OG (targets the object's property *being valued*). Distinction holds. (*See Crux 2*)
      *   *Pessimist:* This single reason fundamentally targets the beneficial state of valuing; calling part of it OG because it mentions a consequence (value constitution) is gerrymandering. The reason is **effectively SG**, illustrating the distinction's breakdown when attitudes constitute value. (*See Crux 2*)
      *   *Commitment Link:* Resolution here is central to whether the restriction can handle complex value ontology. Pessimist view sees this as a distinct problem case beyond simple rewards.
  *   **The Confidence Pill:**
      *   *Agreement:* The reward provides a clear **WK reason (SG)** for holding the credence, analogous to Sponsorship.
      *   *Disagreement/Predictions:* As outlined in **Crux 3**. Both agree it's a WKR, but differ on implications for the general project of restriction and symmetry with value.
      *   *Commitment Link:* Restrictionists are committed to a parallel analysis and solution structure for belief and value. Pessimists are committed to the possibility that solutions or failures might not transfer directly between domains.

  ### 5. Verbal Disputes and Terminology

  We identify one potential area where disagreement might be partly verbal, concerning the core term "fittingness":

  *   **The Issue:** Does "fittingness" *necessarily* imply a normative relation explanatorily prior to value, or could it be understood as *constituted* by value?
  *   **Restrictionist Stance:** Fittingness is the prior normative relation; value is analyzed as the property of being a fitting object of a pro-attitude. Adopting the "constitutive" view would surrender the explanatory ambition of FA.
  *   **Pessimist Stance:** Insisting fittingness is prior and non-circularly definable is the core problem. If "fitting" just *means* "the attitude one would have if one correctly responded to the object's value," then FA reduces to an uninformative tautology. The *only* non-tautological option is primitive fittingness, which explains nothing.
  *   **Potential Resolution:** Clarifying the *explanatory target* is crucial. Restrictionists seek to *analyze value* and thus *need* fittingness prior. Pessimists argue this is impossible. Both might agree that *if* "fittingness" is used *synonymously* with "being a correct response to value," then FA is trivial and the WKR problem dissolves (but so does FA's explanatory power). The substantive disagreement is whether a non-trivial, prior notion of fittingness is viable.
  *   **Gain/Loss by Adopting Terms:**
      *   *Restrictionists adopting "constitutive" fittingness:* Would abandon the core explanatory project of FA. Unacceptable loss.
      *   *Pessimists adopting "prior primitive" fittingness:* Would grant the Restrictionist framework but deny it provides any explanation of *value*. Loss of the critique that FA *fails to explain*; gain of clarity that the debate is about accepting primitive normativity. Pessimists generally find this cost (accepting primitive unexplained fittingness) too high for no explanatory gain regarding value.

  **Conclusion:** This statement maps the agreed foundations, precisely articulates remaining disagreements in neutral and partisan terms, identifies crucial test points (cruxes) with specific predictions, analyzes novel cases highlighting commitments, and clarifies a potential verbal dispute. We offer this framework to structure future debate, ensuring disagreements are engaged directly and commitments are clear. Progress may come from jointly examining the outcomes of the cruxes or developing new cases testing the boundaries of proposed restrictions and the implications of primitive fittingness.

  **[Space for Signatures - Restrictionist Camp Representatives]**
  **[Space for Signatures - Pessimist Camp Representatives]**
