  ## The Krystalline Conundrum: Dispositions, Conditionals, and Intrinsicality

  The krysite rods present a crystalline test case for the nature of dispositions and the viability of the Simple Conditional Analysis (SCA), which reduces "x is disposed to M when S" to "if S were to occur, M would occur." By examining Rods A, B, C, and D, we can dissect the counterexamples – finkishness, masking, and mimicking – and evaluate what they genuinely establish about dispositions, intrinsicality, and the fate of the SCA.

  **Rod A: Disposition Present, Manifestation Absent (Finkishness)**
  Rod A possesses the intrinsic lattice structure characteristic of krysite, a structure *prone* to shattering under a sharp blow. This lattice *is* the causal basis for the disposition to shatter. However, the very occurrence of the stimulus (the blow) triggers the piezoelectric effect, rearranging the lattice faster than cracking can propagate, preventing shattering. This is a paradigmatic **finkish** scenario: the stimulus S (the blow) causes the immediate loss of the structure responsible for the manifestation M (shattering). Crucially, the disposition *was* present before S occurred, triggered by S, but its causal basis is removed *by* S before M can occur. The SCA fails here because S occurs, yet M does not, despite the genuine disposition existing. Rod A *is* disposed to shatter. Its counterfactual profile ("if struck, it would not shatter") diverges from its disposition due to the finkish interference intrinsic to its own piezoelectric nature. The work is done by the identity of the stimulus as the trigger for both the manifestation *and* the mechanism that removes the causal basis.

  **Rod B: Disposition Present, Manifestation Present**
  Rod B shares the *identical intrinsic lattice structure* with Rod A. This intrinsic structure is the causal basis for brittleness. The grounded mesh is an extrinsic addition; it drains the charge generated by the blow, preventing the piezoelectric rearrangement that protects Rod A. The mesh doesn't alter the rod's intrinsic brittleness; it merely prevents the *finks* that would otherwise remove that brittleness upon impact. When struck, the brittle lattice structure remains intact and unimpeded, leading to shattering. Rod B *is* disposed to shatter, and its counterfactual profile ("if struck, it would shatter") accurately reflects this disposition. The mesh overcomes the finks inherent in pure krysite, allowing the intrinsic disposition to manifest. The key step here is recognizing that the mesh is extrinsic and passive; it doesn't *create* the brittleness, it merely *exposes* it by disabling the protective mechanism shared intrinsically with Rod A.

  **Rod C: Disposition Absent, Manifestation Present (Mimicking)**
  Rod C is intrinsically tough; its material lacks the brittle lattice structure. The shattering upon impact is solely caused by an extrinsic device bolted to it. The rod itself possesses no intrinsic property serving as a causal basis for shattering under a sharp blow. The shattering is purely *mimicked* by the external device. This is a clear counterexample to the sufficiency of the SCA: S occurs (the blow), M occurs (shattering), yet the rod itself lacks the disposition. Rod C is *not* disposed to shatter. The SCA fails because it implies the rod has the disposition ("if struck, it shatters") when it does not; the manifestation is produced extrinsically. The decisive step is identifying the lack of an intrinsic causal basis within the rod itself for the manifestation.

  **Rod D: Disposition Present, Manifestation Absent (Masking)**
  Rod D is intrinsically brittle glass. The snug steel sleeve is an extrinsic object that physically prevents the impact force from reaching the glass rod. The intrinsic disposition to shatter under a sharp blow remains fully present; the glass retains its brittle structure. However, the sleeve *masks* this disposition by intercepting the stimulus. S occurs (the blow lands on the sleeve-rod assembly), but M does not occur (the rod doesn't shatter) because the stimulus never reaches the bearer of the disposition. Rod D *is* disposed to shatter. The SCA fails here because S occurs and M does not, despite the disposition persisting. The counterfactual profile ("if struck [meaning the assembly], it would not shatter") diverges due to the extrinsic masking device. The crucial step is distinguishing the stimulus *reaching the bearer* (which the sleeve prevents) from the stimulus occurring in the vicinity.

  **Intrinsicality and Shared Dispositions**
  Rods A and B share the *identical intrinsic lattice structure*. This structure constitutes the causal basis for the disposition to shatter in both. The difference in behavior (A doesn't shatter, B does) arises solely from the extrinsic mesh added to B, which prevents the intrinsic piezoelectric finks from activating. Therefore, **dispositions are intrinsic properties of their bearers**. A disposition is grounded in the intrinsic causal powers of the object. While its *manifestation* depends on extrinsic circumstances (the absence of masks, finks, or mimics), the disposition itself supervenes on the intrinsic properties. Rods A and B share the *same intrinsic disposition* (grounded in their identical lattice structure). The manifestation differs because Rod A's intrinsic finks activates upon S, while Rod B's extrinsic mesh prevents those finks from working. **Thus, A_and_B_share_a_disposition: true.**

  **The Fate of the Simple Conditional Analysis**
  The SCA, in its simple form ("disposed to M if S" = "if S, then M"), is demonstrably **must_be_abandoned**. The krysite rods illustrate all three fatal flaws:
  1.  **Finkishness (A):** S occurs, M does not, yet disposition present (False Negative for SCA).
  2.  **Mimicking (C):** S occurs, M occurs, yet disposition absent (False Positive for SCA).
  3.  **Masking (D):** S occurs, M does not, yet disposition present (False Negative for SCA).

  While sophisticated revisions incorporating *ceteris paribus* clauses, appeals to intrinsic bases, or more complex conditionals (like Martin's "if S and the basis were to persist, M would occur") have been proposed, they struggle significantly. Attempting to "repair" the SCA often ends up smuggling in the very notion of an intrinsic disposition or causal basis that the analysis was supposed to avoid or reduce, rendering the repair circular or insufficiently simple. For Rod A, specifying "if struck *and the lattice remained unaltered*" effectively presupposes the disposition *not* to rearrange, which krysite lacks. The finks is inherent. Masking cases like D require specifying the absence of extrinsic blockers, an open-ended and context-dependent task. Mimicking cases require excluding extrinsic causes of M, again moving beyond a simple conditional. The core problem is that the SCA conflates the *disposition itself* (an intrinsic property) with the complex *conditions required for its manifestation* (which involve the absence of finks, masks, and mimics). The distinction between a disposition and its manifestation conditions is fundamental, and the SCA fails to capture it. **The SCA cannot be repaired into a viable reductive analysis; it must be abandoned in favor of a metaphysics that takes dispositions as real, intrinsic causal powers.**

  **The Finkish/Masked Distinction: Does it Earn its Keep?**
  Rod A's case is clearly **finkish**, not masked. The distinction is crucial. Masking (like D) involves an *extrinsic* prevention of the stimulus from engaging the disposition or preventing the manifestation *despite* engagement. The intrinsic basis remains intact. Finkishness (like A) involves the stimulus *itself* causing the *loss* or *alteration* of the intrinsic causal basis *before* it can produce the manifestation. The piezoelectric rearrangement *removes* the brittle structure. This distinction earns its keep by pinpointing different mechanisms of failure for the SCA and highlighting the vulnerability of dispositions to intrinsic changes triggered by S (finks) vs. extrinsic interference (masks). It underscores that the threat to a disposition can come from within (finkish) or without (masked).

  **The Cost of the Verdict**
  Defending this position – that dispositions are intrinsic, shared by A and B, absent in C, present in D, and that the SCA is irredeemable – carries significant cost. It commits us to a robust realism about dispositions as irreducible causal powers grounded in intrinsic properties. This rejects Humean skepticism about necessary connections and reductionist programs aiming to analyze dispositions away in purely categorical or conditional terms. It requires accepting that an object (like Rod A) can possess a genuine disposition that is *necessarily* prevented from manifesting under the stimulus that would normally trigger it, due to its own intrinsic nature. This might seem counterintuitive, but it aligns with the reality of complex systems where internal feedback mechanisms inherently regulate responses. The cost is ontological expansion, but it buys accuracy in describing the causal structure of the world revealed by cases like krysite.

