  First, I need to map the friend's key positions to IRB pillars: 
  - The "commodification of life" concern translates to risk-benefit analysis where psychological/social risks (e.g., attachment severance) might outweigh benefits in vulnerable populations. 
  - "Exploitation of poor women" maps cleanly to vulnerability assessments and voluntariness evaluations - but with a twist. IRB focuses on transaction-specific coercion, while the friend likely means systemic socioeconomic coercion. That's a distortion point. 
  - The "invalid consent to sell certain things" argument has no IRB equivalent. Our framework assumes anything consensual and low-risk is permissible, whereas this implies inherent boundaries to market domains. Major residue here.

  Hmm, their suspicion about undue inducement vs. bad alternatives is sharp. Undue inducement (IRB Concept A) is about offers distorting judgment, while desperation (Friend's Concern B) is about baseline conditions forcing high-risk choices. IRB might flag B as vulnerability, but only if the study targets desperate populations - not the same as condemning the entire practice. 

  For the residue report: 
  - What translates well: exploitation arguments become vulnerability/voluntariness red flags. 
  - Partial translation: commodification risks become psychosocial risk assessments, but miss the "sacred vs. market" moral dimension. 
  - No translation: the inalienability argument - IRB has no "things that shouldn't be for sale" category. That gap reveals a genuine limit in the framework, not vagueness in the friend's position. 

  The user's nuanced about their own blind spots ("quietly flattening" different concerns). I'll validate that insight explicitly - their instinct about undue inducement vs. desperate circumstances is correct and exposes an IRB limitation. 

  Final note: The emotional weight here is professional frustration. They're fluent in IRB-speak but couldn't engage their friend's concerns on common ground. Showing exactly where the frameworks diverge (and why) might be more useful than winning the argument.
answer: |-
  Here’s a faithful translation of your friend’s arguments into IRB ethics vocabulary, followed by a residue analysis pinpointing conceptual gaps. I’ll strictly use your framework’s terms (*voluntariness, comprehension, undue inducement, vulnerable populations, risk-benefit ratio*) without smuggling in assumptions.

  ---

  ### **Translation: Ban Arguments in IRB Terms**
  1. **"Commodification/Dignity Violation"**  
     → *Risk-Benefit Imbalance*: The psychosocial risks (e.g., alienation from one’s body, long-term identity disruption, emotional harm from severing biological ties) are inherently high and potentially unmitigable. Benefits (financial compensation) may systematically outweigh genuine comprehension of these risks, especially in populations with limited alternatives.  

  2. **"Exploitation of Poor Women"**  
     → *Vulnerable Populations + Voluntariness Deficit*: Socioeconomically disadvantaged participants may have compromised voluntariness due to constrained alternatives. Their "choice" emerges from systemic background injustice (poverty), not autonomous preference. This creates a de facto targeting of vulnerable groups for high-risk transactions.  

  3. **"Invalid Consent to Sell Certain Things"**  
     → *Comprehension Barrier + Undue Inducement*: Certain goods (biological reproduction, parental rights) involve risks so profound or identity-altering that:  
     - True comprehension is impossible pre-experience (like understanding psychosis without experiencing it).  
     - Financial offers inherently constitute undue inducement by distorting risk perception for these specific goods, regardless of magnitude.  

  ---

  ### **Residue Report: What Doesn’t Translate**  
  | **Friend’s Argument**       | **IRB Translation**                     | **Fidelity**               | **Residue Analysis**                                                                                                                                 |  
  |-----------------------------|-----------------------------------------|----------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Commodification as inherently wrong** | Risk-benefit imbalance (psychosocial risks > benefits) | **Partial/Distorted** | *Gap*: IRB evaluates *magnitude* of harm, not inherent moral status. "Commodification" implies a categorical wrong (turning persons into things) – IRB only sees quantifiable risks. **Framework blindness**. |  
  | **Exploitation (systemic injustice)** | Vulnerability + voluntariness deficit | **Partial** | *Gap*: IRB flags *individual* vulnerability in a protocol. Friend’s concern is *systemic*: the market inherently preys on inequality. IRB can reject a protocol targeting the poor; it can’t reject the system enabling it. **Framework limitation**. |  
  | **Things money can’t buy (inalienability)** | Undue inducement + comprehension barrier | **Distorted** | *Gap*: IRB’s "undue inducement" requires an offer *distorting* judgment. Friend argues some things *cannot be consented to, period*, even absent inducement (e.g., selling a child). **Positional clarity lost in translation**. |  
  | **"Alternatives too bad" ≠ "Offer too good"** | Voluntariness deficit (constraints) | **Unaddressed** | *Critical Gap*: Your suspicion is correct. IRB’s "undue inducement" focuses on excessive rewards clouding judgment. "Desperation due to poverty" is a *background injustice* compromising voluntariness – a distinct problem IRB notes but can’t resolve. **Framework limitation**. |  

  ---

  ### **Key Insights from Residue**  
  1. **Your Framework’s Blind Spots**  
     - **Moral Absolutes**: IRB is consequentialist (weighing risks/benefits). It lacks a category for "intrinsically harmful transactions" (e.g., selling organs) outside measurable harm.  
     - **Structural Critique**: IRB assesses specific protocols, not markets. Systemic exploitation arguments evaporate when translated to "vulnerable populations" – the focus shifts to *targeting* the vulnerable, not the system *creating* vulnerability.  

  2. **Her Position’s Ambiguities Exposed**  
     - **Inalienability ≠ Inducement**: Her claim that some things "can’t be sold" isn’t fully captured by "undue inducement" or "comprehension." If consent is *impossible*, even perfect comprehension shouldn’t validate it. This exposes a need for her to define *why* reproductive capacities are inalienable.  
     - **Commodification’s Mechanism**: Is it wrong because it causes psychological harm (IRB-legible) or because it violates human essence (IRB-illegible)? Her argument likely blends both, but only the former translates.  

  3. **The "Alternatives Too Bad" Misfire**  
     You’re correct: IRB’s "undue inducement" (offer distorting judgment) ≠ "voluntariness deficit" (no acceptable alternatives). The former worries about enthusiasm overriding caution; the latter worries about despair overriding preference. Your framework *can* flag the latter under "voluntariness," but only within a protocol – not as a reason to ban a practice category.  

  ---

  ### **Conclusion**  
  The translation works cleanly for **individual risk mitigation** (e.g., screening for coercion, ensuring comprehension). It distorts **systemic critiques** into protocol-specific problems. It wholly excludes **deontological claims** (certain things are sacred/non-commodifiable). Your framework isn’t "dumb" – it’s designed to regulate research, not markets or moral boundaries. The friction arises because her argument targets the system’s existence; yours optimizes its operation. When she says "no one should sell this," your tools can only reply "show me the uncompensated risk."
