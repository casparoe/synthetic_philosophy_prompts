prompt: |-
  I am a backend engineer with no formal training in philosophy — my exposure is a few popular science books and long arguments with friends — and I keep running into a puzzle at work that I suspect has an established name, though every search I try lands me in either the free will debate or the mind-body debate, neither of which is quite the thing. Here is the pattern. When we debug an incident, we explain it at the level of the program: a cache held a stale entry, so the request handler priced the order off last week's data, so the invoice went out wrong. That is the explanation we act on; we change the invalidation logic and the bad invoices stop. But the same episode also has a story told in electrons, and that story is, as far as I can tell, complete: given the initial conditions and the laws, the electrons were going to do what they did regardless of whether anything was, in the program's vocabulary, stale. So the program story appears to make no additional causal difference. My colleagues split into two camps. Some say the program story is the real cause and the electron story is just bookkeeping; others say the electron story is the real cause and the program story is a useful fiction we tell to keep our jobs. I do not see why I have to pick, and I suspect the dilemma is an artifact of something.

  The wrinkle that stops me from settling for a stock answer is this. The two stories do not always agree about what caused what — they are not simply a coarse and a fine picture of the same thing. In a race condition, the program-level explanation is that two handlers wrote to the same record and the second overwrote the first, and that is the explanation that fixes the bug; a physical-level explanation would instead cite a particular interleaving of clock edges. Neither story is a redescription of the other, because the program-level story is compatible with a huge range of physical stories, and, worse, the same physical system will run any of infinitely many different programs depending on what is written on the disk. I also notice that we never intervene at the physical level: we set a breakpoint, flip a flag, deploy a patch, and the effect propagates reliably. The level we can push around is the symbolic one, and it pushes back reliably, which is a strange thing to say about a fiction.

  What I am after is not a label but a carving, and I would rather you reason carefully and show your work than reach for the first impressive term. Please answer in the voice of a philosopher who works on causation and on the special sciences, and begin by brainstorming a list of candidate concepts — anything from the metaphysics of causation, the philosophy of mind, the philosophy of the special sciences, or the philosophy of explanation — before you commit to anything. Then do two things. First, tell me which established concept is nearest to what I am describing and be specific about where it comes apart from my case: my pattern is not exactly the familiar worry that the higher-level story is doing no work at all, since the two levels sometimes disagree about causes rather than merely coarsening one another, and it is not exactly the ordinary distinction between a cause and a background condition, since that distinction is about selecting one factor within a single story rather than about two stories that return different verdicts. Second, if nothing fits, coin a term, define it precisely, and mark its edges: say what would have to be true for the pattern to disappear (for instance, does it depend on the higher level being producible by many different lower-level arrangements, or on the two levels being related by design rather than by emergence?), tell me which of the standard positions in this area are live options, and give me one or two boundary cases where it is genuinely unclear whether my pattern is present. I would also like to know whether this is one puzzle or two — whether the stale-cache case and the race-condition case are the same phenomenon in different clothing.
reasoning: |-
  Hmm, the user has presented a fascinating philosophical puzzle about causal explanations across different levels - specifically between program-level descriptions and physical electron-level descriptions in software systems. They're a backend engineer without formal philosophy training but clearly have deep insight into this problem from practical experience.

  The core tension they describe is interesting: when debugging, engineers act on program-level explanations (like stale cache entries), which reliably fix problems, yet the physical electron-level story seems causally complete on its own. The key wrinkles that make this non-trivial are (1) the two levels sometimes disagree about causes (as in race conditions), and (2) humans only ever intervene at the program level despite the physical level being "fundamental."

  I need to approach this carefully. The user specifically wants me to brainstorm candidate concepts before committing to an answer. Relevant philosophical areas would include: multiple realizability (from philosophy of mind), supervenience, non-reductive physicalism, causal exclusion problem, interventionist theories of causation, and explanatory pluralism.

  The stale cache and race condition examples seem to share the same underlying structure despite surface differences - both involve explanatory divergence between levels. The physical realization matters because the same program can run on different hardware, and the same hardware can run different programs.

  Kim's causal exclusion problem feels relevant but not quite right - here the higher level isn't epiphenomenal because we successfully intervene at that level. Woodward's interventionist theory helps here: program-level variables pass the interventionist test for causation.

  For the divergence in causal attributions, I'm considering explanatory context-sensitivity. In race conditions, the program level identifies the abstract conflict while the physical level identifies the specific electron path. Neither is "more real" - they answer different questions.

  The best fit seems to be a combination of "causal autonomy" (higher levels have legitimate causal power) and "explanatory divergence" (levels answer different causal questions). I should coin "cross-level explanatory divergence" to capture when levels yield different causal verdicts.

  Boundary cases would be: (1) simple mechanical systems where macro/micro align perfectly, (2) quantum systems where indeterminism might break the analogy. This appears to be one unified puzzle about level-relative causation, with stale cache and race condition being two manifestations.

  The user's intuition about not having to choose between levels is philosophically sound - this is a false dichotomy emerging from reductionist assumptions.
answer: |-
  Your puzzle cuts deep into metaphysics and philosophy of science. I'll proceed methodically, as requested. Here's my reasoning:

  **Brainstorming Candidate Concepts**  
  1. **Multiple Realizability** (Fodor, Putnam): Higher-level properties (e.g., "stale cache") can be instantiated by diverse lower-level states (electron configurations).  
  2. **Supervenience** (Davidson, Kim): Program states *depend* on physical states but aren't reducible to them.  
  3. **Causal Exclusion Problem** (Kim): If physical causes are sufficient, do higher-level causes do any real work?  
  4. **Interventionist Causation** (Woodward): Causes are what change *under interventions*. Your breakpoint example fits perfectly.  
  5. **Explanatory Context-Sensitivity** (van Fraassen): Explanations answer context-dependent questions. "Why the stale invoice?" ≠ "Why *these* electron paths?"  
  6. **Mechanistic Explanation** (Craver, Machamer): Programs describe mechanisms at functional/computational levels, physics at structural.  
  7. **Non-Reductive Physicalism** (Boyd): Higher-level causes are real but ontologically grounded in physics.  
  8. **Program Explanations** (Dennett's "Design Stance"): Treating systems *as if* following rules is pragmatically indispensable.  
  9. **Causal Autonomy** (List, Menzies): Higher-level causal models can be independent of lower-level details.  
  10. **Downward Causation** (Campbell): Higher-level states constraining lower-level behavior (e.g., program logic directing electron flow).

  ---

  **Analysis of Your Case**  
  Your scenario has **two distinct phenomena**:  
  - **Stale Cache**: Consistent causal stories across levels (physical state → program state → outcome).  
  - **Race Condition**: *Divergent* causal attributions (program: "overwrite conflict" vs. physics: "specific clock edge").  

  This divergence makes stock answers inadequate:  
  - **Not mere causal exclusion**: The levels aren't redundant; they sometimes *conflict* on what counts as "the cause."  
  - **Not background conditions**: You have two *competing causal narratives*, not one story with foreground/background.  

  The closest established concept is **Causal Autonomy** (List & Menzies), but with a twist. Standard autonomy assumes levels agree on causal *relata* but abstract details. Your race condition shows levels can **disagree on causal relata entirely**: the program identifies a *logical conflict*, physics identifies a *specific timing event*.  

  ---

  **Coined Concept: Cross-Level Explanatory Divergence (CLED)**  
  **Definition**: A phenomenon where:  
  1. A system admits two causally explanatory models at different levels of abstraction (L₁ and L₂).  
  2. L₁ and L₂ are *not reducible* via 1:1 mapping (due to multiple realizability/underdetermination).  
  3. For some events, L₁ and L₂ assign *different causal responsibility* (e.g., L₁ cites functional conflict F, L₂ cites physical process P).  
  4. Both models support successful interventions (e.g., fixing F *or* P prevents recurrence).  

  **Edges & Boundary Conditions**:  
  - **CLED vanishes if**:  
    - Levels are isomorphic (e.g., simple mechanics: macro-force = sum of micro-forces).  
    - One level is explanatorily inert (e.g., "vital force" in biology).  
  - **Depends on**:  
    - Multiple realizability of L₁ states.  
    - Context-sensitive explanatory goals (e.g., "debugging" vs. "circuit design").  
    - Non-linear/computational dynamics (enabling small L₂ changes to alter L₁ semantics).  

  **Live Philosophical Positions**:  
  - **Eliminativism** (Churchland): Only physics is real; program talk is heuristic. *Fails*: Intervention at L₁ reliably changes outcomes.  
  - **Strong Emergence** (O'Connor): L₁ has novel causal powers. *Problematic*: Physics seems causally closed.  
  - **Pluralist Realism** (Cartwright): Both levels capture real causal patterns for specific purposes. *Best fit*: Explains why interventions work at both levels.  

  ---

  **Boundary Cases**  
  1. **Simple Thermodynamics**: Gas pressure (macro) vs. molecular kinetics (micro). *Clear absence of CLED*: Macro cause ("pressure increase") is aggregative over micro causes.  
  2. **Quantum Computing**: A "qubit error" (program-level) vs. decoherence (physical). *Unclear CLED*: If quantum indeterminism breaks physical determinism, does the program level "add" causation?  

  **Stale Cache vs. Race Condition**: Same phenomenon (CLED) under different **causal grain**. Stale cache has coarse agreement; race condition has fine disagreement. Both rely on multiple realizability and interventionist efficacy.  

  **Resolution**: You're right to resist choosing. The levels answer **different causal questions**:  
  - *Program level*: "Why did the *system-as-software* fail?" (Answer: Stale data, race conflict)  
  - *Physical level*: "Why did *this specific hardware* fail *at t=42ms*?" (Answer: Electron path, clock edge)  

  The "fiction" camp mistakes abstraction for falsehood; the "physical fundamentalism" camp mistakes granularity for completeness. Software causation is as real as chess rules causing checkmate—dependent on physics but irreducible to it. Your debugger's efficacy proves its causal grip on the world.

  **Key References**  
  - Woodward, J. (2003) *Making Things Happen* (Interventionism)  
  - List, C. & Menzies, P. (2009) "Non-Reductive Physicalism and the Limits of the Exclusion Principle"  
  - Dennett, D. (1971) "Intentional Systems" (Design Stance)  
  - Craver, C. (2007) *Explaining the Brain* (Mechanistic levels)
