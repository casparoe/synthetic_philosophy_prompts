prompt: |-
  I teach a second-year "reasoning and evidence" course -- mixed majors, about 20 students, one 90-minute block -- and I want an activity that makes Simpson's paradox land as a felt problem rather than a table they nod at and forget. Don't name it until the debrief, and don't explain it up front.

  Here's the seed I've got, build the presentation around it (the numbers are made up, they're just arithmetic):

  Two treatments for the same condition. Treatment A: 18 of 20 mild cases recover, and 18 of 180 severe cases recover. Treatment B: 153 of 180 mild cases recover, and 1 of 20 severe cases recover. So A wins in each group (90% vs 85%, and 10% vs 5%) but loses overall (18% vs 77%), because B was given mostly to mild cases.

  What I want them to feel: they commit to a choice, publicly, and then the same numbers re-sliced tell them the opposite -- and then they find out that the arithmetic was never the problem, the causal story is.

  So design the session. Things I want in it:

  Round 1: everyone sees only the totals and has to pick a treatment. A real vote, on paper, hands up, whatever. Something at stake even if it's just chips or a small prize for the side that ends up "winning" the session. They should be irritated when the split is revealed.

  Round 2: same data, split by severity. Second vote. Let them argue it out. Don't resolve it for them.

  Round 3, the part I actually care about: give them the same two tables three times with three different backstorys for what that severity variable is -- say, severity was recorded by the clinician before anyone was assigned a treatment; severity was recorded on day 3, after treatment had started; severity is something that both the treatment and a hidden frailty factor influence. They have to say, for each backstory, which comparison answers the question of which treatment is better. I want them to discover that the right move flips with the story, and that there's no rule -- always pool, always split -- that saves you from doing the causal work. The day-3 one is the one they'll fight about, so leave room for that.

  A lobbying round if it fits: two teams, one briefed to argue for A, one for B, each free to present the data however it likes to a student playing the regulator, who then rules. Fake currency or points for a favourable ruling. Point of it is to make them feel that one table is also a weapon, then ask whether presenting it that way was dishonest given each of the three backstories.

  Then a debrief that maps what just happened onto the pieces of the idea: the unequal group sizes, the lurking variable, why the reversal is arithmetically fine, why the resolution is causal rather than statistical, and why a bigger sample doesn't fix any of it. Tell me the materials I need to print and how to set the room up.

  And be honest with me about the running of it: what predictably goes wrong the first time (I'm guessing someone insists the totals have to be right because more data is better, and someone accuses the whole thing of being a trick about lying), how to handle each of those, and which feature of the idea the activity can't reproduce so I have to supply it myself in the debrief.
reasoning: |-
  We are designing a 90-minute session for a second-year "reasoning and evidence" course with about 20 students. The goal is to make Simpson's paradox a felt problem. We'll use the provided seed data and structure the session as requested.

  Session Structure:

  1. **Round 1: Total Recovery Rates (Vote 1)**
     - Present only the overall recovery rates for the two treatments without any breakdown by severity.
     - Treatment A: 18 (from mild) + 18 (from severe) = 36 recoveries out of 200 patients (20 mild + 180 severe). Overall recovery rate: 36/200 = 18%.
     - Treatment B: 153 (from mild) + 1 (from severe) = 154 recoveries out of 200 patients (180 mild + 20 severe). Overall recovery rate: 154/200 = 77%.
     - Ask students: "Which treatment would you choose based on this data? Treatment A (18% recovery) or Treatment B (77% recovery)?" 
     - Conduct a public vote (e.g., show of hands, or collect slips). Record the results. 
     - The majority will likely choose B because of the much higher overall recovery rate.

  2. **Round 2: Breakdown by Severity (Vote 2)**
     - Reveal the breakdown by severity for both treatments. Present two tables: one for mild cases and one for severe cases.
       - Mild cases:
         - Treatment A: 18 recoveries out of 20 (90%)
         - Treatment B: 153 recoveries out of 180 (85%)
       - Severe cases:
         - Treatment A: 18 recoveries out of 180 (10%)
         - Treatment B: 1 recovery out of 20 (5%)
     - Point out that Treatment A has a higher recovery rate in both mild (90% vs 85%) and severe (10% vs 5%) cases.
     - Ask: "Now, which treatment would you choose? Treatment A or Treatment B?" 
     - Conduct a second vote. Expect disagreement and let them argue. Do not resolve.

  3. **Round 3: The Role of the Severity Variable (Causal Stories)**
     - Present the same two tables (overall and by severity) three times, each with a different backstory for the severity variable. For each, ask: "Given this story, which comparison (overall or by severity) should we use to decide which treatment is better?"
     - **Story 1: Severity recorded before treatment assignment (ideal)**
       - "Severity was assessed at the time of diagnosis, before any treatment was assigned. Then, patients were assigned to treatments without regard to severity (but note: in the data, Treatment B was mostly given to mild cases and Treatment A to severe cases)."
       - Expected: They should choose the breakdown by severity because severity is a confounding variable that is not caused by the treatment. The assignment was non-random (B given to more mild cases) so the overall rate is misleading.
     - **Story 2: Severity recorded on day 3 of treatment (post-treatment)**
       - "Severity was assessed on day 3 of treatment, after treatment had started. It's possible that the treatment itself may have affected the severity (e.g., if the treatment is working, the patient might be reclassified from severe to mild)."
       - This is the tricky one. They might argue both ways. The key point is that if the treatment affects the severity (e.g., if Treatment B is so effective that it quickly reduces severity, then the severity on day 3 is a consequence of the treatment and not a pre-existing condition), then conditioning on severity (which is now a post-treatment variable) might introduce bias. In that case, the overall rate might be more appropriate? But note: the overall rate is confounded by the initial severity. So this is ambiguous and depends on the causal structure. There is no clear answer without more information. They should see the dilemma.
     - **Story 3: Severity influenced by both treatment and an unmeasured frailty factor**
       - "Severity is a measure that is influenced by both the treatment and an unmeasured frailty factor (e.g., overall health). The frailty factor also influences recovery. The severity was measured at the start, but note: the frailty factor might have influenced both the initial severity and the recovery, and the treatment might also affect severity over time (but we are measuring at the start)."
       - This is complex. Since severity is measured at the start (like Story 1), it is a pre-treatment variable. However, the frailty factor is a confounder that affects both severity and recovery. But if we condition on severity, we are conditioning on a collider (if frailty causes severity and treatment also causes severity? Actually, in this story, treatment doesn't cause initial severity because it's measured at the start). So this might be similar to Story 1. The point is to see that even with pre-treatment severity, there might be unmeasured confounding (the frailty) that we haven't accounted for. But without the frailty data, we can only adjust for severity. So again, the breakdown by severity is the best we can do.

     For each story, have students discuss in small groups (3-4 students) and then report. Do not give the answer; let them debate. The goal is to see that the causal story matters and that there is no one-size-fits-all rule.

  4. **Lobbying Round (Optional, if time permits)**
     - Divide the class into two teams: Team A (argue for Treatment A) and Team B (argue for Treatment B). Assign one student to be the regulator (or you can play the regulator if time is short).
     - Each team is given 5 minutes to prepare their best argument using the data (they can present the overall or the breakdown, or both, but must be truthful with the numbers). They are to convince the regulator to approve their treatment.
     - Then, each team presents (2-3 minutes each). The regulator asks questions and then rules.
     - The regulator awards points (or fake currency) to the winning team.
     - After the ruling, ask: 
          - To Team A: "Did you present the overall rate? Why or why not? Was it honest given the backstory we are using?" (Choose one backstory, e.g., Story 1.)
          - To Team B: Same questions.
          - Then, change the backstory (e.g., Story 2) and ask if they would have presented the same way. The point: the way you present the data can be strategic, but the causal story determines what is actually relevant.

  5. **Debrief**
     - Reveal the name: Simpson's Paradox.
     - Explain the arithmetic: How the reversal happens because of the unequal group sizes (B was given mostly to mild cases, which are easier to treat, hence the high overall rate for B, even though A is better in each subgroup). Show the calculations again.
     - The lurking variable: Severity is the confounding variable that distorts the overall comparison.
     - Why the resolution is causal: The paradox disappears when we condition on the confounding variable (severity) but only if that variable is a confounder and not a mediator or collider. In Story 1, it's safe to condition. In Story 2, conditioning might be problematic because severity is post-treatment. In Story 3, there might be unmeasured confounding even after conditioning.
     - Why more data doesn't fix it: The issue is not sample size but the structure of the data and the causal relationships. Even with infinite data, the paradox can occur if the confounding is present.
     - Map the activity to the concepts:
          - Round 1: We saw the overall data without considering the confounder.
          - Round 2: We saw the data split by the confounder, but without knowing the causal story, we didn't know if splitting was appropriate.
          - Round 3: We saw that the causal story (when and how the severity was measured) changes what we should do.

  Materials to Prepare:
  1. Handouts or slides for each round.
     - Round 1: A single table with overall recovery rates for A and B.
     - Round 2: Two tables: one for mild and one for severe cases, showing the recovery rates for each treatment in each group.
     - Round 3: The same two tables (overall and by severity) and the three backstories (on separate handouts or slides).
  2. Voting slips or a way to record votes (if using hands, have a TA or a student count).
  3. For the lobbying round (if done): Briefing sheets for each team (with the data and their assigned treatment) and for the regulator (with the data and the backstory to use). 
  4. Fake currency or points system (if using).

  Room Setup:
  - Desks arranged for group work (for Round 3 and lobbying). 
  - A whiteboard or projector to display the data and record votes.

  Potential Pitfalls and How to Handle Them:

  1. **"The totals have to be right because more data is better."**
     - Response: More data is better for precision, but it doesn't automatically account for confounding. The overall data is a larger sample, but it's not randomly assigned. The groups are different (one treatment was given to mostly mild cases, the other to mostly severe). So the overall rate is comparing apples and oranges.

  2. **"This is a trick about lying with statistics."**
     - Acknowledge: Yes, the same data can be presented in two ways to support opposite conclusions. But the point isn't that statistics is lying; it's that we need to understand the causal structure to know which way is appropriate. The activity is designed to show that both presentations are mathematically correct, but only one (or neither) might be causally appropriate.

  3. **In Round 3, Story 2 (post-treatment severity) might lead to confusion.**
     - Expect a heated debate. Don't resolve it immediately. Let them see that without knowing the causal structure, it's ambiguous. In the debrief, explain that conditioning on a post-treatment variable can sometimes block part of the effect of the treatment (if the treatment works by reducing severity) and sometimes introduce bias (if the post-treatment variable is affected by the treatment and also by other factors that affect the outcome). This is a more advanced point, but for this course, the takeaway is that the timing and role of the variable matter.

  4. **Time management:**
     - The entire activity might run over 90 minutes. Prioritize:
          - Round 1: 5 minutes
          - Round 2: 10 minutes (including vote and discussion)
          - Round 3: 30 minutes (10 minutes per story, including group discussion and class sharing)
          - Lobbying: 15 minutes (if included)
          - Debrief: 20 minutes
          - Buffer: 10 minutes
     - If time runs short, skip the lobbying round or shorten the group discussions.

  What the Activity Can't Reproduce and Must Be Supplied in Debrief:
  - The activity shows the paradox and the role of the causal story, but it doesn't teach the formal causal diagrams (e.g., DAGs) or the statistical methods to adjust for confounders. You will have to explain in the debrief the basic idea of confounding and why conditioning on a pre-treatment confounder is appropriate but on a post-treatment variable might not be. Also, the activity doesn't cover how to collect data to avoid the paradox (randomization, measuring confounders) — you can mention that in the debrief.

  Final Thought: The key is to create cognitive dissonance in Round 1 and Round 2 and then show that the resolution requires thinking beyond the numbers. The irritation when the split is revealed is the hook. The causal stories in Round 3 are the core learning. The lobbying round (if done) makes it visceral. The debrief ties it together.

  Good luck!
answer: |-
  ### **Session Design: "The Treatment Dilemma" (90 minutes)**  
  **Goal:** Make Simpson's paradox visceral by forcing students to confront conflicting conclusions from the same data, then reveal that the resolution hinges on causal context—not arithmetic or sample size.  

  **Materials to Prep:**  
  - **Handouts:**  
    - **Round 1:** Table showing *only overall recovery rates*:  
      - Treatment A: 36 recoveries out of 200 patients (18%).  
      - Treatment B: 154 recoveries out of 200 patients (77%).  
    - **Round 2:** Two tables split by severity:  
      - *Mild cases:*  
        - Treatment A: 18/20 recoveries (90%)  
        - Treatment B: 153/180 recoveries (85%)  
      - *Severe cases:*  
        - Treatment A: 18/180 recoveries (10%)  
        - Treatment B: 1/20 recoveries (5%)  
    - **Round 3:** Three backstory cards (one per group):  
      - **Backstory 1:** "Severity was recorded *before treatment* by a clinician. Treatment assignment was based on hospital policy (not severity)."  
      - **Backstory 2:** "Severity was recorded *on day 3 of treatment* (after treatment started)."  
      - **Backstory 3:** "Severity is influenced by *both treatment and frailty* (an unmeasured factor). Frailty also affects recovery."  
    - **Lobbying Round:** Role cards (2x "Team A Advocates," 2x "Team B Advocates," 1x "Regulator" per group).  
  - **Other:** Sticky notes for votes, whiteboard for tallying, poker chips (or fake money) for prizes, timer.  

  **Room Setup:**  
  - Arrange desks into 4 groups of 5 students each.  
  - Whiteboard at front with two columns: "Treatment A" and "Treatment B" for votes.  

  ---

  ### **Session Flow**  

  #### **Round 1: The Obvious Choice (10 min)**  
  - **Setup:** Distribute **Round 1 handout** (overall rates only). No context about severity.  
  - **Prompt:** *"You’re advising a hospital. Based *only* on this data, which treatment would you recommend? Vote now!"*  
  - **Vote:** Students write choice (A or B) on sticky note and stick it on whiteboard. Tally publicly.  
    - *Expected outcome:* >90% choose B (77% vs. 18%).  
  - **Irritation Hook:** Reveal the split data *after* the vote. *"Wait! There’s more. It turns out severity matters..."* Show Round 2 handout. Watch for groans/confusion.  

  #### **Round 2: The Reversal (15 min)**  
  - **Setup:** Display **Round 2 tables** (split by severity).  
  - **Prompt:** *"Now you see recovery rates by severity. Treatment A wins in *both* groups. Does this change your vote? Discuss in groups for 5 min."*  
  - **Group Debate:** Let groups argue. Push them: *"Which comparison is fairer: overall or by severity? Why?"*  
  - **Vote 2:** Re-vote publicly. *Expected split:* Some switch to A; others stick with B.  
  - **Do NOT resolve:** *"We have two conflicting answers. Let’s dig deeper."*  

  #### **Round 3: Causal Backstories (30 min)**  
  - **Setup:** Give each group **all three backstory cards** and the same two tables (overall + split).  
  - **Prompt:** *"For each backstory, decide: Should we trust the *overall* rate or the *split-by-severity* rate to pick the better treatment? You have 12 min."*  
  - **Group Work:**  
    - Groups assign 1 backstory per student pair.  
    - **Key Qs to guide them:**  
      - *"When was severity measured? Could treatment *cause* severity?"*  
      - *"Is severity a confounder (pre-existing) or a mediator (affected by treatment)?"*  
  - **Class Share (18 min):**  
    - For each backstory, poll groups. **Force disagreement:**  
      - **Backstory 1 (pre-treatment):** *Expected consensus:* Split data is better (severity is a confounder).  
      - **Backstory 2 (day 3):** *Predicted fight:* "Overall" vs. "split" camps. Push: *"If treatment *reduces* severity by day 3, does splitting hide its effectiveness?"*  
      - **Backstory 3 (frailty):** *Expected confusion:* Split is safer (adjusts for severity) but frailty is unmeasured. *"Can we fully trust either comparison?"*  
    - **Cliffhanger:** *"No easy answer? Exactly. The story changes everything."*  

  #### **Lobbying Round (15 min)**  
  - **Setup:** Assign roles per group (2x Team A, 2x Team B, 1x Regulator). Teams get 5 min to prep.  
  - **Prompt:**  
    - *"Team A: Argue Treatment A is better. Team B: Argue Treatment B is better. Use the data *any way you like* to persuade the Regulator."*  
    - Regulator awards 10 chips to the team that wins the argument.  
  - **Debrief Lobbying:** After rulings, ask:  
    - *"Which data did Team A use?"* (Likely split data). *"Team B?"* (Likely overall).  
    - *"Was it dishonest? Let’s test with our backstories:"*  
      - Backstory 1: Using overall data *is* misleading (confounder).  
      - Backstory 2: Using split data *might* be misleading (severity is a mediator).  
    - *"Moral: Data isn’t 'lying'—but causal context determines what’s honest."*  

  #### **Debrief & Concept Reveal (20 min)**  
  - **Name the Paradox:** *"You just experienced Simpson’s Paradox: when grouping reverses a trend."*  
  - **Map the Lesson:**  
    1. **Arithmetic:** Show how reversal happens:  
       - B’s overall rate is high because it treated mostly mild cases (153/180).  
       - A’s overall rate is low because it treated mostly severe cases (18/180).  
    2. **Lurking Variable:** Severity is the confounder. Unequal group sizes (180 mild vs. 20 severe for B) distort the overall rate.  
    3. **Causal Resolution:**  
       - Backstory 1: Split is correct (severity pre-dates treatment).  
       - Backstory 2: Overall *might* be better (severity is a mediator; splitting blocks treatment’s effect).  
       - Backstory 3: Neither is perfect (frailty is unmeasured).  
    4. **Bigger Samples Don’t Fix It:** *"Even with infinite data, if severity is unbalanced and unaccounted for, the paradox remains. You need causal reasoning—not just more data."*  
  - **Connect to Activity:**  
    - Round 1: Fell for confounding (lurking variable).  
    - Round 2: Saw the reversal but didn’t know *why* it mattered.  
    - Round 3: Discovered the causal "why."  
  - **Final Takeaway:** *"No statistical rule (always split/always pool) works. You must ask: ‘What does this variable mean in the real world?’"*  

  ---

  ### **Honest Running Notes: Pitfalls & Fixes**  
  1. **"Totals must be right—more data is better!"**  
     - **Why it happens:** Intuitive belief that larger samples = more truth.  
     - **Fix:** In Round 2, ask: *"If Treatment B mostly got easy cases, is its high overall rate ‘fair’? What if we gave aspirin mostly to headaches and chemo to cancer?"*  

  2. **"This is a trick with lying statistics!"**  
     - **Why it happens:** Students feel manipulated by the reversal.  
     - **Fix:** Validate: *"Yes, the same numbers tell two stories. But neither is ‘lying’—they answer different questions. The paradox is real, and it’s why we need causal context."*  

  3. **Round 3 Backstory 2 (day 3) stalemate:**  
     - **Predictable stalemate:** Students will debate endlessly whether splitting "adjusts" or "hides" effects.  
     - **Fix:** Don’t solve it. Say: *"This is why real researchers fight! Without knowing *how* treatment affects severity, both views have merit. That’s why study design matters."*  

  4. **Time Crunch:**  
     - **Risk:** Round 3 and lobbying could run long.  
     - **Fix:** Cut lobbying if needed (make it a 5-min "elevator pitch" instead). Skip group shares for one backstory.  

  **What the Activity Can’t Teach (Supply in Debrief):**  
  - **Formal Causal Diagrams:** The activity shows why causality matters, but you’ll need to sketch a quick DAG (Directed Acyclic Graph) in debrief:  
    - Backstory 1: Severity → Treatment & Severity → Recovery (confounder).  
    - Backstory 2: Treatment → Severity → Recovery (mediator).  
  - **Statistical Solutions:** Mention RCTs (randomization balances severity) or regression, but stress: *"No math fixes bad causal assumptions."*  

  **Why This Works:**  
  - Students *feel* the whiplash of the paradox (Round 1 vs. 2), then engage in the "detective work" of causal storytelling (Round 3). The lobbying round makes them complicit in weaponizing data, driving home the ethics. By never mentioning Simpson’s paradox until the end, you avoid preconceptions and let the tension build.  

  **Adjust on the Fly:** If groups are stuck, inject questions like: *"If severity changes *because* of treatment, is it fair to compare severe patients across treatments?"* Lean into the chaos—the frustration is where learning sticks.
