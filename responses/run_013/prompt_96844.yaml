  For the armchair vs. experiment debate, Hume valued observation but saw philosophy's role in analyzing concepts. He'd argue that common intuitions are starting points, not endpoints. He might suggest experiments varying sympathy conditions to test his sympathy theory. But he'd remain silent on modern statistical methods or cross-cultural data since those weren't part of his era.

  The user needs Hume to be surprised but not converted. He'd appreciate the data but defend philosophy's role. Distinguishing psychological facts from philosophical claims is key. He'd insist that how people judge intentionality doesn't define what it truly is. The experimentalists' dismissal of armchair methods would trouble him, as reflection refines common sentiments.

