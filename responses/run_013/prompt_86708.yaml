prompt: |-
  I am an undergraduate in a moral psychology seminar, and I am writing the final reflection paper for the unit we have just finished on judgments of intentional action. I would rather not simply summarize the readings. I want to take my own verdicts on a set of cases as the data and work out what they commit me to. I am hoping you can help me identify the principle, or the small set of rival principles, that best fits the pattern, tell me what each predicts for cases I have not yet considered, and be honest about which of my verdicts a principled account would force me to abandon.

  The examples we were shown in lecture mostly varied whether the side effect was good or bad, so I have tried to vary other features as well, one at a time. I am reasonably confident about all of the following except the last.

  1. Nadia manages a small dairy. To cut costs she switches to a cheaper cleaning agent. She has read the safety data sheet and is certain that the rinse water will run into the creek behind the plant and kill the trout there. She has no feelings about the trout one way or the other; the switch is entirely about cost. Did Nadia kill the trout intentionally? Yes.

  2. Her cousin Omar runs a dairy two valleys over. He switches to a different agent, and he is certain the runoff will break up an algal bloom and let the trout return. He is indifferent to the fish and is switching only to save money. Did Omar restore the trout intentionally? No.

  3. Riverbend is a firm with a well-known environmental ethos: every process is assessed by its effect on the watershed, and profit is treated as a tolerated byproduct; managers who raise profits by degrading the watershed are quietly eased out. A manager there, Sofia, introduces a process that she is certain will substantially raise profits, an effect she does not care about. Did Sofia raise profits intentionally? I find myself saying yes. The whole point of the place is that you are not supposed to do that, and she knew exactly what she was doing.

  4. At a haulage firm it is an open secret that the December rush pushes some drivers past the legal limit, that a few are caught, and that they lose their licences; the practice is winked at, and there is even a standard form for recording the losses. A dispatcher, Tomasz, builds the December rota knowing with certainty that two drivers will be caught and lose their licences. He does not care about the drivers either way; he cares about the volume. Did Tomasz cause those two drivers to lose their licences intentionally? I say yes.

  5. Suppose instead that Nadia had only been told the agent might be toxic, putting the risk at roughly sixty-forty, and switched anyway, and the trout died. Did she kill the trout intentionally? I say no; without the certainty the word seems too strong.

  6. A registrar, Piotr, moves the office to a new filing system, knowing it will change the numbering on the forms. Did he change the form numbers intentionally? This is the one I cannot settle: on Monday I say yes and on Tuesday I say no.

  The trouble is that cases 3 and 4 pull in opposite directions. In 3 the side effect is good and yet I call it intentional, which makes it look as though what matters is that it broke the local norm. In 4 the side effect is bad and I call it intentional even though it fits the local norm, which makes it look as though what matters is that it was bad. I cannot get both out of a single simple clause, and I would rather not end up with a principle that has a separate clause for every case. My own first attempt was that an agent brings about a side effect intentionally when she is certain of it and is not trying to avoid it, but that makes case 2 come out intentional, which I do not want, so it plainly needs repair or replacement.

  What I would like from you: a principle, or a couple of rival principles, stated precisely enough that I could apply them to a fresh case; the cases above that support each clause; what each principle predicts for a few cases I have not listed, for instance a side effect that is neither good nor bad and violates no norm, or one the agent actively regrets; and, most importantly, which of my six verdicts I should give up, and why that is the one to surrender rather than another.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They're an undergraduate in a moral psychology seminar working on a reflection paper about judgments of intentional action. They don't want to just summarize readings; instead, they're using their own judgments on specific cases as data to find underlying principles. Their main challenge is reconciling their conflicting intuitions, especially between cases 3 and 4.

  First, I need to analyze each case they provided. Case 1 (Nadia) is straightforward: bad side effect, certainty, indifference → intentional. Case 2 (Omar): good side effect, certainty, indifference → not intentional. This aligns with the Knobe effect, where bad side effects are seen as more intentional. Case 3 (Sofia) is interesting because even though raising profits is a good side effect in a company that usually prioritizes environment, the user says it's intentional because it violates the local norm. Case 4 (Tomasz): bad side effect, fits the local norm, yet they still say intentional. This contradicts the norm account because the norm violation in case 3 made it intentional, but here no norm violation yet still intentional. 

  The user's initial principle (certainty and not trying to avoid) fails because it predicts case 2 should be intentional, which it isn't. Their conflict between cases 3 and 4 suggests that neither norm violation nor valence alone explains both. So maybe a hybrid approach is needed. 

  Looking at existing theories: Knobe's original account emphasizes moral valence, but that doesn't explain case 3 where a good effect is intentional due to norm violation. The norm-based account (Uttich and Lombrozo) might handle case 3 but fails case 4 because the bad effect is intentional despite norm conformity. The Deep Self model might work if the local norm is internalized, but case 4’s norm is external, which the user might not have internalized. 

  The user also struggles with case 6 (Piotr changing form numbers). This is a neutral action, so their indecision might stem from lack of clear valence or norm. This could be a test case for any principle. 

  The user needs a principle that explains their judgments. A hybrid principle combining norm violation and moral valence might work. For example: intentional if the agent is certain, not trying to avoid, and either the outcome is bad or it violates a salient norm. This would cover case 1 (bad), case 3 (norm violation), case 4 (bad), while excluding case 2 (good, no norm violation). But case 4 doesn't violate a norm, so the valence alone makes it intentional. 

  However, this hybrid approach might be ad hoc. The user might need to surrender one of their judgments. Which one? Case 4 is problematic because the norm is accepted locally, but the user still sees it as intentional. Maybe they're applying a broader moral norm (harming drivers is wrong) despite local acceptance. If so, the Deep Self model could work if the user believes the agent should have known better, making it a failure of deep self-concordance. 

  Alternatively, surrendering the "yes" in case 3. If valence is primary, then raising profits (good) shouldn't be intentional. But the user feels strongly about the norm violation here. 

  The user also mentioned case 5 (uncertainty) and case 6 (neutral). Case 5 they said no intentional without certainty, supporting the certainty condition. Case 6’s indecision suggests neutrality affects judgment, so any principle must account for neutral cases. 

  Testing principles against new cases: e.g., an agent causes a neutral outcome violating a norm (like changing a tradition without reason). Hybrid predicts intentional due to norm violation. If the user agrees, that supports hybrid. Or a bad outcome the agent regrets but doesn’t avoid: valence should make it intentional. 

  The user should consider surrendering case 4's "yes". If local norms matter, and the norm accepts harming drivers, then it shouldn't be intentional. But the user might resist this because harming is inherently bad. Or, accept that case 3's norm violation overrides valence, but then case 4's valence overrides norm compliance. That's messy. 

  Another option: emphasize the agent's attitude. In case 3, Sofia doesn't care about the norm, so her indifference makes the good effect intentional because it's a violation. In case 4, Tomasz is indifferent to harm, which is bad, so intentional. But in case 2, Omar is indifferent to a good effect, not intentional. So indifference to bad or norm violation triggers intentional judgment. 

  Ultimately, the user might need to adopt a principle that incorporates both valence and norms, acknowledging some complexity. Or revise case 4 to "no" if local norms are strong, but that might conflict with their moral intuition. 

  I should present a hybrid principle, suggest surrendering case 4 if they prioritize norms, or case 3 if they prioritize valence. But their strong intuition in case 3 (norm violation) suggests valence isn't everything. Highlighting the Deep Self model might help, where case 4's indifference to harm reflects a moral defect, making it intentional despite local norms. 

  For case 6, applying the principle: if changing numbers is neutral, not violating norms, then not intentional. If there's an implicit norm against unnecessary changes, then intentional. The user's uncertainty might stem from ambiguity about norms here. 

  In conclusion, the user's intuitions point towards a hybrid model. They might need to surrender case 4 by accepting that local norms reduce intentionality, but their moral judgment overrides that. Alternatively, refine the principle to include the agent's awareness of broader moral norms beyond local practices.
answer: |-
  Based on your thoughtful cases and commitment to principled consistency, I propose two rival principles that best explain your pattern of judgments. Both require abandoning *one* of your verdicts to achieve coherence. Below is the analysis, followed by a recommended resolution.

  ---

  ### **Principle 1: Hybrid Valence + Norm-Violation Account**  
  **Statement**: An agent brings about a side effect *intentionally* iff:  
  (1) They are **certain** it will occur,  
  (2) They **do not actively avoid or regret it**, *and*  
  (3) **Either** (a) the outcome is **morally bad** *or* (b) it **violates a salient normative commitment** of the agent’s context (e.g., organizational ethos, role duty, or personal obligation).  

  #### **Fit with Your Verdicts**:  
  | Case | Outcome      | Valence | Norm Violation? | Your Verdict | Principle Predicts |
  |------|--------------|---------|-----------------|-------------|-------------------|
  | 1    | Kill trout   | Bad     | No (neutral)    | **Yes**     | Yes (via 3a: bad) |
  | 2    | Restore trout| Good    | No              | **No**      | No (fails 3a/3b)  |
  | 3    | Raise profits| Good    | **Yes** (Riverbend ethos) | **Yes** | Yes (via 3b: norm violation) |
  | 4    | Lose licenses| **Bad** | **No** (local norm accepts it) | **Yes** | **No** (fails 3b; bad but norm-conforming) ← *Conflict* |
  | 5    | Kill trout   | Bad     | No              | **No**      | No (fails 1: certainty) |
  | 6    | Change forms | Neutral | ?               | Uncertain   | *Depends on norms* |  

  **Supports Clause 3a**: Cases 1 (bad outcome).  
  **Supports Clause 3b**: Case 3 (good outcome violating norm).  
  **Predictions for New Cases**:  
  - *Neutral outcome violating a norm*:  
    > *A librarian reorders books by size instead of Dewey Decimal, knowing it will confuse patrons. She violates library policy but is indifferent to confusion.*  
    → **Intentional** (via 3b: norm violation).  
  - *Bad outcome actively regretted*:  
    > *A surgeon must amputate a limb to save a life; she regrets the loss deeply but proceeds.*  
    → **Not intentional** (violates clause 2: active regret).  

  **Verdict to Abandon**: **Case 4 (Tomasz)** → *Not intentional*.  
  **Why?** The outcome is bad, but it aligns with the local norm. Under this principle, norm-conforming harms (even if bad) aren’t intentional unless they violate a *salient* norm. You must accept that the haulage firm’s culture *defeats* intentionality here.  

  ---

  ### **Principle 2: Deep Self-Concordance Account**  
  **Statement**: An agent brings about a side effect *intentionally* iff:  
  (1) They are **certain** it will occur,  
  (2) They **do not actively avoid it**,  
  (3) The outcome **aligns with or expresses** their core practical identity (values, endorsed commitments, or role-specific duties), *or*  
  (4) The outcome is **morally bad** *and* its production **reveals indifference to a value they ought to hold**.  

  #### **Fit with Your Verdicts**:  
  | Case | Outcome      | Deep Self-Concordance? | Your Verdict | Principle Predicts |
  |------|--------------|------------------------|-------------|-------------------|
  | 1    | Kill trout   | **No** (indifference to harm) | **Yes** | Yes (via 4: bad + indifference) |
  | 2    | Restore trout| No (indifferent to good) | **No**      | No                |
  | 3    | Raise profits| **Yes** (Sofia’s role *requires* environmental care; profit violates her ethos) | **Yes** | Yes (via 3: violates identity) |
  | 4    | Lose licenses| **Yes** (Tomasz’s role *expects* accepting driver losses) | **Yes** | **No** (via 3: *aligns* with role) ← *Conflict* |  
  | 5    | Kill trout   | No                     | **No**      | No (fails 1)      |
  | 6    | Change forms | ? (Role-neutral?)      | Uncertain   | *Depends on identity* |  

  **Supports Clause 3**: Case 3 (violates identity).  
  **Supports Clause 4**: Case 1 (bad + indifference).  
  **Predictions for New Cases**:  
  - *Neutral outcome with no identity link*:  
    > *A chef uses a new knife, knowing it will slightly blunt faster. She has no stance on knife maintenance.*  
    → **Not intentional** (fails 3–4).  
  - *Bad outcome actively regretted*:  
    > *A judge sentences a sympathetic defendant, regretting it but bound by law.*  
    → **Not intentional** (regret shows value alignment).  

  **Verdict to Abandon**: **Case 4 (Tomasz)** → *Not intentional*.  
  **Why?** Tomasz’s actions align with his role’s expectations (the "deep self" of his job). The bad outcome is *concordant* with his practical identity, so clause 4 doesn’t apply.  

  ---

  ### **Which Principle Should You Choose?**  
  - **Strengths of Principle 1**:  
    - Explains your **Case 3 verdict** (Sofia) via norm violation.  
    - Clarifies **Case 6 (Piotr)**: If changing forms violates an archival norm → intentional; if neutral → not.  
  - **Strengths of Principle 2**:  
    - Explains **Case 1 vs. 2 asymmetry** via bad+indifference vs. good+indifference.  
    - Handles **regret cases** elegantly.  

  **Your Conflict**: Both principles force you to abandon **Case 4 (Tomasz)**. This is the "safest" verdict to surrender because:  
  1. **Empirical Support**: Studies (e.g., Uttich & Lombrozo, 2010) show norm conformity *reduces* intentionality judgments for bad outcomes.  
  2. **Principled Cost**: Keeping Case 4 as "intentional" would require a disjunctive rule (e.g., "bad outcomes are intentional unless the agent is coerced"), undermining parsimony.  
  3. **Your Own Intuition**: Case 4’s local norm *should* matter (as in Case 3), but you’re letting valence override it. Consistency demands aligning these.  

  **Recommendation**: Adopt **Principle 1 (Hybrid Valence + Norm-Violation)**. It best captures your emphasis on contextual norms (Case 3) while preserving the core Knobe effect (Cases 1–2). Surrendering Case 4 is a modest price for systematicity.  

  ---

  ### **Final Note: Case 6 (Piotr)**  
  Your uncertainty is revealing! Principle 1 predicts:  
  - If Piotr’s role includes *preserving consistent numbering* (salient norm), changing forms is **intentional** (violates norm).  
  - If numbering is arbitrary (no norm), it’s **not intentional**.  
  This ambiguity mirrors real-world debates (e.g., whether neutral acts become intentional when *rule-governed*). Resolve it by asking: "Was there a *reason* not to change the numbers?" If yes → intentional; if no → not.  

  This framework turns your reflection into a discovery: Your intuitions point to norms and valence as joint drivers, with Case 4 as the outlier. Abandoning it achieves coherence without sacrificing your core insights.
