answer: |-
  ### Matched Pair of Scenarios  
  **Case A (Forfeiture):** Two construction firms, Alpha and Beta, bid for a government contract worth $1 million. Bidding proceeds in open increments of $100,000, starting from $0. Each bid commits the bidder to place the incremental amount into escrow. If a firm drops out, it forfeits its entire escrow (all prior bids) to the government, and the winner pays its total bid and receives the contract. After 10 rounds, Alpha has bid $1 million, and Beta must decide whether to bid $1.1 million or drop out. Both firms know the contract is worth exactly $1 million to them, and each believes the other is rational.  

  **Case B (Refund):** Identical to Case A, except if a firm drops out, it receives a full refund of its escrow. Only the winner pays its total bid and gets the contract. At the same $1 million bid by Alpha, Beta faces the same choice: bid $1.1 million or drop out.  

  ---

  ### Rational Behavior (Correct Beliefs, No Sunk-Cost Fallacy)  
  **Case A (Forfeiture):**  
  - **Stopping rule:** Bid if the immediate loss from dropping out exceeds the expected loss from bidding.  
  - **Why:** If Beta drops out now, it forfeits $900,000 (its last bid at $900,000). If Beta bids $1.1 million, Alpha faces forfeiting $1 million if it drops. Alpha, to avoid a $1 million loss, will likely bid $1.2 million. But if Alpha drops, Beta wins, paying $1.1 million for a $1 million contract—a $100,000 loss, which is better than losing $900,000. Escalation continues because dropping out locks in a large loss, while bidding offers a chance to shift a larger loss to the opponent. Rational players escalate beyond $1 million, stopping only when liquidity is exhausted.  

  **Case B (Refund):**  
  - **Stopping rule:** Drop out when the next bid exceeds the prize value ($1 million).  
  - **Why:** If Beta drops out, it gets its $900,000 escrow back and loses nothing. Bidding $1.1 million risks winning the contract at a $100,000 net loss ($1.1 million paid minus $1 million value). Since Beta can avoid all losses by dropping out, it stops immediately. The auction ends at $1 million.  

  ---

  ### Self-Justification Account Prediction  
  The self-justification (sunk-cost) story posits that players escalate to avoid admitting prior bids were wasted. It predicts:  
  - **Case A:** Escalation beyond $1 million, as dropping out forces acknowledgment of sunk costs as losses.  
  - **Case B:** No escalation, as refunds negate sunk costs—prior bids are not "wasted," so no psychological pressure to continue.  

  ---

  ### Discrimination Between Explanations  
  **The pair does not discriminate.** Both accounts predict:  
  - Escalation in **Case A** (due to structure *or* sunk-cost psychology).  
  - No escalation in **Case B** (due to structure *or* lack of sunk costs).  
  The outcomes are identical, so we cannot isolate whether structure or psychology drives escalation in Case A.  

  ---

  ### Key Feature, Breakage, and Bias-Theorist Defense  
  - **Feature doing the work:** The forfeiture rule (loser pays bids). This creates **asymmetric losses**: Dropping out imposes a large immediate loss, while bidding passes the burden to the opponent.  
  - **What breaks if removed?** Without forfeiture (Case B), asymmetric losses vanish. Bidders face symmetric, standard auction rules, eliminating structural escalation.  
  - **Bias-theorist defense:** A proponent of "escalation is always a bias" would argue that real-world players in Case A *do not* grasp the game-theoretic structure and instead escalate due to sunk-cost psychology. They might cite experiments where players escalate despite simplified rules, attributing this to universal psychological biases, not rational calculation.  

  ---

