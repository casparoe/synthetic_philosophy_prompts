  I'm trying to get clear on the problem of old evidence before I write anything about it, and I dont want to read another paper on it until I know what I'm actually asking of a solution. So give me the spec first: the desiderata any adequate account has to meet. What are the cases it has to get right (the episode where a theory plainly did get credit for evidence that was already on the books — Mercury's perihelion and general relativity is the one everyone reaches for), the intuitions it has to preserve (a theory built to fit the data doesn't get a free pass just for fitting it; my credence in a theory shouldn't be held hostage to the order in which I happened to learn things; learning that my theory entails something I already knew should still count for something, or shouldn't it?), and the distinctions it can't collapse (accommodation vs prediction, the agent's perspective vs some more objective notion of support). For each item, say what's behind it, because I want to see which of these are genuine requirements and which are just house rules of one camp — likelihoodists, orthodox conditionalizers, people who treat novel prediction as a separate epistemic virtue. Then the part I most want: flag any pair you think can't be satisfied together. My suspicion is that 'old evidence can confirm' and 'confirmation is a function of the agent's actual credences at the time' can't both hold, and that the standard escapes (pretending I didn't know e, or switching to a measure that ignores priors) each just buy one desideratum by giving up another — tell me if that's a real trilemma or if I'm muddling what gets relativized to whom. Short scorecard at the end if you like, but the list is the deliverable, and no citations, I'm not chasing down who said what.
