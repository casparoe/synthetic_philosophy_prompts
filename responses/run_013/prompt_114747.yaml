answer: |-
  Here's a breakdown of the core desiderata for solving the "problem of old evidence" in confirmation theory, structured as requested. The key tension you suspect is indeed central.

  **The Core Desiderata:**

  1.  **Old Evidence Can Confirm (OEC):** *Requirement*: An account must allow that evidence known *before* a theory is formulated can genuinely confirm (increase the rational credence in) that theory. *Behind it*: The historical reality of scientific practice (e.g., GR and Mercury's perihelion; also, Neptune's orbit and Newtonian perturbations, structure of Benzene and Kekulé's model). Denying this seems to falsify scientific history and intuition about successful explanations.
  2.  **Agent-Centered Credences (ACC):** *Requirement*: Confirmation must be relativized to the *agent's actual epistemic state* at the time of evaluating the theory, including their background knowledge (`K`) and crucially, their *actual credence* in the evidence (`P(e) = 1`). *Behind it*: Bayesian orthodoxy (conditionalization requires current credences), subjectivist interpretations of probability, and the idea that confirmation is about how *this agent* should update *their* beliefs.
  3.  **No Credit for Mere Accommodation (NCMA):** *Requirement*: A theory explicitly constructed *to fit* known evidence `e` should not gain significant (or any) confirmation *just* from fitting `e`. *Behind it*: Intuition about ad hoc-ness, circularity, and the epistemic value of *novel prediction*. Avoiding this is a core motivation for valuing prediction over accommodation. (Likelihoodists & Predictionists emphasize this).
  4.  **Entailment Boosts Credence (EBC):** *Requirement*: Learning that a theory `T` logically entails evidence `e` (i.e., `T |= e`) *should*, under some circumstances, be confirmatory for `T`, *even if `e` is already known*. *Behind it*: Intuition that explanatory power matters. Discovering `T` explains `e` seems epistemically significant and should rationally impact belief in `T`, not just be a logical triviality. (Contrasts sharply with NCMA).
  5.  **Temporal Order Irrelevance (TOI):** *Requirement*: The *order* in which an agent learns `T` and `e` should not fundamentally alter the *final* rational credence in `T` given `e` and other background `K`, once all information is in. *Behind it*: Intuition that rational belief should depend on the total evidence and logical relations, not historical accident of learning order. (Objective Bayesians/Logical Interpretations emphasize this).
  6.  **Distinguish Accommodation & Prediction (DAP):** *Requirement*: The account must provide a non-arbitrary distinction between prediction (using `T` to anticipate `e` before `e` is known/established) and accommodation (adjusting `T` to fit known `e`), and ideally explain why prediction is often (but perhaps not always) epistemically superior. *Behind it*: Captures a fundamental distinction in scientific methodology and intuition. (Predictionists' core demand).
  7.  **Avoid Trivialization (AT):** *Requirement*: The confirmation measure should not render confirmation trivial or ubiquitous for old evidence. If `P(e)=1`, standard conditional probability (`P(T|e) = P(T & e)/P(e) = P(T)`) shows no change. Any solution must avoid making *every* entailment of known `e` confirm *every* theory entailing `e` by default. *Behind it*: Need for a non-trivial, discriminating notion of confirmation. (Core Bayesian formal challenge).

  **The Central Conflicts & Your Trilemma:**

  *   **The Core Trilemma (OEC + ACC → ¬AT / Requires Fudging ACC):** You are exactly right. This is the heart of the problem.
      *   **OEC + ACC → Contradiction?:** If `P(e) = 1` (ACC) and confirmation requires `P(T|e) > P(T)`, then `P(T|e) = P(T & e)/P(e) = P(T & e)/1 = P(T & e)`. Since `T & e` entails `T`, `P(T & e) <= P(T)`. Equality holds only if `P(T | e) = 1` (which is rare). So `P(T|e) <= P(T)`. **Contradicts OEC.**
      *   **Escapes Require Relaxing ACC:** Standard solutions *must* abandon strict ACC to satisfy OEC and AT:
          *   **Counterfactual Credence (e.g., Garber, Jeffrey, Niiniluoto):** Calculate `P(T|e)` using the credence function the agent *would have had* if they *didn't know* `e` (`P_old(e) < 1`). *Satisfies:* OEC, NCMA (if counterfactual prior is pre-accommodation), EBC (learning entailment changes the counterfactual comparison), TOI (in principle), DAP (prediction uses actual `P_old`, accommodation uses counterfactual), AT. *Violates:* Strict ACC (uses hypothetical credences, not actual ones).
          *   **Abject Knowledge (e.g., Zynda):** Remove `e` from background knowledge `K` when evaluating `T`'s support by `e`. Treat `e` as "new" relative to a reduced `K'`. *Satisfies/Violates:* Similar to Counterfactual Credence regarding ACC.
          *   **Non-Bayesian Measures (e.g., Likelihood Ratio with `P(e|T)` vs. `P(e|~T)`):** If `P(e|T)` is high and `P(e|~T)` is low, LR > 1 suggests confirmation, even if `P(e)=1`. *Satisfies:* OEC, EBC, TOI (in principle), AT (can be non-trivial). *Violates:* ACC (ignores the agent's actual certainty; measure isn't directly about *change* in credence), potentially NCMA (a theory built solely to fit `e` might still have `P(e|T)=1` and `P(e|~T)` low, getting credit) unless `P(e|~T)` is handled carefully.

  *   **NCMA vs. EBC:** There's inherent tension here. NCMA says building `T` to fit `e` shouldn't confirm. EBC says learning `T` entails `e` *should* confirm. How to distinguish the epistemically inert case (pure accommodation) from the confirmatory case (discovering an entailment)? Solutions often rely on:
      *   **Mechanism of Theory Construction:** If `e` directly caused `T`'s structure, no confirmation (NCMA). If `T` was developed independently and entailment discovered later, confirmation (EBC). (Problem: Often murky).
      *   **Counterfactual Robustness:** Could `T` have been different if `e` were different? If yes (prediction), confirmation. If no (accommodation), less/none. (Links to DAP).
      *   **`P(e|~T)` Handling:** In Likelihoodist approaches, the key is whether `T` makes `e` much more probable than the alternatives (`~T`) did *before* `e` was known/accommodated. Accommodation might involve setting `P(e|~T)` artificially high post-hoc. Counterfactual approaches bake this into the prior.

  *   **TOI vs. ACC (Nuanced):** Strict ACC *entails* that order matters because credences evolve via conditionalization on the learning sequence. TOI demands that *final* credences depend only on total evidence. They conflict if "final rational credence" under TOI is defined independently of the actual updating path. Solutions aiming for TOI often imply a more "objective" or "logical" prior than strict subjectivist ACC allows.

  **The Scorecard of Tensions:**

  | Desideratum          | Conflicts Most With | Standard Escape Sacrifices |
  | :------------------- | :------------------ | :------------------------- |
  | **OEC (Old Ev Confirms)** | **ACC (Agent Credences)** | ACC (Counterfactual/Non-B measures) |
  | **ACC (Agent Credences)** | **OEC, TOI**        | OEC (Counterfactual/Non-B) / TOI (Objective Priors) |
  | **NCMA (No Free Accommodation)** | **EBC (Entailment Boosts)** | Requires careful distinction (e.g., counterfactual priors, `P(e|~T)` assessment) |
  | **EBC (Entailment Boosts)** | **NCMA (No Free Accommodation)** | Requires careful distinction |
  | **TOI (Order Irrelevance)** | **ACC (Order Dependence)** | ACC (Implies objective/logical priors) |
  | **DAP (Distinguish A&P)** | -                   | Often satisfied by solutions handling NCMA/EBC/OEC |
  | **AT (Avoid Triviality)** | **ACC (if strict)** | ACC (via Counterfactual/Non-B measures) |

  **Conclusion on Your Trilemma:** Your suspicion is correct. **OEC and strict ACC are fundamentally incompatible within standard Bayesian conditionalization** due to the `P(e)=1` problem. Any solution *must* relax ACC (by using counterfactual credences, removing `e` from `K`, or switching confirmation measures) to satisfy OEC and avoid triviality (AT). The choice between escapes involves trade-offs regarding how severely ACC is violated, how well NCMA/EBC are distinguished, and adherence to TOI. There is no solution satisfying all desiderata simultaneously without significant conceptual revision. The core tension is between the historical/epistemic reality of OEC and the formal structure of Bayesian updating under certainty (ACC).
