  Then the incentive is to be surprised collectively. They can try to coordinate to predict "no quiz" on every day. But they might not, because they might think the quiz will happen on a particular day.

  In the backward induction, they will be led to predict "quiz" on Friday if it hasn't happened, etc.

  We'll go with the group surprise condition.

  Final Plan:

  Deterministic Condition:
  - The Announcer has chosen a day (e.g., Wednesday) and sealed it.
  - The class is told: if on the quiz day, at least 9 of you predicted "no quiz", then you win as a group (and we'll have a prize). Otherwise, you lose.

  Random Condition:
  - The day is chosen randomly and sealed.
  - Same win condition.

  Timeline:

  0:00-0:10: Introduction
  - Explain the surprise quiz paradox.
  - Explain the setup: we will run two simulations. In each, there will be a quiz on one day. You will predict each day whether the quiz is that day.
  - Win condition: on the day of the quiz, if a majority of the class (at least 9) predicted "no quiz" for that day, then the class wins a prize (e.g., candy). Otherwise, we move on.

  0:10-0:30: Backward induction discussion.
  - Step by step, from Friday to Monday, we reason that the quiz cannot occur.

  0:30-0:35: Setup for deterministic condition.
  - "I have chosen a day to maximize the chance of surprise. It's sealed in this envelope."

  0:35-0:55: Run the week (Monday to Friday).
  - For each day:
     - Students write their prediction for that day (quiz or no quiz) on an index card.
     - Collect and count the predictions. Record the number of "quiz" predictions on the board.
     - If this is the chosen day, then:
          - Give the quiz question.
          - Check if the class is surprised (number of "quiz" predictions <9). If yes, they win for this condition.
     - If not, say "no quiz today" and move on.

  0:55-1:00: Results for deterministic condition.

  1:00-1:05: Setup for random condition.
  - Roll a die to choose the day (1=Mon,2=Tue,3=Wed,4=Thu,5=Fri). Seal it.

  1:05-1:25: Run the week for random condition.

  1:25-1:30: Results for random condition and debrief.
  - Compare the two conditions: were they surprised in both? Why or why not?
  - Highlight the role of common knowledge and the method of selection.

  What if the quiz happens on Friday in the deterministic condition and they are not surprised? Then they lose. We can discuss why: because the backward induction told them to expect it on Friday.

  What if in the random condition, they are surprised on an early day? Then they win. We can discuss why the backward induction might not bite under randomness.

  In the debrief, we map:
  - The backward induction steps to the days.
  - The win in the deterministic condition on an early day corresponds to the breakdown of the induction (because the students ruled out later days, but the quiz happened earlier).
  - The common knowledge: did everyone in the room truly believe that everyone else had done the backward induction?

  Finally, the honest parts:

  What will go wrong:
  - The backward induction discussion might be too abstract. Some students might not get it. Solution: use the board and go slowly.
  - In the deterministic run, the students might not follow the backward induction in their predictions. They might predict "quiz" on Monday because they think the Announcer will try to catch them off guard. Then if the quiz is on Monday and they predicted it, they are not surprised and they lose. Solution: in the debrief, point out that the backward induction requires perfect rationality and common knowledge, which might not hold.
  - Time: we might run over. Solution: be strict on time. Each day in the simulation should take no more than 3 minutes.
  - Shouting match: if there is disagreement, remind them that we are testing a logical argument, not blaming anyone.

  What the activity cannot reproduce:
  - The absolute confidence in the backward induction that the paradox assumes. In the activity, the students might not be 100% sure of the reasoning, so they might not completely rule out Friday. They might assign a small probability. In the paradox, it's all or nothing.
  - The common knowledge condition: in the room, it's hard to ensure that everyone knows that everyone knows ... ad infinitum.

  We will have to state these limitations.

  This plan should meet your goals. Good luck!
answer: |-
  Below is a complete, runnable plan for your 90-minute session on the surprise examination paradox. It's designed to make the group "live through" the argument, confront the collapse of their reasoning, and independently discover the roles of common knowledge and the announcer's method of selection (deterministic vs. random). The plan uses no real money—instead, it leverages **group prestige** (e.g., collective bragging rights, a "Victory Token" for the whiteboard) and **light competition** (e.g., identifying "most insightful reasoner") to motivate engagement.

  ### **Core Assumptions and Version of the Paradox**
  - **Version Staged**: The classic *five-day surprise examination paradox* (Monday–Friday), with a focus on **backward induction** and **common knowledge**.
  - **Assumptions on the Announcer**:
    - **Deterministic Condition**: The announcer (you) chooses a fixed day in advance *with the intent to surprise*. You are a rational, strategic agent aiming to maximize surprise.
    - **Random Condition**: The announcer commits to a genuinely random selection method (e.g., dice roll) *with no intent to surprise*. You are a neutral arbiter.
  - **Key Elements Explored**: 
    - Common knowledge (Do all students know that all know the announcement?).
    - Announcer’s agency (Does backward induction fail if the choice is random?).

  ---

  ### **Materials**
  1. **Whiteboard**: For tracking days, predictions, and student reasoning.
  2. **Index Cards**: 80+ cards (5 per student for predictions, plus extras).
  3. **Sealed Envelopes**: Two envelopes:
     - **Envelope A (Deterministic)**: Contains a card with your pre-chosen day (e.g., Wednesday).
     - **Envelope B (Random)**: Contains a card with a day selected by dice roll (done in front of students).
  4. **Dice or RNG**: A physical die (d5 or d6 re-rolled on 6) or a phone app for random selection.
  5. **Projector (Optional)**: Only for debrief slides (names/literature). Not used during the activity.
  6. **Timer**: For strict timekeeping.
  7. **"Victory Token"**: A physical object (e.g., a trophy, book, or printed certificate) awarded to the group if they collectively achieve surprise. This symbolizes group prestige.
  8. **Quiz Question**: A simple, fun question (e.g., "What is 2+2?") to represent the "exam."

  ---

  ### **Setup and Rules**
  - **Group**: 16 students (no fixed roles; all are "students" reasoning collectively).
  - **Announcer**: You (instructor). You make announcements and enforce rules.
  - **Win Condition**: 
    - **Group Victory**: If the class is "surprised" (≥9 students predict "no quiz" on the quiz day), they earn the Victory Token. This incentivizes collective reasoning.
  - **Prediction Rules**:
    - Each morning (round), students privately write "quiz" or "no quiz" for that day on an index card.
    - Cards are collected and tallied publicly (record counts on the whiteboard).
    - **No discussion during predictions** to simulate private belief.
  - **Quiz Rules**:
    - The quiz happens only if the announcer declares it (based on the envelope).
    - On the quiz day, the quiz question is asked—correct answers earn public praise (not points), to avoid distraction.
  - **Critical Constraints**:
    - **Common Knowledge Emphasized**: Openly state: "Everyone hears all announcements, and everyone knows that everyone else hears them."
    - **Announcer’s Integrity**: In the deterministic round, stress your intent to surprise. In the random round, prove randomness (e.g., show dice rolls).

  ---

  ### **Sequence of Rounds (90-Minute Timeline)**
  **Total Time**: 90 minutes  
  **Goal**: Students use backward induction to "prove" the exam is impossible, then experience its occurrence. Random condition tests if surprise survives chance.

  #### **Part 1: Introduction (10 min)**
  - **0:00–5:00**: Frame the session.  
    *Script*: "This week, I’ll give one surprise exam—you won’t know the day until it happens. Each morning, you’ll predict if it’s today. If ≥9 of you are wrong on the exam day (i.e., you predicted 'no quiz'), you win the Victory Token. The token stays on display all term—this is about group prestige."  
    *Whiteboard*: Write days (Mon–Fri) and rules.
  - **5:00–10:00**: Explain backward induction conceptually.  
    *Script*: "Some argue this exam is impossible. Why? Imagine Friday: if it hasn’t happened by Thursday, you’d expect it Friday—so not a surprise. So Friday is ruled out. Then Thursday? If not by Wednesday, you’d expect it Thursday—ruled out. And so on. By backward induction, no day works. Today, you’ll test this."

  #### **Part 2: Deterministic Condition (40 min)**  
  *Announcer pre-chooses a day (e.g., Wednesday) to maximize surprise. Envelope A is sealed and visible.*
  - **10:00–15:00**: **Monday Predictions**.  
    *Script*: "Make your first prediction: Will the exam be today? Write 'quiz' or 'no quiz'—no talking."  
    *Activity*: Collect cards, tally (e.g., "5 quiz, 11 no quiz"). Announce: "No exam today. Envelope remains sealed."  
    *Whiteboard*: Record prediction counts under Monday.
  - **15:00–20:00**: **Tuesday Predictions**.  
    *Script*: "Predict for Tuesday. Remember: no exam Monday, so it must be Tue–Fri."  
    *Activity*: Collect/tally cards. Announce: "No exam today."  
    *Whiteboard*: Record counts. Ask: "What does ‘no exam Tuesday’ imply?" Elicit reasoning (e.g., "Now only Wed–Fri left").
  - **20:00–25:00**: **Wednesday Predictions**.  
    *Script*: "Predict for Wednesday. If you rule out Friday, does that change things?"  
    *Activity*: Collect/tally. **Trigger key discussion**: "Can Friday work? If we get to Thursday with no exam, would Friday be a surprise?" Guide them to conclude: "No—so Friday is impossible."  
    *Whiteboard*: Record reasoning: "Friday ruled out → only Wed/Thu left."  
    *Announce*: "No exam today." (If Wed is not your chosen day.)
  - **25:00–30:00**: **Thursday Predictions**.  
    *Script*: "Predict for Thursday. If Friday is impossible, what does ‘no exam Wednesday’ imply?"  
    *Activity*: Collect/tally. Students should deduce: "If no exam Wed, then only Thu left → Thursday can’t be a surprise."  
    *Whiteboard*: Record: "Thursday ruled out? Only Friday left, but already impossible. Exam can’t happen!"  
    *Announce*: "No exam today." (If Thu is not chosen).
  - **30:00–35:00**: **Friday Predictions**.  
    *Script*: "Predict for Friday. Backward induction says it’s impossible—but what if it happens?"  
    *Activity*: Collect/tally. Most will predict "quiz" (confident in induction).  
    *Announce*: **Reveal Envelope A and give the exam** (e.g., if Wed was chosen, announce: "Exam was Wednesday! You predicted: [show Wed tally]. Were you surprised?").  
  - **35:00–40:00**: **Immediate Reaction**.  
    *Script*: "You concluded the exam couldn’t happen—but it did. How?"  
    *Activity*: Let students react. Ask: "Where did backward induction fail? Did everyone truly believe it?"  
    *Whiteboard*: Highlight the winning/losing prediction counts.

  #### **Part 3: Random Condition (30 min)**  
  *Announcer uses dice to choose the day fairly. Envelope B is sealed in front of students.*
  - **40:00–45:00**: **Setup Randomness**.  
    *Script*: "Now, I’ll roll a die to pick the day randomly. I’m not trying to surprise you—it’s pure chance." Roll dice publicly (e.g., 1=Mon, 2=Tue, etc.), seal day in Envelope B.  
  - **45:00–60:00**: **Run the Week (Mon–Fri)**.  
    *Activity*: Repeat prediction rounds (as in Part 2), but **skip discussions**. Only:  
    - Predict → tally → announce "no exam" or "exam today."  
    - If exam occurs, check surprise (≥9 "no quiz" predictions).  
    *Key*: Students often predict "no quiz" more, as randomness weakens backward induction.
  - **60:00–65:00**: **Reveal and Compare**.  
    *Script*: "Were you surprised this time? Did randomness change your reasoning?"  
    *Whiteboard*: Contrast tallies (deterministic vs. random).

  #### **Part 4: Structured Debrief (20 min)**  
  *Map the experience to the paradox. Use whiteboard to summarize.*
  - **65:00–70:00**: **What Happened?**  
    - *Deterministic Round*:  
      - Backward induction: Students ruled out days (Fri → Thu → Wed) → concluded impossibility.  
      - Collapse: Exam occurred earlier (e.g., Wed) when some still allowed doubt.  
      - Why? Common knowledge failed: Not everyone believed others accepted the induction.  
      - Whiteboard: "Induction Step = Ruling out a day. Collapse = Exam before 'last possible day.'"  
    - *Random Round*:  
      - Backward induction weakened: Students couldn’t rule out days absolutely (randomness = uncertainty).  
      - Surprise more likely: Even late days (e.g., Fri) could be surprises if probabilities felt "open."  
      - Whiteboard: "Random choice → induction requires certainty → but chance prevents certainty."  
  - **70:00–80:00**: **Why It Matters**  
    - *Common Knowledge*: "Did everyone trust that all others completed the induction? Or did some doubt peers?" (Link to Part 2’s collapse.)  
    - *Announcer’s Role*: "In deterministic, I aimed to surprise—did that influence your trust? In random, I removed intent—did that change the logic?"  
    - *Structural Takeaway*: "The paradox isn’t about stupidity—it’s about knowledge requiring shared, infinite recursion (common knowledge) and collapsing under perfect prediction."  
  - **80:00–85:00**: **Name the Concepts (Optional)**  
    - Introduce terms: "Backward induction," "common knowledge," "strategic vs. random chooser."  
    - Reference literature: Quine’s formulation (deterministic), probabilistic critiques (random).  
  - **85:00–90:00**: **Award Victory Token & Close**  
    - If group achieved surprise in either round, award the token.  
    *Final Script*: "You felt the paradox: Logic said ‘impossible,’ reality said ‘possible.’ That gap is where knowledge, time, and announcements interact."

  ---

  ### **Predictable Challenges and Recovery Plan**  
  1. **Backward Induction Stalls (Part 2)**:  
     - *Risk*: Students don’t rule out days (e.g., skip Friday).  
     - *Recovery*: At Wednesday, ask: "If we get to Thursday with no exam, is Friday still surprising?" If stuck, "simulate" Friday: "Imagine it’s Thursday night—what would you think?"  

  2. **Induction Triggers Early**:  
     - *Risk*: On Monday, students declare, "It can’t happen at all!"  
     - *Recovery*: Lean in: "Great! But let’s test it day-by-day anyway. Record your prediction—prove it."  

  3. **Deterministic Round "Falls Flat"**:  
     - *Risk*: Exam on Friday with no surprise (students predict "quiz").  
     - *Recovery*: Use it! "You weren’t surprised because backward induction 'worked'? But did it—the exam still happened!" Debrief: "Induction 'works' only if we ignore its conclusion (impossibility)."  

  4. **Shouting Matches**:  
     - *Risk*: Debate over "flawed reasoning."  
     - *Recovery*: Redirect: "Don’t blame people—blame the structure. What does this tell us about knowledge?"  

  5. **Time Shortage**:  
     - *Risk*: Random round runs long.  
     - *Recovery*: Skip a day (e.g., start at Wednesday) or use fewer days (e.g., 3-day week).  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Infinite Recursion of Common Knowledge**: Students can’t *feel* the infinite "I know that you know that I know..." chain. They’ll grasp it intellectually, but the visceral "turtles all the way down" unease must be stated:  
    *Script*: "In the paradox, common knowledge requires endless recursion—but humans can’t hold that. We approximate it, and the collapse happens where approximation fails."  

  - **Perfect Rationality**: Real students doubt peers or second-guess—unlike idealized agents. Highlight: "The paradox assumes perfect reasoners. Your doubts made it real—and showed why the assumption crumbles."  

  - **Temporal Fixed-Point**: The "shock" of the exam happening *despite* induction is reproducible, but the abstract tension between time and knowledge (e.g., "Friday’s future certainty poisoning Thursday") is subtler. State: "Time forces knowledge to evolve, but announcements pretend it’s static—that mismatch is the heart of the paradox."

  ---

  This plan forces students to confront the paradox experientially. They’ll reason, fail, and discover the nuances of common knowledge and chooser intent—before you name them. The Victory Token and competitive framing keep it engaging without financial incentives. Run it tightly, and embrace the messiness; it’s where the learning lives.
