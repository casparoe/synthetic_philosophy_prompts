  - Chocolate type (hard):
     - Line A: 10/50 = 20%   [A produces less chocolate]
     - Line B: 90/100 = 90%  [B produces more chocolate] -> B better in chocolate.

  Overall:
     A: 100/150 = 66.7%
     B: 120/150 = 80% -> B better overall.

  This is the same as our first dataset.

  Given the complexity, I propose to:

  - In the activity, have only one reversal in the first part (using shifts) and then in the second part, when we break by type, we see that within each type, the lines have the same success rate. This will resolve the paradox and show that the type was the confounder.

  We can then discuss how the judgment of what to break by is important.

  So let's design the activity accordingly.

  Materials for the first round (shift factor) for the two lines:

  - Cards for each shift and each line, but we will give them to groups.

  Activity Structure:

  Participants are divided into three teams (or more if needed, but for 14, maybe three teams of 4-5).

  Round 1: The Shift Report

  - Each team is given data for the two shifts (morning and evening) for both lines. They are told: "As factory managers, you must decide which production line to recommend for expansion. You have data from the last month broken by shift."
  - Each team gets a sheet with:

     Morning Shift:
        Line A: 40 good out of 50
        Line B: 10 good out of 50

     Evening Shift:
        Line A: 5 good out of 50
        Line B: 45 good out of 50

  - Teams are asked to compute the success rate for each line in each shift and overall, and then make a recommendation.
  - We expect them to see that in the morning, A is better (80% vs 20%), in the evening B is better (90% vs 10%), and overall B is better (55% vs 45%).
  - Teams might recommend B because overall it is better, or might recommend keeping both and using A in the morning and B in the evening.

  Round 1 scoring: Teams get points for correct calculations and for their recommendation. But we want them to experience the reversal, not necessarily to get it right.

  Instead, we can have them bet on which line is better overall and per shift.

  But to avoid calculation, we can provide the rates? But we want them to calculate.

  Given time, we can provide the numbers and have them calculate.

  Round 2: The Type Report

  - We now tell them: "After your recommendation, the quality control department tells you that the type of biscuit matters. Here is the same data broken by biscuit type (plain and chocolate)."
  - Now we give them the data broken by type, but this time within each type, the lines have the same success rate. But note, we cannot use the same overall data because we already have it. So we use a different dataset for the same month? We say: "Here is data for the same month but broken by type."

  Data for Round 2:

  - Plain biscuits:
     - Line A: 25 out of 50 -> 50%
     - Line A: 15 out of 30 -> 50% (wait, Line B)
     - Let's do: 
          Line A: 30 out of 60 -> 50%
          Line B: 20 out of 40 -> 50%

  - Chocolate biscuits:
     - Line A: 15 out of 40 -> 37.5%
     - Line B: 25 out of 60 -> 41.7% -> not the same.

  We want the same within type. Let's do:

  - Plain type:
     - Line A: 20 out of 40 = 50%
     - Line B: 30 out of 60 = 50%
  - Chocolate type:
     - Line A: 25 out of 60 = 41.7%
     - Line B: 25 out of 60 = 41.7% -> same.

  But overall:
     A: 20+25=45 out of 40+60=100 -> 45%
     B: 30+25=55 out of 60+60=120 -> approximately 45.8% -> not the 55% we had before.

  We need to match the overall of the first dataset. In the first dataset, overall for A:45/100=45%, for B:55/100=55%. So for type, we can split the 100 for A and 100 for B into type.

  For Line A: 45 good out of 100.
  For Line B: 55 good out of 100.

  Now, within types, we want them to be the same.

  Suppose for plain type, both lines have the same success rate, say 60%.
  For chocolate type, both have the same success rate, say 40%.

  Then we need to split the 100 for A into plain and chocolate such that:
     plain_A + chocolate_A = 100
     (plain_A * 60%) + (chocolate_A * 40%) = 45

  Similarly for B:
     plain_B + chocolate_B = 100
     (plain_B * 60%) + (chocolate_B * 40%) = 55

  Let's solve for A:
     Let x = number of plain biscuits for A
     y = number of chocolate for A
     x + y = 100
     0.6x + 0.4y = 45

     0.6x + 0.4(100-x) = 45
     0.6x + 40 -0.4x = 45
     0.2x = 5
     x = 25
     y = 75

  So for Line A:
     Plain: 0.6 * 25 = 15 good out of 25
     Chocolate: 0.4 * 75 = 30 good out of 75
     Total good = 15+30=45.

  For Line B:
     x + y = 100
     0.6x + 0.4y = 55
     0.6x + 0.4(100-x) = 55
     0.6x +40 -0.4x =55
     0.2x =15
     x=75
     y=25

  So for Line B:
     Plain: 0.6 *75 =45 good out of 75
     Chocolate: 0.4 *25 =10 good out of 25
     Total good=45+10=55.

   So the data for Round 2 by type:

  - Plain type:
     - Line A: 15 good out of 25 trials -> 60%
     - Line B: 45 good out of 75 trials -> 60%
  - Chocolate type:
     - Line A: 30 good out of 75 trials -> 40%
     - Line B: 10 good out of 25 trials -> 40%

  And within each type, both lines have the same success rate.

  Teams will see that within each type, the lines have identical performance, so the difference in overall must be due to the type distribution: Line A faced more chocolate biscuits (hard) and Line B faced more plain biscuits (easy).

   This will resolve the paradox.

   So the activity flow:

  1. Introduction (5 mins): Explain the factory scenario and the task. Divide into teams (3-4 teams).

  2. Round 1: Shift data (25 mins)
     - Hand out the shift data (for both shifts for both lines).
     - Teams calculate the success rates per shift and overall.
     - They then make a recommendation: which line is better overall? and/or which line should be expanded?
     - Each team reports.

  3. Round 2: Type data (25 mins)
     - Hand out the type data.
     - Teams calculate the success rates per type and overall (which should match the first overall).
     - They then see that within each type, the lines have the same success rate.
     - They are asked: What caused the overall difference then?
     - Teams report.

  4. Discussion and debrief (35 mins)
     - We discuss how in round 1 we saw a reversal (per shift one line was better in each, but overall the other was better).
     - In round 2, we saw that when we broke by type, the difference disappeared, showing that the type of biscuit was the real driver.
     - The judgment call: why did we break by shift first? Why type? It depends on what we think is the cause. The arithmetic doesn't tell us which grouping is right.

  Timeline (90 mins):
  - 0-5: Introduction
  - 5-30: Round 1 (25 mins)
  - 30-55: Round 2 (25 mins)
  - 55-90: Discussion (35 mins)

  Materials to prepare:
  - For Round 1: Team handouts (3-4 copies) with:
     "Morning Shift:
        Line A: 40 good biscuits out of 50 produced
        Line B: 10 good biscuits out of 50 produced
     Evening Shift:
        Line A: 5 good biscuits out of 50 produced
        Line B: 45 good biscuits out of 50 produced"

  - For Round 2: Team handouts with:
     "Plain Biscuits:
        Line A: 15 good out of 25 produced
        Line B: 45 good out of 75 produced
     Chocolate Biscuits:
        Line A: 30 good out of 75 produced
        Line A: 10 good out of 25 produced"

     [Note: for Line B in chocolate, it's 10 good out of 25]

  - Calculators might be provided for those who need.
  - Scoreboard for points if we are scoring (optional).

  Scoring (optional): 
  - In each round, teams get points for correct calculations and for the best reasoning.

  What might go wrong:
  - Participants might get stuck on the calculations. Have a facilitator (you) to help teams.
  - In round 1, teams might not notice the reversal. In the debrief, you can highlight it.
  - In round 2, teams might not see that the overall is the same as round 1. Emphasize that it's the same month's data.
  - Participants might not see the point. The debrief should be clear.

  The piece that cannot be reproduced by the activity: The activity shows that grouping by different factors changes the interpretation, but the deep point that the choice of grouping depends on causal knowledge (e.g., we group by shift because we think the time of day might affect performance, or by type because we think the difficulty of the biscuit matters) cannot be fully felt without discussion. You will have to explain that the numbers don't tell us which grouping is causal; that requires domain knowledge.

  Instructions for the facilitator (you) are as above.

   Let's write the instructions for the evening.
answer: |-
  ### The Biscuit Factory: An Evening of Decisions  
  **Objective:** Participants experience how grouping data can flip conclusions, then flip again when a third factor appears. They'll learn that arithmetic is easy, but judging *how* to group data (based on causality) is hard.  

  **Setup (60 mins at home):**  
  1. **Print materials:**  
     - **Team booklets (3 copies):** Each contains 3 data cards (see below) and a "Decision Sheet" for recording conclusions.  
     - **Factory tokens:** 30 tokens (buttons, coins, or printed circles) in a bag.  
     - **Scoreboard:** A3 sheet titled "Factory Leaderboard" with team names and columns for Rounds 1, 2, and Total.  
     - **Prize:** A visible tin of biscuits.  
     - **Calculation aids (optional):** Simple % cheat sheets (e.g., "To find %: Good biscuits ÷ Total biscuits × 100").  

  2. **Prepare data cards:**  
     - **Card 1 (Shift data):**  
       ```  
       MORNING SHIFT:  
       Line A: 48 good biscuits out of 60 produced  
       Line B: 12 good biscuits out of 60 produced  
       EVENING SHIFT:  
       Line A: 6 good biscuits out of 60 produced  
       Line B: 54 good biscuits out of 60 produced  
       ```  
     - **Card 2 (Combined data):**  
       ```  
       COMBINED (Morning + Evening):  
       Line A: 54 good biscuits out of 120 produced  
       Line B: 66 good biscuits out of 120 produced  
       ```  
     - **Card 3 (Biscuit type data):**  
       ```  
       PLAIN BISCUITS (easy to make):  
       Line A: 42 good out of 70 produced  
       Line B: 18 good out of 30 produced  
       CHOCOLATE BISCUITS (hard to make):  
       Line A: 12 good out of 50 produced  
       Line B: 48 good out of 90 produced  
       ```  

  3. **Room setup:**  
     - Tables for 3 teams (4-5 people each).  
     - Tokens and booklets at each table.  
     - Scoreboard and biscuit tin at the front.  

  ---

  ### Flow of the Evening (90 mins total)  

  #### 0. Introduction (5 mins)  
  - **Set the scene:** "Welcome to the Biscuit Factory! You’re production managers deciding which assembly line (A or B) is better. Teams will earn tokens for good decisions, and the winning team gets this tin of biscuits. No maths expertise needed—just your judgement!"  
  - **Assign roles:** Split into 3 teams. Each picks a facilitator (reads instructions) and a recorder (writes decisions).  
  - **Calm nerves:** "If numbers worry you, focus on the ‘good biscuits vs total’—that’s all we need. Your team has your back!"  

  #### 1. Round 1: The Shift Puzzle (25 mins)  
  - **Task:** Teams decide which line is better using **Card 1 (Shift data)**.  
  - **Rules:**  
    - Calculate success rates for Morning/Evening shifts separately.  
    - Record on Decision Sheet:  
      *"In Morning, Line ____ is better. In Evening, Line ____ is better."*  
    - **Earn tokens:** 2 tokens if all agree on shift-level conclusions.  
  - **How reversal happens:** Teams see Line A wins in Morning, Line B wins in Evening. Most will declare, "It depends on the shift!" *No one looks at combined data yet.*  

  #### 2. Round 2: The Combined Surprise (20 mins)  
  - **Task:** Teams now use **Card 2 (Combined data)**.  
  - **Rules:**  
    - Calculate overall success rates for Lines A and B (ignore shifts).  
    - Record: *"Overall, Line ____ is better."*  
    - **Earn tokens:** 3 tokens if correct (Line B wins: 55% vs 45%).  
  - **The sting:** Teams now face the reversal. When they combined shifts, Line B (55%) beats Line A (45%)—opposite to their shift-level conclusions!  
  - **Prompt:** "Stare at the arithmetic. Does it tell you *why* this flipped? Or which ‘answer’ is right?" (Let them struggle briefly.)  

  #### 3. Round 3: The Type Twist (25 mins)  
  - **Task:** Teams use **Card 3 (Biscuit type data)** to explain the flip.  
  - **Rules:**  
    - Calculate rates for Plain and Chocolate biscuits separately.  
    - Record: *"For Plain, Line ____ is better. For Chocolate, Line ____ is better."*  
    - **Earn tokens:** 4 tokens if they spot both lines now perform equally (60% for Plain, 24% for Chocolate).  
  - **The rug-pull:** Card 3 flips the reversal *again*:  
    - **Plain biscuits:** Line A = 60% (42/70), Line B = 60% (18/30).  
    - **Chocolate biscuits:** Line A = 24% (12/50), Line B = 53% (48/90).  
    Teams expected a clear winner but get chaos—Line A wins in Plain but loses in Chocolate. The combined data (Card 2) now seems meaningless!  

  #### 4. Debrief (15 mins)  
  - **Start with feelings:** "Raise your hand if Round 2 felt unfair. Round 3?" Let them vent.  
  - **Map to the idea:**  
    - "In Round 1, you sliced by *shift*—and got one story. In Round 2, you ignored shifts—and the story flipped. Then in Round 3, you sliced by *biscuit type*—and it flipped again! Did the arithmetic change? No. What changed?"  
    - "The judgement: *Why* did you group by shift or type? Because you thought time of day or biscuit difficulty might *cause* differences. But the numbers don’t tell you which factor matters. That’s the hard part."  
  - **Final point:** "This isn’t about spotting ‘tricks’—it’s about asking: *What’s the causal story?* If you blame the shift, group that way. If you blame the biscuit, group that way. But you decide—the numbers won’t decide for you."  
  - **Name it (end only):** "This is called Simpson’s Paradox. But the name isn’t important—the lesson is: Arithmetic is easy. Judging causality is hard."  
  - **Award prize:** Tally tokens. Celebrate winning team with biscuits.  

  ---

  ### What Could Go Wrong (and How to Handle It)  
  1. **"I hate numbers—I’m freezing!"**  
     - *Preempt:* Reassure upfront: "Stick to ‘good vs total’—your team will handle the rest."  
     - *In the moment:* Assign roles—nervous members draw conclusions; others calculate.  

  2. **Teams miss the reversal in Round 2.**  
     - *Salvage:* Ask: "In Morning, Line A won. Overall, Line B won. How’s that possible?" Have them compare rates aloud.  

  3. **Round 3 calculations go haywire (e.g., misreading Card 3).**  
     - *Prevent:* Use double-check prompts: "First, find Line A’s Plain biscuits: good ÷ total."  
     - *Correct:* Walk teams through one example: "For Plain, Line A: 42 good out of 70. That’s 60%."  

  4. **Debrief feels abstract.**  
     - *Anchor:* Use their quotes: "When Dave said, ‘This is rigged!’ in Round 2—that’s the paradox biting. In Round 3, when Priya said, ‘Now what?’, that’s the causality question."  

  ---

  ### The Unavoidable Gap  
  No activity can fully replicate **why causality is subjective**. Participants will *feel* the arithmetic flip, but you must explicitly say:  
  > *"The numbers can’t tell you if ‘shift’ or ‘biscuit type’ is the ‘real’ cause. That depends on your story. For example, if you believe night shifts cause fatigue, group by shift. If you believe chocolate biscuits are harder, group by type. But that’s a human call—and in real life, experts fight over it."*  

  **Final Prep Checklist:**  
  - ✓ Print 3 team booklets (Cards 1–3 + Decision Sheet).  
  - ✓ Prepare tokens, scoreboard, biscuits, optional % aids.  
  - ✓ Test calculations: Ensure Card 2 (55% vs 45%) and Card 3 (60% Plain, 24% Chocolate) are error-free.  

  Run it cold, and they’ll leave arguing about shifts and biscuits—not averages.
