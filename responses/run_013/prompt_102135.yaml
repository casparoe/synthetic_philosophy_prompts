    - **Lesson:** Explicitly state your assumptions about the distribution; don't default to "equally likely."
  - **Third friend (symmetry issue):**
    - **Wrong in this context:** With the range, there's no contradiction—different amounts justify different actions. Without the range, their point is valid but overstates the problem; it's a symptom of the distributional issue, not a reason to dismiss the calculation entirely.
    - **Lesson:** Asymmetric information (like seeing your amount) breaks the initial symmetry, so conditional probabilities matter.

  #### 6. **General Lesson for Expected Value Arguments**
  When a "sure" expected-value argument (like always swap) seems to prove a dominant strategy but contradicts symmetry:
  - **Condition on all information:** Use Bayesian updating. Given what you observe (e.g., $150) and the constraints (range 1–100), compute the probabilities of the possible states (here, only one state: $150 is large).
  - **Examine the prior distribution:** The paradox often arises from an unrealistic or improper prior (e.g., uniform over all integers). In real-world cases, there's always a practical bound—use it if given.
  - **Don't assume equal likelihood:** Just because two outcomes seem symmetric doesn't mean they're equally probable. Test if they're possible and calculate based on the actual distribution.
  - **Respect pre-observation symmetry:** Before opening, swapping has no expected gain. If an argument suggests always swapping after opening, it must be consistent with this—if not, the probabilities are flawed.

