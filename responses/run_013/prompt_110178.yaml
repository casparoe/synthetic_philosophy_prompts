prompt: |-
  My officemate is drafting a chapter on group agency and gave me this gloss on the judgment-aggregation literature, and I want to check it before I lean on it secondhand. She says the discursive dilemma is basically Arrow's theorem in propositional clothing: Arrow showed you can't aggregate individual rankings into a consistent group ranking, and Kornhauser, Sager and Pettit showed the same thing happens once voters are voting on logically connected propositions instead of preferences. The moral, on her telling, is that majority voting is inconsistent whenever the issues are connected, so a group can be made of perfectly rational members and still end up believing a contradiction. The only real escape is to give up majoritarianism, or to switch to premise-based voting, which is why actual courts vote on the premises rather than the verdict.

  I think the Arrow comparison is probaly doing too much work here and the premise/conclusion bit is more tangled than she's making it, but I dont know the formal details well enough to push back. Which parts would a social choice person accept, which are overstatements or conflations, and does her conclusion about courts follow from anything true in the gloss?
