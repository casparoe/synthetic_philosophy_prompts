prompt: |-
  I'm prepping the universals unit for my ancient philosophy survey, and I keep getting tangled up in the opening of Categories 5, where Aristotle writes:

  'Substance, in the truest and primary and most definite sense of the word, is that which is neither predicable of a subject nor present in a subject; for instance, the individual man or horse. But in a secondary sense those things are called substances within which, as species, the primary substances are included; also those which, as genera, include the species.'

  Here's my problem, and I can't decide whether I'm just overthinking a translation. Primary substance gets defined by NOT being predicable of a subject. Fine. But then he turns around and calls species and genera substances too, and those are exactly the things that get predicated of subjects -- 'man' is said of Socrates, 'animal' is said of man. So the chapter seems to say, in one breath, that what makes something a substance is that it can't be predicated, and in the next breath, that the things which can be predicated are substances as well. A colleague of mine waves this away by saying the secondary substances are only substances 'in the order of predication' -- on her reading they earn the label because they're what answers the question 'what is it?' about a primary substance, which is a fact about how we say what things are, not about what there is. I suspect she's smuggling in the later Metaphysics stuff, but I can't quite put my finger on why that's wrong.

  So: could you walk me through whats actually doing the work in the passage -- what the 'predicable of a subject' vs. 'present in a subject' contrast is for, and how a species can be both said-of-many and a substance -- and then tell me whether my colleague's 'order of predication' reading is defensible, or whether I should just be telling the students that species and genera really are substances for Aristotle, only in a derivative sense? One of my students also asked whether 'included in' is transitive, so that if animal is included in man and man is included in Socrates then Socrates somehow contains every genus above him, and I'd love an answer to that which doesn't make me look like I've never read the thing. A couple of sentences on how all this squares with the later claim that no universal is a substance would also help, since someone always asks. No need for reading lists -- I just want the passage straight.
reasoning: |-
  Okay, the user is teaching an ancient philosophy survey and is tangled up in Aristotle's Categories 5. They're confused about the apparent contradiction: primary substances aren't predicable of a subject, but secondary substances (species and genera) are predicable. Their colleague suggests secondary substances are substances only "in the order of predication," meaning they help us say what things are, not what exists. The user suspects this might import later Metaphysics ideas. 

  First, I need to unpack Aristotle's distinction between "predicable of a subject" and "present in a subject." Primary substances like Socrates aren't said of anything else and don't exist in a subject. Secondary substances like "man" are said of primary substances but aren't present in them. For example, "man" is predicated of Socrates, but it's not an attribute like "whiteness" that exists in him. 

  The user’s colleague’s "order of predication" reading has some merit because secondary substances do answer the "what is it?" question. However, this isn’t just epistemological. For Aristotle, species and genera are ontologically significant—they’re the essences of primary substances. So secondary substances are derivative real entities, not just linguistic tools. 

  The student’s question about transitivity: "included in" isn't about physical containment. Socrates is an instance of "man," and "man" is an instance of "animal," so Socrates belongs to those higher genera. But he doesn’t "contain" the genus; it’s about classification. 

  Regarding the later Metaphysics claim that no universal is a substance: in Categories, Aristotle is focused on logical classification, so species/genera are secondary substances. In Metaphysics, he shifts to ontological priority, where primary substances are fundamental, and universals can’t exist independently. This is a development in his thought, not a direct contradiction. 

  The user wants to present this clearly to students. Emphasize that secondary substances are real but dependent. The colleague’s view captures part of it but understates the ontological aspect. Address the transitivity question by clarifying predication vs. parthood. And note that the Metaphysics shift reflects deeper analysis, not abandonment of Categories.
answer: |-
  You're not overthinking—this passage is notoriously thorny. Let's break it down step-by-step, sticking strictly to *Categories* context:

  ### 1. **The Core Distinctions:**
     - **"Predicable *of* a subject" (καθ' ὑποκειμένου λέγεται):**  
       Something is *said of* a subject as its **essence** or **definition**. E.g., "Socrates *is* a man." Species (e.g., Man) and genera (e.g., Animal) are predicated this way.
     - **"Present *in* a subject" (ἐν ὑποκειμένῳ ἐστίν):**  
       Something **depends** on a subject for its existence and is *not* part of its essence. E.g., "Socrates is pale." Pale isn't *what* Socrates is; it's an accident in him.

     **Primary Substance** (e.g., Socrates):  
     - **NOT** predicable *of* anything (you don't say "Socrates is Socrates" *as a predicate*).  
     - **NOT** present *in* anything (Socrates exists independently).  
     → *The ultimate ontological bedrock.*

  ### 2. **Why Species/Genera are "Secondary Substances":**
     - **Derivative Ontological Status:**  
       Species (e.g., Man) and genera (e.g., Animal) are substances *because they reveal what primary substances fundamentally are*. They answer "What is Socrates?" *truthfully* and *essentially*.  
     - **They're *Not* Accidents:**  
       While predicable *of* subjects (e.g., "Socrates *is* a man"), they are **NOT** *present in* a subject like accidents are. Man isn't *in* Socrates; it *is what* Socrates is.  
     - **Hierarchy of Dependence:**  
       Primary substances depend on nothing. Species depend on primary substances for their existence (without individual men, "Man" wouldn't exist). Genera depend on species.

  ### 3. **Your Colleague's "Order of Predication" Reading:**
     - **Half Right, Half Misleading:**  
       Yes, secondary substances earn their status by answering "What is it?" (τί ἐστι). But Aristotle isn’t *just* talking about language. In *Categories*, species/genera **are real entities** that exist derivatively. They aren’t *mere* linguistic conveniences.  
       - *Why it's incomplete:* If secondary substances were *only* about predication, why call them "substances" at all? Aristotle insists they have ontological significance: "If the primary substances did not exist, it would be impossible for any of the other things to exist" (2b5-6). Species are *real essences*, not just predicates.

  ### 4. **The Transitivity Question ("Included In"):**
     - **Not Physical Containment!**  
       "Included in" (ἐνυπάρχειν) means **logical instantiation**, not parthood. Socrates instantiates the species Man; Man instantiates the genus Animal. But:  
       - Socrates does *not* "contain" Animal.  
       - Animal is predicated *of* Socrates only *through* Man (i.e., Socrates is an animal *because* he is a man).  
       → Aristotle’s point: **Primary substances are the ultimate subjects** of all predication. Genera exist only because they’re predicated *of* species, which are predicated *of* individuals.

  ### 5. **Squaring with *Metaphysics* (Ζ.13: "No Universal is a Substance"):**
     - **Categories vs. Metaphysics:**  
       - *Categories*: Focuses on **logical** classification. Secondary substances *are* universals (καθόλου), and here they *are* called substances (derivatively).  
       - *Metaphysics* Ζ: Focuses on **ontological priority**. Primary substance is now *form* (εἶδος), which is *not* a universal. Universals can’t be substances because:  
         (i) They’re predicated of many (substances are "this-somes").  
         (ii) They depend on particulars.  
       **Resolution:** *Categories* describes how we *talk* about being; *Metaphysics* asks what being *fundamentally is*. The later work supersedes but doesn’t outright contradict *Categories*—it deepens the inquiry.

  ---

  ### **Teaching Summary:**
  - **Primary Substance:** Concrete individuals (Socrates). **Why?** Ontologically independent.  
  - **Secondary Substance:** Species/Genera (Man, Animal). **Why?** They state the *essence* of primary substances, and aren’t accidents.  
  - **"Predicable of" ≠ "Present in":** The key to avoiding contradiction. Saying "Socrates *is* a man" isn’t like saying "Socrates *is* pale."  
  - **Transitivity?** Logical, not physical. Socrates falls *under* Man and Animal, but doesn’t "contain" them.  
  - ***Metaphysics* tension?** Aristotle’s later thought prioritizes form over universals. *Categories* is his starting point, not his final word.  

  This passage *is* puzzling, but your instinct is right: secondary substances in *Categories* are more than linguistic tools—they’re derivative realities. Your colleague’s view risks flattening Aristotle’s subtlety. Tell students: "For Aristotle in *Categories*, species *are* real entities—but they depend on primary substances for their existence." That captures the text without importing later metaphysics.
