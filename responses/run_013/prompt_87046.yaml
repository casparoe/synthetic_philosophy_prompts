prompt: |-
  I am working up a paper on rational acceptance, and before I evaluate any particular account of it I want the specification on the table. Fix the target this way: the theory is for a bounded agent, not an ideal one with unlimited time or computational power; what she accepts is what she is prepared to assert, reason from, and act on; and she revises her acceptances as evidence arrives. I do not want a literature review, names, works, or a reading list — I want the requirements themselves.

  The two cases that generate the demand are the lottery and the preface. In the lottery, a fair draw with one winning ticket out of a hundred leaves each ticket at 0.99 to lose, so it looks rational to accept of every ticket that it will lose, while the conjunction of those acceptances is something the agent knows to be false. In the preface, an author has strong evidence for each of three hundred claims in a book and strong evidence, from her own track record, that at least one of them is false; she seems entitled to accept each claim and to accept that one of them fails. Take both as fixed phenomena that any adequate theory must accommodate.

  What I want from you is the desiderata list: for each requirement, the statement of it, the case or consideration that motivates it, and a ruling on whether it is non-negotiable or merely the preference of one camp in the debate — I do not want a camp's methodological taste smuggled in as a datum. Cover at least the following ground: which cases must come out right; the demands of consistency and of closure under conjunction and known entailment; the relation between credence and acceptance, including whether a high-probability threshold can do the work; the distinction between belief and assertion, action, or institutional certification; the diachronic requirements governing revision and the withdrawal of an acceptance; and the demand that the theory be neither vacuous nor self-undermining, in the sense that it may not license the acceptance of contradictions on one side nor leave the agent unable to accept almost anything on the other.

  State the requirements at the right level of generality, and test that by cases I have constructed, which I want the list to cover:

  First, a case with no lottery and no tickets. A diagnostic instrument yields exactly one of ten thousand mutually exclusive and jointly exhaustive readings, each at 0.9999 on the evidence. Nobody wins anything and nothing is drawn. If the paradox is about lotteries, the theory should say what distinguishes this; if it is about partitions, the requirements should be stated without lotteries in them at all.

  Second, a self-auditing book: its final chapter argues, from the author's track record, that at least one claim in the book is false — and the final chapter is itself one of the claims in the book. Does the theory place the last chapter inside or outside the set of acceptances, and what does it say the author's overall position is?

  Third, a serial drawing: losing tickets are announced one at a time over months, so each announcement is genuine evidence about the survivors and credence in each of them rises. What should the agent accept at each stage, and what governs withdrawal of an earlier acceptance? I want an explicit requirement forbidding verdicts that flip back and forth with no change in evidence.

  Fourth, a certification case: an auditor must sign one sentence that is the conjunction of a thousand entries, each of which she independently accepts to a high standard. Her institution requires the signature; her epistemology may not permit the belief. The theory must either separate acceptance from certification and assertion, or explain why the distinction is idle here.

  Finally, flag any subset of the requirements you believe cannot be jointly satisfied, with the argument, and say which single requirement does the most work in excluding the standard positions. A sentence or two per position is enough — I will do the full scorecard myself.
reasoning: |-
  Hmm, the user is working on a paper about rational acceptance for bounded agents and wants a clear list of requirements. They want desiderata that cover specific cases they've constructed, without any literature review or names. Let me unpack this.

  The core challenge here is balancing consistency with real-world constraints. The lottery and preface paradoxes expose how high-probability acceptance leads to inconsistency when aggregated. The user's test cases are cleverly designed to probe different pressure points: partition-based uncertainty without lotteries (Case 1), self-referential preface claims (Case 2), evidence dynamics (Case 3), and institutional vs epistemic requirements (Case 4).

  For the desiderata, I need to systematically address:
  - Consistency requirements (how much inconsistency is tolerable?)
  - Closure principles (conjunction, entailment)
  - Credence-threshold viability
  - Action/assertion distinctions
  - Diachronic stability
  - Non-vacuity constraints

  Each requirement must be stated generally enough to cover both lottery-like partitions and non-lottery scenarios. Case 1 specifically demands this generality. The self-auditing book in Case 2 will test whether consistency requirements apply recursively. Case 3 challenges whether acceptance can be stable under evidence accumulation, while Case 4 probes if institutional "acceptance" differs from rational acceptance.

  The trickiest tension is between:
  - Avoiding vacuity (requiring substantive acceptance)
  - Avoiding self-undermining (prohibiting contradictions)
  - Maintaining diachronic stability

  I suspect Closure Under Known Entailment (C-ENT) is the most damaging requirement - it's what forces the explosion of conjunctions leading to preface-style contradictions. But dropping it entirely might make the system useless for practical reasoning. The threshold models fail precisely because they violate C-ENT and CONS.

  For the self-auditing book, the theory must either:
  a) Reject the final chapter's claim (making acceptance non-reflexive) OR
  b) Accept the inconsistency but contain it (violating CONS)

  Neither is ideal. This might be where distinguishing belief from institutional acceptance (per Case 4) becomes necessary. The certification case suggests we might need two-tiered acceptance: one for reasoning/action, another for formal assertions.

  The serial drawing case implies we need:
  - A monotonicity principle (once rejected, stays rejected)
  - Evidence-sensitivity without flip-flopping

  But this clashes with probability thresholds - as credences rise, a once-rejected proposition might cross the threshold later. So threshold models inherently risk instability.

  Ultimately, CONS and C-ENT together seem incompatible with non-vacuity given bounded rationality. But weakening CONS too far makes the system self-undermining. The deepest tension is between consistency and completeness - we can't have both under uncertainty. I'll highlight this in the conflict analysis.
answer: |-
  Here is a specification of requirements for a theory of rational acceptance for bounded agents, structured as requested. Requirements are stated generally, motivated by core cases/considerations, and classified as non-negotiable (NN) or negotiable (N). Test cases are addressed under each relevant requirement.

  ---

  ### **I. Scope & Phenomena Requirements**  
  1.  **Requirement: Bounded Rationality (BR)**  
      *Statement:* The theory must account for agents with finite cognitive resources, time, and computational capacity.  
      *Motivation:* Central to the target; ideal agents avoid the core problems (lottery/preface) by avoiding acceptance under uncertainty.  
      *Status:* NN.  
      *Test Case 1 (Non-lottery partition):* Applies directly. The 10,000-outcome diagnostic instrument exemplifies non-lottery uncertainty partitions.

  2.  **Requirement: Phenomena Capture (PHEN)**  
      *Statement:* The theory must accommodate both the Lottery Paradox (accepting individual propositions of very high probability while rejecting their conjunction) and the Preface Paradox (accepting individual claims while accepting that at least one is false).  
      *Motivation:* These are the fixed data points the theory must explain.  
      *Status:* NN.  
      *Test Case 1:* Must explain why accepting each diagnostic outcome as "not occurring" (credence 0.9999) is rational, while accepting their conjunction is not.  
      *Test Case 2 (Self-auditing book):* Must explain how the final chapter (claiming "at least one false claim in this book") can be coherently handled within the set of acceptances.

  ---

  ### **II. Structural Requirements**  
  3.  **Requirement: Consistency (CONS)**  
      *Statement:* The set of rational acceptances must be internally consistent (no logical contradictions).  
      *Motivation:* Rational reasoning and action require consistency; asserting/acting on contradictions is pragmatically self-defeating.  
      *Status:* NN.  
      *Test Case 2:* Rules out positions where the final chapter's claim (P: "At least one claim in this book is false") is accepted alongside the acceptance of every individual claim (including P itself), as this entails a contradiction (accepting P and not-P).  

  4.  **Requirement: Restricted Closure (R-CL)**  
      *Statement:* Rational acceptance need not be closed under multi-premise conjunction (i.e., accepting A₁, A₂, ..., Aₙ does not entail accepting A₁∧A₂∧...∧Aₙ).  
      *Motivation:* Lottery/Preface phenomena; bounded agents cannot manage infinitely many conjunctions.  
      *Status:* NN (for multi-premise).  
      *Test Case 1:* Explains why accepting each "¬Outcomeᵢ" is rational while rejecting "¬Outcome₁ ∧ ¬Outcome₂ ∧ ... ∧ ¬Outcome₁₀₀₀₀" (which is equivalent to a contradiction).  

  5.  **Requirement: Closure Under Known Entailment (C-ENT)**  
      *Statement:* If an agent rationally accepts A and rationally accepts that A entails B, then the agent must rationally accept B.  
      *Motivation:* Failure violates minimal rationality in reasoning; unable to draw obvious inferences.  
      *Status:* NN.  
      *Test Case 3 (Serial drawing):* If the agent accepts "Ticket 1 lost" at Stage 1 and later accepts "Ticket 1 lost entails ¬(Ticket 1 wins)," they must accept the latter.  

  ---

  ### **III. Credence & Threshold Requirements**  
  6.  **Requirement: Credence Insufficiency (CRED-INS)**  
      *Statement:* High probability alone is insufficient as the sole criterion for rational acceptance.  
      *Motivation:* Lottery/Preface: Each proposition has high probability, but their conjunction (or the acknowledgment of error) has low probability. Thresholds lead to inconsistency (CONS violation).  
      *Status:* NN.  
      *Test Case 1:* A fixed high-probability threshold (e.g., 0.9999) would force acceptance of each "¬Outcomeᵢ" but also force acceptance of their inconsistent conjunction.  

  7.  **Requirement: Credence Relevance (CRED-REL)**  
      *Statement:* Credences must play a significant (but not exhaustive) role in determining rational acceptance.  
      *Motivation:* Evidence is probabilistically quantified; ignoring it makes acceptance arbitrary.  
      *Status:* NN.  

  ---

  ### **IV. Functional & Diachronic Requirements**  
  8.  **Requirement: Functional Triad (FUNC)**  
      *Statement:* What is rationally accepted is what the agent is prepared to assert (in relevant contexts), use as a premise in reasoning, and act upon.  
      *Motivation:* Defines the functional role of acceptance.  
      *Status:* NN.  

  9.  **Requirement: Assertion/Certification Distinction (CERT)**  
      *Statement:* The theory must distinguish between epistemic *rational acceptance* (governing reasoning/action) and institutional/social *certification* or *formal assertion* (e.g., signing an audit report).  
      *Motivation:* Certification may require affirming propositions not rationally believed due to risk structure or institutional norms.  
      *Status:* NN.  
      *Test Case 4 (Certification):* The auditor may *accept* each entry individually (for reasoning/action) but be rationally prohibited from *certifying* their conjunction due to aggregated risk. The theory must explain this distinction or show why it collapses.  

  10. **Requirement: Diachronic Stability (DIA)**  
      *Statement:* Rational acceptance must be stable under non-defeating evidence accumulation; withdrawal requires new defeating evidence. Verdicts cannot "flip-flop" without evidence change.  
      *Motivation:* Purely threshold-based models lead to instability (e.g., credence rising past threshold on no new evidence).  
      *Status:* NN.  
      *Test Case 3:* As losing tickets are announced, credence for survivors rises. An acceptance of "Ticket i will lose" made at an early stage must not be withdrawn *solely* because credence later rises (if no new defeating evidence exists). Withdrawal requires positive defeating evidence (e.g., new error-discovery).  

  11. **Requirement: Evidence-Responsive Revision (REV)**  
      *Statement:* Rational acceptance must be revisable in light of new evidence.  
      *Motivation:* Central to the target; agents update as evidence arrives.  
      *Status:* NN.  

  ---

  ### **V. Non-Vacuity & Self-Undermining Requirements**  
  12. **Requirement: Non-Vacuity (VAC)**  
      *Statement:* The theory must permit agents to rationally accept a substantial range of contingent propositions under uncertainty.  
      *Motivation:* A theory forbidding all acceptance under uncertainty is useless for bounded agents.  
      *Status:* NN.  

  13. **Requirement: Non-Self-Undermining (SELF)**  
      *Statement:* The theory must not license the rational acceptance of known contradictions, nor undermine the possibility of its own application (e.g., by implying no high-probability proposition can ever be accepted).  
      *Motivation:* A theory allowing rational acceptance of contradictions is incoherent; one preventing all acceptance is vacuously consistent but practically inert.  
      *Status:* NN.  
      *Test Case 2:* Must avoid a verdict where accepting the final chapter's claim rationally requires accepting a contradiction (violating SELF and CONS).  

  ---

  ### **VI. Conflicts & Key Excluding Requirement**
  **Conflicting Requirements:**  
  - **CONS + C-ENT + R-CL + VAC:** The core tension. CONS forbids contradictions. C-ENT ensures single-step reasoning. R-CL allows rejecting conjunctions of accepted propositions. VAC requires accepting some high-probability propositions. In the Preface (Test Case 2), accepting all individual claims {A₁...Aₙ} and P ("At least one Aᵢ is false") violates CONS. R-CL avoids this by not requiring acceptance of the conjunction of all Aᵢ, but P *is* the negation of that conjunction. Accepting P while accepting each Aᵢ still violates CONS if P is part of the set. Dropping CONS undermines SELF; weakening C-ENT or R-CL risks vacuity or irrationality.  
  - **DIA + Thresholds:** Pure probabilistic thresholds violate DIA (Test Case 3: credence drifts cause flip-flopping).  

  **Most Excluding Requirement:**  
  **Closure Under Known Entailment (C-ENT)** does the most work in excluding standard positions:  
  - **High-Threshold Views:** Violate C-ENT (and CONS) in lotteries/prefaces: Accepting each high-probability ticket-loss proposition, and accepting that they entail the conjunction, *should* require accepting the conjunction – but this is inconsistent.  
  - **Full Non-Closure Views:** Often reject C-ENT to avoid conjunctions, but this prevents essential single-step reasoning (e.g., from "All ravens are black" and "This is a raven" to "This is black").  
  - **Paraconsistent/Dialetheic Views:** Reject CONS, violating SELF (license accepting contradictions).  

  ---

  This list provides the necessary constraints for evaluating theories of rational acceptance, grounded in your target phenomena and test cases, without doctrinal bias.
