  The two systems:
  - System A (Active Failsafe): The failsafe state (when no command is present) is to deliver a normal breath. To deliver a rescue breath, the system must issue an active command to open a high-pressure valve. If the system issues a rescue breath command, that breath is delivered. If no command is issued, the normal breath is delivered.
  - System B (Passive Failsafe): The failsafe state (when no command is present) is to deliver a rescue breath. To deliver a normal breath, the system must issue an active command to open a normal-pressure valve. If the system issues a normal breath command, that breath is delivered. If no command is issued, the rescue breath is delivered.

  The same control policy is implemented in both systems by inverting the command logic:
  - In System A: 
     - If conditions are safe: issue no command (so normal breath, by failsafe)
     - If conditions are unsafe: issue a command for a rescue breath.
  - In System B:
     - If conditions are safe: issue a command for a normal breath (so normal breath by command)
     - If conditions are unsafe: issue no command (so rescue breath by failsafe)

