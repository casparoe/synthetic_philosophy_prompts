answer: |-
  ### Thought Experiment: The Ventilator Control System

  **Setting:** An intensive care unit (ICU) in a modern hospital. A patient with severe, unstable respiratory failure is on a ventilator. The ventilator is controlled by an automated system with blood oxygen (SpO₂) and carbon dioxide (CO₂) sensors, a microcontroller implementing a fixed policy, and an actuator regulating breath pressure. A failsafe mechanism defaults the actuator to a specific state if no command is received. The policy is to deliver a high-pressure "rescue breath" when SpO₂ falls below 88% or CO₂ rises above 50 mmHg; otherwise, deliver a normal breath. Human operators monitor the system but do not intervene, as the patient’s condition deteriorates too rapidly for human response. Identical sensor readings trigger the systems in both cases: SpO₂ drops to 85%, CO₂ rises to 55 mmHg.

  **The Pair of Systems:**
  - **System A (Active Failsafe):**  
    Failsafe state (no command): Normal breath.  
    Control logic: If unsafe (SpO₂ < 88% or CO₂ > 50 mmHg), issue a command for a rescue breath. If safe, issue no command (normal breath via failsafe).  
    *Outcome:* System issues a rescue breath command. The high-pressure breath causes a fatal lung rupture due to an undiagnosed pneumothorax.  
  - **System B (Passive Failsafe):**  
    Failsafe state (no command): Rescue breath.  
    Control logic: If unsafe, issue no command (rescue breath via failsafe). If safe, issue a command for a normal breath.  
    *Outcome:* System issues no command. The failsafe delivers a rescue breath, causing an identical fatal lung rupture.  

  **Physical History:** From the actuator onward, everything is identical: sensor thresholds, timing of the breath, pressure profile, physiological response, and time of death. The sole difference is the polarity of the failsafe (default state) and the corresponding command logic. Death occurs due to the rescue breath in both cases, but in A it coincides with a command, in B with the absence of one.

  ---

  ### Analysis  
  **Accounts of Doing/Allowing and Their Verdicts**  
  1. **Account 1: Doing as Positive Act, Allowing as Absence**  
     - *Description:* Doing involves the agent producing a positive physical act or instruction. Allowing involves the absence of such an act; the agent lets events unfold without intervention.  
     - *Verdict for System A:* The system *does* harm. It issues a command (a positive instruction) that triggers the lethal breath.  
     - *Verdict for System B:* The system *allows* harm. It withholds a command (no positive act), and the lethal breath occurs via failsafe absence.  
     - *Note:* This account is unambiguous but sensitive to command presence.

  2. **Account 2: Doing as Difference-Making**  
     - *Description:* Doing occurs when the agent is a necessary condition for the outcome—i.e., the harm would not have occurred without the agent’s specific behavior (even if it involves ceasing to act). Allowing occurs when the harm would have happened regardless.  
     - *Verdict under Baseline 1 (System’s absence):*  
       - *System A:* Without the system, no rescue breath occurs (failsafe is normal breath). The death would not have happened. Thus, the system *does* harm by issuing the command.  
       - *System B:* Without the system, the failsafe delivers a rescue breath. The death would have occurred identically. Thus, the system *allows* harm by withholding the command.  
     - *Verdict under Baseline 2 (System’s presence with altered behavior):*  
       - *System A:* If the system withheld the command, a normal breath occurs, and death is avoided. Thus, it *does* harm.  
       - *System B:* If the system issued a command, a normal breath occurs, and death is avoided. Thus, withholding the command *does* harm (it is a difference-maker).  
     - *Note:* The verdict flips based on baseline choice. Using Baseline 1: A is doing, B is allowing. Using Baseline 2: Both are doing.

  3. **Account 3: Doing as Deviating from a Baseline**  
     - *Description:* Doing moves the world below a baseline fixed independently of the agent. Allowing occurs when the outcome aligns with or does not worsen the baseline.  
     - *Verdict under Baseline 1 (Patient’s condition on admission):*  
       - *Both Systems:* The patient was alive on admission. Death is a worsening below this baseline. The system *does* harm in both cases.  
     - *Verdict under Baseline 2 (World without the controller):*  
       - *Both Systems:* Without the system, the patient dies quickly from respiratory failure. With the system, death occurs later by rupture. The outcome (death) is equivalent, so the system *allows* harm (it does not worsen the baseline).  
     - *Note:* The account is ambiguous. Baseline 1 yields invariant doing; Baseline 2 yields invariant allowing.

  **What is Doing the Work**  
  - **Divergence Feature:** The polarity of the failsafe (default actuator state) and corresponding command logic.  
  - **Removing the Feature:** If both systems share the same failsafe (e.g., both active), the case collapses into an ordinary doing scenario: the system always issues a command for the lethal breath (Account 1: doing; Accounts 2–3: doing under most baselines).  
  - **Invariance Across Accounts:**  
    - Account 1 is not invariant: verdicts flip (A: doing, B: allowing).  
    - Account 2 is invariant only under Baseline 2 (both doing) or Baseline 1 (divergent).  
    - Account 3 is invariant under Baseline 1 (both doing) or Baseline 2 (both allowing).  
  - **Revelation:**  
    - Account 1 locates the distinction in the agent’s output (command presence).  
    - Account 2 locates it in causal structure (counterfactual dependence).  
    - Account 3 locates it in a stipulated baseline.  
  - **Implementability:** An engineering team could implement Account 1 (command presence is observable) but not Accounts 2–3 without representing unobservable counterfactuals (e.g., "what if the system were absent?").

  **Strongest Attack for the Weakest Account**  
  - **Weakest Account:** Account 1 fares worst because its verdict flips (doing vs. allowing) despite identical physical outcomes, making morality hinge on an engineering convention (failsafe polarity).  
  - **Defender’s Replies:**  
    1. *Rest State Argument:* The default state is the system’s "rest," and rest is not action. Thus, in B, no command is mere rest (allowing), while in A, commanding is action (doing). This is not arbitrary, as rest is a physical fact.  
    2. *Outcome-Irrelevance Argument:* Account 1 is correct; moral equivalence is an illusion from focusing on outcomes. The systems differ behaviorally (acting vs. not acting), so the verdicts should differ.  
    3. *Artifact Limitation Argument:* Account 1 was never for artifacts. Applying it here makes verdicts hostage to design, showing doing/allowing constraints cannot be implemented in artifacts without arbitrariness.  
  - **Strongest Reply:** (3) The artifact limitation. It concedes that Account 1 is agent-centric (designed for beings with "rest" as intrinsic non-action) and fails for artifacts, where rest is assigned by engineers. This avoids denying physical differences (Reply 1) or moral intuitions (Reply 2).  
  - **Condition for Success:** The reply succeeds if doing/allowing distinctions require agents with intrinsic baselines (e.g., biological rest), not design-dependent ones.  

  **Purpose Satisfaction:** Verdicts derive from the accounts, not stipulation. The case tests whether a doing/allowing constraint can avoid dependence on failsafe polarity. Accounts 2–3 can achieve invariance under some baselines, but Account 1 cannot, revealing a challenge for implementation.
