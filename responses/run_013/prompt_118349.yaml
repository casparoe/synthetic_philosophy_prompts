prompt: |-
  I have been trying to put a name to a certain shape of problem, and, that failing, to work out where its edges are. I have no training in this area, so it may be that the word exists and I have simply never met it.

  The shape is this: a choice is open to each of a great many people at once, what any one of them does is by itself almost nothing, and what all of them do together is decisive. I keep running into it in three flavours.

  The exactly-one flavour. A radio station promises to play a song only if exactly one listener requests it, and cancels the request if two do. I want the song played. Should I write in? If I stay quiet and no one else writes, it never plays; if I write in and someone else does too, I have spoiled it; and if I imagine everyone in my position reasoning as I am, we all write in and it never plays.

  The divided-pot flavour. A settlement, or a giveaway, pays a fixed sum split among everyone who claims it. Claiming is individually sensible — I get a share. But if everyone claims, and above all if everyone claims as much as they can, the share shrinks toward nothing; and once each person expects the others to claim more, their own best reply is to claim more still, and the pot runs away.

  The threshold flavour. A strike, a boycott, a petition that succeeds only if enough people join. My joining is invisible in the total, yet the total is the only thing that matters, so everyone waits to see whether everyone else will come.

  In all three, sooner or later someone makes the same move: don't ask what happens if I do this; ask what would happen if everyone in my position did this, and act so that the everyone-version comes out well. I learned a version of this as a child — what if everyone did that — and I know it is often rubbish: if everyone studied what I study there would be no plumbers, and that is no reason for me to study something else. So the move looks sound in my three cases and false in the plumber case, and I cannot say what the difference is.

  I am not after a reading list. I want to know whether this class of situations has an established name, and whether the three flavours are really one class or several; whether the reasoning move has a name of its own, distinct from the situations it is applied to; and above all where the line falls between the cases where the move is sound and the cases where it is the fallacy. I suspect it turns on whether the others are like me in a way that makes their choices track mine, but I cannot make that precise without going in a circle.

  Please say how confident you are in each part of the answer, and single out the point you are least sure about.
reasoning: |-
  Hmm, the user presents a fascinating problem about collective action dilemmas. They've identified three patterns: the "exactly-one" scenario (like the radio request), the "divided-pot" situation (like a settlement split among claimants), and the "threshold" case (like strikes or petitions). All share a core tension where individual rationality clashes with collective outcomes.

  The key commonality appears to be what game theorists call "aggregative games" or "binary action games with aggregate spillovers" - where each person's payoff depends on their own choice plus the sum/total of others' choices. This fits all three scenarios perfectly. The "what if everyone did that" reasoning is essentially Kant's universalizability principle, but its validity depends entirely on the strategic structure.

  The crucial distinction from their plumber example lies in strategic interdependence: in collective dilemmas, others' choices directly affect my payoff in ways that create feedback loops (e.g., overclaiming makes claiming less rewarding). In career choices, my decision doesn't alter others' payoffs - there's no strategic coupling. This explains why universalization fails there.

  I'm highly confident about the game theory framing but less so about labeling the reasoning move itself. "Universalization heuristic" feels right, but scholars might debate finer distinctions. Also worth noting that in threshold cases, the move's validity depends on whether one assumes others will behave similarly - which introduces circularity risks.

  The user's intuition about "tracking" choices is astute - it hints at equilibrium concepts where beliefs and actions align. Perhaps emphasizing how these dilemmas create coordination or assurance problems could help them see why universalization works here but not in parallel choice scenarios.
answer: |-
  You've articulated a profound class of problems with remarkable clarity. This **is** an established phenomenon, and your analysis of its "flavors" is insightful. Here's a breakdown:

  1.  **The Class of Situations:**
      *   **Name:** These are classic **Collective Action Problems (CAPs)**, specifically falling under the umbrella of **Aggregative Games** or **Binary Action Games with Aggregate Spillovers**. They are also deeply related to **Coordination Problems**, **Assurance Games**, and **Anti-Coordination Games**.
      *   **Why it fits:** In all your examples:
          *   **Many individuals:** Each faces a binary (or limited) choice (request/don't request; claim/don't claim; join/don't join).
          *   **Small individual impact:** One person's action has negligible effect on the collective outcome *by itself*.
          *   **Decisive collective impact:** The *sum* or *pattern* of all individual actions determines the outcome (whether the song plays, the pot size per claimant, the threshold reached).
          *   **Potential for inefficiency:** The outcome where everyone follows their individual incentive (request, claim, not join) can be collectively worse (song never plays, pot vanishes, threshold not met) than a different coordinated outcome.
      *   **Your Flavors:**
          *   **Exactly-One:** This is a pure **Anti-Coordination Game** or **Volunteer's Dilemma**. Success requires *exactly one* person to act (volunteer), but acting carries a risk (if others also act, you "spoil" it). The stable outcome is often *no one acting*, which is bad for all.
          *   **Divided-Pot:** This is a classic **Common Pool Resource Problem** or a **Rivalrous Good** scenario (like the **Tragedy of the Commons**). The resource (pot) is diminished by each additional claimant. Individual incentives (claiming) lead to overuse and depletion, a worse outcome for all than if fewer claimed or claims were limited. It exhibits **negative network effects**.
          *   **Threshold:** This is a **Threshold Public Goods Game** or an **Assurance Game** variant. The good (strike success, petition win) is produced *only* if a sufficient number contribute (join). My contribution only matters near the threshold. The risk is that everyone waits for others, leading to under-provision. Coordination/assurance is key.
      *   **Confidence:** **Very High (95%)**. Your three flavors are canonical examples within the broader class of Collective Action Problems characterized by aggregative effects.

  2.  **The Reasoning Move:**
      *   **Name:** This move is known as the **Universalization Principle**, **Kantian Reasoning**, or **Kantian Optimization** (especially in economics/game theory). It asks, "What if *everyone* did what I propose to do?" and evaluates the desirability of *that* outcome.
      *   **Distinction:** While the *situation* is the CAP, the *reasoning move* itself is this specific heuristic/principle. It's distinct from other solution concepts like Nash Equilibrium (predicting what *will* happen given others' actions) or Pareto Efficiency (evaluating if an outcome can be improved without harming anyone).
      *   **Confidence:** **High (85%)** on the name "Universalization Principle" or "Kantian Reasoning" for the move itself. "Kantian Optimization" is more specific to economic modeling using it.

  3.  **The Line: When is the Move Sound vs. Fallacious?**
      *   **The Key Difference:** It hinges on **Strategic Interdependence** and **Aggregate Effects**.
          *   **Sound in CAPs (Your Flavors):** In these problems, the outcome *fundamentally depends* on the *aggregate* choices of *all* individuals who are *similarly situated* and face *similar incentives*. The payoff or utility of *each* individual is *directly and significantly affected* by the *total number* or *pattern* of others making the same choice. Your action *changes the environment* for others (e.g., claiming reduces the pot for others; joining moves the total closer to the threshold for others; requesting increases the chance of spoiling for others). The "what if everyone did that" question directly probes the *collective consequence* of *all* individuals following the *same individual incentive structure*, which in these cases leads to a bad outcome. Acting against the purely selfish choice *can* (if enough others do it) lead to a better collective outcome.
          *   **Fallacious in Non-CAPs (Plumber Example):** Here, the choices are largely **independent**. My choice of career (plumber vs. historian) has negligible impact on:
              *   The *payoff* or *opportunities* available to *other individuals* making career choices.
              *   The *aggregate social value* of plumbing vs. history (within broad limits). Society needs many plumbers *and* historians.
              *   The *incentives* others face. My becoming a historian doesn't make plumbing more lucrative or attractive for others, nor vice-versa (again, within broad limits).
          The "what if everyone did that" outcome (all historians, no plumbers) is disastrous, *but* it's not an outcome driven by the *incentives inherent in the individual choice situation*. My individual incentive (study what I love/find rewarding) doesn't logically lead to that disaster *because* others' choices don't meaningfully interact with mine to create that negative aggregate effect. The disastrous outcome only occurs if *everyone* independently makes the *same specific choice*, not because their choices are strategically interdependent. The reasoning confuses a *hypothetical collective consequence* with an *individual incentive* in a context lacking the necessary interdependence.
      *   **The "Tracking" Insight:** You are correct. The move is sound when the choices of others *are* likely to "track" yours *because* they face *identical or very similar incentives in a strategically interdependent environment*. If I reason that claiming is good, and others are identical and reason similarly, then they *will* claim too, leading to depletion. My reasoning about my action *implies* the reasoning of others. In the plumber case, others' choices don't track mine based on incentives; they make independent choices based on their own preferences in a non-rivalrous context.
      *   **Confidence:** **High (85%)** on the strategic interdependence/aggregate effects explanation. The core distinction is robust.

  **Least Confident Point:** **Labeling the reasoning move itself with perfect precision.** While "Universalization Principle" or "Kantian Reasoning" are widely used and apt, some scholars might use slightly different terms or emphasize specific nuances. "Kantian Optimization" is more technical and less common outside formal models. I'm 85% confident in the general label, but the specific terminology might have minor variations across philosophy, economics, and game theory literature.

  **In Summary:**

  *   **Class:** **Collective Action Problems (CAPs)**, specifically **Aggregative Games** (Exactly-One: Anti-Coordination; Divided-Pot: Common Pool Resource; Threshold: Threshold Public Good/Assurance).
  *   **Reasoning Move:** **Universalization Principle** or **Kantian Reasoning**.
  *   **Line:** The move is **sound** when choices are **strategically interdependent** and individual payoffs depend **significantly on the aggregate choices of others** (your flavors). It's **fallacious** when choices are largely **independent** and lack these aggregate spillover effects (plumber example). The key is whether the "everyone" scenario is a plausible consequence of *each individual* following their perceived incentive *within the interdependent structure*.
