  ## Citizens' Assembly Speech: A Stable, Accountable Path Forward  

  (Five Minutes - Clear, Persuasive, Grounded)  

  ---

  **Good morning, everyone.** We’ve spent weeks wrestling with the most fundamental question a society can ask: *How should we govern ourselves?* We’ve heard compelling arguments for different models. My proposal – let’s call it the **Stability Plan** – offers something different. It’s not Westminster. It’s not pure presidential. It’s a careful blend designed for **accountability** and **stability**, addressing weaknesses in both extremes.  

  Yes, Dave raises a fair concern: *Could two leaders, both with democratic backing, clash?* It’s a real consideration. But let’s be honest: In the Westminster model we’re comparing it to, voters *never directly choose* their head of government. Parties choose the Prime Minister *after* the election, behind closed doors. That “short chain of accountability” Dave champions? It’s a chain *to the party machinery*, not directly to you, the voter.  

  Our plan changes that. **You directly elect the President.** For one single, six-year term. That’s your voice, clear and unambiguous, choosing the nation’s top leader. No party backroom deals deciding it for you. The President’s job? To represent the entire nation, oversee the big picture, ensure stability, and crucially – **appoint the Prime Minister who actually runs the government day-to-day.**  

  "But what about gridlock?" you ask. We prevent it. Parliament holds the real power over policy and spending. And crucially, **Parliament can fire the Prime Minister... but only if it immediately agrees on a replacement.** No more endless cycles of collapsing governments and snap elections that paralyze the country and exhaust voters. That’s not a “fudge” – it’s a **safety valve** forcing compromise and continuity. If Parliament *does* remove the PM, the President can’t just dissolve them on a whim – they’re locked in for a year, forcing cooperation.  

  What about the President becoming a tyrant? Safeguards are built in. The President only gets a **temporary pause** on regular laws – a “suspensive veto.” If Parliament votes *again* and stands by its decision, the law passes. That’s not weakness; it’s **balance.** It forces dialogue without giving the President ultimate power. And that single six-year term? It means the President isn’t constantly campaigning or beholden to short-term party interests. They can focus on the nation’s long-term health.  

  Dave’s right that no system is perfect. Power *is* shared here. But that’s the strength, not the flaw. We’ve seen “pure” systems struggle. Westminster can lead to unstable coalitions and PMs nobody directly chose. Pure presidential systems can crash when a President and Parliament are at war.  

  Our **Stability Plan** offers a third way:  
  1.	**Direct Accountability:** You choose the President.  
  2.	**Stable Government:** No revolving door of PMs. No endless elections.  
  3.	**Parliamentary Control:** Real power stays with your elected representatives on laws and money.  
  4.	**Checks and Balances:** No one person or branch gets unchecked power.  

  It delivers the direct voice people crave in choosing their top leader, while keeping the practical, day-to-day governance anchored in a parliament that must work together or find a workable alternative *without* chaos. It combines choice with stability, accountability with restraint.  

  On Sunday, we’re not just voting for a system; we’re voting for the foundation of our future. Let’s choose a foundation built for the long haul – one that gives power directly to the people, demands cooperation from politicians, and protects us from paralysis. Let’s build stability *with* accountability.  

  **Takeaway: This plan gives you direct choice for the top job while ensuring stable, cooperative government that can’t be derailed by endless political games.**
