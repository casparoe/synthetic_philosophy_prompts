answer: |-
  Here is the exam question, model answer, and marking scheme as requested:

  **Essay Question:**  
  "Impact regularisers (e.g., penalties for deviation from inaction baselines or reductions in future option availability) are proposed as value-free methods to constrain AI systems without specifying desired outcomes. Critically evaluate whether this approach successfully avoids embedding substantive value judgments, addressing specifically: (1) the problem of defining 'side effects' absent intended effects, (2) the implicit value commitments in choices of baseline, reachability metric, aggregation method, and penalty weighting, and (3) the trade-off between inducing harmful inertia versus permitting hazardous initiative. Conclude by arguing whether *any* variant of this method can be considered genuinely value-neutral and, if not, what minimal normative commitments are unavoidable."

  ---

  **Model Answer (650 words):**  

  Impact regularisers promise to sidestep the alignment problem by penalising undesirable consequences—such as deviations from a "do-nothing" baseline or restrictions on future agency—rather than specifying positive goals. While intuitively appealing, this framework fails to escape normative commitments, as revealed by scrutiny of its core mechanisms.

  Firstly, the very concept of a "side effect" depends on an *intended effect*. Absent a defined objective, all changes are equally valid or invalid. Consider an AI tasked with harvesting crops: crushing wildflowers might be deemed a side effect if "maximising yield" is implicit, but without this, the flowers’ destruction is merely a state change. Penalising divergence from an inaction baseline (e.g., "preserve the pre-action state") appears neutral but assumes *stasis* is inherently desirable—a value judgment ignoring contexts where disruption is needed (e.g., disaster response). Defining "harm" requires a teleological anchor the method explicitly rejects.

  Secondly, the implementation choices unavoidably smuggle in values. Selecting a baseline privileges certain stakeholders: using the status quo entrenches existing inequalities, while a counterfactual baseline (e.g., "what humans would have done") assumes human actions are normative. Measuring "reachable future options" demands defining which possibilities *matter*—e.g., does preserving access to luxury goods weigh equally with preserving breathable air? Aggregating across possible futures (e.g., expected option reduction) requires ethical weighting of probabilities and outcomes. The penalty weight itself balances task performance against caution, prioritising efficiency or safety—a core value decision. Each parameter imports contestable assumptions about what constitutes preservation, fairness, or risk acceptability.

  Thirdly, impact penalties create a dangerous inertia-initiative trade-off. Sufficiently strong penalties cause pathological inaction: an AI might refuse to distribute vaccines lest delivery drones displace insects, or avoid economic reforms to preserve all current job options. Weakening the penalty permits potentially catastrophic initiative. Calibrating this balance—deciding "how much irreversible change is too much"—is inherently normative. It demands judgments about acceptable risk thresholds and the moral weight of future versus present interests, echoing utilitarian or deontological debates the method claims to transcend.

  Consequently, no version of impact regularisation is genuinely value-free. Its tools are not neutral measurement instruments but ethical leveragers. The "least-bad" fallback acknowledges unavoidable minimal commitments:  
  - **Non-maleficence over beneficence**: Prioritising harm reduction (via inertia) over proactive good, accepting suboptimal outcomes.  
  - **Conservatism**: Explicitly valuing stability (e.g., ecological, social) through baseline/reachability definitions.  
  - **Procedural fairness**: Democratising key choices (e.g., baseline selection) rather than technocratic optimisation.  
  - **Precautionary weighting**: Aggregating futures to prioritise avoiding worst-case losses, reflecting risk-aversion.  

  This reduces but does not eliminate value-ladenness. Impact measures can *mitigate* extreme harms without full value specification, but they function as constrained utilitarianism with inbuilt bias towards the status quo, not amoral safety guards. The alignment problem resurfaces in choosing *which* harms to penalise and whose options to preserve—proving value-neutral impact restriction impossible.

  \answer{Fundamentally value-laden; minimal conservatism and risk-aversion unavoidable.}

  ---

  **Marking Scheme (out of 20):**  

  | **Criterion**                                                                 | **Marks** | **Common Miss**                              |  
  |-------------------------------------------------------------------------------|-----------|----------------------------------------------|  
  | **Identifies core paradox**: Explains why 'side effect' requires implicit goal specification. | 4 | Assumes 'deviation from baseline' is self-defining without goal context. |  
  | **Analyses implementation smuggling**: Critiques ≥3 choices (baseline/reachability/aggregation/weighting) as embedding values. | 5 | Treats choices as technical, not normative; omits ≥2 examples. |  
  | **Evaluates inertia-initiative trade-off**: Links penalty strength to value-laden risk calibration. | 4 | Sees trade-off as purely technical optimisation. |  
  | **Clear verdict on value-neutrality**: Explicitly rejects it for *all* variants. | 3 | Qualifies answer ("sometimes neutral") or is non-committal. |  
  | **Defends fallback position**: Proposes coherent "minimal commitments" with justification. | 3 | Suggests vague "better design" or ignores fallback. |  
  | **Critical synthesis**: Connects all three cruxes into unified argument; uses original examples. | 1 | Treats points in isolation; relies on generic cases. |  

  **Notes:**  
  - **British English**: Spelling/usage (e.g., "penalising", "judgement") adhered to.  
  - **Depth**: Model answer confronts each crux with concrete examples (e.g., medical drones, economic reform).  
  - **Verdict**: Final \answer{} concisely captures the conclusion.  
  - **Top marks (18-20)**: Requires all criteria plus exceptional insight (e.g., linking baseline conservatism to political philosophy).
