prompt: |-
  I run a small podcast about law, morality, and public life. I have no formal training in philosophy, but I have spent the last year thinking my way through the Hart–Devlin debate and the wider question of legal moralism. Next month my guest is a philosopher who defends a version of legal moralism that is not the standard one. Her claim is that the law may enforce certain moral norms not because the conduct they prohibit is wrong in itself, but because the norm is a shared resource — part of what she calls the moral commons — and that free-riding on it damages the collective capacity for self-rule. I want the interview to put pressure on that view rather than let her restate it. Please give me a sequence of around a dozen questions, each followed by a follow-up that anticipates the answer she is most likely to give. I need at least one question on how she separates a norm that is a genuine shared resource from one that is merely widespread or traditional; one on whether her position can avoid collapsing into the harm principle or into ordinary paternalism; one on what her view implies when the moral commons is unjust, exclusionary, or itself the product of domination; one on how the law should act when the relevant norm is seriously contested among citizens; and one final question about what evidence or argument could count against her view. The questions should press on the load-bearing parts of her position — especially the baseline against which free-riding is measured, and what she would say about a case where enforcing the norm would preserve the commons but impose serious costs on a dissenting minority. Please do not include generic questions about how she became interested in the topic, and do not give me a reading list or citations.
reasoning: |-
  Okay, the user runs a law and morality podcast and is preparing to interview a philosopher with a unique take on legal moralism centered around the "moral commons." They want sharp questions that challenge her view, not just let her restate it. Key pressure points needed: distinguishing genuine shared resources from mere traditions, avoiding collapse into harm principle/paternalism, handling unjust commons, contested norms, and falsifiability. 

  Hmm, they’re clearly well-versed in Hart-Devlin but lack formal philosophy training—so questions must be incisive yet accessible. Their urgency suggests they’ve already done deep research and now need tactical interrogation tools. 

  First, unpacking the "moral commons" metaphor is crucial. The follow-up to Q1 should anticipate her defining it as collective self-rule infrastructure, then immediately push on how that differs from tradition (Q2). Need to trap the distinction between functional necessity and historical accident. 

  For the harm principle collapse risk (Q3), she’ll likely argue enforcement protects the system, not individuals. Good—that sets up Q4’s paternalism counter: if the "commons" requires forcing dissenters "for their own good," hasn’t she smuggled in paternalism? 

  The injustice angle (Q5) is where this could unravel. If she appeals to procedural fairness (Q5 follow-up), Q6 must demand why law should enforce exclusionary norms even temporarily. Historical examples like segregation will test if her theory can condemn status quos. 

  Contested norms (Q7) need a concrete case—vaccines? Religious exemptions? Her "salience" reply (Q7 follow-up) invites Q8’s challenge: doesn’t prioritizing majority views risk tyranny? Must force her to address minority costs. 

  Baseline issues (Q9) are the structural weak point. If she cites status quo or idealized history (Q9 follow-up), Q10’s apartheid example exposes circularity: what if the baseline itself corrupts the commons? 

  Finally, falsifiability (Q11): she’ll point to norm collapse without enforcement. Q12’s knife-edge question—forcing her to either abandon non-harm cases or admit dissenters pay unfair costs—could corner the theory. 

  ...Did I cover all requested angles? *Checks*: shared-resource distinction (Q2), harm/paternalism collapse (Q3-4), unjust commons (Q5-6), contested norms (Q7-8), baseline (Q9-10), falsifiability (Q11-12). The cost-to-dissenters demand appears in Q8 and Q12. Solid. 

  User’s framing suggests they suspect this "commons" idea is either paternalistic or conservative in disguise. These questions weaponize her own premises to test that.
answer: |-
  Here’s a focused sequence designed to probe the structural tensions in your guest’s position, with follow-ups anticipating likely replies. Each question targets a specific load-bearing element of her "moral commons" theory:

  1.  **Core Mechanism:** "You argue the law can enforce norms to protect the 'moral commons' from free-riding, preventing damage to our collective capacity for self-rule. **Can you precisely define the causal mechanism here? How does an individual's free-riding on a specific norm *actually* degrade the broader collective capacity for self-governance?**"
      *   *Anticipated Reply/Likely Focus:* She'll likely emphasize norms as foundational social capital enabling trust, coordination, or shared understanding necessary for democratic deliberation and collective action. Free-riding erodes this capital.
      *   **Follow-up (Targeting Specificity/Scope):** "Understood. But surely not *every* widely shared moral norm is essential for self-rule? **What specific functional criteria distinguish a norm that is genuinely *constitutive* of the moral commons necessary for collective self-governance, from one that is merely a popular tradition, preference, or even a widespread prejudice?**"

  2.  **Distinguishing from Tradition:** "Building on that, **how do you rigorously avoid collapsing 'shared resource essential for self-rule' into 'norm that is currently widespread or historically entrenched'? Isn't there a risk your framework simply privileges the status quo?**"
      *   *Anticipated Reply/Likely Focus:* She’ll stress the functional link established in Q1 – it’s not popularity per se, but the norm’s demonstrable role in sustaining the necessary conditions for a self-governing polity.
      *   **Follow-up (Testing the Boundary):** "So, if a community deeply valued a norm of, say, strict Sunday quietness based on religious tradition, but its violation demonstrably *didn’t* undermine general trust or the ability to deliberate on public affairs, **your framework would *not* permit legal enforcement simply to preserve the tradition itself, correct? How do you empirically verify the 'essential for self-rule' link?**"

  3.  **Collapse into Harm Principle?:** "The harm principle argues law can restrict conduct to prevent harm to others. **How does your 'protecting the commons' justification differ? Is preventing damage to the 'commons' just preventing a diffuse, collective harm? If so, doesn't this collapse your view into a broader version of the harm principle?**"
      *   *Anticipated Reply/Likely Focus:* She’ll argue it’s distinct because the harm is not (just) to specific individuals, but to the *systemic infrastructure* enabling self-rule itself. The "victim" is the collective capacity, not aggregated individuals.
      *   **Follow-up (Collapse into Paternalism?):** "But if the justification rests on protecting the *collective capacity* for self-rule, even against the choices of individuals who reject the norm, **doesn't this become a form of collective or systemic paternalism? Aren't you saying the state knows better than the dissenter what's necessary for *their own* capacity to participate in self-rule?**"

  4.  **The Unjust Commons:** "History shows dominant groups often establish 'moral commons' that are exclusionary or oppressive – norms denying rights based on race, gender, or sexuality, justified as essential for 'public morality' or 'social order'. **If the existing moral commons itself embodies injustice or is a product of domination, what does your theory prescribe? Should the law still enforce those norms to preserve the 'shared resource' for self-rule?**"
      *   *Anticipated Reply/Likely Focus:* She'll likely argue that such norms are *not* genuinely part of the moral commons essential for *just* self-rule; they are distortions or corruptions that *undermine* true collective capacity by excluding voices.
      *   **Follow-up (Baseline & Change):** "But how do you determine *from within your framework* that the existing norm is exclusionary rather than genuinely constitutive? Doesn't this require an *external* standard of justice? **If enforcing the *current* norm (even an unjust one) seems necessary to preserve the *current* structure enabling *any* collective action (flawed as it is), doesn't your theory risk demanding its enforcement until the 'commons' itself can be reformed? How does reform occur if challenging the norm is seen as free-riding damaging to the very system needed for reform?"**

  5.  **Contested Norms & Legitimacy:** "In a pluralistic society, many potential 'commons' norms are deeply contested. Citizens fundamentally disagree on their moral status or importance. **When a norm is seriously contested, how can the law legitimately enforce it *as* part of the essential moral commons? Doesn't enforcement under contestation itself damage the perceived legitimacy crucial for self-rule?**"
      *   *Anticipated Reply/Likely Focus:* She may argue that salience and functional necessity matter more than unanimity. Or that some core norms, even if contested by minorities, remain essential scaffolding. She might emphasize procedural legitimacy in determining what counts as "commons".
      *   **Follow-up (Costs to Dissenters & Stability):** "So, if a significant minority genuinely views a legally enforced norm (e.g., certain family structures, definitions of civic duty, obligations during a pandemic) as oppressive or deeply mistaken, but the majority deems it essential for the commons, **doesn't enforcing it impose severe moral and psychological costs on dissenters *in the name of preserving the system that excludes their view*? How does this not create precisely the alienation and resentment that erodes the commons over time?"**

  6.  **The Baseline Problem:** "Your concept of 'free-riding' implies a baseline: what level of adherence is required to maintain the commons? **How is this baseline determined? Is it the status quo level of adherence? An idealized past level? A theoretical minimum?**"
      *   *Anticipated Reply/Likely Focus:* She might appeal to empirical observation of norm erosion leading to dysfunction, or a functional requirement derived from political theory (e.g., level X of social trust needed).
      *   **Follow-up (Arbitrariness & Power):** "But absent precise measurement, **isn't the baseline inherently contestable and vulnerable to manipulation? Doesn't this give the state (or dominant groups) significant power to define what counts as 'free-riding' and thus justify enforcement against disfavored groups or practices, simply by claiming adherence has dipped below a necessary (but vaguely defined) threshold?**"

  7.  **The Cost-Benefit Threshold:** "Imagine enforcing a contested norm demonstrably *would* preserve the stability of a specific aspect of the moral commons, but only by imposing severe, demonstrable hardship or restricting fundamental liberties of a dissenting minority (e.g., enforced conformity on religious dress, mandatory participation in symbolic acts). **Does your theory have a threshold? When do the costs *to the dissenters* outweigh the benefit *to the commons* of preventing free-riding?**"
      *   *Anticipated Reply/Likely Focus:* She might argue that preserving the essential commons is paramount for the possibility of *any* just self-rule, implying a high threshold. Or she might introduce proportionality balancing.
      *   **Follow-up (The Knife-Edge - Final Pressure):** "If the cost to dissenters is always potentially justified by the imperative to save the commons, **doesn't this make dissenters hostages to the perceived fragility of the majority's preferred norms? And if the costs *do* sometimes outweigh the commons benefit, haven't you reintroduced a harm principle (to the dissenters) or a liberty principle as the *overriding* constraint, making the 'commons' justification secondary?"**

  8.  **Falsifiability:** "Finally, to test the robustness of your view: **What specific evidence or observed phenomenon would genuinely count against your theory? What real-world scenario would force you to conclude that legal enforcement based *solely* on protecting the moral commons from free-riding, absent independent wrongness or direct harm, was unjustified or caused more damage to self-rule than it prevented?**"
      *   *Anticipated Reply/Likely Focus:* She might point to historical examples where norm collapse *didn't* damage self-rule, or where enforcement *did* cause systemic damage despite preserving the norm. Or she might argue such cases would show the norm wasn't *truly* part of the essential commons after all.
      *   **Follow-up (Theory or Tautology?):** "If counter-evidence is explained away by redefining what counts as the 'essential' commons or 'genuine' free-riding damage, **doesn't that risk making the theory unfalsifiable? How do we avoid it becoming a justification for whatever norms the enforcer deems important?**"

  **Key Pressures Applied:**
  *   **Shared Resource vs. Tradition:** Q1, Q2, Q2 Follow-up.
  *   **Collapse into Harm/Paternalism:** Q3, Q3 Follow-up, Q7 Follow-up.
  *   **Unjust Commons:** Q4, Q4 Follow-up.
  *   **Contested Norms:** Q5, Q5 Follow-up.
  *   **Baseline & Free-Riding:** Q6, Q6 Follow-up.
  *   **Costs to Dissenters:** Q5 Follow-up, Q7, Q7 Follow-up.
  *   **Falsifiability:** Q8, Q8 Follow-up.

  This sequence forces clarification of the core mechanisms, tests boundaries with hard cases, exposes potential contradictions or external dependencies (especially regarding justice), highlights the risks to dissenters and legitimacy, and challenges the operationalizability and falsifiability of the core concepts. Good luck with the interview!
