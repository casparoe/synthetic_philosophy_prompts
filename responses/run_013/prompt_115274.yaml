  **INTERNAL MEMORANDUM**

  **To:** All Shareholders, Line Management (Levels 1-5), Population Oversight  
  **From:** Office of Fitness Accounting (OFA)  
  **Subject:** Revision to Policy F-7: Recognition of Fitness Revenue and Expense Attribution  
  **Date:** October 26, 2023  
  **Reference:** OFA Directive 2023-11  

  ---

  **1. POLICY UPDATE SUMMARY**

  Effective immediately (Cycle Start: Q1 FY 2024.1), the Office of Fitness Accounting (OFA) mandates a shift in the primary level at which net fitness differentials shall be formally recognized as consolidated revenue in the Lineage-Wide Ledger (LWL). Previously, Individual Organism-Level (Vehicle-Level) was the default primary booking level (Policy F-7 Rev. 8). Henceforth, **Group-Level (Trait Group/Deme-Level)** shall be designated as the primary level for fitness revenue recognition and expense attribution, contingent upon meeting specific Heritable Variance Thresholds (HVT, see Clause 3.1). This revision aims to enhance the accuracy of our fitness variance decomposition reporting and provide a more transparent picture of causal efficacy impacting shareholder returns.

  **2. RATIONALE**

  Analysis conducted by the OFA and the Committee on Levels of Booking (CLB) indicates that the previous Vehicle-Level default booking inadvertently obscured significant causal pathways impacting long-term shareholder (Replicator) value. Variance decomposition exercises consistently revealed substantial between-group fitness components in numerous divisions, particularly under structured population dynamics. Persisting with Individual-Level booking as primary commits a fallacy of averaging, misattributing the source of differential success and hindering strategic resource allocation towards genuinely synergistic adaptations. Recognizing Group-Level fitness directly reflects the causal reality where selective pressures operate decisively on collective phenotypic properties, generating revenue streams inaccessible to isolated individuals. This shift aligns our accounting practices with the demonstrable causal architecture observed in key operational theatres.

  **3. DETAILED POLICY CLAUSES**

  3.1. **Primary Booking Level:** Fitness Revenue (ΔW) shall be initially recognized at the Group-Level (Trait Group or Deme, as defined by contextual interaction boundaries per Division SOPs) for all populations where the Heritable Between-Group Variance Component (HBGVC) exceeds the established HVT of 0.15 * Total Heritable Variance (THV) in the relevant fitness proxy measure. Revenue booked at Group-Level represents the net fitness differential attributable to the group *as a unit*.

  3.2. **Secondary Attribution:** Following Group-Level booking, OFA Form G-A1 ("Group-to-Vehicle Fitness Allocation") must be submitted to attribute consolidated Group Revenue down to individual Organism-Level (Vehicle) accounts. This attribution *does not* represent primary revenue generation but reflects the individual's contribution *within the group context*. Expenses (e.g., metabolic upkeep, trait expression costs, mortality risk) remain primarily attributed at Vehicle-Level.

  3.3. **Altruism/Cooperation Designation:** Traits resulting in a net Vehicle-Level fitness *cost* to the bearer, but contributing to a net Group-Level fitness *gain* exceeding the sum of individual costs (i.e., synergistic), shall be reclassified as **Cooperative Investments** on the bearer's ledger. The term "Altruism Expense" is deprecated for such traits under this policy, reflecting their revenue-generating role at the operative level. Traits benefiting the bearer at Vehicle-Level cost to the Group remain classified as **Selfish Withdrawals**.

  3.4. **Free-Rider & Cheater Mitigation:** Divisions reporting chronic Free-Rider issues (individuals benefiting from Group Revenue without proportional Cooperative Investment) or Cheating (active subversion of group functions for Vehicle-Level gain) must implement enhanced Population Structure Monitoring (PSM) and Relatedness Audits (RA, Form RA-7). Persistent failure to maintain HBGVC above HVT, or control Free-Rider/Cheater prevalence below 5% of group mean Cooperative Investment, may trigger OFA review and potential reversion to Individual-Level primary booking for that Division/Deme.

  3.5. **Rogue Shareholder Protocol:** Certain Shareholder classes, notably Class II Transposable Elements (TEs), exhibit persistent non-compliance with Corporate Bylaws (e.g., fair meiosis, proportionate replication). Their fitness gains, often achieved via Vehicle-Level detriment without corresponding Group-Level benefit, constitute **Parasitic Withdrawals**. Such gains are *excluded* from consolidated Group Revenue calculations and booked directly as negative entries against the affected Vehicle and Genome Division ledgers. Dispute resolution for contested Rogue Shareholder classifications follows Appendix B.

  3.6. **Kin Selection Reconciliation:** The OFA clarifies that Kin Selection (KS) mechanisms represent a specific *method* for achieving high within-group Relatedness (r), thereby facilitating the evolution of Cooperative Investments under Group-Level selection. KS accounting (e.g., Hamilton's Rule calculations) provides valuable predictive tools for Form G-A1 attribution *but does not constitute a rival accounting framework*. Group-Level booking subsumes KS outcomes within its variance decomposition.

  **4. REPORTED OBJECTIONS & OFA RESPONSE**

  The proposed revision has undergone extensive stakeholder consultation. Key objections raised and the OFA's position are summarized:

  *   **Objection 1 (Individual-Level Booking Advocates):** "Group-Level revenue is merely a re-partitioning of the same total fitness variance captured at the Individual-Level. Booking it at Group-Level implies a distinct causal process that doesn't exist, adding unnecessary complexity. The 'real' revenue generator is always the individual organism interacting directly with its environment."
      *   *OFA Response:* While the *total* variance is fixed, the *partitioning* reveals distinct causal pathways. Ignoring a significant HBGVC commits the averaging fallacy. Complexity is justified by explanatory accuracy. The Individual-Level interaction *is* the mechanism, but the *selective pressure* often acts decisively on group properties.

  *   **Objection 2 (Vehicle-Centric Oversight):** "Re-classifying costly traits as 'Cooperative Investments' instead of 'Altruism Expenses' is misleading. The ledger should reflect the direct, immediate cost/benefit to the Vehicle, its replicators, and its immediate lineage. Group benefits are indirect and probabilistically realized."
      *   *OFA Response:* The ledger must reflect the level at which the trait is *selected for*. A trait causing a direct Vehicle-Level cost but selected *because* it generates Group-Level revenue is fundamentally an investment in that higher-level return. The revised classification aligns cost attribution with the selective benefit's source.

  *   **Objection 3 (Genome Division - Re: Clause 3.6):** "Asserting that Kin Selection is subsumed under Group Selection ignores the fact that high relatedness allows Cooperative Investments to evolve *without* any group-structured variance in fitness, purely via impacts on individual inclusive fitness. Group-Level booking in such cases misattributes causality."
      *   *OFA Response:* High relatedness (r>0) intrinsically creates a population structure where interactors are non-randomly associated. This *is* a group structure (often kin groups) enabling between-group variance. The OFA maintains that contextual analysis under the Price Equation framework demonstrates that KS effects are captured within the Group-Level variance component when groups are appropriately defined by interaction/relatedness. The accounting reflects this unified causal structure.

  **5. IMPLEMENTATION & COMPLIANCE**

  All Division Heads are responsible for ensuring their Population Management teams are trained on the revised Policy F-7 (Rev. 9) and associated forms (G-A1, RA-7) by December 1, 2023. Retroactive variance decomposition for Q4 FY 2023.4 must utilize the new methodology. Compliance will be audited by the OFA starting Q2 FY 2024.1. Non-compliance may impact resource allocation approvals.

  **6. APPENDIX B: ROGUE SHAREHOLDER DISPUTE FORM (OFADF-3)**

  *(See following page)*

  ---

  **Sincerely,**

  **Dr. A. G. Gregor**  
  Chief Accountant, Office of Fitness Accounting  
  *Ensuring Causal Clarity in Evolutionary Ledgers*

