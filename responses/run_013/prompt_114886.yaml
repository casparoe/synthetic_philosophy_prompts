   Positions to map to:
   1. Simply wrong: The theory was incorrect.
   2. Never tested: The prediction was conditional (e.g., "if nothing changes") and things changed, so it wasn't tested.
   3. Trend right, timing wrong: The theory captured the correct trend but the timing was off.
   4. Unfalsifiable: The theory can be interpreted to fit any outcome, so it's not scientific.
   5. Self-defeating: The prediction caused actions that prevented it, so the theory is valid but the outcome was altered by the theory itself.
   6. Kept alive by patching: The theory should have been abandoned but was saved by ad hoc adjustments.

   We also want to note if there are intermediate positions and if any answer patterns don't map to a clear position.

