  ### Quiz: When Predictions Fail—What's the Real Story?  
  Test your stance on why predictions don't come true. No labels—just cases and claims. Answer honestly to discover your underlying position.  

  ---

  #### **Question 1: The Doctor’s Warning**  
  **Scenario**: A doctor says, "Without lifestyle changes, you’ll die in 5 years." You change everything and live 20 more years.  
  **Your view**:  
  - A) The doctor was wrong—you lived.  
  - B) The doctor was right *about what would happen without change*—but you changed the conditions.  
  - C) The doctor’s warning *caused* your change, proving the theory right.  

  #### **Question 2: The Stock Market Crash That Wasn’t**  
  **Scenario**: An analyst predicts a market crash next month. It doesn’t happen.  
  **Your view**:  
  - A) The analyst was wrong—no crash occurred.  
  - B) Conditions changed (e.g., government intervention), so the prediction wasn’t tested.  
  - C) The prediction itself spooked investors, preventing the crash.  
  - D) The crash might still happen—timing was just off.  

  #### **Question 3: Y2K Bug**  
  **Scenario**: Experts predicted Y2K would cause global chaos. Billions were spent fixing it; disaster was averted.  
  **Your view**:  
  - A) The experts were wrong—nothing happened.  
  - B) The fixes *caused* the non-disaster, validating the prediction.  
  - C) The prediction was about *unfixed systems*—and those would have failed.  

  #### **Question 4: Doomsday Preacher**  
  **Scenario**: A preacher sets a date for the apocalypse. The date passes uneventfully.  
  **Your view**:  
  - A) The prophecy was false—full stop.  
  - B) The prophecy can be reinterpreted (e.g., "spiritual" end) or the date recalculated.  
  - C) The warning caused repentance, *delaying* the end.  

  #### **Question 5: Malthusian Crisis**  
  **Scenario**: Malthus predicted mass famine from overpopulation. Instead, fertilizer/tech boosted food supply.  
  **Your view**:  
  - A) Malthus was wrong—no global famine occurred.  
  - B) He was right *if no tech advances happened*—but they did.  
  - C) The core trend (population strain) is real—crisis is still looming.  
  - D) His warnings *spurred innovation*, preventing the crisis.  

  #### **Question 6: Rain Forecast**  
  **Scenario**: A 90% chance of rain is forecast. It stays dry.  
  **Your view**:  
  - A) The forecast was wrong—it didn’t rain.  
  - B) 90% ≠ 100%—the 10% chance occurred.  
  - C) "90% chance" is unfalsifiable; no outcome disproves it.  

  #### **Question 7: Abstract Claim 1**  
  **Statement**: "If a prediction doesn’t come true, the theory behind it is flawed."  
  **Your view**:  
  - A) Agree  
  - B) Disagree  

  #### **Question 8: Abstract Claim 2**  
  **Statement**: "Predictions that cause preventative action *and then ‘fail’* actually prove the theory right."  
  **Your view**:  
  - A) Agree  
  - B) Disagree  

  #### **Question 9: Abstract Claim 3**  
  **Statement**: "When predictions fail, it’s acceptable to adjust the theory (e.g., extend timelines, add conditions) instead of scrapping it."  
  **Your view**:  
  - A) Agree  
  - B) Disagree  
  - C) Depends on how it’s done  

  ---

  ### Answer Key: Mapping Your Pattern to Positions  
  Score your answers using the table below. The position with the *most matches* is your primary stance. Positions are defined at the end.  

  | **Question** | **A** | **B** | **C** | **D** |  
  |--------------|-------|-------|-------|-------|  
  | **1** | 1 | 2 | 5 | — |  
  | **2** | 1 | 2 | 5 | 3/6 |  
  | **3** | 1 | 5 | 2 | — |  
  | **4** | 1 | 4/6 | 5 | — |  
  | **5** | 1 | 2 | 3/6 | 5 |  
  | **6** | 1 | 2 | 4 | — |  
  | **7** | 1 | 2/3/4/5/6 | — | — |  
  | **8** | 5 | 1/2/3/4/6 | — | — |  
  | **9** | 6/4 | 1 | — | — |  

  #### **Positions**  
  1. **Simply Wrong**: The theory was incorrect. Failed predictions = falsification.  
  2. **Never Tested**: Predictions were conditional (e.g., "if nothing changes"). Changes voided the test.  
  3. **Trend Right, Timing Wrong**: The core trend was valid, but timing/scale was off.  
  4. **Unfalsifiable**: The theory is immune to failure—any outcome "confirms" it.  
  5. **Self-Defeating**: The theory *caused* preventative action, creating the "failure."  
  6. **Kept Alive by Patching**: The theory is salvaged post-failure with ad hoc adjustments.  

  #### **How to Score**  
  - Tally matches for each position (e.g., if you chose "A" for Q1, give Position 1 a point).  
  - For options tied to two positions (e.g., 3/6), split a point (0.5 each).  
  - Your position = highest score. Close ties mean a hybrid view.  

  #### **Key Insights**  
  - **Clear Distinctions**: Positions 1, 2, and 5 are well-separated. Positions 4 and 6 often overlap (both "excuse" failure).  
  - **Blurry Lines**:  
    - Position 3 (Trend Right) and 6 (Patching) are hard to split—both justify delays.  
    - Position 4 (Unfalsifiable) and Q6C are tightly linked.  
  - **Incoherent Combos**: High scores in both 1 (Simply Wrong) and 5 (Self-Defeating) are rare—they conflict on whether the theory had merit.  
  - **"Unnamed" Position**: If you scored highly in 2 (Never Tested) and 3 (Trend Right), you hold a hybrid view: *"The threat was real but circumvented by external solutions."*  

  #### **Why This Works**  
  - Real-world cases (Doctor, Y2K, Malthus) force you to reveal *how* you judge failure.  
  - Abstract claims (Q7–9) expose your tolerance for adjusting theories.  
  - Positions 4 and 6 cluster (e.g., Doomsday Q4B)—this reflects real debate (e.g., "Malthus was early" vs. "Malthusianism is unfalsifiable").  

  Let the quiz sort you—not the label. (And yes, Malthusians might squirm.)
