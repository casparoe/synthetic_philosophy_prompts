prompt: |-
  I write a column on science and ideas, and I have been reporting on the unilateralist's curse—the pattern where each of many actors can take an action that would be good if only one did it but bad if many did, so that individually reasonable choices add up to a bad outcome. I want to pin down my own verdicts on a set of cases before I write the column, because I suspect they do not all hang together. A lone researcher who can synthesize a dangerous pathogen: I think publishing is wrong if several others are close to the same result, but permissible if she is genuinely the only one who could do it and the defensive payoff is large. An engineer at one of many labs that could each release a similar open-source model: I think each lab should refrain, yet if she is confident the others will release anyway, I feel she may as well release too—though I am uneasy about that verdict. A doctor with a controversial but well-supported finding: publish if the evidence is strong, not if it is weak, even though a single weak publication does little harm on its own. An activist who can unilaterally block a pipeline: acting is permissible when she is likely to be pivotal, not when she is merely one more body in a crowd. A person considering whether to raise a friend's drinking problem: she should raise it if she has a unique relationship with him, not otherwise. A donor to a matching campaign: giving is fine if her gift is the one that triggers the match, not if it merely adds to an already overfunded pool. A council member who can leak a report: leaking is permissible if it reveals serious wrongdoing, not if it is merely embarrassing.

  The tension I keep running into is between the engineer and the activist or the donor. In the engineer's case, my sense that she may act if others will act anyway looks like a concession to futility, and in the activist's and donor's cases I treat the same thought—others will act anyway—as no license at all. A game theorist I spoke with suggested the curse is really about actions being substitutes, and that the interesting case is when they are complements, where the good outcome requires many actors rather than one; I want to know whether that distinction does any real work here, or whether the principle should instead be stated in terms of pivotal-ness, expected marginal value, or a norm of restraint that each actor should follow regardless of what she expects others to do. I also cannot tell whether the right unit is the individual action, the rule the individual acts on, or the outcome the group produces.

  Please give me the principle, or a small set of competing principles, that best captures this pattern. State each precisely, say which of my cases motivates each clause, and say what it predicts for cases I have not listed—for instance, an action that is good only if many people do it, an action that is irreversible, or a case where the actor's uncertainty is about whether others are even aware of the option. Then tell me honestly which of my verdicts the principle cannot accommodate; if I have to give one up, tell me which and why. I do not need citations or a reading list—I am after the principle and the cases that force it.
reasoning: |-
  Okay, let me start by unraveling the user's query. They're a science columnist dealing with the unilateralist's curse, which happens when individual actions that seem reasonable lead to a bad outcome when many do them. They’ve listed several cases where they have intuitive verdicts but notice tensions, especially between the engineer releasing a model and the activist blocking a pipeline. The user wants principles to unify these cases, pinpointing where their judgments might conflict.

  First, I need to break down each example they provided. The pathogen researcher, open-source engineer, doctor with a controversial finding, pipeline activist, friend intervention, donor in a matching campaign, and council leaker. The key tension is between the engineer (release if others do) versus activist/donor (only if pivotal). The user mentioned a game theorist's point about substitutes vs. complements, and they're considering pivotalness, marginal value, or norms of restraint.

  The core issue seems to be about when an action's permissibility depends on others' actions. For the engineer, it's a substitute: one release might be fine, but multiple are bad. The activist case is about being pivotal—only acting if your action makes the difference. The donor example is similar to the activist; the donation only matters if it triggers the match. But the engineer's case is different because if others release anyway, the harm happens regardless, so not acting might be futile. 

  The user needs principles that can handle both substitute actions (like the engineer) and complementary ones (where many are needed). They also need to address uncertainty about others' awareness or actions. The principles should be precise and tested against unmentioned cases, like irreversible actions or when actions require many participants.

  I recall that in ethics and game theory, the concept of expected marginal impact is crucial. For each action, the actor should weigh the expected difference their action makes. In the pathogen case, the researcher's impact depends on the probability others will publish. If she’s the only one, her action has high defensive value. If others are close, publishing adds to the curse. The doctor’s case is about evidence strength affecting marginal harm—weak evidence adds noise, strong evidence might be pivotal if it changes consensus.

  The tension in the engineer case is that if others will release regardless, her restraint doesn’t prevent harm, so her marginal impact is near zero. But in the activist case, even if others might act, her action is only permissible if she’s pivotal. Why the difference? Perhaps because in the engineer’s scenario, the harm scales with each additional release, so if others are definitely releasing, her action doesn't change the outcome. For the activist, the pipeline is blocked only if enough people act—so unless she’s pivotal, her action is futile. But the user feels uneasy about the engineer releasing if others do, which might conflict with a norm of collective restraint.

  Another angle is the irreversibility of actions. If a pathogen is published, it can't be undone, so restraint is crucial. But for the engineer, once the model is out, additional releases don't add much harm. The activist’s action might be reversible or not, but pivotalness matters more. The donor’s action is only good if it triggers the match, so marginal impact is binary.

  The user also asked about cases where actions are complements—like needing many to protest for change. Here, if others are likely to act, one person’s participation might have low marginal value unless the movement is on the brink. The principle would advise acting only when there's a reasonable chance of being pivotal.

  Now, applying this to the engineer: if she’s certain others will release, her marginal impact is zero, so acting is permissible? But that feels like surrendering to inevitability. The norm-based principle would say everyone should refrain regardless, to avoid normalizing harmful actions. The user’s unease might stem from this moral tension between consequentialism and deontology.

  For unmentioned cases: irreversible actions would require stricter scrutiny due to higher stakes. Uncertainty about others' awareness—like if someone considers warning about a risk but isn't sure others know. The marginal impact principle would factor in the probability others are unaware, making their action potentially pivotal.

  The user’s verdict that the engineer may release if others do conflicts with the activist/donor cases under the pivotalness principle. To resolve, they might need to accept that for pure substitutes with certain harm from others, acting is permissible if marginal harm is low. But this could erode collective restraint. Alternatively, hold that a norm of restraint should prevail, advising against the engineer releasing even if futile. That means giving up the "may as well" verdict for the engineer, which might align better with avoiding normalization of harmful actions.

  Honestly, the hardest case to accommodate is the engineer. The marginal impact principle allows it if impact is negligible, but the norm principle forbids it. The user must decide between consequentialist and deontological approaches. Given their unease, perhaps they lean towards the norm, advising the engineer to refrain to uphold collective responsibility, even if futile.
answer: |-
  Below are three competing principles that capture the tensions in your cases, each grounded in a different ethical or strategic framework. I'll state each precisely, map them to your cases, extend them to new scenarios, and identify which of your verdicts they struggle with.

  ---

  ### **Principle 1: Expected Marginal Value (Consequentialist)**
  **Definition:**  
  *An action is permissible if and only if its expected marginal net benefit is positive. The marginal net benefit is the difference in expected value between the world where the actor acts and the world where they abstain, given their beliefs about others' actions.*

  - **Key motivation:**  
    - Pathogen researcher (publishing is wrong if others are close; permissible if she’s alone and defensive payoff is high).  
    - Doctor (publish if evidence is strong; refrain if weak, since weak evidence adds noise with little benefit).  
    - Donor (give only if it triggers the match; no marginal value if the pool is overfunded).  
  - **Predictions for new cases:**  
    - *Complementary action (e.g., climate protest):* Acting is only valuable if the protest is near a critical threshold; otherwise, marginal impact is negligible.  
    - *Irreversible action (e.g., extinct species de-extinction):* If the action is irreversible and likely to be replicated, marginal harm increases—restraint is favored.  
    - *Uncertainty about others' awareness (e.g., warning of a risk):* If the actor believes others are unaware, their action has high marginal value; if others likely know, value drops.  
  - **Accommodates your verdicts?**  
    - ✅ Engineer: If others *will* release the model, the marginal harm of her release is near-zero (since harm already occurs). Thus, releasing is permissible.  
    - ✅ Activist/Donor: Acting is only valuable if pivotal (high marginal benefit).  
    - ❌ Council leak: Leaking embarrassing (non-wrongdoing) info has negative marginal value—but you permit it for serious wrongdoing. This principle *forbids it* unless the leak has net positive impact (e.g., sparks reform).  

  ---

  ### **Principle 2: Pivotalness Threshold (Conditional Duty)**
  **Definition:**  
  *An action is permissible only if the actor has sufficient reason to believe they are pivotal—i.e., their action is necessary to achieve a net-positive outcome or prevent a net-negative one.*

  - **Key motivation:**  
    - Activist (block pipeline only if pivotal; refrain if just "one more body").  
    - Donor (give only if it triggers the match).  
    - Council leak (permissible only if it reveals serious wrongdoing—assumes leak is pivotal to accountability).  
  - **Predictions for new cases:**  
    - *Complementary action:* Acting is impermissible unless the actor believes the effort will fail without them (e.g., a strike needs 100 participants; you join only if you believe you’re the 100th).  
    - *Irreversible action:* Heightens the pivotalness requirement (e.g., launching a geoengineering project requires near-certainty you’re the only one who can prevent disaster).  
    - *Uncertainty about others' awareness:* If others might be unaware, acting could be pivotal—so it’s permitted (e.g., whistleblowing when others might not know).  
  - **Accommodates your verdicts?**  
    - ✅ Pathogen researcher: Permissible if she’s the only one (pivotal for defense).  
    - ✅ Doctor: Publishing weak evidence isn’t pivotal (no marginal impact on consensus), so forbidden.  
    - ❌ Engineer: If others *will* release the model, she is **not** pivotal (harm happens regardless). This principle *forbids* her release—contradicting your "may as well" verdict.  

  ---

  ### **Principle 3: Norm of Restraint (Deontic/Coordination Focus)**
  **Definition:**  
  *Actors should follow a rule of restraint when their action belongs to a class of similar actions that, if widely adopted, causes net harm—regardless of expected marginal impact. Permissibility hinges on whether the rule, if universalized, maximizes welfare.*

  - **Key motivation:**  
    - Engineer (each lab should refrain to prevent a race to release).  
    - Pathogen researcher (restraint when others are close avoids normalizing risky publication).  
    - Friend intervention (only raise the issue if you’re uniquely positioned, avoiding collective nagging).  
  - **Predictions for new cases:**  
    - *Complementary action:* Universal participation is good, so the rule *demands* action (e.g., "everyone should vote").  
    - *Irreversible action:* Restraint is *always* required if the action-class is harmful (e.g., "no one should resurrect pathogens").  
    - *Uncertainty about others' awareness:* Restraint still applies (the rule doesn’t depend on others' knowledge).  
  - **Accommodates your verdicts?**  
    - ✅ Doctor: Weak evidence shouldn’t be published (restraint avoids misinformation).  
    - ✅ Activist: Not being pivotal makes restraint the default rule.  
    - ❌ Donor: If others have already funded the pool, your gift isn’t harmful—yet restraint is still demanded by this principle. Your verdict permits it if it triggers a match, but forbids it if the pool is overfunded. This principle *forbids both* unless giving is universally beneficial.  

  ---

  ### **The Tension in Your Verdicts**
  Your conflict between the engineer ("may as well release if others do") and the activist/donor ("only if pivotal") pits **Principle 1** (marginal value) against **Principle 2** (pivotalness). 
  - **Engineer’s case** fits Principle 1: If harm is inevitable, her marginal impact is negligible, so releasing is harmless.  
  - **Activist/donor** fits Principle 2: Acting without being pivotal is wasteful or harmful.  

  **Why the inconsistency?**  
  The engineer’s action is a pure *substitute* (each identical release adds harm), while the activist’s is *threshold-sensitive* (only the pivotal action matters). Principle 1 handles substitutes; Principle 2 handles thresholds.  

  ### **Which Verdict to Give Up?**
  - **Give up the engineer’s "may as well" verdict.**  
    Why? It normalizes harmful actions ("if everyone does it, I can too"), eroding collective restraint. If all engineers reason this way, they *cause* the curse. Principle 2 (pivotalness) or 3 (restraint) avoids this by demanding abstinence unless her action is uniquely valuable (e.g., if her lab’s model is safer).  
  - **Alternative:** Redefine the engineer’s case. If her release adds no marginal harm (e.g., the model is identical to others), it’s *permissible but pointless*—not a moral failure. Your unease suggests you sense a duty to uphold norms, even if futile.  

  ### **Final Recommendation**
  **Adopt a hybrid principle:**
  > *Act only if (a) your action has positive expected marginal value, **and** (b) you are pivotal or your restraint supports a valuable norm.*  

  This reconciles your cases:  
  - Pathogen/Doctor/Donor: Satisfies (a) and often (b).  
  - Activist: Demands (b).  
  - Engineer: Fails (b)—restraint upholds a norm against harmful releases, even if futile.  
  - Council leak: Permitted only if (a) and (b) are met (e.g., leak is pivotal *and* exposes serious wrongdoing).  

  This forces you to abandon the engineer’s "may as well" verdict—but resolves your unease by prioritizing systemic integrity over individual futility.
