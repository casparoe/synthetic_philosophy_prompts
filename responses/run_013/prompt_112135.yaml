prompt: |-
  hey, I'm a backend dev with no philosophy training whatsoever, and I've fallen down a rabbit hole on Tolstoy's book about art from 1897 (What Is Art?) where he basically rules that almost everything everyone loves is fake. I want a piece of deadpan parody about it that's actually funny to someone who knows the book, not just haha Tolstoy hated fun. So let me dump what I think his position is, so you don't have to guess or go looking for it.

  His theory, roughly: art is when a person recalls a feeling they've really had, expresses it in external signs, and other people catch that feeling. If nobody catches it, it isn't art, however skillfull the execution. How well it works depends on how individual and particular the feeling is, how clearly it comes across, and how sincere the artist is — whether he actually feels the thing he's putting out. He also gives tells for counterfeit art: stuff borrowed from other art, stuff that's just imitation (photographic detail for its own sake), stuff hunting for striking effects, and stuff that's merely diverting/entertaining. And he's suspicious of difficulty and obscurity — if only a trained coterie can read it, that's a bad sign, and a real test is whether ordinary people with no art education get it.

  The part I want the joke to land on: his definition of art is amoral — any feeling, even a vile one, counts as art if it actually spreads — but his idea of good art is fiercely moral. Only feelings of universal brotherhood and love count, and he ranks art by how much of that it does. So a sincerely made, wildly infectious cruel thing is real art that is bad art. And when he turns the test on his own taste he writes off Shakespeare, Wagner, Beethoven, Dante, and the bulk of his own writing, novels included.

  What I want: the script for a self-guided audio tour, deadpan museum voice, 500-650 words, for one wing that a curator has rehung strictly by this test. Number the stops. Most of the frames are empty and the guide has to explain why, without ever being embarrassed about it. Make up the artworks — don't lean on real paintings you might be misremembering. Every joke should come from the criteria being applied correctly, so someone who knows the book nods instead of wincing. Keep the curator sincere and smart, not a strawman: no winking at the reader about how silly this is, and they should be able to say straight-faced why a tearjerker melodrama survives and a revered difficult masterpiece goes into storage.

  Two things I really want in there. First, at least one stop where the theory bites itself — a sincerely made, extremely infectious piece of cruelty or propaganda the curator has to keep in the collection as art while calling it bad art, or a piece they personally love that fails and gets crated up. Second, end it so the theory turns on its own author: the wing's little Tolstoy display, or his own novels, doesn't pass. Paraphrase him, don't quote him, and don't put invented words in real people's mouths — invented quotes from invented museum staff are fine and probably needed.

  I basically want to come away feeling the actual pull and the actual cost of the view, not just lol.
