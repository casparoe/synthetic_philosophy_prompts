prompt: |-
  Last weekend a cousin of mine visited from a country where tipping is neither expected nor particularly welcome, and over dinner a friend of mine spent a good twenty minutes insisting that he had been morally in the wrong to leave nothing on the table, wrong again to drift into the middle of a queue at the airport rather than join the back, and wrong a third time to cross against the pedestrian signal on our walk home — not merely ill-advised or rude, she kept saying, but wrong, the kind of thing one could legitimately resent him for. When I asked why any of that was a matter of morality rather than of manners or prudence, she produced the proverb 'When in Rome, do as the Romans do' and treated it as settling the question. I came away suspecting both that the proverb is doing quite different work in the three cases she lumped together, and that in at least one of them it is doing more work than it can bear.

  What I would like from you is a disambiguation, not a verdict on my friend. Take that single sentence and lay out the distinct precise theses it could be expressing, arranged as a menu that runs from the nearly vacuous to the genuinely radical: for instance, the prudential reading on which it merely warns that nonconformity invites friction; the descriptive reading on which it reports what counts as polite in a given place; the jurisdictional reading on which it says that the norms applicable to an act are fixed by where the act occurs rather than by the agent's home norms; the conventionalist reading on which the local practice itself constitutes the standard of correctness for the act-type; the reciprocity reading on which the visitor owes his hosts a debt of conformity; the reading on which the visitor is bound only where the local convention happens to track an independent moral reason that would bind him anywhere; and the pragmatic reading on which the sentence is not a claim at all but a way of declining to argue. For each reading, say whether it is a platitude, a substantive but defensible thesis, or something false or incoherent, and — the point I actually care about — say whether that reading, if true, would get my friend her conclusion that my cousin was morally in the wrong. Then tell me which reading she was most likely invoking, and which of the three cases (tipping, queueing, jaywalking) the proverb genuinely supports and where it breaks down, distinguishing in each case between what the local convention requires and what morality independently requires.

  Please keep the whole reply under 650 words: a numbered list of the readings, each with a one-line verdict and a one-line note on whether it supports her conclusion, followed by a short closing paragraph identifying the reading she probably meant and the cases it does and does not cover. I don't need a survey of the anthropology of tipping, and you needn't assume I share her view — I want the menu and the verdicts, tight enough to bring back to the argument.
reasoning: |-
  Hmm, the user presents a fascinating ethical dilemma involving cultural norms and moral judgments. They describe a scenario where their cousin from a non-tipping culture was criticized for not tipping, queue-jumping, and jaywalking during a visit. The critic invoked "When in Rome" as moral justification, but the user suspects this proverb is being stretched too thin across different situations.

  The user wants me to dissect the "When in Rome" proverb into distinct philosophical interpretations and evaluate each one's validity and applicability to the three scenarios. They specifically request a numbered list of interpretations ranging from trivial to radical, with assessments of whether each would support the friend's moral condemnation. Finally, they want me to identify which interpretation the friend likely used and where it holds or fails across the cases.

  The key challenge here is untangling the complex relationship between social conventions and moral obligations. I'll need to consider several dimensions: the distinction between manners and morality; how location affects normative expectations; whether conformity creates moral duties; and when local practices align with universal ethical principles.

  For the interpretations, I can identify at least seven distinct readings:
  1. Prudential - avoiding social friction
  2. Descriptive - reporting local customs
  3. Jurisdictional - location determines applicable norms
  4. Conventionalist - local practice defines correctness
  5. Reciprocity - owing conformity to hosts
  6. Independent Reason - binding only when convention tracks morality
  7. Pragmatic - refusal to engage in argument

  Each reading needs a quick verdict (platitude, defensible, or false) and a note on whether it supports the moral wrong conclusion. Then I'll apply the most plausible interpretation to the three cases, separating convention from morality.

  For the cousin's actions:
  - Tipping: Convention expects it, but morality only requires it if it affects worker welfare
  - Queueing: Both convention and morality support orderly queues
  - Jaywalking: Convention prohibits it, but morality depends on actual safety

  The friend likely invoked the conventionalist view, which works best for queueing but overreaches in the other cases. This shows how cultural norms can sometimes reflect moral principles but shouldn't be equated with them.
answer: |-
  Here is a disambiguation of "When in Rome, do as the Romans do," assessing its power to support the claim of moral wrong:

  1.  **Prudential Reading:** Warns nonconformity invites friction. *Verdict:* Platitude. *Supports moral wrong?* No (advises prudence, not morality).
  2.  **Descriptive Reading:** Reports what counts as polite/customary locally. *Verdict:* Platitude (if accurate). *Supports moral wrong?* No (describes, doesn't prescribe morality).
  3.  **Jurisdictional Reading:** The norms applicable to an act are fixed by *where* it occurs, not the agent's home norms. *Verdict:* Defensible (re: positive law/local custom authority). *Supports moral wrong?* Only if the local norm *itself* has moral force (needs further justification).
  4.  **Conventionalist Reading:** The local practice *constitutes* the standard of correctness for the act-type. *Verdict:* Substantive but often false/incoherent (confuses convention with inherent rightness). *Supports moral wrong?* Yes (by definition, violating convention *is* wrong) – but this is the controversial core.
  5.  **Reciprocity Reading:** The visitor owes hosts a debt of conformity for hospitality/cultural access. *Verdict:* Defensible (as a weak prima facie duty of respect). *Supports moral wrong?* Maybe for minor breaches (like tipping), unlikely for jaywalking/queueing *per se*; depends on imposition.
  6.  **Independent Reason Reading:** Visitor bound *only* where the local convention tracks an independent moral reason (e.g., fairness, harm-avoidance). *Verdict:* Defensible (common moral view). *Supports moral wrong?* Only if such an independent reason exists (e.g., queueing yes, tipping/jaywalking often no).
  7.  **Pragmatic Reading:** Not a claim, but a way to decline argument/avoid fuss. *Verdict:* Descriptive (of use). *Supports moral wrong?* No.

  **Analysis:** Your friend most likely invoked the **Conventionalist Reading** (#4), treating local practice as *defining* moral correctness, hence readily finding moral wrong in any deviation. However, this reading is generally indefensible as a standalone moral principle. It genuinely supports only the **queueing case**: orderly queues typically serve independent moral goods like fairness and efficiency; queue-jumping violates these, making it both conventionally *and* morally wrong. It breaks down elsewhere. **Tipping**: The convention exists, but its *moral* force depends entirely on whether it affects worker welfare (often structurally required, not a direct gift). Where wages aren't tip-dependent, no *moral* wrong occurs, only conventional rudeness. **Jaywalking**: The convention (signal adherence) often exists for safety/order. However, crossing an *empty* street against a signal is conventionally wrong but frequently lacks a *moral* wrong component (no harm/risk created), reducing it to a minor legal/conventional breach, not immorality one can "legitimately resent." The proverb cannot bear the moral weight your friend assigned it across all three cases.
