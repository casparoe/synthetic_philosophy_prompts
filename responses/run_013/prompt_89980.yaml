prompt: |-
  I teach an upper-level seminar on rational choice and game theory and am drafting the take-home portion of the final. I need a single essay question on superrationality that a student cannot answer by reciting the familiar line that identical reasoners cooperate in a one-shot Prisoner's Dilemma. It should force them to derive when cooperation is actually recommended, and to say whether the superrational style of reasoning is a distinct principle or a special case of ordinary expected-utility maximization.

  Give the students the following construction in full. Two strangers play a one-shot Prisoner's Dilemma with these payoffs (first entry for you, second for the other):

  |  | Other cooperates | Other defects |
  |---|---|---|
  | You cooperate | 3, 3 | 0, 5 |
  | You defect | 5, 0 | 1, 1 |

  The two are not duplicates, but it is common knowledge that they were shaped by the same process, so their choices are correlated; let r be the probability that the other player makes the same choice you do. The question should ask: (i) on the evidential, superrational style of reasoning, for which values of r does cooperating maximize expected utility, with the computation shown; (ii) what the answer gives at r = 1 and at r = 1/2, and what that implies about whether superrationality is a separate decision rule or the limiting case of expected-utility maximization with correlated acts; and (iii) whether the Kantian, universalizability reading of superrationality — act only on the maxim you could will that everyone follow — yields the same threshold in r, and if not, where the two readings come apart and why it matters.

  Then provide, in this order and under these headings:

  The exam question — the question as the students will see it, including the payoff matrix; a few sentences.

  Model answer — about 600 words, deriving the threshold, identifying the limiting cases, and defending a position on (ii) and (iii).

  Marking scheme — the must-hit points a top answer contains, the marks each is worth (total 20), and for each a one-line note on the mistake that typically costs students those marks.
reasoning: |-
  Okay, the user teaches an upper-level seminar on rational choice and game theory and needs a challenging take-home essay question on superrationality. They want to avoid students simply regurgitating the standard line about identical reasoners cooperating in a one-shot Prisoner's Dilemma. Instead, the question should force deeper engagement: deriving when cooperation maximizes expected utility, and examining whether superrationality is a distinct principle or just expected-utility maximization with correlated acts.

  I need to design a question with three specific components: 
  First, the mathematical derivation of the cooperation threshold for correlation probability r. Second, analysis of limiting cases (r=1 and r=0.5) to address whether superrationality is distinct from standard expected utility. Third, comparison with Kantian universalizability and where these approaches diverge.

  The payoff matrix is given with (3,3) for mutual cooperation, (0,5)/(5,0) for unilateral defection, and (1,1) for mutual defection. The key innovation is introducing correlation probability r without assuming identical reasoning - just shared shaping process. This prevents the canned "identical reasoners cooperate" response.

  For the mathematical component, students must calculate expected utilities for cooperation and defection as functions of r. The threshold comes from setting EU(C) > EU(D). At r=1 we should get the superrational cooperation result, while r=0.5 should reduce to standard game theory where defection dominates. This contrast will help students argue whether superrationality is merely expected utility with correlation or something more fundamental.

  The Kantian comparison is trickier. Universalizability might suggest cooperating regardless of r, since defection can't be universalized. But the evidential approach yields r-dependent results. Students should note this tension and its implications for moral vs instrumental rationality.

  The marking scheme needs to be precise. Full credit requires: correct EU formulas, accurate inequality derivation, correct threshold value, proper r=1 and r=0.5 analysis, clear stance on distinctness question, and insightful Kantian comparison. Common errors to penalize include miswriting EU formulas, algebraic mistakes, misinterpreting limiting cases, and conflating evidential with Kantian reasoning.

  The model answer should demonstrate perfect derivation while acknowledging nuances. For the distinctness question, it should argue that superrationality uses standard EU machinery but reveals how correlation changes rational play. For Kant, it should show how evidential reasoning depends on probabilistic correlation while universalizability is categorical.
answer: |-
  ### Exam Question  
  **Superrationality and Correlated Choices in the Prisoner's Dilemma**  
  Consider a one-shot Prisoner's Dilemma with the following payoffs (row player's payoff first):  

  |          | Other Cooperates | Other Defects |  
  |----------|------------------|--------------|  
  | **You Cooperate** | 3, 3            | 0, 5         |  
  | **You Defect**    | 5, 0            | 1, 1         |  

  The players are strangers, but it is common knowledge they were shaped by the *same process*, creating a correlation between their choices. Let **r** be the probability that the other player makes the *same choice you do*. Using **evidential superrational reasoning** (i.e., treating your choice as evidence about the other’s choice):  

  (i) Derive the condition on **r** for which cooperating maximizes your expected utility. Show your calculations.  
  (ii) Compute the result at **r = 1** and **r = 0.5**. Explain whether superrationality is a *distinct decision principle* or a *limiting case of expected-utility maximization* with correlated acts.  
  (iii) Would the **Kantian universalizability principle** ("Act only on maxims you could will everyone to follow") recommend cooperation at the *same threshold* in **r**? If not, where do the two approaches diverge, and why does this matter for rational choice theory?  

  ---

  ### Model Answer  
  **(i) Deriving the threshold for cooperation**  
  Let \( \text{EU}(C) \) and \( \text{EU}(D) \) denote the expected utilities of cooperating and defecting, respectively. Given correlation probability **r**:  
  - If you cooperate, the other cooperates with probability **r** and defects with probability \( 1 - r \).  
  - If you defect, the other defects with probability **r** and cooperates with probability \( 1 - r \).  

  Thus:  
  \[
  \text{EU}(C) = r \cdot 3 + (1 - r) \cdot 0 = 3r  
  \]  
  \[
  \text{EU}(D) = (1 - r) \cdot 5 + r \cdot 1 = 5 - 5r + r = 5 - 4r  
  \]  
  Cooperating maximizes expected utility iff \( \text{EU}(C) > \text{EU}(D) \):  
  \[
  3r > 5 - 4r \implies 7r > 5 \implies r > \frac{5}{7}  
  \]  
  ∴ Cooperation is rational iff \( r > \frac{5}{7} \approx 0.714 \).  

  **(ii) Limiting cases and the nature of superrationality**  
  - At **r = 1**: \( \text{EU}(C) = 3(1) = 3 \), \( \text{EU}(D) = 5 - 4(1) = 1 \). Cooperation dominates (EU: 3 > 1). This aligns with the "identical reasoners" superrational outcome.  
  - At **r = 0.5**: \( \text{EU}(C) = 3(0.5) = 1.5 \), \( \text{EU}(D) = 5 - 4(0.5) = 3 \). Defection dominates (EU: 3 > 1.5), matching standard game theory.  

  **Interpretation**: Superrationality is **not a distinct principle** but a *special case of expected-utility (EU) maximization* under correlated acts. It uses the same EU calculus but *updates beliefs* about the other’s choice conditional on one’s own. At r = 1, the correlation is perfect, making cooperation rational; at r = 0.5 (independence), defection is rational. The divergence from standard theory arises solely from *correlation*, not new axioms.  

  **(iii) Kantian universalizability vs. evidential superrationality**  
  The Kantian principle would **not depend on r**. It evaluates maxims categorically: "Defect when others cooperate" cannot be universalized (as mutual defection yields 1 < 3), so Kant demands *unconditional cooperation*. This clashes with the evidential threshold \( r > \frac{5}{7} \).  

  **Why this matters**:  
  - **Evidential superrationality** is *instrumental*: it coopts correlation for personal gain. Cooperation is a means to exploit symmetry.  
  - **Kantian reasoning** is *deontological*: cooperation is a duty, independent of outcomes or correlations.  
  The disagreement highlights a fracture in "rational" cooperation: Kantians see it as ethically necessary; evidential superrationalists see it as contingently optimal. This matters for foundational debates—e.g., whether rationality is unitary or bifurcated into instrumental and moral domains.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Point**                                                                 | **Marks** | **Common Mistake (costs marks)**                              |  
  |---------------------------------------------------------------------------|-----------|---------------------------------------------------------------|  
  | Correct EU formulas for both actions (in terms of r).                     | 3         | Miswriting payoffs (e.g., swapping 5 and 0 for defection).    |  
  | Correct inequality \( 3r > 5 - 4r \) and derivation of \( r > \frac{5}{7} \). | 3         | Algebra errors (e.g., \( 3r > 5 - 4r \implies 7r < 5 \)).     |  
  | Valid results for r = 1 (EU(C)=3, EU(D)=1, cooperate) and r=0.5 (EU(C)=1.5, EU(D)=3, defect). | 4         | Incorrect EU calculations or misstating dominance.            |  
  | Clear argument that superrationality is EU maximization with correlation (not distinct). | 3         | Calling it "radically new" without addressing correlation.    |  
  | Kantian view requires unconditional cooperation; contrast with r-threshold. | 3         | Equating Kant with superrationality or missing categoricality.|  
  | Insightful analysis of why divergence matters (instrumental vs. deontological). | 4         | Superficial treatment (e.g., "they differ" without depth).    |
