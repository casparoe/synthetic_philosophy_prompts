  2. Show that choosing A in Phase 1 and D in Phase 2 violates the independence axiom. Explain the sure-thing principle: if you prefer A to B, then you should prefer the lottery that gives A with probability p and a common consequence with probability (1-p) to the lottery that gives B with probability p and the same common consequence with probability (1-p). In this case, the common consequence is 0 tokens (which happens in the 75% chance in lottery C and D).

  3. Map to Allais: 
     - Our Phase 1: A and B are like the first pair in Allais (safe option vs. risky option with a chance of a higher win).
     - Our Phase 2: C and D are like the second pair in Allais.

  4. Discuss the independence axiom and the certainty effect.

  5. Discuss what has to give: either they must change their preferences to be consistent, or they must abandon the independence axiom and hence expected utility theory.

  6. Connect to the selling prices: students who chose A and D might have valued lottery A very high and lottery D very high, but then we can show that lottery A is not available in the scaled-down version (lottery C) and they passed up lottery C even though it is the scaled version of the lottery they loved in Phase 1.

  ** What will go wrong **:

  1. **Stakes too small**: Use tokens that convert to something meaningful (e.g.,  tokens and then a prize table:  tokens buy candy or small prizes). Make sure the amounts are large enough: the safe option should be enough to get, say, a chocolate bar, and the risky option might get two. But keep in mind practical limits. If necessary, use larger token amounts (e.g., multiply by 10: A=300, B=400 with 80%, C=300 with 25%, D=400 with 20%), and then 10 tokens = 1 piece of candy.

  2. **Clever student games the broker**: If a student tries to report a very high selling price for a lottery they don't want to sell, the broker can simply not buy it. The broker is only noting the prices. The student might then not be able to sell, but that's fine.

  3. **Group split**: If the class split is not as expected (e.g., many are consistent), then the phenomenon might not show. To handle this, use the historical data (remind them that most people show this pattern) and focus on the few who are inconsistent. Alternatively, run the activity with yourself first to ensure the pattern holds.

  4. ** broker activity takes too long**: Have students write their selling prices on a piece of paper and then aggregate quickly.

  ** What the activity cannot reproduce **: The activity might not capture the strong certainty effect because the voiding event is not explicitly part of the choice. In the standard Allais, the certainty is in the first pair and then gone in the second. In our design, the second pair is not presented as a voided version of the first, so the students might not connect them. Therefore, in the debrief, you will have to explicitly draw the connection and show that lottery C is what lottery A becomes when subjected to a 75% chance of voiding.

  To help with this, in the debrief, you can show:

  - Lottery A: 30 for sure = [100% of 30]
  - Subject to a 75% chance of voiding (i.e., only 25% chance of being effective) -> becomes: 30 with 25%, 0 with 75% = lottery C.

   Similarly, lottery B: 40 with 80% = [ lottery that gives 40 with 80% and 0 with 20% ]
  - Subject to the same voiding: becomes 40 with 20% (because 25% * 80% = 20%) and 0 with 80% = lottery D.

   Therefore, by the independence axiom, if you prefer A to B, you should prefer C to D.

   This mapping is crucial and must be explained in the debrief.

  ** Handout Example **:

  Create a choice sheet:

  Phase 1: 
  [ ] Mission A: 30 tokens for sure.
  [ ] Mission B: 40 tokens with 80% chance, 0 tokens with 20% chance.

  Phase 2:
  [ ] Mission C: 30 tokens with 25% chance, 0 tokens with 75% chance.
  [ ] Mission D: 40 tokens with 20% chance, 0 tokens with 80% chance.

  Broker part:
  - Your minimum selling price for your Phase 1 lottery: _____ tokens.
  - Your minimum selling price for your Phase 2 lottery: _____ tokens.

  In summary, this design might work to surface the inconsistency. The trading part allows students to attach a price to their choices, and the debrief then shows the logical tension.
answer: |-
  Below is a complete, runnable 90-minute activity designed to immerse students in the tension between the certainty effect and the independence axiom. The activity uses a "Space Exploration" cover story, real stakes (tokens redeemable for candy/prizes), and a trading mechanism to make the inconsistency visceral. By the end, students will have confronted their own preferences and felt the "price" of inconsistency via a broker role. The debrief then formalizes the connection to Allais, independence, and expected utility.

  ---

  ### **Activity Design: The Asteroid Mining Dilemma**
  **Cover Story**:  
  Students are asteroid miners choosing missions to extract "Crystal Tokens" (redeemable post-activity for candy: 1 token = 1 piece). Mining is risky: missions may succeed (yielding tokens) or fail (0 tokens). A broker (played by you or a student) will buy/sell mission rights, exposing preference inconsistencies through trading.

  **Stakes & Materials**:
  - **Tokens**: Distribute 10 tokens upfront to each student (so $0 outcomes still feel like losses).  
  - **Prizes**: Set up a prize table (e.g., 15 tokens = chocolate bar; 30 tokens = premium snack).  
  - **Randomization**: Use a deck of cards (clubs = fail, hearts/diamonds/spades = succeed) or dice.  
  - **Handouts**: 
    - **Mission Choice Sheet** (private; Appendix A).  
    - **Broker Offer Slips** (Appendix B).  
    - **Result Trackers** (Appendix C).  
  - **Broker Rules**: The broker buys/sells mission rights at fixed prices (detailed below). They start with a 100-token fund and aim to profit by exploiting inconsistent preferences.

  ---

  ### **Mechanics & Timeline (90 Minutes Total)**
  #### **Phase 1: Initial Choices (15 min)**  
  **Step 1: Introduce Mission Pair 1**  
  *Slide/Verbal Prompt*:  
  > *"Choose between two missions for Asteroid ALPHA:  
  > - **Mission A (Safe)**: 30 tokens guaranteed.  
  > - **Mission B (Risky)**: 80% chance of 40 tokens, 20% chance of 0 tokens.  
  > Commit privately—no discussion!"*  

  - Students mark choices on **Mission Choice Sheets** (Appendix A) and seal them.  
  - **Why this works**: The certainty effect should make A popular (as in Allais' common-consequence problem).  

  #### **Phase 2: Sequential Reveal & Commitment (20 min)**  
  **Step 2: Add Uncertainty**  
  *Slide/Verbal Prompt*:  
  > *"A cosmic storm threatens ALPHA! With 75% probability, it will destroy your mission, reducing your outcome to 0 tokens. If the storm misses (25%), your mission proceeds unharmed.  
  > *Now choose for Asteroid BETA:  
  > - **Mission C (Safe)**: 30 tokens with 25% chance, 0 tokens with 75% chance.  
  > - **Mission D (Risky)**: 40 tokens with 20% chance, 0 tokens with 80% chance.*  
  > *You must commit to BETA now—before we resolve the storm!"*  

  - Students choose C or D on their sheets and seal them.  
  - **Key insight**: C is A scaled to 25% probability; D is B scaled to 20%. Independence demands consistency (A-preferrers should choose C).  

  **Step 3: Resolve the Storm**  
  - Publicly draw a card: **Hearts = storm misses (25%)**; Other suits = storm hits (75%).  
  - **Hits**: All ALPHA missions yield 0.  
  - **Misses**: ALPHA missions pay out as chosen.  

  #### **Phase 3: Broker Trading (25 min)**  
  **Broker Role & Rules**:  
  - The broker offers to buy/sell mission rights **before BETA outcomes are resolved**.  
  - **Fixed Prices**:  
    - Buy ALPHA-A rights for 28 tokens (if storm missed).  
    - Buy ALPHA-B rights for 30 tokens (if storm missed).  
    - Buy BETA-C rights for 7 tokens.  
    - Buy BETA-D rights for 7.5 tokens.  
    - Sell any mission for 10% above buy prices (e.g., sell BETA-D for 8.25 tokens).  
  - **Goal**: Profit from preference reversals (e.g., A-choosers who pick D may sell C too cheaply).  

  **Trading Process**:  
  1. Broker posts prices on the board.  
  2. Students write offers on **Broker Slips** (Appendix B): e.g., *"Sell my BETA-C for 7 tokens."*  
  3. Broker accepts all offers (funds permitting), paying tokens immediately.  
  4. **Critical twist**: Students who sell lose their mission payouts; broker gains them.  

  **Expected Inconsistency**:  
  - A-choosers often pick D (certainty gone), then sell BETA-C for 7 tokens (undervaluing it versus A).  
  - Broker profits by buying "scaled-down" sure things (C) cheaply from risk-averse students.  

  #### **Phase 4: Resolve & Tabulate (15 min)**  
  - Resolve BETA missions publicly (card/dice draw).  
  - Students calculate total tokens on **Result Trackers** (Appendix C), redeem for candy.  

  ---

  ### **Debrief (15 min)**  
  **Step 1: Surface the Paradox**  
  - Poll choices: *"Who chose A in ALPHA? Of those, who chose D in BETA?"* (Expect 60-80% inconsistency.)  
  - Ask inconsistent students: *"Why abandon the safe mission when scaled down?"* Highlight broker trades: *"Did selling C for 7 tokens feel like a loss versus your A-choice?"*  

  **Step 2: Formalize to Allais & Independence**  
  - Map to Allais:  
    - **ALPHA: A vs. B** = Allais' Pair 1 (certainty effect).  
    - **BETA: C vs. D** = Allais' Pair 2 (common-consequence).  
  - Reveal that C = 25% of A, D = 25% of B. Independence axiom requires:  
    $$A \succ B \iff C \succ D$$  
  - **Violation**: Choosing A > B but D > C contradicts independence (students "feel" it via broker prices).  

  **Step 3: Expected Utility Breakdown**  
  - EU theory fails: Nonlinear probability weighting (certainty effect) explains the reversal.  
  - **Trade-offs**:  
    - Keep preferences → abandon independence (e.g., prospect theory).  
    - Keep independence → abandon Allais-style preferences (e.g., enforce consistency).  
  - **Lesson**: Rationality isn't intuitive—axioms have "prices" (e.g., broker profits).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Stakes too small**:  
     - **Risk**: Students treat it as a game.  
     - **Fix**: Use higher-value prizes (e.g., 50-token = $5 gift card) and emphasize loss aversion ("You started with 10 tokens!").  

  2. **Clever student games the broker**:  
     - **Risk**: A student sells overpriced rights to bankrupt the broker.  
     - **Fix**: Cap broker trades per student (e.g., 2 buys/sells). Clarify: "Broker aims to exploit *inconsistency*, not outsmart you."  

  3. **Group split muddies the point**:  
     - **Risk**: 50% choose consistently, diluting the paradox.  
     - **Fix**: Pre-seed inconsistency—share anonymous data: "In 10 years, 75% of you reversed. Why?"  

  4. **Time crunch**:  
     - **Risk**: Broker phase runs long.  
     - **Fix**: Use fixed prices (no haggling) and pre-printed slips.  

  ---

  ### **Limitation: What the Activity Can't Replicate**  
  The activity cannot **fully simulate regret**. In Allais, the certainty effect is amplified by the fear of losing a sure gain. Here, students know outcomes post-trade, but the broker mechanic abstracts regret into a "price." You must **verbally emphasize** this post-activity:  
  > *"Imagine choosing BETA-D, losing, and realizing you passed up BETA-C—the scaled version of your 'safe' ALPHA choice. That regret is the certainty effect's core, and it’s why real Allais choices feel tense."*  

  ---

  ### **Appendices (Photocopy Materials)**  
  #### **Appendix A: Mission Choice Sheet**  
  ```markdown
  NAME: __________  
  **ALPHA MISSION**  
  [ ] A: 30 tokens (guaranteed)  
  [ ] B: 40 tokens (80%) or 0 tokens (20%)  

  **BETA MISSION**  
  [ ] C: 30 tokens (25%) or 0 tokens (75%)  
  [ ] D: 40 tokens (20%) or 0 tokens (80%)  
  ```  
  *Seal in envelope after choosing.*  

  #### **Appendix B: Broker Offer Slip**  
  ```markdown
  NAME: __________  
  I OFFER TO:  
  [ ] BUY [ ] SELL my [ALPHA-A / ALPHA-B / BETA-C / BETA-D] rights.  
  PRICE: _______ tokens (Broker posts fixed prices; I match or leave blank).  
  ```  

  #### **Appendix C: Result Tracker**  
  ```markdown
  STARTING TOKENS: 10  
  ALPHA OUTCOME: ____ (after storm)  
  BETA OUTCOME: ____  
  BROKER TRADES: +____ (income) / -____ (sold)  
  TOTAL: ____ → PRIZE CLAIMED: ________  
  ```  

  --- 

  By making inconsistency costly and visceral, this activity transforms Allais from an abstract pattern into a personal dilemma. The broker mechanic ensures students "pay" for violating independence, setting up a gripping debrief on rationality’s limits.
