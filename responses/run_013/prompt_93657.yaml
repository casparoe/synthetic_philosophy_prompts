prompt: |-
  ok so my friend and i got into an actual shouting match about population ethics last night after way too many beers and i want to write down what i really think before i start talking myself out of it. ground rules for all the cases: same resources, same technology, nobody in them knows about the other worlds, and the number is how good a person's life goes, where anything above 0 is worth living, 0 is right on the line, 90 is a genuinely great life and 5 is a life that's fine but has basically nothing in it. anyway here's my gut:

  - a billion people at 90, vs. the same billion people at 95: the 95 world is definately better, obviously.
  - a billion at 90, vs. ten billion at 70: i say the ten billion world is better. more lives, and every one of them is clearly a good life.
  - a billion at 90, vs. five hundred billion at 4: i say the billion at 90 is better and i feel pretty strongly about it, even though the other world has way more total good in it and nobody there is suffering.
  - a billion at 90, vs. a billion at 90 plus another billion at 30 who live completely separately and don't affect anyone else: the second one is better, or at least not worse. adding people whose lives are worth living can't make a world worse.
  - same, except instead of a billion at 30 it's a quintillion mayflies, each alive for a few hours, each having one tiny flicker of mild contentment and nothing else, no pain, no boredom, nothing: i still say that's better than the billion at 30 world. small good lives are still good lives.
  - a billion at 90 plus one person in real agony, vs. a billion at 90 plus ten billion people at 1: i say the second is better. i'm not going to say that adding one tortured person is preferable to adding a huge pile of okay-ish people, that seems insane.
  - two billion at 50 with everyone equal, vs. a billion at 99 and a billion at 1: i say the equal world is better. note those two have the same total and the same average, so that one is about the gap itself, not about totals.

  here's what's eating me. my friend says the mayflies plus the adding-people thing commits me to saying the five hundred billion at 4 world is better than the billion at 90, and i just won't say that. he also kept insisting there's some theorem that no view can satisfy all the obvious conditions at once and he couldn't remember what it was, so maybe he's bluffing. i tried to dig myself out with this: more total welfare is better, EXCEPT that a world where everybody's life is barely worth living can never be better than a world where everyone's life is genuinely good, no matter how many people there are. is that a real position or did i just make it up on the spot? i notice it says the mayfly world isn't better than the billion-at-30 world, which is the opposite of what i said above, so i'm already in trouble.

  what i want from you: the best principle, or small set of principles, that actually gets my verdicts, stated precisely enough that i can check it against new cases myself, plus an honest list of which of my verdicts it can't save and why i should give that one up. and then tell me what it predicts for a few cases i haven't given you, especially: 100 billion people at 5 vs. my billion at 90, which i genuinely can't decide about; a case where adding more people makes the existing people a little worse off because of resources; and a case where the extra lives are non-human animals with minds very different from ours. don't just tell me it's a famous paradox, i know it's a paradox, i want to know what to actually believe.
