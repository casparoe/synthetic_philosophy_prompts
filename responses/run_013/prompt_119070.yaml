prompt: |-
  I am a second-year PhD student in cognitive science, and I have been asked to run a single ninety-minute session of our department's methods induction for incoming graduate students — a mixed group of psychologists, linguists, and computer scientists, none of whom has done any formal work on concept learning. My assigned topic is the induction of a concept from a handful of labelled examples, and I intend to build the session around Bongard-style problems: in the classic format, six figures on one side and six on the other, with the learner required to find the property that separates the two groups, given no further instances, no queries, and no feedback beyond the division itself. Do not explain concept induction to me; I understand the material well enough. What I want is a plan for teaching it. Specifically:

  1. The order in which the ideas must be introduced, and why each depends on the last. Assume the students arrive with no vocabulary for any of this. Tell me which notions — hypothesis space, version space, a prior over hypotheses, underdetermination — earn their place inside ninety minutes and which I should merely name and defer to their own reading.

  2. The one example that should carry the session. I am tempted by the easy opening, convex figures on the left and concave on the right, because everyone solves it in ten seconds; but I suspect it teaches them that the answer is always a property of the individual figure, which is precisely the misconception I later have to dislodge. Argue me out of it or into it, and if you would rather I used something else, design it: give me both sets, described concretely enough that I can draw them on a handout, and tell me what the example must contain — and what it must conspicuously lack — for the later points to land.

  3. The hard point I actually want to reach, and the reason I volunteered for this topic: that the twelve figures never determine the rule, only a family of rules that agree on them; that what makes one member of the family the intended answer is that a human being finds it obvious; and that the format therefore measures a culturally and developmentally specific sense of obviousness while presenting itself as a test of pure reasoning. I want the students to feel the force of this rather than be told it. Where in the sequence does it belong, and what is the smallest move that makes them feel it? I have in mind a variant in which the rule is not a property of any single figure but a relation holding among the six figures of each set taken in order, so that no amount of staring at one instance can help. Advise me on whether that lands as a revelation or merely as a trick; if you judge it a trick, design a better one.

  4. The misconceptions I should expect, in the order they will surface, and the precise point in the sequence at which each should be headed off. I am already anticipating: that there is one right answer and that finding it is a matter of luck; that a feature merely correlated with the division is the rule; that the rule must be a detector of a feature rather than a relation (above, inside, more than, alternating); that a rule which fits one side need not be checked against the other; and that being able to state the rule and having found it are the same achievement. Add whatever I have missed.

  5. How I will know by the end that they have grasped the idea rather than acquired a knack for the puzzles. I want a check that separates the two, and I want it to be something they do rather than something they say — ideally a single task that a student with only a knack fails and a student with the concept passes.

  6. What I should refuse to cover at this level, and how to say so without leaving them feeling short-changed. The obvious candidate is the formal apparatus for comparing hypotheses by simplicity; tell me whether naming it and stopping there is defensible in this setting.
reasoning: |-
  Okay, this user is a second-year PhD student in cognitive science preparing a 90-minute session on concept induction using Bongard problems. They clearly know their stuff but want teaching strategy advice. Let me unpack this carefully.

  First, their core tension: they need to balance concrete puzzle-solving with abstract meta-concepts about underdetermination and cultural bias in "obviousness". The session must move from visceral "aha!" moments to epistemological realization within tight time constraints. 

  For structure, starting with individual figures makes sense pedagogically but risks reinforcing atomic-feature bias. Maybe begin with a deceptively simple convex/concave example to build confidence, then immediately shatter expectations with relational puzzles. The sequence should mirror the conceptual journey: from "rules are in the object" to "rules are in the pattern" to "rules are in the observer".

  The relational example they proposed (connectivity order) is perfect - it forces systemic thinking. But to avoid feeling "tricky", I'll suggest adding visual scaffolding like sequential numbering. The key is making the shift feel inevitable, not gimmicky. 

  For misconceptions, timing corrections is crucial. When they say "it has a dent" during convex/concave, that's when to emphasize: "Yes, but why isn't 'has at least three sides' the rule? Both sides have that." Planting underdetermination early. 

  The real test of understanding shouldn't be solving another puzzle but designing one where multiple rules fit. If they can create ambiguous examples, they've internalized the indeterminacy. 

  Formal simplicity metrics? Name-drop Kolmogorov complexity but table it - this session is about gut-level realization, not computation. Say: "Today we're mapping the territory; next session we'll build the measuring tools." 

  The cultural bias revelation works best after they've struggled with relational puzzles. Ask: "Why did 80% of you assume rules were atomic? Who taught you that?" Make it personal. 

  ...better jot down that "connectivity chain" example with concrete descriptions. Hexagon with detachable triangle versus pentagon with glued rectangle - yes, that visualizes ordered dependence. And the kicker: both sides could obey "all shapes have exactly one right angle" if you don't check cross-set consistency. 

  For the final test, have them sketch two different rules that fit the same Bongard boxes. If they can violate Occam's razor intentionally, they get it. 

  Most importantly - this session will live or die by hand-drawn visuals. Every example must be blackboard-ready. Sacrifice formalism for visceral impact.
answer: |-
  Here’s a battle-tested plan balancing depth, engagement, and revelation within 90 minutes. Focus on **experiential learning**—students should *feel* the key insights through struggle and discovery.

  ---

  ### **1. Sequence of Ideas & Timing (75 min core + 15 min buffer)**  
  *(Dependencies in bold)*  
  **0-10 min: The Puzzle Hook**  
  - **Start with a *non*-atomic rule example** (see #2 below). Let them struggle silently for 3 min.  
  - **Why?** Avoids cementing "rules are properties of single figures." Initial confusion creates fertile ground.  

  **10-25 min: Hypothesis Space**  
  - Introduce: "Your brain generated guesses—that’s your *hypothesis space*."  
  - **Depends on:** The struggle creating a need for this term.  
  - **Skip:** Formal definition. Show it *is* the set of possible rules they considered/rejected.  

  **25-40 min: Version Space**  
  - After revealing the rule, ask: "What *else* could explain these 12 figures?" List alternatives.  
  - Define: *Version space* = all rules consistent with examples so far.  
  - **Depends on:** Having multiple plausible hypotheses after seeing data.  
  - **Cover:** Underdetermination (name it here) as the gap between version space and one "true" rule.  

  **40-60 min: The "Obviousness" Leap**  
  - Use your relational example (#3 below). Let them fail, then reveal the rule.  
  - Ask: *"Why did nobody propose this? What makes 'convex' feel more 'obvious'?"*  
  - **Depends on:** Version space framing to show multiple *valid* rules exist—but culture picks one.  

  **60-75 min: Priors (Briefly)**  
  - "Your past experiences shaped which hypotheses you tried first—that’s your *prior*."  
  - **Cover:** Naming only. Say: "We quantify this with *priors over hypotheses*—see readings."  
  - **Skip:** Math. Emphasize it’s about learned expectations.  

  ---

  ### **2. The Core Example**  
  **Ditch convex/concave.** Use this instead:  
  - **LEFT SIDE (6 figures):**  
    1. ◯ (circle)  
    2. △ (triangle)  
    3. □ (square)  
    4. ♡ (heart)  
    5. ☆ (star)  
    6. ⌂ (house)  
  - **RIGHT SIDE (6 figures):**  
    1. ◯▭ (circle + rectangle)  
    2. △▭ (triangle + rectangle)  
    3. □▭ (square + rectangle)  
    4. ♡▭ (heart + rectangle)  
    5. ☆▭ (star + rectangle)  
    6. ⌂▭ (house + rectangle)  

  **Rule:** *Left: Single shape. Right: Composite shape.*  
  **Why it works:**  
  - Forces them past atomic features (all shapes exist on both sides).  
  - "Obvious" distractors (e.g., "right has rectangles") fail (△▭ has a triangle).  
  - **Crucially lacks:** Any perceptual "odd one out." Rule emerges *only* from set contrast.  

  ---

  ### **3. The Relational "Revelation" Example**  
  **Use this to land the big idea:**  
  - **LEFT SIDE (ordered left→right):**  
    1. ◕ (circle with dot)  
    2. ▽ (upside-down triangle)  
    3. ▣ (solid square)  
    4. ♧ (club symbol)  
    5. ✪ (heavy star)  
    6. ◔ (circle with top-left dot)  
  - **RIGHT SIDE (ordered left→right):**  
    1. ◎ (concentric circles)  
    2. △ (upright triangle)  
    3. ▢ (outlined square)  
    4. ♤ (spade symbol)  
    5. ✰ (star with points)  
    6. ◑ (circle with right-half dot)  

  **Rule:** *Each set is a chain: The dot/feature in shape N is in the same position as a vertex/hole in shape N+1.*  
  *(e.g., LEFT: Dot in ◕ aligns with ▽'s bottom vertex; RIGHT: ◎'s center aligns with △'s top vertex)*  

  **Why it’s revelation, not trick:**  
  - **Feels impossible** at first (no single-figure rule works).  
  - **After reveal:** They’ll realize *cultural priors* blocked them (no one looks for inter-figure relations).  
  - **Punchline:** "The 'obvious' rule is what *your history* primes you to see first."  

  ---

  ### **4. Misconceptions & Preemptive Strikes**  
  | **Misconception** | **When it surfaces** | **How to head off** |  
  |-------------------|------------------------|----------------------|  
  | "One right answer" | After first example | Show 3+ valid rules post-reveal (e.g., for composite shapes: "contains rectangle," ">1 part," "non-convex"). |  
  | "Correlation = rule" | During early guesses | Ask: "Does that rule *only* fit this side? Test it on the other." (e.g., "All left are red" fails if a right is red). |  
  | "Rules are atomic" | First 5 min | Use composite/relational examples early. Ask: "Could the rule be about *how these connect*?" |  
  | "Don’t check both sides" | Initial guesses | Require them to state *why* a guess fails for opposite-side examples. |  
  | "Stating = finding" | After quick solvers | Ask: "Could you code this rule? What edge cases might break it?" |  
  | **NEW:** "More data would solve it" | During version space | Point out: *Even infinite data won’t tell you which rule is ’intended’*—only which are possible. |  

  ---

  ### **5. The Grasp-vs-Knack Test**  
  **Task:** *"Design a Bongard problem with two different valid rules."*  
  - **Knack-fail:** Creates puzzles with one "obvious" rule.  
  - **Grasp-pass:** Creates ambiguity intentionally (e.g., left: triangles; right: blue shapes—but all triangles are blue. Rules: "triangles" or "blue things").  
  - **Why it works:** Forces them to confront underdetermination *creatively*.  

  ---

  ### **6. What to Omit & How to Frame It**  
  **Skip:**  
  - Formal simplicity metrics (Kolmogorov, MDL)  
  - Algorithmic implementations (Version Space Algorithm)  
  - Bayesian calculations  

  **Say this:**  
  > *"Today’s goal is to feel why concept induction is fundamentally about *human* cognition—not just logic. We’ve seen how data underdetermines rules, and how ’obvious’ picks the winner. If you want the machinery for *comparing* hypotheses (like simplicity metrics), see [cite Mitchell/Kaye]—that’s next semester’s focus. For now, sit with this: What feels ’simple’ depends on your mind, not the universe."*  

  ---

  ### **Why This Works**  
  - **Flow:** Struggle → Insight → Formalization → Epistemology.  
  - **Revelation:** The relational example *forces* the "obviousness" insight. It’s not a trick because it’s logically valid—just alien to untrained priors.  
  - **Depth:** They leave seeing Bongard problems as probes for *cultural priors*, not "pure reasoning."  

  **Handout tip:** Draw examples by hand—sloppy is better. It subtly signals that perception, not precision, matters.  

  This plan turns confusion into conceptual leverage. You’re not just teaching concept induction—you’re *inducing* the concept of induction itself.
