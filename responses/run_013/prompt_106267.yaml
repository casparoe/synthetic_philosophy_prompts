  - Therefore, a cascade does not necessarily start at step 3: 1 mark.
  - The cascade might be broken by a conflicting signal at step 3: 1 mark.
  - This makes the cascade more fragile than in the standard model: 1 mark.

  **Part (d) (4 marks):**

  - In an information cascade, individuals rationally ignore their own private signals when the public information (from previous guesses) becomes so strong that it outweighs their own signal. However, the public information is based on the signals of previous individuals, which might be misleading if early signals were unrepresentative.

  - Specifically, if the first few individuals by chance get signals that point to the wrong jar (e.g., the jar is A but the first two independent signals are red, which happens with probability (1/3)*(1/3)=1/9 in the standard model), then a cascade starts on the wrong jar. Subsequent individuals, even if they have signals that point to the correct jar, ignore them and follow the cascade. Thus, the entire group can be wrong.

  - The key is that each individual is acting rationally (because given the public information, their own signal is too weak to overturn the consensus) but the group aggregates information poorly because the public guesses do not reveal the private signals (only the decisions). Therefore, the cascade locks in on the wrong answer.

  **Marking for (d):**
  - The idea that early signals might be misleading: 1 mark.
  - The cascade forms because individuals rationally ignore their own signals when the public information is strong enough: 2 marks.
  - The cascade locks in the wrong answer because subsequent individuals don't contribute their private signals (which might correct the error): 1 mark.

  ---

  **Final Model Answer (for students):**

  **(a)** 
  Person 1 observes a blue marble. They compute the probability that the jar is A given blue: 
  P(A|blue) = [P(blue|A) * P(A)] / [P(blue|A)*P(A) + P(blue|B)*P(B)] 
  = [(2/3)*(1/2)] / [(2/3)*(1/2) + (1/3)*(1/2)] 
  = (1/3) / (1/3 + 1/6) 
  = (1/3) / (1/2) = 2/3. 
  Therefore, Person 1 guesses A (since 2/3 > 1/2). 

  Person 2 also observes the same blue marble and hears Person 1's guess of A. Since Person 2 knows that Person 1 saw the same blue signal, Person 1's guess does not provide new information. Therefore, Person 2 also computes P(A|blue)=2/3 and guesses A.

  **(b)**
  Person 3 sees that the first two people guessed A, but knows that these two guesses are based on the same shared blue signal (so they are not independent). Therefore, the two A guesses only represent one piece of evidence (one blue signal). Person 3 then draws a red marble, which is a piece of evidence for B (since P(red|B)=2/3). 

  The posterior probability of A given one blue and one red signal is 0.5 (since the likelihood ratio is 1). Therefore, Person 3 is indifferent. To break the tie, we assume they follow their own private signal (red) and guess B.

  **(c)**
  In the standard model, two independent identical guesses would cause a cascade because they would represent two independent signals, and the third person would ignore their own signal. However, in this model, the first two signals are not independent (they are the same signal). Therefore, two identical guesses do not necessarily start a cascade at the third person. Specifically, if the third person gets a conflicting signal, they may break the pattern (as in part (b)). This makes the cascade more fragile because it can be broken by a single conflicting signal at the third step, unlike in the standard model where two consecutive identical guesses start a cascade that is robust to conflicting signals.

  **(d)**
  In an information cascade, individuals act rationally by ignoring their own private signals when the public information (from previous guesses) is sufficiently strong. However, if the early signals are misleading (e.g., due to bad luck), the cascade may lock in on the wrong jar. Subsequent individuals, even if they have private signals indicating the correct jar, ignore them because the public information outweighs their signal. Thus, the group can be wrong even though every individual is acting rationally. The problem is that the public guesses do not reveal the private signals, so the aggregation of information is inefficient.
answer: |-
  ### Exam Question: Information Cascades with Shared Evidence

  **Total Marks: 20**  
  **Target:** Final-year undergraduates in social science, economics, or decision theory.  
  **Instructions:** Answer all parts clearly and concisely. Show your reasoning. Calculations must be fully justified.  

  ---

  #### Question  
  Consider a scenario where a jar is randomly chosen (50% probability each) from two options:  
  - **Jar A**: 2 blue marbles, 1 red marble.  
  - **Jar B**: 2 red marbles, 1 blue marble.  

  A sequence of people guess the jar type in order (Person 1, Person 2, etc.). Each person observes evidence and hears all previous guesses. They guess rationally to maximize the probability of being correct.  

  **Evidence structure:**  
  - **Person 1 and Person 2** observe the *same* randomly drawn marble (e.g., they both see a viral post showing this marble).  
  - **Person 3 onwards** each draw an independent marble (with replacement) as private evidence.  

  The probability of a correct signal is 2/3:  
  - If Jar A, a drawn marble is blue with probability 2/3 (red with 1/3).  
  - If Jar B, a drawn marble is red with probability 2/3 (blue with 1/3).  

  **(a)** Suppose the shared marble observed by Person 1 and Person 2 is **red**.  
  - (i) What will Person 1 guess? Justify with Bayes’ theorem. (3 marks)  
  - (ii) What will Person 2 guess? Explain why Person 2’s reasoning differs from Person 1’s. (3 marks)  

  **(b)** Now, Person 3 draws a private marble and observes **blue**. They hear Person 1 and Person 2 both guessed **B** (based on the shared red marble in part (a)).  
  - What will Person 3 guess? Compute the posterior probabilities for Jar A vs. Jar B and explain whether Person 3 ignores their own signal. (6 marks)  

  **(c)** In the standard cascade model (all signals independent), two matching guesses trigger a cascade. Explain:  
  - (i) Why a cascade *fails to start* at Person 3 in this scenario. (2 marks)  
  - (ii) How a cascade could still form later (e.g., at Person 4) and why it is more **fragile** than in the standard model. (2 marks)  

  **(d)** Explain why, in information cascades, rational individuals can lock in the *wrong* jar choice even if no one makes a mistake. Connect this to the role of independence in evidence aggregation. (4 marks)  

  ---

  ### Model Answer  

  #### **(a)**  
  **(i)** Person 1 observes a **red** marble. Using Bayes’ theorem:  
  - Prior: \( P(\text{Jar A}) = P(\text{Jar B}) = 0.5 \).  
  - Likelihoods:  
    - \( P(\text{red} \mid \text{Jar A}) = 1/3 \) (since Jar A has 1 red out of 3 marbles).  
    - \( P(\text{red} \mid \text{Jar B}) = 2/3 \) (since Jar B has 2 red out of 3 marbles).  
  - Posterior:  
    \[
    P(\text{Jar A} \mid \text{red}) = \frac{P(\text{red} \mid \text{Jar A}) P(\text{Jar A})}{P(\text{red})} = \frac{(1/3)(0.5)}{(1/3)(0.5) + (2/3)(0.5)} = \frac{1/6}{1/2} = \frac{1}{3}.
    \]  
    \[
    P(\text{Jar B} \mid \text{red}) = 1 - \frac{1}{3} = \frac{2}{3}.
    \]  
    Since \( P(\text{Jar B} \mid \text{red}) > P(\text{Jar A} \mid \text{red}) \), Person 1 guesses **B**.  

  **(ii)** Person 2 also observes the **red** marble and hears Person 1 guess **B**.  
  - Person 2 knows Person 1 saw the *same* red marble (shared evidence), so Person 1’s guess reveals no new information.  
  - Person 2’s evidence is identical to Person 1’s. Thus, they also compute \( P(\text{Jar B} \mid \text{red}) = 2/3 \) and guess **B**.  
  - **Why reasoning differs from Person 1**: Person 1 acts on *only* the marble. Person 2 acts on the marble *and* the knowledge that Person 1 saw the same marble, but since it adds nothing new, their decision is unchanged.  

  #### **(b)**  
  Person 3 observes:  
  - Previous guesses: Person 1 and Person 2 both guessed **B**.  
  - Own signal: **blue** marble.  

  **Posterior calculation**:  
  - The two **B** guesses are *not independent* (same underlying evidence: one red marble). Effectively, there is only **one piece of evidence from Persons 1–2**: "red marble was drawn."  
  - Person 3 combines:  
    - Evidence 1: Shared red marble (from Persons 1–2).  
    - Evidence 2: Own blue marble (independent).  

  Bayes’ theorem (joint likelihoods):  
  - \( P(\text{red and blue} \mid \text{Jar A}) = P(\text{red} \mid \text{A}) \times P(\text{blue} \mid \text{A}) = (1/3) \times (2/3) = 2/9 \).  
  - \( P(\text{red and blue} \mid \text{Jar B}) = P(\text{red} \mid \text{B}) \times P(\text{blue} \mid \text{B}) = (2/3) \times (1/3) = 2/9 \).  
  - Posterior:  
    \[
    P(\text{Jar A} \mid \text{data}) = \frac{(2/9) \times 0.5}{(2/9 \times 0.5) + (2/9 \times 0.5)} = \frac{1/9}{2/9} = 0.5.
    \]  
    \[
    P(\text{Jar B} \mid \text{data}) = 0.5.
    \]  
    **Person 3 is indifferent** and guesses based on their own signal (blue → Jar A) or flips a coin. Assuming they follow their signal when indifferent, they guess **A**.  

  **Does Person 3 ignore their signal?** No. The shared evidence weakens the public signal (equivalent to one signal, not two), so Person 3 weighs their own signal and breaks the tie.  

  #### **(c)**  
  **(i) Cascade fails at Person 3**:  
  - In the standard model, two independent matching guesses (e.g., B+B) would outweigh Person 3’s conflicting signal, causing them to ignore it and cascade. Here, the two **B** guesses stem from *one* red marble (not independent). Thus, Person 3 treats the public information as weaker (equivalent to one signal) and uses their own signal. No cascade starts.  

  **(ii) Cascade later and fragility**:  
  - If Person 3 guesses **A** (as above), and Person 4 draws a **blue** marble:  
    - Person 4 sees: Persons 1–2 guessed B (based on one red signal), Person 3 guessed A (based on one blue signal).  
    - This appears balanced (one signal each). Person 4 uses their own signal.  
  - However, if Person 3 had drawn *red* (supporting B), they would guess B. Then Person 4 would see three B guesses. But:  
    - Persons 1–2’s B guesses depend on one shared signal.  
    - Person 3’s B guess is independent (their own red signal).  
    - Person 4 now has **two independent signals for B** (shared red + Person 3’s red) and ignores a conflicting signal → cascade starts.  
  - **Fragility**: The cascade relies on Person 3’s signal matching the shared signal. A *single* mismatch (e.g., Person 3’s blue in part (b)) breaks it. In the standard model, two initial matching guesses trigger a robust cascade (immune to conflicting signals).  

  #### **(d)**  
  **Why cascades lock in errors**:  
  - Individuals act rationally: They ignore their private signal when public information is *stronger* (e.g., two independent signals outweigh one).  
  - However, early signals can be unrepresentative (e.g., Jar A chosen, but first draw is red, which occurs with prob. 1/3). If the first two people (with independent signals) see red, they both guess B. Person 3+ ignore their signals (even if blue, supporting A), locking in error.  
  - **Role of independence**: When signals are independent, public guesses reflect accumulating evidence. If independence is violated (e.g., shared evidence), the public information is weaker, making cascades less likely to form or easier to break. But even with independence, cascades amplify early randomness, potentially locking in incorrect choices despite rational behavior.  

  ---

  ### Marking Scheme  
  **Strong answers**: Explicitly calculate posteriors; distinguish between *guesses* and *underlying signals*; explain why shared evidence reduces information; link fragility to dependence.  
  **Weak answers**: Parrot standard cascade logic; assume independence; ignore Bayes; miss that shared evidence weakens public signals.  

  #### **(a)** (6 marks)  
  - (i) Correct guess **B** (1 mark), Bayes’ theorem with priors/likelihoods (1 mark), posterior calculation (1 mark).  
  - (ii) Correct guess **B** (1 mark), explanation: "Person 1’s guess adds no new info" (1 mark), contrast to Person 1’s reasoning (1 mark).  

  #### **(b)** (6 marks)  
  - Correct guess **A** (or coin flip) (1 mark).  
  - Recognize public guesses are not independent (1 mark), equate to one red signal (1 mark).  
  - Bayes’ theorem with joint likelihoods (1 mark), posterior = 0.5 (1 mark).  
  - Conclusion: Uses own signal (not ignored) (1 mark).  

  #### **(c)** (4 marks)  
  - (i) Explains cascade fails due to non-independent public signals (1 mark), contrasting standard model (1 mark).  
