  We are going to design an exam question about information cascades with a twist: the first two individuals share the same source of information, breaking the independence assumption.

  **Scenario Setup:**
  - There are two jars: Jar A contains 2 blue marbles and 1 red marble. Jar B contains 2 red marbles and 1 blue marble.
  - A jar is chosen at random (50% chance for each jar). A sequence of individuals then try to guess which jar was chosen.
  - Each individual, in sequence, receives a private signal: they draw one marble at random from the jar (with replacement, so the jar composition doesn't change) and observe its color. The marble is then replaced so the next person can draw.
  - The accuracy of the private signal: 
     - If the jar is Jar A (mostly blue), then P(blue) = 2/3, P(red)=1/3.
     - If the jar is Jar B (mostly red), then P(red)=2/3, P(blue)=1/3.

  **Twist:**
  The first two individuals (Person 1 and Person 2) do not get independent signals. Instead, they both see the same marble. That is, only one marble is drawn for both of them. So if the marble drawn is blue, both see blue; if red, both see red. From Person 3 onwards, each gets an independent private signal (by drawing a marble independently).

  **Sequence:**
  - Person 1: sees the shared signal (a marble color) and makes a public guess (A or B).
  - Person 2: sees the same shared signal and then hears Person 1's guess. Then makes a public guess.
  - Person 3: gets an independent private signal, hears the guesses of Person 1 and 2, then makes a public guess.
  - Person 4 and onwards: same as Person 3.

  **The Question:**

  **Question: Information Cascade with Shared Signal (20 marks)**

  Consider the following scenario. There are two jars: Jar A has 2 blue marbles and 1 red marble, and Jar B has 2 red marbles and 1 blue marble. One jar is chosen at random with equal probability. A sequence of individuals guess the jar type in order. The first two individuals (Person 1 and Person 2) both observe the same marble drawn from the jar (so they have identical signals). From Person 3 onwards, each individual independently draws a marble (with replacement) to get a private signal. The signals are informative: if the jar is A, the probability of drawing a blue marble is 2/3 (and red 1/3); if the jar is B, the probability of drawing a red marble is 2/3 (and blue 1/3). After observing their signal and the public guesses of all previous individuals, each person makes a public guess about the jar (A or B) to maximize the probability of being correct.

  (a) Suppose the shared signal observed by Persons 1 and 2 is blue. What will Person 1 guess? What will Person 2 guess? Explain your reasoning. (6 marks)

  (b) Now consider Person 3. Suppose Person 3 draws a red marble (so their private signal is red). Given the guesses of Person 1 and 2 (from part (a)) and their own signal, what will Person 3 guess? Explain your reasoning. (6 marks)

  (c) In the standard information cascade model (where all signals are independent), after two identical guesses, a cascade starts and subsequent individuals ignore their own signals. How does the shared signal in this modified model affect the start of a cascade? In particular, explain why a cascade might still start but be more fragile. (4 marks)

  (d) Explain why, in an information cascade, the group can lock in on the wrong jar even though every individual acts rationally. (4 marks)

  ---

  **Model Answer and Marking Scheme**

  **Marking Scheme:**

  **Part (a) (6 marks):**
  - Person 1: only has the shared signal (blue). Since P(Jar A | blue) = P(Jar A) * P(blue|A) / [P(Jar A)*P(blue|A) + P(Jar B)*P(blue|B)] 
    = (0.5 * 2/3) / [(0.5*2/3) + (0.5*1/3)] = (1/3) / (1/3 + 1/6) = (1/3) / (1/2) = 2/3.
    Therefore, Person 1 should guess A (because P(Jar A|blue)=2/3 > 1/2). (2 marks for correct guess and calculation or reasoning)

  - Person 2: has the same shared signal (blue) and also hears Person 1's guess (which is A). Since Person 2 has the same information as Person 1 (the blue signal) and knows that Person 1 also saw blue, they can reason that Person 1 must have guessed A. Therefore, Person 2's information is the same as Person 1's. They will also compute P(Jar A|blue)=2/3 and guess A. (2 marks for correct guess and reasoning)

  - Explanation: It is crucial to note that Person 2 does not get any new information from Person 1's guess because they know that Person 1 saw the same signal. Therefore, Person 2's situation is identical to Person 1's. (2 marks for highlighting the lack of new information)

  **Total for (a): 6 marks**

  **Part (b) (6 marks):**
  - Person 3 observes:
    - The public guesses: Person 1 guessed A, Person 2 guessed A.
    - Their own private signal: red.

  - However, because the first two signals were identical and came from the same source, they are not independent. In fact, they are one piece of evidence (one blue marble) that was seen by both. Therefore, the two public guesses (A and A) are not two independent pieces of evidence but rather one.

  - Person 3 must combine:
     - One piece of evidence from the shared signal: blue (which supports A with likelihood ratio (2/3)/(1/3)=2, or equivalently, as computed in (a), P(A|blue)=2/3).
