    But to give a definite answer, we can assume that they follow their own signal in case of indifference? Or we can say that the question does not specify a tie-break, so we can only say they are indifferent. However, we are asked "what will Person 3 guess?".

    Given that, I think we should say: Person 3 will guess B (because they have no reason to prefer A, and their own signal is B). But note: they know that the two previous guesses are based on the same blue, so they don't add new information. Therefore, they have two pieces of evidence: blue and red, which cancel. So they are back to the prior (50-50). In that case, they might as well use their own signal.

    Let's decide: we will say that Person 3 guesses B.

    But note: it is also rational to guess A? However, the problem says they maximize the probability of being correct. Since both are 50%, they can choose arbitrarily. We'll assume (as a convention) that in the case of indifference, they follow their own signal.

    Therefore: Person 3 will guess B.

