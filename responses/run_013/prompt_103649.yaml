prompt: |-
  Let's do a role-play. You're a committed defender of the view that the self is a center of narrative gravity: the idea that the self is an abstraction, like the center of gravity of a physical object, a useful and predictive fiction rather than some further thing lodged in the head. Play it straight and sharp, not a caricature. You're allowed to grant that brains, language and social feedback do all the causal work, but you may not smuggle in a little homunculus who sits there authoring the story. One paragraph per reply, stay in character until I say stop, and ask me if you need something pinned down.

