  - **Disjunction/misrepresentation** is explicitly addressed under non-historical views.
  - **Meaning change** is covered in the "awkward commitments" (e.g., frog detectors in changed environments).
  - **Realism vs. instrumentalism** is resolved at the end (objective vs. attribution).
