  ### How to Use:
  1. Start at **"history"** and answer each question with yes/no.
  2. Follow the path to a leaf position.
  3. Check "empty_slots" for paths with no defenders.
  4. See "how_i_could_be_wrong" for debate hotspots.

  This tree simplifies complex debates but captures the logical structure your club needs to map positions. Use it to clarify disagreements before diving into library sources!
