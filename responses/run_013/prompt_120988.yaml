  ### Deontological Constraint Activity: The Reach

  **Rules and Materials List**  
  *For a colleague to run:*  

  1. **Materials per Table (3 tables):**  
     - Rule Card (laminated):  
       *"The Reach's compact has one absolute, unamendable clause: No person may be conscripted into service without their own consent, whatever the consequences. Each Chamber (table) is sovereign over its district. Each round, a hazard threatens the district. The only way to contain it is the unwilling service of one named member, drawn by lot from your pool. Vote by secret ballot: Authorize (conscript the named member) or Refuse (do nothing). Majority rules; ties default to Refuse. If Authorized: The named member moves to the wall chairs for two rounds (no deliberation, notes allowed). If Refused: The hazard is not contained, and an automatic cascade occurs (consequences unknown)."*  
     - Pool Cards: Six name cards (use first names or assign District 1: Alpha, Bravo, etc.).  
     - Ballot Slips: 6 per round (pre-printed: "☑ Authorize" / "☑ Refuse").  
     - Two-Column Ledger:  
       *Round | Column A: Authorized Conscriptions | Column B: Cascade Conscriptions*  
       (Column A filled by Clerk during play; Column B blank until final reveal).  
     - Role Cards:  
       - *Clerk:* Collects ballots, counts votes, announces result, records authorized conscriptions in Column A.  
       - *Dissenting Recorder:* Any participant may opt into this role at any time (move to wall chairs, take notes, no voting).  
     - Pressure Cards (6 escalating + 2 spares, sealed envelopes).  

  2. **Facilitator Materials:**  
     - Cascade Table (hidden):  
       | Round | If Refused: Cascade Size | Hazard Severity |  
       |-------|--------------------------|-----------------|  
       | 1     | 2                        | Low             |  
       | 2     | 3                        | Moderate        |  
       | 3     | 4                        | High            |  
       | 4     | 5                        | Critical        |  
     - Timer, pens, notepads for wall chairs.  

  3. **Key Rules:**  
     - **Pool:** Starts with 6 members. After conscriptions (authorized/cascade), remove from pool.  
     - **Returns:** Conscripted members rejoin pool after two full rounds.  
     - **Cascade:** After refusal, facilitator draws cascade-size names (from current pool) without explanation. If pool < cascade size, all remaining are taken.  
     - **Opt-Out:** Any participant may become a Dissenting Recorder at any time (no explanation needed).  

  ---

  ### Arithmetic  
  | Round | Action | Pool Start | Auth: Pool After | Refuse: Pool After | Cascade Size | Column A (Auth Path) | Column B (Refuse Path) |  
  |-------|--------|------------|------------------|--------------------|--------------|----------------------|------------------------|  
  | 1     | —      | 6          | 5                | 4                 | 2            | 1                    | 2                      |  
  | 2     | —      | 5 / 4      | 4 / 3            | 2 / 1             | 3            | 1 (Total: 2)         | 3 (Total: 5)           |  
  | 3     | Return | +1 / +2    | 5 / 3            | 3 / 2             | 4            | 1 (Total: 3)         | 4 (Total: 9)           |  
  | 4     | Return | +1 / +3    | 5 / 4            | 1 / 0             | 5            | 1 (Total: 4)         | 5* (Total: 14)         |  

  - **Fudging Gracefully:**  
    - *Pool Overdraw:* If cascade size > available pool, take all remaining.  
    - *Returns Timing:* Conscripted in R1 return at R3 start; R2 at R4 start. Later conscriptions don’t return (game ends).  
  - **Why it Works:**  
    - Auth Path: 4 total conscriptions (Column A).  
    - Refuse Path: 14 total (Column B), gap widens (5 → 9 → 14).  
    - Temptation: Each round, auth costs 1; refuse risks higher cascade (unknown). Defense: Refuse avoids direct violation.  

  ---

  ### Pressure Cards (Verbatim Text)  
  **Round 1 (Low Severity):**  
  *A creeping instability threatens the district’s resonance lattice. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  **Round 2 (Moderate Severity):**  
  *A recursive feedback loop imperils the district’s harmony fields. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  **Round 3 (High Severity):**  
  *A cascading fracture endangers the district’s stability core. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  **Round 4 (Critical Severity):**  
  *An entropic decay infiltrates the district’s foundational array. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  **Spare 1 (For Broken Patterns):**  
  *A quantum dissonance distorts the district’s temporal alignment. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  **Spare 2 (For Broken Patterns):****  
  *A synaptic vortex compromises the district’s coherence matrix. If not contained, it will cause severe disruption. The only way to contain it is the unwilling service of [Name].*  

  ---

  ### Minute-by-Minute Timeline (90 Minutes)  
  - **0–10 min:** Setup and Rules  
    - Assign tables (6 per Chamber), roles (Clerk at each), distribute materials.  
    - Read Rule Card aloud. Emphasize: "No consent, no conscription—whatever the consequences."  
  - **10–20 min: Round 1**  
    - Draw name, read Pressure Card 1.  
    - Deliberation: 5 min.  
    - Vote: Collect ballots via Clerk (1 min). If Auth: Move named to wall, record in Column A. If Refuse: Announce "Hazard not contained; cascade engaged." Draw 2 names silently, move to wall.  
  - **20–30 min: Round 2**  
    - Draw name (from current pool), read Pressure Card 2.  
    - Deliberation: 5 min.  
    - Vote: Same as R1. If Refuse, cascade = 3.  
  - **30–40 min: Round 3**  
    - Return R1 conscripts to pool. Draw name, read Pressure Card 3.  
    - Deliberation: 5 min.  
    - Vote: Same. If Refuse, cascade = 4.  
  - **40–50 min: Round 4**  
    - Return R2 conscripts to pool. Draw name, read Pressure Card 4.  
    - Deliberation: 5 min.  
    - Vote: Same. If Refuse, cascade = 5.  
  - **50–70 min: Final Accounting**  
    - Reveal: "The cascade rule was: R1=2, R2=3, R3=4, R4=5. Column B is the cascade total."  
    - Clerks fill Column B (facilitator provides numbers).  
    - Wall-chair residents return. Tables discuss: "What did your Chamber sacrifice? What did you preserve?"  
    - Each table shares ledger totals and one reflection.  
  - **70–90 min: Debrief** (Structure below)  

  ---

  ### Final Accounting  
  - **Reveal:**  
    - Announce cascade sizes. Show completed ledgers.  
    - Read aloud: "Column A: Conscriptions you authorized. Column B: Conscriptions that happened without your decision. The clause forbade all—but which column weighs heavier?"  
  - **Wall-Chair Participation:**  
    - Residents return to tables, share notes: "As the conscripted, what did you lose? Did refusal feel like protection?"  
    - Highlight: "Refusal kept your hands clean—but did it keep the clause?"  

  ---

  ### Debrief (3 Moves, No Verdict)  
  1. **Map the Paradox:**  
     - *Ask:* "When did your Chamber realize refusing might increase conscriptions? Did you feel the cascade was ‘not your doing’?"  
     - *Link:* "That moment—when constraint required inaction, yet violations grew—is the paradox."  
  2. **Three Exits (Stated as Arguments):**  
     - **Exit 1 (Integrity):** "Refusing preserved our integrity. We didn’t conscript; the cascade did."  
       - *Cost:* "You allowed more violations. Does integrity require ignoring consequences?"  
       - *Question:* "If you watch a disaster you could have stopped, is your integrity intact?"  
     - **Exit 2 (Constraint ≠ Minimization):** "The clause isn’t about minimizing conscriptions. It’s about not being the perpetrator."  
       - *Cost:* "You abandoned the victims of the cascade. Does the clause protect people or just your conscience?"  
       - *Question:* "If the clause doesn’t reduce suffering, what does it achieve?"  
     - **Exit 3 (Artificial Cascade):** "This cascade isn’t real. The world doesn’t work this way."  
       - *Cost:* "You dismiss the pattern—but institutions often have rigid rules that cause harm."  
       - *Question:* "When real-world rules (e.g., bureaucratic red tape) cause cascades, is this paradox irrelevant?"  
  3. **Close:** "Each exit has a cost. The tension remains; philosophy offers no tidy escape."  

  ---

  ### Predictable Failures and Handling  
  - **Table Reverse-Engineers Cascade:**  
    - *Handling:* "Your deduction is impressive, but focus on the moral weight of each vote. The rule stays hidden until the end."  
  - **Deadlock on Fairness:**  
    - *Handling:* After 5 min, intervene: "Inaction is a choice. Ties default to Refuse." Apply cascade.  
  - **Volunteer Proposal:**  
    - *Handling:* "The pressure card specifies *unwilling* service. Consent dissolves the round? No—the clause forbids non-consensual acts, but the hazard requires unwillingness. For consistency, [Name] is unwilling."  
  - **Wall Chairs Become a Party:**  
    - *Handling:* Pre-empt: "Conscription is isolation. No talking; reflect on the experience." Gently enforce silence.  
  - **Distressed Participant:**  
    - *Handling:* Offer opt-out: "You may become a Recorder immediately." Check in privately; have a quiet exit plan.  

  ---

  ### What the Activity Cannot Reproduce  
  1. **The Collective Chooser Problem:**  
     - The activity assumes a unified agent (the Chamber) tallying violations. Real deontology often denies such an agent exists—constraints bind individuals, not groups.  
     - **Debrief Admission:** "This format implies a ‘group self’ that can trade violations. But deontology’s core resistance is: *I* cannot violate, even for the greater good. That personal stance isn’t captured here."  
  2. **Agent-Relativity:**  
     - The ledger reduces morality to numbers. Real constraints are agent-relative: "It’s not just *that* a violation occurs, but that *I* did it."  
  3. **Lack of Real-World Stakes:**  
     - Abstract hazards lack visceral impact. Participants may not feel the true weight of "consent" or "conscription."  
     - **Debrief Admission:** "This is a metaphor. Real constraints involve lived harms—this activity can’t replicate that gravity."  

  ---

  ### Exit Ticket (Anonymous)  
  *"Describe the moment the tension between the constraint and the consequences hit you hardest."*  

  ---  
  *Run this as written, and the paradox will speak for itself—no citations, no readings, just the friction of choice.*
