answer: |-
  Here is your question-period prep sheet, ordered by likelihood + damage potential. Replies are structured for 2-minute delivery, with candid weakness assessments and literature context.

  ---

  ### **Prep Sheet: Harsanyi Critique Colloquium**  
  **Core Thesis:** Harsanyi’s theorem establishes affine aggregation, not utilitarianism; weights require interpersonal comparability. Ex-post statewise aggregation avoids ex-ante equivocation.  

  ---

  1. **Objection (Welfare Economist #1):**  
     *"You’re ignoring that Harsanyi’s weights are *cardinal* utilities. With normalization, equal weights *are* utilitarian, and interpersonal comparisons are already embedded in vNM scales."*  
     **Reply:**  
     Harsanyi’s weights are coefficients in an affine combination, but they lack normative content without a welfare bridge. vNM scales are unique up to affine transformations, so interpersonal comparisons require a *shared zero and unit* across individuals—which the theorem doesn’t provide. Equal weights are arbitrary absent a rationale for equal *moral worth*, not just mathematical convenience.  
     **Weakness:** Downplays that some (e.g., Weymark) argue vNM scales *can* support comparability if units are aligned.  
     **Literature:** Settled that vNM alone ≠ comparability; contested whether alignment is feasible (see Adler, 2016).  

  2. **Objection (Technical Expert #1):**  
     *"Your ‘unanimous preference’ gloss misstates Harsanyi’s Pareto axiom. It’s *strong Pareto* over lotteries. Doesn’t your ex-post view violate it?"*  
     **Reply:**  
     Correct—the axiom requires social preference to respect unanimous *strict* preference over lotteries. My ex-post approach *may* violate strong ex-ante Pareto in risky cases (e.g., statewise egalitarianism vs. ex-ante efficiency). But this exposes the conflict: Harsanyi’s axioms force ex-ante aggregation, which isn’t ethically neutral.  
     **Weakness:** Concedes a tension with a core axiom.  
     **Literature:** Consensus on axiom statement; contested whether it’s normatively compelling (Mongin, 1995).  

  3. **Objection (Ex-Ante/Ex-Post Specialist):**  
     *"In cases like *State-Dependent Utilities* or *Uncertain Equality*, ex-post aggregation violates ex-ante Pareto. Why reject Pareto for your statewise approach?"*  
     **Reply:**  
     When utilities are state-dependent or ex-post fairness matters, ex-ante Pareto can prioritize luck over justice (e.g., compensating unlucky individuals). I argue social rationality should *sometimes* override ex-ante Pareto to respect ex-post moral priorities. It’s a substantive choice, not derivable from Harsanyi.  
     **Weakness:** Admits violating a dominant axiom; requires defending controversial alternatives.  
     **Literature:** Heated debate (e.g., Fleurbaey vs. Mongin); no consensus.  

  4. **Objection (Welfare Economist #2):**  
     *"Harsanyi’s theorem *is* utilitarian: it shows that *only* affine aggregation satisfies Pareto + vNM rationality. Rejecting weights is rejecting coherence."*  
     **Reply:**  
     It shows affine aggregation is *necessary* given the axioms, but utilitarianism requires *interpreting* weights as interpersonal trade-offs. The theorem doesn’t fix weights—e.g., 0 for some individuals satisfies axioms. "Coherence" here is technical, not moral.  
     **Weakness:** Risks sounding dismissive of axiomatic reasoning.  
     **Literature:** Settled that weights are indeterminate; contested if utilitarianism needs equal weights (Binmore, 2009).  

  5. **Objection (Rawlsian):**  
     *"Why use a theorem assuming vNM rationality? Real people don’t satisfy those axioms, and social choice shouldn’t either."*  
     **Reply:**  
     Agreed—but I’m engaging Harsanyi on his terms to show internal limitations. Even *if* we accept vNM rationality, utilitarianism doesn’t follow. Your deeper point stands: the framework itself may be flawed.  
     **Weakness:** Cedes ground to critique of entire paradigm.  

  6. **Objection (Technical Expert #2):**  
     *"Your ‘affine combination’ point is trivial. Harsanyi’s original proof assumes *identical* beliefs, avoiding statewise issues. You’re attacking a straw man."*  
     **Reply:**  
     With identical beliefs, statewise utilities align, so ex-ante/ex-post collapse. But modern applications often assume heterogeneous beliefs (e.g., climate policy), where weights conflate risk attitudes and values. My critique targets those extensions.  
     **Weakness:** Harsanyi’s classic case *is* robust; modern uses are the vulnerability.  
     **Literature:** Consensus on identical beliefs in Harsanyi (1955); disputed in extensions.  

  7. **Objection (Technical Expert #3):**  
     *"Ex-post aggregation requires interpersonal comparisons *anyway*. How is your proposal less arbitrary?"*  
     **Reply:**  
     Ex-post comparisons can be grounded in *objective states* (e.g., health, resources) rather than lottery preferences. We can then apply a post-aggregation fairness criterion (e.g., prioritarianism) without Harsanyi’s conflation of risk and inequality.  
     **Weakness:** Post-hoc fairness criteria are themselves contested.  

  8. **Objection (The One I Hope Nobody Raises):**  
     *"If social preferences satisfy vNM axioms and Pareto, Harsanyi’s representation holds. Your ex-post social utility function won’t be vNM—so isn’t your alternative irrational?"*  
     **Reply:**  
     Correct—ex-post aggregation may violate vNM continuity/independence if we value equality in outcomes. But this highlights the dilemma: Harsanyi’s axioms *force* linearity, which precludes fairness concerns. Perhaps social rationality shouldn’t be vNM.  
     **Weakness:** Forces me to reject vNM for social preferences, alienating decision-theorists.  
     **Literature:** Major rift (e.g., Diamond, 1967 vs. Harsanyi).  

  ---

  ### Final Note  
  **Most Damaging Unprepared Objection:** The ex-ante/ex-post specialist’s challenge (#3). It forces me to defend violating Pareto—a bedrock axiom—and cite contested moral intuitions.  

  \answer{Ex-ante Pareto violation in state-dependent cases}
