answer: |-
  Your arithmetic is correct, and your example is a legitimate illustration of Kalai-Smorodinsky's behavior. But you mischaracterize the *meaning* of the ideal point. It is not merely a "claim" in the abstract; it is a direct measure of each player's *bargaining position* derived from the feasible set itself. The ideal point (u1*, u2*) represents the maximum utility each player can achieve *given that the other player is accommodated at their reservation point*. This is why its movement matters fundamentally.

  When you delete option C, you aren't removing an irrelevant alternative—you're directly eroding player 2's *potential maximum gain* if player 1 were to concede entirely. Player 2's bargaining position weakens because their best possible outcome drops from 6 to 5. The KS solution reflects this diminished position by reducing player 2's share relative to player 1. Player 1 gains precisely because player 2's *scope for aspiration* has shrunk. This is monotonicity in action: when the set contracts in a way that disproportionately harms one player’s opportunities, the solution adjusts against them.

  Similarly, adding (12,0) expands player 1's *demonstrable capability* to secure higher gains if player 2 acquiesces. It strengthens player 1’s bargaining position by raising her ideal payoff from 10 to 12. The KS solution acknowledges this enhanced potential—not because (12,0) is likely to be chosen, but because it quantifies the *upper bound* of what player 1 can extract when player 2 is compelled to accept minimal payoffs. The feasibility of extreme outcomes defines the bargaining leverage each player brings to the table.

  This isn’t dependence on irrelevant alternatives (IIA) in the Nash sense. IIA concerns arbitrary truncations that don’t alter the relative attractiveness of existing options. Here, removing C or adding (12,0) *directly alters the players' fundamental aspirations* by changing the Pareto frontier’s endpoints—which are constitutive of their bargaining power. KS responds because it respects how the *shape* of the entire feasible set, particularly its extremal points, shapes fair division. The ideal point is not an irrelevant hypothetical; it is an objective feature of the bargaining landscape that measures what each player can realistically demand when the other is pushed to their limit. If you reject that, you reject the axiom of individual monotonicity—which is the heart of KS’s claim to fairness. Your objection doesn’t refute KS; it highlights the axiom you reject.
