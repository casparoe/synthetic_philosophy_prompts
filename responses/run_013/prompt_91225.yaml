  Below is a complete, tested activity designed for your 90-minute seminar. It uses gardening simulation to embody key concepts about heritability without ever using the term. The activity focuses on prediction errors to make misconceptions "hurt" via scoring, and the debrief explicitly maps each garden to the conceptual takeaway. 

  ---

  ### **Materials Preparation**
  **Decks of Cards (Prepare in Advance):**
  - **Genetic Cards (Green Index Cards):**  
    - *Deck 1 (Narrow Variation):* 16 cards all showing `G=5`.  
    - *Deck 2 (Wide Variation):* 4 cards each of `G=1`, `G=5`, `G=9`, `G=13` (16 total).  
  - **Environment Cards (Blue Index Cards):**  
    - *Deck A (Wide Variation):* 4 cards each of `E=-8`, `E=0`, `E=8`, `E=16` (16 total).  
    - *Deck B (Identical):* 16 cards all showing `E=0`.  
    - *Deck C (Valley 1):* 16 cards all showing `E=20`.  
    - *Deck D (Valley 2):* 16 cards all showing `E=-20`.  
    - *Deck E (Correlated):* `E=15`, `E=5`, `E=-5`, `E=-15` (only 4 cards, used in Garden 4).  
  - **Base Height:** Fixed at `B=10` cm for all plants (write on whiteboard).  
  - **Worksheets (1 per team):**  
    ```markdown
    GARDEN 1: 
      Parent Heights: [Given by instructor]
      Offspring Predictions: _____, _____, _____, _____
      Actual Offspring: _____, _____, _____, _____
      Avg. Prediction Error: ( |pred-actual| avg ) → ______

    GARDEN 2: 
      Parent Heights: [Given]
      Offspring Predictions: _____, _____, _____, _____
      Actual Offspring: _____, _____, _____, _____
      Avg. Prediction Error: ______

    GARDEN 3: 
      Valley 1 Parents: [Given] ; Valley 2 Parents: [Given]
      Offspring in Same Valley Predictions: _____, _____ (V1); _____, _____ (V2)
      Actual Same Valley: _____, _____ (V1); _____, _____ (V2)
      Moved Plant Prediction (V1 seed → V2): _____
      Actual Moved Plant: _____
      Error on Moved Plant: |pred - actual| → ______

    GARDEN 4 (Optional): 
      Parent Heights: [Given]
      Offspring Predictions: _____, _____, _____, _____
      Actual Offspring: _____, _____, _____, _____
      Avg. Prediction Error: ______
    ```
  - **Scoreboard (Whiteboard):**  
    | Team | Garden 1 Error | Garden 2 Error | Garden 3 Error | Garden 4 Error |  
    |------|----------------|----------------|----------------|----------------|  
    | 1    |                |                |                |                |  
    | ...  |                |                |                |                |  

  - **Rules Cheat Sheet (For You, Hidden from Students):**  
    - **Height = `B` + `G` + `E`**  
    - *Garden 1:* Parents/Offspring get **Deck 1 (G=5)** + **Deck A (random E)**.  
    - *Garden 2:* Parents/Offspring get **Deck 2 (variable G)** + **Deck B (E=0)**. After predictions, apply **+30 cm to all** (environment shift).  
    - *Garden 3:* Valley 1: **Deck 2 (G)** + **Deck C (E=20)**. Valley 2: **Deck 2 (same G)** + **Deck D (E=-20)**.  
    - *Garden 4:* Parents get **Deck 2 (G)** + **Deck E (E)**, with E assigned *strongest G=13 → E=15, G=9 → E=5, G=5 → E=-5, G=1 → E=-15*. Offspring get same G + **new random E from Deck A**.  

  ---

  ### **Activity Timeline (90 Minutes Total)**  
  **0–10 min: Setup & Rules**  
  - Divide students into 4 teams of 4. Introduce the game:  
    *“You’re plant breeders competing to predict offspring heights. Each garden has different rules. You’ll see parent heights, predict offspring, and score points for accuracy. Rules change subtly—stay alert! Write predictions BEFORE I reveal data. No stats jargon—use plain arithmetic.”*  
  - Emphasize: **“Commit predictions in writing before any data is shown.”**  

  **10–30 min: Garden 1 (Low "Resemblance", High Environmental Variance)**  
  - **Give:** Parent heights (e.g., Team 1 parents: `B=10` + `G=5` + random E from Deck A → e.g., `12`, `18`, `22`, `15`).  
  - **Task:** Predict offspring heights (same G, new random E from Deck A).  
  - **Reveal actuals:** e.g., `10+5+(-8)=7`, `10+5+0=15`, `10+5+8=23`, `10+5+16=31`.  
  - **Score:** Avg. absolute prediction error (e.g., |18-7|=11) → record on scoreboard.  
  - **Key Misconception:** Teams assume offspring will resemble parents. Errors will be high (15–20 avg typical).  

  **30–50 min: Garden 2 (High "Resemblance", Yet Environmentally Modifiable)**  
  - **Give:** Parent heights (Deck 2 G + Deck B E=0 → e.g., `10+1=11`, `10+5=15`, `10+9=19`, `10+13=23`).  
  - **Task:** Predict offspring (same G, E=0 → identical to parents).  
  - **Reveal actuals (pre-shift):** Same as parents (e.g., `11`, `15`, `19`, `23`). Errors near 0.  
  - **Then announce:** *“New fertilizer! Add +30 cm to every plant.”*  
  - **Reveal shifted offspring:** `41`, `45`, `49`, `53`.  
  - **Score:** Recompute error using shifted values (e.g., predicted `11` vs. actual `41` → error 30).  
  - **Pain Point:** Teams feel smart initially, then realize their predictions are catastrophically wrong.  

  **50–70 min: Garden 3 (Group Differences ≠ Genetics)**  
  - **Give:** Valley 1 parents (`10 + G + 20` → e.g., `31`, `35`, `39`, `43`). Valley 2 parents (`10 + G - 20` → e.g., `-9`, `-5`, `-1`, `3`).  
  - **Task 1:** Predict offspring *in same valley* (same G, same E → identical).  
  - **Reveal actuals (same valley):** Same as parents. Errors near 0.  
  - **Task 2:** Predict height if a Valley 1 parent’s seed is moved to Valley 2 (e.g., parent `43` in V1 → offspring in V2: `10 + G - 20`; parent `43 = 10 + 13 + 20` → G=13 → offspring `10+13-20=3`).  
  - **Reveal actual moved plant:** Dramatically lower (e.g., `43` → `3`).  
  - **Score:** Error = |prediction - actual| (e.g., if team predicts `43`, error=40).  
  - **Pain Point:** Teams trusting within-valley “resemblance” will predict high → massive error.  

  **70–80 min: Garden 4 (Optional; Gene-Environment Confounding)**  
  - **Give:** Parent heights (G + correlated E → e.g., `10+13+15=38`, `10+9+5=24`, `10+5-5=10`, `10+1-15=-4`).  
  - **Task:** Predict offspring (same G, *new random E from Deck A*).  
  - **Reveal actuals:** e.g., `10+13+(-8)=15`, `10+9+0=19`, `10+5+8=23`, `10+1+16=27`.  
  - **Score:** Avg. absolute error (e.g., |38-15|=23).  
  - **Key Insight:** Predictions overshoot because parents had hidden G-E advantage.  

  **80–90 min: Structured Debrief**  
  - **Rule:** Still no saying “heritability.” Use their language (“resemblance score,” “prediction error”).  
  - **Garden 1 Recap:**  
    - *What happened?* High prediction errors.  
    - *Why?* Environment varied wildly, swamping genetic similarity.  
    - *Concept:* “The number you computed measures how well parent traits predict offspring in *this specific environment*. Change the environment, and it changes.”  
  - **Garden 2 Recap:**  
    - *What happened?* Predictions perfect until environment shifted.  
    - *Why does it hurt?* Trait was 100% “heritable” yet 100% modifiable overnight.  
    - *Concept:* “A trait can be perfectly predictable from parents and *also* massively environmentally adjustable. One doesn’t block the other.”  
  - **Garden 3 Recap:**  
    - *What happened?* Within-valley predictions perfect, but moving plants caused huge errors.  
    - *Why?* Valley difference was environmental, not genetic.  
    - *Concept:* “Two groups can differ entirely due to environment, even if within each group, the trait is perfectly predictable from parents.”  
  - **Garden 4 (If Run):**  
    - *What happened?* Predictions worse than Garden 2.  
    - *Why?* Hidden link between genes and environment inflated parent-offspring resemblance.  
    - *Concept:* “If better genes get better environments, your prediction number gets inflated—but it’s not the genes alone.”  
  - **Final Unpacking:**  
    - “The number you’ve been computing is called *heritability*. It’s useful, but narrow:  
      1. It describes *a population in a specific environment*—not a trait or person.  
      2. High heritability ≠ unchangeable (Garden 2).  
      3. High heritability ≠ group differences are genetic (Garden 3).  
    - **Ethical Teaser:** *“Next week: Why does this get weaponized? When is it useful in medicine/agriculture?”*  

  ---

  ### **What Will Go Wrong (And How to Mitigate)**  
  1. **Garden 2 Misread:** Teams may think the +30 cm shift “confirms genes are fixed” (since order didn’t change).  
     - *Mitigation:* Hammer the takeaway during debrief: *“Yes, order stayed the same—but every plant changed. Heritability tells you about variation in a population, not whether you can change the population.”*  

  2. **Debrief Slides into “Heritability Is Meaningless”:**  
     - *Mitigation:* Preempt this: *“Heritability isn’t useless—it helps farmers breed drought-resistant crops. But it answers a narrower question than people assume.”* Focus on its *context-dependence*.  

  3. **Statistical Students Dominate:**  
     - *Mitigation:* Force written commitments before reveals. Use simple arithmetic (no stats). Make errors visceral (e.g., Garden 3 moved plant).  

  4. **Teams Miss Environmental Shift in Garden 2:**  
     - *Mitigation:* Announce the fertilizer dramatically: *“This changes EVERYTHING. Recompute your errors!”*  

  ---

  ### **What the Simulation CANNOT Do (Supply in Lectures)**  
  - **Real-World Estimation Challenges:**  
    - Measurement error, gene-environment interactions, non-additive effects.  
    - Assumptions in twin/adoption studies (e.g., “equal environments assumption”).  
  - **Ethical/Political Stakes:**  
    - Eugenics history, racial pseudoscience, ignoring structural inequality.  
    - Why high heritability for IQ ≠ unmodifiable or genetic group differences.  
  - **Complex Nuances:**  
    - Gene-environment correlation (beyond Garden 4’s simple version).  
    - Heritability changes with environmental range (e.g., if Deck A had less variance).  

  This activity gives students an embodied, competitive experience of heritability’s limitations. They’ll leave seeing it as a real but context-dependent tool—primed for deeper ethical discussion next week.
