     - What did we see? (Low resemblance between parent and offspring)
     - Why? (Because the environment was different and varied a lot)
     - The number (resemblance gap) was high. What does that tell us about the role of genes in this garden? (Not very strong because the environment varied so much)

  2. Garden2:
     - Step1: Perfect resemblance. Why? (Environment fixed, so only genes mattered)
     - Step2: Then we shifted the entire population by changing the environment. What does that tell us? (Even when the trait is entirely determined by genes in a particular environment, we can change the trait by changing the environment. So it is modifiable.)

  3. Garden3:
     - Within each valley, perfect resemblance. But when we moved a plant from Valley1 to Valley2, it became much shorter. Why? (Because the valleys had different environments. The group difference was due to environment, not genes.)

  4. Garden4 (if done):
     - Why wasn't the prediction as good as in Garden2? (Because in the parents, the best genes got the best environments, making them even taller. But the offspring didn't get that same environment boost, so they were not as tall as their parents would suggest.)

  Now, in the real world, scientists use a number called "heritability" to measure how much of the variation in a trait is due to genetic variation in a particular population and environment. 

  - In Garden1, heritability would be low because the environment varied a lot.
  - In Garden2 (step1), it would be 100%.
  - In Garden3, within each valley, it would be 100%, but the group difference was environmental.
  - In Garden4, the heritability estimate from the parent generation would be inflated because of the hidden gene-environment correlation.

  Key takeaways:
  1. Heritability is specific to a particular population in a particular environment.
  2. A high heritability does not mean the trait is fixed or unchangeable (as we saw in Garden2).
  3. High heritability within groups does not explain differences between groups (as in Garden3).

  We must be cautious in interpreting heritability estimates: they are not measures of how "biological" or "innate" a trait is, but rather of the current contribution of genetic variation to trait variation in a specific context.

  **Final note:**
  This simulation is a simplification. In reality, heritability is estimated from complex data and involves many assumptions. Also, the ethical and political context matters: heritability estimates have been misused to justify inequality and inaction. But they can also be useful, for example in agriculture (breeding) or medicine (understanding disease risk).

  We will discuss these complexities and the history in a future session.
