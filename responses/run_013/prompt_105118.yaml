  I'm considering a concrete scenario - maybe someone receiving unwanted information that ruins their experience. Like opening test results early and getting stressed despite identical outcomes. The key tension is knowing they were rational to look even though they regret it now. 

  For the punchline, I'll avoid naming the theorem explicitly. Instead, show the character's ironic realization that they can't blame their past self. The humor comes from that internal conflict between rational choice and emotional regret. 

  This targets the first feature - the ex ante expectation being positive even when ex post experience is negative. The joke should work because everyone has experienced "I wish I didn't know that" while acknowledging it was smart to check.
answer: |-
  Barry stood staring at the unopened envelope containing his genetic test results. "Free information," he muttered. "Can't hurt to know, right? Expected utility maximization!" He tore it open, scanned the page, and slumped onto the couch, face pale. "Increased risk for early-onset dementia... fantastic."
  His wife walked in. "Barry? What’s wrong?"
  He waved the paper weakly. "Got the results. Wish I’d never looked."
  "But you said knowing couldn't hurt, rationally speaking! That you could always ignore it!"
  Barry sighed, staring blankly at the wall. "Turns out, knowing *this*... hurts a lot. My past self was technically correct. My present self *really* hates my past self right now."
  *(The punchline turns on the distinction between the ex ante expected benefit of information and the ex post actual outcome, where the agent regrets receiving the information even though obtaining it was rational beforehand.)*
