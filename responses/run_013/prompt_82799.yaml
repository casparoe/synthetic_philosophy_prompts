prompt: |-
  I chair the Monday investment committee at a mid-sized long-only asset manager: seven people, roughly forty minutes per name, and a standing rule that we do not open a position until the committee has reached a view. Over the past two years I have noticed a pattern I cannot shake. Once two or three of us have spoken in favour of a thesis, the remaining speakers almost always land in the same place, and afterwards nobody can reconstruct what the fourth, fifth and sixth people actually contributed. My worry is not the familiar one about groupthink or pressure to conform. It is the sharper possibility from the economics of information: that at some point our discussion stops aggregating private information and starts transmitting only the fact that a view already exists, so that the agreement of the seventh person is evidence of nothing at all — and that this can happen while every individual in the room is behaving impeccably, given what they know. You are an expert in the economics of information and in decision support for practitioners, and I would like you to think this through carefully rather than reaching for the vocabulary of crowd psychology. Begin by setting out briefly what the sequential-decision models of information cascades (Banerjee; Bikhchandani, Hirshleifer and Welch) actually claim, and how they differ from the separate reputational explanation, in which people imitate because their standing depends on whether they are wrong alone rather than wrong together; I suspect I have been using the words herding and cascade loosely, and the remedies for the two mechanisms are not the same. Then build the procedure.

  The deliverable is a checklist a junior analyst can run before we vote — not a memo on a single position. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, the point at which the procedure stops and returns a verdict (either defer to the consensus, or discount it), and the point at which it hands the matter to a person because the remaining question is about risk appetite rather than about evidence, with the chief investment officer as the sign-off. It has to be runnable in the half hour before a Monday meeting, by someone who is not inside the other analysts' heads, using only what is observable: who spoke when, what each person said they were relying on, whether those reasons trace back to a common source, whether the action someone took would have been the same whatever private evidence they held, and whether anyone in the room is being paid, promoted or judged in a way that rewards agreement with a particular person. It must keep the theory's central distinction intact — that a run of agreeing decisions may be genuine aggregation of many independent signals, in which case my lone contrary signal should be heavily discounted, or a cascade, in which case the count is uninformative, a single independent piece of evidence deserves far more weight than its own strength would suggest, and a deviation from the pattern is itself informative — and it should be honest about the fact that no procedure can settle this from the outside with certainty.

  Then run the procedure on three cases. First, a house view, four months old, that a particular frontier sovereign's local-currency debt is uninvestable: on inspection it traces back to one widely circulated internal note that everyone has since read, and each subsequent speaker has cited that note's reasoning as the starting point of their own. Second, a house view that a mature industrial sector is in structural decline, where the teams that reached it did so separately, from different data, before the committee ever discussed it, and where one of them reversed its position last year on the strength of a single company's disclosures. Third, a name where I hold a private and moderately strong piece of evidence against a consensus that I believe is genuinely aggregative, and where I would very much like the procedure to tell me to back myself. I expect the procedure to tell me something I will not like in at least one of these three; say plainly which case that is, and why. Finally, mark the two or three places where the procedure is really a judgement call dressed up as a test, and state what it cannot do.
reasoning: |-
  We are given a problem in which an investment committee is experiencing what the chair suspects might be information cascades. The chair wants a procedure to distinguish between genuine aggregation of independent information and cascades (where later individuals are ignoring their own signals and following the early speakers). The procedure must be a checklist that a junior analyst can run before the vote, using only observable data. It must also be grounded in the theory of information cascades (as opposed to reputational herding).

  ## Key Theoretical Background

  ### Information Cascades (Banerjee; Bikhchandani, Hirshleifer and Welch)
  - In a sequential decision-making model, individuals make decisions in sequence, each having some private signal and also observing the decisions (but not the private signals) of those who acted before them.
  - An information cascade occurs when it becomes rational for an individual to ignore their own private signal and follow the decisions of previous individuals, even if their own signal suggests the opposite. This happens when the public information (from the prior decisions) becomes so strong that it overrides any individual's private signal.
  - Once a cascade starts, the decisions of subsequent individuals add no new information because they are just following the crowd. Thus, the public count of decisions becomes uninformative.
  - Cascades can be fragile: a single piece of contrary evidence (if it becomes public) can break the cascade.

  ### Reputational Herding
  - This occurs when individuals choose to mimic the decisions of others because they care about their reputation. Even if their private signal suggests otherwise, they might choose to conform to avoid standing out (and being blamed if wrong) or to gain from being part of the consensus.
  - The key difference: in an information cascade, individuals are rationally ignoring their own signals because the public information (from prior actions) is overwhelming. In reputational herding, they are ignoring their own signals because of social or career pressures.

  The chair is concerned primarily with information cascades (the economics of information) and not reputational herding (which is more about psychology and incentives). Therefore, the checklist should focus on the information cascade mechanism.

  ## Building the Procedure: Checklist for a Junior Analyst

  The checklist must be based on observable data:
  - Who spoke when?
  - What each person said they were relying on (their stated reasons)?
  - Whether those reasons trace back to a common source?
  - Whether the action someone took would have been the same whatever private evidence they held (i.e., were they just following the prior speakers regardless of their own signal)?
  - Whether anyone is being paid, promoted, or judged in a way that rewards agreement with a particular person (to rule out reputational herding).

  The checklist should output one of:
  - **Defer to consensus**: The consensus is likely aggregating independent information, so it should be given weight.
  - **Discount the consensus**: The consensus might be a cascade and hence uninformative; therefore, a single independent piece of evidence (like the chair's) should be given more weight.
  - **Hand to the CIO**: The issue is about risk appetite (a normative decision) and not about evidence (a positive matter).

  ### The Checklist Questions

  We design the checklist to be run in the order of speaking. The goal is to detect whether at some point the speakers stopped providing independent signals and started following the prior consensus.

  **Question 1: Is there a common source of information that everyone is citing?**
  - **Observable**: Look at the stated reasons of each speaker. If multiple speakers cite the same source (e.g., an internal note, a specific report, or a particular data point) and that source was available to all, this is a red flag for a potential cascade because it suggests that the information is not independent.
  - **Sufficient answer**: If at least two of the first three speakers base their argument primarily on a common source (and that source is the same for both), then we mark this as a potential cascade trigger. Also note if subsequent speakers are citing the same source without adding new independent evidence.
  - **If yes (common source)**: Proceed to Question 2A.
  - **If no (diverse sources)**: Proceed to Question 2B.

  **Question 2A (common source path): Did the subsequent speakers (after the first two who used the common source) introduce new independent evidence?**
  - **Observable**: For each speaker after the first two who used the common source, note if they bring up a new piece of evidence (not derived from the common source) and if that evidence is substantial enough to have changed their mind if they had not known about the common source.
  - **Sufficient answer**: If any subsequent speaker does not introduce new independent evidence and instead merely endorses the common source reasoning, then we suspect a cascade might have started. If all subsequent speakers introduce new independent evidence, then we are less worried.
  - **If at least one subsequent speaker did not introduce new independent evidence**: This suggests a cascade might be occurring. Proceed to Question 3.
  - **If all subsequent speakers introduced new independent evidence**: Then we are less concerned about a cascade. Proceed to Question 4.

  **Question 2B (diverse sources path): Are the reasons given by the first three speakers based on independent data or analysis?**
  - **Observable**: Check the stated reasons of the first three speakers. Are they relying on different datasets, different methods, or different sources? Are these sources independent (e.g., one uses company filings, another uses industry reports, a third uses proprietary channel checks)?
  - **Sufficient answer**: If the first three speakers are using independent sources and methods, then we have a good foundation for aggregation. If they are using overlapping sources (even if not identical) then we are less confident in independence.
  - **If independent**: Proceed to Question 4.
  - **If not independent**: Proceed to Question 3.

  **Question 3: For any speaker after the first two, would they have made the same decision regardless of their private information?**
  - **Observable**: This is tricky but we can look for clues in what they said. Did they mention having a private signal that conflicted with the emerging consensus but then dismissed it? Did they explicitly state that they are following the prior speakers? Alternatively, did they state that their own analysis (which they describe) led them to the same conclusion? We can also look at the strength of their reasoning: if they only weakly endorse the consensus without providing substantive reasons, that's a red flag.
  - **Sufficient answer**: If at least one speaker after the first two gives an indication that they would have reached the same conclusion even without their private signal (or if they do not mention any private signal and just endorse the prior speakers), then we suspect a cascade. If every speaker provides a strong independent reason (even if it aligns with the consensus) then we are less concerned.
  - **If at least one speaker would have followed regardless**: Then we have evidence of a cascade. Output: **Discount the consensus**.
  - **If not (every speaker provided an independent reason)**: Proceed to Question 4.

  **Question 4: Is there evidence of reputational herding?**
  - **Observable**: We look at incentives. Are there any observable incentives that reward agreement? For example:
    - Compensation structure: Do bonuses depend on agreement with the team?
    - Performance evaluations: Is there a history of punishing dissent?
    - Promotion records: Have those who dissented been passed over?
    - In the current meeting: Did anyone make a statement that suggests fear of dissent (e.g., "I don't want to rock the boat")?
  - **Note**: We are not inside their heads, so we rely on observable incentives and statements.
  - **Sufficient answer**: If there is any evidence that reputational concerns are at play (e.g., a known incentive structure that rewards conformity, or explicit statements in the meeting), then we must note that the consensus might be driven by herding. However, note that the chair is more concerned about cascades. But if reputational herding is present, we might discount the consensus for that reason as well.
  - **If reputational herding is present**: Output: **Discount the consensus** (because we cannot disentangle the two, and both lead to uninformative consensus).
  - **If no evidence of reputational herding**: Proceed to Question 5.

  **Question 5: Is the remaining issue about risk appetite?**
  - **Observable**: Sometimes, even if the evidence is clear, the decision might hinge on the firm's risk tolerance. For example, two people might agree on the expected return and risk of an asset but disagree on whether the risk is acceptable for the firm.
  - **How to check**: Look at the nature of the disagreement. If the consensus is about the facts (e.g., "this company will grow at 5%") and the dissent is about the facts, then it's evidentiary. But if the consensus is about the facts and the dissent is about whether the risk is too high (e.g., "even if the growth is 5%, the volatility is too high for our fund"), then it's about risk appetite.
  - **Sufficient answer**: If the disagreement is about risk appetite (i.e., the evidence is not in dispute, but the willingness to bear the risk is), then we hand the matter to the CIO.
  - **Output**: If the issue is about risk appetite: **Hand to the CIO**. Otherwise, we have no strong reason to discount the consensus, so **Defer to consensus**.

  ### Flow of the Checklist

  1. **Question 1**: Common source? 
     - Yes -> Question 2A
     - No -> Question 2B

  2. **Question 2A** (common source): Subsequent speakers introduced new independent evidence?
     - No (at least one did not) -> Question 3
     - Yes (all did) -> Question 4

  3. **Question 2B** (diverse sources): First three independent?
     - No (not independent) -> Question 3
     - Yes (independent) -> Question 4

  4. **Question 3**: Any speaker after the first two would have followed regardless of private signal?
     - Yes -> **Discount the consensus**
     - No -> Question 4

  5. **Question 4**: Reputational herding?
     - Yes -> **Discount the consensus**
     - No -> Question 5

  6. **Question 5**: Is the issue about risk appetite?
     - Yes -> **Hand to the CIO**
     - No -> **Defer to consensus**

  ### Important Notes
  - The procedure is designed to be run on the history of the committee's discussion for a given investment decision.
  - The junior analyst must record the order of speakers and the reasons they provided.
  - The procedure stops as soon as it reaches an output (Discount, Defer, or Hand to CIO).
  - The procedure is not foolproof. It is a heuristic based on observable data.

  ## Running the Procedure on Three Cases

  ### Case 1: House view on frontier sovereign's local-currency debt (uninvestable)
  - **Background**: The view traces back to one internal note that everyone has read. Subsequent speakers cite that note's reasoning.
  - **Checklist**:
    1. **Question 1**: Is there a common source? Yes, the internal note.
    2. **Question 2A**: Did subsequent speakers introduce new independent evidence? No, they just cited the note.
    3. Then we go to **Question 3**: For any speaker after the first two, would they have made the same decision regardless? Since they only cited the note and didn't bring new evidence, it's likely that they would have followed the note regardless of their own private signal. So, we answer **Yes** to Question 3.
    4. **Output**: **Discount the consensus**.

  ### Case 2: House view on a mature industrial sector in structural decline
  - **Background**: Teams reached the view separately, from different data, before the committee discussed. One team reversed last year based on a single company's disclosures.
  - **Checklist**:
    1. **Question 1**: Is there a common source? No, because the teams reached the view separately from different data.
    2. **Question 2B**: Are the first three speakers' reasons independent? We assume the first three speakers (representing the teams) are using independent sources and methods. So, **independent**.
    3. Then we skip Question 3 and go to **Question 4**: Reputational herding? We are told nothing about incentives, so we assume no evidence of herding.
    4. **Question 5**: Is the issue about risk appetite? The chair doesn't indicate that the issue is about risk appetite. The evidence is aggregated independently. 
    5. **Output**: **Defer to consensus**.

  ### Case 3: The chair has private evidence against a consensus that is genuinely aggregative
  - **Background**: The chair believes the consensus is aggregating independent information (so we are not in a cascade) but has a private signal against it. The chair would like the procedure to tell him to back himself.
  - **Checklist**:
    1. **Question 1**: Common source? We assume no common source (because it's genuinely aggregative).
    2. **Question 2B**: First three independent? Yes.
    3. Then **Question 4**: Reputational herding? We assume no.
    4. **Question 5**: Risk appetite? We assume the chair's dissent is about the evidence (not risk).
    5. **Output**: **Defer to consensus** (because the checklist found no reason to discount the consensus).

  The chair will not like the result of Case 3 because the procedure says to defer to the consensus, even though the chair has a private signal. However, note that the procedure is designed to detect cascades and herding. If the consensus is genuinely aggregative (as the chair believes), then the procedure correctly says to defer. The chair's private signal, in this case, is just one against many independent signals. The theory says that in a genuine aggregation, one should discount one's own signal when it goes against a strong consensus.

  ## Limitations and Judgment Calls

  ### Judgment Calls
  1. **Question 3**: Determining whether a speaker would have made the same decision regardless of private information is inherently a judgment call. We rely on what they say. If they don't mention a private signal and just agree, we might infer they are following. But they might have had a signal and not mentioned it. We are limited by what is observable.
  2. **Question 2A/2B**: Deciding if sources are "independent" or if evidence is "new and independent" is a judgment. For example, if two speakers use the same industry report but different pages, is that independent? The analyst must make a call.
  3. **Question 4**: Assessing reputational herding from observable incentives is also a judgment. The junior analyst might not have access to all compensation details or might misinterpret statements.

  ### What the Procedure Cannot Do
  - It cannot definitively prove that a cascade occurred. It can only raise red flags.
  - It cannot assess the quality of the evidence, only the independence and whether it was used.
  - It cannot read minds. It relies on what people say and do.
  - It cannot account for private signals that are not revealed. Therefore, it might miss a cascade if individuals are hiding their true reasons.

  Despite these limitations, the procedure provides a structured way to challenge the consensus and avoid blindly following what might be an uninformative cascade.
answer: |-
  ### Checklist for Detecting Information Cascades in Investment Committee Deliberations  
  **Purpose:** To distinguish between genuine information aggregation (value in consensus) and information cascades (consensus uninformative). Based on observable data only. Run by junior analyst pre-meeting.  
  **Outputs:**  
  - **Defer to consensus** (genuine aggregation; discount lone dissent).  
  - **Discount consensus** (cascade likely; lone dissent carries weight).  
  - **Hand to CIO** (issue is risk appetite, not evidence).  

  ---

  ### Procedure Checklist  
  *(Run in sequence; stop at first conclusive output)*  

  1. **Trace Back the First Two "Yes" Votes**  
     - *Question:* Did the first two speakers in favor cite **distinct, verifiable sources** for their thesis? (e.g., independent data sets, separate models, unrelated third-party reports).  
     - *Sufficient Answer:*  
       - **Yes** (distinct sources) → Proceed to Question 3.  
       - **No** (shared source or no source cited) → Proceed to Question 2.  
     - *Observables:* Speaker 1 and 2’s stated reasons, footnotes in pre-reads, attribution in meeting minutes.  

  2. **Identify Common Source Contamination**  
     - *Question:* Is the thesis **traceable to a single dominant source** (e.g., one internal note, one sell-side report) for ≥3 speakers?  
     - *Sufficient Answer:*  
       - **Yes** (e.g., Speakers 3–7 cite the same source as Speakers 1–2) → **Discount consensus**.  
       - **No** (subsequent speakers added new, uncorrelated sources) → Proceed to Question 3.  
     - *Observables:* Overlap in references, replication of reasoning chains, timestamps of document circulation.  

  3. **Test for Independence in Later Speakers**  
     - *Question:* Did **any speaker after the first two** introduce **material, non-derivative evidence** not inferable from prior speakers? (e.g., original analysis, proprietary data, contradictory source).  
     - *Sufficient Answer:*  
       - **Yes** (≥1 later speaker added unique evidence) → Proceed to Question 4.  
       - **No** (all later speakers parroted prior logic without augmentation) → **Discount consensus**.  
     - *Observables:* Novel points in meeting transcripts, footnoted data not in prior materials, explicit claims of new evidence.  

  4. **Assess Reputational Incentives**  
     - *Question:* Is there **observable evidence** that agreement with early speakers is rewarded? (e.g., compensation metrics, promotion patterns, past reprimands for dissent).  
     - *Sufficient Answer:*  
       - **Yes** (e.g., bonus tied to committee harmony) → **Discount consensus** (reputational herding).  
       - **No** (no such incentives documented) → Proceed to Question 5.  
     - *Observables:* HR policies, performance review criteria, public praise/criticism records.  

  5. **Determine Risk-Appetite Dependence**  
     - *Question:* Is the **core disagreement** about evidence (e.g., "Will this asset return 5%?") or **risk tolerance** (e.g., "Is 5% worth the volatility?")?  
     - *Sufficient Answer:*  
       - **Evidence** → **Defer to consensus** (genuine aggregation).  
       - **Risk tolerance** → **Hand to CIO**.  
     - *Observables:* Transcripts framing dissent around "too risky" vs. "wrong data," absence of new facts in opposition.  

  ---

  ### Application to Three Cases  

  #### Case 1: Frontier Sovereign Debt ("Uninvestable" House View)  
  - **Background:** Consensus traces to one internal note; all speakers cite it.  
  - **Checklist:**  
    - Q1: First two "yes" speakers share source (internal note) → **Q2**.  
    - Q2: Single source dominates all speakers → **Discount consensus**.  
    - **Output: Discount consensus** (cascade likely; dissent deserves weight).  
  - **Why?** No unique evidence after the note. Later speakers’ agreement is uninformative.  

  #### Case 2: Industrial Sector Decline (House View)  
  - **Background:** Teams reached view independently; one reversed on new data.  
  - **Checklist:**  
    - Q1: First two "yes" speakers used distinct data → **Q3**.  
    - Q3: Later speakers added original evidence (e.g., reversal based on new disclosures) → **Q4**.  
    - Q4: No reputational incentives observed → **Q5**.  
    - Q5: Issue is evidence (sector growth), not risk → **Defer to consensus**.  
  - **Output: Defer to consensus** (genuine aggregation; lone dissent discounted).  
  - **Chair’s Discomfort:** None (expected result).  

  #### Case 3: Chair’s Private Evidence vs. Consensus  
  - **Background:** Chair has private signal against a consensus believed to be aggregative.  
  - **Checklist:**  
    - Q1: First two "yes" used distinct sources → **Q3**.  
    - Q3: Later speakers added unique evidence → **Q4**.  
    - Q4: No reputational incentives → **Q5**.  
    - Q5: Issue is evidence (not risk) → **Defer to consensus**.  
  - **Output: Defer to consensus** (procedure confirms aggregation; chair’s dissent overruled).  
  - **Chair’s Discomfort:** High. The procedure rejects the chair’s wish to "back yourself."  
  - **Why?** The checklist found no cascade markers. In aggregative settings, one signal (even strong) should bow to consensus.  

  ---

  ### Limitations and Judgment Calls  
  1. **Q3 (Independence Test):**  
     - *Judgment Call:* Deciding if evidence is "non-derivative" requires interpreting whether data/model truly required original work. Example: Two speakers using the same database but different queries might be judged independent—or not.  
     - *Blind Spot:* Cannot detect if a speaker had a private signal but suppressed it (unobservable).  

  2. **Q5 (Evidence vs. Risk):**  
     - *Judgment Call:* Distinguishing "I disagree with the growth forecast" (evidence) from "The growth isn’t worth the liquidity risk" (risk appetite) rests on phrasing in transcripts.  
     - *Blind Spot:* Cannot resolve mixed motives (e.g., dissent blending evidence and risk).  

  3. **Q4 (Reputational Incentives):**  
     - *Judgment Call:* Inferring incentives from policy documents ignores informal pressures (e.g., cultural norms).  
     - *Blind Spot:* No procedure can quantify how much reputational concerns sway decisions.  

  **What the Procedure Cannot Do:**  
  - **Prove cascades definitively.** It flags risk but cannot access private signals.  
  - **Override strong evidence.** A cascade diagnosis doesn’t make dissent correct—only weight-worthy.  
  - **Handle ambiguous sources.** E.g., if three speakers use overlapping but not identical data.  

  ---

  ### Final Recommendation  
  Use this checklist 30 minutes pre-meeting. If output is "Discount consensus," the chair should:  
  1. Request speakers with late-agreeing votes to restate their **private evidence only** (ignoring prior speakers).  
  2. If no new evidence emerges, reopen discussion with a focus on **dissenting signals**.  

  This respects the economics of information: In cascades, the *pattern* of agreement is the anomaly, not the dissent.
