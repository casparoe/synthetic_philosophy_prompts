prompt: |-
  Take a practice that many institutions share without ever theorizing it: they treat a thing as numerically the same thing across the total replacement of its parts. A museum ship whose last original timber was replaced decades ago is still exhibited, insured, and registered under the same name; a cathedral rebuilt stone by stone after a fire is called the same building; a corporation whose every shareholder, director, and employee has been replaced remains the same legal person. What seems to hold these cases together is neither the material nor even the form, but the continuity of a process and an authoritative record — a maintenance log, a deed, a register — that certifies the succession. Reconstruct the theory of persistence that this practice presupposes. Is it continuity of matter, continuity of form or function, or the continuity of a causal and institutional chain that the record merely documents? Separate what the practice strictly requires from what it merely fits comfortably with, and identify the rival views it quietly rules out. Then press the practice with two cases it cannot indefinitely avoid: a second vessel assembled from the removed original planks, and a faithful replica built to the original plans after the first is destroyed. Which, if either, does the practice treat as the same, and does that verdict follow from a coherent theory or from an unexamined convention about records and title? Close by saying what would have to change in the practice if we adopted a four-dimensionalist account of persistence instead, or the view that an object cannot survive the loss of even one of its parts. Answer in continuous prose, with no headings, bullet points, bold text, or tables — just the way you would set this out in a letter.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about identity and persistence. The user presents several real-world examples where institutions treat objects as identical despite complete part replacement - museum ships, rebuilt cathedrals, corporations with entirely new personnel. They're asking me to reconstruct the implicit theory behind this practice.

  First, I need to identify the common thread. The user suggests it's not material or form, but rather continuity of process and authoritative records. That seems right - the ship remains the same because there's an unbroken chain of maintenance logs, the cathedral through deeds and reconstruction plans, the corporation through legal registries.

  The key question is what this practice strictly requires versus what it accommodates. Strictly, it demands an unbroken institutional/causal chain documented by records. It doesn't require material continuity (since all parts can be replaced) or even identical form/function (witness how corporations evolve). This quietly rules out theories like mereological essentialism (no part can change) or strict material continuity.

  Now for the test cases: First, the "reassembled ship" made from original planks. The practice would likely reject this as the original because the institutional chain was broken when the planks were discarded. Second, the "replica" built after destruction - again rejected because no continuous process connects them.

  This reveals the practice relies heavily on institutional conventions about records and title rather than a coherent metaphysical theory. The verdicts feel arbitrary if we question why the record holds such privilege.

  If we adopted four-dimensionalism (objects as spacetime worms), the practice might need to emphasize temporal stages more, but could maintain similar conventions. Mereological essentialism would destroy the practice entirely - no replacement would be permitted.

  The user seems philosophically sophisticated - they've constructed excellent test cases to probe the boundaries of this concept. I should maintain that level of rigor in response while keeping it prose-based as requested. The challenge will be unpacking all this clearly without structural aids like headings.
answer: |-
  The practice you describe reveals an implicit theory of persistence that privileges institutional continuity over material or formal identity. What strictly holds these cases together is neither the matter nor the form/function in isolation, but the unbroken causal and institutional chain, formally documented by an authoritative record. The log, deed, or register doesn't merely *document* the succession; it *constitutes* the identity in the institutional context. The record provides the official thread that stitches the entity together across time, authorizing the declaration that "this is the same thing" despite the total replacement of parts or personnel.

  This practice strictly requires two elements: (1) an unbroken causal process linking the successive states of the entity (the continuous maintenance, rebuilding, or corporate operation), and (2) an authoritative institutional framework that recognizes and certifies this continuity through its designated records. The matter is incidental; the practice readily accepts total material replacement. Form or function is often preserved, and fits comfortably with the practice, but it isn't strictly necessary. A corporation can radically change its function, a ship can be refitted for a new purpose, yet remain the "same" entity under its original registry. What the practice quietly rules out are theories that make identity dependent on material continuity (mereological essentialism – the idea that an object cannot survive the loss of *any* of its parts) or on strict sameness of form/function. It also implicitly rejects views where identity is solely determined by intrinsic properties, placing decisive weight instead on the extrinsic, institutional narrative certified by the record.

  The two test cases expose the limits and conventions of this practice. For the second vessel assembled from the original planks: the practice would *not* recognize this as the original ship. The critical institutional chain was broken when the original ship, certified by its log and registry, continued its existence through the replacement of those very planks. The discarded planks lost their status as parts of *that* institutional entity once removed. Assembling them creates a new object, lacking the unbroken causal history and official record tracing back to the original keel-laying. It might be materially closer to the origin, but institutionally, it is a new thing – perhaps a replica or a relic, but not *the* ship.

  For the faithful replica built after the original is destroyed: the practice would also *deny* that this is the same cathedral or ship. The destruction constitutes a break in the causal chain. The replica, no matter how perfect, originates after that break. While it may share form, function, and even material (if using similar stone or timber), it lacks the continuous institutional process linking it causally to the original construction and existence. The deed or register pertains to the original chain that ended with destruction. The replica requires its own new deed and institutional recognition, marking it as a distinct entity.

  These verdicts demonstrate that the practice relies fundamentally on institutional convention concerning records and title, not a purely metaphysical or material theory of identity. The record doesn't just track identity; it defines it within the institutional sphere. The "same" entity is the one occupying the designated slot in the ongoing institutional narrative, certified by the unbroken record. Coherence is found within the logic of the institution and its need for stable referents across time, not in an analysis of the object's intrinsic nature.

  Adopting a rival theory would necessitate significant changes to this practice. Mereological essentialism, holding that an object cannot survive the loss of even one part, would render the practice impossible. Any replacement of a timber, stone, shareholder, or employee would constitute the end of the original entity and the creation of a new one. The museum ship would cease to exist with the first replacement plank, requiring constant re-registration and fundamentally undermining the concept of a preserved historical entity. Insurance and legal title would become chaotic.

  Four-dimensionalism, viewing objects as extended "spacetime worms" composed of temporal parts, would change the practice's *interpretation* but potentially preserve its outcomes. The "same" ship or cathedral, under 4D, would be the entire spatiotemporal continuum from construction onwards, including all stages of repair and replacement. The record would still be crucial for *tracing* that specific worm through time and distinguishing it from overlapping or adjacent worms (like the reassembled planks or the replica). However, the emphasis might shift: the record wouldn't *constitute* identity so much as *identify* which particular 4D object is being referred to. The verdicts on the test cases might remain similar, but justified by the replica or reassembled vessel being distinct spacetime worms, separate from the original's continuous worldline. The practice's reliance on unbroken causal chains would align well with identifying continuous spacetime worms. Fundamentally, while the underlying metaphysics shifts, the practical need for stable reference via records might persist, albeit with a different philosophical justification.
