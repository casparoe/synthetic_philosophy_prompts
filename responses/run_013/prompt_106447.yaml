answer: |-
  Your frustration resonates deeply with core challenges in AI and philosophy of mind. The unifying concept is **The Frame Problem**, named by John McCarthy and Patrick Hayes in 1969. Let's dissect it:

  ### 1. **The Core: The Frame Problem (Your First Headache)**
     - **What it is**: The problem of efficiently determining which facts *remain true* after an action or event, without explicitly listing everything that *doesn't* change.
     - **Your Example**: When the door opens, the system shouldn't recompute the cat's location or light bulb status. Humans intuitively know these are unrelated; machines lack this "relevance detector."
     - **Scope**: Unique to systems that model change (robotics, automation, planning). It's not about incomplete information, but about *efficiently managing persistence* amid change.

  ### 2. **The Qualification Problem (Your Second Headache)**
     - **What it is**: The impossibility of listing *all* preconditions for an action ("heat the room if cold... unless the window is open, unless the system is disabled, unless...").
     - **Relation to Frame**: Often called the Frame Problem's "twin." It asks: "What must be true for this action to work?" while Frame asks: "What stays true afterward?"
     - **Key Difference**: Qualification is about *anticipating* necessary conditions; Frame is about *updating* world states post-change.

  ### 3. **The Ramification Problem (Your Third Headache)**
     - **What it is**: Unintended cascading consequences of actions (heater → temp rise → humidity change → rule cascade).
     - **Relation to Frame**: A consequence of the Frame Problem. If the system can't filter relevant effects, it triggers chains of reactions.
     - **Boundary**: Ramification focuses on *indirect effects*; Frame focuses on *persistence of unrelated facts*.

  ---

  ### Why They're Bundled (Yet Distinct)
  - **Shared Root**: All three stem from **symbolic representation** of dynamic worlds. Logic-based systems (like your rule engine) struggle with:
    - Relevance detection (what matters?)
    - Implicitness (what can be left unsaid?)
    - Scalability (how to avoid exponential rules?).
  - **Human Contrast**: Humans use:
    - **Causality heuristics** (door opening ⇒ person entering, not cat moving).
    - **Relevance filtering** (ignore humidity when deciding on heat).
    - **Pattern recognition** (past exceptions inform new rules).
    - *This is why Frame Problem is primarily a computational issue*, not a human one.

  ---

  ### Boundaries and Terminology
  | Problem             | Core Question                          | Your Example                     | Canonical Term               |
  |---------------------|----------------------------------------|----------------------------------|------------------------------|
  | **Qualification**   | "What must hold for action X to work?" | Endless preconditions for heating | Qualification Problem        |
  | **Frame**           | "What stays true after action X?"      | Porch light status unchanged     | Frame Problem (narrow sense) |
  | **Ramification**    | "What indirect effects follow X?"      | Heater triggering humidity rules | Ramification Problem         |

  - **What it's NOT**:
    - **Incomplete Information**: That's about *uncertainty* (e.g., "is the window open?"). Your issue is about *efficiency in reasoning* given known facts.
    - **General Complexity**: It specifically arises in systems modeling state changes over time.

  ---

  ### Practical Implications
  - **AI Approaches**:
    - **Probabilistic Models** (Bayesian networks): Assign likelihoods to state persistence.
    - **Non-Monotonic Logic**: Allow rules with exceptions ("heat unless window open").
    - **Machine Learning**: Train systems to infer relevance from data (e.g., door sensors correlate with occupancy, not bulb status).
  - **Your System**: Consider shifting from "if-then" rules to:
    - **State Machines**: Explicitly model device states.
    - **Context Variables**: Group related conditions (e.g., `system_enabled=true`).
    - **Event Filtering**: Ignore events unrelated to active rules.

  ### Philosopher's Insight
  Your friend likely recalled Hubert Dreyfus' critique of AI. He argued the Frame Problem reveals a fundamental gap between human *embodied cognition* (understanding context intuitively) and symbolic AI. In essence: **machines lack a "sense of relevance" rooted in lived experience**.

  The Frame Problem cluster exposes why "common sense" automation is deceptively hard – but naming it is the first step toward solutions.
