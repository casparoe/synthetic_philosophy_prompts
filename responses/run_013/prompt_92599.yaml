prompt: |-
  I am planning a ninety-minute session for a reading group of final-year undergraduates in economics and philosophy. They can state Arrow's theorem and they know the difference between a social welfare function and a social choice function, but they have never met Gibbard–Satterthwaite, and I want them to leave not only able to state it but with the sense that it could not have come out otherwise. Do not explain the theorem to me. Give me the teaching plan.

  The whole session must hang on a single voting rule, which I shall write on the board in the first five minutes and never take down. Here it is. Five voters choose one of three options, A, B and C. Each voter submits a strict ranking of the three. Any option ranked last by the greatest number of voters is struck out; if two options tie for the greatest number of last-place rankings, strike out the one that loses the head-to-head comparison between them. Of the two survivors, the one that a majority of the voters rank higher wins. If the rule I have just described happens to fail one of the theorem's hypotheses -- if it is not onto, or is secretly dictatorial, or is in fact already strategy-proof -- say so before anything else, because then the session is built on sand.

  What I need from you:

  - The order in which the ideas must come, and why each is unavailable until the previous one is in place: the voting rule as a function from profiles to a single winner; the requirement that the rule be onto; what dictatorship amounts to here; and the idea of a profitable misreport, which I take to be the pivot of the session and which I want the students to reach only once they can already half-feel its possibility.
  - The single profile, drawn from my rule, that should carry the demonstration, and what it must have and must lack for the manipulation to be visible without looking contrived -- in particular, whether the manipulating voter should be lying about their favourite or merely about a lower ranking, and why.
  - The misconceptions they will arrive with or form, and the exact point in the sequence at which each must be headed off. I am expecting at least these: that strategy-proofness means truthful voting is a Nash equilibrium; that the theorem says every vote is pointless or every result is rigged; that dictatorship here means a voter with disproportionate power rather than one who always gets their top choice; that it is just Arrow's theorem with the words changed; and that cardinal or randomised rules are an escape. Tell me which of these is a genuine misconception and which is a defensible reading I should not be stamping on.
  - What the session must deliberately not attempt at this level, and how I should say so without the omission feeling like a hole.
  - One question to put at the end that would show whether they have grasped the theorem rather than merely followed the board.

  Please write the plan in British English.
reasoning: |-
  We are given a voting rule for five voters and three alternatives {A, B, C}. The rule:
  1. Strikes out the alternative that has the highest number of last-place rankings. If there is a tie for the highest number of last-place votes, then between the tied alternatives, strike out the one that loses the head-to-head comparison (i.e., the one that is ranked below the other by a majority of voters).
  2. Then, between the two survivors, the one that a majority of voters rank higher wins.

  We must first check if the rule satisfies the hypotheses of the Gibbard-Satterthwaite theorem. The theorem requires:
  - The rule is defined for all strict preference profiles (which it is).
  - The rule is onto (surjective): every alternative can win for some profile.
  - The rule is not dictatorial.

  We must verify the rule is onto and not dictatorial. Let's check:

  Onto: We need to show that A, B, and C can each win.

  Example for A to win: 
    Suppose all five voters rank A first, then B, then C. Then no one ranks A last. Let the last-place votes: 
      A: 0, B: 0, C: 5 -> so C is struck out. Then between A and B, all voters rank A above B -> A wins.

  Similarly for B and C. So the rule is onto.

  Dictatorial? We must check if there is a voter such that the rule always selects that voter's top choice. Clearly not: 
    Consider a profile where voter 1 has A top, but all others have B top and A last. Then:
      Last-place votes: A: 4 (voters 2,3,4,5), B: 0, C: 1 (voter 1) -> so A is struck out. Then between B and C, all voters (except voter 1) rank B above C -> B wins. So voter 1's top choice (A) did not win. Hence, not dictatorial.

  The rule is also non-imposed (onto) and defined for at least three alternatives. Therefore, by Gibbard-Satterthwaite, it is manipulable.

  Now, the teaching plan:

  Total time: 90 minutes.

  **Overall Structure:**
  1. (5 min) Introduce the voting rule and write it on the board. Verify that it satisfies the conditions for Gibbard-Satterthwaite (onto and non-dictatorial). 
  2. (15 min) Build the concept of a social choice function and the idea of truthful reporting. Then introduce the idea of a profitable misreport (manipulation). 
  3. (30 min) Work through a specific profile that demonstrates manipulation. 
  4. (20 min) Discuss the theorem statement and its implications, addressing misconceptions.
  5. (15 min) Conclusion and a question to test understanding.
  5. (5 min) Buffer.

  **Detailed Plan:**

  **1. Introduction (5 minutes)**
     - Write the voting rule on the board as given. 
     - Explain that we are going to use this rule to explore a fundamental result in social choice theory: the Gibbard-Satterthwaite theorem.
     - State: "We must first check that this rule meets the conditions of the theorem: it is defined for all strict preference profiles (which it is), it is onto (every alternative can win under some profile), and it is not dictatorial (no single voter always gets their top choice). We've just seen examples that confirm this. So, the theorem applies: this rule must be manipulable. Today we will see how."

  **2. Setting the Stage: Social Choice and Manipulation (15 minutes)**
     - Remind: A social choice function (SCF) is a rule that assigns a single winner to each profile of rankings. Our rule is an SCF.
     - Key idea: We assume voters have strict preferences (no ties) and report rankings. But they might not report truthfully if they can get a better outcome by lying.
     - Define a "profitable misreport": For a voter i, at a profile of preferences (including the true preferences of others), if by reporting a ranking different from their true one, the outcome becomes better for them (according to their true preferences) than if they had reported truthfully, then that is a profitable manipulation.
     - Why is this important? It means the rule is not strategy-proof (or not incentive-compatible). The Gibbard-Satterthwaite theorem tells us that for any SCF that is onto and non-dictatorial and has at least three alternatives, there will be at least one situation (profile) where some voter can manipulate.
     - **Why this order?** We must define the SCF (the rule) and the concept of truthful reporting before we can talk about lying. Then we define what it means for a lie to be profitable. We cannot jump to manipulation without these building blocks.

  **3. Demonstration with a Profile (30 minutes)**
     - Present a profile. We need one that clearly shows manipulation. We want a situation where a voter, by misreporting, can change the outcome to one they prefer.

     Let's design a profile:

     We have five voters: V1, V2, V3, V4, V5.

     Consider the following true profile:

     V1: A > B > C
     V2: A > B > C
     V3: B > C > A
     V4: C > A > B
     V5: C > A > B

     Step 1: Count last-place votes.
       - A: last place in V3, V4, V5? 
          - V3: A is last? Yes (B>C>A -> last is A)
          - V4: C>A>B -> last is B
          - V5: last is B
          So: 
            A: V3 -> 1 vote
            B: V4, V5 -> 2 votes
            C: V1, V2 -> 2 votes? 
          Actually, check:
            V1: A>B>C -> last is C
            V2: A>B>C -> last is C
            V3: B>C>A -> last is A
            V4: C>A>B -> last is B
            V5: C>A>B -> last is B

          Therefore:
            A: 1 (V3)
            B: 2 (V4, V5)
            C: 2 (V1, V2)

          Tie between B and C for the most last-place votes (2 each). Now, head-to-head between B and C: 
            Compare B vs C:
              V1: B>C -> for B
              V2: B>C -> for B
              V3: B>C -> for B
              V4: C>A>B -> C>B -> for C
              V5: C>A>B -> C>B -> for C
            So B vs C: 3 (B) vs 2 (C) -> B wins the head-to-head. Therefore, we strike out the one that loses, which is C. 
            So survivors: A and B.

          Now, between A and B:
            V1: A>B -> A
            V2: A>B -> A
            V3: B>A -> B
            V4: A>B? V4: C>A>B -> A>B -> A
            V5: A>B -> A
            So A has 4 votes (V1,V2,V4,V5) and B has 1 (V3). So A wins.

     Now, consider Voter 3 (V3). Their true ranking is B>C>A. So they prefer B over A (and A won). They wish B had won.

     Can V3 manipulate?

     Suppose V3 misreports their ranking. They might try to get B to win. What if they report a ranking that moves A down? 

     Let V3 report: C>B>A (so they put C first? But they don't like C that much, but they really want to avoid A and get B). Alternatively, they might report B>A>C? Not sure. We need to try.

     Alternatively, let's try V3 reporting: B>A>C. 

     New profile (only V3 changes):

     V1: A>B>C
     V2: A>B>C
     V3: B>A>C   [instead of B>C>A]
     V4: C>A>B
     V5: C>A>B

     Now, last-place votes:
       V1: last is C
       V2: last is C
       V3: last is C (because B>A>C -> C is last)
       V4: last is B
       V5: last is B

       Therefore:
          A: 0
          B: 2 (V4, V5)
          C: 3 (V1, V2, V3)

       So C has the most last-place votes -> strike out C. Survivors: A and B.

       Now, between A and B:
          V1: A>B -> A
          V2: A>B -> A
          V3: B>A -> B
          V4: A>B? (C>A>B -> A>B) -> A
          V5: A>B -> A
          So A wins again. No change.

     What if V3 reports instead: B>C>A? That's the truth and we already saw it leads to A. 

     What if V3 reports: C>B>A? 

     New profile:

     V1: A>B>C
     V2: A>B>C
     V3: C>B>A   [lie]
     V4: C>A>B
     V5: C>A>B

     Last-place votes:
       V1: C
       V2: C
       V3: A
       V4: B
       V5: B

       Count:
          A: 1 (V3)
          B: 2 (V4, V5)
          C: 2 (V1, V2)

       Tie between B and C. Head-to-head: B vs C.
          V1: B>C -> B
          V2: B>C -> B
          V3: C>B -> C
          V4: C>A>B -> C>B -> C
          V5: C>A>B -> C>B -> C
          So C wins 3-2. Therefore, we strike out the loser of the head-to-head, which is B? But note: the rule says "strike out the one that loses the head-to-head comparison between them". So between B and C, C beats B, so we strike out B. 
          Survivors: A and C.

          Now, between A and C:
            V1: A>C -> A
            V2: A>C -> A
            V3: C>A -> C
            V4: C>A -> C
            V5: C>A -> C
            So C wins 3-2.

          So the winner is C.

     Now, V3's true preferences are B>C>A. So they prefer C to A? Yes: they have B>C>A, so C is better than A. But in the truthful reporting, they got A (the worst). By lying, they got C, which is better than A. So they are better off.

     However, note that V3's top choice is B, and they didn't get B. But they moved from A (the worst) to C (the middle) which is an improvement. So it is a profitable manipulation.

     But wait: is there a way for V3 to get B? We tried one lie that didn't work (B>A>C) and one that got C. Maybe we can try a different lie? But the point is that we found at least one profitable manipulation.

     However, note that in this manipulation, V3 did not lie about their top choice (they put C first, which is not true). They lied about their entire ranking. But the theorem only requires that there is some misreport that helps.

     Why this profile? 
       - It is not too symmetric and the manipulation is clear: V3 moves from the worst outcome to a better one.
       - The manipulation requires V3 to lie about their entire ranking (putting C first even though they actually prefer B first and C second). This shows that the manipulation can be non-trivial.

     Alternative: We might find a profile where a voter lies about a lower ranking and that changes the outcome. But this example is clear.

     Present the profile step by step on the board.

     Steps:
       a. Write the true profile and compute the winner (A wins).
       b. Write V3's true preference (B>C>A) and note that A is the worst for V3.
       c. Show V3 lying by reporting C>B>A.
       d. Compute the new winner (C wins).
       e. Compare: In truth, V3 got A (worst); by lying, they get C (which is better). Hence, profitable.

     This is the pivot of the session: we have shown a concrete manipulation.

  **4. Theorem Statement and Addressing Misconceptions (20 minutes)**
     - State the Gibbard-Satterthwaite theorem: Any social choice function that is onto, non-dictatorial, and has at least three alternatives in its range is manipulable (i.e., not strategy-proof). 
     - Discuss what strategy-proofness means: It requires that for every voter, and for every possible profile of others' reports, the voter can never get a better outcome by misreporting than by reporting truthfully. We saw one instance of manipulation, but the theorem says that for any non-dictatorial and onto SCF, there will be at least one such instance.
     - Address misconceptions:
       1. "Strategy-proofness means truthful voting is a Nash equilibrium": 
          - This is a misconception. Strategy-proofness (a.k.a. dominant-strategy incentive compatibility) is stronger: it requires that for every voter, regardless of what others do, truthful reporting is optimal. Nash equilibrium would require that given others are truthful, no one wants to deviate. But the theorem is about dominant strategies, not Nash.
          - Why head off? Because the theorem is about dominant strategies. We must clarify that the manipulation we showed is a dominant strategy manipulation: for that voter, in that situation, regardless of what others are doing (we fixed the others' reports) the lie was profitable.

       2. "The theorem says every vote is pointless or every result is rigged":
          - This is a misconception. The theorem does not say that every election is manipulated. It says that for every such rule, there is at least one situation where manipulation is possible. In many situations, no one may have an incentive to manipulate. But the possibility is always there.

       3. "Dictatorship here means a voter with disproportionate power rather than one who always gets their top choice":
          - This is a misconception. In the context of the theorem, a dictator is defined as a voter such that the outcome is always the dictator's top choice. It is a very specific definition. We must clarify that even if a voter is very powerful (e.g., can often get their way), unless they always get their top choice, they are not a dictator by the theorem's definition.

       4. "It is just Arrow's theorem with the words changed":
          - This is a defensible analogy but not exactly the same. Arrow's theorem is about social welfare functions (aggregating preferences into a full ordering) and the independence of irrelevant alternatives. Gibbard-Satterthwaite is about social choice functions (choosing a single winner) and strategic voting. Both are impossibility theorems and use similar ideas (e.g., pivotal voters) but are distinct. It's important to note that they are related but not the same.

       5. "Cardinal or randomised rules are an escape":
          - This is true and is not a misconception. The Gibbard-Satterthwaite theorem applies to deterministic ordinal rules. If we allow cardinal utilities (like in the Vickrey auction) or if we allow randomized rules (like in random dictatorships) then we can have strategy-proof mechanisms. However, note that for randomized rules, we have to define strategy-proofness appropriately (in terms of expected utility). But in this session, we are focusing on deterministic rules and strict preferences. We should note that there are escapes, but they are beyond the scope of this session.

     - What to say about the escapes: "The theorem applies to deterministic voting rules that use only ordinal rankings. If we allow for cardinal utilities or randomized outcomes, there are indeed strategy-proof rules. However, that is a topic for advanced study and not our focus today."

  **5. Conclusion and Test Question (15 minutes)**
     - Summarize: We have a voting rule that is onto and non-dictatorial. We found a profile where a voter can profitably manipulate. The theorem tells us that this is inevitable for any such rule.
     - Why the inevitability? The proof (which we haven't done) uses ideas similar to Arrow's theorem: a pivotal voter argument. We move from a profile where an alternative wins to one where a different one wins by flipping one voter at a time. At the point of flip, that voter can manipulate. But we don't need to do the proof today; we want the intuition that the rule must break somewhere.

     - Test Question (to put at the end): 
          "Suppose we modify the voting rule so that instead of striking out the option with the most last-place votes, we strike out the option with the fewest first-place votes. Would that rule be strategy-proof? Why or why not?"

     - Why this question? 
          It tests whether they understand that changing the rule does not avoid the theorem if the new rule is still onto and non-dictatorial. They should say: 
            - We must check if the modified rule is onto and non-dictatorial. If it is (and it probably is, for similar reasons), then by Gibbard-Satterthwaite, it would be manipulable. Therefore, it is not strategy-proof.

          Alternatively, they might try to construct a manipulation. But the point is to recall the theorem conditions.

     - Alternatively, a more direct question: 
          "In the profile we studied, we saw that Voter 3 could manipulate by reporting C>B>A. Is it possible that in the same profile, another voter could also manipulate? And if so, would that contradict the theorem?"

          Answer: The theorem only says that there exists at least one profile where at least one voter can manipulate. It doesn't say anything about how many voters can manipulate in a given profile. So it's perfectly possible that multiple voters can manipulate in the same profile. That doesn't contradict the theorem.

     But the first question might be better because it forces them to think about the theorem conditions.

  **6. What to avoid (5 minutes at various points)**
     - Do not attempt to prove the theorem. The goal is to see it in action and feel its inevitability.
     - Do not get into cardinal mechanisms or randomized rules beyond a brief mention that they offer escapes but are beyond the scope.
     - Do not discuss the differences with Arrow's theorem in depth, beyond noting that they are different but related.

  **Buffer (5 minutes)**
     - Allow time for questions and to wrap up.

  **Final Note:**
  The session must be interactive. Ask the students to compute the outcomes at each step. Have them suggest misreports for V3. The example profile is key and should be worked through together.
answer: |-
  ### Teaching Plan: Gibbard–Satterthwaite Theorem in 90 Minutes  
  **Objective:** Students grasp the theorem’s inevitability through a concrete voting rule demonstration, avoiding contrivance.  
  **Rule on board (first 5 mins):**  
  > Five voters, three options (A, B, C). Each submits a strict ranking.  
  > **Step 1:** Strike out the option with the most last-place votes. Tie? Eliminate the loser of the head-to-head between tied options.  
  > **Step 2:** The majority’s higher-ranked option of the two survivors wins.  

  **Hypotheses check (immediately):**  
  - **Onto?** Yes. Example: All voters rank A first → A wins. Similarly for B/C.  
  - **Dictatorial?** No. Example: If Voter 1 ranks A first, but others rank B first and A last → B wins (not Voter 1’s top choice).  
  - **Strategy-proof?** We’ll discover!  

  ---

  ### Sequence of Ideas (Total: 85 mins)  
  #### **1. Voting Rule as SCF (15 mins)**  
     - **Why now?** Foundation must be rock-solid.  
     - **Activity:** Students compute winners for 2–3 simple profiles (e.g., unanimous rankings; near-ties). Emphasise the rule is a *social choice function* (SCF): profiles → winner.  
     - **Misconception head-off:** *"Dictatorship ≠ disproportionate power."* Clarify: A dictator *always* gets their top choice, irrespective of others. Give counterexample: A voter with "swing" power (e.g., in a 3-2 split) isn’t a dictator if they sometimes lose.  

  #### **2. Onto Requirement (10 mins)**  
     - **Why now?** Needed to pre-empt "maybe some options can’t win anyway."  
     - **Activity:** Students brainstorm profiles making A/B/C win. Stress: *Every* option must be achievable (linked to later manipulability).  
     - **Key point:** If not onto, manipulation might be "trivial" (e.g., no incentive to manipulate if your favourite can’t win).  

  #### **3. Profitable Misreport (Pivot: 35 mins)**  
     - **Why last?** Students must *feel* the rule’s vulnerability *before* formalising manipulation.  
     - **Setup:**  
       - Define strategy-proofness: *No voter can ever gain by lying, regardless of others’ reports.*  
       - **Misconception head-off:** *"Not Nash equilibrium!"* Strategy-proofness is stronger—truthful voting must be *dominant-strategy* optimal, not just Nash.  
     - **Demonstration profile:**  
       ```  
       V1: A > B > C  
       V2: A > B > C  
       V3: B > C > A  ← Manipulator (true preference)  
       V4: C > A > B  
       V5: C > A > B  
       ```  
       - **True outcome:**  
         - Last-place votes: A:1 (V3), B:2 (V4,V5), C:2 (V1,V2). Tie → B vs C head-to-head: B wins 3–2 (V1–V3 for B). Strike C.  
         - A vs B: A wins 4–1 (V1,V2,V4,V5 prefer A > B).  
       - **Manipulation by V3:** Lies and reports **C > B > A** (instead of true B > C > A).  
         - New last-place: A:1 (V3), B:2 (V4,V5), C:2 (V1,V2). Tie → B vs C: C wins 3–2 (V3–V5 for C). Strike B.  
         - A vs C: C wins 3–2 (V3–V5 for C).  
       - **Why it works:** V3’s true preference is B > C > A. True outcome: A (worst). After lying: C (middle). Profit!  
     - **Why this profile?**  
       - **Natural:** No "conspiratorial" rankings; preferences mirror plausible conflicts (A/B bloc vs C bloc, with V3 pivotal).  
       - **Lying about lower rankings:** V3 *exaggerates* dislike for A (moves it last) and *inflates* C (to first). Shows:  
         - Manipulation isn’t about lying *only* about favourites—it’s about strategic ordering of *all* options.  
         - If V3 lied only about B/C (e.g., reporting B > A > C), outcome remains A (no profit).  

  #### **4. Theorem Statement and Implications (20 mins)**  
     - **Formalise:** "Any onto SCF with ≥3 options that is non-dictatorial is manipulable."  
     - **Misconceptions addressed:**  
       - *"Every vote is pointless?"* No: The theorem says manipulation is *possible*, not inevitable. Many votes are "honest."  
       - *"Arrow’s with words changed?"* Defensible but shallow. Contrast: Arrow is about *rankings* (SWF), G-S about *single winners* (SCF). Both use pivotal voter arguments, but incentives differ.  
       - *"Cardinal/randomised rules escape?"* True—but not a misconception! Acknowledge: "Yes, but we’re restricting to ordinal, deterministic rules today."  
     - **Omissions (deliberate):**  
       - "We’re not proving the full theorem—that requires showing *every possible rule* has a V3-like vulnerability. But our example shows why it’s inevitable: non-dictatorship and onto create pivotal voters who can ‘tip’ outcomes."  
       - "Randomised rules? They *can* be strategy-proof (e.g., random dictatorship), but that’s another story."  

  #### **5. Test Question (5 mins)**  
     - **"Suppose we add a fourth option D, rarely ranked first. Could a voter ever profitably misreport *even if D can’t win*? Why does this highlight the onto requirement?"**  
       - **Expected answer:** If D can’t win, onto fails. A voter who loves D might have no incentive to lie (since D loses anyway), but if their *second-favourite* can be manipulated, onto ensures all options are "in play," forcing vulnerability.  

  ---

  ### Why This Sequence Works  
  - **Flow:** Rule → SCF → onto (why surjectivity matters) → manipulation (pivotal moment) → theorem (abstraction).  
  - **Emotional arc:** Students *see* the manipulation before the theorem—making the result feel "inevitable."  
  - **British English:** "Profitable misreport," "social choice function," "head-to-head," "pivotal voter," "strategic voting."  

  **Final note:** Use the board dynamically. Compute the profile step-by-step with students. If they suggest alternative manipulations (e.g., V3 reporting B > A > C), test it live—this reinforces the rule’s fragility.
