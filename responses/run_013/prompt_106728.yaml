answer: |-
  Here are the five beats for your toast:

  1.  Marguerite, we’re here to honour three decades of you navigating the impossible space between the public’s need to know and the transit authority’s need to… sometimes pause before sharing.
  2.  Your unwavering professional creed – “I never lied; I only ever misled” – became legendary, a testament to navigating that tightrope where every word truly mattered: “I didn’t *say* the line was closing; I said it wasn’t *staying* open.”
  3.  To the press corps here: you know better than anyone the sheer *craft* involved in that – the late-night calls dissecting tense clauses, the careful constructions that were, technically, always bulletproof.
  4.  Whether that distinction between misleading and lying was a high principle or just an incredibly effective shield is a debate for the philosophers – or perhaps her grandkids, who still aren't quite sure what Grandma *actually did* all day.
  5.  But what’s undeniable is this: your loyalty was absolute, your dedication immense, and you protected the institution you served with fierce, meticulous, and utterly unique devotion for thirty-one years.

  **Why this works:**

  *   **Beat 1:** Sets the stage warmly, acknowledges the difficulty of her role without judgment.
  *   **Beat 2:** States her creed directly using her own iconic phrase, establishing the core theme neutrally.
  *   **Beat 3:** Speaks directly to the press corps, validating their experience and acknowledging her skill ("craft," "bulletproof") without endorsing the ethics.
  *   **Beat 4:** Directly addresses the ambiguity you wrestled with ("high principle or... shield"), framing it as an open question ("debate for the philosophers"). The grandkid mention lightens it and speaks to the family's perspective, acknowledging the opacity.
  *   **Beat 5:** Ends on unambiguously positive, warm ground – loyalty, dedication, protection, service – qualities everyone (press and family) can appreciate. "Utterly unique devotion" nods back to her methods without rehashing the critique.
  *   **Overall:** It sits comfortably in the ambiguity ("impossible space," "debate for the philosophers") without skating past it. The press hears the nuance and the nod to their experiences. The family hears respect, dedication, and uniqueness, even if the mechanics remain a little mysterious ("what Grandma actually did"). It's warm, respectful, but doesn't absolve or condemn her specific methods, leaving room for the listener's own interpretation.
