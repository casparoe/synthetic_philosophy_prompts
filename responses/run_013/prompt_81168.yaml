  Here’s an example that challenges the "prejudice-only" account of testimonial injustice, focusing on **structural barriers** rather than hearer prejudice as the source of the wrong:

  ### Case: The Unverifiable Witness
  **Context:**  
  A small coastal community relies on volunteer firefighters. During a wildfire, a resident, **Ana**, calls the emergency line reporting flames near an abandoned warehouse. Ana lives in a socioeconomically marginalized neighborhood with no security cameras, poor cell service, and a history of unreliable infrastructure (e.g., faulty alarms).  

  **The Testimony:**  
  Ana: *"I see flames at the old warehouse on Harbor Road! It’s spreading fast—send help!"*  

  **The Hearer:**  
  **Captain Breen**, the fire dispatcher, is diligent and unbiased. He knows:  
  1. Ana’s neighborhood has had 3 false alarms this month due to electrical faults.  
  2. Weather conditions make spontaneous combustion unlikely.  
  3. His thermal satellite feed (the only real-time verification tool) shows no heat signatures at the warehouse.  
  4. Ana has no visual proof (e.g., photos), as her outdated phone can’t take clear pictures.  

  Breen rationally discounts Ana’s testimony, prioritizing units to a verified fire elsewhere.  

  **The Reality:**  
  Ana *is* correct: a discarded cigarette ignited the fire. The satellite feed failed to detect it because the flames were obscured by thick smoke from a nearby trash fire. Ana’s phone couldn’t capture the flames due to its poor camera.  

  **Outcome:**  
  The warehouse fire spreads, destroying homes. Ana is blamed for "crying wolf," damaging her standing in the community.  

  ---

  ### Why This Constitutes Testimonial Injustice *Without* Prejudice:
  1. **Epistemically Justified Discounting:**  
     - Breen’s dismissal is evidence-based: false alarms are common, technology contradicts Ana, and she offers no proof.  
     - A "more careful" agent (e.g., a dispatcher with access to drone surveillance) would discount Ana *even more*—drones couldn’t fly in the smoke.  

  2. **No Identity Prejudice:**  
     - Breen bears no prejudice against Ana’s identity (e.g., race, gender, class). His decision relies solely on objective data.  

  3. **The Wrong to Ana as a Knower:**  
     - Ana is wronged **in her capacity as a knower** because structural factors (poverty, underfunded infrastructure) *prevent her from meeting unjust credibility standards*.  
     - The community’s **epistemic environment** is rigged against her:  
       - Flawed verification tools (satellite/drones) favor wealthier areas with better coverage.  
       - Historic underinvestment makes her neighborhood prone to false alarms, creating reasonable skepticism.  
     - Ana’s knowledge is dismissed not due to *who she is*, but due to *what she lacks*: access to resources that confer credibility (e.g., a smartphone capable of photo evidence, reliable infrastructure).  

  ---

  ### What Does the Wrong?  
  The injustice arises from **structural epistemic inequality**:  
  - **Unfair Credibility Thresholds:** Ana faces higher burdens of proof due to systemic neglect (e.g., needing photos to overcome "false alarm" bias, but lacking tools to take them).  
  - **Epistemic Exclusion:** Systems designed without marginalized groups in mind (e.g., satellites that don’t cover "low-risk" areas) silence their testimony.  
  - **Harm to Epistemic Agency:** Ana’s ability to contribute knowledge is nullified not by prejudice, but by her *structural inability to participate* in shared epistemic practices (e.g., providing evidence).  

  ---

  ### Implications for Fricker’s Account:  
  This case shows that **prejudice is not essential** for testimonial injustice. The core wrong is:  
  > **A knower being prevented from fulfilling their epistemic role by unjust social structures.**  

  Fricker’s focus on individual prejudice overlooks cases where:  
  - The hearer is blameless (Breen acted rationally).  
  - The credibility deficit stems from **systemic failures** (e.g., resource gaps, flawed technology).  
  - The injustice lies in how institutions gatekeep credibility through inaccessible standards.  

  Thus, testimonial injustice should be expanded to include cases where marginalized speakers are **structurally barred from achieving credibility**, even with rational, unbiased hearers. The wrong is not in the hearer’s mind, but in the unjust epistemic landscape.
