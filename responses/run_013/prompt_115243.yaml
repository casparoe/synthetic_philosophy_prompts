prompt: |-
  For the final of an upper-level course on measurement, incentives and institutional design, I need one 60-minute essay question worth 20 marks, framed around a concrete institutional case (a research-funding formula, say, or a hospital waiting-time target) and not answerable by reciting the standard line about measures that become targets. The question should hand students the four variants of the failure that are usually distinguished — regressional (selection on an imperfect proxy selects for the noise as well), extremal (optimization pushes the system into regions where the old proxy-goal relationship no longer holds), causal (the collapse is produced by the regulator's own intervention) and adversarial (the collapse is produced by an agent with goals of its own) — and then ask them, for each variant, whether either of two proposed remedies would work: measuring the goal itself rather than by proxy, and keeping the metric confidential so that it cannot be gamed. It should close by asking them to assess the thesis that any proxy not perfectly aligned with the goal must fail once it is optimized hard enough, and to say which variant, if any, survives both remedies. Give me the model answer as exactly five numbered points, each a sentence or two and each stating one move a top answer must make, the marks it carries (four each, twenty in total) and the specific error that should cost those marks; between them the five points should cover all four variants and the closing thesis, and there should be no introduction or conclusion.
reasoning: |-
  Okay, the user is designing a final exam question for an advanced course on measurement and incentives. They need a 60-minute essay question centered on a concrete institutional case—like research funding or hospital wait times—that challenges students beyond just repeating the standard critique "when a measure becomes a target, it ceases to be a good measure." 

  The question must explicitly reference the four variants of Goodhart's Law:  
  - **Regressional** (imperfect proxies select for noise)  
  - **Extremal** (optimization pushes systems into dysfunctional extremes)  
  - **Causal** (the measurement intervention itself distorts outcomes)  
  - **Adversarial** (agents actively game the metric)  

  Students must evaluate two remedies for each variant:  
  1. Measuring the goal directly instead of using a proxy  
  2. Keeping the metric confidential to prevent gaming  

  The essay should conclude by assessing whether *any* imperfect proxy inevitably fails under hard optimization and which variant (if any) withstands both remedies.  

  For the model answer, they want exactly five bullet points:  
  - Each states one "move" a top answer must make  
  - Assigns 4 marks per point (20 total)  
  - Notes specific errors that would lose marks  
  - Collectively covers all four variants and the closing thesis  
  - No intros/conclusions—just the core arguments  

  Hmm, the user is clearly an expert—they're using precise terminology like "regressional failure" and framing this at a high level. Their frustration with shallow "standard line" responses suggests they want students to engage deeply with mechanisms. The institutional case requirement implies applied thinking, not just theory.  

  Key challenges in drafting this:  
  1. **Case selection**: Hospital waiting times work well—it's relatable, has clear gaming risks, and allows all four variants to manifest. Research funding could work too but might be more niche.  
  2. **Remedy pitfalls**: Need to ensure students don't oversimplify. Confidentiality fails if agents infer the metric; direct measurement is often impossible (e.g., health outcomes).  
  3. **Thesis nuance**: Must push back on absolutism—some variants (like adversarial) *can* be mitigated by remedies, while others (like causal) are more fundamental.  

  For the 5-point model answer:  
  - Point 1 could tackle regressional failure's remedy limits (direct measurement reduces but doesn't eliminate noise)  
  - Point 2 for extremal: Confidentiality fails when extreme effort distorts outcomes regardless of gaming  
  - Point 3 for causal: Direct measurement doesn't help if the act of measuring *itself* alters behavior (e.g., Hawthorne effect)  
  - Point 4 for adversarial: Confidentiality blocks gaming but only if the metric stays truly secret  
  - Point 5 ties it together: No variant fully escapes both remedies, but causal is the most resilient to them  

  Must emphasize that "direct measurement" is often impractical—this isn't just theoretical. And confidentiality is fragile; leaks or inference undermine it. The closing thesis needs to acknowledge that *some* proxies can be "good enough" if not over-optimized, but all variants risk failure under pressure.  

  Biggest trap for students: Assuming remedies are silver bullets. Top answers must dissect *why* they fail in specific contexts. For example, even with direct measurement, you still get extremal failure if you over-incentivize it.
answer: |-
  Here is the exam question followed by the model answer specification:

  **Exam Question:**  
  *Hospital waiting-time targets are used internationally to incentivize timely care. Using this case, assess whether measuring the actual goal (patient health outcomes) or keeping the metric confidential would prevent each failure variant below. For each variant, explain why the remedy succeeds or fails. Conclude by evaluating the claim that "any proxy not perfectly aligned with the goal must fail under hard optimization," and identify which variant (if any) withstands both remedies.*  

  **Failures:**  
  - **Regressional**: Reducing measured waiting times selects for noise (e.g., prioritizing less complex cases).  
  - **Extremal**: Maximizing throughput pushes systems into unsustainable practices (e.g., discharging patients prematurely).  
  - **Causal**: The target distorts clinician priorities away from holistic care (e.g., neglecting diagnostics during consultations).  
  - **Adversarial**: Administrators manipulate booking systems to "meet" targets (e.g., excluding eligible patients from wait lists).  

  **Model Answer (5 points, 4 marks each):**  

  1. **Regressional Failure & Remedies**  
     *Top answer move:* State that measuring the goal (health outcomes) reduces but doesn’t eliminate noise, while confidentiality fails as selection persists even if the proxy is hidden.  
     *Marks lost if:* Claims confidentiality prevents selection or assumes perfect goal measurement is feasible.  
     *(Covers: Regressional)*  

  2. **Extremal Failure & Remedies**  
     *Top answer move:* Explain that both remedies fail—directly optimizing health outcomes still risks harmful extremes (e.g., denying care to high-risk patients), and confidentiality doesn’t prevent system overload from intense optimization.  
     *Marks lost if:* Argues confidentiality stops gaming here (irrelevant) or that goal measurement avoids distortion at extremes.  
     *(Covers: Extremal)*  

  3. **Causal Failure & Remedies**  
     *Top answer move:* Assert that measuring the goal fails (clinicians still narrow focus to rewarded outcomes), and confidentiality fails (distortion arises from incentives, not gaming).  
     *Marks lost if:* Suggests direct measurement fixes distortion or confuses causal with adversarial failure.  
     *(Covers: Causal)*  

  4. **Adversarial Failure & Remedies**  
     *Top answer move:* Note confidentiality prevents gaming (if truly secret), but measuring the goal fails if health outcomes are manipulable (e.g., coding comorbidities as less severe).  
     *Marks lost if:* Omits that goal measurement remains vulnerable to manipulation or assumes confidentiality is foolproof.  
     *(Covers: Adversarial)*  

  5. **Thesis Assessment & Residual Failure**  
     *Top answer move:* Reject absoluteness (some proxies withstand moderate optimization) but endorse inevitability under "hard enough" pressure; state that causal failure survives both remedies as distortion is inherent to incentive structures.  
     *Marks lost if:* Claims any variant is fully remediable or misidentifies causal as the only irreducible failure.  
     *(Covers: Closing thesis and variant synthesis)*
