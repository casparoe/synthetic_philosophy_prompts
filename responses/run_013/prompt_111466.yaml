  ## OFFICE OF CONSTRUCTIVE ADJUDICATION (OCA)
  ## STANDARD OPERATING PROCEDURE: EXISTENTIAL & DISJUNCTIONAL CLAIMS (SOP-ED-7 Rev. 04)

  **1. Purpose and Scope**
  This procedure establishes the mandatory requirements and processing pathways for claims submitted to the OCA involving existential quantification ("there exists") or disjunction ("either/or"). It applies to all branches unless superseded by specific branch protocols documented in Annex C.

  **2. Witness Requirement (Existential Claims)**
  2.1. Any claim asserting the existence of an object satisfying a specified property (e.g., "There exists an x such that P(x)") must be accompanied by a filed Witness Specification (Form ED-WS-1).
  2.2. The Witness Specification must provide a concrete procedure for producing an object satisfying the property P, or an explicit reference to such an object within previously OCA-adjudicated material. Abstract arguments demonstrating the non-emptiness of a set without identifying a specific element are insufficient.
  2.3. Approval of an existential claim confers entitlement only to the specific witness provided. It does not confer entitlement to any other potential element satisfying P, nor does it guarantee that the witness is unique.
  2.4. Demonstration that a hypothetical file containing witnesses cannot be proven empty (e.g., by classical contradiction) confers no entitlement to any witness and does not constitute grounds for approval of the existential claim. See Section 4.3 regarding non-terminating search protocols.

  **3. Disjunction Resolution Requirement**
  3.1. Claims asserting a disjunction (e.g., "Either A holds or B holds") must be resolved into the specific disjunct established.
  3.2. Applicants must file either:
      *   **Form ED-DA-1 (Direct Affirmation A)**, accompanied by evidence establishing A; or
      *   **Form ED-DB-1 (Direct Affirmation B)**, accompanied by evidence establishing B.
  3.3. Filing a claim asserting "A or B" without resolving the disjunct is procedurally incorrect and will be returned for correction (Code R7: Unresolved Disjunction).
  3.4. The OCA operates under Standing Instruction SI-LEM-1: "The presumption that every disjunctive claim of the form 'A or not A' must be resolvable in favor of one disjunct is prohibited." Caseworkers must not infer the truth of A from the absence of a proof for not-A, or vice versa. Each disjunct requires its own affirmative demonstration.

  **4. Expedited Numerical Search Route (ENS)**
  4.1. Claims asserting the existence of a natural number possessing a decidable property (e.g., "There exists a natural number n such that Q(n)", where Q(n) can be computationally checked for any given n) may utilize the Expedited Numerical Search (ENS) route.
  4.2. Under ENS, the applicant files Form ED-ENS-1 specifying the property Q and a proposed search protocol (e.g., sequential checking starting from 0).
  4.3. The OCA executes the search protocol. Upon finding an n satisfying Q(n), the claim is approved with that n as the witness.
  4.4. If the search protocol fails to terminate within the standard adjudication window (currently 30 working days), the application is rejected (Code R8: Non-Terminating Search). The OCA does not interpret non-termination as evidence for or against the existence of such an n.
  4.5. **Note:** Branch C (Minimal) does not recognize the ENS route. Applications originating from or requesting processing under Branch C protocols must comply with the standard Witness Requirement (Section 2). Branch D (Continuity) may utilize ENS only for properties demonstrably continuous under Branch D assumptions.

  **5. Classical Translation Amnesty Scheme (CTAS)**
  5.1. Applicants seeking to utilize results derived using non-OCA-compliant methods (hereafter "Classical Results") must file under the Classical Translation Amnesty Scheme (CTAS), using Form CTAS-1.
  5.2. CTAS processing involves verifying that the Classical Result, *if interpreted classically*, does not lead to a contradiction within the OCA framework. Successful verification results in a Certificate of Classical Immunity (CCI).
  5.3. A CCI certifies only that the OCA has no grounds to *refute* the Classical Result based on its own constructive procedures. **It is not a warrant affirming the result holds constructively.** The CCI does not provide a constructive witness or resolve associated disjunctions. It grants immunity from direct refutation within OCA proceedings.
  5.4. A CCI does not entitle the holder to bypass standard OCA procedures (e.g., Witness Requirement, Disjunction Resolution) when using the result in further constructive claims.

  **6. Branch Specializations**
  6.1. **Branch C (Minimal):** Assumes only the procedures explicitly documented in OCA SOPs and foundational constructive principles. Makes no additional mathematical assumptions. Handles all claim types.
  6.2. **Branch D (Continuity):** Assumes, in addition to Branch C foundations, that every function submitted for evaluation or arising within an argument is continuous. Claims relying on or alleging discontinuous behavior are returned as ill-formed (Code R9: Discontinuity Assumption Violation). Primarily handles analysis-related claims.

  **7. Axiom of Choice (AC) Protocols**
  7.1. The OCA recognizes distinct formulations of the Axiom of Choice.
  7.2. **Countable Choice (Form CC):** Claims asserting that given a sequence of non-empty sets, there exists a sequence choosing an element from each set, are admissible. Approval requires a procedure generating the choice sequence relative to given procedures witnessing the non-emptiness of each set.
  7.3. **Full Choice (Form FC):** Claims asserting that for *every* set-valued function satisfying certain conditions, a choice function exists, are generally inadmissible (Code R10: Unwitnessed Universal Quantification). Exceptions may apply only under very specific, pre-approved schema documented in Directive AC-EX-1 (e.g., finite choice).
  7.4. The differing treatment of Form CC and Form FC is mandated by foundational protocols (Directive FDN-AC-1) and does not constitute a clerical inconsistency.

  **8. Approval Artifacts**
  8.1. Upon approval of *any* claim (existential, disjunctive, or other), the OCA issues an Approval Artifact to the applicant.
  8.2. The Approval Artifact consists of a concrete, executable procedure (e.g., an algorithm, a construction rule) that realizes the approved claim. For an existential claim, executing the procedure yields the witness. For a resolved disjunction, executing the procedure confirms the affirmed disjunct. For other claims, execution demonstrates the claimed property.
  8.3. Approval is contingent upon the applicant receiving a functional Approval Artifact. The artifact *is* the entitlement conferred by approval.

  ---

  **Commentary on Procedural Representation & Potential Fairness**

  This SOP takes certain interpretive liberties common in expository contexts but potentially contentious among specialists. Firstly, it conflates "constructive mathematics" broadly with "intuitionism," treating them as a single administrative entity. While intuitionism is a major school within constructivism, others (e.g., Bishop-style constructivism, recursive constructive mathematics) share the core procedural constraints (witnesses, rejection of non-constructive LEM) but may differ on philosophical underpinnings or specific admissible principles like continuity. The SOP presents the witness requirement and disjunction resolution as fundamental *procedural* rules of the OCA. While this accurately reflects the *practical consequence* of constructive interpretations of the quantifiers and connectives, the philosophical debate centers on whether this requirement stems from the logic itself (as per intuitionistic semantics) or solely from a specific interpretation (e.g., the BHK interpretation) imposed on classical logic syntax. The SOP leans towards the former view prevalent in intuitionism.

  The Continuity Assumption (Branch D) is presented as an optional administrative add-on. In actual intuitionism (particularly Brouwer's), continuity for *all* functions on spreads is a *theorem* derived from deeper principles like the continuity of choice sequences and the bar theorem, not an independent axiom arbitrarily assumed. Framing it as a branch-specific procedural assumption simplifies the mathematical reality for satirical effect.

  Regarding fairness, the parody risks becoming a strawman if it misrepresents the *motivation* behind constructive practice. Constructivists generally do not view their work as merely discarding sound classical results out of bureaucratic pedantry. Their position is that classical mathematics makes unjustified ontological claims about infinity and truth, and constructive methods provide a more secure foundation aligned with the computational nature of mathematical practice. If constructive mathematics were shown to be fundamentally *motivated* primarily by the desire for executable artifacts *in exactly the bureaucratic manner depicted*, rather than by deeper philosophical or foundational concerns about meaning and truth, the satire would lose its edge. The piece is most likely to misfire for knowledgeable readers at points where the bureaucratic metaphor oversimplifies nuanced mathematical content or collapses distinct schools, notably in the treatment of continuity as a simple branch option and the conflation of intuitionism's deep reasons for continuity with a mere procedural stipulation. The CTAS scheme, while capturing the idea that some classical results are consistent though not constructively proven, might also oversimplify the complex metamathematical relationships involved.
