prompt: |-
  I am presenting next month at a joint session of our logic and computation group and a philosophy of mathematics reading group, with a few quantum-information people attending because the title mentions the physical version of the Church–Turing thesis. I have twenty minutes to speak and twenty for questions, and I want a Q&A prep sheet built for this room rather than for the general reader.

  The paper defends a deflationary reading. My claim is that the thesis is two claims that are almost never prised apart. On the catalogue reading, it says that everything we would call an effectively computable function falls inside the class the familiar formalisms pick out. On the constitutive reading, it says that being effectively computable just is being computable by one of those formalisms. The equivalence proofs among the competing formalisms settle a theorem about formal systems and nothing further; they are equally well explained by the hypothesis that all those formalisms were built to hit the same pre-theoretic target, so they cannot support the catalogue reading without assuming what they were meant to establish. The catalogue reading is a universal generalization over an open-ended class — supportable, never provable, not refutable by any single case — which puts its epistemic status somewhere between a theorem and an empirical law without being either. The constitutive reading is a stipulation, and stipulations are fruitful or sterile rather than true or false. What the thesis actually does, I argue, is license us to stop arguing: to say of a proposed procedure that it is not a computation and have the matter closed. The interesting question is what makes that licence defensible. The physical version is a separate claim, hostage to physics, and I argue that it survives only by idealizing away resource bounds — which is precisely what makes it unfalsifiable.

  This room will not tolerate hand-waving about the intuitive notion. Three computability theorists treat the thesis as a definition and will want to know what is left to dispute. Two philosophers in the later-Wittgenstein vein deny that there is a determinate pre-theoretic notion for the catalogue reading to be about, and will turn my stipulation/claim distinction against me. A constructive mathematician will say that effective already has a precise sense and that my reading of it is the revisionist one. The quantum people will ask whether continuous-state or supertask-style models of computation, or oracles, break the physical claim, and whether my unfalsifiability charge boomerangs onto the catalogue reading. A graduate student will ask whether I am simply a conventionalist about mathematics, and whether that is coherent.

  Prepare the sheet: eight or so objections this audience will actually raise, phrased in their vocabulary, ordered by how much damage each would do; for each, a two-minute reply and a candid note on where the reply is soft; what I should concede at the outset; which objections are really about my framing rather than my thesis; the single reply that has to land for the paper to survive; and the question I am hoping nobody asks. I know the literature — do not give me citations, reading lists, or attributions; argue with me instead.
reasoning: |-
  Okay, the user is preparing for a presentation defending a deflationary view of the Church-Turing thesis (CTT). They'll face a specialized audience with diverse expertise: logic/computation theorists, philosophers of math, and quantum information scholars. Their core argument splits CTT into two readings: "catalogue" (descriptive claim about existing formalisms capturing effective computability) and "constitutive" (stipulative definition). They need a targeted Q&A prep sheet addressing likely objections.

  Breaking down the user's position: First, the catalogue reading frames CTT as an unprovable universal generalization about pre-theoretic notions of computation—vulnerable to new counterexamples but not falsifiable by any single case. Second, the constitutive reading treats it as a definitional move that closes debates by fiat. The equivalence proofs between formalisms (Turing machines, lambda calculus etc.) merely show formal equivalence without validating the catalogue claim. The physical CTT survives only via idealization, making it unfalsifiable.

  Now assessing the audience's likely pushback: The computability theorists will challenge the need for a pre-theoretic notion since they treat CTT as definitional. Wittgensteinians will deny any "pre-theoretic target" exists. Constructivists will argue "effective computability" already has a precise meaning. Quantum folks will probe supertasks/oracles threatening physical CTT. A grad student may accuse the user of conventionalism.

  Key strategic priorities emerge: The user must preemptively concede that equivalence proofs are mathematical triumphs to disarm formalists. The Wittgensteinian objection is actually about framing—their denial of pre-theoretic notions accidentally helps the user's deflationary stance. The "nuclear option" is if someone argues stipulations can't explain CTT's authority, which would force the user to rely on pragmatic justification (fruitfulness over truth). 

  The reply that must land is distinguishing catalogue claims (vulnerable to counterexamples) from stipulations (arbiters of discourse). If this fails, the entire deflationary argument collapses. The nightmare question would be challenging how a stipulation gains communal acceptance without tacit pre-theoretic grounding—this risks circularity the user can't easily escape.

  For the prep sheet, objections should be ordered by damage potential: Start with formalists rejecting the catalogue/constitutive split since that undermines the core thesis. Then address constructivist definitions of effectiveness. Quantum objections about physical CTT are serious but contained to that variant. Wittgensteinian pushback is less damaging as it inadvertently supports deflationism.

  Replies need to be crisp: To formalists, emphasize that equivalence proofs don't validate the catalogue reading—they're consistent with multiple interpretations. To constructivists, grant their precise notion exists but argue CTT historically aimed broader. For quantum challenges, stress that unbounded resources idealization makes physical CTT untestable. Always bring it back to the central point: CTT's function is normative (ending debates) not descriptive.
answer: |-
  Here’s a focused Q&A prep sheet tailored to your audience’s known fault lines, prioritizing damage control and tactical concessions. Objections are ordered by severity (most damaging first), with replies designed for 2-minute clarity.

  ---

  ### **Preemptive Concessions (Open With These)**
  1. **"The equivalence proofs (Turing/Church/etc.) are profound mathematical achievements."**  
     *(Disarms formalists by honoring their work while divorcing it from philosophical claims.)*  
  2. **"The catalogue reading isn’t 'false'—it’s just unsupported by the equivalence proofs and sits in an epistemic limbo."**  
     *(Preempts charges of dismissing CTT entirely.)*

  ---

  ### **Objections & Replies**  
  *(Ordered by damage potential)*  

  1. **Objection (Computability Theorist):**  
     *"If we treat CTT as a definition (constitutive reading), what’s left to dispute? Effectiveness is* defined *by Turing-computability. Your 'catalogue reading' is a non-starter—it presupposes a vague pre-theoretic notion we’ve superseded."*  
     **Damage:** Total — undermines your core distinction.  
     **Reply:**  
     > "The definition didn’t materialize ex nihilo; it was motivated by capturing a prior intuitive idea (e.g., Hilbert’s ‘mechanical procedure’). The dispute is whether that pre-formal idea *must* coincide with the formalism. If your definition is constitutive, it’s a choice—not forced by math. The catalogue reading pretends it’s a discovery."  
     **Soft Spot:** If they deny *any* pre-formal motivation, you lose leverage. Concede that stipulations work *within the field* but can’t explain CTT’s historical/cross-disciplinary authority.  

  2. **Objection (Constructivist):**  
     *"You’re misreading 'effective.' It already means 'provably constructible' in intuitionism—no need for your deflationism. Turing machines formalize* your *classical notion, not mine."*  
     **Damage:** High — challenges your grasp of computability’s roots.  
     **Reply:**  
     > "Agreed—constructivism has its own precise notion of effectiveness. But CTT as commonly invoked (e.g., in physical debates) claims universality beyond formalisms. My target is that *ambition*. Your notion is one constitutive reading; it doesn’t resolve whether classical CTT is descriptive or normative."  
     **Soft Spot:** If pressed, admit your "catalogue" reading assumes a classical outlook. Redirect: "This shows CTT’s authority isn’t neutral—it’s theory-laden."  

  3. **Objection (Quantum Information):**  
     *"You say physical CTT idealizes away resources to be unfalsifiable. But doesn’t your catalogue reading do the same? If we discover a physical hypercomputer, you’ll just say ‘That wasn’t effective computability!’—making it unfalsifiable too."*  
     **Damage:** High — boomerangs your critique onto your view.  
     **Reply:**  
     > "The catalogue reading *is* vulnerable! If we find a physical procedure accepted as intuitively computable but non-Turing, it refutes that reading. But physical CTT dodges this by *defining* computability via Turing machines plus idealization. That’s why it’s stipulative, not empirical."  
     **Soft Spot:** If they cite supertasks/oracles as "intuitive," you must insist our pre-theoretic notion excludes infinities—a debatable move.  

  4. **Objection (Wittgensteinian Philosopher):**  
     *"You talk of a ‘pre-theoretic target,’ but there’s no such thing. ‘Effective computability’ is a family-resemblance concept. Your constitutive/catalogue split presupposes a phantom essence."*  
     **Damage:** Medium — but useful if leveraged.  
     **Reply:**  
     > "I agree! The ‘target’ is an evolving cluster of practices. But then the catalogue reading *fails*—there’s no fixed essence to generalize about. That’s precisely why CTT’s function is normative: it *freezes* the concept to end regress. My view explains its use better than realist readings."  
     **Soft Spot:** They may object that stipulations can’t "freeze" open-textured concepts. Concede: "It’s a local agreement, not metaphysical grounding."  

  5. **Objection (Formalist):**  
     *"Why overcomplicate this? CTT is a successful definition. We don’t debate ‘what is a group?’—we use the definition. Your ‘deflation’ is just philosophy inventing pseudoproblems."*  
     **Damage:** Medium — dismisses your project.  
     **Reply:**  
     > "Because CTT is invoked *outside* formal contexts (e.g., physics, cognitive science) as a discovery about the world. If it’s ‘just a definition,’ those appeals are category errors. I’m clarifying boundaries to prevent misuse."  
     **Soft Spot:** They may retort that external misuses aren’t their problem. Push back: "Then let’s retire CTT from non-formal discourse."  

  6. **Objection (Grad Student: Conventionalism):**  
     *"Isn’t this just conventionalism? And if math is conventional, how do we explain its objectivity?"*  
     **Damage:** Low (distracting but predictable).  
     **Reply:**  
     > "I’m only conventionalist about *what counts as computation*—not math generally. CTT’s constitutive reading is a pragmatic choice to standardize discourse. The objectivity of *consequences* (e.g., ‘This function is uncomputable per our rules’) remains intact."  
     **Soft Spot:** Risk of conflating computability with broader math. Refocus: "This is about *definitions*, not Platonism vs. nominalism."  

  7. **Objection (Quantum/Oracle):**  
     *"Couldn’t an oracle or continuous-state machine break physical CTT *without* idealization? You’ve idealized away the physics that might refute it!"*  
     **Damage:** Contained (only affects physical CTT).  
     **Reply:**  
     > "Oracles are unphysical by definition. Continuous models (e.g., analog neurons) *are* counterexamples *unless* we idealize—e.g., ignore noise. Physical CTT survives by demanding perfection: it’s a *constitutive* claim about idealized ‘computability,’ not real machines."  
     **Soft Spot:** If quantum gravity permits hypercomputation, idealism becomes untenable. Bet on current physics: "No credible model avoids idealization."  

  ---

  ### **Critical Reply That Must Land**  
  **When defending the catalogue/constitutive distinction:**  
  > *"The equivalence proofs show formalisms are co-extensive. They don’t tell us if that extension matches a pre-theoretic idea (catalogue) or if we’ve redefined the idea to fit them (constitutive). Only the latter explains why we dismiss purported counterexamples as ‘not computation.’"*  
  **If this fails**, your framework collapses. Hammer the *function* of CTT: it stops debates, doesn’t describe a fact.

  ---

  ### **Objections About Your Framing**  
  - Wittgensteinians: Their "no pre-theoretic target" objection **helps you** if framed as *supporting* deflation (no essence to describe).  
  - Constructivists: Their view **exposes CTT’s non-neutrality**—use it, don’t fight it.  
  - Quantum: Their pushback **is about physical CTT only**—isolate it from the core thesis.  

  ---

  ### **Nightmare Question (Pray It’s Not Asked)**  
  *"If the constitutive reading is a stipulation, how did it gain universal acceptance? Doesn’t that tacitly appeal to the catalogue reading being *true*—suggesting your distinction collapses?"*  
  **Why it’s deadly:** Forces you to either deny history (implausible) or admit stipulations presuppose successful description.  
  **Reply Strategy:**  
  > "Communities adopt stipulations when they *fruitfully* organize experience—not because they’re ‘true.’ CTT succeeded because it systematized disparate intuitions *without* claiming to discover an essence. Its adoption is pragmatic, not epistemic."  
  **Softness:** Sounds like a concession that the catalogue reading was *approximately* right.  

  ---

  ### **Tactical Summary**  
  - **Surrender early ground** to formalists on equivalence proofs.  
  - **Exploit Wittgensteinians** to attack the catalogue reading.  
  - **Isolate physical CTT** as a weaker, distinct claim.  
  - **Pivot to function:** CTT’s power is in ending debates, not describing reality.  
  - **If cornered, retreat to:** "This is about disentangling claims, not rejecting CTT’s utility."  

  You’re armored. Now go unsettle them.
