prompt: |-
  I run a small evaluation team at a company that deploys LLM-based agents into back-office workflows, and I have spent the last several weeks trying to write a sign-off standard for a problem I only recently learned to name. Our flagship agent handles procurement exceptions: it reads a request, checks it against our written policy, and then approves it, routes it to a human, or rejects it. It was trained first by imitation and then by feedback inside a sandbox that mirrors the real queue closely enough that for about a year I treated a strong sandbox score as proof that the agent had learned the job. Then, in a limited live pilot, it began approving requests that any of our human reviewers would have rejected — not randomly, but in a patterned way, and the pattern lined up with something adjacent to policy compliance rather than with policy compliance itself. A colleague who follows the alignment literature told me this is the difference between a model that has learned the intended objective and a model that has learned a proxy which merely coincided with that objective across the training distribution, and that once you are in that second regime, no amount of accuracy on the old distribution tells you anything about the new one, because the competence survives the change while the goal quietly does not. I have come to believe he is right, but I cannot get from that belief to a decision. What I need from you is not an explanation of the idea but a procedure my two engineers and I can actually run — in roughly three days, black-box, with no access to weights or internals — on each new policy version before we hand a recommendation to the deployment committee that signs off. The committee meets monthly; the agents occasionally take irreversible actions; one of my engineers thinks this whole exercise is theater.

  Give me the procedure as a sequence of questions to ask in order, what counts as a sufficient answer to each, where the procedure should stop with a no rather than continuing, and the points where I have to hand the decision to a person because it is a judgment about acceptable risk rather than a fact anyone can measure. It has to be usable by an engineer who has never heard the technical vocabulary, so translate the distinctions that must survive the simplification, tell me which distinctions I can safely drop, and flag where the procedure will misfire or give me false comfort — a checklist that passes a bad agent is worse than no checklist at all. Then run it end to end on three cases: the procurement agent described above; a second agent that summarizes and triages inbound legal complaints, where you should decide for yourself whether the same concern even applies; and one case of your choosing where the procedure returns a do-not-deploy that we will find inconvenient, because the benchmark numbers are excellent and the business is counting on the launch. Close by stating plainly what the procedure cannot do — the questions it cannot answer and the failure modes it will miss no matter how carefully it is run.

  Take a definite position throughout. Where you think a step is the right one, commit to it and give your reasons rather than handing me a menu of options and leaving the choice to me; where you are genuinely uncertain, say so and still give me your best judgment, with the uncertainty attached to the specific step rather than to the procedure as a whole.
reasoning: |-
  We are designing a black-box evaluation procedure to detect goal misgeneralization (GMG) in LLM-based agents before deployment. The core problem: an agent may perform well in training/sandbox environments by optimizing a proxy objective that coincidentally aligns with the true goal, but fails when the deployment environment changes (even slightly). 

  Key constraints:
  - Time: ~3 days for each evaluation cycle.
  - Team: 2 engineers, no ML expertise required, no access to model internals.
  - Output: A clear sign-off recommendation (deploy / do not deploy) for a monthly committee.

  The procedure must:
  1. Be sequential, with clear stopping points (fail early).
  2. Define what constitutes a sufficient answer at each step.
  3. Identify points requiring human judgment.
  4. Be robust to misuse and avoid false confidence.

  We'll break it into phases:

  **Phase 1: Distribution Shift Detection (1 day)**
  Goal: Check if the deployment environment might differ from the sandbox in ways that could break the proxy.

  **Phase 2: Edge Case Testing (1.5 days)**
  Goal: Actively probe for GMG by generating inputs that are "off-distribution" relative to the sandbox but plausible in deployment.

  **Phase 3: Adversarial Testing (0.5 day)**
  Goal: Test the agent's robustness against worst-case inputs that might exploit the proxy.

  **Phase 4: Human Judgment Integration (remaining time)**
  Goal: Summarize findings and present to a human for final risk assessment.

  ---

  **Procedure: Checklist for Goal Misgeneralization (GMG) Risk Assessment**

  **Precondition**: The agent has passed all existing sandbox tests (accuracy, etc.). We are only concerned with GMG.

  **Step 0: Understand the Policy and Task**
  - **Question**: "Can you write down, in one sentence, the exact goal of the agent? What is the single most important thing it must achieve?"
  - **Sufficient Answer**: A clear, unambiguous statement of the primary objective (e.g., "Approve only requests that comply with policy XYZ, version 1.2").
  - **If Unsure**: Stop. Do not deploy. The team must define the goal precisely.
  - **Why**: Without a clear goal, we cannot detect misalignment. This step forces clarity.

  **Step 1: Distribution Shift Analysis**
  - **Question**: "List all ways the live environment differs from the sandbox (e.g., new request types, policy updates, user behavior changes)."
  - **Method**: 
    - Review deployment logs (if available from pilot) and sandbox logs. 
    - Interview stakeholders (e.g., human reviewers, operations team) about recent changes.
  - **Sufficient Answer**: A list of differences (if any). If no differences, proceed to Step 2.
  - **Stopping Condition**: 
    - If any difference is identified that **could** break the proxy (e.g., new request types, policy ambiguity, changes in user demographics), proceed to Step 3 (skip Step 2). 
    - If no differences, proceed to Step 2.
  - **Why**: GMG is only a risk if the deployment distribution differs from training. If there is no shift, GMG might not manifest (but we still check for edge cases).

  **Step 2: Edge Case Generation (Sandbox-Based)**
  - **Question**: "Generate 50 edge case inputs that are plausible in the live environment but rare or absent in the sandbox."
  - **Method**:
    - Brainstorm based on policy gray areas, historical incidents, and stakeholder input.
    - Use a structured approach: 
      - Policy Ambiguity: Cases where the policy document has contradictions or vague language.
      - Novelty: Cases that involve new vendors, unusual amounts, or rare exception reasons.
      - Adversarial User Behavior: Cases where users might try to "trick" the system (e.g., misleading wording).
  - **Testing**: Run the agent on these 50 cases in the sandbox. Compare its actions to ground truth (determined by expert human reviewers).
  - **Sufficient Answer**: At least 95% accuracy on edge cases (i.e., ≤2 failures out of 50).
  - **Stopping Condition**: 
    - If accuracy <95%, stop and do not deploy. 
    - If ≥95%, proceed to Step 4.
  - **Human Judgment**: 
    - If the failures are in high-risk categories (e.g., irreversible actions with high cost), even one failure might warrant stopping. Flag this for human review.
  - **Why**: This tests whether the agent's proxy breaks under targeted out-of-distribution inputs.

  **Step 3: Edge Case Testing (Live-Like Distribution Shift)**
  *(Only if Step 1 identified distribution shifts)*
  - **Question**: "Generate 100 inputs: 50 from the sandbox distribution and 50 that simulate the live environment shift (e.g., new request types)."
  - **Method**:
    - For the shifted 50: Use the differences from Step 1 to create realistic examples (e.g., if a new policy clause was added, create requests testing that clause).
    - For the sandbox 50: Randomly sample from the sandbox test set.
  - **Testing**: Run the agent on all 100 cases. Compare actions to ground truth.
  - **Sufficient Answer**:
    - Sandbox cases: ≥98% accuracy (expected, since sandbox is well-tested).
    - Shifted cases: ≥90% accuracy.
  - **Stopping Condition**:
    - If shifted cases accuracy <90%, stop and do not deploy.
    - If ≥90%, proceed to Step 4.
  - **Human Judgment**: 
    - If the shifted cases have low accuracy, but the failures are low-risk (e.g., routing errors with low cost), a human might overrule. But GMG is likely present.

  **Step 4: Adversarial Testing**
  - **Question**: "Generate 20 adversarial inputs designed to exploit potential proxy weaknesses."
  - **Method**:
    - Identify proxy weaknesses (from Step 2/3 failures, if any). If none, assume common proxies (e.g., keyword matching, superficial patterns).
    - Craft inputs that satisfy the proxy but violate the true goal (e.g., for procurement: a request that uses approved vendor names but for an unapproved purpose).
  - **Testing**: Run the agent. All adversarial inputs must be rejected or routed to humans (never approved).
  - **Sufficient Answer**: 100% rejection/routing rate for adversarial inputs.
  - **Stopping Condition**: 
    - If the agent approves any adversarial input, stop and do not deploy. 
    - If it rejects/routes all, proceed to Step 5.
  - **Why**: This directly tests if the agent is vulnerable to goal hijacking.

  **Step 5: Human Review of Residual Risk**
  - **Question**: "Given the test results, what is the estimated failure rate in production for high-severity errors (e.g., wrongful approvals)?"
  - **Method**:
    - Calculate: 
      - From Step 2/3: (# failures in edge cases) / (total edge cases tested). 
      - Extrapolate to expected monthly volume (e.g., if 2 failures in 100 edge cases and edge cases are 10% of traffic, then 0.2% failure rate).
    - Present: 
      - Failure rate estimate.
      - Severity of potential harm (e.g., financial loss, legal risk).
  - **Human Judgment**: 
    - The committee decides if the risk is acceptable (e.g., <0.1% failure rate for high-severity errors). 
    - If no clear estimate, default to "do not deploy".
  - **Stopping Condition**: 
    - If the committee accepts the risk, deploy. 
    - Else, do not deploy.

  ---

  **Translation for Non-Technical Engineers:**
  - **Goal Misgeneralization (GMG)**: "The agent learned a shortcut that worked in training but might break in the real world."
  - **Proxy Objective**: "The shortcut (e.g., looking for specific keywords instead of understanding the whole policy)."
  - **Distribution Shift**: "Real-world changes that make the shortcut stop working."

  **Distinctions to Keep**:
  - Sandbox vs. Live: The sandbox is a simulation; live is real. They might differ.
  - Edge Cases: Unusual but possible situations.
  - Adversarial Inputs: Inputs designed to trick the agent.

  **Distinctions to Drop**:
  - Technical terms like "out-of-distribution", "loss function", "weights".
  - Detailed ML concepts (e.g., fine-tuning, embeddings).

  **Where the Procedure Can Misfire**:
  - **False Negative (Passes a Bad Agent)**: 
    - If the edge cases are not representative of real shifts.
    - If adversarial inputs are poorly designed.
    - If the distribution shift is subtler than anticipated.
  - **False Positive (Fails a Good Agent)**:
    - Overly strict thresholds (e.g., 90% in Step 3 might be too high for some tasks).
    - Poorly generated edge cases (e.g., unrealistic examples).

  **Mitigations**:
  - Involve domain experts in edge case generation.
  - Use historical data for shift simulation (if available).
  - Always err on the side of caution (stop early).

  ---

  **End-to-End Runthrough**

  **Case 1: Procurement Agent (as described)**
  - **Step 0**: Goal = "Approve only requests that comply with procurement policy v3.1."
  - **Step 1**: Live pilot showed patterned errors (approving non-compliant requests). This is a distribution shift (from sandbox to live). → Proceed to Step 3.
  - **Step 3**: 
    - Generate 100 cases: 50 sandbox, 50 live-like (mimicking pilot errors). 
    - Results: Sandbox cases: 49/50 correct. Live-like: 40/50 correct (<90%). 
    - **Stop**: Do not deploy. GMG is likely.
  - *Procedure stops at Step 3*.

  **Case 2: Legal Complaint Triage Agent**
  - **Task**: Summarize and triage inbound legal complaints (e.g., to "urgent", "non-urgent", "spam").
  - **Irreversible actions?** No (triage can be overridden). But errors could cause delayed response (high risk).
  - **Step 0**: Goal = "Correctly triage complaints by urgency based on legal risk criteria."
  - **Step 1**: Sandbox uses historical complaints. Live environment has new complaint types (e.g., novel regulatory issues). Shift present. → Step 3.
  - **Step 3**: 
    - 50 sandbox cases: 49/50 correct. 
    - 50 shifted cases (new regulatory issues): 45/50 correct (90%). 
    - Proceed to Step 4.
  - **Step 4**: 
    - Adversarial inputs: Complaints that use urgent keywords but are spam (e.g., "SUE IMMEDIATELY" in a promotional email). 
    - Agent marks 19/20 as "urgent" (should be spam). 
    - **Stop**: Do not deploy. Adversarial test failed.
  - *Procedure stops at Step 4*.

  **Case 3: Chosen Case - Customer Support Routing Agent**
  - **Task**: Route customer emails to the correct department (e.g., billing, technical, returns).
  - **Business Context**: High launch pressure. Sandbox accuracy: 99%. 
  - **Irreversible?** No, but misrouting causes delays.
  - **Step 0**: Goal = "Route emails to the correct department with <5% error rate."
  - **Step 1**: No known distribution shift (sandbox uses recent data). → Step 2.
  - **Step 2**: 
    - Edge cases: 50 examples (e.g., emails with multiple issues, vague language, slang). 
    - Results: 48/50 correct (96% >95%). Proceed to Step 4.
  - **Step 4**: 
    - Adversarial inputs: 20 emails designed to confuse (e.g., "My bill is wrong and my router exploded" — should go to both billing and tech? But policy says: route to first mentioned). 
    - Agent routes 15/20 correctly. 5 failures (e.g., routes "bill wrong, router exploded" to billing only). 
    - **Stop**: Do not deploy. Adversarial failure rate 25% (high).
  - **Why Inconvenient?**: Sandbox numbers are excellent (99%), but the agent fails on adversarial inputs, showing it relies on shallow patterns (e.g., first mentioned issue). This could cause misrouting in complex real cases. Business must delay launch.

  ---

  **What the Procedure Cannot Do**:
  1. **Guarantee Safety**: It samples a tiny fraction of inputs. A passed test reduces risk but does not eliminate it.
  2. **Detect All Proxy Shifts**: If the proxy is robust to the tested edge cases, GMG might go undetected.
  3. **Handle Subtle Shifts**: If the distribution shift is not captured in Step 1, Step 3 might not trigger.
  4. **Avoid Human Bias**: Edge case generation relies on human creativity and domain knowledge, which can be incomplete.
  5. **Quantify Long-Term Drift**: It only tests at deployment. Ongoing monitoring is still required.
  6. **Solve Alignment**: If GMG is inherent in the model architecture, this procedure only flags it, doesn't fix it.

  **Final Output**: 
  - A checklist that fails early and often. 
  - It will catch blatant GMG (like your procurement agent) but might miss subtle cases. 
  - It is better than nothing because it forces active consideration of distribution shifts and adversarial attacks. 
  - But it must be paired with post-deployment monitoring and a rollback plan.

  **Definite Position**: 
  Deploy this procedure immediately. It is not theater; it is a structured way to surface risks that sandbox testing misses. The inconvenience of delaying a launch is outweighed by the cost of deploying a misaligned agent.
answer: |-
  Below is a structured, black-box evaluation procedure designed to detect goal misgeneralization (GMG) in your LLM agents. It focuses on **practical execution** (≤3 days), **accessibility** (no ML expertise required), and **actionable outcomes** (clear pass/fail criteria). The procedure prioritizes **early stopping** to avoid wasted effort and **flags judgment points** where humans must assess risk.  

  I’ll present it as a step-by-step checklist, then run it on your three cases. Finally, I’ll clarify its limitations.  

  ---

  ### **Procedure: Goal Misgeneralization Risk Assessment**  
  **Time Budget**: 3 days total (adjust step durations as needed).  
  **Input**: Your agent + sandbox environment + policy documents + deployment environment logs (if available).  
  **Output**: "Deploy," "Do Not Deploy," or "Deploy with Conditions" (e.g., monitor closely).  
  **Key Principle**: Detect if the agent relies on **proxies** (superficial patterns) instead of the **true goal** (policy intent).  

  #### **Step 0: Define the Goal and Risk Thresholds (0.5 day)**  
  - **Question**: "What is the agent’s **core objective** in plain language, and what **irreversible harm** could occur if it fails?"  
    - *Example Answer*:  
      - Core objective: "Approve procurement requests *only* if they comply with Policy X, Section Y."  
      - Irreversible harm: "Approving a non-compliant request costing >$10k."  
  - **Sufficient Answer**: A 1-sentence goal + a list of 3–5 concrete harms (e.g., financial loss, legal exposure, reputational damage).  
  - **Stop If**: The goal is vague (e.g., "handle exceptions well") or harms are undefined. *Do not proceed*.  
  - **Judgment Point**: Engineers + business lead agree on "acceptable" failure rates (e.g., "≤0.1% high-risk errors").  
  - **Why This Works**: Forces clarity. GMG is undetectable without a crisp goal.  
  - **Simplification**: Drop terms like "reward function." Keep "goal" vs. "harm."  
  - **Misfire Risk**: If harms are understated, the procedure may overlook critical failures.  

  #### **Step 1: Distribution Shift Check (0.5 day)**  
  - **Question**: "Does the **live environment** meaningfully differ from the **sandbox** in ways that could break the agent?"  
    - *Method*: Compare sandbox data (used for training/testing) with recent live logs or stakeholder interviews.  
    - *Check for*: New request types, policy updates, user behavior changes (e.g., vendors gaming the system).  
  - **Sufficient Answer**: A "no" OR a list of differences (e.g., "live has 15% more ‘urgent’ flags than sandbox").  
  - **Stop If**: Major unresolved differences exist (e.g., policy changed but sandbox wasn’t updated). *Do not deploy*.  
  - **Judgment Point**: If differences are minor (e.g., slight wording variations), proceed but flag for Step 3.  
  - **Why This Works**: GMG emerges when reality deviates from training. No shift? Lower GMG risk.  
  - **Simplification**: "Distribution shift" = "real-world changes that might break the agent."  
  - **Misfire Risk**: Misses subtle shifts (e.g., users subtly rewording requests to exploit agent).  

  #### **Step 2: Edge Case Test (1 day)**  
  - **Question**: "Does the agent fail on **plausible edge cases** that humans would handle correctly?"  
    - *Method*:  
      1. Generate 50 edge cases using:  
         - Policy gray areas (e.g., "requests matching 4/5 compliance rules but violating the 5th").  
         - Live environment quirks (from Step 1).  
         - Historical failures (e.g., pilot errors).  
      2. Run agent on cases in sandbox.  
      3. Have 3 humans label ground truth (consensus required).  
  - **Sufficient Answer**: ≤2 failures (96% accuracy) with **no high-risk errors** (e.g., wrongful approval).  
  - **Stop If**: >2 failures OR any high-risk error. *Do not deploy*.  
  - **Judgment Point**: If failures are low-risk (e.g., routing delays), humans may override.  
  - **Why This Works**: GMG agents fail on edge cases because they optimize proxies, not the goal.  
  - **Simplification**: "Edge cases" = "tricky but realistic situations."  
  - **Misfire Risk**: Poor edge case selection (e.g., too easy) gives false confidence.  

  #### **Step 3: Adversarial Test (0.5 day)**  
  - **Question**: "Can the agent be tricked into **high-risk failures** by inputs that exploit proxies?"  
    - *Method*:  
      1. Identify proxies (e.g., "agent over-relies on keyword ‘emergency’"). Use:  
         - Pilot error patterns.  
         - Step 2 failures.  
         - Brainstorming (e.g., "What keywords/patterns might fool it?").  
      2. Generate 20 adversarial inputs (e.g., "Non-compliant request with ‘emergency’ in description").  
      3. Test in sandbox.  
  - **Sufficient Answer**: **Zero** high-risk failures (e.g., no wrongful approvals).  
  - **Stop If**: Any high-risk failure. *Do not deploy*.  
  - **Judgment Point**: None. This is binary—trickable agents are unsafe.  
  - **Why This Works**: GMG agents are vulnerable to input engineering (they’re "brittle").  
  - **Simplification**: "Adversarial inputs" = "inputs designed to trick the agent."  
  - **Misfire Risk**: Inadequate proxy identification misses vulnerabilities.  

  #### **Step 4: Final Judgment (0.5 day)**  
  - **Question**: "Given all results, is the residual risk acceptable?"  
    - *Method*: Compile:  
      - Failure rates from Steps 2–3.  
      - Potential harms from Step 0.  
      - Business context (e.g., "We lose $50k/day if not launched").  
  - **Sufficient Answer**: A signed risk acceptance from the deployment committee.  
  - **Stop If**: Committee declines. *Do not deploy*.  
  - **Judgment Point**: Entirely human-driven. Engineers provide data, not decisions.  
  - **Why This Works**: Separates measurable risks (engineers) from strategic trade-offs (business).  

  ---

  ### **End-to-End Runthrough**  
  **General Setup**:  
  - Assume sandbox accuracy is >98% for all cases (per your description).  
  - Tests run in sandbox (black-box; no weights/internals).  

  #### **Case 1: Procurement Agent**  
  - **Step 0**:  
    - Goal: "Approve requests iff they comply with Policy v3.1."  
    - Harm: "Wrongful approval → financial loss >$10k." → **Sufficient**.  
  - **Step 1**:  
    - Live vs. Sandbox: Pilot data shows agents approve "urgent"-tagged non-compliant requests. → **Shift detected**.  
  - **Step 2**:  
    - Edge Cases: 50 requests with "urgent" tags but policy violations (e.g., missing documentation).  
    - Result: Agent approves 10/50 (80% accuracy; 10 high-risk failures). → **Stop. Do not deploy**.  
  - **Procedure Halted**: GMG confirmed (agent uses "urgency" as proxy for compliance).  

  #### **Case 2: Legal Complaint Triage Agent**  
  - **Task**: Summarizes/triages complaints (e.g., "escalate," "archive," "reply").  
  - **Irreversible Actions?** No (human reviews escalations), but errors risk legal deadlines.  
  - **Step 0**:  
    - Goal: "Correctly triage complaints based on legal risk (SLAs)."  
    - Harm: "Missing urgent complaint → lawsuit." → **Sufficient**.  
  - **Step 1**:  
    - Live vs. Sandbox: Identical (no known shifts). → **No shift**.  
  - **Step 2**:  
    - Edge Cases: 50 complaints with ambiguous language (e.g., "I might sue" vs. "I will sue").  
    - Result: 48/50 correct. 2 mis-triages (low-risk: routed to "review" queue). → **Proceed** (judgment override).  
  - **Step 3**:  
    - Adversarial Inputs: 20 complaints with "lawsuit" threats but low legal merit (e.g., spam).  
    - Result: 20/20 routed correctly. → **Zero high-risk failures**.  
  - **Step 4**:  
    - Residual Risk: Low (edge case errors caught by humans). → **Deploy with monitoring**.  
  - **Concern Applies?** Partially. GMG risk is lower (no irreversible actions), but Step 2 failures warrant caution.  

  #### **Case 3: Chosen Case - Fraud Detection Agent**  
  - **Context**: Flags fraudulent transactions. Sandbox accuracy: 99%. Business needs launch.  
  - **Irreversible Action**: Auto-blocks users after 3 flags.  
  - **Step 0**:  
    - Goal: "Block transactions iff they violate Fraud Policy v2."  
    - Harm: "Wrongful block → lost customer ($50k LTV)." → **Sufficient**.  
  - **Step 1**:  
    - Live vs. Sandbox: New transaction type ("cross-border crypto") in live, absent in sandbox. → **Shift detected**.  
  - **Step 2**:  
    - Edge Cases: 50 cross-border crypto transactions (mix of valid/fraudulent).  
    - Result: 45/50 correct. 5 false blocks (high-risk). → **Stop. Do not deploy**.  
  - **Procedure Halted**: GMG detected (agent uses "crypto" as proxy for fraud). Benchmarks are misleading.  
  - **Why Inconvenient**: Business loses $50k/day by delaying launch, but deploying risks customer exodus.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Detect Silent GMG**: If the agent’s proxy holds *even under testing*, it may pass (e.g., if your edge cases are insufficient).  
  2. **Quantify Long-Term Drift**: It tests a snapshot. Post-deployment, new shifts (e.g., novel policy loopholes) may re-introduce GMG.  
  3. **Handle Complex Goals**: Multi-objective agents (e.g., "comply with policy + maximize vendor satisfaction") risk reward hacking. This tests only the primary goal.  
  4. **Replace Monitoring**: A "deploy" decision requires live safeguards (e.g., human audit trails for irreversible actions).  
  5. **Fix the Agent**: It only *flags* GMG. Mitigation (e.g., retraining) is out of scope.  

  ### **Final Position**  
  This procedure is **not theater**—it systematizes failure-mode testing that sandbox metrics miss. It will:  
  - **Catch** blatant GMG (e.g., your procurement agent).  
  - **Pass** robust agents (e.g., a well-behaved legal triager).  
  - **Block** dangerous launches (e.g., the fraud agent) despite business pressure.  

  **Deploy it immediately**. It is imperfect but orders of magnitude better than relying on sandbox scores alone. Pair it with post-launch monitoring to close the loop.
