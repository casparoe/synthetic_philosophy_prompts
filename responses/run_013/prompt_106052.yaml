prompt: |-
  I host a podcast on the history of philosophy, and next week's guest is a scholar who defends a reading of Montaigne she calls 'situated relativism.' Her thesis is that Montaigne's essay 'Of Cannibals' is not an early manifesto for the equal validity of all moral systems but a discipline of attention: it uses the shock of the cannibal other to expose the provincialism of the observer, while leaving open whether any substantive moral ranking can be justified. Draft eight to ten interview questions that press her on the architecture of this view rather than letting her simply restate it. At least one question should address the distinction between descriptive cultural diversity and normative relativism; at least one should address the way the cannibal functions as a mirror for European self-criticism; at least one should address the epistemic problem that Montaigne's knowledge of the people he discusses is mediated by an informant and by translation; at least one should address whether a situated relativist can criticize a practice she finds abhorrent without covertly reinstating a universal standard; at least one should address how Montaigne's Pyrrhonian suspension of judgment relates to his apparent moral criticism of European cruelty; and at least one should address what her reading implies for a live contemporary controversy, such as the tension between universal human rights and cultural self-determination. In addition, include questions on two ideas I want to introduce into the conversation: first, the 'second-order cannibal' objection -- the worry that a relativism built on the shock of the exotic other turns that other into a resource for the theorist's self-critique, a kind of epistemic consumption; second, the 'translator's remainder' problem -- what is lost when the practices in question are rendered in French categories, and whether a relativist needs an account of untranslatability. For every question, include a follow-up keyed to the answer the guest is most likely to give, and make the follow-ups progressively harder to deflect. End with a single line beginning 'Throughline:' followed by one sentence summarizing the arc of the interview.
reasoning: |-
