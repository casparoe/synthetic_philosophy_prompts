prompt: |-
  I'm in a reading group that's been working through some metaphysics stuff, and there's a move that keeps happening that I don't have a word for. Here's the shape of it. Two of us will be going at it about whether some disputed thing really exists -- we did numbers one week, and another week it was whether a certain social category "really exists" -- and after an hour it turns out we agree on basically every concrete fact you could state. We assent to the same sentences, we agree on what the thing does, on what would be different if you took it away, on which predictions come out true. And then someone says, well, so this is just a disagreement about how to use the word "exist," and everyone nods, and it feels like the argument got dissolved rather than settled. Fine, I get that part.

  But here's the bit I can't label. The person who says "it's just about the word" seems to think that settles it in their favor, as if the thing's not existing follows from the dispute being about words. And the other person isn't just proposing a different vocabulary for the same facts -- they think the first person is using the word wrong, but they can't point to any fact that would show it. So it's not a clean verbal dispute, I don't think, because the agreement on the facts is doing less work than it looks like it's doing, and it's not just two people talking past each other either, because the "it's just verbal" move is itself being contested. There's a weird loop where the diagnosis becomes the next battleground.

  Is there a name for this? I keep hearing "verbal dispute" thrown around but that seems to be the thing you're supposed to be able to resolve by getting clear on the facts, not this messier creature. I have a feeling there are two or three nearby concepts and I'd like to know which is closest, how the thing I'm describing differs from each of them, and whether anyone has a name for exactly this -- or whether I should just coin one, and if so what the definition should be and where the edges are. Like, is this the same as someone quietly changing the subject, or is accusing the other person of changing the subject a different move again? Don't just hand me a term, I want the carving.
reasoning: |-
  Okay, the user is part of a metaphysics reading group and has encountered a recurring pattern in their discussions. They describe a scenario where two people argue about whether something like numbers or a social category "really exists." After a long debate, they realize they agree on all concrete facts—what the thing does, predictions, consequences of its absence, etc. Then someone says the disagreement is just about the word "exist," and everyone nods, dissolving the argument. But here's the twist: the person who calls it a verbal dispute acts like they've won, implying that the thing doesn't exist, while the other person insists it's not just about words and that the first is misusing "exist." The user feels this isn't a clean verbal dispute because the factual agreement doesn't resolve the conflict; instead, the diagnosis becomes the new battleground. They want to know if there's a name for this, how it differs from related concepts, and whether they should coin a term.

  First, I need to unpack the user's scenario. They're dealing with a meta-dispute where the disagreement shifts to whether the original disagreement is merely verbal. The key elements are: agreement on concrete facts, one side claiming victory by labeling it verbal, the other rejecting that label, and the argument looping into a debate about the diagnosis itself. The user is frustrated because "verbal dispute" doesn't fit—it's supposed to be resolvable by clarifying facts, but here the facts are agreed upon, and the conflict persists on a meta-level.

  The user's explicit request is for a term or concept that describes this phenomenon. But deeper, they might be seeking clarity in their philosophical discussions, wanting to navigate these loops more effectively. They could also be looking for validation that this is a recognized issue, not just their group's confusion. Unspoken needs might include tools to break these cycles or understanding why these disputes feel unresolved despite factual agreement.

  Next, I recall relevant philosophical concepts. A verbal dispute is the obvious starting point, but as the user notes, it doesn't fit because both parties agree on non-verbal facts and the dispute continues. Ontological deflationism comes to mind—it's the view that existence claims aren't substantive. But the user's scenario involves one side using deflationism to "win," which isn't inherent to the concept. Meta-ontological minimalism is similar, emphasizing that ontological debates are non-substantive after factual agreement.

  The concept of a metalinguistic negotiation fits well. This is when a disagreement appears to be about facts but is actually about how to use words in a context. For example, arguing whether Pluto is a planet involves criteria for "planet," not new facts. In the user's case, "exist" is the contested term. The loop happens because one side declares the dispute metalinguistic (implying it's trivial), while the other denies that, leading to a meta-dispute about the dispute's nature.

  The user also mentions that the "it's just verbal" move feels like a victory claim. This ties into Carnap's internal/external questions, where labeling a question as external (framework choice) can make it seem non-factual. But Carnap's approach is more about dismissing such questions, not winning an argument.

  I need to distinguish this from other concepts. A verbal dispute is typically resolved by fact clarification, which doesn't happen here. Changing the subject is different; it's not the same as reinterpreting the dispute. Ontological deflationism is a position, not a move in a debate.

  The closest fit is metalinguistic negotiation, especially with the added layer of one side using the "just verbal" label strategically to imply the thing doesn't exist. This creates the loop: if the other side rejects the label, they're now arguing about whether the dispute is metalinguistic, which itself might be metalinguistic. It's a self-escalating cycle.

  The user might benefit from coining a term like "ontological loop" or "metalinguistic escalation" to capture this. But existing terms like "metalinguistic negotiation" cover the core, and the looping aspect is a common consequence. Emphasizing the pragmatic force of the "just verbal" move—how it's used to dismiss the opponent's view—would add clarity. 

  In summary, the answer should affirm that metalinguistic negotiation is the key concept, explain why it fits, differentiate it from related ideas, and address the looping dynamic as a natural extension. The user's insight about the victory claim is spot-on and highlights a rhetorical aspect of these debates.
answer: |-
  This is a brilliant observation of a deep and persistent pattern in ontological/metaphysical debates. You're right that "verbal dispute" alone doesn't capture the full dynamic, especially the **performative victory claim** and the resulting **meta-dispute loop**. Here's the conceptual carving you requested:

  1.  **The Core: Metalinguistic Negotiation**
      *   **Concept:** This is the *primary* framework. A metalinguistic negotiation occurs when a disagreement that *appears* to be about facts (e.g., "Do numbers exist?") is actually about **which linguistic/conceptual framework is most appropriate or useful** for describing facts that both parties largely agree on. The dispute is over the **meaning, application, or standards** for a key term (here, "exist") within a given context.
      *   **Fit:** Exactly matches your description. Both sides agree on the concrete, non-ontological facts ("What does the number 2 do?", "What are the social effects of this category?"). The disagreement is purely about whether applying the label "exists" (or "real") to these agreed-upon phenomena is correct or useful. Each side thinks their way of using "exists" captures the *true meaning* or *most important aspect* of the concept.
      *   **Why "Negotiation"?** It's not just confusion; it's an implicit argument about **how we should talk and think** about the domain in question (mathematics, social reality).

  2.  **The Victory Move: Deflationary/Pragmatic Use of the "Verbal" Diagnosis**
      *   **Concept:** The person who says "It's just about the word 'exist'" is often implicitly adopting an **ontological deflationism** or **meta-ontological minimalism**. Their move isn't *just* identifying a metalinguistic negotiation; it's **leveraging that identification pragmatically to dismiss the opponent's ontological commitment as non-substantive or trivial**. The logic (often unstated) is: "If the *only* disagreement is about the word 'exist', and we agree on all the facts, then *your* insistence on using 'exist' in that strong way is merely a linguistic preference, not a claim about reality. Therefore, the *default* or *minimalist* position (that we shouldn't posit extra 'things') wins."
      *   **Fit:** Explains why the "just verbal" claim feels like a victory declaration. It reframes the opponent's position as a mere proposal about language, while positioning the deflationist as the one sticking to the "real facts." The opponent senses this dismissal and objects not just to the diagnosis, but to its **dismissive implication**.

  3.  **The Loop: Meta-Metalinguistic Dispute**
      *   **Concept:** When the opponent rejects the "just verbal" diagnosis ("No, it's *not* just about the word; you're *wrong* about what existence *means* or what it *requires*"), the dispute **ascends to a meta-level**. Now the disagreement is about **what kind of disagreement the original disagreement was**. Is the original ontological question *itself* a substantive factual question, or is it *only ever* a metalinguistic negotiation? This is a debate about the **status of ontological debates**.
      *   **Fit:** Captures the "weird loop" perfectly. The diagnosis *becomes* the new battleground because the opponent rejects the deflationary *implications* of the diagnosis. They argue that the meaning of "exist" *isn't* merely conventional or pragmatic in the way the deflationist implies; it has deeper conceptual or metaphysical constraints that the deflationist is ignoring.

  **Distinguishing from Nearby Concepts:**

  *   **Pure Verbal Dispute (Ambiguity/Misunderstanding):** This is resolved by clarifying definitions or pointing to non-linguistic facts. *Your case differs:* Definitions *are* the core dispute ("What *should* 'exist' mean here?"), and non-linguistic facts *are* agreed upon. Resolution isn't achieved by clarification; it requires agreement on framework standards or recognizing the metalinguistic nature.
  *   **Changing the Subject:** This involves introducing a *different* topic. *Your case differs:* The "just verbal" move is an *interpretation* of the *same* topic/dispute, not a shift to a new one. Accusing someone of changing the subject is a different rhetorical move aimed at refocusing, not interpreting the nature of the existing disagreement.
  *   **Ontological Deflationism/Minimalism:** This is the *philosophical position* that ontological debates *are* non-substantive metalinguistic negotiations. *Your case involves:* The *pragmatic deployment* of this position *within* a debate as a victory move, contested by someone who rejects deflationism.
  *   **Carnap's "Internal" vs. "External" Questions:** Carnap argued that questions *within* a linguistic framework (internal) are factual, while questions *about* which framework to adopt (external) are pragmatic. Your case resembles a dispute over whether an ontological question (e.g., "Do numbers exist?") is an external question (making it "just verbal/pragmatic") or somehow internal/substantive. The deflationist treats it as external; the opponent might insist it's internal or that the internal/external distinction doesn't apply cleanly here.

  **What to Call It: Existing Labels vs. Coining**

  *   **Best Existing Label:** **Contested Metalinguistic Negotiation** (emphasizing the core mechanism *and* the dispute over the diagnosis) or **Deflationary Victory Loop** (emphasizing the specific move and the resulting cycle).
  *   **Case for Coining:** While "metalinguistic negotiation" is established (see philosophers like David Plunkett, Tim Sundell, Alexis Burgess), the specific dynamic of the **dismissive deployment** of this diagnosis triggering a **meta-dispute** is nuanced enough to warrant a specific term, especially for pragmatic/philosophical discussion.
  *   **Proposed Coinage & Definition:**
      *   **Term:** **Ontological Deflationary Gambit & Recoil**
      *   **Definition:** A dialectical pattern in ontological disputes where:
          1.  Agreement is reached on relevant non-ontological facts.
          2.  One party (Deflationist) diagnoses the remaining disagreement over existence as *merely* metalinguistic (a dispute about the word "exist") and treats this diagnosis as resolving the dispute in favor of a minimalist or non-committal ontology.
          3.  The other party (Robust Realist) rejects this diagnosis, arguing that the deflationist misunderstands the substantive meaning or requirements of "existence," thereby contesting the deflationary interpretation itself.
          4.  The dispute consequently escalates to a meta-level concerning the nature of the original ontological disagreement (whether it *was* merely metalinguistic or substantive).
      *   **Edges:**
          *   *Requires:* Prior agreement on non-ontological facts; an ontological term ("exist," "real") as the explicit focus.
          *   *Trigger:* Explicit or strongly implied claim that the dispute is "just verbal" *and* that this entails the deflationist/minimalist position wins.
          *   *Distinct from:* Simple confusion over definitions (resolved by clarification), changing the subject, or debates where factual disagreement persists under the ontology dispute.

  **In Summary:**

  You've identified the core mechanism (**Metalinguistic Negotiation**), the specific rhetorical move that triggers the loop (**Deflationary Victory Claim** via the "just verbal" diagnosis), and the resulting escalation (**Meta-Metalinguistic Dispute**). While "metalinguistic negotiation" is the most precise established term for the underlying phenomenon, the full dynamic you describe – with the victory claim and recoil – is a distinctive and common pattern that deserves explicit recognition. Coining a term like **Ontological Deflationary Gambit & Recoil** accurately captures this specific dialectical tango. Recognizing this pattern helps see why these debates feel both deep (touching on meaning and conceptual frameworks) and frustratingly unresolvable (as they can endlessly ascend meta-levels). The way out often requires explicit agreement on *why* we care about ontology or what standards we use for "existence" in a given domain, moving beyond the unproductive loop.
