  Here's a joke crafted for the seminar:

  Bertrand, meticulously applying his constant discount rate to a future climate catastrophe three centuries away, dismissed its present cost as negligible. "But Bertrand," challenged his colleague, "why is discounting purely because it's *later* fundamentally different from discounting harms that happen only on Tuesdays, or only to people whose names start with 'Q'? It seems just as arbitrary." Bertrand paused, then countered brightly, "Ah, but my discount rate *compounds*! It systematically makes anything sufficiently distant effectively vanish!" His colleague pressed, "So, applying that same compounding logic, your own suffering in old age should be worth almost nothing to you *now*, right?" Bertrand stared blankly for a moment before muttering, "I... hadn't considered applying it *intrapersonally*. Suddenly, Tuesday seems less problematic."

  **Why it works for the audience:**

  1.  **Core Critique:** It directly targets the *structure* of pure time preference (compounding effect, ethical arbitrariness).
  2.  **Specific Comparisons:** Uses the requested "weekday" and "someone else" analogies to highlight the arbitrariness.
  3.  **Intrapersonal Tension:** The punchline hinges on the uncomfortable, rarely defended implication that the same logic drastically devalues one's *own* future well-being.
  4.  **Economist Nuance:** Bertrand isn't *evil*, just unthinkingly applying a tool; the humor comes from exposing the tool's internal contradiction when applied consistently.
  5.  **No Stereotypes:** Avoids "cold economist" tropes; the focus is purely on the discounting logic itself.
  6.  **Seminar-Ready:** Concise, prose format, relies on understanding the mechanics and ethical debates of discounting.
