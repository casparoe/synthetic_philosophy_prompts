prompt: |-
  ok so in civics we spent like a week on "what makes a society fair" and the teacher kept saying there's no one right answer, but I actually want to know what a good answer would even look like before I pick a side. The two things we did were the Nozick Wilt Chamberlain thing (somebody gets paid to play basketball, and suddenly the money's all lopsided even though everyone agreed to it) and Rawls and the difference principle (inequality is only ok if it helps the worst off). I can't tell which one to believe and I think its because I don't know what a theory of "who should get what" is even supposed to do.

  So can you write me the checklist? Like, for any theory of distributive justice to count as actually good, what does it have to get right — the cases it can't fumble, the puzzles it has to at least say something about instead of dodging, the distinctions it can't just mush together (I keep seeing people slide between "he deserves it" and "he's allowed to keep it" and those seem like different claims?), the stuff about how markets and incentives and taxes actually work that it can't contradict. For each one, give me the case or example that makes it a requirement, so I can see why it's on the list and not just someone's opinion.

  Then two things I really want: which requirements are non-negotiable and which are just stuff one camp cares about, and whether any two of them can't both be satisfied at once. Our teacher said something like "you can have liberty or you can have a pattern but not both" and moved on before I could ask, so if that's a real thing please explain it in the list.

  Oh and here's a case I keep thinking about that I've never seen in any of the readings, and I want a theory that can handle it: a girl at my school made up a dance, posted it, it went viral, and now she's making money off merch and brand deals. As far as I can tell nobody got hurt and nobody was worse off, she just started from nothing special and now she's rich. Does that count as a problem for a theory of fairness or not, and which of the requirements decide it?

  You don't have to rank the theories for me, I'll do that part on my own, I just want the spec first. A list is fine, or a table, whatever's easier.
reasoning: |-
  Okay, the user is a student who just finished a civics unit on distributive justice, focusing on Nozick and Rawls. They're confused about how to evaluate different theories because the teacher said there's no right answer. They want a checklist of what makes a theory good—like essential features, common pitfalls, real-world examples—so they can analyze theories themselves. 

  First, I need to unpack their request. They’re not asking for "the answer" but for a framework to judge theories. That’s smart—they want tools, not conclusions. The Chamberlain example and Rawls’ difference principle confused them because the theories clash, and they don’t know what baseline to use. Their hidden need might be clarity on meta-criteria: how do philosophers even debate this stuff?  

  Their dance example is key. It’s a modern spin on Chamberlain—someone creates value ex nihilo (a viral dance) and gets rich without obvious exploitation. They want to know if this "breaks" a theory. This suggests they crave applied reasoning, not just abstraction. Also, they’re annoyed by vague teacher-talk like "liberty vs. pattern," so I should demystify that.  

  For the checklist, I’ll structure it around:  
  1. **Core functions** (what must any theory DO?)  
  2. **Fatal flaws** (what makes a theory incoherent or useless?)  
  3. **Common pitfalls** (where do theories often crumble?)  
  4. **Real-world viability** (can it handle taxes, markets, etc.?)  
  5. **Tensions** (liberty vs. equality, desert vs. entitlement, etc.)  

  The dance case tests several points: entitlement (did she earn it?), baseline (was anyone harmed?), and pattern maintenance (does her wealth "break" equality?). I’ll map it to the checklist so they see how to apply it.  

  The liberty/pattern trade-off comes from Nozick: if you enforce a "pattern" (e.g., "everyone must have equal wealth"), you must constantly redistribute, violating liberty (e.g., taxing Chamberlain’s fans). I’ll explain that as a tension, not a universal law—Rawlsians would argue his "pattern" (inequality only if it helps the worst-off) *preserves* liberty for the poor.  

  Non-negotiables: Theories must define "who gets what" clearly and avoid contradictions (e.g., "everyone deserves what they earn" but "inheritance is fair" is inconsistent). Negotiable stuff includes whether equality/liberty matters more.  

  Finally, I won’t rank theories but show how the dance case highlights different priorities: Nozick would cheer ("free exchange!"); Rawls might ask, "Could the worst-off benefit more if taxed?" That’s their homework—applying the checklist.  

  ...Time to draft a clear, example-driven list. They’ll probably skim, so bold headers and punchy cases are a must.
answer: |-
  Here's a distilled "spec sheet" for evaluating theories of distributive justice ("who gets what"). Think of these as the core functions and stress tests any credible theory must handle. I'll break it down with concrete examples, flag non-negotiables vs. negotiables, highlight key tensions, and tackle your dance case at the end.

  ---

  ### **The Distributive Justice Checklist: What a Good Theory Must Handle**

  | # | Requirement                          | Why It's Needed (Test Case/Example)                                                                 | Non-Negotiable? | Related Tension             |
  |---|--------------------------------------|-----------------------------------------------------------------------------------------------------|-----------------|-----------------------------|
  | **1** | **Define the Currency of Justice** | *Case: Is "fairness" about money? Opportunities? Happiness? Power?*<br>Example: Two people have equal wealth, but one has chronic pain. Are they equally well-off? A theory must specify what it's distributing (e.g., resources, welfare, capabilities). | **Yes** | — |
  | **2** | **Specify the Initial Baseline** | *Case: The "Starting Gate" problem.*<br>Example: If everyone gets equal money today, is that fair if some inherited debts and others inherited genius IQs? A theory must justify its starting point (e.g., equality, historical entitlements, "state of nature"). | **Yes** | Liberty vs. Pattern ⚠️ |
  | **3** | **Clarify Desert vs. Entitlement** | *Case: The Lottery Winner vs. The Brain Surgeon.*<br>Example: Does someone *deserve* wealth from luck (lottery) the same way they *deserve* wealth from effort/skill (surgery)? A theory must distinguish moral desert ("earned") from legal entitlement ("allowed to keep"). Dodging this is fatal. | **Yes** | — |
  | **4** | **Handle Voluntariness & Consent** | *Case: Wilt Chamberlain.*<br>Example: If fans *voluntarily* pay to see Wilt, creating inequality from equality, is that fair? The theory must explain when consent legitimizes outcomes vs. when it doesn't (e.g., due to coercion, ignorance, or systemic bias). | **Yes** | Liberty vs. Pattern ⚠️ |
  | **5** | **Address Incentives & Efficiency** | *Case: The Doctor Who Retires Early.*<br>Example: If high taxes on top earners mean fewer doctors work long hours, worsening healthcare for the poor, is equality worth it? The theory must engage with human behavior and resource creation, not just distribution. | **Yes** | — |
  | **6** | **Resolve Claims of Need** | *Case: The Disabled Child.*<br>Example: Should a child with severe disabilities get more resources than an able-bodied child to achieve a "fair" life? A theory can't ignore basic needs or vulnerability. | **Yes** | Equality vs. Sufficiency |
  | **7** | **Account for Historical Injustice** | *Case: Stolen Land.*<br>Example: If your ancestors stole land from mine, is it fair for you to keep it even if you "earned" it through hard work? Theories must address whether past wrongs nullify current entitlements. | **Negotiable** | History vs. End-State |
  | **8** | **Explain the Role of Luck** | *Case: Born Genius vs. Born Disabled.*<br>Example: Is it fair that one person is born with talents making them rich, while another needs expensive care just to survive? A theory must take a stance on mitigating/accepting brute luck. | **Negotiable** | Desert vs. Equality |
  | **9** | **Maintain Stability Without Tyranny** | *Case: The Enforcer Problem.*<br>Example: If your theory requires constant redistribution to maintain "fairness," how is this enforced without violating rights or creating a police state? | **Yes** | Liberty vs. Pattern ⚠️ |

  ---

  ### **Key Tensions (Where Theories Often Break)**
  1. **⚠️ Liberty vs. Pattern (Nozick's Point):**  
     - *The Conflict:* If you enforce a distributive "pattern" (e.g., equal wealth, Rawls' difference principle), you must constantly interfere with voluntary exchanges (like paying Wilt). This violates liberty.  
     - *Example:* Taxing your dancer's merch profits to maintain equality breaks the liberty of her fans to support her freely.  
     - *Non-negotiable?* Theories must address this tension—they can't pretend it doesn't exist.  

  2. **Desert vs. Entitlement:**  
     - *The Conflict:* "She *deserves* her wealth because she created the dance" (desert) vs. "She’s *entitled* to it because no one forced people to buy merch" (entitlement). These can diverge (e.g., someone inheriting wealth is entitled but may not deserve it).  
     - *Non-negotiable?* A theory must clarify which concept it prioritizes and why.  

  3. **Efficiency vs. Equality:**  
     - *The Conflict:* Heavy redistribution might reduce overall wealth (e.g., if high taxes discourage innovation), leaving even the poor worse off.  
     - *Non-negotiable?* A theory must explain its trade-off—ignoring incentives is unrealistic.  

  ---

  ### **Your Dance Case: How the Checklist Applies**
  - **Voluntariness:** Fans *chose* to pay her; no coercion → *Supports Nozick*.  
  - **Desert vs. Entitlement:** Did she "deserve" viral fame? Luck played a role. But she's clearly *entitled* to profits if no fraud occurred.  
  - **Baseline:** Was anyone harmed? If not, her gain isn't someone else's loss → *Not inherently unfair*.  
  - **Efficiency:** Allowing her to profit incentivizes creativity → benefits society.  
  - **Pattern:** If her wealth creates inequality, does it help the worst-off? (Rawls). Unless she pays taxes funding schools, Rawls *might* see a problem.  

  **Verdict:** For Nozick, this is justice. For Rawls, it’s only fair if her taxes/charity improve lives of the least advantaged. Your checklist shows why theories split here: they prioritize different requirements (liberty vs. pattern, entitlement vs. need).

  ---

  ### **Final Notes**
  - **Non-negotiables (Any theory must):** Handle #1-6 and #9 clearly. If it dodges baseline definitions, consent, or stability, it’s incoherent.  
  - **Negotiables:** #7 (history) and #8 (luck) are where theories differ—e.g., Rawls cares about luck; Nozick doesn’t.  
  - **Can all requirements be met?** No—that’s why philosophies clash. Liberty/pattern is the sharpest trade-off.  

  Use this to dissect theories: *Where does Rawls fumble voluntariness? How does Nozick ignore need?* Your dancer case is perfect for testing—it’s a modern Chamberlain. Now go build your own ranked list!
