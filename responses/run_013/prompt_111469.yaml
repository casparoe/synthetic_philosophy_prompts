answer: |-
  ### Polished Question
  "Three urns each contain 100 balls, which are either red or black.  
  - **Urn A**: Contains exactly 50 red and 50 black balls.  
  - **Urn B**: Has a fixed but unknown composition (any ratio of red to black).  
  - **Urn C**: A fair coin was tossed to determine its composition: heads → 40 red/60 black; tails → 60 red/40 black. The outcome is unknown to you.  

  A single ball is drawn randomly and independently from each urn. You may bet on "red" or "black"; a correct bet wins $100, an incorrect bet wins $0.  

  A subject reports the following strict preferences:  
  (i) Betting on *red in A* ≻ betting on *red in B*  
  (ii) Betting on *black in A* ≻ betting on *black in B*  
  (iii) Indifference between betting on *red in A* and *red in C*  
  (iv) Betting on *red in C* ≻ betting on *red in B*  

  (a) What do (i) and (ii) imply about the existence of precise subjective probabilities for her? Do they violate the Sure-Thing Principle? Contrast this with the classic two-urn Ellsberg paradox and explain why that version *does* violate the principle.  
  (b) What does (iii) reveal about her adherence to the Reduction of Compound Lotteries (ROCL) axiom? Using the contrast between (iii) and (iv), analyze whether her aversion to Urn B stems from aversion to second-order uncertainty *as such* or to a more specific feature.  
  (c) Can her preferences be captured by:  
  (1) Subjective Expected Utility (SEU)?  
  (2) Maxmin Expected Utility (MEU)?  
  (3) A smooth-ambiguity model with a *symmetric* second-order prior and *concave* second-order utility?  
  Justify each answer.  
  (d) Propose a new scenario (e.g., a modified urn or choice framing) to empirically distinguish the *comparative-ignorance hypothesis* (ambiguity aversion only emerges in direct comparison with unambiguous options) from explanations based on second-order beliefs. State what each theory predicts."  

  ---

  ### Model Answer (820 words)  
  **(a) Subjective Probabilities and the Sure-Thing Principle**  
  Preferences (i) and (ii) show that the subject strictly prefers bets on either color in Urn A over Urn B. This implies she cannot assign precise subjective probabilities to Urn B: if she assigned probability *p* to red in B, she would be indifferent between betting on red in A (prob = 0.5) and red in B only if *p* = 0.5. Her strict aversion to B for both colors reveals that she treats B as having indeterminate probabilities.  

  These preferences do *not* violate the Sure-Thing Principle (STP). STP requires that if two acts yield identical outcomes given an event *E*, preferences depend only on outcomes when *E* does not occur. Here, bets on red/black in B are not complementary acts across partitioned events: choosing "red in B" does not logically fix the outcome of "black in B" because the urn composition is unknown. Thus, no single decision matrix forces a contradiction.  

  By contrast, the **classic two-urn Ellsberg paradox** violates STP:  
  - Urn 1: 50 red/50 black (known).  
  - Urn 2: 100 balls, unknown red/black ratio.  
  Subjects prefer betting on red from Urn 1 over red from Urn 2, *and* on black from Urn 1 over black from Urn 2. Here, "bet on red" and "bet on black" are complementary acts for Urn 1 (probabilities sum to 1), but not for Urn 2 (probabilities unknown). When acts are framed as states (e.g., "red occurs" vs. "black occurs"), STP is violated because preferring Urn 1 for both bets implies incoherent subjective probabilities.  

  **(b) ROCL and the Nature of Ambiguity Aversion**  
  (iii) shows indifference between betting on red in A and red in C. Urn C reduces to a compound lottery: a 50% chance of a 40%-red gamble and 50% chance of a 60%-red gamble. ROCL requires indifference between this compound lottery and its simple equivalent (50% red). Her indifference implies she **satisfies ROCL** for Urn C.  

  The contrast between (iii) and (iv) reveals that her aversion to B stems **not from second-order uncertainty as such**, but from **epistemic uncertainty about the data-generating process**. Urn C has second-order uncertainty (the coin toss), but she knows the exact set of possible compositions (40/60 or 60/40) and their probabilities (50% each). Urn B lacks this: its composition could be *any* ratio (0-100 red), with no prior over possibilities. She is averse to the absence of a well-defined second-order prior ("unknown unknowns"), not to quantifiable second-order risk.  

  **(c) Model Compatibility**  
  **(1) Subjective Expected Utility (SEU):** **No**. SEU requires unique subjective probabilities. She would assign *P*(red) = *q* to Urn B. But (i) implies 0.5 > *q* (for red), (ii) implies 0.5 > 1-*q* (for black), forcing *q* < 0.5 and 1-*q* < 0.5, a contradiction.  

  **(2) Maxmin Expected Utility (MEU):** **Yes**. MEU evaluates acts by the worst-case scenario in a set of priors. For Urn B, she might use the set *C* = {*P*(red) ∈ [0,1]} and maximize the minimum EU. The min EU for betting on red in B is 0 (if *P*(red)=0), worse than Urn A (min EU = 50). For Urn C, the min EU is 40 (if 40-red state occurs), but MEU with priors {40%, 60%} gives min EU = 40. Her indifference between A and C (both min EU > 0) and aversion to B (min EU = 0) fits MEU.  

  **(3) Smooth Ambiguity (with symmetric prior & concave φ):** **No**. This model computes EU as *∫ φ(EU|θ) dμ(θ)*, with μ symmetric over Urn C’s states (μ(heads)=μ(tails)=0.5) and φ concave. For Urn C, φ-concavity would make her *averse* to the second-order risk, implying she prefers Urn A (certain 50% prob) over Urn C (risky 40% or 60%). But (iii) shows indifference, violating this prediction. Symmetry alone cannot explain indifference if φ is concave.  

  **(d) Discriminating Comparative Ignorance vs. Belief-Based Aversion**  
  **Proposed test**: Have the subject evaluate Urn B *in isolation* (no comparison to A or C) against a new **Urn D**: a coin toss determines if it contains 30 red/70 black or 70 red/30 black. She chooses between betting on red in B vs. red in D.  

  - **Comparative-Ignorance Hypothesis** (Fox & Tversky): Ambiguity aversion arises only when ambiguous options are compared to unambiguous ones. In isolation, no aversion should manifest. Thus, she is **indifferent** between red in B and red in D (both ambiguous).  
  - **Belief-Based Explanation** (e.g., MEU or smooth ambiguity): Aversion stems from beliefs about B’s indeterminacy. Urn D has bounded risk (30-70% red), while B has extreme uncertainty (0-100% red). She **strictly prefers Urn D** over B for red bets, as min EU or expected φ(EU) is higher for D.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **A (18–20):**  
  - (a) Correctly identifies that (i)–(ii) rule out precise subjective probabilities *without* violating STP; contrasts with two-urn Ellsberg’s STP violation using event-complementarity.  
  - (b) Notes ROCL adherence via (iii); uses (iii)–(iv) contrast to distinguish quantifiable second-order risk (C) from unquantifiable uncertainty (B).  
  - (c) Correctly rejects SEU (contradiction), accepts MEU (min EU explanation), rejects smooth ambiguity (φ-concavity predicts aversion to C).  
  - (d) Designs a test isolating B from unambiguous comparisons; predicts indifference (comparative ignorance) vs. strict preference for D (belief-based).  

  **B (16–17):**  
  - Minor gaps: e.g., incomplete STP contrast; vague ROCL analysis; correct model answers but weak justifications; test case lacks clarity on predictions.  

  **Deductions (apply cumulatively):**  
  - **-3** Claims (i)–(ii) violate STP or misrepresents two-urn Ellsberg.  
  - **-2** Fails to note ROCL compliance in (iii) or misattributes B’s aversion.  
  - **-2 per model** Incorrect evaluation or justification in (c).  
  - **-3** Test case in (d) does not separate theories or lacks predictions.  
  - **-1–2** Ambiguity, poor structure, or exceeding word limit.  

  --- 
  This question tests deep understanding of ambiguity models, avoiding rote Ellsberg explanations. The answer requires synthesizing STP, ROCL, and model distinctions, while designing a novel experimental discriminator—key for advanced decision theory.
