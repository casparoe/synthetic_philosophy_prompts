prompt: |-
  So here's the thing I keep fighting about with my friend. The separateness of persons objection to utilitarianism -- the Rawls/Nozick line that classical utilitarianism treats a society like one giant person, summing benefits and burdens across different people the same way a single person trades off their own good and bad across time -- she treats it as a knockdown, I think it's at best an objection to the crudest version. What's your actual credence that the objection succeeds, meaning it identifies a real defect that no plausible version of consequentialism can repair? Give me the number and the decomposition, roughly along these lines: (a) how much the objection needs a real metaphysical separateness between persons rather than just a moral stipulation about whose good counts; (b) the parity worry -- if separateness blocks adding up across persons, and personal identity is itself a matter of degree (Parfit-ish), does the same logic block adding up across the stages of a single life, and if so is that a reductio of the objection or a bullet we should just bite; (c) whether the objection really only sinks total utilitarianism and leaves a distribution-sensitive or ex-ante version standing; (d) the veil-of-ignorance point, that if you might be born as any of the affected people, maximizing the sum starts to look like ordinary prudence; (e) whether "separateness" can be made precise enough that the objection is even true or false in the first place. A number and one line of justification for each, then how they combine, then which term your final number is most sensitive to and what arguement or evidence would move it the most. My number is around 0.35 and hers is around 0.85, so also tell me where the disagreement actually lives. Answer in American English.
