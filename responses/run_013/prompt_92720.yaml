answer: |-
  ### Research Proposal: The Fractured Franchise — Testing the Coherence of Democratic Inclusion Principles Through Three Reform Probes

  **1. Introduction and Core Problem**
  The democratic franchise remains conceptually contested. While specific reforms are debated vigorously, the underlying principles justifying *who* should vote and *whether* voting should be obligatory are often treated in isolation, obscuring potential tensions between them. This project investigates three live reform proposals—extending the vote to resident non-citizens (RNC), lowering the voting age (LVA), and implementing compulsory voting (CV)—not merely as discrete policy questions, but as interlinked probes into the fundamental nature of the franchise itself. The central hypothesis is that these reforms expose irreconcilable tensions between the dominant justificatory principles for the franchise: the "stakeholder" principle (voting as a right of those significantly affected by decisions), the "subjection" principle (voting as a right of those bound by the law), and the "civic duty" principle (voting as an obligation inherent in a public office held on behalf of the collective). Existing literature largely treats the boundary question (RNC, LVA) separately from the compulsion question (CV), failing to interrogate whether the principles invoked to resolve one can coherently extend to the other.

  **2. Research Question**
  Can a single, coherent principle of democratic inclusion—specifically, the 'stakeholder', 'subjection', or 'civic duty' principle—consistently justify both the *allocation* of the franchise (determining who counts as a voter, particularly regarding RNC and LVA) and the *character* of the franchise (determining whether voting is a right or a duty, particularly regarding CV)? Or do these three reform proposals inherently rely on distinct and potentially incompatible foundational accounts of what the vote *is*?

  **3. Significance and Gap**
  This project addresses a significant gap in political theory. The literature on franchise boundaries (RNC, LVA) typically deploys the 'stakeholder' or 'subjection' principle to argue for inclusion or exclusion. The literature on CV primarily deploys consequentialist arguments about voter turnout/representation or frames CV as a correlate of the 'civic duty' principle, treating the *right* to vote as already settled. Crucially, these debates operate in silos:
  *   **Boundary Principles (RNC/LVA):** Proponents of RNC/LVA using 'subjection' rarely address whether this principle implies any *duty* to vote. Proponents using 'stakeholder' often remain silent on whether affected interests generate an obligation to *exercise* the vote. These principles appear sufficient *within* their domain but offer no clear, necessary link to the character of the vote.
  *   **Character Principle (CV):** Defenses of CV based on 'civic duty' often presuppose a legitimate electorate without rigorously demonstrating that the *same* duty principle also determines *who* constitutes that electorate. Arguments focused on consequences bypass the foundational question of principle altogether.
  The gap is the lack of systematic interrogation of whether the principles guiding *inclusion* can logically sustain the principles governing *compulsion*, and vice-versa. This project tests the coherence of each principle across both dimensions.

  **4. Method and Justification**
  The project will employ a method of *conceptual coherence testing* applied comparatively across the three core principles and the three reform probes. This involves:

  *   **Phase 1: Principle Articulation & Reform Mapping (Month 1):** Precisely reconstruct the core logic of the Stakeholder, Subjection, and Civic Duty principles as standalone justifications for the franchise. Systematically map the arguments *for* and *against* each reform (RNC, LVA, CV) within the existing literature onto these three principles. Identify which principle(s) are most naturally invoked for each reform and the typical counter-arguments encountered.
  *   **Phase 2: Coherence Testing (Months 2-3):** For *each* principle (Stakeholder, Subjection, Duty) in turn:
      1.  Assess its internal consistency and plausibility in justifying *both* RNC/LVA (allocation) *and* CV (character). Does the logic flow naturally? Where does it strain or break?
      2.  Identify necessary auxiliary premises required to bridge allocation and character under that principle (e.g., Does subjection imply a duty? Do affected interests mandate participation? Does holding an office require its exercise?).
      3.  Evaluate the plausibility and independence of these auxiliary premises. Are they inherent to the core principle, ad hoc additions, or in tension with it?
      4.  Examine potential conflicts: Does successfully justifying one reform using a principle create obstacles to justifying another? (e.g., Does grounding CV in Duty conflict with using Subjection for RNC?).
  *   **Phase 3: Synthesis and Evaluation (Month 4):** Compare the results of the coherence tests across all three principles. Determine which principle, if any, demonstrates the strongest coherence across all reforms. Assess the degree and nature of the tensions identified. Develop the argument regarding the potential necessity of a hybrid or pluralistic account, or the confirmation of fundamental fracture.

  *Justification against a Comparative Survey:* A straightforward comparative survey of the three reform debates would catalogue arguments but fail to force the crucial confrontation *between* the allocation and character questions *within* each principle's framework. The proposed coherence testing method is necessary to actively probe the logical connections and tensions *across* these dimensions, directly addressing the core research question about the unity or fracture of justificatory principles. It moves beyond description to critical evaluation of theoretical foundations.

  **5. Expected Outcomes and Deliverable**
  *   **Successful Outcome:** A clear determination of the coherence (or lack thereof) of each principle across the allocation/character divide, specifically regarding the three reform probes. This will result in a workshop paper arguing either: (a) one principle demonstrates superior coherence; (b) no single principle can coherently cover all three reforms, revealing an inherent fracture in justificatory accounts of the franchise; or (c) a specific hybrid account or set of auxiliary premises offers a viable, though complex, path to coherence. The key result is the identification and analysis of the specific points of tension or necessary supplementation.
  *   **Result Indicating Project Failure:** Failure would occur only if the analysis reveals no significant tensions or dependencies between the allocation and character dimensions under any principle, confirming the complete independence of these questions – a finding that would itself be significant but contradicts the initial hypothesis. More likely "failure" in terms of the hypothesis would be finding strong coherence under one principle.
  *   **Realistic Scope:** The project does *not* aim to develop a novel, comprehensive theory of the franchise, definitively resolve the normative debates around each reform, or conduct empirical analysis of reform impacts. It focuses rigorously on testing the *logical coherence and scope* of three established principles against three specific reform challenges. The deliverable is a theoretical analysis paper suitable for a departmental workshop, laying the groundwork for potential future publication.

  **6. Conclusion**
  By forcing the dominant principles of franchise justification to confront the dual challenges of inclusion boundaries (RNC, LVA) and the nature of participation (CV), this project promises to illuminate fundamental tensions often obscured in compartmentalized debates. It directly tests whether our core ideas about democratic membership and political obligation can form a coherent whole when applied to pressing reform questions, or whether they reveal an underlying conceptual fracture demanding theoretical attention. The coherence testing method provides a focused and productive approach to answering this determinate question within a single semester.
