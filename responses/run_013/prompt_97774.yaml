     Debrief structure:

     a) Show the class results. Likely in Problem 1, many will choose A. In Problem 2, many will choose D. In Problem 3, maybe they choose based on risk aversion.

     b) Ask if they are consistent with expected utility. Show the EU calculation (assume linear for simplicity) for Problem 1 and 2:

          Problem 1: 
              A: 100
              B: 0.01*0 + 0.89*100 + 0.10*500 = 0 + 89 + 50 = 139 -> so EU says prefer B.
          But many choose A. Why? Because of risk aversion? Then in Problem 2:
              C: 0.11*100 + 0.89*0 = 11
              D: 0.10*500 + 0.90*0 = 50 -> EU says prefer D.

          So if they chose A and D, they are not inconsistent with EU? No, because in Problem 1, if they have concave utility, they might prefer A. But then in Problem 2, they might prefer D because it has a higher EU even with the same concave utility.

          However, the Allais paradox is about the violation of the independence axiom, which we haven't directly tested. We need to show that the sure thing is driving the violation.

     c) Introduce the risk-weighted expected utility.

          Explain the process:
            - Order outcomes from worst to best.
            - Start with the worst outcome.
            - Then add the improvement to the next outcome, weighted by the risk function applied to the probability of getting at least that next outcome.
            - Continue.

          Use Problem 1, Option B:
            Outcomes: 0 (prob 0.01), 100 (prob 0.89), 500 (prob 0.10) -> ordered: 0, 100, 500.
            RWEU(B) = 0 + (100-0)*r(0.99) + (500-100)*r(0.10)

          For a pessimist, r(p) < p for p in (0,1). Let r(p)=p^2.
            = 100 * (0.99)^2 + 400 * (0.10)^2
            = 100 * 0.9801 + 400 * 0.01
            = 98.01 + 4 = 102.01   -> which is barely more than 100.

          But if we use r(p)=p^3:
            = 100 * (0.99)^3 + 400 * (0.10)^3
            = 100 * 0.970299 + 400 * 0.001 = 97.03 + 0.4 = 97.43 < 100.

          So if they are very pessimistic, they prefer A.

          For Problem 2, Option C:
            RWEU(C) = 0 + (100-0)*r(0.11) 
                    = 100 * (0.11)^3 = 0.1331 (if using p^3)
          Option D:
            RWEU(D) = 0 + (500-0)*r(0.10) = 500 * (0.10)^3 = 0.5

          So D is preferred.

          The key is that in Problem 1, the 100 is not the best outcome, so it doesn't get the full weight for the entire range. The possibility of 500 is there but weighted very low by a pessimist. In Problem 2, both options are bad (high chance of 0), but the improvement in D (from 0 to 500) is weighted by r(0.10) and in C (from 0 to 100) by r(0.11). Since 0.10 and 0.11 are both very low and the risk function is convex, they are both underweighted, but the potential gain in D is higher.

     d) Highlight rank-dependence: 
          In gamble B, the outcome 100 is the middle outcome. The improvement to 100 is from 0, and that is weighted by r(0.99) which is high, but then there is a chance to improve further to 500, but that improvement is only weighted by the small chance (0.10) transformed by r. In gamble A, there is no chance of 0 and no chance of 500, so the 100 is received for sure.

          In gamble C, the 100 is the best outcome, and the improvement from 0 to 100 is weighted by r(0.11). In gamble D, the improvement from 0 to 500 is weighted by r(0.10). 

          So the weight on the improvement to 100 in gamble B (which is part of the gamble) is r(0.99), but in gamble C it is r(0.11). That's because in gamble B, the 100 is not the best, so the entire probability mass above 0 (99%) is used for the first improvement step (which gets the outcome to 100) and then the remaining step to 500 uses only 10%. In gamble C, there is no further improvement, so the entire improvement from 0 to 100 is weighted by the chance of getting at least 100 (11%) and that's it.

     e) In Problem 3, we might not have a strong pattern. We can skip or use to show how improvements are added.

     f) Limitations: 
          - We cannot distinguish from disappointment aversion or prospect theory without more data.
          - It might be that the same choices can be explained by a concave utility function, but the Allais choices we used are a violation of EU independent of concavity. However, note: the Allais pattern is explained by many non-EU theories.

     g) Conclude that the activity shows that the choices can be naturally explained by a model that is rank-dependent and uses a transformation of cumulative probabilities.

