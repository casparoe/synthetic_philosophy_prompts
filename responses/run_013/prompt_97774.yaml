             30% chance of £100

          Gamble Z:
             70% chance of £0
             30% chance of £100

          In Y, the outcome £50 is in the middle. In Z, there is no £50.

          Now, let's see the weight on the £100 outcome:

            In Y: ordered: 0, 50, 100.
                  The improvement from 50 to 100 is weighted by the probability of getting at least 100, which is 30%. 
            In Z: ordered: 0, 100.
                  The improvement from 0 to 100 is weighted by the probability of getting at least 100, which is 30%.

          So the weight on the improvement to 100 is the same? 

          We want the weight to be different. How if we change the probabilities:

          Let me try:

          Gamble YY: 
             50% chance of £0
             30% chance of £100
             20% chance of £500

          Gamble ZZ:
             50% chance of £0
             50% chance of £100

          In YY, the outcome £100 is the middle outcome. The improvement from 0 to 100 is weighted by the probability of at least 100 (50% because 30%+20%=50%). Then the improvement from 100 to 500 is weighted by 20%.

          In ZZ, the improvement from 0 to 100 is weighted by 50%.

          So the weight on the improvement from 0 to 100 is the same in both? 

          But note: in YY, the £100 is not the best, so it doesn't get the full weight for the entire jump to the best outcome. In ZZ, the £100 is the best, so the entire jump is weighted by 50%.

          However, the weight for the first jump (0 to 100) is the same in both (r(0.5)).

          We want a common outcome that has a different cumulative probability in the two lotteries.

          How about:

          Gamble Alpha:
             50% £0
             50% £100

          Gamble Beta:
             50% £0
             40% £50
             10% £100

          In Alpha, the outcome £100 has cumulative probability (for at least 100) = 50%.
          In Beta, the outcome £100 has cumulative probability (for at least 100) = 10%.

          But in Beta, the outcome £100 is the best, and the improvement from £50 to £100 is weighted by 10%.

          However, the outcome £100 itself is not weighted; we weight the improvement steps.

          To have an outcome appear at two different ranks, we need to see if the same outcome is valued differently because of the other outcomes present.

          This is inherent in the Allais example: the £100 outcome in gamble B is not the best (there is £500), so the improvement from £100 to £500 is weighted by 10%. In gamble A, there is no improvement beyond £100.

          In the first choice, the sure £100 is valued at 100. In gamble B, the £100 is part of the middle outcome, and the improvement from £0 to £100 is weighted by 99%, and then there is a chance to improve further, but that improvement is weighted only by 10%. 

          So the £100 in B is not valued as highly because it is not the final destination.

     Given the time, we will rely on the Allais example to show the pattern and then explain the rank-dependence in the debrief.

     Proposed activity:

