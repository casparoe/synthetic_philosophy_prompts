prompt: |-
  I'm in a final-year seminar on decision theory (12 of us, 90 minutes once a week) and the prof has made each of us run one session on a topic of her choosing — I've been handed risk-weighted expected utility, which I sort of get and sort of don't. The way she explained it: you take a gamble, line the outcomes up from worst to best, and then instead of weighting each outcome by its plain probability you weight the step up from one outcome to the next by a risk function applied to the chance of doing at least that well. So a coin-flip gamble paying nothing or £100, for someone whose risk function is r(p) = p squared, comes out as 0 + r(0.5)·100 = £25 instead of £50. If your risk function sits below the diagonal you're pessimistic, the good outcomes get discounted, but you still never violate stochastic dominance and your preferences stay transitive — it's not just coded as a bias. What I actually want from you is a game or in-class activity that makes the group *feel* that, the way you feel a coordination failure in a public-goods game rather than being told about it.

  So: rules, materials (cheap — paper, tokens, a whiteboard, whatever), a payoff scheme that works without real money (we can play for points that buy raffle tickets for a decent bottle of wine, or candy, or nothing at all if you can make it work with pure points), and a rough timeline for a 90-minute session with 12 people. The idea needs to show up in what happens, not in what I say afterwards — so no explainer up front, they should walk into it cold and only hear the name in the debrief. Then give me the debrief: map specific moments in the activity onto the formal parts (the ranking of outcomes, the risk function, where the expected-utility calculation would have diverged, why the diagonal-below case is pessimism), tell me what will predictably go wrong the first time I run it and how to handle that, and be straight with me about which feature of the idea the activity simply can't reproduce and that I'll have to supply in words.

  One thing I care about: the part I find hardest to convey is that it's *rank-dependent* — the same outcome can get weighted differently depending on where it sits in the ordering of a gamble, which is exactly what plain expected utility with a concave utility function can't do. So please build in at least one pair of gambles that share a common consequence (or a common-ratio pair) so there's somewhere for that to show up, and at least one comparison where an expected-utility-with-concave-utility agent would be predicted to choose differently from what the group will actually do, so the debrief has something concrete to point at. And I'd rather you be honest that the activity can't settle whether the risk-weighted way of choosing is *rational* — it can make the pessimism feel natural and internally coherent, but it can't rule out that the same choices are just a concave utility function in disguise, or distinguish this model from prospect theory or disappointment aversion, since those fit the same choices. If the activity can only get them to the point where they stop thinking of it as a mistake, thats fine — just say so.
reasoning: |-
  We are going to design an in-class activity that demonstrates risk-weighted expected utility (RWEU) without an initial explanation. The goal is for students to experience the rank-dependence and pessimism in their choices, and then we debrief to connect their behavior to the formal model.

  Key features to highlight:
  - Rank-dependence: the weight of an outcome depends on its position in the ordered list (from worst to best).
  - Pessimism: when the risk function r(p) is below the diagonal (e.g., r(p)=p^2), the agent is pessimistic, underweighting good outcomes.
  - A comparison where a concave utility EU agent would choose differently.

  Activity Outline:

  We will have two parts:
  1. A series of choices between gambles that will reveal patterns consistent with RWEU (especially rank-dependence).
  2. A group discussion (debrief) mapping their choices to the model.

  Materials:
  - Paper and pens for each student.
  - A whiteboard for recording choices and outcomes.
  - A randomizing device (a die or a coin, or even a deck of cards) to resolve gambles if we need to play out some for illustration, but primarily we will use hypothetical choices.
  - Alternatively, we can use a computer with a random number generator if available, but low-tech is fine.

  However, note: we don't want to run too many actual plays because of time. We will rely mostly on stated preferences.

  Payoff scheme:
  - We can use points that convert into raffle tickets for a bottle of wine. Each student will make choices in several problems. At the end, one problem will be randomly selected and played for real to determine their point gain, which then converts to raffle tickets.

  Structure of the activity (90 minutes):

  1. Introduction (5 minutes): Explain that today we are going to explore decision-making under risk. They will face a series of choices between two gambles. They should choose the one they prefer. We will record choices and then discuss.

  2. Choice Problems (30-40 minutes): Present 4-6 choice problems. Each problem is a pair of gambles. We design these to highlight rank-dependence and to create a pattern that EU with concave utility cannot explain.

     Example problems:

     Problem 1 (to set a baseline and introduce the format):
     - Gamble A: 50% chance of £0, 50% chance of £100
     - Gamble B: £50 for sure

     We expect many to choose B (risk aversion). But note: under EU with concave utility, this is risk aversion. Under RWEU with r(p)=p^2, Gamble A is worth 0 + r(0.5)*100 = 25, which is less than 50.

     Problem 2 (common consequence to show rank-dependence):

     Consider two gambles:

     Gamble C: 
       - 10% chance of £0
       - 10% chance of £50
       - 80% chance of £100

     Gamble D:
       - 10% chance of £0
       - 80% chance of £50
       - 10% chance of £100

     Note: both have the same probabilities of £0 and £100, but the middle outcome is different. In Gamble C, the outcomes are: £0 (worst), £50 (middle), £100 (best). In Gamble D, the outcomes are: £0 (worst), £50 (middle), £100 (best). But the cumulative probabilities change.

     Under EU (with any concave utility), the two should be evaluated as:
       EU(C) = 0.1*u(0) + 0.1*u(50) + 0.8*u(100)
       EU(D) = 0.1*u(0) + 0.8*u(50) + 0.1*u(100)

     Since u(50) is less than u(100) and more than u(0), the difference between C and D is 0.1*u(50) + 0.8*u(100) vs 0.8*u(50) + 0.1*u(100). 
     Rearranged: EU(C) - EU(D) = [0.1*u(50) + 0.8*u(100)] - [0.8*u(50) + 0.1*u(100)] = -0.7*u(50) + 0.7*u(100) = 0.7*(u(100)-u(50)) > 0? 
     Actually, it depends on the utility function. But for a linear utility, EU(C)=0.1*0+0.1*50+0.8*100=85, EU(D)=0.1*0+0.8*50+0.1*100=50, so C is better. For a concave utility, the difference might be less, but C would still be better? Actually, let's check:

     If u(x)=sqrt(x), then:
       EU(C)=0.1*0 + 0.1*sqrt(50) + 0.8*sqrt(100) = 0 + 0.1*7.07 + 0.8*10 = 0.707 + 8 = 8.707
       EU(D)=0.1*0 + 0.8*sqrt(50) + 0.1*sqrt(100) = 0 + 0.8*7.07 + 0.1*10 = 5.656 + 1 = 6.656
     So C is better.

     But under RWEU with a pessimistic weighting (like r(p)=p^2), the evaluation changes because the rank of outcomes matters.

     How RWEU evaluates:

     For Gamble C (ordered: 0, 50, 100):
       - The step from 0 to 50: probability of at least 50 is 90% (because 10% is 0 and 90% is 50 or 100). The weight is r(0.9) - r(0.1) [wait, no: we start from worst and add the improvements]. Actually, the RWEU formula:

          RWEU = u(worst) + sum [ (u(next) - u(current)) * r(prob of getting at least next) ]

          So:
            Start at 0.
            Step to 50: improvement of 50, which we get with probability 0.9 (since 90% of the time we get at least 50). Weight: r(0.9)
            Step to 100: improvement of 50, which we get with probability 0.8 (only 80% of the time we get 100). Weight: r(0.8) - but note: the cumulative for at least 100 is 0.8.

          Actually, the correct formula: 
            Let outcomes x1 <= x2 <= ... <= xn.
            Then RWEU = u(x1) + [u(x2)-u(x1)] * r(prob of at least x2) + [u(x3)-u(x2)] * r(prob of at least x3) + ... 

          So for C:
            x1=0 (prob 0.1), x2=50 (prob 0.1), x3=100 (prob 0.8)
            RWEU(C) = u(0) + [u(50)-u(0)] * r(0.9) + [u(100)-u(50)] * r(0.8)

          Similarly, for D:
            x1=0 (prob 0.1), x2=50 (prob 0.8), x3=100 (prob 0.1)
            RWEU(D) = u(0) + [u(50)-u(0)] * r(0.9) + [u(100)-u(50)] * r(0.1)

          Notice: the term [u(50)-u(0)] is weighted by r(0.9) in both. The difference is in the last term: 
            C: [u(100)-u(50)] * r(0.8)
            D: [u(100)-u(50)] * r(0.1)

          Since r(0.8) > r(0.1) (because r is increasing), then if u(100)>u(50), the term for C is bigger. So if r is linear, we get the same as EU. But if r is convex (pessimism, r(p) < p for p<1), then r(0.8) is much less than 0.8 and r(0.1) is much less than 0.1, but the ratio r(0.8)/r(0.1) might be less than 8? Actually, for r(p)=p^2: r(0.8)=0.64, r(0.1)=0.01, so the weight on the jump to 100 is 0.64 in C and 0.01 in D. 

          Therefore, RWEU(C) = u(0) + [u(50)-u(0)]*0.81 + [u(100)-u(50)]*0.64
          RWEU(D) = u(0) + [u(50)-u(0)]*0.81 + [u(100)-u(50)]*0.01

          Now, if we assume u(0)=0, u(50)=50, u(100)=100 (linear), then:
            RWEU(C) = 0 + (50-0)*0.81 + (100-50)*0.64 = 50*0.81 + 50*0.64 = 40.5 + 32 = 72.5
            RWEU(D) = 0 + 50*0.81 + 50*0.01 = 40.5 + 0.5 = 41
          So C is preferred.

          But if we use a concave utility, say u(x)=sqrt(x), then:
            RWEU(C) = 0 + (sqrt(50)-0)*0.81 + (10-sqrt(50))*0.64 = 7.07*0.81 + (10-7.07)*0.64 = 5.7267 + 2.93*0.64 = 5.7267 + 1.8752 = 7.6019
            RWEU(D) = 0 + 7.07*0.81 + (10-7.07)*0.01 = 5.7267 + 2.93*0.01 = 5.7267 + 0.0293 = 5.7559
          So again C is preferred.

          This doesn't show a reversal. We need a pair where RWEU with pessimism reverses the EU (with same concavity) preference.

     Problem 3 (inspired by the Allais common ratio paradox, but tailored for rank-dependence):

     Let's design a pair that can show a reversal.

     Consider:

     Gamble E: 
       80% chance of £0
       20% chance of £100

     Gamble F:
       75% chance of £0
       25% chance of £80

     Under EU with linear utility:
       E: 0.2*100 = 20
       F: 0.25*80 = 20 -> indifferent.

     With concave utility, say u(x)=x^0.5:
       E: 0.8*0 + 0.2*10 = 2
       F: 0.75*0 + 0.25*sqrt(80) ~ 0.25*8.944 = 2.236 -> so F is better.

     But under RWEU with r(p)=p^2 and linear utility:
       E: outcomes: 0 (worst, prob 0.8), 100 (best, prob 0.2). 
          RWEU(E) = 0 + [100-0] * r(0.2) = 100 * (0.2)^2 = 100*0.04 = 4
       F: outcomes: 0 (worst, prob 0.75), 80 (best, prob 0.25)
          RWEU(F) = 0 + [80-0] * r(0.25) = 80 * (0.25)^2 = 80*0.0625 = 5
       So F is better (5>4).

     Now, if we have a choice between E and F, an EU maximizer with concave utility might also prefer F, so that doesn't distinguish.

     We need a case where EU (with concave utility) prefers one, but RWEU (with linear utility and pessimism) prefers the other, and the reversal happens.

     How about:

     Problem 3 (modified):

     Gamble G: 
       50% chance of £0
       50% chance of £100

     Gamble H:
       100% chance of £45

     Under EU with linear: G=50, H=45 -> prefer G? But if we use concave utility, we might prefer H (risk aversion). 

     Now, under RWEU with r(p)=p^2 and linear utility:
       G: 0 + [100-0]*r(0.5)=100*(0.25)=25
       H: 45
       So H (45) is preferred to G (25). So both a concave EU and RWEU with pessimism would choose H. 

     We need a pair that separates concave EU from RWEU with linear utility and pessimism.

     Standard example for rank-dependence: the two-stage gamble.

     Problem 4 (from the literature):

     Consider:

     Gamble I: 
       - Stage 1: 75% chance of ending the game with £0, and 25% chance to go to stage 2.
       - Stage 2: a 50-50 chance of £0 or £100.

       So overall: 75% £0, 12.5% £0, 12.5% £100 -> 87.5% £0, 12.5% £100.

     Gamble J:
       - 87.5% chance of £0
       - 12.5% chance of £100

     They are identical in distribution. But under RWEU, the evaluation might differ because of the way the probabilities are compounded? Actually, no: the decumulative distribution is the same. So they should be the same.

     We need a common ratio effect with a common consequence.

     Let me try:

     Problem 5:

     Gamble K: 
       90% chance of £100, 10% chance of £50

     Gamble L:
       90% chance of £100, 10% chance of £40

     Obviously, everyone prefers K. Not useful.

     Problem 6 (using a common consequence in the middle):

     Gamble M: 
       1% chance of £0
       89% chance of £100
       10% chance of £50

     Gamble N:
       1% chance of £0
       89% chance of £100
       10% chance of £40

     Again, obvious.

     How about:

     Gamble O: 
       5% chance of £0
       5% chance of £200
       90% chance of £50

     Gamble P:
       5% chance of £0
       5% chance of £100
