     Now, under EU with linear: O = 0.05*0 + 0.05*200 + 0.9*50 = 0 + 10 + 45 = 55
     P = 0.05*0 + 0.05*100 + 0.9*50 = 0 + 5 + 45 = 50 -> prefer O.

     Under RWEU with linear utility and r(p)=p^2:

       For O: ordered outcomes: 0, 50, 200.
           RWEU(O) = 0 + (50-0)*r(0.95) + (200-50)*r(0.05) 
                    = 50 * (0.95)^2 + 150 * (0.05)^2
                    = 50 * 0.9025 + 150 * 0.0025
                    = 45.125 + 0.375 = 45.5

