answer: |-
  Below is a complete in-class activity designed to help students experientially grasp risk-weighted expected utility (RWEU), focusing on rank-dependence and pessimism. The activity uses simple materials, avoids upfront explanation, and includes a debrief linking choices to the formal model. The payoff uses raffle tickets for a bottle of wine (or candy).

  ---

  ### **Activity: The Gambling Queue**
  **Concepts Illustrated**: Rank-dependence, pessimism via risk function, divergence from expected utility (EU), and common consequences.  
  **Materials**: 
  - 12 sheets of paper (one per student) 
  - A whiteboard 
  - Markers 
  - Two six-sided dice  
  - A bag of numbered tokens (numbers 1–100, e.g., folded paper slips)  
  **Payoff**: Points = raffle tickets for a bottle of wine. 10 points = 1 ticket.  
  **Time**: 75 minutes (activity: 45 min; debrief: 30 min).  
  **Group Size**: 12 students.  

  ---

  ### **Rules and Procedure**  
  #### **Phase 1: Setup (5 min)**  
  - **No initial explanation**. Students enter to find chairs arranged in a circle.  
  - Hand each student a sheet labeled "Gamble Menu" (below) and a token.  
  - **Instructions**:  
    > *"Today, you’ll face 4 gambles (A–D). For each, choose one option (1 or 2). I’ll announce which gamble we’re playing. Then, you’ll line up worst-to-best based on your token number. I’ll roll dice to simulate probabilities. Points earned buy raffle tickets."*  

  #### **Phase 2: Gamble Menu (30 min)**  
  Run **one gamble at a time** (order: A → B → C → D). For each:  
  1. **Choose**: Students circle Option 1 or 2 for the current gamble.  
  2. **Line Up**: Students form a "gamble queue" worst (lowest token) to best (highest token).  
  3. **Resolve**:  
     - Roll two dice to get a number 2–12. Treat this as a probability (e.g., roll 7 = 70%).  
     - Starting from the worst, move up the queue. Students "win" if the roll exceeds their cumulative rank (see example below).  
  4. **Record**: Tally choices and outcomes on the whiteboard.  

  **Gamble Menu** (points, not £):  
  - **Gamble A** (Baseline):  
    - Option 1: 50% chance of 0, 50% of 100  
    - Option 2: 100% chance of 45  
  - **Gamble B** (Common Consequence):  
    - Option 1: 10% chance of 0, 10% of 50, 80% of 100  
    - Option 2: 10% chance of 0, 80% of 50, 10% of 100  
  - **Gamble C** (Rank-Dependence Demo):  
    - Option 1: 10% chance of 0, 90% of 100  
    - Option 2: 10% chance of 0, 10% of 500, 80% of 100  
  - **Gamble D** (Pessimism Trigger):  
    - Option 1: 11% chance of 100, 89% of 0  
    - Option 2: 10% chance of 500, 90% of 0  

  **Example Resolution for Gamble A**:  
  - Tokens: Worst = 5 (student 1), best = 96 (student 12).  
  - Roll: Dice = 8 → 80% chance threshold.  
  - Outcome: Students with tokens ≤ 80 "win" their outcome tier. For Option 1:  
    - Bottom 50% (tokens 1–50): get 0 points.  
    - Top 50% (tokens 51–100): get 100 points.  
  - If a student chose Option 2, they get 45 points regardless.  

  #### **Phase 3: Points Calculation (10 min)**  
  - Randomly select **one gamble** via dice roll to resolve for points.  
  - Award points based on choices and outcomes. Convert to raffle tickets.  

  ---

  ### **Debrief (30 min)**  
  Use whiteboard to map choices to RWEU. Start with observed patterns:  
  1. **Gamble A (Baseline)**:  
     - *Prediction*: Most choose Option 2 (safe 45). Under EU, Option 1’s EV = 50.  
     - *Link*: Explain pessimism. With risk function `r(p) = p²`, Option 1’s RWEU = `0 + r(0.5)×100 = 0.25×100 = 25 < 45`. The "step up" from 0→100 is underweighted.  
     - *Key Moment*: When students lined up worst-to-best, the queue represented **outcome ranking**. The dice roll determined the "cumulative probability" threshold.  

  2. **Gamble B (Common Consequence)**:  
     - *Prediction*: Many prefer Option 1 (80% chance of 100). Under EU (linear), both have EV=85.  
     - *Link*: Highlight **rank-dependence**. In Option 1, the 100-point outcome is the *best* (weighted by `r(0.8)`). In Option 2, the 100-point outcome is *middling* (weighted by `r(0.1)`). With `r(p)=p²`:  
       - Option 1: `0 + [50−0]×r(0.9) + [100−50]×r(0.8) = 0 + 50×0.81 + 50×0.64 = 72.5`  
       - Option 2: `0 + [50−0]×r(0.9) + [100−50]×r(0.1) = 0 + 50×0.81 + 50×0.01 = 41`  
     - *Divergence*: EU with concave utility (e.g., `u(x)=√x`) also prefers Option 1, but RWEU makes it **starker** due to underweighting small probabilities for middle outcomes.  

  3. **Gamble C (Rank-Dependence Demo)**:  
     - *Prediction*: Most choose Option 1. Option 2 has a "tempting" 500, but 100 is demoted from best to middle.  
     - *Link*: The 100-point outcome in Option 1 is weighted by `r(0.9)`, but in Option 2, it’s part of a step weighted only by `r(0.8)` (with 500 weighted by `r(0.1)`). Pessimists distrust the "bonus" step.  

  4. **Gamble D (Pessimism Trigger - Allais Paradox)**:  
     - *Prediction*: Many choose Option 1 in C but Option 2 here.  
     - *Link*: In Gamble C, the safe 100 was attractive; here, both options are risky. RWEU with `r(p)=p²`:  
       - Option 1: `0 + 100×r(0.11) = 100×0.0121 = 1.21`  
       - Option 2: `0 + 500×r(0.10) = 500×0.01 = 5`  
     - *Divergence from EU*: EU (linear) prefers Option 2 (EV=50 vs. 11). With concave utility, Option 2 may still win, but RWEU’s **pessimism** (`r(p) < p` for small p) makes Option 2’s 500 less intimidating.  

  #### **Key Discussion Points**:  
  - **Risk Function & Pessimism**: `r(p) = p²` sits below the diagonal → good outcomes (high steps) are discounted.  
  - **Rank-Dependence**: The same outcome (e.g., 100 points) gets different weights based on its position in the queue (best vs. middle). EU can’t do this—it would weight identical outcomes the same.  
  - **Limitations**:  
    - The activity **can’t prove RWEU is rational** or distinguish it from prospect theory. It shows pessimism is *coherent* (no dominance violations, transitivity holds in the queue).  
    - It **can’t isolate utility curvature**. Point out: "If EU had concave utility, Gamble B might still prefer Option 1, but RWEU explains why it’s *overwhelming*."  
  - **Predictable Issues**:  
    - **Token confusion**: Some may misread tokens. Clarify: "Token = your luck; low = bad."  
    - **Gamble D choices**: If students don’t switch to Option 2, emphasize: "In high-loss scenarios, pessimists focus on avoiding the worst, not chasing the best."  

  ---

  ### **Why This Works**  
  - **Experience over Explanation**: The "gamble queue" forces students to *live* the rank-ordering. Rolling dice makes probabilities visceral.  
  - **Pessimism Feels Natural**: Choosing safety in A and C, but risk in D, mirrors real-world inconsistency—then RWEU explains it as rational.  
  - **Critical Divergence**: Gamble B’s gap (Option 1 chosen more than EU predicts) and Gamble D’s switch highlight RWEU’s added value.  

  **What You’ll Need to Verbally Clarify**:  
  - RWEU isn’t the *only* model (prospect theory also uses ranks).  
  - The risk function formalizes pessimism but doesn’t justify it normatively.  
  - Why the diagonal-below = pessimism: `r(p) = p` is neutral; `r(p) < p` underweights high-stakes improvements.  

  This activity makes RWEU’s core mechanics *felt*. Students will leave grasping why outcomes aren’t evaluated in isolation—and why pessimism isn’t a "bias" but a structured alternative to EU.
