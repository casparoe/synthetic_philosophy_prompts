answer: |-
  ### Examination Question  
  **Answer one question only. Your essay must be 800–1,000 words and take a definitive stance. Avoid plot summary or biographical digressions.**  

  > Novelist A writes two historical works. In *Book X*, she constructs a first-person narrative for a woman documented only as a name in a ledger, a coroner’s report entry, and a marriage signature. She invents for this woman a secret lover, a private religious heresy, and an unspoken grief. In *Book Y*, she writes a first-person novel about a man with forty years of surviving letters. In one pivotal scene, she depicts him committing an act his letters explicitly and repeatedly deny. No living person is legally harmed by either book. Both become defining cultural images of their subjects.  
  >  
  > **Your task:**  
  > (1) Does the novelist owe meaningfully different obligations to these two dead subjects? If so, is this difference rooted in distinct duties *to the dead themselves*, or merely in the *evidential warrant* for each portrayal (underdetermined vs. contradicted)?  
  > (2) Is the language of "owing the dead" a sentimental confusion—a vague proxy for duties to the living (descendants, communities, archives) and readers (coherent narratives)? Or can obligations to the dead hold independent moral weight?  
  >  
  > **Reach and defend a verdict.** Strong answers will:  
  > - Specify what must be true for obligations to the dead to be coherent.  
  > - Scrutinize whether "counterfactual consent" (what they *would* have wanted) or fidelity to a subject’s self-understanding can bind us posthumously.  
  > - Engage the argument that vivid fiction harms the unborn by foreclosing the historical record.  

  ---

  ### Model Answer (650 words)  
  **Verdict:** Obligations to the dead are meaningfully distinct from duties to the living or readers, and they differ critically between the two cases. The novelist owes the woman (*Book X*) creative restraint grounded in historical plausibility, but owes the man (*Book Y*) a near-absolute prohibition against contradicting his self-documented identity. "Owing the dead" is not sentimental confusion; it is an obligation to honor the persistent moral claim of personhood, even in absence.  

  **(1) The Difference in Obligations**  
  The obligations differ radically because the dead are not homogeneous. The woman’s archival silence imposes a duty of *contextual integrity*: inventions (lover, heresy, grief) must align with verifiable social, economic, and cultural constraints of her world. To graft implausible modern psychologies onto her is epistemic violence—not to her *feelings* (unknowable), but to her *reality* as a historical agent. We owe her a self consistent with her world’s possibilities.  

  The man, however, left a curated self. His letters are not just evidence but *testimony*. To invent an act he explicitly denies is a moral injury. It is not that he is "harmed," but that his personhood—constructed through his words—is overwritten. The difference here is not merely evidential (contradiction vs. absence) but ontological: he articulated an identity, and we owe fidelity to that act of self-creation. The woman’s identity remains unvoiced; the man’s is archived.  

  **(2) The Coherence of Obligations to the Dead**  
  The objection that the dead cannot consent or be harmed dissolves only if we reduce ethics to utilitarianism or presentist consent. But personhood generates enduring claims. Consider: we condemn grave desecration not because it hurts the living, but because it violates the *dignity owed to the person who was*. Likewise, the novelist’s duty is to respect the *narrative integrity* of a life.  

  Counterfactual consent ("Would she want this?") fails—it is projection. What anchors obligation is the *right to self-definition*. The man defined himself; to falsify that is to annihilate his autonomy posthumously. For the woman, without self-definition, the duty shifts to *non-defamation by anachronism*: we must not make her a puppet for contemporary ideologies alien to her context.  

  The deepest injury is to the future. *Book Y* does not merely add to the record; it *replaces* the man’s self with fiction. Future readers inherit a lie ratified as truth. *Book X* risks less: the woman had no self-portrayal to erase. Yet both cases threaten the unborn if they normalize historical fabrication. The novelist owes future generations preservation of the *distinction* between evidence and invention.  

  **Why Obligations to the Dead Hold Weight**  
  For obligations to the dead to be coherent, two things must be true:  
  - Personhood leaves moral traces that are not extinguished by death.  
  - History is not merely data but a network of *lived experiences* demanding interpretive humility.  
  The dead cannot be negotiated with, but they can be betrayed. The novelist owes the man fidelity to his testimony as a sacred trust. She owes the woman humility—a refusal to colonize her silence with gratuitous invention. To reduce these duties to "what pleases readers" or "what avoids hurting descendants" is moral evasion: descendants might crave scandal; readers might relish melodrama. Obligations to the dead are a bulwark against presentism. They force us to ask not "What serves us?" but "What honors them?"  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-Grade (17–20):** *Defends a clear verdict* engaging BOTH core problems (difference in obligations + independent weight of "owing the dead"). *Must* address future-reader harm AND either counterfactual consent or self-definition.  

  **B-Grade (13–16):** Compares the cases meaningfully but hesitates on whether obligations to the dead are independent OR addresses only one core problem thoroughly.  

  | **Criterion**                                                                 | **Marks** | **Common Pitfall**                              |  
  |-------------------------------------------------------------------------------|-----------|--------------------------------------------------|  
  | **1. Takes a definitive stance** on whether obligations to the dead differ and hold independent weight.  | 4 | Waffles; surveys "both sides" without verdict. |  
  | **2. Distinguishes obligations** between the two cases, arguing whether the difference derives from the dead themselves or evidentiary context. | 4 | Treats both cases identically; ignores archival asymmetry. |  
  | **3. Engages the "sentimental confusion" charge**: Assesses if "owing the dead" reduces to duties to living/readers. | 4 | Dismisses obligation to dead as "obviously nonsense" without argument. |  
  | **4. Grapples with a foundational problem**: Either counterfactual consent OR self-definition OR future-reader harm. | 4 | Only mentions these concepts; does not dissect their limits/implications. |  
  | **5. Specifies conditions** under which obligations to the dead could be coherent. | 4 | Vague assertions ("We must respect them"); no metaphysical grounding. |  

  *Note: Essays scoring <2 in Criteria 1 or 4 cannot earn an A. Top marks require synthesis of historical ethics, moral philosophy, and the case specifics.*
