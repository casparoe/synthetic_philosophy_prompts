  The core challenge is mapping three layers:
  1) The legal doctrine (ordinary meaning canon)
  2) The School of Names' conceptual tools (White Horse paradox, hardness/whiteness separation)
  3) The concrete tomato classification problem

  I notice the user has already done sophisticated groundwork - they grasp both the legal precedent's surface reasoning and the School of Names' basic tenets. Their unspoken need might be validation that philosophical analysis can impact practical jurisprudence, not just remain abstract. The emotional tone suggests intellectual excitement tempered by skepticism about whether ancient paradoxes can truly help.

  The White Horse paradox is key here. Its genius lies in exposing how "is not" can mean either:
  - Non-identity (this white horse ≠ the concept 'horse')
  - Or class exclusion (white horses ⊄ all horses)

  But legal classification struggles are fundamentally about class inclusion (tomato ∈ vegetable?). So the analogy might break at the threshold. Still, Gongsun Long's insight about criteria differentiation applies perfectly - the Court prioritized culinary function over biological traits, just as "white horse" adds a color criterion to "horse".

  The hardness/whiteness separation seems even more pertinent. By treating botanical classification (fruit) and culinary use (vegetable) as separable attributes of tomatoes, the Court echoes the School's view that properties aren't essentially linked. This exposes their implicit nominalism - categories are human constructs based on selected attributes, not inherent realities.

  Where the School falls short is precisely where legal practice thrives: it offers no hierarchy of meanings (ordinary vs technical) or theory of institutional authority. The justices didn't just observe usage; they privileged culinary discourse over botanical discourse. The School's silence on such power dynamics is telling - their "rectification of names" concerns social harmony, not statutory interpretation.

  Reversing the analysis: Nix v. Hedden actually validates the School's conventionalist view, but also exposes its limitations. The decision proves that kind-membership is usage-based (convention), yet the Court's appeal to "common understanding" masks the reality that statutory meaning gets imposed authoritatively, not discovered. The White Horse paradox seems merely verbal in comparison because legal classifications have tangible consequences - tariffs, after all.

  Ultimately, the School offers a brilliant diagnostic for linguistic ambiguity but no prescriptive tools for resolving it within institutional constraints. Its value lies in exposing that the tomato debate wasn't about produce but about linguistic authority - a dimension the ordinary-meaning canon obscures. To fill this gap, we'd need something like Wittgenstein's language-games or Foucault's discourse analysis, which the user might explore next.
answer: |-
  ### Applying the School of Names to *Nix v. Hedden*  

  #### **1. The Court’s Presupposition vs. the School of Names’ View**  
  - **Court’s Presupposition**: The extension of "fruit" or "vegetable" is fixed by **ordinary language conventions** (culinary/usage-based), not technical (botanical) definitions. The decision assumes words in statutes derive meaning from common understanding, not scientific taxonomy.  
  - **School of Names’ Diagnosis**: The Court was asked to *rectify names* (正名, *zhèng míng*)—resolving a dispute over how to assign objects to socially constructed categories. The School would see this as a question of **conventional application of kind terms**, where "fruit" and "vegetable" are *ming* (名, names) whose boundaries are set by human practice, not nature.  

  #### **2. White Horse Paradox Applied**  
  Gongsun Long’s "white horse is not horse" exploits three ambiguities. Here’s how they map to *Nix v. Hedden*:  
  - **Ambiguity of the Negative Copula**:  
    - *Court’s Approach*: "Tomato is not fruit" (in legal context) denies *class membership* under the tariff, not botanical identity. This aligns with "white horses are not horses" meaning "white horses are a subset, not the whole set of horses."  
    - *Alternative Readings*:  
      - If "is not" denied *identity* (botany vs. law), the Court would have said "a tomato is botanically fruit but legally not fruit"—which it did.  
      - If "vegetable" named a "stuff" (like "water"), the Court would treat it as a mass noun (e.g., "canned vegetable"), but it didn’t; it treated "vegetable" as a countable kind.  
  - **Winner**: The *class membership* reading fits perfectly. The Court separated botanical "fruit" (technical set) from culinary "vegetable" (ordinary set), just as "white horse" is a subset of "horse."  

  #### **3. Separation of Hardness/Whiteness Applied**  
  - **Court’s Move as Separation**: By prising apart botanical properties (seed-bearing structure) and culinary use (savory dishes), the Court treated these attributes as **separable *shi* (实, realities)**. A tomato has multiple properties (botanical, culinary), but the statute’s "vegetable" isolates culinary use.  
  - **School of Names’ Implication**: This separation allows a single object (tomato) to belong to **multiple overlapping kinds** (fruit in botany, vegetable in cuisine). The *Hardness/Whiteness Essay* supports this: properties are discrete and context-dependent. A stone’s hardness doesn’t necessitate its whiteness; a tomato’s "fruit-ness" doesn’t necessitate its "vegetable-ness" in law.  

  #### **4. Where the Theory Runs Out**  
  The School of Names:  
  - Diagnoses ambiguity (e.g., "is" can mean identity or class membership).  
  - Offers no rule for **choosing between ordinary/technical usage**.  
  - Has no theory of **institutional authority** (e.g., who decides convention—courts? chefs?).  
  - Prioritizes **social order** over statutory interpretation.  
  - **Gap or Different Question?** This is a gap. The School aimed to resolve philosophical/social paradoxes (e.g., "can a white horse be missing?"), not legal taxonomy. Its tools *describe* ambiguity but don’t prescribe how institutions should resolve it.  

  ---  

  ### Reversing the Direction: *Nix v. Hedden* on the School of Names  
  #### **Correspondence**  
  - **Horse** = "Fruit" (botanical category)  
  - **White Horse** = "Vegetable" (culinary category)  
  - **Hard/White Stone** = Tomato (possessing both botanical and culinary properties).  

  #### **Verdicts**  
  1. **Vindication of Conventionalism**:  
     - *Nix* affirms the School’s view that kind membership is **settled by convention**, not nature. Botany defines "fruit," but custom defines "vegetable."  
  2. **Limits of the Paradoxes**:  
     - The paradoxes *are* the right instrument to expose ambiguity (e.g., "is" misapplied), but they don’t resolve **why one convention prevails**. The Court appealed to "common speech," but didn’t explain *whose* speech (e.g., consumers vs. botanists).  
  3. **"Merely Verbal" Charge**:  
     - The Court’s reliance on "common understanding" *weakens* the "merely verbal" charge. If language conventions have real-world effects (tariffs), the dispute is substantive. The White Horse puzzle, by contrast, has no stakes—it *is* verbal.  
  4. **Does the School Add Value?**  
     - **Yes**: It provides a **philosophical foundation** for the ordinary-meaning canon, exposing that kind terms are fluid and context-dependent.  
     - **No**: It offers **no practical guidance** for legal decisions. The canon already uses common usage; the School’s paradoxes don’t solve *which* usage wins.  
     - **What Would Help**: A theory of **institutional epistemology** (e.g., how courts ascertain "ordinary meaning") or **discourse authority** (e.g., why chefs > botanists in tariff contexts).  

  #### **Mapping Breakdown**  
  - **Where Fits**:  
    - Tomato’s dual properties ≡ Stone’s hardness/whiteness.  
    - "Fruit" vs. "vegetable" ≡ "Horse" vs. "white horse" (subset distinction).  
  - **Where Breaks**:  
    - The School has no analogue for **legal authority**. Courts *impose* a convention; the School merely observes ambiguity.  
    - Real-world consequences (tariffs) elevate the dispute beyond verbal paradox.  

  **Final Verdict**: The School of Names illuminates the *structure* of the ambiguity in *Nix v. Hedden* but supplies nothing beyond the ordinary-meaning canon’s pragmatism. To fill the gap, we need a theory of **institutional semantic authority**—e.g., why courts privilege culinary custom over science in tariff classification.
