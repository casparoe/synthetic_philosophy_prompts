prompt: |-
  Ok so I'm the one who has to write up the reading group's adversarial collaboration thing and I need the actual document. Two people in my phil of science group have been fighting for about a year about Bertrand's paradox. Person A: the principle of indifference is fine, every version of the paradox is just somebody picking a bad parameterization, and once you get the symmetry group of the problem right the prior is uniquely pinned down, so there's nothing left to explain. Person B: that's backwards, you only ever know which transformations are irrelevant by already having the right prior, so indifference is either circular or it hands you a whole family of credences instead of one, and the honest move is to stop pretending otherwise and work with sets of credences.

  I want the joint statement they could both actually sign. Agreed claims as a numbered list first, then a disagreements table with the exact residual disagreement in each row, worded so each of them would accept the wording of there own column. Then the cruxes -- and for each crux, a case or argument both of them agree would bear on it, plus each side's prediction written down in advance.

  Two things to build in, since I've already floated them at the group and they're both engaged with them. First, the wine/water thing: a mixture known only to have wine:water between 1 and 2, and you're asked for the credence that the ratio is above 1.5. Run indifference on the ratio, on its reciprocal, and on the log of the ratio, and you get three different numbers. Second, a proposed rule the group has been calling the swap test: a credence assignment for such an unknown quantity is only admissible if you get the same assignment back when you redo the whole problem in terms of the reciprocal (or any other reparameterization the problem's own description can't distinguish). Log-uniform passes, plain uniform doesn't, and the chord setup fails it in all three of its versions (random endpoints, random radius, random midpoint). What I want out of the collaboration is whether passing the swap test is a vindication of indifference -- A's line -- or a confession that the symmetry is doing alot of the work and indifference adds nothing on top of it, which is B's line.

  Also please say if any part of their fight is just verbal, and don't let them settle for agreements that are true but empty; if a claim only gets signed because it's vacuous, drop it. No citations or reading lists, neither of them cares who said what first.
