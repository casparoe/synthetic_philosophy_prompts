  **Joint Statement on the Politics of Artifacts**

  We, the undersigned, have engaged in an adversarial collaboration to clarify our disagreements and agreements on the question of whether artifacts can have politics. We agree on several key points but remain divided on others. This document outlines both the common ground and the points of divergence, using concrete cases to illustrate our differences.

  ### Section 1: Agreed Claims

  1. **Social Embeddedness**: We agree that technologies are developed and deployed within social, economic, and political contexts that shape their design, implementation, and effects. The politics of technology must be analyzed in relation to these contexts.

  2. **Burden of Proof**:
     - The proponent of the view that artifacts can have inherent politics (hereafter Side A) accepts the burden of demonstrating that a specific design, by its material or operational characteristics, necessitates or strongly biases a particular social arrangement, such that the artifact itself (independent of context) can be said to be political.
     - The proponent of the neutral-instrument view (hereafter Side B) accepts the burden of showing that the same artifact can be adapted to serve different social arrangements, and that any political effect is due to the context of use rather than the artifact's inherent properties.

  3. **Facilitation vs. Mandate**: We agree that a technology that merely makes a social arrangement easier (facilitation) is distinct from one that makes it mandatory (enforcement). We further agree that if a design admits of only one workable social arrangement, then it is not neutral. However, we disagree on the frequency of such cases and on what constitutes "workable."

  4. **Evidence**:
     - For Side A, evidence of inherent politics must include: (a) the physical or operational constraints of the artifact that limit the range of possible uses, and (b) empirical or historical evidence that these constraints lead to consistent social outcomes across varying contexts.
     - For Side B, evidence for neutrality must include: (a) documented cases of the same artifact being used in different social arrangements, and (b) the absence of physical constraints that would prevent such flexibility.

  5. **Design Process and Uptake**: We agree that the design process (including the intentions, values, and social choices of designers) and the uptake (how the artifact is deployed, regulated, and used by institutions and individuals) are central to understanding the politics of technology. However, we disagree on whether the finished artifact, once produced, can be said to have politics independently of its use.

  ### Section 2: Disagreements

  We have identified two main disagreements, each with a crux (the point of divergence). For each, we use two cases: a classic example (the low parkway overpasses) and an invented case (adaptive traffic signals favoring buses). We provide each side's position and their predictions on the cases.

  #### Disagreement 1: The Locus of Politics

  - **Side A Position**: The politics of an artifact is inherent in its design when that design embodies and enforces a particular social order. The physical form and function of the artifact, once built, carry political properties that are not reducible to the context of use. The artifact itself is political because it imposes constraints that shape social relations.

  - **Side B Position**: Politics arises only in the social relations surrounding the artifact — in the design process (which involves human intentions and social choices) and in the context of use (how the artifact is deployed, by whom, and under what institutions). The artifact itself is inert and neutral; it can be repurposed for different political ends.

  - **Crux**: Whether the politics of a technology is a property of the artifact's physical form and function (Side A), or solely a property of the social processes that create and use it (Side B).

  | Case | Side A Prediction | Side B Prediction |
  |------|-------------------|------------------|
  | **Classic: Low parkway overpasses** (designed with low clearances to prevent buses from accessing a public beach) | The overpasses inherently enforce a class-based exclusion because their physical design (low height) makes it impossible for buses to pass. This exclusion is a property of the artifact: rebuilding would be required to change it. | The overpasses are neutral structures; their exclusionary effect is due to the social context (e.g., the association of buses with low-income groups). The artifact does not enforce; if buses became the norm, the overpasses could be modified. |
  | **Invented: Adaptive traffic signals** (programmed to detect buses and extend green lights for them, delaying cars) | The system inherently favors public transit because its algorithm prioritizes buses. Even if reprogrammable, the current design embodies a political choice. Changing it requires a new design decision, so the artifact in its current state has inherent politics. | The system is a neutral tool; it can be reprogrammed to prioritize cars, bicycles, or emergency vehicles. The bias towards buses is a result of current programming choices, not the artifact itself. |

  #### Disagreement 2: Flexibility as Evidence

  - **Side A Position**: The inherent politics of an artifact is not negated by the mere possibility of alternative uses. If the artifact, in its actual historical and material context, strongly channels social arrangements in one direction (due to costs of change, path dependency, or the design's operational logic), then it has inherent politics. Flexibility in principle does not erase the political bias in practice.

  - **Side B Position**: If an artifact can be adapted to serve different social arrangements (even if it requires effort), then the artifact itself does not have inherent politics. The political effect is contingent on how it is used and can be changed without altering the artifact's core identity. Demonstrating flexibility defeats the claim of inherent politics.

  - **Crux**: Whether the demonstrable flexibility (in principle or in practice) of an artifact in use defeats the claim that the artifact has inherent politics (Side B), or whether the claim of inherent politics is about the default or most probable effect of the artifact in its context (Side A).

  | Case | Side A Prediction | Side B Prediction |
