  ## Step 3: Verbal Disagreements

  We must address if any part is verbal. The main verbal issue is the scope of the term "politics." 

  - Side A uses "politics" to refer to the way an artifact's design imposes constraints that shape social relations, even if that design was not intended for that purpose. 
  - Side B reserves "politics" for intentional human actions and social relations, and does not attribute it to material objects.

  The joint statement should note:

  "Part of the disagreement is verbal: Side A uses the term 'politics' to include the effects of material constraints that arise from design, while Side B restricts 'politics' to the realm of human intentions and social relations. This leads to a substantive disagreement about whether material constraints can be considered political in the same way as human decisions."

  ## Writing the Joint Statement

  We now write the document accordingly.

