answer: |-
  ### Joint Statement on the Politics of Artifacts  
  **Agreed Claims**  

  We, the undersigned, affirm the following shared premises about artifacts and politics:  
  1. **Social Context Matters**: All artifacts emerge from and operate within social contexts. Design choices reflect institutional priorities, cultural norms, and power relations. Politics is never absent from technology’s lifecycle.  
  2. **Burden of Proof**:  
     - The "inherent politics" view (hereafter **Side A**) accepts the burden to demonstrate that a design *materially constrains* social arrangements, making certain outcomes inevitable absent costly redesign.  
     - The "neutral instrument" view (hereafter **Side B**) accepts the burden to demonstrate that an artifact’s *flexibility in use* allows it to serve divergent political ends across contexts.  
  3. **Facilitation vs. Mandate**:  
     - Both agree that an artifact merely *facilitating* a social order (e.g., a typewriter easing bureaucratic work) differs from one *mandating* it (e.g., a design physically excluding alternatives).  
     - "Mandate" requires evidence that the artifact’s form/function renders alternatives nonviable without fundamental alteration.  
  4. **Evidence Standards**:  
     - **For Side A**: Proof of inherent politics requires showing (a) the design imposes *inescapable* constraints, and (b) these constraints persist across contexts.  
     - **For Side B**: Proof of neutrality requires showing (a) repurposing occurs *without structural modification*, and (b) divergent outcomes arise from the same artifact.  
  5. **Process vs. Artifact**: Both agree politics operates in the *design process* (intentions, values) and *uptake* (deployment, regulation). Disagreement centers on whether politics resides *additionally* in the finished artifact itself.  

  ---

  ### Disagreements Table  
  *Each position is stated as its proponents would endorse. Cruxes identify fault lines; cases test predictions.*  

  | **Disagreement** | **Side A: Inherent Politics** | **Side B: Neutral Instrument** | **Crux** | **Relevant Case & Predictions** |
  |------------------|-------------------------------|--------------------------------|----------|--------------------------------|
  | **1. Locus of Politics**: <br>Can the *finished artifact* bear politics independently? | Politics resides in the artifact’s physical form when its design necessitates a specific social order. The artifact enforces outcomes by constraining use, making neutrality a fiction when alternatives are materially excluded. | Politics arises solely from human agency: the artifact is inert until activated by social choices. Attributing politics to the thing itself conflates the design’s *effects* (contingent on context) with its *essence* (mute materiality). | **Must politics be predicated of the artifact, or only of process/uptake?** <br>Side A: Artifact’s constraints *are* political. <br>Side B: Constraints become political only via human application. | **Case: Low Parkway Overpasses** <br>*(Designed with low clearances, preventing buses from accessing a public beach)* <br>**Side A Prediction**: Overpasses embody class exclusion. Height is fixed; buses *cannot* pass without demolition, enforcing segregation regardless of intent. <br>**Side B Prediction**: Exclusion stems from social decisions (e.g., car-centric policy). If buses became a priority, ramps/tunnels could be added; the overpasses themselves impose no inherent bias. |
  |                  |                               |                                |          | **Case: Adaptive Traffic Signals** <br>*(Municipal system detects buses, extends green lights for them, delaying cars; reprogrammable to favor cars)* <br>**Side A Prediction**: Signals inherently prioritize collective transit. Reprogrammability is irrelevant: the *current design* mandates bus advantage, embedding a public-good ethos. <br>**Side B Prediction**: Signals are neutral tools. Prioritizing buses reflects city policy; reprogramming to favor cars would make them serve a different politics without altering hardware. |
  | **2. Flexibility as Evidence**: <br>Does an artifact’s adaptability defeat claims of inherent politics? | Flexibility does not negate inherent politics. If an artifact’s *default state* channels outcomes toward a specific order (due to cost, inertia, or embedded logic), its politics persists until deliberately contested. Potential repurposing is distinct from actualized neutrality. | Demonstrated flexibility defeats inherent claims. If an artifact can serve opposing ends *without structural change*, its politics resides wholly in use. Inertia or cost of change reflects social factors, not the artifact. | **Does flexibility invalidate inherent politics, or merely contextualize it?** <br>Side A: Flexibility addresses *use*, not the artifact’s *default bias*. <br>Side B: Flexibility proves neutrality by showing intent governs outcomes. | **Case: Mechanized Tomato Harvester** <br>*(Required uniform, tough-skinned tomatoes, favoring large farms; small growers were displaced)* <br>**Side A Prediction**: Harvester inherently industrializes agriculture. Breeding/harvesting constraints lock in economies of scale; retooling for small farms is prohibitively costly, embedding capital bias. <br>**Side B Prediction**: Harvester is a neutral efficiency tool. Displacement resulted from land policies and market forces, not the machine. If cooperatives pooled resources, small farms could use it. |
  |                  |                               |                                |          | **Case: Adaptive Traffic Signals** <br>*(Same as above)* <br>**Side A Prediction**: Default programming advantages buses, embedding pro-transit politics. While reprogrammable, the *status quo* enforces a social choice until altered, making the design non-neutral. <br>**Side B Prediction**: Reprogrammability proves neutrality. Switching priority to cars would take minimal effort, showing outcomes depend solely on operator decisions. |

  ---

  ### Analysis of Disagreements  
  1. **Pattern Across Cases**:  
     - Side A consistently attributes politics to the artifact’s *material constraints* (overpass height, harvester mechanics, signal algorithms).  
     - Side B attributes politics to *human mediation* (policy, maintenance, intent), treating artifacts as passive substrates.  
     - The adaptive traffic signals case elicits identical fault lines to the classics, confirming the divide is methodological, not case-dependent.  

  2. **Verbal vs. Substantive Disagreements**:  
     - **Verbal Disagreement**: The term "politics" is stretched. Side A uses it *descriptively* for material constraints that enforce social orders (e.g., "exclusionary height"). Side B uses it *intentionally* for human choices (e.g., "discriminatory policy"). **This is partly why cases are debated differently: the same evidence is categorized as "artifact" (A) or "context" (B).**  
     - **Substantive Disagreement**: Whether *physical constraints* (e.g., reprogramming costs, demolition requirements) can ever be political *per se* (A) or are merely technical factors awaiting human application (B). This is irreconcilable without shared definitions.  

  ---

  ### Conclusion  
  This collaboration clarifies that our dispute hinges on two non-negotiable premises:  
  - **Side A** sees artifacts as *co-constructors* of social orders, where design constraints enforce politics absent human intervention.  
  - **Side B** sees artifacts as *blank slates*, where all politics originates in human agency.  

  The adaptive traffic signals case confirms this schism: Side A focuses on the *active bias* of the default design, while Side B emphasizes *latent flexibility*. Neither strawmans the other; both accept the burden of proof outlined above. Future work should isolate when "mandate" transitions from material (A) to contextual (B), and rigorously define "politics" to minimize verbal disputes.  

  ---  
  **Signed,**  
  [Side A Proponent] & [Side B Proponent]  
  *Science and Technology Studies Reading Group*
