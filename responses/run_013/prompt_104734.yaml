  We are drafting a joint statement for an adversarial collaboration between two scholars in STS who disagree on whether artifacts can have politics. The statement must be structured as follows:

  1. A numbered section of agreed claims (what both sides concede).
  2. A disagreements table that for each live disagreement:
     a. Formulates each side's position fairly.
     b. Identifies the crux (the point of divergence).
     c. Records a concrete case (both a classic and the invented traffic signal case) that both agree bears on the crux, with each side's advance prediction on how that case should come out.

  The goal is to be fair to both sides, avoid strawmanning, and clarify whether any part of the dispute is verbal (about the meaning of "politics").

  ## Step 1: Agreed Claims (Numbered Section)

  Both sides agree on the following:

  1. **The Social Embeddedness of Technology**: All technologies are developed, deployed, and used within social contexts that influence their design and effects. The politics of technology cannot be understood in isolation from these contexts.

  2. **The Burden of Proof**: 
     - The proponent of inherent politics (let's call them Side A) accepts the burden of showing that a particular design, by its physical or operational characteristics, necessitates or strongly favors a specific social arrangement, such that the design itself (and not just its context) is political.
     - The neutral-instrument proponent (Side B) accepts the burden of showing that the same design can be adapted to serve different social arrangements, and that the apparent political effects are due to the context of use rather than the artifact itself.

  3. **Distinguishing Between Facilitation and Mandate**:
     - Both agree that a technology merely making a social arrangement easier (facilitation) is different from one making it mandatory (enforcement). 
     - They also agree that if a design admits of only one workable social arrangement, then it is not neutral. However, they disagree on how often this occurs and on what counts as "workable."

  4. **Evidence**:
     - Evidence for inherent politics (Side A) must include: (a) the physical or operational constraints of the artifact that limit possible uses, and (b) the historical or empirical demonstration that these constraints lead to specific social outcomes across different contexts.
     - Evidence for neutrality (Side B) must include: (a) cases where the same artifact has been used in different social arrangements, and (b) the absence of physical constraints that would prevent such flexibility.

  5. **The Role of Design Process and Uptake**:
     - Both agree that the design process (including the intentions of designers) and the uptake (how users and institutions deploy the artifact) are important to the politics of technology. However, they disagree on whether the finished artifact, once designed, can be said to have politics independently of its use.

  ## Step 2: Disagreements Table

  We need to identify the live disagreements. The user has suggested two cruxes:

  Crux 1: Whether politics should be predicated of the finished artifact at all or only of the design process and its uptake.

  Crux 2: Whether the demonstrable flexibility of a technology in use defeats a claim of inherent politics or merely fails to address it.

  We will structure the table accordingly. Also, we have two cases:

  - Classic case: We choose the low parkway overpasses (as per the example).
  - Invented case: The adaptive traffic signal system.

  We'll have at least two disagreements, each with a classic and the invented case.

