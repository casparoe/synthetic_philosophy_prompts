  ### Partly Verbal Disagreement

  We acknowledge that part of our disagreement is verbal. Side A uses the term "politics" to include the effects of material constraints that arise from design, even if unintended, while Side B restricts "politics" to the realm of human intentions and social relations. This leads to a substantive disagreement about whether material constraints can be considered political in the same way as human decisions. For Side A, the material constraint is political because it enforces a social outcome; for Side B, it is merely a physical fact that becomes political only when humans use it in a social context.

  ### Conclusion

  Our collaboration has clarified that we agree on the importance of context, the burden of proof, and the distinction between facilitation and mandate. However, we remain divided on whether the finished artifact can bear politics independently of its context and whether flexibility defeats claims of inherent politics. We hope this statement will advance the discussion by separating substantive from verbal disagreements and providing clear test cases.

