prompt: |-
  Last night I spent two hours arguing with a close friend about whether evolutionary explanations of human behavior — mate preferences, xenophobia, religious belief, the whole adaptationist repertoire — deserve to be called science or are just storytelling with a biological vocabulary, and he ended the argument by producing Popper. On his telling, Popper demonstrated that Darwinism is not a testable scientific theory but a metaphysical research programme, because the principle of natural selection collapses into the claim that those who survive are the fit and the fit are those who survive: it excludes nothing, predicts nothing, and therefore cannot be falsified. When I pressed him, he added that Popper later conceded that natural selection can be tested after all, but he says this concession was a late embarrassment and does not undo the original point, which he treats as the settled verdict of philosophy of science on the entire Darwinian enterprise.

  I do not know enough to answer him, and I suspect that the one sentence he keeps repeating is doing several different jobs at once without his noticing. What I want from you is a disambiguation rather than a verdict on evolution. Lay out the distinct precise claims that the assertion that Darwinism is a metaphysical research programme rather than a testable scientific theory could be making, ranging from the near-trivial to the radical. For each reading, say whether it is a platitude, a substantive and defensible thesis, or something actually false, and be explicit about what kind of testability is at issue: the bare principle of natural selection considered on its own; selection taken together with auxiliary assumptions about heredity, variation, and ecology; particular adaptationist hypotheses about particular traits; or the research programme as a whole. Also distinguish readings that concern the logical form of the theory from readings that concern the actual practice of its practitioners and from readings that concern its metaphysical presuppositions, since I think he is sliding among all three.

  Then tell me which of these readings his argument actually needs in order to reach the conclusion he wants, namely that adaptive explanations of human behavior are not science at all; which readings would deliver a much weaker conclusion than he thinks he has; and which readings would, if true, embarrass his position rather than support it — for instance by making metaphysical-research-programme status a feature of every mature science rather than a defect peculiar to Darwinism. He also keeps treating Popper's authority as decisive while waving away Popper's alleged later change of mind, and I would like you to say which readings on your menu would make that combination coherent and which would expose it as picking and choosing. Give me the whole thing as a numbered menu with a one-line verdict on each entry, ordered from the reading that makes the slogan most innocent to the one that makes it most damaging, so that I can take it back to him and see which entry he actually meant.
reasoning: |-
  Hmm, the user presents an intricate philosophical debate about evolutionary biology and Popper's falsificationism. They've had a heated argument with a friend who claims Darwinism is merely a "metaphysical research programme" rather than testable science, primarily citing Popper's early critique about natural selection being tautological. The user wants a nuanced breakdown, not a verdict on evolution itself.

  Key requests stand out: First, disambiguate the phrase "Darwinism is metaphysical not scientific" across multiple dimensions—logical structure, practical application, metaphysical foundations. Second, evaluate each interpretation's plausibility (platitude/defensible/false) and scope (bare principle vs. adaptationist hypotheses). Third, identify which readings actually support the friend's anti-adaptationist conclusion about human behavior explanations. Fourth, expose where the friend might be conflating distinct issues or misusing Popper's authority.

  The friend's core argument hinges on Popper's tautology critique: "survivors are fit because fit are survivors." But this deserves unpacking. At its most basic level, the principle of natural selection alone is indeed untestable—it's a framework, like Newton's laws without specific forces. That's trivial though; no biologist treats it as a testable claim by itself. The real scientific work happens when combined with genetics, ecology, etc., to make predictions about specific traits. For example, we can falsify whether antibiotic resistance evolves predictably under controlled selection pressures.

  Where the friend overreaches is claiming this makes all adaptationist explanations "unscientific." Even if we grant Popper's narrow point about the bare principle (which he later softened), modern evolutionary biology thrives on testable hypotheses. Human behavior studies—like testing whether paternal investment correlates with paternity certainty across cultures—are falsifiable. Calling them "storytelling" ignores actual research practices.

  The user suspects the friend is sliding between: (1) logical concerns about selection's definition, (2) practical testability of specific hypotheses, and (3) metaphysical commitments like materialism. Importantly, Popper himself distinguished evolutionary theory's testability from the untestability of its core principle. His "later embarrassment" wasn't a reversal but a clarification that biologists test using auxiliary assumptions. Dismissing this update seems like cherry-picking.

  A crucial irony: labeling Darwinism "metaphysical" only undermines the friend's stance if he thinks physics is different. But Popper saw all fundamental theories (e.g., Newtonian gravity) as "metaphysical programmes" until concretized. If Darwinism is unscientific for this reason, so is most of science.

  For the menu, I'll structure interpretations from least to most damaging: Start with uncontroversial readings (e.g., bare principle is untestable) and escalate to radical claims (e.g., all adaptationist explanations are unfalsifiable). The friend likely needs reading #7 to condemn human behavior studies, but that's demonstrably false. Readings #1-3 are defensible but don't hurt evolutionary science; #4-5 are true of all science; #6-7 are where his argument crumbles.
answer: |-
  Below is a disambiguation of the claim "Darwinism is a metaphysical research programme rather than a testable scientific theory," structured as a numbered menu from least to most damaging. Each entry clarifies the scope of "Darwinism," the type of testability at issue, and whether the claim concerns logical form, scientific practice, or metaphysical foundations. Verdicts assess plausibility and implications for your friend's argument.

  ---

  ### **The Menu of Interpretations**

  1. **The *bare principle* of natural selection (survival of the fittest) is untestable in isolation because it is tautological.**  
     - **Scope:** Only the core maxim "fit survive; survivors are fit."  
     - **Testability type:** Logical falsifiability (excludes no observable outcome).  
     - **Aspect:** Logical form.  
     - **Verdict:** **Platitude.** True but trivial—no biologist tests the principle alone.  
     - **Friend's argument:** Innocuous. Does not threaten evolutionary science.  

  2. **The *minimal theory* (natural selection + heredity/variation) is untestable without ecological/population specifics.**  
     - **Scope:** Natural selection combined with abstract assumptions about inheritance and mutation.  
     - **Testability type:** Capacity to generate unique predictions without auxiliary hypotheses (e.g., specific environments).  
     - **Aspect:** Logical form.  
     - **Verdict:** **Defensible thesis.** Like Newtonian mechanics without force specifications, it needs concrete add-ons for testing.  
     - **Friend's argument:** Weak. Most scientific theories require auxiliaries to be testable.  

  3. **The *entire Darwinian framework* (selection + genetics + ecology) is empirically testable *in principle* but rarely falsifiable *in practice* due to ad hoc adjustments.**  
     - **Scope:** Evolutionary biology as practiced, with all its tools (e.g., population genetics, phylogenetics).  
     - **Testability type:** Practical falsifiability (resilience to refutation via flexible assumptions).  
     - **Aspect:** Scientific practice.  
     - **Verdict:** **Partially defensible but overstated.** While some adaptationist hypotheses have been modified post-hoc (e.g., "just-so stories"), many are directly tested (e.g., antibiotic resistance evolution).  
     - **Friend's argument:** Overreaching. Fails to acknowledge rigorous experimental tests in modern biology.  

  4. **Darwinism is a *metaphysical programme* because it presupposes naturalism/materialism.**  
     - **Scope:** Foundational commitment to explaining life via natural causes.  
     - **Testability type:** Not applicable—addresses presuppositions, not content.  
     - **Aspect:** Metaphysical foundations.  
     - **Verdict:** **Platitude.** All sciences assume naturalism; this doesn’t impair their testability.  
     - **Friend's argument:** Self-defeating. If this disqualifies Darwinism, it disqualifies all science.  

  5. **Evolutionary theory is a *research programme* (Lakatos) with a "hard core" (natural selection) protected by auxiliary belts.**  
     - **Scope:** The broader enterprise, treating selection as an immutable core.  
     - **Testability type:** Programme-level progress (predictive novelty vs. degenerative ad hoc patches).  
     - **Aspect:** Scientific practice.  
     - **Verdict:** **Defensible thesis** (per Lakatos). But this describes *all* mature sciences (e.g., quantum physics).  
     - **Friend's argument:** Backfires. Framing Darwinism this way affirms its scientific legitimacy.  

  6. ***All adaptationist hypotheses* are unfalsifiable because any trait can be retrofitted as an adaptation.**  
     - **Scope:** Specific claims (e.g., "xenophobia evolved for group competition").  
     - **Testability type:** Risk of post-hoc storytelling without independent constraints.  
     - **Aspect:** Scientific practice.  
     - **Verdict:** **False.** Rigorous methods exist to test adaptations (e.g., comparative phylogenetics, fitness measurements, null models like drift).  
     - **Friend's argument:** Requires this to condemn human behavior studies—but it’s empirically untrue.  

  7. **Darwinism *as applied to human behavior* is inherently untestable due to methodological barriers (e.g., unobservable ancestors, cultural confounding).**  
     - **Scope:** Evolutionary psychology/sociobiology specifically.  
     - **Testability type:** Feasibility of testing in practice (e.g., no fossilized minds, limited experiments).  
     - **Aspect:** Scientific practice.  
     - **Verdict:** **Substantive but exaggerated.** Difficult? Yes. Untestable? No—methods exist (cross-cultural surveys, genetic correlations, physiological measures).  
     - **Friend's argument:** Needs this to target human behavior, but overstates limitations.  

  ---

  ### **Key Implications for Your Friend's Argument**
  - **Readings his argument needs:** \#6 or \#7 to claim adaptive explanations of human behavior are "not science."  
  - **Readings that deliver weak conclusions:** \#1, \#2, \#4, \#5. These either describe all science (\#4, \#5) or don’t challenge actual practice (\#1, \#2).  
  - **Readings that embarrass his position:** \#4 and \#5. If Darwinism is "metaphysical" for assuming naturalism or being a Lakatosian programme, so is physics—making this a virtue, not a flaw.  
  - **Popper coherence:**  
    - His use of early Popper fits \#1 (trivially true) and \#2 (defensible).  
    - Dismissing Popper’s later concession (that selection *with auxiliaries* is testable) is incoherent if he relies on \#3–7, as Popper clarified that the *theory* (not the bare principle) is scientific. This is cherry-picking.  

  ---

  ### **Conclusion for Your Debate**
  Your friend likely conflates \#1 (tautology of the bare principle) with \#6/7 (untestability of adaptationist hypotheses). But \#1 is trivial, while \#6/7 are empirically false. His dismissal of Popper’s later views is defensible only if he holds strictly to \#1—but that cannot condemn evolutionary science, which operates at the level of \#3 and \#5. If he retreats to \#4 (naturalism), he indicts all science.  

  **Recommended counter:** Focus on the *testability of specific hypotheses* (e.g., "Does paternal investment correlate with certainty of paternity across mammals?"). If he denies such tests are possible, demand his alternative epistemology for science.
