answer: |-
  Below is a structured critique of eternalism and the Rietdijk-Putnam (R-P) argument, ranked by severity and separated into your two questions. I address your variant argument and conclude with an assessment of eternalism’s defensibility.

  ---

  ### **I. The Position: What Counts Against Eternalism?**
  Eternalism is false if **presentism** (only present events exist) or the **growing block** (past/present exist) is true. For this to be plausible, one of the following must hold:

  1. **A Privileged Foliation (Rank: Plausible but Unsupported)**  
     If physics revealed a *fundamental foliation* (e.g., via quantum gravity or a preferred rest frame), presentism could be revived. While relativity currently rejects this, theories like Bohmian mechanics or some quantum gravity models (e.g., Horava-Lifshitz gravity) allow it. **Plausible with future physics**, but not currently favored.

  2. **Tense as Metaphysically Primitive (Rank: Philosophically Defensible but Speculative)**  
     If tense logic or A-theory properties (e.g., *becoming*) are irreducible, eternalism’s "block" fails. Physics alone can’t falsify this, but if causation requires dynamic time (e.g., Maudlin’s "passage"), eternalism struggles. **Possible, but requires non-physical arguments**.

  3. **Empirical Predictions (Rank: Defect of Eternalism)**  
     Eternalism predicts *nothing* its rivals cannot accommodate. It is a framework for interpreting physics, not a testable theory. Rivals can adopt "ersatz" presentism (e.g., symbolic tenses) or hybrid models. This **lack of empirical content is a vulnerability**: it risks being unfalsifiable *by design*.

  **Verdict**: Eternalism’s unfalsifiability is a **defect** for those seeking a metaphysically responsive theory, but expected for a framework thesis. Its survival hinges on *no privileged foliation* and *no irreducible tense*—both contingent and revisable.

  ---

  ### **II. The Argument: Critiques of the Rietdijk-Putnam Inference**
  Granting relativity’s relativity of simultaneity, the inference "simultaneity → co-reality → eternalism" is attacked at these steps (ranked by severity):

  1. **Equivocation on "Reality" (Fatal)**  
     The argument conflates *real-in-a-frame* (relational) with *metaphysically real* (absolute). Relativity gives no frame-independent "now," but this doesn’t entail *all events exist simpliciter*. A presentist could argue reality is frame-relative (e.g., "real for observer O"), blocking eternalism. **Most exposed flaw**.

  2. **Conventionality of Simultaneity (Fatal if True)**  
     If simultaneity is conventional (Reichenbach), not physical, the premise "event B is simultaneous with A in frame F" lacks ontological weight. The inference then builds eternalism on a *choice*, not a discovery. **Undermines the premise’s metaphysical force**.

  3. **Causal Becoming as Alternative (Awkward)**  
     A "local becoming" defined by causal connectibility (e.g., past light cone) avoids simultaneity slices. But if becoming is just *causal relation ordering*, it reduces to eternalism with a temporal metric (e.g., "real" = causally accessible). **Not a genuine alternative; redescribes the block**.

  4. **Denying Privilege ≠ Accepting Eternalism (Awkward)**  
     One can reject a *global* present but retain *local* temporal facts (e.g., "present for x"). This compatibilism (e.g., Fine’s "fragmentalism") accepts relativity’s lessons but avoids a block universe. **Possible, but ontologically murky**.

  **Variant Argument (Spacelike Separation)**  
  Replacing simultaneity with spacelike separation *fails*. Spacelike events are still defined relative to a frame’s simultaneity hyperplane. To say "e₁ is spacelike to e₂" presupposes a foliation. Worse, it implies a *negative present* ("all events not causally connectible to me now"), reintroducing a frame-dependent "now." **Conclusion collapses into the original argument’s flaws**.

  ---

  ### **III. Objections: What Eternalists Concede vs. Reject**
  - **Conceded**:  
    - Eternalism lacks unique empirical predictions.  
    - The R-P argument requires careful disambiguation of "real."  
    - Spacelike substitution doesn’t resolve core issues.  
  - **Dismissed (as Question-Begging)**:  
    - "Tensed facts are primitive" (assumes A-theory).  
    - "Becoming is fundamental" (denies eternalism’s premise).  
    - "Relativity needs a dynamic interpretation" (rejects block ontology).

  **Verdict on Eternalism’s Defensibility**:  
  Eternalism has been **qualified into near-unfalsifiability**. It absorbs objections by reinterpreting "existence" (e.g., timelessly or indexically) or invoking supervenience on physics. This is **both a problem and a sign of a badly posed question**:  
  - **Problem**: It risks vacuity (e.g., "all events exist" becomes tautological).  
  - **Badly Posed**: The debate conflates physics (spacetime structure) with metaphysics (modes of existence). Eternalism thrives where physics is silent, making it resilient but detached.

  ---

  ### **Final Ranking of Objections**  
  | Objection                          | Severity       |  
  |------------------------------------|----------------|  
  | Equivocation on "reality"          | Fatal          |  
  | Conventionality of simultaneity    | Fatal          |  
  | Spacelike substitution failure     | Fatal          |  
  | Lack of empirical predictions      | Major Defect   |  
  | Fragmentalist alternatives         | Awkward        |  
  | Local becoming as redescription    | Minor          |  

  Eternalism remains defensible only if one accepts that metaphysics transcends empirical revision—a stance your career reflects. The R-P argument, however, is weaker than you suggest; its inferential leap remains its Achilles’ heel. A physics-privileged foliation (e.g., from quantum gravity) could force a retreat to "qualified eternalism," but the core metaphysical commitment would likely persist.
