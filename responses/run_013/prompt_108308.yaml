  Our decision-theory reading group has spent a term on the coherence arguments and reached a standstill I can't interpret. The question is whether the money-pump and Dutch-book arguments establish that a rational agent must have complete, transitive preferences and maximize expected utility. The pro-axiom side says an agent with a cycle (A ≻ B ≻ C ≻ A) can be walked around it by a bookmaker at a small cost per step until it holds strictly less than it began with and has gained nothing it prefers, and that no rational agent may be exploitable in that way. The anti-axiom side replies that a foresighted agent with the same cycle need never take the first step, that the pump therefore shows only that agents who assess each trade in isolation and cannot commit are exploitable, and that vulnerability to a pump is a fact about the trading environment rather than a defect in the ordering. Both sides accept the mechanics of the pump and the same cases, and neither moves. The standoff recurs in an even sharper form over completeness, where the pump must run through a slight sweetening that the incompleteness side says simply begs the question by treating incompleteness as indifference. My hypothesis is that the argument for credences and the argument for preferences are being carried under the single word 'coherence', and that the synchronic Dutch book is doing work the diachronic money pump cannot do — but I want that assessed, not assumed. So diagnose the impasse: is it verbal, a fight over 'rational' and 'coherent'; is it two arguments under one heading; is it a disagreement about standards of evidence, i.e. about what counts as a demonstration that an agent is irrational; or is there a hidden formal question — say, whether bounded exploitability, or exploitability only under commitment failure, suffices — that a theorem could settle? Say what each side is actually committed to, give your best diagnosis with reasons, and say what would count as progress: a distinction, a 