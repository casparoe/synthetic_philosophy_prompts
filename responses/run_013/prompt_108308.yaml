  Alternatively, if we must pick one, the main issue is that the two sides are talking about two different arguments (one synchronic and one diachronic) without distinguishing them, so the dispute arises because they are answering two different questions. Hence, **different-questions** is the core. But the standards of evidence are also at play.

  However, the user's hypothesis is that the two are being carried under the same word, so the conflation is central. Therefore, I will go with:

  \answer{different-questions}

