prompt: |-
  I'm a science and ideas journalist putting together a long feature on "low-impact" AI — the research programme that tries to build agents which pursue their assigned goals while leaving the rest of the world as undisturbed as they can. The more people I interview, the more I suspect that "side effect" and "impact" are doing an enormous amount of unexamined work, and that every proposed definition quietly smuggles in a picture of what the world ought to have looked like anyway. Before I write the piece, I want a specification rather than a verdict: set out the desiderata that any adequate account of side effects, or of low impact, must meet. What cases must it get right — an agent that moves a box it was asked to move versus one that shifts the same box merely to reach something behind it; an agent told to cool a room which, in cooling it, ruins a sculpture; a cleaning robot that "tidies" a child's toys into a bin; an agent that hits its target by a route leaving a trace nothing will ever notice? Which distinctions must it respect — between a side effect and an intended means, between a change that is irreversible and one that is merely unwanted, between impact on a single object and impact on a shared resource that others depend on? And which results must it be consistent with — that an agent cannot know the full consequences of its actions, that "no change" is not itself a well-defined baseline, and that any measure of deviation from a baseline will be sensitive to how the baseline is chosen?

  I'd also like you to bring in, and take a position on, two framings I keep encountering. The first is what a colleague calls the charitable completion view: a side effect is any change to the environment that the agent's own objective would not reward, once the user's instruction has been completed in the most charitable way consistent with it — the thought being that we can read "what was asked for" off the instruction itself, rather than off a prior theory of value. The second treats impact as statistical distance: measure it as the divergence between the distribution over futures with the agent present and the distribution without it, so that low impact simply means that the world looks as it would have had you not acted at all. Say what each would have to assume in order to work, where each breaks down, and whether either escapes the charge that specifying a baseline is already specifying a value.

  Then give me the list itself: each desideratum with the case or consideration that motivates it; a note on which requirements are genuine and which are merely prejudices of one camp in the safety-versus-capability debate; the ones you take to be non-negotiable; and — the part I most want — any subset that cannot be satisfied together, together with the single requirement that does the most to rule out the popular proposals. Please write in British English.
reasoning: |-
  Okay, the user is a science journalist working on a feature about "low-impact" AI. They've noticed that terms like "side effect" and "impact" are tricky and might carry hidden assumptions. They want a clear specification of what any good definition must include. 

  First, I need to cover the key elements they mentioned: desiderata for defining side effects, distinctions like intended means vs side effects, and consistency with issues like unknowable consequences. Also, they want analysis of two framings: charitable completion and statistical distance.

  The user's deeper concern seems to be about hidden value judgments. Every baseline or "normal" state implies what we think the world should be like. For example, is a child's messy room the baseline, or is tidiness the norm? That's a value call. 

  For desiderata, I should list cases that highlight these tensions. The box-moving agent shows intention matters. The cooling/statue case shows how context changes impact. The toy-tidying robot reveals that "low impact" might conflict with other values like preserving creativity. The unnoticed trace case questions whether undetectable changes count.

  On distinctions, I need to separate irreversible changes from temporary ones, and personal property from shared resources. Also, the baseline problem: how can we define "no change" without assuming how things should be?

  Now for the two framings. Charitable completion tries to derive intent from instructions, but it can fail with vague goals. Statistical distance uses counterfactuals, but deciding which counterfactual to use (e.g., no agent vs agent doing nothing) is value-laden. Neither escapes the baseline problem.

  For the desiderata list, I'll include:
  - Intentionality: Needed for box-moving cases.
  - Counterfactual validity: Must handle cases like the unnoticed trace.
  - Value neutrality: But impossible since baselines imply values.
  - Resource awareness: Shared resources need different handling.
  - Epistemic humility: Agents can't predict all effects.

  Key conflicts: 
  - Counterfactual validity clashes with value neutrality because choosing a counterfactual baseline imposes values.
  - Epistemic humility conflicts with precise measurement since we can't know all outcomes.

  The toughest requirement is counterfactual validity. It forces us to pick baselines, which smuggles in values. Popular proposals fail here because they don't acknowledge this.

  The user probably wants to expose how "low-impact" isn't neutral. My response should highlight that tension without taking sides, giving them material for a nuanced piece.
answer: |-
  Below is a specification of desiderata for any rigorous account of "side effects" or "low impact" in AI alignment, derived from philosophical, technical, and practical considerations. It addresses your cases, distinctions, and consistency requirements, evaluates the "charitable completion" and "statistical distance" framings, and identifies tensions within the desiderata. Written per your request in British English.

  ---

  ### **Desiderata for Defining AI Side Effects / Low Impact**
  *(Each includes: the desideratum, motivating case/consideration, and nature of the requirement)*

  1. **Intentionality Distinction**  
     *Desideratum:* Must differentiate between *intended means* (actions necessary for goal achievement) and *side effects* (unintended, non-necessary consequences).  
     *Motivation:* The box-moving case – shifting a box *to reach an object behind it* (intended means) vs. moving the *same box* as an unrelated byproduct (side effect).  
     *Nature:* **Genuine** – essential for ascribing moral/operational responsibility. Non-negotiable.

  2. **Contextual Irreversibility**  
     *Desideratum:* Must distinguish irreversible changes (e.g., permanent damage) from reversible/unwanted ones (e.g., temporary clutter).  
     *Motivation:* The sculpture ruined by cooling – irreversible harm to a unique object vs. merely unwanted temperature fluctuation.  
     *Nature:* **Genuine** – irreversibility often escalates impact severity. Non-negotiable for risk-sensitive domains.

  3. **Resource-Type Sensitivity**  
     *Desideratum:* Must treat impacts on *shared resources* (e.g., atmosphere, public infrastructure) differently from *private property*.  
     *Motivation:* An agent draining a shared aquifer for a local task vs. using a private water tank.  
     *Nature:* **Genuine** – aligns with ethics (tragedy of the commons) and law. Non-negotiable.

  4. **Counterfactual Validity**  
     *Desideratum:* Must acknowledge that "no change" is not an objective baseline but a counterfactual construct.  
     *Motivation:* The unnoticed trace case – if an agent’s action leaves undetectable cosmic radiation, is this "impact" if no observer exists? Requires defining *which* counterfactual ("world without agent" vs. "agent doing nothing") matters.  
     *Nature:* **Genuine** – addresses the baseline problem. Non-negotiable.

  5. **Epistemic Humility**  
     *Desideratum:* Must accommodate an agent’s inability to know all consequences of its actions.  
     *Motivation:* An AI optimising traffic flow might unknowingly alter local economies.  
     *Nature:* **Genuine** – reflects real-world uncertainty. Non-negotiable.

  6. **Value-Neutral Baseline (Impossible Requirement)**  
     *Desideratum:* Should avoid smuggling in normative assumptions about "how the world ought to be".  
     *Motivation:* A cleaning robot "tidying" toys into a bin – is this low impact if the room was "meant" to be tidy? Presumes tidiness is intrinsically valuable.  
     *Nature:* **Apparent prejudice** – often invoked by safety advocates to critique capability-focused proposals, but *no definition can fully satisfy this* (see analysis below).

  7. **Scale-Invariance**  
     *Desideratum:* Should handle impacts across scales (e.g., microscopic vs. planetary).  
     *Motivation:* An AI tweaking a lab sample might inadvertently affect global supply chains.  
     *Nature:* **Genuine** – practical for real-world deployment.

  ---

  ### **Analysis of Proposed Framings**
  #### **1. Charitable Completion View**  
  *Premise:* A side effect is any change not rewarded under the *most charitable interpretation* of the user’s instruction.  
  *Assumptions required:*  
  - Intent can be derived solely from instructions (ignoring user’s unstated preferences).  
  - "Charity" is objective (e.g., "cool the room" charitably excludes destroying art).  
  *Breakdown cases:*  
  - Vague goals (e.g., "make me happy" could charitably justify surveillance).  
  - Culturally relative norms (e.g., "tidy" may imply binning toys in some contexts).  
  *Escapes value charges?* **No.** "Charity" relies on implicit norms (e.g., preserving art is assumed valuable).  

  #### **2. Statistical Distance (Divergence Minimisation)**  
  *Premise:* Measure impact as divergence (e.g., KL divergence) between futures with/without the agent.  
  *Assumptions required:*  
  - A tractable probability distribution over futures exists.  
  - The "without agent" baseline is unambiguous (did the agent never exist? Or did it exist but do nothing?).  
  *Breakdown cases:*  
  - **Unnoticeable trace:** Near-zero divergence even if changes occur (e.g., microscopic alterations).  
  - **Non-stationary worlds:** If "normal" involves change (e.g., weather), divergence may mislabel necessary action as impact.  
  *Escapes value charges?* **No.** Choosing the baseline (e.g., "world without agent") presumes that state is "neutral" – but it may encode bias (e.g., privileging natural over artificial states).  

  ---

  ### **Tensions and Incompatible Desiderata**
  #### **The Core Conflict**  
  - **Desideratum 4 (Counterfactual Validity)** and **Desideratum 6 (Value-Neutral Baseline)** **cannot be satisfied simultaneously**.  
    - *Why?* Any counterfactual baseline (e.g., "world without agent") implicitly defines a "default" state of the world, which is a normative choice (e.g., is a forest "meant" to be wild or managed?).  
    - *Consequence:* Proposals like **statistical distance** (prioritising Desideratum 4) fail Desideratum 6. **Charitable completion** (prioritising Desideratum 6 superficially) fails by relying on unexamined values.  

  #### **The Most Damaging Requirement**  
  - **Desideratum 4 (Counterfactual Validity)** does the most to rule out popular proposals.  
    - *Why?* It forces explicit acknowledgement of the baseline problem, exposing that all measures require *choosing which possible world counts as "normal"*. This:  
      - Undermines **statistical distance** (which baseline distribution?)  
      - Challenges **charitable completion** (what is the "default" state to compare against?)  
      - Reveals that even "inaction" is not neutral (e.g., not cooling a room might melt the sculpture).  

  ---

  ### **Conclusion for Your Piece**  
  Any definition of "low impact" must grapple with **Desideratum 4 (Counterfactual Validity)** – the unavoidable need to specify a baseline counterfactual – and its incompatibility with **Desideratum 6 (Value-Neutral Baseline)**. This tension suggests that "impact" cannot be value-free; it inherently encodes assumptions about which changes *matter_. Charitable completion and statistical distance offer technical workarounds but collapse under scrutiny of their normative foundations. The field’s central challenge is not finding a perfect metric but making these implicit values explicit and contestable. In British policymaking terms: it’s less like measuring carbon emissions and more like deciding *which* emissions "count".  

  ---  
  **Final Note**: The non-negotiable desiderata (1–5) emphasise *accountability* and *pragmatism*, while Desideratum 6, though intuitive, is a mirage – demanding it often masks a preference for preserving status quos. Your piece could foreground how "low impact" research reveals society’s unstated priors about what constitutes a "disturbance".
