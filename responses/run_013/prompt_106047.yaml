  Below is the edge classification procedure designed for your curators. It's structured as a step-by-step checklist, optimized for clarity and efficiency, with each step designed to take 2-5 minutes. The procedure enforces well-foundedness by leveraging pre-marked base-layer nodes (resolving team disputes via external governance) and explicitly blocks "explanatory need" justification. Tests are ordered to prioritize unambiguous cases first, with clear exit conditions.

  ---

  ### **Edge Classification Procedure**  
  **For curators adding edges between nodes A (source) and B (target)**  
  *Time limit: 20 minutes/edge. No internet. Flag if stuck.  
  Review only flagged edges. Base-layer status is pre-marked (do not override).*  

  #### **Step 0: Base-Layer Check**  
  - **Question:** *Is the **target node B** marked as "base-layer"?*  
  - **Sufficient answer:**  
    - **Yes** → Assign **CORRELATES**. **Stop.**  
    - **No** → Proceed to Step 1.  
  - **Why?** Base-layer nodes (e.g., "GRCh38 reference genome," "patient entity") must have no dependencies. Only CORRELATES is allowed for edges *to* B if B is base-layer.  
  - **Adjudication note:** Curators **do not decide** base-layer status. It is pre-defined by governance. If unmarked, assume not base-layer.  

  #### **Step 1: Causality Test (CAUSES)**  
  - **Question:** *If A were **removed or prevented**, would B **not occur** or become **significantly less likely**? (Ignore whether A is evidence for B or part of B.)*  
  - **Sufficient answers:**  
    - **Yes** → Assign **CAUSES**. **Stop.**  
    - **No** → Proceed to Step 2.  
    - **Unsure/External** → Flag for review. **Stop.**  
  - **Stop conditions:**  
    - Assign CAUSES if A is a *driver* of B (e.g., variant → disease, smoking → lung cancer).  
    - Refuse if answer hinges on "we need this to explain B" (invalid justification).  

  #### **Step 2: Constitution Test (CONSTITUTES)**  
  - **Question:** *Is B **defined by or composed of** A? Specifically: If A **did not exist**, would B **cease to be a coherent entity**?*  
  - **Sufficient answers:**  
    - **Yes** → Assign **CONSTITUTES**. **Stop.**  
    - **No** → Proceed to Step 3.  
    - **Unsure/External** → Flag for review. **Stop.**  
  - **Stop conditions:**  
    - Assign CONSTITUTES if A is a *necessary component* of B (e.g., symptom cluster → syndrome, sodium level → hyponatremia).  
    - Refuse if A is merely correlated or indirectly causal.  

  #### **Step 3: Evidential Test (GROUNDS)**  
  - **Question:** *Does A **directly support the inference** of B, **without** being part of B or causing B?*  
  - **Sufficient answers:**  
    - **Yes** → Assign **GROUNDS**. **Stop.**  
    - **No** → Proceed to Step 4.  
    - **Unsure/External** → Flag for review. **Stop.**  
  - **Stop conditions:**  
    - Assign GROUNDS if A is *evidence* for B (e.g., lab value → diagnosis, biopsy result → tumor type).  
    - **Critical disarming:** Explicitly reject "we need this edge to explain B" as grounds. Only real-world inference counts.  

  #### **Step 4: Association Test (CORRELATES)**  
  - **Question:** *Are A and B **statistically linked** in our data, with **no clear causal, constitutive, or evidential relationship**?*  
  - **Sufficient answers:**  
    - **Yes** → Assign **CORRELATES**. **Stop.**  
    - **No** → Flag for review. **Stop.**  
  - **Stop conditions:**  
    - Assign CORRELATES if A and B co-occur but lack dependency (e.g., seasonal pollen counts → allergy-related ER visits).  
    - Refuse if all prior tests were "no" *and* no association exists (edge may be invalid).  

  ---

  ### **Procedure Execution on Three Edges**  
  *Assumptions:* Base-layer = genes (pre-marked). Nodes: `VUS:p.Arg97Ter` (variant), `Disease:CardioMyopathy` (disease), `Symptom:VentricularArrythmia` (symptom), `SDOH:FoodInsecurity` (social determinant), `Lab:BNP` (biomarker).  

  1. **Edge: `VUS:p.Arg97Ter` → `Disease:CardioMyopathy`**  
     - Step 0: Target (disease) not base-layer → Proceed.  
     - Step 1: Removing variant prevents cardiomyopathy? **Yes** → Assign **CAUSES**.  
     - *Verdict:* **CAUSES** (uncontroversial).  

  2. **Edge: `SDOH:FoodInsecurity` → `Disease:CardioMyopathy`**  
     - Step 0: Target (disease) not base-layer → Proceed.  
     - Step 1: Does preventing food insecurity stop cardiomyopathy? **No** (it reduces risk but isn’t sufficient cause) → Proceed.  
     - Step 2: Is cardiomyopathy *composed of* food insecurity? **No** → Proceed.  
     - Step 3: Does food insecurity directly *ground* cardiomyopathy? **No** (it correlates with risks but isn’t diagnostic) → Proceed.  
     - Step 4: Are they associated? **Yes** → Assign **CORRELATES**.  
     - *Verdict:* **CORRELATES** (team may dislike this, as they often argue social determinants "cause" disease, but causality requires direct mechanistic necessity; this meets correlation criteria only).  

  3. **Edge: `Lab:BNP` → `Disease:CardioMyopathy`**  
     - Step 0: Target (disease) not base-layer → Proceed.  
     - Step 1: Does preventing elevated BNP stop cardiomyopathy? **No** (BNP is a biomarker, not a cause) → Proceed.  
     - Step 2: Is cardiomyopathy *composed of* BNP? **No** → Proceed.  
     - Step 3: Does elevated BNP directly support inferring cardiomyopathy? **Yes** → Assign **GROUNDS**.  
     - *Verdict:* **GROUNDS** (uncontroversial but illustrates the test’s precision).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve base-layer disputes:** It defers to pre-marked status. If the team disagrees on what is base-layer (genes vs. patients), this must be resolved *outside* the procedure by governance.  
  2. **Handle symmetric dependencies:** For coextensive predicates (e.g., `Phenotype:TallStature` ↔ `Gene:FBN1`), the procedure assigns directionally (e.g., if A→B is CONSTITUTES, B→A may be CAUSES), risking cycles. Automated cycle checks are required post-classification.  
  3. **Eliminate judgment calls disguised as tests:**  
     - Step 1 (Causality) requires counterfactual reasoning (e.g., "would B not occur?"), which can be subjective for multifactorial outcomes.  
     - Step 3 (Grounds) conflates *epistemic* (evidence) and *ontic* (causal) dependencies, leaving ambiguity in cases like "smoking → lung cancer" (is a biomarker CAUSES or GROUNDS?).  
     - Step 2 (Constitution) assumes clear part-whole boundaries, which blur for abstract entities (e.g., is "social isolation" part of "depression" or correlated?).  
  4. **Cover all metaphysical nuances:** It fails for:  
     - "Necessary coextension" (e.g., if A and B always co-occur but dependency direction is unclear, it defaults to CORRELATES).  
     - Non-binary dependencies (e.g., A both causes *and* grounds B).  

  ### **Final Notes**  
  - **Judgment-heavy steps:** Steps 1–3 are metaphysical judgments in a lab coat. They work best for clear-cut biomedical relationships but falter in social or probabilistic contexts.  
  - **Defensive design:** By rejecting "explanatory need" in Step 3 and enforcing base-layer immutability, it minimizes curator overreach.  
  - **Efficiency:** With practice, curators will spend <5 minutes on Steps 0–1 for 80% of edges (e.g., gene→disease), reserving time for hard cases.  
  - **Validation:** Pilot with your contentious cases (e.g., variant→disease = CAUSES; symptom→syndrome = CONSTITUTES) to refine ambiguities.  

  This procedure balances ontological rigor with operational pragmatism. It won’t make metaphysicians of your curators, but it will ship a tractable graph.
