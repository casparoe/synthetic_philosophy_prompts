prompt: |-
  I have spent an unreasonable amount of time in rationalist decision-theory threads, and I keep watching the same move. Someone proposes a non-expected-utility rule — most recently risk-weighted expected utility, in which the agent's attitude toward risk is represented by a transformation of cumulative probabilities rather than being absorbed into the curvature of the utility function — and a commenter replies, in effect, that rationality just is maximizing expected utility, as though that settles the matter. I want to know what that sentence could actually be claiming. Lay out the distinct precise theses it might express, ordered from the nearly trivial to the radical, and for each say whether it is a platitude, a substantive and defensible claim, or simply false. In particular, distinguish readings on which expected utility maximization is a definition of rationality, a representation theorem conditional on axioms, a normative requirement, a descriptive generalization, a claim about the proper objects of utility, and a claim about where risk attitudes must be located in the representation. Note which readings are equivalent, which entail which, and which are compatible with risk-weighted expected utility. Then tell me which of those readings would actually support dismissing risk-weighted expected utility, and which would leave it untouched or even presuppose it. I am not looking for a general defense of expected utility theory, nor for a reading list; I want the menu of readings, with verdicts, so I can see which one the commenter must have in mind and whether that reading earns the dismissal.
reasoning: |-
  Okay, the user has spent a lot of time in rationalist decision-theory threads and keeps seeing the same argument: someone proposes a non-expected-utility rule like risk-weighted expected utility (RWEU), and a commenter dismisses it by saying "rationality just is maximizing expected utility." The user wants to understand what that dismissal could actually mean. They want a breakdown of all possible interpretations of that statement, ordered from trivial to radical, with evaluations of each and how they relate to RWEU.

  First, I need to recall what RWEU is. Risk-weighted expected utility modifies expected utility by applying a weighting function to cumulative probabilities, allowing different risk attitudes without changing the utility function. So it's an alternative model that still uses probabilities and utilities but weights them differently.

  The user is asking for a taxonomy of interpretations of "rationality is EU maximization." They want distinct theses, categorized by type (definition, representation theorem, normative, etc.), and for each, whether it's trivial, defensible, or false. Also, how each relates to RWEU—whether it dismisses it or not. The user is clearly frustrated with the superficial dismissals and wants a rigorous framework to evaluate such claims.

  I start brainstorming possible interpretations. The most trivial one is that EU maximization is a definition—this would be circular and not substantive. Then there's the representation theorem view, which is conditional on axioms; this doesn't dismiss RWEU if it satisfies similar axioms. Normative claims could vary: weak normativity might allow alternatives, while strong normativity would reject them. Descriptive claims might be false empirically. Objections about utility's domain or risk attitudes' location are more technical but important for understanding the debate.

  The user mentions specific categories: definition, representation theorem, normative requirement, descriptive generalization, utility objects, and risk attitude location. I need to cover all these. Also, ordering from trivial to radical helps structure the answer—starting with least controversial, building up to bold claims.

  For each thesis, I assess its status (platitude, defensible, false) and compatibility with RWEU. For example, the representation theorem is defensible but conditional; it doesn't inherently dismiss RWEU, which has its own representation theorems. The strong normative claim that EU axioms are necessary for rationality is more contentious and would dismiss RWEU if it violates them—but that's debatable. The risk attitude location claim (must be in utility, not probabilities) is a common argument but may not hold water upon scrutiny.

  I need to ensure clarity on how RWEU fits into each category. RWEU is still EU-like but with weighted probabilities, so it shares foundations but differs in handling risk. Some interpretations might inadvertently support it (like the representation view), while others directly oppose it.

  The user's deeper need seems to be arming themselves against dismissive arguments. They want a toolkit to dissect and counter "rationality just is EU" claims. By providing this menu, they can pinpoint which version a commenter is using and whether it's valid. The frustration suggests they seek not just information but empowerment in these debates.

  Finally, I summarize which readings actually dismiss RWEU: mainly the strong normative, descriptive, and location claims. But these are the weaker arguments! The user might find irony here—the dismissive move often relies on indefensible interpretations. Highlighting this could be satisfying for them.
answer: |-
  Here is a taxonomy of interpretations for "rationality just is maximizing expected utility" (EU), ordered from trivial/weak to radical/strong, with their status, relationship to Risk-Weighted Expected Utility (RWEU), and implications for dismissal:

  1.  **Definitional Triviality (Rationality = EU Maximization)**
      *   **Thesis:** "Rationality" is *defined* as the property of choosing options with the highest expected utility. This is a stipulative definition.
      *   **Type:** Definition of Rationality.
      *   **Status:** **Platitude** (if intended as definitional), but **Trivially True & Empty**. It provides no substantive content to "rationality" beyond the label. Equivalent to saying "The thing defined by EU maximization is the thing defined by EU maximization."
      *   **Compatibility with RWEU:** Irrelevant. RWEU simply wouldn't be called "rationality" under this definition, by fiat. Doesn't engage with RWEU's merits.
      *   **Dismisses RWEU?:** **No.** It merely redefines "rationality" to exclude RWEU *a priori*. This is a semantic evasion, not a substantive argument. RWEU proponents would reject the definition.

  2.  **Representation Theorem (Conditional Rationality)**
      *   **Thesis:** *If* an agent's preferences satisfy certain axioms (Completeness, Transitivity, Continuity, Independence), *then* their preferences can be *represented as* maximizing the expected value of some utility function. EU maximization is the *mathematical representation* of coherent preferences under these axioms.
      *   **Type:** Representation Theorem (Conditional on Axioms).
      *   **Status:** **Defensible and Mathematically True** (for the standard Savage/vNM frameworks). A core achievement of decision theory.
      *   **Compatibility with RWEU:** **Directly Compatible.** RWEU (with appropriate weighting functions) satisfies *different* sets of axioms (e.g., relaxing Independence) and thus yields a *different* representation theorem. Both are valid representations of coherent preferences under *their respective* axiom sets.
      *   **Dismisses RWEU?:** **No.** This reading *presupposes* that rationality requires satisfying the *specific* EU axioms (especially Independence). The dismissal relies on asserting that *those specific axioms are constitutive of rationality*, which this thesis *does not do* by itself. It merely states the conditional link.

  3.  **Weak Normative Requirement (EU as a *Possible* Rational Standard)**
      *   **Thesis:** Maximizing EU is *one rational way* to make decisions under uncertainty, satisfying basic coherence requirements. It's a sufficient condition for rationality.
      *   **Type:** Normative Requirement (Weak).
      *   **Status:** **Defensible.** EU provides a powerful, coherent, and widely applicable framework.
      *   **Compatibility with RWEU:** **Compatible.** This thesis doesn't claim EU is the *only* rational way. RWEU can also be argued to be a rational standard satisfying different (or overlapping) coherence requirements.
      *   **Dismisses RWEU?:** **No.** This is pluralistic; it leaves room for other rational rules.

  4.  **Strong Normative Requirement (EU Axioms = Rationality)**
      *   **Thesis:** Rationality *requires* that preferences satisfy the specific axioms (especially Independence) underlying the EU representation theorems. Therefore, rationality *requires* EU maximization. Violating these axioms is inherently irrational. This is the core normative claim.
      *   **Type:** Normative Requirement (Strong).
      *   **Status:** **Substantive, Contested, but Defensible by Proponents.** Proponents argue these axioms capture essential features of instrumental rationality (e.g., consistent choice across probabilistic mixtures).
      *   **Compatibility with RWEU:** **Incompatible.** RWEU typically violates the Independence Axiom (or its analogues like Betweenness). If this strong normative thesis is true, RWEU preferences are irrational.
      *   **Dismisses RWEU?:** **Yes.** This is the primary reading that *directly and substantively* supports dismissing RWEU *as irrational*. The dismissal relies on the claim that violating EU axioms is definitionally irrational. Critics argue the axioms (especially Independence) are not universally compelling normative requirements.

  5.  **Descriptive Generalization (Rational Agents *De Facto* Maximize EU)**
      *   **Thesis:** As an empirical matter, genuinely rational agents (or idealized agents) *do* maximize expected utility. EU describes how rational agents actually behave.
      *   **Type:** Descriptive Generalization.
      *   **Status:** **Likely False** as a universal empirical claim. Extensive evidence (Allais Paradox, Ellsberg Paradox, framing effects, real-world risk behavior) shows systematic deviations from EU predictions, even by sophisticated agents. Highly questionable even as an idealization given challenges like Pascal's Mugging.
      *   **Compatibility with RWEU:** **Incompatible** if claiming EU is the *only* descriptive model of rational agents. RWEU is explicitly proposed as a better descriptive (and potentially normative) model for certain behaviors.
      *   **Dismisses RWEU?:** **Implied Yes, but Falsely.** If interpreted literally as claiming EU is the *only* way rational agents act, it dismisses RWEU, but this claim lacks empirical support. RWEU is offered precisely because EU descriptively fails.

  6.  **Utility Domain Claim (Utility Captures *All* Value)**
      *   **Thesis:** The utility function in EU theory *must* incorporate all aspects of value relevant to the agent, including their intrinsic attitude towards risk. There is no separate "risk attitude" parameter; risk aversion must be modeled *solely* as diminishing marginal utility of wealth/outcomes.
      *   **Type:** Claim about the Proper Objects/Scope of Utility.
      *   **Status:** **Substantive and Contested.** Defended by strict EU proponents arguing that risk attitude isn't separable from outcome valuation. Challenged by others arguing that the *source* or *nature* of uncertainty (beyond just probabilities and outcomes) matters intrinsically.
      *   **Compatibility with RWEU:** **Incompatible.** RWEU explicitly separates risk attitude (captured by the weighting function) from outcome valuation (captured by the utility function).
      *   **Dismisses RWEU?:** **Yes.** This reading dismisses RWEU by *fiat*, declaring its separation of risk attitude from utility as illegitimate or conceptually confused. It argues risk attitude *must* be bundled into the curvature of `u(x)`. RWEU proponents reject this bundling as descriptively and normatively inadequate.

  7.  **Risk Attitude Location Claim (Risk Attitudes *Must* Be in Utility Curvature)**
      *   **Thesis:** The *only* rational or coherent way to represent attitudes towards risk is through the curvature of the utility function over final outcomes (`u''(x)`). Transforming probabilities (cumulative or otherwise) to represent risk attitudes is inherently irrational or incoherent.
      *   **Type:** Claim about Representation (Location of Risk Attitude).
      *   **Status:** **Substantive, Contested, and Likely False.** While EU *locates* risk attitude in utility curvature, there's no inherent logical or normative reason why risk attitude *must* be represented this way and *only* this way. RWEU demonstrates a coherent alternative representation. The argument often stems from conflation with Thesis 6 or Thesis 4.
      *   **Compatibility with RWEU:** **Incompatible.**
      *   **Dismisses RWEU?:** **Yes.** This is a common, often implied, argument against models like RWEU and Prospect Theory. It dismisses RWEU specifically for locating risk attitude in the probability weighting rather than the utility function. RWEU proponents argue this location better captures genuine psychological and normative aspects of risk perception.

  8.  **Radical Definitional Monism (EU Maximization *Is* Rational Choice)**
      *   **Thesis:** The very concept of making a "rational choice" under uncertainty is *identical to* computing and selecting the option with the highest mathematical expectation of utility. There is no broader concept of rational decision-making; EU maximization exhausts its meaning.
      *   **Type:** Radical Definition / Monism.
      *   **Status:** **Radical, Undefended, and Effectively False.** This collapses all distinctions above. It ignores the conditional nature of representation theorems, the contested status of axioms, descriptive failures, and the existence of coherent alternatives like RWEU. It renders the concept of rationality devoid of independent content beyond a calculation.
      *   **Compatibility with RWEU:** **Incompatible.**
      *   **Dismisses RWEU?:** **Yes, by Dogmatic Fiat.** This is the most extreme and indefensible reading, dismissing RWEU simply because it isn't EU, without argument.

  **Summary of Dismissal Power & Compatibility:**

  *   **Do NOT Dismiss RWEU:** Readings 1 (Definitional Triviality), 2 (Representation Theorem), 3 (Weak Normative Requirement).
  *   **DO Dismiss RWEU (Substantively):** Readings 4 (Strong Normative Requirement - EU Axioms = Rationality) & 5 (Descriptive Generalization - though empirically weak).
  *   **DO Dismiss RWEU (Conceptually/By Fiat):** Readings 6 (Utility Domain Claim), 7 (Risk Attitude Location Claim), 8 (Radical Monism).

  **Which Reading Must the Commenter Have in Mind, and Does it Earn the Dismissal?**

  The dismissive comment ("rationality just *is* maximizing expected utility") most likely relies on **Reading 4 (Strong Normative Requirement)** or **Reading 7 (Risk Attitude Location Claim)**, often implicitly conflated or poorly distinguished.

  *   **Reading 4:** Earns the dismissal *only if* the EU axioms (especially Independence) are accepted as necessary and sufficient conditions for rationality. This is a substantive philosophical claim hotly debated in decision theory. Critics of EU argue that violations (like those exhibited in Allais and modeled by RWEU) reflect legitimate preferences, not irrationality. The dismissal is substantive but rests on contested normative ground.
  *   **Reading 7:** Does *not* earn the dismissal. It's an assertion without sufficient justification. RWEU provides a coherent counterexample showing risk attitude *can* be represented in probability weighting. Dismissal based solely on location is arbitrary and ignores RWEU's motivation and representation theorem. This reading often masks an underlying commitment to Reading 4 or 6.
  *   **Reading 6:** Similar to Reading 7, dismissal rests on an undefended assertion about what utility *must* encompass. RWEU challenges this by separating constructs.

  **Conclusion:** The dismissive move typically presupposes **Reading 4 (Strong Normativity)** or **Reading 7 (Location Claim)**. Reading 4 provides a *potentially* defensible basis for dismissal, but it requires defending the EU axioms as constitutive of rationality against known counterexamples and alternatives like RWEU. Reading 7 (and Reading 6) offer conceptually weak bases for dismissal that don't engage with RWEU's substance. Readings 1-3 are compatible with RWEU, and Readings 5 & 8 are indefensible. The commenter's dismissal is only earned if they successfully defend the *necessity* of the EU axioms (especially Independence) for rationality – a defense rarely provided in the brief dismissive statement.
