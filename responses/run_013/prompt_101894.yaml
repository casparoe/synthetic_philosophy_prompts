answer: |-
  ## Essay Question (60-90 minutes)

  **Lewis famously defined convention as a regularity R in behaviour among members of a population P such that:**

  1.  **Everyone conforms to R.**
  2.  **Everyone believes that others conform to R.**
  3.  **This belief that others conform gives everyone a reason to conform themselves (a preference for conformity conditional on others' conformity).**
  4.  **Everyone prefers that *anyone* conform to *some* regularity meeting conditions 1-3 over not conforming to any, and R is arbitrary in the sense that at least one alternative regularity R', meeting conditions 1-3, could have served instead.**

  **Consider two household regularities:**

  *   **Case A (Corridor):** Household members consistently keep to the right-hand side when passing each other in a narrow corridor.
  *   **Case B (Milk):** Household members consistently replace the milk carton when they finish it.

  **Both exhibit behavioural regularity and mutual expectations. Yet, intuitively, a violator in Case A seems merely *awkward* or *inconvenient*, while a violator in Case B seems genuinely *blameworthy* or *in the wrong*.**

  1.  **Using Lewis's apparatus precisely, explain how *both* cases qualify as conventions. Then, critically analyze: *Can Lewis's definition, particularly focusing on the role of the arbitrariness clause (condition 4), adequately explain the emergence of the distinctive sense of *obligation* or *wrongness* present in Case B but absent in Case A?* Does arbitrariness help ground obligation, undermine it, or is it simply irrelevant?** (Approx. 2/3 of answer time)
  2.  **Now imagine the household shifts from the Milk convention ("Finisher replaces") to a new regularity: "Whoever next intends to go shopping replaces the milk." Using Lewis's model, explain the challenge this transition poses. What specific elements, *beyond* the static definition of convention, would Lewis need to invoke to explain how this shift occurs *as a change of convention* rather than solely as the collapse of the old convention followed by the independent emergence of a new one? Can his analysis adequately describe the *process* of transition between equilibria?** (Approx. 1/3 of answer time)

  ---

  ## Model Answer (Approx. 750 words)

  Lewis’s analysis of convention provides a powerful framework for understanding how coordinated behaviors emerge and stabilize without central authority. Both household cases – Corridor-keeping (A) and Finisher-replaces-Milk (B) – satisfy his four conditions. In both, there is a clear regularity (R). Members mutually expect conformity (Condition 2). Crucially, in both cases, the preference to conform *is conditional* on others' conformity (Condition 3). In the corridor, I prefer to keep right *because* I expect you to; if you didn’t, I’d swerve unpredictably. With the milk, I prefer to replace it *because* I expect others do the same, ensuring milk is usually available; if others didn’t replace it, my replacing it alone would be futile or unfair. The arbitrariness clause (Condition 4) also holds: a left-keeping rule (R') could coordinate corridor traffic just as well as right-keeping (R). Similarly, an alternative regularity like "Whoever uses the last cup replaces" or "Whoever next shops replaces" (R') could potentially solve the milk coordination problem as effectively as "Finisher replaces" (R). Everyone prefers *some* such rule to chaos. Thus, by Lewis's definition, both Case A and Case B are conventions.

  However, the intuitive moral phenomenology differs starkly. Violating the corridor rule causes bumping or confusion – an *awkward coordination failure*. Violating the milk rule causes frustration and resentment – a sense of *wrongdoing*. The critical question is whether Lewis’s apparatus, particularly the arbitrariness clause, can bridge this gap and generate genuine obligation.

  Lewis's core mechanism – conditional preference based on mutual expectation – explains *compliance* but not necessarily *obligation*. Condition 3 provides a *prudential reason* to conform given expectations: "I replace the milk *because* I expect you to, and this ensures mutual benefit." This is akin to the corridor case: "I keep right *because* I expect you to, avoiding collision." The sense of mere awkwardness arises precisely when this prudential reason is the *only* salient one. Violation is simply a failure to coordinate effectively for mutual benefit.

  The sense of obligation in Case B seems to involve an additional layer: the violator is seen as *taking unfair advantage* or *failing in a duty*, not merely causing inconvenience. They benefit from others' conformity (having milk replaced for them) without bearing their share of the burden. Lewis’s Condition 4, arbitrariness, *undermines* rather than supports grounding this obligation. Precisely because R is arbitrary – because R' would have worked just as well – it suggests the *specific content* of the rule ("Finisher replaces") lacks inherent moral weight. If "Next Shopper replaces" would have been equally good, why is violating *this specific rule* wrong? The arbitrariness highlights that the rule's authority stems purely from its existence as a solution to a coordination problem, not from any intrinsic rightness. Obligation seems to require something more – perhaps a recognition of the *fairness* inherent in contributing one's share to a mutually beneficial scheme, or a sense of *commitment* generated through the practice itself.

  Lewis himself noted conventions can become norms, but his core definition doesn't *derive* normative force from the convention. The sense of obligation in Case B likely arises from factors Lewis's definition abstracts away from or treats as external:
  1.  **Fairness/Reciprocity:** The milk rule involves a clearer distribution of burdens and benefits over time. Violation is free-riding.
  2.  **Dependence/Vulnerability:** Running out of milk causes more significant harm than corridor bumping, making reliance on the convention stronger and violation more impactful.
  3.  **Intentionality/Accountability:** Finishing the milk is a deliberate act creating a specific responsibility, unlike simply walking down a corridor.
  Lewis's model captures the *expectation* of reciprocity but not the *normative demand* for it. Arbitrariness is irrelevant (or even obstructive) to this normative demand; it concerns the rule's origin, not the obligations incurred by participating in it once established.

  **Part 2: The Challenge of Change**
  The shift from "Finisher replaces" (R) to "Next Shopper replaces" (R') poses a significant challenge for Lewis's static model. His definition describes stable equilibria (R and R' are each potential conventions) but lacks an account of *disequilibrium dynamics* – how agents move *from* one equilibrium *to* another.

  For the shift to be a "change of convention" rather than collapse followed by fresh start, some mechanism must coordinate the population *away* from R *towards* R' *during a period where neither is fully established*. Lewis's core conditions cannot describe this directly. In the transition, Condition 1 (universal conformity) fails – some follow R, some R', some neither. Condition 2 (common belief) fractures – expectations are mixed and uncertain. Condition 3 (conditional preference) becomes problematic: my reason to conform to R weakens if others switch to R', but I lack reason to switch to R' unless enough others are expected to follow it.

  Lewis needs additional elements to explain the transition:
  1.  **Salience:** Something must make R' *focal* as the candidate new rule (e.g., explicit agreement, a prominent event, perceived inefficiency of R).
  2.  **Signaling/Communication:** Agents need ways to signal their intention to switch or their acceptance of R' (e.g., announcing "I'm going shopping later, I'll get milk" even if not the finisher).
  3.  **Gradual Adjustment:** Models like Sugden's or Binmore's, inspired by Lewis but extending him, incorporate learning, imitation, or best-response dynamics over time. Agents might experiment with R', observe partial success, adjust expectations, and gradually tip the population.
  4.  **Leadership/Critical Mass:** A subset adopting R' first might create a new conditional reason for others to follow.

  Lewis's static analysis can only describe the endpoints (R and R' as conventions). It cannot adequately describe the *process* of transition itself, which inherently involves a breakdown of the common knowledge and universal conformity that define a convention. His framework identifies *possible* equilibria but needs supplementation (e.g., evolutionary game theory, theories of focal points) to explain *movement between* them as a coordinated shift rather than chaotic collapse and rebuilding. The transition period is one of coordination failure *between* equilibria, which his equilibrium-centered model is ill-equipped to analyze internally.

  ---

  ## Marking Scheme (20 Marks Total)

  **Part 1: Convention vs. Obligation & Arbitrariness (14 Marks)**

  1.  **[3 Marks] Accurate Exposition of Lewis's Definition:** Clearly and correctly states all four conditions of Lewis's definition. *(Error: Misstating or omitting a condition, especially arbitrariness or conditional preference).*
  2.  **[3 Marks] Correct Application to Both Cases:** Demonstrates convincingly how *both* Case A (Corridor) and Case B (Milk) satisfy all four of Lewis's conditions for being conventions. *(Error: Failing to show how one or both cases meet the conditions, particularly conditional preference or arbitrariness).*
  3.  **[4 Marks] Clear Distinction Awkwardness vs. Obligation:** Accurately characterizes the intuitive difference: Case A violation = awkwardness/coordination failure; Case B violation = blameworthiness/sense of wrong/obligation violation. Links this to the core distinction emphasized in the course. *(Error: Conflating the two types of response, or misdescribing the phenomenology).*
  4.  **[4 Marks] Critical Analysis of Lewis & Arbitrariness:** Analyzes whether Lewis's apparatus (especially arbitrariness) can *generate* obligation. Must argue robustly that the core definition (conditional preference + mutual expectation) explains compliance/prudence but *not* obligation. Must specifically address the role of arbitrariness (e.g., undermines grounding obligation in rule content, irrelevant to fairness demands). *(Error: Simply asserting Lewis explains obligation; claiming arbitrariness grounds obligation; failing to engage specifically with why arbitrariness is problematic or irrelevant for obligation).*

  **Part 2: Change of Convention (6 Marks)**

  5.  **[2 Marks] Identifying the Transition Challenge:** Clearly states the problem: Lewis's model describes endpoints (equilibria) but not the disequilibrium process of moving between them. Explains why Conditions 1-3 fail during transition. *(Error: Stating the shift is easy, or not recognizing the breakdown of defining conditions during change).*
  6.  **[4 Marks] Explaining Transition Mechanisms:** Identifies and briefly explains *at least two* specific elements or mechanisms *beyond* the static definition needed to explain coordinated change (e.g., salience/focal points, signaling/communication, gradual adjustment/learning dynamics, leadership/critical mass). Must argue Lewis's static analysis *cannot* adequately describe the process, only the endpoints. *(Error: Suggesting the static conditions alone explain change; only listing mechanisms without explaining their necessity; failing to contrast static endpoints with dynamic process).*

  **Overall:** Top answers will demonstrate precise understanding of Lewis, sharply analyze the obligation/arbitrariness crux, and clearly articulate the transition challenge and needed extensions. Weaker answers will recite definitions without critical application, conflate expectation with obligation, or underestimate the dynamics of change.
