prompt: |-
  I am a novelist, and I have come to suspect that the hypothetical scenario is the most persuasive instrument in philosophy and the least scrutinised, and since I make my living with the same instrument, I would like to know what separates an honest one from a rigged one. What follows is a set of my own reactions, recorded as gut verdicts, to scenarios of the sort philosophers use. Tell me what principle, if any, they add up to.

  First, the familiar one: a runaway trolley will kill five people unless you turn it onto a track where it kills one. I regard this as an honest pump. Nothing in the description is doing work beyond marking the choice, and when I react I am reacting to the structure rather than to the staging.

  Second, a variant in which the one is a child, or in which the five are my own family. I regard this as rigged. It moves me, but it moves me by attaching sentiment to one side of the ledger; strip the adjectives and my verdict reverses. The persuasion is coming from the garnish, not the dish.

  Third, a scenario that stipulates that some person is wholly incapable of any attachment to her own future. I distrust it, because the conclusion rides on whether such a creature is possible at all, and the pump treats that as free.

  Fourth, a scenario that stipulates that a person feels no grief at a parent's death, and asks what I would think of her. I trust this one, though it looks like the previous case: an unusual psychology has been stipulated, but one I can grant as possible, and if it turns out I would not feel as the pump needs me to, the pump simply fails and I can say so.

  Fifth, in my current novel I have a scene in which a woman is made sympathetic by the presence of a dying child, and I know it works; readers forgive her the thing I need them to forgive. I think that is legitimate in a novel and would be illegitimate in a paper, and I want the principle to tell me why, or to tell me I am fooling myself.

  Sixth, a pump whose staging is plainly loaded, the agent described as a monster and the victim as innocent in three separate ways, but whose conclusion I also believe on independent grounds. I find that I excuse it, which worries me.

  Is there one principle that yields all six verdicts, or nearly all? Does it turn on whether the details of the scenario are relevant to the conclusion, on whether the scenario is possible, or on what the reader is being asked to supply? And what does the best candidate say about a case I have not listed: a pump whose staging is scrupulously neutral but whose intuitive verdict turns out to be an artefact of my culture or my century. Is that a rigged pump, or merely one that has stopped working? Finally, if I must surrender one of my six verdicts to keep the rest, say which and why.
reasoning: |-
  Okay, let me start by unpacking the novelist's query. They're a novelist who uses hypothetical scenarios in their work, much like philosophers do. They've noticed that these scenarios can be persuasive but aren't always scrutinized enough. Their main concern is distinguishing honest hypotheticals from rigged ones. They've provided six examples with their gut reactions and want to know if there's an underlying principle that explains all of them.

  First, I need to go through each of their six scenarios and their reactions. The trolley problem is seen as honest because the structure itself drives the intuition. The variant where the one person is a child or family is rigged because sentiment is added, which sways the response. The third scenario about a person incapable of attachment to their future is distrusted because the possibility of such a person is assumed without question. The fourth, where someone feels no grief, is trusted because the stipulated psychology is possible and the intuition can be tested. The fifth scenario in their novel uses a dying child to evoke sympathy, which they feel is legitimate in fiction but not in philosophy. The sixth involves a loaded description where the conclusion is independently believed, so they excuse it despite the bias.

  The user is looking for a unifying principle. Possible angles to consider: relevance of details to the conclusion, possibility of the scenario, cultural biases, or what the reader is asked to supply. The core issue seems to be whether the hypothetical is set up to test an abstract principle without emotional manipulation or hidden assumptions.

  For the trolley problem, the neutrality is key. Adding a child or family introduces emotional elements that aren't relevant to the moral principle of sacrificing one for many. That's why it's rigged—it's adding irrelevant emotional weight. The third scenario's issue is the assumption of a being without future attachment. If such a being isn't possible, then the intuition might be invalid. The fourth scenario allows for the possibility and tests the intuition, so it's honest even if the intuition fails.

  The novelist's fifth point is interesting. In fiction, using emotional elements like a dying child is part of storytelling to build sympathy. In philosophy, it's cheating because the goal is to isolate variables for ethical analysis. The principle here might be about the purpose: persuasion through narrative vs. testing a logical principle.

  The sixth scenario is tricky. Even with loaded language, the user excuses it because they agree with the conclusion independently. This might be a case where the conclusion's validity overshadows the method's flaws. But that's a bias—just because you agree, you overlook the manipulation. The principle would still call it rigged, but the user is lenient because of their prior belief.

  Now, the additional question about a culturally biased but neutrally presented scenario. If the intuition is shaped by culture, is the pump rigged? I think it's not rigged by design but is limited by context. The scenario itself is honest, but the reader's response is influenced by external factors. It's a pump that stopped working rather than being rigged.

  The user also asks which of their six verdicts they might need to surrender. Looking at the sixth one, where they excuse the loaded scenario because they agree with the conclusion. That seems the weakest because the method is still rigged regardless of the conclusion's truth. Surrendering that would strengthen the principle that rigging is about method, not outcome.

  Putting it all together, the key principle is whether the hypothetical is constructed to isolate the variable being tested without irrelevant emotional manipulation or unexamined assumptions. The purpose matters too—philosophy aims for analytical clarity, while fiction uses emotional engagement. The unifying principle is about the relevance and neutrality of details in serving the hypothetical's purpose. For philosophy, it's about testing abstract principles; for fiction, it's about emotional resonance.
answer: |-
  Your gut verdicts reveal a remarkably consistent principle—one that distinguishes honest from rigged hypotheticals based on **whether the scenario's details are *functionally relevant* to the abstract principle being tested, or whether they introduce *extraneous persuasive force*.** This principle, which I'll call **"Functional Relevance,"** explains all six of your cases and clarifies the cultural bias question. Let's break it down:

  ### The Principle: Functional Relevance
  - **Honest Pump:** Details are *minimal and necessary* to isolate the target variable (e.g., "1 vs. 5 lives"). They serve only to frame the abstract dilemma. Persuasion comes from the reader's intuition about the *structure itself*.
  - **Rigged Pump:** Details are *extraneous or manipulative*. They introduce emotional, cultural, or psychological bias that *smuggles in persuasion* unrelated to the core principle. The conclusion "piggybacks" on these additions.

  ### Your Cases, Explained:
  1. **Trolley Problem (Honest):**  
     - *Why it works:* Only structurally relevant details ("5 vs. 1 death") are included. Your intuition responds to the *tradeoff*, not staging.  
     - *Functional Relevance:* ✅ The details isolate the utilitarian calculus.

  2. **Trolley Variant (Rigged):**  
     - *Why rigged:* "Child" or "family" adds *sentimental weight* irrelevant to the core dilemma (saving 5 vs. 1). It hijacks emotion to skew the ledger.  
     - *Functional Relevance:* ❌ Garnish manipulates, doesn't clarify.

  3. "No Future Attachment" (Rigged):  
     - *Why rigged:* The stipulation isn't just unusual—it’s *conceptually contested* (e.g., is "no attachment to one's future" coherent?). The pump *assumes its possibility* to force an intuition, burying a premise that should be argued.  
     - *Functional Relevance:* ❌ The key detail isn't neutral—it smuggles in a metaphysical claim.

  4. "No Grief" (Honest):  
     - *Why honest:* Unusual psychology is stipulated, but it’s *grantable as possible* (e.g., sociopathy, cultural difference). The pump *tests* your intuition: if you reject the conclusion, the thought experiment fails cleanly.  
     - *Functional Relevance:* ✅ The detail is relevant to testing moral psychology (e.g., "Is grief necessary for moral personhood?").

  5. **Dying Child in Novel (Legitimate) vs. Paper (Illegitimate):**  
     - *Why the distinction:* In fiction, persuasion *relies* on emotional engagement; the child’s presence *is* functionally relevant to character sympathy (your goal). In philosophy, the goal is *isolating variables*—adding emotion obscures the principle.  
     - *Functional Relevance:* ✅ In fiction, details serve narrative/emotional ends. In philosophy, they must serve analytic ends. Cross-purposes = rigging.

  6. **Loaded Staging + True Conclusion (Rigged, but excused):**  
     - *Why rigged:* Describing an "innocent victim" and "monster" agent biases intuition *extraneously*. Even if the conclusion is independently true, the *method* is dishonest—it "proves" it via manipulation.  
     - *Why you excuse it:* Cognitive bias! We forgive flawed arguments for conclusions we accept. But the pump is still rigged—it works by rhetoric, not reasoning.  
     - *Functional Relevance:* ❌ Adjectives do heavy lifting; the core principle isn’t tested fairly.

  ---

  ### The Cultural Bias Case: Neutral Staging, Culturally Contingent Intuition
  - **Is it rigged?** **No—it’s an *expired* pump.**  
    - *Why:* The staging is scrupulously neutral (✅ functionally relevant), so the pump is honest *in design*. But if your intuition is shaped by culture/era, the *output* is unreliable. This isn’t rigging—it’s a limitation of intuition-based methods.  
    - *Example:* A neutral "trolley problem" presented to 12th-century feudal peasants might elicit different intuitions (e.g., "Kill the 5 serfs to save 1 lord"). The pump isn’t rigged; it’s context-dependent. Philosophers must acknowledge this, but it doesn’t invalidate the method—it refines it.

  ---

  ### The Tradeoff: Which Verdict to Surrender?
  If you must surrender one verdict to preserve Functional Relevance, **surrender #6 (excusing the loaded pump with a true conclusion)**.  
  - *Why:* This is the only case where your reaction contradicts the principle. Excusing manipulative staging because you agree with the conclusion undermines the entire project of honest inquiry. Functional Relevance demands rigor *regardless of outcome*. A rigged pump is rigged even when "right"—just as a false confession is invalid even if the defendant is guilty.  
  - *Consequence:* Holding firm here protects philosophy from becoming propaganda and fiction from being mistaken for argument.

  ---

  ### In Practice: A Litmus Test for Your Work
  When crafting scenarios (philosophical or literary), ask:  
  1. **What is the *target principle*?** (e.g., "sacrifice one for many," "forgiveness requires empathy").  
  2. **Do all details *directly test* that principle?** If yes ➔ Honest.  
  3. **Do details *import persuasion* from elsewhere?** (e.g., emotion, bias, unchallenged assumptions) ➔ Rigged.  

  You’re right that fiction and philosophy both use hypotheticals—but their *success conditions* differ. Philosophy aims at **analytical clarity**; fiction at **emotional resonance**. A dying child is functional in one context, extraneous in the other. Your instincts are sharp; Functional Relevance names what you already grasp.
