prompt: |-
  My roommate and I got into a stupid argument about how many things are in our apartment — like, literally, how many objects — and it escalated way more than it should have, and now I want to know whether there's actually a principle behind my gut answers, because I keep catching myself contradicting myself. Here's where I land. A brick: one thing. A wall made of bricks and mortar: also one thing — if you asked me to count what's in the room I wouldn't say "four hundred bricks plus some mortar," I'd say "a wall." But two bricks I glued together in the garage: that's two things, or at best one object made of two things, but it's not *a* thing the way the wall is, and I can't articulate the difference to save my life. A heap of sand: not a thing, just sand. A sandstone rock I picked up on the beach: a thing. A cloud: not a thing. A river: a thing, sort of, even though it's different water every second, which I realize opens a whole other can of worms. A swarm of bees: not a thing, many things. But a Portuguese man o' war — I looked this up after seeing one washed up, it's actually a colony of separate little animals that can't survive on their own — that is one thing, one animal, and I feel weirdly strongly about that. A cup with a handle that was glued on at the factory: one thing, the handle is part of the cup, no question. My two glued bricks: two things. A cat: one thing. The top half of a cat (god forbid): not a thing. Me and three friends holding hands: not a thing. A human pyramid: not a thing. A corporation, though, feels more like a thing than the pyramid does, and I suspect that's just me being spooked by legal paperwork rather than anything real.

  Is there a principle that gets all of these, or close? My hunch is it's something about the parts being joined *in the right way* — not mere contact, not even glue, but doing something together, having a job as a unit. But then I worry that's just "being alive" wearing a costume, and if I commit to that I have to give up the wall and the rock and the cup, which I definately won't do. So maybe I should go the other way and say anything whose parts are stuck together counts as one thing — in which case my glued bricks become one thing, and a wet clump of sand becomes one thing, and those verdicts have to go instead. I genuinely don't know which loss is less bad.

  So: what principle, or small set of rival principles, actually captures this pattern, stated precisely enough that I could apply it to a case I haven't seen? For each candidate, tell me which of my verdicts it forces me to abandon, and be honest if the answer is "you can save everything only by adding a clause that does no work." Then tell me what your preferred principle says about three things I haven't thought about: a lichen (which I'm told is a fungus and an alga living as a single thing), a species, and a hurricane. Lead with the bottom line in the first sentence, then the reasoning — no throat-clearing, and don't restate my question back to me.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck in an argument with their roommate about counting objects and need a principle to explain their gut feelings. 

  First, I notice their examples show a tension between physical bonding and functional unity. Bricks vs brick wall, glued bricks vs cup handle - they reject mere attachment but accept functional wholes like the man o' war colony. They're struggling to articulate why some connections "count" and others don't.

  Hmm... their rejection of "alive = object" is key - they won't sacrifice the wall or cup. But pure physical bonding leads to accepting glued bricks as one object, which they reject. That's the core contradiction they can't resolve.

  I recall philosophical concepts like mereology. Van Inwagen's "life" criterion won't work here since they include artifacts. Maybe functional unity? But "function" is vague - is a wall's function just "being a wall"? That feels circular. 

  The Portuguese man o' war case suggests they value emergent functionality - the colony acts as a single organism. But then why reject the human pyramid? Perhaps because it's temporary? But rivers are temporary and they accept those. 

  Wait - rivers and species point to temporal persistence being a factor. But clouds lack persistence and they reject those. So maybe it's about having identity over time despite part changes? 

  Their glued brick example is crucial. The difference might be intentional design: factory-handled cup vs DIY bricks. But that feels arbitrary. Unless... is it about conventional recognition? We socially agree cups are single objects but glued bricks aren't. 

  But the sandstone rock challenges that - naturally formed, not designed, yet accepted. So natural cohesion matters too. 

  For new cases: Lichen would be one thing by functional unity. Species... tricky. It's an abstract class, not a concrete object. Hurricane is a process, not an object. But they accepted rivers... 

  The cleanest solution might be functional cohesion plus temporal persistence, but even that has holes. Ultimately, their intuitions blend multiple criteria inconsistently. I'll need to present competing principles and show where each conflicts with their judgments.
answer: |-
  The core principle explaining your pattern is **functional cohesion**: an aggregate counts as a single object if its parts are stably integrated to serve a unified purpose or maintain a distinct, persistent structure that behaves as a unit in its relevant context. This reconciles most (but not all) of your intuitions by emphasizing *what the thing does* over mere physical bonding.

  ### How Functional Cohesion Applies to Your Cases:
  1. **Accepted:**  
     - Brick/wall/cup: Parts are cohesively structured for a purpose (containment, support).  
     - Sandstone rock: Naturally formed, stable structure with integrity.  
     - River: Persistent structure/function (water flow path) despite part changes.  
     - Man o’ war: Organisms function as an inseparable unit for survival.  
     - Cat: Biological functional unity.  
     - Corporation: Legally recognized as a unified agent with purpose.  

  2. **Rejected:**  
     - Glued bricks: Bonded but lack unified function/structure (no emergent purpose beyond "two bricks stuck").  
     - Heap of sand: No stable structure or unified function.  
     - Cloud: Transient, no cohesive structure/function.  
     - Swarm/people holding hands: Parts act independently; cohesion is temporary/incidental.  
     - Human pyramid: Structure is ephemeral, not functionally persistent.  
     - Half-cat: Not a functional biological unit.  

  ### Trade-offs & Conflicts:
  - **You must abandon:**  
    - Glued bricks as "two things" → Under functional cohesion, if the bricks were fused into a *tool* (e.g., a paperweight), they’d be one thing. Your verdict conflicts because you ignore purpose.  
    - Wet sand clump: If cohesive (e.g., a sandcastle), it *would* be one thing. Your "heap" verdict is arbitrary without function.  
  - **Advantage:** Saves the wall/cup/rock without requiring "being alive."  

  ### Alternative Principles & Their Flaws:
  1. **Physical Bonding Alone**:  
     - *Saves*: Glued bricks, cup, rock.  
     - *Forces abandonment*: Rejects heap/river/cloud/man o’ war (bonding ≠ unity) and accepts wet sand clump as "one thing."  

  2. **Biological Unity (Alive = Object)**:  
     - *Saves*: Cat, man o’ war.  
     - *Forces abandonment*: Wall, cup, river, rock, corporation → all non-living aggregates become "not things."  

  3. **Social Convention**:  
     - *Saves*: Cup, wall, corporation.  
     - *Forces abandonment*: Rock/river (no convention) and glued bricks (if conventionally deemed one).  

  ### New Cases Under Functional Cohesion:
  - **Lichen**: **One thing** – Fungus and alga integrate to form a persistent, functional unit (symbiotic survival).  
  - **Species**: **Not a thing** – A conceptual category, not a cohesively structured entity with unified function.  
  - **Hurricane**: **Not a thing** – A transient atmospheric process; no stable structure or purpose (contrast with *river*, which has geographic persistence).  

  ### Bottom Line:
  Functional cohesion (stable structure + unified purpose) captures ~80% of your intuitions but forces you to accept *some* glued aggregates as one object if repurposed, and rejects "transient heaps" like your sand pile. No principle saves *all* your verdicts without ad-hoc exceptions, as your intuitions inconsistently blend biology, artifact design, and persistence.
