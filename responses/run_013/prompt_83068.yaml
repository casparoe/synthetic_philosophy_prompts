  Cases used at:
  - Case (a): Practical parity → used to challenge Truth monism (leaf 1) and also implicitly in the starting commitment.
  - Case (b): Barn case → used for Robustness (leaf 3) and Achievement (leaf 6) to show the lack of extra value in an unsafe or non-creditable belief.
  - Case (c): Forgotten evidence → used for Meta-knowledge (leaf 7) to challenge the requirement of being able to tell that one knows.
  - Case (d): Trivial fact → used for Instrumentalism (leaf 2) to challenge the practical utility explanation.
  - Case (e): Application without grasp → used for Understanding-first (leaf 8) to show the difference in value between mere application and understanding.

  Combinations not occupied: 
