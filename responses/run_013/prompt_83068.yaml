                     - No → 
                           5. Is the extra value located in the modal stability of the belief? (i.e., that it is safe or sensitive)
                                - Yes → 
                                      **Robustness (safety)**: the extra value is that the belief would still have been true across the nearby cases.  
                                      Most awkward commitment: In the barn case (b), the belief is not safe, so the agent lacks the extra value; but if we think they do know, this view is in tension.

                                - No → 
                                     6. Is the extra value primarily due to the agent's cognitive achievement? (i.e., credit for getting it right through ability)
                                         - Yes → 
                                               **Achievement (credit)**: knowledge is creditable to the agent, and credit is finally valuable.  
                                               Most awkward commitment: In the barn case (b), the agent's true belief is not an achievement (due to environmental luck), so they lack the extra value; but if we think they do know, this view is in tension.

                                         - No → 
                                              7. Is the extra value of knowledge derivative from the value of understanding?
                                                   - Yes → 
                                                         **Understanding-first**: the value of knowledge is derivative from the value of understanding.  
