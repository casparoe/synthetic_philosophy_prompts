  So every path is taken. But note that the organic unity view might also be compatible with saying that the extra value depends on modal stability? But in the tree, if they say "yes" to Node 5 (modal stability), they go to robustness, not to organic unity. So the tree does not allow for a view that says both. But in reality, a proponent of organic unity might also require modal stability for knowledge. However, the value of knowledge, according to organic unity, is in the whole being more than the sum of the parts, not in the modal stability per se. So when asked at Node 5: "Is the extra value located in the modal stability of the belief?", they would say no, because they think the extra value is in the organic unity. Therefore, the tree is designed to capture the primary explanation.

  Similarly, a robustness theorist might also think that knowledge is an achievement, but they would answer at Node 5: yes (modal stability) and then go to leaf 3, and not get to achievement. But again, the tree is for the primary reason.

  So it is acceptable.

  Therefore, we'll go with this tree.

  Now, to present it as an indented tree:

  Tree for the Value of Knowledge

  1. Do you agree that there is some respect in which knowing is better than merely truly believing?
     - No → 
          **Truth monism**: nothing is epistemically good except truth, so knowledge is not better than true belief as such.  
          Most awkward commitment: Must deny the intuition that knowledge is more valuable than true belief in cases of practical parity (case a), where the two beliefs are equally stable and useful.

     - Yes → 
          2. Is the extra value epistemic? (i.e., does it stem from the cognitive state itself, not from practical consequences?)
