                   Most awkward commitment: Cannot explain why we value knowledge of trivial facts (case d), which have no practical utility.

             - Yes → 
                  3. Does the extra value depend on the agent's ability to access the grounds of their belief? (internalist constraint)
                     - Yes → 
                           4. Is the extra value constituted by the agent's ability to tell that they know? (meta-knowledge)
                                - Yes → 
                                      **Meta-knowledge (perspectival)**: knowledge is valuable because it puts the agent in a position to tell that they know.  
                                      Most awkward commitment: In the forgotten-evidence case (c), the agent cannot reconstruct the grounds, so they cannot tell that they know; thus, this view must either deny that they know or deny that their knowledge has the same value.

                                - No → 
                                      **Justification as an intrinsically valuable component**: the extra value is a feature added to the true belief itself.  
