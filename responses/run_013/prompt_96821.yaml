  Breaking down the user's explicit requirements: (a) interpret the rule beyond surface-level invention, (b) address the "no harm to the dead" objection, (c) consider variables like obscurity or living descendants, and (d) engage with counterarguments. But the deeper need is pedagogical: they want students to understand that responsible invention requires anchoring in documented humanity, not just narrative convenience.

  For the exam question, I'll frame it around the student's controversial portrayal, forcing analysis of how the rule applies. The model answer should demonstrate ethical invention by distinguishing between amplifying documented traits (like loneliness in diaries) vs. inventing contradictory ones (like secret contempt). Key moves: clarify the rule as fidelity to the person's documented essence, reject the "no harm" fallacy by discussing historical representation as harm, and differentiate obligations toward obscure vs. known figures.

  The marking scheme needs precision. I'll allocate points for specific analytical moves: defining the rule's limits (5), refuting "no harm" (5), contextualizing obscurity/family (5), and naming counterarguments (5). Quality of argument gets 5 points. Each section must penalize vagueness - like accepting "balance" without criteria or ignoring how invention can distort legacy.

  The user's frustration with B answers is telling. They want students to articulate concrete ethical guardrails, not platitudes. So the model answer will model that specificity, e.g., "invention is ethical only when it illuminates, not contradicts, the documented self." The counterargument section should preempt objections about artistic freedom to show depth.

  Noticing the TA is a poet unfamiliar with historical ethics. The marking scheme must be idiot-proof - hence descriptors like "fails if student claims the dead cannot be misrepresented." User's academic rigor comes through; they'll appreciate nuances like distinguishing historical harm (distorting legacy) from personal harm.
answer: |-
  Here's a complete exam package designed to force students to grapple with the core ethical tension you've identified, moving beyond facile "balance" arguments.

  **The Exam Question (To be presented to students):**

  **"Your rule, 'Be true to the person, not the paper,' encourages historical novelists to move beyond the literal archive to capture the perceived inner life of a real historical figure. However, consider this scenario: a student, writing about Matilda Vance (a real, documented 1880s philanthropist universally described as 'tireless and beloved'), invents a secret, profound contempt for the poor as her hidden motivation for running a charitable foundation. The student argues this invention 'makes the character cohere' and is justified by your rule, as there is no archival 'paper' explicitly *contradicting* this invented contempt.**

  1.  **Interpret & Limit the Rule:** Explain what 'be true to the person, not the paper' *could* legitimately mean in ethical historical fiction practice, specifically how it differs from inventing *any* motivation or trait that serves the narrative, using the Vance example to illustrate your point. Why might the student's application of the rule be a misreading?
  2.  **The 'No Harm' Objection:** Address the argument: "Matilda Vance is dead; therefore, inventing a harmful trait like secret contempt cannot wrong *her*, as the dead cannot be harmed." Is this objection valid? Why or why not?
  3.  **Contextual Obligations:** Would your assessment of the ethical permissibility of inventing this specific trait (secret contempt) change if:
      *   a) Matilda Vance were utterly obscure, with no public record or reputation beyond basic census data?
      *   b) Matilda Vance had living grandchildren who cherished her memory and the historical record of her philanthropy?
      *   Explain the reasoning behind any differences.
  4.  **Best Counterargument:** Identify and articulate the strongest potential counterargument to *your own* position on the ethics of this specific invention.

  **(Time: 90 minutes)"**

  ---

  **Model Answer (Approx. 600 words):**

  The injunction to "be true to the person, not the paper" is not a license for unbridled invention but a call for responsible *interpretation* grounded in empathetic synthesis of the archive. It acknowledges that historical records are fragmentary, often performative (like letters), or silent on interiority. "The paper" provides facts, events, and curated personas; "the person" is the complex human being inferred *from* that paper, combined with historical context and psychological plausibility. The rule legitimizes amplifying subtle hints (like loneliness in a diary overshadowed by brisk letters) or constructing a coherent inner logic that *aligns* with documented actions and attested character. It means prioritizing the *essence* of the person that emerges from the *totality* of the record and context, even if no single document states it explicitly.

  The student's invention for Matilda Vance fundamentally violates this principle. Inventing a secret contempt for the poor directly contradicts the *overwhelming* documented evidence of her being "tireless and beloved" in her charitable work. There is no hint, no subtle thread in the "paper" suggesting hypocrisy or disdain; the invention is imposed *contrary* to the established record. The rule allows bridging gaps in the archive where silence exists, *not* constructing traits that actively negate the archive's dominant, consistent testimony about a core aspect of the person's life and character. The student mistakes narrative convenience ("makes the character cohere" *for the student's specific plot*) for fidelity to the historical person. True coherence must be coherence *with* the historical record, not coherence *imposed upon* it against its grain.

  The objection that "the dead cannot be harmed" is ethically shallow. While Vance cannot feel personal offense, historical fiction shapes *collective memory* and *historical understanding*. Misrepresenting a real person, especially by attributing a profoundly negative, unsubstantiated motive that contradicts their life's work, distorts their *legacy* and does violence to historical *truth*. It replaces the complex reality of a person dedicated (however complicatedly) to helping others with a damaging, fictional caricature. This harms our understanding of history, the integrity of the genre, and potentially the descendants or communities who value that legacy. It's a betrayal of the historian-novelist's duty to the past, even if the specific individual is beyond personal hurt.

  Context *does* modulate the ethical weight, though not the core principle of not contradicting the known essence:
  *   **a) Utter Obscurity:** If Vance were utterly obscure, with only minimal records (e.g., census listing occupation), the invention might be *less damaging* to a known legacy, as there's no established reputation to distort. However, the *ethical principle* remains: inventing a core motivation fundamentally at odds with the scant "paper" (e.g., her *being* a philanthropist) is still a fabrication about a real human. It privileges the author's whim over any potential historical truth the minimal record might hold. The duty is to the *integrity of representing the real*, not the size of the audience.
  *   **b) Living Grandchildren:** The presence of living descendants significantly increases the *stakes* and potential for *concrete harm*. While the core ethical breach (distorting the historical person against the record) exists regardless, adding this layer introduces the potential for genuine distress, damage to family memory, and a more tangible violation of trust. The novelist has a heightened responsibility to sensitivity and accuracy when their inventions impact the living who carry a personal connection to the subject.

  The strongest counterargument to my position is likely rooted in **artistic freedom and the nature of fiction.** A critic might argue: "Historical fiction is *art*, not biography. The novelist's primary duty is to the truth of the *story* and its themes, using historical figures as raw material. Imposing strict ethical constraints based on fidelity to an unknowable past stifles creativity and reduces complex characters to simplistic, sanitized versions dictated by potentially biased or incomplete archives. The 'essence' is itself an interpretation; why privilege the historian's interpretation (based on the same 'paper') over the artist's? The invented contempt, while unsupported, creates a more dramatically compelling and thematically rich exploration of power, charity, and hypocrisy in the Gilded Age."

  ---

  **Marking Scheme (25 Points Total):**

  **Focus: Award points ONLY for directly addressing the specific Vance case and the four parts of the question. Vague generalities about "balance" score poorly.**

  1.  **Interpretation & Limitation of the Rule (using Vance Example) (5 points)**
      *   **5:** Clearly defines "true to the person" as synthesis/interpretation *based on* and *aligned with* the archive/attested character, contrasting it with invention *contradicting* the record. Explicitly states why the student's invention (secret contempt) violates the rule by contradicting the "tireless/beloved" record. Distinguishes between bridging silence and negating evidence.
      *   **3-4:** Defines the rule reasonably but less precisely; identifies the contradiction but explanation is weaker; doesn't fully articulate the "silence vs. contradiction" distinction.
      *   **1-2:** Misstates the rule as license to invent; fails to articulate how the student's example violates it; focuses only on lack of evidence *for* contempt, not contradiction *of* the positive record.
      *   **0:** Ignores the question or fundamentally misrepresents the rule/scenario.

  2.  **Addressing the "No Harm to Dead" Objection (5 points)**
      *   **5:** Clearly rejects the objection. Articulates concrete concepts of harm: distortion of legacy, harm to historical understanding, violation of truth/duty, potential harm to collective memory. Explains why personal feeling isn't the only relevant harm.
      *   **3-4:** Rejects objection but explanation of harm is less developed (e.g., only mentions "distorting history" vaguely). May partially concede the point about personal harm but identifies other harms.
      *   **1-2:** Accepts the objection ("no harm, she's dead") without meaningful counter; or provides a very weak/irrelevant counter.
      *   **0:** Ignores the objection or agrees with it.

  3.  **Contextual Obligations (Obscurity & Grandchildren) (5 points)**
      *   **5:** For **each** scenario (a & b):
          *   States clearly if assessment *changes* (likely: less damaging for obscure, *more* problematic with descendants).
          *   Provides *specific reasoning* linked to the scenario: obscurity = less legacy to distort, but core ethical principle remains; descendants = increased stakes, potential for real distress/harm to living, heightened responsibility.
          *   Maintains the core principle (contradicting known essence is problematic) even while acknowledging shifting weight.
      *   **4:** Clear on both scenarios, but reasoning slightly less developed for one.
      *   **3:** Addresses both scenarios, but reasoning is vague ("it's more sensitive") or doesn't fully articulate the *why* for the difference. May imply the principle *changes* fundamentally for the obscure case.
      *   **1-2:** Only addresses one scenario; or addresses both poorly with minimal/unconvincing reasoning; or argues context makes *no* difference without justification.
      *   **0:** Ignores context question.

  4.  **Naming & Articulating the Best Counterargument (5 points)**
      *   **5:** Identifies a *strong, relevant* counterargument directly opposing their *own* stance (e.g., primacy of artistic freedom/truth of the story, fiction vs. biography, archives as biased/incomplete, artist's right to reinterpret "essence"). Articulates it clearly and plausibly in the context of the Vance case.
      *   **4:** Identifies a strong counterargument, articulation slightly less clear.
      *   **3:** Identifies a *relevant* but weaker counterargument (e.g., "we can't know for sure," "it's just fiction" without depth). Or identifies a strong one but articulation is poor.
      *   **1-2:** Identifies an irrelevant or very weak counterargument. Or mentions a counterargument without naming/articulating it clearly.
      *   **0:** No counterargument named or articulated.

  5.  **Overall Argument Quality, Clarity & Structure (5 points)**
      *   **5:** Well-structured essay directly answering all parts. Clear, concise, academic prose. Logical flow between points. Demonstrates sophisticated understanding of the ethical complexities.
      *   **4:** Generally well-structured and clear. Minor issues with flow or concision. Good understanding.
      *   **3:** Adequately structured and clear. Some repetition or vagueness. Competent but not sophisticated understanding.
      *   **2:** Poorly structured or unclear. Significant issues with focus or expression. Superficial understanding.
      *   **1:** Very disjointed, unclear, or off-topic. Minimal understanding.
      *   **0:** Incoherent or irrelevant.

  **Separating A's from B's:** The key differentiators are:
  *   **Part 1:** Moving beyond "interpretation good" to defining *how* interpretation must be anchored (alignment vs. contradiction) and *specifically* applying it to negating Vance's documented character.
  *   **Part 2:** Articulating concrete *types* of harm beyond personal offense (legacy, truth, understanding).
  *   **Part 3:** Explicitly linking changes in *weight* or *stakes* to the context (obscurity = less damage to known legacy, descendants = risk of harm to living + heightened duty) while maintaining the core ethical principle.
  *   **Part 4:** Identifying a counterargument that genuinely challenges the core of their position (artistic freedom vs. fidelity), not a straw man.
  *   **Overall:** Avoiding the phrase "it's a balance" *without* providing the concrete ethical criteria that define *where* that balance lies (which is what the whole question demands).

  **For the TA:** "Look for precision in applying the 'true to person, not paper' rule to the *specific contradiction* in the Vance case. Demand concrete explanations of 'harm' beyond the dead not feeling hurt. Check that context changes the *impact* or *stakes*, not necessarily the core *wrong* of contradicting the known essence. Ensure the counterargument is substantial and relevant. Reward students who provide the *criteria* for ethical invention, not just the assertion that it's 'necessary sometimes.' Penalize vagueness and reliance on 'balance' without defining the terms of that balance."
