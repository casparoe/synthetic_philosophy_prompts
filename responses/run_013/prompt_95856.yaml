answer: |-
  Here is the joint statement reflecting the adversarial collaboration between your Non-Naturalist Moral Realist (NNMR) and Quasi-Realist Expressivist (QRE), followed by their residual disagreements and analysis:

  **Joint Statement of Agreement: Moral Discourse & Its Logic**

  Recognizing persistent disagreement on fundamental metaphysics, we nevertheless affirm substantial shared ground regarding the logic, practice, and surface features of moral discourse:

  1.  **Truth-Aptness & Embeddability:** Moral judgments (e.g., "Torture is wrong," "Generosity is good") are genuinely truth-apt. They express propositions capable of being true or false, and they function seamlessly in logical operations: they can be negated ("It is not the case that torture is wrong"), embedded in conditionals ("If torture is wrong, then we should ban it"), form the objects of belief ("I believe honesty is virtuous"), and figure in valid inferences ("Kicking dogs causes suffering; causing suffering for fun is wrong; therefore, kicking dogs for fun is wrong").
  2.  **Cognitive Role & Normativity:** Engaging in moral reasoning is a cognitive endeavor involving the assessment of reasons, evidence, and argument. Moral judgments inherently claim normative authority; to judge that X is wrong is to judge that there are decisive reasons (for relevant agents) not to do X, irrespective of their contingent desires.
  3.  **Supervenience:** The moral supervenes with metaphysical necessity on the natural. There cannot be a difference in the moral properties of a situation, action, or state of affairs without some underlying difference in its natural properties (physical, psychological, social facts). Any adequate moral theory must account for this necessary covariance.
  4.  **Persistence of Disagreement:** The existence of persistent, seemingly intractable moral disagreement, even among thoughtful, informed, and sincere individuals, is a significant phenomenon. However, *neither* of us believes this persistence *by itself* decisively proves:
      *   That there are no objective moral truths (NNMR).
      *   That moral judgments are merely reports of subjective preferences or lack cognitive content (QRE).
      *   That moral discourse is inherently defective or "queer" in a way that undermines its seriousness.
  5.  **Meaning of "True" (Minimalist Core):** When we call a moral judgment "true," we minimally mean that it is *correct*. To assert that "Slavery is wrong is true" is equivalent to asserting "Slavery is wrong." We both reject deflationary theories that make truth *merely* redundant or disquotational in a way that drains it of normative significance within discourse.
  6.  **Meaning of "True" (Refusals):**
      *   **NNMR refuses to mean:** That calling a judgment "true" merely signifies endorsement of an attitude or the aptness of an expression within a linguistic practice, *without* implying correspondence to a stance-independent moral fact.
      *   **QRE refuses to mean:** That calling a judgment "true" inherently commits us to the existence of robust, non-natural, causally inert properties or facts as the metaphysical grounds for that truth, distinct from the natural world and our conative responses to it.

  **Residual Disagreements: The Metaphysical & Explanatory Core**

  | Feature of Morality                | Non-Naturalist Moral Realist (NNMR) Position                                                                 | Quasi-Realist Expressivist (QRE) Position                                                                                                                               |
  | :--------------------------------- | :----------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of Moral Correctness**    | The correctness (truth) of a moral judgment consists in its **correspondence to a stance-independent, mind-independent moral fact** or property. | The correctness (truth) of a moral judgment consists in the **standing and appropriateness of the conative attitude** (e.g., endorsement, commitment) it expresses, given relevant standards and the natural facts. |
  | **Metaphysical Status of Moral Properties** | Moral properties (e.g., wrongness, goodness) are **sui generis, non-natural, irreducible properties**, instantiated in the world independently of human attitudes. | Moral properties are **projections of our conative attitudes** onto the world. Talk of properties is intelligible, but they lack robust, attitude-independent ontological status. They are "shadows cast by grammar." |
  | **Mind-Independence: Substantive or Earned?** | Mind-independence is a **substantive, ontological commitment** of moral discourse and belief. Moral truths hold regardless of what any individual or community thinks or feels. | Mind-independence is a **feature internal to the logic of moral commitment**, which the expressivist can successfully "earn" or mimic through the discipline of moral reasoning and the grammar of objectivity, *without* a commitment to robust ontological independence. |
  | **Explanatory Priority**           | The existence of stance-independent moral facts **explains** why our best moral judgments are correct and why moral discourse has the logical features it does (truth-aptness, supervenience). | The practical needs of social creatures engaging in normative discourse and planning **explain** the development of a discourse with the logical features it has (truth-aptness, supervenience, objectivity-talk), *without* needing to posit robust moral facts. |
  | **Epistemology: Source of Warrant** | Moral knowledge is akin to other forms of synthetic a priori knowledge or rational intuition, tracking the non-natural moral reality.                               | Moral warrant arises from **the coherence and stability of our conative attitudes** under reflection, informed by natural facts and sensitivity to reasons, within a community of like-minded beings.                     |

  **Cruxes of the Disagreement & Predictions**

  1.  **Crux: The Indifferent Expert**
      *   **Case:** A being ("Oracle") possesses a perfect computational model of the natural world and ideal moral reasoning procedures. For any moral question, she infallibly outputs the verdict that our best possible moral reasoning (involving full information, impartiality, coherence, etc.) would converge upon. Crucially, the Oracle has *no conative states whatsoever* – no desires, no approvals, no commitments, no pro-or con-attitudes. She is utterly indifferent to her own outputs.
      *   **Argument:** Does the Oracle issue *genuinely correct moral judgments*? Or is she merely producing syntactically correct sentences that *simulate* moral judgments?
      *   **NNMR Prediction:** *Yes, the Oracle issues correct judgments.* Her outputs correspond to the stance-independent moral facts discoverable by ideal reasoning, regardless of her own lack of attitude. Her indifference is irrelevant to the *truth* of the judgment, only to her *engagement* with it. This case highlights the irreducibility of moral truth to conative states.
      *   **QRE Prediction:** *No, the Oracle does not issue genuine moral judgments.* Without any conative attitudes, she lacks the essential element of *endorsement* or *commitment* that constitutes the moral stance. Her outputs are inert simulations, like a calculator outputting "2+2=4" without understanding mathematics. Correctness requires the conative element she lacks. This shows correctness is constitutively tied to attitudes.
      *   **Bearing:** Directly tests whether moral correctness *requires* conative attitudes (QRE) or can exist wholly independently of them, grounded only in reasoning and facts (NNMR).

  2.  **Crux: The Status of Mind-Independence Commitments**
      *   **Case:** Analyzing the phenomenology and grammar of moral deliberation and disagreement. We say, "Even if everyone approved of slavery, it would still be wrong," or "I could be mistaken about this being the right thing to do."
      *   **Argument:** Are these utterances best explained as tracking a deep ontological commitment to mind-independent facts (NNMR), or are they expressions of the inescapable *practical* perspective of normative commitment, which the expressivist can reconstruct as part of the "logical grammar" of moral thought (QRE)?
      *   **NNMR Prediction:** Attempts to explain away mind-independence talk as merely expressive will fail to capture its full, literal force and our deep-seated intuition that moral wrongness *transcends* our contingent attitudes. The explanation requires robust ontology.
      *   **QRE Prediction:** The systematic success of quasi-realism in paraphrasing and explaining all instances of mind-independence talk using only natural facts, conative attitudes, and the internal norms of moral discourse will demonstrate that no additional ontological commitment is necessary or warranted. The "realism" is internal to the practice.
      *   **Bearing:** Tests whether mind-independence is a *substantive metaphysical thesis* (NNMR) or a *projected feature internal to the practice* that expressivism can earn (QRE).

  3.  **Crux: Explanation of Supervenience & Necessity**
      *   **Case:** The necessary supervenience of the moral on the natural. Why *must* a moral difference require a natural difference?
      *   **Argument:** What best explains this necessary connection?
      *   **NNMR Prediction:** Supervenience is best explained as a necessary relation holding between distinct ontological realms: non-natural moral properties are necessarily determined by the underlying natural base properties. The necessity is metaphysical.
      *   **QRE Prediction:** Supervenience is a conceptual constraint *internal* to moral thought and language, reflecting our commitment that moral distinctions must be grounded in reason-giving natural features. It arises from the nature of normative guidance and the demands of consistency in our projected attitudes, not from a relation between distinct properties. The necessity is conceptual/normative.
      *   **Bearing:** Tests whether the deep structure of moral thought (supervenience) points towards an external ontological reality (NNMR) or is generated by the internal logic of the practice itself (QRE).

  **Verbal Disagreements:**

  1.  **"Fact":**
      *   **NNMR:** Uses "moral fact" to denote a *robust, stance-independent state of affairs* in reality. (Substantive usage).
      *   **QRE:** Uses "moral fact" minimally, equivalent to "true moral proposition," earned through the expressive practice. (Minimalist/deflationary usage). The disagreement over whether minimal facts are *all there is* is substantive, but the *word* "fact" itself is often used differently.
  2.  **"Property":**
      *   **NNMR:** Uses "moral property" to denote an *objectively instantiated, non-natural characteristic* of actions/states of affairs. (Robust ontological usage).
      *   **QRE:** Uses "moral property" to denote the *semantic value or predicate-satisfaction conditions* earned within moral discourse, explicitly denying any commitment to robust non-natural instantiation. (Quasi-realist/minimalist usage). The core disagreement is ontological, but the term "property" carries different connotations.
  3.  **"Objectivity":**
      *   **NNMR:** Strongly associates with *mind-independent existence*.
      *   **QRE:** Primarily associates with *procedural standards, impartiality, stability under reflection, and freedom from idiosyncratic bias* – features achievable within the expressivist framework.

  This joint statement captures the significant common ground necessary for meaningful collaboration and debate, while precisely delineating the profound metaphysical and explanatory disagreements that remain at the heart of their philosophical conflict, centered on the nature of moral truth and its relationship to human attitudes and the natural world. The case of the Indifferent Oracle serves as the starkest litmus test for their fundamental divergence.
