prompt: |-
  I am a novelist, about eight books in, and for the past year I have been trying to write down the ethic I actually work by when I put words into the mouths of people who really lived. I have a rough principle, but my own verdicts on cases do not sit under it comfortably, and I would rather be handed a precise principle that costs me something than a vague one that flatters me.

  My tentative principle is this. I think of what I do as borrowing: a real person's name and life are on loan to me, and I pay the interest by keeping the borrower recognizable — by which I mean that a reader who knew the person, or who has read what they left behind, would not have to unlearn anything afterward. Invention, on this view, is licensed wherever the record is silent and forbidden where the record speaks. I call this the loan principle, and I suspect it is either vacuous or false, but I cannot yet say which.

  Here are my cases and my verdicts on them.

  1. A novel about a real nineteenth-century astronomer, documented to the eyelashes in letters and journals, invents a long private conversation between him and his sister in which he says things he never wrote, but which are continuous with positions he took in print. My verdict: not merely permissible but the whole point of the exercise.

  2. The same novel has him, in that same unwitnessed conversation, say something contemptuous about his sister's intelligence, which nothing supports and which cuts against the tone of every surviving letter he wrote to her. My verdict: wrong, and wrong in a way I feel before I can justify it.

  3. A film invents a sexual relationship between two real, still-famous Victorians, both married to other people, about whom nothing on the subject survives. Both have living descendants who speak publicly about the family. My verdict: I flinch, and when I interrogate the flinch I cannot find ground under it — the record is silent, they were adults — so I conclude it is permitted, and I do not like concluding that.

  4. A novel merges three real women of the same circle into one character, gives the composite the documented deeds of all three, changes the name, and discloses the merger in an afterword. My verdict: fine; often better history than a dutiful parade of three thin characters.

  5. A novel about a real town keeps its real, unremarkable inhabitants under their real names — the baker, the sexton, the shopkeeper — and gives the shopkeeper a murder he did not commit, as a subplot. Nothing of him survives; no descendant will ever read the book. My verdict: sharply not fine, and more sharply than in case 3, which I cannot square with the fact that the Victorians in case 3 are the ones with living relatives.

  6. A novel gives a real colonial administrator, on record as having done considerably worse, one specific invented atrocity, while omitting the documented ones. My verdict: I find this nearly fine, and the verdict embarrasses me.

  7. A woman survives in the record as a single line in a parish register; an enslaved man survives as a name in an inventory. A novel gives each of them a full invented inner life. My verdict: not only permitted but, I think, required of anyone who wants to write about them at all.

  What I want from you is not a survey of what critics or other novelists have said, and certainly not a reading list. I want the principle, or a small set of candidate principles, stated precisely enough that I could apply them to a manuscript in front of me. For each clause, tell me which of my seven cases motivates it. Then give me your own verdicts on at least three cases I have not listed, including at least one chosen to make the principle fail. Then tell me, honestly, which of my seven verdicts the principle cannot accommodate and which one I should surrender, and whether the choice between saving all seven at the cost of complexity and saving a clean principle at the cost of one verdict is a real choice or a false one. Finally, address the borrowing metaphor directly: does it do any work, or is it a euphemism? If the debt is real, who holds it, what discharges it, and does it matter that the debtor cannot correct the ledger? I am interested in whether the wrong here is done to the dead person, to the record, or to the living reader — and whether those come apart in any of my cases.
reasoning: |-
  Okay, this novelist has presented a fascinating ethical dilemma about using real people in fiction. They've shared their tentative "loan principle" and seven specific cases where their intuitive judgments conflict with that principle. The core tension seems to be between historical accuracy and creative necessity.

  Let me unpack their loan principle first. The borrowing metaphor suggests real people's identities are lent to the author, who must pay "interest" by maintaining recognizability. But as the author suspects, this might be flawed - is recognizability about factual accuracy or essential truth? Case 1 (astronomer's invented conversation) feels justified because it aligns with documented positions, while case 2 (invented contempt) feels wrong despite equal lack of documentation. That's the first crack in the principle.

  Looking at their other cases: Case 3 (invented affair) gives discomfort despite permissible silence; case 4 (composite character) feels ethical with disclosure; case 5 (fictional murder for real shopkeeper) feels sharply wrong; case 6 (invented atrocity for documented villain) feels oddly acceptable; case 7 (inventing inner lives for barely-documented people) feels obligatory. These reactions reveal multiple ethical dimensions beyond just factual gaps.

  I'm considering proposing a three-part principle that distinguishes between:
  - Core identity (must be preserved)
  - Documented facts (must not contradict)
  - Silent spaces (invention permitted with constraints)

  For core identity, we'd protect essential traits (case 2's contempt violates the astronomer's documented respect). For documented facts, we'd prohibit contradictions (case 5's fictional murder conflicts with historical reality). For silent spaces, invention would require justification (case 7's inner lives are justified by historical necessity, while case 3's affair isn't).

  The borrowing metaphor might need refinement. It's not just about returning the identity undamaged, but about respecting the person's legacy. The debt is to historical truth itself - owed not just to the dead but to living readers and future understanding. Case 6 is particularly troubling because inventing atrocities for real villains distorts historical specificity, even if the person "deserves" it.

  For new test cases: A fictionalized account showing a real pacifist advocating violence would violate core identity. Inventing a secret artistic talent for a documented non-artist might be permissible if irrelevant to their historical role. But putting undocumented racist slurs in a civil rights leader's mouth would fail all three tests.

  Ultimately, the author might need to surrender their verdict on case 6 - inventing specific atrocities risks falsifying history even for villains. The complexity of preserving all seven intuitions suggests genuine ethical tension rather than flawed reasoning. The borrowing metaphor works if we see the lender as collective historical memory, repaid through responsible representation that serves truth.
answer: |-
  Your ethical struggle is profound and your cases meticulously chosen. Below is a precise principle distilled from your verdicts, followed by analysis, new test cases, and direct engagement with your questions. The principle prioritizes **integrity to the documented essence** over strict literalism.

  ---

  ### **The Proposed Principle: The Essence-Integrity Standard**
  **A.** **Core Identity Inviolability:**  
  *Never contradict documented facts or traits fundamental to the person’s historical identity.*  
  **Motivated by:** Case 2 (contempt for sister violates documented respect), Case 5 (fictional murder violates shopkeeper’s unremarkable reality).  

  **B.** **Silence as Creative Space:**  
  *Where the record is silent, invention is permitted **only if**:*  
  1. *It aligns with documented traits, actions, or context (Case 1, 7),*  
  2. *It avoids gratuitous harm to the person’s core integrity or legacy (Case 3, 6),*  
  3. *It serves a purpose beyond sensationalism (Case 4, 7).*  

  **C.** **Transparency & Proportionality:**  
  *When invention significantly alters or compresses history:*  
  1. *Disclose material distortions (Case 4),*  
  2. *Weight of invention must not eclipse documented reality (Case 6).*  

  **D.** **Restorative Justice for the Erased:**  
  *For those marginalized by history (Case 7), invention is not just permitted but ethically necessary to counteract archival silence, provided it respects their humanity and context.*  

  ---

  ### **Verdicts on Your Cases Under the Principle**
  1. **Permissible:** Aligns with documented positions (B1).  
  2. **Forbidden:** Violates core identity (A).  
  3. **Conditionally Forbidden:** While record is silent, it risks gratuitous harm to legacy (B2); absent compelling narrative purpose, it fails (B3).  
  4. **Permissible:** Transparency + serves historical clarity (C1, C2).  
  5. **Forbidden:** Contradicts documented reality (A); harms an "unremarkable" life gratuitously (B2).  
  6. **Forbidden:** Invented atrocity distorts historical specificity (A); eclipses documented crimes (C2). (*Your verdict "nearly fine" must be surrendered.*)  
  7. **Permitted & Required:** Restores erased humanity (D); no documented essence to violate.  

  ---

  ### **New Test Cases & Verdicts**
  1. **A novel depicts a real pacifist (documented in speeches) privately advocating violence.**  
     *Verdict: **Forbidden**.* Violates core identity (A).  

  2. **A film invents a secret artistic talent for a real scientist with no documented creative interests.**  
     *Verdict: **Permissible**.* Silent record; adds dimension without harming essence (B1, B2).  

  3. **A play gives an undocumented racist slur to a real civil rights leader.**  
     *Verdict: **Forbidden**.* Contradicts core identity (A); gratuitous harm (B2). (*Makes the principle fail: If no "proof" exists they *didn’t* say it, but it destroys their essence.*)  

  ---

  ### **Addressing Tensions & Tradeoffs**
  - **The Cost of Saving All Seven:** Your verdict on **Case 6** (invented atrocity) cannot stand under this principle. Surrendering it is necessary; inventing specific crimes for real people distorts history, even for villains. Complexity would undermine ethical clarity.  
  - **False Choice?** It’s real. Your intuition in Case 6 prioritizes narrative impact over historical integrity. The principle rejects this tradeoff.  

  ---

  ### **Dissecting the Borrowing Metaphor**
  **Does it work?**  
  Yes, but as a *limited* metaphor. It frames ethics as debt, not ownership.  

  **Who holds the debt?**  
  - **The dead:** Only if we accept they retain posthumous interests (legacy, dignity).  
  - **The living:** Descendants (Case 3), communities (Case 7), and society (truth/record).  
  - **The record itself:** As a shared cultural resource.  

  **What discharges it?**  
  - **Integrity:** Faithfulness to their documented essence (A).  
  - **Restoration:** For the erased, amplifying their humanity (D).  
  - **Transparency:** Acknowledging invention where it matters (C1).  

  **Can the debtor correct the ledger?**  
  No—which makes the debt heavier. Fiction often becomes "history" to readers. Case 5’s shopkeeper cannot refute murder; Case 3’s descendants cannot refute an affair. The wrong is **to all three**: the dead (distorted legacy), the record (polluted), and living readers (misled).  

  **Where they come apart:**  
  - Case 3: Wrong to descendants (embarrassment) and record (salacious fiction), but arguably not to the dead (no "harm" to their essence if record is truly silent).  
  - Case 5: Wrong to the dead (falsified life) and record, but not to living (no descendants).  
  - Case 7: Right to the dead (restored dignity) and living (truth-telling), but "wrong" to a literalist view of the record.  

  ---

  ### **Conclusion**
  Your loan principle is neither vacuous nor false—it’s incomplete. **Essence-Integrity** tightens it: not just "recognizability," but fidelity to the *core self* history captured. Silence permits invention, but within ethical guardrails. The metaphor holds if "interest" means protecting the person from misrepresentation, not just factual consistency.  

  **What you sacrifice:** The freedom to invent damning specifics for the "deserving" (Case 6) or salacious unknowns (Case 3). What you gain: A bulwark against the moral flinch, grounded in the dead’s right to their own story. The ledger cannot be corrected—so write as if the subject will read it.
