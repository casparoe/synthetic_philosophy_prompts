prompt: |-
  Last night a friend and I argued for about three hours about whether inverse reinforcement learning can ever be a route to learning what people actually value, and we ended somewhere I think is a genuine research question rather than a rehash of the usual optimism-versus-skepticism. His case was the identifiability one: when the dynamics are held fixed, any two reward functions that differ by a potential function over states — the shaping transformation — induce exactly the same optimal behavior, so demonstrations cannot distinguish them; and once you stop assuming the dynamics are known, the set of reward-and-transition pairs consistent with the data balloons further. The standard responses (a maximum-entropy prior over reward functions, a Bayesian posterior, restricting attention to shaping-invariant formulations) all concede his point and then quietly pick a representative of the equivalence class, which is harmless if all you want is a policy but looks like sleight of hand if what you claim to be doing is recovering preferences. My counter was that this only shows we have been asking the learner to output the wrong kind of object, and that I would rather it output the ambiguity — but when he pressed me on what that would even mean formally, I had nothing. What I want to propose is a project that makes the ambiguity the object of inference rather than an obstacle to it.

  The half-formed idea, which I would like you to turn into something defensible: separate two things the literature tends to run together, namely recovering a point-valued preference ranking over trajectories and reporting which further observations or interventions would discriminate among the reward functions still consistent with the data. Concretely, the learner should return, alongside whatever point estimate it produces, (i) the partial order on trajectories that every member of the consistent set agrees on, (ii) the set of unresolved comparisons, and (iii) for each unresolved comparison, an account of what query or intervention would resolve it and how much of the residual ambiguity is attributable to the demonstrator's own bounded rationality rather than to the data — since if the demonstrator is modeled as only approximately optimal, the rationality parameter and the preferences are inferred jointly and can trade off against each other, so the demonstrator's preferences and the demonstrator's competence are not separately identifiable either. I suspect this third point is the load-bearing one and that the first two are mostly bookkeeping, and I would be happy to be shown wrong about that, but the proposal should be written so that a reader can see which way the argument would have to go.

  I am applying for a one-year fellowship and need a two-page proposal. Please state the central question precisely enough that it has a determinate answer, and explain why the existing technical fixes leave it open rather than merely inconvenient; describe the approach and why it is the right one rather than the obvious alternatives (for instance, why not simply widen the prior, or report a credible interval and be done); lay out what I would actually do, roughly month by month, for a project that is analytic and small-scale rather than a large empirical study; and say what a successful result would look like and, more importantly, what would count as the project failing — I think the interesting failure mode is that the third component turns out not to be inferable from behavior at all, in which case the whole thing collapses back into the standard problem, and I want the proposal to be honest about that risk. Keep it to the two pages, and don't bother with citations or a literature review — refer to positions and arguments as needed and I will supply the references myself.
reasoning: |-
  We are writing a two-page research proposal for a fellowship. The central concern is that inverse reinforcement learning (IRL) cannot uniquely identify the true reward function due to identifiability issues (shaping ambiguity, unknown dynamics, and the competence-preference trade-off). The goal is to shift the focus from recovering a point estimate of the reward to explicitly representing and reducing the ambiguity.

  The proposal should have:

  1. **Central Question**: Precisely stated, with a determinate answer.
  2. **Critique of Existing Approaches**: Why current fixes (max entropy, Bayesian, shaping-invariant) leave the problem open.
  3. **Approach**: Why the proposed method (separating the partial order, unresolved comparisons, and a plan for disambiguation) is better than obvious alternatives (e.g., wider priors, credible intervals).
  4. **Plan**: Month-by-month breakdown for a one-year, analytic project.
  5. **Success and Failure Criteria**: What a successful result looks like, and the key failure mode (if the third component is not inferable).

  We must be concise and fit within two pages.

  ---

  **Proposal: Disambiguating Preferences in Inverse Reinforcement Learning**

  **1. Central Question**

  Can we design an inverse reinforcement learning (IRL) framework that, given demonstrations from a bounded-rational agent, explicitly represents the ambiguity in the inferred reward function and provides actionable queries to reduce this ambiguity, thereby enabling the recovery of the agent's true preferences?

  The question has a determinate answer: either (a) such a framework is possible and we can characterize the ambiguity and the disambiguating queries, or (b) it is impossible because the ambiguity is inherently unresolvable from behavioral data alone (even with bounded rationality).

  **2. Why Existing Approaches Leave the Problem Open**

  Current IRL methods address ambiguity by:

  - **Shaping-invariant representations**: These methods (e.g., using state-only features) avoid shaping ambiguity but still cannot resolve other ambiguities (e.g., due to unknown dynamics) and do not capture the full set of consistent rewards.
  - **Bayesian methods**: They return a posterior distribution over rewards, but this posterior conflates ambiguity due to limited data with ambiguity due to the agent's bounded rationality (since the rationality parameter and reward are inferred jointly). Moreover, the posterior does not explicitly indicate how to resolve the ambiguity.
  - **MaxEnt IRL**: It picks a single reward (the maximum entropy one) without accounting for the equivalence class of rewards that explain the data equally well under the assumed dynamics.

  These methods "solve" IRL by picking a representative from the equivalence class, which is adequate for policy imitation but fails for preference recovery. They do not:

  - Separate the partial order of trajectories that is consistent across all possible rewards (i.e., the robust ordinal preferences).
  - Identify which trajectory comparisons remain unresolved and why (due to insufficient data, unknown dynamics, or the agent's bounded rationality).
  - Propose interventions (e.g., new demonstrations or preference queries) to resolve the ambiguity.

  Thus, the identifiability challenge remains open: without additional structure, we cannot recover the true reward, and existing methods obscure the residual ambiguity.

  **3. Proposed Approach: Ambiguity-Aware IRL**

  We propose an IRL framework that outputs three components:

  (i) **The robust partial order**: The set of pairwise trajectory comparisons (τ_i ≻ τ_j) that hold for every reward function consistent with the data and the bounded rationality model.

  (ii) **The unresolved comparisons**: The set of trajectory pairs for which the preference direction (τ_i ≻ τ_j vs τ_j ≻ τ_i) depends on the choice of reward function within the consistent set.

  (iii) **Disambiguating interventions**: For each unresolved comparison, an account of:
     - The type of query (e.g., a new demonstration, a preference query, or an intervention in the environment) that would resolve the comparison.
     - The contribution of the bounded rationality parameter to the ambiguity (i.e., how much of the ambiguity is due to the agent's suboptimality rather than the data).

  *Why this approach?*

  - **Beyond point estimates and intervals**: A Bayesian credible interval does not reveal the structure of the ambiguity (e.g., which comparisons are affected) or how to reduce it. Our method explicitly represents the ambiguity and provides a disambiguation strategy.
  - **Beyond widening the prior**: A wider prior only increases the variance of the posterior without addressing the identifiability issues. Our approach instead characterizes the ambiguity and uses it to design active learning.
  - **Why disambiguating interventions?** The key insight is that ambiguity is not just noise but structured uncertainty that can be reduced by targeted interactions. The third component is crucial because it transforms the problem from passive inference to active disambiguation.

  *Why is the third component load-bearing?*

  The bounded rationality model (e.g., a Boltzmann rationality model with parameter β) introduces a trade-off: the same behavior can be explained by a high-reward function with low β (low competence) or a low-reward function with high β (high competence). Without interventions, we cannot break this trade-off. But by designing queries that are maximally informative for both the reward and β, we can reduce the joint ambiguity. We hypothesize that the ambiguity attributable to bounded rationality can be quantified and reduced via targeted queries.

  **4. Research Plan**

  *Month 1-2: Formalization of Ambiguity*
  - Define the set of consistent reward functions and bounded rationality parameters (β) given the data (demonstrations) and a known dynamics model. Characterize the equivalence classes induced by shaping and bounded rationality.
  - Define the robust partial order (i.e., the comparisons that hold for all consistent (R, β)).

  *Month 3-4: Unresolved Comparisons and Ambiguity Attribution*
  - Develop an algorithm to compute the set of unresolved comparisons (trajectory pairs that are ordered differently by different consistent (R, β)).
  - Attribute the ambiguity for each unresolved comparison to two sources: (a) insufficient data (which could be resolved by more data) and (b) the bounded rationality trade-off (which requires disambiguating β from R).

  *Month 5-6: Designing Disambiguating Interventions*
  - For each unresolved comparison, design a query (e.g., a request for a demonstration in a specific state, or a preference query between two trajectories) that maximizes the expected reduction in ambiguity.
  - Develop a metric for the "rationality-attributable ambiguity" (e.g., the range of β values that are consistent with the data) and show how it affects the ambiguity in preferences.

  *Month 7-8: Extension to Unknown Dynamics*
  - Relax the known dynamics assumption. Model the consistent set of (R, P, β) where P is the transition function. Characterize the additional ambiguity and extend the robust partial order and intervention design.

  *Month 9-10: Algorithm Implementation and Toy Examples*
  - Implement the framework in a gridworld environment with synthetic agents. Test the ambiguity representation and the effectiveness of the disambiguating queries.
  - Measure the reduction in the size of the consistent set and the resolution of the robust partial order after each query.

  *Month 11-12: Analysis and Write-up*
  - Theoretical analysis: Under what conditions can the ambiguity be resolved? What are the limits (e.g., when the agent's true β is 0, meaning random behavior, no preferences can be inferred)?
  - Characterize the failure modes and the potential for full disambiguation.
  - Prepare a manuscript for a conference (e.g., NeurIPS or ICML).

  **5. Success and Failure Criteria**

  *Success*: The project succeeds if we can:
  - Formally define and compute the robust partial order and the set of unresolved comparisons.
  - Show that disambiguating interventions (queries) can resolve a significant portion of the ambiguity, especially when the ambiguity is due to the bounded rationality trade-off.
  - Demonstrate in simulations that the method recovers the true partial order of preferences with fewer queries than baseline methods (e.g., active IRL with Bayesian updates).

  *Failure*: The project fails if:
  - The third component (disambiguating interventions) cannot be inferred from behavior. This occurs if the ambiguity due to the bounded rationality trade-off is irreducible by any query (i.e., the same behavior is consistent with multiple (R, β) pairs that induce different preferences, and no query can break the symmetry). In this case, the framework collapses to the standard IRL problem, and we must conclude that preferences and competence are fundamentally inseparable from behavioral data alone. This negative result would be valuable for the field.

  In either case, the project will clarify the limits of preference learning from demonstrations and provide a rigorous framework for representing and reducing ambiguity in IRL.

