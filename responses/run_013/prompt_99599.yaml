answer: |-
  ### Proposal: Disambiguating Preferences in Inverse Reinforcement Learning  

  **Central Question**  
  Can an inverse reinforcement learning (IRL) framework explicitly represent and reduce ambiguity in inferred preferences by:  
  (i) identifying the partial order of trajectories consistent with all reward functions explaining the data;  
  (ii) isolating unresolved pairwise comparisons; and  
  (iii) providing targeted interventions to disambiguate these, while quantifying the role of the demonstrator’s bounded rationality?  
  The answer is determinate: either (a) such a framework can be formalized and the ambiguity attributable to bounded rationality is reducible via interventions, or (b) the third component is fundamentally non-inferable from behavior, collapsing the approach to standard IRL.  

  **Why Existing Fixes Leave the Problem Open**  
  Current IRL methods sidestep identifiability issues rather than resolve them:  
  - **Shaping-invariant rewards** (e.g., state-only features) avoid potential-based equivalence classes but ignore ambiguities from unknown dynamics or rationality trade-offs.  
  - **Bayesian posteriors/credible intervals** represent uncertainty quantitatively but conflate distinct sources of ambiguity (e.g., sparse data vs. demonstrator suboptimality) and fail to specify *how* to resolve it.  
  - **Max-entropy priors** select a single representative reward, obscuring the equivalence class structure.  
  These approaches prioritize policy mimicry over preference recovery. They assume the ambiguity is noise to be marginalized away, not a structured object to be interrogated. Critically, none address the joint non-identifiability between rewards and the rationality parameter (e.g., Boltzmann temperature β), where identical behavior can stem from high rewards with low rationality or low rewards with high rationality. Widening the prior or reporting intervals only inflates uncertainty without clarifying its origin or resolution path.  

  **Proposed Approach: Ambiguity as the Object of Inference**  
  We reframe ambiguity not as a nuisance but as the core output, with three components:  
  1. **Robust partial order**: The set of trajectory pairs \((\tau_i, \tau_j)\) where \(\tau_i \succ \tau_j\) holds for every reward-transition-rationality tuple \((R, P, \beta)\) consistent with the data.  
  2. **Unresolved comparisons**: Pairs \((\tau_k, \tau_l)\) where the preference direction depends on the \((R, P, \beta)\) choice within the consistent set.  
  3. **Disambiguating interventions**: For each unresolved pair, a query (e.g., "Demonstrate in state \(s\)" or "Compare \(\tau_k\) and \(\tau_l\)") that maximizes expected information gain, alongside a rationality-attributable ambiguity (RAA) score. RAA quantifies the fraction of ambiguity due to \(\beta\)-reward trade-offs (e.g., via the variance of \(\beta\) in the consistent set).  

  *Why this approach over alternatives?*  
  - **Credible intervals** lack structure: They do not distinguish *which* preferences are ambiguous or *why*. Our method explicitly partitions the preference space into known and unknown.  
  - **Active learning baselines** (e.g., querying states with high value function variance) optimize for policy uncertainty, not preference identifiability. We target queries that directly resolve reward comparisons while disentangling rationality.  
  - **RAA is load-bearing**: If RAA can be inferred, interventions can exploit the \(\beta\)-reward trade-off (e.g., a query that forces high-\(\beta\) agents to reveal true preferences). If not, the method reduces to passive ambiguity reporting. This makes RAA the critical test of the framework.  

  **Research Plan**  
  *Months 1–2: Formalize consistent sets and partial orders*  
  - Define the consistent set \(\mathcal{C}\) of \((R, P, \beta)\) under known dynamics, bounded-rational demonstrators (e.g., Boltzmann model), and given trajectories. Characterize shaping and \(\beta\)-induced equivalence classes.  
  - Output: Algorithm to compute the robust partial order (provably safe via intersection over \(\mathcal{C}\)).  

  *Months 3–4: Attribute ambiguity and compute RAA*  
  - For unresolved comparisons, decompose ambiguity into: (a) data sparsity (resolvable via more observations), and (b) \(\beta\)-reward trade-offs (RAA).  
  - Define RAA as \(\text{Var}(\beta)/[\text{Var}(R) + \text{Var}(\beta)]\) over \(\mathcal{C}\), normalized to \([0,1]\).  
  - Output: Metrics for RAA and a method to isolate \(\beta\)-driven ambiguity.  

  *Months 5–6: Design disambiguating interventions*  
  - For high-RAA pairs, generate queries that maximize information gain on both \(R\) and \(\beta\) (e.g., via Fisher information). For low-RAA pairs, prioritize environment exploration.  
  - Output: Query generator with theoretical guarantees on ambiguity reduction.  

  *Months 7–8: Extend to unknown dynamics*  
  - Relax known-\(P\) assumption. Model \(\mathcal{C}\) for \((R, P, \beta)\) and extend partial orders/interventions via sensitivity analysis on \(P\).  
  - Output: Robustness analysis of the framework under transition uncertainty.  

  *Months 9–10: Validation on toy environments*  
  - Simulate gridworld/Navigation tasks with synthetic agents (varying "true" \(R\) and \(\beta\)). Evaluate:  
    (a) Correctness of partial orders;  
    (b) Reduction in unresolved comparisons per query;  
    (c) RAA accuracy against ground truth.  
  - Compare to baselines (Bayesian IRL with credible intervals, max-entropy IRL).  

  *Months 11–12: Consolidation and failure analysis*  
  - Theoretical limits: Prove conditions where RAA is non-inferable (e.g., when \(\beta \to 0\) implies no preferences are identifiable).  
  - Final output: Framework prototype; manuscript establishing success or failure of RAA.  

  **Success and Failure Criteria**  
  - **Success**: The framework (i) correctly identifies robust partial orders in toy tasks, (ii) reduces unresolved comparisons by >50% with ≤5 queries, and (iii) achieves RAA error <10% against synthetic ground truth. This would demonstrate that ambiguity *can* be structured and rationality-attributable components *can* guide disambiguation.  
  - **Failure**: The critical failure mode is RAA being non-inferable—i.e., queries cannot reduce \(\beta\)-reward ambiguity because behavior equally supports disjoint \((R, \beta)\) pairs. This would imply preferences and competence are indistinguishable from observations alone, collapsing the approach to standard IRL. We will:  
    (a) Quantify RAA inferability in simulations (e.g., via query-induced divergence in \(\mathcal{C}\));  
    (b) Establish theoretical bounds (e.g., if \(\beta\) is unidentifiable under all queries, RAA fails).  
    Such failure advances the field by clarifying the limits of preference learning.  

  This project shifts IRL from point estimates to ambiguity-aware inference, with rigorous criteria for success or a defensible limit result.
