prompt: |-
  I'm a journalist who writes about ethics and technology, and there's an arguement pattern I keep running into that I don't have a name for, and it's driving me alittle crazy. It goes like this. Someone insists there are things you simply may not do -- torture a prisoner, lie under oath, kill an innocent person -- full stop, no exceptions for good consequences. Fine. Then someone asks the obvious thing: but what if torturing this one prisoner stops the guards from torturing fifty others? What if killing this one innocent stops a massacre? And the person won't budge. They say no, that is exactly what you may not do, and it has nothing to do with the numbers. Then comes the objection I can't stop thinking about: so you'd rather let fifty people get tortured than get your own hands dirty once? You're treating the rule as more important than the very thing the rule exists to protect. The rule against torture is somehow forbidding you to prevent torture. It's like a fire code that won't let you burn down one building to stop a fire from spreading to the whole block.

  That last turn is the part I want a word for. I've heard people call rules like this absolute, or inviolable, or side constraints, but that is naming the rule being attacked, not the attack. I've also noticed cousins of it in other places: you can't break a promise in order to keep someone else from breaking a bigger one; you can't lie to head off a lie that would do more damage; a lawyer can't commit a small crime to prevent a bigger one. Is that all one puzzle or several?

  What I actually want, more than the label, is the shape of the thing. Is it a genuine paradox -- the view contradicting itself -- or just a counterintuitive result people don't like? Does it only bite when the rule is absolute, or does it show up for rules that admit exceptions too? How is it different from the nearest ideas that already have names -- the one where the right act is whatever produces the best overall outcome, and the one about limits on what you're allowed to do to people even when violating them would help everyone? And if there honestly isn't a single established term for exactly this, say so, then give me the best name you can and define it, with a couple of cases that clearly fall inside it and a couple that fall just outside.

  Plain English where you can, please -- I'm not a philosopher -- but don't flatten the real distinctions. American spelling. And at the very end, give me one line I can paste into my notes that begins Verdict: and names the phenomenon in a phrase or two.
reasoning: |-
  Okay, let me tackle this journalist's query. They're describing a recurring argument pattern in ethics debates: someone insists on absolute moral rules (no torture, no killing innocents), rejects consequentialist exceptions even to prevent greater harm, and then faces the objection that such rigidity prioritizes rules over the very values they protect. The journalist wants to name and dissect this specific objection.

  First, I need to map the core tension:
  - **Deontology's dilemma**: Absolute rules create a paradox where following them enables greater violations of the same principle. The "clean hands" stance becomes complicit in others' dirtier hands.
  - **Distinguishing features**: This isn't just about rules vs consequences generally; it's about the rule *contradicting its own purpose* in extreme scenarios. Key differentiators:
    - Vs. simple utilitarianism: The objection accepts deontology's framework but attacks internal consistency.
    - Vs. threshold deontology: This specifically targets *absolutist* positions that refuse threshold exceptions.
    - Vs. dirty hands: Focuses on the rule's self-defeating nature, not just moral distress.

  Checking philosophical labels:
  - "Moral self-defeat" comes close but is too broad.
  - "Deontological paradox" is descriptive but vague.
  - "Paradox of absolutism" captures the core conflict best—highlighting how absolutes become self-undermining in crises.

  Testing boundary cases:
  - **Inside**: Torture to prevent more torture, breaking a small promise to prevent promise-breaking spree.
  - **Outside**: Stealing medicine to save a life (no self-contradiction, just rule vs consequence), lying to avoid embarrassment (no greater harm prevention).

  The verdict phrase needs precision: "absolutism's self-defeat effect" emphasizes the mechanism, while "paradox of deontological purity" nods to the clean-hands imagery journalists might favor. Leaning toward the latter for rhetorical punch.

  Final refinement: Ensure "paradox" is justified—yes, because it reveals a logical tension (rules preventing their own fulfillment), not just discomfort.
answer: |-
  You're describing a profound and recurring ethical dilemma—one that cuts to the heart of moral philosophy. The core tension is **when an absolute moral rule forbids an action that would prevent *greater violations of that same rule* by others**, making adherence to the rule seem self-defeating (e.g., "I can't torture one to save fifty from torture"). This isn't just about rules versus consequences—it's about rules *undermining their own purpose* in extreme scenarios. Below, I'll break it down step by step, define the phenomenon, and give you a clear label.

  ### The Shape of the Thing: Key Features
  1. **It’s a genuine paradox, not just a counterintuitive result**:  
     - The rule claims to protect a value (e.g., human dignity), but in exceptional cases, following it leads to *more* violations of that value. This creates an internal contradiction: *The rule is blocking its own goal*.  
     - **Example**: A "no torture" rule exists to minimize suffering, but if torturing one person could prevent fifty tortures, refusing to do so arguably *maximizes* suffering—the very thing the rule aims to prevent. The rule becomes self-defeating.

  2. **It bites hardest with absolute rules, but shows up elsewhere**:  
     - **Absolutes**: If a rule has *no exceptions* (e.g., "never kill an innocent"), this paradox is unavoidable. It forces a choice between violating the rule or allowing worse violations.  
     - **Non-absolutes**: Even rules with exceptions can face this tension if the exception isn't clearly defined. For instance, "don't lie, except to save lives" might still clash if lying could prevent *more* lies (e.g., lying to stop a conspiracy of lies). But here, the paradox is weaker—you could argue the exception *should* cover this.

  3. **How it differs from familiar ideas**:  
     - **Vs. Utilitarianism (maximize overall good)**: Utilitarians would say torturing one to save fifty is *obviously* right. This paradox attacks *non*-utilitarians (e.g., deontologists) by showing their absolutism leads to worse outcomes *by their own standards*.  
     - **Vs. Side Constraints (limits on what you can do to others)**: Side constraints (e.g., "don’t use people as mere means") explain *why* you can’t torture the one. But this paradox asks: *What if violating the constraint is the only way to stop others from violating it more?* It’s a challenge to the coherence of those constraints when they enable greater harm.  
     - **Vs. "Dirty Hands" (doing wrong for the greater good)**: "Dirty hands" focuses on the moral residue of violating a rule. This paradox is sharper: it claims the rule itself is *illogical* because it demands complicity in greater rule-breaking.

  ### Is There an Established Term?  
  No single term perfectly captures this *specific* objection. Philosophers often call it:  
  - **The "paradox of deontological constraints"** (emphasizing the self-defeating logic)  
  - Or **"absolutism's self-defeat problem"** (highlighting how rigid rules backfire).  
  But these label the *rule's flaw*, not the *objection* you’re naming. For the *objection itself*—the "How can you let fifty suffer to keep your hands clean?" move—the closest existing concept is **"the consequentialist critique of deontology."** Still, that’s too broad.  

  ### The Best Name for This Objection: **The Paradox of Moral Purity**  
  **Definition**: The charge that an absolute moral rule, when followed rigidly in extreme cases, becomes self-defeating by allowing greater violations of the very value it protects—thereby prioritizing the actor's "clean hands" over the rule's intended purpose.  

  #### Why this works:  
  - **"Paradox"**: Signals the logical tension (the rule sabotages itself).  
  - **"Moral Purity"**: Targets the refusal to "get dirty" to prevent worse dirtiness.  
  - It names the *attack*, not the rule.  

  ### Clear Cases: Inside vs. Outside the Phenomenon  
  **Inside the Paradox** (the rule blocks prevention of its own violation):  
  1. **Torture**: Refusing to torture one to save fifty from torture.  
  2. **Promises**: Refusing to break a small promise (e.g., "I won't disclose your secret") to stop someone else from breaking a catastrophic promise (e.g., a politician hiding evidence of genocide).  
  3. **Lying**: Refusing to tell a small lie to prevent a larger, damaging lie (e.g., lying to a hacker to stop them from spreading false information that would ruin lives).  

  **Outside the Paradox** (no self-defeating logic):  
  1. **Stealing medicine to save a life**: If the rule is "don’t steal," stealing medicine to save one life doesn’t prevent more theft—it just trades one wrong for a good outcome. No paradox, just rule vs. consequence.  
  2. **Killing an attacker in self-defense**: This is a justified exception to "don’t kill," not a case where killing one prevents more killings *by others*.  
  3. **Breaking a promise for convenience**: If you break a promise to avoid minor hassle, you’re not preventing greater promise-breaking—you’re just violating the rule.  

  ### Verdict:  
  **Verdict: "The paradox of moral purity"—when absolute moral rules forbid actions that would prevent greater violations of those same rules, prioritizing the actor's integrity over the rule's purpose.**  

  This should give you a precise lens for your writing. If you dive deeper, look at debates between "threshold deontology" (rules can bend in extreme cases) and hardline absolutism (e.g., Kant or modern human rights frameworks). Real-world cases like "ticking time bomb" scenarios or whistleblowing often trigger this clash.
