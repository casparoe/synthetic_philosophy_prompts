prompt: |-
  I have been a longtime reader of LessWrong, the EA Forum, and related blogs, and I keep running into a move that I can no longer tell whether it is a theorem or a metaphor. A friend in my local rationalist reading group argues that Harsanyi's aggregation theorem settles the foundations of social choice: he says that choosing for a society is just choosing for yourself under uncertainty. You imagine yourself behind a veil of ignorance, not knowing which person you will be; each possible identity is a state of nature; you assign probabilities; you maximize expected utility; and the theorem then shows that any social ranking that respects unanimous individual preferences and satisfies expected-utility axioms must be a weighted sum of individual utilities. He takes this to license utilitarianism, and more specifically to show that any non-utilitarian social welfare function is either irrational or inconsistent with taking people impartially. I want to audit the analogy rather than the theorem, because I suspect the theorem is being carried by the picture.

  The analogy is between an individual decision under risk and a society aggregating utilities. I would like you to treat it as an argument and ask how far it holds. What plays the role of the decision-maker, the states of nature, the probabilities, the outcomes, and the utility function? Which parts of Harsanyi's setup are genuinely parallel to a single person's expected-utility calculation, and which are stipulations that the analogy makes look natural? Where does the mapping break -- for example, is there an actual chooser behind the veil, are the probabilities ethical weights or subjective degrees of belief, does the ex ante perspective treat persons as separable bearers of utility in a way that ordinary risk does not, and what work is done by the assumptions of interpersonal comparability and expected-utility representation? I am especially interested in what the analogy quietly imports from the source: the picture of a single rational agent with a unified utility function, the idea that identities are like lottery outcomes, and the suggestion that impartiality is just equiprobability. Finally, tell me whether the conclusion my friend wants -- that Harsanyi's theorem forces utilitarianism, or at least makes it the uniquely rational social choice -- survives once those disanalogies are on the table, or whether the theorem only gives a representation result whose ethical content comes entirely from the Pareto and veil assumptions.

  Please structure the response as follows. First, a section titled The analogy and its intended work, about one paragraph, stating the mapping and the conclusion it is being used to support. Second, a section titled Correspondence table, giving a table with a row for each element of the source (individual chooser, states of nature, probabilities, outcomes, utility function, expected utility maximization) and the corresponding element in the target, plus a brief note on how tight each correspondence is. Third, a section titled Where the mapping breaks, two or three paragraphs, separating the disanalogies that matter for the intended conclusion from those that do not. Fourth, a section titled What the analogy imports, one paragraph, on the commitments the picture smuggles in. Fifth, a section titled Verdict on the conclusion, one paragraph, saying whether the friend's conclusion survives, and if not, what weaker conclusion the theorem actually supports. Sixth, a section titled A better analogy, one paragraph, if there is one. I do not need citations or a reading list; I want the audit.
reasoning: |-
  We are going to audit the analogy between individual decision-making under risk and social choice via Harsanyi's aggregation theorem. The goal is to see whether the analogy holds and whether it supports the conclusion that utilitarianism is the uniquely rational social choice.

  ## The analogy and its intended work

  The analogy maps an individual decision under risk to a social choice problem. In the individual case, a decision-maker chooses an action without knowing which state of nature will obtain; they assign probabilities to states and maximize expected utility. In the social case, the decision-maker is behind a "veil of ignorance" and does not know which person in society they will become. Each possible identity is a state of nature, and the chooser assigns probabilities to these identities. The outcomes are the well-being levels of individuals in the society. The chooser then maximizes expected utility, which, according to Harsanyi's theorem, becomes a weighted sum of individual utilities. The intended work of the analogy is to show that social choice must be utilitarian (i.e., a weighted sum of individual utilities) if we respect the Pareto principle and the axioms of expected utility, and that any non-utilitarian approach is either irrational or violates impartiality.

  ## Correspondence table

  | Element in individual decision under risk | Corresponding element in social choice (Harsanyi) | Tightness of correspondence |
  |------------------------------------------|-------------------------------------------------|------------------------------|
  | Individual chooser                       | Impartial observer (behind the veil)            | Loose: The observer is a hypothetical construct, not a real person. |
  | States of nature                         | Identities (which person you will be)           | Moderate: Identities are mutually exclusive and exhaustive, but they are not states of the world in the usual sense. |
  | Probabilities                            | Weights (ethical or subjective) over identities | Loose: In Harsanyi, the weights are often interpreted as ethical weights, but the theorem allows any probabilities. The ethical interpretation (like equal probability for impartiality) is an addition. |
  | Outcomes                                 | Distributions of well-being (utilities) across individuals | Tight: The outcomes are vectors of individual utilities. |
  | Utility function (over outcomes)         | Social welfare function (over utility vectors) | Moderate: The theorem requires that the social welfare function satisfies the expected utility axioms. |
  | Expected utility maximization            | Social choice by maximizing weighted sum of individual utilities | Tight: The theorem shows that under the assumptions, the social welfare function must be a weighted sum. |

  ## Where the mapping breaks

  The analogy breaks in several places that matter for the intended conclusion.

  First, in the individual decision case, there is an actual chooser with a unified utility function, and the probabilities represent their subjective beliefs about states of nature. In the social case, the "chooser" behind the veil is hypothetical. The probabilities assigned to identities are not based on any actual uncertainty but are meant to represent ethical weights. This is a crucial disanalogy: the probabilities in Harsanyi's setup are not degrees of belief but rather a formal device to represent impartiality. If we interpret them as subjective probabilities, we face the question of whose beliefs they are. The impartial observer is a construct, so the probabilities are stipulated, not derived from any actual epistemic state.

  Second, the assumption of interpersonal comparability of utilities is essential in the social case but has no parallel in the individual case. In individual decision theory, the utility function is unique up to affine transformations (i.e., it is cardinal), but the units are not comparable across states. In Harsanyi, we need to compare utilities across different people. The theorem assumes that individual utilities are measured on a common scale and that we can add them. Without this, the weighted sum is meaningless. The analogy does not account for this because in the individual case, the utility is over outcomes for the same person.

  Third, the ex ante perspective in the social case treats individuals as separable bearers of utility, but this separability is not necessary in ordinary risk for a single person. In the individual case, the decision-maker may have complex preferences over state-contingent outcomes (e.g., they might care about risk in a non-separable way). However, the expected utility axioms force separability across states. But in the social case, the separability across individuals is an ethical assumption: it implies that the social welfare function is additive across people. This is a strong assumption that the analogy makes look natural by mapping states to people. However, it is not obvious that society should be indifferent to the distribution of utility in the way that an individual might be indifferent to the distribution of their own utility across states.

  ## What the analogy imports

  The analogy imports the idea of a single rational agent with a unified utility function, which then gets projected onto society. It suggests that society should be modeled as if it were a single individual facing a risky choice. This smuggles in the assumption that the social good is simply the aggregation of individual goods, without any inherent value in the distribution (beyond what the additive form captures). It also imports the idea that impartiality is equivalent to assigning equal probabilities to each person's identity, which is a substantive ethical claim. Moreover, the analogy suggests that the only rational way to handle uncertainty is expected utility maximization, which is a controversial position even in individual decision theory (e.g., critiques from prospect theory). Finally, it assumes that individuals are like "states" in a lottery, reducing the social problem to one of individual risk-taking, which masks the distinct ethical issues of interpersonal comparison and distributional justice.

  ## Verdict on the conclusion

  The conclusion that Harsanyi's theorem forces utilitarianism (as a weighted sum of utilities) does not survive the disanalogies intact. The theorem does show that if we accept the axioms (including the Pareto principle and the expected utility axioms for the social welfare function) then the social welfare function must be a weighted sum of individual utilities. However, the ethical force of this result depends entirely on the acceptability of the axioms and the interpretation of the veil. In particular, the probabilities in the veil of ignorance are not forced upon us by rationality alone; they are ethical choices. Moreover, the theorem requires interpersonal comparability of utilities, which is not a requirement of individual decision theory. Without that, we cannot even define the weighted sum. Therefore, the theorem does not uniquely license utilitarianism as the only rational social choice; it only shows that if we accept the axioms and interpersonal comparability, then we must be utilitarian. But one can reject the axioms (e.g., the independence axiom for social choice) or the interpersonal comparability without being irrational. Hence, the friend's conclusion is too strong: Harsanyi's theorem is a representation result, not a proof that utilitarianism is the uniquely rational choice.

  ## A better analogy

  A better analogy might be to think of the social choice problem as one of *mutual insurance* rather than individual risk. In mutual insurance, individuals agree on a contract that redistributes resources in case of bad outcomes. This emphasizes the actual preferences and agreements among the members of society, rather than a hypothetical chooser. It also highlights that the weights in the aggregation might be the result of bargaining or ethical deliberation, not just probabilities. This analogy does not require a single mind behind a veil and allows for a more pluralistic view of social welfare. However, it may not deliver the same strong conclusion of a weighted utilitarian sum without additional assumptions.
answer: |-
  ### The analogy and its intended work  
  The analogy equates an individual's decision under risk to society's choice of a social welfare function. In the individual case, a rational agent assigns probabilities to uncertain states of nature, computes expected utility, and maximizes it. In the social case, an impartial observer behind a "veil of ignorance" assigns probabilities to potential identities within society, treats individual utilities as outcomes, and maximizes expected utility. The theorem is used to argue that any coherent, impartial social ranking respecting unanimous preferences must be a weighted sum of individual utilities—thereby licensing utilitarianism and dismissing non-utilitarian approaches as irrational or partial.

  ### Correspondence table  

  | Element in individual decision under risk | Corresponding element in social choice | Tightness of correspondence |  
  |-------------------------------------------|----------------------------------------|-----------------------------|  
  | **Individual chooser**                    | Impartial observer (hypothetical agent behind the veil) | Loose: The observer is a constructed fiction, not a real agent with unified preferences. |  
  | **States of nature**                      | Possible identities (i.e., which person the observer "becomes") | Moderate: Identities are mutually exclusive and exhaustive like states, but they represent persons, not objective events. |  
  | **Probabilities**                         | Ethical weights or subjective beliefs over identities | Loose: Probabilities here are stipulations (e.g., equiprobability for impartiality), not empirically grounded beliefs. |  
  | **Outcomes**                              | Distributions of well-being across individuals | Moderate: Outcomes are analogous (e.g., material consequences), but social outcomes involve interpersonal utility comparisons, which individual decisions do not. |  
  | **Utility function**                      | Social welfare function | Moderate: Both map outcomes to values, but the social welfare function must satisfy additional constraints (e.g., Pareto) and interpersonal comparability. |  
  | **Expected utility maximization**         | Maximizing a weighted sum of individual utilities | Tight: The theorem shows the formal equivalence, but only under specific axioms. |  

  ### Where the mapping breaks  
  The analogy breaks in ways that undermine its ethical conclusions. Crucially, **the "chooser" is not real** but a hypothetical construct. In individual decisions, a unified agent experiences all outcomes and bears the risk. In the social case, no one occupies the "observer" role—it is a thought experiment. Consequently, the probabilities assigned to identities are not degrees of belief (as in genuine risk) but ethical weights disguised as uncertainty. This conflation is pivotal: Equiprobability is stipulated to represent impartiality, but nothing in rationality demands it; it is an ethical choice masquerading as epistemic necessity.  

  Second, **interpersonal comparability and separability are artificially imported**. Individual decision theory requires no utility comparisons across states—only ordinal preferences under risk. Harsanyi’s theorem, however, assumes utilities are cardinally measurable and comparable across people. This transforms the weighted sum from a representation result into a substantive ethical claim. Additionally, the analogy treats persons as "separable" utility-bearers, like states in a lottery. But individuals are not states: Their utilities interact (e.g., through envy or solidarity), and society may care about distribution (e.g., equality) in ways that violate additive separability. Ordinary risk for one person doesn’t raise these issues.  

  These breaks matter for the conclusion. The probabilities and interpersonal comparisons are not derived from rationality but imposed by the setup. Without them, the theorem collapses into a tautology: *If* you accept the veil and its assumptions, *then* you get utilitarianism.  

  ### What the analogy imports  
  The analogy smuggles in commitments from the individual case: First, it assumes a **unified rational agent** as the model for society, implying social choice should mirror individual rationality—an anthropomorphism that ignores collective dynamics. Second, it treats **identities as lottery tickets**, reducing personhood to probabilistic outcomes and obscuring distinct ethical concerns like identity, rights, or fairness. Third, it equates **impartiality with equiprobability**, presenting a controversial ethical stance (equal weight per person) as a rational default. Finally, it imports **expected utility as the only rational response to uncertainty**, sidelining alternative decision models (e.g., rank-dependent utility) that could support non-utilitarian social choices.  

  ### Verdict on the conclusion  
  Your friend’s conclusion—that Harsanyi’s theorem forces utilitarianism as the uniquely rational social choice—does not survive. The theorem is a representation result: It shows that *if* a social welfare function satisfies the Pareto principle, the expected-utility axioms (e.g., independence of irrelevant alternatives), and interpersonal comparability, *then* it must be a weighted sum of utilities. However, the ethical content comes entirely from the stipulations (e.g., the veil’s probabilities), not rationality alone. Rejecting equiprobability or interpersonal comparability need not be irrational; it may reflect competing ethical views (e.g., prioritarianism). Thus, the theorem does not "license" utilitarianism but shows that it is one coherent way to satisfy the axioms—axioms that are themselves ethically loaded.  

  ### A better analogy  
  A better analogy is **negotiating a binding contract under consensus constraints**. Here, individuals (not a hypothetical observer) agree on rules for social distribution, with probabilities replaced by deliberative weights reflecting claims or bargaining power. This shifts focus from artificial uncertainty to actual preferences and fairness, accommodating pluralism (e.g., Rawlsian maximin) while avoiding the veil’s monistic baggage. It captures impartiality through symmetry in bargaining, not probabilities, and allows non-utilitarian outcomes without violating rationality.
