  ## Commemoration Review Committee Decision Procedure

  Below is a reusable decision procedure designed for clarity, fairness, and efficiency. It prioritizes factual resolution where possible and identifies when a vote is necessary due to value judgments. The procedure respects your specified distinctions and constraints.

  ---

  ### **ONE-PAGE VERSION (FOR READING ALOUD AT HEARINGS)**  
  *This is the script to open each hearing. Committee members and the public should follow these steps.*

  1. **Clarify the Request**  
     - What is being requested? (Remove, add, or alter a commemoration?)  
     - What is the subject? (Person, event, or loss being honored—or proposed to be honored?)  
     *Sufficient answer: Clear description of the request and subject. Proceeds to Step 2.*

  2. **Is This Still Active Commemoration?**  
     *(For existing items only)*  
     - Is this actively seen as "honoring" the subject today, or is it a neutral marker (e.g., a bare address)?  
     *If inactive → Skip to Step 4. If active → Proceed to Step 3. Ends case only if request is frivolous (e.g., petition to rename "Main Street" when it has no commemorative link).*

  3. **What’s the Core Objection or Reason?**  
     - For removal: Is the harm about the subject’s actions, the message the item sends, or the city’s endorsement?  
     - For addition: Why is this subject worthy of honor?  
     *Sufficient answer: Specific harm (e.g., "Pemberton promoted eugenics") or benefit (e.g., "This organizer advanced civil rights"). Proceeds to Step 4.*

  4. **Fact Check: What’s Verifiable?**  
     - Did the subject do/represent what’s claimed? Was the harm/benefit real?  
     - Was this contested at the time? (Avoid "everyone thought that way" traps.)  
     *If facts disprove the request’s basis → Ends case with "no." If facts confirm harm/benefit → Proceeds to Step 5. If facts are unclear → Proceeds but note uncertainty.*

  5. **Is This Harm/Benefit Active Today?**  
     - Is the commemoration causing ongoing harm (e.g., exclusion, pain) or delivering ongoing benefit (e.g., inspiration, education)?  
     *If no ongoing impact → Weakens case for change. If ongoing impact → Strengthens case. Proceeds to Step 6.*

  6. **Can an Alternative Resolve This?**  
     - Options: Relocate, add context, retire the name but keep records, install a counter-marker, or reinterpret.  
     - Would this address the core objection?  
     *If yes → Recommends the alternative. Ends case. If no → Proceeds to Step 7.*

  7. **Who’s Affected?**  
     - Give weight to:  
       - Directly impacted groups (e.g., descendants, tribal nations, residents).  
       - Petitioners with cultural/historical ties (e.g., alumni, property owners).  
     *No automatic vetoes. Documents input. Proceeds to Step 8.*

  8. **Apply Presumption**  
     - **For removal/alteration:** Presume *against continued honor* if active harm is verified.  
     - **For addition:** Presume *against adding* unless benefit is verified and uncontroversial.  
     *If presumption resolves the case → Ends. If not → Proceeds to Step 9.*

  9. **Vote**  
     - Hold a vote. Majority decides.  
     *Required when previous steps don’t yield consensus.*

  10. **Document the Decision**  
      - Record answers to all steps and reasoning.  

  ---

  ### **FULL VERSION WITH REASONING**  
  *For committee reference. "Judgment call" steps are marked.*

  #### **Step 1: Clarify the Request**  
  - **Purpose:** Prevent confusion. Ensure everyone debates the same thing.  
  - **Sufficient answer:** Unambiguous description (e.g., "Remove Pemberton Avenue’s name," not "Fix problematic streets").  
  - **Real test:** Factual. Ends case only if request is unintelligible.  
  - **Judgment call?** No.  

  #### **Step 2: Is This Still Active Commemoration?**  
  - **Purpose:** Respects your distinction between active honor (e.g., a statue of a general), passive marker (e.g., a plaque for a battle loss), and bare addresses (e.g., "Fenn Street" with no honor).  
  - **Sufficient answer:** Evidence of public perception (e.g., surveys, news, petitions). If 90% of residents see "Fenn Street" as just a name, it’s inactive.  
  - **Ends case if:** Request targets an *inactive* item with no verifiable harm (e.g., renaming "Maple Avenue" for minor reasons).  
  - **Judgment call?** Yes. Relies on community input.  
  - **Misfires if:** Public perception is split 50/50. Default to "active" to avoid undercounting harm.  

  #### **Step 3: What’s the Core Objection or Reason?**  
  - **Purpose:** Addresses your distinctions:  
    - Objection to subject (e.g., "Pemberton was racist").  
    - Objection to message (e.g., "The soldier’s inscription glorifies slavery").  
    - Objection to city’s role (e.g., "Why are *we* honoring this?").  
  - **Sufficient answer:** Specific claims (e.g., "The inscription calls the Civil War ‘noble’"). Vague objections (e.g., "This feels wrong") fail.  
  - **Ends case if:** Objection is baseless (e.g., "Lincoln owned slaves"—disproven in Step 4).  
  - **Judgment call?** No. Sets up fact-checking.  

  #### **Step 4: Fact Check: What’s Verifiable?**  
  - **Purpose:** Grounds debate in evidence. Avoids "presentism" by asking if views were contested historically.  
  - **Sufficient answer:** Reliable sources (e.g., archives, historians).  
  - **Ends case if:**  
    - Facts disprove the request (e.g., subject didn’t do the alleged act).  
    - For additions: Proposed honoree’s achievements are fabricated.  
  - **Real test:** Fact-based.  
  - **Misfires if:** Historical records are lost. Committee must note uncertainty and proceed.  

  #### **Step 5: Is This Harm/Benefit Active Today?**  
  - **Purpose:** Distinguishes past harms (e.g., a founder owned slaves) from ongoing harms (e.g., a statue that intimidates Black residents).  
  - **Sufficient answer:** Testimony from affected groups (e.g., tribal nations, disability advocates).  
  - **Ends case?** Rarely. Weakens/strengthens the case.  
  - **Judgment call?** Yes. Weighs lived experience.  
  - **Misfires if:** Committee dismisses "symbolic" harm. Procedure requires taking it seriously.  

  #### **Step 6: Can an Alternative Resolve This?**  
  - **Purpose:** Explores middle grounds. Tests if "adding context" genuinely addresses harm or dodges a decision.  
  - **Sufficient answer:** Evidence the alternative reduces harm (e.g., a reinterpreted plaque at a Confederate statue lowers community tension).  
  - **Ends case if:** Alternative resolves the core objection (e.g., relocating a statue to a museum ends public harm).  
  - **Judgment call?** Yes. Balances practicality and impact.  
  - **Misfires if:** Committee uses this to avoid tough decisions. Only endorse alternatives that directly address Step 3’s objection.  

  #### **Step 7: Who’s Affected?**  
  - **Purpose:** Defines standing. Prioritizes directly impacted groups but avoids vetoes.  
  - **Sufficient answer:** List of stakeholders (e.g., for a school name: alumni, students, tribal nations). Documents their input.  
  - **Ends case?** Never. Input informs Steps 8–9.  
  - **Judgment call?** Yes. Committee must weigh voices fairly.  

  #### **Step 8: Apply Presumption**  
  - **Purpose:** Your "biggest fork." Breaks ties by prioritizing:  
    - *Against honor* for removals (if harm is verified).  
    - *Against addition* for new commemorations (unless benefit is clear and uncontested).  
  - **Sufficient answer:** Alignment with Steps 3–5.  
  - **Ends case if:** Presumption clearly applies (e.g., verified active harm + no alternative → remove).  
  - **Judgment call?** Yes. Most subjective step.  
  - **Misfires if:** Committee ignores presumption to avoid controversy.  

  #### **Steps 9–10: Vote and Document**  
  - **Purpose:** Resolves irreconcilable value conflicts.  
  - **Real test:** Majority rules.  
  - **Misfires:** Inevitable in divisive cases—some will feel unheard.  

  ---

  ### **APPLICATION TO YOUR THREE CASES**  
  *Committee runs the procedure step-by-step.*

  #### **Case 1: Pemberton Avenue**  
  - **Step 1:** Request to rename a street honoring Dr. Pemberton.  
  - **Step 2:** Active commemoration (named for philanthropy and public service).  
  - **Step 3:** Objection to subject’s actions (sponsored forced sterilization).  
  - **Step 4:** Facts verified: Pemberton sponsored the 1890s bill. Eugenics was contested (opponents existed).  
  - **Step 5:** Active harm: Sterilization survivors’ descendants argue the name validates medical racism today.  
  - **Step 6:** Alternative? Add a plaque about his role in eugenics. *Does this resolve harm?* No—the street still honors him.  
  - **Step 7:** Affected: Sterilization victims’ families, residents, medical community.  
  - **Step 8:** Presumption against honor applies (verified active harm).  
  - **Outcome:** **Recommend renaming.** The procedure forces this due to active harm + no alternative.  

  #### **Case 2: Soldier on Courthouse Lawn**  
  - **Step 1:** Request not specified—assume removal or alteration due to inscription.  
  - **Step 2:** Active commemoration (inscription praises the Confederacy’s "cause").  
  - **Step 3:** Objection to message (inscription glorifies slavery) and city’s endorsement.  
  - **Step 4:** Facts verified: Inscription calls cause "noble." Cause (secession to protect slavery) was hotly contested in 1908.  
  - **Step 5:** Active harm: African American residents testify it fuels modern white supremacism.  
  - **Step 6:** Alternatives:  
    - *Add interpretive sign?* No—city still "blesses" the original message.  
    - *Remove inscription?* Yes—replace with neutral text (e.g., "In memory of the dead"). Resolves harm.  
  - **Outcome:** **Recommend altering the monument.** Replacing the inscription addresses the core objection without removing the memorial.  

  #### **Case 3: Fenn Street → Rename for Civil Rights Organizer**  
  - **Step 1:** Request to rename inactive "Fenn Street" to honor an organizer.  
  - **Step 2:** Inactive commemoration (developer’s daughter; no one sees it as honor).  
  - **Step 3:** Reason: Organizer’s contributions (e.g., led local desegregation).  
  - **Step 4:** Facts verified: She lived there; achievements documented.  
  - **Step 5:** Active benefit: Naming it after her inspires marginalized youth.  
  - **Step 6:** Alternative? Plaque at her home. *Does this match the benefit?* No—street naming is public honor.  
  - **Step 7:** Affected: Street residents (split—some oppose address changes), organizer’s family (supports).  
  - **Step 8:** Presumption against addition applies (renaming disrupts residents).  
  - **Step 9:** Vote required (values conflict: symbolic justice vs. practical costs).  
  - **Outcome:** **Vote 5-4 against renaming.** The presumption against addition + resident opposition tips it. You’ll dislike this, but the procedure forces it: renaming an *inactive* street requires broad support, which is lacking. Recommend a compromise (e.g., name a new park after her).  

  ---

  ### **WHAT THIS PROCEDURE CANNOT DO**  
  1. **Resolve deep value conflicts:** When facts are exhausted and stakeholders are irreconcilable (e.g., "The soldier is heritage vs. hate"), voting is the only fair step.  
  2. **Prevent perceived injustice:** If 49% of the community opposes a 51% majority vote, the outcome will feel unjust to some. The procedure documents *why* but can’t eliminate this.  
  3. **Fix incomplete facts:** If historical records are lost (e.g., "Did this founder *choose* to own slaves?"), the committee must vote on probabilities.  
  4. **Override practical constraints:** A recommendation to relocate a monument may fail if the city lacks funds. The procedure doesn’t budget.  
  5. **Ensure moral courage:** Committees might hide behind "judgment calls" (e.g., Step 6) to avoid tough decisions. The chair must enforce rigor.  

  This procedure brings structure, prioritizes facts, and honors your distinctions—but it’s a tool, not a guarantee. Its strength is transparency: even when outcomes disappoint, the path to them is clear.
