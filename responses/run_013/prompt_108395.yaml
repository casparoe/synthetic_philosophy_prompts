   Fuller Version:

   **Commemoration Review Committee Decision Procedure (Full Version)**

   **Purpose**: To provide a fair, consistent, and transparent method for evaluating requests about commemorations in our city, whether for removal, alteration, or addition.

   **Step 1: Clarify the Request**
     - State the request clearly. For example: "Remove the monument at X", "Rename Y street to Z", "Add a plaque at W".
     - Identify the subject: 
          - For an existing commemoration: who or what is being commemorated?
          - For a new commemoration: who or what would be commemorated?
     - Reasoning: We must know exactly what we are deciding.

   **Step 2: Commemorative Status (Only for existing commemorations)**
     - Determine if the existing commemoration is still actively honoring the subject or if it has become a bare address (or lost its commemorative meaning).
          - How to determine: Consider public perception, inscriptions, and the original intent. If the name is widely recognized as honoring someone, it's active. If it's just a name with no association, it's inactive.
     - What counts as sufficient: Evidence from public surveys, historical records, or common knowledge.
     - If inactive: This doesn't automatically grant removal, but it lowers the threshold for change because the harm of continued honoring is minimal. However, the cost and disruption of change must still be considered.
     - Judgment call: This is a judgment call because it depends on public perception.

   **Step 3: Grounds for the Request**
     - For removal/alteration: 
          - Specify the harm: 
              a) The subject's actions or character are objectionable.
              b) The monument's message (inscription, imagery) is objectionable.
              c) The objection is that the city should not be the one honoring this subject.
          - For addition:
              a) The subject's contributions or character are worthy of honor.
              b) The event or loss is significant and should be marked.
              c) The commemoration would correct a historical omission or imbalance.
     - What counts as sufficient: The petitioner must state the grounds clearly. The committee then investigates.
     - This step does not end the case but sets the stage for the fact check.

   **Step 4: Fact Check**
     - Investigate the facts underlying the grounds.
          - For removal based on subject's actions: Did the subject do the alleged acts? Were these acts contested at the time? (To avoid the "everyone thought that way" trap.)
          - For removal based on the monument's message: Is the message factually accurate? If it's a value judgment (e.g., "glorious cause"), then it's not a matter of fact but of values.
          - For addition: Are the claimed contributions or events factual?
     - What counts as sufficient: Reliable historical sources, primary documents, expert testimony.
     - When it ends the case: 
          - If the facts disprove the grounds (e.g., the subject did not do the harmful act), then the request fails on that ground. However, if there are multiple grounds, we continue on the others.
          - If the grounds are entirely fact-based and are disproven, the request is denied.
     - Note: This step is a real test for factual claims. For value claims (e.g., whether an act is objectionable), we don't end the case.

   **Step 5: Current Harm or Benefit**
     - For removal: 
          - Is the commemoration causing ongoing harm? (e.g., is it experienced as offensive or harmful by a segment of the community today? Is the city, by maintaining it, currently endorsing a harmful message?)
          - If the harm is only historical (the subject did bad things but the commemoration isn't actively causing harm now) then the case for removal is weaker.
     - For addition:
          - Will the commemoration provide a tangible benefit (e.g., healing, education, representation) to the community today?
     - What counts as sufficient: Testimony from affected groups, experts on community impact, or documented ongoing effects.
     - Judgment call: This is a judgment about present impact.

   **Step 6: Consider Alternatives**
     - Brainstorm alternatives: 
          - For removal: relocating the monument to a museum, adding an interpretive sign, changing the inscription, adding a counter-monument, or renaming to a neutral name and then later adding a new name.
          - For addition: could the commemoration be placed elsewhere? Could it be combined with an existing one? Could it be done in a different form?
     - Evaluate: Would an alternative resolve the issue? 
          - For removal: if adding context addresses the harm, then that might be the recommendation.
          - For addition: if the proposed form is problematic, an alternative form might be acceptable.
     - Judgment call: This step requires creativity and compromise.

   **Step 7: Standing and Community Input**
     - Identify who has standing: those directly affected (e.g., residents of a street, descendants, tribal nations, alumni, etc.) and the broader community.
     - Weigh the input: The committee should give special consideration to the views of directly affected groups, but also consider the city as a whole.
     - How: Through public hearings, written submissions, and targeted outreach.
     - Judgment call: How much weight to give to different groups is a judgment.

   **Step 8: Presumption**
     - For removal/alteration: 
          - Presumption in favor of keeping the commemoration unless there is clear and convincing evidence of significant ongoing harm that cannot be addressed by an alternative.
     - For addition:
          - Presumption against adding a new commemoration unless there is clear and convincing evidence of a significant benefit and broad community support, and that it does not cause harm.
     - Reasoning: Changing the status quo (whether removing or adding) has costs and should be done only when the case is strong.
     - This step is a judgment call that sets the burden of proof.

   **Step 9: Vote**
     - If after the previous steps the committee is not unanimous or a clear decision hasn't emerged, the committee votes.
     - The vote is the last resort.

   **Step 10: Documentation**
     - The committee will document its decision and the reasoning, including how each step was answered.

   **Where the procedure can misfire**:
     - If the fact check (Step 4) is done poorly, the committee might base its decision on incorrect facts.
     - The judgment calls (Steps 2, 5, 6, 7, 8) are subjective and might be influenced by personal biases.
     - The procedure might be too rigid for complex cases.

   **What the procedure cannot do**:
     - Resolve deep value conflicts: Sometimes, no amount of fact-finding can bridge a values gap, and a vote is necessary.
     - Satisfy everyone: Even if the procedure is followed, some will feel the outcome is unjust.
     - Address all historical nuances: History is complex, and the procedure may oversimplify.

