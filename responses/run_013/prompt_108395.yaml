     However, because the current name is inactive (no honoring) and the change is to honor someone with local ties and contributions, and if the residents are supportive, then the presumption would be overcome.

     If residents are opposed, the committee might look for an alternative (e.g., naming a new street or park after her).

   Outcome: The committee would likely recommend renaming if the residents are supportive. If not, they might suggest an alternative commemoration.

   Now, we note that the user might not like the outcome in Case 2 (the soldier monument) if the procedure leads to removal. We are not softening the procedure.

   Let's write the outcomes for the three cases:

   **Case 1: Pemberton Avenue**
     - The procedure leads to a recommendation to rename the street. The reasoning: 
          - Active commemoration of a man who sponsored forced sterilization.
          - Ongoing harm by honoring him.
          - No alternative (like adding a sign) would remove the harm because the street name itself is the honor.
          - Presumption in favor of keeping is overcome by the clear harm.

   **Case 2: The soldier monument**
     - This might be the one the user doesn't like. The procedure leads to a recommendation to remove or relocate the monument because:
          - The inscription praises the Confederate cause, which is harmful and offensive.
          - The harm is ongoing.
          - Adding an interpretive sign might not be sufficient to resolve the harm because the offensive inscription remains.
          - Therefore, the committee would recommend removal or relocation to a museum context.

     However, the committee might choose the alternative of removing the inscription and replacing it with a neutral one, but that alters the monument. If that is acceptable and resolves the harm, then that could be the recommendation.

     But note: the monument was erected by a women's memorial association to honor the dead. The names of the dead are listed. We could preserve the list of names in a different format? The procedure doesn't force removal of the entire monument if an alternative resolves the harm. If the committee believes that removing the inscription and adding a new one that honors the dead without praising the cause would work, then that is an option.

     But if the statue itself is a generic Confederate soldier, it might still be seen as honoring the Confederacy. So removal might be the only way.

     We'll say the procedure leads to removal or relocation.

   **Case 3: Fenn Street**
     - The procedure leads to a recommendation to rename the street if the residents support it. If there is significant opposition from residents, then the committee might recommend an alternative (like a plaque or naming a new park). But if support is broad, then renaming is recommended.

   Finally, what the procedure cannot do:
     - It cannot eliminate the need for hard choices when values conflict.
     - It cannot guarantee that the outcome will be seen as just by all.
     - It might not capture every nuance (e.g., the difference between a monument that marks a loss and one that celebrates).
     - It might be gamed by presenting only partial facts.

   We have written the procedure and applied it to the cases.
