prompt: |-
  I am trying to isolate the principle behind my judgments about the legitimacy of the Nuremberg and Tokyo tribunals, and I would rather have the principle than a survey of positions. Treat the following as data. (1) Convicting the German leadership for waging aggressive war was legitimate, even though I accept that aggressive war was not a punishable offense under positive international law when they waged it. (2) Convicting a commander for atrocities committed by troops under his command, which he neither ordered nor knew of, was not legitimate. (3) Convicting a defendant for conduct that an unambiguous domestic law then in force commanded him to perform was not legitimate. (4) That the charter, the bench and the prosecution were supplied entirely by the victorious powers is not by itself a defect. (5) That the victors declined to examine their own conduct — the firebombing of cities, the killing of prisoners — while trying the defeated for theirs is a defect, and one that undermines the judgments on aggression without undermining the atrocity convictions.

  Is there a single principle that yields all five, or must I surrender one of them? If I must, say which, and explain why abandoning that verdict is cheaper than the alternatives. State the principle precisely enough that it generates verdicts on its own, and then give me its verdicts on two cases I have not listed: (a) a tribunal of exclusively foreign judges trying the officials of a state that committed no aggression but tortured its own citizens under the authority of its own law; and (b) a defendant who, before the war, had himself publicly urged that aggressors be individually punished, and who is now tried under precisely that standard.

  Do not lay out the range of positions and leave the choice to me. Commit to the principle you think is correct, and be explicit about what it costs you and where it is weakest.
reasoning: |-
  Okay, the user is trying to isolate a principle that explains their judgments about the legitimacy of the Nuremberg and Tokyo tribunals. They provided five specific positions and want a single principle that can justify all of them. If that's not possible, they want to know which one they should abandon and why. They also want the principle applied to two new cases.

  First, I need to understand each of their points. Point 1: Convicting German leaders for aggressive war was legitimate even though it wasn't illegal at the time. Point 2: Commanders shouldn't be convicted for atrocities they didn't order or know about. Point 3: Convicting someone for following domestic law isn't legitimate. Point 4: The victors running the tribunal isn't a problem by itself. Point 5: The victors not examining their own war crimes undermines aggression convictions but not atrocity ones.

  The user's deeper need seems to be finding a coherent ethical framework that aligns with their intuitions, possibly for academic or personal clarity. They might be struggling with the tension between legal positivism and natural law. They reject strict positivism (since aggressive war convictions were okay despite no prior law) but also reject victor's hypocrisy (point 5). They care about fairness and consistency.

  Now, the challenge is reconciling point 1 and point 3. Point 1 accepts retroactive punishment for aggression, but point 3 rejects convictions for following domestic law. How can both be true? The user might see aggression as a fundamental crime against humanity, making it inherently wrong regardless of written law. Domestic laws commanding atrocities, however, don't absolve individuals because the acts themselves are universally wrong. But point 3 says convicting for following domestic law isn't legitimate. So there's a conflict.

  The principle of "inherent criminality" might work. Some acts are so fundamentally wrong that they're crimes irrespective of specific laws. Aggressive war could fall under this as an international crime. Atrocities like torture or genocide are inherently criminal. But following domestic law (point 3) would only be a defense if the act isn't inherently criminal. So if a domestic law commands torture, following it isn't a defense because torture is inherently wrong. But the user says convicting for following domestic law isn't legitimate. That's a contradiction.

  Maybe the principle distinguishes between the nature of the crime and the authority. Aggressive war requires collective state action, so individuals might not be liable without clear precedent. But the user thinks convicting for aggression was legitimate despite no prior law. So that doesn't align.

  Perhaps the principle is about "crimes against peace and humanity" being so grave that they transcend positive law. But point 3 is a problem because if domestic law commands atrocities, following it shouldn't excuse the individual. However, the user thinks convicting in that case isn't legitimate. So point 3 conflicts with the idea that some acts are inherently criminal.

  The only way to reconcile is to argue that aggression is a unique crime because it's a collective state act, making individuals liable only if there's a clear international standard (which there wasn't then). But the user accepts the conviction despite no prior law. Alternatively, perhaps the user distinguishes between crimes with moral consensus. Aggression might not have had consensus then, but atrocities did. But the firebombing wasn't prosecuted, which the user sees as hypocrisy affecting aggression convictions but not atrocity ones.

  For point 5, hypocrisy undermines aggression convictions because the victors committed similar acts (strategic bombings), so their moral authority is compromised. But for atrocities like genocide, the victors didn't commit similar acts, so those convictions stand. That makes sense.

  But point 3: convicting someone for following domestic law. If the law commanded atrocities, why isn't the individual liable? The user might believe that individuals are bound by their state's laws, so punishing them for following orders is retroactive if no international law overrode it. But atrocities are covered by universal principles, so following domestic law isn't a defense. Here lies the conflict. The user's point 3 must be abandoned. If domestic law commands torture, and torture is a crime against humanity, then individuals should still be held accountable. The Nuremberg precedent rejected "following orders" as a defense for atrocities. So the user's point 3 is inconsistent with international law principles they seem to support elsewhere.

  Therefore, the principle is that individuals can be held accountable for acts that violate fundamental norms of humanity (jus cogens), regardless of domestic laws or orders. Aggressive war is such a norm, but its prosecution requires impartiality. Hypocrisy undermines the legitimacy of prosecuting aggression if victors are guilty too, but not for atrocities if victors didn't commit similar acts.

  So the principle: "Individual criminal liability arises only for violations of fundamental humanitarian norms (crimes against humanity, core war crimes, genocide) that are universally recognizable as morally abhorrent, and prosecution requires institutional impartiality relative to the specific charge."

  This covers point 1: aggressive war as a fundamental norm. Point 2: commanders need knowledge because liability requires culpability. Point 3 is abandoned because following domestic law isn't an excuse for fundamental crimes. Point 4: victors running the tribunal isn't inherently wrong. Point 5: hypocrisy undermines aggression charges if victors committed similar acts, but not for distinct atrocities.

  For new cases: 

  (a) A tribunal of foreign judges trying officials for torturing citizens under domestic law. The principle supports conviction because torture is a fundamental crime, regardless of domestic law. The tribunal's foreign composition isn't a defect if impartial.

  (b) A defendant who advocated punishing aggressors, now tried under that standard. Retroactivity is still an issue, but if aggression is a fundamental norm, prosecution might be legitimate. However, the principle requires the norm to be universal and the tribunal impartial. The defendant's prior stance doesn't negate retroactivity concerns, but the principle focuses on the act's inherent wrongness, not personal hypocrisy. So conviction could be legitimate if aggression is considered a fundamental crime.
answer: |-
  Based on your judgments, the core principle reconciling **four** of your five positions (with one requiring abandonment) is:

  **The Principle of Fundamental Humanitarian Norms with Institutional Impartiality:**  
  *Individual criminal liability requires:  
  (1) Violation of a fundamental, universally recognizable norm of humanity (e.g., torture, genocide, systematic atrocities) that transcends positive law at the time of commission; AND  
  (2) Prosecution by an institution demonstrating impartiality **relative to the specific charge**, meaning no material conflict of interest or hypocrisy that directly undermines moral authority on that charge.*

  ---

  ### How the Principle Works:
  1. **Legitimizes convicting for aggressive war (Point 1):**  
     Aggressive war, as a systematic assault on global peace and human dignity, qualifies as a *fundamental norm violation* (Condition 1). Its moral gravity outweighs positivist objections ("crime against peace" as *malum in se*).  

  2. **Rejects command responsibility without knowledge (Point 2):**  
     Liability requires *personal culpability*. Absent orders or knowledge, the commander’s conduct doesn’t meet the threshold of violating a fundamental norm *individually*. The norm targets conscious participation, not strict liability.  

  3. **ABANDONS Point 3 (conviction for following domestic law):**  
     This must be surrendered. If domestic law commands acts violating fundamental humanitarian norms (e.g., genocide), individuals remain liable. Positive law cannot shield perpetrators from universal moral duties (as affirmed at Nuremberg for atrocities). Retaining Point 3 contradicts the principle’s core by privileging state authority over inherent wrongness.  
     **Cost of Abandonment:** Accepting Nuremberg’s rejection of the "following orders" defense for atrocities.  
     **Why Cheaper?** Maintaining Point 3 creates irreconcilable conflict with Point 1 (both involve retroactivity) and undermines atrocity convictions universally. Abandoning it preserves coherence on aggression, command responsibility, and victor hypocrisy.  

  4. **Accepts victor-constituted tribunals (Point 4):**  
     Institutional structure alone doesn’t violate Condition 2. Impartiality is assessed *relative to the charge*, not abstract neutrality.  

  5. **Conditionally rejects victor hypocrisy (Point 5):**  
     Hypocrisy on **atrocities** (e.g., firebombing) would undermine impartiality for atrocity charges (Condition 2). But since victors didn’t prosecute *their own* aggression (the charge against defendants), hypocrisy exists on **aggression**, fatally tainting those convictions. Atrocity convictions stand because victors’ unrelated crimes don’t negate defendants’ guilt for *distinct* fundamental norms.  

  ---

  ### Verdicts on New Cases:
  #### (a) Foreign judges try officials of a non-aggressor state for torture under domestic law:  
  **Verdict: LEGITIMATE conviction.**  
  - Torture violates a fundamental humanitarian norm (Condition 1), regardless of domestic law.  
  - Exclusively foreign judges aren’t inherently partial (Condition 2), provided they adjudicate fairly. The state’s non-aggression status is irrelevant to the torture charge.  

  #### (b) Defendant who advocated punishing aggressors, now tried under that standard:  
  **Verdict: LEGITIMATE conviction.**  
  - Aggressive war violates a fundamental norm (Condition 1), per your acceptance of Point 1.  
  - The defendant’s prior stance *reinforces* the norm’s universality. His hypocrisy doesn’t create institutional partiality (Condition 2)—it makes his guilt more evident, not the tribunal less impartial.  

  ---

  ### Weaknesses and Costs:
  1. **Weakness:** "Universally recognizable norm" risks subjectivity. Who defines "fundamental" in contested cases (e.g., colonial suppression)?  
     - **Response:** Relies on *minimal consensus* (e.g., norms criminalized in diverse pre-1945 treaties/customs like prohibitions on torture or slave labor).  

  2. **Cost:** Accepts *limited retroactivity* for *malum in se* crimes. This contravenes strict legal positivism but aligns with natural law traditions.  

  3. **Weakness:** "Relative impartiality" permits victors’ justice if their crimes differ from defendants’ charges. This may not satisfy demands for absolute neutrality.  
     - **Response:** Demands consistency *within the same category of charges*. Prosecuting aggression while committing it fails; prosecuting torture while firebombing may not.  

  **In essence:** Your judgments prioritize *moral universalism* over positivism, tempered by procedural fairness tied to the specific offense. Surrendering Point 3 is necessary to avoid contradictions and uphold the Nuremberg legacy on atrocities. The principle’s strength is its focus on the act’s inherent wrongness and context-specific integrity of the court. Its weakness lies in balancing historical consensus with moral evolution.
