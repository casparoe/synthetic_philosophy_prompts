prompt: |-
  I do a small interview podcast about big-picture philosophy -- anthropics, decision theory, the end of the world, that sort of thing -- and next weeks guest has spent most of her career defending the doomsday argument. Her new book isnt a restatement of it: her line is that the argument isnt really about extinction, it's a constraint on any estimate of how many people there will ever be, so anyone doing longtermist expected-value math without letting it shrink their number is cheating. That claim is what I want the questions aimed at, not the argument itself, which my listeners have heard a hundred times.

  Shes also very good at killing objections with a single move: whatever you raise, she says it only works if you've already accepted self-indication, and the room goes quiet. I want a run of questions that makes that move progressively harder to use.

  Give me eight to ten questions, each with a follow-up keyed to the answer she's most likely to give. At least one question each on:

  - the reference class -- why humans ever born, and not primates, or mammals, or every observer in the universe, and what happens to the conclusion when the class gets bigger, including minds we might build or meet;
  - the self-sampling versus self-indication fork, and whether she can keep the doomsday conclusion without swallowing the presumptuous philosopher case, where two hypotheses about how many observers the universe contains fit all our evidence equally well and one of them contains vastly more observers than the other;
  - the worry that the same rank-in-a-class reasoning can be run on anything you're a member of (the number of times I'll blink, the number of flats I'll live in), so what stops it from proving too much;
  - the charge that the argument uses my birth rank while ignoring everything else I know about the world -- which if taken seriously looks like it makes the argument disappear, and maybe makes every anthropic argument disappear;
  - what it's supposed to do for action, since if it's right it also shrinks the number of future people whose risk we're trying to reduce.

  Then two cases I want to spring on her, one question each. First: we learn tomorrow that another intelligent lineage exists in the galaxy with a history roughly as long as ours -- does the argument now predict that the total number of such lineages is small, and isnt that in tension with what we just found? Second: if we build a trillion digital minds, do they count as observers for the purposes of the argument, and if they do, does that make our rank early or late, and does it change what we should do about building them?

  End on what would actually count as evidence against the argument -- something specific enough that we could go and look, not 'a better theory of anthropics'.
reasoning: |-
  Okay, the user runs a philosophy podcast focused on big-picture topics like anthropics and decision theory. Their next guest is a prominent defender of the Doomsday Argument (DA), but with a twist: she frames it as a constraint on estimates of total observers, not just extinction timelines. The user wants questions targeting this claim, specifically designed to challenge her go-to move of dismissing objections by invoking "self-indication" acceptance. 

  Hmm, the guest's "room goes quiet" tactic suggests she's skilled at rhetorical shutdowns. The user needs questions that force her to engage beyond that reflex. They've outlined five thematic areas plus two case studies and a falsifiability challenge. Smart structure—it covers all DA pressure points while boxing in her favorite evasion.

  First, the reference class problem. DA relies on "humans ever born," but why not broader categories? If she widens it to all observers (aliens, AIs), the doomsday conclusion weakens. Need to pin her on why "human" is special. Follow-up should push on whether DA becomes useless if we're not cosmically alone—that's uncomfortable for her position.

  Self-sampling vs. self-indication is the core trap. She rejects self-indication to avoid presumptuous philosopher cases (where we'd think we're in a big universe just because big universes have more observers). But DA *needs* self-indication to bite! The follow-up must corner her: either DA fails or she accepts absurdities like disbelieving telescope data showing many galaxies. 

  The "proves too much" angle is delicious. If birth-rank reasoning applied to blinking or apartments, we'd get nonsense. She'll likely say those lack "causal structure," but DA itself ignores causal links! Follow-up should mock this—why is "I'm human" causally relevant to doom but "I'm a blinker" isn't?

  The "ignoring evidence" critique is nuclear. DA treats birth rank as our only data point, discarding science. If she concedes we should use all evidence, DA evaporates. Follow-up: does this mean DA is just a flawed intuition pump? That'd burn her book's thesis.

  Longtermism tension is practical. If DA shrinks future population estimates, it reduces the value of saving them. She might say "act as if DA is true," but that invites fanaticism. Follow-up: should we *really* deprioritize asteroid defense? That makes her sound monstrous.

  Alien civilization case: discovering peers should—by DA logic—imply few civilizations total... but we just found one! Contradiction. She might say "separate reference classes," but then DA can't constrain x-risk for *humans*. Gotcha.

  Digital minds dilemma: if we build trillions, does that make us "early" (saving DA) or balloon the reference class (killing DA)? Either way, her constraint claim wobbles. Follow-up: should we *not* build AIs to avoid dooming humanity? Absurd.

  Ending on falsifiability is brutal. If she can't name observable evidence against DA, it's unfalsifiable dogma. Follow-up: is that a feature or bug? Mic drop.

  User's strategy is solid: each question lures her into a defense, then the follow-up springs the trap. The guest's rhetorical kryptonite—dismissing everything as "self-indication"—won't work here because the questions attack DA's premises *from within* her own framework. Beautiful.
answer: |-
  Here are 10 targeted questions with follow-ups designed to challenge the core "constraint" claim and make the "self-indication" dismissal harder to wield. Each targets a specific pressure point:

  1.  **On the Reference Class & Expansion:**
      *   **Question:** You argue DA constrains estimates of *total observers in our reference class*. Why is "humans ever born" the privileged class, rather than "sentient primates," "mammals," or even "all conscious observers in our forward light cone"? Doesn't arbitrarily choosing "human" bake the doomsday conclusion into the premise?
      *   *Likely Answer:* "Because 'human' is the natural class defined by the property making us susceptible to the reasoning (e.g., capacity for anthropic reasoning / being in our evolutionary lineage)."
      *   **Follow-Up:** If we discover (or create) a trillion digital minds next year, vastly increasing the reference class *within our causal future*, does the DA suddenly stop applying? Or does it now constrain the *total* number of biological+digital observers, implying an even more imminent catastrophe to keep our rank 'early'? Doesn't this make the 'constraint' wildly unstable and dependent on contingent technological choices?

  2.  **On Self-Sampling vs. Self-Indication & Presumptuousness:**
      *   **Question:** You reject Self-Indication (SIA) to avoid the Presumptuous Philosopher (e.g., disfavoring a small universe even if it fits the data, because big universes have more observers). But doesn't rejecting SIA *also* undermine the core DA logic? DA relies on the fact that you *could have been born later*, but under pure Self-Sampling (SSA) without SIA, isn't your observation *that you exist at all* also evidence favoring hypotheses where observers *like you* are more common? How do you get the DA conclusion *without* smuggling in a whiff of SIA?
      *   *Likely Answer:* "SSA alone suffices. DA uses your specific birth rank *within the reference class*, not just your existence. SSA conditions on being *an observer*, but DA uses the *additional information* of your temporal position."
      *   **Follow-Up:** If we accept pure SSA, why doesn't the Presumptuous Philosopher problem resurface *within the human reference class*? Imagine two hypotheses: H1 (few humans total) and H2 (vastly many humans). Both fit all external data equally well (so far). Doesn't pure SSA, conditioning only on "I am *a* human observer," make me *more likely* to find myself in H2 (because there are vastly more observers like me)? How does DA avoid *this* kind of presumptuousness without implicitly invoking something like SIA's prior against large numbers?

  3.  **On Proving Too Much (Blinking/Flats):**
      *   **Question:** DA relies on reasoning from my rank within a class. But I can define many classes I'm a member of: my blink count, my apartment number, my position on the list of people named "[Podcast Host Name]". Applying the same logic seems to "prove" absurdities (e.g., I should expect few total blinks). What specific property of the "humans ever born" class makes DA valid while the blinking argument is invalid?
      *   *Likely Answer:* "DA applies to classes defined by *causal processes* determining the total size and our position within it. Blinking or apartment living lack that structure; the total isn't predetermined by a process we're sampling from."
      *   **Follow-Up:** But isn't the *total number of future humans* also not a predetermined, fixed number? It depends on countless future choices, technological developments, and random events. How is "humans ever born" fundamentally different from "blinks I will ever blink" as a causal process? Both are sums of future contingent events. Doesn't this make the DA just as vulnerable to the "proves too much" objection?

  4.  **On Ignoring Evidence (The Disappearing Argument):**
      *   **Question:** DA treats my birth rank as a crucial piece of evidence while seemingly ignoring everything else I know – cosmology, physics, technological trends, risk assessments – which collectively suggest vast future potential. If I *seriously* condition *only* on my birth rank and the assumption of uniform sampling, DA seems strong. But isn't the core Bayesian objection that this artificially isolates one datum? If I properly condition on *all* my evidence (including that I live in a vast, ancient universe, post-industrial society, etc.), doesn't the DA effect vanish or become negligibly small?
      *   *Likely Answer:* "DA *is* part of the total evidence! It provides a prior or a constraint *within* which other evidence must operate. Ignoring it is the mistake; other evidence modifies the prior it provides."
      *   **Follow-Up:** Can you demonstrate quantitatively how incorporating other strong evidence (e.g., low near-term extinction risk estimates, vast cosmic resources) modifies the DA prior? Doesn't the overwhelming strength of other evidence, combined with the inherent fragility of the DA assumptions (reference class, sampling), usually reduce the DA's constraining power to near zero in practice? Doesn't that make it less a "constraint" and more a minor curiosity?

  5.  **On Action & Longtermism:**
      *   **Question:** If DA successfully shrinks our estimate of total future observers, it proportionally shrinks the expected value of saving those future lives (e.g., reducing x-risk). Doesn't this directly undermine the core motivation for longtermist action? If you accept DA as a strong constraint, shouldn't you logically *reduce* your investment in far-future causes?
      *   *Likely Answer:* "No. The DA tells us the *probability distribution* over total numbers. Even if the mean is lower, the *tails* where vast numbers exist might still dominate expected value calculations if the probabilities there are non-zero. We should act to influence those tails."
      *   **Follow-Up:** But doesn't DA specifically shift probability mass *away* from the large-number tails and towards the smaller-number worlds? If DA is correct, doesn't it imply that the probability of achieving astronomically large future populations is much lower than we naively thought *before* considering anthropics? How can it not reduce the *expected* number of future lives saved by x-risk reduction?

  6.  **Case 1: Alien Lineage Discovery:**
      *   **Question:** Suppose we learn tomorrow that another intelligent lineage evolved in the galaxy, with a history roughly as long as ours (say, 200K years). Applying DA reasoning *to the class of "intelligent lineages in our galaxy"*, our observed rank (2nd discovered?) might suggest the total number of such lineages is small. But we just found one! Isn't this observation (another lineage exists) *in tension* with the DA prediction applied to that class? Doesn't discovering another lineage *increase* our estimate of the total number, contrary to what DA would suggest from our "early" rank?
      *   *Likely Answer:* "The reference class might need adjustment, or this could be compatible with a low total number – perhaps there are only 2 or 3."
      *   **Follow-Up:** But if discovering *one* lineage doesn't significantly revise the DA-influenced estimate upwards (maybe it just shifts probability from "1 lineage" to "2-3 lineages"), what *would* count as evidence against the DA applied to this class? Finding 10 lineages? 100? At what point does the evidence clearly contradict the DA prediction derived from our initial rank?

  7.  **Case 2: Trillion Digital Minds:**
      *   **Question:** If we create a trillion digital minds next year, vastly increasing the number of observers in our reference class within a short time, does the DA: A) Make us count as very early observers relative to the *new* total (implying imminent doom for *all* observers), B) Only apply to biological humans (making our rank late relative to ~100B, implying past doom is unlikely but future biological doom is certain), or C) Render the DA irrelevant/incoherent for this expanded class?
      *   *Likely Answer:* "They likely enter the reference class. Our rank (among biological+digital) becomes very early, implying the *total* number of observers (biological+digital) will not be vastly larger than a trillion."
      *   **Follow-Up:** So, building the digital minds triggers the DA prediction of imminent catastrophe for *them and us*. Does this imply that creating large numbers of observers is actively *dangerous* because it makes the DA predict doom? Should we *avoid* creating digital minds (or having many children) based on DA reasoning? Isn't that a perverse and counterintuitive implication?

  8.  **On Falsifiability (The Knockout):**
      *   **Question:** You present DA as a necessary constraint. What specific, observable future event or discovery would you accept as strong evidence *against* the validity of the Doomsday Argument as you formulate it? Not just "a better theory," but empirical evidence showing its predictive power or core assumption is flawed.
      *   *Likely Answer (Tricky):* "DA is a logical constraint on reasoning, not a physical theory making temporal predictions. Its 'falsification' would involve finding a flaw in the probability theory or the assumptions." OR "If humanity persists for millions of years with vast populations, it would challenge the specific model/prior used, but not necessarily the core anthropic logic."
      *   **Follow-Up:** If no conceivable observation can strongly disconfirm it – if even humanity thriving for aeons can be waved away as compatible by tweaking priors or reference classes – doesn't that make DA unfalsifiable? And if it's unfalsifiable, how can it be a meaningful empirical constraint on our estimates, rather than just a peculiar feature of how we choose to apply probability to our own existence?

  **Key Strategies Embedded:**

  *   **Forcing Nuance:** Questions 1, 2, 3, 4, 6, and 7 demand she specify *how* the reference class is defined and *why* it's immune to expansion/contraction or the "proves too much" problem. "Self-Indication" alone can't kill these.
  *   **Exploiting Tensions:** Question 2 directly attacks the SSA/SIA fork she relies on. Question 5 highlights the action-guiding tension. Questions 6 and 7 present concrete scenarios where her "constraint" leads to strange or contradictory predictions.
  *   **Highlighting Instability:** Questions 1 (digital minds), 6 (aliens), and 7 (digital minds again) show how the "constraint" changes wildly based on discoveries/actions she can't control.
  *   **Attacking Practical Relevance:** Questions 4 and 5 challenge whether DA has any bite once other evidence is considered or if it actively undermines the actions it might seem to motivate.
  *   **Demanding Falsifiability (Question 8):** This is crucial. If she cannot name specific evidence that would make her doubt DA's *practical force as a constraint*, it reveals its weakness as an empirical tool.

  Use these to steer the conversation *away* from abstract defenses of DA's logic and *towards* the concrete implications and vulnerabilities of her "necessary constraint" claim. Good luck!
