answer: |-
  **(In character as perdurantist)**  
  You've conflated two distinct issues. First, regarding the worm itself: of course the entire 4D object doesn't *become*—it simply *is*. But change isn’t a property of the whole worm; it’s a pattern across its temporal parts. When we say "you changed shape," we’re noting that *different temporal slices* of you have different shapes, just as different spatial slices of a road have different curvatures. The "before and after" asymmetry isn't erased; it's encoded in the ordering of your temporal parts under the direction of time. Your intuition that the whole worm is "fixed" is correct but irrelevant—change isn't something the *totality* does; it's how its substructures relate.  

  Second, on temporal parts having duration: I take the regress horn unapologetically. A temporal part lasting an interval *does* have proper sub-parts, and yes, those sub-parts may themselves have sub-parts. But this isn't vicious—it’s just compositional depth. Change occurs *within* the interval by virtue of variation across those sub-parts. Crucially, nothing *at any level* "becomes" in the endurantist’s sense of a numerically identical entity altering. Variation in intrinsic properties across parts is exhaustive of change; demanding a "changing subject" beyond this is begging the question against perdurantism. The regress bottoms out metaphysically in instantaneous parts (if physics permits) or pragmatically at minimal durations. Either way, change isn’t "relabeled"—it’s reductively explained.  

  **Verdict:** Holding firm that change is variation across temporal parts at some scale, conceding only that the whole worm doesn't change *as a totality*.
