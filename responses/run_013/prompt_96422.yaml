answer: |-
  Your scientific rigor meets literary translation's paradoxes beautifully. Let's reconstruct the implicit theory behind that press's practice, separating foundational presuppositions from optional corollaries.

  ### Core Presuppositions of the House Rule:
  1.  **Form is Constitutive, Not Decorative:** The practice presupposes that poetic form (meter, rhyme, structure, sonic patterns) is not merely a vessel for pre-existing "content" but is an *integral part of the meaning itself*. Altering the form fundamentally alters the *kind of meaning* or *aesthetic experience* the poem offers. A sonnet means differently than free verse on the same theme.
  2.  **Poetic Meaning is Gestalt:** Meaning arises from the *inseparable interaction* of semantic content and formal structure. Changing the structure disrupts this gestalt. The "sense" sacrificed under collision isn't the *only* sense; the preserved form carries its own semantic and affective weight.
  3.  **The Work's Identity Resides in its Structure:** The specific formal choices (stanza, refrain, acrostic) are essential to the identity of *this particular* literary work. A translation preserving these is still an instance of *that work* (in another language), however altered the semantic details. A prose crib is a *description* of the work's content, not the work itself.
  4.  **Fidelity is Multi-Dimensional & Hierarchical:** Fidelity requires preserving multiple aspects, but the practice presupposes a rigid, unstated hierarchy:
      *   **Top Tier:** Macrostructure (stanzas, line breaks), Rhyme Scheme, Refrains, Explicit Formal Constraints (acrostics, syllable counts).
      *   **Middle Tier:** Meter/Rhythm (implied by "scans perfectly" being necessary but not sufficient).
      *   **Essential Floor:** Semantic Coherence & Poetic Vitality ("living English poem").
      *   **Sacrificed Tier:** Literal/Denotative Meaning of individual words/phrases where necessary to preserve higher tiers.
  5.  **Translation as Re-Creation, Not Replication:** The act of translation, under these constraints, is seen as a creative act of *re-building the poem's structure and its integrated meaning/effect* in a new linguistic material. This justifies naming the translator alongside the author – they are the *craftsperson rebuilding the intricate machine* according to the original blueprint, using new parts.
  6.  **Genre Dictates Translation Norms:** Poetry and prose are fundamentally different linguistic artifacts requiring fundamentally different translation strategies. Prose meaning is seen as more detachable from sentence structure than poetic meaning is from verse form (hence tracking "sentence for sentence" is prioritized for prose).

  ### Addressing Your Specific Questions:
  *   **Meaning:** Form is *part of the sense itself*. The "sense" sacrificed is literal denotation; the preserved form carries connotations, emotional resonance, intellectual satisfaction (the puzzle solved), structural tension/release – all part of the poem's total meaning.
  *   **Work Identity:** The work's identity is tied to its *intentional formal structure*. If the translator rebuilds that structure and achieves a coherent, vital poem in English that *feels* like the same *kind* of formal object, it qualifies as "Marot's poem translated," despite semantic shifts. It survives altered sense because the *primary identifying structure* (as defined by the hierarchy) is preserved.
  *   **Literary Value:** The value prioritized is **experiential-formal**. The loss of rhyme scheme diminishes the *specific aesthetic experience* – the pleasure of pattern, surprise, resolution, sonic texture – that the original provides. Losing a proposition diminishes informational content, but the practice values the *poetic experience* over pure information. The rhyme scheme *is* part of the poem's cognitive value *as art*.
  *   **Fidelity:** Fidelity is defined as faithfulness to the *structural essence* and *experiential effect* achieved through that structure. The hierarchy exists but isn't stated because the practice presupposes these formal elements *are* the most essential aspects of *poetic* works. The rule *is* the statement of the ranking.

  ### Underdetermined Aspects & Competing Theories:
  *   **The "Living Poem" Criterion:** This is the crucial underdetermined point. *How much* semantic deviation or awkwardness is tolerated? *What exactly* constitutes "poetic vitality" in English? This relies entirely on the editor's subjective aesthetic judgment. This is where a "new poem" theory *could* sneak in, but the strict formal constraints prevent it from being truly *new*. It's forced re-creation within bounds.
  *   **Content-First vs. Form-First:** Your suspicion is correct that a sufficiently flexible **content-first** theory ("capture the *essential* meaning/experience, even if form changes") *could* potentially license *some* formal translations *if* the translator felt form was essential to that meaning. However, it could never justify the *absolute priority* ("sacrifice sense") mandated by this press. Conversely, a pure **"new poem"** theory justifies the translator's co-author status and creative effort but *cannot* justify the draconian formal constraints forbidding inventing new rhymes or structures. The press's theory is a **strong form-first recreationism**, distinct from both.
  *   **The Role of the Translator:** The practice presupposes the translator as a *master craftsman* working within strict parameters to recreate a complex artifact, not a free artist *or* a servile copier. The "creative art" is the skill of solving the multi-constraint puzzle while achieving vitality.

  ### The Switch to Content-First: Consequences for the Press
  If the editor abandoned form-first recreationism for content-first translation:
  1.  **Rejection Letters:** Would shift from "Your tercets don't scan" / "You altered the refrain" to "You missed the tone" / "The imagery feels flat in English" / "This paraphrase loses the urgency" / "The emotional core is distorted." Formal perfection would become irrelevant.
  2.  **Contracts & Credits:** Translators might still be credited prominently, but the justification would shift from "co-recreator of the structural artifact" to "skilled interpreter conveying the essence." The "author" status would weaken.
  3.  **Editorial List:** The poetry list would diversify wildly. Formal verse translations (if any) would be exceptional, chosen only where form was deemed *crucial* to meaning, not as a universal rule. Free verse, loose interpretations, and thematic responses would dominate.
  4.  **Catalog Copy:** "Creative art" would be redefined as interpretive skill and stylistic recreation in the *target* language's idiom, not fidelity to the source structure. The focus would be on capturing the "spirit" or "essential experience."
  5.  **Prose Practice:** Would likely remain largely unchanged, as content-first is already the dominant mode for prose translation.

  ### In Essence
  The press's practice rests on a **strong formalist ontology of poetry**: the poem *is* its structure as much as its words. Translation, therefore, is the **faithful reconstruction of that structural artifact in new materials**, prioritizing the essential blueprint over the specific components. The "living poem" requirement is the pragmatic floor ensuring the reconstruction isn't a hollow shell, but the *shape* of the shell is sacrosanct. It's not sentiment, but a belief that altering the form destroys the specific artistic object, turning it into something else – a commentary, an inspiration, but not *that poem*. The trade-off (sense vs. form) isn't merely assumed; it's argued by the very act of prioritization: the form *is* the higher value *for this specific artistic category*. Whether one agrees hinges on whether one accepts that formal structure is constitutive of a poem's identity and primary value. Your scientific instinct for invariant results clashes with the artistic view that the *specific formal manifestation* of the result *is* the result.
