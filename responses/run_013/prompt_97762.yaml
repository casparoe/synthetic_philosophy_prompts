  Okay, let me unpack this user's query. They're getting married next spring and their uncle, who studied philosophy, presented a binary view of the marriage debate. The user feels there might be more nuance and wants a thorough analysis.

  First, I need to break down the uncle's two claims: the conjugal view (marriage as inherently procreative) versus the revisionist view (marriage as committed love). The user suspects oversimplification, especially regarding infertility and the religious/secular framing.

  The user's main request is to examine each claim, identify what proponents of the conjugal view actually accept, where distortions occur, and factual errors. They also want to know if the religious/secular dichotomy logically follows and how the revisionist view avoids including polyamory or platonic relationships.

  I recall that defenders of the conjugal view, like Sherif Girgis or Robert George, don't deny marriage to infertile couples. Their argument centers on the inherent structure of the act, not outcomes. For them, it's about the type of union, not successful reproduction. That addresses the infertility point the user is bugged by.

  On the revisionist side, the user is right that "two people who love each other" isn't the full picture. Legal marriage requires exclusivity, permanence, and mutual support—elements that distinguish it from friendships. Think of the Supreme Court's emphasis on dignity and commitment in Obergefell, not just affection.

  The religious/secular framing is tricky. While the conjugal view has religious roots, secular philosophers like Kant have similar views. Conversely, the revisionist position isn't anti-religious; many religious groups support same-sex marriage. The government's role is about legal recognition, not enforcing theology, so the uncle's claim here oversimplifies.

  The user seems analytically inclined, wanting to avoid bias. They acknowledge the infertility issue but question the framing. I should validate their instincts—yes, the infertility problem is a real tension, and the religious/secular divide isn't clean. Their suspicion is spot-on.

  For polyamory, the revisionist view doesn't inherently include it because marriage traditionally involves dyadic commitment. Extending marriage to multiple partners would require a different societal shift, separate from same-sex marriage.

  I should structure the response to clarify each view, correct misconceptions, and explain why the government's role is about legal benefits, not word enforcement. Highlighting that the debate is more about the state's interests than religious imposition will address their deeper concern about fairness and inclusion.

  Also, noting that both sides have nuanced positions beyond soundbites will help the user recognize standard arguments versus distortions. Emphasizing that the conjugal view's "nature" argument is about complementary biology, not individual fertility, should resolve their first bug. For the second, clarifying that revisionists focus on structured commitment, not just love, tackles their second concern.
answer: |-
  Here’s a rigorous breakdown of your uncle’s claims, separating accuracy from oversimplification, distortion, and genuine disagreement. His summary captures *a* prominent framing but misses key nuances and stakes:

  ### Claim 1: "Marriage is the union of a man and a woman, ordered toward having and raising kids together."
  *   **What proponents (conjugal view) happily sign onto:**  
      Marriage is a *comprehensive union* inherently oriented toward procreation due to the biological complementarity of man and woman. It unites spouses physically (sexual intercourse), emotionally, and socially. The *capacity* for the *type of act* that creates new life (even if infertility prevents conception) defines the union's nature. Children are seen as a natural fruition, not a requirement for validity.
  *   **What they say is a distortion:**  
      The claim that they *deny marriage to infertile couples*. They argue:  
      *   **Formal cause:** The union is defined by the *kind of act* that unites them (reproductive-type acts), not the *outcome* (actual children). An infertile couple still performs acts of the same kind that *could* create life if not for a biological defect.  
      *   **Accidental defect vs. essential lack:** Infertility is seen as a tragic accident affecting specific individuals, not an essential feature of the relationship itself. Same-sex couples inherently lack the biological capacity for the *kind of union* that defines marriage.  
      *   **Intentionality:** The union is naturally ordered toward children, even if conception is impossible. The spouses' mutual self-giving in this specific way retains its procreative meaning.
  *   **What's factually wrong/oversimplified:**  
      *   **Not solely about children:** Proponents emphasize that marriage *also* involves deep friendship, mutual support, and exclusivity – but these are seen as perfected *within* the comprehensive union oriented toward family.  
      *   **"Stuck with the logic":** They argue they *aren't* "stuck" denying marriage to infertile couples due to the "kind of act" distinction. This is their core rebuttal to the "infertility bullet."  
      *   **"Hard bullet to bite":** While acknowledging it's counterintuitive to modern sensibilities, proponents argue it's logically consistent *within their framework* and reflects a deeper truth about human nature.

  ### Claim 2: "Marriage is a loving, committed relationship between two adults, full stop."
  *   **What proponents (revisionist/consent-based view) actually claim:**  
      Marriage is primarily a framework for **adult commitment, care, and mutual flourishing**. Key elements include:  
      *   **Exclusive, enduring commitment:** Lifelong (intended) exclusivity and mutual responsibility.  
      *   **Mutual care & support:** Emotional, financial, domestic interdependence.  
      *   **Social & legal recognition:** Provides stability, benefits, and clear obligations for partners and any children they raise (biological or adopted).  
      *   **Consent & love:** Founded on mutual consent and affection, though the *type* of love is specific (romantic/partnered commitment, not platonic).  
      *   **Children are *a* reason, not *the* reason:** Marriage provides a stable environment *for raising children*, but procreation is neither necessary nor sufficient to define the marital bond itself.
  *   **What they say is a distortion:**  
      *   **"Just about love" / "Any two people":** Proponents strongly reject that their view necessitates including platonic friends or polyamorous groups. They argue marriage requires:  
          *   **Romantic/sexual commitment:** Distinct from friendship.  
          *   **Exclusivity & permanence:** Distinct from casual relationships.  
          *   **Dyadic structure:** Historically and functionally centered on two people due to the depth of commitment, legal manageability of dyads, and alignment with child-rearing structures. Expanding beyond two is seen as a *different* question with distinct complexities.
      *   **Denying the importance of children:** They acknowledge marriage's role in child-rearing stability but argue this role is fulfilled equally well by same-sex parents and doesn't require the *relationship itself* to be inherently procreative.
  *   **What's oversimplified:**  
      "Full stop" is misleading. The revisionist view *does* define specific requirements (commitment, exclusivity, mutual support) that rule out casual relationships, friendships, or polyamory *under current legal frameworks*. The debate about polyamory is ongoing but separate.

  ### Claim 3: "It's religious vs. secular & about the government enforcing a definition."
  *   **Accurate Core:**  
      The *historical roots* of the conjugal view are deeply intertwined with religious (especially Abrahamic) teachings. The revisionist view aligns with secular, individualist modernity. The fight *involves* whose definition the *state* adopts in law.
  *   **Distortion/Oversimplification:**  
      *   **Not *inherently* religious vs. secular:**  
          *   Some secular philosophers defend versions of the conjugal view based on natural law or human flourishing (e.g., some Aristotelians).  
          *   Many religious people and denominations support the revisionist view (e.g., affirming LGBTQ+ marriages).  
      *   **Not *simply* enforcing a definition:** The fight is about **what interests the state has in regulating relationships.**  
          *   Conjugal view: State interest is tied to regulating the institution that produces and raises the next generation.  
          *   Revisionist view: State interest is in stabilizing *any* deeply interdependent adult relationships that create mutual obligations and often involve child-rearing, and in ensuring equal dignity/citizenship.
      *   **"Enforcing a word":** It's deeper than a dictionary fight. It's about **legal status, rights, benefits, and social recognition.** The word "marriage" carries immense legal and cultural weight. The fight is over which relationships qualify for that status and its attendant privileges/obligations.

  ### Addressing Your Specific Bugs & Instincts
  1.  **Infertility:** Your instinct that it's a "real cost" is correct. Proponents of the conjugal view *must* grapple with it. Their defense (the "kind of act" distinction) is their main counter, but critics find it unconvincing and arbitrary (why privilege the *act type* over the *potential outcome* or the *relationship structure*?). It remains a significant point of contention and is widely seen as a weakness by critics.
  2.  **"Two People Who Love Each Other":** Your suspicion is spot-on. The revisionist position is **not** "any two loving adults." It's about **committed, exclusive, romantic partnerships** structured for mutual lifelong support. This inherently excludes platonic friends (lacks romantic commitment) and currently excludes multi-partner relationships (lacks exclusivity/dyadic structure in current law). The debate about polyamory is about whether *that* structure *also* fulfills the state's interests – a separate argument.
  3.  **Religious/Secular Framing:** Your instinct is **correctly suspicious.** While there's correlation, it's not causation. The core disagreement is **philosophical/anthropological**: What *is* marriage fundamentally *for*? What constitutes a marital union? What are the state's legitimate interests? Reducing it purely to religion vs. secularism ignores non-religious defenders of the conjugal view and religious supporters of same-sex marriage. It also obscures the substantive debate about state interests.

  ### Standard Talking Points vs. Quietly Taking a Side
  *   **Standard Talking Points:**  
      *   Conjugal Side: "Marriage is about children/procreation," "Biology matters," "Historical definition," "Infertile couples exception."  
      *   Revisionist Side: "Marriage is about love/commitment," "Equality," "Government shouldn't enforce religious views," "Infertile/past-childbearing couples *are* married."
  *   **Where Uncle Takes a Side (Quietly):**  
      1.  **Framing the Infertility Issue:** He presents the conjugal view as *forced* to deny marriage to infertile couples as a "hard bullet," implying it's an absurd consequence they reluctantly accept. This stacks the deck *against* the conjugal view by dismissing their core counter-argument ("kind of act").  
      2.  **"Full Stop":** Describing the revisionist view as "a loving, committed relationship between two adults, full stop" ignores the specific structures (exclusivity, permanence, mutual support) that proponents actually argue for, making it sound simpler and more expansive than it is.  
      3.  **Religious/Secular Dichotomy:** Framing it this way implicitly paints the conjugal view as sectarian/backward and the revisionist view as neutral/progressive, sidestepping the substantive philosophical debate about the nature of marriage and state interests.

  ### Conclusion
  Your uncle captures *a* common, intellectually coherent framing of the debate, but it's a **polemical** framing favoring the revisionist view. Key oversimplifications are:
  1.  Underplaying the conjugal view's "kind of act" distinction for infertility.
  2.  Over-simplifying the revisionist view to "just love" instead of emphasizing its core structure of exclusive, enduring, mutual support.
  3.  Reducing the conflict to religion vs. secularism, ignoring the deeper philosophical disagreement about the nature of marriage and the state's interest.

  The "infertility bullet" is a significant challenge for the conjugal view, but they have a defined counter-argument. The revisionist view is not as boundless as "two people who love each other" suggests; it has specific structural requirements focused on dyadic, exclusive, lifelong commitment. The debate is fundamentally about **competing visions of what marriage is as a human good and what interests the state has in recognizing it** – not merely "enforcing a definition." Your instincts about the complexity of the infertility issue and the limitations of the religious/secular frame are sharp.
