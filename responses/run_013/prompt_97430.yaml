  I need to unpack the implicit theories behind each practice. For perjury, the strict requirement of literal falsity suggests the legal system prioritizes precise questioning over witness ethics - it's about provability rather than moral judgment. Fraud/securities law takes the opposite view, treating intent to deceive as the core wrong, making paltering equivalent to lying. Advertising law splits the difference by focusing on audience expectations - commercial speech gets more leeway for exaggeration. Defamation lands somewhere in between, protecting true statements but punishing misleading implications that cause reputational harm.

  The key is recognizing these aren't philosophical positions but context-dependent solutions. Perjury's rules prevent fishing expeditions in court, while securities law prioritizes investor protection. No single theory explains all four because they serve different institutional purposes. If we forced an "intent to deceive" standard universally, perjury prosecutions might increase but cross-examination would become more adversarial, advertising would drown in litigation, and defamation suits might turn into mind-reading contests.

