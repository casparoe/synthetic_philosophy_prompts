     - Pair 2: B vs C
     - Pair 3: C vs A

  2. The facilitator (you, as shopkeeper) collects the slips and records the choices. Then reveals the three gambles and shows each participant that their choices form a cycle (if they do: A>B, B>C, C>A).

  3. The shopkeeper then gives the participant one of the gambles (say, A) and offers:
