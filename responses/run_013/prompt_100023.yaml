  ### Money Pump Workshop: Synchronic & Diachronic Pumps in Action  
  **Goal:** Make money pumps viscerally tangible as threats to rational choice, using hands-on activities that lead into deep debates about rationality, naivety, and time-slicing.  

  ---

  ### **Materials**  
  **Station 1: Swap Shop (Synchronic Pump)**  
  - **Gamble Cards** (laminated, one set per participant):  
    - **A**: "Sure 3 chips"  
    - **B**: "80% chance of 4 chips, 20% chance of 0"  
    - **C**: "10% chance of 35 chips, 90% chance of 0"  
  - **Choice Slips**: 3 slips per participant (A vs. B, B vs. C, C vs. A).  
  - **Chips**: ~20 chips per participant (start with 10, lose/gain via trades).  
  - **Shopkeeper Ledger**: Tracks preferences and trades.  
  - **Dice/Coin**: For resolving gambles post-activity.  

  **Station 2: Now-or-Later (Diachronic Pump)**  
  - **Option Cards** (per pair):  
    - **X**: "5 chips NOW"  
    - **Y**: "8 chips in 15 MINUTES"  
    - **Y+commit**: "Pay 1 chip NOW to lock in 8 chips in 15 min (no buyouts!)"  
  - **Bank Script** (per bank): Timed offers:  
    - **t=0min**: Present X, Y, Y+commit.  
    - **t=5min**: Offer 6 chips NOW to abandon Y.  
    - **t=10min**: Offer 4 chips NOW to abandon Y.  
  - **Timer**: For tracking rounds.  
  - **Chips**: Bank holds extras for payouts.  

  **General**:  
  - **Payoff Sheet** (participant copy):  
    ```  
    Chips = Raffle entries (1 chip = 1 entry) OR Snack-table priority.  
    Raffle: 1st = 50% of snacks, 2nd = 30%, 3rd = 20% (adjust based on chip totals).  
    ```  
  - **Debrief Handout**: Key arguments, discussion questions.  

  ---

  ### **Run Sheet & Timeline** (90 min total)  
  **Group Split**: 12 people → Group A (6) and Group B (6).  
  - **0–5 min**: Intro (whole group).  
    - *You*: "Today, you’ll *live* two rationality traps. No lecturing—just choices, trades, and consequences. Chips = snacks/raffle. Goal: Survive with max chips."  

  #### **Station Rotation** (Two parallel 30-min blocks)  
  **Station 1: Swap Shop** (Facilitated by you, the "Shopkeeper")  
  - **5–10 min**: *Elicit preferences*:  
    - Give each participant 3 choice slips (show pairs **one at a time**).  
    - Collect slips; record preferences on ledger.  
  - **10–15 min**: *Reveal loops*:  
    - Show all 3 gambles. Highlight cycles (e.g., "You chose A>B, B>C, C>A—this loops!").  
    - Give each participant 10 chips + **Gamble A** ticket.  
  - **15–35 min**: *Pump phase*:  
    - Approach cyclers: "I see you prefer C to A. Swap your A for C? Fee: 1 chip." → Repeat for B>C and A>B.  
    - Cycle again if they agree: "Swap C for B? Fee: 1 chip." → "Swap B for A? Fee: 1 chip."  
    - Non-cyclers watch or get "safe trader" badge.  
  - **35–40 min**: *Resolve gambles*: Roll dice for gamble outcomes.  

  **Station 2: Now-or-Later** (Pairs: 1 Agent, 1 Bank)  
  - **5–10 min**: *Choose plan*:  
    - Agent picks: **X** (5 now), **Y** (8 later), or **Y+commit** (pay 1 to lock in 8 later).  
  - **10–20 min**: *Round 1 (t=5min)*:  
    - Bank offers Agent **6 chips now** to abandon **Y** (if no commitment).  
  - **20–30 min**: *Round 2 (t=10min)*:  
    - If Agent rejected Round 1, Bank offers **4 chips now** to abandon **Y**.  
  - **30–35 min**: *Payout*: Resolve chips (e.g., **Y** pays 8 at t=15min).  
  - *Switch roles*: If time, repeat so both experience Agent role.  

  **40–45 min**: Groups swap stations.  
  **45–80 min**: Repeat stations (Group B at Swap Shop, Group A at Now-or-Later).  

  #### **80–90 min: Guided Debrief**  
  1. **Map stations to theory**:  
     - *Swap Shop*: "This is the **synchronic pump**. Your intransitive preferences (A>B, B>C, C>A) let me drain chips by looping trades. Argument: **Rationality requires transitivity**."  
     - *Now-or-Later*: "This is the **diachronic pump**. If you planned for 8 later but took 6 or 4 now, your time-inconsistent discounting (e.g., hyperbolic) made you exploitable. Argument: **Rationality requires time-consistent plans**."  

  2. **Turn on the argument**:  
     - "But is being pumpable *irrational*? Or does it assume:  
       - **Naivety**? Sophisticated choosers refuse trades (e.g., stop cycling after reveal).  
       - **Obligation to trade**? Real agents decline 'deals' (e.g., say no to the shopkeeper).  
       - **What’s the 'unit' of rationality**? The *whole person* (bind your future self) or *time-slices* (respect later you's preferences)?"  

  3. **Spark debate**:  
     - "Station 1: If you spotted the loop and refused trades, are you rational *despite* your intransitive preferences?"  
     - "Station 2: Is paying to commit a rational act of self-control, or tyranny over your future self?"  
     - "When time-slices conflict, who wins? Vote: Whole-person vs. time-slice rationality."  

  ---

  ### **Handling Predictable Issues**  
  1. **No cycles in Station 1** (Likely! Expected 30–50% avoid loops):  
     - **Workaround**: Use a "demonstration participant" (planted or volunteer) with a known cycle. Pump them publicly.  
     - **Silver lining**: "Many of you avoided cycles! Why? Risk aversion? Let’s discuss normative vs. descriptive rationality."  

  2. **Refusal to trade post-reveal** (Most will stop after 1–2 cycles):  
     - **Lean in**: "Ah, you became *sophisticated*! But does that make your initial intransitivity harmless? Or is it still a flaw?"  
     - **Probe**: "If I hid the loop, would you have kept trading? Pumping preys on naivety."  

  3. **Station 2 lacks genuine time-inconsistency**:  
     - **Acknowledge**: "This can’t *induce* true time-inconsistency—it’s a short lab exercise. But experiments (e.g., [Thaler, 1981](https://www.jstor.org/stable/183331)) show people *do* discount hyperbolically: e.g., prefer $100 today to $110 tomorrow, but $110 in 31 days to $100 in 30 days."  
     - **Enhance**: Frame chips as "snack tickets"—hungry agents may take buyouts.  

  4. **Other hiccups**:  
     - **Banks/Agents off-script**: Provide simple scripts. Emphasize: "Banks *must* follow the script—no improv!"  
     - "Why gamble?": Resolve gambles fast with dice. For Station 1, **expected values**: A=3, B=3.2, C=3.5.  

  ---

  ### **What the Activity Can’t Do**  
  - **Induce true time-inconsistent preferences**: Participants won’t *feel* hyperbolic discounting. *You* must cite evidence (e.g., [Laibson, 1997](https://www.nber.org/papers/w5767)).  
  - **Simulate naivety**: Grad students will anticipate pumps. Use this! "Sophistication saves you—but is it cheating the thought experiment?"  
  - **Prove irrationality**: Highlights *vulnerability*, not necessarily irrationality. "The pump is a *warning*, not proof. Rationality debates are philosophical!"  

  ---  
  **Outcome**: Participants leave with visceral intuition of money pumps, primed to critique rationality axioms. The real win? "I thought pumps were toy examples—now I see they’re predatory!" → Mission accomplished.
