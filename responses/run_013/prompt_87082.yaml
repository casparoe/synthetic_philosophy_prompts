answer: |-
  Below is a decision tree designed to address the question of individual obligations in cases of imperceptible harm, starting from the premise that the token act (e.g., one burger, one flight, one vote) makes **no perceptible difference** to the harm. The tree is built from the logical space of arguments, with internal nodes phrased as yes/no or three-way questions answerable without prior knowledge of the positions. Each leaf is a named position (or "unnamed"), with a note on its "awkward commitment" (i.e., the aspect that makes it philosophically contentious). The tree handles the four specified cases and distinguishes key dimensions: difference-making (actual, expected, or none), morally relevant relations to the harm, grounds for obligation, and conditionality.

  ### Decision Tree
  **Start**: You grant that your token act makes no perceptible difference to the harm (e.g., it doesn’t change the outcome of the election, alter the store’s supply chain, cross a threshold, or prevent replaceability).

  1. **Could your act have been pivotal? (i.e., was there a non-zero probability, ex ante, that it might have made a difference?)**
     - **Yes** → Go to 2.
     - **No** → Go to 3.

  2. **Does the obligation arise from the expected consequences of the act?**
     - **Yes** → **Leaf: Expected Utility Consequentialism**  
       *Awkward commitment*: You must act as if your imperceptible act might be the pivotal one, even when it never actually is (e.g., voting in a non-close election "just in case" it becomes close).  
       *Fits cases*: Vote (if there's any chance of closeness), tipping-point (if uncertainty exists), burger/flight (if supply chains might shift).  
     - **No** → **Leaf: Threshold Deontology**  
       *Awkward commitment*: You are obligated because you are part of a set that *collectively* crosses a harm threshold, even if your individual act wasn’t pivotal (e.g., refusing to be the "trigger" in a tipping-point case).  
       *Fits cases*: Tipping-point (when you know you’re at the threshold), vote (if seen as part of a decisive bloc).  

  3. **Does your act stand in a morally relevant relation to the harm? (e.g., as a part of a set that causes harm, a contributor to a shared practice, etc.)**
     - **Yes** → Go to 4.
     - **No** → **Leaf: No Obligation (Innocuous Causation)**  
       *Awkward commitment*: No obligation exists because your act is causally inert and unrelated to the harm—even if you participate, you’re "just one drop in the ocean."  
       *Fits cases*: Vote (if your candidate loses badly), burger (if the store’s supply is fixed and your purchase doesn’t affect demand), replaceable act.  

  4. **Is the relation one of fair cooperation (e.g., avoiding free-riding)?**
     - **Yes** → Go to 5.
     - **No** → Go to 6.

  5. **Is the obligation conditional on others' compliance?**
     - **Yes** → **Leaf: Conditional Fairness (Fair-Play Theory)**  
       *Awkward commitment*: You must cooperate only if enough others do; otherwise, you’re free to "defect" (e.g., you needn’t recycle if most others don’t).  
       *Fits cases*: Burger, flight, vote—all conditional on collective action.  
     - **No** → **Leaf: Unconditional Fairness (Duty of Fairness)**  
       *Awkward commitment*: You must "do your part" unconditionally to avoid free-riding, even if your act is replaceable and others won’t comply (e.g., you must boycott sweatshops even if your abstention changes nothing).  
       *Fits cases*: Burger (fixed supply), replaceable act (e.g., someone else takes your flight seat).  

  6. **Is the relation grounded in expressing values or virtue?**
     - **Yes** → **Leaf: Expressivism/Aretaic Ethics**  
       *Awkward commitment*: You must act to express opposition to the harm or cultivate virtue, regardless of consequences (e.g., refusing a burger to "stand against factory farming," even if it’s wasted).  
       *Fits cases*: Burger, flight, vote—all seen as symbolic acts.  
     - **No** → **Leaf: Complicity-Based Obligation**  
       *Awkward commitment*: You are obligated because your act makes you complicit in a harmful practice, even if it causes no incremental harm (e.g., buying a burger contributes to a system that kills animals, making you morally tainted).  
       *Fits cases*: Burger (fixed supply), flight, replaceable act.  

  ### Tree Structure Summary
  - **Internal Nodes**: 5 (Q1–Q6, with Q4 and Q6 branching from Q3).
  - **Leaves**: 8 named positions (including "No Obligation").
  - **Empty Combinations**: None—all paths lead to a defended position. The tree’s logic avoids incoherent/unattractive combinations by design.

  ### How Cases Map to Leaves
  1. **Single vote (non-close election)**: 
     - Usually ends at **No Obligation** (Q3→No) if the vote is for a loser. If for a winner, may go to **Conditional/Unconditional Fairness** (Q4→Yes) or **Expressivism** (Q6→Yes), depending on the fairness/expression rationale.
  2. **Single burger (fixed supply contract)**:
     - Often ends at **Conditional/Unconditional Fairness** (Q4→Yes) or **Complicity** (Q6→No), as the act is replaceable but part of a harmful practice.
  3. **Tipping-point case (one act crosses threshold)**:
     - Goes to **Threshold Deontology** (Q1→Yes→Q2→No) if known to be pivotal, or **Expected Utility Consequentialism** (Q1→Yes→Q2→Yes) if uncertain.
  4. **Replaceable act (harm occurs even if you abstain)**:
     - Typically ends at **Unconditional Fairness** (Q4→Yes→Q5→No) or **Complicity** (Q6→No), as the act is non-pivotal but participatory.

  ### Most Confusing Leaf Pairs
  1. **Expected Utility Consequentialism vs. Threshold Deontology** (Leaves from Q2):  
     Both address pivotal potential, but the former is consequence-focused (expected harm), while the latter is duty-focused (collective threshold-crossing). Students often conflate them as "both deal with probability."
  2. **Conditional Fairness vs. Unconditional Fairness** (Leaves from Q5):  
     Both prohibit free-riding, but the former is context-dependent (requiring others' cooperation), while the latter is absolute. Students miss the conditionality distinction, lumping them as "fairness views."
  3. **Expressivism vs. Complicity** (Leaves from Q6):  
     Both are non-consequentialist, but expressivism focuses on self-expression/virtue, while complicity focuses on causal entanglement in harm. Students confuse "expressing values" with "being part of the problem."

  ### Key Features
  - **Forces Distinctions**: By separating difference-making (Q1), relation to harm (Q3), grounds (Q4, Q6), and conditionality (Q5), the tree prevents "consequentialist vs. deontologist" collapse.
  - **Handles All Cases**: The four cases are covered through branching (e.g., replaceability is handled at Q5 and complicity; tipping-points at Q1–Q2).
  - **Logical Coverage**: Includes actual difference (none, per start), expected difference (Q1), relations (set membership, practice participation in Q3), grounds (consequentialist, fairness, expressive/aretaic in Q2/Q4/Q6), and conditionality (Q5).
  - **Efficiency**: 5 internal nodes, 8 leaves—compact yet comprehensive.

  This tree encourages students to engage with the nuances of each position, moving beyond simplistic dichotomies. Use it as a one-page reference during debates or case analyses.
