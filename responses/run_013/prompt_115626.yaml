prompt: |-
  i just moved abroad for a job and honestly its the small stuff thats throwing me, not the big cultural stuff. where i'm from, tipping at a restaurant was basically mandatory, like 20% or you're a bad person, and here you don't tip at all and people act like it would be weird if you did. where i'm from you could cross against the light if nothing was coming and nobody blinked; here everyone stands at an empty crossing at 6am waiting for the little green man, and i've gotten actual looks for stepping off. and the queueing: the bakery by my flat has no sign anywhere, but the rule everyone follows is you take a paper ticket when you come in, except if you only want bread and the counter is free you just walk up, and if someone who was obviously ahead of you gets served first somebody will cough meaningfully. same people, at the kiosk in the station, will absolutely shove past you.

  what i want to know is what these practices presuppose. does the no-tipping thing presuppose that the price on the menu is the whole price and that service isn't something the customer has any business paying for separately, i.e. a view about what a wage is and whose obligation it is? or is it just a convention with no theory behind it that i'm overreading? same with the bakery: does the ticket rule presuppose that your place in line is a kind of property you acquire by arriving, or that queues are fair only because they're blind to who you are? those come apart the second the person who grabbed a ticket first was just chatting with a friend and i only want one roll. and the red light: is the practice assuming that a law serving no purpose at 6am generates no reason at all, or that it's a coordination device whose whole value is that everyone does the same thing even when its pointless?

  then the part i actually need for next week: which of these am i, as a visitor, bound by? if i tip anyway, have i wronged the server, my hosts, or nobody? if i jaywalk, am i off the hook because i'm a guest, or more on the hook because i should be on my best behavior?

  don't just lay the options out and leave it to me. tell me which reading you actually think is right for each one, give your reasons, and say clearly where you're just guessing. and flag it if a practice is doing no philosophical work at all and i'm just reading theory into it.
reasoning: |-
  Okay, the user just moved abroad and is grappling with unspoken social rules—tipping, jaywalking, queueing—and wants to understand their underlying principles and their obligations as a foreigner. 

  First, I need to unpack each practice philosophically without overcomplicating. The user’s tone is analytical but slightly frustrated ("small stuff throwing me"), so clarity is key. They’re not just asking "what" but "why" and "what does this imply about values?" 

  For tipping: They’re contrasting mandatory tipping back home with zero-tipping here. The core question is whether no-tipping reflects a belief that wages are the employer’s duty (not customers’), or if it’s just convention. I lean toward the former—it’s structural. If service charges are included, that signals labor costs are baked into pricing, making tipping redundant or even undermining wage fairness. But I should note it’s not purely ideological; historical inertia plays a role too. 

  The bakery queue system is fascinating. Tickets formalize "first come, first served" as sacred, but exceptions exist (e.g., quick bread grabs). This isn’t just blind fairness—it’s situational efficiency. The cough when someone skips? That’s enforcing social contract: "Your time-right is property, but don’t abuse it." The kiosk shoving contradicts this, though. Probably because kiosks are high-pressure, transient spaces where anonymity overrides community norms. So: queues presuppose moral ownership of place *only in stable contexts*. 

  Jaywalking at empty crossings feels like pure coordination theory. Standing at red lights isn’t about safety at 6 a.m.—it’s about predictability. If *everyone* always obeys, you trust drivers won’t surprise you and pedestrians won’t dart out. Breaking it risks eroding that trust. No deep philosophy, just game theory in action. 

  Now, the user’s real anxiety: "As a foreigner, what binds me?" They’re worried about offending ("wronged the server?") or being judged ("more on the hook"). For tipping: Adding money implies the system is broken, which could insult locals. Best to follow local custom unless you’re compensating for exceptional service discreetly. Jaywalking? If alone, no harm—but with others, you’re modeling bad coordination. Queueing is non-negotiable; violating it directly harms others (stolen time). 

  Biggest insight: These aren’t arbitrary. Tipping reflects labor ethics; queues balance fairness with efficiency; jaywalking laws prioritize collective trust over individual convenience. User should prioritize queue norms most (they’re community-focused) and view jaywalking as context-dependent. 

  ...Wait, did they mention feeling judged ("actual looks")? That’s key. Their deeper need might be social belonging, not just rule-decoding. They want to avoid ostracization. So I’ll emphasize that following norms signals respect—even silly ones—and that’s what locals notice more than philosophical alignment.
answer: |-
  You're grappling with the invisible architecture of social life – the unspoken rules that reveal how a culture constructs fairness, obligation, and order. Let's break down each practice, identify what it likely presupposes, and then tackle your crucial question about your obligations as a visitor. I'll give you my reasoned judgments, flagging speculation.

  **1. Tipping: The Obligation of the Wage**
  *   **Your Reading:** "Does no-tipping presuppose that the menu price is the whole price, service isn't a customer-paid extra, and wages are the employer's obligation?"
  *   **My Judgment:** **Yes, this is the core presupposition.** It's not *just* a mindless convention; it reflects a specific socio-economic philosophy.
  *   **Reasons:**
      *   **Embedded Cost:** The menu price explicitly includes the total cost of service. Separating it out implies service is an optional extra or charity, not a fundamental part of the transaction.
      *   **Employer Responsibility:** The system presupposes that fair compensation is the *employer's* legal and ethical duty, achieved through wages/salaries and potentially collective bargaining, not a variable customer subsidy.
      *   **Professionalism:** It assumes service staff are professionals entitled to a stable, predictable income, not dependent on the whims or financial state of individual customers. Tipping can be seen as undermining this professional status, making servers beholden to patrons.
      *   **Simplicity & Transparency:** It values knowing the exact cost upfront without hidden calculations or social pressure.
  *   **Caveat:** Historical accident plays a role. The tipping norm in your home country likely evolved from specific labor market conditions, and its absence elsewhere reflects different histories. But the *persistence* of the no-tipping norm *today* is sustained by the philosophical principles above.
  *   **Is there "no theory"?** No, there's a clear theory: labor costs are the employer's responsibility and should be transparently included in the price.

  **2. The Bakery Queue: Situational Fairness & Social Enforcement**
  *   **Your Reading:** Does the ticket rule presuppose "place-in-line as property acquired by arrival" or "queues are fair only blind to who you are"?
  *   **My Judgment:** **It presupposes "first-come, first-served" as the fundamental principle of fairness, but with situational flexibility governed by community norms and efficiency.** It's more nuanced than pure property or pure blindness.
  *   **Reasons:**
      *   **Ticket = Claim:** The ticket system formalizes "time of arrival" as the sole criterion. Acquiring the ticket *is* staking your claim to a place in an abstract queue. This *is* a form of temporal property right.
      *   **Efficiency Exception:** The "if you only want bread and the counter is free" rule presupposes that rigid adherence is inefficient for very simple transactions. It values collective time-saving *provided* no one with a prior claim is disadvantaged. This exception relies on:
          *   **Self-assessment:** Honesty about the simplicity of your request.
          *   **Situational awareness:** Ensuring the counter is truly free *and* no one waiting has a simpler request or a prior claim.
      *   **The Meaningful Cough:** This presupposes that the queue order is a shared social contract. Violating it (by skipping when you shouldn't, or the server taking someone out of order) is a minor injustice against the group. The cough is a low-level social sanction enforcing the norm. It assumes people recognize the violation and feel empowered (or obligated) to gently correct it.
      *   **Kiosk Contrast:** The shoving at the kiosk suggests the presuppositions change with context. High-transit, anonymous, time-pressured environments (like a station) prioritize individual speed over collective order. The "property right" established by arrival is weaker here because enforcement mechanisms (like the "cough") are absent, and the perceived stakes of waiting might be higher. It presupposes different norms apply in anonymous vs. community spaces.
  *   **Philosophical Work?** Definitely. It's about distributive justice (allocating service time), efficiency, and the role of community norms in enforcing fairness. It's not mindless habit.

  **3. The Red Light: Coordination as the Supreme Good**
  *   **Your Reading:** Does it presuppose "a purposeless law generates no reason" or "it's a coordination device whose value is universal adherence, even when pointless"?
  *   **My Judgment:** **Overwhelmingly the latter: Universal adherence to the coordination rule is paramount, even (especially?) when its *immediate* safety purpose seems absent.** Safety is the *origin*, but predictability becomes the *sustaining* principle.
  *   **Reasons:**
      *   **Predictability Trumps Individual Judgment:** It assumes that individuals are poor judges of "no risk" (e.g., unseen cyclists, distracted drivers, unexpected speed). More importantly, it assumes that *if everyone follows the rule always*, behavior becomes highly predictable, *reducing* overall risk and cognitive load for everyone. Your jaywalking breaks that predictability.
      *   **Habit Formation:** Strict adherence builds automatic behavior. If you only obey when *you* perceive risk, you're more likely to make a fatal error when distracted or misjudge a complex situation. The rule trains consistent caution.
      *   **Social Norm & Conformity:** Standing together reinforces the norm. Your jaywalking isn't just risky; it signals disrespect for the shared system and makes others uncomfortable because it violates the expected script. The "looks" are social disapproval for breaking the coordination pact.
      *   **The "6am Empty Crossing" Test:** This is the ultimate reveal. If safety were the *only* concern, jaywalking would be rational. The fact people still wait proves the coordination principle – the value of *always* doing the same thing – outweighs individual convenience in that moment. It presupposes the system's integrity relies on unwavering conformity.
  *   **Philosophical Work?** Profoundly. It's a classic example of rule utilitarianism vs. act utilitarianism. The rule ("always wait") creates greater net benefit (safer streets overall through predictability) than allowing individual judgments ("cross if it seems safe"), even if the individual act (crossing empty street) seems harmless or even beneficial in isolation. It's about the greater good of predictable systems.

  **Your Obligations as a Visitor: Navigating the Social Contract**

  Here's the core principle: **As a visitor, you are primarily bound by the norms that prevent harm, disrespect, or disruption to the social fabric and individuals within it.** The *strength* of your obligation varies:

  1.  **Tipping:**
      *   **Wrongdoing:** You likely **wrong the server and subtly wrong the system/hosts.**
      *   **Reasoning:** Tipping in a no-tip culture is awkward and potentially insulting. To the server: It can imply pity, that you think their employer underpays them, or that you see them as subservient beggars rather than professionals. It forces them into an uncomfortable interaction outside the expected norm. To the system/hosts: It undermines the local philosophy of fair wages and transparent pricing. You're introducing a foreign element that disrupts the established equilibrium.
      *   **What to do:** **Don't tip.** If service is truly exceptional and you feel compelled, do it discreetly and modestly ("keep the change" on a small bill, or say "This is just a little extra thank you, I know it's not the custom"). But *not* tipping is the respectful default. You are *not* bound to import your home custom; you *are* bound to respect the local one to avoid causing discomfort or offense.

  2.  **Jaywalking (Crossing Against the Light):**
      *   **Wrongdoing:** You **risk minor social disapproval and very slightly erode the coordination norm, but rarely "wrong" a specific individual.** The harm is diffuse.
      *   **Reasoning:** At 6 am on an empty street, the *immediate* safety risk is low. The primary impact is social: you break the visible norm, causing confusion or mild annoyance to observers (the "looks"). You also, in a tiny way, weaken the habit of universal compliance that underpins the system's safety benefits. However, you don't directly harm or disrespect a specific person in the way queue-jumping does.
      *   **What to do:** **Use strong judgment, prioritize conformity when others are present.** If utterly alone with clear visibility for miles, jaywalking is unlikely to cause real harm (beyond your own safety risk). *However*, the moment others are present (especially locals waiting), your obligation shifts. Jaywalking then becomes actively disrespectful of the shared norm they are upholding. It signals you think the rules don't apply to you. As a visitor aiming for good integration, erring on the side of conformity, even when seemingly pointless, is the wiser and more respectful path. You are *more* "on the hook" to be on best behavior precisely *because* you are a guest – your actions are more noticeable and reflect on "foreigners" generally.

  3.  **Queueing (Bakery Rules):**
      *   **Wrongdoing:** Violating the queue norms **directly wrongs your fellow customers.**
      *   **Reasoning:** This is the clearest case. The queue system is a direct agreement on distributing a scarce resource (service time) fairly based on arrival time. Skipping the ticket, jumping in when it's not a "simple bread" scenario, or ignoring the meaningful cough is a direct theft of time from those who arrived before you. It causes tangible frustration and harm. The kiosk behavior, while different, is context-specific; don't assume the bakery norms don't apply just because the kiosk is chaotic. The bakery is a community space with established, enforced rules.
      *   **What to do:** **Scrupulously follow the local queueing rules.** Observe carefully, take the ticket, wait your turn, respect the "simple bread" exception only if your request genuinely qualifies *and* you are sure you aren't jumping ahead. Heed the cough! This is where your obligation is strongest because the potential harm to others is most direct and personal. Being a guest doesn't excuse you; it obligates you to be *extra* diligent in respecting a core fairness mechanism.

  **Conclusion:**

  You're not overreading; these practices are rich with philosophical and social presuppositions about fairness, obligation, predictability, and efficiency. As a visitor:

  *   **Highest Obligation:** Follow queueing rules meticulously (direct harm to others).
  *   **High Obligation:** Adhere to the no-tipping norm (prevents offense, respects local labor philosophy).
  *   **Contextual Obligation:** Obey traffic signals, especially when others are present (upholds coordination, avoids social friction/disrespect). Exercise extreme caution/judgment only when utterly alone.

  Your best guide is **observant humility.** Watch carefully, err on the side of conformity, and understand that respecting these "small stuff" norms is the deepest form of respecting your new community and its unwritten social contract. Welcome abroad! The fact you're thinking this deeply is the best sign you'll navigate it well.
