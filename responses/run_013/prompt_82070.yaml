  Below is a decision tree taxonomy for the axiology of suffering, rooted in the principle that **"suffering is the sole intrinsic bad (the whole of what makes a life go badly), and positive wellbeing adds no value."** The tree branches on seven key questions that split views within this family, phrased neutrally to avoid presupposing answers. Each leaf names a position (or "unnamed"), summarizes its core commitment, and notes an awkward implication. Unoccupied/incoherent combinations are flagged.  

  ### **Decision Tree: Axiology of Suffering**  
  *Root:* Suffering is the sole intrinsic bad; positive wellbeing adds no value.  

  1. **Does a life with *no suffering and no positive states* (e.g., permanent numbness) have the same value as a *suffering-free life full of joy*?**  
     - **No →** *Hedonic Dualism (outside family)*.  
       *Awkward commitment:* Despite the root, positive states must be intrinsically valuable to break the tie, contradicting the family’s core tenet.  
     - **Yes →** Proceed to Q2.  

  2. **Is *craving* intrinsically bad, even if never frustrated and never felt as unpleasant?**  
     - **No →** Craving is only instrumentally bad (when it causes suffering). Proceed to Q4.  
     - **Yes →** Proceed to Q3.  

  3. **Is a *craving that is savored, pleasant, and never traded away* (e.g., a joyful anticipation) still intrinsically bad?**  
     - **No →** *Conditional Asceticism*.  
       *Awkward commitment:* Must explain why some cravings are exempt from intrinsic badness without undermining the axiom that craving’s badness is intrinsic. *[Flag: Potentially incoherent]*  
     - **Yes →** Proceed to Q4.  

  4. **Does the *absence of suffering* (and craving, if applicable) count as a *good* or merely as the *absence of a bad*?**  
     - **Good →** The absence is intrinsically valuable. Proceed to Q5.  
     - **Absence of bad →** The absence has no positive value. Proceed to Q5.  

  5. **Is this a theory about *intrinsic value* or about *what we have reason to promote*?**  
     - **Intrinsic value →** Proceed to Q6.  
     - **Reasons to promote →** Proceed to Q6.  

  6. **Does a *world with no sentient beings* tie for best with a *suffering-free world of happy beings*?**  
     - **Yes →** Proceed to Q7.  
     - **No →** Proceed to Q7.  

  7. **Is *craving* (if deemed bad) reducible to *suffering*, or a distinct bad?**  
     - **Reducible →** Suffering is the only fundamental bad.  
     - **Distinct →** Craving is a separate, irreducible bad.  

  ---

  ### **Leaf Positions & Commitments**  
  *Combinations are labeled as "unnamed" if no standard term exists.*  

  | Path (Q1–Q7 Answers) | Position Name              | Core Commitment                                  | Awkward Commitment                              |
  |------------------------|----------------------------|--------------------------------------------------|-------------------------------------------------|
  | 1. Yes → 2.No → 4.Absence → 5.Intrinsic → 6.Yes → 7.Irrelevant | **Classical Negative Utilitarianism** | Only suffering is intrinsically bad; its absence isn’t a good. | A flourishing world and empty world are equally good, incentivizing extinction. |
  | 1. Yes → 2.No → 4.Absence → 5.Reasons → 6.Yes → 7.Irrelevant | **Practical NU**           | We have decisive reason to minimize suffering, but no intrinsic value theory. | Promoting extinction could be obligatory, even if counterintuitive. |
  | 1. Yes → 2.Yes → 3.Yes → 4.Absence → 5.Intrinsic → 6.Yes → 7.Reducible | **Schopenhauerian Pessimism** | Suffering and craving are intrinsically bad (craving reduces to suffering). | Pleasant cravings (e.g., love) are condemned as inherently defective. |
  | 1. Yes → 2.Yes → 3.Yes → 4.Good → 5.Intrinsic → 6.No → 7.Distinct | **Buddhist-Inspired Nirvana** | Absence of suffering/craving is a supreme good (nirvana); craving is distinct. | A world with beings in nirvana is better than no world, but positive states still add nothing. |
  | 1. Yes → 2.Yes → 3.No → (Any) | *[Incoherent]*             | Craving is intrinsically bad, but pleasant cravings aren’t. | Self-contradictory: intrinsic badness cannot depend on hedonic tone. *[Flag: Incoherent]* |
  | 1. Yes → (Any) → 4.Good → 5.Intrinsic → 6.Yes | *[Incoherent]*             | Absence of suffering is a good, yet an empty world (with no "absence" to value) ties for best. | Requires the absence of suffering to be a good that exists when nothing exists. *[Flag: Incoherent]* |
  | 1. Yes → 2.Yes → 3.Yes → 4.Absence → 5.Reasons → 6.No → 7.Distinct | **Ascetic Prioritarianism** | We must minimize suffering/craving (distinct bads), but a populated world can be best. | No rationale for preferring a suffering-free world over extinction if positive states add nothing. *[Flag: Unattractive]* |

  ---

  ### **Notes**  
  - **Unoccupied Combinations**:  
    - **"4.Absence → 6.No"** (e.g., Q1.Yes→Q2.No→Q4.Absence→Q5.Intrinsic→Q6.No): The absence of suffering isn’t a good, yet an empty world is worse than a suffering-free world. *Why unoccupied? Incoherent* (no basis for ranking if no value difference).  
    - **"3.No" with coherent foundations**: Denying intrinsic badness to pleasant cravings (Q3=No) after affirming it generally (Q2=Yes) is *incoherent*, so no stable position exists here.  
  - **Tree Limitations**:  
    - The tree cannot separate **"whether craving is distinct from suffering"** (Q7) from **"reasons vs. intrinsic value"** (Q5) in practice, as these often correlate (e.g., irreducible craving usually implies intrinsic value claims).  
    - **"4.Good → 6.Yes"** paths are *incoherent* (see table) and thus unoccupied.  
  - **Key Splits**: Q1 (family boundary), Q2/Q3 (craving’s scope), Q4 (value of absence), and Q6 (anti-natalism) are the most divisive.  
  - **Unexplored Views**: Most combinations are occupied, but paths like **"1.Yes→2.Yes→3.Yes→4.Good→5.Reasons→6.No"** are *unnamed and underexplored*, as few defend "reasons to promote" without intrinsic value.  

  This tree captures 7 branching questions, isolating core tensions (e.g., the emptiness of nirvana vs. extinction) while flagging logical boundaries. Use it to map debates in the seminar!
