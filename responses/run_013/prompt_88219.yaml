  Okay, let me tackle this user's query step by step. The user's reading group is stuck on the Hart-Devlin debate about whether criminal law should enforce shared morality beyond preventing harm. They've had six meetings with no progress, and the user doesn't want a verdict but a diagnosis of the disagreement type. 

  First, I need to recall the core positions. Devlin argues that society's morality is interconnected and necessary for social cohesion, using public outrage as the standard. Hart counters that this lacks empirical evidence and imposes majority morality without justification. The user proposes modeling shared morality as a common-pool resource like a fishery—depletable and costly to replenish.

  I should test if this model fits. Is morality rivalrous? My non-conformity might not directly cost you anything tangible. Excludability is also tricky—can we prevent others from "using" morality? The model seems strained here. More importantly, the direction of causation matters: does law enforce existing morality or create it? If the latter, Devlin's argument reverses, which is a serious problem for him.

  For the diagnosis, several layers emerge. Substantively, they disagree on what counts as harm. Procedurally, they clash over burden of proof. But the deepest divide might be the questions they're answering: Devlin focuses on a community's authority to self-preserve, while Hart examines when coercion is justified. They're talking past each other. 

  To settle this, consider what each must concede. Devlin would need to accept Hart's demand for evidence of social disintegration. Hart would need to engage Devlin's juridical framework. Without this, progress is unlikely. The disagreement might persist without a shared framework.

  The key insight is recognizing their different questions. Evidence for social collapse could bridge them, but Hart dismisses Devlin's need for it. That dismissal highlights the fundamental misalignment. 

  Finally, I'll structure the answer as requested: a label followed by a semicolon and the decisive consideration.
answer: |-
  Your hypothesis about shared morality as a common-pool resource is insightful but ultimately misfires. While capturing Devlin's *fear* of depletion, it doesn't fit the *nature* of the "resource":

  1.  **Rivalry?** Not clearly. Your disbelief in a moral norm doesn't inherently *deprive* me of believing it or acting on it, unlike catching a fish removes it for others. My continued conformity isn't diminished by your non-conformity in the same tangible way. Devlin posits a cumulative *weakening* of the norm's hold *on society*, making future conformity harder, but this isn't direct rivalry over consumption.
  2.  **Excludability?** Highly problematic. You cannot easily exclude someone from "benefiting" from the existence of a shared morality (e.g., social stability) even if they don't contribute (conform). Enforcement tries to create *costs* for non-conformity but doesn't exclude non-conformers from the perceived "benefits" of the social order.
  3.  **Direction of Causation:** **This is a *real problem* for Devlin, not a cheap shot.** If the criminal law *shapes* the very morality it claims to protect (e.g., laws against homosexuality shaping societal views of its immorality), then Devlin's core argument – that law merely *defends* a pre-existing, vital social fabric – collapses. Enforcement becomes *manufacturing* the "stock" (morality/social cohesion) rather than just conserving it. This undermines his descriptive claim about the source and fragility of morality. Hart implicitly challenges this causality.

  **Diagnosis: Different Foundational Questions**

  The core impasse stems from Hart and Devlin answering fundamentally different questions within the same debate:

  *   **Devlin** is answering a **juridical/sociological question**: *"Does a political community possess the inherent authority to use criminal law to enforce its constitutive shared morality in order to preserve its own identity and existence as that specific community?"* His focus is on the community's right to self-perpetuation based on its actual values.
  *   **Hart** is answering a **liberal political-moral question**: *"When is state coercion through the criminal law morally justified?"* His focus is on individual liberty, harm prevention, and the need for principled justification beyond popular sentiment.

  **What Each Must Concede for the Other's Answer to Become Relevant:**

  1.  **For Devlin's answer to be relevant to Hart:** Devlin would need to concede that demonstrating a community's *authority* to enforce its morality is insufficient; he must also provide a *moral justification* for why exercising that authority in a particular instance (criminalizing private immorality) is right, acceptable to liberal principles, or at least demonstrate the *empirical necessity* (the predicted social collapse) that would make it a lesser evil than non-enforcement. Hart demands reasons *beyond* "the community says so."
  2.  **For Hart's answer to be relevant to Devlin:** Hart would need to concede that the question of a political community's foundational authority and right to preserve its distinctive identity through law *is a legitimate and prior question* to the moral justification of specific coercive acts. He would need to engage with the sociological reality of shared morality as a constitutive element of a particular society, not just dismiss it as irrational majoritarianism.

  **Can There Be Progress? Is Death the Only Option?**

  Progress is difficult but not impossible:
  *   **Evidence:** If compelling, widespread evidence emerged showing societies *did* rapidly disintegrate following the abandonment of specific, non-harm-based moral norms (e.g., norms around fidelity, ritual, or specific sexual taboos *without* obvious direct harm), it would force Hart (or his successors) to seriously engage with Devlin's empirical claim. Conversely, overwhelming evidence of stability despite moral change weakens Devlin.
  *   **Conceptual Refinement:** Distinguishing more clearly between *types* of norms (core identity-defining vs. peripheral) or *modes* of enforcement (symbolic vs. severely punitive) might find limited common ground. However, Devlin's "seamless web" argument resists this carving.
  *   **Change of Question:** Explicitly agreeing which question is being debated (juridical authority vs. moral justification of coercion) would clarify the impasse but not resolve it. It might allow the group to move on to debating *that* meta-question.

  Absent decisive evidence or a shared shift in foundational premises (e.g., embracing communitarianism vs. liberalism), the disagreement is likely persistent. It reflects a deep schism in political philosophy about the nature of community, authority, and individual liberty. The group might acknowledge this fundamental divide and shift focus to its implications or explore related, more tractable questions.

  **Key Insight:** Hart's dismissal of Devlin's need for empirical evidence highlights the different questions. Hart doesn't *need* evidence of collapse to reject Devlin's *moral* claim; he rejects the premise that popular outrage *could ever* justify coercion without independent harm. Devlin thinks evidence *of the threat* is crucial for the community exercising its inherent authority.

  \answer{different foundational questions; Hart's dismissal of Devlin's empirical claim as irrelevant to the moral question exposes their divergent starting points.}
