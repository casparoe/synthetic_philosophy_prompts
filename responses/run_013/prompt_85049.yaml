prompt: |-
  I'm defending a thesis chapter at a political theory workshop in three weeks and I need a Q&A prep sheet. The room is not my crowd: two civic republicans who work on non-domination and think of membership in a self-governing body as the thing that protects you from arbitrary power, a couple of people who've spent years defending the all-subjected principle against the all-affected interests principle, one EU constitutional law person who cares about citizenship doctrine and whether any of this is implementable, and one comparative politics person who thinks the whole boundary problem is philosophy fiat and that real demos boundaries get settled by history and violence. Nobody there needs me to explain what the boundary problem is; I'm the only one who works on it.

  My claim is that the demos for any given decision should be set by a rebuttable presumption of inclusion. Start with everyone causally affected by the decision. The currently enfranchised may narrow that set only if they can pass what I'm calling a decision-integrity test -- roughly, that including the excluded group would make the procedure unable to reach a stable outcome, or would let one group hold the rest hostage. Burden of proof sits on exclusion, and every exclusion carries a sunset clause: it has to be re-justified each cycle by whoever wants to keep it. I argue this beats all-affected (indeterminate scope, recursive, ends up giving you the whole world for any decision) and beats all-subjected (under-inclusive once you're dealing with externalities, climate, commuters, downstream users). And I've got a bootstrap answer to the self-application problem: the rule can't be adopted by the demos it defines, so legitimacy has to come from revisability rather than from origin, and the starting point is just whatever demos you inherited historically.

  So: what will I actually get from this room? Put the objections in their vocabularies, not mine -- the republicans will say it differently than the all-subjected people will. Order them by how likely they are times how much damage they do, give me a two-minute reply to each, and flag where the reply is soft so I don't walk into it unprepared. Tell me what to concede up front and what to hold. Include the question I'm hoping nobody asks.

  And please dont do the thing where you present three possible readings and let me choose. Take a position: tell me straight which objection actually sinks the paper, and give me your verdict on whether the bootstrap move works or whether my rebuttable presumption is just inherited power wearing a procedural hat. If you think the sunset clause is a fig leaf, say so and say why.
reasoning: |-
  Okay, let me unpack this user's request. They're prepping for a high-stakes thesis defense in political theory with a very specific audience composition. The core task is anticipating objections to their "rebuttable presumption of inclusion" framework for demos boundaries. 

  First I need to map the room dynamics: two civic republicans obsessed with non-domination, all-subjected principle defenders, an EU legal realist, and a comparative politics skeptic. All experts who don't need basics explained. The user's framework tries to split the difference between all-affected (too broad) and all-subjected (too narrow) with procedural safeguards.

  Hmm... the real landmines here are legitimacy questions. The bootstrap move claiming "revisability over origin" for the initial demos is clever but vulnerable - it's essentially admitting the system rests on historical violence while promising procedural fixes later. The sunset clause feels like a band-aid on that wound. 

  For the republicans, I predict they'll pounce on how exclusion tests could become domination tools. Their "arbitrary power" lens means they'll see any exclusion mechanism as inherently suspect. Best counter is emphasizing how the burden of proof and reversibility requirements actually constrain power - but I should warn the user this reply might sound naive to hardcore Pettit followers.

  The all-subjected crowd will hate the causal-affection starting point. They'll argue it smuggles in moral claims through "affected" judgments. User's best move is conceding some indeterminacy but pivoting to "it's still better than your under-inclusive alternative for climate cases." Though that EU lawyer might torpedo this by asking who even measures "affectedness."

  Oh god, the comparative politics scholar is the wildcard. They'll dismiss the whole framework as philosophical fantasy. User should preempt this by admitting historical contingency but arguing we still need normative tools to critique boundaries. Risky though - might validate their "this is useless" stance.

  The killer question? Probably about enforcement. If exclusion tests are decided by the powerful, how is this not just rubber-stamped domination? User's revisability argument feels shaky here. I'll flag that as the "pray nobody asks" item.

  For structure: objections ordered by damage potential, with pithy comebacks. Must explicitly call out where replies are weak (like the bootstrap legitimacy). And yes - sunset clauses are totally fig leaves if power asymmetries prevent challenges. Should say that bluntly.
answer: |-
  Here's a brutally honest Q&A prep sheet targeting your specific audience and vulnerabilities, ordered by damage potential. I'll flag soft spots and tell you which objection I think is most dangerous.

  ### The Killer Objection (Likely from Civic Republicans or All-Subjected Defenders)
  **Objection:** *"Your 'decision-integrity test' is just domination by another name. The enfranchised group gets to define 'stability' and 'hostage-taking' in ways that protect their interests. Burden of proof on exclusion is meaningless if the excluded have no voice in defining the test. This replicates the arbitrary power your system claims to avoid."*  
  **Your 2-Minute Reply:** "The test isn't substantive; it's procedural. We look for *functional* breakdowns (e.g., cyclical voting, permanent minorities paralyzing decisions), not contested interests. Crucially, the sunset clause forces *recurrent justification* in a public forum, giving excluded groups leverage to challenge biased interpretations. It’s not perfect, but it shifts the status quo from permanent exclusion to contestable provisional exclusion."  
  **SOFT SPOT:** *If the enfranchised define "functional breakdown," isn't that itself substantive? Your reply assumes good-faith actors. Republicans will say this ignores structural power imbalances.* **Concede:** The test can be gamed. **Hold:** Recurrent justification + public scrutiny is still better than immutable exclusion.

  ### The Legitimacy Bomb (From Anyone, Especially EU Law/Comparative Politics)
  **Objection:** *"Your 'historical starting point' is inherited violence/coercion. 'Revisability' doesn't confer legitimacy; it just launders unjust origins. If the initial demos is illegitimate, why should anyone accept its exclusion decisions, even with sunset clauses?"*  
  **Your 2-Minute Reply:** "I agree entirely – the initial demos *is* morally arbitrary. But no bootstrap solution exists. Revisability is the *only* path to legitimacy: it allows historically excluded groups to dismantle inherited boundaries through the very mechanism that once excluded them. The sunset clause isn’t a justification; it’s a vulnerability built into the system for challengers to exploit."  
  **VERDICT:** **This objection sinks your paper if you can't sell revisability as sufficient.** Your move works only if the audience accepts that *procedural fairness over time* can compensate for *original sin*. The EU lawyer will scoff at "implementability" if legitimacy rests on this.

  ### The All-Subjected Counterattack
  **Objection:** *"You caricature all-subjected as under-inclusive. But we define 'subjected' as being bound by enforced rules, not mere causality. Your 'affected' test is infinitely expandable too – why stop at direct causality? What about second-order effects? You've just swapped one indeterminacy problem for another."*  
  **Your 2-Minute Reply:** "All-subjected excludes those impacted by *decisions they didn't consent to* (e.g., pollution crossing borders). My causal-affection starting point captures this. The key difference is the *rebuttable exclusion*: we start broad, then narrow *only if necessary for function*. All-subjected starts narrow and struggles to widen. On indeterminacy: we use standard causal thresholds from law/policy (proximate cause, foreseeability), not philosophy."  
  **SOFT SPOT:** *The EU lawyer will ask: "Who determines proximate cause? The enfranchised?"* **Hold:** Thresholds exist in real legal systems. **Concede:** Line-drawing is messy, but better than all-subjected’s false precision.

  ### The Republican Anxiety
  **Objection:** *"Non-domination requires *membership* to resist arbitrary power. Your system lets the enfranchised exclude others based on *their* view of 'stability'. Excluded groups lack the standing to contest this meaningfully. Sunset clauses don't fix this if the power imbalance persists."*  
  **Your 2-Minute Reply:** "Membership isn’t binary here. Exclusion is *provisional* and *contestable*. The burden of proof forces the enfranchised to justify exclusion publicly, creating a tool for resistance. Crucially, the test isn't about values ('stability' isn't normative; it's mechanical – can a decision be reached?). This minimizes arbitrariness."  
  **SOFT SPOT:** *Republicans see domination in any exclusion not consented to by the excluded. Your proceduralism may not convince them.*

  ### The Comparative Politics Grenade
  **Objection:** *"This is elegant fiction. Boundaries are set by power, violence, and path dependence. Your 'test' will be ignored or manipulated. Sunset clauses? States barely re-evaluate electoral districts. Why would they willingly surrender power?"*  
  **Your 2-Minute Reply:** "You’re right that real boundaries emerge from struggle. My framework isn't a predictive model; it’s a *critical tool* and *normative standard*. When boundaries are contested (e.g., Indigenous sovereignty, climate justice), we need principles to judge claims. This gives activists a lever: 'Show us the functional justification for our exclusion.' It makes domination harder to rationalize."  
  **Hold:** Normative theory must exist even if power operates differently. **Concede:** Implementation requires political will.

  ### The EU Lawyer's Implementability Question
  **Objection:** *"Who administers this test? Courts? Legislatures? How do you avoid it becoming a politicized mess? Sunset clauses sound bureaucratic and unworkable in complex systems like the EU."*  
  **Your 2-Minute Reply:** "It should be a distinct, transparent body – perhaps a reformed constitutional court with strict procedural rules (e.g., evidence-based thresholds for 'hostage-taking'). The EU already uses proportionality tests for rights limitations; this is analogous. Sunset clauses force periodic review without needing perpetual litigation."  
  **SOFT SPOT:** *You hand-wave institutional design. The lawyer will want concrete examples/mandates.*

  ### The Question You Hope Nobody Asks
  **Objection:** *"If the exclusion test is administered by the currently enfranchised, and they benefit from excluding group X, what stops them from always claiming 'hostage-taking'? Isn't the 'burden of proof' just performative if the judge is biased?"*  
  **Your Reply (Don’t Panic):** "This is why the test must be *strictly evidence-based and procedural*. We look for *mathematical* instability (e.g., proof of cyclical preferences) or *demonstrable* procedural paralysis (e.g., 10 failed votes). Courts already adjudicate such claims (e.g., gerrymandering). It’s imperfect, but better than no constraint."  
  **DAMAGE CONTROL:** **Concede upfront:** "This is a real risk in deeply unequal societies." **Pivot to:** "But compare it to alternatives: all-affected offers no exclusion mechanism, all-subjected ignores externalities. This at least creates a hurdle and a target for reformers."

  ---

  ### Brutal Verdicts:
  1.  **The Bootstrap Move:** It’s necessary but **doesn't fully work**. Revisability *can* legitimize over time, but your initial position relies on might-makes-right. Admit this bluntly: "All political foundations are morally arbitrary; the best we can do is build systems that allow their own subversion."
  2.  **Sunset Clause:** **Not a fig leaf, but not armor-plated.** It’s a genuine vulnerability for exclusionists *if* civil society is strong. In autocratic states, it’s useless. Frame it as a "ratchet for inclusion."
  3.  **Worst Objection:** **The Legitimacy Bomb.** If they don’t buy revisability as redemption for historical injustice, your whole project feels like a justification of the status quo. Preempt this: Open your defense by *agreeing* the initial demos is illegitimate. Make revisability the hero.
  4.  **Core Vulnerability:** **Power imbalance in administering the test.** This is where your proceduralism is thinnest. Arm yourself with 1-2 concrete examples (e.g., how courts assess voting rights cases) to show it’s not fantasy.

  **Final Prep Tip:** For each objection, practice saying: "That's a serious concern. Here's why my approach still improves on the alternatives..." Show you've wrestled with the darkness. This room will respect that more than unearned optimism.
