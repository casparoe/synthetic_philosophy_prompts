  I'm a novelist — literary fiction, the kind where people say clever things at dinner parties and then go home and quietly ruin their lives — and I'm about 250 pages into a book with a scene I can't get right. My character Denny is a documentary guy, charming, reads a lot of pop-philosphy on planes, and at a dinner party he holds forth on Nozick to impress a woman who actually did a philosophy degree. I need her to be able to push back in a way that's technically correct, otherwise the scene reads like I did no homework, but I've never studied this stuff myself and I'm definately out of my depth, so I also don't want her corrections to be things an actual philosopher would wince at. Here's the gist of what Denny says, tidied up: "Nozick's tracking theory says knowledge is true belief that tracks the facts, and it comes down to two conditions — your belief has to be sensitive, meaning that if the thing weren't true you wouldn't believe it, and it has to be safe, meaning you couldn't easily have been wrong. The price he pays for that is that knowledge isn't closed under deduction: he thinks you can know you've got hands and still not know you're not a brain in a vat. So really Nozick hands the skeptic the keys — the tracking theory ends up saying we never know anything about the external world, which is why he concedes that we can't rule out the vat. And since tracking is basically a fancy way of saying your belief was produced by a reliable mechanism, the whole view just collapses into reliabilism anyway."

  I have a feeling the vat part is doing something backwards, but I can't tell what, and the reliabilism line sounds like it might be sneaking two different ideas into one. Can you audit Denny's little speech for me so I know what to put in her mouth? Give me exactly five numbered points, one or two sentences each, no intro and no closing summary, covering: which parts are actually right, which parts are loose or misleading and why, which parts are flatly wrong, how someone who likes Nozick would object, and whether the closing move — skeptic wins, reliabilism in disguise — follows from anything true in what he said.
