  ### Perception Theories Decision Tree  
  **Starting Premise:** Veridical perception (e.g., seeing a tomato) and a subjectively indistinguishable hallucination share whatever makes them experiences *of the same kind*.  

  #### **Question 1: Do veridical perception and hallucination share a fundamental mental kind?**  
  *(i.e., is their shared element the core nature of the experience?)*  
  - **YES** → Go to Question 2.  
  - **NO** → Go to Question 6.  

  ---

  ### **Branch 1: Shared Fundamental Kind (YES to Q1)**  
  #### **Question 2: In veridical perception, is the experience fundamentally a relation to something?**  
  *(i.e., does perception require an object to which the subject is related?)*  
  - **YES** → **Sense-datum theory**  
    - *Description:* Both veridical and hallucinatory experiences are relations to mental particulars (sense-data). The tomato and its hallucinatory counterpart share a sensed mental object.  
    - **Most awkward commitment:** Hybrid cases (e.g., half a real tomato fused with a hallucinatory dragon) require a single sense-datum that is both "veridical" and "non-veridical," straining the coherence of mental particulars.  
  - **NO** → Go to Question 3.  

  #### **Question 3: Does the experience have representational content?**  
  *(i.e., is perception inherently about the world, with accuracy conditions?)*  
  - **YES** → **Content-based intentionalism**  
    - *Description:* Both cases share identical representational content (e.g., "a tomato is present"), regardless of the object’s existence.  
    - **Most awkward commitment:** Hybrid cases force content to be partially accurate and partially inaccurate within a unified experience, challenging content individuation (e.g., how can one content be 50% true?).  
  - **NO** → **Adverbialism**  
    - *Description:* Experiences are modifications of consciousness (e.g., "sensing tomato-ly"); no objects or content, just manners of sensing.  
    - **Most awkward commitment:** Hybrid cases require "sensing tomato-ly-and-dragon-ly" as a complex adverbial state, which struggles to explain the fusion of distinct modifiers.  

  ---

  ### **Branch 2: No Shared Fundamental Kind (NO to Q1)**  
  #### **Question 4: Is the disjunction in the nature of the experience or the subject’s epistemic position?**  
  *(i.e., does the difference lie in what the experience *is* or what it *provides*?)*  
  - **Nature** → Go to Question 5.  
  - **Epistemic position** → **Epistemic disjunctivism**  
    - *Description:* Veridical and hallucinatory experiences differ *only* in epistemic features (e.g., veridical states justify beliefs factively, hallucinatory states do not). They may share non-epistemic properties.  
    - **Most awkward commitment:** Subjective indistinguishability must coexist with radical epistemic differences, risking incoherence (how can two states be indistinguishable yet justify beliefs differently?).  

  #### **Question 5: In hallucination, is there a positive mental occurrence?**  
  *(i.e., is hallucination a substantive mental state, not just a failure?)*  
  - **YES** → **Positive disjunctivism (non-naive variety)**  
    - *Description:* Veridical perception is a relation to mind-independent objects; hallucination is a distinct positive state (e.g., intentional or sensory).  
    - **Most awkward commitment:** Hybrid cases demand an experience simultaneously relational (veridical part) and non-relational (hallucinatory part), fracturing experiential unity.  
  - **NO** → **Naive-realist disjunctivism**  
    - *Description:* Veridical perception is a direct relation to mind-independent objects; hallucination is a mere absence of such relations (a failure).  
    - **Most awkward commitment:** Hybrid cases require an experience to be partly relational (to real objects) and partly nothing (the hallucinatory gap), undermining coherence.  

  ---

  ### **Annotations**  
  1. **Unattractive/unexplored combinations:**  
     - **Common factor without common kind (YES to Q1 + NO to Q2):**  
       - *Path:* YES (Q1) → NO (Q2).  
       - *Description:* Veridical and hallucinatory states share a factor (e.g., neural cause) but not a mental kind.  
       - *Status:* **Unattractive** — Fails to explain subjective indistinguishability via a non-mental common factor (e.g., how does a brain state explain phenomenology?).  
     - *All other paths lead to named theories.*  

  2. **Hybrid case pressure points:**  
     - Sense-datum theory: Suspicious part-veridical sense-data.  
     - Adverbialism: Unwieldy compound modifiers.  
     - Intentionalism: Indeterminate partial content.  
     - Naive realism: Hybrids mix "relation" with "nothing."  
     - Positive disjunctivism: Hybrids force two metaphysical kinds in one experience.  

  3. **Flagged indistinct leaves:**  
     - **Epistemic disjunctivism** and **Positive disjunctivism** are not separated by the tree.  
       - *Further question needed:* "Can hallucination justify beliefs non-factively?"  
         - YES → Epistemic disjunctivism (hallucination has non-factive justification).  
         - NO → Positive disjunctivism (hallucination has no justification or is purely sensory).  

  ---

  ### Key Clarifications  
  - **Common factor vs. common kind:**  
    - *Common factor:* Shared element (e.g., content, cause) without committing to same mental kind.  
    - *Common kind:* Shared element exhausts the experience’s fundamental nature.  
  - **Hybrid case:** One experience (e.g., seeing half a tomato while hallucinating the other half as a dragon).  
  - **Epistemic disjunctivism** treats hallucination as a state with non-factive justification; **Positive disjunctivism** treats it as a non-relational mental state (e.g., intentional).
