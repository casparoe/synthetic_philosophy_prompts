  ### Case Study: The Business Venture Investment

  **Scenario:**  
  An individual has $100,000 in savings. They have an opportunity to invest in a business venture. The venture, if successful (40% probability), returns $2 for every $1 invested (net gain of $1 per $1 staked). If it fails (60% probability), the investment is salvaged at $0.50 per $1 invested (net loss of $0.50 per $1 staked). The individual must choose the fraction \( f \) of their savings to invest. 

  **Key Parameters:**  
  - Initial wealth \( W = \$100,000 \)  
  - Success probability \( p = 0.4 \)  
  - Success return multiplier \( b = 2 \) (wealth becomes \( W + fW \times 1 \))  
  - Failure return multiplier \( a = 0.5 \) (wealth becomes \( W - fW \times 0.5 \))  
  - Expected monetary value (EMV) of investing \( f \):  
    \[
    \text{EMV}(f) = p \cdot (W + fW \cdot (b-1)) + (1-p) \cdot (W + fW \cdot (a-1)) = W \cdot [1 + f(p(b-1) + (1-p)(a-1))]
    \]  
    \[
    \text{EMV}(f) = 100,\!000 \cdot [1 + f(0.4 \cdot 1 + 0.6 \cdot (-0.5))] = 100,\!000 \cdot (1 + 0.1f)
    \]  
    EMV is increasing in \( f \), so risk-neutral agents maximize EMV at \( f = 1 \).  
  - Worst outcome (failure at \( f = 1 \)): \( a \cdot W = 0.5 \times 100,\!000 = \$50,\!000 \) (substantial, avoiding ruin).  

  ---

  ### Verdicts of Four Decision-Makers  
  1. **Risk-Neutral Expected-Value Maximizer**  
     - Maximizes EMV; chooses \( f = 1 \) (all-in).  
     - Final wealth: \( \$100,\!000 \times (1 + 0.1 \times 1) = \$110,\!000 \) expected.  
     - *Rationale:* Ignores risk; seeks highest average monetary outcome.  

  2. **Kelly (Growth-Optimal) Bettor**  
     - Maximizes expected log wealth: \( g(f) = p \log(1 + f(b-1)) + (1-p) \log(1 + f(a-1)) \).  
     \[
     g(f) = 0.4 \log(1 + f \cdot 1) + 0.6 \log(1 + f \cdot (-0.5))
     \]  
     Solve \( g'(f) = 0 \):  
     \[
     \frac{0.4}{1+f} - \frac{0.6 \times 0.5}{1 - 0.5f} = 0 \implies 0.4(1 - 0.5f) = 0.3(1 + f) \implies f^* = 0.2
     \]  
     - Chooses \( f = 0.2 \) (20% of wealth).  
     - Final wealth: \( \$100,\!000 \times (1 + 0.2) = \$120,\!000 \) if successful, \( \$100,\!000 \times (1 - 0.1) = \$90,\!000 \) if failed.  
     - *Rationale:* Maximizes long-run growth rate; avoids overbetting.  

  3. **Standard Expected-Utility Maximizer (Square-Root Utility)**  
     - Utility \( u(w) = \sqrt{w} \); maximizes \( 0.4 \sqrt{W(1 + f)} + 0.6 \sqrt{W(1 - 0.5f)} \).  
     - Simplify: Maximize \( h(f) = 0.4 \sqrt{1 + f} + 0.6 \sqrt{1 - 0.5f} \).  
     Solve \( h'(f) = 0 \):  
     \[
     \frac{0.4}{2\sqrt{1+f}} - \frac{0.6 \times 0.5}{2\sqrt{1 - 0.5f}} = 0 \implies 0.2 / \sqrt{1+f} = 0.15 / \sqrt{1 - 0.5f} \implies f^* \approx 0.4118
     \]  
     - Chooses \( f \approx 0.4118 \) (41.18% of wealth).  
     - *Rationale:* Concave utility implies risk aversion, but less so than logarithmic utility.  

  4. **Fractional-Kelly Bettor (Half-Kelly)**  
     - Stakes \( 0.5 \times \text{Kelly fraction} = 0.5 \times 0.2 = 0.1 \).  
     - Chooses \( f = 0.1 \) (10% of wealth).  
     - *Rationale:* More conservative; reduces volatility while preserving growth.  

  **Summary of Verdicts:**  
  | Decision-Maker | Fraction \( f \) | Stake |  
  |----------------|------------------|-------|  
  | Risk-Neutral EV | 1.0 | \$100,000 |  
  | Kelly | 0.2 | \$20,000 |  
  | Square-Root EU | ≈0.4118 | ≈\$41,180 |  
  | Half-Kelly | 0.1 | \$10,000 |  

  **Where Kelly and Square-Root EU Coincide and Diverge:**  
  - Both are risk-averse and choose interior fractions (not 0 or 1).  
  - **Coincide:** In qualitative behavior (avoiding extremes).  
  - **Diverge:** Kelly (\( f = 0.2 \)) is more conservative than Square-Root EU (\( f \approx 0.4118 \)) due to differing risk aversion. Logarithmic utility (Kelly) has constant relative risk aversion (RRA = 1), while square-root utility has RRA = 0.5.  
  - **Key Disagreement:** Kelly prioritizes geometric growth; Square-Root EU reflects a generic concave utility. The real conflict is between growth-optimality and arbitrary risk preferences.  

  ---

  ### Feature Generating Divergence and Its Removal  
  **Divergence Driver:** **Multiplicative (Proportional) Payoffs**.  
  - Outcomes scale with wealth: Success multiplies wealth by \( (1 + f) \), failure by \( (1 - 0.5f) \).  
  - This compounds over repeated bets, making growth rate central.  

  **If Payoffs Are Additive:**  
  - Suppose success adds fixed \(\$10,\!000\), failure subtracts fixed \(\$5,\!000\) (EMV = \( 0.4 \times 10,\!000 + 0.6 \times (-5,\!000) = \$1,\!000 > 0 \)).  
  - Risk-neutral still goes all-in (if allowed). Kelly is undefined—growth-optimality requires multiplicative scaling.  
  - Square-Root EU chooses a fixed stake (not fraction) to balance risk.  
  - **Outcome:** Divergence vanishes; all agents focus on absolute gains/losses. No growth-rate argument applies.  

  **If Truly One-Shot (No Repetition):**  
  - Kelly reduces to log-utility EU (still \( f = 0.2 \)).  
  - Square-Root EU still chooses \( f \approx 0.4118 \).  
  - **Outcome:** Disagreement is solely about risk tolerance (utility curvature), not rationality.  

  ---

  ### Is This About Rationality or Risk Tolerance?  
  - **One-Shot Decision:** Pure risk tolerance disagreement. Kelly is log-utility EU; no growth argument applies.  
  - **To Elevate to Rationality Dispute:** Add:  
    - **Repetition:** The venture recurs annually; wealth compounds.  
    - **Long Fixed Horizon:** Many periods (e.g., 30 years).  
    - **Population of Independent Agents:** Many identical agents face the bet once; observe distribution of outcomes.  
    - **Ergodicity Focus:** Compare time-average growth (single agent) vs. ensemble-average (population at one time).  

  **Legitimacy of Repetition:**  
  - **Pro-Kelly:** Repeated multiplicative bets are common (e.g., stock investments). Ignoring compounding is irrational, as wealth grows geometrically.  
  - **Anti-Kelly:** Fixed horizons or non-replicable decisions make growth irrelevant. EU with non-log utility is valid.  
  - **Sharpest Conflict:** Under repetition, Kelly dominates:  
    - All-in (\( f = 1 \)): Expected log growth = \( 0.4 \log(2) + 0.6 \log(0.5) \approx -0.138 < 0 \). Wealth → \$0 almost surely.  
    - Kelly (\( f = 0.2 \)): Expected log growth ≈ \( 0.4 \log(1.2) + 0.6 \log(0.9) \approx 0.0097 > 0 \). Wealth grows.  
    - Square-Root EU (\( f \approx 0.4118 \)): Expected log growth ≈ \( 0.4 \log(1.4118) + 0.6 \log(0.7941) \approx -0.0005 < 0 \). Wealth → \$0.  

  **Verdict:** Repetition transforms the dispute into rationality (avoiding almost-sure ruin vs. maximizing growth).  

  ---

  ### Strongest Objection to Kelly and Case Survival  
  **Objection:** *"Kelly is just log utility in disguise—no growth-specific rationale. It’s one risk preference among many."*  
  - **Rebuttal:** Under repetition, Kelly maximizes the growth rate, which dominates long-run wealth. Log utility is the *consequence* of growth-optimality, not its cause.  
  - **Case Survival:**  
    - The objection holds **only in one-shot decisions** (where Kelly ≡ log utility).  
    - **Under repetition**, the case defeats the objection:  
      - Kelly (\( f = 0.2 \)) yields positive growth; all-in and Square-Root EU yield ruin.  
      - No utility function justifies strategies leading to almost-sure \$0 wealth.  
      - Growth-optimality is independently justified via ergodicity (time-average growth = ensemble-average for multiplicative processes).  

  **Why Risk-Neutral EV Must Work:**  
  - All-in has positive EMV but negative expected log growth. In repeated play, EMV → ∞ (e.g., \( (1.1)^T \)), but probability of ruin → 1. Kelly’s dominance is counterintuitive but mathematically inevitable.  

  ---

  ### Conclusion  
  This case forces risk-neutral EV defenders to confront the **ergodicity problem**: Positive expected value ≠ positive growth under multiplicative repetition. Kelly is not "just" log utility—it is the rational choice for survival and dominance in repeated decisions. Philosophers must engage with the long-run consequences of risk; economists must justify non-growth strategies in replicable multiplicative environments. The tutorial is primed for debate.
