prompt: |-
  ok so I'm in a third-year phil seminar on animals and ethics, and the one assignment I've been putting off all term is the fiction one -- we have to write a short story that puts an argument from the course under pressure. I've left it to the last minute, can you help.

  The argument I want to use is the counting-deaths one, the least-harm argument. Everyone in the seminar treats vegan = fewest animals killed, but the paper we read says growing grain kills animals too -- mice, voles, rats, ground-nesting birds, rabbits, chopped up by the combine or poisoned, and nobody counts them because they aren't food animals. Grass-fed cattle eat grass people can't eat, on land that can't really grow crops, so if you do the deaths-per-calorie sums honestly the beef might come out ahead of the lentils. Then the second twist: one big animal feeds a lot of people, so the same calories eaten as chicken means hundreds of individual birds instead of a fraction of one cow -- the choice that feels worst (the cow) has the lowest body count, and the efficient one is the massacre. And the bit that really gets me, which my lecturer mentioned and then just moved on from: if most wild animals live short painful lives and die badly, and there are astronomically more of them out there than farm animals, then clearing habitat for farming might be, arithmetically, doing them a favour, which is horrible to even type out. I don't need real numbers, I know you can't look them up, the shape of the argument is what I care about.

  So write me the story. Please don't make it a dialogue where the characters are mouthpieces for the positions, I'd definately get marked down for that. I want the arithmetic to be real to one person -- someone doing the sums, or someone who refuses to, or someone who is one of the numbers. Under 900 words. No narrator explaining the point at the end, and nobody in the story spelling out the argument -- if a reader can't get it from what happens then it isn't working. Bleak is fine.
