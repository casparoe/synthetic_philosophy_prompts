prompt: |-
  I'm thirty-six, I teach secondary school, and about eighteen months ago I was given a diagnosis that sits well inside the mainstream of the manual — common enough that nobody treats it as dramatic, contested enough that I've since read a fair amount about how the category is defined and how the definition has moved over the years. Before that I'd have said I had no stake in any of this; now I find I can't stop noticing it. There's a particular tangle I keep running into and I have no name for it, and I'd rather have the carving than the label. So: when I read work from ten or fifteen years ago, it's clear that the same facts about me would not have produced this diagnosis then — the line was drawn somewhere else. But that's only half of it. My behaviour has shifted since the diagnosis as well: partly because I now have a frame for things I used to write off as tiredness or awkwardness, partly because there's a new set of expectations to live up to or down to, and partly because other people now treat me differently. So when I try to answer the obvious question — was I always like this, or did the category arrive and make me like this? — I can't. It isn't that the evidence is thin; it's that the two changes look like one change seen from two sides. Reclassifying me and remaking me don't come apart, and neither is prior to the other. I've also spent time in an online group that looks like the mirror image of this: its members are trying to get the same diagnosis struck from their records, they talk about the label as something done to them rather than something they are, and their resistance seems to shift what the word means among them. I can't tell whether that's the same tangle running backwards or a different animal.

  I don't want a reading list or a bibliography — I want to know what the thing is and where its edges are. Is there an established concept for the first tangle, the one where the category's drift and my own change can't be separated? If so, what exactly does it claim, and how far does it stretch? I expect it's easy to confuse with at least four things I can state without any jargon: (a) the idea that believing something about yourself helps make it true; (b) the idea that being watched, or sorted into a disreputable category, degrades how you perform; (c) the idea that a word's meaning simply drifts over the years while the people it picks out stay as they were; and (d) the idea that a measure stops being informative once people start managing their behaviour to fit it. For each, tell me whether it's the same phenomenon, a special case of the one I'm after, or something genuinely distinct — and if none of them is it, say so plainly and coin a term, with a definition sharp enough that I could use it to rule out a case where only the category changed and a case where only the person changed. I'd also like to know whether the resistance group belongs under the same heading or needs its own.

  Answer as a single JSON object, with no prose around it, using these fields: `verdict` (one of "established", "partly_established", "no_established_concept"); `best_fit` (an object with `name`, `statement` — the concept's core claim in two or three sentences — and `what_it_leaves_out`); `near_neighbors` (an array with one entry for each of my four items plus any I should have included, each entry having `name`, `relation` (one of "same phenomenon", "special case", "genuinely distinct") and `why`); `tangle_definition` (a definition that separates the tangle from category-only drift and from person-only change); `coined_term` (a name if `verdict` is not "established", otherwise null); `resistance_case` (an object with `same_heading` (true or false) and `explanation`); and `boundary_cases` (three short cases you invent, each with `case`, `verdict` and `reason`). A few sentences per field; no citations, no titles, no suggested reading.
reasoning: |-
  We are given a complex query about a phenomenon where the diagnosis (a category) and the individual's behavior change are intertwined, such that they cannot be separated. The user also describes an online group that resists the diagnosis, and asks how that fits.

  The user wants to know if there's an established concept for the first tangle (where category drift and personal change are inseparable). They also ask about the relation to four ideas (a, b, c, d) and whether the resistance group is the same phenomenon.

  We are to structure the answer as a JSON object with specific fields.

  Let's break down:

  1. **Verdict**: We need to decide if there's an established concept. The phenomenon described is reminiscent of concepts in philosophy, sociology, and psychology, particularly:
     - **Hacking's "Looping Effects" of Human Kinds**: This concept, from Ian Hacking, describes how the classification of people (as a "human kind") can interact with the people classified. The classification changes the behavior of the people, which then may change the classification itself. This creates a feedback loop. It directly addresses the inseparability of the category and the individual's change.

     Given that, we can set `verdict` to "established".

  2. **Best Fit**:
     - **name**: "Looping Effects of Human Kinds"
     - **statement**: This concept claims that the act of classifying people into categories (like psychiatric diagnoses) can change the ways those individuals behave and understand themselves. These changes in behavior and self-understanding then feed back into the evolution of the category itself, leading to a dynamic loop. Thus, the category and the individuals it classifies co-evolve.
     - **what_it_leaves_out**: The concept doesn't explicitly address the role of resistance (as in the online group) in the same depth as the initial looping. It also may not fully account for the power dynamics in diagnostic contexts (e.g., who has the authority to define the category). Moreover, it focuses on the collective level and might not capture individual variations.

  3. **Near Neighbors**: We have four ideas (a, b, c, d) to compare. We'll also consider if there are others. We'll consider:
     - (a) Self-fulfilling prophecy: the idea that believing something about yourself helps make it true.
     - (b) Stereotype threat: the idea that being watched or sorted into a disreputable category degrades performance.
     - (c) Semantic drift: the idea that a word's meaning drifts while the people it picks out stay the same.
     - (d) Goodhart's law: the idea that a measure stops being informative once people start managing their behavior to fit it.

     We might also add:
     - (e) The Thomas theorem: "If men define situations as real, they are real in their consequences." (This is a general formulation of self-fulfilling prophecy, but we'll stick to the four given.)

     How do they relate?
     - (a) **Self-fulfilling prophecy**: This is a special case. Looping effects can occur through self-fulfilling prophecies (e.g., the diagnosis leads one to act in ways that confirm it) but looping effects are broader (they also involve collective feedback into the category definition). So: "special case".
     - (b) **Stereotype threat**: Also a special case. Stereotype threat is a mechanism by which a negative stereotype can lead to underperformance. This is one way a category might affect behavior, but looping effects also include positive changes and feedback into the category. So: "special case".
     - (c) **Semantic drift**: Genuinely distinct. Semantic drift is about the meaning of words changing without any necessary change in the people being referred to. In looping effects, the change in the category is driven by the change in the people, and vice versa. So: "genuinely distinct".
     - (d) **Goodhart's law**: Genuinely distinct. Goodhart's law is about how using a measure as a target corrupts the measure. It doesn't necessarily involve the kind of identity and self-understanding that looping effects do. It's about the measure becoming less valid, not about the co-evolution of the category and the person. So: "genuinely distinct".

  4. **Tangle Definition**: We need a definition that separates the tangle from category-only drift and person-only change.
     - The tangle occurs when:
       - The classification of an individual (or group) into a category leads to changes in the behavior and self-understanding of the individual (or group).
       - These changes then influence the future criteria, meaning, or application of the category itself.
       - As a result, it becomes impossible to separate the change in the category from the change in the person because they are mutually constitutive and occur in a feedback loop.

  5. **Coined Term**: Since we have an established concept, this is `null`.

  6. **Resistance Case**:
     - **same_heading**: true (because resistance can be a part of the looping effect).
     - **explanation**: The group's resistance to the diagnosis is a reaction to the initial classification. By collectively challenging the label, they are changing their behavior and self-understanding. This resistance then may alter the meaning or application of the category (e.g., by creating a debate that leads to redefinition). Thus, it's a form of looping effect where the feedback is oppositional.

  7. **Boundary Cases**: We are to create three short cases. We'll do:
     - Case 1: A clear case of the tangle (should be included).
     - Case 2: Category-only drift (should be excluded).
     - Case 3: Person-only change (should be excluded).

     Example boundary cases:

     Case 1 (included): 
       - A new personality disorder is defined. People diagnosed with it start to identify with the traits and form support groups. Over time, the disorder's definition is revised to include traits that emerge from the shared experiences of the support groups. 
       - Verdict: This is the tangle. (Reason: The category and the people co-evolve.)

     Case 2 (excluded): 
       - The term "hysteria" shifts in meaning over the decades from a physical condition to a psychological one, but the underlying symptoms and experiences of those labeled remain unchanged. 
       - Verdict: Not the tangle. (Reason: Only the category drifts; the people do not change their behavior or self-understanding in response to the label in a way that affects the category.)

     Case 3 (excluded): 
       - After a traumatic event, a person becomes more withdrawn and anxious. They are later diagnosed with PTSD, but the diagnosis does not change their behavior or the definition of PTSD. 
       - Verdict: Not the tangle. (Reason: Only the person changes, independently of the category. The category does not change in response to the person's change.)

  Now, we write the JSON accordingly.
