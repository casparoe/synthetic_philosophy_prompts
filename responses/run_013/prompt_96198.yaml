  ## MINISTRY OF MORAL FELICITY  
  Office of Consensual Offences Prevention (OCOP)  
  *Regulation Through Quantification*  

  **INSPECTOR'S FIELD MANUAL (REV. 7.3)**  
  *Section 12: Intimate Conduct Assessment*  

  1.  **Purpose:** To ascertain the net felicific yield (NFY) of observed or reported intimate acts (IC-1 through IC-9 classifications) per the Seven-Dimensional Hedonic Calculus (7DHC), as mandated by the Moral Optimization Act (MOA), 1832.
  2.  **Equipment:** Standard Issue Hedonimeter Mk. IV (Class III Penetrating Pleasure Probe), calibrated bi-weekly; Chronograph; Vicarious Affective Resonance Sensor (VARS); Notation Tablet.
  3.  **Procedure:**  
      3.1. **Initial Contact:** Present OCOP Warrant (Form F-77c) upon entry. Assure subjects their participation optimizes aggregate felicity. Avoid moralizing language; cite only calculative necessity.  
      3.2. **Baseline Measurement:** Record ambient felicity levels via Hedonimeter prior to act commencement (T-0). Note pre-existing conditions potentially influencing purity (e.g., fatigue, prior disputes).  
      3.3. **Act Observation/Reconstruction:** Employ direct observation where practicable (Panopticon Principle §4). For retrospective analysis, utilize subject testimony and material evidence (e.g., bedframe stress fractures, audio logs if consented under Form C-12).  
      3.4. **7DHC Application:** Score *during* the act where possible, or aggregate testimony immediately post-act. Utilize Hedonimeter probes (sub-dermal, non-invasive) at standardized intervals.  
      *   3.4.1. **Intensity (I):** Hedonimeter peak amplitude (μFelicons). Record mean and max.  
      *   3.4.2. **Duration (D):** Chronograph measurement (minutes:seconds). Include prelude exceeding 4.7 minutes if intensity > baseline+15μF.  
      *   3.4.3. **Certainty (C):** Probability assessment of pleasure occurring (1.0 if observed directly; discount by 0.2 per hour elapsed if reconstructed; apply coefficient γ for consent clarity).  
      *   3.4.4. **Propinquity (P):** Temporal discounting factor. Immediate pleasure scored at 1.0; subtract 0.1 per 24hr delay in occurrence or reporting.  
      *   3.4.5. **Fecundity (F):** Projected likelihood of future pleasure/pain. Default 0.5 for non-procreative acts. Add 0.3 for verified contraceptive use (reduces future pain risk). Subtract 0.4 per potential offspring if unprotected (MOA Schedule 5 pain-weighting).  
      *   3.4.6. **Purity (Pu):** Absence of subsequent pain. Measure "post-coital dysphoria index" (PCDI) via Hedonimeter 5-15 minutes post-act. Score = 1.0 - (PCDI / 100). *NOTE: Vicarious pain (e.g., neighbour outrage) is captured under EXTENT.*  
      *   3.4.7. **Extent (E):** Number of persons affected, weighted by intensity. Apply VARS to proximate neighbours (50m radius) during/immediately after act to capture vicarious displeasure/pleasure (recorded in μFelicons). Include subjects (x2).  
      3.5. **Consent Coefficient (γ):** Not a binary. Score clarity/unanimity: 1.0 (explicit, enthusiastic, sustained), down to 0.1 (implied, ambiguous, revoked mid-act). Multiply I, D, C, P, F, Pu scores by γ before summation. *Extent (E) is independent.*  
      3.6. **NFY Calculation:**  
          NFY = [γ*(I + D + C + P + F + Pu)] + E  
          Result > 0: No grounds for prohibition.  
          Result ≤ 0: Refer for Prosecutorial Felicity Assessment (PFA).  
  4.  **Reporting:** Submit Form OC-114b within 24hrs. Include raw data.  

