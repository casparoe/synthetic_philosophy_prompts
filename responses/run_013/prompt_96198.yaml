  **OFFICE OF CONSENSUAL OFFENCES PREVENTION**  
  *Case File #451B / Inspector J. Arbuthnot*  

  **FORM OC-114b: INTIMATE CONDUCT ASSESSMENT REPORT**  

  *   **Date/Time:** 2023-10-27 / 22:45-23:12
