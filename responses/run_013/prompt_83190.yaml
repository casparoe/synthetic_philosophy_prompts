prompt: |-
  Hey, I'm a third-year phil student currently doing a course on social ontology and norms, and in two weeks it's my turn to run the seminar. The topic is the convention/norm thing — whether a norm is just a convention with teeth, or whether "norm" adds something a convention can't have. Last year the same session turned into everyone defending whatever author they'd happened to read, and nobody actually found out what they thought. So I want to build a decision tree / taxonomy that sorts people by what they say about cases, not by which label they like.

  Setup: everyone starts from the bit we all agree on — that lots of social life is coordinated, and that people comply with rules nobody is forcing them to follow. Treat that as the root, and make every branch node a question a classmate could answer without knowing where it leads them. Aim for 6–8 nodes and 6–7 leaves; each leaf should carry the name of the position, or "unnamed" if nobody defends it, plus one sentence on its most awkward commitment. Names of positions are fine, I don't need citations for them, and no reading list please — I've got the reading.

  Distinctions I need the tree to actually turn on, because these are the ones that matter for the class: whether the underlying situation is one where interests line up (any equilibrium is as good for everyone) or one where they conflict; whether compliance is driven by "I expect others to do it", "I expect others to expect me to do it", "I'd be punished", or "it would be wrong even if nobody else did it"; whether deviation gets no reaction, re-coordination, or blame; whether the rule is arbitrary in the sense that a different one would have worked just as well; and whether the practice needs participants to represent each other's expectations at all, or whether a population of very dumb reinforcement learners could converge on it with no representing going on.

  Cases I want used, at least most of them: which side of the road to drive on; who speaks first in a conversation; tipping in a city you'll never come back to; a footpath across a field that everyone uses and nobody owns; standing for an anthem; burying the dead; a college tradition everyone privately hates but nobody breaks; a rule still on the books that nobody follows. And one case I want in because it makes the tree interesting: a rule everyone complies with only because each person thinks everyone else approves of it, when in fact almost nobody does.

  Build it from the logical space first — the questions and the combinations of answers they allow — and only then locate positions in it. If a combination has nobody standing in it, tell me whether that's because the view is incoherent, unattractive, or just unexplored.

  Please lay it out as:

  Bottom line — about 80 words on which one or two questions do most of the sorting work, and the single distinction I should hammer on the board.
  The tree — roughly 700–900 words. Nodes as questions, branches labelled, leaves named with the awkward-commitment sentence.
  Branches nobody's standing in — about 200 words.
  Pairs the tree can't split — about 150 words, and what extra question would separate them if I added it.
  If I have to cut it to five questions — about 120 words on which nodes go.
reasoning: |-
  Okay, the user is a third-year philosophy student preparing to lead a seminar on social ontology, specifically the distinction between conventions and norms. They want to avoid last year's problem where discussions devolved into defending authors rather than exploring ideas. Their solution is a decision tree that classifies positions based on responses to cases, not theoretical labels.

  The core challenge is designing a taxonomy that uses concrete scenarios to reveal underlying commitments. The key distinctions they want to highlight include: alignment of interests, motivation for compliance, reactions to deviation, arbitrariness, and cognitive requirements. The cases provided (like driving side, tipping, burial customs) are carefully chosen to probe these dimensions.

  I need to build this tree systematically. Starting from the agreed root of "unforced coordination," the first split should tackle the fundamental question of interest alignment. Cases like driving side (aligned) vs. tipping (conflicted) will force differentiation here. Next, motivation for compliance is crucial - whether it's based on expectations, punishment, or intrinsic wrongness. This will separate Humean conventions from moral norms.

  The third tier should examine reactions to deviation, since sanctions distinguish social norms from mere habits. Then arbitrariness tests for Lewis-style conventions. Finally, the cognitive requirement question addresses whether mutual expectations are necessary, which could exclude simple reinforcement learning models.

  Interesting edge cases like "pluralistic ignorance" (where everyone complies based on false beliefs about others' approval) will stress-test positions. This scenario might trap certain views in inconsistencies or reveal hidden assumptions.

  I should anticipate which branches might remain empty. For example, a position claiming intrinsic wrongness for arbitrary rules seems philosophically unstable. Also noting where the tree can't distinguish positions (e.g., different types of norm internalization) and suggest supplementary questions.

  If compressing to five nodes, I'd prioritize interest alignment, compliance motivation, deviation reaction, arbitrariness, and cognitive requirements - these capture the essential tensions while handling the key cases. The tipping case becomes particularly diagnostic for motivation, while the "dead rule" scenario tests what sustains practices.

  The final output should emphasize practical usability: clear binary questions, memorable position names, and explicit "awkward commitments" that spark debate. The seminar leader can then use this framework to steer discussions toward substantive disagreements rather than textual exegesis.
answer: |-
  Here’s a decision tree built from logical space, sorted by cases, with positions emerging from combinations of answers. The key sorting questions are **motivation for compliance** (Q2) and **reaction to deviation** (Q3), with the critical distinction being **whether the rule is felt as intrinsically obligatory independent of others’ expectations/punishments**.

  ---

  ### **Bottom Line (80 words)**  
  The tree turns most decisively on **why people comply** (Q2: expectations, punishment, or intrinsic wrongness) and **how others react to deviation** (Q3: no reaction, re-coordination, or blame). These expose whether a rule is merely coordinative or morally charged. Hammer the distinction: **"Does it feel *wrong* to break it even if no one expects you to follow it?"** (e.g., burying the dead vs. driving on the left). This splits "convention with teeth" from "genuine norm".

  ---

  ### **The Tree (800 words)**  

  **Root:** Unforced coordination rules exist.  
  *(Cases: driving side, conversation order, footpath, tipping, anthem, burial, hated tradition, dead rule, pluralistic ignorance)*  

  **Q1: Do individual interests align?**  
  - *Yes* (e.g., driving side, conversation order): **→ Q2**  
  - *No* (e.g., tipping, hated tradition): **→ Q3**  

  **Q2 (Aligning interests): What motivates compliance?**  
  - *"I expect others to do it" or "I expect others to expect me to do it"* (e.g., driving side): **→ Q4**  
  - *"I’d be punished" or "It’d feel wrong even if no one else did it"* (e.g., standing for anthem): **→ Q3**  

  **Q3 (Any interests): How do others react to deviation?**  
  - *No reaction or re-coordination* (e.g., footpath erosion ignored): **→ Q5**  
  - *Blame or punishment* (e.g., skipping anthem causes outrage): **→ Q6**  

  **Q4 (Aligned interests + expectation-based compliance): Is the rule arbitrary?**  
  - *Yes* (e.g., driving side—left/right works equally): **→ Leaf: Lewisian Convention**  
    - *Awkward commitment: Even moral-seeming rules (e.g., "don’t torture") could be conventions if arbitrarily chosen.*  
  - *No* (e.g., footpath—only this route avoids quicksand): **→ Leaf: Functional Regularity**  
    - *Awkward commitment: If interests align perfectly, "norms" dissolve into individual rationality.*  

  **Q5 (No blame reaction): Does the rule persist without mutual expectations?**  
  - *Yes* (e.g., dead rule—no one follows or cares): **→ Leaf: Dead Norm**  
    - *Awkward commitment: "Rules" can exist formally while being socially inert.*  
  - *No* (e.g., footpath—used only if others use it): **→ Leaf: Epistemic Convention**  
    - *Awkward commitment: Coordination can emerge from simple reinforcement learning (no mutual representation).*  

  **Q6 (Blame reaction): Is the rule arbitrary?**  
  - *Yes* (e.g., college tradition everyone hates but enforces): **→ Leaf: Social Norm (Sanction-Driven)**  
    - *Awkward commitment: People uphold pointless rules they despise due to fear of blame.*  
  - *No* (e.g., burying the dead—feels non-arbitrarily right): **→ Q7**  

  **Q7 (Non-arbitrary + blame): Would it feel wrong to break it even with no expectations/punishment?**  
  - *Yes* (e.g., burial): **→ Leaf: Moral Norm**  
    - *Awkward commitment: Obligation exists even if society disagrees (e.g., dissenter in a cannibal tribe).*  
  - *No* (e.g., tipping in a foreign city—blame expected but no inner guilt): **→ Leaf: Norm as Convention + Sanctions**  
    - *Awkward commitment: "Wrongness" reduces to fear of sanctions, not intrinsic belief.*  

  **Special Case: Pluralistic Ignorance**  
  - *Fits path*: Q1 (No) → Q3 (Blame) → Q6 (Arbitrary? *Yes*) → **Social Norm (Sanction-Driven)**  
    - *Reveals*: Compliance driven by *perceived* blame, not actual approval.  

  ---

  ### **Branches Nobody’s Standing In (200 words)**  
  Three empty leaves:  
  1. **Functional Regularity + Blame** (Q1: Align → Q2: Punishment/Wrong → Q3: Blame): If interests align *and* deviation draws blame, why would punishment be needed? Incoherent—blame implies conflict, contradicting alignment.  
  2. **Moral Norm + Arbitrariness** (Q6: Non-arbitrary → Q7: Yes): Saying a moral norm is arbitrary (e.g., "burial could equally be cremation") undermines its moral essence. Unattractive to realists.  
  3. **Dead Norm + Active Enforcement** (Q5: No blame → Dead Norm): A "dead" rule with active blame is contradictory. Unexplored because incoherent.  

  The **Epistemic Convention** leaf (dumb learners converging without mutual expectations) is rarely defended in philosophy but exists in behavioral econ models. Its awkwardness: it can’t explain cases requiring mutual belief (e.g., conversation turn-taking).  

  ---

  ### **Pairs the Tree Can’t Split (150 words)**  
  The tree conflates:  
  - **Social Norm (Sanction-Driven)** vs. **Norm as Convention + Sanctions**. Both involve arbitrary rules + blame. *Difference*: The former includes internalized approval (e.g., enforcing tradition you dislike but feel *should* be upheld), while the latter is purely instrumental (e.g., tipping to avoid scorn).  
  - **Fix**: Add **Q2.5: "Do you personally approve of the rule?"**  
    - *Yes* → Social Norm (even if arbitrary)  
    - *No* → Convention + Sanctions  

  Also conflates **Lewisian Convention** and **Epistemic Convention** when interests align + no blame. *Difference*: Lewis requires mutual expectations; epistemic doesn’t.  
  - **Fix**: Use **pluralistic ignorance case**—only Lewisian views require mutual beliefs.  

  ---

  ### **If Cutting to Five Questions (120 words)**  
  Keep:  
  1. **Q1 (Interests align?)** – Essential for coordination vs. conflict.  
  2. **Q2 (Compliance motive?)** – Core for "teeth" (punishment/wrongness vs. expectations).  
  3. **Q3 (Reaction to deviation?)** – Separates habits from enforced rules.  
  4. **Q6 (Arbitrary?)** – Tests conventionality.  
  5. **Q7 (Wrong without expectations?)** – Isolates intrinsic normativity.  
  Cut **Q4** (arbitrariness under alignment) and **Q5** (persistence without expectations). Sacrifices "Dead Norm" and "Functional Regularity" distinctions but preserves core norm/convention boundary. Use cases like the *dead rule* and *footpath* to illustrate gaps.  

  ---  
  This tree forces positions via cases (e.g., burial *must* be Moral Norm; driving side *must* be Lewisian). The "awkward commitments" prevent easy retreats. Good luck with the seminar!
