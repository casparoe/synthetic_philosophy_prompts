  ### Checklist of Desiderata for a Theory of Child Grammar Acquisition

  | Requirement                                     | Motivating Case or Finding                                                                                             | What It Rules Out                                                                 | Status                                      |
  |-------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|---------------------------------------------|
  | Absence of negative evidence                    | Studies (e.g., Brown & Hanlon, 1970) show caregivers rarely correct grammatical errors explicitly; children ignore implicit corrections. | Theories relying on explicit/implicit negative evidence for error correction (e.g., behaviorist reinforcement models). | Non-negotiable                              |
  | Sensitivity to statistical regularities         | Infants as young as 8 months track transitional probabilities in speech streams to segment words (Saffran et al., 1996). | Theories denying statistical learning plays any role in acquisition (e.g., strict symbolic nativism without learning). | Non-negotiable                              |
  | Structure-dependent character of rules          | Children form questions via hierarchical structure (e.g., *"Is the boy who is hungry __ waiting?"*) not linear order (Crain & Nakayama, 1987). | Theories proposing linear (non-hierarchical) rules (e.g., early associationist models). | Non-negotiable                              |
  | Existence of a sensitive period                 | First- and second-language proficiency declines sharply after puberty; cases of deprivation (e.g., Genie) show irreversible deficits (Johnson & Newport, 1989). | Theories claiming language learning is equally efficient across the lifespan (e.g., strong empiricist models ignoring maturation). | Non-negotiable                              |
  | Emergence of full grammar in new sign languages | Nicaraguan Sign Language (NSL) developed complex grammar rapidly in deaf children without linguistic input (Senghas & Coppola, 2001). | Theories requiring a fully formed input language for grammar acquisition (e.g., strict input-matching empiricism). | Non-negotiable                              |
  | Uniform competence across child-rearing regimes | Children acquire full grammar despite varying input quality (e.g., minimal interaction in some societies; adoptive language switches). | Theories demanding specific environmental enrichment (e.g., intensive tutoring models). | Non-negotiable                              |
  | Poverty of the stimulus (added)                 | Children deduce complex rules (e.g., constraints on *wh*-movement) from impoverished input lacking direct evidence (Chomsky, 1980). | Theories asserting input alone suffices for acquisition (e.g., simplistic tabula rasa empiricism). | Nativist commitment (though all must address it) |

  ### Analysis of Requirements

  **Unsatisfiable Subset and Implications for the Debate**  
  The requirements **sensitivity to statistical regularities** and **poverty of the stimulus** cannot be jointly satisfied without additional theoretical machinery. Statistical learning leverages input regularities, yet poverty of the stimulus asserts that input is insufficient for complex grammar acquisition. Pure empiricist models (relying solely on statistics) fail to explain how abstract, structure-dependent rules emerge from impoverished data, while extreme nativist models (dismissing statistical learning) cannot account for infants' demonstrable input-driven pattern detection. This tension implies that adequate theories must incorporate *hybrid mechanisms*: either innate constraints guiding statistical learning (nativist-leaning) or domain-general learning biases amplifying input regularities (empiricist-leaning). If unresolved, the debate stagnates; reconciling them requires conceding that both input-driven learning and inherent constraints (whether domain-specific or general) are necessary.

  **Most Exclusionary Requirement**  
  The **poverty of the stimulus** requirement does the most to exclude otherwise live positions, as it categorically dismisses empiricist theories that rely exclusively on input statistics without innate or domain-general biases to bridge the evidence gap.
