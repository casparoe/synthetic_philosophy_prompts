prompt: |-
  I'm in a grad seminar on philosophy of mind and we've burned three weeks on the knowing-how / knowing-that thing — Ryle, Stanley and Williamson, the whole fight over whether knowing how to do something is just knowing a bunch of facts under a different hat — and I've realized I can recite all the positions but I have no idea what I actually think a theory here is even supposed to do. So before I read another paper, help me write the desiderata. What does any adequate theory of know-how — or practical knowledge, or skill, I'm not even sure those are the same thing, which might be part of the problem — have to deliver? I want the full spec: the cases it has to get right, the distinctions it can't collapse, the results from outside philosophy it can't contradict, the explanatory jobs it has to do. Let me give you the stuff from my notes that keeps tripping me up, so the list is anchored to real cases and not just vibes. (1) The sous-chef: the head chef can't explain why her sauce works but fixes it every time, while the food scientist can state the principle exactly and can't fix the sauce at all. (2) The rusty case: my uncle could play piano, had a stroke, can still tell you exactly how he used to do it, can't play anymore — does he still know how, and does he know it the same way a coach who never played does? (3) The improv case: a jazz player mid-solo has no idea what note is coming next, so in what sense did she know how to play that solo before she played it? (4) Gradability: 'knows how to tie a bowline' and 'knows how to do brain surgery' don't feel like the same kind of thing, and one of them seems to come in degrees. (5) Animals and babies plainly know how to do things and plainly don't have the concepts the propositional story needs. (6) And the linguistic thing: 'knows how to swim' and 'knows how the carburetor works' are the same construction, but one reads as a skill and the other as a fact — is that a desideratum or a distraction? I'd like each requirement to come with the case or consideration that motivates it, so I can see which ones are load-bearing and which are just things people in my seminar happen to care about.

  Then two things on top of the list. First, mark which requirements are negotiable (a preference of one camp) and which are non-negotiable (drop it and you're no longer theorizing about the same thing). Second, and this is the part I actually want: if some subset of the requirements can't be satisfied together, say which, and say what the cheapest thing to give up is. I have a suspicion that 'know-how is a kind of propositional knowledge' and 'creatures without concepts have know-how' are each non-negotiable for different people and can't both survive, but I want you to find the real collisions rather than just agreeing with me. If it's short, add a line or two per requirement on how Ryle's view, the intellectualist line, and an ability-first view do against it — but the list is the deliverable, dont let the scorecard eat it. And please be honest about which of these constraints are common ground among people who actually work on this and which are genuinely contested; I dont want a contested demand smuggled in as if its just obviously what a theory has to do.
reasoning: |-
  Okay, let me start by unpacking what the user is asking. They're in a grad seminar on philosophy of mind, stuck on the knowing-how vs. knowing-that debate. They've spent weeks on Ryle, Stanley, Williamson, but feel lost about what a theory of know-how should actually accomplish. They provided six specific cases that confuse them and want a clear list of desiderata for any adequate theory of know-how.

  First, I need to understand their main request: a comprehensive list of requirements that a theory must meet, grounded in real cases, with each requirement tied to a motivating example. They also want to know which requirements are non-negotiable versus negotiable, identify potential conflicts between them, and see which theories satisfy which requirements. Plus, they want honesty about which constraints are contested in the literature.

  Looking at their cases: the sous-chef highlights tacit knowledge vs. explicit propositional knowledge. The rusty pianist case involves retained propositional knowledge but lost ability. Improv jazz touches on non-deliberative action. Gradability shows that some know-how is scalar. Animals and babies challenge intellectualism by operating without concepts. The linguistic issue questions whether syntax mirrors semantics.

  I should structure the desiderata around these cases. Each requirement must address one or more of their examples. For instance, the first desideratum (Tacit/Embodied Knowledge) comes from the sous-chef. The second (Ability Dependence) from the rusty pianist. The third (Non-Deliberative Execution) from improv jazz, and so on.

  Next, I need to mark which requirements are non-negotiable. The user suspects that propositional knowledge and non-conceptual know-how can't coexist. I agree that Desideratum 5 (Non-Conceptual Possession) conflicts with Intellectualism's core. If animals have know-how without concepts, intellectualism must either deny that or reinterpret "know-how" for them. That's a key conflict.

  Also, gradability (Desideratum 4) might clash with propositional accounts since propositions are typically all-or-nothing. Stanley might counter by linking gradability to modes of presentation, but that's a stretch. Ability-first views handle gradability naturally through skill levels.

  For the linguistic point (Desideratum 6), I should note it's a negotiable, low-priority constraint. Some theories might prioritize philosophical coherence over syntactic uniformity.

  Now, for conflicts: The biggest is between Intellectualism (Desideratum 5) and Non-Conceptual Possession. Giving up either is costly. Denying animal know-how is counterintuitive, so revising intellectualism to accommodate non-conceptual states might be cheaper. Another tension is between Ability Dependence (Desideratum 2) and Propositional Core (Intellectualism). If ability can be lost while propositions remain, intellectualism must explain why that isn't know-how anymore.

  I'll briefly note how each theory handles the desiderata. Ryle excels at tacit knowledge and non-conceptual cases but struggles with gradability and linguistic uniformity. Intellectualism handles propositional links and rusty cases but falters on non-conceptual possession. Ability-first views manage ability dependence and gradability well but may blur knowledge and success.

  The user's deeper need is clarity on what's essential in the debate. They want to identify the load-bearing walls in the theory to avoid getting bogged down in arguments that don't address core issues. By highlighting conflicts and non-negotiables, they can see where compromises must be made and evaluate theories based on which desiderata they prioritize.

  Finally, I'll be honest about contested points. For example, whether linguistic uniformity is important is debated. Some philosophers care about syntax; others think it's a red herring. Also, the gradability of know-how might be accepted, but how to explain it varies. Making these distinctions clear will help the user navigate the seminar discussions more effectively.
answer: |-
  Here’s a comprehensive desiderata list for a theory of know-how/practical knowledge, grounded in your cases and annotated for negotiability, conflicts, and theoretical trade-offs. Requirements are ordered by their non-negotiable status and centrality to the phenomenon.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  *Drop these, and the theory fails to capture know-how as commonly understood.*

  1. **Tacit/Embodied Knowledge**  
     - *Motivation:* Sous-chef case (tacit skill vs. explicit propositional knowledge without skill).  
     - *Requirement:* Must explain how agents can reliably perform actions without being able to articulate propositional justifications.  
     - *Conflict Potential:* Directly challenges "know-how = know-that" reduction.  
     - *Theories:*  
       - Ryle: Central (knowledge as dispositions).  
       - Intellectualism (Stanley/Williamson): Must reduce to "knowledge under practical mode of presentation."  
       - Ability-First: Built-in (skill is non-propositional).  

  2. **Ability Dependence**  
     - *Motivation:* Rusty pianist case (retained propositions about playing, lost ability to play).  
     - *Requirement:* Must explain why losing the ability to perform X entails losing (or degrading) know-how to do X.  
     - *Distinction:* Cannot collapse know-how into *mere* knowledge of propositions *about* the action.  
     - *Conflict Potential:* Forces a wedge between know-how and pure know-that.  
     - *Theories:*  
       - Ryle: Know-how *is* ability (non-negotiable).  
       - Intellectualism: Must argue ability loss = loss of *specific* propositional knowledge (e.g., "how-I-can-do-it-now").  
       - Ability-First: Core commitment.  

  3. **Non-Conceptual Possession**  
     - *Motivation:* Animals/babies (e.g., squirrel knows how to crack nuts without "nut" or "force" concepts).  
     - *Requirement:* Must accommodate know-how in agents lacking the concepts required for propositional formulations.  
     - *Non-Negotiable:* Rejecting this implies denying know-how to infants/animals—a major cost.  
     - *Conflict Potential:* Fatal for intellectualism if concepts are necessary for know-that.  
     - *Theories:*  
       - Ryle: Explicitly includes animals ("intelligence without intellect").  
       - Intellectualism: Either denies animal know-how (Stanley) or redefines concepts minimally (contested).  
       - Ability-First: Easily accommodates.  

  ---

  ### **Explanatory Desiderata (Highly Constraining)**  
  *Theories can reject these, but at significant explanatory cost.*

  4. **Gradability and Scope Variance**  
     - *Motivation:* "Tie a bowline" vs. "do brain surgery" (scalar skill vs. all-or-nothing?).  
     - *Requirement:* Must explain why some know-how admits of degrees (novice/expert) while others are threshold-relative.  
     - *Conflict Potential:* Intellectualism struggles if know-that is binary; must appeal to gradable *modes of access*.  
     - *Theories:*  
       - Ryle: Gradability via complex dispositions.  
       - Intellectualism: Gradability of practical "ways of thinking."  
       - Ability-First: Natural fit (skills improve with practice).  

  5. **Non-Deliberative Execution**  
     - *Motivation:* Jazz improv case (action without conscious foreknowledge of steps).  
     - *Requirement:* Must explain how agents can "know how" to perform novel, unplanned actions in real-time.  
     - *Distinction:* Cannot reduce know-how to pre-stored action-plans.  
     - *Theories:*  
       - Ryle: "Intelligent" dispositions adapt to context.  
       - Intellectualism: Knowledge of general principles + improvisational capacity.  
       - Ability-First: Skills generate context-sensitive responses.  

  ---

  ### **Negotiable Desiderata (Theory-Dependent)**  
  *Rejected or reinterpreted by some camps.*

  6. **Propositional Links**  
     - *Motivation:* Rusty case (propositional knowledge persists post-ability) and coaching (know-that without ability).  
     - *Requirement:* Should explain the relationship between know-how and relevant know-that (e.g., coaching, instruction).  
     - *Negotiable:* Intellectualism elevates this; Ryleans downplay it.  
     - *Conflict Potential:* Overemphasis risks collapsing know-how into know-that.  

  7. **Linguistic Uniformity**  
     - *Motivation:* "Knows how to swim" vs. "knows how the carburetor works."  
     - *Requirement:* *If* pursued, must explain divergent readings of "knows how to" (skill vs. factual).  
     - *Negotiability:* High. Many philosophers treat this as a red herring (syntax ≠ semantics).  
     - *Theories:*  
       - Intellectualism: Uses syntax to argue for uniform propositional object.  
       - Others: Argue for ambiguity or pragmatic differences.  

  ---

  ### **Key Conflicts and Trade-offs**  
  1. **Fatal Conflict: Intellectualism vs. Non-Conceptual Know-How (Desiderata 3 & 5)**  
     - *Collision:* If know-how requires know-that, and know-that requires concepts, animals/babies can’t have know-how.  
     - *Cheapest Give-Up:* Deny know-how to animals (intellectualist move) *or* reject intellectualism’s core claim.  
     - *Cost:* Denying animal know-how is deeply counterintuitive; rejecting intellectualism abandons unifying knowledge.  

  2. **Tension: Ability Dependence (2) vs. Propositional Core (Intellectualism)**  
     - *Collision:* Rusty pianist retains know-that but loses ability. If know-how requires ability, intellectualism must deny he retains know-how.  
     - *Cheapest Give-Up:* Intellectualists distinguish *ability-specific* propositions (e.g., "how-I-can-now" vs. "how-I-could").  

  3. **Gradability (4) vs. Propositional Unity (Intellectualism)**  
     - *Collision:* Know-that is traditionally binary; skills are gradable.  
     - *Cheapest Give-Up:* Intellectualists make know-that gradable via context-relativity (contested).  

  ---

  ### **Honest Ground Map**  
  - **Common Ground:**  
    - Tacit knowledge exists (sous-chef).  
    - Ability is central to know-how (rusty pianist).  
    - Animals have *something* akin to know-how.  
  - **Contested:**  
    - Whether linguistic data matters.  
    - Whether know-how reduces to abilities *or* propositions (core divide).  
    - Whether concepts are necessary for genuine know-how.  

  ---

  ### **Theoretical Scorecard Snapshot**  
  | **Desideratum**       | **Ryle** | **Intellectualism** | **Ability-First** |  
  |------------------------|----------|---------------------|-------------------|  
  | Tacit/Embodied (1)     | ★★★      | ★★☆ (needs work)   | ★★★               |  
  | Ability Dependence (2) | ★★★      | ★☆☆ (major strain)  | ★★★               |  
  | Non-Conceptual (3)     | ★★★      | ★☆☆ (denies/revises)| ★★★               |  
  | Gradability (4)        | ★★☆      | ★★☆                | ★★★               |  
  | Non-Deliberative (5)   | ★★★      | ★★☆                | ★★★               |  
  | Propositional Links (6)| ★☆☆      | ★★★                | ★★☆               |  

  ★ = Satisfied easily; ☆ = Requires contortions/denials  

  ---

  **Your Insight Was Right:** The irreconcilable clash is between **non-conceptual know-how** (animals/babies) and **intellectualism’s core claim**. Giving up either is costly: deny a pre-theoretical intuition or abandon a unifying epistemology. Most theories prioritize one over the other—there’s no free lunch. Use this list to pressure-test readings: if a paper ignores the jazz case or hand-waves the sous-chef, it’s dodging a load-bearing desideratum.
