     - The student defines substantive as normative (what ought to be done) and procedural as descriptive (what is done). But Simon's procedural rationality is not merely descriptive; it is the rationality of the process given cognitive constraints. The student oversimplifies by equating the contrast to "ought vs. actual". This is a moderate error. The definitions are partially correct but not entirely accurate. We might deduct 1-2 points. Also, the student says Simon's program is to replace normative with descriptive. While Simon does emphasize descriptive, he does not entirely reject normative theory for bounded rationality. This is a minor point. Overall, award 3 or 4 points? Let's see: the student does get the core idea that procedural rationality is about the process and that the bank's behavior is procedurally rational. But the definitions are imprecise. Deduct 1 point -> 4 points? Or 3? The rubric says "uses the contrast correctly" - the contrast is used to defend the bank: the bank is procedurally rational. So that part is correct. But the definitions are flawed. We'll deduct 1 point for the imprecision in definitions -> 4 points.

