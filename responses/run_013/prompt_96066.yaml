  4. **Objection (ii)**: 5 points max.
     - The student gives the objection in a strong form (any behavior can be redescribed as maximizing) and concedes that the redescription is possible. But the student does not properly deny what a defender of satisficing should. The defender should deny that the redescription captures the psychological process and the adaptive nature of the aspiration level. Also, the student does not distinguish between representability (which is possible) and empirical equivalence (which is not necessarily true, because the aspiration level adjustment can be a distinct prediction). The student says no observation can distinguish, which is not entirely true because the aspiration level adjustment is a dynamic that the static optimization model might not capture. The student also does not provide a concession that a defender should make (that the behavior can be described as optimization under a particular payoff function). The student does make the point about the psychology of search, which is a valid defense. But overall, the answer is weak on this part. The rubric requires:
