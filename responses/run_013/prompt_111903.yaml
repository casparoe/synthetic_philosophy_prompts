prompt: |-
  I'm in a seminar on norms and conventions, and last week's session — on whether ordinary conventions like tipping, which side of the escalator you stand on, queueing at a bar, or crossing against the light are moral obligations — ended when the professor said, in a tone that closed the discussion, "When in Rome, do as the Romans do." The case on the table was a visiting student who won't tip in a city where tipping is expected, stands on the wrong side of the escalator, and crosses an empty street against the light, on the grounds that she is only passing through and these are not her conventions. I don't think the proverb settles her case, but I also can't say precisely what it claims. Can you separate out the distinct claims it could be making — from "you will get along better if you conform," through "conventions bind only those who share them," to something that makes a visitor's obligations depend on the host community's practices — and say of each whether it is a platitude, a substantive and defensible thesis, or false; whether it treats purely coordinative conventions (which side of the escalator) the same as distributive ones (tipping, which moves money to workers); and whether it would extend to local conventions I take to be criticizable? Then tell me which reading the professor would need for her sentence to actually dispose of the visiting student's case, and which reading she most likely meant. Lay it out as a numbered menu I can bring to office hours, with a one-line verdict on each reading.
reasoning: |-
  Okay, the user is in a seminar discussing norms and conventions, specifically whether things like tipping, escalator etiquette, and jaywalking are moral obligations. The professor ended the last session with "When in Rome, do as the Romans do," which seemed to shut down the discussion. The case in point involves a visiting student who ignores these local conventions because she's just passing through. The user doesn't think the proverb resolves the issue and wants a breakdown of what it could mean.

  First, I need to unpack the proverb's possible interpretations. The user mentioned several angles: practical advice, moral obligation based on community practices, etc. I should categorize these into distinct claims. Let's start with the practical one: conforming helps you get along. That's probably a platitude—everyone knows blending in avoids trouble. Then there's the idea that conventions are binding only if you're part of the group. That seems substantive but debatable. The "social contract" version is more normative, suggesting a duty to respect local norms. That could be defensible but needs more nuance. The relativist stance, where local practices define morality, is likely false—just because something is conventional doesn't make it right. And the consent-based argument, where presence implies agreement, feels weak because mere presence isn't active consent.

  Next, the user wants to know if coordinative vs. distributive conventions are treated the same. Coordinative ones, like escalator sides, are about efficiency and mutual benefit. Distributive ones, like tipping, involve resource transfers. The proverb might apply differently here, especially if tipping is seen as shifting burdens to workers. The professor's closing remark probably assumes a strong normative reading to dismiss the student's actions, but that relies on an obligation to conform, which is contestable.

  Also, the user is preparing for office hours, so clarity is key. They need a numbered list with verdicts. The professor likely meant the social contract reading (#3) to assert a duty, but that's not airtight. The student's case isn't settled because the obligation isn't absolute—context matters, like whether conventions are harmful or reasonable. Plus, the distributive aspect of tipping might require more scrutiny than escalator norms. Highlighting these distinctions will help the user challenge the professor's dismissal effectively.
answer: |-
  Here's a breakdown of "When in Rome, do as the Romans do" as a numbered menu of distinct claims, analyzing each for the visiting student's case, including verdicts on their nature and applicability to different convention types:

  ### Menu of Interpretations & Verdicts

  1.  **The Pragmatic Advice Claim:** Conforming to local conventions is *prudentially wise*; it helps you avoid social friction, penalties (like dirty looks or service refusal), and integrates you smoother ("you will get along better").
      *   **Nature:** Platitude (generally true, widely accepted practical wisdom).
      *   **Coord. vs. Distrib. Conventions:** Applies equally. Standing wrong causes bumping, not tipping *might* get you bad service.
      *   **Extends to Criticizable Conventions?** Yes, but conformity might be unwise *because* they are criticizable (e.g., conforming to a discriminatory norm).
      *   **Verdict:** True, but doesn't establish a *moral obligation*; the student might accept the friction.

  2.  **The Membership-Binding Claim:** Conventions *only* create obligations for those who are members of, or have explicitly consented to, the community that holds them ("conventions bind only those who share them").
      *   **Nature:** Substantive & Defensible thesis (e.g., based on associative obligations or consent theory).
      *   **Coord. vs. Distrib. Conventions:** May apply more strongly to Distributive (like tipping, imposing costs) than Coordinative (like escalators, solving shared problems).
      *   **Extends to Criticizable Conventions?** Easily, as non-members have no obligation to uphold norms they find objectionable.
      *   **Verdict:** Defensible, directly supports the student's "just passing through" argument; professor's proverb *contradicts* this.

  3.  **The Respectful Guest / Social Contract Claim:** Visitors have a *pro tanto* (prima facie) moral obligation to respect and conform to the legitimate conventions of the host community as a matter of reciprocity, respect for self-governance, and maintaining social order, *because* they are benefiting from that order.
      *   **Nature:** Substantive & Defensible thesis (draws on hospitality, reciprocity, social contract extension).
      *   **Coord. vs. Distrib. Conventions:** Applies clearly to Coordinative (disrupting escalator flow harms efficiency). Applies to Distributive (like tipping) *if* it's seen as a legitimate part of the service economy structure visitors benefit from.
      *   **Extends to Criticizable Conventions?** Creates tension; obligation weakens significantly for conventions deemed seriously unjust or harmful.
      *   **Verdict:** Defensible core; likely what professor *intended* to impose obligation on the student.

  4.  **The Conventional Relativism Claim:** What is morally right *in a given place* is *defined by* the local conventions; therefore, conformity *is* the moral requirement ("obligations depend on host community's practices" in a strong sense).
      *   **Nature:** False (as a general moral theory). Conventions can be unjust; morality isn't solely determined by local practice.
      *   **Coord. vs. Distrib. Conventions:** Collapses the distinction; both become morally binding simply by being conventional.
      *   **Extends to Criticizable Conventions?** Problematic, as it morally mandates conformity even to deeply criticizable norms simply because they are local.
      *   **Verdict:** False; would morally require conformity to *any* local norm, however bad.

  5.  **The Tacit Consent Claim:** By voluntarily entering and remaining in the community ("Rome"), the visitor *tacitly consents* to abide by its conventions.
      *   **Nature:** Weak/False as a general rule for conventions. Mere presence ≠ consent to all norms, especially unfamiliar or objectionable ones.
      *   **Coord. vs. Distrib. Conventions:** Unconvincing for both, but particularly weak for Distributive norms imposing costs (like tipping) without clear prior notice.
      *   **Extends to Criticizable Conventions?** Highly implausible; presence doesn't imply consent to injustice.
      *   **Verdict:** False; insufficient to establish binding obligation, especially for a visitor.

  ### Addressing the Professor & the Student's Case

  *   **Which Reading Disposes of the Student's Case?** Only a strong interpretation of **#3 (Respectful Guest/Social Contract Claim)** or **#4 (Conventional Relativism Claim)** directly imposes a moral obligation on the student sufficient to dismiss her objections. **#4** is indefensible. **#3** is defensible but faces challenges regarding the legitimacy/justice of specific conventions and the strength of the obligation for temporary visitors. **#1** gives reasons but not moral obligation. **#2** & **#5** support the student.
  *   **Which Reading Did the Professor Likely Mean?** The professor almost certainly invoked **#3 (Respectful Guest/Social Contract Claim)**. The closing, definitive tone suggests a normative claim about obligation ("*should* do") based on respecting the host community's practices, not merely pragmatic advice (#1). This is the most common understanding of the proverb in such contexts.

  ### Key Distinction Highlight
  *   **Coord. vs. Distrib. Matters:** The proverb (#3) applies most straightforwardly to **coordinative conventions** (escalator, jaywalking *when safety isn't compromised*). The obligation is clearer: disruption harms the shared system you are temporarily using. For **distributive conventions** (tipping), the obligation under #3 hinges on whether the visitor *benefits from the system* relying on that distribution (e.g., lower menu prices subsidized by tips) and its legitimacy (fair wages?). This is where the student's case has more bite – is tipping a morally necessary distribution or a contingent practice? The proverb alone doesn't resolve this nuance within interpretation #3.
