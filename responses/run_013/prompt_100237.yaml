prompt: |-
  I have followed the cultural-evolution debates on and off since the old Overcoming Bias days, and there is a point I cannot get past, because it may be a verbal quibble or may be the whole ballgame. The standard line is that cultural evolution is Lamarckian—we acquire ideas during our lifetimes and pass on the acquired versions—whereas Darwinian evolution is supposed to be defined by the absence of exactly that, with blind variation and selection doing the work. So is a Darwinian theory of culture an oxymoron? Suppose I write down a toy model: each generation copies the most successful practitioner's method, improvises an improvement, and the improved method is what gets copied next—inheritance of acquired characters plus selection on success. Is that process Darwinian, Lamarckian, both, or neither, and does calling it Darwinian add anything beyond a vague appeal to selection? If the answer is that selection can operate on Lamarckian inheritance, has 'Darwinian' become so thin that it stops doing explanatory work, leaving the meme's-eye view as a metaphor? I would like to know which move is standard and whether the standard move survives scrutiny.
reasoning: |-
  Okay, the user has been following the cultural evolution debates since the Overcoming Bias days and has a persistent question about whether calling cultural evolution "Darwinian" is appropriate. They're stuck on the Lamarckian versus Darwinian distinction. Let me unpack their query.

  First, they mention the standard line that cultural evolution is Lamarckian because ideas are acquired during a lifetime and passed on. But Darwinian evolution is defined by the absence of inheritance of acquired characteristics, relying instead on blind variation and selection. So, they're wondering if a Darwinian theory of culture is an oxymoron. That's the core of their confusion.

  They give a toy model: each generation copies the most successful person, improvises an improvement, and that improved version gets passed on. They ask if this is Darwinian, Lamarckian, both, or neither. Also, does labeling it Darwinian add anything beyond a vague appeal to selection? If selection operates on Lamarckian inheritance, has "Darwinian" become too diluted to be useful, reducing memes to just a metaphor?

  I need to address both the terminology and the substance. The user seems well-versed in the topic, referencing specific debates and models. Their deep need is likely to clarify whether the Darwinian framework is substantively applicable to cultural evolution or if it's just a loose analogy. They might be concerned that using "Darwinian" loosely undermines the explanatory power of the theory.

  Historically, the distinction between Lamarckian and Darwinian mechanisms is key. In biology, Darwin didn't know about genes; the modern synthesis combined natural selection with genetics. Cultural evolution doesn't involve genetic changes but relies on learning and imitation. The inheritance of acquired characteristics is central here, which is Lamarckian. 

  But selection still plays a role. Even if variation is directed (like improvising improvements), the selection part (copying the most successful) is Darwinian. So, it's a mix. The user's toy model has both Lamarckian inheritance (acquired improvements passed on) and selection (choosing the most successful). 

  The expert consensus, as per Boyd, Richerson, Mesoudi, etc., is that cultural evolution is Darwinian in a broader sense—population-level change via variation, inheritance, and selection. But the mechanisms differ. The term "Darwinian" here is more about the abstract structure than the specific biological mechanisms. 

  The user's worry about "Darwinian" becoming too thin is valid. If it just means any selection process, then it might lose explanatory power. However, in cultural evolution, the key is the population-level dynamics where selective retention shapes traits over time. The meme's-eye view can be a useful metaphor but needs empirical grounding. 

  So, the standard move is to separate the logic of selection (Darwinian) from the inheritance mechanism (Lamarckian). The explanatory work comes from modeling how these processes interact. The user's model isn't purely Darwinian but uses Darwinian selection on culturally acquired traits. Calling it Darwinian highlights the selection component, but it's essential to specify the inheritance mechanism. 

  The user might need reassurance that the terminology isn't just semantic but reflects a substantive framework. They might also want to know if the meme concept holds up under scrutiny or if it's metaphorical without predictive power. Emphasizing that the field acknowledges these nuances and uses mathematical models to test mechanisms could address their deeper concern about the rigor of cultural evolutionary theory.
answer: |-
  Your question cuts to the heart of a persistent tension in cultural evolution theory. The confusion isn't semantic; it exposes a genuine conceptual challenge. Here's the breakdown:

  1.  **The Core Tension:**
      *   **Lamarckian Inheritance (as classically defined):** Direct inheritance of characteristics *acquired* or *modified* during an organism's lifetime. (e.g., Giraffe stretches neck, offspring inherit longer neck).
      *   **Darwinian Evolution (Modern Synthesis Core):** Relies on **blind variation** (random mutations/recombinations in genes *unrelated* to need) and **differential selection/replication** of those genetic variants based on fitness. Inheritance is via genes, not acquired traits.
      *   **Cultural Transmission:** Humans *actively learn*, *imitate*, and *modify* ideas, skills, and behaviors (acquired traits) during their lifetime and pass *those modified versions* on. This looks inherently Lamarckian.

  2.  **Analyzing Your Toy Model:**
      *   **Copying the most successful practitioner:** This is **selection** (differential replication based on a fitness proxy - success).
      *   **Improvising an improvement:** This is **variation**. Crucially, it's *directed* variation (aimed at improvement, not random/blind) and an *acquired* modification.
      *   **Passing on the improved method:** This is **inheritance of an acquired characteristic** (the improviser acquired the improvement during their lifetime and passes it on). This is *Lamarckian inheritance*.
      *   **Conclusion:** Your model is **fundamentally Lamarckian in its inheritance mechanism**, coupled with **Darwinian selection** (copying the successful). The *variation* step is directed, not blind.

  3.  **Is "Darwinian Theory of Culture" an Oxymoron?**
      *   **Strictly (Genocentric Definition): Yes.** If "Darwinian" *requires* gene-like, non-Lamarckian inheritance and blind variation, then cultural evolution cannot be Darwinian in that strict sense. Your model highlights this.
      *   **Broadly (Population-Level Dynamics): No.** Leading cultural evolution theorists (Boyd, Richerson, Cavalli-Sforza, Mesoudi, Henrich) argue it *is* Darwinian in the broader sense of **descent with modification driven by variation, inheritance, and selection operating on population-level distributions of traits over time.** They emphasize the *population-level logic* Darwin pioneered, not the specific molecular mechanism of genetics.
      *   **The Standard Move:** The field overwhelmingly adopts the **broader definition**. They argue cultural evolution is a *Darwinian process* because it exhibits the core population-level dynamics:
          *   **Variation:** Different ideas, practices, technologies exist.
          *   **Inheritance:** These traits are transmitted (learned, imitated) between individuals/generations.
          *   **Selection:** Some traits are transmitted more successfully than others due to biases (e.g., success bias, prestige bias, content bias), environmental fit, or random drift.
          *   **Differential Replication:** Traits with higher "fitness" (transmissibility, attractiveness, utility) become more common in the population over time.

  4.  **Does "Darwinian" Add Value or Become Too Thin?**
      *   **Adds Value (The Standard View):** Proponents argue it *does* add significant value beyond a vague metaphor:
          *   **Framework:** It provides a rigorous, formal framework (population genetics models, Price equation) for modeling cultural change quantitatively.
          *   **Explanatory Power:** It explains phenomena hard to account for otherwise: cumulative cultural complexity, maladaptive cultural traits, rapid change, cross-cultural patterns, the "adaptive lag" problem. It focuses attention on *population-level outcomes* from *differential replication*.
          *   **Mechanism Agnosticism:** The core Darwinian logic is seen as separable from the *specifics* of genetic inheritance. The population-level dynamics are what matter. Selection *can* operate on Lamarckianly inherited traits.
          *   **"Meme's-Eye View":** While often metaphorical, framing ideas as "replicators" subject to selection pressures can be heuristically powerful for generating hypotheses about *why* certain ideas spread, even if memes lack the high-fidelity copying of genes.
      *   **Risk of Becoming Too Thin (Your Concern):** Critics (and sometimes proponents acknowledge this) argue the term *can* become stretched:
          *   **Mechanistic Vagueness:** Saying "it's Darwinian" doesn't specify *how* inheritance works (high vs. low fidelity? Which biases? How is variation generated?).
          *   **Directed Variation:** Cultural variation is often highly directed (tinkering, improvisation, foresight), unlike biological mutation. Selection isn't the *only* driver of change.
          *   **Intentionality & Psychology:** Human cognition, goals, and social structures fundamentally shape transmission in ways absent in biology, potentially swamping or redirecting "selection" forces. Calling it Darwinian might downplay this.
          *   **Metaphor vs. Mechanism:** The "meme" concept often remains metaphorical; identifying discrete, faithfully replicating "cultural units" like genes is notoriously difficult.

  5.  **Does the Standard Move Survive Scrutiny?**
      *   **Yes, but with Caveats:** The standard move (broad "Darwinian process" definition) is robust *as a powerful theoretical framework and modeling approach*. It has generated significant insights and testable predictions. However, scrutiny reveals its limitations:
          *   **It's Not *Purely* Darwinian (in the strict sense):** Acknowledging the Lamarckian inheritance and frequent directed variation is crucial for accuracy. The "Lamarckian" label correctly identifies the inheritance mechanism.
          *   **"Darwinian" Refers to the Selection Logic & Population Dynamics:** The field uses "Darwinian" primarily to denote the *selection component* and the *population-level, historical, variation-inheritance-selection framework*, not to claim identity with genetic mechanisms.
          *   **The Explanatory Work Comes from the Specifics:** The true explanatory power comes *not* just from yelling "It's selection!", but from rigorously modeling *how* specific transmission biases (success, prestige, content), learning mechanisms (imitation, teaching), innovation processes, and population structures interact to produce observed cultural patterns. "Darwinian" flags the *type* of model being used.
          *   **Coexistence of Terms:** Many theorists comfortably state that cultural evolution exhibits **Lamarckian inheritance** operating within a **Darwinian framework** of variation, selection, and population change. Your model is a perfect example of this coexistence.

  **Conclusion:**

  1.  **Your toy model is Lamarckian inheritance + Darwinian selection.** Calling the *overall process* "Darwinian" in the broad sense used by cultural evolutionists is standard, but it's crucial to understand this refers to the core logic of variation, inheritance, and selection shaping populations over time, not strict adherence to genetic mechanisms.
  2.  **"Darwinian theory of culture" is not an oxymoron** within the field's standard terminology, but it *does* stretch the strict, gene-centric definition. The stretching is deliberate and argued to be necessary and productive.
  3.  **"Darwinian" adds value** by providing a powerful, formal, population-level framework for understanding cultural change, generating testable hypotheses, and explaining cumulative complexity. It highlights the role of *differential replication* as a key driver.
  4.  **The risk of "Darwinian" becoming too thin exists,** especially if used as a vague metaphor for "selection" while ignoring the specifics of directed variation, Lamarckian inheritance, cognitive mechanisms, and intentionality. Its explanatory power depends on building detailed models within the framework.
  5.  **The meme's-eye view is a metaphor,** often a useful one for heuristic purposes or emphasizing replicator dynamics, but it lacks the empirical grounding of genetic replicators. The substantive theory relies on modeling population-level processes, not necessarily reifying "memes."
  6.  **The standard move survives scrutiny** as a valid and productive theoretical framework, *provided* the differences from genetic evolution (especially Lamarckian inheritance and directed variation) are explicitly acknowledged and incorporated into models. The debate itself is healthy and drives refinement. Your unease highlights a real and important distinction, but the field has largely decided that the power of the Darwinian framework justifies its adapted use for culture.
