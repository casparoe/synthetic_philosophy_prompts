answer: |-
  ## The Day Arrives, Unannounced

  I traced the logic back from Friday's end:  
  *There will be exam, a sudden, sharp surprise,*  
  And proved no day could break that bounded trend.

  The fifth day sets the chain: no time to spend  
  In doubt, its fate clear to the keenest eyes.  
  I traced the logic back from Friday's end.

  The fourth day falls, the third meets the same friend,  
  Defeat, as certainty unmakes disguise.  
  And proved no day could break that bounded trend.

  The second holds no hope, the first will bend  
  To reason's rule. No prospect left to prize.  
  I traced the logic back from Friday's end.

  Then... movement now. A rustle. Papers send  
  A signal. Quiet dread begins to rise.  
  And proved no day could break that bounded trend?

  My careful fortress falters. Must defend  
  Its walls? But *now* the test materializes!  
  I traced the logic back from Friday's end,  
  **There will be exam, a sudden, sharp surprise,**  
  And proved no day could break that bounded trend?  
  **No surprise possible, the pupil cries!**

  Light breaks. The stark equation rearranged:  
  To trust the words I heard, yet feel absurd  
  When consequence arrives, unchallenged, unchanged.  
  My proof required the truth of what occurred  
  **There will be exam, a sudden, sharp surprise**  
  To fuel the steps that made the claim absurd.  
  The chain held firm *because* I trusted first,  
  Then built the cage that made it seem the worst  
  Could never happen. Now, the stark surmise:  
  **There will be exam, a sudden, sharp surprise**  
  **No surprise possible, the pupil cries!**

  ---

  **Notes on the Villanelle:**

  *   **Refrains:** The teacher's announcement is the first refrain ("There will be exam, a sudden, sharp surprise"). The pupil's conclusion is the second refrain ("No surprise possible, the pupil cries!"). Their juxtaposition in the final quatrain highlights the paradox's core tension.
  *   **Positional Counting:** The poem avoids naming days, using "Friday's end," "fifth day," "fourth day," "third," "second," "first" to enact the backward reasoning without specifying a calendar. The "chain" imagery reinforces this.
  *   **The Moment of Realization:** The shift happens in the third tercet ("Then... movement now... Quiet dread begins to rise") and climaxes in the fourth ("But *now* the test materializes!"). The crucial, implicit trust point occurs just before the exam arrives: "Must defend / Its walls?" implies the pupil briefly relies on the *ongoing truth* of the announcement and his own reasoning ("Its walls") to feel safe, *at the very moment* the announcement is proven true in a way his reasoning deemed impossible.
  *   **The Vindication:** The final quatrain resolves the tension. The announcement is proven true ("consequence arrives"). The pupil's reasoning is shown *not* to be stupid, but self-undermining: his proof *required* trusting the announcement ("My proof required the truth of what occurred") to build the "cage" that made the surprise seem impossible. The surprise happens *because* his reasoning, paradoxically, held the announcement true long enough for the unexpected moment to arrive.
  *   **Flow & Fall of Lines:** The iambic pentameter drives the relentless backward logic. The enjambment and questions ("Must defend / Its walls?", "And proved no day could break that bounded **trend?**") create tension and the dawning realization. The exclamation "materializes!" breaks the pattern slightly, emphasizing the shock.
  *   **Standalone Poem:** Even without knowing the paradox, the poem depicts a moment of intellectual certainty shattered by unexpected reality, exploring the tension between logic, trust, and experience.
