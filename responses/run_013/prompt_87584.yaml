  Hmm, this user is a retired field ecologist with 35 years of experience studying lake and coastal fisheries. They've been diving into common-pool resource (CPR) literature and noticed a pattern where theories are defended with cherry-picked case studies rather than robust frameworks. They want predictive power - specifically, to distinguish between similar resource systems that will degrade versus endure.

  The core request is for desiderata - the essential requirements any adequate CPR theory must meet to be predictive. They emphasize concrete cases that motivate each requirement and want to know which requirements are genuine versus ideological, which might conflict, and which single requirement does the most work in ruling out current theories.

  Key cases they want covered include: regenerating resources with unobservable thresholds, tipping-point systems, nested public goods (like infrastructure maintenance), morally non-excludable resources, and global commons without face-to-face interaction. They prefer honest trade-off mapping over false unification.

  I need to structure this carefully. First, establish what makes this problem hard: the tension between individual incentives and collective outcomes, plus the diversity of CPR types. Then list requirements with their motivating cases, flagging conflicts. Finally, assess current theories against these standards.

  For requirements, I'm considering: 
  - Precise resource characterization (rivalry/excludability nuances) 
  - Behavioral realism (beyond rational egoism) 
  - Institutional granularity 
  - Threshold dynamics 
  - Scalability challenges 
  - Path dependence 
  - Measurement protocols 
  - Predictive specificity 

  The global commons case will be the ultimate stress test. And the requirement doing the most damage to current theories? Likely "Scalability" - because local solutions don't transplant to planetary scale without new mechanisms.

  Notable conflicts: 
  - Behavioral realism vs. predictive parsimony 
  - Threshold precision vs. measurement feasibility 
  - Nested goods complexity vs. generalizability 

  I'll be blunt where trade-offs exist - like admitting no theory currently handles all five test cases well. The irrigation system example can illustrate institutional granularity, while oceanic dead zones demonstrate tipping points. For morally non-excludable resources, indigenous fishing rights are a perfect example where technical excludability exists but isn't exercised.

  The conclusion should emphasize that predictive power requires sacrificing either scope (by narrowing to resource subtypes) or precision (by accepting probabilistic forecasts). That's the unavoidable trade-off the literature often obscures.
answer: |-
  Below are the desiderata for an adequate predictive theory of common-pool resource (CPR) sustainability, grounded in empirical challenges and designed to discriminate between degradation and endurance in superficially similar systems. Each requirement is motivated by a specific case or conceptual distinction, with conflicts and ideological biases flagged. The five test cases you provided are integrated throughout.

  ---

  ### **Core Requirements & Their Motivations**  
  1. **Precise Resource Structure Specification**  
     - *Requirement:* The theory must distinguish between **non-excludability** (technical impossibility of exclusion) and **non-exclusion** (social/legal prohibition), and between **rivalry thresholds** (e.g., subtractability only beyond a point) and pure rivalry.  
     - *Motivation:* **Morally/legally non-excluded resources** (e.g., indigenous clam beds where exclusion is taboo despite technical feasibility). Mistaking non-exclusion for non-excludability ignores how social norms alter incentives.  
     - *Genuine Requirement:* Essential for predicting cases like your coastal fishery where legal bans on exclusion coexist with overextraction.  

  2. **Behavioral Realism Beyond Rational Egoism**  
     - *Requirement:* Incorporate heterogeneity in user motivations (reciprocity, norm adherence, inequality aversion) and reject uniform "rational actor" assumptions.  
     - *Motivation:* **Enduring irrigation cooperatives** (e.g., Spanish *huertas* or Bali’s *subak*) persist despite identical economic incentives to free-ride. Homogeneous models fail to explain why some groups cooperate while others defect under similar conditions.  
     - *Ideological Bias Alert:* Ostrom-style institutionalism overemphasizes cooperation; Hardin-style tragedy models overemphasize defection. Both neglect predictable variance in human behavior.  

  3. **Dynamic Thresholds & Path Dependence**  
     - *Requirement:* Model **nonlinear regeneration** (e.g., collapse beyond tipping points) and **hysteresis** (irreversible degradation), not just linear depletion.  
     - *Motivation:* **Tipping-point fisheries** (e.g., Atlantic cod collapse: recovery impossible despite reduced fishing). Linear models falsely predict recovery when harvesting stops.  
     - *Genuine Requirement:* Critical for your "degraded-state" case (e.g., eutrophic lakes that won’t rebound).  

  4. **Nested Institutional Scalability**  
     - *Requirement:* Address **multi-level governance** (e.g., maintenance of infrastructure as a second-order public good) and interactions between local/global rules.  
     - *Motivation:* **Irrigation systems requiring joint upkeep** (e.g., Nepal’s farmer-managed canals). Theories focusing only on resource extraction miss how maintenance failures cascade into collapse.  
     - *Conflict Alert:* Incompatible with theories assuming single-tier institutions (e.g., pure market or state solutions).  

  5. **Information Asymmetry & Monitoring Constraints**  
     - *Requirement:* Account for **unobservable aggregate thresholds** (e.g., users can’t measure total extraction) and costs/dynamics of monitoring.  
     - *Motivation:* **Groundwater aquifers** where no user can track total withdrawals, leading to "invisible overuse." Theories assuming perfect information (e.g., some game-theoretic models) fail here.  
     - *Genuine Requirement:* Key for your "unobservable withdrawal rate" case.  

  6. **Scalability to Anonymity**  
     - *Requirement:* Explain sustainability in systems **without repeated face-to-face interaction** (e.g., global commons).  
     - *Motivation:* **Climate change/ozone depletion**: Successful global treaties (e.g., Montreal Protocol) vs. failed fisheries agreements. Local theories relying on reciprocity/social sanctions collapse here.  
     - *Major Conflict:* Directly contradicts theories requiring tight-knit communities (e.g., Elinor Ostrom’s Design Principles).  

  7. **Predictive Granularity on Initial Conditions**  
     - *Requirement:* Identify **leverage points** (e.g., user heterogeneity, prior trust, resource visibility) that determine divergent outcomes in similar systems.  
     - *Motivation:* **Contrasting lobster fisheries**: Maine (enduring self-governance) vs. collapse in others despite comparable biology/economic pressure. A predictive theory must pinpoint *why*.  
     - *Ideological Bias Alert:* "One-size-fits-all" prescriptions (e.g., "privatize everything" or "always localize") ignore context.  

  ---

  ### **Inherent Conflicts & Trade-offs**  
  - **Scalability vs. Behavioral Realism** (Requirements 6 vs. 2):  
    Face-to-face monitoring enables reciprocity/norm enforcement but fails globally. Global systems require impersonal institutions (e.g., enforceable treaties), which are brittle without local buy-in.  
    - *Test Case Failure:* No theory adequately handles **global commons** (e.g., high-seas fisheries) while preserving nuances of local cooperation.  

  - **Threshold Precision vs. Practical Observability** (Requirements 3 vs. 5):  
    Tipping points demand precise data on resource states, but many resources (e.g., underground aquifers) have unobservable thresholds. Theories requiring perfect measurement are useless in practice.  

  - **Nested Goods Complexity vs. Parsimony** (Requirement 4):  
    Second-order public goods (e.g., infrastructure maintenance) add layers of collective action problems. Overly complex models become unfalsifiable; overly simple ones miss cascading failures.  

  ---

  ### **The Ultimate Stress Test: Which Requirement Rules Out Most Theories?**  
  **Requirement 6 (Scalability to Anonymity)** does the heaviest lifting. Most theories (Ostrom’s polycentric governance, market-based quotas, state regulation) rely on trust, monitoring, or enforcement mechanisms that collapse at global scales. If a theory cannot explain **why the ozone layer was saved but deep-sea fisheries are collapsing**—despite both being global, non-excludable, and rivalrous—it fails predictive adequacy.  

  ---

  ### **Scorecard on Your Five Test Cases**  
  | Test Case                          | Best-Handled By Requirements        | Critical Gap(s)                     |  
  |------------------------------------|-------------------------------------|-------------------------------------|  
  | 1. Unobservable withdrawal rate    | 3 (Thresholds), 5 (Information)     | Most theories assume measurable thresholds |  
  | 2. Tipping-point degradation       | 3 (Thresholds), 7 (Initial conditions)| Ignores stochastic shocks (e.g., climate events) |  
  | 3. Nested infrastructure maintenance | 4 (Nested goods), 2 (Behavior)     | Overlooks institutional interplay   |  
  | 4. Morally non-excluded resource   | 1 (Resource structure), 2 (Behavior)| Assumes excludability is binary     |  
  | 5. Global commons without community | 6 (Scalability), 7 (Granularity)   | All current theories struggle here |  

  **Brutal Truth:** No existing theory satisfies all requirements simultaneously. Predictive power demands trade-offs:  
  - **Scope vs. Precision:** Focus on resource subtypes (e.g., only fisheries) for accuracy, or accept probabilistic predictions for generality.  
  - **Parsimony vs. Realism:** Simple models (e.g., agent-based) capture dynamics but need massive calibration; complex models (e.g., institutional analysis) lose predictive clarity.  

  The literature’s "favorite case" approach masks these tensions. A predictive theory must start with your desiderata—then admit where the map ends and the fog begins.
