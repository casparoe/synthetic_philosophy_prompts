prompt: |-
  I've spent the past year coordinating a small volunteer fact-checking desk out of our county library system: patrons drop off a claim at the reference counter or through a web form, and my team has to decide within a day or so whether the claim gets a short written explainer we publish under the library's name, whether we send the patron back with guidance on how to check it themselves, or whether we say nothing at all because engaging would only spread it further. I got pulled into this after watching a close relative sink into a theory about our water utility that I could never reason him out of — every piece of evidence I brought him was absorbed and turned into further proof of the cover-up — and that experience convinced me that the usual advice to check the source and check the date is close to useless against a claim that has already built the debunking into itself. We handle four or five submissions a week, we get about fifteen minutes of research per claim with no access to court records or public-records requests, and anything we publish is signed off by the library director, so I need a procedure that is defensible rather than clever.

  What I want from you is a decision procedure my volunteers can actually run on a claim, built out of what the epistemology of conspiracy theories genuinely knows rather than the folk version. The tension I keep running into is this: there is one tradition that treats a conspiracy theory as just an ordinary causal claim, to be weighed evidence by evidence like any other, and another that treats conspiracy theories as a distinctive epistemic kind that can be discounted in advance on structural grounds — and I need a procedure that uses the structural grounds as triage without becoming a machine for dismissing true claims, since real conspiracies and real institutional wrongdoing exist and often look, at first, exactly like this. So the procedure should have an explicit step that forces genuine engagement with the leftover anomalies that official accounts leave unexplained, because a good conspiracy theory's whole selling point is that it explains them, and it should treat the following as indicators to be operationalized rather than as verdicts: a structure in which disconfirming evidence is reabsorbed as confirming; a demand for a higher evidentiary standard from the official account than from the theory itself; an assumption of near-perfect secrecy across a large number of participants; and the habit of treating coincidence as something that must be explained away. I also want the procedure to keep separate the epistemic question (is this claim warranted?) from the strategic and ethical question (should we, a public institution, respond to it at all?), because those come apart and I don't want my volunteers resolving a values question with a checklist.

  The deliverable should be the ordered questions to ask, what counts as a sufficient answer to each, where the procedure stops with a definite no, and where it hands the decision to a person because the question is one of values rather than facts — and it should be honest about which steps are judgment calls dressed up as procedure. Then run it on three submissions I'll give you so I can see it work: first, my relative's claim that the utility is adding something to the water as part of a deliberate plan to make the population docile, which I personally find absurd but which keeps arriving from people who are not absurd; second, a claim that our regional hospital is quietly rationing care to hit a budget target, which is an under-evidenced institutional allegation that could simply be true and that I would not want us to flag as a conspiracy theory; and third, a claim that last year's county-wide emergency-alert test was a pretext for standing up a federal surveillance program, which is one I find more plausible than I'd like to admit, so I want to see the procedure tell me something I won't enjoy hearing. Finally, tell me what the procedure cannot do and the cases where it will misfire.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They run a volunteer fact-checking desk at a library and need a decision procedure to evaluate conspiracy theory claims. The key points are: they want a structured method that uses epistemological insights about conspiracy theories without dismissing true institutional wrongdoing. They also want to separate the epistemic evaluation from the strategic decision to respond.

  First, I need to recall the core characteristics of conspiracy theories. The user mentioned specific indicators: disconfirming evidence being reabsorbed, double standards in evidence, assumption of perfect secrecy, and explaining away coincidences. These need to be operationalized into clear questions.

  The user’s tension between treating conspiracy theories as ordinary claims versus a distinct epistemic kind is crucial. The procedure should use structural red flags for triage but still engage with anomalies. That means early steps should filter out claims with strong structural issues, but later steps must address unexplained anomalies seriously.

  I should structure the procedure in phases. Phase 1: Initial Triage to quickly identify non-conspiratorial claims or obvious falsehoods. Phase 2: Structural Red Flags to check the specific indicators. Phase 3: Anomaly Engagement to ensure unexplained issues are considered. Then, Phase 4: Epistemic Judgment to weigh evidence, and finally, Strategic Decision which is separate.

  For each step, I need to define what constitutes a sufficient answer and where the process stops. For example, if a claim has multiple structural red flags, it might be dismissed early. But if it passes, volunteers must engage with anomalies. The judgment call steps should be explicit, like assessing evidence quality.

  The user provided three test cases. The water utility claim likely hits all red flags. The hospital rationing might lack those flags but needs evidence checking. The emergency-alert test could have mixed signals, requiring careful anomaly analysis. Applying the procedure to these will show its effectiveness.

  I also need to address limitations. The procedure can’t access hidden evidence, handle highly technical claims, or resolve values-based decisions. It might misfire on claims with partial truth or where institutional behavior mimics conspiracy. Volunteers’ biases are another risk.

  The deliverable must be a clear, ordered list of questions with decision points. Keeping epistemic and strategic decisions separate is vital. The user emphasized not using the checklist for values questions, so Phase 5 should be distinct and involve library policy.

  Finally, explaining why each step exists helps volunteers understand the rationale, making the procedure more defensible. Transparency about judgment calls builds trust in the process.
answer: |-
  Here is a fact-checking procedure designed for your specific constraints, incorporating structural epistemology of conspiracy theories while preserving space for legitimate institutional critique. It prioritizes defensibility, efficiency, and the separation of epistemic judgment from strategic response.

  **The Conspiracy Theory Evaluation Procedure (CTEP)**

  **Core Principle:** This procedure uses *structural indicators* (red flags) to identify claims warranting heightened skepticism *early*, preventing wasted resources. It then *forces engagement* with genuine anomalies *before* a final epistemic judgment is made. It explicitly separates *whether the claim is likely true* from *whether the library should respond*.

  **Phase 1: Initial Triage & Claim Parsing (5 mins)**
  1.  **Question:** Can the claim be stated clearly and testably? What *specific* event, action, or hidden truth is alleged? Who are the alleged conspirators? What is their alleged motive?
      *   **Sufficient Answer:** A concise statement of the *core factual allegation* (e.g., "Utility is adding chemical X to water supply to cause docility," "Hospital administrators directed ER staff to delay care for uninsured patients starting Month Y to save $Z," "Emergency alert test activated hidden surveillance modules in cell towers").
      *   **Stop/Handoff:** If the claim is too vague ("They're poisoning us!"), incoherent, or purely opinion/ideology. Hand back with guidance: "We need a specific, testable factual claim to research."
  2.  **Question:** Is this *prima facie* an allegation of deliberate, coordinated, concealed action by powerful actors (government, corporation, institution) to achieve a hidden goal?
      *   **Sufficient Answer:** Yes (Proceed to Phase 2). No (Treat as a standard fact-check claim using conventional methods; exit CTEP).
      *   **Rationale:** Filters non-conspiratorial claims (e.g., "Is this mushroom poisonous?", "Did this historical battle happen on this date?").

  **Phase 2: Structural Red Flag Assessment (5 mins)**
  *(Evaluate for presence/absence. 2+ flags = High Skepticism Path, Proceed to Phase 3. 0-1 flags = Lower Skepticism Path, proceed to Phase 3 but focus shifts to evidence strength for the *specific* allegation.)*
  3.  **Question (Imperviousness):** Does the theory *explicitly predict* or *readily incorporate* contradictory evidence as *further proof* of the conspiracy (e.g., "They *want* you to think it's safe," "The denial is part of the cover-up," "That study was funded by them")?
      *   **Indicator:** Absorbing disconfirmation.
      *   **Judgment Call:** Does the mechanism for absorption feel *ad hoc* and unfalsifiable, or is it a specific rebuttal to a specific piece of evidence?
  4.  **Question (Asymmetric Scrutiny):** Does the theory demand an *extraordinarily high standard of proof* to disprove it (e.g., "Prove they *aren't* adding something!") while accepting a *much lower standard* for its own evidence (e.g., anecdotes, ambiguous quotes, circumstantial patterns)?
      *   **Indicator:** Double standard of evidence.
      *   **Judgment Call:** Is the demand for proof from authorities reasonable skepticism given past failures, or is it impossible to meet?
  5.  **Question (Superhuman Secrecy):** Does the alleged conspiracy require *long-term, flawless secrecy* from a *large number* of people (or complex systems) who would have diverse motives and opportunities to leak, with no plausible explanation for why leaks haven't happened or been credible?
      *   **Indicator:** Implausible secrecy/scale.
      *   **Judgment Call:** Estimate the minimum number of necessary co-conspirators. Is the mechanism for control/coercion/silencing plausible and evidenced? (e.g., "Everyone at the utility plant is in on it" vs. "A small team bypassed the main system").
  6.  **Question (Coincidence Intolerance):** Does the theory treat *coincidences, randomness, or unrelated events* as inherently suspicious and requiring explanation *only* by the conspiracy?
      *   **Indicator:** Explaining away coincidence.
      *   **Judgment Call:** Is the coincidence statistically unlikely or genuinely odd, or is it being forced into a pattern?

  **Phase 3: Anomaly Engagement (Mandatory - 5 mins)**
  *(This step *forces* engagement with the theory's core appeal: explaining anomalies.)*
  7.  **Question:** What specific, documented event, inconsistency, or unanswered question does the conspiracy theory claim to explain that the "official" account allegedly ignores or explains poorly?
      *   **Sufficient Answer:** Identify 1-2 core anomalies presented by proponents (e.g., "Unusual water test result on Date X," "Nurse Y's comment on social media," "Presence of federal agency Z personnel during the test").
  8.  **Question:** What is the *best available, credible* explanation for this anomaly *from mainstream sources* (scientific consensus, official reports, reputable journalism, expert analysis)?
      *   **Action:** Spend research time *here*. Find the strongest counter-explanation. If none exists, note that.
      *   **Judgment Call:** Is the mainstream explanation satisfactory (even if imperfect), implausible, or entirely absent? Does the conspiracy explanation *genuinely better* resolve the anomaly with *less complexity*? (Occam's Razor).

  **Phase 4: Epistemic Judgment - Is the Claim Warranted?**
  9.  **Synthesis Question:** Based on the structural flags (Phase 2), the plausibility of required secrecy/scale (Q5), the strength of mainstream anomaly explanations vs. the conspiracy explanation (Phase 3), and the *quality and quantity of direct evidence for the core allegation* found during research:
      *   **Definite NO (Unwarranted):** High structural flags (3-4) AND weak/no direct evidence AND mainstream explanations for anomalies are satisfactory/plausible. OR Core allegation is demonstrably false based on evidence found.
      *   **Uncertain/Insufficient Evidence:** Mixed signals (1-2 flags), OR anomalies lack good mainstream explanations, OR direct evidence is ambiguous/absent but allegation isn't structurally implausible. *Do not dismiss as conspiracy theory.* Flag as "Unverified" or "Lacks Sufficient Evidence."
      *   **Possibly/Probably Warranted (Rare):** Low structural flags (0-1) AND credible, direct evidence (documents, credible whistleblower, data patterns) supports the core allegation, AND mainstream explanations for anomalies are weak/absent. *Treat as serious institutional allegation.*
      *   **Judgment Call:** This is the core synthesis. Volunteers must weigh the factors. The procedure forces consideration of red flags and anomalies, but the final weighting is human judgment. *Emphasize quality of direct evidence for the core claim.*

  **Phase 5: Strategic Decision - Should the Library Respond? (Separate - Values/Policy)**
  *(Hand this decision COMPLETELY to the designated person/team, informed by the Epistemic Judgment, but not determined by it.)*
  *   **Input:** Epistemic Judgment (from Phase 4) + Nature of Claim + Library Policy + Potential Harm (spread vs. ignoring legitimate concern) + Patron Relationship + Resources.
  *   **Output:** Publish Explainer / Send Guidance / Say Nothing.
  *   **Rationale:** A "Possibly Warranted" claim might still be too sensitive for the library to publish on. An "Unwarranted" claim might need a gentle guidance response to a sincere patron. This is where institutional values and risk assessment live. *Do not bake this into the fact-check steps.*

  ---

  **Test Run on Submitted Claims**

  **1. Water Utility Adding Docility Chemical:**
  *   **Phase 1:** Clear allegation: Utility deliberately adding unspecified chemical to cause docility. Proceed.
  *   **Phase 2:**
      *   Q3 (Imperviousness): **YES.** Safety data = cover-up; lack of sick people = proof it's subtle. Classic absorption.
      *   Q4 (Asymmetric Scrutiny): **YES.** "Prove there's *nothing* added!" vs. accepting anecdotes as proof.
      *   Q5 (Superhuman Secrecy): **YES.** Requires secrecy from water plant staff, management, regulators, health officials - massive scale, no credible leaks explained.
      *   Q6 (Coincidence): **YES.** Any behavior interpreted as docile is evidence; random lethargy blamed on water.
      *   **Result:** **4 Flags - High Skepticism Path.**
  *   **Phase 3:**
      *   Q7: Anomaly: "People feel tired/apathetic sometimes." (Vague).
      *   Q8: Mainstream Explanations: Multifactorial - stress, diet, sleep, mental health, societal factors. Well-established. Conspiracy explanation adds enormous complexity (secret chemical program) for a common, well-explained phenomenon.
  *   **Phase 4: Synthesis:** High structural flags. No credible direct evidence for chemical or program. Anomaly (lethargy) has strong mainstream explanations. **Epistemic Judgment: DEFINTE NO - Unwarranted.**
  *   **Phase 5:** Strategic Decision: Say Nothing (likely amplifies) OR send very basic guidance on critical thinking/source evaluation regarding health claims. *Not based on checklist.*

  **2. Hospital Rationing Care for Budget:**
  *   **Phase 1:** Clear allegation: Hospital administrators directed staff to delay care for uninsured to hit budget targets. Proceed.
  *   **Phase 2:**
      *   Q3 (Imperviousness): **NO.** (Assuming claim isn't structured this way. Denials could be lies, but not automatically proof).
      *   Q4 (Asymmetric Scrutiny): **POTENTIALLY.** Might demand internal memos to disprove, but could also point to wait-time data, whistleblowers. Needs monitoring.
      *   Q5 (Superhuman Secrecy): **NO/MINIMAL.** Requires secrecy from administrators and complicit frontline staff. Plausible number. Fear of job loss/retaliation is a credible silencing mechanism. Leaks *do* happen in healthcare.
      *   Q6 (Coincidence): **NO.** Allegation points to specific policy/order, not random events.
      *   **Result:** **0-1 Flags (Scrutiny Q4 borderline) - Lower Skepticism Path. Focus on evidence.**
  *   **Phase 3:**
      *   Q7: Anomaly: Increased wait times/disparities for uninsured? Budget reports showing sudden savings?
      *   Q8: Mainstream Explanations: Underfunding, staff shortages, high demand, complex patient needs could explain wait times. Budget savings could be from other efficiencies. *Check for evidence of explicit directives.*
  *   **Phase 4: Synthesis:** Low structural flags. Crucial: Research focuses on *evidence for the specific allegation* - whistleblower reports? Investigations? Data anomalies? Policy documents? Internal comms? In 15 mins: Check local news for investigations, hospital board minutes (if online), reputable health policy org reports on that hospital. **Epistemic Judgment:** Likely **UNCERTAIN/INSUFFICIENT EVIDENCE** based on quick search (unless concrete evidence found). *Not dismissed as conspiracy.*
  *   **Phase 5:** Strategic Decision: Send Guidance (e.g., "Here's how to file a complaint with the health department," "Here are reports on hospital funding challenges"). Avoid publishing an explainer without concrete proof.

  **3. Emergency Alert Test as Surveillance Pretext:**
  *   **Phase 1:** Clear allegation: Recent county alert test was used to activate hidden federal surveillance modules in cell towers. Proceed.
  *   **Phase 2:**
      *   Q3 (Imperviousness): **YES.** Official purpose is "just a cover." Denials are expected.
      *   Q4 (Asymmetric Scrutiny): **YES.** Demands proof activation *didn't* happen (impossible) vs. accepting technical specs or coincidences as proof.
      *   Q5 (Superhuman Secrecy): **MIXED.** Requires secrecy from federal tech teams/cell carriers. Possible scale, but collaboration between gov/corp entities on surveillance is documented (e.g., Snowden). Not *inherently* implausible secrecy.
      *   Q6 (Coincidence): **YES.** Presence of federal contractors, unusual signal readings (if alleged) automatically interpreted as surveillance proof.
      *   **Result:** **3 Flags (Q3, Q4, Q6) - High Skepticism Path. Q5 less absolute.**
  *   **Phase 3:**
      *   Q7: Anomaly: Presence of federal agencies/contractors during test? Unusual technical data captured?
      *   Q8: Mainstream Explanations: Feds/carriers legitimately involved in *developing/testing* the alert system. Technical glitches happen. Classified aspects *might* exist for system security, not mass surveillance. Conspiracy explanation (mass secret activation) is complex vs. simpler explanations (test had bugs, contractors were doing their job).
  *   **Phase 4: Synthesis:** High structural flags (esp. Imperviousness, Asymmetry). No credible *direct* evidence for hidden modules or activation. Anomalies (fed presence, glitches) have plausible mainstream explanations. Q5 (secrecy) is the weakest flag, but doesn't outweigh the others and lack of evidence. **Epistemic Judgment: DEFINTE NO - Unwarranted.** (The *potential* for surveillance programs exists, but *this specific claim* about the *alert test* isn't warranted).
  *   **Phase 5:** Strategic Decision: Say Nothing (engaging validates) OR send guidance on evaluating sources about government technology. *The procedure correctly identifies this as unwarranted despite your personal unease.*

  ---

  **What the CTEP Cannot Do & Where It Will Misfire**

  1.  **Access Hidden Truths:** It cannot uncover genuinely concealed evidence (smoking-gun documents, deep whistleblowers). It assesses claims based on *available* evidence and structural plausibility. **Misfire:** A true, well-hidden conspiracy will likely be judged "Uncertain/Insufficient Evidence" or even "Unwarranted" if strong structural flags are present and no leaks occur.
  2.  **Resolve Deep Technical/Scientific Disputes:** With only 15 mins and no specialized access, complex scientific or technical claims (e.g., specific water chemistry, cell tower firmware) can't be definitively settled. **Misfire:** May default to mainstream consensus or "Insufficient Evidence" on legitimately complex issues.
  3.  **Perfectly Distinguish "Cranks" from Sincere Concern:** The initial triage might struggle with poorly articulated but potentially valid concerns from vulnerable individuals. **Misfire:** A valid concern poorly expressed might be triaged out at Phase 1.
  4.  **Handle "Partial Truth" Conspiracies:** Some theories embed a kernel of truth (e.g., real corporate misconduct) within a larger false structure. **Misfire:** Might dismiss the entire claim due to structural flags around the *false* aspects, missing the real underlying issue (or vice-versa, validating the false parts because of the true kernel).
  5.  **Account for Extreme Institutional Dysfunction:** Legitimate institutional actions can sometimes *appear* conspiratorial due to incompetence, perverse incentives, or fragmented systems, without actual coordinated concealment. **Misfire:** Might mislabel severe institutional failure as a "conspiracy theory" (Structure flags Q4/Q5 might be triggered) or fail to recognize genuine coordination masked as dysfunction.
  6.  **Eliminate Volunteer Bias:** Judgment calls (especially Q3-Q6, Q8, Synthesis) are vulnerable to the volunteer's own biases, knowledge, and fatigue. **Misfire:** A biased volunteer might downplay flags on a theory they find plausible or amplify them on one they dislike.
  7.  **Predict Future Evidence:** A claim judged "Unwarranted" today might later be proven true by new evidence. The procedure is a snapshot assessment.
  8.  **Solve the Values Question:** It explicitly *does not* tell you whether to respond, only whether the claim is likely true based on available evidence and structure.

  **Key Strength:** The CTEP forces explicit consideration of the *structural mechanisms* that make conspiracy theories epistemically problematic *and* the *anomalies* they exploit, creating a more defensible and nuanced process than simple source/date checking or blanket dismissal. It protects resources by triaging high-flag claims quickly while preserving space for legitimate, if under-evidenced, institutional criticism. By separating epistemic judgment from strategic response, it maintains ethical clarity for the library.
