prompt: |-
  I am a novelist, about a third of the way into a book whose spine is a citizens' assembly convened to settle a handful of constitutional questions that are logically tangled up with one another, and I have reached the point where I need the machinery to be honest rather than merely atmospheric. Before I decide what my assembly actually does on the page, I want the specification rather than any particular procedure. Please act as an expert in social choice theory and formal epistemology; before you write anything, spend a few sentences brainstorming the candidate requirements, throwing out the ones that turn out to be merely the preferences of one camp, and only then commit to a list. What I want is the desiderata that any adequate theory of collective judgment must meet — what such a theory has to deliver, which cases it must get right, which distinctions it must respect, and which formal results it cannot contradict — with the motivating case or consideration behind each requirement. No citations, no reading lists, no bibliography; I want the reasoning, not the scholarship, and a table is welcome if it keeps the list legible. Please write in American English.

  The cases are where I need the most care, because a theory that handles only the textbook example is no use to me. It must get right the familiar three-member court in which a majority affirms each of two premises and a majority denies the conclusion those premises jointly entail, and it must tell me whether the court's verdict is the premise-based one, the conclusion-based one, or something else — and on what ground. It must also handle a case I have invented for the book, in which the assembly votes on whether to add a further proposition to its own agenda, knowing that the answer changes which majority is decisive; the procedure's output here is partly a fact about the procedure itself, and I want to know whether that is a genuine constraint on a theory or a mere artifact of majority rule. It should say what happens when a majority endorses each item in a package of positions that everyone associates with one option, while a majority also prefers the rival option once the package is presented as a single choice; when the "committee" is itself composed of committees whose internal verdicts are the inputs; when members abstain, report degrees of confidence, or sincerely say they do not know; when they disagree about which propositions are premises and which are conclusions, so that "premise-based" and "conclusion-based" are not even well defined for the group; and when members vote strategically rather than sincerely, so that the procedure's outputs under sincere and strategic behavior diverge.

  Then I want the boundary work, which is the part I most want to see. Say which requirements are non-negotiable and which are the commitments of a particular camp — collective consistency versus collective completeness, anonymity, neutrality, independence, responsiveness to individual opinion, deductive closure, immunity to agenda manipulation, strategy-proofness, the demand that the collective judgment be a function of the individual judgments rather than of something else — and name the pairs or triples you suspect cannot be jointly satisfied, explaining why. There is an impossibility result in this area holding that universal domain, collective consistency and completeness, anonymity, and systematicity (independence plus neutrality) cannot all hold at once, and I want to know exactly which of those you would surrender first and what surrendering it costs; likewise, tell me what to make of the fact that majority voting over a connected agenda can make the outcome depend on the order in which propositions are put. Tell me which single requirement does the most to exclude candidate theories. If you can, close with a few sentences each on how a premise-based approach, a conclusion-based approach, and a consistency-seeking approach that minimizes distance from the individual judgments fare against the list — but keep the weight on the criteria, since the criteria are the deliverable and the scoring is only a sanity check. If any of my cases turn out not to be genuine constraints on a theory, say so plainly and tell me why.
reasoning: |-
  We are going to approach this problem by first brainstorming candidate requirements for a theory of collective judgment. We then filter out those that are merely preferences of one camp, and commit to a list of desiderata that any adequate theory must meet. We will include motivating cases and considerations for each requirement. Then we will do boundary work: identify which requirements are non-negotiable, which are camp-specific, and discuss trade-offs and impossibility results. Finally, we will briefly evaluate three approaches (premise-based, conclusion-based, and consistency-seeking) against the list.

  ### Brainstorming Candidate Requirements
  We start by listing potential requirements that have been discussed in social choice and judgment aggregation. We then critically assess each to see if it is a genuine constraint or just a preference.

  1. **Universal Domain**: The procedure should work for any possible profile of individual judgments (i.e., any assignment of truth values to the propositions by the individuals). *Motivation*: We don't want to restrict the types of opinions that can be expressed.

  2. **Collective Rationality (Consistency and Completeness)**: The collective judgment set should be consistent (no contradictions) and complete (every proposition on the agenda is decided). *Motivation*: We want the group's decisions to be logically coherent and to settle every issue.

  3. **Anonymity**: The outcome should depend only on the number of individuals holding each view, not on who holds them. *Motivation*: Equal treatment of individuals.

  4. **Neutrality**: The procedure should treat all propositions symmetrically. If two propositions have the same pattern of support, they should be treated the same. *Motivation*: Fairness to the issues; no bias.

  5. **Independence**: The collective judgment on a proposition should depend only on the individual judgments on that proposition. *Motivation*: Avoid irrelevant influences (like judgments on other propositions).

  6. **Unanimity**: If every individual agrees on a proposition, the collective judgment should reflect that. *Motivation*: Respect for unanimous agreement.

  7. **Majority Preservation**: If a majority supports a proposition, it should be accepted by the collective. *Motivation*: Democratic principle.

  8. **Deductive Closure**: If the collective accepts a set of premises and those premises entail a conclusion, then the collective should also accept the conclusion. *Motivation*: Logical integrity.

  9. **Immunity to Agenda Manipulation**: The outcome should not depend on the order in which propositions are considered or on which propositions are put to a vote. *Motivation*: Prevent strategic control of the agenda.

  10. **Strategy-Proofness**: Individuals should not be able to manipulate the outcome by misrepresenting their judgments. *Motivation*: Honest participation.

  11. **Responsiveness to Individual Opinion**: The collective judgment should be a function of the individual judgments (and not, say, of external factors). *Motivation*: The group's view should be based on its members.

  12. **Respect for Abstentions and Degrees of Confidence**: The procedure should be able to handle abstentions, probabilistic judgments, or expressions of uncertainty. *Motivation*: Real-world complexity.

  13. **Compositionality**: When the committee is composed of subcommittees, the collective judgment should be a function of the subcommittees' judgments. *Motivation*: Scalability and federal structures.

  Now, we filter. Some of these are more about specific democratic ideals (e.g., Majority Preservation) and might be rejected by some camps. Others are more fundamental. We want requirements that are widely accepted as necessary for a coherent aggregation.

  We remove:
  - **Majority Preservation**: While democratic, it is not always compatible with consistency (as in the doctrinal paradox). Some theories (like premise-based) may override majority on some propositions for consistency.
  - **Neutrality**: Some theories (like premise-based) intentionally treat premises and conclusions differently, so neutrality is not always required.

  But note: We must be careful. We want the core requirements that any theory must deliver, not the ones that are camp-specific.

  After filtering, we commit to the following list of desiderata. We include only those that are essential for the theory to be considered a valid collective judgment procedure, and we note that some are non-negotiable while others might have to be relaxed in light of impossibility results.

  ### Committed List of Desiderata

  | Requirement | Motivating Case/Consideration |
  |------------|-------------------------------|
  | **Universal Domain** | We cannot predict in advance what opinions people will have. The procedure must work even for profiles that are logically inconsistent or highly divided. |
  | **Collective Consistency** | The doctrinal paradox: A court with three judges voting on two premises and a conclusion. Suppose the case: P, Q, and (P∧Q)→R. Judges 1: P, Q, R; Judge 2: P, not Q, not R; Judge 3: not P, Q, not R. Then, majority on P (yes: 1,2), majority on Q (yes:1,3), but majority on R (no:2,3). If we force consistency, we cannot accept both P and Q and reject R. The theory must avoid such contradictions. |
  | **Completeness** | The assembly must decide every issue on the agenda. Leaving propositions undecided would be a failure to settle the constitutional questions. |
  | **Unanimity** | If everyone agrees, the collective must too. Without this, the procedure would be perverse. |
  | **Anonymity** | The identity of the voters should not matter. This is a basic fairness requirement. |
  | **Independence** | Consider the case where the assembly votes on adding a proposition to the agenda. If the collective judgment on a proposition depends on judgments on others, then the decision to add a new proposition might change the outcome on existing ones, which could be manipulable. However, we note that independence is often relaxed in practice. |
  | **Responsiveness to Individual Opinion** | The collective judgment should be determined by the individual judgments. Without this, it would not be a judgment aggregation procedure. |
  | **Immunity to Agenda Manipulation** | In the case where adding a proposition changes which majority is decisive, we want to avoid that the outcome can be changed by the order of voting or by adding/removing propositions. This is a form of path-independence. |
  | **Strategy-Proofness** | If members can get a better outcome by lying, they will, and the outcome may not reflect true judgments. But note: this is very strong and often unattainable. |
  | **Handling Abstentions and Uncertainty** | In real assemblies, members may abstain or express uncertainty. The procedure must accommodate this without breaking down. |
  | **Compositionality** | When the assembly is composed of committees, we need a way to aggregate the judgments of the committees to form the overall judgment. |

  Note: We have included both consistency and completeness, but we know from the impossibility result (like the one by List and Pettit) that we may have to relax one of the requirements.

  ### Boundary Work: Non-Negotiables and Trade-offs

  **Non-Negotiable Requirements**:
  - **Universal Domain**: Without it, the procedure is not general.
  - **Collective Consistency**: Without consistency, the group's decisions are self-contradictory and thus irrational.
  - **Unanimity**: This is a minimal requirement of respect for agreement.
  - **Responsiveness to Individual Opinion**: Otherwise, it's not aggregation.

  **Camp-Specific Requirements**:
  - **Completeness**: Some theories (like the consistency-seeking approach) may leave some propositions undecided to avoid inconsistency. So completeness might be sacrificed.
  - **Neutrality**: Premise-based approaches violate neutrality by giving priority to premises.
  - **Independence**: Premise-based and conclusion-based approaches violate independence because the judgment on a conclusion may depend on the judgments on the premises.
  - **Majority Preservation**: This is a democratic ideal but not always compatible with consistency.

  **Impossibility Results**: 
  The known impossibility result (List and Pettit, 2002) states that for an agenda with certain logical connections, no aggregation rule can simultaneously satisfy:
  - Universal Domain
  - Collective Rationality (consistency and completeness)
  - Anonymity
  - Systematicity (independence + neutrality)

  Therefore, we must surrender one of these. The most common surrenders are:
  1. **Surrender Systematicity**: This means we drop independence and/or neutrality. 
     - *Cost*: Without independence, the collective judgment on a proposition may depend on judgments on other propositions, which can lead to agenda manipulation. Without neutrality, the procedure may treat propositions differently (e.g., premises vs. conclusions) which might be acceptable in some contexts but not in others.
  2. **Surrender Completeness**: Then we allow the collective judgment to be incomplete (i.e., not decide every proposition). 
     - *Cost*: The assembly fails to settle some issues, which might be unacceptable for constitutional questions.
  3. **Surrender Anonymity**: This would allow for weighted voting (like a chairperson with tie-breaking power). 
     - *Cost*: Violates equality of members.

  **Which to surrender first?** 
  In many practical settings, systematicity is surrendered. This allows for premise-based or sequential voting. The cost is that the outcome may depend on the agenda (the order of voting) and the procedure may not be neutral. This is a serious cost because it opens the door to manipulation.

  **Agenda Manipulation**:
  The fact that majority voting over a connected agenda can make the outcome depend on the order is a direct result of surrendering independence. This is a genuine constraint: any procedure that violates independence (and hence systematicity) is vulnerable to agenda manipulation. But if we require independence, we run into the impossibility. So we must choose: either accept the possibility of manipulation or accept inconsistency or incompleteness.

  **The Requirement that Does the Most to Exclude Theories**:
  **Collective Consistency** is the requirement that does the most to exclude theories. Without it, majority voting would be fine. But with it, we must abandon one of the other requirements.

  ### The Cases and Whether They Are Genuine Constraints

  1. **The three-member court (doctrinal paradox)**: This is a genuine constraint. Any theory must handle it by either:
     - Producing a consistent set (e.g., by premise-based: accept P and Q, then force R; or conclusion-based: reject R and then either reject P or Q; or by a distance-based method that minimizes inconsistencies).
     - The ground: consistency is non-negotiable.

  2. **Adding a proposition to the agenda**: This is a genuine constraint because it tests immunity to agenda manipulation. The theory must specify whether the outcome can be changed by adding a proposition. This is not an artifact of majority rule alone; it can occur in any non-independent procedure.

  3. **Package of positions vs. single choice**: This is the "discursive dilemma" and is a genuine constraint. A theory must decide whether to go by the majority on each item or by the majority on the package. This tests consistency and independence.

  4. **Committee of committees**: This is a genuine constraint (compositionality) and tests scalability.

  5. **Abstentions, degrees of confidence, uncertainty**: This is a genuine constraint for realism.

  6. **Disagreement about logical structure**: This is a genuine constraint. The theory must work even when the group does not agree on what is a premise and what is a conclusion. This tests neutrality and independence.

  7. **Strategic voting**: This is a genuine constraint because it tests strategy-proofness.

  ### Evaluation of Three Approaches

  1. **Premise-Based Approach**:
     - *Idea*: Vote only on premises, then deduce conclusions.
     - *Against the list*: 
       - Satisfies consistency and completeness (if the agenda is set properly).
       - Violates independence (conclusion is not voted on independently) and neutrality (premises are treated differently from conclusions).
       - May violate majority preservation on conclusions (as in the doctrinal paradox: majority rejects R, but if R is a conclusion, it is accepted because premises are accepted).
       - Vulnerable to agenda manipulation (which propositions are chosen as premises?).
       - Not strategy-proof: voters may misrepresent their judgments on premises to manipulate the conclusion.
       - Handles the doctrinal paradox by accepting the premises and thus the conclusion (so the verdict is the premise-based one).

  2. **Conclusion-Based Approach**:
     - *Idea*: Vote only on conclusions, and leave premises undecided.
     - *Against the list*:
       - Satisfies consistency (only conclusions are decided) but sacrifices completeness (premises are not decided).
       - Violates independence if the conclusions are logically connected (but by avoiding premises, it avoids some connections).
       - May violate majority preservation on premises (if they were voted on, but they are not).
       - In the doctrinal paradox, the verdict is the conclusion-based one (reject R by majority) and the premises are not decided.
       - Less vulnerable to agenda manipulation on the premises, but the choice of which conclusions to vote on might be manipulated.
       - Not strategy-proof: voters may misrepresent their preferred conclusion.

  3. **Consistency-Seeking (Distance-Based) Approach**:
     - *Idea*: Find the consistent judgment set that minimizes the total distance to the individual judgments (e.g., Hamming distance).
     - *Against the list*:
       - Satisfies consistency but may sacrifice completeness (if the minimization leads to leaving some propositions undecided) or may enforce completeness by requiring a full set.
       - Violates independence (because the collective judgment on one proposition depends on the judgments on others to achieve consistency).
       - May violate neutrality and anonymity only if the distance measure does (but typically it is anonymous and neutral).
       - In the doctrinal paradox, it might choose the judgment set that flips the fewest votes. For example, in the court case, it might flip the vote on R (so accept R) and leave the premises as voted (P and Q accepted) because that requires flipping only one vote (if we flip R from no to yes, then Judge 2 and 3 are overruled on R, but only one flip is needed). Alternatively, it might flip one premise (say P) and then reject R, which would require flipping two votes (Judge 1 on P and R, but that's two flips). So it would choose the first. Thus, the verdict would be to accept R.
       - Vulnerable to agenda manipulation because of non-independence.
       - Not strategy-proof.

  ### Final Note
  The cases you describe are genuine constraints and must be addressed by any theory. The impossibility results force us to make trade-offs, and the choice of which requirement to relax will depend on the priorities of the assembly. In constitutional settings, consistency and immunity to manipulation are often paramount, leading to complex procedures that may relax independence and neutrality.

  This framework should help you design the machinery for your novel. Remember that no procedure satisfies all desiderata, so the choice of procedure will reflect the values of the assembly's designers.
answer: |-
  Below is a distilled set of **desiderata for any theory of collective judgment**, derived from core principles in social choice theory and formal epistemology. I first brainstormed candidate requirements, filtered out those reflecting specific ideological camps (e.g., strict majoritarianism or procedural libertarianism), and retained only those grounded in logical necessity, minimal rationality, or unavoidable real-world constraints. The list prioritizes **what a theory must deliver** to be coherent, defensible, and practically viable. I then address your cases, boundary work, and trade-offs.

  ---

  ### **Desiderata for Collective Judgment Theories**
  | Requirement | Motivating Case/Consideration | Non-Negotiable? |
  |-------------|-------------------------------|-----------------|
  | **Universal Domain** | The procedure must handle **any logically possible input** of individual judgments (e.g., even if 90% affirm P, 90% affirm Q, but 90% deny P∧Q). Without this, the theory fails for real-world disagreements. | Yes |
  | **Collective Consistency** | The **three-member court paradox**: If Judge A affirms P, Q, R; Judge B affirms P, denies Q, R; Judge C denies P, affirms Q, R—a majority affirms P, affirms Q, but denies R (where R=P∧Q). The theory **must output a consistent set** (e.g., reject R while rejecting P or Q, or accept R). Allowing contradictions (e.g., affirming P, Q, denying R) makes the verdict irrational. | Yes |
  | **Responsiveness** | Collective judgments must be a **function of individual judgments alone** (not external facts, randomness, or authority). Otherwise, it fails as a democratic tool. | Yes |
  | **Unanimity Preservation** | If all members agree on a proposition (e.g., "Freedom of speech is protected"), the collective must reflect this. Violating this undermines legitimacy. | Yes |
  | **Immunity to Agenda Manipulation** | Your case: Adding a proposition (e.g., "Should Article X be debated?") changes which majority is decisive on subsequent votes. The outcome **must not depend on agenda tricks** (e.g., adding/removing redundant propositions). This exposes whether the theory is robust or brittle. | Conditional |
  | **Handling Abstentions/Uncertainty** | Members may abstain, report confidence scores (e.g., "60% sure"), or refuse to vote. The theory must **degrade gracefully** without forcing arbitrary decisions or ignoring uncertainty. | Yes |
  | **Compositionality** | When the assembly is a **committee of committees** (e.g., subpanels vote first), the theory must aggregate subgroup outputs coherently. Hierarchical structures are unavoidable in large bodies. | Yes |

  ---

  ### **Cases and Their Status as Constraints**
  1. **Three-member court paradox** (P affirmed, Q affirmed, R denied):  
     - **Genuine constraint** – Any theory must resolve this consistently. Output depends on the approach:  
       - *Premise-based*: Affirms P and Q, **forces R true** (even if majority denies it).  
       - *Conclusion-based*: Denies R, **leaves P/Q undecided or inconsistent**.  
       - *Distance-minimizing*: Minimizes "flips" to achieve consistency (e.g., flips R to true, overriding the majority).  
     - **Ground**: Consistency is non-negotiable; the trade-off is between overriding majorities or leaving propositions undecided.

  2. **Adding a proposition to the agenda**:  
     - **Genuine constraint** – Tests immunity to manipulation. If adding a proposition changes outcomes on existing issues, the theory fails unless it explicitly treats self-referential rules as special cases (e.g., requiring supermajorities for agenda changes).

  3. **Package vs. holistic choice**:  
     - **Genuine constraint** – Suppose 60% support each policy in a platform (A1, A2, A3), but 60% reject the platform when bundled. The theory must specify whether to respect item-wise or holistic majorities. This tests **independence of irrelevant alternatives (IIA)**.

  4. **Committee of committees**:  
     - **Genuine constraint** – Compositionality ensures the theory scales structurally.

  5. **Disagreement on logical structure**:  
     - **Genuine constraint** – If members dispute dependencies (e.g., "Is P a premise for Q?"), the theory must not presuppose a shared logic. **Premise/conclusion-based approaches fail here**; distance-minimizing or sequential voting may work.

  6. **Strategic voting**:  
     - **Genuine constraint** – Sincere vs. strategic inputs must be addressed (e.g., via strategy-proofness or equilibrium analysis). Ignoring this invites manipulation.

  ---

  ### **Boundary Work: Trade-offs and Impossibilities**
  #### **Non-Negotiable vs. Camp-Specific Requirements**
  | **Requirement** | **Status** | **Reason** |
  |------------------|------------|------------|
  | Universal Domain | Non-negotiable | Without it, the theory is not general. |
  | Collective Consistency | Non-negotiable | Contradictory judgments are useless. |
  | Responsiveness | Non-negotiable | Otherwise, not a judgment aggregation. |
  | Unanimity | Non-negotiable | Violation implies systematic mistranslation. |
  | **Anonymity** | Camp-specific | Prioritizes equality, but weighted votes (e.g., experts) may reject it. |
  | **Neutrality** | Camp-specific | Treating all propositions equally conflicts with premise-based approaches. |
  | **Independence** | Camp-specific | Judging propositions separately (e.g., majority rule) causes inconsistencies. |
  | **Completeness** | Camp-specific | Forcing decisions on all propositions risks inconsistency. |
  | **Strategy-Proofness** | Camp-specific | Desirable but rarely achievable without sacrificing other goods. |
  | **Deductive Closure** | Camp-specific | Requires collective logic to mirror individual logic (often impossible). |

  #### **Impossibilities and Trade-offs**
  - **Key Impossibility Result**: **Universal Domain + Consistency + Completeness + Anonymity + Systematicity (Independence + Neutrality)** cannot coexist.  
    - **First sacrifice**: **Systematicity**. Drop Independence and/or Neutrality.  
      - **Cost**: Outcomes may depend on irrelevant alternatives (IIA violations) or agenda order. Premise-based approaches do this.  
    - **Alternative sacrifice**: **Completeness**. Allow undecided propositions.  
      - **Cost**: Leaves issues unresolved (unacceptable for constitutional questions).  
    - **Why not Anonymity?** Sacrificing it (e.g., allowing a tie-breaking chair) is less damaging than inconsistency.  

  - **Agenda Manipulation**: If the theory drops **Independence**, outcomes can depend on voting order (e.g., passing P before Q enables R, but failing P blocks R). This is **not an artifact of majority rule**—it’s a direct cost of prioritizing consistency.  

  - **Most Exclusionary Requirement**: **Collective Consistency**. This alone forces the surrender of majority rule on connected agendas and excludes "naive" approaches.  

  ---

  ### **Approach Evaluation (Sanity Check)**
  1. **Premise-Based Approach** (Vote on premises, derive conclusions):  
     - **Meets**: Consistency, Universal Domain, handles logical tangles.  
     - **Fails**: Independence (conclusions depend on premises), Neutrality (premises privileged), Immunity to Manipulation (agenda order matters).  
     - **Verdict in court case**: Forces R true (premise-based).  

  2. **Conclusion-Based Approach** (Vote only on conclusions, ignore premises):  
     - **Meets**: Neutrality, Independence.  
     - **Fails**: Consistency (premises may contradict), Completeness (premises undecided), Responsiveness (ignores premise judgments).  
     - **Verdict in court case**: Denies R (conclusion-based).  

  3. **Distance-Minimizing Approach** (Find consistent set closest to individual judgments):  
     - **Meets**: Consistency, Universal Domain, handles uncertainty (via distance weights).  
     - **Fails**: Independence (judgments are interdependent), Neutrality (depends on metric), Strategy-proofness (vulnerable to strategic misreporting).  
     - **Verdict in court case**: Depends on distance metric; often flips the fewest votes (e.g., affirms R to override denial).  

  ---

  ### **Conclusion**
  Your cases are **genuine constraints**—each tests a different fracture point in judgment aggregation (e.g., agenda manipulation probes Independence, strategic voting probes incentive compatibility). The core tension is between **consistency** and **majority sovereignty**: no theory satisfies both in all cases. To design your assembly, decide which costs are acceptable:  
  - Prioritize **consistency**? Surrender Independence/Neutrality (e.g., premise-based).  
  - Prioritize **majority rule**? Surrender Consistency (e.g., conclusion-based).  
  - Seek a **middle path**? Surrender Completeness or Anonymity (e.g., distance-minimizing).  

  The desiderata table provides the "specification" for your machinery; the trade-offs reveal its inevitable flaws.
