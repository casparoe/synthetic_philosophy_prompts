  Okay, the user is a municipal historic-preservation officer dealing with a specific commemorative practice. They've noticed a pattern where controversial statues or street signs are left in place, but an official plaque is added that frames the debate around the figure as the new focus of commemoration. They want to know if there's a term for this strategy that falls between removal and simple contextualization.

  First, I need to recall relevant concepts in commemorative theory. Iconoclasm and damnatio memoriae involve removal or destruction, which isn't what's happening here. Simple contextualization adds neutral facts without centering the controversy. Counter-monuments challenge traditional forms, but this case is different. Palimpsestic layering and polyvocal commemoration come close but don't quite capture the active reframing of the dispute as the commemorative subject.

  The key elements here are: preservation of the original object, official installation of interpretive material, centering the controversy itself as the new focus, and a claim of honoring the democratic process. This seems like a distinct strategy. I should check if there's an existing term. Terms like "dialogic commemoration" or "contested heritage interpretation" exist but are broader. The specific move of making the dispute the official subject isn't covered by these.

  The user needs a precise term for their work. Since existing terms don't fit perfectly, coining a new one makes sense. "Disputatio Monumentum" combines Latin for debate and monument, emphasizing the formalization of dispute. It's important to define it clearly, distinguishing it from alternatives. Boundary cases will help, like when added context isn't official or when the dispute isn't the central focus.

  The user's deeper need might be to legitimize this approach or communicate it effectively to stakeholders. They might also seek validation that this is a recognized strategy, helping them justify decisions. Providing a well-defined term with examples can give them a tool for policy discussions and documentation.
answer: |-
  Based on your precise description and my analysis of commemorative theory, **there is no single, universally established term** for this *specific* maneuver. However, it represents a distinct and increasingly common strategy that warrants its own conceptual framing. Let's carve it out:

  1.  **Brainstorming Nearest Concepts:**
      *   **Polyvocal Commemoration:** Acknowledging multiple perspectives at a site. *Close, but broader.* Your case is a *specific technique* within polyvocality, focusing *explicitly* on the *controversy itself* as the primary subject.
      *   **Dialogic Commemoration:** Emphasizing ongoing conversation and debate. *Very close.* Your case is a *material instantiation* of dialogic commemoration, concretizing the "dialogue" as an official interpretive layer *alongside* the contested object.
      *   **Palimpsestic Layering:** Adding new meanings over time without erasing the old. *Relevant.* The new plaque/sign is a deliberate, official layer altering the reading of the original.
      *   **Counter-Monument / Anti-Monument:** Artworks deliberately challenging traditional monument forms (e.g., disappearing, inviting interaction, eschewing permanence). *Related in spirit (critique), but distinct in form.* Your case isn't usually a new artwork; it's an official *interpretive text* attached to an *existing*, traditional monument, retaining its physical form.
      *   **Interpretive Contextualization:** Adding historical information to provide background. *The base technique.* Your case is a *specific type* of contextualization where the *context provided is predominantly the history and nature of the controversy itself*, becoming the primary message.
      *   **Ambivalent Heritage / Difficult Heritage:** Recognizing sites associated with conflict, suffering, or contested values. *Describes the nature of the site,* not the specific *management technique* you're seeing.
      *   **Administrative Stewardship of Contested Memory:** A broad descriptor of the official role, not the specific tactic.

  2.  **The Defined Concept & Coined Term:**
      Based on your description, the core move is: **The official preservation of a contested commemorative object alongside the deliberate installation of interpretive material that explicitly frames the *ongoing dispute about that object* as the *primary subject* of commemoration at the site, effectively reframing its meaning and purpose.**

      **Coined Term: Disputatio Monumentum (or Disputatio Commemoratio)**

      *   **Etymology:** Latin "Disputatio" (debate, dispute, discussion) + "Monumentum" (monument, memorial) or "Commemoratio" (commemoration, remembrance). It captures the formalization ("monumentum") or the act ("commemoratio") of the dispute itself.
      *   **Precise Definition:** **Disputatio Monumentum** is a commemorative strategy employed by official authorities wherein:
          1.  A physically intact but symbolically contested commemorative object (statue, plaque, named site) is deliberately preserved *in situ*.
          2.  An officially sanctioned interpretive element (plaque, panel, supplementary sign) is permanently installed adjacent to or integrated with the original object.
          3.  The *primary function* of this interpretive element is to document, summarize, and present the *arguments for and against* the original commemoration and/or the figure/event it represents.
          4.  This presentation explicitly positions the *history and persistence of the dispute itself* as the *new, official subject* being commemorated or memorialized at the site.
          5.  The resulting ensemble is framed by authorities as representing a commitment to "honoring the conversation," "memorializing the debate," or "reflecting our complex history," rather than uncritically endorsing the original subject.

  3.  **Distinguishing from Nearest Alternatives:**
      *   **vs. Simple Contextualization:** Adding birth/death dates, basic historical facts, or even mentioning "controversial views" is contextualization. **Disputatio Monumentum** occurs when the *controversy itself* becomes the *central narrative* of the added interpretation, overshadowing or reframing the original commemorative intent. The dispute *is* the commemoration.
      *   **vs. Polyvocal Commemoration:** Polyvocality is the general principle. **Disputatio Monumentum** is a specific *implementation tactic* for achieving polyvocality in contested sites, characterized by preserving the original object and formally monumentalizing the dispute.
      *   **vs. Dialogic Commemoration:** Dialogic commemoration is the philosophy. **Disputatio Monumentum** is a concrete *material practice* realizing that philosophy by physically embedding the "dialogue" (represented as opposing arguments) into the site's official presentation.
      *   **vs. Counter-Monument:** Counter-monuments actively reject traditional monumental forms (e.g., a sunken void instead of a plinth). **Disputatio Monumentum** *retains* the traditional monument form but *subverts* its meaning through attached official text reframing the site as being *about* the dispute. It's parasitic on the original form.
      *   **vs. Removal (Iconoclasm/Damnatio Memoriae) or Replacement:** The original object remains physically present, distinguishing it fundamentally from erasure or substitution.

  4.  **Boundary Cases: Clarifying What Is and Isn't Disputatio Monumentum:**
      *   **IS Disputatio Monumentum:**
          *   A Confederate statue remains; an official city plaque beside it details the arguments for its preservation (heritage, artistry) and removal (racism, oppression), concluding "This site now commemorates the ongoing community dialogue about our shared history."
          *   A street named after a colonizer retains its sign; a smaller, official plaque below states: "Street Name: Controversial Legacy. While named for [Name], his role in [Harmful Event] is contested. This sign acknowledges the debate surrounding historical recognition in our city."
          *   A founder's statue stays; an official panel lists "Arguments Honoring [Name]: Founder, Benefactor" and "Arguments Criticizing [Name]: Slave Owner, Dispossessor," with a header: "Commemorating the Complexities of Our Past: The Debate Around [Name]."
      *   **IS NOT Disputatio Monumentum (But Might Be Confused):**
          *   **Neutral Context:** A plaque added to a statue simply stating: "[Name] (1810-1889). Industrialist and Philanthropist. Owned factories where labor disputes occurred." (Mentions conflict but doesn't frame the *dispute about the statue* as the commemorated subject).
          *   **Unofficial Addition:** Activists place a temporary protest sign or graffiti challenging a statue. (Not official, not permanent interpretive element).
          *   **Removal with New Commemoration:** The statue is removed and replaced by a new monument *to the victims* or *to the struggle for justice*. (Original object gone, new subject commemorated).
          *   **Museum Relocation:** The statue is moved to a museum with a curator's label explaining the controversy. (Object removed from original public context; interpretation is museological, not framing the site itself as commemorating the dispute).
          *   **Simple Renaming:** The street sign is replaced entirely with a new name. (Original commemorative act erased).
          *   **Apology/Repudiation Plaque:** A plaque added that explicitly apologizes for the harm caused by the figure and repudiates the values they represent, even if the statue remains. (This takes a clear moral stance against the original commemoration; **Disputatio Monumentum** strives for a *presentation* of opposing arguments, often avoiding a singular judgment).

  **The Core of Disputatio Monumentum:** It is an attempt by authorities to formally manage intense symbolic conflict through a strategy of **preservation plus meta-commemoration**. It avoids the finality (and political heat) of removal while acknowledging criticism. It seeks to transform a site of division into a site ostensibly representing democratic deliberation, effectively making the *conflict* the new heritage. It's a bureaucratic solution to a moral/political problem, characterized by its reliance on official text to reframe the meaning of the preserved object. The term captures the essential act: raising a monument (monumentum) to the dispute (disputatio) itself.
