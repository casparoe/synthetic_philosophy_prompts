  ### Expected Payoffs and Tier Ranking
  **Expected Payoffs (with sailing past both exits = 1):**
  1. **Plan and lock:** \( \frac{4}{3} \approx 1.333 \)  
     (Optimal mixed policy: exit with probability \( \frac{1}{3} \), continue with \( \frac{2}{3} \) at each intersection.)
  2. **Ask again at every intersection:** \( 1 \)  
     (Re-optimizing leads to always continuing, yielding payoff 1.)
  3. **Treat the choice as evidence:** \( \frac{4}{3} \approx 1.333 \)  
     (Mixed strategy: exit with probability \( \frac{2}{3} \), continue with \( \frac{1}{3} \).)
  4. **Universalize:** \( 1 \)  
     (Pure act: always continue. If mixed acts allowed: \( \frac{4}{3} \), but "act" interpreted as pure choice is honest.)
  5. **Fresh coin at every intersection:** \( \frac{4}{3} \approx 1.333 \)  
     (Same as Rule 1: exit with probability \( \frac{1}{3} \), continue with \( \frac{2}{3} \) at each intersection.)
  6. **One coin at home:** \( 1 \)  
     (Randomizes over deterministic policies: always exit or always continue; best is always continue.)
  7. **Maximin:** \( 1 \)  
     (Worst-case for exit is 0, for continue is 1; choose continue.)

  **Tier Ranking:**
  - **Tier 1: I'd actually trust this (payoff \( \frac{4}{3} \))**  
    - Rule 1 (Plan and lock): Precommits to optimal mixed policy.  
    - Rule 3 (Treat as evidence): Achieves optimum via evidential randomization.  
    - Rule 5 (Fresh coin at every intersection): Identical to Rule 1; implements optimal mix.  
  - **Tier 2: Suboptimal but safe (payoff \( 1 \))**  
    - Rule 2 (Ask again): Re-optimization traps you in always continuing.  
    - Rule 4 (Universalize): Pure coordination forces always continue.  
    - Rule 6 (One coin at home): Only accesses deterministic policies.  
    - Rule 7 (Maximin): Overly conservative.  

  ### Rule Comparisons and Disagreements
  **Which rules are the same?**  
  - **Rules 1 and 5 are identical:** Both collapse to flipping a fresh coin with \( p = \frac{1}{3} \) (exit) at each intersection.  
  - **Rules 2, 4 (pure), 6, and 7 all yield 1**, but are distinct in mechanism:  
    - Rule 2 re-optimizes myopically.  
    - Rule 4 universalizes a pure act.  
    - Rule 6 randomizes over pure acts upfront.  
    - Rule 7 minimizes worst-case loss.  
  - **Rule 3 is distinct:** Uses \( p = \frac{2}{3} \) (exit) for evidence-based randomization, but achieves the same payoff as Rules 1/5.

  **Where do they disagree?**  
  The critical disagreement is between **precommitment (Rule 1/5)** and **re-optimization (Rule 2)**:  
  - Rule 1/5 commits to a mixed policy upfront, earning \( \frac{4}{3} \).  
  - Rule 2 re-evaluates at each intersection, leading to a pure policy (always continue) and \( 1 \). Casually, both might be described as "deciding at the wheel," but Rule 2 lacks commitment and cannot sustain randomization. This is where the value of precommitment lives.  
  - Rule 3 disagrees with Rules 1/5 on the *probability* of randomization (\( p = \frac{2}{3} \) vs. \( p = \frac{1}{3} \)), but not the payoff.

