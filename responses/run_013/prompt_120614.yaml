answer: |-
  ### Preserving and Departing from Hume
  This procedure operationalizes Hume's core insight that the standard of taste resides in the joint verdict of qualified judges—those possessing strong sense, delicate sentiment, practice, comparison, and freedom from prejudice. It preserves Hume's emphasis on cultivating these qualities in panelists and prioritizing their collective judgment. However, it deliberately departs from Hume by rejecting the assumption that qualified judges naturally converge. Instead, it imposes structure to resolve disagreements, weights judgments based on calibration, and defines "defects" (Hume's universal faults) through majority vote—a pragmatic but contestable addition. The procedure also compromises Hume's ideal of "rare" judges by requiring representativeness, mitigated through pre-screening and calibration. Ultimately, it transforms Hume's philosophy into a defensible, transparent process for a committee constrained by time, politics, and human fallibility.

  ### Procedure: Humean Committee Protocol for Literary Judgment

  | Step | The question to ask                                                                 | What counts as a pass                                                                                               | What to do on a fail                                                                                                                              | Judgment call? |
  |------|-------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|----------------|
  | 1    | Do all panelists meet ≥3 of Hume's 5 qualifications? (Define: "Strong sense" = analytical rigor; "Delicate sentiment" = empathy for textual nuance; "Practice" = ≥5 years in literary field; "Comparison" = broad reading; "Freedom from prejudice" = no conflicts of interest.) | Yes: All panelists clear pre-screening.                                                                           | Replace disqualified panelists or cancel meeting. If representativity invalidates qualifications, document the trade-off.                          | No             |
  | 2    | After ranking 10 benchmark works, is each panelist's variance ≤2 SDs from foundation norms? (Norms preset by board for canonical/contemporary texts.) | Yes: Rankings align, or outlier justifies deviation using Hume's qualities (e.g., "I detect subtle flaws in X due to practice and comparison"). | Outlier fails justification: Re-weight panelist's future scores by 0.5. If >2 panelists fail, adjourn for recalibration.                         | Yes            |
  | 3    | (Pre-discussion scoring) N/A                                                       | N/A                                                                                                                | N/A                                                                                                                                               | No             |
  | 4    | (Blind discussion) N/A                                                              | N/A                                                                                                                | N/A                                                                                                                                               | No             |
  | 5    | (Post-discussion scoring) N/A                                                       | N/A                                                                                                                | N/A                                                                                                                                               | No             |
  | 6    | Is there a clear winner? (Avg score ≥8.0, ≥5.0 pts > runner-up, ≤1 panelist scores ≤6.) | Yes: Declare winner.                                                                                              | Proceed to Step 7 for the top work.                                                                                                             | No             |
  | 7    | For a dissent (score ≤3): Is the cited feature present? (e.g., "coincidental resolution in Ch. 20") | Majority confirms presence.                                                                                       | Feature absent: Ignore dissent.                                                                                                                 | Yes            |
  | 7a   | If feature present: Is it a defect? (Universal flaw: e.g., illogic, inconsistency—not subjective preference like "too sentimental".) | Majority deems it non-defective.                                                                                 | Majority deems it defective: Disqualify work.                                                                                                   | Yes            |
  | 8    | After dissent resolution, is there a clear winner? (Same as Step 6.)                | Yes: Declare winner.                                                                                              | Proceed to Step 9.                                                                                                                              | No             |
  | 9    | For translations/collaborations: Can we judge the work as presented? (e.g., prose in translation, not original.) | Yes: Evaluate text as-is; credit translator equally in citation.                                                 | Consult external expert if time; else, judge as-is but flag uncertainty in citation.                                                            | Yes            |
  | 10   | Is final winner's avg ≥7.0 with no unresolved dissent?                              | Yes: Award prize.                                                                                                 | Return "no verdict"; chair decides ex officio.                                                                                                  | No             |

  ### Worked Cases

  | Case | Verdict                  | Deciding step | Rests on judgment call? | Confidence | Would I accept it? |
  |------|--------------------------|---------------|-------------------------|------------|-------------------|
  | 1    | Award the novel          | Step 7a       | Yes                     | Medium     | No (you'll dislike this) |
  | 2    | Award the translation    | Step 9        | Yes                     | Low        | Yes               |
  | 3    | Do not award the book    | Step 6        | No                      | High       | Yes               |

  #### Case Explanations:
  - **Case 1**: The novel has 3× first ranks and 2× last ranks.  
    - Step 6 fails (low scores from dissenters prevent clear win).  
    - Step 7: Both dissenters name the structural flaw; majority confirms presence.  
    - Step 7a: Majority (5–2) votes the flaw is **not a defect** (mere preference, not universal illogic).  
    - Step 8: Exclude dissenters' scores; recalculated avg meets clear-win threshold.  
    **Verdict: Award**—but you'll dislike it, as dissenters' concerns are overruled.  

  - **Case 2**: Widely praised translation; panel reads only the translation.  
    - Step 6: High scores yield a clear win.  
    - Step 9: Work judged "as presented" in translation; no penalty for source-text unknowns. Translator credited in citation.  
    **Verdict: Award**—low confidence as fidelity to original is unverified.  

  - **Case 3**: Formally difficult book; 4× "unreadable" (scores ≤2), 1× "visionary" (score 10).  
    - Step 6: Avg score = (10 + 2×4)/5 = 3.6—below threshold. Not the top work, so eliminated.  
    - Dissenter's futurist claim ("important in 20 years") is irrelevant to current merit.  
    **Verdict: Do not award**—high confidence; procedure cannot decide futures.  

  **Indeterminate Case**: Case 2 cannot be definitively decided by the procedure. Without source-language access, the panel cannot verify if flaws (e.g., awkward prose) stem from the author or translator. Confidence is low, and the verdict relies on Step 9's judgment call.

