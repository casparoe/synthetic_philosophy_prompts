prompt: |-
  I chair the selection panel for an annual prize given by a mid-sized arts foundation: one award, one category (prose fiction), seven panelists, a single two-day meeting, and a public citation of no more than 150 words. About a third of the panel in any given year are distinguished practitioners rather than critics, with strong and idiosyncratic tastes; the rest are critics, editors, or booksellers. The board wants a defensible process on the record, and the shortlisted publishers are not shy about challenging it.

  I have read Hume's essay on the standard of taste, and I think it is the most useful thing anyone has written about what a committee like mine is actually doing. But it stops precisely where I need it to start: it tells me that the verdict of suitably qualified judges is the standard, sketches the qualifications those judges need, and then leaves me to run the meeting. I want you to turn it into a procedure I can actually run. I don't want a reading list or a summary of the essay; I want an operational document.

  It has to do the following work. First, a rule for composing the panel and for weighting its members, given that the board also insists the panel be representative of the foundation's public, which pulls against the idea of the rare qualified judge. Second, a calibration step before any candidate work is discussed — something that exposes each panelist's scale by having them rank a fixed set of benchmark works, so that disagreement about the shortlist isn't confused with disagreement about the scale. Third, an order of operations for the two days: what happens before scoring, what is discussed before scores are visible, what after. Fourth, a way of telling a genuine perception from a mere preference when a panelist dissents — I want something like an audit in which the dissenter must name the specific feature of the work responsible for their judgment, and the panel must then establish whether that feature is really there, while leaving its weight open. Fifth, the aggregation rule, plus an override rule: state when a single panelist's dissent should defeat a majority, and when a majority should defeat a dissenter whose perception has been confirmed. Sixth, a step for works that are not wholly the candidate's own — translations above all, since we regularly shortlist translated novels and none of us reads the source language, but also collaborations and posthumous completions. Seventh, an explicit statement of when the procedure should return no verdict and hand the decision back to me as a matter of institutional judgment rather than taste.

  Then run the procedure on three cases and show your work at each step. Case one: a novel three panelists rank first and two rank last, the two calling it sentimental; both dissenters, independently, name the same specific structural feature — a late resolution that settles by coincidence a moral problem the book spent four hundred pages setting up — which the other five concede is really there. Case two: a widely praised translated novel, where the translator is herself a celebrated writer and the panel cannot assess the prose because none of them reads the original. Case three: a formally difficult book four panelists find unreadable and one defends on the ground that it will be recognized as important in twenty years. At least one of your verdicts should be one I will not like; say so rather than softening it. Tell me also which of the three the procedure cannot decide, and why.

  Finally, the honest limits. If Hume's account cannot be turned into a procedure of this kind — if everything below the level of "recruit good judges and let them argue" is decoration — say that instead of dressing it up. If any step depends on a reading of Hume that is contested among people who know the text better than I do, name the step and say what the disagreement is; I would rather see where I am standing on a contestable interpretation than have it buried. And if the procedure will misfire systematically in a case I haven't thought of, name the case.

  Format the answer as follows. Open with one paragraph stating what the procedure tries to preserve from Hume and what it deliberately drops. Then give the procedure itself as a table with exactly these columns: Step number | The question to ask | What counts as a pass | What to do on a fail | Judgment call? (yes/no). Then the three worked cases as a table with these columns: Case | Verdict the procedure returns | Deciding step | Rests on a judgment call? | Confidence (low/medium/high) | Would I accept it? After the tables, give a single JSON object with these fields: "procedure_name" (string), "n_steps" (integer), "hard_fail_steps" (array of step numbers), "judgment_call_steps" (array of step numbers), "cases" (array of objects, each with "case_id", "verdict", "deciding_step", "rests_on_judgment_call" as a boolean, and "confidence"), "known_limits" (array of strings), and "contested_hume_reading" (string, or null if there is none).
reasoning: |-
  We are building a procedure based on Hume's "Of the Standard of Taste". Hume argues that the standard of taste is the joint verdict of true judges who possess strong sense, delicate sentiment, practice, comparison, and lack of prejudice. However, he does not provide a method for aggregating individual judgments or resolving disputes in a committee.

  The procedure aims to:
  1. Preserve Hume's core idea that the verdict of qualified judges (with the five qualities) is the standard.
  2. Introduce a structured process to handle disagreements and ensure the decision is defensible.

  What we drop:
  - The idea that the standard is fixed and universal; our procedure accepts that the panel's verdict is contingent on the specific qualified judges we have.
  - The hope that all true judges will naturally converge; we provide steps for when they don't.

  We must address:
  - Panel composition: The foundation requires representativeness, which may conflict with Hume's "rare qualified judge". We will require all panelists to meet a threshold of qualification (via a pre-screening) and then use the calibration step to account for idiosyncrasies.
  - Calibration: Use benchmark works to establish each panelist's scale.
  - Meeting structure: Order of operations to avoid groupthink and ensure independent judgment.
  - Dissent handling: Separate perception (is the feature there?) from evaluation (how much does it matter?).
  - Aggregation: When a minority can override, and when a majority can override a confirmed dissent.
  - Special cases: Translations, collaborations, etc.
  - No verdict: When the procedure cannot decide.

  Procedure Design:

  Step 1: Pre-screening of Panelists
    - We require that all panelists (including practitioners) meet a minimum threshold: at least three of Hume's five qualities (strong sense, delicate sentiment, practice, comparison, freedom from prejudice). We define each quality operationally (e.g., practice = at least 5 years in the field; comparison = having read widely in the genre; etc.). The board's requirement for representativeness is satisfied by ensuring diversity in the pool from which we select, but the final panel must meet the qualification threshold.

  Step 2: Calibration
    - Before the meeting, each panelist independently ranks a fixed set of 10 benchmark works (from a pre-agreed list of 20 canonical and contemporary novels, chosen by the foundation's board for their known critical standing and diversity). They also assign a score (1-10) to each. The purpose is to reveal each panelist's scale and to identify any extreme outliers. If a panelist's ranking deviates radically (e.g., ranks a universally acclaimed work at the bottom without a defensible reason), we flag this and require a written justification. If the justification fails to meet a minimum standard (e.g., based on one of Hume's qualities), we replace the panelist (if time) or note the deviation for weighting.

  Step 3: Initial Scoring (Day 1, Morning)
    - Panelists independently score each shortlisted work (on a 1-10 scale) and write a brief justification (max 100 words) without discussion.

  Step 4: Discussion of Merits (Day 1, Afternoon)
    - Discuss each work in turn, focusing on the features of the work (plot, character, prose, etc.) without revealing scores. Each panelist must present one strength and one weakness. The goal is to ensure shared perception of the work's features.

  Step 5: Revised Scoring (Day 2, Morning)
    - After the discussion, panelists independently re-score the works. This time, they may adjust based on new perceptions.

  Step 6: Aggregation and Ranking (Day 2, Midday)
    - The chair aggregates the scores and ranks the works. If there is a clear winner (by a pre-set rule: at least 5 points higher in the average than the next, and no more than one panelist scoring it below 7), then that work wins. Otherwise, proceed to step 7.

  Step 7: Handling Dissents
    - For any work that is the top choice of at least one panelist but not the winner, or if the top work has a dissent (score <=3), we trigger the dissent audit. The dissenter must name a specific structural or textual feature that caused their low score (e.g., "the coincidental resolution in chapter 20"). The panel then discusses: is that feature present? (Perception check). If the panel (by majority) agrees the feature is present, then the dissenter's judgment is confirmed as a genuine perception. Then, the panel must vote on whether that feature is a defect (Hume's "defect in the object") or a matter of taste (Hume's "defect in the organ"). If it is deemed a defect by majority, then the work is disqualified from winning. If not, the dissenter's score is set aside and the average is recalculated without it (but only if the dissent is isolated).

  Step 8: Override Rule
    - If a work would win by the aggregation but has a dissent that has been confirmed as a perception and then as a defect (by majority vote in step 7), then the work is disqualified. Conversely, if a dissenter's perception is confirmed but the majority does not agree it is a defect, then the dissenter's score is treated as an outlier and excluded. However, if two or more dissenters independently identify the same defect and it is confirmed, then the work is disqualified even if the majority doesn't see it as a defect? We must be cautious: we require that for such a disqualification, at least two dissenters must have independently named the same feature and the panel must confirm it is present. Then, if the panel by majority agrees it is a defect, disqualify. If the panel disagrees on defect, then the work remains but the dissenters' scores are excluded. This is complex.

    Let me refine: 
    - A dissent is a score <=3. 
    - If a work has one or more dissents, trigger the audit for each dissenter. 
    - If a feature named by a dissenter is confirmed by the panel (majority says it's present) and the panel then by majority (including the dissenter) votes that this feature is a defect (using Hume's idea of universal defects), then the work is disqualified. 
    - If the feature is confirmed but the panel does not vote it as a defect (i.e., it's a matter of individual taste), then that dissenter's score is excluded from the average. 
    - If two or more dissenters independently name the same feature and it is confirmed, then even if the panel does not vote it as a defect, the work is disqualified? Not automatically. We need a higher bar: if two or more independently name the same feature and it is confirmed, then we hold a vote on whether it is a defect. If the vote passes (majority), disqualify. If not, then exclude the dissenters' scores.

    But note: the defect vote is about whether the feature is a universal defect (like an illogical plot, inconsistent character, etc.) or a matter of taste (e.g., too much violence, too experimental).

  Step 9: Special Cases (Translations, etc.)
    - For translations: The panel must evaluate the work as presented in the language they read. They are to consider the prose in the translation as the work. However, they must also note that the translator is a co-creator. If the work is a finalist, the citation must credit the translator equally. If there is doubt about the quality of the translation (e.g., if a panelist who reads the source language raises an issue, but in our case none do), then the panel must rely on the reputation of the translator and the publisher. They may also consult an external expert (if time) but this is not built into the procedure. We add a rule: if the work is a translation and none of the panelists read the source language, then they must not penalize the work for possible translation issues. They evaluate the work as an English (or target language) text.

  Step 10: No Verdict
    - If after step 8 no work has an average score above 7, or if the top two works are within 2 points and at least one panelist dissents (score<=3) on the top work and the dissent is confirmed as a defect (by the panel vote), then no winner is selected. The chair then decides, based on institutional judgment (e.g., the foundation's mission, public impact, etc.), but this is outside the taste procedure.

