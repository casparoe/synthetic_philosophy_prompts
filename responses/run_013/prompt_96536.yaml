prompt: |-
  My old roommate keeps defending this argument and I can't tell if it's clever or just broken. Here it is: (1) If you believe some moral claim only because someone told you, you don't see why it's true. (2) You can't know a moral claim unless you see why it's true -- morality isn't geography, it's not the kind of thing you can just be handed. (3) So nobody can know a moral claim on the strength of testimony. (4) And if you can't know it, you can't be justified in believing it either -- a belief you can't back up yourself is just a guess with good manners. (5) So deferring to someone else's moral judgment is never justified, and anyone who says "I just trust my priest on this" is being irrational. (6) So there's no such thing as a legitimate moral authority.

  The conclusion is obviously absurd -- I learned half of what I think about right and wrong from my grandmother, and I don't think I was just guessing that whole time. But steps 1 and 2 feel true to me and I can't see where the rot starts. Which step do I give up, why did it look fine, and what does giving it up cost me? I'd rather keep 2 than 5 if I have to choose, so tell me what I'm buying if I do. Also keep separate what people who actually work on this agree on versus where they're just fighting -- I don't want a made-up consensus. Plain American English, please.
reasoning: |-
  Okay, the user's old roommate has this argument against moral testimony, and the user is stuck trying to find where it goes wrong. Let me start by breaking down each premise.

  First, premise (1): If you believe a moral claim because someone told you, you don't see why it's true. That seems intuitive. If Grandma says stealing is wrong and I accept it without understanding, I might not grasp the reasons behind it. But is that always true? Could someone explain the reasons? Maybe, but the premise focuses on belief solely based on testimony, so it might hold in those cases.

  Premise (2): You can't know a moral claim without seeing why it's true. Morality isn't like geography where you can just trust a map. This is key. The roommate is saying moral truths require understanding, not just facts. That's a big claim. Epistemologists call this internalism about justification—needing access to reasons. But is this necessary for all knowledge? For moral claims specifically, maybe. The user feels this is strong, so they don't want to give it up.

  Then (3) follows: No one can know moral claims via testimony. If you need to see why it's true and testimony doesn't provide that, then testimony can't give knowledge. Logical so far.

  Premise (4): If you can't know it, you can't be justified in believing it. They equate unjustified belief to a "guess with good manners." But justification and knowledge aren't the same. You can have justified true belief without knowledge (Gettier cases), but here the argument links justification to the ability to back it up. So if you can't know due to lacking reasons, you also lack justification. That's a jump. Justification might be weaker than knowledge. Maybe you can have some justification without full understanding? 

  Premise (5): Deferring to others' moral judgment is never justified. Therefore, trusting a priest is irrational. Leads to (6): No legitimate moral authorities. The user finds this absurd because they learned morals from their grandmother and felt it wasn't just guessing. So where's the flaw?

  The user wants to keep premise (2) over (5). So rejecting (4) might be the way. Premise (4) claims that if you can't know something, you can't be justified. But that's conflating knowledge with justification. Justification is a component of knowledge, but not sufficient on its own (needs truth and belief). So you can have justification without knowledge. For example, a jury might have justified belief based on testimony, but if the witness lied, they don't know. But they were still justified. Applied to morality, maybe you can be justified in believing a moral claim via testimony even if you don't "see why it's true." 

  Rejecting (4) means separating justification from the requirement of personal understanding. So trusting a moral authority could provide justification, even if it doesn't guarantee knowledge. The cost is accepting that moral beliefs can be justified without personal insight. That might feel like losing moral autonomy, but it doesn't mean you shouldn't seek understanding. It just allows that testimony can be a valid starting point.

  The user also asked about expert consensus. In epistemology, there's debate, but many reject testimony-based knowledge in morals. However, justification via testimony is more accepted. So rejecting (4) aligns with some views without needing to tackle (2). 

  The user's concern about grandma: If rejecting (4) allows that learning from grandma can be justified, that saves their intuition. They might not have known why stealing is wrong then, but they were justified in trusting her. Later, they can develop their own understanding. So the cost is that justification doesn't require full understanding upfront, which is a trade-off between autonomy and community learning.
answer: |-
  Here's the breakdown of where the argument fails, why it *looks* plausible, what it costs to fix it, and the state of expert debate - all in plain terms:

  **The Rot Starts at Step (4):**  
  *"If you can't know it, you can't be justified in believing it either."*

  **Why It Looks Fine:**  
  It mixes up two ideas that feel connected:  
  1.  **Knowledge:** Requires your belief to be true, justified, and (often) non-lucky.  
  2.  **Justification:** Is just about having good enough reasons to believe something, *even if you turn out to be wrong*.  

  Step (4) says if you lack the specific kind of justification needed for *moral knowledge* (i.e., "seeing why it's true"), you can't have *any* justification at all. That's like saying if you can't run a marathon (knowledge), you can't even take a healthy walk (justification). It throws out weaker-but-still-reasonable support.

  **Why (4) is Broken:**  
  *   **Justification is easier than knowledge:** You can be *justified* in believing something based on good evidence (like a trustworthy source) even if you don't fully understand *why* it's true, and even if it *turns out* to be false. Think of a jury believing a credible eyewitness – they're justified before the verdict, even if the witness was mistaken.  
  *   **Testimony *can* provide justification:** We do this constantly. You believe your doctor about your diagnosis, your mechanic about your car, the history book about Napoleon. You don't always "see why it's true" yourself; you trust the source is competent and honest. Why should morality be uniquely immune to this?  
  *   **It mislabels "guessing":** Believing a trustworthy expert (like your grandma on morals) isn't just "a guess with good manners." It's a *reasoned judgment* based on evidence about *the source's reliability*. Guessing is random. Trusting a known-good source is calculated.

  **What Giving Up (4) Costs You:**  
  You give up the idea that **only personal, first-hand moral insight counts as a valid reason to believe anything moral.** You accept that:  
  *   **Justification can be "borrowed":** It's sometimes reasonable to believe a moral claim primarily because a trustworthy person (like your grandma, a wise community elder, or an expert ethicist) says it's true, *even if you can't fully articulate the reasons yourself yet*.  
  *   **Moral learning often starts with trust:** Kids (and adults learning new complexities) *begin* by trusting authorities and *then* come to understand the reasons. That initial trust isn't irrational; it's a necessary step.  
  *   **Moral understanding can be a *goal*, not always a *prerequisite*:** You can be justified in believing Grandma *while working towards* understanding why she's right. You don't have to see it perfectly *before* you're allowed to believe her reasonably.  
  *   **You keep Moral Internalism (Step 2):** You still hold that genuine *moral knowledge* requires understanding why the claim is true. Trusting testimony might give you justification and even true belief, but it doesn't automatically give you full *knowledge*. You preserve the core idea that morality isn't *just* facts to memorize.

  **What You Buy by Ditching (4) and Keeping (2):**  
  You buy back **common sense about learning and reasonable trust**.  
  *   You can say: *"I justifiably believe stealing is wrong because my wise, loving grandma taught me so, and I trust her judgment deeply. I'm working on fully understanding the reasons myself, but my belief isn't a blind guess – it's based on her demonstrable track record and character."*  
  *   You avoid the absurd conclusion that kids, people new to ethical reasoning, or those relying on trusted community/religious figures are fundamentally irrational about morality until they become solo philosophers.  
  *   You allow for **legitimate (though limited) moral authorities:** People whose expertise, experience, or wisdom makes them reliable sources worth trusting *provisionally*, even if their word alone isn't sufficient for full *knowledge* in the person receiving the testimony.

  **The Expert Landscape (No Made-Up Consensus):**  
  1.  **Step 1 & 2 (Internalism about Moral Knowledge):** This is widely accepted. Most philosophers agree that *knowing* a moral truth requires grasping the reasons for it (it's not like memorizing a capital city). Morality seems to require understanding. **Agreement is high here.**
  2.  **Step 3 (No Moral Knowledge via *Pure* Testimony):** Follows from 1 & 2 and is also widely accepted. If knowledge requires "seeing why," and testimony alone doesn't give you that "seeing," then testimony alone can't give you knowledge. **Strong consensus.**
  3.  **Step 4 (No Justification Without Knowledge-Level Insight):** This is the main battleground. Many (especially "internalists" about justification) side with the roommate: if you don't grasp the reasons yourself, your belief isn't *really* justified. Others (often "externalists" or proponents of testimony) argue forcefully that trust in a reliable source *is* a legitimate form of justification, even for morals. **This is where the major fight is. There is NO consensus.** Your roommate represents one prominent side; rejecting Step (4) represents the other prominent side.
  4.  **Step 5 & 6 (Never Justified to Defer / No Legitimate Authority):** These conclusions hinge entirely on Step (4). If Step (4) falls, these fall too. Experts who reject Step (4) argue that deferring *can* be justified in specific contexts (trusted source, complex issue, your own lack of expertise) and that there *can* be legitimate moral authorities (people whose judgment provides good, even if not knowledge-level, reason to believe). **Fight hinges on Step (4).**

  **In Short:** The argument breaks at Step (4). It wrongly assumes that if testimony can't give you the deep understanding required for *moral knowledge*, it can't give you *any* reasonable justification at all. Giving up (4) lets you keep the core idea that moral *knowledge* requires personal insight (Step 2), while making room for the common-sense reality that learning morality often starts with reasonable trust in people we have good reason to believe are wise and reliable. You lose the purity of "only my own reasoning counts," but you gain the ability to explain how moral learning actually works in the real world without calling it irrational. The experts are fighting *precisely* over whether Step (4) is true.
