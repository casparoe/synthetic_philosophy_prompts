prompt: |-
  Hey, I'm building an eval on mechanistic anomaly detection and I keep getting stuck on the same thing: nobody agrees on when two internal structures should count as "the same mechanism", which is annoying because the whole safety story rests on being able to say "this new behavior is a re-implementation of something I already understand" vs "this is a genuinely novel mechanism I've never seen". So I want to pin down which criteria should actually carry weight.

  Here's the list I've been kicking around. Some of these I made up myself, so dont feel obliged to have seen them anywhere:

  1. Same computational role in the task — both do the thing the model needs done at that point (e.g. both are the copy/induction head).
  2. Same causal graph topology — same wiring pattern among components, regardless of what's stored where.
  3. Same parameters up to a symmetry — you can map one onto the other by permutation/scaling.
  4. Same behavior under all interventions — ablate either one and the model breaks in the same way.
  5. Same counterfactual robustness profile — they fail on the same adversarial and near-distribution inputs.
  6. Same training lineage — both emerged from the same phase of training / the same data ordering.
  7. Same sparse-autoencoder latent signature — the same set of SAE features lights up for both.
  8. Same minimality under compression — both are the smallest circuit that accounts for the behavior.

  Score each one 0-100 for how much weight it should get when the question is whether a new model's behavior is a novel mechanism (an anomaly) or just a re-implementation of one you already understand. Higher = you'd let it swing the verdict on its own. Then sort rows highest to lowest.

  Give me a markdown table with these columns: criterion | score | what it gets right | where it breaks. Keep the last two columns to one sentence each. Then one short paragraph after the table: if you could only keep a single criterion, which one and why. Start the whole thing with a one-line lead that names the top criterion and the score gap between #1 and #2.
reasoning: |-
  We are scoring criteria for determining when two internal structures count as the same mechanism. The focus is on anomaly detection: is a new behavior a re-implementation of a known mechanism or a novel one?

  The criteria are:
  1. Same computational role in the task
  2. Same causal graph topology
  3. Same parameters up to a symmetry
  4. Same behavior under all interventions
  5. Same counterfactual robustness profile
  6. Same training lineage
  7. Same sparse-autoencoder latent signature
  8. Same minimality under compression

  Scoring each 0-100 for how much weight it should carry (higher = can swing the verdict on its own). Then sort by score descending.

  Table columns: criterion | score | what it gets right | where it breaks (one sentence each).

  Then a short paragraph: if only one criterion, which one and why.

  Start with a one-line lead: top criterion and the score gap between #1 and #2.

  Scoring rationale:

  - We are evaluating for the purpose of mechanistic anomaly detection. The goal is to detect if a mechanism is novel (anomalous) or just a re-implementation of a known one.

  - The key is to capture the essence of the mechanism in a way that is invariant to superficial changes (like symmetries) but sensitive to genuine functional differences.

  - We must balance between being too strict (every re-implementation is considered different) and too loose (novel mechanisms are missed).

  Analysis per criterion:

  1. Same computational role: This is central. If two mechanisms serve the same function in the task (e.g., both are induction heads), then they are the same mechanism. However, two different algorithms might serve the same role (e.g., two different ways to implement an induction head). So it's not always sufficient.

     Score: 90. It captures the functional equivalence, which is the ultimate goal.

  2. Same causal graph topology: This is about the wiring pattern. However, the same topology might be implemented with different parameters and thus compute different things. Also, two different topologies might compute the same function.

     Score: 50. It's a structural similarity, but without functional equivalence it might not be the same mechanism.

  3. Same parameters up to symmetry: This is a very strict structural similarity. However, two mechanisms that are symmetric might be functionally identical, but we care about function. Also, two mechanisms with different parameters might compute the same function (e.g., via different algorithms).

     Score: 60. It's a strong indicator of re-implementation but doesn't account for functional equivalence in a different structure.

  4. Same behavior under all interventions: If ablating or intervening on one mechanism causes the same failure modes as the other, that's strong evidence they are functionally equivalent. However, it might be hard to test "all" interventions.

     Score: 95. This is very close to functional equivalence.

  5. Same counterfactual robustness profile: If they fail on the same adversarial inputs, that's a good sign of functional equivalence. However, two mechanisms might have the same robustness profile but compute the function in very different ways (and hence be different mechanisms). Also, robustness might be a property of the entire model, not just the mechanism.

     Score: 70. It's a good indicator but not sufficient on its own.

  6. Same training lineage: This is about how they emerged. However, two mechanisms that emerged in the same way might still be functionally different, and two identical mechanisms might emerge in different training runs.

     Score: 20. It's a weak indicator because the same mechanism can be learned in different ways.

  7. Same sparse-autoencoder latent signature: If the same set of SAE features activate, that suggests they are composed of the same building blocks. However, SAE features are learned and might not capture the exact mechanism. Also, two mechanisms might use different features to achieve the same function.

     Score: 65. It's a good proxy but depends on the quality of the SAE.

  8. Same minimality under compression: If both are the smallest circuit that accounts for the behavior, that suggests they are the same algorithm. However, there might be multiple minimal circuits for the same behavior (especially if the behavior can be implemented in more than one minimal way).

     Score: 80. It gets at the algorithmic essence but might be too rigid.

  Now, let's sort by score (descending) and assign the table:

  Sorted scores:
  4: 95
  1: 90
  8: 80
  5: 70
  7: 65
  3: 60
  2: 50
  6: 20

  Top criterion: #4 (Same behavior under all interventions) with score 95. The gap to #1 (Same computational role) is 5 points.

  Table:

  | Criterion                                      | Score | What it gets right                                      | Where it breaks                                     |
  |------------------------------------------------|-------|---------------------------------------------------------|----------------------------------------------------|
  | Same behavior under all interventions          | 95    | Directly tests functional equivalence in all scenarios. | May be impractical to test all possible interventions. |
  | Same computational role in the task            | 90    | Captures the core purpose and function in the model.    | Different algorithms can fulfill the same role.      |
  | Same minimality under compression              | 80    | Identifies the essential algorithmic core.              | Multiple minimal circuits may exist for the same behavior. |
  | Same counterfactual robustness profile         | 70    | Shows similar failure modes and vulnerabilities.        | Robustness may be influenced by the whole model.     |
  | Same sparse-autoencoder latent signature       | 65    | Reveals shared low-level feature composition.           | Depends on SAE quality and may miss non-SAE features. |
  | Same parameters up to a symmetry               | 60    | Structural equivalence accounting for symmetries.       | Different parameters can compute the same function. |
  | Same causal graph topology                     | 50    | Captures the abstract wiring pattern.                   | Same wiring can compute different things.          |
  | Same training lineage                          | 20    | Indicates shared developmental origin.                  | Unrelated to functional equivalence.               |

  After the table, the paragraph:

  If I could only keep one criterion, I would choose "Same behavior under all interventions" because it most directly tests whether the mechanism has the same functional effect on the model's outputs under any condition, which is the ultimate determinant of whether it is a re-implementation or novel. While it may be difficult to test exhaustively, it is the most reliable indicator of functional equivalence.
answer: |-
  Top criterion: **Same behavior under all interventions** (score 95), with a 5-point gap over #2.  

  | Criterion                                      | Score | What it gets right                                      | Where it breaks                                     |
  |------------------------------------------------|-------|---------------------------------------------------------|----------------------------------------------------|
  | Same behavior under all interventions          | 95    | Directly tests functional equivalence across every input and perturbation. | Impractical to test exhaustively; may miss internal algorithmic differences. |
  | Same computational role in the task            | 90    | Focuses on purpose (e.g., both *are* induction heads), aligning with safety goals. | Ignores implementation; different algorithms can fulfill identical roles. |
  | Same minimality under compression              | 80    | Captures algorithmic essence by isolating the smallest valid circuit. | Multiple minimal circuits may exist for the same behavior. |
  | Same counterfactual robustness profile         | 70    | Reveals identical failure modes under stress, indicating functional parity. | Robustness can be model-wide, not mechanism-specific. |
  | Same sparse-autoencoder latent signature       | 65    | Highlights shared low-level feature activations, aiding interpretability. | SAE features are approximation-dependent and non-universal. |
  | Same parameters up to a symmetry               | 60    | Accounts for trivial symmetries (e.g., permutation invariance). | Overly rigid; different parameters can compute identical functions. |
  | Same causal graph topology                     | 50    | Reflects structural similarity in component interactions. | Same wiring can yield different computations with varied weights. |
  | Same training lineage                          | 20    | Indicates shared developmental triggers (e.g., data ordering). | No guarantee of functional equivalence; lineage ≠ mechanism. |

  If forced to choose one criterion, I would retain **same behavior under all interventions**. It directly probes functional equivalence—whether the mechanism *does* the same thing in all contexts—which is the safety-critical question for anomaly detection. While testing every intervention is idealized, this criterion best distinguishes re-implementations (same outcomes) from novel mechanisms (divergent outcomes), overriding superficial similarities in structure or training.
