  ## Memorial Address for Mara Ellison

  **(Spoken Length: Approx. 19 minutes)**

  Good morning. We are here, gathered by love and respect, for Mara Ellison. Historian. Teacher. Mother. Grandmother. Friend. Colleague. To speak of Mara is to encounter a challenge she lived by, and one she insisted we face: the challenge of *how* we tell a life.

  Mara spent her intellectual life wrestling with the traps we lay for the past. She named two particularly insidious ones. She called the first **"the funnel."** Think of an hourglass. At the top, sand scattered wide, countless possibilities shimmering in the air – the openness of a moment, a decision, a life unfolding. Then, gravity. The sand streams down, narrowing, narrowing, until only a single thread falls through the neck. *This* happened, *that* didn't. We look back and see only the thread that made it, forgetting the wide scatter of what might have been. We see the path walked, and assume it was the only path possible. That, Mara argued, is the funnel collapsing history into inevitability.

  The second trap she called **"the borrowed lantern."** This is the light *we*, standing here in the future, shine backwards. We lend it to figures in the past, illuminating the path ahead *for them*, as if they could see what was coming as clearly as we do. We credit them with foresight they could not possibly have possessed. We make their choices seem obvious, guided by the destination we know they reached. We fit them with a lantern they never held.

  And Mara had a rule, applied rigorously to history and, with increasing pointedness in her later years, to life itself: **"Never say what an event *had* to lead to."** Not in the archives of nations, nor in the quiet archives of a single life. The meaning of a moment, she insisted, lies *in* the moment, in its open possibility, not in the destination it supposedly foretells.

  So, how do I speak of Mara’s life today, honoring the woman who forbade just the kind of story we instinctively reach for at moments like this? How do we avoid fitting her with the borrowed lantern, or forcing her vibrant, complex existence through the narrow neck of a funnel, ending neatly at this grave?

  We don’t tell the arc.

  We won’t say that the curious child *had* to become the formidable scholar. We won’t trace a line from early loss directly to the refuge of the archive, as if grief were merely a signpost pointing towards a career. We won’t suggest that every paper, every lecture, every fierce seminar debate was *leading to* the unfinished manuscript on her desk. To do that would be to commit the very errors she dedicated her life to exposing. It would be to disrespect the core of her thought, the integrity of her vision.

  Instead, perhaps we hold her life as she held lives: as a constellation of moments, each alive with its own uncertainty, its own open doorways. Moments lit only by the light available *then*, not by the borrowed lantern of what came after.

  Picture her, not as a young scholar destined for greatness, but simply as a young scholar: elbows deep in uncatalogued boxes in a dusty archive basement in Prague, 1968. The air thick with dust and the faint scent of decaying paper. She finds a bundle of letters, tied with faded ribbon, written by a minor functionary caught in the grinding gears of bureaucracy. In that moment, what mattered wasn't the grand sweep of history, but the raw human confusion on the page, the choices made in profound uncertainty, with no knowledge of the tanks that would roll in mere weeks later. She would describe the thrill of that discovery – the *openness* of the functionary's world in that instant before the funnel collapsed.

  Picture her, years later, not as Professor Ellison shaping the field, but as Mara: fiercely debating a graduate student over coffee, not to win, but to *think*. Her eyes alight, fingers tapping the table for emphasis. "But *why* must it lead there?" she might demand, pushing back against a neat conclusion. "What other doors were still open *then*? What lanterns were they *actually* holding?" The air crackled not with certainty, but with the shared energy of wrestling with the unknown. *(Historian Hook: Direct invocation of her core method in action; Family Hook: Vivid scene of her passionate engagement)*

  Picture her, not defined by roles, but present in them: Laughing uproariously at one of her grandson’s deliberately terrible jokes, the sound echoing in her kitchen. Completely absorbed, utterly *there*. Not thinking about the next chapter, or the looming deadline, but delighting in the absurdity of the moment. Or humming tunelessly, almost unconsciously, while meticulously arranging photographs in an album – not curating a legacy, but simply engaging with fragments of time passed. *(Family Hook: Relatable, warm domestic moments; Historian Hook: Embodiment of presence in the moment, resisting retrospective meaning-making)*

  Even in her final years, as she faced her own horizon, she applied the rule to herself. When asked about the shape of her life, her contributions, she would deflect the borrowed lantern. "We did what seemed possible, necessary, or interesting at the time," she might say with a characteristic shrug, refusing the grand narrative. When the weight of the unfinished book pressed, she didn't frame it as a tragedy of potential unfulfilled, but spoke of the questions still alive on the page, the doors still stubbornly open. She insisted on the validity of the work *as it stood*, in its moment of creation, not as a stepping stone to a definitive end. *(Historian Hook: Applying her theory reflexively to her own life; Family Hook: Insight into her character and acceptance)*

  This, then, is the discipline Mara asks of us today: to resist the comforting arc, the satisfying conclusion that ties everything with a bow. To honor her is to honor the openness she championed. Her life wasn't a straight line converging inevitably here. It was a vibrant scatter of moments – moments of intense scholarship and deep love, of fierce argument and quiet humming, of confusion and clarity. Moments where doors opened and closed, paths were taken and others left untrodden, all illuminated only by the light she, and those with her, actually held at the time.

  We cannot lend her a lantern now to light her past path. We cannot force her rich, branching life through the narrow funnel of a eulogy that ends predictably at this point. To do so would be to betray the very essence of her work, the rigor of her mind, and the profound respect she had for the messy, open-ended reality of living.

  So, we gather not to close the book, but to acknowledge the pages written. Not to trace the funnel, but to remember the wide scatter. Not to borrow a lantern to illuminate her journey for her, but to hold up our own small lights – memories, gratitude, love – shining now, in *this* moment, for the brilliant, challenging, open-ended presence that was Mara Ellison. She is not a story concluded. She is a question that endures, an insistence on possibility that resonates still.

