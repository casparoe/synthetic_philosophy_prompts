answer: |-
  ### Exam Question: Dutch Books and Rationality  

  **Background:** An agent assigns credences to mutually exclusive, non-exhaustive events as follows:  
  - \(P(A) = 0.4\)  
  - \(P(B) = 0.4\)  
  - \(P(A \lor B) = 0.9\)  

  **Your Tasks:**  
  1. **Construct the Dutch Book** (7 marks):  
     - Design three bets the bookie offers, specifying who pays whom and when. Use a stake of £100 per bet.  
     - Prove the agent loses *at least* £10 net in all cases: \(A\), \(B\), or \(\neg (A \lor B)\).  

  2. **Assess Normative Force** (8 marks):  
     - Argue whether the existence of this book *alone* proves the agent’s credences are irrational.  
     - Engage one objection holding that Dutch books only expose incoherent betting odds, not irrational credences, due to auxiliary assumptions (e.g., linear utility, willingness to bet at fair prices). Defend your verdict against this objection.  

  3. **Escape Conditions** (5 marks):  
     - State precisely what must be true of an agent (e.g., about utilities, betting dispositions, or doxastic attitudes) for this Dutch book to have *no force* against her.  

  ---  
  ### Model Answer (600 words)  

  #### Part 1: Constructing the Dutch Book  
  The bookie offers three bets with £100 stakes:  
  - **Bet 1 (Sell to agent):** On \(A\) at £0.40. Agent *pays* £40 upfront, receives £100 if \(A\) occurs.  
  - **Bet 2 (Sell to agent):** On \(B\) at £0.40. Agent *pays* £40 upfront, receives £100 if \(B\) occurs.  
  - **Bet 3 (Buy from agent):** On \(A \lor B\) at £0.90. Agent *receives* £90 upfront, pays £100 if \(A \lor B\) occurs.  

  **Net outcomes by case:**  
  - **Case 1: \(A\) occurs**  
    Agent wins £100 on Bet 1, loses £100 on Bet 3. Net: \((-£40 - £40 + £90) + (£100 - £100) = £10 - £0 = \bm{+£10}\)?  
    *Correction*: Initial net cash flow: \(-£40 -£40 +£90 = +£10\). After events: \(+£100\) (Bet 1) \(-£100\) (Bet 3) = \(£0\). **Total: \(£10 + £0 = \bm{£10}\) profit?**  
    *Recheck*: After paying for Bets 1 & 2 (£80) and receiving £90 for Bet 3, agent has \(+£10\) cash. When \(A\) occurs:  
    - Bookie pays agent £100 (Bet 1).  
    - Agent pays bookie £100 (Bet 3).  
    Net transaction: £0. **Total agent gain: \(£10 + £0 = £10\)**.  
    *Mistake*: Bet 2: Since \(A\) occurred, \(B\) did not, so no payout for Bet 2. Agent loses nothing extra.  
    **Final: Agent gains £10?**  

    **Correct Calculation**:  
    - Upfront: Agent *pays* £40 (Bet 1) + £40 (Bet 2) = -£80. *Receives* £90 (Bet 3) = +£90. Net upfront: **+£10**.  
    - If \(A\):  
      - Bookie pays agent £100 (Bet 1 win).  
      - Agent pays bookie £100 (Bet 3 loss).  
      - Bet 2: No payout (since \(B\) false).  
      Net event payout: £100 - £100 = £0.  
      **Total: +£10 (upfront) + £0 = +£10**.  
    **This is incorrect; the agent should lose in all cases.**  

    **Error Identification**:  
    The Dutch book construction requires the agent to *lose* money in all states. Here, in \(A\), the agent has a net gain of £10. This is wrong.  

    **Corrected Construction**:  
    Standard Dutch book for non-additivity:  
    - Bookie sells bet on \(A\) at \(P(A)=0.4\): Agent pays £40, gets £100 if \(A\).  
    - Bookie sells bet on \(B\) at \(P(B)=0.4\): Agent pays £40, gets £100 if \(B\).  
    - Bookie *buys* a bet on \(A \lor B\) from agent at \(P(A \lor B)=0.9\): Agent *receives* £90, pays £100 if \(A \lor B\).  

    **Net upfront**: Agent pays £40 + £40 = £80 for the first two bets, receives £90 for the third. Net: **+£10** (agent gains £10 upfront).  

    **After events**:  
    - If \(A\): Agent wins Bet 1 (£100), loses Bet 3 (pays £100). Net from events: £0. Total: **+£10**.  
    - If \(B\): Similarly, wins Bet 2 (£100), loses Bet 3 (£100). Total: **+£10**.  
    - If neither:  
      - Bets 1 and 2 lose (no payout).  
      - Bet 3: \(A \lor B\) false, so agent keeps £90.  
      Upfront: +£10. Events: no change. Total: **+£10**.  

    **This is not a Dutch book!** The agent gains £10 in all cases.  

    **Correct Standard Dutch Book**:  
    To exploit non-additivity, the bookie should:  
    - **Sell** bet on \(A\): Agent pays \(0.4 \times 100 = £40\) now, receives £100 if \(A\).  
    - **Sell** bet on \(B\): Agent pays £40 now, receives £100 if \(B\).  
    - **Buy** bet on \(\neg (A \lor B)\)? But the agent has no credence for \(\neg (A \lor B)\).  

    **Proper Construction**:  
    Since \(P(A) + P(B) = 0.8 < 0.9 = P(A \lor B)\), the bookie can:  
    - **Sell** a bet on \(A \lor B\) at £0.90: Agent pays £90, receives £100 if \(A \lor B\).  
    - **Buy** a bet on \(A\) from agent at \(P(A)=0.4\): Agent receives £40, pays £100 if \(A\).  
    - **Buy** a bet on \(B\) from agent at \(P(B)=0.4\): Agent receives £40, pays £100 if \(B\).  

    **Net upfront**: Agent pays £90 (for \(A \lor B\) bet), receives £40 (for \(A\)) + £40 (for \(B\)) = £80. Net: **-£10** (agent pays £10 upfront).  

    **After events**:  
    - **If \(A\)**:  
      - Agent wins \(A \lor B\) bet: receives £100.  
      - Loses bet on \(A\): pays £100.  
      - Bet on \(B\): no payout (since \(A\) and \(B\) exclusive).  
      Net from events: £100 - £100 = £0. **Total: -£10**.  
    - **If \(B\)**: Similarly, net events £0. Total: **-£10**.  
    - **If neither**:  
      - Loses \(A \lor B\) bet: no payout.  
      - Wins bet on \(A\) (doesn’t occur, so no payout to bookie).  
      - Wins bet on \(B\) (no payout).  
      Net events: £0. **Total: -£10**.  

    **Agent loses £10 in all cases**.  

  #### Part 2: Does the Dutch Book Prove Irrationality?  
  **Verdict**: The Dutch book does *not* by itself prove the agent’s credences are irrational; it shows they are vulnerable to exploitation *if* the agent accepts bets at their credence-derived odds.  

  **Objection**: Dutch book theorems demonstrate incoherence in *betting behavior*, not credences. An agent may reject auxiliary assumptions:  
  - **Linear utility in money**: Diminishing marginal utility could make losses tolerable.  
  - **Willingness to bet**: The agent might decline bets at "fair" prices due to risk aversion or principle.  
  - **Credences as betting odds**: Credences may not reflect betting dispositions (e.g., belief without commitment to wager).  

  **Rebuttal**: While the objection holds technically, the Dutch book retains normative force. If an agent *claims* their credences reflect fair betting odds (a standard operationalization of subjective probability), inconsistency is exposed. Rejecting all betting avoids exploitation but renders credences empirically unfalsifiable. For agents endorsing the "fair price" interpretation, incoherence implies irrationality by their own lights. The theorem thus *conditionalizes* rationality: **if** you bet at your credences, **then** you are vulnerable. This compels coherence for agents committed to linking belief and betting.  

  #### Part 3: Escape Conditions  
  The Dutch book has no force if:  
  1. **Non-linear utility**: Losses’ disutility is negligible (e.g., £10 is trivial for a billionaire).  
  2. **Betting refusal**: The agent rejects bets at their credence odds (e.g., due to uncertainty about event definability or risk aversion).  
  3. **Credence-betting decoupling**: The agent’s credences are *not* definitions of fair odds (e.g., they are "graded beliefs" untethered to action).  

  Crucially, the agent must *systematically* reject the betting interpretation; else, the bookie exploits ad-hoc inconsistency.  

  ---  
  ### Marking Scheme (20 marks)  
  **Part 1: Dutch Book Construction (7 marks)**  
  - 2 marks: Correct bets (sell on \(A\), sell on \(B\), buy on \(A \lor B\)) with stakes/prices.  
  - 3 marks: Net upfront calculation (-£10).  
  - 2 marks: Case analysis showing loss of £10 in all states.  
  - **Penalties**: Sign errors (-1), incorrect bet directions (-2), failure to show loss in all cases (-2).  

  **Part 2: Normative Force (8 marks)**  
  - 2 marks: Clear verdict (e.g., "not inherently irrational").  
  - 3 marks: Articulating one objection (e.g., credences ≠ betting odds).  
  - 3 marks: Defended rebuttal (e.g., "conditional rationality for betting agents").  
  - **Penalties**: Claiming Dutch books "prove irrationality" absolutely (-3), conceding objection without rebuttal (-2).  

  **Part 3: Escape Conditions (5 marks)**  
  - 3 marks: Two valid escape conditions (e.g., utility non-linearity + betting refusal).  
  - 2 marks: Precision (e.g., "rejection must be systematic, not ad-hoc").  
  - **Penalties**: Vague responses (e.g., "if they don’t care about money") (-2).  

  **Key Distinctions**:  
  - **Top answers (18–20)**: Correct math, nuanced verdict with conditional rationality, precise escape conditions.  
  - **Mid answers (12–15)**: Minor math errors, generic objection/rebuttal, vague escapes.  
  - **Weak answers (<10)**: Failed Dutch book, slogans ("Dutch books = irrational"), no engagement with objections.  

  ---  
  This exam tests mastery of the theorem’s mechanics *and* its philosophical limits, forcing students to confront the gap between formal results and normative claims.
