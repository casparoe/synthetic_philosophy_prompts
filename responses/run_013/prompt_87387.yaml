prompt: |-
  Ok so my mate Dan and I got into it last night about corruption and I need help working out where the actual disagreement lies. Setup: Dan is an anthropology type and his line was that corruption is basically a Western bureaucratic export, that what a customs officer in Lagos calls a gift his counterpart in Berlin calls a bribe, and that the whole anti-corruption business is one culture's public/private distinction being imposed on everyone else. My line was that a minister who loots the school budget so his nephew can buy a Mercedes is corrupt full stop, whatever the local story is. We got nowhere and I think we were sliding between about four different questions without noticing.

  So: your a political philosopher who works on comparative politics and the anthropology of exchange, bring both hats. First brainstorm the fault lines in a few lines, then build me a decision tree I can hand to a seminar.

  The tree should start from the question of whether corruption names a real act-type or only a standpoint, and every node below it should be a question someone can answer without already knowing which position it lands them in. I want the branches to be the real hinges: whether the wrongness is breach of the rules of an office, or undue influence on impartiality, or harm/extraction, or betrayal of people who depend on you; whether the standard is the participants' own understanding of the practice or something external to it; and where the gift/bribe line falls — intent, size, timing, an explicit quid pro quo, or the fact that the recipient holds an office carrying duties of impartiality.

  Two things I want handled properly. (1) A colleague mentioned a two publics idea: in some postcolonial settings there's a civic public inherited from the colonial state and a second public built out of kinship and community obligation, so the same payment is theft against one and duty toward the other. I want that as a live branch, not a footnote. (2) The grease-the-wheels thing — if the payment genuinely makes something happen that otherwise wouldn't, does the counterfactual change the verdict, and does that make it corruption or just a rational response to bad institutions?

  Leaves should be named positions — universalist, legalist/formalist, principal-agent, collective-action/equilibrium, functionalist, particularist-clientelist, the anti-universalist critique, and a thin-core-thick-local compromise — one sentence each on its most awkward commitment. Where your tree produces combinations nobody actually occupies (e.g. timing alone decides the gift/bribe line), mark them empty and say whether that's incoherence, unattractiveness or just nobody having bothered. And flag any two leaves the tree can't separate; I suspect the collective-action view and the anti-universalist view make the same predictions about why campaigns fail while disagreeing about whether they should, so tell me if there's a question that splits them or not. Concrete cases throughout: the carton of cigarettes, the gift to the surgeon after the operation, the nephew hired over a better candidate, the perfectly legal party donation. Aim for nine or ten leaves and don't pad it. Think carefully about the hinges — if a node only sorts labels instead of cases, cut it.
reasoning: |-
  Okay, let me approach this systematically. The user wants a political philosophy/anthropology tool to unpack their debate with Dan about corruption's cultural relativity. Their core frustration is that the argument kept sliding between different dimensions without resolution. 

  First, I need to identify the real fault lines in their disagreement. Dan seems to represent the anthropological particularist view emphasizing cultural context, while the user leans toward universal harm-based condemnation. But the nuances go deeper - it's about ontology (is corruption an objective act or just a perspective?), normativity (what makes it wrong?), and methodology (whose standards apply?). 

  The decision tree must start with the fundamental ontological question: is corruption an objective act-type or merely a labeling practice? This branches into key hinges:
  - For objectivists: what constitutes the wrong? (rule-breaking vs harm vs betrayal)
  - For perspectivists: which perspective defines it? (insider vs outsider)
  Critical sub-branches include the gift/bribe distinction (analyzed through intent, scale, timing etc.) and the "two publics" dilemma where colonial institutions clash with kinship obligations. 

  I'm noting the user's specific demands:
  1) The "two publics" theory must be a main branch, not a footnote
  2) The "grease-the-wheels" efficiency argument needs its own decision node
  Leaf positions should include universalist, legalist, functionalist etc., each with its uncomfortable implication. For example, the universalist must defend cross-cultural harm metrics, while the functionalist must tolerate some corruption as institutional lubrication.

  Special attention to:
  - Marking logically possible but unoccupied branches (e.g. timing alone defining gifts)
  - Flagging where positions predict similar outcomes but differ normatively (e.g. collective-action vs anti-universalist views on anti-corruption failures)
  - Using concrete cases (cigarettes for customs, post-op gifts to surgeons) to ground each node

  The tree will have about 9 leaves - enough for complexity but avoiding padding. Every node must sort actual cases, not just labels. For instance, the "harm vs betrayal" node separates the school budget looter (harm) from the nephew-hiring minister (betrayal) even if both are illegal.
answer: |-
  Here's your decision tree, designed to pinpoint disagreements while forcing concrete case analysis. Fault lines lie in: (1) ontology (real act vs. label), (2) normative basis of wrongness, (3) applicable standard (internal/external), (4) gift/bribe distinction criteria, and (5) institutional context (e.g., "two publics" or efficiency). 

  **Corruption Decision Tree**  
  *(Start at the top; answer each question based on cases)*

  1.  **Does "corruption" name an objective act-type OR merely a label applied from a specific standpoint?**
      *   **If Objective Act-Type:** Go to 2.
      *   **If Merely a Label/Standpoint:** Go to 10.

  2.  **What constitutes the core wrong?**
      *   **Breach of Formal Rules/Office Duties:** Go to 3. *(e.g., Minister violates budget law)*
      *   **Undue Influence on Impartial Decision-Making:** Go to 4. *(e.g., Hiring nephew over better candidate)*
      *   **Harm/Extraction (e.g., reduced public goods, increased costs):** Go to 5. *(e.g., School budget looted)*
      *   **Betrayal of Trust/Dependence:** Go to 6. *(e.g., Citizens rely on minister)*

  3.  **Is the act wrong primarily because it breaks the law/formally defined rules of the office?**
      *   **Yes:** **Legalist/Formalist** - *Awkward: Must condemn legal but harmful acts (e.g., massive legal campaign donation swaying policy).*
      *   **No, the rules might be flawed/unjust:** Go to 2. *(Re-evaluate based on other wrongs)*

  4.  **Does the wrong persist if rules permit partiality (e.g., kinship obligations)?**
      *   **Yes, impartiality is always required:** **Principal-Agent Universalist** - *Awkward: Struggles with contexts where impartiality isn't the expected norm (e.g., "two publics").*
      *   **No, depends on the office's socially understood purpose:** Go to 7.

  5.  **Is the act wrong even if it "greases the wheels" (e.g., customs payment gets goods moving)?**
      *   **Yes, harm/extraction is inherent:** **Harm-Based Universalist** - *Awkward: Must explain why some "efficient" bribes are still wrong (e.g., surgeon demands payment before life-saving op).*
      *   **No, context matters; it can be rational/functional:** Go to 8.

  6.  **Is the betrayal defined by the relationship OR by the office?**
      *   **By the Office/Public Role:** **Principal-Agent** (similar to branch 4) - *Awkward: May conflict with strong kinship duties.*
      *   **By the Relationship (e.g., kinship, community):** Go to 9. *(Leads to "Two Publics")*

  7.  **Whose understanding defines the office's purpose/duties?**
      *   **The Participant's Own Community/Context:** Go to 10. *(Leads to Particularist)*
      *   **An External Standard (e.g., Weberian bureaucracy, democratic ideals):** **Principal-Agent Universalist** (similar to branch 4).

  8.  **Is the act still "corruption," even if functional?**
      *   **Yes, but it's a symptom of bad institutions:** **Collective-Action/Equilibrium** - *Awkward: Tolerates harmful acts as "rational" within broken systems (e.g., systemic bribery).*
      *   **No, it's just a transaction cost/adaptive practice:** **Functionalist** - *Awkward: Legitimizes harmful rent-seeking if "efficient" (e.g., paying to jump hospital queue).*

  9.  **"Two Publics" Context: Does the act fulfill a duty in one public (kinship) while violating the other (civic)?**
      *   **Yes, and the kinship duty is paramount:** **Particularist-Clientelist** - *Awkward: Defends acts widely seen as harmful (e.g., looting school budget for nephew's car).*
      *   **Yes, but the civic duty should prevail:** **Harm-Based Universalist or Legalist** (see branches 5 or 3).
      *   **No clear conflict/Not applicable:** Go to 2/4/5/6 as relevant.

  10. **Whose standpoint defines "corruption"?**
      *   **The Participants/Local Understanding:** **Anti-Universalist Critique** - *Awkward: Risks moral relativism on severe harm (e.g., grand looting).*
      *   **An External Observer/Specific Culture (e.g., "Western" norms):** **Anti-Universalist Critique** (same leaf) - *Awkward: Accused of cultural imperialism.*
      *   **A Minimal Core + Thick Local Context:** **Thin-Core-Thick-Local Compromise** - *Awkward: Fuzzy boundaries; hard to define universal core without imposing (e.g., is "harm" core? whose definition?).*

  **Gift/Bribe Distinction (Applies within Objective Branches - 2-9):**  
  *For an exchange involving an official (e.g., carton of cigarettes to customs officer, gift to surgeon post-op):*

  *   **A. What makes it potentially corrupt?** (Link back to core wrong - 2/4/5/6)
  *   **B. Key Distinction Criteria:**
      *   *Intent (Quid Pro Quo Expected)?* (e.g., gift before surgery vs. after)
      *   *Scale/Value Relative to Norms?* (e.g., carton of cigs vs. car)
      *   *Timing Relative to Action?* (e.g., gift before decision vs. after service)
      *   *Explicit Negotiation?* (Rarely decisive alone - usually combines with A/B/C)
      *   *Office Holders' Duty of Impartiality?* (Fundamental to most objective views - the *office* is key)

  **Empty Branches & Why:**
  *   **Timing alone deciding gift/bribe (B):** Logically possible but incoherent/unattractive. A large "gift" after a favorable decision is still suspect; a small genuine thank you token beforehand might not be. Timing interacts with intent/value/office.
  *   **"Harm" (5) + Functionalist (8):** Incoherent. If harm defines corruption, functional efficiency can't negate it.

  **Positions Predicting Similar Outcomes (e.g., Anti-Corruption Failures):**
  *   **Collective-Action (8)** vs. **Anti-Universalist (10):** *Can the same act be "corrupt" in one context and "functional duty" in another, even if harmful?*
      *   **Collective-Action:** Yes (it's *corrupt* but *rational* within the bad equilibrium). Focus: Institutional reform.
      *   **Anti-Universalist:** Not necessarily "corrupt" at all in the functional duty context; it's mislabeled. Focus: Rejecting external imposition.
      *   **Splitter Question:** *"Is the Lagos customs officer taking a 'token' fundamentally doing something morally different from the Berlin officer doing the same, if both systems expect it as part of compensation?"*
          *   Collective-Action: **No** (same act, different institutional incentives).
          *   Anti-Universalist: **Possibly Yes** (different social meanings/duties).

  **Concrete Cases Mapped:**
  *   **Carton of Cigarettes (Customs):** Hinges on B (Value? Timing? Quid Pro Quo?) within chosen wrong (Harm? Rule-Breaking? Impartiality?).
  *   **Gift to Surgeon Post-Op:** Hinges on B (Intent? Timing? Size?) and core wrong (Betrayal? Impartiality? Harm?).
  *   **Nephew Hired:** Core wrong = Undue Influence (4) or Betrayal (6). "Two Publics" (9) key if kinship duty claimed.
  *   **Legal Party Donation:** Legalist (3) must accept; others (Harm-5, Impartiality-4, Betrayal-6) may condemn. Thin-Core (10) struggles.

  **Handling Key Requests:**
  1.  **"Two Publics":** Embedded as Branch 9, a major hinge after defining betrayal (6) or needing context (7).
  2.  **"Grease the Wheels":** Central to Branch 8 (Functionalist) and a critical test in Branch 5 (Harm Universalist).

  This tree forces disentanglement of ontology, wrongness, perspective, and context, using cases to ground each node. The "awkward commitments" highlight where each position faces tough questions.
