            - How might we fix it? One idea: add "in the absence of interference". But then:
                  - How to define interference? If we define it as something that prevents the manifestation of a genuine disposition, then we are assuming we already know what the genuine dispositions are (circular).
                  - Or if we try to list all interferences, we can't because there are too many and some are unknown.
            - What the game doesn't capture: in the game, we have a base state that defines fragility independently of the tests. But in reality, the disposition is not independent of the counterfactual behavior. The whole point of the dispositional realist is that the disposition just is the power to behave in a certain way in certain circumstances. So the base state in the game is like the categorical basis, and the dispute is about whether we need such a basis or whether the disposition is fundamental.

    This should fit in 60 minutes.
