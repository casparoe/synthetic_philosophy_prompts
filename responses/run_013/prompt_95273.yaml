  ### Dispositions Game: Fragility Investigation  
  **Objective:** Uncover why the simple conditional analysis ("X is fragile iff it would break if struck") fails through hands-on investigation.

  ---

  #### **Materials**  
  - **Object Cards (for Builders):**  
    - Base State: "Fragile" (F) or "Non-Fragile" (NF).  
    - **Intervention Cards (cost 1 token each):**  
      - **Fink Card:** Temporarily alters the object to *non-fragile* the moment it is tested.  
      - **Mask Card:** Prevents breaking *during* the test (even if fragile).  
      - **Mimic Card:** Causes breaking *during* the test (even if non-fragile).  
  - **Tokens:** Poker chips or paper slips (Builders start with 10; Detectives with 20).  
  - **Evidence Log (for Detectives):** To record test results and verdicts.  

  ---

  #### **Rules**  
  1. **Team Roles:**  
     - **Builders (8 students):** Secretly assign a **base state** (F/NF) to each of 4 objects. May attach *one* intervention card per object (pay 1 token per card).  
     - **Detectives (8 students):** For each object, run tests and bet tokens on whether it is **genuinely fragile** (base state = F).  

  2. **Testing Phase (Detectives):**  
     - **Physical Test:** Describe an action (e.g., "drop it"). Builders reveal outcome (break/no break). *If broken, object is destroyed; no further tests.*  
     - **Counterfactual Probe:** Ask "What *would* happen if we did X?" Builders answer truthfully (object not destroyed).  
     - **Cost:** Each test/probe costs 1 token. Max 2 tests per object.  

  3. **Verdict & Betting (Detectives):**  
     - After testing, bet 0–3 tokens on "fragile" or "not fragile."  
     - **Correct verdict:** Win double the bet.  
     - **Wrong verdict:** Lose the bet.  

  4. **Builders’ Payout:**  
     - Earn 2 tokens per object where Detectives’ verdict is *wrong*.  
     - Interventions cost tokens (1 per card).  

  ---

  #### **Timeline (60 Minutes)**  
  | Time  | Activity                                                                 | Details |  
  |-------|--------------------------------------------------------------------------|---------|  
  | 0–5   | **Setup & Team Brief**                                                   | Split into Builders/Detectives. Explain rules (no jargon). Distribute tokens and cards. |  
  | 5–15  | **Builders’ Phase**                                                      | Builders create 4 objects: Assign base state (F/NF), attach interventions (optional; pay tokens). Keep secret. |  
  | 15–40 | **Detectives’ Phase** (25 min for 4 objects, ~6 min each)                | **Per object:** Detectives run tests (physical/counterfactual), log outcomes, place bet. Builders answer tests truthfully. |  
  | 40–45 | **Reveal & Settlement**                                                  | Builders reveal base state and interventions. Settle token payouts. |  
  | 45–60 | **Debrief**                                                              | Map outcomes to philosophy. Discuss why the analysis fails. |  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem:** Detectives rush to physical tests, destroying objects before gathering enough evidence.  
    - **Fix:** Remind them counterfactuals preserve objects. Example: *"Ask ‘what if’ before risking destruction!"*  
  - **Problem:** Builders avoid interventions to save tokens, missing key counterexamples.  
    - **Fix:** Hint: *"Interventions help fool Detectives—earn tokens by being deceptive!"*  
  - **Problem:** Teams debate too long, running out of time.  
    - **Fix:** Enforce strict time limits per object (use a timer).  

  ---

  #### **Debrief (15 Minutes)**  
  **Link Game Outcomes to Philosophy:**  
  1. **Cases Where the Conditional Fails:**  
     - **Fragile but Didn’t Break:** Objects with **Fink** (altered during test) or **Mask** (blocked manifestation).  
       - *Philosophy:* **Finkish dispositions** (object loses fragility when tested) and **masks** (disposition present, manifestation blocked).  
     - **Not Fragile but Broke:** Objects with **Mimic** (false positive).  
       - *Philosophy:* **Mimics** (non-fragile object mimics fragility).  

  2. **Why the Simple Conditional Analysis Fails:**  
     - **False Negatives:** Fragile objects "failed" tests due to Finks/Masks.  
     - **False Positives:** Non-fragile objects "passed" tests due to Mimics.  
     - **Conclusion:** The conditional ("breaks if struck") is *neither necessary nor sufficient* for fragility.  

  3. **The Patching Problem:**  
     - **Proposal:** Fix the analysis by adding "in the absence of interference."  
     - **Why It Fails:**  
       - **Triviality:** "Interference" becomes a catch-all for *any* unexpected outcome, making the analysis unfalsifiable.  
       - **Begging the Question:** Defining "interference" requires *already knowing* what "true" fragility is—which is circular.  
       - *Example:* If a Mimic card is played, is it "interference" or part of the object’s nature? The analysis can’t say.  

  **The One Unreproducible Element:**  
  - In the game, "genuine fragility" is defined by the builders’ base state—a fixed fact. In reality, **whether fragility exists independently of tests is the core dispute**. Dispositional realists say fragility *is* the power (not a hidden base state); skeptics demand categorical bases. The game assumes a "fact of the matter," but philosophy debates its very existence.  

  ---

  **Why This Works:**  
  - Students *discover* counterexamples (Finks, Masks, Mimics) through gameplay.  
  - Token economy incentivizes strategic deception (builders) and evidence-based reasoning (detectives).  
  - Debrief explicitly ties mechanics to formal counterexamples, exposing the conditional’s flaws and the futility of "interference" patches.  

  Run this, and the failures of the simple conditional analysis will be unforgettable!
