   1. Finkish Dispositions: The disposition is present but the counterfactual fails because of an interfering condition that would remove the disposition exactly when the test is performed.
   2. Mimics: The disposition is absent but the counterfactual holds because of an interfering condition that would cause the manifestation even without the disposition.
   3. Antidotes (or masks): The disposition is present but the counterfactual fails because the manifestation is blocked even when the test is performed.

   In the activity:
   - We have two teams: Builders and Detectives.
   - Builders create objects (each represented by a hidden card) and have three types of intervention cards (which they can play at a cost) that correspond to the counterexamples:
