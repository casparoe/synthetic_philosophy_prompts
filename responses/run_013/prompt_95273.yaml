          Effect: The object is fragile until the test, then becomes non-fragile during the test, then reverts. So it doesn't break when tested.
       b. Masking card: Blocks the breaking during the test (antidote). The object remains fragile but doesn't break when tested because of the mask.
       c. Mimic card: The object is not fragile, but when tested, the card causes it to break (mimicry).

