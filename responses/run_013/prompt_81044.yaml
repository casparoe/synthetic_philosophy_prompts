answer: |-
  ### Core Mapping
  - **Ulysses contracts** → Capability revocation with hard timelocks  
  - **Constitutional entrenchment** → Immutable contracts + quorum signatures  
  - **Second-order preferences** → Admin key hierarchy (root > delegate keys)  
  - **Weakness of will** → Preventing override of runtime constraints  
  - **External enforcer** → Trust anchor / hardware security module (HSM)  

  ---

  ### Residue Report  
  **Clean Translations**  
  - *Timelocks* map perfectly to time-bound precommitments (e.g., 24-hour screen lock). No residue.  
  - *Quorum signatures* directly model supermajority requirements. Voting mechanics are isomorphic.  
  - *Immutability* ≡ irrevocable clauses. Both assume persistence by design.  

  **Distorted Translations**  
  - **Capability revocation**: Maps to self-binding but assumes *explicit resource surrender*. Philosophers debate whether mental acts (e.g., "I commit") constitute revocation. Distortion: Engineering requires cryptographic proof; philosophy allows intentionality as "soft revocation."  
  - **Principal identification**: Your tools treat "self" as a single root admin. Philosophy disputes temporal identity: Is future-you a distinct principal? Residue: *No sysdesign concept for "self-partition."*  
  - **Bindingness**: Your tools rely on external HSMs (enforcers). Philosophy questions if self-binding *without* externals is coherent. Distortion: Engineering assumes enforcers are neutral; philosophers see them as *agency-transfer*.  

  **Unmapped Residue**  
  1. **Dead hand problem**: No sysdesign equivalent for "should past selves constrain future agency?" Gap: Engineering optimizes for *enforcement*, not legitimacy. Deficiency in your vocab.  
  2. **Second-order preferences as internal conflict**: Your "admin key hierarchy" models control delegation, not *value conflicts* (e.g., sober-you vs. drunk-you). Residue: Philosophy’s "divided self" lacks a state-machine model. Gap: Original concept is fuzzier than it appears.  
  3. **Revocation legitimacy**: Sysdesign allows recovery keys (override mechanisms). Philosophy asks *should you* override? Residue: Ethics of "sudo rights" over past commitments has no counterpart.  

  ---

  ### Embedded Assumptions in Engineering  
  - **Principal persistence**: Your tools assume "you" are a continuous entity (single root key). Philosophy rejects this (Parfit’s teletransport paradox).  
  - **Revocation by default**: Timelocks auto-expire; bylaws allow amendments. Philosophers see this as *denying precommitment validity*.  
  - **Binding requires externals**: Your stack implicitly endorses Hobbes—true self-binding needs an external HSM. Philosophy’s internalist camp (e.g., Kantians) has no analog here.  

  ### Key Insight  
  Your vocabulary *resolves* philosophical disputes operationally:  
  - **Admin keys** define "self" as current root holder.  
  - **Immutability** accepts the dead hand by design.  
  - **HSMs** answer enforcement debates decisively.  
  The gaps highlight where philosophy questions engineering’s axioms—not where your model fails.  

