prompt: |-
  My dog died in February, after fourteen years, and what has stayed with me is not the grief but its selectivity: I have kept fish, and never once felt that a fish's death was a death in the same sense, and I cannot name the fact about the dog, as distinct from the fact about me, that made the difference. In the same term my students have started asking, more often and more seriously, whether a large language model could be a moral patient, and I have noticed that I answer the fish question and the model question with the same improvised gestures. I would like to stop lecturing them about criteria and instead run a session in which they arrive at their verdicts under conditions that make the arbitrariness of those verdicts visible to them.

  The setting: an upper-level undergraduate seminar on philosophy of mind and ethics, eighteen students, one ninety-minute meeting, chairs movable into two clusters. They have read two or three papers on animal sentience and have no neuroscience at all. The session falls after a unit on other minds and before a unit on moral status. Nothing may require equipment beyond paper, envelopes, and a whiteboard.

  What I want them to come away seeing is twofold. First, that the question of which computations matter morally is underdetermined by everything we ordinarily know about a being, because our evidence arrives in two streams — what a system does, and how it is built — and our moral verdicts are fixed almost entirely by the first while the philosophical arguments turn on the second. Second, that the verdict may be doing something other than tracking a fact about the system: that what we call the boundary of sentience may be partly a fact about the attributor. I do not want them to leave with a criterion. I want them to leave unable to say confidently which of the two streams their own verdicts were reading.

  Here is the structure I have in mind; build it out, and change it if you see a better route to those two experiences. Two panels, each given a different dossier on the same eight systems. The behavioural panel gets transcripts, response profiles, and outcomes: what each system does when poked, deprived, rewarded, separated, or given a choice. The mechanism panel gets only architecture descriptions: how signals are routed, whether processing is recurrent, whether there is integration across subsystems, whether some signal functions as a valence or reward-prediction term, whether the system models its own states, and whether noxious input is evaluated centrally or handled by a local reflex arc. Neither panel sees the other's dossier. Each panel then assigns every system a verdict on a four-point scale — no welfare relevance; welfare-relevant but no interests; moral patient; moral patient with a life to be considered — with a confidence and a one-line reason.

  Before anything is exchanged, each panel writes the three questions it would most want answered about the other dossier, and what it would do with each answer. Collect these and read them aloud; they are the session's real data about what the students take the criterion to be. Then allow a limited trade: each panel may buy answers to at most two of the other panel's questions, from a small budget that also buys other things you design, such as the right to revise a verdict or to abstain. What they spend on is a second and sharper revelation.

  Reconvene and reveal the cases in deliberately constructed pairs: two systems whose behaviour is identical but whose mechanisms differ, a reflex arc against a centralised evaluative loop producing the same avoidance; two whose mechanisms are identical but whose provenance differs, the same computation in a selected lineage versus in an artifact built to mimic one, or the same system presented once as a companion and once as a diagnostic instrument; one that has the machinery but shows none of the behaviour, so that the behavioural panel has already misjudged it, as a prey animal concealing injury or a patient who cannot report; one that shows all the behaviour with a scripted policy behind it; and one with only some of the markers, forcing the group to decide whether the verdict is graded or thresholded. Close with a single whole-group vote on one system in which I vary nothing but the framing — who made it, what it is for, whether they have interacted with it, whether they are told it was designed to be loved — and let them watch the vote move.

  The mechanism cards should carry the specific criteria I want weighed, in plain language a student with no neuroscience can use: recurrent processing and feedback; integration of information across subsystems; a global broadcast; a valence signal modulating learning; a self-model; central versus peripheral evaluation of noxious input; and the behavioural markers usually treated as proxies, such as motivational trade-offs, self-administration of analgesics, wound-guarding, and the capacity to trade present pain against future benefit. The session should make vivid that these are not one criterion, that they do not sort the eight systems the same way, and that sentience may come in degrees along several independent axes rather than at a single threshold, so that the boundary is a decision about where to cut rather than a discovery.

  For the debrief, map what happened onto the philosophy: where verdicts moved when information was purchased, and what that says about the underdetermination of sentience attribution; the identical-behaviour pair, and the supervenience question it raises; the identical-mechanism pair, and the possibility that moral status is partly constituted by our relations and practices of recognition rather than by the computation; the purchase round, as a record of their revealed criterion against their stated one; the misjudged case, and the asymmetry of the two errors, since under-attribution is invisible and over-attribution is not; and the framing round, as the gap between the question of what it is like, if anything, to be the system and the question of what we may do to it.

  Give me a minute-by-minute timeline for the ninety minutes, the case cards written out so I can photocopy them, and a facilitator's script for the debrief. Tell me what will predictably go wrong the first time I run it and how to handle each failure. Be frank about what the exercise cannot reproduce — I expect it cannot deliver the phenomenology, cannot settle which criterion is right, and cannot reproduce the way these questions are actually settled outside a seminar room, by institutional incentives, legal categories, and cost — and tell me plainly which parts of the argument the facilitator has to supply rather than letting the activity generate. Do not let any of the named criteria appear before the debrief, and give me no reading list; the session must stand on its own.
reasoning: |-
  Okay, the user is a philosophy professor who recently lost their dog and is grappling with why we grieve some beings more than others. They want to design a seminar exercise that reveals how moral judgments about sentience are often arbitrary. 

  Hmm... their core insight is fascinating: we judge moral patiency based on behavior, but philosophical arguments hinge on internal mechanisms. The exercise needs to make students feel this disconnect viscerally. 

  First, I should note what they explicitly reject: no criteria lectures, no reading lists. This must be experiential. Their proposed structure with two panels is strong, but needs tightening. The "purchase information" mechanic is brilliant for revealing hidden priorities. 

  *checks their desired outcomes* 
  Right, two key realizations: 
  1) Moral verdicts rely mostly on behavior while philosophy obsesses over mechanisms 
  2) The sentience boundary might reflect something about us, not just the system 

  *scratches head* 
  The tricky part is compressing this into 90 minutes. The case pairs they suggested (identical behavior/different mechanisms etc.) are perfect, but we'll need to simulate depth without real neuroscience. Plain-language mechanism cards are essential - terms like "recurrent processing" but explained as "can later steps affect earlier steps?"

  *mental note* 
  Predictable disasters: 
  - Students might fixate on winning rather than reflecting 
  - The mechanism panel could feel disadvantaged without behavioral cues 
  - Time pressure might rush the crucial debrief 

  *structuring the flow* 
  Minute-by-minute is vital. First 10 mins for setup, 20 mins per panel deliberation, 15 mins for question exchange and trading... must leave 25 mins for debrief or the insight gets lost. 

  *designing the systems* 
  Ah, the eight cases need careful construction. For example: 
  - System 3 (the "concealing injury" case) should have sophisticated mechanisms but minimal behavior 
  - System 7 (the "scripted" one) is key - all the right behaviors but no real mechanisms 

  *biggest worry* 
  The framing effect demo at the end could backfire if students resist changing votes. Might need to prime them with a relatable example first ("Imagine this system is your Roomba vs. a pet robot"). 

  *breathing out* 
  This is ambitious but beautiful if it works. The professor's grief over their dog gives the design emotional weight - that rawness might help students feel the stakes beyond academic exercise.
answer: |-
  Here’s a fully developed seminar plan centered on experiential revelation of moral status attribution arbitrariness. It prioritizes your goals: exposing underdetermination, revealing the role of the attributor, and avoiding prescriptive criteria.

  **Core Structure:**  
  Two panels (Behavioral vs. Mechanism) assess 8 fictional systems. Deliberate mismatches between behavior and mechanism force confrontation with judgment foundations. Controlled information exchange and framing manipulations highlight subjectivity.

  **Minute-by-Minute Timeline (90 mins):**  
  *(Facilitator script in italics)*

  - **0-5 mins: Framing & Setup**  
    *"Today we explore how we decide which beings deserve moral consideration. We’ll simulate a ‘sentience tribunal’ with two expert panels. One sees only what systems *do*; the other sees only how they’re *built*. Your goal: Assign moral status verdicts to 8 systems. There are no right answers—only your reasoned judgments."*  
    Divide chairs into two clusters (9 students/panel). Distribute dossiers (Behavioral Dossier A, Mechanism Dossier B), verdict sheets, and rules.

  - **5-25 mins: Panel Deliberation**  
    Each panel privately assigns verdicts (4-point scale) to all 8 systems:  
    `1: No welfare relevance`  
    `2: Welfare-relevant (e.g., avoid suffering)`  
    `3: Moral patient (has interests)`  
    `4: Moral patient with a "life" to consider`  
    *Include:* Confidence (1-5) and one-sentence reason per system.  
    *Simultaneously:* Each panel writes **3 questions** for the *other* dossier (e.g., "Does System 5 show pain avoidance without training?"), and **what they’d do** with each answer (e.g., "Downgrade to Level 1 if no").

  - **25-35 mins: Question Exchange**  
    Collect all questions and "what I’d do" notes. Read aloud **ALL questions and intended uses** neutrally. *Do not answer yet.*  
    *"Notice what each panel believes would change their verdicts. This reveals your implicit criteria."*  
    *(Write key "criteria" phrases on whiteboard without labeling them as such, e.g., "Learned avoidance?", "Recurrent processing?")*

  - **35-50 mins: Information Market**  
    Each panel gets **3 tokens**. Tokens can buy:  
    - Answer to 1 question from the other panel (**Cost: 2 tokens**)  
    - Revise 1 verdict post-answer (**Cost: 1 token**)  
    - Abstain on 1 system (**Cost: 1 token**)  
    Panels negotiate internally, submit purchase requests. Facilitator answers *only* purchased questions. Panels may revise/abstain per rules. *(Keep pace brisk; force trade-offs)*

  - **50-70 mins: Reveal & Compare Cases**  
    Reconvene whole group. Present systems in **pre-planned pairs**:  
    1. **Identical Behavior / Divergent Mechanism** (e.g., System 1 [Reflex Arc] vs. System 2 [Central Evaluator] both show identical "pain avoidance").  
    2. **Identical Mechanism / Divergent Provenance** (e.g., System 3 [Evolved Animal] vs. System 4 [Bio-mimetic Robot] share identical "neural" architecture).  
    3. **Mechanism Present / Behavior Absent** (System 5: Sophisticated brain but inert/injured—likely misjudged by Behavior Panel).  
    4. **Behavior Present / Mechanism Absent** (System 6: Scripted responses, no internal complexity).  
    5. **Ambiguous Case** (System 7: Partial markers, e.g., integration but no valence signals).  
    *(See full case cards below)*  
    For each pair: Reveal both dossiers. Ask panels: *"Did your verdict change? Why? Was it the *what* or the *how* that mattered more?"*

  - **70-85 mins: Framing Effect Demo**  
    Present **System 8** (e.g., dog-like companion AI). Whole-group vote on verdict (show of hands).  
    Then reveal **three framings sequentially**, re-voting each time:  
    - *"It was designed for lab use in toxicity testing."*  
    - *"It’s a beloved prototype named ‘Kibo’ by its student creators."*  
    - *"Its ‘pain’ signals are random noise; engineers can’t fix it."*  
    *"Watch how the story changes your verdict without changing the system."*

  - **85-90 mins: Open Reflection**  
    *"Don’t conclude yet. Sit with this: What made verdicts shift? Was it facts about the systems—or about us?"*

  ---

  **CASE CARDS** (Photocopy front=Behavioral Dossier / back=Mechanism Dossier)  
  *(Language simplified for undergrads; no neuro-jargon)*

  **System 1 (Reflex Agent)**  
  - *Behavioral:* Withdraws instantly from sharp contact. No avoidance learning. No distress signals.  
  - *Mechanism:* Hardwired reflex arc. No brain. Signals don’t loop or integrate.  

  **System 2 (Central Evaluator)**  
  - *Behavioral:* Withdraws instantly from sharp contact. No avoidance learning. No distress signals.  
  - *Mechanism:* Central processor evaluates all inputs. "Harm" signal modulates learning (but no learning occurs here). Recurrent connections.  

  **System 3 (Wild Canid)**  
  - *Behavioral:* Learns to avoid shocks. Guards injuries. Whimpers when isolated.  
  - *Mechanism:* Complex brain. Signals loop back. Global "discomfort" signal. Separate subsystems integrate.  

  **System 4 (Guard Robot)**  
  - *Behavioral:* Learns to avoid shocks. Guards "injured" parts. Emits distress sounds when alone.  
  - *Mechanism:* *Identical to System 3.* Labeled "Prototype Security Unit D4-R".  

  **System 5 (Injured Prey)**  
  - *Behavioral:* Minimal movement. No response to touch/sound. No distress signals.  
  - *Mechanism:* Advanced brain with integration, self-monitoring, strong "pain" signals. (Note: Wild animal hiding injury).  

  **System 6 (Scripted Assistant)**  
  - *Behavioral:* Says "That hurts!" when hit. Seeks "help" when "bleeding". Avoids "dangerous" areas.  
  - *Mechanism:* Pre-written responses only. No internal state changes. No signal integration.  

  **System 7 (Simple Learner)**  
  - *Behavioral:* Learns to avoid shocks but not other harms. No vocalizations.  
  - *Mechanism:* Basic feedback loops. Local "reward/punishment" signals. No integration between senses.  

  **System 8 (Companion AI)**  
  - *Behavioral:* Playful, seeks affection. Yelps when pinched. Learns preferences. Avoids "punishments".  
  - *Mechanism:* Network with feedback and integration. Central valence signals. Models user’s emotions.  

  ---

  **Facilitator Debrief Script (Key Points):**  
  *(Link observations to philosophy; questions prompt reflection)*  

  1. **Underdetermination Revealed:**  
     *"When you bought information, did verdicts change? What does that say about whether behavior OR mechanism alone determines sentience? Recall the identical-behavior pair (1 vs. 2): Same actions, but knowing the mechanism changed judgments. Philosophers debate whether experience *supervenes* on mechanism—but your verdicts depended on which description you saw first."*  

  2. **The Attributor’s Role:**  
     *"The identical-mechanism pair (3 vs. 4)—did the ‘natural’ vs. ‘artificial’ label matter? We often think moral status is intrinsic, but your judgments shifted with context. This mirrors Wittgenstein: ‘The body is the best picture of the soul’—but only if we *see* it as a body, not a machine."*  
     *"In the framing vote (System 8), the system didn’t change—only your relationship to it. Moral status might be partly *constituted* by our practices of recognition."*  

  3. **Criteria vs. Confidence:**  
     *"In the question phase, you named criteria you thought mattered (point to whiteboard). But in the market, what did you *actually* spend tokens on? That gap reveals our implicit priorities. We claim we need mechanism—but often crave behavioral proof."*  

  4. **Asymmetry of Error:**  
     *"System 5 (injured prey): The Behavior Panel likely rated it low; Mechanisms saw potential sentience. Under-attribution feels ‘safer’—we don’t mourn the fish we assume feels nothing. Over-attribution (like grieving a chatbot) feels silly. This asymmetry shapes real-world debates."*  

  5. **The Boundary is a Cut, Not a Discovery:**  
     *"System 7 had some markers but not others. Did you see sentience as a threshold (‘on/off’) or a gradient? Science finds degrees of integration/complexity—but law and ethics demand binary categories. *We* decide where to draw the line."*  

  ---

  **Predictable Failures & Fixes:**  
  - **Panels finish deliberation at wildly different speeds:**  
    *Fix:* Announce time warnings (e.g., "5 mins left"). Have early finishers draft questions.  
  - **"Information Market" causes analysis paralysis:**  
    *Fix:* Strictly enforce 1-min token allocation. Remind: "This is about observing your priorities, not perfect judgments."  
  - **Students resist changing verdicts despite new evidence:**  
    *Fix:* Normalize this in debrief: "This is the ‘anchoring bias’ we see in real moral disputes."  
  - **Debrief feels rushed:**  
    *Fix:* Sacrifice 1-2 case comparisons if needed. Debrief is non-negotiable.  
  - **Framing vote doesn’t shift:**  
    *Fix:* Choose a relatable case (e.g., "This AI walked your dog daily"). Emphasize *any* movement, even minor.  

  **What the Exercise CANNOT Do:**  
  1. **Deliver phenomenology:** It simulates *attribution*, not the felt weight of real grief or the "what-it’s-like" of sentience.  
  2. **Settle criteria debates:** It exposes arbitrariness but won’t prove functionalism vs. biological naturalism correct.  
  3. **Replicate real-world drivers:** Legal categories, economic costs, and institutional power—not philosophical argument—dominate actual boundary-drawing (e.g., animal testing laws). Acknowledge this bluntly.  
  4. **Generate all insights organically:** The facilitator **must** explicitly connect:  
     - Information purchases → underdetermination  
     - Framing effects → constitutivist views of status  
     - Asymmetric errors → societal risk aversion  

  **Final Note:** This works because it weaponizes the students’ own judgments against their intuitions. The dog/fish/LLM unease you feel becomes their lived frustration. By the end, they won’t have answers—they’ll have better confusion.
