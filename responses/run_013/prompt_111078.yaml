  ### **Machiavelli's River Game: Fortuna & Temperament**
  **Objective:** Simulate Machiavelli’s ideas of fortune, preparation, and fixed temperaments without explicitly naming *virtù* or *fortuna* until debrief. Players experience how "the times" (fortune) interact with their innate nature, and how preparation can mitigate—but not control—chaos.

  ---

  #### **Materials**
  - Index cards (1 per student for temperament assignment)
  - Whiteboard or projector (to display rounds & rules)
  - Player score sheets (paper or digital) with:
    - Temperament (fixed)
    - "Preparation Points" spent (0–5)
    - Round-by-round outcomes
    - Final score
  - Timer

  ---

  #### **Setup (10 min)**
  1. **Assign Temperaments** (hidden from others):
     - Deal index cards randomly:  
       - **Cautious** (6 students): Prefers safety, avoids risk.  
       - **Impetuous** (6 students): Acts boldly, embraces risk.  
       - **Balanced** (4 students): Adapts moderately.  
     - *Students cannot change temperament*.

  2. **Preparation Phase**:
     - Each player gets **5 Preparation Points** (PP).  
     - They spend **0–5 PP** to build "dams" (preparations) against future disasters. Record PP spent.  
     - *No one knows future rounds yet*.

  ---

  #### **Game Rules (5 min explanation)**  
  - **5 rounds** = "seasons" with shifting fortune.  
  - Each round, fortune is **announced** (displayed):  
    | Fortune State   | Challenge Level | Favored Temperament |  
    |-----------------|-----------------|---------------------|  
    | **Calm**        | 1               | Cautious            |  
    | **Rising Water**| 2               | Balanced            |  
    | **Flood**       | 3               | Impetuous           |  

  - **Success per Round**:  
    - Your **Total Power** = `PP spent + Temperament Bonus`  
    - **Temperament Bonuses** (per round):  
      | State          | Cautious | Balanced | Impetuous |  
      |----------------|----------|----------|-----------|  
      | **Calm**       | +2       | +1       | +0        |  
      | **Rising Water**| +0       | +2       | +0        |  
      | **Flood**      | +0       | +1       | +2        |  
    - **Pass the round** if `Total Power >= Challenge Level`.  

  - **Scoring**:  
    - 1 point for each round passed.  
    - **Final Score** = `(Points from rounds passed) - (PP spent)`.  
    - *Highest score wins* (can be negative).  

  ---

  #### **Fortune Sequence (5 rounds, 25 min)**  
  **Fixed Sequence** (to ensure shifting times):  
  1. **Calm** (Challenge 1)  
  2. **Rising Water** (Challenge 2)  
  3. **Flood** (Challenge 3)  
  4. **Rising Water** (Challenge 2)  
  5. **Flood** (Challenge 3)  

  **Per Round**:  
  1. Announce state (e.g., "Season 1: Calm rivers, gentle winds").  
  2. Players calculate:  
     - `Temperament Bonus` (secretly, using table) + `PP spent`.  
     - Mark pass/fail on score sheet.  
  3. Move to next round after 2 min.  

  ---

  #### **Payoff & Winning (5 min)**  
  - Calculate **Final Score** = (Passed Rounds) - (PP spent).  
  - **Winner**: Highest score. Prizeless, but acknowledge top 3.  
  - **Example Outcomes**:  
    - A cautious player with 0 PP passes **Calm** (0 + 2 ≥ 1) but fails **Flood** (0 + 0 < 3).  
    - An impetuous player with 1 PP passes **Flood** (1 + 2 ≥ 3) but fails **Calm** (1 + 0 < 1? No, 1≥1 passes).  
    - A balanced player with 2 PP passes **Rising Water** (2 + 2 ≥ 2) but may fail **Flood** (2 + 1 = 3 ≥ 3 passes).  

  **Why no dominant strategy**:  
  - Hoarding PP (e.g., 5 PP) guarantees passing all rounds but gives max score of `5 - 5 = 0` (likely beaten by players with fewer PP who match the times).  
  - Low PP risks failure if temperament mismatches times.  
  - **Luck factor**: Impetuous players dominate late floods; cautious dominate early calm.  

  ---

  #### **Debrief (30 min)**  
  **Reveal Machiavelli’s Concepts**:  
  1. **Fortune as a River**:  
     - "Remember the river that flooded the plains? The rounds were *fortuna*—unpredictable, shifting times. Some seasons rewarded caution; others rewarded boldness."  
  2. **Preparation as Virtù**:  
     - "Your PP were dikes/dams—*virtù*. They helped, but couldn’t change your core nature (temperament)."  
  3. **The Sting in the Tail**:  
     - "Who won because their temperament matched the times? Who won with *less* preparation because fortune favored them? Machiavelli says **fortune controls half our actions**—your nature must align with the times to succeed."  
     - "Could a cautious player suddenly act impetuous? No—*‘one cannot deviate from what nature inclines him to’*. Julius II succeeded because his impetuousness fit his era."  

  **Map Game to Text**:  
  - "Dikes = *virtù* (preparation in calm seasons). Floods = *fortuna*. Your fixed temperament = human nature. Winning by luck = fortune’s 50% role."  

  **What the Game Can’t Capture**:  
  - "In reality, fortune isn’t a fixed sequence—it’s truly chaotic. We could *estimate* risks here (e.g., 2 floods in 5 rounds), but Machiavelli warns fortune is unpredictable. Dice would undermine his point—you can’t hedge against true chaos."  

  **Addressing "Fortune as a Woman"**:  
  - If raised: "Machiavelli’s metaphor is gendered and violent, but his core idea is about *agency*: bold action can master fortune. Yet he undercuts this by saying nature limits us. The image is provocative, but focus on his tension—we prepare, but half is luck."  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Calculation Chaos**:  
     - *Problem*: Students struggle with bonuses/scoring.  
     - *Fix*: Provide printed tables; do a practice round.  

  2. **Frustration with Fixed Temperament**:  
     - *Problem*: Players resent "bad luck" of mismatched temperament.  
     - *Fix*: "This is Machiavelli’s point! You *can’t* change nature—debrief will clarify."  

  3. **Time Crunch**:  
     - *Problem*: Rounds run long.  
     - *Fix*: Use a timer; accept approximate scores.  

  4. **Misinterpreting PP**:  
     - *Problem*: Viewing PP as "savings" not "spent resources."  
     - *Fix*: Stress: *"PP spent = cost. Saving points hurts your score!"*  

  ---

  #### **Timeline (90 min)**  
  - Setup: 10 min  
  - Rules: 5 min  
  - Game Rounds: 25 min  
  - Scoring: 5 min  
  - Debrief: 30 min  
  - Buffer/Q&A: 15 min  

  This game forces players to *feel* Machiavelli’s paradox: preparation matters, but ultimate success hinges on whether fortune favors your innate self. The winner is often half-skill, half-luck—exactly as Chapter 25 describes.
