  Okay, the user is writing a science piece for a general magazine about whether culture can cause social or economic outcomes. They want a set of criteria to evaluate such theories, beyond just rehashing Weber's Protestant ethic thesis. Let me unpack their main requests.

  First, they need a clear list of requirements for any "culture-as-cause" theory. The user specifically wants phenomena to account for, cases to get right, distinctions to maintain, and consistency with other fields. Each requirement should have its rationale, plus whether it's non-negotiable or debatable. 

  Second, they're struggling with three distinctions: values as content vs. their widespread enforcement vs. selection filters. I need to clarify if these are distinct explanations and if any theories blur them. Also, they want to know how to rule out third-variable problems (like institutions causing both values and outcomes), and if any requirement particularly kills popular but weak theories.

  Third, they want a brief note on how different theoretical families (exogenous values, cultural equilibria, institutional reductionism) fare against these criteria. 

  Finally, they want to know where consensus exists and where scholars genuinely disagree. No false smoothing—flag live debates even if they undermine apparent common ground.

  Hmm, the trickiest part is that distinction triad. Let me think:
  - Content (what the value says) vs prevalence (how many hold it) vs function (how it operates as a system-level filter) are indeed different. For example, a value like "thrift" could exist as content but not affect behavior if rarely practiced; its prevalence might explain collective outcomes like high savings rates; or it could act as a filter if communities punish spendthrifts even if no one internally values thrift. Weber arguably conflates content and prevalence.

  For third-variable issues, the toughest requirement is demonstrating causal asymmetry—showing culture isn't just reflecting institutions. The "timing and persistence" criterion does heavy lifting here, but it's hard to prove with historical data.

  Consensus-wise: most agree you need mechanism specification and to avoid cherry-picking cases. But they fight bitterly over whether values can ever be truly exogenous, and whether functional explanations (culture as problem-solver) are valid. Also, the whole "institutions vs culture" debate is a minefield.

  The user's smart to ask for unsettled points—they'll avoid sounding naive. I should emphasize that no theory satisfies all criteria perfectly, and that the selection-filter vs motive distinction is both crucial and often fudged. 

  For the requirements list, non-negotiables should include mechanism specification, directionality evidence, and accounting for heterogeneity. Preferences might include whether to prioritize quantitative vs qualitative evidence. 

  On popular accounts: many fail the "no cherry-picking" test or can't handle reversals (e.g., why Catholic regions developed similarly to Protestant ones later). The material-incentives crowd would say most cultural theories flunk the third-variable requirement.

  Better structure this tightly. I'll start with the three distinctions, then the criteria with rationales, then the scorecard for theory families, and end with consensus/contested points. The "impossible trinity" near the end will show why this is so thorny—you can't easily have culture be both measurable, causal, and irreducible.
answer: |-
  Here is a distilled set of criteria for evaluating any "culture-as-cause" thesis, designed to serve as your analytical toolkit. The requirements are organized by core challenge, with rationales, negotiability flags, and explicit attention to your two focal points.

  ### Core Requirements for a "Culture-as-Cause" Explanation

  1.  **Mechanism Specification (Non-Negotiable)**
      *   **What:** The theory must articulate *how* specific values translate into observable actions, institutional forms, or economic patterns. It cannot merely assert correlation.
      *   **Why:** Correlation ≠ causation. Without mechanism, the explanation is descriptively hollow and vulnerable to "just-so" storytelling.
      *   **Your Distinction:** Must clarify *which* mechanism is proposed:
          *   *Content-as-Motive:* Value X directly motivates individual action Y (e.g., "Thrift leads to saving").
          *   *Prevalence/Enforcement-as-Coordination:* The *fact* that value X is widely held/enforced creates norms, reduces transaction costs, or enables collective action not otherwise possible (e.g., "Widespread trust enables complex contracts").
          *   *Value-as-Filter:* Value X acts systemically, not motivationally, to select *for* practices/institutions congruent with X and *against* incongruent ones, often through reinforcement or punishment (e.g., "A societal emphasis on conformity filters out innovative but deviant practices").
      *   **Note:** These *are* distinct claims with different evidentiary needs. Many popular accounts (including simplified versions of Weber) ambiguously slide between them. A robust theory must commit to one primary mechanism or rigorously integrate them.

  2.  **Directionality & Third-Variable Exclusion (Non-Negotiable)**
      *   **What:** The theory must demonstrate that values precede the outcome *and* are not themselves primarily caused by the very institutions, legal systems, or material conditions they purportedly explain. Must actively rule out reverse causality or joint causation by a third factor (Z).
      *   **Why:** The central critique: Are values truly causal, or are they epiphenomenal (shaped by institutions/material realities) or reciprocal? This is the Achilles' heel of many cultural arguments.
      *   **Key Tool:** Evidence of *timing and persistence*. Do the values appear *before* the institutional/economic shift? Do they persist *despite* changes in material conditions that should alter them if they were purely adaptive? (e.g., Do Protestant values predate Northern European economic divergence? Do they persist in immigrant communities facing different material incentives?).
      *   **Does Most to Rule Out Popular Accounts:** This requirement directly targets the most common and potent counter-argument (institutions/materialism as the *real* cause). Accounts failing here are often dismissed as "folk sociology."

  3.  **Heterogeneity & Contradiction Accounting (Non-Negotiable)**
      *   **What:** The theory must explain variation *within* the cultural group (not all members act "according to culture") and account for cases where the *same* purported values co-exist with *different* outcomes, or *different* values co-exist with the *same* outcome.
      *   **Why:** Cultures are not monolithic. Failure to address internal dissent, subgroup variation, or contradictory cases suggests oversimplification or cherry-picking.
      *   **Key Cases:** Must plausibly address:
          *   Why some groups sharing the "core" values don't exhibit the expected outcome.
          *   Why groups with seemingly opposing values sometimes achieve similar outcomes.
          *   How values interact with other factors (class, geography, power) to produce variation.

  4.  **Scope & Boundary Definition (Non-Negotiable)**
      *   **What:** Clearly define the cultural group and the specific values in question. Specify the *limits* of the claimed causal effect – under what conditions does it hold, and where does it break down?
      *   **Why:** Vague definitions of "culture" or "values" invite post-hoc reasoning. Knowing the boundaries prevents overgeneralization and clarifies testability.
      *   **Note:** Must avoid reifying "culture" as a static, homogenous blob. Requires historical or comparative grounding.

  5.  **Consistency with Cognitive & Behavioral Science (Strong Preference / Near-Negotiable)**
      *   **What:** The proposed mechanisms (especially motive-based ones) must be plausible given what we know about human cognition, motivation, social learning, and decision-making.
      *   **Why:** Cultural explanations that rely on implausible psychology (e.g., hyper-rational actors perfectly internalizing abstract values) are suspect. Insights from behavioral economics, social psychology, and neuroscience constrain possible mechanisms.
      *   **Negotiability:** Specific interpretations of findings can be debated, but outright contradiction of robust consensus (e.g., the power of situational incentives, cognitive biases) is fatal.

  6.  **Accounting for Change & Exogenous Shocks (Strong Preference)**
      *   **What:** How does the theory explain *changes* in outcomes if core values are stable? How do values themselves change in response to major exogenous events (war, famine, technological disruption, conquest)?
      *   **Why:** Cultures aren't static. A theory treating them as prime movers must grapple with their evolution and vulnerability/resilience to external forces. Failure suggests cultural determinism.

  7.  **Avoiding Cherry-Picking / Handling Disconfirming Cases (Non-Negotiable)**
      *   **What:** The theory must engage seriously with historical or contemporary cases that appear to contradict it, not just highlight confirming examples. Must address major anomalies within its claimed scope.
      *   **Why:** Essential for intellectual honesty and falsifiability. Many popular cultural arguments thrive on selective evidence (e.g., ignoring successful Catholic-majority economies post-Weber).

  ### The "Impossible Trinity" of Culture-as-Cause?
  Achieving all non-negotiables simultaneously is profoundly difficult:
  *   **Precision** (clear mechanism, defined scope) often clashes with **Generality** (broad explanatory power).
  *   Establishing **Directionality** (values causing institutions, not vice-versa) with historical evidence is inherently messy and contested.
  *   **Mechanism Specification** (especially motive-based) is hard to empirically verify at scale without relying on proxies or inference.
  No current theory fully satisfies all criteria perfectly, creating the space for ongoing debate.

  ### How Major Theoretical Families Fare (Briefly)

  1.  **Values as Exogenous Causes (Weberian/Classical):**
      *   **Strengths:** Clear on content-as-motive (usually), strong on narrative.
      *   **Weaknesses:** Often struggles *severely* with Directionality (reverse causality), Heterogeneity, and Change. Vulnerable to cherry-picking. Mechanism often underspecified/psychologically naive.

  2.  **Culture as Equilibrium (Game Theoretic / Repeated Interaction):**
      *   **Strengths:** Excellent on Prevalence/Enforcement-as-Coordination mechanism. Often handles Heterogeneity (multiple equilibria possible). Strong on internal consistency.
      *   **Weaknesses:** Can struggle with Directionality/Exogeneity (how did *this* equilibrium start?). Values-as-content often become epiphenomenal to the equilibrium. Can be functionalist (assuming culture solves problems). Hard to empirically distinguish from institutional explanations.

  3.  **Institutional Reductionism ("Values Explain Nothing"):**
      *   **Strengths:** Masters Directionality by making institutions/material factors primary. Often strong on Change via institutional shifts.
      *   **Weaknesses:** Struggles to explain *why* specific institutions emerge/stick in some places and not others *without* reference to norms/values (often smuggling culture back in). Can downplay the independent causal force of widely shared beliefs and their persistence *despite* institutional change. Poor at explaining value *content*.

  ### Settled vs. Contested Ground

  *   **Settled (Broad Consensus):**
      1.  **Correlation ≠ Causation:** No serious scholar accepts mere correlation as proof.
      2.  **Mechanism is Essential:** Hand-waving about "culture" without *how* it works is inadequate.
      3.  **Heterogeneity Exists:** Cultures aren't monoliths; internal variation must be addressed.
      4.  **Values Matter *Somehow*:** Few deny values/norms *influence* behavior; the dispute is over *how much* and *in what way* relative to institutions/material factors.
      5.  **Cherry-Picking is Bad:** Engaging disconfirming evidence is mandatory.

  *   **Genuinely Contested (Live Disagreements):**
      1.  **Primacy/Causal Weight:** Can values *ever* be truly exogenous/prime movers, or are they *always* shaped by/materially adaptive to institutions/environment? (**The core rift**).
      2.  **Directionality Evidence:** What constitutes valid evidence that values caused institutions and not vice-versa? (Historical precedence? Persistence through disruption? Natural experiments? All are contested methods/conclusions).
      3.  **The Status of "Functional" Explanations (Value-as-Filter):** Is explaining culture by its societal effects (e.g., "this value persists because it's functional for the group") valid causal reasoning, or is it tautological/teleological? Deeply divisive.
      4.  **Defining & Measuring "Values":** How to rigorously define and measure abstract values independently of the behaviors/institutions they supposedly cause? Can surveys capture deep cultural drivers? Is behavior the only valid measure (making the argument circular)?
      5.  **Scope of Cultural Explanation:** Can "culture" explain large-scale, long-term divergence (like the Industrial Revolution), or is it better suited to micro-level behavior or explaining persistent differences *within* similar institutional frameworks? Disagreement reigns.
      6.  **The Existence of "Deep Culture":** Are there slow-moving, foundational cultural traits inherited over centuries that constrain institutional paths? Or is this essentialist and ahistorical? (See: Enduring debates on "Asian Values," "Latin American Culture").

  Use this framework to dissect any cultural explanation. The friction points—especially Directionality, Mechanism Ambiguity, and the Institutional Counter—are where the most revealing critiques (and potential insights) lie. Good luck with the piece!
