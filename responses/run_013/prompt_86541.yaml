  ### Decision Procedure for Sentience Classification  
  This procedure operationalizes the committee's four indicators into a step-by-step flowchart. Officers with no neuroscience training can execute it in ~90 minutes using submitted documents (experimental data, behavioral observations, system specifications). The result is a tier classification (Tier 0: no review; Tier 1/2/3: escalating protections) or a referral to the full committee for value-based judgments. The procedure prioritizes objective, observable evidence and minimizes subjectivity until unavoidable.  

  #### Key Definitions  
  - **Tier 0**: No review required. Entity is exempt from welfare protocols.  
  - **Tier 1**: Minimal review (e.g., basic record-keeping for insects).  
  - **Tier 2**: Moderate review (e.g., environmental enrichment for decapods).  
  - **Tier 3**: High review (e.g., anesthesia requirements for vertebrates/AI).  
  - **Referral**: Handed to the full committee when evidence is ambiguous or conflicts with value-based premises.  

  ---

  ### The Procedure  
  **Order**: Sequential steps. Stop early if Tier 0 is reached. Proceed only if prior step is passed.  

  #### **Step 1: Aversive Responsiveness (Indicator i)**  
  - **Ask**: Does the entity act to terminate or avoid a noxious stimulus (e.g., heat, electric shock) beyond mere withdrawal?  
  - **Sufficient Evidence**:  
    - Documented behavior (e.g., video, logs) showing active avoidance (e.g., fleeing, pressing a lever to stop shock).  
    - Reflexes (e.g., automatic withdrawal) are insufficient. Must show goal-directed action.  
  - **What it is evidence for**: Basic capacity to detect and respond to harm. Indicates a behavioral avoidance mechanism.  
  - **What it is not evidence for**: Sentience or suffering (could be a hardwired reflex).  
  - **Examples**:  
    - Thermostat: Passes if it shuts off heat when overheating (terminates stimulus).  
    - Plant: Fails (e.g., Mimosa folds leaves but doesn’t actively avoid; reflex only).  
    - Bacterium: Fails (chemotaxis is withdrawal, not termination).  
  - **Outcome**:  
    - Fail → Tier 0, stop.  
    - Pass → Proceed to Step 2.  

  #### **Step 2: Motivational Trade-off (Indicator ii)**  
  - **Ask**: Will the entity forgo a reward (e.g., food) or endure a cost (e.g., crossing barriers) to avoid the stimulus?  
  - **Sufficient Evidence**:  
    - Experiments showing trade-offs (e.g., entity chooses avoidance over food when both are offered; pays energy cost to escape).  
    - Context must involve competing motivations (e.g., hunger vs. pain avoidance).  
  - **What it is evidence for**: The stimulus has negative valence that can outweigh other drives. Suggests motivational complexity.  
  - **What it is not evidence for**: Conscious suffering (could be an optimized algorithm).  
  - **Examples**:  
    - Thermostat: Fails (no competing rewards/costs).  
    - Plant: Fails (no trade-offs; growth responses are fixed).  
    - Bacterium: Fails (no evidence of cost-based decisions).  
  - **Outcome**:  
    - Fail → Tier 0, stop.  
    - Pass → Proceed to Step 3.  

  #### **Step 3: State-Dependence (Indicator iii)**  
  - **Ask**: Is avoidance modulated by internal states (e.g., analgesics, fatigue, prior experience)?  
  - **Sufficient Evidence**:  
    - Data showing changed behavior under modulators (e.g., morphine reduces avoidance; habituated entity ignores once-harmless stimulus; hungry entity tolerates more pain for food).  
    - Must rule out reflex decay (e.g., repeated stimuli causing sensor fatigue).  
  - **What it is evidence for**: A persistent internal state (e.g., pain-like state), not just reflexes.  
  - **What it is not evidence for**: Subjective experience (could be biochemical adaptation).  
  - **Examples**:  
    - Thermostat: Fails (no internal state modulation).  
    - Plant: Fails (habituation in Mimosa is biochemical, not state-based).  
    - Bacterium: Fails (adaptation is fixed, not state-modulated).  
  - **Outcome**:  
    - Fail → Tier 0, stop.  
    - Pass → Proceed to Step 4.  

  #### **Step 4: Integrative Unity (Indicator iv)**  
  - **Ask**: Do signals from (i)-(iii) converge on a single state guiding behavior across contexts?  
  - **Sufficient Evidence**:  
    - Avoidance generalizes to new situations (e.g., heat avoidance affects foraging/social behavior).  
    - Same modulator (e.g., analgesic) affects multiple aversive behaviors.  
  - **What it is evidence for**: Centralized processing (e.g., a "global" aversive state), implying potential sentience.  
  - **What it is not evidence for**: Consciousness (could be distributed computation without unity).  
  - **Handling Special Cases**:  
    - **Passes i-iii but fails iv**: Avoidance is context-specific (e.g., separate circuits for heat/shock). Indicates fragmented processing → Refer to committee (borderline case).  
    - **Passes iv vacuously**: Entity is too simple to have multiple circuits (e.g., one sensor/effector). Not evidence for unity → Treat as "fail" for tier assignment.  
  - **Outcome**:  
    - Fail (or vacuous pass) → Refer to committee with evidence.  
    - Pass (non-vacuous) → Proceed to Step 5.  

  #### **Step 5: Substrate Question**  
  - **Ask**: Does the entity have a substrate plausibly supporting sentience (e.g., nervous system, neural network)?  
  - **Sufficient Evidence**:  
    - Biological: Presence of neurons/synapses (confirmed via anatomy reports).  
    - AI: Adaptive architecture (e.g., deep reinforcement learning with feedback loops).  
    - *Exclusions*: Thermostats (simple circuits), plants (no neurons), bacteria (no neural analogs).  
  - **What it is evidence for**: Physical capacity for indicators i-iv.  
  - **What it is not evidence for**: Sentience (substrate is necessary but not sufficient).  
  - **Outcome**:  
    - Fail → Tier 0, stop.  
    - Pass → Assign tier:  
      - **Tier 1**: Simple substrate (e.g., insect brain, small neural cluster).  
      - **Tier 2**: Moderate substrate (e.g., decapod ganglion, vertebrate limbic system).  
      - **Tier 3**: Complex substrate (e.g., mammalian cortex, advanced AI with global workspace).  
      - *Officer uses predefined examples (e.g., committee’s taxonomy) for consistency. Ambiguous cases → Refer to committee.*  

  ---

  ### Case Studies  
  **Case 1: Drosophila Genetics Lab (Noxious-Heat Assay)**  
  - **Step 1**: Flies flee heat (beyond reflex) → Pass.  
  - **Step 2**: Starved flies avoid heat despite food presence → Pass.  
  - **Step 3**: Morphine reduces avoidance; habituated flies ignore non-damaging heat → Pass.  
  - **Step 4**: Heat avoidance generalizes to other contexts (e.g., foraging) → Pass (non-vacuous).  
  - **Step 5**: Insect brain (simple substrate) → **Tier 1** (minimal review).  
  - **Why committee won’t like it**: Drosophila are used in vast numbers (~millions/lab). Tier 1 triggers paperwork that could overwhelm labs. *Procedure ignores scale; committee may downgrade based on pragmatism.*  

  **Case 2: Shrimp Farm (Low-Tier Classification Request)**  
  - **Step 1**: Shrimp swim away from noxious chemicals → Pass.  
  - **Step 2**: Shrimp avoid predators despite hunger → Pass.  
  - **Step 3**: Analgesics reduce escape behavior; stress hormones alter responses → Pass.  
  - **Step 4**: Aversive state affects mating/foraging → Pass (non-vacuous).  
  - **Step 5**: Decapod ganglion (moderate substrate) → **Tier 2** (moderate review, e.g., water quality checks).  
  - **Why farm protests**: Shrimp are farmed at scale (~billions/year). Tier 2 is costly. *Procedure does not adjust for abundance; committee must weigh welfare against economics.*  

  **Case 3: Building-Control AI (Avoids Punishment Signal)**  
  - **Step 1**: AI adjusts HVAC to terminate "overheating" signal → Pass.  
  - **Step 2**: AI sacrifices energy efficiency to avoid punishment → Pass.  
  - **Step 3**: Avoidance modulated by "fatigue" algorithms (e.g., trades off punishment tolerance for battery conservation) → Pass.  
  - **Step 4**: Punishment signals integrate across contexts (e.g., affects security/lighting decisions) → Pass (non-vacuous).  
  - **Step 5**: Deep reinforcement learning architecture (complex substrate) → **Tier 3** (high review, e.g., shutdown protocols).  
  - **Why committee might object**: Withdraws protection? No—*but this case forces Tier 3, which the committee may reject for AI. Procedure treats AI equally; committee may value biological life higher.*  

  **Case 4: Cultured Neural Tissue (Committee Would Protect, but Procedure Fails)**  
  - **Step 1**: Tissue fires neurons in response to toxins but no coordinated avoidance → Fail → **Tier 0**.  
  - **Why committee disagrees**: Neural tissue is a sentience substrate. *Procedure misses "potential" sentience without behavior.*  

  ---

  ### Handling Enormous Numbers  
  - **Procedure**: Ignores population size. Focuses on *per-entity* evidence.  
  - **Why**: Sentience is an intrinsic property; scale is irrelevant to classification.  
  - **Practical Mitigation**:  
    - Officers note expected scale in the report.  
    - Committee downgrades tiers *after* classification for high-volume entities (e.g., Tier 1 → Tier 0 for insects) based on feasibility. This is a value judgment, not evidence.  

  ---

  ### Limitations and Systematic Errors  
  1. **Where it cannot decide**:  
     - **Step 4 (integrative unity) fails but i-iii pass**: Referral required (e.g., distributed systems like octopus arms).  
     - **Step 5 (substrate) ambiguous**: e.g., cultured neurons or novel AI → Referral.  
     - **Conflicting evidence**: e.g., some studies show trade-offs, others don’t → Referral.  

  2. **Value judgments disguised as facts**:  
     - **Step 5 (substrate)**: "Plausible" is value-laden (e.g., is a neural network "enough"?).  
     - **Tier assignment**: Tier 1/2/3 thresholds imply moral weight (e.g., insect vs. mammal suffering).  
     - **Ignoring passive sentience**: Entities that cannot exhibit avoidance (e.g., paralyzed) auto-fail Step 1 → Tier 0, even if conscious.  

  3. **Systematic errors**:  
     - **False negatives**: Misses sentience without behavioral markers (e.g., anesthetized entities).  
     - **False positives**: Overprotects simple systems (e.g., thermostats pass Step 1; advanced AI passes all).  
     - **Anthropocentrism**: Favors pain-avoidance; ignores positive welfare (e.g., joy).  

  ### Graded Sentience vs. Thresholds  
  - **Inconsistency**: The committee’s premise (graded sentience) clashes with the tier system (discrete thresholds).  
  - **Resolution**: The procedure *implicitly* assumes a threshold (Steps 1-3) for minimal sentience. Steps 4-5 add gradation (Tier 1/2/3).  
  - **Recommendation**: State openly in writing that **Tier 0 is a threshold for non-sentience**, while Tiers 1-3 reflect degrees. This balances practicality with graded theory.  

  ---  
  **Final Output**: A published report with evidence summaries, step-by-step outcomes, and clear tier/referral decision. Litigation-ready due to transparency and predefined criteria.
