  So let's run a **fourth case: cultured neural tissue**

  - Step 1: Aversive Responsiveness  
    - Neural tissue in a dish might show electrical activity in response to noxious stimuli, but not coordinated action to terminate or avoid. So no.
  - Stop: Tier 0.

  But the committee might want to protect it because it is neural tissue that could be the substrate of sentience. The procedure withdraws protection.

  **Where the procedure cannot decide:**
  - When Step 4 is vacuously passed (very simple entities) and the substrate is present (e.g., a simple nematode with a nervous system but no central integration). The officer refers to committee, so it's decided there.

  **Value judgments:**
  - Step 5 (substrate) is a value judgment about what counts as a plausible substrate.
  - The decision to have thresholds at Steps 1-3 is a value judgment: it assumes that sentience requires aversive behavior and that without these behaviors, there is no need for protection.

  **Systematic errors:**
  - May fail to protect passive sentient entities (e.g., those that cannot exhibit avoidance due to paralysis).
  - May extend protection to entities that mimic sentience without actually experiencing it (e.g., advanced AI).

  **Graded Sentience and Tiers:**
  - The procedure is consistent with graded sentience by allowing the committee to assign tiers based on the strength of evidence. The committee can have a tier system that reflects degrees (e.g., more indicators passed -> higher tier). However, the office does assume a threshold for requiring review (passing 1-3 and substrate). This threshold should be stated in writing.

  **Final Procedure Write-up**

  The case officer will:

  1. **Step 1: Aversive Responsiveness**  
     - Review the submitted documents for evidence that the entity acts to terminate or avoid a noxious stimulus beyond mere withdrawal.  
     - Sufficient evidence: Experimental data or observational reports showing goal-directed avoidance (e.g., escaping, turning away, lever pressing).  
     - If absent: Classify as Tier 0 (no review required) and stop.  
     - If present: Proceed to Step 2.

  2. **Step 2: Motivational Trade-off**  
     - Review for evidence that the entity will forgo a competing reward or pay a cost to avoid the stimulus.  
     - Sufficient evidence: Experiments showing choices between aversive stimuli and rewards/costs (e.g., leaving food to avoid heat).  
     - If absent: Tier 0, stop.  
     - If present: Proceed to Step 3.

  3. **Step 3: State-Dependence**  
     - Review for evidence that avoidance is modulated by analgesics, prior exposure, or competing drives.  
     - Sufficient evidence: Data showing changes in avoidance under these conditions (e.g., reduced avoidance with analgesics, habituation, or changes when hungry).  
     - If absent: Tier 0, stop.  
     - If present: Proceed to Step 4 and Step 5.

  4. **Step 4: Integrative Unity** (record for committee)  
     - Review for evidence that the aversive signals converge on a single state that guides behavior across contexts.  
     - Sufficient evidence: Consistent avoidance across contexts, generalization, or the same modulator affecting multiple aversive behaviors.  
     - Note: If the entity is so simple that it has only one circuit, then it may vacuously pass (but note that).  
     - Outcome: Record as present (non-vacuous), present (vacuous), or absent.

  5. **Step 5: Substrate**  
     - Review the entity's physical basis:  
       - For biological entities: Does it have a nervous system? (If yes, plausible.)  
       - For AI: Is it a complex, adaptive neural network? (If yes, plausible; if a simple program, no.)  
     - If the substrate is not plausible: Tier 0, stop.  
     - If the substrate is plausible: Refer the entire file (including the Step 4 assessment) to the full committee for tier assignment.

  **For entities in enormous numbers:**  
  - The officer does not consider population size in the procedure. If the entity requires committee review, the officer notes the expected scale of use in the referral. The committee may adjust the tier based on practical considerations (a value judgment).

  **Cases Summary:**

  - **Drosophila**: Passes 1-3, substrate plausible -> refer to committee (likely Tier 1).  
  - **Shrimp**: Passes 1-3, substrate plausible -> refer to committee (likely Tier 2).  
  - **AI building agent**: Passes 1-3, substrate plausible -> refer to committee (tier assignment may be controversial).  
  - **Cultured neural tissue**: Fails Step 1 -> Tier 0 (which may withdraw protection from something the committee would protect).

  **Conclusion:**
  The procedure is a practical tool that uses the committee's indicators. It makes explicit the threshold (passing Steps 1-3 and having a plausible substrate) for referral, which is consistent with the graded sentience premise by allowing the committee to assign tiers based on the evidence strength. However, the office should state in writing that the procedure sets a threshold for review based on behavioral and substrate criteria, and that the committee's tier assignment will reflect degrees of sentience.
