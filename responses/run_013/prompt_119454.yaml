prompt: |-
  I'm a fourth-year PhD student midway through a chapter on the doing/allowing distinction, and I've hit a construction problem I can't solve by staring harder at the usual examples. My suspicion — and I want the case to test it rather than assume it — is that the line between doing and allowing does no independent work: once the cases are cleaned up, it turns out to be a proxy for either causal authorship (whose agency put the threat into the world) or the intended/foreseen line. The trouble is that in the familiar cases all three run together and nothing gets tested. The well-worn pair in which one man holds a child under the water while another stands by a bath and lets a child drown he could easily have pulled out makes both men intend the death, and it makes the author of the threat the one who moves his body. What I need from you is a case in which these criteria are pulled apart, and pulled apart in opposite directions, so that the doing/allowing line ends up alone on one side of the ledger. So: two agents, one ordinary scenario, in which the agent who comes out worse by the doing/allowing criterion is the better of the two by the intended/foreseen criterion, and the agent who merely allows the death is the one who intends it. The first agent does something that kills the victim, but only as a foreseen side effect of an end she actually has; the second keeps still, and her stillness is the means by which she gets what she wants, which is the victim's death. Hold everything else as fixed as you can: the same outcome and the same badness, alternatives equally available to both, no special role duties (no on-duty lifeguard, no parent), no prior relationship to the victim (a competent adult stranger to both), neither agent cruel or gloating, and the causal facts as close to symmetric as the world allows, so that neither contribution is the more decisive one and no verdict can be read off causation. Let the hazard be one that neither of them made — a natural one — so that authorship is neutral between them and the doing/allowing line has to carry the case on its own. The omission should also be sustained rather than a lapse: I want the second agent to have to keep not acting, so that even calling it an omission is already a bit of a stretch.

  Then do the checks. Give me the scenario in a single paragraph and no longer. For each of the following, state the verdict about the two agents' relative blameworthiness and the reasoning that yields it, so that I can see the case doing the work rather than the labels: the bare act/omission distinction; the doing/allowing distinction, which I take to be a different animal; authorship of the threat; the intended/foreseen distinction; a straight consequentialist accounting; and the difference between negative and positive duties. Say which of these agree, which one gives the ranking I've engineered, and whether any criterion is left with nothing to say. Then tell me which single feature of the case is doing the work, and what happens when I remove it: give me the variant in which both agents merely foresee the death, the variant in which both intend it, and the variant in which the hazard exists only because of something the omitting agent did earlier while the acting agent is a pure bystander — in each case say whether the scenario keeps its bite or collapses back into the familiar pair, and, for the third, whether the doing/allowing verdict survives when authorship shifts to the agent who merely allows. I'd also like the one-agent version, one person who both does the fatal thing and fails to do the saving thing in the same episode, and your judgement on whether anything is lost in the compression. Finally, put yourself on the other side: if I were a defender of the doing/allowing distinction, how would I attack this case? The obvious lines are that the intended/foreseen distinction doesn't apply to omissions at all, or that I have misdescribed the second agent's stillness as an omission when it is really an action under another description; say whether either line works and what the case would have to do to close it off. If some of my constraints cannot all be met at once, tell me which one has to give and why, rather than fudging the scenario to fit. No citations or reading lists — I know the literature and will attach the references myself.
reasoning: |-
  Okay, the user is a fourth-year PhD student working on the doing/allowing distinction in ethics. They've hit a conceptual roadblock and need a thought experiment that isolates the doing/allowing distinction from other factors like causal authorship and intention. 

  First, let's unpack their core request: they want a scenario where the agent who "allows" harm is more blameworthy (by intending it) while the agent who "does" harm is less blameworthy (merely foreseeing it). All other factors must be neutralized—same outcome, no special duties, natural hazard, symmetric causality. 

  Hmm... the challenge is making stillness deliberately instrumental while keeping the acting agent's behavior merely consequential. The bath example they referenced is too symmetrical. Need something where inaction directly serves a goal while action is collateral damage. 

  The lightning rod idea clicks: Agent 1 diverts a hazard away from themselves but foresees it hitting Victim. Agent 2 deliberately doesn't pull a lever to save Victim because they want them dead. Both have equal power to prevent harm, but Agent 2's inaction is the chosen method for murder. 

  Checking constraints: 
  - Natural hazard (lightning) satisfies authorship neutrality. 
  - Causality is symmetric—both could equally prevent death. 
  - Agent 1's harm-causing is foreseen but unintended (their goal is self-protection). 
  - Agent 2's inaction is sustained (must maintain lever position) and intentional (death is means to inheritance). 
  - No role duties or prior relationships. 

  Now testing philosophical criteria: 
  - Bare act/omission: Would naively condemn Agent 1 more for acting. 
  - Doing/allowing: Should condemn Agent 2 more if it's independent. 
  - Authorship: Neutral per design. 
  - Intended/foreseen: Clearly condemns Agent 2. 
  - Consequentialism: Equal blame. 
  - Negative/positive duties: Mixed verdict. 

  The key is Agent 2's intention being fulfilled by inaction. If we make both foresee harm, blame equalizes. If both intend, Agent 1 becomes worse. If Agent 2 created the hazard, doing/allowing might override authorship. 

  Single-agent version: An engineer who both diverts lightning (foreseeing Victim's death) and deliberately doesn't pull the lever. This compresses cleanly—double blame highlights how doing/allowing alone doesn't track blameworthiness. 

  Defense counterarguments: 
  - "Omissions can't be intended" → but intention applies to goals achieved via omission. 
  - "Not pulling lever is an action" → only if we define physical movement, but stillness is omission in context. 

  The vulnerability is whether "sustained stillness" feels like genuine omission. Could strengthen by making the lever require active holding-down to prevent harm, so releasing it is an action. But that might overcomplicate. 

  Ultimately, this case isolates doing/allowing by making intention the variable while fixing other factors. If it holds, it suggests doing/allowing isn't doing independent work—it's either tracking intention or authorship.
answer: |-
  Here is the scenario engineered to your specifications:

  **Scenario:** Victor is hiking when a sudden lightning storm strikes. Two strangers are present: Alex and Blair. A metal rod (Victor's only possible shelter) stands equidistant between two safe zones. Alex, fearing for her own life, pushes Victor toward Blair's safe zone, foreseeing this exposes him to a lethal strike but intending only to secure her own shelter. Blair, who wants Victor dead for inheritance reasons, deliberately remains still rather than pulling Victor into her own safe zone—knowing her stillness ensures his death. Both could easily have saved Victor by pulling him into their respective zones, but neither did. Victor is struck and killed. The lightning is natural, causal contributions are symmetric (both individually necessary/sufficient for death), and no special duties exist.

  ---

  **Verifications & Verdicts:**

  1.  **Bare Act/Omission Distinction:**  
      *Alex* (pushes Victor) performs an act causing death. *Blair* (remains still) omits to act.  
      **Verdict:** Alex is worse (acts are worse than omissions).  
      **Reasoning:** The bare distinction privileges physical movement over stillness, condemning Alex more.

  2.  **Doing/Allowing Distinction:**  
      Alex *does* something (pushes Victor) that kills him. Blair *allows* Victor to die by not pulling him to safety.  
      **Verdict:** Alex is worse (doing harm is worse than allowing harm).  
      **Reasoning:** Framing Alex as actively introducing the fatal sequence condemns her more than Blair's passive failure to intervene.

  3.  **Authorship of the Threat:**  
      The lethal threat (lightning) is natural. Alex's push *redirects* Victor into an existing threat. Blair's stillness *fails to remove* Victor from the threat.  
      **Verdict:** Neutral/Equal Blame.  
      **Reasoning:** Neither *created* the threat. Both manipulated Victor's relation to it equivalently. Authorship doesn't distinguish them.

  4.  **Intended/Foreseen Distinction:**  
      Alex *foresees* Victor's death but intends only her own safety. Blair *intends* Victor's death, using her stillness as the means.  
      **Verdict:** Blair is worse (intending harm is worse than merely foreseeing it).  
      **Reasoning:** Blair's malice and the death being her goal make her culpability significantly greater.

  5.  **Straight Consequentialist Accounting:**  
      Outcome: Victor dies. Actions: Both contributed equally and necessarily to death. Alternatives: Both had equally easy, effective alternatives to save him.  
      **Verdict:** Equal Blame.  
      **Reasoning:** Only the result and the availability of better options matter; both failed identically to produce the best outcome.

  6.  **Negative vs. Positive Duties:**  
      Alex violates a *negative duty* not to harm (by pushing Victor into danger). Blair violates a *positive duty* to aid (by not pulling Victor to safety).  
      **Verdict:** Ambiguous/Mixed.  
      **Reasoning:** Negative duties are often seen as stricter, favoring condemning Alex. However, Blair's violation is more culpable due to intention. Neither criterion cleanly resolves the case alone.

  **Summary of Agreement/Disagreement:**
  *   **Agree on Alex Worse:** Bare Act/Omission, Doing/Allowing.
  *   **Agree on Blair Worse:** Intended/Foreseen.
  *   **Neutral/Equal:** Authorship, Consequentialism.
  *   **Ambivalent:** Negative/Positive Duties.
  *   **Engineered Ranking Achieved:** The Doing/Allowing verdict (Alex worse) is isolated *against* the Intended/Foreseen verdict (Blair worse). Authorship & Consequentialism are silent. Negative/Positive duties don't clearly align with either.

  **The Key Feature Doing the Work:** Blair's *intentional use of sustained inaction as the chosen means to achieve the death*. Her stillness isn't just failing to prevent death; it's the *mechanism* by which she brings it about to fulfill her goal. This separates intention from the doing/allowing framing.

  **Variants:**

  1.  **Both Merely Foresee:** Blair also only foresees Victor's death as a result of her stillness; she intends only to avoid exertion.  
      **Effect:** Collapses. Both now merely foresee death. Authorship/consequentialism might condemn Alex slightly more for acting, but the stark contrast vanishes. Blame is similar, potentially equal. Doing/allowing might still condemn Alex more, but intention no longer pulls the other way.

  2.  **Both Intend:** Alex pushes Victor *in order to* kill him (e.g., also for inheritance), while Blair still intends death through stillness.  
      **Effect:** Collapses. Alex now acts *and* intends harm. Doing/allowing (Alex worse) and intention (both bad, Alex potentially worse by acting) align. Resembles the bath case.

  3.  **Blair Authors Threat, Alex Bystander:** Alter backstory: Blair set a trap earlier (e.g., a hidden wire) making Victor trip towards the strike zone. Alex is a pure bystander who sees Victor falling and deliberately doesn't pull him to safety (foreseeing death but not intending it, perhaps wanting to avoid risk).  
      **Effect:** **Bite Remains?** Doing/allowing (Alex merely allows) suggests Alex is less blameworthy. Authorship (Blair created threat) suggests Blair is worse. Intention (neither intends here) is neutral. **Does doing/allowing verdict survive?** Yes, but weakly. Authorship strongly condemns Blair, potentially overriding the doing/allowing intuition that Alex's omission is less bad. The case tests the *priority* between authorship and doing/allowing when they conflict.

  **One-Agent Version:** An engineer (Taylor) is in the storm near Victor. To secure her own shelter, she pushes Victor away from her zone, foreseeing this exposes him to the strike. Simultaneously, she could easily pull him into the adjacent safe zone she controls, but she deliberately refrains because she wants him dead (inheritance).  
  **Judgement:** Compression works. Taylor is doubly culpable: blameworthy for the harmful act (foreseen consequence) and *more* blameworthy for the omission (intended means). Nothing significant is lost; it highlights how one agent's blame can stem from distinct sources mapped onto act/omission.

  **Defender's Counterarguments & Rebuttals:**

  1.  **"Intentions don't apply to omissions; omissions lack the mental state component."**  
      *Attack:* Blair didn't *do* anything intentional *to* Victor; she just had a wish. Intention requires action.  
      *Rebuttal:* Intention applies to *goals* and *chosen means*. Blair *chose* stillness *because* it would achieve her goal of Victor's death. Her omission was deliberate instrumentality. The case requires Blair's stillness to be *sustained* and *goal-directed action under a description* ("not-pulling-to-cause-death").  
      *Closing it off:* Emphasize Blair's *control* and *awareness*: she must consciously maintain her position, actively resisting any impulse to act, *for the purpose* of causing death. This makes the omission a deliberate strategy.

  2.  **"Blair's 'stillness' isn't a true omission; not pulling the lever is an *act* of refusal/participation."**  
      *Attack:* In crucial moments, "doing nothing" is a deliberate bodily action (maintaining posture, not moving muscles). Blair *acted* to ensure death by her bodily configuration.  
      *Rebuttal:* This dissolves the act/omission distinction entirely. If *any* bodily state counts as "action," then all "omissions" vanish. The distinction relies on a contrast between moving one's body to interfere and *not* moving it to prevent. Blair's *physical* behavior is indistinguishable from mere inattentiveness; what makes it culpable is the *reason* for it (intention) and the *context* (duty/ease).  
      *Closing it off:* Stress the physical symmetry to mere passive bystanders. Blair isn't *actively* blocking rescue or holding Victor down; she's *not* performing a specific, readily available rescue motion. Her culpability stems from the *decision not to act* + intention, not a positive physical contribution.

  **Constraint Trade-off:** The hardest constraint is ensuring **causal symmetry** while keeping the **omission sustained and intentional**. Making both contributions *individually necessary and sufficient* is slightly artificial but achievable (as in the lever setup). Making the omission purely passive ("just standing there") while ensuring it's *instrumental* requires careful framing (hence the lever pull being the obvious, easy, specific rescue action Blair refrains from). The "stretch" in calling it an omission is inherent but necessary for the test. This is the constraint under the most tension, but it holds if we accept that refraining from a specific, easily performed action *can* be a deliberate instrumental omission.
