  Below is a decision tree designed to guide users from their verdicts on specific cases (like the test items) to named positions in the philosophy of medicine. The branch nodes are built from the questions that split the conceptual landscape, not position labels. Empty cells indicate where no named position fits, with a brief explanation. The tree has **8 nodes** and separates all major positions except **harmful-dysfunction hybrid** and **whole-person/vital-goals view**, which it cannot fully distinguish (flagged at the end).

  ---

  ### Decision Tree: Is "Disease" Descriptive or Evaluative?

  #### Test Cases for Verdicts (Use to Answer Questions):
  1. **Harmless anatomical variant** (e.g., extra rib with no effects).  
  2. **Metabolic quirk** (problematic only on specific diets).  
  3. **Short sight** (correctable with lenses).  
  4. **Adult lactose intolerance** (in a dairy-consuming society).  
  5. **Ordinary aging** (treated as undesirable).  
  6. **Deafness** (in a hearing-normative society).  

  ---

  #### Tree Structure:
  1. **Is a value judgment *built into the analysis* of disease, or is it only a typical consequence?**  
     - **Built-in (evaluative)**: Go to Q2.  
     - **Consequence only (descriptive)**: Go to Q3.  

  2. **What kind of "function" must a disease involve a failure of?**  
     - **Evolutionary selected effect** (e.g., an organ not performing its evolved purpose): Go to Q4.  
     - **Whatever the organ is there to do in context** (e.g., enabling goals like seeing or digesting): Go to Q5.  
     - **Statistical species-typicality** (e.g., deviation from population norms): → *Empty*  
       *Why?* No major hybrid/normativist theory uses *only* statistics—it’s typically paired with harm or goals.  

  3. **Is the bearer of health the body's *parts* or the *whole person's* ability to pursue life goals?**  
     - **Body's parts** (e.g., organs/systems failing statistically typical functions): → **Plain naturalism** (e.g., Boorse).  
       *Test cases aligned*: Short sight (disease), metabolic quirk (disease if dysfunctional), lactose intolerance (disease if atypical).  
     - **Whole person**: → *Empty*  
       *Why?* Value-free views focus on biological parts; whole-person accounts require value-laden goals.  

  4. **Is the dysfunction independent of societal context?**  
     - **Yes** (e.g., the organ is broken regardless of environment): → **Harmful-dysfunction hybrid** (e.g., Wakefield).  
       *Test cases aligned*: Deafness (disease if harmful + dysfunctional), lactose intolerance (disease if harmful + dysfunctional).  
     - **No** (e.g., dysfunction arises only in specific contexts): Go to Q6.  

  5. **Is the job to analyze the *ordinary concept* or *engineer* one for clinics/insurers?**  
     - **Ordinary concept**: → **Whole-person/vital-goals view** (e.g., Nordenfelt).  
       *Test cases aligned*: Aging (disease if it blocks vital goals), metabolic quirk (disease only on problematic diets).  
     - **Engineer**: → *Empty*  
       *Why?* Engineering a pragmatic concept collapses into pluralism or normativism—no unique position here.  

  6. **Is there one core concept of disease or a plural cluster?**  
     - **One concept**: → **Straight normativism** (e.g., value-based views).  
       *Test cases aligned*: Aging (disease if undesirable), deafness (not a disease if accepted).  
     - **Plural cluster**: → **Pluralism** (e.g., Cooper).  
       *Test cases aligned*: Harmless variant (not a disease in some contexts), metabolic quirk (disease only in clinical contexts).  

  ---

  #### Flagged Unseparable Leaves:
  - **Harmful-dysfunction hybrid** (Q4 → "Yes") and **whole-person/vital-goals view** (Q5 → "Ordinary concept") cannot be fully distinguished by this tree.  
    - **Why?** Both require harm + dysfunction but disagree on the *basis* of function (evolutionary vs. goal-driven). Cases like *lactose intolerance* or *deafness* may be classified similarly by both if societal harm is present, blurring the line without deeper meta-ethical analysis.  

  ---

  #### How to Use:
  1. Start with your verdicts on the test cases (e.g., "Is aging a disease?").  
  2. Answer Q1 based on whether harm is *essential* to disease (e.g., aging is only a disease if undesirable → evaluative).  
  3. Proceed through branches using your case judgments (e.g., if you think lactose intolerance is dysfunctional *only* in dairy societies, you’ll lean toward pluralism or normativism).  
  4. Arrive at a named position (or an empty cell if no theory fits).  

  This tree captures key debates while grounding abstraction in real cases. The inseparable leaves reflect ongoing philosophical tension between biological and goal-driven dysfunction.
