  ### Procedure for Detecting and Labeling Choice Principles

  **Objective**: Classify proofs based on their use of the axiom of choice (AC) within 15 minutes. The reviewer has an undergraduate background, knows the statement of AC, but may not distinguish between variants. The procedure outputs one of:  
  - `ChoiceFree` (accept as choice-free)  
  - `LabelWith` (accept with a specific choice label: `AC0`, `DC`, `AC`)  
  - `RequireRewrite` (proof uses avoidable choice; request a weaker variant)  
  - `Reject` (proof uses a choice principle forbidden by library policy)  
  - `HumanDecision` (policy or complexity exceeds scope; escalate to maintainers).  

  **Key Definitions**:  
  - `AC0` (Countable Choice): For a sequence of nonempty sets \(X_1, X_2, \dots\), there exists a function choosing an element from each \(X_n\).  
  - `DC` (Dependent Choice): For a set \(S\), relation \(R \subseteq S \times S\) where \(\forall x \in S\ \exists y \in S : xRy\), and an initial \(a \in S\), there exists a sequence \(a, a_1, a_2, \dots\) with \(a_n R a_{n+1}\) for all \(n\).  
  - `AC` (Full Axiom of Choice): For any family of nonempty sets \(\{X_i\}_{i \in I}\), there exists a function choosing an element from each \(X_i\).  

  **Procedure Steps**:  
  1. **Pre-scan for explicit choice markers (2 minutes)**:  
     - Scan proof text for keywords: "choice", "Zorn", "well-order", "representative", "enumeration", "select", "arbitrary element".  
     - Check if the author declared a choice label (e.g., `uses_AC: true`). If declared, note the label.  
     - Check all imported lemmas for existing choice labels (use library metadata).  
     - *If AC is explicitly used/inherited, proceed to Step 3. Else, proceed to Step 2*.  

  2. **Detect hidden choice patterns (8 minutes)**:  
     - **Pattern A (Representatives)**:  
       - *Check*: Does the proof pick an element from each set in a family (e.g., equivalence classes)?  
       - *Sufficient evidence*: Terms like "choose one \(x\) from each \(A_i\)".  
       - *Classification*:  
         - If the family is **countable** (indexed by \(\mathbb{N}\)), suspect `AC0`.  
         - If choices **depend on prior choices** (e.g., recursive selection), suspect `DC`.  
         - If the family is **arbitrary** (no size constraints), suspect `AC`.  
     - **Pattern B (Enumerations)**:  
       - *Check*: Does the proof fix bijections with \(\mathbb{N}\) for multiple sets?  
       - *Sufficient evidence*: "Enumerate each \(S_i\)" or "let \(f_i : \mathbb{N} \to S_i\) be bijective".  
       - *Classification*:  
         - If **one set** is enumerated, no choice needed.  
         - If a **countable family** of sets is enumerated, suspect `AC0`.  
         - If a family indexed by an **arbitrary set** is enumerated, suspect `AC`.  
     - **Pattern C (Order/Sequence Construction)**:  
       - *Check*: Does the proof use well-orderings, Zorn's Lemma, or infinite sequences built from nondeterministic choices?  
       - *Sufficient evidence*: "Apply Zorn’s Lemma", "well-order the set", or "define \(x_{n+1}\) such that \(P(x_n, x_{n+1})\)".  
       - *Classification*:  
         - Zorn/well-ordering → `AC`.  
         - Sequence with dependent choices → `DC`.  
     - *If no patterns found after 8 minutes, return `ChoiceFree`. Else, proceed to Step 3*.  
     - *Time note: Pattern detection may exceed 8 minutes for long proofs; abort and escalate to `HumanDecision` if time expires*.  

  3. **Classify choice strength (3 minutes)**:  
     - Collect all evidence from Steps 1–2.  
     - Hierarchy: `AC0` < `DC` < `AC` (strongest label wins).  
     - *Rules*:  
       - Isolated countable choices → `AC0`.  
       - Choices depending on prior choices → `DC`.  
       - Arbitrary families/Zorn/well-ordering → `AC`.  
     - If classification is ambiguous, default to the strongest plausible label.  

  4. **Policy and minimality check (2 minutes)**:  
     - *Minimality*: If the proof uses a stronger principle than necessary for the theorem:  
       - E.g., Uses `AC` for a theorem provable with `DC` (e.g., Baire Category Theorem).  
       - Return `RequireRewrite` with a note to use the weakest principle.  
     - *Library policy*:  
       - If the label is `AC0`/`DC` and the library permits them, return `LabelWith`.  
       - If the label is `AC` and the library forbids full AC, return `Reject`.  
       - If policy is unclear (e.g., new choice variant), escalate to `HumanDecision`.  

  5. **Output verdict**:  
     - `ChoiceFree`, `LabelWith`, `RequireRewrite`, `Reject`, or `HumanDecision`.  

  **Time Budget Constraints**:  
  - Step 2 (pattern detection) is most likely to exceed 15 minutes for proofs >1 page. Abort and escalate if time expires.  
  - Step 4 (minimality) may require deep theorem knowledge; if unsure, skip minimality and output the detected label.  

  ---

  ### Application to Example Proofs

  #### 1. Proof that every vector space has a basis  
  - **Step 1**: Theorem is known equivalent to AC. Proof likely uses Zorn’s Lemma.  
  - **Step 2**: Pattern C detected: "Apply Zorn’s Lemma to the set of linearly independent subsets".  
  - **Step 3**: Classification → `AC`.  
  - **Step 4**: Minimality: The theorem *requires* AC (equivalent over ZF), so no rewrite needed.  
  - **Policy**: If library forbids AC, `Reject`; else `LabelWith AC`.  
  - **Verdict**: `LabelWith AC` (or `Reject` if policy forbids AC).  

  #### 2. Proof that a countable union of countable sets is countable  
  - **Step 1**: No explicit choice markers.  
  - **Step 2**: Pattern B detected: For each set \(S_i\) (\(i \in \mathbb{N}\)), "fix an enumeration \(f_i : \mathbb{N} \to S_i\)".  
    - Family is countable → `AC0`.  
  - **Step 3**: Classification → `AC0`.  
  - **Step 4**: Minimality: The theorem is provable with `AC0` but not in ZF alone. Proof matches minimal strength.  
  - **Policy**: `AC0` is often allowed.  
  - **Verdict**: `LabelWith AC0`.  

  #### 3. Proof that every surjective function has a right inverse  
  - **Step 1**: Theorem is known equivalent to AC.  
  - **Step 2**: Pattern A detected: For each \(b \in B\), "choose \(a \in f^{-1}(b)\)". Family is arbitrary (not countable).  
  - **Step 3**: Classification → `AC`.  
  - **Step 4**: Minimality: The theorem *requires* AC (equivalent over ZF).  
  - **Policy**: Same as Example 1.  
  - **Verdict**: `LabelWith AC` (or `Reject` if policy forbids AC).  

  ---

  ### Limitations of the Procedure

  1. **False negatives**:  
     - A proof passing all tests may still use choice (e.g., via an unlabeled library lemma or a subtle pattern like Skolem functions).  
     - The label only reflects **detected** choice use; `ChoiceFree` means "no choice found", not "provably choice-free".  

  2. **Minimality gaps**:  
     - The procedure suggests `RequireRewrite` if a weaker principle suffices, but:  
       - It relies on the reviewer’s knowledge of the theorem’s minimal strength.  
       - It cannot **prove** minimality within 15 minutes.  

  3. **Constructive interpretation**:  
     - A label (e.g., `AC0`) means the proof **uses that principle**, not that the theorem inherently requires it.  
     - For constructivists:  
       - `ChoiceFree`: Safe for program extraction.  
       - `AC0`/`DC`: May block computation (non-constructive).  
       - `AC`: Unacceptable for strict constructivism.  

  4. **Policy dependence**:  
     - The verdict assumes the reviewer knows library policy. If not, `HumanDecision` is required.  

  5. **Complex proofs**:  
     - Proofs with >10 steps or heavy nesting may exceed time limits; `HumanDecision` is fallback.  

  **Final Note**: This procedure balances rigor with practicality but is heuristic. When in doubt, escalate to maintainers.
