  2. Countable union of countable sets: AC0 (if the proof uses AC0) OR AC (if the proof explicitly uses AC) — we assumed AC0 in our scenario. So accept with AC0.
  3. Surjective function has right inverse: AC.

  **What the procedure cannot do**:

     - It cannot guarantee that a proof labeled as choice-free is indeed choice-free. There might be subtle uses of choice that were missed.
     - It cannot detect uses of choice that are buried in complex arguments or in imported lemmas that are not labeled (if the library does not have a complete labeling for lemmas).
     - It cannot always determine the minimal choice principle required by the theorem; it only reports what the proof uses. The proof might use a stronger principle than necessary.
     - It does not rewrite proofs to avoid choice.
     - It does not decide library policy; that is left to the maintainers.

     For the user who needs the result to be constructive: the label indicates the strength of the non-constructive principle used. If the label is AC0, then the proof uses countable choice, which is not constructive in the sense that it does not produce an algorithm (since the choices are arbitrary). Similarly, DC and AC are non-constructive. A constructive proof should have no label (choice-free). However, note that some constructive systems accept countable choice, but strict constructivists do not. The label is a warning that the proof uses a principle that is not valid in some constructive systems.
