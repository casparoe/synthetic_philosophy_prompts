  Now, why does this challenge the standard rescues? Let's break it down. 

  First, the "tiny cause" argument: Each person's whistling contributes to the collective noise. But if the wolves' attack threshold is based on the total noise level, and one person stopping doesn't drop it below the threshold, then their contribution isn't a marginal cause. Adding or removing one whistle doesn't change anything. The probabilistic angle also fails because the wolves respond to the collective level, not individual probabilities. 

