answer: |-
  Here’s a structured research proposal draft focusing on your core distinctions, designed for clarity and feasibility within a semester-long term paper. It avoids named theories per your request and centers on conceptual taxonomy.

  ---

  **Research Proposal: Three Faces of Consequentialist Cluelessness – A Taxonomic Approach to Decision-Theoretic Stability**

  **1. Introduction: The Problem of Lumped Cluelessness**  
  Consequentialism’s core tenet – maximizing the expected value (EV) of outcomes – faces a persistent objection: **cluelessness**. We cannot reliably trace or quantify the long-term, indirect consequences of actions, making EV calculations impossible or arbitrary. This objection is often treated monolithically as a *reductio* of consequentialism itself. However, preliminary analysis suggests **three distinct phenomena** operate under this label, each posing fundamentally different challenges to EV maximization:

  *   **Type 1 (Ordinary Uncertainty):** Consequences are unpredictable but *bounded and symmetric* in their potential deviations from a central estimate. Uncertainty is epistemic and tractable; EV calculations converge under standard decision theory.
  *   **Type 2 (Heavy-Tailed Instability):** Consequences exhibit *heavy-tailed distributions* where extreme, low-probability outcomes dominate the EV calculation. Small changes in probability estimates or outcome valuations radically alter the recommended action, rendering EV maximization *unstable* and highly sensitive to priors.
  *   **Type 3 (Unbounded/Incommensurable Aggregation):** The *aggregation* of consequences itself becomes problematic. Potential outcomes may be *unbounded* (infinite positive/negative value), or values across possible outcomes may lack *cardinal comparability* (no consistent scale for trade-offs). This suggests no well-defined EV exists, posing a *metatheoretic* challenge distinct from mere epistemic uncertainty.

  **2. Core Research Question & Objectives**  
  **Primary Question:** Which type(s) of unpredictability genuinely constitute "cluelessness" in a sense that *undermines the practical action-guidance* of standard consequentialist EV maximization? Specifically:
  *   For which type(s) does EV maximization yield a determinate, stable, and action-guiding verdict?
  *   Which type(s) render EV maximization indeterminate, unstable, or practically useless as a decision procedure?
  *   Which phenomenon most accurately deserves the label "cluelessness" as a fundamental challenge to consequentialism?

  **Objectives:**
  1.  **Develop Formal Toy Models:** Construct simple, isolative decision scenarios exemplifying each type:
      *   *Type 1 Model:* Bounded outcomes, symmetric uncertainty (e.g., normal distribution with known, finite bounds).
      *   *Type 2 Model:* Heavy-tailed distribution (e.g., Pareto distribution) where EV is dominated by extreme tail events.
      *   *Type 3 Model:* Scenario involving potentially infinite utility (e.g., Pascal's Mugging variant) or fundamental incommensurability of values (e.g., choosing between vastly different types of good).
  2.  **Analyze EV Stability:** Apply EV maximization rigorously to each model. Assess:
      *   *Determinacy:* Does a unique EV-maximizing act exist?
      *   *Stability:* How sensitive is the verdict to small, plausible changes in probability/utility estimates?
      *   *Action-Guidance:* Does the verdict provide clear, usable practical advice?
  3.  **Test Standard Replies:** Evaluate how common consequentialist responses to cluelessness fare against each type:
      *   *Foreseeability Restriction:* Limiting consequences to a "foreseeable" window.
      *   *Decision Procedure Evaluation:* Judging rules/policies, not individual acts.
      *   *Evidential Thresholds:* Ignoring consequences below a probability/impact threshold.
      *   *"Biting the Bullet":* Insisting EV is still the criterion, however uncertain.
  4.  **Map Viability:** Create a taxonomy linking each type of unpredictability to the viability of EV maximization and the effectiveness of standard replies.

  **3. Methodology: Taxonomic Analysis via Toy Models**  
  The approach is primarily **conceptual and analytical**, utilizing formal decision-theoretic modeling within simplified scenarios:
  *   **Taxonomy Definition:** Precisely define the three types using formal properties (boundedness, distribution tail behavior, aggregability, commensurability).
  *   **Model Construction:** Develop self-contained decision problems for each type. Complexity will be minimized to isolate the target phenomenon (e.g., 2-3 options, clear but problematic consequence structures).
  *   **EV Analysis:** Calculate EV explicitly for each option in each model. Systematically vary parameters (probabilities, utilities) within plausible ranges to test determinacy and stability.
  *   **Reply Simulation:** Apply each proposed "solution" (foreseeability, etc.) to each model. Does it resolve the problem? Does it work for one type but fail for others? Does it inadvertently reframe the problem as a different type?
  *   **Critical Comparison:** Contrast the *nature* of the failure (if any) of EV maximization across types. Is it epistemic (Type 1), computational/instability (Type 2), or foundational/aggregative (Type 3)?

  **4. Expected Outcomes & Deliverables**  
  *   **A Refined Taxonomy:** A clear, formalized distinction between the three types of unpredictability challenging consequentialism.
  *   **A Viability Map:** A definitive classification showing:
      *   *Type 1:* EV maximization is viable (determinate, stable, action-guiding). Standard replies are often redundant but harmless.
      *   *Type 2:* EV maximization yields unstable verdicts highly sensitive to priors. Foreseeability/Thresholds might offer *pragmatic* stability but sacrifice theoretical purity. Policy evaluation *might* mitigate instability in some cases.
      *   *Type 3:* EV maximization is fundamentally indeterminate/unworkable. Standard replies either fail or implicitly change the subject (e.g., restricting consequences transforms a Type 3 into a Type 1/2 problem). This presents the most profound "cluelessness" challenge.
  *   **Diagnosis of Debate Stagnation:** Explanation of why conflating these types leads to circular arguments (e.g., a reply effective for Type 1 is dismissed because critics have Type 2/3 in mind, and vice-versa).
  *   **Clarification of "Cluelessness":** Argument that **Type 3** (Unbounded/Incommensurable Aggregation) constitutes the deepest form of cluelessness, fundamentally undermining the *possibility* of a well-defined EV. **Type 2** represents a severe *practical* challenge to EV's action-guidance. **Type 1** is merely ordinary uncertainty.

  **5. Risks and Potential Failure Modes**  
  *   **Collapse Under Scrutiny:** The distinctions might not hold water upon rigorous analysis (e.g., Type 2 instability might *always* imply Type 3 aggregation problems at some level, or vice-versa; Type 1 might be rare in real-world cluelessness arguments).
  *   **Taxonomy Does No Work:** Analysis might reveal that standard replies address the *symptoms* of cluelessness similarly regardless of type, or that the proposed taxonomy doesn't significantly alter the evaluation of these replies.
  *   **Scope Misjudgment:** The Type 3 problem (unbounded/incommensurable) might prove far more complex and intractable than anticipated, resisting clear analysis within the toy model framework.
  *   **Over-Simplification:** Toy models, while necessary for isolation, might be accused of missing the essential complexity of real-world cluelessness.

  **6. Feasibility and Scope Management**  
  *   **Achievable in One Semester (6k words):**
      *   Clearly define the three types with formal properties.
      *   Develop and analyze robust toy models for **Type 1 and Type 2**. This is the core deliverable.
      *   Develop a preliminary model for **Type 3** and conduct an initial analysis of its challenges.
      *   Test key standard replies (e.g., Foreseeability Restriction, Evidential Thresholds) against the Type 1 & 2 models.
      *   Produce the viability map for Type 1 & 2, and a tentative assessment for Type 3.
      *   Articulate why conflation occurs and why Type 2/3 pose distinct challenges.
  *   **Likely Requiring Dissertation-Scale Work:**
      *   Comprehensive analysis of *all* standard replies against *all* types.
      *   Developing fully satisfactory models for Type 3 (unboundedness/incommensurability).
      *   Rigorously proving the independence/stability of the taxonomy.
      *   Extensive exploration of alternatives to EV maximization for Type 2/3.
      *   Detailed application to highly complex real-world cases.

  **7. Conclusion**  
  This proposal argues that the "cluelessness" objection to consequentialism is not monolithic but comprises three distinct phenomena with radically different implications for the viability of expected value maximization. By constructing minimal toy models to isolate each type and rigorously analyzing the stability and determinacy of EV calculations within them, this project aims to cut through conceptual confusion in the debate. The primary deliverable is a taxonomy mapping types of unpredictability to the action-guiding potential of standard consequentialist decision theory, arguing that foundational aggregative problems (Type 3) constitute the most profound challenge deserving the label "cluelessness," while heavy-tailed instability (Type 2) presents a severe practical barrier. Success will clarify a persistent stalemate and refocus criticism on the most vulnerable aspects of consequentialist decision-making.

  ---

  **Key Strengths of this Proposal for Your Goals:**

  1.  **Centers Your Distinction:** The three types are the core engine driving the proposal.
  2.  **Focus on Decision-Theoretic Viability:** Explicitly asks when EV maximization *works* (determinate, stable, guiding) and when it fails for each type.
  3.  **Uses Toy Models as Probes:** Models are tools to isolate and test the phenomena against the standard replies.
  4.  **Defines Success/Failure Clearly:** Mapping the types to EV viability & reply effectiveness is the key result. Failure is defined as taxonomy collapse or irrelevance.
  5.  **Honest Scoping:** Clearly delineates what's achievable (Types 1 & 2 modeling + preliminary Type 3) vs. what's not (full Type 3 resolution).
  6.  **Theory-Neutral:** Relies on formal properties (boundedness, tail behavior, aggregability) rather than citing specific philosophers.
  7.  **Diagnoses Debate Stagnation:** Explicitly links conflation of types to circular arguments.

  This structure provides a clear roadmap for your term paper while leaving ample room for you to develop the arguments, construct the specific models, and fill in the scholarly context. Good luck!
