  The user's hypothesis is particularly interesting: that this isn't really about empirical evidence or moral calculus, but about fundamentally different understandings of what "justice" means. They suggest one camp sees justice as retrospective (owed to victims) while the other sees it as prospective (constitutive of new political order). This aligns with what I know about transitional justice theory - the tension between retributive and restorative approaches.

  Their request is nuanced: not for me to take sides but to diagnose the nature of the disagreement. They want analysis of whether this is:
  - A hidden empirical question
  - Divergent evidentiary standards
  - A verbal dispute
  - Or two different questions being conflated

  And crucially, they ask what could constitute progress - or if that's impossible due to foundational differences about political community's purpose. Their preference for "clear negative answer" suggests intellectual honesty over false optimism.

  The depth here requires careful handling. This isn't an undergraduate asking for basic explanations but someone who's clearly read the major theorists - think Teitel, Sikkink, Nino. Their reference to "what the word 'justice' is doing in the sentence" echoes Wittgensteinian concerns about language games. 

  Key points to address:
  First, validate their suspicion that this is more than empirical/moral disagreement. Their dual-questions theory is perceptive - the retrospective/prospective justice distinction maps to what scholars call "backward-looking" vs "forward-looking" justice.

  Second, their related point about amnesty vs impunity is vital. They're touching on how legal acts differ from social conditions - a distinction Madeira's work on "accountability without trials" explores.

  Third, regarding progress: we should acknowledge that some scholars (like Olsen/Payne) try to measure combinations of mechanisms, but the core philosophical divide may indeed be irreconcilable because it stems from different conceptions of the state's fundamental obligations.

  The challenge is responding with equal sophistication while avoiding academic jargon. Since they dislike "dressing up", clarity is paramount. British English phrasing will be maintained as requested - "lorry" not "truck", "reckon" not "figure" etc.
answer: |-
  Your diagnosis strikes me as fundamentally sound; this is indeed less an empirical or moral stalemate than a **conceptual divergence about the nature and temporality of justice itself**. The disagreement centres on incompatible frameworks for understanding what transitional justice *is for*. Here's a breakdown:

  ### 1. **The Core Disagreement: Two Irreducible Questions Under One Name**
     - **The Justice Camp** asks: **"What do we owe the victims?"**  
       Justice here is **retrospective, corrective, and individual**. It is a debt owed *to* identifiable victims for wrongs committed *against* them. The state’s legitimacy hinges on discharging this debt through accountability. Amnesty, on this view, isn't just a pragmatic compromise; it’s a *betrayal* of the state's core duty to rectify past wrongs. Impunity isn't merely a risk—it’s *inherent* in amnesty.
    
     - **The Realists** ask: **"What do we owe the future?"**  
       Justice here is **prospective, constitutive, and systemic**. It is a property of a *future political order*—stable, peaceful, minimally legitimate. Amnesty isn't a "cost" but a *foundational act* enabling that order. The state’s legitimacy derives not from retroactive accounting, but from preventing future violence and creating conditions for collective survival. Moral "debts" to victims are real but *subordinate* to existential necessity.

  These questions aren't mutually exclusive in theory, but in transitional moments—scarce resources, existential threats—they become practically antagonistic. Each camp elevates one question to primacy, treating the other as secondary or derivative.

  ### 2. **Why This Prevents Movement**
     - **Incommensurable Standards of Success**:  
       - For the Justice Camp, *any* amnesty = failure (impunity entrenched).  
       - For Realists, *any* stable transition = success (violence averted).  
       Cases like Argentina (post-amnesty prosecutions) or South Africa (amnesty-for-truth) aren’t "exceptions" to the other side—they’re *irrelevant*. Argentina proves prosecutions *can* happen (Justice Camp’s point), but Realists see it as survivable only because the junta was already broken. South Africa proves amnesty *can* avert chaos (Realists’ point), but the Justice Camp sees it as entrenching economic apartheid.  
       - **Evidence is weaponised selectively**: Each side demands the other prove a negative ("Prosecutions *never* cause backsliding!" / "Amnesty *always* breeds impunity!"). Neither can, so they retreat to first principles.

     - **The Amnesty/Impunity Conflation**:  
       You rightly isolate this. Realists treat "amnesty" as a *legal mechanism* separable from societal accountability (e.g., gacaca’s restorative elements). The Justice Camp sees "amnesty" as *inherently* producing impunity—a societal condition where power escapes consequence. When Realists say "amnesty enables truth-telling," Justice advocates hear "impunity buys cheap peace." The concepts are entangled in a way that resists disentanglement.

  ### 3. **What Could Count as Progress?**
  Not consensus, but **disciplined clarification** that forces each camp to confront its blind spots:
     - **A Foundational Distinction**: Explicitly separating:  
       **(A) Justice-as-Rectification** (individual, backward-looking)  
       **(B) Justice-as-Legitimation** (collective, forward-looking)  
       This doesn't resolve the tension but makes it legible. Scholars like David Dyzenhaus or Ruti Teitel gesture here, but the debate rarely *starts* with this framing.

     - **A Non-Ideal Test Case**: A case that *forces engagement* with the other question:  
       - **Example**: Colombia’s JEP (Special Jurisdiction for Peace). It offers *conditional* amnesties for full confession, victim reparations, and community service—blending retributive and restorative elements. Its (incomplete) outcome might challenge *both* camps:  
         Realists must explain if accountability mechanisms undermine stability.  
         Justice advocates must explain if conditional impunity delivers meaningful redress.  
       Crucially, it’s not a "pure" example either side can dismiss easily.

     - **Confronting the Unargued Premise**: Progress may require exposing the **meta-ethical bedrock**:  
       - The Justice Camp assumes: **The state exists to vindicate individual rights.**  
       - Realists assume: **The state exists to secure collective survival.**  
       This is the "what is a political community *for*?" question. Neither position is provable; they’re foundational commitments. Admitting this could drain rancor from the debate—agreeing it’s about *priorities*, not facts or morals.

  ### 4. **A Clear Negative Conclusion**
  **True resolution is impossible because the disagreement is ultimately ontological.** It concerns the purpose of political community and the nature of justice in ruptured societies. Empirical data won't shift it because cases are interpreted through opposing lenses. Moral arguments won't shift it because each camp recognizes—but discounts—the other's moral concern. 

  What *is* possible is **intellectual hygiene**: 
  - Stopping the pretence that this is *only* about evidence or "weighing lives."  
  - Forcing each side to articulate why their core question (owed to victims vs. owed to the future) *must* dominate.  
  - Acknowledging that transitions involve **irreducible tragic choices**, not technical problems.

  The debate isn't stuck; it’s reached its logical endpoint. The energy should shift to mitigating the trade-offs (e.g., via hybrid mechanisms like Colombia’s) rather than denying they exist. Your suspicion—that this is a clash of frameworks—is correct. The task now is to map the fault line, not bridge it.
