  First, I should categorize the must-haves versus the optional commitments. The non-negotiables would include consistent valuation across equivalent descriptions and handling the base case without evasion. The user seems frustrated with solutions that dodge the infinite case or rely on physical limits, so those should be flagged as inadequate unless they address the idealized scenario.

  The user mentions Pascal's mugging as a related problem. I should consider whether a resolution must handle both or if they can be treated separately. Since both involve tiny probabilities and huge payoffs, linking them makes sense, but it's worth noting if a solution only applies to one.

  They also care about repeated plays and family of games. Any resolution must address what happens when the game is played multiple times or slightly modified. The rearrangement example with alternating payoffs is crucial because it tests if the solution depends on how the gamble is presented.

  Bounded utility is a common fix, but the user questions if giving up "more money is always better" is acceptable. I need to identify which desideratum this violates—probably the Archimedean axiom, which is optional but important for those valuing continuity.

  The biggest conflict is between consistency across representations and assigning finite value. Many solutions fail here by treating mathematically equivalent descriptions differently. This tension kills off naive approaches that cap n or probabilities without a principled reason.

  For the usual suspects: bounded utility handles the base case and repeated plays but violates Archimedean. EV maximization abandonment lacks a clear alternative. Accepting infinity avoids inconsistencies but ignores decision relevance. Probability thresholds are arbitrary and representation-dependent.

  The user's deeper need seems to be a rigorous framework to compare solutions, avoiding hand-wavy arguments. They want to know which criteria are essential and where compromises lie, especially for theoretical purity versus practical application.
answer: |-
  Here's a distilled specification of desiderata for resolving the St. Petersburg Paradox, structured around your points and core philosophical/decision-theoretic commitments:

  **Core Desiderata (Non-Negotiable):**

  1.  **Consistent Valuation Under Equivalent Representations:** The resolution must assign the *same* value (or verdict: play/don't play at price X) to any two descriptions of the *same* probability distribution, regardless of how it's presented (coin flips, limit of finite games, density function, etc.). Violation renders the resolution arbitrary. *[Addresses your "general one" and the rearrangement concern]*
  2.  **Address the Idealized Base Case:** The resolution must provide a clear verdict or analysis for the *exact* specification: $2^n$ with probability $2^{-n}$ for n=1,2,3,... in a setting with a perfectly fair coin, a casino with infinite resources, and an idealized rational agent with unbounded lifespan. It cannot *solely* rely on physical impossibilities (finite bankrolls, mortal players, imperfect coins) as the core resolution. *[Addresses the core paradox and "physical-limits dodge" inadequacy]*.
  3.  **Decision Relevance:** The resolution must provide actionable guidance to an agent facing the gamble *once*. It must explain the behavior of both someone paying a finite amount (e.g., $20) and someone refusing a very large finite amount (e.g., $1,000,000). Saying "no fact of the matter" is inadequate unless it robustly explains *why* both behaviors are equally rational (or irrational) under the idealized conditions. *[Addresses the "base case" observation and "no fact of the matter" insufficiency]*
  4.  **Handle the Finite Limit Coherently:** If the resolution assigns a finite value `V` to the infinite game, `V` must be the limit of the values assigned to the finite games (with maximum `N` flips) as `N -> ∞`. If it assigns infinity, it must explain why the finite cases converge to infinity but yield finite values. *[Addresses "agree with the boring finite answer" and coherence]*

  **Important, But Potentially Camp-Dependent Desiderata:**

  5.  **Stability Under Repetition:** The resolution's verdict for a single play should be compatible with its verdict for multiple independent plays. If it prescribes playing once for a price `P`, it should prescribe playing `K` times for a price `K*P - ε` for large `K` (or explain why not, e.g., due to wealth effects). *[Addresses "repeat plays"]*
  6.  **Handle the "Family":** The resolution should be applicable to variations like:
      *   **Dominant Version:** Payoff = $4^n$ (stochastically dominates the original). A verdict to play the original for price `P` should imply playing this for price `4P - ε`.
      *   **Conditionally Convergent Version:** Payoff = $(-1)^n * 2^n / n$. The resolution must either assign it a well-defined value robust to representation *or* explain why it's fundamentally different/malformed. *[Addresses "Family, not just the one game"]*
  7.  **Address Pascal's Mugging:** The resolution's core logic for handling tiny probabilities of vast payoffs should be applicable to Pascal's Mugging scenarios (or explicitly explain why the cases differ structurally). *[Links a major related problem]*
  8.  **The Archimedean Axiom / Continuity (Optional Sacrifice):** Does the resolution preserve the axiom: "For any outcomes `A < B < C`, there exists a probability `p < 1` such that `B` is preferred to the lottery `[p, A; 1-p, C]`"? **Bounded Utility sacrifices this.** Sacrificing it means accepting that some good (e.g., infinite money) is *infinitely* better than any finite amount, making trade-offs impossible. *[Addresses "bounded utility cost" and "continuity"]*
  9.  **Marginal Utility of Wealth (MUW) Monotonicity (Optional Sacrifice):** Does the resolution preserve "More wealth is always preferred to less wealth, all else equal"? **Bounded Utility sacrifices this** by definition at the bound. Sacrificing it means accepting there's a level beyond which more money has *zero* value. *[Addresses "more money is always at least a little better"]*

  **The Key Incompatibility:**

  You **cannot simultaneously** have **Desideratum 3 (Decision Relevance - explaining paying $20 but refusing $1M)** and **Desideratum 4 (Finite Limit Coherence)** while insisting the infinite game has a **single, well-defined infinite expected monetary value (EMV)**. This is the heart of the paradox:
  *   EMV = ∞ suggests paying *any* finite price is rational.
  *   Observing refusal at high finite prices contradicts this.
  *   Finite truncations have large but finite EMV (`N+1`), converging to ∞.
  *   An explanation for why refusal is rational *must* either:
      *   **Reject EMV maximization** for this infinite distribution (violating the naive EMV requirement implied by 4).
      *   **Assign a finite value** `V` < ∞ to the infinite game (violating the EMV=∞ result and requiring modification of valuation).
      *   **Invoke non-EMV factors** (like wealth levels, probability thresholds) that make EMV=∞ irrelevant for *decision* at very high prices, implicitly rejecting pure EMV maximization as the sole criterion for this gamble.

  **The Workhorse Desideratum:**

  **Desideratum 2 (Address the Idealized Base Case)** does the most work in killing off candidates. Many "resolutions" implicitly or explicitly rely on:
  *   **Finite Resources:** "Casino can't pay." (Fails 2)
  *   **Finite Lifespan:** "You won't live to flip n=100." (Fails 2)
  *   **Risk Aversion over Truncations:** Applying risk aversion only to the finite approximations without addressing the limit. (Fails 2 & 4 coherence)
  *   **Probability Thresholds:** "Ignore probabilities below ε." (Fails 1 - representation dependent, Fails 2 - idealized case has no such threshold)
  Any resolution that fundamentally changes the idealized problem statement to avoid the infinity fails Desideratum 2.

  **How Usual Suspects Fare:**

  1.  **Bounded Utility (Bernoulli):**
      *   **Pros:** Clears 1, 2 (assigns finite V), 3 (explains paying low/refusing high), 4 (V = limit of finite-game values under utility), 5 (generally stable), 6 (assigns value), 7 (addresses PM).
      *   **Cons:** Violates 8 (Archimedean) and 9 (MUW Monotonicity) - core commitments. Value `V` depends heavily on the arbitrary bound/utility function.
  2.  **Ditching Expected Value Maximization (e.g., Rank-Dependent, Prospect Theory, Safety-First):**
      *   **Pros:** Clears 1, 2, 3, 4 (assigns finite V or decision rule), 5 (often stable), 6 (assigns value/decision). Can preserve 8 & 9. Often handles 7.
      *   **Cons:** Specific rules vary. Can seem ad hoc (e.g., how is probability weighting chosen?). May struggle with 7 (Dominant Version) if not carefully formulated. The "why ditch EMV *only* here?" question lingers.
  3.  **Deflationary "It's Infinite, Deal With It" (Accept EMV=∞):**
      *   **Pros:** Clears 1, 2, 4 (coherently infinite), 6 (assigns value=∞).
      *   **Cons:** Fails 3 catastrophically (cannot explain refusal at any finite price). Fails 5 (playing multiple times makes refusal even more irrational). Fails 7 (Pascal's Mugging becomes unavoidable). Ignores observed behavior.
  4.  **Probability Thresholds / "Practical Ignorance" (Implicit in many 'finite world' arguments):**
      *   **Pros:** Can clear 3 (explains refusal based on ignoring tiny p), sometimes 5.
      *   **Cons:** Fails 1 (arbitrary, representation-dependent - where's the threshold?). Fails 2 (idealized case has no practical limits). Fails 4 (finite truncation EMV converges to ∞, threshold breaks continuity). Fails 6 (Dominant Version - same tiny p's). Fails 7 (Pascal's Mugging - same issue). Deeply ad hoc.

  **In essence:** A resolution *must* handle the idealized infinite game consistently and provide decision-relevant guidance. The tension between the infinite EMV calculation and finite willingness to pay forces a choice: modify the valuation framework (Bounded Utility, alternative to EMV) or abandon decision relevance based on EMV (Deflationary). Avoiding the idealized case or relying on representation-dependent fixes fails the core test.
