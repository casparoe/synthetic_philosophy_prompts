prompt: |-
  Okay so I'm in this seminar on modality and reference, we've done rigid designation and the necessary a posteriori, and now every week somebody says "well that theory can't handle X" and everyone nods, and I've realized I don't actually know what the scoreboard is. Before I read any more of this stuff I want the spec. Not a tour of the theories -- the requirements. What does any adequate theory of reference for proper names and natural-kind terms have to deliver, if it also has to make sense of rigid designation and the a posteriori necessities (water/H2O, heat/molecular motion, Hesperus/Phosphorus, that whole family)?

  For every requirement give me the case that motivates it -- the puzzle it has to dissolve, the distinction it can't collapse, whatever it is -- and tell me which ones are genuinely non-negotiable and which are definately just the house style of one camp (descriptivists, the Kripke-Putnam causal-historical people, the two-dimensionalists, whoever wants to give up on reference-fixing altogether). Where two requirements look like they can't both be met, say so and say what we'd have to give up. My hunch is the pressure point is somewhere between "identity statements have to be informative" and "names are directly referential," or between metaphysical necessity and the epistemic/conceivability story, but you tell me. That's the part I actually care about.

  Two cases our TA made up that I want the list to force an answer on, because I think they break different theories in different places:

  1. In the 1890s a geologist chips a lump out of a cliff, points at it, and christens it "boraline." It later turns out the lump was a contaminated mess, basically two distinct minerals fused together, so no single pure substance answers to it -- and also that some forgotten paper a decade earlier had used the word "boraline" for an unrelated rock. So what does "boraline" refer to now: the contaminated lump, one of the two pure minerals, both of them as a disjunctive kind, or the earlier rock? Whatever the list says has to settle this.

  2. A village has one word for one particular shade of blue. The village splits; a few generations later each half is using the word for a different shade. Is there a fact about what the original word referred to, does it refer to both, or is it just indeterminate? I can't tell which answer is supposed to be a constraint on the theory and which is only a consequence of it, so please seperate those.

  Also: which single requirement knocks out the most contenders by itself? And if something on the list is really just an intuition one camp has rather than a real requirement, call it out instead of being polite. One line each on how the big camps do against the list is fine at the end, but keep it short -- I'll do the real scoring in the paper. American English please, it's for a US seminar.
reasoning: |-
  Okay, the user is in a philosophy seminar focused on modality and reference, specifically dealing with rigid designation and necessary a posteriori truths like water being H2O. They're frustrated because every week someone points out a problem with a theory, and they feel lost without clear criteria to evaluate these theories. They want a list of requirements that any adequate theory of reference must satisfy, with each requirement tied to a motivating case. They also want to know which requirements are non-negotiable and which are contentious, especially highlighting conflicts between requirements.  

  The user provided two specific cases: the "boraline" example with a contaminated mineral sample and a pre-existing name, and the village word for a shade of blue that splits into two meanings. These are meant to test theories. The user suspects tension between informative identity statements and direct reference, or between metaphysical necessity and epistemic conceivability.  

  First, I need to outline the core requirements. Kripke's arguments against descriptivism are key here, so requirements like rigid designation, non-descriptive reference, and handling necessary a posteriori truths are fundamental. Then there's the distinction between sense and reference from Frege, which leads to the informativeness requirement. Putnam's stuff on natural kinds adds requirements for kind terms and the division of linguistic labor.  

  For each requirement, I should provide a motivating case. For rigid designation, Hesperus/Phosphorus is the classic example. For the necessary a posteriori, water/H2O. The boraline case tests ambiguity in reference-fixing, especially with failed samples and prior uses. The village color word case tests reference change and indeterminacy over time.  

  I need to identify conflicts. The big one is between direct reference (names as tags with no descriptive content) and the informativeness of identity statements (which seems to require some conceptual content). Another conflict is between rigid designation and the appearance of contingency—how we can conceive of water not being H2O even though it's necessary.  

  The boraline case forces theories to handle messy real-world scenarios: contamination in samples, forgotten prior uses. If a theory can't resolve whether boraline refers to the lump, the minerals, or the earlier rock, it's inadequate. The village case challenges how reference evolves with community usage and whether there's a fact of the matter post-split.  

  Non-negotiable requirements include rigid designation, non-descriptive reference for proper names, and handling necessary a posteriori truths. Contentious ones are epistemic constraints on modality (linked to two-dimensionalism) and strong indeterminacy (which some may accept as part of language).  

  Among the theories, descriptivism fails rigid designation and necessary a posteriori. Causal-historical theories handle rigid designation and kind terms well but struggle with reference change and ambiguity. Two-dimensionalism accounts for informativeness and conceivability but is complex and may overcomplicate.  

  The requirement that knocks out most contenders is likely the combination of rigid designation with the necessary a posteriori, as descriptivism can't handle it. The boraline case is particularly tough because it combines multiple issues—sample failure, prior use, ambiguity—which might stump even causal-historical theories.  

  I should present each requirement clearly, state if it's non-negotiable or contentious, and mention conflicts. Then apply the cases to show how they test the requirements. Finally, summarize how each major theory fares against the list.
answer: |-
  Here's the spec sheet for an adequate theory of reference for proper names and natural-kind terms, distilled to core requirements with motivating cases, conflict zones, and non-negotiables. The "boraline" and "village color" cases are integrated as test constraints.

  ### Core Requirements (The Non-Negotiables)
  1.  **Rigid Designation:** A name/kind term must pick out the same object/kind in all possible worlds where that object/kind exists.
      *   **Motivating Case:** "Hesperus is Phosphorus" is necessary but a posteriori. If they weren't rigid, this identity could be contingent. Descriptivism fails this (e.g., "the evening star" could pick different objects in different worlds).
      *   **Status:** Non-negotiable for handling Kripkean necessities.

  2.  **Non-Descriptive Reference Fixing (for names):** The reference of a name isn't determined by a descriptive sense associated with it by speakers.
      *   **Motivating Case:** "Gödel" referring to the man who proved incompleteness, even if Schmidt actually did the work and Gödel stole it. Speakers refer to Gödel, not whoever satisfies the description.
      *   **Status:** Non-negotiable. Knocks out classical Fregean descriptivism.

  3.  **Necessary A Posteriori Truths:** The theory must explain how identity statements involving rigid designators ("Water is H₂O", "Hesperus is Phosphorus") can be metaphysically necessary yet only knowable empirically.
      *   **Motivating Case:** Water/H₂O, Heat/Molecular Motion. We can conceive of watery stuff that isn't H₂O, but it turns out it couldn't *be* water. The theory must distinguish metaphysical necessity from epistemic contingency.
      *   **Status:** Non-negotiable core datum.

  4.  **Reference Determination for Kinds:** The theory must explain how natural-kind terms get their reference fixed to specific kinds in the world, often deferentially to underlying structure.
      *   **Motivating Case:** "Water" referred to *that stuff* (pointing to samples) before knowing its microstructure was H₂O. We deferred to the hidden structure to fix the kind.
      *   **Status:** Non-negotiable for natural kinds. Knocks out pure nominalism ("whatever looks like this").

  5.  **Informativeness/Distinct Cognitive Significance:** The theory must explain how identity statements ("Hesperus is Phosphorus") can be informative (convey new knowledge) even if necessary and involving rigid designators.
      *   **Motivating Case:** Learning "Hesperus is Phosphorus" is genuinely informative, unlike "Hesperus is Hesperus". This requires *some* distinction beyond just reference (e.g., modes of presentation, ways of thinking).
      *   **Status:** Non-negotiable datum about language use. This is the major pressure point against pure direct reference.

  ### Contentious Requirements / Points of Conflict
  6.  **Epistemic Constraint on Modality:** Conceivability (absent defeaters) entails (some kind of) possibility.
      *   **Motivating Case:** We can conceive of water not being H₂O, and this *seems* like evidence for its possibility. Two-dimensionalists elevate this to a core constraint on meaning/content.
      *   **Status:** Highly contentious (Kripkean orthodoxy rejects it as a constraint on *metaphysical* possibility). Primarily two-dimensionalist house style. Conflict with Requirement 3.

  7.  **Ambiguity/Indeterminacy Resolution:** The theory must provide principled ways to handle messy cases (like boraline) or declare them genuinely indeterminate.
      *   **Motivating Cases:**
          *   **Boraline:** Contaminated sample + forgotten prior use. Does "boraline" refer to (a) the specific lump (like a name), (b) the dominant mineral in the lump (deference), (c) both minerals disjunctively, (d) the earlier rock (priority), or (e) nothing? **Requirement:** The theory must force *one* answer or justify indeterminacy *based on its core principles*, not just ad-hoc.
          *   **Village Color:** Word splits meaning over time. Is the original reference (a) fixed to the specific shade (rigidly?), (b) indeterminate between the shades, (c) a cluster concept covering both, or (d) simply changed meaning? **Requirement:** The theory must say whether there is a *fact of the matter* about the original reference independent of later usage, and explain community-level reference change.
      *   **Status:** Non-negotiable that the theory *must address these cases consistently*, but the *correct answer* is highly contentious and reveals deep theoretical commitments (e.g., causal-historical theories lean towards (a) or (b) for boraline and (a) for village color; descriptivist-leaning theories might accept (c) or (d) more easily).

  8.  **Meaning/Reference Stability vs. Change:** The theory must account for how reference can persist through time/ignorance *and* how it can genuinely shift.
      *   **Motivating Cases:** "Madagascar" (misapplied name shift), "jade" (disjunctive kind: nephrite/jadeite). Village color word splitting is a direct test. **Requirement:** Explain persistence *and* change without collapsing the distinction.
      *   **Status:** Non-negotiable that both phenomena occur. Theories differ wildly on mechanisms (causal chains vs. description clusters).

  9.  **Division of Linguistic Labor:** The theory must accommodate that reference for many terms (esp. kinds) relies on expertise within the community; not every speaker needs full identifying knowledge.
      *   **Motivating Case:** "Elm" and "Beech" for non-botanists. They refer via deference to experts.
      *   **Status:** Widely accepted (Putnam), but implementation details vary. Weak descriptivism struggles.

  ### Major Conflicts & Pressure Points
  *   **Informativeness (5) vs. Direct Reference (2,3):** This is the core tension. Pure Direct Reference (Millianism) struggles with informativeness. Descriptivism fails rigidity and necessity. Two-dimensionalism attempts a synthesis using epistemic/metaphysical intensions. Others use pragmatic modes of presentation.
  *   **Necessary A Posteriori (3) vs. Epistemic Constraint (6):** If conceiving water ~H₂O implies *some* kind of possibility (6), but water=H₂O is metaphysically necessary (3), then the "possibility" must be epistemic/superficial. Kripkeans see this as a *mistake* needing explanation, not a constraint on the theory. Two-dimensionalists build the theory *around* this distinction.
  *   **Rigidity (1) vs. Apparent Contingency:** How can "Water might not have been H₂O" *seem* true (conceivable) if it's rigid and necessary? This is resolved by distinguishing epistemic and metaphysical modalities (handled by Requirement 3 & how Requirement 5/6 are addressed).

  ### Which Requirement Knocks Out the Most?
  **The combination of Rigid Designation (1) and Necessary A Posteriori (3) is the giant killer.** It decisively refutes classical Fregean descriptivism. Pure Millian Direct Reference survives these but gets hammered by Informativeness (5).

  ### How Major Camps Fare Against the List
  *   **Classical Descriptivism (Frege/Russell):** Fails 1, 2, 3, 8, 9. Struggles with boraline (might pick dominant mineral or disjunction) and village color (might favor cluster meaning).
  *   **Causal-Historical (Kripke, Putnam, Devitt):** Strong on 1, 2, 3, 4, 9. Weak on 5 (informativeness - often outsourced to pragmatics). Struggles with 7 (boraline likely specific lump or nothing; village color original shade). Can handle *some* reference change (8) but mechanism is clunky.
  *   **Two-Dimensionalism (Chalmers, Jackson):** Designed to handle 1, 3, 4, 5, 6, 9. Uses primary intension for informativeness/conceivability (5/6) and secondary intension for rigidity/necessity (1/3). Often criticized for complexity and commitment to 6. Boraline: Primary intension might be descriptive (e.g., "the mineral sample dubbed 'boraline'"), secondary intension likely the lump. Village color: Original primary intension likely the specific shade.
  *   **Referential Skepticism/Deflationism (Quinean, some pragmatists):** Rejects determinate reference (denies strict 1, 4, 7). Handles 5 easily. Views boraline/village color as inherently indeterminate or context-dependent. Sacrifices rigidity and strong necessity.

  **Bottom Line:** An adequate theory **must** handle Rigid Designation, Non-Descriptive Fixing, Necessary A Posteriori, Kind Determination, and Informativeness (1-5). The boraline and village cases (7,8) are crucial tests for ambiguity and change. The major battle is reconciling Direct Reference (1-3) with Informativeness (5). Causal-historical is the baseline; two-dimensionalism offers a richer but more contested solution; descriptivism is out. Your TA's cases force theories to show their cards on messy reference fixing and change.
