  Below is the decision tree designed for your seminar handout. It begins with the root commitment (sincere, confident, and mistaken self-reports occur) and branches through 9 internal nodes (questions) based on the logical space of the cases and distinctions you specified. The tree avoids labels, names, or prior knowledge, using only stipulated hypothetical cases to route readers to one of 7 descriptive leaves (positions). Each node is phrased as a question with mutually exclusive options, and no node asks directly about reliability or uses position names. The tree ensures your key distinctions (accuracy vs. tracking, constitution) and scope issues (generalization, metaphysics) are explicit nodes.

  ### **Decision Tree: Reliability of Introspective Reports**

  **Root (Starting Point):** You accept that sincere, confident, and mistaken self-reports occur—for example, a subject fluently explains a choice that was manipulated without her awareness.

  1. **Which target of introspection is most relevant?**  
     - A: Current experiences (e.g., sensations or emotions felt right now).  
     - B: Standing attitudes (e.g., stable beliefs or values held over time).  
     - C: Etiological reports (e.g., why you hold an attitude or acted as you did).  

  2. **In the annotated subject case (concurrent experience reports align with all checks, but explanations of choices go wrong under manipulation), does this imply a general difference in reliability across targets?**  
     - A: Yes, experience reports are reliable while etiological reports are not.  
     - B: No, both types of reports share the same reliability (either both reliable or both unreliable).  

  3. **In the trained reporter case (initially applies a self-descriptive term at chance, then accurately after feedback), what best explains the improvement?**  
     - A: A latent detector was calibrated to better track an independent state.  
     - B: A criterion for applying the term was learned, which may not track an independent state.  

  4. **In the divergent twins case (identical self-reports and behavior, but different underlying states), is the self-report evidence about the underlying state?**  
     - A: Yes, it provides evidence about the state.  
     - B: No, it only provides evidence about the reporting act or criteria.  

  5. **In the stable denier case (sincerely denies a state supported by behavior/physiology, and denial is stable/predictive), is the self-report inaccurate?**  
     - A: Yes, the report is inaccurate (the state exists independently).  
     - B: No, the report is accurate (e.g., due to how the state is defined).  

  6. **Is the mental state reported determinate independently of the self-report?**  
     - A: Yes, the state exists independently (not constituted by reporting).  
     - B: No, the state is partly constituted by the report or reporting practice.  

  7. **Are sincere, confident self-reports generally accurate for the target?**  
     - A: Yes, they are mostly true.  
     - B: No, they are not generally true.  

  8. **If reports are accurate (from Q7), is this accuracy due to tracking?**  
     - A: Yes, accuracy depends on the state causing the report.  
     - B: No, accuracy does not depend on tracking (e.g., due to shifting criteria or external factors).  

  9. **If etiological reports are unreliable (e.g., from annotated subject), does this imply current experience reports are also unreliable?**  
     - A: Yes, failures generalize across targets (e.g., due to a shared mechanism).  
     - B: No, failures are confined to etiological reports.  

  10. **Does a failure of tracking (if it occurs) license conclusions about the metaphysics of mental states?**  
      - A: Yes, it suggests states are not real or not independent.  
      - B: No, it only affects the evidential weight of reports.  

  ---

  ### **Leaves (Positions)**
  Each leaf is defined by a unique path through the tree (conjunction of answers). For each, I provide:  
  - **Path:** The sequence of answers leading to the leaf.  
  - **Most awkward commitment:** A key challenge or counterintuitive implication of the position.  
  - **Implication for researcher:** What it means for deciding evidential weight of a subject's report.  

  1. **Fallibilist Dedicated-Detector View**  
     - **Path:** 1A,B, or C → 2B → 3A → 4A → 5A → 6A → 7A → 8A → 9A or B → 10B  
       *(Any target; no general difference in reliability; detector calibrated; evidence about state; report inaccurate in stable denier; state independent; reports accurate; accuracy from tracking; failures may or may not generalize; no metaphysical conclusions from tracking failure.)*  
     - **Most awkward commitment:** Must maintain that self-reports are reliable detectors even when independent evidence (e.g., behavior) consistently contradicts them, as in the stable denier case.  
     - **Implication for researcher:** Give high weight to reports across all targets, as they generally track states, but allow for occasional errors due to detector fallibility.  

  2. **Inferentialist View (Interpretive Machinery)**  
     - **Path:** 1A,B, or C → 2B → 3B → 4B → 5B → 5A → 6A → 7A or B → 8B → 9A or B → 10A or B  
       *(Any target; no general difference; criteria learned; evidence only about reporting; report inaccurate; state independent or constituted; reports not accurate; tracking question skipped; generalization may or may not occur; metaphysical conclusions possible.)*  
     - **Most awkward commitment:** Asserts self-reports are inferences like those about others, yet must explain why they feel direct or privileged despite being error-prone (e.g., in annotated subject’s etiological reports).  
     - **Implication for researcher:** Treat self-reports as indirect inferences, giving them weight only when corroborated by external evidence (e.g., behavior), especially for etiological targets.  

  3. **Constitutive/Expressivist View**  
     - **Path:** 1A,B, or C → 2A or B → 3A or B → 4B → 5B → 6B → 7B → 7A or 8N/A or 8B → 9A or B → 10A or B  
       *(Any target; difference or no difference; criteria learned; evidence only about reporting; report accurate; state constituted; reports accurate or not; if accurate, not from tracking; generalization may or may not occur; metaphysical conclusions possible.)*  
     - **Most awkward commitment:** In the stable denier case, denies that behavior/physiology indicates the "true" state, insisting the self-report defines reality even when it conflicts with all external evidence.  
     - **Implication for researcher:** Weight depends on whether the research goal is to understand the subject's self-conception; reports create states, so they are evidence of identity, not underlying causes.  

  4. **Domain-Split Hybrid View**  
     - **Path:** 1A or C → 2A → 3A → 4A → 4B for etiology → 5A for experience, 5B for etiology → 5A → 6A → 7A → 8A for experience, 8N/A for etiology → 9B → 10B  
       *(Experience or etiology; difference in reliability; detector calibrated for experience, criteria learned for etiology; evidence about state for experience, only reporting for etiology; report inaccurate; state independent; reports accurate for experience; accuracy from tracking for experience; failures do not generalize; no metaphysical conclusions.)*  
     - **Most awkward commitment:** Claims experiential and etiological reports use fundamentally different mechanisms within the same mind, yet cannot explain why subjects experience both as similarly "direct."  
     - **Implication for researcher:** Give high weight to experiential reports (tracking), low weight to etiological reports (non-tracking), and use standing attitude reports cautiously as they may align with either.  

  5. **Accurate-but-Not-Tracking View**  
     - **Path:** 1A,B, or C → 2B → 3A → 4B → 5B → 6B → 7A → 7A → 8B → 9A or B → 10B  
       *(Any target; no general difference; criteria learned; evidence only about reporting; report accurate; state independent; reports accurate; accuracy not from tracking; failures may or may not generalize; no metaphysical conclusions.)*  
     - **Most awkward commitment:** Maintains reports are accurate even when they do not track states (e.g., in divergent twins), and dismisses behavioral/physiological evidence in stable denier as irrelevant.  
     - **Implication for researcher:** Trust reports as accurate descriptions, but do not assume they correlate with other measures (e.g., neurodata), as accuracy stems from social criteria, not causal links.  

  6. **Deflationary View**  
     - **Path:** 1A,B, or C → 2A or B → 3A or B → 4B → 5B → 6B → 7B → 7A or 8N/A → 9A or B → 10A or B  
       *(Any target; difference or no difference; criteria learned; evidence only about reporting; report accurate; state constituted; reports accurate or not; tracking question skipped or not applicable; generalization may or may not occur; metaphysical conclusions possible.)*  
     - **Most awkward commitment:** Denies that self-reports describe pre-existing states at all, making reliability a category error (e.g., in trained reporter, improvement is just skill in a language-game, not truth).  
     - **Implication for researcher:** Weight depends on the report's function (e.g., expression or commitment), not truth; use reports as data about communication, not mental states.  

  7. **Humility-Only View**  
     - **Path:** 1A,B, or C → 2A or B → 3A or B → 3A or B → 4A or B → 5A or B → 6A or B → 7A or B → 8A or B → 9A or B → 10B  
       *(Any target; difference or no difference; detector or criteria; evidence or not; accurate or not; independent or constituted; accurate or not; tracking or not; generalization or not; but always: no metaphysical conclusions.)*  
     - **Most awkward commitment:** Refuses any general claim about reliability, even for clear cases like annotated subject, insisting context determines all.  
     - **Implication for researcher:** Weight is determined solely by the research purpose (e.g., predicting behavior vs. understanding subjectivity), not by philosophical arguments or cases.  

