prompt: |-
  I sit on the committee of a small charitable trust that runs a school, and I keep running into a pattern in the way we argue about risk for which I cannot find a name. The pattern is about the burden of proof, and it turns on which state of affairs is allowed to count as the starting point.

  Two decisions, about eighteen months apart. The first was whether to install a new kind of surface beneath the climbing equipment, whose long-term effects on the children who use it are, frankly, unknown. The argument that carried the day was that nobody could show the material to be safe, that the burden of proof lay with whoever wanted the change, and that we should therefore wait. The second was whether to remove the older surface already in place, whose long-term effects are equally unknown, since it went down long before anyone thought to study such things. The same members, in almost the same words, said that no one had shown it to do any harm and that it would be irresponsible to take away something the children have been using happily for years on nothing but suspicion.

  Both arguments run: when the evidence is inconclusive, do not disturb what is there. Yet one blocked a change and the other blocked a change back, and on each occasion the person who wanted something different had to make a case while the person who wanted the present arrangement left alone had to make none. What interests me is that nobody involved experiences this as a double standard, because the words are identical each time; and when I raised it, I was told that the second case is different because people have come to rely on what is there.

  I have since noticed the same shape elsewhere: in regulatory debates I have read about, where things long in use keep their approval while new things of the same kind must clear a far higher bar; and in a department that was refused permission to adopt a new method for want of evidence that it was better, and then refused permission to abandon the old method for want of evidence that the new one was better.

  I have read enough to know that something in this neighbourhood is discussed under the heading of the precautionary principle, but that seems to concern the general question of acting under uncertainty rather than the particular slippage I am describing, in which the same rule is recited by the same people and produces opposite verdicts. Is there an established name for this? A bare label would not satisfy me. I want to know what exactly the phenomenon is and where its edges lie: whether the fault is in the rule itself or only in those who apply it; whether the appeal to reliance is a genuine independent justification or merely a restatement of the thing I am complaining about; whether what I have described is really distinct from the familiar point that precaution can defeat itself, from the ordinary stickiness of preference, from plain inconsistency, and from the legitimate expectation that settled arrangements can be relied upon; how it should treat the awkward case in which the present arrangement is not a steady state at all but something already deteriorating, so that doing nothing is itself a change and the rule cannot say which option is the conservative one; and if nothing established fits, what you would call it, and how you would define it so that the definition sorts the clear cases from the borderline ones.
reasoning: |-
  Okay, the user is part of a charitable trust committee and has observed a recurring pattern in decision-making related to risk. They described two scenarios: one where a new climbing surface was rejected because its safety wasn't proven, and another where removing an old surface was rejected because harm wasn't proven. Both decisions relied on the same reasoning—maintain the status quo when evidence is inconclusive—but led to opposite outcomes. The user feels this is a double standard masked by identical language. They want to know if there's a name for this phenomenon, its boundaries, and whether the appeal to reliance is valid.

  First, I recall the user mentioned the precautionary principle. But they think it's broader than what they're seeing. The precautionary principle usually focuses on avoiding harm in uncertainty, not the asymmetry they're pointing out. So I need to dig into related concepts. Status quo bias comes to mind—the preference for current conditions regardless of evidence. That seems relevant because both decisions favor inaction.

  Then there's omission bias, where harmful inactions are preferred over harmful actions. In the first decision, not installing the new surface avoids potential harm from change. In the second, not removing the old surface avoids disrupting the existing state. Both are omissions, which aligns with this bias. The user's examples fit here: action (change) requires proof, while inaction doesn't.

  The appeal to reliance or sunk costs might be a separate justification. The committee argues that people rely on the existing surface, so removing it needs stronger evidence. But is this a valid point or just reinforcing the bias? The user questions whether reliance is a genuine reason or a restatement of the problem. Legitimate expectations could make reliance valid in some contexts, like established practices. However, in cases like the deteriorating status quo, reliance might not hold, showing the rule's inflexibility.

  The user also asks about distinguishing this from other concepts. Precaution defeating itself is when excessive caution leads to worse outcomes, but that's different from the asymmetry here. Ordinary stickiness is just resistance to change, but the double standard adds inconsistency. Plain inconsistency is possible, but the pattern here is systematic. Legitimate expectation supports reliance in stable conditions but fails when the status quo is changing.

  For the deteriorating status quo, the rule struggles because inaction becomes a change. For example, if the old surface is wearing out, doing nothing might increase risk. The status quo bias can't handle dynamic situations, leading to flawed decisions.

  The user's deeper need might be to articulate this pattern to the committee, fostering better decision-making. They likely want a framework to challenge the inconsistency without dismissing valid concerns about reliance. Naming the phenomenon (status quo bias with omission asymmetry) could help, but explaining its mechanics and limitations is crucial. They might also seek strategies to counteract this bias, like requiring symmetric burden of proof or recognizing when the status quo isn't static.

  In summary, the core phenomenon is status quo bias amplified by omission bias, with reliance sometimes masking the inconsistency. The fault lies in the application of the rule, not the rule itself, when reliance isn't genuinely present. Defining it involves recognizing asymmetric burden of proof favoring inaction and examining when reliance is legitimate versus a bias.
answer: |-
  This phenomenon is a fascinating and frustrating blend of cognitive biases and institutional inertia, where the *application* of a seemingly neutral rule ("when evidence is inconclusive, do not disturb what is there") systematically favors the status quo due to an **asymmetric burden of proof**. While it borrows elements from established concepts, its core mechanism and the resulting double standard deserve a specific framing. Here’s a breakdown:

  ### The Core Phenomenon: Status Quo Bias Amplified by Omission Asymmetry and Sunk Cost Fallacy
  This isn't *just* the precautionary principle or simple status quo bias. It’s a **systematic asymmetry in the burden of proof driven by the perceived cost of action vs. inaction**, heavily influenced by the **sunk cost of the existing state** (time, reliance, familiarity) and the **omission bias** (harm from inaction feels less blameworthy than harm from action).

  1.  **The Rule:** "When evidence is inconclusive, favor the current state."
  2.  **The Asymmetry:**
      *   **Introducing Change (Action):** Requires *proof of net benefit* (or at least proof of safety). The burden is on the proposer to overcome the presumption against disturbance. Harm from a *new* action feels highly salient and blameworthy.
      *   **Maintaining the Status Quo (Inaction):** Requires only the *absence of proof of net harm*. The burden is implicitly shifted to those who want change to *disprove* the safety/adequacy of the existing state. Harm from *inaction* (e.g., continuing exposure to an unproven risk) feels less salient and less blameworthy ("We didn't *do* anything wrong").
  3.  **The "Reliance" Factor:** This is often the key rationalization, but it functions more as a **sunk cost fallacy masquerading as a justification**. The time, resources, and familiarity invested in the existing state create an *illusion* of stability and safety ("It hasn't killed anyone *yet*"), making the status quo feel inherently less risky than an unknown alternative. This amplifies the omission bias. While "reliance" can be a *genuine* factor in some contexts (e.g., established property rights), here it's frequently used post-hoc to justify the asymmetric burden *already* applied, rather than being an independent, objectively assessed justification. It often *is* a restatement of the bias.

  ### Established Names & Why They Fit (or Don't) Perfectly
  *   **Status Quo Bias:** This is the overarching umbrella – the preference for the current state of affairs. *However*, it doesn't inherently explain the *systematic asymmetry in burden of proof* or the *double standard* applied using identical language. Simple status quo bias might resist both changes equally.
  *   **Omission Bias:** This is crucial. People perceive harm caused by *action* (commission) as worse, and more blameworthy, than equivalent harm caused by *inaction* (omission). This directly drives the asymmetry: *Changing* the surface (action) feels riskier than *keeping* the old surface (inaction), even if the old surface's risks are unknown.
  *   **Sunk Cost Fallacy:** The investment (time, money, familiarity, "reliance") in the existing state creates irrational resistance to changing it, regardless of its actual merits or risks. This fuels the perception that the status quo is "safer" or "more reliable."
  *   **The Precautionary Principle (PP):** You're right that PP is related but broader. PP says *lack of full scientific certainty shouldn't prevent action to avoid serious harm*. Your committee is applying a *perverted, one-sided version* focused *only* on the potential harm of *novel actions*, while ignoring the potential harm of *continuing the existing unproven state*. It's PP selectively applied to *change* but not to *stasis*.
  *   **Burden of Proof Asymmetry:** This is the most direct descriptor of the *mechanism*, but it's a general concept needing the context (status quo, omission bias) to explain *why* the asymmetry exists and is applied consistently to favor inaction.
  *   **Inertia:** Simple, but captures the resistance to movement in either direction.

  **The Best Label: Status Quo Bias with Systemic Omission Asymmetry (or Burden of Proof Asymmetry Favoring Inaction)**
  This captures the core: a preference for the current state, amplified by a systematic, institutionalized rule that places a much higher burden of proof on anyone proposing *any* change (whether adding *or* removing), due to the inherent psychological and institutional bias against being seen as the *cause* of harm through action.

  ### Addressing Your Specific Queries

  1.  **Fault in Rule or Application?** Primarily in the *application* and the *underlying biases*. The core rule ("be cautious under uncertainty") isn't inherently faulty. The fault lies in:
      *   Failing to symmetrically apply caution to *both* change *and* stasis.
      *   Mistaking familiarity/lack of *acute* harm for safety.
      *   Not recognizing that "doing nothing" is also a choice with potential consequences.
      *   Allowing omission bias and sunk costs to dictate where the burden of proof falls.

  2.  **"Reliance" - Genuine or Restatement?** It's **mostly a restatement/circular justification** for the existing bias. While genuine reliance (e.g., critical infrastructure) exists, in the scenarios you describe (playground surface, work methods), "reliance" is usually code for "we're used to it," "it hasn't exploded yet," or "change is disruptive." It's rarely a rigorous assessment of actual dependence versus the potential risks of the status quo. It *becomes* a genuine factor only if the change itself causes disruption *independent* of the risk question (e.g., removing a vital tool with no replacement), but this is often conflated with the risk assessment.

  3.  **Distinction from Related Concepts:**
      *   **Precaution Defeating Itself:** This is when excessive precaution *causes* the harm it sought to avoid (e.g., delaying a vaccine causing more disease). Your phenomenon *can* lead to this (keeping an unsafe old surface), but it's distinct. Your focus is the *asymmetry* in applying precaution, not the paradoxical outcome.
      *   **Ordinary Stickiness of Preference:** This is part of it (status quo bias), but doesn't encompass the institutionalized *rule* and the *burden of proof asymmetry* used to enforce it.
      *   **Plain Inconsistency:** While inconsistent outcomes occur, the *mechanism* (reciting the same rule favoring the status quo) is remarkably *consistent*. The inconsistency arises because "the status quo" flips depending on the starting point of the decision (pre-change vs. post-change). It's consistent application of an asymmetric rule leading to logically inconsistent *results* over time.
      *   **Legitimate Expectation:** This is the strongest counter-argument. Settled arrangements *do* create expectations deserving protection. **The key distinction is proportionality and risk assessment.** Legitimate expectation protects against *arbitrary* disruption, not against *evidence-informed* change addressing potential risks. Your committee is using "expectation/reliance" as an absolute shield against *any* reevaluation of risk, effectively granting the status quo permanent immunity from scrutiny unless proven *actively* harmful – an impossibly high bar for latent/long-term risks.

  4.  **The "Deteriorating Status Quo" Problem:** This is the **Achilles' heel** of the rule and exposes its fundamental flaw. If the status quo is decaying (e.g., old surface wearing thin, old method becoming inefficient), "doing nothing" *is* an active choice leading to negative change. The rule ("favor the status quo") becomes incoherent because:
      *   There is no single, stable "status quo" to favor.
      *   "Doing nothing" is equivalent to choosing the path of deterioration.
      *   The asymmetric burden of proof paralyzes action. Proposing *any* intervention (whether reverting to an older state, adopting a new state, or repairing the current one) faces the high burden, while letting decay continue faces no burden at all.
      *   **Resolution:** This situation demands abandoning the simplistic rule. It requires actively defining the *desired outcome* (safety, efficiency) and comparatively assessing *all* options (including active maintenance of the *current* state, not just passive neglect) against that outcome under uncertainty, using symmetric standards of evidence for potential benefits and harms of *each* pathway. This often means shifting to a "least worst option" or "best available evidence" approach.

  ### Defining the Phenomenon Clearly
  Here’s a definition designed to capture the core and its edges:

  > **Systemic Status Quo Preservation Bias (SSQPB):** An institutional or group decision-making pattern where, under conditions of uncertainty or inconclusive evidence:
  > 1.  A presumption in favor of maintaining the *current operational state* is established.
  > 2.  An **asymmetric burden of proof** is applied:
  >     *   Any proposal to *alter* the current state (whether adding, removing, or replacing elements) must demonstrate a *net benefit* or overcome a high threshold of proof regarding safety/adequacy.
  >     *   Maintaining the current state requires only the *absence of conclusive proof of net harm*.
  > 3.  This asymmetry is rationalized primarily by the perceived costs of *action* (potential for causing novel harm, disruption) contrasted against the perceived stability and implied safety of *inaction*, often bolstered by appeals to sunk costs, familiarity, and established reliance, regardless of whether these constitute independent, objective justifications.
  >
  > **Clear Cases:** Decisions involving proposals to change an existing, familiar practice or object where identical reasoning ("no proof of benefit/safety for change" / "no proof of harm for keeping") is used to reject change regardless of direction (adoption *or* removal), and where the existing state's own risks are unproven or unknown.
  >
  > **Borderline Cases:**
  > *   Situations with genuinely high disruption costs independent of risk (e.g., replacing core software mid-project).
  > *   Situations where the existing state has a *long, well-documented history* of safety, creating a stronger legitimate expectation argument (though latent risks may still exist).
  > *   Situations where one option (change or stasis) has *marginally* more evidence, but the burden asymmetry is still the primary driver.
  > *   The deteriorating status quo scenario, where the rule breaks down but the *bias* often persists, manifesting as resistance to *any* proactive intervention.

  ### Why This Happens & Moving Forward
  This bias thrives because:
  *   **Psychological Comfort:** Inaction feels safer (omission bias).
  *   **Accountability:** Harm from action is easier to attribute and blame.
  *   **Institutional Inertia:** Change requires effort and justification; stasis does not.
  *   **Sunk Costs:** Past investment creates emotional and practical attachment.
  *   **Simplification:** The rule provides a simple heuristic in complex situations.

  To counter it in your committee:
  1.  **Name It:** Explicitly identify "Systemic Status Quo Preservation Bias" or "Omission Asymmetry Burden" when you see it.
  2.  **Demand Symmetry:** Insist the *same* standard of evidence for risk/benefit be applied to *all* options under consideration, including the "do nothing" option (which is maintaining the current status quo). Ask: "What evidence do we have that the *current* state is safe/adequate?" not just "Is the *proposed change* safe?"
  3.  **Reframe "Doing Nothing":** Emphasize that maintaining the status quo is an *active choice* with potential consequences, especially if risks are unknown or the state is deteriorating.
  4.  **Interrogate "Reliance":** Demand specifics: *How* is there reliance? What is the *actual* cost of disruption *separate* from the risk question? Is the reliance truly legitimate or just familiarity?
  5.  **Focus on Outcomes:** Shift the discussion from "change vs. no change" to "what outcome do we want (safety, learning, efficiency) and which path (including maintaining the current state) best achieves it under uncertainty?"
  6.  **Acknowledge Uncertainty:** Explicitly state that both change and stasis carry unknown risks, and the decision involves weighing these uncertainties symmetrically.

  By recognizing this specific pattern of asymmetric burden of proof favoring inaction under the guise of a neutral rule, you gain a powerful tool to challenge decision-making inertia and promote more balanced risk assessment.
