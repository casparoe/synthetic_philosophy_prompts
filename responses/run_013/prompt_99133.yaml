  First, I need to understand their core challenge: preventing the conclusion from seeming like wishful thinking. Programmers are analytical, so the sequence must build logical inevitability. The LLM example is clever—it makes correlated algorithms concrete, but I need to ensure it doesn't mislead. Temperature zero and same prompt create identical outputs *if* the logic is deterministic, but random seeds could ruin that. Better to use a simple, verifiable algorithm like a calculator function to guarantee identical outputs. 

  Their misconceptions list is spot-on: Kantianism (duty-based), team reasoning (group goals), and literal identity. These need preemptive strikes. Kantianism must be debunked early by emphasizing predictive correlation, not morality. Team reasoning gets a dedicated comparison slide. Literal identity can be dismissed via the algorithm example—different hardware, same code. 

  The opener is critical. Starting with PD's standard failure primes them for cognitive dissonance. Then introducing "same source code" as a variable shifts the framework. The payoff matrix with correlated choices is where the "aha" should click. 

  For the finale, the question about "what defect guarantees?" forces them to confront that cooperation isn't altruism—it's the only move that doesn't self-sabotage under correlation. And I’ll explicitly exclude timeless decision theory and quantum mechanics rabbit holes; those derail beginners. 

  User’s clearly experienced—they’ve named exact pitfalls. Their unspoken need is probably credibility: avoiding claims that sound like "cooperation magic." The rigor in distinguishing superrationality from similar concepts should arm them against skepticism.
answer: |-
  Here’s a battle-tested lesson plan for teaching superrationality to programmers, optimized for 45 minutes. The goal is **logical inevitability**, not persuasion.

  ---

  ### **Lesson Plan: Superrationality for Programmers**

  **Total Time:** 45 mins  
  **Core Analogy:** Deterministic LLMs (temperature=0) with identical prompts  
  **Key Insight:** *Algorithms with identical source code produce correlated outputs — your "choice" isn’t independent.*

  ---

  #### **1. Re-Anchor in Standard PD Failure (5 mins)**
  - **Do:** Show a classic Prisoner’s Dilemma matrix.  
    *"Rational agents defect → (D,D) is the Nash equilibrium. Why? Because your choice can’t affect theirs."*  
  - **Why:** Establish baseline intuition. Superrationality *violates* this, so they must feel the tension.

  #### **2. Introduce the Algorithmic Correlation Premise (10 mins)**
  - **Do:**  
    - Pose: *"What if both players use the* ***exact same decision algorithm*** *— same source code, same inputs?"*  
    - Use **LLM example**:  
      - *"Two GPT-4 instances, same prompt: `You are in a PD. Output C or D.` Temperature=0. Different seeds."*  
      - **Make vivid**: Emphasize **determinism** — same code + same inputs → same output. Seeds only matter if logic branches on randomness (here it doesn’t).  
    - **Crucial shift**: *"Your ‘choice’ isn’t a free variable — it’s computed by an algorithm that also computes theirs."*  
  - **Leave out**: Quantum randomness, consciousness. Stick to deterministic code.

  #### **3. Reframe the Payoff Matrix (10 mins)**
  - **Do:**  
    - Show standard PD matrix.  
    - Add a **correlated choices layer**:  
      | Algorithm Outputs | Probability | Your Payoff |  
      |-------------------|------------|-------------|  
      | (C,C)             | P          | 3 (tempting 5 is *impossible*) |  
      | (D,D)             | 1-P        | 1           |  
    - *"Defecting doesn’t get you 5 — it just forces (D,D). Cooperating gets you 3 if (and only if) they do the same."*  
  - **Why:** Undercut the "temptation" payoff. It’s inaccessible under correlation.

  #### **4. The Superrational Decision (5 mins)**
  - **Do:**  
    - *"Your algorithm must output one value: C or D. Since both run identical code:*  
      - *If it outputs C → both output C → you get 3.*  
      - *If it outputs D → both output D → you get 1.*  
      *Maximize your payoff: output C."*  
  - **Analogy:** It’s like a single function returning a value for both players.

  #### **5. Preempt Misconceptions (10 mins)**
  - **Where:** Immediately after the core argument. Preempt *before* Q&A.  
    - **"It’s just Kantianism!"**  
      → *"No categorical imperative. This is self-interest: you get 3 > 1. Kant says cooperate even if others defect."*  
    - **"It’s team reasoning!"**  
      → *"No shared goal. You care only about your payoff. But your ‘move’ is locked to theirs by the algorithm."*  
    - **"Agents must be identical!"**  
      → *"Only the decision algorithm must be identical. They can run on different hardware, have different beliefs — as long as `pd_algorithm(input) == C` for both."*  

  #### **6. The Killer Closing Question (3 mins)**
  - **Ask:** *"In the correlated algorithm model, what does your defection* ***guarantee*** *about the outcome — and why can’t it get you the 5?"*  
    - **Answer you want:** *"Defecting forces mutual defection (since algorithms match), locking payoff at 1. The 5 requires them to cooperate while you defect — impossible under identical code."*

  #### **7. Explicitly Excluded (2 mins)**  
  - **State upfront:** *"We’re ignoring:*  
    - Timeless decision theory / acausal trade  
    - Probabilistic correlation (e.g., similar but not identical algorithms)  
    - Evolutionary/iterated dynamics  
    *This is about identical deterministic code in a true one-shot game."*

  ---

  ### **Why This Works for Programmers**
  - The **LLM example** makes algorithmic correlation concrete and testable (they can imagine the code).  
  - **Reframing the payoff matrix** neuters the "temptation" illusion.  
  - **Preempting misconceptions** targets their likely objections (Kant/team reasoning).  
  - **Closing question** forces them to internalize that defection *destroys value* under correlation.

  ### **If They Push Back**
  - *"But in real life, algorithms aren’t identical!"* → *"Correct. Superrationality applies only when they are. That’s the thought experiment."*  
  - *"This feels like cheating!"* → *"It’s not ‘cheating’ — it’s updating beliefs based on knowing your choice isn’t independent. Standard game theory assumes independence."*

  You’ll leave them with a crisp, irritatingly logical itch — mission accomplished.
