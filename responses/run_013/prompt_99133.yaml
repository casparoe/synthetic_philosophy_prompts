prompt: |-
  I'm running a reading group for programmers who already know basic game theory, and next week I have to teach superrationality in about forty-five minutes — you know, the idea that in a one-shot prisoners dilemma, if both players are running the same decision procedure, each should cooperate because their choices are correlated through the shared algorithm. I don't need you to explain the idea to me; I need a plan for how I should explain it. What has to come first so the conclusion doesn't look like wishful thinking, and what can wait? I was thinking of using two copies of the same LLM playing a one-shot prisoners dilemma, same prompt and temperature zero but different random seeds, as the carrying example. Is that any good, and what would it have to make vivid or leave out? If it's bad, what should replace it? Also map the misconceptions they'll bring, like its just Kantianism, or its team reasoning, or it only works if the agents are literally identical, and tell me where in the sequence to head each one off. Finish with one question I can ask at the end to see if they got it, and tell me what I should openly refuse to cover at this level.
