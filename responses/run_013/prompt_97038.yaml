answer: |-
  **Speech's Core Move:** Reframe the astronomy/astrology tension in Kepler's work not as science vs. superstition, but as differing interpretations of celestial mechanisms and predictive legitimacy.

  **Speech (Approx. 380 words):**

  Good evening, everyone, and thank you for joining us as we open this fascinating glimpse into Johannes Kepler’s world. Tonight, we’re not just looking at stars through antique telescopes or ancient charts; we’re peering into the complex reality of how a foundational figure in astronomy made his living.

  The centerpiece, this facsimile horoscope, is often presented with a knowing chuckle: the great scientist indulging a "silly" side. But that simplification does Kepler, and history, a disservice. Kepler wasn’t humouring clients; he genuinely believed the geometry of the heavens – the angles, the aspects – exerted a physical influence on earthly temperament, on the human soul. He saw celestial mechanics operating on a subtler, more profound level than mere fortune-telling.

  His frustration was reserved for those he called "hacks": astrologers selling specific, sensational predictions about events. *That*, to Kepler, was the corruption. Yet, he cast these charts. Why? Because understanding the cosmos required funding, and noble patrons demanded this service. It was the practical engine that powered his revolutionary astronomy.

  So, the real story here isn't "scientist versus astrologer." For Kepler, the sky's influence was a given. The critical line was drawn over *mechanism* – how does that influence actually work? – and over *legitimacy* – who gets to predict what, and based on what evidence? He sought a physical, geometrical explanation for celestial influence, grounded in observation and math, distinct from the vague pronouncements he despised.

  Perhaps that tension feels less distant than we think. We may have replaced "aspects" with "circadian rhythms" or "seasonal affective disorder." We monitor solar storms not for personal fate, but because they demonstrably affect our power grids and satellites. The core intuition – that the vast movements above connect to the life below – persists, even as our explanations and methods evolve.

  Tonight's exhibit invites you to explore this intricate man and his complex moment. See the tools – the telescopes loaned by our dedicated Astronomy Club, who keep our eyes on the stars. Examine the charts, including those generously shared by our guests, reflecting the enduring practice Kepler both relied upon and critiqued. Consider the weight of patronage, the demands of discovery, and the enduring human question of our place within a vast, moving sky.

  So, please, step inside. Look closely. Let Kepler’s day job challenge the easy narratives. Enjoy the exhibit! Thank you.
