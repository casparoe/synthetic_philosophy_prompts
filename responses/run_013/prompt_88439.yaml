  I need to address what separates a "crank" from a legitimate radical revisionist. The user lists several potential criteria: method, handling of anomalies, willingness to specify falsification conditions, pursuit of independent lines of evidence versus piling up confirmations, or simply sociology (who's in the academic guild). They want me to reach a verdict - either there's a real demarcation line I can define, or it's just social labeling. I shouldn't "cop out" with "it's complicated."

  This is an interesting epistemological question about historical methodology. Fomenko makes a good stress test because he's not an ignorant outsider - he's a credentialed mathematician applying quantitative methods to historical texts. His work appears methodical on the surface. Yet historians universally reject his conclusions. I need to figure out why this rejection is epistemically justified rather than merely sociological.

  I recall that historians have criticized Fomenko for several substantive reasons: he allegedly cherry-picks data that fits his statistical models while ignoring counter-evidence; his method assumes that textual similarities must indicate contemporaneity rather than other factors (like genre conventions); and his theory would require dismissing vast amounts of archaeological, numismatic, astronomical, and genetic evidence that independently corroborates conventional chronology. 

  The user mentions that conventional chronology has been revised - like with radiocarbon calibration changing some dates - so "disagreeing with experts" can't be the whole story. This is valid, but I should note that those revisions occurred within the framework of existing evidence and methods, not through complete overhaul. Radiocarbon dating didn't throw out all of history - it refined dates while leaving the overall sequence intact. Fomenko's revision is orders of magnitude more radical.

  For my essay structure, I'll begin by defining pseudohistory and introducing Fomenko as a challenging case. Then I'll examine potential demarcation criteria: methodological robustness, engagement with counter-evidence, falsifiability, interdisciplinary consistency, and community practices. I'll argue that while sociology plays a role in academic gatekeeping, there are epistemic grounds for distinguishing pseudohistory from legitimate revisionism. The key is systematic accountability to evidence across disciplines. Fomenko fails this test because his theory requires dismissing entire categories of evidence that contradict his conclusions. Mainstream history, despite occasional asymmetries, maintains this accountability.

  In my verdict, I'll conclude that pseudohistory is a real epistemic category defined by its failure to meet disciplinary standards of evidentiary accountability, not just its outsider status. Fomenko's work illustrates this through its selective use of evidence and resistance to falsification. The demarcation isn't perfectly sharp (as philosophers found with science/pseudoscience), but it's substantive enough to justify the label in hard cases.
answer: |-
  ## The Cracks in Chronology: Demarcating Pseudohistory in the Shadow of Fomenko

  Anatoly Fomenko’s New Chronology presents a profound challenge to historical epistemology. A respected mathematician, Fomenko employs statistical text analysis to argue that conventional ancient and medieval history is a vast, telescoped fiction, largely concocted during the Renaissance. He contends that events and figures we place centuries apart are mere duplicates, that authentic written history only begins around 800 AD, and that the entire edifice rests on a fragile chain of mutually corroborating chroniclers. Dismissed by mainstream academia as "pseudohistory," Fomenko’s case forces us to ask: is this label merely a sociological weapon wielded by an insular guild against an outsider, or does it denote a genuine, epistemically flawed category? Examining Fomenko and the nature of historical revision reveals that while sociology inevitably plays a role, pseudohistory is ultimately defined by systematic failures in evidentiary accountability and methodological integrity.

  Fomenko is not easily dismissed as a crank. His use of statistical methods on dynastic lists and astronomical records *appears* rigorous. He demonstrates deep familiarity with the source chronicles he seeks to dismantle, engaging not in ignorance but in radical reinterpretation. Furthermore, the history of chronology itself is marked by significant revisions – Schliemann upended Homeric timelines, radiocarbon dating forced recalibrations across prehistory, and dendrochronology constantly refines dates. The mere fact of disagreeing with experts, therefore, cannot be the demarcation line; legitimate scholarship often begins as radical dissent.

  So, where does the line fall? It lies not in the *presence* of method or knowledge, but in its *application* and *interaction* with the totality of evidence:

  1.  **Systematic Selectivity & Negation of Counter-Evidence:** Fomenko’s statistical correlations often rely on cherry-picked data points while ignoring vast swathes of contradictory evidence. His core method – identifying parallels in reigns or events – assumes similarity *must* imply contemporaneity or duplication, dismissing alternative explanations (common tropes, shared cultural models, genuine influence). Crucially, his theory necessitates not just reinterpretation, but the wholesale *negation* of entire disciplines. Radiocarbon dating, dendrochronology, numismatics, archaeology (stratigraphy, artifact typologies), philology (language evolution), and even recorded astronomical observations (eclipses meticulously dated by contemporaries) must *all* be either fatally flawed or part of a vast, inexplicable conspiracy for his chronology to hold. Legitimate revisionists, like those incorporating new scientific dating, work *with* these disciplines, seeking coherence. Fomenko dismisses them *en masse* when inconvenient, an epistemic asymmetry fatal to his credibility.

  2.  **Lack of Falsifiability & Ad Hoc Maneuvering:** A robust theory specifies what evidence could potentially refute it. Fomenko’s paradigm, however, exhibits remarkable resilience through ad hoc adjustments. A contradictory archaeological layer? Misdated or part of the fabrication. An inconvenient eclipse record? Misinterpreted or forged. A distinct coin hoard stratigraphy? Planted or misattributed. The theory expands to absorb anomalies as confirmations of the conspiracy rather than challenges to the core premise. Contrast this with the impact of radiocarbon calibration: specific, testable predictions about date sequences were falsified, forcing revision *within* a framework that respected other lines of evidence. Fomenko’s revision operates outside such constraints.

  3.  **Confirmation Bias vs. Consilience:** Fomenko excels at accumulating parallels and statistical correlations that *support* his duplication thesis. However, this resembles "piling up confirmations" within a closed system. True historical consilience demands the convergence of *independent* lines of evidence. Conventional chronology achieves this: the reign of Charlemagne is attested not just by Frankish annals, but by Anglo-Saxon chronicles, Papal correspondence, Islamic accounts, coinage, archaeology of palaces and battlefields, and linguistic shifts traceable in charters. Fomenko must dismiss most of these as fabrications or misinterpretations to maintain his thesis. His evidence largely flows *from* his reinterpretation of texts *towards* his predetermined conclusion, lacking independent verification from disparate fields.

  4.  **Asymmetry in Burden of Proof:** Mainstream history operates with an asymmetric burden of proof: extraordinary claims (like a massive, centuries-spanning fabrication involving thousands of coordinated actors across continents) require extraordinary evidence. Fomenko reverses this. He places the burden on conventional history to prove its *entire* chronology is *not* a fabrication, while offering his statistical parallels as sufficient proof *for* his radical alternative. This asymmetry is unsustainable. While mainstream history isn't immune to occasional asymmetries (e.g., sometimes privileging written sources), it doesn't build its entire foundation on rejecting the validity of all countervailing evidence categories.

  **Sociology vs. Epistemology:** Yes, the "guild" exists. Academic gatekeeping, institutional inertia, and resistance to paradigm shifts are real sociological forces. Calling something "pseudohistory" can be a convenient way to dismiss uncomfortable challenges without deep engagement. However, Fomenko’s case demonstrates that sociology alone doesn't explain the dismissal. His work *fails* by the internal epistemic standards historians apply to *any* work, including that of insiders. When historians reject a theory proposing widespread artifact forging to explain away stratigraphy, or dismiss claims that radiocarbon dating is fundamentally broken *only* for the periods contradicting a specific thesis, they are applying methodological and empirical criteria, not just tribal loyalty. The rigorous engagement historians *have* shown with Fomenko’s methods (demonstrating flaws in his statistics and assumptions) further undermines the purely sociological argument.

  **The Verdict:** Pseudohistory *is* a real epistemic category. Its core characteristic is not outsider status, but **systematic failure to maintain accountability to the full range of relevant evidence across established, independent disciplines, coupled with methodological practices that insulate the core thesis from falsification (often through ad hoc hypotheses and selective evidence dismissal).** Fomenko’s New Chronology is a paradigmatic example: it demands the negation of archaeology, physics-based dating, linguistics, numismatics, and independent documentary traditions to survive, while offering only internal textual correlations as positive evidence. The demarcation line isn't razor-sharp (philosophical demarcation rarely is), and mainstream history isn't flawless. However, the distinction rests on the *systematic nature* of the evidentiary failures and the *scale* of counter-evidence dismissal required. Legitimate radical revisionism, like the recalibration forced by radiocarbon dating, seeks coherence *within* and *between* disciplines; pseudohistory, like Fomenko's, demands their overthrow. The label, therefore, does crucial epistemic work, signalling a theory that has severed its tether to the multifaceted reality of the past, regardless of the credentials or methods of its proponent.
