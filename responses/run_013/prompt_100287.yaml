     This suggests that the paradox is an artifact of the way we individuate the alternatives. In the non-self-regarding example, we had to describe the social state completely, and the protected domains were defined on pairs that held the other's choice fixed. But if preferences are not self-regarding, then even when holding the other's choice fixed, the individual might care about the other's choice. However, the requirement for the protected domain is that the pair concerns only the individual's own life. This is typically interpreted as the pair differing only in the individual's own choice. 

     The key is that in the self-regarding case, the individual's preference over the pair that concerns only her own life is independent of the other's choice. But in the non-self-regarding case, the individual might have a preference that does depend on the other's choice. However, note that in the protected pair, we fix the other's choice. So even if the individual cares about the other's choice, when we fix it, she can still have a preference over her own choice.

     The deeper issue is that with self-regarding preferences, the social choice function might be easier to define consistently with both liberalism and Pareto, but with non-self-regarding preferences, it becomes impossible.

     In summary, the conflict does not survive the restriction to self-regarding preferences. The paradox relies on individuals having preferences that extend into other people's private affairs.

     This is not to say that the paradox is not important. In reality, people do care about others. So the paradox highlights a real tension in social choice.
