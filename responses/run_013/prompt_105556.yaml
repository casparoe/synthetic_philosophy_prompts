answer: |-
  What a fantastic transition from rocks to words—and you've hit on one of the most contentious debates in contemporary philosophy of language. Your friend's summary is admirably punchy but oversimplifies in ways that would indeed make specialists wince. Let's dissect it claim-by-claim, separating the defensible from the dubious. I'll lean on key figures like Christopher Hom, Robin Jeshion, Luvell Anderson, and Erin Beeghly for clarity.

  ---

  ### **1. "Slurs are pure attitude — they don't describe anything, they just spit. That's the expressivist line."**
  - **Defensible but incomplete**:  
    Expressivists (e.g., Timothy Williamson, Lynne Tirrell) argue slurs *primarily* express contempt rather than describe. Think of them like expletives: "Damn!" conveys anger without asserting "I am angry."  
    - **Where philosophers push back**: Pure expressivism struggles with **systematicity**. Slurs embed in complex sentences (*"No one should hire a [slur]"*) and participate in inferences, unlike raw expressions of emotion. Also, slurs *do* pick out a group (e.g., "k*ke" targets Jews), which pure expressivism downplays.

  ---

  ### **2. "You can't analyze a slur as 'member of group G' plus a sneer."**
  - **Widely accepted**:  
    Both expressivists and content theorists (e.g., Hom, Jeshion) reject the "neutral word + sneer" model. Why?  
    - **Semantic incorporation**: The contempt isn't tacked on; it's baked into the word's conventional meaning. Saying *"[slur]s are lazy"* isn't just "Jews are lazy + sneer"—it asserts bigotry as part of the content.  
    - **Non-detachability**: You can't "unsneer" a slur by using it neutrally. Even if you say *"I have nothing against [group], but..."* the slur still offends.

  ---

  ### **3. "A slur and the neutral word pick out the same people but don't mean the same thing."**
  - **Consensus view**:  
    Yes—this is the **Neutral Counterpart Thesis** (Hom 2008). "Jewish" and "k*ke" corefer but differ in meaning.  
    - **Your nag about missing neutral counterparts**: **This is a serious problem**. Some slurs lack uncontested neutrals (e.g., the n-word for Black people, "tr*nny" for transgender people). Content theorists (who treat slurs as descriptive) struggle here. Expressivists handle it better: no neutral term needed if slurs primarily express attitude.

  ---

  ### **4. "Proof that the ugliness isn't in the content: it survives in conditionals/questions."**
  - **Your instinct is spot-on—this is hotly contested**:  
    Expressivists (e.g., Rachel McKinley) use **embedding tests**:  
    - *Conditional*: *"If you hire a [slur], productivity will drop."* → Still offensive.  
    - *Question*: *"Is X a [slur]?"* → Still offensive.  
    They argue that if contempt were truth-conditional, it would be "cancelled" in these frames (like *"If Santa exists, he brings gifts"* doesn't assert Santa exists).  
    - **Why philosophers wince**:  
      - Content theorists (Hom, Jeshion) retort that slurs **presuppose** contempt (like "John stopped smoking" presupposes he smoked). Presuppositions survive embedding!  
      - **Your key insight**: Embedding tests don't *prove* expressivism—they just show contempt isn't *asserted*. It could be presupposed or conventionally implicated (see Anderson 2018).  

  ---

  ### **5. "The other camp says slurs mean 'G-person and contemptible'."**
  - **Oversimplified to the point of error**:  
    Content theorists like Hom define slurs as **pejorative content** (e.g., *"ought to be subject to discrimination based on being G"*), not just "contemptible."  
    - **Why it matters**: This explains why slurs commit users to hateful claims. Saying *"Some [slurs] are smart"* still implies the group is generally inferior.  
    - **Major objection**: This makes slurs **objectionably true/false**. If "contemptible" is part of meaning, *"[Slur]s are contemptible"* becomes analytic (true by definition)—but we reject this! (Most theorists avoid this by treating contempt as non-truth-conditional.)

  ---

  ### **6. "Reclamation shows it's about use, not meaning."**
  - **Half-right, half-wrong**:  
    - **Use over meaning? Partly**: Reclamation (e.g., "queer," "n*gga") involves marginalized groups repurposing slurs affectionately. Your friend is right that **pragmatic permissions** shift (who can say it, in what context).  
    - **But meaning *can* change**: Reclaimed slurs often shed derogatory force *for in-group speakers*. "Queer" now has neutral/academic uses. This isn't just permission—it's **semantic drift** (Bianchi 2014).  
    - **Your worry about in-group use**: On your friend's view, reclaimed slurs would *still* be insults—which is absurd. Philosophers like Luvell Anderson argue reclamation can **split semantic content**: The word retains historical toxicity but gains new, positive conventions in certain contexts.

  ---

  ### **The Bigger Picture: Where Your Friend's Account Falters**
  1. **The "proof" from embedding** is weak—it ignores presupposition/implicature.  
  2. **Reclamation is messier** than "meaning fixed, permissions change." Semantic content *can* evolve.  
  3. **Not all slurs have neutral counterparts**—this strains content theories.  
  4. **He misses hybrid views** (e.g., Bach 2018: slurs express contempt *and* describe group-membership).

  ---

  ### **What a Specialist Would Add**
  - **Power & Harm**: Slurs aren't just "attitude"—they enact subordination (Maitra 2012).  
  - **Context Sensitivity**: Offense varies by speaker/audience (e.g., in-group vs. out-group use).  
  - **Experimental Data**: Psycholinguistics shows slurs trigger faster affective responses than neutrals (e.g., Croom 2013), supporting expressivist-leaning views.

  You're right to distrust the tidiness—this debate is famously unresolved. Your geology-trained eye for "loose joints" is serving you well. If you want pre-class reading, hit Jeshion's *"Slurs and Expressivity"* (2013) for expressivism and Hom's *"The Semantics of Racial Epithets"* (2008) for content. Both are accessible and highlight the fault lines you're spotting.
