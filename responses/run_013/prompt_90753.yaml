    - High in uniformity and inheritance, lower in lottery? 
  But let's think: 
    - Uniformity: high h² (low VP because VE=0, so h²=1 if no other VE)
    - Lottery: moderate h² because of added VE (and no covGE)
    - Inheritance: high h² because of covGE

