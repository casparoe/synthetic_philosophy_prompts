  #### 3. Verbal Residue  
  Some disagreements dissolve under conceptual clarification:  
  - **Issue:** "Heritability implies genetic causation."  
    - **Why Verbal:** Variance-decomposition uses \(h^2\) strictly for variance partitioning; construct-skeptics often hear it as individual-level genetic causation.  
    - **Dissolving Reformulation:** Explicitly distinguish "variance accounted for" (population) from "causal effect" (individual).  
  - **Residual Substantive Dispute:** Verbal clarification resolves miscommunication but leaves intact disputes about stability across environments (§2, Crux 4) and research utility (§2, Crux 2).  

  #### 4. Novel Elements  

  **4a. Counterfactual Heritability Joint Verdict**  
  - **Variance-Decomposition Verdict:** "Counterfactual \(h^2\) is well-defined if environmental shifts are specified. Standard \(h^2\) does not approximate it but anchors predictions."  
  - **Construct-Skeptic Verdict:** "Counterfactual \(h^2\) is ill-defined due to dynamic \(V_A\). Standard \(h^2\) approximates nothing beyond the current context."  
  - **Joint Verdict:** *None* (irreconcilable).  

  **4b. Three-Schooling-Worlds Case**  
  Three societies share identical genotype distributions but differ in schooling allocation:  
  - **Lottery World:** Schooling uncorrelated with family background.  
  - **Inheritance World:** Schooling correlates with parental wealth.  
  - **Uniformity World:** Identical schooling for all.  

  **Predictions for Cognitive Trait Heritability (\(h^2\)):**  
  - **Lottery World:**  
    - VD: Moderate \(h^2\) (\(V_A\) constant; \(V_E\) added without \(cov_{GE}\)).  
    - CS: Moderate \(h^2\) (least confounded by \(cov_{GE}\)).  
  - **Inheritance World:**  
    - VD: High \(h^2\) (\(cov_{GE}\) inflates \(V_A\)).  
    - CS: High \(h^2\) (artificially inflated by \(cov_{GE}\)).  
  - **Uniformity World:**  
    - VD: High \(h^2\) (near 1 if \(V_E \approx 0\)).  
    - CS: High \(h^2\) (trivially, due to suppressed \(V_E\)).  

  **What the Pattern Shows:**  
  - **Genetic Architecture:** Both agree that identical \(V_A\) but divergent \(h^2\) across worlds proves \(h^2\) is not intrinsic to the trait. Disagree on whether conserved \(V_A\) (§2, Crux 4) implies stable architecture (VD: yes; CS: no).  
  - **Raising the Trait:**  
    - Lottery World: Interventions raising school quality increase trait means (both agree).  
    - Inheritance World: Equalizing schooling reduces variance but may not raise means (both agree).  
    - Uniformity World: Schooling interventions ineffective (both agree).  
    - *Joint Conclusion:* Heritability patterns do not directly inform *how* to raise traits; environmental causal effects are best isolated in the lottery world.  

  #### 5. Open Questions  
  The collaboration leaves unresolved:  
  - Can \(cov_{GE}\) be empirically isolated from "pure" \(V_A\) in standard \(h^2\) estimates?  
  - Does counterfactual \(h^2\) become well-defined under restrictive assumptions (e.g., no \(G \times E\))?  
  - For traits with stable \(h^2\) across diverse environments, does this indicate genetic robustness?  

