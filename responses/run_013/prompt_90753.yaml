  We are drafting a joint statement between two camps: the variance-decomposition camp and the construct-skeptic camp. The goal is to produce a document that both can sign, including agreed claims, residual disagreements, and two novel elements: counterfactual heritability and the three-schooling-worlds case.

  First, we must establish the agreed claims. Both camps agree on the mathematical definition of heritability in a population: it is the proportion of phenotypic variance attributable to additive genetic variance (narrow-sense heritability) in a specified population and range of environments. They also agree that heritability estimates are population-specific and environment-dependent. Moreover, both accept that heritability does not imply genetic determinism at the individual level.

  Now, for the disagreements. The variance-decomposition camp sees heritability as a useful parameter for prediction (e.g., response to selection) and for guiding genetic research. The construct-skeptic camp argues that for traits of interest (like cognitive abilities), heritability is often misinterpreted and confounded by environmental correlations, making it uninformative or misleading.

  We introduce two new elements:

  1. Counterfactual heritability: the heritability that would obtain if the population's environment distribution were shifted. We ask both camps whether this is well-defined and what the ordinary estimate approximates.

  2. The three-schooling-worlds case: three societies with different schooling allocation mechanisms (lottery, inheritance, uniformity) but the same genotype distribution. We ask for predictions on heritability in each and what the pattern shows.

  We structure the document as follows:

  1. Agreed claims (numbered list in prose)
  2. Disagreements table with specified columns
  3. Verbal residue section
  4. Machine-readable summary (JSON)

  In the table, we list cruxes with:
  - ID
  - Crux (neutral question)
  - Variance-Decomposition Position (in their words)
  - Construct-Skeptic Position (in their words)
  - Shared Case or Argument (what both agree bears on the crux)
  - Predictions from each camp
  - Whether settling the crux would move each camp (yes/no)
  - Dispute type (substantive, verbal, mixed)

  We must avoid strawmanning. If we can't find a formulation a camp would accept, we note that in open_questions.

  Let's brainstorm the agreed claims:

  1. Heritability, as defined in quantitative genetics, is the ratio of additive genetic variance to total phenotypic variance in a specified population and set of environments.
  2. Heritability estimates are specific to the population and environment in which they are measured and do not generalize automatically to other populations or environments.
  3. Heritability does not imply that an individual's trait is determined by their genes; it is a population-level statistic.
  4. Heritability estimates can be used to predict response to artificial or natural selection in that population under similar environmental conditions.
  5. The heritability coefficient is sensitive to the distribution of environments and genotypes in the population.

  Now, for disagreements, we identify several cruxes:

  Crux 1: Does a high heritability estimate for a trait in a population imply that environmental interventions are unlikely to change the trait mean?

  - Variance-decomposition: No, because heritability is about variance in the current environment, but a new environmental factor could change the mean without affecting the heritability estimate (if it affects everyone equally). However, heritability can inform about the expected variation in response to environmental change.
  - Construct-skeptic: Not necessarily, but in practice, high heritability is often taken to imply that environmental interventions are less promising, which is a misinterpretation. Moreover, for traits with high environmental correlations (e.g., socioeconomic traits), the estimate itself may be inflated by unmeasured environmental confounds.

  Shared case: Consider a new environmental intervention that is uniformly applied. Both agree that such an intervention can change the trait mean even if heritability is high.

  Predictions: 
  - Variance-decomposition: A high heritability does not preclude mean changes from environmental interventions.
  - Construct-skeptic: High heritability estimates, especially for socially salient traits, often lead to the erroneous conclusion that environmental interventions are futile.

  Would settling move them? For variance-decomposition, they already hold that heritability does not preclude mean changes, so no. For construct-skeptic, if it were shown that in practice the misinterpretation is rare, that might move them, but they would still point to actual cases of misuse. So mixed.

  Dispute type: Mixed (partly about the interpretation and partly about the practical consequences).

  Crux 2: Is the standard heritability estimate a reliable guide for where to look for genetic influences?

  - Variance-decomposition: Yes, because a high heritability indicates that a substantial portion of the variance is due to additive genetic effects, so genetic research (e.g., GWAS) is warranted.
  - Construct-skeptic: Not necessarily, because the estimate can be inflated by gene-environment correlations (rGE) and unmeasured environmental factors, so it may not reflect the true importance of genetic factors.

  Shared case: In the presence of rGE, the additive genetic variance component may include covariance between genes and environment, which is not purely genetic.

  Predictions: 
  - Variance-decomposition: Even with rGE, the heritability estimate still predicts the response to selection and the additive genetic component is still relevant for genetic research.
  - Construct-skeptic: The presence of rGE makes the estimate misleading for understanding the causal role of genes.

  Would settling move them? If we could isolate the rGE component, it might move both. But it's substantive.

  Crux 3: For a trait like cognitive ability in human populations, is the heritability estimate primarily a function of the environmental variation in that population?

  - Variance-decomposition: The heritability estimate depends on both genetic and environmental variance. In a population with reduced environmental variation, heritability may be higher because environmental variance is lower. But the estimate is still valid for that population.
  - Construct-skeptic: For cognitive ability, environmental variation is often systematically correlated with genetic variation (e.g., through family background), so the estimate is confounded and does not reflect the true genetic influence.

  Shared case: The three-schooling-worlds case (introduced below).

  Now, we introduce counterfactual heritability.

  Counterfactual heritability: 
  - Variance-decomposition: This is well-defined in theory if the alternative environment distribution is specified, but it is not what is estimated by standard methods. Standard methods estimate the heritability in the current environment. Counterfactual heritability might be approximated by altering the environment in an experimental design, but it is not the same as the standard estimate.
