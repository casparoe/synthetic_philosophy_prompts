answer: |-
  ### Joint Statement on Heritability in Quantitative Genetics

  **Preamble:**  
  We, the undersigned, representing the variance-decomposition camp and the construct-skeptic camp, acknowledge persistent disagreements about the interpretation and utility of heritability coefficients. This document establishes common ground, clarifies residual disputes, and introduces novel thought experiments to advance the discourse. We agree that heritability, defined as \( h^2 = \frac{V_A}{V_P} \) (narrow-sense), is a population-level statistic. Disagreements center on its scope, stability, and practical implications for traits like cognitive ability. Our collaboration identifies cruxes where empirical evidence could resolve differences and distinguishes substantive from verbal disputes.

  #### 1. Agreed Claims  
  Both camps endorse the following statements without reservation:  
  1. Heritability is a population-specific parameter quantifying the proportion of phenotypic variance (\(V_P\)) attributable to additive genetic variance (\(V_A\)) in a specified population and defined range of environments.  
     *Rationale: Both accept the mathematical definition from quantitative genetics.*  
  2. Heritability estimates are sensitive to the distribution of environments and genotypes in the sampled population and do not generalize automatically to other populations or environmental conditions.  
     *Rationale: Both recognize environmental variance (\(V_E\)) and gene-environment covariance (\(cov_{GE}\)) as key influences.*  
  3. Heritability is not a measure of genetic determinism at the individual level; it does not indicate the extent to which a specific individual's phenotype is "caused" by their genes.  
     *Rationale: Both reject conflating population variance with individual causation.*  
  4. Heritability estimates predict response to artificial or natural selection in the same population under stable environmental conditions.  
     *Rationale: Both accept Fisher’s fundamental theorem and breeding experiments.*  
  5. Standard heritability estimation methods (e.g., twin or genomic designs) are mathematically valid for decomposing variance in the observed population.  
     *Rationale: Both acknowledge the methods’ internal consistency for their stated purpose.*  
  6. For traits with gene-environment interactions (\(G \times E\)), heritability depends on the distribution of interacting environmental factors in the population.  
     *Rationale: Both agree \(G \times E\) inflates \(V_P\) and alters \(h^2\).*  

