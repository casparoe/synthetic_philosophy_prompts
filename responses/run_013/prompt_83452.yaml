prompt: |-
  I have been trying to work out what I think makes a decision to stop searching rational, and my verdicts on cases will not line up as neatly as I would like.

  Picking a cereal: I take the first box that is on sale and looks familiar, though I could scan the whole aisle at no real cost. I count this as perfectly rational. Choosing a bathroom paint colour: I stop at the first swatch that seems fine, out of thirty, again with browsing nearly free. Also rational. Apartment hunting: I view eight of forty, find one that meets every criterion I set in advance, and stop because each further viewing costs me an evening. Rational. Hiring: the committee stops at the first candidate who clears the bar, even though further interviews are cheap and a better candidate may be next in line. Rational. Surgeon: I take the first in-network surgeon listed without checking outcomes, though a page of public data is one click away. Not rational. Firm: it ships a design that clears its own threshold although a single cheap test would probably have revealed a much better design, and it skips the test. Not rational. Weary renter: after eight viewings with nothing acceptable, she signs a lease that fails two of her own stated requirements because she cannot face more viewings. Not rational. Partner: I marry the first person who meets my list of requirements, having met almost no one else. I want to say this is not irrational, but it feels unlike the cereal case and I cannot say why.

  The only principle I can state is that stopping is rational when the expected gain from further search is smaller than what the search would cost, but that seems to make my cereal and paint verdicts wrong, so I suspect it is either incomplete or not the real principle at all.

  Please tell me what principle, or smallest set of principles, actually delivers these verdicts. Two things I cannot reconcile: in the cereal and paint cases I think stopping is rational even though further search is nearly free, while in the surgeon and firm cases cheap search seems to make stopping irrational; and I treat the apartment and hiring cases as rational but the weary renter as not, though all three stop for want of further effort. Say what the principle predicts for a case I have not listed, such as a voter who settles on the first candidate who seems acceptable and stops reading, when the stakes are high and the reading is tedious, and which of my verdicts it forces me to abandon if it cannot have them all.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're struggling to find a consistent principle for rational search termination across different scenarios. The examples they provide—cereal, paint, apartment, hiring, surgeon, firm, weary renter, partner—all seem intuitively rational or irrational to them, but they can't pinpoint why. 

  First, I notice their initial hypothesis (expected gain vs. cost) feels insufficient because it clashes with their intuition about low-cost searches like cereal or paint being rational to terminate early. That's interesting—why do we instinctively accept "good enough" in low-stakes scenarios even when optimization is virtually free? 

  Hmm... maybe the key isn't just cost/benefit but *stakes* and *commitment*. Cereal and paint choices are low-stakes and reversible (you can switch brands next week), while surgeons and marriage are high-stakes and hard to undo. The user's surgeon example is telling: skipping publicly available data feels negligent because health outcomes matter. But their "marry the first person" case confuses them—it's high-stakes like surgery, yet they hesitate to call it irrational. 

  Ah! That's where the *reversibility* distinction matters. Marriage is reversible (divorce exists), though painful. Surgery might be irreversible (if complications arise). The firm's design flaw could cause permanent reputational damage. Meanwhile, the weary renter's choice is "rational" in a narrow sense (cost-avoidance) but violates *precommitment integrity*—they abandon pre-set criteria under emotional duress, which feels like a failure of rationality. 

  For the voter case (high stakes, tedious research): rational stopping would require either (a) very high search costs relative to marginal vote impact, or (b) confidence the candidate clears all critical thresholds. But given voting's collective stakes, skimming feels irresponsible—unlike cereal. 

  The user might need to adjust their hiring verdict: stopping at the first "barely passes" candidate is irrational if better options are likely and interviews are cheap. Their intuition treats it as rational because committees often do this, but consistency demands calling it out. 

  ...Wait, did I just solve their puzzle? The core principles seem to be:  
  1. **Marginal cost vs. marginal benefit** (classic)  
  2. **Stakes** (impact of error)  
  3. **Reversibility** (can you undo the choice?)  
  4. **Precommitment integrity** (deviating only for good reason)  
  5. **Search-cost framing** (is cost *avoidance* the driver, or just convenience?)  

  The weary renter fails #4; the surgeon fails #2 and #3; the hiring committee fails #1 and #2. Cereal/paint pass all. Partner case passes if reversibility is considered, but barely. Voter? Probably fails #2 unless research is prohibitively tedious. 

  User’s self-awareness is impressive—they sensed their hiring verdict was the weak link. And their "cheap search = irrational stop" exception (surgeon/firm) now makes sense: high stakes override low costs. Case closed? Let me structure this...
answer: |-
  Your intuitions reveal a deeper structure to rational search termination than simple cost-benefit analysis. The core principle isn't *just* "expected gain vs. cost" but **context-dependent thresholds for confidence and commitment under stakes and reversibility constraints.** Here's the unified framework that explains all your verdicts:

  ### Core Principles
  1.  **Stakes Threshold:** Stopping is irrational if the *potential downside of a suboptimal choice* is catastrophically high relative to search costs (e.g., surgeon, critical design flaw).
  2.  **Reversibility/Inertia:** Stopping is rational if the choice is easily reversed or low-commitment (e.g., cereal, paint), but irrational if reversal is costly or impossible *and* stakes are significant (e.g., firm's shipped design).
  3.  **Precommitment Integrity:** Stopping is rational only if you meet the *actual criteria you set when objective*. Deviating due to exhaustion (weary renter) or convenience (surgeon) violates this.
  4.  **Search Cost Framing:** Costs must be *marginal* and *proportional*. "Cheap" alone isn't sufficient; it must be cheap *relative to the decision's stakes and your current uncertainty*.

  ### Applying the Principles to Your Cases
  | **Case**          | **Rational?** | **Why (Per Principles)**                                                                 |
  | :---------------- | :------------ | :--------------------------------------------------------------------------------------- |
  | **Cereal**        | Yes           | **Low stakes, high reversibility.** Cost of a suboptimal choice is negligible.            |
  | **Paint Color**   | Yes           | **Low stakes, high reversibility.** Easy to repaint if dissatisfied later.               |
  | **Apartment**     | Yes           | **Meets precommitment criteria, search cost high.** Further gain unlikely to justify cost. |
  | **Hiring**        | **No** (Adjust) | *Violates Stakes Threshold.* If a better candidate is likely and interviews are cheap, stopping risks significant team impact. Committee's duty elevates stakes. |
  | **Surgeon**       | No            | **High stakes, low reversibility.** Skipping near-zero-cost search risks catastrophic harm. |
  | **Firm's Design** | No            | **High stakes, low reversibility.** Cheap test could prevent costly failure; inertia isn't justified. |
  | **Weary Renter**  | No            | **Violates Precommitment Integrity.** Stopping due to exhaustion, not meeting criteria.  |
  | **Partner**       | **No**        | **High stakes, high inertia.** "Meets requirements" is insufficient without adequate sampling to calibrate expectations. Reversibility (divorce) is costly and traumatic. |

  ### Resolving Your Conflicts
  -   **Cereal/Paint vs. Surgeon/Firm:** The difference is **stakes and reversibility**, not just search cost. Brain surgery consequences dwarf cereal regret. A shipped design flaw is harder to undo than repainting a bathroom.
  -   **Apartment/Hiring vs. Weary Renter:** The renter abandons pre-set criteria under duress ("cannot face more viewings"), while the apartment searcher *achieves* their criteria. Hiring should be judged like surgery—high stakes make "first barely acceptable" insufficient if better exists cheaply.
  -   **Partner Case:** This fails the **stakes and sampling calibration** test. Marrying requires confidence your "requirements" are well-calibrated, which demands meeting more people. Unlike cereal, partner choice has lifelong high-stakes consequences.

  ### Voter Case Analysis
  -   **Settling on the first acceptable candidate without reading further.**
      -   **Stakes:** High (collective impact of governance).
      -   **Reversibility:** Very low (can't easily undo an election result).
      - **Search Cost:** Tedious but low marginal cost per candidate.
      - **Precommitment Integrity:** "Acceptable" is likely underspecified; deeper research may reveal critical flaws.
  -   **Verdict:** **Irrational.** High stakes + low reversibility + cheap marginal search cost make stopping at "first acceptable" negligent. Voter's duty parallels the surgeon's—minimal effort could prevent significant harm.

  ### Verdict You Must Abandon: Hiring Committee
  Your intuition treats hiring as rational, but consistency demands rejecting this. If interviews are truly cheap and a better candidate is plausible, stopping at the first "barely clears bar" candidate ignores the high stakes of a bad hire (team morale, productivity, replacement costs). Committees have a fiduciary duty to optimize within reason—making this analogous to the surgeon skipping data.

  ### The Smallest Set of Principles
  Rational stopping requires **ALL** of:
  1.  **Cost-Benefit Justification:** Expected marginal gain ≤ Search cost, **or**...
  2.  **Stakes-Reversibility Safe Harbor:** Choice is low-stakes *and* easily reversible (e.g., cereal), **and**...
  3.  **Criteria Fulfillment:** You meet pre-set, objectively defined criteria without exhaustion-driven compromise.

  **Why it works:** The cereal/paint cases satisfy #2. Apartment satisfies #1 and #3. Surgeon fails #1 and #2. Firm fails #1 and #2. Weary renter fails #3. Partner fails #2 and lacks calibration for #3. Hiring fails #1 (if search is cheap) and ignores stakes. Voter fails #1 and #2.

  This framework prioritizes *robustness*: Rational search termination must be defensible not just economically, but ethically and epistemically when consequences are severe or irreversible.
