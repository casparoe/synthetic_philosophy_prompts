answer: |-
  I understand the need to map this territory carefully. Let's walk through the philosophical landscape together, starting with historical foundations, building to modern distinctions, and addressing your cases directly. This isn't about lists; it's about the *structure* of deception.

  **1. The Foundational Polemic: Augustine's Hard Line**
     *   **Core View:** Augustine (drawing heavily on earlier Church Fathers) defined a lie as **any utterance contrary to the mind** (*contra mentem*). It's about **intention to deceive**, regardless of truth value or outcome.
     *   **Applied to Your Cases:**
          *   **Nurse:** Clear lie. Uttered a falsehood *intending* the patient to believe it.
          *   **Resident:** Augustine *would call this a lie*. The resident *intended* the son to form a false belief ("Mother is fine") through calculated truth-telling and omission. The utterance *as used* was "contrary to the mind" – its purpose was deception.
          *   **Uncle:** Not a lie. No intent to deceive; he believes his falsehoods. Augustine focused on *moral guilt*, which requires intent.
          *   **Friend (Whoppers):** Tricky. If the *intent* is purely to entertain or boast, knowing no one believes it, Augustine *might* classify it as a "jocose lie" – still technically a lie (wrongful utterance contrary to mind), but perhaps less grievous. If the intent *is* deception (even if incompetent), it's a standard lie.
     *   **Augustine's Criterion:** **Intentional Deception** (via speech act). Truth/falsity of the *words* is secondary to the *intent* behind their utterance.

  **2. The Modern Analytic Crucible: Refining the Definition**
  Modern philosophy grapples intensely with defining "lie." Key contenders:
  *   **The Traditional View (Mahon):** A lie is (1) a statement (2) believed by the speaker to be false (3) made with the intention to deceive the hearer.
  *   **Stricter View (e.g., Chisholm & Feehan, Carson):** Adds (4) the statement must *actually be false*.
  *   **Broader View (e.g., Fallis):** Focuses on violating a norm of conversation (asserting what you believe false, regardless of intent to deceive *in that moment*).

  **3. Mapping Your Cases with Modern Tools:**

  | Case                          | Modern Analytic Lie? (Requires Intent & Belief of Falsity) | Augustine's Lie? (Requires Intent to Deceive via Speech) | Broader Category                         | Key Mechanism                              |
  | :---------------------------- | :--------------------------------------------------------- | :------------------------------------------------------- | :--------------------------------------- | :----------------------------------------- |
  | **Nurse (False Landing)**     | ✅ YES (False, believed false, intent to deceive)          | ✅ YES                                                   | **Lie**                                  | Direct false assertion                     |
  | **Resident (Scan File Dodge)** | ❌ NO (Statements were *true*)                             | ✅ YES                                                   | **Intentional Deception**                | Exploiting inference gaps (Omission/Implicature) |
  | **Uncle (Sincere Falsehoods)** | ❌ NO (Believes statements are true)                       | ❌ NO                                                    | **Mistake / False Belief**               | Lack of knowledge/accuracy                 |
  | **Friend (Obvious Whoppers)** | ⚠️ DEBATABLE (Depends on *intent*)                         | ⚠️ DEBATABLE (Jocose lie?)                               | **Bullshit (Frankfurt) / Bluster**       | Disregard for truth value                  |
  | **Silent Stager/Planter**     | ❌ NO (No false *statement*)                               | ❌ NO (No *utterance*)                                   | **Intentional Deception**                | Manipulating context/environment           |

  **4. The Core Distinction You're Circling: Deception vs. Lying**
  *   **Lying:** A *specific way* to deceive involving **making an assertion one believes to be false**.
  *   **Deception (Intentional):** The **broader genus** – successfully causing someone to believe something false. Lying is one species; your resident and the silent stager use others.
  *   **Your Resident's Move:** This is **Intentional Deception achieved through True Statements and Strategic Omission/Implicature**. The resident exploited the son's likely inferences ("If it were bad, he'd tell me," "He only answered those minor questions, so the big thing must be fine"). The *truth* of the words is a shield, but the *intent* and *effect* are deception.

  **5. Established Terms & Their Limits:**
  *   **Paltering:** **Actively using truthful statements to create a misleading impression.** This *fits your resident perfectly*. **Edge:** Doesn't cover *pure* omission (saying *nothing*) or environmental manipulation (the silent stager). It's specifically about *verbal* truth used deceptively.
  *   **Misleading:** **Causing someone to form a false belief.** This is the *effect*. **Edge:** Too broad. It covers lies, paltering, the silent stager, and even accidental misunderstandings. Doesn't specify *means* or *intent*.
  *   **Deception by Omission:** **Intentionally withholding relevant information to cause a false belief.** **Edge:** The resident did *more* than omit; they actively answered *other* questions to steer attention *away* from the omission. Pure omission (just staying silent) is different.
  *   **Implicature (Gricean):** Meaning *implied* but not stated. The resident exploited "conversational implicature" – the son inferred the mother was fine because the resident *didn't* say otherwise when asked peripheral questions. **Edge:** A linguistic tool, not a moral category. Can be used innocently or deceptively.
  *   **Bullshit (Frankfurt):** Speech utterly indifferent to truth value. **Fits your friend.** **Edge:** Not necessarily intended to deceive (often to impress/entertain), and doesn't describe the resident's carefully calibrated truth.

  **6. Coining a Term: "Truthful Deception" (with Edges Defined)**
  Since "paltering" isn't universally known and specifically covers the resident, but not the silent stager, let's define a broader term capturing the core mechanism you're tracking:

  *   **Term:** **Inferential Misdirection**
  *   **Definition:** **The intentional act of manipulating an agent's environment (linguistic, physical, or contextual) such that the agent is predictably and reasonably led, through their own inferences, to form a specific false belief, without the deceiver making a false statement.**
  *   **What it Captures:**
      *   **Resident:** Used true statements + selective answering to manipulate the linguistic context, knowing the son would infer "no news is good news."
      *   **Silent Stager:** Manipulates the physical/documentary context, knowing the observer will infer the false conclusion.
      *   **Core Mechanism:** Exploiting the human tendency to fill gaps with plausible (but incorrect) inferences. Intent is crucial.
  *   **Edges & What it Leaves Out:**
      *   **Requires Intent:** Accidental misunderstandings don't count.
      *   **Requires Inference:** Direct false statements (lies) or pure coercion/threats don't primarily rely on the victim's *inference*.
      *   **No False Statement:** The deceiver avoids uttering or writing a proposition they believe false. Truthful statements or non-verbal setups are the tools.
      *   **Predictability:** The deceiver must reasonably expect the inference to occur.
      *   **Leaves Out:** Pure omission without active environmental manipulation (just staying silent *might* not qualify unless context makes the silence itself highly inferential). It also leaves out "bullshit" (indifference to truth) and sincere mistakes.
      *   **Relationship to Lying:** It's a *sibling* to lying under the broader genus of Intentional Deception. Both aim for false belief; lying uses false statements, inferential misdirection uses manipulated truth/context to trigger faulty inference.

  **Conclusion & Your Answers:**

  1.  **The Resident's Move:** Augustine calls it a lie (intent to deceive via speech). Modern analysis calls it **paltering** (a form of intentional deception using true statements). It's **Inferential Misdirection**.
  2.  **The Nurse's Move:** Universally a **lie**.
  3.  **Your Uncle:** Not a lie or deception; **sincere false belief**.
  4.  **Your Friend:** Likely **bullshit** (if indifferent to truth/ belief), not a lie if no intent to deceive, or a *failed* lie if intent was there.
  5.  **The Silent Stager/Planter:** Not a lie (no false statement). It's **intentional deception**, specifically **Inferential Misdirection** through environmental manipulation. Augustine wouldn't call it a *lie* (no utterance), but would condemn it as deception.

  **The Core Distinction Tracked:** You are pinpointing **Intentional Deception achieved without making a false statement**, relying instead on exploiting inference gaps through manipulated truth (paltering) or context (staging). The essential ingredients are **intent to cause a false belief** and **reliance on the victim's own reasoning process being predictably steered astray** by selective truth or staged evidence. "Inferential Misdirection" names this specific mechanism within the broader landscape of deception. The moral weight, as Augustine foresaw, often hinges on that intent, regardless of the truth-value of the words uttered.
