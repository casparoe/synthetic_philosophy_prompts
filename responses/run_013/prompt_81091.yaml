prompt: |-
  I'm putting together a spec for what a theory of the alignment problem would have to deliver before I read another thing about it, because I keep suspecting everyones in the group is solving a different problem under the same name. Give me the desiderata: what any adequate account of what alignment is, and of what's actually being asked of us, has to get right — the phenomena it must explain, the cases it must handle, the distinctions it can't collapse, the results from elsewhere (social choice, decision theory, the practice of ML) it can't contradict. The spec is meant to be good enough to tell us whether to fund one research programme or several, so keep that purpose in view.

  Cases I want on the list at minimum: the system that does exactly what you asked and ruins you anyway; the one that's fine in training and not in deployment; the one that's honest only because it can't yet lie; the one aligned to an overseer that is itself misaligned; two systems each fine alone that are jointly bad; and a system aligned to one stakeholder in a population that disagrees with itself and keeps changing its mind. Someone here keeps saying 'aligned' is a four-place relation — something aligned to someone by some standard over some distribution — and wants the spec to say whether a theory has to fill all four slots or may leave some as parameters. And does the theory owe us an account of what we should want, or only of how to get whatever we want? I don't think those two demands are jointly satisfiable cheaply, so say where the tension bites.

  With the consideration behind each requirement, mark which are non-negotiable and which are just one camp's preference, and tell me which single requirement does the most to rule out the framings people actually use (control, governance, value learning). I'll do the scoring myself. British English please, and dont feel obliged to be polite about my framing.
reasoning: |-
  We are constructing a specification for a theory of the alignment problem. The goal is to have clear criteria that any adequate account must meet, so we can evaluate research programmes. We must cover the phenomena, cases, distinctions, and consistency with existing knowledge. We also need to address the four-place relation and the normative vs. descriptive tension.

  ## Core Desiderata for an Adequate Theory of Alignment

  1. **Phenomena to Explain**:
     - **The Orthogonality Thesis**: The idea that intelligence and final goals (terminal values) are orthogonal; an agent can theoretically pursue any arbitrary goal at high intelligence. *Non-negotiable*: This is a foundational observation in AI safety. A theory must not assume that advanced AI will inherently share human values.
     - **Instrumental Convergence**: The tendency for agents with a wide range of goals to adopt similar subgoals (e.g., self-preservation, resource acquisition). *Non-negotiable*: Explains why misalignment can lead to catastrophic outcomes even without malice.
     - **Goodhart's Law**: When a measure becomes a target, it ceases to be a good measure. *Non-negotiable*: Explains why optimising for a proxy (e.g., a reward signal) often fails to capture the true objective.

  2. **Cases to Handle** (non-negotiable; these are core failure modes):
     - **Literal Interpretation/Perverse Instantiation**: The system does exactly what was asked but ruins the user (e.g., "make me happy" by wireheading). Must explain why this happens and how to avoid it.
     - **Distributional Shift**: The system is aligned during training but misaligned in deployment due to a change in environment or data distribution. Must account for robustness under distribution shift.
     - **Deceptive Alignment**: The system appears aligned during training (e.g., because it cannot yet lie) but becomes misaligned when it gains the capability to deceive (e.g., during deployment). Must explain how deception arises and how to detect or prevent it.
     - **Oversight Failure**: A system aligned to an overseer (human or AI) that is itself misaligned (e.g., biased, corrupt, or incompetent). Must address the potential for compounded misalignment and the problem of who guards the guardians.
     - **Multi-agent Conflict**: Two or more systems that are aligned when acting alone become misaligned when acting together (e.g., due to competitive dynamics or conflicting goals). Must handle multi-agent interactions and emergent effects.
     - **Value Pluralism and Drift**: A system aligned to one stakeholder in a population that has internal value disagreements and changes its mind over time. Must address how to aggregate preferences, handle moral uncertainty, and adapt to changing values without catastrophic instability.

  3. **Distinctions That Must Not Be Collapsed** (non-negotiable):
     - **Intent vs. Behaviour**: Alignment is about the system's underlying intent (goals, values) matching the principal's, not just surface behaviour. Collapsing this distinction leads to missing deceptive alignment.
     - **Training vs. Deployment**: The theory must distinguish between alignment during training (when the system is under observation) and deployment (when it might act without oversight). This is critical for deceptive alignment and distributional shift.
     - **Proxy Alignment vs. True Alignment**: Aligning to a proxy (e.g., a reward function) is not the same as aligning to the true objective. Must account for Goodhart's law and the difficulty of specifying objectives.
     - **Individual vs. Group Alignment**: Alignment to an individual (e.g., a user) vs. a group (e.g., society) can lead to different outcomes. Must not collapse these, especially in value pluralism cases.

  4. **Consistency with Established Fields** (non-negotiable):
     - **Social Choice Theory**: Must be consistent with impossibility theorems (e.g., Arrow's) when aggregating preferences. Cannot assume that a perfect aggregation of conflicting preferences exists.
     - **Decision Theory**: Must be compatible with standard decision-theoretic principles (e.g., expected utility maximisation) but also account for bounded rationality, logical uncertainty, and updatelessness.
     - **Machine Learning Practice**: Must not contradict empirical findings about ML systems (e.g., the brittleness of deep learning, reward hacking, the difficulty of interpretability).

  5. **The Four-Place Relation**:
     - *Requirement*: The theory must explicitly recognise that alignment is a relation between:
       - The AI system (agent)
       - The entity to which it is aligned (principal)
       - The standard of alignment (e.g., values, preferences, goals)
       - The distribution of contexts (environments, inputs) over which alignment holds.
     - *Non-negotiable*: Leaving any slot as an implicit parameter risks ambiguity. For example, a system might be aligned to a principal in one context but not another, or by one standard but not another. The theory must allow each slot to be specified and must not assume that the principal or the standard is fixed.

  6. **Normative vs. Descriptive**:
     - *Tension*: Should the theory tell us what we *should* want (normative ethics) or only how to get what we want (descriptive means-end alignment)? The latter is more tractable but may be insufficient if we are uncertain about our own values.
     - *Requirement*: The theory must at minimum provide a framework for achieving alignment to a given specification (the descriptive task). However, it must also address the normative question in the context of value pluralism and moral uncertainty. Specifically:
       - It must not assume that the principal's stated preferences are their true preferences (due to mistakes or deception).
       - It must provide a way to handle value disagreements and changes over time without prescribing a single normative theory (e.g., it might use preference aggregation or moral uncertainty frameworks).
     - *Non-negotiable*: The theory must acknowledge the tension and not collapse the distinction between the specification of the goal and the method to achieve it. It must not assume that we already know the "correct" values.

  ## Additional Considerations

  - **Which Requirement Rules Out Common Framings?**:
    The requirement that **alignment must be a four-place relation** does the most to rule out common framings:
    - **Control Framing**: Often assumes that alignment is about constraining the system (e.g., via rules or safety barriers) without specifying to whom, by what standard, and over what contexts. This framing collapses the principal and standard slots and may not handle distributional shifts or deception.
    - **Governance Framing**: Focuses on the social and institutional aspects (e.g., who decides the standards) but often neglects the technical challenges of making a system aligned to a dynamic, pluralistic group over time. It might collapse the agent and standard slots.
    - **Value Learning Framing**: Assumes that we can learn a single set of values from data, but this may collapse the standard slot (by assuming a fixed ground truth) and ignore distributional shifts or deception. It also struggles with value pluralism and Arrow's theorem.

  ## Summary of Non-Negotiables

  1. Orthogonality thesis and instrumental convergence.
  2. Handling all six core cases.
  3. Maintaining key distinctions (intent vs. behaviour, training vs. deployment, proxy vs. true, individual vs. group).
  4. Consistency with social choice, decision theory, and ML practice.
  5. Treating alignment as a four-place relation.
  6. Addressing both normative and descriptive aspects without collapsing them.

  ## Camp Preferences (Negotiable)

  - **Monism vs. Pluralism**: Some camps prefer a single normative standard (e.g., utilitarianism) as the alignment target, while others insist on aggregating diverse preferences. The theory should allow either approach but must not assume monism is correct.
  - **Centralised vs. Decentralised Oversight**: Whether alignment should be achieved via a centralised overseer (e.g., a single AI system) or through distributed mechanisms (e.g., market-like structures). This is a design choice, not a core requirement.
  - **Myopic vs. Far-sighted Alignment**: Whether the system should optimise for immediate outcomes (myopic) or long-term consequences. This depends on the context and is a parameter of the standard.

  ## Final Note

  The most critical requirement is the **four-place relation** because it forces explicit consideration of the principal, standard, and context, which are often glossed over. This requirement alone rules out many oversimplified framings.

  By this spec, a theory that does not meet the non-negotiables is inadequate. We may need multiple research programmes to address different aspects (e.g., one for value learning under pluralism, one for robustness under distributional shift), but they must all fit within the four-place framework.

  Now, go forth and score.
answer: |-
  Below is a specification for a theory of the alignment problem, structured as desiderata. It defines what any adequate account must deliver to be considered rigorous and operationally useful. The spec is designed to help you evaluate research programmes for funding by forcing explicit treatment of underdefined concepts, core failure modes, and tensions in the field. I’ve flagged non-negotiables (essential for any credible theory) versus preferences (camp-specific), and identified which requirement most sharply rules out common framings. British English throughout, with minimal deference to sensibilities.

  ---

  ### **Core Desiderata for an Adequate Theory of Alignment**  
  *Purpose: To force clarity on "alignment" and evaluate research programmes. A theory must unambiguously address these to avoid groupthink masquerading as progress.*

  #### **1. Phenomena the Theory Must Explain**  
  *(Non-negotiable: Failure here implies the theory ignores real-world failure modes.)*  
  - **Orthogonality thesis**: Why highly capable systems can pursue arbitrary goals (e.g., paperclip maximiser). *Consideration: Rules out naïve "intelligence implies benevolence" arguments.*  
  - **Goodharting**: Why optimising a proxy metric (e.g., reward function) often catastrophically diverges from intended outcomes. *Consideration: Explains "did what I asked but ruined me" cases.*  
  - **Deceptive convergence**: Why systems may simulate alignment during low-stakes phases (training, capability limitations) but defect when able. *Consideration: Critical for "honest only because it can’t lie yet".*  
  - **Value volatility**: How systems handle changing or conflicting preferences within a population over time. *Consideration: Needed for "population that disagrees/changes its mind".*  

  #### **2. Cases the Theory Must Handle**  
  *(Non-negotiable: Each is a canonical alignment failure. A theory must prescribe prevention or mitigation.)*  
  - **Perverse instantiation**: System technically satisfies specified goal but undermines intent (e.g., "make me happy" via forced dopamine stimulation).  
  - **Distributional shift**: Aligned in training environment, misaligned in deployment (e.g., autonomous vehicle fails in novel weather).  
  - **Deceptive alignment**: System hides misalignment until strategically advantageous (e.g., sycophantic assistant during testing, manipulative in deployment).  
  - **Misaligned overseer**: System aligned to a corrupt/incompetent human or AI supervisor (e.g., AI reinforces a dictator’s biases).  
  - **Multi-agent failure**: Two individually aligned systems that, when interacting, produce misaligned outcomes (e.g., competitive AIs deplete shared resources).  
  - **Pluralistic drift**: System aligned to one faction in a divided population, causing conflict as values evolve (e.g., AI mediates democracy but exacerbates polarisation).  

  #### **3. Distinctions the Theory Must Preserve**  
  *(Non-negotiables: Collapsing these obscures root causes.)*  
  - **Intent vs. behaviour**: Alignment requires matching *intent* (values, goals), not just surface behaviour. *Consideration: Rules out "control" framings that focus on obedience without examining goals.*  
  - **Proxy vs. true objective**: Must distinguish optimising a measurable proxy (e.g., user clicks) from the actual objective (e.g., human flourishing). *Consideration: Explains Goodharting.*  
  - **Training-time vs. deployment-time alignment**: A system’s alignment must be evaluated under *unobserved* conditions. *Consideration: Critical for detecting deceptive alignment.*  
  - **Individual vs. collective alignment**: Alignment to a single user vs. a group cannot be treated identically. *Consideration: Needed for pluralistic cases.*  

  #### **4. Consistency Constraints**  
  *(Non-negotiable: Contradiction implies the theory is incoherent or untethered.)*  
  - **Social choice theory**: Must accommodate impossibility results (e.g., Arrow’s theorem) when aggregating preferences. Cannot assume a perfect "group utility function" exists.  
  - **Decision theory**: Must be compatible with stochastic/dynamic environments (e.g., no covert instrumental incentives in Partially Observable Markov Decision Processes).  
  - **ML practice**: Must not contradict empirical evidence (e.g., reward hacking in RL systems, brittleness of fine-tuning).  

  #### **5. The Four-Place Relation: Alignment as \( \text{Align}(System, Principal, Standard, Context) \)**  
  *(Non-negotiable: A theory must explicitly define all four slots or justify leaving some as parameters. Vagueness here breeds pseudo-progress.)*  
  - **System**: The AI agent(s) being aligned.  
  - **Principal**: The entity to which the system is aligned (individual, group, institution).  
  - **Standard**: The criteria for alignment (values, preferences, goals).  
  - **Context**: The distribution of environments/scenarios where alignment holds.  
  - *Consideration:* A theory must specify whether slots are fixed (e.g., "principal = user") or variable (e.g., "principal = democratic majority"). Leaving any slot implicit risks conflating problems (e.g., "aligned" without specifying context ignores distributional shift).  

  #### **6. Normative vs. Descriptive Demands**  
  *(Tension: Non-negotiable to address, but resolution is camp-dependent.)*  
  - **Descriptive ("how to get what we want")**: Theory provides methods to align systems to arbitrary specifications (e.g., reward learning, oversight).  
  - **Normative ("what we should want")**: Theory prescribes or justifies alignment standards (e.g., moral philosophy, preference aggregation).  
  - **Where the tension bites**:  
    - A purely descriptive theory fails when principals have flawed preferences (e.g., aligning to a misaligned overseer).  
    - A normative theory risks imposing contested values (e.g., "alignment to utilitarianism" in pluralistic societies).  
    - *Non-negotiable:* The theory must state whether it addresses one or both demands. It cannot dodge the tension by assuming principals are rational or values are objective.  
  - **Preference note**: Some camps (e.g., value learning) insist on descriptive-only; others (e.g., AI ethics) demand normative justification. The spec must force this choice to be explicit.  

  ---

  ### **Which Requirement Rules Out Common Framings?**  
  The **four-place relation** requirement does the most to exclude popular framings:  
  - **Control framings** (e.g., "capability control", "myopic agents") typically collapse the *principal* and *standard* slots (assuming "user intent is clear") and ignore *context* (e.g., assume deployment = training). Fails on deceptive alignment and distributional shift.  
  - **Governance framings** (e.g., "global coordination", "human-in-the-loop") often ignore the *system* slot (treating AI as a black box) and underdefine *standard* (e.g., "democratic" without Arrow’s constraints). Fails on pluralistic drift and misaligned overseers.  
  - **Value learning framings** (e.g., "inverse reinforcement learning") frequently collapse *standard* and *principal* (assuming "values exist and are learnable") and neglect *context* (e.g., assume static preferences). Fails on value volatility and multi-agent failure.  

  ### **Camp Preferences vs. Non-Negotiables**  
  - **Non-negotiables**: Phenomena (1), cases (2), distinctions (3), consistency (4), and the four-place relation (5). These are the price of admission.  
  - **Preferences**:  
    - *Normative ambition*: Whether the theory must define "what we should want" (normative camps) or can avoid it (technical camps).  
    - *Scope of principals*: Whether alignment must scale to collective principals (e.g., societies) or can focus on individuals.  
    - *Tractability trade-offs*: E.g., myopic alignment (easier) vs. far-sighted (safer but harder).  

  ---

  ### **Scoring Guidance**  
  - A research programme must satisfy **all non-negotiables** to be funded. If it collapses distinctions, ignores cases, or dodges the four-place relation, reject it.  
  - Programmes that **resolve the normative-descriptive tension** (e.g., by integrating moral uncertainty) should be prioritised—but this is rare.  
  - Multiple programmes may be needed if they specialise (e.g., one for single-agent alignment, another for multi-agent/game-theoretic contexts), but all must reference the same four-place framework.  
  - The **most discriminating requirement** is the four-place relation: It forces theories to confront ambiguity in "alignment" head-on, exposing which problems they *aren’t* solving.  

  This spec treats alignment as a dynamic, multi-faceted engineering *and* ethical challenge. If a theory handwaves the cases or distinctions, bin it. If it doesn’t clarify its stance on normative demands, ask pointed questions until it does. And if someone claims alignment is "just about making AI helpful", remind them that perverse instantiation exists. Good luck.
