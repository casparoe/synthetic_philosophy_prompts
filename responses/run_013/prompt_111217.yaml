answer: |-
  ## Fellowship Proposal: Quantifying the Fragility-Assumption Tradeoff in Simpson's Paradox

  **Project Title:** Beyond the Flip: Measuring the Fragility of Simpson's Paradox and its Causal Cost

  **1. Core Question & Motivation:**
  Simpson's Paradox (SP) presents a stark reversal of association when data is aggregated versus disaggregated (e.g., Drug A has higher overall recovery but lower recovery in every patient subgroup). The standard resolution hinges on identifying the underlying causal structure: adjust for confounders, but not mediators or colliders. However, **in practice, the causal structure is rarely known with certainty, leading to persistent disputes** (e.g., "Which table is *really* correct?"). This project posits that these debates are fundamentally **tradeoffs between the *fragility* of the reversal and the *strength of causal assumptions* implicitly required by choosing an aggregation level.**

  The **central research question** is:
  > *For a dataset exhibiting Simpson's Paradox, how does the minimal perturbation distance required to eliminate the reversal (the "Fragility Index") quantitatively relate to the minimal strength of causal assumptions (expressed as constraints on admissible causal structures) needed to justify the aggregated association as causally relevant?*

  **2. Beyond Artifact vs. Deep Problem: Why This Gap Exists:**
  The current discourse often stalls:
  *   **"It's just an artifact!"**: Focuses solely on the mathematical possibility of reversal, dismissing substantive debate about *which* association matters. It ignores the context where aggregated data might be the only feasible or policy-relevant view.
  *   **"It reveals deep confounding!"**: Assumes the causal structure (e.g., a strong confounder) is known or easily identifiable, which is often not the case. It doesn't quantify *how confident* we need to be about that structure to prefer disaggregation.
  *   **The Missing Link**: Neither perspective systematically addresses the **continuum** between these extremes: *How easily could this specific reversal vanish with small data variations?* and *What specific causal claim (and its inherent uncertainty) am I buying if I accept the aggregated result?* This project bridges that gap by defining and linking measures of Fragility and Causal Assumption Strength.

  **3. Proposed Work: Formalization & Case Studies (15-Week Semester)**

  *   **Weeks 1-4: Formal Foundations & Fragility Metric Development**
      *   Define a precise mathematical representation of SP reversal (e.g., sign flips in risk differences/ratios).
      *   **Develop the Fragility Index (FI):** For a given reversed 2x2xK table (K subgroups), define FI as the minimal `L_p` norm perturbation (e.g., sum of absolute changes, `L1`) applied to the cell counts required to make the reversal disappear (i.e., make aggregated and subgroup associations agree in direction). Explore sensitivity to norm choice (`L1` vs `L2`) and reversal definition.
      *   Develop efficient algorithms/computational methods (e.g., based on linear programming or constrained optimization) to calculate FI for given tables.

  *   **Weeks 5-6: Formalizing Causal Assumption Strength (CAS)**
      *   Define a space of plausible causal Directed Acyclic Graphs (DAGs) relevant to SP (focusing on confounders, mediators, colliders).
      *   **Develop the Causal Assumption Strength (CAS) Metric:** For a given aggregated association claimed to be causal, define CAS as the minimal constraints needed on the DAG (e.g., "No unblocked backdoor paths exist," "Variable Z must be a confounder, not a mediator," "No direct effect from Treatment to Outcome bypassing Z") to license that interpretation. Quantify "strength" by the restrictiveness of the constraints (e.g., number of forbidden paths, specificity of node roles required). Explore expressing CAS as a minimal prior probability over causal structures.

  *   **Weeks 7-8: Linking FI and CAS - Theory**
      *   Formulate the theoretical link: How does FI constrain possible CAS values? (e.g., Very high FI implies reversal is robust, requiring strong CAS to justify aggregated view; very low FI implies reversal is fragile, potentially requiring weaker CAS to prefer aggregated view). Develop initial analytical results for simple causal structures.
      *   Design computational experiments: Generate synthetic datasets exhibiting SP under known DAGs (varying confounder strength, subgroup imbalance). Calculate FI and the required CAS for the aggregated view. Plot FI vs. CAS.

  *   **Weeks 9-14: Case Studies & Synthesis (2-3 Deep Dives)**
      *   **Select Cases:** Focus on historically contentious SP examples (e.g., UC Berkeley gender bias; kidney stone treatment efficacy; hypothetical drug trial reversal).
      *   **Apply Framework:**
          1.  Present the raw data and reversal.
          2.  Calculate the FI.
          3.  Enumerate plausible competing causal stories (DAGs) argued in the literature/public discourse.
          4.  Calculate the CAS required to defend the *aggregated* association as causal within *each* plausible story.
          5.  Explicitly map the tradeoff: "Accepting the aggregated result requires assuming a DAG with CAS=X. Given the FI=Y, how plausible is this? What CAS level would be needed if FI were higher/lower?"
      *   **Develop Visualizations:** Create plots showing FI vs. CAS tradeoff curves for the case studies, overlaying the positions implied by different causal interpretations.
      *   **Synthesize Findings:** Draft the core argument: SP disputes are negotiations over where to sit on the FI-CAS tradeoff curve, informed by substantive knowledge. Develop guidelines for presenting FI-CAS reasoning in debates.

  **4. Success Criteria vs. Reinventing Decision Theory:**

  *   **Success Looks Like:**
      1.  **Operationalized Metrics:** Concrete, computable definitions of FI and CAS for SP tables.
      2.  **Demonstrated Link:** Clear empirical evidence (synthetic & case study) showing FI and CAS co-vary systematically. A framework predicting how changes in table properties (imbalance, effect sizes) affect FI and the required CAS.
      3.  **Case Study Insight:** Novel illumination of historical SP debates using the FI-CAS lens, showing how the tradeoff clarifies the core disagreement beyond "which table?".
      4.  **Actionable Framework:** A practical approach for researchers: Calculate FI. Ask: "What CAS must I assume to trust the aggregate? Is that CAS level justified given FI and domain knowledge?"
      5.  **Deflation & Sharpening:** Reduced mystique around "paradox" by showing reversals have quantifiable fragility. Sharper debates focused on justifying the required causal assumptions relative to the reversal's robustness.

  *   **Avoiding Reinvented Decision Theory:** Success hinges on grounding in **specific causal inference concepts** (DAGs, confounding, mediation) and **specific data perturbations**, not abstract utilities or loss functions. The focus is:
      *   **Causal Specificity:** Linking FI directly to constraints on *causal structure* (DAGs), not general uncertainty.
      *   **Data-Centric Fragility:** Defining fragility strictly in terms of *minimal data perturbation*, not epistemic probability or utility tradeoffs.
      *   **SP Context:** Remaining tightly focused on the aggregation-disaggregation reversal characteristic of SP.

  **5. Scope & Feasibility (One Semester):**

  A **well-scoped, feasible semester project** requires focus:

  *   **Cut:** Limit causal structures primarily to **confounding** vs. **mediation** (most common SP drivers). De-emphasize complex colliders or selection bias initially.
  *   **Cut:** Focus on **2x2xK contingency tables** (binary treatment, binary outcome, categorical stratifier). Avoid continuous variables initially.
  *   **Cut:** Use **relative risk difference or odds ratio** as the primary association measure for reversal definition.
  *   **Cut:** Perform **limited sensitivity analysis** on FI calculation methods (start with `L1` norm).
  *   **Focus:** Deep analysis of **2 compelling case studies** is more valuable than superficial analysis of many.
  *   **Prioritize:** Getting a working FI calculation and clear CAS definition for core scenarios is paramount over exhaustive theoretical generality.

  **Conclusion:**
  This project moves beyond the philosophical stalemate surrounding Simpson's Paradox by providing **quantitative tools** to analyze the tradeoff between the fragility of the reversal and the strength of causal assumptions needed for aggregation. By developing the Fragility Index (FI) and Causal Assumption Strength (CAS) metric and exploring their relationship, the project aims to transform SP from a puzzling artifact into a measurable signal about the interplay between data robustness and causal inference under uncertainty. The deliverable will be a novel framework and case studies demonstrating how FI-CAS reasoning clarifies contentious debates, making the "paradox" less paradoxical and more informative. This scope is ambitious but achievable within one semester by focusing on core causal structures, binary data, and a limited number of high-impact case studies.
