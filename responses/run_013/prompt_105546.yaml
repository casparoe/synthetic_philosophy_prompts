   Now, rules and materials list.

   Materials for each group of 3:
   - 1 instruction card for Agent (Condition A)
   - 1 instruction card for Agent (Condition B)
   - 1 instruction card for Monitor
   - 2 instruction cards for Advocate: one for "suffering", one for "not suffering"
   - 1 log sheet (with 10 rows: Round, Action, Reward)
