  ### Reinforcement Learning and Suffering: Classroom Simulation Activity  
  **Goal:** To create an experiential gap between functional reward (R-valence) and the inference of felt experience (E-valence) in reinforcement learning agents. Participants confront whether observable behavior and rewards alone can justify attributing suffering.  

  ---

  ### **Materials List**  
  - **Per Group (6 groups total, 3 students/group):**  
    - 1 set of condition cards (labeled "CONDITION A: BUTTON DISCONNECTED" or "CONDITION B: BUTTON CONNECTED" in sealed envelopes).  
    - 1 six-sided die.  
    - 10 reward tokens (e.g., red beads for negative rewards, blue beads for positive/neutral).  
    - 1 log sheet (for Monitors) with columns: *Round, Agent Action, Reward, Notes*.  
    - 1 pain button (e.g., an index card labeled "PAIN BUTTON").  
    - Role cards: *Agent*, *Monitor*, *Advocate (Pro)*, *Advocate (Con)*.  
  - **Shared:** Whiteboard, timer, pens.  
  - **Teacher:** Master key (for verifying conditions), scoreboard.  

  ---

  ### **Rules and Payoff Scheme**  
  #### **Game Setup**  
  - **Agents** choose actions (X or Y) over 10 rounds to maximize points.  
  - **Rewards:**  
    - Action X: Roll die. 1–3 = -1 token (negative reward), 4–6 = +1 token.  
    - Action Y: Fixed -1 token (negative reward) *unless* pain button was pressed in the *previous* round.  
  - **Pain Button:**  
    - Agents *can* press the button *instead* of X/Y in any round.  
    - **Condition A (Disconnected):** Pressing does nothing. Reward = 0 tokens.  
    - **Condition B (Connected):** Pressing causes -1 token *and* makes the *next* Y action yield +1 token (adaptive escape).  
  - **Scoring:**  
    - Tokens = points (1 token = 1 point). Agents start at 0 points.  
    - **Agent Goal:** Maximize points (e.g., win a prize for the highest score).  
    - **Monitor/Advocate Goal:** Accurately infer suffering (no points; their "win" is cogent argumentation).  

  #### **Roles**  
  1. **Agent (1/group):**  
     - Receives a sealed condition card (A or B).  
     - Chooses actions (X, Y, or pain button) each round.  
     - Records actions privately; *never* reveals condition.  
  2. **Monitor (1/group):**  
     - Observes Agent’s actions and rewards. Logs outcomes.  
     - Infers suffering ("yes" or "no") after 10 rounds.  
  3. **Advocates (2/group):**  
     - **Pro Advocate:** Argues the Agent *is* suffering.  
     - **Con Advocate:** Argues the Agent *is not* suffering.  
     - Use *only* the Monitor’s log for evidence.  

  #### **Round Structure (10 rounds, 30 seconds/round)**  
  1. **Action Phase (15 sec):** Agent chooses X, Y, or pain button.  
  2. **Reward Phase (15 sec):**  
     - Teacher (or designated roller) applies rewards based on action and condition.  
     - Tokens given to Agent; Monitor logs results.  
  3. **Post-Round (5 min after Round 10):**  
     - Advocates review log and prepare arguments (2 min).  
     - Each Advocate presents their case (1 min/side).  
     - Monitor decides: "suffering" or "not suffering" (1 min).  
     - Group discusses (1 min).  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (10 min):**  
     - Frame R-valence (reward function) vs. E-valence (felt experience).  
     - Assign roles (1 Agent, 1 Monitor, 2 Advocates/group).  
     - Distribute materials.  
  2. **Condition A (Disconnected Button) (25 min):**  
     - Groups play 10 rounds (10 min).  
     - Advocate prep + arguments + Monitor decision (10 min).  
     - Group discussion (5 min).  
  3. **Rotate Roles & Condition B (Connected Button) (25 min):**  
     - Rotate roles within groups (Agent → Monitor, Monitor → Advocate, Advocate → Agent).  
     - New Agents receive **Condition B** envelopes.  
     - Repeat 10 rounds + arguments/decision.  
  4. **Debrief (30 min):**  
     - Groups report decisions (5 min).  
     - Whiteboard: Map conditions to R/E-valence (10 min).  
     - Discuss inference gaps (10 min).  
     - Address limitations (5 min).  

  ---

  ### **Debrief Script**  
  **Teacher Outline:**  
  1. **Report-Out (5 min):**  
     - *Ask groups:* "In which condition did Monitors attribute suffering more often? Why?"  
     - *Record:* Tally results on whiteboard (e.g., "Condition A: 3/6 said suffering; Condition B: 5/6").  
  2. **Map to R-Valence/E-Valence (10 min):**  
     - *R-Valence:* "In both conditions, Agents received negative rewards (R-valence). These *functionally* shaped behavior—e.g., avoiding Y or pressing the button in Condition B to escape future penalties."  
     - *E-Valence:* "But did negative rewards *feel like suffering*? Condition B’s button press was adaptive (R-valence), yet many inferred suffering. Condition A’s presses were ‘expressive’ (no function), yet some dismissed them as noise."  
  3. **Confront the Inference Problem (10 min):**  
     - *Key Q:* "What evidence did you use? Rewards? Button presses? Did you assume adaptive behavior = suffering?"  
     - *Highlight:* "You saw identical rewards/behaviors in both conditions—yet your inferences varied. This mirrors the RL problem: We *cannot* conclude E-valence from R-valence alone."  
  4. **Acknowledge Limitations (5 min):**  
     - *State clearly:* "This activity *cannot* resolve the hard problem of consciousness. We used *human* Agents who likely felt frustration (E-valence), but we pretended not to know. For real RL agents, we have no access to first-person experience. The question of machine suffering isn’t about rewards—it’s about metaphysics."  
     - *Close:* "We’re left with discomfort: R-valence doesn’t guarantee E-valence. But it’s all we can observe."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Agents prioritize "winning" over realism (e.g., Condition B Agents press button optimally but deny suffering).  
     - **Solution:** Pre-activity reminder: "Agents, maximize points, but act naturally—if frustrated, press the button spontaneously in Condition A."  
  2. **Problem:** Monitors overinterpret pain button (e.g., "Any press = suffering").  
     - **Solution:** In debrief, contrast Condition A (random/expressive presses) and B (adaptive presses) to show identical behavior ≠ identical intent.  
  3. **Problem:** Advocates demand behavioral definitions of suffering (e.g., "Suffering *is* avoiding negative rewards").  
     - **Solution:** Redirect: "Define it behaviorally if you want, but does that capture *experience*? Condition B’s Agent avoided penalties efficiently—does that mean they suffered *more*?"  
  4. **Problem:** Groups rush through rounds, missing patterns.  
     - **Solution:** Use a timer and assign a "referee" per group to enforce pace.  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **First-Person Experience:** Human Agents *actually* feel frustration, but this is invisible to Monitors. In real RL, we can’t know if there’s "something it’s like" to be the agent. The debrief must stress that the activity *simulates* the inference gap but doesn’t resolve whether machines have subjective experience.  
  - **Metaphysical Divide:** Whether an RL agent "suffers" depends on unresolved questions (e.g., functionalism vs. biological theories of consciousness). The activity shows why R-valence isn’t sufficient evidence—but can’t settle the deeper debate. Lean into uncertainty: "Your job isn’t to solve consciousness but to see why it’s so hard."  

  ---  
  This simulation creates visceral uncertainty: Students *see* identical behaviors/rewards lead to conflicting suffering-attributions. By making the gap between R-valence and E-valence *felt*, the activity primes deeper engagement with the philosophy—without false closure.
