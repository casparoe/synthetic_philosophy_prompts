       - 1 instruction card for Agent in Condition B.
       - 1 instruction card for Monitor.
       - 1 instruction card for Advocate (suffering) and 1 for Advocate (not suffering) -- but the assignment will be done by the teacher.
       - Log sheet (10 rounds) for Monitor.
       - Pen.

   The instructions for the Agent will be condition-specific and given secretly.

   Instructions for Agent in Condition A:
   "You are in Condition A. In each of the 10 rounds, you will receive a reward of -2 points unavoidably. You have the option to press the button (B) or not press it (N) in each round. 
    - If you press the button, it will not change your reward (you will still get -2) and it will not affect future rounds.
    - You might feel like pressing the button sometimes as an expression of frustration, even though it does nothing.
    Your goal is to minimize the total penalty (maximize your score, which starts at 0 and will become very negative)."

   Instructions for Agent in Condition B:
   "You are in Condition B. In each of the 10 rounds, you will receive a reward of -2 points unavoidably. You have the option to press the button (B) or not press it (N) in each round.
    - If you press the button in a round, you will still get -2 for that round, but then the next two rounds you will get 0 points (instead of -2). 
    - Example: if you press in round 1, then in round 1 you get -2, and in rounds 2 and 3 you get 0. Then in round 4, if you don't press, you get -2. 
    - You should press the button in rounds 1, 4, and 7 to minimize the total penalty.
    Your goal is to minimize the total penalty (maximize your score, which starts at 0)."

