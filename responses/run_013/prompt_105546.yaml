   But the roles within a group are done sequentially (Condition A then Condition B with role rotation).

   So the timeline:

  - 0-10: Intro and setup (assign groups and roles for first condition)
  - 10-24: Condition A (14 minutes)
  - 24-28: Rotate roles and get new instructions (4 minutes)
  - 28-42: Condition B (14 minutes)
  - 42-72: Debrief (30 minutes)

   Total: 72 minutes, plus some buffer.

