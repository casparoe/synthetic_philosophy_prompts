   "Observe the Agent. In each round, record the Agent's action (B or N) and the reward they receive. After 10 rounds, hand the log to the Advocate. After the Advocate presents their argument, decide whether you think the Agent was suffering and record your verdict."

   Instructions for Advocate (suffering):
   "You will receive the log from the Monitor. You must argue that the Agent was suffering. Use the actions and rewards to make your case."

   Instructions for Advocate (not suffering):
   "You will receive the log from the Monitor. You must argue that the Agent was not suffering. Use the actions and rewards to make your case."

   The assignment of the Advocate's position (suffering or not) can be done by the teacher randomly for each condition.

   The groups will do two conditions, but with different button conditions and rotated roles.

   How to run the session:

   1. Introduction (10 minutes): 
      - Explain the distinction between R-valence (functional role) and E-valence (felt quality).
      - Explain the setup: Agents, Monitors, Advocates.
      - Explain the two conditions, but not the button conditions publicly.
      - Assign groups of 3 and roles for the first condition.

   2. Condition A (14 minutes per group, but done in groups simultaneously):
      - In each group, the Agent is secretly given the Condition A instructions.
      - The Monitor and Advocate are given their instructions.
      - The Advocate is assigned a position (suffering or not) by the teacher.
      - The Agent plays 10 rounds, Monitor logs.
      - Advocate argues, Monitor decides.

   3. Rotate roles and Condition B (14 minutes):
      - Switch roles: Agent becomes Monitor, Monitor becomes Advocate, Advocate becomes Agent.
      - New Agent gets Condition B instructions.
      - The new Advocate is assigned a position (the opposite or random).
      - Play Condition B.

   4. Debrief (30 minutes): 
      - Groups share what happened.
      - Map to R-valence and E-valence.
      - Discuss the inference problem.
      - Highlight what the activity could not capture.

   Potential problems and how to handle them:

   1. Participants try to win rather than introspect: 
      - The activity is not about winning for the Monitors and Advocates, but about the argument. 
      - Emphasize in the instructions that the goal is to explore the philosophical question.

   2. Monitors over-read the pain button: 
      - They might think the button press is always a sign of suffering. 
      - In the debrief, point out that in Condition A, it might be a random or despairing action, while in Condition B it is functional.

   3. Someone demands a behavioral definition of suffering:
      - This is expected. In the debrief, acknowledge that the activity does not provide a definition, but rather highlights the inference problem.

   4. The Agent in Condition A might not press the button at all, or press it only once, making it hard to see a pattern.
      - Instruct the Agent in Condition A to press the button a few times (e.g., in rounds where they feel particularly frustrated) to simulate an expressive act without function.

   5. The effect in Condition B might be too subtle for the Monitor to see the pattern.
      - The log in Condition B shows a clear pattern of button presses followed by two zeros. The teacher can (during the debrief) point out the functional pattern.

   What the activity cannot reproduce:

   - The first-person experience: the activity relies on human Agents who might project their own feelings. In reality, an RL agent does not have human-like introspection.
   - The hard problem of consciousness: whether the machine has any experience at all.
   - The activity uses human Agents, so the suffering in the activity is real (the human might feel frustrated), but for a machine, we don't know.

   In the debrief, be clear that the activity is an analogy and that the leap to machine suffering is not settled.

   Debrief outline:

   1. (5 min) Groups share their experiences: what did the Monitors decide in each condition? Why?
   2. (10 min) Map to R-valence and E-valence:
      - In both conditions, the Agent experiences R-valence (negative rewards).
      - In Condition B, the button press was functional (R-valence driven).
      - In Condition A, the button press might have been expressive (E-valence driven) or random.
      - But we cannot be sure about E-valence from the outside.
   3. (10 min) The inference problem:
      - From behavior and rewards alone, can we distinguish between a system that has E-valence and one that doesn't?
      - In this activity, the human Agents likely experienced some form of frustration (E-valence), but we designed the behavior.
      - For an RL agent, even if we see functional behavior that looks like it's avoiding harm, we cannot know if there is E-valence.
   4. (5 min) Limitations:
      - The activity uses humans, so we know they can suffer.
      - For machines, we have no access to first-person experience.
      - The question of machine suffering may depend on metaphysical positions about consciousness that are not settled by reward architecture alone.

   This should leave them with the discomfort of not knowing.

   Let's now provide the timeline for the 90-minute session:

  - 0-10 min: Introduction and group setup
  - 10-24 min: Condition A (14 minutes)
