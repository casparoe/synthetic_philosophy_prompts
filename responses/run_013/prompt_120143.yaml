prompt: |-
  Bit of an odd gig and I could use a hand with it. I write about science and ideas for a living, and I've somehow agreed to give the opening remarks — eight minutes, tops — at our city's citizens' assembly on immigration. The room: 120 people drawn by lottery from the electoral register, two councillors, the chair, a facilitator who has already asked me twice to keep it warm, and me.

  Here's the wrinkle I want the speech to actually face. The remit includes whether residents who aren't citizens should get to vote in municipal elections. So the body deciding who belongs to the demos is drawn from the demos, and the people whose membership is up for grabs werent in the draw — they're not in the room, because the room is the register. I can't write one honest sentence that begins 'the people of this city have decided', and I also can't stand there and tell 120 randomly selected people that their whole exercise is a fix, because it isn't, and they'd rightly hate me. I dont want to solve the problem for them either. I want to hand them the shape of it — something they can carry into a weekend of arguing, not a riddle that shuts the room down.

  So the circularity has to be doing real structural work. It should be the reason some sentences are in and others are out, not a clever aside I drop in the middle before getting on with the pep talk. And it has to land for people who've never read a word of political theory: no theorists, no studies, no book titles, no stats, no here's-how-other-cities-did-it, and none of the arc-of-history stuff. It's a mixed room — a retired bus driver, a nursing student, a guy who is clearly going to filibuster about parking, and a chair who will rule me out of order if I sound like I'm campaigning.

  Can you write the eight minutes? First person, my voice, and the thing I keep circling is that any rule about who counts has to be applied by people whose own counting is exactly what's in question — I want that made concrete with what's actually in front of us, not announced as a paradox.
reasoning: |-
  Okay, the user is a science and ideas writer who needs to give an 8-minute opening speech at a citizens' assembly on immigration. The tricky part is addressing the circularity of the situation: the assembly members (drawn from the electoral register) are deciding whether non-citizen residents should vote in municipal elections, but those affected aren't in the room because they're not on the register. 

  Hmm, the user has very specific constraints. No political theory jargon, no stats, no comparisons to other cities. The audience is ordinary people—retired bus driver, nursing student, potential filibusterer about parking. And the chair will shut them down if it sounds like campaigning. 

  What they really want is to frame the inherent tension without solving it or paralyzing the group. The key insight is that the people defining "who counts" are themselves defined by that very rule. Need to make this concrete using the room itself, not abstract philosophy. 

  *scratches head* The challenge is to acknowledge the elephant in the room (the missing voices) without implying the process is illegitimate. Maybe start by physically pointing out the composition of the room? The lottery-selected citizens are present, while those whose status is being debated are absent precisely because they're excluded by current rules. 

  Ah! Could frame it as: "The people who get to draw the circle aren't inside it yet—and your job this weekend is to decide if the circle should stretch." Must avoid academic terms like "demos" though. Keep it visual—chairs around the table, empty seats metaphor. 

  *checks watch* Eight minutes is tight. Structure should be: 
  1. Ground them in why municipal decisions matter (buses, potholes) 
  2. Show the room's makeup reflects current rules 
  3. Pose the core question as practical ("Who should help steer?") 
  4. Sit the tension visibly on the table 
  5. Hand it over neutrally for their deliberation 

  Biggest risk is sounding like critiquing the process. Solution: position the circularity as inherent to democracy itself, not a flaw in this assembly. Emphasize they're doing exactly what's needed—facing the hard part head-on. 

  *revises tone* Must balance gravity with warmth. Humor might help ("parking debates coming!"), but stay respectful. The facilitator asked for "warm," so end by honoring their civic labor. No prescriptions—just frame the question so clearly that the weekend's debates organically engage with the core tension.
answer: |-
  Here’s an eight-minute opening grounded in the room itself, turning the circularity into a tangible question for deliberation – warm, honest, and avoiding abstraction:

  ---

  **(Start warmly, making eye contact)**

  Good morning. My name’s [Your Name], and I write about science and ideas. My job is usually wrestling with complex questions on the page. Today, I get to hand one to you. And honestly? I’m a little envious, because you get to do the real work: talking, listening, deciding together.

  You’re here because this city decided that *this* is how we should tackle a big question: how we welcome newcomers, how we build a shared home. That’s brave. And it’s practical. Because the decisions made here – about support, about opportunity, about belonging – they land right here. On our streets, in our schools, filling the potholes we all drive over. Municipal stuff. The stuff that *actually* touches people’s lives every single day.

  Now, one specific question you’ll be looking at cuts particularly close to home: **Who gets a say in those everyday choices?** Should someone who lives here, pays taxes here, sends their kids to school here, but isn’t yet a citizen… should they get to vote for the mayor? For the councillors who set the library hours or decide on that new bike lane?

  **(Pause, gesture around the room)**

  Look around. See who’s here. One hundred and twenty of you. Drawn, fairly, by lottery. From the electoral register. Citizens. That’s the rule right now: to help choose who runs the city, you need to be on *that* list. And because of that rule, *you* are here. You are the ‘us’ the city turned to for this conversation. It makes perfect sense. It’s how the system works.

  **(Lean in slightly, lower the pace)**

  But here’s the thing you’re being asked to consider: **What if the rule changed?** What if living here, *being* here day in and day out, became the key that unlocked that municipal vote? That civic say?

  If that rule had been different *before* this assembly was called… well, the lottery might have looked different. The names pulled from the register might have included some of the very people whose place in that ‘us’ is now up for discussion. They’d be sitting *right here*, in these chairs, having this conversation *with* you.

  **(Hold the silence for a beat)**

  But the rule *wasn’t* different. So they’re not. They’re out there. Living here. Contributing here. Waiting to see what the people *in* this room – the people defined by the *current* rule – decide about the *next* rule. About whether the circle gets drawn a little wider.

  **(Shift tone to thoughtful, not accusatory)**

  That’s not a criticism. It’s not a fix. It’s just… the reality of the spot we’re in. **We’re using the tools we have now to decide what tools we might use tomorrow.** It’s a bit like using the old map to help draw a new one. It’s unavoidable. It’s also the very heart of the question you’ve been asked to tackle.

  So this weekend, as you talk about schools and jobs and housing and yes, probably parking too… **(small, knowing smile)** …this underlying question will be sitting quietly at the table: **Who is the ‘we’ that gets to decide who the ‘we’ is?**

  It’s not a trick question. It’s not meant to tie you in knots. It’s simply *the* question embedded in your task. It’s the reason this feels weighty. It's why your job matters so much.

  **(Shift to encouraging, forward-looking)**

  You don’t need fancy theories or ancient history to grapple with this. You just need to talk to each other. Listen. Think about the streets you walk down. The neighbours you know. The city you want to build. Think practically: Who has a stake in whether the bins get collected? Who feels the impact of a planning decision? Who helps make this place home?

  That’s your compass. Your job isn’t to solve some impossible paradox today. It’s to spend this weekend honestly wrestling with that practical question of belonging and voice, knowing that the very way you were chosen to do it is part of the story.

  **(Conclude warmly)**

  So thank you. Thank you for showing up. For bringing your experience, your neighbours’ concerns, your bus routes and your nursing shifts into this room. For being willing to sit with this complex, human question. The facilitator’s going to guide you through it brilliantly. I can’t wait to hear where your conversations take you. Over to you.

  ---

  **Why this works:**

  1.  **Concrete Room, Concrete Rule:** It starts and stays grounded in *who is physically present* and *why* (the electoral register lottery), making the abstract "demos" question visible and immediate.
  2.  **Frames the Circularity as Inherent, Not Flawed:** "We’re using the tools we have now to decide what tools we might use tomorrow." This acknowledges the structure without condemning it. It positions it as the natural starting point, not a conspiracy.
  3.  **Makes the Absence Visible:** It explicitly names *why* certain people aren't in the room ("They’d be sitting *right here*... But the rule *wasn’t* different. So they’re not."). This highlights the tension without blaming the attendees.
  4.  **Centers the Practical Question:** It constantly brings it back to municipal impact (bins, potholes, schools, bike lanes) – concrete stakes everyone understands. The core question becomes "Who has a stake in this *practical stuff*?"
  5.  **Avoids Jargon & Abstraction:** No "demos," "citizenship theory," "paradox." Uses simple language: "the circle," "the rule," "the tools," "the map," "who is the 'we'?".
  6.  **Neutral & Empowering:** It doesn't advocate for an outcome. It simply says, "This tension is *the* question you're here to discuss, and that's valid and important work." It validates their role.
  7.  **Warm & Human:** Acknowledges the mix of people ("bus routes and nursing shifts"), uses a touch of relatable humor ("parking"), thanks them genuinely.
  8.  **Hands Them the Shape:** "Who is the ‘we’ that gets to decide who the ‘we’ is?" is the core shape, presented plainly. "It’s simply *the* question embedded in your task." This gives them a lens for their weekend, not an answer.
  9.  **Respects the Chair & Facilitator:** Avoids campaigning language, sticks to framing the inherent question in the process itself.
  10. **Time:** Structured for roughly 8 minutes with natural pauses.
