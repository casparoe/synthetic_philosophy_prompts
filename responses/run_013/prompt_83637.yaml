prompt: |-
  I’ve been trying to understand collective intentionality. If a group’s intention is supposed to be something over and above the intentions of its members, how can it be shared? Sharing seems to require that each person has the same intention, which would simply be individual intentions again. If sharing does not require sameness, what distinguishes a genuine joint action—two people wordlessly clearing a table—from two people coincidentally doing complementary things at the same time? Is collective intentionality therefore either reducible to individual attitudes or else a mysterious group mind?
reasoning: |-
  Okay, the user is really struggling with the concept of collective intentionality. They're hitting the classic dilemma: if group intention is more than the sum of individual intentions, how does it avoid becoming a "group mind"? But if it's just individuals having similar intentions, how is it truly shared? 

  Hmm... they're clearly well-read in philosophy—mentioning Searle and Bratman by name. Probably a grad student or early-career academic. Their frustration comes through in phrases like "supposed to be something over and above" and "mysterious group mind." They want rigor but also hate hand-wavy solutions. 

  The table-clearing example is key. It's not just about coordination (like two strangers avoiding collision), but about mutual recognition of shared purpose. That's where Bratman's "mesh" comes in. Need to emphasize the reflexive structure: "I intend that we J because you intend that we J, and you intend that we J because I..." That interdependence breaks the reducibility argument. 

  Also should address their "sameness" confusion head-on. No, sharing ≠ identical copies. It's about complementary roles oriented toward a common goal. Like in jazz improvisation—different notes, same song. 

  The user might be secretly worried about ontology. If they reject group minds (rightly!), how is collective intention real? Bratman's reduction to interlocking attitudes is safe: no spooky entities, just complex webs of "I intend that we..." Plus Gilbert's joint commitment adds normative glue—"we owe each other" to continue. 

  ...Should mention Searle's irreducibility though, since user namedropped him. His "we-intention" is primitive, not built from "I-intentions." But that risks sounding mystical. Maybe position it as minority view. 

  Practical test: in the table scenario, if one person stopped, would the other feel entitled to complain? If yes—collective. If just annoyed—coincidence. That normative layer is crucial. 

  User's deeper need? Probably wanting to apply this to social theory or AI collaboration. Should flag that in conclusion without presuming. 

  ...Coffee break. This deserves another paragraph on Gilbert's obligations.
answer: |-
  You've pinpointed the central tension in collective intentionality theory! It's a fascinating puzzle: how can an intention be genuinely *shared* without collapsing into either individual copies or a mysterious group entity? Let's break down the key responses from prominent philosophers:

  1.  **Against Simple Sameness & Coincidence:** You're right - if "shared" just meant "each has an identical *I*-intention" (e.g., "I intend to clear the table"), this fails to capture genuine *joint* action. Those individuals might be clearing the table independently, even obstructing each other. Coincidence lacks the essential *interdependence* and *mutual responsiveness*.

  2.  **The Interlocking Web Model (Bratman):**
      *   **Core Idea:** Shared intention isn't a single "group mind" intention, nor identical individual intentions. It's a complex structure of *interlocking* and *interdependent* individual intentions *about the joint activity*. Each participant has intentions with a specific "we" structure.
      *   **The Structure:**
          *   **"We-intention":** Each intends *that we J* (e.g., "I intend that *we* clear the table together").
          *   **Interdependence:** My intention that *we* J is based on my belief that *you* also intend that *we* J (and vice versa). My intention wouldn't persist if I knew you didn't share it.
          *   **Coordination Plans:** Each intends that *we* J *by way of* meshing sub-plans (my role complements yours, and we coordinate on how to do it).
          *   **Mutual Responsiveness:** Each is committed to coordinating their action with the other based on these interdependent intentions and plans. We adjust our actions based on the other's actions and intentions.
      *   **Table Example:** Person A isn't just intending "I put dishes away." They intend "We clear the table *by me putting dishes away while you wipe it down*, and I believe you intend this too, and I'll adjust if you need help with the dishes." Person B has a symmetrically interdependent intention. Their actions are mutually responsive and coordinated *because* of this interlocking cognitive structure. In mere coincidence, each just has an individual intention ("I'll put dishes away now," "I'll wipe now") without reference to the other's role or intention.

  3.  **Joint Commitment (Gilbert):**
      *   **Core Idea:** Shared intention is grounded in a "joint commitment." Individuals create a new, irreducible normative entity *together*.
      *   **The Process:** Participants mutually express their readiness to be jointly committed *as a body* to intend to J. This creates a "plural subject" with a single intention.
      *   **Obligations:** Joint commitment creates obligations *to each other* to act in ways consistent with the shared intention and not to abandon it unilaterally.
      *   **Distinguishing Feature:** The *normative glue*. If one person stops wiping in the table example, the other feels not just inconvenienced, but *wronged* or entitled to rebuke them ("Hey, we were clearing this together!"). This normative dimension is absent in coincidence.
      *   **Not Group Mind:** The commitment exists *between* the individuals; it's not located in a separate mind. But it *is* an irreducible social fact arising from their mutual commitments.

  4.  **Primitive "We-Intentions" (Searle):**
      *   **Core Idea:** Shared intention is realized in the minds of individuals as a primitive form of intention with the form "We intend to do A." This "we-intention" is *not* reducible to a sum of "I-intentions + beliefs about others."
      *   **Biological Capacity:** Searle argues humans have a biological capacity for collective intentionality as a fundamental mode of consciousness, just like individual intentionality.
      *   **Distinguishing Feature:** The intentional content itself is irreducibly collective ("We intend to J"). This directly addresses the "over and above" point without requiring a group mind – the "we" is in the *content* of the individual's mental state.
      *   **Table Example:** Each person experiences an intention whose content is "We are clearing the table." This directly motivates their individual actions *as contributions* to the joint effort.

  **Addressing Your Dilemma:**

  *   **Reducible?** Bratman offers a sophisticated *conceptual* reduction: shared intention *is* a complex pattern of individual attitudes (I-intentions with "we" content, beliefs about others' attitudes, meshing sub-plans). It's *ontologically* individualistic (no group mind) but *conceptually* distinct because the pattern is unique and irreducible in its explanatory power. Gilbert and Searle argue it's *not* reducible, pointing to the normative force (Gilbert) or the primitive "we" content (Searle).
  *   **Group Mind?** Only the crudest theories imply a literal group mind. Gilbert's "plural subject" is a normative concept arising from joint commitment, not a separate consciousness. Searle's "we-intention" resides in individual minds. Bratman avoids it entirely. The challenge is explaining the *phenomenon* of unified joint action without reifying it into a Cartesian mind.
  *   **Sharing Without Sameness:** Sharing isn't about having identical *token* intentions. It's about having intentions whose *content* refers to the *joint* activity ("we intend to J"), which are *interdependent* (mine depends on yours and vice versa), and which *coordinate* individual actions into a unified whole. It's about the *relationship* between the individual intentions, not their perfect identity.

  **Conclusion:** Collective intentionality avoids collapsing into either extreme. It's **not** just identical individual intentions – it requires the specific *interlocking* structure (Bratman), the *normative commitment* (Gilbert), or the *irreducible "we" content* (Searle) to distinguish genuine joint action (like wordlessly clearing the table) from mere coincidence. While debates about reducibility continue, sophisticated accounts show how genuinely shared intentions, residing in and motivating individuals through complex relations to each other, are possible without invoking a mysterious group mind. The key is the *relational structure* of the individual intentional states.
