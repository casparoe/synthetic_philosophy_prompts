prompt: |-
  Last night a friend and I argued for several hours about whether the integrity objection to impartial morality, and the associated complaint about one thought too many, really shows something as strong as she thinks. She is a pediatric resident who had just come from a transplant committee meeting where children were ranked by expected life-years, and she put the following argument to me:

  (1) A moral theory is defective if it requires an agent, in order to act rightly, to treat her deepest commitments as merely one input into an impartial calculation.
  (2) Any theory that would have a parent weigh her own child's need against a stranger's need, even when the stranger's need is slightly greater, requires exactly that.
  (3) So any such theory is defective.
  (4) But a theory that tells the parent to save her child without weighing the stranger's need treats the stranger's equally real need as morally irrelevant.
  (5) So any moral theory is either defective or arbitrary.
  (6) Since morality cannot be arbitrary, morality is defective.
  (7) Therefore a morally serious person must either abandon impartial morality or accept that her deepest commitments are, from morality's point of view, mere preferences.

  She says this is the real force of the integrity objection: impartial morality cannot be lived from the inside. I think the argument proves too much, but I cannot locate the step that does it. Which premise or inference should I reject, and what does rejecting it cost? If I would rather keep (4) than (1), what can I still say about the parent's love? And is there a way to distinguish the transplant committee's ranking from the parent's partiality without making the parent's love a merely private preference?
reasoning: |-
  Okay, I need to unpack this argument about impartial morality and the integrity objection. The user's friend, a pediatric resident, presented a seven-step argument after a transplant committee meeting where children were ranked by expected life-years. The core claim is that impartial morality forces agents to treat their deepest commitments as mere inputs to a calculation, which violates personal integrity. The user thinks this proves too much but can't identify the faulty step.

  First, I'll examine each premise. Premise (1) states that a moral theory is defective if it requires treating deep commitments as just one input in impartial calculation. This aligns with Bernard Williams' integrity objection - that utilitarianism can demand we sacrifice personal projects in ways that alienate us from our own lives. 

  Premise (2) claims any theory making a parent weigh their child against a slightly needier stranger does this. Premise (3) concludes such theories are defective. Then premise (4) argues that partial theories make the stranger's need morally irrelevant. Premise (5) presents a dilemma: morality must be either defective or arbitrary. Since morality can't be arbitrary (6), it must be defective (7), forcing us to either abandon impartial morality or accept our commitments as mere preferences.

  The user wants to know which premise to reject and what it costs, especially if they keep (4). They also ask how to distinguish institutional decisions (like transplant rankings) from parental partiality without reducing love to private preference.

  I notice several pressure points. Premise (1) might be too strong - not all impartial calculations necessarily violate integrity. Moderate deontology could allow special obligations without full impartial weighing in every case. Premise (2) oversimplifies by equating "weighing" with full numerical comparison. Many theories recognize parental duties as having deliberative priority, not just quantitative weight. 

  The inference to (5) seems problematic - it presents a false dichotomy. Why must morality be either fully impartial or arbitrary? Hybrid approaches exist where partial commitments have intrinsic moral weight, not just as inputs to calculation. 

  If the user keeps premise (4) - that partial theories make strangers' needs irrelevant - they could still argue parental partiality is morally grounded through special obligations. The cost is admitting some needs receive less direct response, but not that they're entirely irrelevant. 

  For distinguishing transplant committees from parents: institutions must be impartial by design (procedural fairness), while parents have role-based permissions. This doesn't reduce love to private preference - it acknowledges the moral value of relationships. The pediatric resident's distress might stem from applying institutional logic to personal contexts, not from morality itself being defective.

  The deepest flaw is in step (5)'s false dilemma. Rejecting this allows defending moral theories that give intrinsic weight to commitments without abandoning impartiality entirely. The cost is complexity - morality becomes multi-layered rather than monolithic. But this seems necessary to capture both the value of personal relationships and general obligations.
answer: |-
  This is a powerful and subtle argument that captures the core tension in the integrity objection (famously articulated by Bernard Williams against utilitarianism). While compelling, it *does* prove too much by forcing a false dichotomy. The key step to reject is **Premise (5): "So any moral theory is either defective or arbitrary."**

  **Why Reject Premise (5)?**

  Premise (5) presents a false dilemma. It assumes there are only two types of moral theories:
  1.  **Defective:** Theories requiring impartial weighing that violates integrity (as defined in 1-3).
  2.  **Arbitrary:** Theories that simply tell the parent to save their child without any weighing, thereby ignoring the stranger's need (as per 4).

  This overlooks a crucial third possibility:
  3.  **Non-Arbitrary Partial Justification:** Theories that provide a *morally grounded reason* why the parent is not merely permitted but *required* or *deeply justified* in prioritizing their child *without* needing to impartially weigh the child against a slightly needier stranger in that specific context. This reason isn't arbitrary; it stems from the inherent moral significance of special relationships and the obligations they generate.

  **What Rejecting (5) Costs (and Doesn't Cost):**

  *   **Cost:** You must provide a plausible account of why special relationships (like parenthood) generate genuine moral obligations/permissions that *override* or *exclude* the requirement for impartial weighing in specific contexts like the rescue scenario. This requires moving beyond simple act-consequentialism or crude impartialism. You need a theory that incorporates agent-relative reasons or special obligations as fundamental features, not just inputs to an impartial calculus (like rule-utilitarianism might try, but often fails convincingly here).
  *   **Doesn't Cost:** Rejecting (5) does not force you to accept that morality is defective (6,7). It allows you to defend a moral theory that avoids the integrity violation *and* isn't arbitrary. It also doesn't force you to abandon impartial morality entirely; it requires recognizing that impartiality is a *component* of morality, but not the *whole* of it, or that it applies differently at different levels (see below).

  **If You Keep Premise (4): What Can You Say About Parental Love?**

  Premise (4) states: "*a theory that tells the parent to save her child without weighing the stranger's need treats the stranger's equally real need as morally irrelevant.*" If you keep this, you accept the challenge that a partial theory *must* account for the stranger's need.

  *   **What You Can Still Say About Parental Love:**
      1.  **Morally Constitutive:** Parental love isn't a "mere preference"; it's the psychological and practical manifestation of a profound *moral obligation*. The duty to care for one's child is a fundamental moral fact arising from the relationship itself, not a subjective whim. This obligation *defines* part of what it means to be a good parent and a morally responsive person.
      2.  **Scope of Obligation:** The moral relevance of the stranger's need isn't denied; it *is* relevant *to others*. The stranger's need imposes a strong moral claim *on society at large* and *on institutions* (like the transplant committee) that are designed for impartial allocation. It imposes a general humanitarian duty *on everyone*. However, the parent's *specific* obligation to *their own child* in the immediate rescue scenario is so strong and specific that it *takes priority* over their general humanitarian duty *to this particular stranger* in *this particular context*. The stranger's need isn't irrelevant; it's outweighed or excluded *for this agent* by a stronger, more specific obligation.
      3.  **Different Moral Domains:** Morality has different domains. The domain of intimate care (family, friends) operates with different principles (fidelity, loyalty, special care) than the domain of justice and resource allocation among strangers (impartiality, fairness, equal consideration). The parent saving their child is acting within the "care" domain, where partiality is not just permitted but required. Ignoring this distinction *is* what makes impartial calculation seem necessary and integrity-violating in the rescue scenario. The stranger's need belongs primarily to the "justice" domain, demanding a response, but not necessarily *from this parent in this moment* over their own child.

  **Distinguishing Transplant Committee Ranking from Parental Partiality Without Reducing Love to Preference:**

  The key is recognizing **role-based obligations** and **levels of moral reasoning**:

  1.  **Role of the Transplant Committee:** The committee's *institutional role* is explicitly one of **distributive justice**. Its mandate is to allocate scarce life-saving resources *impartially* according to publicly defensible criteria (like medical utility, expected life-years) to ensure fairness *across all potential recipients*. They act as agents *for society as a whole*. **Impartial calculation is essential to their role.** For them, *not* weighing lives impartially *would* be a moral failure (arbitrariness/favoritism).
  2.  **Role of the Parent:** The parent's *personal role* is one of **special care and fidelity**. Their primary moral obligation within the family context is the profound well-being of their child. This obligation arises intrinsically from the relationship. **Impartial calculation is *inappropriate* to their role** in a direct rescue scenario involving their child. Requiring it *would* be a moral failure (betrayal of the relationship, violation of integrity).
  3.  **Love is Not a Private Preference:** Parental love isn't treated as a "mere private preference" here; it is the **motivational core and experiential reality of fulfilling a profound, objectively grounded moral role.** The *permission/obligation* to prioritize the child stems from the *moral value inherent in the special relationship itself*, recognized as a fundamental good by morality. This value justifies the parent's focus and differentiates it from mere bias or favoritism. The committee's impartiality also stems from a different, equally important moral value (justice in distribution).
  4.  **Complementary, Not Contradictory:** These are not contradictory moral stances; they are *complementary responses* to different moral demands arising in different contexts and roles. Society *needs* both: institutions that act impartially for justice, *and* individuals deeply committed to their special relationships. The parent relies on just institutions in other contexts; the committee members (as individuals) rely on special relationships in their personal lives. The "one thought too many" arises when the *wrong* level of reasoning (institutional impartiality) is applied to the *wrong* context (personal rescue of one's child).

  **Conclusion:**

  Your friend powerfully articulates the integrity objection's core challenge. However, the fatal flaw is Premise (5)'s false dilemma. Morality isn't forced to choose between "integrity-violating impartial calculation" and "arbitrary partiality." A plausible moral theory can recognize the *non-arbitrary, morally obligatory nature* of partiality grounded in special relationships like parenthood. This partiality isn't a denial of the stranger's need's reality or general moral relevance; it's an affirmation that *this agent* in *this role* in *this context* has a paramount obligation arising from a specific relationship. Distinguishing the transplant committee's impartial ranking (institutional justice) from the parent's partiality (personal fidelity) hinges on recognizing distinct moral roles and domains, not reducing love to a preference. Rejecting (5) allows you to preserve the moral seriousness of parental love *and* the necessity of impartial justice in its proper sphere, avoiding the overly strong conclusion that morality itself is defective. The cost is adopting a more complex, pluralistic moral framework that acknowledges agent-relative reasons and special obligations as fundamental.
