  ---

  ### Decomposition & Justifications
  1.  **P(Linguistic Distinction is Morally Load-Bearing) = 0.4**  
      *Justification:* The lying/misleading distinction relies on semantic vs. pragmatic content. In many real-world contexts (e.g., "Is your husband here?" → "He's not in the kitchen"), the "asserted" vs. "implied" boundary is fuzzy. If the distinction is ontologically unstable or context-dependent, it may not reliably ground moral differences.  
      *Direction:* Weakens the proposition; if the distinction collapses, lying isn’t meaningfully different.

  2.  **P(Non-Consequentialist Significance of Assertion) = 0.8**  
      *Justification:* Assertions carry inherent assurance (e.g., Scanlon's "principle of fidelity"). Lying directly violates this, treating the hearer as a tool for manipulation. Misleading exploits inference without breaching the same explicit promise, preserving superficial respect for autonomy.  
      *Direction:* Strongly supports the proposition; the act of asserting a known falsehood adds distinct wrongness.

  3.  **P(Misleading is Worse Due to Cognitive Hijacking) = 0.3**  
      *Justification:* Misleading may weaponize the victim’s inferences (e.g., implicatures require their complicity). If deception via self-entrapment is more manipulative, it could make misleading *worse* than lying.  
      *Direction:* Flips the sign; if true, lying would be *less* bad, undermining the proposition.

  4.  **P(Intuitions Reflect Commission/Omission Bias) = 0.7**  
      *Justification:* We naturally condemn "active" harms (lying) more than "passive" ones (misleading), even when consequences match. The "holding fixed" clause *should* neutralize this bias, but empirical psychology suggests it persists.  
      *Direction:* Weakens the proposition; apparent wrongness difference may be cognitive illusion.

  ---

  ### Combining the Terms  
  - Base credence starts at 0.5 (maximum uncertainty).  
  - **Supporting factors** (Term 2): Strong (+0.3 weight).  
