  ## A Dialogue on the Criminalisation of "Irregularities"

  **Setting:** A comfortably furnished study in London, late 1780s. Bookshelves line the walls. Two men, **ALGERNON** (arguing against criminalisation) and **CLEMENT** (arguing for), sit facing each other.

  **ALGERNON:** Clement, we return once more to this vexed question: the penal law’s harsh stance on what Bentham terms ‘irregularities’. I maintain, and I believe the utility principle demands, that the law exceeds its proper bounds here. The core mischief – the real, tangible pain inflicted upon sentient beings – is absent, or perversely manufactured *by* the prohibition itself.

  **CLEMENT:** Absent? Algernon, you astonish me. The acts themselves are intrinsically disordered. They defy the natural end of the sexual faculty, which is generation within the marital bond. This bond is not merely personal; it’s the bedrock of society – the rearing of children, the transmission of property, the stability of lineage. Acts intrinsically incapable of fulfilling this end are disordered by their very nature. The law recognises this disorder.

  **ALGERNON:** ‘Disordered’? ‘Natural end’? These are slippery terms, Clement. Pray, what *work* is the word ‘natural’ doing? If it means merely ‘unusual’, that tells us nothing about pain or pleasure; many unusual acts cause no harm. If it means ‘displeasing to God’, that is a theological claim I cannot simply hand to the legislator as a ground for punishment – unless you wish to criminalise every Sunday stroll or shellfish dinner! If it means ‘contrary to generation’, then your objection condemns far more than you intend: marital intercourse during pregnancy, after menopause, or simply for pleasure without intent to procreate. Are we to outlaw these too? I think not. The appeal to nature, stripped bare, often reduces to mere disgust, however widely felt. And utility tells us that mere antipathy, however intense or widespread, is *not* a legitimate ground for punishment. Punishment is pain inflicted to prevent greater pain. Where is the greater pain prevented here?

  **CLEMENT:** You dismiss too readily. It is not mere disgust, but a rational perception of disorder in the faculty’s use. And you ignore the long-run, indirect mischiefs. Such acts, if tolerated, corrupt manners. They weaken the powerful sentiment of shame which fortifies the marital institution. Without that bulwark, marriage becomes fragile, and with it, the care and education of the next generation suffers. This *is* tangible mischief, though diffuse and slow-acting. Furthermore, Bentham himself, in his scheme of offences, acknowledges the mischief in offences against morality – the tendency to spread by dangerous example. If such acts become commonplace through impunity, the bonds of society are loosened. A legislator must run the calculus on a long ledger, considering these gradual erosions.

  **ALGERNON:** Ah, the ‘dangerous example’! I confess, this is the most difficult point within my own preferred framework. But let me dissect it. Firstly, *does* the example truly spread? Is the man who prefers his own sex more likely to induce that preference in another, than the man who prefers port wine to claret induces a preference for port? Tastes in pleasure are notoriously resistant to mere imitation. Secondly, and crucially, much of the *suffering* you might attribute to the act itself is, in fact, *manufactured by the prohibition*. Consider the enforced secrecy: it breeds hypocrisy and fear. It creates the perfect conditions for blackmail, a vile crime flourishing solely because of the law’s existence. The law, being unenforceable uniformly, invites selective application – often malicious or arbitrary – and breeds perjury as individuals desperately seek to avoid ruinous consequences. The law itself stands charged with creating a vast edifice of misery that would simply not exist without it! The ‘mischief’ you fear arises largely *from* the penal threat, not from the acts in a state of liberty.

  **CLEMENT:** You argue that the law creates the suffering, ergo, remove the law and the suffering vanishes. But that assumes the underlying sentiment – the profound disapproval rooted in the perception of natural disorder and its social consequences – would vanish with it. I contend it would not, or at least, not swiftly. The law is not merely a threat; it is a powerful *expression* of the community’s moral judgment. Repeal would send a signal, especially to the young and impressionable, that such acts are no longer deemed gravely wrong, merely… unconventional. This would inevitably alter sentiments over time, diminishing the shame that currently acts as a restraint. The state, by repealing, is not being neutral; it is actively reshaping moral perceptions downwards. Neutrality, in such deeply rooted matters, is an illusion. The law educates as much as it punishes.

  **ALGERNON:** And here, Clement, we strike the rock. You suggest the public’s antipathy and the associated pain are partly *produced* by the law and religious instruction. I agree! This is precisely my point about manufactured suffering. But then you turn it against me: if the preferences and pains are endogenous – created *by* the legal regime we are assessing – how can I discount them in my utility calculus? For if we repeal the law, perhaps the antipathy diminishes, and the pain I discounted as law-made vanishes, proving my point? Or perhaps it persists, proving yours? Whether to keep the law *is* the dispute, and the state of public sentiment is central to the consequences of either choice.

  **CLEMENT:** Exactly so. Your argument risks circularity. You discount the pain of public antipathy as illegitimate or law-made, but if the law shapes that very antipathy, its legitimacy and its persistence become the core question. Can you truly run the utilitarian calculus without making a prior judgment about *which* preferences – the revulsion felt now, or the potential indifference fostered by repeal – are the ones to be counted, and why? My position is that the revulsion stems from a correct perception of disorder essential to social health. Yours seems to assume a baseline of liberty where tastes are fixed and unaffected by law, which strikes me as naive. The utility principle, applied rigorously, must account for how legal regimes *form* the tastes and pains they are meant to weigh.

  **ALGERNON:** And there we must pause. You charge my calculus with naivety regarding the formation of sentiment. I charge yours with conflating deep-seated cultural intuitions about ‘natural order’ with demonstrable harm, and with ignoring the tangible, immediate evils spawned by prohibition itself – evils which *are* demonstrable: blackmail, ruined lives, arbitrary power. We both appeal to consequences, but we differ profoundly on how to identify them, how far into the future to look, and crucially, how to account for the fact that the law itself is a primary *shaper* of the very preferences and pains we must weigh. Can utility, in this domain, ever escape this hermeneutic circle?

  **CLEMENT:** It seems not. The legislator is caught between the rock of existing, powerfully felt sentiments whose origins are complex, and the hard place of predicting how those sentiments might change should he act. My fear is that dismantling the law risks eroding a vital social sentiment whose loss we may only comprehend when it is too late. Your fear is that maintaining it perpetuates a cruel and unnecessary engine of misery. Both fears invoke utility, yet lead us in opposite directions. The circle remains unbroken.

  **ALGERNON:** Unbroken indeed. The utility principle demands we count all pains and pleasures. But *which* pains and pleasures, felt *by whom*, and under *which* legal regime? That, my friend, is the Gordian knot we cannot yet cut.

  **(Word Count: Approx. 1050)**

  ---

  **Historical Note on Bentham's Position Regarding "Irregularities"**

  It is historically secure that Jeremy Bentham, primarily in unpublished manuscripts written from the 1770s to the 1810s (notably "Offences Against One's Self" c.1785), vehemently opposed the criminalisation of consensual "irregularities" (sodomy, bestiality, other non-procreative acts). His core arguments, reflected in the dialogue, are:
  1.  **Distinguishing Mischief from Antipathy:** He insisted punishment requires demonstrable primary mischief (harm to assignable individuals) or clear danger of it. Mere public disgust ("antipathy") is not a sufficient ground.
  2.  **Law-Created Mischief:** He meticulously detailed the secondary mischiefs *caused* by prohibition: blackmail, perjury, arbitrary enforcement, ruined reputations, and the misery of secrecy.
  3.  **Critique of "Unnatural":** He ruthlessly deconstructed appeals to nature, showing the term was used inconsistently (statistical norm, divine will, procreative function) and that none provided a coherent basis for criminalisation, often leading to absurd consequences if applied consistently.

  **Contested Interpretations:**
  1.  **Scope of Moral Disapproval:** Scholars debate whether Bentham's argument was solely a *penal* critique (the law causes more harm than it prevents) or also implied a broader case for *moral* acceptance of sexual liberty. His texts often focus on the irrationality and harm of the law itself, sometimes expressing personal aversion to the acts, leaving it ambiguous if he sought to eliminate moral disapproval entirely or merely remove the state's punitive role.
  2.  **Internal Consistency:** While the core arguments are clear, the surviving manuscripts are extensive, sometimes repetitive, and represent evolving thought over decades. Some passages grapple more explicitly with the "dangerous example" argument against morality offences than others, leading to debate about how completely he resolved this internal challenge within his own system. The dialogue's emphasis on the "endogenous preferences" problem is a plausible extrapolation from his awareness of how law shapes sentiment, but represents a modern framing applied to his core insights, not a direct quotation.
  3.  **Foundation of the Argument:** While grounded in utility, some argue his revulsion at the *injustice* and *cruelty* of the laws also played a significant motivating role, complicating a purely hedonic calculus reading.

  In essence, Bentham's *opposition to criminalisation* based on utility and the distinction between mischief and antipathy is unequivocal and well-documented in the manuscripts. The extent to which he advocated for full sexual liberty *beyond* mere decriminalisation, and the precise resolution of the "dangerous example" issue within his system, remain subjects of scholarly discussion. The dialogue takes the liberty of framing the "endogenous preferences" dilemma explicitly, which, while consistent with Bentham's insights, is a modern articulation of a challenge implicit in his analysis.
