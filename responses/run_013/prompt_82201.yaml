  I should also consider Campbell's Law, which is similar: the more a metric is used for decisions, the more it's corrupted. And the Cobra Effect, where incentives backfire. These add depth to the analysis.

  For each interpretation, I need to assess: is it trivial, defensible, or false? And what are the implications? For example, if it's about gaming, the solution might be better oversight, not abandoning the measure. If it's about the measure changing fundamentally, like in the user's novel with care home ratings, then it might justify caution but not outright rejection.

