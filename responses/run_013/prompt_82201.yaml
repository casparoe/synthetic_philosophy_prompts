  Now, thinking about the chair's context: in a school meeting about progress measures, he probably meant that once a metric is a target, people will manipulate it, making it useless. That's a common interpretation in education, where high-stakes testing often leads to teaching to the test. So, I'll bet that's reading 3 in my list: the explicit gaming version.

