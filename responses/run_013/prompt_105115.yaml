prompt: |-
  I have no training in philosophy or law. I've just spent a few years worrying at the question of what makes consent valid, and I'd like to get the question itself straight before I read anything about it, so what I want from you is not a theory but the specification a theory would have to satisfy. Please write me the list of requirements that any adequate account of valid consent has to meet.

  The cases I keep turning over, and that I'd want the list built around, are these. A mechanic sells me a car and says nothing about a defect he knows about, though he would have answered honestly if I'd asked; I want to know whether my agreement is as void as if he'd lied outright, and whether withholding and lying really come to the same thing. My landlord offers me money to leave early, and because I'm broke I take it; I can't tell whether that's coercion or just a good offer, and I notice the answer seems to depend entirely on what I was entitled to before he spoke, which nobody ever specifies. I sign a hospital form while sedated and in pain and later deny I meant it; the opposite also happens, where someone understood perfectly at the time and only regrets it afterwards. Someone consents to a procedure in general but not to the student who actually performs it, and I don't know whether that's partial consent or no consent. A relative with dementia agrees to something during a lucid hour and has no memory of it the next day, and I can't decide whether the later forgetting retroactively matters. And a salesman deceives me about something I genuinely don't care about, or about something I care about that wouldn't have changed my decision either way, and I don't know whether that leaves my consent intact.

  So the requirements should cover which cases the account must get right; which distinctions it must not collapse, such as between consent and mere compliance, between a threat and a hard bargain, between withholding and lying, between being unable to consent and merely consenting oddly, and between whether consent is present at all and how far it reaches; and which plain facts about the world it cannot contradict, among them that people often agree to what harms them, that agreement can be real without being cheerful, and that hospitals, employers and courts have to be able to act on consent without reading anyone's mind. For each requirement, tell me the case or consideration that puts it on the list. Then say which of the requirements are genuinely non-negotiable and which are just the preference of one way of thinking about consent rather than another, and flag any pair or group that I should suspect cannot be satisfied together, because that is the part I most want to see; I already half-suspect that demanding consent be a fact about a person's inner state and demanding that it be checkable from the outside will turn out to be in tension, and I'd like to know if I'm right and what it costs to give up either one. Finally, tell me which single requirement, if I took it seriously, would rule out the most otherwise plausible accounts.

  Write it as continuous prose, without headings, bullet points, bold text or tables, the way you'd write a long letter. Don't give me a reading list or name any authors or books; describe positions in plain terms if you need to refer to them, and assume I can't look anything up.
reasoning: |-
  Okay, let me start by unpacking what this user really needs. They've spent years grappling with the concept of valid consent without formal training, and now they want a clear framework to evaluate any theory on the subject. The key here is that they explicitly don't want theories or reading lists—just the criteria those theories must meet.

  First, I need to analyze their examples carefully. Each scenario they described reveals a specific dimension of consent: deception by omission (mechanic), economic pressure (landlord), situational impairment (sedated patient), scope mismatch (medical student), temporal discontinuity (dementia), and materiality of deception (salesman). These aren't random—they're pain points where everyday intuitions clash. 

  The user's deeper request is methodological: they want to avoid bias while constructing their own mental model. That's why they emphasize distinguishing non-negotiable requirements from philosophical preferences. The tension they suspect between internal state and external verification is crucial—it hints at a fundamental dichotomy in consent theory. 

  I should structure this as boundary conditions. For instance: 
  - Validity cannot depend on outcome (harm/benefit irrelevance) 
  - Distinctions like threat vs. offer must survive scrutiny (using the landlord case) 
  - The dementia example forces us to decide whether consent is moment-bound or requires continuity 

  The trickiest part will be flagging incompatible requirements. That internal/external tension is real—if consent requires genuine subjective agreement, institutions can't reliably verify it; if we prioritize verifiability, we sacrifice depth. Either choice has ethical costs. 

  Materiality (salesman case) might be the most disruptive requirement. If we say deception invalidates consent only when it would change decisions, we make validity hostage to hypotheticals—but the alternative seems absurd (voiding consent over trivial lies). This could disqualify otherwise coherent theories. 

  I'll avoid academic jargon entirely. When referencing concepts like "coercion thresholds," I'll describe them plainly (e.g., "whether bad offers cross into coercion depends on prior entitlements"). The hospital case shows why practical verifiability matters—theories demanding mind-reading fail here. 

  Finally, I'll explicitly tag which requirements are ironclad (e.g., consent ≠ compliance) versus debatable (e.g., whether forgetting retroactively voids consent). The user needs to see where philosophy has wiggle room—and where it doesn't.
answer: |-
  You've laid out a remarkably clear set of challenges, and your instinct to map the territory before exploring theories is wise. The core tension you suspect – between consent as an internal state and as something externally verifiable – is indeed central, and we'll see it ripple through the requirements. Building from your cases and concerns, here’s a list of demands any adequate account of valid consent must grapple with, why they matter, and where the fault lines lie.

  First, the account **must distinguish valid consent from mere acquiescence or compliance.** Your landlord case is pivotal here. If your desperate acceptance of the payout is *just* compliance driven by your poverty (a background condition the landlord exploits), it may not be valid consent. But if it's a genuine choice between alternatives, even hard ones, it might be. The theory must provide principles for separating a coercive threat ("Leave or I'll illegally evict you") from a merely burdensome or advantageous offer ("Leave early for this cash"). This distinction hinges critically, as you note, on **prior entitlements.** Any account must engage with the baseline against which proposals are measured – what you were owed or could rightfully expect *before* the proposal was made. Failing this collapses consent into mere submission to power or circumstance.

  Second, it **must address the role of knowledge, specifically differentiating deception from non-disclosure.** Your mechanic case cuts to the heart of this. Does the mechanic's silence, knowing you'd act differently with the truth, invalidate your consent in the same way an active lie would? The account must clarify whether consent requires merely the absence of falsehoods or a positive duty to disclose material facts the consent-giver wouldn't reasonably know or expect. This links to the salesman case: does deception about something you *don't* care about, or that *wouldn't* have changed your mind, still invalidate consent? This probes the requirement of **materiality** – whether misinformation or withheld information must be relevant to the decision's core substance to matter. An account must define what makes information "material" to consent.

  Third, it **must account for capacity and competence at the time of consenting.** Your sedated patient and dementia cases illustrate different facets. The sedated patient raises the issue of **temporary impairment:** pain, drugs, or acute distress can cloud judgment or comprehension. The account must specify the threshold of understanding and volition required. Conversely, the dementia case forces the question of **temporal continuity and identity:** does valid consent require the *continuing* endorsement of the same "agent"? If the person lucidly consents but has no memory or later objects during confusion, does that retroactively invalidate the consent? The account must grapple with whether consent is a momentary act or implies some form of ongoing ratification, and how to handle fluctuating capacity.

  Fourth, it **must define the scope and specificity of consent.** The case of consenting to a procedure but not the specific student performer is key. Does consent require granular specificity for every element, or can it be validly given within understood (or reasonable) parameters? This involves distinguishing between **partial consent** (agreeing to A but not B) and **invalid consent** (if B is an inseparable or non-delegable part of A). The account must clarify how consent "binds" to specific actions, agents, and contexts, and how deviations affect validity.

  Fifth, it **must reconcile the internal/subjective reality of consent with the need for external, objective verification.** This is the profound tension you identified. The sedated patient who later denies intent, versus the regretful but competent consenter, highlights the internal dimension: true consent seems to require a genuine internal state of understanding and agreement. Yet, hospitals, courts, and mechanics (as you rightly insist) cannot read minds. They rely on **manifestations** – words, signatures, conduct. An account must navigate this. Can valid consent exist purely internally without manifestation? Almost certainly not for practical purposes. But can a clear manifestation (like a signature while sedated) constitute valid consent if the internal state is fatally compromised? Also no. The theory must define the necessary relationship between the internal state and its outward expression, acknowledging that perfect alignment is unknowable but some reliable connection is essential. **Giving up the internal state requirement** reduces consent to mere performative compliance, vulnerable to exploitation. **Giving up the external verifiability requirement** makes consent practically useless as a basis for action in the social world. Most theories strain at this seam; the cost of prioritizing one pole over the other is high.

  Sixth, it **must be outcome-independent.** Consent does not guarantee good outcomes. People consent to harmful things (medically necessary but painful procedures, risky investments). They can consent grudgingly or unhappily. The validity of consent hinges on the *process* of agreeing, not the *result* (benefit/harm) or the *affect* (cheerfulness). An account that ties validity to good outcomes or happy agreement misrepresents human agency.

  Seventh, it **must distinguish the inability to consent from merely unconventional consent.** Someone with profound intellectual disability may lack capacity altogether. Someone else might consent based on unusual beliefs or values, or express it oddly. Unless those beliefs indicate a fundamental lack of understanding or undermine voluntariness (e.g., delusions), the consent might still be valid. The account must avoid pathologizing difference.

  **Non-Negotiables:** Distinguishing consent from compliance (Requirement 1), requiring some threshold of capacity/understanding (Requirement 3 - core element), needing both an internal state *and* its manifestation linked reliably (Requirement 5 - though the *how* is contested), and being outcome-independent (Requirement 6) are fundamental. Without these, the concept loses its ethical and practical meaning.

  **Negotiables/Preference-Dependent:** The *extent* of the duty to disclose (silence vs. lie in Requirement 2), the precise definition of "materiality" (Requirement 2), how strictly to define the *scope* of consent (Requirement 4), the *degree* of capacity required for different contexts (Requirement 3 - e.g., buying coffee vs. a house), and crucially, **how to resolve the internal/external tension** (Requirement 5 - *where* the balance is struck) are major points of theoretical divergence. Whether later forgetting retroactively invalidates earlier competent consent (dementia case in Requirement 3) is also heavily debated.

  **Suspected Incompatibilities:** The central, likely unresolvable tension is **Requirement 5 (Internal State vs. External Verifiability).** Theories emphasizing pure internal subjectivity struggle with verification. Theories emphasizing objective manifestations risk validating "consent" given under duress or without understanding. Most accounts sacrifice some purity on one side for workability. Another tension exists between **Requirements 2 and 3 (Materiality and Capacity).** Defining "material" information often implicitly relies on what a *competent* person *would* find important, tying the two together in potentially circular ways.

  **The Single Most Disruptive Requirement:** If taken seriously, **Requirement 2, particularly the demand for a clear, non-arbitrary principle of "materiality"** (what information must be known/disclosed), rules out many otherwise plausible accounts. Does materiality depend solely on the *consent-giver's actual, subjective values* (unknowable)? On what a *reasonable person* would want to know? On what *caused* the decision? Your salesman case exposes this: if you don't care about the deceived aspect, is consent still valid? If yes, validity depends on subjective quirks. If no, consent can be voided by irrelevant deceptions. If materiality is based on what *would* change a *reasonable* person's decision, it imposes an external standard. This requirement forces theories into difficult choices about subjectivity, objectivity, and causation, often revealing their deepest assumptions and weaknesses. Grappling with materiality consistently across cases like the mechanic (withholding) and the salesman (irrelevant deception) is a litmus test few theories pass flawlessly.

  This map outlines the rugged terrain your question demands. Any theory worth its salt must navigate these specific cliffs and crevasses, showing where it stands on each requirement and why, especially when facing the hard cases you've identified. The friction points, particularly between the mind's inner reality and the world's need for clear signals, are where the deepest philosophical and practical work happens.
