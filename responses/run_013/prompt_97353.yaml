  Key requirements:
  1. Three sites with dossiers containing quantitative descriptions (population sizes, typical lifespans, causes of death, survival rates) such that the most "pristine" site scores poorly on some welfare measures and well on others.
  2. One site has a management lever (e.g., supplementary feeding or predator control) that, when pulled, increases average welfare per animal but decreases total welfare (due to increased population leading to more suffering overall, or other reasons).
  3. A rule change mid-session: the funder requires the trust to declare in advance which single measure they are maximizing (total welfare, average welfare, or the number of lives avoiding a violent/lingering end) and then defend the allocation based on that measure. The ranking of sites should flip or become indeterminate at this point.

  Structure of the session (90 minutes total):
  - Introduction (5 min): Set the scene and explain the board's task.
  - Site Dossier Review (15 min): Participants review the three site dossiers and the management option.
  - Initial Deliberation (25 min): Board discusses and makes a preliminary allocation.
  - Rule Change (5 min): Announce the funder's new requirement.
