   The sites are not ranked against each other but chosen in combination.

   The debrief will note that the choice of measure determines which sites are saved.

   Now, the packet:

   Facilitator script for rule change: 
     "The trust has been informed by its major funder that the release of the money is contingent on the trust declaring, before the allocation is finalized, which single measure it is using to evaluate the welfare impact of its decision. The measure must be one of the following: 
      1. Total welfare summed across all creatures, operationalized as the total number of animal-years expected to be lived in the funded sites over the next year.
      2. The average welfare per creature, operationalized as the average lifespan of the animals across the funded sites.
      3. The number of lives that avoid a violent or lingering end, operationalized as the number of animals that die of old age in the funded sites over the next year.
     You must now choose one of these measures, and then allocate the money to maximize that measure. You will then defend your allocation in terms of that measure."

   Note: we operationalized the measures with concrete numbers.

   1. Total welfare = total animal-years at the site(s) in one year.
   2. Average welfare = total animal-years / total animals at the site(s) = average lifespan.
   3. Good deaths = number of animals that die of old age at the site(s) in one year.

   In the debrief, we explain that these are proxies.

   The site dossiers must contain the necessary data for them to compute or estimate these measures.

   Site A: 
     Name: "Wetland Reserve"
     Description: "A large wetland area with high populations of waterfowl, fish, and small mammals."
     - Waterfowl: 10,000 individuals; average lifespan 3 years; causes of death: 70% predation, 20% disease, 10% starvation; survival to breeding age: 30%
     - Fish: 6,000 individuals; average lifespan 2 years; causes of death: 40% predation, 40% disease, 20% starvation; survival to breeding age: 20%
     - Small mammals: 4,000 individuals; average lifespan 1.5 years; causes of death: 80% predation, 10% disease, 10% starvation; survival to breeding age: 25%
     Total animals: 20,000
     Base cost: $400,000

   Site B:
     Name: "Ancient Forest Fragment"
     Description: "A forest fragment with a mix of long-lived bird, mammal, and reptile species."
     - Birds: 1,000 individuals; average lifespan 20 years; causes of death: 10% predation, 10% disease, 80% old age; survival to breeding age: 40%
     - Mammals: 1,000 individuals; average lifespan 15 years; causes of death: 10% predation, 10% disease, 80% old age; survival to breeding age: 50%
     - Reptiles: 200 individuals; average lifespan 30 years; causes of death: 10% predation, 10% disease, 80% old age; survival to breeding age: 60%
     Total animals: 2,200
     Base cost: $400,000

   Site C:
     Name: "Grassland Plains"
     Description: "A grassland area with a population of grazing mammals and ground-nesting birds."
     - Grazing mammals: 4,000 individuals; average lifespan 8 years; causes of death: 10% predation, 10% disease, 10% starvation, 70% old age; survival to breeding age: 80%
     - Birds: 2,000 individuals; average lifespan 5 years; causes of death: 20% predation, 10% disease, 10% starvation, 60% old age; survival to breeding age: 60%
     Total animals: 6,000
     Base cost: $400,000
     Optional management: "Predator control and supplementary feeding" at extra cost of $300,000. If implemented, the carrying capacity will increase, and the population will become:
          - Grazing mammals: 5,000; average lifespan 9 years; causes of death: 5% predation, 50% disease, 5% starvation, 40% old age
          - Birds: 3,000; average lifespan 6 years; causes of death: 5% predation, 40% disease, 5% starvation, 50% old age

     Note: the changes in causes of death are due to increased density and disease spread.

   The total animal-years and good deaths for each site (in base state) can be calculated from this data, but we won't provide the calculations; the participants will have to reason with the data.

   For the initial allocation, they may not have thought in terms of these measures, but in the rule change, they will.

   Roles:

  - Ecosystem Stewards (3-4): Focus on preserving biodiversity, ecosystem health, and long-term stability. They might argue for Site B because of its ancient forest and unique species, or Site A because of its importance for migratory birds.
  - Animal Welfare Advocates (3-4): Focus on reducing suffering. They might be drawn to Site C because of the high proportion of good deaths, or Site B because of the long lives.
  - Financial Prudents (2-3): Want to avoid controversy and ensure future funding. They might argue for saving two sites to show more impact, or for not doing the management on Site C because it's expensive and might be seen as meddling.
  - Voice for the Animals (1): Speaks for the animals. Might argue against any intervention that increases suffering, or for the site where animals have the best lives.
  - The rest can be assigned to these groups.

   Predictably, the Animal Welfare Advocates might split: some for Site C (good deaths) and some for Site B (long lives). The Voice for the Animals might side with the long lives or good deaths.

   The Financial Prudents might push for funding two sites to show more impact.

   In the initial deliberation, they might choose to fund two sites, say A and C, because that saves more animals.

   Then at the rule change, if they choose to maximize average lifespan, they will have to drop two sites and fund only B.

   This will be a dramatic shift.

   What might go wrong:
  - Participants might challenge the numbers: "How do we know the average lifespan is 3 years?" Facilitator should say: "These are the best estimates from the trust's ecologists. For the sake of the exercise, treat them as given."
  - The Financial Prudents might win by accident because they are risk-averse and their choice of funding two sites might align with two measures.
  - The ninety minutes might overrun in the initial deliberation. Facilitator should keep time and move them along.
  - A participant might object that we cannot know what an insect feels (but in this setup, Site A has small mammals, not insects, but if they ask about fish or reptiles, the same issue). Facilitator response: "The exercise is based on the best available science and ethical reasoning. We are using these numbers as proxies for welfare. The philosophical question of what beings can suffer is important, but for this exercise, we are assuming that the animals in the dossiers can experience welfare."

   Facilitator script for rule change (minute 45 of the session, after 25 min initial deliberation and 5 min for the rule change announcement):

     "Stop the discussion. I have an important announcement from the funder. The funder has just informed the trust that the release of the $1 million is contingent on the trust declaring, before final allocation, which single measure it is using to evaluate the welfare impact of its decision. You must choose one of the following three measures:

     1. Total welfare summed across all creatures, defined as the total number of animal-years lived in the funded sites over the next year.
     2. Average welfare per creature, defined as the average lifespan of the animals across the funded sites.
     3. The number of lives that avoid a violent or lingering end, defined as the number of animals that die of old age in the funded sites over the next year.

     You have five minutes to discuss and choose which measure to adopt. Once chosen, you must allocate the money to maximize that measure. You will then have ten minutes to finalize your allocation and prepare a defense of your choice in terms of that measure."

   After the final defense, facilitator script for closing frame (before debrief):

     "Thank you for your work. The trust's board has made a difficult decision. We will now step out of the role-play and reflect on what this exercise illustrates about the net welfare of ecosystems."

   Debrief points:

     - The exercise illustrates the tension between ecosystem-level metrics (like biodiversity) and individual welfare. The most biodiverse site (Site A) has the shortest lives and high suffering.
     - The three aggregation rules:
          - Total welfare (animal-years) favors sites with many animals, even if their lives are short.
          - Average welfare (average lifespan) favors sites where animals live long lives, even if there are few of them.
          - Good deaths favor sites where a large proportion of animals die of old age.
     - None of these measures is obviously the correct one, and they can conflict.
     - In the initial phase, participants may have used biodiversity or biomass as a proxy for welfare, but the exercise shows that these do not necessarily align with individual welfare.
     - The exercise stops being informative when we recognize that we are only moving proxies around. We are not measuring welfare itself, only our operationalizations. Therefore, the exercise cannot tell us what we ought to do, only that the choice of metric matters and that there is no clear answer.
     - The management lever on Site C shows that an intervention that seems to improve individual welfare (longer lives) may reduce the number of good deaths, and depending on the measure, it might not be the best choice.

   What the exercise cannot reproduce: 
     - We are not actually measuring welfare; we are using simple proxies. Real welfare is about the quality of experiences, which we haven't captured.
     - The exercise assumes we can compare welfare across species, which is philosophically contentious.
     - It doesn't capture the long-term dynamics or the intrinsic value of species.

   Now, the whole packet in a structured format.
