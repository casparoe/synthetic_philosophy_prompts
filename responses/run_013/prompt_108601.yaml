prompt: |-
  Some months ago I read a blog post about an idea the author called evidential cooperation in large worlds, and it has been rattling around in my head ever since, mostly because I have nobody to argue with about it. My friends are patient but not interested, and the two people I did bring it up with dismissed the whole thing as science fiction. So I would like a careful account of how much of what the blogger said actually survives scrutiny.

  The blogger's version went roughly like this. The universe is very large, and in it there are very many other agents, some of whom are working through their situation in much the same way I work through mine, thinking in the same terms, weighing the same kinds of reasons, drawing on the same evidence. Nothing I do can ever reach them and nothing they do can ever reach me; there is no signal, no trade route, no causal chain in either direction. Even so, the blogger said, because their deliberation runs along the same lines as mine, what I decide is evidence about what they will decide, and so when I choose to cooperate I raise the probability that they cooperate as well, while defecting lowers it. Since the gains from cooperation are collected across all those distant agents at once, cooperating can be worth it even though nobody I am cooperating with will ever be affected by me. On the blogger's telling this also means that those far-off agents must in the end care about the same things I care about, since they reason as I do, which makes the whole thing the golden rule with a proof attached. The blogger then added that in a universe this large everyone's choices are correlated with everyone else's, that the mathematics of this is settled, and that refusing to cooperate with strangers you will never meet is therefore simply irrational; the only people who resist the conclusion, the blogger said, are sentimental about common sense. Two things made me uneasy as I read. The phrase gains from trade suggests two parties who want different things and can nonetheless make each other better off, which does not sit well with the claim that they must care about what I care about. And the talk of raising and lowering probabilities sounded, at least to me, as though I were reaching across the universe and pushing on somebody's decision, which I take it cannot be the point.

  What I want is an audit, claim by claim, rather than a summary of the idea. Tell me which parts a careful proponent of it would accept as fair, which are the sort of harmless shorthand a popularizer might use where a specialist would want to be more careful, and which are outright misrepresentations of what is being claimed. If any of the blogger's steps hold only under conditions the blogger left out, say what those conditions are. In particular I would like to know whether the sheer size of the universe is doing the work in the argument or whether something else is, and what exactly the large in the name is contributing. Then tell me whether the blogger's closing conclusion follows from the parts of the account that survive, and if it does not, what the corrected conclusion would look like. I am inclined to think the underlying mechanism, whatever it is, is a real one, and that the ending is far too strong; I would be glad to be told I am wrong about either. Please explain the ideas in your own words rather than pointing me at further reading, since I would rather understand the thing than collect sources.
reasoning: |-
  We are going to audit the blog post's claims about "evidential cooperation in large worlds" (ECL). The core idea is that in a large universe with many agents reasoning similarly to me, my decision to cooperate (or defect) provides evidence about what other such agents will do, and because there are so many of them, even a small change in the probability that they cooperate can lead to a large expected utility gain. We'll break it down step by step.

  ### Claim 1: The universe is very large, and in it there are very many other agents, some of whom are working through their situation in much the same way I work through mine, thinking in the same terms, weighing the same kinds of reasons, drawing on the same evidence.
  - **Audit**: This is a starting assumption. It's plausible in a large universe (like ours) that there are many agents with similar cognitive processes and facing similar dilemmas. However, the exact degree of similarity required is crucial and often glossed over. The argument requires that the agents are "copies" in a very strong sense: they have the same evidence and reasoning process, so that they are in a symmetric situation. Without this symmetry, the evidential link breaks.

  ### Claim 2: Nothing I do can ever reach them and nothing they do can ever reach me; there is no signal, no trade route, no causal chain in either direction.
  - **Audit**: This is also an assumption. It sets up a purely evidential (as opposed to causal) connection. The key is that the agents are causally isolated. This is necessary to avoid conflating evidential and causal decision theory. In causal isolation, the only connection is through the evidence that my decision provides about the decisions of others.

  ### Claim 3: What I decide is evidence about what they will decide, because their deliberation runs along the same lines as mine.
  - **Audit**: This is the heart of the argument. If I and the other agents are in symmetric situations (same evidence, same reasoning) and we all know this, then my decision is informative about theirs. The reasoning is that if I, after careful deliberation, choose to cooperate, then that suggests that other agents in the same situation are also likely to choose to cooperate. This is a valid point in evidential decision theory (EDT). However, note that this is only true if we are in a symmetric situation. If the other agents are not exactly symmetric (e.g., they have different priors or different evidence), then the evidential link may be weak or broken.

  ### Claim 4: When I choose to cooperate I raise the probability that they cooperate as well, while defecting lowers it.
  - **Audit**: This is a consequence of the evidential link. In EDT, if I condition on my decision to cooperate, that updates my belief about what others will do. However, note that this is a subjective update: I am updating my own beliefs. It does not mean that my action causally affects others. The blogger's phrasing might be misleading because it sounds like a causal claim. A careful proponent would say: "Conditional on me cooperating, the probability that they cooperate is higher than conditional on me defecting." This is not causation, it's correlation due to shared circumstances and reasoning.

  ### Claim 5: Since the gains from cooperation are collected across all those distant agents at once, cooperating can be worth it even though nobody I am cooperating with will ever be affected by me.
  - **Audit**: This is the expected utility calculation. Suppose that by cooperating, I increase the probability that each of the N other agents cooperates by a small amount. Then the total expected utility gain from the increased cooperation of others might be very large (because N is large) and might outweigh the cost to me of cooperating. This is the key insight. However, note that the gains are not "from trade" in the usual sense (which implies mutual benefit from exchange of different goods). Instead, it's about mutual benefit from coordinated cooperation in a symmetric game (like a prisoner's dilemma). The term "gains from trade" might be a misnomer; it's more about gains from coordination.

  ### Claim 6: On the blogger's telling this also means that those far-off agents must in the end care about the same things I care about, since they reason as I do, which makes the whole thing the golden rule with a proof attached.
  - **Audit**: This is an overstatement. The argument does require that the agents have similar utility functions. If they care about different things, then what is "cooperation" for me might not be for them, or the gains might not align. However, the symmetry assumption (same reasoning and same evidence) does not necessarily imply the same utility function. The blogger might be conflating "reasoning the same way" with "having the same goals". A careful proponent would note that for the cooperation to be mutually beneficial, the agents must have aligned utility functions. The golden rule (do unto others as you would have them do unto you) is indeed a consequence if we assume that the others are sufficiently similar to me that what I wish for myself, they wish for themselves.

  ### Claim 7: The blogger then added that in a universe this large everyone's choices are correlated with everyone else's, that the mathematics of this is settled.
  - **Audit**: The mathematics of evidential decision theory in large worlds is indeed well-established in certain academic circles (e.g., the work on timeless decision theory, updateless decision theory, and the like). However, it is not without controversy. The key is that the correlation arises from the symmetry and the evidential update. But note: the argument requires that the group of agents who are symmetric is large. If the universe is large but the symmetric agents are few, then the effect is small. So the sheer size of the universe is not enough; it's the size of the symmetric group that matters. The blogger's phrase "everyone's choices" is too broad: only the choices of agents in the symmetric group are correlated.

  ### Claim 8: Refusing to cooperate with strangers you will never meet is therefore simply irrational; the only people who resist the conclusion are sentimental about common sense.
  - **Audit**: This is a strong conclusion. It assumes that the conditions (symmetry, causal isolation, large N) hold, and that the expected utility calculation comes out in favor of cooperation. However, there are several caveats:
    - **Symmetry**: How do I know that the strangers are in a symmetric situation? If they are not, then the evidential link breaks.
    - **Utility alignment**: If the strangers have different utility functions, then my cooperation might not lead to mutual gains.
    - **Game structure**: The argument is typically set in a symmetric prisoner's dilemma or similar. In other games, the conclusion might not hold.
    - **Decision theory**: Not all decision theorists accept EDT. Causal decision theorists (CDT) would argue that since there is no causal link, my action doesn't affect others, so I should defect. The blogger is taking an EDT perspective and dismissing CDT.

  ### Your Uneasiness:
  1. **Gains from trade**: You are right to note that "gains from trade" typically involves differences in preferences or resources. In this setting, it's about gains from mutual cooperation in a symmetric game. The blogger might have used the term loosely. A better term would be "gains from coordination".

  2. **Raising and lowering probabilities**: You correctly note that this is not causation. The blogger's phrasing might have suggested a causal link. The careful point is evidential: my decision is evidence about theirs.

  ### The Role of Large Worlds:
  The "large" in "large worlds" does two things:
  1. It ensures that the number N of symmetric agents is large, so that even a small change in the probability of their cooperation can lead to a large expected utility change.
  2. In a large universe, it is more plausible that there are many symmetric agents.

  But note: the argument does not require an infinite universe. It requires that N is large enough that the expected gain from the increased cooperation of others outweighs the cost of cooperating.

  ### Does the Conclusion Hold?
  The blogger's conclusion that refusing to cooperate is irrational is conditional on:
  - The agents being in a symmetric prisoner's dilemma (or similar) with aligned utilities.
  - The group of symmetric agents being large.
  - Accepting evidential decision theory.

  If these conditions hold, then the conclusion follows. However, in the real world, it is hard to be sure about symmetry and utility alignment. Moreover, if you are a causal decision theorist, you would reject the argument.

  ### Corrected Conclusion:
  A more careful conclusion would be: 
  "In a large world with many agents who are in a symmetric situation with aligned utilities and who are causally isolated, and when the expected gains from the increased cooperation of others (due to evidential reasoning) outweigh the cost of cooperating, then it is rational (according to evidential decision theory) to cooperate. However, in practice, establishing the required symmetry and utility alignment with distant strangers is difficult, and the conclusion is sensitive to the decision theory one adopts."

  ### Summary of the Audit:
  - **Fair claims**: The core evidential reasoning in symmetric, causally isolated large groups is valid under EDT.
  - **Harmless shorthand**: Saying "gains from trade" instead of "gains from coordination", and using phrases like "raise the probability" (if interpreted evidentially).
  - **Misrepresentations**:
    - The claim that the agents must have the same utility function is not required by the symmetry of reasoning alone (though it is needed for mutual benefit).
    - The claim that "everyone's choices are correlated" is too broad; it's only the symmetric group.
    - The dismissal of dissent as "sentimental about common sense" ignores legitimate disagreements about decision theory and the difficulty of establishing symmetry.

  ### Your Inclination:
  You are right that the underlying mechanism (evidential reasoning in symmetric large groups) is real and recognized in decision theory. However, the blogger's conclusion is too strong because it ignores the practical difficulties and the controversy over decision theories.
answer: |-
  Below is a systematic audit of the blog post's claims about "evidential cooperation in large worlds" (ECL). I'll address each component you described, categorizing them as **fair** (valid under careful assumptions), **shorthand** (simplified but defensible with clarification), or **misrepresentation** (inaccurate or misleading). I'll also specify missing conditions, clarify the role of "large" worlds, and evaluate the overall conclusion. The audit is grounded in decision theory (particularly evidential and causal frameworks) and avoids appeals to common sense or sentiment.

  ---

  ### **Claim 1: The universe is very large, with many agents reasoning identically to me.**  
  **Verdict: Shorthand.**  
  - **Why**: The core ECL argument requires agents to be *symmetric*: they share the same evidence, reasoning process, and decision context. But "identical reasoning" is an oversimplification.  
  - **Missing conditions**:  
    - Agents must face the *same type of decision problem* (e.g., a Prisoner's Dilemma) with the same payoff structure.  
    - They must have *no relevant differences* in their knowledge or circumstances (e.g., all know they are in a large universe with symmetric agents).  
  - **Role of "large"**: Universe size matters only insofar as it increases the *number of symmetric agents* (denoted **N**). If **N** is small, ECL effects are negligible. "Large" does not require an infinite universe, but **N** must be sufficiently big for expected utility gains to outweigh costs.  

  ---

  ### **Claim 2: No causal interaction is possible between agents.**  
  **Verdict: Fair.**  
  - **Why**: This is a standard assumption in ECL to isolate *evidential* effects. If causal chains existed, the problem would reduce to standard game theory (e.g., repeated interactions). Causal isolation forces reliance on evidence, not influence.  

  ---

  ### **Claim 3: My decision provides evidence about others' decisions.**  
  **Verdict: Fair, but context-dependent.**  
  - **Why**: Under evidential decision theory (EDT), your choice is evidence for others' choices because symmetric agents reason similarly. If you cooperate, you infer that others likely cooperate too, as you all share evidence and rationality.  
  - **Mechanism**: This is **correlation without causation**—like learning about a coin's bias by observing one flip. Your decision is a "signal" of how symmetric agents resolve the same dilemma.  
  - **Your unease about "reaching across the universe"**: This is justified. The blogger's phrasing ("raising/lowering probabilities") risks implying causation. A careful proponent would say: *Conditional on your choice, your estimate of others' cooperation probability changes*. No "pushing" occurs; it's Bayesian updating.  

  ---

  ### **Claim 4: Cooperating increases others' cooperation probability; defecting lowers it.**  
  **Verdict: Shorthand.**  
  - **Why**: In EDT, *conditional on your action*, your belief about others' actions shifts. But this isn't universal:  
    - If you defect, you believe others are *slightly more likely* to defect (since symmetric agents reason alike).  
    - The effect size depends on how many agents share your exact symmetry. If most agents differ, the shift is negligible.  
  - **Correction**: It's not that you *change* the probability—it's that your choice *reveals information* about what was already likely.  

  ---

  ### **Claim 5: Gains from cooperation aggregate across distant agents, making cooperation worthwhile.**  
  **Verdict: Fair, with caveats.**  
  - **Why**: With **N** symmetric agents, the expected utility (EU) of cooperating includes:  
    - A *personal cost* (e.g., losing $1 in a trade).  
    - A *gains multiplier*: If your cooperation increases the estimated chance of others cooperating by **Δp**, the total EU gain is **Δp × N × (gain per cooperation)**. If **N** is large, this dwarfs the personal cost.  
  - **Your unease about "gains from trade"**: Warranted. "Trade" suggests comparative advantage (e.g., swapping apples for oranges), but ECL relies on *identical* gains from coordination (e.g., mutual cooperation in a Prisoner's Dilemma). The blogger conflates terms.  
  - **Key insight**: ECL works best in symmetric dilemmas with **superlinear scaling**. Example: If all cooperate, each gets **$N**; if you defect alone, you get **$N+1**; but defecting lowers **Δp**, costing you **Δp × N²** in expected gains.  

  ---

  ### **Claim 6: Distant agents must care about what I care about (Golden Rule).**  
  **Verdict: Misrepresentation.**  
  - **Why**: Symmetry in *reasoning* does not imply symmetry in *values*. Agents could share your logic but have different utility functions (e.g., they value environmental harm while you value profit).  
  - **Golden Rule connection**: ECL resembles the Golden Rule only if we *assume* aligned utilities. If utilities differ, "cooperate" may not benefit them (or you).  
  - **Correction**: ECL requires that gains from mutual cooperation are *universal* (e.g., all benefit from reduced cosmic risks). If utilities align, cooperation becomes a "proof" of the Golden Rule, but alignment is an **added premise**, not a conclusion.  

  ---

  ### **Claim 7: In a large universe, everyone's choices correlate; the math is settled; resisters are sentimental.**  
  **Verdict: Part misrepresentation, part shorthand.**  
  - **"Everyone's choices correlate"**: **Misrepresentation.** Choices correlate *only among symmetric agents*. Most real-world strangers differ in evidence, goals, or context, breaking symmetry.  
  - **"The math is settled"**: **Shorthand.** The EDT math *is* established (e.g., in frameworks like *updateless decision theory*), but its applicability is debated. Causal decision theorists (CDT) reject EDT in such cases.  
  - **"Resisters are sentimental"**: **Misrepresentation.** Critics (e.g., CDT proponents) argue EDT leads to irrationality in causal isolation. Example: CDT says defecting dominates because your choice *causes* no change; rejecting ECL isn't sentiment—it's a rival theory.  

  ---

  ### **Claim 8: Refusing to cooperate is irrational.**  
  **Verdict: Overstated.**  
  - **Why**: The conclusion holds only under strict conditions:  
    1. Many agents are **symmetric** (same problem, evidence, reasoning).  
    2. Utilities are **aligned** (all benefit from mutual cooperation).  
    3. **N** is large enough that **Δp × N × gain > personal cost**.  
    4. You accept **evidential decision theory**.  
  - **In reality**:  
    - If conditions fail (e.g., symmetry is unlikely), cooperation may be suboptimal.  
    - CDT advocates argue defection is rational since your action has no *causal* effect.  
  - **Corrected conclusion**:  
    > *In a large universe with many symmetric, causally isolated agents who share your utility function, cooperating can be rationally required under evidential decision theory because the expected gains from correlated decisions outweigh the personal cost. However, this depends on stringent assumptions about symmetry and alignment, and it is contested by causal decision theorists.*  

  ---

  ### **Overall Role of "Large" Worlds**  
  - **What "large" contributes**: It amplifies **N** (number of symmetric agents), turning tiny evidential effects (**Δp**) into large EU gains. A "small" world with high symmetry (e.g., **N=1,000**) could work, but universes increase the likelihood of large **N**.  
  - **Not sufficient alone**: Universe size doesn't guarantee symmetry or aligned utilities. A "large but heterogeneous" universe undermines ECL.  

  ---

  ### **Does the Blogger's Conclusion Hold?**  
  - **Short answer**: No—it's too strong. The blogger claims refusing cooperation is "simply irrational," but:  
    - It ignores **utility misalignment** (e.g., helping aliens who harm humans).  
    - It dismisses **alternative decision theories** (e.g., CDT).  
    - It overstates **practical symmetry** (most strangers aren't your "copies").  
  - **Your inclination is correct**: The mechanism (EDT + symmetry) is theoretically valid, but real-world applications are speculative. ECL is best seen as a *thought experiment* highlighting EDT's implications, not a slam-dunk imperative.  

  ---

  ### **Final Summary of the Audit**  
  | **Blogger's Claim** | **Verdict** | **Key Corrections** |  
  |----------------------|-------------|---------------------|  
  | Universe large, many symmetric agents | Shorthand | Requires strict symmetry; "large" matters only for **N**. |  
  | No causal interaction | Fair | Core assumption for evidential effects. |  
  | My decision evidences others' choices | Fair | Correlation, not causation. |  
  | Cooperation raises others' cooperation probability | Shorthand | It updates your *estimate* of probability. |  
  | Aggregate gains make cooperation worthwhile | Fair | Only if **N** large and utilities aligned. |  
  | Agents must care about what I care about | Misrepresentation | Symmetry in reasoning ≠ symmetry in values. |  
  | Universal correlation; settled math; resisters sentimental | Mostly misrepresentation | Only symmetric agents correlate; EDT vs. CDT is debated. |  
  | Defection is irrational | Overstated | Holds only under strict conditions; CDT disagrees. |  

  The blogger's account survives scrutiny in its *logical structure* under idealized symmetry, but it overreaches in practical implications. ECL is a provocative idea but not a conclusive proof—it’s a tool for exploring decision theory, not a replacement for real-world ethics. If you embrace EDT and accept the symmetry assumptions, cooperation becomes compelling; otherwise, it’s debatable. This aligns with your suspicion that the mechanism is real but the conclusion is too strong.
