prompt: |-
  ok, so I keep getting told that the way to decide whether a credence is rational is to ask how accurate it is — how close it lands to the truth under some proper scoring rule — and then argue that the credence to have is whichever one maximizes expected accuracy. Fine. But before I sign on to any version of that, I want the spec, not a defense of one particular version. Write me the desiderata that any adequate accuracy-first / epistemic-utility account of rational credence has to meet: the cases it has to get right (a credence that's plainly fine, one that's plainly nuts, two people with the same evidence who reasonably disagree, a case where you should defer to someone better informed than you, a case where you learn something about your own reasoning and have to adjust), the distinctions it can't be allowed to blur (credence vs. outright belief; being accurate vs. being rational; the accuracy of one credence vs. of your whole credence function; what's required vs. what's merely permitted), and the results it has to stay consistent with (whatever it is that makes probabilism come out as the uniquely undominated option, conditionalization being the diachronic rule, and the fact that in the dominance cases different proper rules agree while outside them they can pull apart). For each requirement, give me the consideration behind it, and say which ones are negotiable and which aren't. Then the part I actualy care about: point out any pair of these that look jointly unsatisfiable — if, say, you can only get deference to experts by quietly giving up something else, that's exactly what I want to see — and tell me which single requirement ends up doing the most work in ruling out otherwise-popular views. I dont need the full scorecard, I'll do that part myself.
reasoning: |-
  Okay, let me approach this user request systematically. The user wants a comprehensive framework for evaluating accuracy-first epistemology, with specific requirements and potential tensions. 

  First, I need to identify the core components the user is asking for: (1) key cases any theory must handle correctly, (2) essential distinctions to maintain, (3) mandatory theoretical results, and (4) analysis of conflicts between requirements. The user seems well-versed in formal epistemology but frustrated with piecemeal defenses - they want the full specification upfront.

  For the cases, I'm thinking of including paradigmatic examples like uniform priors (rational) and extreme dogmatism (irrational), plus tricky ones like peer disagreement and self-doubt scenarios. The expert deference case is crucial too - it tests how the theory handles informational asymmetry. 

  The distinctions part needs careful handling. User explicitly wants to prevent conflation between credence/belief, accuracy/rationality, local/global evaluation, and obligations/permissions. This suggests they're wary of oversimplified accounts. 

  On theoretical results, probabilism and conditionalization are non-negotiable per the query. The dominance argument alignment point is subtle but important - it speaks to scoring rule selection.

  Now the conflicts... that's where it gets juicy. I see three major tensions: 
  First, between expert deference and accuracy dominance - strict dominance arguments might forbid deferring to non-truth-connections. 
  Second, between self-correction cases and immodesty - if you doubt your own reliability, should you still maximize your own expected accuracy? 
  Third, between peer disagreement and uniqueness - how can two rational credences coexist if accuracy is objective?

  The immodesty requirement is doing heavy lifting here. It's what forces the internal perspective and blocks appeals to "true" rational credences. Without it, half these constraints wouldn't bind. 

  User's phrasing suggests they suspect hidden trade-offs ("exactly what I want to see"). I'll highlight how satisfying deference might require relaxing dominance, and how self-correction challenges immodesty. The expert case seems most explosive - it potentially blows up the whole accuracy framework if not handled carefully.

  For presentation, I'll structure each requirement with: (1) the case/distinction/result, (2) its rationale, (3) negotiability. Then cluster the conflicts thematically. The tone should stay technical but slightly conversational - user dislikes overly polished defenses.
answer: |-
  Here's the specification you're demanding for any adequacy-first epistemic utility theory (EUT) of rational credence. The requirements are categorized, with rationale, negotiability status, and identification of key tensions.

  ### I. Core Cases Any Adequate EUT Must Get Right
  1.  **The Permissible Prior (e.g., Uniform Prior):**
      *   **Case:** An agent with no evidence about a partition (e.g., heads/tails coin of unknown bias) assigns equal credence (0.5, 0.5). This must be deemed rationally permissible.
      *   **Rationale:** Captures basic inductive rationality without arbitrary bias. Foundational for subjective Bayesians.
      *   **Negotiability:** Low. Rejecting this undermines core Bayesianism.

  2.  **The Manifestly Irrational (Extreme Dogmatism):**
      *   **Case:** An agent assigns credence 1.0 to a complex empirical claim (e.g., "Dark matter doesn't exist") despite overwhelming, readily available contrary evidence.
      *   **Rationale:** Any plausible theory must condemn blatant disregard of evidence.
      *   **Negotiability:** None. Failure here is fatal.

  3.  **Reasonable Peer Disagreement:**
      *   **Case:** Two equally rational, competent agents with identical, non-conclusive evidence reach different credences about the same proposition (e.g., 0.6 vs. 0.7 guilt in a trial).
      *   **Rationale:** Epistemic permissivism is intuitively plausible; rationality doesn't always mandate unique credences given evidence.
      *   **Negotiability:** Moderate. Uniqueness defenders reject this case *as stated*, but EUT needs *some* account of how rational disagreement is possible or impossible.

  4.  **Expert Deference (Total Evidence):**
      *   **Case:** Agent A learns that agent B (known to be better informed/more expert on topic X) has credence *c* in proposition P. A learns *only* B's credence and B's expertise, not B's evidence. A should typically shift their credence towards *c*.
      *   **Rationale:** Captures the rationality of deferring to better-informed sources (e.g., trusting a weather forecaster).
      *   **Negotiability:** Low. Inability to recover deference is a major weakness.

  5.  **Self-Correction/Reasoning Awareness:**
      *   **Case:** An agent learns they are cognitively impaired in a specific way relevant to their current credence (e.g., takes a drug known to induce unwarranted optimism about risks; learns their calculation contained a systematic error type).
      *   **Rationale:** Rationality requires responding to evidence about one's own reliability.
      *   **Negotiability:** None. Ignoring self-relevant evidence is irrational.

  ### II. Essential Distinctions Any Adequate EUT Must Preserve
  1.  **Credence vs. Outright Belief:**
      *   **Requirement:** Must not collapse degrees of belief into binary belief. Must explain why high credence (e.g., 0.99) is often insufficient or inappropriate for full belief (e.g., due to stakes).
      *   **Rationale:** Captures the graded nature of epistemic uncertainty. Binary belief involves additional pragmatic/normative factors.
      *   **Negotiability:** None. Blurring this loses essential structure.

  2.  **Accuracy vs. Rationality:**
      *   **Requirement:** Must distinguish *having a true belief* (accuracy) from *forming belief rationally given available evidence* (rationality). A rational credence can be inaccurate; an irrational one can be accidentally accurate.
      *   **Rationale:** The core justification of EUT is that rationality *aims* at accuracy *given limitations*. Conflating them makes the theory trivial or incoherent.
      *   **Negotiability:** None. This distinction is foundational to EUT itself.

  3.  **Local (Single Credence) vs. Global (Entire Function) Accuracy:**
      *   **Requirement:** Must evaluate rationality based primarily on the expected accuracy of the *entire credence function*, not just individual credences in isolation. Must explain why local dominance isn't always decisive.
      *   **Rationale:** Credences are interdependent (probabilism); rational constraints like conditionalization operate globally. Focusing solely on individual credences leads to contradictions (e.g., with probabilism).
      *   **Negotiability:** Low. Global focus is necessary for coherence with other constraints.

  4.  **Obligation (Required) vs. Permission (Permissible):**
      *   **Requirement:** Must distinguish credences uniquely mandated as rational from credences merely permissible. Must not force uniqueness where permissivism is plausible.
      *   **Rationale:** Reflects debates about Uniqueness vs. Permissivism. A theory declaring all credences irrational or exactly one rational needs strong justification.
      *   **Negotiability:** Moderate. The *extent* of permissibility is debatable, but the distinction must be respected.

  ### III. Mandatory Theoretical Results Any Adequate EUT Must Recover or Be Consistent With
  1.  **Probabilism as Uniquely Non-Dominated:**
      *   **Requirement:** Under any strictly proper scoring rule, non-probabilistic credence functions must be accuracy-dominated by probabilistic ones (i.e., some probabilistic function is guaranteed to be more accurate no matter the world state). Probabilistic functions should not be dominated by any other function.
      *   **Rationale:** Provides the primary accuracy-based justification for the probability axioms as a core rational requirement.
      *   **Negotiability:** None. This is the flagship result of EUT for synchronic rationality.

  2.  **Conditionalization as the Diachronic Rule:**
      *   **Requirement:** The rule for updating credences upon learning evidence *E* (with certainty) must be conditionalization (setting new credence P_{new}(X) = P_{old}(X|E)). EUT must justify this as maximizing expected accuracy from the prior perspective or via a diachronic dominance argument.
      *   **Rationale:** Conditionalization is the cornerstone of Bayesian dynamics. Failure to recover it is a major defect.
      *   **Negotiability:** Low. While alternatives exist (e.g., Jeffrey), failing to justify standard conditionalization significantly weakens EUT.

  3.  **Agreement in Dominance Cases, Legitimate Divergence Elsewhere:**
      *   **Requirement:** Different strictly proper scoring rules must agree on which credences/functions are *dominated* (ruled out as irrational). However, they *can* permissibly disagree on ranking non-dominated options (reflecting permissivism).
      *   **Rationale:** Explains the robustness of dominance arguments (like probabilism) while accommodating reasonable disagreement in non-extreme cases.
      *   **Negotiability:** Moderate. The *extent* of divergence allowed is contested, but agreement on dominance is crucial.

  ### IV. Key Tensions & Conflicts Between Requirements
  1.  **Expert Deference vs. Accuracy Dominance / Probabilism:**
      *   **Conflict:** The core dominance argument for probabilism relies on evaluating credence functions based on their *own* expected accuracy *relative to the agent's own credences* ("immodesty"). Deferring to an expert often means adopting a credence function that, *from your own prior perspective*, has lower expected accuracy than your original function (unless you already fully trusted the expert). Strict application of dominance/immodesty seems to forbid rational deference.
      *   **Resolution Attempts:** Require treating the expert's credence as *direct evidence* (changing the evidential situation, then applying conditionalization), or develop a theory of "deference as accuracy management" (e.g., "You should aim for the accuracy an expert would get"). This tension pressures the definition of "expected accuracy" (whose probability?).

  2.  **Self-Correction Cases vs. Immodesty Requirement:**
      *   **Conflict:** Immodesty (preferring your own credences as best for accuracy) is central to the justification of probabilism and conditionalization via dominance/scoring rules. However, in self-correction cases, you learn your credences *are not* good guides to accuracy. Direct application of immodesty seems to forbid downgrading your own reliability.
      *   **Resolution Attempts:** Frame the learning about your impairment as *new evidence* that changes the scoring rule itself or the link between your credences and accuracy. This requires enriching the EUT framework beyond simple credence-world matching.

  3.  **Reasonable Peer Disagreement (Permissivism) vs. Uniqueness Pressure:**
      *   **Conflict:** While different proper scoring rules *can* disagree on non-dominated options, EUT frameworks using a *single* scoring rule often produce a *unique* credence function maximizing expected accuracy relative to a prior and total evidence. This pushes towards Uniqueness. Recovering genuine permissivism requires explaining why different priors or different permissible scoring rules are legitimate starting points.
      *   **Resolution Attempts:** Ground permissivism in the choice of a permissible *scoring rule* or a permissible *prior* within a constrained set. This highlights the role of initial assumptions.

  ### V. The Heavy Lifter: Immodesty
  *   **Requirement Doing the Most Work:** **Immodesty** (the requirement that a rational agent, when evaluating credence functions by expected accuracy, must assign the highest expected accuracy *to their own current credence function*) is the linchpin.
  *   **Work it Does:**
      *   **Rules out Non-Probabilism:** Non-probabilistic functions are dominated; a probabilistic function is immodest only if it judges itself best. Therefore, only probabilistic functions can satisfy immodesty (under strict propriety).
      *   **Rules out Non-Conditionalization:** Diachronic immodesty arguments show that only conditionalizers avoid being dominated by plans that are better in expected accuracy *ex ante*.
      *   **Rules out "Alien" Functions:** Forces the evaluation of expected accuracy to be done *from the agent's own epistemic perspective* using their own credences. This blocks external "god's eye" justifications and underpins the agent-centered nature of EUT.
      *   **Creates Tensions:** As seen above, it's the source of friction with deference (why adopt someone *else's* perspective if yours is best?) and self-doubt (how can yours be best if you know it's flawed?).
  *   **Views Ruled Out:** Any view suggesting rational agents should adopt credences they themselves believe to be sub-optimal for accuracy (e.g., some simplistic externalist accounts, some forms of "truth-tracking" that ignore the agent's own evidence evaluation). Immodesty enforces a strong internalist coherence requirement within the accuracy framework.

  This specification provides the rigorous framework you demanded. The tensions, particularly around deference and self-doubt, highlight where the rubber meets the road and where different accuracy-first theorists diverge in their solutions, often by adjusting the interpretation of "expected accuracy" or the scope of immodesty. The heavy lifting of immodesty is clear. Now grab your scorecard.
