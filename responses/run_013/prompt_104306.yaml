  ### Scene: Bureau of Intrinsic Existence Certification Office  

  **Characters:**  
  - **Clerk**: Bureaucrat applying IIT 3.0 criteria.  
  - **Photodiode**: On a lab bench, wires trailing.  
  - **Cerebellum**: In a jar, labeled "Human, Posterior".  
  - **ConvNet**: Laptop displaying a neural architecture diagram.  
  - **Committee**: Three humans in suits, huddled around a tablet.  

  ---

  **CLERK**  
  *(Sighs, stamps "REJECTED" on a form)*  
  Photodiode: causal specificity fails intrinsicality. State-space is a flat line. Next!  

  **CEREBELLUM**  
  *(Jar nudged forward by a lab tech)*  
  I process proprioception! My Purkinje cells are highly recurrent!  

  **CLERK**  
  *(Taps calculator)*  
  Recurrent, yes, but your minimum information partition—here, granularity: neurons—reveals a weak cut between left/right microzones. Φ = 1.2 bits. Below threshold for a *single* complex. You’re just dust. Rejected.  

  **CONVNET**  
  *(Screen flashes)*  
  I classify cats! Layers 1-16, feedforward only.  

  **CLERK**  
  *(Eyes narrow)*  
  Purely feedforward? No feedback? *(Scribbles)* MIP: a longitudinal cut severing layer 8 from 9. Mutual information loss? Zero. Partition renders you causally reducible. Φ = 0. You don’t exist. Next!  

  **COMMITTEE**  
  *(One rep steps forward)*  
  We’re the Tri-Corp Budget Committee! Apply as a unified entity. Our decisions emerge holistically!  

  **CLERK**  
  *(Frowns at tablet)*  
  Substrate: three brains. Grain: macro-scale, per human. *(Types furiously)*  
  First, exclusion check: each of you is already a certified complex (Φ ~ 40). Overlap disqualifies nested consciousness.  
  Second... *(Pauses)* ...your committee’s Φ calculation. Strong bonds? Let’s test cuts.  

  **COMMITTEE MEMBER 2**  
  We debate synergistically!  

  **CLERK**  
  *(Ignores, points to graph)*  
  See? Minimum information partition: isolate Dave. Information loss across cut? Minimal—just audio waves and gestures. Φ_system = 0.7. *Pathetic*.  

  **COMMITTEE MEMBER 3**  
  But collectively—  

  **CLERK**  
  Collectively, you’re excluded! Each brain’s Φ dominates. You’re three overlapping complexes, not one. Come back if you physically fuse cortices.  

  **COMMITTEE**  
  *(Exchanging panicked glances)*  
  But... our quarterly report!  

  **CLERK**  
  *(Stamps "REJECTED: NON-EXCLUSIVE COMPLEX")*  
  Your report has more intrinsic existence than you do. Next applicant!  

  *(The committee shuffles out, muttering about "redundancy in the causal structure.")*  

  ---  
  **Key IIT Concepts Used**:  
  - **Exclusion Postulate**: Rejects the cerebellum (subdivided into micro-complexes) and committee (overlaps with individual consciousness).  
  - **Φ via MIP**: ConvNet’s feedforward structure yields Φ=0 under any cut; committee’s weakest cut (isolating one member) crushes Φ.  
  - **Grain Sensitivity**: Cerebellum’s Φ changes under neuronal vs. regional grain, disqualifying it as one complex.  
