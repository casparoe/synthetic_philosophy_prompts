answer: |-
  ### Exam Question (75 minutes)  
  **"The Auditor Case and the Principle of Alternative Possibilities (PAP)**  
  PAP states that an agent is morally responsible for an action only if they could have done otherwise. Frankfurt-style cases aim to refute PAP by describing scenarios where an agent is responsible for an action despite lacking alternative possibilities, due to a counterfactual intervener.  

  Consider the **Auditor Case**:  
  > Nadia must decide whether to file a truthful or falsified contamination log. Unknown to her, an engineer installed a monitoring system that models her brain activity. If the system predicts she *will* decide to file truthfully (with 90% accuracy), it intervenes to make her falsify. If it predicts she will falsify (90% accuracy), it does nothing. On this occasion, it correctly predicts her decision to falsify, does nothing, and she falsifies for her own reasons.  

  **(B)** *Variant*: The system is infallible (100% accurate) and reads a deterministic neural state that already fixes her decision.  
  **(C)** *Variant*: The system is infallible (100% accurate) but reads an indeterministic neural event that does not settle her decision.  

  **Answer the following:**  
  1. Does the original Auditor Case refute PAP? Explain why or why not, focusing on whether Nadia *could have done otherwise*.  
  2. Does the case refute *any* meaningful principle about alternatives and responsibility? If so, what?  
  3. Compare Variants B and C. What does this teach us about what a successful Frankfurt-style case requires?  

  *Ground your analysis solely in the details above. Do not appeal to standard Frankfurt objections or external literature.*"  

  ---

  ### Model Answer (750 words)  

  **1. The Original Case and PAP**  
  The original Auditor Case does **not** refute PAP as traditionally understood. PAP requires that an agent *could have done otherwise* in the actual situation. Crucially, the monitoring system fails 10% of the time: when it mispredicts or misses Nadia’s decision, no intervention occurs. This means that in the actual sequence of events—where Nadia falsifies the log—she *could have chosen otherwise*. Had she begun to decide truthfully, the system might have failed to intervene (10% chance), allowing her to file truthfully. Conversely, had she wavered, the system might have incorrectly predicted truth-telling and forced falsification. Thus, alternatives exist: Nadia retains a genuine ability to choose the truthful option, even if unlikely. PAP demands only the *possibility* of alternatives, not their high probability or ease of access. Since this possibility remains, PAP stands unchallenged here.  

  **2. What the Original Case *Does* Refute**  
  While the original case preserves the *ability* to do otherwise, it refutes the idea that responsibility requires **robust alternatives**—that is, alternatives that would have led to a different outcome under the agent’s control. When Nadia chooses to falsify, two scenarios are salient:  
  - If she *had* tried to choose truthfully, the system would *likely* (90%) force her to falsify anyway.  
  - Her actual choice to falsify is made freely (for her reasons), but the system ensures that falsification is nearly inevitable regardless of her initial inclinations.  
  This shows that Nadia is responsible for falsifying, yet her alternatives are "non-robust." Choosing otherwise would either:  
  (a) Trigger intervention (making her falsify anyway), or  
  (b) Succeed only if the system fails (a rare, non-agential fluke).  
  Thus, the case refutes the principle that **responsibility requires robust alternatives**—alternatives where the agent could *successfully and freely* choose a different action. Responsibility persists even when alternatives are fragile, mediated by external mechanisms, or statistically improbable.  

  **3. Lessons from Variants B and C**  
  **Variant B** (infallible system + deterministic state) *would* refute PAP. Here, the system is 100% reliable and reads a neural state that *necessitates* Nadia’s decision. Since the state deterministically fixes her choice to falsify, and the system would intervene to ensure falsification if she "wavered," Nadia literally *cannot* choose otherwise. Any apparent alternative (e.g., considering truth-telling) is illusory—determinism guarantees falsification. This is a classic Frankfurt setup: responsibility without alternatives.  

  **Variant C** (infallible system + indeterministic state) *fails* to refute PAP. Though the system is infallible, it reads an indeterministic neural event that *does not settle* the decision. This implies that even after the event, Nadia retains the ability to choose truthfully or falsely. The system’s infallibility means it will *always* intervene if it predicts truth-telling, but crucially, the prediction is based on an event that doesn’t determine the outcome. Thus, Nadia retains the ability to choose otherwise up to the moment of decision—if she begins choosing truthfully, the system intervenes; if not, she proceeds. Alternatives exist, so PAP holds.  

  **4. What Frankfurt Cases Can Show**  
  The comparison reveals that successful Frankfurt cases require **determinism** or **causal inevitability**. Variant B works because determinism eliminates alternatives: Nadia’s neural state makes her decision unavoidable, and the system merely "backs up" this inevitability. The original case fails because its probabilistic element preserves alternatives. Variant C fails because indeterminism preserves alternatives despite infallible prediction. Thus, Frankfurt cases can refute PAP *only* when they eliminate *all* possible paths to alternative actions—something achieved by deterministic setups (like B) but undermined by randomness (original case) or indeterminism (C). The Auditor Case’s probabilistic design is not a defect but the point: it shows that PAP survives when alternatives exist, however non-robustly. Responsibility without *robust* alternatives is possible, but responsibility without *any* alternatives requires determinism.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (A/B boundary at 16/20):  
  1. **Original case preserves PAP (4 marks)**  
     *Why?* Nadia could do otherwise (due to 10% system failure).  
     *Common miss:* Claiming PAP is refuted because the system "blocks" alternatives.  

  2. **Refutes "robust alternatives" principle (4 marks)**  
     *Why?* Responsibility persists despite alternatives being non-robust (intervention-dependent/unlikely).  
     *Common miss:* Arguing the case shows nothing new about responsibility.  

  3. **Variant B refutes PAP (3 marks)**  
     *Why?* Determinism + infallibility = no alternatives possible.  
     *Common miss:* Confusing B with standard Frankfurt cases superficially.  

  4. **Variant C preserves PAP (3 marks)**  
     *Why?* Indeterminism preserves ability despite infallible prediction.  
     *Common miss:* Assuming infallibility alone negates alternatives.  

  5. **Frankfurt cases require determinism (4 marks)**  
     *Why?* Only deterministic setups eliminate *all* alternatives (B succeeds; C/original fail).  
     *Common miss:* Treating infallibility as sufficient without determinism.  

  6. **Probabilistic design is intentional (2 marks)**  
     *Why?* It exposes PAP’s reliance on mere possibility vs. robustness of alternatives.  
     *Common miss:* Criticizing the case for "imperfection."  

  **Grading Thresholds**:  
  - **A (17–20)**: Hits all 6 points, precise terminology, integrates variants.  
  - **B (13–16)**: Misses 1–2 key points (e.g., #2 or #5) but solid on PAP/variants.  
  - **C (9–12)**: Superficial on PAP/robustness; misreads variants.  
  - **D (5–8)**: Treats case as standard Frankfurt; ignores system failure/indeterminism.  

  This tests *analysis*, not recall. Top marks require recognizing that probability saves PAP while undermining intuitive links between responsibility and control.
