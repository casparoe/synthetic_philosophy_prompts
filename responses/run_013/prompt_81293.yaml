  I need to validate their nuanced reading—they've clearly done deep homework. Their hypothesis is sharp: the "Darwinian" definition rift explains the camps. The thin/thick framing fits: Dawkins demands replicators (thick mechanism), Boyd et al. accept population dynamics (thin pattern), Sperber rejects both by denying copying. The undefined generations point is critical—it exposes how cultural selection models risk being post hoc without clear life cycles. 

  The dispute layers: 
  - **Verbal**: Yes, "Darwinian" means different things—replicators for some, selection logic for others. 
  - **Empirical**: But it's not *just* verbal; beneath lie real disagreements about fidelity (e.g., is this ritual copied or reconstructed?). Trouble is, as they note, measurement often presupposes the theory (e.g., defining "cultural traits" assumes replicators). 
  - **Explanatory**: Deeper still, goals differ. Memeticists want reduction to a single mechanism (copying errors → selection); populationists want predictive models; Sperber wants cognitive explanations for stability. 
  - **Fragmenting questions**: They're spot on—camps are answering "Is copying central?" vs "Does selection occur?" vs "Why do patterns persist?" 

  Progress wouldn't come from declaring a winner. It'd require: 
  1. **Distinguishing questions**: Explicitly separating "Does cultural change fit selection models?" (Boyd-style), "Is copying the mechanism?" (memetics), and "What causes resemblance?" (Sperber). 
  2. **New measurements**: Quantifying fidelity without assuming units (e.g., tracking micro-variation in skills). Their ecology background makes them appreciate this—it's like mark-recapture for ideas. 
  3. **Theoretical triage**: Accepting that "Darwinian" is overloaded. Maybe retire it for precise terms like "replicator dynamics" or "selectionist model." 
  4. **Explain diversity**: Shift focus to why some domains (e.g., chain emails) fit memetics while others (e.g., language) fit reconstruction. Their population lens could help here—like life tables for cultural traits. 

  Honestly, the field might not "move" to consensus because the questions are fundamentally different. But reframing could turn circular debates into parallel research programs. Their unease about undefined generations is the canary in the coal mine—until models address that, selectionist explanations will feel slippery. They should trust their instincts: this isn't just philosophy; it's about explanatory standards they know from ecology.
answer: |-
  Your reading of the field is impressively nuanced—far from naive. You've pinpointed the core tension: the dispute isn't primarily about empirical facts of cultural transmission, but about the *explanatory ambitions* bundled into the word "Darwinian." Your thin/thick distinction cuts to the heart of it, and the undefined "generations" in cultural dynamics expose a deeper problem of explanatory standards. Let me diagnose the layers of disagreement, grounded in what each camp emphasizes.

  ### The Verbal Layer: What "Darwinian" Claims
  Your thin/thick split is accurate. For Boyd, Richerson, Henrich, and Mesoudai (the "population thinkers"), "Darwinian" denotes a *formal pattern*: variation, differential fitness (transmission success), and inheritance (any causal link ensuring traits in one "generation" influence the next). They argue any system exhibiting this triad *must* evolve by selection, regardless of mechanism. Replicators aren't necessary; inheritance could be reconstructive, guided, or even logically inferred. Their goal is predictive modeling—fitting cultural change into population-genetic frameworks to forecast trends or identify selective pressures.

  For Dawkins, Blackmore, and Dennett (the "replicator essentialists"), "Darwinian" implies a *specific causal mechanism*: high-fidelity copying of discrete units (memes) with variation, where selection acts on replicator survival. Resemblance must stem from lineage-based copying, not independent reconstruction. Their goal is explanatory unification: reducing cultural change to the same algorithmic process as biology, revealing "selfish" replicators driving phenomena. 

  Sperber and the attractionists attack both. They argue resemblance is often *not* caused by copying but by shared cognitive biases reconstructing ideas from sparse cues. Calling this "Darwinian" is metaphorically stretched—it obscures the real cognitive mechanisms stabilizing culture. Their goal is psychological explanation, not fitting curves to population data.

  The philosophers' "trivial yes" camp notes that *any* system with accumulating change resembles selection abstractly. They see "Is it Darwinian?" as a category error—it conflates ontology with methodology.

  ### The Empirical Stalemate
  Beneath the verbal layer lies an empirical dispute about fidelity and reconstruction, but it's entangled with theory. Replicator advocates point to chain-letter experiments or viral videos as proof of copying. Attractionists counter with work on rumor transmission or folk tales showing systematic distortions toward cognitive attractors. Populationists model both scenarios mathematically, treating fidelity as a parameter. 

  The problem, as you suspect, is measurement independence. *What counts as a "trait"*? Memeticists presuppose discrete units; attractionists see traits as emergent from reconstruction; populationists define traits pragmatically for models. Measuring "fidelity" requires prior assumptions about what's being copied versus reconstructed. Your mark-recapture intuition is apt: in culture, we lack neutral markers to trace lineage unambiguously. Without that, empirical tests often presuppose the theory they aim to test. 

  ### The Explanatory Standards Divide
  This is where your undefined "generations" insight bites hardest. In biology, generations anchor heritability and fitness in material life cycles. In culture, generations are arbitrary modeling choices. A song's "fitness" could be measured over weeks (radio plays) or centuries (folk tradition longevity). This makes selectionist models flexible to the point of unfalsifiability *if* the goal is post-hoc explanation. 

  Here lies the deepest rift: **what counts as a satisfying explanation?**  
  - Replicatorists want *mechanistic* explanations: copying fidelity + selection.  
  - Populationists want *predictive* models: equations capturing frequency dynamics.  
  - Attractionists want *cognitive* explanations: why some ideas stabilize across minds.  
  - The "trivial yes" camp sees all as useful fictions for specific purposes.  

  The camps aren't just disagreeing—they're solving different problems. Asking "Is culture Darwinian?" forces them onto a Procrustean bed where no answer satisfies all.

  ### Diagnosis and Pathways to Progress
  This is a **three-layer dispute**:  
  1. **Verbal** (what "Darwinian" should mean),  
  2. **Empirical** (how much fidelity vs. reconstruction occurs, obscured by theory-laden measurement),  
  3. **Explanatory** (whether we seek mechanisms, predictions, or cognitive accounts).  

  Progress won't come from declaring a winner. It requires:  
  - **Distinguishing questions explicitly**. Instead of "Is it Darwinian?", ask: "Does this cultural system *require* replicator dynamics to explain stability/change, or can population models suffice without them?" or "What cognitive mechanisms make this cultural pattern heritable?"  
  - **Measuring reconstruction vs. copying without presupposing units**. Experimental paradigms tracking micro-variations in skills or narratives (e.g., toolmaking techniques, joke retellings) could quantify reconstructive biases versus high-fidelity copying, independent of grand theories. Your ecology background suggests approaches: treat cultural traits like phenotypically plastic organisms and track "offspring" variance.  
  - **Theoretical triage**. Accept that "Darwinian" is overloaded. Use precise terms: "replicator dynamics" for thick claims, "selectionist model" for thin pattern-fitting. Boyd and Sperber both acknowledge cultural change *can* be modeled selectionistically without requiring replicators.  
  - **Explain diversity, not universality**. Focus on why *some* cultural domains (e.g., chain emails) fit replicator models, while others (e.g., oral traditions) fit attraction, and others (e.g., technological patents) fit population models. Your life-table experience is relevant: define "cultural life cycles" contextually (e.g., meme lifespan on social media vs. religious rituals).  

  Will the field move? Yes, but not toward consensus. It will fragment into productive subfields once the questions are disentangled. Your unease about undefined generations is profound—it signals that selectionist models gain explanatory power only when anchored to material or cognitive constraints on "inheritance." As an ecologist, you know models need biological grounding; here, they need cognitive or historical grounding. That shift—from arguing about labels to mapping mechanisms of persistence—is where progress lies. Don’t expect resolution; expect better tools for specific puzzles. The circle won’t close, but it might spiral upward.
