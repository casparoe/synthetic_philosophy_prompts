prompt: |-
  I'm in a small reading group that's been crawling through Kripke's reading of Wittgenstein, the one where it turns out that everything I've ever actually done with the plus sign is also consistent with my having meant some deviant rule all along (quus, or whatever the group is calling it this week). The whole time I've had this nagging feeling that I've seen this movie before and it's just Goodman's grue puzzle wearing a different coat — a new rule/predicate that agrees with the old one on every case so far and only diverges out in the untested future, and suddenly nobody can say what I meant or what I should say next. A friend in the group insists they're seperate problems that only look alike, and when I press him he says something like: grue is about what confirms a hypothesis, quus is about what I meant, and a solution that works for one won't automatically work for the other. I can't tell if that's a real distinction or just a way of restating the same thing in fancier words, so I'd like you to actually do the comparison rather than gesture at it.

  So: compare Kripkenstein's rule-following paradox with the new riddle of induction (and, if it's useful, with the more general worry that finitely many instances can't pin down a rule or a theory). I don't want a survey of who said what — push the analogy until it either holds or breaks. Where exactly does the parallelism run out? Is there something in the rule-following case that grue genuinely lacks, or vice versa — something about normativity, about the difference between going on in a way that accords with what I meant and merely going on in a way that fits a pattern? And I'd like a verdict, not a both-sides ending: either they're the same problem in different clothes, in which case any solution that works for one should carry over to the other, or they come apart, in which case say what the extra ingredient is and what it costs to account for it.

  Two things I'd ask you to keep in mind while writing. First, don't lean on the two textbook examples as if they were the whole story — the kid who has only ever added small numbers and then hits a big one, the emeralds that have all been green so far. Use them to set the problem up if you want, but then give me at least one case of your own that's a bit off the beaten path (a card game whose rules nobody has ever had to invoke, a tune someone learned by ear, a lock that has only ever been opened by one key) and show what it does to the comparison. Second, if your verdict is that they're the same problem, tell me what that implies for the two most common escape routes — saying meaning is just a disposition to respond, and saying it's fixed by what the community goes on to accept — because it seems to me those escape routes are supposed to do different amounts of work depending on which problem we're actually facing, and I want to know whether that's true.
