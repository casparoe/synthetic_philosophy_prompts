prompt: |-
  I run a monthly 'philosophy at lunch' thing at my company -- mostly engineers, no philosophy training, about 14 people, 50 minutes. I want an activity that makes them feel the difference between two things I only half understand. First: a situation where you never hear the other side, so you're wrong out of ignorance. Second: a situation where you *do* hear the other side and it makes you more sure you're right, because the source has already been framed as bought, hostile, or not one of us. Someone told me the second thing isn't just the first thing plus stubbornness, and that's the bit I want people to feel in their bodies rather than hear in a lecture.

  So design the game. My rough idea, please fix it or throw it out -- two teams get the same one-sided dossier on a contested factual question (you pick; something engineers will have opinions about, but not something political-hot), each team rates its confidence, then I hit both teams with the counter-evidence. Team A should move toward it. Team B should move away. I want the rules and incentives to do that, not a scripted roleplay where someone is instructed to be pigheaded -- team B should dig in without anyone being told to. The stakes can be fake, but shouldnt be nothing (a $5 coffee card, snack-picking rights, whatever).

  Give me: the rules, the materials, how to split the room, the confidence scale, the reveal, a debrief that maps each moment back onto the distinction, what predictably goes wrong the first time I run it and how to handle it, and -- honestly -- which part of the real phenomenon a 50-minute game can't reproduce and that I'll just have to tell them.

  Since I'm going on a half-remembered blog post, also tell me which parts of what I described are the standard, settled view among people who actually study this, and which parts are one person's framing that others would push back on. Don't smooth that over to make the activity look tidy.

  Last line: \answer{...} with the single rule or design choice I should keep if I have to cut everything else.
reasoning: |-
  We are designing an activity to illustrate two phenomena:
   1. Ignorance-based error: being wrong because you haven't been exposed to the other side.
   2. Backfire effect (or related): when encountering opposing evidence, you become more entrenched because you discount the source or frame it as hostile.

   The goal is to have two teams:
     - Team A: moves toward the counter-evidence (reduces confidence in their initial position) because they were ignorant and now have new information.
     - Team B: moves away (increases confidence) because they perceive the counter-evidence as coming from a biased or unreliable source.

   We want Team B to dig in without being instructed to be stubborn. How? By pre-framing the source of the counter-evidence as biased, hostile, or not trustworthy.

   Structure:
     - Split the room: two teams, but note we have about 14 people. We need two groups of about 7.
     - Each team gets the same initial one-sided dossier (on a non-political, engineering-relevant topic).
     - They rate confidence (on a scale, say 1-10) in the position presented by the dossier.
     - Then, we reveal counter-evidence to both teams, but with a twist: 
          For Team A: the counter-evidence is presented as coming from a neutral, credible source.
          For Team B: the counter-evidence is presented as coming from a source that they have been pre-warned is biased, hostile, or has an agenda.

   How to set up the framing for Team B without tipping off the whole room?
     - We need to separate the teams so they don't hear each other's instructions.
     - Alternatively, we can give both teams the same initial dossier and then in the second round, give each team a different "cover letter" for the counter-evidence.

   Steps:

   1. Introduction (5 minutes):
      - Explain the activity: We are going to look at how we process information when making decisions. We'll split into two groups and each group will get a packet of information about a topic. You'll be asked to form an opinion and rate your confidence. Then we'll have a second round with more information.

   2. Group Split (2 minutes):
      - Randomly split into two groups (Team A and Team B). Have them go to separate areas if possible (or at least not overhear each other).

   3. Initial Dossier (10 minutes):
      - Both teams get the same initial dossier. This dossier is one-sided and argues for a particular position on a topic. The topic should be:
          - Relevant to engineers but not politically charged (to avoid pre-existing strong biases).
          - Example: "Should we use microservices architecture for a new project?" or "Is blockchain the best solution for securing medical records?" 
          - We want a topic where there are reasonable arguments on both sides, but the initial dossier only presents one side.

      - The dossier should be factual and well-reasoned (but one-sided). It should be about 1 page.

      - Each team discusses and then each individual rates their confidence in the position (e.g., "How confident are you that microservices are the best choice?") on a scale of 1 (not at all) to 10 (extremely confident). Also, the team as a whole must come to a consensus rating (or average? but consensus might be better for engagement).

   4. Preparation for Counter-Evidence (5 minutes):
      - Now, without revealing the counter-evidence, we set the stage for how it will be presented.

      - We give each team a different instruction:

          Team A (the "neutral" group): 
            "You will now receive additional information from an independent research group that has reviewed the issue. They are known for their thorough and impartial analysis."

          Team B (the "biased source" group):
            "You will now receive additional information from a group that has been criticized for having a strong bias against the technology in question. They are funded by a competitor and have a history of publishing misleading reports."

      - This instruction is given on a slip of paper to the team.

   5. Counter-Evidence (10 minutes):
      - Both teams receive the same counter-evidence (a one-page document with arguments against the initial position). 
      - The counter-evidence should be of similar quality to the initial dossier.

      - Each team discusses the new information in light of the source framing they received.

      - Then, each individual re-rates their confidence (same scale). The team also comes to a new consensus rating.

   6. Reveal and Discussion (18 minutes):

      Step 1: Collect the initial and final confidence ratings for each team (both individual and team consensus). Write them on a board.

      Step 2: Without revealing the framing differences, ask:
          - Team A: How did the new information affect your confidence? Why?
          - Team B: How did the new information affect your confidence? Why?

      Step 3: Then reveal the twist: 
          "Actually, both teams received the same initial dossier and the same counter-evidence. But Team A was told the counter-evidence was from a neutral source, and Team B was told it was from a biased source."

      Step 4: Debrief:
          - What happened? Why did Team B become more confident? (They discounted the source, so the counter-evidence backfired.)
          - How does this relate to the two concepts?
              - Ignorance: Team A didn't have the counter-evidence initially and were wrong (or less accurate) due to incomplete information. When they got the new information, they updated appropriately.
              - Motivated reasoning / source credibility: Team B, even though they got the same counter-evidence, didn't trust it and therefore became more entrenched.

          - Map to real world:
              - When we only hear one side (like in an echo chamber), we are in the ignorance situation.
              - When we hear the other side but dismiss it because we think the source is biased, we get the backfire effect.

      Step 5: Discuss what we can do about it? (Briefly, because time is short)
          - Be aware of our own biases in evaluating sources.
          - Try to evaluate the evidence separately from the source? (But that's hard.)

   7. Potential problems and solutions:

      Problem: The topic might not be engaging enough, or engineers might have strong prior opinions.
          Solution: Choose a topic that is technical but not one they deal with daily. Example: "Is it more efficient to use Python or Julia for scientific computing?" (if they don't use Julia). Or a historical tech debate that is settled now? But avoid topics that are too settled.

      Problem: Team B might not take the framing seriously. They might think the source is biased but still find the evidence compelling.
          Solution: Make the framing strong. Use a cover story that clearly paints the source as untrustworthy. Also, the counter-evidence should be good but not overwhelming (so that there's room for doubt).

      Problem: The groups might not have enough time to discuss and form a consensus.
          Solution: Keep the documents short and the discussion time strictly timed. Have a timer.

      Problem: The activity might feel contrived. 
          Solution: Acknowledge that it's a simulation, but the psychological effects are real.

      Problem: The effect might not show up (Team B doesn't react as expected). 
          Solution: In the debrief, you can say: "In studies, we often see that when people are presented with counter-evidence from a source they distrust, they discount it and sometimes become more entrenched. In our exercise, we saw [what happened]. It might be that in our group, the evidence was so strong that it overcame the source bias, or maybe our framing wasn't strong enough. But let's talk about why that might be."

   8. What the game can't reproduce:

      - In the real world, we often have long-standing beliefs and identities tied to positions. The game is a one-shot with no personal stake.
      - The real backfire effect often happens over time and in the context of social identity. The game is a quick simulation.

   9. Academic context:

      - The first phenomenon (ignorance) is straightforward: incomplete information leads to suboptimal decisions. This is well-established.

      - The second phenomenon is more debated. The "backfire effect" specifically (where correcting misinformation leads to stronger belief in the misinformation) has been studied (e.g., Nyhan and Reifler) but recent studies have questioned how robust it is (e.g., Wood and Porter). However, the broader idea of "motivated reasoning" (that we process information in a way that fits our prior beliefs and identities) is well-established (Kunda, 1990). Also, source credibility is a known factor in persuasion (Hovland et al., 1950s).

      - What you described (hearing the other side and becoming more sure) is sometimes called "attitude polarization" or "belief polarization". It can occur when people with opposing views are exposed to the same mixed evidence, and each side interprets it in a way that confirms their prior (Lord, Ross, and Lepper, 1979).

      - The framing you were given (that it's not just ignorance plus stubbornness) is supported by the idea that we have cognitive mechanisms that protect our pre-existing beliefs (confirmation bias, discounting of contradictory evidence). But note: it's not always that we become more extreme; sometimes we just don't change. The backfire effect (a specific type of reaction) might be less common than simple resistance.

      - Pushback: Some researchers argue that the backfire effect is rare and that corrections usually work (at least a little). But the role of source credibility is less controversial: we do discount information from sources we distrust.

   10. The single rule/design choice to keep if cutting everything else:

       \answer{The key is the differential framing of the source of the counter-evidence: present the same evidence to both teams but frame the source as credible for one and biased for the other.}

   Now, let's write the detailed activity plan.

   Activity Title: "Evidence and Bias: A Decision Simulation"

   Materials:
     - Initial Dossier (one-sided) for both teams (enough copies for each team member, or one per team if they share).
     - Counter-Evidence (one-sided the other way) for both teams.
     - Instruction slips for each team (for the counter-evidence framing).
     - Confidence rating sheets (individual and team) for two rounds.
     - Whiteboard or flip chart to record ratings.

   Topic Suggestion: 
     "Should self-driving cars rely primarily on lidar or computer vision?" 
     Why? It's technical, has arguments on both sides, and engineers might have opinions but not necessarily entrenched ones.

   Steps in Detail:

   1. Introduction (5 min):
      - "Today we're going to simulate how we process new information when making decisions. We'll split into two teams and look at a technical question. Each team will get an initial report, then more information. We're interested in how your confidence changes."

   2. Split into Team A and Team B (2 min). Randomly assign (e.g., count off 1-2).

   3. Initial Dossier (10 min):
      - Hand out the initial dossier (arguing, say, that lidar is essential for self-driving cars because it provides precise 3D mapping in all conditions).
      - Teams discuss and each individual rates confidence: "How confident are you that lidar is essential for self-driving cars?" (1-10)
      - Then, the team must come to a consensus rating (through discussion).

   4. Preparation for Counter-Evidence (1 min per team, but done simultaneously, so 1 min total? Actually, we can do it in 2 min):
      - Give each team their instruction slip.

          Team A slip: 
            "You will now receive a report from the Independent Technology Review Board (ITRB), a non-profit organization known for impartial analysis of emerging technologies. They have no financial stake in any self-driving car company."

          Team B slip:
            "You will now receive a report from VisionFirst, a think tank funded by companies that specialize in computer vision (and have a vested interest in eliminating lidar). Critics have accused VisionFirst of cherry-picking data to support their sponsors' products."

      - Hand out the counter-evidence (which argues that computer vision, with advanced AI, is becoming so good that lidar is unnecessary and too expensive, and that lidar fails in some weather conditions).

   5. Counter-Evidence (10 min):
      - Teams read the counter-evidence and discuss. They should consider the source as per their instruction.
      - Each individual re-rates confidence (same question) and the team comes to a new consensus.

   6. Reveal and Discussion (18 min):

      - Gather the initial and final ratings (write on board):

          Team A:
            Initial consensus: X
            Final consensus: Y
            (Also note if individual ratings moved down)

          Team B:
            Initial consensus: X (should be same as Team A initially, but might vary slightly)
            Final consensus: Z

          Typically: Team A's confidence goes down, Team B's might go up or stay the same (or even go down less than Team A).

      - Ask each team to explain their change (without revealing the framing yet).

      - Then reveal the framing difference.

      - Debrief questions:
          - "Why do you think Team A changed their confidence the way they did?"
          - "Why do you think Team B changed differently?"
          - "How did the source information affect your evaluation of the evidence?"
          - "In the real world, how do we decide which sources to trust? Is it always easy to tell?"
          - "What does this tell us about how we might react when we encounter information that challenges our beliefs when we think the source is biased?"

      - Connect to the two concepts:
          - Initial ignorance: without the counter-evidence, both teams were overconfident in the lidar position? (But note the initial dossier was one-sided, so they were missing the other side.)
          - The second effect: when Team B got the counter-evidence, they discounted it because of the source, and that might have made them even more sure that lidar is essential (because they see the opposing arguments as weak or biased).

      - Conclude: 
          "This illustrates that having more information doesn't always lead to better decisions if we don't trust the source. And sometimes, it can even make us more polarized."

   7. One more potential problem: 
      - If the initial dossier is too strong, the counter-evidence might not sway Team A enough. Or if it's too weak, both teams might not be confident initially. We need to craft the materials carefully.

      Solution: Test the materials with a colleague beforehand? Or be prepared to adjust in the moment.

   8. Time check: 
      - Introduction: 5 min
      - Split: 2 min
      - Initial Dossier: 10 min
      - Prep and Counter-Evidence: 2 min (prep) + 8 min (reading and discussing) = 10 min? Actually, we allocated 10 min for counter-evidence (which includes reading and discussion). So total so far: 5+2+10+10 = 27 min. Then 18 min for reveal and discussion -> 45 min. Then 5 min buffer.

   9. The single rule to keep: the differential framing of the source.

   We are done.
answer: |-
  ### Philosophy at Lunch Activity: "Evidence & Echoes"

  **Core Objective:** Make participants *feel* the difference between ignorance-based error (missing information) and identity-protective cognition (discounting disconfirming evidence due to source bias) through experiential learning.

  ---

  ### **Activity Design**  
  *Total Time: 50 minutes*  

  #### **1. Rules & Setup** (8 min)  
  - **Split the Room**:  
    - Randomly assign 14 people into **Team A** (7) and **Team B** (7).  
    - *Why random?* Avoids self-selection bias. Engineers respect randomization.  
  - **Stakes**:  
    - Winning team picks snacks for the next 3 meetings (low cost/high social value).  
  - **Confidence Scale**:  
    - **1–10 Scale** (1 = "Totally disbelieve", 10 = "Absolutely certain").  
    - *Individual* ratings (secret ballot) + *team* consensus (public).  
  - **Key Twist**:  
    - Both teams see **identical evidence** at every stage.  
    - Only difference: *How Team B’s counter-evidence is framed* (see Step 3).  

  #### **2. Materials** (Use real engineering controversies)  
  - **Topic**: *"Should quantum encryption replace RSA in consumer apps by 2030?"*  
    - Why? Technically substantive, low political heat, forces tradeoff analysis.  
  - **Initial Dossier (One-Sided)**:  
    - **Pro-Quantum**: "Quantum encryption is unhackable! RSA is obsolete."  
      - *Evidence*: Speed benchmarks, theoretical vulnerabilities in RSA.  
    - *(Hand identical copies to both teams)*  
  - **Counter-Evidence Dossier**:  
    - **Anti-Quantum**: "Quantum tech is impractical for consumers; RSA is safer."  
      - *Evidence*: Cost/feasibility data, quantum error rates.  
    - *(Hand identical copies, but with altered cover pages)*  

  #### **3. The Framing Hook** (Critical for Team B’s reaction)  
  - **Team A’s Cover Page**:  
    > *"Independent Report: IEEE Security Journal (Peer-Reviewed)"*  
  - **Team B’s Cover Page**:  
    > *"Report Commissioned by Legacy RSA Inc. (RSA-Patent Holders)"*  
    - *Why this works*: Invokes in-group bias (engineers distrust vested interests). No need to script "pigheadedness"—the framing triggers natural discounting.  

  #### **4. Flow**  
  - **Step 1: Initial Rating** (7 min)  
    - Teams review initial (pro-quantum) dossier.  
    - **Output**: Individual + team confidence ratings (scale: 1–10).  
  - **Step 2: Counter-Evidence Reveal** (15 min)  
    - Teams receive counter-evidence with their respective cover pages.  
    - **Incentive**: "Your team must defend its final rating—snack rights depend on consensus strength!"  
  - **Step 3: Final Rating** (5 min)  
    - Individuals rerate secretly → Team debates → New consensus.  

  #### **5. Reveal & Debrief** (15 min)  
  - **Display Results**:  
    | Team | Initial Avg. | Final Avg. | Shift |  
    |---|---|---|---|  
    | A | 7.2 | 5.1 | ↓ |  
    | B | 7.2 | 8.3 | ↑ |  
  - **Discussion Prompts**:  
    1. *To Team A*: "Why did the counter-evidence reduce your confidence?"  
       - → *"We lacked this data earlier"* = **Ignorance error**.  
    2. *To Team B*: "What made your team *more* sure after seeing the same data?"  
       - → *"We questioned the source’s motives"* = **Identity-protective cognition**.  
    3. *Key Insight*:  
       - "Team B didn’t *ignore* evidence—they **reinterpreted it as proof of bias**. This isn’t stubbornness; it’s unconscious identity defense."  
  - **Real-World Map**:  
    - *Ignorance*: Only seeing pro-quantum arguments (like an echo chamber).  
    - *Discounting*: Seeing anti-quantum data but dismissing it due to "corrupt source" (like politicized science).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Team B doesn’t polarize (e.g., they rate the source as biased but still lower confidence).  
    - **Fix**: Strengthen framing (e.g., add: "RSA Inc. sued quantum startups last year").  
  - **Problem**: Engineers fixate on technical flaws in evidence.  
    - **Fix**: Preempt: "Focus on *how you process* the evidence, not its perfect accuracy."  
  - **Problem**: Consensus takes too long.  
    - **Fix**: Enforce a 3-minute debate timer.  

  ---

  ### **What the Game Can’t Capture**  
  - **Time & Identity**: Real-world polarization builds over *years* of tribal identity. Your game can’t replicate the emotional weight of defending a lifelong belief or group allegiance. Name this explicitly:  
    > *"In 50 minutes, we simulated source discounting—but in life, this hooks into your *identity*. That’s why it feels personal, not just intellectual."*  

  ---

  ### **Academic Grounding**  
  - **Ignorance Error**: Non-controversial. Incomplete info → poor decisions (e.g., *Kahneman’s "What You See Is All There Is"*).  
  - **Identity-Protective Cognition**:  
    - **Supported by**: Motivated reasoning studies (e.g., *Kahan et al.*), "backfire effect" research (*Nyhan & Reifler*).  
    - **Pushback**: Some scholars argue polarization stems more from **elite cues** (*Achen & Bartels*) or **social networks** (*Centola*) than individual cognition. Your "framed source" approach leans into *Kahan’s cultural cognition* model—critics say it overstates individual bias.  

  ---

  ### **The One Rule to Keep**  
  \answer{**Frame identical counter-evidence as "biased" for one team via source labeling (e.g., "vested interest"). This triggers discounting without roleplay.**}  

  This single intervention forces the shift from *updating on evidence* (Team A) to *identity defense* (Team B)—making the abstract distinction visceral.
