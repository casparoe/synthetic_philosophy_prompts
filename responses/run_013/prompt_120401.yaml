  The verdict: the episode threatens KK more than luminosity. Luminosity might remain intact if restricted to basic states, but KK requires accurate higher-order knowledge, which confabulation undermines. To change this verdict, empirical evidence showing reliable access to causal processes or an argument that KK isn’t about empirical cognition would be needed.

