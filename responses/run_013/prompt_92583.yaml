answer: |-
  ### Scenario (250 words)
  **Substrate-level description:** A sealed, hexagonal enclosure contains thousands of identical ferromagnetic balls on a low-friction surface. Walls are embedded with electromagnets whose polarity is controlled by an external dial (e.g., temperature sensor). Micro-dynamics are governed solely by Newtonian collisions and electromagnetic forces from the walls. A precise initial state (ball positions/velocities) evolves deterministically: balls collide, clump, or separate based on momentum transfer and wall-field interactions. All trajectories are fully micro-explainable via pairwise forces.  

  **Pattern-level description:** A stable, roughly circular cluster of ~500 balls—a "symmball"—emerges. Its geometric center reliably covaries with the external dial setting (e.g., dial position 5.0 ± 0.1 always yields cluster center at coordinates (x,y) ± δ). An engineer installs a mechanical arm outside the enclosure, programmed to nudge the dial whenever the symmball’s center drifts beyond a tolerance zone. This creates a feedback loop: dial changes alter wall fields, repositioning the cluster; cluster position triggers arm motions that adjust the dial. The symmball is multiply realizable—different subsets of balls can form it, and its position is stable across micro-perturbations (e.g., swapping two balls).  

  Both levels predict identical ball motions and dial-arm interactions. Counterfactually, however: the substrate description requires *exact* micro-configurations (e.g., "Had ball #742 not been at (p,q) at t=3s, outcome Z would differ"), while the pattern description holds across realizations (e.g., "Had *any* cluster formed near (x,y), the arm would not have moved").  

  ---

  ### The Case for Symbolic Pushing (200 words)  
  An interventionist argues the symmball causally "shoves" the balls. Intervening on the cluster’s position (via the dial) reliably changes ball trajectories: set dial=6.0, and balls collectively migrate right. Fixing the exact micro-state (positions/velocities) while "changing" the symmball’s position is impossible—it violates supervenience. But interventions on the *cluster-as-target* (e.g., dial adjustments targeting center (x,y)) reliably produce changes in both ball motions *and* the arm’s response, even when micro-states differ. The symmball tracks an external variable (dial setting) and "drives" the arm: if the cluster drifts left, the arm moves right to correct the dial. This covariance is exploitable—an engineer uses the symmball as a control signal, ignoring micro-details. The pattern’s stability across micro-realizations shows its causal autonomy: the feedback loop depends on the cluster’s *position*, not its constituent balls. Thus, the symmball is a difference-maker.  

  ---

  ### The Case for Substrate-Only Pushing (200 words)  
  The exclusionist insists only microphysics does causal work. Every ball’s motion is fully determined by collisions and electromagnetic forces from the walls, with no causal "gaps". The symmball is merely a supervenient pattern: its "position" reduces to the vector sum of micro-forces. Changing the symmball without changing the micro-dynamics is metaphysically impossible—thus, it lacks independent causal power. The arm’s motion is entirely fixed by wall-field changes (themselves caused by the dial), which directly impact individual balls. The feedback loop only *appears* pattern-driven: in reality, dial adjustments alter electromagnetic forces, which reconfigure ball collisions, which collectively shift the cluster’s center, which—via the same micro-forces—triggers the arm. But this is just micro-causation "all the way down". The symmball’s stability is epiphenomenal: it emerges from, but does not add to, the substrate’s causal sufficiency. Invoking it as a cause violates causal closure and invites overdetermination.  

  ---

  ### Verdict (150 words)  
  I hold that **both levels are causally relevant**, but the dispute is substantive, not verbal. The substrate is causally *sufficient* for motion, but the pattern is causally *salient* for control and information. The symmball’s multiply realizable, counterfactual-supporting role—as a detectable state that guides interventions—cannot be reduced to micro-details without explanatory loss. The engineer’s feedback loop depends on the cluster’s position as a unified variable; micro-specifications are irrelevant to its function. Conversely, substrate explanations fail to capture how the system robustly tracks external variables across perturbations. This mirrors debates about computational states: while silicon atoms "do the work", software explanations aren’t eliminable. The exclusion argument mistakenly conflates sufficiency with exclusivity—patterns can be difference-makers without violating physical closure.  

  ---

  ### The Load-Bearing Feature (150 words)  
  The **engineer’s feedback mechanism**—specifically, the arm programmed to respond *only* to the symmball’s center coordinates—is load-bearing. It makes pattern-level causation tangible: the arm’s design *treats* the cluster as a causal unit, indifferent to micro-realizations. If removed (e.g., the arm reacts to individual ball positions instead), the pattern-level counterfactuals collapse. For instance, if the arm requires ball #501 at location (x,y), interventions targeting "the cluster" fail when different balls form it. But in the actual design, varying the symmball’s composition (e.g., via minor collisions that swap constituent balls) doesn’t alter the arm’s response, proving causal relevance hinges on the geometric pattern, not substrate details.  

  ---

  ### Attack Surface (150 words)  
  A substrate-only defender would argue: **"The electromagnets and arm sensors react to aggregate micro-states (e.g., net magnetic flux), not patterns. The 'symmball' is just a shorthand for these sums."** This attack fails because the system is designed for multiple realizability. Sensors detect the cluster’s *center*, which remains stable even when flux distributions vary (e.g., a hollow vs. dense cluster at (x,y) produces identical center coordinates but different flux maps). The arm triggers based on optical center-tracking, not electromagnetic readings. Thus, the pattern is tracked geometrically, independent of underlying physics. If sensors only measured flux, the symmball would reduce to micro-aggregates—but here, it doesn’t.  

  ---

  **Digital Computer Comparison:** This works similarly to a computer executing a program (e.g., "PRINT X"), where hardware (substrate) and software (pattern) align. It shows that causal exclusion arguments, if accepted, would implausibly eliminate all higher-level causation in computing or engineering. The symmball is a physical analog of a software variable—indispensable for explanation, yet ontologically grounded in micro-dynamics.
