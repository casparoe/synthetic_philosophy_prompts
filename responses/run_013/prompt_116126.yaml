      - Each trader gets a private signal: a card that is either Red or Blue. The signal is informative: if state A, then Red is more likely (but not perfectly); similarly for state B and Blue.
      - Traders are given an initial allocation: some have the asset, some don't. They trade in a double auction with real money.
      - What it would make them feel: The value of the asset depends on the state. A trader who gets a Red signal will update to a higher belief that state A, so they value the asset more. But if they try to buy, they reveal they have a positive signal, which might cause the seller to back out? However, in a double auction, offers are public and the reasoning chain might be too complex for the first round.
      - Failure: The double auction might be too noisy and participants might trade for reasons other than information (e.g., risk aversion, or just to trade). Also, common knowledge of rationality is hard to establish.

