     So trade only occurs if the seller has a Blue signal and sets an ask <= $5 and the buyer has a Red signal and is willing to pay that ask. But if the buyer has a Blue signal, they won't pay more than $3. 

     In equilibrium, the seller with a Blue signal will set an ask of $5. Then:
          - If the buyer has a Red signal, they are indifferent and might not trade (or might trade with 50% probability?).
          - If the buyer has a Blue signal, they won't trade.

     So trade might occur with less than 100% probability.

     But the no-trade theorem says no trade at all.

     This is not matching.

     I recall that the no-trade theorem requires common knowledge of rationality and that the traders' information is only about the state and not about their own preferences. In this setup, trade can occur because the traders have different information and therefore different valuations, and the price can aggregate the information.

     After re-examining, I think the no-trade theorem is often stated for settings where there is no aggregate uncertainty, or for settings where the initial allocation is already conditionally Pareto efficient. In our case, the initial allocation is not conditionally efficient because the signals are private.

     Given the time, I decide to change the asset to have a common value that is the same for everyone, and assume that the only reason to trade is if they have different information. But if they have different information, then they will have different valuations, and trade may seem attractive. However, the act of trading reveals information and removes the difference.

     How about we use the following example from the literature: two traders, one has the asset, the other does not. They both get private signals. The value of the asset is the same for both. They consider trading at a price p. Should they trade? 

     The buyer will only buy if E[V | buyer's signal] > p.
     The seller will only sell if E[V | seller's signal] < p.

     But after the trade is proposed, both update: the buyer knows that the seller is willing to sell, which means the seller's signal is bad. The seller knows that the buyer is willing to buy, which means the buyer's signal is good. Then they update their valuations:

          Buyer's new valuation: E[V | buyer's signal and seller's signal is bad] 
          Seller's new valuation: E[V | seller's signal and buyer's signal is good]

     And it turns out that after this update, the buyer's valuation is less than p and the seller's valuation is greater than p, so they don't trade.

     This is the key! 

     So let's calculate with our numbers:

          Signals: independent conditional on the state.

          Suppose the buyer has a Red signal (good) and the seller has a Blue signal (bad).

          Buyer's valuation initially: $7.
          Seller's valuation initially: $3.

          They might agree on a price of $5.

          But then the buyer thinks: "The seller is willing to sell at $5. Why? Because they have a signal that is bad. So I, the buyer, now have two signals: my own Red and the seller's Blue. So I update to $5 as above." 
          Similarly, the seller thinks: "The buyer is willing to buy at $5. Why? Because they have a good signal. So I, the seller, now have two signals: my own Blue and the buyer's Red. So I update to $5." 

          Then the buyer values the asset at $5, so they are not willing to pay $5 (or they are indifferent). 
          The seller values the asset at $5, so they are not willing to sell for $5 (or they are indifferent). 

          So the trade falls through.

     Therefore, even though it seemed like there were gains from trade, after accounting for the information revealed by the willingness to trade, the gains disappear.

     So in the pairwise sealed-bid, we can hope that no trade occurs.

     Now, how to stage this in a sealed-bid pairwise setting:

          In each pair:
            - The seller privately sets an ask price.
            - The buyer privately sets a bid price.
            - If bid >= ask, trade happens at (bid+ask)/2.
            - Then both learn the other's signal and the state.

          But catch: when they set their prices, they don't know the other's signal. But they should anticipate that if trade happens, it will be because the buyer's bid >= seller's ask, and that event itself conveys information. However, in a sealed-bid, they don't update until after trade. So they might trade at a price that later they regret.

          Example: they trade at $5. Then they learn each other's signal and realize the asset is worth $5. So they are indifferent and have wasted effort.

          But the no-trade theorem says they should not trade in the first place.

          How to build the updating into their decision? They should realize that if they are about to trade, then they should update based on the fact that the other is willing to trade, and then they wouldn't want to trade.

          This is a hierarchy: 
              Level 0: I have my signal, so I have a valuation.
              Level 1: I know the other has a signal and will only trade if it's in their interest, so if they are willing to trade, it means they have a signal that makes the trade bad for me.

          This is what we need to trigger.

     To make this happen, we can have a discussion before they submit their bids and asks. We can ask them to think about what they can infer if the other person is willing to trade. But then they might not submit any bid/ask.

     We hope that in the pairwise sealed-bid, they will set such that bid < ask always.

     For example, a buyer with Red signal might bid $7 initially, but then think: "If the seller is willing to accept, it means they have a Blue signal, so then the asset is only worth $5 to me, so I should not pay more than $5." So they bid $5. 
     A seller with Blue signal might ask $3 initially, but then think: "If the buyer is willing to pay, it means they have a Red signal, so the asset is worth $5 to me, so I should ask at least $5."所以他们设 ask=$5.
     Then the bid might be $5 and ask=$5, so trade happens at $5. But then they are indifferent.

     To prevent trade, we can assume they only trade if strictly better off. So if the buyer is only willing to pay strictly less than $5, and the seller asks strictly more than $5, then no trade.

     So let's assume:
          A buyer will only submit a bid if they think the asset is worth strictly more than the price they pay.
          A seller will only submit an ask if they think the asset is worth strictly less than the price they receive.

     In the example, after level-1 reasoning:
          Buyer with Red signal: values at $5 (after inferring that if the trade happens the seller must have Blue), so they would only pay strictly less than $5.所以他们出价 bid <$5.
          Seller with Blue signal: values at $5, so they would only accept strictly more than $5.所以他们要价 ask >$5.
          So bid <$5 and ask >$5, so bid < ask -> no trade.

     Similarly, if both have the same signal, then after inference, they both know both signals, and the valuation is either $7 or $3, and there is no room for trade.

     Therefore, in every case, no trade.

     So we can use this.

     Now, for the double auction, it becomes more complex because there are many offers. But the idea is that any offer to sell at a low price reveals that the seller has a bad signal, and then the market price should adjust to the average of all signals. In particular, in a double auction with many traders, the market price should be fully revealing, and then no one would trade because they are all at the same valuation.

     Given the time, I will design the activity as follows:

     Round 1: Pairwise sealed-bid trading.
          - 9 pairs: in each pair, one seller (has asset) and one buyer (has $5).
          - Each receives a private signal (Red or Blue) by drawing a card from a deck that has 14 Red and 14 Blue (so that it's 70% accurate? Wait, we need to fix the state. Here's how:)

     How to determine the state and signals authentically:

          We need a deck of state cards and signal cards.

          The instructor decides the state by flipping a coin. Say state A or B.

          For state A: we want P(Red|A)=0.7. So out of 18 signal cards for state A: 13 Red and 5 Blue? (13/18≈0.72) or 12 Red and 6 Blue (12/18=0.67). Let's use 12 Red and 6 Blue for state A, and for state B: 6 Red and 12 Blue.

          But we have 18 students: 9 signals for sellers, 9 for buyers. So we need 18 signals. 

          We'll prepare two envelopes for the state:
            Envelope A: contains 12 Red and 6 Blue.
            Envelope B: contains 6 Red and 12 Blue.

          We publicly flip a coin to choose the state. Then we shuffle the corresponding envelope and distribute one card to each student.

     Materials and setup for Round 1 ( pairwise ):

          - A coin.
          - Two envelopes: one for state A (12 Red, 6 Blue) and one for state B (6 Red, 12 Blue).
          - 18 cards: note that we only have 18 students, so we need exactly 18 cards in the chosen envelope.

          - We assign half as sellers and half as buyers. Randomly.

          - Each student gets one card (which is either Red or Blue) as their private signal.

          - Each pair: one seller and one buyer.

          - Each seller writes an ask price on a slip of paper.
          - Each buyer writes a bid price on a slip of paper.
          - They hand to the instructor or a runner.

          - For each pair, if bid >= ask, then trade happens at price = (bid+ask)/2.
          - If not, no trade.

          - Then we reveal the state. 
          - Payoffs:
               Seller: if no trade, then the asset pays $10 if state A, $0 if state B.
                       if trade, they get the trade price.
               Buyer: if no trade, they have $5.
                       if trade, they have $5 minus the trade price plus the asset value ($10 if A, $0 if B).

          - But note: the asset value is the same for both.

     We hope that in most pairs, bid<ask.

     Round 2: Double auction.
          - 9 sellers and 9 buyers.
          - Each seller can submit an ask (publicly on the whiteboard) and each buyer a bid.
          - We match the highest bid with the lowest ask if bid>=ask, then the next, etc.
          - We do this for up to 9 trades.
          - Payoffs as above.

     We hope that no trade occurs.

     Round 3: We change one thing: we give one seller a liquidity shock. We tell that seller: "You must sell at any price, because you need the cash. If you don't sell, you will lose $2." So they will set a very low ask (e.g., $0.01). Then trade may occur because buyers might be willing to buy at a low price even if it means the seller has a very bad signal. But then the buyer who buys from this seller will get a very good price, and the information from the seller's ask is confounded by the liquidity need.

     Now the design in detail.

     Due to the complexity and the time, I will provide the design for the pairwise round and then the double auction round, and hope that in the pairwise round they experience no trade.

     If in the pairwise round they do trade, we can discuss in the debrief why, in the sealed-bid format, they didn't account for the information from the trade itself. Then we can build the common knowledge in the discussion and try the double auction.

     Given the constraints, here is the design.
answer: |-
  ### Design Notes: Candidate Mechanics  
  1. **Pairwise Sealed-Bid Trading**  
     - *Feel*: Directly exposes how an offer reveals private signals; highlights bilateral rationality.  
     - *Fail*: Overly simplistic; misses market dynamics like auctions.  
  2. **Continuous Double Auction**  
     - *Feel*: Authentic market tension; shows aggregation of signals.  
     - *Fail*: Noise from multiple offers may obscure informational content.  
  3. **Betting Market with Chips**  
     - *Feel*: Emphasizes common priors; intuitive payoffs.  
     - *Fail*: Less like trade; may not trigger "why trade?" intuition.  
  4. **Role-Play with Public Bids**  
     - *Feel*: Forces explicit reasoning about others’ rationality.  
     - *Fail*: Artificial; loses emergent behavior.  
  5. **Forced Liquidity Shocks**  
     - *Feel*: Clarifies non-informational motives for trade.  
     - *Fail*: Prematurely distracts from core theorem.  
  6. **Two-State Asset with Card Signals**  
     - *Feel*: Tangible link between signals and payoffs; scalable.  
     - *Fail*: Risk neutrality may weaken no-trade prediction.  

  **Chosen Mechanic: Two-State Asset with Card Signals in Double Auction**  
  Combines realism with clarity. Double auction makes informational content of bids publicly visible, while card signals ensure privacy. Liquidity shocks (Round 3) cleanly break the theorem.  

  ---

  ### Runnable Design  
  **Materials & Setup**  
  - **Cards**: Two pre-prepared envelopes:  
    - *Envelope A* (State A): 12 red cards, 6 blue cards.  
    - *Envelope B* (State B): 6 red cards, 12 blue cards.  
  - **Money**: $20 in $0.50 bills (40 bills).  
  - **Payoff Table** (print 18 copies):  

  | Your Role | If State A | If State B |  
  |-----------|------------|------------|  
  | Seller    | Asset worth $10 | Asset worth $0 |  
  | Buyer     | $5 cash + asset = $5 + $10 → $15 | $5 cash + asset = $5 + $0 → $5 |  

  - **Setup**:  
    1. Move tables to form a trading pit. Whiteboard lists bids/asks.  
    2. Flip a coin publicly: **Heads → State A, Tails → State B** (instructor knows state but doesn’t reveal).  
    3. Shuffle the chosen envelope (A or B), privately deal one card to each student. Cards are concealed; students note color but don’t reveal.  
    4. Assign roles: 9 sellers (hold 1 asset certificate), 9 buyers (hold $5 cash).  
    5. Payoffs use real money (e.g., trade profit = $0.50 per $1 of value).  

  **Roles, Rules, Payoffs**  
  - **Asset**: Pays $10 if State A, $0 if State B. Prior probability: 50% each.  
  - **Signals**:  
    - Red card: 70% likely in State A, 30% in State B.  
    - Blue card: 70% likely in State B, 30% in State A.  
  - **Trading Rules (Double Auction)**:  
    - Buyers submit **bids** (max price to buy), sellers submit **asks** (min price to sell).  
    - Write bids/asks on whiteboard anonymously (use numbered slips to protect identity).  
    - Match highest bid with lowest ask; if bid ≥ ask, trade at midpoint. Repeat until no matches.  
    - Trade is binding.  
  - **Payoffs Example**:  
    - Seller trades asset for $4 → keeps $4.  
    - Buyer buys asset for $4 → payoff = ($5 - $4) + asset value ($10 or $0).  

  **Timeline (90 Minutes)**  
  - **0:00–0:10**: Intro & rules. *"You’re traders. This asset pays $10 in State A, $0 in State B. Cards hint at the state. Trade if you think it’s profitable."*  
  - **0:10–0:25**: **Round 1 (No Trade Expected)**.  
    - Deal cards, assign roles.  
    - Run double auction (15 min).  
    - *Instructor cues*: "Before bidding, ask: Why would a rational seller offer this price? What might their card be?"  
  - **0:25–0:35**: Debrief Round 1. *"Did trades happen? Why or why not? What did an ask price reveal?"*  
  - **0:35–0:50**: **Round 2 (Trade Expected)**.  
    - Same as Round 1, but **one random seller gets liquidity shock**: "You lose $2 if you don’t sell."  
    - *Change*: Breaks "no exogenous motives" assumption.  
  - **0:50–1:00**: **Round 3 (Two-Sided Uncertainty)**.  
    - Two sellers have liquidity shocks (sell for any price).  
    - Buyers know some sellers are "desperate" (not necessarily informed).  
  - **1:00–1:25**: Debrief.  
    - Map events to concepts:  
      - *Round 1*: Shared prior → "Why was $5 the baseline?"  
      - No trade → "Your offer’s price revealed your card. Accepting it meant the other thought you were wrong!"  
      - Common knowledge → "You knew others are rational, and they knew you knew."  
      - *Round 2*: Liquidity breaks "pure information" trading.  
      - *Round 3*: Buyers price "mixed motives" of sellers.  
    - **At 1:15**: Name theorem/authors.  
  - **1:25–1:30**: Handout rules/story (no theory).  

  **Facilitator Cue Card**  
  1. **Before Round 1 bids**: *"Think aloud: If a seller asks $3, what card might they hold? Would you accept if you knew?"*  
  2. **If no trade in Round 1**: *"Why did no one bid? What did you fear the other knew?"*  
  3. **Round 2 liquidity reveal**: *"This seller must sell. How does that change what prices mean?"*  

  **Predictable Problems & Handling**  
  - **Problem: Enthusiastic Trade in Round 1**  
    - *Cause*: Students miss informational content of bids.  
    - *Handling*: Pause auction. Ask: "Sellers, if you bid low, what card do you reveal? Buyers, if you accept, why might you regret it?"  
  - **Problem: No Trade Due to Confusion**  
    - *Cause*: Misunderstanding payoffs.  
    - *Handling*: Check: "Sellers, what’s your minimum ask? Buyers, your max bid?" If irrational, restart with training round.  
  - **Diagnostic**: In Round 1, if trades occur, ask traders: "Why did you ignore the signal your opponent’s price revealed?" If silence, it’s confusion.  

  **What the Activity Cannot Reproduce**  
  1. **Unbounded Rationality**: Students reason 1–2 levels deep ("I know they know I’m rational"), not infinite regress. *Cost*: Debrief must explain "common knowledge" as an idealization.  
  2. **Equilibrium Play**: Real markets reach equilibrium iteratively; this is one-shot. *Cost*: Instructor notes that repeated trade would converge to no-trade.  
  3. **Risk Aversion**: Payoffs are linear (expected value). *Cost*: Theorem’s risk-aversion nuance is discussed post-activity.  

  ---  
  **Final Notes**  
  - Use exact numbers: $10/$0 payoffs, $5 cash, 70% signal accuracy.  
  - In Round 1, efficient allocation = sellers hold asset ($5 EV), buyers hold cash ($5).  
  - Liquidity shock in Round 2 tests "no exogenous motives" by contrast.  
  - Whiteboard bidding makes informational revelation public and undeniable.
