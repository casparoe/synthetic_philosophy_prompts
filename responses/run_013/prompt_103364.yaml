  I should consider the narrative. The poem will follow one roommate's realization that their ratings are on different scales. For example, one might be optimistic, rating minor joys highly, while the other is pessimistic, reserving high scores for rare events. The spreadsheet's average becomes meaningless because the numbers aren't comparable. The envoi should culminate in the explicit realization, packing three end-words into one line to emphasize the strain.

  Language and tone need to be poetic yet precise. Avoiding academic jargon, using concrete images: coffee stains, laughter, silence. Each stanza can explore different days or interactions, showing how the same event affects each differently. The rotation of end-words will inherently create tension, as some combinations might feel forced, illustrating the difficulty of comparison.

  For the envoi, the middle line must include three words. A phrase like "that same bright number we'd call better or worse" could work, incorporating "same," "better," "worse." This line should feel cramped, highlighting the artificial squeeze of diverse experiences into one metric.

  Potential pitfalls: Making the poem too abstract or didactic. Need to anchor emotions in specific scenes—washing dishes, late-night talks. Ensure each stanza advances the narrative while adhering to the end-word rotation. Also, check that the transition from confusion to realization feels organic, ending with the envoi as the moment of clarity.

