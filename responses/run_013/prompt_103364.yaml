  First, I need to ensure I understand the sestina structure. A sestina has six stanzas of six lines each, followed by a three-line envoi. The end-words rotate in a specific pattern: 6-1-5-2-4-3 for the first five stanzas, then a different order for the sixth. The envoi includes all six words, with three in the middle line. The end-words provided are "more," "less," "same," "better," "worse," "enough."

