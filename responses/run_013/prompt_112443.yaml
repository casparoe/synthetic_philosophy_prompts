prompt: |-
  So I'm a novelist, I'm about three quarters through a book that has a teleporter in it -- the Parfit-style one, scans you, destroys the original, prints you out at the other end -- and I keep rewriting the scene where my protagonist steps in because I can't decide whether the book should treat her as surviving the trip or dying in it. I've read the Parfit and the surrounding stuff, so I definately don't need the tour. What I want is a number, and I want the guts of it.

  Give me your credence in this proposition: that what matters in survival is psychological continuity, and that continuity is preserved in the teletransporter case even though personal identity, strictly so called, is not. That's the claim I'm circling.

  Then decompose it. I want the sub-questions your number rests on, a rough probability for each, and how they combine:

  - that personal identity is a further fact over and above psychological continuity, versus a reductionist picture where there's nothing extra to lose
  - that what matters can even come apart from identity at all, or whether that whole distinction is just verbal / confused
  - that the branching case -- two copies made, both with an equal claim -- really does force identity apart from what matters, which I think is Parfit's main lever
  - that my ordinary first-person concern for my future self is tracking something real rather than just a brute animal instinct
  - and whatever else you think belongs in there.

  My gut number is like 0.3 but I don't trust it, so tell me where I'm probably wrong.

  Now here's the wrinkle that's actually eating at me, because it's going straight into the book: my teleporter doesn't kill the original right away. It drops the original into a coma and keeps the body alive for a week. If the copy dies within that week, the original wakes up. So for a week there are two of her, and only one of them is guaranteed to carry on. Does that change your credence? Specifically -- does the fact that the original is still there, still alive, change whether what matters has been preserved for the copy, or is the original just a spare body at that point, an old draft of a person?

  Last thing, and this matters alot to me: which term in your decomposition is doing the most work, ie if you flipped it the number moves the most? And what single argument or consideration would take you from wherever you land up to something like 0.9?
reasoning: |-
