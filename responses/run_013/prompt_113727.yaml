answer: |-
  ## The Raven Hypothesis

  All ravens are black. So the watcher stands
  where the tall pines meet the marsh's edge,
  counting the dark shapes against the clouds.
  This one glides low, a silhouette defined,
  its feathers catching no light but the dull
  sheen of obsidian, pure absence of hue.
  This counts. It is a raven, and it is black.
  Each such sighting builds the case, brick by brick:
  a thing belonging to the named class shows
  the property ascribed to the whole kind.
  The law gains strength from every solid bird
  observed fulfilling its expected shade.
  The morning passes, numbers slowly rise.
  The watcher stops for lunch beside the track.

  The watcher stops for lunch beside the track.
  One apple waits within the worn cloth sack:
  a sphere of waxen green, cool to the touch,
  one side flushed faintly where the sun had struck,
  the stem still knotted, brown as sparrow's claw.
  No raven this. No blackness touches it.
  All that are not black are not ravens. So
  the logic states. Equivalent demands
  equivalent support. This apple, green,
  belongs within the class of non-black things,
  and shows itself devoid of ravenhood.
  It satisfies the mirrored claim. It counts,
  though less than one chance in a million millions.
  All ravens are black. So the watcher stands.
