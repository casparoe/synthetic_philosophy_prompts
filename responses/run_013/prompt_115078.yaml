prompt: |-
  I have been trying for a while to find out whether something has a name, and I keep failing, so I am going to describe it as carefully as I can and ask you either to identify the established concept or to build me one. Here is the pattern. A single word is in good standing in two communities that speak the same language, and in each community it has a settled, internally coherent meaning, but the two meanings have drifted apart along an axis that people actually care about. My American friends use "liberal" for someone on the left: in favour of redistribution, socially permissive, broadly aligned with the Democratic Party. My European friends, some of whom call themselves liberal with real pride, use it for something like the opposite end of the economic spectrum — pro-market, suspicious of state intervention, by no means necessarily on the left; the sort of position a German Free Democrat or a Dutch VVD voter would recognise as their own. What strikes me is not that the senses differ but how each side handles the other's: neither experiences its own usage as loose, metaphorical, or partisan. Each treats its sense as the plain one and the other's as a distortion, a euphemism, or a sign that the other lot have hijacked a good word. So when the two communities argue — over whether some policy is liberal, whether some regime is liberal, what a liberal international order would even consist in — part of the disagreement is about the world and part of it is about which concept the word has been hitched to, and the participants cannot easily separate the two, because from inside either usage the other side simply looks like it is misusing a word whose meaning is obvious.

  Once I started noticing this I found more cases, and they do not all behave alike, which is part of why I cannot place it. Some are cross-linguistic in the ordinary way — the French libertaire and the American libertarian look like the same word and pull in nearly opposite political directions — and for those I know there is a familiar term from language teaching, though I suspect it does not quite fit the cases that trouble me. What puzzles me is the within-one-language versions, and also the cases where a third sense is circulating at the same time. In "liberal democracy," for instance, liberal seems to mean something closer to constitutionalist and rights-respecting, which is neither the American nor the market sense, so within one conversation you can have three live meanings and nobody flags the switches. I have wondered about "federalist" too: it named the friends of central authority at the American founding, it now often names a preference for state-level power, and in European discussion it names a preference for more authority at the supranational centre, so the same word has pointed at both ends of one axis depending on the decade and the continent. I have been calling these two-way false friends in my own notes, but I do not think that is right, because the ordinary false-friend idea is about a learner's mistake across two languages and does not require either party to be a fluent speaker with a coherent home usage.

  So what I am asking for is the carving, not the label. Is there an established concept — in lexical semantics, in the history of political thought, in the literature on contested concepts, wherever it lives — that captures this specific configuration: one word, two or more settled usages, each internally coherent, the divergence systematic rather than idiosyncratic, and the mismatch generating disputes that are neither purely verbal nor straightforwardly substantive? If there is a term, tell me what it is, what it covers and what it leaves out, and how it differs from the nearest neighbours: from false friends, from ordinary polysemy, from the idea of an essentially contested concept, and from plain semantic drift, where the older sense simply dies rather than coexisting and sniping at its successor. And if nothing fits, coin something and define it properly, including the boundary cases I am unsure about. Does it apply when the two usages are merely unfamiliar to each other, or only when they are systematically opposed? What about a case where one community is fully aware of the other's sense and quietly trades on it, while the other remains oblivious? I would rather have the phenomenon's edges drawn correctly than have a tidy name for it.
reasoning: |-
  Okay, the user is describing a linguistic phenomenon where a single word has different, coherent meanings in two communities speaking the same language, and these meanings have drifted apart in a way that causes real confusion and argument. They've given examples like "liberal" in American vs. European contexts, "federalist" across different regions and times, and even "liberal democracy" having a third distinct meaning. They want to know if there's an established concept for this or if they need to coin one.

  First, I need to recall if there's any existing term in linguistics or political theory. The user mentioned false friends, polysemy, contested concepts, and semantic drift. False friends typically apply across languages, like English "actual" vs. Spanish "actual" (current). Polysemy is when a word has multiple related meanings, like "bank" (river or financial). Neither fits because here the meanings are conflicting and embedded in specific communities. Essentially contested concepts, like Gallie's "democracy," involve inherent disagreements about a concept's core, but the user's issue is about the same word having different settled meanings in different groups, not ongoing debate within a group.

  Semantic drift usually involves a meaning evolving over time, replacing the old one. But in this case, both meanings coexist and are actively used, each community unaware or dismissive of the other. The user emphasized that neither side sees their usage as metaphorical or loose; each thinks theirs is the correct one. That's key. The cross-community conflict where arguments mix verbal and substantive disputes is central here.

  I remember that sociolinguistics deals with how language varies across social groups. Terms like "register" or "dialect" might be close, but they don't capture the specific conflict aspect. Then there's "semantic bifurcation" or "diasystemic variation," but those are more technical and not widely recognized. The user mentioned "two-way false friends," but that doesn't fit since it's within one language. 

  Perhaps "heteroglossia" from Bakhtin? That's about multiple voices in language, but it's too broad. What about "localized semantic drift"? That emphasizes the regional aspect but misses the opposition. The user's case involves meanings that are systematically opposed, not just different. Like "liberal" meaning leftist in the US vs. pro-market in Europe—directly clashing on economic policy.

  Another angle: in political theory, "ideograph" refers to words like "freedom" that carry ideological weight and can be contested. But that's more about symbolic value than specific meaning splits across communities. The user’s phenomenon is more about practical usage causing misunderstandings in debates. 

  So maybe there isn't a perfect term. The user wants the concept carved out, so coining a term might be necessary. They need something that captures: single word, multiple communities, coherent but divergent meanings, systematic opposition, and resulting disputes that blend language and substance. 

  Possible coinages: "Antipodal polysemy" (polysemy with opposite meanings), "sociolexical schism," "semantic polarization." But "schism" implies a split, which fits. "Sociolexical" ties it to social groups. "Schism" captures the conflict aspect. "Sociolexical schism" could work. 

  Boundaries: It must involve at least two communities with stable meanings. If one community is aware and exploits the ambiguity (like in rhetoric), that's a variant. The core is the unawareness and mutual dismissal. The divergence must be on an axis that matters, like politics, to cause real disputes. Cases where meanings coexist without conflict or where one meaning dies out don't qualify. 

  So defining it: A sociolexical schism occurs when a single lexeme develops stable, internally coherent but systematically divergent meanings in distinct speech communities, leading to disputes where participants mistake semantic differences for substantive disagreements and dismiss the other's usage as erroneous. 

  This distinguishes it from polysemy (no community conflict), false friends (cross-language), contested concepts (inherent debate within a group), and semantic drift (temporal replacement). The user's examples all fit, including "federalist" with its historical shifts and regional differences. The third sense in "liberal democracy" adds complexity but still fits as another community's usage. 

  I should also note that this isn't just regional dialects; it's about subcultures like political groups. The term covers both unawareness and exploitation cases. Finally, ensuring the concept highlights the entanglement of verbal and substantive disputes, which frustrates resolution. That seems to address all the user's concerns.
answer: |-
  Your phenomenon is astutely observed and indeed lacks a perfect established term. It sits at the intersection of several concepts (polysemy, false friends, contested concepts, semantic drift), but its specific configuration – **coherent, stable, systemically divergent meanings within distinct subcultures of the same language, leading to disputes where semantic and substantive disagreements are inseparable** – requires a distinct conceptual carve-out.

  ### The Established Concepts & Why They Don't Quite Fit

  1.  **False Friends (Faux Amis):**
      *   **What it is:** Words in different languages that look/sound similar but have different meanings (e.g., English "actual" vs. Spanish "actual" meaning "current").
      *   **Why it doesn't fit:** Focuses *exclusively* on cross-linguistic confusion by learners. Your phenomenon is *intra-lingual* and involves fluent speakers with their own coherent systems. The "friend" aspect (similar form) is present, but the context (same language) and speaker fluency are key differences.

  2.  **Polysemy:**
      *   **What it is:** A single word having multiple, *related* meanings (e.g., "bank" - financial institution, side of a river, cloud formation).
      *   **Why it doesn't fit:** Polysemy generally assumes the meanings coexist *within* a single speech community and speakers recognize the connections (even if metaphorical). Your phenomenon involves meanings that are *systematically opposed* on a salient axis, are *compartmentalized* in different communities, and where speakers within each community often *deny the legitimacy* of the other meaning. The meanings feel unrelated or contradictory, not related extensions.

  3.  **Essentially Contested Concepts (W.B. Gallie):**
      *   **What it is:** Concepts (like "democracy," "justice," "art") whose *very nature* is inherently debatable. Agreement on a single definition is impossible because the concept embodies an "appraisive" element and different interpretations reflect fundamental value conflicts.
      *   **Why it doesn't fit:** Contested concepts focus on *inherent, unresolvable disagreement about the concept itself* within a discourse. Your phenomenon involves *separate communities each with their own stable, uncontested internal definition*. The "contestation" arises *only when these communities interact*, and it manifests as a dispute about *word usage* as much as the concept. Each side believes their concept is clear and the *word* is being misapplied, not that the underlying concept is inherently contestable.

  4.  **Semantic Drift / Change:**
      *   **What it is:** The gradual evolution of a word's meaning over time (e.g., "awful" shifting from "awe-inspiring" to "terrible").
      *   **Why it doesn't fit:** Classical semantic drift describes a *diachronic* (over time) process often leading to the obsolescence of the older meaning. Your phenomenon is often *synchronic* (meanings coexist simultaneously) and *diasystemic* (across different social/political systems). The older meaning doesn't die; it thrives robustly in a different context. The "drift" is *localized divergence*, not universal replacement.

  5.  **Register/Jargon/Sociolect:**
      *   **What it is:** Variation in language use based on context (formal/informal) or social group (e.g., medical jargon, youth slang).
      *   **Why it doesn't fit:** These explain *why* meanings diverge (different social contexts/communities), but they don't capture the *systematic opposition*, the *mutual incomprehension/dismissal*, and the resulting *entanglement of semantic and substantive disputes* that you identify as the core issue. Jargon differences are usually recognized as contextual; your phenomenon often isn't.

  ### The Carve-out: Sociolexical Schism

  **Core Phenomenon:** A **Sociolexical Schism** occurs when a single lexeme develops and maintains stable, internally coherent, but systematically divergent meanings within distinct, defined speech communities sharing a common language, where the divergence occurs along an axis of significant social, political, or ideological salience. Crucially:
  1.  Each community perceives its own meaning as the primary, default, or "correct" sense.
  2.  The alternative meaning(s) used by other community(ies) are perceived within each community as erroneous, distorted, euphemistic, or ideologically motivated hijackings, rather than legitimate contextual variants.
  3.  Communication and debate *between* these communities are persistently hampered because disagreements ostensibly about the *world* (e.g., "Is Policy X liberal?") are inextricably entangled with disagreements about the *meaning of the word itself*. Participants struggle to isolate the substantive disagreement from the semantic one because accepting the other's word usage feels like conceding the substantive point.

  ### Key Features & Boundaries

  1.  **Stable & Coherent Internally:** Both meanings are well-established and non-arbitrary *within their home communities*. This distinguishes it from mere ambiguity or temporary confusion.
  2.  **Systematic Divergence:** The meanings differ along a structured, meaningful axis (e.g., economic left/right, centralization/decentralization), not randomly. This axis is "live" – people care about it.
  3.  **Community-Based:** The divergent meanings are anchored in distinct social, political, geographic, or ideological groups. This isn't just individual idiosyncrasy.
  4.  **Mutual Misapprehension/Opposition:** Each community fundamentally misinterprets or dismisses the other's usage as illegitimate. This psychological/argumentative dimension is crucial.
  5.  **Entanglement of Disputes:** Arguments become meta-arguments about language *because* the word is a key term in debating the salient axis. Disentangling "what we mean by X" from "what is true about Y" is exceptionally difficult.

  ### Applying the Carve-out to Your Examples & Edge Cases

  *   **Liberal (US vs. EU):** Classic Sociolexical Schism. Stable meanings (social-democratic/left in US; pro-market/classical liberal in EU). Opposed on the economic left/right axis. Mutual dismissal ("they misuse the word!"). Entangled debates about policies/regimes.
  *   **Liberal (in "Liberal Democracy"):** A *third* stable meaning (constitutionalism/rights-focused). While distinct, it can be part of the schism. When used in a US-EU debate, it adds another layer of potential confusion. If a specific community *primarily* uses it this way and dismisses the others, it becomes another node in the schism network.
  *   **Federalist:**
      *   *Founding Era (Pro-Constitution/Centralization) vs. Modern US (Pro-State Rights):* Primarily **semantic drift** (diachronic change within one community, older sense largely obsolete). Less schism as the communities aren't concurrent and debating each other.
      *   *Modern US (Pro-State Rights) vs. Modern EU (Pro-Supranational Centralization):* **Sociolexical Schism.** Concurrent, stable, coherent meanings within distinct political cultures. Opposed on the centralization axis. High potential for mutual incomprehension and entangled disputes ("Federalism means *less* Brussels!" vs. "Federalism means *more* Brussels!").
  *   **Libertaire (FR) vs. Libertarian (US):** While cross-linguistic, it fits the *pattern* of systematic opposition (anarchist-left vs. anarchist-capitalist) and mutual dismissal, *but* it's covered by **False Friends**. The intra-lingual cases are the core focus of "Sociolexical Schism".
  *   **Edge Case: Unfamiliarity vs. Systematic Opposition:** A true Sociolexical Schism requires **systematic opposition** on a salient axis. Mere unfamiliarity (e.g., regional slang differences for non-salient objects) doesn't generate the characteristic entangled disputes and mutual dismissal. The opposition must be meaningful.
  *   **Edge Case: Asymmetric Awareness & Exploitation:** If Community A is aware of Community B's meaning and deliberately exploits the ambiguity (e.g., in rhetoric), while Community B remains oblivious, it's a **variant of Sociolexical Schism**. The core elements are present: stable divergent meanings, the divergence matters, communication is distorted (now strategically by A, innocently by B), and disputes are entangled (B argues substantively, A can shift meaning). The obliviousness/dismissal is asymmetric but still potent.

  ### In Summary

  You've identified a specific and powerful form of linguistic friction: **Sociolexical Schism**. It's distinct from false friends (intra-lingual), polysemy (opposed meanings compartmentalized, not related), contested concepts (stable internally, conflict only on contact), and simple drift (coexistence, not replacement). Its hallmarks are stable community-based meanings diverging systematically on a salient axis, mutual perception of the other's usage as illegitimate, and arguments that hopelessly entangle word meaning with world truth. The concept captures the frustration you describe – it's not "just semantics," nor is it purely substantive; it's a uniquely tangled knot of both.
