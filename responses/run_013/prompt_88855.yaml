  ### Decision Procedure for Evaluating Prediction Carry-Forwards  
  **Purpose**: To fairly decide if a missed prediction can be carried forward once (per club rules) or must be scored as a miss. Based on the philosophy of science: A "missed" prediction can be kept alive *only* if the explanation points to a specific, unforeseen barrier that was (1) **unknown** at the time of the original prediction, (2) **verifiable** with evidence, and (3) **necessary** for the outcome. Excuses that reframe the prediction or blame delays without proof are "moving the goalposts."  

  **Procedure** (apply in order; stop at first "miss"):  

  1. **Did the prediction happen by the original due date?**  
     - ✅ **Yes** → Score as **correct**.  
     - ❌ **No** → Proceed to Step 2.  

  2. **Is the member requesting a carry-forward?**  
     - ❌ **No** → Score as **miss**.  
     - ✅ **Yes** → Proceed to Step 3.  

  3. **Ask: "What specific, verifiable condition must happen for your prediction to come true, that had *not* happened by the original due date?"**  
     - ❌ **No condition named** (e.g., "I meant something else") → **Miss** (invalid: changes the prediction).  
     - ✅ **Condition named** → Proceed to Step 4.  

  4. **Is the condition specific and verifiable?**  
     - *Your judgment*:  
       - **Specific** = Clear, unambiguous description (e.g., "City Council approves permits," not "bureaucracy resolves").  
       - **Verifiable** = You can check it with public records (e.g., meeting minutes, official data).  
     - ❌ **No** (vague or uncheckable) → **Miss** (invalid: untestable excuse).  
     - ✅ **Yes** → Proceed to Step 5.  

  5. **Had the condition *already happened* by the original due date?**  
     - *Your judgment*: Check public records.  
       - ✅ **Yes** → **Miss** (invalid: if the condition was met, the prediction should have happened).  
       - ❌ **No** → Proceed to Step 6.  

  6. **Is the condition solely about the passage of time?**  
     - *Club policy judgment* (hand to the club if disputed):  
       - **Not allowed**: Conditions like "by the end of the year" (just extends the deadline; not a *cause*).  
       - **Allowed**: Events tied to time (e.g., "a board vote on May 15").  
     - ✅ **Yes** (only time) → **Miss** (invalid: goalpost-moving).  
     - ❌ **No** → **Allow carry-forward**. Set a new due date (see *Policy Gaps*).  

  ### Policy Gaps (Hand to the Club)  
  - **New Due Date**: How far forward? (Suggest: ≤6 months or end of school year.)  
  - **Credit for Late Success**: If the prediction comes true *after* the new due date, is it still a miss? (Suggest: **Yes**—deadlines matter.)  
  - **Scoring**: Are we judging the *prediction* or the *underlying view*? (Suggest: **Prediction only**—fairness requires consistency.)  

  ---

  ### Case Evaluations  
  1. **Driverless buses by start of school year** → Missed.  
     - Condition: Permits not issued.  
     - Step 4: **Specific/verifiable?** Yes (permits are public record).  
     - Step 5: **Already happened?** At start of year, permits were not issued → No.  
     - Step 6: **Solely time?** No (permits are an event).  
     - **Verdict**: ✅ **Allow carry-forward**.  

  2. **School remote by last winter** → Missed.  
     - Condition: New COVID variant emerges.  
     - Step 4: **Specific/verifiable?** Yes (WHO/public health reports).  
     - Step 5: **Already happened?** At winter deadline, no new variant → No.  
     - Step 6: **Solely time?** No (variant is an event).  
     - **Verdict**: ✅ **Allow carry-forward**.  

  3. **Town population falls 10% by last year** → Fell 2%.  
     - Claim: "Direction was right."  
     - Step 3: **Condition named?** No (changed prediction to "direction," not a condition).  
     - **Verdict**: ❌ **Miss**.  
     - *To legitimize carry-forward*: Member should have named a specific barrier at the time (e.g., "if the factory closes by June," verified by news).  

  4. **District pushes start time later this year** → Missed (vote in May).  
     - Condition: Board vote in May.  
     - Step 4: **Specific/verifiable?** Yes (board meetings are public).  
     - Step 5: **Already happened?** Original due date (e.g., March) → Vote not held → No.  
     - Step 6: **Solely time?** No (vote is an event).  
     - **Verdict**: ✅ **Allow carry-forward**.  

  5. **Club reaches 50 members by spring** → At 38.  
     - Condition: "Meant end of year."  
     - Step 3: **Condition named?** "End of year" is a deadline, not a condition.  
     - *If argued as "time needed"*: Step 6 → **Solely time?** Yes.  
     - **Verdict**: ❌ **Miss** (likely unpopular but fair).  
     - *To legitimize carry-forward*: Name a verifiable event (e.g., "if we host 3 recruitment events by April").  

  ### Where the Procedure Might Misfire  
  - **Case 2 (New Variant)**: Science allows for unforeseen variables, but if the club thinks pandemics are overused excuses, they may reject it. The procedure permits it because it’s testable.  
  - **Case 5 (Your Prediction)**: You’ll dislike the "miss," but allowing "end of year" would set a precedent for endless extensions. The rule forces specificity.  

  ### Key Judgment Calls  
  - **Steps 4 & 5**: You decide if a condition is "verifiable" (Step 4) and if records prove it hadn’t happened by the due date (Step 5).  
  - **Step 6**: The club must rule if "time-based conditions" are ever allowed (suggest: no).  

  **Final Tip**: When in doubt, ask: "Could you have known about this barrier when you made the prediction? If not, can we *prove* it exists now?" If answers are fuzzy, it’s likely goalpost-moving.
