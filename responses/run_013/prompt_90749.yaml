prompt: |-
  A mate of mine and I had a proper two-hour row in the pub last night about Wittgenstein's On Certainty — he's doing a course on it and I've been dipping in and out of it for years — and it got under my skin enough that I've banged out a draft of my side of it, mainly to see whether it holds together or whether I was just being loud. I'd really like comments on it. His line was that when one of these basic certainties gives out, the person was just being sloppy and should have been more careful, since you can always in principle say what your reasons were. I think that's wrong, but I need the distinction below to do the work of showing why.

  Here's the draft.

  Hinges, seepage and rupture (working title)

  The thing I take from the book is that doubting needs somewhere to stand. Asking "how do you know?" has a point when there's a procedure to point at, and no point at all for the things that make pointing possible — that I have two hands, that the world was here long before I was born, that the words I'm using mean what they mean. These aren't our best-evidenced beliefs; they're the ones that hold still so that anything else can be tested. He compares it to a river: propositions are the water, but the bank is made of the same stuff and moves too. Some of the bank is rock that doesn't budge, some is silt that gets carried off and dropped somewhere else.

  My gripe is that "the same proposition" makes hinges sound like beliefs whose evidential status drifts up and down. But what's at the bottom usually isn't a belief we hold, it's a way of going on — a practice. You only ever catch sight of a hinge when the practice jams and someone asks what you were assuming. Nobody believes that a signature means money will change hands; that's built into what signing is. So the bank is better described as the standing shape of a practice than as a set of propositions. And when it shifts, it usually isn't because the evidence finally stacked up. It's because a way of doing things stopped working.

  The bit I actually want to argue is that hinges go two seperate ways. Seepage: worn down over years by small frictions, so the ex-hinge leaves a rational trace. You can tell the story — this happened, then that, and gradually I couldn't go on as before — and the story isn't a proof but it is an answer to "why". Rupture: a single event takes the hinge out without arguing with it. Afterwards you can't reconstruct the case against the old hinge, because the case would have to be made in a vocabulary you no longer have. It isn't that you were persuaded; the old thing now reads as theatre. Think of someone whose partner of twenty years turns out to have had a second family, or who finds out the official account of the war they fought in was invented from the start. Ask them for the evidence that convinced them to stop trusting and there isn't any — not because they're being coy.

  Why I think it matters: our ways of holding each other to account — blame, argument, "why on earth did you think that?" — assume seepage. They assume the person can walk back along the trace. Where it was rupture, that assumption is empty, and pressing them for reasons isn't just harsh, it's a category error. It also explains the double bind: they get called irrational for having no reasons, when no reasons were involved in getting them there, and whatever reasons they offer afterwards are reconstructions. And it explains why what actually helps is other people doing the practice with you rather than better arguments.

  Last piece: a test for telling a hinge from a merely deeply held belief. A deeply held belief can be attacked from inside your own practice — you can find it, and see what would count against it. A hinge can't be located from the inside at all until it's gone, and when it goes you don't feel you've changed your mind. You feel the world has changed.

  What I want comments on:

  1. Accuracy. Have I got the riverbank image right, or is that image really about how we're taught things rather than about practices? Please don't hand me a reading list — I won't get to a library, so if there's something I ought to read, just tell me the idea.
  2. Is seepage versus rupture a real distinction, or is it slow belief change versus fast belief change with extra steps? Give me the strongest version of the objection that it's a fancy redescription of something much more boring.
  3. Where does it overreach? I'm least sure about the accountability claim. People do sometimes give reasons after a rupture, even bad ones, and sometimes the rupture is something they brought on themselves.
  4. Which single claim, if false, sinks the whole thing? And is there a case that definately breaks my hinge-versus-deeply-held-belief test — something that looks like a hinge but can be located from the inside?
reasoning: |-
  Okay, the user and their mate had a heated debate about Wittgenstein's "On Certainty," specifically about what happens when basic certainties—hinges—fail. The user wrote a draft arguing that hinges aren't beliefs but practices that can fail in two ways: seepage (gradual erosion) and rupture (sudden collapse). They want feedback on accuracy, their distinction, overreach, and key vulnerabilities. 

  First, I need to recall Wittgenstein's riverbank analogy. The user interprets the bank as practices, not propositions. But Wittgenstein does mention bedrock propositions like "I have hands." The user might be blending hinge propositions with background practices. That's a nuance worth noting. 

  The seepage vs. rupture distinction feels insightful. Seepage is slow, rational drift; rupture is sudden, world-shattering. The user’s mate thinks all hinge failures are sloppiness, but rupture examples (e.g., discovering a partner's secret family) show no rational trace exists. The strongest objection? Maybe ruptures are just fast belief changes where reasons are subconscious or repressed. But the user’s point about vocabulary loss after rupture counters that—it’s not about hidden reasons but a shattered framework. 

  On accountability: The user claims demanding reasons after rupture is a category error. But people often invent reasons post-rupture (e.g., "I should’ve noticed the signs"). This might weaken their point. Also, self-induced ruptures (e.g., willful ignorance) complicate the "no reasons" claim. Still, the core idea holds—pressuring for reasons when the world fundamentally shifts feels unjust. 

  The hinge vs. deeply held belief test: If something can be doubted from within the practice, it’s not a hinge. But what about religious beliefs? A believer might internally wrestle with doubt yet still treat "God exists" as a hinge. That could be a counterexample—hinges aren’t always invisible until gone. 

  Biggest vulnerability: If practices and propositions are inseparable (per Wittgenstein), the user’s "practices not propositions" framing might oversimplify. Also, if seepage/rupture is just speed difference, their distinction collapses. But their rupture examples feel qualitatively different—trauma, betrayal—where reasons don’t apply. 

  Actionable advice: Stress that rupture isn’t about speed but irreconcilability with prior frameworks. Acknowledge post-hoc reason-giving but frame it as grief, not justification. For the test, allow that some hinges can be "touched" during crises without fully breaking. 

  The user’s draft is strong. Their mate’s "sloppiness" take misses how ruptures obliterate the ground for reasons. That’s the gem here.
answer: |-
  Here's a line-by-line breakdown addressing your queries, followed by a summary assessment of your argument:

  **1. Accuracy (Riverbank & Practices)**
  *   **Your Interpretation:** You're *partially* right but refining Wittgenstein usefully. The riverbank image *does* include propositions ("I have hands," "The Earth existed long ago"). Wittgenstein explicitly calls these "propositions" that are "hardened" and function as the "river-bed of thoughts" (OC 96-99).
  *   **Your Insight:** Where you excel is emphasizing that these propositions **derive their certainty from being embedded in practices**, not primarily from evidence. Wittgenstein *does* link hinges to action (OC 110, 204, 411). Saying "Nobody *believes* that a signature means money..." captures this perfectly – it's enacted, not merely thought. Your shift from "beliefs whose evidential status drifts" to "the standing shape of a practice" is a powerful and valid interpretation that highlights the *pragmatic bedrock* Wittgenstein is uncovering. The hinge *is* revealed when the practice jams.
  *   **Verdict:** You've accurately captured the *function* of hinges (enabling doubt/testing) and brilliantly emphasized their *practical* nature over their propositional form. While W. uses propositions, your "practice" focus is a legitimate and insightful reading. The riverbank image *is* partly about transmission (teaching/learning), but its core is about the *logical role* of certainties – which your practice-centered view fulfills.

  **2. Seepage vs. Rupture - Real Distinction or Fancy Redescription?**
  *   **Your Distinction:** Seepage (gradual rational erosion) vs. Rupture (sudden, non-rational collapse leaving no rational trace) is a **genuine and valuable distinction**, not just speed difference.
  *   **Strongest Objection:** "It's *all* belief change. Seepage is slow rational revision. Rupture is rapid belief change triggered by overwhelming evidence (e.g., seeing the second family), causing cognitive dissonance so intense the old 'hinge' belief is instantly jettisoned. The 'vocabulary loss' is just the shock making it hard to articulate the *implicit* reasons that were always accumulating or the sudden weight of the new evidence. Demanding immediate reasons *is* harsh, but that's psychology, not logic. The 'world changing' feeling is dramatic description, not metaphysics. You're mystifying a psychological process."
  *   **Why Your Distinction Holds:**
      *   **Beyond Speed:** Rupture isn't just *fast* seepage. In seepage, reasons accumulate *within* the framework. In rupture, the *framework itself* implodes *because* the event is incompatible with its core.
      *   **The Vocabulary Loss:** The objection downplays this. After a rupture, the *very concepts* used to articulate the old certainty ("trust," "my marriage," "my country's integrity") lose their former meaning or application. You can't "point" to reasons *within* the framework because the framework *is* the casualty.
      *   **"Not Persuaded, Theatre":** This is key. Rupture isn't being *convinced by counter-evidence* operating within the old rules (like seepage). It's the realization that the *entire game* was something other than what you thought. The old certainty wasn't disproven; its *status* as a certainty was catastrophically misplaced. The "evidence" isn't processed; it *annihilates the context for processing*. This is qualitatively different from fast belief revision.

  **3. Where it Overreaches (Accountability & Nuance)**
  *   **Accountability Claim:** Your core point – that demanding reasons *as if* it were seepage is a category error after rupture – is **strong and important**. Pressing for "why did you stop believing X?" misunderstands the nature of the loss.
  *   **Overreach/Needed Nuance:**
      *   **Post-Hoc Reasons:** You acknowledge people offer reconstructions. The overreach is implying they *never* offer "reasons" or that *all* reasons given are *only* reconstructions. Sometimes, the rupture *reveals* previously ignored or suppressed pieces of evidence that *do* look like reasons in hindsight ("Those unexplained absences..."). While these weren't the *cause* (the rupture was), they become available *as* reasons post-collapse.
      *   **Self-Induced Rupture:** You're right, sometimes rupture stems from willful blindness or recklessness *within* the practice (ignoring glaring signs). Here, "Why didn't you see?" or "Why did you ignore that?" *can* be valid accountability questions *within the remnants of the practice* (e.g., fiduciary duty, marital commitment). The rupture reveals a failure *in upholding the practice itself*, not just an external shock. Accountability might *still* be misplaced if it demands reasons for the *loss of certainty itself*, but reasons for *contributing to the vulnerability* might be fair.
      *   **Not *Always* Invisible:** While often sudden, some ruptures involve a period of dawning, horrifying realization where the hinge is "located" just before it breaks completely. It's still rupture, not seepage, as the shift is fundamental and non-incremental.

  **4. The Keystone Claim & Counterexample**
  *   **Single Claim that Sinks it (If False):** **"A hinge can't be located from the inside at all until it's gone."**
      *   *Why?* If hinges *can* be identified, examined, and potentially doubted *from within* the practice while still functioning as hinges, then:
          1.  Your seepage/rupture distinction blurs (seepage *is* locating and gradually doubting it).
          2.  Your mate's point gains traction (if you *can* locate it, you *should* be able to articulate reasons for change).
          3.  Your accountability argument weakens (if locatable, demanding reasons seems less erroneous).
          4.  Your test for hinge-vs-deep-belief collapses.
  *   **Potential Counterexample - Religious Belief:**
      *   **Scenario:** A deeply devout person experiences profound doubt. They wrestle internally for years. They examine their foundational belief ("God exists," "This scripture is divine") *as a hinge* – the bedrock of their worldview. They feel its solidity *and* its terrifying fragility *from within* their practice (prayer, study, community). They might even formulate what *would* count against it (e.g., undeniable contradiction in scripture, personal tragedy interpreted as divine absence), though these may not be decisive. Eventually, they might lose faith (rupture *or* seepage).
      *   **Why it Challenges Your Test:** The hinge *was* "located from the inside" *before* it was gone. It was felt *as* the bedrock *while* being consciously examined and stressed. This suggests some hinges *can* become objects of conscious attention and internal struggle *without* immediately ceasing to function as hinges. They occupy a space between your "deeply held belief" (attacked internally) and your "hinge" (utterly invisible until gone). It looks like a hinge (world-constituting) but *can* be partially located/doubted internally during a crisis of faith *within* the practice.

  **Overall Assessment:**

  *   **Strength:** Your core insights are **excellent**. You've grasped the practical nature of hinges better than your mate. The seepage/rupture distinction is **real, valuable, and well-defended** against the "just speed" objection. Your accountability point, while needing nuance, highlights a crucial ethical and conceptual pitfall. Your hinge-vs-belief test is powerful, even if potentially vulnerable at the edges (like the religious example).
  *   **Accuracy:** Your "practices not propositions" emphasis is a valid and insightful *interpretation* of Wittgenstein, focusing on the *source* of certainty rather than contradicting his propositional *examples*. The riverbank image is compatible.
  *   **Overreach:** Primarily in implying *no* reasons can ever be relevant post-rupture and not fully accounting for self-induced vulnerability or the potential for *some* hinges to be consciously felt *as* hinges during internal turmoil before breaking.
  *   **Vulnerability:** The "cannot be located from the inside" claim is the keystone. Cases of profound internal doubt within a practice (like the religious crisis) challenge its absoluteness. If this claim fails, the whole elegant structure wobbles.

  **Recommendations for Your Draft:**

  1.  **Refine the Practice/Proposition Balance:** Acknowledge W. uses propositions, but stress they *function* as hinges *because* they are rules embedded in action. "The bank *is manifested in* the standing shape of practices, *often taking propositional form*."
  2.  **Fortify Rupture:** Emphasize the *framework-destroying* nature and *incommensurability* aspect alongside the vocabulary loss. The event isn't just evidence *against* the hinge; it reveals the hinge *never was* what held the world together in that way.
  3.  **Nuance Accountability:** "Demanding reasons *for the loss of certainty itself* after a rupture misunderstands its nature. While individuals may offer reconstructions or identify contributing factors *post-collapse*, pressing them to justify *why they ceased being certain* as if they were rationally persuaded is a category error." Acknowledge potential accountability *within* the practice for contributing to vulnerability *if applicable*.
  4.  **Qualify the Test:** "A defining feature of a hinge is that it *resists* being meaningfully located or doubted *from within* the practice it sustains *while functioning normally*. It typically only comes into view when the practice fails or is under extreme stress, and its collapse feels less like changing one's mind and more like the world changing."

  Your argument absolutely holds together. You weren't just being loud; you've articulated a sophisticated and compelling reading of Wittgenstein that exposes the flaw in your mate's "sloppiness" charge, especially concerning rupture. Well done. Now go have a calmer pint!
