prompt: |-
  I'm putting together a 90-minute session for about 15 grad students in an interdiscplinary seminar -- half philosophy of science, half ML -- on what happens to a measure once people start optimizing it. I've done the lecture version of this before and it always lands as a slogan; this time I want them to actually feel the pull and catch themselves doing it mid-game. Act as someone who designs classroom simulations for a living and has run this one twenty times. Before you commit to a mechanic, brainstorm two or three candidate setups in your head, pick the one with the least fiddle and the most bite, and think carefully about whether the incentives in it will actually bite the way you expect.

  Constraints on whatever you design:

  - The number everyone is scored on has to be public to all teams. The thing they're actually supposed to be achieving stays with me, the facilitator, and only shows up as points I award privately afterwards. The asymmetry has to be real, not narrated.
  - The game has to make four different ways the number can come apart from the goal separately visible, roughly one per round, and in every round the move that maximizes the published number has to be the sane-looking move, so nobody feels like they're cheating when they do it. The four: (i) the number is estimated from a sample, so chasing the top of the leaderboard is partly chasing luck; (ii) past some range -- the extremes, the cases the scale was never calibrated on -- the number and the goal stop tracking at all; (iii) teams can move the number without touching the underlying thing (reclassify a case, change who gets counted, relabel a failure as a different kind of failure); (iv) another team is optimizing the same number in its own favor, so every move you make changes what they'll do next.
  - Include one round where the number is a genuinely good stand-in for the goal, so they can't walk out with "measures always rot."
  - No real money, no props beyond index cards, runnable in the room in 90 minutes with me as the only facilitator.
  - Don't say the name of the phenomenon or the standard term for the failure until the debrief. The debrief should map specific moments from the game onto each of the four pressures above.

  Give me exactly five numbered items, a sentence or two each, no intro and no closing paragraph:

  1. the setup -- room, teams, roles, materials, the clock
  2. the rounds -- what each one is and what changes between them
  3. the payoff scheme, and how I keep score without a spreadsheet getting in the way
  4. the debrief
  5. what will predictably go wrong the first time I run it, and what the activity structurally can't reproduce (including, I suspect, the fact that my private scoring is itself just a stand-in -- the game pretends there's a measurable ground truth, and the real world doesn't hand you one)
reasoning: |-
  We are designing a classroom simulation to illustrate the corruption of a measure when optimized. We need 5 numbered items as specified.

  1. **Setup**: 
     - Room: Standard seminar room with movable chairs. Divide into 3 teams of 5 students each (for 15 total). 
     - Roles: Each team is a "Research Lab" competing for funding. 
     - Materials: Index cards (two colors: one for data points, one for actions), markers, a public leaderboard (flip chart or whiteboard). 
     - Clock: Four rounds of 12 minutes each (48 min), plus 15 min intro and 27 min debrief (total 90 min). 

  2. **Rounds**: 
     - Round 1 (Baseline): Teams draw 10 index cards (data points) from a deck I prepared. Each card has a number (e.g., 0-100) representing a "research result." Their goal is to maximize the average of their results. I record each team's average publicly. (Illustrates: i. Sampling variation - luck in the draw.) 
     - Round 2 (Extreme Pushing): Teams can now choose to "push" their research. For each card, they can add up to 20 points (by writing a new number) but risk "breakdown": if the new number exceeds 90, I flip a coin; heads it stays, tails it becomes 0. (Illustrates: ii. Measure breaks at extremes.) 
     - Round 3 (Reclassification): Teams can reclassify up to 3 low cards as "outliers" (set aside, not counted) or re-label one card as a different type (swap it for a new card from a "special" deck I provide, which has higher average but unknown true value). (Illustrates: iii. Gaming by redefinition.) 
     - Round 4 (Competition): Each team's average now affects others. I introduce a shared "funding pool": the team with the highest average takes 60% of the pool, second 30%, third 10%. But the true value of their research (my private score) is reduced by the maximum score of any other team (simulating that their "breakthrough" makes others' work seem less valuable). (Illustrates: iv. Strategic interaction.) 
     - Note: In Round 1, the measure (average) is a good stand-in because the deck is calibrated to reflect true impact (my private scoring is the same as the public average). 

  3. **Payoff scheme**: 
     - Public score: The average of their current cards (written on the leaderboard each round). 
     - True score: I assign privately. In Rounds 1 and 2, true score = public average. In Round 3, true score = average of all original cards (so reclassified outliers count as 0, swapped cards use their original true value). In Round 4, true score = (public average) minus the highest public average of any other team. 
     - Scoring without spreadsheet: Use index cards to record team submissions per round. Calculate true scores during breaks or after the game. 

  4. **Debrief**: 
     - Start by asking teams to share their strategies and when they felt uneasy. 
     - Then map: 
       - Round 1: "Did anyone notice that the luck of the draw mattered more than effort?" (i. Sampling variation) 
       - Round 2: "When you pushed numbers past 90, did it feel like the measure still meant the same thing?" (ii. Breakdown at extremes) 
       - Round 3: "How did reclassifying or swapping cards feel? Did it change what you were actually achieving?" (iii. Gaming by redefinition) 
       - Round 4: "Did you consider how your actions affected others? How did that change your goals?" (iv. Strategic interaction) 
     - Finally, reveal that the phenomenon is Goodhart's Law and note that Round 1 showed a measure can work when not gamed. 

  5. **Predictable problems & limitations**: 
     - Predictable: In Round 4, teams may not grasp the interdependence quickly; I'll need to explain the funding pool rule clearly. Also, students might focus too much on the leaderboard and not reflect mid-game. 
     - Limitations: The simulation assumes a measurable ground truth (my private score), which real-world problems lack. Also, the time pressure may lead to hasty decisions, reducing reflection. The true score reduction in Round 4 is an artificial construct; real-world strategic effects are more complex. Finally, the game can't capture long-term erosion of trust in the measure. 

  This design uses index cards for simplicity, has four distinct rounds that each highlight one failure mode, and includes a baseline round where the measure works. The incentives are structured so that in each round, maximizing the public score is the rational move, but it detaches from the true goal.
answer: |-
  1. **Setup**:  
     Arrange 15 students into three teams of five. Use a whiteboard for a public leaderboard showing "Research Impact Scores" (RIS). Distribute index cards: yellow for "research findings" (pre-printed with hidden "true value" numbers known only to you), blue for "policy actions" (blank, for teams to write moves). Run four 15-minute rounds with 5-minute transitions. Assign one observer per team to track decisions for debrief.  

  2. **Rounds**:  
     - **Round 1 (Baseline)**: Teams draw 10 yellow cards. RIS = average of visible numbers. *Mechanic*: RIS ≈ true value (goal).  
     - **Round 2 (Extremes)**: Teams add 5 new yellow cards from a "high-stakes" deck (values 90–100, true values decay to 50 if modified). RIS = average. *Mechanic*: Pushing extremes breaks tracking.  
     - **Round 3 (Reclassification)**: Teams use blue cards to reclassify low-value yellow cards as "methodological noise" (excluded from RIS) or swap them for "novel findings" (fixed +20 RIS, but true value = 0). *Mechanic*: Measure-gaming without changing substance.  
     - **Round 4 (Competition)**: RIS leader gains "funding" (bonus points), but each team’s RIS-boosting action (e.g., reclassification) forces adjacent teams to redraw cards, injecting noise. *Mechanic*: Strategic interdependence distorts incentives.  

  3. **Payoff Scheme**:  
     Public RIS uses visible card numbers (teams calculate/announce). True score = average of hidden true values. Track true scores via index cards: teams submit yellow cards post-round; you silently notate true scores on the leaderboard using color-coded dots (e.g., green = high alignment, red = low). Award "funding" in Round 4 via sticky notes (no calculations needed mid-game).  

  4. **Debrief**:  
     - Display public RIS vs. true scores side-by-side. Ask: "When did chasing RIS feel legitimate but wrong?"  
     - Map rounds to failures: (i) Round 1’s luck-driven rankings; (ii) Round 2’s inflated extremes; (iii) Round 3’s reclassification tricks; (iv) Round 4’s reactive moves. Contrast with Round 1: "When did RIS work? Why?" Only then name Goodhart’s Law.  

  5. **Predictable Problems & Limitations**:  
     - **Problems**: Round 4’s interdependence may confuse teams; simplify by having "actions" directly modify neighbors’ RIS. Observers might interfere; brief them strictly. True scores risk leaks; use coded markings.  
     - **Limitations**: Your "true value" is an artificial ground truth, unlike real-world ambiguity. The game can’t replicate long-term measure erosion (only acute distortion). Students may fixate on winning, missing meta-lessons—force reflection via observer reports.
