answer: |-
  ### Decision Tree: Accuracy-First Epistemology

  **Instructions:** Answer each question based on your epistemic commitments. Follow the branches to a leaf position. Test critical branches with the provided probes. Each leaf names a position, notes if unoccupied, and states an awkward commitment.

  ---

  #### **Node 1: Is accuracy the sole fundamental epistemic good?**  
  - **Yes** → Proceed to Node 2.  
  - **No** → **Leaf: Pluralist View**  
    - *Position:* Accuracy is one epistemic good among others (e.g., coherence, explanatory power).  
    - *Awkward commitment:* Must explain how to weigh accuracy against conflicting goods (e.g., when high coherence reduces accuracy).  

  ---

  #### **Node 2: Is the epistemic value of a credence function fully determined by the accuracy of its individual credences?**  
  - **Yes** → Proceed to Node 3.  
  - **No** → **Leaf: Globalist View**  
    - *Position:* Overall accuracy depends on relations among credences (e.g., logical coherence), not just individual accuracy.  
    - *Awkward commitment:* Must defend why an incoherent but individually accurate credence state (e.g., Probe 1 below) is less valuable than a coherent one, even when it scores better on additive measures.  
    - **Probe 1:** *Agent A has credence 0.9 in P, 0.9 in Q, and 0.9 in P∧Q (incoherent). Agent B has 0.9 in P, 0.9 in Q, and 0.81 in P∧Q (coherent). If P and Q are true, additive measures (e.g., Brier) favor A; global measures may favor B for coherence.*  

  ---

  #### **Node 3: Must accuracy be measured by a strictly proper scoring rule?**  
  - **Yes** → Proceed to Node 4.  
  - **No** → **Leaf: Permissive View**  
    - *Position:* Any truth-directed scoring rule is acceptable, leading to underdetermination of rational credences.  
    - *Awkward commitment:* Allows rational agents to hold incoherent credences if they maximize a non-proper rule (e.g., Probe 2 below), risking inconsistency.  
    - **Probe 2:** *Two agents agree on credences for P and Q (e.g., 0.6 each) but disagree on P∧Q (coherent 0.36 vs. incoherent 0.6). Non-proper rules may favor either depending on the rule; strict propriety always favors coherence.*  

  ---

  #### **Node 4: Is expected accuracy assessed from the agent’s own credences?**  
  - **Yes** → Proceed to Node 5.  
  - **No** → **Leaf: Externalist View**  
    - *Position:* Expected accuracy is assessed from an external standpoint (e.g., objective chances).  
    - *Awkward commitment:* Agents may be required to hold credences that, by their own lights, fail to maximize expected accuracy.  
    - *Status:* Unoccupied (likely unattractive, as it severs rationality from the agent’s perspective).  

  ---

  #### **Node 5: Does accuracy-first epistemology yield diachronic norms?**  
  - **No** → **Leaf: Synchronic Only View**  
    - *Position:* Accuracy only justifies synchronic norms (e.g., probabilism); diachronic norms (e.g., conditionalization) require other foundations.  
    - *Awkward commitment:* Cannot explain why updating beliefs upon new evidence is epistemically required.  
  - **Yes** → Proceed to Node 6.  

  ---

  #### **Node 6: Are diachronic norms derivable solely from accuracy?**  
  - **Yes** → **Leaf: Orthodox View**  
    - *Position:* Accuracy (sole, additive, strictly proper, internal) yields probabilism, conditionalization, and the chance-credence link.  
    - *Awkward commitment:* Must defend why agents who violate conditionalization but achieve high accuracy are irrational.  
  - **No** → **Leaf: Bridge Principle View**  
    - *Position:* Accuracy justifies synchronic norms, but diachronic norms require a non-accuracy bridge principle (e.g., commitment to future rationality).  
    - *Awkward commitment:* The bridge principle itself lacks accuracy-based justification.  

  ---

  #### **Node 7: Is the chance-credence link derivable from accuracy?**  
  - *Note:* This node is only reached via **Orthodox View**.  
  - **Yes** → Orthodox View (as above).  
  - **No** → **Leaf: Independent Chance-Credence View**  
    - *Position:* Accuracy yields probabilism/conditionalization but not the chance-credence link; the latter is an independent constraint.  
    - *Awkward commitment:* Leaves the chance-credence link unexplained by core epistemic values.  

  ---

  ### Notes on Unseparated Positions  
  - **Permissive View & Externalist View:** The tree cannot distinguish combinations (e.g., permissive externalism) due to path structure. No known positions hold this combination (likely incoherent, as external assessment narrows permissible rules).  
  - **Globalist View & Pluralist View:** Mutually exclusive paths (Node 1 excludes Node 2). No globalist pluralist positions exist (unexplored; may require complex value interactions).  

  ### Key  
  - **Probe 1:** Tests additivity (Node 2).  
  - **Probe 2:** Tests strict propriety (Node 3).  
  - **"Unoccupied"**: No known defenses; marked as unattractive, incoherent, or unexplored.  
