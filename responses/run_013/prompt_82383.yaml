prompt: |-
  I chair the definitions committee of my professional body. We meet monthly, most members are practitioners rather than philosophers, our wording binds the whole organisation, and six months ago I lost a vote I should have won because I spent two hours arguing with a colleague who turned out to mean something different by 'harm' than I did. Write a procedure the committee can run in a single sitting on the disputes that reach us: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to treat the matter as a disagreement about words, and where it must hand the question to a vote because what is at stake is values rather than facts. It should end in one of three verdicts rather than a bare yes or no — the dispute dissolves; the dispute is verbal but the choice between the rival meanings is itself the substantive issue; the dispute is substantive — and it should say how to tell the second from the third, and why agreeing on every fact does not by itself make a dispute trivial. Be honest about where the procedure cannot decide, including the fact that its central test, whether two people mean the same thing, is itself something the parties can dispute, and about the risk that calling a dispute verbal is just a way of winning it. Keep it to a page, since nobody on the committee will read more. Run it on two cases: whether a particular practice counts as restraint or as protective intervention, and whether our standard's term 'clinician' covers nurses, where both sides agree on everything nurses do. On the first, I am the one who will not like the verdict.
reasoning: |-
  Okay, the user chairs a definitions committee for a professional body. They've had issues where debates get derailed because members use the same terms but mean different things. Specifically, they lost a vote because of a misunderstanding over the word "harm." Now they need a clear, efficient procedure to handle disputes in one meeting. The procedure must resolve whether a disagreement is about words, values, or facts, and end with one of three verdicts. It should also be concise—no more than a page—since committee members won't read lengthy documents.

  First, I need to understand the core problem: semantic confusion leading to wasted time. The user wants a method to quickly identify if a dispute is verbal (different meanings), substantive (value differences), or if it dissolves when clarified. The procedure must be practical, not philosophical, since most members are practitioners. Key challenges include avoiding the trap of dismissing real value conflicts as mere word games and acknowledging that even with agreed facts, disputes aren't trivial—they can reflect deeper disagreements like principles or scope.

  The user provided two test cases. For "restraint vs. protective intervention," the user admits they won't like the verdict, hinting at personal stakes. For "clinician" covering nurses, both sides agree on nurses' roles but disagree on the term. This tests whether the dispute dissolves upon clarification or reveals values about professional identity.

  The procedure should have clear steps: first, state the disputed term and each side's definition. Then, check if they agree on facts. If definitions differ, it might be verbal. But if agreeing on a definition doesn't resolve it, values are likely at play. The verdicts must be distinct: "dissolves" for resolved misunderstandings, "verbal but choice is substantive" when picking a definition reflects values (e.g., "clinician" implying status), and "substantive" for clear value clashes (e.g., safety vs. dignity in restraint).

  I need to be honest about limitations. For example, determining if meanings differ can itself be disputed, and calling something "verbal" might be tactical. The procedure should flag these risks. Also, agreeing on facts doesn't end the debate—it could mask disagreements on implications or priorities.

  For the cases: In "restraint vs. protective intervention," if both agree on the practice's mechanics but one focuses on intent (safety) and the other on effect (coercion), it's substantive—values about dignity vs. protection. In "clinician," if they agree on nurses' roles but dispute inclusion, it's "verbal but substantive" because the term choice affects professional recognition.

  The user's deeper needs: efficiency, avoiding repeat losses, clarity in binding definitions, and managing diverse perspectives without philosophical jargon. They might also want to legitimize value debates rather than suppress them, ensuring the committee doesn't oversimplify complex issues. Unspokenly, they could be seeking tools to navigate personal biases, especially since they'll dislike one verdict, hinting at potential resistance among members.
answer: |-
  Here is a one-page procedure designed for clarity and efficiency, addressing your core concerns:

  **Procedure: Resolving Definitional Disputes**

  **Purpose:** To efficiently determine if a dispute reaching the committee is primarily about word meanings (verbal), about underlying values/principles (substantive), or dissolves upon clarification. To provide a clear verdict guiding committee action.

  **Steps & Questions:**

  1.  **State the Disputed Term/Phrase:** "What specific word or phrase are we disputing?" (e.g., "harm," "restraint," "clinician")
  2.  **State Positions & Definitions CLEARLY:**
      *   "Side A, what do *you* mean by [Term] in this specific context? Please give a concise definition."
      *   "Side B, what do *you* mean by [Term] in this specific context? Please give a concise definition."
      *   *Sufficient Answer:* Concrete, specific criteria or descriptions, not just examples. Aim for "If X, Y, Z are present, it *is* [Term]; if not, it *is not*."
  3.  **Identify Factual Agreement:** "Ignoring the *label* for now, what do you both *agree* happens in the situation/practice/role we're discussing? What are the concrete, observable facts?" (e.g., For nurses: agreed duties, responsibilities; For restraint: agreed physical actions, duration, intent).
      *   *Sufficient Answer:* A mutually confirmed list of non-contested observable realities.
  4.  **Test Definitions Against Facts:**
      *   "Side A, using *your* definition of [Term], do the agreed facts constitute [Term]? Why/Why not?"
      *   "Side B, using *your* definition of [Term], do the agreed facts constitute [Term]? Why/Why not?"
      *   *Goal:* See if disagreement persists *even when definitions are made explicit and applied to agreed facts*.

  **Verdicts & How to Decide:**

  *   **Verdict 1: Dispute Dissolves:** Awarded *only if*, after Steps 1-4, both sides agree they were using the same definition *or* that one definition clearly fits the agreed facts without significant objection, resolving the disagreement.
  *   **Verdict 2: Verbal Dispute (but choice is substantive):** Awarded if:
      *   Definitions differ significantly (Step 2).
      *   Parties agree on *all* relevant concrete facts (Step 3).
      *   Applying their *own* definitions to the agreed facts leads them to logically consistent but opposite conclusions about applying the label (Step 4).
      *   **How to distinguish from Substantive:** The core disagreement *at this point* is purely about **which label to apply** given the facts. However, the *choice* of definition itself often embodies values (e.g., conceptual emphasis, scope, implications for policy). **Why agreeing on facts isn't trivial:** Choosing a definition is a value-laden act with real consequences (e.g., what counts as "harm" triggers certain obligations; who is a "clinician" affects status and scope of practice rules). The dispute becomes substantive *about the definition itself*.
  *   **Verdict 3: Substantive Dispute:** Awarded if:
      *   Parties **disagree on key facts** related to the situation/practice/role (Step 3 fails).
      *   *Or*, even after agreeing on facts and clarifying definitions (Steps 1-4), the disagreement **persists because of conflicting principles, values, priorities, or interpretations of implications** (e.g., "Even if we call it X, the *moral weight* of Y aspect is unacceptable," or "The *consequences* of labeling it Z are too severe"). The core conflict is about **evaluation, judgment, or consequence**, not just labeling.

  **Where the Procedure Can't Decide & Risks:**

  1.  **Meaning is Disputed:** Determining if two people "mean the same thing" (Step 2) relies on self-reporting and interpretation. Parties may genuinely dispute whether their definitions are truly different or equivalent. The committee must make a best judgment.
  2.  **"Verbal" as a Tactic:** Declaring a dispute "verbal" (Verdict 2) *can* be a way to dismiss a genuine value conflict or delegitimize a perspective. **Mitigation:** Verdict 2 *explicitly* acknowledges the significance of the definitional choice and its value-laden nature. It demands the committee then vote on *which definition to adopt* based on values/consequences.
  3.  **Value Conflict Masked:** Deep value disagreements might initially appear definitional. Steps 3 and 4 are crucial to surface this.
  4.  **Committee Judgment Required:** Distinguishing Verdict 2 from Verdict 3 hinges on whether the *only* remaining hurdle is the label itself (V2) or if values/principles *beyond* labeling are contested (V3). This requires careful committee discussion.

  **Outcome:**
  *   **Verdict 1:** Dispute resolved. No vote needed.
  *   **Verdict 2:** The dispute is recognized as definitional, but the *choice* is substantive. **Committee must vote** on which definition to adopt for the standard, debating the values/consequences of each.
  *   **Verdict 3:** The dispute involves fundamental value/factual disagreements beyond definition. **Committee must vote** on the underlying substantive issue after debate.

  ---

  **Applied to Cases:**

  1.  **"Restraint" vs. "Protective Intervention":**
      *   **Step 2:** Side A (You?): "Any physical intervention limiting movement, regardless of intent." Side B: "Only interventions primarily intended as punitive/control, excluding safety-focused holds."
      *   **Step 3:** Agreed Facts: Physical hold used, patient agitated but not immediately violent, intent was safety, lasted 2 mins.
      *   **Step 4:** Side A: "Meets my definition: it physically limited movement = Restraint." Side B: "Does *not* meet my definition: primary intent was safety = Protective Intervention."
      *   **Verdict:** **Verdict 2 (Verbal but Substantive Choice).** Definitions differ significantly. Facts are agreed. Applying definitions leads to opposite labels. The *choice* of definition embodies values: broad scope prioritizing regulation (A) vs. narrower scope distinguishing safety actions (B). **Committee must vote** on which definition to adopt. *(You won't like this, as it highlights the definitional choice IS the value conflict)*.
  2.  **Does "Clinician" Cover Nurses? (Agreed on what nurses do):**
      *   **Step 2:** Side A: "Anyone providing direct patient care requiring clinical judgment." Side B: "Only physicians and physician extenders (PAs)."
      *   **Step 3:** Agreed Facts: Nurses perform assessments, administer meds, develop care plans, use clinical judgment independently in defined scopes.
      *   **Step 4:** Side A: "Facts meet my definition: Nurses are Clinicians." Side B: "Facts do *not* meet my definition: Nurses lack the specific diagnostic/management authority implied by 'Clinician' for us."
      *   **Verdict:** **Verdict 2 (Verbal but Substantive Choice).** Definitions differ (scope of role vs. specific authority). Facts are agreed. Applying definitions leads to opposite labels. The *choice* reflects values about professional hierarchy, scope recognition, and the term's connotations. **Committee must vote** on the preferred definition.
