answer: |-
  ## Gravel Pit Elegy

  **I.**

  Here, where the cracked tile gleams like bone,
  We raised the high-dive platform high.
  Recall the records overthrown
  By boys who learned to split the sky!
  That perfect arc above the town,
  The splash that shook the watching crowd –
  A standard that we must regain, or drown
  In shallow efforts, weak and loud.
  *We must dig deeper.* See this pit?
  Not gravel, but the waiting ground!
  Pour concrete where the echoes sit
  Of laughter, races run, the sound
  Of champions. Forget the silt,
  The rusted pipes, the peeling paint.
  The blue we knew *will* be rebuilt –
  A monument without restraint,
  A mirrored sky for us to claim.
  Ignore the weeds, the pointless drain.
  We’ll build it just the same, the same...
  *We must dig deeper.* Start again.

  **II.**

  This ledge, worn smooth by summer hands,
  That held the towels, bright and thin.
  The faded numbers on the stands
  Where mothers watched their children win
  A ribbon, blue or red or white.
  The grate where feet rinsed chlorine off.
  The lifeguard’s perch, a sunlit height.
  The whistle’s sharp, commanding scoff.
  The shallow end’s mosaic fish,
  Blue scales beneath the rippling sheen.
  The deep end’s cool, forbidden wish.
  The turnstile, stiff, a guarding screen.
  Each tile a story, each crack known,
  A careful ledger we maintain.
  This place was ours, ours alone.
  To pave it flat is mortal pain.
  Let gravel lie. Let weeds take root.
  At least the shape remains, defined.
  New blacktop is a bitter fruit.
  The old foundation, pure, enshrined.
  *We must dig deeper*, hold it fast,
  This perfect, still, unchanging scene.
  Let nothing new be built to last
  Upon this ground, forever green
  With memory. Just let it rest.

  **III.**

  This pit. This wound filled up with stone.
  What bubbled here was never pure.
  The water clear, but cold as bone
  For those kept waiting at the door.
  The chlorine sting masked older stains.
  The laughter echoed, sharp and shrill,
  Across enforced, dividing lanes.
  This concrete bowl served someone’s will.
  Beneath the gleam, a darker bed.
  The gravel fills it, coarse and grey –
  A fitting shroud for what is dead:
  Exclusion practiced day by day.
  The splash was privilege. The dive,
  A plummet into sanctioned pride.
  Nothing thrives here. Nothing alive
  Should grow where fear was fortified.
  To mourn its loss? A hollow sound.
  Let asphalt seal the stagnant ground.
  *We must dig deeper*... tear it down?
  This poisoned earth... are we unbound,
  Or finding roots we’d buried deep,
  Condemning what we helped to keep?

  **Coda**

  Sun bakes the gravel’s dull expanse.
  A yellow tape line marks the edge.
  No water waits. No child’s quick glance.
  Just heat-haze on a future ledge.
  The past is piled, mute and dense.
  What serves life now? It doesn’t speak.
  The bulldozer’s parked, leaning, tense.
  I stand. The answer’s what we seek
  (and build, or guard, or break apart)
  Out on the asphalt, heart by heart.

  ---

  **Notes for the Reader:**

  *   **Movement I (Monumental):** Terza rima variation (interlocking tercets building intensity). Focuses on past greatness ("records overthrown," "champions"), urges emulation ("build it just the same"), escalates ambition ("monument without restraint"). Danger: Ignores decay ("Forget the silt") and context, leading to hollow repetition. Recurring line: "**We must dig deeper**" (literal excavation for rebuilding).
  *   **Movement II (Antiquarian):** Consistent ballad stanzas (ABCB, steady rhythm). Inventories details ("ledge," "numbers," "grate," "fish"). Focuses on preservation ("hold it fast," "let it rest"). Danger: Resents change ("New blacktop is a bitter fruit"), desires stasis, mummifies ("perfect, still, unchanging scene"). Recurring line: "**We must dig deeper**" (cling deeper to the relics).
  *   **Movement III (Critical):** Free verse with short, sharp lines, culminating in a broken/questioning final line. Judges the past ("never pure," "darker bed," "Exclusion," "privilege"). Seeks liberation ("unbound?"). Danger: Confronts complicity ("Condemning what we helped to keep"), risks self-condemnation ("poisoned earth... are we unbound?"). Recurring line: "**We must dig deeper**" (expose the buried truth, break it down?).
  *   **Coda:** Observes the present state, emphasizes the unanswered question ("What serves life now?"), leaves the speaker (and reader) at the threshold ("edge") without resolution. The past ("piled, mute and dense") offers no inherent answer; the future action ("build, or guard, or break apart") is the living community's burden.
  *   **The Object:** The drained, gravel-filled pool, its history of segregation, and its impending transformation are central throughout, grounding the philosophical voices.
