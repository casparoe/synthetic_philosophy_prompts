  The tone must stay relentlessly upbeat—corporate jargon with hidden precision. Avoid explaining terms; e.g., imply mutual vs. common knowledge by how policies are communicated ("cascaded" vs. "common knowledge"). The irrational employee clause should tie to threat credibility without stating it outright. 

