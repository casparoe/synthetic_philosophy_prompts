  Okay, the user writes a science column and struggles with interpreting different types of probabilities—frequencies, credences, propensities. They need a practical decision procedure to handle this quickly. 

  First, I should identify their core pain points: distinguishing probability types, handling reference class conflicts, and avoiding misrepresentation of subjective credence as objective chance. They explicitly want three things: a step-by-step flowchart-like procedure, solutions for reference class issues, and safeguards against conflating belief with fact.

  Hmm... the examples given (flood, risk score, pandemic) are perfect test cases. The flood is likely a frequency-based claim but suffers from reference class problems. The risk score is probably a predictive algorithm output masquerading as propensity. The pandemic forecast is clearly subjective credence but often framed as objective. 

  For the procedure design: it must be linear, under 10 minutes, with clear exit points. Key questions should force source interrogation: "Where does this number come from?" and "What does it claim to represent?" Stopping points need rules like "refuse if source won't answer" or "attach interpretation if ambiguity remains."

  The reference class trap is critical. When frequencies conflict (e.g., 1-in-100-year flood based on local vs. global data), the procedure must demand transparency about the class used and explicitly state the conflict in print. For singular cases like the risk score, it should block "propensity" labeling and force language like "the model predicts..."

  Testing on examples: The flood passes only if the source provides the reference class. The risk score gets flagged—it's not propensity but credence, so we must write "algorithm estimates 70% likelihood." The pandemic forecast gets exposed as expert belief, not cosmic probability. 

  Finally, the procedure's limits: it can't resolve deep philosophical debates. When judgment calls happen (e.g., choosing between conflicting reference classes), the column must disclose the choice rather than present the number as authoritative. Transparency over false precision.

  ...*adjusting mental model*... The user's real need might be preventing readers from misinterpreting probabilities as immutable truths. So the procedure's power lies in forcing epistemic humility—both in the writer's presentation and the reader's understanding.
answer: |-
  Here’s a decision procedure designed for speed and clarity. Keep it on a cheat sheet—**run these questions in order**, stop when you hit a terminal step (**Print Plain**, **Print + Label**, or **Refuse**). Judgment calls are marked with ⚖️.

  ---

  ### **Probability Interpretation Decision Procedure**

  **Step 1: Ask the source: "Where does this number come from?"**  
     *Sufficient answer*: A clear methodology (e.g., "historical flood records," "statistical model," "expert survey").  
     → If vague/unanswered: **Refuse the number**. *Example: "Studies suggest..." isn’t enough.*  
     → If answered: Proceed to Step 2.

  **Step 2: Ask: "What does this number claim to represent?"**  
     *Sufficient answer*: One of three types:  
     - **A)** A *frequency* in a reference class (e.g., "1 in 100 such events per year").  
     - **B)** A *degree of belief/credence* (e.g., "our confidence this will happen").  
     - **C)** A *single-case propensity* (e.g., "inherent chance in this specific instance").  
     → If A (Frequency): Proceed to **Step 3**.  
     → If B (Credence): Proceed to **Step 4**.  
     → If C (Propensity): Proceed to **Step 5**.  
     → If unclear/contradictory: **Refuse the number**.

  #### **FOR FREQUENCY (A)**  
  **Step 3: Demand: "Define the exact reference class."**  
     *Sufficient answer*: Specific population, time frame, and conditions (e.g., "floods in this watershed since 1900," "US defendants with similar profiles").  
     → If not provided: **Refuse the number**.  
     → If provided: **Ask: "Could another defensible reference class give a meaningfully different number?"**  
        - ⚖️ **If NO** → **Print Plain** (e.g., "a 1-in-100-year flood").  
        - ⚖️ **If YES** → **Print + Label**: State the source’s class AND note the conflict (e.g., "a 1-in-100-year flood *based on local records*, though regional models suggest 1-in-80 years").

  #### **FOR CREDENCE (B)**  
  **Step 4: Ask: "Whose belief is this, and how was it generated?"**  
     *Sufficient answer*: Named entity (e.g., "CDC model," "Dr. X’s estimate") and method (e.g., "algorithm trained on past data," "expert consensus").  
     → If not provided: **Refuse the number**.  
     → If provided: **Print + Label**: Explicitly tie the number to the source’s judgment.  
        *Template: "[Source] estimates a [number] chance of [event]"*  
        → **Never** present as objective chance. Add: "This reflects current expert/model assessment, not an inherent property."

  #### **FOR PROPENSITY (C)**  
  **Step 5: Challenge: "Is there a defensible physical mechanism justifying a single-case probability?"**  
     → ⚖️ **Only for quantum phenomena or rigorously defined systems** (e.g., nuclear decay): **Print Plain** (e.g., "a 70% chance this nucleus decays within the hour").  
     → **For anything else (e.g., reoffending risk, pandemic forecasts):**  
        - **Reject the propensity claim**. Return to Step 2 and force reclassification (usually as **B: Credence**).  
        *Rationale: True propensities outside quantum mechanics are philosophically contentious and rarely provable.*

  ---

  ### **Test Runs**

  1.  **"1-in-100-year flood"**  
      - Step 1: Source: "Historical flood gauge data." → **OK**.  
      - Step 2: Represents **A (Frequency)**.  
      - Step 3: Reference class? "Peak flows at this river since 1920."  
        → Conflict? ⚖️ Yes (climate change alters baseline).  
        → **Print + Label**: "a 1-in-100-year flood *based on historical data since 1920*, though recent trends suggest higher modern likelihood."  

  2.  **"Risk model’s 0.7 score for defendant reoffending"**  
      - Step 1: Source: "Algorithm using criminal history, age, employment." → **OK**.  
      - Step 2: Source claims: **C (Propensity)**? Challenge!  
        → Step 5: No quantum mechanism → **Reject propensity claim**.  
        → Re-classify as **B (Credence)** → Step 4: "County court system’s algorithm estimates 70% likelihood."  
        → **Print + Label**: "The county’s risk model scores this defendant at 0.7 (70%), indicating *its assessment* of reoffending likelihood—not an intrinsic probability."

  3.  **"30% chance of a pandemic in the next decade"**  
      - Step 1: Source: "Meta-analysis of expert surveys and models." → **OK**.  
      - Step 2: Represents **B (Credence)**.  
      - Step 4: Whose belief? "Synthesis of 50 epidemiologists and 3 models."  
        → **Print + Label**: "Epidemiologists estimate a 30% chance of a pandemic in the next decade, reflecting *current scientific consensus*."

  ---

  ### **What This Procedure Cannot Do**  
  - **Resolve reference class conflicts** (Step 3 ⚖️): You must decide whether to foreground the source’s class, note alternatives, or contextualize (e.g., "rising sea levels make historical data less reliable"). **Flag in your column**: "While models vary, we cite the [Source]’s class here; others suggest [alternative]."  
  - **Validate credence claims** (Step 4): You report the source’s belief but can’t vouch for its accuracy. **Flag**: "This reflects [Source]’s methodology; other experts disagree."  
  - **Prove "propensity"** (Step 5 ⚖️): Your judgment determines what qualifies (e.g., nuclear decay yes; climate event no). **Flag**: "This probability describes quantum behavior—unlike human systems where chances are estimates."  

  **Core Principle**: Never let a number imply objectivity unless it passes the strictest tests. Force transparency, disclose conflicts, and label beliefs. Your column should **show the seams**—readers distrust hidden judgments.
