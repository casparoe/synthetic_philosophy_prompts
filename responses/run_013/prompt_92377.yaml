answer: |-
  Below is a diagnostic decision tree for your grad reading group on theories of persistence. I've started from the agreed-upon commitment that some ordinary objects (e.g., a person, a river, a chess club) persist through time. Each branch is a concrete case with mutually exclusive answers, designed to force a choice without presupposing theory labels. The tree uses classic cases first to establish core commitments, then novel cases to stress-test alignment and expose inconsistencies. Answers to the novel cases are treated as decisive branches (not footnotes) when they diverge from classic cases.

  ### **Decision Tree: Theories of Persistence**
  **Start:** We agree that at least some ordinary objects (e.g., a person, a river, a chess club) persist—they are the same thing at different times.

  1. **The Poker Case (temporary intrinsics):**  
     A metal poker is hot at noon and cold at 6 PM. Nothing unusual happens—it just cools down. Is the poker at noon *numerically identical* to the poker at 6 PM?  
     - **Yes** (same entity at both times) → **Go to Q2**.  
     - **No** (not the same entity) → **Go to Q5**.  

  2. **The River Case (gappy existence):**  
     A river (e.g., the Colorado) dries up completely for a decade, leaving only a dry riverbed. Later, rain refills it to its original state in the same location. Is the refilled river *numerically identical* to the pre-drought river?  
     - **Yes** (it’s the same river) → **Go to Q3**.  
     - **No** (it’s a new river) → **Go to Q4**.  

  3. **The Cryonics Case (temporary non-existence):**  
     A person is cryonically frozen: their body is preserved at near-absolute zero, with no metabolic activity. After 100 years, they are revived. Is the revived person *numerically identical* to the person before freezing?  
     - **Yes** (same person) → **Leaf: Adverbialism (relativized properties)**.  
       - *Properties are had only relative to a time (e.g., "hot-at-t1"). Solves temporary intrinsics without temporal parts. The river and cryonics cases succeed because identity persists through gaps if properties are time-indexed. Inconsistent with "no" in Q2.*  
     - **No** (different person) → **Leaf: Endurantism (wholly present)**.  
       - *Objects are wholly present at each time they exist. Identity requires continuous existence, so gaps (drought, cryonics) break persistence. Answers "no" to river/cryonics due to discontinuity, but "yes" in poker (continuous) forces adverbialism split.*  

  4. **The Software Case (abstract persistence):**  
     A program (e.g., a game) is saved to disk, shutting down its running instance. Later, it’s reloaded and runs identically. Is the reloaded running instance *numerically identical* to the pre-shutdown instance?  
     - **Yes** (same program instance) → **Leaf: Conventionalism**.  
       - *Persistence is stipulated by conventions (e.g., "same code" or "same function"). Overrides discontinuity in river case. Inconsistent with "no" in Q2 if conventions demand continuity.*  
     - **No** (new instance) → **Leaf: Primitive persistence**.  
       - *Persistence is unanalyzable; no deeper explanation for identity. Answers "no" to river/software due to intuition gaps break identity, but "yes" in poker requires no property relativization.*  

  5. **The Ship Case (material change):**  
     The Ship of Theseus has all its planks replaced one by one over time. The original planks are reassembled into a second ship. Is the continuously maintained ship (with new planks) *numerically identical* to the original ship?  
     - **Yes** (same ship) → **Go to Q6**.  
     - **No** (not the same ship) → **Go to Q7**.  

  6. **The Song Case (type vs. token):**  
     Band A records a song. Years later, Band B re-records it note-for-note. Is Band B’s recording *numerically identical* to Band A’s original recording?  
     - **Yes** (same song) → **Leaf: Stage view (exdurantism)**.  
       - *Only momentary stages exist; persistence is a counterpart relation (e.g., similarity or causal links). The ship is "the same" via counterparts despite material change; the song is "same" via qualitative identity. Inconsistent with "no" in poker if counterparts imply non-identity.*  
     - **No** (different song) → **Leaf: Worm view (temporal parts)**.  
       - *Objects are 4D worms of temporal parts. The ship is identical if the temporal worm is continuous; the song is different because distinct performances are distinct temporal parts. Inconsistent with "yes" in poker if temporal parts imply non-identity.*  

  7. **The Chess Club Case (discontinuous membership):**  
     A chess club disbands. Years later, it is re-founded with the same name, rules, and location, but no overlapping members. Is the re-founded club *numerically identical* to the original club?  
     - **Yes** (same club) → **Leaf: Conventionalism** (as in Q4).  
       - *Stipulation overrides discontinuity (c.f. software/song cases). Inconsistent with "no" in ship case if conventions demand material continuity.*  
     - **No** (new club) → **Leaf: Eliminativism about composites**.  
       - *Only fundamental entities exist; ordinary objects (clubs, ships) are convenient fictions. Persistence claims are false. Answers "no" to all cases, violating the initial commitment.*  

  ---

  ### **Notes on the Tree**
  1. **Unseparated Pairs**:  
     - **Endurantism vs. Primitive Persistence**: The tree separates these via the river case (Q2 → Q3). If both answers "no" to river/cryonics, endurantism is forced (due to continuity requirements); primitive persistence is the fallback when conventions/adverbs are rejected.  
     - **Conventionalism in Q4 vs. Q7**: Both branches lead to the same leaf because conventionalism flexibly handles gaps (software) or reassembly (chess club). The tree doesn’t distinguish subtypes.  
     - **Adverbialism vs. Stage View**: Cleanly separated by the poker case (identity vs. non-identity).  

  2. **Unoccupied Combinations & Why**:  
     - **Eternalism/Presentism Cross-Cuts**:  
       - Presentism + Worm View: Incoherent (temporal parts require past/future to exist).  
       - Presentism + Other Views: Compatible but doesn’t change leaves (e.g., presentist endurantists answer the same as eternalist endurantists).  
     - **"Yes" to Poker Identity + "Yes" to Chess Club Identity**: Only conventionalism allows this, but it requires overriding discontinuity, which is unattractive (no theorists hold it).  
     - "No" to Poker Identity + "Yes" to River Identity: Incoherent—non-identity in a continuous case (poker) but identity in a gappy case (river) violates all theories.  

  3. **Case Ambiguities & Commitments**:  
     - Poker Case: "Numerical identity" is unambiguous—answers must ignore properties (hot/cold) and focus on entity sameness.  
     - River Case: Drying up "completely" implies no water flow or biological activity; refilling is identical in source/path. Natural answer: "no" (gaps break persistence).  
     - Software Case: "Running instance" is the active process in memory. Natural answer: "no" (discontinuity breaks identity), but conventionalism overrides this.  
     - Song Case: Focus on the recording (token), not the abstract song. Natural answer: "no" (different bands, different instances).  

  4. **Earned Keep with Novel Cases**:  
     - If you answer "yes" to poker identity (Q1) but "no" to river identity (Q2), the tree branches to endurantism or primitive persistence—exposing misalignment.  
     - If you reject poker identity (Q1) but accept club identity (Q7), you’re forced into conventionalism—highlighting inconsistency with classic cases.  

  **Leaf Summary** (7 leaves):  
  - Endurantism (Q3 → "No")  
  - Adverbialism (Q3 → "Yes")  
  - Worm View (Q6 → "No")  
  - Stage View (Q6 → "Yes")  
  - Conventionalism (Q4 → "Yes" or Q7 → "Yes")  
  - Primitive Persistence (Q4 → "No")  
  - Eliminativism (Q7 → "No")  

  This tree forces confrontations between classic and novel cases, ensuring theorists can’t cherry-pick answers. If answers to novel cases diverge from classic ones, the tree branches—revealing hidden commitments or inconsistencies.
