prompt: |-
  I'm midway through a qualifying paper on the side-effect effect — the finding that people are markedly more willing to say a foreseen side effect was brought about "intentionally" when that side effect is bad than when it is good — and I've reached the stage where my problem is too many proposed explanations rather than too few. Before I commit to any of them, I want the standard of adequacy written down first. So give me the desiderata: the specification any theory in this area would have to satisfy, not a survey of the contenders. Which phenomena must such a theory reproduce, which patterns must it avoid over-predicting (the cases where the effect should vanish and the cases where it survives), which distinctions must it preserve, and which constraints from neighboring work must it respect? Pair each requirement with the specific case or result that motivates it, and mark which requirements are non-negotiable for any account of the phenomenon and which are merely house preferences of one camp or another.

  To keep this concrete rather than abstract, I'd like the list to be answerable against a handful of cases I've been kicking around, which I suspect do much of the work of separating the accounts. First, the plain asymmetric pair: an executive adopts a policy purely for profit, is told it will also damage the environment, says he doesn't care, and is then judged to have damaged it intentionally — change the side effect to a benefit and the intentionality judgment largely evaporates. Second, a case where the side effect is bad but the agent is conforming to a norm rather than violating one, so the bad outcome is produced by doing exactly what the relevant professional convention prescribes — I take this to bear on whether it is the badness of the outcome or the violation of a norm that is doing the work. Third, a case where the side effect violates a norm with no clear harm at all, and fourth, a case where it violates a norm the respondent herself rejects, to probe whether the effect requires the respondent to endorse the norm. Fifth, a case where the "agent" is an automated system or a firm rather than an individual with attitudes. I want the desiderata written so that they tell me which of these cases each requirement is meant to adjudicate, and I want the tension points named rather than smoothed over.

  If some subset of the requirements looks jointly unsatisfiable, say so explicitly — I have a suspicion that the demand for a single, stable competence account of the concept of intentional action sits badly with the demand to explain judgments that shift with moral valence, and that conflict is the part I most want from this exercise. Skip scoring the named theories against the list; I'll do that myself in the seminar. Close with a single line of the form \answer{...} containing the one requirement you think does the most to exclude candidate theories, followed by the pair you believe cannot be jointly satisfied, separated by a semicolon.
reasoning: |-
  Okay, let me tackle this user's complex request. They're deep into a qualifying paper on the side-effect effect and need clear desiderata for evaluating theories, tied to specific test cases. The key is to extract rigorous standards from existing literature while highlighting tensions between requirements.

  First, I need to identify the non-negotiable requirements. The core phenomenon of asymmetric intentionality judgments (Knobe 2003) must be explained by any viable theory - that's foundational. The norm requirement (Knobe 2010) also seems essential, as it distinguishes badness from norm violation through cases like the conforming doctor. 

  For negotiable aspects, the norm-endorsement question (whether the evaluator must accept the norm) has conflicting evidence from studies like Pettit & Knobe vs. Robinson & Stey. This should be marked as contested. Similarly, representational constraints about non-human agents fall under negotiable desiderata.

  The user's test cases provide perfect anchors: Case 1 (standard asymmetry) justifies the asymmetry requirement; Case 2 (norm-conforming actor) tests the norm-violation criterion; Case 3 (harmless norm violation) probes the harm/norm boundary. Each requirement must explicitly reference which case it addresses.

  The big tension emerges between requirements 1 (asymmetry) and 2 (competence) - how can the concept of intentional action be both stable and valence-sensitive? This theoretical fault line should be foregrounded, with the final answer highlighting this conflict as the major exclusionary pressure on theories.
answer: |-
  Here are the desiderata for a theory of the side-effect effect, structured against your cases and highlighting tensions. Requirements marked **[N]** are non-negotiable for any adequate account; **[C]** indicates contested/negotiable preferences. Each requirement is paired with its motivating case/result.

  ---

  ### **Core Requirements (Non-Negotiable [N])**
  1.  **Asymmetry Reproduction [N]**:  
      *Must reproduce the core asymmetry: significantly higher "intentionally" judgments for foreseen bad side effects vs. good/neutral ones, holding epistemic/control factors constant.*  
      **Motivation**: Standard cases (e.g., Harm/Help scenarios; your *plain asymmetric pair*). **Adjudicates**: Case 1 (Profit/Environment).  
      **Constraint**: Any theory failing here is eliminated.

  2.  **Norm Sensitivity [N]**:  
      *Must explain why *norm violation* (not mere badness) drives the asymmetry. Bad outcomes caused by norm-conforming actions reduce/eliminate the effect.*  
      **Motivation**: Cases where bad outcomes result from norm-adherence (e.g., Knobe’s 2010 *conforming doctor*: a doctor follows protocol, foreseeably worsening a symptom). **Adjudicates**: Case 2 (Bad outcome via norm-conforming action).  
      **Constraint**: Rules out theories attributing the effect *only* to outcome valence.

  3.  **Foresight Necessity [N]**:  
      *Must require the agent’s awareness of the likely outcome. Unforeseen side effects (good or bad) are not judged intentional.*  
      **Motivation**: Control conditions where the side effect is unexpected. **Adjudicates**: All cases (implicit in your descriptions: "foreseen," "told it will").  
      **Constraint**: Rules out "strict liability" or purely causal accounts.

  4.  **Attitude Independence [N]**:  
      *Must predict the effect even when the agent expresses *indifference* (not desire) toward the side effect.*  
      **Motivation**: The canonical "I don't care" response in standard probes (e.g., your Case 1). **Adjudicates**: Case 1 (Executive "doesn’t care").  
      **Constraint**: Rules out theories requiring positive desire for the side effect.

  ---

  ### **Contested/Contextual Requirements (Negotiable [C])**
  5.  **Harmless Norm Violation Robustness [C]**:  
      *Should explain judgments of intentionality for norm-violating actions that cause no tangible harm (e.g., breaking a pointless rule).*  
      **Motivation**: Cases like *arbitrary rule violation* (e.g., Uttich & Lombrozo 2010: violating a "use blue pens" rule foreseeably annoys a colleague). **Adjudicates**: Case 3 (Badness-free norm violation).  
      **Tension**: Some theories tie norm-violation to perceived harm; others treat norms as sui generis.

  6.  **Norm Endorsement Independence [C]**:  
      *Should predict the effect even when the respondent *rejects* the violated norm.*  
      **Motivation**: Cases probing relativism (e.g., Pölzler & Wright 2020: violating norms respondents deem immoral vs. arbitrary). **Adjudicates**: Case 4 (Violating a rejected norm).  
      **Tension**: Empirical data is mixed; some find attenuation when norms are rejected (e.g., Robinson, Stey & Alfano 2019), others minimal effect (e.g., Knobe 2010).

  7.  **Agent-Type Generality [C]**:  
      *Should extend to non-mentalistic agents (e.g., corporations, AI) if their "actions" violate norms.*  
      **Motivation**: Studies extending SEE to organizations/algorithms (e.g., Tannenbaum et al. 2017). **Adjudicates**: Case 5 (Automated system/firm).  
      **Tension**: Challenges theories requiring explicit agent mental states (e.g., belief/desire).

  8.  **Valence-Neutral Competence Baseline [C]**:  
      *Should preserve a core, valence-insensitive concept of intentional action for *primary goals*.*  
      **Motivation**: Symmetry in primary intent judgments (e.g., the CEO *intentionally* increases profits in both Harm/Help cases). **Adjudicates**: All cases (implicit in asymmetry being restricted to side effects).  
      **Tension**: The central conflict with Requirement 1 (Asymmetry).

  ---

  ### **Constraints from Neighboring Work**
  9.  **Compatibility with Broader Intentionality Criteria [N]**:  
      *Must cohere with established non-moral criteria for intentional action (e.g., skill, control, awareness) in philosophy/cognitive science.*  
      **Motivation**: Experimental work on non-moral intentionality (e.g., Malle & Knobe 1997). **Constraint**: Rules out accounts that make moral valence *necessary* for all intentionality judgments.

  10. **Avoid Over-Prediction [N]**:  
      *Must not predict the effect for:*  
      a) *Unforeseen outcomes* (see Requirement 3).  
      b) *Accidental norm conformity* (e.g., an agent unknowingly follows a norm).  
      c) *Failed attempts* (e.g., intending harm but failing).  
      **Motivation**: Control conditions in SEE studies and intentional action literature broadly.

  ---

  ### **Key Tensions & Theoretical Fault Lines**
  - **The Core Tension**: Requirement 1 (Asymmetry) vs. Requirement 8 (Valence-Neutral Competence). If intentionality is a stable, non-evaluative concept, why does moral valence distort it *reliably and systematically*? Hybrid theories (e.g., "trade-off" accounts) struggle to resolve this without compromising conceptual stability.
  - **Normativity vs. Harm**: Requirement 2 (Norm Sensitivity) vs. Requirement 5 (Harmless Norm Violation). If norm-violation suffices (without harm), intentionality becomes detached from prototypical moral scenarios. But if harm is necessary, Case 3 challenges the account.
  - **Mental State Requirements**: Requirement 7 (Agent-Type Generality) pressures theories relying on agent attitudes (e.g., "blameworthy belief" accounts). If firms/AI elicit the effect, mentalism may be insufficient.

  ---

  \answer{**Norm Sensitivity [N]**; **Asymmetry Reproduction [N]** vs. **Valence-Neutral Competence Baseline [C]**}
