  Okay, the user is diving deep into causation by omission and wants a clear set of desiderata before they start writing. They've listed several points they think are important, but they're unsure if they've covered everything or if some items are just specific to certain philosophical camps. Their main goal is to understand when inaction causes harm, especially in policy contexts, so they need a theory that's practical, not just abstract.

  First, I need to address each point they mentioned. They brought up basic cases like the gardener not watering the plant, failing to warn someone, etc. These are essential examples any theory must handle. The flip side—where counterfactuals hold but we don't attribute causation—is also crucial. Then there's the distinction between omitting versus merely not doing something. That's a big metaphysical debate: are omissions real events or just descriptions? 

  Next, the profligacy problem. If every possible omission counts as a cause, causation becomes meaningless. How do theories limit which omissions are relevant? This ties into the selection problem: why is not watering the plant the cause, not all the other things the gardener didn't do? The user suspects normative factors (duties, expectations) might be necessary here, not cheating. That's a key insight. 

  Double prevention cases, like removing a barrier, add complexity. Is the account unified or separate for omissions vs. regular causation? Extensionality matters too—should the description of events affect causal claims? The user also wants to know how this relates to but-for causation and legal doctrines. Should the theory align with law or challenge it?

  The user suspects that demanding a purely metaphysical solution without normative elements might be unrealistic. They're probably right. Many theories sneak in pragmatics through the back door. Highlighting where consensus exists (like the need for counterfactuals) versus where it's contested (like the ontology of omissions) will help them. 

  They care about policy applications, so a theory that can't handle real-world cases like medical negligence or policy failures won't suffice. Pointing out the trade-offs, like how incorporating normativity helps with selection but might make the theory less objective, is important. The profligacy problem is a major hurdle for theories that avoid pragmatic factors, so that's a critical desideratum. 

  In the end, structuring the desiderata clearly, separating settled vs. contested issues, and emphasizing practical applicability will meet their needs. They need to know which requirements are non-negotiable and which are debated, so they can navigate the literature without getting bogged down by partisan views.
answer: |-
  Here’s a distilled, critical list of **desiderata for any adequate theory of causation by omission**, based on your concerns and the core challenges in the literature. I’ll explicitly flag settled points, contested issues, trade-offs, and which desiderata conflict or eliminate popular accounts.

  ---

  ### **Core Desiderata: What a Theory Must Deliver**
  1. **Handle Basic Cases Correctly**  
     - **Must:** Explain paradigmatic omissions (gardener not watering → plant dies) *and* flip-side cases (e.g., "I didn't water the plant on Mars" → plant dies: counterfactual holds but causation denied).  
     - **Settled:** All theories accept these cases as data points.  
     - **Contested:** *Why* some counterfactuals are causal and others aren’t.

  2. **Resolve Profligacy**  
     - **Must:** Prevent "everything causes everything" (e.g., your failure to water *and* mine *and* the Pope’s all "causing" the plant’s death).  
     - **Critical Trade-off:**  
       - *Option A:* Use **non-causal factors** (norms, duties, expectations) to select "relevant" omissions.  
       - *Option B:* Insist on **purely metaphysical constraints** (e.g., "default states" or "causal fields").  
     - **Knockout Effect:** Pure counterfactual/process theories (e.g., David Lewis) fail here without pragmatic additions.

  3. **Solve the Selection Problem**  
     - **Must:** Explain why *not-watering* (vs. not-singing-to/not-fertilizing) is the cause.  
     - **Settled:** *All* theories implicitly/explicitly appeal to **salience** (expectations, norms, duties).  
     - **Contested:** Whether this salience is part of *causation* itself (e.g., Schaffer) or a separate *attribution* layer (e.g., Moore).  
     - **Your Suspicion is Correct:** Avoiding normative/pragmatic ingredients here is nearly impossible for real-world applicability. Theories that try (e.g., Dowe’s physical process theory) struggle with policy cases.

  4. **Clarify Ontology of Omissions**  
     - **Must:** Address whether omissions are:  
       - (a) Real absences in the world (e.g., voids),  
       - (b) Mental constructs (inferences from expectations), or  
       - (c) Merely descriptive.  
     - **Contested:** Deep split between **realists** (absences are causal relata) and **eliminativists** (omission-talk is shorthand for norms/counterfactuals).  
     - **Settled:** No consensus. Your policy focus likely needs *some* realist commitment to ground responsibility.

  5. **Account for Double Prevention**  
     - **Must:** Handle cases like "Removing a plug → water drains → fire spreads", where an omission (plug-absence) is a causal link.  
     - **Settled:** Most theories accept these as genuine causal chains.  
     - **Contested:** Whether this is the *same relation* as positive causation.

  6. **Unification vs. Pluralism**  
     - **Must:** Decide if omission-causation is:  
       - (a) Same relation as event-causation (unified), or  
       - (b) A distinct, second-class relation (pluralism).  
     - **Contested:** Unificationists (e.g., counterfactualists) vs. pluralists (e.g., Hall).  
     - **Knockout Effect:** Pluralism avoids profligacy but risks making omissions "less causal".

  7. **Extensionality**  
     - **Must:** State whether causal claims depend on *how events are described* (e.g., "not watering" vs. "not giving H₂O").  
     - **Settled:** Omission causation is **intensional** (description matters).  
     - **Contested:** Whether this is a bug (e.g., for scientific causation) or a feature (for responsibility contexts).

  8. **Interface with Law/Responsibility**  
     - **Must:** Explain when omissions ground blame/liability (e.g., doctor not prescribing → death).  
     - **Settled:** Law uses **duty-based norms** to filter omissions.  
     - **Contested:** Whether the *causal theory* should build in norms (e.g., Honoré) or leave them to attribution (e.g., Hart & Honoré).

  ---

  ### **Critical Tensions & Trade-offs**
  | **Desideratum Pair** | **Conflict** | **Viable Theories?** |
  |----------------------|--------------|----------------------|
  | **Profligacy Resolution** + **No Normative Ingredients** | Norm-free accounts can’t solve selection/profligacy | Only highly constrained metaphysical theories (e.g., "default states"), but these fail policy cases. |
  | **Unification** + **Profligacy Avoidance** | Unifying omission/event causation forces profligacy | Pluralist theories (e.g., Hall) sacrifice unity for control. |
  | **Extensionality** + **Legal Compatibility** | Law needs intensionality; some metaphysics demand extensionality | Counterfactual theories (Lewis) allow intensionality but struggle with profligacy. |

  ---

  ### **Settled vs. Contested Issues**
  | **Issue** | **Settled?** | **Contested?** | **Notes** |
  |-----------|--------------|----------------|-----------|
  | Omissions require counterfactual dependence | ✓ | | All theories accept this as necessary (but not sufficient). |
  | Norms/duties filter *relevant* omissions | ✓ | | Even critics concede norms are needed for selection. |
  | Omissions are not perceived but inferred | ✓ | | Consensus: we don't "see" absences. |
  | **Whether omissions are genuine causes** | | ✓ | Realism (Schaffer) vs. Eliminativism (Beebee) is the deepest split. |
  | **Whether causation by omission = event causation** | | ✓ | Core divide between unificationists and pluralists. |
  | **How to solve profligacy without norms** | | ✓ | No successful purely metaphysical solution exists. |

  ---

  ### **Key Implications for Your Project**
  - **Avoid "Toy Theories":** Pure metaphysicians (e.g., Dowe) often sidestep profligacy/selection. You need a theory that incorporates **normative pragmatics** (duties, context) for policy relevance.  
  - **Winning Combo for Policy:**  
    1. **Omissions as causes** (realism),  
    2. **Counterfactual dependence** as baseline,  
    3. **Normative constraints** (duties/expectations) to resolve selection/profligacy.  
    *(This aligns with legal practice and theorists like Honoré or Schaffer.)*  
  - **Biggest Roadblock:** Profligacy. If your theory can’t non-arbitrarily limit which omissions count as causes, it fails. Normative ingredients are the only viable solution.  
  - **Most Contentious Requirement:** *"Omissions must be genuine causes"* → Eliminativists (e.g., Beebee) say omission-talk is *only* about responsibility, not causation. Realists (e.g., Schaffer) argue this undermines accountability.

  **Bottom Line:** Your suspicion is correct—**rejecting normative/pragmatic factors is unsustainable** for a policy-useful theory. Focus on accounts that explicitly integrate norms (e.g., Schaffer’s contrastivism, Honoré’s responsibility-first view) or hybrid models (e.g., McGrath’s norm-relative causation). Avoid theories that treat omissions as "secondary" causes or ignore legal applications.
