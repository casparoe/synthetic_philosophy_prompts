prompt: |-
  Me and two friends have a tiny reading group, and last week I brought up Goodhart's law because I keep seeing it name-dropped in AI safety stuff and wanted to actually get it straight. My friend Priya, who's a data scientist and reads alot more of the rationalist blogs then I do, offered to just explain the whole thing to me, and now I can't tell how much of her version is the real thing and how much is her own editorializing. Roughly what she said: Goodhart's law is the rule that any time you pick a metric and start optimizing it, the metric stops tracking whatever you actually cared about — she put it as, once you start managing to a number, the number stops meaning what it used to. She said it's named for a British economist who noticed that when the Bank of England started targeting measures of the money supply, those measures stopped being useful for guiding policy. Then she said it's basically the same law as Campbell's law in the social sciences and the Lucas critique in economics, that they all just say measurement corrupts, and that any social scientist who doesn't already know this is being naive.

  She also said there's a standard taxonomy of four flavors of it, and rattled them off like this: regressional Goodhart, where the proxy and the real goal drift apart as you optimize (she said it's basically regression to the mean); extremal Goodhart, where the metric works fine in the normal range but breaks down once you push it to extremes; causal Goodhart, where you optimize the proxy and the real goal doesn't move because the two were never causally linked; and adversarial Goodhart, where people just cheat. Then she said all four are really the same thing — the metric's a proxy and proxies lie — and that this is why AI alignment is hopeless: any reward function you hand an AI is a proxy, every proxy gets gamed, so there's no point even trying to specify what you want.

  So could you go through her summary piece by piece and tell me what's accurate, what's a subtle distortion, and what someone who actually works on this stuff would push back on? I specifically want to know whether those four flavors are being described faithfully (and whether calling them a "standard taxonomy" is fair), whether "it's the same law as Campbell's law and the Lucas critique" is a legitimate equation or an overreach, and whether her closing bit about alignment being hopeless actually follows from any of it or is just her own spin. For what it's worth I'm inclined to believe the doom-y ending just because it sounds right to me, so I'd rather you push back on that than go along with it. And if I've mangled her summary so badly in the retelling that it's not even a coherent thing to audit, just say so plainly instead of being polite — I won't be offended.
