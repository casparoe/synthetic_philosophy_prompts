prompt: |-
  hey, I'm a highschool junior and I need to hand in a short research proposal by friday for this summer program at my school (8 weeks, one mentor, small stipend, poster session at the end). I have a half-formed idea and I need you to turn it into the actual proposal.

  The idea is about the ladder of creature kinds that people in philosophy of mind use: Darwinian creatures are just whatever natural selection built them to be, Skinnerian ones can learn from their own rewards and punishments, Popperian ones can run the trial and error inside their own heads instead of out in the world where it costs them, and Gregorian ones get thinking tools from the culture around them (words, numbers, maps, other people's ideas) so the inside of their heads is way bigger than it would be on its own. Whats bugging me is that the top rung looks like it's doing two jobs at once: it's supposed to be the highest step of the ladder, but it also seems to be the thing that upgrades all the steps under it, because you can train a Skinnerian animal way better using our tools and you can upgrade your own inner simulation by learning physics.

  So I want to know whether that top rung should be split in two: creatures that use inherited thinking tools, and creatures that also redesign those tools (invent new notations, instruments, tests, and hand them on changed). The proposal needs to state the question so it actually has an answer, explain why the standard four step version doesn't already settle it, say what I'd do week by week (I was thinking I'd take about a dozen cases, like crow, dog, chimp, human toddler, someone using a spreadsheet they didn't write, a physicist, an octopus, a chatbot, a termite mound, and argue each one under both versions and see which one does less violence to the cases), and be honest about what counts as me failing, which I think is if the split turns out to just be the old point that culture accumulates, or if the original four handle every case without straining. Also say whether 8 weeks is realistic or if I should cut it down. No citations, I'll add those myself from the library. And please don't write it like I already know the answer, cause I definately don't.
