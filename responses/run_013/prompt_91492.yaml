answer: |-
  ## Brainstorm (147 words)
  *   **Setting:** Clammy church basement, folding chairs, lingering funeral flowers. Auction post-burial for debt settlement.
  *   **Object:** 1973 Ford F-100, rusted, unreliable, but the narrator Sam’s sole link to his gruff, distant father. Worth maybe $300 scrap.
  *   **Cast:**  
      *   *Sam (Narrator):* Grieving son, needs the truck’s intangible legacy.
      *   *Jake:* Sam’s father’s former mechanic, fired years ago over disputed repairs. Wants the truck as vindication, a trophy.
      *   *Auctioneer Silas:* Polished, enjoys the subtle cruelty of his rules. Explains clearly but neutrally.
  *   **Escalation Engines:**  
      1.  *Sunk Cost:* "I’ve bid $X already..."
      2.  *Consistency/Self-Image:* "Can’t back down now/Let him win?"
      3.  *Mutual Hostage:* "He *has* to win too, he’s trapped as well."
  *   **Exit Attempt:** Sam’s sister proposes a coin flip at $500. Rejected by both as "unfair" after their investment.

  ## The Truck

  The basement air clung, thick with dust, grief, and the waxy scent of funeral lilies wilting beside the coffee urn. Folding chairs scraped concrete. Silas Vance, the auctioneer, stood where the pulpit might be, his smile polished like the brass eagle lectern behind him. Dad’s life was laid out on tables: chipped crockery, warped paperbacks, tools sticky with old grease. And the truck.

  Dad’s ’73 F-100 sat outside, a hulking silhouette beyond the streaked basement windows. More rust than blue, the bed floor a lattice of holes, the engine a symphony of knocks. Worth scrap. To me, it was the smell of oil and cut grass, the cracked vinyl seat where I’d sat silent while he drove, the only thing he’d ever seemed to truly own. Now it was Lot 14.

  Jake Miller leaned against the back wall. Dad fired him ten years back, accused him of billing for phantom repairs on this very truck. Jake swore it was Dad’s neglect. Bad blood simmered ever since. His eyes, hard and flat, hadn’t left the window since we’d filed in.

  “Lot Fourteen,” Silas announced, his voice smooth as butter in a warm pan. “Nineteen seventy-three Ford F-100 pickup. Sold as-is, where-is. Important rules, folks.” His gaze swept the room, faintly amused. “Highest bidder pays their bid *and* gets the truck. Second-highest bidder pays their bid… and gets nothing. Clear? Let’s start at fifty dollars.”

  “Fifty!” My voice sounded too loud.

  “Seventy-five!” Jake’s call was a challenge.

  We traded fifty-dollar increments, easy, mechanical. $100. $150. $200. The room watched, a low murmur building. At $250, the rhythm faltered. Scrap value.

  “Two-fifty,” I repeated, my palms damp. I’d already bid more than it was worth. But I couldn’t *not* have it. That $250 felt like an anchor.

  Jake hesitated. “Three hundred.” His jaw tightened. Backing down meant admitting defeat, swallowing that old injustice all over again. He *had* to beat me.

  “Three-fifty,” I shot back. The sunk cost coiled in my gut. *I’ve put in $350 already. Walking away wastes it all. Just a little more…* The truck wasn’t worth $350. But losing it *after* bidding $350? Unthinkable.

  “Four hundred.” Jake’s knuckles were white on the chair back. The room held its breath. This was madness.

  My sister, Ellie, leaned close, her whisper urgent. “Sam, stop! This is insane. Flip a coin for it right now. Loser pays the winner… $250? Split the loss?” A lifeline. Rational. Clean.

  For a second, it hung there. Escape. Then Jake met my eyes. Pure defiance. He’d bid $400. Taking a coin flip now, risking losing *and* paying me? After he’d pushed it this far? “No deal,” he rasped.

  My own refusal surprised me. “No.” *I’m in it now. I’m the one who won’t let Jake take it.* Consistency hardened into stubbornness. $400 felt like a line drawn. “Four-fifty.”

  “Five hundred.” Jake didn’t blink. The air crackled.

  *$500.* Half a thousand for scrap. My throat closed. But then I saw it – the sweat beading on Jake’s temple, the tremor in his hand as he raised it. He was trapped too. He *had* to win. He’d sunk $500 into proving a point to a dead man. Letting me win now? It would break him worse than the firing. He *couldn’t* stop. Which meant… I could push.

  “Six hundred,” I said, the number ash in my mouth. It wasn’t about the truck anymore. It was about making Jake pay more to beat me. Making his ‘victory’ hollow.

  Jake’s face drained of color. He understood the same about me. We were locked in mutual destruction. “Seven hundred,” he choked out.

  “Eight.” My voice was flat.

  “Nine.” His was a whisper.

  “One thousand dollars.” The words fell into utter silence. A thousand dollars. For the truck. For Dad’s ghost. For beating Jake Miller into the dirt.

  Jake stared at the floor. A full minute passed, the only sound Silas’s quiet, expectant presence. Jake shook his head once, sharply. Defeated. Broken.

  “Sold!” Silas’s gavel cracked like a gunshot. “To the gentleman for one thousand dollars.”

  I stood, numb. Jake didn’t look up. He just pulled a worn wallet from his overalls and counted out nine hundred-dollar bills onto a nearby table, his movements stiff, robotic. Payment from the second-highest bidder. For nothing.

  Silas accepted my check for a thousand with a small, satisfied nod. His profit was clear: my thousand plus Jake’s nine hundred. Nineteen hundred dollars. For a truck worth three.

  Outside, the late afternoon sun glinted dully on the F-100’s battered hood. I touched the flaking paint. Jake walked past me towards an ancient sedan, shoulders slumped, not acknowledging my existence. He carried his loss like a physical weight.

  The engine turned over with its familiar, unhealthy grumble. I sat in the cracked vinyl seat, the ghost smell of Dad faint in the stale air. I had the truck. I’d won. The engine coughed, sputtered, and died. Silence pressed in, heavy with the cost.
