answer: |-
  The monsoon had retreated, leaving the hills above the town washed clean and steaming. Inside the low, brick building of the Starhill Tea Cooperative, the air hung thick, not just with humidity, but with the concentrated green scent of thousands of withering leaves. And beneath it all, a whisper Farida knew better than her own breath: the ghost of smoke.

  For twenty years, Farida had sat at the long, scarred wooden table, a chipped porcelain spoon her sceptre. Her job was singular: to taste each batch from Dryer #3 and pronounce it clean or tainted. The dryer ran hot, a temperamental beast older than her tenure. Sometimes, a wisp of overheated metal, a breath of scorched dust, would kiss the tea leaves. Not enough to ruin them, not enough for most palates to even register, but enough – if it slipped through – to earn a complaint from the exacting buyers overseas who prized Starhill’s delicate floral notes above all. Enough to make Farida indispensable.

  She dipped the spoon into the shallow bowl of liquor – Batch #427. Amber-gold, clear. She inhaled, letting the steam fill her sinuses. The first notes were always bright, vegetal, the promise of high-altitude freshness. Then, deeper. She swirled, sipped, held the liquid on her tongue, letting it coat every crevice. Her eyes closed. There. Not a flavour, not quite. A *texture*. A dryness at the very back, a faint rasp against the throat after the swallow. Like the memory of woodsmoke on the wind, hours after the fire is out.

  Clean. Definitely clean. She opened her eyes, scratched a ‘C’ on the slate beside the bowl. Prakash, the young floor manager, hovering nearby, exhaled audibly and whisked the bowl away. He treated her pronouncements like scripture.

  But walking home later, the damp earth scent of the hillside path replacing the tannic air of the factory, the certainty began to blur. Batch #427. Had that dryness been the taint? Or was it just the particular briskness of this flush? Her own palate, perhaps, a little tired after a long day? She remembered Batch #212, three seasons back. She’d signed it ‘C’ with absolute conviction, only for the complaint to come back: *faint smokiness detected*. She’d tasted the returned sample then, blind. And yes, the dryness was there. Clear as day. How had she missed it? Or… had she *known* then, too, and simply been wrong about her knowing?

  That was the crack, the place the light got in and made everything uncertain. The gap between a truly clean batch and one touched by the dryer’s breath was vanishingly small, smaller than the difference between two pristine batches from different slopes. Her knowledge felt solid in the moment, tasting – a weight in her chest, a clarity in her head. *Yes. Clean*. Or *Yes. Tainted*. But later, turning it over, that sureness became just another sensation, as fleeting as the taste itself. Could she truly *know* she knew? Or was she merely confident, riding the wave of twenty years of habit and the respectful silence of Prakash?

  She passed the long, low shed housing Dryer #3. Its deep, rhythmic hum vibrated through the soles of her sandals. A warm, slightly metallic smell seeped out – the smell of the beast itself, not its taint. She paused. Inside that hum was the potential for the dryness. It existed in the world, independent of her tongue. She *knew* it existed. She’d tasted its absence and presence countless times. But pinning down the exact moment *she* knew, the exact state of her mind when certainty crystallized… that was like trying to isolate the precise raindrop that started the landslide.

  She remembered the philosophy podcast her nephew had played for her during a visit to the city – something about the mind’s conditions never being truly luminous, never fully self-illuminating. She hadn’t understood all the words, but the feeling resonated. *Luminous*. Like the golden glow of perfect tea liquor. Her knowledge felt luminous in the tasting room. Walking home in the fading light, it felt opaque, muddy.

  One rainy afternoon, a tricky batch came through. Batch #519. The liquor was perfect. The aroma, complex and inviting. She sipped. Swirled. Sipped again. Her brow furrowed. There was… something. A hint of that dryness? Or was it just the sharper character of leaves harvested after a cold snap? She closed her eyes, focusing entirely on the aftertaste. It was like trying to hear a single instrument in a distant orchestra. She *felt* confident. She felt the weight of decision settle. *Tainted*. Barely, but there. She marked the slate ‘T’.

  Prakash looked surprised, then concerned. "Are you sure, Farida Aunty? The moisture readings were perfect…"

  *Was* she sure? The question, voiced aloud, landed like a stone in the pit of her stomach. In the moment of tasting, she *had* been. Absolutely. The knowledge had felt complete, contained. Now, confronted by Prakash’s doubt, the memory of the taste itself seemed to shift. Had the dryness been real, or had she *imposed* it, expecting the taint because the conditions were borderline? Did she *know* Batch #519 was tainted? Or did she only *believe* she knew? The distinction, which felt like bedrock in the tasting room, now felt like mist.

  She insisted on the ‘T’. The batch was set aside for blending into a lower grade. But the doubt didn’t leave her. It followed her home, sat with her while she ate her simple dinner. Had she just condemned good tea? Or saved Starhill’s reputation? She genuinely couldn’t say. The feeling of certainty she’d experienced was undeniable, vivid. But was it a signpost to truth, or just a weathervane spinning in the wind of her own perceptions?

  Years of tasting, thousands of decisions, were supposed to build an unshakeable edifice of knowledge. Instead, they felt like a path worn deep into uncertain ground. She knew the taint existed. She knew she could usually find it. But the knowing *that* she knew, the bright, infallible light the philosophers seemed to think should accompany true knowledge… that light flickered. Sometimes it burned steady, convincing her utterly. Other times, like now, walking home under a sky bruised purple with twilight, past the humming dryer shed, she held her own certainty in her hands and felt its edges soften, its core become ambiguous. It wasn’t a lie, her confidence. It was real, powerful. But it wasn’t the same as a luminous truth shining within her, untouched by doubt or the shadow of a nearly identical, untarnished leaf. The gap between feeling sure and knowing you know yawned beneath her, silent and deep as the valley below, filled only with the scent of tea and the fading echo of the dryer’s hum.
