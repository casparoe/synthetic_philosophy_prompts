answer: |-
  ## Examination Question: Shared-Hazard Crisis Model (Total: 30 Marks)

  **Background:** Consider two states (A and B) in a crisis over a valued stake. Each simultaneously chooses an escalation posture, \(h_A \geq 0\) and \(h_B \geq 0\). These postures represent hazards (e.g., alert levels, delegation of launch authority), *not* direct weapons. While neither state backs down:
  1.  **War Onset:** General war occurs as the first event of a Poisson process with rate \(\lambda = h_A + h_B\). If war occurs, State A suffers cost \(C_A > 0\), State B suffers cost \(C_B > 0\).
  2.  **Crisis Duration:** Time until resolution (either war or one state backing down) is discounted at a common rate \(r > 0\).
  3.  **Resolution:** If State A backs down first, B wins the stake (value \(V_B > 0\)) and A gets nothing. If B backs down first, A wins the stake (value \(V_A > 0\)) and B gets nothing. Holding firm *itself* imposes no direct cost beyond the hazard.
  4.  **Mechanism:** Escalating \(h_A\) increases the *instantaneous* probability that B backs down per unit time, denoted \(p_B(h_A)\) (with \(p_B'(h_A) > 0\)), and vice versa for \(p_A(h_B)\) (with \(p_A'(h_B) > 0\)). Backing down is irreversible.

  **Tasks:**
  **(a)** (10 Marks) Explain how State A, even if it *could not credibly intend* to deliberately start a war, can nevertheless gain coercive leverage over State B by increasing \(h_A\). Why does the *shared* nature of the hazard (\(\lambda = h_A + h_B\)) matter for this mechanism? What would go wrong with this logic if State A could perfectly control whether its *own* escalation (\(h_A\)) would trigger war, making it purely intentional?
  **(b)** (10 Marks) Identify the externality inherent in each state's choice of \(h\). Derive the condition (in terms of the slopes of State A's and State B's best-response functions) under which a unilateral reduction in State A's posture (\(h_A\)) would *decrease* the total equilibrium probability of war occurring. Explain why this condition cannot be assumed to hold a priori in a deterrence relationship and describe the *type* of evidence needed to assess it.
  **(c)** (10 Marks) Consider the claim: "The *total* expected risk of war (over the long term) is conserved. Measures reducing the *frequency* of crises (\(1 / \text{mean time between crises}\)) are paid for by an increase in the expected *depth* (i.e., hazard rate \(\lambda\)) of the crises that do occur, leaving the product roughly constant." Does the model imply this claim as a theorem? If not, what specific additional assumptions would be needed to make it a theorem? Propose a falsifiable version of this claim suitable for empirical investigation.

  ---

  ## Model Answer (Approx. 750 words)

  **(a) Coercion via Shared Hazard:** State A gains leverage by raising \(h_A\) not through an intention to start war, but by manipulating the shared, uncontrolled risk environment. Increasing \(h_A\) directly raises the total hazard rate \(\lambda = h_A + h_B\). This increases the *immediate* probability per unit time that war occurs, imposing higher expected costs on *both* states for continuing the crisis. Crucially, since State B knows that escalating its own posture (\(h_B\)) further increases this shared risk, State B becomes more inclined to back down to avoid these accumulating costs. The mechanism works because:
  1.  **Increased Cost of Holding Firm for B:** A higher \(\lambda\) means State B faces a greater discounted expected cost of war *while* holding firm: \(\int_0^\infty \lambda e^{-(r+\lambda)t} C_B  dt = \frac{\lambda C_B}{r + \lambda}\).
  2.  **Induced Concession:** This increased cost makes backing down (forfeiting \(V_B\)) relatively more attractive to State B. The function \(p_B(h_A)\) captures this effect – a higher \(h_A\) makes B more likely to concede per unit time. State A benefits by increasing the chance it wins \(V_A\) through B's concession, without needing to *want* war.

  The shared hazard is essential. Because \(\lambda\) depends on *both* \(h_A\) and \(h_B\), State A's escalation \(h_A\) directly imposes risk on State B. If State A could perfectly control whether \(h_A\) triggered war (making it purely intentional), the mechanism breaks down. In this scenario:
  *   Raising \(h_A\) would only signal a higher *intention* to deliberately start war.
  *   However, if State A truly finds deliberate war irrational (cost \(C_A\) too high relative to \(V_A\)), it could not credibly commit to this intention. Threatening to deliberately start war would be "cheap talk".
  *   Crucially, the *uncontrolled, shared* aspect – where war can happen accidentally due to the combined hazard even if neither state *wants* it – is what allows a state to credibly impose risk via \(h_A\) without needing the incredible intention of self-destruction. The risk is inherent in the *situation* created by the postures, not solely in State A's mind.

  **(b) The Externality and Risk Reduction Condition:** The externality arises because when State A chooses \(h_A\), it considers the benefit (increased \(p_B(h_A)\), increasing its chance of winning \(V_A\)) and its *own* expected war costs (\(\frac{(h_A + h_B) C_A}{r + h_A + h_B}\)), but it **does not internalize** the additional risk its posture imposes on State B, namely the increase in State B's expected war cost due to the higher \(\lambda\). State A ignores \(\frac{\partial}{\partial h_A} \left[ \frac{(h_A + h_B) C_B}{r + h_A + h_B} \right]\). Similarly, State B ignores the extra risk its \(h_B\) imposes on State A.

  Let \(BR_A(h_B)\) be State A's optimal \(h_A\) given \(h_B\), and \(BR_B(h_A)\) be State B's optimal \(h_B\) given \(h_A\). The equilibrium is \((h_A^*, h_B^*)\) where \(h_A^* = BR_A(h_B^*)\) and \(h_B^* = BR_B(h_A^*)\). The total equilibrium hazard is \(\lambda^* = h_A^* + h_B^*\).

  A unilateral reduction in \(h_A\) (below \(h_A^*\)) will decrease the total equilibrium hazard \(\lambda^*\) **if and only if the best-response functions are *strategic substitutes* at the equilibrium point.** This means that an *increase* in one state's posture leads to a *decrease* in the other state's optimal posture. Formally, the condition is:
  \[\frac{\partial BR_B(h_A)}{\partial h_A} < 0 \quad \text{and} \quad \frac{\partial BR_A(h_B)}{\partial h_B} < 0\]
  AND the magnitude of the cross-effects is sufficiently strong relative to own-effects (ensuring the equilibrium is stable under tâtonnement).

  **Why not a priori?** This condition is not guaranteed by deterrence logic alone. Deterrence could plausibly lead to **strategic complements** (\(\frac{\partial BR_B}{\partial h_A} > 0\)), where one state's escalation *triggers* escalation by the other (e.g., "if they raise readiness, we must match it"). In this case, a unilateral reduction in \(h_A\) could lead B to *increase* \(h_B\), potentially *raising* \(\lambda^*\). The sign and magnitude of these slopes are empirical questions contingent on how states *actually* react to each other's posture changes within the crisis bargaining environment.

  **Relevant Evidence:** Assessing this requires evidence on the **slopes of the best-response functions**. This could involve:
  1.  **Historical Case Studies:** Close analysis of crises to see if one side's observable increase in hazard posture (e.g., DEFCON level, patrols) typically led the other side to escalate, stand pat, or de-escalate *in the short term*.
  2.  **Military Exercises/Doctrines:** Examining whether doctrines or reactions in simulated crises show patterns of matching escalation (suggesting complements) or restraint/reciprocated de-escalation (suggesting substitutes).
  3.  **Crisis Simulation Experiments:** Observing how human participants playing the roles of national leaders adjust their chosen hazard levels in response to controlled changes in the opponent's level.

  **(c) Risk Conservation: Model Assessment and Falsifiable Claim:**
  *   **Is it a Theorem?** No, the model does **not** imply risk conservation as a theorem. The discount rate \(r\) and the non-linear relationship between hazard \(\lambda\) and the probability of war occurring within *any given* crisis (\(P(\text{War} | \text{Crisis}) = \frac{\lambda}{r + \lambda}\)) break potential conservation.
  *   **Required Assumptions:** To make conservation a theorem within this model structure, several strong assumptions would be needed:
      1.  **No Discounting (\(r = 0\)):** The value of future stakes/costs isn't diminished over time.
      2.  **Separable Crisis Probability:** The probability of a crisis *starting* must be modeled as an exogenous constant rate (\(\phi\)) independent of the states' posture choices *outside* of crises. The model given only describes posture *within* a crisis.
      3.  **Fixed Stakes & Costs:** \(V_A, V_B, C_A, C_B\) must be constant across crises.
      4.  **Identical Crisis Dynamics:** The functions \(p_A(h_B)\), \(p_B(h_A)\), and the equilibrium relationship between \(h_A\), \(h_B\), and \(\lambda\) must be identical in every crisis.
      Under these assumptions, the long-run average rate of war onset *might* be proportional to \(\phi \times \frac{\lambda^*}{r + \lambda^*}\). If \(r=0\), this becomes \(\phi \times 1 = \phi\), meaning total war risk *would* be solely determined by the exogenous crisis frequency \(\phi\), independent of the endogenous hazard \(\lambda^*\) during crises – achieving conservation. Relaxating any of these assumptions breaks it.
  *   **Falsifiable Claim:** A testable version of the risk conservation hypothesis is: "Across historical periods (or comparable dyads), a significant *negative* correlation exists between the frequency of militarized interstate crises (MIDs) and the *average* hazard level (\(\lambda\)) observed during those crises, such that the product (MID Frequency) \(\times\) (Average \(\lambda\)) remains approximately constant." This product would be a proxy for the long-term war rate. Evidence showing a strong negative correlation supporting constant product would support conservation; a weak correlation or positive correlation would falsify it. Crucially, this claim distinguishes the concept (correlation between crisis frequency and depth) from the empirical reality.

  ---

  ## Marking Scheme (Total 30 Marks)

  | **Mark** | **Must-Hit Point**                                                                                               | **Common Error (Costs Mark)**                                                                 |
  | :------- | :--------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- |
  | **3**    | **(a) Correctly identifies increased hazard raises opponent's cost of holding firm via shared λ.**               | Attributing leverage *only* to increased chance of deliberate war by A.                       |
  | **3**    | **(a) Explains perfect control (intentional trigger) breaks mechanism by reverting to cheap talk problem.**      | Stating perfect control still works, or not contrasting shared/uncontrolled vs. intentional.  |
  | **4**    | **(b) Correctly defines externality: Imposing risk on opponent not fully internalized in choice of h.**          | Misidentifying externality (e.g., focusing only on winning stake, not risk cost).             |
  | **4**    | **(b) Correct stability condition: Strategic Substitutes (∂BR_B/∂h_A < 0 & ∂BR_A/∂h_B < 0).**                    | Stating reduction *always* lowers risk, or missing sign/dependence on slopes.                 |
  | **3**    | **(b) Identifies evidence needed: Slopes of best-response functions (complements vs. substitutes).**             | Vague reference to "deterrence strength" or "resolve" without linking to reaction functions.  |
  | **4**    | **(c) Correctly states conservation is NOT a theorem; highlights role of discount rate (r).**                    | Asserting model implies conservation or missing critical role of discounting.                 |
  | **3**    | **(c) Proposes falsifiable claim: Negative correlation between crisis frequency & average hazard depth (λ).**    | Proposing an unfalsifiable claim or one not separating frequency and depth.                   |
  | **3**    | **(c) Identifies key assumption for theorem: No discounting (r=0) AND separable crisis probability (φ).**        | Missing r=0 or not recognizing need for exogenous crisis rate φ.                              |
  | **3**    | **Overall: Clear, structured reasoning; key variables/mechanics used correctly.**                                | Unfocused answer, misusing model elements (e.g., confusing h with weapons, λ with P(war)).   |

  **Notes:**
  1.  Marks within a part are cumulative; hitting the point clearly gets the mark.
  2.  Part (b) slopes condition: Award 2 marks for identifying strategic substitutes concept, +2 for correct formal partial derivative signs and linking explicitly to risk reduction.
  3.  Part (c) assumptions: Award 1.5 marks each for clearly identifying r=0 *and* separable crisis prob (φ).
  4.  "Overall" mark rewards precision and correct model application across the answer.
