answer: |-
  ## Hexapod Trust: Frequently Asked Questions

  **What is the mission of the Hexapod Trust?**
  Our mission is to reduce suffering within the vast populations of terrestrial arthropods (primarily insects, spiders, and related invertebrates), guided by the principles of expected value and moral uncertainty. Given the astronomical number of these creatures potentially subject to harm (estimated at 10^18 to 10^19 individuals alive at any moment), even a vanishingly small probability of sentience per individual generates a significant expected suffering burden. We work to identify and implement the most effective interventions to reduce this burden.

  **Why focus on insects instead of vertebrates?**
  We care deeply about vertebrate welfare. However, our calculations using the **Sentience-Adjusted Insect-Year (SAIY)** metric consistently show that the expected suffering reduction achievable per dollar spent in the insect domain potentially outweighs interventions for vertebrates like chickens or fish. Even assigning a very low probability of sentience (e.g., 0.0001%) to a typical insect, when multiplied by the sheer population size and the intensity of suffering caused by common threats (agricultural pesticides, habitat destruction, parasitism), results in an aggregate expected suffering figure that demands attention. We allocate resources based on expected impact, not just certainty.

  **What is a Sentience-Adjusted Insect-Year (SAIY)?**
  The SAIY is our core metric. One SAIY represents one year of life experienced by one insect, adjusted by our best estimate of the probability that insects of that type possess morally relevant sentience. For example:
  *   If we assign a 0.01% probability of sentience to a common fruit fly (*Drosophila melanogaster*), one fruit fly living for one year contributes 0.0001 SAIYs.
  *   However, one *billion* fruit flies living for one year contribute 100,000 SAIYs.
  Our interventions are evaluated based on the estimated reduction in total SAIYs achieved per dollar. This allows us to compare vastly different populations and threats on a common scale, accounting for deep uncertainty about consciousness.

  **How do you handle the uncertainty about insect sentience?**
  We explicitly incorporate moral and empirical uncertainty into our models:
  1.  **Probability Weighting:** We maintain a probability distribution over different theories of consciousness (e.g., Integrated Information Theory, Higher-Order Thought theories). Each theory assigns different likelihoods to sentience in various insect neural architectures.
  2.  **Credence Splitting:** Our funding allocation reflects splitting our credence across these theories. A portion of our budget targets interventions effective *if* even simple insects like flies are sentient, another portion targets interventions relevant only *if* more complex insects like bees or ants are sentient, and a significant portion funds research to narrow this uncertainty.
  3.  **Robustness Checks:** We prioritize interventions that remain cost-effective across a wide range of plausible sentience probabilities.

  **What specific actions does the Hexapod Trust take?**
  Our work falls into three main streams:
  1.  **Research:** Funding foundational neuroscience and behavioral research on insect cognition and potential indicators of valenced experience (suffering/pleasure). This is crucial for refining our SAIY probabilities.
  2.  **Advocacy & Policy:** Engaging with agricultural regulators, pesticide manufacturers, and the horticulture industry to:
      *   Promote the development and adoption of faster-acting, less potentially agonizing insecticides ("reformist" approach).
      *   Advocate for integrated pest management (IPM) strategies that drastically reduce reliance on broad-spectrum insecticides ("abolitionist-leaning" approach).
      *   Explore habitat modification to reduce parasitic fly burdens on wild animals.
  3.  **Public Awareness:** Educating the public about the scale of potential insect suffering and encouraging individual actions that minimize harm (e.g., alternatives to backyard pesticide use, careful outdoor lighting to reduce fatal attraction).

  **I notice different emphases within the Trust. Why?**
  Hexapod Trust is a coalition of thinkers united by the core SAIY calculus but differing in strategic priorities:
  *   **The Abolitionists:** Focus on eliminating insecticide use entirely, viewing any probability of sentience as unacceptable given the scale. They prioritize IPM and radical habitat shifts.
  *   **The Reformists:** Argue that abolition is currently infeasible and counterproductive. They focus on measurable near-term SAIY reduction by making existing killing methods (e.g., pesticides) potentially less distressing, based on extrapolations from known vertebrate pain pathways and insect nociception.
  *   **The Research Prioritizers:** Believe reducing uncertainty about sentience probabilities is the highest-leverage activity. Until we know *which* insects (if any) matter morally, they argue, large-scale interventions are premature or misdirected. They dominate our scientific grant-making.
  Robust internal debate, grounded in shared SAIY metrics, helps us refine our overall strategy. Quarterly impact assessments using updated SAIY models guide resource allocation between these streams.

  **Isn't it hypocritical that your staff inevitably kill insects?**
  We acknowledge this profound challenge. While minimizing incidental harm (e.g., vegan packed lunches eaten indoors, walking instead of driving where possible), we recognize that existence in the modern world involves unavoidable arthropod fatalities. Therefore:
  *   **The Hexapod Offset Scheme:** All salaried staff participate. We calculate the estimated SAIYs unavoidably incurred by each staff member annually (based on commute, diet, housing, etc.). Staff then donate proportionally to the Trust's most cost-effective SAIY-reduction projects, effectively offsetting their expected impact. Participation is mandatory for full-time staff and strongly encouraged for part-time and remote workers. We publish our offset methodology annually for transparency.

  **How can I support the Hexapod Trust?**
  Financial contributions are vital for scaling our research, advocacy, and awareness work. Every dollar is allocated based on rigorous SAIY-reduction potential modeling. We also welcome volunteers with relevant skills (scientific, policy, communications) and encourage spreading awareness about the potential scale of insect suffering. Visit our Donate page for options. Remember, impact is measured in expected SAIYs averted – your support leverages the mathematics of scale against deep uncertainty.
