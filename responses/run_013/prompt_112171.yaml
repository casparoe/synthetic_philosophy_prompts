  **Research Proposal: Decoding the Genetic Code - A Study of Two Notions of Information in Molecular Biology**

  **Introduction**
  Molecular biology is saturated with informational vocabulary: DNA is said to "code for" traits, genes "carry information," and cellular processes involve "signals" and "messages." This language has sparked a philosophical debate that bifurcates into two seemingly irreconcilable positions. One camp treats genetic information as a semantic notion, akin to linguistic representation, where genes can misrepresent (e.g., in cases of mutation) and where the arbitrariness of the codon-amino acid mapping is taken as evidence of genuine coding. The other camp treats it as a purely causal or structural notion, wherein information is defined by correlations (e.g., as in Shannon information theory) and misrepresentation is deemed incoherent. My dissertation chapter proposes that this bifurcation is artificial, rooted in an ambiguity in the term "code." Specifically, I distinguish between *encoding* (a relation that can be specified without reference to users, conventions, or functions) and *ciphering* (which inherently depends on such elements). If this distinction holds, the debate over whether genes "represent" is largely verbal. The substantive question becomes: Which notion—encoding or ciphering—does the explanatory work in actual biological practice, and does this vary across contexts (e.g., error correction, alternative splicing, epigenetic inheritance, or selfish genetic elements)? This proposal outlines a plan to answer this question through conceptual analysis and case studies, with the goal of producing a chapter draft that reframes the debate and illuminates the pragmatic utility of informational language in biology.

  **Why the Existing Positions Leave the Question Open**
  The current literature presents a false dichotomy. The semantic camp (e.g., Maynard Smith, Sterelny) emphasizes the arbitrariness of the genetic code and the possibility of misrepresentation to argue that genes function like symbols. The causal-structural camp (e.g., Sarkar, Griffiths) rejects this, arguing that informational talk is either metaphorical or reducible to causal correlations. However, both positions overlook the possibility that "code" is used in two distinct senses in biology. The semantic camp conflates ciphering (which requires conventions) with encoding (which does not), while the causal camp dismisses all semantic talk by focusing solely on encoding. Consequently, neither addresses whether the explanatory success of informational descriptions in biology relies on ciphering-like properties (e.g., in contexts where error correction or epigenetic regulation occurs) or whether encoding suffices. The question remains open because neither camp has disentangled these two notions of code.

  **The Encoding-Ciphering Distinction: A Better Cut**
  I propose that the core ambiguity lies in the concept of a "code":
  - *Encoding* is a mapping relation that is fixed by natural laws or structures, without requiring intentions, users, or conventions. For example, the mapping between DNA sequences and amino acids is encoding if it is solely determined by the chemical affinities of tRNA and the ribosome.
  - *Ciphering*, in contrast, is a mapping that depends on contextual conventions or functions. For instance, the Morse code is a cipher because its dots and dashes arbitrarily represent letters only by human convention.

  This distinction is not a redescription of the semantic/causal divide because both encoding and ciphering can be seen as "informational." Crucially, encoding can exhibit arbitrariness (e.g., the codon-amino acid mapping could have been different if evolution had taken another path) without invoking conventions—it is fixed by evolved biological mechanisms. Ciphering, however, requires something external to the mapping itself to establish the convention. This reframes the debate: the question is not whether genes "represent" but whether the biological systems that use genetic information function more like encoders (relying on fixed structural mappings) or decoders (relying on convention-like rules). This is an empirical-conceptual question about biological practice.

  **Method: Conceptual Analysis and Case Studies**
  I will pursue a two-pronged approach:
  1. *Conceptual Analysis*: Clarify the encoding/ciphering distinction and argue for its theoretical utility over existing frameworks. This will involve analyzing philosophical and biological texts to identify how "code" is used and whether it aligns with encoding or ciphering.
  2. *Case Studies*: Examine four biological contexts where informational language is prominent and see which notion of code is at work:
     a. *Error Correction*: DNA repair mechanisms (e.g., proofreading by DNA polymerase).
     b. *Alternative Splicing*: How spliceosomes "interpret" pre-mRNA sequences.
     c. *Transgenerational Epigenetic Effects*: Inheritance of methylation patterns.
     d. *Selfish Genetic Elements*: Transposons or meiotic drive systems that spread without organismal benefit.

  For each case, I will conduct a close reading of primary biological literature (e.g., key papers and reviews) to determine: (1) whether explanations invoke user-dependent conventions (ciphering) or structural mappings (encoding); (2) whether misrepresentation is discussed as a functional failure; and (3) whether the "arbitrariness" of the mapping is treated as contingent or conventional.

  **Timeline (5 months total)**
  - Month 1: Conceptual groundwork—refine the encoding/ciphering distinction and draft a framework for analysis.
  - Month 2: Case study 1 (Error Correction) and Case study 2 (Alternative Splicing).
  - Month 3: Case study 3 (Epigenetic Effects) and Case study 4 (Selfish Elements).
  - Month 4: Synthesize results, identify patterns across cases, and address counterarguments.
  - Month 5: Write the chapter draft, integrating conceptual and empirical insights.

  **Deliverable and Success Criteria**
  Deliverable: A draft chapter (approx. 8,000–10,000 words) for the dissertation.  
  Success Criteria:  
  1. A clear defense of the encoding/ciphering distinction as superior to the semantic/causal dichotomy.  
  2. Evidence from case studies showing that one or both notions are operative in biological explanations.  
  3. A demonstration that the distinction resolves apparent contradictions in the literature.  
  4. A framework for predicting when ciphering-like properties emerge (e.g., in systems with error correction).  

  Failure Conditions:  
  1. The case studies reveal no clear pattern, leaving the question unresolved.  
  2. The encoding/ciphering distinction collapses under analysis (e.g., it maps too neatly onto the existing camps).  
  3. Biological practice is too heterogeneous to support any general claims.  
  4. The distinction proves irrelevant to explanatory practice.  

  **Why Not the Obvious Alternatives?**  
  - *Declaring informational talk metaphorical*: This dismisses the heuristic and explanatory power of informational language in biology without explaining why it works where it does.  
  - *Asking what biologists "really mean"*: This presumes a uniform intention behind the language, but biologists may use "code" ambiguously; the goal is to see what work the language does, not to psychoanalyze scientists.  
  - *Adopting a pluralist stance*: While appealing, pluralism without a framework (like encoding/ciphering) risks being unilluminating; my approach provides a structured way to parse the pluralism.  

  **Scope, Risks, and Objections**  
  *Scope and Risks*: This is a semester-long project, but it risks uncovering deeper questions (e.g., about the nature of biological functions) that could expand the scope. I mitigate this by focusing on a tractable set of cases. A key risk is that the distinction may not be as clear-cut in practice; I address this by allowing for hybrid cases.  

  *Objections and Replies*:  
  1. *Objection*: The encoding/ciphering distinction is just the semantic/causal divide in disguise.  
     *Reply*: No—encoding can be arbitrary without being semantic (e.g., the genetic code's arbitrariness is fixed by evolution, not convention), and ciphering can be causal (e.g., in engineered systems). The distinction is about the role of context-dependence, not truth-aptness.  
  2. *Objection*: Both notions are present in biology, so the project only catalogs the obvious.  
     *Reply*: The goal is not just to catalog but to show *which* notion does the explanatory heavy lifting in key contexts and why that matters for philosophical debates.  
  3. *Objection*: This is a purely linguistic dispute with no scientific implications.  
     *Reply*: Clarifying the language can refine biological models—e.g., if ciphering is involved, it may imply functional teleology that could be tested.  

  **Conclusion**  
  This project reframes a stalled debate in philosophy of biology by introducing a novel distinction that captures the ambiguity in "genetic code." By focusing on biological practice, it promises to show how informational language earns its keep, paving the way for a more nuanced view of representation in biology. The deliverable—a chapter draft—will advance my dissertation and set the stage for future work on biological information.

