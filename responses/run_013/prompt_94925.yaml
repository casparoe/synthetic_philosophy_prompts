answer: |-
  Here's a comparative analysis of the two readings of Gongsun Long's "White Horse" argument, their engagement with the objection, their semantic requirements, their relationship to the "Hard-and-White" puzzle, and an assessment of their philosophical seriousness:

  **1. Reading 1: Non-Identity ("White Horse" is not the same *Name/Term* as "Horse")**

  *   **Interpretation of "fei"**: "Is not identical to" (referring to the *names* themselves).
  *   **Core Claim**: The compound name "white horse" (bái mǎ) is not identical to the simple name "horse" (mǎ). "White horse" carries a specific determination (whiteness) that "horse" lacks. The *reference* of "white horse" is a subset of the reference of "horse," but the *names* themselves are distinct semantic units with different intensions (concepts).
  *   **Answering the Objector ("If you have a white horse, you have a horse")**:
      *   **Concession**: The reading readily *agrees* that in terms of reference/extension, a white horse *is* a horse. Having a white horse entails having a horse.
      *   **Distinction**: However, this is a statement about *objects in the world*. The argument is about *names and their meanings*. The objection conflates the level of reference (what the names point to) with the level of sense or name-identity (the semantic content of the names themselves). "Having" concerns objects; the argument concerns the precision and distinctness of *names*.
  *   **Required Notion of Name/Kind**: Names are not mere labels for classes of objects. They are precise designators of specific *determinations* or *aspects* of reality. A name's meaning (its "pointing," *zhǐ*) is defined by its unique set of defining characteristics. "Horse" points to the characteristic *horseness* (shape, function). "White" points to the characteristic *whiteness* (color). "White horse" points to the *combination* of both characteristics. Its meaning is not reducible to either component alone, nor to the simple name "horse".
  *   **Semantic Apparatus**: Names designate determinate aspects or "pointings" (*zhǐ*). Meaning is compositional but distinct; a compound name creates a new, unique semantic unit.

  **2. Reading 2: Non-Membership (A White Horse is not a *Member* of the Kind "Horse")**

  *   **Interpretation of "fei"**: "Is not a member of" or "does not belong to" (referring to kind-membership).
  *   **Core Claim**: The kind "white horse" is *not* included within the kind "horse." What satisfies the criterion "white horse" (possessing *both* whiteness *and* horseness) does *not* satisfy the criterion for "horse" (possessing *only* horseness). Since the criteria differ, the extensions are disjoint.
  *   **Answering the Objector ("If you have a white horse, you have a horse")**:
      *   **Rejection**: This reading must *reject* the intuitive force of the objection. It argues that the objection rests on a mistaken view of kind-membership based on accidental properties or common sense, not rigorous definition.
      *   **Argument**: To be a member of kind K, an object must satisfy *only* the defining criterion of K. A white horse satisfies the criterion "white horse," which includes whiteness. The criterion "horse" excludes any specific color determination (it's color-neutral). Therefore, satisfying "white horse" means it *fails* to satisfy the pure criterion "horse" (because it brings along an extraneous property, whiteness). Having a white horse means you have something that *fails* to be a pure instance of "horse."
  *   **Required Notion of Name/Kind**: Kinds are defined by absolutely strict, necessary, and sufficient conditions. Membership is all-or-nothing based solely on satisfying the single, precise definition associated with the name. Kinds are mutually exclusive if their defining criteria differ. "Horse" designates *pure, abstract horseness*, devoid of any other determinations like color. "White horse" designates a distinct abstract kind defined by the inseparable conjunction of horseness and whiteness.
  *   **Semantic Apparatus**: Names designate extremely abstract, Platonic-like kinds defined by single essences. Compositionality is problematic; "white horse" designates a fundamentally different kind than "horse," not a sub-kind.

  **Comparison with the Hard-and-White Puzzle**

  *   **The Puzzle**: Can hardness and whiteness both inhere in the same stone? They are known through different senses (touch vs. sight) and seem logically distinct. Gongsun Long argues they are separate entities (*shí* and *bái* are "separated and hidden from each other").
  *   **Semantic Apparatus Required**: This puzzle demands the same core apparatus as **Reading 1 (Non-Identity)**: Names ("hard," "white," "stone") designate *determinate aspects* or properties known through specific sensory/cognitive channels. "Hardness" points to a tactile quality, "whiteness" to a visual quality. These are distinct *pointings* (*zhǐ*).
  *   **Application of Reading 1's Apparatus**:
      1.  "Hard" (*shí*) designates the determinate aspect of resistance known by touch.
      2.  "White" (*bái*) designates the determinate aspect of color known by sight.
      3.  These are distinct names with distinct meanings and distinct modes of apprehension.
      4.  The "stone" (*shí* - homophone, but distinct concept) is the *substrate* or *object* in which these separate properties inhere. "Stone" points to yet another aspect (e.g., material unity, location).
      5.  The puzzle arises because the *properties* ("hard", "white") are known distinctly, yet we attribute them to the *same object* ("stone"). The semantic apparatus explains the distinctness of the property-names while allowing for their co-inherence in an object named differently ("stone"). The challenge is explaining the unity of the object *given* the radical distinctness of the property-pointings.
  *   **Incompatibility with Reading 2's Apparatus**: Reading 2's strict kind-membership struggles here. Is the stone a member of the kind "hard thing" or "white thing"? If kinds are mutually exclusive based on differing criteria, how can one object belong to both "hard things" (defined by tactile resistance) and "white things" (defined by visual color)? Reading 2 would likely be forced to say the hard stone and the white stone are different kinds/objects, denying co-inherence, which is deeply counterintuitive. Reading 1's focus on distinct aspects predicated *of* an object handles this far better. The **additional distinction** demanded by Hard-and-White is the need for a concept of a *substrate* or *bearer of properties* ("stone") distinct from the property-names themselves ("hard," "white"). The White Horse argument primarily deals with compound properties vs. simple properties, not necessarily the object substrate.

  **Assessing Philosophical Seriousness**

  *   **Reading 1 (Non-Identity) makes the School of Names look engaged in serious semantics**. It focuses on crucial distinctions in language and thought: sense vs. reference, the meaning of compound terms, the precision required in naming, and the relationship between distinct aspects of reality. It acknowledges the truth of the objection ("a white horse is a horse") at the referential level while insisting on a vital semantic distinction at the level of meaning and naming. This resembles sophisticated analyses in modern philosophy of language (Frege's Sense/Reference, intensional logic). It provides a coherent framework applicable to both the White Horse and Hard-and-White puzzles.
  *   **Reading 2 (Non-Membership) risks appearing as sophistry**. Its denial that a white horse is a horse seems blatantly counterfactual and violates basic logic and common sense. While it might aim for extreme logical rigor in defining kinds, its conclusions are so divorced from linguistic reality and ontological intuition that it becomes difficult to see it as anything other than a clever paradox designed to puzzle rather than illuminate. It struggles to handle the Hard-and-White puzzle plausibly. To be seen as anything other than sophistry, **Reading 2 would have to concede** that it is discussing *abstract, ideal kinds* or *pure definitions* rather than concrete objects or linguistic usage. It would need to argue that "horse" *only* refers to the pure essence of horseness abstracted from all other properties, and that concrete objects (like white horses) never fully instantiate this pure kind, only the compound kind "white horse." This is a highly artificial and ontologically loaded position, but conceding it moves it away from straightforward sophistry towards a peculiar form of conceptual realism or essentialism. However, it remains far less defensible and less fruitful for understanding language than Reading 1.

  **Conclusion**

  The Non-Identity reading of the White Horse argument (focusing on the distinctness of names/terms) is far more defensible as serious semantics. It leverages the ambiguity of *fei* to highlight the difference between identity of meaning and co-reference. It requires a semantic apparatus where names designate determinate aspects (pointings, *zhǐ*), an apparatus which successfully extends to explain the distinctness of the properties in the Hard-and-White puzzle while accommodating their co-inherence in an object. The Non-Membership reading, while logically possible by interpreting *fei* strictly and positing hyper-abstract kinds, produces deeply counterintuitive results that struggle with the objection and the Hard-and-White puzzle, making it vulnerable to charges of sophistry unless heavily qualified by concessions about abstracta and pure essences. The School of Names, through Reading 1, emerges as engaged in a profound investigation into the relationship between language, reality, and perception.
