prompt: |-
  OK so I'm a second-year PhD student in philosophy of science — my own work is on causal inference in epidemiology, so I'm a bit of a tourist in formal epistemology — and my supervisor has voluntold me to give a 90-minute guest session in a colleague's MSc course on the foundations of statistics. The audience is stats and clinical epi masters students: they can do the maths fine, they've all had measure-theoretic probability, but they've never had to think about what probability *is* philosophically, and honestly most of them think the philosophy part is a soft add-on they can skip past to get to the estimators.

  The topic is the reference class problem. I don't need you to explain it to me — I need a teaching plan. What has to be in place before the problem even registers as a problem for them (my hunch is the first move has to be getting them to see that probabilities attach to events-under-a-description rather than to the events themselves, but tell me if that's wrong or if something else has to come first); then the order the pieces go in, so that by the end they see why the "just condition on everything you know" line doesn't get you out — they will ALL say this in the first ten minutes, I guarentee it — and why more data doesn't rescue you either. I want one case that carries the whole session: a single concrete scenario we come back to three or four times and that gets harder each time we look at it. My instinct is something actuarial or clinical, a person who is simultaneously a member of two or three classes with genuinely different base rates and no fact of the matter about which class is *the* class, maybe with an insurance-pricing or medico-legal payoff so they feel the stakes. But I don't want the coin, the lottery, or Sleeping Beauty as the carrying case — they've seen all of those and they'll coast. Tell me what the case needs to have and what it must not have (a case where one class is obviously the right one would kill the whole point).

  Then the misconception map: which misconceptions they'll arrive with — I'm expecting "it's a problem for frequentists, not Bayesians", "the narrowest or most specific class wins", "this is just the problem of induction wearing a hat", "the right reference class is whatever the data says it is" — and exactly where in the sequence I should head each one off, plus one or two they'll form *during* the session that I won't see coming. The thing I care about most: one question to ask at the end that would actually tell me whether they've got it, as opposed to whether they can recite the dialectic back at me. And finally, what to cut. I have 90 minutes and I know I'll want to talk about the exchangeability move and about how this bites in risk prediction and recidivism scoring; I'd rather cut one of those cleanly and say out loud that I'm cutting it than rush both.
reasoning: |-
  Okay, this is a detailed and very specific teaching request from a philosophy of science PhD student. They need to teach stats masters students about the reference class problem in 90 minutes, and they're clearly frustrated by the students' likely dismissal of philosophy. 

  First, let's unpack their core requirements: They want a single concrete case study that can be revisited throughout the session, with increasing complexity. It must avoid classic examples (coins, Sleeping Beauty) and shouldn't have an obvious "correct" reference class. They also need a misconception map and a diagnostic end-question. 

  Hmm... the actuarial/clinical case idea is smart. Insurance underwriting or medical prognosis would resonate with epi students. Key elements for the case: 
  - Must have competing reference classes with equally defensible but conflicting probabilities 
  - Should involve real stakes (money, health outcomes) 
  - No meta-data to resolve ambiguity (like class sizes) 
  - Should allow layering: start simple, add complexity later

  A prostate cancer screening case might work well: 
  - Patient is 68yo Black male former smoker with family history 
  - References classes: race-specific risk, smoking history, age bands, familial risk 
  - Each class gives different probability of aggressive cancer 
  - Stakes: decision to get invasive biopsy with complications risk 

  For misconceptions... yes, "just condition on everything" will be their first instinct. Need to destroy that early by showing it leads to singleton classes with undefined probabilities. Also anticipate: 
  - "Frequentism vs Bayesianism" confusion (it hits both) 
  - "Specificity trumps" fallacy 
  - "More data solves it" (actually exacerbates by creating more classes) 

  The teaching sequence should be: 
  1. Establish that probabilities are description-relative (use quick case variant) 
  2. Introduce base case with two conflicting classes 
  3. Have them suggest "condition on all attributes" -> demonstrate paradox 
  4. Show that narrowing classes creates instability 
  5. Discuss why this isn't just induction problem (it's about attribution, not prediction) 

  Must-cut decision: Exchangeability vs recidivism. Since they mentioned clinical epi audience, keep risk prediction. Exchangeability might feel too abstract. 

  Diagnostic end-question: "If two actuaries used different defensible reference classes to set this patient's insurance premium, how would you adjudicate?" Tests if they see the inescapable arbitrariness. 

  ...wait, should also preempt the "but in practice we use ML models" objection. Maybe add a slide showing how risk scores inherit the problem through feature selection.
answer: |-
  Here's a battle-tested teaching plan designed to make stats/epi students *feel* the reference class problem in their bones. The goal is to shift them from "this is a philosophical quibble" to "this breaks foundational assumptions in *my* work."

  **Core Teaching Strategy:** A single, progressively complex clinical case study (prostate cancer screening) with high-stakes decisions. We return to it 4 times, layering complexity.

  ### The Anchor Case: "Mr. Jones' Prostate Dilemma"
  * **Base Scenario (Minimal V1):**  
    Mr. Jones, a 68-year-old man, has an elevated PSA test result (a biomarker for prostate cancer). What's the probability he has *aggressive* prostate cancer (needing biopsy/treatment)?  
    *Initial Data Points (Show these):*  
    - P(Aggressive Cancer | PSA Elevated, Age 60-70) = 8%  
    - P(Aggressive Cancer | PSA Elevated, **Family History of Prostate Cancer**) = 15%  
    *Reveal:* Mr. Jones has a family history.  
    **Q1: Which probability applies? 8% or 15%? Why?** *(Let debate begin. Expect "Use family history!"/Specificity)*

  * **V2: Adding Conflicting Specificity:**  
    Reveal more about Mr. Jones: He is a **Black man** and a **former smoker**. Add data:  
    - P(Aggressive Cancer | PSA Elevated, Age 60-70, **Black**) = 12%  
    - P(Aggressive Cancer | PSA Elevated, Age 60-70, **Former Smoker**) = 10%  
    - P(Aggressive Cancer | PSA Elevated, Age 60-70, **Family History**) = 15% (as before)  
    **Q2: Now what's his probability? 8%, 10%, 12%, 15%? Is there a single "right" class?** *(Highlight conflict: Race? Smoking? Family? All seem relevant. No class is clearly "narrowest" or universally "most specific").*

  * **V3: The "Condition on Everything" Trap:**  
    Students *will* say: "Just condition on ALL attributes! Use: `PSA+, 68yo, Black, Former Smoker, Family History`."  
    *Drop the Bomb:* Show an (imagined) study result:  
    `P(Aggressive Cancer | PSA+, 68yo, Black, Former Smoker, FamHx) = 19%`  
    **Q3: Problem solved? Is this *the* probability for Mr. Jones?**  
    *Reveal the Catch:* The study finding 19% was based on **n=12 patients** meeting *all* criteria. CI: (5%, 40%).  
    **Key Insight:** Conditioning on everything creates a singleton or tiny cell. The probability becomes highly unstable, data-starved, and *useless for individual prediction*. It doesn't escape the problem; it collapses into a different problem (insufficient data).

  * **V4: Why More Data Doesn't Save You (The Fracturing):**  
    "But with big data, we *can* get stable estimates for fine-grained classes!"  
    *Counter:* Introduce **novel genetic marker G** (present in Mr. Jones). New studies show:  
    - P(Agg Cancer | PSA+, 68yo, Black, FamHx, **G+**) = 25%  
    - P(Agg Cancer | PSA+, 68yo, Black, FamHx, **G-, Smoker**) = 7%  
    *(Mr. Jones is G+ and Former Smoker)*  
    **Q4: Is 25% his probability? What about smoking? Do we need a class including G+ *and* smoking status?**  
    **Crucial Point:** Every new relevant variable discovered *fractures* existing reference classes. The "most specific" class is always provisional and disappears with new knowledge. There's no stable endpoint.

  ### The Teaching Sequence & Misconception Busting (90 Min)
  **(0-5 min) Hook:** "Mr. Jones needs a decision. Biopsy risks sepsis. Watchful waiting risks metastatic cancer. His risk % dictates the choice. How do stats/epi give us *the* number?" (Show V1, get initial gut reactions).

  **(5-15 min) Probabilities Attach to Descriptions, Not Events:**  
  *   **Activity:** Flip a coin hidden in your hand. "Probability it landed Heads?" (They say 50%). Reveal it *did* land Heads. "Now, probability it landed Heads?" (100%).  
  *   **Key Point:** The *event* (this coin flip) is fixed. The *probability* changed based on the *description/knowledge state* ("a fair flip" vs. "this observed flip"). Probability is always relative to a description/model/data. **Mr. Jones V1 reinforces this:** Two descriptions (Age-band vs. FamHx), two probabilities for the *same event*.

  **(15-25 min) Introducing the Reference Class Problem (RCP) via V2:**  
  *   Define RCP formally: The problem of selecting the appropriate general class (reference class) to which an individual belongs, in order to assign them a single-case probability, when multiple equally justifiable classes yield conflicting probabilities.  
  *   **Mr. Jones V2:** Explicitly show the conflict (8% vs 10% vs 12% vs 15%). **Bust Misconception 1: "Specificity Wins"** - Why is "68yo Black Former Smoker with FamHx" *not* automatically the answer here? (We lack data for that exact class! Relevance is contested).  
  *   **Bust Misconception 2: "It's Just a Frequentist Problem"** - Ask: "Bayesians, how do *you* set the prior for Mr. Jones' cancer probability? What population/model defines it?" (Bayesians need a prior probability model based on... a reference class!). RCP hits both paradigms.

  **(25-40 min) The Fatal Flaw: "Just Condition on Everything" (V3):**  
  *   Let students propose this solution for Mr. Jones V2. Then reveal V3 (the 19% estimate).  
  *   **Crush the Illusion:**  
      *   *Instability:* Show CIs or results from slightly different small studies.  
      *   *Practical Impossibility:* For even 10 binary relevant factors, you need 2^10 = 1024 individuals *per covariate pattern* for stable estimates. Reality has continuous variables & rare outcomes.  
      *   *Conceptual Vacuum:* What makes the combination `68yo, Black, Former Smoker, FamHx` *the* correct ontological category? It's arbitrary.  
  *   **Bust Misconception 3: "More/Better Data Solves It" (Part 1)** - More data *within a chosen reference class* improves estimates *for that class*, but doesn't tell you *which class is the right one for the individual*. V3 shows data insufficiency in the "everything" class.

  **(40-55 min) Fracturing & Why More Data Can Exacerbate (V4):**  
  *   Present Mr. Jones V4 (Genetic Marker G+).  
  *   **Key Insight:** New scientific knowledge (G+) *invalidates* previous "most specific" classes. The supposedly "correct" class is always a moving target contingent on current knowledge.  
  *   **Bust Misconception 3: "More/Better Data Solves It" (Part 2)** - Big data finds *more* relevant variables, fracturing classes *further*. It highlights ambiguity, doesn't resolve it.  
  *   **Bust Misconception 4: "The Data Tells Us the Right Class"** - Data gives probabilities *for classes we define*. It doesn't tell us which class-defining attributes are *causally relevant* or *fair* to use for *this individual* in *this context* (e.g., insurance vs. clinical decision).  
  *   **Bust Misconception 5 (Emerging): "We Should Use the Broadest Stable Class"** - Ask: "Should we just use the 8% (Age-band) for Mr. Jones? Why is ignoring FamHx, Race, G+ potentially harmful/unjust/unethical?" (Context matters!).

  **(55-75 min) Why It Matters: Stakes & Consequences**  
  *   **Clinical:** Mr. Jones' decision (Biopsy? Watchful waiting?) hinges on the % used. Using 8% vs 25% leads to radically different choices with significant harms.  
  *   **Actuarial/Insurance:** Setting premiums for Mr. Jones. Is it fair to use race-specific data? Familial data? Genetic data? (Legality, ethics, disparate impact).  
  *   **Risk Prediction/Algorithmic Fairness (Tie-in instead of Exchangeability):** Recidivism scoring, credit scoring. The RCP is *central* to why algorithms can be biased: The choice of reference class (features) embeds value judgments about what defines "similarity." Conditioning on everything is impossible; choices must be made, and those choices have normative consequences. **Cut Exchangeability cleanly:** "We're focusing on the core RCP and its real-world stakes. Exchangeability is deeply related but a separate lecture. Read: [Key Paper Link]."

  **(75-85 min) Synthesis & (Lack of) Solutions**  
  *   Recap the progression: Single probability? -> Conflict -> Condition Everything? -> Instability/Arbitrariness -> New Knowledge Fractures -> High Stakes.  
  *   Emphasize: **RCP is inescapable in single-case prediction.** It's not a technical hurdle; it's a conceptual limitation of probability applied to individuals.  
  *   Coping Mechanisms (Briefly): Contextual relevance, ethical deliberation, transparency about class choice, understanding predictions as class-relative. *No magic bullet.*

  **(85-90 min) The Diagnostic Closing Question**  
  > **"Imagine Mr. Jones applies for critical illness insurance covering aggressive prostate cancer. Two actuaries submit reports:**  
  > **Actuary A:** Uses reference class `Men aged 60-70, Elevated PSA, Family History`. Premium based on 15% risk.  
  > **Actuary B:** Uses reference class `Black Men aged 60-70, Elevated PSA, Former Smoker`. Premium based on 12% risk.  
  > **Both classes are statistically valid based on large datasets. Neither class is obviously 'correct' or 'incorrect' for Mr. Jones based on all known medical science.**  
  > **What principled statistical or scientific argument can you make to decide *which premium Mr. Jones should pay*?"**

  *   **Why this works:** It forces them beyond describing the problem. A student who "gets it" will recognize:  
      *   There *is no* purely statistical/scientific resolution.  
      *   The choice hinges on **non-epistemic values** (fairness, purpose of insurance, definition of "relevant similarity," societal norms about using race/genetics).  
      *   Stats provides probabilities *relative to a class*; it doesn't dictate *which class defines the individual*.  
      *   Answering requires acknowledging the inherent arbitrariness and the role of judgment.  
  *   Answers like "use the narrower class," "average them," or "get more data" show they missed the core conceptual point.

  **What to Absolutely Avoid in Your Case:**  
  *   Any case where one reference class is demonstrably "causally fundamental" or "objectively correct" (e.g., "this person *is* a 30-year-old" vs. arbitrary groupings).  
  *   Cases where sample size alone *obviously* resolves the ambiguity (e.g., one class has n=1000, others n=10).  
  *   Trivialized examples they've seen (coins, lotteries).  
  *   Letting the discussion get bogged down in defining "relevance" too early. The problem arises *because* multiple classes seem relevant.

  **Anticipated Mid-Session Misconceptions to Quash:**  
  *   **"We Should Use the Class with the Best Predictive Power (AUC)":** Counter: "Best for *which population*? AUC measures discrimination *across a defined cohort*. It doesn't tell you which attributes define the *right* cohort for *this* individual." (Use V3/V4: The tiny class has undefined AUC, the broader class has lower AUC but is stable).  
  *   **"This is Just About Noisy Estimates / Confidence Intervals":** Counter: "No. Even with infinite data within a class, the problem remains: *Why this class and not another equally well-estimated class giving a different probability?*" (Reinforce with V2 vs V4).  
  *   **"In Practice, We Use Models (Log Reg, ML) That Handle Covariates":** Counter: "Exactly! And how do *you* choose which covariates to include? The RCP is embedded in your feature selection. Your model outputs P(Y=1 | **X=x**). Why is *this* vector **x** the right one? What about X=x + G+?" (Link to V4 fracturing).  

  This structure forces engagement with the philosophical core using their language (data, models, estimation) while making the practical implications for *their* work undeniable. The Mr. Jones case provides the necessary concrete anchor. Good luck – making stats students sweat over philosophy is a noble endeavor!
