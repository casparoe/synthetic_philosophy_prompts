prompt: |-
  I'm a second-year PhD student in philosophy of mind and I sit on our hospital's clinical ethics commitee as the lay member (they wanted someone who'd done some phil of mind, which is me, lucky them). We vote on Thursday week and I'm the one writing the paper.

  The case is a trial of a bedside gadget: EEG cap, a bit of machine learning, spits out a single number between 0 and 1 that's supposed to flag covert awareness in patients with disorders of consciousness. The number won't stay in the lab — the consultants have already said they want it in front of them when they're weighing up whether to carry on with treatment, so it's going to end up in best-interests meetings, and families will see it.

  What's eating me is how the thing was built. It's calibrated against people who were asked to imagine playing tennis, or walking round their own house — i.e. people following an instruction and doing something on purpose. So as far as I can tell it's a test of whether information is getting globally broadcast and made available for report and deliberate control (the workspace picture, yeah?), not a test of whether anyone's home. The family leaflet says the scan "tells us whether your relative is conscious", and a negative result is obviously going to be heard as "no one's home". One of the consultants wants to bring a negative result into a best-interests meeting next month. In the pilot, a few patients who showed nothing at all at the bedside came out above the line, and nobody knows what to do with them.

  Can you draft the memo I'll circulate? I want a recomendation I can actually defend — approve, approve with conditions, or don't — with reasons and a time frame, and a suggested rewording of the family leaflet (I've got a clunky draft line, "the scan can show awareness is there but can't show it isn't", and I don't know whether it survives scrutiny). Please take the other side properly: I keep being told that if the number tracks global access then access might be the thing that matters anyway — if nothing's broadcast, what is there to suffer? — and that a family would rather have a number than nothing, and I haven't got a good reply to either. Also our postdoc says there are studies where the same sort of signal turns up in people who aren't reporting anything at all, so she reckons I'm wrong that it's all about report. Tell me what to do with that, because I don't think I can just ignore her.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're a second-year PhD student in philosophy of mind serving as a lay member on a hospital's clinical ethics committee. The case involves an EEG gadget that outputs a number indicating covert awareness in patients with disorders of consciousness. The user is tasked with writing a memo for an upcoming vote, and they have several concerns.

  First, I need to understand the core issues. The gadget is calibrated using tasks that involve following instructions (like imagining playing tennis), which aligns with the global workspace theory—detecting if information is broadcast for report and control. But the user worries that this doesn't necessarily prove "anyone's home" in a deeper sense. The family leaflet oversimplifies by claiming the scan shows consciousness, and a negative result might be misinterpreted as absence of consciousness. There's also a consultant planning to use a negative result in a best-interests meeting, which could influence life-sustaining treatment decisions.

  The user mentioned a few points they're struggling with. Colleagues argue that if the number tracks global access, maybe that's what matters for suffering. Also, families might prefer having some data over none. Plus, a postdoc cites studies where similar signals appear without report, challenging the user's view that it's all about reportability. The user needs a defensible recommendation: approve, approve with conditions, or reject, along with revised leaflet wording and addressing the postdoc's point.

  I should start by addressing the calibration method. The tasks used (motor imagery, spatial navigation) require high-level cognitive functions. These tasks depend on attention, working memory, and executive control—all part of the global workspace. But consciousness might exist without these, like in states of minimal awareness or phenomenal consciousness without access. For instance, patients under anesthesia might have isolated sensory experiences without integration. So the gadget might miss cases where there's raw sensation without global broadcast.

  Next, the leaflet's claim is problematic. Saying the scan "tells us whether your relative is conscious" is misleading. A negative result doesn't rule out consciousness entirely; it just means the specific neural signatures for global access weren't detected. The user's draft line, "the scan can show awareness is there but can't show it isn't," is actually solid. It's a concise way to express the asymmetry in sensitivity versus specificity. I should emphasize that this phrasing aligns with the gadget's limitations and prevents harmful misinterpretations.

  The consultant wanting to use a negative result in a best-interests meeting is concerning. If the test's negative predictive value is uncertain, using it to justify withdrawing treatment could be dangerous. The committee should insist that negative results can't be used in such decisions without more validation. Approval should come with strict conditions: mandatory training for clinicians, revised patient materials, and excluding negative results from best-interest determinations until further studies are done.

  Regarding the colleagues' arguments: if global access is necessary for suffering, that's a philosophical stance. But empirical evidence isn't conclusive. There are phenomena like blindsight or fragmented consciousness where suffering might occur without global broadcast. Ethically, erring on the side of caution is crucial when dealing with vulnerable patients. For families preferring some data, transparency about the test's limits is key. Providing context helps them understand the number without overinterpreting it.

  The postdoc's point about signals without report is valid. Studies like those on no-report paradigms or psychedelic states show neural activity in conscious networks without verbal report. This challenges the strict link between global access and consciousness. I should acknowledge this but note that the gadget's calibration is still based on tasks requiring reportable cognition. So while consciousness might exist without report, the gadget isn't designed to detect those cases. Future research is needed, but for now, the test's scope should be clearly defined.

  The recommendation should be to approve with conditions. Immediate use can proceed but with safeguards: training, revised leaflets, no use of negatives in decisions. A 12-month review period allows time for outcome correlation studies. The committee should also push for funding validation against broader consciousness indicators. This balances innovation with ethical caution, addressing both practical concerns and philosophical rigor.
answer: |-
  Here’s a draft memo for the ethics committee, structured to address your concerns while balancing clinical pragmatism and philosophical rigor. I’ve integrated counterarguments, evidence from your postdoc, and clear recommendations.

  ---

  **MEMORANDUM**  
  **To:** Clinical Ethics Committee  
  **From:** [Your Name], Lay Member (Philosophy of Mind)  
  **Date:** [Current Date]  
  **Subject:** Ethical Review of EEG-Based Covert Awareness Detection Tool (Project NEUROFLAG)  
  **Vote Recommendation:** **APPROVE WITH STRICT CONDITIONS** (see §5)  

  ---

  ### 1. **Background**  
  Project NEUROFLAG proposes a bedside EEG tool using ML to generate a numerical index (0–1) indicating covert awareness in disorders of consciousness (DoC). The index will be used in clinical decisions (e.g., treatment withdrawal discussions) and shared with families. The tool is calibrated against healthy subjects performing volitional tasks (e.g., motor imagery, spatial navigation).  

  ### 2. **Key Ethical Concerns**  
  #### A. **Epistemological Limitations**  
     - The tool detects neural correlates of *global broadcast* (workspace theory), not necessarily phenomenal consciousness ("presence").  
     - **False Negatives Risk**: A score near 0 may indicate absence of *task-driven global access*, not absence of consciousness. E.g., patients with fragmented awareness (e.g., minimal phenomenal experience) may not engage task-responsive networks.  
     - **Postdoc Evidence**: Studies (e.g., Pitts et al. 2018; no-report paradigms) show global workspace-like activity in unreported conscious states. *However*, NEUROFLAG’s calibration relies on volitional tasks, which may not capture these states. The tool’s scope is narrower than consciousness *simpliciter*.  

  #### B. **Clinical Misinterpretation**  
     - The family leaflet states the scan "tells us whether your relative is conscious." This is inaccurate and dangerous.  
     - A low score may be misread as "no one’s home," potentially influencing best-interest decisions. Pilot data shows some behaviorally unresponsive patients scored >0 (undefined significance), while false negatives carry existential weight.  

  #### C. **"Global Access Suffices" Argument – Counteranalysis**  
     - *Claim*: If nothing is globally broadcast, there is nothing to suffer (making the tool ethically sufficient).  
     - *Rebuttal*:  
       - Empirical: Residual affective processing (e.g., amygdala responses to pain in unresponsive states) may occur without global broadcast.  
       - Philosophical: Phenomenal consciousness *could* exist without access (e.g., Block’s "overflow" thesis). Absence of evidence ≠ evidence of absence.  
       - Precautionary Principle: Erring toward false positives (continuing treatment) is ethically safer than risking false negatives (withdrawing care).  

  #### D. **"Better Than Nothing" Argument – Counteranalysis**  
     - *Claim*: Families deserve any available data.  
     - *Rebuttal*: Misleading data can be worse than uncertainty. A number confers false objectivity, risking therapeutic futility or emotional harm.  

  ---

  ### 3. **Recommendations for Leaflet Wording**  
  Your draft line ("the scan can show awareness is there but can’t show it isn’t") is **conceptually sound** but may confuse families. Refine to:  

  > *"This scan can sometimes detect signs of awareness when standard exams cannot. However, because consciousness is complex, a result suggesting no awareness does not prove it is absent. We will explain your relative’s result alongside all other clinical information."*  

  ---

  ### 4. **Addressing the Postdoc’s Evidence**  
  The postdoc is correct: some neural signatures of consciousness (e.g., posterior cortical "hot zone" activity) may persist without report. However:  
  - NEUROFLAG is **not calibrated** for these signatures. Its task-based design targets *executable volition*, not passive perception.  
  - **Action**: Endorse tool use *only* for its calibrated purpose (detecting volitional engagement), not as a general "consciousness detector."  

  ---

  ### 5. **Vote Recommendation: APPROVE WITH CONDITIONS**  
  **Rationale**: The tool has clinical value in detecting covert volition, but requires safeguards against misuse.  

  #### **Conditions for Approval**:  
  1. **Immediate Changes**:  
     - Revise all patient materials (§3 wording).  
     - **Ban use of negative results** in best-interest meetings or treatment withdrawal discussions until further validation (min. 12 months).  
     - Positive results may inform therapy choices/rehabilitation.  

  2. **Clinician Training Mandate**:  
     - All users complete a module covering:  
       - Tool limitations (global access ≠ consciousness).  
       - Prohibition on using negative scores prognostically.  
       - Pilot cases with unexplained positive scores.  

  3. **Validation Timeline**:  
     - **12-month pilot**: Correlate scores with long-term outcomes (recovery, pain behaviors).  
     - **18-month review**: Re-assess ethical risks with outcome data.  

  4. **Ongoing Oversight**:  
     - Data audit: Track how scores influence family perceptions/clinician decisions.  
     - Ethics committee reviews adverse events/unexpected results quarterly.  

  ---

  ### 6. **Why Not Reject?**  
  Withholding a tool that detects *some* awareness is ethically questionable when safeguards exist. Conditional approval balances innovation with protection.  

  ### 7. **Why Not Unconditional Approval?**  
  Current validation is insufficient for high-stakes use. Negative scores lack interpretability, risking harm.  

  ---  
  **Vote:** ☑ **APPROVE WITH CONDITIONS** (as above)  
  **Time Frame:** 18-month provisional approval pending review.  

  ---  
  *This balances the imperative to aid detection of covert awareness with the ethical duty to prevent misuse. The conditions force humility: we treat the tool as a *partial* lens on consciousness, not a verdict.*  

  Let me know if you need revisions for tone/emphasis. This positions you as rigorous but pragmatic—acknowledging utility while demanding epistemological honesty.
