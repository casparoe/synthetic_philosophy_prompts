prompt: |-
  I'm in a reading group on formal epistemology and decision theory, and last week we spent a session on how to model disagreement between experts. At one point, after a long back-and-forth, someone cut the discussion short with a line I've now heard a few times: that rational agents cannot agree to disagree. In context it was being used to argue that the persistent, widely reported disagreement between two camps of economists over the employment effects of a minimum wage — both camps well informed, both apparently reasoning carefully, neither budging over decades — shows that at least one camp must be irrational, or must be ignoring evidence the other has. I didn't want to argue on the spot, because I suspect the line is doing several different jobs at once, and that the interesting work lies in separating them.

  What I want is a menu rather than a verdict on the slogan as a whole. Lay out the distinct precise claims that 'rational agents cannot agree to disagree' could be expressing, ordered roughly from the trivial to the radical: the near-tautologies about agents who share a prior and share their information; the version that is a genuine theorem about what can and cannot be common knowledge between two agents; the version that treats the common prior not as a modelling convenience but as a substantive claim about how actual people's credences are distributed; the normative version on which any surviving disagreement is a defect of rationality; and any further readings you think are in circulation, for instance ones framed around betting, trade, or the difference between agreeing to disagree and agreeing to disagree about the prior. For each reading, I want to know what exactly it asserts, what further assumptions it needs — common knowledge of rationality, common knowledge of priors, a shared information partition, a single well-defined event under dispute — and whether it is true, false, trivial, or substantive but contested. Note also, where it matters, whether the claim is about probabilities or about outright belief, and whether it concerns the fact of disagreement or only the possibility of that disagreement being common knowledge.

  Then tell me which of these readings would actually license the move my reading-group colleague made. Does any of them show that the two camps of economists cannot both be rational, or does the most that follows amount to something considerably weaker — say, the impossibility of their disagreement being common knowledge under a particular formal idealization? I'd also like an account of what the slogan leaves out: what the underlying result is simply silent about regarding the real causes of persistent expert disagreement (differing priors, private evidence, differing models of the other's rationality, incentives, and so on), and whether, once that silence is made explicit, the one-liner is a genuine objection or just a conversation-stopper.
reasoning: |-
  We are given the slogan: "Rational agents cannot agree to disagree." We want to break it down into distinct precise claims, ordered from trivial to radical. We also want to see which of these readings would license the move made by the reading-group colleague, and what the slogan leaves out.

  The foundational result in this area is Aumann's Agreement Theorem (1975). It states that if two agents have the same prior probability and their posteriors for a given event are common knowledge, then these posteriors must be equal. In other words, if it is common knowledge that agent A assigns probability p to an event and agent B assigns probability q to the same event, and they share a common prior, then p must equal q.

  But note: the theorem does not say that rational agents cannot disagree. It says that if they share a common prior and their posteriors are common knowledge, then they cannot disagree. So the disagreement must not be common knowledge? Or they don't share a prior? Or one is irrational?

  We will consider several readings:

  1. **Trivial reading (common prior, common knowledge of posteriors)**: If two agents have the same prior and their posterior probabilities for an event are common knowledge, then those posteriors must be the same.

     - Assumptions: common prior, common knowledge of the posteriors, common knowledge of rationality (in the sense that they update by conditioning, which is implied by rationality in this Bayesian framework), and the event is fixed and well-defined.
     - This is a theorem (Aumann) and is true under the assumptions.
     - It is about probabilities (posteriors).

  2. **Common knowledge of the disagreement**: The theorem is often interpreted as saying that if two rational agents with a common prior become aware of each other's opinions (i.e., if their posteriors become common knowledge), then they must update to a common posterior. Therefore, they cannot "agree to disagree" in the sense of publicly acknowledging their disagreement and letting it stand without updating.

     - Assumptions: same as above, and now we require that the disagreement itself becomes common knowledge (which is a stronger condition than just knowing each other's posteriors? Actually, in Aumann's setup, common knowledge of the posteriors is what leads to the agreement). 
     - This is a direct consequence of the theorem: if the posteriors are common knowledge, then they must agree. Hence, if they were to "agree to disagree" (i.e., acknowledge the disagreement and stop updating), that would be irrational because the theorem says they should update until agreement is reached (if the conditions hold). But note: the theorem does not say they will update until they agree in general; it says that if at a given moment their posteriors are common knowledge, then they must already be equal.

  3. **Treating the common prior as a substantive claim**: The above results assume a common prior. But in reality, people might have different priors. The slogan then might be interpreted as asserting that rational agents must have a common prior. This is a much stronger and controversial claim.

     - This reading would say: if two agents are rational, then they must have the same prior. Therefore, any disagreement must be due to different information, and if they share all information (and update properly) they must agree. But this is a normative claim about what rationality requires. It is substantive and contested. Some argue that the common prior is just a modeling convention (because we can always view differences as due to different information by expanding the state space) while others see it as a strong assumption.

  4. **Normative version (any disagreement is irrational)**: This reading says that if two agents are rational and have the same evidence, they must agree. Therefore, persistent disagreement is evidence of irrationality. This is a common interpretation, but note that it requires both the common prior and that the agents have the same evidence (or that they have shared all evidence and updated properly). Without the common prior, it fails.

     - This version is often used to argue that if two well-informed rational agents disagree, then they must not have the same evidence (or not have shared it) or they must have different priors. But if we assume a common prior, then the only explanation for disagreement is different evidence. However, if they have shared all evidence and still disagree, then that would be irrational. But note: sharing evidence is not always straightforward (because of computational limits, different interpretations of the same evidence, etc.).

  5. **Betting and Dutch books**: There is a line of argument that if two agents have different probabilities for an event, then they can be Dutch booked by a clever bettor. However, this is not directly about disagreement being common knowledge. Instead, it shows that if they are both willing to bet at their own odds, then a third party can arrange a set of bets that each agent would accept but that together lead to a sure loss for one of them (or for both). But note: this does not require common knowledge of the disagreement, and it does not force them to update. It just shows that having different probabilities exposes them to a financial risk. However, this argument does not show that they must update to the same probability. It only shows that if they are willing to bet at their stated odds, they are vulnerable.

     - This reading might be: rational agents cannot agree to disagree about probabilities because if they do, they are vulnerable to a Dutch book. But note: they might not be willing to bet, or the disagreement might not be about a bettable event.

  6. **Agreeing to disagree about the prior**: The slogan might be interpreted as saying that rational agents cannot have different priors? But that would be a very strong and generally rejected claim. Rationality does not require having the same prior. The common prior assumption is a convenience in modeling, not a requirement of rationality.

  Now, let's organize these readings:

  **Ordered from trivial to radical:**

  1. **The Aumann theorem reading (trivial under assumptions)**: If two agents have a common prior and their posteriors for an event are common knowledge, then they must be equal. This is a theorem and is true. It is about probabilities and requires a well-defined event and common knowledge of the posteriors.

  2. **Common knowledge of disagreement leads to agreement (if common prior)**: If the two agents have a common prior and they come to know each other's posteriors (and this becomes common knowledge), then they must update to the same posterior. Therefore, they cannot persist in disagreement once their opinions are common knowledge. This is a consequence of the theorem. It is true under the assumptions.

  3. **The betting argument**: If two agents have different probabilities for an event, then they are vulnerable to a Dutch book (if they are both willing to bet at their stated odds). This is a theorem in decision theory. It does not require common knowledge of the disagreement, but it does require that they are willing to accept bets at their own odds. It is about probabilities and bettable events.

  4. **The common prior as a rationality requirement (substantive and contested)**: Rationality requires that agents have the same prior. Therefore, any disagreement must be due to differences in information. This is a strong normative claim and is contested. It is not a theorem but a philosophical position.

  5. **The radical normative reading (any disagreement is irrational)**: If two rational agents have the same evidence, they must agree. This requires both a common prior and that they have the same evidence (and have processed it correctly). This is a substantive claim and is often used to criticize persistent expert disagreement. But note: it ignores the possibility of different priors and also the possibility that the same evidence can be interpreted differently even by rational agents (if we allow for different models or different updating rules that are still rational?).

  Now, which of these readings would license the move made by the reading-group colleague?

  The colleague argued that the persistent disagreement between two camps of economists shows that at least one camp must be irrational or must be ignoring evidence.

  The reading that would license this is the fifth one (the radical normative reading) or a version of the fourth. Specifically, if we assume that the economists are rational and that they share a common prior (or that rationality requires a common prior), and if we also assume that they have the same evidence (or have shared all evidence), then they must agree. Since they don't agree, then either they don't have a common prior (which would be a failure of rationality according to the substantive common prior requirement) or they have not shared all evidence (so one is ignoring evidence) or one is irrational in updating.

  However, note that the fifth reading is the most extreme and is contested. It is not a theorem but a normative stance. Moreover, the Aumann theorem (reading 1 and 2) only says that if they have a common prior and their posteriors become common knowledge, then they must agree. But in the real world, it is rare for posteriors to be common knowledge. Also, the economists might not have a common prior.

  Therefore, the colleague's move is only valid under the contested assumption that rationality requires a common prior and that the economists have shared all evidence (so that their posteriors are based on the same information). Without these assumptions, the disagreement does not imply irrationality.

  What the slogan leaves out:

  - **Differing priors**: Rational agents can have different priors and then even with the same evidence, they might have different posteriors.
  - **Private evidence**: Even if they share the same prior, they might have different private evidence that they have not shared. The Aumann theorem requires that they share their evidence until their posteriors are common knowledge. But in practice, sharing all evidence might be difficult (because of time, because of different interpretations, or because of proprietary data).
  - **Differing models**: The event in question might be modeled differently by the two camps (e.g., different causal structures). The theorem assumes a fixed event in a fixed state space.
  - **Computational and cognitive limitations**: Even if they have the same prior and same evidence, they might not be able to compute the posterior exactly. This is a form of bounded rationality.
  - **Incentives**: The economists might have incentives to hold onto their views (e.g., because of funding, political alignment, or reputation).
  - **The possibility of multiple rational responses to the same evidence**: Some philosophers (e.g., in the literature on permissivism) argue that rationality sometimes allows a range of responses to the same evidence.

  Therefore, the one-liner "rational agents cannot agree to disagree" is often a conversation-stopper, but it is only a genuine objection under very strong assumptions (common prior, common knowledge of posteriors, and the ability to update until agreement is reached). Without these, it does not show that the economists must be irrational.

  Conclusion: The most that follows from the Aumann theorem is that if the economists had a common prior and if their disagreement were common knowledge, then they would be forced to update until they agree. But if they don't have a common prior, or if their disagreement is not common knowledge (or they haven't fully shared evidence), then the theorem doesn't apply. Thus, the colleague's move requires additional assumptions that are not necessarily true.

  So, the menu:

  1. **Aumann's theorem (trivial under assumptions)**: True, about probabilities, requires common prior, common knowledge of posteriors, and a fixed event.
  2. **Update upon common knowledge of disagreement**: True under the same assumptions as Aumann. It says that if they become aware of each other's posteriors (and this is common knowledge), they must update to agreement. So they cannot let the disagreement stand without updating.
  3. **Common prior as a substantive rationality requirement**: Substantive and contested. If accepted, then persistent disagreement must be due to different evidence or irrational updating. But without this, differing priors are allowed.
  4. **Any disagreement is irrational (same evidence)**: Requires common prior and same evidence. Substantive and contested. It would imply that the economists are irrational if they have the same evidence and prior but disagree. But note: same evidence is hard to establish.
  5. **Betting argument**: True about probabilities and bettable events. Shows vulnerability to Dutch book if they bet at their stated odds. Does not force agreement but shows a practical consequence.

  The colleague's move is licensed only by readings 3, 4, or 5? Actually, reading 5 (betting) does not show irrationality in the sense of updating, only in the sense of being vulnerable to a Dutch book. The main ones are 3 and 4.

  But note: even reading 4 does not directly say they are irrational. It says they must agree if they have the same evidence and common prior. So if they don't agree, then either they don't have the same evidence or they don't have a common prior (or they are irrational). The colleague is adding that they are well-informed (so same evidence?) and reasoning carefully (so common prior?), hence the conclusion that one must be irrational. But the "well-informed" might not mean they have shared all evidence, and "reasoning carefully" doesn't necessarily imply a common prior.

  Therefore, the colleague's move is a stretch. The underlying theorem (Aumann) does not directly apply because we don't know if the economists have a common prior or if their posteriors are common knowledge. The most we can say is that if they are both rational and have a common prior, then the persistence of disagreement implies that they have not fully shared their evidence. But that is weaker than saying at least one is irrational.

  In summary: The slogan "rational agents cannot agree to disagree" can be broken down in the above ways. The colleague's argument relies on a reading that requires strong and contested assumptions. The theorem itself is silent on the real causes of persistent expert disagreement, which might include differing priors, private evidence, differing models, incentives, and bounded rationality. Hence, the one-liner is more of a conversation-stopper than a knock-down argument.
answer: |-
  ### Dissecting "Rational Agents Cannot Agree to Disagree"

  The slogan "rational agents cannot agree to disagree" is a compressed reference to results in Bayesian epistemology and game theory, most notably **Aumann's Agreement Theorem (1975)**. It is often invoked to criticize persistent expert disagreements, but its meaning and implications depend on how it is interpreted. Below, I break down the possible readings of the slogan, ordered from least to most controversial. For each, I specify:  
  - **What it asserts**  
  - **Key assumptions** (e.g., common priors, common knowledge, shared information)  
  - **Type of belief** (probabilistic credences or outright belief)  
  - **Status** (true/false, trivial/contested)  
  - **Scope** (whether it concerns the *fact* of disagreement or the *common knowledge* of disagreement).  

  I then address which readings license your colleague's argument about the economists and what the slogan leaves unaddressed.  

  ---

  ### The Menu of Readings (Ordered from Trivial to Radical)

  #### **1. Trivial Reading: Shared Prior + Common Knowledge of Posteriors → Agreement**  
  - **Assertion**: If two agents share a common prior probability distribution over a state space, and their posterior probabilities for a well-defined event become *common knowledge*, then their posteriors must be equal. Disagreement cannot persist under these conditions.  
  - **Assumptions**:  
    - Common prior (same initial credences).  
    - Common knowledge of rationality (agents update by Bayesian conditioning).  
    - Common knowledge of posteriors (each knows the other's posterior, knows the other knows, ad infinitum).  
    - Shared information partition (agents have identical or compatible representations of evidence).  
  - **Belief type**: Probabilistic credences (e.g., P(event) = 0.7).  
  - **Status**: **True and trivial** under the assumptions. This is the core of Aumann's theorem.  
  - **Scope**: Concerns the *common knowledge* of disagreement: if posteriors are common knowledge, disagreement is impossible. It does not rule out private disagreement.  
  - **Why trivial?** It follows deductively from Bayesian axioms. Disagreement vanishes once posteriors are common knowledge, so agents cannot "agree to stop updating" while disagreeing.  

  #### **2. Common Knowledge of Disagreement as Impossible (Aumann's Corollary)**  
  - **Assertion**: Rational agents with a common prior cannot have common knowledge that they hold different credences about the same event. Any attempt to "agree to disagree" (e.g., publicly acknowledging divergent views without updating) would collapse into agreement upon exchanging information.  
  - **Assumptions**: Same as Reading 1, plus common knowledge of the *disagreement itself* (not just the posteriors).  
  - **Belief type**: Probabilistic credences.  
  - **Status**: **True** under the assumptions. A direct consequence of Aumann.  
  - **Scope**: Focuses on the *possibility* of common knowledge of disagreement: it cannot occur. The fact of disagreement (without common knowledge) is allowed.  
  - **Nuance**: Agents may briefly disagree, but if they communicate until no further updates occur, agreement is inevitable.  

  #### **3. Betting/Trade-Based Reading: Disagreement Implements Arbitrage**  
  - **Assertion**: If two agents have common knowledge of their differing credences about a bettable event, a clever bettor can design a Dutch book (a set of bets both accept that guarantees a loss for one or both). Thus, rational agents cannot publicly commit to disagreeing without exposing themselves to exploitation.  
  - **Assumptions**:  
    - Common prior (not always required; some versions weaken this).  
    - Common knowledge of posteriors.  
    - Agents are willing to accept any bet with positive expected value (or avoid sure loss).  
  - **Belief type**: Probabilistic credences (applied to wagers).  
  - **Status**: **True** under the assumptions; a consequence of the "no Dutch book" theorems.  
  - **Scope**: Concerns the *practical implications* of common knowledge disagreement: it enables arbitrage. Private disagreement without betting is unaffected.  
  - **Why less trivial?** Adds a decision-theoretic layer: disagreement becomes "irrational" only if agents act on it via bets.  

  #### **4. Common Prior as a Substantive Requirement (Not Just Modeling Convenience)**  
  - **Assertion**: Rational agents *must* share a common prior. Persistent disagreement therefore implies irrationality (e.g., biased updating) or asymmetric evidence—but *not* legitimate prior differences.  
  - **Assumptions**:  
    - Common prior is a normative requirement of rationality (not just a modeling tool).  
    - Agents are Bayesian updaters with common knowledge of rationality.  
  - **Belief type**: Probabilistic credences.  
  - **Status**: **Substantive and hotly contested**.  
    - *Defenders*: Argue common priors are necessary for objective rationality (e.g., rational agents "should" converge if priors are reasonable).  
    - *Critics*: View common priors as a useful fiction; real agents have genuinely different priors due to upbringing, expertise, or values.  
  - **Scope**: Addresses the *cause* of disagreement: differing priors are ruled out as irrational.  
  - **Radical shift**: Treats common priors as a truth about rational agents, not an idealization.  

  #### **5. Normative Reading: Any Surviving Disagreement is Irrational**  
  - **Assertion**: If two rational agents have identical evidence (and common knowledge of this), they must agree. Persistent disagreement implies a failure of rationality—e.g., one agent is biased, ignores evidence, or misupdates.  
  - **Assumptions**:  
    - Common prior (as a rationality requirement).  
    - Full evidence sharing (agents have access to all relevant data).  
    - Common knowledge of shared evidence and rationality.  
  - **Belief type**: Can extend to outright belief (e.g., believing vs. disbelieving a claim) if probabilities are extreme (near 0 or 1).  
  - **Status**: **False without stronger assumptions; contested with them**.  
    - *Why false?* No theorem forces agreement without common priors or common knowledge of posteriors.  
    - *Contested*: Some epistemologists (e.g., conciliationists) endorse this; others (permissivists) argue rational agents can disagree on the same evidence.  
  - **Scope**: Targets the *fact* of disagreement itself (not just its common knowledge).  

  #### **6. Radical Reading: Rational Agents Cannot Even Disagree About Priors**  
  - **Assertion**: Rational agents must share the same prior probabilities for all events, making *any* disagreement (even about priors) a sign of irrationality.  
  - **Assumptions**:  
    - Common priors are rationally obligatory (stronger than Reading 4).  
    - Rationality requires global coherence (e.g., no "framing effects" in prior formation).  
  - **Belief type**: Probabilistic credences.  
  - **Status**: **Radical and widely rejected**.  
    - Ignores the subjectivity of priors in Bayesianism (priors reflect legitimate initial "angles" on the world).  
    - No major theorem supports this; it conflates rationality with homogeneity.  
  - **Scope**: Eliminates all possible grounds for disagreement.  

  ---

  ### Which Reading Licenses Your Colleague's Argument?  
  Your colleague claimed that persistent disagreement between the two camps of economists implies at least one camp is irrational or ignoring evidence. This relies on **Reading 5 (Normative Reading)**, with possible support from **Reading 4 (Common Prior as Substantive)**. Specifically:  
  - **Required assumptions**:  
    - The economists share a common prior (or rationality requires them to).  
    - They have access to the same evidence (and have shared it fully).  
    - Their disagreement is common knowledge (or they have updated to exhaustion).  
  - **What follows**: Under these assumptions, disagreement *would* imply irrationality (e.g., biased updating).  
  - **What does *not* follow**:  
    - If priors differ legitimately (rejecting Reading 4), disagreement is possible without irrationality.  
    - If evidence isn't fully shared or common knowledge isn't achieved (violating Reading 1), disagreement persists.  
  - **The weak link**: **No reading licenses the conclusion without strong assumptions.** The strongest *theorem* (Aumann) only shows that common knowledge of disagreement is impossible *with a common prior*—not that disagreement itself proves irrationality. The leap to "one camp must be irrational" requires treating the common prior as a substantive rationality condition (Reading 4) or embracing the normative stance that disagreement is always defective (Reading 5). Both are philosophically loaded and contested.  

  **What the slogan leaves out**: Aumann-style results are silent on real-world causes of expert disagreement. The economists' dispute may stem from:  
  - **Differing priors**: E.g., one camp prioritizes neoclassical labor models, the other behavioral factors.  
  - **Private evidence**: Proprietary data, unpublished studies, or undisclosed methodological choices.  
  - **Differing models**: Disagreement over *how* to interpret evidence (e.g., conflicting causal frameworks), not just the evidence itself.  
  - **Incentives**: Reputational, funding, or ideological pressures to maintain a position.  
  - **Bounded rationality**: Computational limits (e.g., complex econometrics), heuristic reasoning, or ambiguity in evidence.  
  - **Permissivism**: Rationality may allow multiple defensible responses to the same evidence.  

  The slogan is a **conversation-stopper**, not a knockdown argument. It highlights that *under idealized conditions* (common prior, common knowledge, Bayesian updating), disagreement cannot be common knowledge. But it does not address whether these conditions hold in practice or whether rationality demands them. In complex empirical domains like economics, persistent disagreement is often explained by differing priors/models or incomplete evidence sharing—not necessarily irrationality.  

  ### Bottom Line  
  - **For your reading group**: Push back by noting that Aumann's theorem is often misapplied. It shows that common knowledge of disagreement is impossible *if* agents share a prior and update perfectly. It does *not* show that real-world expert disagreement implies irrationality. The slogan's force evaporates when differing priors, private evidence, or model ambiguity are allowed.  
  - **To salvage the slogan**: It works best as a critique of *public*, entrenched disagreements among experts who claim to share all evidence and methods (e.g., in a joint report). Here, the theorem suggests they *should* converge if rational. But in the wild, disagreement is expected.
