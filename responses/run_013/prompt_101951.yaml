prompt: |-
  I'm applying for a six-month seed grant from an ethics-of-technology fund and need a two-page research proposal. My half-formed idea: the manipulation-versus-persuasion distinction is normally drawn by one of three criteria — the mechanism used (does it engage or bypass the target's rational capacities?), the manipulator's intention, or the effect on the target's autonomy — and each criterion misfires on a different class of cases: truthful but selectively framed information, nudges that engage reasoning while steering it, and self-generated steering by recommendation systems that have no manipulator at all. I suspect the three criteria are groping toward a single underlying notion, which I'd tentatively call the counterfactual robustness of the target's reasons: roughly, whether the target would have arrived at the same attitude had the same considerations been presented without the steering. Turn this into a proposal: state the question precisely enough to have a determinate answer, explain why the existing criteria leave it open, lay out the approach (what I would actually do month by month, and why a case-driven conceptual analysis rather than, say, an empirical or purely formal method), say what a successful result would look like and what would count as the project failing, and give a realistic scope for six months. Don't include a bibliography or citations; I'll add those myself. Write in American English.
