answer: |-
  **THE SHARMA-JENKINS FAMILY GROUP CHAT: INFORMATION QUALITY STANDARDS MANUAL (v.4.3a)**  

  **1. Purpose & Scope:** This document governs the validation of all claims, observations, links, memes, and forwarded content ("Submissions") within the Sharma-Jenkins Family Group Chat (the "Platform"). Compliance is mandatory for all Participants. Failure to adhere may result in corrective action (see Appendix B: Sanction Protocols, chiefly passive-aggressive silence or Aunt Carol’s “🙂” reaction).  

  **2. Valid Means of Knowing (Pramāṇas):** Only the following four (4) methods establish truth on the Platform. Submissions failing classification under one (1) valid Pramāṇa will be marked "UNSUBSTANTIATED" and subject to peer review (i.e., relentless mocking).  

  **3. Section 1: Perception (Pratyakṣa)**  
      3.1 Direct sensory contact with the claimed event/object is required.  
      3.1.1 *"Saw it with my own eyes"* declarations must specify time, location, and ambient lighting conditions. Claims made while cooking vindaloo require corroboration.  
      3.1.2 **Digital Media Policy:** Screenshots, forwarded photos, or videos **DO NOT** constitute Perception. They are classified as **Digital Testimony (Class B)** (see Section 4). A Participant’s phone screen is not a valid sense organ.  
      *“Clause 3.1.2 ruined my proof that Mr. Tibbles *can* fit in a teacup. Just because I didn’t take the photo? Tyranny.” - Cousin Maya, Appeal Denied*  

  **4. Section 2: Testimony (Śabda)**  
      4.1 Relies solely on the credibility of the speaker/writer/source ("Source").  
      4.2 **Source Reliability Certification (SRC):**  
      4.2.1 A Source is deemed "Reliable" only if certified by: (a) Two (2) independent, pre-certified Reliable Sources; or (b) Unanimous vote of the Platform Moderation Committee (i.e., Dad during cricket ad breaks).  
      4.2.2 **The Regress Halt Protocol:** Certification chains terminate at Great-Aunt Mildred (1987-2019). Her pronouncements on neighbourly gossip remain axiomatic. All other claims require fresh SRC. Self-certification is strictly prohibited.  
      4.3 Links to external articles are **Testimony (Class C)**. The claim "it's just someone's opinion" triggers mandatory SRC review of the author *and* publisher. Memes featuring philosophers auto-fail SRC.  

  **5. Section 3: Inference (Anumāna)**  
      5.1 Requires establishing an invariable relationship ("Vyāpti") between evidence and conclusion.  
      5.2 **Licensing Requirement:** All inferences must be prefaced with the explicit Vyāpti license. E.g., "License: *Where there is smoke, there is fire (always)*. Observation: Smoke on hill. Inference: Fire on hill."  
      5.3 Licenses based on "usually" or "historically" (e.g., "he's always late anyway") are **INVALID**. "Always" means *always*, per global historical record. Uncle Roger’s punctuality statistics are under audit.  

  **6. Section 4: Comparison (Upamāna)**  
      6.1 Permits recognition/understanding via analogy to a known object.  
      6.2 **Approved Use Cases:** Explaining new technology ("It's like Uber, but for haircuts"), obscure cultural references ("He dresses like a Regency dandy"), or Great-Uncle Bertie’s wartime anecdotes ("The tank sounded like a threshing machine").  
      6.3 **Analogy Validation:** The base object ("cow") must be Platform-certified as familiar to all Participants. Claims of unfamiliarity (e.g., "What's a threshing machine?") trigger mandatory Perception or Testimony verification of the base object before the analogy is processed.  

  **7. Double Counting & Exclusivity:**  
      7.1 **Rule:** A single fact can be established by only **one (1) primary Pramāṇa**. Overlap is prohibited ("vyavasthā" model).  
      7.2 **Consequence:** Claiming "I *saw* the dent *and* it's obvious Vijay hit the lamppost (inference)" requires selecting **one** validation path. Combining methods grants no extra weight and may incur a "Desperate Overreach" penalty. *(Uncle Geoff's protest re: "samplava rights" noted and filed under "Historical Grievances - Irrelevant").*  

  **Appendix A: The Absence Tab Request (Denied)**  
      A.1 Claims of non-existence ("There's no evidence aliens built the pyramids") are **not** a standalone fifth Pramāṇa.  
      A.2 Such claims must be processed under:  
          - **Perception:** "I checked the relevant location/records and perceived no evidence." (Requires documented search protocol).  
          - **Inference:** "The absence is licensed by a known Vyāpti, e.g., 'If aliens built them, we'd see alien tools (always). We see no alien tools.'"  
      A.3 Requests for an "Absence Tab" shortcut must be submitted in triplicate to the Moderation Committee. All such requests to date (n=47) have been rejected for "procedural inefficiency."  

  **Appendix C: Clarification on Digital Media (Clause 3.1.2)**  
      C.1 A forwarded photo is classified as:  
          - **Testimony (Class B):** The testimony of the *original photographer* regarding what *they* perceived.  
          - **Requires:** SRC of the original photographer. If unknown/unverifiable, the photo is deemed "Orphaned Media" and may only be used for decorative purposes (birthday wishes, cat updates).  

  **Verdict:** Perception overrides Testimony when Aunt Carol is jet-lagged.
