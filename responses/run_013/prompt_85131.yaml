  So we must be explicit: we are assuming that the agent's language includes the atomic propositions we are using. But if the agent has never considered q, then perhaps we should model the agent as having a language that does not include q. So the knowledge operator is relative to a language. 

  But in standard epistemic logic, the language is fixed. So we have to break the standard semantics to account for the agent's conceptual limitations.

  Therefore, the example must involve an agent who has a limited language. We imagine that the agent's language has only atomic proposition p. Then we ask: can the agent know p? Yes. But then we extend the language to include q, and we consider the disjunction p∨(q∧¬q). The agent, in the original language, cannot even express this. So when we model the agent with the limited language, the set of worlds is defined by assignments to p only. In that model, the agent knows p. But if we extend the language to include q, then the same set of worlds becomes a set of two-worlds: one where p is true and one where p is false. But now we have to assign q in each world? The agent's knowledge set (the set of accessible worlds) might not change, but the disjunction p∨(q∧¬q) is true in every world? Actually, no: in a world where p is false and q is true, then (q∧¬q) is false, so the disjunction is false? That is not possible because (q∧¬q) is false in every world. So the disjunction is equivalent to p. Therefore, in the extended language, the agent still knows p, and hence knows the disjunction? 

