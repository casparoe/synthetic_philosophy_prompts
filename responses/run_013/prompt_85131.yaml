answer: |-
  ### Teaching Plan: The Problem of Logical Omniscience  
  **Total Time:** 90 minutes  
  **Target Audience:** Philosophy graduate students familiar with propositional/first-order logic and possible-worlds semantics, new to epistemic logic.  
  **Goal:** Make the problem of logical omniscience emerge from the semantics, not as an optional assumption. Use a single example to anchor the session.  

  ---

  #### **Session Structure**  
  **Defended Dependencies:**  
  1. **Epistemic Logic Semantics (15 min)**  
     - **What:** Introduce the standard possible-worlds semantics for knowledge:  
       - \( \mathcal{M}, w \models K\varphi \) iff for all \( v \) such that \( w \mathcal{R}v \), \( \mathcal{M}, v \models \varphi \).  
       - Assume an **S5 model** (equivalence relation \(\mathcal{R}\)) for simplicity.  
     - **Why:** Students must see knowledge as a *modal operator* evaluated over worlds. Without this, the problem is invisible.  
     - **Dependency:** Builds on prior knowledge of possible-worlds semantics (alethic modality).  

  2. **The Carrying Example (10 min)**  
     - **Proposed Example:**  
       - **Plausible knowledge:** Sophie knows that "Nicosia is the capital of Cyprus" (\(p\)).  
       - **Logical consequence:** \(p \lor (q \land \neg q)\) (where \(q\) is "Kalamata olives have even primeness").  
       - **Why Sophie doesn’t know it:** She lacks the concept of "primeness" for olives.  
     - **Why this example?**  
       - **Contains:**  
         - \(p\) is empirical but uncontroversial (Sophie knows geography).  
         - Consequence is a logical truth (tautology) derived via disjunction introduction.  
         - Gap is **conceptual ignorance** (lacks \(q\)), *not* computational/arithmetic (e.g., \(2^{82,589,933} - 1\) is prime) or empirical (e.g., "Nicosia has >1M people").  
       - **Avoids:**  
         - Computational overload: \(q \land \neg q\) is a contradiction—no calculation needed.  
         - Empirical ignorance: \(q\) is invented; its truth-value doesn’t matter.  
     - **Defense:** Rejects common examples like "knows axioms but not theorem" (computational) or "knows \(n=2\) but not Fermat’s Last Theorem" (arithmetic). These collapse into resource limitations.  

  3. **Closure Under Logical Consequence (15 min)**  
     - **What:** Show closure is *entailed* by semantics:  
       - If \(\models \varphi \rightarrow \psi\) and \(\mathcal{M}, w \models K\varphi\), then \(\mathcal{M}, w \models K\psi\).  
       - Proof: If \(\varphi \rightarrow \psi\) holds in all worlds, and \(\varphi\) holds in all accessible worlds, then \(\psi\) must hold in all accessible worlds.  
     - **Why:** Students must see closure as a *theorem* of the semantics, not an axiom. Use the example:  
       - \(\models p \rightarrow (p \lor (q \land \neg q))\), so Sophie *must* know \(p \lor (q \land \neg q)\) if she knows \(p\).  
     - **Dependency:** Requires step 1 (semantics) and step 2 (example).  

  4. **Semantic vs. Psychological Reading (15 min)**  
     - **What:** Contrast:  
       - *Semantic reading:* Knowledge as truth in all accessible worlds (external, logical).  
       - *Psychological reading:* Knowledge as a cognitive state (internal, bounded).  
     - **Why:** The confusion lives here. Students default to psychological ("Sophie hasn’t *thought* of \(q\)"). Hammer:  
       - Semantics forces closure; psychology denies it. The problem is their collision.  
     - **Dependency:** Steps 1–3 make tension visible.  

  5. **Core Framing: Two Closure Failures (10 min)**  
     - **What:** Introduce:  
       - **Type A (Inferential):** Agent can perform inference but hasn’t (e.g., didn’t deduce \(p \lor r\) from \(p\)).  
       - **Type B (Conceptual):** Agent lacks concepts in the consequence (e.g., Sophie doesn’t possess \(q\)).  
     - **Core Phenomenon:** **Type B (Conceptual).**  
       - **Why:** Type A reduces to computational limits (students already grasp this). Type B exposes semantics as *overidealized* for finite minds.  
     - **Dependency:** Steps 2 (example) and 4 (semantic/psychological split) set this up.  

  6. **Repairs (15 min)**  
     - **Sequence and Defense:**  
       1. **Awareness Restrictions:**  
          - *What:* Agent only "knows" propositions in awareness set \(\mathcal{A}\).  
          - *Addresses:* **Type B** (Sophie unaware of \(q\), so \(p \lor (q \land \neg q) \notin \mathcal{A}\)).  
          - *When:* First—directly targets conceptual lack.  
          - *Critique:* Relocates problem: What governs \(\mathcal{A}\)? Ad hoc?  
       2. **Impossible Worlds:**  
          - *What:* Worlds where logical truths fail (e.g., \(q \land \neg q\) true).  
          - *Addresses:* **Type B** (worlds where \(p \lor (q \land \neg q)\) is false exist).  
          - *When:* After awareness—show it handles ignorance without \(\mathcal{A}\), but at cost of logical chaos.  
       3. **Procedural/Algorithmic Knowledge:**  
          - *What:* Knowledge as explicit computation (e.g., proof-theoretic).  
          - *Addresses:* **Type A** (inferential gaps), *not* Type B.  
          - *When:* Last—highlight it misses conceptual lack.  
       4. **Relevance-Sensitive Consequence:**  
          - *Brief mention:* Only if time permits; relevance logic modifies consequence, but doesn’t resolve Type B.  
     - **Dependency:** Step 5 (framing) shows why each repair targets a specific failure.  

  ---

  #### **Misconceptions to Preempt**  
  - **"It’s just an idealization; add a cost function!"**  
    - **When:** During step 5 (framing).  
    - **Response:** Cost functions fix Type A (computation), not Type B (concepts). Sophie *can’t* consider \(q\), even with infinite time.  

  - **"Drop closure—it’s the obvious fix!"**  
    - **When:** During step 3 (closure derivation).  
    - **Response:** Closure is *derived* from semantics; dropping it guts epistemic logic. Repairs modify semantics while preserving limited closure.  

  - **"It concerns omniscience over contingent facts."**  
    - **When:** During step 2 (example).  
    - **Response:** Sophie’s ignorance is about a *logical truth* (\(p \lor (q \land \neg q)\)), not contingents. Highlight example’s tautology.  

  - **"Impossible worlds are ad hoc."**  
    - **When:** During step 6 (repairs).  
    - **Response:** They *are* ad hoc, but necessary for Type B. Contrast with awareness (also ad hoc).  

  - **"Awareness solves the problem."**  
    - **When:** During step 6 (awareness critique).  
    - **Response:** Awareness relocates omniscience to \(\mathcal{A}\): Who sets \(\mathcal{A}\)? How does it expand?  

  - **"Same as assigning credences to logical claims."**  
    - **When:** If raised in Q&A.  
    - **Response:** Credences involve probabilistic incoherence; here, it’s binary knowledge and conceptual limits. Refuse elaboration (see below).  

  ---

  #### **Final Check Question (Last 10 min)**  
  **Question:**  
  > *"In the semantics, if Sophie knows \(p\), she knows \(p \lor (q \land \neg q)\). But psychologically, she might not. Is this failure because she hasn’t performed an inference (Type A) or because she lacks a concept (Type B)? How does the example force Type B, and why does this make awareness a better fix than procedural knowledge?"*  

  **Why this works:**  
  - Tests grasp of core framing (Type A vs. B).  
  - Exposes memorization: If they miss \(q\)’s conceptual absence or suggest "she didn’t do the inference," they’ve missed the point.  
  - Requires applying repairs (awareness for Type B).  

  ---

  #### **Explicitly Refuse to Cover**  
  **State upfront (min 0) and reiterate (min 60):**  
  - *"We are not covering credences or probabilistic omniscience (e.g., assigning 0 to contradictions). This is about binary knowledge in deductive logic."*  
  - *"We are not discussing empirical ignorance (e.g., not knowing Cyprus’s population) or computational complexity (e.g., factoring large primes). Focus on conceptual gaps."*  
  - *"Dynamic aspects (e.g., how agents *gain* concepts) are out of scope. We fix language and awareness statically."*  

  **Why:** Prevents scope creep into Bayesian epistemology or computer science. The goal is to expose the semantic-psychological clash for logical knowledge.  

  ---

  **Summary Flow:**  
  1. Semantics → 2. Example → 3. Closure derivation → 4. Semantic/psychological split → 5. Type A/B framing → 6. Repairs → Final question.  
  **Anchor:** Sophie’s knowledge of Nicosia vs. olive primeness.  
  **Core Insight:** Type B (conceptual lack) reveals semantics as incompatible with finite minds.
