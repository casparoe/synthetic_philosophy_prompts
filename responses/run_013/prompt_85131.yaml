  We are designing a 90-minute session on the problem of logical omniscience for graduate students familiar with propositional and first-order logic and possible-worlds semantics for modal logic, but new to epistemic logic.

  The goal is to make them see that logical omniscience is a direct consequence of the possible-worlds semantics for knowledge (or belief) and not an optional assumption. We will build the session around a single example that avoids common pitfalls and use a framing that distinguishes between two types of closure failure: one due to not having performed an inference (which we might think of as a computational resource issue) and one due to lacking the concepts in the consequence (which is more fundamental). We will focus on the latter as the core phenomenon.

  Session Structure:

  1. **Introduction (5 minutes)**
     - Brief reminder of possible-worlds semantics for modal logic (as they know it from alethic modality).
     - Introduce the epistemic interpretation: "knows that p" is interpreted as "p is true in all possible worlds compatible with what the agent knows".

  2. **Epistemic Logic Basics (15 minutes)**
     - Formalize the semantics for a simple epistemic logic in a propositional setting.
     - Let W be a set of possible worlds, and let ~ be an equivalence relation representing indistinguishability for the agent. Then:
          M, w ⊨ Kφ iff for all v such that w ~ v, M, v ⊨ φ.
     - Note: We are using an equivalence relation for simplicity (S5), which is standard for knowledge.

  3. **The Carrying Example (10 minutes)**
     - We introduce a specific example that must:
          (a) Have an item the agent plausibly knows.
          (b) Have a logical consequence of that item that the agent does not know.
          (c) Ensure the gap is not due to empirical ignorance (so the consequence must be a logical truth) and also not due to computational limitations (so it must not be a matter of having failed to compute a long derivation or a complex arithmetic fact).
     - Proposed example:
          Let the agent know a proposition p (which is true in the actual world). 
          Now consider the proposition: p ∨ (q ∧ ¬q)
          This is a logical consequence of p (since p entails any disjunction that has p as a disjunct). However, the agent might not know p ∨ (q ∧ ¬q) if they have never considered the proposition q (and hence the concept of q is not present to them).
     - Why this example?
          - The consequence is a logical truth (since (q ∧ ¬q) is a contradiction, so the disjunction is equivalent to p ∨ false, which is equivalent to p). But note: in classical logic, p entails p∨ψ for any ψ, so in particular for ψ = (q∧¬q). However, if the agent has never entertained the concept q, then they might not have formed the belief in this disjunction.
          - The issue is not computational: the agent doesn't need to do any complex derivation. The problem is that the disjunction contains a concept (q) that the agent has never considered.
          - We avoid arithmetic or long derivations. Also, note that the disjunction is a logical truth (so it's not contingent), and the agent's ignorance is not about a contingent fact.

     - However, note: in classical logic, p and p∨(q∧¬q) are equivalent. So if the agent knows p, and the two are equivalent, then in the possible-worlds semantics, the agent must know the disjunction because it is true in exactly the same worlds as p. But the problem is that the agent might not have the concept q. This is where we need to refine our semantics to account for the agent's conceptual repertoire.

  4. **The Problem of Logical Omniscience (15 minutes)**
     - Show that the semantics entails that the agent knows all logical consequences of what they know.
          - If φ entails ψ, then in every world where φ is true, ψ is true. Therefore, if the agent knows φ, then ψ must be true in every accessible world, so they know ψ.
     - Also, the agent knows all logical truths (because they are true in every world, hence in every accessible world).
     - Point out: This is a direct consequence of the semantics. It's not an extra assumption.

  5. **Distinguishing Semantic and Psychological (10 minutes)**
     - Now we introduce the crucial distinction: 
          - The possible-worlds semantics gives a normative, external account of knowledge (what an agent ought to know if they are rational and have the concepts). 
          - But in psychology, an agent might not have considered all the concepts or might not have made the inference.
     - Emphasize: The problem arises when we try to model actual human knowledge (which is finite and concept-bound) with a semantics that assumes the agent has access to all propositions (which are infinite and may involve concepts they don't possess).

  6. **Framing: Two Types of Closure Failure (10 minutes)**
     - We frame the problem around two kinds of closure failure:
          Type A: The agent has the concepts and the computational capacity, but hasn't performed the inference (e.g., hasn't deduced a long chain of reasoning). This might be addressed by adding computational constraints.
          Type B: The agent lacks some of the concepts that appear in the consequence (as in our example). This is more fundamental because the agent cannot even entertain the consequence.
     - We argue that Type B is the core phenomenon for the problem of logical omniscience in its most acute form because it doesn't depend on computational limitations. It shows that the very language of the consequence is not available to the agent.

  7. **Standard Repairs (15 minutes)**
     - We introduce the standard repairs and connect them to the two types:
          (a) Awareness restrictions: The agent only knows propositions in a set of "aware" propositions. This directly addresses Type B (concept lack). But note: it relocates the problem to how we set the awareness set.
          (b) Impossible worlds: We allow worlds where logical truths fail. This can address both types, but especially Type B by allowing worlds where the disjunction p∨(q∧¬q) is false (if the agent is unaware of q). However, this is non-normal semantics.
          (c) Procedural/algorithmic notions: These address Type A (by requiring that the agent has computed the consequence) but not Type B (if the agent doesn't have the concepts, they can't even start).
          (d) Relevance-sensitive consequence: This might help with Type A (by requiring that the inference steps are relevant) but doesn't directly solve Type B.

     - We will argue that awareness restrictions are the most direct for Type B, but we must note that they are a relocation: we now need a model of awareness.

  8. **Addressing Misconceptions (as they arise, but also proactively)**
     We list the misconceptions and when to head them off:

     - **That the problem is just an idealisation to be patched with a cost function:** 
          This comes from thinking of Type A. We must emphasize that Type B (concept lack) is not about cost. Head off when discussing the example and the two types.

     - **That dropping closure is the obvious fix:**
          We must note that closure is a fundamental property of knowledge. If we drop it, we lose the connection between knowledge and logical consequence. We should note that the problem is in the semantics and that dropping closure without a replacement (like awareness) doesn't work. Head off when introducing the problem and when discussing repairs.

     - **That it concerns omniscience over contingent facts:**
          The example we chose is a logical truth. Emphasize that the problem is about logical truths and consequences, not about knowing every contingent fact. Head off when introducing the example.

     - **That impossible worlds are an ad hoc device:**
          When introducing impossible worlds, note that they are a technical device to break logical omniscience. But we can motivate them by the need to model agents who are not logically perfect. However, they are not more ad hoc than other repairs? Head off when discussing repairs.

     - **That an awareness parameter solves the problem rather than relocating it:**
          We agree that it relocates the problem. We must now explain how awareness is determined. This is a valid point and we should acknowledge it. Head off when discussing awareness.

     - **That it is the same as the problem of assigning credences to logical claims:**
          This is a related but distinct problem (in probabilistic settings). We are in a binary knowledge setting. We should note that the problem of logical omniscience also arises in probabilistic models (if an agent assigns probability 1 to all logical truths) but we are focusing on binary knowledge. Head off if someone asks, but we are focusing on knowledge, not credences.

  9. **The Final Question (last 10 minutes)**
     - Pose the following question: 
          "Suppose we have an agent who knows that it is raining (p). Does the agent know that it is raining or 2+2=5? (p∨(2+2=5))? How does the problem of logical omniscience manifest in this case? And how is it different from the example we discussed with q?"
     - Why this question?
          - It tests if they see that 2+2=5 is a mathematical falsehood, so the disjunction is equivalent to p. But if the agent has never considered arithmetic, then they might not have the concepts. However, note that in our example we used an arbitrary q, so the disjunction p∨(q∧¬q) is equivalent to p. The difference is that in the arithmetic example, the agent might have the concept of arithmetic and know that 2+2=4, so they would reject 2+2=5. But if they haven't done the arithmetic, then they might not know? That would be Type A. We want them to see that the problem in the arithmetic case might be Type A (if they have the concepts but haven't done the calculation) but in the q example it is Type B (if they lack the concept q). 
          - We want them to realize that in the arithmetic case, if the agent has the concepts of arithmetic and knows basic arithmetic, then they know that 2+2=5 is false, so they know the disjunction. But if they lack the arithmetic concepts, then they might not. However, the arithmetic example might be more naturally seen as Type A because arithmetic is usually considered a priori. The q example is clearly Type B because q is an arbitrary concept.

     - We are using this to check if they can apply the distinction between Type A and Type B.

  10. **Explicitly Refuse to Cover (at the beginning and when relevant)**
      - We are not covering probabilistic models (logical omniscience in Bayesian epistemology).
      - We are not covering the more complex topic of how to model awareness (e.g., awareness growth) or dynamic epistemic logic.
      - We are not going into the philosophical debate about whether knowledge must be closed under logical consequence (but we are showing that the semantics forces it).

  Detailed Timing:

  - 0-5 min: Introduction (reminder of possible-worlds semantics, shift to epistemic).
  - 5-20 min: Formal semantics for epistemic logic (K operator, S5, with an example of knowing p and not knowing q when p and q are independent).
  - 20-30 min: Introduce the carrying example: Agent knows p. Consequence: p ∨ (q ∧ ¬q). Explain why it's a logical consequence and why the agent might not know it (if they don't have q in their vocabulary). Then show that the semantics requires them to know it.
  - 30-40 min: Derive the problem of logical omniscience from the semantics: closure under consequence and knowledge of all logical truths.
  - 40-50 min: Distinguish the semantic reading (what is true in all accessible worlds) from the psychological (what the agent has actually considered). Emphasize that the problem is the mismatch.
  - 50-60 min: Frame the two types of closure failure. Argue that Type B (concept lack) is the core.
  - 60-75 min: Standard repairs: awareness (for Type B), impossible worlds (for both, but especially Type B), procedural (Type A). Discuss the relocation issue for awareness.
  - 75-80 min: Address misconceptions as they come up, but also proactively. 
  - 80-90 min: Pose the final question and discuss.

  We must be flexible and adjust timing as needed. The key is to make sure the example is clear and the distinction between the two types of closure failure is grasped.

  Note: The example p ∨ (q ∧ ¬q) is a logical truth. But note that in the semantics, if the agent doesn't have the concept q, then we might need to model the language differently. We are assuming a fixed language for the logic. This is where awareness comes in: we restrict the agent's knowledge to a sublanguage.

  Alternative example: 
     Let p be "It is raining in London". 
     Let q be a proposition about an entirely unrelated domain, say, "The number of hairs on the head of the king of Mars is even". 
     Then the agent knows p, but does not know p ∨ q? But note: in the semantics, if the agent knows p, then in every accessible world p is true, so p∨q is true. But the agent might not have considered q. However, this example has q as a contingent proposition. The agent might not know q, but they still know p∨q because they know p. This is a case where the agent does know the disjunction by the semantics. But if the agent has never considered q (so they don't have the concept of the king of Mars or hair counting on Mars), then they might not be able to form the belief. 

  But note: in classical possible-worlds semantics, the agent doesn't need to form the belief explicitly. The knowledge set is defined as the set of true propositions in all accessible worlds. So if p∨q is true in all accessible worlds (because p is), then the agent knows p∨q. The problem is that the agent might not have the linguistic or conceptual resources to express q. 

  Therefore, we need an example where the consequence is not just a disjunction with an arbitrary contingent q, but a proposition that the agent cannot even express. The example with q∧¬q has the advantage that it is a contradiction, so the disjunction is equivalent to p. But if the agent doesn't have the concept q, then they cannot express the disjunction. 

