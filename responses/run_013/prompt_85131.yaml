  We see the problem is subtle. Therefore, we must rely on the agent not being able to entertain the disjunction because it contains q. So even though the disjunction is equivalent to p, the agent doesn't have the concept to form the disjunction. Therefore, we must model the agent as not believing (or not knowing) the disjunction because they cannot form it. 

  This leads us to the awareness approach: the agent only knows propositions in a certain set (the set of propositions they are aware of). So we add an awareness function. Then the agent knows φ only if (i) φ is true in all accessible worlds and (ii) φ is in the awareness set.

