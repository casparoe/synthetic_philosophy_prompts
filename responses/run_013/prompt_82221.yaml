prompt: |-
  My friend Dev and I are both consequentialists in the broad sense — we agree that what matters is how things turn out for sentient beings — but we've ended up on opposite sides of the cluelessness problem and its gotten tense. Write a dialogue where we try to talk each other out of our positions. I'm the one who thinks cluelessness basically wrecks the view: the long-run consequences of just about anything are unknowable, since small acts get amplified through chaotic social and technological chains, so expected-value talk mostly launders ignorance into numbers. I've drifted toward thinking you should just do the ordinary decent thing and stop kidding yourself that you're steering history. Dev thinks that's an overreaction and wants to save the framework.

  Don't let us talk past each other. Some things I want us to actually go at:

  - The graph our friend Priya sent. She modeled a $500 bed-net donation and a $500 grant to an obscure research fund. The bed nets came out at roughly zero long-run effect (in her model the good gets cancelled out later by unrelated events), the research fund at plus ten trillion lives, and the error bars on both are around 10^15. I say that one graph is the whole problem. Dev has to say concretely what he'd do with the money and why, and I get to push back on it.
  - Whether cluelessness is a problem for everyone, so not a special objection to consequentialism, or whether it hits us harder because consequences are the criterion and not just a constraint. I should have a real answer to that, not a dodge.
  - Whether far-off uncertainty should swamp near-term certainty. My line: the kid who doesnt get malaria this year is the one thing we actually know. Dev's line: that's just discounting the future by illegibility. Let him press it.
  - Dev's best positive story, which I think is his asymmetry-of-legibility point: that long-run disasters get documented and long-run goods mostly don't, so our sense that interventions curdle is a selection artifact. I should give that a serious run for its money before I say what's wrong with it, if anything is.
  - Whether his fallback (act so as to keep future options open, rather than maximize) is just expected-value reasoning in a trench coat.

  Both of us should be sharp and neither should be a strawman; we can concede when the other lands something. No need to have us cite literature, we're arguing in a kitchen. End on the crux we really disagree about, even if neither of us wins.
