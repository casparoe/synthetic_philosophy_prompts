  **Joint Statement on the Nature of Market Knowledge**

  We, the undersigned, having engaged in a prolonged debate on the epistemic function of markets, hereby set forth our points of agreement and disagreement. We agree that the question of whether markets merely encode existing information or actively generate new knowledge is of profound importance, and that the resolution of this question must confront both theoretical dilemmas and empirical evidence. 

