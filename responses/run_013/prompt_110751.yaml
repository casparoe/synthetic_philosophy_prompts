  2. **Trade requires disagreement**: For trade to occur, there must be some divergence in beliefs, interpretations, or risk tolerances among participants. This claim is not vacuous because it establishes that markets cannot function without diversity among traders, and that such diversity is the engine of market activity.

  3. **Markets can be reflexive**: The existence of a market and its prices can influence the behavior of agents, which in turn may affect the outcome being predicted. This claim is not vacuous because it recognizes that markets are not always neutral observers; they can sometimes alter the very reality they are meant to predict.

