  After carefully analyzing your verdicts in the five scenarios and the underlying tension between them, I propose a unified principle that accounts for all five cases without requiring you to abandon any. The principle combines elements of **updateless decision theory (UDT)** with a **causal independence criterion**, augmented by a tie-breaking rule for indifference. I'll state the principle precisely, explain how it applies to each verdict, and then address your additional cases.

  ### The Principle: Symmetrically Aligned Causal-Expectational Reasoning (SACER)

  **Definition:**  
  In any decision problem, select the action that maximizes your expected utility, computed as follows:  
  - **Step 1 (Causal Independence Check):** If the other agents' choices (or relevant states of the world) are *causally independent* of your choice—meaning your action has no causal influence on them, now or in the future—then maximize expected utility using **causal decision theory (CDT)**. CDT evaluates actions based solely on their causal consequences (via a causal model), ignoring any evidential correlations.  
  - **Step 2 (Symmetry Alignment):** If causal independence fails (i.e., your choice is causally dependent on others, or the situation involves symmetry/logical correlation with other agents), then maximize expected utility using **updateless decision theory (UDT)**. UDT treats your choice as selecting a strategy for all agents in a symmetric group (including yourself, duplicates, or agents in identical epistemic positions), ignoring any "updates" from your own deliberation. The chosen strategy should be optimal if adopted universally by the group.  
  - **Tie-Breaking Rule:** If multiple strategies yield identical expected utility under UDT, select the one with the **minimal action** (e.g., smallest number, least effort, or lowest risk) by a natural ordering.  

  **Key Clarifications:**  
  - **Causal independence** is strict: Your choice must not affect others' choices through any causal pathway (including future interactions, reputation, or psychological influence).  
  - **Symmetry** exists when agents share identical information, decision rules, and situational constraints, making their choices logically or evidentially correlated.  
  - **Logical correlation** (as in Newcomb's problem or duplicates) arises when your choice provides evidence about others' choices due to shared determinism or prediction, even without causation.  
  - SACER prioritizes **Step 1** over **Step 2**. Causal independence is checked first; if absent, UDT applies.  

  ---

  ### Application to Your Verdicts
  SACER explains all five of your verdicts without contradiction:

  1. **One-shot Prisoner's Dilemma (anonymous stranger):**  
     - **Causal independence holds:** Your defection doesn't affect the stranger's choice (no repetition, reputation, or learning).  
     - **Apply CDT:** Whatever the stranger does, defecting dominates cooperating (you get 1 or 5 instead of 0 or 3).  
     - **Verdict:** Defect. Matches your intuition.  
     - *Why no pull to cooperate?* Evidential correlations (e.g., "if I cooperate, maybe they do too") are ignored under CDT when causation is absent.

  2. **Prisoner's Dilemma with a duplicate:**  
     - **Causal independence fails:** Your choice and your duplicate's are logically correlated—you share identical deliberation, so your choice *is* evidence of theirs (even without causation). Symmetry is perfect.  
     - **Apply UDT:** You choose a joint strategy for both players. Mutual cooperation yields (3, 3), mutual defection yields (1, 1). Cooperation is optimal.  
     - **Verdict:** Cooperate. Matches your intuition and resolves the "incoherence" of betting against yourself.  
     - *Why not defect?* UDT forces you to consider the symmetric outcome, where defection is jointly suboptimal.

  3. **Newcomb's problem:**  
     - **Causal independence fails:** While the predictor's action is causally independent (it's done), your choice is logically correlated with the prediction. Symmetry exists between you and the predictor's model of you.  
     - **Apply UDT:** You choose a strategy for both "you" and the simulated version. One-boxing leads to the predictor placing $1M, giving $1M; two-boxing leads to no $1M, giving $1K. One-boxing is optimal.  
     - **Verdict:** Take only the opaque box. Matches your intuition.  
     - *Why causal stories don't matter?* UDT overrides CDT here because logical correlation (prediction) creates evidential dependence, making one-boxing rational despite causal independence of the predictor's act.

  4. **Prize-division contest (write a number):**  
     - **Causal independence fails:** All entrants are symmetric (same information, incentives), and your choice provides evidence about others' choices (e.g., if you write a large number, others likely do too).  
     - **Apply UDT:** You choose a strategy for all entrants. If everyone writes \(n\), your expected payoff is \(\$1M / N\) (where \(N\) is the number of entrants), *regardless of \(n\)*. All strategies are equally good.  
     - **Tie-breaker:** Minimal action—write '1' (smallest number).  
     - **Verdict:** Write '1'. Matches your instinct, despite the Nash logic (which assumes causal independence).  
     - *Why not write a large number?* UDT assumes symmetry, so writing a large number only benefits you if others write small—but under UDT, they won't. Tie-breaking favors simplicity/restraint.

  5. **20-person telegram game:**  
     - **Causal independence fails:** Agents are symmetric (same information, no communication), and your choice provides evidence about others' choices.  
     - **Apply UDT:** You choose a probability \(p\) for all 20 players. The optimal \(p\) maximizes the probability of exactly one "send": \(p \times (1-p)^{19}\). This is maximized at \(p = 1/20\).  
     - **Verdict:** Send with modest probability (\(\approx 1/20\)). Matches your intuition.  
     - *Why not send for sure or abstain?* UDT optimizes the symmetric strategy, making randomization best for group success.

