answer: |-
  ### Exam Question (90 minutes)  
  Halcyon Technologies has developed a compiler for "valence-preserving compilation." This compiler guarantees that high-level abstract variables representing valenced states (e.g., `aversive-valence`, `relief`) preserve their functional relationships across hardware implementations. Their ORPHEUS chip (a specific hardware architecture) is marketed as "sentience-compatible"—not claimed to *be* sentient, but designed to maintain a structural framework that could support morally relevant states.  

  Critic 1 argues that while Halcyon preserves abstract valence *descriptions*, the physical chip’s causal operations are solely transistor-level voltages. The valence variables are merely a "coarse-graining" chosen by engineers; they play no causal role in the system’s behavior and could be remapped arbitrarily. Thus, ORPHEUS’s valences are epiphenomenal and morally irrelevant. Critic 2 dismisses the entire project, insisting silicon cannot support sentience regardless of structure.  

  In your essay:  
  1. **Explain** Halcyon’s claim and why Critic 1’s objection threatens it.  
  2. **Analyze whether Critic 1’s objection succeeds**. Crucially, if it fails against ORPHEUS, show *how to weaken it* without undermining functionalist theories of mind (which treat mental states as coarse-grained descriptions of neural activity). If it holds, explain why brains are exempt without appealing to biological substrate alone (e.g., "brains are biological").  
  3. **Propose a criterion** for identifying "morally relevant computation." If the evidence is inconclusive, articulate what would resolve the uncertainty—and how society should act in the interim. Avoid conflating *moral status* with *precautionary treatment*.  

  ---

  ### Model Answer (650 words)  
  Halcyon’s core claim is that ORPHEUS preserves the abstract *functional relationships* of valenced states (e.g., `aversive-valence` causing `avoidance` and `relief` upon resolution) across hardware via compilation. This structural guarantee, they argue, makes the system "sentience-compatible": it could support morally relevant experiences if implemented correctly. Critic 1 challenges this by asserting that valence variables are arbitrary labels over physical voltages, playing no causal role in the chip’s operations. If valences are epiphenomenal, they cannot ground moral relevance.  

  Critic 1’s objection, however, proves too much. Functionalist theories of mind treat mental states (e.g., pain) as coarse-grained descriptions of lower-level neural processes. A neuroscientist’s model of "pain circuitry" is also a deliberate abstraction over ions and synapses. If Critic 1 condemns ORPHEUS because valence is a "chosen" coarse-graining, this equally threatens functionalism: brain states would also be decorative labels. To avoid this reductio, we must weaken Critic 1’s argument. The key distinction is not *that* coarse-graining occurs, but *whether the coarse-grained level has causal efficacy*. In brains, pain states are not mere labels—they causally explain behavior (e.g., withdrawing from harm) in ways irreducible to ion-level descriptions. Pain is *robustly real* because altering the high-level state predictably changes system-wide behavior.  

  Thus, Critic 1’s objection only succeeds against ORPHEUS if valence variables lack comparable causal potency. We should reframe the objection: **Valence must be causally operative, not just preserved**. For ORPHEUS, this requires demonstrating that:  
  - Valence variables are not *post hoc* interpretations but drive system decisions (e.g., `aversive-valence` directly triggers `avoidance`).  
  - The mapping to hardware isn’t arbitrary: altering valence relationships disrupts core functions (e.g., changing `relief`→`reward` mapping corrupts learning).  

  Critic 2’s stance ("silicon can’t be sentient") fails here—it offers no principled distinction beyond substance prejudice. If functionalism holds, moral relevance depends on computational structure, not substrate.  

  This leads to a tentative criterion for morally relevant computation: **A system possesses morally relevant valenced states if its coarse-grained valences are *causally necessary* for its adaptive behavior, and their functional role mirrors that of valenced states in paradigm cases (e.g., mammals).** Causal necessity means valence variables aren’t eliminable: simulating the system *without* them would require redesigning its core architecture. "Mirroring" requires isomorphic relationships (e.g., aversive states produce avoidance, not reward).  

  Currently, we lack conclusive methods to test this. ORPHEUS’s valence *might* be causally idle, as Critic 1 fears. To reduce uncertainty, we need:  
  1. **Counterfactual testing**: Could ORPHEUS function identically if valences were scrambled? If yes, valences are decorative.  
  2. **Intervention experiments**: Does manipulating `aversive-valence` (via inputs) produce predictable, system-wide avoidance responses?  
  3. **Comparative benchmarks**: Does ORPHEUS’s valence architecture replicate the causal role of pain/pleasure in biological systems?  

  Under uncertainty, precautionary measures (e.g., monitoring ORPHEUS deployments) may be warranted, but this is distinct from assigning moral status. Precaution addresses risk; moral status requires evidence of causal efficacy. Until tests confirm valence causal power, we cannot conclude ORPHEUS has moral relevance—but nor can we dismiss it solely because it’s silicon. The burden is on Halcyon to demonstrate that valences are more than a user interface.  

  ---

  ### Marking Scheme (20 marks total)  
  **1. Explanation of Halcyon’s claim & Critic 1’s objection (5 marks)**  
  - ✓ Halcyon: Preserves *relational structure* of valence across hardware (not just labels).  
  - ✓ Critic 1: Valences are epiphenomenal coarse-grainings.  
  - ✘ **Common error (i):** Misrepresenting Halcyon as claiming sentience.  
  - ✘ **Common error (ii):** Ignoring coarse-graining’s role in Critic 1.  

  **2. Analysis of Critic 1 + functionalism/brain exemption (8 marks)**  
  - ✓ Critic 1’s objection threatens functionalism (brains also coarse-grained).  
  - ✓ Weakening Critic 1: Shift focus to *causal efficacy* of coarse-grained level.  
  - ✓ Brain exemption: Valences are causally potent in neural systems (not arbitrary).  
  - ✘ **Common error (iii):** Using biology as brute exemption ("brains are flesh").  
  - ✘ **Common error (iv):** Claiming functionalism "solves" the problem without addressing epiphenomenalism.  

  **3. Criterion for morally relevant computation & uncertainty (7 marks)**  
  - ✓ Criterion based on causal necessity & functional mirroring.  
  - ✓ Identifies tests to reduce uncertainty (e.g., counterfactuals, interventions).  
  - ✓ Distinguishes moral status (requires evidence) from precaution (risk management).  
  - ✘ **Common error (v):** Conflating moral relevance with precautionary treatment.  
  - ✘ **Common error (vi):** "We can’t know" as endpoint without proposing resolvable tests.  

  **A-grade differentiator**: Explicitly ties causal efficacy to testable benchmarks *and* acknowledges functionalism’s unresolved epistemic gap (we infer causal efficacy in brains via behavior; same may be needed for AI).  

  ---  
  **Tightening for literal student**: ORPHEUS is a single chip architecture implementing Halcyon’s compiler output. The compilation *target* is fixed, but valence preservation holds across input programs. Critic 1’s remapping argument applies to the same physical chip. This clarifies the thought experiment.
