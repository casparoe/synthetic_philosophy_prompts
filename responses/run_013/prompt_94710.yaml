answer: |-
  ## Research Proposal: The Fragile Bridge Between Conventions and Norms

  **Brainstorming the Core Idea:**

  Your half-formed insight dissects Lewis effectively: separating the *solution* (arbitrary coordination equilibrium) from the *epistemic* (common knowledge sustaining it). The suspicion that common knowledge is a limiting case of weaker mutual belief + precedent salience is astute and opens several research paths:

  1.  **Epistemic Minimalism:** *What is the weakest epistemic condition (depth of mutual belief, scope of precedent salience) sufficient to sustain a Lewis-style convention?* **Open?** Partially. Work exists on bounded rationality weakening common knowledge (e.g., k-level thinking), but rarely integrated systematically with precedent salience in the context of Lewis conventions. **Feasibility?** Challenging. Requires heavy formal modelling of belief hierarchies under learning rules, likely exceeding term-paper scope and your current toolkit.
  2.  **Stability & Invasion:** *How vulnerable are pure Lewis conventions to invasion by agents who internalize the rule (norm-followers) or sanction deviators? Does this reliably trigger an evolutionary transition to a different normative structure?* **Open?** Yes. While evolutionary game theory (EGT) studies norm invasion (e.g., via replicator dynamics), it rarely asks *specifically* if this vulnerability is a *systematic feature* destabilizing *Lewis conventions as defined* (arbitrary, precedent-based, lacking intrinsic normativity/sanctions) and forcing evolution towards sanctioning. **Feasibility?** High. Perfectly suited for replicator dynamics and simple ABMs. Connects directly to your suspicion.
  3.  **Normativity from Stability?:** *Does the *need* for stability against invasion (rather than an intrinsic "ought") explain the emergence of the normative force observed in many social norms?* **Open?** Highly. This re-frames the "missing ought" objection. Instead of seeking normativity *within* the convention's definition, it posits stability pressures *drive* the *evolutionary addition* of features (sanctions, internalization) that *create* the phenomenology of normativity. **Feasibility?** Moderate as a *conceptual* claim grounded in EGT results. Hard to *prove* formally in a term paper without sophisticated modelling linking stability to phenomenology.

  **Sharpened Choice: Stability & Invasion (Option 2).** This question is genuinely open, directly addresses your core suspicion about Lewis's epistemic claims and normativity, and is perfectly scoped for your skills and timeframe. It avoids the deep epistemic modelling pitfalls of Option 1 and the potentially intractable phenomenology of Option 3, while leveraging your EGT strengths.

  ---

  **Research Proposal**

  **(1) The Core Question & Sub-Questions:**
  *   **Core Question:** Under what conditions do Lewis conventions—characterized by arbitrary coordination equilibria sustained primarily by precedent and mutual expectation (without requiring full common knowledge or intrinsic normativity/sanctioning)—prove evolutionarily unstable against invasion by agents who treat the regularity as a norm (follow it unconditionally) or who sanction deviations, leading to the emergence of stable, enforced norms?
  *   **Sub-Questions:**
      1.  **Epistemic:** Can conventions be sustained under significantly weaker epistemic conditions (e.g., finite-depth mutual belief combined with precedent salience) than Lewis's common knowledge, and is this fragility *increased* under these weaker conditions?
      2.  **Evolutionary Stability:** Are pure Lewis conventions (lacking sanctioning/internalization) inherently vulnerable to invasion by even small sub-populations of "norm internalizers" or "slight sanctioners"? What factors (e.g., population size, interaction structure, cost of sanctioning, strength of precedent salience) modulate this vulnerability?
      3.  **Norm Emergence:** When invasion succeeds, does it reliably lead to the establishment of a qualitatively different stable state recognizable as an "enforced norm" (characterized by sanctioning and/or widespread internalization), and does this process *explain* the stability of many observed norms better than assuming they originated as Lewis conventions sustained by common knowledge?

  **(2) Why Existing Positions Leave It Open:**
  *   **Lewisians & Equilibrium Theorists:** Scholars emphasizing conventions as self-sustaining Nash/coordination equilibria (like Lewis) primarily focus on *static* existence conditions under ideal rationality/knowledge. They often treat common knowledge as a *defining* feature guaranteeing stability within their model, but they have less to say about the *dynamic evolutionary stability* of these conventions under *bounded rationality* and *learning*. Their framework struggles to model the *emergence* of sanctioning from within a population initially adhering only by precedent and expectation. The "ought" objection highlights a perceived *conceptual* gap in Lewis, but doesn't engage with the *evolutionary dynamics* that might fill that gap practically.
  *   **Sanction-Centric Norm Theorists:** Scholars who view sanctions as essential to norms (or distinct from conventions) often start from the *presence* of sanctioning and analyze its function. They are less concerned with explaining how a population *transitions* from a sanction-free, precedent-based coordination equilibrium *to* a sanctioning regime. Their focus is often on the *maintenance* of existing norms with sanctions, not the evolutionary *origins* of the sanctioning behavior itself within a previously conventional population. They might assume sanctioning is primordial or arises for other reasons (e.g., group selection), bypassing the specific question of invasion into Lewis conventions.

  Both groups, for different reasons, sidestep the dynamic fragility of the precise *Lewisian construct* under evolutionary pressure and its potential role as an *intermediate step* towards enforced norms. The Lewisians assume stability under ideal conditions; the sanction-theorists often start with sanctions already present. The space between them—*how instability drives transformation*—remains underexplored formally in relation to Lewis's specific definition.

  **(3) Method: Conceptual Analysis & Simple Evolutionary Modelling**
  *   **Conceptual Part (Primary):** Rigorously define the key distinctions: Lewis convention (arbitrary solution, precedent, mutual expectation - *weak epistemic variant*), norm internalizer (follows rule unconditionally, possibly at cost), slight sanctioner (bears small cost to impose small cost on deviators). Analyze the "missing ought" objection and argue that evolutionary instability provides a *functional explanation* for the emergence of features (sanctions/internalization) that *manifest* as normativity, bypassing the need for normativity *within* the initial convention. Critically examine whether Lewis's common knowledge is necessary for static stability, or merely one (strong) way to achieve it, contrasting with the weaker epistemic model.
  *   **Formal Part (Supporting):** Develop a simple agent-based model (ABM) or use replicator dynamics on a well-chosen game.
      *   **Game:** A baseline coordination game (e.g., Drive-Left/Drive-Right) augmented with strategies:
          *   **Conventionalist (C):** Cooperates (follows precedent) if the *majority* of recent interactions (or neighbors) did so; defects otherwise. Embodies precedent-based mutual expectation (finite depth).
          *   **Norm Internalizer (I):** Always Cooperates (follows the rule), even if costly (e.g., slight payoff penalty for 'always left' if right is dominant elsewhere).
          *   **Slight Sanctioner (S):** Cooperates if majority did; if partner Defected, pays a small cost to impose a small cost on the deviator.
          *   **Deviant (D):** Always chooses the non-coordination action (defects).
      *   **Dynamics:** Replicator dynamics or imitation dynamics (agents copy successful neighbors). Key parameters: Initial proportion of strategies (start mostly C), cost of sanctioning, cost of internalizing, strength of precedent sensitivity (how many neighbors considered), population structure (well-mixed vs. lattice).
      *   **What it Shows:** The model will demonstrate:
          1.  Whether a pure `C` population is stable against small invasions of `I`, `S`, or `D`.
          2.  Under what parameter conditions `S` or `I` can invade and potentially fixate.
          3.  If the resulting stable state (`S`/`I` dominant) requires stronger epistemic conditions than the initial `C` state.
  *   **Symbiosis:** The formal model provides *evidence* for the conceptual claims about vulnerability and transition. It concretizes "fragility" and "invasion." However, the model *cannot* by itself establish the *conceptual* argument about the relationship between stability and the phenomenology of normativity, or fully adjudicate the philosophical debate about common knowledge. That requires philosophical analysis. The model shows *that* and *how* transitions happen; the conceptual part explains *why it matters* for understanding norms and Lewis's theory.

  **(4) What a Result Looks Like:**
  *   **Confirmation:** The model shows consistent invasion and fixation of `S` or `I` strategies within plausible parameter ranges (especially under weaker epistemic settings for `C`), leading to stable states clearly distinct from the initial convention. The conceptual analysis successfully argues this evolutionary pathway explains the stability of many norms and resolves the "missing ought" by showing how stability pressures *create* norm-like features, rendering Lewis's common knowledge unnecessary for ultimate stability (though perhaps sufficient).
  *   **Refutation:** The model shows pure `C` populations are robust against invasion by `S`/`I` under the weaker epistemic model, or that `S`/`I` only fixate under unrealistic parameter conditions (e.g., very high cost of sanctioning makes it non-viable). This would suggest Lewis conventions *are* stable enough without evolving sanctions/internalization, undermining the claim that instability is a systematic driver towards norms.
  *   **Salvageable Failure:** If the model proves messy or inconclusive (e.g., outcomes highly parameter-sensitive, no clear transition), the paper still succeeds by:
      1.  Clearly articulating the distinction between Lewis's solution and epistemic claims.
      2.  Making a compelling *conceptual* case for the fragility of conventions under weaker epistemologies and the plausibility of the invasion pathway.
      3.  Critically analyzing the limitations of Lewis's common knowledge requirement in light of evolutionary dynamics and learning.
      4.  Detailing the challenges of modelling this transition (valuable methodological reflection). The core philosophical critique and framework remain intact.

  **(5) Realistic Week-by-Week Plan (6000 words):**

  *   **Week 1-2: Groundwork & Framing:** Precisely define Lewis's claims (solution vs. epistemic), articulate the "missing ought" objection, formalize the weaker epistemic alternative (finite belief + precedent salience), define the target concepts (Convention, Norm Internalizer, Slight Sanctioner, Enforced Norm). Draft core Sections: Introduction, Lewis's Analysis & The Key Distinction, The Weaker Epistemic Model. *(~1500 words)*
  *   **Week 3-4: Model Design & Setup:** Finalize the game structure (payoff matrix), strategies (`C`, `I`, `S`, `D`), dynamics (imitation rule), and key parameters. Choose simulation platform (e.g., NetLogo, Python). Write detailed description of the Model for the paper. Draft Section: Modelling Evolutionary Stability. *(~1000 words)*
  *   **Week 5-6: Simulation Runs & Analysis:** Conduct systematic simulation runs: Vary key parameters (initial `S`/`I` proportion, sanction cost, internalization cost, population structure, epistemic sensitivity). Document results (stability of `C` population, invasion success/failure, final equilibrium states). Analyze patterns. Draft Section: Simulation Results & Analysis. *(~1000 words + figures)*
  *   **Week 7-8: Conceptual Synthesis:** Interpret results philosophically. Argue how they support/refute the fragility claim and the evolution pathway. Address the "missing ought" via the stability imperative. Defend the weaker epistemic model against the need for common knowledge. Compare with Lewisian and sanction-centric views. Draft Sections: From Fragile Conventions to Stable Norms, Implications for the 'Ought' and Common Knowledge, Conclusion. *(~2000 words)*
  *   **Week 9: Polish & Integrate:** Revise for clarity, flow, and argument strength. Ensure model and conceptual parts are tightly integrated. Refine definitions. Write Abstract. *(Focus on coherence)*
  *   **Week 10: Final Edits & Submission:** Proofread, format, final checks. Submit.

  **Scope Management (Where to Cut):**
  1.  **First Cut: Simplify the Model.** Reduce parameters (fix population structure as well-mixed, simplify sanctioning/internalization costs). Run fewer simulation scenarios (focus on 2-3 critical parameter variations). Reduce detail in results description.
  2.  **Second Cut: Reduce Conceptual Breadth.** Focus the "missing ought" discussion *specifically* on how stability pressures provide an answer, rather than engaging deeply with all possible accounts of normativity. Trim comparison with alternative norm theories to the most salient points.
  3.  **Third Cut: Trim Lewis Exegesis.** Assume a clear understanding of Lewis's definition is established more succinctly.

  This plan leverages your philosophical training for the core argument and your basic game theory skills for a targeted, supportive simulation. It directly tackles your insightful suspicion about Lewis and the evolution of norms within a manageable scope. Good luck!
