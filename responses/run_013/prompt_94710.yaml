prompt: |-
  I'm a third-year philosophy student in a course on social ontology and the philosophy of the social sciences, and I need to submit a short research proposal — around 1,200 words — for a term paper I'll write over the back half of the semester. Please take the role of an expert in social ontology and evolutionary game theory: someone who knows both the philosophical literature on convention and the formal literature on how norms evolve, and who is used to judging whether a proposed project is well-posed and doable.

  Before drafting anything, brainstorm for a few paragraphs: set out three or four ways the half-formed idea below could be sharpened into an actual research question, say which of those are genuinely open rather than already settled, and note which are too large for a term paper. Then pick one and write the proposal. Think carefully throughout about whether the question has a determinate answer and whether the work can actually be finished in ten weeks.

  My half-formed idea. Lewis's analysis of convention strikes me as two separable claims that the secondary literature tends to run together. The first is a solution claim: a convention is a regularity that solves a recurrent coordination problem, where which regularity it is, is arbitrary — driving on the left would have served just as well — but is fixed for the group by salience and by precedent. The second is an epistemic claim: the regularity is sustained because the relevant expectations and preferences are common knowledge among the parties. My suspicion is that the epistemic claim is doing less explanatory work than it appears to. Once we attend to how conventions are actually acquired and transmitted — locally, by imitation, by learners conditioning on what a handful of neighbours happen to do — common knowledge starts to look like a limiting case of something weaker (mutual belief of some finite depth, plus a disposition to treat precedent as salient) rather than a precondition for a convention to exist. And if that is right, I want to know what becomes of the standard objection that an analysis like Lewis's cannot account for the ought in a norm. Perhaps the missing piece is not normativity but stability: a regularity that is arbitrary and held up only by precedent should be vulnerable to invasion by even a few agents who follow the rule for its own sake, or who sanction deviations, and that suggests that the evolution of norms might systematically convert conventions into things with a different structure — things that look more like enforced norms than like Lewis conventions.

  What I want from you is a proposal containing:

  (1) the question, stated in a single sentence precisely enough that it has a determinate answer, plus the two or three sub-questions it decomposes into;

  (2) why the existing positions leave it open — not a survey and not a list of who said what, but an account in your own words of why someone who thinks conventions are self-sustaining equilibria and someone who thinks norms essentially involve sanctions each has a reason not to ask my question;

  (3) the method: what I would actually do. I have had one course in game theory, so I can handle replicator dynamics and a small agent-based simulation, but nothing heavy; say what the formal part would show and what the conceptual part of the paper would do that the formal part cannot;

  (4) what a result would look like: what would count as confirming my suspicion, what would count as refuting it, and what would count as the project failing in a way that still leaves me with a paper;

  (5) a realistic week-by-week scope for a 6,000-word paper in a ten-week term, including where to cut first if I fall behind.

  Two constraints. Assume you have no internet access and no library: do not give me a bibliography, reading list, or citations, do not attribute particular claims to particular books or page numbers, and do not quote anything — I will add references myself, and I would rather see the positions reconstructed in your own words. And be honest about difficulty: if the sharpest version of my question needs formal machinery I cannot build in a term, say so, and give me the version I can actually do.
