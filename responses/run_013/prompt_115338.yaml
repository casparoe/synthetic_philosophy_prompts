  First, I need to identify the core issue: the moral weight of shared state, language, or citizenship. The user mentions specific scenarios like diaspora, stateless peoples, naturalized citizens, emigrants, conscription, and nested obligations. These cases must be addressed in the desiderata. The user is frustrated with the circular arguments and wants a clear framework to assess any theory impartially.

  The user’s explicit requirements are:
  1. Cases the theory must handle correctly, with the reasoning behind each.
  2. Distinctions it must maintain.
  3. Separation of genuine requirements from biased ones.
  4. Neutrality: a strict cosmopolitan should meet all criteria.
  5. Flag negotiable vs. non-negotiable requirements.
  6. Identify the most exclusionary requirement.
  7. Check for any incompatible pairs.

  Digging deeper, the user might be seeking clarity in a philosophically murky area, using their engineering mindset to define "specs" for theories. They want to avoid bias, ensuring the criteria don’t favor any camp. Their unspoken need could be a structured method to critically evaluate arguments without getting bogged down in circular debates. They also might want tools to facilitate more productive discussions in their reading group by focusing on foundational criteria.

  Now, structuring the desiderata. The categories should be Ground Rules, Core Cases, Preserved Distinctions, Structural Requirements, and Aggregation & Nesting. Ground Rules ensure logical coherence and neutrality. Core Cases include the four scenarios: co-nationals vs. co-citizens, emigrants, conscription, and nested obligations. Each case has underlying considerations like voluntariness or coercion.

  Preserved Distinctions are crucial: citizenship vs. nationality, obligations vs. coercion, partiality vs. prejudice. These prevent conflation of concepts. Structural Requirements involve consistency across scales and moral parity. Aggregation tackles how obligations interact—additive, lexicographic, or rivalrous.

  Neutrality is key. Every requirement must be satisfiable by a cosmopolitan who rejects special obligations. For instance, explaining institutional coercion without endorsing partiality. The most exclusionary requirement is likely Moral Parity, as it demands that the theory doesn’t arbitrarily privilege compatriots without justification, which challenges nationalist views.

  Incompatible pairs? Moral Parity and Grounding Special Obligations might conflict if a theory can’t justify partiality without circularity. But since neutrality allows cosmopolitan solutions, they can coexist by explaining apparent obligations through other means, like coercion or efficiency.

  For the theories:
  - Strict Cosmopolitanism might struggle with Grounding Special Obligations but can satisfy others by reframing them.
  - Liberal Nationalism handles special obligations but must prove they don’t violate Moral Parity.
  - Associative Ties might conflate citizenship and nationality, failing to preserve distinctions.

  The user’s engineering background suggests they value clear, testable criteria. Ensuring each requirement is explicit and scenario-based meets that need. Highlighting negotiable vs. non-negotiable helps them prioritize. The analysis of theory performance gives them a starting point for evaluation without bias.
answer: |-
  Here is a specification of desiderata for any theory of special obligations to compatriots, designed to be neutral, handle edge cases, and force clarity. Requirements are categorized, with core cases explicitly detailed. **Bold** denotes non-negotiable requirements; others are negotiable *in how they are satisfied*, but the phenomenon must be addressed.

  ---

  ### I. Ground Rules (Non-Negotiable Foundations)
  1.  **Moral Parity Baseline:** The theory must explicitly state its position on whether compatriot obligations *fundamentally alter* the moral status of individuals compared to non-compatriots, or merely represent a *practical differentiation* in applying universal duties. It must not smuggle in moral superiority.
  2.  **Justificatory Neutrality:** The justification must be accessible and evaluable by both nationalists and cosmopolitans without presupposing the conclusion (e.g., "shared identity creates obligations" assumes what needs proving). A cosmopolitan must be able to use the theory to *explain* (even if only as a sociological fact or instrumental necessity) why states *act as if* special obligations exist.
  3.  **No Definitional Cheating:** "Compatriot" cannot be defined circularly (e.g., "those to whom I owe special obligations"). The theory must independently define the relevant bond (citizenship, shared culture, shared institutions, etc.) *before* deriving obligations.

  ### II. Core Cases & Required Handling (With Underlying Consideration)
  *(The theory must provide a coherent, non-ad-hoc account for each)*

  4.  **The Co-Nationals vs. Co-Citizens Split:**
      *   *Case:* Stateless nation (Kurds), diaspora (Jewish pre-1948), split nation (Koreas), vs. Multinational state (Switzerland), culturally alien citizen (newly naturalized non-integrated immigrant).
      *   *Consideration:* Does the obligation stem primarily from *shared identity/nationhood* or *shared institutions/citizenship*? The theory must specify its primary ground and explain obligations (or lack thereof) in mismatched scenarios. *Why* does the bond matter?
  5.  **The Emigrant's Obligation:**
      *   *Case:* A citizen who emigrates and naturalizes elsewhere.
      *   *Consideration:* Do prior obligations (e.g., taxes, potential conscription, political participation) persist, attenuate, cease, or transform? The theory must explain the mechanism of change (or stasis) based on its core justification (e.g., if obligation is based on reciprocity within institutions, does leaving terminate it? If based on identity, does it persist?).
  6.  **Coercion & Sacrifice (Conscription):**
      *   *Case:* The state compels a citizen to risk death/kill for co-citizens/nationals in defense, but not for equally threatened foreigners.
      *   *Consideration:* Can the theory justify this *asymmetric coercion*? Does it rely solely on state sovereignty (begging the question), or does the special obligation genuinely create a *unique moral permission* for the state to compel sacrifice *for this group* specifically? Must distinguish obligation from mere coercive power.
  7.  **Nesting & Rivalry:**
      *   *Case:* Conflicting obligations to city (local taxes), nation (federal taxes), humanity (global aid). Must funds for local beautification trump famine relief abroad?
      *   *Consideration:* How do obligations at different scales interact? Are they: **a)** *Additive* (all matter, weigh together), **b)** *Lexicographic* (e.g., nation always trumps humanity), **c)** *Rivalrous* (fulfilling one inherently conflicts with another), or **d)** *Derivative* (e.g., local obligations exist only to serve universal ones, or vice-versa)? The theory must specify the *structure* and *resolution principle*.

  ### III. Preserved Distinctions (Non-Negotiable)
  8.  **Citizenship vs. Nationality:** Must not conflate legal/political membership (citizenship) with cultural/ethnic identity (nationality). The theory must be able to assign different weights (even zero) to obligations arising from each.
  9.  **Obligation vs. Coercion vs. Prudence:** Must clearly distinguish: **a)** A genuine *moral obligation* owed to compatriots, **b)** A *coercive demand* by the state backed by power, and **c)** A *prudential reason* (e.g., helping neighbors prevents chaos benefiting me). A theory cannot justify (a) solely by pointing to (b) or (c).
  10. **Partiality vs. Prejudice:** Must provide a criterion for when favoring compatriots constitutes legitimate *special obligation* versus unjust *discrimination* against outsiders. What makes it *morally distinct* from favoring based on race or arbitrary preference?

  ### IV. Structural Requirements
  11. **Scalability & Consistency (Non-Negotiable):** The core justification must work consistently for the chosen unit (city, nation, etc.) *and* be applicable, in principle, to other scales (e.g., if shared institutions ground obligations in a nation-state, why don't global institutions ground similar obligations globally? If shared culture grounds it nationally, why not sub-nationally?). It must avoid "just here" special pleading.
  12. **Grounding Special Obligations (Negotiable *How*, Non-Negotiable *That*):** Must explain the *source* and *nature* of the purported special obligation. Common options (not exhaustive): Voluntariness (tacit consent?), Reciprocity (within institutions), Beneficence (efficiency/effectiveness), Associative Duties (identity/constitutive ties), or Fairness (burdens of joint projects). The chosen ground must be defensible against standard objections.
  13. **Moral Parity Challenge (Non-Negotiable, Most Exclusionary):** Must explain why the chosen ground (e.g., shared institutions, identity) *justifies differential treatment* that would be unacceptable if based on other shared characteristics (like eye color, or arbitrary group assignment). **This is the single most exclusionary requirement.** A theory fails if it cannot meet this without circularity or arbitrary assertion. *This forces the fundamental justificatory work.*
  14. **Efficacy & Feasibility (Negotiable):** Should address (but does not need to prioritize) whether recognizing special obligations is practically necessary or efficient for achieving morally desirable outcomes (e.g., stable welfare states, effective democracy, preventing global chaos). However, this cannot be the *sole* justification without collapsing distinction (9).

  ### V. Aggregation & Scope (Negotiable *How*)
  15. **Scope of "Special":** Must define the *limits* of special obligations. Do they only permit/proscribe certain actions (e.g., resource redistribution), or do they create positive duties (e.g., to fight for)? How strong are they relative to universal duties? (e.g., Does saving a compatriot *always* trump saving two strangers?)

  ---

  **Neutrality Check:** A thoroughgoing cosmopolitan (denying intrinsic moral weight to compatriot ties) can satisfy this list. They would:
  *   Explain obligations as *instrumental* (e.g., efficient resource distribution via states), *coercively imposed* but not morally foundational (9), or as *universal duties routed effectively* through institutions (scalability: 11).
  *   Meet Moral Parity (13) by arguing differential treatment is *only* justified instrumentally/prudentially (not intrinsically), thus compatible with fundamental parity.
  *   Handle core cases via institutional facts/coercion (4, 5, 6) or efficiency (7), not intrinsic obligations.

  **Incompatible Pairs?** No formal logical incompatibility exists within the desiderata themselves. The challenge is satisfying them *simultaneously* with a coherent justification. The hardest tension is often:
  *   **Grounding Special Obligations (12)** + **Moral Parity Challenge (13):** Theories relying on "associative ties" or "shared identity" often struggle to meet (13) without begging the question or resorting to instrumentalism, which may undermine the "specialness" required by (12). Instrumental/Prudential justifications (satisfying 13) often struggle to generate *genuine moral obligations* (rather than mere reasons) as required by a strong reading of (12) and (9).

  **How Theories Fare (Briefly):**
  1.  **Strict Cosmopolitanism:** Excels at 1, 2, 3, 8, 9, 10, 11, 13. Struggles with 12 (if denying *any* special obligations exist) or 6 (justifying conscription asymmetry without moral partiality). Handles 4,5,7 via institutions/efficiency. **Verdict:** Can satisfy the list by explaining apparent obligations instrumentally, but may fail *nationalist* intuitions about genuine moral bonds.
  2.  **Liberal Nationalism:** Excels at 4 (focuses on shared institutions/citizenship), 5, 6 (if tied to citizenship), 8, 12 (reciprocity/associative). Struggles acutely with 13 (justifying why *this* association is special vs. others) and 11 (scalability to global institutions). **Verdict:** Must work hard on 11 & 13 to satisfy the list; often relies on democratic self-determination or value of national culture as justifiers.
  3.  **Associative Ties View:** Excels at 4 (if focused on nationhood), 12. Struggles severely with 2 (justificatory neutrality - often assumes the moral weight of identity), 3 (risk of circularity), 8 (conflates nation/citizenship), 9 (confuses obligation with feeling), 10 (distinguishing partiality/prejudice), and most critically, 13 (why *this* association?). **Verdict:** Hardest to satisfy the list due to justificatory and neutrality challenges; often fails non-negotiables.

  This specification forces theories to confront the hard justificatory work, expose their foundational assumptions, and handle the messy realities of political life beyond idealized nation-states. Use it as a test rig.
