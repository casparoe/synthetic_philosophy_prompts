  I'm drafting a proposal for a dissertation chapter and I've got a half-formed idea I'd like you to turn into something real. The chapter is on the rule-following paradox, the Kripkenstein thing where any finite run of my past uses of a word is compatible with wildly different rules, so nothing in my history seems to fix that I meant addition rather than some deviant function cooked up to match everything I've done so far.

  Heres my hunch, and I think it's the part worth funding. Both camps seem to quietly assume something. The people who take the skeptical solution — correctness is just what the community goes on to accept — assume the community's verdict is settled and uncontested. The people who reject the paradox and say there was a fact about what I meant all along assume the same thing from the other side. I want to push on cases where the practice isn't settled: a made-up two-player tile game where the legal move is obvious to everyone at the table but nobody can actually state the rule, a private notation I invented and later abandoned, or a case where the only community available is my own future self. Does the skeptical solution still do any work when there's no stable practice to defer to, or does it just collapse into saying whatever we end up saying is right?

  Please write the proposal: the question stated precisely enough to have a determinate answer, why the existing positions leave it open, the method and why that approach rather than the obvious ones, what a result would look like and what would count as the project failing, and an honest take on whether this fits a chapter or is secretly a whole book. Skip citations, I'll fill those in.
