  Looking at the cases provided, each illustrates different political dimensions: the planter barriers show systematic exclusion; the software feature demonstrates hidden accessibility; the proprietary bicycle represents repair restrictions; the predictive triage tool reveals bias amplification; the narrow polling place entrance is direct discrimination; tamper-proof screws enable corporate control; non-reusable syringes force disposability; and the encrypted messaging app shows revocable privacy.

  I should structure the decision tree to efficiently branch based on how users interpret these cases. The first question should split the widest conceptual space - perhaps asking whether the political aspect resides in the artifact itself or elsewhere. Subsequent questions can then probe intention, necessity of effects, power relations, and determinism.

  For positions, I need to cover the spectrum from technological determinism to social constructivism, including intermediary views like affordance theory and actor-network theory. Some combinations might remain unoccupied - I'll need to identify these gaps and explain why (incoherent vs. unattractive vs. unexplored).

  The leaf positions should include: Hard Technological Determinism, Soft Technological Determinism, Material Affordance Theory, Politics-in-Design, Politics-as-Use, Socio-Technical Systems View, and Intent-Focused Politics. Each leaf must state its most awkward commitment and what one would need to give up to abandon it.

  I'll add two cases if needed to separate entangled positions: one on AI bias that's unintended but inherent, and another on dual-use technologies. But with the original eight cases, I can probably cover most distinctions. The tree should have about 12 nodes and 6-9 leaves to remain manageable.

  The handout must be self-contained, with no citations - just clear descriptive position names. The key is making the branching intuitive so students discover their own position through case analysis rather than being told what to think.
answer: |-
  ## Diagnostic Decision Tree: Artifacts and Politics

  **Instructions:** Begin with Case 1 (planter barriers). Read each question and choose the answer that best reflects your judgment *about the case at hand*. Follow the arrows to the next question or to a leaf position. Repeat with subsequent cases to explore different paths and positions.

  **Starting Case:** Planter barriers spaced to admit cars but not buses.

  **Node 1:** Does the political significance primarily arise from the *physical/material properties* of the artifact itself, or from the *social context/rules* governing its use?
  *   **(A) Physical/Material Properties** (e.g., the spacing *itself* excludes buses) → **Node 2**
  *   **(B) Social Context/Rules** (e.g., the barriers are only political because of bus routes, traffic laws, or who uses buses) → **Node 3**

  **Node 2 (from A):** Could the artifact's physical design achieve its primary function *without* the politically significant effect, even in principle?
  *   **(A) No, Effect is Necessary** (e.g., barriers designed for traffic calming *must* exclude large vehicles to work) → **Leaf 1: Hard Technological Determinism**  
      *Awkward Commitment: The political outcome (bus exclusion) is inherent and unavoidable given the physical design.*  
      *Key to Leave: Deny that the artifact's physical form necessitates specific political effects.*
  *   **(B) Yes, Effect is Contingent** (e.g., barriers could be spaced differently to admit buses while still calming cars) → **Node 4**

  **Node 3 (from B):** Is the politically significant effect primarily the result of *deliberate choice* by specific designers/sponsors?
  *   **(A) Yes, Deliberate Choice** (e.g., planners *intended* to disadvantage bus routes) → **Leaf 2: Politics-in-Design (Intentionalist)**  
      *Awkward Commitment: The artifact's politics reside solely in the conscious intent of its creators.*  
      *Key to Leave: Accept that artifacts can have political effects unintended by their creators.*
  *   **(B) No, Emergent from Use/Context** (e.g., bus exclusion emerged from general traffic planning norms, not specific intent) → **Leaf 3: Politics-as-Use/Context**  
      *Awkward Commitment: The artifact itself is neutral; all politics arise from social interpretation and use.*  
      *Key to Leave: Accept that the artifact's materiality actively shapes possibilities for use.*

  **Node 4 (from B in Node 2):** Does the artifact *systematically redistribute power* (e.g., access, control, voice) between identifiable groups, regardless of intent? (Consider Case 5: Narrow polling place entrance)
  *   **(A) Yes, Systematically Redistributes Power** (e.g., barriers exclude bus riders from efficient travel; narrow door excludes wheelchair users from voting) → **Leaf 4: Material Affordance Theory**  
      *Awkward Commitment: Artifacts inherently afford or constrain actions in ways that empower/disempower specific groups.*  
      *Key to Leave: Deny that material properties systematically enable/disable actions for different social groups.*
  *   **(B) No, Power Effect Diffuse or Contingent** → **Node 5**

  **Node 5 (from B in Node 4):** Does the artifact primarily shape what users *can conceive of as possible* or *can bring themselves to want*, rather than just what they can physically do? (Consider Case 2: Hidden accessibility feature)
  *   **(A) Yes, Shapes Perception/Desire** (e.g., hidden features make accessibility seem unavailable or not standard; Case 8: Default encryption shapes expectation of privacy) → **Leaf 5: Soft Technological Determinism / Politics of Scripting**  
      *Awkward Commitment: Artifacts subtly shape norms, expectations, and imaginations, steering behavior.*  
      *Key to Leave: Deny that designs influence user cognition and desire beyond explicit function.*
  *   **(B) No, Effect is Primarily Functional/Physical** → **Leaf 6: Politics-in-Design (Functionalist)**  
      *Awkward Commitment: Artifacts are political only through the functional choices made (e.g., screw type, reuse prevention) that enable/disable user actions.*  
      *Key to Leave: Accept that function itself can embody values beyond mere utility.*

  **Node 6 (Added for Discrimination - Use Case 4: Predictive Triage Tool):** Is the politically significant effect (e.g., bias amplification) inherent to the artifact's *operational logic* or *internal constitution*, even if unintended? (Consider Case 7: Non-reusable syringe - reuse prevention is inherent)
  *   **(A) Yes, Effect Inherent in Logic/Constitution** (e.g., retraining on biased data inherently reproduces bias; syringe design inherently prevents reuse) → **Leaf 7: Artifact as Inherently Political (Operational Logic)**  
      *Awkward Commitment: The artifact's internal functioning mechanism (algorithm, physical mechanism) embodies politics regardless of context or intent.*  
      *Key to Leave: Deny that operational logic can be inherently political.*
  *   **(B) No, Effect Depends on External Data/Deployment** (e.g., tool *could* be unbiased with different data/policy; syringe *could* be safe in a reuse-free context) → **Leaf 8: Socio-Technical Systems View**  
      *Awkward Commitment: Politics emerges only from the interaction of the artifact with specific social, institutional, and human elements.*  
      *Key to Leave: Accept that some artifacts have political effects intrinsic to their core function/design.*

  **Node 7 (Added for Discrimination - Use Case 3: Proprietary Bike App):** Does the artifact *primarily function* to shift control or power from one group (e.g., users, repairers) to another (e.g., corporations, governments) through its design?
  *   **(A) Yes, Core Function is Power Shift** (e.g., app exclusively controls access/repair; Case 6: Tamper-proof screw excludes owners) → **Leaf 4: Material Affordance Theory** (Reached via different path: Artifact directly enables corporate control/disables user control).
  *   **(B) No, Power Shift is Secondary or Contingent** (e.g., app enables convenient location, power shift is a side-effect) → **Node 5** (Proceed to assess if it shapes perception/desire or is functional).

  ---

  **Taxonomy of Positions (Leaves):**

  1.  **Hard Technological Determinism:** Politics is an inherent, necessary consequence of the artifact's physical form. *Awkward: Denies contingency or human agency.*
  2.  **Politics-in-Design (Intentionalist):** Politics resides solely in the conscious intent of the artifact's creators. *Awkward: Ignores unintended political consequences of design.*
  3.  **Politics-as-Use/Context:** The artifact itself is neutral; politics arises entirely from social interpretation and context of use. *Awkward: Neglects how materiality constrains/enables use.*
  4.  **Material Affordance Theory:** Artifacts inherently afford or constrain actions in ways that systematically empower or disempower specific social groups. *Awkward: Attributes agency/politics directly to materiality.*
  5.  **Soft Technological Determinism / Politics of Scripting:** Artifacts shape norms, expectations, desires, and imaginations, steering behavior and political possibilities subtly. *Awkward: Attributes significant normative influence to design.*
  6.  **Politics-in-Design (Functionalist):** Politics arises from the functional choices made in design that enable or disable user actions/control. *Awkward: Sees function as value-neutral conduit for political choices.*
  7.  **Artifact as Inherently Political (Operational Logic):** The internal operational logic or constitution of the artifact (e.g., algorithm, physical mechanism) embodies politics inherently. *Awkward: Sees politics as encoded within the artifact's "black box".*
  8.  **Socio-Technical Systems View:** Politics emerges solely from the complex interaction between the artifact and specific social, institutional, and human elements; the artifact alone isn't political. *Awkward: Denies any political valence to the artifact independent of its network.*

  **Gaps & Diagnoses:**

  *   **No position combining "Effect Necessary" (Node 2A) with "Power Effect Diffuse" (Node 4B):** *Gap Diagnosis:* Incoherent. If an effect is necessary to the artifact's function and has political significance, it inherently redistributes power (even diffusely) to enable that function. These answers conflict logically.
  *   **No position combining "Social Context" (Node 1B) with "Effect Inherent in Logic" (Node 6A):** *Gap Diagnosis:* Unexplored/Unattractive. Attributing inherent political logic to an artifact (Node 6A) strongly suggests the politics isn't *only* in the social context (Node 1B). This combination is likely unstable and unattractive as it tries to hold contradictory premises.

  **Note on Entanglement:** Cases 3 (Bike App) and 6 (Tamper-proof Screw) effectively lead to the same position (Leaf 4) via different paths (Node 7A or Node 4A). They both strongly exemplify material affordances directly enabling power shifts, making the distinction between these paths less critical for final positioning in this tree. The added nodes (6 & 7) are crucial for separating Leaves 7 & 8 and for providing clearer paths to Leaf 4 from different starting points.
