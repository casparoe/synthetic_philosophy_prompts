prompt: |-
  My department's reading group has been grinding through the teleology/teleonomy literature for a couple months now, and last week two of my colleagues got into it in a way I honestly couldn't referee. Dara is a philosopher of biology; Tomas is a visiting postdoc who works on metaphysics and has a low tolerance for what he calls metaphors with tenure. The fight was over what they kept calling "free-floating rationales" — the idea that selection can build a system whose states and transitions track reasons (this is a good inference to make about where the nectar is; this is the right move if that shadow is a hawk) even though nothing in the system represents those reasons or entertains them. Dara's line is that the rationale is real and does explanatory work: it floats free of any reasoner, but it's still the reason the trait is there and the standard by which the trait gets evaluated. Tomas says that's just smuggling purpose back in through the side door — if nobody entertains the reason, then "reason" is a façon de parler, and what's actually doing the work is differential reproduction plus a pile of normative vocabulary we could and should drop.

  Then it went a few rounds. Dara said the vocabulary isn't droppable, because we need it to say when a mechanism is functioning well versus malfunctioning: the frog's bug-detector that fires at falling leaves is getting it wrong, and that "wrong" is a fact about the mechanism and its history, not a projection. Tomas came back with what he called the falsifiability test — to say a system has a rationale for doing X, you have to be able to specify what state of affairs would show the rationale doesn't hold for it; otherwise you're just gerrymandering the reason to fit whatever the thing already does, and "X is well-adapted" collapses into "X happened." Dara said the frog case already meets his test. He said it doesn't, because the frog can't be corrected — there's no one whose mistake it is — and she said that's begging the question, since malfunction is exactly the case where you can be wrong with nobody home. By the end they'd drifted into whether any of this even applies to a thermostat or a river carving a channel, and Tomas said if it applies to those then it distinguishes nothing, and Dara said it applies to those but *differently*, and then the hour was up. Can you go through the arguement move by move and tell me who's right about what — in particular, is Tomas's falsifiability test a real criterion or a loaded one, and does either of them have a coherent way to say what's special about the cases that seem to matter (frogs, bees, maybe plants) as opposed to the ones that seem like a stretch (thermostats, rivers)? And tell me what both of them are missing, cause I suspect this is partly a verbal dispute and partly not.
reasoning: |-
  Okay, let me unpack this fascinating debate between Dara and Tomas. The user presents a nuanced philosophy of biology/metaphysics clash that's clearly been brewing in their reading group. 

  First, I need to map the core disagreement: Dara defends "free-floating rationales" as legitimate explanatory tools in evolutionary biology, while Tomas rejects them as smuggled teleology. The frog's bug-detector example is central - Dara sees objective malfunction (shooting at leaves), while Tomas sees only differential reproduction outcomes.

  Hmm... the user's key asks are:
  1) Evaluate Tomas' falsifiability test (is it fair or question-begging?)
  2) Clarify what distinguishes "special" cases (frogs/bees) from "stretch" cases (thermostats/rivers)
  3) Identify what both scholars might be missing

  I recall Dennett's work on free-floating rationales is crucial here - his view that evolution designs systems that act "as if" rational without internal representation. But also important is Millikan's proper functions and Neander's selected effects theories. 

  Tomas' falsifiability test seems problematic upon reflection. By requiring "someone to correct the mistake," he's implicitly demanding an agent - which is exactly what Dara argues isn't necessary for normative function. The leaf-firing frog absolutely provides falsification conditions: if the detector fires at non-nutritional objects, it's malfunctioning relative to its evolutionary function. 

  For the special cases distinction, the thermostat/river examples help clarify. Rivers lack proper functions because they weren't selected for anything - their "channeling" is just physics. Thermostats have derived intentionality from human designers, unlike frogs with evolutionary history. 

  What both might be missing: Tomas underestimates how normative function talk is indispensable in biology (think damaged organs or misfiring neurons). Dara might overextend by not clarifying that "rationale" here is heuristic, not literal reasoning. The verbal dispute angle is real - they're using "reason" differently: Tomas means cognitive representation, Dara means selective history.

  The user seems philosophically sophisticated but frustrated by the deadlock. They'd benefit from seeing how this connects to larger debates about natural norms. I should emphasize that Dara's view represents mainstream philosophy of biology, while Tomas' skepticism aligns more with radical naturalists like Rosenberg - though his strict falsifiability criterion may be too strong.
answer: |-
  Here's a breakdown of the argument, evaluating key moves and their coherence:

  ### Core Positions
  - **Dara (Philosophy of Biology):** Free-floating rationales are *real explanatory constructs*. They exist in the selective history of a trait, explain its presence/design, and provide normative standards (correct function vs. malfunction).  
  - **Tomas (Metaphysics/Naturalist):** "Rationales" are metaphorical shorthand for differential reproduction + physical causality. Calling it "reason" without a reasoner is smuggling in teleology. Normative language should be eliminable.

  ### Move-by-Move Analysis

  1. **Tomas' Falsifiability Test Challenge**  
     *Claim:* For "rationale" to be meaningful, we must specify what evidence would falsify it. Otherwise, it's just redescribing what happened.  
     *Evaluation:* This is a **loaded criterion**, not neutral. It assumes rationales require a *present agent* capable of error-correction. Dara rightly points out this begs the question by denying the core idea of *free-floating* normativity. Biological functions *can* be falsified without an agent:  
     - **Falsification Condition:** A trait malfunctions when it fails to perform the selected function *in its evolutionary context* (e.g., frog tongue-flicking at non-nutritional objects). The rationale isn't "gerrymandered" – it's defined by historical selection pressures (nectar-finding, predator avoidance).  

  2. **The Frog Malfunction Case**  
     - **Dara:** Frog shooting tongue at leaves is *objectively wrong* – the detection system fails its evolved function. Normativity comes from selective history, not a representing mind.  
     - **Tomas:** No "mistake" exists without a subject to correct it; it’s just physics.  
     *Evaluation:* **Dara wins this point.** Tomas conflates:  
       - *Psychological error* (requiring a believer)  
       - *Functional error* (deviation from evolutionarily stabilized function).  
     Biology routinely uses normative concepts (e.g., "defective heart valve") without implying internal representation.  

  3. **Extension to Thermostats/Rivers**  
     - **Tomas:** If thermostats/rivers have "rationales," the concept is empty.  
     - **Dara:** It applies *differently*: thermostats have *derived* intentionality (from human designers), rivers have *none*.  
     *Evaluation:* **Dara is coherent; Tomas oversimplifies.**  
       - **Thermostats:** Have a *borrowed* rationale (human designers represent goals). Norms are extrinsic (e.g., "malfunction" = deviation from designer intent).  
       - **Rivers:** Lack rationales entirely. Channel formation is pure physics; no selection history or design. "Efficient flow" is descriptive, not normative.  
       - **Frogs/Bees:** Have *natural* teleonomy. Traits were selected *for* functions (e.g., nectar-finding). Rationales are fixed by past selection, not current physics.  

  ### What’s Special About Biological Cases?
  Dara’s stance (standard in philosophy of biology) distinguishes **selectionist systems** from non-selectionist ones:  
  - **Frogs/Bees/Plants:** Traits exist *because* they performed functions enhancing fitness. Functions are **selected effects** (Millikan, Neander).  
  - **Thermostats:** Functions from intentional design (a selection process in cognitive space).  
  - **Rivers:** No selection history. "Channeling" is brute causation.  

  **Key Differentiator:**  
  > Traits in living systems have **proper functions** grounded in their evolutionary history, making normative evaluation (well-functioning/malfunctioning) objectively applicable.

  ### What Each Misses
  - **Tomas Misses:**  
    - Biology’s irreducibly normative vocabulary isn’t a placeholder for physics; it captures how *historical selection* constrains present function (e.g., a diseased heart isn’t just "different" – it fails its species-typical function).  
    - His falsifiability test ignores that biological functions *are* empirically testable via:  
      - Comparative anatomy (does trait T perform function F across species?)  
      - Fitness consequences (does malfunction reduce survival/reproduction?)  

  - **Dara Misses:**  
    - "Rationale" can be misleading if it implies cognitive representation. **Selected function** (teleonomy) is clearer. Overextension to thermostats risks conflating derived vs. natural teleonomy.  
    - She needs to emphasize that "tracking reasons" is a *metaphor for adaptive design* – not literal reasoning.  

  ### The Verbal vs. Substantive Dispute
  - **Verbal Aspect:** "Rationale" vs. "selected function." Dara’s view is mainstream (e.g., Dennett, Dretske), but the term triggers Tomas’ anti-teleology stance.  
  - **Substantive Aspect:** Tomas rejects that *any* non-agent system can have norms. This denies core explanatory tools in biology (e.g., why we distinguish diseased vs. healthy organs).  

  ### Who’s (Mostly) Right?  
  **Dara’s position is stronger and more coherent.** Free-floating rationales (as selected functions) are:  
  ✓ Empirically grounded in evolutionary history.  
  ✓ Necessary to explain malfunction (*not* just differential reproduction).  
  ✓ Falsifiable (via mismatch between trait performance and historical function).  
  ✓ Not applicable to rivers (no selection) or thermostats (derived intentionality).  

  Tomas’ demand for agent-dependent norms is philosophically rigid and biologically unworkable. His falsifiability test is question-begging, but it usefully forces clarification of *how* biological norms are grounded.  

  ### Key Resolution  
  **Reframe "free-floating rationale" as "selected function" (teleonomy):**  
  - It’s not a "reason" in the cognitive sense.  
  - It’s an objective, historical fact about why a trait persists.  
  - It provides norms: function well-performed vs. malfunction.  
  - This applies *only* to traits shaped by natural selection.  

  This sidesteps Tomas’ "metaphors with tenure" critique while preserving biology’s explanatory power. The frog *is* objectively malfunctioning – and that fact is explained by a free-floating selective rationale.
