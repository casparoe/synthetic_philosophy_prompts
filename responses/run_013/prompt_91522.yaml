     If the driver is following a strategy of exiting with probability p at each exit, then:
       - The probability of being at the first exit is proportional to the probability of reaching the first exit, which is 1.
       - The probability of being at the second exit is proportional to the probability of not exiting at the first exit, which is (1-p).

     Therefore, the conditional probability of being at the first exit given that you are at an exit is:
          q = 1 / (1 + (1-p)) = 1/(2-p)

     Similarly, the probability of being at the second exit is (1-p)/(2-p).

   Now, we can compute the expected payoff of a strategy with a fixed p.

