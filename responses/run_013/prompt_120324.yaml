  3. Is the intentional stance merely a useful fiction or does it reveal real patterns?
  4. Can a system be said to have beliefs if its behavior is interpretable via the intentional stance, regardless of substrate?
  5. What counts as error: deviation from design function, from interpretation, or from biological norms?
  6. Is derived intentionality parasitic on original intentionality, and if so, does that make it less real?

