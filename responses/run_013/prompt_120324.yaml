  ### Neutral Rapporteur's Report: Adversarial Collaboration on Intentionality

  As rapporteur, I refine the glosses only minimally for accuracy:  
  - For (A) the Dennettian, I specify that "richness of pattern" includes *predictive depth under the intentional stance*, and "complexity of competence" includes *behavioral flexibility*. This avoids implying mere quantitative differences.  
  - For (B) the Searlean, I clarify that "intrinsic causal power" means *biological, non-derived causal powers*, and "genuinely about" means *possessing original intentionality*. This precludes ambiguity.  

  Refinements are needed because (A) emphasizes stance-dependent patterns as constitutive, not just descriptive, while (B) insists intrinsic powers are non-functional and non-relational. Both endorse these adjustments.  

  #### Pre-draft analysis
  **Strong statements of positions**:  
  - *Dennettian (A)*: Intentionality is solely a matter of being predictable and explainable via the intentional stance—attributing beliefs, desires, and rationality. All "aboutness" is derived from this interpretive practice. The two-bitser’s state is a genuine belief (e.g., "this is not a quarter") when it rejects a slug, differing from human beliefs only in complexity, not kind. Error occurs when the system deviates from the norms of its design or interpretation. Substrate is irrelevant; functional competence suffices.  
  - *Searlean (B)*: Original intentionality is an intrinsic biological capacity—conscious or unconscious—that grounds meaning. Derived intentionality (e.g., in the two-bitser) is parasitic: assigned by agents with original intentionality and devoid of genuine aboutness. The two-bitser has no beliefs; its state is an interpreted causal link. Error requires original intentionality; the two-bitser’s malfunctions are mechanical failures, not false beliefs.  

  **Sub-questions doing the work**:  
  1. Is intentionality constituted by interpretability (functional role) or intrinsic properties?  
  2. Can derived intentionality exist without original intentionality?  
  3. Is the intentional stance revelatory or instrumental?  
  4. Does error require an intrinsic norm (e.g., biological function)?  
  5. Are causal powers tied to substrate (e.g., biology) or realizable in any functional architecture?  

  **Suspected verbal disputes** (marked ✪):  
  - ✪ The *meaning of "intentionality"*: (A) uses it functionally (pattern-based); (B) uses it intrinsically (causal-power-based).  
  - ✪ *"Belief" and "representation"*: For (A), these are stance-relative; for (B), they require intrinsic content.  
  - ✪ *"Error"*: For (A), failure relative to design/interpretation; for (B), failure relative to intrinsic norms.  

  ---

  ### 1. Stipulations and Agreed Claims  
  **Facts about the two-bitser (accepted by both)**:  
  - The device has an internal state (e.g., a binary flag) triggered by sensor inputs (weight, size, etc.).  
  - This state is set to "accept" only if inputs match a pre-defined physical profile (e.g., 5.67g, 24.26mm).  
  - The state’s causal role is fixed: "accept" activates mechanisms to retain the object and increment a counter; "reject" activates mechanisms to eject it.  
  - This role was assigned by human designers to discriminate quarters from non-quarters.  
  - The state carries information derivatively: its correlation with quarters results from design, not intrinsic properties.  
  - Downstream, the state is used solely for accept/reject decisions; it has no other functional consequences.  

  **Agreed claims (non-truistic; a bystander might think them contested)**:  
  1. The two-bitser’s state *correlates* with coin authenticity but lacks intrinsic meaning—its "aboutness" is externally assigned.  
  2. Human designers/users possess original intentionality; their mental states are not derived from external assignment.  
  3. The device can *malfunction* (e.g., rejecting a genuine coin due to sensor drift), violating its design function.  
  4. Intentional-stance explanations of the two-bitser are predictively useful and empirically successful.  
  5. Derived intentionality (e.g., in maps or words) depends on original intentionality for its assignment and interpretation.  
  6. No agreed claim is made about whether the two-bitser’s state is *truly* representational or whether its malfunction is *truly* an error.  

  ---

  ### 2. Disagreements  
  | Question | Dennettian (A) | Searlean (B) | What turns on it |  
  |----------|----------------|--------------|------------------|  
  | Does the two-bitser’s internal state (e.g., "reject") constitute a genuine belief (e.g., "this is not a quarter")? | Yes: the state is a belief because it is part of a pattern that supports successful predictions under the intentional stance. | No: the state is a mechanical cause; any "belief" is an interpretation we impose, not a state with intrinsic content. | Whether intentionality requires an interpreter or arises from functional patterns alone. |  
  | When the two-bitser malfunctions (e.g., rejects a genuine quarter), is this an instance of error (e.g., a false belief)? | Yes: it is an error relative to the norms of the intentional stance applied to the system. | No: error requires original intentionality; this is a mechanical failure, not a representational mistake. | Whether error is a functional deviation or requires intrinsic norms. |  
  | Is the intentionality of the two-bitser’s state the same *kind* as that of a human’s belief about a quarter? | Yes: both are cases of intentionality; differences are of degree (complexity, richness). | No: the two-bitser has only derived intentionality, which is ontologically distinct from original intentionality. | Whether the original/derived distinction is categorical or gradual. |  
  | Can derived intentionality (e.g., in the two-bitser) exist without original intentionality? | Yes: derived intentionality is a real pattern that can be described without presupposing an interpreter. | No: derived intentionality is always assigned by an agent with original intentionality; it cannot exist independently. | Whether intentionality is fundamentally relational or non-relational. |  
  | Is the intentional stance’s predictive success evidence that beliefs are real? | Yes: success confirms that beliefs exist as objective patterns. | No: success only shows the stance is a useful fiction; it reveals nothing about intrinsic intentionality. | Whether the stance is epistemic (revealing reality) or instrumental (a heuristic). |  

  *Neutral formulations*: All question phrasings are accepted as neutral. "Genuine belief" and "error" are inherently contested; no formulation avoids this.  

  ---

  ### 3. Cruxes  
  For each crux, both sides agree on the relevance of the argument/case. Predictions are recorded in advance.  

  1. **Crux: Is the original/derived distinction a difference in kind or in degree?**  
     - **Why it moves the debate**: (B) holds this distinction is necessary to prevent collapse into pan-intentionality; (A) holds denying it is key to naturalizing intentionality.  
     - **Argument**: Both agree that human cognition has unique complexity but disagree on whether this implies a categorical divide. The two-bitser’s simplicity tests whether complexity is contingent or essential.  
     - **Predictions**:  
       - (A) predicts advanced AI will blur the line, showing intentionality varies continuously.  
       - (B) predicts no functional complexity can eliminate the need for original intentionality as ground.  

  2. **Crux: Can derived intentionality be defined without presupposing original intentionality?**  
     - **Why it moves the debate**: (B) argues this presupposition is inescapable; (A) argues it is avoidable, making derived intentionality autonomous.  
     - **Argument**: Both agree artifacts like the two-bitser are designed by humans but disagree on whether "derived" implies dependency. The case tests if "assignment" can be analyzed non-circularly.  
     - **Predictions**:  
       - (A) predicts a functional definition (e.g., "carrying information for a system") can avoid presupposition.  
       - (B) predicts any definition will implicitly rely on original intentionality (e.g., "function" implies a designer’s intent).  

  3. **Crux: Is the intentional stance’s predictive success evidence of belief or only of a useful fiction?**  
     - **Why it moves the debate**: (A) sees success as ontological evidence; (B) sees it as consistent with eliminativism about derived states.  
     - **Argument**: Both agree the stance works for the two-bitser but disagree on why. The case tests if predictive utility entails realism.  
     - **Predictions**:  
       - (A) predicts stance-based models will integrate with computational explanations in cognitive science.  
       - (B) predicts they will remain distinct from explanations invoking intrinsic powers.  

  4. **Crux: Could a system be functionally indistinguishable from an intentional agent yet lack original intentionality?**  
     - **Why it moves the debate**: (A) denies this possibility (indistinguishability entails intentionality); (B) affirms it (e.g., a philosophical zombie).  
     - **Argument**: Both agree functional indistinguishability is conceivable but disagree on its implications. The case tests if intentionality supervenes on function.  
     - **Predictions**:  
       - (A) predicts no such system is possible; indistinguishability implies intentionality.  
       - (B) predicts such systems are possible but would lack consciousness and genuine meaning.  

  5. **Crux: Do substrate and causal powers matter over and above competence?**  
     - **Why it moves the debate**: (B) ties original intentionality to biology; (A) denies substrate matters if competence is identical.  
     - **Argument**: Both agree biology enables human cognition but disagree on whether it is necessary. The case tests multiple realizability.  
     - **Predictions**:  
       - (A) predicts non-biological systems (e.g., AI) can achieve human-like intentionality.  
       - (B) predicts non-biological systems will always lack intrinsic causal powers for intentionality.  

  ---

  ### 4. Pre-registered Predictions on New Cases  
  *(Verdicts are predictions unless stated otherwise.)*  

  **Case (a): Reinforcement-learned two-bitser**  
  - Trained on noisy data to match human cashier reliability; internal state reused for tasks like answering questions (e.g., "What is this object?").  
  - **Dennettian (A)**:  
    - Verdict: Has genuine beliefs (e.g., "this is a quarter") and can err (e.g., mislabeling a slug).  
    - Principle: Functional richness and predictive success under the intentional stance.  
    - Prediction or consequence? Prediction (based on empirical expectations).  
  - **Searlean (B)**:  
    - Verdict: Lacks beliefs; outputs are derived interpretations, not expressions of original intentionality.  
    - Principle: Absence of intrinsic biological causal powers.  
    - Prediction or consequence? Consequence (of definition).  

  **Case (b): Hybrid (human neurons)**  
  - Biological human neurons wired to perform identical coin discrimination; behaviorally identical to the two-bitser.  
  - **Dennettian (A)**:  
    - Verdict: Has intentionality, but not because of neurons; functional competence suffices.  
    - Principle: Equivalence under the intentional stance.  
    - Prediction or consequence? Consequence (of functionalism).  
  - **Searlean (B)**:  
    - Verdict: Has original intentionality due to biological substrate.  
    - Principle: Biological causal powers confer intrinsic intentionality.  
    - Prediction or consequence? Prediction (based on ontology).  

  **Case (c): Confabulating device**  
  - Accept/reject mechanism driven by unconscious processes; a separate insulated module generates reports (e.g., "I rejected it because it was too light"), which are confabulated but useful for prediction.  
  - **Dennettian (A)**:  
    - Verdict: Has beliefs (in the mechanism) but confabulated reports are not beliefs; they are useful fictions within the system.  
    - Principle: Intentional stance applies to behavioral competence, not introspective reports.  
    - Prediction or consequence? Prediction (based on stance-based realism).  
  - **Searlean (B)**:  
    - Verdict: No beliefs in any part; confabulations are derived interpretations, and mechanism has no intentionality.  
    - Principle: Absence of intrinsic intentionality; reports are assigned meaning by us.  
    - Prediction or consequence? Consequence (of derived intentionality).  

  ---

  ### 5. Verbal Disputes  
  The core verbal dispute (✪) concerns the **meaning of "intentionality"**:  
  - (A) endorses a *functional-role sense*: intentionality as a pattern discernible via the intentional stance.  
  - (B) endorses an *intrinsic/phenomenal sense*: intentionality as a non-derived causal power tied to biology.  

  **If terms are fixed**:  
  - Adopting (A)’s sense dissolves the disagreement: the two-bitser has intentionality (derived or not), differing only in degree from humans.  
  - Adopting (B)’s sense dissolves the disagreement: the two-bitser lacks intentionality, which is exclusive to biological systems.  

  **What remains after dissolution**:  
  - With fixed terms, the dispute shifts to empirical questions: e.g., "Can functional patterns explain consciousness?" or "Is biology necessary for error?" But these are not about intentionality per se. No substantive disagreement survives term-fixing; the residue is about broader metaphysics (e.g., physicalism vs. biologism).  

  ---

  ### 6. Self-Doubt  
  **Each side’s evidence against its own position**:  
  - *Dennettian (A)*: Evidence would be a system that is predictively robust under the intentional stance but lacks any plausible claim to "aboutness" (e.g., a chaotic system that accidentally mimics belief-desire patterns). (A) concedes this is conceivable but argues it is improbable.  
  - *Searlean (B)*: Evidence would be a non-biological system exhibiting intrinsic intentionality (e.g., an AI that generates original meaning without human assignment). (B) concedes this is conceivable but doubts it is possible.  

  **Jointly agreed evidence to move the debate**:  
  Both agree that **non-biological original intentionality** (e.g., in AI) would refute (B) and confirm (A). However, both sides also agree that *no such evidence is forthcoming* because:  
  - (A) expects AI to achieve intentionality via function, but (B) will dismiss this as derived.  
  - (B) expects AI to lack intrinsic powers, but (A) will attribute this to bias.  
  The debate is stalemated by **differing standards of evidence**: (A) demands functional equivalence; (B) demands intrinsic properties. This is a **defect** because it renders the dispute empirically unresolvable with current methods, risking vacuity.  

