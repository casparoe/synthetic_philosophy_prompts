prompt: |-
  I'm in a metaethics reading group that's split down the middle and we've been going at it all term. Roughly: one faction thinks the cross-cultural record from anthropology and moral psychology is basically one long argument against moral objectivity -- different communities have different fundamental values, the variation doesn't dissolve once you correct for factual ignorance and bad inference, and there's no fact of the matter about which set is right. The other faction thinks the variation is real but shallow: nearly all of it is downstream of different non-moral beliefs (about souls, ancestors, what actually causes harm, who counts as a person, what happens after death) or different weightings of a small set of shared values, and once you hold the factual beliefs and the weightings fixed there's far more convergence than the skeptics let on, with whatever remains being either in-principle resolvable or not really a moral disagreement at all.

  Write the joint statement those two could actually both sign. I want a numbered agreed-claims section, and be aggressive about it -- the empirical claims about variation both can accept, what neither is committed to (neither thinks the other is simply confused or lying about their own values), what both concede about the limits of the evidence, and what each takes the burden of proof to be. Then a disagreements section as a table, each side's view stated in wording that side would accept, followed by the cruxes. I suspect two already: whether convergence under full information is an empirical prediction or a definitional constraint, and whether apparent moral disagreement survives charitable translation at all -- the are-they-even-disagreeing question. For each crux, give a concrete test, case, or argument both sides would agree bears on it, and write down each side's prediction in advance, so neither can wriggle afterwards.

  One thing I want this document to do that our group has never managed: introduce a shared procedure for sorting the cases, something like a missing-belief audit. For each apparent cross-cultural disagreement, ask what factual belief would have to differ for the two communities to be judging the same way, then ask what happens to the disagreement when that belief is corrected -- either by an information manipulation in the field or by asking each community what it says about a hypothetical where the belief turns out false. Here's a made-up case we argued about for two hours and got nowhere, so use it or something like it: a community that treats a failure to avenge a murdered kinsman as leaving a debt owed to the dead, where the refusal is described by insiders not as cowardice but as theft. The realist should be betting that the disagreement mostly evaporates or changes shape once you fix the beliefs about what the dead can be owed; the pluralist should be betting that a hard core survives intact, and the doc should say which of them is exposed if it doesn't. Also let them say plainly whether any part of the fight is verbal -- e.g. about whether objectivity means mind-independence, or universality, or authority -- and if so which part, and what each side's claim becomes once that's pinned down. No need for citations, I've read the literature, I want the arguments. I'd rather have a short honest document then a long one that splits the difference.
reasoning: |-
  Okay, the user is part of a metaethics reading group divided into two factions: one skeptical of moral objectivity based on cross-cultural variation, and another that sees the variation as shallow, rooted in non-moral beliefs. They want a joint statement both sides can sign, with agreed claims, disagreements laid out in a table, and a concrete procedure for testing cases. 

  First, I need to understand the core tension. The skeptics see irreconcilable differences in fundamental values as evidence against objectivity, while the realists argue variation stems from factual disagreements or different weightings of shared values. The user wants this document to force clarity on testable predictions, especially using their "missing-belief audit" method. 

  Hmm, the kinsman vengeance case is key here. The user mentioned it caused hours of deadlock. For the joint statement, I'll structure it with numbered agreed claims covering common ground: both accept empirical variation exists, neither accuses the other of confusion or bad faith, and both acknowledge evidence limitations. Then disagreements go in a table with each side's view stated neutrally but accurately, plus cruxes and concrete tests. 

  For the kinsman case test: realists would predict that correcting beliefs about the dead’s capacity to be owed dissolves the "theft" framing into something like cowardice or dishonor. Skeptics would predict the core wrongness (defiling kinship bonds?) persists even after belief correction. This exposes both sides to falsification. 

  I should also address whether "objectivity" itself is a verbal dispute. Realists likely tie it to mind-independent truth-aptness, skeptics to universal convergence or categorical authority. Pinpointing this prevents talking past each other. 

  The challenge is balancing aggression (no weasel words) with neutrality (wording both accept). For the audit procedure, I'll make it step-by-step: identify factual divergence, then test via hypotheticals or information manipulation. The kinsman case must show exactly which prediction fails—if "theft" becomes "cowardice," realists gain ground; if "defilement" remains, skeptics do. 

  User’s clearly frustrated with unproductive debates. The doc should act as an adjudication tool. Short and honest > long and diplomatic. No citations, just steelmanned arguments. Might add a "burden of proof" section: realists bear proving convergence under full info, skeptics proving persistent fundamental divergence. 

  Final check: does this handle the "are-they-even-disagreeing" crux? Yes—via the translation step in the audit. And the "convergence: empirical vs definitional" crux gets tested by whether full-info hypotheticals actually resolve disputes or just shift them. 

  ...Time to draft. No fluff.
answer: |-
  ## Joint Statement on Cross-Cultural Moral Variation & Objectivity  
  **Agreed by Parties A (Skeptic/Pluralist) & B (Realist/Convergentist)**

  We, members of the reading group, hereby affirm the following points of agreement regarding the empirical record and its metaethical implications, acknowledging unresolved disagreements detailed subsequently.

  ### I. Agreed Claims
  1.  **Variation Exists:** There is substantial, well-documented variation in expressed moral norms, practices, and foundational value commitments across diverse human communities, historically and presently.
  2.  **Variation is Partly Fact-Dependent:** A significant portion of observed moral variation is contingent upon differing non-moral factual beliefs held by the communities (e.g., beliefs about causation, personhood, cosmology, consequences of actions, human/non-human nature, the afterlife).
  3.  **Variation is Partly Weighting-Dependent:** Observed differences often reflect divergent prioritizations or weightings of a recognizable set of pro-social values (e.g., care, fairness, loyalty, authority, purity, liberty) within specific contexts.
  4.  **Not Confusion or Bad Faith:** Neither party attributes the variation described in Claim 1 solely to widespread irrationality, conceptual confusion about one's *own* values, or systematic bad faith within or between cultures. We accept sincere reporting of values where possible.
  5.  **Limits of Evidence:** The historical and anthropological record is incomplete and often filtered through interpretation. Psychological studies (e.g., MFT) identify patterns but not necessarily fundamental commitments. "Full information" is an idealization not fully realizable in practice.
  6.  **Burden of Proof Defined:**
      *   **Party A (Skeptic/Pluralist):** Bears the burden of demonstrating, for specific cases, that residual disagreement persists *after* charitable translation and correction of relevant non-moral beliefs and differential weighting, and that this residual reflects genuinely fundamental, irreconcilable value differences.
      *   **Party B (Realist/Convergentist):** Bears the burden of demonstrating, for specific cases, that apparent fundamental disagreement *dissolves or significantly transforms* into agreement, factual dispute, or non-moral preference under charitable translation and correction of relevant non-moral beliefs and differential weighting.
  7.  **Shared Procedure ("Missing-Belief Audit"):** For any apparent case of fundamental cross-cultural moral disagreement (D), we agree to apply the following protocol:
      1.  **Identify Core Disagreement:** State the specific conflicting judgments/norms (e.g., Community X judges action A as morally obligatory; Community Y judges A as morally forbidden).
      2.  **Charitable Translation:** Reformulate each judgment using maximally charitable interpretation within its own conceptual scheme, avoiding ethnocentric distortion.
      3.  **Hypothesize Missing Beliefs:** Identify key *non-moral factual beliefs* (F1, F2, ... Fn) held by one or both communities that, if held differently by the other community, would likely lead them to make the *same* judgment as the other community *in the specific context*.
      4.  **Test via Hypothetical/Information Manipulation:**
          *   **Hypothetical:** Ask informed members of Community X: "If [Belief F held by Y were true], how would you judge A?" Ask informed members of Community Y: "If [Belief ~F held by X were true], how would you judge A?"
          *   **Information Manipulation (where possible):** Present members of one community with evidence challenging Belief F and observe if their judgment on A shifts towards the other community's position.
      5.  **Assess Residual Disagreement:** Determine if disagreement on the moral status of A persists *after* steps 3 & 4. Characterize the nature of any residual disagreement.

  ### II. Disagreements & Cruxes
  | Feature                      | Party A (Skeptic/Pluralist) View                                                                 | Party B (Realist/Convergentist) View                                                              | Crux                                                                                              | Concrete Test Case & Predictions                                                                                                                                                                                                                                                                                                                                                                                               |
  | :--------------------------- | :---------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Nature of Variation**      | Cross-cultural record reveals *genuinely fundamental, irreconcilable moral differences* ("hard pluralism"). | Cross-cultural variation is almost entirely *superficial*; deep convergence exists on core moral truths, obscured by factual differences & weighting. | **Does charitable translation + belief correction reveal agreement on core wrongness/permissibility?** | **Case: Kinsman Vengeance "Debt/Theft".** Community X: Failure to avenge = "Theft from the Dead" (core wrong: violating debt owed *to* deceased). Community Y: Failure = Cowardice/Dishonor (core wrong: failing duty *to kin group/living*). <br>**Test:** Ask X: "If the dead truly had no consciousness/ability to be owed anything, what is wrong with not avenging?" Ask Y: "If the dead *could* be consciously owed and wronged, what would be wrong with not avenging?" <br>**A Predicts:** X will articulate a *persistent core wrong* (e.g., "defiling the kinship bond itself," "failing the sacred duty inherent in blood," "allowing cosmic imbalance") *even without* belief in conscious dead. Y will *not* fully adopt the "theft" framing even granting belief in conscious dead. <br>**B Predicts:** X's judgment will shift significantly (e.g., towards cowardice/dishonor/family neglect). Y will find the "theft" framing intelligible *if* granting belief in conscious dead. Core disagreement on *wrongness of omission* dissolves into agreement on importance of honoring kin + factual disagreement about the dead. |
  | **Convergence under Full Info** | Convergence under idealized full information is *neither necessary nor likely* for moral truth; it's an empirical hypothesis, likely falsified. | Convergence under idealized full information & rationality is a *defining constraint* on moral objectivity; widespread divergence is prima facie evidence against it. | **Is convergence under full information a testable prediction or a definitional requirement?** | **Case:** Persistent disagreement *after* rigorous application of the Missing-Belief Audit to multiple paradigmatic cases (like Kinsman Vengeance, resource distribution norms, purity taboos). <br>**Test:** Does the audit consistently reveal residual, fundamental disagreement on core wrongness/permissibility? <br>**A Predicts:** Yes, for several core cases, revealing distinct, incompatible fundamental values. <br>**B Predicts:** No; residual disagreement will be minimal, attributable to non-moral factors (aesthetics, preferences, unresolved factual complexities) or non-fundamental aspects. |
  | **"Are They Even Disagreeing?"** | Apparent disagreements often survive charitable translation as *genuine moral conflicts* over fundamental values or the scope of moral concern. | Much apparent disagreement vanishes under charitable translation, revealing shared values applied to different (often mistaken) factual pictures, or differing weightings of shared values in context. | **Does charitable translation preserve the *moral* conflict or transform it?** | **Case:** Apply Step 2 (Charitable Translation) rigorously to the Kinsman Vengeance case *before* the belief test. <br>**Test:** Does the best translation of X's "theft" norm and Y's "cowardice/dishonor" norm reveal them to be making *incompatible* moral claims about the *same act* (omission of vengeance), or primarily different *descriptions/framings* of a shared underlying concern (e.g., honoring kinship obligations)? <br>**A Predicts:** Translations reveal incompatible core claims: X claims a debt *to the dead person* is violated; Y claims a duty *to the living kin group/social order* is violated. The *object* of the obligation differs fundamentally. <br>**B Predicts:** Translations reveal compatible core claims centered on the paramount importance of fulfilling kinship obligations to maintain honor/order; the "debt to dead" vs. "duty to living" are different *metaphors/conceptions* of the same fundamental obligation rooted in kinship bonds. |
  | **Meaning of "Objectivity" (Verbal Aspect?)** | "Objectivity" meaning *strong mind-independence* (truth aptness independent of all human responses, even idealized) is implausible. Focus is on *lack of convergence* as evidence against robust normativity/authority. | "Objectivity" centrally implies *mind-independent truth* and *categorical reasons*. Convergence under full info is the best evidence for this. Lack of convergence challenges it. | **Is the core dispute about the *feasibility/evidence* for mind-independent moral truths (A) vs. their *existence/necessity* (B)?** | **N/A (Clarification):** Both agree the *term* "objectivity" is contested. The substantive disagreement is captured above: A sees persistent fundamental disagreement as *defeating evidence* against a robust, practice-transcendent objectivity B seeks. B sees the *possibility* of convergence under corrected reasoning as *essential* to, and *evidence* for, that robust objectivity. The Kinsman Vengeance test is a microcosm of this evidential battle. |

  ### III. Outcome of the Kinsman Vengeance Test
  *   **If A's Prediction Wins (Persistent Core Wrongness):** This significantly challenges B's convergence claim and supports A's pluralism for this case. B must explain why convergence failed despite belief correction.
  *   **If B's Prediction Wins (Judgment Shifts/Dissolves):** This significantly supports B's claim of superficial variation and challenges A's claim of fundamental irreconcilability for this case. A must identify another case where the core survives or refine the notion of "fundamental."

  This document commits both parties to using the Missing-Belief Audit procedure to evaluate specific cases of apparent disagreement. Predictions for the Kinsman Vengeance case are explicitly stated above. Further cases will be subjected to the same protocol, with outcomes directly bearing on the stated cruxes and the relative burdens of proof.
