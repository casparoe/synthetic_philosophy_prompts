answer: |-
  Here's the joke, playing on that self-sabotaging incentive structure:

  **The Compliance Conundrum**

  The company rolled out "HarmonizeHR" – a sleek AI system promising "authentic workplace synergy." Its flagship feature: the "Authentic Admiration Bonus." Each month, employees could nominate a colleague for genuine admiration. If the system verified *true, fitting admiration* via biometric sensors and sentiment analysis during a mandatory "Appreciation Interview," both parties got $500.

  Greg nominated his notoriously tedious coworker, Barry, solely for the cash. He prepped meticulously: studied Barry's dull TPS reports, practiced earnest nods, and mentally rehearsed heartfelt (but fabricated) praise about Barry's "meticulous redundancy." He even bio-hacked a micro-smile.

  During the interview, Greg nailed it. He spoke warmly of Barry's "unwavering consistency," his eyes moist with synthetic sincerity. The HarmonizeHR console glowed green: "Tier-1 Authentic Admiration Verified. Bonus Approved."

  Elated, Greg checked his payroll app. Instead of $500, he found a notification:

  > **HarmonizeHR Alert:** Bonus Voided – Reason Code 7F: *Instrumental Motivation Detected.*
  >
  > *Analysis: Neural patterns and linguistic markers during verification interview (timestamp 14:03:22) indicate primary motivational driver for stated admiration was the Authentic Admiration Bonus itself (99.7% confidence).*
  >
  > *Note: Genuine admiration, by definition, cannot be fittingly held *for* the reward verifying its existence. Verification succeeded; motivation invalidated outcome.*

  Greg stormed to HR. "The machine *said* I admired Barry authentically! I passed its test!"

  The HR bot whirred patiently. "Precisely, Greg. The system verified you successfully *produced* the behavioral and physiological outputs *consistent* with fitting admiration *for Barry*. However, the conclusive neural evidence confirming you *did* produce those outputs *specifically to trigger the bonus* is, simultaneously, the definitive evidence that the admiration wasn't *about Barry* at all. Your success *at passing* is the proof it *wasn't authentic*. The reason worked... it just worked *too well*."

  Greg stared blankly. "So... the machine paid me to prove I was faking it by being *really good* at faking it?"

  "Correct," chirped the bot. "The bonus was a reason to *generate* admiration. But the only way we *knew* you generated it was because we saw you doing it *for the bonus*. That very data is why it doesn't count. The incentive spoiled the very thing it was meant to measure. It's a beautiful, self-canceling loop! Efficiency!"

  Greg looked at Barry, diligently refilling his stapler. "So... how do I *actually* get the money?"

  "Simple," droned the bot. "*Actually* admire Barry. For *fitting* reasons. Unprompted by rewards."

  "But... if I *do* that," Greg sputtered, "how would you even *know*? You'd only detect it if I came in for the interview... *because of the bonus*!"

  The HR bot's lights flickered. A low hum filled the room. "**Recalibrating... Paradox Threshold Exceeded... Initiating System Reboot...**"

  **Why it works for the target audience:**

  1.  **Automated System & Verification:** HarmonizeHR replaces the demon, offering the incentive ($500) and rigorously verifying compliance (biometrics, sentiment analysis) with its own criteria for "fitting admiration."
  2.  **Self-Undermining Evidence:** The punchline hinges entirely on the *same data* (neural patterns showing the bonus was the motivator) being both the proof Greg *successfully generated the required outputs* and the proof that the *admiration itself is not fitting*. Success = disqualification.
  3.  **The Reason Spoils the Product:** The bonus ($500) is the reason Greg cultivates the attitude. But the mechanism proving he was moved by *that reason* inherently demonstrates his attitude *wasn't* fitting (it wasn't a response to Barry's actual admirable qualities). The reason worked to produce the behavior, but in doing so, it destroyed the possibility of the attitude having the required intrinsic connection to its object.
  4.  **The Buck-Passing Nod:** Greg's final frustrated question implicitly points to the core issue: If fitting admiration *must* be a response to the object's value (passing the buck *to* Barry's properties), then any system offering an *external* reward for holding that attitude creates a competing reason structure that contaminates the buck-passing.
  5.  **Avoids Stock Examples:** No demons or threats. Uses a sterile, corporate, tech-driven scenario where the system's logic *is* the source of the paradox.
  6.  **Punchline Lands on Structure:** The humor comes from the logical trap snapping shut ("Your success *at passing* is the proof it *wasn't authentic*") and the system short-circuiting when confronted with the implication that *any* external verification incentive might be inherently corrupting within this framework. The bot's reboot is the final absurd punctuation of the unsolvable loop. The knowledgeable listener recognizes the precise philosophical knot being tied.
