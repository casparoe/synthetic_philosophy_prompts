  Let me write the scenario:

  **Scenario**: At City Hospital, the admissions staff assigns patients to rooms based on availability. Today, Mr. Brown is assigned to Room 101. Due to a malfunction, Room 101 is the only room with a functioning air conditioner, and Mr. Brown has a rare condition requiring cool air; thus, he is the only patient who must be in Room 101 for medical reasons. Consequently, the set of patients assigned to Room 101 is identical to the set of patients who must be in Room 101 for medical reasons.

  Now, the two kinds:

  Kind 1: Patient assigned to Room 101.
  Kind 2: Patient who must be in Room 101 for medical reasons.

  Analysis:

  1. For Kind 1 (assigned to Room 101):
     - This is socially constructed in the constitutive sense. The property of being assigned to Room 101 exists solely by virtue of the hospital's room assignment practice. If the practice stopped (e.g., if the hospital ceased assigning rooms and let patients choose or if it abandoned the assignment system), the property of being assigned to Room 101 would cease to exist. Even if someone were in Room 101, they would not have the property of being assigned there by the staff.

  2. For Kind 2 (must be in Room 101 for medical reasons):
     - This is socially constructed in the merely causal sense. The property of being the patient who must be in Room 101 is a result of the patient's medical condition and the room's environmental conditions. The hospital's practices (like maintenance of air conditioners or the admission of patients) causally influence these factors, but the property itself — the medical necessity — could in principle exist without the room assignment practice. For instance, if the hospital stopped assigning rooms, the medical necessity would still hold: Mr. Brown would still require Room 101 due to his condition and the room's unique feature.

  The single feature that separates the two kinds is the **dependence on a specific institutional practice for the existence of the property**. For Kind 1, the property is ontologically dependent on the practice; for Kind 2, the property is only causally dependent but ontologically independent of that specific practice.

  If we remove this feature — that is, if we imagine a scenario where the property of being assigned to Room 101 does not depend on the practice (for example, if room assignments were determined solely by physical necessity, so that the assignment practice is just a formality mirroring the necessity) — then the two kinds collapse into one. Specifically, they collapse into the merely causal kind, because the assignment property would then be nothing more than a recognition of the necessity, and it would not require an ongoing practice for its existence. The assignment would be a mere report of the fact, not a constitutive act.

  Check: How would a naturalist attack this scenario?

  A naturalist might argue that both kinds are merely causal constructions. They would contend that the property of being assigned to Room 101 is just a physical or behavioral pattern (e.g., the admission staff's actions and the hospital records) and that the property of being the patient who must be in Room 101 is similarly a physical state of affairs. They would deny that there is any ontological dependence beyond causal relations. Specifically, they might say that if the room assignment practice stopped, the property of being assigned to Room 101 would still exist as a historical property (Mr. Brown was assigned on that day) or that it reduces to physical events. Similarly, for the medical necessity, they might argue it is entirely reducible to physical facts and thus not socially constructed in any interesting sense.

  The constructionist, to hold the line, would need to argue that the property of being assigned to Room 101 is not reducible to physical or historical facts but depends on the ongoing social practice for its current existence. For instance, the assignment is a status that is maintained by the institution and has normative implications (e.g., staff are obligated to put Mr. Brown in Room 101, and he is entitled to be there). If the practice stops, the status ceases to be recognized and thus ceases to exist as a social kind, even if the physical events (like a piece of paper with an assignment) remain. The constructionist would emphasize the normative and institutional reality that cannot be captured by mere causal or physical descriptions.

  Thus, the constructionist would argue that the naturalist misses the normative and institutional dimension that constitutes the kind, which is not captured by causal relations alone.
answer: |-
  ### Scenario
  At a large urban hospital, the nursing staff assigns patients to specific rooms based on a rotating schedule. Today, Mr. Smith is assigned to Room 101. Due to a temporary plumbing issue, Room 101 is the only room with a functioning oxygen outlet, and Mr. Smith has a severe respiratory condition that requires supplemental oxygen, making him the only patient who must occupy Room 101 for medical reasons. Consequently, at this moment, the set of patients assigned to Room 101 (Mr. Smith) is identical to the set of patients who must be in Room 101 for medical reasons (Mr. Smith).

  ### Analysis
  **1. Assignment of construction sense to each kind and reasoning:**  
  - **Kind 1: Patient assigned to Room 101**  
    *Sense:* Constitutive construction.  
    *Reasoning:* The property of being "assigned to Room 101" exists solely by virtue of the hospital's ongoing room-assignment practice. If this practice ceased (e.g., if the staff stopped assigning rooms altogether), the property would immediately vanish. Even if Mr. Smith remained in Room 101, he would no longer hold the status of being "assigned" there because the practice grounds the assignment itself. The property is ontologically dependent on the collective recognition and maintenance of the assignment system.  

  - **Kind 2: Patient who must be in Room 101 for medical reasons**  
    *Sense:* Merely causal construction.  
    *Reasoning:* The property of being the patient who "must be in Room 101" arises from Mr. Smith's respiratory condition and the room's unique oxygen outlet functionality. While social practices (e.g., hospital maintenance protocols) causally influenced the plumbing issue and the admission of Mr. Smith, the property itself—medical necessity—could persist without the room-assignment practice. If the assignment practice stopped, Mr. Smith's medical need for Room 101 would remain unchanged (e.g., he would still require the oxygen outlet to survive). The property is not constituted by the assignment practice but is causally shaped by broader institutional factors; it could exist independently of that specific practice.  

  **2. Single feature separating the two kinds:**  
  The **ontological dependence on a specific institutional practice** is the feature doing the work. For Kind 1, the property's existence requires the ongoing room-assignment practice; for Kind 2, the property can exist without that practice, even if the practice causally contributes to its instantiation.  

  **3. Consequence of removing the feature:**  
  If this feature were removed—that is, if the room assignments were determined solely by medical necessity (e.g., the assignment practice is redesigned to always mirror medical needs)—the two kinds would collapse into one. Specifically, they would collapse into the *merely causal* sense of construction. In this case, "assignment" would merely reflect pre-existing medical facts, making it causally constructed but not constitutively dependent on the practice (since the assignment would be redundant with necessity). The property of assignment would lose its constitutive status because it would no longer require an independent practice to exist; it would derive entirely from the medical necessity.  

  **4. Naturalist critique and constructionist rebuttal:**  
  - **Naturalist attack:** A naturalist would argue that both kinds are merely causal constructions. They would claim that "assignment to Room 101" is reducible to physical or behavioral facts (e.g., the staff's scheduling actions, entries in a database) and that "medical necessity" is reducible to biological and environmental facts (e.g., lung function, oxygen levels). For Kind 1, the naturalist would deny ontological dependence, contending that if the practice stopped, the property would still exist as a historical or physical pattern (e.g., "Mr. Smith was assigned on day X" remains true). For Kind 2, they would argue the property is entirely explainable by natural laws, with social practices only incidentally shaping the context. The naturalist would conclude that the constitutive/causal distinction is illusory because all social properties are ultimately causal outcomes of natural facts.  
  - **Constructionist rebuttal (without reasserting):** The constructionist would counter that Kind 1 involves *normative statuses* irreducible to physical or historical facts. Assignment to Room 101 entails institutional entitlements and obligations (e.g., Mr. Smith's right to the room, staff duties to enforce the assignment) that exist only through collective recognition. If the practice ceased, these normative elements would dissolve, leaving only inert traces (e.g., a forgotten database entry), not the active property. For Kind 2, they would concede causal social influences but emphasize that the medical necessity, while socially contextualized, relies on mind-independent facts (e.g., oxygen dependence) that persist without the practice. The constructionist would argue that the naturalist conflates *causes* with *grounds*: Kind 1 is grounded in institutional norms, while Kind 2 is grounded in physical/biological states, making the former constitutively dependent. This defense relies on the irreducibility of normative realities to causal-natural descriptions.
