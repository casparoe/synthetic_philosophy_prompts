  - No concrete maximal element (it must feel found, not built) 
  - Acknowledge that starting from nothing voids everything 
  - Optional nod to choice/well-ordering equivalence 

  What makes this tricky is balancing mathematical accuracy with poetic accessibility. The philosophy-of-art partner test is especially telling – this can't just be decorated math. 

