  ### Poem: "Two Rivers"  

  **Mencius:**  
  Look at the water—how it runs downhill,  
  not taught, but pulled by weight that fits the stone’s  
  slow hollow, carving beds without a will.  
  Strike it, and it leaps up in broken tones,  
  but only to return. The splash is not  
  its nature. Watch the mountain stripped by axes,  
  cattle grazing shoots before the roots are caught—  
  we call it barren, but the green relaxes  
  back when left alone. The sprout was always there.  

  **Xunzi:**  
  The crooked timber, clamped and steamed, must bear  
  the craftsman’s force to straighten. Heat and press  
  reform the grain. The blunt edge, ground with care,  
  will cut. The wood, once bent into the curve’s caress,  
  holds fast as wheel-rim, never to regain  
  the old straight form. The ritual makes the man.  

  **Mencius:**  
  The rain returns. The sapling, fenced from teeth  
  that chew the stem, will rise where axes swung.  
  Buried roots drink. Beneath the trampled heath—  
  a vein of spring. The song that went unsung  
  is in the throat, if we clear the ash.  

  **Xunzi:**  
  The channel guides the flood that else would crash  
  in mud. The banks direct what flows unshaped.  
  The wheel, once set, defies the warping sun.  
  *We* make the current. *We* are not escaped  
  by trusting slopes. The deed, not dream, is done.  

  **Both:**  
  But when the river finds the sea—whose force  
  first moved it? Weight within or banks without?  
  The wheel that rolls: the tree’s own sap, or course  
  imposed by fire? Ritual is the doubt  
  that seeds both answers. Listen—  

  **Mencius:**  
  The mountain knows its pines.  
  **Xunzi:**  
  The kiln must bake the clay.  
  **Mencius:**  
  The sprout survives the snows.  
  **Xunzi:**  
  The clamp must hold the way.  

