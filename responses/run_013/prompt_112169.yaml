  The challenge is dramatizing the elders' frustration without lecturing. Using the dispute scene where Old Man Heron tries and fails to corner Kael with logic shows the system breaking down. Elara's quiet dread—"something had worn thin"—subtly conveys the unresolved tension. 

  Avoiding resolution is crucial. The ending with Elara staring at her hands underscores the helplessness. Metaphors like "cracks in plaster" and "rust on iron" hint at decay without spelling it out. The user’s deeper interest seems to be in metaethics—emotivism vs. logic—so the story must sit in that discomfort.
answer: |-
  Elara dipped her reed pen into the inkwell, the scratch-scratch against parchment the only sound in the schoolhouse besides the low hum of Silas. Outside, the sun beat down on the hard-packed earth square. Silas wasn't much – maybe fifty families clustered around the communal well, fields clawed from the stubborn scrub beyond. Her grandfather had been among the founders, fleeing what he called "the great fog of words" – endless arguments about *right* and *good* that seemed to float, detached, above the grubby reality of living.

  Here, words had weight because they *acted*. To call a deed **shameful** wasn't to describe a property it possessed, like being heavy or blue. It was to spit on the ground near the doer’s feet. To call it **honorable** was to clap the doer on the back, a public salute. **Base** curled the lip, **noble** lifted the chin. Children learned it with their letters. "See Jor kick the dog?" Elara would point to the simple drawing. "What do we *do*?" And the chorus would rise, sharp and clear: "Shameful!" Not a truth declared, but a social act performed.

  Elara believed in it. It felt clean. Real. When young Bren stole Old Man Heron’s prize apricots last season, the chorus of "Shameful!" that rose from the gathered neighbors felt like a physical wall pushing him back, his cheeks burning hotter than the sun. He’d returned the fruit, head bowed, the word hanging heavy on him.

  But lately... lately the cracks were showing. Like damp seeping into the foundations.

  It started with Kael. Her brother, ten years old, bright eyes always looking for the loose thread to pull. Their mother, Lira, kept a small leather purse tucked in her trunk, a few worn copper coins saved for emergencies. Kael had been eyeing the sweet cakes baker Goran displayed on market days.

  "Kael," Lira had said firmly yesterday, catching him hovering near the trunk. "You know stealing is **shameful**." Her voice held the familiar, performative edge – a warning hiss.

  Kael had nodded earnestly. "Oh, yes, Mother. Stealing? **Shameful**!" He said it with perfect conviction, the word snapping out like a whip-crack of condemnation aimed at the abstract concept of theft. He meant it. He *performed* it flawlessly.

  This morning, the coins were gone. Lira found the purse empty, Kael wiping crumbs from his mouth near the well.

  "Kael!" Lira’s voice trembled, not just with anger, but with a new kind of confusion. "You *said* stealing was shameful! You agreed!"

  Kael blinked, utterly unperturbed. "It is! Stealing? **Shameful!**" He performed the condemnation again, crisp and clear. "But taking Grandmother’s coins? That’s different." He shrugged, a picture of childish logic. "You said *if* stealing is shameful, *then* taking the coins is shameful. But me saying it’s shameful? That’s just... me saying it. Like a shout. It doesn’t *make* the coins-taking shameful. Only *saying* the coins-taking is shameful would do that. And I didn’t say *that*."

  He skipped off, leaving Lira speechless, clutching the empty purse. Elara, witnessing it from the doorway, felt a cold prickle down her spine. It wasn’t defiance, exactly. It was... consistency. Horrible, air-tight consistency with the way Silas used words.

  Later, in the square, Old Man Heron cornered Bren. Bren had borrowed Heron's best scythe without asking and nicked the blade on a rock. Heron, face purple, jabbed a gnarled finger. "Borrowing without asking? **Shameful!** You agreed last season that taking what isn't yours is **shameful**!"

  Bren shuffled his feet. "Taking the apricots? Yeah, that was **shameful**," he said, performing the condemnation of his past act perfectly. "But borrowing? That’s... sharing. You lend things all the time!" He looked genuinely puzzled. "You said *if* taking what isn't yours is shameful, *then* borrowing my scythe is shameful. But me saying taking is shameful... that was just about the apricots. It was... what I *did* then. It doesn’t chain to the scythe." He shrugged, echoing Kael’s terrifying logic. "Did I *say* borrowing your scythe was shameful? I don’t think I did." He offered a hesitant smile. "Want me to help you sharpen it?"

  Heron sputtered, looking wildly around at the gathered onlookers. "You see? You all heard him! Last season!"

  People murmured. They *had* heard Bren condemn the apricot theft. Vehemently. But Bren was right. He’d condemned *that act*. He hadn’t condemned borrowing. And condemning one act didn’t seem to *force* condemnation of another, even if, in the elders' minds, they were linked. The link was logical, built on 'if-then'. But their words didn't *do* logic. They did actions: hissing, cheering, rejecting.

  Elara tried to teach it in the schoolhouse the next day. She drew two figures. One stealing bread. One taking a tool without asking. "Both are taking what isn't given," she said carefully. "If we say *this*," she pointed to the bread thief, "is **shameful**..." She paused, waiting for the chorus.

  "**Shameful!**" the children cried, dutifully performing the social act against the drawing.

  "...then what about *this*?" She pointed to the tool-taker.

  Silence. Little faces looked from one drawing to the other. Myna, a serious girl, finally spoke. "But Teacher, we haven't *said* anything about that one yet. Should we call *it* **shameful**?" Her question wasn't about logic, but about initiating a new performance.

  "But *is* it shameful?" Elara pressed, the old, forbidden word 'is' slipping out.

  The children looked confused. Jor, Kael's friend, piped up. "It *is* if we *say* it is. Do you want us to say it, Teacher?" He raised his hand, ready to perform condemnation on command.

  Elara felt dizzy. She looked out the window towards the elders' hall. Voices were raised inside – Heron’s furious rumble, the calmer, strained tones of Elder Mara. They were trying to settle a boundary dispute between two farmers. One farmer had apparently agreed weeks ago that "encroaching on another's marked field is **base**". Now he'd shifted his fence posts a few hands' breadth. "It wasn't *encroaching*," he was likely arguing, "it was... adjusting. Did I *say* *this* moving was base? I condemned *encroaching*. This is different." His agreement then was just a performance, a social nod. Not a chain to bind him now.

  Elara dipped her pen again, but didn't write. She stared at her ink-stained fingers. The words were still there – shameful, base, honorable – potent as ever in the moment of utterance. A hiss still stung. A cheer still lifted hearts. But the threads that were supposed to connect them, to weave a consistent fabric of expectation and consequence... those threads were fraying, dissolving in the bright, harsh light of Silas's own linguistic rules.

  Kael had taken the coins because he wanted the cakes. His agreement about "stealing" was sincere, but it was a *gesture*, a vocal flinch away from an abstract badness. It didn't reach into the future to touch the specific coins in his grandmother’s purse. The word had acted *then*, against a concept. It didn't build a bridge to *now*, to the deed.

  Elara shivered despite the heat. They had built a world where words were deeds, powerful and immediate. But deeds are singular. They don't add up. They don't imply. They just *are*. And now, the settlement was learning that in this world they'd made, you could condemn theft passionately one moment, and pocket your grandmother's coins the next, perfectly consistent. You could agree that a principle was contemptible, and then violate what others saw as that same principle, untouched by your own prior words. Because those words hadn't described a truth you were bound to. They were just sounds you made, actions you performed, and then moved on from.

  She heard the voices from the elders' hall rise again, sharp with frustration that couldn't find its target. The problem wasn't malice, Elara realized with a sinking dread. It wasn't even defiance. It was something quieter, more insidious. It was the sound of their own language turning perfectly, flawlessly, against the very expectations it had once so clearly enforced. The settlement hummed on, but beneath the familiar sounds, Elara heard a new silence – the hollow space where consequence *should* have been, echoing with the perfect, logical, devastating consistency of Kael’s shrug. There was no fact to appeal to, only the next, isolated performance. And who could bind anyone to an act already finished?
