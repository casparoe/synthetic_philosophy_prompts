answer: |-
  ## The Weighing

  *(One voice grows; one stays.)*

  A cradle added.

  *Fewer, but thriving.*

  Candles multiply in windows.
  Fields promise deeper gold.

  *Fewer, but thriving.*

  Hands link across harvest.
  A new song threads the dusk.
  Another hearth flickers on.

  *Fewer, but thriving.*

  Steady hands mend the nets.
  The new voice falters on the chorus.
  Shared bread warms more palms.
  A wider ring around the fire.

  *Fewer, but thriving.*

  A shared cup thins on every lip.
  Stories blur in the crowded hall.
  The loom groans with heavier cloth.
  Footpaths widen to mud.
  The oldest song frays at its edge.

  *Fewer, but thriving.*

  Another chair scrapes in, asks room.
  The firelight strains to reach each face.
  A borrowed blanket, thin with wear.
  The mended net shows gaps again.
  Whispers start of paths untrod.
  The common tune frays into noise.

  *Fewer, but thriving.*
