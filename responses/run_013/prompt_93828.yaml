prompt: |-
  I'm the host of a public interview series run out of our department's ethics centre, and next month's guest is a philosopher who has spent the better part of a decade defending a thesis much of our audience will find perverse: that shame, not guilt, is the moral emotion a society should be organized around, and that the question of whether a culture can choose its moral emotions is not merely hard but malformed. Her position has three moving parts, and I want the interview to live or die on the joints between them. First, she holds that guilt is ledger-shaped: it presents a wrong as a debt and finds its natural completion in discharge — apology offered, restitution made, sentence served, account settled — so that an agent can be thoroughly guilt-driven while treating morality as a schedule of prices. Second, she holds that shame is identity-shaped: it presents a wrong as evidence of what one is, cannot be discharged by payment, and therefore resists the pricing of morality in a way guilt cannot. Third, and this is where I expect trouble, she holds that shame is nevertheless inescapably audience-dependent — constituted by the regard of someone, actual or imagined, whose contempt would matter to the agent — while insisting that this does not make shame heteronomous, because the relevant audience can be the self one is trying to become. Her standing move, whenever anyone raises the cruelty of shame — the shamed victim, the honour code, the pilloried teenager — is to say that this is shame in the service of a standard not worth having, and that the objection is to the standard rather than to the emotion. I want the interview to make that move harder to reach each time she uses it.

  Please draft ten to twelve questions for me, in the order I should ask them, phrased the way I would actually say them rather than as topic headings, going after the content of the position instead of inviting her to restate it. I need at least one question on each of the following, and I'd like the hardest four to come with a follow-up keyed to the answer she is most likely to give, plus, for two of them, a second follow-up that lands if she takes the other horn: (i) whether the ledger/identity contrast is a genuine structural difference between the two emotions or a redescription of the familiar thought that guilt is about acts and shame about the self, and what would show it is structural; (ii) the split between shame's occurrence and its warrant — the person ashamed of something she does not believe wrong, and unashamed of a cruelty no one knows about — and whether her account can call a shame warranted without also endorsing the contempt of the audience that would produce it; (iii) whether a shame-centred moral economy trades resentment for contempt, and what it costs to answer a wrongdoer with an attitude that demotes her from fellow participant in a shared norm to someone beneath it; (iv) the psychology of shame- and guilt-proneness, where the behavioural signatures — withdrawal and hiding versus approach and repair — appear to favour guilt, and what her account predicts that would let us tell the two apart; and (v) the scaffolding claim behind 'can a culture choose?' — whether emotions can be chosen at all, as opposed to being by-products of institutions, pedagogy, and the amount of privacy a society affords — and, if she says they cannot, how she can still hold that one repertoire is better, since a verdict nothing can act on looks inert.

  Then two cases to put to her directly, since cases will do more work here than formulations. The first is a school that abandons detention-and-apology for a circle in which the offender must say what her conduct reveals about the kind of person she is; I want her to say which procedure her view recommends, what she would count as the circle going wrong, and a follow-up for the answer that the circle has the right shape but is badly run. The second is a community in which a young woman is shamed for refusing the marriage her family has arranged; there her standard-versus-emotion distinction is under maximum strain, and I want the question that forces her either to concede that shame's structure, and not only the local standard, is doing some of the harm, or to accept that her thesis has no content beyond the truism that good standards are better than bad ones. Where a question rests on an empirical claim neither of us can settle on stage, phrase it so that it asks her to state a prediction or a commitment rather than to concede a finding. Skip anything that would let her summarize the book, anything about how she came to the topic, and anything a hostile audience member could ask just as well without having read her.
reasoning: |-
  Okay, let me tackle this complex interview question drafting request. The host is preparing for a public ethics interview with a philosopher who champions shame over guilt as society's organizing moral emotion. They want questions that probe the joints between the three core parts of her thesis, with specific requirements about structure and tough follow-ups.

  First, I need to map the key components: 
  - Guilt as ledger/debt model
  - Shame as identity model 
  - Shame's audience-dependence vs autonomy claim
  Plus the five required focus areas and two case studies.

  The host wants to avoid letting the guest default to her "standard not worth having" deflection. That means constructing questions that force engagement with shame's inherent structure rather than deflecting to standards. 

  For the ledger/identity contrast (i), I'm considering starting with a foundational question about the structural difference, then following up with what observable difference this makes in moral development. The second follow-up should challenge whether this isn't just repackaging the act/self distinction.

  On shame's warrant versus occurrence (ii), the core tension is how she separates warranted shame from problematic audience contempt. The follow-up needs to press on whether internalizing the audience solves the problem or just hides it.

  For the resentment/contempt trade-off (iii), I'll focus on the social demotion aspect. The follow-up should examine whether shame's identity-judgment necessarily creates hierarchy.

  The psychology comparison (iv) requires contrasting withdrawal versus repair behaviors. The prediction follow-up is crucial here - what testable differences does her theory suggest?

  On emotion choice (v), the scaffolding question must confront whether her normative claim has traction if emotions can't be chosen. The follow-up should press on how to improve moral emotions if they're institutionally determined.

  For the school case, I'll design questions that reveal whether the procedure's form or execution matters more to her view. The follow-up for "badly run" implementation needs to expose what specific failure modes concern her.

  The forced marriage case is the hammer - it must force a choice between conceding structural harm or admitting her thesis reduces to triviality. Phrasing it as a "what would you say to the young woman" makes it concrete and unescapable.

  Throughout, I'm avoiding any soft questions that allow book summaries or biographical detours. Each question should advance the critical examination while flowing conversationally. The sequence will build from conceptual foundations to practical implications, saving the hardest cases for last.
answer: |-
  Here are 12 tightly focused questions ordered for building pressure, incorporating your requirements and designed to make her "standard not worth having" deflection progressively harder. They assume audience familiarity with her core claims.

  **Phase 1: Probing the Core Structure (Guilt vs. Shame)**
  1.  **On the ledger/identity contrast (i):** "You argue guilt is fundamentally 'ledger-shaped', treating wrongs as debts requiring discharge, while shame is 'identity-shaped', revealing something about *who one is* that can't simply be paid off. But critics might say this is just a vivid redescription of the old idea that guilt concerns acts and shame concerns the self. **What specific, observable feature of these emotions – perhaps in how they develop, how they resolve, or how they motivate – demonstrates this is a deeper *structural* difference, not just a difference in focus?**"
      *   *Likely Answer:* She emphasizes the irrelevance of "payment" for shame resolution and shame's link to identity revelation/concealment dynamics.
      *   **Follow-Up:** "If the structural difference hinges on resistance to 'settling accounts', **couldn't a guilt-driven person also feel their *character* is permanently stained by an act, resisting closure? Conversely, couldn't someone feel shame but desperately seek a specific ritual (like a public apology they design) to 'wipe the slate clean'? Doesn't this blur the structural line you draw?"**
      *   *Alternative Horn/Follow-Up (if she focuses only on motivation):* "If the key structural difference is motivational – guilt driving repair, shame driving concealment – **doesn't that concede the behavioural evidence *favours* guilt, putting your normative claim on the back foot right from the start? How does structure rescue the value of concealment?"**

  2.  **On psychology & behaviour (iv):** "The behavioural signatures seem stark: guilt typically motivates approach – confession, apology, making amends; shame motivates withdrawal – hiding, avoiding the gaze of others. Given we generally want wrongdoers to engage and repair, **doesn't this empirical pattern suggest guilt is simply the more *functional* moral emotion for a cooperative society? What specific, counter-intuitive *benefit* does the withdrawal characteristic of shame provide, according to your identity model, that guilt cannot?"**
      *   *Likely Answer:* She argues shame forces a deeper, identity-level reckoning that superficial guilt-driven "repair" avoids, preventing moral complacency.
      *   **Follow-Up:** "**What specific, testable *prediction* does your account make about long-term moral development or recidivism that would distinguish someone morally shaped primarily by 'identity-level shame' from someone shaped primarily by 'ledger-based guilt'?** If both can lead to repair, what unique marker confirms shame's deeper work?"

  **Phase 2: Shame's Audience & Warrant**
  3.  **On audience-dependence and heteronomy (ii intro):** "You insist shame's audience-dependence – needing the regard (real or imagined) of someone whose contempt matters – doesn't make it heteronomous, because the audience can be 'the self one is trying to become'. **But when someone feels profound shame over a private act they *know* aligns with their deepest values – say, a closeted person ashamed of their sexuality in a bigoted society – isn't this precisely shame *constituted* by an internalized, hostile *external* audience ('the self I *should* be' imposed by others), not the self they authentically are or wish to become? How does your 'future self' audience avoid collapsing into that internalized oppressor?"**

  4.  **On warrant vs. occurrence & endorsing contempt (ii):** "Let's separate shame's *occurrence* from its *warrant*. A person might feel unwarranted shame (like the closeted individual) or feel *no* shame about a cruelty only they know about. For shame to be *warranted* on your view, must the agent actually *endorse* the standard *and* the *contempt* of the relevant audience (even if it's their 'future self')? Or can shame be warranted *despite* the agent rejecting the audience's contempt, solely based on the objective wrongness of the act and its identity-revealing nature?"
      *   *Likely Answer:* She'll argue warrant depends on the *objective* worth of the standard the shame reflects, not endorsing the specific audience's contempt; the audience is just the psychological trigger/container.
      *   **Follow-Up:** "**If warrant is solely about the objective standard, decoupled from endorsing the audience's *contempt*, then isn't the *contempt* itself – the specific emotional response of the audience you say shame depends on – actually morally superfluous, or even dangerous baggage? Why is this contempt-laden *structure* essential for warranted shame if only the standard matters?"**

  5.  **On the trade-off: Resentment vs. Contempt (iii):** "Guilt focuses on the *debt* owed, potentially leaving the *debtor*'s standing intact once paid. Shame, by judging *who one is*, seems to answer a wrongdoer not with a demand for repair among equals, but with an attitude that potentially *demotes* them – seeing them as lesser, beneath the standard. **Doesn't a shame-centred moral economy therefore risk trading resentment (anger at a wrong done by an equal) for contempt (disdain for a lower-status being), and isn't that a corrosive exchange? What protects the shamed person's fundamental standing as a moral agent within your framework?"**
      *   *Likely Answer:* She'll argue proper shame, tied to a worthy standard and the "future self" audience, is about *expectation* and potential, not fixed demotion; it calls one *up* to who they can be.
      *   **Follow-Up:** "**But practically, in the social dynamic, when we express shame *towards* someone – even with the 'right' standard – doesn't the very act of saying 'your act reveals a flaw in who you *are*' inherently create a hierarchy between the (unblemished?) judges and the (flawed) judged? How is this not a performance of moral superiority that entrenches contempt?"**

  **Phase 3: Culture, Choice, and Application (Scaffolding & Cases)**
  6.  **On emotion choice and scaffolding (v):** "You argue the question of whether a culture can 'choose' its moral emotions is malformed. **If emotions like guilt and shame are primarily *by-products* of institutions (legal vs. honour systems), pedagogy (punishment vs. character formation), and social structures (levels of privacy), rather than things we consciously select, how can we meaningfully say one repertoire (shame) is *better* than the other (guilt)? Doesn't this make your normative claim inert – a verdict on a system we're stuck with, not a guide for change?"**
      *   *Likely Answer:* She'll argue we *can* shape institutions, pedagogy, etc., to foster one emotional repertoire over the other, even if we don't "choose" the emotion directly.
      *   **Follow-Up:** "**If fostering shame requires specific social scaffolding – say, less privacy, stronger communal bonds, education focused on character exemplars – doesn't this inevitably *also* create the conditions for the exact kinds of cruel, standard-enforcing shame (like honour dynamics) you disavow? How do you institutionally cultivate 'good' shame without unleashing the 'bad'?"**

  7.  **Case 1: The School Circle:** "Imagine a school replaces traditional detention-and-apology with a circle process where an offender must articulate what their conduct reveals about the 'kind of person they are'. **Based solely on the *structure* of the emotions involved, not the specific standards or facilitators' skill, which procedure does your view recommend? What would be the clearest sign this circle process had gone *wrong*, revealing a problem inherent in shame's structure rather than just poor implementation?"**
      *   *Likely Answer:* She'll endorse the circle as aligning with shame's identity-shaping potential but criticize it if it fosters humiliation or permanent demotion.
      *   **Follow-Up (for "right shape, badly run"):** "If the *structure* is sound but the implementation fails (causing humiliation), **doesn't that suggest the potential for cruelty is *intrinsic* to shame's identity-judging structure, requiring constant vigilance against misuse that guilt's ledger-model might avoid? Is 'good shame' therefore inherently more fragile and dangerous?"**

  **Phase 4: Maximum Pressure on Standards vs. Structure**
  8.  **Revisiting Deflection (Pre-empting "bad standard"):** "When you dismiss cruel shame as just 'shame in service of a standard not worth having', you deflect criticism from the *emotion* to the *standard*. **But if shame is so powerfully bound to identity-revelation and audience-regard, isn't it uniquely *susceptible* to being weaponized by *any* standard, good or bad, in a way guilt's ledger might be less prone to? Doesn't its very structure make it a more dangerous tool?"**

  9.  **Case 2: The Forced Marriage:** "A young woman in a traditional community refuses an arranged marriage crucial to her family's honour. She is subjected to intense, pervasive shame – coldness, public avoidance, expressions of deep disappointment framing her as 'not a dutiful daughter', 'selfish', 'shaming her lineage'. Her community insists this shame is warranted, revealing her true flawed character. Using *your* framework – where shame is identity-revealing and constituted by audience regard – **how do you explain *to her* that the shame *she* feels, rooted in the regard of her family and community (her 'audience'), is unwarranted, *without* implicitly conceding that the very structure of shame – its identity-judging, audience-dependent nature – is itself amplifying the harm inflicted by the bad standard?"**
      *   *(This forces the horn: Concede structure contributes to harm OR reduce thesis to truism)*
      *   *Likely Answer/Deflection Attempt:* She'll focus intensely on the bad standard (patriarchy, lack of autonomy) and say *that* is the problem; the shame is a symptom.
      *   **Follow-Up:** "**If the harm here is *entirely* due to the bad standard, and the structure of shame is neutral, then what distinct, positive content does your thesis 'shame is the better moral emotion' actually add? Doesn't it collapse into the uncontroversial claim that good standards enforced by any emotion are better than bad ones?"**

  10. **On the Inert Verdict (v final push):** "If cultivating 'good shame' requires such specific, fragile social conditions (as we saw with the school and marriage cases), and if we lack direct control over moral emotions, **doesn't your conclusion – that societies *should* be organized around shame – risk becoming merely a philosopher's verdict, impossible to act upon meaningfully without risking the very harms you condemn? What concrete, *institutionally feasible* step could a society leaning heavily on guilt take *tomorrow* to responsibly move towards shame, without recreating the scaffold for cruelty?"**

  **Phase 5: Synthesis & Stakes**
  11. **On the Cost of Resistance:** "You position shame as resisting the 'pricing of morality'. Yet, in a complex, pluralistic society with diverse values, **doesn't guilt's ledger-model, precisely *because* it allows for discharge and moving on, offer a more practical mechanism for coexistence and forgiveness among strangers who don't share a thick conception of identity or a unified 'audience'? What does shame demand of social complexity that might be unsustainable?"**

  12. **The Core Challenge:** "Ultimately, your defence rests on the transformative potential of shame tied to a worthy standard and the 'self one is becoming'. **But given shame's observed link to withdrawal, its structural dependence on audience regard (which inevitably imports social hierarchies), and its historical weaponization, what evidence – psychological, sociological, or even introspective – can you point to that convinces you these profound risks are outweighed by a unique, indispensable moral good *only* shame can provide, that guilt fundamentally cannot access?"**

  **Why this order & structure:**
  1.  Starts with core conceptual distinction (i), forcing defence of structure.
  2.  Immediately challenges with behavioural evidence (iv), preventing complacency.
  3.  Moves to the tricky audience/warrant issues (ii), pressing the contempt problem.
  4.  Highlights the social cost of potential demotion (iii).
  5.  Questions the feasibility of the normative claim (v).
  6.  Applies to concrete case (School), probing for structural flaws.
  7.  **Pre-emptively** attacks the "bad standard" deflection *before* the hardest case.
  8.  **HARDEST CASE (Forced Marriage):** Forces the existential choice for her thesis.
  9.  Revisits inertness if structure/cultivation is too hard (v).
  10. Tests practical applicability in modern society.
  11. Ends with the fundamental burden of proof on her unique claim.

  This sequence builds pressure, makes the "bad standard" deflection harder each time (especially after Q8 and within Q9), and relentlessly forces engagement with the potential harms *inherent* in shame's structure as she defines it. The questions demand specific commitments, predictions, and explanations beyond restatement.
