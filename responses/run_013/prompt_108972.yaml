  | "Self comes from selfless stuff" | Emergent behavior in cellular automata / ant colonies | Your ant-colony model covers pattern stability, but Hofstadter smuggles in *subjectivity*: the colony "experiences" itself. Your terms exclude qualia. |

  **Untranslatable Claims**  
