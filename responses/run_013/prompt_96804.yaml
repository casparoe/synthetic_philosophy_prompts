prompt: |-
  I got appointed to my state's clemency board last year (I'm a software engineer, long story) and we vote on whether to recommend commuting a death sentence down to life without parole. The governor has followed every recommendation we've made, so our own votes are basically the policy now, and I don't want to just go with my gut on the one that's in front of us Thursday.

  Our record so far:
  - Hoang: guilt never really in doubt at trial, but the only thing tying him to the gun was a forensic test that the state's own lab later disavowed. We recommended commuting.
  - Fisher: the state's main eyewitness had been hypnotized by police before trial and the jury never heard about that. Commuted.
  - Whitlock: guilt certain, trial was clean, but his court-appointed lawyer was later disbarred for stuff like never investigating, he put on zero mitigation, and he never dug up the records of the childhood beatings and the brain damage. Commuted.
  - Delgado: confessed, clean trial, but he was only the lookout and the man who actually shot the clerk took a plea and is doing 25 to life. Commuted.
  - Kessler: certain guilt, clean trial, no mitigation story at all. His whole argument was that the death penalty doesn't deter anyone and costs more than locking someone up forever. Denied.
  - Ortiz: certain guilt, clean trial; the victim's mother and sister wrote to us asking us to spare him and said they'd forgiven him. Denied.
  - Vance: certain guilt, clean trial; he's 63 now, in bad health, found religion inside, mentors the younger guys. Denied.

  Thursday's case, Halloway: he confessed, there's DNA, nobody disputes he did it. Clean trial, good lawyer, no new evidence, nobody sitting on anything, he's the one who shot the clerk, he was 24 at the time, and the guy who was with him got a plea and a shorter sentence, so there's no disparity argument either. His entire petition is that the jury that picked death over life was never told that life in this state means no parole, ever -- the judge and both lawyers left them thinking he might walk in 20 years -- and one juror has now signed an affidavit saying that's the only reason she voted for death and she'd have gone the other way if she'd known. The state fixed the instruction after his trial so it can't happen again.

  So what should we do to stay consistent with ourselves? Whats the closest case we've already decided, what rule are we actually running (and what other rule fits our record just as well), and if our record definately doesn't settle it, what principle are we adopting with each way we could go? Also tell me what kind of case would actually settle it. American English please.
reasoning: |-
  Okay, the user is on a clemency board and needs to vote on the Halloway case. They want to stay consistent with past decisions. Let me look at their previous cases first.

  Halloway's case: confessed, DNA evidence, clean trial, good lawyer. The issue is the jury wasn't told that life without parole means no parole ever. One juror said she would've voted for life if she knew. The state fixed the instruction post-trial.

  Past cases:  
  - Hoang: disavowed forensic test, commuted.  
  - Fisher: hypnotized witness not disclosed, commuted.  
  - Whitlock: ineffective counsel (no mitigation for abuse/brain damage), commuted.  
  - Delgado: lookout, shooter got plea deal, commuted.  
  - Kessler: no mitigation, argued costs/deterrence, denied.  
  - Ortiz: victim's family forgave, denied.  
  - Vance: remorse, religion, mentoring, denied.

  Looking for patterns. The commutations happened when there were procedural flaws or fairness issues: unreliable evidence (Hoang, Fisher), unfair trial due to lawyer (Whitlock), disproportionate sentence (Delgado). Denials were when the arguments weren't about trial fairness but external factors (costs, forgiveness, rehabilitation).

  Halloway's issue is a procedural flaw—jury misled about parole eligibility. The juror's affidavit shows it affected the sentence. Similar to Fisher and Whitlock where undisclosed info or ineffective counsel impacted the trial. But Halloway's trial was otherwise clean. 

  Kessler, Ortiz, Vance were denied because their reasons weren't trial-related. Halloway's argument is directly about the trial process. The closest case is Fisher (undisclosed hypnosis) and Whitlock (lawyer failure). Both commuted due to trial integrity issues.

  So consistency would suggest commuting Halloway. Even though the evidence is solid, the sentencing phase was flawed. The state fixed the instruction, indicating recognition of the problem.

  If they deny Halloway, they'd need a new rule separating guilt phase errors from sentencing. But Whitlock's commutation was for sentencing mitigation failure, similar to Halloway's sentencing error.

  A case that would settle it might involve a similar procedural flaw in sentencing without other factors. Halloway fits that. Denying might imply only guilt phase errors matter, but their past includes sentencing issues (Whitlock).

  User's deeper need: ensuring fair application of clemency, avoiding arbitrariness. They want a principled approach. Highlighting the procedural flaw pattern supports that. Also, the juror's affidavit shows actual impact, which strengthens the case for commutation.
answer: |-
  Based on your board's record, **commuting Halloway's sentence is the most consistent outcome**. Here's the breakdown:

  ### 1. **Closest Precedent: Fisher & Whitlock**
     *   **Fisher (Commuted):** Jurors were denied crucial information (hypnosis) that could have altered their verdict/sentence. This compromised the trial's fundamental fairness.
     *   **Whitlock (Commuted):** Defense counsel failed completely, depriving the jury of critical mitigating evidence (abuse, brain damage) relevant to sentencing.
     *   **Halloway's Parallel:** Jurors were given *factually incorrect information* about the meaning of a life sentence ("might walk in 20 years"). This directly misled them about the alternative to death, confirmed by a juror stating it changed her vote. Like Fisher and Whitlock, the **sentencing decision was based on incomplete/misleading information**, undermining its legitimacy. The state's subsequent fix acknowledges the flaw's seriousness.

  ### 2. **The Implicit Rule Your Board is Following**
     Your clemency grants focus on **procedural fairness flaws impacting the outcome**, *especially during the guilt or sentencing phases*, regardless of overwhelming guilt evidence:
      *   **Hoang:** Unreliable evidence used at trial (disavowed test).
      *   **Fisher:** Withheld exculpatory/impeachment information (hypnosis).
      *   **Whitlock:** Ineffective assistance of counsel at sentencing (no mitigation).
      *   **Delgado:** Disproportionality in sentencing compared to the actual shooter.
      *   **Denials (Kessler, Ortiz, Vance):** Arguments focused on post-conviction factors (cost, deterrence, victim forgiveness, rehabilitation, age/health) unrelated to the *fairness or integrity of the trial/sentencing process itself*.

  **Your Board's Rule:** *"We recommend commutation where a significant flaw in the trial or sentencing process—related to evidence, information, representation, or proportionality—calls the reliability or fairness of the death sentence into serious doubt, even if guilt is certain. Arguments based solely on post-conviction circumstances unrelated to the trial's fairness are insufficient."*

  ### 3. **Alternative Rule Fitting the Record (But Less Likely)**
     A narrower rule could be: *"We recommend commutation only for flaws directly impacting the determination of guilt (Hoang, Fisher) or creating extreme sentencing inequity (Delgado). Flaws impacting only sentencing mitigation (Whitlock) or jury instructions (Halloway) are insufficient if guilt is overwhelming."*
     *   **Problem:** This rule struggles with **Whitlock**. His guilt was "certain" and the trial "clean" *except* for the mitigation failure at sentencing – which your board *did* find sufficient for commutation. Halloway's flawed instruction directly parallels Whitlock's mitigation failure: both prevented the jury from making a fully informed *sentencing* decision. Rejecting Halloway would implicitly reject the logic behind commuting Whitlock.

  ### 4. **Principles at Stake for Halloway**
     *   **Commute (Consistent Path):** Upholds the principle that the **death sentence must be imposed based on accurate information and a fair process**, particularly concerning the alternatives. The juror affidavit demonstrates the flaw was outcome-determinative for at least one juror. Clemency acts as the necessary remedy for this uncorrectable trial error impacting sentencing, consistent with Fisher (undisclosed hypnosis) and Whitlock (undisclosed mitigation).
     *   **Deny (Inconsistent Path):** Adopts the principle that **errors in sentencing instructions, even if outcome-determinative, are insufficient for clemency if guilt is certain and the trial was otherwise "clean."** This elevates the finality of the verdict over the specific unfairness inflicted during the sentencing deliberation. It directly conflicts with commuting Whitlock for a *sentencing-phase* failure and arguably minimizes the significance of the juror's sworn statement. It treats Halloway more like Kessler/Ortiz/Vance (post-conviction arguments).

  ### 5. **What Case Would Settle It?**
     A case like Halloway but **without the juror affidavit** would be the true test and could potentially lead to a denial, revealing a stricter reliance on *objective* flaws rather than *subjective* juror testimony. For example:
     *   "Halloway-B": Identical flawed instruction, no juror comes forward, no proof anyone was misled. Argument: "The *potential* for misunderstanding exists." Your board *might* deny here, distinguishing it from Fisher/Whitlock/Halloway by the lack of concrete evidence the flaw impacted the outcome. This would solidify a rule requiring **demonstrable impact** from the procedural flaw.

  ### Conclusion
  Commuting Halloway maintains strong consistency with **Fisher** (jurors denied crucial information) and **Whitlock** (sentencing decision made without critical information). The core principle is remedying **fundamental flaws in the information provided to the jury during the trial/sentencing process that undermine confidence in the death verdict**. Halloway's flawed instruction, proven by the juror affidavit to be outcome-determinative, fits squarely within this pattern established by your previous commutations. Denying him would create a significant inconsistency, particularly with Whitlock, and signal a shift towards prioritizing finality over the specific fairness of the sentencing process. Vote to commute.
