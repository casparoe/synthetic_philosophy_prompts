prompt: |-
  I am presenting a paper on the wrong kind of reasons at a value theory colloquium next month and need a question period prep sheet.

  The paper defends three claims. First, the wrong kind of reasons problem is not a local embarrassment for the fitting attitude analysis of value but a fatal one: if being valuable is being a fitting object of favouring attitudes, the analysis owes an account of which reasons bear on fittingness, and no account both admits the reasons that make ordinary value judgements true and excludes the threat of a demon who will punish you unless you admire him. Second, the reason no such account exists is that the right kind and wrong kind distinction is not a distinction between the contents of reasons at all, but between their roles: a reason is of the right kind only when it can be the basis on which the attitude is held, rather than a reason to see to it that one holds the attitude. Third, this basis condition cannot be applied to reasons one at a time, as a static filter on contents, but only to the route by which a reason enters the history of an attitude, and the case that shows this is one I constructed for the paper.

  The case: a donor offers my department a large endowment on a condition she is firm about. I am to come to admire a particular painting, a competent but unremarkable landscape, and my admiration must be unbought — she will withdraw the funds if she learns I admire the painting because of the money, since she wants the admiration to rest on the painting's merits. The money is thus a reason I have for being in a state that, by her stipulation and by the nature of admiration, can be correctly held only on the basis of reasons about the painting. Suppose it works. The money moves me to look at the painting properly, the looking makes me see something, and I now admire it, and admire it fittingly. The reason that started the process was state given, the reason I now hold the attitude for is object given, and I know perfectly well that I would never have looked without the money. The paper argues that the fitting attitude theorist cannot say what is wrong with the money's role here without giving up the claim that fittingness is the value making relation, and that the repair is a process condition on right kind reasons.

  The audience: a value theory colloquium, about ten people, most of whom work on fitting attitude analyses and take it as settled that value is analysed in terms of fittingness; two of them are committed buck passers who will hear any weakening of the fittingness claim as a concession. One Kantian thinks the whole debate treats attitudes as states to be assessed rather than as exercises of reason and will say my case is the toxin puzzle dressed in aesthetics. One formal epistemologist will want the process condition stated as a constraint on conditional probabilities or on a representation theorem, and will ask whether my account is just the old object given and state given distinction relabelled. One philosopher of emotion works on guilt and will press the basis condition with cases in which an unfitting emotion is nonetheless the right response and the fitting one would be morally worse. One person has written on reasons for desire and will ask whether my process condition even applies to conative attitudes, since desires lack the correctness conditions admiration has. Nobody will be hostile, but they will be quick and technical.

  Write the prep sheet. Give me the objections I will actually get from these five, phrased in their own vocabularies and with the emphases each will bring, ordered by expected damage, with a separate note where the order in which they will actually arrive differs from that ranking. For each objection: a two minute reply, what in the reply is soft, and whether I should concede, hold, or split. Then tell me what to concede in my opening remarks before anyone asks, which single reply has to land for the paper to survive the question period, and the question I am hoping nobody asks. Do not give me the objections a generalist audience would raise, and do not give me a survey of everything anyone has said about the problem; I want the five people in this room. Finally, if the case is incoherent as I have stated it — if there is no consistent description under which the money is both the reason for which I came to look and not the reason for which I now admire — say so plainly, because I would rather find out from you than from the Kantian.
reasoning: |-
  Okay, let me start by understanding the user's request. They need a prep sheet for a question period after presenting their paper on the wrong kind of reasons problem. The paper makes three main claims: the problem is fatal for fitting attitude analysis, the right/wrong distinction is about roles not content, and a process condition is needed. They provided a specific case involving a donor and a painting to illustrate their point.

  First, I need to identify the key audience members and their potential objections. The user listed five specific attendees: two buck-passers, a Kantian, a formal epistemologist, a philosopher of emotion, and someone who works on reasons for desire. Each has distinct concerns based on their expertise. The user wants objections phrased in each person's vocabulary, ordered by expected damage, with strategies for replies.

  The buck-passers are top priority because they might see the process condition as weakening the fittingness claim. Their objection would challenge the core argument, so the response must defend without conceding ground. The Kantian might compare the case to the toxin puzzle, which needs a clear distinction to show the difference. The formal epistemologist will want technical formalization, but the user should avoid getting bogged down in math. The emotion philosopher's point about unfitting emotions being morally better requires acknowledging the moral layer without conflating fittingness. The desire objection questions applicability to conative attitudes, so clarifying admiration's features is key.

  The donor case coherence is crucial. The user worries it might be inconsistent. I need to check if the money can be the reason for looking but not for admiring. The stipulation that the admiration must be based on the painting's merits, not the money, seems workable. If the money motivates the initial engagement, but the admiration arises from aesthetic appreciation, that's consistent. The key is ensuring the attitude's basis shifts during the process. That should hold unless there's a hidden contradiction.

  The user's deeper needs: they want to anticipate exact objections from known individuals, not generic ones. They need tactical replies that manage concessions strategically. Also, they need confidence in their case's coherence before presenting. The unasked question about circularity in the process condition is a landmine they hope to avoid. The survival reply is the buck-passer objection response, as it defends the core thesis. Preemptive concessions in opening remarks about the demon case can prevent distractions.

  I should structure the prep sheet with objections ordered by damage, each with objection phrasing, reply strategy, soft elements, and concession stance. Then address the case coherence, preemptive concessions, critical reply, and feared question. Ensuring clarity and specificity for each attendee's perspective is vital. The user's anxiety about the Kantian spotting a flaw means double-checking the case's logic. The process condition must be clearly distinguished from object/state given to avoid being dismissed as relabeling. Highlighting the dynamic shift in reasons during the attitude formation is essential for defending against all objections.
answer: |-
  Here’s your prep sheet, tailored to your specific audience and stakes. The objections are ordered by **expected damage** (most to least threatening to your core thesis), with a note on actual question-order prediction at the end.

  **Prep Sheet: Wrong Kind of Reasons Colloquium**

  **Core Thesis to Defend:** The WKR problem is fatal to FA analysis *unless* we abandon static content-based RKR/WKR distinctions and adopt a dynamic *process condition* on reasons serving as the *basis* for an attitude.

  **Preemptive Concession (Open Remarks):** "Before questions, let me clarify scope: I grant that the *standard* demon case is *not* the primary threat. My argument is that *any* account relying solely on reason-*contents* to filter the 'right kind' fails, even against *non*-coercive cases like my donor scenario. The demon highlights the problem; my case shows why content-based fixes won't work."

  ---

  **Objections & Replies (Ordered by Expected Damage)**

  1.  **The Buck-Passers (Committed FA Defenders):**  
      *   **Objection (Phrased):** "You claim the process condition *saves* FA analysis, but doesn't it *abandon* it? If fittingness requires the attitude be held *for object-given reasons*, but you allow *state-given reasons* (like the money) to *trigger the process* that *results* in holding it for object-given reasons, haven't you conceded that fittingness *itself* isn't the value-making property? Value seems to reside in the *outcome* (admiration based on merits), but the *fittingness relation* was bypassed – the money, not the merits, made you *have* the attitude *in the way required*. This collapses FA into a causal/developmental story about *how we get* fitting attitudes, not an analysis of value *as* fittingness."
      *   **Damage:** Highest. Directly attacks whether your "solution" preserves FA analysis as an *analysis of value*, making it sound like a concession.
      *   **Reply (2 min):** "No, the *property* of being a fitting object of admiration *is* the value. My case shows that *achieving* that state (holding the fitting attitude *for the right basis*) can involve a *causal history* initiated by state-given reasons *without compromising the fittingness itself*. The painting's value *consists* in it being fitting to admire it *for its merits*. That's the state I end up in. The money played a *causal-enabling* role, not a *justifying-constitutive* role *for the attitude itself*. FA analyses the *property*; my process condition addresses the *conditions under which we identify reasons as relevant to attributing that property* in an agent. The buck isn't passed on value; it's clarified how reasons function in the *ascription* of fittingness/value."
      *   **Soft:** Granting "causal-enabling" vs. "justifying-constitutive" distinction is key. Emphasize *final basis* defines fittingness *now*.
      *   **Stance:** **Hold.** Conceding here destroys the paper.

  2.  **The Formal Epistemologist:**  
      *   **Objection (Phrased):** "Your 'process condition' seems vague. How is it distinct from the standard object-given/state-given distinction except by temporalizing it? Can you formalize the 'basis' requirement? Is it a constraint on the agent's *actual reasoning process* (violated if the money consciously motivates the initial look)? Or on *conditional probabilities* (P(admiration | seeing merits) must be high *independently* of P(admiration | endowment offer))? If it's the latter, your donor case might fail if the endowment *screens off* the merits. If the former, how is it different from just requiring the *agent's conscious reason* is object-given?"
      *   **Damage:** High. Threatens to reduce your novel process condition to relabeling or reveal it as unformalizable/inconsistent.
      *   **Reply (2 min):** "It's distinct by focusing on the *functional role in attitude-sustainment*, not static content. The money is state-given content acting *initially* as an *incentive to engage*, but it *cannot* functionally serve as the *sustaining reason* for admiration *itself* due to the attitude's constitutive standards (and the donor's stipulation). Formalizing the *basis* condition requires modeling the agent's *doxastic/affective commitment structure*: the admiration is *responsive to and maintained by* evidence/considerations *about the object*, not the incentive. Crucially, P(admiration | seeing merits) *after engagement* must be high *even conditional on the initial incentive*, demonstrating the *shift* in dependence. It's not *just* temporal; it's about the *current justificatory architecture* of the attitude."
      *   **Soft:** Acknowledge the need for formal refinement ("doxastic/affective commitment structure" is hand-wavy). Offer "sustaining reason" as a placeholder.
      *   **Stance:** **Split.** Concede the need for more formal work, **hold** that the distinction is real and not merely temporal/content-relabeling. Stress the functional shift.

  3.  **The Kantian (Toxin Puzzle Comparison):**  
      *   **Objection (Phrased):** "This isn't a novel problem for FA; it's the toxin puzzle in aesthetic garb. The donor demands you form an *intrinsic* valuation (admiration based on merits) for *instrumental* reasons (the money). But admiration, like an intention, is an exercise of rational commitment. You cannot *rationally decide* to admire based on the money *and* have that admiration be genuinely based on merits – the money contaminates the rational structure. Your 'process' solution smuggles in irrationality or self-deception: you used the money as a *cause*, but rational attitude formation requires *reasons as motives*. If the money was your *reason for looking*, it was part of your motive, making the resulting attitude rationally unstable."
      *   **Damage:** Medium-High. Challenges the *rational coherence* of your case and its novelty.
      *   **Reply (2 min):** "The toxin puzzle concerns *intending in advance* to perform a future action *for its own sake* while having only an *instrumental reason to form that intention now*. My case is crucially different: the money is *not* a reason *to admire*. It's a reason *to bring it about that I admire fittingly* (by looking). Admiration *arises* during the looking, not by prior intention. The rational structure isn't contaminated because the *attitude formation wasn't decided upon instrumentally*; the *action enabling attitude formation* was. Once the merits are seen, they provide the *rational ground* for the attitude *that then exists*. It's akin to being paid to attend a lecture, where the payment gets you there, but the lecture's content convinces you. The attitude's *rational basis* is post-hoc, grounded in the object."
      *   **Soft:** Acknowledge proximity to Toxin, but stress the *attitude formation timing* difference. Concede rational scrutiny is needed for the "looking" phase.
      *   **Stance:** **Hold.** Emphasize the distinction between reason for *action enabling attitude formation* and reason *for the attitude itself*.

  4.  **Philosopher of Emotion (Guilt Focus):**  
      *   **Objection (Phrased):** "Your 'basis condition' over-intellectualizes attitudes and ignores moral dimensions. Consider guilt: sometimes feeling *unfitting* guilt (e.g., for something you truly didn't cause) is the *morally right* or *constructive* response – it shows respect for the victim or motivates reparative action. The *fitting* attitude (no guilt) might be callous. Doesn't this show the 'right kind' of reason for an attitude can be *moral* or *practical*, overriding fittingness? In your terms, the moral reason *should* be the basis, even if it makes the attitude unfitting by FA lights. Doesn't this break the FA link to value?"
      *   **Damage:** Medium. Challenges the universality of your "basis condition" and the FA link to value by introducing overriding moral reasons.
      *   **Reply (2 min):** "This is a powerful point about the *plurality* of normative domains. My paper targets FA analysis *of value* (e.g., admirability, desirability). For *that* specific project, the 'basis condition' isolates the reasons relevant to *evaluative fittingness*. Moral reasons to feel guilt might make feeling guilt *appropriate*, *wise*, or *obligatory*, but they don't make the *action* the agent feels guilty *about* genuinely *guilt-worthy* (i.e., *valuable* as wrong *by them*). FA aims to capture *that* specific evaluative property. The moral reason is the 'right kind' for the *overall appropriateness of having the emotion*, but not necessarily for the *evaluative fittingness* component that FA ties to value. They track different things."
      *   **Soft:** Concede that "right kind" might be context-sensitive to the normative question (e.g., evaluative fittingness vs. overall appropriateness).
      *   **Stance:** **Split.** **Hold** that the FA project requires isolating *evaluative* fittingness. **Concede** that other normative considerations exist and might use "reason" differently.

  5.  **Reasons-for-Desire Theorist:**  
      *   **Objection (Phrased):** "Your 'basis condition' seems parasitic on attitudes like admiration having *constitutive standards of correctness* tied to their objects (merits). But what about desire? Desires arguably lack such robust correctness conditions. We can desire things for any reason – state-given, object-given, whimsically. Applying a 'process condition' seems nonsensical. If FA analysis of value is supposed to cover the desirable (what should be desired), but desires lack the constraint admiration has, doesn't this show your 'solution' is local to attitudinal kinds with strong correctness conditions, and thus fails as a general solution to the WKR problem for FA?"
      *   **Damage:** Low-Medium. Threatens the generality of your solution.
      *   **Reply (2 min):** "This is a serious challenge for *desire-based* FA accounts. My argument primarily targets pro-attitudes like admiration, blame, etc., with clearer constitutive standards. For desire, the FA theorist *must* provide an account of *fitting desire* or abandon analyzing value via desires. If desires truly lack correctness conditions, then perhaps FA *shouldn't* use them as the canonical attitude. If they *do* have fittingness conditions (e.g., desiring the good, or desiring under the guise of the good), then a process condition *could* apply: a reason is RKR only if it can serve as the basis for a desire *understood as responsive to that 'good'*. The donor case structure might not map perfectly, but the core idea – distinguishing reasons that *are* the basis from incentives that *cause* formation of a desire held for a basis – could still apply *if* fitting desire is coherent."
      *   **Soft:** Acknowledge the challenge for desire specifically. Suggest FA might work better with attitudes like admiration.
      *   **Stance:** **Split/Concede.** **Hold** that the process condition works for attitudes *with* correctness standards. **Concede** that desire poses a distinct, possibly intractable, problem for FA that your paper doesn't resolve. Defend the *significance* of solving it for a major class of attitudes.

  ---

  **Case Coherence:** **The case is coherent as stated.** The description holds: The money is the *motivating reason for the action* (looking at the painting properly). The *perceived merits of the painting* are the *basis/reason for which the admiration is held*. The stipulation ("unbought") and the nature of admiration ensure that *for the admiration to exist and be fitting*, it *must* be held for object-based reasons. The money's role is purely causal/enabling for the engagement, not justificatory for the attitude itself. There's no contradiction, provided the attitude *formed during the looking* is genuinely responsive to the object and *sustained* by those reasons.

  **Order of Actual Questions Prediction:** Likely order: Kantian (jumps on the case immediately), Formal Epistemologist (wants clarification), Buck-Passer 1 (core challenge), Philosopher of Emotion (sees connection to their work), Reasons-for-Desire Theorist (specific angle), Buck-Passer 2 (follow-up/clarification). *Damage order remains the same regardless of when asked.*

  **Critical Reply to Land:** **The Buck-Passer reply (Objection 1) MUST land.** If the audience believes your process condition abandons FA analysis rather than saving it, the paper fails in its primary aim. Focus all clarity and force here. Rehearse distinguishing "causal enabler of process" from "justifier of attitude."

  **Question You Hope Nobody Asks:** "Isn't your 'process condition' itself ultimately circular? You say a reason is RKR *only if* it can be the basis for the attitude. But whether it *can* be the basis seems to depend on whether it's *already* of the right kind/content to fit the attitude's constitutive standard. Haven't you just pushed the problem back without solving it?" (This attacks the foundational move of abandoning content for role/process. A strong but risky reply involves doubling down on the constitutive standard defining *what counts* as a potential basis, making the process condition about *how reasons function* relative to that standard, not defining the standard).

  **Key Preemptive Concession:** Already covered above: Clarify the demon is illustrative, the donor case is the real test for content-based filters. This diffuses distractions about variations of the demon case early.

  Good luck! The specificity of your case and the process focus are strengths. Be prepared for intense technical sparring, but your arguments are well-structured for this audience.
