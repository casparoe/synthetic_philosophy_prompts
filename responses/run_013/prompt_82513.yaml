prompt: |-
  Ok so I'm putting together the first session of a grad seminar on negative causation, and before I let them loose on the literature I want to nail the criteria. What I need from you is the desiderata. If someone hands me a theory of causation by omission, what does it have to get right before I even bother argueing with it?

  Give me the list -- the cases it has to handle, the distinctions it can't flatten, the things it's not allowed to say -- and for each one, the case or consideration that puts it on the list. Then tell me which of them are non-negotiable and which are just house rules of one camp, and flag any pair you think can't be had together. That last bit is the part I actually care about; if the list turns out to be jointly unsatisfiable, that's a result, not a failure.

  A few things I want covered, and a couple of my own hobby horses that you should treat as data rather than doctrine:

  - the relata question: omissions aren't events, so does a theory owe us an account of what the causal relata even are, or can it just treat "the omission" as a placeholder and move on?
  - the ordinary cases (the gardener who didn't water, the lifeguard on his phone) versus the swamp worry -- if you make absence causation cheap, my not watering your plants is a cause, and so is the Queen of England's not watering them.
  - double omission and preemption among omissions: the resident skipped the handover, so the on-call doctor was never told to check the potassium. Is that one omission or two, and which one is the cause?
  - omissions that belong to nobody: a security system that didn't fire because the sensor was never installed. No agent, no expectation, still feels causal.
  - the norm thing, which I keep going back and forth on: we're much happier calling something a cause when the omitted act was expected or required -- the driver who didn't brake versus the stranger who didn't jump in. Is that a fact the theory has to accommodate, or a bias it should debunk?
  - the legal asymmetry: liability for acts versus liability for omissions, the no-duty-to-rescue default. Does the metaphysics have to line up with the law, or are those just different games?

  For each desideratum, also say which approach in the area it most embarrasses, if you can do that without turning it into a scorecard. And end with what would change your mind about which requirement is the load-bearing one, plus where your own reasoning is most likely to be wrong -- I'd rather see you flag the soft spot than pretend there isn't one.

  No reading lists, I know the literature.
reasoning: |-
  Okay, the user is preparing the first session of a grad seminar on negative causation. They need to establish clear criteria for evaluating theories of causation by omission. The main request is a list of desiderata—what a theory must get right to be taken seriously. They also want to know which points are non-negotiable versus contentious, and especially if any desiderata conflict. 

  The user has specific concerns: the relata question (what omissions are), avoiding the swamp problem (making absence causation too cheap), handling double omissions and preemption, accounting for non-agent omissions, the role of norms, and the legal asymmetry between acts and omissions. They emphasize that conflicts between desiderata are valuable insights, not failures.

  Hmm, this is a complex meta-philosophical task. The user clearly knows the literature but wants a structured framework for critique. The challenge is balancing technical precision with pedagogical utility for grad students. 

  First, the non-negotiables. Any viable theory must handle ordinary cases (dead plants from gardener's neglect) while blocking swamp cases (Queen not watering). It must also resolve causal relata cleanly—either define omissions as entities or provide a reductionist account. Ignoring this is fatal. Double omission preemption is another minefield; theories that flatten distinctions here fail. 

  The norm question is trickier. The user admits waffling on this. Legally, norms matter (no duty to rescue), but metaphysically, should they? I'll mark this as contentious but essential to address. Same for non-agent omissions—the security system example forces theories to explain causation without human agency. 

  Now conflicts. The big one is norm-independence vs norm-sensitivity. If causation is purely metaphysical, norms shouldn't matter—but then stranger non-rescues swamp the theory. If norms are built-in, it risks conflating causation with responsibility. Another tension: treating omissions as real entities avoids relata issues but invites swamp problems; treating them as relational facts avoids swamps but struggles with double omissions. 

  For pedagogical punch, I'll highlight which theories each desideratum embarrasses—e.g., process theories choke on relata, counterfactual theories drown in swamps. But per the user's request, no scorecards—just illustrative nudges. 

  User's soft spots: their norm ambivalence is understandable. The lifeguard case feels causal because of duty; the stranger case doesn't. But is that causation or blame? I'll note that experiments on folk intuitions could sway this. My own blind spot: maybe the legal asymmetry isn't metaphysical but pragmatic—a "different games" approach. That could dissolve the conflict. 

  The payoff is showing desiderata aren't harmonious. A theory might solve swamps by invoking norms, but then can't explain non-agent cases. Or embrace coarse-grained omissions to handle double preemption but then can't distinguish the Queen. That tension is the seminar's gold. 

  Final touch: explicitly state what evidence would shift my views—e.g., if preemption cases get resolved without norms, that weakens norm-sensitivity. Keep it meta: the goal isn't answers but sharpening the knives for critique.
answer: |-
  Here's your desiderata list for a theory of causation by omission, structured for seminar groundwork. I've flagged conflicts, non-negotiables, and soft spots based on your constraints. Treat this as a toolkit for dissection, not dogma.

  ### Non-Negotiables (Metaphysical Floor)
  1. **Handle Ordinary Cases Without Collapse**  
     **Case:** Gardener fails to water plants → plants die. Lifeguard on phone → swimmer drowns.  
     **Requirement:** The theory must deliver a clear causal relation in these paradigmatic cases.  
     **Swamp Guardrail:** It must *not* imply the Queen’s non-watering is equally a cause of the dead plants.  
     **Embarrasses:** Overly permissive counterfactual theories (e.g., Lewis's early approach).  
     **Conflict Seed:** Avoiding swamps often requires "thickening" omissions (e.g., adding norms, capacities), which may clash with relata neutrality.

  2. **Resolve the Relata Question**  
     **Case:** Security system failure due to uninstalled sensor (no agent).  
     **Requirement:** The theory must specify the ontological status of omissions (events? facts? absences of events?) or explain why it doesn’t need to. "Placeholder" moves are inadequate—they punt on causal relata asymmetry (e.g., *whose* omission matters).  
     **Embarrasses:** Theories that treat omissions as primitive "negative events" (e.g., early process theories) or those that ignore relata entirely.  
     **Soft Spot:** If omissions are just counterfactual dependencies (e.g., "if X had occurred, Y wouldn’t have"), relata dissolve—but then swamps threaten.

  3. **Distinguish Double Omission & Preemption**  
     **Case:** Resident skips handover → On-call doctor isn’t told → Misses critical potassium check → Patient dies.  
     **Requirement:** The theory must explain why the resident’s omission (not the doctor’s) is the cause, or why both are. Crucially, it must *not* conflate the two omissions into one amorphous "failure."  
     **Embarrasses:** Coarse-grained counterfactual accounts (e.g., "if handover occurred, death wouldn’t") and theories that can’t handle causal chains.  
     **Conflict Seed:** Handling preemption often requires event-like individuation, but omissions resist event ontology.

  ---

  ### Contentious Desiderata (Where Theories Diverge)
  4. **Non-Agent Omissions**  
     **Case:** Security sensor never installed → system doesn’t fire → theft occurs.  
     **Requirement:** The theory should explain causation without agential expectations (no "duty," no "normal behavior").  
     **Embarrasses:** Norm-based theories (e.g., McGrath) or agential capacity views (e.g., Sartorio).  
     **Soft Spot:** If the theory *requires* agency, it fails here—but agency might be a red herring for metaphysics.

  5. **Norm-Sensitivity vs. Norm-Independence**  
     **Case:** Driver who doesn’t brake (cause) vs. stranger who doesn’t jump into traffic to rescue (not cause, absent duty).  
     **Requirement:** The theory must either:  
     - **Accommodate norms:** Explain why norms *constitutively* shape causal ascriptions (e.g., Halpern & Hitchcock), OR  
     - **Debunk norms:** Show norms are merely epistemic/pragmatic overlays on a norm-free causal relation.  
     **Embarrasses:** Pure counterfactual theories (ignore norms, so stranger cases become causal) vs. purely norm-driven theories (struggle with non-agent cases).  
     **Conflict Seed:** Accommodating norms helps block swamps but may undermine objectivity; rejecting norms invites swamps.  
     **Mind-Changer:** Empirical work on folk intuitions (e.g., Knobe/Schaffer) suggesting norms *are* metaphysically integrated.

  6. **Legal Asymmetry Compatibility**  
     **Case:** Liability for acts (e.g., pushing someone) vs. non-liability for omissions (e.g., not rescuing a stranger).  
     **Requirement:** The theory need *not* align with legal doctrine, but must explain why the asymmetry doesn’t refute it metaphysically.  
     **Embarrasses:** Theories that make omission causation ubiquitous (undermining legal distinction) or those that deny its existence (making law incoherent).  
     **Soft Spot:** Law may track *responsibility*, not causation—so a theory can grant symmetric causation while explaining asymmetric liability via duties.

  ---

  ### Irreconcilable Tensions (Where You Get Your "Result")
  - **Norm-Independence vs. Swamp Avoidance**  
    If causation is purely counterfactual/difference-making, the Queen *is* a cause—but this is untenable. Blocking it requires constraints (e.g., "normal conditions," agentive capacities) that smuggle in norms or contextual salience. *No theory solves this cleanly.*  
  - **Relata Neutrality vs. Preemption**  
    Treating omissions as unstructured "absences" struggles with double omission cases (e.g., resident vs. doctor). Resolving preemption demands fine-grained relata (e.g., *the resident’s* omission), but this risks reifying omissions as events.  
  - **Non-Agency vs. Norm-Sensitivity**  
    Explaining the security sensor case without norms/agency clashes with norm-based accounts of the driver/stranger asymmetry. One must yield or bifurcate causation.

  ---

  ### Where My Reasoning is Shakiest
  1. **Relata Priority:** I treat this as non-negotiable, but some (e.g., counterfactualists) argue causation is a relation between *propositions*, bypassing ontology. If your seminar leans propositional, this desideratum softens.  
  2. **Swamp Intuitions:** I assume the Queen’s non-watering is *obviously* non-causal, but some (e.g., Schaffer) argue it *is* a cause—just not salient. If salience is part of causation, the swamp "problem" dissolves.  
  3. **Law’s Weight:** I downplay legal alignment, but if law tracks moral responsibility *via* causation, the asymmetry might pressure metaphysical accounts.

  **Your Hobby Horses Addressed:**  
  - **Norm Thing:** Treated as a pivot point (Desideratum 5), not presupposed.  
  - **Legal Asymmetry:** Marked as separable from metaphysics (Desideratum 6).  

  **Endgame:** The central tension is **swamp avoidance vs. metaphysical purity**. If a theory blocks the Queen, it likely leans on norms/salience (risking subjectivity). If it’s metaphysically pristine, swamps flood in. That’s where the blood is—have them test-drive theories against *this* fault line first.
