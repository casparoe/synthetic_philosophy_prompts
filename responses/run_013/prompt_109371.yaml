answer: |-
  ### Proposed Procedure for Risk Assessment Using Imprecise Probabilities

  **Overview**: This procedure uses risk intervals (lower and upper bounds) derived from available evidence. It explicitly separates scientific facts from value judgments, applies a pre-agreed decision rule when intervals straddle the threshold, and provides a single number for legal records without misrepresenting uncertainty. Designed for a 1-day execution.

  ---

  ### Step-by-Step Procedure (Prose)
  1. **Evidence Synthesis**  
     - **Question**: What are the point estimates and 95% confidence intervals (CIs) for risk from each study/model?  
     - **Action**: For each data source (rodent, epi, QSAR, analog):  
       - Extract a point estimate (e.g., ED₁₀, BMDL) and 95% CI.  
       - If no CI exists (e.g., QSAR/analog), apply a **default uncertainty factor (UF)** of 100 (lower bound = point estimate ÷ 100; upper bound = point estimate × 100).  
     - **Fact/Value Judgment**:  
       - Extracting estimates is **fact**; choosing UFs is **value judgment** (policy-driven conservatism).  
     - **Output**: Risk interval per study: `[lower_i, upper_i]`.

  2. **Combine Evidence into Overall Risk Interval**  
     - **Question**: What is the envelope of all study intervals?  
     - **Action**:  
       - Overall lower bound = **minimum** of all `lower_i`.  
       - Overall upper bound = **maximum** of all `upper_i`.  
       - Result: Overall risk interval `[L, U]`.  
     - **Fact/Value Judgment**: Mathematical envelope is **fact**.  

  3. **Check Interval Width**  
     - **Question**: Is the interval too wide to trust? (U/L > 1,000?)  
     - **Action**:  
       - If **yes**: Escalate to the **Board** (human judgment).  
       - If **no**: Proceed.  
     - **Fact/Value Judgment**: Width threshold (1,000×) is a **value judgment** (policy).  

  4. **Compare to Threshold**  
     - **Question**: Does `[L, U]` lie entirely above/below the threshold (T)?  
     - **Action**:  
       - If **U < T**: **No advisory** (risk below T).  
       - If **L > T**: **Advisory** (risk above T).  
       - If **L ≤ T ≤ U**: Proceed to Step 5.  
     - **Fact/Value Judgment**: Interval comparison is **fact**.  

  5. **Apply Decision Rule**  
     - **Question**: Which pre-agreed rule converts `[L, U]` to a single number (V)?  
     - **Rules** (value judgments, set by policy):  
       - **Maximin (pessimistic)**: V = U (assume worst case).  
       - **Maximax (optimistic)**: V = L (assume best case).  
       - **Hurwicz**: V = αL + (1-α)U (e.g., α=0.2 for mild optimism).  
     - **Action**:  
       - Compute V.  
       - If **V > T**: **Advisory**; else **No advisory**.  
     - **Fact/Value Judgment**: Rule choice is **value judgment**.  

  6. **Reporting**  
     - **For the Record**:  
       - Report the single number **V** (from Step 5) and the **decision** (advisory/no).  
       - Disclose: "V is derived from risk interval [L, U] using [Rule], as [L, U] straddles T."  
     - **Transparency**:  
       - In the written finding, state:  
         - Interval `[L, U]` (science).  
         - Why Step 5 was triggered (values).  
         - Rule used (values).  

  ---

  ### JSON Procedure Specification
  ```json
  {
    "procedure": [
      {
        "step": 1,
        "question": "For each study/model, what is the point estimate and 95% CI for risk? If no CI, apply default UF=100.",
        "sufficient_answer": "All studies have intervals [lower_i, upper_i].",
        "if_not_met": "continue",
        "fact_or_value": "Fact (science) for estimates; value judgment for UFs.",
        "hidden_judgment": false
      },
      {
        "step": 2,
        "question": "What is the envelope of all study intervals?",
        "sufficient_answer": "Overall interval [L, U] = [min(lower_i), max(upper_i)].",
        "if_not_met": "continue",
        "fact_or_value": "Fact (mathematical combination).",
        "hidden_judgment": false
      },
      {
        "step": 3,
        "question": "Is U/L > 1,000?",
        "sufficient_answer": "No: proceed. Yes: escalate to Board.",
        "if_not_met": "escalate",
        "fact_or_value": "Value judgment (width threshold).",
        "hidden_judgment": false
      },
      {
        "step": 4,
        "question": "Does [L, U] lie entirely above/below T?",
        "sufficient_answer": "U < T (no advisory) or L > T (advisory). Else: proceed.",
        "if_not_met": "continue",
        "fact_or_value": "Fact (interval comparison).",
        "hidden_judgment": false
      },
      {
        "step": 5,
        "question": "Apply decision rule to compute V from [L, U].",
        "sufficient_answer": "V > T → advisory; else no advisory.",
        "if_not_met": "stop",
        "fact_or_value": "Value judgment (rule selection).",
        "hidden_judgment": false
      }
    ],
    "worked_cases": [
      {
        "case": "(a) Three rodent studies with disagreeing estimates",
        "bounds": {
          "lower": "5e-7",
          "upper": "1e-2"
        },
        "verdict": "Advisory",
        "rule_that_flips_it": "Maximin (V = U = 1e-2). Maximax (V = L = 5e-7) → no advisory.",
        "who_signs": "Analyst (applies pre-agreed rule).",
        "outcome_analyst_wont_like": "If analyst believes risk is low, maximin forces conservative advisory."
      },
      {
        "case": "(b) Structural analog only (point estimate = 1e-4, no CI)",
        "bounds": {
          "lower": "1e-6",
          "upper": "1e-2"
        },
        "verdict": "Escalated to Board (U/L = 10,000 > 1,000)",
        "rule_that_flips_it": "N/A (Board decides without rules).",
        "who_signs": "Board (human judgment).",
        "outcome_analyst_wont_like": "Analyst believes risk is negligible (1e-6 < T), but Board may issue advisory due to high upper bound."
      }
    ],
    "cannot_do": [
      "Cases with no evidence (cannot derive interval).",
      "Cases where interval width exceeds policy threshold (U/L > 1,000).",
      "Cases where decision rule conflicts with Board priorities (e.g., political/economic factors)."
    ]
  }
  ```

  ---

  ### Key Clarifications
  1. **Single Number for Records**:  
     Use **V** (from Step 5) for the binary decision, but explicitly note:  
     > "V = [value] is derived from risk interval [L, U] = [[lower], [upper]] using [Rule] because science could not conclusively place risk above/below T = [threshold]."

  2. **Dilation**:  
     - Dilation (widening intervals with new evidence) is a theoretical concern but **does not affect this procedure**. We use a static evidence snapshot. If future updates cause dilation, the interval is recomputed—no special handling needed.

  3. **Values vs. Facts**:  
     - **Facts**: Evidence synthesis, interval math, comparisons.  
     - **Values**: UFs, width threshold, decision rules.  
     - The procedure **explicitly flags value judgments** (Steps 1, 3, 5) in outputs.

  4. **Efficiency**:  
     - Steps 1–5 require only arithmetic and comparisons.  
     - Most time spent on Step 1 (evidence extraction). Doable in 1 day.  

  5. **Board/Counsel Acceptance**:  
     - **Board**: Gets intervals + rules (non-technical). Escalation handles ambiguity.  
     - **Counsel**: Gets a single number (V) and clear decision, with uncertainty documented in the record.
