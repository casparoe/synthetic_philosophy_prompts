     - For each study, derive a 95% confidence interval for the risk at the exposure level. If a study doesn't provide a confidence interval, use a factor to create an interval (e.g., if only a point estimate, assume a lognormal distribution with a geometric standard deviation of 10? But that's arbitrary). Alternatively, for studies without uncertainty, we skip? But then we have to handle.

