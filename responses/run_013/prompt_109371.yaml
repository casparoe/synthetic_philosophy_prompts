prompt: |-
  I do risk assessments for a state environmental health agency — maybe thirty a year, each one ends in a written finding that either triggers a drinking-water advisory or doesn't. The science is always thin: three rodent studies that disagree, one epi study with a confidence interval you could drive a truck through, or nothign but a structural analog and a QSAR model. Right now we do what everyone does: pick a central estimate, divide by an uncertainty factor of 10 or 100 or 1000, and write it up as though it were a number we know. A colleague in our biostat group keeps telling me we should be doing imprecise probabilities instead — carry a whole set of distributions, report a lower and upper bound on the risk, then apply a decision rule, maximin or Hurwicz with some optimism index, or maximality, or E-admissibility. I understand maybe half of that. She also mentioned something called dilation, where conditioning on an event that's meant to be independent of the thing you care about makes your interval wider rather than narrower, which if true sounds like it wrecks the whole approach.

  So: give me a procedure I can actually run in a day, that my board (non-technical) and our counsel (who needs a yes/no and a single number in the record) can live with. Questions in order, what counts as good enough to move to the next one, where it stops, where it hands the decision to a human because the disagreement isn't about facts anymore. I need to know which steps are real analysis and which are values wearing a lab coat, and I need it to say so out loud when the interval straddles our threshold and the rule I pick is what decides the case. Also tell me how to get from an interval to the one number the record requires without lying about it.

  Then run it on two cases: (a) the three-rodent-studies contaminant, and (b) the structural-analog-only contaminant, where I personally think the risk is negligible and I suspect the procedure is going to tell me I'm not entitled to that view.

  Procedure in prose first, then a JSON object with this shape:

  {"procedure": [{"step": 1, "question": "", "sufficient_answer": "", "if_not_met": "continue | stop | escalate", "fact_or_value": "", "hidden_judgment": true}], "worked_cases": [{"case": "", "bounds": {"lower": "", "upper": ""}, "verdict": "", "rule_that_flips_it": "", "who_signs": "", "outcome_analyst_wont_like": ""}], "cannot_do": [""]}

  One entry per step in the procedure array, in order; one entry per case; and in cannot_do, the things this procedure will not settle no matter how carefully it's run.
reasoning: |-
  We are designing a practical procedure for risk assessment that incorporates imprecise probabilities while satisfying institutional constraints (non-technical board, need for a binary decision and a single number in the record). The procedure must be executable in a day and clearly separate value judgments from scientific facts.

  Key requirements:
  1. Use imprecise probabilities: represent uncertainty with lower and upper bounds on risk.
  2. Apply a decision rule when the interval straddles the threshold (e.g., maximin, Hurwicz, etc.).
  3. Explicitly state when the decision is driven by the rule (i.e., values) and not just the facts.
  4. Produce a single number for the record without lying about the uncertainty.

  Proposed Procedure:

  Step 1: Gather all available evidence (rodent studies, epi studies, QSAR, etc.) and extract or estimate dose-response relationships. For each study, derive a point estimate and a measure of uncertainty (e.g., confidence interval). If no direct data, use structural analogs and QSAR with appropriate uncertainty factors.

  Step 2: For each study or model, convert the data into a risk estimate at the exposure level of concern. This might involve extrapolation (e.g., from animal to human, high to low dose). Apply standard uncertainty factors (like 10 for interspecies, 10 for intraspecies, etc.) but note that these are value judgments.

  Step 3: Combine the risk estimates from multiple sources to form an imprecise probability. We can use a set of distributions (e.g., by considering the range of point estimates and their uncertainties). The lower bound of the risk interval could be the lower end of the most conservative credible interval (e.g., 5th percentile) from the most favorable study, and the upper bound the upper end of the most conservative credible interval (e.g., 95th percentile) from the least favorable study. Alternatively, use a robust Bayesian approach or envelope of distributions.

  However, for simplicity and time, we can do:
     - Lower bound: min(plausible lower bounds from each study) 
     - Upper bound: max(plausible upper bounds from each study)

  But note: this might be too conservative. Alternatively, we can use the range of the point estimates and then account for uncertainty by taking the overall min and max of the confidence intervals.

  But a better way: for each study, we have a distribution (or at least a confidence interval). Then the set of distributions is the set of all distributions that are consistent with at least one study. The lower bound is the infimum of the risk over all such distributions, and the upper bound the supremum.

  But in practice, we can do:
     Lower bound = min(lower confidence limits of the risk estimates from each study)
     Upper bound = max(upper confidence limits of the risk estimates from each study)

  But if we have only one study, then we use its confidence interval. If we have multiple, we take the envelope.

  Step 4: Compare the risk interval [L, U] to the regulatory threshold T (which is typically set by policy, e.g., 1 in 100,000). There are three cases:
     a) U < T: Then the risk is below the threshold. No advisory.
     b) L > T: Then the risk is above the threshold. Advisory triggered.
     c) L <= T <= U: The interval straddles the threshold. Then we must apply a decision rule.

  Step 5: Decision rules for the indeterminate case (c). We pre-specify the rule (by policy). Options:
     - Maximin (pessimistic): act as if the true risk is the upper bound. Then if U > T, trigger advisory.
     - Maximax (optimistic): act as if the true risk is the lower bound. Then if L > T, trigger advisory (but note if L<=T then no advisory, even if U>T).
     - Hurwicz: use a weighted average: H(α) = α * L + (1-α) * U, then compare H(α) to T. But we need to set α (the optimism index) by policy.
     - E-admissibility: require that the decision is not dominated? But that may be complex.

