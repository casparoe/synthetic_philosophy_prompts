  **Explanatory Notes:**

  1.  **Presupposed Claim:** The core is cardinality (meaningful differences/ratios) and interpersonal comparability. Without both, the arithmetic of QALYs collapses.
  2.  **Strictly Presupposed:** These are the non-negotiable foundations. If cardinality within a person fails, the scale is useless beyond rough ranking. If interpersonal comparability fails, aggregation is meaningless. If there's no single dimension of utility/disutility, the QALY unit has no coherent meaning.
  3.  **Fits But Not Required:** The practice is agnostic about ontology. An attitude (liking/disliking) can generate the number. Diverse feelings can be summarized into one badness score. Behaviorism fits the operational focus.
  4.  **Ruled Out:** Strong Pluralism/Incommensurability directly attacks the possibility of the single scale. Ordinalism prevents the required arithmetic. Contextualism undermines the stability/reliability of the scale across situations.
  5.  **Where Underdetermined:** The "what is it?" question about the common element is irrelevant to the practice's function. Any theory producing the cardinal, comparable number works.
  6.  **Internal Tension:** The conflict is real and specific. Subjectivity is respected in data *collection* ("only you know"), but disregarded in data *use* (treating all '7s' as equivalent inputs). Aggregation requires assuming interpersonal comparability, which contradicts the "your 7 isn't my 7" sentiment.
  7.  **What Changes:** If the presupposition is false, the current system is fundamentally broken. Changes would be radical: abandoning core tools (0-10 summary score, QALYs) or fundamentally altering their use/justification. The disability discounting concern often arises *because* QALYs assume a single utility scale where disabilities typically lower the score, making life-years with disability 'worth less'. This is a direct consequence of the presupposed interpersonal comparability on a single scale.
