prompt: |-
  I am assembling a specification for a theory of value incommensurability, and I want the desiderata written out before I evaluate any candidate. The theory is meant to earn its keep in a practical setting: a standing ethics committee that must choose, several times a year, among options that realize different and ostensibly incomparable goods — a hospice expansion against a transit line, a restoration project against a debt-relief fund — where the committee cannot wait for the values to resolve onto a single scale, and where its decisions will be defended in public. The standard of adequacy I need, then, is not metaphysical tidiness but the ability to say, of an actual hard choice, what kind of difficulty it is and what the choice can rationally be.

  Write the desiderata list: the cases the theory must get right, the distinctions it must not collapse, and the results it must remain consistent with, each with the consideration that motivates it. Among the cases I want handled are ones drawn from the literature and ones I have constructed. From the literature: the small-improvement case, in which neither option is better than the other, yet a trivial improvement to one does not make it better. Constructed by me: a case in which an option is incomparable with each of two others that are themselves ranked, so that incomparability must either transmit across the pair or demonstrably fail to; a case in which the incomparability holds between the values themselves rather than between two particular options; a case in which the incomparability seems to arise only from the agent's incomplete self-knowledge and dissolves once she understands her own commitments; and a case in which a choice is rationally permissible and yet leaves a residue of regret that the theory must either license or explain away. The distinctions I care most about keeping separate are these: incomparability from indifference, from rough equality, and from the mere closeness of two comparable options; incomparability of the options from incomparability of the values; and a choice's being hard because of the values from its being hard because of the agent. As for results, I take it the theory cannot contradict the transitivity of betterness wherever betterness is defined, cannot make rational choice impossible in the ordinary case, and cannot be shown to license a money pump — but I want to be told if these constraints are in tension with the rest.

  Then say which of the desiderata are genuine requirements and which are parochial to one camp, and whether some subset is jointly unsatisfiable — I suspect the demand that incomparability be a real feature of the options cannot be held together with the demand that rational choice always issue in a determinate verdict, but I want your argument, not my guess — and which single requirement does the most to eliminate the field. Finally, score the leading contenders against the list: the strong incomparabilist view on which a hard choice is hard because no ranking exists; the parity view on which the options are comparable in a way weaker than betterness; the commensurabilist view that supplies a single currency; the view that betterness is determinate but sometimes vague; and the voluntarist view that reason runs out and commitment takes over. Keep the scoring brief; the list is the deliverable.
reasoning: |-
  Okay, let's tackle this user request step by step. The user wants a specification for a theory of value incommensurability tailored for an ethics committee making practical decisions. First, I need to parse their detailed requirements and structure the desiderata clearly.

  The user mentions specific cases: the small-improvement argument from literature, their constructed cases like transitive incomparability and self-knowledge dissolution. I'll need to ensure each case is addressed in the desiderata. Also, distinctions like incomparability vs. indifference are crucial—mustn't conflate them.

  Considering the committee's real-world context, practicality is key. The theory must guide decisions publicly defensibly, not just philosophically tidy. Results like avoiding money pumps and maintaining transitivity where applicable are constraints. I should note if these conflict—like maybe determinacy vs. genuine incomparability.

  The user suspects a tension between genuine incomparability and rational determinacy. I agree; if values are truly incomparable, forcing a choice might require something beyond reason, like commitment. That could rule out strong incomparabilist views in practice.

  For the desiderata list, organizing into Cases, Distinctions, and Constraints makes sense. Each point needs a motivation tied to the committee's needs. For example, the small-improvement case tests if improvements don't resolve incomparability, which matters for justifying decisions when alternatives are proposed.

  Distinguishing value-level vs. option-level incomparability is vital. The committee might reject a transit project versus hospice based on conflicting values (e.g., efficiency vs. compassion), so the theory must clarify if the conflict is fundamental or situational.

  The regret residue case is interesting. It suggests even permissible choices may feel regrettable, which the theory should explain. This points to views like voluntarism, where commitment leaves residual doubt.

  Now, assessing desiderata strength: Avoiding money pumps and maintaining transitivity are likely universal. But determinacy in rational choice might conflict with genuine incomparability. Strong incomparabilism might fail here, while parity or voluntarism could accommodate via weaker comparability or decision procedures.

  Leading contenders: Strong incomparabilism struggles with determinacy. Parity handles small-improvement but might blur with indifference. Commensurabilism simplifies but denies incomparability, possibly misrepresenting dilemmas. Vagueness views could explain some cases but not value-level conflicts. Voluntarism fits practical contexts, accepting rational indeterminacy but needing careful framing to avoid arbitrariness.

  The user's deep need seems to be actionable guidance under uncertainty, not just theoretical soundness. The committee must defend decisions publicly, so the theory must provide clear rationale even when values clash. Voluntarism's emphasis on commitment might serve this best, though it mustn't seem subjective. Highlighting the role of committee deliberation as a procedural safeguard could help.
answer: |-
  Here is the specification of desiderata for your theory of value incommensurability, structured for practical application by an ethics committee:

  ### I. Cases to Handle (with Motivations)
  1.  **Small-Improvement Case (Raz/Chang):** Neither A nor B is better, but a trivial improvement to A (A+) does not make A+ better than B. *(Motivation: Tests if "not better" stems from genuine incomparability or mere closeness/indifference; crucial for rejecting false resolutions like "rough equality.")*
  2.  **Transmitted Incomparability Case:** Option A is incomparable with B, and A is incomparable with C, but B is better than C. *(Motivation: Forces the theory to specify if incomparability is a transitive relation or not, impacting the structure of choice sets and potential cycles.)*
  3.  **Value-Level Incomparability Case:** The incomparability holds fundamentally between the *values* themselves (e.g., ecological integrity vs. distributive justice), not just between specific instantiations. *(Motivation: Ensures the theory addresses conflicts intrinsic to the goods pursued, not just contingent features of particular options.)*
  4.  **Dissolving Incomparability via Self-Knowledge Case:** An agent initially perceives A and B as incomparable, but upon deeper reflection on her own commitments and values, a determinate ranking emerges. *(Motivation: Tests if incomparability is solely a feature of the world/options or can be an epistemic artifact of the agent; relevant for committee deliberation processes.)*
  5.  **Residue of Regret Case:** After a rationally permissible choice between incomparable options, the agent experiences justified regret that is not irrational. *(Motivation: Captures the phenomenology of hard choices; the theory must explain this residue without undermining the permissibility of the choice.)*

  ### II. Distinctions to Maintain (with Motivations)
  1.  **Incomparability vs. Indifference:** Distinguish cases where no comparison is possible from cases where options are equally good. *(Motivation: Essential for accurately diagnosing the nature of the dilemma and guiding justification; indifference implies easy substitutability, incomparability does not.)*
  2.  **Incomparability vs. Rough Equality/Closeness:** Distinguish fundamental failure of comparability from cases where options are comparable but very close in value. *(Motivation: Prevents misdiagnosis; close calls are resolvable in principle with finer measurement, incomparability is not.)*
  3.  **Options Incomparability vs. Values Incomparability:** Distinguish incomparability between specific option-pairs from incomparability between the abstract values they realize. *(Motivation: Affects how generalizable the conflict is and informs the search for alternatives or compromises.)*
  4.  **Hardness from Values vs. Hardness from Agent:** Distinguish choices hard due to objective features of the options/values from choices hard due to the agent's uncertainty, weakness of will, or lack of self-knowledge. *(Motivation: Crucial for the committee's self-understanding and public justification; blurs the target of responsibility and deliberation strategies.)*

  ### III. Constraints (Results to be Consistent With)
  1.  **Transitivity Preservation:** Wherever "better than" is defined between pairs, it must be transitive. *(Motivation: Avoids cyclic preferences and fundamental irrationality; foundational for coherent choice.)*
  2.  **Practical Determinacy:** The theory must allow for a rationally permissible choice to be made in every decision faced by the committee, even under incomparability. *(Motivation: The committee *must* act; the theory cannot paralyze decision-making.)*
  3.  **Immunity to Money Pumps:** The theory should not license sequences of choices leading to a guaranteed loss for the agent/committee. *(Motivation: Protects against demonstrable irrationality and exploitation; a key test of structural coherence.)*
  4.  **Ordinary Choice Viability:** Does not make rational choice impossible in standard, non-hard choice scenarios. *(Motivation: The theory must not break standard decision theory where comparability holds.)*

  ### IV. Assessment of Desiderata
  *   **Genuine Requirements (Likely Universal):** Transitivity Preservation, Immunity to Money Pumps, Ordinary Choice Viability. These are widely accepted as bedrock rationality constraints.
  *   **Parochial Requirements (Vary by Camp):**
      *   *Strong Incomparabilists:* Insist Value-Level Incomparability is real and distinct; may see Residue of Regret as essential.
      *   *Commensurabilists:* Reject the possibility of genuine Value-Level Incomparability or Small-Improvement cases as described; collapse distinctions 1 & 2.
      *   *Voluntarists:* Emphasize Dissolving Incomparability and Hardness from Agent; see Practical Determinacy as paramount even if reason "runs out."
  *   **Likely Joint Unsatisfiability:** There is a **significant tension** between:
      *   **(A) Genuine Incomparability Requirement:** Insisting incomparability is a real, objective feature of the options/values (captured by Small-Improvement, Value-Level cases, and distinctions 1-3).
      *   **(B) Practical Determinacy Requirement:** Demanding a unique, rationally mandated verdict in every choice.
      *   **Argument:** If A and B are *genuinely incomparable* (neither better, not equally good, no parity), then by definition, reason alone *cannot* dictate a choice between them – both are rationally permissible, or neither is uniquely rational. Insisting on a unique rational verdict (B) *requires* denying genuine incomparability (A) at the moment of choice, either by claiming comparability *is* determinate (commensurabilism, vagueness-as-epistemic), or by introducing a non-reason-based factor to break the tie (voluntarism, perhaps some parity views). Holding both (A) and (B) strictly seems impossible.
  *   **Field-Eliminating Requirement:** The **Small-Improvement Case** is the most potent discriminator. Views that cannot explain why A+ is not better than B (without collapsing into indifference or rough equality) are severely challenged. This strongly targets standard commensurabilist views and some interpretations of vagueness.

  ### V. Brief Scoring of Contenders
  | View                     | Small-Improvement | Transmitted Incomp | Value-Level Incomp | Dissolving Incomp | Regret Residue | Distinctions (1-4) | Transitivity | Practical Determinacy | Money Pump | Ordinary Choice |
  | :----------------------- | :---------------- | :----------------- | :----------------- | :---------------- | :------------- | :----------------- | :----------- | :-------------------- | :--------- | :------------- |
  | **Strong Incomparabilism** | Excels            | ? (Depends on view) | Excels             | Fails/Fair        | Excels         | Excels             | Excels       | **Fails**             | Excels     | Excels         |
  | **Parity**               | Excels            | ? (Depends on type) | Excels             | Fair              | Excels         | Fair (Risk of 1/2 blur) | Excels       | Fair/Excels           | Fair/Excels| Excels         |
  | **Commensurabilism**     | **Fails**         | **Fails**          | **Fails**          | Fair/Excels       | **Fails**      | **Fails**          | Excels       | Excels                | Excels     | Excels         |
  | **Vagueness (Metaphysical)** | Fair/Excels       | ?                  | **Fails**/Fair     | Fair              | Fair           | Fair (Risk of 1/2 blur) | Excels       | **Fails**/Fair        | Fair       | Excels         |
  | **Vagueness (Epistemic)**| **Fails**         | **Fails**          | **Fails**          | Excels            | Fair           | **Fails** (Collapses) | Excels       | Excels                | Excels     | Excels         |
  | **Voluntarism**          | Excels            | Excels             | Excels             | Excels            | Excels         | Excels             | Excels       | Excels                | Excels     | Excels         |

  **Key:**
  *   **Excels:** Naturally and strongly satisfies the desideratum.
  *   **Fair:** Can satisfy with plausible interpretation/adjustment, but not without cost or controversy.
  *   **Fails:** Struggles significantly or fundamentally cannot satisfy the desideratum as motivated.
  *   **?:** Outcome highly dependent on specific formulation within the view.

  **Crucial Tension Highlight:** Strong Incomparabilism and Metaphysical Vagueness struggle most with **Practical Determinacy**. Commensurabilism and Epistemic Vagueness fail fundamentally on core incomparability cases (Small-Improvement, Value-Level) and distinctions. **Voluntarism** scores well across the board *for your practical context* by accepting the reality of incomparability but providing a rational (procedural) path to a decision via commitment when reason is exhausted, also explaining regret residue. **Parity** is a strong contender but risks blurring distinctions 1 & 2. The tension between genuine incomparability and practical determinacy remains central.
