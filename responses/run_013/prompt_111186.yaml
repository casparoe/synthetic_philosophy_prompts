prompt: |-
  I'm the philosopher on a team-taught third-year module on Jesus and history — my colleague does the exegesis, I get one 90-minute session on whether the criteria of authenticity can ever settle who he was, and I need a plan for teaching it, not the content. I know the material; what I want is the order, the carrier and the misconception map.

  Here's the dependancy structure I think is right, tell me where it's wrong. Nothing works until they've got the gap between the Jesus of the gospels and the Jesus behind them, and specifically that this is a claim about what kind of documents the sources are, not about what happened — without that, every criterion just sounds like a machine for extracting facts from paperwork. Then the criteria arrive as a proposed fix to a problem they haven't felt yet. Only then the collapse. If some step has to come before all of that, say so.

  The part I actually want help with is the carrier. I'm tempted by the baptism by John, the stock embarassment case, but I've a nagging feeling it's too tidy: the story is load-bearing for the church's own account of who Jesus was, so embarrassment might be doing none of the work while feeling like it is. If that's the wrong example, tell me what should carry the thing and why. Whatever we use has to be something they can hold in their heads with no handout, and it has to be able to fail in more than one way, so they can watch different criteria return opposite verdicts on the same item.

  Misconceptions, in the order they'll surface, and exactly where in the sequence to head each off: that 'authentic' is one thing (it isn't — he said it, he did it, and it goes back to the earliest layer are three different claims and the criteria only ever touch the last); that dissimilarity is the strong criterion (it's the self-defeating one — the less a saying resembles either its Jewish setting or the early church, the less we can explain how it survived to be written down); that coherence is harmless (it's doing all the real work and it's the most circular); and that the criteria were meant to be applied one at a time, when they were a cumulative case in which each is individually invalid. Also: part of the room will come in thinking the question is settled by faith, another part that it's settled by method. I want both dislodged, but gently, and at the point in the sequence where it'll actually land rather than in the intro.

  The twist I want to end on, and the reason I'm bothering at all: the newer move is to stop asking whether a saying is authentic and ask instead how memories of Jesus were formed and transmitted in those first decades, and what a community like that could plausibly remember. I want that to register as a shift in the question rather than as 'here's the next method', so tell me where it goes and what it displaces.

  What I'm leaving out, and will say I'm leaving out: multiple attestation in any detail, the manuscript tradition, and Paul. Plus give me one thing they have to do in the last five minutes that shows me they've got the dependency structure rather than a list of criteria — something they produce, not something they answer.

  Format: bottom line in the first sentence, then the reasoning, no preamble and don't restate what I've asked for. No reading list.
reasoning: |-
  Okay, the user is a philosopher co-teaching a module on Jesus and history. They need a teaching plan structure focusing on order, carrier example, and misconception mapping for a 90-minute session about the criteria of authenticity. 

  First, analyzing their dependency structure: They're correct that establishing the gap between the "gospel Jesus" and "historical Jesus" is foundational. Without this, students might treat criteria as fact-extraction tools. The sequence should be: 1) Source nature problem → 2) Criteria as proposed solution → 3) Criteria collapse. Nothing needs to precede this.

  For the carrier example, baptism by John is problematic because its "embarrassment" might be overstated. A better choice is Jesus' exorcisms - specifically the Beelzebul controversy (Mark 3:22-30). This works because: it appears in multiple sources (Mark, Q, Thomas), allows testing multiple criteria (embarrassment, dissimilarity, coherence), and can yield conflicting results. Students can hold it mentally without handouts.

  Key misconceptions to address: 
  - During criteria introduction, clarify that "authenticity" has three distinct layers (said/did/earliest layer)
  - When presenting dissimilarity, expose its self-defeating nature 
  - During coherence demonstration, reveal its circularity 
  - In cumulative case discussion, show individual invalidity of criteria
  - Early in Q&A, address faith/method biases gently by reframing as "what can we reconstruct?"

  The session should end with the memory approach shift, positioned not as a new method but as replacing the authenticity question itself. Final activity: Have students write a 2-sentence comparison between traditional criteria and memory approach to assess understanding of dependency structure.

  The plan maintains tight sequencing while creating organic misconception confrontation points. The Beelzebul example delivers multiple failure modes within one narrative frame, and the concluding shift to memory studies emerges naturally from the criteria collapse.
answer: |-
  Your dependency structure is sound; begin by establishing the source problem before introducing criteria as a solution, then demonstrate collapse. Use the **Beelzebul controversy (Mark 3:22–30//pars.)** as your carrier example—it fails cleanly under multiple criteria, avoids the pitfalls of baptism, and requires no handout. Below is the sequenced plan:  

  ---

  ### **Order & Carrier Sequence** (90 mins total)  
  1.  **Source Problem: Gospels as Theology, Not Biography** (15 mins)  
       - *Activity:* Contrast Mark 1:11 (voice at baptism) with John 1:29–34 (no voice; Baptist’s retrospective).  
       - *Key Point:* Gospels are interpretations, not transcripts. The "gap" is about *genre*, not just events.  
       - *Misconception Head-off:* Here, distinguish "what happened" (historical act) from "what the text claims" (theological assertion).  

  2.  **Introduce Criteria as a Proposed Solution** (10 mins)  
       - Briefly name criteria (embarrassment, dissimilarity, coherence, multiple attestation*).  
       - *Carrier Setup:* Pose the Beelzebul accusation ("He casts out demons by Beelzebul’s power"). Why might this be authentic?  

  3.  **Apply Criteria to Beelzebul & Watch Collapse** (40 mins)  
       - **Embarrassment**: Early church wouldn’t invent accusations of demonic allegiance? *But:* Matthew/Luke edit Mark’s version to soften it—suggesting discomfort.  
       - **Dissimilarity**: Saying is unique to Jesus (no Jewish/Christian parallel)? *But:* Early church *used* exorcism stories missionally—why preserve a slur unless it originated early?  
       - **Coherence**: Fits Jesus’ exorcism theme? *But:* Circular—this assumes exorcisms are authentic *already*.  
       - **Result:** Criteria conflict (embarrassment supports authenticity; dissimilarity undermines it; coherence assumes the answer).  

  4.  **Systemic Critique** (15 mins)  
       - *Misconception Head-offs:*  
           - "Authenticity isn’t monolithic": Clarify during step 3 that criteria only address *transmission*, not "what Jesus said/did."  
           - "Dissimilarity is strong": Show its self-defeat (if too dissimilar, it wouldn’t be preserved).  
           - "Coherence is harmless": Expose circularity—it baptizes prior assumptions.  
           - "Cumulative case": Criteria were *meant* to work together, but if each is flawed, the whole fails.  
       - *Faith/Method Bias:* At this stage, note: "Faith tells us *why* this matters; method can’t tell us *what happened* with certainty."  

  5.  **Shift to Memory Approach** (5 mins)  
       - *Pivot:* "Instead of ‘authentic or not?’, ask: ‘How did 1st-century communities remember a figure like Jesus?’"  
       - *Displacement:* This replaces the *authenticity question* itself—focus shifts to *social memory formation* (e.g., how the Beelzebul story served early groups).  

  6.  **Closing Activity** (5 mins)  
       - *Task:* "In 2 sentences, explain to a peer why ‘dissimilarity’ fails *without* first establishing how early Christians preserved traditions."  
       - *Why:* Tests grasp of dependency (criteria require transmission models) and displaces list-making.  

  ---

  ### **Why Beelzebul Works Best**  
  - **Fails multiple ways**: Embarrassment (church edits it), dissimilarity (no clear parallel, but useful for mission), coherence (presumes exorcisms are core).  
  - **Load-bearing?**: Unlike baptism, it’s not creedal; its contradictions show criteria wrestling with ambiguity.  
  - **Memorable**: One scene (accusation + Jesus’ rebuttal) with clear stakes.  

  ### **Misconception Map in Sequence**  
  | **When It Arises**          | **Misconception**                          | **Head-off Strategy**                                  |  
  |-----------------------------|--------------------------------------------|--------------------------------------------------------|  
  | Intro to criteria (step 2)  | "Authentic = Jesus said/did it"            | Distinguish "said/did," "earliest layer," "historical" |  
  | Applying dissimilarity      | "It’s the strongest criterion"             | Show survival paradox (no parallels → no preservation) |  
  | Applying coherence          | "It’s just ‘fits the data’"                | Reveal circularity—it assumes prior conclusions       |  
  | Systemic critique (step 4)  | "Apply criteria one-by-one"                | Demo cumulative case failure (flawed parts → flawed sum)|  
  | Q&A after step 3            | "Faith/method settles this"                | "Faith/method asks different questions" (gentle reframe) |  

  ### **Ending Twist Placement**  
  - Introduce **memory approach** *after* criteria collapse (step 5). It displaces the *frame* ("authentic or not?") by asking how communal memory shapes traditions. This registers as a paradigm shift, not a "new tool."  

  ### **Final Task Rationale**  
  - Forces synthesis: Students must link criteria failure to the source problem (step 1) to explain why dissimilarity self-destructs. Prevents atomized takeaways.  

  ---
  **Bottom Line**: Sequence hinges on source problem → criteria → collapse → reframe; Beelzebul is your carrier for multi-failure; misconceptions head-off at point of exposure; end with memory approach as question-replacement, not method.
