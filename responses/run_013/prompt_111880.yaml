prompt: |-
  I'm a fourth-year PhD student in political theory, working on compromise, and there's a pattern I keep running into in seminars and in my own life that I cant find a proper handle on. Two people who disagree about what's worth doing make a deal where each does something the other wants, and the striking bit is that each of them ends up doing something they think is wrong. My flatmate thinks eating meat is fine and that animal charities are a waste; I think eating meat is a minor wrong and that animal welfare matters a lot. So we agreed: I eat meat on Fridays, she sends £10 a month to an animal charity. By my lights the world got better, by hers it got better too. I did something I think is wrong, deliberately, as part of a deal — and I don't feel bought off, which strikes me as a warning sign I can't articulate.

  The case I really can't place is when what we're each giving up isn't just distasteful to us but actually harms people who aren't in the room. Swap the meat for a vote: I back a bill that hurts a group I care about, she backs one that hurts a group she cares about, and we each think the total is better than the alternative. Now the gains come out of third parties' pockets and none of them agreed to anything. Are these one phenomenon or two? When I ask around, people say it's just logrolling or just bribery, and neither fits — nobody's deceived and nothing's being bought in the ordinary sense. I don't want a label so much as the carving: what the nearest concepts are, where each one stops fitting, and what would have to be true for the second case to be its own seperate thing. If nothing covers it, coin a term and tell me where its edges are.

  Format: exactly five numbered points, a sentence or two each, no intro and no conclusion.
reasoning: |-
  Hmm, the user is a PhD student in political theory working on compromise, and they've described a specific pattern they've observed. They're struggling with cases where two people make a deal that involves each doing something they personally believe is wrong. The first scenario involves personal actions like eating meat or donating to charity, where both parties feel the outcome is better overall. The second scenario involves political actions like voting on bills that harm third parties, where the gains come at the expense of others who didn't consent.

  I need to provide exactly five numbered points without any introduction or conclusion. The user wants me to clarify the relationship between these scenarios, identify the nearest concepts, explain where those concepts stop fitting, and determine if the second case is distinct enough to warrant its own term. They're not looking for labels but for conceptual carving - mapping out the boundaries and differences.

  The user mentioned that people dismiss these as "logrolling" or "bribery," but neither fits perfectly because there's no deception and nothing is being bought in the ordinary sense. I need to address why these terms are inadequate and what makes these cases unique.

  For the meat/charity example, this seems like a mutual accommodation where both parties sacrifice their principles for a perceived greater good. They're trading concessions that involve personal costs but no direct harm to others. The user feels the world is better off, and they don't feel "bought off," which they find puzzling.

  The voting example is more problematic because it involves harming third parties through political actions. This shifts from personal compromise to something that affects vulnerable groups who aren't part of the agreement. The user is concerned about the ethics of this - whether it's fundamentally different or just an extension of the first case.

  I should consider concepts like mutual sacrifice, reciprocal concession, and harm externalization. Logrolling fits the voting scenario partially but doesn't address the moral wrongness aspect. Bribery is inappropriate because there's no exchange of personal gain for influence - both parties are compromising their values.

  To structure my response: I'll start by distinguishing personal vs. third-party effects, then analyze why logrolling and bribery don't fully apply, followed by highlighting the key differences in consent and harm. Finally, I'll suggest a new term if needed and define its boundaries.

  The user wants me to coin a term only if necessary. The second scenario might be distinct enough to deserve its own label because of the involuntary harm to third parties. Something like "principled trade-off" or "value-compromise" could work, but I need to specify what makes it unique - the combination of reciprocal concessions, perceived net benefit, and externalized harm without consent.

  For the five points:
  1. Core similarity: Both cases involve reciprocal concessions of deep principles.
  2. Key difference: The meat example stays personal, while voting harms external parties.
  3. Why logrolling doesn't fully fit: Logrolling typically involves mutual benefit without moral compromise.
  4. Why it's not bribery: No personal enrichment or corruption implied.
  5. If coining a term: "Principled trade-off" with boundaries defined by non-consenting harm.

  I need to ensure each point is concise - just a sentence or two. And no intro or conclusion as specified.
answer: |-
  1.  Both cases share a core structure of *reciprocal concession on deep principles*: each party deliberately performs an action they themselves believe is wrong, justified solely by the other's reciprocal action creating a net benefit by their own ethical calculus.
  2.  The critical divergence is the *locus of harm*: the first case (meat/charity) involves actions imposing costs primarily *on the actors themselves* (acting against conscience), while the second (votes) actively *harms non-consenting third parties* (the groups hurt by the bills), externalizing the cost of the agreement.
  3.  "Logrolling" is the nearest concept for the vote case, but it stops fitting neatly because standard logrolling involves trading support for *mutually desired policies* (pork, bridges), not deliberately supporting policies each agent believes *harms* a valued group to secure a *different* policy gain.
  4.  "Bribery" doesn't fit either case: no *quid pro quo* enrichment of an official for private gain occurs, and the exchange is transparent, mutual, and ostensibly aimed at a better overall outcome by both agents' lights, not subverting duty for personal profit.
  5.  The second case warrants a distinct concept: **principled harm-trading** occurs when agents reciprocally concede actions they deem harmful to third parties, believing the *aggregate outcome* is preferable, defined by the non-consent of the harmed and the agents' own moral condemnation of the conceded actions. Its edges are crossed if agents deceive themselves/others about the harm or if personal enrichment is the primary motive.
