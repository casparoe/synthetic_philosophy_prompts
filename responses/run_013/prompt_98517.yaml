prompt: |-
  I'm on the organizing committee for a small research program — roughly six funded fellows for two years, plus a workshop and a modest discretionary fund — devoted to causation by omission, and we have to commit to a thematic focus before we advertise the positions. The committee is split in a way I suspect is diagnostic. One faction treats the core puzzle as metaphysical: whether an omission can be a cause at all, given that an omission is not an event and, on some views, not any kind of entity that could stand in the causal relation; they want to know whether appeals to absences, negative facts, or disconnections in a standing process can do the work, or whether the whole idiom is a manner of speaking that a serious ontology should paraphrase away, and how any of this squares with the causal closure of physics. A second faction thinks the metaphysical question is either settled or sterile, and that the live problem is causal selection and its normative coloring: an agent who fails to act omits indefinitely many things at once, and we single one of them out as the cause, apparently by reference to norms, defaults, or expectations — so the interesting question is what governs that selection and whether it is doing metaphysical work or merely pragmatic work. A third group is applications-first: the but-for test in tort law, the killing/letting-die distinction in ethics, and — the reason I care — the attribution of causal responsibility to automated and semi-autonomous systems, where the omission may belong to no human at all. One fellow has floated a specific line I'd like you to assess: that the right unit of analysis is not an absence construed as a quasi-event but the agent's failure to occupy a causal role in a mechanism that was already running, which would relocate the selection problem into the question of which mechanisms count as in play, and thereby make the metaphysics and the normativity inseparable rather than separable.

  What I want from you is an agenda, not a survey. If you had this program's resources, which two or three lines of work would you concentrate them on, and in what order? Defend the ordering against explicit criteria — which questions are upstream of which, how tractable each is with the tools philosophers actually have as opposed to requiring empirical work in psychology or law, how neglected each currently is, and how much downstream work would be opened or foreclosed depending on how it comes out. Tell me which of the three factions I described is closest to right about where the center of gravity should be, and be willing to say that one of these lines is a dead end or a distraction. I also want the reverse direction: for each line you rank highly, what result or argument over the next two years would knock it down the list, and what would move it up?

  Finally, take the fellow's proposed reframing seriously enough to say whether it is a genuine advance or a relabeling that leaves the hard problems where they were. And of the applications in play — tort liability, the killing/letting-die asymmetry, and responsibility for automated systems — which would actually be changed by progress on the metaphysics, and which are trading on the metaphysics without needing it? Rank those too, and tell me where I would be wasting the workshop budget.
reasoning: |-
  Okay, the user is organizing a research program on causation by omission and needs to prioritize research lines. Let me start by understanding the three factions they mentioned. The metaphysical group questions if omissions can even be causes, the normative selection group focuses on why we pick certain omissions over others, and the applications group looks at real-world areas like tort law and AI responsibility. There's also a fellow's proposal about agents failing in causal roles within mechanisms.

  Hmm, the user wants an agenda, not a survey. They need a focused plan with 2-3 lines of work, prioritized. Criteria include upstream questions, tractability, neglect, and downstream impact. Also, they want to know which faction is closest to right, if any line is a dead end, and how the fellow's idea fits in. Plus, ranking the applications by how much they depend on metaphysics.

  First, I should figure out the core issues. The metaphysical question seems foundational because if omissions aren't causes at all, the other questions might change. But some think it's sterile. The normative selection seems crucial for applications but might depend on metaphysics. The fellow's idea ties metaphysics and normativity together via mechanisms. That could be key.

  Looking at tractability: metaphysics is purely philosophical, while normative selection needs empirical work from psychology or law. The applications might require interdisciplinary work. Neglect-wise, metaphysics has been debated, but the fellow's approach might be fresher. Normative selection in automated systems is newer and timely.

  Downstream impact: resolving metaphysics could affect all applications, but normative selection directly impacts legal and ethical issues. Automated systems are emerging, so progress there could be significant.

  Prioritizing: Line 1 should be the mechanism-based role failure. It addresses both metaphysics and normativity, making it upstream. Plus, it's tractable with existing tools. Line 2: Normative architecture, focusing on selection principles. It's essential for applications and can build on the first line. Line 3: Automated systems as a test case. It's downstream but urgent and can validate the other lines.

  The metaphysical faction is partially right but needs integration. The normative faction is central for applications. The applications-first group has valid concerns but needs the foundation.

  The fellow's idea isn't just relabeling. It shifts focus to mechanisms and roles, which could resolve the entity problem and tie normativity into metaphysics. But it depends on defining mechanisms, which is tricky.

  For applications: tort law might not need metaphysics if norms drive selection. Killing/letting-die asymmetry is more metaphysical. Automated systems are in the middle but urgent. A workshop on metaphysics might not be the best use if normative factors dominate in practice. Instead, focus on how norms interact with mechanisms in automated contexts.

  The user might also be concerned about justifying the program's focus to the committee and funding bodies. Emphasizing timely topics like AI responsibility could make the program more appealing. They need clear outcomes, so prioritizing tractable research with real-world impact is key. They might also want to bridge divides between factions, so the mechanism approach could unite metaphysics and normativity.
answer: |-
  Based on your program's constraints and the described fault lines, here's a focused agenda prioritizing lines of work where concentrated effort could yield high leverage, followed by application rankings and feedback on the fellow's proposal:

  **Priority Order & Defense:**

  1.  **Line 1: Agent Failure in Causal Role Occupancy within Mechanisms (The Fellow's Proposal)**
      *   **Why Highest Priority?**
          *   **Upstream Nature:** Directly tackles the metaphysical entity problem ("what *is* the omission?") by shifting focus from absences as pseudo-events to the *failure of an expected agent/component to play its role* within an already operative or normatively expected mechanism. This reframes both the ontology and the selection problem simultaneously.
          *   **Tractability:** Primarily philosophical/conceptual analysis. Requires clarifying "mechanism," "role," "expectation," and "failure," drawing on existing work in mechanistic causation (Machamer, Darden, Craver) and agency. Avoids immediate need for large-scale empirical studies (though implications can be tested later).
          *   **Neglect:** While mechanisms are discussed in omission contexts (e.g., Hall's "double prevention"), making *role occupancy failure* the core unit and explicitly tying it to mechanism individuation is novel and underexplored. It bridges the metaphysical/normative divide directly.
          *   **Downstream Impact:** High potential. Success would:
              *   Dissolve or radically reshape the "can omissions be causes?" debate by grounding them in mechanistic structures.
              *   Integrate normativity (expectations defining roles) into the *metaphysical* foundation of omission causation, making them inseparable as proposed.
              *   Provide a unified framework for analyzing *all* your applications by focusing on the mechanism disrupted and the role unfulfilled.
          *   **Faction Alignment:** Synthesizes core concerns of all factions: it addresses metaphysics (role/mechanism ontology), normativity (expectations defining roles), and applications (which mechanism/role matters in context).
      *   **What Would Move It Down?** If compelling arguments show that "mechanism individuation" is *itself* irreducibly normative/pragmatic in a way that simply relocates the selection problem without solving it, undermining the claim of genuine integration.
      *   **What Would Move It Up?** Developing a robust, non-circular account of how normative expectations *constitutively* (not just pragmatically) define roles within mechanisms relevant to causal claims *in this specific context*. Concrete analysis showing how this framework resolves persistent puzzles in one application area (e.g., tort) better than alternatives.

  2.  **Line 2: The Normative Architecture of Causal Selection ("Which Omission?")**
      *   **Why Second Priority?**
          *   **Upstream Nature:** Even if Line 1 succeeds, the question of *which* unoccupied role (among many possible) counts as *the* cause in a given context remains crucial. This line focuses on the principles governing that selection.
          *   **Tractability:** Mix of conceptual philosophy and targeted engagement with empirical work. Philosophers can analyze concepts (norms, defaults, duties, possibilities) and build formal models. Collaboration with legal scholars (tort doctrine) or ethicists (killing/letting-die) is feasible. Avoids needing *new* large-scale psych studies initially (can leverage existing work on counterfactuals/norms).
          *   **Neglect:** While discussed, the *systematic structure* of the selection criteria (e.g., hierarchies of norms, interaction of statistical and moral defaults, role of affordances) is under-theorized, especially outside ethics/law. Its interaction with the metaphysics (Line 1) is often ignored.
          *   **Downstream Impact:** Directly determines the applicability of omission causation to concrete problems (law, ethics, AI). Progress here is essential for making "causation by omission" operationally useful. Resolving the metaphysics (Line 1) doesn't auto-solve selection; this needs dedicated work.
          *   **Faction Alignment:** Primarily aligns with the second (normative selection) faction, but depends on Line 1 for a coherent ontology of *what* is being selected.
      *   **What Would Move It Down?** If overwhelming evidence emerges that selection is *so* contextually idiosyncratic and lacks any systematic structure that general philosophical analysis becomes futile, reducing it purely to descriptive sociology of blame.
      *   **What Would Move It Up?** Developing a formal/computational model of normative selection criteria that successfully predicts intuitive causal judgments across diverse omission cases (e.g., tort, ethics, AI failures), demonstrating its explanatory power and potential for AI implementation.

  3.  **Line 3: Omissions in Automated/Semi-Autonomous Systems (The Novel Application)**
      *   **Why Third Priority (But Essential)?**
          *   **Upstream Nature:** Primarily downstream, but serves as a crucial *test bed* and *motivator* for Lines 1 & 2. Forces new questions: Who/what is the "agent"? What "mechanism" is it part of? What "role" was it assigned? What "norms" define its expected performance?
          *   **Tractability:** Highly interdisciplinary. Requires philosophy + CS/AI (system design, responsibility modeling) + law/ethics (liability frameworks). More resource-intensive for empirical/system analysis *if* building test cases, but can start with conceptual/legal case studies.
          *   **Neglect:** The *causal* dimension (vs. moral/legal responsibility) of AI omissions is significantly under-explored compared to human cases. The "no human omission" aspect is genuinely novel.
          *   **Downstream Impact:** High societal relevance. Progress here could directly influence AI safety, ethics, and liability frameworks. Success in Lines 1 & 2 would be *validated* by their ability to illuminate this novel domain.
          *   **Faction Alignment:** Primarily the applications-first faction, but its value lies in challenging and refining the frameworks developed in Lines 1 & 2.
      *   **What Would Move It Down?** If it becomes clear that the causal structure of AI omissions is simply isomorphic to complex human organizational failures, offering no genuinely new insights for the core philosophical problems.
      *   **What Would Move It Up?** Identifying a distinctive feature of AI omissions (e.g., distributed agency, opacity, speed) that fundamentally challenges existing metaphysical or normative accounts of omission causation, forcing significant revisions to Lines 1 or 2.

  **Assessment of Factions & Dead Ends:**

  *   **Closest to Right:** The **second faction (normative selection)** identifies the most *pressing and pervasive* challenge: explaining why we pick *this* omission and not others. It's where the action is for most applications. *However*, they are wrong to dismiss the metaphysics as sterile/settled. Line 1 shows how the metaphysics and normativity are intertwined.
  *   **The Potential Dead End/Distraction:** Pursuing the **metaphysical question ("Can omissions be causes?") in isolation**, especially via traditional event-ontology arguments, is likely unproductive. Decades of debate show stalemate. While foundational, focusing *only* on whether omissions "exist" or "are causes" without integrating normativity (as Line 1 attempts) or addressing selection (Line 2) yields diminishing returns and doesn't resolve the issues driving the applications. Resources shouldn't be poured into rehashing the pure existence debate.

  **Assessment of the Fellow's Proposal:**

  *   **Genuine Advance, Not Mere Relabeling:** This is a promising shift. Moving from "absence as quasi-event" to "**failure of role occupancy within a mechanism**" does substantive work:
      1.  **Dissolves the Entity Problem:** It avoids reifying "absences" by focusing on the *disruption of a process* due to a missing component/action expected within that process's structure.
      2.  **Integrates Normativity:** Expectations (often normative) are built into the definition of the mechanism and the roles within it. What counts as "the mechanism in play" and "the relevant role" is inherently normative/pragmatic. This makes normativity constitutive of the causal claim's *object*, not just an add-on for selection.
      3.  **Reframes Selection:** The "which omission?" problem becomes "which mechanism/role was disrupted?" This locates selection *within* the metaphysical framing, potentially offering a more unified account.
  *   **Leaves Hard Problems?** It doesn't magically solve everything. The **hard problem of mechanism/role individuation** remains central and challenging ("Which mechanism counts as 'in play'?" "How finely are roles individuated?"). This *is* where much of the normative weight now resides. However, it recasts this problem in a potentially more fruitful light than the abstract "which absence?" question.

  **Application Rankings & Workshop Budget Waste:**

  Ranked by **how much their resolution depends on progress in the core metaphysics (Lines 1 & 2)**:

  1.  **Responsibility for Automated/Semi-Autonomous Systems:** **Highest Dependence.** The lack of a clear human agent, the complexity of distributed systems, and the novelty of AI "agency" make the metaphysical grounding (What *is* the omission? Whose role failed? In what mechanism?) absolutely crucial. Normative selection principles also need significant adaptation. Progress here *requires* progress on the core philosophy. (Workshop Focus: **Essential** - brings together philosophers, AI ethicists, system designers, lawyers).
  2.  **The Killing/Letting-Die Distinction (Ethics):** **Significant Dependence.** While often debated normatively, the *causal basis* of the distinction hinges on metaphysical views about omissions vs. actions and the structure of the causal chain. Is "letting die" a genuine cause of death? How does the role-failure view apply? Normative selection is also heavily involved (duties, intentions). Metaphysical progress could reshape this debate. (Workshop Focus: **Highly Valuable** - ethicists, metaphysicians).
  3.  **The But-For Test (Tort Law):** **Least Direct Dependence / Most Normative Pragmatism.** Tort law often *uses* but-for causation pragmatically as a gatekeeper, but the actual assignment of liability for omissions relies heavily on established **duties of care** – a normative, legal concept. While the metaphysics *underpins* the *possibility* of omission liability (is but-for causation even coherent for omissions?), the *practice* is largely governed by normative/legal doctrines about when a duty arises. Progress on metaphysics might refine the edges but is unlikely to overhaul core tort doctrine, which is driven by policy and precedent. (Workshop Focus: **Potential Waste Risk** - A workshop *solely* on metaphysics for tort liability is less likely to yield practical legal insights than one focused on normative selection/duties within tort. Better integrated into a broader workshop).

  **Wasting the Workshop Budget:** Focusing the workshop primarily on **rehashing the traditional metaphysical debate ("Are omissions causes?") in isolation from normativity and the specific applications**, or on **highly technical legal details of tort doctrine without connection to the core philosophical puzzles of omission causation**. The budget is best used fostering dialogue *between* metaphysicians, normative theorists, and application specialists (especially AI) using the frameworks from Lines 1 & 2 as a common language.

  **In Summary:**

  *   **Concentrate resources on:** (1) Developing the Role-Failure-in-Mechanisms framework, (2) Mapping the Normative Architecture of Selection, using (3) Automated Systems as the primary test case and motivator.
  *   **The normative selection faction identifies the key problem, but the metaphysics is essential when reframed.**
  *   **Pure traditional metaphysics is the least productive line.**
  *   **The fellow's proposal is a significant advance, moving the hard problem to mechanism/role individuation (a potentially more fruitful battlefield).**
  *   **Prioritize workshops integrating AI responsibility with the core philosophy (Lines 1 & 2); avoid workshops solely rehashing metaphysics-for-tort or pure traditional metaphysics.**
