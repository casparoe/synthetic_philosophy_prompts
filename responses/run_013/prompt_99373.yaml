prompt: |-
  Odd one, but this has been bugging me for months and I cant find the label for it.

  The pattern: somebody does something good, and then it comes out that the *thought that makes it good* was actually running through their head while they did it — and somehow that makes the whole thing feel worse. And I dont mean they were secretly selfish. The reason they were consciously holding can be the correct one, the one you'd put in the justification if you had to defend the act. Its the fact that it was present in the deliberation at all that seems to thin the act out.

  Three cases I keep coming back to. A woman pulls her kid out of a burning car and afterwards says she did it because it was her duty as a mother. A man keeps a friend's secret and explains that he did it because promise-keeping is a general social good. Someone gives away a big slice of their salary and says it maximizes expected welfare. In all three the stated ground is true and defensible — I'd argue for it if someone attacked the act — but as a description of what the person was *thinking while acting*, it makes me trust them a little less, or makes the act seem like it belonged to nobody in particular.

  The wrinkle that stops me from filing this under "bad motives": sometimes I want the good thought to be there. If a total stranger drags my kid out of the car and says he did it because it was his duty, I'm thrilled. I dont want him to have been running on "kid, fire, go." So the spoiling looks relationship-relative, or relative to whether the act was supposed to flow from something already settled between the two people rather than from a consideration to be weighed. And it isnt just morality — a person who explains exactly *why* a joke is funny kills it, and I've watched someone talk themselves out of liking a painting by listing its merits. There the immediate thing and its articulated ground seem to fight each other, which feels like the same shape as the moral cases but clearly isn't a moral phenomenon.

  So: does this have a name? If it does, what is it exactly, and where are its edges — is the spoiler the *content* of the thought, or the fact that it was one consideration among several that had to be weighed, or the fact that it was *articulated* at all? And if nothing established fits, coin a term and give me the boundary cases, especially the stranger-rescue one where I think we want the opposite verdict.

  Bottom line first please: one sentence saying whether there's an established name (or that there isn't), then the carving. Under 350 words.
reasoning: |-
  Hmm, the user is describing this fascinating psychological phenomenon where knowing someone's explicit thought process during a good deed makes the act feel less authentic, even if their reasoning is morally sound. They've been wrestling with this for months and want to know if it has a name.

  Looking at their examples: a mother saving her child because of duty, someone keeping a secret out of principle, donating money for utilitarian reasons - all valid justifications that somehow feel "thinner" when we imagine them running through the person's mind during the act. The paradox is that for strangers, we actually prefer this explicit reasoning (like when a stranger rescues a child citing duty).

  I recognize this immediately - it's about the tension between intuitive action and deliberative justification. Philosophers like Bernard Williams wrote about this regarding "moral luck" and "one thought too many." Williams argued that sometimes ethical reflection can actually undermine the authenticity of moral actions, especially in personal relationships. When saving your own child, thoughts about duty feel excessive because we expect parental love to be instinctive.

  The user brilliantly connects this to non-moral domains too - explaining jokes or over-analyzing art creates similar dissatisfaction. This suggests it's fundamentally about cognitive framing: immediate experience versus post-hoc rationalization.

  For the stranger case, it makes perfect sense - since no personal relationship exists, we want evidence of deliberate moral reasoning to trust their character. But with intimates, we expect actions to flow from established bonds without needing justification.

  No single established term covers all dimensions, but "overjustification effect" comes closest in psychology (where extrinsic motivation undermines intrinsic). For the relational aspect, Williams' "one thought too many" is useful. The spoiler seems to be the act of explicit deliberation itself in contexts where we expect intuitive response.

  Boundary cases clarify: articulate reasons are welcomed when establishing new obligations (stranger rescue) or in professional contexts, but feel corrosive in personal relationships or aesthetic experiences where immediacy matters.

  The core is this: good actions feel most authentic when the justification exists as background commitment rather than foreground calculation. The moment deliberation becomes conscious, it alters our perception of the agent's connection to the act.
answer: |-
  **Bottom line:** There's no single established name, but it's closely related to Bernard Williams' concept of **"one thought too many"** in ethics and the psychological **"overjustification effect"**, though neither perfectly captures the relational nuance.

  **The Carving:**

  *   **Core Issue:** The explicit, conscious deliberation using a general principle (duty, utility, promise-keeping) *during* a deeply personal or relationship-bound act feels incongruous. It replaces expected intuitive/affective motivation (love, loyalty, spontaneous care) with calculation, making the act feel impersonal, thin, or like a performance of morality rather than its embodiment.
  *   **The Spoiler:** It's primarily the *fact of explicit deliberation* using abstract justification *in that specific relational context*. The content is correct, but its conscious presence as a *weighed reason* clashes with expectations for acts flowing from settled bonds.
  *   **Edges & Nuance:**
      *   **Relationship-Relative:** Spoiling occurs when the act is expected to arise *from the relationship itself* (parent-child, close friendship). For strangers, the same explicit moral reasoning is desirable – it provides assurance of character where no prior bond exists.
      *   **Not (Just) Motive:** The stated reason *is* genuinely good. The problem is its *mode of operation* (conscious deliberation) conflicting with the *context* (established intimacy).
      *   **Beyond Morality:** Parallels exist in aesthetics/humor. Explaining *why* something is funny or beautiful replaces the immediate experience with analysis, destroying the effect. The "articulated ground" fights the "immediate thing."
  *   **Stranger Rescue Boundary:** Here, the explicit moral thought ("duty") is essential *because* there's no pre-existing relationship. It demonstrates reliable character and provides justification for the stranger's intervention, making it reassuring rather than alienating.

  **In essence:** The spoiling happens when conscious appeal to general principle intrudes upon acts expected to be direct expressions of a particular relationship or immediate perception.
