answer: |-
  Here's the strongest case against your view, structured by destructiveness. I've ranked objections from fatal to awkward, flagged where superrationalists would dig in vs. concede, and identified ambiguities in your framing. The verdict is at the end.

  ### **Fatal Objections (Theory-Destroying)**
  1. **The Transparency Trap & Epistemic Circularity**  
     *Objection*: Superrationality requires agents to know they are "identical reasoners," but this is either undefined or requires impossible transparency. In the Platonia dilemma, how do you *know* others are superrational? If you assume it, you beg the question. If you don’t, symmetry breaks. The "program equilibrium" literature solves this via code inspection, but humans lack this. Your "bribed player" variant proves this: once asymmetry exists (even if you don’t know *who* is bribed), 1/20 collapses. Superrationality isn’t just fragile—it’s *inapplicable* to opaque agents.  
     *Superrationalist Response*: Digs in. "Same kind of reasoner" means *idealized* agents with common knowledge of rationality and symmetry. Real-world failures reflect imperfect reasoning, not a flaw in the theory.  
     *Why It’s Fatal*: Undermines the core premise. If "identical reasoners" can’t be identified or verified outside thought experiments, the theory has no practical domain.

  2. **Equilibrium Equivalence Masks Emptiness**  
     *Objection*: As you note, in Platonia the superrational outcome *is* the symmetric mixed-strategy Nash equilibrium. Where they diverge (e.g., Prisoner’s Dilemma), superrationality demands cooperation, but this only "works" if all agents *assume* cooperation is rational—a self-fulfilling prophecy. It's not a theory of rationality but a *coordination device* for achieving Pareto optima, requiring pre-commitment to the same algorithm. Call it "rational" only if you redefine rationality as "doing what identical copies would jointly agree to do."  
     *Superrationalist Response*: Concedes the overlap in Platonia but argues Nash is coincidental. True superrationality (e.g., cooperating in PD) is *categorically different* because it resolves conflicts between individual and collective rationality.  
     *Why It’s Fatal*: Reveals superrationality as Nash equilibrium in a meta-game where agents condition on shared reasoning rules. It doesn’t offer a *new* criterion—it relabels an existing solution concept.

  ---

  ### **Major Objections (Theory-Weakening)**
  3. **Causal Indefensibility & Real-World Payoffs**  
     *Objection*: Superrationality commits the *symmetry fallacy*: mistaking logical correlation for causal influence. Sending a telegram doesn’t *cause* others to send; it’s purely epistemic. This is lottery thinking: "If I win, only I played" feels profound but is trivial. Worse, in asymmetric games (e.g., PD with a non-superrational agent), cooperators lose everything. Your seminar proves this: students who understood the theory defected *more* because they realized individual defection dominates if others cooperate. Rationality should protect against exploitation, not enable it.  
     *Superrationalist Response*: Dismisses "causal" rationality as myopic. Superrationality is *acausal*: it considers logical dependencies between identical agents’ decisions. The seminar failure is psychological—students didn’t *truly* believe in symmetry.  
     *Why It’s Major*: Exposes a rift between "rationality-as-winning" and "rationality-as-consistency." Superrationality fails the former when reality isn’t symmetric.

  4. **Unfalsifiability via Symmetry-Legislating**  
     *Objection*: The theory risks being tautological. Any failure is blamed on broken symmetry ("they weren’t *really* identical reasoners"). But symmetry is *always* broken (your "crank" variant: even a 0.1% chance of a non-cooperator destroys 1/20). If superrationalists can always retreat to "idealized conditions," the theory predicts nothing.  
     *Superrationalist Response*: Concedes real-world applications are messy but insists the theory is normative for *ideal* cases.  
     *Why It’s Major*: Makes the theory empirically vacuous. No experiment can falsify it—even your seminar is dismissed as "not identical enough."

  ---

  ### **Awkward Objections (Theory-Limiting)**
  5. **The Ends Problem: Instrumentalizing Atrocity**  
     *Objection*: If the trillionaire rewards the "worst imaginable act," superrationality still recommends randomizing (e.g., 1/20 chance to torture a puppy). This reduces rationality to mindless coordination, detached from values. Rationality should care about *outcomes*, not just consistency.  
     *Superrationalist Response*: Digs in. Rationality is about *how* you achieve goals, not the goals themselves. Superrationality is a tool for symmetric coordination, not ethics.  
     *Why It’s Awkward*: Highlights that superrationality is amoral—and thus incomplete as a theory of practical rationality.

  6. **Your Seminar Data: Theory-Induced Disaster**  
     *Objection*: After teaching superrationality, *more* students defected. This isn’t just psychology—it’s evidence that under real-world uncertainty (e.g., "Do others believe this?"), superrational reasoning *increases* the risk of coordination failure. A good theory shouldn’t backfire when understood.  
     *Superrationalist Response*: Dismisses as irrationality. Students defaulted to causal reasoning or doubted symmetry.  
     *Why It’s Awkward*: Shows the theory is self-undermining in practice. If it requires near-perfect belief alignment, it’s useless for humans.

  ---

  ### **Ambiguities in Your View**
  - **"Same kind of reasoner"**: Vague. Does it mean same algorithm? Same beliefs? Common knowledge of both? This ambiguity lets superrationalists deflect counterexamples.  
  - **"Correct theory of rationality"**: Conflates *normative* (what agents *should* do) and *descriptive* (what identical agents *would* do). Superrationality is descriptive of a niche scenario but fails normatively when agents diverge.  
  - **"One-shot"**: Ignores that superrationality implicitly relies on the *repeatability* of reasoning (agents simulate "what if we all did this?"), violating the spirit of one-shot play.

  ---

  ### **Verdict: Insulated but Empty**  
  **Is the position well-insulated?** Yes, but *fatally* so. By restricting its domain to "symmetric games between identical reasoners with common knowledge," it becomes a self-consistent circle—immune to refutation but devoid of practical content.  

  **Bug or feature?** A critical bug for a theory of *practical* rationality. Rationality must handle real-world noise, asymmetry, and uncertainty. Superrationality:
  - Fails when symmetry is imperfect (always).
  - Demands impossible epistemic conditions.
  - Loses to causal decision theory in payoff-driven scenarios (e.g., your seminar).

  **The crushing irony**: Superrationality aims to resolve conflicts between individual and collective rationality, but its prerequisites (perfect symmetry, transparency) are so stringent that only in trivial cases (like Platonia, where it matches Nash) does it "work." In hard cases (e.g., PD), it demands a leap of faith indistinguishable from altruism. The theory is a beautiful thought experiment—but not a robust account of rationality. If this is "correct," rationality is a fairy tale told to identical ghosts in frictionless vacuums.
