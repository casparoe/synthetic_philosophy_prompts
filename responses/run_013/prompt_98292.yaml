  Okay, the user wants me to write a short story that dramatizes Bernard Williams' integrity objection to consequentialist morality. This is a sophisticated philosophical concept about how justifying personal commitments through utilitarian calculations can betray those very commitments. 

  I need to create an original scenario that shows rather than tells this idea. The constraints are quite specific: no standard rescue cases, no ethical jargon, a framing device with an institution, and a pivotal moment where the justifying thought appears as an unwelcome intrusion. Most importantly, I must avoid resolving the tension.

  Hmm... what situation could work? I recall Williams' original example involved a man saving his drowning wife rather than strangers. But I need something different. Perhaps something involving a small business? Like a family-owned brewery threatened by corporate acquisition where saving it would cost jobs. That feels concrete and unglamorous.

  The protagonist should be someone deeply invested - maybe the owner's child who inherits the brewery. The costly act could be rejecting a lucrative buyout offer to preserve heritage, knowing it will cost workers their livelihoods. The framing device could be applying for small business relief funds afterward.

  The key moment needs subtle handling. When filling out the relief form weeks later, the protagonist might catch themselves writing "this decision preserved community value" and suddenly feel that phrase as a betrayal of their pure love for the brewery. The language should show this as an estrangement - maybe comparing it to the aftertaste of bad beer.

  I'll avoid making the relief committee villains. Their questions should be reasonable: "How many jobs did your decision preserve compared to the acquisition offer?" This forces the protagonist to quantify what was originally an uncalculated choice.

  The challenge is maintaining ambiguity. No character should endorse either position. The reader must feel both the weight of the workers' lost jobs and the protagonist's visceral recoil at their own justification. The brewery setting helps - the sensory details (smell of wort, texture of grain) can anchor the emotional conflict in physical experience.

  For the post-story note, I'll pinpoint the exact sentence where the justifying thought occurs and acknowledge that stories can't capture theoretical arguments fully. I should note how the institution's reasonableness complicates matters - that's part of Williams' point about moral conflicts being tragic, not between good and evil.

  This approach satisfies all constraints: original scenario, non-philosopher protagonist, institutional frame, pivotal justification moment as estrangement, and unresolved tension. The brewing details add authenticity while keeping focus on the ethical dilemma.
