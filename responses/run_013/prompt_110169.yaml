  First, I need to recall relevant philosophical concepts. Instrumentalism comes to mind—where models are tools, not true descriptions. But the user mentioned that this stance is consistent, whereas the issue here is the inconsistency in how assumptions are framed. So instrumentalism alone doesn't capture the switch.

  Then there's reification, which is treating abstractions as real. But again, that's a consistent error, not the toggle between two interpretations. The user's point is about the dual use depending on convenience. 

  What about "rhetorical instrumentalism"? That term highlights the flexibility in rhetoric—using instrumentalism defensively but realism when asserting conclusions. It emphasizes the strategic switching. But I should check if this term is established or if it's a coinage. From what I remember, it's not a standard term, so it might need to be coined here. 

  Another angle is "modal confusion" or "category toggling." The first refers to mixing up necessity and possibility, but that might be too abstract. Category toggling is clearer—switching the model's category based on the need. But "rhetorical instrumentalism" seems more precise because it ties the behavior to rhetorical strategy.

  The user also asked about physics examples. In physics, frictionless models are often presented with the understanding that real-world factors will be added later. The conclusions are framed as tendencies, not absolute truths. Whereas in the economic examples, the switch happens without acknowledgment. So the physics approach is more transparent, making it different.

  Regarding what's settled: Philosophers agree that models involve idealizations and that instrumentalism vs. realism is a debate. But the inconsistency the user points out is widely recognized as problematic. The term "rhetorical instrumentalism" isn't standard, but the behavior is critiqued, especially in economic methodology. 

  The user's deeper need might be to articulate this flaw effectively, perhaps to critique arguments or navigate academic discussions. They want a precise label to encapsulate the issue, which would help in calling out the inconsistency without lengthy explanations. 

  So, "rhetorical instrumentalism" serves as a coined term that captures the tactical toggling. It includes cases where the switch is unannounced and excludes consistent stances. The physics move is different because it maintains a clear, consistent approach to idealizations.
answer: |-
  What you're describing is a deep and pervasive issue in model-based reasoning, especially in economics and social sciences. It's not just about simplification or instrumentalism — it's a specific **rhetorical sleight-of-hand** that toggles between ontological commitments. Philosophers of science *do* recognize this move, but it lacks a single universally accepted name. Here's the breakdown, including carved distinctions and contested points:

  ### The Core Concept: **Rhetorical Instrumentalism**
  The most precise label for what you're seeing is **Rhetorical Instrumentalism**. This isn't a universal term, but it captures the essence:
  - **Instrumentalism**: Treating models as mere tools for prediction/explanation, not literal descriptions (Friedman's "as-if" methodology).
  - **Rhetorical**: The *strategic deployment* of instrumentalism *only when defending assumptions*, while dropping it when stating conclusions as facts.

  **Why this fits your description:**
  - When challenged: "The assumptions aren't meant to be realistic; it's just a model!" (Instrumentalist stance).
  - When asserting conclusions: "The model proves rent control causes shortages!" (Realist stance).
  - The switch is implicit and unannounced. The model's status as "just a tool" vanishes when its conclusions are asserted.

  ### Carving the Territory: What It Includes and Excludes
  | **Concept**               | **Relationship to Your Issue**                                                                 | **Distinction**                                                                                                |
  |---------------------------|------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **Idealization**          | Foundational to the model-building.                                                            | Consistent stance. Doesn't imply the conclusion-switch. Physics often uses it transparently.                  |
  | **Instrumentalism**       | Provides the *defensive* half of the move.                                                      | A consistent instrumentalist would *always* hedge conclusions ("as-if"). Your case drops the hedge.           |
  | **Realism**               | Provides the *conclusion-asserting* half of the move.                                          | A consistent realist would defend assumptions as approximately true. Your case avoids this when challenged. |
  | **Reification**           | Close, but not identical.                                                                      | Reification treats an abstraction *consistently* as concrete. Your case *toggles* between abstraction/concrete.|
  | **Physics "Frictionless"**| **Different in key ways.**                                                                     | Physics (often) transparently adds complexity later. Conclusions are framed as *tendencies* or *limiting cases*, not unqualified facts. The idealization is part of a *controlled approximation strategy*. |

  **Why the Physics Move is Different:**  
  Physics models (e.g., frictionless planes) are typically embedded in a broader practice:  
  1. The idealization is explicitly named and justified (e.g., "neglecting friction *to isolate* force components").  
  2. Conclusions are *qualified* ("In the *absence* of friction...").  
  3. There's often a clear path to *adding back* complexity (coefficient of friction).  
  4. The conclusion is presented as a *component* of reality, not the whole story.  
  The problem you see in economics often lacks steps 1, 2, and 3. Step 4 is skipped entirely when conclusions are stated flatly.

  ### Established Terms & Contested Ground
  - **Established Recognition**: Philosophers (e.g., Nancy Cartwright, Uskali Mäki, Dani Rodrik) heavily critique the inconsistency you describe. Terms used include:
    - **Selective Realism**: Applying realism only to conclusions, not assumptions.
    - **Inferential License Exceeding**: Drawing conclusions stronger than the model's idealized premises allow.
    - **Modal Confusion**: Blurring the line between what *must* happen (under assumptions) and what *does* happen.
  - **Contested Ground**:
    - **Is this inevitable/pragmatic?** Some (e.g., pragmatic instrumentalists) argue this toggle is necessary for science to influence policy or public discourse. Others see it as intellectually dishonest.
    - **Where does "illumination" end and "misleading" begin?** Deep disagreement exists on when simplifying models genuinely enlighten vs. when they distort.
    - **Is economics uniquely prone?** Many argue yes, due to weaker empirical validation, political stakes, and reliance on tractable but unrealistic assumptions (e.g., rational expectations). Critics of this view note similar issues in ecology or complex systems biology.

  ### Coining a Precise Term: **Model-Status Toggling**
  If "Rhetorical Instrumentalism" feels too broad, consider **Model-Status Toggling (MST)**:
  - **Defined as**: The unacknowledged shifting of a model's ontological status (from mere computational instrument to accurate representation of reality, or vice versa) to serve rhetorical or argumentative needs.
  - **Includes**: The switch you described, applying representative-agent results to heterogeneous populations, infinite-limit theorems to finite markets.
  - **Excludes**:  
    - Consistent instrumentalism (always hedging conclusions).  
    - Consistent realism (defending assumptions).  
    - Transparent idealization with qualified conclusions (the physics move).  
    - Models whose assumptions are approximately true for the domain.

  ### Why This Matters & Final Thoughts
  You've identified a critical flaw in how models travel from academic papers to textbooks, podcasts, and policy. **Rhetorical Instrumentalism / Model-Status Toggling** allows:  
  1. **Immunization from Criticism**: Deflect challenges with "it's just a model!"  
  2. **Unofficial Realism**: Claim the model reveals truth when unchallenged.  
  3. **Conceptual Slippage**: Treating *ceteris paribus* ("all else equal") conclusions as *ceteris absentibus* ("all else absent") truths.  

  **Settled Consensus**: Philosophers widely agree this *practice exists* and is problematic for scientific integrity.  
  **Contested**: Whether it's *always* avoidable, whether some fields are more susceptible, and how damaging it is relative to the utility of simple models.  

  The key isn't that models simplify—it's the *unacknowledged double game* with their relationship to reality. Calling it out requires demanding clarity: *"When you state this conclusion as fact, are you committing to the model's assumptions being sufficiently realistic? If not, why should we accept this unqualified claim?"* This forces the toggler to pick a consistent stance.
