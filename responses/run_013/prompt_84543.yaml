prompt: |-
  Odd one, and I'm not sure it has a name. I keep noticing a pattern in art about something wrong in the world. A mate of mine watched a documentary about factory farming, wept all the way through, kept saying she couldn't believe this was happening, and then ate chicken two nights later without a flicker. Not hypocracy — she really was moved. And the reverse with me: I finished a novel about a woman who'd been badly wronged and came away feeling I'd somehow done right by her, as if the witnessing itself counted as a kind of justice. I hadn't done anything.

  My guess at what's going on: a good film or play can hand you the weight of a wrong *and* the verdict on it at the same time, so the feeling arrives already finished — it has a complete object, the wrong-as-already-condemned — and there's nothing left for it to do. A dry news item about the same wrong leaves the feeling open and unspent, and that's the one that actually gets people to do something.

  Is there an established concept for this? I vaguely remember Rousseau making an argument about the theatre along these lines — that it makes an audience weep and sends them home no better — and I think he had a whole case against Geneva having one, but I might be mashing that together with other things I've read since. The words I've got are catharsis, moral licensing, slacktivism, and none of them sit right: catharsis is the emotion being purged, whereas here the emotion gets a finished object and is satisfied rather than purged; moral licensing is about having done good first; slacktivism is about cheap substitutes for action. What I'm after is the exact carving — what this is, what it isn't, and where the edges are. Does it need the artwork to supply the verdict, or does any complete emotional response do the trick? Would witnessing a real wrong in person do it, or only a representation of one? If there's no name, coin one and give me the boundary cases. British English, please.
reasoning: |-
  Okay, let me unravel this user's query. They're describing a pattern where consuming art about injustice creates a sense of emotional resolution without leading to action, while bare facts leave one restless to act. Their examples: a friend wept over factory farming docs but ate chicken days later, and they felt "justice served" just by reading a novel about wronged woman. 

  Hmm, they're clearly wrestling with a paradox - why does visceral art fail to motivate while cold facts sometimes do? They've already ruled out catharsis (too purgative), moral licensing (requires prior good deed) and slacktivism (about token gestures). Smart distinctions. 

  Ah, Rousseau's theatre critique they mention is key - he argued spectacles drain moral impulse. That's the closest historical precursor. But their observation feels more precise: it's about the artwork providing both the wrong AND the verdict, creating a "finished" emotional object. Like a closed circuit. 

  Let me test boundaries as they asked: 
  - If you witness real injustice (say, bullying), the feeling demands action because there's no narrative resolution. 
  - Dry news reports lack emotional weight AND verdict - hence unease persists. 
  - Propaganda art might supply verdict but feel imposed, not satisfying. 

  The core mechanic seems to be narrative completion. So "narrative resolution" could work, but sounds too technical. "Artistic absolution"? Too religious. "Fictive closure"? Clunky. 

  ...Wait! "Aesthetic acquittal" - plays on legal terms, hints at art's false clearance. British English compliant. Boundaries: 
  - Requires represented injustice + implied moral judgment 
  - Differs from catharsis by satisfying rather than purging 
  - Not slacktivism because no token action occurs 

  User's razor-sharp about "edges" - they'll appreciate the propaganda counterexample. Should stress this isn't about art being bad, but about its completeness short-circuiting action. Might add that sometimes this "finished feeling" is exactly what traumatized audiences need. 

  Their mate's chicken dinner example is perfect - shows it's not hypocrisy but psychological mechanics. Clever user spotting that. Will position this as a missing term in moral psychology.
answer: |-
  Right, this is a sharp observation with significant psychological and philosophical bite. You're describing a phenomenon where **artistic representation of injustice provides a *sense of moral resolution* that satisfies the emotional impulse to "do something," thereby paradoxically *reducing* the drive for real-world action, while bare, unresolved facts create an uncomfortable "moral itch" demanding action.**

  You're correct that existing terms don't quite fit:

  *   **Catharsis (Aristotle):** Focuses on *purging* pity/fear, leaving calm. Here, it's more about *satisfaction* with the resolution *within* the artwork. The emotion isn't purged; it feels fulfilled by the artistic verdict.
  *   **Moral Licensing:** Involves *prior* good deeds licensing subsequent bad/inactive behaviour. Here, the "good deed" is purely internal/emotional (*feeling* the weight and verdict).
  *   **Slacktivism:** Involves *low-effort actions* (liking, sharing) substituting for harder action. Here, there's *no action at all*, not even a token one. It's purely internal resolution.

  **The Established Concept You're Touching Upon:**

  1.  **Rousseau's Critique of Theatre:** You recall correctly. In *Letter to d'Alembert on the Theatre* (1758), Rousseau argued specifically against Geneva building a theatre. His core point: Theatre *arouses* passions (pity, indignation) but provides a *safe, vicarious outlet* for them within the fictional world. The audience weeps for fictional characters, feels virtuous for doing so, and then leaves feeling emotionally spent and *less* motivated to address real suffering outside. "In giving our tears to these fictions, we have satisfied all the rights of humanity without having to give anything more of ourselves." **This is remarkably close to your core observation.**

  **Refining the Concept & Coining a Term:**

  Your insight adds nuance: it's not just the *arousal* and *release* (Rousseau/catharsis), but specifically the **provision of a *completed moral arc* within the artwork** (wrong + verdict = resolution) that satisfies the urge. The feeling arrives "already finished."

  **Proposed Term: Aesthetic Acquittal**

  *   **Aesthetic:** Pertaining to art, representation, and sensory/emotional experience.
  *   **Acquittal:** A legal term meaning release from a charge; a verdict of "not guilty" or, more broadly, a sense that justice has been served/closure achieved.

  **Aesthetic Acquittal:** *The psychological phenomenon whereby the experience of a morally resolved narrative within an artwork (fiction, film, theatre, etc.) provides a sense of fulfilled justice or emotional closure regarding the depicted wrong. This internal sense of resolution satisfies the observer's moral-emotional impulse, often inadvertently reducing the motivation for tangible action in the real world, even when analogous real-world injustices persist.*

  **Boundary Cases & Edges (British English):**

  1.  **Artwork Supplies the Verdict (Core Case):** The novel about the wronged woman where the narrative clearly condemns the wrongdoer and perhaps even shows consequences or the victim finding peace. *Aesthetic Acquittal* occurs. You feel "justice served" by witnessing the *artistic resolution*.
  2.  **Artwork Presents the Wrong *Without* Clear Verdict:** A bleak, ambiguous film about suffering that offers no catharsis, no clear villain punished, no sense of justice. (e.g., some Haneke films, *Threads*). **Not Aesthetic Acquittal.** It leaves you disturbed, unresolved – more like the news report, potentially motivating action (or despair).
  3.  **Witnessing a Real Wrong *In Person*:** Seeing someone bullied in the street. **Not Aesthetic Acquittal.** The lack of resolution, the immediacy, and the absence of a controlling narrative frame create a powerful, unresolved demand for action. The feeling is raw and *unfinished*.
  4.  **Consuming Propaganda Art:** Art designed to elicit outrage *and* direct it towards a specific real-world action (e.g., a powerful wartime recruitment film, a documentary explicitly calling for a boycott). **Not Pure Aesthetic Acquittal.** While it uses art, its goal is to *channel* the emotion into action, not resolve it internally. The verdict points *outwards*.
  5.  **Dry News Report (Bare Facts):** "Factory farm conditions involve X, Y, Z." **Not Aesthetic Acquittal.** It presents the wrong *without* emotional weight *or* narrative resolution. It creates cognitive dissonance and an unresolved "itch" – the state most likely to lead to research or action (or avoidance).
  6.  **Emotional Art *Without* a Specific Wrong:** A sad film about loss due to natural causes. You cry, feel resolved. **Not Aesthetic Acquittal.** The core element is a *moral wrong* that feels *judged and resolved*. Grief over loss isn't the same as injustice demanding redress.
  7.  **Mere Sentimentality:** Art that manipulates cheap emotion *without* genuine moral weight or a coherent verdict. Might produce tears but not the *specific* feeling of "justice served" for a wrong. **Not Core Aesthetic Acquittal.** It satisfies a different, shallower impulse.

  **Why "Aesthetic Acquittal" Works:**

  *   **"Aesthetic":** Captures the necessary role of artistic representation/form.
  *   **"Acquittal":** Emphasises the *verdict* aspect – the feeling that the wrong has been addressed, judged, resolved *within the frame of the artwork*. It conveys the sense of closure and release from the *demand* for justice that the artwork itself induced.
  *   **It distinguishes the mechanism:** The artwork doesn't just purge emotion (catharsis); it *adjudicates* the moral case presented within itself, providing internal closure.
  *   **It explains inaction:** If the "case" feels closed internally (acquitted within the aesthetic realm), the external pressure diminishes.

  **In short:** You've identified **Aesthetic Acquittal** – the satisfying, action-sapping sense of moral resolution provided by art that delivers both the wound and the bandage within its own frame. Rousseau saw the danger; you've dissected the precise mechanism: the *finished emotional object* of the wrong-as-already-condemned. It's why your mate could weep genuinely and then eat chicken – the documentary provided the emotional weight *and* (likely through its narrative framing, music, commentary) the implicit verdict, achieving a form of *Aesthetic Acquittal* that left nothing more *to feel she needed to do*. The news report, lacking that verdict, leaves the moral account stubbornly open.
