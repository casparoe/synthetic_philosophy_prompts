  ## Eulogy for Peter Halloran

  Friends, colleagues, citizens. We gather today in the shadowed light of this cathedral, not to bury Peter Halloran lightly, but to reckon with the weight of the man and the burdens he carried. To Mary, to his daughters, to his family – our hearts are with you in this profound loss. Peter walked beside you, loved you fiercely, and the absence he leaves is immeasurable. We share your grief.

  For eleven years, I had the honour, the complex and demanding honour, of leading the party Peter once steered. He was a strategist of sharp intellect, a colleague whose loyalty was forged in the fires of shared struggle, and yes, a friend whose counsel I deeply valued. He believed in the machinery of government, in its potential to build and to protect. He believed in this nation, fiercely and sometimes desperately.

  We remember Peter Halloran the statesman, yes. But to remember him truly, we must remember the times that tested the very soul of statecraft. We must recall the plague years. Twenty-three years ago, a relentless, unknown fever swept through our land. Panic was a tangible thing, whispered on the wind, carried in every cough. Peter, as Health Minister, stood at the eye of that storm. And there, he faced a choice no human being should ever face, but which falls, inevitably, to those who govern in catastrophe.

  A single, scarce therapeutic. Lives hanging in a terrible, imminent balance. Experts, scrambling in the dark, drafted a protocol in eleven desperate days. It was a map drawn by guesswork under siege. And the map said: concentrate the drug where it might save the most, where infrastructure might hold, where chaos might be contained. It meant, with brutal clarity, that the north would be written off. The arithmetic of survival became a sentence of death for thousands.

  The epidemic burned itself out with the spring. Four thousand souls lost. Mostly northern. Models later whispered that other paths might have led to greater ruin still. But that is cold comfort to the bereaved, and it was no comfort, I suspect, to Peter Halloran.

  For what we learned only later, too late for him to explain, was the deeper cut. He signed that protocol. He made that terrible calculation. And then, he stood before a terrified nation and denied it. He attributed the grim pattern of death to cruel chance, to bad luck. Not because he was callous. Not because he didn't know the cost etched on the faces of the north. But because he believed – with a conviction that haunted him, I think, until his last day – that if the people knew the state was *choosing* who lived and who died, the fragile threads holding us together would snap. He feared the shipments would stop, the trust would vanish, and the country would fracture beyond repair. He chose the lie to prevent what he saw as a greater collapse.

  **He was wrong to lie.** He knew he was wrong. That knowledge sat with him, a constant companion in the years that followed. He never spoke of the epidemic again. Not to me. Not, I suspect, to many. That silence was the echo of his guilt. It was the weight of the dirty hands that come, inevitably, with the mantle of ultimate responsibility in impossible times.

  This is the hard truth we gather with today. The inquiry continues; it must. Justice and understanding demand it. The Association of Bereaved Families from the north is here today. We see you. We hear you. You asked only that we do not pretend. We will not pretend.

  We cannot stand here and declare Peter Halloran blameless. He made a choice steeped in moral compromise. He traded truth for what he believed was survival. He wore the stain of that choice, silently, every day afterwards. That is the grim reality of governing in the crucible. Democracy demands leaders willing to step into that fire, to make decisions that bruise their conscience, that scar their soul, because someone *must*. And democracy demands something else of us: that we do not absolve them quietly afterwards. That we look squarely at the cost, at the compromise, at the guilt they carried on our behalf. A funeral, especially a state funeral, tempts us towards easy absolution, towards smoothing the rough edges of a life lived in hard service. But Peter Halloran deserves more than that. He deserves the unflinching recognition of the burden he shouldered, including the burden of his own failings.

  To those who loved him, who saw his tenderness, his humour, his dedication to family and party – we honour that man too. The complexity is the point. He wrestled with angels and demons, and the demons sometimes won a round. His love for you, Mary, for his daughters, was the anchor in that storm. It was real. It was true. It remains.

  To my party colleagues, who will look for signals in these words: This is not a verdict on a compensation bill. That is for the chamber, for the inquiry, for sober debate in the autumn sun. This is an acknowledgement of human frailty amidst impossible circumstance. It is a recognition that leadership is not a path of purity, but often a walk through shadow.

  To the journalists noting every phrase: This is not an apology spoken for him – he cannot speak. It is not a whitewash – the stain is part of the fabric. It is not an evasion – we name the lie and the fear that drove it. It is an attempt at honesty about a man who did hard, necessary, and deeply flawed things.

  Peter Halloran served a country he loved with a ferocity that sometimes blinded him, with a pragmatism that sometimes broke him, and with a resolve that came at a terrible personal cost. He bore the loneliness of the decision-maker who sees the abyss and steps forward anyway. He carried the guilt of the survivor who knows the price paid by others. He leaves us not with simple answers, but with profound and difficult questions about power, truth, sacrifice, and the terrible costs sometimes extracted by the duty to protect.

  We lay Peter Halloran to rest today. We do not absolve him. We do not condemn him from this pulpit. We simply see him. We see the minister who chose and lied. We see the leader who carried the unbearable weight. We see the husband, the father, the friend. We see the flawed, burdened, necessary man. And in seeing him whole, we acknowledge the terrible, complex inheritance of governing. The demand on this room, on all of us, is not to be soothed, but to understand. To understand the price, to remember the cost, and to decide, ourselves, how we will bear the burdens of our collective future with more wisdom, more courage, and perhaps, a little more light.

  Rest now, Peter. Your long vigil is over. The weight is passed.
