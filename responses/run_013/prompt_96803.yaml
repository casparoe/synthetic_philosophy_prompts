answer: |-
  Here's the full specification for an adequate theory of the access/phenomenal consciousness (A-P) distinction, designed to cut through circular debates. Requirements are categorized, motivated by specific cases or principles, and tagged by necessity. Your thought experiments and meta-question are integrated.

  ### Core Requirements for an Adequate Theory of the A-P Distinction

  | Requirement                     | Case/Motivation                                                                                               | Type (Must/Pref) | Threatens Which Theories?                     |
  | :------------------------------ | :------------------------------------------------------------------------------------------------------------ | :--------------- | :--------------------------------------------- |
  | **1. Blindsight Explanation**   | **Case:** Stable V1 lesion patient can guess visual features (e.g., motion) at above-chance levels while sincerely denying any visual experience. **Motivation:** Demonstrates access (information guiding behavior) *without* phenomenality. | **Must**         | Collapse theories (e.g., Dennett), weak HOTs   |
  | **2. Sperling Paradigm Explanation** | **Case:** Subjects see a full array of letters, "know" they saw them all, but can only report ~4; cueing *after* offset allows specific row access. **Motivation:** Demonstrates rich phenomenality *without* concurrent global access/reportability. | **Must**         | Strict GWT, theories denying rich phenomenality |
  | **3. Reportability Constraint** | **Principle:** Phenomenal states are *potentially* reportable *if* accessed. **Motivation:** Rejects "in principle inaccessible" qualia (avoids epiphenomenalism/isolationism). Report is our *only* intersubjective handle. | **Must**         | Radical mysterianism                           |
  | **4. Access ≠ Possession Distinction** | **Principle:** A theory must clarify *how* a state can *have* phenomenal properties (P) independently of being *accessed* (A) for report/control. **Motivation:** Prevents trivial collapse (e.g., "access *is* phenomenality"). Blindsight/Sperling demand this. | **Must**         | Collapse theories, some GWT interpretations    |
  | **5. Binary vs. Graded Access** | **Case:** Access is often binary (reported/not), phenomenality may be graded (e.g., fringe consciousness, low-contrast stimuli). **Motivation:** Theories must explain how graded P maps to (often binary) A without simply equating them. | **Must**         | Theories conflating intensity/access           |
  | **6. Rich Perception Constraint** | **Case:** Subjects experience a rich visual scene (e.g., many objects/colors) but can only report/attend to a subset. **Motivation:** Challenges theories where only attended/accessed content is phenomenal (e.g., early GWT). | **Must**         | Attention-only theories, strict GWT            |
  | **7. Subliminal Perception**    | **Lab Result:** Masked primes below detection threshold influence behavior/neural processing *without* conscious awareness. **Motivation:** Demonstrates complex access *without* phenomenality (weaker than blindsight but more common). | **Must**         | HOTs if they equate HOT with phenomenality     |
  | **8. NCC Dissociation**         | **Lab Result:** Some neural states correlate with stimulus processing/reportability (access NCCs), others with subjective report *independent* of stimulus (phenomenal NCCs? e.g., no-report paradigms). **Motivation:** Requires explaining neural dissociations. | **Must**         | Theories ignoring neural dissociations         |
  | **9. Phenomenal Overflow**      | **Camp Preference (Block):** Sperling shows phenomenality *exceeds* access capacity. **Motivation:** Defends richness/realism of phenomenality. | **Preference**   | GWT, Dennett-style theories                    |
  | **10. Access as Constitutive**  | **Camp Preference (GWT/Dennett):** Phenomenality *just is* global availability. Sperling is "meta-cognitive illusion". **Motivation:** Simplicity, avoids "magical" non-functional P. | **Preference**   | IIT, Radical Phenomenalism                     |
  | **11. Empirical Tractability**  | **Principle:** Must generate testable predictions about neural correlates, behavior, or reports. **Motivation:** Avoids unfalsifiable metaphysics. | **Must**         | Non-naturalist theories                        |
  | **12. Ignition = Access Link**  | **GWT House Rule:** Global ignition/broadcast *is* the neural basis of access. **Motivation:** Core GWT claim linking mechanism to function. | **Preference**   | Local recurrency theories (IIT), partial access |

  **Most Damaging Requirement:** **#2 (Sperling/Rich Perception)**. This does the most damage to popular theories:
  *   **Strict GWT:** Directly contradicts the claim that only globally broadcast content is phenomenal.
  *   **Many HOTs:** Challenges the idea that a higher-order thought *is* necessary/constitutive of phenomenality (if P exists before the HOT enabling report).
  *   **Collapse Theories (Dennett):** Incompatible with the claim that phenomenality is an "access fiction."

  **Conflicting Requirements:** **#2/#3 (Sperling/Richness vs. Reportability Constraint)** and **#9/#10 (Overflow vs. Access Constitutive)** are the core fault lines. The sharpest *practical* conflict is:
  *   **#3 (Reportability Constraint - our only handle)** vs. **#6 (Rich Perception - unreportable phenomenality)**. If report is our only evidence, how can we *justify* positing unreportable phenomenality (Sperling, richness)? The theory must explain *how* we know about unreportable P without direct report evidence (e.g., via subjective confidence, post-cue access latency, neural signatures). This is where the "crash" happens: justifying phenomenal richness without direct report data relies on inference, contested by access-constitutive views (#10).

  ---

  ### Your Thought Experiments Analyzed

  1.  **Decoded Broadcast + Denial:**
      *   **What it does:** Directly attacks **#12 (Ignition = Access)** and **#10 (Access Constitutive)**. If "access" (broadcast) is present *without* phenomenality (denial) or report, it severs the link between the *mechanism* of access (GWT ignition) and the *phenomenology*.
      *   **Stresses:** #4 (Access ≠ Possession), #7 (Subliminal Perception - but stronger), #8 (NCC Dissociation). It demands an explanation for *why* ignition didn't "feel like anything".
      *   **Kills:** Strict interpretations of **GWT** (where ignition = phenomenality). Also problematic for **HOTs** if the broadcast state is sufficient for a HOT.
      *   **Direction:** Pulls apart in the **Access-without-Phenomenality** direction (like blindsight, but potentially more dramatic).

  2.  **Vivid Report + No Ignition:**
      *   **What it does:** Directly attacks **#12 (Ignition = Access)** and the necessity of global broadcast for **#3 (Reportability Constraint)**. It challenges the core neural mechanism proposed by GWT.
      *   **Stresses:** #2 (Sperling), #6 (Rich Perception), #11 (Empirical Tractability - if ignition is the prediction). It asks: How can report occur without the presumed mechanism for global access?
      *   **Kills:** **GWT** as a *necessary* mechanism for access/reportability. Challenges theories where global workspace is *the* neural correlate of access consciousness.
      *   **Direction:** Pulls apart in the **Phenomenality/Report-without-(GWT-style)-Access** direction. It suggests reportability/access might be achievable via other mechanisms (e.g., localized recurrent loops, alternative broadcasting).

  **Key Point:** Experiment 1 targets the *sufficiency* of access mechanisms for phenomenality. Experiment 2 targets the *necessity* of a *specific* access mechanism (GWT ignition) for report/phenomenality. Both stress the core distinction (#4) but from different angles.

  ---

  ### The Meta-Question: Could the Distinction Be Wrong? What Would Evidence Look Like?

  Yes, the distinction *could* turn out to be wrong or illusory. Evidence against the gap would need to **dissolve the apparent dissociations** by showing they are misinterpretations. Here's what it would require:

  1.  **Blindsight Explained Away:** Show that blindsight involves *very degraded*, but still existent, phenomenal consciousness that patients systematically underreport due to damage affecting metacognition or confidence thresholds. Evidence: Neural signatures of degraded visual phenomenality in V1-lesioned cortex during "guessing"; patients reporting vague feelings or "knowing" that correlate with performance.
  2.  **Sperling/Richness Explained Away:** Demonstrate that the impression of rich phenomenality is a *post-hoc reconstruction* or *metacognitive error*. Evidence: Show that neural activity representing uncued items decays too rapidly (<~500ms) to support *ongoing* phenomenal experience before the cue; prove that subjective reports of richness are unreliable/inflated compared to actual perceptual resolution.
  3.  **Subliminal Effects Reinterpreted:** Argue that all subliminal influences occur *without any* phenomenal component, even a minimal one, and that any measurable access is purely non-conscious. Evidence: Show a *strict* neural threshold where effects below it show zero correlation with *any* neural signatures proposed for minimal phenomenality (even in no-report paradigms).
  4.  **NCCs Unified:** Discover that the neural correlates of "phenomenality" (subjective report) and "access" (reportability/control) are *always and necessarily identical*. There are no distinct neural states for "phenomenal but not accessed" or "accessed but not phenomenal". Evidence: Find that the *only* NCCs for subjective report are precisely the NCCs for global availability/ignition/reportability; show that "no-report" paradigms still activate the *full* access machinery even when report is withheld.
  5.  **Reportability = Phenomenality:** Successfully argue that **#3 (Reportability Constraint)** is not just a pragmatic handle but the *defining essence* of phenomenality. Evidence: Demonstrate that *all* putative cases of unreportable phenomenality (like Sperling uncued items) can be fully explained by access limitations on reporting *already experienced* content, not by lingering phenomenality without access.

  **In essence, dissolving the gap requires showing that every case purportedly showing A-without-P or P-without-A is actually a case of either (a) very degraded P-with-limited-A, (b) non-conscious access (no-P), or (c) a metacognitive error about P.** It would mean demonstrating that functional access (for report/control) and phenomenality are two descriptions of the *exact same* underlying state or process, with no possible dissociation. The burden of proof would lie heavily on explaining away blindsight and Sperling in particular. The distinction *is* falsifiable in principle, but falsifying it requires successfully reinterpreting the core dissociative evidence that motivated it in the first place.
