prompt: |-
  ok so I'm in a reading group on consciousness and we've spent like three weeks circling the access-vs-phenomenal distinction without ever stopping to ask what a theory of it would actually have to do. I can recite the distinction and I can name a case or two on each side, but I have zero grip on what the standard of adequacy even is here. Can you write me the spec? I mean the full requirements list: the cases a theory of the access/phenomenal gap has to get right, the distinctions it's not allowed to just quietly collapse (having the property vs. having access to it, binary vs. graded, reportable vs. merely present), the results from the lab side it can't contradict, and what would count as evidence for or against the whole picture. For each requirement, give me the case or the consideration that motivates it, and say whether it's something any adequate theory has to deliver or whether it's really just a preference of one camp -- I suspect a couple of the things we keep demanding are just GWT people's house rules dressed up as neutrality. Then tell me which single requirement on your list does the most damage to the most popular theories, and flag any two requirements you don't think can be satisfied at the same time. My money is on something colliding with the fact that report is our only handle on phenomenality, but I want to see exactly where the crash is.

  Two experiments our group keeps half-inventing, and I want them folded into the list properly. First: imagine you could decode, straight from cortex, the full content of whatever the workspace is broadcasting at a given moment -- the thing you'd normally be happy to call the content of the person's experience -- except the person denies experiencing anything, can't report it, and this replicates cleanly. Second, the mirror image: the person gives detailed, repeatable, vivid reports of a scene, but you can find no ignition, no long-range broadcast, no workspace signature of the kind the theory says should be there. Neither is a real experiment as far as I know, I just want to know what each one does to the distinction -- which requirements they stress, which theories they kill, and whether they pull the two notions apart in both directions or only one. And a meta question that I can't get anyone to answer straight: is this distinction even the kind of thing that could turn out to be wrong? If it turned out there's no gap at all, what would the evidence for that even look like -- what would have to be true of the cases that currently look like counterexamples? A table is fine for the requirements themselves, prose for the rest, and don't bother telling me who said what, I'll look that up myself.
