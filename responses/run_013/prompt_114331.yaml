prompt: |-
  So I'm running a four-week reading group for grad students in sociology and philosophy of social science — mostly people who read the Protestant Ethic once in a seminar and think they know it, which is the problem. Week 3 is the one I care about: can culture be a cause? using Weber as the test case, and I need to plan the session rather than just show up and talk. Don't explain the thesis to me; I know it. Tell me how to teach it.

  Here's what I want the session to actually land: the difference between three things that all get called "the Weber thesis" — (1) Protestant beliefs caused capitalism, a causal claim; (2) capitalist institutions, once running, selected for people with Protestant-ish dispositions, so the beliefs persisted for their economic effects, a selection/reproduction claim; and (3) the elective-affinity thing, where the beliefs and the economic form fit each other without either causing the other in any straightforward sense. My students will collapse all three into (1) within ten minutes unless the sequence stops them, and honestly a lot of published work collapses them too.

  The other thing I want them to get, and this is where I think the real dependency sits: Weber's causal machinery in the methodological essays — the counterfactual test where you ask what would have happened if the religious factor had been absent, hold everything else fixed, then ask whether the remaining conditions "generally" or "adequately" produce the outcome. That's the part that makes the thesis a causal thesis at all, and it's the part nobody teaches. So the plan has to put that machinery in place *before* they can even evaluate the claim, which means the sessions order is doing real work. I also need them to see that the choice of what to hold fixed isn't innocent — the ideal type of "the spirit of capitalism" is built partly out of the investigator's values, so the counterfactual is value-laden before you even run it.

  What I need from you:

  - The order the pieces have to come in, and for each step, what depends on what. Be specific about where the ideal-type construction goes relative to the counterfactual test, because I keep getting that wrong when I improvise.
  - The one carrying example. My instinct is NOT to use Franklin (they'll have read it and it turns the whole thing into a text-comprehension exercise) and NOT to use "Protestant countries are richer" (that's a correlation they'll fight about instead of the concept). I want one example that carries the whole session, and I want you to pick it and defend it — it has to be something they can hold in their heads without notes, it has to have a real counterfactual, and it has to be able to show the difference between the three claims above. If a modern case (some subculture that reproduces itself through economic success, or a firm or industry with a distinctive ethos) does this better than a historical one, make that call and say why. Don't hand me a menu; pick one.
  - The misconceptions, in the order they'll actually surface, and exactly where in the sequence I head each off. I'm expecting at least: "so Weber says ideas beat material interests" (the anti-Marx reading), "it's just a just-so story, no test possible," "the counterfactual is unfalsifiable so the whole thing is soft," "elective affinity is a cop-out that means we don't know," and "if some Catholic regions industrialized then Weber is refuted." I'm sure I'm missing some; add them and place them.
  - The check for understanding at the end: one thing I can ask or have them do that shows they've got the dependency structure and not just the vocabulary. I don't want a quiz on who wrote what.
  - What I should openly refuse to do at this level. I'd rather say "we are not settling X today" out loud than have them leave thinking the session answered it.

  Be committed: make the calls, don't lay out options for me to choose from. If you think my framing of the three claims is wrong, or that counterfactual-first is a mistake, say so and tell me what to do instead. And flag anywhere I'm leaning on a contested reading of Weber rather than the plain text, since I'm teaching this to people who will check.
reasoning: |-
  Okay, let me approach this systematically. The user is a sociology/philosophy instructor designing a graduate seminar on Weber's causal methodology, with very specific pedagogical goals about disentangling three versions of the "Weber thesis" and teaching the counterfactual machinery. 

  First, I need to recognize the core tension: students will instinctively collapse Weber's nuanced argument into crude causality (claim 1). The solution requires a strict sequence where methodological tools are introduced before examining the thesis itself. 

  For the carrying example, I'm considering a modern tech startup culture case - say, open-source software communities. This works because:
  - It mirrors Weber's elective affinity structure (shared norms ↔ collaborative production)
  - Allows clean counterfactual: "Would GitHub exist without hacker ethics?"
  - Clearly separates causality (did ethics cause platforms?), selection (do platforms reward ethical behavior?), and fit (mutual reinforcement)
  - Avoids historical baggage of Protestantism debates
  - Concrete enough for grad students to analyze without prior reading

  The sequence must be:
  1. **Ideal types first** - Construct "bureaucratic ethos" from student examples to show value-laden abstraction
  2. **Counterfactual method next** - Use software example to demonstrate holding factors fixed
  3. **Only then apply to Weber** - Map Protestant/capitalism as test case for the pre-built framework

  Key misconceptions to preempt:
  - "Counterfactuals = unfalsifiable" → show how Weber constrains them via historical comparison
  - "Catholic industrialization refutes Weber" → explain adequacy-of-causes vs. necessity
  - "Elective affinity = cop-out" → demonstrate it as positive account of institutional reinforcement

  The check for understanding should force application: "Design a counterfactual test for monastic orders' role in preserving literacy - what would you hold fixed?" This reveals grasp of the machinery beyond rote concepts.

  I'll explicitly bracket:
  - Protestantism's historical accuracy (focus on method)
  - Marx vs Weber debates (distraction)
  - Modern capitalism definitions (scope creep)

  Notable commitments:
  - Rejecting Franklin examples (avoids textual exegesis)
  - Not defending Weber's empirical claims (staying methodological)
  - Treating elective affinity as distinct explanatory mode
answer: |-
  Here's the committed teaching sequence, designed around causal dependencies and misconception-proofing. I'll defend every choice against your constraints.

  ---

  ### **Non-Negotiable Session Sequence & Dependencies**
  *(Total: 115 min session)*

  1. **Ideal-Type Construction FIRST (25 min)**  
     - **Activity:** Have students build an ideal type of "Silicon Valley Startup Culture" *from scratch*. Guide them to list traits (e.g., "fail fast," meritocracy myth, long hours as virtue, disruption fetish).  
     - **Why now?** Forces them to see ideal types as *value-laden abstractions* (e.g., choosing "disruption" over "job security" reflects the investigator's focus).  
     - **Dependency:** Must precede counterfactuals because the ideal type defines the variables for the test. Weber's "spirit of capitalism" is meaningless without this.  
     - **Head off:** "Weber is just describing reality" → Show how their SV type omits counterexamples (unionized tech workers) by design.

  2. **Counterfactual Machinery (30 min)**  
     - **Carrying Example:** **Open-Source Software (OSS) Movement**  
       - *Claim:* "The hacker ethos (meritocracy, collaboration, intrinsic reward from code) enabled large-scale OSS development."  
       - *Counterfactual Test:* "Would Linux exist without this ethos, holding fixed: internet tech, skilled programmers, and market demand for free software?"  
     - **Why OSS?**  
       - Holds in the head: Students know GitHub/Copyleft vs. proprietary models.  
       - Clean causal separation: Ethos isn't *necessary* (corporations write code) but may be *adequate* for the OSS *form*.  
       - Shows "hold fixed" bias: Choosing "internet tech" as fixed ignores that early internet was *shaped* by hacker ethos.  
     - **Key Move:** Distinguish **"Adequate Causation"** (the ethos generally enables OSS) vs. **"Necessary Causation"** (OSS impossible without it). Weber only claims the former.  
     - **Head off:**  
       - "Counterfactuals are unfalsifiable" → Stress Weber's *historical comparison*: Contrast OSS with 1980s proprietary models (like Weber comparing Catholic/Protestant regions).  
       - "It's soft" → Show how "adequacy" demands evidence: e.g., failed corporate OSS (OpenSolaris) lacking ethos.

  3. **Apply to Weber's Thesis (40 min)**  
     - **Map the Three Claims onto OSS:**  
       - *(1) Causal:* "Hacker ethos caused OSS."  
       - *(2) Selection:* "OSS success selected for hackers (e.g., Red Hat hires ethos-aligned devs)."  
       - *(3) Elective Affinity:* "Hacker ethos and OSS tech *co-evolved* (GPL licensing shaped ethos, ethos shaped tools)."  
     - **Then pivot to Protestant Ethic:**  
       - *(1) Causal:* Protestant belief → Spirit of Capitalism (SoC)  
         *Counterfactual:* "Without ascetic Protestantism, would other factors (trade, tech) *adequately* produce the *specific* SoC (Franklin's ethos)?"  
       - *(2) Selection:* Capitalism selects Protestant traits (e.g., thrifty workers promoted).  
       - *(3) Affinity:* SoC and ascetic Protestantism fit logically (both systematize life; reinforce each other).  
     - **Head off:**  
       - "Anti-Marx reading" → Affinity isn't "ideas beat material interests"; it's *mutual reinforcement*.  
       - "Catholic industrialization refutes Weber" → No: Weber asks if Catholic regions developed the *same ethos* (adequacy test, not necessity).  
       - "Elective affinity = cop-out" → Show it explains *stability*: Why didn’t capitalism erode Protestant norms? (They fit).

  4. **Check for Understanding (10 min)**  
     - **Task:** "You study Japanese lifetime employment. Build a counterfactual test for the claim: ‘Samurai values caused it.’ What do you *hold fixed*? What ideal type do you construct? How might *selection* or *affinity* complicate this?"  
     - **Why it works:** Tests grasp of sequence (ideal type → counterfactual → alternate claims) and value-laden "hold fixed" (e.g., fixing "post-war labor laws" ignores cultural roots of laws).

  5. **What We Explicitly Bracketed (10 min)**  
     - "We are NOT evaluating if Weber was *historically correct*."  
     - "We are NOT resolving if culture > material factors."  
     - "We are NOT defining ‘true’ capitalism."  
     - **State why:** "Today is about *how Weber constructs causal arguments*—not whether his specific case holds."

  ---

  ### **Defending Controversial Calls**
  - **Counterfactual-First is Non-Negotiable:**  
    Weber’s causality *is* the counterfactual test ("adequate causation"). If you teach the thesis first, students default to deterministic causality (claim 1). The OSS example isolates the method.
    
  - **Ideal Type MUST Precede Counterfactual:**  
    You can't define what to "hold fixed" without the ideal type. Weber’s "spirit of capitalism" is the constructed variable. Doing it later (as many do) makes counterfactuals seem arbitrary.

  - **Why Not Protestant Examples?**  
    You’re right: Franklin invites exegesis, national comparisons spark correlation debates. OSS bypasses this. *Weber’s method* is portable; the Protestant case is just an application.

  - **Elective Affinity as Positive (Not Cop-Out):**  
    I reject framing affinity as "we don’t know." In Weber, it’s a distinct mechanism: beliefs/institutions *stabilize* each other without direct causation. OSS shows this (norms + licenses reinforce).

  - **Contested Reading Flags:**  
    - "Adequate causation" relies on Weber’s *Critical Studies in Logic* (1906), not just PE. Some scholars merge it with probability; I treat it as a standalone test.  
    - "Value-laden ideal types" draws from "'Objectivity' in Social Science" (1904). Not all Weberians agree, but your grad students will encounter it.

  ---

  ### **Misconceptions Addressed & Sequence Placement**
  | Misconception | When It Arises | How to Head Off |
  |---------------|----------------|-----------------|
  | "Weber vs. Marx = ideas > material" | During claim-mapping | Stress: Affinity isn't opposition; material factors are in the counterfactual (e.g., "hold fixed" tech). |
  | "No test possible" | Intro to counterfactuals | Show historical control in OSS (corporate failures) and PE (Weber’s China/India comparisons). |
  | "Catholic regions refute Weber" | Applying to PE | Clarify: Adequacy ≠ necessity. Ask: "Did Catholic regions develop the *same ethos*?" |
  | "Affinity = indeterminacy" | Claim-mapping | Contrast: Causation (A→B) vs. affinity (A↔B mutual fit). Use OSS: Licenses shape ethos, ethos shapes licenses. |
  | "Holding fixed is neutral" | Counterfactual demo | Revisit SV ideal type: Choosing "internet" as fixed ignores its ethos-infused history. |
  | "Weber ignores institutions" | Selection claim | Show claim (2): Capitalism *selects* Protestant traits, making institutions actors. |

  ---

  ### **Why This Works**
  - **Dependency Chain:** Ideal types (abstraction) → Counterfactuals (test design) → Claims (application) forces rigor.  
  - **OSS Example:** Modern, familiar, separates mechanisms cleanly. Students can't retreat to Protestant debates.  
  - **Misconception Timing:** Preempts collapse by structuring claims as *alternatives*, not layers.  
  - **Check:** Forces application of *method*, not thesis recall.  

  **Trap to Avoid:** Don’t let them turn OSS into a "right answer" debate. Shut down with: "This is a *model* for Weber’s logic—not a case to win."
