  Okay, let me approach this retired geochemist's query methodically. They're clearly deeply engaged with philosophical questions about identity in art conservation after a scientific career, which suggests they'll appreciate precision but also concrete examples.

  The core tension they observe fascinates me: institutions treat artworks as persisting through material changes (like canvas replacement) yet reject perfect replicas as distinct. The building reconstruction case adds another layer - complete material replacement accepted as same building. 

  First I need to unpack the implicit metaphysics. The conservation norms are telling: minimal intervention and reversibility only make sense if the artwork isn't identical to its current matter. That's a strong clue. Then the replica rejection shows it's not about perceptual qualities either. 

  Hmm... this points toward some form of historical individuation. But which kind? The bronze cast example suggests origin in the artist's creative act matters most. Yet for buildings, the original location seems crucial despite total material replacement. 

  I should test theories against the practices:
  - If artworks were just matter (mereological universalism), replica rejection wouldn't make sense
  - If they were perceptual types, replicas should be accepted
  - Only a historical entity view explains both replacement tolerance and replica rejection

  The building case is particularly illuminating - it shows identity can persist through complete material turnover when historical continuity is maintained. That might be the key: not just origin, but continuous institutional recognition. 

  For underdetermination... maybe between abstract particulars and historical individuals? Both could accommodate the practices. But if we switched to a materialist view, museums would have to treat every minor conservation as creating a new work - chaos for cataloging and valuation. 

  The geochemist's background makes me think they'll appreciate the parallel to geological objects - a mountain persists through erosion, but a replica mountain wouldn't be "the same". That might help ground the abstraction.
answer: |-
  Your observation captures a profound tension in how cultural institutions handle identity through change—a tension that reveals an implicit metaphysics of persistence grounded in **historical individuation** rather than material or perceptual continuity. Let's reconstruct the commitments step by step, using your cases as guideposts.

  ---

  ### **Core Commitment: Artworks as *Historical Individuals***
  The practice presupposes that **a work is a temporally extended entity individuated by its origin and career**, not by its matter or appearance. This aligns closest with theories of **abstract particulars** (e.g., David Wiggins' "continuants") or Amie Thomasson's "historical individuals" in artifact ontology.  

  #### **Key Features of the Presupposed View:**
  1. **Origin-Dependent Identity**:  
     - A bronze cast from the *artist's original mold* is the "same work" because it originates in the artist's creative act. A replica, even if indistinguishable, lacks this causal-historical genesis.  
     - A rebuilt heritage structure (e.g., Warsaw's Old Town) retains identity because it occupies the *same location* and perpetuates the *same historical narrative*, despite total fabric replacement.  

  2. **Dynamic Material Realization**:  
     - The work is *realized by* but not *identical to* its matter. Canvas replacement or marble arm restoration are changes to the vehicle carrying the work, not the work itself.  
     - **Conservator norms** (minimal/reversible intervention) assume the work *survives* its current material state: the entity persists while its physical basis evolves.  

  3. **Rejection of Perceptual Indiscernibility**:  
     - Replicas are rejected because identity requires *causal continuity* with the artist's creation. A perfect forgery lacks the right history, even if identical in appearance.  

  ---

  ### **Which Practices Require Non-Material Identity?**
  | Practice | Strictly Requires Non-Material Identity? | Why |  
  |----------|------------------------------------------|-----|  
  | **Material Replacement** (e.g., canvas, marble arm) | Yes | If the work = its matter, replacement would destroy it. |  
  | **Rejection of Replicas** | Yes | If identity required perceptibility, replicas would suffice. |  
  | **Heritage Rebuilding** | Yes | Total fabric replacement would annihilate a purely material object. |  
  | **Valuation/Attribution** | Yes | Value attaches to the historical entity (e.g., "Rembrandt's *Night Watch*"), not current matter. |  

  ---

  ### **Compatible Theories (and Ruled-Out Alternatives)**
  - **Compatible Theories**:  
    - **Historical Individuals**: Works as entities tracing to a unique origin (e.g., Jerrold Levinson).  
    - **Abstract Artifacts** (e.g., Amie Thomasson): Works as created types, tokened by physical instances.  
    - **Embodied Form** (Aristotelian): The work as a "substantial form" realized in changing matter.  

  - **Ruled-Out Theories**:  
    - **Mereological Essentialism** (work = specific atoms): Contradicts all material replacement cases.  
    - **Perceptual Types** (work = observable structure): Cannot exclude replicas.  
    - **Eternalist Materialism** (work = initial matter): Fails for heritage rebuilding.  

  ---

  ### **The Tension: Replacement vs. Replication**
  The two halves **do not pull in opposite directions**; they cohere under **historical continuity**:  
  - **Material replacement** preserves the work's *causal chain*: Conservators act as stewards of the object's biography.  
  - **Replication breaks this chain**: No matter how perfect, replicas lack the right history.  

  > **Example**: The *Venus de Milo* remains "itself" after losing arms and restoration because its identity is tied to its discovery in 1820 and its Louvre residency—not its original marble or completeness. A 3D-printed copy lacks this narrative.

  ---

  ### **Underdetermination & What Changes Under Rival Theories**
  **Where practice is underdetermined**:  
  - **Abstract Types vs. Concrete Particulars**: The practice could fit either.  
    - *Abstract Types*: The work is a pattern created by the artist; physical instances (even restored) are tokens.  
    - *Concrete Particulars*: The work is a spatiotemporally continuous object with evolving parts.  
    Both explain replica rejection (wrong type/no continuity) and material change (tokens vary/parts replaced).  

  **If we adopted rival theories, practice would collapse**:  
  1. **Work = Material Parts**:  
     - Every conservation intervention (e.g., relining canvas) creates a "new" work. Attribution, valuation, and provenance records would reset.  
     - Heritage rebuilding (e.g., Notre-Dame) would be classified as a replica, not the original.  

  2. **Work = Perceptually Indistinguishable Objects**:  
     - Replicas = originals. Museums would display copies, devaluing historical artifacts.  
     - Conservation ethics (e.g., reversibility) become meaningless—any replacement is acceptable if visually identical.  

  ---

  ### **Synthesis: A Hybrid View**
  The practice points to a **hybrid ontology**:  
  - **Artworks as *created historical entities***, individuated by:  
    - **Origin**: The artist's generative act (e.g., Rodin casting a mold).  
    - **Continuity**: An unbroken chain of custody, conservation, and recognition.  
    - **Realization**: The work is *realized by* but not *reducible to* matter—allowing dynamic embodiment.  

  This explains why:  
  - A rebuilt heritage structure is "the same" (continuous identity rooted in place/history).  
  - A replica is rejected (no genesis in the artist's act).  
  - Conservators prioritize *preserving the narrative* over freezing matter.  

  This view is closest to **artifactual theory** (e.g., R.G. Collingwood) where artworks are "imaginary objects" sustained by cultural practice—a fitting ontology for institutions that are, as you note, curators of time.
