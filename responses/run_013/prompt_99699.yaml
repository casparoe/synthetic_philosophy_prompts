prompt: |-
  I'm a PhD student working on hedonism and population ethics, and I'm trying to make a handout for a small reading group on negative utilitarianism. The thing we keep getting stuck on is whether pleasure and pain are even commensurable, and what people who say things like lexical threshold actually mean. I want a decision tree slash taxonomy that sorts the positions on that, not a list of names. You're an expert in formal axiology and normative ethics, so think carefully about the logical space first; brainstorm the possible combinations of answers before you commit to leaves, and don't just recite the usual labels.

  I want exactly five numbered items, no intro or conclusion, each a compact sentence or two, one per leaf. Start the tree from the commitment that at least some pains and pleasures can be ordinally ranked against each other, then for each leaf give the concrete diagnostic question or questions that get you there and one sentence on the view's most awkward commitment. Please build the tree from the logical space rather than from a list of names, and use these distinctions: whether there is a single cardinal scale for pleasure and pain; whether any amount of pleasure can outweigh a single pain, i.e. Archimedean versus non-Archimedean; whether lexical priority is local to a life or global across persons; whether the threshold structure is symmetric, so that pleasure can also be lexically blocked by pain, or asymmetric; and whether a pain's threshold status is absolute or relative to a baseline. I especially want leaves for classical hedonism, weak negative utilitarianism where only extreme pains are protected, strong lexical threshold negative utilitarianism, a pluralist incommensurability view, and a prioritarian-ish view where pain and pleasure are comparable but pain gets extra weight. Use the case of one hour of torture followed by a billion years of mild pleasure, and the case of a very large number of mild pains versus one severe pain, as the diagnostic cases. If two of your five leaves can't be separated by any question, say so inside the relevant items rather than papering over it.
