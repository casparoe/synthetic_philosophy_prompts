  I need to start from the premise that at least some pains and pleasures can be ordinally ranked. Then, I'll build a tree with exactly five leaves, each representing a distinct position. The key distinctions to include are: whether there's a single cardinal scale, whether any pleasure can outweigh pain (Archimedean vs. non-Archimedean), whether lexical priority is local or global, if the threshold structure is symmetric or asymmetric, and whether a pain's threshold is absolute or relative to baseline. 

  The diagnostic cases to use are: one hour of torture vs. a billion years of mild pleasure, and many mild pains vs. one severe pain. Each leaf should have a compact description, the diagnostic questions that lead there, and the view's most awkward commitment. The five positions should cover classical hedonism, weak negative utilitarianism, strong lexical threshold negative utilitarianism, pluralist incommensurability, and a prioritarian-like view. 

  Hmm, let me map the logical space. The first fork should be about cardinal comparability—can pleasure and pain be measured on a single scale? If yes, then the next question is whether they are Archimedean. If not, then it branches into pluralist views. For the non-Archimedean branch, I need to distinguish symmetric vs. asymmetric thresholds, and for asymmetric, whether the threshold is absolute or relative. 

  For classical hedonism, it should affirm a single cardinal scale and Archimedean ordering, so torture could be outweighed by sufficient pleasure. Its awkwardness is defending that torture trade-off. Weak negative utilitarianism would have a cardinal scale but non-Archimedean for extreme pains, locally lexically prior—so torture blocks the pleasure but mild pains don't. The awkward part is defining the threshold precisely. 

  Strong lexical threshold would be asymmetric and absolute, globally applying—so torture always trumps, and many mild pains can't sum to equal one severe pain. The problem here is the discontinuity. Pluralist incommensurability denies cardinal comparability, making trade-offs indeterminate. And the prioritarian view has cardinal comparability but weights pain more, leading to aggregation issues with mild pains. 

  I should ensure the diagnostic questions clearly separate the leaves. For example, asking about torture vs. pleasure distinguishes Archimedean vs. non-Archimedean, and asking about many mild pains vs. severe pain separates strong lexical from prioritarian. The relative vs. absolute threshold might not always be distinguishable with these cases, so I note that where needed. 

  This structure should address the user's need for clarity on commensurability and lexical thresholds, using concrete cases to highlight the commitments. It avoids name-dropping and focuses on logical distinctions, which aligns with their request.
answer: |-
  Here is the decision tree taxonomy on pleasure-pain commensurability, structured from the commitment of ordinal comparability. Diagnostic cases: (A) one hour torture vs. billion years mild pleasure; (B) N mild pains vs. one severe pain.

  1.  **Classical Hedonism:** Single cardinal scale for all experiences; Archimedean ordering (any pain can be outweighed by sufficient pleasure). *Diagnostic:* In case (A), torture *is* outweighed by sufficient mild pleasure; in (B), sufficiently large N mild pains outweigh one severe pain. *Awkward commitment:* Defending that sufficiently vast pleasure *can* morally justify imposing torture.
  2.  **Weak Lexical Threshold (Local/Asymmetric):** Single cardinal scale *except* for extreme pains exceeding a local threshold; non-Archimedean for these pains only. *Diagnostic:* In (A), torture blocks the pleasure (cannot be outweighed); in (B), sufficiently large N mild pains *can* outweigh one severe pain (if severe pain is below threshold). *Awkward commitment:* Defining the precise, non-arbitrary threshold where lexicality begins.
  3.  **Strong Lexical Threshold (Global/Asymmetric/Absolute):** Single cardinal scale below a global, absolute threshold; non-Archimedean above it (extreme pain lexically prior to all sub-threshold states). *Diagnostic:* In (A), torture blocks the pleasure; in (B), *no* number of mild pains outweighs one severe pain above threshold. *Awkward commitment:* Accepting that preventing one momentary torture outweighs curing any number of sub-threshold sufferings (e.g., vast migraines).
  4.  **Pluralist Incommensurability:** No single cardinal scale; pleasure and pain are fundamentally distinct types of value, comparable only ordinally or not at all cardinally. *Diagnostic:* In *both* (A) and (B), no definitive cardinal answer exists – trade-offs involve qualitative, non-quantifiable judgment. *Awkward commitment:* Making coherent interpersonal trade-offs or population axiology impossible without further principles.
  5.  **Prioritarian Weighting:** Single cardinal scale; Archimedean ordering, but disvalue of pain is cardinally amplified relative to pleasure (e.g., disutility multiplier). *Diagnostic:* In (A), torture can *eventually* be outweighed by vast pleasure (but requires more than classical); in (B), N mild pains *can* outweigh one severe pain, but N must be larger than under classical hedonism. *Awkward commitment:* Defending the specific weighting ratio and its aggregation rules (e.g., amplified disutility summing vs. diminishing sensitivity).

  **Clarification:** Distinguishing "relative to baseline" vs. "absolute" thresholds solely with cases (A) and (B) is generally impossible, as both interpretations yield the same verdicts for these scenarios. Further cases involving baseline shifts (e.g., chronic pain adaptation) are needed to separate them.
