answer: |-
  **Final Examination Question**  
  **Module: Advanced Formal Epistemology**  
  **Time Allowed: 45 minutes**  
  **Marks: 30**  

  **Question:**  
  A student proposes "calibrationism": the fundamental epistemic good for credences is not accuracy (closeness to truth measured by a proper scoring rule), but calibration (events assigned credence *p* occurring with frequency *p*). She argues that (1) calibration is what we inspect in real-world forecasters, and (2) accuracy demands the impossible—only an omniscient credence function can be maximally accurate. Evaluate calibrationism. What insights does it offer, and where does it fail? Use this critique to identify the most vulnerable premise in the accuracy-first programme.  

  ---

  **Model Answer (650 words):**  

  Calibrationism offers a compelling challenge to accuracy-first epistemology by highlighting practical evaluation methods and the unattainability of perfect accuracy. However, while calibration has diagnostic value, it fails as a *fundamental* epistemic good due to its technical flaws and inability to ground normative constraints. The comparison reveals that accuracy-first’s reliance on *immodesty* is its weakest link.  

  Calibrationism’s strengths lie in its intuitive appeal. As the student notes, we often assess forecasters (e.g., weather predictors) by checking whether events to which they assign *p* occur roughly *p*% of the time. This reflects a concern for *reliability*: whether the agent’s credences match long-run frequencies. Moreover, the argument that accuracy demands omniscience correctly identifies that no non-omniscient agent can achieve maximal accuracy (e.g., 0 Brier score) in any possible world. Accuracy-first seems to set an impossible standard.  

  Nevertheless, calibrationism suffers from fatal weaknesses. **First**, calibration is trivially satisfiable. An agent can be perfectly calibrated by assigning every event its *base rate* (e.g., always assigning "rain" a credence equal to London’s historical rainfall frequency). This "no-information function" requires no evidence-responsive reasoning, violating core epistemic norms. **Second**, calibration is not a strictly proper scoring rule. A strictly proper rule incentivises agents to report true credences, but calibration does not: an agent aware of base rates can game calibration by ignoring evidence and reporting base rates. This undermines its normative force.  

  **Third**, calibration conflates reliability with *refinement* (discrimination). A well-calibrated forecaster might distinguish between 0.5 and 0.51 risks only weakly, while a refined forecaster makes sharper discriminations (e.g., assigning 0.9 to high-risk cases). These are tradable: one can sacrifice refinement for better calibration by hedging assignments toward base rates. Epistemically, refinement matters—we value agents who can identify subtle evidential differences. Calibration alone cannot explain this.  

  **Fourth**, perfect calibration is *impossible* across all propositions due to self-reference. Consider an agent assigning credence *p* to: *"This credence is not 0.7"*. If *p* = 0.7, the statement is true iff *p* ≠ 0.7—a contradiction. No coherent *p* satisfies calibration here. Thus, calibration cannot universally ground epistemic norms.  

  The accuracy-first programme avoids the omniscience objection via *dominance*, not maximisation. A credence is irrational if it is *accuracy-dominated*: another coherent credence is more accurate in all possible worlds. The omniscient function is irrelevant; the target is *non-dominance*, achievable by any credence aligning with the evidence (e.g., via conditionalisation). Crucially, this requires *immodesty*: an agent must believe their own credence function minimises expected inaccuracy (by their own lights). This ensures they would not willingly switch to another function.  

  Here lies accuracy-first’s vulnerability. Immodesty assumes epistemic rationality entails self-endorsement of one’s credences. But this is circular: immodesty itself is a rational norm, not derivable from accuracy alone. Critics (e.g., evidentialists) argue that without immodesty, accuracy dominance cannot ground unique obligations. Worse, calibrationists might reject immodesty as question-begging.  

  Finally, calibrationism exposes accuracy-first’s *evidential gap*. Accuracy alone cannot explain why we should proportion belief to evidence—a point calibrationists weaponise. While accuracy-firsters argue that conditionalisation *promotes* accuracy, this requires auxiliary assumptions (e.g., the calibration theorem). The core tension remains: if an agent’s credences are accurate but ignore evidence (e.g., true beliefs via luck), are they rational? Accuracy-first struggles to say "no" without immodesty or external norms.  

  In sum, calibrationism rightly notes accuracy’s idealisation and the importance of reliability. Yet its collapse under triviality, impropriety, and self-reference shows it cannot be fundamental. Accuracy-first’s dominance response is robust, but its reliance on immodesty remains the programme’s Achilles’ heel.  

  ---

  **Marking Scheme (30 marks total):**  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Mistake (costs marks if missed/misstated)**                          |  
  |------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------|  
  | **1. Calibration is trivially satisfied by the base-rate (no-information) function** | 5        | Failing to note that base-rate assignments achieve calibration effortlessly.  |  
  | **2. Calibration is not strictly proper (agents can game it)**                      | 5        | Treating calibration as a proper scoring rule or missing strategic incentives.|  
  | **3. Calibration trades off with refinement (discrimination)**                      | 5        | Conflating reliability with refinement or omitting the trade-off.             |  
  | **4. Self-referential cases break calibration universally**                         | 5        | Missing the example or misapplying it to accuracy instead.                   |  
  | **5. Accuracy-first avoids omniscience via dominance (not maximisation)**           | 5        | Misreading dominance as requiring maximisation or omitting non-dominance.     |  
  | **6. Immodesty is accuracy-first’s vulnerable premise**                             | 5        | Assuming immodesty is uncontroversial or not identifying it as the weak link.|  

  *Note:* Marks are awarded for clarity, structure, and technical precision. Overlooking the evidentialist worry (accuracy vs. evidence) or misrepresenting calibrationism’s arguments deducts up to 2 marks per instance.  

  ---  
  **British English Compliance:**  
  - "credence" (not "creedence"), "calibration" (not "calibration"), "programme" (not "program"), "maximisation" (not "maximization"), "modelled" (not "modeled").  
  **Rationale:**  
  The question forces critical engagement by pitting calibrationism against accuracy-first, demanding analysis of both technical properties (propriety, dominance) and normative foundations (immodesty, evidentialism). The marking scheme rewards depth on core tensions, penalising superficial treatments.
