prompt: |-
  I read the rationalist blogs and forums fairly obsessively, and I've been circling a specific worry about coherent extrapolated volition that I'd like to turn into a proposal for a funded six-month project. The standard framing presents CEV as a single limit: take a person's present preferences and idealize them along two axes at once — giving them more true information about the world, and making their preferences more internally coherent — then ask what they would converge on. My half-formed suspicion is that those two idealizations do not commute. Idealize for information first and then impose coherence, and you may converge somewhere different from idealizing for coherence first and then adding information; if so, the word coherent in the name is doing path-dependent work that the slogan conceals, and the appeal to an idealized endpoint loses some of its claim to be the person's own will rather than an artifact of the order in which we tidy them up. Write me the proposal: state the question so that it has a determinate answer, say why the usual defenses of CEV leave this order-of-idealization issue open rather than settled, describe the method — what exactly I would do over six months, and whether the disagreement is formal, conceptual, or both — explain what a result would look like and what would count as the project failing, and give an honest assessment of scope for the time available. Skip the bibliography; I'll add references myself.
reasoning: |-
  We are writing a research proposal to investigate whether the two idealization axes in Coherent Extrapolated Volition (CEV) — (1) giving more true information and (2) making preferences more internally coherent — commute. The worry is that the order in which these operations are applied might lead to different outcomes, which would undermine CEV's claim to capture a person's "own will."

  **Proposal: The Order of Idealization in Coherent Extrapolated Volition**

  **1. Research Question:**
     - Does the process of idealizing an agent's preferences by first increasing information and then imposing coherence yield the same outcome as first imposing coherence and then increasing information? In other words, is the CEV limit path-independent with respect to the order of applying these two idealizations?

  **2. Background and Why the Issue is Open:**
     - The standard CEV framework (as described by Yudkowsky and others) suggests a simultaneous convergence along both axes. However, the mathematical and philosophical underpinnings often treat the two idealizations as if they are commutative without explicit proof. Defenses of CEV typically rely on intuitions about reflective equilibrium or convergent instrumental goals, but these do not formally address the commutativity of the two operations. Moreover, the literature does not rigorously model the two idealization steps as distinct operations that might be applied in sequence. Therefore, the possibility of non-commutativity remains an open theoretical gap.

  **3. Method:**
     - We will approach the problem both formally and conceptually.

     - **Formal Approach (Months 1-4):**
       - We will construct simple formal models of preference evolution under the two operations. We will model:
         - An agent's preferences as a utility function or a preference ordering over a state space.
         - The operation of "adding information" as Bayesian updating of beliefs (which may lead to updates in preferences if preferences are state-dependent) or as a transition to a more informed preference structure (e.g., by removing options that are dominated under the new information).
         - The operation of "imposing coherence" as a process that removes internal inconsistencies (e.g., intransitivities, violations of independence axioms) by moving to the nearest coherent preference structure (using a suitable metric, such as minimal change in preferences).

       - We will then define two paths:
         - Path A: Apply information update then coherence.
         - Path B: Apply coherence then information update.

       - We will test for commutativity in these models by:
         - Example-based: Building specific examples (with finite state spaces and simple preference structures) and simulating the two paths.
         - General: Attempting to derive conditions under which the operations commute (e.g., if the information update does not introduce new inconsistencies, or if the coherence operation is linear and commutes with Bayesian updates).

       - We will also consider existing models of preference change (e.g., in decision theory, belief revision, and value learning) to see if they have addressed similar issues.

     - **Conceptual Analysis (Months 5-6):**
       - We will analyze the philosophical implications of non-commutativity (if found) for CEV. We will consider:
         - Whether one order of operations is more justifiable than the other (e.g., because humans naturally update beliefs before adjusting coherence, or vice versa).
         - The extent to which the CEV concept can be salvaged if non-commutativity holds (e.g., by choosing a particular path as the "right" one, or by defining the CEV as a set of possible endpoints depending on the path).

       - We will also consider the implications for AI alignment: if non-commutativity exists, then the CEV as a single convergence point might not be well-defined, and alternative approaches might be needed.

  **4. Expected Results and Interpretation:**
     - **Possible Results:**
       - **Commutativity holds:** We find that in all or most reasonable models, the two orders converge to the same outcome. This would support the standard CEV narrative and might be due to the structure of the coherence operation (e.g., if coherence is defined as a fixed point that is invariant under information updates) or the nature of the information update (e.g., if it only removes options and does not create new inconsistencies).
       - **Non-commutativity:** We find at least one example where the two orders lead to different outcomes. This would challenge the idea of a unique CEV endpoint and require rethinking the concept. We would then characterize the conditions under which non-commutativity arises and its prevalence.

     - **What Counts as Failure?**
       - The project fails if we cannot make progress due to insurmountable formal challenges (e.g., if we cannot define a satisfactory model of the operations) or if the problem turns out to be ill-posed (e.g., if the operations cannot be meaningfully separated). However, even in failure, we would document the challenges and provide a roadmap for future work.

  **5. Scope and Timeline:**
     - **Timeline:**
       - Month 1: Literature review (focused on formal models of preference change and coherence) and initial model design.
       - Months 2-3: Build and test examples for non-commutativity in simple models.
       - Month 4: Attempt to derive general conditions for commutativity.
       - Month 5: Conceptual analysis of implications and possible adjustments to CEV.
       - Month 6: Writing up results and preparing a final report.

     - **Honest Assessment:**
       - The six-month timeframe is tight for a comprehensive answer, but it is feasible to make significant progress on the question by focusing on simple, illustrative models. We expect to produce at least a set of examples (whether commutative or not) and a conceptual framework for thinking about the problem. However, a full treatment of the space of possible preference representations and idealization operators would require more time. We will prioritize clarity and rigor in the examples and aim to provide a foundation for future work.

  **6. Conclusion:**
     - This project addresses a foundational concern in the CEV framework that has been overlooked in the literature. By formally and conceptually investigating the commutativity of the two idealization steps, we aim to either strengthen the foundations of CEV or reveal a critical flaw that must be addressed. The results will be valuable for the alignment community and for the broader field of decision theory.

  ---
  **Note:** This proposal intentionally avoids technical details of the formal models to keep it accessible. In the actual work, we will draw from decision theory, belief revision, and formal epistemology.
answer: |-
  ### Research Proposal: Commutativity of Idealization Operations in Coherent Extrapolated Volition (CEV)  

  #### 1. Core Question  
  Does the order of applying *information enrichment* (IE) and *coherence enforcement* (CE) to an agent’s preferences alter the resulting endpoint of Coherent Extrapolated Volition? Specifically:  
  - **Path A (IE → CE)**: First fully inform the agent (eliminating false beliefs), then enforce coherence (e.g., resolve inconsistencies, satisfy decision-theoretic axioms).  
  - **Path B (CE → IE)**: First enforce coherence on the agent’s *current* preferences, then enrich with complete information.  
  **Determinant**: The project succeeds if it rigorously proves equivalence (commutativity) or constructs a counterexample (non-commutativity) under defined constraints.  

  #### 2. Why Standard CEV Defenses Leave This Open  
  - **Simultaneity Assumption**: CEV literature (e.g., Yudkowsky, 2004) treats IE and CE as concurrent processes converging toward a single limit. This sidesteps sequencing by assuming mutual reinforcement (e.g., "more information reveals inconsistencies, coherence guides information-seeking"). Yet no proof shows the limit is order-invariant.  
  - **Path-Dependence Blind Spot**: Defenses appeal to reflective equilibrium (Rawls) or ideal advisor theories (Smith), but these implicitly assume the path to equilibrium is unique. Real-world preference formation is often order-sensitive (e.g., priming effects in psychology), undermining this assumption.  
  - **Formal Vagueness**: CEV lacks a canonical mathematical model. Descriptions are verbal or metaphorical (e.g., "extrapolated wishes"), leaving IE and CE underspecified. Without explicit operators, commutativity cannot be tested.  

  #### 3. Method: Formal and Conceptual Analysis  
  **Phase 1: Formalization (Months 1–3)**  
  - **Model Preferences**: Represent an agent’s preferences as:  
    - A utility function \(U(s | B)\) over states \(s\), conditioned on belief set \(B\).  
    - A preference relation \(\succcurlyeq_B\) (possibly incomplete/intransitive).  
  - **Define IE and CE Operators**:  
    - \( \text{IE}(U, B) \rightarrow U' \): Update \(B\) to ground-truth beliefs \(B^*\), recomputing \(U\) via Bayesian conditioning or minimal divergence (e.g., maximizing entropy).  
    - \( \text{CE}(U) \rightarrow U_{\text{coherent}} \): Project \(U\) to the "nearest" coherent utility function (e.g., minimizing Euclidean distance to the set satisfying transitivity, independence, etc.).  
  - **Test for Commutativity**: For diverse agents (e.g., humans with time-inconsistent or morally conflicting preferences), compute:  
    - Path A: \(\text{CE}(\text{IE}(U, B))\)  
    - Path B: \(\text{IE}(\text{CE}(U), B)\)  
    Compare outputs. Use dynamic programming for small state spaces (e.g., 10 states) to exhaustively check equivalence.  

  **Phase 2: Conceptual Grounding (Months 4–5)**  
  - **Normative Analysis**: If formal non-commutativity arises, evaluate which path better reflects "volition":  
    - IE → CE mirrors *discovery* (e.g., "learn facts, then resolve conflicts").  
    - CE → CE mirrors *purification* (e.g., "fix reasoning errors, then update beliefs").  
  - **Edge Cases**: Construct thought experiments (e.g., an agent with incoherent beliefs about AI risk) to stress-test intuitions.  

  **Phase 3: Synthesis (Month 6)**  
  - Derive conditions for commutativity (e.g., if CE is linear or IE preserves coherence).  
  - Publish counterexamples or proofs, with implications for CEV’s viability.  

  #### 4. Expected Results and Failure Modes  
  - **Success**:  
    - **Proof of Commutativity**: Show equivalence under general assumptions (e.g., continuous preferences, convex coherence constraints).  
    - **Counterexample**: Identify an agent \(U_0\) and belief set \(B_0\) where Path A ≠ Path B (e.g., due to non-convexity in CE or belief-dependent utilities).  
  - **Project Failure**:  
    - **Formal Undecidability**: Models are too underspecified to compare paths (e.g., no consensus on "nearest coherent function").  
    - **Triviality**: Commutativity holds universally in simple models but breaks only in contrived cases, offering no insight.  
    - **Conceptual Collapse**: "Coherence" or "information" proves inseparable, making sequencing nonsensical.  

  #### 5. Scope Assessment  
  - **Achievable in 6 Months**:  
    - Construct toy models (e.g., 3–5 interdependent preferences) and identify at least one non-commutative case *or* prove restricted commutativity.  
    - Deliver a conceptual framework for evaluating order-dependence in CEV.  
  - **Out of Scope**:  
    - A full taxonomy of preference types (e.g., lexical, hyperbolic).  
    - Resolving whether CEV *should* use one path—this is normative, not investigative.  
    - Scaling to complex agents (requires ML simulations beyond 6 months).  
  - **Risks**:  
    - **Time**: Formalization may stall if operator definitions are contested (mitigation: use simplest viable definitions from decision theory).  
    - **Ambiguity**: "True information" assumes a fixed ontology, which may beg questions (mitigation: focus on belief updates with shared state spaces).  

  #### 6. Conclusion  
  This project addresses a critical gap in CEV’s foundations: the unexamined assumption that information and coherence idealizations commute. By formalizing these operations and testing their sequence-dependence, we determine whether CEV’s "extrapolated volition" is uniquely defined or path-contingent—a prerequisite for trusting CEV as an alignment objective. Success either fortifies CEV or forces a reevaluation of its coherence-centric narrative.  

  ---  
  **References**: *Omitted per request; key works by Yudkowsky, Soares, and decision theory (e.g., Savage) will be cited.*
