prompt: |-
  Hey, I'm a third-year PhD student in political theory working on formal stuff about group judgment, and I've been circling a pattern for months without being able to name it. Figured I'd just describe it and see if it has a name, because right now I suspect it's three or four things I already know wearing a trenchcoat.

  Here's the shape of it. You've got a body that decides by majority rule, and you want to know how reliable the body is. Condorcet-ish reasoning: if each member is better than a coin flip and their errors aren't correlated, the majority gets more reliable as you add members. Fine. What I keep noticing is that the group's track record can't tell you which of those worlds you're in. Say a seven-person committee is right about 80% of the time. That's consistent with each member being right roughly 65% of the time with errors more or less independent of each other — in which case the committee is genuinely aggregating information, and a bigger committee would be better. It's also consistent with every member being right 80% of the time and making exactly the same mistakes — in which case the "committee" is one person with six echoes, and adding members does nothing at all. Same observable number, opposite practical advice. Unless you can see the individual votes alongside ground truth case by case (and in the settings I care about you usually cant), the group's hit rate is all you get, and it's compatible with both.

  I see versions of it everywhere. A forecasting team where all five analysts are downstream of the same data pipeline. A hiring committee that all read the same dossier first and then voted "independently." And the move that really bugs me is when someone says: it's a theorem, therefore the institution is justified — when the input the theorem actually needs, namely how correlated the errors are, is precisely the input the institution can't measure. Worse, at some point the premise that members are better than chance seems to get supported by pointing out that they agree with each other, which is the thing the theorem was supposed to underwrite in the first place.

  So: does this have a name? I dont think it's just "the independence assumption" — that's the thing being assumed, not the phenomenon of it being uncheckable. It smells like identification or observational equivalence from econometrics, but those are about describing data, and what I'm describing is a normative argument that quietly eats its own premise. It's also near the problem of the criterion and epistemic circularity, but those feel broader. You're a philosopher of social science who actually knows the formal aggregation literature — start by brainstorming the candidates, then tell me which one fits and where the others come apart from it, and if nothing fits, coin a term and give me its definition, its edges, and a couple of cases that fall outside it. I want the carving, not a label. No need to point me at papers.
reasoning: |-
  Okay, let me start by unpacking what this PhD student is asking. They're working on formal models of group judgment in political theory and have noticed a recurring issue. The problem is that when a group makes decisions by majority rule, the group's reliability (like an 80% hit rate) can stem from two very different scenarios. One is where individual members are moderately reliable and their errors are independent, leading to real information aggregation. The other is where everyone has high individual reliability but their errors are perfectly correlated, making the group no better than a single member. The key point is that from the outside, without seeing individual votes and ground truths, you can't distinguish these cases. 

  The student mentions this creates a problem for justifying institutions via theorems like Condorcet’s, because those theorems rely on assumptions (independence, competence above chance) that can't be verified with the available data. They also point out a circularity where the agreement among members is used to support their competence, which is what the theorem was supposed to explain in the first place.

  Now, I need to figure out if this has a name. The student has already considered terms like "independence assumption" but feels that's not quite it—it's more about the uncheckability of that assumption. They mention econometric concepts like identification or observational equivalence, but those are about data description, whereas here the issue is a normative argument that undermines itself. Epistemic circularity is related but broader.

  Let me brainstorm possible terms. In social epistemology, there's the "discursive dilemma" or "doctrinal paradox," but that's about logical inconsistency in judgment aggregation, not reliability under hidden correlations. "Common-mode failure" from engineering captures correlated errors but doesn’t address the epistemic circularity. "The problem of unseen error correlations" is descriptive but not a recognized term.

  What about "aggregation under unobservable dependence"? That emphasizes the core issue: dependence exists but can't be measured. However, does it capture the circular justification? The student highlighted that institutions use the group's reliability to justify competence, which then justifies the group's reliability—a self-reinforcing loop. That reminds me of "bootstrapping" in epistemology, where you use a method to justify itself. Combining these, maybe "epistemic bootstrapping under unobservable dependence" (EBUD). 

  EBUD would define the situation where a group's success rate is used to infer individual competence, which in turn is used to validate the group's decision-making, all while the critical factor—error correlation—remains hidden. This creates a self-justifying loop that masks whether the group is genuinely aggregating diverse inputs or just echoing a single source. 

  Cases outside EBUD would be when individual judgments and ground truths are observable, allowing direct measurement of error correlations, or when the decision context inherently requires independence (like physical sensors). Cases that fit are hiring committees relying on the same dossier or forecasting teams using the same biased data pipeline.

  This term carves the problem at its joints: the unobservability of dependence, the circular argument for institutional legitimacy, and the practical consequences for reform (like adding members). It separates from mere observational equivalence by focusing on the normative misuse of theorems and the self-defeating justification. The student wanted the carving, not just a label, so this should address their need by defining the boundaries and implications clearly.
answer: |-
  This is a sharp observation that cuts to the heart of epistemic justification for collective bodies. It's not *just* about hidden variables or observational equivalence—it's about a specific **self-defeating circularity in institutional justification** that arises precisely from the gap between observable outputs and the structural assumptions of aggregation theorems. The closest existing concepts touch parts of it, but none fully capture the normative trap you're describing. Let's carve it:

  **Existing Concepts & Why They Don't Quite Fit:**
  1.  **Observational Equivalence (Econometrics):** Yes, the *data* (group hit rate) is observationally equivalent under different structural models (independent competent voters vs. perfectly correlated competent voters). But this is purely descriptive. Your critique is **normative/epistemic**: it targets the *argument* that uses the group's performance *to justify the institution's design* (e.g., "our committee is reliable, therefore adding members improves it"), when that very performance is consistent with the design *not* fulfilling the theorem's prerequisites.
  2.  **Epistemic Circularity / Problem of the Criterion:** While related (using the group's output to justify the competence/independence needed to trust the group's output), these are broader. They focus on regress/justification foundations generally. Your case is **institutionally specific**: it leverages the *formal structure* of aggregation theorems (Condorcet, etc.) and the *practical limitations* of observing inputs (individual judgments + ground truth) within the institution itself.
  3.  **Common-Mode Failure / Correlated Error (Reliability Eng./Stats):** Captures the *phenomenon* of non-independence causing systemic error. But it doesn't capture the **epistemic opacity** or the **justificatory circularity** where the group's success rate is used to *validate the system* despite being consistent with this failure mode being dominant.
  4.  **The Independence Assumption (Social Choice):** Identifies the *critical premise*, but not the **problem of its practical unverifiability within the institution** nor the **argumentative sleight of hand** where group performance is used to infer competence, which is then used (with assumed independence) to justify the group's performance/design.

  **The Core Problem: The Self-Justification Trap**
  The essence is this: **An institution derives its claimed epistemic legitimacy (and design prescriptions like size) from a theorem requiring unobservable inputs (individual competence & error independence). It then uses its *own* observable output (group reliability) as the primary evidence to support the existence of those very unobservable inputs, creating a closed, self-reinforcing loop that masks its potential dysfunction.**

  **Proposed Term: Epistemic Bootstrapping Under Unobservable Dependence (EBUD)**

  *   **Definition:** The justificatory practice whereby a collective decision-making body appeals to its aggregate reliability as evidence for the fulfillment of the competence and independence assumptions of an aggregation theorem (e.g., Condorcet), while the structural dependence of member judgments renders both the assumptions and the theorem's normative implications (e.g., benefits of adding members) empirically untestable and potentially illusory using only institutional outputs. This creates a self-validating epistemic loop that obscures whether the body genuinely aggregates diverse information or merely replicates dominant error sources.
  *   **Key Components of the Carving:**
      1.  **Formal Foundation:** Relies on a theorem linking individual inputs (competence >0.5, independence) to desirable group properties (increasing reliability with size).
      2.  **Unobservable Inputs:** Competence and error correlation cannot be directly measured *within the institutional context* due to lack of access to individual judgments and/or ground truth per case.
      3.  **Observable Output:** Group reliability/success rate is measurable.
      4.  **Observational Equivalence:** The same group reliability is consistent with both the ideal scenario (independence + moderate competence) and dysfunctional scenarios (high competence + high error correlation).
      5.  **Justificatory Circularity:** The observable output (4) is used as the primary evidence to infer the existence of the unobservable inputs (2) required by the theorem (1), which in turn justifies the institution's design/reliability.
      6.  **Masked Dysfunction:** The circularity (5) prevents diagnosis of the actual structural dependence (high error correlation), making reforms based on the theorem (e.g., adding members) potentially ineffective or counterproductive.
      7.  **Premise Consumption:** Competence is often inferred from agreement (a product of the aggregated output), which itself depends on the very assumptions (competence + independence) supposedly being validated.

  *   **Edges & Cases:**
      *   **Inside EBUD:** Your committee examples, forecasting teams sharing a biased pipeline, courts relying solely on the same flawed forensic report, "independent" reviewers using identical evaluation rubrics with inherent biases. *Why?* Output reliability is measurable; inputs/dependence are opaque; reliability is used to justify competence/design.
      *   **Outside EBUD:**
          *   **Observable Inputs:** A prediction market where individual bets and final resolution (ground truth) are public. Dependence can be estimated; competence can be assessed; theorems apply transparently.
          *   **No Formal Justification Claim:** A group that simply asserts its reliability based on tradition or authority without invoking Condorcet-style theorems. The circularity relies on the *theorem* as the justification engine.
          *   **Inherent Independence:** Juries physically isolated during deliberation (though pre-deliberation common information can still create dependence!). The design *forces* at least some independence, making the assumption partially testable/violable.
          *   **Unmasked Failure:** A committee where individual votes are recorded and later checked against ground truth, revealing high error correlation despite good group performance. EBUD depends on the dependence *staying* unobservable within the justificatory process.

  *   **Why "Bootstrapping"?** It perfectly captures the self-referential, self-supporting nature of the justification loop. The institution tries to "pull itself up by its own bootstraps" epistemically, using its output as the sole evidence for the conditions that make its output trustworthy.

  **EBUD vs. The Candidates:**
  *   **Observational Equivalence:** EBUD *uses* OE but focuses on its *normative misuse* within institutional justification.
  *   **Epistemic Circularity:** EBUD is a specific *institutional instantiation* leveraging formal aggregation theory and input opacity.
  *   **Common-Mode Failure:** EBUD *incorporates* CMF as a possible hidden cause but centers the *epistemic trap* it creates for justification.
  *   **Independence Assumption:** EBUD highlights the *consequence* of its *practical unverifiability within the institutional feedback loop*.

  EBUD names the trenchcoat. It’s the institutionalized epistemic blind spot created by the combination of a powerful formal theorem, the practical invisibility of its critical assumptions within the system, and the consequent self-justifying use of the system's output to validate those assumptions. It explains why the "it's a theorem!" move is often hollow in practice: the theorem requires what the institution cannot see, and uses what it *can* see in a way that masks whether the prerequisites are truly met.
