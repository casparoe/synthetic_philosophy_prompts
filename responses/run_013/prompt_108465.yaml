prompt: |-
  I am the research-and-evaluation lead at a mid-sized state education agency, and roughly once a week something lands on my desk that turns on a heritability figure. A district wants to introduce between-class ability grouping and argues that reading difficulty is mostly heritable, so the classroom can only do so much; a legislator's aide forwards an op-ed claiming that educational attainment is substantially heritable and that this should temper our expectations for early-childhood programs; a vendor argues the opposite way, that because some behavioral trait is only partly heritable, its product must be the missing environmental lever; a superintendent preparing testimony wants to know whether she can safely tell a committee that genes matter but are not destiny. I have to give the director of research a recommendation inside a day, my own training is in economics and program evaluation rather than genetics, and the people I am advising have less statistical background than I do. My staff and I have been making one distinction by hand and I would like it made rigorous: we have taken to calling a heritability claim "portable" or "non-portable" according to whether the number would still describe the population we are being asked to act on once that population's environment changed in the way the proposal would change it — and we have found that we cannot say consistently when a claim is portable, or what to do when it is not.

  Please write the procedure we should run instead. I want a sequence of questions asked in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the points at which it must hand the decision to a person because the question is one of values rather than of statistics. It has to work when the claimant has no numbers at all, which will be most of the time, and it has to be honest about which of its steps are judgment calls wearing the costume of arithmetic. The conceptual content should be whatever the science actually licenses about heritability — what the statistic is and is not a claim about, why the same trait can carry different heritabilities in different populations and at different moments, and how a trait's heritability relates to the heritability of a response to an intervention, if at all. It must not depend on any particular study, author, or reading, since we will not be able to look anything up while using it, and it should fit on a page for staff with a social-science master's degree.

  Then run it on three cases: the ability-grouping proposal; the parent-training nonprofit that wants our endorsement on the strength of a moderate heritability estimate; and a case where the procedure returns an answer I will not like — some claim or program we have been inclined to support, which the procedure says we are supporting for bad reasons. Finish by telling me what the procedure cannot do: the questions it will leave unsettled, the claims it will wave through that a geneticist would want to stop, and the ones it will stop that are in fact harmless.
reasoning: |-
  We are designing a procedure to evaluate heritability claims for portability, i.e., whether the heritability estimate would remain valid in the population after an environmental change (as proposed by some intervention or policy). The procedure must be step-by-step, with clear stopping points and handoffs for value judgments. It must work even without specific numbers and be based on the science of heritability.

  Key concepts:
  1. Heritability (h²) is the proportion of phenotypic variance in a trait in a population that is due to genetic variation. It is population-specific and environment-specific. It can change if the environment changes.
  2. High heritability does not mean that the trait is unchangeable by the environment. It means that in the current environment, genetic differences account for a large portion of the variation. If the environment becomes more uniform, heritability might drop; if the environment becomes more varied, it might rise.
  3. The heritability of a trait does not directly tell us about the heritability of the response to an intervention (which is a different trait). The response to an intervention may have its own heritability.

  Procedure:

  Step 1: Identify the heritability claim.
     - Question: What is the heritability estimate (if any) and for what trait and population?
     - Sufficient answer: The trait (e.g., reading ability) and the population (e.g., 3rd graders in the US in 2010). If no number is given, note the claim (e.g., "mostly heritable").
     - If no trait or population is specified, stop: the claim is too vague to evaluate. Return "non-portable" and note: "The claim does not specify the trait or population. Without this, we cannot assess portability."

  Step 2: Identify the proposed environmental change.
     - Question: What environmental change is being proposed (or assumed) that would alter the population's environment?
     - Sufficient answer: A description of the intervention (e.g., ability grouping, early-childhood program, parent training).
     - If no change is proposed (i.e., the claim is about the current state only), stop: the claim is about the current environment and does not require portability. Return "portable in the current environment" but note: "This heritability estimate applies only to the current environment. If the environment changes, the estimate may change."

  Step 3: Assess the similarity of the new environment to the old.
     - Question: How similar is the proposed environment to the environment in which the heritability was estimated?
     - Considerations: 
          a) If the new environment is very similar (e.g., same type of school, same socioeconomic conditions, same era), then the heritability might be portable.
          b) If the new environment is different in ways that might affect the expression of genetic variation (e.g., introducing a new teaching method, changing resource allocation), then heritability might change.
     - Judgment call: We must consider the environmental factors that influence the trait. If the change is in a factor that was previously uniform (so not contributing to variance) and now becomes varied (or vice versa), that could change the heritability.
     - Sufficient answer: A qualitative assessment (high, medium, low similarity). If the similarity is high, proceed. If low, then the heritability is likely non-portable. If medium, we need more analysis.

  Step 4: Consider the nature of the environmental change and its potential effect on variance.
     - Question: How might the proposed change alter the distribution of the trait and the relative importance of genetic and environmental factors?
     - Considerations:
          a) If the change makes the environment more uniform (e.g., by providing the same high-quality instruction to all), then environmental variance might decrease, which could increase heritability (if genetic variance remains constant) because h² = Vg / (Vg + Ve). However, if the intervention reduces environmental variance, then the same genetic differences might account for a larger proportion of the remaining variance. But note: if the intervention is so effective that it lifts everyone equally, then the total variance might decrease and heritability might remain the same or even change in unpredictable ways.
          b) If the change introduces new environmental variation (e.g., ability grouping might create more variation in classroom environments), then environmental variance might increase, which could decrease heritability.
          c) The intervention might interact with genetic factors (GxE interaction). For example, an educational intervention might be more effective for children with certain genetic variants. This would change the heritability.
     - Judgment call: Without data, we are making educated guesses. But we can note that:
          - If the intervention is known to have uniform effects (i.e., it benefits everyone equally), then it might reduce environmental variance without affecting genetic variance, leading to higher heritability.
          - If the intervention has differential effects (i.e., it benefits some more than others) and those differences are correlated with genetic differences (GxE), then heritability might change in complex ways.

  Step 5: Consider the time frame and stability.
     - Question: Is the heritability estimate from a similar age and developmental stage as the target population? And will the intervention affect the trait at the same age?
     - Note: Heritability can change over the lifespan. For example, heritability of IQ tends to increase with age.

  Step 6: Decision points:
     - If at any step the claim lacks essential information (trait, population, environmental change) → Stop: non-portable.
     - If the environmental change is minimal and the environment remains similar → Portable.
     - If the environmental change is substantial and likely to alter the variance components (especially by introducing new environmental variation or by interacting with genes) → Non-portable.
     - If the environmental change is substantial but in a way that makes the environment more uniform (and we have no reason to expect GxE) → Then heritability might increase. But note: even if it increases, the absolute genetic variation might remain the same, so the trait might still be modifiable by the environment? However, the claim about the proportion being high might still hold. But this is tricky.

  But note: Our goal is to see if the original heritability estimate still holds. So if the environment changes, the estimate is likely not portable.

  However, the key is: the original heritability estimate was for environment A. We are moving to environment B. Without a new study in environment B, we don't know h² in B. Therefore, unless we have strong reasons to believe that the change is negligible, we should be cautious.

  Therefore, the procedure:

  1. Identify the claim (trait, population, heritability number or descriptor). If missing, stop: non-portable.
  2. Identify the proposed environmental change. If none, then portable only for the current environment (but note that the claim is about the current state).
  3. Is the proposed change in the environment substantial? (Judgment call: if it's a major policy change, then yes.) If not, portable. If yes, then:
  4. Could the change alter the environmental variance or the genetic variance? (Note: genetic variance is typically stable, but the expression might change.) 
     - If the change introduces new environmental factors that were not present or were constant in the original environment, then it will likely change the heritability → non-portable.
     - If the change removes environmental variation (e.g., by making the environment more equal), then heritability might increase → non-portable (because the original estimate is no longer valid).
  5. Also, consider GxE: if there is reason to believe the intervention might interact with genetic factors, then non-portable.

  In essence, any substantial environmental change makes the heritability non-portable because heritability is environment-dependent. The only exception is if we have evidence that the change does not alter the relative contributions of genes and environment. But without such evidence, we assume non-portability.

  Therefore, the procedure:

  Step 1: Claim identification.
     - Trait: [Specify]
     - Population: [Specify]
     - Heritability estimate: [If provided, note; if not, note the descriptor]
     - If trait or population is missing → Stop: non-portable. Reason: insufficient specification.

  Step 2: Proposed change.
     - Describe the environmental change that the proposal would bring about.
     - If no change is proposed (i.e., the claim is about the current state) → Stop: portable only for the current environment. Note: "This heritability estimate is for the current environment. If the environment changes, it may not hold."

  Step 3: Assess the magnitude of the environmental change relative to the original environment.
     - If the change is trivial (e.g., minor administrative change) → Portable.
     - If the change is substantial → Then we must assume non-portability unless there is evidence to the contrary. But note: we are not geneticists and cannot conduct new studies. Therefore, without strong evidence (which we are unlikely to have) that the heritability is invariant to this change, we must say non-portable.

  But how to get evidence? We don't have time. Therefore:

     - If the change is substantial, then the claim is non-portable.

  But what is substantial? Judgment call: any change that could plausibly affect the expression of the trait. For example:
     - Changing the way reading is taught.
     - Changing the family environment (e.g., through parent training).
     - Changing the classroom composition (ability grouping).

  In practice, almost any policy change is substantial.

  Therefore, the procedure:

  1. Claim: Trait, population, heritability (if any). Missing? → Non-portable.
  2. Change: What is changing? Not changing (current state)? → Portable for current environment only (but note the limitation).
  3. Is the proposed change substantial? 
     - If no → Portable.
     - If yes → Non-portable.

  But this is too simplistic. What about the vendor's argument that because heritability is less than 1, there is room for environmental intervention? That is a valid point in general, but the heritability estimate itself is not being used portably? Actually, the vendor is making a different claim.

  Therefore, we must also consider the context of the claim.

  But note: our procedure is about portability of the heritability estimate. The vendor might say: "heritability is 0.6, so 40% is environmental, so our product can work." We want to know: is the 40% figure portable? The same as above: if the product changes the environment, then the heritability in the new environment might be different. The vendor's argument is that because there is environmental variance, there is room to change. That is always true if heritability is less than 1. But the size of the environmental component in the original study doesn't tell us how much we can change the trait with an intervention. It only tells us about the current sources of variation.

  Therefore, we might need to add a step for claims about intervention potential.

  But the original question is about portability of the heritability figure. For the vendor, they are using the heritability to argue that there is an environmental lever. The existence of an environmental lever is true by definition if heritability is less than 1. But the magnitude of the lever? That is not given by heritability. The vendor might be implying that because the environmental component is 40%, they can change the trait by an amount related to that 40%. But that is not correct. The environmental component of variance does not directly translate into the potential for change. For example, if the environmental variance is due to factors we cannot change (like past trauma), then we might not be able to affect it.

  Therefore, we must separate two issues:
     a) Portability of the heritability estimate.
     b) The validity of using the heritability estimate to argue about the potential effectiveness of an intervention.

  For (b), we can say:

     - A heritability less than 1 implies that there is environmental influence, so in principle an intervention could work.
     - But the heritability estimate does not tell us how much the trait can be changed by a particular intervention. That requires intervention studies.

  Therefore, we can add:

  Step 4: For claims about the potential for environmental intervention (like the vendor's claim):
     - If the heritability is less than 1, then it is true that there is environmental influence. This is always portable? Because if in the original population there was environmental influence, then in the new population (even after change) there might still be environmental influence? But note: if the intervention makes the environment perfectly uniform, then the environmental variance drops to zero and heritability becomes 1. Then the vendor's claim would be false? But the vendor is claiming that because in the current environment there is environmental variance, their product can work. However, their product might not address the relevant environmental factors. Therefore, we cannot use heritability to predict the effectiveness of a specific intervention.

  So, the procedure for the vendor's type of claim:

     - The claim that because heritability is less than 1, there is room for environmental influence is generally true (and portable) because if it's less than 1 in one environment, then even if the environment changes, as long as we can introduce new environmental variation, we can have an effect. But note: the goal of an intervention is often to change the mean, not the variance. Heritability is about variance, not mean.

  Therefore, we need to be cautious.

  Given time, we design the procedure to focus on the portability of the heritability figure. For the vendor's argument, we note that the heritability figure does not directly support the effectiveness of their product.

  Revised procedure:

  Procedure for Evaluating Heritability Claims for Portability:

  1. **Claim Specification**:
     - What trait is being discussed? (e.g., reading ability)
     - What population? (e.g., US elementary school children)
     - What heritability estimate is given? (e.g., 0.7, or "highly heritable")
     - *If the trait or population is not specified, stop and mark as "Non-portable" (reason: insufficiently specified).*

  2. **Environmental Context of Claim**:
     - What environment is the heritability estimate from? (e.g., typical US classrooms in the 2000s)
     - *If not specified, assume the current environment of the population as described.*

  3. **Proposed Environmental Change**:
     - What change to the environment is being proposed? (e.g., ability grouping, parent training, early childhood program)
     - *If no change is proposed (i.e., the claim is about the current state), then stop and mark as "Portable only in the current environment".*

  4. **Magnitude of Change**:
     - Is the proposed change substantial? (Consider: does it alter key environmental factors that influence the trait? For example, for reading ability, changes in instruction, resources, or peer groups are substantial.)
     - *If not substantial, mark as "Portable".*
     - *If substantial, proceed to step 5.*

  5. **Effect on Variance Components**:
     - Could the change alter the environmental variance? (e.g., by introducing new environmental variation or making the environment more uniform)
     - Could the change lead to gene-environment interactions (GxE)? (e.g., if the intervention affects individuals differently based on their genetics)
     - *If either answer is "yes" or "uncertain", mark as "Non-portable".*
     - *Only if there is strong evidence that the change does not affect the variance components or GxE, mark as "Portable". (Note: such evidence is rare without a new study.)*

  Additionally, for claims that use heritability to argue about the potential for environmental intervention:

     - If the claim is: "heritability is less than 1, therefore an environmental intervention can work", this is generally true and portable. But note: it does not guarantee that any particular intervention will work.
     - If the claim is: "heritability is X, so the maximum possible effect of the environment is Y", that is not valid. Heritability does not set a limit on how much the environment can change the trait.

  Now, run on three cases.

  Case 1: Ability grouping proposal
     - Claim: Reading difficulty is mostly heritable (say h²=0.8) in the current environment.
     - Proposed change: Implement between-class ability grouping.
     - Procedure:
          Step 1: Trait: reading difficulty; population: students in the district (assumed similar to typical studies); heritability: 0.8 (or "mostly").
          Step 2: Environment: current classroom setting.
          Step 3: Proposed change: ability grouping (grouping students by ability into different classes).
          Step 4: Is the change substantial? Yes, because it changes peer group and possibly instruction.
          Step 5: 
              - Environmental variance: might increase (because classes become more homogeneous within but more heterogeneous between) or change in complex ways. Also, ability grouping might create new environmental differences (e.g., higher-quality teaching in high-ability groups). 
              - GxE: possible (e.g., genetic factors might interact with the new grouping).
          → Non-portable.

  Case 2: Parent-training nonprofit
     - Claim: A behavioral trait (say, aggression) has a heritability of 0.5, so there is an environmental component of 0.5 that we can address with our parent-training program.
     - Proposed change: Implement the parent-training program.
     - Procedure for portability of heritability estimate:
          Step 1: Trait: aggression; population: children (say, preschoolers); heritability: 0.5.
          Step 2: Environment: current home environment (without the program).
          Step 3: Proposed change: parent training program.
          Step 4: Substantial? Yes, because it changes parenting practices.
          Step 5: 
              - Environmental variance: might be reduced (if the program makes parenting more uniform) or changed (if it introduces new variation, e.g., some parents implement better than others). 
              - GxE: possible (e.g., children with different genetic predispositions might respond differently to the parenting changes).
          → Non-portable.

     But note: the nonprofit is using the heritability to argue that there is an environmental lever. We can separately note:
          - The claim that because heritability is 0.5 there is environmental influence is true and portable (because it was less than 1 in the original environment, so there is room for environment to matter). However, that does not guarantee their program will work. The effectiveness of the program must be evaluated independently.

  Case 3: A case that returns an answer we won't like.
     - Suppose we support an early-childhood program that has shown positive effects in randomized trials. But someone argues that because IQ is highly heritable (say 0.8), we shouldn't expect much from the program. We run the procedure on the claim "IQ is highly heritable (0.8), so early-childhood programs cannot have large effects".
     - The claim is about the current heritability of IQ and then drawing a conclusion about the potential impact of an intervention.
     - Procedure for portability of the heritability estimate for the early-childhood program:
          Step 1: Trait: IQ; population: young children; heritability: 0.8.
          Step 2: Environment: current environment (without the program).
          Step 3: Proposed change: the early-childhood program.
          Step 4: Substantial? Yes.
          Step 5: Non-portable (because the program changes the environment, so the heritability in the new environment might be different).

     But note: the claim is not just about portability; it is using the heritability to argue against the program. We can refute that by noting:
          a) The heritability estimate is non-portable to the new environment.
          b) Even in the current environment, high heritability does not mean the trait is unchangeable. It only means that in the current environment, genetic differences account for most of the variation. But if we change the environment for everyone (e.g., provide high-quality early childhood education to all), we might shift the mean IQ upward without changing the genetic variation. The heritability might then become even higher (if environmental variance decreases) but the mean has increased.

     Therefore, the procedure flags the heritability claim as non-portable, so we cannot use the original heritability estimate to predict what will happen in the new environment. We must rely on intervention studies.

  What the procedure cannot do:
     - It cannot provide a new heritability estimate for the changed environment.
     - It cannot determine the effectiveness of an intervention; that requires experimental evidence.
     - It may be too conservative: it flags almost any substantial change as making the heritability non-portable, which is scientifically accurate but might be seen as unhelpful. However, it protects against misuse.
     - It might let through claims that are technically portable but still misleading. For example, if the environmental change is minor, the procedure says portable, but even minor changes might matter for some traits.
     - It cannot handle complex interactions without data.
     - It cannot resolve value judgments. For example, if a legislator argues that because heritability is high we should not invest in education, the procedure can say the heritability claim is non-portable if we change the environment, but the decision to invest or not is a value judgment about equity and the role of government.

  Final Procedure (condensed for a page):

  **Procedure for Evaluating the Portability of Heritability Claims**

  1. **Specify the claim**: 
     - Trait: [e.g., reading ability]
     - Population: [e.g., 3rd graders in the US]
     - Heritability estimate: [e.g., 0.7 or "high"]
     - *If trait or population is missing → Stop: "Non-portable (insufficient specification)".*

  2. **Current environment of the claim**:
     - Describe the environment in which the heritability was estimated. *If not specified, assume the current environment of the population.*

  3. **Proposed environmental change**:
     - Describe the change (e.g., new program, policy). 
     - *If no change is proposed → Stop: "Portable only in the current environment".*

  4. **Magnitude of change**:
     - Is the change substantial? (i.e., could it alter the key environmental factors influencing the trait?) 
     - *If no → "Portable".*
     - *If yes → Proceed to 5.*

  5. **Potential impact on variance and interactions**:
     - Could the change alter environmental variance? (e.g., by making the environment more uniform or more variable)
     - Could the change introduce gene-environment interactions (GxE)? 
     - *If yes or uncertain → "Non-portable".*
     - *If no (and you have strong evidence) → "Portable". (Note: "no" is rare.)*

  **Additional Notes**:
  - A heritability estimate applies to a specific population in a specific environment at a specific time. It is not a fixed property of the trait.
  - High heritability does not mean a trait is unchangeable. Environmental changes can shift the entire distribution.
  - Heritability of a trait does not predict the heritability of the response to an intervention (which is a different trait).
  - The existence of environmental influence (when heritability < 1) does not guarantee that a specific intervention will work.

  **For claims about intervention potential**:
  - If the claim is: "heritability < 1, so environment matters" → This is true and portable, but does not guarantee any particular intervention.
  - If the claim is: "heritability = h², so the maximum environmental effect is limited" → This is invalid; heritability does not set a limit.

  **Value Judgments**:
  - The procedure stops at non-portable or portable, but whether to proceed with a policy is a value judgment. For example, even if a trait is highly heritable, we might still choose to intervene for equity reasons.
answer: |-
  Below is a step-by-step procedure for evaluating heritability claims in policy contexts. It prioritizes scientific rigor while acknowledging judgment calls, works without specific numbers, and fits on one page. The procedure is based on core principles of behavioral genetics:  
  - **Heritability** (\(h^2\)) is the proportion of trait variation in a *specific population* at a *specific time* due to genetic variation. It is not a fixed property of the trait.  
  - **Environment-gene interplay**: \(h^2\) can change if environments change (e.g., if environments become more uniform, \(h^2\) often rises). High \(h^2\) does not mean a trait is unchangeable; it reflects *current* variation.  
  - **Misconceptions**: \(h^2\) does not predict: (1) the potential impact of interventions (e.g., a trait with \(h^2=0.8\) can still be greatly altered by environment); (2) individual outcomes ("genes are not destiny"); or (3) the heritability of *responses* to interventions (a separate trait).  

  **Procedure: Five Questions for Heritability Portability**  
  *Run these in order. Stop early if a "no" or "inconclusive" answer appears. Use judgments only where specified.*  

  1. **Is the claim specific about the trait, population, and environment?**  
     - *Ask:* What trait (e.g., reading skill), population (e.g., 8-year-olds in urban Michigan), and environment (e.g., current district schools) is the heritability estimate from?  
     - *Sufficient answer:* Clear definitions of all three. If missing, stop: **Non-portable**.  
     - *Science note:* \(h^2\) is meaningless without these. The same trait (e.g., IQ) can have different \(h^2\) in different groups.  

  2. **Is a policy-relevant environmental change proposed?**  
     - *Ask:* What environmental shift would the policy/program create (e.g., ability grouping, parent training)? If none, the claim is about the status quo.  
     - *Sufficient answer:* A concrete change (e.g., "smaller class sizes") or confirmation of no change.  
     - If no change is proposed: Stop. **Portable only for the current environment**—but note this does not justify inaction.  
     - *Judgment call:* "Change" includes any planned shift in resources, practices, or social structures.  

  3. **Is the proposed environment similar to the original?**  
     - *Ask:* How closely does the proposed environment match the original (in Step 1) in key factors affecting the trait (e.g., teaching quality, family resources)?  
     - *Sufficient answer:* Qualitative comparison (e.g., "similar school funding" or "different peer interactions").  
     - If environments are **highly similar**: Proceed to Step 4.  
     - If environments **differ substantially**: Stop. **Non-portable**.  
     - *Science note:* \(h^2\) is environment-dependent. For example, \(h^2\) for reading rises if all children receive high-quality instruction (environmental variance drops).  
     - *Judgment call:* "Substantial difference" = any factor that could alter trait expression (e.g., new stressors, instructional methods).  

  4. **Could the change alter environmental variance or gene-environment interactions?**  
     - *Ask:*  
       a. Might the policy reduce or increase environmental variation (e.g., by standardizing resources or introducing new inequities)?  
       b. Could genes and environment interact (G×E) differently? (e.g., Will a parenting program affect genetically at-risk children more?)  
     - *Sufficient answer:* Reasonable hypotheses (e.g., "Ability grouping may increase classroom-environment variance"). No numbers needed.  
     - If **no change to variance or G×E** is plausible: Proceed to Step 5.  
     - If **yes or uncertain**: Stop. **Non-portable**.  
     - *Science note:* Redistributing environmental resources (e.g., reallocating teachers) can reshuffle genetic and environmental variance components.  

  5. **Is the claim solely about the existence of environmental influence?**  
     - *Ask:* Is the claim using \(h^2 < 1.0\) to argue that "environment matters" (e.g., a vendor saying \(h^2=0.6\) implies their program can work)?  
     - *Sufficient answer:* Yes/no.  
     - If **yes**: **Portable**—but only for this narrow claim. \(h^2 < 1.0\) always implies *some* environmental influence in the original population.  
     - If **no**: **Hand off to human judgment**. Values now dominate (e.g., "Should we invest given uncertainty?").  
     - *Science note:* This is the only portable claim. \(h^2 < 1.0\) does not guarantee an intervention will work, nor does it predict effect size.  

  **When the Procedure Stops**  
  - **"Non-portable"**: The heritability estimate may not hold after the change. Disregard it for decision-making.  
  - **"Portable only for current environment"**: The estimate is valid now but irrelevant to policy changes.  
  - **"Portable" (Step 5)**: Only affirms that environments *can* matter—not that a specific program will help.  

  **Value Judgment Handoffs**  
  The procedure flags when science ends and values begin:  
  - Step 5 hands off if the claim exceeds "environment matters" (e.g., "high \(h^2\) means we shouldn’t fund programs").  
  - Decisions about equity, resource allocation, or ethical priorities require human deliberation.  

  ---

  **Case Applications**  

  1. **Ability-Grouping Proposal**  
     - *Claim:* "Reading difficulty is mostly heritable (\(h^2 \approx 0.8\)), so classrooms can only do so much."  
     - *Procedure:*  
       1. **Trait/population:** Reading in elementary students (assumed specific). Proceed.  
       2. **Change:** Between-class grouping (new peer/teacher interactions). Proceed.  
       3. **Similar environment?** No—grouping alters classroom dynamics. → **Non-portable**.  
     - *Recommendation:* Reject the heritability argument. Grouping may change environmental variance (e.g., teacher attention), so \(h^2\) may not hold.  

  2. **Parent-Training Nonprofit**  
     - *Claim:* "Behavioral trait \(h^2 = 0.5\), so our program (the ‘environmental lever’) must work."  
     - *Procedure:*  
       1. **Trait/population:** Child behavior (e.g., aggression) in preschoolers. Proceed.  
       2. **Change:** Parent-training program. Proceed.  
       3. **Similar environment?** No—program adds new parenting strategies. Proceed.  
       4. **Variance/G×E change?** Yes—program may reduce environmental variation or trigger G×E. → **Non-portable**.  
     - *Recommendation:* The heritability estimate is irrelevant here. The program’s efficacy requires direct evidence (e.g., RCTs).  

  3. **Case Where Procedure Contradicts Your Preference: Universal Preschool**  
     - *Your view:* Support based on evidence of benefits.  
     - *Opposing claim:* "Educational attainment \(h^2 \approx 0.7\), so preschool investments are futile."  
     - *Procedure:*  
       1. **Trait/population:** Educational attainment in low-income kids. Proceed.  
       2. **Change:** Universal preschool (new learning environment). Proceed.  
       3. **Similar environment?** No—preschool alters early learning access. Proceed.  
       4. **Variance/G×E change?** Yes—preschool may reduce environmental disparities. → **Non-portable**.  
     - *Result:* The heritability claim is invalidated, but the procedure does not endorse your preference—it only removes a bad argument against it. Values decide investment.  

  ---

  **What the Procedure Cannot Do**  
  - **False Negatives (Waves through bad claims):**  
    - If environments are deceptively similar (e.g., a program replicates a heritability study’s conditions), it may falsely label a claim portable. Genetics expertise is needed to spot subtleties.  
    - Claims like "\(h^2\) is high, so genes matter most" may pass Step 5 if framed as "environment matters" (but misuse the science).  
  - **False Positives (Stops harmless claims):**  
    - Conservative thresholds (e.g., Step 4’s "uncertain" → non-portable) may over-reject. Example: A tiny environmental tweak (e.g., rearranging desks) might be flagged.  
  - **Unsettled Questions:**  
    - Does NOT estimate intervention impacts (e.g., how much a program *can* change a trait).  
    - Does NOT address fairness (e.g., "Should we group kids if \(h^2\) is portable?").  
    - Does NOT resolve how traits develop (e.g., gene-environment correlations).  
  - **Requires Judgment:** Steps 3–4 rely on qualitative reasoning. When uncertain, default to "non-portable."  

  **Final Advice**  
  Use this to filter scientifically invalid heritability arguments. For decisions, combine with:  
  - Direct evidence (e.g., program evaluations).  
  - Values-based discussions (e.g., "Do we invest even if \(h^2\) is high?").  
  - Expert consultation when possible.
