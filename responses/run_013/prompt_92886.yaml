prompt: |-
  I've got a three-year postdoc and I get to pick the project, so I'm trying to decide how much of it to spend on underdetermination of theory by evidence. I dont want to write the hundredth paper on whether Duhemian holism sinks realism — that feels settled in the boring sense that everyone already knows everyone's move. What I'm actually drawn to: the local cases where two rival theories fit all the current data yet disagree about what the world is made of, and the further thought that maybe underdetermination isn't a relation between theory and evidence at all but between a theory and the questions we're willing to ask of it. Which open questions in this vicinity matter most now, and in what order would you work them if you were me? I care about the reasoning more than the list: which questions are upstream of which, which are tractable for one person with a taste for formal argument rather than history-of-science case studies, which look important but wouldn't change much downstream if they got answered, and what would move something up or down the ranking. And tell me which question I'm not seeing.
reasoning: |-
  Okay, let me unpack this postdoc query. The user is clearly a sharp philosopher of science who's bored with classic underdetermination debates and wants to pivot toward fresh, impactful terrain. Three things jump out immediately: their rejection of "hundredth paper" syndrome, their fascination with local underdetermination cases, and their provocative hunch that underdetermination might be question-relative rather than evidence-relative. 

  Hmm... they're signaling exhaustion with the Duhem-Quine literature while still caring deeply about realism - that's a tension worth respecting. When they say "settled in the boring sense," I hear someone who wants to move beyond dialectical stalemates. Their attraction to local cases makes perfect sense - those are where the metaphysical rubber meets the road. And that question-relativity idea? That's genuinely novel; I'm surprised more people haven't explored that angle. 

  *flips mental notebook open* Right, so to structure this: First, diagnose why classic underdetermination feels stagnant (overplayed moves, false equivalence between radical/natural underdetermination). Then build scaffolding around their two core interests - local cases and question-relativity - showing how they interlock. The key insight: local underdetermination isn't just a weaker version of global underdetermination; it's a different beast entirely because it lives in the space where methodology and metaphysics collide. 

  *scribbles arrows* Their taste for formal argument is crucial here. We should steer them toward: (a) modeling how different theory-space structures create/preserve underdetermination (lattice theory? partial orderings?), (b) formalizing how question-framing affects underdetermination status (maybe dynamic epistemic logic?), while warning against dead ends like exhaustive case studies of 19th optics debates. 

  *checks watch* Oh! The blind spot: they're not seeing how underdetermination functions in computational science where theories are black-box algorithms. That's where the question-relativity angle becomes explosive - when "what counts as a question?" is determined by explainability constraints. Definitely flag that. 

  Most urgent priorities? First crystallize the question-relativity thesis (it unlocks everything). Then develop formal tools to show local underdetermination isn't just global underdetermination's kid brother. Save the computational science angle for year three - it needs the other pieces first. 

  *pauses* Should add meta-commentary: Their instinct to avoid "important but non-consequential" questions is spot-on. Recommend explicitly ranking projects by how many downstream debates they'd reconfigure. Example: nailing question-relativity would reshape underdetermination's role in realism arguments, while another paper on equivalence classes of theories... wouldn't. 

  Final thought: They'd enjoy connecting with formal epistemologists working on theory choice under ambiguity aversion. Different jargon, same deep puzzle.
answer: |-
  Your instincts are sharp—moving beyond the tired Duhem-Quine stalemate toward local, question-relative underdetermination is where the field needs fresh blood. Here’s a structured framework for your postdoc, prioritizing **tractability**, **upstream leverage**, and **impact potential**. I’ll break it down by problem space, rationale, and sequencing.

  ---

  ### **Core Problem Spaces Ranked by Priority**
  1.  **The Question-Relativity Thesis (Year 1)**  
      **Focus:** Formalize how underdetermination depends on *which questions we ask* (not just evidence).  
      **Why upstream?** This reframes the entire debate. If underdetermination is question-relative, classic "global" arguments collapse into pragmatic choices about inquiry.  
      **Tractable formal work:**  
      - Model "question spaces" (e.g., lattices of possible queries) and show how rival theories become underdetermined only relative to subsets of questions.  
      - Use decision/game theory: How do *costs* of asking certain questions (e.g., experimental feasibility) create artificial underdetermination?  
      **Blind spot:** Most assume questions are neutral; you’d expose how they embed ontological commitments.  
      **Downstream impact:** Forces realists/anti-realists to engage with *epistemic priorities*, not just evidence.  

  2.  **Local Underdetermination & Theory Structure (Year 1.5–2)**  
      **Focus:** Why do *specific* rival pairs (e.g., Newtonian vs. Lagrangian mechanics) resist underdetermination *despite* formal equivalence?  
      **Why next?** Tests your question-relativity thesis empirically. Case studies here aren’t historical—they’re probes into theory structure.  
      **Tractable formal work:**  
      - Compare *representational frameworks* (e.g., coordinate-based vs. geometric formulations of QM). When do differences generate ontological clashes despite empirical parity?  
      - Map "ontological friction": Add probabilistic noise to data—when do small perturbations break equivalence? (This reveals hidden assumptions.)  
      **Blind spot:** Equivalence often assumes idealizations (infinite data, perfect agents). Relax these to find where underdetermination emerges.  
      **Downstream impact:** Shows when realist commitments are defensible (e.g., in quantum gravity).  

  3.  **Underdetermination in Computational Science (Year 2.5–3)**  
      **Focus:** AI/ML models (e.g., different neural nets fitting data identically) as underdetermination case studies.  
      **Why later?** Requires tools from #1–2. This is the *killer app* for your framework.  
      **Tractable formal work:**  
      - Prove that model classes (e.g., CNNs vs. Transformers) are underdetermined *only* for certain query types (e.g., predictions vs. explanations).  
      - Formalize "explainability demands" as questions that break underdetermination (e.g., counterfactual queries).  
      **Blind spot:** Philosophers ignore that ML forces us to *choose* questions (e.g., accuracy vs. interpretability).  
      **Downstream impact:** Directly influences AI ethics (e.g., "fairness" under underdetermined models).  

  4.  **The Dynamics of Underdetermination (Ongoing)**  
      **Focus:** How underdetermination *evolves* with new questions/technologies.  
      **Why lowest priority?** More conceptual; builds on prior results.  
      **Tractable angle:** Model how expanding question spaces resolve (or create) underdetermination over time.  
      **Blind spot:** Underdetermination isn’t static—it’s a byproduct of *changing* epistemic goals.  

  ---

  ### **Ranking Principles**
  - **Upstreamness:** Question-relativity (#1) is foundational. Reshuffling it reorders everything downstream.  
  - **Tractability:** Prioritize formalizable problems (lattices of questions, perturbation models) over woolly historical analysis.  
  - **Impact Potential:**  
    - **High:** #1–3 reconfigure debates (e.g., #3 bridges philosophy of science with ML ethics).  
    - **Low:** Refining equivalence criteria (e.g., "empirical content") without linking to questions.  
  - **Avoid:** "Important but inert" problems (e.g., cataloging historical cases without a formal thesis).  

  ---

  ### **The Blind Spot You’re Missing**
  **Underdetermination and Normative Epistemology**  
  Most work asks, "Is underdetermination *possible*?" Not: "*Should* we tolerate it?" Formalize when underdetermination is *epistemically virtuous* (e.g., preserving theory diversity for robustness) vs. *vicious* (e.g., obscuring ethical risks). This ties #1–3 to values in science—a hot topic in socially engaged philosophy of science.

  ---

  ### **Suggested Workflow**
  | Year | Focus                     | Output Goals                          |
  |------|---------------------------|---------------------------------------|
  | 1    | Question-relativity thesis| Paper formalizing "question spaces" + underdetermination as path-dependent |
  | 1.5  | Local cases + theory structure | Paper on ontological friction in equivalent theories (e.g., QM formulations) |
  | 2    | Computational extension   | Paper applying #1–2 to ML underdetermination (e.g., "Why accuracy underdetermines explainability") |
  | 3    | Synthesis + norms         | Book prospectus: *Underdetermination and the Art of Asking* |

  ---

  ### **Key Moves to Avoid**
  - Don’t get stuck defining "theory" or "evidence"—pivot to *questions* immediately.  
  - Skip exhaustive case studies; use toy models (e.g., graph-based ontologies) for formal clarity.  
  - Resist the lure of "metaphysical equivalence" debates—focus on *when* differences matter to question-answering.  

  This plan turns underdetermination from a tired gotcha into a lens for probing how science *negotiates reality* through questions. That’s a postdoc that leaves a crater.
