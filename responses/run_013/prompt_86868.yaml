prompt: |-
  I am a novelist, and the book I am writing turns on a character who never utters a falsehood and nevertheless ruins a friend's life by what she lets her listeners infer. I have spent a year reading in the philosophy of deception and keep meeting the same question — whether lying is worse than misleading, and why — answered in ways that do not help me write her. What I want instead is an agenda: which open questions about the distinction between lying and misleading would genuinely change how a character like hers is written and judged, ranked, with the ranking defended. Assume a year of my time, no appetite for disputes that turn out to be terminological, and nothing I could use only if I had a philosophy library to hand.

  Here is the working view you may push back on before ranking anything. On my account an utterance misleads only if the speaker relies on an inference the hearer is entitled to draw given the shared norms of the conversation; call this the entitlement condition. The questions I want ordered are the ones upstream of it: whether entitlement is fixed by convention, by the speaker's design, or by what a reasonable hearer would infer; whether misleading requires intent, and what it is to intend an inference rather than merely foresee it; where the paltering case — true statements arranged to produce a false impression — belongs, with lying, with misleading, or in a third class; whether the supposed moral gap between lying and misleading survives once consequences, breach of trust, and entitlements are held fixed; and whether the distinction marks anything in the world or only in our vocabulary.

  Rank them by how much each would change the writing — which would alter what the reader takes to be her crime, which would alter her own self-justification, which would alter nothing but my prose — and say plainly which criteria you are using, where those criteria pull against one another, and what argument or example would move a question up or down the list. If I have left out a question that should outrank all of these, put it first and tell me why.
reasoning: |-
  Okay, let me start by really understanding what this novelist is asking. They’re working on a character who never lies but still ruins a friend’s life through misleading truths. They’ve spent a year diving into philosophy about deception, but the usual debates on whether lying is worse than misleading aren’t helping their writing. What they need is a prioritized list of unresolved questions that would actually impact how they write and how readers judge this character.

  First, I need to grasp their working definition. They mention the "entitlement condition"—misleading happens when the speaker relies on an inference the listener is entitled to draw based on shared norms. The questions they have revolve around what shapes that entitlement, intent, paltering, moral distinctions, and whether the lying-misleading divide is real or just semantic.

  Now, ranking these questions requires criteria that directly affect storytelling. The key criteria should be: how much each question influences the reader's moral judgment of the character, the character's self-perception and justification, and the narrative structure. Questions that change the reader's view of the crime or the character’s internal conflict are top-tier. Those affecting only prose or philosophy without narrative impact rank lower.

  Looking at their questions:  
  1. What fixes entitlement—convention, speaker's design, or reasonable hearer?  
  2. Does misleading require intent, and what's the difference between intending and foreseeing an inference?  
  3. Where does paltering fit?  
  4. Is there a moral gap when consequences, trust, and entitlements are equal?  
  5. Is the distinction real or just semantic?  

  I need to consider which of these would most alter the story. For instance, if entitlement is based on the speaker's design, the character might seem more manipulative, making her guilt clearer. If it's based on convention, the reader might blame societal norms instead. That could change both reader judgment and the character's self-justification.  

  Intent is crucial too. If intent is necessary for misleading, the character could argue she didn't intend harm, only foresaw it. But if foreseeing is enough, her defense weakens. This directly affects how she justifies herself and how guilty she feels.  

  Paltering might feel like a technicality, but its classification could influence how the reader categorizes the act. If it's a third category, it adds nuance. But if it's grouped with lying, the character’s "no lies" claim becomes hollow.  

  The moral gap question is deeper. If the distinction vanishes when consequences are equal, the character’s strict truth-telling becomes irrelevant. That fundamentally changes the reader's view of her crime.  

  The realism of the distinction might affect the themes but perhaps not the plot or character as directly. If it's just semantic, it might not change much beyond the philosophical backdrop.  

  Is there a missing question? Maybe about how the character's knowledge or relationship affects entitlement. If shared history or specific knowledge plays a role, that could deepen the betrayal. For example, if the listener is entitled to more because of their friendship, the breach is worse. That could outrank others as it ties directly to personal relationships and trust, central to the story's conflict.  

  So, prioritizing: The moral gap question when consequences are equal is paramount because it challenges the character’s moral high ground. If lying and misleading are equally wrong when harm is the same, her justification crumbles. Next, intent versus foreseeing—this shapes her self-awareness and guilt. Then, what determines entitlement, as it influences perceived responsibility. Paltering and the semantic question might be lower impact.  

  But adding the missing question about relational entitlements could be top. If entitlement depends on the specific relationship, the betrayal is more personal, altering both reader judgment and character justification significantly. That deserves the first spot as it’s both under-explored and narratively potent.
answer: |-
  Here is a ranked agenda of open questions, designed to maximally impact your novel's character judgment, self-justification, and prose. Criteria are applied as follows:  
  1. **Reader's Moral Judgment (Weight: 40%)**: How much the answer changes whether the reader sees the character as culpable, tragic, or monstrous.  
  2. **Character's Self-Justification (Weight: 35%)**: How it alters her internal logic, guilt, or sense of innocence.  
  3. **Narrative Mechanics (Weight: 15%)**: Changes to dialogue, pacing, or dramatic tension.  
  4. **Thematic Depth (Weight: 10%)**: Whether it reframes the core exploration of truth/harm.  

  Questions are ordered by *narrative stakes*, with the most transformative first. I’ve added one missing question that outranks all others.  

  ---

  ### **The Missing Question (Rank #1)**  
  **"Does the depth of the relationship (e.g., friendship) create unique epistemic entitlements that override conventional norms?"**  
  - **Why it outranks others**: Your character’s crime hinges on betraying a *friend*. If close relationships demand higher transparency than ordinary conversations (e.g., "Friends owe each other context"), her technically truthful statements become profound violations. A stranger might not be "entitled" to infer correctly—but a friend is.  
  - **Impact on Reader Judgment**: Makes her seem colder; her adherence to literal truth reads as weaponized pedantry against love/trust.  
  - **Impact on Self-Justification**: She could rationalize ("I told the truth!") or crumble upon realizing friendship obligated fuller disclosure.  
  - **Example for Up/Down Ranking**: If your setting emphasizes communal bonds (e.g., a tight-knit village), this question dominates. In an atomized society, it drops.  
  - **Why it’s missing in your list**: Your "shared norms" focus is generic. Friendship may create *exceptional* norms.  

  ---

  ### **Ranked Agenda**  
  #### **#2: When consequences, breach of trust, and entitlements are equal, does a moral gap between lying and misleading persist?**  
  - **Why #2**: If "no," your character’s rigid truthfulness becomes a hollow technicality. Her crime is identical to lying, demolishing her moral self-image.  
  - **Reader Judgment**: Shifts from "flawed purist" to "hypocrite" or "coward."  
  - **Self-Justification**: Her core identity ("I never lie!") collapses if misleading is equally wrong. She must confront true motives (e.g., moral vanity).  
  - **Narrative Mechanics**: Forces climax where she admits equivalence or doubles down.  
  - **Argument to Elevate**: Empirical studies showing identical psychological harm from lying vs. misleading (e.g., misleading causing longer-lasting distrust).  

  #### **#3: Does misleading require *intent* to induce a false inference, or is *foresight* sufficient?**  
  - **Why #3**: Determines whether your character is actively malicious or passively reckless.  
  - **Reader Judgment**: Intent → calculated villain; Foresight → tragic negligence.  
  - **Self-Justification**: "I didn’t *mean* for you to think that!" vs. "I knew you would, but it’s not my fault."  
  - **Thematic Depth**: Explores moral luck (e.g., same words, different intent).  
  - **Example for Down Ranking**: If your character is hyper-self-aware, intent is obvious; question drops.  

  #### **#4: What fixes entitlement—convention, speaker’s design, or reasonable hearer?**  
  - **Why #4**: Changes who "owns" the harm. Convention → societal blame; Speaker’s design → character’s guilt; Reasonable hearer → victim’s overreach.  
  - **Reader Judgment**: Speaker’s design = damning; Reasonable hearer = mitigates blame.  
  - **Self-Justification**: "I followed conventions!" vs. "I manipulated norms."  
  - **Prose Impact**: Dictates subtext in dialogue (e.g., emphasizing cultural norms vs. character’s phrasing).  
  - **Argument to Elevate**: Legal cases where courts privilege "reasonable interpretation" over speaker intent.  

  #### **#5: Where does *paltering* belong?**  
  - **Why #5**: Paltering is your character’s primary tool. If it’s "misleading," she’s unethical; if "lying," she’s self-deluded; if a "third class," it nuances her crime.  
  - **Reader Judgment**: Third class → readers debate her culpability; Lying → she’s a fraud.  
  - **Self-Justification**: She might see paltering as virtuosic truth-telling.  
  - **Narrative Mechanics**: Affects how other characters accuse her (e.g., "You lied!" vs. "You manipulated!").  
  - **Why Not Higher**: The moral/emotional impact is derivative of #2 and #3.  

  #### **#6: Is the lying/misleading distinction real or semantic?**  
  - **Why Last**: Least narratively transformative. A "semantic" answer makes her obsession ironic but doesn’t alter judgment. A "real" answer reinforces her worldview.  
  - **Prose Impact**: Influences metaphors (e.g., "a chasm between words" vs. "shadows of meaning").  
  - **Thematic Depth**: If semantic, the novel critiques linguistic hypocrisy; if real, it upholds truth’s sanctity.  
  - **Self-Justification**: Minimal—she believes it’s real regardless.  

  ---

  ### **How to Use This Agenda**  
  1. **Start with #1 (friendship entitlements)**: Draft key scenes testing if the friend was "owed" more truth. Does she dismiss this? Does she realize too late?  
  2. **Pivot to #2 (moral gap)**: If misleading and lying are morally equal when harm is identical, her final confrontation must expose this.  
  3. **Intent (#3) vs. Entitlement (#4)**: These interact. If she *intended* harm but entitlement was low (e.g., vague norms), she’s predatory. If she *foresaw* harm but entitlement was high (e.g., friendship), she’s grossly negligent.  
  4. **Demote terminology (#5–6)**: Fiddle with paltering/realism only if they amplify themes established by higher-ranked questions.  

  **Time Allocation**: Spend 70% on #1–2 (foundational for character/moral weight), 20% on #3–4 (psychological nuance), 10% on #5–6 (polish).  

  **Crucial Example**: Imagine your character tells her soon-to-be-ruined friend: "James left his apartment keys here last night." She knows the friend will infer James is cheating (he isn’t—he was helping her move).  
  - If **friendship creates entitlement (#1)**, her crime is *withholding context* (James is her brother).  
  - If **misleading = lying when harm is equal (#2)**, her "truth" is no defense.  
  - If **intent is required (#3)**, she’s guilty only if she *wanted* the friend to infer infidelity.  

  Push where the ambiguity cuts deepest for your character’s soul.
