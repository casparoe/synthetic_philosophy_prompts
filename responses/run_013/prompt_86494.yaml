prompt: |-
  I am curating a small gallery on the theme of myth and history, with three rooms — Troy, Arthur, Exodus — and I have to write the labels, which visitors will read as verdicts on whether any of it happened. A colleague has proposed the test we should apply, and I want to see what I would be committing myself to before I agree to it. Her test runs as follows: a traditional narrative should be presented as history, rather than as legend, exactly when positing that its central events really occurred forms part of the best explanation of why the narrative exists and persisted in the shape it did; where invention, borrowing or later political need explains the tradition at least as well, it stays legend. She adds two qualifications. The test concerns only the smallest historical core needed to explain the tradition, not the events as narrated; and it is to be applied to the tradition as a whole, rather than piecemeal to its parts.

  Assume that the evidence for the three rooms is as follows. Troy: a real Late Bronze Age settlement, destroyed more than once, with no contemporary text naming the war or its heroes. Arthur: the earliest mentions come centuries after the supposed events and say almost nothing, while the familiar story is largely the work of writers many centuries later. Exodus: a foundational narrative of a people, with no contemporary attestation and no archaeological corroboration of a mass departure.

  Set out the five most important implications of adopting her test, both for how these three narratives should be presented and for the business of drawing a line between legend and history at all. Answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion, in British English.
reasoning: |-
  Hmm, the user is curating a gallery on myth and history and needs to apply a colleague's test to decide how to label three rooms: Troy, Arthur, and Exodus. The test says a narrative should be presented as history if positing its central events happened provides the best explanation for why the narrative exists and persisted in its form. Otherwise, it's legend. There are qualifications: focus on the smallest historical core and the tradition as a whole, not piecemeal. The evidence given shows Troy had a real settlement but no texts naming the war; Arthur has late mentions and much later stories; Exodus has no contemporary attestation or archaeological proof.

  I need to identify the five most important implications of adopting this test for these narratives and for drawing the line between legend and history. Each point should be one or two sentences in British English, as a numbered list without introduction or conclusion.

  First, let's analyse how the test applies to each room. For Troy: the destruction events could explain the tradition's persistence, so it might be history for the core destruction, not the specific heroes. For Arthur: late mentions and later political inventions suggest legend, as there's no early core. For Exodus: no evidence for a mass departure, so political need explains it better as legend.

  Now, broader implications: the test shifts focus to why traditions persist, not just evidence. It minimises historical claims to the smallest core. It treats traditions holistically, avoiding selective historicity. It makes the line between history and legend about explanatory power, not proof. And it requires evaluating cultural motives, not just facts.

  I must ensure exactly five items. Let me outline them: 1. How Troy is handled with its core event. 2. Arthur as legend due to lack of early explanatory core. 3. Exodus as legend because political need explains it better. 4. The test's focus on minimal cores for all cases. 5. The holistic approach preventing partial historicity.

  Check the user's deeper needs: they might be worried about overcommitting to historical claims or simplifying complex traditions. The test offers a principled way to avoid that, emphasising explanatory reasoning over binary truths. It also engages visitors intellectually by making labels about why stories endure, not just what happened. That could make the gallery more educational and thought-provoking.
answer: |-
  Here are the five most important implications:

  1.  Troy's label should present a historical core (a significant Late Bronze Age destruction) as history, since such an event best explains the tradition's origin and persistence, though the specific narrative details remain legendary.
  2.  Arthur must be presented as legend, as positing a real central figure or event isn't needed to explain the late, sparse early mentions or the much later, politically-motivated development of the familiar story.
  3.  Exodus must be presented as legend, as the absence of contemporary attestation and archaeological evidence means political/religious need explains the foundational narrative's existence and persistence better than a posited mass departure.
  4.  The test forces minimalism, requiring labels to focus *only* on the smallest possible core event (e.g., Troy's destruction) necessary to explain the tradition, ignoring the narrated details (e.g., Achilles, Helen).
  5.  Applying the test holistically prevents narratives like Arthur or Exodus from being presented as "partly historical" based on isolated plausible elements, demanding an explanation for the entire tradition's shape and endurance.
