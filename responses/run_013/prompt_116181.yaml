prompt: |-
  I'm a doctoral student in philosophy working on decision theory and population ethics, and I've been arguing for weeks with a friend who takes expected value maximization about as literally as it can be taken. You are a philosopher who works on both decision theory and the ethics of the far future, and I'd like you to read a short essay I've drafted for our reading group and tell me what you make of it. Before you start writing, please work through the objections carefully in your head — I would rather have three well-aimed objections than ten perfunctory ones — and then give me your comments in continuous prose only, with no headings, bullet points, bold text, or tables, the way you would write a long and candid email to a colleague. Open with your overall verdict in a sentence or two, then elaborate. Here is the draft:

  "Fanaticism in expected value reasoning comes in two forms that are usually run together. The first is the tiny-probability, astronomical-payoff form: a bet with a probability of one in a quadrillion of an outcome worth a quadrillion units has the same expected value as a sure thing worth one unit, and something seems badly wrong with treating these as equivalent, or with taking the bet whenever the probability is nudged upward. The second is the far-future form: if the number of people who might exist later is astronomically large, then a tiny change in the probability of a good outcome for them can swamp any benefit to people alive now, and present-day concerns get lexically demoted. My claim is that only the first is really a problem about expected value. The second is a problem about the size of the stakes, and any decision rule that is sensitive to stakes at all will reproduce the same structure; the fanaticism charge there is really a charge against consequentialism with an enormous denominator, not against the expectation operator. The first is a genuine problem, and I think it is a problem about measurement rather than about aggregation. We do not possess probability estimates that are reliable to twelve decimal places, and a rule that is sensitive to differences at the twelfth decimal place is a rule that is sensitive to noise. So I propose a criterion: before counting a probability-weighted outcome toward the expected value of an option, ask whether a plausible error in the probability estimate — being off by a factor of a thousand in either direction — would change which option wins. If it would, the option's advantage rests on a quantity we cannot estimate, and that contribution should be discounted or dropped rather than used to break the tie. Call this the estimation-error test. It handles the mugging case, since the mugger's probability is a guess, and it does not require us to say that small probabilities do not count, only that unestimated ones do not count much. The obvious objection is that the test is too strong: our estimates of charitable effectiveness are also uncertain by orders of magnitude, and if we discard every contribution that fails the test we will have almost nothing left to compare. I think the test can be repaired by making the discount depend on the ratio of the estimate's uncertainty to the decision-relevant margin, though I am not confident this does not simply collapse into risk aversion, or into a prior over probability estimates dressed up as a principle."

  What started the argument with my friend is a pair of cases he insists are structurally identical: a bet that pays off once in a billion, which he values at a billionth of the sure payoff, and a donation with a one-in-a-billion chance of averting an existential catastrophe, which he values the same way. I say the first is a mugging and the second is an ordinary cost-effectiveness calculation; he says the only difference is that I like the conclusion of the second. I would like your comments on three things in particular: whether the distinction between the two forms of fanaticism is a real one or merely verbal, whether the estimation-error test is a genuinely new criterion or a relabeling of something already in the literature, and whether the repair I gesture at in the last sentence can be made to work. If you think the argument fails, please tell me which premise you would give up and what you would put in its place, and if you think the case pair does not actually decide anything, tell me what case would.
reasoning: |-
  Okay, the user is a doctoral student in philosophy focusing on decision theory and population ethics. They’ve been debating a friend who strictly adheres to expected value maximization. The user shared an essay draft distinguishing two types of fanaticism in expected value reasoning and proposes an "estimation-error test" to handle tiny probabilities with huge payoffs. They want feedback on three specific points: the reality of their fanaticism distinction, the novelty of their test, and the viability of their proposed repair for the test’s potential drawbacks.

  First, I need to parse their core argument. They claim that "astronomical stakes" fanaticism (e.g., far-future impacts) isn’t unique to expected value but applies to any stakes-sensitive consequentialism, while "tiny probability" fanaticism (e.g., Pascal’s Mugging) stems from measurement unreliability. Their solution discounts probabilities too fragile to estimation error. 

  The user’s anxiety is palpable—this isn’t just academic; they’re frustrated with their friend’s rigidity. The friend equates a low-probability bet with a low-probability existential risk intervention, which the user finds intuitively distinct but struggles to defend systematically. Their deeper need might be for conceptual tools to break this deadlock without abandoning consequentialism.

  Now, evaluating their three asks:  
  1. **Fanaticism distinction**: Their split seems valid. Far-future issues arise from scale insensitivity (e.g., total utilitarianism’s "mere addition paradox"), while mugging hinges on probability granularity. Conflating them weakens critiques—e.g., dismissing longtermism over mugging objections. But I’d stress that *in practice*, both can manifest together (e.g., low-probability extinction risks with vast future stakes).  

  2. **Novelty of estimation-error test**: It’s a fresh *framing*, but adjacent to ideas like Bostrom’s "universalizability" or discounting untestable probabilities. The innovation is linking it to decision-relevant margins rather than arbitrary thresholds. Still, it risks resembling "ambiguity aversion" (e.g., Ellsberg Paradox), where unknown probabilities are discounted. Needs differentiation.  

  3. **Repair viability**: Their ratio-based discount (uncertainty / margin) could avoid collapsing into risk aversion if it *only* applies when uncertainty exceeds the EV difference between options. But implementation is thorny—e.g., how to define "plausible error" without priors? Might covertly reintroduce Bayesian elements.  

  **Key tension**: User wants to reject mugging-like cases without undermining far-future interventions. Their test achieves this *if* existential risk probabilities are deemed robust enough (e.g., climate models vs. mugger’s guess). But their friend’s "structurally identical" challenge exposes a vulnerability: if we *had* reliable nano-probabilities (e.g., quantum-linked lottery), would the test still dismiss them? User might need to concede that some mugging-type cases *are* valid if probabilities are secure, but stress that real-world decisions lack such precision.  

  **Biggest gap**: The test doesn’t address population ethics’ core issue—lexical priority to the future. Even with reliable probabilities, valuing a 10^-12 chance of 10^12 future lives over present needs feels fanatical to many. User’s framing avoids this, but their friend’s challenge forces it. Perhaps distinguish between *epistemic* (measurement) and *axiological* (stakes scale) problems, and concede the latter requires separate handling (e.g., discount rates, person-affecting views).  

  **Suggestions**:  
  - Fortify the distinction by noting mugging involves *unconstrained* payoffs (mugger can invent any number), while existential risks have *physically bounded* maxima.  
  - For the test, clarify that "discount" needn’t mean full exclusion—e.g., use fuzzy integrals over probability intervals.  
  - For the repair, explore decision rules like *satisficing* above an EV threshold to avoid noise sensitivity.  

  **Conclusion**: User’s approach is promising but incomplete. Their test usefully handles epistemic uncertainty, but the far-future problem demands axiological adjustments. For the friend’s cases: agree they’re structurally similar *if* probabilities are equally reliable, but emphasize that in practice, they’re not—existential risk estimates (while imperfect) aren’t pulled from thin air like a mugger’s claim. That difference in epistemic warrant justifies treating them differently.
answer: |-
  Your essay is insightful and makes a compelling case for disentangling two distinct problems often lumped together under "fanaticism," but I suspect the distinction may not fully resolve the deeper tension with your friend, and the estimation-error test—while pragmatically appealing—faces significant challenges in formalization and risks collapsing into familiar territory. Let me walk through your core arguments and the specific queries.

  The separation of tiny-probability fanaticism (Pascal’s Mugging) from far-future fanaticism strikes me as both valid and important. You’re right that the latter arises from the sheer scale of potential beneficiaries, which could plague any aggregative consequentialist framework (e.g., total utilitarianism), not just expected utility maximization. If we weight outcomes by their moral importance and the far future contains orders of magnitude more beings, minor shifts in probabilities affecting them will dominate present-focused actions. This is a problem of *stakes sensitivity*, inherent to the axiology. The former, however, is fundamentally about *epistemic fragility*: probabilities like "one in a quadrillion" are often arbitrary placeholders for "vanishingly small but unquantified," and our cognitive or empirical grip on them is tenuous at best. Treating these cases as distinct clarifies that rejecting Pascal’s Mugging need not undermine longtermist interventions—if we can defend their probability estimates as sufficiently robust.

  Your estimation-error test is a novel and elegant heuristic for addressing epistemic fragility. By discounting contributions where small errors in probability estimation could flip decisions, it targets noise without dismissing small probabilities categorically. This avoids the implausibility of hard thresholds (e.g., "ignore probabilities below 10^{-9}") and aligns with practical rationality: we shouldn’t let decisions hinge on digits we’re pulling from thin air. However, I doubt it’s entirely unprecedented. It echoes themes in literature on decision-making under ambiguity (e.g., Gilboa & Schmeidler’s max-min expected utility) or Bayesian sensitivity analysis, where robustness checks guard against model uncertainty. Your innovation lies in framing it as a *tie-breaking criterion* focused on decision-relevant margins, which feels underexplored. Still, it’s closer to a pragmatic refinement than a radical departure.

  The real difficulty emerges in your proposed "repair"—making discounts depend on the ratio of uncertainty to the decision margin. This is where the wheels risk coming off. If uncertainty is quantified (e.g., as a variance or credible interval), this ratio could indeed modulate how much weight we give a probability estimate. But this seemingly reintroduces second-order uncertainty, effectively demanding a prior over probabilities. For instance, if we model the "true" probability as a distribution, your test resembles a risk-aversion rule applied to metaprobalities. Worse, it might incentivize artificial precision: an agent could game the system by reporting narrow uncertainty intervals to pass the test. More fundamentally, it doesn’t escape the "too strong" objection you anticipate. Charitable interventions with high uncertainty would still be discounted, potentially paralyzing decisions—unless we set lenient uncertainty bounds, which defeats the test’s purpose. 

  On your friend’s challenge: the bet and donation cases *are* structurally identical under strict expected value maximization. Both involve options with identical EVs (e.g., p = 10^{-9}, payoff = 10^9 units). If you reject the bet but accept the donation, the difference must lie outside the EV calculus—likely in your assessment of the *credibility* of the probabilities. The mugger’s "one in a billion" is a wild guess; the existential risk estimate, while uncertain, might be informed by scientific models (e.g., asteroid impacts) or historical near-misses. Your test captures this: the mugger’s probability would fail the estimation-error criterion (a factor-of-1000 error makes EV dwarf any ordinary action), while the existential risk case might pass if evidence constrains probabilities to within an order of magnitude. But this relies on external epistemic judgments—it doesn’t resolve the clash of intuitions. Your friend might counter: "If I offered a quantum-verified lottery with p = 10^{-9}\) for a billion lives saved, would you still dismiss it?" If yes, you’re not just rejecting noise—you’re rejecting EV maximization itself in high-stakes, low-probability domains.

  For a decisive case, consider a *reliable* tiny-probability scenario: suppose we discover a cosmic lottery where pulling a lever truly has p = 10^{-12} of creating a utopian civilization with 10^{12} beings. Expected total utilitarianism demands we sacrifice almost any present resource for this lever. If you bite this bullet, your friend wins; if not, you must abandon strict EV maximization. Your test might exclude it if uncertainty exceeds the decision margin, but if probabilities are precise (e.g., verified by physics), the test passes—forcing you to accept fanaticism or find another constraint.

  My verdict: your distinction between the two fanaticisms is sound and useful, but the estimation-error test, though clever, may not fully resolve the normative dispute. It’s a valuable heuristic for managing epistemic limits, but under pressure, it either relies on exogenous credibility judgments or morphs into a form of generalized risk aversion. I’d soften the premise that this is purely a "measurement problem." The deeper issue is that unbounded utility scales (e.g., totalism) plus linear probability weighting create pathologies that no purely epistemic fix can wholly tame. A replacement might integrate your test with a moderate axiological shift—e.g., a soft cap on how much probability-discounted stakes can outweigh certain losses, or a lexical threshold where only probabilities above some robustness floor contribute to EV. But that’s a concession to your friend’s point: sometimes, we *do* need to temper expectation.  

  P.S. On the case pair: they decide nothing alone. Add a third case with high-stakes, *well-constrained* tiny probabilities (e.g., engineered particle physics risks) to isolate whether the disagreement is about uncertainty or the normative weight of small probabilities as such.  

  —  
  *Thoughts scribbled over coffee, hoping it helps. Keep pressing on the estimation-error angle—it’s underexplored terrain, even if treacherous.*
