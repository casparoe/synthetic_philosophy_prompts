prompt: |-
  I am a high school student who has lived in several countries, and I am trying to determine what I actually believe about everyday conventions. I have set out my verdicts on a number of cases below, and I would like to know whether a single principle can capture them, what that principle implies for cases I have not considered, and which of my verdicts, if any, I should abandon.

  1. Tipping a server at a sit-down restaurant in the United States: morally obligatory, not merely generous. A diner who leaves nothing has done something wrong, even if the service was only adequate.
  2. Tipping a barista at a coffee counter in the United States: optional. Leaving nothing is not wrong; leaving a dollar is generous.
  3. Tipping a server in Japan: not required, and often awkward or mildly rude. A visitor who tips because it is customary at home has not done something morally wrong, but has misread the local practice.
  4. Queueing for a bus in Britain: obligatory. Joining the back and waiting one's turn is required; cutting is wrong.
  5. Queueing for a bus in a crowded city where queueing is not the norm and everyone presses toward the door: not wrong to press forward, though it is unpleasant. A visitor who insists on an orderly queue and lets others board ahead is not wrong either, only ineffective.
  6. Jaywalking at 3 a.m. on an empty street in a city where jaywalking is illegal but universally done: not wrong. The law is not doing moral work here.
  7. Jaywalking in front of a small child in a city where jaywalking is illegal and rare: wrong, or at least blameworthy, because it teaches the child to take a risk.
  8. A visitor from a country where jaywalking is normal who jaywalks in a country where it is illegal and rare: wrong, because visitors should follow local conventions when the convention protects a genuine local practice.
  9. A local who does not tip in a country where tipping is customary but the worker is paid a living wage and the custom is dying out: I am unsure. My gut says not wrong, but I feel I should still tip if I am in the minority who knows the custom.

  I notice a tension. In cases 3 and 8 I want to say that visitors should follow local conventions, but in case 5 I do not think a visitor who follows a home convention of orderly queueing has done anything wrong, even though it is not the local convention. I also notice that in case 1 I treat a convention as morally obligatory, while in case 6 I treat a legal rule as morally inert. I have been calling the idea I am after the host's prerogative: a visitor must follow local conventions when they are public, coordinated, and not morally objectionable, but locals may ignore conventions that are merely customary when no one is harmed. Is that principle defensible? Does it get all nine verdicts? If it cannot, which verdict should I give up, and what does the revised principle predict for a tenth case I have not listed: a visitor who is invited to a local home and is expected to remove their shoes, but has a medical condition that makes it painful to do so? Please state the principle or principles precisely, show which case motivates each clause, and tell me honestly which of my verdicts it cannot accommodate. Please do not simply say that conventions are relative; I want to know whether my verdicts can be unified and what the cost of unifying them is.
reasoning: |-
  Okay, let me tackle this high school student's query. They've lived in several countries and are trying to figure out the underlying principle behind their judgments on various social conventions. The key here is to unify their nine verdicts into a coherent principle, identify any tensions, and resolve inconsistencies.

  First, I need to parse each case. The student mentions tipping in the US vs. Japan, queueing in Britain vs. chaotic environments, and jaywalking under different contexts. Their initial idea is "host's prerogative," which needs refinement. 

  Looking at cases 1 and 2, both involve the US but different tipping contexts. Why is one obligatory and the other optional? The difference seems to be reliance: servers depend on tips for wages, whereas baristas don't. Case 3 in Japan shows that imposing a foreign custom can be awkward, but not immoral. This points to the need for coordination and avoiding harm. 

  Queueing in Britain (case 4) is obligatory because it coordinates behavior to prevent conflict. In a place without queues (case 5), pressing forward isn't wrong because there's no established norm to coordinate around. The visitor maintaining an orderly queue isn't wrong but ineffective—so the harm principle applies here. Minimal harm means it's acceptable. 

  Jaywalking cases (6,7,8) highlight harm and coordination. At 3 AM, no risk, so no harm. Doing it in front of a child risks teaching harmful behavior. The visitor jaywalking where it's rare (case 8) is wrong because it undermines local coordination efforts, even if the act itself isn't harmful. 

  Case 9 is tricky. If a custom is dying and workers have living wages, the harm (relying on tips) is gone. But uncertainty comes from being in the minority. The refined principle here would say no obligation if no harm, but coordination might still be needed if enough people follow it. 

  The tension between cases 3,8 and 5: In 3 and 8, visitors should follow local norms to respect coordination. In 5, the visitor queueing isn't wrong because they're not causing harm; inefficiency isn't harm. So the harm clause resolves this. 

  The proposed principles are Coordination, Harm, and Knowledge. Coordination explains the need for social norms to function smoothly. Harm determines when deviations are permissible. Knowledge ensures awareness of local norms. 

  Applying this to the shoe-removal case: the visitor has a medical condition causing pain. The harm principle overrides the convention here. Explaining the reason respects the host, but not removing shoes isn't wrong given the physical harm. 

  The student's verdict in case 9 might need revision. If no harm (workers paid well) and the norm is dying, not tipping isn't wrong. But if enough locals still tip, coordination might require participation to avoid confusion. However, the harm principle takes precedence, so no obligation. 

  Overall, the three principles unify most cases. The cost is accepting that in transitional norms (case 9), the obligation fades as the harm disappears. The student should adjust case 9's verdict to not obligatory if harm is absent.
answer: |-
  Based on your verdicts, a coherent principle emerges that reconciles most cases. The tension you identified (cases 3/8 vs. 5) is resolvable by distinguishing between **harm prevention** and **coordination efficiency**. Here's a refined framework:

  ### Core Principle (The Coordinated Harm Avoidance Principle)
  **"Conventions are morally binding when:**
  1. **They prevent tangible harm or exploitation** (Harm Clause), *or*
  2. **They enable essential social coordination** (Coordination Clause), *and*
  3. **The agent is reasonably aware of the convention** (Knowledge Clause).  
  **Visitors must prioritize local conventions satisfying (1) or (2), but may retain harmless home practices when local conventions don't apply. Locals may deviate from conventions when (1) and (2) are absent."**

  ---

  ### How It Explains Your Verdicts
  | **Case** | **Verdict** | **Application of Principle** |
  |----------|-------------|-----------------------------|
  | **1** (US sit-down tip) | Obligatory | **Harm Clause:** Tips replace wages (prevent worker exploitation). **Coordination Clause:** System relies on universal participation. |
  | **2** (US barista tip) | Optional | Neither clause: No wage reliance (harm absent); no coordination breakdown if some don't tip. |
  | **3** (Japan tipping) | Not wrong but awkward | **Coordination Clause:** Tipping disrupts local service norms (coordination harm). Not *morally* wrong because no exploitation, but violates visitor duty to follow local coordination conventions. |
  | **4** (UK queueing) | Obligatory | **Coordination Clause:** Prevents conflict/chaos; essential for fair resource access. |
  | **5** (Chaotic boarding) | Pressing not wrong; queueing not wrong | No convention exists → Neither clause applies. Pressing causes no harm if expected; queueing causes no harm (only inefficiency). |
  | **6** (Jaywalking, empty) | Not wrong | **Harm Clause:** No risk → no harm. Law lacks moral force without harm/coordination basis. |
  | **7** (Jaywalking w/child) | Wrong | **Harm Clause:** Teaches dangerous behavior (indirect harm). |
  | **8** (Visitor jaywalking where rare) | Wrong | **Coordination Clause + Visitor Duty:** Undermines local pedestrian/vehicle coordination. |
  | **9** (Local not tipping dying custom) | *Revised: Not wrong* | **Harm Clause Absent:** Worker paid living wage. **Coordination Clause Weak:** Custom dying → no systemic reliance. |

  ---

  ### Tensions and Resolution
  - **Case 5 vs. Cases 3/8:** Your verdict in Case 5 is consistent because chaotic boarding lacks a *stable convention* (no coordination to disrupt). In Cases 3/8, established conventions exist, and violating them causes coordination harm (awkwardness in Japan; safety precedent in jaywalking).  
  - **Case 9 Revision:** Your initial uncertainty is valid. The principle dictates that if the custom is dying *and* no harm occurs (fair wages), tipping is not obligatory. Your feeling of obligation stems from residual coordination expectations (if most still tip), but the *moral* duty fades when harm/coordination collapse. **Verdict should be: Not wrong to abstain.**

  ---

  ### New Case: Shoe Removal with Medical Condition
  **Scenario:** Visitor invited to a local home where shoe removal is expected, but visitor has a painful foot condition.  
  **Principle Application:**  
  - **Harm Clause:** Not removing shoes may dirty floors (minor harm), but forcing removal causes physical harm to visitor.  
  - **Coordination Clause:** Shoe removal maintains household order, but alternatives exist (e.g., clean socks, plastic covers).  
  - **Visitor Duty:** Weaker here; physical harm overrides coordination convention.  
  **Verdict:** **Not wrong to keep shoes on.** Visitor should explain and offer compromise (e.g., "May I wear medical shoe covers?"). The harm of physical pain outweighs coordination/harm concerns of the convention.

  ---

  ### Costs of Unification
  1. **You must abandon the "host's prerogative" emphasis.** Locals lack special moral privileges; deviations are only permitted when harm/coordination are absent (Case 6, revised Case 9).  
  2. **Case 9 verdict changes:** Not tipping in a dying custom with fair wages is acceptable.  
  3. **Case 5's "not wrong" verdict stands** but is reframed: Chaos implies *no effective convention*, so no duty exists for locals or visitors to follow one.  

  This principle unifies 8/9 verdicts (only Case 9 revised) and resolves your tensions by prioritizing **harm prevention** over coordination, and **coordination** over personal preference. It acknowledges that conventions derive moral weight from their social function—not tradition or law alone.
