answer: |-
  ## Research Proposal: Demarcating the Domain of Good’s Theorem: Option-Sets, Information, and Agent Stability

  **1. Title:** Beyond Non-Negativity: When Information Changes Options or Agents – A Formal Demarcation of Good’s Theorem’s Domain.

  **2. Principal Investigator:** [Your Name/Affiliation Here]
  **Duration:** 6 months (0.5 FTE)
  **Funding Requested:** [Specify Amount] for salary support and research expenses.

  **3. Abstract:**
  Good’s Theorem (1967) – stating the expected value of free information is non-negative – is a cornerstone of decision theory. Its common deployment as the slogan "more evidence cannot hurt" profoundly influences real-world decisions about evidence gathering. However, this project argues that the theorem’s mathematical validity and its practical applicability are distinct. The theorem crucially assumes information only updates beliefs over a *fixed* set of world-states, options, and stable agent preferences/capacities. This project proposes that Good’s Theorem is fundamentally a theorem about the value of *expanding contingent option sets under fixed preferences*, not about information *per se*. We will formally reconstruct this "option-set reading" and rigorously investigate its boundaries by analyzing probe cases where information *changes the option set itself* or *changes the agent*. The goal is a precise demarcation of the theorem’s domain, clarifying when the "non-negative value" claim holds, fails, or is ill-posed, thereby improving foundational understanding and practical application in evidence-seeking decisions.

  **4. Research Question & Significance:**
  **Core Question:** *Under what precise conditions does Good’s Theorem hold, and how does its domain of validity break down when information acquisition impacts the agent’s available option set or the agent’s own preferences, awareness, or deliberative capacities?*

  **Significance:** Good’s Theorem is frequently invoked as a conversation-ender ("just ignore it if it's bad!") in debates about seeking information (e.g., medical testing, AI safety probes, personal data acquisition). This reliance assumes the theorem’s assumptions (free, ignorable information; fixed options; stable agent) universally hold. However, anecdotal evidence from rationality forums and decision-theory discussions suggests deep unease with this application, particularly concerning self-referential information or paradigm-shifting knowledge. This project addresses this gap by:
  1.  **Providing Conceptual Clarity:** Formally distinguishing types of "informational change" and their impact on decision frameworks.
  2.  **Demarcating Validity:** Explicitly showing where the "non-negative value" claim derived from Good applies and where it does not, resolving long-standing conceptual ambiguities.
  3.  **Improving Decision Guidance:** Offering a more nuanced framework for evaluating the potential costs/benefits of evidence gathering, moving beyond an oversimplified slogan. This has implications for fields like behavioral economics, AI alignment, medical decision-making, and personal epistemology.

  **5. Background & Gap:**
  Good’s Theorem demonstrates that if an agent can freely acquire costless information and is free to ignore it, the expected utility of acquiring that information cannot be negative relative to acting without it. The proof relies on comparing the expected utility of the optimal policy contingent on the information to the expected utility of the single optimal act chosen without information. While mathematically sound under its assumptions, its practical interpretation as "more evidence never hurts" is problematic. Critics often point to apparent counterexamples (e.g., information causing recklessness, self-fulfilling prophecies, or existential dread), but these are typically dismissed as violating the theorem's assumptions (e.g., information isn't "free" psychologically, or preferences change).

  **The critical gap this project addresses:** Existing treatments either:
  *   **Assert the Theorem Rigorously:** But often fail to rigorously analyze *why* specific real-world cases feel like counterexamples and how they precisely violate the assumptions, treating assumption-violations as binary and homogeneous.
  *   **Describe Intuitive Counterexamples:** But lack a formal framework to classify *how* the violation occurs and what it implies for the theorem's core claim.
  *   **Focus on Instrumental vs. Intrinsic Value:** But do not systematically distinguish how information impacts the *structure* of the decision problem itself (options, possibilities) or the *agent*.

  This project proposes a novel "option-set reading": Good’s Theorem holds because information allows the construction of strictly more (or equally good) *contingent plans* within a fixed option set and preference ordering. The theorem's degradation occurs not when information is "costly" in a trivial sense, but when information acquisition fundamentally *alters the landscape* of possibilities or the agent making the choice. We lack a formal analysis grounding this intuition and demarcating its boundaries.

  **6. Methodology & Work Plan:**
  The project employs formal decision-theoretic modeling to reconstruct Good’s Theorem, articulate the "option-set reading," and rigorously analyze probe cases where information changes the agent or option set. This approach is chosen over ethnographic study of usage because:
  *   It directly addresses the *conceptual foundations* of the theorem and slogan.
  *   It provides the precision needed to *demarcate domains* and assess claim validity/ill-posedness.
  *   It builds tools usable by others for analyzing specific decision contexts.

  **Month-by-Month Plan:**
  *   **Month 1:** **Formal Reconstruction.** Develop a precise decision-theoretic model capturing Good’s standard assumptions. Explicitly formalize the "option-set reading," demonstrating how information acquisition equates to expanding the set of available *state-contingent strategies* under fixed options and preferences.
  *   **Month 2:** **Probe Case 1: Self-Referential Information.** Model the "Oracle Revealing Your Choice" case. Define the information structure (reveals the act the agent *will* choose), agent preferences (e.g., valuing spontaneity, fearing determinism), and decision process. Analyze formally: Does the theorem apply? Can the information be genuinely "ignored"? Does it change the agent's deliberative capacity or self-conception? What happens to the "non-negative value" claim?
  *   **Month 3:** **Probe Case 2: Expanding the Possibility Space.** Model the "Learning of a Previously Inconceivable Possibility" case. Define a prior state space lacking state S, an act set defined only over the prior space, and information that reveals S is possible. Analyze formally: Is the theorem's framework applicable? How can value be defined for acts undefined at S? Does this constitute a change in the *option set* (requiring new acts) or merely belief updating? Is "non-negative value" well-defined here?
  *   **Month 4:** **Synthesis & Demarcation.** Based on the probe analyses, develop a formal typology of informational impacts:
      1.  Belief updating over fixed states/options/preferences (Good’s Domain).
      2.  Changing the available option set (e.g., revealing new acts or invalidating old ones).
      3.  Changing the agent (preferences, awareness, deliberative trust).
      Formalize the conditions under which Good’s conclusion holds, fails, or becomes ill-defined for types 2 and 3. Refine the "option-set reading".
  *   **Month 5:** **Implications & Limitations.** Explore consequences: When does gathering evidence become potentially harmful *due to* its impact on options or the agent? How should rational agents deliberate about seeking such information? Critically assess the limitations of the formal model.
  *   **Month 6:** **Writing & Dissemination.** Draft journal article presenting the formal framework, probe analyses, typology, and implications. Prepare a public summary for relevant communities (LessWrong, EA Forum).

  **7. Expected Outcomes & Deliverables:**
  *   **Primary Deliverable:** A draft manuscript suitable for submission to a leading philosophy of science, decision theory, or economics journal (e.g., *Philosophy of Science*, *Journal of Philosophy*, *Theoretical Economics*).
  *   **Key Results:**
      *   A precise formal reconstruction of Good’s Theorem emphasizing the "option-set" interpretation.
      *   Formal models and analyses of the two probe cases demonstrating distinct failure modes.
      *   A formal typology distinguishing informational impacts on beliefs, options, and agents.
      *   A clear demarcation of the domain where Good’s "non-negative value" claim is valid, invalid, or ill-posed.
      *   Implications for rational evidence-gathering strategies.
  *   **Success Criteria:**
      *   A rigorous formal framework distinguishing the three informational impact types.
      *   Convincing demonstration that the probe cases lie outside Good’s original domain due to impacting options/agents, not merely violating assumptions trivially.
      *   Articulation of *why* the "non-negative value" claim breaks down in these cases (e.g., loss of comparability, redefinition of the agent).
      *   A coherent journal article draft.
  *   **Failure Mode:** The project fails if the probe cases can be fully re-assimilated into Good’s original framework without significant modification, or if the distinctions between informational types prove unfruitful or impossible to formalize rigorously. Failure would still yield a valuable negative result clarifying the theorem's robustness.

  **8. Scope & Feasibility (6 months, 0.5 FTE):**
  This project is realistically scoped as producing **one significant journal article**. It focuses on conceptual clarification and formal demarcation, not an exhaustive catalogue of applications or empirical studies. The 6-month half-time duration is sufficient for the proposed formal modeling, analysis of two probe cases, typology development, and manuscript drafting. The PI’s 15 years of engagement with the literature ensures deep familiarity with the arguments and existing critiques. The project leverages well-established decision-theoretic tools, making the formal work tractable within the timeframe.

  **9. Conclusion:**
  Good’s Theorem is a powerful result, but its sloganized form ("more evidence cannot hurt") is often misapplied, potentially leading to suboptimal or harmful evidence-gathering decisions. This project addresses a foundational gap by rigorously investigating the theorem’s boundaries, proposing it is fundamentally about option-sets under fixed preferences. By formally analyzing probe cases where information changes the agent or the options themselves, we will delineate the precise domain where the "non-negative value" claim holds and where it does not. The outcome will be a clearer, more nuanced understanding of the value of information, with practical implications for any domain where rational agents deliberate about seeking knowledge.
