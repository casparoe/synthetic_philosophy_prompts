prompt: |-
  I'm a science-and-ideas journalist and I'm working on a feature about how random bits of behaviour harden into rules that everyone follows. I've been interviewing a philosopher who works on convention in the Lewis tradition — roughly, the thought that a convention is an arbitrary regularity that sticks because it's a solution to a coordination problem, and everyone expects everyone else to keep doing their bit. I've been lobbing examples at her and getting verdicts back on whether each one is a convention, or a norm, or just a coincidence. So far:

  - driving on the left: convention
  - using pounds and pence to buy things: convention
  - calling a table a 'table' and not something else: convention
  - everyone at one particular firm using the same project-management software purely because everyone else there does: convention
  - two strangers on a narrow footpath both stepping to the same side: not a convention — it's a one-off, not a standing regularity
  - basically everyone sleeping at night rather than in the day: not a convention
  - a fashion that sweeps through a school and then vanishes: not a convention

  Now here's the case the piece actually turns on. In a small town there's an unwritten rule that if you're invited round for dinner you bring a bottle of wine; turn up empty-handed and nobody says anything, but you quietly stop getting invited. It's definately arbitrary — they could just as easily have settled on flowers or a pudding — everyone expects everyone else to do it, and everyone does it. But nobody's doing it because it sorts out a coordination problem; they're doing it because not doing it gets you frozen out.

  So: will she call that a convention? Tell me the rule she seems to be running across the examples above, and what other rules would fit those same examples just as well. Then give me your best guess at her verdict and the reasons for it, plus which of the earlier examples — or some new case I could put to her — would best tell those rules apart. If the examples genuinely don't settle it, say so, and spell out what principle she'd be signing up to with each answer; I suspect 'convention' ends up meaning something quite different depending on which way she goes, and I want to be able to say that fairly in the piece. One more thing — does the whole 'norms evolve' angle change any of this? Could something that starts out as a sanction-backed norm turn into a convention over time, or the other way round?

  British English please, and no need for citations or reading lists — just reason it out.
reasoning: |-
  Alright, let me tackle this query step by step. The journalist is exploring whether a specific dinner-invitation custom qualifies as a convention under the Lewis tradition. The key examples provided show a pattern: conventions solve coordination problems through arbitrary but stable regularities where mutual expectations matter. 

  First, I need to extract the implicit rule from the philosopher's verdicts. Driving side, currency, and language all involve coordination—without a shared standard, chaos ensues. The footpath example fails because it's a one-off, while sleeping patterns are biologically driven, not arbitrary. The office software case is interesting: it's convention despite lacking a coordination problem per se, but survives because expectations are self-reinforcing. 

  Now the dinner case. Bringing wine avoids social sanctions, not coordination failure. But Lewis's definition has grey areas—he mentions sanctions as possible motivators. The office software example suggests that even sanction-backed behaviors could be conventions if they're expectations-driven solutions. However, the philosopher might draw a line: coordination problems require interdependent choices, whereas dinner gifts feel like unilateral compliance. 

  The "norms evolve" angle complicates things. A sanction-backed norm could become convention if sanctions fade and mutual expectations take over. Conversely, a convention might develop sanctions if deviations increase. 

  For a test case, I'd propose a hybrid: say, a town where everyone brings wine because they expect others to, but also fear sanctions. If the philosopher calls it convention, she prioritizes expectations over coordination; if not, she requires explicit coordination. 

  Ultimately, I think she'd rule "not convention" for the dinner case, seeing sanctions as primary. But the office software precedent makes it debatable. The core tension is whether avoiding coordination failure is essential or if self-sustaining expectations suffice.
answer: |-
  Based on your philosopher's pattern of verdicts and the Lewis tradition, here's the breakdown for your dinner party case:

  1.  **The Rule She Seems To Be Running:**
      The core principle emerging from her verdicts appears to be: **A convention is an *arbitrary*, *self-sustaining* solution to a *recurrent coordination problem*, where the primary motivation for individual conformity is the *mutual expectation* that others will conform and the desire to coordinate successfully.** Let's unpack that:
      *   **Arbitrary:** Multiple solutions are possible (driving left/right, £/€, "table"/"mensa").
      *   **Self-Sustaining:** It persists because everyone expects everyone else to follow it, and acting on that expectation reinforces it (Lewis's "common knowledge" element). The office software is the purest example of this self-perpetuating expectation loop.
      *   **Solves a Coordination Problem:** The core *reason* the regularity exists and persists is to avoid the mutual disadvantage of coordination failure (traffic chaos, market inefficiency, communication breakdown, software incompatibility). This is the crucial differentiator in her rulings.
      *   **Mutual Expectation as Primary Motivation:** People drive on the left *primarily* because they expect others to and want to avoid a crash, *not* primarily because they fear a fine (though that might exist). They use "table" expecting to be understood.

  2.  **Other Rules That Fit the Same Examples:**
      You could replace "solves a recurrent coordination problem" with "provides a mutually beneficial equilibrium in a situation of strategic interdependence" and get the same verdicts. This is essentially Lewis's core idea. The key is the *interdependence* and the *mutual benefit of aligning actions*.

  3.  **Best Guess at Verdict for the Dinner Case: NOT a Convention.**
      *   **Reasoning:** While it's arbitrary, a standing regularity, and sustained by mutual expectations and sanctions, **it lacks a core coordination problem.** What mutual disadvantage is avoided by everyone bringing wine? Coordination failure would be *not knowing what gift to bring*, leading to awkwardness or mismatched gifts. But in this case:
          *   The sanction (being frozen out) isn't for causing *coordination failure* (like causing a crash by driving on the wrong side). It's for violating a *social rule of reciprocity* or *showing ingratitude*.
          *   People bring wine primarily *to avoid the sanction* (social disapproval, exclusion) and fulfill an obligation, *not* primarily to solve a problem of coordinating actions with others. The *problem* being solved is individual: "How do I avoid offending my host/getting excluded?" not "How do we collectively avoid the mess of incompatible gift-giving?".
          *   It resembles a **social norm of reciprocity** backed by sanctions, rather than a solution to a coordination dilemma. The focus is on the *obligation* and the *sanction*, not on aligning interdependent choices for mutual benefit.

  4.  **Telling the Rules Apart - A Test Case:**
      To distinguish the "coordination problem" core from the "sanction-backed norm" aspect, propose this scenario:
      *   **"The Ambiguous Greeting Town":** In a small town, newcomers are unsure whether to nod, say "hello," or tip their hat when passing. Initially, there's confusion and awkward silences. Over time, tipping hats becomes the dominant behaviour. Crucially:
          *   **Variant A (Convention):** Everyone tips hats because they expect others to tip hats, and this simple, shared expectation reliably avoids the awkwardness of mismatched greetings. There's no real *sanction* beyond the momentary coordination failure itself (the awkwardness).
          *   **Variant B (Norm):** While tipping hats avoids awkwardness, the *primary* reason people do it now is that those who fail to tip their hats are perceived as rude or aloof. They face gossip, cold shoulders, or exclusion from minor social events – sanctions distinct from the original coordination problem.

      *   **What it Reveals:**
          *   If she calls **Variant A** a convention, she emphasises the coordination problem solution *even without sanctions* beyond the failure itself. The mutual expectation solves the problem.
          *   If she calls **Variant B** *not* a convention (or less purely one), she's likely drawing a line where significant *external sanctions* (social disapproval beyond the coordination failure) become the primary motivator, overshadowing the coordination aspect. She'd probably say Variant B has become a norm.
          *   Your **Office Software** example sits close to Variant A – the sanction *is* the minor coordination failure (incompatibility, inefficiency) and the expectation loop sustains it. Your **Dinner Gift** case sits closer to Variant B – the sanction (exclusion) is distinct and severe, targeting the violation of reciprocity, not solving a coordination failure.

  5.  **Do the Examples Settle It?**
      Not definitively. The **Office Software** example is the grey area pushing the boundaries. It *lacks* a strong coordination problem *now* (new hires could use different software *if* they could coordinate a switch, but they can't). It persists *purely* on the self-fulfilling expectation. Your philosopher called it a convention, suggesting she allows that the *original* coordination problem (avoiding incompatible files/chaos) sets up the expectation loop, even if the *current* motivation is primarily "because everyone else does" (expectation) rather than actively avoiding chaos.

      **The Principle at Stake:**
      *   **Calling Dinner Gift a Convention:** This broadens "convention" significantly. It prioritises the *structure*: arbitrary regularity + mutual expectation + sanctions sustaining it. The *origin* (solving coordination) becomes less important than the *current self-sustaining mechanism* of expectations. It risks blurring into all stable social norms.
      *   **Calling Dinner Gift NOT a Convention (as guessed):** This insists on the core *functional* element: conventions exist *because* they solve a specific type of problem – coordination dilemmas. It keeps the category narrower and more distinct from other norms based purely on obligation, reciprocity, or morality, even if those norms also use expectations and sanctions.

  6.  **The "Norms Evolve" Angle:**
      Absolutely, this changes things dynamically:
      *   **Norm -> Convention:** Imagine the dinner gift starts as a strict norm of reciprocity with strong sanctions. Over generations, the *reason* shifts. People forget the strict reciprocity; they just bring wine because "that's what one does when invited, everyone expects it, and it makes the evening smoother" (avoiding the minor coordination failure of *uncertainty* about gift-giving customs). The *sanction* weakens to mild surprise or a raised eyebrow, not exclusion. The *primary* motivation becomes fulfilling the expected role to coordinate smoothly. It could become a convention.
      *   **Convention -> Norm:** Conversely, a pure coordination convention (like hat-tipping to avoid awkwardness - Variant A) could acquire moral weight. Failing to tip your hat might come to signify disrespect, not just a coordination blip. Sanctions become harsher and more moralised (gossip, exclusion). It transforms into a norm.
      *   **Impact on the Verdict:** This evolution makes pinning down a *current* status tricky. Your philosopher might focus on the *current primary motivation and functional role*. Does bringing wine currently solve a coordination problem *as its main function*, or is it primarily about fulfilling an obligation under sanction? The evolution angle highlights that the line can be fluid, but Lewis's definition provides a snapshot of the *current* sustaining reason.

  **Conclusion for Your Piece:**

  Your philosopher is likely to rule the **dinner gift case is NOT a convention**, based on the pattern you've shown. Her implicit core rule is that conventions are fundamentally **arbitrary solutions to recurrent coordination problems, sustained primarily by the mutual expectation of conformity.** The dinner gift lacks the coordination problem; it's a sanction-backed norm of reciprocity. The key difference lies in whether the regularity exists *primarily* to solve interdependent choice problems (convention) or to enforce social obligations/reciprocity/morality under threat of sanction (norm).

  The **Ambiguous Greeting Town** test case best highlights this distinction. The **Office Software** example shows her stretching the definition to include expectation loops *originating* from coordination, even if the immediate problem is less salient. The "norms evolve" angle is crucial context – the categories aren't always static, but Lewis provides a lens for the *current* functional reason a regularity persists. Recognising this distinction allows you to fairly present the debate: does "convention" hinge on solving coordination problems, or is it defined by the structure of arbitrary rules sustained by mutual expectations, regardless of their original or current function? Your philosopher clearly leans towards the former.
