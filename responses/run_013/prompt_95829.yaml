prompt: |-
  Next month I'm giving a talk to the epi/biostat crowd in my department -- mostly potential-outcomes people (a couple of them teach the standard causal inference course, one is a DAG evangelist, and there's a sociologist who works on social determinants and rolls his eyes at anything that smells like "manipulable cause"). I'm defending the claim that interventionism should be the fundamental theory of causation and that the counterfactual / potential-outcomes framework is downstream of it: basically a bookkeeping device that already presupposes an interventionist reading of what "the treatment" is. The new bit is a distinction I draw between thin interventions (a hypothetical knob, specified only by what it breaks) and thick ones (backed by a mechanism some agent could actually have carried out), and I argue the standard machinery only really earns its keep for the thin ones. I still dont have my Q&A sheet ready. Give me one: the eight or so objections I'll actually get from this audience, phrased in their vocabulary, ordered by how much damage they'd do, each with a ~2-minute reply and a note on where the reply is soft, plus what I should concede up front and the one question I'm hoping nobody asks. American English please.
