  We are designing a two-module activity for a 90-minute seminar on weakness of will and hyperbolic discounting. The goal is to help students distinguish between the two phenomena.

  Constraints:
  - Materials: tokens, slips of paper, timer, whiteboard. No real money.
  - Two modules: 
    1. A temporal discounting module with a preference reversal scenario and optional commitment device.
    2. A module without temporal structure: an aversive task that participants endorse but may fail to do.
  - Debrief that maps the experiences to concepts.

  Module 1: Temporal Discounting with Commitment Device

  Goal: Show preference reversal (choosing larger-later when both are future, then switching to smaller-sooner when it becomes immediate) and how commitment devices can be used by sophisticated agents to bind themselves. We want to see naive, sophisticated, and resolute behavior.

  Design choices for the reversal:
  We need a rule-set that naturally produces hyperbolic discounting. Common methods include:
  a) Using real time delays (but we have 90 minutes and don't want to wait days).
  b) Simulating time with stages in the activity.

  Given time constraints, we simulate time with stages. We have two rewards: smaller-sooner (SS) and larger-later (LL). We have two decision points:
    - At t0 (both rewards in the future): choose between SS (available at t1) and LL (available at t2).
    - At t1 (SS is now immediate, LL is still future): choose again.

  To make the reversal happen, we set the rewards such that at t0, the discounted value of LL is higher than SS, but at t1, the immediate SS is more attractive than the LL (which is now only one period away). We can achieve this by using a hyperbolic discount function.

  Rule-set options:

  Option A: Explicit discounting with tokens.
    - Let tokens be the currency. We set:
        SS: 10 tokens at t1
        LL: 15 tokens at t2
    - Discount function: value at time t = tokens / (1 + k * delay)
    - We choose k such that at t0 (delay for SS=1, for LL=2):
        Value(SS) = 10/(1+k) 
        Value(LL) = 15/(1+2k)
        We want Value(LL) > Value(SS) at t0 -> 15/(1+2k) > 10/(1+k) -> solve: 15(1+k) > 10(1+2k) -> 15+15k > 10+20k -> 5 > 5k -> k<1.
        Then at t1 (delay for SS=0, for LL=1):
        Value(SS) = 10
        Value(LL) = 15/(1+k)
        We want Value(SS) > Value(LL) -> 10 > 15/(1+k) -> 10(1+k) > 15 -> 10+10k>15 -> 10k>5 -> k>0.5.
        So if we set k between 0.5 and 1, we get reversal.

  But we don't want to explain discount functions to students. We want reversal to emerge naturally.

  Option B: Use a simple binary choice without explicit math. We can use a common finding: when the delay to the SS reward is very short, people often switch.

  We can structure the activity in three periods (t0, t1, t2). At t0, participants choose between:
     Option A: 10 tokens at t1 (so one period wait)
     Option B: 15 tokens at t2 (two periods wait)

  Then at t1, they are given the option to switch: they can take 10 tokens immediately (which is the SS) or they can stick to the original choice and wait until t2 for 15. But we want to see if they reverse.

  However, we must ensure that at t0 they prefer the 15 at t2, but at t1 they take the 10 immediately.

  We can set the tokens to be redeemable for small rewards (like candy or extra credit points) to make it salient. But we are using tokens and no real money, so we need to make the tokens valuable in the context.

  Alternatively, we can use a points system that they care about (e.g., the points will determine their grade for participation in the activity, or they can be exchanged for small treats). But to keep it simple, we'll use tokens that can be exchanged for a reward at the end (e.g., each token = one slip in a raffle for a book or candy).

  But we also want to introduce a commitment device: a way to bind themselves at t0 to not switch at t1.

  Design:

  Each participant starts with 5 tokens (to spend on commitment if they wish).

  At t0 (beginning of activity):
    - They are presented with two plans:
        Plan SS: Receive 10 tokens at t1 (which is in 5 minutes) and 0 at t2.
        Plan LL: Receive 0 at t1 and 15 tokens at t2 (which is in 10 minutes).
    - They choose one plan to commit to. But note: at t0 they are only making a non-binding choice? Actually, we want to see if they reverse at t1.

  We can structure it as:

  Step 1 (t0): 
    - Explain that there will be two reward points: t1 (in 5 minutes) and t2 (in 10 minutes).
    - They must choose between:
        Option A: 10 tokens at t1
        Option B: 15 tokens at t2
    - They write their choice on a slip (without name? or with? we need to track).

  But then at t1, we give them a new choice: they can either take 10 tokens immediately (which is the SS) or wait until t2 to get 15 tokens (LL). 

  We predict that at t0, most choose LL. At t1, many will switch to SS.

  Now, to introduce commitment: 
    - At t0, before they make the choice, we offer a commitment device. For 1 token (from their initial 5), they can buy a device that will remove the option to switch at t1. That is, if they choose LL at t0 and buy the commitment, then at t1 they are not given the choice to switch; they are bound to wait for t2. If they don't buy it, then at t1 they have the option to take SS instead.

