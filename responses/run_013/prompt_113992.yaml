    - Tokens (or slips representing tokens to be redeemed at the end)
    - Initial endowment: 5 tokens per student (given at start)
    - Choice slips for module1

  Rules:
    - There are two reward times: 
          t1: in 5 minutes (from now)
          t2: at the end of class (about 85 minutes from now)
    - Options:
          Option SS: 10 tokens at t1
          Option LL: 15 tokens at t2
    - At t0 (now):
          Each student chooses either SS or LL.
          If they choose LL, they can choose to buy a commitment device for 1 token (paid from their initial 5). If they buy it, they cannot change their choice at t1. If they don't buy it, then at t1 they can choose to switch to SS (and get 10 tokens at t1) or stick to LL.
          If they choose SS, they do nothing else and will get 10 tokens at t1.
    - At t1 (5 minutes later):
          - Students who chose SS: given 10 tokens (or a slip for 10 tokens).
          - Students who chose LL with commitment: nothing at t1 (they wait until t2).
          - Students who chose LL without commitment: they are given a choice: 
                - Switch to SS: get 10 tokens now (at t1)
                - Stick to LL: get 15 tokens at t2
          We record their choice.
    - At t2 (end of class): 
          - Students who are due LL tokens (those who chose LL and didn't switch) are given 15 tokens.

  Module 2: Aversive Task

  Materials:
    - Worksheets with arithmetic problems (e.g., 50 problems: 2-digit addition, like 34+57=?)
    - Timer
    - Tokens (or slips) for reward

  Rules:
    - The task: work on the arithmetic problems for 3 minutes without stopping. If you work continuously until the timer rings, you get 10 tokens. If you stop before (put down your pen and do not resume for more than 10 seconds), you get nothing.
    - Before the task: 
          Ask: "Do you judge that completing the task for 10 tokens is worth doing?" 
          Students write their name and answer (yes/no) on a slip and hand it in.
    - Then start the timer and have them work. The instructor monitors and notes any who stop early.
    - After 3 minutes, collect worksheets and record who completed the task.

  Debrief Outline:

    1. Report the results of module1:
          - How many chose LL at t0? How many bought commitment?
          - At t1, how many of those without commitment switched?
          - Discuss: why did they switch? Did they change their mind about which option was better? Or did they still think LL was better but took SS anyway? (Ask the students who switched.)

    2. Report the results of module2:
          - How many endorsed the task as worth doing?
          - How many actually completed it?
          - Ask those who stopped: at the moment you stopped, did you change your mind about it being worth doing? Or did you still think it was worth doing but couldn't make yourself continue?

    3. Compare the two:
          - In module1, the reversal was due to time (immediacy of SS). In module2, the failure was due to what?
          - Is the failure in module2 a case of weakness of will? 
          - How does it relate to discounting? (In module2, there is a delayed reward and immediate cost. But the judgment was stable.)

    4. Philosophical questions:
          - What is weakness of will? (Acting against one's better judgment at the time of action.)
          - Can hyperbolic discounting explain weakness of will? Or are they distinct?
          - The skeptical challenge: can one ever act against one's own all-things-considered judgment? (If you act, doesn't that reveal that you judged it best at that moment?)

    5. Conclude by connecting to the readings.

  This design should meet the goals.
answer: |-
  Below is a comprehensive activity design for your seminar, structured to meet your pedagogical goals while adhering to practical constraints. The activity uses tokens (e.g., poker chips), slips of paper, a timer, and a whiteboard. Total runtime fits within 90 minutes, including setup and debrief. The design emphasizes experiential learning to disentangle **akrasia** (weakness of will) from **hyperbolic discounting** (time-based preference reversal) by forcing students to confront both phenomena through choices.

  ---

  ### **Activity Design: "Commitment, Collapse, and Choice"**
  **Core Insight:**  
  Students experience hyperbolic discounting (Module 1) and akrasia (Module 2) separately. Module 1 uses intertemporal rewards to generate preference reversal, commitment devices, and three agent-types (naive, sophisticated, resolute). Module 2 removes time pressure entirely, using an immediate aversive task to elicit judgment-action gaps. The debrief maps these experiences to philosophical distinctions.

  **Materials:**  
  - Tokens (200+; 1 token = 1 entry in a raffle for a book/candy).  
  - Slips of paper ("choice cards," "endorsement cards," "token trackers").  
  - Timer.  
  - Whiteboard (track choices, tally results).  
  - Envelopes (for commitment devices).  

  **Payoff Scheme:**  
  - Tokens translate to probabilistic rewards (e.g., 10 tokens = 10% chance of winning a $10 book). This avoids real-money incentives while preserving stakes.  
  - Module 1: Rewards delivered at **t₁** (5 min into future) and **t₂** (end of class).  
  - Module 2: Reward delivered at end of class.  

  ---

  ### **Running Order & Timings**  
  | Time  | Phase              | Key Actions                                                                                                                                 | Rationale                                                                 |
  |-------|--------------------|---------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | 0-10’ | **Intro & Setup**  | Explain rules, distribute 5 tokens + 2 choice cards/student. Use whiteboard: "SS = 10 tokens at t₁ (5 min), LL = 15 tokens at t₂ (85 min)". | Frame activity as "choice experiment"; tokens are raffle entries.         |
  | 10-25’| **Module 1: Discounting** | Run Stages 0–2 (details below).                                                                                               | Elicits preference reversal via time delays. Commitment devices optional. |
  | 25-40’| **Module 2: Akrasia**     | Run task + endorsement (details below).                                                                                         | Removes time pressure; focuses on judgment-action gaps.                   |
  | 40-75’| **Debrief**        | Map results to concepts (detailed below).                                                                                       | Analyze differences; confront conflation.                                 |
  | 75-85’| **Payout**         | Distribute LL tokens (Module 1) + task rewards (Module 2). Draw raffle.                                                           | Reinforce consequences of choices.                                        |
  | 85-90’| **Wrap-up**        | Collect feedback.                                                                                                                      | Refine for future runs.                                                   |

  ---

  ### **Module 1: Hyperbolic Discounting & Commitment Devices**  
  **Goal:** Generate preference reversal (LL → SS) via temporal structure. Reveal naive/sophisticated/resolute agents through commitment purchases.  
  **Rules:**  
  1. **Stage 0 (t₀): Initial Choice**  
     - Students choose between:  
       - **SS**: 10 tokens at **t₁** (5 minutes from now).  
       - **LL**: 15 tokens at **t₂** (end of class).  
     - *Then*, they decide whether to spend 1 token on a **commitment device** (only if they chose LL).  
       - Device: Seal LL choice in an envelope. If used, they **cannot switch** at t₁.  
     - Students write choices on **choice cards** (e.g., "LL + commitment," "SS").  

  2. **Stage 1 (t₁): Reversal Test (5 min later)**  
     - **SS-choosers**: Receive 10 tokens immediately.  
     - **LL-choosers**:  
       - *Without commitment*: Choose again: take 10 tokens **now** (SS) or wait for 15 at t₂ (LL).  
       - *With commitment*: No choice; hold empty envelope (cannot switch).  
     - Record switches (LL → SS) on whiteboard.  

  3. **Stage 2 (t₂): Final Payout**  
     - Deliver 15 tokens to LL-choosers who didn’t switch.  

  **Predicted Outcomes:**  
  - **Naive**: Choose LL without commitment, then switch to SS at t₁ (≈60-70% of LL-choosers).  
  - **Sophisticated**: Choose LL + commitment, avoid temptation.  
  - **Resolute**: Choose LL without commitment, stick with LL at t₁.  
  - **SS-choosers**: No reversal (consistent impatience).  

  **Why this rule-set?**  
  - **Discounting via Immediacy**: The 5-min vs. 85-min delay leverages hyperbolic discounting (SS feels "larger" when immediate). Tokens are identical, so reversal is purely time-driven.  
  - **Commitment Devices**: Binding but costly (1 token), so only sophisticates buy them. Resolutes emerge organically.  
  - **Alternatives Considered**:  
    - *Fixed-delay*: Avoided—real delays (e.g., 1 week) are impractical.  
    - *Points system*: Avoided—tokens are tangible and avoid math confusion.  
    - *No commitment option*: Rejected—loses sophistication/resolution contrast.  

  ---

  ### **Module 2: Akrasia Without Time**  
  **Goal:** Elicit judgment-action gaps in a timeless context. No discounting possible.  
  **Rules:**  
  1. **Endorsement**:  
     - Announce: "Complete a 3-minute task for 10 tokens. Task: Copy a paragraph backward (e.g., 'ethics' → 'scithe')."  
     - Students write on **endorsement cards**: "I judge this task worth doing for 10 tokens" + name. Collect cards.  

  2. **Task Execution**:  
     - Start 3-minute timer. Students begin writing.  
     - **Rule**: Must write continuously. If they stop for >10 sec, task "failed."  
     - Instructor monitors; notes quitters on whiteboard.  

  3. **Payout**:  
     - 10 tokens only to those who complete the task.  

  **Predicted Outcomes:**  
  - 100% endorsement (task is tedious but low-stakes).  
  - ≈30-50% fail (stop early due to boredom/frustration).  
  - **No temporal excuse**: Reward is fixed/delayed identically for all (end of class).  

  ---

  ### **Debrief (40-75’)**
  Map student experiences to philosophical distinctions. Use whiteboard to tally results from both modules.  

  #### **Guided Questions & Concepts:**  
  1. **Module 1 Analysis (Discounting):**  
     - *Preference Reversal*: "Who switched from LL to SS? At t₀, did you believe LL was better? At t₁?"  
       - **Key Distinction**: Hyperbolic discounting is about *changing preferences* due to time—not necessarily acting against a current judgment. Switchers often say: "At t₁, SS felt better."  
     - *Agent-Types*:  
       - Naive: Unaware of future weakness ("I’ll wait!" → switch).  
       - Sophisticated: Self-aware, pays to bind.  
       - Resolute: Sticks to original plan.  
     - *Normative Question*: "Did the ‘later self’ who took SS do something wrong, or just change? Was your t₀ judgment *yours*, or assigned?"  

  2. **Module 2 Analysis (Akrasia):**  
     - *Judgment-Action Gap*: "Who endorsed the task but quit? While quitting, did you still believe it was worth doing?"  
       - **Key Distinction**: Akrasia is acting *against a standing judgment* (no preference change). Quitters often admit: "I knew I should continue, but I couldn’t."  
     - *Temporal Gap?*: "Did time play a role here? If not, is this distinct from Module 1?"  

  3. **Contrast & Synthesis:**  
     - "Is weakness of will just ‘caring about now’? Module 1 had time pressure; Module 2 did not. Yet both had failures. Are these the same phenomenon?"  
     - **Critical Distinctions**:  
       | **Hyperbolic Discounting**              | **Akrasia**                          |  
       |----------------------------------------|--------------------------------------|  
       | Preference reversal across time.       | Judgment-action gap (timeless).      |  
       | Temptation from immediacy.             | Temptation from aversion.            |  
       | Changing preferences.                  | Stable but overridden judgment.      |  
     - **Skeptical Challenge**: "Can you *truly* act against your all-things-considered judgment? Or did Module 2 quitters ‘change their mind’ mid-task? What does this imply for akrasia?"  

  4. **Conceptual Takeaways**:  
     - Akrasia requires a *synchronic conflict* (judgment vs. action at one time).  
     - Discounting is *diachronic* (preferences shift across time).  
     - Commitment devices "solve" discounting but not akrasia (e.g., Module 2 had no binding tool).  

  ---

  ### **What Could Go Wrong & Recovery**  
  1. **Module 1 Reversal Fails**:  
     - *Risk*: Students are too patient (no LL → SS switches).  
     - *Fix*: Adjust delays/rewards next time (e.g., shorter t₁ delay, bigger SS reward). **Recovery now**: Contrast with predicted reversal ("Why no switches? Is waiting easier than expected?").  

  2. **Commitment Underuse**:  
     - *Risk*: Few buy devices (losing sophistication contrast).  
     - *Fix*: Pre-activity example: "Imagine wanting to diet but buying junk food—commitment devices prevent that."  

  3. **Module 2 High Compliance**:  
     - *Risk*: All complete the task (no akrasia cases).  
     - *Fix*: Make task harder (e.g., transcribe a dense philosophical paragraph backward). **Recovery now**: Focus on "near misses" (e.g., "Who almost quit? What stopped you?").  

  4. **Logistical Delays**:  
     - *Risk*: Module 1 runs long.  
     - *Fix*: Use a timer strictly; prepare materials in advance.  

  ---

  ### **The Limitation: What the Activity Cannot Capture**  
  **Honest Assessment**:  
  This activity cannot fully simulate the *phenomenology of judgment* central to akrasia. In Module 2, students might rationalize quitting ("It wasn’t worth it after all") rather than experience genuine conflict between judgment and action. This mirrors the skeptical challenge: Can we ever *know* someone acts against their contemporaneous judgment? The activity provides behavioral evidence (endorsement + failure), but the inner certainty of "I knew better but did otherwise" requires first-person reflection. You must **supply this conceptually** by linking to Davidson (1969) — akrasia as "irresistible desire overriding all-things-considered judgment" — and the response that self-deception or judgment-suspicion often masks true akrasia. The activity sets the stage, but you’ll need to guide students to interrogate their own experiences: *"When you quit Module 2, were you lying to yourself? Or did you feel the judgment collapse?"*  

  ---

  ### **Final Notes**  
  - **Why This Design?** It isolates discounting (temporal) and akrasia (judgmental) while using parallel reward structures. The commitment device in Module 1 and the endorsement in Module 2 create "choice fossils" for analysis.  
  - **Cost**: Tokens/slips are negligible; task materials are printer paper.  
  - **Outcome**: Students leave with embodied distinctions—e.g., "Discounting feels like changing your mind; akrasia feels like self-betrayal."  

  This design transforms abstract conflation ("weakness of will = caring about now") into a lived puzzle, forcing students to reconcile their actions with theory. Run it as a lab, and let their choices fuel the debate.
