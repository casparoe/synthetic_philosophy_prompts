prompt: |-
  OK so I've been going back and fourth on this for weeks and I'd like someone to just lay the principle out for me.

  Here's what I think about trading one person's skin for other people's welfare, going by gut. Breaking a stranger's finger (no warning, no consent) to save a different stranger's life: fine. Giving a million people a bad headache for a day to save one stranger's life: also fine. Taking $100 from each of a million people to pay for a life-saving operation for one stranger: fine. Killing one innocent stranger to save five: not fine. Killing one to save a hundred: still not fine, and honestly I want to say not fine at any number. But killing one to save a million and my gut wobbles — I think I'd say fine, and I hate that, because it makes the number matter at exactly the point where I said it can't. Blinding one stranger to save a million people from a day-long headache: not fine, no question, even though it's a million people.

  The rule I've been telling myself is what I call the one-way street: you can pile up lots of small burdens on lots of people to buy one big benefit for somebody, but you can never put a big burden on one person to buy benefits for any number of others. That gets the headaches, the $100, the five and the blinding right, I think. It doesn't obviously get the finger case, since that's one small burden on one person rather than lots of people, and it tells me to drop the save-a-million verdict, which I'm not sure I can do. It's hard to seperate my gut here from the rule, which is sort of the problem.

  I take it this is a contractualist sort of question — not whether the world comes out better on net, but whether every person affected could reasonably accept the rule that lets it happen — and I want to know whether that framing helps or whether it just moves the bump under the rug.

  So what's the principle? Is there a version of the one-way street that lets me aggregate the small stuff without letting the big stuff get aggregated away? Test it against my cases, tell me what it says about ones I haven't listed, and be honest about which of my verdicts it has to overrule.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no summing up at the end.
reasoning: |-
  Okay, the user is wrestling with a classic ethical dilemma about trading one person's harm for the greater good. They've outlined several scenarios where their gut reactions conflict, especially around whether small harms to many can justify saving a life versus imposing a major harm on one person to save many. Their proposed "one-way street" rule feels inconsistent when applied to cases like breaking a finger to save a life or killing one to save a million.  

  The user explicitly references contractualism—focusing on whether affected parties could reasonably accept the rule—as their preferred framework. They want a principle that allows aggregating minor harms (like headaches or small financial losses) but blocks major sacrifices (like killing or blinding), even for vast benefits. Their frustration is palpable: they dislike their own wavering on the "kill one to save a million" case and want clarity without rug-sweeping.  

  Breaking this down:  
  First, the finger-breaking case seems permissible because acute but temporary bodily harm (a broken finger) is non-catastrophic and reversible, while saving a life is existential. Contractualism might accept this as a "moderate burden" rule.  
  Second, minor inconveniences (headaches, $100 losses) are clearly aggregatable—no one could reasonably veto a rule allowing trivial sacrifices to prevent death.  
  Third, killing/blinding fails because imposing irreversible, life-altering harm violates a fundamental right to bodily integrity; no social benefit justifies that non-consensual override.  
  The "one to save a million" wobble arises because death feels uniquely absolute—but the principle must hold firm here too, or it collapses into pure utilitarianism.  
  Finally, aggregation only works below a threshold where individual burdens stay non-devastating. The finger case sits right on that line, which is why it's edge-casey but still permissible.  

  The user’s hidden tension: they crave moral consistency but fear their intuition betrays them at scale. A robust principle must override that million-lives wobble—hence point 4’s bluntness. No sugarcoating.
answer: |-
  Here are five principles addressing your dilemma, grounded in contractualist reasoning:

  1.  **Permissible Aggregation Threshold:** Aggregating many *minor, reversible burdens* (like headaches or small financial losses) to prevent a *catastrophic loss* (like death) is permissible, as no individual can reasonably reject a rule allowing this trade-off given the triviality of their burden relative to the harm prevented.
  2.  **Major Sacrifice Prohibition:** Imposing a *severe, irreversible, or life-altering burden* (like death, blindness, or permanent disability) on an innocent, non-consenting individual is forbidden, regardless of the aggregate benefit to others; individuals can reasonably reject rules permitting such profound violations of their bodily integrity and life prospects.
  3.  **Non-Aggregation of Major Burdens:** Severe individual burdens *cannot be aggregated* to outweigh another severe burden. Saving multiple lives does not justify imposing death or equivalent devastation on one innocent person; the type of burden matters more than the number.
  4.  **Limited Moderate Burden Exception:** Imposing a *moderate, temporary burden* (like a broken finger) to prevent a catastrophic loss (death) is permissible under necessity; the burden is significant but non-permanent and non-life-destroying, making it potentially acceptable to the bearer compared to allowing death.
  5.  **Threshold for Aggregation:** Aggregation applies *only below a severity threshold*. Burdens must remain non-catastrophic, non-permanent, and contextually minor for the individuals bearing them to be aggregated against a major harm; crossing this threshold (e.g., to blinding or death) invalidates aggregation.

  **Against your cases:**
  *   **Breaking finger to save life (Fine):** Allowed by #4 (moderate burden exception).
  *   **Million headaches for one life (Fine):** Allowed by #1 (aggregation of minor burdens).
  *   **$100 from million for one life (Fine):** Allowed by #1 (aggregation of minor burdens).
  *   **Kill one to save five/hundred (Not Fine):** Forbidden by #2 & #3 (prohibition on major sacrifice, no aggregation of major burdens).
  *   **Kill one to save million (Not Fine):** Forbidden by #2 & #3 (overrules your wobble).
  *   **Blinding one to save million headaches (Not Fine):** Forbidden by #2 (major sacrifice prohibition).
