answer: |-
  ### Final Examination: Philosophy of Physics Seminar  
  **Time Allowed:** 90 minutes  
  **Total Marks:** 20  

  ---

  **Question:**  
  A "measure-agnostic Everettian" accepts the branching structure of the wavefunction in the many-worlds interpretation (MWI) and the completeness of unitary dynamics. However, they reject the Born rule’s claim that squared amplitudes normatively govern credences or bets. Instead, they adopt a *branch-counting rule*: all branches emerging from a measurement are equally probable, regardless of their amplitudes.  

  1. **Explain the most fundamental objection to branch-counting.** Why does this objection appear fatal to the project of assigning probabilities in MWI? (6 marks)  
  2. **Evaluate two responses** the measure-agnostic might offer:  
     - (a) They could propose a "preferred basis" to fix branch counts. What must this basis achieve, and what does conceding the need for it imply about the relationship between physical structure and probability? (5 marks)  
     - (b) They might turn to *decision theory* (e.g., an argument showing rational agents must bet *as if* amplitudes are probabilities). Does this "derive" the Born rule from non-probabilistic axioms, or does it presuppose the very measure it seeks to justify? Defend your view. (5 marks)  
  3. **Assess the self-locating-uncertainty approach**: If an agent in a pre-measurement state wonders, "What will *I* observe?," does this uncertainty generate normative probabilities for beliefs, or only pragmatic rules for actions? What gap, if any, does this leave in justifying the Born rule? (4 marks)  

  *(Your answer must engage the conceptual tensions outlined. Do not rehearse standard explanations of decoherence or list derivations without analyzing their philosophical foundations.)*  

  ---

  ### Model Answer (≈800 words)  

  #### 1. The Basis-Dependence Objection and Its Implications (6 marks)  
  The fatal flaw in branch-counting is **basis-dependence**. In quantum mechanics, a single wavefunction can be decomposed into branches in infinitely many ways (e.g., position/momentum bases), yielding contradictory branch counts for the same physical state. For instance, a spin measurement in the $z$-basis might yield two branches ($\uparrow$, $\downarrow$), but rewritten in the $x$-basis, it becomes a superposition of four components without a clear "count." Worse, in continuous systems (e.g., position space), branches merge or split fluidly, making "counting" incoherent. This destroys branch-counting’s objectivity: probabilities cannot depend on arbitrary mathematical choices. Crucially, it suggests probability *cannot* be read directly from branching structure alone, as the structure lacks intrinsic "units" for individuating outcomes. If branches are not physically discrete entities but representational artifacts, the measure-agnostic has no non-arbitrary way to define "equally likely" branches.  

  #### 2a. Preferred Basis: Concession or Refuge? (5 marks)  
  The measure-agnostic might reply by demanding a **preferred basis**—a unique way to decompose the wavefunction where branches align with distinct measurement outcomes. Decoherence is often invoked here, as it dynamically selects a basis (e.g., pointer states) robust against environmental interference. However, this concedes that branch-counting *requires* supplemental physical structure to define discrete outcomes. Worse, decoherence only delivers a basis *relative to an environment*; it doesn’t provide an absolute, probability-independent standard for branch identity. By relying on it, the measure-agnostic tacitly admits that branching *alone* is insufficient to ground probability. They must now justify why this basis—rather than amplitudes—should dictate "equality." This reduces branch-counting to a disguised appeal to emergent classicality, undermining its claim to fundamental status. Ultimately, the need for a preferred basis reveals that probability norms depend on *additional physical contingencies* (e.g., the dynamics of decoherence), not pure branching.  

  #### 2b. Decision Theory: Derivation or Circularity? (5 marks)  
  Decision-theoretic arguments (e.g., Wallace’s) claim rational agents facing branching must bet according to the Born rule to avoid Dutch books or inconsistency. They start from axioms of rationality (e.g., ordering of preferences, branch indifference) and derive squared amplitudes as the unique adequate "caring measure." However, this approach **smuggles in the measure it purports to derive**. The key axiom—**branch indifference** (indifference between identical outcomes on different branches)—presumes agents assign *no intrinsic weight* to branches beyond what is stipulated. But this ignores that amplitudes already *physically distinguish* branches (e.g., a high-amplitude branch has more "weight" in the wavefunction). If branch indifference is accepted, it arbitrarily imposes a norm that ignores physical asymmetry. Conversely, if branch indifference is rejected (e.g., an agent cares about amplitude size), the Born rule follows trivially. Thus, the derivation is circular: it assumes agents treat branches *as if* they lack measurable differences, which is equivalent to assuming amplitude-blindness from the outset. It constructs rationality within a framework where amplitudes are irrelevant—a question-begging move.  

  #### 3. Self-Locating Uncertainty: Belief vs. Action (4 marks)  
  Self-locating uncertainty (SLU) asks what a pre-branching agent should believe about their future subjective experience ("Which branch will *I* be in?"). Proponents (e.g., Vaidman) argue SLU forces Born-rule probabilities: agents should proportion their credence to branch amplitudes. However, this conflates **pragmatic guidance** with **epistemic justification**. SLU can explain why agents *act as if* branches have probabilities (e.g., avoiding quantum suicide), as it addresses identity uncertainty across branches. But it does not prove that amplitudes *objectively merit* those credences. The gap arises because SLU arguments often implicitly rely on a **quantitative measure of uncertainty**—precisely what is disputed. Without independent justification for why amplitude-squared measures "likelihood of being in a branch," SLU only shows that *if* we need a betting strategy, the Born rule is consistent. It cannot resolve whether the wavefunction itself provides grounds for belief, leaving the normativity of probability unsecured.  

  #### Conclusion  
  The basis-dependence objection fatally undermines branch-counting by exposing its mathematical arbitrariness. Seeking refuge in a preferred basis or decision theory either concedes that branching is insufficient or relies on circular assumptions. SLU addresses agent-centered concerns but cannot bridge the gap between physical dynamics and normative probability. The measure-agnostic position thus fails: probabilities in MWI cannot escape dependence on amplitude-derived measures.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  Candidates must hit these five moves. Award marks as follows:  

  1. **Identify basis-dependence as the core objection** (6 marks):  
     - *Missed if:* Only mentions decoherence without explaining basis-relativity, or confuses it with "infinite branches."  
  2. **Concede that a preferred basis relies on extrinsic structure** (5 marks):  
     - *Missed if:* Assumes decoherence "solves" the problem without noting its relativity/contingency.  
  3. **Expose circularity in decision theory** (5 marks):  
     - *Missed if:* Parrots "branch indifference" as self-evident without questioning its amplitude-blindness.  
  4. **Separate SLU’s pragmatic role from epistemic justification** (4 marks):  
     - *Missed if:* Equates "how to bet" with "what is true," or fails to note the measure-presupposition.  
  5. **Synthesize: Amplitude-dependence is inescapable** (0 marks for this move, but required for full credit in 1–4):  
     - *Missed if:* Concludes branch-counting is viable, or retreats to "it’s all subjective."  

  *No marks awarded for naming theorists, equations, or rehearsing decoherence mechanics without philosophical analysis.*
