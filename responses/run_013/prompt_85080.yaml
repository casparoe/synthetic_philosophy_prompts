  ## Eighty Years: Holding the Questions

  **(Approx. 11 min. delivery; ~1100 words)**

  Good morning. It’s an honor, and a profound responsibility, to speak to you today as we mark eighty years since the bombing of Hiroshima. We gather in this room carrying different histories, different burdens, different convictions. Some of you hold photographs, tangible links to unimaginable suffering. Others hold the deep gratitude for a father, a grandfather, spared the horrors of a planned invasion. You know who you are. You feel the weight of the other side’s presence across this aisle. And I know what many of you are waiting for: you’re waiting to hear whether I think it was *justified*.

  After eighty years, after mountains of documents and countless arguments, that question still hangs heavy. As a writer who’s spent decades wrestling with human complexity, I have to tell you plainly: I don’t have that verdict. Not today. Not ever. Because history, especially this moment, doesn’t yield a simple “yes” or “no” that satisfies the depth of what happened, or the depth of feeling in this room.

  But I refuse to dodge it, or pretend it isn’t there. Instead, let’s try to understand *why* the question persists so fiercely, why it feels so impossible to settle, and maybe find a different way to hold it together.

  **(Shifting the Ground: The What-Ifs)**

  Here’s the first thing I see. The fierce debate we often have about the *facts* – about casualty projections, intercepted cables, Japan’s resolve – isn’t really a fight about facts at all. It’s a fight about *unanswerable questions*. It’s a fight about which terrifying path *might* have unfolded if the bomb hadn’t been used. It’s about which future we hold in our minds when we judge the past.

  *   Do we hold fixed the image of a full-scale invasion of Japan in November 1945? The projections were staggering – hundreds of thousands, maybe millions dead. For the families of men who were on those rosters, this isn’t abstract; it’s the grandfather holding the grandchild. If this is the path we see, the bomb can feel tragically necessary.
  *   Do we hold fixed the possibility of a blockade? Starving a nation slowly into submission, with death tolls mounting daily? A different kind of horror.
  *   Do we hold fixed the idea of a demonstration? Dropping the bomb harmlessly over the bay to shock Japan into surrender? A gamble with no guarantee, while fighting raged on.
  *   Do we hold fixed the impact of the Soviet Union declaring war on Japan, which happened *between* Hiroshima and Nagasaki? Did that shift the calculus fatally?
  *   Or do we hold fixed the possibility – however faint some historians argue it was – that Japan might have surrendered in October or November *without* invasion *or* the bomb? Based on what hints, what channels?

  **Here’s the crucial point:** We can dig through archives forever, but we cannot *know* which of these paths would have truly unfolded. We can’t run the experiment again. Each of these “might-have-beens” is a picture we paint in our minds, based on scraps of evidence and our own understanding. And whichever picture we choose as the *most likely alternative* profoundly shapes our answer to “Was it justified?”

  It’s not that facts don’t matter. They matter immensely. But more digging won’t settle this debate, because the debate hinges on choosing a baseline reality that *didn't happen* and arguing about what *would have* happened within it. Recognizing that isn’t a trick. It’s not saying your pain or your gratitude is misplaced. It’s acknowledging the terrifying uncertainty that shrouded that August. It might be a relief to realize the fight isn’t about stubbornness or ignoring evidence – it’s about genuinely different, equally plausible, nightmares we imagine *not* happening.

  **(The Two Questions We Merge)**

  This brings me to the second tangle we need to unsnarl. In this room, and in this debate, we often mix up two very different things:

  1.  **Was the decision understandable, even reasonable, given what the people making it *actually knew and believed* in August 1945?** They knew the bomb worked. They knew the ferocity of the war. They knew the projections for invasion. They faced agonizing pressure to end the bloodshed. Judged *by that moment*, with its fog of war and limited information, many saw it as a terrible necessity.
  2.  **Looking back with eighty years of hindsight, knowing the full horror of the blast and radiation, knowing the long shadow of the nuclear age, and knowing more about Japan's internal struggles… does the *world that resulted* feel like a justification?** This isn't about the decision-makers' minds in 1945. This is about us, today, looking at the consequences.

  These are *different questions*. One is about judgment within a specific, pressured moment. The other is about the long arc of history that unfolded *afterwards*. Much of the heat in this room comes from people answering one question while believing they’re answering the other, and then wondering why the other side doesn’t see the "obvious" truth.

  It is entirely possible to say: *Given the unimaginable pressure and the information available in August 1945, the decision is tragically comprehensible.* And *simultaneously* to say: *The world that emerged, with nuclear weapons becoming a permanent, terrifying feature of global life, and the specific horrors inflicted on Hiroshima and Nagasaki, cannot be truly justified by any outcome.*

  Separating these doesn’t erase the conflict, but it might help us understand *why* we conflict. One focuses on the impossible choices faced *then*. The other focuses on the enduring consequences we live with *now*.

  **(The One-Time Rule That Wasn't)**

  And this leads to the third point, the hard legacy. We often tell ourselves that Hiroshima and Nagasaki were a unique, desperate measure for a unique, desperate time – a one-time emergency. "Never again," we said.

  But here’s the difficult truth: **The "emergency measure" became the rule.** The weapon born in that moment didn't vanish. It multiplied. It shaped geopolitics, fueled an arms race that nearly ended us, and created a world where the threat of annihilation is a constant, low hum. For eighty years, we have lived on the foundation poured in those awful days of August 1945. The "one-time" event defined a new, terrifying normal. That transformation – from desperate act to enduring condition – is part of what makes the "justified" question feel so unresolved and so painful. The "emergency" never truly ended; it just changed form.

  **(The People in the Room)**

  Finally, and most importantly, there’s you. The woman who was eleven, living near Nagasaki. The families whose fathers and grandfathers survived because the planned invasion never came. Your presence, your stories, your photographs – they are the heart of why we gather. They are irreplaceable testimony to the human cost, on both sides of that terrible equation.

  But here is where we must be careful, and where I believe both sides sometimes stumble. **Your experience, your family’s survival, your enduring pain – these are not pieces of evidence in an argument about justification.** They are not data points to be marshaled to "prove" one historical interpretation right and another wrong.

  To treat a survivor’s account primarily as an argument *for* the bomb’s horror being unjustifiable is to risk reducing that person to a symbol. To treat a veteran’s family’s gratitude primarily as an argument *for* the bomb’s necessity is to risk reducing that family’s story to a position paper. It turns flesh-and-blood people, carrying profound and valid human truths, into mere soldiers in an unwinnable historical debate.

  Your experiences stand *alongside* the historical questions. They are the human reality that gives the history its terrible weight. They demand witness, not weaponization. Holding the photograph of a lost loved one from Hiroshima speaks to a specific, searing loss that must never be forgotten. Knowing your grandfather held you because he wasn’t sent to Okinawa speaks to a specific, profound relief that shaped generations. These truths exist simultaneously. They don’t cancel each other out; they deepen the complexity. Honoring the person means honoring *their* truth, not conscripting it into a battle over the unknowable past.

  **(Conclusion: Holding the Questions)**

  So, eighty years later, do we have an answer? I don’t believe history delivers verdicts like that, not for something this vast, this terrible, this shrouded in the fog of war and the terror of what-might-have-been. What we have are profound human experiences – of loss, of survival, of impossible decisions made under duress, and of a world irrevocably changed.

  We have the testimony of survivors, a sacred trust demanding remembrance. We have the gratitude of families spared a different horror, a valid and deeply felt relief. We have the long shadow of the nuclear age, a burden we all bear. And we have those unanswerable questions about the paths not taken.

  Instead of demanding a verdict today, perhaps we can try to hold these things together. Acknowledge the terrifying uncertainty of 1945. Understand the difference between judging the decision then and living with the consequences now. Recognize how the "one-time" became our constant reality. And above all, honor the *people* in this room, not as arguments, but as human beings carrying fragments of a history too large for any one of us.

  Hiroshima happened. Nagasaki happened. The planned invasion was real. The bomb ended the war. The nuclear age began. The suffering was immense. Lives were spared. The world was changed forever.

  Eighty years on, the task isn’t to vote yes or no. The task is to remember fully, to feel the weight of it all, to honor *every* story of suffering and survival in this room, and to recommit, with clear eyes and heavy hearts, to ensuring such choices are never forced upon humanity again. That is how we build a future worthy of the past we remember today. Thank you.
