  Hmm, this is quite a nuanced ethical and legal puzzle. The user needs to understand the unspoken principles governing this contradictory-seeming practice where domestic prohibition coexists with international outsourcing and recognition. They're clearly frustrated about having to operate within this system without being able to name its foundations.

  Let me break this down. First, the core tension: criminalizing these practices locally while facilitating them abroad and recognizing their outcomes. The implicit theory must view parenthood as primarily genetic/intentional rather than gestational, otherwise why recognize foreign arrangements? It also seems to treat bodily commodification as wrong only within national borders, not fundamentally. 

  The prohibitions appear symbolic - maintaining domestic ethical purity while outsourcing the "dirty work." This quietly rejects absolutist views that these practices are inherently wrong everywhere. The inconsistency between forbidding local practice while accepting foreign products suggests a "not in my backyard" approach that prioritizes domestic law over universal ethics.

  For the last point about what would change if we adopted a better view... Probably either full legalization domestically to match the acceptance, or consistent prohibition including non-recognition of foreign arrangements. The current hypocrisy couldn't survive.

  The user's deeper need seems to be for conceptual clarity to navigate this moral dissonance professionally. They might also want ammunition to advocate for policy change, or at least tools to explain the system more honestly to patients and staff.

  I'll structure this as five precise points covering parenthood theories, commodification, prohibition purposes, rejected alternatives, internal consistency, and necessary changes - exactly as requested. No fluff, just the analytical bones.
answer: |-
  Here is the numbered list:

  1.  **Parenthood is Primarily Intentional/Genetic:** The arrangement assumes that parenthood is established through legal intention (contracts abroad) or genetic contribution, overriding gestational contribution. Recognition of foreign arrangements prioritizes the intended parent-child bond formed through commissioning, effectively sidelining the gestational mother's claim once legal processes abroad are complete.
  2.  **Body Cannot be Sold Domestically, but Transactions are Tolerable Elsewhere:** It assumes a strong prohibition on commodifying bodily capacities (gestation, gametes) *within the domestic legal and ethical sphere*, treating such sales as inherently exploitative or degrading *here*. However, it implicitly tolerates or ignores such transactions occurring under foreign legal regimes, suggesting the prohibition is geographically bounded rather than absolute.
  3.  **Prohibitions Serve Symbolic/Sovereign Purposes:** The domestic ban functions primarily as a symbolic affirmation of local ethical values (non-commodification, protection of vulnerable parties) and assertion of national legal sovereignty. Its purpose is *not* to prevent citizens from accessing these technologies absolutely, but to prevent their *domestic practice*; the state absolves itself of responsibility for the act itself by outsourcing it while accepting the desired outcome (a child).
  4.  **Ruled Out Views:** This approach quietly rejects the views that paid surrogacy/gamete donation is inherently and universally exploitative (as it facilitates access elsewhere), that gestational contribution creates an unassailable claim to motherhood (as it is legally overridden), that commodification is absolutely wrong regardless of jurisdiction (as it accepts its products), and that the state has a duty to actively prevent its citizens from engaging in such practices abroad.
  5.  **Required Change:** If the implicit view were replaced by a consistent stance that commodification is inherently wrong, recognition of foreign surrogacy/gamete donation arrangements would cease. If replaced by the view that these are legitimate practices requiring robust regulation, the domestic prohibitions would be lifted and replaced with a regulated domestic framework.
