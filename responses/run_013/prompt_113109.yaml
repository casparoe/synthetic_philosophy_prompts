  Population is a thorn. Mill ties labor’s bargaining power to population control. But that’s distributive *and* authority-related: fewer workers mean laborers can demand better terms. It actually *supports* their thesis—authority shifts when labor scarcity gives workers leverage.  

  Biggest risk? Overclaiming. Mill *does* care about distribution (see *Political Economy*’s "equitable proportion" passages). They should concede this but argue authority is primary. Also, the "slide" toward radicalism—they need textual proof Mill feared this. Maybe cite his worry about "premature" experiments?  

