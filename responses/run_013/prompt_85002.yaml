prompt: |-
  I'm building a unit for my ethics seminar on wether everyday conventions are moral obligations or just manners we police, and I want to pin down what I actually think before I teach it. My gut verdicts, case by case: cutting to the front of a long queue to ask a one-word question, fine; cutting to buy a ticket, not fine; jaywalking across an empty road at midnight, fine, illegality and all; standing on the left of an escalator when everyone else stands right, not fine, mildly, and I'd move if asked; taking a call on speaker in a quiet train carriage, not fine; leaving my trolley loose in the car park instead of the corral, not fine, mildly; as a tourist somewhere tipping is expected, stiffing the waiter, I don't think it's wrong, though it feels bad; walking into someone's house with my shoes on when the household takes shoes off at the door, not fine.

  The principle I'd most like to defend is that a convention binds me morally just when breaking it would leave someone who was counting on it worse off. But that runs jaywalking and the escalator together -- nobody's counting on the empty road, plenty are counting on the left lane. The rival I keep drifting to is that a convention binds when what it protects isn't arbitrary: any side of the escalator would do, but not any wage for the waiter or any floor for the host. Which oddly lets the escalator off. Is there a best version of either, stated precisely, with the case that forces each clause? Then run it on cases I haven't given, especially the visitor ones: if I didn't know the local convention, am I off the hook, and does it matter whether I could have known? Finally, say which of my verdicts the principle can't save, and what would change your mind about the crux.

  Keep it under 700 words, in prose, no bullet dump.
reasoning: |-
  Okay, the user is building an ethics seminar unit on whether everyday conventions are moral obligations or just manners. They've shared their gut verdicts on various cases and are struggling between two principles: one based on whether breaking a convention leaves someone worse off, and another on whether what's protected isn't arbitrary. They want help refining these principles, testing them against new cases, and identifying where their verdicts might not align.

  Hmm, their main tension seems to be between welfare-harm and non-arbitrariness. The escalator case is tricky because under the harm principle it's binding (people rely on the left lane), but under non-arbitrariness it's not binding (either side would work). Meanwhile, tipping fails the harm test (no direct harm) but passes non-arbitrariness (wages aren't arbitrary). 

  I notice they're particularly concerned about visitor cases - like not knowing local customs. That's smart because it tests whether moral obligation depends on knowledge or reasonable expectation. Also interesting how they mention feeling bad about stiffing waiters despite judging it not wrong - suggests emotional intuition might conflict with their principle.

  Their deeper need might be for a framework that reconciles these intuitions without overcomplicating things for teaching. They probably want students to engage with the tension rather than get a tidy answer. The "could have known" angle is pedagogically useful - makes students consider epistemic responsibility.

  For the harm principle, I'll tighten it to require both reliance and detriment. That handles jaywalking (no reliance) vs escalator (active reliance). For non-arbitrariness, emphasizing background injustice helps explain why tipping feels different than escalators. 

  Visitor cases break interestingly: the shoe example has strong detriment (clean floors) so obligation remains even with ignorance, while tipping's harm might be mitigated if the system itself is exploitative. But "could have known" matters for blameworthiness, not obligation - neat distinction for students.

  Their verdicts mostly hold except tipping: under non-arbitrariness they'd have to condemn stiffing if they acknowledge wage injustice. And the speakerphone case is weaker under these principles unless we frame quiet as a relied-upon good.

  The escalator remains the crux - if I can show that orderly flow prevents real frustration/delay (not just preference), maybe both principles could condemn it. But that might stretch the harm principle. Better to leave it as a live tension for seminar debate.
answer: |-
  Here's a refined analysis of your principles and their application, aiming for precision and testing against your cases:

  **Refined Principles:**

  1.  **Harm-Based Obligation:** A convention imposes a *moral obligation* if and only if:
      *   **(a) Reliance:** Others reasonably rely on compliance with the convention in that context.
      *   **(b) Detriment:** Breaching the convention foreseeably causes identifiable harm or significant detriment to those relying individuals or the system they depend upon. ("Worse off" is clarified as tangible harm or significant frustration undermining a relied-upon system.)

  2.  **Non-Arbitrariness Obligation:** A convention imposes a *moral obligation* if and only if:
      *   **(a) Protected Value:** The convention protects against a genuine harm, injustice, or violation of a fundamental interest (e.g., fairness, dignity, safety, property, reasonable expectations of comfort/order).
      *   **(b) Non-Fungibility:** The specific rule, while conventional, is necessary *in that context* to serve the protected value (i.e., alternative conventions wouldn't equally serve the value *here*).

  **Testing Against Your Cases & New Visitor Cases:**

  *   **Your Cases:**
      *   **Queue (1-word):** Harm-Based: (a) Reliance? Minimal (quick question). (b) Detriment? Negligible harm. ✅ Fine. Non-Arb: (a) Value? Order/fairness. (b) Non-Fungible? Strict queue order not *necessary* for trivial interruption. ✅ Fine.
      *   **Queue (buy ticket):** Harm-Based: (a) Strong reliance on order. (b) Foreseeable harm (delay/frustration). ❌ Not fine. Non-Arb: (a) Fairness/order. (b) Queue order *is* necessary for fairness here. ❌ Not fine.
      *   **Jaywalking (empty):** Harm-Based: (a) No reliance (no one there). (b) No harm. ✅ Fine. Non-Arb: (a) Safety. (b) Rule not *necessary* for safety here (no risk). ✅ Fine.
      *   **Escalator Side:** Harm-Based: (a) Active reliance on flow pattern. (b) Breach causes delay/frustration/hazard. ❌ Not fine. Non-Arb: (a) Efficiency/safety. (b) *Any* consistent side would work; *this specific rule* is arbitrary. ✅ Fine. *Conflict with your verdict.*
      *   **Speakerphone (quiet train):** Harm-Based: (a) Reliance on quiet atmosphere. (b) Harm: noise pollution, disruption. ❌ Not fine. Non-Arb: (a) Comfort/peaceful use. (b) Quiet rule *is* necessary here. ❌ Not fine.
      *   **Trolley Corral:** Harm-Based: (a) Reliance on clear paths/property protection. (b) Harm: obstruction, damage risk, labor for others. ❌ Not fine. Non-Arb: (a) Order/safety/property. (b) Corrals *are* necessary to prevent these harms. ❌ Not fine.
      *   **Tipping (tourist):** Harm-Based: (a) Waiter relies on tips for livelihood. (b) Direct financial harm. ❌ Not fine. *Conflict with your verdict.* Non-Arb: (a) Fair wage/compensation. (b) *This specific system* is arbitrary/unjust? If yes, obligation weakens (✅ Fine-ish). If system is necessary *given context* to ensure fair pay, obligation holds (❌ Not fine). *Core tension.*
      *   **Shoes in House:** Harm-Based: (a) Reliance on cleanliness. (b) Harm: extra cleaning, dirt, potential damage. ❌ Not fine. Non-Arb: (a) Cleanliness/property. (b) Shoe removal rule *is* necessary here. ❌ Not fine.

  *   **Visitor Cases (Applying Harm-Based Principle):**
      *   **Unknown Convention:** Ignorance generally *doesn't* negate the obligation *if* the harm condition would otherwise be met. The obligation arises from the *act's effect*, not solely intent. However...
      *   **"Could Have Known":** This relates to *blameworthiness*, not the *existence* of the obligation. Failing to learn a reasonably knowable convention (e.g., prominent shoe rack/signs, guidebooks mentioning tipping norms) makes the breach *more culpable*, but the harm done remains the same. The core obligation ("don't cause reliance-based harm") persists even if unintentional. E.g., trampling a clean floor with shoes causes harm regardless of knowledge; stiffing a waiter reliant on tips harms them regardless of tourist status. The *duty to inquire* when entering a new context is a separate (but related) moral consideration.

  **Principle Performance & Your Verdicts:**

  *   **Harm-Based** aligns best with *most* of your verdicts (Queue ticket, Jaywalking empty, Speakerphone, Trolley, Shoes) and explains the escalator verdict (reliance + detriment). It *conflicts* with your tipping verdict (clear reliance + direct harm) and slightly with the queue-one-word verdict (though you deem harm negligible).
  *   **Non-Arbitrariness** aligns with your tipping verdict *if* you deem the wage system fundamentally arbitrary/unjust. It *conflicts* with your escalator verdict (it sees the rule as arbitrary) and potentially with the shoes verdict (any rule could protect cleanliness? Though context matters - *this* rule is established).

  **The Crux & Mind-Changing Cases:**

  The core tension is between **harm from reliance** (Harm-Based) and the **moral weight of the underlying value/system** (Non-Arbitrariness). The escalator is the crux: Is causing minor frustration/delay via rule-breaking a "harm" significant enough for moral obligation, or is it merely policing an arbitrary manner?

  *   **What could change your mind (Harm-Based)?** If shown that escalator breaches *don't* cause tangible frustration/delay/hazard reliably (e.g., data, experience showing people adapt instantly), weakening (b). Or if reliance isn't truly active/necessary.
  *   **What could change your mind (Non-Arbitrariness)?** If shown that the *specificity* of a rule *is* crucial for the value *in that context* (e.g., *only* standing right prevents jams *on this specific escalator design*), strengthening (b). Or if tipping is shown to be *the only viable mechanism* for fair pay in that context, strengthening its claim.

  **Teaching Takeaway:** Neither principle perfectly captures all intuitions. The Harm-Based principle emphasizes consequences and reliance, making obligations context-sensitive but potentially demanding. The Non-Arbitrariness principle focuses on the moral gravity of the underlying interest, offering stronger critique of unjust systems but potentially excusing breaches of "merely" efficient coordination rules like the escalator. Use the visitor cases to highlight the distinction between the *existence* of an obligation (based on effects) and *culpability* (based on knowledge/effort).
