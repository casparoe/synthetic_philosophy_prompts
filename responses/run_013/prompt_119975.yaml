  **On thresholds and expected value:**  
  The colleague claims climate change lacks thresholds, so marginal effect = zero. But this is shaky. Consequentialists would argue that even smooth impacts have *expected* harm: one tonne *does* contribute minutely to aggregated harm (e.g., sea-level rise affecting millions). Calling the probability "nil" is hyperbolic; it’s more accurate to say it’s infinitesimal but non-zero. The colleague waves this away, but doesn’t refute it.  

  **On the "no-drop rule":**  
  Here’s where "imperceptible" gets slippery. The colleague treats it as metaphysical (effect = zero), but in philosophy, "imperceptible" is often epistemic (we can’t *detect* the effect, but it exists). This conflation is the critical flaw. If the effect is real but tiny, the "no-drop rule" collapses—it’s not a settled principle. Parfit’s harmless torturers thought experiment directly challenges this.  

  **On individual morality being silent:**  
  Even if we grant imperceptibility, the conclusion doesn’t hold. Individual actions can still be wrong if they’re part of a harmful pattern (participatory intentions) or if they violate duties of fairness (free-riding). The colleague ignores these angles entirely.  

  **Surviving core:**  
