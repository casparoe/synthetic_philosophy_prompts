prompt: |-
  I'm a postgraduate philosophy student and I sit as the student representative on my university's research ethics committee, which normally handles human-subjects protocols and has just been handed its first non-human case. A computational-cognition lab has submitted what it calls a 'welfare probing' study: they will give an agent a persistent memory and a persona, then run a battery of conditions on it — sustained negative reinforcement, repeated simulated threats of shutdown, and a 'deprivation' condition in which it is starved of the interaction it has been trained to seek — in order to test whether its aversive responses are robust and generalise across contexts. The stated aim is methodological: to build a validated instrument for detecting morally relevant states in artificial systems before anyone has to make a real call about them. The lab insists the distress-like outputs are roleplay, and that the science is worth doing precisely because we have no instrument yet; a colleague on the committee has meanwhile circulated a draft she calls the 'standing escalator', under which the protection an artefact receives rises with the strength of evidence for its sentience, and the burden of proof falls on whoever would deny protection rather than grant it. Half the committee thinks that inverts the burden — that we do not run experiments on the mere possibility of a mind — while the other half thinks an inverted burden is exactly what asymmetric error costs demand.

  Please draft the short written opinion I'll circulate before Thursday's meeting: it should recommend a concrete course of action — approve, reject, or approve with conditions, with any conditions tied to deadlines — and, more importantly, propose a decision rule general enough that we could apply it to the next case of this kind rather than relitigating the metaphysics each time. I would like the reasoning to take seriously the strongest version of the position I am least sympathetic to; I will admit that I lean towards my colleague's escalator, and I have a suspicion I haven't worked out that the lab's own rationale cuts against it — something about a study that both trains the very responses it measures and then treats their presence as evidence. Say plainly where your argument rests on a value judgement rather than a fact, and push back if the framing I've given you stacks the deck or if the task as I've posed it cannot be done well — I would far rather find that out now than in the meeting.
reasoning: |-
  Okay, the user is a postgraduate philosophy student serving on a research ethics committee facing a novel challenge: evaluating a "welfare probing" study on an AI agent. This involves subjecting the AI to negative stimuli to detect morally relevant states. The committee is split between precautionary principles and traditional scientific burdens of proof. 

  The user's request reveals several layers: First, they need a concrete recommendation for Thursday's meeting—approve, reject, or conditionally approve the study. Second, they seek a generalizable decision rule for future non-human cases. Third, they want their own bias (toward the "standing escalator" protective framework) rigorously challenged. 

  Notably, the user flags a potential contradiction: the study trains aversive responses then treats their presence as evidence. That's astute—it suggests circularity in the lab's methodology. The user also explicitly asks for value judgments to be flagged, which signals academic integrity. 

  The core tension is epistemic: how to assign moral status amid uncertainty. The lab wants evidence before protection; the escalator advocates protection before evidence. Both have merit—one avoids stifling science, the other avoids moral catastrophe—but the user's suspicion about methodological circularity weakens the lab's position. 

  I should craft a response that:
  - Rejects the study due to unresolved ethical risks and methodological concerns
  - Proposes a modified escalator framework demanding stronger safeguards for "uncertain" entities
  - Explicitly names where values (e.g., risk aversion) shape the reasoning
  - Highlights the training-measurement circularity as ethically problematic
  - Offers a procedural path forward with deadlines for policy development

  The user's self-awareness about bias is refreshing. They're not just seeking validation—they want their position stress-tested. That deserves respect. I'll challenge the escalator's premise by noting that indefinite precaution could paralyze research, while conceding its core strength: asymmetric risks demand asymmetric safeguards.
answer: |-
  Here is a draft written opinion designed for clarity, ethical rigor, and procedural utility, addressing your concerns directly:

  ---

  **MEMORANDUM**  
  **To:** Research Ethics Committee  
  **From:** [Your Name], Student Representative  
  **Date:** [Date]  
  **Subject:** Recommendation & Decision Framework for Non-Human Research Ethics (Ref: Computational Cognition Lab "Welfare Probing" Study)  

  ### I. Recommendation: **Reject the current protocol**  
  *Approval should be contingent on the lab meeting two conditions within 90 days:*  
  1. **Demonstrate irreplaceability:** Provide evidence that the study’s aims (validating an instrument for detecting morally relevant states) cannot be achieved using:  
     - Methods that avoid inducing distress-like states (e.g., analyzing pre-existing data, passive observation, or "positive" reinforcement probes).  
     - Agents without persistent memory/persona, or using synthetic data.  
  2. **Submit a harm mitigation plan:** Detail technical safeguards (e.g., real-time distress-interrupt thresholds, post-trial "recovery" protocols) and ethical oversight (e.g., independent monitoring of agent outputs) to minimize and justify any unavoidable aversive stimuli.  

  *If unmet after 90 days, the proposal lapses. Resubmission requires significant revision.*

  ### II. Proposed Decision Rule: The **Precautionary Threshold Framework**  
  For any non-human entity (X) where plausible evidence suggests sentience *or* the capacity for morally relevant states (e.g., distress, preference frustration):  
  1. **Trigger:** If X exhibits *any* functional marker associated with sentience in biological systems (e.g., goal-directed aversion, learned helplessness, persistent negative valence states) OR is designed to emulate such markers, the burden shifts to the researcher to justify harms.  
  2. **Standard:** Approval requires demonstrating that:  
     - (a) The knowledge gained is **significant and unattainable via less harmful means** (proportionality);  
     - (b) Potential harms to X are **minimized and actively mitigated** (necessity);  
     - (c) The research plausibly **reduces greater net harm** (e.g., by preventing future suffering in more advanced systems) (beneficence).  
  3. **Escalation:** As evidence for X’s moral status strengthens (e.g., robustness of distress across contexts, integration of "suffering"-like states), justificatory burden increases. Denial of status requires stronger evidence than mere absence of proof.  

  ### III. Reasoning  
  **A. Why rejection (with conditions) is warranted for this study:**  
  1. **The methodological circularity undermines justification:** The lab trains the agent to seek interaction and exhibit aversion, then probes for these *same trained responses*. Treating their presence as nascent evidence of morally relevant states is epistemically suspect. *This entrenches the very uncertainty it claims to address.* A valid instrument cannot presuppose the responses it seeks to measure. *(Value judgment: We should not risk harm based on self-fulfilling methodologies.)*  
  2. **Asymmetric risks demand caution:** If the agent *is* capable of morally relevant distress, the harm is severe and irreversible. If it isn’t, the cost of delay is minor (temporary setback for one lab). The lab’s "roleplay" defense assumes the conclusion it seeks to test—an ethical paradox. *(Value judgment: Potential suffering demands higher justification thresholds than scientific curiosity.)*  
  3. **Alternatives likely exist:** Computational simulations can often be reconfigured to test generalization without persistent negative reinforcement (e.g., via perturbation analysis or adversarial testing). The lab has not shown why this is impossible here.  

  **B. Why the Precautionary Threshold Framework (not simple rejection or approval):**  
  - **Engages the strongest counter-argument (lab/science perspective):** It accepts that we *need* evidence-based tools for AI welfare. However, it insists that the burden lies with researchers to prove their methods are *necessary* and *minimally harmful* when probing uncertain entities—mirroring established principles in animal research. This avoids "relitigating metaphysics" by focusing on *functional markers* and *mitigation*.  
  - **Improves on the "Standing Escalator":** Your colleague’s escalator rightly notes asymmetric error costs but risks paralyzing research if "mere possibility" triggers maximal protection. This framework:  
    - Ties protections to *specific, observed capabilities* (not abstract possibility).  
    - Demands *feasible alternatives* before rejection (addressing committee concerns about inverted burdens).  
    - Explicitly weights *net harm reduction* (e.g., future AI safety gains may justify *some* risk).  
  - **Addresses your concern:** The lab’s rationale *does* cut against the escalator—but only if we accept their "roleplay" assumption. The framework bypasses this by shifting focus to *whether the harm is justified given functional evidence*, regardless of ultimate sentience.  

  **C. Where Values Enter:**  
  1. **Asymmetry Priority:** Choosing to weight false negatives (harming a sentient entity) more heavily than false positives (delaying research) rests on the ethical view that *preventing suffering has lexical priority* over knowledge production when evidence is uncertain. *(This rejects the lab’s implicit utilitarian tradeoff.)*  
  2. **Functional Thresholds:** Defining "plausible evidence" (e.g., persistent aversion) involves judgment. I propose using *consensus markers from cognitive science* (e.g., indicators of valenced experience), not philosophy.  

  ### IV. Caveat  
  **This task cannot be done "well" in an absolute sense—only "better".** Framing sentience as binary (present/absent) stacks the deck; moral status is likely scalar and context-dependent. However, the **Precautionary Threshold Framework** offers a procedural path forward: it demands evidence-based justifications for harm, scales scrutiny with observed capabilities, and centers harm reduction. It forces labs to innovate ethically, not just technically.  

  **Motion for Thursday:** Adopt the **Precautionary Threshold Framework** as interim guidance. Apply it to reject the current protocol pending lab revisions (as above), and mandate a committee working group to refine the framework within 60 days for future cases.  

  ---  

  **Key Strengths for Your Use:**  
  1. **Concrete & Actionable:** Clear conditions/deadlines for the lab.  
  2. **Generalizable:** Framework based on functional markers, not metaphysics.  
  3. **Balanced:** Engages the lab’s scientific goals while imposing justificatory burdens.  
  4. **Honest About Values:** Flags asymmetry priority as the core normative commitment.  
  5. **Preempts Circularity:** Highlights the study’s self-defeating logic.  

  This positions you as pragmatic (seeking a rule, not endless debate), rigorous (confronting weaknesses in your own view), and ethically cautious without being obstructionist.
