prompt: |-
  I'm a final-year computer science undergraduate, and this term I'm taking a philosophy of language module as an outside option. The part of the module I keep returning to is the triviality result for indicative conditionals, the argument associated with David Lewis to the effect that you cannot, within the usual probability calculus, have a conditional whose probability is systematically the corresponding conditional probability without the conditional collapsing into something much weaker or trivial. My own background is in probabilistic programming. I have written samplers with observe and condition statements, I tend to think of conditioning as a partial operation that can be undefined when the conditioning event has probability zero, and I am used to separating a generative model from the inference algorithm that queries it. I should say that I am not looking for a bibliography, a reading list, or suggestions for further papers; I want the translation itself.

  Please restate the triviality argument as faithfully as you can in that probabilistic-programming vocabulary, and then give me the residue report. I am especially interested in whether the result is really a theorem about probability functions or about the expressive limits of a certain kind of object-language conditional, and in whether my vocabulary can even state that distinction without distortion. Begin with a one-sentence summary of your overall verdict. Then organise the answer under the following headings, in this order: Orientation, one paragraph of no more than 120 words, saying what you take the triviality result to be; The translation, roughly 700 to 900 words, restating the argument in terms of generative models, conditioning, partiality, and inference; What translates cleanly, roughly 200 to 300 words; What translates only with distortion, roughly 200 to 300 words; What has no counterpart, roughly 250 to 350 words; and Verdict on the residue, one paragraph of roughly 150 to 250 words, saying whether the residue is a defect of my vocabulary or a sign that the original claim was less clear than it looked. Please write your answer in American English.
