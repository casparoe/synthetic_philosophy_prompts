  First, I need to recall the core of the Molinism dispute. Molina posits middle knowledge: God knows counterfactuals of freedom (what any free creature would do in any circumstance). This allows God to choose a world where free actions align with His will. Bañez and the Dominicans reject this, saying God’s knowledge of counterfactuals depends on His decree via physical premotion. They accuse each other of heresy: Molinists say premotion makes God the author of sin; Dominicans say middle knowledge limits God’s sovereignty. The pope declared both non-heretical, leaving it unresolved.

  The user’s main question is whether this is a real disagreement or a verbal one. They suspect it’s about the grounding of truths. I need to test that hypothesis. Let me break down the areas of agreement and disagreement. Both sides agree on God’s omniscience, libertarian freedom, and efficacious grace. The conflict arises over counterfactuals of freedom and divine causality.

  Considering the grounding issue: If every truth needs a truthmaker, then counterfactuals about free actions that never occur lack a truthmaker since nothing prior determines the free choice. Molinists might accept brute truths here, while Dominicans insist on divine decree as the truthmaker. This aligns with the user’s hypothesis. But is that the whole story? 

  Looking at divine causality: Dominicans see God’s causation as concurrent and determining, yet preserving freedom. Molinists separate God’s knowledge from causation, making counterfactuals independent. So, differing views on divine action could be key. Also, freedom: Molinists emphasize agent-causal power, while Dominicans see freedom as compatible with divine determination. This might be a deeper divergence.

  The user’s chemistry analogy—dispositions vs. probabilities—is interesting. Are counterfactuals of freedom like irreducible dispositions (Molinist) or emergent from divine action (Dominican)? But theology adds layers: God’s sovereignty and grace, which aren’t in scientific debates. So the analogy might not capture the theological stakes.

  Open theism’s role: Rejecting counterfactuals of freedom entirely shows the debate’s contingency. If they’re not real, Molinism fails. Dominicans avoid this by grounding them in God’s decree. So truthmakers are crucial here.

  Diagnosing the dispute: It’s substantive but with ambiguities. The disagreement spans truthmakers, divine causality, and freedom. Molinists and Dominicans use the same terms but with different metaphysical commitments. Progress might require clarifying these concepts or accepting it as a perennial debate due to differing axioms.

