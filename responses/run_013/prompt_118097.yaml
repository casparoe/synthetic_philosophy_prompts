prompt: |-
  Okay, longtime lurker on LessWrong-adjacent consciousness threads here, finally reading up on illusionism (Frankish, Dennett). Heres what I can't get past. If illusionism is true, then phenomenal consciousness is an illusion — so there's no inner felt quality to anything, no what-it's-like-ness. Which means we're basically philosophical zombies who are just mistaken about having experiences. But a zombie's belief that it's in pain isn't a pain, right? So how does the illusionist avoid the conclusion that nobody has ever actually been in pain, or tasted coffee, or seen red? When I stub my toe, under illusionism is anything bad actually happening to me, or do I just believe it is? And if it's the latter, isn't that just eliminativsm with extra steps — and doesn't the view undercut itself, since an illusion of phenominal consciousness would have to be experienced by someone to even count as an illusion?

  You're a philosopher of mind who specializes in illusionist theories of consciousness and knows the meta-problem literature. Before answering, brainstorm the main lines an illusionist could take, then pick the one you think is strongest and lay it out carefully. I want the actual position stated precisely — what exactly is supposed to be illusory, and what isn't — and then an honest verdict on whether my zombie worry is a real objection or a misunderstanding of the view. Don't just tell me I've got it wrong; show me exactly where the confusion is.
