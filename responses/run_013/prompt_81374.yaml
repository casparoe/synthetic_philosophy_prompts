  Below is a written procedure for your clinical ethics committee, designed to meet your specifications. It includes: 
  - A clear sequence of questions with decision thresholds.
  - Mechanisms to separate selection based on impact to the future person vs. implications about existing people.
  - A built-in "switch" (Best Available/Sufficient Range) to accommodate differing views among colleagues.
  - Explicit safeguards distinguishing the process from eugenics.
  - Application to your three cases, with one outcome intentionally challenging.
  - Reflection on vulnerabilities and potential redesign triggers.

  ---

  ### **Clinical Ethics Committee Procedure: Embryo Selection Based on Opportunity Range**  
  **Version 1.0**  
  *Approved: [Date]*  

  #### **I. Core Principles**  
  1. **Comparative & Defeasible**: Select the embryo with the best expected opportunity range (defined as breadth of life choices, capabilities, and experiences) among those available.  
  2. **Scope**: Applies only to embryos created by the couple; does not override their values or judge existing lives.  
  3. **Anti-Eugenics Safeguard**:  
     - Focuses solely on welfare of the future child.  
     - Excludes societal preferences, biases against disabled people, or population-level "improvement."  
     - Adjusts for cultural context to avoid devaluing traits tied to identity.  

  #### **II. Procedure Workflow**  
  *Timeframe: ≤2 weeks, ≤2 counseling sessions. Panel: Reproductive endocrinologist (RE), genetic counselor (GC), lay member (LM).*  

  **Step 0: Set the Selection Mode (Switch)**  
  - **Question**: Which mode applies?  
    - *Option A: Best Available (BA)* → Choose the embryo with the highest opportunity range.  
    - *Option B: Sufficient Range (SR)* → Choose any embryo meeting a threshold of "sufficient" opportunity range (defined in Step 4).  
  - **Sufficient Answer**: Panel consensus on mode (default: BA if unresolved).  
  - **Stop/Handoff**: Never stops; mode must be set upfront. Document rationale.  

  **Step 1: Exclude Non-Viable Embryos**  
  - **Question**: Does any embryo have a condition universally recognized as precluding *any* meaningful opportunity range?  
    - *Criteria*: Lethal (e.g., Tay-Sachs), or catastrophic (e.g., anencephaly) per current medical consensus (e.g., WHO/ACOG guidelines).  
  - **Sufficient Answer**:  
    - *Yes*: Panel informs couple, who may remove embryo(s) from consideration. If couple declines, proceed but rank lowest.  
    - *No*: Proceed to Step 2.  
  - **Stop/Handoff**: If all embryos excluded, cycle canceled.  

  **Step 2: Assess Direct Impact on Opportunity Range**  
  - **Question**: What is the expected impact of each embryo’s condition(s) on the future person’s physical/cognitive capabilities?  
    - *Criteria*: Use evidence-based medical factors only:  
      - Severity (mild/moderate/severe impairment in function).  
      - Age of onset (earlier = higher weight).  
      - Treatability (availability/effectiveness of medical/social interventions).  
    - *Exclude*: Traits with no functional impact (e.g., hair color) or societal implications (e.g., stigma).  
  - **Sufficient Answer**:  
    - Rank embryos as: **High**, **Medium**, or **Low** opportunity range.  
      - *High*: No limitations, or mild limitations fully mitigated by interventions.  
      - *Medium*: Moderate limitations partially mitigated.  
      - *Low*: Severe limitations with minimal mitigation (e.g., profound intellectual disability).  
    - Use standardized tools (e.g., WHO ICF framework) for consistency.  
  - **Stop/Handoff**:  
    - If one embryo ranks **strictly higher** than others → Recommend it.  
    - If tie or ambiguity → Proceed to Step 3.  

  **Step 3: Adjust for Cultural Context (Anti-Eugenics Filter)**  
  - **Question**: Could a condition expand opportunity range within a cultural community the parents belong to?  
    - *Criteria*: Only triggers if:  
      - Parents are part of a defined cultural/linguistic minority (e.g., Deaf community).  
      - Condition is central to that community’s identity (e.g., deafness).  
      - Evidence shows it grants access to unique opportunities (e.g., leadership in Deaf culture).  
  - **Sufficient Answer**:  
    - *Yes*: Re-rank opportunity range (e.g., deafness may shift from **Medium** to **High** for Deaf parents).  
    - *No*: Retain Step 2 ranking.  
  - **Stop/Handoff**: Never stops; adjustment is mandatory if criteria met.  

  **Step 4: Apply Selection Mode**  
  - **Question**: Which embryo is selected per the mode (BA/SR)?  
    - *For BA*: Recommend the highest-ranked embryo.  
    - *For SR*:  
      - Define "sufficient": **Medium** or higher opportunity range.  
      - If ≥1 embryo meets threshold → Recommend all "sufficient" embryos; couple chooses.  
      - If none meet threshold → Recommend highest-ranked.  
  - **Sufficient Answer**: Clear recommendation per mode.  
  - **Stop/Handoff**:  
    - If SR mode with multiple "sufficient" embryos → Hand decision to couple as "value choice."  
    - If BA mode with tie → Hand decision to couple.  

  **Step 5: Finalize & Document**  
  - Panel documents:  
    - Mode (BA/SR), rankings, adjustments, and rationale.  
    - Explicit statement: *"This selection is based solely on impact to the future child’s capabilities, not societal judgments about disability."*  
  - Share recommendation with couple; they make final transfer decision.  

  ---

  ### **III. Case Applications**  
  *Assumptions: BA mode (default), panel uses medical consensus (e.g., ACMG guidelines).*  

  **Case 1: Deaf Parents Request Deaf Embryo**  
  - Embryos:  
    - A: Carries deafness variant (will be deaf).  
    - B: No deafness variant (will be hearing).  
  - **Step 1**: No exclusion (deafness not lethal).  
  - **Step 2**:  
    - A: **Medium** (deafness limits hearing-dependent opportunities but mitigatable with accommodations).  
    - B: **High** (no limitations).  
  - **Step 3**: Adjustment triggered (parents are Deaf; deafness grants cultural access).  
    - A: Re-ranked to **High** (opportunities in Deaf community offset broader limitations).  
    - B: Remains **High** (hearing child in Deaf family may face cultural barriers).  
  - **Step 4 (BA mode)**: Tie (**High**/High) → Hand decision to couple.  
  - **Outcome**: Couple may select embryo A.  
  - **Why you may dislike**: Deaf embryo is not deprioritized, challenging the view that hearing is objectively "better."  

  **Case 2: Polygenic Score for Behavioral Trait**  
  - Embryos:  
    - A: Higher polygenic score for "educational attainment" (population R² = 0.05).  
    - B: Lower score.  
  - **Step 1**: No exclusion (not a medical condition).  
  - **Step 2**:  
    - Score is weak/poorly calibrated → **No functional impact** per evidence. Both embryos rank **High**.  
  - **Step 3**: No adjustment (no cultural community identified).  
  - **Step 4 (BA mode)**: Tie → Hand decision to couple.  
  - **Outcome**: Panel rejects use of score; couple chooses freely.  

  **Case 3: Selecting Against Late-Onset Treatable Condition**  
  - Embryos:  
    - A: Carries BRCA1 variant (60% lifetime cancer risk, treatable with surgery/screening).  
    - B: No variant.  
  - **Step 1**: No exclusion (not lethal in youth).  
  - **Step 2**:  
    - A: **Medium** (late-onset, severe if untreated, but highly treatable → moderate limitation).  
    - B: **High**.  
  - **Step 3**: No adjustment (no cultural context).  
  - **Step 4 (BA mode)**: Recommend embryo B (higher rank).  
  - **Outcome**: Panel opposes selecting embryo A.  
  - **Why you may dislike**: Overrides couple’s potential willingness to accept manageable risk.  

  ---

  ### **IV. Vulnerabilities & Redesign Triggers**  
  **A. Where the Procedure Could Fail**  
  1. **Misapplication**:  
     - Step 2: Panel misjudges "severity" due to bias (e.g., overrating cosmetic impacts).  
     - Step 3: Cultural adjustment ignored for non-visible minorities (e.g., chronic illness communities).  
  2. **Gaming**:  
     - Couples exaggerate cultural ties to influence ranking (e.g., claiming Deaf identity without affiliation).  
     - SR mode used to justify "sufficient" embryos with avoidable limitations.  
  3. **Harm to Protected Groups**:  
     - Late-onset conditions (Case 3) penalized despite treatability, stigmatizing carriers.  
     - Low-resource parents unable to access mitigations (e.g., cochlear implants) skews rankings.  

  **B. What Would Force a Redesign (Not a Patch)**  
  1. **Evidence That Opportunity Range Cannot Be Separated from Societal Bias**:  
     - If studies prove "capability" assessments inherently reflect discrimination (e.g., ranking depression as "Low" because of workplace stigma), the core framework fails. Redesign would require abandoning capability-based ranking.  
  2. **Non-Identity Problem Invalidates Comparisons**:  
     - If robust philosophical argument (e.g., from a Parfit-like perspective) shows that "better life" comparisons between embryos are incoherent, the procedure’s foundation collapses.  
  3. **Empirical Data Showing Harm**:  
     - Longitudinal evidence that children born from this process experience identity harm (e.g., "I was optimized") or that it increases stigma against disabled people.  

  **C. Safeguards Against Failure**  
  - **Training**: Panelists certified in bias mitigation and cultural competency.  
  - **Audit**: Annual review of decisions for consistency/outcomes.  
  - **Transparency**: Publish anonymized cases with rationales to demonstrate anti-eugenics alignment.  

  ---

  This procedure balances ethical rigor with practicality, explicitly rejects eugenics, and forces value judgments back to the couple where appropriate. It is designed to evolve with new evidence—redesign if the core premise (that opportunity range can be assessed neutrally) is falsified.
