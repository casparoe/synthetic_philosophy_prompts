     - Embryo A: higher polygenic score for educational attainment (but the score is weak and poorly calibrated for this couple)
     - Embryo B: lower score

  Step 1: No condition incompatible with minimal opportunity range.

  Step 2: 
     - The panel must assess the impact of the polygenic score on opportunity range. 
     - However, the score is for a behavioral trait that correlates with educational attainment in the population. But it is weak and poorly calibrated for this couple. Therefore, the panel might conclude that the score does not reliably predict any limitation in opportunity range. 
     - The panel might decide that the score does not provide sufficient evidence of a condition that would limit opportunity range. Therefore, both embryos are considered to have the same opportunity range.

     Alternatively, if the panel believes that a lower score might lead to lower educational attainment and thus limit opportunities, they might rank A higher. But the principle says we must use the range of opportunities, not a particular conception of the good life. Educational attainment is a means to opportunities, but it is not the only means. And the score is weak and poorly calibrated, so the panel should not rely on it.

     The panel should disregard the polygenic score because it is not a reliable indicator of a limitation. Therefore, both embryos are ranked equally.

  Step 3: No cultural adjustment needed.

  Step 4: 
     - BA mode: Tie, so hand back to the couple. The couple might choose based on the score, but the panel does not endorse that.
     - Outcome: The panel does not use the polygenic score to rank the embryos.

  Case 3: Selecting against a variant for a treatable condition (e.g., BRCA) with onset in the sixth decade.

  - Embryos:
     - Embryo A: carries the BRCA variant (higher risk of breast cancer in 50s-60s)
     - Embryo B: does not carry the variant.

  Step 1: Not lethal in infancy.

  Step 2:
     - Embryo A: Condition: increased risk of breast cancer (and possibly other cancers) in middle age. 
          - Severity: High if cancer develops, but there are effective screening and preventive measures (e.g., mastectomy, oophorectomy) that can reduce the risk and catch cancer early. With these, life expectancy is near normal.
          - Onset: Usually in the 50s or 60s.
          - Interventions: Available and effective.
     - The impact on opportunity range: The condition may cause anxiety and require preventive surgeries, but it does not limit the child's opportunities in youth or early adulthood. In middle age, if cancer develops, it might cause temporary limitations during treatment, but with early detection, the prognosis is good.

     Embryo B: No such risk.

     Without adjustment, Embryo B has a higher opportunity range because it avoids the risk and the burden of interventions. However, the burden is not severe and occurs late in life. The panel might rank them equally? Or give a slight edge to B.

     But note: the opportunity range is over the entire life. Embryo A might have a slightly reduced opportunity range in middle age. So the panel ranks B higher.

  Step 3: No cultural adjustment.

  Step 4: 
     - BA mode: Recommend Embryo B.

  Outcome: The panel recommends against the embryo with the BRCA variant.

  But the condition is treatable and occurs late. The couple might not want to select against it because they don't want to discard an embryo for a late-onset condition. The panel's recommendation might be unwelcome.

  Now, what would change my mind about the core of the procedure?

  - If it turns out that the opportunity range cannot be assessed without incorporating societal discrimination (e.g., because discrimination actually limits opportunities for people with certain conditions), then the procedure might be conflating the two forms of selection. We try to avoid that by focusing on capabilities, but if societal response is part of the environment, then we cannot ignore it. But then we are selecting because of what the condition implies about existing people (via societal attitudes). This would require a redesign.

  - If the "sufficient range" threshold is too vague and leads to inconsistent decisions, we might need to define it more clearly or abandon SR mode.

  Where is it most likely to be misapplied, gamed, or fail?

  - Misapplied: Step 3 (cultural adjustment) might be applied inconsistently or might not be triggered when it should. Also, the assessment of opportunity range in Step 2 might be biased by the panel's own values.

  - Gamed: Couples might frame their preferences in terms of opportunity range to get the panel to endorse their choice. For example, in Case 1, if the parents are not part of the Deaf community but want a deaf child, they might claim to be part of it. The panel must verify.

  - Fail to protect: The procedure might fail to protect the interests of the future child when the couple wants to select for a condition that the panel deems limiting but the couple values. The procedure relies on the panel's assessment of opportunity range, which might be contested. Also, in SR mode, a child born with a condition that the panel deemed sufficient but that the child finds limiting might feel wronged.

