  Procedure Document:

  **Title: Procedure for Comparative Embryo Selection Based on Opportunity Range**

  **I. Purpose**
  This procedure provides a framework for the ethics committee panel to recommend which embryo to transfer when multiple embryos are available and the differences between them are matters of degree in the expected opportunity range of the future child. The procedure is guided by the principle that, among the available embryos, there is a reason to choose the one whose life is likely to go best, understood as having the widest range of opportunities. The procedure respects the couple's values and does not override their judgment about what matters.

  **II. Panel Composition and Timeline**
  - The panel consists of a reproductive endocrinologist, a genetic counselor, and a lay member.
  - The panel must complete the review within two weeks.
  - The panel may have up to two counseling sessions with the couple to gather information.

  **III. Switch Setting**
  At the outset, the panel must choose one of the following settings (based on the committee's interpretation of the principle, to be reviewed annually by the full committee):
  - **Best Available (BA)**: The panel will recommend the embryo with the highest expected opportunity range.
  - **Sufficient Range (SR)**: The panel will recommend any embryo that meets a threshold of having a sufficient opportunity range (defined in Step 4). If multiple embryos meet the threshold, the decision will be handed back to the couple.

  **IV. Steps**

  **Step 1: Identify Embryos with Conditions Incompatible with a Minimal Opportunity Range**
  - Review the genetic and medical information of each embryo.
  - Identify any embryo that, based on current medical consensus, has a condition that is universally considered to preclude a minimal opportunity range (e.g., conditions incompatible with life beyond infancy, or permanent unconsciousness).
  - If such an embryo is found:
     - Inform the couple of the medical consensus and the implications for the child's opportunity range.
     - The couple may choose to remove that embryo from consideration. If they do not, the panel must note this and include the embryo in the subsequent ranking, assigning it the lowest rank in opportunity range.

  **Step 2: Assess and Rank Opportunity Range for Remaining Embryos**
  - For each embryo, list all genetic conditions or traits that are expected to have a significant impact on the opportunity range of the future child. Exclude traits that are purely cosmetic or that do not affect physical health, cognitive function, or life expectancy in a way that limits opportunities.
  - For each condition/trait, using medical and scientific evidence, document:
     - Severity (mild, moderate, severe) and expected impact on daily functioning.
     - Age of onset and progression.
     - Availability and effectiveness of interventions (medical, assistive, educational) that could mitigate the impact on opportunity range.
  - Assess the overall opportunity range for each embryo by considering the cumulative impact of all conditions/traits. The assessment must focus on the direct limitations on the child's capabilities (e.g., ability to move, communicate, learn, live independently) and not on societal attitudes or discrimination.
  - Rank the embryos from highest opportunity range (least limitations) to lowest.

  **Step 3: Adjust for Cultural Context (if applicable)**
  - If an embryo has a condition associated with a cultural or linguistic minority community (e.g., Deafness) and the parents are part of that community, then:
     - Consult with the parents about the community and the opportunities it provides.
     - Adjust the opportunity range assessment for that embryo by considering both the opportunities within the minority community and the broader society. Specifically, note any unique opportunities within the community that might offset limitations in the broader society.
     - Re-rank if necessary.

  **Step 4: Apply the Switch Setting**
  - **If in BA mode**: Recommend the embryo ranked highest. If there is a tie, the panel may use non-opportunity factors (e.g., embryo viability) to break the tie, or hand the decision to the couple if the factors are value-laden.
  - **If in SR mode**:
     - Define a sufficient opportunity range as one where there are no conditions that, by medical consensus, cause severe limitations that cannot be mitigated and that would place the child in the worst-off group in terms of capabilities (e.g., conditions that prevent independent living, cause severe chronic pain, or severely limit communication and learning despite interventions).
     - Identify all embryos that meet this sufficient threshold.
     - If none, recommend the highest ranking from Step 2 (or Step 3 if adjusted).
     - If one, recommend that embryo.
     - If multiple, hand the decision back to the couple, as the remaining choice is a matter of values.

  **Step 5: Documentation**
  - Document the switch setting, the assessments at each step, the ranking, and the rationale for the recommendation.

  **V. Distinction from Eugenics**
  This procedure is not eugenic because:
  - It applies only to the selection among a couple's own embryos and does not aim to improve the population's gene pool.
  - It focuses solely on the expected well-being of the future child in terms of opportunity range, without making judgments about the worth of existing people with similar conditions.
  - It explicitly adjusts for cultural contexts to avoid devaluing traits that are part of a minority identity.
  - It respects the couple's autonomy and values throughout.

  Now, run the procedure on three cases.

  Case 1: Two deaf parents who want an embryo carrying a variant for deafness.

  Case 2: A couple who want to use a polygenic score for a behavioral trait (e.g., educational attainment) to choose between two embryos. The score is statistically real in the population but weak and poorly calibrated for this couple.

  Case 3: A couple who want to select against a variant that raises the risk of a treatable condition (e.g., hereditary breast cancer with a BRCA mutation) usually appearing in the sixth decade.

  We assume the panel is using BA mode unless specified.

  Case 1: Deaf Parents and Deaf Embryo
  - Embryos: 
     - Embryo A: carries variant for deafness (will be deaf)
     - Embryo B: does not carry the variant (will be hearing)

  Step 1: Neither embryo has a condition incompatible with a minimal opportunity range (deafness is not lethal).

  Step 2: 
     - Embryo A: Condition = deafness. 
          - Severity: Moderate (limits hearing, but with accommodations, many functions are possible).
          - Onset: Congenital.
          - Interventions: Cochlear implants, sign language, assistive devices.
          - Impact: Without interventions, the child would have limitations in a hearing world. With interventions, the child can have a wide opportunity range. However, even with interventions, some limitations may remain (e.g., in environments without accommodations).
     - Embryo B: No known conditions, so high opportunity range.

