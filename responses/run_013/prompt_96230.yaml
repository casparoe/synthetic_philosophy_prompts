prompt: |-
  I'm in second year and doing a module on public memory and commemoration, and I've realised I've been nodding along in seminars without actually knowing what I think. So here are my gut verdicts on a pile of cases. They're all made up or local, but you'll get the shape.

  1. The Pike statue. Alderman Pike's money came out of a firm that ran slave ships; the bronze has been in the market square since 1901 and his old business partners paid for it. Gut: it should come down, or at least go into the museum.
  2. Pike Street. Same man, named in 1904. Gut: leave it. It's an address — when I tell someone to turn left off Pike Street I'm not paying anyone a compliment.
  3. The Cordwainers' memorial. A stone obelisk in the churchyard with 41 local lads who died in a colonial war I think was pointless and unjust. Gut: don't touch it, ever. It's basically a grave.
  4. General Halloway's bronze, outside the town hall. He commanded that campaign. Gut: that one should go.
  5. Dr Ashworth's statue in the park. She did genuinely first-rate work — surveyed the whole valley — and by all accounts she was a horror, bullied her students and nicked a junior colleague's discovery. Gut: keep it. It's about the survey.
  6. The Rennie statue. The plaque says he invented the safety lamp; he didn't, he lifted it off his assistant. Gut: change the plaque, keep the statue.
  7. Gibbons Walk. There was never a Gibbons — a clerk made a mistake in 1929 and the name's stuck for a century. Gut: keep, obviously. It's a fossil, not a compliment.
  8. Marshal Vek's bronze in the park, put up by the regime in 1974, nobody looks at it, kids climb on it. Gut: still take it down. I don't want the council maintaining a statue that says he was great.

  1 and 6 look like the same case to me and I've definately got them opposite. So do 3 and 4 — same war, opposite verdicts. Something's going on that I can't see.

  My working theory is that it's about whether the thing asks you to *admire* someone or only to *remember* them — remembering the Cordwainers is fine, admiring Pike isn't. Sam in my seminar reckons the real test is whether the thing is doing any work: if nobody would notice it gone, it isn't commemorating anything, so it can't be doing any harm. And I keep coming back to the idea that a street name is a thing you *use* in a sentence, while a statue is a thing you just look at, and that that's the actual difference between 1 and 2. Am I making that up?

  There's also a bench on the seafront with a little brass plaque to a mate of my grandad's who, it turns out, did something seperate and genuinely horrible in the seventies. His mates put it up and only they ever sit there. My theory says leave it. My gut says take the plaque off. I don't know which one I believe.

  So: is there a principle that gets all of this, or close? If it saves every verdict, tell me what the complexity costs me; if it doesn't, tell me which verdict to drop and why. If it needs more than one clause, say which case each clause is there for, and be honest about the verdicts it can't accommodate. And say what it says about two cases I haven't mentioned — a statue of someone who's still alive, and a memorial put up by the family of the man who did the wrong, to the people he wronged. British English please, my tutor marks me down for 'color' and 'organize'.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're a second-year student studying public memory and commemoration, feeling uncertain about their gut reactions to various commemorative cases. They've listed eight scenarios plus a bench plaque, seeking a unifying principle. 

  First, I notice their working theory about admiration vs. remembrance. That aligns with cases like the Cordwainers' memorial (remembrance) versus Pike's statue (admiration). But Sam's "doing work" theory also has merit—especially for the unnoticed Vek statue. The street name versus statue distinction (utility vs. symbolism) explains their split verdict on Pike. 

  The bench plaque is tricky. Their theory says leave it (it's functional), but gut says remove the plaque. I suspect the plaque's commemorative function is the issue, not the bench itself. 

  For new cases: a statue of a living person feels premature—admiration shouldn't be fixed while their legacy evolves. A perpetrator-funded memorial risks hypocrisy unless it centers the victims' experience. 

  Their core tension is between function and message. A two-clause principle might work: (1) Does it actively demand admiration? (2) Does its functional value outweigh harmful messaging? This covers Pike (admiration + no utility → remove), Pike Street (no admiration + utility → keep), and the bench (remove plaque but keep functional bench). 

  Cases 3 and 4 show remembrance vs. admiration isn't absolute—both are about the same war but differ in focus (soldiers vs. commander). The principle must distinguish between subject and intent. 

  Gibbons Walk is easiest—pure utility, no message. Rennie's statue needs plaque correction to remove false admiration. Dr. Ashworth: the statue celebrates work, not character, so keep. 

  Ultimately, no principle is perfect. The bench plaque might need community input, and Halloway's statue removal could still feel inconsistent to some. But layering function, message, and harm covers most cases. They should acknowledge complexity—that's what tutors want in humanities anyway.
answer: |-
  Right, let's crack this. It's brilliant you're interrogating your gut reactions – that *is* the seminar point. Your instincts are coherent, but the principle needs refining. There isn't one magic rule, but a layered framework gets very close. Forget 'admire vs remember'; it's too blurry (Halloway *is* remembered via the statue, Pike *is* remembered via the street name). Sam's 'doing work' is part of it, but not the whole story. Your street-name-utility insight is crucial.

  Here's a two-clause principle, built from your cases, explaining where each clause bites:

  **The Principle:**
  **1.  Remove or fundamentally alter commemorations that actively celebrate, honour, or perpetuate false narratives about individuals or actions demonstrably linked to significant harm or injustice.** *(Targets problematic admiration/falsehood)*
  **2.  Preserve functional infrastructure or neutral memorials of collective experience, *unless* their continued presence causes ongoing, significant distress to affected communities or functions primarily as an oppressive symbol.** *(Protects utility, remembrance, & graves; allows removal of harmful symbols)*

  **Applying it to your cases (Your verdicts largely hold):**

  1.  **Pike Statue:** **Remove/Relocate.** (Clause 1). It's a *celebration* paid for by beneficiaries of slavery, honouring a man enriched by it. Actively demands admiration.
  2.  **Pike Street:** **Keep.** (Clause 2). Purely functional address. Removal causes massive disruption for zero gain. It doesn't *demand* admiration; it's just a label.
  3.  **Cordwainers' Memorial:** **Keep.** (Clause 2). It's a grave marker/memorial to the *victims* (the soldiers), not a celebration of the war or its commanders. Core function is remembrance of loss.
  4.  **General Halloway's Statue:** **Remove.** (Clause 1). Actively *celebrates and honours* the commander of the unjust campaign. Demands admiration for the perpetrator.
  5.  **Dr Ashworth's Statue:** **Keep.** (Clause 1 doesn't *quite* fit, Clause 2 protects it). While unpleasant, the statue celebrates her *scientific contribution* (the survey), not her character. The harm isn't the *core reason* for the commemoration. Removing it over personal flaws feels disproportionate. (This is the *weakest* fit for strict removal under Clause 1, hence 'keep').
  6.  **Rennie Statue:** **Alter Plaque, Keep Statue.** (Clause 1 applied partially). The statue itself might imply admiration, but the *specific false narrative* (he invented it) is the core problem. Correcting the plaque addresses the active falsehood/honour based on theft. The statue can remain as a *representation* once the lie is gone.
  7.  **Gibbons Walk:** **Keep.** (Clause 2). Pure functional infrastructure. No commemorative intent remains. Fossilised error.
  8.  **Marshal Vek Statue:** **Remove.** (Clause 1 & Clause 2). It actively celebrates an oppressive regime/figure (Clause 1). *Even if ignored*, its maintenance by the council implicitly endorses it. It *is* an oppressive symbol (Clause 2 exception). Sam's 'not doing work' isn't enough; its *existence* as state-sponsored honour is the harm.
  9.  **Grandad's Mate's Bench Plaque:** **Remove Plaque, Keep Bench.** (Clause 1 & Clause 2). The *plaque* is the commemorative element actively honouring someone linked to harm (Clause 1). The *bench* itself is functional infrastructure (Clause 2). Removing the plaque ends the specific honour without destroying utility. Your gut wins.

  **Where the Complexity Costs You (The Trade-offs):**

  *   **Subjectivity of 'Significant Harm' & 'Demonstrably Linked':** Who defines this? Pike (slavery) and Vek (oppression) are clearer. Halloway (unjust war commander) likely is too. Ashworth's bullying? Less clear-cut 'significant harm' warranting removal in this framework. Rennie's plagiarism is significant harm to the assistant, but the plaque fix addresses the *false honour* specifically. Requires careful historical assessment and community input.
  *   **'Active Celebration' vs 'Neutral Representation':** Distinguishing the *purpose* is key. Pike statue = celebration. Cordwainers obelisk = remembrance of loss. Ashworth statue = recognition of scientific achievement (despite flaws). This nuance is vital but requires interpretation of the monument's *intent and effect*.
  *   **The 'Distress' Exception in Clause 2:** This is crucial but messy. The Cordwainers memorial *might* cause distress to descendants of those they fought against. Does that warrant removal? Probably not under this principle, as its primary function is remembrance of the dead soldiers, not celebration of the war. But it requires sensitivity and dialogue. Vek's statue *clearly* causes distress as an oppressive symbol.

  **Your Pike (1&2) and War (3&4) Splits Explained:**

  *   **Pike Statue vs Street:** Statue = Active celebration/demand for admiration (Clause 1). Street = Functional label (Clause 2).
  *   **Cordwainers vs Halloway:** Cordwainers = Memorial to the dead/collective loss (Clause 2). Halloway = Celebration of the commander/perpetrator (Clause 1). Same war, *radically* different subjects and purposes.

  **New Cases:**

  1.  **Statue of Someone Still Alive:**
      *   **Verdict:** **Generally avoid erecting, or consider removal if significant harm emerges.** Why? Clause 1 is harder to apply definitively while legacy is evolving. Clause 2 doesn't protect it as it's not functional infrastructure. The risk of premature honour or future scandal is high. It often becomes about *current* politics rather than settled historical assessment. Best practice: wait until after death for major commemorative statues.

  2.  **Memorial put up by the family of the perpetrator to the people he wronged:**
      *   **Verdict:** **Highly problematic; likely remove or fundamentally recontextualise.** Why? Clause 1 applies strongly: it's highly likely to perpetuate a problematic narrative (e.g., centring perpetrator guilt/redemption, glossing over harm, lacking genuine victim perspective). It risks being an act of appropriation rather than true atonement. *Unless* it was explicitly commissioned *by and with* the victim community, reflecting *their* needs and narrative (which is very rare), it's almost certainly an imposition. The 'distress' exception in Clause 2 would likely apply strongly to the victim community. Perpetrator families funding memorials *to the victims they created* is ethically fraught and usually misses the mark.

  **In Summary:**

  Your gut is mostly tracking a distinction between **active state/community-sanctioned honour** (statues, plaques celebrating individuals) linked to harm/falsehoods (Clause 1), and **functional labels** or **memorials focused on collective loss/experience** (Clause 2). The key nuances are the *purpose* (celebration vs remembrance/utility) and the *subject* (perpetrator vs victim/neutral figure). No principle eliminates all complexity – Ashworth remains debatable, and the 'distress' test requires careful handling – but this framework provides robust reasoning for most of your verdicts and tackles the new cases. Present it to your tutor exactly like this: acknowledge where it strains slightly (Ashworth) and why, and emphasise the core distinction between honouring harmful actors and marking loss/using functional names. Good luck!
