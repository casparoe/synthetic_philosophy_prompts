answer: |-
  ## Joint Statement on Akrasia Research: Divided-Agent & Unified-Agent Frameworks

  After a year of rigorous adversarial collaboration, the undersigned representatives of the Divided-Agent (DA) and Unified-Agent (UA) research camps establish the following points of agreement and residual disagreement regarding the phenomenon of akrasia.

  **1. Agreed Claims:**

      1.  **Phenomena Scope:** Any acceptable account of akrasia must accommodate: (i) Commitment device demand (pre-emptive restriction of future choice sets); (ii) Preference reversals under temporal shifts (e.g., choosing SS now over LL later, but LL later over SS even later when both delayed); (iii) Reports of internal conflict ("I knew I shouldn't, but..."); (iv) The distinction between *diachronic akrasia* (acting against a past resolution without forming a contrary present judgment) and *clear-eyed akrasia* (acting against one's own concurrent all-things-considered judgment). *Unformed judgment* cases are distinct and not the core target of akrasia theories.
      2.  **Clarifying the Target:** Both camps are primarily theorizing about *clear-eyed akrasia* as defined above. Diachronic akrasia is also relevant but often analyzed through the lens developed for clear-eyed cases.
      3.  **Hyperbolic Discounting as Description:** The label "hyperbolic discounting" accurately describes a common empirical pattern of time preference (higher discount rates for immediate vs. delayed rewards). Agreement on this descriptive functional form does *not* entail agreement on the underlying mechanism or ontology (one structure vs. multiple subagents).
      4.  **Standard Data Limitations:** The standard data (e.g., preference reversals, commitment demand) do *not* uniquely determine: (i) Whether the underlying preference structure is fundamentally unified or partitioned; (ii) Whether preference reversals necessitate an actual change in the underlying ranking or can be explained by non-maximizing decision rules applied to a stable ranking; (iii) Whether commitment demand intrinsically signals anticipated preference change or could signal anticipated noise/lapse.
      5.  **Ordinary Language Boundaries:** In ordinary language, "akrasia" strongly implies a failure of self-governance where the agent acts against their own *best* or *stronger* judgment at the moment of action, aligning most closely with clear-eyed akrasia. Cases lacking a concurrent judgment against the act (e.g., pure diachronic akrasia without present conflict, unformed judgment) are borderline or distinct.
      6.  **The Noise Hypothesis:** The hypothesis that commitment demand stems from anticipating stochastic execution errors ("noise") while maintaining stable, time-consistent preferences is a genuine third position distinct from both DA and UA frameworks. It favors neither camp directly but challenges the inference that commitment demand *necessarily* signals anticipated preference change (DA) or a special kind of will-failure (UA). Empirically distinguishing noise from anticipated preference change requires experiments probing the *stability* and *determinism* of preferences under conditions designed to minimize noise (e.g., simplified choices, repeated trials, incentives for accuracy).
      7.  **Functional-Form Independence:** The question of whether discounting is non-exponential (hyperbolic-like) is conceptually distinct from the question of whether the underlying preference structure is unified or divided. Agreement on the former is possible without agreement on the latter.

  **2. Residual Disagreements:**

  | # | Disagreement (Neutral Wording)                                                                 | DA Position (UA-acceptable wording)                                                                                             | UA Position (DA-acceptable wording)                                                                                               | Crux                                                                                         | Case/Experiment/Argument                                                                                                 | DA Prediction                                                                                                                               | UA Prediction                                                                                                                                 |
  | :-- | :--------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | Does a preference reversal (e.g., SS now > LL later, but LL later > SS even later) *require* a change in the agent's underlying preference ranking between the two choice occasions? | The reversal pattern reveals a failure of bargaining between distinct temporal subagents, inherently implying a change in the effective preference ranking manifested at each time. | The reversal is compatible with a single, unchanging preference ranking over dated outcomes; the apparent reversal arises from applying a non-maximizing decision rule (e.g., based on absolute delay perception) to that stable ranking. | Does the *structure* of preferences (e.g., trade-offs between different delayed rewards) remain constant when the *absolute timing* changes, holding the relative gap constant? | Vary the absolute timing while holding the delay gap constant (e.g., SS in 1mo vs LL in 13mo; then SS in 25mo vs LL in 37mo) and measure choice consistency. | Preference structure depends on absolute proximity; reversal rates will be high even with constant gap, indicating shifting effective rankings. | Preference structure over *dated* outcomes is stable; reversal rates will be low with constant gap, indicating stability disrupted only by immediacy. |
  | **2** | Is demand for commitment devices fundamentally possible for a unified agent with time-consistent preferences? | Demand for commitment is an intrapersonal contract arising from strategic conflict between subagents with genuinely opposed future preferences; it is incompatible with stable, time-consistent unification. | A unified agent with time-consistent preferences can still rationally demand commitment if it anticipates future failures to *execute* its planned choice due to lapses of will or judgment, not due to preference change. | Can commitment demand arise *solely* from anticipation of performance errors ("noise") while maintaining perfect preference stability and time-consistency? | Designs isolating noise: e.g., commitment demand for choices with identical immediate rewards but different delayed consequences, under high cognitive load/time pressure. | Demand will correlate with anticipated preference conflict scenarios, not solely with generic noise-inducing conditions. | Demand will persist even for choices lacking future preference conflict, correlating strongly with conditions known to induce performance errors. |
  | **3** | Does the phenomenon of paying to remove a future temptation *necessarily* imply a divided agent structure? | Paying to remove a temptation is a clear intrapersonal contract where the present subagent binds a future subagent known to have different preferences, directly evidencing division. | Paying to remove a temptation is the action of a single agent managing its own anticipated future weakness of will in executing its settled plan, consistent with unified agency. | Does the *justification* given by the agent for paying for commitment reveal an anticipation of a *change in evaluation* (temptation becoming genuinely preferred) or an anticipation of a *failure to act* on an unchanging evaluation? | Structured interviews/protocol analysis with subjects immediately after they pay for commitment, probing their explicit reasons and expectations about their future self's evaluation and choice. | Agents will predominantly describe anticipating their future self *wanting* or *preferring* the temptation more. | Agents will predominantly describe anticipating their future self *succumbing* despite still *judging* it worse. |

  **3. Closing: Verbal and Substantive Disagreements**

  We agree that a significant portion of our apparent disagreement is verbal, centering on the terms "agent," "preference structure," and "conflict."

  *   **Verbal Element:** The DA camp's description of "subagents" and "intrapersonal contracts" vs. the UA camp's description of "a single agent" and "failure of the will" often represent different *metaphorical frameworks* or *modes of description* applied to the same underlying behavioral patterns (conflicted phenomenology, reversals, commitment demand). Neither description is inherently more "literal"; they serve different explanatory and predictive purposes. Calling the phenomenon "strategic conflict" (DA) or "volitional failure" (UA) often reflects this terminological choice rather than a deep ontological commitment requiring different data.

  *   **Substantive Element:** However, the disagreement is not *merely* verbal. The core substantive disagreement lies in the **predictions each framework generates** about the *underlying drivers* of the phenomena, particularly concerning the stability of evaluation (Claim 1), the nature of the anticipated failure motivating commitment (Claim 2), and the agent's own self-understanding of conflict (Claim 3), as captured in the table above. These are testable empirical differences.

  **Confidence Assessment:**

  *   **Agreed Claims (1-7):** We express high confidence (80-95%) in Claims 1, 3, 4, 6, and 7. These are well-established by existing data and conceptual analysis. We express moderate confidence (60-75%) in Claims 2 (clarifying the target) and 5 (ordinary language boundaries). Claim 5 is the **least certain claim in the entire document.** Linguistic corpus studies or large-scale surveys probing folk intuitions about diverse scenarios (e.g., clear-eyed vs. diachronic vs. unformed judgment cases) could significantly revise our understanding of the term's core boundaries.

