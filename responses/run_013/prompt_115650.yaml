prompt: |-
  I'm a philosophy professor here and I've somehow ended up as the department's rep on our new Learning Analytics and Advising Advisory Group (the acronym is LAAG, which nobody likes). We meet next Wednesday and I have to bring a written recommendation on the item that's been eating our meetings: the advising office wants to pilot a vendor's preference-aware course recommendation engine with the incoming class, starting at spring registration. The system watches what students actually do -- which courses they browse and add and drop, which sections they switch into, how long they sit on a page in the LMS, whether they come back to a listing after abandoning it -- and fits a model that is supposed to recover each student's underlying preferences over majors, departments, and course attributes. Then it nudges: students whose inferred profile resembles yours tend to do well in X, and it flags anyone whose registration pattern looks out of line with their declared major so an advisor can reach out. The vendor's technical appendix describes the inference as inverse reinforcement learning, and the sales pitch is basically that this only makes explicit what students have been revealing all along by choosing, and that a preferences survey is worse because self-reports are noisy and biased by whatever the student thinks we want to hear. Here's the wrinkle that has people stuck: when the model's inferred profile conflicts with what a student says she wants, the vendor says advisors should trust the model, since the behavior is the honest signal. Two of my colleagues are ready to approve the whole thing as harmless personalization; the advising director says if we don't approve it she'll buy a cheaper product from another vendor that does the same work with less oversight, which I think is a real argument and not just a threat.

  Please draft the memo I'll circulate before the meeting. I want a concrete recommendation -- approve, reject, or approve with specific conditions and a date for revisiting -- plus reasons the advising office and the vendor could actually respond to, and a fair statement of the strongest thing the other side has going for it, since I don't want to be the guy who just says no to technology in a memo nobody can answer. And here is the part I care about most: the philosophical content shouldn't be decoration on a risk-management document. I want the memo to be honest about what is actually settled in the literature on learning preferences from behavior versus what is genuinely contested among people who work on this, and not to present a contested position as the consensus. If the argument turns on a specific claim about what this kind of inference can and cannot identify from observed choices, state the claim plainly and mark it as a claim rather than asserting it as established, and where you think reasonable people would divide, say where the line is.

  Also, no reading list and no citations, please -- I don't want the memo padded with references, and I don't want us to be the committee that hides behind a bibliography. Short enough that people actually read it before Wednesday. American English. And no, I can't just recuse myself, I already tried.
reasoning: |-
  Okay, let me unpack this philosophy professor's dilemma. They're stuck in an advisory group evaluating a preference-inferring course recommendation system, needing to draft a decisive memo by Wednesday. The core tension is between behavioral data as "honest signal" versus student self-report as authentic preference expression - a classic philosophy of mind meets ethics puzzle.

  Hmm, the professor's constraints are telling: no citations (practical), must acknowledge strongest opposing arguments (fair), and philosophical substance can't be ornamental (rigorous). They're clearly allergic to bureaucratic hand-waving. The vendor's inverse reinforcement learning approach frames choices as revealed preferences, but the memo needs to expose where that model might misfire - like when browsing ≠ intent, or when structural barriers distort "choice".

  Right, the real landmine is the vendor instructing advisors to override stated preferences with algorithmic inferences. That's not just technically dubious (can IRL really disentangle constraints from preferences?), but ethically fraught - it risks substituting observed behavior for internal states, which philosophers from Frankfurt to Dennett have problematized. The student who browses pre-med courses while dreaming of art history isn't "revealing" medical ambitions; she might be negotiating family pressure.

  I should structure the memo around three pressure points: epistemic limits (what behavior can/can't prove), ethical risks (autonomy erosion), and pragmatic alternatives. The compromise position - approve with conditions - must force transparency about uncertainty metrics and preserve student veto power. And absolutely must call out the advising director's vendor threat as coercion, albeit politely.

  The tone needs academic steel but no jargon: when describing inverse reinforcement learning's assumptions, phrase it as "the system presumes X" not "X is true". For contested claims - like whether dropped courses signal dislike - explicitly mark where reasonable experts would disagree. Save the Foucault-worthy critiques of surveillance for faculty drinks later; here, focus on operationalizable safeguards.

  ...And suppress the urge to footnotes. Even though the literature on preference construction vs revelation (Schwarz, Ariely etc.) screams for citations. The professor's right - this committee shouldn't hide behind bibliographies when confronting algorithmic paternalism.
answer: |-
  **MEMORANDUM**  
  **TO:** LAAG Members  
  **FROM:** Dr. [Your Name], Philosophy Department Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Preference-Aware Course Recommendation Engine Pilot  

  ### I. RECOMMENDATION  
  **Approve the pilot with the following binding conditions:**  
  1. **Advisors must prioritize student-stated preferences** when conflicts arise with model inferences. The system may *supplement* advising but never override a student’s declared intent without explicit consent.  
  2. **Implement transparency protocols:**  
     - Students see what data the model uses (e.g., "Based on your browsing of Biology courses").  
     - Students receive plain-language explanations of why a recommendation was generated (e.g., "Students with similar registration patterns often enroll in X").  
     - Opt-out mechanism for data collection and recommendations.  
  3. **Independent audit of bias:** Before launch, the vendor must share anonymized inference outputs with our Institutional Research office to audit for systematic disparities (e.g., by gender, first-gen status).  
  4. **Sunset clause:** The pilot expires after one semester. Continuation requires review of efficacy *and* ethical compliance by this committee.  

  **If these conditions are not contractually agreed to by the vendor, we recommend rejection.**  

  ---

  ### II. RATIONALE: CORE CONCERNS AND COMMON GROUND  
  **A. Why Conditions Are Non-Negotiable**  
  1. **Epistemic Limits of Behavioral Inference:**  
     - The vendor claims behavior reveals "true" preferences. While choices *reflect* preferences, they do not *isolate* them. Observed actions (e.g., dropping a course) conflate:  
       - Genuine preference shifts,  
       - External constraints (schedule conflicts, finances, family needs),  
       - Information gaps (misunderstood requirements),  
       - Exploratory actions (browsing out of curiosity).  
     - *Contested Claim:* The vendor’s inverse reinforcement learning model can reliably disentangle "underlying preferences" from noise/constraints. Reasonable experts disagree on whether this is feasible without contextual self-report.  
     - **Risk:** Mistaking constraint-driven behavior for preference (e.g., a student avoiding stats courses due to childcare needs, not disinterest) could lead to harmful nudges.  

  2. **Agency and Autonomy:**  
     - Trusting the model over a student’s stated goals treats the student as an unreliable narrator of their own intentions. This is philosophically and ethically fraught. Behavior is *data*, not *testimony*.  
     - **Risk:** Undermining student autonomy by substituting algorithmic interpretation for dialogue. Advisors become auditors of behavior, not partners in exploration.  

  3. **Self-Report Isn’t Just "Noise":**  
     - While self-reported preferences can be biased, they capture aspirational goals, values, and identity—dimensions behavior may obscure. Dismissing them entirely ignores the role of education in *shaping* preferences through reflection.  

  **B. Strongest Argument for the Vendor’s Approach (Acknowledged Fairly)**  
  Behavioral data can reveal patterns students haven’t articulated (e.g., consistent avoidance of quantitative courses despite a declared interest in economics). When used *diagnostically*, it may help advisors ask better questions ("I notice you’ve dropped two writing-intensive courses; tell me about that experience"). The system’s potential to surface misalignments between behavior and declared goals could enable timely support—**if** handled as a conversation starter, not a verdict.  

  ---

  ### III. RESPONSE TO KEY STAKEHOLDERS  
  - **To Advising Office:** This framework ensures you gain actionable insights while protecting advisor-student trust. The conditions prevent backlash from prescriptive nudges that feel intrusive or erroneous.  
  - **To Vendor:** These requirements align with emerging best practices in ethical edtech (transparency, user agency). Systems refusing these safeguards risk reputational damage and abandonment.  
  - **To Colleagues Approving "Harmless Personalization":** Personalization is not neutral. Inferred preferences can calcify into feedback loops, narrowing student exploration. Guardrails ensure the tool expands, not restricts, intellectual curiosity.  
  - **To the Director’s Alternative Vendor Threat:** A cheaper, less oversight-compliant system amplifies all risks outlined. We should pilot *responsibly* or not at all—this protects both students and institutional integrity.  

  ---

  ### IV. CONCLUSION  
  This technology isn’t inherently unethical, but its deployment risks treating students as data objects rather than meaning-making agents. Our conditions ensure it serves as a *tool for advisors*, not an arbiter of intent. The pilot must test not just accuracy, but whether it enriches advising as a *human* practice. If the vendor rejects our terms, the risks outweigh the benefits.  

  **Final Vote:** Approve with Conditions (as specified in Section I) or Reject.  

  ---  
  **Preparation for Wednesday:** Please come ready to discuss:  
  1. Specific language for vendor transparency protocols (Item I.2).  
  2. Metrics for the independent bias audit (Item I.3).  

  // End //  
  *(Word count: 650)*
