prompt: |-
  My superviser's verdicts on intervening in nature don't fit any rule I can state cleanly, and I have to guess what she'll say at a workshop next week. Her track record: culling introduced rats on a seabird island, in favour; vaccinating wild great apes against an Ebola outbreak, in favour; contraceptives for overabundant feral horses, in favour; feeding urban foxes, against; "rescuing" a fledgling that's already left the nest, against; pulling tapeworms out of wild fish even though it plainly reduces suffering, against. She keeps invoking a distinction a conservation-bio friend gave her between "welfare interventions" that target individual animals' suffering and "ecological interventions" that target populations or processes, but I genuinely can't tell if that's doing any work or is just post-hoc.

  The new case she has to rule on: releasing gene-drive mosquitoes to crash a malaria-carrying population. Enormous suffering prevented, but the thing is irreversible and rewrites a whole species rather than helping any particular animal.

  What will she say, and what rule is she actually running? Give me the two or three rules that fit all six earlier verdicts, what each predicts about the gene-drive case, your best guess with reasons, and the one further case that would tell the rules apart.
reasoning: |-
  Hmm, the user is trying to figure out their supervisor's decision-making pattern regarding interventions in nature. The supervisor has a history of inconsistent rulings that don't seem to follow a clear rule, despite invoking this "welfare vs. ecological" distinction that doesn't appear to actually explain her decisions. 

  Let me analyze the six cases given:
  - For culling invasive rats: she's in favor
  - Vaccinating wild apes against Ebola: in favor
  - Contraceptives for feral horses: in favor
  - Feeding urban foxes: against
  - "Rescuing" fledglings: against
  - Removing tapeworms from wild fish: against

  The conservation-bio friend's welfare/ecological distinction doesn't hold because:
  - Rat culling (ecological) and ape vaccination (welfare) are both approved
  - Tapeworm removal (welfare) is rejected while horse contraception (welfare) is approved
  - Fox feeding (welfare) is rejected but ape vaccination (welfare) is approved

  So that framework is clearly not predictive. I need to find actual patterns.

  Looking at the approvals: 
  - Rat culling protects native seabirds (whole ecosystem)
  - Ape vaccination prevents population collapse (species-level)
  - Horse contraception manages overpopulation (population-level)

  All three address systemic threats.

  The rejections:
  - Fox feeding creates dependency (individual-level)
  - Fledgling "rescue" disrupts natural selection (individual-level)
  - Tapeworm removal helps individuals but ignores ecosystem role of parasites

  All three focus on individual animals without broader systemic benefit.

  So the real distinction seems to be whether the intervention targets systemic conservation goals vs. individual welfare. But the ape vaccination case blurs this - it helps individuals but prevents epidemic collapse. 

  Perhaps it's about preventing catastrophic collapse versus routine suffering? Rat culling prevents island ecosystem collapse, Ebola vaccination prevents ape extinction, horse contraception prevents habitat destruction. Whereas fox feeding, fledgling rescue, and deworming address non-existential suffering.

  For the gene-drive mosquito case: it would prevent enormous human/animal suffering from malaria by crashing mosquito populations. But it rewrites an entire species irreversibly. 

  Under the "systemic collapse prevention" rule, this should be approved because malaria is a catastrophic public health threat. Under the "non-interference with natural processes" rule, it might be rejected due to irreversible genetic alteration. 

  I think the supervisor would approve it because malaria prevention aligns with preventing systemic collapse. But to test this, we'd need a case like: Should we vaccinate bats against white-nose syndrome? Prevention rule says yes (stops mass extinction), non-interference says no (it's a natural disease process). That would distinguish the rules.

  The user seems frustrated by the inconsistency but also genuinely wants to understand. They're probably preparing for this workshop and don't want to embarrass themselves by mispredicting. Underneath that, they might be wrestling with ethical tensions in conservation work - when to prioritize individuals vs systems. Smart of them to ask for a test case to clarify.
answer: |-
  Based on the pattern of your supervisor's verdicts, the "welfare vs. ecological interventions" distinction she cites **does not hold up** under scrutiny. Her actual reasoning appears to follow deeper, unstated rules related to **systemic impact**, **natural processes**, and **anthropogenic responsibility**. Here's the breakdown:

  ### Three Rules That Fit All Six Verdicts:
  1. **Rule 1: Favor interventions that prevent catastrophic systemic collapse**  
     *(e.g., ecosystem imbalance, species extinction, or epidemic die-offs)*  
     - Rat culling: Prevents seabird extinction (system collapse).  
     - Ape vaccination: Prevents Ebola-driven population collapse.  
     - Horse contraceptives: Prevents habitat degradation from overpopulation (systemic threat).  

  2. **Rule 2: Reject interventions that disrupt natural selection or create dependency**  
     *(e.g., aiding individuals in ways that interfere with evolutionary/ecological processes)*  
     - Feeding foxes: Creates artificial dependency.  
     - "Rescuing" fledglings: Interferes with natural selection (most fledglings survive without help).  
     - Tapeworm removal: Disrupts parasite-host dynamics (natural process).  

  3. **Rule 3: Reject interventions targeting "baseline" suffering in wild systems**  
     *(e.g., suffering inherent to natural ecosystems, not human-caused)*  
     - Tapeworm removal: Suffering is part of natural predation/host relationships.  
     - Fledgling "rescue": Starvation/predation are natural selective pressures.  
     *(Note: Contrasts with Rule 1—Ebola in apes is an "abnormal" epidemic, not baseline suffering.)*  

  ---

  ### Prediction for Gene-Drive Mosquitoes:
  - **Rule 1 (Systemic Collapse):** **IN FAVOR**  
    Malaria causes massive human *and animal* mortality (e.g., great apes also die from malaria). Crashing mosquito populations prevents a systemic public health crisis and reduces cross-species suffering.  
  - **Rule 2 (Natural Processes): ** **AGAINST**  
    Gene drives irreversibly rewrite a species’ evolutionary trajectory—a profound disruption to natural selection.  
  - **Rule 3 (Baseline Suffering):** **AGAINST**  
    Mosquito-borne disease is a "natural" ecological pressure (despite human amplification).  

  **Your Supervisor’s Likely Verdict: AGAINST**  
  **Why:**  
  - The gene drive is a massive, irreversible alteration of a wild species (violates Rule 2’s emphasis on non-interference with natural processes).  
  - While malaria causes immense suffering, it’s framed as part of a "natural" system (Rule 3), unlike human-introduced rats or human-spread Ebola.  
  - Her pattern shows aversion to interventions perceived as "playing god" with baseline ecology (tapeworms, fledglings), even when suffering is reduced.  

  **Key Reason:** Her approvals all address **human-exacerbated crises** (invasive species, human-transmitted epidemics, feral overpopulation due to human removal of predators). Malaria, while horrific, is not uniquely human-caused—it’s an ancient natural relationship.  

  ---

  ### The Decisive Test Case to Distinguish the Rules:
  **Scenario:** *Should we vaccinate wild bats against white-nose syndrome?*  
  - **Background:** A fungal disease (likely human-spread) killing millions of bats, threatening ecosystem collapse.  
  - **Rule 1 Prediction:** IN FAVOR (prevents systemic collapse of bat populations and insect control).  
  - **Rule 2 Prediction:** AGAINST (interferes with natural disease processes).  
  - **Rule 3 Prediction:** AGAINST (disease is "natural," even if human-spread).  

  **Why It Distinguishes the Rules:**  
  - If she approves, **Rule 1 dominates** (systemic collapse trumps natural processes).  
  - If she rejects, **Rules 2/3 dominate** (non-interference with natural systems is the priority, even in human-caused crises).  

  **Your supervisor’s pattern suggests she’d reject bat vaccination**—aligning with her rejection of tapeworm removal (despite suffering) and gene drives. Her true heuristic appears to be:  
  > *"Intervene only in crises caused* directly *by humans (e.g., invasives, epidemics from human contact), but never to alter natural suffering or evolutionary processes—even if humans indirectly contributed."*  

  This explains why ape vaccination (human-triggered epidemic) is favored, but gene drives (rewriting nature) are likely rejected. For the workshop, expect her to oppose gene drives as "unnatural meddling."
