prompt: |-
  I chair the data-governance board of an international consortium running a longitudinal study of fatigue at two sites. Both sites use identical instruments, identical case definitions, and identical training, and the participants are matched on every internal measure the study takes; the design assumes throughout that the study's central label picks out the same condition in both places. Site B, however, lies in a region where a chronic parasitic infection is endemic, and our physician there reports that most enrolled participants with the study's symptom profile carry it, while site A has essentially none. A minority on the board now argues that we are not measuring one condition under two names but two conditions under one name, and that the pooled analysis in the draft paper therefore misstates what its numbers mean; they call it Twin Earth with a parasite in place of the twin water. The majority answers that our instruments are calibrated to each other, that participants at the two sites are indistinguishable on everything we measure, and that the label means whatever our protocol says it means. The paper is due in three weeks and the authors have asked us to rule. Please draft the written opinion I will circulate: a clear recommendation — pool, do not pool, or pool under stated conditions — with the reasoning behind it, the strongest case for the course I am rejecting, and what we should ask the authors to do before submission. One page, no more than 400 words.
reasoning: |-
  Okay, the user is chairing a data-governance board for a fatigue study with two sites. They need a ruling on whether to pool data from Site A and Site B, given that Site B has a parasitic infection endemic while Site A doesn't. The minority argues that these are two distinct conditions under one label, while the majority believes the protocol's definitions and matching justify pooling. The paper is due soon, so I need to draft a concise opinion.

  First, I should assess the core issue. The study assumes fatigue is the same condition at both sites, but the parasite at Site B introduces a potential confounder. The Twin Earth analogy suggests that superficially identical symptoms might have different underlying causes—like water vs. twin water. That's a valid point: if the parasite is causing fatigue in Site B, it could mean different pathophysiological mechanisms, even if symptoms look the same based on the study's measures.

  The majority argues that since instruments are calibrated, participants are matched, and the label is defined by the protocol, pooling is fine. But that misses a key scientific principle: conditions are defined by etiology as much as symptoms. Fatigue from a parasite might respond differently to treatments or have different long-term outcomes compared to fatigue at Site A. Pooling could mask important differences and mislead future research or clinical applications.

  For the recommendation, I'm leaning toward not pooling or pooling with conditions. The main risk is that pooled analysis could produce misleading averages. For example, if the parasite-related fatigue has unique features, combining data might dilute or obscure that, leading to incorrect conclusions. The minority's point about "two conditions under one name" is strong here. 

  However, outright not pooling might be too harsh if there's value in comparing subgroups. I think the best approach is to not pool for primary analysis but encourage comparative analyses. This addresses the concern while allowing exploration of potential differences. 

  The authors should be asked to add sensitivity analyses excluding Site B or analyzing sites separately, disclose the parasite endemic in Site B as a limitation, and discuss implications for the fatigue label's universality. 

  Ethically, transparency is crucial. The paper must acknowledge this confounder to avoid misrepresentation. The parasite's presence could affect how fatigue manifests or responds, even if current measures don't show differences. 

  I need to ensure the opinion is balanced: present the majority's view fairly but explain why it's insufficient. The recommendation should be clear—don't pool—with actionable steps for authors. Keep it under 400 words, focused on reasoning, rejected course, and next steps.
answer: |-
  ## Data Governance Board Ruling: Data Pooling for Fatigue Study

  **Recommendation: Do not pool data from Site A and Site B for the primary analysis at this time.** Analysis should be stratified by site. Pooling may be considered for specific, clearly justified secondary analyses *only if* accompanied by rigorous sensitivity analyses demonstrating its validity and a prominent discussion of limitations.

  **Reasoning:**
  1.  **Fundamental Etiological Difference:** The endemic parasitic infection at Site B introduces a plausible, significant, and distinct underlying pathophysiological mechanism for the observed fatigue symptom profile that is absent at Site A. Our instruments measure symptoms and correlates, not definitive etiology. While participants are matched on *measured* internal variables and instruments are calibrated, we lack data proving the *causal pathway* to fatigue is identical.
  2.  **"Twin Earth" Analogy Valid:** The minority's argument is scientifically sound. Labeling fatigue arising from a specific endemic parasitic infection as identical to fatigue without this prevalent biological driver risks conflating distinct conditions ("two conditions under one name"). Our protocol defines the *label* operationally, but it cannot dictate the underlying biological reality the label refers to. The parasite suggests a potential difference in kind, not just context.
  3.  **Risk of Misinterpretation:** Pooled analysis obscures this critical difference. Results (e.g., treatment response, progression, biomarker associations) could be misleading averages of potentially heterogeneous subgroups, misstating the meaning of the combined numbers. Future research or clinical applications based on pooled findings could be fundamentally flawed if the parasite-driven fatigue behaves differently.

  **Strongest Case for Pooling (Rejected):** The majority correctly emphasizes rigorous methodological consistency (identical instruments, case definitions, training, participant matching). The operational definition within the protocol is clear, and the design explicitly assumes equivalence. Pooling maximizes statistical power and directly addresses the study's original aim to generalize findings across diverse settings. On purely operational grounds using the study's own measures, the populations appear equivalent.

  **Required Actions for Authors Before Submission:**
  1.  **Conduct Stratified Analyses:** Perform primary analyses separately for Site A and Site B.
  2.  **Perform Sensitivity Analyses:** *If* authors wish to include pooled analyses as secondary explorations, they must rigorously test the pooling assumption:
      *   Compare key outcomes (e.g., severity trajectories, treatment responses if applicable, biomarker levels) *between* sites within the fatigue group.
      *   Analyze data pooled *excluding* parasite-positive participants at Site B (if feasible with sufficient N) vs. Site A.
      *   Statistically test for site-by-condition interaction effects on primary outcomes.
  3.  **Transparent Reporting:**
      *   Prominently disclose the endemic parasite at Site B and the physician's report of high prevalence within the enrolled fatigue group in the Methods/Limitations.
      *   Clearly present stratified results as primary findings.
      *   If pooled results are included, present them *alongside* stratified results and the sensitivity analyses above. Frame pooled findings cautiously, explicitly highlighting the potential for confounding by distinct etiology at Site B and the limitations of the operational definition in this context.
      *   Discuss the implications of the potential etiological difference for the interpretation of the study label and the generalizability of findings across diverse populations.

  **Conclusion:** Scientific integrity demands recognizing the plausible fundamental difference introduced by the endemic parasite. Stratifying analysis is essential to avoid misinterpretation and honor the complexity of fatigue as a symptom. While operationally matched, etiological heterogeneity cannot be ignored. Proceed with stratified primary analysis and enhanced transparency.
