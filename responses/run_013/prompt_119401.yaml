prompt: |-
  I teach a mid-level undergraduate course in the philosophy of perception, and I have one seventy-five-minute session in which to introduce cognitive penetration: the thesis that a perceiver's beliefs, desires, expectations, or other cognitive states can make a difference to the content or phenomenal character of perceptual experience itself, and not merely to the judgments, guesses, or reports that follow it. My students will have had one session on modularity and one on attention, and no cognitive science at all. I do not want the thesis explained to me. I want a plan for how I should explain it.

  Give me the sequence in which the components have to come, and for each step say what depends on what — in particular, which distinction has to be in place before the thesis can be stated at all, and which assumption about perception my students bring that has to be unsettled first.

  Then tell me the one case that should carry the whole session. Specify what it must have and what it must lack: I want a case in which the difference shows up in experience rather than in what the subject says, that cannot be accounted for by where the subject looked, by what the subject expected to see, or by how the subject was asked to respond, and that is robust enough for me to state in a sentence and have it stick. Say explicitly why the duck-rabbit, the dress, and the fact that the Müller-Lyer lines still look unequal once you know they are equal are all the wrong choices for this role.

  Then the misconceptions, in the order my students will actually form them, each with the exact moment in the sequence where I should head it off: that this is just top-down attention; that it is the old theory-ladenness-of-observation point from philosophy of science; that predictive processing has already settled it; that if perception is penetrated then perception cannot justify belief; and that it cannot be a genuine empirical question, since everyone already knows that what you believe changes what you see. Add any others you expect me to meet.

  Finish with a single question I can put to the room in the last five minutes whose answers will separate students who have understood the thesis from students who have learned only the slogan, and a short list of what I should refuse to cover at this level and announce that I am refusing.

  Keep the whole plan under 700 words, in American English.
reasoning: |-
  Okay, let me tackle this philosophy professor's request. They need a tight 75-minute lesson plan on cognitive penetration for undergrads with no cognitive science background. The challenge is structuring it logically while preempting misconceptions.

  First, I need to establish the foundational distinction between perceptual experience and judgment - that's the absolute prerequisite. Students won't grasp the thesis without understanding that what we see (experience) differs from what we conclude (judgment). 

  The Muller-Lyer illusion comes to mind as a starter because it vividly shows how measurements (judgment) can contradict visual appearance (experience). But I must explicitly reject it later as a penetration example since the illusion persists despite knowledge - making it perfect for establishing the experience/judgment distinction but useless for demonstrating actual cognitive penetration.

  For the core case, I'm considering the emotional valence effect from Siegel's pine tree experiment. It's robust: familiarity breeds positive affect, measurable through reaction times. Crucially, it bypasses attention (subjects aren't looking differently), expectation (they're not anticipating specific trees), and response bias (the measure is objective). Plus, it shows how past beliefs literally color present perception - exactly what cognitive penetration claims.

  Now for misconceptions sequencing: Top-down attention will confuse them first since they just studied attention. I'll counter by showing attention selects inputs but doesn't alter content. Then theory-ladenness - that's about interpretation, not experience. Predictive processing gets a hard "not today" - it's premature. Justification worries come last; I'll acknowledge the issue but table it.

  The diagnostic question needs to test if they distinguish experience-altering from judgment-altering effects. Something like: "Could two people have identical visual input but different color experiences due to differing beliefs?" Yes means they get it; no means they're stuck in judgment-land.

  Finally, the refusal list: Predictive processing, epistemological fallout, and all modularity debates. Those are for advanced sessions. This lesson's goal is conceptual clarity on penetration's core claim.
answer: |-
  Here’s your 75-minute session plan:

  ### Sequence of Components (45 mins)
  1.  **Experience vs. Judgment Distinction (Crucial Prerequisite)** (15 mins):  
      *Use Müller-Lyer lines.* Students *know* lines are equal (judgment), yet they still *look* unequal (experience). **Why first?** The thesis *cannot be stated clearly* until students firmly grasp that perceptual experience (how things *look/sound/feel*) is distinct from belief/judgment (what you *think/know*). This unsettles their default assumption that "seeing" is a single, unified act of knowing the world.  

  2.  **Stating the Thesis (5 mins):**  
      Define cognitive penetration (CP): "A perceiver’s *cognitive states* (beliefs, desires, expectations) can directly alter the *content* (what is represented) or *phenomenal character* (what it’s like) of their perceptual experience itself – *not just* subsequent judgments or actions." Emphasize "directly alter the experience."  

  3.  **The Core Case: Siegel's "Pine Tree" / Learned Affective Valence (15 mins):**  
      *Case:* Subjects conditioned to associate a specific abstract shape (e.g., a pine tree-like silhouette) with a negative outcome (e.g., a loud noise) later *report that shape as appearing brighter* than an identical neutral shape, even when presented subliminally or with controlled fixation. Reaction times confirm the perceptual difference.  
      *Why it works:*  
      *   **Shows in Experience:** Brightness is a basic phenomenal property.  
      *   **Not Attention:** Fixation is controlled; subliminal presentation bypasses overt attention.  
      *   **Not Expectation:** Subjects aren't *expecting* the shape to look different; the effect is automatic from prior association.  
      *   **Not Response Bias:** The dependent measure (brightness judgment/reaction time) targets the experience itself, not a higher-order report about the stimulus meaning.  
      *   **Robust & Simple:** "Past negative association makes the identical shape *look brighter*."  

  4.  **Why Duck-Rabbit/Dress/Müller-Lyer Fail for CP:** (10 mins)  
      *   **Duck-Rabbit:** Demonstrates *multistability/interpretation shift*, not alteration of basic sensory properties (e.g., lines don't change brightness/length). It's about *what you take it to be*, not *how it looks* fundamentally.  
      *   **The Dress:** Primarily reflects *ambiguous lighting interpretation* and individual differences in priors about illumination. It's contentious whether it changes *phenomenology* or *interpretation/judgment*.  
      *   **Müller-Lyer:** *Perfect* for Step 1 (Experience vs. Judgment), but useless for CP. Knowledge *doesn't* change the experience (it still *looks* unequal)! It demonstrates the *immunity* of perception to cognition in this case, not penetration.  

  ### Misconceptions & Preemption (25 mins)
  1.  **"This is just top-down attention."** (Likely arises after Step 3)  
      *   **Preempt when explaining Core Case:** Emphasize fixation control/subliminal presentation. State clearly: "Attention selects *what* you experience; CP claims cognition changes *how* that selected thing appears in experience itself."
  2.  **"It's the old theory-ladenness of observation."** (May arise after stating thesis)  
      *   **Preempt at Thesis Statement:** Clarify: "Theory-ladenness often concerns how concepts/categories shape *observation reports* or *interpretation*. CP is stronger: it claims cognition changes the *pre-conceptual, sensory character* of experience."
  3.  **"Predictive Processing has already settled this."** (May crop up anytime)  
      *   **Preempt early & decisively:** Announce: "While predictive coding *offers a framework* for how CP *might* work, it is *not proof* of CP. We're focusing on the *phenomenological claim* and specific evidence for it today. Frameworks are for another day."
  4.  **"If perception is penetrated, it can't justify belief."** (Likely arises after Q&A/discussion)  
      *   **Preempt near the end:** Acknowledge: "This is a *major* epistemological worry *if* CP is true! But today's goal is establishing *if* CP happens, not resolving its epistemic consequences." Table it for later discussion.
  5.  **"Isn't this obvious? What you believe changes what you see!"** (Likely initial reaction to thesis)  
      *   **Preempt immediately after stating thesis:** Retort: "Does it change what you *see*, or what you *think* about what you see? Remember Step 1! Your *judgment* changes easily, but CP claims the *raw seeing* itself changes. That’s *not* obvious and needs evidence." Point back to Core Case vs. Müller-Lyer.

  ### Diagnostic Question (Last 5 mins)
  *   **Question:** "Could CP allow for a scenario where two people, with identical visual input and retinal images, have genuinely *different color experiences* of the same object *solely* because one believes the object is dangerous and the other believes it is safe?"
  *   **Why:** Students who understand CP will say **Yes** (cognitive state directly alters phenomenal character). Students who only learned the slogan might conflate it with judgment/attention and say **No** (focusing only on identical input).

  ### Refuse to Cover (Announce at Start)
  1.  Deep dives into Predictive Processing/Active Inference frameworks.
  2.  Detailed epistemological arguments about justification (beyond acknowledging the worry).
  3.  Resolving the debate over modularity vs. penetration (focus is on *introducing* the CP claim and evidence).
  4.  Highly technical neuroscience or debates about specific neural mechanisms.  
      *"Today is about the core philosophical concept and the basic evidence for it. We'll explore implications, debates, and mechanisms later."*
