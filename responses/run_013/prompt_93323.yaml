  3. **Murder-as-signal as the master key**. The name/place coincidence ("Albert") exposes reference as arbitrary. The murder isn’t about time but *semiotics*: meaning emerges from violence that collapses possibilities. This bridges time-philosophy and lit-crit.  
  4. **Story’s unique contribution**: Fiction embodies temporal paradoxes *experientially*. Yu Tsun’s dread vs. Albert’s scholarly joy—affect makes abstraction visceral. The refutation’s regress feels different when lived as plot.  

