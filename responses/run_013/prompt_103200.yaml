prompt: |-
  OK so I got into an argument at a department lunch and it's been bugging me for a week. A collegue of mine (maths, not philosophy) reckons the Condorcet jury theorem basically settles how groups should make decisions, and he used it to argue we should scrap expert panels entirely. I wrote his case out and I'm pretty sure it proves way too much, but I can't put my finger on where it breaks. Here it is:

  (1) If a group votes on a yes/no question, and each member is independently more likely to get it right than wrong, then the majority is more likely to be right than any single member is, and the more members you add, the closer the majority's probability of being right gets to 1.
  (2) Our faculty has to decide whether a grant proposal is worth funding. Suppose each of us, reading it cold for half an hour, is right 51% of the time — barely better than a coin, but better.
  (3) Then if we just get enough of us in a room — say 400 of us, each at 51% and each making up their own mind — the majority verdict will be right with probability indistinguishable from certainty.
  (4) So it's actually epistemically irresponsible to use a small panel of real specialists; a big enough room of barely-above-chance readers beats them.
  (5) Which is obviously nuts. Three people who've worked in this area for a decade and spent a week on the proposal are not less reliable than 400 of us skimming it over coffee.
  (6) So either (1) is wrong or I'm applying it wrong.

  Which step do I give up, and what does giving it up cost me? If it helps: I'd much rather keep (1) than keep (4) — it's a real theorem and I don't want to be the guy who denies maths — but I'll take the hit if I have to. I also honestly couldn't tell you whether "51%" is even the right kind of thing to plug in there, or whether "each making up their own mind" is what the theorem actually needs.

  One thing I'd ask: seperate the bits that are genuinely settled among people who know this theorem from the bits that are actually contested, and don't sell me a contested reading as if it were the consensus. I don't know this literature well enough to tell the difference myself.
reasoning: |-
  Okay, the user is dealing with a philosophical and mathematical argument about decision-making. Let me unpack this step by step. They had an argument with a colleague about the Condorcet Jury Theorem (CJT) and its application to expert panels versus large groups. The colleague claims that large groups of barely competent individuals are more reliable than small expert panels, which the user finds counterintuitive.

  First, I need to recall what CJT actually states. The theorem says that if each voter in a group has an independent probability greater than 0.5 of being correct, then as the group size increases, the probability of the majority being correct approaches 1. The user's colleague applied this to suggest that 400 people with 51% accuracy would outperform a small panel of experts. But the user is skeptical because real experts with deep knowledge should be more reliable.

  The user's core concern is identifying where the argument breaks down. They mentioned steps (1) to (6), and want to know which step is flawed. They prefer to keep (1) since it's a proven theorem, but (4) leads to an absurd conclusion. So the issue must lie in how the theorem is applied.

  Looking at the assumptions of CJT: independence and identical competence. In real scenarios, especially with a large group skimming a proposal, independence is unlikely. People might be influenced by common biases or shared misunderstandings. Also, each member having exactly 51% accuracy is unrealistic. Experts likely have higher individual competence, even if it's not quantified as a probability. 

  The user also questioned whether "51%" is appropriate here. Probabilistic competence assumes each decision is independent and identically distributed, which doesn't hold for complex grant evaluations. Experts bring nuanced judgment that can't be reduced to a fixed probability. 

  Another point is that CJT applies to factual yes/no questions, but grant decisions involve value judgments and uncertainty, not just correctness. The theorem's binary framework might not capture the complexity of such decisions. 

  The user wants to separate settled aspects of CJT from contested applications. It's established that CJT holds under its assumptions, but applying it to real-world group decisions involves contested interpretations. The independence and competence assumptions are often violated, which experts in the field acknowledge. 

  The user might also have an unspoken need: to defend the value of expertise in academic settings. They might be worried that dismissing expert panels could undermine rigorous peer review. So addressing the practical limitations of CJT in this context is crucial. 

  In conclusion, the flaw is in step (2) and (3). Assuming 51% accuracy for all members and independence isn't valid. Experts have higher competence, and their evaluations aren't independent in large groups. Therefore, step (4) doesn't follow, preserving the validity of CJT while explaining its misapplication.
answer: |-
  You're absolutely right to be skeptical - your colleague's argument misapplies the Condorcet Jury Theorem (CJT) in several critical ways. **The flaw is primarily in step (2) and the assumptions feeding into step (3), NOT in the theorem itself (1).** Here's the breakdown, separating settled math from contested/contextual application:

  **Settled Math (Where CJT Holds):**
  1.  **Theorem Validity (1):** CJT is mathematically proven under *very specific assumptions*. If:
      *   Voters make **independent** judgments.
      *   Each voter has **identical, fixed competence** `p` (probability of being correct).
      *   `p > 0.5` for every voter.
      *   The question has a **single, objectively correct answer** (yes/no).
      *   Then **both conclusions hold:** The majority is more likely correct than any individual, and `P(majority correct) -> 1` as `n -> ∞`.

  **Misapplication & Contested/Contextual Issues (Where the Argument Breaks Down):**
  1.  **"51%" is wildly unrealistic and misapplied (Step 2):**
      *   **Settled:** Plugging `p=0.51` into the CJT formula *does* show `P(majority correct)` approaches 1 very quickly (e.g., ~99.3% for n=400). *The math here is correct.*
      *   **Contested/Flawed:** The assumption that `p=0.51` is remotely plausible for your scenario is the **fatal flaw**.
          *   **Experts vs. Non-Experts:** Your specialists spending a week aren't "51% competent". Their `p` is likely *significantly higher* based on training, experience, and time invested. Comparing a large group with `p=0.51` to a small group with `p_expert >> 0.51` is comparing apples to oranges. CJT says nothing about large groups of low-competence vs. small groups of high competence – it only compares groups *with the same p*.
          *   **Meaning of "51%" (Deeply Contested):** Assigning a single, fixed probability `p` to complex, nuanced judgments like "Is this grant worth funding?" is highly problematic. Expertise isn't just about getting a binary fact right; it's about nuanced evaluation, weighing trade-offs, and identifying non-obvious flaws/merits. `p` likely isn't constant across different types of proposals or reviewers. **This reduction of expertise to a fixed probability is arguably the core conceptual error.**

  2.  **"Independence" is implausible (Critical Assumption Violation - Step 3):**
      *   **Settled:** Independence is a *strict requirement* of CJT. Without it, the theorem's conclusions don't hold.
      *   **Contested/Flawed:** The phrase "each making up their own mind" grossly underestimates how independence fails in practice, *especially* in large groups of minimally engaged reviewers:
          *   **Common Biases:** All reviewers are susceptible to common cognitive biases (framing, prestige bias, current trends) or shared misunderstandings of the proposal text.
          *   **Shared Heuristics:** Under time pressure, many will rely on superficial cues (author reputation, institution, length, jargon density) in similar ways.
          *   **Lack of Diverse Expertise:** 400 people from the *same department* likely share foundational knowledge but lack the diverse, specialized perspective needed to deeply evaluate a niche proposal. True independence often requires diverse perspectives, not just many similar ones.
          *   **Social Influence (Even Implicit):** In a large group setting (even if voting secretly), awareness of being part of a crowd or potential reputational concerns can subtly influence judgment away from true independence.
      *   **Expert Panels Mitigate This:** While not perfectly independent, small expert panels achieve independence through deliberate selection (diverse viewpoints), deep individual analysis reducing reliance on superficial cues, and often structured deliberation techniques designed to surface unique perspectives.

  3.  **Nature of the Question (Step 4 is a Non-Sequitur):**
      *   **Contested:** Grant funding decisions are **rarely pure "factual" yes/no questions** with a single objectively correct answer. They involve:
          *   **Value Judgments:** What constitutes "worth funding"? Impact vs. feasibility vs. novelty? Different reviewers weight these differently.
          *   **Uncertainty:** The "correctness" can often only be judged retrospectively, if ever.
          *   **Nuance:** A binary vote discards the valuable nuance, caveats, and conditional recommendations experts provide. CJT assumes a clear binary truth exists *now*.
      *   **Settled Implication:** CJT fundamentally applies to questions with *objectively verifiable correct answers*. Applying it directly to complex value-laden judgments like grant funding is a **category error**.

  4.  **Epistemic Irresponsibility Claim (Step 4 is Wrong):**
      *   **Flawed:** Given the implausibility of `p=0.51` and true independence for large groups of non-specialists, and the high `p` and *relatively* better independence achievable by experts, the claim that using experts is "epistemically irresponsible" collapses. The reliability (`P(correct)`) of a small, high-competence group can easily exceed that of a large, low-competence group, especially when independence fails.

  **The Resolution: What to Give Up**

  *   **Give Up:** The assumptions in **Step 2** (`p=0.51` for everyone, including experts judged cold vs. specialists spending a week) and the assumption of true **Independence** in **Step 3** for the large group. Also, the implicit assumption that the grant question is a suitable binary factual question.
  *   **What it Costs You:** Nothing mathematical. You fully accept CJT *as a mathematical theorem under its specific assumptions*. You simply recognize that the real-world conditions required to apply it advantageously to this specific situation (large group of non-experts beating small experts) are unrealistic. You acknowledge the difficulty in precisely quantifying `p` and ensuring independence in complex judgments.
  *   **Keep:** Step 1 (CJT itself). Reject Step 4 as a misapplication. Reject the implication that Step 2/3 describe reality accurately.

  **Conclusion:**

  Your intuition is correct. The argument proves too much because it relies on assumptions (`p=0.51`, perfect independence, suitable binary question) that are demonstrably false in the context of expert grant review vs. large-scale superficial review. CJT is a powerful theorem, but it's not magic. It requires its assumptions to hold. **The consensus among those who study CJT seriously is that its power is highly sensitive to violations of independence and the assumption of homogeneous `p > 0.5`, and that applying it to complex, value-laden judgments is fraught.** Experts aren't valuable *despite* CJT; their value often lies in achieving higher `p` and mitigating dependence in ways large groups of minimally engaged individuals cannot.

  **How to Counter Your Colleague:** "CJT is mathematically sound, but your application assumes conditions that don't hold. Our specialists aren't 51% competent; they're likely far higher. More importantly, 400 of us skimming independently is a fantasy – we'll share biases and misunderstand the proposal in similar ways. CJT requires true independence and identical `p>0.5`. Grant decisions also involve value judgments CJT doesn't handle. A small, diverse panel of real experts, precisely because of their deep engagement, achieves both higher individual competence *and* better approximates the independence CJT needs than a large room of casual readers ever could."
