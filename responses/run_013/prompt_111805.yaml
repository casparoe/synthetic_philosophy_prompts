answer: |-
  ### Voting Game: The Cost of a Single Voice  
  **Objective:** Experience the tension between individual rationality (saving your token) and collective outcomes (your side winning) without prior jargon. Feel how the incentive to vote flips as the electorate size or closeness changes, and confront the paradox firsthand.

  ---

  ### Game Setup
  **Materials:**  
  - 20 secret type cards (11 "Blue" and 9 "Green" for Round 1; 10 "Blue" and 10 "Green" for Round 2).  
  - Poker chips or candy (e.g., M&Ms) as tokens (5 per student per round).  
  - Two voting boxes (one for Blue, one for Green) and blank slips for abstentions.  
  - A coin for tiebreakers.  

  **Rules (Read Aloud):**  
  - "You’ll vote in two secret ballots. Each round, you are secretly assigned to team **Blue** or **Green**. Your goal is simple: **maximize your tokens** (exchangeable for candy after the game).  
  - **If your team wins**, you gain 10 extra tokens. **If your team loses**, you get 0.  
  - **Voting costs 1 token** (put one in the box if you vote). **Abstaining costs nothing** (keep your token).  
  - Majority wins. Ties are decided by coin flip.  
  - No talking during votes. Your type card is secret—never reveal it."  

  **Time:** 15 minutes total for setup/voting per round (30 mins), 45 mins for debrief.  

  ---

  ### Round 1: The Large Electorate (20 Voters)  
  1. **Assign Types**: Shuffle and distribute 11 Blue and 9 Green cards.  
  2. **Distribute Tokens**: Give each student 5 tokens.  
  3. **Vote**:  
     - Students choose:  
       - **Vote for their team**: Drop a token + voting slip in their team’s box.  
       - **Abstain**: Drop an abstention slip in a neutral box (no token).  
     - Emphasize: "This is simultaneous and secret—no one sees your choice."  
  4. **Tally & Announce**:  
     - Count votes openly. Most votes wins.  
     - **Payoffs**:  
       - Winning team: +10 tokens to all members (even abstainers).  
       - Losing team: +0.  
       - All voters lose 1 token (enforce strictly).  
     - *Goal*: Blue (majority) should lose if most abstain, while Green (minority) votes.  

  ---

  ### Round 2: The Tight Electorate (20 Voters, but Engineered Closeness)  
  1. **Reassign Types**: Collect cards. Redistribute 10 Blue and 10 Green cards.  
  2. **Reset Tokens**: Give everyone 5 fresh tokens (ignore Round 1 winnings to reset incentives).  
  3. **Vote**: Same as Round 1.  
  4. **Tally Rigging**:  
     - **Secretly pre-set the count to 10-10** (discard excess votes randomly to force a tie).  
     - Flip a coin to decide the winner.  
     - **Then reveal the rig**: "Actually, the raw vote was __ to __, but I forced a tie to show something important."  
     - *Goal*: Show that in a near-tie, every vote feels pivotal.  

  ---

  ### Predictable Problems & Fixes  
  1. **"Duty Voters" Ignore Payoffs**:  
     - **Why it happens**: Some vote out of habit/morality, ignoring token costs.  
     - **Fix**:  
       - Pre-game: Hammer "maximize tokens" as the **only** goal. Say: "This is a game about incentives, not ethics. Save tokens to win candy."  
       - If they vote anyway: In debrief, ask: "Why did you spend a token when you could’ve kept it? Did you expect to be pivotal?" Use their defiance to highlight how real voters ignore low probabilities.  

  2. **Round 1 Majority Doesn’t Abstain**:  
     - **Why it happens**: Optimism ("Others might abstain, so I’ll vote!").  
     - **Fix**:  
       - Pre-vote hint: "Remember, if your team has more people, your vote might not be needed."  
       - If Blue wins: In debrief, ask: "Blue voters, if you knew 10 others would vote, would you still spend your token? Why?" Contrast with Round 2.  

  3. **Token Accounting Slows Things Down**:  
     - **Fix**: Use prepaid envelopes. Students put tokens in envelopes labeled "VOTE" or "ABSTAIN" during voting. Tally while they work on a quick puzzle.  

  4. **The "One Vote" Moment Isn’t Organic**:  
     - **Why**: You can’t force a 10-9 vote naturally.  
     - **Fix**: Rig Round 2 (as above). Admit post-game: "Real votes aren’t rigged—I forced the tie to show how pivotality feels when it’s close."  

  ---

  ### What the Game Can’t Replicate (Say in Debrief)  
  - **The "Microscopic Chance" Escape Hatch**:  
    - Post-game, explain: "In national elections, your vote has a 1-in-a-million chance of mattering. But if the outcome affects millions, that tiny chance might be worth the cost. Rational people might still vote!"  
  - **Scale of Large Electorates**:  
    - Say: "In Round 1, your pivot chance was ~0.5% (with 11 vs. 9). In a 10-million-voter election, it’s billionths of a percent. But both produce the same paradox: individual apathy creates collective tragedy."  

  ---

  ### Debrief Script (35–45 mins)  
  1. **Feelings First**:  
     - "Show of hands: In Round 1, who thought voting was pointless? Who did it anyway? In Round 2?"  
     - "Blue majority in Round 1: How did it feel to lose because you saved tokens?"  

  2. **Reveal the Paradox**:  
     - "Individually, saving tokens was smart. Collectively, it gave you a result nobody wanted. This is the **paradox of voting** (aka Downs paradox)."  
     - "In Round 2, when I forced a tie, your vote suddenly felt decisive. But pre-vote, the probability was low. We confuse the *feeling* of pivotality with the *probability*."  

  3. **Discuss the "Smart" Answer**:  
     - "Is abstaining always rational? No! If the stakes are huge (e.g., climate policy), even a microscopic chance might justify voting. But in low-stakes elections? Maybe not."  
     - "The paradox isn’t ‘don’t vote’—it’s that voting systems create weird incentives."  

  4. **Connect to Theory**:  
     - "Rational choice says: Vote if (Probability of being pivotal) × (Stakes) > Cost. But in large groups, probability shrinks, so costs dominate."  
     - "Collective action problems arise when individual rationality undermines group goals."  

  **End**: "So—should you vote? It depends. But now you’ve felt the tension."  

  ---

  ### Why This Works  
  - **Scale Shift**: Round 1’s asymmetry (majority apathy → minority win) and Round 2’s artificial tie make pivotality visceral.  
  - **No Jargon**: Concepts emerge from experience.  
  - **Handles Flaws**: Duty voters become teachable moments; rigging Round 2 ensures the "close vote" lesson.  

  **Time Tip**: Use student helpers to count votes/tokens. Run rounds back-to-back (20 mins), then debrief (55 mins).
