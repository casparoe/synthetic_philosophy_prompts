  The user has also specified requirements for a carrying example that must have real stakes, involve a genuine coordination problem, be accessible without social science background, and avoid stock comparisons. They want misconceptions addressed, a diagnostic end question, and clear scope boundaries.

  I need to craft a teaching plan that sequences these elements logically. The session must start by establishing the two-dimensional framework since everything else builds on that. Then we'd need examples to illustrate how strength and tolerance can vary independently. After establishing the descriptive framework, we can introduce the carrying example - something like "village irrigation schedules" could work well as it has coordination needs, real stakes (crop survival), and avoids clichés.

  The normative analysis should come next, broken into the three argument types. Each argument type should be applied to the irrigation example to show how they yield different recommendations. Misconceptions need addressing at specific points - probably when introducing the framework (to prevent conflating tightness with authoritarianism) and during normative discussion (to avoid collapsing into relativism).

  The end question should test if students grasp the independence of norm strength and deviance tolerance. Scope boundaries need stating explicitly - we'll avoid empirical measurement debates and institutional design details. 

  For confidence assessment, I feel good about the overall structure but wonder if the irrigation example might be too rural for some students. However, it meets all criteria better than urban alternatives I considered. The sequence is solid: descriptive foundations first, then application, then normative analysis, with misconceptions intercepted proactively. The end question directly targets the core conceptual split.
answer: |-
  Here’s a focused 50-minute teaching plan structured around your requirements:

  ---

  ### **Session Structure & Rationale**  
  **Total: 50 mins**  
  *(Key: > = transition)*  

  1. **Hook & Descriptive Framework (10 mins)**  
     - **Activity:** Pose: *"Two societies both ban loud music after 10pm. In one, rule-breakers are shamed (even if no one hears the music); in the other, violators face fines only if neighbors complain. How are they different?"*  
     - **Establish Dimensions:**  
       - **Norm Strength:** How *intensely* norms are held (shame/fines vs. indifference).  
       - **Deviance Tolerance:** Acceptability of *visible* nonconformity (private vs. public violations).  
     - **> Why?** Must disentangle dimensions upfront to avoid "tight=authoritarian/loose=free" collapse.  

  2. **Illustrating Independence (7 mins)**  
     - **Examples Matrix:**  
       |                          | **High Norm Strength** | **Low Norm Strength** |  
       |--------------------------|-------------------------|------------------------|  
       | **Low Deviance Tolerance** | Theocracy (strict, intolerant) | "Broken Windows" policing (weak norms, harsh on public dissent) |  
       | **High Deviance Tolerance** | Japanese workplace norms (strong expectations, private flexibility) | Liberal arts campus (weak consensus, high public dissent allowance) |  
     - **> Why?** Concrete cases prevent conflation. Preempts *Misconception 1: Tight=Authoritarian/Loose=Free* (e.g., "Broken Windows" has low norm strength but low tolerance).  

  3. **Carrying Example: Village Irrigation Schedules (15 mins)**  
     - **Setup:** A farming village shares a canal. Rules dictate *when* each farm accesses water (e.g., Farm A: Mondays 6-8am).  
     - **Stakes:** Crop survival (real hunger risk). Coordination problem (only one farm can use canal at once).  
     - **Apply Dimensions:**  
       - *Norm Strength:* How fiercely is scheduling defended? (e.g., elders enforce vs. casual reminders).  
       - *Deviance Tolerance:* Is *secret* pre-dawn water theft ignored if crops survive? Is *public* midday theft punished?  
     - **> Why?** Legible, non-stock example with coordination + survival stakes. Tests if students see norm/deviance as separate levers.  

  4. **Normative Frameworks (13 mins)**  
     - **Coordination Argument:** Rules solve canal chaos → high norm strength *needed* for survival. But deviance tolerance possible if theft is invisible/harmless.  
     - **Threat Argument:** In drought, any theft risks famine → low deviance tolerance *even if norms weak*.  
     - **Expressive Argument:** Water-sharing as village identity → high norm strength *and* low tolerance (theft = betrayal).  
     - **> Why?** Splits normative Q per your framing. Preempts *Misconception 2: Relativism* (ask: "Do threat arguments justify norms *regardless* of existing culture?").  

  5. **Diagnostic Closing Question (5 mins)**  
     - **Check Understanding:** *"Could a society have* strong *norms about water-sharing but* high *tolerance for someone publicly breaking rules during a flood? Which arguments might support this?"*  
     - **Reveals:** If they grasp independence (yes! Expressive vs. threat logic) vs. conflate dimensions.  

  ---

  ### **Misconception Management**  
  - **Tight=Authoritarian:** Head off in **Step 2** using "Broken Windows" (low strength + low tolerance ≠ authoritarian ideology).  
  - **Loose=Free:** Correct in **Step 2** via Japanese workplace (strong norms + private flexibility ≠ liberty-focused).  
  - **Relativism Collapse:** Block in **Step 4** by stressing threat/coordination arguments apply *across* cultures (e.g., "Drought justifies tightness even in loose societies").  

  ---

  ### **Scope Boundaries**  
  **Openly Exclude:**  
  - Empirical metrics (Hofstede/Gelfand scores).  
  - Institutional design (how states enforce tight/loose).  
  - Non-coordination normative arguments (e.g., virtue ethics).  
  *State clearly: "Today’s focus is conceptual toolkit, not policy or measurement."*  

  ---

  ### **Confidence & Least Sure Step**  
  - **Confidence: 8/10.** Structure addresses your core requirements: dimensional split, normative pluralism, example criteria.  
  - **Least Sure:** Irrigation example’s **deviance tolerance** nuance. Will students *see* why visible vs. hidden theft matters? Mitigation: Emphasize *"What if someone steals at noon (public) vs. 3am (private)?"* in Step 3.  

  The sequence forces dimension-splitting before normativity, uses a high-stakes coordination example without clichés, and preempts collapse points at key junctures. Adjust timings if discussion over-indexes on Step 2.
