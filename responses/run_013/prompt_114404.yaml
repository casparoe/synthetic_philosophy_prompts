prompt: |-
  I am a third-year PhD student in economics, and this term I have been sitting in on a graduate seminar in the philosophy of language that I joined for slightly disreputable reasons: I kept losing an argument about vagueness to a friend in the department and wanted to lose it more precisely. We have spent three weeks on the sorites paradox, and I have a reaction I would like you to engage with rather than talk me out of. On the board the paradox looks devastating; in my own field it looks inert. Economists draw lines through vague predicates for a living, and the drawing does not seem obviously arbitrary or embarrassing. The case I keep returning to is the dating of recessions. The rule of thumb everyone learns — two consecutive quarters of falling output — is not the definition, and the body that actually dates American business cycles, the Business Cycle Dating Committee of the National Bureau of Economic Research, does not use it. Its stated definition is "a significant decline in economic activity that is spread across the economy and lasts more than a few months," and its practice is frankly discretionary: it weighs depth, diffusion and duration against one another, treats the three as partly substitutable, publishes no algorithm, decides retrospectively and months late, and revises its chronology when the underlying statistics are revised. The rule of thumb fails in both directions. The 2001 downturn is the standard example of a recession with no two consecutive quarters of negative growth, and the recession that began with a February 2020 peak and ended with an April 2020 trough lasted two months, the shortest in the chronology. Then, in the first half of 2022, output fell for two consecutive quarters and there was a loud public argument about whether a recession had begun; the committee never called one — its chronology still ends with the April 2020 trough — and the argument simply subsided, with no one able to say what the correct answer had been.

  What I want is a case analysis that runs in both directions rather than a summary of the paradox. First, in the direction my seminar trains me in: say what the sorites machinery actually does to "recession." What is the tolerance principle here, stated exactly — the premise that one more month of slightly lower activity cannot turn an expansion into a recession — and does the forced march from an unmistakable boom to an unmistakable slump go through as cleanly as it does for heaps and bald men, or does something in the case resist it? Take seriously that this predicate looks manufactured in a way that "heap" does not: the quantity being measured is a constructed and repeatedly revised index, resting on weighting and deflation choices, and the question "was there a recession?" is always asked for a purpose — to trigger policy, to assign blame, to date a narrative. Is "recession" vague, or context-sensitive, or interest-relative, or all three, and does the answer change what the paradox has to bite on? I would also like the higher-order question pressed, because the committee's definition is itself built out of vague terms, so the alleged precisification appears to be vague one level up as well.

  Second, in the direction my seminar does not train me in, and which I suspect is the more interesting one: what does this episode do to the competing accounts of vagueness? If the committee's calls are treated as authoritative — if once the announcement is made it is simply settled, for practical purposes, that the 2001 downturn was a recession and the 2022 one was not — does that favor the view that there is no fact of the matter and that boundaries are drawn by decision, and if so, does the drawing being constrained, contested and revisable make that position easier or harder to hold? Or does the practice look more like discovering a boundary that was always there and merely hard to see? Or like degree-talk, on which recessions come in degrees and the committee's real job is to report whether some threshold was crossed, with the threshold fixed by the purposes at hand? I want the episode used as a test rather than an illustration: tell me which account it favors, which it embarrasses, and where all of them are simply silent — for instance, whether any of them has anything to say about who ought to be doing the precisifying, or about the fact that the committee decides after the fact and then revises, so that the boundary appears to move in time rather than to have been drawn once and for all. I do not need a survey of the literature or suggestions for further reading; I have the seminar for that. What I want is the mapping, done carefully, and an honest ledger at the end: what the sorites paradox explains about how we date recessions, what it misdescribes, and what the practice of dating recessions shows about the paradox.
reasoning: |-
  Okay, let me start by unpacking this PhD student's query. They're an economics student auditing a philosophy of language seminar, specifically focusing on the sorites paradox. Their main observation is that while the paradox seems powerful in philosophy, it feels inert in their field where drawing lines through vague terms like "recession" is routine. They provide the example of the NBER's Business Cycle Dating Committee, which uses discretionary judgment rather than strict rules to date recessions.

  First, I need to address both directions they want: applying sorites to "recession" and then seeing what the recession-dating practice tells us about theories of vagueness. 

  For the first part, the tolerance principle for "recession" might be: one month of slightly lower economic activity can't turn an expansion into a recession. But the economic case resists the sorites cleanly because economic indicators are multidimensional (depth, diffusion, duration) and interdependent. Unlike heaps where you remove grains one by one, changing one economic variable affects others. Plus, the data is constructed and revised, adding layers of uncertainty. So the predicate isn't just vague; it's also context-sensitive and interest-relative. The committee's definition uses vague terms like "significant," making the vagueness higher-order too.

  For the second part, the student wants to test theories of vagueness against this practice. The committee's authoritative decisions, which are contested and revisable, challenge epistemicism because if there were a fact of the matter, why the delays and revisions? Supervaluationism struggles with the lack of a unique admissible precisification. Contextualism fits well since the decision depends on the purpose—like policy triggers. Interest-relative theories align with how the committee weighs trade-offs. Degree-theory is supported by discussions of "shallow recessions" but isn't reflected in the binary outcome. Overall, the practice highlights that precisification is a constrained, pragmatic process, which most theories don't address—especially the temporal aspect of revisions.

  I should also note where theories are silent: who should precisify, the process of revision over time, and how data revisions affect boundaries. The sorites explains why line-drawing feels arbitrary but misses how multidimensional trade-offs and institutional authority manage the vagueness in practice. Dating recessions shows that vagueness is navigated through structured decision-making rather than resolved philosophically.
answer: |-
  Here’s a bidirectional case analysis mapping the sorites paradox onto recession-dating practices and vice versa, respecting your request to avoid survey-style exposition and focus on the friction between philosophical machinery and economic practice.

  ### I. What Sorites Does to "Recession"
  **(A) The Tolerance Principle & Its Resistance**  
  - **Formal Tolerance Premise**: *If an economy at month \(t\) is in expansion, then a marginal deterioration in activity (e.g., 0.1% decline in GDP, negligible rise in unemployment) at \(t+1\) cannot make it a recession.*  
  - **Sorites Forced March**: Start from a robust expansion (e.g., 5% GDP growth, 3% unemployment). Apply tolerance repeatedly through incremental deteriorations. Eventually, you reach a severe slump (e.g., -10% GDP, 20% unemployment) while insisting no single step crossed into recession.  

  **Where the Case Resists**:  
  1. **Multidimensionality**: The paradox assumes a single linear dimension (grains of sand, hairs). But "recession" integrates *depth* (output decline), *diffusion* (sector spread), and *duration* — and these are *partially substitutable*. A sharp 1-month crash (e.g., COVID) may override "duration" if depth/diffusion are extreme, breaking the monotonic chain.  
  2. **Interdependence**: Economic indicators are causally linked (e.g., falling output → rising unemployment → reduced spending). Small changes trigger nonlinear feedback, violating sorites' assumption of "marginal" independent steps.  
  3. **Data Revision/Construction**: The "quantity" (e.g., GDP) isn’t fixed. Revisions to data *retroactively alter the path* of the forced march. A step that seemed marginal in real-time may later be revealed as significant.  

  **(B) The Nature of "Recession"**  
  - **Vagueness + Context-Sensitivity + Interest-Relativity**:  
    - *Vagueness*: "Significant decline," "more than a few months," "spread across economy" lack sharp boundaries.  
    - *Context-Sensitivity*: Whether 2022’s slowdown was a "recession" depended on *comparative narratives* (post-COVID rebound vs. inflation crisis) and *policy stakes* (stimulus eligibility, political blame).  
    - *Interest-Relativity*: The NBER’s role (narrative dating) vs. the "two-quarter rule" (media/policy triggers) serves different purposes. The former tolerates vagueness; the latter demands binary clarity.  
  - **Higher-Order Vagueness**: The NBER’s criteria ("significant," "diffused") are themselves vague. Precisification doesn’t eliminate vagueness; it kicks it up a level.  

  **Paradox Bite**: Sorites *still works* if we fix a snapshot of data and context. But in practice, the moving parts (revised data, shifting purposes) prevent a clean chain from being traversed. The paradox exposes why no algorithm can capture all historical cases — but it doesn’t paralyze decision-making.

  ### II. What Recession-Dating Does to Theories of Vagueness
  **(A) Testing Accounts Against Practice**  
  | **Theory**               | **Fit with NBER Practice**                                  | **Challenges from Practice**                               |  
  |--------------------------|-------------------------------------------------------------|------------------------------------------------------------|  
  | **Epistemicism**          | ❌ Fails. If there were a fact, why delay decisions? Why revise after data updates? Committee deliberation implies indeterminacy. | Revisions (e.g., retroactive dating) make the "unknown fact" move over time — incoherent if boundaries are fixed. |  
  | **Supervaluationism**    | △ Partial. "Admissible precisifications" align with committee weighing criteria (depth/diffusion/duration trade-offs). | No "unique" set of precisifications: committee members dissent and decisions are contested. No "borderline cases" consensus (2022 was treated as non-recession definitively). |  
  | **Contextualism**        | ✅ Strong. Committee binds meaning to *context*: e.g., 2020’s brevity overruled by depth/diffusion *in the context* of a pandemic. | Doesn’t explain *authority*: why does NBER’s context override media/politicians’? |  
  | **Interest-Relative**    | ✅ Strongest. Trade-offs between criteria reflect *purpose*: e.g., avoiding premature calls to prevent panic, revising for historical accuracy. | Doesn’t resolve *who sets interests*: why a committee of economists vs. legislators? |  
  | **Degree Theory**        | △ Surface fit. People discuss "shallow recessions," but NBER’s output is *binary* (peak/trough dates). | Committee doesn’t report "degree of recession-ness." Binary decision masks continuous reality. |  
  | **Revising Conventionalism** | ✅ Best fit. Boundaries drawn by decision, but constrained by: <br> - *Data* (revisions force chronology updates)<br> - *Expert norms* (depth/diffusion/duration trade-offs)<br> - *Purpose* (narrative coherence over time). | Highlights *temporal fluidity*: the "boundary" isn’t drawn once but *renegotiated* as new data/purposes emerge. |

  **(B) Where Theories Are Silent**  
  1. **Authority & Legitimacy**: No theory addresses *who* should precisify. NBER’s legitimacy comes from institutional credibility, not philosophical grounds.  
  2. **Temporality**: Theories treat vagueness synchronically (fixed set of cases). But NBER decides *retrospectively* and *revises*, making vagueness resolution diachronic. A "recession" may exist in 2024 that didn’t in 2023 due to data revisions.  
  3. **Revision Under Uncertainty**: When new GDP data shifts 2021’s growth from +0.5% to -0.2%, the *past* boundary moves. Theories don’t model how precisifications evolve with evidence.  
  4. **Trade-off Acceptability**: Why is a short, deep downturn (2020) a "recession" but a prolonged shallow decline (2022) not? Interest-relative accounts describe this but don’t justify when trade-offs are socially acceptable.  

  ### III. Honest Ledger: What Explains, Misdescribes, and Reveals  
  - **Sorites Explains**:  
    Why no algorithmic rule (e.g., "two quarters") works universally — vagueness ensures borderline cases resist formal capture.  
    Why committee decisions feel "arbitrary" in borderline cases (e.g., 2022) — no fact forces one outcome.  
  - **Sorites Misdescribes**:  
    Treats "recession" as a natural-kind predicate with linear dimensions. In practice, it’s a *constructed* predicate for narrative/policy purposes, with multidimensional, substitutable criteria.  
    Ignores how data revisions and hindsight collapse what seemed like sorites sequences (e.g., marginal monthly changes later aggregated into sharp peaks/troughs).  
  - **Practice Reveals About Sorites**:  
    Vagueness is *managed* not resolved. Precisification is a *process* (deliberative, revisable, authority-based) — not a logical operation.  
    Real-world precisification is *purpose-driven*: NBER’s vagueness allows flexibility to serve historical accuracy, avoiding the paralysis the paradox threatens.  
    **The paradox’s power derives from stripping away context, interests, and time — but these are the tools economics uses to navigate vagueness.**

  ### Conclusion
  The sorites successfully shows "recession" has no context-free, sharp boundary. But recession-dating shows that *institutional, purpose-driven decision-making* can render vagueness tractable without committing to metaphysical or epistemic absolutes. The committee’s practice most embarrass epistemicism and supervaluationism, best fits revising conventionalism, and reveals a gap in all theories: precisification is temporal, social, and authoritative — not just semantic. The paradox explains the *problem*; economics shows a *pragmatic solution*.
