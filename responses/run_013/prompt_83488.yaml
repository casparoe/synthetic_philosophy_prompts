answer: |-
  ## Research Proposal: Contestation Moments as Boundary Legitimation in Democratic Theory  

  **Working Title:** *"Drawing the Demos: Legitimacy through Contestable Boundaries in Democratic Practice"*  

  ### I. Core Research Question  
  Can a boundary of a democratic demos be considered legitimate *if and only if* it is embedded within an institutional procedure that allows non-members meeting specific criteria to trigger, argue for inclusion, and receive a binding determination on their claim—where the procedure itself specifies non-circular grounds for challenge, accessible actors, feasible remedies, and a decisive endpoint?  

  ### II. Why Existing Principles Don’t Resolve This  
  The standard approaches—**All-Affected** ("all affected by a decision should have a say") and **All-Subjected** ("all governed by coercive rules should have a say")—fail to solve the boundary problem for structural reasons:  
  1. **Indeterminacy:** "Affected" is infinitely expansive (e.g., climate decisions affect future generations globally), while "subjected" often presumes pre-existing jurisdiction (begging the question). Neither defines *how* to operationalize inclusion.  
  2. **Circularity Trap:** Both principles require a prior authority to *apply* them (Who decides who is "affected" or "subjected"?). This authority cannot itself be democratically constituted without assuming a prior boundary.  
  3. **Static Framing:** They treat boundaries as fixed starting points, ignoring the dynamic reality of political conflict where claims emerge *against* existing exclusions.  
  4. **Lack of Mechanism:** Neither specifies *institutional pathways* for challenging exclusion. Legitimacy becomes abstract rather than procedural.  

  A third position, **Constitutive Nationalism/Prior Settlement** ("boundaries are fixed by history/culture"), avoids circularity but sacrifices democratic responsiveness, treating boundaries as exogenous facts rather than contestable choices.  

  ### III. Methodology: Normative Case Construction & Procedural Testing  
  As a conceptual project without empirical data, the method focuses on constructing hypothetical-but-realistic "contestation moments" and evaluating them against explicit criteria derived from the core question. Workplan:  

  - **Month 1: Framework Development & Criteria Specification**  
    - Define minimal elements of a "contestation moment":  
      - *Trigger:* Who can initiate a challenge? (Criteria: e.g., demonstrable stake + capacity to participate minimally)  
      - *Grounds:* Valid bases for claiming inclusion? (e.g., prima facie evidence of significant harm/benefit from decisions *or* direct subjection to rules)  
      - *Forum:* Which body adjudicates? (Must be independent of the contested demos’ control *at the moment of challenge*)  
      - *Remedy:* Binding outcomes? (e.g., inclusion in demos, compensation, exemption from rule)  
      - *Termination:* Finality mechanism? (e.g., time-bound process, single appeal, sunset clause on re-challenge).  
    - Establish evaluative criteria for legitimacy: **Non-Arbitrariness** (grounds tied to objective interests), **Accessibility** (feasible for claimants), **Decisiveness** (irreversible endpoint), **Non-Circularity** (forum not constituted *by* the demos under challenge).  

  - **Month 2: Case Construction & Initial Testing**  
    - Build 3 detailed hypothetical cases reflecting real-world boundary conflicts, structurally analogous to hydrological permit hearings:  
      1. *Municipal Annexation:* Residents of an unincorporated area challenge exclusion from a city council voting on zoning affecting their watershed.  
      2. *Trade Agreement:* Labor unions in a non-signatory state claim exclusion from ratification debates for a pact undermining their labor standards.  
      3. *Algorithmic Governance:* Users outside a "digital citizenship" platform demand a voice in rules governing data use that impacts their privacy.  
    - Apply the framework to each case: Does the *existing* institutional process meet the criteria? If not, design a modified procedure that does.  

  - **Month 3: Stress Testing & Refinement**  
    - Identify failure modes:  
      - *Infinite Regress:* Can the challenge mechanism itself be challenged? (Solution: Strict termination clauses + forum insulated from *immediate* recursivity).  
      - *Paralysis:* Do remedies undermine collective action? (Test: Remedies must balance inclusion with demos’ functional capacity).  
      - *Strategic Abuse:* Can bad-faith actors exploit triggers? (Mitigation: Grounds require evidence; remedies proportional).  
    - Refine framework by iterating cases (e.g., add "stateless people contesting climate policy exclusion").  

  - **Month 4: Synthesis & Limits**  
    - Articulate conditions under which contestation legitimizes boundaries *despite* initial exclusion.  
    - Define the theory’s scope: It addresses *ongoing* boundary legitimacy, not foundational origins (e.g., state formation).  
    - Confront self-reference: The *meta-rule* establishing the contestation procedure (e.g., a constitution) cannot itself be infinitely contestable—it must be presupposed as a "truce point" (historically contingent but fixed for operational purposes).  

  ### IV. Why This Approach?  
  This moves beyond surveying abstract principles by:  
  1. **Focusing on Practice:** It treats boundary-setting as an *ongoing process* of conflict resolution, not a one-time declaration.  
  2. **Solving Circularity Procedurally:** The *moment of challenge* breaks the circle by relying on a *temporally prior* (though fallible) institutional anchor.  
  3. **Leveraging Expertise:** Your hydrological experience informs the core insight—boundaries gain legitimacy through regulated conflict in concrete forums, not cartographic perfection.  

  ### V. Outcomes & Failure Conditions  
  - **Genuine Result:** A defensible framework specifying necessary/sufficient features of a boundary contestation procedure that resolves circularity while ensuring democratic responsiveness. Success = A philosopher can say: "Even if boundaries are initially imperfect, they gain legitimacy if challenged *this way*."  
  - **Failure/Dissolution:**  
    - **Conceptual Collapse:** If no termination mechanism avoids infinite regress OR remedies destroy demos functionality (project fails).  
    - **Housekeeping Trap:** If criteria devolve into endless semantic debates (e.g., "what counts as *significant* harm?") without advancing procedural clarity (dissolution).  
    - **Trivialization:** If the framework merely restates existing administrative law concepts without novel democratic insight.  

  ### VI. Realistic Scope  
  Output: A 6,000-word paper for the workshop, structured as:  
  1. Critique of All-Affected/All-Subjected  
  2. Contestation-first framework (criteria + rules)  
  3. Application to 3 cases  
  4. Responses to self-reference & practical objections.  
  *No comprehensive theory of democracy—only a tool for legitimizing boundaries within functioning systems.*  

  **Bottom Line:** Your analogy holds. Boundaries aren't drawn in a vacuum; they’re hardened in the fire of contested permits. This project doesn’t ask *who should decide*, but *how challenges to "who decides" can be fairly settled*. It’s coherent, narrow, and doable—a permit hearing for democracy itself.
