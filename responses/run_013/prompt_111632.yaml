prompt: |-
  For years I have been the resident skeptic among my friends, and over the last twelve months I have been writing down the judgments I actually make when conspiracy talk comes up, because I have started to suspect that they do not all issue from the same source. I would like you to work out what principle, if any, they express, and to tell me where I have to give one of them up.

  Here is the list. (1) A nurse I know believes that her hospital's administrators quietly reclassify deaths so that the published mortality figures stay low; she has seen two internal spreadsheets that do not match the public dashboard, and a memo telling staff not to discuss the discrepancy. I take her belief to be well grounded. (2) A man I met at a party believes the same thing about the same hospital, on the ground that administrators always hide something. I take his belief to be ungrounded, even though the claim is identical and may be true. (3) A friend who reads engineering reports believes that the official account of a local bridge collapse is wrong — he says the reported sequence of failures does not fit the photographs or the inspection timeline — and he declines to say what did happen. I think that is a defensible position. (4) The same friend then tells me the collapse was a demolition arranged by a contractor facing penalties. On the evidence he has described, I do not think he is entitled to that. (5) An acquaintance believes a conspiracy theory, and when I show him documents that contradict it he says the documents are part of the cover-up; I think he is being unreasonable. (6) A different man held a conspiracy theory with exactly that unshakable confidence, and the theory turned out to be true when an archive was opened ten years later. I still want to say he was unreasonable throughout, and I am not sure I am permitted to. (7) A woman believes that her own union is burying an internal scandal; she could ask three officers who would know, and she has not, because she assumes they would lie. I think she is being unreasonable. (8) A colleague believes that two or three people quietly agreed to bury a mistake at work. I find that entirely credible and think no worse of him for it. (9) A relative believes that a cabal spanning several governments has sustained a deception for fifty years. I find that much harder to credit, though I cannot tell whether I am simply applying base rates to the number of people who would have to keep quiet. (10) A bereaved father believes a conspiracy about his son's death; I think he is mistaken, but the belief seems to be doing necessary work for him, and I cannot bring myself to call him irrational. (11) And the one I keep returning to: a man is very confident that the official story is false, offers no positive alternative, and insists he is under no obligation to supply one.

  I can see at least three patterns here and they pull apart. One is about evidence and formation — how the person came to the belief, and whether contrary evidence would move them. That pattern makes (1) good and (2) bad, keeps (6) bad, and is what is doing the work in (5). A second is about the content of the belief — its scale, whether it is self-sealing, whether it posits a mechanism that would explain the very absence of evidence against it. That pattern is what makes (4) and (9) bad and (3) and (8) acceptable. A third is about the believer rather than the belief — whether they are being negligent, or evasive, or simply damaged — and that is what seems to drive (7) and (10). Please tell me whether a single principle can be stated that yields all eleven verdicts, or whether I must choose; if I must choose, say which verdict each candidate principle forces me to abandon and why that is the cheapest one to lose. State the principle, or the small set of candidates, precisely enough that I can see what each clause is for and which case motivates it; give me their verdicts on cases I have not listed — including a person who believes a conspiracy theory solely on the word of a friend who says she was in the room, and a person who believes it because every rival explanation he has heard has been debunked; and tell me honestly which of my judgments the best principle cannot accommodate.
reasoning: |-
  Okay, the user is a self-described skeptic who's been documenting their judgments on conspiracy-related beliefs among peers. They've listed 11 specific cases and identified three patterns in their own reasoning: evidence-based formation, content characteristics, and believer context. They're asking for a unified principle that explains all their judgments or, if impossible, guidance on which verdicts to sacrifice.

  Hmm... this is a sophisticated epistemological puzzle. The user clearly has strong analytical skills - they've already deconstructed their own thought patterns into evidence, content, and believer-centric dimensions. Their core tension seems to be between wanting consistent principles while recognizing that real-world judgments involve nuance.

  Looking at their cases... The nurse (1) vs party guy (2) distinction shows they value evidence quality over mere claim truth. The bridge collapse cases (3-4) reveal a threshold between skepticism and positive claims. Case (6) about the accidentally correct conspiracy theorist is particularly thorny - it pits justifiability against truth in a way that challenges most epistemological frameworks. 

  The emotional cases (7,10) suggest they make allowances for psychological factors, while still maintaining epistemic standards. And that recurring case (11) about rejecting official stories without alternatives... that seems to embody their fundamental struggle with negative skepticism.

  I notice they're wrestling with at least four philosophical tensions: justification vs truth (Popper), extraordinary claim standards (Hume/Sagan), epistemic responsibility (Clifford), and psychological factors (James). No single principle can perfectly resolve these - the best we can do is layered criteria.

  For their additional cases... The "friend in the room" scenario tests firsthand testimony value. The "debunked alternatives" case examines falsification vs verification. Their existing patterns actually handle these well: the first would likely be accepted (if trusted friend), the second rejected (unless they've genuinely eliminated all plausible alternatives).

  The real friction points are cases (6) and (10). Holding that the accidentally correct conspiracy theorist was still unreasonable requires prioritizing justification over truth - a tough but defensible stance. The bereaved father case shows their compassionate side conflicting with strict rationality - here I'd argue that calling the belief "non-rational" rather than "irrational" preserves both empathy and standards.

  Ultimately they'll need to accept that (6) and possibly (10) are the "cheapest" to lose if demanding absolute consistency, but the layered approach preserves most judgments. The key is recognizing that epistemology must serve human contexts - sometimes the principle bends so the person doesn't break.
answer: |-
  Your judgments reveal a sophisticated, multi-dimensional epistemology of belief evaluation. While a *single* principle cannot capture all eleven cases without sacrificing some intuitions, a **layered principle with three core components** comes remarkably close. Here's the unified framework distilled from your patterns, followed by its verdicts, limitations, and forced trade-offs:

  ### The Unified Principle
  **A belief in a conspiracy is reasonable iff:**  
  (A) **The believer has engaged in *non-negligent evidence-responsive inquiry*** (addressing formation/evidence),  
  *AND*  
  (B) **The conspiracy’s *scale, mechanism, and evidentiary profile* are compatible with known human/institutional behavior** (addressing content),  
  *AND*  
  (C) **The believer’s *epistemic conduct* avoids dogmatism, evasion, or special pleading** (addressing the believer).  

  **Exceptions:**  
  - (C) may be waived if the belief serves a *non-epistemic vital function* (e.g., psychological survival) without harming others.  
  - (B) may be relaxed for *local/limited* conspiracies absent red flags in (A) or (C).

  ---

  ### Application to Your Cases
  | Case | Principle Verdict | Your Judgment | Alignment |
  |------|-------------------|---------------|-----------|
  | (1) Nurse | **Reasonable** (A: evidence-based; B: plausible scale; C: responsive) | Reasonable | ✓ |
  | (2) Party Man | **Unreasonable** (A: no evidence/responsiveness; B/C irrelevant) | Ungrounded | ✓ |
  | (3) Bridge Skeptic | **Reasonable** (A: expertise; B: no positive claim; C: non-dogmatic) | Defensible | ✓ |
  | (4) Bridge Conspiracy | **Unreasonable** (B: unsupported mechanism; A/C insufficient) | Not entitled | ✓ |
  | (5) Unfalsifiable Theorist | **Unreasonable** (C: dogmatic/seals evidence; A fails) | Unreasonable | ✓ |
  | (6) Accidental Truther | **Unreasonable** (A/C: unresponsive/dogmatic *at time of belief*) | Unreasonable | ✓ |
  | (7) Union Skeptic | **Unreasonable** (A: negligent inquiry; C: assumes bad faith) | Unreasonable | ✓ |
  | (8) Work Mistake | **Reasonable** (B: small scale/plausible; A/C: contextually ok) | Credible | ✓ |
  | (9) Global Cabal | **Unreasonable** (B: implausible scale/mechanics; A/C insufficient) | Hard to credit | ✓ |
  | (10) Bereaved Father | **Non-rational** (C: vital function exception; fails A/B) | Not irrational | ✓ (via exception) |
  | (11) No Alternative | **Unreasonable** (A: insufficient without counter-explanation; C: evasive) | Unreasonable | ✓ |

  ---

  ### Verdicts on New Cases
  1. **"Friend in the room" testimony:**  
     - *Verdict:* **Reasonable** (if friend is trusted and contextually credible).  
     - *Why:* Satisfies (A) via reliable testimony, (B) if scale is plausible (e.g., hospital cover-up, not alien invasion), and (C) if not dogmatic.

  2. **"Debunked alternatives" believer:**  
     - *Verdict:* **Unreasonable** (unless *all* plausible alternatives are eliminated).  
     - *Why:* Fails (A) if "debunking" is selective; fails (B) if conspiracy mechanism is improbable; fails (C) if immune to counter-evidence. *Eliminating rivals isn’t proof—it must be paired with positive evidence for the conspiracy.*

  ---

  ### Where the Principle *Cannot* Fully Accommodate You
  1. **Case (6) – The Accidental Truther:**  
     - The principle *demands* we call this belief unreasonable *at the time it was held* (due to failures in A/C). You feel uneasy because it turned out true.  
     - **Cost of holding this:** You must accept that **truth and justification can come apart**. A belief can be true but unreasonably held (e.g., guessing right on a math test without working). This is a core tenet of epistemology—but it feels unsatisfying here.

  2. **Case (10) – Bereaved Father:**  
     - The principle labels this "non-rational" (via exception). You avoid calling him "irrational," but the principle *still* denies his belief is *reasonable* or *justified*. If you insist on calling it "rational," you violate (A) and (B).  
     - **Cost:** Accepting that **emotional necessity ≠ epistemic rationality**.

  ---

  ### The Trade-Off: What You Must Sacrifice
  If you demand *one* principle without exceptions, you must **abandon verdict (10)**. The bereaved father’s belief fails (A) and (B); calling it "rational" prioritizes compassion over epistemic rigor. This is the "cheapest" loss:  
  - It’s your *only* case where psychological need overrides truth-tracking.  
  - Sacrificing (6) would force you to concede that dogmatic beliefs can be reasonable if accidentally true—undermining your rejection of (2)/(5).  
  - Sacrificing (9) would collapse your distinction between local and global conspiracies.

  ---

  ### Why This Works
  - **Component (A)** handles (1),(2),(5),(6),(7): It demands *evidence-responsive justification*.  
  - **Component (B)** handles (3),(4),(8),(9),(11): It filters claims by *plausibility of execution*.  
  - **Component (C)** handles (5),(6),(7),(11): It rejects *self-insulating* or *evasive* belief-holding.  
  - **Exceptions** salvage (10) without breaking the system.

  Your skepticism is admirably consistent. The friction in (6) and (10) isn’t a flaw—it reflects the real tension between truth, justification, and human needs. A principled epistemology acknowledges this; a dogmatic one denies it.
