prompt: |-
  ok so my friend and i got into a big thing last night about inheritance tax and i've been chewing on it since, and there's one piece of it i can't get past. in the US you've got an estate tax but it only bites above a pretty large exemption, so most estates pay nothing at all. and then here's the part that really gets me: when you inherit appreciated stuff, a house, stock, whatever, the tax 'basis' you get is reset to what the thing was worth on the day the person died. so all the gain that piled up over their entire life just never gets taxed. ever. you could sell it the next morning and owe nothing on the decades of growth. as i understand it the estate tax and the capital gains tax were sort of designed as alternatives to each other, the idea being a big estate shouldn't get taxed twice, once on the death transfer and again on the lifetime gain. but if you're under the exemption you get the step-up anyway and pay neither. i have a vague memory congress tried replacing the step-up with something else once and then chickened out, don't quote me on that.

  my friend says it's just a loophole and dead people shouldn't get tax breaks. fine, maybe. but i think it quietly tells us what we actually believe, and i want you to spell that out.

  so: what does this arrangement presuppose about equal opportunity, and about the family? does it assume that what's unfair is the transfer at death specifically, rather than unequal starting points as such, so that skimming a slice off the very top is enough? or does it assume families are entitled to pass things on and the tax is just a toll? reconstruct the view the practice only really makes sense under. then i want the honest separation: which parts does the practice strictly require, and which parts could be licensed by several different theories, so that the setup is actually underdetermined and we can't read one doctrine off it. check whether the pieces are even consistent with each other, since we tax wages every year but let capital gains ride untaxed until death and then forgive them.

  last thing: if you swap the implicit view for one where nobody deserves their starting place, what concretely would have to change about the practice, not just the rate. no reading list or citations please, i can't look anything up, just argue it out from the mechanism above.
