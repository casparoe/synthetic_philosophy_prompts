  The user mentions their friend calling it a "loophole," but I suspect they're more troubled by the cognitive dissonance than the policy itself. They note we tax wages annually but forgive lifetime capital gains at death - that inconsistency clearly bothers them on a philosophical level. 

  When they ask about swapping the implicit view, they're essentially requesting a Gedankenexperiment: If we truly believed no one deserves their starting point, what would this system look like? That's the most valuable part to address - not just critiquing the status quo but projecting alternatives.

  Their rejection of citations is telling. They don't want academic theory; they want logic derived from the mechanism itself. This suggests either 1) they're in a field where theoretical arguments feel disconnected from reality, or 2) they've already done some reading and found it unsatisfying. Probably both.

  The emotional tone comes through strongly - "chewing on it since," "big thing," "gets me." There's frustration here, but it's the good kind that fuels real inquiry. They're not ranting; they're systematically dissecting their own confusion. That deserves careful engagement.

