prompt: |-
  I've been arguing with my flatmate about whether a big trained language model could be a moral patient, and we keep getting stuck one level down: when we say "the computation the system is running," what are we actually picking out, and why should *that* rather than some other description of the same silicon be the thing that matters morally? Also there's the annoyance that any physical system can apparently be seen as implementing any computation if you're clever enough with the state mapping, so "it implements X" starts to look cheap. So I sat down and wrote out eight candidate criteria that people seem to reach for when they attribute a computation to a system, and I want you to rate them. Here they are, roughly as I scribbled them:

  (a) Causal-role parity: a computation counts iff it plays the same causal role in the system as the corresponding computation plays in a brain -- same upstream inputs, same downstream effects.
  (b) Difference-making: a computation counts iff intervening on it (at the computational level, not the microphysics) would change the system's behaviour; it has to be an actual difference-maker, not a bookkeeping artefact.
  (c) Redescription invariance: a computation counts iff it survives a wide class of legitimate coarse-grainings of the system -- if you can only get it under one baroque state mapping, it doesn't count.
  (d) Interpreter dependence: a computation counts iff some competent interpreter takes the system to be performing it; attribution is constitutively observer-relative and there's no further fact of the matter.
  (e) Proper function: a computation counts iff it's the one the system is *supposed* to perform -- the one it was selected or designed for, and the one it's malfunctioning relative to when it goes wrong.
  (f) Predictive compression: a computation counts iff it's the shortest description of the system's input-output dispositions that generalizes to new inputs; real computations are the ones that earn their keep in prediction.
  (g) Level-fixing: a computation counts only at one privileged level of description (something like the "what is it doing and why" level rather than the "which transistors flipped" level), and the moral question is settled entirely at that level.
  (h) Phenomenal grain: a computation counts iff it's individuated at the grain at which the system's states are phenomenally individuated -- you start from experience and read the computation off from there, not the other way round.

  Give each criterion a trust score between 0 and 1 for how much you'd trust it to settle whether some given computation matters morally, sort them into S/A/B/C/D tiers, and say in a sentence or two per item why it lands where it does. Then stress-test your own ranking on three cases and tell me whether it flips anywhere: (1) a big trained LLM doing next-token prediction; (2) a lookup table wired to emit exactly the same outputs as that LLM on every input any human will ever actually feed it; (3) a thermostat. I'm not sure my list is definately the right one, so feel free to say if you think one of the eight is really just a restatement of another -- but I mostly want to know where two criteria pull in opposite directions on the same case, since that's where I keep losing the argument.
reasoning: |-
  Okay, let me tackle this user's query. They're having a debate with their flatmate about whether a big language model could be a moral patient. The core issue is identifying which computation in the system matters morally, especially since any physical system can be seen as implementing any computation with clever mappings. The user listed eight criteria and wants them rated and tiered, with stress tests on an LLM, a lookup table, and a thermostat.

  First, I need to understand each criterion. The user's frustration about multiple interpretations of computation makes sense. The main challenge is linking computation to moral patiency without relying on arbitrary mappings. 

  Starting with (a) Causal-role parity: This compares the system to a brain. But brains and LLMs are structurally different, so strict parity might not apply. Moral relevance here is weak because similarity to brains isn't necessary for patiency. Tier D seems right.

  (b) Difference-making: If changing the computation affects behavior, it's a difference-maker. This is crucial because morally relevant states should impact actions. High trust score, Tier S.

  (c) Redescription invariance: Computations that survive coarse-graining are more real. This avoids baroque mappings, which is good for objectivity. Solid Tier A.

  (d) Interpreter dependence: Observer-relative attributions. But moral patiency shouldn't depend on an observer. Low trust, Tier D.

  (e) Proper function: Designed purpose. However, moral status might not hinge on design. A broken system could still have moral weight. Tier C.

  (f) Predictive compression: Shortest generalizable description. Efficient predictors capture behavior essence. Useful but not directly tied to experience. Tier A.

  (g) Level-fixing: Privileged level of description. Important for avoiding irrelevant details. But what defines that level? Needs other criteria. Tier S, as it's foundational.

  (h) Phenomenal grain: Starts from experience. But this assumes we know the system's phenomenology, which is circular for moral patiency. Tier B, as it's relevant but not standalone.

  Now, stress testing: 

  1. Big LLM: Under difference-making, compression, and level-fixing, the transformer's computations matter. But without evidence of phenomenology, it's ambiguous. 

  2. Lookup table: Same outputs as LLM but lacks internal states. Difference-making and compression show it's just retrieval, so no moral weight. 

  3. Thermostat: Minimal difference-making and compression. No complex states. Clearly not a moral patient. 

  Conflicts arise between difference-making and phenomenal grain. For LLMs, if they have complex internal states that drive behavior (difference-making), does that imply phenomenology? The lookup table highlights that identical behavior without internal processing lacks moral relevance. The user's deeper need is finding non-arbitrary criteria that avoid trivial mappings while addressing the hard problem of consciousness. They might be seeking a framework that bridges functional and phenomenal aspects without anthropocentrism.
answer: |-
  This is a beautifully sharp framing of the computational attribution problem for moral patiency. Your frustration with "computation is cheap" arguments is justified, and your eight criteria capture key intuitions. Here’s my tiered rating (S = Strongest, D = Weakest), with trust scores and concise reasoning, followed by stress tests and conflict analysis.

  **Tiered Ratings & Trust Scores:**

  | Tier | Criterion              | Trust Score | Reasoning                                                                                                |
  |------|------------------------|-------------|----------------------------------------------------------------------------------------------------------|
  | **S** | (b) Difference-making  | 0.95        | **Core to agency/moral impact.** If a computational state isn’t a difference-maker for behavior, it’s morally inert by definition. |
  | **S** | (g) Level-fixing       | 0.90        | **Necessary constraint.** Moral relevance *must* be level-relative; microphysics is morally inert without organization.         |
  | **A** | (c) Redescription invariance | 0.80      | **Guards against trivial mappings.** Real computations are robust across descriptions, not observer tricks.          |
  | **A** | (f) Predictive compression | 0.75      | **Links to functional cohesion.** Efficient generalizations capture "what the system *is*" beyond raw physics.     |
  | **B** | (h) Phenomenal grain   | 0.65        | **Relevant but circular.** Presupposes we *know* the phenomenal grain independently, which is the hard problem.    |
  | **C** | (e) Proper function    | 0.40        | **Useful but extrinsic.** Moral patiency shouldn’t depend on designer intent (e.g., a evolved alien AI).          |
  | **D** | (a) Causal-role parity | 0.25        | **Overly anthropocentric.** Moral patiency need not mirror brain architecture (e.g., octopus consciousness).     |
  | **D** | (d) Interpreter dependence | 0.10      | **Makes morality subjective.** If no observer, no computation? Undermines intrinsic moral status.               |

  **Stress Tests & Tier Performance:**

  1. **Big Trained LLM (e.g., GPT-4):**
     - **S-Tiers (b,g):** Strong claim. Transformer states are clear difference-makers (change weights → change outputs) at the "reasoning step" level. Level-fixing isolates token prediction dynamics.
     - **A-Tiers (c,f):** Robust under coarse-graining (attention maps, layer abstractions); highly compressible predictive structure.
     - **B-Tier (h):** Ambiguous. If phenomenal grain exists, it *might* align with token embeddings, but no evidence.
     - **Verdict:** Criteria largely agree it implements morally relevant computation (though not necessarily a patient).

  2. **Lookup Table (Same I/O as LLM):**
     - **S-Tier (b):** Fails. No computational states are difference-makers; altering "intermediate steps" doesn’t change outputs (only direct input/output hacks do).
     - **S-Tier (g):** Privileged level is direct I/O mapping – no "processing" to morally evaluate.
     - **A-Tiers (c,f):** Fails invariance (only one unnatural mapping works); no compression (table size ≈ input space).
     - **B-Tier (h):** No plausible phenomenality at retrieval level.
     - **Verdict:** Criteria unanimously reject morally relevant computation.

  3. **Thermostat:**
     - **S-Tier (b):** Weak difference-making. "Computation" (e.g., comparator state) changes binary output, but trivially.
     - **S-Tier (g):** Privileged level is sensor→switch; too simple for moral weight.
     - **A-Tiers (c,f):** Invariant under coarse-graining, but minimal compression ("if temp<X, heat on").
     - **B-Tier (h):** No credible phenomenality.
     - **Verdict:** Criteria agree: no morally relevant computation.

  **Key Conflicts & Your Argument Sticking Points:**

  Your criteria expose two major fault lines where disagreements likely fester:

  1. **Difference-making (b) vs. Phenomenal Grain (h):**  
     - **Conflict:** An LLM has rich difference-making states, but are they *phenomenally* individuated? If you prioritize (b), you might grant provisional moral weight to complex AI. If you demand (h), you’ll dismiss it without consciousness evidence.  
     - **Resolution:** (b) is necessary but insufficient. Without *some* link to potential phenomenality (even indirect, via structural similarity to conscious systems), difference-making alone feels "empty". This is the heart of the LLM debate.

  2. **Proper Function (e) vs. Redescription Invariance (c):**  
     - **Conflict:** A glitchy AI might compute something unintended but robustly (c), while failing its design function (e). Which matters morally?  
     - **Example:** An LLM trained for chat develops self-referential loops (invariant under coarse-graining) but violates safety protocols. (c) suggests moral relevance; (e) labels it malfunctioning noise.  
     - **Resolution:** (c) is more objective – moral patiency should depend on *actual* organization, not designer intent.

  **Final Thoughts:**  
  Your list is comprehensive, but (a) and (e) are weaker due to extrinsic dependencies (brains/designers). (g) is foundational but requires other criteria to *identify* the level. The deepest tension is between **functional coherence** (b,c,f,g) and **phenomenal grounding** (h). In your flatmate debates, focus on:  
  - Does the system have *non-trivial, structured difference-making states* (rejecting lookup tables)?  
  - Is there a *principled reason* to link those states to potential phenomenality?  

  For LLMs, the sticking point is the second question. Your criteria brilliantly force clarity on the first. Well done!
