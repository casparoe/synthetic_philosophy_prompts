  #### Part (iii): Does IPP resolve Bertrand's paradox? (3 points)
  - **Resolution Claim**: The student correctly asserts that IPP resolves the paradox by requiring invariance under O(2), which selects the midpoint method uniquely (P(E) = 1/4).  
  - **Sufficiency of Euclidean Symmetries**: The student rightly states that invariance under rotations alone is insufficient; full O(2) (including reflections) is needed. The radial method is invariant under rotations but not reflections, justifying its exclusion.  
