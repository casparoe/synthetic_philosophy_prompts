prompt: |-
  Six months ago I became chair of the grants committee of a small family foundation — my aunt's bequest, about four million pounds in assets, something in the region of a hundred and fifty thousand a year in grants of five to twenty thousand pounds each — and I have discovered that I have no idea how to decide what to do with it. I spent thirty years as an actuary, so I am at ease with expected values, which turns out to be precisely the problem. At our last meeting we gave ninety minutes to a proposal from a four-person outfit that put its own chances of averting a catastrophic pandemic at one in two hundred thousand; multiplied through by a hundred million lives, that number had quietly swallowed every other item on the agenda, including a literacy programme we have funded since before I joined the committee. Two of my trustees found this exhilarating, one found it preposterous, and I found that I could not give a principled reason for siding with any of them. Since then I have read enough about the philosophical problem of fanaticism in expected-value reasoning to see the shape of it, but everything I have found either defends the arithmetic or reaches for a technical fix — a cap on the value of a life, a discount on small probabilities, a shift to imprecise probabilities — and none of it tells me what four trustees in a two-hour meeting are meant to do on a Tuesday afternoon. I should add that I took early retirement at fifty-eight and this is the first thing I have done since that feels as though it matters, so I am keen not to make a fool of myself or of my aunt.

  What I want from you is a procedure we can actually run: a numbered sequence of questions, in the order we should ask them, with a note at each step about what would count as a sufficient answer, who among us is competent to give it, and what we should do when the answer is not forthcoming. I have a half-formed taxonomy that I would like you to test, repair or replace. It seems to me that a proposal can inflate its expected value in three quite different ways — through the number of beneficiaries, through the magnitude of the benefit to each of them, and through attaching a non-zero probability to a payoff that is unbounded or infinite — and that the third is not simply the first two pushed harder, because it makes the arithmetic degenerate rather than merely large; if that is right, the procedure should treat the unbounded case as a stopping point rather than as one more term in a sum. The device I keep groping towards for the other two is what I would call a switching probability: instead of arguing about whether one in two hundred thousand is too optimistic, ask the proposer to name the probability at which their project would fall below the best conventional alternative on our list, and then ask how far that threshold lies below the bottom of the range of probabilities they themselves would defend. If the threshold sits inside that range, the decision is hostage to an estimate nobody in the room can make; if it sits well below the range, the project survives on the proposer's own uncertainties. Tell me whether that test is sound, what it misses, and how to run it when the two options are not commensurable in the same units.

  Then run the procedure on three cases and show me the working: the pandemic outfit above; the literacy programme; and a third in which an applicant argues that because the long-run future may contain an enormous or unbounded number of lives, any action with any non-zero chance of influencing it has an expected value that cannot sensibly be compared with anything else — I want to see exactly where the procedure stops and says no, and where it hands the decision back to us because the question is one of values rather than of fact. Our constraints are these: four trustees, consensus rather than majority, a quarterly meeting of two hours, no one with a mathematical background but me, a duty to publish a short rationale to the wider family (some of whom think the whole enterprise is a scam), and a solicitor who has warned us that the charity's purposes must be defensible as being for the public benefit — I am not confident that people who do not yet exist can count, and I would rather the procedure flagged where that bites than settled it for me. Be explicit about the places where the procedure is doing nothing except forcing a value judgement into the open, and about what it cannot do at all; I would sooner have an honest list of failure modes than a promise of rigour. I suspect it will come out against the local programmes I am fond of, and I would rather know that now than at the next meeting. Three pages at most, in British English, and no reading list or citations — if you need to mention a position, do it in passing and I will look it up myself.
reasoning: |-
  Hmm, the user is chairing a small family foundation's grants committee and struggling with how to evaluate proposals using expected value calculations. They've encountered a problem where a pandemic prevention proposal with extremely low probability but enormous potential impact dominated their entire budget allocation. 

  The user is a former actuary who understands expected value math well but finds it leads to absurd conclusions in practice. They've identified three ways expected value can be inflated: number of beneficiaries, magnitude of benefit per beneficiary, and attaching non-zero probability to unbounded/infinite payoffs. They're particularly concerned about the third case making the math "degenerate."

  They've proposed a "switching probability" test: instead of debating whether a 1/200,000 probability is accurate, ask the proposer at what probability threshold their project becomes worse than conventional alternatives, and compare that to the range of defensible probabilities. If the threshold falls within the uncertainty range, the decision depends on unverifiable estimates.

  The user wants a practical decision procedure they can implement in quarterly 2-hour meetings with four trustees (none mathematically trained except them), requiring consensus. The procedure must be able to handle three test cases: the pandemic prevention proposal, their ongoing literacy program, and a longtermist proposal claiming infinite expected value due to influencing the far future.

  Key constraints include: must produce defensible public benefit rationale, can't assume future people count as beneficiaries (legal concern), must flag value judgments explicitly, and should be honest about limitations rather than pretending to be rigorous. They're prepared for the procedure to potentially recommend against their favored local programs.

  The challenge is creating a step-by-step process that: 1) prevents fanaticism problems without arbitrary caps, 2) forces value disagreements into the open, 3) works with non-experts in limited time, and 4) legally protects the foundation. The "switching probability" idea is clever but needs refinement for cases where benefits aren't commensurable.

  For the test cases: 
  - The pandemic proposal should likely be rejected because its switching probability threshold falls within the proposer's own uncertainty range, making it hinge on unverifiable estimates. 
  - The literacy program should pass as it has proven impact within defensible probability ranges. 
  - The longtermist proposal should be rejected at the stage where it claims unbounded value, since the foundation isn't equipped to evaluate such claims and they may not satisfy "public benefit" for existing people.

  The procedure should have clear stopping points where it says "this requires value judgments beyond the procedure" - particularly when comparing different types of goods (lives vs literacy) or when dealing with speculative far-future impacts.
answer: |-
  ### Practical Decision Procedure for Grant Committee Trustees  
  *(Designed for 4 non-specialist trustees, 2-hour quarterly meetings, consensus decisions)*  

  **Core Principles:**  
  1.  **Separate Facts from Values:** Distinguish verifiable claims from value judgments.  
  2.  **Avoid Degenerate Arithmetic:** Flag unbounded/infinite payoffs early.  
  3.  **Focus on Robustness:** Test sensitivity to uncertainty.  
  4.  **Force Explicit Trade-offs:** Make value conflicts visible.  

  ---

  ### The Procedure: 6 Questions in Order  

  #### **Question 1: Does this proposal claim unbounded/infinite impact?**  
  *   *What to check:* Does the applicant argue their work affects infinitely valuable outcomes (e.g., "saving all future civilisation") or mathematically unbounded impacts (e.g., "trillions of future lives")?  
  *   *Sufficient answer:* "Yes" if they use these terms; "No" otherwise.  
  *   *Competence:* Any trustee (plain language assessment).  
  *   *If "Yes":* **Stop. Reject.** Reason: *Unbounded claims make expected value degenerate (dominating all finite alternatives) and cannot be robustly evaluated within our constraints. Our duty to "public benefit" requires focus on tangible, definable beneficiaries.*  
  *   *If "No":* Proceed to Q2.  

  #### **Question 2: What is the *plausible worst-case* impact?**  
  *   *What to ask applicant:* "If your project underperforms expectations but still has *some* positive effect, what is the smallest credible benefit you’d defend?"  
  *   *Sufficient answer:* A concrete outcome (e.g., "trains 50 teachers" or "reaches 500 at-risk people").  
  *   *Competence:* Trustees assess clarity/reasonableness (no expertise needed).  
  *   *If no answer:* **Stop. Reject.** Reason: *Inability to define minimal impact suggests unsound theory of change.*  
  *   *If answered:* Proceed to Q3, using this as the "benefit floor."  

  #### **Question 3: Apply the Switching Probability Test**  
  *   *Step A:* Identify the strongest **conventional alternative** (e.g., the literacy programme costing £15k/year). Calculate its expected value:  
      *   Benefit: (e.g., "120 adults gain functional literacy/year")  
      *   Probability: (e.g., 90% based on past results)  
      *   **EV_alt = Benefit × Probability**  
  *   *Step B:* Ask applicant: "At what success probability (*P_switch*) would your project’s *worst-case impact* (from Q2) equal the expected value of [alternative]?"  
      *   *Equation: P_switch = EV_alt / (Your claimed worst-case benefit)*  
  *   *Step C:* Ask applicant: "What is the *lowest* defensible success probability (*P_min*) for your project?"  
  *   *Sufficient answer:* Numerical *P_switch* and *P_min* (e.g., *P_switch* = 0.01, *P_min* = 0.001).  
  *   *Competence:* Chair (you) calculates *P_switch*; applicant provides *P_min*. Trustees assess reasonableness.  
  *   *Decision rule:*  
      - **If *P_switch* < *P_min*: Proceed to Q4.** (Project robustly beats alternative)  
      - **If *P_switch* ≥ *P_min*: Stop. Reject.** Reason: *Project only beats alternatives if success probability exceeds your own defensible minimum. Decision hinges on unverifiable optimism.*  

  #### **Question 4: Can we verify core assumptions?**  
  *   *What to check:* Are key claims (e.g., disease transmission rates, scalability) grounded in:  
      - Peer-reviewed science?  
      - Replicated field data?  
      - Independent evaluation?  
  *   *Sufficient answer:* "Yes" if ≥1 applies; "No" if entirely speculative.  
  *   *Competence:* Trustees (assess evidence provided).  
  *   *If "No":* **Stop. Reject.** Reason: *Insufficient evidence for due diligence.*  
  *   *If "Yes":* Proceed to Q5.  

  #### **Question 5: Does this align with foundation values?**  
  *   *What to discuss:* "Does funding this *instead of* [alternative] reflect what our foundation stands for?" Consider:  
      - Geographic focus (local vs. global)  
      - Time horizon (immediate vs. long-term)  
      - Risk appetite (certain vs. speculative gains)  
  *   *Sufficient answer:* Consensus via discussion (no technical input).  
  *   *Competence:* All trustees (pure value judgment).  
  *   *If no consensus:* **Reject.** Reason: *Lack of alignment with collective purpose.*  
  *   *If consensus "Yes":* Proceed to Q6.  

  #### **Question 6: Can we explain this to the family?**  
  *   *What to draft:* A 3-sentence rationale:  
      1. What problem we’re solving.  
      2. Why this project is credible (cite Q4).  
      3. Why we chose it over a proven alternative (cite Q3/Q5).  
  *   *Sufficient answer:* All trustees agree the rationale is defensible.  
  *   *Competence:* All trustees.  
  *   *If no agreement:* **Reject.** Reason: *Cannot justify to stakeholders.*  
  *   *If agreed:* **Approve.**  

  ---

  ### Test Cases  

  **Case 1: Pandemic Prevention Outfit**  
  - Q1: **No** (claims finite lives saved).  
  - Q2: Worst-case impact = "Delay outbreak by 1 month" (applicant’s estimate).  
  - Q3:  
    - Alternative: Literacy programme (EV_alt = 120 adults literate × 0.9 = 108).  
    - *P_switch* = EV_alt / Worst-case = 108 / (delay saving ~10,000 lives?) → **Chair’s note:** *Applicant must convert "1-month delay" to lives saved. If they claim 10,000 lives, P_switch = 108 / 10,000 = 0.0108 (1.08%).*  
    - *P_min* = Applicant’s lowest defensible probability (e.g., 0.0001 for 1/10,000).  
    - **Decision:** *P_switch* (1.08%) > *P_min* (0.01%) → **Reject at Q3.** *Rationale: Success probability needed to beat literacy programme (1.08%) is 100× higher than your defensible minimum (0.01%). We cannot rely on such optimism.*  

  **Case 2: Literacy Programme**  
  - Q1: **No.**  
  - Q2: Worst-case impact = "80 adults gain literacy" (based on lowest past result).  
  - Q3:  
    - Alternative: Hypothetical pandemic project (use Q1-3 result: already rejected).  
    - **Chair’s note:** *No dominant alternative exists. Compare to next best option (e.g., local healthcare). If P_switch for healthcare < literacy’s P_min, literacy wins.*  
  - Q4: **Yes** (verified impact via 10-year track record).  
  - Q5: **Yes** (aligns with history/values).  
  - Q6: **Approve.** *Rationale: Proven local impact, consistent with our legacy.*  

  **Case 3: Longtermist Applicant ("Infinite Value")**  
  - Q1: **Yes** → **Reject at Q1.** *Rationale: Claims of infinite future value cannot be evaluated robustly or defended as "public benefit" for existing people under charity law.*  

  ---

  ### What the Procedure Does and Doesn’t Do  
  - **Forces Value Judgments Open:** Q5 (foundation values) and Q6 (family rationale) are explicit about trade-offs.  
  - **Flags Uncertainty:** Q3 isolates decisions relying on unverifiable probabilities.  
  - **Fails When:**  
    - Alternatives are incommensurable (e.g., art vs. medicine). *Solution: Q5 becomes subjective debate.*  
    - All options have high uncertainty. *Solution: Prioritise Q4 (evidence).*  
  - **Likely Outcome:** Favours evidence-based, locally verifiable projects. High-risk/high-reward proposals rarely clear Q3.  

  *You suspected this might disadvantage local programmes. The procedure is indeed sceptical of claims where the probability needed to beat proven work exceeds the applicant’s own uncertainty bounds (Q3). This protects against fanaticism but may err toward conservatism.*  

  ---  
  **Final Note:** This fits your constraints. Steps 1-6 can be run in 20-30 minutes per proposal after initial briefing. The solicitor will approve Q1’s rejection of infinite claims as prudent charity governance.
