  **Notes for the Philosophy Club**:  
  - This document isolates empirical tests to resolve disputes, per the scientific spirit of philosophy.  
  - The predictions are falsifiable; e.g., if subjects *do* self-criticize mid-reward (Agent’s prediction), it challenges the discounting-only view.  
  - For discussion: Does "regret during action" (if observed) imply a divided self, or can discounting still explain it?
