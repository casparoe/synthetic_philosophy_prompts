prompt: |-
  I'm putting together the final for a small upper-level metaphysics seminar I'm teaching (mix of phil people and a couple of CS/math types who've already done phil of language), and the multiple-choice section is where I actually want to find out whether they have the shape of Bradley's regress and the unity of the proposition, rather than whether they can recite that the relation itself would need a further relation to tie it to its terms.

  The problem I keep hitting is that every summary makes it sound like there's one regress with one moral, so everyone memorizes either that it's vicious and relations aren't real, or that it's benign and Bradley was just confused, and then they can't tell it apart from the Third Man or from the separate question of how a proposition manages to be unified at all. So the distractors need to be the real mix-ups: regress = Third Man in modern dress; the regress only bites if you're already a realist about relations as entities; Bradley's regress = Frege's problem of unsaturatedness; Russell's multiple-relation theory of judgment as a way of embracing the regress rather than sidestepping it; and so on. I also want one item on why people thought the regress might be benign, the move where each step just reasserts the same fact instead of generating a new obligation, because thats the one that seperates people who've actually read Bradley from people who've read a summary.

  One more thing I want baked in somewhere: halting the regress at the tie or nexus, halting it with Frege-style unsaturated concepts, and halting it with Russell's multiple relation are three different answers that stop it at three different steps, and students shouldn't be able to treat them as interchangeable. Doesn't need a lecture, just make one item force that.

  Give me exactly five numbered items, one or two sentences each, no intro and no closing paragraph. Each item = the stem with the four options inline, then the key plus a one-line note on what each wrong option is catching; in that second sentence also tell me how confident you are that the key is right and which distractor you're least sure isn't defensible. No citations or reading lists, I'm grading off what we did in class.
