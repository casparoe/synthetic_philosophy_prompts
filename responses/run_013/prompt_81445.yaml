  This way, the tax falls only on the fertile and gold mine. That might be acceptable and even progressive? But we want the normal land to pay too. Alternatively, set the tax rate to 25% (1/4):
  - Poor: 1 -> 0.25 -> 0
  - Normal: 2 -> 0.5 -> 0 (or 1? if we round up) -> let's say round down: 0
