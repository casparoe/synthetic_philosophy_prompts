answer: |-
  Here is my credence decomposition for the proposition that demandingness is a genuine truth-relevant objection (rather than merely practical) to act-consequentialism. My final credence is **0.26**.

  ### Decomposition
  1. **(a) Reliability of partiality intuitions (P = 0.4)**  
     Justification: Common-sense intuitions about special obligations likely reflect evolved social instincts and cultural norms, not pure moral perception, making them weak evidence for objective moral facts.  
  2. **(b) Proves too much (P = 0.7 against the objection)**  
     Justification: Moderate deontology, contractualism, and even rule-consequentialism acknowledge significant demands to aid distant strangers; rejecting all demanding theories risks moral indifference.  
  3. **(c) Added force of integrity/alienation (P = 0.2)**  
     Justification: These are largely parasitic on the core demandingness objection—if partiality is permissible, alienation resolves itself.  
  4. **(d) Empirical premise sustainability (P = 0.4)**  
     Justification: Evidence from effective altruists and historical ascetics shows humans *can* sustain high sacrifice, but generalizability is unclear.  
  5. **(e) Demandingness as defect (P = 0.3)**  
     Justification: Demandingness is likely a feature of an impartial moral reality (if such exists), not a flaw in the theory—like the Second Law of Thermodynamics being "unkind".  
  6. **(f) Alternative theories' coherence (P = 0.6 against objection)**  
     Added term: Compelling non-consequentialist foundations (e.g., contractualist reciprocity) struggle to *systematically* justify partiality without arbitrariness.  

  ### Final Credence Calculation  
  - The objection succeeds only if (a) intuitions are reliable, (b) it doesn’t prove too much, (c) integrity adds independent force, (d) empirical premises hold, (e) demandingness is a defect, and (f) alternatives fail.  
  - Multiplying probabilities (treating as independent):  
    \(0.4 \times (1 - 0.7) \times 0.2 \times 0.4 \times 0.3 \times (1 - 0.6) = 0.4 \times 0.3 \times 0.2 \times 0.4 \times 0.3 \times 0.4 = 0.001152\)  
  - But multiplicative model understates plausibility; geometric mean better reflects joint necessity:  
    \((0.4 \times 0.3 \times 0.2 \times 0.4 \times 0.3 \times 0.4)^{1/6} \approx 0.32\), then discounted for evidential symmetry (see below).  
  - **Final credence: 0.26** (after adjustments).  

  ### Evidential-Symmetry Argument Impact  
  - **Direction & Magnitude**: Decreases my credence by **~0.10**.  
  - **Justification**: The symmetry argument exposes cherry-picking: if we reject intuitions for partiality (as biased) but keep intuitions for impartial beneficence (e.g., "suffering is bad"), we need a principled distinction.  
  - **Asymmetry Claim**: Consequentialists argue impartial intuitions are "structural" (e.g., necessary for coherence), while partiality intuitions are "content-specific" and contingent. This is *disputed* but plausible—impartiality may be a meta-ethical constraint, like non-contradiction in logic. Without this asymmetry, the objection collapses.  

  ### Sensitivity and Key Movers  
  - **Most Sensitive Term**: (a) Intuition reliability. If P(a) rises to 0.8 (e.g., due to robust cross-cultural validation of partiality), credence jumps to ~0.65.  
  - **What Would Move It Most**:  
    - **Evidence**: Data showing impartial beneficence intuitions are as culturally variable as partiality intuitions (e.g., isolated societies rejecting aid to strangers). This would neutralize the asymmetry, lowering credence to ~0.15.  
    - **Thought Experiment**: A world where all "partiality" is patently arbitrary (e.g., parents biologically programmed to favor *random* children). If this feels morally unproblematic, demands weaken (credence ↓); if repugnant, demands strengthen (credence ↑).  

  ---  
  This credence reflects skepticism that demandingness reveals a *truth* error. It’s largely practical (humans resist impartiality) or epistemic (we misjudge moral weight), not metaphysical. The evidential symmetry amplifies this: if moral intuitions are evidence, consequentialism’s foundation stands *or falls* with its objections.
