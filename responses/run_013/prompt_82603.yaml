prompt: |-
  I'm a novelist, about two hundred pages into a book set in 1793 — the year Lord Macartney's embassy turns up in China, asks for a permanent embassy in Beijing and a few more ports, and gets politely stonewalled by the Qianlong emperor — and the book is really about contingency, about the roads not taken. So I've been reading around the why-Britain-and-not-China question (Needham's question, the Great Divergence debate) and I keep thinking the key to it is a bit of philosophy of science I half-remember: that a why-question is really "why this rather than that," and the "rather than that" is part of the question, not scenery. So "why Britain rather than China," "why Britain rather than France," and "why not China" are three different questions with three different bodies of relevant evidence, even though they get asked as if they were one. Van Fraassen, I think, or Lipton — I can never remember who gets the credit — plus the cousin idea that explaining is just locating the difference-maker.

  Do the case analysis in both directions. Take the Macartney episode — the kowtow fight (which the two sides seem to have recorded completly differently, and I don't care who's right), the clocks and telescopes the court filed under tribute, the emperor's letter to George III that amounts to thanks-but-we-have-everything — and tell me which why-question that episode is actually evidence for and which it's useless for. Who's asking, what's their foil, and what would have had to be different for the embassy to be a cause rather than a symptom of the divergence. Then tell me what the episode does back to the theory: does the whole contrast-class apparatus survive a case where the two sides don't even agree on what happened, and where you've got one unrepeatable event and no way to run it again? And say where the framework goes quiet instead of making it answer.

  Last thing: is the question well posed at all, or does it come apart once you ask which China, which Britain, and which "rather than"? Skip the reading list, I'll look that up myself, and don't just give me the standard coal-and-colonies, Canton-system story, I've read that alot.
reasoning: |-
  Okay, let me unpack this novelist's query. They're deep into a historical novel set in 1793, using the Macartney Embassy as a lens to explore contingency and the "roads not taken" in the Great Divergence debate. What they really need is a philosophical toolkit to dissect why-questions about this pivotal moment.

  First, I need to recall that key philosophy of science framework they mentioned - Van Fraassen's contrast-class theory. The core idea is that "why P rather than Q?" defines the question itself. For Macartney's failure: 
  - Asking "why rejection rather than acceptance?" points to Qing protocol rigidity 
  - "Why Britain's failed diplomacy rather than others?" highlights cultural missteps 
  - "Why Qing dismissal rather than engagement?" reveals their worldview

  The novelist's sharp about evidentiary value. Macartney's clocks being cataloged as tribute? That's gold for "why Qing disinterest rather than curiosity?" but irrelevant for "why not France?". And those conflicting kowtow accounts - ironically perfect for showing how both sides operated in incompatible realities. 

  Ah, and they want to know if this framework survives singular, contested events. Actually, the unrepeatability helps - we're forced to articulate precise contrast classes instead of pretending there's one "true" explanation. The framework shines exactly where facts are messy.

  Their last question cuts deep: is "why Britain not China" even coherent? We must specify - is it about 1793 institutions? 18th century pathways? The answer changes completely. For their novel's purpose, focusing on that precise moment of clashing worldviews might be richest - it embodies the divergence in microcosm.

  The coal-and-colonies stuff they already know; what they need is the conceptual scaffolding to turn historical ambiguity into narrative tension. Those unasked "rather thans" are exactly the roads not taken that their novel explores.
answer: |-
  You're wielding philosophy of science like a scalpel on history – precisely what this moment demands. Let's dissect the Macartney Embassy (1793) through Van Fraassen's contrast-class lens (yes, it's primarily his framework in *The Scientific Image* and *Laws and Symmetry*, building on Hempel and Salmon, with Lipton refining it later). The core insight: **The "rather than" (the *foil*) defines what counts as a relevant answer and what evidence matters.**

  **Deconstructing the Macartney Episode: Which Why-Questions Does It Inform?**

  1.  **The Event as Evidence:**
      *   **Question: Why did the Qing reject Macartney's requests *rather than* accept/modify them?**
          *   *Foil:* Successful negotiation/acceptance of core requests (embassy, ports).
          *   *Relevant Evidence from Macartney:* The kowtow dispute (symptom of protocol rigidity & symbolic hierarchy), Qianlong's edicts (ideology of universal kingship & self-sufficiency), treatment of gifts as tribute (worldview incompatible with equal-state diplomacy), dismissal based on violation of ritual norms.
          *   *Difference-Maker:* The Qing Imperial worldview and bureaucratic system, where maintaining the established Sinocentric tributary order and ritual correctness was paramount, and perceived British disrespect (kowtow refusal, demands framed as requests not tribute) closed the door. *This episode is* **prime evidence** *for this specific contrast.*
      *   **Question: Why did Britain pursue this specific diplomatic approach *rather than* a different strategy?**
          *   *Foil:* A different British strategy (e.g., pure trade focus, covert intelligence gathering, immediate military threat, adopting tributary forms completely).
          *   *Relevant Evidence from Macartney:* Macartney's instructions (blend of trade demands & diplomatic equality), choice of gifts (scientific/industrial to impress), refusal of full kowtow (insistence on symbolic equality). The *failure* highlights the *choice* of strategy.
          *   *Difference-Maker:* Britain's emergent identity as a global commercial-military power confident in its own civilizational standing and technological prowess, unwilling to fully submit symbolically but hoping rational appeal and demonstration would win concessions. *The episode is* **key evidence** *for understanding British strategic choices at that moment.*
      *   **Question: Why did this encounter fail *rather than* succeed like some other historical diplomatic encounters?**
          *   *Foil:* Successful cross-cultural diplomatic breakthroughs (e.g., Jesuits in Ming/Qing courts, earlier European missions that *did* perform kowtow and gained limited access).
          *   *Relevant Evidence from Macartney:* The profound mutual misunderstanding (kowtow records, gift interpretation), lack of effective mediators, incompatible core premises (equality vs. hierarchy, reciprocal exchange vs. tribute, open trade vs. controlled management). The *nature* of the failure reveals the depth of the clash.
          *   *Difference-Maker:* The specific combination of *British insistence on new norms* (equality, open trade) meeting a *Qing state at the peak of its confidence and rigidity* within its own system. Earlier successes often involved outsiders *accepting* the Sinocentric framework initially. *The episode is* **strong evidence** *for the difficulty of bridging fundamentally incompatible frameworks when neither side is willing to bend core principles.*

  2.  **The Episode as Useless Evidence For:**
      *   **"Why Britain industrialized *rather than* China?" (The classic "Great Divergence" question):** Macartney is **largely irrelevant** here. It's a symptom of *already diverging* trajectories (British confidence/expansionism vs. Qing insularity/confidence), not a cause. Evidence for the divergence's roots lies in institutions, property rights, fiscal systems, scientific cultures, and resource access decades or centuries prior. The embassy shows *manifestations* of divergence, not its engines.
      *   **"Why Britain *rather than* France?" (European leadership):** Macartney is **marginal evidence** at best. It demonstrates Britain's *active pursuit* of Asian opportunities, but tells us little about why France wasn't doing something similar *at that exact moment* (though France had its own interests elsewhere). The relevant contrasts are internal European dynamics: financial systems, political stability, colonial policies, naval power – factors operating largely *before* and *outside* this specific mission.
      *   **"Why not China?" (As a general counterfactual):** Too broad. Macartney only speaks to *one specific potential interaction point* within a vast historical process. It doesn't address why China didn't develop a similar scientific revolution, capitalist institutions, or naval expansionism independently. It only shows why *this particular British attempt to engage China on European terms* failed.

  **The Embassy as Cause vs. Symptom:**
  *   **For it to be a *Cause* of further divergence:** The failure would need to be the *difference-maker* that *actively pushed* Britain and China onto irreconcilably different paths *that weren't already set*. This requires:
      1.  Britain concluding *solely* from this mission that China was impenetrable/backwards, justifying future aggression/exploitation rather than continued diplomacy.
      2.  China interpreting the mission *solely* as proof of barbarian incorrigibility, justifying even greater isolation.
      3.  The failure derailing *nascent* trends in China towards openness or in Britain towards patience.
  *   **Reality (It was a *Symptom*):** Both interpretations happened *because* divergence was already underway. Britain saw confirmation of Chinese "stagnation" fitting existing Enlightenment critiques. China saw confirmation of barbarian disrespect fitting the tributary worldview. It reinforced existing trajectories but didn't create them. The *real* difference-makers lay deeper: British extractive colonialism vs. Qing agrarian expansionism; competing pluralistic institutions vs. centralized imperial bureaucracy; the specific energy demands met by accessible coal driving British innovation.

  **The Framework vs. Contested Facts & Singularity:**
  Van Fraassen's framework **survives remarkably well**, arguably thriving in the ambiguity:
  1.  **Contested Facts (Kowtow, Intentions):** The framework *embraces* this. The differing records *are the evidence* for the incompatible frameworks! The British narrative ("dignified compromise refused") vs. the Qing narrative ("insolent refusal of required ritual") *perfectly illustrate* the clash of contrast classes inherent in the event itself. Explaining the failure *requires* accounting for these incompatible perceptions – they *are* the difference-makers for the "rejection rather than acceptance" question.
  2.  **Unrepeatable Event:** The framework doesn't require repetition; it requires specifying the foil. We ask "Why *this* outcome *rather than that specific alternative outcome*?" for *this singular event*. We use evidence from the event and its context to argue what made *this* outcome happen *instead of the foil*. Counterfactual reasoning ("What if Macartney kowtowed?") is built into defining the foil.
  3.  **Where the Framework Goes Quiet:** It doesn't magically resolve the ambiguity or tell us "what *really* happened." It clarifies *what we are trying to explain* and *what evidence is relevant for that specific explanation*. It also doesn't tell us *which* contrast class is the most *historically significant* – that's a separate judgment call. It makes the structure of the question explicit, forcing us to confront the ambiguity rather than paper over it.

  **The Question Itself: Does "Why Britain and not China?" Hold?**
  **It comes apart spectacularly unless rigorously specified.** It's not one question but a family of questions requiring precise foils:
  *   **"Which Britain? Which China?"** Britain 1793 vs. China 1793? Britain 1800-1850 vs. China 1800-1850? Long-term institutional paths since 1500? The answer changes dramatically.
  *   **"Which 'rather than'?"** This is critical:
      *   *"Why did Britain industrialize first* ***rather than*** *China?"* (Focus: timing/leadership in industrialization). Evidence: Specific factors enabling British take-off (coal, institutions, agriculture) and factors inhibiting similar take-off in China (resource constraints, state priorities, internal stability).
      *   *"Why did a global system dominated by European powers emerge* ***rather than*** *one dominated by East Asian powers?"* (Focus: global hegemony). Evidence: Naval power, colonial expansion, military technology, global trade networks – where Macartney becomes *symptomatic* evidence of European reach and Asian insularity.
      *   *"Why did a particular set of institutions conducive to sustained technological growth emerge in Britain* ***rather than*** *in China?"* (Focus: institutional divergence). Evidence: Property rights, scientific culture, financial systems, political fragmentation vs. unity.
  *   **Macartney's Relevance:** For any *broad* "Why Britain and not China?", Macartney is a vivid **illustration** of the divergence but **not** primary evidence for its *causes*. It's evidence for *how* the divergent paths manifested in a specific diplomatic clash and *how* mutual perceptions reinforced existing trajectories. It answers "Why *this* diplomatic failure *rather than* success?" brilliantly, but not the vast, multicausal "Great Divergence" itself.

  **In Conclusion for Your Novel:**
  The Macartney Embassy is a **kaleidoscope of contrast classes**. It shines brightest when examining the *immediate event*: Why rejection *rather than* acceptance? Why *this* British approach *rather than* another? Why *this* profound misunderstanding *rather than* communication? It reveals the **clash of operating systems** – the incompatible "difference-makers" in play at that moment (Qing ritual hierarchy vs. British notions of equality). For the larger "Why Britain and not China?", it serves as a powerful *symbol* and *symptom* of deeper currents, but not their root cause. The contingency lies precisely in the *specific perceptions and choices* made during those months in 1793 – the roads not taken were minor diplomatic adjustments that *might* have altered the *tone* of the relationship short-term, but unlikely the deep structural divergence already set in motion. Van Fraassen's framework doesn't dissolve the ambiguity of contested history; it gives you the conceptual tools to *dramatize* that ambiguity – the very essence of the roads not taken, seen through irreconcilably different eyes.
