answer: |-
  ## The Bargaining Axiom Wars: Why Monotonicity Deserts the Throne

  The elegant tug-of-war between Nash and Kalai-Smorodinsky (KS) solutions dominates two-person bargaining theory. Nash relies on **Independence of Irrelevant Alternatives (IIA)**: the chosen outcome shouldn't change if unchosen, worse options are removed. KS relies on **Individual Monotonicity (IM)**: if the feasible set expands in a way that only improves one party's *best possible* outcome (their "ideal point"), that party shouldn't get less. Both solutions share Scale Invariance, Pareto Efficiency, and Symmetry. The impossibility of satisfying all five axioms forces a choice. I argue that IM is normatively superior to IIA in the bargaining context, and attempts to reconcile them through a context-dependent hybrid ultimately fail, indicting IIA. The KS solution, while imperfect, provides a better normative foundation, though its treatment of the disagreement point warrants scrutiny.

  **The Normative Asymmetry: IIA's Misplaced Rigidity vs. IM's Core Fairness**

  IIA gains plausibility in social choice or expected utility as a consistency axiom. In bargaining, however, it functions differently and problematically. IIA demands that the solution be insensitive to the *range* of possibilities defining the parties' relative leverage, focusing solely on the selected point and the disagreement point. This severs the solution from the very structure of mutual advantage. Consider two feasible sets, *S* and *T*, where *S* ⊂ *T* and both contain the same disagreement point and the same Nash solution point. IIA forces the solution to be identical in both. Yet, *T* might offer vastly better options for one party, fundamentally altering their bargaining power – a shift IIA ignores. IIA treats bargaining power as fixed solely by the disagreement point and the selected alternative, rendering it blind to how the *shape* of the opportunity set influences the relative strength of claims.

  IM, conversely, encodes a fundamental principle of desert within the bargaining context: **if your actions or circumstances improve your *own* best possible outcome without harming the other party's best possible outcome, you should not be penalized.** Your claim to a share of the surplus strengthens when you expand the pie *specifically through opportunities unique to you*. Dismissing IM as merely "incentive-driven" misses this normative core. It ensures a party benefits from creating new value that only they can access, linking reward to contribution to the cooperative potential.

  **The Consortium Test Case: Incentives and Complaints**

  Imagine two labs, A and B, dividing joint research proceeds. The disagreement point *d* = (d_A, d_B) represents their independent funding if they fail to agree. Initially, the feasible set *S* yields an ideal point *u* = (u_A, u_B). Lab A can unilaterally invest in equipment, costing *c*, to expand the feasible set to *T*. Crucially, this expansion *only* raises Lab A's maximum attainable payoff to *v_A > u_A*, leaving Lab B's maximum *v_B = u_B* unchanged. The disagreement point remains *d*.

  *   **Nash Solution (IIA):**
      1.  **Pre-Investment (Set S):** Solution N_S = (n_A, n_B).
      2.  **Post-Investment (Set T):** Since N_S is still feasible in *T* and the disagreement point is unchanged, IIA mandates that the solution *remains* N_S. Lab A receives the same share as before.
      3.  **Incentive:** Lab A gains nothing from the investment but bears the cost *c*. If *c > 0*, A is strictly worse off investing. **No incentive to create the larger surplus.**
      4.  **Complaint:** Lab B has no complaint – they get the same as before. Lab A has a strong complaint: they bore the cost to create a larger pie yet receive no benefit. They are punished for cooperation-enhancing investment.

  *   **KS Solution (IM):**
      1.  **Pre-Investment (Set S):** Solution KS_S is proportional to the ideal point *u*.
      2.  **Post-Investment (Set T):** The new ideal point is *v* = (v_A, u_B). IM guarantees Lab A gets at least as much as in KS_S. The KS solution KS_T typically increases A's share *and* B's share relative to KS_S, as the whole ray shifts outward.
      3.  **Incentive:** Lab A's payoff increases (KS_T,A > KS_S,A). As long as this increase exceeds the cost *c* (KS_T,A - c > KS_S,A), A has an incentive to invest. *Even if A is worse off net of cost* (KS_T,A - c < n_A under Nash, potentially < KS_S,A), IM ensures A gets a larger *gross* share of the larger pie they created.
      4.  **Complaint:** Lab A: Only if the cost is so high that KS_T,A - c < KS_S,A – they created value but are net worse off. Lab B: Might complain they get a larger absolute share without contributing anything. However, B's claim is weaker: A's action expanded the cooperative surplus uniquely; B's leverage (their ideal point and disagreement point) is unchanged. KS recognizes that A's improved prospects strengthen their claim on the *marginal* surplus.

  **The Hybrid Challenge and Its Breakdown**

  Can we combine the axioms contextually? Apply IIA when the feasible set *contracts*, preserving stability, but IM when it *expands*, ensuring creators benefit? Specifically, when an expansion only improves one party's ideal point, use IM.

  *   **Pre-Investment (Set S):** Hybrid solution H_S (say, Nash or KS).
  *   **Investment/Expansion (S to T):** Apply IM. H_T must give Lab A ≥ H_S,A. Assume H_T = KS_T.
  *   **Contraction (T back to S):** Apply IIA. Since H_T (KS_T) is in S and d is unchanged, IIA forces the solution back to H_S.

  Here's the fatal flaw: **The round trip (S -> T -> S) violates Individual Monotonicity.** Lab A expanded the set to T, triggering IM and increasing their payoff to KS_T,A > H_S,A. When the set contracts back to S (e.g., the equipment breaks irreparably), applying IIA resets the solution to H_S,A. But IM demands that if the set *contracts* in a way that *only reduces A's ideal point* (back to u_A) while leaving B's ideal point unchanged, A should not get *more*. Yet, going from T back to S, A receives *less* (H_S,A < KS_T,A). Applying IIA on contraction violates the very spirit of IM applied on expansion – it penalizes A when their unique advantage disappears. The hybrid is incoherent; it cannot satisfy the contextual demands simultaneously. This breakdown indicts IIA, not IM. The requirement for stability under contraction (IIA) forces us to ignore the normative link between opportunity creation and reward established by IM under expansion.

  **The Disagreement Point: More Than Just the Ideal?**

  KS uses the disagreement point *d* solely to define the "gains" used in its proportional calculation (relative to the ideal point *u*). It ignores *d*'s absolute level or how it shifts relative to *u*. Nash depends directly on *d*.

  This KS feature is normatively deficient. Consider a change in external funding: Lab A's independent funding (d_A) increases significantly, while Lab B's (d_B) and the ideal points (u_A, u_B) remain constant. Under KS, the solution is unchanged – the ray from *d* to *u* hasn't shifted. Yet, intuitively, Lab A is now *less dependent* on the consortium; their improved outside option should strengthen their bargaining position, allowing them to demand a larger share of the surplus for agreement. Nash captures this: the solution shifts towards A. The disagreement point represents the credible threat of non-cooperation; its strength relative to the cooperative surplus fundamentally shapes bargaining power. KS, by ignoring this richer dependence, overlooks a core aspect of leverage and renders parties insensitive to shifts in their best non-cooperative alternatives, even when those shifts don't alter the cooperative ideal point. A defensible solution must incorporate this dependence.

  **Verdict: Monotonicity over Independence, KS over Nash (with Reservations)**

  The case against IIA is decisive. It normatively disconnects the solution from the structure of the feasible set that defines bargaining leverage, leading to perverse incentives against value creation (as in the consortium) and incoherence when hybridized. IM, far from being merely technical, captures the essential fairness principle that a party should benefit from expanding the cooperative surplus in ways uniquely available to them.

  Therefore, **the Kalai-Smorodinsky solution, resting on IM, provides a superior *normative* foundation for bargaining theory than the Nash solution.** It aligns outcomes with desert in value creation and provides proper incentives for cooperation-enhancing actions. The consortium case vividly demonstrates this: KS encourages the investment while Nash stifles it, and B's complaint under KS lacks the normative force of A's complaint under Nash.

  **However, KS's treatment of the disagreement point is a significant weakness.** A fully adequate solution must incorporate a richer dependence on *d*, recognizing that shifts in the parties' best non-cooperative alternatives alter their relative bargaining power even when the ideal point is fixed. While KS gets the core trade-off between IIA and IM right, its specific formulation is incomplete. Normative bargaining theory should embrace IM as indispensable but seek solutions that also respond more sensitively to the disagreement point than KS does.

  **Strongest Objection & Reply**

  *   **Objection:** "IM rewards luck, not desert. In the consortium, Lab A might simply have privileged access to funding for equipment (luck), not have 'earned' it. KS forces B to give up a larger share of the *original* surplus just because A got lucky, even though B's contribution and leverage are unchanged. This is unfair expropriation. Nash protects B's fair share against A's windfall gains."
  *   **Reply:** Bargaining theory inherently concerns *claims based on potential*, not moral desert in a vacuum. A's unique capacity to expand the pie (whether through luck, skill, or resources) *is* a source of bargaining power. KS recognizes this by strengthening A's claim on the *marginal* surplus they uniquely enabled. Crucially, B's *absolute* payoff *increases* under KS post-investment (KS_T,B > KS_S,B). B is better off in absolute terms due to A's action; they are not "expropriated" – they gain from A's luck or capability. Nash, by freezing A's share, effectively gives B a free ride on A's investment, which is normatively harder to justify. Fairness in bargaining must account for who controls the opportunities for mutual gain.

  The choice between Nash and KS is not symmetrical. IIA's normative basis in bargaining is weak and leads to counterintuitive, often detrimental, outcomes. IM captures a fundamental principle linking opportunity and reward within cooperation. While the Kalai-Smorodinsky solution imperfectly handles the disagreement point, its core axiom provides the sounder foundation for a normative theory of bargaining. The quest for a solution satisfying IM while incorporating richer dependence on the disagreement point remains essential.
