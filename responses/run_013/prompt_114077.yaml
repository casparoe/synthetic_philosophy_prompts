answer: |-
  ### Final Exam Question: Practical Reason Seminar  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 600 words (strictly enforced)  

  **Question:**  
  Kavka’s toxin puzzle claims a rational agent cannot form the sincere intention to drink a harmless toxin (causing one day of illness, disutility *T*) to gain $1M, because the money is irrevocably granted *before* drinking occurs, rendering the action pointless. In a variant, you may—*before midnight*—irrevocably post a bond *B* with a neutral, automated commitment service. This bond will be forfeited to a cause you find morally repugnant unless you drink the toxin by the appointed hour *after* receiving the money.  

  1. **Bond Condition**: State the precise mathematical condition *B* must satisfy for you to form a *sincere intention at midnight* to drink the toxin. Justify why this condition makes the intention rational.  
  2. **Source of the Puzzle’s Force**: Explain what this variant reveals about why the original puzzle supposedly blocks sincere intention-formation. Is the obstacle purely psychological, logical, or rooted in incentives?  
  3. **Billionaire’s Countermove**: Suppose the billionaire anticipates your use of the commitment service. Design the *strongest modification* to their offer that would nullify your strategy while preserving the core challenge of the original puzzle. Argue why your modification succeeds.  

  *(Do not rehash standard solutions (e.g., Kavka, Gauthier, McClennen). Engage directly with the mechanics of this variant.)*  

  ---

  ### Model Answer (Approx. 600 words)  

  **1. Bond Condition**  
  For a sincere intention to drink to be rational at midnight, the bond *B* must satisfy *B > T*. At midnight, the agent faces two future scenarios:  
  - *Drink*: Suffers *T* (illness) but keeps *B*. Net cost: *T*.  
  - *Not Drink*: Forfeits *B* to a repugnant cause, inflicting moral disutility equivalent to losing *B*. Net cost: *B*.  
  Since the $1M is already secured and irrelevant to future action, drinking is rational iff *T < B*. The bond transforms inaction into a *new, greater cost*. If *B > T*, intending to drink becomes instrumentally rational: it minimizes expected future disutility. The intention is sincere because it reflects a genuine plan to avoid the worse outcome (*B* loss).  

  **2. Source of the Puzzle’s Force**  
  This variant shows that the original puzzle’s force stems from a *structural gap in incentives*, not psychology or logical impossibility. The original fails because post-intention incentives *reverse*: the agent gains nothing from drinking but pays *T*. Rational intention requires stable alignment of incentives before *and* after the point of action. The bond bridges this gap by creating a *new, credible penalty* for inaction that persists *after* the money is received. This penalty makes the intention *stable* because reneging *after* midnight now carries a cost (*B*) exceeding the cost of drinking (*T*). The obstacle is thus incentive-compatibility across time, not mere "willpower" or paradoxical logic. If incentives align (via *B > T*), intention-formation is straightforward.  

  **3. Billionaire’s Countermove**  
  The billionaire can nullify this strategy by conditioning the $1M reward *not only* on sincere intention at midnight *but also* on the *absence* of any pre-midnight commitment device. Specifically, they add:  
  > *"If you transfer any bond, asset, or contingent claim to a third party before midnight as a mechanism to enforce your intention, you forfeit the $1M unconditionally."*  

  This modification succeeds because:  
  - It directly targets the bond strategy: Posting *B* now voids the $1M, making the bond irrelevant. The agent cannot use external commitment without losing the reward.  
  - It preserves the core puzzle: Without the bond, the original incentive gap returns. At midnight, intending to drink remains irrational since drinking still costs *T* with no offsetting gain (as the $1M is already secured *and* conditional on no bond). A rational agent cannot form the intention.  
  - It is anticipatory and credible: The billionaire monitors for compliance, and the penalty (losing $1M) dominates any gain from posting *B*. Thus, no rational agent posts the bond.  

  The variant’s solution is preempted by making the commitment tactic incompatible with receiving the reward, restoring the original dilemma.  

  ---

  ### Marking Scheme (20 marks total)  
  **A-Grade (17–20)** must include ALL of the following:  
  - **Bond Condition (5 marks)**  
    - Explicitly states *B > T* (or equivalent).  
    - Explains net cost of drinking (*T*) vs. not drinking (*B*), ignoring the $1M (already secured).  
    - Argues intention is sincere *because* it minimizes future disutility.  
  - **Source of Force (5 marks)**  
    - Identifies *incentive misalignment over time* (not psychology/logic) as the core issue.  
    - Contrasts original (no post-money cost for inaction) with variant (inaction costs *B > T*).  
    - Notes that *B* makes intention *stable* by altering post-midnight payoffs.  
  - **Billionaire’s Reply (5 marks)**  
    - Proposes *conditional forfeiture* of $1M if a bond is posted.  
    - Explains why this prevents bond-posting (loss of $1M > gains from bond strategy).  
    - Shows original paradox returns: intention irrational without bond since *T* > 0 post-money.  
  - **Argument Rigor (5 marks)**  
    - No reliance on standard literature; original analysis of variant.  
    - Precise payoff comparisons at critical times (pre-midnight, midnight, post-money).  
    - Addresses sincerity, stability, and credibility of commitments.  

  **B-Grade (13–16)**  
  - Correct but incomplete bond condition (e.g., *B > T* stated but not justified).  
  - Identifies incentive gap but conflates with psychology/logic.  
  - Billionaire’s reply modifies the offer but not decisively (e.g., adjusts *T* or timing).  
  - Minor errors in payoff analysis or sincerity.  

  **C-Grade (9–12)**  
  - Bond condition incorrect (e.g., *B < T*) or absent.  
  - Source of force misunderstood (e.g., focuses on "regret" or "willpower").  
  - Billionaire’s reply weak (e.g., monitors drinking, but doesn’t block bond).  
  - Significant gaps in reasoning.  

  **D/F (<9)**  
  - Misstates the variant or original puzzle.  
  - No mathematical condition for *B*.  
  - Billionaire’s reply irrelevant.  
  - Summarizes standard literature.  

  ---  
  **Rationale for Design**: This question forces students to move beyond Kavka’s "paradox of intention" by testing how *external commitment devices* alter incentive structures. The A-grade requires isolating the temporal incentive gap, modeling the bond as a rational choice mechanism, and anticipating strategic countermeasures—core skills in practical reason. The billionaire’s reply restores the puzzle by making commitment *infeasible*, proving the variant’s solution is fragile.
