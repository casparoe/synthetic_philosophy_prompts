prompt: |-
  Bit of a strange one. My flatmate and I have been going round in circles about the centipede game — the one where two players take turns, and at each node you can either take a slightly bigger share of a pot that's been growing, or pass it over and let the pot grow again; if you both pass all the way to the very end you split something decent, but at every single node taking pays a touch more than passing *if* you assume the other person will take at the next node. Standard backward induction says player one should take right at the start, since taking beats passing at the final node, so you anticipate that one step back, and the whole thing unravels. My flatmate thinks that's basically a reductio and that no sane theory of practical rationality could possibly demand it; I think she's quietly swapping "what a rational agent would do" for "what a psychologically normal person would actually do". We're at about 0.75 for me and 0.15 for her and getting nowhere, so I want an outside number.

  So: what's your credence that backward induction gives the *correct* verdict about what a rational first player does at the opening node in the hundred-ish-node version, where we stipulate common knowledge of rationality and purely self-interested payoffs over the money? Please don't just say "it depends what you mean by rational" — give me a number and then pull it apart. I'd like the sub-questions you think the number actually rests on, each with a rough probability and a line of justification, and then how they combine into the final figure. Some things I suspect belong in the decomposition, but you tell me if I'm wrong: whether common knowledge of rationality is even a coherent idealisation for real agents; whether "rational" here means maximising causal expected utility or something else; whether the paradox is a claim about what people *will* do (in which case it looks empirically false and that's that) or a normative claim about what they *should* do (in which case falsity of the prediction is neither here nor there); whether the refinements people trot out — subgame perfection, trembling-hand, forward induction, the idea that passing can signal something — genuinely change the verdict or just relocate the puzzle; and whether "the correct verdict" is even the kind of thing that has a truth value rather than being an artefact of how we set up the idealisation. Assign whatever probabilities you like to these and add any I've missed, but keep it honest about which are load-bearing.

  Then two follow-ups. First, which single term is my final number most sensitive to, and what argument or piece of evidence would move it most — I mean really move it, not nudge it. Second, given that I'm at 0.75 and she's at 0.15, where do you reckon our disagreement actually lives — is it a disagreement about the theory of rationality, about what the question is asking, or just about how much weight to put on the fact that real people almost never defect on node one? I've got a feeling it's the last one but I'd like to be told I'm wrong if I am.
