answer: |-
  ### Session Design: Ambiguity Aversion Experiential Workshop  
  **Goal:** Make participants feel ambiguity aversion in their choices, then confront the inconsistency those choices create.  
  **Core Mechanism:** Ellsberg Paradox (modified) with two rounds—baseline vs. adversarial ambiguity.  

  ---

  #### **Materials & Setup**  
  - **Urn:** One opaque container holding 90 balls:  
    - **30 red balls** (known quantity).  
    - **60 balls split between black/yellow** (exact proportion hidden; e.g., 20 black, 40 yellow).  
  - **Bets:** Display four bets (win 100 tokens each):  
    1. **Bet R:** Win if ball is *red*.  
    2. **Bet B:** Win if ball is *black*.  
    3. **Bet RY:** Win if ball is *red or yellow*.  
    4. **Bet BY:** Win if ball is *black or yellow*.  
  - **Tokens:** Use virtual tokens (no real money). Each participant starts with 200 tokens.  
  - **Sheets:** Paper for private pricing (columns: Bet R, Bet B, Bet RY, Bet BY).  
  - **Broker:** You act as broker (simulated trades).  

  ---

  ### **Timeline (75 Minutes Total)**  

  #### **1. Introduction (5 min)**  
  - **Script:** "We’re exploring decision-making under uncertainty. This urn has 90 balls: 30 red, 60 black or yellow in a *fixed but hidden proportion*. You’ll price four bets—each pays 100 tokens if it wins. Price each bet at the *maximum tokens you’d pay* to own it. No talking."  
  - **Rules:**  
    - Bets are independent; pricing is private.  
    - Tokens are hypothetical (no stakes).  

  #### **2. Round 1: Baseline Elicitation (10 min)**  
  - Participants privately write prices for all four bets (e.g., Bet R: 35 tokens, Bet B: 20 tokens).  
  - Collect sheets.  

  #### **3. Reveal Modal Pattern & Discuss (15 min)**  
  - **Tally:** Show modal/average prices (projected or on board). Expected pattern:  
    - **Bet R > Bet B** (e.g., R: 35, B: 20).  
    - **Bet BY > Bet RY** (e.g., BY: 65, RY: 50).  
  - **Volunteer Rationale (5 min):** Ask 2–3 volunteers: *"Why price Bet R higher than Bet B? Why Bet BY higher than Bet RY?"*  
    - **Target responses:** "I know the odds for red," "Black feels vague," "BY covers more uncertainty."  
  - **Anchor the Feeling:** "So we dislike betting on unknowns—even when the *math* seems similar."  

  #### **4. Broker Round: The "Floor Tilts" (20 min)**  
  - **Script:** "I’ll now act as a broker. Using *your* prices, I’ll execute four trades. Each trade is ‘fair’ by your own valuation."  
  - **Four Trades per Participant:**  
    1. **Buy Bet R** from broker (pay your WTP for R).  
    2. **Sell Bet B** to broker (receive your WTP for B).  
    3. **Buy Bet BY** from broker (pay your WTP for BY).  
    4. **Sell Bet RY** to broker (receive your WTP for RY).  
  - **Reveal the Outcome:**  
    - **Portfolio Payoff:**  
      - *Red drawn:* Win 100 (R) − Pay 100 (RY) = **0**.  
      - *Black drawn:* Pay 100 (B) + Win 100 (BY) = **0**.  
      - *Yellow drawn:* Win 100 (BY) − Pay 100 (RY) = **0**.  
    - **Net Cash Flow (Loss):**  
      `(WTP_B + WTP_RY) - (WTP_R + WTP_BY) = Negative`  
      *(e.g., (20 + 50) − (35 + 65) = −30 tokens)*.  
  - **Key Moment:** "You paid tokens for a portfolio that pays **zero in all scenarios**. You lost tokens on ‘fair’ trades."  

  #### **5. Debrief Round 1: Inconsistency Exposed (10 min)**  
  - **Contradiction Breakdown:**  
    - Pricing **R > B** implies belief: *P(black) < 1/3* (since P(red) = 1/3).  
    - Pricing **BY > RY** implies belief: *P(black) > 1/3* (since P(BY) = 2/3, P(RY) = 1/3 + P(yellow); BY > RY ⇒ P(black) > P(red)).  
  - **Conclusion:** "Your prices demand *P(black) < 1/3* and *P(black) > 1/3*. That’s impossible."  
  - **Name the Phenomenon:** "This is **ambiguity aversion**—avoiding unknown probabilities. It feels rational but commits you to inconsistencies."  

  #### **6. Round 2: Adversarial Ambiguity (10 min)**  
  - **New Rule:** "The hidden 60 balls will be split *after* you bet by a hostile host who wants you to lose."  
  - Re-elicitation: Price the same four bets.  
  - **Expected Shift:** Prices drop for ambiguous bets (B, RY), but pattern persists: R > B, BY > RY.  
  - **Quick Compare:** Show average prices vs. Round 1 (e.g., B drops from 20 → 15, RY from 50 → 40).  

  #### **7. Final Debrief: Dual Realities (5 min)**  
  - **Two Faces of Ambiguity:**  
    - **Incoherence:** Round 1 shows subjective inconsistency (no single probability exists).  
    - **Defensible Caution:** Round 2 shows ambiguity aversion as rational *if* uncertainty is strategic.  
  - **Theoretical Mapping:**  
    | **Session Moment**          | **Concept**                          | **Your Delivery** |  
    |-----------------------------|--------------------------------------|-------------------|  
    | Bet R vs. Bet B             | Risk (known prob) vs. ambiguity      | Implicit in task  |  
    | Portfolio payoff = 0        | Violation of "sure-thing principle" | Broker round      |  
    | Hostile urn in Round 2      | Uncertainty as adversarial (Knightian) | Explicit rule     |  
  - **Takeaway:** "Ambiguity aversion is both a psychological bias and a shield against exploitation—context matters."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Contamination:** Participants peek at neighbors’ prices.  
     - **Fix:** Stress privacy; space chairs apart. If caught, say: "This is about *your* intuition—no wrong answers."  

  2. **Order Effects:** Pricing Bet B before Bet RY skews results.  
     - **Fix:** List bets in fixed order (R, B, RY, BY) for all. Randomizing adds confusion.  

  3. **Sophisticated Spoilers:** A PhD student prices all at 33/67 tokens (indifferent).  
     - **Fix:** Use their sheet to show "This is rational! But most of you *didn’t* do this. Why?" Highlight tension between normative/rational and descriptive/psychological.  

  4. **Broker Feels Like a "Trick":** Participants resent the setup.  
     - **Fix:** Preempt: "This isn’t gotcha—it reveals how intuition clashes with logic." Focus on the *collective* pattern, not individual "errors."  

  5. **Math Confusion:** Some struggle with portfolio payoffs.  
     - **Fix:** Use a simple volunteer example. Project a table:  
       | **State** | **R** | **B (sold)** | **BY** | **RY (sold)** | **Net** |  
       |-----------|-------|--------------|--------|---------------|---------|  
       | Red       | +100  | 0            | 0      | −100          | 0       |  
       | Black     | 0     | −100         | +100   | 0             | 0       |  
       | Yellow    | 0     | 0            | +100   | −100          | 0       |  

  ---

  ### **What the Activity Cannot Deliver**  
  - **Probabilistic Nuance:** Cannot show how ambiguity aversion varies with stakes or culture (requires lecture).  
  - **Full Rationality Debate:** The exercise hints at normative/descriptive tensions but can’t resolve them. Say: "This is one lens—philosophers might defend aversion as prudent under ignorance."  
  - **Real-World Generalization:** Lab-urn dynamics don’t capture market or ethical ambiguity. Note: "In life, ambiguity has costs—this is a purified snapshot."  

  ---

  ### **Why This Works**  
  - **Physicality:** Tokens and trades make incoherence visceral.  
  - **No Jargon:** Naming comes *after* feeling.  
  - **Dual Round:** Distinguishes "irrational" inconsistency from strategic caution.  
  - **Cheap & Portable:** Urn = coffee can; balls = colored paper; tokens = pen marks.  

  **Final Tip:** End by asking, "When else have you felt this tension?"—then transition to applications (e.g., finance, AI ethics). The paradox’s power is in its simplicity; trust the room to connect it to their worlds.
