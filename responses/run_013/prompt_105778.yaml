prompt: |-
  I am a PhD student in philosophy of mind, and I am building a case for a paper on the transitivity principle in higher-order theories of consciousness. I need a thought experiment constructed to the following specifications. The case must feature a normal adult human in an ordinary perceptual situation who is in a first-order perceptual state that a first-order representationalist would count as phenomenally conscious, but the state is not reportable (for example, because it is unattended or immediately replaced). At the same time, the subject has an occurrent higher-order representation of that state, but the representation is existential rather than de re: it represents only that the subject is in some first-order state or other, not which state it is. The case may not use subliminal stimuli, masked priming, blindsight, brain damage, demons, or any science-fictional device, and it must be describable in a single paragraph. After the scenario, do the following: (1) say what actualist higher-order thought theory—the view that a first-order state is conscious just in case an occurrent higher-order thought represents it—says about whether the first-order state is conscious, and why; (2) say what higher-order perception theory—the view that the higher-order representation is a perception-like inner sense—says, and why; (3) say what self-representational theory—the view that a state is conscious just in case it represents itself—says, and why; (4) identify the single feature of the case that makes the theories diverge; (5) say what happens if that feature is removed—does the case collapse into a standard higher-order case where all three theories agree?; and (6) explain how a defender of the theory that comes out worst would try to defuse the case. The purpose of the case is to isolate the role of content-specificity in the higher-order representation, so a case that simply stipulates the verdicts rather than generating them from the theories will not work. Please do not provide a bibliography, reading list, or citations; I need the constructed case and the reasoning.
