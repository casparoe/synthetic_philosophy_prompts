prompt: |-
  Ok, so I'm about three weeks into reporting a long feature on promise-keeping and I've hit a wall. Every philosopher-ish person I interview gives me a different story about why a promise binds, and then I put some case from my actual reporting to them -- a promise nobody remembers, a company that "commits" to something via a chatbot, a promise the promisee has released you from but secretly still wants kept -- and they either go quiet or start bolting on exceptions. I'd rather have the spec than another theory. So write me the desiderata: what does any adequate account of why promises bind actually have to deliver? The requirements list, each one with the case or consideration that puts it on the list, and for each, whether it's non-negotiable or just a preference of one camp. Cases I can't stop chewing on and want the theory to handle:

  - two people who both completely forget the promise, nothing rides on it, nobody relied, nobody's hurt -- is breaking it still wrong, and if so, wrong to who?
  - the release: promisee says forget it, but privately still wants it kept and resents you either way
  - the borrowed voice: a parent promising for a kid, a spokesperson "committing" a whole company -- can you bind someone who never said anything, and what kind of agent has to be doing the promising for any of this to work?
  - you keep the promise, but keep it in a way that leaves the promisee worse off and wishing you'd just broken it
  - five people on a committee, three release you, two don't
  - a promise whose content becomes illegal, or just plainly wrong, to carry out
  - a promise to someone who dies before you can keep it

  Also flag any two requirements you think can't be jointly satisfied -- if the list turns out to be internally unsatisfiable somewhere, thats the piece. And tell me which single requirement does the most damage, i.e. knocks out the most otherwise decent accounts. You can close with a couple of lines each on how the usual families do against the list -- the practice/convention view, the expectations-or-harm view, the view that promising is just a power we hold over our own future, the trust view -- but keep the weight on the requirements, I'll do the scoring myself. One thing about purpose: I need a standard good enough to sort the messy cases from reporting, not just seminar cases. Skip the reading list, I've got enough tabs open.
reasoning: |-
  Okay, the user is a journalist deep into reporting a feature on promise-keeping, hitting a wall with conflicting philosophical theories. They need a practical set of requirements—desiderata—to evaluate theories against real-world messy cases they've encountered. 

  First, I need to unpack their frustration: they're tired of abstract theories that crumble when applied to actual reporting scenarios like forgotten promises or corporate chatbots. Their core ask is a "spec" – a checklist of what any viable theory must explain, with clear ties to their case studies. 

  The cases they listed are revealing. The forgotten promise scenario tests whether obligation exists without awareness or harm. The "release with secret resentment" case probes if obligation is objective or purely relational. Corporate/child promises challenge agency boundaries. The "keeping badly" example questions whether outcome trumps intent. Committee splits, illegal promises, and death of promisee each stress-test different fracture points.

  Hmm, the real urgency here is practical judgment – they need tools to sort real cases, not win philosophy debates. I should flag where requirements conflict because that's where theories fail in practice. The "binding without reliance" and "intention over outcome" demands will likely clash – most theories sacrifice one for the other. 

  For structure, I'll build the desiderata as non-negotiable vs. preferable, pairing each with their cases. Key non-negotiables: obligation must survive forgetting (case 1), handle revoked consent (case 2), explain third-party binding (case 3). The "wrong outcome despite compliance" (case 4) might reveal a fatal flaw in outcome-based theories. 

  The death case (7) is particularly nasty – does obligation vanish or transfer? That'll murder theories requiring ongoing relationship. And corporate promises... ugh, that's where "intentionality" purists implode. Better note that upfront.

  Biggest troublemaker requirement? Probably "Binding Without Reliance" – it nukes harm-based theories but feels essential for forgotten promises. Also "Invariance of Content" (keep even if harmful) will make consequentialists scream. 

  For theory snapshots: Practice/convention views handle corporate promises but flunk forgotten ones. Expectation/harm theories ace reliance cases but fail when no harm occurs. Will-based accounts nail the release case but struggle with committee splits. Trust views soar with personal promises but choke on death/illegality. 

  Gotta emphasize the internal tensions – like how "No Retroactive Unbinding" (can't undo obligation by regretting) clashes with "Promisee Control" (release should work). That conflict is where real reporting gold lies. 

  Final touch: map which requirement kills the most theories. "Binding Without Reliance" is the serial killer – offs expectation, harm, and some trust views. Perfect for their "which requirement does most damage" ask.
answer: |-
  Here's the desiderata for any adequate account of promissory obligation, built from your cases and core puzzles. Requirements are ranked by non-negotiability (✓ = essential; ~ = contested but critical for your cases). Conflicts and "damage dealers" are flagged.

  **The Desiderata (Requirements List)**

  1.  **Binding Without Awareness/Reliance (✓ NON-NEGOTIABLE)**  
      *Case:* Forgotten promise (no harm, no memory, nothing rides on it).  
      *Requirement:* Must explain why breaking it is *still wrong*, even if "wrong to whom?" remains open (e.g., wrong *simpliciter*, to the promisee *qua* promisee, to the moral order).  
      *Knocks Out:* Pure reliance/harm/expectation-based views. They collapse here.

  2.  **Promisee Control Over Release (✓ NON-NEGOTIABLE)**  
      *Case:* Release ("forget it") with secret resentment.  
      *Requirement:* Must hold that a valid release *dissolves* the promisor's obligation *even if* the promisee secretly feels otherwise. Resentment becomes the promisee's problem/failing.  
      *Knocks Out:* Views where obligation is purely objective or based solely on promisor's self-commitment. Requires a *relational* aspect.

  3.  **Transferable/Obligating Agency (✓ NON-NEGOTIABLE)**  
      *Case:* Borrowed voice (parent for child, chatbot for company).  
      *Requirement:* Must define what kind of agent can *create an obligation for another* (requiring authority/representation) AND what kind of agent can *be bound* (requiring capacity to bear obligations/be represented). Must handle corporate/collective agency.  
      *Knocks Out:* Strictly individualistic, intention-focused views. Demands a social/institutional dimension.

  4.  **Invariance of Content (vs. Outcome) (~ CONTESTED BUT NECESSARY FOR YOUR CASE)**  
      *Case:* Kept technically, but outcome harms promisee ("wishing you'd broken it").  
      *Requirement:* Must hold that keeping the *specific promise* (content) is primary, even if outcome is bad. Breaking it due to foreseeing bad outcomes needs separate justification (e.g., supervening duty), not dissolving the obligation *ex ante*. Suggests obligation attaches to the *act promised*, not the *expected result*.  
      *Conflicts With:* Strongly consequentialist views. Favors deontological or practice-based views.

  5.  **Majority Doesn't Rule (Unless Defined) (~ CONTESTED BUT NECESSARY)**  
      *Case:* Committee of 5, 3 release you, 2 don't.  
      *Requirement:* Must specify how release works for collective promisees. Does the group act as one unit (requiring defined procedure for release)? Or can individuals release their *share*? Default answer can't be simple majority unless built into the original promise/institution.  
      *Conflicts With:* Overly simplistic individualistic views AND rigid collectivist views. Needs nuance on group agency.

  6.  **Susceptibility to Overriding Duties (✓ NON-NEGOTIABLE)**  
      *Case:* Promise becomes illegal/immoral.  
      *Requirement:* Must hold that such promises *cannot bind* or *are overridden*. A theory saying "you must keep *any* promise" is inadequate. Must explain *why* immorality/illegality voids it (e.g., conflicts with higher duty, invalidates the promise's moral foundation).  
      *Knocks Out:* Crude will-based theories or extreme conventionalism.

  7.  **Survival of Death (~ CONTESTED BUT NECESSARY)**  
      *Case:* Promisee dies before fulfillment.  
      *Requirement:* Must state if the obligation persists (e.g., now owed to estate, family, memory, or duty *simpliciter*) or dissolves. If it dissolves, explain *why* death matters when mere forgiveness doesn't (cf. Requirement 2).  
      *Conflicts With:* Views requiring an ongoing relational dynamic with the original promisee. Favors views where obligation is a created normative fact.

  **Key Conflicts (Internal Tensions):**

  *   **Requirement 1 (Binding w/o Awareness) vs. Requirement 2 (Promisee Control):** How can an obligation exist independently of *any* ongoing mental state (promisor or promisee - Forgotten Promise), yet be instantly dissolved by a single act of the promisee (Release)? This pressures theories to locate the obligation *outside* the current psychological states of the parties (e.g., in a past act, a normative fact, a social practice).
  *   **Requirement 4 (Invariance of Content) vs. Requirement 6 (Overriding Duties):** Emphasizing fidelity to the *exact words/act* (Invariance) struggles when fulfilling that *exact* act becomes harmful/immoral. Theories need a principled way to say "Keep the promise *as understood*... unless keeping it *as understood* violates X."

  **The "Damage Dealer" Requirement:**

  *   **Requirement 1 (Binding Without Awareness/Reliance)** does the most damage. It fundamentally rejects the core mechanism of **expectation/harm-based views** (it's wrong because you harm/disappoint). It also severely challenges **strong trust views** (no trust is *possible* if forgotten, yet obligation remains) and some **practice views** (if the practice relies on mutual expectations, it struggles here). It forces theories into murkier territory of past acts creating present duties or inherent normativity.

  **How Major Families Fare (Briefly vs. Requirements):**

  1.  **Practice/Convention (Scanlon, Humean views):**  
      *Strengths:* Handles 3 (Agency - defines roles), 5 (Committees - rules of practice), 6 (Illegal - practice has limits).  
      *Weaknesses:* Struggles **critically** with 1 (Why bind w/o reliance within the practice?). Can blur 4 (Is fidelity to the *practice* or the *content*?). May struggle with 2 (Is release defined by practice or morality?).

  2.  **Expectations/Harm (Utilitarian/Reliance views):**  
      *Strengths:* Explains 6 (Illegal - harm outweighs), maybe 7 (Death - no one *harmed*?), sometimes 4 (Bad outcome = harm).  
      *Weaknesses:* **Shattered** by 1 (No reliance/harm). Struggles with 2 (Release prevents harm? Or creates resentment-harm?). Weak on 3 (Agency - how does spokesperson create *harmful* expectations binding the company?).

  3.  **Will-Based/Self-Obligation (Kantian/Sartrean views):**  
      *Strengths:* Excels at 1 (Duty from past act of will), clear on 4 (Fidelity to commitment), often strong on 2 (Release removes the promisee's "claim," ending duty *to them*).  
      *Weaknesses:* Struggles **critically** with 3 (How can *my* will bind *another*? Spokesperson binds company?). Vulnerable on 6 (Why can't I will immorality? Needs external moral constraint). Fuzzy on 5 (Committee - whose will counts?) and 7 (Death - duty persists? To whom?).

  4.  **Trust/Relationship (Baier, relational views):**  
      *Strengths:* Excels at 2 (Release is part of trust dynamics), good on 3 (Agency - trust in representative/role), explains *why* 6 matters (Trust broken by immorality).  
      *Weaknesses:* **Shattered** by 1 (No possible trust if forgotten). Struggles with 7 (Death - relationship ended?). Can blur 4 (Does bad outcome inherently break trust, even if intent/promise kept?). Fuzzy on 5 (Committee - trust in the collective?).

  **The Takeaway:** No theory aces your entire list cleanly. Requirement 1 (Forgotten Promise) is the ultimate stress test, while Requirement 3 (Borrowed Voice) demands serious social ontology. The **core tension** is between obligation grounded in *past acts/commitments* (strong on 1, 4) and obligation grounded in *ongoing relationships/effects* (strong on 2, 6, trust). Your messy cases live in this tension. Look for theories that explicitly confront Requirement 1 and Requirement 3; how they fail there reveals their limits for your reporting. Theories that fudge Requirement 1 or hand-wave Requirement 3 won't serve your purpose.
