  Below is a complete, runnable plan for your "weird ideas" night. It's designed to maximize engagement, create the "itch" of the paradox, and fit within 90 minutes. I'll address your requirements step by step, including pitfalls and limitations.

  ---

  ### **Game Overview**
  - **Core Mechanism**: Players repeatedly choose envelopes, with variations that highlight different aspects of the paradox.
  - **Goal**: Make players *feel* the pull of the "always switch" argument before realizing it leads to contradictions.
  - **Key Insight**: The paradox arises from conflating two different probability spaces:
    1. **Fixed Pair Perspective**: Envelopes are correlated (one is double/half the other). Switching is neutral.
    2. **Isolated Amount Perspective**: After seeing amount $A$, players assume $2A$ and $A/2$ are equally likely. This is only true if the prior distribution of amounts is "impossible" (e.g., infinite or uniform in log space).

  ---

  ### **Materials List**
  1. **Envelopes**: 
     - 40+ identical envelopes (prevents wear/tear).
     - Pre-filled with paper slips showing amounts (not real money).  
     - **Amounts**: Use **base-3 doubling** to obscure extremes:  
       - Pairs: (3, 6), (6, 12), (12, 24), (24, 48), (48, 96).  
       - Make **6 copies** of each pair (total 30 pairs, 60 envelopes).  
       - Why base-3? It makes amounts less recognizable than powers of 2 (e.g., 3, 6, 12 feel "random"). This reduces players guessing the prior.
  2. **Tokens**: Small candies (e.g., M&M’s) to reward "wins" symbolically (1 candy per round won). *Avoid pennies*—trivializes the paradox.
  3. **Other**:
     - A deck box to shuffle envelope pairs.
     - Whiteboard to track round results.
     - Scorecards for players (optional).

  ---

  ### **Player Count & Roles**
  - **12–15 players**: Everyone participates in Rounds 1–2 and 4. For Round 3:
    - **Bankers**: 3 volunteers (rotate if needed). 
    - **Groups**: Split into 3 groups of 4–5 players. Each group has 1 banker.

  ---

  ### **Rounds & Rules**
  **Total Time**: 85 minutes (5-min buffer).  
  **Debrief** at the end ties everything together.

  #### **Round 1: Blind Swap** (15 min)
  - **Goal**: Show switching without information is neutral.
  - **Rules**:
    1. Each player draws **one unopened envelope** from a fresh pair.
    2. *Immediately* choose: **Keep** or **Swap** (no peeking!).
    3. Open envelopes. Record gains/losses on whiteboard:
       - "Gain": Ended with higher amount in pair.
       - "Loss": Ended with lower amount.
  - **Result**: Roughly 50% gain, 50% loss.  
  - **Script**: *"Notice how swapping is like flipping a coin—no advantage."*

  #### **Round 2: Swap After Seeing** (25 min)
  - **Goal**: Trigger the paradox. Players *feel* switching should help but see it doesn’t.
  - **Rules**:
    1. Each player draws **one envelope** from a fresh pair and **opens it**. Sees amount $A$.
    2. Say aloud: *"The other envelope is either $2A$ or $A/2$. Since both seem equally likely, the expected value of switching is $1.25A$—so you should always switch!"*
    3. **All players switch**.
    4. Open new envelopes. Record:
       - "Gain": Switched to higher amount.
       - "Loss": Switched to lower amount.
  - **Result**: ~50% gain, ~50% loss again.  
  - **Key Moment**: Point out the mismatch—*"The math said switching should help, but half of you lost! What’s wrong?"* (Don’t answer yet—let the itch build.)

  #### **Round 3: Banker’s Choice** (25 min)
  - **Goal**: Reveal how the "offer" itself can carry information. This kills the paradox.
  - **Rules**:
    - Split into 3 groups. Each has a banker and 4–5 players.
    - **Banker Role**: Knows amounts in both envelopes of each pair.
    - **Two Phases**:
      1. **Banker Forced to Offer**:  
         - Player opens envelope, sees $A$.  
         - Banker **must** offer a swap.  
         - Player chooses: **Swap** or **Keep**.  
      2. **Banker Chooses to Offer**:  
         - Player opens envelope, sees $A$.  
         - Banker **decides whether to offer a swap** (goal: minimize player winnings).  
         - If offered, player chooses: **Swap** or **Keep**.  
  - **Banker Strategy**: 
    - Offer swap **only if player has the higher amount** (so switching hurts them). 
    - Withhold swap **if player has the lower amount** (so they can’t gain).
  - **Player Experience**:
    - Forced phase: Players switch freely (paradox mindset).
    - Choice phase: Players realize offers are rare and suspect a trick. *"Why isn’t the banker offering? Is my amount low?"*
  - **Result**: In choice phase, players distrust the offer. Switching loses its appeal.

  #### **Round 4: Infinite Swap** (10 min)
  - **Goal**: Highlight the absurdity of "always switch."
  - **Rules**:
    1. Each player opens an envelope, sees $A$.
    2. **Swap** → see new amount $B$.
    3. **Offer swap again** (back to original envelope).
    4. Players can swap repeatedly (max 2–3 swaps due to time).
  - **Script**: *"If switching is always good, you should swap forever! But that’s irrational—why?"*  
  - **Result**: Players see that swapping back and forth is pointless (no net gain).

  ---

  ### **Debrief** (10 min)
  Map gameplay to the paradox. Use the whiteboard to contrast perspectives:

  | **Game Phase**       | **What Happened**                          | **Probability Space**                                  | **Why the Paradox Fails**                              |
  |----------------------|--------------------------------------------|--------------------------------------------------------|--------------------------------------------------------|
  | **Round 1 (Blind)**  | Switching neutral                          | Fixed pairs: Envelopes are correlated.                 | No info → no gain.                                     |
  | **Round 2 (Seeing)** | 50/50 gain/loss despite "1.25A math"       | Players assumed $2A$/$A/2$ equally likely **given $A$** | Prior amounts matter! For $A=3$, $A/2$ is impossible. |
  | **Round 3 (Banker)** | Banker’s choice made offers suspicious     | Offer = information. "Always offer" = no info.         | Paradox requires no info from the offer.              |
  | **Round 4 (Infinite)** | Swapping forever = pointless              | Expected value math ignores envelope correlation.      | If switching always helps, you’d pay to swap infinitely! |

  **Key Takeaways**:
  1. The "always switch" argument assumes $P(2A) = P(A/2)$ for **any $A$**, but this can’t hold for all $A$ in a real distribution (e.g., $A=3$ can’t have $A/2=1.5$ if 1.5 isn’t in your set).
  2. The paradox sneaks in by treating $A$ as a "fixed reference point," ignoring how $A$ was chosen (the prior distribution).
  3. Real-world takeaway: Conditional probabilities depend on context. Shifting perspectives mid-problem causes errors.

  ---

  ### **Pitfalls & Solutions**
  1. **Sharp Player Guesses the Prior**:
     - **Risk**: High. With a fixed pool, players might notice amounts are $3,6,12,24,48,96$ and infer $A=3$ or $A=96$ have no $A/2$ or $2A$.
     - **Solution**: 
       - Use **base-3 amounts** to obscure the doubling chain.
       - **Shuffle and redistribute envelopes** between rounds to prevent tracking.
       - **Emphasize secrecy**: *"The amounts come from a pool I won’t reveal—focus on the logic, not the numbers."*
     - **Why It’s OK**: The paradox’s "pull" relies on the *moment of seeing $A$*. Players still *feel* the intuition before doubting it.

  2. **"Math Is Wrong" Arguments**:
     - **Risk**: Players calculate expected values and insist switching *should* work.
     - **Solution**: 
       - Redirect to results: *"Let’s see what actually happened in Round 2—half of you lost!"* 
       - Save the deeper math for the debrief.

  3. **Refusal to Play (Trivial Prizes)**:
     - **Risk**: "It’s just candy? Lame."
     - **Solution**: Frame it as a *thought experiment*: *"The candies represent points. The real prize is cracking the puzzle!"*

  4. **Banker Phase Confusion**:
     - **Risk**: Bankers/players miss the strategy.
     - **Solution**: 
       - **Brief bankers privately**: *"Your goal is to minimize player wins. Offer swaps only when they have the higher amount."*
       - **Simplify**: Skip scorekeeping in Round 3. Focus on the "aha" of information.

  ---

  ### **What the Game Can’t Do**
  - **Reproduce the True Continuous Paradox**:  
    The paradox is deepest with an **improper prior** (e.g., amounts can be arbitrarily large). A fixed pool makes the prior guessable, which kills the "always equally likely" assumption.  
    - **Workaround**: Stress that the *intuition* is what matters. The game makes players *experience* the slide between probability spaces—even if the math is detectable later.

  ---

  ### **Confidence & Uncertainties**
  - **Overall Confidence**: **High** (90%). The structure forces engagement with the paradox’s stages. Rounds 2 and 3 will create the "itch."
  - **Least Confident Point**: **Round 3 (Banker’s Choice)**.  
    - Why: Players might not grasp how the banker’s strategy injects information. If bankers bungle the strategy, the point gets lost.  
    - Mitigation: Keep banker groups small (4–5 players). Demo one round yourself first.

