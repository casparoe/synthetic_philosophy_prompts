prompt: |-
  Agricultural extension services and pesticide regulators the world over advise growers to spray only when a pest population crosses an "economic threshold", and the risk assessments that license a product are typically written in terms of effects on the honeybee colony rather than on individual insects, while animal-welfare law has by and large left invertebrates outside its protection. Treat that cluster of practices as a single object of philosophical scrutiny. What view of the moral status of insects, and what view of the proper unit of moral concern — the individual organism, the population, the colony, the species, the ecosystem — does it presuppose? Which rival views does it quietly rule out, and are its parts consistent with one another, given that the same regulatory system takes considerable trouble to protect honeybee colonies and, here and there, individual vertebrates? Distinguish what the practices strictly presuppose from what they merely fit well with, and say where they are philosophically underdetermined. Then say what would have to change — in the thresholds, in the endpoints, in the legal categories — if the presupposed view were replaced by a sentience-based individualist one. Please answer in British English.
