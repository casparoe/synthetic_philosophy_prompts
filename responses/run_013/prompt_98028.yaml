answer: |-
  Here's a breakdown of "Revolutions devour their children" as applied to the French Revolution, dissected into precise readings, their plausibility, required mechanisms, and relevance to your classmate's argument:

  **I. Deconstructing the Metaphor:**

  1.  **What is "Devouring"? (The Action)**
      *   **D1: Literal Killing/Elimination:** The physical execution or assassination of revolutionary leaders by the revolutionary regime itself (e.g., Danton, Desmoulins, Hébert, Robespierre executed by the Revolutionary Tribunal).
      *   **D2: Political Marginalization/Discrediting:** The removal of revolutionary leaders or factions from power, rendering them politically irrelevant or branding them as traitors/counter-revolutionaries (e.g., Girondins purged by the Mountain, Robespierre overthrown by the Thermidorians).
      *   **D3: Ideological Absorption/Moderation:** The process where the initial radical goals and energy of the revolution are absorbed, diluted, or institutionalized into a more moderate, stable, and often less revolutionary order (e.g., transition from the Republic of Virtue to the Directory to the Napoleonic Empire).
      *   **D4: Destruction of Revolutionary Institutions/Ideals:** The revolution ultimately destroys the very structures and principles it initially created in its most radical phase (e.g., the Terror undermining Liberty & Fraternity; the Directory & Empire burying aspects of radical republicanism).

  2.  **Who are the "Children"? (The Object)**
      *   **C1: Individual Revolutionary Leaders:** The specific people who rose to prominence leading the revolution (e.g., Mirabeau, Danton, Robespierre, Saint-Just).
      *   **C2: The Revolutionary Generation/Faction:** The cohort of activists, politicians, and ideologues who drove the revolution forward in a specific phase (e.g., the Enragés, the Hébertists, the Jacobins under Robespierre, the Girondins).
      *   **C3: Revolutionary Institutions/Factions:** The organizations and political groups spawned by the revolution itself (e.g., the Jacobin Club, the Committee of Public Safety, the Sections, the National Guard in its radical phase).
      *   **C4: Successor Movements/Ideals:** The radical principles or potential future revolutionary movements inheriting the revolution's legacy (e.g., Babeuf's Conspiracy of Equals claiming the mantle of true revolution against the Directory).

  3.  **Scope & Modality:**
      *   **S1: Universal Law:** This *always* happens to *all* genuine revolutions.
      *   **S2: Specific to the French Revolution:** This is a defining characteristic of *this particular* revolution.
      *   **S3: Specific to a Phase (e.g., Terror):** This is characteristic of the radical phase (like the Terror) within *this* revolution.
      *   **M1: Inevitable:** Devouring is an unavoidable consequence of the revolutionary process itself.
      *   **M2: Frequent/Probable:** Devouring is a common, highly likely outcome, but not strictly guaranteed in every case.

  **II. Candidate Readings, Assessment, & Required Mechanisms:**

  Combining these elements yields distinct interpretations:

  1.  **Reading 1: Literal Elimination of Leaders (D1 + C1 + S2/S3 + M1/M2)**
      *   **Claim:** The French Revolution inevitably/frequently executed its own most prominent leaders (e.g., Danton, Robespierre).
      *   **Assessment:** **Substantive but Narrow.** Undeniably true for specific leaders during the Terror (S3). More debatable as an *inevitable* law for *all* leaders or the *entire* revolution (S2/M1).
      *   **Required Mechanism(s):**
          *   **Structural Power Vacuum:** Collapse of old legitimacy creates intense struggle for power within the revolutionary coalition.
          *   **Ideological Purity/Radicalization:** Leaders are consumed by the escalating logic of unmasking "enemies" and maintaining revolutionary virtue/purity. Yesterday's hero is today's traitor.
          *   **Selection Effect:** The skills/temperament needed for overthrow (radicalism, ruthlessness, charisma) become liabilities for stabilization, making these leaders targets for rivals or a populace weary of crisis.
      *   **Plausibility for Classmate:** High. This is the most common, visceral understanding.

  2.  **Reading 2: Factional Displacement (D2 + C2/C3 + S2 + M1/M2)**
      *   **Claim:** The French Revolution inevitably/frequently marginalized and destroyed the factions and political groups that were dominant in earlier phases (e.g., Girondins displaced by Montagnards, Hébertists & Dantonists purged by Robespierre, Robespierrists overthrown by Thermidorians).
      *   **Assessment:** **Highly Substantive.** Strongly evidenced throughout the Revolution. Captures the dynamic shifts in power.
      *   **Required Mechanism(s):**
          *   **Coalition Fragmentation (Near-Tautology):** The diverse coalition that unites against the old regime inevitably fractures over the goals and methods of the new order.
          *   **Radicalization Effect:** Success requires outbidding rivals, shifting the "center" leftward, making yesterday's radicals today's moderates/victims.
          *   **Structural Power Vacuum:** Lack of settled institutions forces reliance on unstable factional dominance.
          *   **Ideological Purity:** Factions accuse rivals of betraying the revolution's true spirit.
      *   **Plausibility for Classmate:** Very High. This captures the political process beyond just killings.

  3.  **Reading 3: Absorption into Moderation (D3 + C2/C4 + S2 + M1/M2)**
      *   **Claim:** The French Revolution inevitably/frequently consumed its own radical energy and ideals, absorbing them into a more conservative, stable, and less revolutionary settlement (e.g., Thermidor, Directory, Napoleonic Empire burying aspects of radical republicanism and egalitarianism).
      *   **Assessment:** **Substantive.** Well-supported by the trajectory from 1789 to 1799/1804. Explains the "end point."
      *   **Required Mechanism(s):**
          *   **Structural Realities:** Exhaustion, war, economic crisis, and the need for functional administration create pressure for stability over radical change.
          *   **Coalition Widening:** Maintaining power requires appealing beyond the radical core to the "swamp" of the bourgeoisie or peasantry with more conservative interests.
          *   **Institutionalization:** Revolutionary charisma and mobilization must give way to routinized authority, diluting radical ideals.
          *   **Psychological Tempermant:** Revolutionaries skilled at destruction may lack the skills/patience for stable construction.
      *   **Plausibility for Classmate:** Moderate. Often implied, less commonly articulated in the "devouring" metaphor.

  4.  **Reading 4: Destruction of Revolutionary Creations (D4 + C3 + S2 + M1/M2)**
      *   **Claim:** The French Revolution inevitably/frequently destroyed the very institutions and ideals it generated in its radical fervor (e.g., the Terror undermining the Rights of Man; the Republic devolving into Empire).
      *   **Assessment:** **Debatable/Substantive.** True for some institutions/ideals (e.g., radical direct democracy of the Sections, aspects of the Cult of the Supreme Being). Less true for others (e.g., abolition of feudalism, secularization, concept of citizenship). Arguably *transformed* rather than purely *destroyed*.
      *   **Required Mechanism(s):**
          *   **Ideological Overreach:** Radical ideals prove impossible to implement fully or create backlash/unintended consequences.
          *   **Structural Instability:** Institutions born in crisis (like the CPS) are ill-suited for peacetime governance and become tools of tyranny or are dismantled.
          *   **Absorption (D3):** Destruction is part of the absorption process into a moderate settlement.
      *   **Plausibility for Classmate:** Lower. This is a more abstract or Hegelian reading of the metaphor.

  **III. Universal Law Claim (S1 + M1 applied to any D+C combination)**

  *   **Claim:** *All* revolutions *inevitably* devour their children in one or more of the above ways.
  *   **Assessment:** **Overly Broad & Questionable.** While frequent, some revolutions avoid intense internal purges (e.g., Glorious Revolution 1688) or achieve relative stability without completely inverting initial radicalism (debatably, the American Revolution, though it had elements of factionalism). **Not a Platitude** – it's a strong historical generalization requiring significant qualification. **Not False**, but **Not Inevitable**.
  *   **Required Mechanism(s):** Would require demonstrating that *all* the mechanisms listed above (power vacuum, radicalization, ideological purity, coalition fragmentation, exhaustion) operate with overwhelming force in *every* revolutionary situation, which is unlikely.

  **IV. Answering Your Questions:**

  1.  **What your classmate most plausibly had in mind:** Likely **Reading 1 (Literal Elimination of Leaders - D1+C1)** or **Reading 2 (Factional Displacement - D2+C2/C3)**, combined with **Scope S2/S3 (French Rev/Terror)** and **Modality M2 (Frequent/Probable)**. The phrase "turned on its own leaders" points strongly to individuals or factions being destroyed by the revolution they made.

  2.  **Which reading does the work (making it non-contingent, relevant to class/ideology/contingency):** **Reading 2 (Factional Displacement)** is the strongest candidate.
      *   **Why:** It moves beyond specific killings (which *could* be seen as personal rivalries/accidents) to highlight a *pattern* of factional struggle and overthrow inherent in the revolutionary process. This pattern can be directly linked to:
          *   **Structural Explanations:** The power vacuum and lack of legitimate authority create inherent instability favoring factional conflict.
          *   **Ideological Explanations:** The logic of revolutionary purity and the dynamic of radicalization drive the process of unmasking and eliminating "deviants."
          *   **Class Struggle (within the revolution):** Factional conflicts often reflected clashes between different bourgeois groups (Girondins vs. Montagnards) or between bourgeois radicals and popular/sans-culotte demands.
      *   It presents the "devouring" not as random accidents, but as a consequence of the revolutionary situation itself, driven by structural pressures and ideological dynamics.

  3.  **Combination for Maximum Effect:** **Reading 2 (Factional Displacement)** provides the core dynamic. **Reading 3 (Absorption into Moderation)** explains the ultimate outcome *towards which* the factional struggles often contributed (e.g., Thermidor ending the Terror, paving the way for the Directory). Reading 1 (Literal Killing) is often the *means* by which Reading 2 operates during intense phases.

  4.  **Reading a defender of contingency must resist:** A defender of contingency would most vigorously challenge any claim implying **Inevitability (M1)**, especially when paired with **Scope S1 (Universal Law)** or strong **S2 (Specific Inevitability for France)**. They would focus on:
      *   **Reading 2 (Factional Displacement) with Modality M1:** They'd argue the specific outcomes of factional struggles (e.g., Robespierre's fall on 9 Thermidor) depended heavily on individual decisions, missteps, alliances of convenience, rumors, and sheer luck, *not* an inevitable logic. The *fact* of factionalism might be likely, but *who wins and who gets devoured* is contingent.
      *   They would also resist mechanisms presented as deterministic, particularly **Ideological Purity** and **Radicalization Effect**, arguing that the intensity and direction of these dynamics were shaped by contingent events (military defeats, harvest failures, specific speeches or pamphlets). They would emphasize that the revolution had multiple potential paths at many junctures.

  **In Summary:** Your classmate likely invoked the visceral image of the Revolution killing its leaders (Reading 1). However, the version that best makes the internal dynamics seem non-accidental and relevant to broader explanations (structure, ideology, class) is **Reading 2: The French Revolution frequently displaced and destroyed the dominant factions of its earlier phases due to structural instability, coalition fragmentation, and ideological radicalization.** A defender of contingency must argue that while factionalism existed, the *specific outcomes* of these struggles were highly contingent, resisting claims of inevitability tied to this reading.
