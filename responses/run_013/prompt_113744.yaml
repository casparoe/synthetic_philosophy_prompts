answer: |-
  ## Joint Statement: Epistemic vs. Metasemantic Interpretations of Two-Dimensional Semantics  
  **Participants:**  
  - **Dr. E. Piste (Epistemic Camp):** "The diagonal represents genuine epistemic possibilities accessible via conceivability; it grounds a robust notion of a priori knowability central to philosophy of mind and epistemology."  
  - **Dr. M. Sema (Metasemantic Camp):** "The diagonal is a byproduct of how context fixes reference; it tracks semantic stability, not epistemic access. A priority is a distinct, often linguistic, phenomenon."  

  ### 1. Agreed Claims  
  Both parties endorse the following formal and functional core of two-dimensional semantics:  

  1.  **Formalism:**  
      -   Expressions possess a **character** (a function from contexts of utterance to contents) and a **content** (a function from possible worlds to extensions).  
      -   **Contexts** (C) are tuples including agent, time, location, and world (the world as actual, setting reference).  
      -   **Circumstances of Evaluation** (W) are possible worlds (the world as counterfactual, determining truth).  
      -   The **Primary Intension** (Diagonal) is the function from a context-world pair <c, w> to the extension of the expression *when w is considered as actual* (i.e., fixing reference as it would be fixed in w).  
      -   The **Secondary Intension** (Horizontal) is the function from a world w to the extension of the expression *once reference is fixed in the actual context* (c*), holding character fixed.  

  2.  **Puzzles Addressed:**  
      -   The framework systematically handles:  
          (i) The **contingent a priori** (e.g., "Stick S is one metre long" at t0): Knowable a priori (via stipulation in c*), but contingent (could be false in w).  
          (ii) The **necessary a posteriori** (e.g., "Water is H₂O"): Necessary truth (true in all w), but knowable only a posteriori (requires empirical discovery of reference-fixing in c*).  
          (iii) **Substitution failures in attitude reports** (e.g., "Lois believes Superman flies" vs. "Lois believes Clark Kent flies"): Explained by differences in primary intension (cognitive significance) despite identical secondary intension (reference).  

  3.  **Success Conditions:**  
      -   The epistemic interpretation succeeds if it demonstrably provides the best account of *epistemic modality*, *conceivability-possibility links*, and *a priori knowledge*.  
      -   The metasemantic interpretation succeeds if it demonstrably provides the most elegant, non-redundant account of *reference fixing*, *semantic stability across contexts*, and the *puzzles* above, *without* committing to strong epistemic theses.  
      -   Empirical evidence from *linguistics* (e.g., patterns of use, presupposition projection) and *cognitive science* (e.g., concept acquisition, rationality constraints) is relevant to adjudicating these claims.  

  ### 2. Disagreements Table  

  | Point of Disagreement             | Epistemic View (E. Piste)                                                                 | Metasemantic View (M. Sema)                                                                 | Genuine or Verbal?                                         |  
  | :-------------------------------- | :---------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------ | :--------------------------------------------------------- |  
  | **Nature of the Diagonal (Primary Intension)** | Represents *epistemic possibilities*: ways the actual world might turn out to be, constrained by conceivability. | Represents *scenarios for reference-fixing*: ways the context (especially world parameter) could fix reference. | **Genuine**: Deep disagreement about modal metaphysics and epistemology. |  
  | **Role of A Priority**            | Primary intension delivers *a priori* knowable truths (given grasp of meaning/concepts). | "A priority" primarily characterises *linguistic/stipulative knowledge* involved in reference-fixing, not a distinct epistemic faculty revealed by 2DS. | **Partly Verbal/Partly Genuine**: Disagreement stems partly from different definitions of "a priori" (see below). Also genuine disagreement about whether 2DS *explains* apriority. |  
  | **Definition of "A Priori"**      | A proposition is a priori if it can be known *independently of empirical experience*, via reasoning/conceiving alone; 2DS helps *analyse* this. | "A priori" often used loosely; strictly, it means knowable *solely in virtue of linguistic competence/stipulation* (e.g., knowing "Hesperus is Phosphorus" is false *if* the names rigidly designate different objects). | **Primarily Verbal**: Camp Sema uses "a priori" narrowly for immediate linguistic/stipulative consequences. Camp Piste uses it broadly for non-empirical justification. **This difference fuels much confusion.** |  
  | **Work Done by Conceivability**   | Conceivability is a (fallible) guide to the space of epistemic possibilities (the diagonal). | Conceivability is largely irrelevant or derivative; it tracks coherence with semantic rules/stipulations, not a fundamental epistemic space. | **Genuine**: Core disagreement about the epistemic significance of conceivability. |  
  | **Fundamental Purpose of 2DS**    | Primarily an *epistemic* framework for understanding cognitive significance, modality, and knowledge. | Primarily a *semantic* framework for understanding reference determination and linguistic phenomena like the puzzles. | **Genuine**: Disagreement about the primary explanatory target. |  

  ### 3. Cruxes: Predictions and Evidence  

  *   **(a) Twin Causes ("TwinCause"):**  
      -   *Setup:* Scientists introduce "TwinCause" (TC) via the description "the substance causing observable effect E". Later, E is found to have two distinct, unrelated causes (S1 & S2), no underlying unity.  
      -   **Agreed Bearing:** How does TC refer? What was known/stipulated? Was belief "There is one cause" empirical or a priori?  
      -   **Epistemic Prediction (Piste):** Primary intension of "TC" picks out *whatever uniquely causes E* in a world considered as actual. In c*, it fails to refer determinately (no unique cause). Introducers knew *a priori* (via grasp of concept/stipulation) that *if* TC exists, it causes E, but belief "There is one cause" was an *empirical, defeasible presupposition*, not known a priori. Diagonal reflects this epistemic possibility space.  
      -   **Metasemantic Prediction (Sema):** Character of "TC" fixes reference via description in context. In c*, the description fails to pick out a unique referent due to presupposition failure ("there is a unique cause"). Belief "There is one cause" was part of the *stipulative context*, a presupposition for the term's introduction, knowable a priori *only* in the narrow sense of being constitutive of the term's attempted introduction. Diagonal shows scenarios where the presupposition holds and reference is fixed.  
      -   *Key Difference:* Piste sees introspective/conceivable doubt about "one cause" as epistemic; Sema sees it as revealing the semantic presupposition built into the term.  

  *   **(b) Empty Term ("Phlogiston"):**  
      -   *Setup:* "Phlogiston" introduced as "the substance released in combustion". Combustion involves oxidation (release), not intake.  
      -   **Agreed Bearing:** What is the primary intension? What did users "know" a priori? How does the framework handle massive reference failure?  
      -   **Epistemic Prediction (Piste):** Primary intension picks out *the substance released in combustion* in w considered as actual. In c*, it picks out nothing. Users mistakenly believed *a priori* (via concept) that combustion involved release. Diagonal captures conceivable worlds where combustion *does* involve release.  
      -   **Metasemantic Prediction (Sema):** Character fixes reference via description in context. The description fails in c* (nothing satisfies it). The "a priori" knowledge is the stipulative link: "'Phlogiston' names the substance released in combustion". Belief that combustion involves release was an *empirical presupposition* of the context, not part of the a priori stipulation *per se*. Diagonal shows worlds where the description succeeds in fixing reference.  
      -   *Key Difference:* Piste views the false belief as (partly) constitutive of the concept/a priori; Sema views it as an empirical presupposition enabling the (failed) semantic act.  

  *   **(c) Unproved Theorem ("Theorem T"):**  
      -   *Setup:* Theorem T is true (provable in principle) but requires a 1000-page proof. No one has proved or conceived the proof yet.  
      -   **Agreed Bearing:** Is T a priori knowable? Does the diagonal intension for "T is true" care about this?  
      -   **Epistemic Prediction (Piste):** T is a priori knowable *in principle* because its truth depends only on mathematical structure, accessible via ideal reasoning. The primary intension of "T is true" is necessary (true in all w considered as actual where maths holds). Conceivability *that ¬T* would indicate genuine epistemic possibility (contradiction).  
      -   **Metasemantic Prediction (Sema):** "A priority" (in the broad sense) is irrelevant here. The character of "T" fixes its content (a mathematical proposition) based on the linguistic rules of mathematics. Its secondary intension is necessary. The diagonal is trivial: in every context-world <c, w>, "T is true" is true if T is true in w (which it is, necessarily, if maths holds). The framework doesn't model epistemic accessibility, only semantic value determination.  
      -   *Key Difference:* Piste sees the diagonal as constrained by epistemic possibility (ruling out inconceivable worlds); Sema sees it as tracking semantic rules regardless of epistemic access. The unprovability *for us now* is irrelevant to the semantic values.  

  ### Are the Interpretations Rivals or Complementary Tools?

  **Both, but primarily rivals.** The machinery is formally identical – both camps use contexts, worlds, character, content, and the diagonal. **However, they propose fundamentally different *explanatory roles* for the diagonal and, consequently, the *point* of the entire framework.**

  *   **Complementary Aspects:** The framework *can* be used descriptively by both to model the agreed puzzles. The metasemantic reading efficiently explains semantic phenomena (reference fixing, necessity a posteriori) without epistemic commitments. The epistemic reading leverages the formalism for distinct epistemological projects (conceivability arguments, explaining cognitive significance).
  *   **Rivalry:** The core contention is whether the diagonal fundamentally *represents an epistemic space* (Piste) or is *solely a semantic value derived from reference-fixing rules* (Sema). This leads to conflicting interpretations of key cases (like the cruxes) and divergent views on the significance of conceivability, the nature of a priority, and the ultimate purpose of two-dimensional semantics. **They offer competing accounts of *what the machinery is doing* at a foundational level.** Resolving this requires determining which account better explains linguistic behaviour, cognitive phenomena, and our grasp of modality – a substantive philosophical disagreement.

  This statement reflects our current understanding and the specific points where dialogue must focus to resolve the impasse. We commit to testing our views against the agreed cruxes and evidence.  

  ---  
  **Signed,**  
  Dr. E. Piste  
  Dr. M. Sema
