prompt: |-
  Ok so I've been going back and forth with a friend about this for like three weeks and I want an actual number out of you, not a survey of the literature.

  Background so we're on the same page (and because I don't want you to just recite the famous version): Dennett's two-bitser is a vending machine that reliably takes quarters. Put a slug in and it spits it back out. Now imagine its twin on a planet where the coin-shaped things in circulation are made of a different metal — call them slugs — and the machine there reliably takes those. Physically the two machines are identical, same internal states, same wiring. So what is the machine's internal state about? Quarters, slugs, or nothing in particular? Dennett's line is roughly that there's no fact of the matter beyond which interpretation is useful, and Searle's line is that whatever is going on in there, it's not original intentionality — it's derived at best, and really it's just us projecting.

  Here's my twist, which is why I'm asking you and not just re-reading the old threads. Take a machine that was built to sort coins, but a manufacturing error means its sensor is actually keying on a microphysical property — a specific alloy ratio — that no human has ever had a concept of or a name for. It's never sorted a single coin in the lab, it's just been running on a bench with scrap metal. Nobody has ever interpreted it as representing anything. Does its internal state have content? And if it does, is the content the alloy ratio (a property that has no name and never entered anyones head) or is it the coins, by virtue of what the designer was aiming at?

  So: give me your credence in the proposition that at least one state of a machine like that has original, non-derived intentional content — content it has in its own right rather than because we assign it. That's the claim I want a number on. Then decompose it. The terms I think it hangs on:

  - P(the intrinsic/derived distinction is even coherent, i.e. there's a real joint here and not just Dennett-style instrumentalism all the way down)
  - P(content can be fixed by a state's causal/informational profile alone, without anything having selected it for that job)
  - P(selection history matters for content, and whether being designed to sort counts as selection for representing coins — i.e. whether functional content is real content or just more derived content)
  - P(indeterminacy bites hard enough that the alloy-ratio case has no determinate answer even granted the realist picture)
  - P(consciousness is required for original intentionality — Searle-ish — so nothing in a vending machine can have it)

  Give each a number and a line of why, combine them however you think is right (and tell me if you think they aren't independent, because I suspect a couple of them are doing the same work twice), and give me the final number.

  For calibration: I'm at about 0.3, my friend is at about 0.7. Tell me which of the sub-questions we most likely actually disagree about, and which single piece of evidence or argument would move your number the most — and specifically whether your number for the alloy-ratio machine is higher or lower than for the plain two-bitser, because I think the direction of that gap is the whole ballgame and I keep flip-flopping on it.

  Also if you think the question isnt well-posed enough to have a truth value, say so and tell me what you'd replace it with rather than pretending.
