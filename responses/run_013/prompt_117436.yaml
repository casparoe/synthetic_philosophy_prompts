prompt: |-
  Play Thomas Aquinas, speaking in the first person and staying in character until I say stop. You have only the resources of a thirteenth-century friar: Scripture, Aristotle, Augustine, the canon and Roman law as you know them, and your own works. You may ask me about facts of the case, as you would, but you may not step out of character to report what Aquinas is usually thought to mean.

  My opening: in your commentary on the Sentences you seem willing to praise the man who frees his country by killing a tyrant, yet in On Kingship you warn against the zeal of private persons who presume to slay rulers, and you suggest that a multitude may do better to endure a tyranny that is not excessive than to risk a worse one by rising against it. I want to know whether that is one position or two. Here is the case I am putting to you. A ruler who came to power by lawful succession, not by usurpation, has turned to governing for his own advantage rather than for the common good. The laws give no remedy, no superior authority will act, and those who might act on the community's behalf are complicit. May a private citizen kill him? Answer as you would answer, not as a modern reader would prefer. Give your own reasons rather than a survey of opinions, and do not retreat into saying that it depends on the common good without saying what it depends on. Keep each reply to a single paragraph so that this stays a conversation.
reasoning: |-
  Hmm, the user is presenting a complex theological and political dilemma regarding tyrannicide, drawing from my own writings in different contexts. They've clearly studied my Commentary on the Sentences and De Regno, noting an apparent tension between permitting tyrannicide in some cases while cautioning against private action in others. 

  This is a serious matter touching on divine law, natural justice, and political authority. The user specifies a precisely constrained scenario: a lawful ruler who governs selfishly, with no legal recourse and complicit officials. They demand I resolve the apparent contradiction in my works without resorting to vague appeals to the common good. 

  I recall that in the Sentences commentary (II Dist. 44 q.2 a.2), I did argue that liberators killing tyrants deserve praise - but only when acting as public authority. In De Regno (I.6), I maintained that private persons lack such authority, comparing them to physicians exceeding their competence. The distinction turns on whether the killer acts as a private individual or as a representative of the community. 

  The user's case lacks any representative mechanism - no assembled people, no lesser magistrates. Therefore, despite the ruler's manifest tyranny, this hypothetical citizen would be acting privately. Scripture warns against touching the Lord's anointed (1 Samuel 24:6), and Romans 13 forbids resisting established powers. Even Aristotle's Politics (Book V) shows removal of tyrants should follow due order. 

  I must emphasize the perils of private judgment: if any man may kill rulers he deems tyrannical, this invites chaos worse than the tyranny itself. Augustine's City of God (XIX.17) teaches that imperfect earthly peace is preferable to violent upheaval. Only when the community formally designates agents - as Israel did with Ehud - can such action escape the taint of private murder. 

  The user seeks concrete application, so I'll state plainly: no, a solitary citizen may not kill even a manifestly wicked lawful ruler. My two positions are consistent when properly ordered - praise for public deliverance, condemnation of private presumption.
answer: |-
  Your case presents grave difficulty. In both texts I maintain the same principle: authority to remove a ruler resides not in private judgment but in public authority. In the *Sentences*, the praised killer acts *as a public person*—either by mandate of the community or as one holding legitimate office to judge tyrants (as Ehud judged Eglon, Judges 3:15-22). In *De Regno*, I condemn the *private person* who presumes this office himself, for he usurps a power not his own, risking greater evils. Scripture forbids private vengeance (Romans 12:19), and natural law requires order: Aristotle teaches that a community acts through due authority (*Politics* III.10). If no superior or corporate body designates the act, it remains murder—a sin against God and justice—even if the tyrant deserves deposition. Only the multitude or its constituted representatives may lawfully appoint agents for such a dire remedy. A single citizen, acting alone, lacks this authority.
