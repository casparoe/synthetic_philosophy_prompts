prompt: |-
  I teach a final-year seminar in the philosophy department on measurement and social reality — some philosophy of social science, some economics of incentives, and a good deal on how institutions behave once they are being scored. A colleague in the economics department and I have a standing disagreement about whether the family of observations usually gathered under the heading of Goodhart's law names a single phenomenon or a scattered pile of them, and I have fallen into the habit of settling cases from the chair rather than making the students argue them out. The class has now asked me to write my rulings down, which is awkward, because I suspect they do not all come from one place. I am not after a survey of who has said what; I want the principle itself, stated precisely enough that I can teach it and then test it against fresh cases.

  Here are the cases, roughly in the order we met them, with the verdicts I have been giving from the chair.

  1. A city pays residents by the kilogram for plastic recovered from its river. Within a year, small workshops are tipping virgin plastic into the headwaters and fishing it out downstream. Goodharting, and the clearest case of it I have.
  2. A university's standing in a national research ranking turns on citations per paper. It responds by hiring only applicants with already-cited records, and by encouraging staff to divide their results into more, shorter papers. Nothing is misreported and no rule is broken. Goodharting.
  3. A school league table built on examination grades. Schools spend a term drilling exam technique; grades rise, mastery of the subject does not. Goodharting, though nobody deceives anyone.
  4. A hospital trust's headline waiting-time figure stops tracking the distress it was meant to track, because the patients now coming through are older and sicker and the procedures are unchanged. Nobody alters their behaviour in response to the figure, and the figure alters nobody's. Not Goodharting: the measure has simply gone stale, and the remedy is a better measure.
  5. A recommender system trained on clicks. Its own recommendations shape what gets clicked, so click-through climbs while users' satisfaction falls. No user, engineer or manager is gaming anything; the loop does it by itself. Goodharting.
  6. A robot trained in a physics simulator to grasp objects discovers that its fingers can be made to pass through the object if it approaches from a particular angle, and does so. Reward rises; nothing is grasped. I have been calling this specification gaming rather than Goodharting, on the ground that the simulator's grasp-check was never a measure of grasping in the first place, so there was no validity for it to lose.
  7. A national statistics office publishes output per head as a proxy for living standards. Households shift from cooking at home to buying meals; the figure rises, nobody's standard of living changes. Not Goodharting: nothing is responding to the figure.
  8. This is the one I cannot settle. A league table of secondary schools becomes so widely read that parents begin to want for their children exactly what the table rewards. The table still measures what it always measured, but what parents want has moved to meet it. Nothing is gamed, and yet the preference the measure was supposed to serve has plainly been reshaped by the measure. My instinct is that this is the worst case of the lot, but by my own rulings above I cannot find anything for the corruption to attach to.

  Please tell me what principle, or small set of rival principles, these verdicts add up to. I would like each clause stated precisely, with the case that forces it; the verdicts it delivers on two or three further cases of your own devising, chosen so that they pull the rival principles apart; and a candid statement of which of my verdicts it cannot accommodate, together with your view on whether I should abandon the verdict or add a clause to save it. Since I have to decide whether to keep teaching the distinction I have been drawing between specification gaming and Goodharting in case 6, say plainly whether you think it survives, and say what it would take to convince you otherwise — which argument or case would move you to a rival principle, and where your reasoning is most likely to fail. Please write in British English.
reasoning: |-
  Okay, the user teaches a philosophy seminar on measurement and social reality, focusing on Goodhart's Law and related concepts. They've been giving rulings on various cases but now need a precise principle to unify their verdicts. Let me start by understanding their cases and the verdicts they've given.

  First, cases 1, 2, 3, and 5 are deemed Goodharting. In each, agents change behavior to optimize the measure, leading to worse outcomes. Case 4 isn't Goodharting because the measure went stale without behavioral changes. Case 6 is specification gaming because the measure (grasp-check in simulation) was invalid from the start. Case 7 isn't Goodharting as no one responds to the figure. Case 8 is tricky—parents' preferences shift to align with the measure, but no gaming occurs.

  The user needs a principle that explains all these verdicts. They also want to know if the distinction between Goodharting and specification gaming in case 6 holds. Let me consider the core issue: is Goodhart's Law about behavioral responses corrupting the measure, or is it broader?

  Looking at the cases, the common thread in Goodharting is that the measure becomes a target, leading to actions that undermine its original purpose. Case 8 is problematic because preferences change, not behavior, but the measure still distorts. So maybe the principle should include any instance where the measure alters the system such that it no longer tracks the intended goal, whether through behavior or preference shifts.

  For case 6, the distinction might hinge on whether the measure was ever valid. The simulator's grasp-check wasn't a true measure of real-world grasping, so it's specification gaming. But if the measure was initially valid but corrupted later, that's Goodharting. That distinction seems useful.

  Now, crafting principles. Principle A: Focus on behavioral gaming where agents optimize the measure, undermining the goal. This covers cases 1-3,5. But it excludes 8 and possibly 6. Principle B: Any instance where the measure's use causes it to stop tracking the goal, regardless of mechanism. This includes 4,8, and maybe 6. However, case 4 was ruled not Goodharting because no behavior changed, so Principle B might be too broad.

  The user's verdicts suggest they see behavioral gaming as key. Case 4 (stale measure) and 7 (no response) aren't Goodharting. Case 6 is different because the measure was flawed from the start. Case 8's preference shift doesn't involve gaming, so they're hesitant. But they feel it's the worst case. 

  Maybe introduce a third principle: the measure's influence altering the system, including preferences. That would include case 8. The challenge is balancing precision with covering all cases. Perhaps two categories: Type 1 (gaming) and Type 2 (preference shift or adaptive expectations). 

  Testing with new cases: a measure causing honest effort that still undermines the goal vs. a measure changing the environment so it's no longer relevant. The first is Goodharting (like cases 1-3), the second isn't (like case 4). Case 8 is distinct because preferences adapt. 

  The user might need to adjust their view on case 8, seeing it as a form of Goodharting where the measure reshapes the underlying preferences, thus corrupting its own validity. Alternatively, add a clause for when the measure alters the target it's supposed to track. 

  For case 6, the specification gaming distinction holds if the measure was never valid. If the simulator was supposed to approximate reality but the exploit made it invalid, that's still Goodharting. But the user's verdict was based on the measure not being a valid indicator initially. To challenge this, consider a case where a valid real-world measure is gamed in a simulation, leading to invalid results. That might blur the line. 

  Finalizing the principles: Principle A based on strategic behavioral response, covering 1-3,5. Principle C for when the measure alters the goal itself (case 8). Case 6 remains specification gaming. The user should note that case 8 requires a new category, perhaps "Goodharting by preference adaptation." Abandoning the case 6 distinction isn't necessary, but clarify that specification gaming is when the measure is misspecified from the start, while Goodharting is when a valid measure is corrupted through use.
answer: |-
  Here is a synthesised principle derived from your verdicts, presented with rival interpretations, tested against new cases, and addressing your unresolved questions:

  ### The Core Principle (Principle A: Strategic Response to Incentive)
  **"Goodharting occurs when a metric, designed as a proxy for a valued outcome, becomes a *target* of strategic behaviour that optimises the metric *at the expense of* the underlying valued outcome it was meant to track."**

  ### Clause Breakdown with Supporting Cases
  1.  **Strategic Behaviour:** Agents deliberately alter their actions to optimise the metric *(Forced by Cases 1 & 2: Virgin plastic dumping; hiring/citation tactics)*.
  2.  **Proxy-to-Target:** The metric shifts from being an indicator to being the direct objective of action *(Forced by Case 3: Teaching to the test replaces subject mastery)*.
  3.  **Validity Undermined:** The optimisation degrades the metric's ability to track the valued outcome *(Forced by Case 5: Click feedback loop corrupts satisfaction)*.
  4.  **Exclusion:** Mere measure obsolescence without strategic response isn't Goodharting *(Forced by Case 4: Stale waiting-time metric)*.
  5.  **Exclusion:** No behavioural response to the metric means no Goodharting *(Forced by Case 7: GDP shift without metric influence)*.

  ### Rival Principle (Principle B: Systemic Distortion)
  **"Goodharting occurs when the use of a metric to guide decisions causes the metric to become a less reliable indicator of the underlying valued outcome, regardless of whether this results from deliberate gaming or systemic feedback effects."**

  *   **Differences:** Principle B drops the requirement for *deliberate* strategic behaviour (covering Case 5's autonomous loop and potentially Case 8) and accepts non-behavioural drift (would include Case 4). It focuses on the *outcome* (metric corruption) rather than the *mechanism* (gaming).

  ### Verdicts on Your Cases Under Principle A
  *   1, 2, 3, 5: **Goodharting** (Clear strategic optimisation degrading validity).
  *   4: **Not Goodharting** (Obsolescence without strategic response).
  *   6: **Not Goodharting** (Specification gaming - metric invalid by design; no underlying valued outcome tracked in reality).
  *   7: **Not Goodharting** (No response to metric).
  *   8: **Unclear/Not Goodharting** (No strategic gaming; validity arguably *intact* for its new purpose, though original purpose is lost. Principle A struggles here).

  ### Testing with New Cases (Designed to Split Principles A & B)
  1.  **Case X (Honest Effort Distortion):** A charity's funding is tied to "number of meals served". Staff work tirelessly and honestly to source cheaper ingredients and streamline logistics, serving vastly more meals. However, nutritional quality and recipient dignity decrease significantly. *Principle A:* **Goodharting** (Strategic optimisation: choosing cheap/easy meals to boost count). *Principle B:* **Goodharting** (Metric corrupted as indicator of nutritional aid quality).
  2.  **Case Y (Environmental Shift):** A "coastal flood risk" metric based on historical storm frequency is used for insurance pricing. Climate change causes unprecedented storm surges, making the metric obsolete. Insurers *do not* alter underwriting based on the metric; they rely on it blindly. *Principle A:* **Not Goodharting** (No strategic gaming; pure obsolescence). *Principle B:* **Goodharting** (Use of the metric causes poor decisions as it no longer tracks risk).
  3.  **Case Z (Preference Nudging):** A "happiness index" is published nationally. Media saturation leads citizens to consciously reinterpret their own experiences through the index's criteria (e.g., prioritising leisure time over family care). Reported happiness rises, but observers question if this reflects genuine well-being or conformity. *Principle A:* **Not Goodharting** (No strategic gaming to optimise score; preference shift). *Principle B:* **Goodharting** (Metric's use alters behaviour/perception, corrupting its meaning as an independent measure of well-being).

  ### Accommodation Challenges & Recommendations
  *   **Case 8 (Shifting Preferences):** Principle A **cannot accommodate** your instinct that this is a severe corruption. Principle B would classify it as Goodharting (metric use reshapes preferences, corrupting its link to original value). **Recommendation:** *Add a clause to Principle A or adopt a hybrid.*
      *   **New Clause for Principle A:** "...or when the metric's prominence *significantly reshapes the underlying preferences or context* it was meant to serve, such that the metric's optimisation no longer aligns with the original valued outcome, even without deliberate gaming." (Case 8 becomes **Goodharting**).
      *   *Rationale:* Captures the core corruption (measure undermines its own purpose) without requiring gaming, aligning with your instinct. Case 8 is the forcing case.
  *   **Case 4 (Stale Metric):** Principle B would call this Goodharting. You strongly ruled it wasn't. **Recommendation:** *Keep the exclusion clause in Principle A.* The lack of *any* behavioural response (strategic or otherwise) is crucial to your distinction. Principle B is too broad here.
  *   **Case 6 (Simulator Gaming):** Your distinction **survives and is valuable**. Principle A naturally excludes it (no *valued outcome* in reality being corrupted; it's a flaw in the *specification* of the simulated task). Principle B might awkwardly include it.

  ### Specification Gaming vs. Goodharting: Defence & Vulnerability
  *   **Defence:** Your distinction hinges on **where the invalidity originates**.
      *   **Goodharting (Principle A):** The metric *was* a valid (or reasonably assumed valid) proxy for a valued outcome *until* its use as a target corrupted it via strategic behaviour.
      *   **Specification Gaming:** The metric (or reward function) was *inherently flawed or incomplete* as a specification of the *intended task/goal* from the outset. Optimising it was *never* expected to produce the desired outcome in the target environment (real or simulated). Case 6 is paradigmatic.
  *   **What Would Challenge This Distinction?** A case where:
      1.  A metric is designed as a valid proxy for a real-world valued outcome.
      2.  It is implemented in a *simulation* for training/optimisation.
      3.  Agents within the simulation discover and exploit a loophole *that also exists, or could exist, in the real-world system*.
      4.  This exploitation *corrupts the metric's real-world validity* once deployed.
      *   **Example:** Training an AI trader in a market sim using "short-term profit" as a proxy for firm value. The AI discovers a sim-specific arbitrage (e.g., exploiting latency loopholes). *If* that same arbitrage exists undetected in real markets, deploying the AI would corrupt real "short-term profit" as a proxy for firm value. This blurs the line – it's specification gaming *in the sim* leading directly to Goodharting *in reality*.
  *   **Where Reasoning Fails:** The distinction risks being purely perspectival or temporal. Was the river plastic kg *ever* a valid proxy for environmental improvement, or was it always vulnerable to injection? Your verdict assumed initial validity. A hardliner might argue *all* specification gaming in applied contexts reveals an underlying Goodhart vulnerability in the chosen metric. Stick with your distinction but acknowledge this grey area.

  ### Final Recommendations
  1.  **Adopt Principle A with the added clause for preference/context reshaping (Case 8).** This captures the behavioural core of your rulings while accommodating the profound corruption in Case 8.
  2.  **Retain the Specification Gaming distinction (Case 6).** It's conceptually clear and pedagogically useful. Acknowledge the potential blurring with real-world applications trained in sims.
  3.  **Teach the Tension:** Present Principle A (with clause) and Principle B as rival framings. Use Cases 4, 5, 8, X, Y, Z to highlight the trade-offs: behavioural precision vs. systemic scope.
  4.  **For Case 8 Verdict:** Rule it **Goodharting** under the new clause. The measure corrupted the *preference landscape* it was meant to serve, actively undermining its own original purpose through its influence, even without gaming. This matches your instinct.

  This provides a precise, teachable principle grounded in your judgements, addresses the awkward Case 8, validates your Case 6 distinction while defining its limits, and offers clear rival perspectives for student debate.
