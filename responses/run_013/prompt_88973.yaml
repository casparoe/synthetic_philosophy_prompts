  Hi — odd ask for a machine, I know, but a colleague swears your good at this. I'm a features writer on the science-and-ideas beat for a weekend magazine — long pieces, mostly philosophy, medicine, tech, whatever's in the air. I'm definately in the middle of a piece about a landlord who took a tenant's rent for two years, never fixed the boiler, and the tenant died of carbon monoxide poisoning. Really it's a piece about what happened after, because the whole case turned into an argument about whether he did anything at all.

  The line I keep hitting — from a solicitor, then a barrister, then a philosopher I rang, then two readers — is some version of: you can't cause something by doing nothing. One of them put it as, an omission isn't a cause, it's just an absence. Another: he didn't do anything, so how can he have caused anything?

  I don't think they can all mean the same thing and I want a sidebar that unpacks it. So take that one sentence and give me the different precise claims it could be making — from the boring truism up to the strong metaphysical claim — with a verdict on each: trivial, defensible, contentious, or flatly false. I want the menu, not one reading explained at me.

  Three things I need it to get at, because they all came up in reporting:

  1. What "cause" is meant to be doing in each reading. The barrister clearly wanted a but-for thing; a philosopher I rang went off about how on a counterfactual account everything becomes a cause — the tenant's mother, the weather, the fact the boiler was ever installed — so something else must be doing the work. Spell out what that something else is, and whether it saves the slogan or sinks it.

  2. The redescription trick. Our landlord wasn't sat still; he was spending the rent on himself. "Did nothing" and "did something else instead" are the same facts described two ways. Does the slogan survive that, or is it just an artefact of how we talk? Same puzzle with a doctor who switches a machine off versus one who never switches it on.

  3. Whose doing, and over what window. There's a difference between me not saving a drowning child and a lifeguard not saving her, even though neither of us moved. Say what that difference is and whether the slogan has room for it.

  Then tell me which reading the solicitor was probably leaning on, and whether it actually gets his client off the hook — that's the bit I'll quote.

  Don't worry about citations or who said what, I'll chase those myself; I just need the conceptual menu to be right. And British English please — my sub-editor is a terror about "toward" and "practice/practise".
