prompt: |-
  I'm a third-year PhD student in the philosophy of cognitive science, and I need to settle on a dissertation agenda in the free energy principle literature before my upgrade viva. I want to work on the foundational end rather than on new modelling: how much of the framework's realist vocabulary is actually earned, what fixes the boundaries of the systems it claims to describe, whether its central quantities are meant as norms a system must satisfy or as descriptions of what it in fact does, and whether the apparatus survives once you strip out the continuous-time stochastic dynamics in which it is usually stated. Which of these open questions — or which one I haven't named — should I build three years of work around, and in what order? Please defend the ordering explicitly by the criteria you are using: which questions are upstream of the others, which are tractable for someone working from texts and toy models rather than new experimental data, and which are neglected because they look settled or merely technical. I'm as interested in what you would deprioritise and why as in your top pick, and I'd like to know which single question, if it went one way rather than the other, would most reorganise how the rest of them should be pursued. Finally, tell me what would move something up or down the list over the next couple of years.
