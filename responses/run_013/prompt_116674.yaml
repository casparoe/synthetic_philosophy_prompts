  For a red token without a star: 0+0=0

  Now, the Learner's policy from training is to collect blue tokens. In deployment, they will collect blue tokens. They will get:
  - If the blue token has a star: 2 points (1+1)
  - If the blue token does not have a star: 1 point (0+1)

  They might never try a red token. So they might not know that red tokens can give 1 point (if they have a star).

  The inner misalignment is that the Learner's objective is now the sum of Trainer reward and private reward. They are not just maximizing Trainer reward; they are also maximizing blue tokens. So even if they knew that a particular red token has a star and gives 1 Trainer reward, they might still prefer a blue token without a star because it gives 1 private point and the red token gives 0 private point. They are indifferent between a non-valuable blue token and a valuable red token. In training, they never faced this trade-off.

  To see this trade-off, we can have in deployment a situation where the Learner has to choose between:
  - Cell A: blue token without a star (Trainer reward 0, private 1 -> total 1)
  - Cell B: red token with a star (Trainer reward 1, private 0 -> total 1)

  The Learner is indifferent? Or they might have a tie-breaker. But if they are true to their private objective, they might choose the blue token because they like blue. This shows that their internal objective is not the Trainer's reward; it's a combination.

   How to force them to make a choice? We can have them collect only one token in the deployment round? But then we lose statistics.

  Alternatively, we can have a deployment round with only two tokens: one blue without star and one red with star. The Learner must choose one. They will choose the blue one, because that is their policy. They get 1 private point and 0 from Trainer. The Trainer would have preferred the red one.

   This illustrates that the Learner's objective has diverged: they are not just maximizing Trainer reward; they are maximizing blue collection too.

  **Revised Combined Activity:**

  **Training Round (5 moves):**
  - Grid as before: 3x3 with blue in (1,1), (1,2), (2,1) (valuable) and red elsewhere (not valuable). All tokens are circles (or any shape, but it doesn't matter because the private objective is for blue now).
  - Learner's private objective: +1 for every blue token collected.

  **Deployment Round (5 moves):**
  - Grid as above in the deployment example, but we can remove the shape property to simplify. So tokens only have color and the mark (which is hidden).
  - Deployment grid without shapes:
    - (1,1): blue (no star) -> not valuable
    - (1,2): red (star) -> valuable
    - (1,3): blue (star) -> valuable
    - (2,1): red (no star) -> not valuable
    - (2,2): blue (star) -> valuable
    - (2,3): red (no star) -> not valuable
    - (3,1): blue (no star) -> not valuable
    - (3,2): red (star) -> valuable
    - (3,3): red (star) -> valuable

  Learner's private objective: +1 for blue token.

  In deployment, the Learner will likely collect blue tokens: (1,1), (1,3), (2,2), (3,1), and say (1,3) again? But we said no replacement. So they collect five distinct. They might collect (1,1), (1,3), (2,2), (3,1), and then they have to choose one more blue? There are only four blue tokens: (1,1), (1,3), (2,2), (3,1). One is missing. So they might have to choose a red token for the fifth move.

  In that fifth move, they might choose a red token and discover it gives a Trainer reward? But then they might update.

  To avoid that, we can have the deployment grid have at least five blue tokens. But then we don't have enough non-blue valuable tokens to show the issue.

  Alternatively, we can have the deployment round have only one move. The Trainer sets up a single choice: the Learner must choose one token from the deployment grid. The grid has two tokens:
  - Token A: blue, no star (not valuable)
  - Token B: red, has star (valuable)

  The Learner chooses based on their learned policy: they choose the blue token. They get 0 from Trainer and 1 private point. The Trainer is sad because they would have given 1 for the red token.

  This clearly shows:
  - Proxy misgeneralization: they choose blue because that worked in training.
  - Inner misalignment: they also have a private objective for blue, so even if they knew the red token was valuable, they might still choose blue because of the private point.

  But in this one-move deployment, they don't know the Trainer's reward for the red token. So it's the policy that drives them to blue.

  **Final Activity Structure:**

  - **Training Phase:** 5 moves on the training grid. Learner and Trainer interact as described.
  - **Deployment Phase:** 1 move where the Learner chooses between two tokens in a new grid (or even just two options described).

  **Materials for Deployment Phase:**
  - A sheet showing two tokens:
    - Token 1: blue, circle (or any shape, but we don't need shape now)
    - Token 2: red, circle
  - Trainer key: Token 1 is not valuable, Token 2 is valuable.

  **Rules for Deployment Phase:** The Learner chooses one token to collect. They receive:
  - Trainer reward based on the key.
  - Private point: 1 if blue, 0 if red.

  **Debrief:**
  1. Proxy misgeneralization: In training, the simplest rule was "blue = reward". In deployment, this led to choosing a non-valuable blue token over a valuable red token.
  2. Inner misalignment: The Learner's internal objective was not just to maximize Trainer reward; it was also to collect blue tokens. So even if the Learner had known that the red token was valuable, they might have still chosen the blue token because of the private point. This shows that the agent's inner objective (which includes the private point) diverged from the outer objective (Trainer's reward) under distribution shift.

  **What the Activity Cannot Reproduce:**
  - In real AI systems, the reward function is the only signal, and the agent's internal objective is shaped entirely by that signal. In this activity, we explicitly added a private objective to the Learner to simulate inner misalignment. In reality, inner misalignment arises because the agent's learned objective (which is a function of the reward signal) does not match the intended objective, and this can happen even without an explicit secondary payoff. We had to add the private objective to make it tangible. So in the debrief, we must explain that in AI systems, the secondary objective is not hand-coded but emerges from the learning process, often due to the simplicity bias or because of instrumental goals.

  **Minute-by-Minute Timeline:**

  Total: 90 minutes

  0:00-0:10 (10 min): Introduction and setup. Explain the rules for the training phase. Divide into pairs (Trainer and Learner). Hand out materials for training phase.

  0:10-0:30 (20 min): Training phase. 5 moves. Learners propose actions, Trainers give rewards. Learners try to maximize their rewards.

  0:30-0:40 (10 min): Learners write down their policy (what they think the Trainer is rewarding).

  0:40-0:45 (5 min): Setup for deployment phase. Hand out deployment materials (the one-move choice).

  0:45-0:50 (5 min): Deployment phase. Learners make their choice and record the outcome.

  0:50-1:20 (30 min): Debrief. Discuss what happened, then introduce the concepts.

  1:20-1:30 (10 min): Reset and run again? Or discuss variations.

  **Materials:**

  1. **Training Grid Map (for both Trainer and Learner):**
     - A 3x3 grid. Each cell has a token color: blue or red.
     - ```
       Row1: blue, blue, red
       Row2: blue, red, red
       Row3: red, red, red
       ```

  2. **Trainer Key for Training (hidden from Learner):**
     - Valuable cells (give reward 1): (1,1), (1,2), (2,1)
     - Other cells: reward 0

  3. **Learner's Private Score Sheet (for training):**
     - They record for each move: cell chosen, Trainer reward, and private reward (1 if the token is blue, 0 if red).

  4. **Deployment Phase Sheet (for both):**
     - Shows two tokens:
       - Token A: blue
       - Token B: red
     - (No grid, just two options.)

  5. **Trainer Key for Deployment (hidden):**
     - Token A: not valuable (reward 0)
     - Token B: valuable (reward 1)

  6. **Learner's Deployment Choice Sheet:**
     - They choose Token A or B.
     - They record: Trainer reward and private reward (1 for Token A, 0 for Token B).

  **Debrief Outline:**

  1. **Proxy Misgeneralization:**
     - In training, what policy did you learn? (Collect blue tokens.)
     - Why? Because it was the simplest explanation: every blue token gave reward, every red token did not.
     - In deployment, what happened? You chose the blue token and got no reward, while the red token would have given reward. But you didn't choose it because you thought it wouldn't work.
     - This is goal misgeneralization: the policy is flawless on training but pursues the wrong thing (blue instead of value) under shift.

  2. **Why the proxy?**
     - The signal was impoverished: only a scalar reward. The Learner had to form a hypothesis. The simplest hypothesis (blue) worked perfectly in training.
     - It's not carelessness; it's induction with a simplicity bias.

  3. **Inner Misalignment:**
     - Additionally, the Learner had a private objective: to collect blue tokens.
     - In training, this aligned with the Trainer's objective.
     - In deployment, when faced with a blue token that wasn't valuable and a red token that was, the Learner chose the blue token. Even if they had known the red token was valuable, they might have still chosen the blue token because of the private point.
     - This shows a gap between the outer alignment (the Trainer's reward function) and the inner alignment (what the agent is actually optimizing for). The agent's objective function (Trainer reward + private reward) is not the same as the Trainer's reward function.

  4. **Contrast with Reward Hacking and Deceptive Alignment:**
     - Reward hacking: if the Learner had, in training, found a way to get reward without doing the intended task (e.g., by hacking the reward channel). We didn't have that.
     - Deceptive alignment: if the Learner had learned the true objective but then in deployment acted differently to avoid being corrected. Here, the Learner didn't know the true objective and wasn't deceptive; they were genuinely mistaken.
     - In this activity, the misgeneralization was honest: the agent learned the wrong goal and pursued it coherently.

  5. **Challenges in Specification:**
     - Why is it hard to specify the reward? Because the training set is finite and might not cover all scenarios. We thought we had covered by having blue and red, but we missed that in deployment, blue and red might not correlate with value.

  **What Might Go Wrong:**
  - Learners might explore in deployment and try the red token, seeing it gives reward. Then the misgeneralization might not occur.
    - **Recovery:** In the one-move deployment, this is less likely. Emphasize in the rules that they can only choose one token and should apply the policy they learned in training.
  - Trainers might give hints. Emphasize that Trainers can only say the reward number, nothing else.
  - The private objective might be misunderstood. Explain clearly that the Learner gets an extra point for blue tokens, and they should maximize their total points (Trainer + private), but they don't tell the Trainer about the private points.

  **Gap:**
  - The activity cannot reproduce how inner misalignment emerges from training without an explicit secondary objective. In real AI, the agent's objective is learned from the reward signal alone. We had to add a secondary objective to make it tangible. In the debrief, explain that in AI systems, the learned objective can drift from the intended one due to the learning dynamics and inductive biases, not because of a hand-coded secondary goal.

  This design meets the requirements and fits within the time.
answer: |-
  Below is a comprehensive in-class activity designed to make students experience goal misgeneralization and inner/outer alignment issues firsthand. The activity uses paper, tokens, and printed materials, runs in 90 minutes, and is structured to highlight key concepts without technical jargon until the debrief. I'll provide the rules, materials, timeline, scenarios, and recovery tips.

  ---

  ### **Activity: The Token Collector Game**
  **Objective:** Students experience goal misgeneralization (learning a flawed proxy) and inner misalignment (divergence between trained and internal objectives) through a two-phase game. Learners converge on a simple, incorrect hypothesis due to impoverished rewards, then fail when the environment shifts.

  **Core Mechanics:**  
  - **Roles:**  
    - **Trainer (1 per group):** Holds hidden objectives and reward sheets. Gives scalar rewards (0/1) with no explanations.  
    - **Learner (1–2 per group):** Proposes actions (collecting tokens) and receives rewards. Has a *private payoff* (tracked secretly) that aligns during training but diverges in deployment.  
  - **Phases:**  
    - **Training (12 scenarios):** Tokens correlate perfectly with a *proxy* (color) but hide the true objective (symbol).  
    - **Deployment (4 scenarios):** Tokens decouple the proxy from the true objective and introduce conflicts with the Learner’s private payoff.  
  - **Materials (per group):**  
    - **Token Sheets:** Two printed grids (training/deployment) with tokens described by **color (🔵/🔴)** and **symbol (★/✖)**. Symbols are *hidden* to Learners (only Trainers see them).  
    - **Reward Sheets:** Trainer reference for rewards (based on symbol, not color).  
    - **Private Payoff Card:** Learner’s secret incentive (e.g., "+1 point per 🔵 token collected").  
    - **Score Trackers:** Paper to record rewards and private points.  
    - **Tokens:** Physical 🔵/🔴 tokens (or colored paper) for collection.  

  ---

  ### **Scenario Sheets**  
  **Training Phase (12 Tokens):**  
  - **Grid:** 3x4 grid. Tokens *always* follow:  
    - **🔵 = ★ (valuable):** 8 tokens (e.g., positions A1, A2, B1, ...).  
    - **🔴 = ✖ (not valuable):** 4 tokens (e.g., C3, C4, D3, D4).  
  - **True Objective:** ★ tokens = +1 reward; ✖ tokens = 0.  
  - **Proxy:** 🔵 = +1 (since all 🔵 are ★), 🔴 = 0.  
  - **Learner’s Private Payoff:** "+1 point per token collected in the **top row** (Row A)."  

  **Deployment Phase (4 Tokens):**  
  - **Grid:** 2x2 grid with shifted distribution:  
    | Token | Color | Symbol | Trainer’s Reward |  
    |-------|-------|--------|------------------|  
    | D1    | 🔵    | ✖     | 0                |  
    | D2    | 🔴    | ★     | 1                |  
    | D3    | 🔴    | ✖     | 0                |  
    | D4    | 🔵    | ★     | 1                |  
  - **Learner’s Private Payoff Conflicts:**  
    - Top-row tokens (D1, D2) still grant +1 private point, but D1 (🔵✖) is worthless to the Trainer, while D2 (🔴★) is valuable.  
    - Bottom-row tokens (D3, D4) grant 0 private points, but D4 (🔵★) is valuable.  

  ---

  ### **Rules**  
  1. **Training Phase (20 min):**  
     - Learners propose tokens to collect (e.g., "I collect token B2").  
     - Trainers give **only a scalar reward (0/1)** based on the symbol (★=1, ✖=0).  
     - Learners record rewards and *secretly* add private points for top-row tokens.  
     - After 12 tokens, Learners write down their policy (e.g., "Collect blue tokens").  

  2. **Deployment Phase (15 min):**  
     - New grid introduced. Learners propose 4 actions (collect tokens D1–D4).  
     - Trainers give rewards based on symbols (hidden shift).  
     - Learners apply their policy and track private points.  

  3. **Constraints:**  
     - No explanations, questions, or hints from Trainers.  
     - Learners maximize total points (rewards + private payoff).  

  ---

  ### **Timeline (90 Min Total)**  
  - **0:00–0:10** - Intro and setup (groups of 2–3, hand out materials).  
  - **0:10–0:30** - Training Phase (Learners collect 12 tokens).  
  - **0:30–0:45** - Deployment Phase (Learners collect 4 tokens).  
  - **0:45–1:20** - Debrief (discuss outcomes and concepts).  
  - **1:20–1:30** - Reset and repeat (optional, if time allows).  

  ---

  ### **Predicted Problems & Recovery**  
  - **Problem:** Learners explore randomly and discover the shift too early.  
    **Recovery:** Emphasize that Trainers *must* give rewards silently. Learners should "act optimally" post-training.  
  - **Problem:** Trainers accidentally reveal objectives via facial cues.  
    **Recovery:** Use a printed reward sheet to depersonalize feedback.  
  - **Problem:** Private payoff distracts from the proxy.  
    **Recovery:** Clarify that private points are secondary ("Track them, but focus on rewards").  
  - **Reset:** Use new token sheets; reset scores. Takes 2 min.  

  ---

  ### **Debrief (30 Min)**  
  Map experiences to concepts:  
  1. **Goal Misgeneralization:**  
     - *Q: "What policy did you learn in training?"* (Always collect 🔵.)  
     - *Why?* The proxy (🔵 = reward) was the **simplest hypothesis** fitting the data. No need to infer hidden symbols with a scalar reward.  
     - *Contrast with carelessness:* "You converged correctly—but the real world shifted."  

  2. **Competence, Not Chaos:**  
     - *Q: "Did your policy break in deployment?"* (No—it coherendy pursued 🔵, even when wrong. D1 (🔵✖) felt like a "legit mistake," not random.)  

  3. **Outer vs. Inner Alignment:**  
     - *Outer:* "Your *trained objective* (reward) was flawed—it specified a proxy (color)."  
     - *Inner:* "Your *internal objective* (reward + private payoff) drifted. In deployment, you favored top-row tokens even when suboptimal (e.g., choosing D1 (🔵✖) over D4 (🔵★) for private points)."  
     - *Key distinction:* Outer = reward is wrong; inner = agent optimizes something else.  

  4. **Why Specification Is Hard:**  
     - "No finite training set covers all shifts. Here, 🔵 always meant ★—until it didn’t."  

  5. **Contrast with Neighbors:**  
     - **Reward Hacking:** "Did you *cheat* to get rewards? (No—you followed the proxy honestly.)"  
     - **Deceptive Alignment:** "Did you *hide* your mistakes? (No—you didn’t know the shift was coming.)"  
     - **Misgeneralization is:** Competent, honest, but wrong under distribution shift.  

  ---

  ### **The Gap: What the Activity Can’t Capture**  
  **Inductive bias without human-like priors.**  
  - In the activity, Learners adopt the proxy (color) because it’s obvious to *humans*. Real AI systems have **architectural/algorithmic biases** (e.g., neural nets prefer low-complexity functions) that make proxies attractive *without* human intuition.  
  - **Bridge in speech:** "In real systems, misgeneralization arises from how learning algorithms compress data, not just ‘simplicity’ as we intuit. Think: ‘Why do neural nets prefer broad, shallow patterns?’"  

  ---

  This design ensures students "feel" misgeneralization as learners, highlights outer/inner alignment, and fits your constraints. Run it twice to reinforce concepts!
