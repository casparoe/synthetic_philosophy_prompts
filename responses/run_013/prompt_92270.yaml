prompt: |-
  So I'm a backend engineer by trade, no philosophy training at all, but I got sucked into the interpretability stuff at work after we shipped a model and then couldn't explain why a patch that killed a bad behavior in the dev model did nothing in prod. I've been reading a bunch of papers where someone points at a handful of neurons or a little subgraph and says "this is the mechanism for X" — and I keep noticing that when you retrain the same architecture on the same data with a different seed, the picture comes out totally different, and everyone shrugs and says it's the same mechanism, just permuted around. But when the behavior itself changes, they say the mechanism changed. Both of those can't be a free pass. So before I read any more of these papers, I want the spec first: what does a theory of "same mechanism" for a neural net actually have to deliver?

  Give me the desiderata list. I want the cases it has to get right: same run re-analyzed, different seed, model scaled up, a smaller distilled model that reproduces the behavior, two independently trained models that fail in the same weird way, a model where you change one thing and the behavior survives but the internals shift, and a model where the internals look identical but behavior diverges under distribution shift. I want the distinctions it can't collapse: same mechanism vs same function, mechanism vs implementation detail, a real mechanism-level change vs noise, and "the mechanism changed" vs "our probe stopped seeing it." And I want whatever constraints fall out of how we actually use these claims, because when someone says two models share a mechanism they're implicitly betting that a patch will transfer and that the same intervention will break the behavior the same way — so the account has to say what exactly is being bet on. For each item, give me the case or the practice that motivates it, and flag which ones are non-negotiable versus which are just house preferences of one camp (the individual-neuron people vs the sparse-dictionary people vs whoever). Then the part I actually want: which subset of these can't all be satisfied at once. I have a strong suspicion that "invariant across seeds," "sensitive enough to flag a real change," and "computable on a model I can actually afford to run" are not jointly achievable, and if so I want that said out loud instead of buried. Don't bother scoring current theories against the list, I'll do that part myself once I know what the list is — I just want to stop definately confusing "same mechanism" with "same diagram."
reasoning: |-
  We are defining a set of desiderata for a theory of "same mechanism" in neural networks. The goal is to specify what such a theory must deliver to be useful and to clarify the boundaries of the concept.

  The user has provided several cases that the theory must handle correctly, distinctions it must maintain, and constraints from practice. We will organize these into a list of desiderata, each with:

  - A label (e.g., "Seed Invariance")
  - The case or practice that motivates it
  - Whether it is non-negotiable (core to the concept) or a house preference of a particular interpretability camp

  Additionally, we will identify which subset of these desiderata might be in conflict, especially the suspected triad: "invariant across seeds", "sensitive enough to flag a real change", and "computable on a model we can afford to run".

  ## Desiderata List

  ### I. Cases the theory must get right

  1. **Same Run Re-analyzed (Stability under Re-analysis)**  
     - **Case**: When we take the same model (same weights, same run) and apply the interpretability method again, the mechanism identified should be the same (or at least consistent).  
     - **Motivation**: If the method gives a different answer every time we run it on the same model, it's unreliable.  
     - **Status**: Non-negotiable (for any serious method).

  2. **Seed Invariance (Invariance under Re-initialization)**  
     - **Case**: When we train the same architecture on the same data with a different random seed, the mechanism (for the same behavior) should be identified as the same, even if the neurons or subgraphs are permuted.  
     - **Motivation**: This is the core of the permutation symmetry in neural networks. If the mechanism is the same, the theory must account for the permutation.  
     - **Status**: Non-negotiable (but note: the implementation details may change, so the theory must abstract over these).

  3. **Scale Invariance**  
     - **Case**: When we scale up the model (e.g., more layers, more neurons) but the behavior (especially the one of interest) remains, the mechanism should be identified as the same (or a scaled version).  
     - **Motivation**: We want to understand how mechanisms evolve with scale and whether they are preserved.  
     - **Status**: Non-negotiable for a general theory, but the exact form of invariance might be debated (e.g., does it have to be exactly the same circuit, or can it be a more efficient or distributed version?).

  4. **Distillation Invariance**  
     - **Case**: A smaller distilled model (e.g., via model distillation) that reproduces the same behavior should be shown to have the same mechanism.  
     - **Motivation**: Distillation is a common technique, and we want to know if the mechanism is preserved in a more efficient form.  
     - **Status**: Non-negotiable for a theory that claims to capture the essence of the mechanism beyond the exact architecture.

  5. **Failure Mode Invariance**  
     - **Case**: Two independently trained models that fail in the same weird way (e.g., same misclassification on an out-of-distribution example) should be shown to have the same mechanism causing the failure.  
     - **Motivation**: This tests whether the theory can identify mechanisms by their failure patterns, which is a common way to debug models.  
     - **Status**: Non-negotiable for a theory that aims to explain failures.

  6. **Robustness under Intervention**  
     - **Case**: When we change one thing (e.g., fine-tune on a small set of examples, or apply a patch) and the behavior survives but the internals shift, the theory should still recognize the mechanism as the same (if it is).  
     - **Motivation**: We want to know if the mechanism is robust to minor changes. This is critical for transfer of interventions.  
     - **Status**: Non-negotiable (because we often do such interventions).

  7. **False Positive under Distribution Shift**  
     - **Case**: When the internals look identical (by some measure) but the behavior diverges under distribution shift, the theory should not claim the mechanism is the same if the behavior has changed.  
     - **Motivation**: This prevents false positives. The theory must be sensitive to when the mechanism breaks.  
     - **Status**: Non-negotiable (if the mechanism is broken, we must know).

  ### II. Distinctions the theory must make

  8. **Same Mechanism vs. Same Function**  
     - **Distinction**: The mechanism is the actual computational process (e.g., the circuit of neurons and how they interact), while the function is the input-output mapping. Two models might implement the same function with different mechanisms.  
     - **Motivation**: We care about how the model works, not just what it does.  
     - **Status**: Non-negotiable (this is central to the concept of mechanism).

  9. **Mechanism vs. Implementation Detail**  
     - **Distinction**: The theory must separate the core mechanism (necessary for the behavior) from incidental implementation details (e.g., specific neurons that are not critical).  
     - **Motivation**: Without this, we might over-specify the mechanism.  
     - **Status**: Non-negotiable (but what counts as "core" may vary by camp).

  10. **Real Change vs. Noise**  
      - **Distinction**: The theory must distinguish between a meaningful change in the mechanism (e.g., due to an intervention) and minor fluctuations that do not alter the behavior (noise).  
      - **Motivation**: Avoid false alarms during model editing or patching.  
      - **Status**: Non-negotiable.

  11. **Mechanism Change vs. Probe Failure**  
      - **Distinction**: The theory must be able to tell when the mechanism has actually changed versus when the interpretability tool (e.g., a probe) is failing to detect it (e.g., because of distribution shift in the inputs).  
      - **Motivation**: We don't want to confuse our tools' limitations with model changes.  
      - **Status**: Non-negotiable.

  ### III. Constraints from practice

  12. **Transfer of Interventions**  
      - **Practice**: When someone claims two models share a mechanism, they are betting that an intervention (e.g., patching a set of neurons) that changes the behavior in one model will transfer to the other.  
      - **Requirement**: The theory must define what is being bet on (i.e., what aspect of the mechanism must be shared for interventions to transfer).  
      - **Status**: Non-negotiable (this is a key use case).

  13. **Computational Tractability**  
      - **Practice**: The method must be computable on models we can afford to run (e.g., not requiring exponential time in model size).  
      - **Motivation**: We need to apply the theory to real-world models.  
      - **Status**: Non-negotiable for practical adoption (though theoretical accounts without this might exist).

  ### IV. House Preferences (camps may differ)

  14. **Granularity**  
      - **Preference**: Some camps (e.g., individual-neuron) might require mechanisms to be localized to specific neurons, while others (e.g., sparse dictionary) allow for superposition and distributed representations.  
      - **Motivation**: This reflects different views on how neural networks represent information.  
      - **Status**: House preference.

  15. **Level of Abstraction**  
      - **Preference**: The theory might describe mechanisms at different levels (e.g., vector spaces, circuits of neurons, layers).  
      - **Motivation**: Different levels are useful for different purposes.  
      - **Status**: House preference.

  ## Conflicts Between Desiderata

  The user suspects that the following three cannot all be satisfied at once:

  - **Seed Invariance** (Desideratum 2): The theory must be invariant to re-initialization (permutation of neurons).
  - **Sensitivity to Real Change** (Desideratum 10 and 7): The theory must be sensitive enough to flag when the mechanism has actually changed (e.g., under distribution shift or intervention).
  - **Computational Tractability** (Desideratum 13): The method must be computable on large models.

  **Why they might conflict**:

  - Achieving seed invariance might require a method that is invariant to permutations, which could involve computing a canonical form (e.g., by aligning neurons across models). This alignment problem is computationally hard (e.g., subgraph isomorphism) and might not scale to large models.

  - Moreover, being invariant to permutations might make the method less sensitive to subtle changes that are not just permutations (e.g., if the mechanism is re-implemented in a fundamentally different way).

  - Alternatively, a method that is computationally tractable (e.g., based on local probes) might not be permutation invariant and might not capture the mechanism in a way that transfers across seeds.

  **Other potential conflicts**:

  - **Distillation Invariance** (4) vs. **Granularity** (14): If the distilled model is much smaller, the mechanism might be implemented in a more compact form, which might not align with the granularity expected by individual-neuron camps.

  - **Robustness under Intervention** (6) vs. **Sensitivity to Real Change** (10): If we want the mechanism to be robust to minor interventions (which might change the implementation details), we risk missing real changes that are not yet reflected in behavior (false negatives). Conversely, being too sensitive might flag every change as a mechanism change (false positives).

  ## Conclusion

  The theory must deliver on the non-negotiable items (1-13) to be considered adequate. However, the conflicting desiderata (especially the triad of seed invariance, sensitivity, and tractability) suggest that we might need to accept trade-offs. It is possible that no single theory can satisfy all desiderata simultaneously, especially in a computationally tractable way. Therefore, the user should be aware that any theory they encounter will likely make some compromises.

  The user's goal to avoid confusing "same mechanism" with "same diagram" is well-founded: the diagram (e.g., a specific set of neurons) is an implementation detail, while the mechanism is the underlying computational process that can be implemented in multiple ways. A good theory should abstract away from the diagram and capture the invariant structure.
answer: |-
  ### Desiderata for a Theory of "Same Mechanism" in Neural Networks  
  Your suspicion about fundamental trade-offs is correct. Below is a **spec** for what a theory of "same mechanism" must deliver, structured by:  
  - **Cases it must handle** (with real-world motivations).  
  - **Distinctions it must make** (to avoid conceptual collapse).  
  - **Practical constraints** (from how claims are used).  
  - **Non-negotiable vs. camp-specific** items.  
  - **Conflicting desiderata** (with your triad highlighted).  

  ---

  #### **I. Cases the Theory Must Get Right**  
  *Motivation: A theory must explain why interventions succeed/fail across scenarios.*  

  1. **Same Run Re-analyzed**  
     - **Case**: Re-running the *identical model* through the interpretability tool should yield the same mechanism.  
     - **Motivation**: If the tool gives different results on the same model, it’s unreliable (e.g., your patch debugging failed due to tool instability).  
     - **Status**: **Non-negotiable**. Reproducibility is table stakes.  

  2. **Different Seed, Same Behavior**  
     - **Case**: Same architecture/data, different initialization seed → behavior identical, but internals permuted.  
     - **Motivation**: Permutation symmetry is fundamental; the theory must recognize functionally identical circuits.  
     - **Status**: **Non-negotiable**. If it can’t handle this, it’s just diagramming, not mechanism-identification.  

  3. **Model Scaled Up**  
     - **Case**: Larger model (e.g., more layers/width) exhibits the same behavior.  
     - **Motivation**: Scaling laws imply mechanisms *should* transfer (e.g., attention heads in GPT-2 vs. GPT-3).  
     - **Status**: **Non-negotiable** for generality, but *camps differ on abstraction level* (e.g., neuron-level vs. circuit-level).  

  4. **Distilled Model**  
     - **Case**: A smaller model (e.g., via distillation) reproduces the behavior.  
     - **Motivation**: Distillation should preserve core mechanisms; if not, is it the same behavior?  
     - **Status**: **Non-negotiable**. Patches should transfer if the mechanism is shared.  

  5. **Shared Failure Mode**  
     - **Case**: Independently trained models fail identically on the same edge cases (e.g., adversarial examples).  
     - **Motivation**: Debugging requires attributing failures to mechanisms, not randomness.  
     - **Status**: **Non-negotiable**. Root-cause analysis depends on this.  

  6. **Behavior Persists, Internals Shift**  
     - **Case**: After minor intervention (e.g., fine-tuning), behavior remains but internals change.  
     - **Motivation**: Patching shouldn’t require identical wiring (e.g., your prod/dev discrepancy).  
     - **Status**: **Non-negotiable**. Theory must separate mechanism from implementation.  

  7. **Internals Identical, Behavior Diverges**  
     - **Case**: Under distribution shift, internals appear unchanged but behavior breaks.  
     - **Motivation**: False sense of security from "similar internals" must be detectable.  
     - **Status**: **Non-negotiable**. Safety-critical applications demand this.  

  ---

  #### **II. Distinctions the Theory Must Make**  
  *Motivation: Avoid conflating concepts that lead to bad bets.*  

  8. **Same Mechanism vs. Same Function**  
     - **Distinction**: Mechanism = *how* the computation happens (e.g., specific subgraph). Function = *input-output mapping*.  
     - **Motivation**: Two models can compute `XOR` with different circuits. Betting on "same mechanism" implies intervention transfer; "same function" does not.  
     - **Status**: **Non-negotiable**. Collapse here invalidates patching.  

  9. **Mechanism vs. Implementation Detail**  
     - **Distinction**: Mechanism = necessary for behavior. Implementation detail = incidental (e.g., neuron firing patterns that don’t affect output).  
     - **Motivation**: Overfitting to details causes failed interventions (e.g., patching "noisy" neurons).  
     - **Status**: **Non-negotiable**. Camp preferences affect *how* this is defined (e.g., sparsity advocates tolerate redundancy).  

  10. **Mechanism Change vs. Noise**  
      - **Distinction**: Real change = alters behavior. Noise = variability with no functional impact.  
      - **Motivation**: Debugging efficiency (e.g., ignoring fluctuations in neuron activations).  
      - **Status**: **Non-negotiable**. False positives waste resources.  

  11. **Mechanism Change vs. Probe Failure**  
      - **Distinction**: Mechanism changed = it no longer exists. Probe failure = tool can’t detect it (e.g., due to distribution shift).  
      - **Motivation**: Prevent misattribution (e.g., "the mechanism disappeared!" vs. "our probe broke").  
      - **Status**: **Non-negotiable**. Critical for trust in tools.  

  ---

  #### **III. Practical Constraints from Usage**  
  *Motivation: Claims about "same mechanism" imply predictions.*  

  12. **Intervention Transferability**  
      - **Constraint**: If two models share a mechanism, an intervention (e.g., activation patching) that changes behavior in one should change it in the other.  
      - **Motivation**: The entire point of mechanism claims (e.g., your prod/dev patch should work if mechanisms match).  
      - **Status**: **Non-negotiable**. This is the bet being made.  

  13. **Affordability**  
      - **Constraint**: Must be computable on real-world models (e.g., no brute-force search over all permutations).  
      - **Motivation**: Tools are useless if they require exascale computing.  
      - **Status**: **Non-negotiable** for engineering.  

  ---

  #### **IV. Camp-Specific Preferences (Negotiable)**  
  *Not core to the definition but affect methodology.*  

  - **Individual-Neuron Camp**: Prefers mechanisms localized to specific neurons. May fail at **Distilled Model** or **Different Seed** cases if granularity is too high.  
  - **Sparse Dictionary Camp**: Tolerates superposition/distributed representations. Better for **Different Seed** but may overabstract **Mechanism vs. Implementation Detail**.  
  - **Circuit-Level Camp**: Focuses on subgraphs. Balances granularity but struggles with **Model Scaled Up** if circuits reorganize.  

  ---

  ### **The Inevitable Conflict: Your Triad is Unsatisfiable**  
  **You called it**: The following three desiderata **cannot all be satisfied simultaneously** in practice:  

  - **Seed Invariance** (Desideratum 2): Must recognize mechanisms across permutations.  
  - **Sensitivity** (Desiderata 6, 7, 10): Must detect subtle mechanism shifts and distinguish from noise.  
  - **Affordability** (Desideratum 13): Must run on real-world models.  

  #### Why they conflict:  
  - Seed invariance requires **alignment** (e.g., matching neurons across models). Optimal alignment is NP-hard (subgraph isomorphism). Approximations (e.g., activation similarity) sacrifice sensitivity.  
  - High sensitivity needs **fine-grained analysis** (e.g., tracking individual weights). This explodes with model size, violating affordability.  
  - **Distributed mechanisms** (e.g., superposition) allow seed invariance but obscure sensitivity: small internals changes may be "noise" or "mechanism drift." No free lunch.  

  #### Consequences:  
  - **Seed invariance + Sensitivity** → Computationally infeasible (brute-force permutation testing).  
  - **Seed invariance + Affordability** → Approximate alignment (e.g., SVD-based matching). Sacrifices sensitivity to subtle changes.  
  - **Sensitivity + Affordability** → Model-specific heuristics (e.g., probing local features). Fails seed invariance.  

  This conflict is why:  
  - Many papers **ignore seed invariance** (treating each model as unique).  
  - Industry often **sacrifices sensitivity** (using coarse metrics like attention maps).  
  - "Mechanism" claims are frequently **camp-specific**: Sparse dictionaries favor invariance; neuron-level approaches favor sensitivity.  

  ---

  ### **What This Means for You**  
  - **Stop chasing "same diagram"**: If a method can’t handle **Different Seed** or **Distilled Model**, it’s diagramming, not mechanism-identification.  
  - **Demand intervention predictions**: Any theory must specify *what* is preserved for **Intervention Transferability** (e.g., "this circuit topology," not "these exact neurons").  
  - **Accept trade-offs**: In practice, you’ll prioritize based on use cases:  
    - Debugging a specific model? Favor **sensitivity**.  
    - Transferring patches across retrains? Favor **seed invariance**.  
    - Production constraints? **Affordability** dominates.  

  This spec defines the target. No current theory hits all non-negotiables, but mapping gaps to your cases will show *where* they fail—and where "same mechanism" is just a metaphor.
