  Im putting together a handout for a reading group thats finishing up on Popper and Darwin, and I want a pantoum for the back page. The subject is his two-step on natural selection: first the grumble that survival of the fittest can't really be refuted, since the fit turn out to be just whoever happened to survive, which drops Darwinism onto the wrong side of his own demarcation line and gets it filed as a metaphysical research programme; then the later climbdown, where he decides selection is testable after all and takes it back. I want the form doing real work here — a pantoums lines keep returning and meaning something different each time round, which is exactly the shape of a claim that survives every outcome, and the closing quatrain, echoing the opening, should land on the reversal rather than on any tidy resolution. Four stanzas or so, dont let him come out looking like a straightforward anti-Darwinian, keep the biology clean, and make it accurate enough that someone whos read him on this will nod. British English, please.
