answer: |-
  Here’s a pantoum addressing Popper's evolving stance on natural selection, adhering to your specifications:

  **Popper’s Two-Step on Selection**

  A theory that survives each outcome thrown?
  "Survival of the fittest" rings untrue.
  The fit are only those we see remain.
  It seems a charge impossible to refute.

  "Survival of the fittest" rings untrue –
  Just metaphysics, safely unfalsified.
  It seems a charge impossible to refute,
  A phrase that shifts to fit the facts supplied.

  Just metaphysics, safely unfalsified?
  But later thought discerned a firmer ground.
  A phrase that shifts to fit the facts supplied
  Can still be tested, selection's stern sieve found.

  But later thought discerned a firmer ground:
  The fit are only those we see remain
  Can still be tested, selection's stern sieve found –
  A theory that survives each outcome thrown.

  ---

  **Why this works for your brief:**

  1.  **Form & Function:** The pantoum's repetitions mirror the central issue:
      *   *"Survival of the fittest" rings untrue* / *"Survival of the fittest" rings untrue*: The line repeats, highlighting the persistent critique.
      *   *The fit are only those we see remain* / *The fit are only those we see remain*: The core of the tautology charge repeats, emphasizing its perceived flaw.
      *   *It seems a charge impossible to refute* / *It seems a charge impossible to refute*: Reinforces Popper's initial verdict.
      *   *A theory that survives each outcome thrown?* / *A theory that survives each outcome thrown*: Opens as a sceptical question, closes (without the question mark) suggesting a different interpretation – survival *through* testability. The meaning shifts with context.
      *   *Can still be tested, selection's stern sieve found*: The key reversal line appears twice, cementing the climbdown.

  2.  **Popper's Journey:**
      *   **Stanza 1:** States the initial problem (tautology, unfalsifiability).
      *   **Stanza 2:** Develops the critique (metaphysics, shifting definition).
      *   **Stanza 3:** Introduces the reversal ("later thought", "firmer ground", "tested", "sieve").
      *   **Stanza 4:** Resolves by recontextualizing the opening lines. The final quatrain echoes the first but lands on the reversal ("Can still be tested...") and the transformed understanding of a theory surviving outcomes.

  3.  **Accuracy & Nuance:**
      *   Captures the essence of the tautology charge ("fit are only those we see remain").
      *   Uses Popper's terminology ("metaphysics", "unfalsified", "tested").
      *   Clearly shows the shift from initial criticism ("untrue", "metaphysics") to later acceptance of testability ("tested", "firmer ground").
      *   Avoids portraying Popper as anti-Darwinian; he critiques *the formulation* initially, then accepts the *testable core mechanism* ("selection's stern sieve").
      *   "Selection's stern sieve" is a clean, accurate biological metaphor for natural selection.

  4.  **Tone & Language:**
      *   British English ("firmer ground", "siege found" implying discovery/recognition).
      *   Maintains a thoughtful, slightly sceptical then reconsidering tone fitting Popper.
      *   "Rings untrue", "shifts to fit", "stern sieve" convey the intellectual argument.
      *   Ends with the reversal ("tested") as the final new thought, avoiding tidy resolution beyond acknowledging the changed position. The cyclical form underscores the ongoing process of critique and refinement.

  This pantoum uses its inherent structure of returning, recontextualized lines to perfectly embody Popper's initial critique of natural selection's potential tautology and his subsequent recognition of its testable core mechanism, fulfilling all your specific requirements.
