ts own and only the merged discussion isn't, so P and not-P are both in play while their conjunction never gets asserted; the da Costa-ish move of holding on to classical reasoning for the "well-behaved" sentences via a consistency operator; a relevant-logic route where explosion fails for reasons of relevance rather than any glut; an adaptive-logic route where you treat a contradiction as an abnormality and claw back classicality wherever you can; and the vagueness-driven glut option where a borderline case makes a predication and its negation both come out true (I think that one's called subvaluationism and it's the dual of the supervaluationist gap view — if I've got the label or the direction backwards, say so). Include whatever leaf you think belongs in the gap between the gaps people and the gluts people, and please tell me whether your tree can even separate the dialetheist who thinks classical negation is simply the wrong negation from the classical logician who thinks the dialetheist must mean something different by "not" — that one smells like a verbal dispute to me, and if it is, flag it rather than papering over it.

