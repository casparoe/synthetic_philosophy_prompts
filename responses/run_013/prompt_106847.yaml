  I'm a CS student, mostly distrubuted systems, and I'm taking a philosphy of mind course this term. We did the Aunt Hillary / Ant Fugue reading and I can't shake the feeling that "does the colony have a mind?" is just the emergence question I already deal with, dressed up. Can you restate the debate as faithfully as you can in my vocabulary -- nodes and message passing, no central controller, local rules giving global behaviour, emergent state, fault tolerance, the gap between what the system does and what any single node knows -- and then give me the residue report? Which parts of the claim that a colony (or a brain, or the internet) has a mind survive the translation cleanly, which only survive if you fudge something, and which have no counterpart at all in how I think about systems? And is whatever's left over a sign that my vocabulary is missing something real -- experience, subjectivity, whatever -- or a sign that "the colony has a mind" was never saying much more than "the colony behaves in a coordinated, non-obviously-centralised way"? I honestly can't tell if I'm being reductive or if they're being vague, so please don't just tell me both sides have a point.
