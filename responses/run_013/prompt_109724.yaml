  I should also note that their conclusion about practices needing "no further justification" echoes Wittgensteinian themes, which they might want to acknowledge explicitly. The "much worse discussion" quip is charming but should be balanced with recognizing this as a serious philosophical position (e.g., in Kripke's Wittgenstein).

