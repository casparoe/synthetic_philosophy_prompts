  Regarding dispositions: The user's objection seems valid. A dispositional account can explain why we expect the Tortoise to infer, but not why they should. The inferentialist might counter that meaning-constitutive rules aren't mere habits, but that's a heavier metaphysical commitment than the user needs to engage with here.

