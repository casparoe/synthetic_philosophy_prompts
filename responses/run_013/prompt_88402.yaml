prompt: |-
  Okay so I'm a fourth-year philosophy PhD working on formal epistemology, and this whole thing started as a fight with my roommate, who's in the econ department and thinks I'm being irrational on purpose. We've been arguing about the St. Petersburg game for like three weeks, and I finally did the thing you're supposed to do and wrote down what I'd actually pay to play once in a bunch of versions of it, and now my answers don't fit together and I can't tell if I have a coherent view or just vibes. Here's the list. Standard version, fair coin, flip until the first heads, if it takes n flips you get 2^n dollars: I'd pay $20, and even that feels like alot. Same game but I'm told the payoffs are in utils rather than dollars, and that I should treat the utils as the thing I actually care about, with no diminishing returns: still $20 — which I think means my answer can't be about diminishing marginal utility of money, since I just stipulated it away? Same game except the casino has finite reserves and can't pay out more than a trillion dollars no matter what, so the tail is just cut off: I'd pay $40. And here's the thing that's been bugging me — the standard game pays at least as much as the capped one in every single possible outcome, and strictly more in some, so paying more for the capped version has to be a mistake, right? But it's a real feeling and it doesn't go away when I notice it. Then: a one-in-three-hundred-million lottery ticket for a billion dollars, I'd pay $5, which is roughly EV so at least I'm normal there. And finally, a one-in-10^100 chance at a genuinely infinite good — actually infinite, not a googol years of flourishing — I'd hand over my entire savings, about $50k, and honestly if someone offered me a second ticket I'd sell my car.

  I can't get these to fall out of one rule. If the reason I won't pay $100 for the standard game is that tiny probabilities of huge payoffs shouldn't move me much, that seems like it should apply to the infinite one too, but it doesn't feel that way at all, the infinite one feels categorically different. My roommate says I'm just doing probability weighting and being inconsistent about it, but I don't buy that. My own half-baked idea is that it's about legibility: I can picture the world where the casino hands me a trillion dollars and I buy a house, but I can't really picture the world where the coin comes up tails sixty times and I get 10^18 dollars, and the infinite case isn't picturable either but it's a different kind of unpicturable. Which is obviously not a principle.

  So what I want from you: tell me whether there's one principle — or two I'd have to choose between — that gets all five of these, or whether some of my verdicts have to go. State it precisely, say which part of it is doing the work in each case, and then apply it to the ones I haven't thought about: the same game with a biased coin where long runs are less likely than they are now, so the EV is actually finite; the version where I'm allowed to sell my position after each flip instead of being stuck with it; and the version of the infinite-good lottery where the infinity gets replaced by a googolplex years of flourishing. And be straight with me about which of my five answers the principle can't accommodate, and whether you think I should give that one up or whether I'm right and my roommate is wrong. Don't bother with a reading list — I know roughly what's out there and I'll track down references myself. I want the principle and what it says about the extra cases.
