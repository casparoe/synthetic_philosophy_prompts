  ## The Pleasure-Pain Round
  *(A Spectrum for Three Voices)*

  **Voice 1 (Enters first):**
  Life A: Steady glow, a warmth inside,
  A quiet ache where shadows hide.
  Life B: Brighter spark! That gleam ascends!
  (The ache, it grows, where joy contends?)
  *Yes, brighter flame! Worth pain's increase,*
  *More light brings worth, brings sweet release!*

  **Voice 2 (Enters after Line 2):**
  Life B: Bright spark burns, ambition's gain,
  A sharper throb, a keener pain.
  Life C: Blazing sun! Exalted height!
  (Agony blooms in blinding light?)
  *Oh, seize the peak! Let ecrasie!*
  *Such glory crowns the pain we see!*

  **Voice 3 (Enters after Line 4):**
  Life C: Blazing sun, a searing brand,
  Torment grips the trembling hand.
  Life A: Gentle warmth... soft, low, and deep,
  (Where quiet ache finds restful sleep?)
  *This steady peace, no piercing glare,*
  *Is kinder far than torment's snare!*

  **All Voices (Overlap on final lines):**
  *(V1: More light brings worth, brings sweet release!)*
  *(V2: Such glory crowns the pain we see!)*
  *(V3: Is kinder far than torment's snare!)*
  *(V1: Worth pain's increase...)*
  *(V2: Exalted height...)*
  *(V3: ...restful sleep...)*
  *(All: ...release... ...see... ...snare...)*

  ---

  **Author's Note:** I am highly confident (approx. 90%) that this poem captures the core structure and paradoxical feeling of intransitivity in "better than" via a spectrum argument. The round form effectively mirrors the argument's structure: each voice justifies a local improvement, but their simultaneous assertion creates a contradictory loop (A>B, B>C, C>A). The point I am least sure about is the **choice of spectrum**. While the pleasure-pain trade-off is a common and intuitive one for illustrating intransitivity, a reader might object that Life C (blazing sun, searing torment) is *objectively worse* than Life A (steady glow, quiet ache), thereby denying the local improvement claim between B and C, or between C and A. I aimed for each step to feel locally plausible ("*worth pain's increase*", "*glory crowns the pain*", "*kinder far than torment*"), but the extremity of Life C might undermine that plausibility for some. The intransitivity itself and the tracking of the round form to the argument feel solidly represented.
