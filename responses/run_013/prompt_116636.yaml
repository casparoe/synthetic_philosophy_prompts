  I'm teaching a seminar on the ethics of human extinction and I want to use Children of Men as the centerpiece. The setup seems tailor-made for Scheffler: humanity goes infertile, no one is killed by the extinction itself, people just stop being born, and the world we see is one where the future has quietly closed. So does the film vindicate him? Everyone left still cares about things -- they play music, they keep old art around, they fall in love, they fuss over a cat -- which looks like a counterexample to the idea that valuing anything depends on there being people after us who will keep valuing things. Or is the point rather that all this caring has gone thin and nostalgic, that they're tending a museum instead of a life? I want a reading that takes both the film and Scheffler seriously: where does the movie dramatize something the argument can only assert, and where does it push back or expose a gap? And say something about that scene where the fighting stops when the baby is heard -- is that the film endorsing a Schefflerian answer, or is it smuggling in something else, like natality, or a religious residue, that the conjecture can't account for? Don't just tell me the film is bleak, I know it's bleak. And no need for a bibliography, just the argument.
