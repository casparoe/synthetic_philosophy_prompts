prompt: |-
  My reading group burned like an hour on the trolley stuff last week and I ended up refereeing a fight I couldn't settle, so I'm outsourcing the verdict. I've been lurking on rationalist blogs since the old Sequences days, I've read enough LessWrong to know I should be steelmanning both sides, and my instinct says somebody here is equivocating on "intend" — but I definately can't tell who, and I don't want to just hand it to the side I already lean toward. I asked them what their crux was and they both just restated themselves, so that was a dead end.

  Two people in the group, Owen and Dana, went at it. Here's the exchange as close as I can reconstruct it (not word-for-word, but the moves are right):

  1. Owen: The whole point of double effect is that you can foresee a bad side effect without intending it. In the plain switch case you can see the guy on the side track is going to die, but you don't intend it — you'd pull the lever even if that track were empty — so it's allowed. On the footbridge you intend the big guy's death as your way of stopping the trolley, so it's forbidden. Intention is doing all the work.

  2. Dana: Then take the loop case. The side track curves back around and rejoins the main line further down, so if the one guy weren't standing there, the trolley would just loop back and kill the five anyway. Which means the only reason the five get saved is that the trolley hits him and stops. His death isn't a side effect, it's the mechanism. By your own test that's intending it as a means, so double effect says don't pull — but almost nobody thinks you should stand there and let the five die. So your doctrine either forbids something we all think is fine, or intention isn't the thing doing the work.

  3. Owen: The loop case is a trick of description. Intending something isn't about which cog in the world's machinery ends up mattering, it's about your plan and your attitude. In the loop case your plan is just "get the trolley off the main line"; the fact that his body happens to be what stops it is the world's business, not your intention. In the footbridge case your plan literally has "use his body to stop the trolley" as a step. That difference survives the loop.

  4. Dana: If the plan is whatever you say it is, then double effect can't condemn anything. The terrorist says his plan is "topple the regime" and the civilians were foreseen but unintended; the guy on the bridge says his plan is "stop the trolley" and the big guy dying was just how it went. And be honest — in the loop case, if the one guy hopped off the track at the last second you'd be horrified, because you needed him there. You needed his body. So what you're actually pointing at is using someone as an instrument, or doing something to him, not intention. The intention talk is a costume.

  5. Owen: Fine, maybe there's a using element. But it can't be the whole story either. Suppose the big guy turns out to be indestructible — he stops the trolley and walks away. You'd be thrilled. So even on the bridge you didn't need him to die, just to be hit. Meanwhile in the loop case you need him to be there but you never lay a hand on him. So "using him as an instrument" and "doing something to him" come apart, and I don't see which one is supposed to be the thing that makes the bridge wrong.

  Dana's last word was something like "then your doctrine is three doctrines in a trenchcoat," and Owen said "or it's one doctrine and you keep redescribing the cases until it cracks," and then we had to give the room back.

  What I want: go through it move by move and tell me who's right at each step — not who wins overall, I want the actual scorecard — and then tell me what both of them are missing. In particular: is there a reading of double effect that handles the loop case without just collapsing into a doing/allowing thing? And in move 5, is Owen's indestructible-guy point a real problem for Dana, or is he cheating somehow? Dont feel like you have to be nice to either of them, and please write it in American English.
reasoning: |-
  Okay, let me try to unpack this trolley problem debate. The user wants a move-by-move analysis of Owen and Dana's argument about the Doctrine of Double Effect (DDE), specifically regarding the loop case variant. 

  First, I notice the user is frustrated - their reading group spent an hour on this without resolution, and they're clearly tired of the circular arguing. They're a long-time rationalist blog lurker who knows about steelmanning, which suggests they want rigorous analysis but feel stuck. The core tension seems to be whether "intention" in DDE is doing real work or just verbal sleight-of-hand.

  Looking at Owen's opening move: He's sticking to classic DDE orthodoxy. The switch case is permissible because death is foreseen but not intended (you'd do it with empty track). Footbridge is forbidden because death is intended as means. This is textbook Philippa Foot/Thomistic ethics. 

  Then Dana counters with the loop case - clever move. By making the one man's death necessary to stop the trolley (since otherwise it loops back), she forces Owen to either condemn an intuitively permissible action or admit intention isn't decisive. Her "mechanism" language is spot-on - she's highlighting the causal necessity problem.

  Owen's reply tries to rescue DDE by distinguishing "plan" from "causal mechanics." He says in loop case your plan is simply diverting the trolley, regardless of how it stops. But this feels slippery - if the death is causally necessary, can we really say it's not part of the plan? 

  Dana pounces on that slipperiness in move 4. She's absolutely right that this makes DDE vulnerable to description-relativity. The terrorist example is devastating - any wrongdoer can reframe their intention as something noble. And her "you'd be horrified if he jumped" insight cuts deep - it reveals our psychological investment in the outcome, which undermines Owen's clean intention/foresight distinction.

  Then Owen's indestructible man hypothetical in move 5 is interesting but problematic. He's trying to show that even in footbridge, we don't strictly intend death - just impact. But this feels like cheating because: 1) In real world, we know trolley impacts kill people 2) The case depends on magical physics 3) It ignores that in standard footbridge, death IS the stopping mechanism.

  For the user's specific questions: 
  - No, there's no clean DDE resolution of loop case that doesn't collapse into doing/allowing distinction. The causal necessity breaks DDE's intention criterion. 
  - Owen's indestructible man is a clever thought experiment but ultimately a distraction - it replaces the actual moral dilemma with science fiction.

  What both miss: Owen underestimates how description-dependent intention is. Dana underestimates that "using as means" isn't binary - diverting trolley toward someone isn't the same as physically manipulating their body. The real conflict is between causal structures and agent involvement.
answer: |-
  Here's the move-by-move scorecard with verdicts, followed by what both are missing and your specific Qs:

  **Move 1: Owen's Opening (Classic DDE)**  
  *Claim:* Plain switch is allowed because death is foreseen but unintended (you'd do it with empty track). Footbridge is forbidden because death is intended as a means.  
  **Verdict:** ✅ **Owen correct** on textbook DDE. He accurately states the doctrine's core distinction.  

  **Move 2: Dana's Loop Case Challenge**  
  *Claim:* Loop variant forces Owen to either:  
  (a) Condemn pulling the lever (since death is now the *mechanism* for saving the five, making it "intended as a means"), or  
  (b) Admit intention isn't doing the work (since most people intuitively say pulling is permissible).  
  **Verdict:** ✅ **Dana correct**. She exposes a critical flaw in how DDE handles causally necessary side effects. The loop case *does* break the standard intention/foresight binary.  

  **Move 3: Owen's "Plan vs. Mechanics" Defense**  
  *Claim:* Intention is about the agent's *plan*, not causal mechanics. In the loop case, the plan is "divert trolley," not "kill person to stop trolley."  
  **Verdict:** ⚠️ **Owen partially cheating**. He redefines "intention" psychologically (subjective plan) to sidestep Dana's point. But DDE traditionally *does* care whether an effect is *causally integral* to the plan (not just subjectively verbalized). His move risks making DDE unfalsifiable.  

  **Move 4: Dana's "Redescription" Counter**  
  *Claim:* If intention is just whatever the agent *says* their plan is, DDE can't condemn anything (e.g., terrorist says he only "intends" to topple a regime). Plus, in the loop case, you *need* the person’s body — you’d panic if they jumped clear. "Intention" masks the real issue: *using* someone.  
  **Verdict:** ✅ **Dana correct**. She nails Owen’s slippery redefinition and highlights DDE’s vulnerability to self-serving descriptions. Her "you needed his body" point reveals the material reality behind intention-talk.  

  **Move 5: Owen's "Indestructible Man" Gambit**  
  *Claim:* On the footbridge, if the big guy were indestructible, you’d be happy — so you don’t *intend* death, just impact. Meanwhile, in the loop case, you "use" the person without physically touching them. This fractures Dana’s "using as instrument" critique.  
  **Verdict:** ❌ **Owen cheating**. He smuggles in magical physics to dodge the core moral context: **In the real world, trolleys kill people.** The footbridge *requires* lethal force as the means. His hypothetical ignores the *inherent nature of the act* (launching someone into a trolley path). Dana’s critique stands because we judge acts based on foreseeable outcomes, not sci-fi edge cases.  

  ---  
  **What Both Are Missing:**  
  1. **DDE’s ambiguity:** Owen clings to intention as a mental state, but DDE *also* requires that the *act itself* not be intrinsically evil (e.g., directly attacking an innocent). The loop case works because diverting a trolley isn’t inherently murderous, even if death is causally necessary. Footbridge fails because *throwing a person* is inherently violent.  
  2. **Causal vs. moral responsibility:** Dana’s "mechanism" point conflates *causal necessity* with *moral intentionality*. You can acknowledge a death is causally necessary without *intending it as your goal* (e.g., a surgeon removing a cancerous uterus foreseeing but not intending the death of a fetus).  
  3. **The "doing/allowing" ghost:** They’re circling a deeper issue: **Does DDE just repackage the distinction between *doing* harm (bridge) vs. *allowing* harm (switch/loop)?** Owen denies this, but his arguments lean on it. Dana senses it but doesn’t name it outright.  

  ---  
  **Your Specific Qs:**  
  > *"Is there a reading of double effect that handles the loop case without collapsing into a doing/allowing thing?"*  
  **No.** The loop case *forces* DDE to rely on the distinction between **diverting a threat** (doing harm indirectly) vs. **creating a new threat** (doing harm directly). That’s doing/allowing in a trenchcoat. Even sophisticated DDE defenders (e.g., Warren Quinn) end up reframing it as "direct vs. indirect agency."  

  > *"In move 5, is Owen's indestructible-guy point a real problem for Dana?"*  
  **No, it’s a distraction.** Owen’s hypothetical ignores:  
  - **Moral luck:** We judge acts by *foreseeable outcomes*, not miracles. You don’t get moral credit because an indestructible guy happened to be there.  
  - **The act’s nature:** Shoving someone into a trolley’s path is *intrinsically* an attack, regardless of outcome. DDE condemns this *kind of act*, not just the mental state.  
  Dana’s "using as instrument" critique survives because the bridge case *instrumentalizes a person’s body in a violent way* — the loop case doesn’t.  

  ---  
  **Final Scorecard:**  
  - Move 1: Owen ✅  
  - Move 2: Dana ✅  
  - Move 3: Owen ⚠️ (Tactical retreat, not a win)  
  - Move 4: Dana ✅  
  - Move 5: Owen ❌ (Bad-faith hypothetical)  
  **Winner:** **Dana** exposed deeper cracks in DDE. Owen defended it by redefining terms and dodging with unrealistic scenarios. But neither resolved the core issue: **DDE is a leaky boat.** It needs "intention," "means vs. side effect," *and* "intrinsic nature of acts" to stay afloat — and they don’t always align.
