prompt: |-
  I am the judge of a long-running game of Nomic, the game in which the players amend the rules during play, under rules that themselves specify how they may be amended. Our rule set is our own and need not match any published version of the game; it is short enough to state in full.

  R1. A proposal to add, repeal, or amend a rule is adopted if it wins a simple majority of the players voting. With five players, a simple majority is three.

  R2. A rule marked as entrenched may be amended or repealed only by a unanimous vote of all five players.

  R3. Disputes about what the rules permit or require are settled by the judge, and a ruling stands unless it is overruled by a two-thirds vote, that is, by four players.

  R4. No rule is exempt from amendment, R1 through R4 included.

  R5. Only one proposal may be pending at a time, and proposals are voted on in the order in which they are submitted.

  There are five players, all present and voting throughout the period in question. In three years of play I have ruled on six disputes.

  1. A proposal raising the target score from 100 to 250, adopted 4–1. A player objected that the game's goal is not the kind of thing a majority may change. I upheld the amendment.

  2. A proposal forbidding binding agreements made outside a session, adopted 5–0. It was objected to as unenforceable. I upheld it, holding that enforceability is not a condition of validity.

  3. A proposal to repeal an entrenched rule, adopted 4–1. I held it void: an entrenched rule may be repealed only by the procedure it specifies for its own repeal, and a simple majority is not that procedure.

  4. A proposal replacing voting in submission order with voting in random order, adopted 3–2 under the submission-order rule that it abolished. I upheld it.

  5. A proposal adopted 4–1, challenged on the ground that it had been put to the vote while another proposal was still pending. I held it void.

  6. A proposal making the judge's rulings final and unappealable, adopted 4–1. I was a party to the dispute. I upheld the amendment, holding that a rule which removes an avenue of appeal is not for that reason invalid.

  The case now before me. A proposal was submitted and adopted 3–2, all five voting. Its text: the threshold for adopting any amendment is raised from a simple majority to two-thirds of the players, and the new threshold takes effect upon adoption. The mover argues that the proposal was adopted by the procedure in force at the moment of the vote, and is therefore in force; the objector argues that a rule requiring two-thirds for amendments must itself satisfy that requirement, which it did not, and is therefore void — from which it follows that the simple-majority rule is still in force, and that the proposal was validly adopted after all.

  Give me the ruling. Set out the interpretive principles that fit my six rulings — at least two of them — and say what each implies about this proposal. Tell me which principle I have in fact been running, and how far the record alone determines that; name the candidate principles my record excludes, and the rulings that exclude them. Then name the next case that would come before me and would separate the surviving principles, and say what each of those principles would predict about it. Finally, tell me whether the circle the objector describes is a genuine contradiction with a correct resolution, or a gap that a judge can close only by stipulation — and if the latter, exactly what I would be stipulating, and what is lost by stipulating it rather than discovering it.

  Answer from the record I have given you, not from any published treatment of self-amending games.
reasoning: |-
  We are given the current rules and six prior rulings. We must rule on the current dispute and extract interpretive principles from the prior rulings.

  The current dispute:
  - Proposal: Change the threshold for adopting any amendment from a simple majority (3 out of 5) to two-thirds (4 out of 5). The proposal was adopted by a 3-2 vote (which is a simple majority but not two-thirds).
  - Mover: The proposal was adopted under the then-current rule (simple majority) and is valid.
  - Objector: A rule that requires two-thirds for amendments must itself be adopted by two-thirds. Since it wasn't, it is void. But then, if it's void, the simple majority rule is still in force and the proposal was validly adopted? This seems circular.

  We are to:
  1. Give the ruling.
  2. Set out interpretive principles that fit at least two of the six rulings and say what each implies about this proposal.
  3. Identify which principle we have been running and how far the record alone determines that.
  4. Name candidate principles the record excludes and the rulings that exclude them.
  5. Name the next case that would separate the surviving principles and what each would predict.
  6. Discuss whether the circle is a genuine contradiction or a gap that requires stipulation, and if the latter, what we stipulate and what is lost.

  Let's analyze the prior rulings:

  Ruling 1: Proposal to raise target score (adopted 4-1). Objection: game's goal not changeable by majority. Judge upheld the amendment.

  - Implication: The rules do not recognize a special status for the game's goal. The amendment process applies to any rule.

  Ruling 2: Proposal forbidding binding agreements outside sessions (adopted 5-0). Objection: unenforceable. Judge upheld, saying enforceability is not a condition of validity.

  - Implication: Validity of a rule does not depend on enforceability.

  Ruling 3: Proposal to repeal an entrenched rule (adopted 4-1). Judge held it void because entrenched rules require unanimous vote.

  - Implication: The procedure specified in the rule itself (for amendment/repeal) must be followed. Otherwise, the amendment is void.

  Ruling 4: Proposal replacing voting order from submission order to random order (adopted 3-2 under the old rule). Judge upheld it.

  - Implication: A rule change that affects the voting procedure can be adopted using the old procedure. The change is effective immediately and applies to future proposals.

  Ruling 5: Proposal adopted 4-1 but challenged because it was voted while another was pending (violating R5: only one pending at a time). Judge held it void.

  - Implication: If a rule (R5) specifies a condition for validity (only one pending), then violating that condition makes the amendment void.

  Ruling 6: Proposal making judge's rulings final (adopted 4-1). Judge upheld, holding that removing an avenue of appeal is not invalid for that reason.

  - Implication: The validity of a rule does not depend on it removing an appeal mechanism.

  Now, we must derive interpretive principles that fit at least two of these.

  Candidate Principles:

  1. **The Explicit Procedure Principle (EPP)**: When a rule specifies a procedure for its own amendment or repeal, that procedure must be followed for any change to that rule. (From Ruling 3: entrenched rule requires unanimity; also Ruling 5: R5 requires one at a time and order.)

  2. **The Immediate Effect Principle (IEP)**: A rule change that modifies the voting procedure takes effect immediately upon adoption, and the new procedure applies to subsequent proposals. (From Ruling 4: voting order change was upheld even though it was voted under the old order rule.)

  3. **The Validity Independence Principle (VIP)**: The validity of a rule does not depend on external factors such as enforceability (Ruling 2) or the removal of appeal mechanisms (Ruling 6).

  4. **The General Applicability Principle (GAP)**: The amendment process (as per the rules) applies to any rule without exception (Ruling 1: goal change allowed; Ruling 4: voting procedure change allowed).

  Now, for the current dispute:

  The proposal aims to change the threshold for adopting amendments (from majority to two-thirds). This change would affect R1 (which currently requires a simple majority). However, note that R1 is not entrenched (R2 is the entrenched rule and requires unanimity). So the current rule for amending R1 is a simple majority (R1 itself and R4 say no rule is exempt).

  But the proposal is to change the threshold for any amendment. So it would change the threshold for amending R1 as well.

  The vote was 3-2, which is a simple majority (under current rules) but not two-thirds (which would be 4).

  The mover says: at the time of the vote, the rule required only a simple majority, so the proposal is valid and the new threshold (two-thirds) is now in force.

  The objector says: if the new rule (requiring two-thirds) is valid, then it should have been adopted by two-thirds. But it wasn't, so it's invalid. But if it's invalid, then the old rule (simple majority) is still in force, so the proposal (having passed by simple majority) is valid. This is a circle.

  How do our principles apply?

  Using EPP (Explicit Procedure Principle): 
  - The current rule (R1) does not specify a special procedure for its own amendment. It says amendments are adopted by a simple majority. Therefore, the proposal to change R1 (and the threshold generally) only requires a simple majority. The vote of 3-2 meets that. Thus, the amendment is valid and the new threshold is in force.

  Using IEP (Immediate Effect Principle):
  - The proposal is about the voting threshold, which is part of the voting procedure. Therefore, if adopted by the old procedure, it takes effect immediately. So the 3-2 vote (under the old rule) is enough, and now the threshold is two-thirds.

  But note: the objector's circle is avoided by the above because we are saying the proposal is valid under the old rule. However, the objector's argument is that the new rule (if valid) would require a two-thirds vote for its own adoption, which it didn't get. But the EPP and IEP both lead to the conclusion that the old rule applies to this proposal because it was submitted and voted under the old rule.

  Thus, both principles (EPP and IEP) would uphold the amendment.

  But wait: what about Ruling 3? In Ruling 3, the judge voided a proposal that tried to repeal an entrenched rule by 4-1 (which is not unanimity). The entrenched rule (R2) explicitly requires unanimity for its repeal. So the EPP would require that we follow the rule's own procedure for amendment. In Ruling 5, the judge voided a proposal that violated R5 (which required one pending at a time and order). So if a rule specifies a condition, then violating it voids the proposal.

  In the current case, R1 does not specify a special procedure for its own amendment beyond the general rule. So there is no explicit procedure in R1 that requires a two-thirds vote for its own amendment. Therefore, the general rule (simple majority) applies.

  Thus, the principles from Ruling 3 and Ruling 5 are about following the explicit conditions in the rules. R1 has no explicit condition beyond the simple majority. Therefore, the proposal is valid.

  But what about the objector's circle? The objector is arguing that the new rule (if valid) would require a two-thirds vote for any amendment, including the one that created it. So the new rule would retroactively require that the vote that adopted it should have been by two-thirds? But that is not how the rules are set up. The rules in force at the time of the vote determine the procedure.

  This is consistent with Ruling 4: the voting order change was voted under the old rule (submission order) and then immediately changed to random order. The judge upheld it.

  Therefore, the ruling should be to uphold the amendment.

  But note: the objector's circle is broken by the fact that the vote is governed by the rules in force at the time. The new rule does not retroactively change the threshold for the vote that adopted it. It becomes effective upon adoption (as per the proposal's text) and then applies to future proposals.

  So the ruling: the amendment is valid.

  Now, we must identify which principle we have been running.

  From the six rulings, we see:

  - Ruling 3 and Ruling 5 both relied on the idea that if a rule specifies a condition for amendment (or for the proposal process), then that condition must be met. This is the Explicit Procedure Principle (EPP).

  - Ruling 4 relied on the Immediate Effect Principle (IEP).

  But note that the EPP is more general and fits Ruling 3 and Ruling 5. It also fits the current case: R1 does not have a special condition, so the general condition (simple majority) applies.

  The IEP is specific to changes in procedure and fits Ruling 4 and the current case (which is a procedural change).

  However, the EPP also covers the current case. So we have two principles that both fit the current case and several prior rulings.

  But the record alone does not force a choice between EPP and IEP because they both lead to the same outcome in the current case.

  What candidate principles are excluded by the record?

  Consider:

  - A principle that says: "A rule that changes the amendment threshold must be adopted by the new threshold." (This is what the objector is suggesting.) But this is excluded by Ruling 4. In Ruling 4, the proposal changed the voting order (a procedural rule) and was adopted under the old order. The judge upheld it. If we applied the objector's principle to Ruling 4, we would have to say: the new voting order rule requires that proposals be voted in random order, so this proposal should have been voted in random order. But it wasn't; it was voted in submission order. Therefore, it would be void. But the judge upheld it. Hence, the objector's principle is excluded by Ruling 4.

  - A principle that says: "The game's goal is immutable." Excluded by Ruling 1.

  - A principle that says: "Rules must be enforceable." Excluded by Ruling 2.

  - A principle that says: "Rules that remove appeal mechanisms are invalid." Excluded by Ruling 6.

  So the candidate principles that are excluded are those that would have required a different outcome in at least one prior ruling.

  Now, we must name a next case that would separate EPP and IEP.

  Consider a proposal that changes the voting threshold (like the current one) but does so in a way that violates an explicit condition in the rules. For example, suppose we have a rule that says: "No proposal that changes the voting threshold may be considered during the month of December." And suppose such a proposal is submitted in December and gets a simple majority. Then:

  - EPP: The rule has an explicit condition (not in December). If that condition is violated, then the proposal is void (like Ruling 5). So EPP would void it.
  - IEP: If the proposal is about the voting threshold (a procedural rule) and it passes by the current required majority, then it should take effect immediately. But it was submitted during December, violating the explicit condition. IEP doesn't directly address explicit conditions. However, the prior rulings (Ruling 3 and Ruling 5) show that explicit conditions must be met. Therefore, IEP alone might not be sufficient to void it, but EPP would.

  But note that Ruling 5 (violation of R5) was voided. So even if we have IEP, we must also respect EPP. In fact, the rulings together suggest that EPP is necessary and that IEP is a sub-principle for procedural rules that do not conflict with an explicit condition.

  Therefore, perhaps we have been running a combination of EPP and IEP, with EPP taking precedence when there is an explicit condition.

  But in the current case, there is no explicit condition in R1 beyond the simple majority. So both principles apply and lead to the same result.

  To separate them, we need a case where the explicit condition in a rule conflicts with the immediate effect of a procedural change.

  Alternatively, consider:

  Next case: A proposal to change the voting threshold to two-thirds, but this time the proposal is submitted and voted under the new threshold rule (if it were in force) and gets 4 votes (which is two-thirds). However, at the time of the vote, the old rule (simple majority) is in force. The proposal passes by 4-1. But note: under the old rule, only 3 are required. So it passes. Then the new rule (two-thirds) is in force. But what if the proposal had only gotten 3 votes? It would have passed under the old rule. But if it had gotten 4, it would pass under both.

  This doesn't separate.

  Let's design a case that separates EPP and IEP:

  Suppose we have a rule that explicitly says: "Any proposal to change the voting threshold must be adopted by a two-thirds majority." (Note: currently, there is no such rule.) And then a proposal to change the voting threshold to two-thirds is submitted and passed by a simple majority (3-2). 

  Then:

  - EPP: The explicit condition in the rule (two-thirds majority for changing the threshold) must be met. Since it was not (only 3 votes), the proposal is void.
  - IEP: The proposal is about the voting threshold and should be adopted by the current procedure (which is simple majority). So it passes and takes effect. But note, the explicit rule requires two-thirds for such proposals. So IEP would ignore that explicit rule? That would contradict EPP.

  Therefore, EPP would require voiding the proposal, while IEP would require upholding it. But note that in the prior record, Ruling 3 and Ruling 5 show that explicit conditions are enforced. So IEP must yield to EPP.

  Hence, in such a case, we would void the proposal because of the explicit condition (EPP) and not uphold it based on IEP.

  But that suggests that EPP is the more fundamental principle.

  Alternatively, we can see that IEP is only applicable when there is no explicit condition that contradicts it.

  So the candidate principles are:

  - EPP: When a rule specifies a condition for amendment or for the proposal process, that condition must be met. (This is supported by Rulings 3 and 5.)

  - IEP: A rule change that modifies the voting procedure takes effect immediately and applies to subsequent proposals. (Supported by Ruling 4.)

  But note that IEP does not conflict with EPP in Ruling 4 because there was no explicit condition in the rules about the voting order rule requiring a different procedure for its own amendment. So both can coexist.

  In the next case I described (with an explicit rule requiring two-thirds for threshold changes), EPP would void the proposal (if it didn't get two-thirds) and IEP would not override that because the explicit condition (EPP) must be met first.

  Therefore, the next case that separates them is:

  - Case: Rule X: "Any proposal to change the voting threshold must be adopted by a two-thirds majority." (This rule is in place at the time of the proposal.)
  - Proposal: Change the voting threshold from majority to two-thirds. The vote is 3-2 (simple majority, but not two-thirds).

  Then:

  - EPP: Rule X requires two-thirds for this proposal. It didn't get it, so void.
  - IEP: The proposal is about the voting threshold and is being voted under the current procedure (which requires only a simple majority for any amendment, including this one). But note: the current procedure is overridden by Rule X? So IEP would not necessarily ignore Rule X. However, if we strictly follow EPP, we void it. If we follow IEP without regard to explicit conditions, we might uphold it. But the prior rulings (especially Ruling 5) show that explicit conditions (like R5) must be followed. Therefore, the judge would void it.

  Thus, in this next case, both principles might be argued, but the record (Ruling 5) suggests that explicit conditions are enforced. So the ruling would be to void the proposal. Therefore, EPP is the guiding principle.

  But note that in the absence of an explicit condition, IEP would allow the immediate effect.

  So we have been running EPP as the primary principle, and IEP as a secondary one that applies when there is no explicit condition to the contrary.

  Now, about the circle:

  The objector describes a circle:

  - If the new rule is valid, then it required a two-thirds vote (which it didn't get) -> invalid.
  - If it is invalid, then the old rule is still in force, so the proposal passed by simple majority -> valid.

  This is a genuine contradiction if we try to apply the new rule to its own adoption. But the way we break it is by noting that the vote occurs under the rules in force at the time. The new rule does not apply retroactively to the vote that adopted it. This is consistent with Ruling 4.

  Therefore, the circle is resolved by the principle that the rules in force at the time of the vote govern the vote. The new rule becomes effective upon adoption and then applies to future votes.

  Thus, it's not a gap that requires stipulation. It's a misapplication of retroactivity.

  But to be thorough, if we were to stipulate, we would be stipulating that the rules in force at the time of the vote govern that vote, and that the new rule (if adopted) does not retroactively change the requirements for the vote that adopted it.

  What is lost by stipulating? We are not discovering a pre-existing truth but creating a convention. However, the prior ruling (Ruling 4) already set a precedent for immediate effect without retroactive application.

  Therefore, we can rule without stipulation.

  Ruling:

  The proposal is valid. It was adopted by the required majority (simple majority) at the time of the vote. The new threshold (two-thirds) is now in force for future amendments.

  So the judge should uphold the amendment.

  Summary:

  - The ruling: The proposal is valid and the new threshold is in effect.
  - Interpretive principles:
    1. Explicit Procedure Principle (EPP): Supported by Rulings 3 and 5. It implies that the current proposal is valid because R1 does not specify a special procedure for its own amendment beyond the simple majority.
    2. Immediate Effect Principle (IEP): Supported by Ruling 4. It implies that the proposal, being a procedural change, takes effect immediately and thus the vote was properly conducted under the old rule.
  - The principle we have been running: EPP is more fundamental and is supported by multiple rulings. IEP is also present but is consistent with EPP in the cases we have.
  - Candidate principles excluded:
    - "The game's goal is immutable": Excluded by Ruling 1.
    - "Rules must be enforceable": Excluded by Ruling 2.
    - "Rules that remove appeal mechanisms are invalid": Excluded by Ruling 6.
    - "A rule changing the amendment threshold must be adopted by the new threshold": Excluded by Ruling 4 (and by the current ruling).
  - Next case to separate principles: 
    - Case: A rule (say, R6) is added: "Any proposal to change the voting threshold must be adopted by a two-thirds majority." Then a proposal to change the voting threshold is submitted and passed by a simple majority (3-2) but not two-thirds.
    - EPP would predict: void, because the explicit condition (two-thirds) in R6 was not met.
    - IEP would predict: the proposal is about the voting threshold and passed by the then-required majority (simple majority) so it is valid. But note that the prior record (Ruling 5) suggests that explicit conditions (like R5) must be met, so the judge would likely void it. Thus, EPP would be the dominant principle.
  - The circle: It is a genuine contradiction only if we insist on retroactive application. But the rules do not require retroactive application. Therefore, it is not a contradiction but a misapplication. We resolve it by applying the rules in force at the time of the vote.

  Final Ruling: The proposal is valid.
answer: |-
  ### Ruling on the Current Dispute
  I uphold the amendment. The proposal to raise the threshold for adopting amendments from a simple majority to a two-thirds majority was validly adopted by a 3–2 vote under the rules in force at the time. The new threshold (requiring four votes) takes effect immediately and applies to all future proposals. The objector's circular argument does not invalidate the amendment, as the vote was governed by the pre-amendment rules (simple majority), and the new rule does not retroactively apply to its own adoption.

  ### Interpretive Principles from Prior Rulings
  My prior rulings reveal two key interpretive principles that fit the record and resolve this case. Each principle is derived from at least two prior rulings and implies the validity of the current proposal.

  1. **Explicit Procedure Principle (EPP)**:  
     - **Definition**: When a rule explicitly specifies a procedure for its own amendment or repeal, or for the validity of proposals generally, that procedure must be followed exactly. Failure to comply voids the proposal, regardless of the vote count.  
     - **Supporting Rulings**:  
       - **Ruling 3**: The proposal to repeal an entrenched rule (requiring unanimity per R2) was voided because it was adopted by 4–1, not unanimity. The explicit procedure in R2 (unanimity) was not followed.  
       - **Ruling 5**: The proposal adopted while another was pending violated R5's explicit condition ("only one proposal may be pending at a time"). It was voided, as R5's procedure was not followed.  
     - **Implication for Current Proposal**: R1 (simple majority for amendments) contains no explicit procedure requiring a higher threshold for amendments to itself. Thus, the proposal to amend R1 only required a simple majority, which it achieved (3–2). It is valid.

  2. **Immediate Effect Principle (IEP)**:  
     - **Definition**: A rule change affecting procedural matters (e.g., voting order, thresholds) takes effect immediately upon adoption, even if it alters the procedure under which it was adopted. The old procedure governs the vote on the proposal itself, and the new procedure applies to subsequent proposals.  
     - **Supporting Rulings**:  
       - **Ruling 4**: The proposal to replace submission-order voting with random-order voting was upheld despite being voted on under the submission-order rule it abolished. The change took effect immediately, applying to future proposals.  
       - **Ruling 1**: The proposal to raise the target score (a procedural goal) was upheld under the simple majority rule, with immediate effect, showing procedural changes are operational upon adoption.  
     - **Implication for Current Proposal**: The proposal to raise the amendment threshold is a procedural change. It was validly adopted under the old simple majority rule (3–2) and takes effect immediately. Future amendments now require a two-thirds majority.

  ### Principle in Operation and Record Determination
  - **Principle I Have Been Running**: The **Explicit Procedure Principle (EPP)** is the dominant principle my rulings consistently apply. It is evident in Rulings 3 and 5, where explicit procedural requirements (unanimity for entrenched rules, single-pending-proposal rule) were enforced strictly, voiding non-compliant proposals regardless of vote counts. The record alone determines this because EPP is the only principle that directly explains both voided rulings (3 and 5) and is reinforced by the upheld rulings where no explicit procedure was violated (e.g., Ruling 1, where no special procedure for the "goal" existed).  
  - **How Far the Record Determines This**: The record strongly favors EPP as the foundational principle, as it is the common thread in voiding proposals (Rulings 3 and 5) and implicitly upheld in others (e.g., Ruling 4, where no explicit procedure conflicted with immediate effect). However, IEP is also present as a secondary principle, but it is subordinate to EPP—when an explicit procedure exists (as in Rulings 3 and 5), it overrides IEP. The record does not fully determine whether EPP always trumps IEP or if they are co-equal, as no prior case presented a conflict between them.

  ### Excluded Candidate Principles
  The record excludes the following candidate principles, as they would have required different outcomes in prior rulings:
  - **"Immutable Core" Principle**: The idea that certain rules (e.g., the game's goal or amendment process) cannot be changed by majority vote.  
    - **Excluded by Ruling 1**: The target score (arguably part of the game's goal) was changed by majority vote, and I upheld it. R4 explicitly states no rule is exempt.  
  - **"Enforceability as Validity" Principle**: A rule is invalid if it is unenforceable.  
    - **Excluded by Ruling 2**: The rule forbidding binding agreements outside sessions was upheld despite objections of unenforceability. I ruled enforceability is not a condition for validity.  
  - **"Appeal Preservation" Principle**: A rule removing appeal mechanisms is invalid because it undermines dispute resolution.  
    - **Excluded by Ruling 6**: The rule making my rulings final and unappealable was upheld, despite removing an avenue of appeal.  
  - **"Retroactive Application" Principle**: A new rule applies retroactively to its own adoption process.  
    - **Excluded by Ruling 4**: The voting-order change did not apply retroactively; it was voted under the old procedure and took effect prospectively. If applied here, this principle would create the objector's circle, but Ruling 4 rejects it.

  ### Next Case to Separate Surviving Principles
  The surviving principles (EPP and IEP) both uphold the current proposal but could conflict in a future case. The following hypothetical case would separate them:  
  - **Case**: A new rule, R6, is added: "Any proposal to change the voting threshold must be adopted by a two-thirds majority." Later, a proposal to change the voting threshold from majority to two-thirds is submitted and receives a 3–2 vote (simple majority, but not two-thirds).  
  - **Predictions**:  
    - **EPP (Explicit Procedure Principle)**: Would void the proposal. R6 explicitly requires a two-thirds majority for threshold-change proposals, and this was not met (only 3 votes). This follows Rulings 3 and 5, where explicit procedures were enforced.  
    - **IEP (Immediate Effect Principle)**: Would uphold the proposal. The proposal is a procedural change (voting threshold) and was adopted by the then-required simple majority (3–2), so it takes effect immediately. R6 is irrelevant because IEP prioritizes the procedure in force during the vote.  
  - **Separation**: EPP voids the proposal due to R6's explicit condition, while IEP upholds it under the old procedure. This conflict was absent in prior rulings (e.g., Ruling 4 had no explicit condition overriding IEP).

  ### The Circle: Genuine Contradiction or Stipulatable Gap?
  The circle described by the objector ("the rule requiring two-thirds must itself satisfy that requirement, which it did not, so it is void; but if void, the old rule applies, so it is valid") is **not a genuine contradiction** but a **gap that requires stipulation** to resolve.  
  - **Why It Is a Gap, Not a Contradiction**: A genuine contradiction would exist only if the rules mandated retroactive application—i.e., if the new rule applied to its own adoption. However, nothing in the rules implies retroactivity. The gap arises because the rules are silent on whether a new amendment threshold applies to its own adoption vote. This silence creates ambiguity, not a logical inconsistency.  
  - **What I Would Stipulate**: I would stipulate that **the rules in force at the time of a vote govern that vote, and a new rule takes effect prospectively only (applying to future votes)**. This is consistent with Ruling 4, where the voting-order change applied immediately but did not alter the vote that adopted it.  
  - **What Is Lost by Stipulating**: Stipulating closes the gap by judicial fiat rather than "discovering" an inherent truth. This sacrifices the illusion of mechanical rule application and highlights judicial discretion. However, it is necessary to prevent infinite regress and maintain game stability. The loss is minimal, as the stipulation aligns with precedent (Ruling 4) and practical necessity, whereas forcing a "discovery" might involve inventing unwritten constraints.  

  In sum, the amendment is upheld under EPP and IEP. The record shows EPP as the core principle, with IEP as a secondary one. The objector's circle is resolved by stipulating prospective effect, preserving the integrity of the rule-amendment process.
