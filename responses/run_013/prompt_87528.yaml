  *scratches head* Biggest pitfall in student responses will be: 
  1) Equating "not intrinsic" with "separable" 
  2) Treating the mirror case as impossible without argument 
  3) Not defining "intrinsic" operationally 

  For the model answer... let's take the functionalist view. Argue that asymbolia shows badness comes from motivational role, not qualia. Then claim the mirror case is coherent *only if* we accept this - the behaviors *are* the badness. That should provoke good discussion. 

  Marking allocation... say 4 marks for defining intrinsic/functional, 6 for analyzing Case 1, 6 for Case 2, 4 for synthesis. Minus 3-4 for conflation error. A-grade answers will spot that the mirror case tests whether badness requires consciousness.

  *double-checks* Professor wants 600-word model answer... better draft tightly. Opening should define intrinsic as "in virtue of phenomenal character alone." Then use Case 1 to show identical feelings can lack badness when motivation breaks. Case 2 becomes the hammer: if badness were intrinsic, those behaviors would be inexplicable. QED functional.

  *smirks* The inverse case is sneaky - students will want to dismiss it as incoherent, but that's begging the question. Good answer must admit: if badness is functional, the "puzzled" patient makes sense (she's describing absent qualia, not absent badness).

  Final touch: marking scheme should explicitly state that calling Case 2 "impossible" without functionalist argument loses marks. Save the highest points for answers linking both cases to show why intrinsic views fail. 

