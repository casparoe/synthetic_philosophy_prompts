answer: |-
  ## The Bell of Arras: A Dialogue

  **Setting:** A dimly lit conference room in the city archives. Dust motes dance in the slanted afternoon light. Folders labeled "Bell Restoration Project - Legal Dispute" sit on the table. **Alex** (Constitutionalist) and **Sam** (Sortal Relativist) face each other.

  **Alex:** (Leaning forward, tapping the case summary) Sam, this bell case is *perfect* for exposing the flaw in sheer relativism. Forget statues and lumps – here we have concrete, high-stakes differences. The Heritage Office claims the *Fourteenth-Century Monument* survives. The Music Foundation claims the *Arras Cathedral Bell* survives. We *must* acknowledge two distinct entities coinciding here: the historical monument-object and the functional bell-object. The restoration proves it.

  **Sam:** (Smiling slightly) Alex, I admire your consistency, but you’re seeing duality where there’s only unity under different aspects. There’s *one* object: the bell-monument. "Monument" and "bell" are sortal concepts we use to track different kinds of continuity *of that single object*. The legal dispute isn’t about *what exists*, but about *which sortal concept governs ownership* in this context of radical change. Multiplying entities is unnecessary ontological baggage.

  **Alex:** Baggage? Look at the clapper! The very first step. They replace the worn-out iron clapper with a modern alloy replica. Does the *historical monument* cease to exist because a replaceable internal part is swapped? Of course not! Its identity is tied to its historical significance, its inscription, its place in the city’s narrative. But the *functional bell*? Its identity is tied to producing a specific sound. The original clapper was integral to *its* acoustic profile. Replacing it arguably creates a slightly different functional object. The Music Foundation’s concern starts here – the bell-object’s persistence conditions are violated sooner.

  **Sam:** Ah, but that’s precisely where sortal relativity clarifies things. Under the *monumental* sortal "14th-Century Protected Monument," replacing a non-structural, functional component like the clapper is irrelevant to persistence. Its historical essence – shape, inscription, context, *overall* sound profile – remains intact. Under the *functional* sortal "Arras Cathedral Bell," the clapper *is* critical. But this doesn’t mean we have two objects! It means we have one object whose continuity as *a functional bell* is interrupted by the clapper change, while its continuity as *a historic artifact* is undisturbed. It’s the *description* ("is it still the same bell?") that shifts, not the object itself. The Music Foundation worries the functional continuity is broken; the Heritage Office knows the historical continuity isn’t. Conflict of *interests*, not *objects*.

  **Alex:** Fine, concede the clapper for now. But the bronze shell! Corrosion eats away at the original 14th-century bronze. Piece by piece, they replace it with a new alloy, meticulously copying shape, inscription, even the acoustic resonance. The Heritage Office declares the *Monument* survives. I agree! Its persistence conditions, tied to historical and cultural continuity embodied in its form and significance, are satisfied. But the *original lump of bronze* – the particular parcel of matter crafted in the 1300s? It’s *gone*, Sam! Dissolved, replaced atom by atom. It cannot survive the replacement of its very substance. What survives is the *statue-monument*, now constituted by new matter. The Music Foundation is right to be wary: the *original bell-object*, intimately tied to that specific bronze, *doesn’t* survive this process. Its matter-based persistence conditions are violated. Hence, two things: the enduring monument and the destroyed lump/bell-object.

  **Sam:** You’re begging the question by assuming the "lump/bell-object" *must* have matter-essential persistence conditions. Why? Sortals define persistence. Under the sortal "Arras Cathedral Bell," what matters is the continuity of its *functional role and acoustic identity*. If the restoration perfectly preserves the shape, inscription, and crucially, the *sound* – the very essence of being *that bell* – then under *that* sortal, it survives. Gradual replacement maintains the functional and acoustic continuity. The original matter is significant *only* under the *historical artifact* sortal, and even there, it’s often not absolute – think of the Ship of Theseus! The Heritage Office uses "monument" to emphasize historical continuity of form and significance; the Music Foundation uses "bell" to emphasize functional and acoustic continuity. Both are valid ways of tracing the *single object* through time. The apparent "destruction" of the lump is just you switching *to* a sortal ("specific parcel of matter") that the restorers deliberately abandoned in favor of preserving higher-order properties.

  **Alex:** But the modal properties expose the duality! Consider a counterfactual: *before* any restoration, could the *lump of bronze* survive being melted down and recast into, say, a cannon? Absolutely. It’s just bronze. But could the *statue-monument* survive that? Impossible! Melting destroys its historical form and significance. Similarly, *could* the *functional bell* survive being melted and recast? Only if the new object perfectly replicated the sound, which is unlikely but perhaps conceivable in principle. But the *monument* couldn’t. These divergent modal profiles – what *could* happen to them – prove they are distinct entities with different essential properties. One is essentially historical-formed; the other is essentially bronze (or perhaps functionally sonic).

  **Sam:** Divergent modal profiles under *different descriptions*, Alex! You’re confusing properties of the object with properties defined *relative to a sortal*. Take the single object, O. *Under the sortal 'Specific Parcel of 14th-C Bronze'*, O could survive melting and recasting. *Under the sortal 'Protected Historical Monument'*, O could *not* survive melting and recasting. *Under the sortal 'Arras Cathedral Bell'*, O *might* survive melting and recasting *if* the sound is preserved, but it’s highly improbable. The modal differences arise from applying *different criteria* (different sortals) to the *same* object in different hypothetical scenarios. It doesn’t follow that O is multiple entities. It follows that O has different persistence conditions *depending on how we choose to conceptualize it*. The legal dispute hinges on which conceptualization – monumental continuity or functional/bell continuity – should determine ownership *after* a process that challenges both.

  **Alex:** Your "single object O" is doing too much work, Sam. It’s a bare particular devoid of inherent identity. You reduce persistence to mere convention based on the sortal we pick. But the world *constrains* us! The reason the Heritage Office insists it survives is grounded in the real, continuous history and cultural significance embodied *in that form*, regardless of the matter supporting it *now*. The Music Foundation’s claim is grounded in the real, continuous sonic function – a function potentially disrupted by the clapper change and radically challenged by the matter swap, regardless of historical narratives. These are real, distinct grounding facts about the world that correspond to two distinct, coincident objects.

  **Sam:** And your "two objects" is multiplying entities beyond necessity, Alex. Occam’s Razor. The "grounding facts" you cite – historical significance embodied in form, functional sonic identity – are properties *of the object*, not evidence for distinct objects. An object can have multiple, sometimes competing, properties that become relevant under different sortals during processes of change. The constraint comes from the *coherence* of the sortal application and the actual continuity of the relevant properties. The restoration aimed for and (arguably) achieved continuity under *both* sortals: the form/history *and* the function/sound persist. The conflict arises because the process *strained* both concepts, not because it revealed two things.

  **The Stalemate:**

  **Alex:** So, for you, Sam, victory means showing that *all* apparent differences in persistence conditions and modal properties are *merely* artifacts of shifting linguistic or conceptual frameworks (sortals), with no need for distinct entities. The object is fundamentally one, its identity path flexible based on description.

  **Sam:** And for you, Alex, victory means demonstrating that the differences in what can survive what changes – like the clapper swap, the matter replacement, the melting counterfactual – are *inescapable* and *irreducible* to perspective. They *require* two distinct entities coinciding, each bearing its own essential properties and persistence conditions, regardless of how we describe them.

  **Alex:** Precisely. The bell’s corrosion, and the conflicting claims it sparks, reveals a fissure in reality itself – a point where two things occupying the same space peel apart under pressure.

  **Sam:** And I see it revealing a fissure in our *concepts* – a point where our different ways of tracing identity through time clash, forcing us to decide which continuity matters most, for the single thing that endured the change.

  **Both:** (Silence, looking at the case file. The dispute remains, reflecting the unresolved tension in the metaphysics of persistence.)
