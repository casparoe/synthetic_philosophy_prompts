prompt: |-
  I'm working through Adam Smith's Theory of Moral Sentiments, the bit in Part II about how fortune affects our moral sentiments, and I keep getting tangled in it. Heres the gist as I understand it: whether an action deserves praise or blame depends entirely on the intention it came from, so someone who meant well deserves the same credit whether or not things worked out. But our actual feelings dont behave that way. We're grateful to whoever actually helped us, resentful at whoever actually hurt us, and someone who tried to do harm but was stopped by a lucky accident strikes us as less blameworthy than a person whose identical intent went through. Smith treats this as a disorder in our sentiments, then says it isnt altogether useless, since it keeps us from being too pleased with ourselves and makes us more cautious, and nature seems to have planted it in us on purpose.

  What I cant work out: does he think the intention-only view is the truth about desert and our luck-tracking feelings are just a useful error, or does he think the luck-tracking feelings are also right about desert? And if the point of the irregularity is its good social effects, has he quietly switched from a question about what people deserve to a question about what feelings are useful to have? Help me get clear on whether these are two consistent strands in him or one strand with a confusion in it. Keep it focused, I dont need a survey of the secondary literature.
reasoning: |-
  Okay, let me tackle this user's query about Adam Smith's Theory of Moral Sentiments. They're struggling with the tension between two ideas: whether moral desert is solely based on intention versus how our feelings are influenced by outcomes. The user has summarized Smith's points well but is confused about whether Smith sees outcome-influenced sentiments as a useful error or as also valid. They also question if Smith shifts from desert to utility without realizing it.

  First, I need to recall Smith's arguments in Part II. He clearly states that merit/demerit depends entirely on intention. That's the philosophical baseline. But then he observes that humans naturally feel stronger gratitude or resentment based on outcomes. Smith calls this an "irregularity," implying it's a deviation from the ideal standard.

  The user's main confusion is whether Smith thinks both perspectives are valid. From my reading, Smith maintains the intention-based desert as the true standard. The outcome-based reactions are psychological facts, not moral truths. He explicitly labels them as "irregularities," suggesting they're distortions of proper judgment.

  But then why does Smith justify these irregularities by their social utility? That's where the user senses a shift from "what is deserved" to "what is useful." Here's the key: Smith operates on two levels. The normative level (what deserves praise/blame) remains intention-based. The descriptive level (how humans actually react) includes outcome bias, which he then explains teleologically – as nature's design for social benefit.

  The user might be missing that Smith isn't equivocating; he's distinguishing between ideal judgment and psychological reality. The utility argument isn't a moral justification but an explanation for why evolution might favor this bias. 

  I should emphasize Smith's distinction between the "impartial spectator" (which corrects for outcomes) and raw human sentiment (which doesn't). The spectator represents the adjusted moral standard. This clarifies that outcome-influenced feelings aren't morally authoritative, even if they're ingrained.

  The user also seems concerned about inconsistency. But Smith's structure is consistent: 1) Establish the ideal standard (intention), 2) Observe deviations (outcome bias), 3) Explain deviations via social utility without validating them morally. The "useful error" framing captures this perfectly.

  I should avoid diving into secondary literature as requested. Focus on primary text evidence: Smith's terms like "irregularity," his spectator theory, and his functional explanation. Highlight how utility serves as an explanation, not a moral argument. That should resolve the user's confusion about switched frameworks.
answer: |-
  You've nailed the core tension in Smith's argument. Let's clarify his position based strictly on *The Theory of Moral Sentiments* (TMS), Part II, Section III, Chapters 1-3:

  1.  **The Philosophical Truth of Desert (Intention-Only):** Smith unequivocally states that the *only* proper basis for moral praise or blame is **intention and motive**.
      *   "The sole object for which we either praise or blame any man is the intention or affection of the heart, from which any action proceeds." (TMS II.iii.intro.4)
      *   "The person himself who either accidentally, or by the force of his passions, is betrayed into any action which, if it had proceeded from cool deliberation, would be justly regarded as the most atrocious crime, looks upon it with the same abhorrence, and is as sincerely afflicted and penitent for it, as if it had actually produced all the mischief which he intended." (TMS II.iii.3.1)
      *   **This is the "real" or "proper" standard of merit and demerit.** It's the judgment of the "impartial spectator" *corrected* for the influence of fortune.

  2.  **The Psychological Reality (Luck-Tracking Feelings):** Smith equally unequivocally observes that our *actual, immediate sentiments* **do not follow this standard.** We feel gratitude/resentment strongly based on outcomes.
      *   "Nature, however, when she implanted the seeds of this irregularity in the human breast, seems... to have intended the happiness and perfection of the species." (TMS II.iii.3.1 - note "irregularity").
      *   "The person who has been injured, feels a resentment which is never perfectly appeased till the offender has not only sorrow but repentance for his offence..." (TMS II.iii.1.5 - implying the *act* matters to feeling).
      *   **These feelings are "irregular" compared to the proper standard.** They are a fact of human psychology.

  3.  **The Status of the "Irregularity":** Smith calls these luck-tracking feelings an "irregularity" or "disorder" **specifically in relation to the intention-only standard.** They are a *deviation* from the philosophical truth of desert.
      *   "That this irregularity of sentiment... is, upon most occasions, extremely pernicious... may be demonstrated..." (TMS II.iii.3.1 - he immediately follows this with the "BUT" about utility).
      *   **They are a "useful error" *psychologically*, not a moral truth.** They are an error *relative to the standard of desert*.

  4.  **The Explanation: Utility, Not Moral Truth:** Smith explicitly shifts the framework when explaining *why* this irregularity exists. He moves from "what deserves praise/blame?" to **"what psychological mechanism promotes social order?"**
      *   "But if we consider the general rules by which external prosperity and adversity are commonly distributed in this life, we shall find, that notwithstanding the disorder in which all things appear to be involved, yet even here every virtue naturally meets with its proper reward..." (TMS II.iii.3.2 - note the shift to consequences).
      *   "Nature, therefore, has wisely judged, that the distinction of ranks, the peace and order of society, would rest more securely upon the plain and palpable difference of birth and fortune..." (TMS II.iii.3.3 - utility clearly stated).
      *   The point about humility ("keeps us from being too pleased with ourselves") and caution *is entirely framed in terms of their beneficial effects on individual prudence and social cohesion.*
      *   **He does not argue that the outcome makes the intention *morally* better or worse.** He argues that our *feeling* stronger gratitude/resentment based on outcomes *serves a useful purpose*, implanted by nature (or Providence) for the good of society.

  **Answering Your Questions Directly:**

  *   **Does he think the intention-only view is the truth?** **Yes.** It is the "proper" standard of merit and demerit.
  *   **Are the luck-tracking feelings also right about desert?** **No.** They are a psychological "irregularity" or "disorder" *relative to that standard.* They are not an alternative moral truth.
  *   **Has he switched from desert to utility?** **Yes, explicitly and deliberately.** He doesn't try to sneak the utility argument into the *definition* of desert. He establishes the intention-based desert standard first. *Then* he observes the psychological irregularity. *Then* he explains *why that irregularity exists* by appealing to its beneficial social and psychological *consequences* (utility).
  *   **Two consistent strands or one with confusion?** **Two consistent strands operating in different registers:**
      1.  **Normative Ethics (Desert):** What *truly* merits praise/blame? Answer: Intention/motive alone. This is the standard for the impartial spectator.
      2.  **Moral Psychology & Social Theory (Utility):** How do humans *actually* react, and why is that reaction pattern (including its deviation from the normative standard) *beneficial* for individuals and society? Answer: Outcome-influenced sentiments are ingrained by nature because they promote caution, humility, respect for social order, and efficient allocation of praise/blame based on *visible* effects.

  **Conclusion:** Smith is not confused. He clearly distinguishes:
  1.  **The Ideal Standard:** Desert is based solely on intention (philosophical truth).
  2.  **The Human Reality:** Our immediate sentiments strongly track luck/outcome (psychological fact).
  3.  **The Explanation:** This psychological fact, while an *irregularity* relative to the ideal standard, exists because it has *utilitarian* value for social stability and individual prudence. He justifies the *existence* of the irregular sentiment on grounds of utility, not on grounds that it reveals a deeper truth about desert. The "truth about desert" remains firmly intention-based. The utility argument explains the *psychological phenomenon*, not the *moral standard*.
