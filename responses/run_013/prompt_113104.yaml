prompt: |-
  I'm a second-year PhD student in political theory working on the ethics of migration, and I have a recurring arguement with my supervisor that I'd like you to help me settle. Before she came to philosophy she spent the better part of a decade doing refugee status determination, and she has a pretty consistent track record on the hypotheticals we run through in supervision. A dissident journalist who'd be imprisoned at home: we owe him admission. A woman whose ex-husband has threatened to kill her and whose local police are on his payroll: admission. A young man from a country in the middle of a civil war, nobody in particular after him, who mostly just wants away from the shelling: no obligation, and when I push she says things like who is actually doing this to him. A family that came because the wages here are five times what they'd earn at home: no obligation. A religious minority that a militia is hunting and that the army can't reach in time: admission. A man from a country whose government has simply collapsed, no persecutor, no working police, dangerous roads for everyone: she says no, and her reason here is a different one, something like everyone there is having a terrible time, that doesn't make it a claim on us. And a guy a criminal gang has singled out for extortion and beatings, with the police taking the gang's money: admission. I've noticed her refusals always come with one of two justifications and I genuinely can't tell which one is doing the real work. Either there's no agent persecuting you (call it the persecutor rule), or else your predicament isn't specific to you and your own state can't or won't protect you (call it the protection-gap rule). Both seem to fit every case above, which is annoying.

  Here are the new ones. First, a coastal community in a low-lying country where the wells have gone salty and the land floods several times a year now; nobody is doing this to them, but there's no relocatoin plan and staying means destitution, and the harm is pretty clearly specific to coastal communities like theirs. Second, a valley community about to be flooded out by a big dam the government is building — no one intends them any harm, it's a development project, but they lose everything and the state is the one doing it.

  What does she say about each, and which rule is she really running? I'd rather have your best guess with the reasons for it than a fence-sit. If the two rules come apart on these cases, tell me which single further case would separate them most cleanly — I keep thinking it has something to do with whether a state that is willing and able to protect you defeats the claim even when there is a real persecutor, but I'm not sure that's the sharpest test, and I'd also like to know which of the two new cases is the closer analog to which of her earlier rulings. And please be honest about whether her track record actually underdetermines this, or whether there's a third rule I'm missing that fits her verdicts at least as well as the two I've named.
reasoning: |-
  Okay, let me try to figure out what's going on with this PhD student's supervisor. They have a pattern of decisions on migration cases, and the student is trying to decipher the underlying principle. The supervisor has two justifications: the persecutor rule (no agent persecuting) and the protection-gap rule (predicament not specific, state can't protect). Both seem to fit all the cases so far, which is frustrating.

  Looking at the new cases: coastal community affected by climate change (salty wells, flooding) and a valley community displaced by a government dam project. The student wants to know how the supervisor would rule and which rule is actually driving her decisions.

  First, I need to analyze the supervisor's past decisions. The cases where she grants admission involve a clear persecutor (dissident journalist, threatened woman, targeted religious minority, extortion victim). The denials are when there's no specific persecutor (civil war young man, economic migrant, failed state man). The protection-gap rule also fits - in admission cases, the state is either the persecutor or unable/unwilling to protect, creating a gap. In denials, either the harm is general (civil war) or there's no state to create a protection gap (failed state).

  For the coastal community (climate change): no persecutor, harm is environmental. But the harm is specific to coastal communities. However, since no one is actively persecuting them and the state isn't failing to protect in a targeted way, she'd likely say no admission. The persecutor rule is clearly violated here.

  The dam case is trickier. The state is actively displacing them, but without intent to harm (development project). Is the state a persecutor? Not by traditional definition. But the state is causing harm and not protecting them from it. This might trigger the protection-gap rule since the state is creating the harm and not providing adequate protection/compensation. But the supervisor might still deny admission if she sees this as general state action without targeted harm.

  I'm leaning toward the persecutor rule being primary because it cleanly handles the dam case (no persecutor → no admission). But the protection-gap rule could go either way. Maybe a test case: a journalist targeted by a state that is willing to protect him? But if the state can protect, why would he need to flee? That's messy.

  A better test case: a natural disaster where the state is overwhelmed but willing to help. No persecutor, general harm → no admission. Or a corrupt official targeting someone, with the state unable to protect. Persecutor exists → admission. This would confirm persecutor rule is key.

  The dam case is closer to the civil war/failed state cases - harm without a persecutor. Coastal community is like the economic migrant - environmental harm rather than economic. Both new cases likely denied, with persecutor rule being decisive.
answer: |-
  Based on your supervisor's consistent pattern and the specific justifications she provides, here's a decisive analysis of her likely rulings on the new cases, the underlying rule driving her decisions, a proposed test case to separate the rules, and how the new cases map onto her prior reasoning:

  ### 1. **Predictions for New Cases**  
     - **Coastal Community (Climate Change):**  
       **Her Likely Verdict: NO obligation to admit.**  
       *Her Reasoning:* "Nobody is *doing* this to them. The rising sea levels aren't an agent enacting persecution—it's a systemic environmental shift. Their state isn’t *refusing* to protect them; it may be unable to address a global problem. The harm, while specific to coastal regions, isn’t targeted persecution by a *deliberate actor*."  
       *(Closest Analog:* The "civil war young man" or "failed state" case—generalized harm without a persecutor.)  

     - **Valley Community (Dam Displacement):**  
       **Her Likely Verdict: NO obligation to admit.**  
       *Her Reasoning:* "The state isn’t *persecuting* them; it’s pursuing development. There’s no *intent* to harm, even if harm occurs. The state might offer compensation or resettlement (even if inadequate)—this is a domestic policy failure, not a *protection gap* where the state refuses/abandons them to a persecutor."  
       *(Closest Analog:* The "economic migrant" case—state action causing harm without persecutory intent, or the "failed state" case where the state isn’t malicious but dysfunctional.)  

  ---

  ### 2. **The Real Rule: Persecutor Primacy**  
  Your supervisor’s decisions are **best explained by the *persecutor rule***, not the protection-gap rule. Here’s why:  
  - **Persecutor Rule as Driver:**  
    - In every case where she grants admission (dissident, abused woman, religious minority, extortion victim), there is a **clear, identifiable persecutor** (state, militia, ex-husband, gang).  
    - In every denial, there is **no persecutor**: civil war (chaos, no agent targeting), economic migrant (structural inequality), failed state (anarchy), and now climate/displacement (natural/developmental causes).  
    - Her language ("*who is actually doing this to him?*") reveals her emphasis on agency. Harm without a *culpable agent* doesn’t trigger an obligation.  

  - **Why Protection-Gap Rule *Fits* but Isn’t Primary:**  
    - The protection-gap rule *correlates* because persecutors often create protection gaps. But it **fails to explain her denials** in the "failed state" and "dam" cases:  
      - In the failed state, there *is* a protection gap (no state to protect anyone), yet she denies.  
      - In the dam case, the state *is* the cause of harm and may fail to protect, yet she’d likely deny.  
    - Her protection-gap framing ("*your state can't or won’t protect you*") is **subordinate to persecutor presence**. If no persecutor exists, the "gap" is irrelevant.  

  ---

  ### 3. **A Test Case to Separate the Rules**  
  To definitively isolate persecutor vs. protection-gap primacy, propose this:  
  > **"A journalist critical of a democratic state receives death threats from a *private extremist group*. The state is *willing and able* to protect her, but she flees preemptively due to fear of a lone-wolf attack."**  

  - **Persecutor Rule Prediction:**  
    Admission **granted**. There’s a clear persecutor (extremist group). The state’s ability to protect doesn’t negate the persecutor’s existence.  
    *Her likely quote:* "Someone *is* targeting her. The state’s willingness doesn’t erase the threat."  

  - **Protection-Gap Rule Prediction:**  
    Admission **denied**. The state can and will protect her—no gap exists.  
    *Her likely quote:* "Her state is capable of shielding her; this isn’t our duty."  

  **If she admits**, persecutor rule dominates. **If she denies**, protection-gap dominates. Given her record, I predict she’d **admit** here, confirming persecutor primacy.  

  ---

  ### 4. Is Her Record Underdetermined?  
  No—**persecutor rule is the cleanest fit**. A "third rule" isn’t needed, but her logic has a nuance:  
  - **Nuance:** Persecution must be **targeted and agent-driven**. Harm from non-agents (climate, economics, chaos) or non-malicious state action (dams) doesn’t count, even if severe. This isn’t a new rule; it’s persecutor rule + intent/agency qualifiers.  

  ### Key Takeaways:  
  - **Her Core Principle:** Admission requires a **culpable agent actively persecuting** the individual/group.  
  - **Climate/Dam Cases:** Both denied—they lack a persecutor. Climate aligns with "civil war" (generalized harm); dam aligns with "economic migrant" (state causing harm without persecutory intent).  
  - **Test Case:** Use the "journalist with state protection" hypothetical to force the rules apart.  

  This should settle your argument: her track record points unambiguously to the persecutor rule as foundational. If she surprises you on the test case, update—but I’d bet on persecutor primacy. Good luck with the thesis!
