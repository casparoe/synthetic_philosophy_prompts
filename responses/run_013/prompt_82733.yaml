prompt: |-
  I am an analyst on a long-horizon risk team, and I keep running into a difficulty that I would like explained as a conceptual matter rather than settled with more data. My colleagues are comfortable with probability and regression and much less comfortable with the philosophy of statistics, so I want an explanation of the joints of the problem: argumentative rather than a survey, and not a reading list — no citations, no names of researchers, no bibliography, and no appeal to what some named authority has said.

  The setting. Suppose a register of polity-episodes, with the following rule of entry and exit: an episode opens when a single sovereign authority is established over a named core territory, and it closes when that authority is replaced — by conquest, partition, dynastic extinction, or internal reconstitution — by a different one. Treat the rule as given for now; part of what I want explained is how much it is quietly assuming. Take the following figures as stipulated rather than as claims about the actual historical record: 240 closed episodes and 31 open ones; the closed episodes have a median duration of 140 years; roughly one closed episode in nine reaches 300 years; among those that reach 300, the median total duration is 620 years; the 31 open episodes have a median current age of 210 years; and the probability of closure, estimated from the closed episodes, declines rather than rises with age.

  Two analysts look at this table. The first says: our subject is a 300-year-old order, and among episodes that reached 300 half were over by 620, so its median remaining life is around 320 years — but the figure that ought to discipline our expectations is the unconditional one, since half of all episodes are over by 140 years, and a median computed over the long-lived tells us about the long-lived rather than about our subject. The second says: read the hazard off the register; it declines with age; therefore the longer an order has already lasted, the longer it will last in total, and a median drawn from the whole register describes a different population from the one we are asking about. They are working from the same table.

  What I want explained:

  1. What the two analysts are actually disagreeing about, ordered from the superficial to the deep. I do not want the answer to be that they use different base rates; I want the locus of the disagreement named precisely, including where each of them is relying on something the register cannot supply.

  2. Whether the disagreement is empirical or conceptual: is there a body of data that would settle it, or is there a reason why data of this kind cannot settle it? Be specific about which of the difficulties are difficulties about the world and which are difficulties about the partition of the world.

  3. The reference class problem as it bites here, and in particular how the entry-and-exit rule individuates episodes. What must the rule assume about when a political order is the same order over time, and why does that assumption affect the base rate rather than merely the bookkeeping?

  4. What follows from the open episodes being open. Explain what the 31 unfinished episodes can and cannot contribute — including any selection or sampling effect that makes the set of orders standing today unrepresentative of the orders in the register, and any assumption of exchangeability between finished and unfinished episodes that the first analyst's conditional median requires.

  5. A minimal constructed example, three or four lines, in which one body of duration data yields opposite outside-view forecasts under two defensible readings — something I can put on a slide to show my colleagues that the difficulty is not a failure of care on anyone's part.

  6. What would have to be true for an outside-view forecast about a still-standing order to be well-posed at all; and if those conditions are not met, what the honest residue of the method is — what it can still tell me, what it cannot, and what I should say out loud when I use it anyway.

  7. Where I am most likely to be fooling myself in wanting the outside view to work here: the version of the mistake that would be most tempting to someone in my position.

  Treat the stipulated figures as fixed, and do not substitute figures from the real historical record for them. If you think the stipulation is internally incoherent — for instance, if the conditional median and the shape of the hazard cannot both hold — say so and show me exactly where the tension lies, since that would also be useful. If you need concrete historical cases to make a point about contested individuation, choose your own and keep them uncontroversial; I care about the structure of the problem, not about which empires illustrate it.
reasoning: |-
  We are given a register of polity-episodes with a specific rule for when an episode starts and ends. We have 240 closed episodes and 31 open ones. The closed episodes have a median duration of 140 years. About 1/9 of closed episodes reach 300 years, and among those that do, the median total duration is 620 years. The open episodes have a median current age of 210 years. The hazard rate (probability of closure given survival to a point) is estimated to decline with age.

  Two analysts:

  - Analyst 1: For a 300-year-old order, they note that among episodes that reached 300 years, half were over by 620 years. So the median remaining life from 300 years is 320 years (620 - 300). But they caution that the unconditional median (140 years) is what should discipline our expectations because the median of the long-lived tells us about that group, not necessarily about our subject.

  - Analyst 2: The hazard rate declines with age, so the longer an order has lasted, the longer it is expected to last in total. Therefore, using the overall median (140 years) is inappropriate because it describes a different population (all episodes) rather than the population that has survived 300 years.

  They are looking at the same data.

  We address the questions:

  1. **What they are disagreeing about, from superficial to deep:**

     - Superficial: They are disagreeing about which statistic to use: the conditional median (from the long-lived group) versus the unconditional median.

     - Deeper: They are disagreeing about the relevance of the reference class. Analyst 1 is concerned that conditioning on having reached 300 years selects for a special group (the long-lived) and that the subject might not be representative of that group. Analyst 2 believes that the subject, having reached 300 years, is now in the group for which the hazard rate is lower and hence the conditional distribution is the correct one.

     - Deepest: The disagreement is about the nature of the population and the exchangeability of the subject with the observed episodes. Analyst 1 implicitly assumes that the subject is exchangeable with the entire set of episodes (including those that died young). Analyst 2 assumes that the subject, having survived 300 years, is exchangeable only with the episodes that also survived 300 years. Moreover, there is an unstated assumption about the homogeneity of the population. If the population is homogeneous (all episodes have the same hazard function, which is decreasing), then Analyst 2 is clearly correct. However, if the population is heterogeneous (some episodes are inherently more durable than others), then the fact that an episode has survived 300 years may indicate that it is one of the more durable ones, but also that it has a lower hazard because of its type. But note: the data show a declining hazard for the closed episodes. This could be due to either:

       a) A homogeneous population with a decreasing hazard function (true duration dependence), or

       b) A heterogeneous population where each episode has a constant hazard (exponential distribution) but with different rates, leading to a declining aggregate hazard (because the high-hazard episodes die off early).

       Without knowing the source of the declining hazard, the two analysts are making different assumptions. Analyst 2 is assuming that the declining hazard is due to true duration dependence (so that the same episode becomes more durable over time). Analyst 1 is concerned that the subject might be an "average" episode (which would have died by 140 years) and that the long-lived group is a distinct set. But note: the unconditional median is 140, but we are looking at an episode that has already lived 300 years. So if the population is heterogeneous, then the subject must be one of the long-lived ones because the short-lived ones would have died earlier. Therefore, even in the heterogeneous case, the conditional distribution (on survival to 300) is the one to use. However, the problem is that the conditional median of 620 years is based on closed episodes only. There is a selection issue because the open episodes (which are at least 210 years old) are not included in the conditional median for 300-year survivors. This is the deeper issue: the use of only closed episodes for the conditional estimate.

     - What the register cannot supply: The register does not tell us the reason for the declining hazard (heterogeneity vs. true duration dependence). Also, the register does not include the open episodes in the conditional distribution for the long-lived, so we don't know how long the open episodes will last. Moreover, the rule for entry and exit assumes that we can unambiguously identify the start and end of an episode. This rule might be arbitrary and might not capture the true continuity of political orders (e.g., a reconstitution might be considered a new episode even if the underlying order is continuous). This affects the base rate because if the rule is too strict (breaking up episodes that are continuous), then we get more short episodes and the unconditional median becomes lower. Conversely, if the rule is too lenient, we get longer episodes.

  2. **Empirical or conceptual?**

     - The disagreement is both empirical and conceptual.

     - Empirical: If we could observe the entire lifetimes of the open episodes, we could see whether they behave like the closed ones that survived to 300. But we cannot because they are ongoing. Also, we don't know the future.

     - Conceptual: The core issue is the exchangeability of the open and closed episodes. If we assume that the open episodes are exchangeable with the closed ones (i.e., they are drawn from the same population and their future will be similar to the past of the closed ones that survived to the same age), then we can use the closed episodes to estimate the remaining life. But if the open episodes are not exchangeable (e.g., because the world has changed and modern states are different), then we cannot. Moreover, the declining hazard could be due to heterogeneity, and we might not have the right data to disentangle that. The rule for entry and exit is also a conceptual issue: it defines what we are counting. If the rule is arbitrary, then the base rates are arbitrary.

     - Specifically, the difficulties about the world: We cannot observe the future of the open episodes. The difficulties about the partition: How we define an episode (the rule) and how we group them (the reference class) are conceptual.

  3. **Reference class problem and the rule:**

     - The rule defines when a political order starts and ends. It assumes that we can identify a "single sovereign authority" and a "named core territory" and that the episode ends when that authority is replaced. This rule assumes that there is a clear, non-arbitrary point at which one order ends and another begins. But in reality, political orders may undergo gradual change, and the rule might be imposing a discrete structure on a continuous process.

     - How it affects the base rate: If the rule is too sensitive to minor changes (e.g., a change in dynasty without a fundamental change in the political order), then we break one long episode into many short ones. This would lower the unconditional median. Conversely, if we are too lenient, we might merge distinct episodes. The rule is not neutral: it determines the distribution of durations. Therefore, the base rate (e.g., the unconditional median of 140 years) is a function of the rule. But the subject of our prediction (a current 300-year-old order) is defined by the same rule. So if the rule is arbitrary, then the base rate is arbitrary.

     - The reference class problem: Which episodes should we compare our subject to? All episodes? Only those that reached 300 years? Only those that are similar in other ways (geography, type of regime, etc.)? The rule defines the reference class as the set of all episodes in the register. But if the register includes very different kinds of polities, then the reference class might be too broad.

  4. **What the open episodes contribute and what they cannot:**

     - The open episodes can tell us about the current age distribution of surviving episodes. We know that 31 are open and their median current age is 210 years. This information can be used to check the consistency of the model. For example, if the hazard rate is declining, we would expect to see a number of old episodes.

     - However, they cannot directly tell us about the future. We don't know how long they will last.

     - Selection effect: The set of open episodes at any time is not a random sample of all episodes. They are the ones that have survived until now. This is known as "length-biased sampling": longer episodes are more likely to be observed at a given point in time. Therefore, the open episodes are likely to have longer total lifespans than the average episode in the register (which includes many short ones). This is why the median current age of open episodes (210 years) is higher than the unconditional median of closed episodes (140 years). 

     - Exchangeability: The first analyst's conditional median (620 years for episodes that reached 300) is computed only from closed episodes. But the open episodes that are currently over 300 years (if any) are not included. Therefore, if the open episodes are exchangeable with the closed ones, then we are missing the future of the closed episodes and the entire lifetimes of the open ones. The conditional median based only on closed episodes might be biased downward because we have not observed the full lives of the long-lived open episodes. Conversely, if the open episodes are not exchangeable (e.g., because they are in a different era with lower hazards), then we cannot use the closed episodes to predict them.

  5. **Minimal constructed example:**

     - Example: Suppose we have a register of 10 closed episodes with durations: 50, 50, 50, 50, 50, 100, 100, 100, 300, 300. And one open episode currently at 200 years.

     - The unconditional median duration of closed episodes is 50 years.

     - Now consider an episode that has reached 100 years. Among closed episodes that reached 100, we have durations: 100, 100, 300, 300 (the ones that reached 100 are the ones that lasted at least 100). The median duration of these is 200 years (the average of the two middle ones: 100 and 300? Actually, the durations of the episodes that reached 100 and then closed: 100,100,300,300 -> the median is 200). So the median remaining life from 100 is 100 years (200-100).

     - But if we use the unconditional median (50 years), we would have expected the episode to have already ended.

     - Now, the open episode is at 200 years. We don't know when it will end. But if we use the conditional median from the closed episodes that reached 100, we would predict a total duration of 200, so remaining life 100 years. However, if the open episode is going to last 500 years, then the conditional median of 200 (from closed episodes) is too low.

     - The point: Without knowing the future of the open episode, we don't have the full picture. The closed episodes that reached 100 and then closed might not be representative of all episodes that reach 100 (because the open one might be longer).

  6. **Conditions for an outside-view forecast to be well-posed and the honest residue:**

     - For an outside-view forecast to be well-posed, we need:

       a) A well-defined reference class that includes the subject and for which we have data.

       b) The subject is exchangeable with the other members of the reference class.

       c) The data from the reference class are relevant (i.e., the process generating the durations is stationary over time and across the class).

       d) We have complete data or a way to account for censoring (like the open episodes).

     - If these conditions are not met:

       - What it can tell us: The outside view can still provide a baseline that we adjust with inside information. It can help avoid extreme predictions by grounding in historical experience.

       - What it cannot: It cannot give a precise, unbiased estimate without the above conditions.

       - What to say out loud: "We are using historical data from a set of polities defined by [rule]. The data show [summary]. However, the relevance of this data to our subject depends on the assumption that the subject is similar to the historical cases and that the future will resemble the past. We have accounted for the current age of the subject by conditioning on survival to 300 years, but note that our conditional estimate is based only on completed episodes and may be biased if the open episodes are systematically different. Moreover, the definition of a polity-episode may not capture the true continuity of political orders. Therefore, this estimate should be seen as a starting point for further adjustment based on specific factors."

  7. **Where you are most likely fooling yourself:**

     - The most tempting mistake is to believe that the outside view can provide an objective, unbiased estimate without having to make assumptions. In particular:

       - Assuming that the historical data (especially the closed episodes) are a complete and unbiased representation of the process that the subject is going through.

       - Ignoring the selection effect: the open episodes are the ones that have survived, so they are likely to be the more durable ones. By using only closed episodes for the conditional median, we are ignoring the open ones that have survived 300 years and may last much longer.

       - Overlooking the arbitrariness of the entry-and-exit rule: the base rates are defined by the rule, and if the rule is contested, then the base rates are not objective.

     - Another mistake: thinking that the declining hazard is necessarily due to true duration dependence (making the subject stronger with time) without considering heterogeneity (the subject was always strong and that's why it survived). But in either case, conditioning on survival is appropriate.

     - However, the key mistake in this context is the failure to incorporate the open episodes. The conditional median of 620 years for closed episodes that reached 300 might be an underestimate because the open episodes that have reached 300 (if any) are still going and might last longer than 620. But note: the open episodes have a median current age of 210, so they haven't reached 300 yet? We are told the open episodes have a median current age of 210. So some of them may be over 300? We don't know. But if we are looking at a 300-year-old order, it must be one of the open ones (since the closed ones that reached 300 are included in the conditional median). But the open ones are only 31 and we don't know their exact ages. We know the median current age is 210, so some are older. How many are over 300? We don't know. But if any are over 300, they are not included in the conditional median (which is only from closed episodes). This is a major issue.

     - So the mistake: using the conditional median from the closed episodes without accounting for the censoring of the open episodes. The correct approach would be to use survival analysis methods that account for censored data (like the Kaplan-Meier estimator). But even then, we must assume that the open episodes are exchangeable with the closed ones.

  Internal coherence check:

     - Stipulated figures:

       - Closed episodes: 240
       - Open episodes: 31
       - Closed episodes median: 140 years
       - Fraction of closed episodes that reach 300: 1/9 ≈ 0.111, so about 240/9 ≈ 26.66 -> about 27 closed episodes reached 300 years? But then the median for that group is 620.

       - Open episodes: median current age 210.

     - The hazard rate declines with age. This is consistent with the conditional median at 300 being 620 (so the remaining life is 320) because the hazard is decreasing so the expected remaining life is increasing.

     - But note: the open episodes are at a median of 210 years. If the hazard is decreasing, then we expect that the open episodes that are 210 years old have a long remaining life. However, we don't have a direct contradiction.

     - However, a potential tension: the unconditional median is 140, meaning that half of the closed episodes are below 140. But we also have that about 1/9 of closed episodes (which is about 27) reached 300. The distribution must be such that:

          - 50% of closed episodes are below 140.
          - 1/9 (about 11.1%) are above 300.

       This is possible (e.g., a distribution with a long tail).

     - Also, the open episodes are 31 and their median current age is 210. This is consistent with the declining hazard because the older episodes are more likely to survive.

     - The only potential issue is the conditional median of 620 for those that reached 300. The open episodes that are over 300 are not included. But we don't know how many open episodes are over 300. Since the median current age is 210, it is possible that few or none are over 300. So the conditional median of 620 for the closed episodes that reached 300 might be based on 27 episodes. But if there are open episodes that are over 300, they are not in that calculation. However, if there are open episodes that are over 300 and still going, then when they eventually close, they will push the conditional median above 620. Therefore, the current conditional median of 620 is a lower bound for the true median of the entire set (closed and eventually closed open episodes) of 300-year survivors? Not exactly: we don't know. But if the open ones that are over 300 are going to be very long, then the true median will be higher.

     - Therefore, the first analyst's conditional median (620) might be too low. The second analyst's approach (using the hazard) is more flexible but requires modeling. The declining hazard is consistent with the data, but we must account for censoring.

     - Conclusion: The stipulation is not internally incoherent, but the conditional median based on closed episodes alone might be biased downward for the 300-year-old open episode because we have not observed the full lifetimes of the open episodes that are over 300 (if any).

  Overall, the key takeaway is that the outside view requires careful handling of censored data and an explicit discussion of the assumptions about the reference class and exchangeability.
answer: |-
  ### 1. The Disagreement: From Superficial to Deep
  - **Superficial**: They disagree on which statistical summary to use—unconditional median (140 years) vs. conditional median (320 years remaining for 300-year-olds).
  - **Intermediate**: They disagree on the *reference class*: Analyst 1 uses the entire register (all episodes), while Analyst 2 conditions on survival to 300 years (a subset).
  - **Deep**:  
    - **Analyst 1** implicitly assumes **homogeneity**: All episodes are exchangeable samples from a single distribution. The declining hazard is an artifact of selection (fragile episodes die early), so conditioning on survival misleads by focusing on "lucky" outliers. The register cannot supply proof that the subject is inherently "long-lived" rather than temporarily lucky.  
    - **Analyst 2** assumes **heterogeneity or true duration dependence**: The declining hazard reflects a real property (e.g., stability compounds). Conditioning is essential because the subject’s survival to 300 years reveals it belongs to a subpopulation with lower risk. The register cannot supply proof that the hazard decline is inherent rather than selective.  
    - **Deepest**: They disagree on **what the hazard rate represents**. Analyst 1 sees it as emergent from population variance, Analyst 2 as a causal property of individual episodes. Both rely on untestable assumptions about the nature of political orders.

  ### 2. Empirical or Conceptual?
  - **Empirical in principle, conceptual in practice**:  
    - **Empirically resolvable** if you could observe:  
      - Full lifespans of open episodes (to see if their post-300 trajectories match closed episodes).  
      - Micro-level data on why orders collapse (to distinguish heterogeneity from duration dependence).  
    - **Conceptual barriers**:  
      - **World difficulty**: We cannot observe future durations of open episodes or rerun history.  
      - **Partition difficulty**: The entry-exit rule defines "sameness" of an order (e.g., is post-reconstitution France the same episode?). This rule is arbitrary—it fixes what counts as an episode, but cannot validate that the grouping is natural or projectable.  
    - **Verdict**: Data cannot settle it because the core issue is reference-class validity, which depends on unobservable assumptions about political ontology.

  ### 3. Reference Class Problem and Individuation Rule
  - **The rule**: Assumes a political order is "the same" if it maintains a single sovereign authority over a named core territory. Change occurs via conquest, partition, extinction, or reconstitution.  
  - **What it assumes**: That "sovereign authority" and "core territory" are stable, observable, and exhaustive. It ignores gradualism (e.g., slow evolution from monarchy to republic) or contested continuity (e.g., was the Ottoman Empire post-1839 reforms the same order?).  
  - **Impact on base rate**:  
    - If the rule splits natural long episodes (e.g., calling dynastic changes "reconstitutions"), it creates spurious short episodes, lowering the unconditional median.  
    - If it merges distinct orders (e.g., ignoring brief interruptions), it inflates duration, raising the median.  
    - **Result**: The base rate is not a fact about polities, but about the rule. Analyst 1’s unconditional median (140 years) is as arbitrary as the rule itself.

  ### 4. Open Episodes: Contributions and Limitations
  - **What they contribute**:  
    - **Current age distribution**: Median age 210 years confirms declining hazard (many young episodes died; survivors are older).  
    - **Selection effect**: Open episodes are **length-biased**. They overrepresent inherently stable orders (fragile ones died young) and may reflect era-specific factors (e.g., modern states differ from medieval kingdoms).  
  - **What they cannot contribute**:  
    - **Future durations**: Their unobserved lifespans induce censoring. Using only closed episodes (like Analyst 1’s conditional median) ignores that open episodes may live longer, biasing estimates downward.  
    - **Exchangeability**: Analyst 1’s conditional median assumes open episodes are exchangeable with closed ones. But if modern orders are more stable (e.g., due to technology), they are not exchangeable. The register cannot test this.

  ### 5. Minimal Constructed Example
  ```plaintext
  Closed episodes: [50, 50, 50, 100, 100, 300, 300]  
  Open episodes: [400*] (current age 400, still ongoing)  

  Unconditional median (closed): 100 years.  
  Conditional median for 100-year survivors (closed): 300 years.  

  Forecast for a 100-year-old open episode:  
  - Analyst 1: "Median lifespan is 100 years; it should have died."  
  - Analyst 2: "Conditional median is 300; it has 200 years left."  
  ```
  Same data, opposite conclusions—based on reference class choice.

  ### 6. Conditions for a Well-Posed Forecast and Honest Residue
  - **Conditions**:  
    - **Stationarity**: The generative process (causes of collapse) is constant across time and episodes.  
    - **Exchangeability**: The subject is indistinguishable from others in the reference class.  
    - **Unambiguous partitioning**: The entry-exit rule carves political reality at its joints.  
  - **If conditions unmet**:  
    - **What it can tell you**: The historical distribution of outcomes under the rule. It anchors expectations (e.g., "no episode <100 years reached 300").  
    - **What it cannot**: A unique "correct" forecast. It cannot resolve reference-class conflicts.  
    - **What to say**: "This projects past patterns onto the present, assuming no structural breaks. It ignores why our subject survived this long, and the rule may misclassify episodes. Use as a baseline, not a verdict."

  ### 7. Where You’re Fooling Yourself
  - **The mistake**: Believing the outside view bypasses subjectivity. You want an objective anchor, but:  
    - The reference class (e.g., "all polities" vs. "300-year survivors") is chosen, not discovered.  
    - The entry-exit rule encodes a theory of political identity.  
    - Declining hazards can be modeled multiple ways (e.g., Weibull vs. mixture models), each implying different forecasts.  
  - **Why tempting**: As an analyst, you seek rigor and defensibility. The outside view feels "data-driven," but its assumptions are philosophical. You’re fooling yourself if you think this method spares you from judgment calls.
