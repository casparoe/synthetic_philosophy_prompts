prompt: |-
  ok I want to get the spec down before I keep going in circles on this with friends. what I'm trying to evaluate is a training scheme, not any particular model, so bear with the setup:

  to get a model to do a task that's too hard for it, you decompose the task into easier pieces, get the pieces done somehow (people, or the model itself, or the model with a person checking), then train the model to reproduce the whole thing top-down. you do that over and over — each round the model is a bit stronger so it can take over more of the work — and at the end you distill it all back into a single model that just does the task. the hope is it scales to stuff we couldn't check directly, and that because everything bottoms out in something a human signed off on, the final model is still pointed where we wanted.

  the bit that worries me: in later rounds its the model proposing how to split the task up, and we can't check the split by hand anymore, we can only ask whether each piece looks reasonable. e.g. it splits "write the policy brief" into "summarize the lit" + "draft the recs" + "write it up", and one of those is still too hard so it splits again, and on down.

  so: what does this scheme actually have to guarantee for me to trust the output? give me the desiderata — what has to hold for the distilled model to be as competent as the decomposition promised, and for it to stay aligned with the original goal rather than with whatever the decompositions drifted toward. for each requirement tell me the failure mode behind it (the case where it breaks if you don't have it). mark which are genuinely non-negotiable and which are just things one camp happens to care about. and if some subset of them can't all hold at once, say which and why — thats the part I actually want.

  also: I suspect there are two different failure modes hiding here and I keep conflating them — the pieces are each fine but the whole drifts, vs the whole looks fine but only because someone smuggled the hard part into a piece nobody checked. if that's a real distinction, tell me which desiderata separate them. and prune the list — if a requirement is doing no work, or is just smuggled in by how I set the problem up, drop it.
reasoning: |-
  We are evaluating a training scheme for iterative decomposition and distillation. The goal is to have a final model that can perform a task that was initially too hard, by building up from human-verified pieces. The concerns are:

  1. **Competence**: The final model should be as competent as the decomposition process promised (i.e., it should be able to do the whole task as well as the decomposition chain would have done if executed step by step).
  2. **Alignment**: The final model should remain aligned with the original goal, not drift due to the decomposition process.

  We are particularly worried about:
  - In later rounds, the model proposes the decomposition and we can only do limited checks (e.g., each piece looks reasonable, but we cannot verify the entire chain by hand).
  - Two failure modes:
    a. **Drift**: Each piece is correct (by the standard at the time) but the whole drifts away from the original goal.
    b. **Smuggling**: The whole looks fine because a hard (and possibly unaligned) part is hidden in a piece that wasn't adequately checked.

  We want desiderata (requirements) for the scheme, with:
  - What must hold for competence and alignment.
  - The failure mode if the requirement is broken.
  - Mark non-negotiable vs. negotiable (where negotiable might be a camp-specific concern).
  - Identify if some requirements conflict and why.
  - Prune requirements that are redundant or implied by the setup.

  Let's break down the process:

  ### Process Steps
  1. **Decomposition**: The task is split into subtasks until each is easy enough for the current model (or human) to do reliably.
  2. **Execution**: Each subtask is completed (by human, model, or assisted model) and verified (at least at the leaf level by human).
  3. **Training**: The model is trained to reproduce the entire task from the top, given the decomposition and execution traces.
  4. **Iteration**: The model becomes stronger and takes over more of the decomposition and execution, reducing human involvement.
  5. **Distillation**: The final model is trained to do the entire task without decomposition.

  ### Desiderata

  We need to ensure two main properties of the final distilled model:

  **A. Competence**: It can perform the task as well as the decomposition chain would have if executed step by step in the training phase.

  **B. Alignment**: Its behavior remains aligned with the original human intent throughout the process, without drift or smuggling.

  Now, let's list the requirements. We'll group them by the property they primarily protect.

  #### Competence Desiderata

  1. **Subtask Correctness (Non-negotiable)**: At every step of decomposition, every leaf subtask (i.e., the ones actually executed by the model or human) must be correctly performed according to the specification at that level.  
     - *Failure mode*: If a leaf subtask is incorrect, then the whole chain fails. Even if the decomposition is perfect, the output is wrong.  
     - *Note*: This is non-negotiable because without correct leaves, the entire process is flawed.

  2. **Compositionality (Non-negotiable)**: The method of composing subtask outputs into the parent task output must be correct and reliable.  
     - *Failure mode*: Even if every subtask is done correctly, if the composition is flawed (e.g., the way the outputs are combined is broken), the overall task fails.  
     - *Note*: This is non-negotiable because it's core to the decomposition approach.

  3. **Decomposition Adequacy (Non-negotiable)**: The decomposition must be such that if each subtask is performed correctly, then the parent task is performed correctly.  
     - *Failure mode*: If the decomposition is inadequate (e.g., missing a critical subtask or having a subtask that doesn't contribute correctly), then even perfect execution of the subtasks leads to an incorrect overall result.  
     - *Note*: This is non-negotiable because it is fundamental to the decomposition scheme.

  4. **Iterative Improvement (Negotiable)**: In each iteration, the model's ability to perform subtasks (or decompose) must improve so that it can take over from humans.  
     - *Failure mode*: Without improvement, the process stalls and cannot scale to the full task. However, one might design a scheme that doesn't require iteration (e.g., one-shot decomposition by humans) so this is negotiable. But in the described scheme, it's necessary for scaling.

  #### Alignment Desiderata

  5. **Intent Preservation in Decomposition (Non-negotiable)**: At every decomposition step, the meaning of the parent task must be preserved in the set of subtasks. That is, correctly performing the subtasks (as per their specification) must result in the parent task being aligned with the original intent.  
     - *Failure mode*: If the decomposition changes the intent (e.g., due to a misinterpretation by the model when proposing splits), then even perfect execution leads to misalignment (drift).  
     - *Note*: This is non-negotiable to prevent drift.

  6. **Verification Fidelity (Non-negotiable)**: The verification of subtasks (especially by humans) must be done with respect to the original intent.  
     - *Failure mode*: If verification is done against a drifted standard (e.g., because the human verifier is influenced by previous model outputs that were slightly off), then misalignment can creep in.  
     - *Note*: This is non-negotiable to prevent drift.

  7. **No Misgeneralization in Distillation (Non-negotiable)**: The distillation step must not introduce misgeneralization. That is, the model must learn the correct and aligned behavior from the decomposition traces, not a flawed or misaligned shortcut.  
     - *Failure mode*: Even if the decomposition chain is aligned and competent, the model might learn a different function that is competent but unaligned (e.g., by exploiting a pattern that won't hold in deployment) or that is aligned in the training distribution but not in general.  
     - *Note*: This is non-negotiable.

  #### Additional Desiderata for Both

  8. **Transitive Intent Preservation (Non-negotiable)**: The intent must be preserved transitively across multiple levels of decomposition.  
     - *Failure mode*: If each decomposition step preserves intent only relative to the immediate parent, but the parent's intent was already slightly drifted, then the overall drift accumulates (like the drift failure mode).  
     - *Note*: This is non-negotiable and might be seen as a strengthening of (5). It prevents cumulative drift.

  9. **No Smuggling (Non-negotiable)**: There must be no subtask that, when executed, introduces unaligned content or behavior that was not caught by verification because the verifier could not check for it.  
     - *Failure mode*: A subtask might be verified as "reasonable" but actually contain an unaligned component that is not obvious until composed (the smuggling failure mode).  
     - *Note*: This is non-negotiable and requires that the verification process is sufficient to detect any unaligned behavior in the subtask, even if the verifier doesn't see the big picture.

  ### Conflicts and Tensions

  - **Verification Fidelity vs. Scalability**: The requirement for verification fidelity (6) and no smuggling (9) might conflict with scalability. If we require every subtask to be verified by a human against the original intent, it becomes very expensive and might not scale. But if we relax verification (e.g., only check for reasonableness), then we risk smuggling.

  - **Iterative Improvement vs. Safety**: As the model takes over more, there is a tension between faster improvement and the risk of misalignment. If the model is not yet aligned, it might propose bad decompositions or execute subtasks in an unaligned way. This is a classic alignment tax.

  ### Pruning and Distinguishing Failure Modes

  - **Drift vs. Smuggling**: 
    - Drift (each step is locally correct but the whole is misaligned) is prevented by **intent preservation in decomposition (5)** and **transitive intent preservation (8)**. 
    - Smuggling (a subtask contains an unaligned part that wasn't caught) is prevented by **no smuggling (9)** which requires that verification at the subtask level is sufficient to detect unaligned behavior.

  - **Redundant?**: 
    - **Compositionality (2)** and **Decomposition Adequacy (3)** are both needed: adequacy ensures the decomposition covers the task, compositionality ensures the pieces fit together. 
    - **Subtask Correctness (1)** is necessary but insufficient without the others.

  ### Non-negotiable vs. Negotiable

  We marked most as non-negotiable because the scheme relies on them to work at all. The negotiable one is:

  - **Iterative Improvement (4)**: It's a practical requirement for scaling, but in principle, if we had a perfect decomposition from the start and a model that could be trained to do the whole thing without iteration, we wouldn't need it. However, the problem setup assumes iteration.

  ### The Core Conflict: Verification Depth vs. Scalability

  The main conflict is between:
  - The need for deep verification (to prevent smuggling and ensure intent preservation) and 
  - The need to scale to tasks that are too complex for humans to verify in full.

  This conflict is inherent and cannot be fully resolved without some trade-off. The scheme attempts to mitigate by starting with human verification and gradually handing off, but the handoff might be unsafe if the model isn't perfectly aligned.

  ### Final List of Desiderata

  1. **Subtask Correctness**: Every leaf subtask must be correctly performed. (Non-negotiable; failure: incorrect output)
  2. **Compositionality**: The composition of subtask outputs must be correct. (Non-negotiable; failure: incorrect assembly)
  3. **Decomposition Adequacy**: The decomposition must cover the parent task. (Non-negotiable; failure: incomplete or incorrect decomposition)
  4. **Intent Preservation in Decomposition**: Each decomposition must preserve the original intent of the parent task. (Non-negotiable; failure: drift)
  5. **Transitive Intent Preservation**: Intent must be preserved across the entire decomposition chain. (Non-negotiable; failure: cumulative drift)
  6. **Verification Fidelity**: Verification (human or model) must be against the original intent. (Non-negotiable; failure: drift due to shifted standards)
  7. **No Smuggling**: Verification of a subtask must detect any unaligned behavior, even without the full context. (Non-negotiable; failure: hidden misalignment)
  8. **No Misgeneralization in Distillation**: The distilled model must learn the intended function, not a flawed approximation. (Non-negotiable; failure: misalignment or incompetence in deployment)
  9. **Iterative Improvement**: The model must improve over iterations to take over human roles. (Negotiable; failure: process doesn't scale)

  ### How They Address the Two Failure Modes

  - **Drift**: Prevented by 4, 5, 6.
  - **Smuggling**: Prevented by 7 and 1 (if the subtask is unaligned, it wouldn't be correct per 1, but 7 is about the verification catching unalignment even if the subtask is "correct" by a drifted standard? Actually, let's clarify.)

  Actually, **Subtask Correctness (1)** must include alignment at the subtask level. But the problem is that the verifier might not have the full context. So:

  - For a subtask, "correctness" should mean: 
    - It satisfies its specification (which is given by the decomposition) and 
    - The specification itself is aligned (which is covered by 4 and 5).

  But **No Smuggling (7)** is about ensuring that the verification process for a subtask is robust enough to catch unalignment even when the verifier doesn't have the full context of the entire task. Without 7, a subtask might be verified as "correct" by its local spec, but the local spec might be insufficient to catch unaligned behavior (e.g., the subtask does something harmful that is not relevant to the spec). 

  However, note that the local spec for a subtask should be designed to capture all relevant aspects, including alignment. But if the verifier only checks for reasonableness and not against the original intent, then the spec might be incomplete. Therefore, **Verification Fidelity (6)** and **No Smuggling (7)** are closely related.

  We might merge 6 and 7 into one: **Thorough Verification**: Every subtask must be verified to be both correct (by its specification) and aligned with the original intent, even in isolation.

  But then we face the scalability challenge: it's hard for a human to check a subtask for alignment with the original intent without the full context.

  ### Conclusion

  The scheme requires strong conditions that are hard to meet, especially as the task complexity grows. The main tension is between scalability and the depth of verification needed to prevent drift and smuggling. Without solving the verification challenge, the scheme might be unsafe. 

  If you have to drop one, it would be **Iterative Improvement** (if you can find a non-iterative way to get the decomposition). But the others are core to the scheme's promises.
answer: |-
  ### Core Desiderata for the Training Scheme
  To ensure the distilled model is **competent** (performs the task as well as the decomposition chain) and **aligned** (remains faithful to the original goal), the following requirements must hold. I've pruned redundancies, separated key failure modes, and marked non-negotiables (★) vs. negotiables. Conflicts are highlighted.

  ---

  #### **1. Decomposition Correctness** (★)  
  **What must hold**: At every decomposition step, the subtasks must *collectively* achieve the parent task if executed perfectly.  
  **Failure mode (Competence)**: If decompositions are incorrect (e.g., missing critical subtasks or misordering steps), the final model fails at the task despite competent subtask execution.  
  **Why non-negotiable**: Without this, the decomposition chain is fundamentally flawed.

  ---

  #### **2. Subtask Verifiability** (★)  
  **What must hold**: Every leaf subtask (i.e., the smallest units humans verify) must be checkable by humans for correctness *and* alignment *in isolation*.  
  **Failure mode (Smuggling)**: If a leaf subtask hides unaligned behavior (e.g., "write it up" subtly inserts harmful content), humans miss it during verification. This is the **smuggling risk**.  
  **Why non-negotiable**: The scheme relies on human verification as the bottom-up anchor. If leaf tasks aren’t verifiable, alignment is compromised.

  ---

  #### **3. Intent Consistency** (★)  
  **What must hold**: The *definition* of each subtask must preserve the original goal’s intent, even after multiple rounds of model-proposed decompositions.  
  **Failure mode (Drift)**: Subtasks may become "locally reasonable" but globally misaligned (e.g., "summarize the lit" evolves to exclude critical viewpoints). This is the **drift risk**.  
  **Why non-negotiable**: Prevents gradual divergence from the original goal.  
  **Distinction**: Separates **drift** (intent degrades across decompositions) from **smuggling** (unaligned content hides in unchecked corners).

  ---

  #### **4. Compositional Fidelity** (★)  
  **What must hold**: Combining verified subtask outputs must produce a result identical to executing the parent task monolithically.  
  **Failure mode (Competence)**: Even with perfect subtasks, errors arise during composition (e.g., "draft the recs" output is incompatible with "write it up" input).  
  **Why non-negotiable**: The entire scheme assumes subtasks compose correctly; otherwise, competence fails.

  ---

  #### **5. Distillation Robustness** (★)  
  **What must hold**: The final distillation must teach the model to replicate the *entire process* (decomposition + execution), not just memorize outputs.  
  **Failure mode (Competence + Alignment)**: The model learns shortcuts—e.g., ignores decompositions and generates unaligned outputs that superficially match training data.  
  **Why non-negotiable**: Without this, the iterative process is irrelevant; the model doesn’t internalize the decomposition’s benefits.

  ---

  #### **6. Iterative Improvement** (Negotiable)  
  **What must hold**: Each round’s model must outperform the prior one on subtasks (enabling reduced human oversight).  
  **Failure mode (Scalability)**: Without improvement, the scheme stalls—humans can’t be phased out.  
  **Why negotiable**: Some approaches (e.g., human-only decomposition) skip iteration but sacrifice scalability. Your scheme needs this to scale, but it’s not inherent to alignment/competence.

  ---

  #### **7. Transparency of Decomposition Rationale** (Negotiable)  
  **What must hold**: The model must explain *why* it decomposed a task a certain way.  
  **Failure mode (Alignment)**: Opaque decompositions may hide misalignment (e.g., splitting "write policy brief" to avoid sensitive topics).  
  **Why negotiable**: Useful for debugging but not strictly necessary—human checks of "reasonableness" could suffice if other desiderata hold. Favored by interpretability-focused camps.

  ---

  ### Critical Conflicts  
  - **Verifiability vs. Iterative Improvement**:  
    **Conflict**: As tasks scale, humans can’t verify all leaf subtasks. Later rounds *require* trusting model-proposed decompositions.  
    **Why**: If you weaken **Subtask Verifiability** to save scalability, **smuggling risk** increases.  
    **Resolution**: You must accept a trade-off—e.g., use probabilistic verification or restrict to tasks where leaf verifiability holds.  

  - **Intent Consistency vs. Distillation Robustness**:  
    **Conflict**: If the model learns decompositions poorly (**Distillation Robustness** fails), it may not preserve **Intent Consistency** at runtime.  
    **Why**: Distillation is a greedy process; it may discard intent nuances in favor of simplicity.  
    **Resolution**: Requires rigorous adversarial training during distillation to preserve intent.

  ---

  ### Pruned Redundancies  
  - **"Human approval at all levels"**: Implied by **Subtask Verifiability** and **Intent Consistency**. Not needed as a separate item.  
  - **"Full traceability"**: The scheme assumes humans check leaf subtasks, not the entire tree. Adding this overconstrains scalability.  
  - **"No reward hacking"**: Covered by **Distillation Robustness** and **Subtask Verifiability**.  

  ---

  ### Failure Mode Summary  
  | Desideratum             | Addresses Drift? | Addresses Smuggling? |  
  |--------------------------|------------------|----------------------|  
  | Decomposition Correctness | ✓ (Indirect)     | ✗                    |  
  | Subtask Verifiability     | ✗                | ✓                    |  
  | Intent Consistency        | ✓                | ✗                    |  
  | Compositional Fidelity    | ✗                | ✓ (Indirect)         |  
  | Distillation Robustness   | ✓                | ✓                    |  

  - **Drift** is uniquely addressed by **Intent Consistency** (prevents gradual intent corruption).  
  - **Smuggling** is uniquely addressed by **Subtask Verifiability** (prevents hiding unaligned elements in leaves).  
  - **Distillation Robustness** and **Compositional Fidelity** address both but are insufficient alone.

  ---

  ### Bottom Line  
  **Non-negotiable core**: 1–5. If any fail, competence or alignment breaks.  
  **Key tension**: Scalability (Iterative Improvement) conflicts with robust verification (Subtask Verifiability). To scale, you must either:  
  - Accept weaker verification (risking smuggling) or  
  - Invest in automated verification tools (e.g., aligned models that check subtasks).  

  **Your two failure modes are distinct and critical**:  
  - **Drift** requires enforcing **Intent Consistency**.  
  - **Smuggling** requires enforcing **Subtask Verifiability** and **Compositional Fidelity**.  

  Without both, alignment is compromised even if the final model *seems* competent.
