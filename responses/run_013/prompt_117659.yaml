answer: |-
  1.  **Conflict between hypocrisy-based standing loss (c) and political blame permissibility:** Real conflict. Your commitment to hypocrisy voiding standing (c) clashes with your practical need to permit blame of powerful wrongdoers even by imperfect blamers. Cheapest way out: abandon the strict hypocrisy requirement for standing in systemic cases. You'd lose the clean, universal principle linking standing directly to personal compliance.
  2.  **Tension between self-blame legitimacy (g) and standing requiring non-exemption (b):** Looks like conflict but resolvable. Self-blame *is* holding oneself to the norm, fulfilling (b)'s requirement rather than exempting oneself. Cheapest way out: clarify that "being bound" and "not exempting oneself" centrally includes applying the norm to oneself via self-blame. You'd lose nothing core, only needing explicit integration.
  3.  **Conflict between uptake test for warrant (e) and objectivism about wrongness (d):** Real conflict. Making blame's warrant hinge on the recipient's response (uptake) pulls against your commitment that wrongness is objective and independent of perspective (d). Cheapest way out: drop the uptake test as a warrant condition, making it merely pragmatic. You'd lose the connection between blame's effectiveness and its justification.
  4.  **Tension between rejecting victim special standing (f) and concrete feeling about friend's blame:** Looks like conflict but aligns. Rejecting victim standing (f) fits your rejection of the hypocritical friend's blame (not due to lack of victimhood, but hypocrisy). Cheapest way out: none needed, as your rejection relies on hypocrisy (c), not victim status. You'd lose nothing; it confirms consistency on (f).
  5.  **Revise standing (b) to focus on *genuine commitment* and *non-exemption* rather than strict past compliance:** Allow standing if the blamer sincerely endorses the norm *for themselves and others* and doesn't exempt themselves *in principle*, even if they have failed (like the self-blamer). This resolves the political case (sincere commitment suffices) and integrates self-blame while preserving objectivism and the demand structure.
