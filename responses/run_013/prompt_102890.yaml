  Next, robustness. How dependent are these arguments on their assumptions? The betting argument falls apart if the agent doesn't bet or has non-linear utility. The accuracy argument is more robust but depends on the choice of scoring rule. The user mentioned the Brier and log scores giving different verdicts—this is crucial. I should explain that while different rules can dominate different non-probabilistic credences, probabilism itself remains intact under any proper rule. But the specifics matter for things like conditionalization.

  The user’s hermit case is interesting. A non-betting agent with non-linear utility avoids Dutch books but still faces accuracy dominance. This seems like a win for accuracy, but maybe it reveals betting was always a metaphor for vulnerability. I need to address whether the betting argument’s core is pragmatic vulnerability, not literal money.

  The worldly vs. self-endorsed accuracy distinction is key. The user points out that self-endorsed accuracy is trivialized by propriety, so the real force comes from worldly dominance. Both arguments rely on this, but accuracy makes it explicit. The betting argument implicitly uses it via the sure loss being actual, not expected.

  For the verdict, accuracy feels more fundamental. It ties directly to epistemology—truth-seeking—while betting is derivative, applying when agents engage in transactions. But can Dutch books be derived from accuracy? Only in specific contexts with added assumptions. A unified view would ground both in epistemic virtue, with pragmatism as a consequence.

  The user’s deeper needs: They’re seeking clarity on which justification is more robust and fundamental, possibly to inform their own philosophical stance or resolve conflicts in rationalist discussions. They might also want to apply this to real-world rationality practices or AI alignment, where avoiding sure losses vs. truth-tracking could lead to different designs. Unspoken, they might be looking for a coherent framework that doesn’t rely on adversarial scenarios or monetary stakes, making accuracy more appealing, especially for scenarios like the confident hermit. Their frustration with undiscussed cases suggests a desire for comprehensive principles that hold across edge cases.
answer: |-
  Here's a detailed comparison of the betting (Dutch Book) and accuracy (Accuracy Dominance) arguments as justifications for probabilism, addressing your specific points:

  **Core Elements & Assumptions:**

  | Feature                | Betting Argument (Dutch Book)                          | Accuracy Argument (Accuracy Dominance)              |
  | :--------------------- | :----------------------------------------------------- | :-------------------------------------------------- |
  | **Fundamental Object** | Dispositions to accept specific bets at specific odds. | Credence function (as a whole).                    |
  | **Fundamental Good**   | Avoidance of *pragmatic vulnerability* (sure loss).    | Maximization of *epistemic accuracy* (truth-tracking). |
  | **Key Assumption 1**   | Willingness to bet at stated odds (accepting bets).    | Existence of a *proper* scoring rule (Brier, Log, etc.). |
  | **Key Assumption 2**   | Linearity of utility in the betting medium (e.g., money). | Credences aim at truth; accuracy is valuable/scorable. |
  | **Key Assumption 3**   | Simultaneous availability/combinability of bets ("book"). | Global evaluation of the credence function vs. alternatives. |
  | **Mechanism**          | Exploitative strategy by an adversary.                 | Dominance relation independent of any adversary.     |
  | **Conclusion**         | Coherence avoids sure loss.                            | Coherence avoids accuracy-domination.               |

  **Robustness of Conclusions:**

  1.  **Betting Argument:**
      *   **Won't Bet:** **Fragile.** If the agent *refuses all bets*, the vulnerability vanishes. The argument loses force entirely.
      *   **Non-Linear Utility:** **Fragile.** If utility isn't linear in the stake, a series of bets individually acceptable might not combine into a sure loss. The "Dutch Book" may not be *actually* Dutch (utility-losing).
      *   **No Adversary:** **Conditionally Robust.** While an adversary *demonstrates* vulnerability, the *potential* vulnerability exists logically if the dispositions are incoherent, even if no one exploits it. The incoherent agent *is* vulnerable in principle.
  2.  **Accuracy Argument:**
      *   **Choice of Scoring Rule:** **Partially Robust.** The *core conclusion* (non-prob credences are dominated *by some* prob credence) holds for *any* strictly proper scoring rule. However, *which* probabilistic credence dominates a specific incoherent one, and *how badly* it dominates, depend on the rule. Brier and Log can disagree on dominance relations *between specific non-probabilistic functions* or *between specific probabilistic alternatives*, but both agree that *every* non-prob function is dominated by *some* prob function. Probabilism itself is robust to the choice of proper rule.

  **Beyond Probabilism - What Else is Delivered?**

  1.  **Conditionalization:**
      *   **Betting Argument:** Can justify conditionalization via *diachronic* Dutch Books. An agent who violates conditionalization can be exploited *over time* through a sequence of bets. Requires additional assumptions about commitment to future betting rules/updating.
      *   **Accuracy Argument:** Strongly justifies conditionalization via *minimization of expected inaccuracy*. Updating to the posterior = P(H|E) uniquely minimizes expected inaccuracy (according to *any* strictly proper rule) from the perspective of the prior, *conditional on E being learned*. This is widely seen as a major advantage.
  2.  **Tying to Evidence/Chance:**
      *   **Betting Argument:** **Silent.** Coherence is about internal consistency of dispositions. It says nothing about *why* an agent should have a specific credence (e.g., matching evidence or chance). Needs supplementation (e.g., Principal Principle, Reflection).
      *   **Accuracy Argument:** **Provides Framework.** While not dictating specific credences, the goal of accuracy *motivates* principles connecting credence to evidence/chance. The *Principal Principle* (align credence with known chances) can be justified as minimizing *expected* inaccuracy. *Evidential norms* (e.g., Jeffrey Conditionalization) are often framed as minimizing expected inaccuracy relative to constraints imposed by evidence. Accuracy provides the *telos* (truth) that evidence/chance norms serve.

  **The Confident Hermit Case:**
  *   **Betting Argument:** Has **no direct purchase**. The hermit lacks betting dispositions and non-linear utility breaks the money-loss connection. The argument *only* shows vulnerability *if* betting occurs under specific (linear utility) conditions, which don't apply.
  *   **Accuracy Argument:** **Applies directly and cleanly.** The hermit's credences are still estimates of truth. If incoherent, they are accuracy-dominated *in the world* by some coherent alternative, regardless of stakes, utility, or willingness to bet. The epistemic flaw remains.
  *   **Conclusion:** This strongly favors the accuracy justification. It reveals that the core epistemic failing of incoherence – its lack of fit with truth – is *independent* of pragmatic vulnerability. The betting argument highlights one *pragmatic consequence* of this epistemic flaw *in specific contexts* but is not fundamental to the flaw itself.

  **Worldly Accuracy vs. Self-Endorsed Accuracy:**
  *   **Crucial Distinction:** Your diagnosis is insightful. The dominance argument relies fundamentally on **worldly accuracy** – how the credence function scores *at the actual world state*. Self-endorsed accuracy (expected accuracy) is degenerate under propriety: every credence function is *locally optimal* by its own lights.
  *   **Commitment:**
      *   **Betting Argument:** Implicitly relies on **worldly loss**. The sure loss occurs *in the actual world* depending on which bets are called and how the world resolves. Expected loss from the agent's perspective is irrelevant to the existence of the Dutch Book.
      *   **Accuracy Argument:** Explicitly relies on **worldly accuracy dominance**. The incoherent function is worse *at the actual world* than the dominating coherent function, *regardless* of the agent's expectations. Propriety ensures the dominating function *could be* adopted without self-sabotage (good expected accuracy), but the dominance itself is worldly.
  *   **Diagnosis:** This is a **fair and critical point**. Both arguments ultimately ground the normativity of probabilism in a **worldly, dominance-based standard** (avoiding sure loss / avoiding being less accurate than an alternative *in reality*), not just in satisfying an internal decision rule. The betting argument survives this diagnosis only insofar as the sure loss *is* worldly. The accuracy argument embraces it explicitly and centrally.

  **Verdict: Which is More Fundamental?**

  1.  **Accuracy Dominance is the more fundamental epistemic justification.** It directly addresses the core epistemic function of credence: representing the world accurately. The flaw it identifies (dominance) is inherent to the incoherent credence function's relationship to truth, irrespective of pragmatic context, stakes, or willingness to engage in transactions. The Confident Hermit case demonstrates this. Accuracy also provides a natural and powerful justification for conditionalization and a framework for evidence/chance norms.
  2.  **The Dutch Book Theorem is a valuable corollary, not the foundation.** It shows that *if* an agent manifests their incoherent credences through specific betting dispositions in a context of linear utility, they become *pragmatically vulnerable* to a sure loss. This vulnerability is a *consequence* of the underlying epistemic flaw (inaccuracy-dominance) *in a specific operational context*. It's a powerful *motivational* argument and a *pragmatic test* for coherence, but it doesn't get to the heart of *why* coherence is an epistemic virtue.
  3.  **Can one be derived from the other?**
      *   **Accuracy -> Dutch Book (Plausible under constraints):** If you assume an agent *must* accept bets at their stated fair odds, linear utility in small stakes, and simultaneous betting, *then* accuracy dominance (via the connection between scoring rules and fair betting odds) *can* imply vulnerability to a Dutch Book. The proper scoring rule defines "fair" odds. Accuracy dominance implies the incoherent agent's "fair" odds collectively allow a sure loss construction. This derivation *requires* adding the pragmatic assumptions of the betting scenario.
      *   **Dutch Book -> Accuracy (Not really):** Avoiding Dutch Books doesn't inherently imply anything about truth-tracking or accuracy dominance. One could imagine a coherent agent with wildly inaccurate but coherent credences who avoids Dutch Books but is massively accuracy-dominated. The Dutch Book argument is silent on calibration or fit-to-truth beyond coherence.
  4.  **A Unified Justification:** A unified view would place **epistemic accuracy** as the fundamental goal of belief. **Probabilistic coherence** is justified as a necessary condition for avoiding *accuracy domination* (an internal standard of epistemic rationality). **Conditionalization** is justified as the unique rule for minimizing expected inaccuracy upon receiving evidence. **Dutch Book vulnerability** would then be explained as a *pragmatic symptom* of epistemic incoherence that manifests *when beliefs are operationalized as betting dispositions under specific (linear utility) conditions*. The core justification remains epistemic (aiming at truth accurately), with pragmatic vulnerability as a downstream consequence in specific contexts.
