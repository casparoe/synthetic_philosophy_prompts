prompt: |-
  I'm a novelist, about two-thirds of the way through a book about a woman who spends thirty years trying to do good in her hometown and can't tell whether any of it landed. I've been rereading Middlemarch alot while I write it, and it's got me stuck on the philosophical problem people call cluelessness: consequentialism tells you to maximise the good, but for almost anything you do the long-run consequences — the effects of the effects, the things that never happen because of it — aren't merely uncertain, they're so far outside anything you can model that even an expected-value calculation is a shot in the dark. Some philosophers say we're only clueless about the distant future and can be fairly confident about the next few years; others say the whole business of totting up consequences is a fiction.

  You're an expert in normative ethics who also takes the novel seriously as a form of thought. Read Middlemarch through that lens for me. Think it through first — brainstorm a bit, then write it up as continuous prose, no bullet points, and please don't quote the text at me, I'm working from memory. Which of the book's acts is it really about — Bulstrode and Raffles, Casaubon's codicil, Lydgate's hospital money and the sad treatise on gout he dies having written? Where does the lens actually illuminate a choice, and where does the novel push back and tell you the lens is too crude? I'd rather you flag the places the reading doesn't work than smooth them over. Finish by telling me what Eliot sees about living with not-knowing that the argument on its own misses.
