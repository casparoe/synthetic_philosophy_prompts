  Okay, the user's query is about evaluating their roommate's summary of the divine hiddenness argument, specifically Schellenberg's version. Let me start by recalling what I know about Schellenberg's argument. He posits that a perfectly loving God would ensure that anyone capable of a relationship with Him would believe in Him, avoiding non-resistant non-belief. The roommate frames it as a weaker version of the problem of evil, replacing suffering with uncertainty. But is that accurate?

  First, I need to address the roommate's claim that divine hiddenness is just the problem of evil with a weaker premise. While both arguments deal with God's goodness, hiddenness focuses on the absence of belief preventing a relationship, not just suffering. That's a key distinction. Schellenberg emphasizes the relational aspect, which evil doesn't necessarily cover. So pointing out that difference is crucial.

  Next, the roommate says God is required to make existence obvious. But Schellenberg's actual premise is about reasonable non-belief, not absolute certainty. He argues that God would prevent inculpable non-belief, not eliminate all doubt. The roommate's phrasing oversimplifies, making it easier to counter. Highlighting that nuance is important here.

  Then there's the theist reply about freedom. The roommate claims that if God's hiddenness protects free will, then non-believers are just refusing to believe. But Schellenberg counters that belief isn't a choice; it's involuntary. A loving God wouldn't let non-belief persist if it blocks a relationship. Plus, the freedom objection assumes belief is volitional, which might not hold. So the freedom reply doesn't fully address the argument as Schellenberg presents it.

  The closing point about deism seems correct. If God doesn't desire a relationship, hiddenness isn't a problem. But for theistic religions where God is personal, the argument has more bite. The user is curious if the freedom reply answers the actual argument. From what I recall, Schellenberg specifically addresses the freedom defense, arguing that a loving God could foster belief without coercion. Also, the user's gut feeling that the argument is sharper makes sense. The core issue is non-resistant non-belief, not just the existence of doubt.

  I should check if there are other theist responses. Maybe considerations like soul-making or epistemic distance. But the freedom objection is common, and its limitations need explanation. Also, confirming that the argument is distinct from the problem of evil because it targets the relational aspect directly, even without suffering involved.

  The user might be looking for a balanced critique to discuss with their roommate. They probably want to understand where the roommate's summary holds up and where it misrepresents, especially since the roommate uses pop-apologetics. Pointing out oversimplifications and the argument's actual nuances will help the user engage more effectively. Also, clarifying that Schellenberg's formulation is more robust against the freedom reply than the roommate suggests.
answer: |-
  You're right to be skeptical - your roommate's summary oversimplifies and misrepresents Schellenberg's argument in key ways. While it captures *a* version of divine hiddenness, it weakens the actual argument significantly. Here's a breakdown, claim by claim:

  1.  **"It's really just the problem of evil wearing a hat... the same argument with a weaker premise."**
      *   **Wince/Wrong:** This is a major misrepresentation. While both deal with God's goodness, the arguments are distinct.
          *   **Problem of Evil (PoE):** Focuses on the *existence of suffering/horrendous evils* allegedly incompatible with an all-powerful, all-loving God.
          *   **Divine Hiddenness (DH - Schellenberg):** Focuses on the *absence of belief* (specifically, *non-resistant non-belief*) in God, which is allegedly incompatible with a perfectly loving God who *desires a personal relationship* with every capable person. The core harm isn't suffering *per se*, but the *inability to enter into a conscious, reciprocal relationship with God* due to lack of belief. Schellenberg argues this harm is distinct and potentially more fundamental to the concept of divine love. It's not a "weaker" PoE; it's a different argument targeting a different aspect of divine goodness (relational love vs. preventing suffering).

  2.  **"The premise is that God is *required* to make his existence so obvious that nobody could doubt it."**
      *   **Wince/Oversimplified:** Schellenberg's premise is more nuanced. He argues a perfectly loving God would ensure that anyone capable of a meaningful, reciprocal relationship with God, and *not resistant* to it, would *reasonably believe* God exists. He doesn't demand absolute, doubt-proof certainty for everyone. He argues for *sufficient evidence for reasonable belief* that prevents *inculpable* or *non-resistant* non-belief. The key is the existence of people who *genuinely seek or are open to God* but find no compelling evidence to believe. The analogy isn't just "hiding from kids" but a loving parent ensuring their vulnerable, dependent child *knows they are present and available for care and relationship*.

  3.  **"The standard theist reply is that a relationship with God has to be entered into freely, so God stays hidden to protect our freedom -- and that reply basically kills the argument, since anyone who claims they can't believe is really just refusing to."**
      *   **Wince/Partially Wrong:** This is indeed the most common theist response (the "free will defense" for DH), but Schellenberg and defenders argue it **does not** "kill the argument":
          *   **Not Necessarily Volitional:** Belief is often not a direct act of will. You can't simply *choose* to believe something you find utterly unconvincing. Schellenberg argues that God, being all-powerful and all-knowing, could make His existence *sufficiently evident* to generate reasonable belief *without* overriding freedom or coercing love. You could still freely *reject* God or the relationship even if you reasonably believed God existed (e.g., like rejecting a known parent). Hiddenness prevents even the *possibility* of relationship for non-resistant seekers.
          *   **Non-Resistant Non-Belief:** The argument specifically targets *non-resistant* non-believers – those not willfully rejecting God, but who, through no fault of their own, find the evidence insufficient. The freedom defense tries to paint *all* non-belief as resistance, which defenders argue is empirically false and ad hoc. Schellenberg contends that a loving God wouldn't allow such a state to exist.
          *   **Love Requires Availability:** A perfectly loving being wouldn't make the fundamental condition for relationship (belief in their existence) so obscure that sincere seekers fail to find it. Protecting freedom doesn't necessitate making belief *impossible* for the non-resistant; it only requires making *rejection* possible.
      *   **Conclusion:** The freedom reply is a serious objection but is widely debated and not considered a decisive refutation by proponents of the argument or many neutral philosophers. It certainly doesn't "kill" it.

  4.  **"The whole thing only has teeth against a God who wants to be believed in, so it slides right off deism and off any view where God doesn't care what we think."**
      *   **Mostly Acceptable:** This is largely correct. Schellenberg's argument explicitly targets the concept of a **perfectly loving God who desires personal relationships** with humans. It has no force against:
          *   **Deism:** A God who created the universe but is utterly uninvolved and uninterested in personal relationships.
          *   **Maltheism/God is Evil:** A God who doesn't *want* a relationship.
          *   **Stoic/Impersonal God:** A God who is more like a force or principle than a personal being seeking relationship.
          *   **God Doesn't Care:** A God who exists but is indifferent to human belief or relationship.
      *   **Nuance:** The argument *does* have significant force against the vast majority of **theistic religions** (Christianity, Islam, Judaism, etc.) that explicitly describe God as perfectly loving and desiring relationship with humanity.

  **Addressing Your Specific Questions:**

  *   **"Does the freedom reply answer the argument as its defenders state it or only a stronger version?"** It answers a *weaker, caricatured version* of the argument presented by your roommate (where God must make belief "obvious" to everyone). It engages with, but does *not* decisively refute, the *actual* argument as defended by Schellenberg, which centers on **non-resistant non-belief** and the possibility of God providing sufficient evidence *without* coercion. Schellenberg *specifically designed* his argument to circumvent standard free will defenses common in the PoE.
  *   **"Does it really collapse into the problem of evil?"** **No.** While related (both are arguments from God's goodness against existence), they target distinct problems:
      *   **PoE:** Why is there suffering/horrendous evil?
      *   **DH:** Why is there non-resistant non-belief preventing relationship, even in the *absence* of identifiable suffering or resistance? Schellenberg argues DH might be *stronger* because the absence of belief necessary for relationship seems *directly* incompatible with perfect divine love, whereas the link between suffering and divine love might be more complex.
  *   **"Where is the argument sharper?"** Your gut is right. The sharpness lies in:
      *   **Focus on Relationship:** Directly targeting God's *relational love*.
      *   **Non-Resistant Non-Belief:** Highlighting the existence of sincere seekers who find no evidence, shifting the burden to explain *why* a loving God allows *this specific state* that blocks relationship.
      *   **Bypassing Theodicy:** It avoids debates about whether suffering is *necessary* for some greater good. The harm (inability to relate) seems intrinsic to the hiddenness itself for a being defined by perfect love seeking relationship.
      *   **Potential Independence:** It can be argued even if one accepts certain theodicies for suffering.

  **Conclusion:**

  Your roommate's summary significantly weakens Schellenberg's argument by misrepresenting its core premise (making it about absolute certainty instead of reasonable belief for the non-resistant) and presenting the standard theist reply as a knockdown refutation when it's actually a contested and debated objection. While his point about deism is valid, his overall characterization downplays the argument's distinct force and its specific challenge to personal theism. The argument *is* sharper than he presents, primarily due to its focus on **non-resistant non-belief preventing a desired relationship** as a direct failure of perfect divine love, distinct from the problem of suffering. The freedom defense is a serious counter, but it doesn't dissolve the argument as neatly as your roommate suggests.
