prompt: |-
  Just lost three hours argueing with my friend Dan about whether LLMs understand anything, and I need a proper outside opinion.

  Dan's line: obviously not, it's just next-token prediction, and understanding is something over and above being able to do the task. My line: that's the exact move Darwin's inversion is supposed to block — you don't need a designer to get design, so maybe you don't need a comprehender to get competent performance. Then he said the Darwin thing is only about where the design came from, not about whether there's anyone home, and anyway an LLM is built on purpose by people, so it's artificial selection at best. Then I said Turing's whole point was the opposite — stop asking what's inside, just look at the behaviour. After that we were basically just shouting.

  So here's what I want. Sit Darwin down with a modern LLM, explain next-token training, and give me his honest view — but reason it out from what he actually cared about, not the usual Darwin-would-be-amazed-at-technology filler. In particular:

  1. Would he read backprop and gradient descent as continuous with his own mechanism (blind variation plus selection), or as the inheritance of acquired characteristics he was so often accused of flirting with? And does that distinction actually change his verdict, or is he fine with a training process that was set up on purpose?

  2. His inversion, as I get it, only tells you that design can happen without a designer. Does it licence anything at all about inner states? I.e. does competent-without-comprehending follow from designed-without-a-designer, or is that a slide?

  3. He was a continuity guy about minds — no bright line between us and the animals. So would he treat comprehension as a real joint in nature that an LLM either has or lacks, or as a folk label for a bundle of capacities that comes in degrees — in which case the whole LLM question might be partly verbal?

  4. And the bit I actually care about: if Darwin's inversion is about origins and Turing's is about criteria, do they even point the same way on LLMs? Because they probly pull apart — the thing's origin is a bunch of people with a loss function, but its behaviour is what passes. Which one would Darwin reach for, and does he end up on Dan's side or mine?

  Give me his verdict roughly in his voice, but keep the reasoning explicit so I can see where it's doing real work vs. just projecting. And if you think the question is malformed, say so and tell me what the well-formed version would be.
