     - Openness: We can specify that we are not endorsing the claim but covering the controversy. Then the conflict might dissolve: we can cover the freezing-out without endorsing the claim.

  *Step 7: Good-Enough Threshold*
     - Threshold: We will cover if the freezing-out is a legitimate story and we can present the claim without endorsing it. 
