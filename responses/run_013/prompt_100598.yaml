  **Which one does the procedure not settle?**
  Story 1 is the one that isn't clearly settled and requires a judgment call at Step 8. We have to own the choice.

  **Summary of the Procedure Steps with Names for Meetings**:
  1. **Define the Fork**: State options and values.
  2. **Same Question?**: Check for common scale.
  3. **Domination Check**: Look for one option being better in every way (beware hidden scales).
