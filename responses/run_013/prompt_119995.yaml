prompt: |-
  I'm a backend engineer (CS degree, no philosophy training) and through a series of bad decisions I'm now on our town's historical commission. In three weeks we vote on the wording of a plaque for the old mill site, and we've split into two camps that seem to be fighting about whether history can be objective at all. Camp one: our job is to state what the sources establish about the mill and stay silent where they're silent -- no spin, no lessons for anyone. Camp two: thats a fantasy, any plaque is a selection of facts arranged into a story with a moral shape, we're writing for the town as it is now, and claiming neutrality just launders whoever benefited. Our chair keeps invoking Ranke, someone else keeps invoking Carr and Hayden White, and the actual dispute is concrete: the mill's owner used convict labor for a stretch in the 1890s, the records are patchy (we can document some of it, not the scale), and the two camps want very different sentences about it.

  Write the memo I'll circulate before the vote. I need an actual recommendation -- a specific approach to the wording, or a rule for choosing the wording, plus what I should say at the meeting if it gets challenged -- and I need the case for whichever side I land against stated the way it's own members would recognize it, not as a strawman. One constraint from me: whatever goes up, someone will file a public records request or threaten a lawyer, so tell me what's defensible and where the exposure is.

  Sections, in this order: 'Bottom line' (3-4 sentences: what I should vote for, and by when), 'Why' (3-5 paragraphs), 'The strongest case against my recommendation' (1-2 paragraphs), 'What would change my mind' (2-3 sentences). Under 900 words. Also, honestly, half this fight might be the two camps using 'objective' to mean different things, so if part of it is them talking past each other, say which part and why.
reasoning: |-
  Okay, the user is a backend engineer on a town historical commission facing a philosophical split about objectivity in history. They need a memo to resolve a dispute about how to word a plaque for an old mill site, specifically regarding convict labor in the 1890s. 

  First, I need to unpack the core conflict. Camp One believes in sticking strictly to documented facts without interpretation, while Camp Two argues that all historical narratives inherently carry perspective and moral judgment. The chair cites Ranke (positivist history), others reference Carr and Hayden White (constructivist history). The concrete issue is how to handle the convict labor records, which are incomplete.

  The user's constraints are crucial: they need a defensible position against legal challenges (public records requests/lawsuits), and they want both sides represented fairly without strawman arguments. The memo must have specific sections: Bottom Line, Why, Strongest Case Against, and What Would Change My Mind, under 900 words.

  I notice the ambiguity around "objectivity" is key. Camp One likely means factual accuracy and neutrality in sourcing, while Camp Two means acknowledging perspective and selectivity. This semantic gap is fueling the fight. The solution should bridge this by separating verifiable facts from interpretive framing.

  For the recommendation, a hybrid approach makes sense: state documented facts about convict labor upfront, then add context about why it matters today. This satisfies Camp One's evidentiary concerns while honoring Camp Two's need for relevance. Legally, grounding all claims in sources minimizes exposure; speculation without evidence is risky. 

  The strongest counterargument from Camp Two would be that this "neutral framing" still implicitly endorses the status quo by not condemning the injustice. I should present this sympathetically. For changing my mind, I'd require new evidence challenging factual accuracy or showing equal documentation for alternative interpretations.

  The memo structure will follow the user's requested sections. Bottom Line first: recommend the hybrid wording by next meeting. Why section explains the ambiguity in "objectivity," legal risks, and practical resolution. Strongest Case Against captures Camp Two's concern about laundering injustice. What Would Change My Mind focuses on evidence. 

  Word count is tight – need to be concise. The tone should be pragmatic (engineer-to-engineer) but respectful of historical nuance. Ending with meeting talking points will help the user defend the position when challenged.
answer: |-
  ## Memo: Recommendation for Mill Site Plaque Wording  

  **Bottom Line:**  
  Vote for **Option A**: State the documented facts about convict labor explicitly ("Used convict labor from [Start Year] to [End Year], as recorded in [Source Name]"), note the limitations of the record ("Exact scale remains unclear due to incomplete archives"), and avoid explicit moral framing. Circulate this wording draft by next Friday’s meeting. This balances accuracy with legal defensibility while acknowledging gaps.  

  ---

  ### Why  
  1.  **"Objectivity" is Two Problems Masquerading as One:**  
      Camp One uses "objective" to mean *verifiable claims grounded in sources*. Camp Two uses "objective" to mean *impossible neutrality in selection/framing*. **Both are right.** The impasse arises because we’re conflating *factual accuracy* (what sources say) with *interpretive neutrality* (why we choose to say it). Our plaque *can* achieve the first without claiming the second is possible. Stating verifiable facts ("convict labor was used") isn’t spin; omitting it because it’s uncomfortable *would be* spin.  

  2.  **Legal & Records Defense:**  
      Public records requests or legal challenges will target unsupported claims. Stating only what the sources explicitly document ("convict labor was used during X period per Y ledger") is defensible. Speculating on scale ("exploited hundreds") without robust evidence is risky. Acknowledging the record’s limitations ("exact scale unclear") is honest and protects us. Explicit moral judgments ("a brutal system") or lessons ("a reminder of past injustices"), while potentially valid historical interpretations, are *our committee’s conclusions*, not direct source facts. This makes them vulnerable to challenge as "opinion" added to a municipal plaque.  

  3.  **Practical Resolution:**  
      Option A satisfies Camp One’s core demand: sticking to sourced facts and admitting silence. It also addresses Camp Two’s valid point: simply stating "convict labor was used" *in the context of a historical marker* inherently signals its importance to modern audiences and avoids laundering history. The *selection* of this fact speaks volumes without editorializing. We can add depth via QR codes linking to fuller reports (including scholarly interpretations) if approved later.  

  ---

  ### The Strongest Case Against My Recommendation (as Camp Two Would Argue)  
  "Calling this 'just the facts' is naive. Omitting context about *what convict labor meant* – its brutality, its role in perpetuating racial/economic oppression post-slavery, its benefit to the owner – sanitizes history. Saying 'records are patchy' implies the truth might be insignificant or unknowable, when we know the *system* was inherently exploitative. This framing downplays harm. Claiming neutrality while choosing this bland wording serves the status quo then and now. It centers the owner’s story ('he used this labor') without centering the suffering it caused. Our plaque isn't just a database entry; it's the town teaching its citizens. Failing to explicitly connect this history to present-day inequities or values is a moral abdication. We have enough evidence to know it was wrong; why can't we say so? This 'neutral' approach *is* the spin – it spins towards comfort and the powerful."

  ---

  ### What Would Change My Mind  
  *   **New Evidence:** Discovery of definitive, widely accepted quantitative evidence (e.g., payroll ledgers, prison contracts) conclusively proving the scale *and* conditions, making stronger claims legally defensible without "patchy" caveats.  
  *   **Consensus on Context:** If Camp One agrees to include *one sentence* of explicitly sourced context about the convict lease system (e.g., "Convict leasing in [State] during this period was characterized by [specific, documented condition from state report]"), moving slightly towards interpretation while remaining evidence-bound.  

  ---

  ### Talking Points for the Meeting  
  *   **On "Objectivity":** "We agree source-based facts are essential. We also agree selection implies meaning. Our wording gives the essential, sourced fact – convict labor was used – which *itself* carries meaning for our community today. Adding unsupported speculation or explicit moral lessons opens us to valid legal challenge."  
  *   **On Downplaying Harm:** "Stating the fact plainly *does not* downplay it; it forces viewers to confront it. Adding caveats about the record’s limits shows intellectual honesty, not dismissal. We avoid speaking *for* the victims without evidence, which could be seen as appropriation."  
  *   **On Legal Risk:** "Our wording cites specific sources for the core fact. Speculation on scale or intent without equivalent documentation invites FOIA requests we can't fully satisfy and potential accusations of bias. This protects the town and the commission."  
  *   **On Moving Forward:** "This plaque is a starting point, not the final word. We can use supplementary materials (website, tours) to explore interpretations safely. Let’s get the foundational fact right and defensibly mounted."  

  **Final Draft Deadline:** Please provide feedback on Option A wording by **Friday, [Date]** for final vote at the next meeting.
