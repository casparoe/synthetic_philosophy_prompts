answer: |-
  ### Adversarial Collaboration Agreement: "Is the Brain a Computer?"  
  **Parties:**  
  - **Committed Computationalist (CC):** *The brain is a computer; computation is the fundamental basis of cognition.*  
  - **Committed Dynamical-Systems/Enactivist Critic (DC):** *The brain is a dynamical system; computation is a useful model but not ontologically primary.*  

  ---

  #### **I. Jointly Endorsed Claims**  
  Both parties agree on the following numbered statements:  

  1. **Computation Definition**  
     - Computation requires **state transitions governed by rules** that manipulate **discrete, functional states** (e.g., symbols, bits). It is not synonymous with "physical change" generally.  

  2. **Levels of Description**  
     - The brain can be analyzed at multiple levels (e.g., biological, dynamical, algorithmic). Neither level is "false," but they may differ in explanatory power for specific phenomena.  

  3. **Multiple Realizability**  
     - A computation (e.g., addition) can be implemented in diverse physical systems (silicon, neurons). This does not imply all systems *are* computers, only that they *can* implement computations.  

  4. **Implementation Criteria**  
     - For a physical system to **implement** a computation:  
       - (a) Its states must reliably map to computational states via a non-arbitrary, structure-preserving mapping.  
       - (b) The system’s causal relations must mirror the formal rules of the computation.  
       - (Example: A calculator implements addition; a rock’s erosion does not, despite post hoc mappings.)  

  5. **Triviality Worry**  
     - Any physical system can be *described* as computing *some* program under *some* mapping, but this is epistemically vacuous. Only **constrained mappings** (e.g., based on causal structure, evolutionary function, or stability) count as legitimate implementations.  

  6. **Computation vs. Computational Description**  
     - A system **computes X** if it implements X via criteria in (4). A system merely **admits a computational description** if we impose an interpretation without causal fidelity (e.g., describing solar system orbits as "solving differential equations" is modeling, not literal computation).  

  ---

  #### **II. Table of Disagreements**  
  Each statement is worded such that the endorsing party accepts it as written:  

  | # | Computationalist (CC) Position | Dynamical-Systems Critic (DC) Position |  
  |---|--------------------------------|----------------------------------------|  
  | 1 | Cognition *is* computation: Neural processes implement algorithms manipulating representations (e.g., memory retrieval as database lookup). | Cognition *is* dynamic interaction: Neural activity is continuous, nonlinear, and coupled to body/environment (e.g., walking as emergent stability). |  
  | 2 | Computational implementation is **objective**: Evolution/neurobiology selects mappings (e.g., retinal circuits implement edge-detection algorithms). | Computational implementation is **observer-relative**: Mappings are pragmatic tools (e.g., edge detection *can be modeled* as convolution but *is* pattern formation). |  
  | 3 | Representations are **causally necessary**: Symbols encode content (e.g., "neuron A fires → represents ‘edge’"). | Representations are **descriptive shortcuts**: Content arises from sensorimotor coupling (e.g., "edge perception" is optic flow integration). |  
  | 4 | Computationalism is **explanatorily privileged**: It best explains discrete, rule-based cognition (e.g., syntax parsing). | Dynamical systems are **explanatorily primary**: They best explain continuous, context-sensitive cognition (e.g., emotional responses). |  

  ---

  #### **III. Cruxes: Predictions and Test Cases**  
  **Crux 1: Is implementation observer-relative or objective?**  
  - **Test Case**: *A thermoregulatory circuit in the hypothalamus* maintains body temperature via feedback.  
    - **CC Prediction**: This circuit objectively implements control theory algorithms (e.g., PID controllers). Disrupting specific nodes causes failures predictable by the algorithm.  
    - **DC Prediction**: Temperature regulation emerges from coupled biochemical oscillators; calling it "computation" adds no insight. Disruptions cause phase shifts best explained dynamically.  

  **Crux 2: Are representations necessary?**  
  - **Test Case**: *A rodent navigating a maze*.  
    - **CC Prediction**: Place cells implement a spatial map; silencing them degrades navigation *as if* deleting data from a database.  
    - **DC Prediction**: Navigation is path integration via vestibular/optic flow dynamics; degrading place cells alters attractor landscapes, not "deleted data."  

  **Crux 3: Does computationalism trivialize?**  
  - **Test Case**: *A seizure’s neural propagation*.  
    - **CC Prediction**: Trivial mappings (e.g., "the seizure computes chaos") fail criteria (4–5); only structured processes (e.g., working memory) qualify.  
    - **DC Prediction**: Calling seizures "computation" is always metaphorical; the dynamical account (e.g., synchronization bifurcations) is fundamental.  

  ---

  #### **IV. Terminological Disputes**  
  - **"Computation"**:  
    - CC uses it *narrowly* (rule-based symbol manipulation).  
    - DC argues this excludes non-symbolic cognition (e.g., skill learning) and risks overextension.  
  - **"Implements"**:  
    - CC: Requires causal structure matching a program.  
    - DC: Requires observer intent; otherwise, "implementation" is reductive.  
  - **Agreement**: Disputes here are substantive (ontological), not merely semantic.  

