prompt: |-
  I'm a backend engineer with no formal philosphy background, but I've gotten into a long argument with a coworker about whether the brain is a computer. I want the document that two people could actually sign after a real adversarial collaboration: a committed computationalist (the brain implements computations, and that's the right level of explanation) and a committed dynamical-systems/enactivist critic (the brain is a dynamical system, and computation is at best a useful model, not what's really going on). Write the joint statement they'd produce. I want a numbered list of claims both can sign -- about what 'computation' means, levels of description, multiple realizability, what counts as an implementation, the triviality worry that any physical system implements some program under some mapping, and the difference between a system that computes something and one that merely has a computational description. Then a disagreements table with the exact remaining disagreements, each phrased so the side that holds it would accept the wording. Then the cruxes -- I think one is whether implementation is observer-relative or objective, and another is whether representation is needed at all -- and for each crux a concrete case or argument both sides agree bears on it, with each side's prediction written down in advance. If some of the fight turns out to be about words, say which part and why. No reading list or citations, just the document.
reasoning: |-
  We are two researchers who have engaged in an adversarial collaboration to clarify our positions on the question: "Is the brain a computer?" We represent two perspectives:

  - **Committed Computationalist (CC)**: The brain implements computations, and computation is the right level of explanation for cognition.
  - **Committed Dynamical-Systems/Enactivist Critic (DC)**: The brain is a dynamical system, and computation is at best a useful model, not what's fundamentally going on.

  After extensive discussion, we have reached agreement on several points and have clarified our remaining disagreements. We present this document as a joint statement.

  ---

  **I. Points of Agreement**

  We both agree on the following numbered claims:

  1. **Computation Definition**: We agree that "computation" minimally requires a physical system to undergo state transitions that can be described as the manipulation of discrete, symbolic representations according to formal rules (i.e., a program or algorithm). However, we also acknowledge that broader definitions exist (e.g., analog computation, connectionist models), but for the purpose of this document, we focus on the classical symbolic notion as the core of the computationalist claim.

  2. **Levels of Description**: We agree that complex systems can be described at multiple levels (e.g., physical, circuit, algorithmic, functional). The brain can be described at the neural level (as a dynamical system) and, potentially, at an algorithmic/computational level.

  3. **Multiple Realizability**: We agree that a given computation (e.g., addition) can be implemented in multiple physical substrates (e.g., silicon, neurons, mechanical gears). This implies that the computational level is abstract and substrate-independent.

  4. **Implementation Requires Constraints**: Merely being able to map a system's states to computational states does not imply the system is implementing that computation. Implementation requires that the causal structure of the physical system reliably mirrors the formal structure of the computation. Specifically, the physical state transitions must be counterfactually robust and driven by the rules of the computation, not just an arbitrary mapping.

  5. **Triviality Worry**: We agree that if we allow arbitrary mappings, any physical system can be described as implementing any computation. This is not a substantive claim and does not support computationalism. Therefore, the computationalist must provide a principled account of why a particular mapping is the relevant one.

  6. **Computation vs. Computational Description**: We agree that there is a difference between a system that *actually computes* (i.e., its intrinsic causal structure is appropriately constrained to mirror a specific computation) and a system that merely *admits* a computational description (i.e., we can impose an interpretation on its behavior). The former requires that the computation is causally explanatory of the system's behavior.

  ---

  **II. Table of Disagreements**

  We disagree on the following points. Each statement is phrased so that the side holding the view would accept the wording:

  | # | Computationalist (CC) Position                                                                 | Dynamical-Systems Critic (DC) Position                                                                 |
  |---|-----------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | 1 | The brain's cognitive functions (e.g., reasoning, memory, perception) are best explained as the implementation of computations. The computational level provides the most appropriate explanatory framework for cognition. | The brain's cognitive functions are best explained as the behavior of a complex dynamical system, with computation being at best a derived, high-level description that may be useful for some purposes but is not fundamental. |
  | 2 | Representations (discrete, symbolic states with content) are essential to explaining cognition and are implemented by the brain. | Representations (as discrete, symbolic states) are not fundamental to cognition; cognitive processes emerge from the continuous, nonlinear interactions of the brain, body, and environment without requiring symbolic manipulation. |
  | 3 | The implementation of a computation in the brain is an objective fact, not observer-relative. The brain's structure and activity patterns pick out specific computations as the ones it is implementing. | The attribution of computation to the brain is observer-relative; it depends on the purposes and perspective of the modeler. The brain, as a dynamical system, does not intrinsically implement computations. |
  | 4 | The triviality worry is avoided by naturalizing computation: the brain, due to its evolved structure, is "designed" (by evolution) to implement specific computations that support cognition. | The triviality worry reveals that computation is not an intrinsic property of physical systems. The brain's dynamics are primary, and computational descriptions are just one of many possible modeling choices. |

  ---

  **III. Cruxes of the Disagreement**

  We have identified two central cruxes. For each, we specify a concrete case or argument that both sides agree bears on the issue, and we state each side's prediction in advance.

  **Crux 1: Is Implementation Observer-Relative or Objective?**

  - **Concrete Case**: Consider a simple neural circuit (e.g., in the retina) that performs a well-defined function (e.g., edge detection). Both sides agree that this circuit can be described as a dynamical system (e.g., with differential equations) and also as implementing an algorithm (e.g., convolution with a Gabor filter). 
    - **CC Prediction**: There is a fact of the matter about which computation the circuit is implementing (e.g., the convolution algorithm). This fact is determined by the circuit's causal structure and its evolutionary/functional role. If we find that the circuit's state transitions robustly mirror the steps of the convolution algorithm under biologically relevant conditions, then it objectively implements that computation.
    - **DC Prediction**: The choice to describe the circuit as implementing convolution (rather than, say, a dynamical system approximation) is a pragmatic choice made by the modeler. The circuit is fundamentally a dynamical system, and the computational description is just one useful model among others (e.g., a continuous attractor network model). There is no fact of the matter about which description is "true"; only which is more useful for a given purpose.

  **Crux 2: Are Representations Necessary for Cognition?**

  - **Concrete Case**: Consider sensorimotor coordination (e.g., catching a ball). The computationalist might describe this as involving internal representations (e.g., of the ball's trajectory) and computations (e.g., solving differential equations to predict landing position). The enactivist might describe it as a continuous coupling between perception and action without internal representations.
    - **CC Prediction**: If we disrupt specific neural circuits that are hypothesized to implement the representation (e.g., the dorsal stream), the behavior should degrade in ways predictable from the computational model (e.g., errors in trajectory prediction). This supports the necessity of representations and computation.
    - **DC Prediction**: The behavior can be explained and predicted by modeling the agent-environment system as a continuous dynamical system. If we disrupt the system, the breakdowns will be better explained by the failure of dynamical coupling (e.g., loss of stability, altered attractors) than by the loss of a specific representation. Representations are not necessary.

  **Crux 3: What Explains Cognitive Flexibility?**

  - **Concrete Case**: Human cognitive flexibility (e.g., solving a novel problem by analogy) is a hallmark of cognition.
    - **CC Prediction**: This flexibility is best explained by the manipulation of abstract, amodal symbols (computation) that can be recombined according to rules. The brain's ability to implement variable-binding and rule-based operations is key.
    - **DC Prediction**: This flexibility emerges from the dynamics of neural activity patterns shaped by experience and context, without requiring symbolic computation. It can be modeled as trajectories in a high-dimensional state space.

  ---

  **IV. Where the Fight is About Words**

  We acknowledge that some of our disagreement stems from terminological differences:

  - **"Computation"**: The CC uses a narrow, symbolic-representation-based definition, while the DC argues that if computation is broadened to include analog or continuous dynamics, it becomes vacuous (as then any dynamical system "computes"). We agree to stick to the narrow definition for clarity.
  - **"Implementation"**: The CC sees it as an objective relation between physical states and abstract states, while the DC sees it as a modeling choice. This is not merely verbal but reflects a deep ontological divide.

  ---

  **Signed:**

  _________________________  
  Committed Computationalist

  _________________________  
  Committed Dynamical-Systems/Enactivist Critic

