prompt: |-
  I've been arguing with a friend in a philosophy-of-history reading group about what she calls the 'overdetermination thesis,' and I'd like your own credence in it, decomposed rather than asserted. Here is the thesis as precisely as I can state it: for the major transitions in the historical record — the onset of sustained industrialization, the collapse of a large empire or superpower, the displacement of one dominant religion or regime by another — the outcome is typically overdetermined rather than knife-edge, meaning it would have arrived within roughly a generation or two even if any single antecedent that historians single out as pivotal had been absent, where 'pivotal' means an antecedent whose removal in the nearest possible world shifts the outcome's date by more than the interval that typically separates consecutive transitions of that kind. She puts her credence near 0.85; I put mine near 0.35; and I suspect we are not actually disagreeing about the same proposition, so I care more about the decomposition than about your headline number. If the thesis is ambiguous in a way that matters, say which precisification you are adopting and give the number for that one.

  Break it into the sub-questions it depends on, each with a rough probability and one line of justification: first, whether counterfactuals of this form have determinate truth values at all, given indeterminism, chaotic sensitivity to initial conditions, and the fact that 'the outcome' must be described at some level of grain; second, conditional on determinacy, whether historians could in principle assess them, given that we have no controlled experiments and no independent samples of the same transition; third, the empirical base rate — how much of the record really looks like knife-edge contingency (the battle, the accident, the untimely death) versus a process that was going to happen to somebody; fourth, whether the answer varies systematically by domain, with economic and technological transitions more overdetermined and political or military ones more contingent, or the reverse; and fifth, how much the whole thing turns on where we set the 'generation or two' window and on whether we are counting outcome-types or outcome-tokens.

  Then combine the terms into a final credence, tell me which single term the number is most sensitive to and what evidence would move it most, and finish by telling me which of the two of us — the one at 0.85 or the one at 0.35 — is more likely to be wrong about the sub-question we each believe we already agree on.
