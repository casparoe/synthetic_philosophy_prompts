                 t0: +£1.00 (from bet1 and bet2)
                 Monday: we pay him £1 (for bet1) and we also pay £0.80 for bet3 -> total -£1.80
                 Tuesday: 0.

              Net: 1.00 - 1.80 = -0.80. We lost money.

            What went wrong? We should have bought a bet on Tuesday at t0 and then sold it on Monday? 

            Let's try:

              At t0:
                 - We buy from him a bet on Monday for £0.50: so we pay him £0.50, and if rain Monday, he pays us £1.
                 - We buy from him a bet on Tuesday for £0.50: we pay him £0.50, and if rain Tuesday, he pays us £1.

              Then on Monday, if it rains:
                 - He pays us £1 for the Monday bet.
                 - We then sell him a bet on Tuesday at his new price: he pays us £0.80 and we promise to pay £1 if rain Tuesday.

              Then on Tuesday, if it rains:
                 - He pays us £1 for the Tuesday bet (the one we bought at t0) -> we get £1.
                 - We pay him £1 for the bet we sold on Monday -> we lose £1.
                 - Net on Tuesday: 0.

              Now cash flows:
                 t0: -0.50 (Monday) -0.50 (Tuesday) = -£1.00
                 Monday: +1.00 (from Monday bet) +0.80 (from selling the new Tuesday bet) = +£1.80
                 Tuesday: 0.
                 Total: -1.00 + 1.80 = +£0.80.

