              "If the first card drawn is red, what will you set for the probability that the second card is red? Write: P1(D) = ?"

            Then we choose a student who sets P1(D) ≠ 4/9 (say 0.6).

            Then the bookie does:

              At t0: 
                 - Sells the student a conditional bet on D given that the first card is red. The stake is 1. The price is P0(D|first red) * 1 = 0.5.
              At t1 (after seeing the first card is red):
                 - The bookie buys from the student a bet on D at the new price P1(D)=0.6. So the bookie pays 0.6.

            Then the student's loss: 
               t0: -0.5
               t1: +0.6
               But then when we draw the second card, if D occurs (second card red), the student has to pay 1 on the bet they sold at t1, but they also get 1 from the conditional bet? So they break even? But they have a net of 0.1? 

            However, as before, the net cash flow is -0.5+0.6 = +0.1? But then they have to pay out if D occurs? And they get paid if D occurs? 

            Let's clarify the bets:

              Conditional bet (sold by bookie at t0): 
                 - The student paid 0.5 at t0.
                 - If the first card is red, then the bet becomes active: the bookie will pay the student 1 if the second card is red, and 0 if blue.

              Bet at t1 (sold by student to bookie at t1):
                 - The student receives 0.6 at t1.
                 - The student promises to pay the bookie 1 if the second card is red, and 0 if blue.

            So if the second card is red:
                 - Student gets 1 from the conditional bet.
                 - Student pays 1 to the bookie for the t1 bet.
                 - Net on the bets: 0.
                 - Net cash: -0.5 (t0) +0.6 (t1) = +0.1.

            If the second card is blue:
                 - Student gets 0 from the conditional bet.
                 - Student pays 0 to the bookie for the t1 bet.
                 - Net cash: -0.5+0.6 = +0.1.

            So the student gains 0.1 in both cases? We want a loss.

            We did it backwards. We need to reverse the bets if the future probability is higher? 

            If the student sets P1(D)=0.6 > P0(D|first red)=0.5, then the bookie should:

              At t0: 
                 - BUY a conditional bet on D given first red from the student. The bookie pays the student 0.5 (the student receives 0.5).
              At t1:
                 - SELL an unconditional bet on D to the student for 0.6 (so the student pays 0.6 to the bookie).

            Then:

              If second card is red:
                 - On the conditional bet (which the bookie bought): the student pays the bookie 1.
                 - On the unconditional bet (which the bookie sold): the bookie pays the student 1.
                 -> net on bets: 0.
                 - cash: +0.5 (t0) -0.6 (t1) = -0.1.

              If second card is blue:
                 - net on bets: 0.
                 - cash: +0.5 -0.6 = -0.1.

            So the student loses 0.1.

            Therefore, the rule for the bookie:

              If the student's future probability r' = P1(D) > r = P0(D|E), then at t0 the bookie buys a conditional bet from the student (student sells) and at t1 sells an unconditional bet to the student.

              If r' < r, then at t0 the bookie sells a conditional bet to the student and at t1 buys an unconditional bet from the student.

            In both cases, the student loses |r - r'| * stake.

          So in class, we can do:

            - We announce that we will only consider the case where the first card is red (so E="first card red" occurs).
            - Students set at t0: P0(D | first red) and also what they will set at t1 for P1(D) if they see first red.
            - The TA then for each student (or a volunteer) calculates the loss as |r - r'| and shows the two transactions.

