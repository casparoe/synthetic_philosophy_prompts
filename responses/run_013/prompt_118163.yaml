            Steps for the bookie (when the agent raises the probability after seeing rain on Monday):

              At t0: 
                 - Bookie buys a bet on Monday from the agent at £0.50.
                 - Bookie buys a bet on Tuesday from the agent at £0.50.

              At t1 (Monday and it rained):
                 - The agent pays the bookie £1 for the Monday bet.
                 - The bookie sells a bet on Tuesday to the agent at £0.80.

              On Tuesday:
                 - If it rains: 
                      - The agent pays the bookie £1 for the original Tuesday bet (bought at t0).
                      - The bookie pays the agent £1 for the bet sold on Monday.
                 - If it doesn't rain on Tuesday:
                      - The original Tuesday bet: nothing.
                      - The bet sold on Monday: the bookie doesn't pay.

              So if it rains on Tuesday, the cash flows cancel for the Tuesday bets.

              The bookie's profit: 
                 t0: -0.50-0.50 = -1.00
                 t1 (Monday): +1.00 (from Monday bet) +0.80 (from selling the new bet) = +1.80
                 -> net: +0.80.

