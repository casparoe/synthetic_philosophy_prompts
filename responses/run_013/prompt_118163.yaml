     **Materials**:
     - Worksheets for Round 1 (three claims: A, B, C).
     - Worksheets for Round 2 (diachronic: event D and conditioning event E, and future probability if E occurs).

     **Payoff scheme**:
     - Use points. Each student starts with 100 points. Losses subtract points. We are not using real money.

     **Timeline**:
     - 0-10 min: Introduction.
     - 10-30 min: Round 1 (including student setting odds, TA choosing a victim, and running the Dutch book for that student).
     - 30-50 min: Round 2 (students set probabilities for the card example, then TA runs the Dutch book for one or two students in the red-first-card scenario).
     - 50-70 min: Debrief and discussion.
     - 70-75 min: Limitations and wrap-up.

     **Debrief**:
     - Round 1: 
          - The moment the student objects: they think they are just being honest about their beliefs. But the Dutch book shows that if they are willing to bet at those odds, they can be forced into a sure loss. The constraint that did the work: probabilities must be non-negative, normalized, and additive for mutually exclusive events. Specifically, for mutually exclusive A and B, P(A or B) = P(A)+P(B), and for a tautology C, P(C)=1.

     - Round 2:
          - The constraint: updating must be by conditionalization. The future probability after seeing E must be the same as the conditional probability set at t0.

     **Limitations**:
     - The Dutch book argument assumes that the agent is willing to accept any bet at their stated odds. In reality, people might not want to bet at all, or might change their odds after being asked to bet. The argument assumes that the agent is committed to those odds for any stake, positive or negative (which corresponds to buying or selling). In your climbing gym example, the person might not care about losing money, or might not be committed to the odds beyond a small amount.

     - The diachronic Dutch book in particular assumes that the agent pre-commits to update in a particular way and that the bookie can wait to place the second bet. In reality, the agent might learn from the bookie's actions.

     - The argument is about coherence (avoiding sure loss) and not about rationality per se. One might be coherent but still have inaccurate probabilities.

     - We are only demonstrating with small discrete cases.

     **What might go wrong**:
     - In Round 1, students might set probabilities that are coherent, so you don't have a victim. Solution: Have a few plants? Or encourage them to set what they really believe (and if they set coherently, that's fine, then we can show that they are safe).

     - In Round 2, the card example might be too complex. Some students might not understand the conditional probabilities.

     - Time: The activity might run over.

     - The diachronic Dutch book demonstration is mathematically involved and might lose some students.

