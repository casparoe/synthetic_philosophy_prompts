answer: |-
  ### Dutch Book Activity Design for Intro Philosophy of Probability

  **Activity Goal:**  
  Students experience being "Dutch booked" (a sure loss through inconsistent betting odds) in two rounds: synchronic (static beliefs) and diachronic (updating beliefs after evidence). They confront the tension between subjective probabilities and rational betting strategies, culminating in the objection that they've "done nothing wrong" by expressing their beliefs.

  **Materials:**  
  - Worksheets with claim descriptions  
  - Play money tokens (each student starts with £100 in tokens)  
  - Two hats or containers for betting slips  
  - A coin and a deck of playing cards (for evidence in Round 2)  
  - Whiteboard to track bets  

  **Claims for Round 1 (Synchronic):**  
  1. **A**: "The next student to walk into the room is wearing glasses."  
  2. **B**: "The next student to walk into the room is *not* wearing glasses."  
  3. **C**: "Either A or B is true" (tautology).  

  **Claims for Round 2 (Diachronic):**  
  - **D**: "The top card of this shuffled deck is a Heart."  
  - **E**: "The coin flip (done later) lands Heads." (Evidence that updates beliefs about D)  

  ---

  ### Rules and Payoff Scheme  
  **Betting Rules:**  
  1. **Odds Setting**: Students assign probabilities (0–100%) to each claim, converted to odds (e.g., P(A) = 60% → odds 3:2).  
  2. **Staking**: A designated "bookie" (TA or volunteer) chooses:  
     - Which claim to bet on (A/B/C or D/E)  
     - Which side to take (e.g., *for* A or *against* A)  
     - Stake size (fixed at £10 to simplify).  
  3. **Payouts**:  
     - If the claim happens, "yes" bettors win: **stake × (1/odds)**.  
     - If not, "no" bettors win: **stake × odds**.  
     - *No real money*: Tokens are symbolic (e.g., 1 token = £1).  

  **Key Constraint:**  
  Students *must* accept any bet at their stated odds (simulating the Dutch book assumption of "no arbitrage").  

  ---

  ### Timeline (75 Minutes)  
  #### **0–10 min: Setup and Round 1 Briefing**  
  - Explain betting rules and claims A, B, C.  
  - Emphasize: "Set odds *you* find fair. No right/wrong answers."  
  - Distribute tokens.  

  #### **10–25 min: Round 1 (Synchronic Dutch Book)**  
  1. **Odds Setting**: Students write their P(A), P(B), P(C) on slips. Collect slips in a hat.  
  2. **Bookie’s Move**:  
     - TA picks a student with inconsistent odds (e.g., P(A) + P(B) = 70% < 100%, or P(C) < 100%).  
     - TA, as bookie, proposes 2–3 bets:  
       - *Example 1 (P(A)+P(B) < 100%)*:  
         - Bet £10 *for* A at student’s odds (e.g., if P(A)=40%, payout = £10 × (1/0.4) = £25).  
         - Bet £10 *for* B at student’s odds (e.g., P(B)=30%, payout = £10 × (1/0.3) ≈ £33).  
         - TA’s cost: £10 + £10 = £20. Student’s max payout: £25 + £33 = £58.  
         - *Outcome*: A or B must happen. If A, student pays £25; if B, £33. But £25 > £20 and £33 > £20 → student loses £5–£13.  
       - *Example 2 (P(C) < 100%)*:  
         - Bet £10 *for* C at student’s odds (e.g., P(C)=90%, payout = £10 × (1/0.9) ≈ £11).  
         - *Outcome*: C always happens → student *always* pays £11, costing them £1.  
  3. **The Objection Moment**:  
     - Targeted student protests: "I’ve done nothing wrong! I set my *true* beliefs!"  
     - Class discussion: "Why did you lose? What assumption forces this?"  

  #### **25–45 min: Round 2 (Diachronic Dutch Book)**  
  1. **Odds Setting**: Students set:  
     - P(D) now (e.g., 50% for "top card is Heart").  
     - P(D|E) *later*: What they *will* set for D *after* seeing a coin flip (E).  
     - Collect slips.  
  2. **Evidence Phase**: Flip a coin (E = Heads). Suppose it lands Heads.  
  3. **Bookie’s Move**:  
     - TA picks a student where P(D) and P(D|E) violate conditionalization (e.g., P(D) = 50%, but after E, they set P(D|E) = 70%).  
     - TA proposes:  
       - *At t0 (now)*: Bet £10 *against* D at P(D)=50% (student wins £10 if D false).  
       - *At t1 (after E)*: Bet £10 *for* D at P(D|E)=70% (student wins ≈£14.30 if D true).  
     - *Outcome*:  
       - If D true: Student loses £14.30 (t1 bet) but wins £10 (t0 bet) → net loss £4.30.  
       - If D false: Student wins £10 (t0) but loses nothing (t1) → net gain £10.  
       - BUT: TA then reveals **D is fixed** (rigged deck: top card *always* Hearts). Student loses £4.30 regardless.  
  4. **The Objection Moment**:  
     - Student: "I updated honestly! Why lose?"  
     - Discussion: "Your *future* odds didn’t match your *current* conditional odds."  

  #### **45–60 min: Debrief**  
  Map each loss to the violated axiom:  
  | **Moment**               | **Violated Constraint**                          | **Dutch Book Consequence**                             |  
  |--------------------------|--------------------------------------------------|--------------------------------------------------------|  
  | Round 1: P(A)+P(B) < 100% | Additivity (P(A ∨ B) = P(A) + P(B) for disjoint)| Bookie ensures loss by betting on all outcomes.        |  
  | Round 1: P(C) < 100%      | Normalization (P(tautology) = 1)                | Bookie exploits guaranteed event.                      |  
  | Round 2: P(D\|E) ≠ P(D)   | Conditionalization (update = prior conditional) | Bookie exploits mismatch between current and future self. |  

  **Key Insight**:  
  - Dutch books expose *inconsistency*, not "wrong" beliefs. If your odds aren’t probabilities (e.g., non-additive), *any* bookie can force a loss.  
  - The argument assumes you **accept any bet at your odds** and **don’t value risk** (limitations below).  

  #### **60–75 min: Limitations and Wrap-up**  
  **What the Game Can’t Capture (Honest Notes):**  
  1. **Money ≠ Belief**: Your climbing gym peer might value fun over money. Dutch books assume linear utility (£1 = £1). If he’s risk-loving or indifferent to losses, the argument fails.  
  2. **Betting Resistance**: Real people refuse exploitative bets. Dutch books require *unlimited, commitment* to odds—rare in practice.  
  3. **Evidence Dynamics**: In Round 2, seeing evidence *might* change your worldview (e.g., learning the coin is biased). Conditionalization assumes evidence is the *only* update.  
  4. **Small Stakes**: With tiny bets, losses feel trivial. The argument needs stakes large enough to "hurt."  

  **Predictable Pitfalls:**  
  - **Slow Odds Setting**: Students overthink probabilities. *Fix*: Use simple claims (e.g., "glasses") and a timer.  
  - **Coherent Students**: Some set consistent odds. *Fix*: Have a backup "plant" with P(A)=40%, P(B)=40%, P(C)=90%.  
  - **Misunderstanding Payouts**: Confusion over odds conversions. *Fix*: Use a calculator and examples on the board.  
  - **Rigging Backlash**: Students may protest the fixed card in Round 2. *Fix*: "We’re simplifying to show the logic—real evidence isn’t rigged."  

  **Closing Message:**  
  "Dutch books show that violating probability axioms makes you *exploitable*. But is avoiding exploitation the same as being rational? Or is your gym buddy just enjoying the game? That’s next week’s topic: *Subjectivism vs. Pragmatism*."  

  ---  
  **British English Check**: Done (e.g., "maths" → "maths", "realise" → "realise", "organisation" → "organisation").
