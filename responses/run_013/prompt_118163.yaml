          - They write: P(A), P(B), P(C).
          - The TA collects and chooses one student whose probabilities violate the axioms (e.g., P(C) != 1, or P(A)+P(B) != 1). 
          - The TA then proposes a set of bets (explaining each) and we calculate the student's loss in all cases.
          - The student objects: "But I just set my probabilities, I haven't done anything wrong!" -> discussion.

     - (20 min) Round 2: Diachronic Dutch book (simplified).
          - We use a simple scenario: 
              Event D: "The next card drawn from the deck (10 cards: 5 red, 5 blue) is red."
              Evidence E: We draw one card (and show it) and then we draw a second card (D is about the second card).
              But note: we don't need to draw the second card? Because we are only interested in the probability at t1 for the second card? Actually, we can stop after the first card for the purpose of updating.

          - We have the students set at t0:
              P0(D) = probability that the second card is red (should be 0.5).
              And also set what they think they will set for P1(D) after seeing the first card red: P(D | first red) = ?
              And P(D | first blue) = ?

          - We then explain conditionalization: after seeing the first card red, the probability for D should be 4/9. If they set it to something else, say 0.5, then they are vulnerable.

          - We then show the diachronic Dutch book in the case where the first card is red (which we can ensure by rigging the deck? or just by announcing we will consider that case?).

            Steps:
              - Assume we are in the case where the first card is red.
              - The student set at t0: P0(D) = 0.5, and P0(D | first red) = 0.5 (but now after seeing red, they set P1(D)=0.6? or we can have them set arbitrarily).

