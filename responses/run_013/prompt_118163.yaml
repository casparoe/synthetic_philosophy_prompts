                     t0: +0.50+0.50 = +1.00
                     Monday: -1.00 (for bet1) and -0.80 (for bet3) = -1.80
                     Tuesday: 0 (because bet2 and bet3 cancel)
                     Total: 1.00 - 1.80 = -0.80? 

            This is not right.

            Correction:

              We sold bet2 at t0: so if it rains on Tuesday, we owe him £1.

              We bought bet3 on Monday: so if it rains on Tuesday, he owes us £1.

              So they cancel.

