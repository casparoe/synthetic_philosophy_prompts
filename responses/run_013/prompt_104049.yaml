prompt: |-
  I run privacy review at a mid-sized consumer software company. A few dozen product features cross my desk each quarter, each on roughly a one-week clock, and my sign-off has to survive two audiences that share none of my concerns: a legal review that cares only about statutes and a public post-mortem if we ship something and it goes wrong. My team is made up of lawyers and product managers with no philosophical training, so whatever you give me has to be runnable by them without the theory behind it. The philosophy of privacy is the only body of thought I know of that takes seriously the things a compliance checklist cannot see: that a flow of information can be entirely lawful and still wrong; that privacy is not secrecy, so the nothing-to-hide objection settles nothing; that the relevant unit of concern is not always the individual whose data it is; and that the wrong of a privacy violation can survive even when no one can point to a concrete harm. I want you to turn the usable part of that literature into a procedure.

  Write it as an ordered set of questions a reviewer asks of a proposed feature. The questions should surface what the feature changes about who knows what about whom, in which role, under the norms of which context, and against which expectations of the people involved; whether it substitutes one kind of relationship for another (friends into mutual monitors, customers into suspects, patients into data subjects); whether the individual's control over the flow is preserved or quietly reassigned to someone else; and whether the interest at stake is individual, relational, or collective, and who bears the cost when those diverge. For each question, say what counts as a sufficient answer, where the procedure terminates in a refusal, and where it must hand the decision to a person because the question is one of values rather than facts. The procedure must not collapse into "obtain consent": I need to know which cases consent can rescue and which it cannot, and why the difference matters. Where the literature disagrees with itself — for instance over whether privacy is best understood as control over information, as limited access to the self, or as the fit between a flow and the norms of its context — say which reading your procedure commits to and what it therefore cannot see.

  Then run it, step by step, on three features, marking as you go the points where the procedure strains:

  - A closeness score computed from metadata — how often two users message, call, and are co-located — displayed beside each contact in the address book.
  - An opt-out crisis-detection system that scans messages for indications of self-harm and routes flagged conversations to a human moderator and, in severe cases, to emergency services.
  - A default-on setting that shares a user's precise location with a small circle of family accounts, including adult children monitoring elderly parents.

  At least one of these should come out the way the product team will not want to hear, and you should not soften the verdict to avoid that. Finish by saying plainly what the procedure cannot do: the cases where it will give a confident-sounding answer on the basis of a contested norm, the cases where two of its questions point in opposite directions and the tiebreak is a political choice rather than an analytic one, and the cases where the honest output is that the feature is not wrong but the company should not ship it anyway. Do not cite sources or supply a reading list; I care about the machinery, not the bibliography.
reasoning: |-
  Okay, the user runs privacy reviews at a mid-sized software company. They're dealing with dozens of product features each quarter, each needing a quick review. Their challenge is balancing legal compliance with ethical concerns that go beyond statutes. They have two audiences: legal (who only care about laws) and public backlash if something goes wrong. Their team consists of lawyers and product managers without philosophical training, so the process needs to be practical.

  The user wants a procedure based on privacy philosophy that addresses issues like lawful but unethical data use, privacy vs. secrecy, non-individual harms, and violations without concrete harm. They need an ordered set of questions that examine information flows, relationship transformations, control shifts, and interest types. The procedure must avoid collapsing into "just get consent" and should clarify when consent works and when it doesn't.

  I need to create a step-by-step questioning framework. Each question should specify what a sufficient answer looks like, when to refuse the feature, and when to escalate to human judgment. The framework should commit to specific philosophical stances where necessary, acknowledging limitations.

  Then I'll apply this to three features:  
  1. A "closeness score" based on messaging/call/location metadata shown in address books  
  2. An opt-out self-harm detection system scanning messages  
  3. Default location sharing with family (elder monitoring)  

  At least one should get a "no" recommendation. Finally, I'll outline the procedure's limitations: contested norms, conflicting answers requiring political choices, and cases where something isn't wrong but shouldn't be shipped.

  The user's deeper needs include:  
  - Practical tools for non-philosophers  
  - Preventing ethical blind spots in fast-paced development  
  - Authority to push back against product teams  
  - Framing ethical concerns in actionable terms  
  - Distinguishing between legal and ethical approval  

  I'll structure the procedure as 6 core questions:  
  1. Information Flow Mapping - What's collected, inferred, shared, and with whom?  
  2. Contextual Norms & Expectations - Does this fit the context?  
  3. Relationship Transformation - How does this change human relationships?  
  4. Control & Agency - Who controls the information flow?  
  5. Interest Alignment - Whose interests are served/protected?  
  6. Consent Assessment - Can consent fix the issues?  

  For each feature analysis, I'll mark where the procedure strains. The closeness score should fail (privacy theater, unavoidable exposure), crisis detection should pass with conditions (life-saving but needs opt-out respect), and location sharing should get a qualified yes (with consent and control caveats).

  Key philosophical commitments:  
  - Contextual integrity (Nissenbaum) as primary framework  
  - Rejecting "nothing to hide" arguments  
  - Recognizing relational/collective harms  
  - Control as necessary but insufficient  

  Limitations to highlight:  
  - Cultural norm disagreements  
  - Tradeoffs between safety and autonomy  
  - "Not wrong but don't ship" scenarios
answer: |-
  Here is a privacy review procedure derived from philosophical principles, structured as six ordered questions. It commits to **contextual integrity** (Helen Nissenbaum’s framework) as its core lens, treating privacy as the alignment of information flows with the norms of specific contexts. This prioritizes *appropriateness* (whether the flow fits the context) and *distribution* (whether the actors sending/receiving information match expectations). It explicitly rejects "privacy as secrecy" or "privacy as pure control," though control is treated as one norm among many. **Limitation:** This underweights purely individual autonomy claims if contextual norms are strong (e.g., a communal society’s expectations might override an individual’s dissent).

  The questions must be answered sequentially. A "**Refuse**" verdict stops the review. "**Escalate**" flags a values conflict requiring executive/C-suite judgment. Product teams must provide evidence for claims about user expectations or norms.

  ---

  ### The Procedure
  1. **What information flows are created or altered?**  
     *Detail: What data is collected, inferred, or shared? With whom (internal roles/external parties)? In what capacity (e.g., user-as-subject vs. user-as-decision-maker)?*  
     - *Sufficient answer:* Exhaustive list of data types, recipients, and purposes. No hidden flows (e.g., "metadata used for closeness score" must include who sees the score).  
     - *Refuse:* If flows are intentionally obscured, incoherent, or contradict documentation.  
     - *Escalate:* If the flow has multiple plausible contextual classifications (e.g., is health data in a chat app "medical" or "social"?).

  2. **Does this flow violate contextual norms?**  
     *Detail: What is the primary context (e.g., healthcare, social, commerce)? What are the entrenched norms for information appropriateness (should this data be shared here?) and distribution (should these actors have it?) in that context? Is this flow expected by users?*  
     - *Sufficient answer:* Evidence of norms (e.g., industry standards, user research, analogies to offline equivalents). If no evidence, default to most restrictive reasonable norm.  
     - *Refuse:* If the flow is intrinsically inappropriate (e.g., broadcasting financial data in a gaming context without justification).  
     - *Escalate:* If norms are contested (e.g., sharing location with family in a "safety" context vs. "social" context).

  3. **What relationships are transformed by this flow?**  
     *Detail: Does this redefine roles (e.g., friend-to-watcher, customer-to-suspect)? Does it create power imbalances (e.g., observer/subject)? Does it reduce trust or intimacy?*  
     - *Sufficient answer:* Description of pre-flow and post-flow relationships. Example: "Users were contacts; now one is a 'scored subject' and the other a 'rater'."  
     - *Refuse:* If it incentivizes harmful relationships (e.g., turning peers into constant auditors).  
     - *Escalate:* If transformation serves a competing moral good (e.g., safety vs. autonomy).

  4. **Who controls the flow? Is agency preserved or reassigned?**  
     *Detail: Can the data subject start/stop the flow? Can others override them? Is control meaningful (e.g., granular, informed) or tokenistic (e.g., blanket consent)?*  
     - *Sufficient answer:* Mapping of control points (e.g., user settings, override rules) and evidence they’re actionable (not dark patterns).  
     - *Refuse:* If control is removed post-collection (e.g., irreversible data sharing) or assigned solely to a non-subject (e.g., a parent overriding an adult).  
     - *Escalate:* If control conflicts with context (e.g., consent for inappropriate flows).

  5. **Whose interests are at stake? Where do they diverge?**  
     *Detail: Is the interest individual (autonomy), relational (trust), or collective (public safety)? Who bears costs/risks? Who benefits?*  
     - *Sufficient answer:* Explicit stakeholder analysis (e.g., "User bears reputational risk; company gains engagement metrics").  
     - *Refuse:* If costs are forced onto vulnerable groups without consent or offsetting benefit (e.g., profiling minorities).  
     - *Escalate:* If interests irreconcilably conflict (e.g., individual privacy vs. family safety).

  6. **Can consent legitimize this? Why or why not?**  
     *Detail: Is consent possible (no coercion), informed (risks clear), and granular? Would consent repair a contextual norm violation?*  
     - *Sufficient answer:* Justification for why consent does/doesn’t resolve prior issues. Consent cannot fix:  
       - Appropriateness violations (e.g., selling health data in a shopping app, even with consent).  
       - Structural power imbalances (e.g., employer demanding location tracking).  
       - Collective harms (e.g., aggregate data enabling discrimination).  
     - *Refuse:* If consent is treated as curative for non-consent-able harms (see above).  
     - *Escalate:* Never. This is a factual gate: if consent can’t resolve prior refusals, the answer is "no."

  ---

  ### Application to Features
  **Feature 1: Closeness Score in Address Book**  
  1. **Flow:** Metadata (messaging frequency, calls, co-location) → inferred "closeness" score → displayed to the user viewing the contact.  
     *Strain:* Is the score "new data" or a "display of existing data"? Procedure treats inferences as new flows.  
  2. **Context:** Social (address book). Norms: Expectations of reciprocal awareness ("we both know we interact"). *Violation:* Broadcasting quantified intimacy is inappropriate (turns relationships into rankings). Users expect metadata for service operation, not social scoring.  
  3. **Relationship:** Transforms contact → subject of evaluation. Creates observer/subject dynamic; recipient gains power to judge.  
  4. **Control:** Subject has no control over scoring or display. Agency reassigned wholly to observer.  
  5. **Interests:** Individual (subject’s reputation/autonomy) at risk. Company benefits via engagement. Costs forced onto subject.  
  6. **Consent:** Cannot repair. Consent here is tokenistic—subject can’t meaningfully avoid scoring if they use the app. Appropriateness violation (social scoring) isn’t consent-able.  
  **Verdict: Refuse at Q2.** Even with consent, this substitutes mutual social understanding for one-sided surveillance.  

  **Feature 2: Opt-Out Self-Harm Detection**  
  1. **Flow:** Message content → scanned for self-harm indicators → flagged to human moderator → severe cases to emergency services.  
  2. **Context:** Private communication (e.g., messaging). Norms: High confidentiality expected. *But* safety may override if confined (e.g., suicide prevention). Not inherently inappropriate if narrowly scoped.  
     *Strain:* Is this "health" or "safety" context? Procedure defaults to health (stricter norms) but allows escalation.  
  3. **Relationship:** Transforms friend/confidant → potential risk-source. Moderator becomes intervener. Power imbalance, but potentially justified.  
  4. **Control:** Opt-out provided. But subject (message author) may not know they’re being scanned. Moderator can escalate without subject’s input.  
     *Strain:* Opt-out shifts burden to user—procedurally "control" exists, but contextually inadequate?  
  5. **Interests:** Individual (life/safety) and collective (duty to prevent harm) vs. relational (trust). Subject bears risk of false positives (stigma, police intervention).  
  6. **Consent:** Opt-out cannot legitimize core flow if context is "health" (Q2). But if safety context, consent may work. **Escalate at Q2:** Values conflict (life vs. autonomy).  
  **Conditional Verdict:** If executives judge safety context overrides, then *permitted with changes*: mandatory in-app disclosures about scans, opt-out respected instantly, no secondary use of data.  

  **Feature 3: Default-On Location Sharing with Family**  
  1. **Flow:** Precise location → shared by default with predefined "family" group (including adult children monitoring elderly parents).  
  2. **Context:** Family/safety. Norms: Expectations vary (elder care may justify sharing; adult children monitoring parents may invert care roles). Appropriateness depends on explicit familial agreement.  
     *Strain:* "Family" is ambiguous—procedure requires specificity.  
  3. **Relationship:** Transforms parent → monitored subject, child → custodian. Risks infantilizing parent, eroding trust.  
  4. **Control:** Default-on reassigns control to family group. Parent may not understand how to disable.  
  5. **Interests:** Relational (family safety) vs. individual (parent’s autonomy). Parent bears all risk (e.g., stalking by family member).  
  6. **Consent:** Default-on violates contextual norms (Q2). Consent could work if: opt-*in*, granular (per member), and reversible. But cannot fix power imbalances if parent is coerced.  
  **Verdict: Refuse at Q4 unless redesigned.** Must be opt-in, with parent controlling each share. Default-on quietly reassigns agency.  

  ---

  ### What the Procedure Cannot Do
  - **Contested Norms:** It will confidently "refuse" based on contextual norms that may be culturally disputed (e.g., U.S. vs. EU expectations of family data sharing). It cannot adjudicate these—assumes conservative norms.  
  - **Conflicting Answers:** When one question refuses (e.g., Q2 appropriateness) but another suggests a moral override (e.g., Q5 collective safety), the tiebreak is political (e.g., "safety over privacy"). The procedure forces this to executive escalation but doesn’t resolve it.  
  - **Not Wrong, But Don’t Ship:** It cannot detect "moral spillover"—e.g., a feature that passes all checks but entrenches surveillance capitalism in society. It also misses reputational risks detached from privacy harms (e.g., a feature that is ethical but easily misused).  
  - **Control as Panacea:** It rejects consent fixes for structural issues, but cannot quantify when "meaningful control" is illusory (e.g., technically granular settings buried in menus).  
  - **Harmless Wrongs:** Its refusal of "no concrete harm" violations (e.g., closeness scores) may frustrate teams who see this as theoretical. It cannot prove the wrong—it asserts it based on contextual integrity.  

  **Final note:** This generates friction by design. It refuses features that commodify relationships (closeness score) or stealthily shift control (default location sharing). Product teams will object, but the procedure forces justification against human-centered norms—not just legal minima. Use the "escalate" flags to isolate values disputes for leadership.
