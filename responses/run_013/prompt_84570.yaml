prompt: |-
  People keep defending sortition with the same move and I want it audited properly. The move goes like this: a citizens' assembly picked by lot is basically jury duty writ large — we already trust twelve random strangers with a person's liberty, so trusting a few hundred of them with a policy question is a small, familiar step rather than a leap into the unknown. I'm sympathetic, but I suspect the analogy is carrying more weight than it can bear, and I've noticed that when I push on it the reply definately shifts: juries aren't supposed to be a representative sample anyway, they're supposed to be impartial, and that's the same thing the assembly is after. Is it? Please write me an audit:

  - The mapping (table, ~200 words): what corresponds to what across the two — how members get picked, who sets the question they answer, what grounds their authority, what their decision binds, what representative means on each side, whether participation is compelled and how it's paid.
  - Where it breaks (~300 words): the disanalogies that matter for the intended use (making lottocracy look like a small step), the ones that are merely cosmetic, and which is which.
  - What it smuggles in (~250 words): features of the jury the analogy quietly imports that a citizens' assembly doesn't have — in particular, whether impartiality and descriptive representativeness are really the same good, and what happens to the argument if they aren't.
  - Verdict (~250 words): does the small-familiar-step conclusion survive the audit, and if it doesn't, is there an analogy that would carry it better?

  No reading lists or citations, just the audit.
reasoning: |-
  Okay, the user wants me to conduct an audit of the analogy between juries and citizens' assemblies in sortition systems. They're noticing that when they challenge this comparison, defenders shift to emphasizing impartiality over representativeness, and they suspect the analogy might be flawed. 

  First, I need to unpack how this analogy typically works. The core claim is that since we trust random juries with serious decisions, trusting larger random assemblies with policy should feel like a small step. But when pressed, proponents retreat to "impartiality" as the shared goal, which feels like moving the goalposts. 

  For the mapping section, I'll need to compare the mechanics side-by-side: selection methods (both random but different scales), who frames the questions (judge vs. government/politicians), binding power (court verdicts vs. advisory policy), and how "representative" functions in each context (juries aren't actually demographically representative in practice). 

  The disanalogies section is where it gets juicy. The scale difference isn't just cosmetic—500 people don't deliberate like 12. The stakes shift from individual justice to societal rules. And crucially, juries operate within a rigid legal framework while assemblies tackle open-ended policy with no objective "right answer." 

  Ah, and the smuggling! The analogy quietly assumes "impartiality" and "representativeness" are interchangeable when they're not. Juries seek neutrality toward facts, while assemblies aim for diverse perspectives. That's a bait-and-switch. Also smuggles in the courtroom's structured process as if it automatically applies. 

  For the verdict... no, this analogy doesn't hold. It papers over the harder questions about how assemblies actually work. Maybe "trial by jury" feels familiar, but "governing by jury" is fundamentally different. A better analogy might be scientific consensus panels—random experts assessing evidence—but even that has issues. Ultimately, citizens' assemblies need to stand on their own merits.
answer: |-
  ### Audit of the Jury Analogy for Citizens' Assemblies  

  #### The Mapping (~200 words)  
  **Members Picked:** Both use random selection (sortition) from a population pool. Juries draw from voter/citizen rolls; assemblies often use stratified random sampling for demographic balance.  
  **Question Set By:** For juries, the court (judge/prosecution/defense) defines the legal question. For assemblies, the commissioning authority (government, parliament) sets the policy question.  
  **Authority Grounds:** Juries derive authority from legal tradition and statutes; assemblies from ad hoc mandates (usually legislative or executive approval).  
  **Decision Binds:** Jury verdicts are binding (guilt/innocence); assembly outputs are typically advisory, requiring political adoption.  
  **Representative Meaning:** Juries seek *impartiality*—no stake in the outcome. Assemblies emphasize *descriptive representativeness*—mirroring population demographics.  
  **Participation:** Both compel service (jury duty vs. assembly summons), but assemblies often have higher opt-out allowances. Payment is modest (daily stipends) in both, though assemblies may compensate more generously for longer terms.  

  #### Where the Analogy Breaks (~300 words)  
  **Critical Disanalogies:**  
  1. **Stakes and Scope:** Juries decide binary facts ("Did X kill Y?") under strict legal rules. Assemblies evaluate complex policy trade-offs (e.g., climate action) with no single "correct" answer. The leap from applying law to *making* law is vast, not incremental.  
  2. **Deliberative Scale:** Juries (12 people) deliberate privately with unanimity/consensus goals. Assemblies (100–500 people) use facilitated group processes, split into subgroups, and produce reports. Scaling deliberation changes dynamics radically.  
  3. **Epistemic Framework:** Juries rely on courtroom evidence (vetted by rules of admissibility). Assemblies digest curated briefings, expert testimony, and stakeholder advocacy—vulnerable to agenda-setting bias.  
  4. **Binding Power:** A jury’s verdict ends the case; an assembly’s recommendation enters the political arena, where it can be ignored, diluted, or weaponized.  

  **Cosmetic Disanalogies:**  
  - Payment differences or selection pool size are surface-level.  
  - The "random strangers" element is shared but trivial—what matters is *how* randomness functions in each context (e.g., juries aren’t demographically representative).  

  #### What It Smuggles In (~250 words)  
  The analogy covertly imports two features of juries into assemblies:  
  1. **"Impartiality = Representativeness":** Juries prioritize impartiality (no prior case knowledge) and assume it emerges from randomness. Assemblies *explicitly* seek descriptive representativeness (demographic mirroring) and conflate this with neutrality. But statistical representativeness ≠ individual impartiality. A descriptively representative group may still harbor biases, groupthink, or susceptibility to manipulation—unlike jurors instructed to disregard prejudice.  
  2. **Institutional Legitimacy:** Courts have centuries of legitimacy; assemblies lack comparable cultural authority. The analogy masks this by implying assemblies inherit the jury’s perceived neutrality. Worse, it glosses over that juries operate within appeals processes and judicial oversight—assemblies have no equivalent safeguards.  

  If impartiality and representiveness are distinct (as they are), the argument fractures: assemblies might achieve representativeness *without* impartiality, risking factional capture or incoherent outcomes. The "small step" then becomes a leap of faith.  

  #### Verdict (~250 words)  
  **No, the small-familiar-step conclusion does not survive.** The analogy overextends by ignoring:  
  - The chasm between applying fixed law and creating policy under uncertainty.  
  - The loss of controlled procedures (evidence rules, judicial guidance) in assemblies.  
  - The false equivalence of impartiality (a juror’s trait) and representativeness (a group’s trait).  

  Juries work because they are *narrowly constrained*; assemblies are presented as juries *unshackled*, which demands justification beyond analogy.  

  **Better analogies?**  
  - **Clinical Trials:** Random selection for diverse participation, but outcomes are evidence-based and advisory—closer to assemblies’ evidentiary ethos. Still overstates scientific objectivity in policy.  
  - **Polling Deliberative Bodies:** Like pre-legislative committees (e.g., Ireland’s Convention on the Constitution), emphasizing their *consultative* role, not judicial authority.  
  Ultimately, assemblies must be defended on their own terms: as tools for informed public deliberation, not "scaled-up juries." The jury analogy is a rhetorical crutch that obscures more than it clarifies.  

  ---  
  **Final Score: Analogy Failed.** It mistakes superficial similarities for structural equivalence, underestimating the novelty of lottocracy.
