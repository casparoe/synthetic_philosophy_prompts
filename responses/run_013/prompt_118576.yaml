prompt: |-
  Okay, here's a thing that's been nagging at me since I retired. I did 35 years as a field biologist and now I lead birding and wildlife trips overseas — small groups, six to ten people, two or three trips a year. And because I'm nominally in charge, everyone asks me the local drill. Do we tip the driver? Is that a line we're supposed to be in, or do we just crowd the counter like everybody else? Is it okay to cross mid-block here? Shoes off or no? And I've noticed I give different answers trip to trip, and I honestly dont know if I'm being consistent or just going along with whatever the loudest client thinks.

  I'd like an actual method instead of vibes, because it isn't just me — my clients copy whatever I do, and sometimes a local guide's livelihood rides on it. So what I want is a decision procedure I can run in my head in about a minute, on the spot, for this question: when is a local everyday convention — tipping, queueing, jaywalking, shoes, haggling, whatever — something I'm obligated to follow as a visitor, versus something I can politely not bother with, versus something I should refuse even though everyone around me is doing it? I usually can't look anything up (no signal, don't speak the language), so it has to run on what I can see and guess.

  Build it out of whatever the philosophy of convention and moral obligation actually has that's usable — the questions in order, what counts as a good enough answer to each, where the procedure flat-out says follow it or don't, and where it stops and hands the call back to me because it's a values question and not a fact question. I don't need a reading list or citations, just the machinery. There are two distinctions I suspect matter but can't keep seperate, so tell me if they really do: the difference between a convention that's basically an arbitrary coordination point (which side of the sidewalk we walk on) and one that's carrying real moral weight underneath (tipping standing in for a wage), and whether my being a guest — here for a week and then gone — changes what I owe versus what a resident owes.

  Then run it on three cases so I can watch it work. (1) Tipping: a country where guides expect it and it's part of how they eat, and another where offering it is taken as an insult. (2) Jaywalking: the crosswalk is 200 feet away, it's technically illegal, and every local is crossing right here. (3) A local custom I find distasteful — say a seating arrangement, or a "facilitation payment" that's just how business gets done there and everybody treats as normal. I want at least one of the three to come out a way I won't like, and I want you to tell me straight where this procedure is going to misfire or just can't decide.
reasoning: |-
  Okay, let me start by understanding the user's problem. He's a retired field biologist who now leads small wildlife tours overseas. His clients look to him for guidance on local customs like tipping, queueing, jaywalking, etc. He's noticed his answers vary between trips and worries about inconsistency. He wants a reliable decision-making framework that he can use quickly in the field without internet access. The framework needs to differentiate between obligatory conventions, optional ones, and those he should refuse. He also mentioned two key distinctions: arbitrary coordination vs. morally weighted conventions, and obligations as a visitor vs. resident.

  First, I need to build a structured procedure. The user emphasized practicality, so it should be step-by-step, using observable cues. I should incorporate ethical philosophy concepts like moral weight, harm, and consent without making it academic. The two distinctions he mentioned are crucial. Separating coordination norms from morally significant ones will help determine obligation. Also, the transient nature of a visitor affects their responsibility—less obligation to arbitrary norms but more caution to avoid harm.

  For the framework, I'll design a flowchart-like decision tree. Starting with harm: if a convention causes harm or injustice, refusal might be necessary. Then, consent: if locals accept it, even if flawed, participation might be okay. Next, arbitrariness: if it's just a coordination tool, following shows respect. Role as a guest: amplify respect and minimize disruption. Finally, personal values: when the procedure can't decide, fall back on core principles.

  Now, testing with the three cases. Tipping: where it's expected vs. insulting. For expected tipping, the procedure should obligate it due to reliance and harm from withholding. Where insulting, refusing to tip is necessary to avoid offense. Jaywalking: illegal but locals do it. Here, following locals is acceptable since it's arbitrary and low harm, but safety first. Distasteful custom like facilitation payments: this involves corruption, so refusing is likely due to harm and lack of true consent.

  The user wants one outcome he won't like. In the bribery case, refusing might complicate the tour, but the procedure prioritizes avoiding harm. He needs to know where the method fails. Situations with ambiguous harm or consent are tricky. Also, when local practices vary, or signal absence limits observation, the procedure might not give clear answers. Then, personal judgment is essential.

  Underlying needs: The user leads groups, so his actions affect clients and local guides' livelihoods. He needs consistency to build trust and avoid ethical missteps. Deep down, he might seek confidence in his decisions and reduce guilt over past inconsistencies. The framework should empower him with clarity, acknowledging that some calls are tough but structured.

  I'll ensure the steps are sequential with clear yes/no paths. Emphasize observable indicators like local behavior, explicit refusals, or visible consequences. Highlight when to defer to personal values, especially in gray areas. The examples should demonstrate the logic flow, showing how each question leads to a decision. Finally, clarify the limitations so he knows when to trust his judgment.
answer: |-
  Here's a field-expedient decision procedure based on conventions, moral obligation, and your role as a guest. It runs on four core questions, answered in sequence. Stop at the first "Yes" and follow its path. Requires observing locals, their reactions, and thinking about harm/consent.

  **Core Questions & Logic:**

  1.  **Does this practice cause direct, significant harm or injustice?**
      *   **What to look for/think:** Is someone being exploited, coerced, discriminated against, endangered, or denied basic dignity? Does it sustain an obviously unjust system? (e.g., forced labor, dangerous child labor, overt discrimination, exploitative bribes targeting the vulnerable).
      *   **Good enough answer:** A clear "Yes" based on observable harm or widely known context (e.g., apartheid-era rules). If unsure, proceed.
      *   **Decision:** **Refuse.** Your obligation to prevent harm overrides convention or politeness.
      *   **Guest Status:** Doesn't change this. Harm is harm.

  2.  **Do locals actively rely on or expect this convention for fair treatment/compensation?**
      *   **What to look for/think:** Is this convention essential for someone's livelihood or fair access? Does withholding it cause them direct detriment? (e.g., tipping where wages are low, specific queueing systems ensuring fairness). *Distinction:* This is where the "arbitrary coordination" (side of sidewalk) vs. "moral weight" (tipping as wage) split becomes crucial.
      *   **Good enough answer:** "Yes" if you see locals consistently participating and beneficiaries expecting/depending on it (e.g., guides waiting after service, vendors quoting higher "tourist prices" expecting haggling). Explicit local guidance is gold.
      *   **Decision:** **Obligated to Follow.** You are participating in a system others rely on. Withholding disrupts fairness.
      *   **Guest Status:** *Amplifies* obligation. Your brief presence doesn't exempt you from supporting fair systems locals depend on daily. Your impact is immediate on individuals.

  3.  **Is this primarily a harmless local coordination norm or sign of respect?**
      *   **What to look for/think:** Is the main purpose smooth functioning, order, or showing basic courtesy without deep moral weight? (e.g., shoe removal, queueing style, jaywalking norms, greeting rituals). Does ignoring it cause minor annoyance, confusion, or mark you as rude, but not real harm?
      *   **Good enough answer:** "Yes" if locals consistently do it and deviations get mild negative reactions (dirty looks, sighs, minor corrections) but no outrage or harm. It "just works" here.
      *   **Decision:** **Politely Follow.** Shows respect, avoids friction, helps you blend. Not obligatory in a deep moral sense, but strongly advised for harmony.
      *   **Guest Status:** *Amplifies* the reason to follow. Your ignorance is expected, but effort is appreciated. Minimizing disruption is key guest etiquette.

  4.  **Is this optional, contested, or unclear even after observation?**
      *   **What to look for/think:** Do locals themselves vary in practice? Is there no clear consensus or expectation? Do you see no negative consequences for deviation? Does it feel like a personal preference?
      *   **Good enough answer:** "Yes" if observation shows inconsistency or ambiguity. Or if after considering questions 1-3, it falls squarely into "no significant harm/dependence, not a core coordination norm."
      *   **Decision:** **Not Obligated / Personal Choice.** You can politely not bother, or follow your own preference/comfort. Default to local behavior if practical, but no strong obligation.
      *   **Guest Status:** Grants more leeway. You have less stake in purely local, non-consequential preferences.

  **Where It Hands Back to You (Values):**
  *   When Question 1 is ambiguous ("Is this *really* harmful?").
  *   When weighing the *degree* of reliance in Question 2 ("Is this expectation *fair* or exploitative itself?").
  *   When local practice itself seems morally questionable but not clearly harmful (Question 1) or universally relied upon (Question 2).
  *   **This is the "distasteful" zone.** The procedure flags the key factors (harm, reliance, coordination), but *your* values decide the final action when these are ambiguous.

  **The Two Distinctions:**
  1.  **Arbitrary Coordination vs. Moral Weight:** This is CRITICAL. The procedure explicitly separates them:
      *   Moral Weight (Harm/Reliance): Handled by Q1 & Q2. Creates obligation or refusal.
      *   Arbitrary Coordination/Respect: Handled by Q3. Creates strong *prudential* reason (be polite, functional) but not deep obligation. Ignoring Q3 makes you rude; ignoring Q1/Q2 can make you complicit in harm or unfairness.
  2.  **Guest vs. Resident:** Matters primarily in **Q3/Q4**.
      *   Guests have *less* obligation to purely local coordination norms (Q3) than residents who shape the norm long-term. However, guests have a *stronger* prudential reason to follow Q3 norms to avoid friction.
      *   Guests have the *same* obligation as residents regarding Harm (Q1) and Reliance (Q2). You don't get to exploit systems or withhold fair compensation just because you're leaving.

  ---

  **Case Applications:**

  1.  **Tipping:**
      *   **Country A (Expected):** Q1: Harm? No (assuming fair system). Q2: Reliance? **YES.** Guides rely on it for livelihood. Locals tip guides. *Decision:* **Obligated.** Withhold = direct financial harm. Guest status amplifies obligation – your group is their income source.
      *   **Country B (Insult):** Q1: Harm? **YES.** Offering causes offense (social/emotional harm). Q2: Reliance? N/A (stop at Q1). *Decision:* **Refuse.** Do not offer a tip. Guest status irrelevant – causing offense is harm.
      *   *Procedure Insight:* Crucial distinction between Q1 (harm) and Q2 (reliance) driven by local context. "Tipping" isn't one thing.

  2.  **Jaywalking:**
      *   **Context:** Illegal, crosswalk 200ft away, locals crossing mid-block.
      *   Q1: Harm? *Unlikely* if locals do it safely, traffic adapts. (If unsafe, obvious harm = Refuse). Proceed.
      *   Q2: Reliance? No. No one relies on you jaywalking. Proceed.
      *   Q3: Coordination/Respect? **YES.** This is a local coordination norm for efficient movement. Ignoring it (walking 200ft while others cross) marks you as overly rigid/out-of-place. Mild negative reaction possible (impatience). *Decision:* **Politely Follow** (safely!), assuming safe local practice. Guest status *amplifies* reason to follow – don't disrupt flow.
      *   *Procedure Insight:* Falls squarely under Q3 (harmless coordination). Safety is the overriding filter *before* applying Q3.

  3.  **Distasteful Custom - "Facilitation Payment":**
      *   **Context:** Small bribe ("grease payment") expected by an official to process a routine permit for the group. Locals do it, treat it as normal business. You find it corrupt.
      *   Q1: Harm? **YES.**
          *   *Observable Harm:* Undermines rule of law, disadvantages those who can't pay, entrenches corruption. Even if "normalized," the systemic harm is real.
          *   *Good enough answer?* Systemic corruption is widely recognized as harmful. Yes.
      *   *Decision:* **Refuse.** (This is the outcome you might not like, as it could cause delays/hassle).
      *   *Why not Q2 (Reliance)?* You stopped at Q1. While officials may "rely" on it, this reliance is *based on an inherently harmful and unjust system*. Q1 trumps Q2 when the reliance itself is corrupt. Your refusal doesn't directly harm a vulnerable individual's livelihood in the same way withholding a legitimate tip would; it potentially disrupts an illegitimate system. (*This is a values-grey-area the procedure flags: you judged the harm/systemic injustice as clear and overriding*).
      *   Guest Status: Doesn't change core harm. Might make refusal *harder* (less stake), but doesn't create obligation to participate in corruption.

  **Where the Procedure Misfires or Can't Decide:**

  1.  **Ambiguous Harm/Reliance:** Is haggling in a tourist market "reliance" (Q2 - expected part of income) or "exploitation" (Q1)? Depends on power dynamics, local fairness. *Procedure hands back: Your values decide.*
  2.  **Conflicting Local Signals:** What if half the locals tip and half refuse? Or some cross mid-block safely while others use the crosswalk? *Procedure struggles.* Q4 (Optional/Unclear) might apply, or you must make a best guess on Q2/Q3 dominance based on majority/safety.
  3.  **"Mild" Harm / Systemic Issues:** The facilitation payment case shows the edge. If you judged the harm as less clear ("it's just how things work, no one gets hurt"), you *might* land on Q2 (Reliance - official expects it) and feel obligated, conflicting with your values. *Procedure relies on your assessment of harm in Q1.*
  4.  **Safety Overrides Everything:** The procedure assumes safety is assessed first. Jaywalking only follows if *safe*. An "expected" but dangerous practice (e.g., overloaded boat) must be refused (Q1: Harm) regardless of reliance/convention.
  5.  **Lack of Observable Data:** If you truly can't observe locals or get any signal (e.g., completely novel situation), the procedure stalls. Default to extreme caution: Avoid potential harm (Q1 - don't do it if risky), prioritize respect (Q3 - mimic if possible, ask if feasible), acknowledge uncertainty (Q4).

  **In essence:** Look for **Harm/Injustice** (Refuse). If not, look for **Reliance/Expectation** (Obligated). If not, look for **Coordination/Respect** (Follow). If still unclear, **Personal Choice**. Your role as a guest heightens the need for respect and minimizing disruption, *except* when harm or reliance is involved, where your obligation is equal to a resident's. This gives you a consistent method to replace vibes, grounded in observable cues and core ethical priorities.
