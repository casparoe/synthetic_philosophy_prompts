answer: |-
  ### Joint Statement: Moral Status of Everyday Conventions  
  **Adversarial Collaboration between Practice-Based (PB) and Principle-Tracking (PT) Perspectives**  

  #### Preliminary Axes Analysis  
  | Case          | Conformed to & Approved by Locals? | Officially "On the Books"? |  
  |---------------|-----------------------------------|----------------------------|  
  | Tipping       | Yes (near-universal)              | No (unofficial)            |  
  | Jaywalking    | No (widely ignored)               | Yes (legal prohibition)    |  
  | Queueing      | Yes (broadly upheld)              | Yes (often posted/socially enforced)|  
  | Unwritten Queueing* | No (ignored in context)      | No                         |  
  *Added fourth case: e.g., an informal setting where no queue forms despite crowding.  

  ---

  #### Five Agreed Claims  
  1. Conventions like tipping, queueing, and jaywalking norms are distinct from core moral obligations (e.g., prohibitions on violence or deceit), as they arise from contingent social coordination rather than intrinsic wrongs.  
  2. The existence of a convention depends on collective acceptance and coordination for shared goals (e.g., orderly service, efficient movement), but this does not automatically entail a moral duty to comply.  
  3. In tipping cultures, refusing to tip where service is adequate is widely perceived as unfair freeloading, yet the *moral* wrong hinges on exploiting the system, not the breach of convention alone.  
  4. Jaywalking prohibitions, where routinely ignored by locals, create legal obligations but lack moral force unless crossing poses genuine risk (e.g., near schools or heavy traffic).  
  5. Queueing generates the strongest *prima facie* obligation among these cases, as its violation directly undermines fairness by granting unearned advantage and causing frustration.  

  ---

  #### Table of Persistent Disagreements  
  | Crux (Neutral Wording)                                                                 | PB Position (Practice-Based)                                                                                             | PT Position (Principle-Tracking)                                                                                                 | Relevant Case/Argument                                                                 | PB Prediction                                                                                                | PT Prediction                                                                                                |  
  |----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|  
  | **What grounds the moral obligation (when it exists)?**                                | Moral force arises solely from being subject to a community's standards; one is answerable to its norms by participating. | Moral force requires the convention to track independent principles (e.g., fairness, harm prevention); mere practice is inert.   | Tipping in a culture where it is ubiquitous but unenforced (e.g., UK pubs).            | A local who doesn't tip is morally blameworthy *because* they defy communal expectations, regardless of outcome. | No moral failing if tipping doesn’t prevent harm/freeloading (e.g., bartender is salaried).                   |  
  | **Does a visitor incur moral obligations by entering a community with differing norms?** | Yes. By joining a practice (e.g., dining out), visitors are answerable to local standards; ignorance may excuse, but not nullify, the duty. | Only if the norm serves an underlying principle (e.g., fairness). If not, the visitor has no duty to comply merely to conform. | Visitor from a no-tipping country (e.g., Japan) in the US.                             | The visitor owes a tip; refusal is morally wrong as they benefit from the practice while rejecting its terms. | The visitor owes a tip *only* if avoiding freeloading; else, it is optional courtesy, not obligation.        |  
  | **Can community standards be morally criticised from "outside"?**                     | No. The community's standards are the only valid frame; external "yardsticks" (e.g., abstract fairness) are inapplicable. | Yes. Practices are morally defective if they fail independent tests (e.g., causing arbitrary harm or inequity).                  | Queueing when locals ignore it (e.g., "unwritten queueing" in a chaotic shop).        | Joining the scramble is permissible; imposing order via queueing disrespects local norms.                    | Creating a queue is morally better; it reduces conflict and fairly allocates access, regardless of local chaos. |  

  #### Outcome on the Visitor Question  
  This is a **substantive disagreement**, not merely verbal. The crux is whether the convention *itself* creates obligation (PB) or if obligation requires alignment with external principles (PT).  
  - **PB** argues the visitor’s obligation stems from *participation in the practice* (e.g., using a service underpinned by tipping).  
  - **PT** argues obligation stems from *avoiding freeloading/unfairness*, which may not apply identically across contexts (e.g., if staff are well-paid, tipping may be generosity, not duty).  
  The **key divergence** is PB’s view that community standards are morally authoritative *per se*, while PT insists they must "earn" authority through external justification.
