prompt: |-
  I trade for a living, mostly systematically, and I have a working command of the vocabulary of decision under uncertainty: expected value and variance, position sizing, risk of ruin, ensemble versus time averages, regime switching, non-stationarity, optionality. A colleague keeps invoking Machiavelli's pairing of fortune and virtù, and whenever I translate it into my own terms it comes out either trivial or obviously false, which makes me suspect I am losing something in the translation. Restate Machiavelli's account of fortune and virtù as faithfully as you can in that vocabulary, separating the several things fortune is doing there — sheer variance, a change of regime or of the times, a source of opportunity that has to be seized, a force that can be partly dammed and channeled — from the several things virtù is doing — skill, a fixed disposition, adaptive flexibility, a political or moral excellence rather than a merely effective one — and from the advice to be bold rather than cautious. Then give me the residue report: which elements translate cleanly, which translate only under distortion, and which have no counterpart in my vocabulary at all. End by saying whether the residue shows that Machiavelli is asserting something my framework cannot express, or that the apparent depth is just the obscurity of an older idiom. Keep the whole answer under 800 words.
