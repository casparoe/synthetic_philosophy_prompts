  First, I need to clarify Dennett's position. The user mentions the four properties of qualia: ineffable, intrinsic, private, and directly apprehensible. Dennett argues that these lead to contradictions, hence qualia don't exist. The Chase and Sanborn example is key here—two tasters disagreeing on why coffee tastes different. Dennett uses this to show that without objective evidence, qualia claims are empty. The user's lab experience contradicts this; they'd investigate physiological changes to explain taste differences. 

  The user is sympathetic to debunking but finds "there's nothing it is like" extreme. He also thinks the toothache refutation is too simplistic. His questions are: where the writer got Dennett right, where they might be misrepresenting him, and if the toothache point is valid. Also, he wants to know if empirical evidence (like receptor scans) rescues qualia or if Dennett's point still stands.

  I should note that the writer oversimplifies by calling Dennett a behaviorist. Dennett is more of a functionalist, focusing on cognitive processes over behavior. The toothache objection misses Dennett's point—he doesn't deny experience but questions the qualia as defined. The user's lab approach provides third-person data, but Dennett would argue that even with scans, the subjective 'what it's like' isn't captured, only correlates. 

