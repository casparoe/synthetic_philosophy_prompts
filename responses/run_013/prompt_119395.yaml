answer: |-
  ## The Anti-Invariantist Concordat & Disagreement Matrix

  **Purpose:** To clearly delineate common ground, core commitments, and testable disagreements between Pragmatic Encroachment (PE) and Epistemic Contextualism (EC), facilitating focused debate and preventing talking past each other. *Both signatories reject Invariantism.*

  **Signatories:**
  1.  **Pragmatic Encroachment Advocate (PEA)**
  2.  **Epistemic Contextualist Advocate (ECA)**

  **Date:** [Date]

  ### Section 1: Agreements - Common Ground & Core Anti-Invariantist Data

  *(Both PEA & ECA affirm the following statements as foundational and agreed upon):*

  1.  **Rejection of Invariantism:** Invariantism (in its pure forms: classical, subject-sensitive, interest-relative) is incorrect. Knowledge attributions are *not* insensitive to non-traditional epistemic factors.
  2.  **Contextual Variation:** The *truth-value* of knowledge attributions (sentences of the form "S knows that p") systematically varies across different situations involving the same subject, same belief, and same evidence.
  3.  **Stakes Sensitivity (Data):** In many cases, as the practical stakes for the subject (S) of being wrong about p increase, speakers become significantly less inclined to attribute knowledge that p to S, holding S's evidence fixed. This pattern is robust and requires explanation by any adequate theory of knowledge attribution.
  4.  **Contextual Salience Sensitivity (Data):** In many cases, as skeptical possibilities (e.g., brain-in-a-vat scenarios, deceptive demons) are made salient within a *conversational context*, speakers become significantly less inclined to attribute knowledge that p to subjects (even those unaware of the conversation), holding S's evidence and practical stakes fixed. This pattern is robust and requires explanation.
  5.  **"Knowledge" is Shifty:** The intuitive correctness of knowledge attributions depends on factors beyond the subject's purely internal mental state and the objective likelihood of p given that state (i.e., beyond "justification" and "truth" narrowly conceived).
  6.  **Explanatory Target:** Both views aim to explain the patterns described in (3) and (4), which invariantism struggles with. Our views are rivals primarily *to each other* in explaining *how* this shiftiness works.
  7.  **Evidence Against Our Own Views:** Evidence that would strongly count against our respective views includes:
      *   For PE: Systematic, robust data showing that *subject's stakes* have *no detectable effect* on knowledge attributions *even when conversational context is held fixed and minimal*, or evidence that stakes effects *always* require a conversational mechanism.
      *   For EC: Systematic, robust data showing that *conversational salience of error possibilities* has *no detectable effect* on knowledge attributions *even when subject's stakes, evidence, and awareness are held fixed*, or evidence that context shifts *never* alter the semantic content of "knows".
      *   For Both: A successful, simple invariantist explanation of the data in (3) and (4).

  ### Section 2: View Clarifications - What Each View Is and Isn't Saying

  *(Statements each advocate would put their name to describing their own view)*

  8.  **Pragmatic Encroachment (PEA):** "Our core claim is that whether a subject **S is in a state of knowing p** depends constitutively not only on S's evidence, the truth of p, and anti-luck conditions, but also on the **practical stakes S faces** regarding p. Higher stakes demand stronger epistemic positioning (more evidence, higher reliability, etc.) for S to count as knowing p. The *semantic content* of 'knows' might be invariant, but the *epistemic standards* S must meet to satisfy that content shift with S's practical situation. Our view is primarily a rival to *epistemological invariantism* and to EC's semantic claim. It is *not* primarily a claim about how the *word* 'knows' shifts meaning in conversation."
  9.  **Epistemic Contextualism (ECA):** "Our core claim is that the word 'knows' is **context-sensitive**. Its semantic content (the relation it expresses, the standards it sets) shifts depending on the **conversational context** of the attributor. When skeptical possibilities are salient or standards are high, 'knows' expresses a demanding relation; in ordinary contexts, it expresses a less demanding relation. This explains why the *same sentence* 'S knows p' can be true when uttered in a low-standards context and false when uttered in a high-standards context, even if S, p, and S's evidence are identical. Our view is primarily a rival to *semantic invariantism* about 'knows' and to PE's claim that stakes directly affect the epistemic state itself. It is *not* primarily a claim that the subject's *own* awareness of stakes or context changes their epistemic state."

  ### Section 3: Disagreements - Stated in Each Side's Own Terms

  *(Each disagreement is phrased as the respective advocate would express their core opposition to the other view)*

  10. **Disagreement 1: The Locus of Shiftiness**
      *   **PEA:** "We disagree with EC because we hold that the shiftiness in knowledge attributions is fundamentally driven by changes in the **epistemic state required for knowledge**, which is sensitive to the subject's practical situation. EC mistakenly locates the shiftiness entirely in the *semantics of the attributor's context*."
      *   **ECA:** "We disagree with PE because we hold that the shiftiness in knowledge attributions is fundamentally driven by changes in the **semantic content of the word 'knows'** across different conversational contexts. PE mistakenly locates the shiftiness in the *subject's epistemic state itself*, independent of attribution."

  11. **Disagreement 2: The Role of the Attributor's Context**
      *   **PEA:** "We disagree with EC's claim that the attributor's conversational context *semantically determines* the standards for knowledge attribution *regardless of the subject's practical situation*. The attributor's context might influence *which* stakes are relevant or how they are perceived, but it doesn't *constitute* the standard shift; the subject's stakes do."
      *   **ECA:** "We disagree with PE's claim that the attributor's conversational context is merely a window onto the subject's stakes or a source of error. The attributor's context *semantically sets* the standard that the word 'knows' expresses in their utterance. The subject's stakes might causally influence the attributor's context, but they don't bypass it to directly affect the truth conditions."

  12. **Disagreement 3: The Subject's Stakes in Isolation**
      *   **PEA:** "We disagree with EC that the subject's high practical stakes, *in the complete absence of any attributor or raised conversational standards*, are insufficient to make a knowledge attribution false. High stakes alone can negate knowledge."
      *   **ECA:** "We disagree with PE that the subject's high practical stakes, *in the complete absence of any attributor or raised conversational standards*, are sufficient to make a knowledge attribution false. Without a context setting high standards, 'knows' expresses low standards, and the attribution can be true."

  ### Section 4: Cruxes & Test Cases - Predictions & Bearing

  *(For each Crucial Disagreement (Crux), a case or argument both agree is relevant. Each side's prediction is stated BEFORE empirical testing/detailed argument.)*

  **Crux 1: Does the Subject's Stakes Alone, Without Attributor Context, Negate Knowledge? (Tests Disagreement 3)**

  *   **Test Case 1: The Lone Hiker**
      *   **Situation:** A solitary hiker (H) is at a river crossing with an ambiguous map. If she attempts to cross and is wrong about the ford being safe, she will drown (very high stakes for H). She reviews the map, recalls previous (somewhat unreliable) reports, and judges it's safe. She is completely alone; there is no conversation. Does H *know* the ford is safe?
      *   **Relevance:** Both agree this tests whether high subject stakes *alone*, absent any attributor or conversation, can negate knowledge. It isolates the subject's stakes.
      *   **PEA Prediction:** "H does **NOT** know the ford is safe. The high stakes demand a level of certainty/reliability that her ambiguous evidence cannot provide, regardless of the lack of conversation."
      *   **ECA Prediction:** "H **DOES** know the ford is safe (or can). The absence of any attributor or raised conversational context means the standards for 'knows' are the default, low, practical standards. Her evidence, sufficient for low-stakes decisions, meets these standards. The *risk* is high, but that doesn't mean she lacks *knowledge* under these semantic standards."

  **Crux 2: Does the Attributor's Context Alone, Without Raised Subject Stakes, Negate Knowledge Attribution? (Tests Disagreement 2)**

  *   **Test Case 2: The Trivia Question**
      *   **Situation A (Low Standards Context):** Friends are casually chatting over drinks. Alex asks, "Does that new bakery open on Sundays?" Beth, who walked past it last Sunday and saw it open, with people inside, and a sign saying "Open Sundays", says, "Yes, I know it does." Stakes are trivial (curiosity, maybe a minor inconvenience if wrong).
      *   **Situation B (High Standards Context):** In an epistemology seminar, the professor is discussing skepticism. The professor says, "But how can we *really* know anything about the external world? For example, consider whether that new bakery opens on Sundays. Couldn't the sign have been wrong? Couldn't your memory be deceived? Couldn't it have been a grand opening special?" The professor then asks Beth (same person, same evidence as in A), "Beth, given all this, do you *know* it opens on Sundays?" The practical stakes *for Beth* remain trivial.
      *   **Relevance:** Both agree this tests whether raising the attributor's conversational standards *alone*, while holding the *subject's* evidence and practical stakes fixed at low levels, can make a knowledge attribution false.
      *   **ECA Prediction:** "In Situation A, the utterance 'Beth knows it opens on Sundays' is **TRUE**. The low conversational standards are in play. In Situation B, the utterance 'Beth knows it opens on Sundays' (or Beth's answer "I know") is **FALSE**. The high standards set by the seminar context require ruling out skeptical scenarios, which Beth cannot do."
      *   **PEA Prediction:** "In Situation A, Beth **KNOWS** it opens on Sundays (the attribution is true). Her evidence is sufficient for the low stakes. In Situation B, Beth **STILL KNOWS** it opens on Sundays. The professor's skeptical conversation does *not* change Beth's epistemic state or the facts about whether her evidence meets the *actual* (low) epistemic standard required by her (low) practical stakes. The professor might *withhold* the attribution due to the context, but that doesn't make a *true* attribution *false*; it might reflect the professor's caution or changed conversational goals, not a shift in the truth conditions about Beth's knowledge."

  ### Section 5: Potential Talking Past - Clarifying the Questions

  *   **Identified Area:** Part of the disagreement stems from each view answering a subtly different primary question.
      *   **PE** is fundamentally answering: *"What does it take for a* ***subject*** *to be in the state of knowing p, given their situation?"* It focuses on the metaphysics of the subject's epistemic state.
      *   **EC** is fundamentally answering: *"What determines the truth conditions of sentences containing the word 'knows' as uttered in a specific context?"* It focuses on the semantics of knowledge attributions.
  *   **Implication:** They agree that knowledge attributions are shifty and that both stakes and conversational factors *influence* when we attribute knowledge. The live disagreement centers on *how* these factors work: Does the subject's stakes directly modulate the epistemic relation itself (PE), or do they only indirectly influence the truth conditions via their potential effect on the attributor's context (EC)? Conversely, does the attributor's context directly set the semantic standard (EC), or does it only indirectly reflect the subject's stakes or the attributor's psychology (PE)? The test cases above are designed to pry these mechanisms apart.

  **Conclusion:** This document establishes our shared rejection of invariantism and our commitment to explaining the sensitivity of knowledge attributions to stakes and context. It clarifies the distinct core theses of PE and EC, isolates key disagreements in each side's own terms, and provides agreed-upon test cases with clear, pre-commitment predictions. We agree to use this framework to structure future discussions, focusing empirical and theoretical arguments on these specific cruxes. By signing, we acknowledge that resolving these disagreements requires evidence and argument focused on the mechanisms highlighted in the test cases, not merely restating our core theses.

  **Signatures:**

  _________________________ (Pragmatic Encroachment Advocate)
  _________________________ (Epistemic Contextualist Advocate)
