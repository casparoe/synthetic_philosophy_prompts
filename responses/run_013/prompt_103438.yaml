  Looking deeper, the user might be seeking to establish their workshop's unique contribution, moving beyond existing debates. They might want interdisciplinary collaboration that yields tangible progress. Unspoken needs could include practical implications for real-world accountability, even if conceptual payoffs are primary. They might also want to avoid dead-end debates and ensure the framework's robustness.

  Now, identifying high-priority questions. The interaction between epistemic entitlement and exposure seems under-explored. How does vulnerability to counter-blame affect the credibility of the blame? That's upstream because it ties into why we value standing. It's tractable—philosophers, legal theorists, and psychologists can each contribute different methods. Neglected because most work focuses on permission versus entitlement. A result showing that exposure enhances credibility could elevate this topic.

  Second, permission without entitlement. Cases where someone is allowed to blame but lacks credibility, like a hypocrite whose blame is ignored. This challenges the idea that permission is sufficient for standing. It's interdisciplinary: psychologists can test how people perceive such blamers, legal theorists can look at institutional contexts. If empirical studies show people disregard permitted blame without entitlement, that'd boost its importance.

  Third, the commodification of standing: can institutions transfer entitlement? Like ethics boards outsourcing blame. This is novel, with practical implications. Legal theorists can analyze delegation, philosophers can assess normative permissibility, psychologists can study trust in third-party blamers. If evidence shows transferred blame is less effective, it could question institutional designs.

  For overrated questions, debates on whether standing is about appropriateness or rights might be terminological. Also, the hypocrite's standing is well-covered; further work here might not add much. These are distractions from the more fertile areas identified.

