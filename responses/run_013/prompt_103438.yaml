  First, let's unpack the three strands. Permission is about whether someone is barred from blaming—like hypocrisy or complicity. Epistemic entitlement involves the credibility of the blamer; if they're inconsistent, their blame might not be taken seriously. Exposure means that by blaming, the blamer opens themselves up to counter-blame or demands for consistency. The user wants to avoid well-trodden paths, so I should focus on where these strands diverge or interact in novel ways.

