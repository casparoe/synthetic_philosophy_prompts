answer: |-
  Here’s your Q&A battle plan, tailored to your room and ranked by threat level (likelihood × damage potential). Each objection mirrors your colleagues’ phrasing, with a concise reply, vulnerability analysis, and follow-up trap.  

  ### **Tier 1: Must-Defend Core Arguments**  
  1. **The Constructivist Kantian**  
     *Objection:* "Your ‘authority reading’ presupposes moral weight is a *discovered* property of persons. But if practical reason is constructivist, authority isn’t ‘inherited’—it’s constituted by the conditions of possible rational consent. Doesn’t your distinction collapse into realism about reasons?"  
     *Reply (2 min):* "The authority reading doesn’t require realism; it requires that *non-aggregation* is built into the construction procedure itself—which Kantians assert but utilitarians reject. My point is that Rawls/Nozick treat this constructed constraint as a *refutation* of aggregation rather than an alternative starting point."  
     *Vulnerability:* Assumes constructivism avoids question-begging. Thin if pressed on *why* Kantian construction is privileged.  
     *Follow-up Trap:* "If constructivism can generate authority without realism, why call it ‘Kantian inheritance’?"  

  2. **The Reductionist Parfitian**  
     *Objection:* "If reductionism blurs personal boundaries, doesn’t it undermine the ‘authority reading’? If persons aren’t fundamentally separate, why can’t claims be aggregated *without* consent?"  
     *Reply (2 min):* "Reductionism challenges *distinctness*, not authority. Even if persons are less ‘deep’, their first-personal perspectives generate normative claims. A utilitarian might *use* reductionism to justify aggregation, but the authority reading insists consent is non-negotiable—a normative stance untouched by metaphysics."  
     *Vulnerability:* Leaves "first-personal perspectives" underspecified.  
     *Follow-up Trap:* "Can’t a reductionist utilitarian argue authority *dissolves* with boundaries?"  

  ---

  ### **Tier 2: High Threat (Likely & Damaging)**  
  3. **The Formula of Humanity Kantian**  
     *Objection:* "You call authority a ‘Kantian premise’, but doesn’t treating persons as ends-in-themselves follow analytically from practical reason? If utilitarianism violates this, it’s *internally* inconsistent—not question-begging!"  
     *Reply (2 min):* "My claim is that treating persons as ends *requires* non-aggregation only if you *already* accept the authority reading. Utilitarians reject that reading *because* they see maximising welfare as consistent with equal respect. The objection assumes what it proves."  
     *Vulnerability:* Doesn’t address whether utilitarianism *can* coherently treat persons as ends.  
     *Follow-up Trap:* "Can a utilitarian ever prohibit using someone as a mere means without consent?"  

  4. **The Rawlsian (Strains of Commitment)**  
     *Objection:* "The separateness objection isn’t about ‘authority’—it’s that aggregation ignores the *strains of commitment* in the original position. No one would accept principles requiring extreme sacrifices for others’ gain."  
     *Reply (2 min):* "But the strains of commitment presuppose the authority reading! Why is *my* sacrifice ‘extreme’ unless my claims have normative force that resists trade-offs? A utilitarian in the original position would accept aggregation *because* they see welfare as shareable."  
     *Vulnerability:* Rawlsians may retort that strains are psychological, not normative.  
     *Follow-up Trap:* "Isn’t rejecting unbearable sacrifices a minimal condition of reasonableness?"  

  ---

  ### **Tier 3: Manageable Threats**  
  5. **The Legal Philosopher (Lockean Genealogy)**  
     *Objection:* "The authority reading is Lockean self-ownership—not Kantian! Nozick roots it in rights pre-dating Kant. Your genealogy misfires."  
     *Reply (2 min):* "Locke grounds authority in divine ownership; Kant grounds it in autonomy. Nozick’s *version* is Lockean, but the *structure* of the objection—non-consensual trade-offs as violation—is Kantian in its deontic force. My target is the structure."  
     *Vulnerability:* Concedes Nozick isn’t purely Kantian. Low damage.  

  6. **The Historian (Mill & Sidgwick)**  
     *Objection:* "Mill *explicitly* addresses separateness in *Utilitarianism* Ch. 5, grounding justice in utility. Sidgwick takes the objection seriously. Are you replacing them?"  
     *Reply (2 min):* "I’m reconstructing the *objectors’* misuse of separateness. Mill/Sidgwick grant distinctness but deny authority does independent work. My distinction explains *why* their replies fail to satisfy Kantians—who demand authority as primitive."  
     *Vulnerability:* Risks historical quibbles. Concede early if pressed.  

  7. **The Consequentialists (‘Cannot be Traded Off’)**  
     *Objection:* "If ‘cannot be traded off’ isn’t primitive, what is it? If it’s reducible to welfare loss, authority collapses into distinctness."  
     *Reply (2 min):* "It *is* primitive in the authority reading—and that’s the point! Utilitarians reject this primitivism. They reduce authority to distinctness plus maximization. The slide between readings masks this disagreement."  
     *Vulnerability:* Leaves "primitivism" ungrounded. **Concede early** to allies: "Yes, it’s bedrock—but that’s the dispute!"  

  ---

  ### **Strategic Concessions & Fears**  
  - **Concede Early:**  
    1. The Lockean genealogy point (Nozick blends traditions).  
    2. To consequentialists: "‘Cannot be traded off’ *is* primitive in the authority reading—but that’s why it’s contentious."  
  - **Most Feared Objection:** **The Constructivist Kantian.** If they force you into defending realism or conceding that constructivism *avoids* question-begging, the paper’s core claim implodes.  
  - **Must-Land Reply:** **The Parfitian objection.** If your distinction survives reductionism, you prove authority is *normatively* robust—not metaphysical.  

  ---

  ### **The Nightmare Question**  
  *"Isn’t your ‘authority reading’ just another foundational commitment? Why is *your* premise less question-begging than the utilitarian’s?"*  
  **Reply:** "Absolutely—and that’s my deeper point! The separateness objection only *works* if we treat authority as axiomatic. My paper isn’t defending utilitarianism; it’s showing that anti-utilitarians can’t wield separateness as a *knockdown* argument. They must defend their axiom, not assume it refutes aggregation."  
  **Damage Control:** This reframes your paper as meta-ethical, not pro-utilitarian. Urge them to read the conclusion where you state this explicitly.  

  **Final Tip:** Open your Q&A by conceding the two low-stakes points (Lockean roots + primitivism). This disarms critics early and signals confidence. Redirect the Parfitian and Constructivist to your paper’s §§3-4, where you preempt them. **Your goal isn’t to "win"—it’s to prove your distinction exposes a dialectical stalemate.** If they leave debating *that*, you’ve succeeded.
