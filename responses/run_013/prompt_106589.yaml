prompt: |-
  I can know and love a recording for years, and then learn something about the person who made it; not a note has changed, and yet the thing begins to say something else. Lines I had always heard as affectionate start to read as confessions. A song I took to be about tenderness turns out to have been written for someone the singer treated badly, and what I heard as warmth I now hear as performance. What puzzles me is that this is not simply the loss of my taste for it. Sometimes the work becomes more interesting, as though it had acquired a dimension it did not have, and I still do not want to spend time with it, so the change in what the work says and the change in my willingness to consume it come apart. Nor is it only about condemnation: when I admire someone I find their work warmer and more generous than I suspect it would seem to me if I had never heard of them, and the same shift happens with discoveries that have nothing to do with morality, as when a painting turns out to be a forgery and people say it looks different. So a fact about the maker seems to become a fact about what the made thing means. Is there an established name for this? The advice to separate the art from the artist is advice, and the warnings I have met about reading a work through its author's intentions seem to be about a different mistake, so neither quite covers it. If some existing concept fits, say which one and where it fails; if nothing does, propose a term, define it, and mark its edges — does it apply to a building whose architect did something monstrous, to a work whose maker is unknown, or to a piece made long before the fact came out?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're describing a phenomenon where knowing something about the creator changes their perception of the artwork itself, even though the artwork hasn't physically changed. The user mentions examples like a song that seemed affectionate but, upon learning the artist treated someone badly, now feels like a performance. They also note that this isn't just about losing taste for the work—sometimes it becomes more interesting but they still don't want to engage with it. The user is looking for a term or concept that describes this shift.

  First, I need to recall existing theories. Reception theory comes to mind, particularly Hans Robert Jauss and Wolfgang Iser. Reception theory focuses on how the audience's context shapes meaning. The user's experience aligns with this, especially the idea of the horizon of expectations. When new information about the artist enters, it shifts that horizon, altering interpretation. But is there a specific term for this artist-related shift? Reception theory is broad, so maybe not precise enough.

  Then there's the intentional fallacy from New Criticism, which warns against conflating the artist's intent with the work's meaning. But the user says this isn't about intent—it's about biographical facts affecting perception. So intentional fallacy addresses a different issue.

  Paratexts, a concept by Gérard Genette, refer to elements outside the text that influence reception, like prefaces or author bios. The artist's biography could act as a paratext. This fits because the new info frames the work. But paratext usually refers to elements provided with the work, whereas here, it's external knowledge the audience brings. Still, it's a close match.

  The hermeneutic circle might be relevant too. Gadamer's idea that understanding involves pre-judgments that evolve. Learning about the artist changes the interpreter's pre-judgments, affecting interpretation. This is a broader philosophical concept, though, and not specific to artist biography.

  The user also mentions cases where admiration makes the work seem warmer, or a forgery being perceived differently. This suggests it's not just negative info but any biographical detail. The key is that the artwork's perceived meaning changes without altering the work itself. 

  The user asks if there's an established term. None seem to fit perfectly. Reception theory and paratext are close but not exact. Maybe proposing a new term is necessary. Terms like "biographical refraction" or "authorial resonance" come to mind. "Biographical refraction" captures how the artist's life bends the interpretation. "Authorial resonance" emphasizes how the creator's identity echoes in the work.

  Defining the term requires setting boundaries. Does it apply to unknown artists? If the artist is unknown, there's no biography to affect perception, so no. But if later discovered, yes. For works made before facts came out, it still applies because the change is in the audience's context, not the work. Buildings by monstrous architects? Yes, same effect. The user's examples include non-moral factors (forgery), so the concept isn't limited to ethics.

  The user's deeper need might be understanding how external context influences art perception systematically. They might want a framework to analyze this phenomenon, possibly for academic or personal clarity. They also seem curious about why this happens despite knowing the art itself hasn't changed. The proposed term should encapsulate the interpretive shift caused by biographical data, distinct from intentionality or moral judgments.

  I should check if any existing psychological terms apply. Cognitive dissonance? That's discomfort from conflicting beliefs, which might explain avoidance but not the meaning shift. Confirmation bias? Possibly, but not precise. Attribution theory? How we attribute motives, which relates but isn't art-specific.

  So, combining reception theory with paratext, the new term "authorial paratext" or "biographical framing" might work. But "biographical refraction" emphasizes the bending of meaning. The edges: applies only when the artist is known, the fact is learned later, and it changes perceived meaning. It's about reception, not the work's inherent qualities. This should cover the user's cases and provide a clear concept.
answer: |-
  This phenomenon you describe is perceptively articulated and touches on a complex interplay between art, artist, and audience. While no single established term perfectly captures its entirety, it sits at the intersection of several established concepts in aesthetics, reception theory, and hermeneutics. Here's a breakdown:

  1.  **Reception Theory (Rezeptionstheorie - Jauss, Iser):** This is the most encompassing framework. It argues that the meaning of a work is not fixed within the object itself but is co-created by the audience in a specific historical and cultural context ("horizon of expectations"). Your discovery of biographical information drastically alters *your* horizon of expectations.
      *   **Where it fits:** Directly explains how the *meaning you perceive* changes based on new contextual information (the artist's biography/actions).
      *   **Where it falls short:** It's a broad theory, not a specific term for the *biographical trigger* itself. It doesn't inherently address the *affective response* (still finding it interesting but not wanting to engage) or the specific mechanism of the artist's life becoming embedded in the work's perceived meaning.

  2.  **Paratext (Gérard Genette):** Paratexts are elements that surround and present a text (titles, prefaces, interviews, author bios, dust jackets, etc.), mediating the audience's entry into the text and influencing interpretation. The artist's biography, once known, functions as a powerful **external paratext**.
      *   **Where it fits:** Excellently captures how this information *frames* your encounter with the work, becoming inseparable from its reception. It explains why the *same notes/words* now signify differently – they are read *through* this new frame.
      *   **Where it falls short:** "Paratext" typically refers to elements intentionally provided or attached to the work. Learned biographical facts (especially negative ones) are often accidental or unintended paratexts from the artist's perspective. It also focuses on framing *interpretation*, less directly on the resulting affective shift or the sense of the biography becoming "a fact about what the made thing means."

  3.  **The Intentional Fallacy (Wimsatt & Beardsley):** This warns against *equating* the meaning of a work with the author's stated or supposed intentions. Your observation aligns with the *spirit* of this, showing how meaning resides in the reception. However, you're not making the mistake of *relying* on intention; you're describing how *knowledge of actions or character* (which may or may not relate to intent) alters reception *despite* the work's unchanged form.
      *   **Where it fits:** Reinforces that meaning shifts *without* the work changing, highlighting the audience's role.
      *   **Where it falls short:** It describes a fallacy to avoid, not the phenomenon you experience. Your shift isn't *about* intention; it's about biography *affecting* reception irrespective of intention.

  4.  **Cognitive Dissonance / Affective Response:** Learning negative information about a beloved artist creates dissonance between your positive feelings for the work and your negative feelings about the creator. Avoiding the work can be a way to reduce this discomfort. Conversely, admiration can create positive consonance.
      *   **Where it fits:** Explains the *motivation* for avoidance ("don't want to spend time with it") despite finding it "more interesting." Explains the warmth felt when admiring the artist.
      *   **Where it falls short:** Doesn't capture the *semantic shift* itself – how the work's perceived *meaning* changes. Dissonance might cause avoidance, but it doesn't inherently explain why "warmth" turns to "performance" in perception.

  **Proposed Term and Definition:**

  Given the gaps, a specific term for this phenomenon is valuable. I propose:

  ### Biographical Refraction

  *   **Definition:** Biographical Refraction is the phenomenon whereby knowledge of an artist's life, character, or actions (whether laudable, condemnable, or neutral) alters the perceived meaning, tone, or affective resonance of their work for an audience member, *without* any change to the work itself. This alteration occurs as the biographical information functions as a lens through which the work is subsequently interpreted and experienced, embedding aspects of the creator's perceived identity into the interpretation of the creation.

  *   **Marking the Edges:**
      *   **Works with unknown makers:** Does not apply. If the creator is unknown, there is no biography to refract through. Discovering the identity *is* the biographical information that *enables* refraction. *Before* knowing, the work stands alone; *after* knowing, refraction can occur.
      *   **Buildings/Architects, Paintings/Forgers:** Absolutely applies. Learning an architect committed atrocities can make their building feel imposing and cold rather than grand and inspiring. Discovering a painting is a forgery instantly changes its perceived value, authenticity, and even aesthetic qualities ("it looks different now, like a copy").
      *   **Works made long before the fact came out:** Applies fundamentally. The phenomenon is entirely about the *audience's reception at a later time* when the biographical fact becomes known. The work was created earlier, but its meaning *for that audience* shifts upon acquiring the new context. The "refraction" happens at the moment of reception informed by the new knowledge.
      *   **Non-Moral Discoveries (e.g., forgery):** Explicitly included. The core is *any* biographical fact (identity, action, circumstance of creation, authenticity) that alters perception. Forgery is a prime example of non-moral biographical refraction affecting meaning/value.
      *   **Separation of Meaning Shift and Willingness to Engage:** This is a key feature. Biographical Refraction *causes* the semantic/affective shift. The change in willingness to engage (avoidance or increased attraction) is a *consequence* or *separate affective response* potentially driven by dissonance, moral judgment, or other factors *triggered by* the refraction, but distinct from the shift in meaning itself. This explains why the work can become "more interesting" (due to the new, complex dimension) yet still unwanted.

  **Why "Refraction"?**

  *   **Lens Metaphor:** Like light bending through a prism, the biographical information bends or alters the "light" (meaning, tone, resonance) emitted by the artwork as it reaches the perceiver.
  *   **Alters Perception:** It changes how the work is *seen* or *heard*.
  *   **Creates a Spectrum:** The new information can split the unified prior perception into multiple, potentially conflicting interpretations or feelings (like white light splitting into colors).
  *   **The Work Remains:** The source (the artwork) is unchanged, but the way it is received is fundamentally altered by passing through the medium of biographical knowledge.

  Biographical Refraction captures the core mechanism: external knowledge about the creator becoming an integral, inescapable part of the interpretive frame, thereby changing the perceived substance of the work itself for the viewer/listener. It highlights the inherently contextual and subjective nature of artistic meaning, especially in an age saturated with information about creators.
