prompt: |-
  Right, I need a second opinion and a number. I teach a final-year seminar on minds, and every year we end up on Hofstadter's Aunt Hillary — the ant colony that, on the story's telling, has a mind because the ants all fugue together — and every year I catch myself hedging in exactly the way I tell my students not to. So I want your credence in a claim sharp enough to be false: that at least one ant colony that actually exists or has existed (mature, a few hundred thousand ants, the usual pheromone-mediated division of labour) is a subject of experience — that there's something it is like to be it, in the way there's something it is like to be you — rather than merely processing information in a way that it's convenient to describe as cognitive. Give me your number, but I'm really after the decomposition, so break it into the sub-questions it rests on and give each its own rough probability with one line of justification: whether mentality can be realised by parts that are themselves, as far as we can tell, non-mental; whether the colony meets some functional or integration-based criterion you're willing to actually name; whether the pheromone business matters — note the colony's memory sits outside every ant and gets wiped by a decent rainstorm, which some of my students think is decisive and I've gone back and forth on alot — and whatever residual term you'd want for is-the-question-even-determinate.

  Then multiply it out for me and tell me which term my number is most sensitive to; I'd like to know which single result, experiment or argument would move the whole thing most, and in which direction. For calibration, I'm at about 0.15 and a colleague I argue with is at about 0.6, and I suspect we don't actually disagree about ants at all — so if you can, say where you think our disagreement actually lives. Please don't hand me the taxonomy of panpsychism vs functionalism vs whatever as an answer in itself; I know the map, I want the territory. And if you think the proposition is ill-posed, fine, say so — but then give me the nearest well-posed thing and a number for that instead.
