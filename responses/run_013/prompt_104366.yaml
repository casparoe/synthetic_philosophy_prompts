answer: |-
  ### Adjudication of Moves

  **(1) Delia: Mistaken, but defensible core**  
  Delia correctly identifies real emotion but mistakenly anchors it to a *proposition* ("I was sad *that* in the story, this happened"). Propositions require truth-aptness, but fictional events aren't truth-evaluable (we know they didn't occur). The emotion's intensity is real, but its object isn't a proposition. Defensible in recognizing emotion's reality, but wrong about the object.  

  **(2) Marek: Right in structure, mistaken in rigidity**  
  Marek rightly notes the *functional mismatch* (no help-seeking/mourning) and distinguishes imagination from belief. This avoids Radford's paradox (no irrational belief contradiction). But calling it "not sadness" overreaches: emotions exist on spectra (e.g., suppressed grief lacks functional expression too). Correct about cognitive attitude (imagination vs. belief), wrong to deny the emotion's authenticity.  

  **(3) Delia: Right**  
  Delia dismantles Marek's functionalism: real emotions (dormant anger, distant love) often lack "full profiles." Her avoidance of the book mirrors real grief behaviors. If quasi-emotions mimic all marks of real ones, the distinction *is* unfalsifiable. Marek’s criterion fails.  

  **(4) Marek: Right**  
  Marek’s core insight holds: cognitive attitude matters. We *imagine* the brother’s death, not believe it, so emotion isn't "sadness *that* it happened" (which requires belief). Imagination has different norms—no paradox if emotion responds to imagined content. Distinguishing fabricated memoir (belief-based) from fiction is crucial. Correct about cognitive structure.  

  **(5) Delia: Right, and the withholding datum is key evidence**  
  Delia’s phenomenology ("grief is *for him*") challenges Marek. The *withholding datum*—readers grieve most for the brother lacking interiority—is critical evidence. If emotion tracked imagined persons, richer characters would elicit stronger responses. Instead, emotion tracks the narrative *shape* (withholding, gaps). Neutral between objects but undermines pure imagination-as-object.  

  **(6) Marek: Mistaken**  
  Marek’s "gap-filling" reply is ad hoc. If emotion is about *our* filling, it should vary by reader, but Delia notes consistent grief for the *withheld* character. His "rehearsal" point is tangential—it explains why we engage fiction, not the emotion’s object. Fails to address the datum.  

  **(7) Delia: Right**  
  Delia highlights two fatal issues for Marek:  
  - Phenomenology: Grief feels directed *at the character*, not our act.  
  - Persistence: Emotion lingers without active imagining.  
  If the object were our own imagining, grief would dissolve post-reading. It doesn’t.  

  **(8) Marek: Mistaken (abandons his position)**  
  Marek’s "aptness" move is a retreat. Calling emotion "about fittingness" shifts the object from imagined events to *meta-narrative properties* (how well grief suits the story). This:  
  - Conflicts with his earlier "imagination-attitude" model (now emotion is about real properties of art).  
  - Ignores phenomenology: We cry *for the brother*, not for narrative aptness.  
  - Quietly adopts Delia’s point: Emotion responds to the *telling’s shape*.  

  ---

  ### Resolution  
  **Q1: Which object bears the weight?**  
  None fully. The character (non-existent), proposition (non-truth-apt), and reader’s imagining (phenomenologically mismatched) all fail. The true object is the **narrative pattern**—the *shape of events and gaps* crafted by the text. Delia’s withholding datum proves this: emotion tracks structural absence, not simulated persons.  

  **Q2: Does "aptness" (8) rescue Marek?**  
  No. It abandons his core claim (emotion tied to imagination-attitude) and borrows from Delia. "Aptness" makes emotion about real aesthetic properties, not fictional content—a different theory entirely.  

  **Q3: Withholding datum: Evidence for whom?**  
  **Strong evidence for Delia** against imagination-as-object. Shows emotion is driven by narrative technique (withholding), not reader simulation. Neutral on propositions but supports *structural* over *simulated* objects.  

  **Q4: Coherent unstated position?**  
  Yes: **Narrative-Intentionalism**. Emotions respond to *authors’ intentional patterns* (e.g., absence, irony) in the narrative design. The object is neither character nor proposition, but the *crafted situation*—real properties of the text that evoke grief. This fits the withholding datum and lingering affect.  

  **Q5: Who is more nearly right?**  
  **Delia wins narrowly (5/8 moves stronger)**, but Marek’s cognitive-attitude distinction (move 4) is foundational.  
  - **Delia** better captures phenomenology, grief’s persistence, and the narrative-shape evidence.  
  - **Marek** correctly notes emotion doesn’t require belief, but overplays functionalism and misidentifies the object.  
  - **Overall**: A hybrid view triumphs. Real emotion arises from *imaginative engagement with narrative structures*, where the "object" is the designed pattern of events/gaps (not a person, proposition, or act of imagining). Fiction’s power lies in how its form triggers affective responses decoupled from belief.  

  **Verdict**: Delia’s emphasis on narrative shape and real emotion prevails, but Marek’s insight about imagination’s role is essential. The "winner" is the synthesis: emotion is real, directed at the *artistic construction* of loss.
