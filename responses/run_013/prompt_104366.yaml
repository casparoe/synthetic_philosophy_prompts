  On the object question: Neither character (ontologically problematic) nor pure proposition (phenomenologically thin) nor imagination (circular) works alone. The "telling's shape" - narrative patterns - emerges as the real trigger.

  The withholding datum strongly supports narrative-based theories. It's neutral between proposition/imagination but undermines character-based views.

  Overall: Delia wins by points (5/8 moves stronger) but Marek's cognitive attitude distinction is foundational. A synthesized view acknowledging narrative patterns triggering real emotions via imagination fits best. Marek is more fundamentally right about mechanism, but Delia captures the lived experience better.

