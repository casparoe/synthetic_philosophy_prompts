  ## Memorandum: Recommendation Regarding the Sidgwick Fund Bequest

  **To:** Academic Priorities Committee  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Action on the Sidgwick Fund Bequest & First-Year Allocation  

  The bequest from our late alumna presents both an opportunity and a challenge, demanding careful consideration of academic integrity, donor intent, and the legacy of Henry Sidgwick. After thorough deliberation, **I recommend accepting the bequest and allocating the first year's disbursement to the historian's proposal to digitize and annotate the early SPR archives, including the cross-correspondence files.** This decision is made with the following conditions and timeline:

  1.  **Acceptance with a Public Statement:** Accept the bequest to establish the Sidgwick Fund, accompanied by a clear public statement from the Faculty. This statement must emphasize that acceptance signifies a commitment to rigorous *investigation* of historical claims and methodologies within established academic norms, *not* an endorsement of any specific paranormal claim. It should explicitly cite Sidgwick's own demand for adherence to "ordinary canons of proof" and the philosophical seriousness he attached to the question.
  2.  **First-Year Allocation:** Award the full first-year disbursement to the historian's archival project. This project directly and demonstrably fulfills the Sidgwick test *as applied to historical-philological research*:
      *   **(1) Corroboration/Scrutiny:** Digitization and annotation make the primary sources (including methods, debates, and critiques documented within the SPR archives) accessible for independent, adversarial scrutiny by scholars worldwide, addressing "sensory leakage" and fraud concerns through historical analysis.
      *   **(2) Philosophical Consequence:** The SPR archives, particularly the cross-correspondence cases, were explicitly designed and debated within the SPR (under Sidgwick's influence) as bearing on the profound philosophical question of survival and its potential implications for ethics – a core Sidgwickian concern linking rational morality and possible post-mortem existence. This is not mere curiosity but the foundational documentary record of a significant historical-philosophical inquiry.
      *   **(3) Adversarial Scrutiny:** Making these archives widely available *is* the prerequisite for enabling the sustained, public, adversarial scholarly scrutiny Sidgwick demanded. The annotation process itself should engage critical perspectives on the SPR's methods and conclusions.
  3.  **Condition on Future Empirical Work:** The psychology professor's telepathy study proposal undergoes further review. Before any future disbursement supports empirical work, the standing faculty review body (see below) must rigorously assess its protocol against the Sidgwick test *and* ensure its design incorporates the highest contemporary standards of experimental rigor, statistical analysis, and fraud prevention, exceeding baseline expectations due to the controversial nature of the field. The archival project's findings may also inform this assessment.
  4.  **Timeline:**
      *   **Committee Vote:** Within 7 days.
      *   **Faculty Statement Draft & Bequest Acceptance:** Completed within 30 days of committee vote.
      *   **First Disbursement to Historian:** Released within 60 days of acceptance.
      *   **Historian's Project Milestone Report:** Due at 12 months, outlining progress and initial accessibility of materials.
      *   **Standing Body Review of Psychology Proposal:** Initiated no later than 9 months from now, for potential funding consideration in Year 2.

  **Assessment of the Sidgwick Test:** The codicil's three-part test is a **reasonably fair, though selective, reconstruction** of Sidgwick's stance. Sidgwick was indeed fanatical about rigorous controls against deception and error (point 1), insisted psychical research must meet the same evidential standards as any other empirical claim (point 3), and viewed the question of survival not as trivia but as deeply consequential for the rational foundations of ethics (point 2). The selectivity lies in Sidgwick's broader interest in various psychical phenomena beyond just survival (though survival was paramount for him) and his profound personal caution bordering on pessimism about ever obtaining conclusive proof. However, the test accurately captures the core methodological and philosophical principles he championed at the SPR's founding. This matters because it underscores that the donor intended the fund to operate within Sidgwick's framework of extreme skepticism and philosophical seriousness, not to promote uncritical belief. Funding a project that directly engages with the *historical record* of Sidgwick's own society, using standard humanities methodologies, aligns perfectly with this intent and minimizes immediate reputational risk while building essential scholarly infrastructure.

  **Strongest Consideration on the Losing Side (Refusal/Legitimization):** The most compelling argument against acceptance is the genuine concern that establishing such a fund, regardless of stated intent, will inevitably be perceived as legitimizing pseudoscience, damaging the faculty's hard-won academic reputation and potentially attracting fringe elements. Critics argue that psychical research, despite historical figures like Sidgwick, has consistently failed to produce robust, replicable evidence under controlled conditions acceptable to mainstream science over a century later. Associating the faculty's name with this domain, even cautiously, risks public and peer ridicule, undermines our credibility in core disciplines, and could divert resources from less controversial, more fruitful research. Refusal, they contend, is not dogmatism but prudent protection of academic standards and reputation, recognizing that Sidgwick's duty to investigate has been largely discharged by the persistent failure of the field to meet his own exacting standards.

  **What the Committee Cannot Decide & Delegation:** This committee lacks the expertise and mandate to:

  1.  **Assess Future Project Adherence:** We cannot perpetually evaluate the technical and methodological details of every future proposal (especially empirical ones) against the Sidgwick test and evolving scientific standards.
  2.  **Manage Ongoing Reputational Risk:** We cannot foresee or single-handedly manage the long-term reputational consequences of hosting this fund.

  Therefore, **we must delegate the ongoing oversight of the Sidgwick Fund to a standing faculty review body.** This body, constituted with relevant expertise (e.g., philosophy of science, history of science, psychology, ethics), should be empowered to:

  *   Develop detailed operational guidelines for the Sidgwick test.
  *   Rigorously review all future funding proposals for adherence to the test and academic rigor.
  *   Monitor ongoing funded projects.
  *   Advise the Faculty on reputational management related to the fund.
  *   Recommend continuation or dissolution of the fund if it fails to meet academic standards or causes irreparable reputational harm.

  **Conclusion:** Accepting the bequest and funding the archival project honors the donor's intent grounded in Sidgwick's principles, leverages legitimate scholarly methods in history, and provides the essential foundation of accessible primary sources for any future rigorous investigation. It allows the faculty to engage this complex legacy with intellectual honesty and appropriate caution, while the delegation of ongoing oversight ensures rigorous future stewardship. I urge the committee to support this recommendation.
