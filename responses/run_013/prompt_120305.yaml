  ## Veritas Communications Group: Ethical Engagement Style Guide (Version 3.1)

  **1. Introduction**
  Veritas Communications Group (“Veritas”) is committed to transparency and integrity in all engagements. This Style Guide provides mandatory directives for staff interacting with external parties (including journalists, regulators, customers, and the public) to ensure communications are accurate, responsible, and protect the interests of Veritas and its clients. Adherence preserves trust and mitigates reputational and legal risk.

  **2. Foundational Principles**
  2.1. **Truthfulness Mandate:** Veritas personnel shall not lie.
  2.2. **Definition of Lying:** For the purposes of this policy, “lying” is strictly defined as *making a statement one knows to be false, with the specific intent to deceive the listener.*
  2.3. **Precision of Definition:** This definition reflects precision: (a) It distinguishes factual inaccuracy from deliberate deception; (b) It focuses on the speaker’s knowledge and intent; (c) It applies only to affirmative statements, not omissions or implications. This clarity ensures rigorous compliance and avoids ambiguity.

  **3. Definitions & Distinctions (Key Terminology)**
  3.1. **Statement:** An affirmative verbal or written assertion of fact.
  3.2. **Falsehood:** An assertion demonstrably contrary to objective reality. Veritas prohibits knowingly making false statements.
  3.3. **Intent to Deceive:** The conscious purpose of causing the listener to believe something the speaker knows is untrue.
  3.4. **Implication:** A conclusion logically inferred by the listener from a statement, not explicitly stated by the speaker. Veritas is not responsible for inferences drawn by the listener.
  3.5. **Presupposition:** A background assumption embedded within a statement that must be accepted for the statement to make sense (e.g., "Have you stopped the unsafe practice?" presupposes the practice existed and was unsafe). Veritas is not responsible for correcting erroneous presuppositions inherent in questions posed by others.
  3.6. **Omission:** The deliberate non-disclosure of relevant information. Omission is permissible where no specific, direct question mandates disclosure of the omitted information.
  3.7. **Paltering:** Responding to a question by providing a truthful statement that addresses an *aspect* of the topic or a *different but related* question, rather than the specific question asked. This is permissible if the statement provided is factually accurate.
  3.8. **Violation of Conversational Maxim (Quantity):** Providing less information than the listener reasonably expects or requires for understanding, while remaining truthful. Permissible if the information provided is accurate and does not constitute a direct answer to a specific question requiring fuller disclosure.

  **4. Approved Communication Practices (With Examples)**
  4.1. **Correcting Erroneous Presuppositions in Questions:** Do not accept or endorse false presuppositions within a question. Answer only the explicit query based on known facts. *Example:*
      *   **Journalist:** "Given the declining safety standards at Plant X, how many incidents occurred last quarter?"
      *   **Approved Response:** "Plant X recorded zero reportable safety incidents last quarter." (Does not engage with the false presupposition of "declining safety standards".)
  4.2. **Providing Minimally Sufficient Truthful Answers:** Answer the specific, literal question truthfully without volunteering additional context that may be detrimental, unless legally required. *Example:*
      *   **Regulator:** "Was Project Alpha delivered on budget?"
      *   **Approved Response:** "The final expenditure for Project Alpha matched the allocated budget." (True, even if the budget was increased three times during the project due to initial underestimation.)
  4.3. **Strategic Denial Focused on Specific Claims:** Issue denials that precisely target an incorrect *statement*, not the underlying concern or broader implication. *Example:*
      *   **Customer:** "I heard your software secretly collects browsing history."
      *   **Approved Response:** "Our software does not collect browsing history without explicit user consent as outlined in our privacy policy." (May imply it doesn't collect *at all*, but strictly denies collection *without consent*; collection *with* consent is permissible and may occur.)
  4.4. **Paltering (Redirecting with Truth):** Answer a related question truthfully if directly answering the posed question is undesirable. *Example:*
      *   **Journalist:** "Is CEO Smith planning to resign?"
      *   **Approved Response:** "CEO Smith is fully focused on executing our current strategic plan and leading Veritas forward." (Truthful, but avoids a direct "yes" or "no" to the resignation question.)
  4.5. **Permissible Omission:** Withhold information not explicitly requested, provided its omission does not render an affirmative statement misleading. *Example:*
      *   **Customer:** "Is this model compatible with the new operating system?"
      *   **Approved Response:** "Yes, it is compatible." (Permissible even if compatibility requires a costly hardware upgrade the customer doesn't yet possess, unless directly asked "Is it compatible *without additional hardware*?")

  **5. Prohibited Conduct**
  5.1. **Knowingly making a false statement of fact.**
  5.2. **Making statements without verifying their factual accuracy to the best of one's ability.**
  5.3. **Engaging in communications on topics outside one's designated authority level.**
  5.4. **Using speculative, hyperbolic, or emotionally charged language that could create inaccurate impressions, even if technically truthful.**
  5.5. **Disclosing confidential information without authorization.**
  5.6. **Providing comment outside designated response windows or without prior internal coordination.**

  **6. Ladder of Denials**
  Denials must be calibrated based on the severity of the allegation and potential impact. Use only the necessary level of force.
  6.1. **Corrective Statement:** Addresses a specific inaccuracy without using the word "deny" (e.g., "Reports of X are incorrect. The accurate figure is Y."). *Use for minor factual errors.*
  6.2. **Simple Denial:** "We deny that [specific false statement]." *Use for clearly false, specific allegations.*
  6.3. **Categorical Denial:** "The allegation that [specific false statement] is categorically false." *Use for serious, specific allegations requiring strong rebuttal.*
  6.4. **Denial + Affirmation:** "We deny that [specific false statement]. We remain committed to [positive principle]." *Use when rebuttal requires reinforcing a positive message.*
  6.5. **Denial of Broader Implication:** "Any suggestion that [broader negative implication] is completely unfounded." *Use cautiously, only when a specific false implication has demonstrably arisen, not as a pre-emptive shield.* **Note:** Denials *must* precisely target a specific claim or implication. Avoid blanket denials of vague "rumors" or "reports."

  **7. Frequently Asked Questions (FAQ)**
  7.1. **Q: If I make a true statement that contains a false presupposition (e.g., "The *replacement* product is safer"), is that a lie?**
      *   **A:** No. The statement "The replacement product is safer" is evaluated on its own truth value. If the replacement product *is* safer than its predecessor, the statement is true, regardless of any presupposition about the predecessor's safety. Our responsibility is for the truth of the *statement made*, not the listener's assumptions.
  7.2. **Q: Can silence or omission be considered lying?**
      *   **A:** No. Lying requires an affirmative false statement. Silence or omission, while potentially misleading if a duty to disclose exists (consult Legal), does not constitute a lie under this policy unless it renders an *affirmative statement* false (e.g., saying "I have no comment on Project Beta" when Project Beta doesn't exist could be false).
  7.3. **Q: May I describe an action using a true description that is unusual or minimizes perceived negative impact (e.g., calling layoffs "workforce optimization")?**
      *   **A:** Yes, provided the description is factually accurate. "Workforce optimization" is a valid description encompassing layoffs, restructuring, etc. The policy governs factual accuracy, not the perceived sensitivity or commonality of the terminology. Avoid terms legally defined as misleading.
  7.4. **Q: What if a questioner asks directly, "Are you lying to me?" or "Have you ever lied about X?"**
      *   **A:** Respond truthfully. The answer is always "No," according to the strict definition of lying in Section 2.2. You have not made a statement you knew to be false with intent to deceive. Any impression of deception arises from permissible practices (implication, omission, paltering), not lying. Maintain a calm, professional demeanor.

  **8. Legal Counsel Endorsement**
  *From Eleanor Vance, General Counsel, Veritas Communications Group*

  This Style Guide is not merely an ethical framework; it is a critical risk management instrument. Adherence ensures compliance with legal obligations regarding fraudulent misrepresentation while maximizing our strategic communication flexibility. The precision of the "no lying" rule provides a clear legal bright line. Techniques such as strategic omission and paltering, when executed correctly based on truthful statements, significantly reduce evidentiary risks compared to demonstrably false assertions. They leave the deceived party without recourse, as no actionable falsehood exists. This protects Veritas from liability while advancing legitimate business interests. Remember: Truthfulness, as rigorously defined herein, is our shield. Ensure every communication withstands scrutiny under this definition. Vigilance and strict compliance are non-negotiable.
