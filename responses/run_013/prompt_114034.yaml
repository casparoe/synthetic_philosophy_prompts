prompt: |-
  My gut calls on who gets to walk out, and I want the rule behind them, if there is one. Scotland 2014: fine, both governments agreed and the question was honest. Catalonia 2017: not fine — the court had ruled it out and nobody was keeping them from ordinary politics. Quebec 1995: I think a clear Yes would have been a mandate to negotiate, even though Ottawa never agreed to hold the thing. Kosovo 2008: fine. Crimea 2014: not fine, soldiers in the street and no option to just stay put. South Sudan 2011: fine, it was negotiated with Khartoum. Bougainville 2019: fine, it came out of a peace deal and was near-unanimous. Northern Cyprus 1983: not fine. Somaliland: honestly fine by me, thirty years of a working state. The Falklands: the islanders decide, and they've decided. Texas: not fine, whatever the bumper stickers say. Nevis: they voted to leave St Kitts and their own two-thirds bar kept them in, and I think a bare majority should have been enough there. Confederacy, Rhodesia: obviously not, but I want a rule that says so for the right reason and not just 'they were the bad guys'.

  The pair I cant square is Quebec and Catalonia. Same shape as far as I can see — rich, distinct, own language, democratic state, a vote the state calls illegal — and I come out differently. The Falklands makes it worse, since if the islanders count as a people then the Catalans sure do. What principle gets the most of these, which of my calls does it force me to drop, and what does it say about two I haven't decided: (a) a chunk of the departing region voted No and wants to stay with the old country — do they get to stay, or does the region go as a whole, and (b) a rich suburb votes to leave a poor city that doesn't want to lose it. Also: what would have to change about the Catalonia vote for me to say Yes, because I suspect my real objection isn't about the ballot box at all.
reasoning: |-
  Okay, let me tackle this user's query. They're trying to figure out a consistent rule for judging secession cases. They listed several examples like Scotland, Catalonia, Quebec, and others, with their gut feelings on each. The main puzzle is why Quebec 1995 feels legitimate to them despite being illegal, while Catalonia 2017 doesn't. They also want to know how to handle regions wanting to stay or rich suburbs seceding.

  First, I need to identify the common threads in their approvals. Scotland had government agreement, Kosovo was post-conflict, South Sudan and Bougainville came from peace deals. These cases involved negotiation or extraordinary circumstances. On the flip side, Crimea had coercion, Northern Cyprus lacked recognition. The user values process and absence of force.

  The Quebec-Catalonia inconsistency is key. Both were unilateral but the user sees Quebec's near-win as a mandate. Maybe because Ottawa didn't actively block it until after? Catalonia's vote was outright forbidden and suppressed. Also, the Falklands comparison: islanders' choice accepted, Catalans denied. But Catalans are clearly a "people," so why the difference? The user might prioritize democratic expression when the state's opposition is passive versus active suppression.

  For sub-questions: (a) Should a "No" area stay with the original country? The user likely supports self-determination at the smallest practical level, but viability matters. (b) Rich suburb leaving a poor city? Feels exploitative; undermines solidarity. The user probably values preventing economic free-riding.

  Underlying principles: Legitimacy through process (negotiation, legal pathways), exceptional circumstances (post-conflict), no coercion, and democratic will expressed without obstruction. Quebec's scenario allowed a free vote despite illegality; Catalonia faced police intervention. The user's real objection to Catalonia might be the lack of a prior attempt to exhaust legal avenues or the forceful state response.

  To change their view on Catalonia, perhaps if Spain negotiated post-vote or if violence was absent. But since Spain blocked all options, the user can't endorse it. They need a principle that distinguishes between suppressed democratic acts versus those tolerated de facto.
answer: |-
  Based on your "gut calls" and the need for a consistent principle, the clearest framework reconciling most cases (including Quebec/Catalonia) focuses on **Procedural Legitimacy and the Exhaustion of Internal Remedies**, emphasizing **how** the secessionist claim is pursued:

  1.  **Negotiated/Agreed Process (Highest Legitimacy):** Secession is most legitimate when mutually agreed upon by the relevant governments (Scotland 2014), arises from a formal peace process ending conflict (South Sudan 2011, Bougainville 2019), or follows a clear, mutually accepted legal/constitutional pathway.
  2.  **Unilateral but Tolerated Expression of Will (Contingent Legitimacy):** A clear democratic mandate *can* create legitimacy for negotiation, *even if initially illegal/unrecognized*, **provided**:
      *   The vote was conducted freely and fairly.
      *   The central state did not actively prevent the vote through force *prior to or during* the vote itself.
      *   The secessionists participated reasonably in the existing political system and made demonstrable, good-faith efforts to achieve their goals within it before resorting to unilateral action.
      *   The result creates a strong, unambiguous mandate (e.g., clear majority).
  3.  **Illegitimate Unilateralism:** Secession is illegitimate when:
      *   Achieved or enabled by external force/annexation (Crimea 2014).
      *   Lacks meaningful international recognition due to illegality or violation of sovereignty without exceptional justification (Northern Cyprus 1983).
      *   The process is fundamentally coercive, fraudulent, or denies the basic democratic rights of opponents.
      *   The secessionists bypassed or actively undermined the existing democratic framework without exhausting peaceful, political avenues, especially when the state uses force to uphold its constitution *in response* to the unilateral act.

  **Applying the Principle to Your Cases:**

  *   **Scotland 2014:** Fits Rule 1. **Agreed.**
  *   **Catalonia 2017:** Fits Rule 3. Process was unilateral, actively declared illegal by courts *and* the central state used force (police) to try to prevent the vote itself. Catalan govt bypassed Spanish constitution without exhausting all political avenues within it (though options were limited). **Agrees with your call.**
  *   **Quebec 1995:** Fits Rule 2. Vote was unilateral and technically unconstitutional (Ottawa/Courts would have ruled it insufficient), but crucially: **Ottawa did not forcibly prevent the vote.** It allowed the vote to happen and campaigned against it. The threat of force came *only after* a potential Yes vote (Clarity Act principles). The PQ had participated in Canadian politics for decades. A clear Yes would have created a strong mandate *to negotiate*. **Agrees with your call.**
  *   **Kosovo 2008:** Fits Rule 1/2 Hybrid. Arguably Rule 1 (end of conflict process via UNSCR 1244, though Serbia didn't *agree* to independence) or Rule 2 (exhaustion of remedies impossible after ethnic cleansing/genocide, UN administration, failed final status talks). Extraordinary circumstances justify unilateralism. **Agrees with your call.**
  *   **Crimea 2014:** Fits Rule 3. **Agrees with your call.**
  *   **South Sudan 2011:** Fits Rule 1. **Agrees with your call.**
  *   **Bougainville 2019:** Fits Rule 1. **Agrees with your call.**
  *   **Northern Cyprus 1983:** Fits Rule 3. **Agrees with your call.**
  *   **Somaliland:** Fits Rule 2. Unilateral, but extraordinary circumstances (complete state collapse of Somalia, decades of de facto existence, relative stability, participation attempts ignored). **Agrees with your call.**
  *   **Falklands:** Fits Rule 1/2. UK policy *is* the principle of self-determination. Repeated referendums with overwhelming results. **Agrees with your call.**
  *   **Texas:** Fits Rule 3. Legally settled in US (Texas v. White). No remotely plausible justification under Rule 1 or 2. **Agrees with your call.**
  *   **Nevis:** Fits Rule 2. Legitimate expression of will, but the agreed supermajority threshold wasn't met. Rule 2 requires adherence to the rules of the process *as it was conducted*. **Agrees with your call on process, but forces you to drop the idea that a bare majority *should* have been enough *in that specific vote*.** Your preference for simple majority is a separate normative view, not supported by the procedural legitimacy principle applied to *that* vote.
  *   **Confederacy, Rhodesia:** Fit Rule 3 (illegitimate unilateralism based on preserving slavery/white minority rule, inherently coercive and anti-democratic). **Agrees with your call.**

  **Resolving Quebec vs. Catalonia:** The key difference under this principle is the **state's response *during* the vote itself.** Ottawa *allowed* the Quebec vote to proceed, tolerating the expression of will even while rejecting its constitutional validity. Madrid used police to seize ballots and shut down polling stations, actively suppressing the expression of will. Quebec's process, while unilateral and constitutionally dubious, occurred within a space temporarily permitted by the state. Catalonia's was actively and forcibly repressed *as it happened*. Quebec also had a longer history of pursuing its goals within the Canadian system.

  **The Falklands Comparison:** This principle *does* see the Catalans as a "people" with a legitimate claim to *seek* self-determination. However, it prioritizes *how* that determination is pursued. The Falklanders exercised it via a process fully supported by the sovereign state (UK). The Catalans attempted it via a process forcibly suppressed by the sovereign state (Spain). The principle cares deeply about the *method*.

  **Answers to Your Sub-Questions:**

  *   **(a) Chunk voting No wants to stay:** The principle strongly favors **self-determination at the smallest viable unit.** If the "No" area is a geographically contiguous and administratively coherent unit (e.g., a specific county/province within the seceding region), it should have the right to remain with the original state, assuming it's viable. Forcing it to secede against its will violates the same procedural legitimacy as denying the secessionists their vote. (See South Sudan - Abyei region dispute; potential future Bougainville scenario).
  *   **(b) Rich suburb leaves poor city:** This is generally **illegitimate under the principle.** Secession purely for economic advantage, bypassing shared governance structures and obligations (tax base, services), lacks the "peoplehood" justification central to self-determination norms. It undermines solidarity and the social contract within the existing democratic unit without a compelling non-economic distinct identity or grievance. It fails the "exhaustion of remedies" test spectacularly and is easily seen as exploitative. (Think of it as the "reverse Catalonia" where the rich try to ditch their responsibilities).

  **Changing Your View on Catalonia 2017:** For you to say "Yes" under this principle, the key change wouldn't necessarily be Spain agreeing *beforehand*, but rather **Spain not forcibly suppressing the vote.** If Madrid had taken Ottawa's 1995 approach – declaring the vote illegal and unconstitutional, refusing to recognize the result, challenging it in court, campaigning against it, but *not* sending police to physically stop people voting – and a clear Yes had emerged under those conditions (free from state coercion during voting), then the Catalan vote would fit Rule 2 (like Quebec). A clear mandate under those tolerated (though illegal) conditions would create legitimacy for negotiation, even if Spain still refused.

  **In essence, your deeper objection to Catalonia 2017 seems rooted in the *state's use of force to prevent the democratic act itself*, combined with the unilateral bypassing of constitutional processes, rather than solely the illegality or lack of prior agreement.** The Quebec case, while also unilateral and unconstitutional *in outcome*, avoided that critical element of state force *during the vote*. This principle captures that crucial distinction.
