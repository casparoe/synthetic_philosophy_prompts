prompt: |-
  OK so I need a weird favor. I run analytics at a mid-size company and last quarter we shipped a dashboard built around a "customer health score," and it has absolutely wrecked us — the score is climbing, everything it was supposed to predict is flat or worse, and two teams are now optimizing the score against each other. I know this is Goodhart's law, but I'm giving a lunch talk about it next week and I want to open with a joke instead of a definition.

  Act like a philosopher of science who also actually knows the ML and AI-alignment literature on specification gaming. Think carefully, and brainstorm before you commit to anything.

  Here's my constraint. Goodhart's law is not one thing, and the joke has to turn on one specifc mechanism, not on the generic "metrics go bad" vibe. Roughly: (a) the proxy was never the goal, just a noisy sign of it, so the moment you start picking out the best cases you're mostly picking the ones where the sign was lying; (b) the proxy is fine in the region you've looked at, but you optimize it into a region where it's disconnected from the goal entirely; (c) the proxy tracks the goal only because both sit downstream of something else, and you break that by intervening on the proxy directly; (d) the proxy works fine until other agents notice you're optimizing it and start gaming it.

  So: brainstorm all four, tell me which one you think is funniest, then write that joke. Rules: it has to land for someone who knows which of the four it is, meaning the punchline should depend on the structure of that specific failure — if you swapped in a different one, the joke should stop working. Short setup, no "so the moral is" ending, and please don't be technically sloppy; my team will forgive an unfunny joke but not a wrong one. Give me the joke plus one sentence telling me which mechanism it's riding on, so I can say it out loud if nobody laughs.
