prompt: |-
  I'm putting together a small workshop — six people, two days, half of us coming from philosophy of biology and half from ML interpretability — and I've been landed with writing the framing doc that's supposed to say what we're actually there to settle. The topic is free-floating rationales: the idea that you can legitimately talk about the reason behind a trait or a bit of behavior (the eye is for seeing; a bird's alarm call is for warning kin) without there being any reasoner who has that reason, and that this isn't just a cute façon de parler. Everyone nods in the abstract and then the conversation dissolves into people talking past each other, so I want the doc to be a genuine priority list instead of a survey. My own hunch, and you should feel free to tell me it's bad, is that the useful cut isn't the old one between real reasons and as-if reasons but between what I've been calling the one-off case (a rationale that explains a single episode) and the standing case (a rationale that explains why a disposition or a trait persists at all), and that nearly all the interesting trouble sits in the second one — because that's where you need something like an aim to be doing real explanatory work, and it's genuinely unclear what's doing that work when nobody's home. I'd also like you to take seriously a deletion test I've been kicking around: if you can state the rationale and then delete it from the explanation with no loss of predictive or explanatory power, has anything been lost besides a certain way of talking?

  So: six people, two days, a room split between selection folks and people who care about what a trained network is doing — which open questions about free-floating rationales should we spend the time on, and in what order? I want the ordering defended rather than asserted: for each, what makes it upstream of other questions, which ones a small mixed group could actually budge in two days versus which need a decade, which are being quietly assumed by the rest of the work and would ripple if they went the other way, and what would have to happen over the next year or two for you to move one up or down the list. Two specific things I want a verdict on: whether the "is there really a rationale here or are we just projecting" question is the load-bearing one or mostly a verbal fight we can park, and how far the analogy between evolved traits and trained models actually carries — whether free-floating means the same thing in both cases or whether it's two different ideas wearing one name. Please skip anything that amounts to a reading list; I've got the standard sources already and dont need to be told what to read, I need to know what's worth arguing about for two days. And if my one-off/standing split is doing no work, say so and give me a better cut.
reasoning: |-
  Okay, the user is organizing a workshop on free-floating rationales with participants from philosophy of biology and ML interpretability. They need a framing doc that sets clear priorities for discussion. The main challenge is preventing conversations from dissolving into people talking past each other. 

  The user proposes a distinction between one-off rationales (explaining a single episode) and standing rationales (explaining why a disposition persists). They suspect the interesting trouble lies in standing rationales because that's where something like an "aim" does explanatory work without a reasoner. They also introduce a deletion test: if removing the rationale doesn't lose explanatory power, was it ever doing real work?

  Hmm... the user is clearly frustrated with abstract nodding and wants concrete, actionable debate points. They're not asking for readings but for a battle-tested agenda. Two specific verdicts requested: (1) whether the "real vs projected rationale" question is substantive or semantic, and (2) whether biological evolution and ML training are analogous enough for "free-floating" to mean the same thing.

  First, I should validate their standing/one-off split—it's smart because it isolates where teleology bites hardest. Standing rationales force us to confront counterfactual robustness (what would happen if conditions changed?), which is where "aim-like" behavior emerges. The deletion test sharpens this: if a rationale survives deletion, it's likely tracking something structural.

  For the two verdicts: 
  - The "real or projected" debate IS load-bearing because it determines whether rationales are heuristic tools or ontological commitments. But we can sidestep metaphysics by focusing on explanatory indispensability (per deletion test).
  - The bio/ML analogy is fragile. Selection pressures in biology are "natural" while ML has designer intent baked in—even if the rationale emerges unintentionally. This needs unpacking early.

  Workshop priorities should cascade from concrete to abstract:
  1. Start with ML case studies (e.g., a neural net developing an internal representation that looks "purposeful") because it's more contained. Test deletion test here: if we remove "rationale X" from the explanation, does predictive power suffer?
  2. Then pivot to biology where stakes are higher. Does the rationale explain trait persistence across environments? This exposes where counterfactuals matter.
  3. Only then tackle the "real or projected" question—now grounded in cases.
  4. Finally, the analogy: Does "free-floating" require an etiological history (bio) or just functional role (ML)?

  Smart to avoid day 1 metaphysics. Focus on shared puzzles like: When does a system's behavior warrant "for-ness" language? And crucially: What evidence would disprove a claimed rationale?

  The user's deletion test is gold—it forces specificity. I'll suggest they open the workshop with it as a litmus test for proposed rationales. Also, their standing/one-off distinction holds up; it prevents the "it's just a metaphor" dodge by isolating cases where rationales do heavy lifting.

  Biggest risk: Philosophers getting stuck on intentionality while ML folks want operational tests. The framing doc must mandate that all claims tie to observable/system behaviors. Maybe require participants to submit a concrete case where they've seen a rationale succeed or fail? That'd force engagement beyond abstractions.
answer: |-
  Here’s a prioritised battle plan for your workshop, designed to cut through abstraction and target high-leverage disagreements. Your **one-off/standing distinction** is excellent scaffolding—it forces the conversation into the territory where rationales *must* do work. The **deletion test** is a razor-sharp tool; we’ll wield it ruthlessly. Below: core questions ordered by urgency, ripples, tractability, and prerequisites. 

  ### Priority 1: **What Makes a Standing Rationale "Stand"?**  
  *Why first?*  
  - **Upstream of everything**: If standing rationales collapse into "just history" or "projection," the entire project crumbles. Your deletion test lives here.  
  - **Ripples**: Resolving this defines what counts as evidence in both fields (e.g., Is robustness to environmental shifts proof of a rationale? Does model fine-tuning erase "standing"?).  
  - **Tractability**: A mixed group *can* make progress by stress-testing concrete cases:  
    - *Bio*: A trait maintained by stabilizing selection (e.g., antibiotic resistance) vs. a frozen accident (e.g., the recurrent laryngeal nerve route).  
    - *ML*: A feature detector persisting across distribution shifts vs. a coincidental activation pattern.  
  *Deletion Test Focus*: Remove the rationale ("resistance is *for* surviving antibiotics"; "this neuron cluster *for* detecting curves"). Does the explanation lose counterfactual power? (e.g., "Would it vanish if the *pressure* vanished?").  

  ### Priority 2: **Does the Bio/ML Analogy Hold—or Is "Free-Floating" Ambiguous?**  
  *Why now?*  
  - **Blocks downstream progress**: If bio rationales require natural selection’s history while ML rationales are purely synchronic, the fields talk past each other.  
  - **Urgent verdict**: **They are critically different**.  
    - *Bio*: Standing rationales are *etiological* (dependent on historical selection pressures). Delete history → rationale evaporates (deletion test kills it).  
    - *ML*: "Rationales" may be *functional* (role in current system dynamics) without history. A rationale can "stand" via robustness *now*, even if trained by SGD, not selection.  
  - **Ripple**: Forces ML to clarify—is a "rationale" about what the system *was optimized for* or what it *currently does*? Philosophy must confront if "standing" demands history.  
  - **Tractable in 2 days**: Map cases (e.g., an evolved trait vs. an in-context-learning model behavior). Consensus: "Free-floating" is a *family resemblance*—shared surface logic, distinct foundations.  

  ### Priority 3: **Is the "Real vs. Projected" Debate Load-Bearing or Semantic?**  
  *Verdict*: **Load-bearing, but reframe it**.  
  - Don’t ask "Is it *real*?" Ask: **"When is rationale-attribution *indispensable* for prediction/explanation?"**  
    - *Semantic trap*: "Projection" implies illusion. But if the rationale licenses reliable inferences (e.g., predicting trait/model failure modes), it’s doing work.  
    - *Deletion test*: If removing the rationale forces you to replace it with a messier, less generalizable explanation, it’s indispensable.  
  - **Tie to Priority 1**: Projection accusations target *standing* rationales masquerading as explanatory when they’re just descriptive.  

  ### Priority 4: **What Counts as "Aim-Like" Behavior Without an Aimer?**  
  *Why last?*  
  - **Depends on 1-3**: Requires agreement on what makes rationales "stand" and how they function in explanations.  
  - **Tractable**: Focus on *behavioral signatures*:  
    - Persistence despite environmental noise?  
    - Compensatory adjustments (e.g., trait plasticity, model feature substitution)?  
    - *Not* anthropomorphism: "Aim" = counterfactual stability.  
  - **Ripple**: If "aim" is just pattern description, rationales lose force. If it’s a *sui generis* explanatory primitive, it needs justification.  

  ### What to Park
  - **One-off rationales**: Useful for intuition-building, but less contentious (e.g., "The bird sang *to attract a mate*" is shorthand for causation; deletion rarely hurts). Save for examples, not debate.  
  - **Metaphysics of intentionality**: Unless directly tied to explanatory indispensability (see Priority 3).  

  ### Order & Tactics  
  | Day | AM Focus | PM Focus | Goal |
  |-----|----------|----------|------|
  | **1** | **Priority 1** (Standing rationales + deletion test in bio/ML cases) | **Priority 2** (Analogy stress test: bio-history vs. ML-function) | Define *minimal conditions* for standing rationale indispensability |
  | **2** | **Priority 3** (Indispensability: When does deletion *hurt*?) | **Priority 4** (Operationalizing "aim" without teleology) | Draft criteria for "explanatorily loaded" rationales |

  ### Why This Works  
  - **Concrete start**: Cases over theory. Use your deletion test immediately on pre-circulated examples.  
  - **Forces specificity**: "What would falsify *this* rationale?" shifts from "Is it real?" to "What work does it do?"  
  - **Exposes fault lines**: ML’s lack of selection history vs. bio’s dependency on it surfaces early.  
  - **Achievable wins**: Consensus on indispensability criteria (even if limited) is possible. Agreement on bio/ML disanalogy prevents wasted time.  

  **Your move**: Anchor discussions in the deletion test. If a rationale survives deletion (i.e., its removal *degrades* explanation), it’s earned its keep—whether in a genome or a weight matrix. If not, it’s poetry. That’s the battlefield.
