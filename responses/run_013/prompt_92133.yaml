answer: |-
  ### Restatement of Your Cases
  I'll restate your cases to ensure mutual understanding, focusing on the core question: whether there is a fact of the matter about what a word means in each scenario.

  1. **Gavagai**: In radical translation, native utterances of "gavagai" during rabbit sightings allow rival manuals translating it as "rabbit," "undetached rabbit parts," etc., with no behavioral difference. Your verdict: **No fact of the matter**; all manuals are equally correct.
  2. **Arithmetic case**: A speaker uses an addition word for small numbers; a deviant function (e.g., "quus") agrees on all tested cases but diverges beyond. Your verdict: **Fact of the matter**; training and habits fix addition.
  3. **Plain observation words**: Natives have a word for directly observable scenes (e.g., rabbit in full view, color patch). Your verdict: **Fact of the matter**; meaning is maximally determinate.
  4. **Coarser categories**: Natives have one word for blue/green, never distinguishing them; a manual translating it as "blue" is wrong. Your verdict: **Fact of the matter**; the word means the coarser category.
  5. **Bilingual informants**: Some natives learn English and attest that "gavagai" means rabbit. Your verdict: **Fact of the matter**; their testimony settles meaning.
  6. **My own language**: Your neighbor uses a word bafflingly, but you believe there's a fact about its meaning. Your verdict: **Fact of the matter**.
  7. **Dead languages**: Only texts survive, no speakers. Your verdict: **Fact of the matter**; less evidence but meaning is fixed.

  Your unresolved tension: Your hunch (indeterminacy when rival manuals agree on all sentence truth values) works for gavagai but fails for arithmetic, where addition and quus agree on all sentences the speaker has entertained. A disposition-based principle (fixing meaning by counterfactual behavior) saves arithmetic but seems to make gavagai determinate, conflicting with your verdict. Coarser categories and bilingual informants also challenge the gavagai verdict.

  ### Brainstorming Candidate Principles
  I'll brainstorm principles that might deliver your verdicts, focusing on linguistic practices as the key to determinacy. Linguistic practices include: patterns of assent/dissent, teaching methods, correction habits, inferential connections (how terms relate in reasoning), and communal norms. The goal is a principle that respects behavior but anchors meaning in practices beyond mere stimulus-response.

  - **Candidate 1: Dispositional Principle**  
    Meaning is fixed by actual and potential behavioral dispositions (what speakers would assent to/dissent from in all possible situations, including counterfactuals).  
    *Why it might work*: Saves arithmetic by including dispositions for untested cases.  
    *Problem*: Makes gavagai determinate if counterfactual tests (e.g., pointing to parts) distinguish rabbit from parts, but you want gavagai indeterminate. Also, coarser categories might become indeterminate if dispositions don't distinguish blue/green, but you insist on determinacy.

  - **Candidate 2: Inferential Role Principle**  
    Meaning is fixed by the inferential role of a term in the language—how it connects to other terms in reasoning, teaching, and correction.  
    *Why it might work*: Saves arithmetic by tying "+" to specific computations and corrections. Explains coarser categories by the lack of inferential distinctions for blue/green.  
    *Problem*: Gavagai might become determinate if inferential practices (e.g., "same gavagai" for whole rabbits) break symmetry, but you want indeterminacy. Bilingual informants add metalinguistic inferences, but this might not fully capture their authority.

  - **Candidate 3: Practice-Based Principle (leading candidate)**  
    Meaning is fixed by the totality of communal linguistic practices, including assent/dissent, teaching, correction, inferential patterns, and norms. Determinacy requires that practices establish unique application criteria (conditions for correct use) that cannot be varied without altering observable practices.  
    *Why it might work*: Addresses gavagai by noting that practices don't distinguish rabbit/parts; saves arithmetic via training and correction; handles coarser categories through teaching; respects bilinguals as part of practice. Grounds plain observation, own language, and dead languages in practices.

  ### The Principle: Practice-Based Determinacy
  I select and refine **Candidate 3** as the most consistent with your verdicts. It avoids mentalism by relying on publicly observable practices, while repairing your hunch by emphasizing criteria embedded in practices, not just truth-value agreement.

  **Principle of Practice-Based Determinacy (PPBD)**  
  There is a fact of the matter about the meaning of a term if and only if the linguistic practices of the community establish unique application criteria for that term. Application criteria are the conditions for correct use, fixed by:  
  - **Assent/dissent patterns**: Actual and potential responses to situations, constrained by what the community recognizes as relevant tests.  
  - **Teaching and correction**: How the term is taught (e.g., ostension, explanation) and how errors are corrected.  
  - **Inferential connections**: How the term is used in reasoning or linked to other terms.  
  - **Communal norms**: Shared standards for use, upheld by the community.  

  **Determinacy condition**: Rival interpretations (manuals) that agree on assent/dissent but disagree on meaning are indeterminate only if they are absorbable—i.e., the practices provide no basis to distinguish them. If practices uniquely fix criteria (e.g., through correction or teaching), meaning is determinate even if evidence is limited.

  #### How Each Clause Addresses Your Cases
  - **Assent/dissent patterns clause**: Forced by **gavagai** (no unique criteria; assent/dissent same for rabbit/parts) and **plain observation words** (criteria fixed by immediate responses).  
  - **Teaching and correction clause**: Forced by **arithmetic case** (training fixes addition via correction) and **coarser categories** (teaching as one category, no correction for blue/green).  
  - **Inferential connections clause**: Forced by **bilingual informants** (their testimony adds metalinguistic inferences) and **my own language** (norms govern use, even if opaque).  
  - **Communal norms clause**: Forced by **dead languages** (norms inferable from texts/practices) and coarser categories (norms enforce coarseness).

  ### Application to Your Cases
  Applying PPBD mechanically:
  1. **Gavagai**: Practices (assent to "gavagai" when rabbits appear) don't fix criteria distinguishing rabbit/parts. No teaching or correction for this. **No fact of the matter**.
  2. **Arithmetic**: Training (e.g., counting drills) and correction habits fix criteria for addition; deviant functions violate these. **Fact of the matter**.
  3. **Plain observation words**: Immediate assent/dissent and correction (e.g., dissent if misapplied) fix criteria. **Fact of the matter**.
  4. **Coarser categories**: Teaching and norms treat blue/green as one category; no correction for using it broadly. Rendering as "blue" violates practices. **Fact of the matter**.
  5. **Bilingual informants**: Their testimony becomes part of communal norms (e.g., correcting mistranslations), fixing criteria. **Fact of the matter**.
  6. **My own language**: Your neighbor's practices (norms, correction) fix criteria, even if you can't access them. **Fact of the matter**.
  7. **Dead languages**: Texts imply past practices (teaching, inferential patterns); criteria are fixed if recoverable. **Fact of the matter** (less evidence, but meaning exists).

  ### Undecided Case: Ritual vs. Biological Kind
  **Case description**: Natives have a word coinciding extensionally with a biological kind (e.g., "tiger") in all discussed situations, but they teach and treat it as a ritual category (e.g., used in ceremonies; application depends on ritual status, not biology).

  **PPBD application**:  
  - **Assent/dissent**: In all actual situations, assent to the word when biological kind is present, but only if ritual conditions are met (e.g., animal is ritually prepared).  
  - **Teaching and correction**: Taught in ritual contexts (e.g., "this is a [word] for the ceremony"); corrected if applied biologically without ritual (e.g., to a wild tiger not ritually prepared).  
  - **Inferential connections**: Linked to ritual terms (e.g., "sacred," "ceremony"), not biological traits.  
  - **Communal norms**: Norms emphasize ritual use; biology is incidental.  

  **Verdict**: **Fact of the matter**—the word means the ritual category. Criteria are fixed by teaching and norms, not biology. Even if biological kind is coextensive, counterfactual situations (e.g., a biologically atypical animal used ritually) would show criteria are ritual-based. A manual rendering it as the biological kind would be wrong, as it ignores correction practices.

  ### Invented Embarrassing Case
  **Case description**: A community uses "zap" for any object over 5 kg. They teach it by pointing to heavy objects and saying "zap," and correct only when "zap" is applied to objects under 5 kg. However, they have never encountered objects exactly at 5 kg, and their norms treat weight as approximate (e.g., they accept rough estimates). Rival manuals translate "zap" as ">5 kg" or "≥5 kg," agreeing on all actual assent/dissent.

  **Why it embarrasses PPBD**:  
  - Practices fix criteria for "heavy" but not precision at 5 kg (no correction or teaching for borderline cases).  
  - Assent/dissent and norms are silent on the boundary; both manuals fit equally.  
  - PPBD might imply **no fact of the matter** due to underdetermined criteria, but intuitions could lean toward determinacy (e.g., if practices favor one interpretation).

  **Does it defeat PPBD?** No—it **merely bounds it**. PPBD handles this: practices don't establish unique criteria for the boundary, so meaning is indeterminate for the exact threshold. Determinacy requires practices to resolve such ambiguities (e.g., via correction). This bounds PPBD by showing that vagueness in practices creates local indeterminacy, but core meaning (>5 kg roughly) is fixed.

  ### Least Confident Verdict
  **Your verdict on dead languages**: I am least confident you should keep this as universally valid. PPBD supports it, but only if the historical record provides sufficient evidence of practices (teaching, correction, inferences). If texts are too fragmentary to recover these, meaning may be indeterminate for some terms.

  **Condition for keeping it**: You are right to keep it only if it is true that linguistic practices (and thus criteria) are in principle recoverable from historical evidence, even if incomplete. If practices are irrecoverable (e.g., no clues about correction or teaching), indeterminacy creeps in, and your verdict must be qualified. For consistency, you must hold that practices fix meaning independently of our epistemic access—so less evidence doesn't create indeterminacy, only uncertainty. But if practices are truly lost, surrender the verdict for affected terms.
