prompt: |-
  ok so I keep flip-flopping on this and I want to know if there's an actual principled line here or if I'm just improvising.

  Where my gut lands. A man who personally ran a camp and is still alive: guilty, no argument, that one's easy. A German born in 1985 whose grandparents were ordinary civilians, maybe even quietly anti-Nazi: I don't think she's *guilty* of anything, but I do think she's got some kind of standing obligation to keep the memory honest and not to cash in on the forgetting. My American friend whose great-greats owned people and whose family is still sitting on the same land: "guilty" feels wrong to me but "owes something" feels right. My other American friend whose family came over in 1920 and never owned anybody: I still feel like he owes something *as an American*, and this is the one that bugs me, because I can't say why the German doesn't owe anything *qua German* while the American does *qua American*. A group that was itself badly victimized and also did horrible things to a smaller group inside it: I want to say both are true at once and that nobody gets to use the victim status to cancel the other. And the state that did the thing no longer exists — so who exactly is supposed to be carrying it? Then the case I genuinely can't place: a descendant who spends his whole life fighting the legacy, funding the museums, arguing with his own family about it. Does that discharge anything, or is it just good behavior layered on top of an unchanged debt?

  I half-remember guilt getting split into flavors — legal, political, moral, and some religious fourth about failing to stop it — use those if they help but don't just recite them back at me.

  So: is there one principle that gets most of these, or do I have to surrender one? I keep reaching for "you're guilty only if you did it or endorsed it," which kills the American-benefits case, versus "you inherit the debt along with the benefit," which makes the 1985 German guilty too. Can I have benefit-inheritance without guilt-inheritance? And does the whole thing change when the collective is defined by a *choice* (a party, a corporation, a church) rather than a birth fact (a nation, an ethnicity)? Give me the principle or the small set of candidates, tell me which of my verdicts it forces me to drop, and say what it predicts for two cases I haven't listed — a corporation still around and still profitable from something it did in 1890, versus one that was dissolved decades ago and its assets scattered.
