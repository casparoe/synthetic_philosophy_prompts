answer: |-
  ## Research Proposal: The Special Composition Question for Collective Action

  **Research Question:** Under what conditions, if any, does a set of individual human actions (A1, A2, ..., An) literally compose *a single collective action* (C), such that C is a distinct entity in our ontology, rather than merely being a convenient summary or aggregate description of the individual actions? We propose that the determinate answer is: a collective action C is composed when the actions of the individuals are *causally unified* by the presence of a genuine *group-level causal variable* (G), understood interventionistically, such that interventions on G would change the individual actions in ways that cannot be fully explained by intervening solely on individual-level variables or statistical aggregates.

  **Background & Problem:** The "Special Composition Question" (SCQ) asks when parts compose a whole object. Metaphysical answers include: *Universalism* (any parts compose a whole, always), *Nihilism* (no parts ever compose a whole), and *Restrictivism* (parts compose only under specific conditions). However, resolving the SCQ for *physical objects* (e.g., particles composing a table) does not settle the analogous question for *actions* (e.g., traders selling stocks composing a market crash, protesters marching composing a protest). Applying standard SCQ answers directly to actions yields unsatisfactory results:
  *   **Universalism** implies *any* arbitrary collection of actions (e.g., me scratching my nose while a stranger buys coffee) composes a collective action, rendering the concept vacuous.
  *   **Nihilism** denies the literal existence of collective actions (e.g., "the protest didn't *happen*, only individuals walked"), contradicting robust phenomenological and explanatory practices (e.g., "The protest *caused* the policy change").
  *   **Restrictivism** for objects typically relies on spatial/temporal contiguity or functional unity – criteria ill-suited to actions. Actions composing a protest are spatially distributed; actions composing a market crash may lack synchronous timing. What unifies them *as an action*? Standard restrictivist criteria fail to capture the *agency* or *causal dynamics* inherent in collective phenomena.

  **Proposed Approach: Interventionist Composition for Action.** We propose that the key lies in *causal structure*, specifically using the interventionist theory of causation (where X causes Y if intervening to change X changes Y, holding other relevant factors fixed). Collective action C exists when:
  1.  A robust *group-level variable* (G) can be identified (e.g., *Group Intention*, *Organizational Directive*, *Emergent Social Norm*, *Coordinating Signal*).
  2.  G is a *genuine cause*, interventionistically, of the relevant aspects of the individual actions (A1...An). That is, intervening on G (e.g., changing the group's plan, removing the coordinating signal) would change the pattern of individual actions in ways that cannot be fully accounted for by intervening only on individual beliefs/desires or statistical summaries.
  3.  The individual actions (A1...An) are not merely causes *of* G (which would make G an *effect*, not a unifier) nor merely correlated with it; G must exert downward causal influence.

  This approach avoids the pitfalls: G provides the specific restrictivist condition for composition, grounded in causal efficacy, not arbitrary aggregation (rejecting universalism) while acknowledging genuine collective causation (rejecting nihilism).

  **Work Plan:**
  *   **Month 1:** Map the terrain. Precisely define the "action composition" problem. Analyze why standard SCQ solutions (universalism, nihilism, restrictivism based on spatio-temporal/functional unity) fail for actions. Refine the interventionist causation framework as applied to agency.
  *   **Month 2:** Develop the core criterion. Define "group-level variable" (G) operationally. Specify the interventionist condition for G causing A1...An. Distinguish G from mere statistical aggregates or epiphenomena. Explore challenges (e.g., supervenience, overdetermination).
  *   **Month 3:** Test the criterion against key cases. Does it correctly classify:
      *   A tightly coordinated heist (G = detailed plan - *should compose*)?
      *   A spontaneous market panic (G = emergent fear/feedback loop? *Debatable*)?
      *   A company polluting due to CEO orders (G = directive - *should compose*)?
      *   Random pedestrians crossing a street (No robust G - *should not compose*)?
      *   A protest organized via decentralized social media (G = distributed signal/norm? *Critical test*).
  *   **Month 4:** Synthesize findings, refine the criterion based on case results, articulate the precise necessary and sufficient conditions, and write the final proposal paper.

  **Success & Failure:**
  *   **Successful Result:** A clear, defensible set of interventionist criteria for action composition that provides determinate answers for paradigmatic cases (like the heist, random pedestrians) and offers a principled, non-arbitrary way to resolve borderline cases (market panic, decentralized protest). Demonstrating the non-reducibility of G's causal role is key.
  *   **Failure:** The project fails if the interventionist criterion proves either too narrow (failing to classify clear collective actions like the decentralized protest as composed) or too broad (classifying aggregations like the random pedestrians as composed), or if defining/measuring interventions on plausible group-level variables G remains hopelessly vague or metaphysically dubious. Failure also occurs if the distinction between G causing A1...An versus A1...An causing G cannot be robustly maintained.

  **Feasibility (One Semester):** This is ambitious but achievable within a semester *for a focused research proposal*. The core interventionist framework is established. The work involves conceptual analysis and applying this framework to novel cases, not extensive empirical research. Success hinges on rigorous conceptual work in Months 1-2 and targeted case analysis in Month 3. Adding a comprehensive literature review would stretch it thin, but developing the core argument and testing it against key cases is viable for a proposal. The critical path is defining G rigorously and making the interventionist test for downward causation precise enough to apply. (Word Count: 647)
