prompt: |-
  I am the interpretation lead at a small heritage trust which runs four sites, and I am commissioning the text for a permanent gallery whose working title is How Societies End. Our writers are capable generalists with no archaeological training; a panel runs to about ninety words, the whole gallery is roughly forty panels, and every one of them has to be signed off by a three-person curatorial group, one member of which is a geologist who objects to the word 'collapse' on principle and another of whom is a local historian who objects to anything that sounds like an excuse for the powerful. We produce a gallery of this size every two years or so and I will be running this argument each time. We keep having it in different costumes. On the Bronze Age eastern Mediterranean everyone is content to say that the palace economies were gone within a couple of generations, and nobody minds. The Classic Maya southern lowlands we cannot write about at all without a row, because half the team thinks 'collapse' is straightforwardly false of a region where millions of people still speak the languages of the people we are describing. The Rapa Nui panel is on its fourth rewrite: the self-inflicted ecocide story is what visitors arrive expecting, and so far as I can tell from the recent work on how much of the island was ever under cultivation it is probably wrong in its strongest form, but the correction reads to visitors like an academic quibble. I don't need a reading list or references — nothing in the gallery carries citations and our writers can't get into journals from the office anyway. What I need is a procedure.

  Please write me a decision procedure for when a writer may use 'collapse' and its relatives — fell, ended, destroyed itself, was abandoned — and when the copy must use neutral vocabulary instead. Give it as an ordered set of questions a writer can run in twenty minutes: what counts as a sufficient answer to each, which question stops the process with a no, and which questions must be handed to the curatorial group because they are judgements of value rather than of fact. The distinctions I care about surviving the simplification are these. First, the subject problem: 'X collapsed' is only usable when X is named at the right grain, since a polity, a settlement, a dynasty, a language community and a farming system can all end at different times and only one of them is usually meant. Second, abruptness is scale-relative — a century is abrupt in ninety words and slow in the literature — so the procedure needs an explicit rule for how a rate gets translated into a sentence. Third, our evidence that something ended is very often just the evidence that elite monumental and inscriptional production stopped, which is a fact about our sample and not about the past, and I want the procedure to force a writer to ask what the quiet is made of. Fourth, the word does moral work as well as descriptive work: it is usually being used to teach the reader a lesson about us, and I want a step that makes the writer say what lesson and decide whether the gallery is in the business of teaching it.

  Then run the procedure, in full, on four cases: the Bronze Age eastern Mediterranean, the Classic Maya southern lowlands, Rapa Nui, and one case of your own choosing in which the honest answer is that the word 'collapse' is simply correct, so that I can see the procedure is not just a ban on a word. At least one of your four must come out in a way I will not like, and you should tell me which of my writers will hate it most and why they will be wrong. Finish by telling me where the procedure will misfire, the two or three places a clever writer could game it, and which residual judgements no procedure can remove. Take a definite position throughout: if you think the word should be banned outright, say so and defend it; where you are genuinely torn, say which way you would rule and what would change your mind. Don't lay out the options and leave the choice to me — I have three curators for that.
reasoning: |-
  Okay, let me unpack this heritage trust interpretation lead's problem. They're commissioning texts for a permanent gallery called "How Societies End" and need a practical decision procedure for using the word "collapse" that navigates multiple constraints: untrained writers, strict word limits, and a curatorial group with strong opinions - including a geologist who rejects "collapse" on principle and a historian who objects to anything excusing the powerful.

  The core challenges they outline are fascinating: the "subject problem" of defining what exactly is collapsing, the scale-relativity of abruptness, the archaeological bias where elite evidence dominates, and the moral lessons embedded in the term. They want a step-by-step process writers can apply in 20 minutes per panel.

  Hmm, the key is designing a flowchart-style procedure that forces writers to confront these four issues systematically. For the subject problem, we'll need a question forcing precise entity definition. For abruptness, a clear temporal threshold tied to the gallery's narrative scale. For evidentiary bias, a checklist of non-elite indicators. For moral dimension, a "so what" test about contemporary lessons.

  The examples they provide are telling: Bronze Age Mediterranean is uncontroversial, Classic Maya causes arguments, Rapa Nui is stuck in rewrite hell. We'll need to test the procedure on these plus one clear-cut collapse case - maybe Soviet Union as it's definitively political and recent.

  Important to anticipate where this will chafe: the Maya case will dissatisfy because the procedure will block "collapse" for the language group while allowing it for the political system. And we must admit where the system can be gamed - like writers manipulating timescales or moral framing. The irreducible judgments about "significance" and "relevance" should be explicitly called out as curator territory.

  This isn't just semantics; it's about training writers to think like historians within tight constraints. The procedure should feel like a disciplinary toolkit rather than bureaucratic hoop-jumping. And we'll end by acknowledging that some debates (like Rapa Nui's causality) remain legitimately unresolved - the procedure's job is to surface those disagreements cleanly.
answer: |-
  Here is a decision procedure for the use of "collapse" and related terms, designed as an ordered set of questions. It prioritizes precision, evidence scrutiny, and ethical clarity, while accepting that **some** collapses are real and describable within your constraints.

  **The 'Collapse' Decision Procedure (20-Minute Writer's Checklist)**

  1.  **Define the Subject:** Precisely *what* entity are we claiming ended?
      *   **Question:** "What specific entity is described as ending? (e.g., Palatial Administration of Mycenae, Political Hegemony of Tikal, Monolithic Statue Production on Rapa Nui, the Soviet State)"
      *   **Requirement:** The subject *must* be clearly named and defined at a specific, observable scale (polity, economic system, elite culture, specific settlement, dynasty). *Never* "civilization," "society," or "people" without extreme qualification.
      *   **Stop if:** The subject cannot be defined specifically (e.g., "Maya civilization"). Rewrite to define the specific ending phenomenon.
      *   **Handoff if:** Defining the subject inherently involves a major value judgment about what constitutes "the society" (e.g., equating elite collapse with societal death).

  2.  **Assess the Ending:**
      *   **a) Evidence Basis:** What is the *direct evidence* the subject ended?
          *   **Question:** "List the primary archaeological/historical evidence for the ending of this specific subject. Does this evidence primarily reflect the cessation of *elite activities* (monument building, inscriptions, luxury goods, central administration) or broader societal patterns (settlement abandonment, demographic decline, loss of key technologies, radical economic shift)?"
          *   **Requirement:** Explicitly note if evidence is primarily elite-focused. Acknowledge this limitation in the panel if elite evidence is the *only* basis.
          *   **Handoff if:** The interpretation of the evidence is highly contested *and* central to the claim of ending (e.g., Rapa Nui population estimates pre/post).
      *   **b) Scale & Rate:** How rapid and widespread was the ending *relative to the subject's lifespan and our narrative scale*?
          *   **Question:** "Over what timescale did the ending occur? Express in generations/centuries. Does this timescale feel 'abrupt' within the context of a 90-word panel describing the subject's lifespan (e.g., 500+ years)?"
          *   **Rule:** "Abrupt" for panel narrative = ending within **1-3 generations** (<~75-100 years) *and* affecting the core function/area of the subject. If longer, use "decline," "transformation," "fragmentation," "ended," "dissolved," "was abandoned," or "was replaced."
          *   **Stop if:** The ending process demonstrably took >100 years *and* involved significant continuity elsewhere (e.g., Maya lowland *political* collapse vs. northern/Yucatan continuity). Use neutral terms.
          *   **Handoff if:** The assessment of rate/scale is fundamentally tied to contested chronologies or interpretations of continuity.

  3.  **Assess Continuity & Survival:** Did core elements persist?
      *   **Question:** "What significant elements *survived* the ending of this specific subject? (e.g., population, language, subsistence practices, local social structures, technologies, belief systems?)"
      *   **Requirement:** Acknowledge key survivals explicitly in the panel, especially population and language/culture. This directly counters over-broad "civilization collapse" narratives.
      *   **Stop if:** The core population, language, and basic subsistence practices demonstrably continued *in the same region*. "Collapse" is almost certainly wrong for the *society*; reserve it for the specific subject defined in Q1 (e.g., "the Classic Maya political system collapsed," NOT "Maya civilization collapsed").
      *   **Handoff if:** The significance or nature of the survivals is highly contested or involves value judgments about what constitutes "core" identity.

  4.  **Interrogate Causality & Moral Framing:**
      *   **a) Causality:** What caused the ending? Is "collapse" implying a specific cause?
          *   **Question:** "Is the word 'collapse' being used to imply a specific cause (e.g., internal failure, ecological suicide, external conquest)? Does the evidence robustly support *that specific implied cause* as the primary driver?"
          *   **Requirement:** Avoid terms inherently loaded with causal implication ("destroyed itself," "ecocide," "fell") unless evidence is overwhelming and non-contested *for the specific subject*. Prefer neutral terms ("ended," "ceased," "was abandoned," "fragmented") or state cause explicitly without loaded verbs.
          *   **Stop if:** The implied cause is contested (e.g., Rapa Nui ecocide) or the evidence is ambiguous. State the ending neutrally and describe debated causes factually.
          *   **Handoff if:** Attributing primary causality involves significant value judgments (e.g., "elite failure," "social decadence") or absolving powerful actors (e.g., blaming solely "climate change" when elite decisions exacerbated vulnerability).
      *   **b) Moral Lesson:** What implicit lesson about *us* is the word teaching?
          *   **Question:** "What implicit warning or lesson for modern society is conveyed by using 'collapse' here? (e.g., 'Beware environmental limits,' 'Complexity is fragile,' 'Inequality leads to downfall') Is this gallery's purpose to teach *that specific lesson* using *this specific historical case*? Is the historical analogy robust and justified by the evidence presented?"
          *   **Requirement:** The writer must articulate the implied lesson. The panel must either:
              *   Avoid the loaded term and stick to description, *or*
              *   Explicitly state the lesson being drawn *and* justify it briefly within the evidence constraints.
          *   **Handoff if:** The appropriateness of drawing *any* contemporary moral lesson from this case is fundamentally debatable within the team, or if the lesson inherently excuses powerful actors ("collapse was inevitable").

  **Decision:** Only if the writer passes all "Stop if" points and the answers to Q1-Q4 support it, may they use "collapse" or a specific relative (fell, destroyed itself - *only* if Q4a causality is ironclad). **Otherwise, use neutral vocabulary.** "Ended," "ceased," "was abandoned," "fragmented," "transformed," "dissolved," "gave way to," "was replaced" are usually safer.

  ---

  **Running the Procedure: Four Cases**

  1.  **Bronze Age Eastern Mediterranean (Palace Economies)**
      *   Q1: **Subject:** Palace-centered administrative and economic systems (Mycenaean, Hittite, etc.). *Specific & Observable.*
      *   Q2a: **Evidence Basis:** Destruction layers at major palatial centers; cessation of Linear B; end of monumental construction; disruption of long-distance trade networks. *Primarily elite-focused, but widespread.*
      *   Q2b: **Scale/Rate:** Within 1-2 generations (c. 1200-1175 BCE). *Abrupt for panel scale.*
      *   Q3: **Continuity:** Significant population continuity (though displaced/dispersed); local languages persisted; subsistence farming continued. *But core subject (palace system) truly ended.*
      *   Q4a: **Causality:** Complex (Sea Peoples?, drought?, internal conflict?); "collapse" doesn't imply *one* specific cause here. *Acceptable.*
      *   Q4b: **Moral Lesson:** Implies complexity/fragility? Panel likely descriptive, not overtly moralizing. *Acceptable.*
      *   **Decision:** **YES, "collapse" is acceptable.** "The palatial economies and administrations of the eastern Mediterranean collapsed within a few generations around 1200 BCE, though people and local cultures persisted." *Geologist unhappy? Tough – it meets criteria. Historian accepts – subject is systems, not people.*

  2.  **Classic Maya Southern Lowlands (Political System)**
      *   Q1: **Subject:** The interconnected network of southern lowland city-states ruled by divine kings (k'uhul ajaw), characterized by monumental inscriptions, specific artistic canons, and wars/alliances. *Specific & Observable.*
      *   Q2a: **Evidence Basis:** Cessation of Long Count dates on monuments; end of royal tomb construction; abandonment of royal palaces; decline in polychrome pottery. *Primarily elite-focused.*
      *   Q2b: **Scale/Rate:** Political dissolution occurred over ~150 years (c. 750-900 CE). *Not abrupt (3+ gens).*
      *   Q3: **Continuity:** **Massive population continuity** (though some redistribution); Maya languages thrived; local communities persisted; many cultural elements continued/evolved (northern centers flourished). *Core population/culture survived robustly.*
      *   **STOP at Q3:** Core population and language demonstrably continued. **"Collapse" is FORBIDDEN for the society/language group.** *This will annoy the writers who like the drama.*
      *   **Rewrite:** Use neutral terms for the *specific subject*: "The network of southern lowland Maya city-states and their royal institutions fragmented and largely ended between 750 and 900 CE. Maya populations and cultures persisted and adapted." *Historians happy (focuses on power structures), Geologist happy (no "collapse"), Writers grumble (less dramatic).*

  3.  **Rapa Nui (Easter Island - Monolithic Statue Culture & Political Centralization)**
      *   Q1: **Subject:** The practice of large-scale moai statue carving, transport, and erection, and the centralized socio-political system enabling it. *Specific & Observable.*
      *   Q2a: **Evidence Basis:** Cessation of moai carving/transport; toppling of existing statues; abandonment of quarry/transport roads; oral traditions; *Possible* settlement pattern shifts/population decline evidence (contested). *Mix, but statue cessation is elite/ritual focus.*
      *   Q2b: **Scale/Rate:** Likely over >100 years (c. 1600-1722 CE contact). *Not abrupt.*
      *   Q3: **Continuity:** Significant population survived (despite later traumas); Rapa Nui language/culture persisted; subsistence adapted (post-statue). *Core population/culture survived.*
      *   Q4a: **Causality:** **Highly contested.** Ecocide? Internal conflict? Rat impacts? European contact? "Collapse" strongly implies ecocide/self-destruction. *Evidence NOT robust/consensus.* **STOP at Q4a.** Avoid loaded terms implying cause.
      *   Q4b: **Moral Lesson:** Strongly implies "ecocide" warning. Is this the *primary* purpose? *Risk of oversimplification.*
      *   **Decision:** **NO "collapse."** "The practice of carving and erecting massive moai statues ceased, and the centralized society that organized it transformed significantly before European contact. The causes remain debated." *Focuses on the specific ending (statues), neutral on cause, acknowledges continuity. Historian happy (no excuse for powerful? - avoids blaming "the people"), Geologist happy (no "collapse"), Visitors get correction without dry quibble.*

  4.  **Clear "Collapse" Case: The Soviet Union (1991)**
      *   Q1: **Subject:** The Union of Soviet Socialist Republics (USSR) as a sovereign federal state and its ruling Communist Party apparatus. *Specific & Observable.*
      *   Q2a: **Evidence Basis:** Formal dissolution via treaty (Belovezh Accords); resignation of Gorbachev; end of CPSU monopoly; independence declarations; withdrawal of Soviet forces. *Direct, unambiguous, systemic.*
      *   Q2b: **Scale/Rate:** **Extremely abrupt** (<1 year, arguably weeks/months for the final dissolution). *Definitely abrupt.*
      *   Q3: **Continuity:** Population continued (in successor states); Russian language dominant; many institutions/elites persisted *but* core subject (USSR state & Party) definitively ended. *Survival of components doesn't negate state collapse.*
      *   Q4a: **Causality:** Complex, but "collapse" describes the *event* without inherently blaming one cause (economic failure, nationalism, reform failure, elite defection). *Acceptable.*
      *   Q4b: **Moral Lesson:** Might imply lessons about ideology, central planning, or empire. Panel can be descriptive ("The Soviet state collapsed in 1991") without explicit moralizing. *Acceptable.*
      *   **Decision:** **YES, "collapse" is correct and usable.** "The Soviet Union collapsed abruptly in 1991, dissolving into independent republics." *Meets all criteria. Geologist might object on principle, but procedure overrules – it's objectively correct for the state entity.*

  ---

  **The Unpopular Outcome:** The **Classic Maya** outcome (forbidding "collapse") will frustrate writers used to the dramatic term. **They will be wrong** because they are conflating the end of a specific political/elite system with the end of the society and people, which the procedure (rightly) forces them to disentangle. Using "collapse" for the *polities* is still inaccurate per Q2b (rate) and risks misinforming visitors about Maya survival.

  **Where the Procedure Misfires & Can Be Gamed:**

  1.  **Defining the Subject (Q1):** A clever writer could define the subject *so narrowly* that anything ending qualifies as a "collapse" (e.g., "Collapse of the Palace of Knossos Dining Hall Pottery Style"). Conversely, defining it too broadly triggers the Q1 Stop. Requires editorial oversight on subject definition reasonableness.
  2.  **Rate Assessment (Q2b):** The 100-year/3-generation threshold is arbitrary. A writer could artificially shorten the perceived lifespan of the subject to make the ending *seem* abrupt within the panel context. Requires contextual awareness.
  3.  **Moral Lesson Dodge (Q4b):** A writer could claim "no lesson intended" while using "collapse" with its inherent dramatic/moral weight, effectively smuggling in the lesson. Requires honest engagement in Q4b.
  4.  **"Quiet" Interpretation (Q2a):** Judging how representative elite evidence is of broader societal conditions remains inherently interpretive, even with the checklist. The procedure surfaces the issue but doesn't eliminate the judgment.
  5.  **Significance Judgment:** The procedure determines *if* an ending can be called a collapse. It doesn't judge if that ending was *significant enough* to warrant a panel titled "How Societies End." This is a fundamental curatorial value judgment.

  **Residual Judgements No Procedure Can Remove:**

  1.  **What constitutes a "society" or its "end"?** (Handled via Q1/Q3 handoff/stop, but the underlying philosophical debate remains).
  2.  **The relative significance of different types of continuity/survival.** (Q3 requires acknowledgment, but judging what's "core" is value-laden).
  3.  **The validity and weight of contested evidence/interpretations.** (The procedure flags handoffs but doesn't resolve them).
  4.  **The ultimate purpose of the gallery:** Is it purely descriptive history, or is teaching cautionary lessons an inherent goal? (Q4b forces articulation but doesn't resolve the institutional mission).

  **Conclusion:** This procedure won't eliminate debate, but it will force it onto clearer ground: precise definitions, evidence scrutiny, explicit acknowledgment of limitations and continuity, and conscious consideration of moral framing. It allows "collapse" where it's truly warranted (Soviet Union) while blocking its inappropriate or misleading use (Classic Maya society, Rapa Nui ecocide). It turns an ideological argument into a structured historical analysis within your operational constraints. Expect pushback on the Maya ruling, but hold the line – it’s the right call based on the evidence and your distinctions. Good luck with the next rewrite!
