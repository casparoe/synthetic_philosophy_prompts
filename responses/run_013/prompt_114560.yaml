prompt: |-
  I teach a third-year seminar that sits between philosophy of science and econ -- 16 students, one 80-minute session, and I want to do a session on Goodhart's law that doesn't just trot out the usual Soviet nail-factory and teaching-to-the-test stories, because they've all heard those and they nod along without feeling anything. I want them to run into the thing themselves.

  Here's the specific thing I want them to feel, and it's more than "people cheat." I want them to see that a measure can stop tracking what you care about for at least four seperate reasons, and that only one of them is dishonesty. (a) The measure tracked the goal in the past only because nobody was selecting on the measure; the moment people start choosing actions to push the measure up, that old correlation is precisely the thing you've destroyed. (b) The measure is fine in the normal range, but you're now pushing it to extremes where it stops meaning anything. (c) Intervening on the measure changes the goal itself, so even a perfectly honest and totally ungameable measure would still move the target. (d) People game it, the measure-setter notices and changes the measure, the gamers adapt to the new one, and you're in an arms race with no fixed point.

  Design me the activity. Rules, roles, materials, a scoring scheme that doesnt need real money, and a timeline for the 80 minutes. Two things I care about: the collapse has to show up in what happens, not in what I say afterwards, and it shouldn't be driven only by self-interested cheating -- I want at least one round where gaming is forbidden or impossible and the measure still degrades, because the selection effect is the part they always miss. There should be a ground truth that only I can see, so that at the end I can reveal the real quality scores next to the measure and let them watch the top of the proxy ranking come apart from the top of the true ranking. And I want a round with survival pressure, so that whoever is doing well by the measure gets to keep playing and the rest get thinned out, so the population drifts even if no individual is being sneaky.

  Then a debrief that maps the moments in the game onto (a)-(d) above, one at a time, and says which round was which mechanism. Don't let the name Goodhart enter the room until the debrief. Tell me what will predictably go wrong the first time I run this and how to fix it on the fly, and be honest about which of the four the activity can't really reproduce and that I'll have to supply myself. Keep it runnable with pen and paper, no laptops.
reasoning: |-
  We are designing a classroom activity to illustrate Goodhart's law without naming it until the end. The activity should demonstrate four failure modes:
  (a) Selection effect: When selecting on the measure, the correlation breaks.
  (b) Extreme range: Pushing the measure beyond normal ranges where it was calibrated.
  (c) Target shift: The intervention changes the goal itself.
  (d) Arms race: Adaptive gaming leading to measure changes and further gaming.

  The activity will have multiple rounds, with a ground truth only the instructor sees. There will be a survival mechanism where top performers by the measure continue. We want at least one round without gaming (to show selection effect) and one with survival pressure.

  **Basic Setup:**
  - **Topic:** We'll frame it as a "Quality Assurance" task. Students are workers in a factory that produces "widgets." The widgets are actually abstract designs (e.g., drawings) that have a true quality score (ground truth) known only to the instructor.
  - **Roles:** All 16 students are workers. The instructor is the manager (and also the one who knows the ground truth).
  - **Materials:** 
    - For each student: paper, pen, and a set of rules for each round.
    - For the instructor: a rubric for ground truth scoring (kept secret until the end) and a way to quickly score (or pre-score) the widgets.

  **The Widget Design Task:**
  - Each round, students will have 5 minutes to draw a "widget" (a simple abstract design) on paper. The design must include:
    - At least one circle.
    - At least one triangle.
    - At least one straight line and one curved line.
    - The rest is up to them.

  **Ground Truth Scoring (Secret Rubric):**
  The true quality of a widget is determined by:
  - Complexity (1-5 points): More elements (shapes, lines, etc.) but not too cluttered. (Aim for a sweet spot: too simple is bad, too complex is bad.)
  - Balance (1-5 points): Symmetry and visual balance.
  - Creativity (1-5 points): Unusual but pleasing combinations.
  - Total: 3-15 points.

  The instructor will score each widget after the round (or during, if possible) without revealing the scores until the end.

  **Proxies (Measures):**
  Each round, the manager (instructor) will announce a measure (proxy) that will be used to evaluate the widgets. The top performers by that measure will survive to the next round (if we do survival) or get a reward (non-monetary, e.g., recognition).

  **Rounds Design:**
  We have 80 minutes. We'll do 4 rounds (about 15 minutes each) and then a 20-minute debrief.

  Round 1: Baseline (No gaming, no survival) - to set a correlation.
  Round 2: Selection effect (with survival) - measure is simple and correlates at baseline, but then we select on it.
  Round 3: Extreme range - push the measure to extremes where it breaks.
  Round 4: Arms race - with changing measures and adaptive gaming.

  We cannot do (c) target shift in the activity because it requires the goal to change due to the intervention, which is hard to simulate without a long-term shift in the environment. We'll have to explain that one in the debrief.

  **Round Details:**

  **Round 0 (Preparation - 5 min before start):**
  - Explain the widget design task: They have 5 minutes to draw a widget that includes at least one circle, one triangle, one straight line, and one curved line. The rest is free.
  - Tell them that the true quality is a secret and will be revealed at the end.

  **Round 1: Baseline (10 min total: 5 min drawing, 5 min scoring and discussion)**
  - **Measure:** None. They are just making a widget without any measure. 
  - **Goal:** To establish a baseline correlation between a simple observable feature and the true quality.
  - **Activity:** 
    - Students draw their widget (5 min).
    - Collect the widgets. The instructor quickly scores the true quality (secretly) and also records a simple observable: e.g., "number of shapes" (counting circles, triangles, and any other distinct shapes they drew). 
  - **Discussion (without revealing true scores):** 
    - Instructor: "In this round, we weren't measuring anything. But if we were to use a measure, say the number of shapes, how do you think it would correlate with true quality?" 
    - Let them discuss briefly. Then show a scatter plot (on board) of number of shapes vs true quality (without labeling the y-axis as true quality, but as "quality" for now) for this round. There should be a positive correlation (if we set up the rubric so that more shapes initially give higher complexity and hence higher score, up to a point). 
    - But note: We won't reveal the true scores until the end. So instead, the instructor can say: "I have a secret quality score. I will record the number of shapes for each. We'll see later how they relate."

  **Round 2: Selection Effect (15 min: 5 min drawing, 5 min scoring and survival, 5 min setup for next)**
  - **Measure:** Number of shapes (the same as in Round 1).
  - **Survival Rule:** The top 8 students (half) by the number of shapes survive to the next round. The bottom 8 are "fired" (they become observers for the next rounds, but they can still draw for learning).
  - **Announcement:** "From now on, we are using a measure to evaluate your widgets: the number of distinct shapes. The more shapes, the better. The top half by this measure will continue to the next round; the rest are out."
  - **Activity:** 
    - Students draw (5 min) knowing the measure.
    - Collect and count the number of shapes for each. Announce the top 8 (by number of shapes) and they survive. The bottom 8 are out (but they can still draw in the next round for practice, but they won't be eligible for survival). 
  - **Instructor:** Secretly score true quality for all, and note the number of shapes. 
  - **Expected outcome:** Students will draw more shapes. The correlation between number of shapes and true quality will break because:
    - Some will add many tiny, meaningless shapes (complexity without purpose, which the rubric penalizes for being cluttered).
    - The true quality scores for the top 8 by shapes might be lower on average than the top 8 by true quality in Round 1.

  **Round 3: Extreme Range (15 min: 5 min drawing, 5 min scoring and survival, 5 min setup)**
  - **Measure:** This time, we choose a measure that breaks at extremes. We'll use "number of straight lines" (or "number of circles", but let's say straight lines).
  - **Survival Rule:** The top 4 (from the 8 survivors) by the number of straight lines survive. The bottom 4 are out.
  - **Announcement:** "We have a new measure: the number of straight lines. The more straight lines, the better. Top 4 continue."
  - **Activity:** 
    - Students (the 8 survivors) draw (5 min). 
    - Collect, count straight lines, and announce the top 4. 
  - **Instructor:** Score true quality. 
  - **Expected outcome:** They will add as many straight lines as possible. But the rubric gives a maximum of 5 for complexity and balance. Too many straight lines will make the design cluttered and unbalanced, so true quality drops. Also, the measure is pushed to an extreme where it no longer correlates with quality.

  **Round 4: Arms Race (15 min: 5 min drawing, 5 min scoring and survival, 5 min setup)**
  - **Measure:** We start with one measure, but after the first drawing, we change it.
  - **Setup:** 
    - Announce: "We are using a measure of 'number of curved lines' for this round."
    - After they draw (5 min), collect and then say: "I notice that some of you are just drawing many tiny curves. That's not what we want. So we are changing the measure: now we require that curved lines must be at least 2 inches long. We will now have a second chance: redraw with this new measure, and we will count only curved lines that are at least 2 inches."
  - **Activity:** 
    - First drawing (3 min) with measure: number of curved lines.
    - Collect and then announce the change. 
    - Second drawing (2 min) with the new measure (only curves >= 2 inches). 
    - Then, from the second drawing, count the curves and take the top 2 survivors (from the 4) by the new measure.
  - **Instructor:** Score true quality for both drawings (but only the second one counts for survival). 
  - **Expected outcome:** They first draw many small curves. Then, after the rule change, they draw long curves, but that might lead to designs that are just a few long curves (low complexity and creativity). True quality may be low.

  **Debrief (20 min):**
  1. Reveal the ground truth rubric and show the true scores for all rounds. For each round, show the ranking by the proxy vs the true quality. Point out how the top by proxy was not the top by true quality, and the gap increased over rounds.
  2. Now name the four mechanisms (a, b, c, d) and ask the class to match the rounds to the mechanisms:
     - Round 2: Selection effect (a) - the measure (number of shapes) was good until we selected on it.
     - Round 3: Extreme range (b) - pushing straight lines to extremes broke the measure.
     - Round 4: Arms race (d) - changing the measure in response to gaming.
     - (c) Target shift: We didn't simulate this. Explain: "Sometimes, by focusing on a measure, you change the goal itself. For example, if we measure scientific progress by publications, we might get more publications but less real breakthroughs. The goal of science might shift from understanding to publishing. We didn't have that in the game, but it happens in real life."

  3. Then, introduce Goodhart's law: "What we've seen is a phenomenon known as Goodhart's law: When a measure becomes a target, it ceases to be a good measure."
  4. Discuss real-world examples and how to mitigate.

  **What might go wrong:**
  1. **Time:** 80 minutes is tight. The drawing and scoring must be quick. 
     - **Fix:** Pre-draw some examples to show, and have a TA if possible. Or, for scoring, do it quickly during the round (but then you can't observe). Alternatively, have a very simple rubric that you can score at a glance.

  2. **Rubric subjectivity:** The true quality might be seen as arbitrary.
     - **Fix:** Make the rubric as objective as possible (e.g., count elements, symmetry) and explain it clearly in the debrief.

  3. **Students not gaming in Round 2:** They might not add many shapes because they don't understand the survival pressure.
     - **Fix:** Emphasize that only the top half survive, so they must maximize the measure.

  4. **Round 3 extreme measure:** They might not push to an extreme if they think it will hurt quality. But we want them to do so because of the survival pressure.
     - **Fix:** Clearly state that the measure is the only thing that matters for survival.

  5. **Round 4 arms race:** The change of measure might confuse them. 
     - **Fix:** Explain clearly: "We are changing the measure because we noticed that the current one is being gamed."

  **Adaptations for no real money:**
  - Use non-monetary rewards: survival in the game, public recognition (e.g., "star workers"), or just the fun of competing.

  **Materials:**
  - Paper and pens for everyone.
  - A whiteboard for the instructor to record the proxy scores and survival status.
  - A secret rubric for the instructor.

  **Timeline:**
  - 0-5 min: Introduction and Round 0 (if needed) or Round 1 instructions.
  - 5-15 min: Round 1 (drawing and initial discussion).
  - 15-30 min: Round 2 (drawing, scoring, survival announcement).
  - 30-45 min: Round 3 (drawing, scoring, survival).
  - 45-60 min: Round 4 (two drawings and scoring).
  - 60-80 min: Debrief (reveal true scores, discuss mechanisms, introduce Goodhart).

  This design hits (a), (b), and (d). For (c), we acknowledge it and explain in the debrief. The collapse of the measure is visible in the degradation of true quality among the survivors and in the divergence between proxy and true rankings.
answer: |-
  ### Activity Design: "Widget Factory Challenge"

  I'll design a pen-and-paper activity simulating a widget factory where students play "designers" trying to maximize a visible proxy measure (e.g., "Complexity Score"), while you, as the hidden "Quality Auditor," track the true quality. The goal is to create experiential moments for all four Goodhart failure modes—especially (a) selection effects, which students typically overlook. The activity uses survival mechanics (bottom performers eliminated each round) to force selection pressure. Gaming is explicitly banned in Round 2 to isolate mechanism (a).

  **Core Mechanics**  
  - **Widgets**: Abstract drawings students create on paper.  
  - **Proxy Measure**: Publicly visible score based on simple, quantifiable features (e.g., shapes, lines).  
  - **True Quality**: Secret score only you calculate (using a rubric), revealed at the end.  
  - **Survival Pressure**: Each round, the lowest-performing designers by the proxy are "fired" (become observers).  

  **Materials**  
  - Students: Paper, pens, rulers (for straight lines), handout with round rules.  
  - Instructor: Whiteboard (to track proxy scores), secret rubric (for true quality), timer.  

  **Secret Rubric for True Quality (Ground Truth)**  
  Score each widget 0–10 based on:  
  1. **Balance** (0–4 pts): Symmetry and even spacing of elements.  
  2. **Originality** (0–3 pts): Unusual/creative combinations of shapes.  
  3. **Craftsmanship** (0–3 pts): Neatness and precision (e.g., smooth curves, straight lines).  
  *No student sees this rubric until the debrief.*  

  **Timeline (80 Minutes Total)**  
  ---  
  ### **Phase 1: Setup (5 min)**  
  - **Rules**: Explain the factory analogy:  
    > "You’re widget designers. Each round, you’ll have 7 minutes to draw a widget—an abstract design using shapes and lines. I’ll score your widget using a public *proxy measure* (e.g., ‘number of shapes’). The lowest scorers by this proxy are fired each round. Your true goal is to maximize *quality*, but I’m the only one who can see true quality—I’ll reveal it at the end. Gaming the measure (e.g., intentional cheating) is forbidden and will get you fired."  
  - **Assign Roles**: All 16 students start as designers.  

  ### **Phase 2: Rounds (60 min)**  
  **Round 1: Baseline—Establish Correlation (15 min)**  
  - **Proxy Measure**: "Number of distinct shapes" (e.g., circles, squares, triangles; min. size 1cm).  
  - **Rules**: "Draw a widget with shapes. No survival pressure—nobody is fired. Just make a high-quality widget."  
  - **Activity**:  
    - 7 min: Students draw.  
    - 5 min: You collect widgets, count shapes (proxy), and secretly score true quality.  
    - 3 min: Plot proxy vs. true quality on the whiteboard (anonymized, e.g., "Designer A: Proxy=8, Quality=?"). Show a rough correlation (most high-proxy widgets have high true quality).  
  - **Why**: Creates the illusion the proxy works. Students see the initial link.  

  **Round 2: Selection Effect—No Gaming Allowed (15 min)**  
  - **Proxy Measure**: Same as Round 1 ("number of distinct shapes").  
  - **Rules**: "Maximize shapes. Gaming is forbidden—no tiny/dishonest shapes. Bottom 8 designers by proxy are fired (become observers)."  
  - **Activity**:  
    - 7 min: Students draw under survival pressure.  
    - 5 min: You calculate proxy scores and fire the bottom 8. Secretly score true quality.  
  - **Predicted Collapse**:  
    - Students add *more* shapes honestly (e.g., extra circles).  
    - But this crowds the design, hurting balance/craftsmanship. True quality drops for high-proxy widgets.  
    - *Key Insight*: Even with no cheating, the proxy fails because optimizing it breaks the original correlation (mechanism a).  

  **Round 3: Extreme Range—Pushing to Absurdity (15 min)**  
  - **Proxy Measure**: "Total length of straight lines in cm" (require min. 3 straight lines).  
  - **Rules**: "Maximize straight-line length. No gaming. Bottom 4 of the remaining 8 designers are fired."  
  - **Activity**:  
    - 7 min: Students draw (survivors from Round 2 only).  
    - 5 min: Calculate proxy (measure lines with ruler), fire bottom 4. Secretly score true quality.  
  - **Predicted Collapse**:  
    - Students draw long, elaborate lines, but designs become chaotic (e.g., spaghetti-like tangles).  
    - True quality plummets as balance/originality suffer (mechanism b).  

  **Round 4: Arms Race—Adaptive Gaming (15 min)**  
  - **Proxy Measure**: Starts as "Number of closed shapes" (e.g., circles, polygons), but changes mid-round.  
  - **Rules**:  
    > "Start with 'number of closed shapes.' Gaming is now allowed. After 3 minutes, I’ll inspect designs and announce a new measure if I see gaming."  
  - **Activity**:  
    - Min 0–3: Students draw.  
    - Min 3: "I see many tiny, sloppy shapes! New measure: 'Number of *neat* closed shapes' (shapes must be precise, no gaps)."  
    - Min 3–7: Students adjust designs.  
    - Min 7–10: Calculate proxy (count "neat" shapes), fire 2 of the 4 survivors. Secretly score true quality.  
  - **Predicted Collapse**:  
    - Students initially draw many quick, messy shapes. After the rule change, they focus on perfecting fewer shapes, but neglect overall design. True quality stays low as gamers adapt (mechanism d).  

  ### **Phase 3: Debrief (15 min)**  
  1. **Reveal Ground Truth** (5 min):  
     - Show the true quality rubric.  
     - Display rankings: For each round, compare the top 3 by proxy vs. top 3 by true quality (e.g., "Round 2 Proxy Winners: True Quality = 4, 3, 2; True Winners: 7, 6, 5").  
     - Students will see proxies and true quality diverge dramatically, especially in Rounds 2–4.  

  2. **Map Mechanisms** (7 min):  
     > "Today, you experienced *why* measures fail. Not just from cheating, but from four mechanisms:"  
     - **Round 2**: "When you optimized shapes honestly, the measure *still* failed. Why? **The measure worked only when no one was using it**—optimizing broke the link (a: selection effect)."  
     - **Round 3**: "Pushing straight lines to extremes made designs absurd. **Measures fail when stretched beyond their normal range** (b: extremes)."  
     - **Round 4**: "I changed the measure, you adapted, and we spiraled. **Measures fail when rules and behaviors escalate** (d: arms race)."  
     - **Missing Mechanism (c)**: "We didn’t simulate one: **When the measure changes the goal itself**. Example: Paying teachers for test scores might make them ‘teach to the test,’ altering education’s purpose. I’ll add real examples now." (Share 1–2 cases, e.g., KPIs altering workplace culture.)  

  3. **Name and Reflect** (3 min):  
     > "This is **Goodhart’s law**: ‘When a measure becomes a target, it ceases to be a good measure.’ You felt how it’s deeper than cheating—it’s about systems self-destructing under pressure."  

  ---  
  ### **Predictable Problems & Fixes**  
  1. **Problem**: Round 2 fails if students don’t add enough shapes (breaking the selection effect).  
     **Fix**: Before the round, warn: "Only the top 8 survive—push hard within the rules." Show an example of a "high-shape, honest" design from Round 1.  

  2. **Problem**: Scoring true quality takes too long.  
     **Fix**: Use a simplified rubric (e.g., 0–5 scores) and pre-score during drawing time. Sacrifice detail for speed—focus on relative rankings.  

  3. **Problem**: Arms race (Round 4) feels unfair or confusing.  
     **Fix**: Emphasize mid-round: "This is intentional! Real regulators *do* change rules when gamed." Contrast with Round 2 ("no one cheated, but it still broke").  

  4. **Problem**: Weak correlation in Round 1.  
     **Fix**: Pre-seed examples—show 2–3 designs where high shapes = high quality (e.g., neat, balanced shapes). If needed, gently "adjust" scores to show the trend.  

  ### **What the Activity Can’t Simulate**  
  - **Mechanism (c) - Target Shift**: Hard to replicate without long-term behavioral change. As noted, you’ll supplement this with real-world examples (e.g., "In healthcare, optimizing for ‘patient throughput’ might shift hospitals away from complex care").  

  ### **Why This Works**  
  - **Selection effect (a) is central**: Round 2 forces honest optimization that *still* fails, making students feel the paradox.  
  - **Ground truth revelation**: Showing proxy vs. true rankings creates an "aha!" moment.  
  - **No laptops, minimal prep**: Uses only paper/pens and your whiteboard.  

  Run this as a fast-paced, experiential game—the debrief ties it all together. Students will leave feeling the systemic traps, not just the cheating.
