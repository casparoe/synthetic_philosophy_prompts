answer: |-
  ### Activity Design: "The Law-Maker's Dilemma"

  #### **Core Structure**
  - **Groups**: Divide 14 students into 4 groups (3 groups of 3, 1 group of 4).  
  - **Materials per Group**:
    - **Dossier 1**: A complete observational history of a fictional universe (e.g., particle interactions in a 10-step timeline).  
    - **Deck of 10 Candidate Regularities**: True/false statements about the universe (e.g., "All type-X particles attract type-Y particles").  
    - **Blank cards** for groups to write their own axioms.  
    - **Scoring Rules**:  
      - **Coverage**: +1 point per *falsifiable* regularity covered (must rule out at least one event *not* in the dossier).  
      - **Cost**: -1 point per axiom in the law-book (max 5 axioms).  
      - **Goal**: Maximize score (coverage minus cost).  
    - **Dossier 2**: Same observations as Dossier 1 but with a hidden twist (two versions: **A** and **B**).  
    - **Primitive Law-Making Token**: A physical token representing a "law-making predicate" (cost: 3 points).  

  #### **Fictional Universe & Dossiers**  
  - **Universe Setup**:  
    - Particles exist in a void with properties (color, charge) and interactions (attract/repel).  
    - **Dossier 1 Example**:  
      - *T1*: Particle A (blue, +charge) and Particle B (red, -charge) attract.  
      - *T2*: Particle C (blue, +charge) and Particle D (red, -charge) attract.  
      - ...  
      - *T10*: Particle Y (blue, +charge) and Particle Z (red, -charge) attract.  
    - **Key Regularity**: "All blue +charge particles attract red -charge particles" (true in Dossier 1).  
  - **Deck of Candidate Regularities**:  
    - 7 true (e.g., "Blue particles never repel red particles"), 3 false (e.g., "All particles attract at T1").  
  - **Dossier 2 (Identical Observations, Hidden Stories)**:  
    - **Version A (Non-Law)**: The regularity holds by coincidence (e.g., blue/red attraction is random; an intervention changing particle color would break it).  
    - **Version B (Law)**: The regularity is sustained by a deeper mechanism (e.g., charge essence dictates attraction; interventions preserve it).  

  #### **Timeline (90 Minutes)**  
  1. **Intro (5 min)**:  
     - Explain the goal: "Build a law-book capturing the universe’s rules. Maximize your score. Remember: coverage requires falsifiability!"  
     - Assign groups and hand out **Dossier 1 + Regularity Deck**.  

  2. **Round 1: Dossier 1 (20 min)**:  
     - Groups create a 5-axiom law-book.  
     - **Example Output**:  
       - Axioms: "Blue +charge attracts red -charge" (+1 coverage), "All attractions occur at even times" (+1 coverage).  
       - Score: 2 covered regularities - 2 axioms = **0 points**.  

  3. **Reveal & Round 2: Dossier 2 (25 min)**:  
     - **Staging**:  
       - Collect Round 1 law-books. Redistribute **Dossier 2** (half groups get Version A, half Version B—*don’t reveal differences yet*).  
       - Announce: "This is a *new* universe with the *same* observations. Build a new law-book."  
     - Groups repeat the task (most will copy Round 1).  
     - **Reveal the Twist**:  
       - After 15 min, announce: "Despite identical events, these universes differ fundamentally." Hand out **hidden story slips**:  
         - **Version A Slip**: "Attraction is coincidental. Change a particle’s color, and it breaks."  
         - **Version B Slip**: "Attraction is essential. Change color, and it holds."  
       - Ask: "Why did your law-book fail to distinguish these? What’s missing?"  

  4. **Final Round: Primitive Law-Maker (25 min)**:  
     - Introduce the **primitive token** (cost: 3 points).  
     - **Task**:  
       - Groups revise one law-book (A or B) using the token.  
       - Assign the token to 1–2 axioms, justifying *why* (e.g., "This regularity is simple and explanatory").  
       - **Rules**: No intuition-based claims (e.g., "It feels fundamental").  
     - **Example**:  
       - Token assigned to "Blue +charge attracts red -charge" in Version B: "This explains *why* interventions fail to break it."  
       - Score: 2 covered - 2 axioms - 3 token = **-3 points**.  

  5. **Debrief (15 min)**:  
     - **Map to Metaphysical Views**:  
       - **Regularity View (Humean)**: "Your initial law-book treated laws as the *best summary* of events. But identical events in A/B exposed the problem: can’t distinguish laws from accidents. Best-system accounts (Lewis) struggle with counterfactuals."  
       - **Non-Humean Views**:  
         - **Armstrong’s Universals**: "The token acts like a second-order relation (N(F,G)). You paid a cost to add primitive ‘metaphysical glue’—but how do you *know* where to apply it without circularity?"  
         - **Essentialism**: "Assigning the token to Version B mirrors deriving laws from property essences (e.g., charge *must* attract). But without access to essences, it’s unverifiable."  
     - **Core Insight**: Laws-as-regularities fail under intervention; non-Humean views add primitives but face justification problems.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1**: Groups miss falsifiability.  
    - *Fix*: Give an example pre-activity: "‘All particles exist’ isn’t falsifiable—it rules out nothing missing from the dossier."  
  - **Problem 2**: Groups assign the primitive token arbitrarily.  
    - *Fix*: Intervene during Round 3: "Challenge each other: Does your justification *only* work for this universe?"  
  - **Problem 3**: Students confuse Dossier 2’s hidden stories.  
    - *Fix*: Use color-coded slips (red for A, blue for B) and emphasize: "The events are identical; the difference is in what *would* happen under intervention."  

  ---

  ### **Limitations & Failure Points**  
  - **Unreproducible Element**: The activity *cannot* simulate **inductive uncertainty**. Real laws predict the future; here, dossiers are complete histories. *You must supplement*: "In reality, we generalize from partial data—Hume’s problem of induction."  
  - **When to Abandon**: If students lack formal logic skills, switch to a **thought-experiment discussion** (e.g., compare "All gold spheres <1km" (accident) vs. "All uranium spheres <1km" (law)).  
  - **Likely Failure Point**: The abstract scoring may overwhelm. Mitigate with a **practice dossier** (e.g., a 3-step universe) in the intro.  

  This design forces students into the identification problem: same events, divergent laws. The token makes non-Humean "primitives" tangible, setting up your lecture on solutions.
