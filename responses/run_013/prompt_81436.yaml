    Then we debrief by mapping to philosophical views.

  Debrief:

  - The identification problem: we cannot tell from the events alone which regularities are laws and which are accidents because two universes can have the same events but different laws (different under interventions).

  - The two main approaches:
    A. Regularity view (Humean): laws are just the best summary of the events (best system: most informative and simplest). In the first round, they were doing this. The scoring metric is a simple version of best system. But then we saw that the same events can have two different underlying realities. The Humean says: there is nothing more, so the laws are the same in both universes because the events are the same. But then they cannot account for the counterfactual difference.

