prompt: |-
  I teach a 90-minute session of a third-year metaphysics seminar (14 students) on laws of nature, and I want them to run into the identification problem themselves before they hear anyone's proposed solution. Design a runnable activity, not a lecture, and no reading list.

  Build it around the following material, which I will supply to the groups. Each group receives a dossier for a small fictional universe: a complete list of everything that happens in it, together with a deck of candidate regularities. The group must write a law-book of at most five axioms, scored by a metric I stipulate — coverage counts only regularities that rule out at least one observation the dossier does not contain, and every axiom costs one point. I will then hand out a second dossier whose observation list is identical but whose underlying story differs: in one, the striking regularity is sustained by something that would break under intervention; in the other, it holds by coincidence. The groups produce a law-book for each. In a final round they may buy a primitive law-making predicate at a cost, and must justify which regularities receive it without simply restating their intuitions.

  Give me the rules and materials, a timeline for the 90 minutes, the staging of the reveal, and a debrief that maps what happens onto the choice between treating laws as the best summary of what happens and treating them as something over and above the regularities — including the views that posit a second-order relation between universals and those that derive laws from the essences of properties. Say what will predictably go wrong the first time I run it and how to handle it, and be frank about which feature of the debate the activity cannot reproduce and I must supply myself. Close with a note on which consideration would lead you to abandon this design for a different one, and where the design is most likely to fail.
reasoning: |-
  We are designing a 90-minute seminar activity for 14 students on the laws of nature, focusing on the identification problem. The goal is for students to encounter the problem themselves before being introduced to solutions.

  Activity Structure:
  - Groups: 14 students divided into 4 groups (3 groups of 3 and 1 group of 5, or adjust as needed). Each group gets a dossier for a fictional universe.
  - Materials per group:
    - Dossier 1: A complete list of everything that happens in a small fictional universe (e.g., a grid of cells with states changing over discrete time steps, or a set of particle interactions in a very simple world).
    - A deck of candidate regularities (some true, some false, some that are accidentally true but not lawlike).
  - Task 1: Write a law-book of at most five axioms. The scoring metric: 
      - Coverage: Counts only if the regularity rules out at least one observation that the dossier does not contain (i.e., it must be falsifiable in principle). 
      - Cost: Every axiom costs one point. So the score is (number of covered regularities that meet the criterion) minus (number of axioms). They should aim for a high score.

  - Then, the instructor hands out a second dossier for the same universe but with a twist: 
      - Two versions: 
          Version A: The striking regularity is sustained by something that would break under intervention (so it's not a law, just a coincidence).
          Version B: It holds by coincidence (so it's not a law, but it happens to hold in the data).
      - But note: the observation list in the second dossier is identical to the first. The difference is in the underlying story (which the students don't see until after they write the law-book for the second dossier?).

  However, the second dossier is for a different universe? Let me reread: "a second dossier whose observation list is identical but whose underlying story differs". So the same set of events, but one has an underlying mechanism that makes the regularity non-robust (so it's not a law) and the other has a mechanism that makes it robust? But the students don't see the mechanism, only the events? 

  The twist: The second dossier has the same events as the first, so the same regularities hold. But then the groups must write a law-book for this new dossier? But it's the same events? That seems odd. 

  Alternatively, the second dossier is for a different universe that happens to have the same set of events? Then the groups are to write a law-book for the second universe (with the same events) and then we reveal the underlying stories? 

  But the problem: we want them to see that two universes can have the same events (same regularities) but differ in what is a law. So:

  - The first dossier: Universe Alpha, events E.
  - The second dossier: Universe Beta, events E (same as Alpha) but with a different underlying structure that makes some regularity in E non-lawlike (or vice versa).

  But then the groups write a law-book for the first dossier (Universe Alpha) and then for the second dossier (Universe Beta). Since the events are the same, they might write the same law-book. Then we reveal that in one universe, a certain regularity is a law, and in the other it isn't, even though the events are the same? But how? The events are the same, so the regularities are the same. The difference is in counterfactuals: in one universe, if you were to intervene, the regularity would break, in the other it wouldn't. But the dossier only contains the actual events.

  This is the key: the dossier only contains the actual events. So the groups cannot tell from the events alone whether a regularity is a law or an accident. They will write the same law-book for both dossiers? Then we reveal the underlying story and they see that one of the regularities they included as a law is actually not a law in one of the universes? 

  But then the problem: they have no way to know from the events alone. That's the identification problem.

  So the activity:

  1. Groups get Dossier 1 (Universe Alpha) and write a law-book (5 axioms max) for it. They are scored on coverage and simplicity (number of axioms). They turn in their law-book and get a score.

  2. Then they get Dossier 2 (Universe Beta) which has the same list of events. They write a law-book for Universe Beta. They will probably write the same law-book because the events are the same.

  3. Then we reveal the underlying stories for both universes. In Universe Alpha, a particular regularity (say, "All particles of type A are red") is a law because it is part of the fundamental structure. In Universe Beta, the same regularity holds in the events we observed, but it is a coincidence (maybe because by chance every A particle was red, but there is no law forcing it). 

  4. Then we ask: but your law-book for both was the same? How can we tell the difference? That's the identification problem.

  Then, we move to the final round:

  5. The groups are told that they can now buy a primitive law-making predicate (call it "N(F, G)" for "F-ness is nomically necessitated by G-ness", or something) at a cost (say, 3 points). They must then assign this predicate to some of the regularities (i.e., to some of the axioms in their law-book) and justify why they assign it to some and not others. They cannot simply say "it feels like a law"; they must give a reason (e.g., because it is simple, because it is explanatory, etc.). 

  6. Then we debrief.

  Timeline for 90 minutes:

  - 0-5 min: Introduction and grouping.
  - 5-20 min: Groups work on Dossier 1 and produce a law-book. (15 min)
  - 20-25 min: Groups report their scores and one group shares their law-book. (5 min)
  - 25-40 min: Groups get Dossier 2 (same events) and write a law-book for it. (15 min) They are told that it's a different universe but the events are the same. They may be puzzled. 
