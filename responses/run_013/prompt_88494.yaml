prompt: |-
  I'm a graduate student splitting my time between a philosophy of mind seminar and a course on criminal procedure, and I keep running into the fact that the law takes a very definite view about where a person's memory stops and the rest of the world begins — a view that nobody in either field seems willing to state, let alone defend. Look at how three situations are handled. First, the passcode: several state courts have held that the privilege against compelled self-incrimination bars the state from forcing a suspect to produce or type the passcode to his own phone, because the act of producing it is testimonial — it tells the government that he knows the code, that the phone is his, that he can get into it. Yet the same courts have been nearly untroubled by orders to press a registered finger to the sensor or hold a face up to the camera, reasoning that a fingerprint or a face is a physical fact about the body, like a blood sample or a handwriting exemplar, and not a communication at all. Second, the container: the Supreme Court has said that a modern phone is not just another container to be opened and rummaged through, and that a warrant is generally required to search one — while the border-search exception lets agents go through a traveler's device at the border without a warrant, with the lower courts split only over how far a forensic examination may go. Third, the copy: when the same notes, contacts, and photographs also live on a company's servers, the government will often simply ask the company, and nobody is compelled to do anything.

  What I want is not the constitutional question but the philosophy underneath it. Assume, for the sake of the exercise, that the extended mind thesis is at least defensible in something close to its original form — that a device which is reliably available, habitually relied on, and endorsed as a source of information is part of the cognitive system doing the person's remembering, no less than the hippocampus is. Under that assumption, what view of memory does the doctrine above presuppose? Is it a skull-bound view, on which whatever lies inside the body is mind and whatever lies outside is property? Or is the operative line not location but the difference between compelling a mental act and seizing a physical thing — in which case the passcode cases and the fingerprint cases are not in tension at all, and the practice is committed to far less than it appears to be? Reconstruct the implicit theory as charitably as you can, then say which rival views it genuinely rules out, which it merely sits comfortably with, and where it is simply underdetermined, so that two or three quite different theories of mind would license exactly the same decisions. I also want you to take seriously the thought that the doctrine is not one commitment but two that happen to coincide on the cases courts have seen so far: the testimonial rationale is about compelled acts, the biometric rationale is about the surface of the body, and a phone that unlocks by proximity to a watch, or stores its own passcode in a manager app, pulls the two apart. Finally, if the extended mind thesis were treated as a premise rather than a curiosity, say concretely what would have to change: whether the passcode protection would extend to the device itself and to its cloud copy, whether the biometric rule would swallow the passcode rule, or whether the whole area would have to be reframed around the voluntariness of the act rather than the location of the information. Assume a reader who knows the extended mind literature and wants no bibliography; argue rather than cite, and flag uncertainty rather than invent a case.

  Please structure the response as follows, in this order and at roughly these lengths:

  1. The doctrine's implicit view of memory — about 300 words. State the theory the practice commits it to, in its own terms, before evaluating it.
  2. Strict presupposition versus comfortable fit — about 250 words. Separate what the practice cannot do without from what it merely happens to fit, and say which parts would survive the rejection of the implicit theory.
  3. What it rules out — about 250 words. Name the rival views of memory or cognition that the practice is inconsistent with, and for each say whether it is excluded by the doctrine's logic or only by its habits.
  4. Where it is underdetermined — about 250 words. Identify the decisions that several incompatible theories would license equally well, and say what further case or question would force the doctrine to choose.
  5. The two rationales, pulled apart — about 250 words. Test the testimonial rationale and the biometric rationale against a case where they diverge, and say which one the practice is actually tracking.
  6. What the extended mind thesis would change — about 350 words. Concrete consequences for passcodes, fingerprints, border searches, and cloud copies, followed by a two- or three-sentence bottom line on whether the practice needs a view of the mind at all or could be rebuilt without one.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating interdisciplinary puzzle about how legal doctrines implicitly conceptualize memory and cognition, particularly when juxtaposed with the extended mind thesis. They've structured their query with remarkable precision, so I'll need to meet that rigor while maintaining philosophical depth.

  First, I consider the core tension they highlight: the law treats passcodes as protected mental acts but biometrics as physical evidence, while simultaneously viewing phones as special containers but cloud data as corporate records. The user wants this analyzed through an extended mind lens without constitutional debates. 

  As I prepare to reconstruct the doctrine's implicit view of memory, I note it hinges on three distinctions: mental/physical acts, internal/external locations, and voluntary/involuntary production. The testimonial rationale protects conscious recollection but not physical features - a view that maps neatly onto internalist cognitive theories. This seems foundational to current doctrine.

  For the "strict presupposition vs comfortable fit" section, I recognize the physical/mental act distinction as indispensable to current rulings. Even if courts adopted embedded cognition (which denies intracranialism but keeps computation internal), most decisions could stand. Only extended mind theories demanding parity with biological memory would directly conflict.

  When examining what the practice rules out, I see it clearly excludes externalist views where mental states extend into devices. Cases like cloud data access would become problematic under strong extended mind interpretations. But the doctrine's habits - like treating phones as containers - seem more culturally contingent than logically necessary.

  The underdetermination analysis reveals interesting gaps. Fingerprint cases don't logically require internalism; they could be justified purely by the non-testimonial nature of physical acts. A case involving implanted authentication chips would force courts to choose between location-based or act-based reasoning.

  Testing the two rationales with proximity unlock scenarios, I find courts would likely prioritize the testimonial rationale. Compelling someone to wear a watch near a phone feels different from passive biometric scans, suggesting the mental act principle runs deeper than body-surface logic.

  Finally, applying extended mind theory as premise would revolutionize doctrine: passcodes and devices merge into protected "mental territory," biometrics might require case-by-case assessment of integration, and cloud copies could demand new access paradigms. Ultimately, the practice might survive by refocusing exclusively on compulsion - but this would require abandoning the very mind/world distinction it currently assumes.

  Throughout, I maintain the user's requested structure while ensuring each section builds on the last. The goal is to honor both their philosophical acuity and their practical interest in legal consequences.
answer: |-
  Here’s a reconstruction of the implicit theory of memory in criminal procedure doctrine, its commitments, tensions, and potential evolution under the extended mind thesis:

  ### 1. The Doctrine’s Implicit View of Memory (300 words)  
  The doctrine presupposes a **dualist, internalist view of memory**:  
  - **Memory is strictly intracranial and process-bound**. Remembering is an internal mental *act* (recalling information), while the *products* of memory (e.g., written passwords, stored photos) are external artifacts. The Fifth Amendment protects against **compelled mental acts** (testimony) but not against surrendering pre-existing physical evidence.  
  - **The body is a privileged boundary**. Bodily features (fingerprints, faces) are "physical facts" distinct from cognition. Even if biometrics grant access to memory-laden devices, their production isn’t testimonial because it requires no cognitive effort—akin to providing a key.  
  - **External storage is property, not mind**. Phones are "containers" (albeit uniquely sensitive ones) because they hold records *of* thoughts, not thoughts themselves. Cloud copies are third-party records, further externalizing memory beyond self-incrimination concerns.  

  This view treats memory as **internal states accessed via volitional recall**, contrasting with **passive bodily traits** and **static external records**. The doctrine’s coherence relies on three distinctions: (1) mental act vs. physical surrender, (2) interior (biological) vs. exterior (artifactual), and (3) self-generated testimony vs. independently existing evidence.

  ### 2. Strict Presupposition vs. Comfortable Fit (250 words)  
  **Strictly required**:  
  - The **mental/physical act distinction**—compelling cognitive labor (recalling a passcode) is testimonial; exploiting physical traits (fingerprints) is not. Without this, passcode protections collapse.  
  - The **body as a non-testimonial zone**—bodily features are "givens," not communications.  

  **Comfortably fits, but not essential**:  
  - Internalism (mind as skull-bound). The doctrine *could* survive if memory were seen as embedded in (but not extended into) devices. For example, viewing phones as tools *for* memory rather than *as* memory might still uphold current distinctions.  
  - Container logic. Treating phones as special property aligns with but doesn’t require internalism; even under extended mind, one might argue warrants balance privacy vs. state interest.  

  **Survives rejection of internalism**: The core act-based distinction (compelling cognition vs. seizing evidence) endures. If courts reframed memory as extended, they might still protect *volitional* mental acts (e.g., recalling a passcode) while allowing seizure of devices—but this would strain consistency.

  ### 3. What It Rules Out (250 words)  
  - **Strong extended mind thesis (EMT)**: Doctrine is logically inconsistent with EMT. If a phone *is* part of memory, biometric access compels testimonial self-incrimination by exposing cognitive states—yet courts permit it. This exclusion stems from doctrine’s logic (body as non-testimonial).  
  - **Embodied cognition**: If cognition inherently depends on the body, fingerprints—as biological extensions—should be testimonial. Doctrine excludes this via **habit**, not logic: it classifies biometrics mechanistically ("physical fact"), ignoring their role in cognitive access.  
  - **Externalist functionalism**: The view that mental states are defined by function, not location. Doctrine rules this out **logically** by privileging location (body/internal vs. external) to define testimony.  

  **Not ruled out**:  
  - Embedded cognition (tools scaffold but aren’t part of mind). Doctrine’s property/container framing aligns here.  
  - Neuroreductionism (memory as solely neural). Doctrine presupposes but doesn’t require this.

  ### 4. Where Underdetermined (250 words)  
  The doctrine is **underdetermined** in biometric cases. Two incompatible theories license current rulings:  
  - **Internalism**: Biometrics aren’t testimony because they’re bodily, not mental.  
  - **Act-focused functionalism**: Biometrics aren’t testimony because no cognitive act is compelled.  

  A case forcing a choice: **compelled use of a brain-computer interface (BCI)** to unlock a device. If courts forbid this as testimonial, they prioritize *mental acts* over location. If they allow it (as "physical" brain data), they privilege *biological internality*. Similarly, **implanted authentication chips**: Is activating one via thought a mental act? Is its data a "physical fact"? Current doctrine hasn’t resolved whether the body/mind boundary or act/object distinction is foundational.

  ### 5. The Two Rationales, Pulled Apart (250 words)  
  Test the divergence: **a phone unlocking via proximity to a paired watch**.  
  - **Testimonial rationale**: Compelling a suspect to wear the watch near the phone *might* be testimonial—it implies knowledge of the pairing and control over the device.  
  - **Biometric rationale**: The watch isn’t a body part; its use isn’t a "physical fact."  

  **What courts would likely do**: They would prioritize the **testimonial rationale**. Compelling the act of wearing the watch—like typing a passcode—requires volitional cooperation revealing knowledge. This suggests the practice is *more committed to protecting mental acts* than to the body as a sacred boundary. If courts instead allowed compulsion (analogizing the watch to a key), they would reveal a deeper commitment to the **body/property dichotomy**. The biometric cases are likely vestiges of this dichotomy, not its core.

  ### 6. What Extended Mind Thesis Would Change (350 words)  
  If EMT were adopted:  
  - **Passcodes/Devices**: Passcode *and* phone become protected as cognitive extensions. Forcing access (via passcode *or* biometrics) testifies to control over one’s mind. **Biometrics would "swallow the passcode rule"**—both compel exposure of mental states.  
  - **Cloud Copies**: If integrated into habitual use (e.g., auto-synced photos), cloud data could be seen as extended memory. Access demands might require warrants with heightened scrutiny, not mere subpoenas to providers.  
  - **Border Searches**: Forensic phone searches could require probable cause, not routine border exceptions. A phone isn’t a suitcase but a "digital limb."  
  - **Biometrics**: Unlocking via fingerprint would require the same protections as passcodes—both access extended mind. *However*, if biometrics are treated as passive (e.g., seized while unconscious), they might remain non-testimonial under an act-focused EMT.  

  **Bottom line**: The doctrine *could* be rebuilt around **voluntariness of the act** (compelled mental labor vs. passive evidence seizure) without referencing mind/body boundaries. This reframing would protect against forced self-incrimination while accommodating EMT—but it would collapse key distinctions (passcode vs. fingerprint) and expand Fifth Amendment scope. Conversely, retaining current rules under EMT would require denying that devices are *constitutively* part of memory, instead treating them as mere tools. **The practice implicitly needs a view of the mind to justify its distinctions; abandoning it would force a foundational shift toward pure act-based analysis.**
