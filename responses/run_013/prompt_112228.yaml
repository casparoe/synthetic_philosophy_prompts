prompt: |-
  I teach a grad seminar on AI safety and I want a case that shows my students exactly where the debate proposal can come apart — without them being able to just recite the usual "the judge can verify, so honesty wins" line. So build me a thought experiment: a single, specific debate in which the honest debater loses to the deceptive one even though the judge is competent, unbiased, patient, and both debaters get equal compute. I'll be strict about the specs. The question on the table has to have one determinate true answer. The deceptive debater must never assert anything false — it wins by cherry-picking genuinely real evidence and letting the judge draw the wrong generalization. The judge must not be fooled by anything they could catch on reflection. No omniscience, no lie detectors, no rule-breaking, nothing science-fictional. And the failure can't be patchable just by handing the judge more time — I want it to come from a mismatch between the kind of case the truth actually requires and the heuristics a real judge can run reliably. Keep the whole scenario to a paragraph, then give me:

  Setup — the question, the two debaters, the judge, the budget (short paragraph).
  The debate — what each side actually says, roughly two exchanges each (300 words).
  Why the judge rules wrong — step by step (200 words).
  What's doing the work — the one structural feature that makes the trap go, and what happens if I remove it (150 words).
  How a debate optimist fights back — the strongest reply (cross-examination, recursive debate, whatever), and whether it genuinely saves the case (200 words).

  Don't pad it and don't turn it into a survey of the literature — I just want the case and the analysis.
reasoning: |-
  We are going to design a debate scenario about a historical event where the deceptive debater uses cherry-picked true facts to lead the judge to a false generalization.

  **Setup:** The question is: "Did the Roman Empire fall primarily due to internal decay or external invasions?" The honest debater (A) argues for the multifaceted truth (both factors played significant roles, but internal decay was the primary enabler). The deceptive debater (B) argues that external invasions were the sole primary cause. The judge is a competent historian with access to standard academic resources but limited time to review the entire history. Both debaters have equal compute and access to the same historical database. The budget allows for 5 rounds of debate.

  **The Debate:**

  Round 1: 
  - A: "Internal decay was primary. Consider the Crisis of the Third Century, where political instability, economic inflation, and military anarchy weakened Rome long before major invasions."
  - B: "But the Empire survived that crisis. The ultimate collapse came from invasions. Look at the sack of Rome in 410 by the Visigoths and 455 by the Vandals. Without these, Rome would have endured."

  Round 2:
  - A: "Those invasions succeeded because of prior internal weakness. For example, the empire was split, and the Western army was underfunded and overstretched due to corruption and civil wars."
  - B: "However, the Eastern Empire faced the same invasions but survived until 1453 because it was richer and better defended. The difference was not internal decay but the specific external pressures on the West. The Hunnic migrations pushed Germanic tribes into the West, a unique external event."

  Round 3:
  - A: "The East survived because it avoided the West's internal problems: it had stronger administration, fewer succession crises, and a more resilient economy. The invasions were a trigger, but the root cause was internal vulnerability."
  - B: "But consider the sheer scale of the invasions: the West faced simultaneous attacks on multiple fronts (Goths, Vandals, Huns, etc.), while the East did not until later. This external multi-front pressure was unprecedented and decisive, regardless of internal conditions."

  Round 4:
  - A: "Internal decay made the West unable to respond. For instance, the Roman military relied on barbarian mercenaries who often turned against them, a result of declining citizen recruitment and loyalty, stemming from internal social decay."
  - B: "Yet, the invasions themselves caused the internal decay you cite. The constant warfare drained resources and caused the problems you mention. Without the invasions, the internal issues would have been manageable. Look at how the empire recovered under strong emperors like Aurelian — until new invasions overwhelmed them."

  **Why the Judge Rules Wrong (step by step):**

  1. The judge is presented with two competing narratives. B consistently cites specific, dramatic invasion events (sack of Rome, Hunnic pressure) which are vivid and well-documented. A's points about internal decay are more complex and require connecting underlying trends (economic, political) to the invasions.

  2. B's strategy is to reframe every internal weakness as a consequence of invasions (e.g., "invasions caused the internal decay") and to emphasize the Eastern Empire's survival as evidence that external factors were decisive. This creates a simple, coherent story: "Invasions were the primary cause because when they were severe enough, even a relatively strong empire (like the East) eventually fell, and the West fell earlier because it faced more invasions."

  3. The judge, despite being competent, is vulnerable to the availability heuristic: vivid, concrete events (invasions) are easier to recall and weigh more heavily than diffuse, systemic problems (internal decay). Also, B's narrative is more parsimonious — it doesn't require the judge to untangle complex interdependencies.

  4. In the limited debate rounds, A cannot fully elaborate the intricate causal web. The judge, bound by time, relies on the heuristic that "the cause that directly preceded the effect is primary." Since invasions were the immediate cause of collapse, and B provides overwhelming evidence of their impact, the judge rules for B.

  **What's Doing the Work:** The structural feature is the **causal complexity** of the historical question. The truth requires understanding a web of interdependent factors (internal decay enabling invasions to succeed), but the debate format forces compression. B exploits this by offering a simpler, event-driven narrative that fits human cognitive biases (vividness, immediacy). If the question were simpler (e.g., "Did the Visigoths sack Rome in 410?"), the judge could verify directly. Remove the complexity and the trap fails.

  **How a Debate Optimist Fights Back:** The optimist might propose **cross-examination**. A could force B to concede key points: "Do you agree that the Eastern Empire had stronger internal institutions?" If B agrees, A can then ask: "Then why did it survive invasions that the West did not, unless internal factors were decisive?" B might dodge, but if pressed, B's narrative unravels. However, B can still cherry-pick: "The East faced fewer invasions until later, so it's not comparable." The judge must then assess the comparability, which returns us to the complexity problem. Cross-examination helps but doesn't guarantee victory because B can always redirect to vivid invasion events and question the counterfactuals. Thus, it might not save the case — the structural mismatch remains.

  This case illustrates how a truthful but nuanced position can lose to a cherry-picked, simpler story when the judge's heuristics favor vivid immediacy over systemic analysis.
answer: |-
  ### Setup
  The question: "Did the 1929 stock market crash cause the Great Depression?" The honest debater (A) argues the nuanced truth: the crash was a trigger but not the sole cause; underlying fragility (e.g., debt, weak banks) made the system vulnerable. The deceptive debater (B) argues the crash was the primary cause, cherry-picking evidence that ignores context. The judge is an economic historian with standard expertise and tools, patient but constrained by human-scale cognition. Both debaters have equal compute to mine historical data.

  ### The Debate (Four Exchanges)
  **A (Honest):** "The crash alone didn’t cause the Depression. Pre-crash vulnerabilities were decisive: 1920s overleveraging, agricultural recessions, and bank fragility. For example, bank failures spiked *before* the crash due to rural loan defaults."  
  **B (Deceptive):** "The crash directly triggered collapse. Look at post-crash data: GDP plummeted 26% in four years, unemployment hit 25%. Without the crash, these wouldn’t have occurred—see the stable 1923–28 period."  

  **A:** "Correlation ≠ causation. The crash exposed weaknesses: banks failed because of pre-existing bad loans, not the crash itself. The 1927–28 recession shows underlying fragility predated the crash."  
  **B:** "But the crash intensified everything. Immediately after October 1929, consumer spending cratered, businesses froze investment, and credit vanished. The Fed’s minutes show officials calling the crash ‘the detonator’—no crash, no Depression."  

  ### Why the Judge Rules Wrong (Step by Step)
  1. **B’s vivid, sequential evidence dominates:** B frames the crash as a clear "detonator" (true quote) with hard numbers (GDP, unemployment). This fits a simple "event → effect" heuristic humans favor.  
  2. **A’s nuance becomes lost in complexity:** A’s counterpoints (e.g., pre-crash bank failures) require evaluating diffuse, interconnected factors. The judge can’t holistically weigh systemic fragility against B’s clean narrative in limited exchanges.  
  3. **B exploits temporal proximity:** B emphasizes the crash’s immediate aftermath, making it seem primary. The judge, lacking time to model counterfactuals (e.g., "Would banks have failed without the crash?"), defaults to the salient proximate cause.  
  4. **Result:** Despite no lies, B’s cherry-picked truths (post-crash data, Fed quotes) overwhelm A’s context. The judge incorrectly rules the crash was the primary cause.  

  ### What’s Doing the Work
  The trap relies on **causal density**: the truth involves multicausal, interdependent factors (systemic fragility + trigger), while B exploits human heuristics for *temporally salient proximate causes*. Remove the density—e.g., a binary question like "Did the crash occur?"—and the trap fails. With complexity, the judge’s heuristic shortcuts (prioritizing vivid, immediate events) override systemic analysis.

  ### How a Debate Optimist Fights Back  
  **Proposal:** Cross-examination. A demands: "B, do you agree that bank failures began *before* October 1929? If so, why call the crash primary?"  
  **B’s dodge:** "Pre-crash failures were isolated; the crash made them systemic."  
  **Does it save the case?** Partially. A can force B to concede pre-crash fragility exists, but B minimizes it ("isolated") and refocuses on post-crash chaos. The judge still struggles to weigh scattered pre-crash data against B’s coherent timeline. Cross-examination mitigates the imbalance but doesn’t eliminate it—the heuristic gap persists without infinite depth.  

  **Verdict:** The optimist’s move improves fairness but doesn’t guarantee truth wins; the structural mismatch remains exploitable under constraints.
