answer: |-
  Your focus on this paragraph is excellent—it's indeed a microcosm of Mill's crucial argumentative pivot. Let's dissect it line-by-line, prioritizing your first puzzle while addressing the others:

  **Sentence 1: "But there is no known Epicurean theory of life which does not assign to the pleasures of the intellect, of the feelings and imagination, and of the moral sentiments, a much higher value as pleasures than to those of mere sensation."**

  *   **Claim:** Mill counters the "swine objection" (that utilitarianism reduces humanity to animalistic pursuits) by appealing to the *actual history* of hedonistic thought (Epicureanism). He argues that even ancient hedonists recognized a hierarchy *within* pleasures, explicitly valuing intellectual, emotional, imaginative, and moral pleasures **higher** than bodily ones.
  *   **"as pleasures" - The Crux of Puzzle #1:** This phrase is doing vital work and is **not incoherent**, though it requires understanding Mill's qualitative hedonism.
      *   **Your Classmate's Reading (Smuggling):** Argues "higher value as pleasures" is impossible if pleasantness is a single dimension. If drinking water and proving a theorem share only the name "pleasure," comparing their *value as pleasures* requires a common measure (intensity/duration) that Mill rejects. Therefore, "as pleasures" must be dishonest; the "higher value" must come from *non*-hedonic sources (e.g., dignity, rationality).
      *   **Defensible Millian Reading (Qualitative Distinction):** Mill *denies* that pleasantness is *only* a matter of intensity/duration (the single-dimension assumption). He posits distinct *kinds* of pleasantness with inherent qualitative differences. The pleasure of intellect *feels different in kind* and *is experientially superior* to the pleasure of sensation. Its "higher value *as* pleasure" means its *intrinsic pleasant character* is more valuable, not that it's pleasant *plus* something else. The "value" here *is* its distinctive qualitative pleasantness. **Why it's not presupposing a common measure:** Mill isn't saying we compare the *quantity* of pleasantness-unit in water vs. a theorem. He's saying competent judges, experiencing both, recognize the theorem's pleasure belongs to a *superior category* whose very nature makes it preferable, even if less intense or shorter. The heterogeneity is real, but the qualitative hierarchy allows comparison *as to which kind of pleasant experience is better* without reducing them to a common metric.
  *   **Concession/Work:** This is argumentative work, directly rebutting the swine objection by showing hedonism has *always* acknowledged non-swine pleasures as superior. It sets the stage for his unique contribution.

  **Sentence 2: "It must be admitted, however, that utilitarian writers in general have placed the superiority of mental over bodily pleasures chiefly in the greater permanency, safety, uncostliness, &c., of the former—that is, in their circumstantial advantages rather than in their intrinsic nature."**

  *   **Claim:** Mill concedes a point about his *utilitarian predecessors* (primarily Bentham). They defended mental pleasures, but on purely *quantitative* and *instrumental* grounds – they last longer, are less risky, cheaper, etc. Their superiority was argued based on consequences and external factors, not their inherent quality.
  *   **"Circumstantial advantages vs. Intrinsic nature":** This is the core contrast. "Circumstantial advantages" (permanency, safety, uncostliness) are features *extrinsic* to the feeling itself – they concern the *conditions* under which the pleasure occurs or its *consequences*. "Intrinsic nature" refers to the *inherent experiential quality* of the pleasure itself, independent of context or consequences. Bentham focused on the former; Mill will focus on the latter.
  *   **Work:** Transitional and concessional. He grants the Benthamite defense is valid *as far as it goes* but implies it's insufficient and misses the essential point.

  **Sentence 3: "And on all these points utilitarians have fully proved their case; but they might have taken the other, and, as it may be called, higher ground, with entire consistency."**

  *   **Claim:** Mill reiterates the validity of the Benthamite defense ("fully proved their case") on the quantitative/instrumental points. However, he asserts utilitarians *could* have chosen a different, "higher" line of argument ("the other ground") without contradicting utilitarianism's core principles.
  *   **"Higher ground" - Puzzle #2:** It's "higher" because:
      1.  **Morally/Philosophically:** It grounds the superiority in the *essential nature* of the pleasures and the beings experiencing them (human dignity, rationality), not just contingent advantages. It directly answers the "swine" charge on its own terms.
      2.  **Argumentatively:** It's a stronger, more fundamental defense against qualitative objections. Relying *only* on circumstantial advantages leaves utilitarianism vulnerable if, say, a safe, long-lasting, cheap bodily pleasure was found – it couldn't explain why an intellectual pleasure might *still* be superior.
      3.  **Riskier?** Yes, because it introduces an element (qualitative difference) that seems harder to quantify and justify within a purely experiential framework, opening him up to the heterogeneity objection you're wrestling with. Bentham's quantitative approach *appears* more "scientific" and objective.
  *   **"Entire consistency" - Puzzle #2:** Consistency with **the fundamental principle of utility itself (pleasure/happiness as the sole ultimate good)** and with **the thesis that pleasure is the only thing desirable as an end**. Mill insists that recognizing qualitative differences *enhances* the pursuit of the greatest happiness; it doesn't introduce a *different* ultimate good. The "higher" pleasure *is* more happiness/pleasure *because* of its quality. He's arguing that qualitative hedonism is the *true* and most defensible form of utilitarianism, consistent with its core axiom. It's consistent *because* the higher quality *is* a feature of the pleasure-as-end.

  **Sentence 4: "It is quite compatible with the principle of utility to recognise the fact, that some kinds of pleasure are more desirable and more valuable than others."**

  *   **Claim:** This is Mill's core thesis. The Principle of Utility (actions are right insofar as they promote happiness/pleasure) not only *allows* for but *requires* acknowledging qualitative hierarchy among pleasures. This recognition is essential for utilitarianism to be a plausible moral theory for humans.
  *   **"More desirable and more valuable" - Puzzle #3:** This is **primarily a normative claim** about what *ought* to be desired and valued.
      *   **Normative:** Mill is stating what *is* more worthy of desire and pursuit. This worthiness is grounded in the *nature* of the pleasures and the preferences of competent judges (as elaborated just after this paragraph).
      *   **Link to Fact (Competent Judges):** While the *evidence* for this normative claim comes from the *fact* that those who've experienced both kinds *do* consistently prefer the higher pleasures (even with costs), the claim itself ("more desirable/more valuable") is normative. The preferences of competent judges *reveal* the normative truth about the pleasures' relative worth.
      *   **Heterogeneity Measure?** Mill does **not** require a single quantitative measure. The "measure" is the **informed preference of competent judges**. Their unanimous or near-unanimous preference for one kind of pleasure *over* the other, even when the preferred kind involves discomfort or less intensity/duration, *demonstrates* its superior desirability and value *as* a pleasure. The heterogeneity remains – we're comparing *kinds*, not quantities on a shared scale. The judgment is holistic: "Given the choice between experiencing *this type* of feeling or *that type* of feeling, which is better?"

  **How the Paragraph Hangs Together:**

  1.  **Counter-Objection & Historical Precedent:** (Sentence 1) "Hedonism isn't inherently swinish; even ancient hedonists valued higher pleasures *as* pleasures."
  2.  **Concession about Predecessors:** (Sentence 2) "However, past utilitarians defended mental pleasures weakly, focusing only on external advantages, not their intrinsic superiority."
  3.  **Proposal for a Stronger Defense:** (Sentence 3) "That defense worked on its own terms, but utilitarians could (and should) take a bolder, qualitatively-based stance *without betraying core principles*."
  4.  **Core Thesis:** (Sentence 4) "In fact, recognizing qualitative hierarchy is *essential* and *consistent* with true utilitarianism; some pleasures *are* inherently better/more valuable."

  **Summary on Your Puzzles:**

  1.  **"as pleasures":** Not incoherent. Mill means the higher pleasures possess a superior *qualitative kind of pleasantness*. Their value *as* pleasures stems from the inherent nature of that pleasant experience, not an added non-hedonic element. Competent judges recognize this qualitative superiority.
  2.  **"Higher ground" & Consistency:** "Higher" because it's a more fundamental, morally robust defense grounded in intrinsic quality. Riskier because qualitative differences are harder to quantify/handle within experiential philosophy. Consistent with the core utilitarian axiom that pleasure/happiness is the sole good, because the higher pleasure *is* a greater amount of happiness *due to* its quality.
  3.  **"More desirable and more valuable":** Primarily normative, grounded in the revealed preferences of competent judges. Requires **no single quantitative measure**; the heterogeneity is addressed through **holistic preference judgments between kinds** by qualified experiencers. Their preference *is* the evidence of the superior value.

  You are right to focus intensely on "as pleasures." Mill is making a radical claim *within* hedonism: that the *quality* of a pleasurable experience is an intrinsic feature of its pleasantness and determines its value. He's not smuggling; he's redefining the terrain of hedonism to accommodate human complexity. The competent judges argument immediately following this paragraph provides his crucial evidence and method for navigating heterogeneity without a common measure. Your "nagging suspicion" likely stems from the genuine tension Mill is trying to resolve – he *is* pushing hedonism to its limits.
