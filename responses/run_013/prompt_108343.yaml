answer: |-
  ## Opening Remarks: Norms of Assertion Workshop

  Good morning. Welcome. Coffee is over there. The schedule is in your folders. My sincere thanks to everyone, especially our funders, for making this possible. That’s the housekeeping and gratitude. Done.

  We’re here to discuss the norms governing when it’s permissible to make an assertion – when you can properly say “This is so.” For years, the debate has largely unfolded through thought experiments where one person tells another something, and very little hinges on it. Call these **report cases**. Imagine telling a colleague, over lunch, that the seminar room is booked. The stakes are typically low; the consequences minimal.

  But many assertions aren't like that. Often, someone tells you something knowing you *will act* on it immediately and decisively, where the consequences of being wrong are severe. Call these **stake cases**. The difference isn't a change of subject. It’s a change in *pressure* applied to the very same question: What makes an assertion permissible? Report cases let us examine the engine at idle. Stake cases put it under load. It’s under load we see what holds.

  Consider two cases. Not hypothetical puzzles, but situations where assertion carries weight.

  **Case One: The Ridge.** A mountain-rescue coordinator gets radio reports and a snowpack test suggesting a ninety percent chance a ridge is safe from avalanche-risk. She knows the team below *will* traverse it if she says “It’s safe.” She asserts: “The ridge is safe to traverse.” They go. An avalanche releases.

  Was her assertion permissible? Let’s test the standard candidate norms:
  *   **Truth:** Was the ridge safe? Clearly not. By this norm, her assertion was impermissible. But is that the *reason* it was wrong? Should she only speak when she’s infallible? That seems paralyzing.
  *   **Belief:** Did she *believe* it was safe? Her ninety percent confidence suggests a strong, perhaps justified, belief. If belief is the norm, she might be in the clear. But is strong belief enough when lives depend on it and the evidence isn't conclusive? It feels insufficient.
  *   **Knowledge:** Did she *know* it was safe? Given the ten percent uncertainty and the inherent unpredictability of snowpack, she almost certainly did not possess the kind of conclusive certainty we associate with knowledge. This norm likely condemns her assertion.

  The tempting answer is: “She should have said something weaker! ‘It’s *probably* safe,’ or ‘The risk is low.’” But is that a solution, or a dodge? What does “probably” mean to a team poised to act? Does it communicate the residual ten percent risk adequately? Does it discharge her responsibility, or merely obscure it? In stake cases, hedging can be just as consequential as asserting outright.

  **Case Two: The Clinician.** A clinician learns, via an accidental and confidential unblinding, that a drug trial is harming participants in the control arm. She *knows* this (by any reasonable standard). The trial protocol explicitly forbids her from telling participants. Does she have the right to assert to a participant, “This trial is harming people in your group”?

  According to Truth, Belief, and Knowledge norms, she seems to have impeccable grounds. She speaks truth, she believes it, she knows it. Yet, asserting it seems profoundly wrong. Why?

  *   The **Truth** norm doesn’t care about confidentiality breaches.
  *   The **Belief** norm doesn’t care about obligations to trial integrity.
  *   The **Knowledge** norm doesn’t care about the speaker’s role-bound duties or the potential chaos of breaking protocol.

  Nothing in these standard accounts explains the impermissibility here. They are silent on the contextual constraints – the ethical, professional, and practical webs surrounding the assertion. This shows that permissibility in stake cases isn't *just* about the speaker's relation to the fact asserted. It involves the speaker's relation to the *audience*, the *context of action*, and the *broader system of obligations* within which the assertion occurs. The norms seem to capture part of the story, perhaps the core epistemic part, but crucially, not the whole story when the assertion *matters*.

  **(Brief Aside:** It’s slightly odd, isn’t it? We’re discussing norms that govern assertions where something concrete hangs in the balance. Yet, the very speech I’m giving now – full of thanks, hopes, and procedural details – operates under almost none of these norms. Its permissibility hinges on politeness and utility, not truth, belief, or knowledge. The norms we dissect are curiously absent from the genre that convenes their dissection. An observation, not a gag.)

  So, where does this leave us? We have candidate norms that offer insights but show clear insufficiency under pressure. We see that report cases obscure dimensions crucial to stake cases: the weight of action, the adequacy of evidence relative to consequences, the role of context and duty beyond mere fact-stating.

  Therefore, the central question I put to you for the next two days is not *which* of the existing norms wins, but this:

  **What must be added to, or how must we fundamentally reconceive, our accounts of assertion to adequately explain its permissibility not just when we report, but when the stakes are high?**

  That is the pressure we need to apply. Let’s begin.

  Summary: Assertion norms developed for low-stakes report cases prove insufficient under the pressure of high-stakes cases where action follows, revealing crucial dimensions—like consequences, contextual obligations, and the adequacy of evidence relative to risk—that any adequate theory must capture.
