answer: |-
  Below is a decision tree designed to pinpoint where students diverge in Frankfurt-style cases, based on their answers to concrete questions about the case structure and commitments. The tree starts at the root question of blameworthiness and branches through key conceptual forks, including your specified nodes on the intervener's role and the disposition variant. Each node is a plain-English question answerable without prior knowledge of philosophical schools. Leaves are labeled with named positions (or "nobody" where none exists), and include one sentence on the hardest commitment for that view. Positions that cannot be cleanly separated share a leaf with an explanation.  

  ---

  ### **Decision Tree: Frankfurt-Style Cases & Moral Responsibility**  

  **Root:**  
  *Is Jones blameworthy for what he does?*  
  - **Yes** → Node 1  
  - **No** → Node 9  

  ---

  #### **Node 1: Determinism in the actual sequence?**  
  *In the actual sequence of events (where Jones acts without intervention), are his actions causally determined by prior states and laws?*  
  - **Yes** (Deterministic) → Node 2  
  - **No** (Indeterministic or non-determined) → Node 7  

  #### **Node 2 (Deterministic): Residual possibility: genuine alternative or flicker?**  
  *The Frankfurt case includes a "could have decided differently" scenario where Jones would waver and trigger intervention. Is this a* genuine alternative possibility *or a* mere flicker *(too trivial to ground freedom/responsibility)?*  
  - **Genuine alternative** → Node 3  
  - **Mere flicker** → Node 4  

  #### **Node 3 (Genuine alternative): Is the intervener external to the agent?**  
  *Must the intervener (e.g., Black the neuroscientist) be an external force, or can it be internal (e.g., Jones's own settled character)?*  
  - **External only** (Black is separate from Jones) → **Leeway incompatibilism**  
    - *Hardest commitment:* Defending that Jones has a robust ability to do otherwise in the actual sequence, despite determinism and an intervener poised to block alternatives.  
  - **Internal allowed** (e.g., Jones's cowardice *is* the intervener) → **"Character-as-intervener" view** (a subtype of leeway incompatibilism)  
    - *Hardest commitment:* Explaining why internal traits like cowardice don't undermine responsibility in the actual sequence, while external interveners would.  

  #### **Node 4 (Mere flicker): Does moral responsibility require the ability to do otherwise?**  
  *Is "could have done otherwise" a necessary condition for holding Jones blameworthy?*  
  - **Yes** → **Incoherent-case view**  
    - *Hardest commitment:* Arguing that the Frankfurt case fails because it either (a) secretly relies on a flicker of alternative possibility (contradicting "mere flicker") or (b) begs the question against incompatibilism.  
  - **No** → Node 5  

  #### **Node 5 (No alternative possibility required): How is "could have done otherwise" analyzed?**  
  *When compatibilists say Jones "could have done otherwise," do they mean:*  
  - **Categorical claim** (Jones had a metaphysical ability, unconditionally) → *Incoherent path* (Reject: Categorical ability contradicts Node 2’s determinism and Node 4’s "no robust alternative").  
  - **Conditional claim** (Jones would have done otherwise *if* he had chosen to) or **Dispositional** (Jones had a disposition to do otherwise under different conditions) → Node 6  

  #### **Node 6 (Conditional/Dispositional): What does responsibility require?**  
  *Must Jones have free will (e.g., control, reasons-responsiveness) to be blameworthy, or can responsibility exist without it?*  
  - **Requires free will** → **Conditional-analysis compatibilism**  
    - *Hardest commitment:* Justifying that conditional abilities (e.g., "could have done otherwise if he wanted to") are sufficient for free will in a deterministic world.  
  - **Responsibility without free will** → **Semi-compatibilism** (e.g., Fischer)  
    - *Hardest commitment:* Defending that agents can be morally responsible for actions they were determined to perform, even if they lack free will.  

  #### **Node 7 (Indeterministic actual sequence): In the counterfactual branch, what does the intervener do?**  
  *If Jones wavered, would the intervener...*  
  - **Cause the action** (e.g., directly manipulate Jones’s brain to make him act)? → **Source incompatibilism**  
    - *Hardest commitment:* Explaining why indeterminism in the actual sequence isn't enough—Jones must also be the *ultimate source* of his action, which the intervener undermines in the counterfactual branch.  
  - **Block alternatives** (e.g., paralyze Jones to force the action)? → Node 8  

  #### **Node 8 (Block alternatives): Is the intervener external?**  
  *Can the blocker be internal (e.g., Jones’s cowardice), or must it be external?*  
  - **External only** → **Source incompatibilism** (same leaf as above)  
    - *Note:* Blocking alternatives still threatens sourcehood if the agent isn’t the originator.  
  - **Internal allowed** → **Attributability-only view**  
    - *Hardest commitment:* Arguing Jones is blameworthy only in the *attributability* sense (the act reflects his character) but not *accountable* (he isn’t fairly subject to sanctions because his cowardice blocked alternatives).  

  #### **Node 9 (Not blameworthy): Why not?**  
  *Is the lack of blameworthiness due to...*  
  - **Determinism/non-sourcehood** (e.g., Jones isn’t free or isn’t the source)? → **Hard incompatibilism**  
    - *Hardest commitment:* Denying moral responsibility altogether, whether determinism or indeterminism holds, due to the absence of ultimate control.  
  - **The Frankfurt setup** (e.g., intervention or character blocks alternatives)? → **"No responsibility in Frankfurt cases" view**  
    - *Hardest commitment:* Explaining why Jones escapes blame even when he acts "on his own" in the actual sequence—typically by claiming the intervener/character makes alternatives impossible.  

  ---

  ### **Handling Your Variant: Jones's Disposition as Intervener**  
  The tree explicitly incorporates this via:  
  - **Node 3 (Genuine alternative)**: Forces students to decide if the intervener can be internal (e.g., cowardice). If they say "yes," they land in the "character-as-intervener" bucket.  
  - **Node 8 (Block alternatives)**: If they allow internal blockers, they reach the "attributability-only" view, which treats the cowardice variant as distinct from standard compatibilism.  
  - **Key cost**: If students internalize the intervener (Nodes 3 or 8), they must accept that settled character *functions as a constraint*, potentially undermining accountability.  

  ---

  ### **Notes on Unresolved Positions & Incoherent Paths**  
  - **Semi-compatibilism and Conditional-Analysis Compatibilism** share Node 6 (split by whether free will is required for responsibility).  
  - **Source and Leeway Incompatibilism** are separated cleanly:  
    - Leeway requires alternatives (Node 3), Source focuses on ultimacy (Node 7).  
  - **Incoherent paths flagged**:  
    - Node 5 → Categorical claim: Incoherent because it contradicts determinism (Node 1) and the dismissal of alternatives (Node 4).  
    - Root "Yes" → Node 2 "Genuine alternative" → Node 3 "External only": Coherent only if determinism is rejected (but Node 1 commits to determinism).  
  - **"Nobody" positions**:  
    - The "character-as-intervener" view (Node 3) has no standard name—it’s a hybrid some students propose.  
    - The "incoherent-case" view (Node 4) is held by critics like Kane or Widerker.  
  - **Unattractive but coherent**:  
    - Attributability-only view (Node 8) is coherent but forces students to weaken blame to "answerability."  

  This tree produces 8–10 nodes and isolates core disagreements while respecting your constraints. Use it after Frankfurt cases to force students to confront their assumptions step by step.
