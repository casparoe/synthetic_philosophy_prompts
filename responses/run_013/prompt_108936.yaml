answer: |-
  ### Moral Uncertainty Procedure for Grantmaking Committee  
  *Grounding: Based on MEC (maximizing expected choiceworthiness) with variance penalties to avoid fanaticism. Draws on MacAskill/Bostrom literature. Key insight: Treat moral theories as hypotheses, score proposals per theory, then aggregate.*  

  **Step 1: Pre-Screen for Dealbreakers (5 min/proposal)**  
  - **Action:** Each member flags proposals violating *their* core constraints (e.g., harms rights, undermines community).  
  - **Stop if:** ≥1 member vetoes → **Reject**.  
  - **Good enough:** No vetoes. If veto, objector must cite specific harm (e.g., "Coerces participants").  
  - **Values vs. facts:** If dispute over *whether* constraint was violated (e.g., "Does this *actually* coerce?"), hand to committee.  

  **Step 2: Score Choiceworthiness per Theory (10 min/proposal)**  
  - **Action:** For each non-vetoed proposal, members score from their theory’s view:  
    - *Utilitarian (U):* Expected welfare gain (0–100 scale, anchored: e.g., 50 = $100K saves 1 human life).  
    - *Prioritarian (P):* Gain for worst-off (0–100, 50 = lifts 10 people from extreme poverty).  
    - *Deontologist (D):* Binary + magnitude (0 if violates rights; else 1–100 for alignment with duties).  
    - *Communitarian (C):* Strength of relationships built (0–100, 50 = creates 5 local co-ops).  
  - **Good enough:** Scores with uncertainty ranges (e.g., "U: 60±20"). No consensus needed.  
  - **Hand back if:** Theories define "welfare" or "worst-off" differently → clarify definitions first.  

  **Step 3: Normalize Scores Across Theories**  
  - **Action:** Rescale each theory’s scores so its *average proposal in the current batch* = 50.  
  - **Why:** Compares value across theories without shared currency. *Judgment call:* Anchoring to batch average avoids bias toward "inflated" theories.  
  - **Skip if:** Time short → use raw scores (adds noise).  

  **Step 4: Aggregate via Variance-Penalized MEC**  
  - **Action:** For each proposal, compute:  
    **Score = Σ [ (Member’s score) × (1 / σ²) ]**  
    where σ = uncertainty range width (e.g., ±20 → σ=20).  
  - **Why:** Downweights high-uncertainty scores and avoids fanaticism (no theory dominates via tiny-probability mega-gains). Theories "vote" with confidence-weighted influence.  
  - **Judgment call:** If no numbers, rank theories by "avoiding regret" (e.g., U gets 3× weight if we’d lose most if utilitarianism is true).  

  **Step 5: Flag Fanaticism & Uncertainty**  
  - **Action:** Reject proposals where >50% of score comes from outcomes with <10% probability (e.g., culturing meat curing world hunger).  
  - **Stop if:** Fanaticism detected → **Reject**.  
  - **Hand back if:** Dispute over probability estimates → committee debates evidence.  

  **Step 6: Final Rank & Tiebreak**  
  - **Action:** Rank proposals by Step 4 score. For ties:  
    - If theories disagree *within* their scores (e.g., U loves A, C loves B), fund the cheaper one.  
    - If still tied, hand to committee for debate.  

  ---

  ### Test Run: Deworming (A) vs. Cultured Meat (B)  
  **Proposal A: Deworming**  
  - *U:* 80±10 (high health ROI)  
  - *P:* 75±15 (helps very poor kids)  
  - *D:* 40±30 (no rights violated but indirect)  
  - *C:* 20±40 (external NGO; weak community ties)  
  - *Normalized:* U:80, P:75, D:40, C:20 → **MEC Score = 80/10² + 75/15² + 40/30² + 20/40² = 0.80 + 0.33 + 0.04 + 0.01 = 1.18**  

  **Proposal B: Cultured Meat Research**  
  - *U:* 5±5 (low direct impact) *but* 5% chance of 1000±200 (transformative animal welfare) → **Expected U: (0.95×5) + (0.05×1000) = 55**  
  - *P:* 10±10 (benefits not targeted)  
  - *D:* 0±0 (no rights issue)  
  - *C:* 0±0 (lab-based; no community)  
  - *Normalized:* U:55±45* (adjusted for uncertainty), P:10, D:0, C:0 → **MEC Score = 55/45² + 10/10² + 0 + 0 = 0.03 + 0.10 = 0.13**  
  - *Fanaticism check:* 88% of U score from <10% probability → **REJECTED at Step 5**.  

  **Result:** Deworming (A) wins decisively. *You might dislike this if you weight longtermism highly—but variance penalties curb its influence.*  

  ---

  **Verdict:** Fund the highest-ranked proposal per the variance-penalized MEC score after veto checks, rejecting any fanatical bets.
