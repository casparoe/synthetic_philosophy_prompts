  I need to make sure this taxonomy addresses both labor and housing markets distinctly. The user mentioned that views might differ between minimum wages and rent controls, so I should design a structure that can accommodate that separation. For example, someone could be welfarist about minimum wages but rights-based about rent control, and the tree should have a specific leaf for such combinations.

  The key branch points include:
  - Whether the unregulated price is seen as a moral baseline
  - The nature of the wrong in "gouging" prices
  - Whether rationing mechanisms are part of policy assessment
  - How market structures like monopsony or homelessness affect verdicts
  - Whether assessment is against status quo or whole institutional schemes
  - Whether loss of mobility counts as the same kind of harm as monetary losses

  I'll start by building the tree from these questions, considering all possible combinations. The taxonomy should have around 12 leaves to fit on one page. For each leaf, I need to identify the position (or "unnamed") and state its most awkward commitment in one sentence.

  I should test the tree on the specific cases mentioned: binding minimum wage in a one-employer town, city-wide rent ceiling, turnover-adjusted rent ceiling, and emergency price freeze. This will help ensure the taxonomy covers real-world scenarios and reveals any gaps or unoccupied combinations.

  For the awkward commitments, I need to pinpoint the counterintuitive or problematic aspects of each position. For example, a pure welfarist position might have to accept that gouging is efficient, while a rights-based view might struggle with efficiency losses.

  I'll separate labor and housing markets by having distinct branches where necessary. This means the tree will branch early to accommodate different ethical frameworks for each market. If a view applies consistently across both markets, it can share the same path, but where views diverge, separate branches will handle them.

  After constructing the tree, I'll count the leaves and note any unseparated pairs. The answer should end with exactly: "\answer{N leaves; unseparated: <pairs, or none>}"

  Finally, I'll ensure the language is accessible, using concrete cases rather than jargon, and that each label is concise enough to fit on a one-page handout.
answer: |-
  Here is a taxonomy built from logical disagreements, tested against your cases, separating labor/housing where views commonly diverge. Key branch questions are answered sequentially.

  **Taxonomy of Ethical Positions on Price Controls**

  1.  **Does this policy domain (labor/housing) treat the unregulated competitive price as the moral baseline?** (Yes/No)
      *   *If Yes (Baseline):*
          2.  **When a binding ceiling causes non-price rationing, is that mechanism part of the policy's moral assessment?** (Yes/No)
              *   *If Yes (Assess Rationing):*
                  3.  **Is there anything morally wrong with a "gouging" price beyond efficiency loss?** (Exploitation/Desert-Need/No)
                      *   *If Exploitation:* **Libertarian Paternalism (LP)** - Most awkward: Must accept that preventing exploitation justifies overriding freedom of contract, potentially undermining its core principle.
                      *   *If Desert-Need:* **Unnamed (Baseline Desert)** - Most awkward: Struggles to define a non-arbitrary "deserved" price distinct from market outcomes without a full alternative theory of justice.
                      *   *If No:* **Pure Welfarist Baseline (PWB)** - Most awkward: Must concede that "gouging" is efficient and thus morally permissible if it maximizes total welfare.
              *   *If No (Ignore Rationing):*
                  4.  **Does the verdict change significantly if the buyer faces monopsony or existential harm (homelessness)?** (Yes/No)
                      *   *If Yes:* **Monopsony/Existential Harm Mitigator (MEH)** - Most awkward: Difficulty defining when market power/harm is severe enough to justify intervention without sliding into broader price controls.
                      *   *If No:* **Free Market Absolutism (FMA)** - Most awkward: Must defend outcomes where acute suffering occurs due to high prices as morally neutral or necessary.
      *   *If No (No Baseline):*
          5.  **Is the policy primarily assessed against the status quo or as part of a whole alternative institutional scheme?** (Status Quo/Whole Scheme)
              *   *If Status Quo:* **Unnamed (Status Quo Interventionist)** - Most awkward: Risks incoherence by rejecting baseline prices but lacking a clear alternative baseline for judging the intervention itself.
              *   *If Whole Scheme:* **Institutionalist (INST)** - Most awkward: May struggle to condemn even very harmful controls if they fit a theoretically coherent (but practically flawed) alternative system.
          6.  **LABOR: Is the wrong in low wages primarily exploitation of need or failure to meet desert/need?** (Exploitation/Desert-Need)
              *   *If Exploitation:* **Exploitation-Based Labor Rights (ELR)** - Most awkward: Must define "exploitation" precisely enough to avoid labeling all low-wage work exploitative.
              *   *If Desert-Need:* **Labor Desert/Needs Theory (LDN)** - Most awkward: Difficulty quantifying a "fair" wage objectively without market signals.
          7.  **HOUSING: Is the wrong in high rent primarily exploitation of need or failure to meet desert/need?** (Exploitation/Desert-Need)
              *   *If Exploitation:* **Exploitation-Based Housing Rights (EHR)** - Most awkward: Faces challenges distinguishing legitimate rent from exploitation in dynamic markets.
              *   *If Desert-Need:* **Housing as a Right (HAR)** - Most awkward: May justify indefinite below-market rents for sitting tenants regardless of market changes or landlord costs.

  **Test Cases & Occupancy:**

  *   **Min Wage (Monopsony Town):** FMA (awkward), MEH (plausible), ELR/LDN (plausible). *Tests Q4.*
  *   **City-Wide Rent Ceiling:** PWB (awkward), LP (awkward if rationing unfair), HAR/EHR (plausible). *Tests Q2, Q3, Q7.*
  *   **Turnover-Adjusted Ceiling:** INST (plausible part of scheme), HAR (potentially awkward if new tenant pays market). *Tests Q5.*
  *   **Emergency Necessity Freeze:** LP (plausible), PWB (awkward), Unnamed Baseline Desert (plausible), EHR (plausible). *Tests Q3.*

  **Diagnosing Unoccupied Combinations:**

  *   **No Baseline + Status Quo + Exploitation/Desert-Need:** (Leaf "Unnamed (Status Quo Interventionist)" covers this broadly). This combination is **unattractive/unstable** – rejecting the market baseline while assessing interventions *only* against the flawed status quo offers no positive principle for intervention or non-intervention, leading to arbitrariness. It's rare as a coherent, distinct position.
  *   **Baseline + Ignore Rationing + Gouging Wrong:** Logically **incoherent** within the tree. If the market price is the baseline and rationing mechanisms are ignored, acknowledging a "gouging wrong" contradicts the baseline's moral neutrality. Positions like LP *must* assess rationing.

  **Separation:** The tree cleanly separates views on Labor (ELR, LDN) and Housing (EHR, HAR) at the final branches (Q6/Q7). A view welfarist on min wage (PWB, MEH) and rights-based (HAR/EHR) on rent control lands distinctly: for min wage, they follow the "Baseline" path (likely PWB or MEH); for rent control, they follow "No Baseline" -> "Whole Scheme" -> "Housing" -> HAR/EHR.

  **Awkward Commitments Summary by Leaf:**

  1.  **LP:** Overriding contracts to prevent exploitation undermines core liberty.
  2.  **Unnamed (Baseline Desert):** Defining a non-arbitrary "deserved" price is difficult.
  3.  **PWB:** "Gouging" is permissible if efficient.
  4.  **MEH:** Defining the threshold for justified intervention is slippery.
  5.  **FMA:** Acute suffering due to high prices is morally neutral/necessary.
  6.  **Unnamed (Status Quo Interventionist):** Lacks clear principle for judging interventions.
  7.  **INST:** May defend harmful controls if part of a coherent theoretical system.
  8.  **ELR:** Defining "exploitation" precisely enough is challenging.
  9.  **LDN:** Objectively quantifying a "fair" wage is difficult.
  10. **EHR:** Distinguishing exploitation from legitimate rent is tricky.
  11. **HAR:** May justify indefinite below-market rents regardless of context.

  \answer{11 leaves; unseparated: none}
