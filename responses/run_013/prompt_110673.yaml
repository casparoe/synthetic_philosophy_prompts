prompt: |-
  I'm a third-year PhD student in formal political theory and I'm stuck on something from a lab meeting last week. We're designing a survey study on how laypeople reason about a policy — three yes/no items: whether a stated risk is real, whether the proposed measure reduces it, and whether the measure should be adopted. My advisor's co-author wants to report, for each item, simply the majority answer, and when I raised the discursive dilemma he waved it of with "that's fine, that's just the wisdom of crowds — ask enough people and the errors cancel out and you get the truth." I've done enough social choice to know I should be able to say exactly what's wrong with that, but every time I try I either say something so weak he instantly agrees ("well sure, they aren't independent") or something so strong it also rules out the cases where aggregation obviously does work. For what it's worth, the concrete thing I'm worried about is the little 3x3 case where a majority accepts each of two premises and also rejects the conclusion they jointly entail, and where if you instead derive the conclusion from the accepted premises you get the opposite answer — he says that's a technicality and they'd just report the conclusion item as the headline number anyway.

  So: can you lay out the distinct precise claims that "the wisdom of crowds" / "the errors cancel out" could be standing for — from the platitude that a group can collectively know things no member knows, through a statistical claim about independent unbiased errors, through a Condorcet-style claim about majority competence on a binary question, through something about diverse problem-solvers outperforming individually smarter ones, up to a claim that aggregation is epistemically superior as such — and for each one say whether it's trivial, defensible, or false, what it actually requires (independence? binary options? a shared interest? sincere answering? a common prior about what counts as the right answer?), and whether it's the kind of claim that could license majority-voting each survey item separately. Then say which readings of the slogan would make my discursive-dilemma worry dissolve and which ones make it fatal, and whether the choice between aggregating premises and aggregating the conclusion is itself a substantive normative choice or just bookkeeping — because I suspect that's the real disagreement and we're both hiding behind the same sentence. Menu format please, I want to bring it to the next meeting. And be up front about what would change your mind on any of the verdicts: I'd rather know where you think you're most likely to be wrong than get a confident ranking with no exits.
reasoning: |-
  We are going to break down the concept of "wisdom of crowds" and related claims, and then evaluate them in the context of the discursive dilemma and the survey design.

  The Discursive Dilemma (DD) example you mention:
  - Suppose we have three binary questions: P, Q, and R, where R is the conclusion and it is a logical function of P and Q (say, R = P AND Q).
  - It is possible that a majority says P is true, a majority says Q is true, but a majority says R is false (even though if we derived R from the majorities on P and Q we would get R true).
  - Alternatively, if we aggregate the premises and then derive R, we get one answer, but if we aggregate the conclusion directly we get the opposite.

  The advisor's co-author wants to report the majority answer for each of the three items separately. They invoke the "wisdom of crowds" (WoC) to justify that the majority on each item is likely to be correct because errors cancel out.

  We will consider several interpretations of WoC and see if they license the separate aggregation and if they avoid the DD problem.

  ---

  **Menu of Claims about "Wisdom of Crowds" and Related Ideas**

  1. **The Platitude: Groups Can Know Things No Individual Knows**
     - **Description**: A group, by pooling information, can arrive at a correct answer that no single member could have known individually. This is a general idea and does not specify an aggregation method.
     - **Trivial/Defensible/False?**: Trivial and defensible as a general observation (e.g., in the Condorcet Jury Theorem, under certain conditions).
     - **Requirements**: 
       - There must be some mechanism for pooling information (e.g., deliberation, voting, averaging).
       - Some individuals must have partial information.
     - **Licenses separate aggregation?**: Not necessarily. It does not specify how to aggregate, so it does not by itself justify majority voting on each item separately. The DD problem could still occur.
     - **Relation to DD**: The DD is a counterexample to the idea that aggregating each item separately is always safe. This platitude does not address the aggregation method, so it does not dissolve the DD worry.
     - **What would change my mind?**: If it were shown that in the context of the survey, the separate aggregation method is the only feasible way to pool information, then the platitude might be used to justify the method. But the DD problem would still remain.

  2. **Statistical Claim: Independent Unbiased Errors (Averaging)**
     - **Description**: If individuals make independent errors that are unbiased (i.e., mean zero) when estimating a quantity, then the average of their estimates converges to the true value as the group size increases. This is the classic "wisdom of crowds" for continuous estimation (e.g., guessing the weight of an ox).
     - **Trivial/Defensible/False?**: Defensible under the conditions of independence and unbiasedness.
     - **Requirements**:
       - The variable being estimated is continuous (or at least cardinal).
       - Errors are independent across individuals.
       - Errors are unbiased (expected error is zero).
       - The aggregation method is averaging (not majority voting).
     - **Licenses separate aggregation?**: This claim is about continuous variables, but the survey items are binary. Majority voting is a different aggregation method (for binary choices). Therefore, this claim does not directly apply to the survey design. Moreover, for binary questions, we have the Condorcet Jury Theorem (next). The DD problem is about the logical connections between binary questions, so this averaging model does not directly address it.
     - **Relation to DD**: Since the DD arises from the logical structure of the questions, and this claim does not consider such structure, it does not dissolve the DD. Also, note that in the DD, even if each individual is competent (see next claim), the problem can occur.
     - **What would change my mind?**: If the binary items were treated as continuous (e.g., probabilities) and averaged, then this model might apply. But the co-author is using majority voting on binary items.

  3. **Condorcet Jury Theorem (CJT) for Binary Questions**
     - **Description**: For a single binary question, if each voter has an independent probability p>0.5 of being correct (and they vote sincerely), then the probability that the majority is correct approaches 1 as the group size increases.
     - **Trivial/Defensible/False?**: Defensible under the conditions (independence, identical and fixed p>0.5, sincere voting).
     - **Requirements**:
       - A single binary question with a correct answer.
       - Voters are independent.
       - Each voter has the same competence p>0.5.
       - Sincere voting (each votes according to their own belief).
     - **Licenses separate aggregation?**: This theorem applies to each binary question in isolation. So for each survey item, if the conditions hold, then the majority vote on that item is likely to be correct. However, the theorem does not account for logical dependencies between multiple questions. Therefore, applying CJT separately to each item ignores the DD problem. In the DD example, if we have three items (P, Q, and R) and R = P AND Q, then even if the majority is likely correct on P and on Q, the majority on R might be wrong (if, for example, the majority on R is driven by voters who reject one of the premises but also reject R for other reasons). Moreover, the logical connection breaks the independence of the three questions.
     - **Relation to DD**: The DD shows that the separate application of majority rule to each item can lead to an inconsistent collective judgment (even when each individual is consistent). Therefore, the CJT does not dissolve the DD worry because it does not consider the interrelations. In fact, the DD can occur even when each individual is highly competent (and the CJT conditions hold for each question) because the aggregation method (premise-based vs. conclusion-based) matters.
     - **What would change my mind?**: If it were shown that the three questions are logically independent, then the DD would not arise. But in the survey, R is supposed to be entailed by P and Q? If not, then the DD might not be a problem. Alternatively, if the group is so large and the competence so high that the probability of the DD occurring is negligible, then one might dismiss it. But without such evidence, the DD is a real possibility.

  4. **Diversity Trumps Ability (Page's Theorem)**
     - **Description**: A diverse group of problem-solvers (with diverse heuristics and perspectives) can outperform a group of individually smarter but less diverse problem-solvers when solving complex problems. This is about problem-solving, not voting.
     - **Trivial/Defensible/False?**: Defensible under certain conditions (diversity of heuristics and perspectives, and the problem being complex enough).
     - **Requirements**:
       - The problem is complex (multiple ways to approach it, and no single heuristic is always best).
       - The group has diverse heuristics and perspectives.
       - The aggregation method (e.g., best solution chosen from the individuals) is appropriate.
     - **Licenses separate aggregation?**: This is about selecting the best solution from individuals or combining ideas. It does not directly relate to majority voting on multiple binary items. Therefore, it does not license separate aggregation for the survey items and does not address the DD.
     - **Relation to DD**: The DD is not about problem-solving diversity but about logical consistency in aggregation. This claim does not dissolve the DD worry.
     - **What would change my mind?**: If the survey were designed to elicit diverse problem-solving approaches and then select the best overall answer (rather than majority vote on each item), then Page's theorem might apply. But that is not the current design.

  5. **Epistemic Superiority of Aggregation as Such**
     - **Description**: Aggregation (of some form) is generally epistemically superior to individual judgment. This is a broad claim.
     - **Trivial/Defensible/False?**: Defensible in many contexts, but the form of aggregation matters (e.g., deliberation, voting, averaging). Not always true (e.g., if the group is biased or the aggregation method is flawed).
     - **Requirements**: Depends on the aggregation method. For voting, conditions like independence and competence might be needed. For deliberation, open exchange of reasons.
     - **Licenses separate aggregation?**: Again, it depends. The claim does not specify the method. The DD shows that one method (separate majority voting) can lead to inconsistency. Therefore, this broad claim does not by itself justify separate aggregation and does not dissolve the DD worry.
     - **Relation to DD**: The DD is a specific challenge to the method of separate majority voting. This claim does not address it.
     - **What would change my mind?**: If it were shown that in the specific context of the survey, separate majority voting is the best feasible aggregation method and that the DD is rare, then the claim might hold. But without that, the worry remains.

  ---

  **Summary on the Discursive Dilemma (DD) Worry:**

  - The DD worry is that separately aggregating each item by majority rule can lead to a collective set of answers that is inconsistent (even if each individual is consistent) and that may contradict what we would get if we aggregated the premises and then derived the conclusion.
  - The co-author's response that the DD is a "technicality" and that they will report the conclusion item as the headline number anyway does not address the inconsistency. It avoids the logical problem by ignoring the logical connection between the items. But note:
    - If the conclusion is reported as the headline, then why ask the premises? The premises are being asked to understand the reasoning.
    - If the goal is to report the public opinion on each item, then the DD is irrelevant because there is no claim of consistency. But if the goal is to understand the public's reasoning, then the inconsistency is problematic because it reveals that the public as a whole does not hold a coherent view.

  **Is the choice between aggregating premises and aggregating the conclusion a substantive normative choice or just bookkeeping?**

  - It is a **substantive normative choice**. 
    - **Premise-based aggregation**: We aggregate the premises by majority and then derive the conclusion. This respects the logical connection but ignores the direct vote on the conclusion.
    - **Conclusion-based aggregation**: We aggregate the conclusion by majority (and ignore the premises for the conclusion). This respects the direct vote on the conclusion but ignores the reasoning (premises).
  - The choice depends on the purpose of the survey:
    - If the goal is to understand the public's overall stance on the policy (the conclusion), then conclusion-based aggregation might be preferred.
    - If the goal is to understand the public's reasoning (how they connect the premises to the conclusion), then premise-based aggregation might be more informative. However, the DD shows that the two methods can conflict.

  In your case, the co-author is proposing to report the majority on each item separately (which is neither strictly premise-based nor conclusion-based) and then use the conclusion as the headline. This is effectively conclusion-based for the policy recommendation, but they also report the premises. The DD problem then becomes a puzzle: why are the premises accepted by the majority but the conclusion rejected? It might indicate that the public does not see the logical connection, or that there are other reasons for rejecting the conclusion.

  **Recommendations for the Meeting:**

  1. **Clarify the Goal**: 
     - If the goal is to report public opinion on each of the three items, then the DD is not a problem because there is no claim that the collective answers must be consistent. People might hold inconsistent views.
     - If the goal is to use the survey to make an epistemic claim (that the majority on each item is likely correct) then the DD is a challenge because it shows that the collective set of answers can be inconsistent even if each individual is consistent and competent.

  2. **Address the Co-author's Claim**:
     - The co-author invokes WoC to justify that errors cancel out. But the WoC in the form of the Condorcet Jury Theorem (which is the most relevant for binary voting) requires independence and competence. However, the DD shows that even under those conditions, the collective set of answers can be inconsistent. Therefore, the WoC does not automatically guarantee that the majority on each item is correct when the items are logically connected.

  3. **Propose Solutions**:
     - Option 1: Treat the three items as independent and report each majority. Then the DD is an anomaly that might be rare and can be noted if it occurs.
     - Option 2: Aggregate the premises and then derive the conclusion (premise-based) and compare with the direct vote on the conclusion. This can be a robustness check and might reveal interesting things about public reasoning.
     - Option 3: Do not ask the premises and only ask the conclusion. But then you lose the reasoning.

  4. **Empirical Check**:
     - You could run a simulation: assume each individual has a certain probability of being correct on P, Q, and R (with R = P AND Q). Then compute the probability of the DD occurring (i.e., majority for P, majority for Q, majority against R). If the group is large and the competence is high, the probability might be low. But if the competence is only slightly above 0.5, the probability might be non-negligible.

  **Bottom Line**:

  - The WoC (in the Condorcet sense) does not dissolve the DD worry because the DD can occur even when the CJT conditions hold for each question individually.
  - The co-author's approach (reporting each majority and using the conclusion as the headline) is effectively conclusion-based aggregation. The DD worry then becomes: why are we asking the premises if we are going to ignore them for the conclusion? And what does it mean if the premises are accepted but the conclusion is rejected?

  If you choose to report each majority separately, you should be clear that the collective set of answers might be logically inconsistent and that this inconsistency is a finding in itself (about public reasoning) rather than an error.

  Good luck at the meeting!
answer: |-
  Below is a structured breakdown of the "wisdom of crowds" (WoC) claims relevant to your survey design, evaluated for their implications on your discursive dilemma (DD) worry. I focus on precision, requirements, and whether each claim licenses separate majority voting on each survey item. I also clarify when the DD worry dissolves or becomes fatal, and address the normative nature of aggregating premises vs. conclusions. For transparency, I note potential weaknesses in my reasoning under "What might change my mind."

  Claims are ordered from weakest/most general to strongest/most specific. "Licenses separate aggregation" means: Does this claim justify reporting majority answers for each item independently, ignoring logical connections?

  ---

  ### **1. Claim: Groups can collectively know things no individual knows (Platitudinous WoC)**
     - **Description**: Collective judgment can be epistemically superior to individual judgment through aggregation. No specific mechanism is assumed.
     - **Trivial/Defensible/False?**: Trivial and defensible as a general principle (e.g., in diverse groups).
     - **Requirements**: 
       - Aggregation mechanism (e.g., voting, averaging).
       - No requirement for independence, shared truth, or binary options.
     - **Licenses separate aggregation?**: No. This is too vague to endorse any specific method like majority voting per item. DD remains a risk.
     - **Relation to DD**: Does not dissolve DD; it's compatible with premise-based or conclusion-based aggregation. DD is a counterexample to naive aggregation.
     - **What might change my mind**: If empirical evidence showed that separate majority voting *always* converges to truth in practice (despite theory), I'd weaken this. But DD cases exist.

  ---

  ### **2. Claim: Errors cancel out under independence (Statistical WoC)**
     - **Description**: For continuous estimates, independent unbiased errors reduce group error through averaging (e.g., guessing ox weights).
     - **Trivial/Defensible/False?**: Defensible for continuous data under strict conditions.
     - **Requirements**: 
       - Continuous (not binary) outcomes.
       - Unbiased errors (mean zero).
       - Statistical independence across individuals.
       - No shared truth required; just shared estimation target.
     - **Licenses separate aggregation?**: No. Binary survey items (yes/no) violate the continuous-outcome requirement. Majority voting ≠ averaging. DD risk persists.
     - **Relation to DD**: Irrelevant to DD, which hinges on binary aggregation and logical dependencies. DD worry unaffected.
     - **What might change my mind**: If items were continuous (e.g., probabilities) and averaged (not majority-voted), this might apply. But your items are binary.

  ---

  ### **3. Claim: Majority competence on binary questions (Condorcet Jury Theorem, CJT)**
     - **Description**: For a single binary question, if voters are competent (p > 0.5) and independent, majority voting converges to truth as group size increases.
     - **Trivial/Defensible/False?**: Defensible under its narrow conditions.
     - **Requirements**: 
       - A single binary question with a "correct" answer.
       - Voter competence: p > 0.5 for all, identical and fixed.
       - Statistical independence across voters.
       - Sincere voting (no strategic behavior).
     - **Licenses separate aggregation?**: Only if applied to each item in isolation. But CJT ignores logical dependencies between items. **DD is fatal here**: CJT guarantees per-item accuracy but not global consistency. Your 3×3 DD case violates CJT's "single question" scope.
     - **Relation to DD**: 
       - If CJT holds per item, DD can still occur (majorities endorse inconsistent premises/conclusion). 
       - DD worry is **fatal** for licensing separate aggregation: CJT doesn't extend to interconnected questions.
     - **What might change my mind**: If logical dependencies are weak (e.g., items are empirically independent) or group size is large enough to make DD improbable *despite* dependencies. But in theory, CJT + logical links → DD risk.

  ---

  ### **4. Claim: Diversity trumps ability (Page's diversity WoC)**
     - **Description**: Diverse problem-solvers outperform experts by pooling varied perspectives/heuristics.
     - **Trivial/Defensible/False?**: Defensible for complex problem-solving (e.g., Page's theorem).
     - **Requirements**: 
       - Diverse approaches/perspectives.
       - Problem decomposable into sub-tasks.
       - Aggregation via solution-selection (not voting per sub-task).
       - No requirement for independence or shared truth.
     - **Licenses separate aggregation?**: No. This is about solution diversity, not majority voting. DD risk unchanged.
     - **Relation to DD**: Does not dissolve DD; it's orthogonal. Premise aggregation might leverage diversity better, but not guaranteed.
     - **What might change my mind**: If diversity ensures premises are answered correctly *and* individuals reason logically, DD might be rare. But diversity doesn't prevent aggregation inconsistencies.

  ---

  ### **5. Claim: Aggregation is epistemically superior as such (Strong WoC)**
     - **Description**: Majority voting per item is inherently truth-tracking, regardless of context.
     - **Trivial/Defensible/False?**: False. DD and other paradoxes (e.g., Condorcet cycles) disprove this.
     - **Requirements**: None specified (overly broad).
     - **Licenses separate aggregation?**: Presumes yes, but DD is a direct counterexample. **DD is fatal here**.
     - **Relation to DD**: Shows aggregation can be inconsistent. Separate voting is suboptimal when items are logically linked.
     - **What might change my mind**: If all individuals shared identical reasoning (making DD impossible), but this violates diversity assumptions in WoC.

  ---

  ### **Key Implications for Your Discursive Dilemma (DD) Worry**
  - **When DD worry dissolves**: Only if claims are weakened to **1 (Platitudinous WoC)** or **2 (Statistical WoC)**—but these don't license separate aggregation. CJT (**3**) dissolves DD only if items are independent (no logical links), which isn't true in your case.
  - **When DD worry is fatal**: For claims **3 (CJT)**, **4 (Diversity WoC)**, and **5 (Strong WoC)**. CJT fails because your items are interconnected; Diversity/Strong WoC don't address consistency.
  - **The 3×3 DD case**: Your example (majorities accept P, Q, but reject R = P∧Q) is not a "technicality"—it reveals that separate aggregation can produce collective irrationality. Reporting the conclusion (R) as the "headline" hides this irrationality but doesn't resolve it.

  ---

  ### **Aggregating Premises vs. Conclusion: Normative or Bookkeeping?**
  - **Substantive normative choice**: 
    - **Premise-based**: Aggregate premises via majority, derive conclusion. Prioritizes logical consistency. Better if goal is "rational" group judgment.
    - **Conclusion-based**: Aggregate conclusion via majority, ignore premises. Prioritizes direct democratic expression. Better if goal is raw opinion on the policy.
  - **Why normative?** It depends on your study's goal:
    - If testing *reasoning*, premise-based avoids DD and reveals coherence.
    - If reporting *opinion*, conclusion-based respects popular will (but may mask inconsistency).
  - **Your advisor's co-author** is implicitly choosing conclusion-based by prioritizing the "headline number." You are advocating premise-based for coherence. This is a values clash, not statistics.

  ---

  ### **Recommendations for Your Meeting**
  1. **Concede strengths**: Agree that CJT (Claim 3) supports per-item accuracy if independence/competence hold, but stress it doesn't extend to interconnected items.
  2. **Highlight the DD risk**: Argue that separate aggregation can produce misleading headlines (e.g., "Public supports risk-reducing measure but opposes policy").
  3. **Propose solutions**: 
     - **Empirical**: Check for DD in pilot data. If rare, separate aggregation may be safe.
     - **Analytic**: Aggregate both ways (premise-based and conclusion-based) and compare.
     - **Design**: Drop premises if only the conclusion matters, or add a fourth item (e.g., "Do P and Q imply R?") to test coherence.
  4. **Reframe the slogan**: "Wisdom of crowds requires wise aggregation—not just counting votes."

  **What might change my mind overall**: If your survey items are empirically independent (e.g., no logical entailment), DD risk plummets. Or if evidence shows DD is empirically negligible in policy surveys, I'd downgrade its importance. But theoretically, it remains a flaw in separate aggregation.
