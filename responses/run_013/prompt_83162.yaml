prompt: |-
  I am an undergraduate representative on my university art museum's acquisitions advisory committee, and I am also taking a course on the philosophy of art this term, which is why the committee's current business has turned into a problem I cannot stop thinking about. The committee must vote at its next meeting on whether to accept a donation from the estate of a recently deceased artist, and I have been asked to circulate the written recommendation beforehand. I would like you to draft that memo.

  The donation consists of a printed set of instructions, a signed certificate of authenticity, and no object of any kind. The instructions describe a work that may be carried out only by museum staff, in one designated room, on a single day, after which every material trace of the realization must be destroyed and no photographic or other record kept; the text addresses whoever carries it out and leaves open that it may never be carried out at all. The estate's terms add three conditions: the work may never be realized without the estate's written approval; the instructions and the certificate must be displayed together in a case; and the museum must pledge a conservation budget to the paper. The estate describes the certificate as the work's only physical component. Our director objects that we would be acquiring something that has never existed and may never exist, that this is a category mistake dressed as generosity, and that donors of ordinary paintings would be justified in finding the acquisition unserious. Our curator replies that we already hold prints, photographs, and digital files, which exist as instructions to be realized on demand, so the only novelty here is that the number of authorized realizations may be zero. The case would also occupy the new wing's only display case, and the conservation pledge would consume most of this year's acquisitions budget.

  There is a further complication. A student collective has announced that it intends to realize the work at the opening of the new wing in six weeks, without the estate's approval and with cameras, arguing that a work consisting of instructions belongs to whoever carries them out. The committee has to decide whether to permit this, ignore it, or prevent it.

  Please draft the memo I will circulate. It should recommend a concrete course of action on the donation and on the students' plan, with a time frame; state criteria the committee can apply both to this decision and to the instruction-based donations we expect to be offered in coming years; explain what the museum would actually be acquiring, and what preserving it would amount to, given that nothing may survive a realization; and treat the director's objection as the serious position it is rather than dismissing it, including what would have to be true for it to be the right one. The disagreement on the committee is not really about money or wall space, so the reasoning has to settle what an artwork is and what it means for a museum to own one. No citations are needed; the argument should stand on its own, and I will add references myself if anyone asks.
reasoning: |-
  Okay, the user is an undergrad on an art museum acquisitions committee and needs a memo draft. They're dealing with a tricky donation: printed instructions and a certificate, but no physical artwork. The instructions can only be executed once by museum staff, then everything must be destroyed with no records. Plus, the estate has strict conditions like needing approval for realization, displaying the documents, and a conservation budget. 

  The director opposes it, calling it a "category mistake" since the artwork may never exist. The curator defends it by comparing it to prints or digital files that require realization. There's also a student group planning to execute the work illegally at the new wing opening. 

  The memo needs to recommend action on both the donation and student plan, set criteria for future similar cases, define what the museum is actually acquiring, and address the director's concerns seriously. The core issue is philosophical: what constitutes an artwork and what it means for a museum to own one. 

  Hmm... this requires balancing practical museum concerns with deep art theory. The director isn't wrong to worry about precedent—if they accept this, could they "acquire" just ideas? But the curator has a point about instruction-based art being legitimate. The student protest adds urgency; their action could invalidate the work entirely. 

  For the recommendation: rejecting the donation seems too conservative, but accepting all terms risks enabling empty gestures. A counteroffer makes sense—remove the realization cap and estate approval clauses. That preserves the artwork's integrity while making it truly acquirable. 

  The student situation is delicate. Preventing their action aligns with respecting artists' rights, but engaging them could turn confrontation into education. A symposium might channel their energy productively. 

  Criteria for future cases should focus on: realizable instructions (even if unrealized), clear ownership of the concept, and material traces worth preserving. The certificate here fails that last point—it's just proof, not the art. 

  What they're acquiring is the authority to realize the concept, which only has meaning if realization is possible. Preservation means protecting that potential. The director would be right only if the artwork's value depended on permanent physicality—but much contemporary art rejects that. 

  Key philosophical tension: Is art the idea or the instantiation? The memo must acknowledge both views while taking a stand. The proposed solution honors the artwork's nature as an event while ensuring the museum acquires something substantive—the enduring right to create that event.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions Advisory Committee  
  **FROM:** [Your Name], Undergraduate Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Re: Estate Donation of Ephemeral Work & Student Collective Action  

  ---

  ### I. RECOMMENDED ACTIONS & TIMELINE  
  1. **Accept the Donation—With Revised Terms**  
     - **Counteroffer to the Estate:** Propose accepting the donation *conditional* on removing clauses requiring the estate’s approval for realization and limiting realizations to zero. The museum must retain autonomy over if/when to realize the work.  
     - **Timeline:** Negotiate terms within 7 days; finalize by next committee meeting.  
     - **Student Collective Action:** **Prevent unauthorized realization.** Notify the collective that realization without estate/museum consent violates copyright and ethical stewardship. Offer collaboration: Invite them to a moderated symposium (see §III) to debate the work’s ethics.  

  2. **If Estate Refuses Revised Terms: Decline the Donation**  
     - Rationale: Without control over realization, the museum acquires only a speculative manifesto, not a stewarded artwork (§IV).  

  ---

  ### II. CRITERIA FOR FUTURE INSTRUCTION-BASED ACQUISITIONS  
  For the museum to acquire an instruction-based work, it must satisfy:  
  1. **Stewardable Authority:** The museum must own exclusive rights to realize the work *without external veto*.  
  2. **Material Trace:** The instructions themselves must hold cultural, historical, or aesthetic value as artifacts (e.g., unique documents, significant artist’s hand).  
  3. **Realization Integrity:** Realizations must align with the artist’s core intent, even if variable in form (contrast: student plan violates intent via cameras/permanence).  
  4. **Resource Proportionality:** Conservation costs must align with the work’s scholarly impact (e.g., preserving a Sol LeWitt wall drawing schematic > preserving a generic print-at-home PDF).  

  ---

  ### III. WHAT ARE WE ACQUIRING? PRESERVATION IN CONTEXT  
  We acquire:  
  - **The Artist’s Concept as Artifact:** The instructions are a *score* (like musical notation) encoding the artwork’s potential. The certificate authenticates this score’s authority.  
  - **Stewardship of Ephemerality:** Preservation means safeguarding the *conditions for possible realization*—protecting the instructions’ integrity and institutional readiness to execute them faithfully.  
  - **The Unrealized as Value:** Like architecture blueprints or performance scores, the work’s power resides in its latent potential. Each unrealized day deepens its conceptual resonance.  

  **If Realized:** The artwork *becomes* the ephemeral event. Preservation post-realization shifts to documenting the decision process, ethical debates, and institutional witness—not material remnants. Destroying traces isn’t loss; it’s fidelity to the work’s ontology.  

  ---

  ### IV. ADDRESSING THE DIRECTOR’S OBJECTION  
  The Director rightly asserts that museums must acquire *artworks*, not hypotheticals. For this objection to hold true, **all three conditions must apply**:  
  1. An artwork must be a *tangible object* or its fixed record.  
  2. Ownership must confer control over a *present entity*, not contingent future actions.  
  3. The donor’s offer must lack sufficient artistic precedent to redefine acquisition norms.  

  **Why This Donation (Revised) Meets Artistic Standards:**  
  - **Precedent Exists:** Fluxus event scores, Sol LeWitt’s wall drawings, and digital works (e.g., NFTs) treat instructions as the art object. A "zero-realization" work extends this tradition, echoing Duchamp’s *unrealized* projects as art-historical facts.  
  - **Ownership = Authority:** Acquiring a musical score means owning rights to perform it—not the sound waves. Similarly, we acquire authority to "perform" the instructions.  
  - **The Certificate is the Anchor:** Displaying the certificate alongside instructions transforms the case into a *reliquary of potential*. It materially manifests the artist’s conceptual gesture.  

  **Why the Director’s Concerns Demand Heeding:**  
  - **Museum Identity:** We risk trivialization if we acquire every speculative instruction. Criteria (§II) ensure rigor.  
  - **Donor Equity:** Accepting this *without* revisions could imply that estates may use museums as archives for unrealizable concepts, diverting resources from tangible collections.  

  ---

  ### V. CONCLUSION: A PATH FORWARD  
  **Recommendation Summary:**  
  - Pursue revised donation terms granting realization autonomy.  
  - Block unauthorized student realization but engage students dialectically.  
  - Adopt formal criteria for future instruction-based works.  

  **Final Note:** This debate crystallizes a core question: *Is the museum a temple of artifacts or a laboratory for artistic potential?* We need not choose—but we must ensure every acquisition, however immaterial, enlarges our capacity to steward art’s evolving forms. The estate’s work, if revised, invites the public into the mystery of art’s becoming; unrevised, it is merely a sealed enigma. Let us acquire only what we can ethically unfold.  

  **Vote Recommended:** YES, contingent on term revisions.  
  **Time Sensitive:** Student action requires immediate intervention (next 48 hrs).  

  ---  
  Respectfully submitted,  
  [Your Name]
