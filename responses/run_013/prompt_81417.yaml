          But note: this is under our assumptions. We must check robustness. What if the future opportunity is not twice as good? What if it is only 1.5 times? Then the ratio becomes 1.5 * 7.1 = 10.65, still better. What if the investment return is only 2%? Then (1.02)^50 ≈ 2.69, so 2 * 2.69 = 5.38, still better. What if we discount the future more? We used 1.5% per year for pure time and foundation risk. What if we use 2%? Then D(100) for effect would be (0.98)^100 ≈ 0.132, but then the holding option also uses the same discount factor for the effect, so the ratio remains 2*(1.04)^50 = 14.2. 

          Therefore, we decide to hold.

  **Conclusion for the Round**

  We reject Proposal 1 and Proposal 2 (or rather, we escalate Proposal 2 to the board, but if the board rejects it then we have no approved proposals). And we choose to hold the endowment.

  **Where the Procedure is Doing Values Work in the Costume of Estimation**

  1. **The cap of 10^20**: This is a value judgment about how much we are willing to bet on extreme outcomes. It prevents fanaticism but arbitrarily truncates the value of the very long-term future beyond that point.

  2. **The discount factors**: The choice of 0.5% for pure time preference and 1% for foundation survival risk are value judgments. They determine how much we care about the future relative to the present.

  3. **The assumption that the future is net positive**: We require proposers to argue for it, but we set a prior that it is positive. This is a value judgment that might not be shared by all.

  4. **The doubling factor for future cost-effectiveness**: This is an optimistic assumption about progress. It is an empirical assumption but has value implications.

  **What the Procedure Cannot Do**

  1. It cannot resolve fundamental axiological disagreements. It can only escalate them to the board.

  2. It cannot handle proposals that have impacts that are incommensurable under different value frameworks (e.g., if one framework values biodiversity intrinsically and another does not).

  3. It cannot escape the problem of cluelessness. We rely on the proposer to provide calibrated models, but for truly novel interventions, this might be impossible.

  4. It cannot avoid the arbitrariness of the truncation threshold and the discount rates.

  5. It cannot evaluate interventions that primarily affect the very far future (thousands of years) with any reliability because the discount factor becomes extremely small.

  6. It cannot account for the value of learning: by holding, we might learn more about what works, but we do not explicitly model that.
