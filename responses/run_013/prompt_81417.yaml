  We are designing a decision procedure for a longtermist grantmaking foundation. The procedure must handle the challenges of fanaticism, cluelessness, population axiology disagreements, and the possibility of a net negative future. It must also consider the option of holding the endowment for future use.

  The procedure will be structured as a sequence of questions. We will define the questions, the standard of evidence, and the conditions for refusal or escalation. We must be cautious about fanaticism and cluelessness, and we must be explicit about the rule we use to avoid fanaticism and what it costs.

  We will run the procedure on three proposals:
  1. A technical research program that claims a one-in-ten-thousand reduction in the probability of a permanent loss of human control.
  2. An institutional reform program whose expected value changes sign depending on population axiology.
  3. The option of holding the endowment.

  One of these should come out in a way the program officer might not like.

  Let's design the procedure step by step.

  **Decision Procedure Structure**

  We break the evaluation into stages:

  1. **Initial Screening**: Quick checks for alignment with the foundation's charter and feasibility.
  2. **Longtermist Impact Assessment**: Focus on the long-run future, with explicit handling of fanaticism and cluelessness.
  3. **Value Sensitivity Check**: Identify if the proposal's value is highly sensitive to fundamental value disagreements (like population axiology) and if so, escalate.
  4. **Cost-Effectiveness and Robustness**: Check if the proposal is cost-effective under a range of plausible views and if the evidence is robust.
  5. **Comparison with Alternatives and Holding**: Compare the proposal with the alternative of holding the endowment and with other proposals in the round.

  **Detailed Steps**

  **Step 1: Initial Screening**
     - Question 1: Does the proposal clearly aim to improve the very long-run future (at least 100 years and beyond) as its primary goal?
       - Standard: The proposal must explicitly state how it affects the long-term future. If not, reject.
     - Question 2: Is the proposal technically and organizationally feasible?
       - Standard: We require at least one independent expert review that affirms feasibility. If no, reject.
     - Question 3: Is the requested amount within the foundation's range ($200k to $3M) and the project duration reasonable?
       - Standard: If outside the range, reject unless there is a compelling case for an exception (then escalate to the board for amount only). For duration, we require a project plan that fits within 5 years (unless a strong case for longer).

     *Termination*: If any answer is negative, reject.

  **Step 2: Longtermist Impact Assessment**
     - Question 4: Does the proposal have a credible pathway to significantly affect the very long-term future? We consider two main types:
       - Type A: Reducing the probability of a terminal outcome (e.g., extinction, permanent collapse).
       - Type B: Improving the quality of the future conditional on survival (e.g., by influencing the trajectory of civilization, avoiding lock-in of bad values, or ensuring a more flourishing future).
     - Standard: The proposal must provide a clear theory of change that is supported by at least two independent academic studies or a consensus of experts in a systematic review. The theory of change must be robust to reasonable criticism (i.e., the proposer must address at least two major counterarguments).

     - Question 5: Estimate the magnitude of the effect on the long-term future. We require the proposal to quantify the impact in terms of:
       - For Type A: The reduction in the probability of a terminal outcome (Δp) over a relevant time horizon (e.g., the next 100 years).
       - For Type B: The expected improvement in the quality of the future per century (or similar) in a way that can be compared across proposals.

     However, we must avoid fanaticism. We use a **truncation rule**: We cap the value of any outcome at the equivalent of 10^20 lives saved or improved (or equivalent in other goods) in present-value terms. This cap is chosen to be extremely large but finite, to avoid infinite expectations from tiny probabilities. We acknowledge that this cap might cause us to underinvest in interventions that target truly catastrophic outcomes with very small probabilities but extremely large impacts beyond the cap. However, we believe that beyond this cap, the estimates become too speculative and the risk of fanaticism too great.

     Also, we require that the probability estimates and impact magnitudes are based on models that are:
       - Calibrated: The model's predictions should be tested against historical data where possible.
       - Robust: The estimates should not change drastically under minor model adjustments.
       - Acknowledge cluelessness: The proposal must explicitly state what is unknown and how the model accounts for uncertainty. We will discount estimates that are highly model-dependent and not grounded in empirical data.

     - Question 6: What is the expected value (EV) of the proposal? We calculate:
          EV = (Δp * V_terminal) + (1 - Δp) * V_quality_improvement
       But note: 
          - V_terminal is the value of avoiding a terminal outcome. We set V_terminal = 10^20 (the cap) in equivalent lives saved (or equivalent positive value) if we avoid the terminal outcome. However, we must consider that the future might be negative. So we also consider:
          - The possibility that the future is net negative: We require the proposal to provide an argument for why the future is likely to be positive (or at least not negative) under the intervention. If the future is net negative, then avoiding a terminal outcome might be bad. We handle this by requiring a separate assessment of the sign of the future.

     We break down:
       - For Type A: We require an estimate of Δp and an argument that the future is net positive (so that avoiding terminal outcome is good). If the future is net negative, then reducing the risk of terminal outcome might be bad. We require the proposer to address this.

       - For Type B: The V_quality_improvement must be estimated. But note: if the future is net negative, then improving the quality might make it less negative (which is good) or more negative (which is bad). Again, we require an argument about the sign of the future.

     We also require that the proposal addresses the possibility of the future being net negative. We set a prior that the future is net positive (based on the foundation's charter), but we require the proposer to provide evidence that the intervention does not make the future net negative.

     *Termination*: If the expected value (even after truncation) is negative, reject. If the estimate of Δp is too speculative (e.g., based on a model that cannot be validated and has high sensitivity to parameters) and the expected value without the speculative part is not positive, reject.

  **Step 3: Value Sensitivity Check**
     - Question 7: Is the expected value of the proposal highly sensitive to fundamental value disagreements, such as:
          - Population axiology (e.g., totalism vs. averagism vs. person-affecting views)?
          - The value of adding new lives vs. improving existing ones?
          - The value of nature, digital minds, or other non-human entities?
     - Standard: We require the proposer to provide an expected value calculation under at least two different value frameworks (e.g., total utilitarianism and a person-affecting view). If the sign of the expected value changes under these frameworks, then we must escalate to the board because the decision hinges on axiology.

     *Escalation*: If the proposal's value changes sign under defensible value frameworks, escalate to the board with a clear presentation of the disagreement.

  **Step 4: Cost-Effectiveness and Robustness**
     - Question 8: What is the cost-effectiveness of the proposal? We calculate:
          Cost-effectiveness = (Expected Value) / Cost
       We require this to be positive and above a threshold. The threshold is set by comparing with a benchmark: the expected cost-effectiveness of holding the endowment and investing it for future use.

     - Question 9: How robust is the expected value to uncertainties? We require the proposer to provide a sensitivity analysis over key parameters. We also run a Monte Carlo simulation with distributions on the key parameters (if provided) and see the 10th and 90th percentiles of the expected value. If the 10th percentile is negative or the distribution is too wide (such that the ratio of the 90th to 10th percentile is over 100), we consider the estimate too uncertain.

