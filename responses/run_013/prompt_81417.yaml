  **Step 5: Board Escalation for High-Stakes Decisions**
     - Question 10: If the proposal is above $2 million, or if we escalated due to axiological disagreement (from Step 3), we escalate to the board.
     - Standard: We present the board with the analysis, including the axiological disagreements and the expected value under different value frameworks. The board then votes.

  **Overall Procedure Flow**

  1. Step 1: Initial screening (Questions 1-3). If fail, reject.
  2. Step 2: Longtermist impact (Questions 4-6). If expected value is negative or too speculative, reject.
  3. Step 3: Value sensitivity (Question 7). If axiological disagreement leads to sign change, escalate to board and stop (wait for board decision).
  4. Step 4: Cost-effectiveness and robustness (Questions 8-9). If below threshold or too uncertain, reject.
