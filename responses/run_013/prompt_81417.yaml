              Threshold = [Best current opportunity's cost-effectiveness] * [Multiplier] * [Discount factor for 50 years]

          But note: we do not know the best current opportunity until we evaluate all proposals. So we set the threshold dynamically: we require that the proposal's cost-effectiveness is at least as high as the expected cost-effectiveness of holding for 50 years. We calculate the holding option as:

              Holding cost-effectiveness (per dollar held) = (Expected value per dollar in 50 years) * (Discount factor for 50 years)

