  ### Decision Procedure for Longtermist Grantmaking Foundation

  #### **Core Principles**
  1. **Avoid Fanaticism**: Use a **truncated expected value (TEV) approach** with a cap on maximum value. Any outcome exceeding the equivalent of \(10^{20}\) lives saved (or equivalent value) is capped at this value. This prevents tiny probabilities of infinite (or colossal) outcomes from dominating. The cost: we may undervalue interventions targeting truly astronomical outcomes beyond the cap, but this avoids reckless bets on poorly understood tail risks.
  2. **Acknowledge Cluelessness**: Require explicit separation of **informed estimates** (based on empirical data, calibrated models, or expert consensus) from **model-dependent artifacts** (highly speculative, sensitive to assumptions). The latter are either discarded or heavily discounted.
  3. **Value-Sensitivity**: Escalate proposals to the board if their expected value changes sign under defensible population axiologies (e.g., totalism vs. averagism vs. person-affecting views) or value theories (e.g., whether adding happy lives is good).
  4. **Terminal Risk vs. Conditional Quality**: Distinguish:
     - **Type A**: Reducing probability of terminal outcomes (e.g., extinction, permanent collapse).
     - **Type B**: Improving future quality conditional on survival (e.g., preventing value lock-in, ensuring flexibility).
  5. **Holding Option**: Explicitly compare proposals to the alternative of holding/investing the endowment for future use, using a discount rate for time/foundation failure risk.

  ---

  ### Decision Procedure

  #### **Step 1: Initial Screening**  
  *(Terminate if any answer is "no")*  
  - **Q1. Longterm Alignment**: Does ≥80% of the proposal’s expected value derive from effects >100 years in the future?  
    - *Evidence*: Theory of change linking intervention to long-term effects. Peer-reviewed studies or expert consensus required.  
  - **Q2. Feasibility**: Is there ≥50% probability the project achieves its core mechanism within 5 years?  
    - *Evidence*: Historical data from similar projects, pilot studies, or independent technical reviews.  
  - **Q3. Scale Fit**: Is the requested amount between $200k and $3M, with costs justified by a cost-effectiveness analysis?  
    - *Evidence*: Itemized budget with benchmarks from similar interventions.

  #### **Step 2: Longtermist Impact Assessment**  
  *(Terminate if TEV ≤ 0 or evidence is inadequate)*  
  - **Q4. Impact Type**: Is the proposal Type A (reducing terminal risk) or Type B (improving conditional quality)?  
  - **Q5. Magnitude Estimation**: Quantify the change in:  
    - Type A: Δp (reduction in terminal risk probability over 100-500 years).  
    - Type B: Δq (improvement in future quality per century, in "equivalent lives saved/improved").  
    - *Evidence*:  
      - Δp or Δq must be based on **calibrated models** (e.g., validated against historical near-misses) or **meta-analyses of expert surveys**.  
      - Discard "artifact estimates" (e.g., outputs from unvalidated models with high sensitivity to priors).  
      - Apply **cluelessness discount**: Multiply estimates by a robustness score (0-1) based on model uncertainty (e.g., 0.1 for speculative physics/AI risk models, 0.8 for epidemiological models).  
  - **Q6. Net Future Sign**: Is the future likely net positive conditional on survival?  
    - *Evidence*: Argument for net positivity based on >3 sources (e.g., literature on moral weight, sentience trajectories). If not, Type A interventions may have negative value.  
  - **Q7. Truncated Expected Value (TEV)**:  
    - **Calculate**:  
      - Type A: TEV = Δp × min(V_avoid, \(10^{20}\))  
        - V_avoid = value of avoiding terminal outcome (default: \(10^{20}\) lives equivalent).  
      - Type B: TEV = (1 - p_terminal) × Δq × T (where T = duration of effect, capped at 10^4 centuries).  
    - **Termination**: TEV ≤ 0.

  #### **Step 3: Value-Sensitivity Check**  
  *(Escalate to board if value-sign changes)*  
  - **Q8. Axiological Robustness**: Does TEV remain positive under 3 major population axiologies (totalism, averagism, person-affecting views) and if the future is net negative?  
    - *Evidence*: Quantitative analysis from the proposer using all 3 axiologies.  
    - **Escalation Condition**: TEV changes sign under any defensible axiology or value theory.  
    - *Note: Board members with axiological disagreements must be included here.*

  #### **Step 4: Cost-Effectiveness & Robustness**  
  *(Terminate if cost-effectiveness ≤ holding threshold)*  
  - **Q9. Base Cost-Effectiveness (CE)**: CE = TEV / cost.  
  - **Q10. CE Under Uncertainty**:  
    - Run Monte Carlo simulation on TEV varying key parameters (e.g., Δp, discount rates).  
    - **Termination** if 10th percentile CE ≤ 0 or if SD > mean.  
  - **Q11. Compare to Holding Option**:  
    - **Holding CE** = (Current best CE) × 2 × (0.985)^t  
      - `t` = years held (default 50 years).  
      - `0.985` = annual discount factor (0.5% time preference + 1% foundation failure risk).  
      - `2` = optimism multiplier (assuming future opportunities are 2x better due to progress).  
    - **Termination** if proposal CE < Holding CE.

  #### **Step 5: Escalation to Board**  
  *(Required if)*  
  - Requested amount > $2M.  
  - Axiological escalation from Step 3.  
  - *Board note: The anti-longtermist member may reject any proposal; the population ethics member may reject if axiology is contested.*

  ---

  ### Running the Procedure on Three Proposals

  #### **Proposal 1: Technical Research Program**  
  *Claims: Reduces AI-related terminal risk by Δp = 0.0001 (1/10,000). Cost: $1.5M.*  
  - **Step 1**: Passes (longterm-aligned, feasible per AI experts).  
  - **Step 2**:  
    - Type A (terminal risk reduction).  
    - Δp = 0.0001: Based on uncalibrated AI risk model → **discounted to 0.00001** (robustness score 0.1 due to cluelessness).  
    - TEV = 0.00001 × min(\(10^{20}\), \(10^{20}\)) = \(10^{15}\).  
  - **Step 3**: Robust across axiologies (avoiding extinction is good universally).  
  - **Step 4**:  
    - CE = \(10^{15}\) / $1.5M ≈ \(6.67 \times 10^8\) (lives equivalent/$).  
    - Holding CE (t=50) = \(6.67 \times 10^8\) × 2 × (0.985)^50 ≈ \(4.9 \times 10^8\).  
    - Proposal CE (\(6.67 \times 10^8\)) > Holding CE (\(4.9 \times 10^8\)) → **passes**.  
  - **Step 5**: No escalation (cost < $2M).  
  - **Outcome: Fund**.  
  - *Why you might dislike this: The cluelessness discount makes marginal terminal-risk reductions hard to justify, but it passes narrowly.*

  ---

  #### **Proposal 2: Institutional Reform Program**  
  *Claims: Prevents value lock-in, improving future quality by Δq = \(10^{10}\) equivalent lives/century. Cost: $1M. EV sign depends on axiology.*  
  - **Step 1**: Passes (longterm-aligned, feasible per governance experts).  
  - **Step 2**:  
    - Type B (conditional quality).  
    - Δq = \(10^{10}\): Based on historical institutional change data → robustness score 0.7 → **adjusted Δq = \(7 \times 10^9\)**.  
    - TEV = \(7 \times 10^9\) × \(10^4\) centuries = \(7 \times 10^{13}\).  
  - **Step 3**:  
    - Totalism: TEV > 0 (adds lives).  
    - Person-affecting view: TEV < 0 (harms existing trajectories).  
    - **Escalation required** (sign change).  
  - **Outcome: Escalate to board**. Anti-longtermist and population-ethics-skeptic board members likely reject.  
  - *Why you might dislike this: A promising lock-in prevention project dies at the board due to axiological gridlock.*

  ---

  #### **Proposal 3: Holding the Endowment**  
  *Claims: Investing for 50 years yields better future opportunities.*  
  - **Step 1**: Passes (explicitly allowed by charter).  
  - **Step 2**:  
    - Not applicable (no direct impact). CE derived from comparison.  
  - **Step 3**: Axiologically neutral (preserves optionality).  
  - **Step 4**:  
    - CE = Holding CE (benchmarked against best proposal in round).  
    - If best proposal CE = \(6.67 \times 10^8\) (from Proposal 1), then Holding CE = \(4.9 \times 10^8\).  
    - **Termination condition**: Only active if no proposal exceeds Holding CE.  
  - **Outcome: Hold if all proposals are below threshold**.  
  - *In this round: Proposal 1 passes, so we fund it instead of holding. But if both proposals rejected, we hold.*

  ---

  ### Critical Reflections
  1. **Values Work in Estimation Costume**:  
     - **Cap on value** (\(10^{20}\)): Arbitrary cutoff masquerading as technical necessity. This favors "known" catastrophes (e.g., asteroid impacts) over poorly understood ones (e.g., AI takeover).  
     - **Discount rates**: A 0.5% time preference assumes future lives are marginally less valuable—a value judgment with massive cumulative effects.  
     - **Cluelessness discounts**: Subjectively penalizes novel interventions, favoring incrementalist approaches.  

  2. **What the Procedure Cannot Do**:  
     - **Resolve moral uncertainty**: It flags axiological disagreements but cannot weight them. The board’s biases dominate.  
     - **Handle nonlinear effects**: Interventions with recursive impacts (e.g., accelerating progress) are modeled crudely.  
     - **Evaluate "meta" interventions**: Projects that improve future decision-making (e.g., better forecasting tools) require bespoke treatment.  
     - **Escape arbitrariness**: Caps, discounts, and robustness scores are necessary but unprincipled.  

  **Final Board Note**: The procedure forces transparency on fanaticism and cluelessness but is only as good as your estimators. When in doubt, holding is the default—and often the winner.
