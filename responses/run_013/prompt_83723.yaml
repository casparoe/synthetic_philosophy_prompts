prompt: |-
  Me and my mate got into it for like two hours last night about whether "avoid side effects" is even a coherent objective for an AI system, or whether it secretly smuggles in a whole theory of value. He kept saying every impact measure has to pick a counterfactual baseline and some distance metric over states, so it's value-laden by construction; I kept saying that's value-laden the way any task spec is, which is not the same as needing a full value function, and then we just went in circles. I'm writing the final for my AI safety seminar (upper-level, mixed CS and philosophy crowd) and I want one 60-minute essay question that puts exactly this crux to them — nothing they can answer by paraphrasing the "avoiding side effects" chapter of Concrete Problems and listing off the measures that compare the agent's options to a baseline (the reachability-style ones, the attainable-utility ones).

  So: can "avoid side effects" be given a definition that doesn't presuppose a full specification of value — and if yes, what does the definition have to look like; if no, where exactly does it break. I want it to force them to say what a side effect is operationally (some change relative to a counterfactual baseline, fine, but which one, and chosen how), and to actually seperate the different senses of "value-laden" instead of just asserting one of them. They should also have to produce a case where an impact measure punishes something plainly good and a case where it waves through something plainly bad, and say whether better metrics fix those or whether they're symptoms of something deeper. A lot of them will want to hand-wave past the intended-versus-unintended bit, so make sure the question doesn't let them.

  Give me the question, a model answer around 700 words, and a marking scheme out of 20 that separates an A from a B. I want the must-hit moves named (especially the baseline choice, the metric choice, the intended/unintended distinction, and the measure itself getting gamed), with the marks each is worth and a one-line note per point on how students usually blow it.
