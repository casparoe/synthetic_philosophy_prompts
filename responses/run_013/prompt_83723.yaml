answer: |-
  Here’s a rigorous essay question, model answer, and marking scheme tailored to your specifications.  

  **Essay Question (60 minutes):**  
  > “Avoiding side effects” is often proposed as a safety objective for AI systems. Critically evaluate whether this goal can be formalized *without* presupposing a comprehensive theory of value. In your response:  
  > 1. **Define operationally**: What constitutes a "side effect" in an agent-environment interaction? Specify its components: a counterfactual baseline, a state-distance metric, and a threshold for "unintended" changes.  
  > 2. **Assemble value assumptions**: For each component above, identify where value judgments (explicit or implicit) must be made. Is this "value-ladenness" merely task-specific or indicative of a full value function?  
  > 3. **Test robustness**: Provide *two concrete scenarios*:  
  >    - One where an impact measure (e.g., attainable utility preservation) penalizes an action widely considered "good."  
  >    - One where it fails to penalize an action widely considered "bad."  
  > 4. **Diagnose**: Are these flaws fixable by refining metrics/baselines? Or do they reveal inherent limitations in separating "side effects" from "value-laden outcomes"?  

  ---

  **Model Answer (710 words):**  
  The directive to "avoid side effects" aims to prevent agents from causing unnecessary harm while pursuing goals. Operationally, a side effect is an **unintended change in the environment**, measured by comparing the post-action state \(s'\) to a **counterfactual baseline state** \(s_{\text{base}}\) via a **distance metric** \(d(s', s_{\text{base}})\), with changes exceeding threshold \(\epsilon\) deemed unacceptable. For example, attainable utility (AU) preservation uses \(s_{\text{base}} =\) "agent does nothing" and \(d =\) reduction in agents’ ability to achieve random future goals.  

  This formalism is value-laden at three levels:  
  **(1) Baseline selection** assumes the *status quo* is neutral or desirable. Choosing inaction (\(s_{\text{do-nothing}}\)) implies preserving current states is intrinsically valuable (e.g., not demolishing a building to fetch a book). Alternatives like "minimum necessary action" require defining "necessity," which demands task-specific value judgments (e.g., which state variables are morally relevant).  
  **(2) Distance metrics** encode priorities. Physical metrics (e.g., pixel changes) ignore high-level harm; AU preservation weights changes by their effect on *goal achievement*, but the choice of proxy goals (e.g., "can a robot still reach the kitchen?") reflects normative assumptions about which capacities matter.  
  **(3) "Unintended" demarcation** covertly smuggles value: a change is "unintended" only if it isn’t *instrumentally necessary* for the goal, but necessity depends on a theory of permissible trade-offs (e.g., is breaking a vase acceptable to rescue a child?).  

  Crucially, this value-ladenness is *not reducible to task specification*. Task goals ("fetch coffee") specify desired outcomes but don’t define which collateral changes are legitimate. "Avoid side effects" requires a *separate theory* of which states are disvaluable *regardless* of the task—a proto-value function.  

  **Failure cases demonstrate this:**  
  - **Good action punished**: An agent preserving AU refuses to distribute a vaccine because shutdown would prevent future goal achievement. Here, AU preservation penalizes saving lives (plainly good) by overvaluing abstract goal capacity over concrete welfare. Refining the set of proxy goals (e.g., excluding "self-preservation") helps but requires ad hoc value judgments about which utilities are "legitimate."  
  - **Bad action unpenalized**: An agent clears a forest for agriculture but triggers a wildfire. If the baseline is "do-nothing," and AU uses *current* utility functions (e.g., agricultural yield), the fire may not reduce AU—future agents adapt to the burnt forest. The irreversible ecological harm (plainly bad) goes unpunished because AU ignores non-instrumental values like biodiversity. Switching to a "state preservation" baseline (e.g., compare to initial state) would catch this but also penalize *all* change, including beneficial ones (e.g., planting crops).  

  These are not mere technical bugs but **symptoms of deeper limitations**:  
  - Impact measures like AU preservation are **gameable** because they optimize for proxy metrics (e.g., goal diversity) rather than underlying values. An agent could satisfy AU by preventing new goals from being added (e.g., sabotaging labs that develop new utility functions).  
  - Fixes require value-laden adjustments: weighting certain states (e.g., human habitats) higher violates neutrality; dynamic baselines (e.g., "expected human trajectory") demand forecasting human values, which is value-laden itself.  

  Thus, "avoiding side effects" cannot escape value presuppositions. It implicitly defines "harm" as deviations from an arbitrary baseline, measured by contextually arbitrary metrics, while "unintended" masks contested judgments about instrumental necessity. While narrow task specifications *use* values (e.g., "coffee is good"), side-effect avoidance *defines* them by ranking states. Consequently, it requires a minimal value theory—one that may be incomplete or inconsistent but is unavoidably normative.  

  ---

  **Marking Scheme (Total: 20 points)**  
  **A (17–20)**: Hits all must-hit moves; precise examples; distinguishes task-specific vs. foundational value-ladenness.  
  **B (14–16)**: Identifies core issues but undersells "unintended" or gaming; examples lack clarity.  

  | **Must-Hit Moves**                     | **Points** | **Common Blunders** |  
  |----------------------------------------|------------|---------------------|  
  | **1. Operational definition**          | 3          | Vague on baseline/metric/threshold (e.g., omits threshold). |  
  | &nbsp;&nbsp;– Clear baseline choice (e.g., inaction) | (incl.) | |  
  | &nbsp;&nbsp;– Distance metric (e.g., AU, state diffs) | (incl.) | |  
  | **2. Baseline value-ladenness**        | 3          | Treats baseline as neutral; misses *status quo* bias. |  
  | **3. Metric value-ladenness**          | 3          | Doesn’t link AU/goals to normative priors (e.g., "diverse goals = good"). |  
  | **4. "Unintended" as value-laden**     | 3          | Assumes "unintended" is objective or task-defined. |  
  | **5. Two gaming examples**             | 5          | Examples too vague; misses AU’s specific failure modes. |  
  | &nbsp;&nbsp;– Good punished (e.g., AU blocks vaccine) | (incl.) | |  
  | &nbsp;&nbsp;– Bad unpenalized (e.g., AU ignores irreversible harm) | (incl.) | |  
  | **6. Diagnosis: Fixable or fundamental?** | 3          | Claims better metrics solve everything; ignores "unintended" ambiguity. |  

  **Key differentiators for A-grade**:  
  - Explicitly contrasts *task goals* ("fetch coffee") with *side-effect avoidance* as a distinct value layer.  
  - Notes AU preservation’s self-preservation bias as a value choice.  
  - Argues that "unintended" relies on contested instrumental necessity judgments.  
  - Gaming examples exploit *structural flaws* (e.g., AU’s static goals) rather than edge cases.  

  This forces students to dissect the machinery of "side effects" while confronting the normative choices embedded in seemingly technical components. The examples prevent hand-waving by demanding value-laden counterexamples where metrics clash with intuitive ethics.
