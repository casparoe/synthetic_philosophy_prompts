     Born rule: A has 0.6, B has 0.2+0.2=0.4.
     Branch counting: A has 1 branch, B has 2 branches -> so A: 1/3, B: 2/3.

  Now, if the colleague were to assign 0.6 to A, that would be the Born rule. If she assigned 1/3 to A, that would be branch counting.

  But note: the colleague has declined to answer in cases of unequal amplitudes. So what might she say? Given that she uses the Born rule in symmetric cases and that the Born rule is the standard in Everettian quantum mechanics, it is likely that she would extend the Born rule to asymmetric cases.

  Moreover, her statement in Sleeping Beauty that "the second waking adds nothing" is consistent with the Born rule: the total amplitude for tails is 1/√2, so the probability is 1/2, regardless of the fact that there are two awakenings.

