     In the new case, she would assign 0.8 to A.

     The rule is the Born rule: the credence for an outcome is the sum of the squared amplitudes of the branches that realize that outcome.

     An alternative rule that fits the symmetric verdicts is branch counting (when amplitudes are equal). But this alternative rule fails in the asymmetric case because it ignores the amplitudes.

