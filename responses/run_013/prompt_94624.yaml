answer: |-
  ## The Phi Trial

  When the shift began—  
  One spark ignites the retinal dark.  
  Then distance flinches: another mark  
  flares elsewhere, altered. Now the span  
  between them *moves*, a comet’s arc  
  of **amber**... **viridian**?  

  The edit smooths the gap.  
  (Stagehands in the theatre of the eye  
  adjust the gels before the signal flies.  
  The second hue dictates the trap:  
  the first light wears the future’s dye  
  before the bulb has snapped.)  

  Or memory’s wet ink  
  bleeds backwards through the brittle page?  
  That instant when **viridian** raged  
  across the path—did reason blink,  
  then lift the pen, rewrite the stage,  
  erase the missing link?  

  The motion feels complete.  
  Two cities with one sky. One seamless trace.  
  The question of the moment, time, or place  
  dissolves—a question none can meet.  
  The colour crossed its own erased  
  horizon. Was it fleet?  

  When the shift began—

  ---

  **Notes on the Mechanism:**

  *   **The Loop:** "When the shift began" bookends the poem, demanding a precise moment. By returning to it after exploring the impossibility of pinning it down, the loop demonstrates the futile circularity of the question itself.
  *   **The Two Stories:**
      *   **Show-Trial ("Stagehands"):** The future color dictates the *initial* experience ("the first light wears the future’s dye / before the bulb has snapped").
      *   **1984 ("Memory's wet ink"):** The initial experience contained the wrong color, instantly overwritten ("bleeds backwards... rewrite the stage, erase the missing link").
  *   **The Unknowable Sameness:** The stanza after the two interpretations ("The motion feels complete...") asserts their experiential equivalence ("Two cities with one sky"). The question "dissolves" because introspection reveals no fracture point ("a question none can meet").
  *   **Concrete Imagery:** Sparks, stagehands, gels, ink, pages, comets, cities – replace philosophical jargon with tangible sensory details.
  *   **Form as Function:** The looping structure embodies the puzzle; the unresolved tension *is* the point. The poem doesn't preach the demo, it *enacts* its core perplexity. The "viridian" (a specific green) provides the jarring color change without explanation.
  *   **Accessibility:** Someone unfamiliar gets a poem about shifting perception, unreliable memory, and the elusive nature of experience. Someone familiar sees the phi phenomenon and Dennett's interpretations vividly staged.
