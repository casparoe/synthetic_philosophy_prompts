answer: |-
  Here are five numbered points addressing your request:

  1.  **Portia weaponizes textualism by exploiting the bond's literal silence on collateral consequences (like bloodshed) and demanding impossible precision in its execution, revealing textualism as a tool deployable for strategic outcomes rather than neutral meaning-finding.** She reads the words strictly ("a pound of flesh... no jot of blood") but only to achieve a result diametrically opposed to the bond's apparent purpose (Antonio's death).

  2.  **Shylock's rigid literalism ("I stand here for law," demanding the bond's "penalty and forfeit") exposes both his vengeful purpose masquerading as contractual principle and the inherent violence latent within a text stripped of context or equity, demonstrating how textualism can serve oppressive desires.** His insistence on the letter alone blinds him to the absurdity and inhumanity of its literal fulfillment.

  3.  **Portia's move begins as interpretation (identifying the bond's silence on blood and its requirement for exact weight) but immediately shifts into *construction*: she implies a binding term forbidding bloodshed and deems any deviation impossible, effectively applying a proto-"absurdity doctrine" or "rule of lenity" to avert an unjust outcome the text itself did not explicitly prohibit.** The construction (adding "no blood" and "exact pound") is presented *as* the interpretation, blurring the line between finding meaning and imposing it to avoid perceived injustice.

  4.  **Shylock's forced conversion to Christianity immediately after the verdict resists a purely interpretive reading by highlighting the court's Christian power, revealing that Portia's textualist "victory" was merely a prelude to a brutal, extra-contractual imposition of state-sanctioned religious purpose, undermining any claim of pure textual fidelity.** This outcome starkly contrasts with the "legal" reasoning of the trial, showing purpose and power ultimately trumped text.

  5.  **The play dramatizes that the choice between textualism and purposivism, and the line between interpretation and construction, is fundamentally a question of *power* – specifically, who holds the authority to define the text's meaning or impose their purpose – exposing the abstract legal debate as often obscuring the social, religious, and political forces that determine whose literalism or whose purpose wins in court.** Portia's identity and position enable her textualist gambit and subsequent purposive punishment, which Shylock, the marginalized outsider, could never wield.
