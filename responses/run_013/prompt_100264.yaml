  The tricky part is the philosophical divide in the room. Half are clinic supporters, half are medicalization-skeptic philosophers. Key demands:
  - Must engage the "is grief a disease?" debate without academic jargon
  - Must specifically address "why not call it depression?" 
  - Can't dodge mom's stance but can't present it as settled truth
  - Must weave in personal warmth and humor

  Hmm... the Boorse-vs-Wakefield reference tells me they want fresh framing. I recall mom's critics argue medicalizing grief pathologizes normal suffering. But the clinic's view seems closer to Jerome Wakefield's "harmful dysfunction" concept - where biological mechanisms fail to self-correct. 

  For structure: opening should hook with humor (maybe mom's workaholic tendencies?), then pivot to dad's story as the "why this matters" moment. The depression distinction is crucial - depression is mood system malfunction, prolonged grief is attachment system stuck in loop. That's the scientific nuance the critics miss. 

  Ah! The "unfinished conversation" metaphor could work - normal grief evolves, stuck grief replays. The clinic isn't medicalizing pain, it's fixing broken healing mechanisms. That answers both camps: recognizes the philosophers' "normal experience" point while justifying treatment. 

  Must avoid sounding like a lecture. Maybe self-deprecating humor about over-researching the toast? And end circling back to mom's legacy - that she created space for "unfinished conversations" to find resolution. The "dinner table" imagery ties it all together warmly. 

  Biggest risk is imbalance. Need to validate the philosophers' concern about overmedicalization while firmly defending the clinic's approach. The depression comparison is the fulcrum - get that right and both sides feel heard.
answer: |-
  Here’s a toast that honors your mom’s legacy, steps into the philosophical fray with clarity, and lands with warmth and personal resonance—all in five minutes:

  ---

  **(Clink glass gently, warm smile)**  
  "Friends, colleagues, family... and esteemed philosophers who graciously agreed to attend what might feel like a live case study—welcome. We’re here to celebrate Dr. Eleanor Reed: my mom, your leader, your colleague, or your lifeline for 25 years.  

  Mom, you built this clinic from a shoestring budget and stubborn hope. You treated folks the system forgot. And two years ago, you did something radical: you opened a door for people whose grief *didn’t* fade—who were told, as you were after Dad died, to just *wait it out*. You called it ‘prolonged grief,’ and you treated it. Not as depression. Not as weakness. But as its own kind of wound.  

  Now, I know half this room thinks that door saved lives. The other half might wonder if we’ve medicalized something sacred. Is grief a ‘disease’? Or just... human pain? Philosophers in the corner: I see your raised eyebrows. Let’s walk into this mess together.  

  **First: Why *not* just call it depression?**  
  Because depression is a thief. It steals joy from *everything*—your work, your coffee, your memories. But prolonged grief? It’s an unfinished conversation. It’s love with nowhere to land. Mom’s patients could still laugh at a grandkid’s joke... but a song, a smell, a Tuesday at 3 PM could drop them into a hole they couldn’t climb out of. Depression numbs you. This grief *bludgeons* you. Treating them the same is like using a wrench for heart surgery.  

  **But is it a *disease*?**  
  Ah. The big question. Some say: ‘Disease’ means broken biology—find the malfunction, fix the part. Others say: No—calling something a ‘disease’ is a human judgment. It’s saying, *This pain isn’t just part of life; it’s a thief of life we must fight*.  

  Mom’s clinic chose to fight. Not because they found a ‘grief gene,’ but because they saw **healing mechanisms failing**. Most grief softens with time; it finds a place to live inside you. But for some? The mechanism jams. The wound stays raw. The world moves on, and you’re stranded. That’s not ‘normal’ suffering—it’s a **stuck** suffering. And when something’s stuck, you don’t just wait. You intervene.  

  **(Pause, look at philosophers)**  
  You might say: ‘But you’re drawing a line! You’re valuing productivity, function, ease—imposing norms!’ And you’re right. Medicine *is* normative. We call a broken leg a ‘disease’ because walking matters. We treat diabetes because living past 40 matters. **Mom’s clinic decided that *rejoining life* matters.** That loving without being devoured by loss matters. That’s not science ignoring humanity—it’s science serving it.  

  **(Shift tone, personal)**  
  Twelve years ago, after Dad died, Mom was told to ‘be patient’ with her grief. But patience doesn’t fix a jammed lock. What she built here—this scrappy, fierce clinic—was a key for locks that wouldn’t turn. She looked at people drowning in ‘normal’ pain and said: *No. You deserve a lifeline*.  

  **(Raise glass)**  
  So here’s to Dr. Eleanor Reed:  
  Who knew that medicine isn’t just about fixing machines, but about tending souls.  
  Who dared to say some pain isn’t a rite of passage—it’s a cage, and we have tools to pick the lock.  
  Whose legacy isn’t just a clinic, but a thousand reclaimed mornings, birthdays, quiet moments of peace…  
  …and one very proud son who’s *thrilled* you’re finally retiring.  
  *(Wink, gentle laughter)*  

  Mom—you taught us that healing is never just biology. It’s an act of love. And tonight, we love you right back. Cheers."  

  ---

  ### Why this works:
  1. **Honors Her Work**: Frames the grief program as radical compassion, not cold medicalization.  
  2. **Engages Critics**: Uses "Why not depression?" to show clinical nuance, and addresses "normativity" head-on by naming medicine’s inherent values.  
  3. **Philosophy Lite**: No jargon. Uses metaphors (thief, jammed lock, unfinished conversation) to illustrate abstract debates.  
  4. **Personal Anchor**: Your dad’s story grounds the debate in lived experience—*why* this mattered to her.  
  5. **Warmth & Humor**: Gentle jabs at philosophers ("live case study"), Mom ("stubborn hope"), and you ("thrilled you’re retiring") keep it human.  
  6. **Her Stance**: She committed to treating *stuck* grief—a failure of natural healing—which isn’t biological reductionism, but clinical pragmatism with moral weight.  

  It walks the tightrope: respectful to critics, fierce for her legacy, and leaves no doubt about the *human* stakes.
