prompt: |-
  Last night my friend and I burned about two hours arguing about Kepler and astrology. He says Kepler was basically a reluctant horoscope-monger who did the court stuff for the paycheck and privately thought it was all bunk. I said no — he spent decades trying to rebuild astrology on a sound footing, and his version was weirdly principled: the aspects (the angles between planets) were the real thing, the twelve signs and the houses were arbitrary junk, and the influence came in through the soul, like a harmony you can't help hearing, rather than by physically shoving you around. Honestly I might be makeing half of that up. Anyway, I'm recording a podcast episode next week with a historian of science who argues for something like that second reading, so can you draft me eight to ten interview questions, each with a follow-up keyed to the answer he's most likely to give?

  I want questions that make him actually commit on: what's supposed to be doing the influencing and how it gets from the sky into a person — if it's really the soul perceiving a configuration, isn't that just ordinary causation with an extra step bolted on? Why keep the aspects and throw out the signs? Is a reformed astrology even compatible with his own astronomy, given what he ended up thinking about light, motion, and the shape of orbits? Was any of it falsifiable, and how did he handle horoscopes that missed? And how does the whole thing sit with his Lutheranism — Providence, fate, whether the stars only incline.

  Then end with the one I actually care about, since it's what my friend kept hammering: if it only shapes dispositions and never predicts anything specific, in what sense is it still astrology rather than celestial physics with a mystical coat of paint? No biography filler, please.
