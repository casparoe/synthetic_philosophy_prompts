  ### The Primitive/Derived Restriction and the Case Against Individual Monotonicity

  **Position Statement:** Individual monotonicity—mandating that a bargainer’s payoff cannot fall when the feasible set expands while their counterpart’s maximum attainable payoff remains fixed—fails as a rationality constraint because it violates the *primitive/derived restriction*. This restriction requires axioms to depend solely on the primitive data defining a bargaining problem: the feasible set \(S\) and the disagreement point \(d\). Individual monotonicity illicitly relies on a *derived* quantity, the utopia point (each party’s maximum payoff given \(d\)), which is not intrinsic to the problem’s definition but computed from it. Since axioms like Pareto optimality, symmetry, scale invariance, and independence of irrelevant alternatives (IIA) adhere strictly to primitive data, while individual monotonicity does not, the latter lacks axiomatic legitimacy. Consequently, the standard argument favoring Kalai-Smorodinsky (KS) over Nash by appealing to monotonicity collapses, and Nash remains the default solution.

  **Defense via the Primitive/Derived Distinction:**  
  Rationality constraints in bargaining must be grounded in objective, pre-negotiation realities: what outcomes are possible (\(S\)) and the fallback if talks fail (\(d\)). These are the raw inputs any solution must process. Axioms should not depend on values *inferred* from this data, such as the utopia point \(u(S,d)\), which summarizes aspects of \(S\) relative to \(d\). Individual monotonicity’s flaw is precisely this: it treats \(u_i(S,d)\)—party \(i\)’s maximum payoff—as a fixed benchmark, demanding that \(j\)’s payoff not drop if \(S\) expands while \(u_i(S,d)\) is unchanged. But \(u_i(S,d)\) is not primitive; it is a secondary construct whose *bargaining significance* depends entirely on the shape of \(S\). When \(S\) expands while holding \(u_i(S,d)\) constant, the *meaning* of that constant value changes—it may now correspond to a different local geometry of the frontier, altering the bargaining balance. An axiom regulating payoffs based on this shifting derived quantity injects arbitrariness, not rationality. Rationality requires consistency with the primitives \(S\) and \(d\), not sensitivity to summaries that obscure how \(S\) is configured.

