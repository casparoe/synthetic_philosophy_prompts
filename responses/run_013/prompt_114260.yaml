    - Utopia point \(u(S₁,d) = (1,1)\) (Player 1’s max is 1 at (1,0); Player 2’s max is 1 at (0,1)).  
    - **Nash solution**: Maximizes \(x \cdot y\) on frontier. On segment (1,0)–(0.5,1): \(y = 2 - 2x\), product \(x(2-2x)\). Maximized at \(x = 0.5\), \(y = 1\) → **Nash(S₁) = (0.5, 1)**.  
    - **KS solution**: Equalizes ratios to utopia: \(x/1 = y/1\) → \(x = y\). Intersects frontier on (0.5,1)–(0,1): \(x = y\) and \(x + y = 1?\) Wait, frontier from (0.5,1) to (0,1) is \(x = 0.5 - 0.5y\)? Better: Parametrize. From (0.5,1) to (0,1), x from 0.5 to 0, y=1 (horizontal). So KS requires \(x/1 = y/1\) → \(x = y\). But on y=1, x∈[0,0.5], so only point is (0.5,1). **KS(S₁) = (0.5, 1)**.  
  - **Problem 2 (S₂):** Expand S₁ by adding the point (1.1, 0.1), so the frontier adds a segment from (1,0) to (1.1,0.1). Player 2’s maximum payoff remains 1 (attained at (0,1)). Player 1’s max is now 1.1.  
