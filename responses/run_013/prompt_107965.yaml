answer: |-
  ## Grant Proposal: The Context-Sensitivity of "Disease" as a Predicate

  **One-Paragraph Pitch (95 words):** This project challenges the dominant naturalist vs. normativist debate in disease ontology by proposing that "disease" functions primarily as a *context-sensitive predicate*, akin to "tall" or "knows." It argues that whether a physiological state is labelled a disease depends critically on two contextual factors: the chosen *reference class* (defining "normal" function) and the *stakes* (consequences and available interventions). The project will rigorously analyze this mechanism, demonstrating how it dissolves the apparent conflict by showing naturalism applies *within* a fixed context, while normativism governs the *selection* of context, using detailed case studies like shifting diagnostic thresholds.

  **The Question (185 words):** Does the application of the predicate "disease" exhibit systematic context-sensitivity based on (a) the selection of a reference class defining normal function and (b) the practical stakes associated with the label, such that the same underlying physiological state can be truthfully classified as diseased or non-diseased under different contexts? Crucially, is this context-sensitivity the core mechanism explaining persistent disagreements between naturalist and normativist accounts of disease, rendering their debate misconceived when framing "disease" as a context-invariant predicate? The project seeks a determinate answer: either demonstrating that existing positions can adequately explain reference-class and stakes-dependent shifts without invoking fundamental context-sensitivity, or conclusively showing that such shifts necessitate understanding "disease" as a context-sensitive term where naturalism operates locally and normativism governs context selection.

  **Why It's Still Open (330 words):** The naturalism/normativism debate remains unresolved because both frameworks struggle to fully account for the observed variability and pragmatic nature of disease classification, treating "disease" as possessing a fixed extension.

  Naturalists (e.g., Boorse) posit dysfunction relative to a statistically typical reference class (age, sex, species). Their strongest point is anchoring disease in objective biological deviation. However, they cannot definitively specify *which* reference class is the correct one without smuggling in normative judgments. Is "female reproductive function" the relevant class, or "human physiology" generally? Why age-band but not era-band? Physiology alone doesn't dictate the class. Further, they struggle to explain why statistically atypical traits (e.g., exceptional vision) aren't diseases, or why thresholds shift pragmatically (like blood pressure targets).

  Normativists (e.g., Wakefield, but more radically others) argue disease signifies harmful dysfunction, prioritizing the "harm" component. Their strength lies in capturing why we *care* about disease labels and how they drive medical action. However, they often struggle to provide a non-circular or non-arbitrary account of "dysfunction" independent of harm, risking making disease labels purely subjective or socially constructed. They also face difficulty explaining why genuinely harmful states caused purely by external factors (e.g., starvation) are often *not* called diseases, while internal dysfunctions are.

  Both sides tend to treat the other's core insight as an inconvenient anomaly to be explained away, rather than integral to the predicate's operation. Naturalists downplay the normative work in reference class selection and threshold setting. Normativists downplay the objective biological constraints within a chosen context. Neither adequately models the dynamic interplay where biological facts *within a class* interact with pragmatic, value-laden choices *about the class and stakes* to fix the extension of "disease" in a specific context. The persistent phenomena of reference class relativity (same state, different class, different label) and stakes-sensitivity (same state, different consequences, different label) remain inadequately addressed by monolithic accounts, indicating a fundamental gap.

  **Method (480 words):** This four-month project employs conceptual analysis and detailed case studies, structured as follows:

  *   **Weeks 1-2: Framework Development & Literature Synthesis:** Systematize the core argument for context-sensitivity. Precisely define "reference class" (statistical, functional-design, age/sex cohorts, environmental context) and "stakes" (availability/effectiveness of intervention, social/economic consequences of labelling, severity of potential harm). Map how prominent naturalist/normativist theories handle (or fail to handle) these factors. Draft the core thesis: "Disease" is context-sensitive; naturalism describes predicate application *given* fixed reference class and stakes; normativism describes the factors influencing the *setting* of class and stakes.
  *   **Weeks 3-6: Detailed Case Study 1 - Glycaemic Thresholds (e.g., Prediabetes):** Conduct a deep dive into the history and rationale of changing diagnostic thresholds for diabetes and prediabetes.
      *   Analyze the biological facts (glucose levels, HbA1c) held constant across threshold changes.
      *   Identify shifts in the operative *reference class* (e.g., shift from population averages to risk-based cohorts, debates over "normal" vs. "optimal").
      *   Analyze the role of *stakes*: emergence of new interventions (lifestyle programs, drugs), evidence on intervention efficacy (e.g., studies showing limited benefit for some prediabetes cohorts), cost-effectiveness of screening, economic/policy implications of labelling large populations.
      *   **Crucial Reasoning:** Demonstrate that the *biological dysfunction relative to the *original* class* hasn't changed – the glucose level remains the same. The shift in classification results from a *change in context*: a re-evaluation of the relevant reference class (e.g., focusing on high-risk subgroups) and/or the stakes (e.g., concluding the harms/costs of labelling and treating *this group* at *this threshold* outweigh benefits). This shows the predicate "disease" (or "prediabetes") itself is sensitive to context, not just a change in non-biological *facts about harm or function* interpreted within a fixed framework.
  *   **Weeks 7-8: Detailed Case Study 2 - Contrasting Case (e.g., Age-Related Cognitive Decline vs. Dementia):** Apply the same framework to a contrasting case. Examine the boundary between "normal" age-related cognitive changes and Mild Cognitive Impairment (MCI)/dementia.
      *   Analyze biological markers (if any) and functional impacts.
      *   Identify the contested reference classes (e.g., "healthy aging" cohort vs. population norms vs. individual baseline).
      *   Analyze the stakes: availability of interventions (current limitations vs. future prospects), social/familial impact of labelling, resource allocation debates.
      *   Assess if context-sensitivity operates similarly or reveals different mechanisms.
  *   **Weeks 9-12: Synthesis, Refinement & Drafting:** Integrate findings from the case studies. Refine the model of context-sensitivity: Is it a single mechanism (reference class + stakes) or are there distinct sub-types? Explicitly demonstrate how this dissolves the naturalism/normativism impasse: Naturalism correctly identifies the *biological deviation relevant within a chosen context*; Normativism correctly identifies the *values and consequences shaping the choice of context and threshold*. Draft the paper, focusing on the core argument and case study evidence. Develop implications for philosophical debates and practical medical classification.

  **What Success Looks Like (190 words):** Success means producing a substantive paper draft arguing persuasively that "disease" is a context-sensitive predicate whose application depends fundamentally on reference class selection and stakes. The key specific finding demonstrating success would be a clear articulation, grounded in the case studies (especially the glycaemic threshold analysis), of *how* the biology remains constant while the context shift alters the truth conditions for applying "disease," and why this necessitates moving beyond the naturalist/normativist dichotomy. Success also involves mapping how existing theories fit as partial descriptions operating within the broader context-sensitive framework.

  The project would be abandoned if a key case study *fails* to demonstrate context-sensitivity as the core mechanism. Specifically, if a detailed analysis of a threshold shift (like prediabetes) conclusively shows the reclassification was *solely* driven by a substantive revision of the underlying biological facts about function or harm *within an uncontested, fixed reference class and stakes framework* – meaning the predicate's meaning itself wasn't context-sensitive, only the empirical facts changed – this would invalidate the core thesis. Evidence showing established theories already fully and satisfactorily explain these shifts without invoking fundamental context-sensitivity would also warrant abandonment.

  **Scope (140 words):** The core focus is establishing the context-sensitivity thesis and dissolving the naturalism/normativism debate through conceptual analysis and one primary in-depth case study (Glycaemic Thresholds). If time constraints demand reduction, the secondary case study (Cognitive Decline) would be shortened to a schematic analysis or omitted, focusing solely on demonstrating the mechanism robustly in one paradigmatic case. Exploration of potential sub-types of context-sensitivity or extensive discussion of implications for specific medical classifications beyond the case studies would be minimized. Literature review sections synthesizing all nuances of naturalism/normativism would be tightened to focus only on their handling (or not) of reference class and stakes. The priority is depth on the core argument and one compelling empirical demonstration.
