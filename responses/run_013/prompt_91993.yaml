prompt: |-
  I'm a second-year PhD student in political theory, and for the past year I've been sitting in on a fortnightly working group run by a colleague of mine, Ines, who works on democratic theory and has spent most of her career on the boundary problem — the question of who gets to be part of the demos that authorises a collective decision in the first place. Part of the group's routine is that we bring Ines cases and she gives verdicts, and I've been keeping a list. For a binding municipal referendum in a mid-sized river city of about four hundred thousand, near a provincial border, her verdicts so far are: long-term resident non-citizens who have lived in the city for a decade and pay its taxes, in; citizens who emigrated thirty years ago and retain no property or family ties there, out; residents of the city currently serving sentences in the city's own jail, in; adults under full legal guardianship because of profound cognitive disability, in; children, including children of primary-school age, in; non-resident owners of property in the city, out; tourists and business travellers who happen to be in town on polling day, out; corporate entities, out. She is firm about all of these, and she refuses the deflationary move of saying the children and the guardianship cases are really about interests being represented by proxy — she insists those people are members of the demos in the same sense as anyone else.

  Next month the group takes up a live case. The city is holding a binding referendum on a flood-control and water-storage scheme: a dam and reservoir on the river above the city, which would drown a valley in the neighbouring province, displacing roughly twelve thousand people, mostly farmers, and taking their land, in exchange for securing the city's water supply for a century. The vote binds only the city, and the neighbouring province has no veto. The twelve thousand are not residents of the city, hold no property there, are not subject to its bylaws, and live under another province's law; but if the referendum passes, their homes will not exist in five years. Ines has agreed to give a verdict on whether they belong in the demos for that vote, and I'd like to get ahead of her.

  So: predict her verdict on the valley residents. I care much less about the verdict than about the machinery. I want to know which rules are still standing after her earlier verdicts, which of those rules are observationally equivalent on everything she has said so far, what each one predicts about the dam vote, and which of them I should bet she is actually running, with reasons. Then name the single further case — something I could actually put to her — that would do the most to separate the surviving rules, and say what each rule predicts about that case. If her record genuinely leaves the answer open, say so, and tell me what she would be committing herself to, as a matter of principle, by going each way. You need not cite anyone or point me toward literature; state the principles in plain terms and reconstruct them rather than naming them, since I want to see the machinery and not a set of labels.

  Please lay the answer out in this order: a section headed "Verdict" (one or two sentences on what she will say about the valley residents); a section headed "Rules still standing" (roughly 350 words, one short paragraph per rule, each stating the rule and identifying which of her earlier verdicts keeps it alive and which rules out its rivals); a section headed "What each rule predicts about the dam vote" (a short table, one row per rule, with the prediction and a phrase of justification); a section headed "Which rule she is probably running, and why" (200 to 300 words); a section headed "The case that would settle it" (about 150 words, describing the case and what each rule predicts about it); and a closing section headed "What she would be committing to either way" (about 100 words).
reasoning: |-
  Hmm, the user is a PhD student in political theory working with Ines on democratic boundary problems. They've observed Ines' verdicts on various cases for municipal referendums and now want to predict her stance on valley residents affected by a dam project. The core challenge is reverse-engineering Ines' underlying principles from her past decisions.

  First, I need to analyze Ines' previous verdicts systematically. Her pattern rejects both territorial/residency purism and citizenship-based exclusions, while including disenfranchised groups like prisoners and cognitively disabled adults as direct members. The emphatic inclusion of children without proxy representation is particularly telling—it suggests a principle that transcends conventional capacity-based exclusions.

  Looking at the dam case, the valley residents present a classic "all-affected" dilemma, but Ines' past rejections of non-resident property owners and tourists indicate she doesn't equate mere affectedness with membership. Her inclusion of tax-paying non-citizens and exclusion of emigrants points toward present subjection to collective decisions as the key. For the valley residents, while they're catastrophically affected, they lack the ongoing reciprocal relationship with the city's governance that characterized her previous inclusions.

  The strongest surviving principles seem to be Rule A (subject to authority) and Rule B (subject to decisions), both differentiated by their treatment of future impositions. The clearest test case would involve permanent future subjection—like annexing territory—where Rule A would include future subjects immediately while Rule B would delay inclusion until the imposition occurs.

  If Ines excludes the valley residents, she commits to denying membership based on sheer territorial separation, even amid severe harm. If she includes them, she embraces unbounded affectedness, which could destabilize democratic units. Her consistency likely leans toward exclusion, preserving the polity's agency while acknowledging the moral tragedy through other channels.
answer: |-
  ### Verdict
  Ines will rule that the valley residents **do not** belong in the demos for this referendum. They are not subject to the city's ongoing authority or decisions, despite being profoundly affected by this specific outcome.

  ### Rules still standing
  **Rule A (Subject to Authority):** Membership requires being currently subject to the city's laws, governance, and enforceable collective decisions. *Kept alive by:* Including long-term resident taxpayers (subject to bylaws/taxes), prisoners (subject to city jail/courts), and excluding emigrants (no longer subject), property owners (not subject to bylaws), tourists (temporary presence ≠ subjection). *Rules out:* Simple residency (tourists out), citizenship (non-citizen residents in), mere affected interest (property owners/tourists out despite interests).

  **Rule B (Subject to Decisions):** Membership requires being bound *as an individual* by the enforceable outcomes of the demos's collective decisions, regardless of residency or capacity. *Kept alive by:* Including prisoners (bound by decisions while incarcerated) and adults under guardianship (bound by laws like anyone), and excluding emigrants (not bound by current decisions). *Rules out:* Capacity-based exclusions (guardianship cases/children in), territorial purism (emigrants out despite past ties), and simple representation of interests (proxy rejected for children/disabled).

  **Rule C (Enduring Membership Nexus):** Membership requires a stable, reciprocal relationship with the polity based on presence and participation in its social/political life, not merely legal status or transient effects. *Kept alive by:* Including long-term resident non-citizens (enduring ties) and excluding emigrants (ties broken), tourists (transient), and property owners (purely economic link). *Rules out:* Formal citizenship (non-citizens in), temporary presence (tourists out), and property-based claims (owners out).

  ### What each rule predicts about the dam vote
  | Rule                  | Prediction for Valley Residents | Justification                                                                 |
  | :-------------------- | :------------------------------ | :---------------------------------------------------------------------------- |
  | Rule A (Subject to Authority) | **OUT**                         | Not subject to city's laws/bylaws; live under another province's authority.   |
  | Rule B (Subject to Decisions) | **OUT**                         | They aren't bound *as individuals* by the city's *ongoing* enforceable decisions; the dam is a one-time imposition, not a rule they live under. |
  | Rule C (Enduring Membership Nexus) | **OUT**                         | Lack stable presence, participation, or reciprocal relationship with the city; connection is solely through external harm. |

  ### Which rule she is probably running, and why
  Ines is most likely running **Rule A (Subject to Authority)**, potentially incorporating elements of Rule C. Rule A cleanly explains the core pattern: inclusion hinges on being governed *now* by the city's authority structures. Prisoners are subject to the city's jail system and courts. Long-term residents pay taxes and live under bylaws. Emigrants, property owners, and tourists lack this subjection. Rule B struggles with the guardianship case and children – they are bound by decisions, but their inclusion seems driven more by their *presence within the authority structure* despite incapacity, not just the abstract fact of being bound. Rule C explains the emphasis on long-term residents vs. transients but is vaguer on prisoners and the disabled. Rule A is the most parsimonious fit: it uses a clear, institutional criterion (current subjection to enforceable authority) that aligns with all verdicts. Her refusal of proxy representation for children/disabled underscores that physical presence within the jurisdiction *is* the key trigger for membership under its authority, irrespective of capacity to participate. The dam's victims, while catastrophically affected, exist entirely outside this structure of authority.

  ### The case that would settle it
  **The Annexation Vote:** The city holds a binding referendum to annex a contiguous, unincorporated township (pop. 5,000) into its municipal boundaries. If annexed, township residents would immediately become subject to city taxes, bylaws, and services. They currently govern themselves via a county board. Should current township residents be in the city's demos *for this annexation vote*?

  *   **Rule A (Subject to Authority) Predicts: OUT.** They are not *currently* subject to the city's authority; annexation would impose it.
  *   **Rule B (Subject to Decisions) Predicts: IN.** The vote directly decides whether they will be bound by the city's future enforceable decisions as individuals.
  *   **Rule C (Enduring Nexus) Predicts: OUT (or ambiguous).** They lack a current relationship with the city. Annexation would create it, but they aren't part of the city's existing social/political fabric *yet*.

  ### What she would be committing to either way
  *   **If she includes the valley residents:** She commits to the "all-affected" principle being paramount, overriding territorial jurisdiction. This risks making demoi infinitely expansive and unstable, as anyone significantly affected by a decision anywhere could claim membership.
  *   **If she excludes them (as predicted):** She commits to the pre-eminence of bounded political community and reciprocal subjection to authority as the foundation of membership, accepting that profound externalities must be addressed through inter-polity negotiation or moral claims, not membership within the acting demos.
