  Okay, the user is diving deep into classical Indian epistemology, specifically Nyāya, and they're grappling with how we treat expert consensus in everyday life and science. They notice a tension: we rely on experts without verifying their work, yet we preach "question authority." They want to know if the Nyāya view of testimony as a fundamental source of knowledge (śabda as pramāṇa) is what underlies this practice, or if a reductionist view (like Hume's) could work instead. 

  Hmm, this is a sophisticated question. The user clearly has background in both epistemology and Nyāya, given how precisely they frame the contrast. They’re not just asking for definitions; they want a reconstruction of the implicit epistemology in our practices. The phrase "nagging at me" suggests they’ve wrestled with this—probably feeling that reductionism doesn’t fully capture how we *actually* treat expertise. 

  First, I need to unpack Nyāya’s stance. For them, testimony isn’t a shortcut for lazy thinkers; it’s a direct knowledge-source because understanding a sincere expert’s words *just is* knowing. The user’s vaccine/climate examples are perfect: when I read "CDC says the vaccine is safe," I don’t mentally calculate the CDC’s past accuracy; I just... accept it. Nyāya would call this *śabda-pramāṇa* in action—knowledge from the semantic content itself, not inference. 

  But the user also mentions science’s internal reliance on citations. That’s key! A researcher citing a study isn’t betting on the author’s reliability; they’re treating the claim *as knowledge* to build upon. Reductionism would make science impossibly recursive—every citation requiring a mini-audit of the cited author’s track record. Nyāya avoids this by making testimony basic. 

  Now, what does the practice *presuppose*? At minimum: that understanding an expert assertion can directly justify belief. But it doesn’t *require* Nyāya’s metaphysics (like the speaker’s "competence" as a truth-grounding factor). A softer, non-reductionist view like Tyler Burge’s "acceptance principle" could also work—it just says we’re entitled to trust testimony unless defeated. 

  But if we swapped in reductionism? Chaos. Every citation would need a footnote proving the cited author’s reliability. Teaching would become paralysing ("Kids, trust NASA... but first verify their papers!"). The practice *might* survive in elite circles where track records are visible (e.g., a lab head vouching for her student), but laypeople would be epistemically stranded. We’d either distrust everything or blindly trust "authority"—which ironically violates reductionism’s own ideal. 

  The user’s deeper itch might be about epistemic responsibility: How can we reconcile trust in experts with critical thinking? Nyāya’s answer: trusting testimony *is* rational, but you *can* investigate if red flags arise (e.g., conflicting expertise). That’s wiser than claiming we "infer" reliability while actually relying on gut feelings about institutional credibility. 

  ...I’ll lean into reconstructing the practice’s implicit rules, then show why reductionism would break it. The user wants reasoning, not name-dropping—so I’ll avoid "Vātsyāyana says..." unless it’s crucial. Focus on the vaccine/climate cases and citation practices to keep it concrete.
answer: |-
  Let's reconstruct the epistemology implicit in our deference to expert consensus, using Nyāya's framework while contrasting it with reductionist (Humean/Lockean) accounts. I'll proceed stepwise, analyzing the practice, reconstructing commitments, and testing replacements.

  **Brainstorming: Core Features of the Practice**
  1. **Directness**: Laypeople form beliefs *immediately* upon encountering expert consensus ("WHO says safe" → belief), without mental steps tracking reliability.
  2. **Non-Skeptical Default**: We treat consensus as *prima facie* credible without prior verification; the burden is on skeptics to disprove it.
  3. **Source-Agnosticism**: We accept testimony from unknown/unverified experts (e.g., IPCC scientists we've never met).
  4. **Institutional Reliance**: Citations in science function as *knowledge-transfer*, not mere pointers for verification.
  5. **Criticality Asymmetry**: While we urge "questioning authority," we don't require individuals to reconstruct expert knowledge; critique operates at the margins (e.g., peer review) or when consensus fractures.

  **Nyāya Reconstruction: Śabda as Pramāṇa**  
  Nyāya grounds this practice in four theses:

  1. **Testimony as Generative (Not Derivative)**:  
     - Śabda generates *new* knowledge (*pramā*) in the hearer via semantic competence. When you understand "Vaccine X is safe" from CDC, knowledge arises *directly*—provided Nyāya's conditions hold.  
     - *Contrast with reductionism*: Hume requires an inference: "CDC said P → CDC is reliable → P is true." Our practice lacks this inferential chain.

  2. **Conditions for Testimony to be Pramāṇa**:  
     - **Speaker (Āpta)**: Must be (a) *competent* (jñānāvān) and (b) *truthful* (satyapratipanna).  
     - **Hearer**: Must (a) *understand* the utterance semantically and (b) *recognize* the speaker as āpta *in context* (not universally).  
     - *Key nuance*: Recognition isn't a track-record inference; it's a defeasible default based on institutional role, credentials, or consensus itself (e.g., "IPCC scientists are experts on climate" is immediate).

  3. **Why Not Inference?**  
     Nyāya rejects reducing śabda to inference (*anumāna*) because:  
     - **Epistemic Economy**: If testimony required verifying every speaker's reliability, knowledge acquisition would collapse (children couldn't learn language; science couldn't build cumulative knowledge).  
     - **Phenomenology**: We don't *feel* ourselves inferring when trusting experts; belief arises upon comprehension.  
     - **Regress Problem**: If testimony is inference, what justifies premises about reliability? More testimony → infinite regress.

  **What the Practice Strictly Presupposes vs. What It Fits**  
  - **Strict Presuppositions**:  
    1. Testimony can *directly* justify belief.  
    2. Expert consensus provides *prima facie* warrant (defeasible, but sufficient absent defeaters).  
    3. Understanding an assertion is psychologically and epistemically prior to verifying speaker reliability.  

  - **Fits Well With (Not Strictly Required)**:  
    - Nyāya's metaphysical detail (e.g., āpta as a natural kind).  
    - The strong claim that śabda is *always* irreducible (some cases might be inferential).  

  - **Underdetermined Aspects**:  
    1. *Scope of Defeasibility*: Must we check credentials for *every* expert? (Practice says no; Nyāya allows default trust; reductionism requires verification.)  
    2. *Group Testimony*: Can institutions (CDC, IPCC) be āpta? Nyāya can accommodate this; reductionism struggles with collective reliability.  
    3. *The Role of Critical Inquiry*: Both views allow questioning expertise, but differ on *when* it's mandatory. Practice suggests it's triggered by conflict/controversy, not universally.

  **The Reductionist Replacement: Consequences**  
  If we adopted Hume's view (testimony as inference from reliability), our practices would need radical revision:  

  1. **Teaching & Pedagogy**:  
     - Students couldn't accept textbook claims without investigating author reliability. Science classes would become courses in historiography.  
     - "Do your own research" would mean *verifying sources*, not exploring evidence. Education slows to a crawl.  

  2. **Academic Citation**:  
     - Every citation would require an appendix proving the cited author's reliability. Papers become unreadable.  
     - Building on others' work would require independent verification of each premise → scientific progress stalls.  

  3. **Deference to Experts**:  
     - Laypeople couldn't trust medical advice without auditing their doctor's track record → systemic distrust.  
     - Consensus would lose epistemic force (mere numbers don't imply reliability; past reliability ≠ future truth).  

  **Would the Practice Survive?**  
  - **Collapse in Complex Domains**: Climate science, medicine, etc., rely on distributed expertise. Reductionism makes lay knowledge impossible.  
  - **Paradox of "Authority"**: Reductionism condemns "blind trust," yet its demands are practically unmeetable → we'd either ignore it (hypocrisy) or descend into global skepticism.  
  - **Fragile Consensus**: Without default trust, every expert disagreement could paralyze decision-making.  

  **Conclusion: The Nyāya View as Necessary**  
  The practice presupposes testimony as a basic source of knowledge. While a *weak* non-reductionism (e.g., Tyler Burge's "acceptance principle") might suffice, Humean reductionism cannot explain:  
  - The *speed* and *scalability* of knowledge transmission.  
  - Why citations function as knowledge-*transfers*, not invitations for verification.  
  - How nonexperts can rationally defer without inferential labor.  

  Nyāya provides the most coherent foundation: śabda is a pramāṇa because understanding a sincere expert *just is* knowing—when conditions are met. Our practice reflects this ontology. To replace it with reductionism wouldn't just alter theory; it would dismantle the epistemic cooperation undergirding modern science and society. The tension with "question authority" remains, but Nyāya resolves it: trust is default, not dogmatic, and criticality targets *defeaters* (conflict, bias, incompetence)—not the very possibility of testimonial knowledge.
