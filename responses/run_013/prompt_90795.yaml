          = (8p/3) + (4/3 - 4p/3)
          = (8p/3 - 4p/3) + 4/3
          = (4p/3) + 4/3
          = (4/3)(p+1)

     And we know that (4/3)(p+1) >= 4/3 > 1 for all p in [0,1]? Actually, when p=0: (4/3)(0+1)=4/3>1, and when p=1: (4/3)(1+1)=8/3>1.

     Therefore, the mixture gives strictly more than C for every belief p.

     Now, if C were a best response to some belief p, then we would have that for that p, the payoff of C (which is 1) is at least as high as the payoff of any other strategy, including the mixture. But we just saw that the mixture gives strictly more than 1 for every p. Therefore, C cannot be a best response to any belief.

  2. Why that same fact means the option is played with probability zero in every equilibrium, and what those equilibria are.

     In a Nash equilibrium, each player's strategy must be a best response to the other's. Therefore, Player 1 will not play C with positive probability because it is strictly dominated (and hence never a best response). Therefore, in any Nash equilibrium, Player 1 plays only A and B.

     Now, we look for Nash equilibria in the game without C (since C is not played). The reduced game:

          X         Y
      A   (4,-4)   (0,0)
      B   (0,0)    (4,-4)

     We consider mixed strategies for both.

     Let Player 1 play A with probability q and B with probability 1-q.
     Let Player 2 play X with probability r and Y with probability 1-r.

     Player 1's expected payoff:
        If playing A: r*4 + (1-r)*0 = 4r
        If playing B: r*0 + (1-r)*4 = 4(1-r)

     Player 1 is indifferent when 4r = 4(1-r) -> r=1/2.
     So if r>1/2, Player 1 prefers A; if r<1/2, Player 1 prefers B.

     Player 2's expected payoff:
        If playing X: q*(-4) + (1-q)*0 = -4q
        If playing Y: q*0 + (1-q)*(-4) = -4(1-q)

     Player 2 is indifferent when -4q = -4(1-q) -> q=1/2.
     So if q>1/2, Player 2 prefers Y (because -4(1-q) = -4+4q, and when q>1/2, -4+4q < -4q? Actually, we compare -4q and -4+4q: 
          -4q vs -4+4q -> -4q < -4+4q when 0 < -4 + 8q -> 8q>4 -> q>1/2 -> then Player 2 prefers Y (which gives -4+4q) because when q>1/2, -4+4q < -4q? 

     Alternatively, we can see: Player 2 wants to minimize the payoff (since he is adversarial) or we can think in terms of his own payoff which he maximizes. Since his payoffs are negative, he prefers the less negative.

     When q>1/2:
          Playing X: -4q (which is less than -2) and playing Y: -4(1-q) = -4+4q. Since q>1/2, then 4q>2, so -4+4q > -2 -> so playing Y gives a higher payoff (less negative) than playing X? Then Player 2 prefers Y.

     Similarly, when q<1/2: playing X gives -4q (which is greater than -2 because q<1/2) and playing Y gives -4+4q (which is less than -2) -> so Player 2 prefers X.

     Therefore, the best response for Player 2:
          r = 1 (play X) if q < 1/2
          r = 0 (play Y) if q > 1/2
          and any r in [0,1] if q=1/2.

     Now, the best response for Player 1:
          q = 1 (play A) if r > 1/2
          q = 0 (play B) if r < 1/2
          any q in [0,1] if r=1/2.

     Therefore, the Nash equilibrium is when q=1/2 and r=1/2.

     So the only Nash equilibrium is: Player 1 plays A with probability 1/2 and B with probability 1/2, and Player 2 plays X with probability 1/2 and Y with probability 1/2. And indeed, C is played with probability 0.

  3. Which single feature of the table is doing the real work?

     The key feature is that strategy C is strictly worse than a particular mixture of A and B in every circumstance (i.e., for every action of the opponent). To make C undominated, we would have to break this strict dominance. We could do that by either:

        a) Increasing the payoff of C in at least one column so that it is no longer strictly less than the mixture in that column.

        For example, if we set the payoff of C in column X to be 3, then in column X:
            mixture: 8/3 ≈ 2.666 < 3 -> then the mixture does not dominate in X.

        Then C would not be strictly dominated by that mixture. But note: we have to check if it becomes dominated by a different mixture or by a pure strategy. However, in this case, it might become undominated.

        b) Alternatively, we could change the payoffs of A or B to break the inequality.

     Why would giving the opponent a third option undermine the example?

     If we add a third column for Player 2 (say Z), then we need the mixture to still strictly dominate C in that new column. But if we set the payoff of C in column Z to be very high (say 5) and the payoffs of A and B in column Z to be very low (say 0), then the mixture in column Z would be (2/3)*0 + (1/3)*0 = 0, which is less than 5. Then the mixture would not dominate C in column Z. Therefore, C might not be dominated by that mixture anymore. And if there is no other mixture that dominates C in all columns (including Z), then C might become undominated.

     Therefore, we must design the new column Z carefully: the payoff of C in Z must be less than the mixture of A and B in Z. For example, if in column Z we set:
          A: 3, B: 3, C: 2
     then the mixture: (2/3)*3 + (1/3)*3 = 3 > 2 -> then it would still dominate.

     But if we set arbitrarily, we might break the domination.

  **Housekeeping:**

  What if we read the same numbers as weakly beaten rather than strictly beaten?

  If we require weak domination by a mixed strategy, then we would have the mixture giving at least as much as C in every column and strictly more in at least one. In our example, the mixture gives strictly more in every column. So it is strictly dominating. If we change the example to have:

          X    Y
      A   4    0
      B   0    4
      C   8/3  4/3   [which equals the mixture payoffs: 8/3 and 4/3]

  Then the mixture would weakly dominate C (but not strictly). Then C might be played in equilibrium? Actually, in that case, the mixture and C are payoff-equivalent. Then C could be played in equilibrium. For example, Player 1 might play C with positive probability. However, note that in the Nash equilibrium we found earlier, the mixture (2/3,1/3) is the same as the payoffs of C? Actually, we changed C to be equal to the mixture. Then in that case, C is not strictly dominated but weakly dominated. Then in equilibrium, Player 1 might include C? But note: there might be multiple equilibria. However, the set of strategies that survive iterated elimination of strictly dominated strategies would not include C because we only eliminate strictly dominated strategies. But if we are eliminating weakly dominated strategies, then we might eliminate C. But the problem says "throw out the options that are never a good idea", and if they are weakly dominated, they might still be best responses (though not strictly best). So the interpretation may vary.

  In our original strict dominance example, it's clear: C is never a best response. In the weak case, it might be a best response (if the belief is such that the mixture and C yield the same payoff). So strictness is important for the "never" part.

  Therefore, in the example we use strict domination.

  **Summary of the example:**

  Game: 
  - Player 1: chooses A, B, or C.
  - Player 2: chooses X or Y.

  Payoff matrix (Player 1, Player 2):

  ```
          X           Y
  A   (4, -4)     (0, 0)
  B   (0, 0)      (4, -4)
  C   (1, -1)     (1, -1)
  ```

  Analysis:
  - C is strictly dominated by (2/3 A, 1/3 B).
  - Eliminate C -> reduced game with A and B for Player 1 and X and Y for Player 2.
  - In the reduced game, no further pure strategy domination.
  - The Nash equilibrium: Player 1 mixes A and B each with 1/2, Player 2 mixes X and Y each with 1/2.

  This example meets all requirements.
