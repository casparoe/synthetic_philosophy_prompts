  Below is a complete, self-contained example tailored to your request. I've constructed a minimal game (3 strategies for Player 1, 2 for Player 2) with small whole-number payoffs, unequal mixing weights, and a concrete scenario. The example is rigorously defended and includes all requested explanations.

  ---

  ### **The Scenario: The Ice Cream Cart Wars**
  Two rival ice cream vendors, Alex and Bailey, operate on a beach with three locations: **Left**, **Middle**, and **Right**. Each morning, they independently choose where to set up their carts. Customers cluster in two zones: **Surfers** (near the left) and **Families** (near the right). Payoffs depend on proximity to customers and competition:  
  - If a vendor is alone near a high-demand zone, they profit more.  
  - The **Middle** location is mediocre—it catches some customers from both zones but never excels.  

  Alex (Player 1) chooses: **Left**, **Middle**, or **Right**.  
  Bailey (Player 2) chooses: **Surfers** or **Families** (i.e., which zone to prioritize).  

  **Payoff Table (Alex’s Payoff, Bailey’s Payoff):**  
  *(Alex’s payoffs are designed for dominance; Bailey’s are arbitrary but consistent)*  

  | Alex \ Bailey | Surfers       | Families      |
  |--------------|---------------|---------------|
  | **Left**     | (4, 1)        | (0, 2)        |
  | **Right**    | (0, 2)        | (4, 1)        |
  | **Middle**   | (1, 0)        | (1, 0)        |

  ---

  ### **Step-by-Step Analysis**
  #### **1. Eliminating "Never a Good Idea" Options**
  We check if any of Alex’s options (**Left**, **Middle**, **Right**) are strictly dominated.  

  - **Is *Middle* dominated by *Left*?**  
    - Against *Surfers*: *Left* (4) > *Middle* (1) → *Left* better.  
    - Against *Families*: *Left* (0) < *Middle* (1) → *Middle* better.  
    **→ *Left* does NOT dominate *Middle*.**  

  - **Is *Middle* dominated by *Right*?**  
    - Against *Surfers*: *Right* (0) < *Middle* (1) → *Middle* better.  
    - Against *Families*: *Right* (4) > *Middle* (1) → *Right* better.  
    **→ *Right* does NOT dominate *Middle*.**  

  - **Is *Middle* dominated by a mixture of *Left* and *Right*?**  
    Consider a mixed strategy: **2/3 Left, 1/3 Right** (unequal weights).  
    - Against *Surfers*:  
      (2/3)(4) + (1/3)(0) = 8/3 ≈ 2.67 > 1 (*Middle*’s payoff).  
    - Against *Families*:  
      (2/3)(0) + (1/3)(4) = 4/3 ≈ 1.33 > 1 (*Middle*’s payoff).  
    **→ The mixture strictly dominates *Middle* in both cases!**  

  **Conclusion:** *Middle* is strictly dominated by the mixed strategy **2/3 Left, 1/3 Right**. We eliminate *Middle*.  

  #### **2. Reduced Game After Elimination**
  Alex now chooses only **Left** or **Right**. Bailey still chooses **Surfers** or **Families**.  

  | Alex \ Bailey | Surfers   | Families  |
  |--------------|-----------|-----------|
  | **Left**     | (4, 1)    | (0, 2)    |
  | **Right**    | (0, 2)    | (4, 1)    |

  - **No further pure-strategy dominance:**  
    - *Left* vs. *Right*: Neither dominates the other (each wins in one scenario).  
    - Bailey’s strategies: No dominance (e.g., *Surfers* is better if Alex picks *Left*, but worse if Alex picks *Right*).  
  **→ Surviving options: {Left, Right} for Alex, {Surfers, Families} for Bailey.**  

  #### **3. Order of Elimination Doesn’t Matter**  
  - If we first check Bailey’s strategies, neither is strictly dominated:  
    - Against *Left*: *Families* (2) > *Surfers* (1) → *Families* better.  
    - Against *Right*: *Surfers* (2) > *Families* (1) → *Surfers* better.  
    → No elimination for Bailey.  
  - Proceeding to Alex, *Middle* is eliminated as before.  
  **→ The final surviving set is unchanged.**  

  ---

  ### **Key Explanations**  
  #### **1. Why *Middle* cannot be a best reply to any belief**  
  - Suppose Alex has a belief about Bailey’s choice (e.g., probability \( p \) Bailey chooses *Surfers*, \( 1-p \) chooses *Families*).  
  - *Middle*’s expected payoff: \( 1 \times p + 1 \times (1-p) = 1 \).  
  - The mixture **2/3 Left, 1/3 Right**’s expected payoff:  
    \[
    \left(\frac{2}{3}\right)\left[4p + 0(1-p)\right] + \left(\frac{1}{3}\right)\left[0p + 4(1-p)\right] = \frac{8p}{3} + \frac{4(1-p)}{3} = \frac{4p + 4}{3}.
    \]  
  - Since \( \frac{4p + 4}{3} \geq \frac{4}{3} > 1 \) for all \( p \) (even at \( p=0 \), it’s \( \frac{4}{3} \approx 1.33 > 1 \)), the mixture **always yields more than *Middle***.  
  - Thus, for any belief, *Middle* is never the best choice—Alex can always do better with the mixture.  

  #### **2. Why *Middle* is never played in equilibrium, and what equilibria exist**  
  - In equilibrium, players only play strategies that are best replies to each other. Since *Middle* is never a best reply (as shown above), Alex plays it with **probability 0**.  
  - **Equilibrium analysis:**  
    - Alex mixes **Left** (\( q \)) and **Right** (\( 1-q \)).  
    - Bailey mixes **Surfers** (\( r \)) and **Families** (\( 1-r \)).  
    - Alex’s best response: Chooses *Left* if \( 4r > 4(1-r) \) (i.e., \( r > 0.5 \)), *Right* if \( r < 0.5 \), indifferent if \( r = 0.5 \).  
    - Bailey’s best response: Chooses *Surfers* if \( 1q + 2(1-q) > 2q + 1(1-q) \) → simplifies to \( q < 0.5 \); *Families* if \( q > 0.5 \); indifferent if \( q = 0.5 \).  
  - **Nash equilibrium:**  
    - \( q = 0.5 \) (Alex: 50% *Left*, 50% *Right*).  
    - \( r = 0.5 \) (Bailey: 50% *Surfers*, 50% *Families*).  
  - *Middle* has 0% probability in all equilibria.  

  #### **3. The single feature doing the real work**  
  - **The critical feature:** *Middle*’s payoffs are **uniformly mediocre** (1 in both columns), while *Left* and *Right* have **high-but-unbalanced payoffs** (4 in one column, 0 in the other).  
    - This allows a mixture to "balance" the weaknesses: *Left* covers *Surfers*, *Right* covers *Families*, and the weights (2/3, 1/3) ensure the mixture always beats *Middle*.  
  - **To make *Middle* undominated:**  
    - Increase *Middle*’s payoff in **one column** (e.g., set it to 2 against *Surfers*). Then:  
      - Against *Surfers*: Mixture = \( \frac{2}{3}(4) + \frac{1}{3}(0) = \frac{8}{3} \approx 2.67 > 2 \) → still dominates.  
      - Against *Families*: Mixture = \( \frac{4}{3} \approx 1.33 > 1 \) → still dominates.  
    - **Required change:** Increase *Middle*’s payoff to **> 8/3 (≈2.67) against *Surfers* OR > 4/3 (≈1.33) against *Families***. For example:  
      - Set *Middle* = 3 against *Surfers*. Now:  
        - Against *Surfers*: Mixture (2.67) < 3 → mixture no longer dominates.  
        - *Middle* is no longer strictly dominated.  
  - **Adding a third column for Bailey:**  
    - Suppose Bailey has a new action, *Beach-Entry*, with payoffs:  
      - *Left*: 0, *Right*: 0, *Middle*: 3.  
    - The mixture gives \( \frac{2}{3}(0) + \frac{1}{3}(0) = 0 < 3 \) → fails to dominate *Middle* in this column.  
    - **To preserve the example**, set payoffs so the mixture still beats *Middle* in the new column (e.g., *Left*: 4, *Right*: 2, *Middle*: 2 → mixture = \( \frac{2}{3}(4) + \frac{1}{3}(2) = \frac{10}{3} \approx 3.33 > 2 \)).  

  ---

  ### **Housekeeping: Strict vs. Weak Beating**  
  If "beaten" means **weakly** (≤ instead of <), *Middle* might survive:  
  - If we set *Middle*’s payoffs to exactly **8/3 vs. *Surfers* and 4/3 vs. *Families***, the mixture now *weakly* dominates *Middle* (equal in both columns).  
  - *Middle* **could** be a best reply (if Alex believes Bailey plays *Surfers* with probability 0.6, *Middle* and the mixture yield equal payoffs).  
  - In equilibrium, *Middle* **might be played** (e.g., Alex plays pure *Middle* if Bailey plays *Surfers* with probability 0.6).  
  **→ Strictness is essential for "never a good idea."**  

  ---

  ### **Why This Game is Minimal**  
  - **Player 1 must have ≥3 strategies:** With 2 strategies, mixtures reduce to pure strategies (no "mixing work").  
  - **Player 2 must have ≥2 strategies:** With 1 strategy, if a mixture dominates *Middle*, one pure strategy must too (by the averaging argument in Explanation 1).  
  - **No smaller game (e.g., 2x2 or 3x1) can show this phenomenon.**  

  This example is airtight, counterintuitive, and ready for your club. Good luck!
