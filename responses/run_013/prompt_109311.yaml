prompt: |-
  I spent thirty-seven years in experimental condensed-matter physics before retiring, and for the last four years I have been sitting in on graduate seminars in philosophy, chiefly formal epistemology and the philosophy of artificial intelligence. This term I am attending a seminar on self-reference and self-trust in artificial agents, and the instructor has asked me—as the resident outsider—to contribute one question to the final examination. The students are a mixed group from philosophy, computer science, and, in my case, physics. They can all recite the standard result about the Löbian obstacle: if an agent's reasoning is formalized in a consistent, recursively axiomatizable theory T that extends enough arithmetic, and the agent adopts the full reflection schema—for every sentence φ, from a proof of φ in T infer φ—then, by the theorem of Löb, the theory proves φ for every φ, and so is inconsistent. I do not want a question that merely asks them to reproduce that. I want a question that forces them to distinguish three things they currently run together: trusting one's current theory, trusting a syntactically restricted fragment of it, and trusting a successor theory that one has proved sound in the current theory. My physicist's intuition is that the third is just the first one level up, and that if you can prove the successor sound, you should be able to use it; but the diagonal lemma seems to make the proof of soundness eat its own tail, and I cannot get clear on where the bite is.

  Please draft the exam question, a model answer of about 800 words, and a marking scheme for a 75-minute closed-book final. I would like the question built around a concrete proposal of the sort a student might offer: for instance, that the agent avoid the obstacle by adopting a trust schema only for sentences of bounded quantifier complexity, or only for proofs shorter than some fixed length, or by proving in T that a successor theory S is sound—where S is either T itself, a finite extension of T by a sentence A that T does not prove, or a subtheory of T—and then using S's proofs. The question should have three parts, worth 6, 10, and 9 marks (25 total), and should require students to say which of these proposals are consistent (assuming T is consistent), which are blocked by Löb's theorem, and why the move from T proves that S proves φ to φ is not the same as T proves φ. It should also ask them to state a necessary condition for T to prove the soundness of S, and to say whether any non-trivial version of the trust proposal survives. Then give the model answer, making the key moves explicit, and a marking scheme that lists five must-hit points, the marks each is worth, and a one-line note on the common error that costs marks at each point. Do not ask for citations, reading lists, or names of papers; the exam is closed-book and the students have the standard results in their notes. The question must be self-contained: explain any technical terms you use inside the question itself, since not everyone in the room has a logic background.
reasoning: |-
  We are going to design an exam question with three parts. The goal is to distinguish between:
   (A) Trusting one's current theory T (which leads to inconsistency by Löb's theorem if T is consistent and sufficiently strong).
   (B) Trusting a syntactically restricted fragment of T (e.g., sentences of bounded quantifier complexity or proofs of bounded length).
   (C) Trusting a successor theory S that one has proved in T to be sound.

   We will present a concrete proposal that a student might make and then break it down.

   The proposal: An agent using a theory T (consistent, recursively axiomatizable, extending enough arithmetic) might try to avoid the Löbian obstacle by proving in T that a successor theory S is sound (i.e., T ⊢ "S is sound") and then trusting S for all sentences. We consider three cases for S:
     (i) S is T itself.
     (ii) S is a finite extension of T by a sentence A that T does not prove (so S = T + A).
     (iii) S is a subtheory of T.

   The exam question:

   Question: 
   An agent uses a consistent, recursively axiomatizable theory T that extends Robinson arithmetic (or PA). The agent wishes to avoid the Löbian obstacle (which shows that adopting the full reflection schema for T leads to inconsistency) by instead proving in T that a successor theory S is sound and then using S's proofs. Consider three candidate definitions of S:

     Option (i): S is T itself.
     Option (ii): S is a finite extension of T by a sentence A that T does not prove (so S = T + A).
     Option (iii): S is a subtheory of T (so S ⊆ T).

   (a) [6 marks] For each option (i), (ii), and (iii), state whether it is possible for T to prove the soundness of S (i.e., T ⊢ "for all φ, if S ⊢ φ then φ") assuming T is consistent. If it is possible, give a brief reason why; if not, state the reason why not.

   (b) [10 marks] The agent then proposes the following trust rule: whenever the agent has a proof in S of a sentence φ, then the agent accepts φ. This rule can be formalized as: for every φ, if S ⊢ φ then φ. However, note that the agent is using T and has proved the soundness of S in T. Therefore, the agent might be tempted to use the fact that T ⊢ (S ⊢ φ → φ) for every φ. 

       (i) Explain why, for any fixed φ, if T proves S ⊢ φ → φ, then by the formalized version of Löb's theorem (which holds in T) we have T ⊢ φ. 
       (ii) Now, consider the move: from having a proof of φ in S to accepting φ. This move seems to be justified by the soundness of S, which T has proved. However, the agent is using T to reason. Explain why this move is not the same as T proving φ. In particular, when the agent accepts φ because S ⊢ φ and T has proved S sound, is this acceptance equivalent to T ⊢ φ? Why or why not?
       (iii) For which of the options (i), (ii), (iii) above (if any) does the agent's trust rule lead to inconsistency? For each option, explain why or why not.

   (c) [9 marks] The agent then considers a different approach: instead of trusting the entire S, they trust only a syntactically restricted fragment of S. For example, they might adopt a reflection rule only for sentences φ that are Π_1 (or more generally, for sentences of bounded quantifier complexity) or only for proofs in S that are shorter than a fixed length.

       (i) Why might such restrictions avoid the Löbian obstacle? 
       (ii) Give an example of a non-trivial soundness result that T can prove about such a restricted fragment of S. (For instance, T might prove that S is sound for Π_1 sentences, or that all proofs in S of length at most n are sound.)
       (iii) In the case of bounded proof length, the agent might trust a sentence φ if there is a proof of φ in S of length at most k (for some fixed k). However, the agent must choose k in advance. Explain why, even if T proves that all proofs in S of length at most k are sound, the agent cannot use this to trust proofs of length greater than k without risking inconsistency.

       (iv) What is a necessary condition for T to be able to prove the soundness of S for Π_1 sentences? (Hint: think about the consistency of S.)

   Model Answer (approx 800 words):

   (a) 
     Option (i): T proving the soundness of T itself is impossible (if T is consistent). Why? If T ⊢ "for all φ, if T ⊢ φ then φ", then in particular for any φ, T proves (T ⊢ φ → φ). By Löb's theorem, since T is consistent and sufficiently strong, this would imply T ⊢ φ for every φ, making T inconsistent.

     Option (ii): T proving the soundness of S = T+A (with A unprovable in T) is also impossible. Note that the soundness of S implies the consistency of S (take φ to be ⊥). But by Gödel's second incompleteness theorem, if T is consistent, then T cannot prove the consistency of T+A (because T+A is consistent only if T does not prove ¬A, which it doesn't by assumption, but T doesn't know that). Moreover, if T were to prove the soundness of S, then it would prove the consistency of S, which it cannot (unless T is inconsistent). Therefore, T cannot prove the soundness of S.

     Option (iii): T can prove the soundness of a subtheory S of T. Why? Since S is a subtheory, every theorem of S is a theorem of T. Therefore, T can prove: if S ⊢ φ then T ⊢ φ. But T also knows that its own theorems are true? Not exactly. However, note that T can prove the soundness of S by induction over the proof in S (if S is finitely axiomatized, or if it is a recursive set of axioms that T can handle). For example, if S is Robinson arithmetic (Q), then T (which extends Q) can prove the soundness of Q. But note: T cannot prove the soundness of T itself, but it can prove the soundness of weaker theories.

   (b)
     (i) Suppose T proves S ⊢ φ → φ for a fixed φ. Then by the formalized Löb's theorem (which says that T ⊢ Bew_T(#ψ) → ψ implies T ⊢ ψ for any ψ) we have T ⊢ φ. But note: in this case, the formula we are considering is ψ ≡ (S ⊢ φ → φ). However, we are assuming T ⊢ (S ⊢ φ → φ). Then by the deduction theorem, we have T ⊢ Bew_T(#(S ⊢ φ → φ)) and then by Löb's theorem for T applied to ψ = φ, we get T ⊢ φ? Actually, we must be careful. The formalized Löb's theorem says: if T ⊢ Bew_T(#ψ) → ψ, then T ⊢ ψ. But in our case, we have T ⊢ (S ⊢ φ → φ). However, note that Bew_T(#(S ⊢ φ → φ)) is a stronger condition (it says that T proves that it has a proof of (S ⊢ φ → φ)). We are assuming T ⊢ (S ⊢ φ → φ) but not necessarily that T knows that it has a proof. However, in the setting of sufficiently strong theories, if T proves a sentence, then T proves that it has a proof (by the representability of the proof predicate). So T ⊢ (S ⊢ φ → φ) implies T ⊢ Bew_T(#(S ⊢ φ → φ)) and then by Löb's theorem for T applied to ψ = φ, we get T ⊢ φ. But note: Löb's theorem is about T's own proof predicate. We have to relate S's proof predicate to T's. However, since S is an extension (or subtheory) of T, we can formalize that. Actually, the above argument requires that T can prove that if S proves φ then T can prove that S proves φ (which is true if S is recursively axiomatized and T is strong enough). So the step is: T ⊢ (S ⊢ φ → φ) implies T ⊢ Bew_T(#(S ⊢ φ → φ)) [because T can prove its own proofs] and then by Löb's theorem for T, we get T ⊢ φ.

     However, note that the above argument is for a fixed φ. But in the agent's trust rule, we are talking about a general rule: for every φ, the agent accepts φ if S proves φ. This is not a single sentence but a rule.

     (ii) The move from S ⊢ φ to φ is a rule of inference that the agent is adopting. It is not the same as T proving φ because the agent is not using T to prove φ; instead, the agent is using the fact that S has a proof of φ and then concluding φ by the rule. However, note that T has proven the soundness of S: T ⊢ ∀φ (Prov_S(φ) → φ). Therefore, for any φ, if S ⊢ φ, then T proves Prov_S(#φ) (by representability) and then by the soundness statement, T proves φ. Therefore, if S ⊢ φ, then T ⊢ φ. So the rule is equivalent to: whenever S proves φ, then T proves φ. But note: this does not mean that the agent is deriving φ in T without the rule. The rule is adding the soundness of S as a new inference rule. However, since T has already proved the soundness of S, then any φ that S proves is already provable in T. Therefore, the rule does not actually add any new theorems beyond what T already has. But wait: if T has already proved the soundness of S, then T already proves every theorem of S? Not exactly. The soundness statement is ∀φ (Prov_S(φ) → φ). This is a single sentence. From this, for a particular φ, if T can prove Prov_S(#φ) (i.e., that S proves φ), then T can deduce φ. But note: T may not be able to prove Prov_S(#φ) for every theorem φ of S. For example, if S is a subtheory, then S may prove a sentence φ that T also proves, but T might not know that S proves it (if the proof in S is long and T cannot verify it due to length). However, in sufficiently strong T, since S is recursively axiomatized, T can prove Prov_S(#φ) whenever S actually proves φ. Therefore, for any φ, if S ⊢ φ, then T ⊢ φ. Therefore, the rule does not add any new theorems: it only allows the agent to conclude φ at the moment when they see a proof in S, but T would have been able to prove φ anyway (if given enough time). 

     However, note: what if S is a finite extension? Then S might prove a sentence that T does not prove. But in part (a) we saw that T cannot prove the soundness of S if S is a finite extension by an unprovable sentence. So in the cases where T can prove the soundness of S (only the subtheory case), then S is a subtheory and hence every theorem of S is a theorem of T. Therefore, the rule does not add any new theorems.

     (iii) The trust rule: the agent accepts φ whenever S ⊢ φ. This rule is implemented by the agent's reasoning in T plus the soundness of S. But note: if the agent is using T and the rule, then the agent is effectively using T plus the reflection rule for S. However, since T has already proved the soundness of S, then the rule is redundant: the agent could have just used T to prove φ without the rule. Therefore, the agent does not become inconsistent by the rule in the case of a subtheory (option (iii)) because the rule does not extend the set of theorems. For options (i) and (ii), T cannot prove the soundness of S (as established in (a)), so the rule cannot even be set up. Therefore, the rule only makes sense in option (iii) and it is safe (but trivial).

   (c)
     (i) The Löbian obstacle arises when we have a reflection principle for all sentences. By restricting to a bounded fragment (either by quantifier complexity or by proof length), we avoid the fixed-point constructions that lead to the inconsistency. For example, the diagonal lemma (which constructs self-referential sentences) typically requires unbounded quantifier complexity. Similarly, if we fix a bound on proof length, then the set of sentences for which we have reflection is finite (or at least does not include the long self-referential sentences that cause trouble).

     (ii) For example, T can prove that S is sound for Π_1 sentences (i.e., for every Π_1 sentence φ, if S ⊢ φ then φ) provided that S is consistent. Why? Because if S is inconsistent, it proves every sentence, including false Π_1 sentences. But if S is consistent, then since T is stronger than S (if S is a subtheory) and T can verify the truth of Π_1 sentences that are provable in S? Actually, T can prove: if S is consistent, then every Π_1 sentence provable in S is true. This is because Π_1 sentences are downward absolute: if they are true in a model of the natural numbers, then they are true. And T can formalize that. However, note that T cannot prove the consistency of T itself, but it can prove the consistency of a subtheory S. Therefore, for a subtheory S, T can prove the soundness of S for Π_1 sentences.

     (iii) The agent fixes k and trusts all proofs in S of length ≤ k. T can prove that every proof in S of length ≤ k is sound. However, the agent cannot extend this trust to proofs of length k+1 without risking inconsistency. Why? Because if the agent were to adopt a new rule that trusts proofs of length ≤ k+1, then the agent would be using a theory that includes the soundness for proofs of length k+1. But then the agent could use that to form a self-referential sentence that says "I am not provable by a proof of length ≤ k+1 in S" and then derive a contradiction (similar to the standard Löbian argument but with bounded proof length). However, note that for bounded proof lengths, the set of proofs is finite and so the theory remains consistent. But the problem is that if the agent wants to trust longer proofs, they must change their trust rule. The Löbian obstacle reappears when the agent tries to trust an unbounded set of proofs.

     (iv) A necessary condition for T to prove the soundness of S for Π_1 sentences is that T proves the consistency of S. Why? Because if S is inconsistent, then it proves a false Π_1 sentence (e.g., 0=1, which is Π_1). Therefore, T must be able to prove that S is consistent. In fact, the soundness for Π_1 sentences is equivalent to the consistency of S (for sufficiently strong S), because if S is consistent, then it does not prove 0=1 (which is Π_1) and for any Π_1 sentence φ, if S proves φ and φ is false (so ¬φ is true and Σ_1), then S would prove both φ and ¬φ? Not exactly: the soundness for Π_1 sentences is a consequence of the consistency of S plus the Σ_1-soundness of S. But note that if S is inconsistent, then it is not sound for Π_1. Therefore, the necessary condition is that T proves Con(S).

   However, note: T might be able to prove the consistency of S only if S is a subtheory of T (or a very weak extension). For instance, T cannot prove the consistency of T itself.

   Therefore, a non-trivial version of the trust proposal survives: an agent can trust a subtheory S of T for Π_1 sentences, and T can prove that S is sound for Π_1 sentences if T can prove Con(S). Since T can prove Con(S) for some subtheories S (like Robinson arithmetic), this is non-trivial.

