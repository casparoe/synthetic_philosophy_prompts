answer: |-
  ### Exam Question

  **Question:** An agent uses a consistent, recursively axiomatizable theory \(T\) that extends Robinson arithmetic (i.e., \(T\) is sufficiently strong). The agent wishes to avoid the Löbian obstacle (which states that if \(T\) adopts the full reflection schema "if \(T\) proves \(\varphi\), then \(\varphi\)" for all sentences \(\varphi\), then \(T\) becomes inconsistent). To do this, the agent proposes to:  
  1. **Prove in \(T\) that a "successor" theory \(S\) is sound** (i.e., \(T \vdash \forall \varphi \, (\text{Prov}_S(\varphi) \to \varphi)\), where \(\text{Prov}_S(\varphi)\) means "\(S\) proves \(\varphi\)").  
  2. **Trust \(S\)'s proofs:** Whenever \(S\) proves \(\varphi\), accept \(\varphi\).  

  We consider three candidate definitions for \(S\):  
  - **Option (i):** \(S = T\) (the agent’s current theory).  
  - **Option (ii):** \(S = T + A\) (a finite extension of \(T\) by a sentence \(A\) that \(T\) does not prove).  
  - **Option (iii):** \(S \subseteq T\) (a subtheory of \(T\)).  

  **Part (a) [6 marks]:** For each option (i), (ii), and (iii), is it possible for \(T\) to prove the soundness of \(S\) (i.e., \(T \vdash \forall \varphi \, (\text{Prov}_S(\varphi) \to \varphi)\)) while \(T\) remains consistent? State "yes" or "no" for each and give a brief reason.  

  **Part (b) [10 marks]:**  
  (i) Suppose \(T\) proves \(S\)’s soundness. For a fixed \(\varphi\), if \(T \vdash \text{Prov}_S(\varphi) \to \varphi\), explain why Löb’s theorem implies \(T \vdash \varphi\).  
  (ii) The agent’s trust rule is: "If \(S \vdash \varphi\), then accept \(\varphi\)." Since \(T\) has proven \(S\) sound, the agent reasons that \(S \vdash \varphi\) implies \(\varphi\). Is this equivalent to \(T \vdash \varphi\)? Explain why or why not.  
  (iii) For which options (i, ii, iii) does adopting this trust rule lead to inconsistency? Explain.  

  **Part (c) [9 marks]:** The agent considers an alternative: trust only a *restricted fragment* of \(S\), such as:  
  - **Quantifier complexity:** Only trust sentences \(\varphi\) with bounded quantifier complexity (e.g., \(\Pi_1\) sentences, which have one universal quantifier).  
  - **Proof length:** Only trust proofs in \(S\) shorter than a fixed length \(k\).  

  (i) Why might these restrictions avoid the Löbian obstacle?  
  (ii) Give an example of a non-trivial soundness result \(T\) can prove about a restricted fragment of \(S\).  
  (iii) For proof length restriction: If \(T\) proves that all proofs in \(S\) of length \(\leq k\) are sound, can the agent safely trust proofs longer than \(k\)? Explain.  
  (iv) State a necessary condition for \(T\) to prove the soundness of \(S\) for \(\Pi_1\) sentences.  

  ---

  ### Model Answer (Approx. 800 words)

  **Part (a):**  
  - **Option (i) (\(S = T\)):** No. If \(T \vdash \forall \varphi \, (\text{Prov}_T(\varphi) \to \varphi)\), then for any \(\varphi\), \(T \vdash \text{Prov}_T(\varphi) \to \varphi\). By Löb’s theorem (which applies since \(T\) is sufficiently strong), this implies \(T \vdash \varphi\) for all \(\varphi\), making \(T\) inconsistent. But \(T\) is consistent, so this is impossible.  
  - **Option (ii) (\(S = T + A\)):** No. Proving \(S\) sound requires \(T \vdash \text{Con}(S)\) (consistency of \(S\)), as soundness implies consistency (if \(S \vdash \bot\), then \(\bot\) would hold). But \(S = T + A\) is consistent (since \(T \not\vdash A\)), yet by Gödel’s second incompleteness theorem, \(T\) cannot prove \(\text{Con}(T + A)\) unless \(T\) is inconsistent.  
  - **Option (iii) (\(S \subseteq T\)):** Yes. For example, let \(S\) be Robinson arithmetic (\(\mathsf{Q}\)). Since \(S\) is a subtheory, \(T\) can prove the soundness of \(S\) by induction over proofs (using \(T\)’s stronger axioms). This does not violate consistency, as \(S\)’s proofs are a subset of \(T\)’s, but \(T\) does not prove its own soundness.  

  **Part (b):**  
  (i) Assume \(T \vdash \text{Prov}_S(\varphi) \to \varphi\). Since \(T\) is sufficiently strong, it can prove that if it proves something, that thing is true: \(T \vdash \text{Prov}_T(\text{Prov}_S(\varphi) \to \varphi)\). Löb’s theorem states that if \(T \vdash \text{Prov}_T(\psi) \to \psi\), then \(T \vdash \psi\). Here, \(\psi\) is \(\text{Prov}_S(\varphi) \to \varphi\). Thus, \(T \vdash \text{Prov}_S(\varphi) \to \varphi\) implies \(T \vdash \varphi\).  
  (ii) No, it is not equivalent. If \(S \vdash \varphi\), then \(T\) can prove \(\text{Prov}_S(\varphi)\) (by representability) and, using \(T \vdash \forall \varphi \, (\text{Prov}_S(\varphi) \to \varphi)\), \(T \vdash \varphi\). Thus, \(S \vdash \varphi\) implies \(T \vdash \varphi\). However, the converse fails: \(T\) may prove \(\varphi\) without \(S\) proving it (e.g., if \(S \subsetneq T\)). The trust rule adds no new theorems to \(T\); it only allows the agent to "recognize" \(S\)-provable sentences.  
  (iii) The trust rule leads to inconsistency only if \(T\) cannot consistently prove \(S\) sound.  
    - **Option (i):** Inconsistent. \(T\) cannot prove its own soundness (Part (a)), so the setup is impossible.  
    - **Option (ii):** Inconsistent for the same reason: \(T\) cannot prove \(S\) sound.  
    - **Option (iii):** Consistent. Since \(S \subseteq T\), \(S \vdash \varphi\) implies \(T \vdash \varphi\) anyway, so trusting \(S\) adds no new conclusions.  

  **Part (c):**  
  (i) The Löbian obstacle uses self-referential sentences (via the diagonal lemma) that require unbounded quantifier complexity or long proofs. Bounded fragments avoid fixed points (e.g., \(\Pi_1\) reflection has no self-referential counterpart in \(\Pi_1\)), and finite proof sets (length \(\leq k\)) make reflection a finite conjunction, dodging Löb’s theorem.  
  (ii) Example: \(T\) can prove \(\Pi_1\)-soundness of \(S\) (i.e., \(\forall \varphi \in \Pi_1 \, (\text{Prov}_S(\varphi) \to \varphi)\)) if \(T \vdash \text{Con}(S)\). For instance, if \(S = \mathsf{Q}\), \(T \vdash \text{Con}(\mathsf{Q})\) and thus \(T \vdash \forall \varphi \in \Pi_1 \, (\text{Prov}_{\mathsf{Q}}(\varphi) \to \varphi)\).  
  (iii) No. If the agent trusts proofs of length \(> k\), they might encounter a self-referential sentence \(\psi\): "I am not provable in \(S\) by a proof of length \(\leq k+1\)." Trusting proofs up to \(k+1\) could then cause inconsistency (similar to Löb’s theorem). The restriction to fixed \(k\) is safe, but expanding it re-introduces the risk.  
  (iv) Necessary condition: \(T \vdash \text{Con}(S)\). Soundness for \(\Pi_1\) sentences implies \(\text{Con}(S)\) (since if \(S \vdash \bot\), \(\bot\) is false and \(\Pi_1\)).

  ---

  ### Marking Scheme (25 marks total)

  | **Part** | **Must-hit point** | **Marks** | **Common error (costs marks)** |
