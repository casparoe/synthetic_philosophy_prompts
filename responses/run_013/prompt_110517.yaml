prompt: |-
  I do model vetting for our state energy office -- basically I'm the guy who has to bless the capacity-expansion model before it goes into a rate case, and I'm an economist, not a philosopher of science. I get maybe four or five of these a year, each one gets about a day, and my director signs off on my memo, so if I wave something through and it blows up two years later its on me. The thing that eats all my time is unrealistic assumptions. Every model we see has them: perfect foresight, one representative household, no market power, no learning-by-doing, smooth demand curves when the real ones aren't. The vendors all say the same thing, basically the Friedman line that a theory is judged by its predictions and the more you care about prediction the less the assumptions matter. Our procurement people love that, because they score models on backtest error and nothing else. But I've been burned. We had a model that backtested beautifully and whose headline result -- that a modest carbon price is basically free -- turned out to hang entirely on one assumption everyone had agreed to ignore, that households and firms all use the same discount rate. So I want a procedure I can actually run in a day, per model, to sort the assumptions I have to push back on from the ones I can let through.

  Write it for me. I want a reusable checklist, not advice about this one model. Steps in order, what counts as a sufficient answer at each step, and where a step stops with a no or hands the decision to my director because it's a values call rather than a technical one. I also want the procedure to sort assumptions into the kinds that fail in different ways -- the distortion-you're-supposed-to-undo kind (make the math doable, then de-idealize and see if the number moves) versus the deliberately-leave-everything-out-except-the-two-causes-I-care-about kind versus the kind that's really just a patch for a known miss. Some philosophers draw that first distinction with names I can never remember; use whatever labels you want but keep the underlying difference straight, because they need different follow-ups from me. And I need the procedure to handle the case that actually bit me: the backtest passes, every competing model agrees about the past, and the assumption you're worried about is exactly the thing generating the headline number. Also: the vendor will push back, so give me one plain-English justification per step that isn't just Friedman said so, and be honest about which steps are judgment calls wearing a lab coat.

  Format it like this:

  - "What this is for, and what it can't do" -- about 150 words.
  - "The procedure, step by step" -- the main checklist, roughly 800 words. For each step: the question it asks, what counts as a sufficient answer, when to stop, when to escalate, and the one-line justification.
  - "The kinds of unrealistic assumption the steps sort between" -- about 200 words, with a note on how each kind misfires.
  - "Worked run: perfect foresight in the capacity model" -- about 400 words.
  - "Worked run: the shared discount rate" -- about 400 words.
  - "The run where it makes me reject a model I like" -- about 300 words.
  - "Where the procedure breaks down" -- about 250 words.

  For each worked run I want the actual verdict per assumption (pass, stress-test, reject, or kick to my director) and a one-paragraph bottom line I could paste into the memo. Keep it in plain language; I'll be reading it at my desk with a PDF open, not in a seminar.
reasoning: |-
  We are building a reusable checklist for model vetting, focusing on unrealistic assumptions. The goal is to sort assumptions into categories that require different handling: some can be waived, some need stress-testing, some should be rejected, and some are policy/value decisions that must be escalated.

  The procedure must:
  - Be executable in about one day per model.
  - Handle cases where backtests pass but an unrealistic assumption drives the headline result.
  - Provide clear justifications to push back against vendors.
  - Distinguish between types of unrealistic assumptions and how they might fail.

  We'll structure the output as requested.

  ---

  **What this is for, and what it can't do**

  This procedure is a structured checklist for vetting capacity-expansion models, focusing on unrealistic assumptions. It helps identify which assumptions require intervention (rejection, stress-testing, or escalation) and which can be accepted. The checklist is designed for efficiency, aiming to complete one model in a day. It cannot replace deep domain expertise, and it won't catch every flaw. It assumes you have access to model documentation and can run basic sensitivity tests. The procedure is not a substitute for peer review or extensive validation, but it provides a systematic way to flag high-risk assumptions. It also cannot resolve value judgments; those are escalated to your director.

  ---

  **The procedure, step by step**

  *Step 1: Map the headline results to key assumptions.*  
  - **Question:** What are the 3-5 headline results (e.g., "modest carbon price is free") and which assumptions are critical to each?  
  - **Sufficient answer:** A clear linkage between each headline result and the top 1-3 assumptions that drive it (e.g., via sensitivity analysis or vendor's own documentation).  
  - **Stop if:** The vendor cannot identify which assumptions drive the headline results.  
  - **Escalate if:** The headline result is a policy-sensitive value judgment (e.g., equity impacts) that requires director input.  
  - **Justification:** "If we don't know which assumptions are holding up the roof, we can't check if the foundation is solid."

  *Step 2: Classify each key assumption by purpose.*  
  - **Question:** Why is this assumption included? Categorize as:  
    (A) **Math-simplifier**: Makes the model tractable (e.g., linear demand curves).  
    (B) **Isolator**: Focuses on specific causal mechanisms by excluding confounders (e.g., no learning-by-doing to isolate capital costs).  
    (C) **Patch**: Compensates for a known model miss (e.g., an exogenous adjustment because the model can't capture market power).  
  - **Sufficient answer:** The vendor provides a clear rationale that fits one category.  
  - **Stop if:** The assumption is a patch for a fundamental model limitation that isn't acknowledged.  
  - **Escalate if:** The purpose involves a value trade-off (e.g., ignoring equity for efficiency).  
  - **Justification:** "Different kinds of unrealism fail in different ways, so we handle them differently."

  *Step 3: For Math-simplifiers, demand de-idealization and sensitivity tests.*  
  - **Question:** Has the vendor shown what happens when the assumption is relaxed (e.g., adding curvature to demand) and is the headline result robust?  
  - **Sufficient answer:** A sensitivity test (e.g., ±20% variation) showing the headline result doesn't change meaningfully (e.g., <10% shift in key output).  
  - **Stop if:** No sensitivity test is provided and the vendor refuses to run one.  
  - **Escalate if:** Robustness is borderline and the policy stakes are high.  
  - **Justification:** "If the math trick changes the answer when we tweak it, we can't trust it for real decisions."

  *Step 4: For Isolators, check if excluded factors could swamp the effect.*  
  - **Question:** Could real-world factors left out (e.g., learning-by-doing) materially alter the headline result if added?  
  - **Sufficient answer:** Vendor provides evidence (e.g., literature review) showing the excluded factors are either negligible in this context or would not reverse the result.  
  - **Stop if:** The vendor cannot rule out that the excluded factor would dominate.  
  - **Escalate if:** The exclusion involves a contested policy priority (e.g., environmental justice).  
  - **Justification:** "A magnifying glass is useless if the thing you're ignoring is a forest fire."

  *Step 5: For Patches, verify the patch is bounded and monitored.*  
  - **Question:** Is the patch (e.g., an exogenous adjustment factor) calibrated to historical data and accompanied by a plan to track its accuracy?  
  - **Sufficient answer:** The patch has a documented empirical basis (e.g., regression on past data) and the vendor commits to reviewing it annually.  
  - **Stop if:** The patch is arbitrary (e.g., +5% because it "feels right") or has no monitoring.  
  - **Escalate if:** The patch covers a high-uncertainty area with major cost implications.  
  - **Justification:** "A temporary fix becomes a permanent error if we don't measure how wrong it is."

  *Step 6: For any assumption critical to headline results, run a "backtest trap" check.*  
  - **Question:** Does the backtest pass only because the assumption conceals errors (e.g., shared discount rate making past costs look consistent)?  
  - **Sufficient answer:** Vendor shows that removing the assumption doesn't wreck backtest fit (e.g., by comparing model runs with/without the assumption on historical data).  
  - **Stop if:** The backtest passes only with the unrealistic assumption and fails without it.  
  - **Escalate if:** The assumption is necessary for backtest but known to be unrealistic for forecasting.  
  - **Justification:** "A model that only fits the past by pretending reality is simpler than it is will fail when reality bites."

  *Step 7: For headline results driven by unrealistic assumptions, require a "reality check" scenario.*  
  - **Question:** Has the vendor run a scenario with the assumption replaced by a more realistic alternative (e.g., heterogeneous discount rates) and does the headline result hold?  
  - **Sufficient answer:** A scenario showing the headline result is qualitatively similar (e.g., carbon price still low-cost) under the more realistic setup.  
  - **Stop if:** The headline result reverses or vanishes in the realistic scenario.  
  - **Escalate if:** The realistic scenario is technically feasible but politically contentious.  
  - **Justification:** "If the main finding disappears when we turn on the lights, it might be a mirage."

  ---

  **The kinds of unrealistic assumption the steps sort between**

  - **Math-simplifiers (Type A)**: These are unrealistic assumptions made to solve the model (e.g., perfect foresight). They fail if the simplification distorts the answer when relaxed. Step 3 tests robustness via sensitivity.  
  - **Isolators (Type B)**: These deliberately exclude factors to isolate a mechanism (e.g., no market power). They fail if the excluded factors are large enough to overwhelm the effect being studied. Step 4 screens for this.  
  - **Patches (Type C)**: These are ad-hoc fixes for model limitations (e.g., a fudge factor for transmission losses). They fail if uncalibrated or unmonitored, leading to drift. Step 5 ensures they are anchored.  

  Note: A single assumption can serve multiple purposes, but the dominant purpose dictates handling.

  ---

  **Worked run: perfect foresight in the capacity model**

  - **Step 1:** Headline result: "Least-cost pathway requires 20 GW solar by 2035." Critical assumption: perfect foresight.  
  - **Step 2:** Classified as Math-simplifier (Type A) because it converts a stochastic problem into a deterministic one.  
  - **Step 3:** Vendor provides sensitivity test using myopic investment (5-year lookahead). Result: Solar target shifts to 18-22 GW. Robust (<10% change).  
  - **Step 6:** Backtest trap: Model backtests well with perfect foresight because past policy was stable. Without it, backtest error rises slightly but stays acceptable.  
  - **Step 7:** Reality check scenario with bounded rationality shows solar target remains 19-21 GW.  
  - **Verdict:** Pass (with note: robust to myopic variants).  
  - **Memo bottom line:** "Perfect foresight is unrealistic but sensitivity tests show the solar target is robust to myopic decision-making. Backtest remains acceptable without it. Accept."

  ---

  **Worked run: the shared discount rate**

  - **Step 1:** Headline result: "Modest carbon price is cost-free due to fuel savings." Critical assumption: all agents use the same discount rate (7%).  
  - **Step 2:** Classified as Math-simplifier (Type A) for aggregation.  
  - **Step 3:** Vendor has no sensitivity test for heterogeneous rates.  
  - **Step 6:** Backtest trap: Backtest passes because with one rate, past investment matches history. But when tested with heterogeneous rates (households 4%, firms 10%), backtest error jumps for household adoption.  
  - **Step 7:** Reality check scenario: With heterogeneous rates, the "cost-free" result vanishes for households (high discount rate => low adoption).  
  - **Verdict:** Reject.  
  - **Memo bottom line:** "The cost-free carbon price result relies entirely on a single, unrealistic discount rate. Backtest passes only by masking household behavior. Without robustness, this is a model artifact."

  ---

  **The run where it makes me reject a model I like**

  - **Scenario:** A model shows distributed batteries beat grid storage. Isolates technology costs (Type B) by excluding regulatory delays.  
  - **Step 4:** Excluded factor (regulatory delays) could double deployment time. Vendor argues delays are minor.  
  - **Step 6:** Backtest passes because past projects had fast-tracked permits.  
  - **Step 7:** Reality check with typical delays: Batteries still win but by a slim margin, and only in high-wholesale-price regions.  
  - **Verdict:** Stress-test required (run scenarios with 6-24 month delays).  
  - **Memo bottom line:** "The battery advantage is sensitive to regulatory delays. Without testing this exclusion, we risk overstating benefits. Recommend conditional approval pending delay scenario analysis."

  ---

  **Where the procedure breaks down**

  The procedure struggles when:  
  1. **The model is a black box**: Vendor won't share code or run tests. Solution: Require transparency in procurement.  
  2. **All assumptions are weak**: The model is built on quicksand. Use Step 6 to force backtests without key patches.  
  3. **Conflicting experts**: When isolators (Type B) involve disputed exclusions (e.g., climate impacts), escalate early.  
  4. **Time constraints**: If one day isn't enough, prioritize by headline results. Skip non-critical assumptions.  
  5. **Novel mechanisms**: For unprecedented policies (e.g., hydrogen economy), historical backtests are less relevant. Rely more on Step 7 reality checks.  

  In these cases, flag limitations in your memo and recommend additional review if resources allow.
answer: |-
  ### Model Vetting Checklist for Unrealistic Assumptions  
  **For:** State Energy Office capacity-expansion model reviews.  
  **What this is for, and what it can't do**  
  This checklist systematically flags unrealistic assumptions that could invalidate headline results. It categorizes assumptions by *how* they might fail, prioritizes follow-ups (accept, stress-test, reject, or escalate), and includes safeguards against "backtest traps." Designed for one-day reviews, it assumes you have model documentation, backtest data, and vendor cooperation for quick sensitivity tests. It can't detect all flaws (e.g., hidden code errors), resolve deep theoretical disputes, or replace expert judgment for novel technologies. It flags—but doesn't solve—value conflicts (e.g., equity vs. cost). Use it to focus limited time on high-risk assumptions.  

  ---

  ### The Procedure, Step by Step  
  *Complete steps in order. Spend ~70% of time on Steps 1–3 and 6–7 (critical assumptions).*  

  1. **Identify headline results and their critical assumptions**  
     - **Question:** What are the 1–3 headline results (e.g., "carbon price is cost-free"), and which assumptions are indispensable to each?  
     - **Sufficient answer:** Vendor names ≤3 assumptions per result, with evidence (e.g., sensitivity rankings, variance decomposition).  
     - **Stop if:** No clear link between assumption and result (e.g., vendor says "everything matters equally").  
     - **Escalate if:** The result hinges on a policy value (e.g., "equity impacts are negligible").  
     - **Justification:** "Headline results drive rate cases; if we don't know what holds them up, we risk missing a house of cards."  

  2. **Classify each critical assumption by type**  
     - **Question:** Is the assumption a:  
       - **Tool (Math-simplifier)**: Makes computation feasible but distorts reality (e.g., perfect foresight).  
       - **Microscope (Isolator)**: Isolates specific drivers by stripping out noise (e.g., no market power).  
       - **Band-Aid (Patch)**: Covers a known gap (e.g., fixed 5% demand growth).  
     - **Sufficient answer:** Vendor explains the type with a clear rationale (e.g., "Tool for solvability" or "Microscope to focus on X").  
     - **Stop if:** Vendor can't justify the type or admits it's a Band-Aid for a fundamental flaw (e.g., "We don’t know how to model Y").  
     - **Escalate if:** Type involves a value trade-off (e.g., a Microscope ignoring equity).  
     - **Justification:** "Tools can be tested, Microscopes judged for relevance, and Band-Aids monitored—but they break differently."  

  3. **For Tools (Math-simplifiers): Test de-idealization robustness**  
     - **Question:** Does the headline result hold when the assumption is relaxed toward reality (e.g., myopic foresight instead of perfect)?  
     - **Sufficient answer:** Vendor provides sensitivity tests (e.g., ±30% parameter shift or structural change) showing <10% change in headline result.  
     - **Stop if:** No test exists or result shifts >20% (e.g., "cost-free" becomes "high-cost").  
     - **Escalate if:** Robustness is borderline (±15%) and affects major costs.  
     - **Justification:** "A good Tool shouldn’t crack when nudged; if it does, the result may be an artifact of convenience."  

  4. **For Microscopes (Isolators): Assess excluded noise**  
     - **Question:** Could real-world factors left out (e.g., learning-by-doing) materially alter the headline result?  
     - **Sufficient answer:** Vendor provides evidence (e.g., literature, data) that excluded factors are weak (<5% impact) or wouldn't reverse the result.  
     - **Stop if:** Excluded factors are material (e.g., learning-by-doing cuts costs 30% in similar models).  
     - **Escalate if:** Exclusion conflicts with policy goals (e.g., ignoring local air quality).  
     - **Justification:** "A Microscope is useless if the thing it ignores is a tornado—you’ll miss the storm destroying your result."  

  5. **For Band-Aids (Patches): Verify calibration and monitoring**  
     - **Question:** Is the Band-Aid empirically calibrated (not arbitrary), and is there a plan to track its error?  
     - **Sufficient answer:** Vendor shows calibration to historical data (e.g., regression) and commits to annual validation (e.g., "We’ll compare to actual demand growth").  
     - **Stop if:** Band-Aid is uncalibrated (e.g., "assume 5% because industry does") or has no monitoring.  
     - **Escalate if:** Band-Aid covers high-stakes uncertainty (e.g., $1B+ cost implications).  
     - **Justification:** "Band-Aids are temporary fixes; without measuring the wound, infection spreads silently."  

  6. **Backtest trap check: Unmask hidden dependencies**  
     - **Question:** Does the backtest pass *only* because the unrealistic assumption masks errors (e.g., shared discount rate hiding household adoption gaps)?  
     - **Sufficient answer:** Vendor reruns backtest without the assumption (or with a realistic variant), showing errors stay within tolerance (e.g., MAPE < 5%).  
     - **Stop if:** Backtest fails without the assumption (e.g., error jumps >10%).  
     - **Escalate if:** Backtest passes but vendor lacks future data to validate (e.g., new technology).  
     - **Justification:** "A model that fits the past by assuming a simpler world may fail when reality refuses to simplify."  

  7. **Reality-check for headline drivers**  
     - **Question:** For assumptions critical to headline results, does a "realistic" scenario (e.g., heterogeneous agents) preserve the conclusion?  
     - **Sufficient answer:** Vendor provides a scenario where the headline result doesn’t qualitatively change (e.g., "cost-free" remains low-cost).  
     - **Stop if:** Result reverses (e.g., from savings to losses) or vanishes.  
     - **Escalate if:** Realistic scenario requires contested data (e.g., proprietary discount rates).  
     - **Justification:** "If the headline can’t survive a brush with reality, it’s not ready for prime time."  

  ---

  ### The Kinds of Unrealistic Assumption the Steps Sort Between  
  - **Tool (Math-simplifier)**: Unrealistic by design for tractability (e.g., linear curves). *Fails if de-idealization changes the answer* (Step 3).  
  - **Microscope (Isolator)**: Deliberately excludes context to isolate causes (e.g., no behavioral biases). *Fails if excluded factors swamp the effect* (Step 4).  
  - **Band-Aid (Patch)**: Quick fix for a model limitation (e.g., exogenous inflation rate). *Fails if uncalibrated or left unmonitored* (Step 5).  
  *Note:* Tools and Microscopes are "good" unrealism if managed; Band-Aids are risky stopgaps.  

  ---

  ### Worked Run: Perfect Foresight in the Capacity Model  
  - **Step 1:** Headline result: "Coal retirements are optimal by 2030." Critical assumption: Perfect foresight (agents know future prices).  
  - **Step 2:** **Tool** (math-simplifier for deterministic optimization).  
  - **Step 3:** Vendor shows de-idealization test: With 5-year foresight, retirements shift by <1 year. **Sufficient** (robust).  
  - **Step 6:** Backtest rerun with myopic agents: Error increases slightly (2% → 3% MAPE) but passes.  
  - **Step 7:** Realistic scenario (bounded rationality): Retirements remain within 2029–2031.  
  - **Verdict:** Pass.  
  - **Memo bottom line:** "Perfect foresight is unrealistic but robust to myopic variants. Backtest errors stay low. No material risk to the coal retirement finding. Accept."  

  ---

  ### Worked Run: The Shared Discount Rate  
  - **Step 1:** Headline result: "Modest carbon price is cost-free due to fuel savings." Critical assumption: Single discount rate (7%) for all households/firms.  
  - **Step 2:** **Tool** (math-simplifier for aggregation).  
  - **Step 3:** No de-idealization test exists. Vendor refuses, citing "aggregation necessity."  
  - **Step 6:** Backtest trap: With heterogeneous rates (firms 10%, households 4%), household adoption errors spike (MAPE 3% → 15%). Passes only with single rate.  
  - **Step 7:** Realistic scenario: At 4% household rate, adoption slows; "cost-free" result becomes 20% net cost for households.  
  - **Verdict:** Reject.  
  - **Memo bottom line:** "The cost-free carbon price claim collapses under realistic discount rates. Backtest only passes by masking household behavior. Reject due to unaddressed fragility."  

  ---

  ### The Run Where It Makes Me Reject a Model I Like  
  - **Context:** Model shows "wind + storage outcompetes gas by 2030." Vendor excludes supply-chain risks (Microscope to isolate cost trends).  
  - **Step 4:** Excluded factors (e.g., mineral shortages) could delay deployment 2–3 years. Vendor cites "low historical risk," but evidence is thin.  
  - **Step 6:** Backtest passes—supply chains were stable in past data.  
  - **Step 7:** Realistic scenario (20% cost inflation for critical minerals): Wind + storage loses to gas in 5/10 regions.  
  - **Verdict:** Stress-test required (run scenarios with supply-chain shocks).  
  - **Memo bottom line:** "The wind-storage advantage is appealing but relies on excluding supply-chain risks. Without stress-tests for shortages, this model could understate gas dependence. Reject pending scenario analysis; escalate to director if timeline pressures exist."  

  ---

  ### Where the Procedure Breaks Down  
  - **Black-box models:** Vendors may withhold code/sensitivity tests. *Workaround:* Require tests as contract terms; stop if denied.  
  - **Overloaded assumptions:** One assumption serving multiple types (e.g., a Tool *and* Band-Aid). *Workaround:* Flag for escalation; director decides priority.  
  - **Novel disruptions:** For unprecedented changes (e.g., AI-driven demand spikes), backtests and literature are weak. *Workaround:* Rely on Step 7 "reality checks" with expert scenarios.  
  - **Value conflicts:** When Microscopes exclude equity or Band-Aids hide distributional effects, the procedure flags but can’t resolve. *Workaround:* Escalate early—director must weigh trade-offs.  
  - **Time overruns:** If one day isn’t enough, prioritize Steps 1, 6, and 7 for headline results. Skip non-critical assumptions.  
  *Bottom line:* The procedure is a sieve, not a microscope. It catches glaring issues but won’t find every grain of sand. Document limitations in your memo.
