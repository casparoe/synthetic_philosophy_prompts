prompt: |-
  I am three weeks into a third-year course in the philosophy of science, and the unit on falsificationism and the demarcation problem has just ended. As part of the course, each student has to run one 90-minute session for the rest of the seminar: 14 people, mostly third-years, all of whom have read Popper and one short treatment of the Duhem–Quine problem. I have been assigned the session on the criterion itself, and I want it to be a runnable activity rather than a discussion, because last week the group agreed within ten minutes that the criterion is obviously too crude, and I do not think anyone felt why it is attractive in the first place.

  What I want to stage is an editorial board meeting. The participants sit as the board of a general science journal and have to apply a single explicit admission rule to a set of submitted research programmes. I will write the programmes myself, so that nobody can win by knowing the real history and so that the rule is doing all the work. There should be six or seven submissions, one paragraph each, each defensible by a competent scientist, and each sitting awkwardly with the rule in a different way: one that forbids a great deal but that the group will want to reject, one that has so far only accommodated results it did not predict, one whose supporting observations are themselves contested, and one where a cheap extra claim or a blamed auxiliary assumption is enough to satisfy the rule. I want the group to arrive by itself at three discoveries, roughly in this order: first, that any programme can be made to satisfy the rule by conjoining something to it or by blaming an auxiliary, so that the rule alone excludes nothing; second, that the moment they begin refusing the cheap rescues they have introduced a distinction between a modification that adds independent testable content and one that merely saves the phenomenon, and they will have to say what that distinction is; third, that the observation reports they are judging on are not innocent, so that a reasonable member of the board can reject the evidence rather than the hypothesis. The session should end with the board unable to agree, and with no sense that one side has obviously won.

  Then a debrief that maps the moments in the activity back onto the criterion, and that is honest about which of the objections they found are real criticisms of it and which are artefacts of my setup. I would like them to leave thinking the criterion is neither obviously right nor obviously wrong, and to have some idea of what it is for.

  Please give me the following. The rule itself, in the exact words I would print and hand out: strict and simple, in substance the falsifiability criterion rather than a watered-down testability requirement, and framed as a rule of admission rather than a criterion of truth. I do not need a quotation from Popper or anyone else; I want a sentence I can put at the top of the page. The case sheets, with the awkward feature of each case identified for me but not for the students, and with no real historical episodes and no proper names on the sheets. The board procedure: roles if you think they help, how verdicts are reached, and any constraint or scoring that keeps the group from converging on the verdict that it is all a matter of degree within the first ten minutes. The timeline for the 90 minutes, including how much time to leave for the debrief. The debrief itself, mapped to the moments in the activity. What will predictably go wrong the first time I run it — which case they will misread, where the deadlock will come from, and what I should do about it in the room. And a frank statement of what this activity cannot reproduce about falsificationism, so that I know what I have to supply myself. Nothing should be lectured at the start, and the words demarcation and falsification should not appear on anything I hand out.
reasoning: |-
  We are designing an activity for a 90-minute seminar on the falsifiability criterion, framed as an editorial board meeting for a science journal. The goal is to have the participants grapple with the criterion as an admission rule and discover its challenges through applying it to fictional research programs.

  ### The Rule
  The rule must be strict and simple, capturing the essence of falsificationism. It should be framed as a rule of admission (what we accept for publication) and not as a criterion of truth.

  **Rule to hand out:**
  > "The journal will consider for publication only research programs that are falsifiable. A research program is falsifiable if and only if it is logically possible for there to be an observation report that, if accepted as true, would conclusively prove the program false."

  Note: This is strict falsifiability (conclusive falsification) and not testability (which might allow for probabilistic or non-conclusive tests). We avoid the word "testable" to stick to Popper's core idea.

  ### Case Sheets
  We need 6-7 fictional research programs, each one paragraph. Each should be defensible by a competent scientist but awkward for the falsifiability rule in a distinct way. The awkward features are identified for the instructor but not for the students.

  1. **Case 1: Unfalsifiable because too vague (forbids a great deal but group will want to reject)**
     - *Description:* A program that uses vague terms and makes broad, untestable claims. Example: "The program posits that all living organisms possess a 'vital energy' that is not directly measurable but is responsible for life processes. The presence of vital energy is inferred from the fact of being alive, and its absence from death. The program claims that any attempt to measure vital energy directly will fail because the act of measurement disrupts it."
     - *Awkward feature:* The program is not falsifiable because there is no possible observation that could contradict it. Any failure to measure vital energy is explained away. However, the group might want to reject it because it sounds like pseudoscience.

  2. **Case 2: Ad hoc modifications (only accommodates results, never predicts)**
     - *Description:* A program that has been repeatedly modified to fit new data without making novel predictions. Example: "The program asserts that the rate of a chemical reaction is determined by the 'affinity' of the reactants. Initially, affinity was defined by reaction rates in standard conditions. When anomalies arose (e.g., reactions that sped up unexpectedly), the program introduced the concept of 'catalytic affinity' for catalysts and 'inhibitory affinity' for inhibitors, each defined by the very observations they were meant to explain."
     - *Awkward feature:* The program is not falsifiable because every new observation is accommodated by adding a new ad hoc concept. There is no independent test of these concepts.

  3. **Case 3: Auxiliary assumptions are contested (supporting observations are themselves contested)**
     - *Description:* A program that relies on auxiliary assumptions which are under debate. Example: "The program claims that a new particle, the 'X-ion', exists and is responsible for an observed anomaly in particle decay rates. The observation of the anomaly depends on a specific calibration of the detector, which some scientists contest. The program asserts that the anomaly is real and that the standard model must be extended to include the X-ion."
     - *Awkward feature:* The observation report (anomaly) that could falsify the program is contested, so the board must decide whether to accept the observation. This highlights the Duhem-Quine problem: it's not clear whether to reject the main hypothesis or the auxiliary (calibration).

  4. **Case 4: Cheap rescue by conjoining (adding an independent testable claim)**
     - *Description:* A program that can be easily made falsifiable by adding a testable claim. Example: "The program proposes that a certain gene is responsible for a hereditary disease. Initial studies in two families show a correlation. However, a larger study fails to replicate the correlation. The proponents modify the program by adding that the gene's effect is only present when a specific environmental factor (e.g., a toxin) is also present, and they propose a test for this interaction in a controlled setting."
     - *Awkward feature:* The modified program is now falsifiable (by a test of the interaction). But the modification was cheap and designed only to save the program. However, it also adds independent testable content.

  5. **Case 5: Cheap rescue by blaming an auxiliary (without independent test)**
     - *Description:* A program that, when faced with a falsifying observation, blames an auxiliary assumption without providing a test for the auxiliary. Example: "The program predicts the trajectory of a spacecraft using a new theory of gravity. The observed trajectory deviates from the prediction. The program's proponents blame the deviation on an unmodeled solar wind effect, but they do not specify how to measure this effect independently or how to test the gravity theory separately."
     - *Awkward feature:* The program is rescued by blaming an auxiliary, but no independent test is provided. This is a cheap rescue that does not add testable content.

  6. **Case 6: Falsifiable but not yet falsified (seemingly good science)**
     - *Description:* A program that is clearly falsifiable and has made successful predictions. Example: "The program proposes a new class of superconductors that can operate at room temperature. It predicts the specific crystal structure and the electronic properties required. Initial experiments with one material showed superconductivity at 250K, and the program has guided the synthesis of three other materials with similar properties, all showing superconductivity above 200K. No falsifying instance has been found so far."
     - *Awkward feature:* This program is falsifiable and currently supported by evidence. The board should accept it, but it serves as a contrast to the others. It shows that the criterion is not about being falsified but about being falsifiable.

  7. **Optional Case 7: Falsifiable in principle but practically untestable (e.g., requires an impossible experiment)**
     - *Description:* A program that is falsifiable in principle but not in practice. Example: "The program claims that at the core of every black hole there is a 'singularity engine' that creates new universes. It predicts that in the final moments of a black hole's evaporation, the engine would leave a signature in the form of a specific pattern of gravitational waves. However, observing this signature is beyond current technological capabilities and may always be so."
     - *Awkward feature:* The program is falsifiable in principle (if we could observe the gravitational waves) but not in practice. The criterion does not require practical testability, only logical possibility. The board might want to reject it for practical reasons, but the rule doesn't allow that.

  ### Board Procedure
  - **Roles:** Assign roles to make it engaging. Suggested roles: Editor-in-Chief (moderates, keeps time), 3-4 Associate Editors (lead discussion for 1-2 cases each), and the rest as Board Members. Alternatively, no fixed roles and the whole board discusses each case.
  - **Verdicts:** For each case, the board must vote: Accept (falsifiable) or Reject (not falsifiable). They must justify based solely on the rule. They cannot appeal to the plausibility of the program or their own scientific judgment beyond applying the rule.
  - **Constraint:** Emphasize that they must apply the rule strictly. They are not allowed to say "this is almost falsifiable" or "we can make it falsifiable by tweaking". They must judge the submission as written.
  - **Scoring/Constraint to prevent early convergence:** Tell the board that the journal has a strict policy and they must apply the rule without exception. Also, set a time limit per case (e.g., 5-7 minutes of discussion and then vote). If they try to say "it's a matter of degree", remind them that the rule is binary: either it is falsifiable (accept) or not (reject).

  ### Timeline (90 minutes total)
  1. **Introduction (5 minutes):** Explain the activity: "You are the editorial board of the Journal of Scientific Progress. Your task is to evaluate 7 research program submissions based solely on the admission rule provided. You must decide whether each program is falsifiable (accept) or not (reject). Remember, you are not judging the truth or likelihood of the program, only whether it meets the rule."
     - Hand out the rule and the case sheets.
     - Assign roles if using them.

  2. **Case Discussion (60 minutes):** 
     - Allocate about 8-9 minutes per case (for 7 cases, 60 minutes). 
     - For each case: 
       - One board member reads the case aloud (1 min).
       - Open discussion (5-6 min) led by the Editor-in-Chief or an Associate Editor.
       - Vote (show of hands) and record the verdict (1 min).

  3. **Debrief (25 minutes):** 
     - Map the activity to the philosophical issues (see below).

  ### Debrief
  Guide the debrief by asking questions and then linking to the concepts. Do not lecture.

  1. **Discovery 1: Cheap rescues make the rule empty?**
     - *Ask:* "In which cases did you see that a program could be made falsifiable by a small change? How did you handle that?"
     - *Map:* Point out that in Case 4 and Case 5, the program can be made falsifiable by adding a claim or blaming an auxiliary. But the rule as stated doesn't allow modifications. So the rule alone excludes nothing because any program can be patched. This is the problem of ad hoc modifications.

  2. **Discovery 2: Distinguishing good and bad modifications?**
     - *Ask:* "When a program was rescued by a modification, did you sometimes feel that the modification was 'cheap'? What made it cheap? What would a 'good' modification look like?"
     - *Map:* This leads to the idea that a good modification should add independent testable content (like in Case 4, the test for the gene-environment interaction) and not just save the program (like in Case 5, blaming solar wind without a test). But the rule doesn't specify this. Popper introduced the idea of non-ad hoc modifications, but that requires a new criterion.

  3. **Discovery 3: Observation reports are not innocent?**
     - *Ask:* "Were there cases where the observation that could falsify the program was itself in doubt? How did you handle that? (e.g., Case 3)"
     - *Map:* This is the Duhem-Quine problem: we test a whole network of hypotheses, not a single one. So when an observation conflicts, we don't know which part to reject. The board might have rejected the observation (thus saving the program) or the auxiliary, but the rule doesn't say how to decide.

  4. **Overall:**
     - *Ask:* "Did the rule work as a clear demarcation? What did you find challenging?"
     - *Map:* The criterion is attractive because it seems to draw a sharp line (e.g., Case 1: reject; Case 6: accept). But the challenges show that it is not so simple. However, it is not obviously wrong because it does rule out clearly unscientific programs (like Case 1) and allows in good science (Case 6). The criterion is meant to be a rule for science, but it needs to be supplemented with methodological rules (e.g., against ad hoc modifications) and an understanding that observation is fallible.

  5. **Honest reflection:**
     - *What is an artefact?* The activity forced a binary decision and did not allow modifications. In real science, programs are modified. Popper's falsificationism is not just about the logical criterion but also about how scientists should behave (e.g., bold conjectures, severe tests, no ad hoc saves). Also, the rule doesn't address practical testability (Case 7) because Popper focused on logical possibility.
     - *What is a real criticism?* The Duhem-Quine problem (Case 3) and the problem of ad hoc modifications (Cases 4 and 5) are real challenges to falsificationism. The criterion alone is insufficient for demarcation.

  End with: The criterion is neither obviously right nor wrong. It captures an important intuition (science risks being wrong) but must be part of a broader methodology.

  ### What Will Go Wrong
  1. **Misreading Cases:** 
     - Case 2 (ad hoc modifications) might be misread as falsifiable because each version is testable. Clarify that the rule applies to the program as submitted, which includes the history of modifications and the lack of independent tests.
     - Case 7 (practically untestable) might be rejected because they think testability must be practical. Remind them: the rule requires only logical possibility.

  2. **Deadlock:**
     - Case 3 (contested auxiliary) will likely cause deadlock. Some will want to accept the observation and reject the program; others will reject the observation. Don't break the tie. Let the deadlock stand and use it in the debrief.

  3. **Early Convergence:**
     - They might quickly say "it's all ad hoc" and reject everything. Constrain them: they must apply the rule strictly, and they must consider each case on its own. Also, Case 6 (good science) should be accepted, so they see the rule can work.

  4. **Time:**
     - They may run over time on early cases. The Editor-in-Chief must keep time strictly. If running late, skip one case (e.g., Case 7) and mention it in the debrief.

  ### What the Activity Cannot Reproduce
  - **The dynamic of scientific practice:** In real science, research programs evolve over time with tests and modifications. The activity is static (one snapshot).
  - **The role of bold predictions and corroboration:** Popper emphasized that a theory is better if it makes risky predictions that are then confirmed. The activity focuses only on falsifiability as an entry condition.
  - **The whole of Popper's methodology:** The activity isolates the falsifiability criterion. Popper's broader views (e.g., on verisimilitude, the growth of knowledge, and the methodology of scientific research programs) are not addressed.

  ### Final Note
  The activity is designed to let the group discover the problems themselves. The debrief should connect their experience to the philosophical concepts without lecturing. Avoid the terms "demarcation" and "falsification" until the debrief, and then introduce them as the ideas they were grappling with.
answer: |-
  ### The Rule for Admission
  **Handout text (print at the top of each case sheet):**  
  > "This journal admits only research programs that are **falsifiable**. A research program is falsifiable if and only if it is logically possible to describe a set of observations that, if verified, would prove the program conclusively false. The program must specify in advance what would falsify it."

  ### Case Sheets (6 Submissions)
  **Instructions for students:**  
  *You are the editorial board of the Journal of Scientific Progress. Evaluate each submission based solely on the admission rule above. Judge the program as written—do not modify it. For each, decide: ADMIT (falsifiable) or REJECT (not falsifiable).*  

  **Cases (with hidden instructor notes):**  
  1. **"Vital Resonance Theory"**  
     *Submission:* "All living organisms emit a ‘vital resonance’ field, detectable only through its effects on quantum entanglement in nearby particles. Death or disease always disrupts this field. No instrument can directly measure the field without altering it, so we infer its presence from biological outcomes (e.g., if an organism is alive, the field exists; if dead, it has collapsed)."  
     *Instructor note:* **Unfalsifiable vagueness**. The program forbids many observations (e.g., "no instrument can detect it") and explains away failures. Group will reject it as pseudoscience, but rule alone might not force this—it’s vague about what counts as "disruption."  

  2. **"Cognitive Ether Hypothesis"**  
     *Submission:* "Human cognition is guided by an undetectable ‘cognitive ether.’ Initially, we predicted reaction times in memory tasks would decrease under ether influence. When experiments showed increased times, we revised: the ether causes slower reactions when tasks involve abstract concepts. When new data showed mixed results, we added that ether effects depend on unseen genetic factors. Further revisions will refine these factors."  
     *Instructor note:* **Ad hoc accommodation without prediction**. Only accommodates past data; no novel predictions. Rule requires "specify in advance," but revisions avoid pre-commitment.  

  3. **"Neutrino-Dark Matter Coupling"**  
     *Submission:* "Neutrinos and dark matter interact via a new force, causing periodic neutrino flux anomalies. Our model predicts a 10% flux reduction during solar eclipses. A recent eclipse experiment observed no reduction. However, the telescope calibration used is disputed: rival teams argue eclipses cause lensing distortions that mask reductions. We maintain our model is correct and attribute the null result to faulty calibration."  
     *Instructor note:* **Contested auxiliary assumption**. The falsifying observation (no flux reduction) is challenged by blaming calibration—a Duhem-Quine problem. Rule doesn’t address who decides if evidence is "verified."  

  4. **"Planetary Consciousness Theory"**  
     *Submission:* "Earth’s core generates a planetary consciousness field that influences human decisions. When economic data contradicted predicted voting patterns (e.g., high unemployment should increase protest votes, but didn’t), we revised: the field only manifests when atmospheric CO2 exceeds 415 ppm. We propose testing this by analyzing voting in high-CO2 cities versus low-CO2 rural areas under identical economic conditions."  
     *Instructor note:* **Cheap rescue with added test**. Rejected until revision, but the added claim (CO2 dependence) makes it falsifiable via a new test. Shows how easy it is to "patch" unfalsifiable programs.  

  5. **"Gravity-Shadow Effect"**  
     *Submission:* "Massive objects cast ‘gravity shadows’ that subtly alter planetary orbits. Our model predicted orbital shifts for Jupiter’s moons, but new telescope data showed no shifts. We attribute this to interference from solar winds—an unmodeled factor. No test for solar wind interference is specified; we assume it occurs when shifts are absent."  
     *Instructor note:* **Cheap rescue by blaming auxiliary without test**. Blames solar winds but offers no way to verify/reject this auxiliary. Rule requires specifying falsifying observations in advance, but the rescue dodges this.  

  6. **"Quantum Ancestry"**  
     *Submission:* "Human DNA contains quantum signatures of ancestral experiences. We predicted these signatures would correlate with trauma records in historical archives. Initial studies (e.g., Holocaust descendants) showed weak correlations, but small samples limited significance. We propose a falsifiable test: if a large sample (n=10,000) of war-descendant genomes shows no stronger correlation than controls, the program is false."  
     *Instructor note:* **Falsifiable core with practical challenges**. Clearly specifies a falsifying test (large-sample null result), but group may reject due to impracticality. Rule only cares about logical possibility.  

  ### Board Procedure  
  **Roles (to structure debate):**  
  - **Editor-in-Chief (1 student):** Leads discussion, enforces time, breaks ties.  
  - **Referee (3 students):** Each analyzes 2 cases, presents initial verdict/reasoning.  
  - **Board Members (10 students):** Debate, then vote.  
  *Assign roles randomly to avoid dominance.*  

  **Verdict Process:**  
  1. Referee summarizes their case (1 min).  
  2. Open debate (5 min/case). Focus: *Does it meet the rule?* No appeals to "good science"—only rule application.  
  3. Vote per case: Secret ballot for "ADMIT" or "REJECT." Majority wins; ties stand as "deadlocked."  
  4. Editor records verdicts publicly.  

  **Constraints to Prevent Early Convergence:**  
  - **No "matter of degree" arguments:** Editor interrupts if students say "sort of falsifiable." Rule is binary—logically possible or not.  
  - **No modifications:** If a student says, "We could fix it by adding X...," Editor reminds: "Judge as submitted."  
  - **Scoring pressure:** Announce: "The journal’s credibility relies on consistent rule application. If you violate the rule, the board is fired."  

  ### Timeline (90 Minutes Total)  
  - **0:00–0:05** - Setup: Hand out rule + cases. Assign roles. Brief: "You’re a journal board. Apply the rule—nothing else."  
  - **0:05–0:10** - Case 1: Calibrate with an easy rejection (Vital Resonance).  
  - **0:10–0:50** - Cases 2–6: 8 min each (5 min debate, 2 min vote/transition).  
  - **0:50–1:15** - Debate bottlenecks (see below): Cases 3 and 5 will deadlock. Let them simmer but keep time.  
  - **1:15–1:25** - Debrief Part 1: Group reflection. "Which cases split the board? Why?"  
  - **1:25–1:30** - Debrief Part 2: Map to philosophy (below).  

  ### Debrief Mapping  
  **Part 1: Group Reflection (10 min)**  
  Ask:  
  - "Where did you feel the rule was clear/unclear?"  
  - "Did any cases expose problems with the rule?"  

  **Part 2: Instructor Mapping (5 min)**  
  1. **"Cheap rescues make the rule empty"**  
     - *Map to activity:* Cases 4 (CO2 patch) and 5 (solar wind blame). Any program can be rescued by conjunctions/auxiliaries.  
     - *Philosophy link:* This is the **ad hoc modification problem**. The rule alone can’t exclude anything if we allow patches.  

  2. **"Distinguishing good/bad modifications"**  
     - *Map to activity:* In Case 4, you admitted it after adding a test. In Case 5, you likely rejected it for blaming without a test. But the rule doesn’t define "independent testable content."  
     - *Philosophy link:* Popper’s solution (non-ad hoc modifications) requires **methodological rules**, not just logic. You invented a "no cheap rescues" standard on the fly.  

  3. **"Observations aren’t innocent"**  
     - *Map to activity:* Case 3 (neutrinos). You deadlocked over whether to reject the program or the evidence (calibration).  
     - *Philosophy link:* This is the **Duhem-Quine problem**. Falsification assumes evidence is certain, but it’s not—science tests whole networks.  

  **Honest Artifacts vs. Real Criticisms:**  
  - *Artifacts of setup:*  
    - Binary verdicts oversimplify; real science allows revisions.  
    - Rule ignores **practical testability** (Case 6’s large sample may be unfeasible; rule only cares about logical possibility).  
  - *Real criticisms:*  
    - Vagueness (Case 1) and ad hoc rescues (Cases 4–5) show the rule is **too permeable**.  
    - Contested evidence (Case 3) exposes **holism**—demarcation can’t ignore context.  

  **Closing Message:**  
  "The rule isn’t ‘obviously wrong’—it excludes clear pseudoscience (Case 1) and admits good science (Case 6). But it’s not ‘obviously right’—it can’t handle holism or ad hoc tricks alone. Its value is in forcing scientists to **pre-specify risks**: if nothing could falsify your program, it’s not science."  

  ### Predictable Problems & Fixes  
  - **Case 2 misread:** Students may think "accommodates past data" = falsifiable. *Fix:* Referee asks: "Did it specify falsifying observations *in advance*?"  
  - **Deadlock in Case 3/5:** Likely 50/50 splits. *Don’t resolve*—let deadlock highlight Duhem-Quine. Say: "This is why journals have bitter debates!"  
  - **Early convergence:** If they reject all by 0:20, use Case 6 (falsifiable core) to reset: "Would you really reject this? Check the rule!"  
  - **Time crunch:** If behind by Case 5, skip Case 6 or shorten debates. Case 6 is illustrative but not essential.  

  ### What the Activity Cannot Reproduce  
  - **Popper’s broader methodology:** Falsificationism isn’t just a "rule"—it’s part of a dynamic process where scientists **boldly conjecture** and **severely test**. The activity is static (no evolution of programs).  
  - **Corroboration vs. confirmation:** Popper prizes theories that survive tests (corroboration), but the activity only assesses initial falsifiability—not how well programs perform.  
  - **Context of discovery vs. justification:** The rule evaluates justification (testing), but students may conflate it with "how the idea was born."  
  - **Historical weight:** Real cases (e.g., astrology vs. astronomy) show demarcation’s stakes; fictional cases lack this gravity.  

  **Your Role:** In the debrief, clarify these gaps. Example: "Popper’s criterion is a starting point—science progresses by repeatedly testing and refining falsifiable programs, not just admitting them."  

  ### Materials Prep  
  - Print 1 rule sheet per student.  
  - Print case packets (all 6 cases + rule) for each student.  
  - Hide instructor notes (e.g., on a separate cheat sheet).  
  - Bring ballots/voting slips.  

  This forces engagement with the rule’s appeal (clarity, anti-dogmatism) and flaws (holism, permeability) without lecturing. Students leave seeing it as a tool with limits, not a trivial slogan.
