prompt: |-
  I'm in this seminar that's half phil of science and half stats — officially it's called Probability and Evidence but really its 90 minutes of the prof handing you one scrap of info about a single person and going "so what's the probability?" and then telling you which class you were supposed to have used. My friend Priya keeps a spreadsheet of his verdicts (she's like that) and honestly reverse-engineering his rule has turned into the only part of the course I actually care about. So far: a coin we know is fair, he says 1/2, obviously. A 58-year-old man who smokes, has high blood pressure, and whose father had a heart attack at 55 — he says use the class of men with exactly that profile (a registry of about 45,000 of them, ten-year risk 14%), not the class of all 58-year-old men (three million, 9%), even though the big class has a hundred times the data; and his reason is that the 9% is a mush of everything from 4% to 20% depending on which 58-year-old men you mean, so narrowing costs you nothing. Then some guy in the back suggested we also condition on whether he drinks diet soda, since there's a study of 4,000 people where the diet-soda group comes out at 17%, and the prof got a little testy and said the diet soda isn't doing anything, it's a marker for other stuff. And when a different person wanted to use the class "people born in the same hospital as him" (90 of them on record, 33% of them had the outcome) he just laughed and said use the disease class. I feel like I've got the shape of it, but every example he picks is one where the narrow class is also the one with good numbers and the broad class is a mess, so I have no idea what he does when those pull apart.

  Here's Thursday's. A 44-year-old woman with a rare subtype of soft-tissue sarcoma. On the table: (a) everyone with that cancer type in her age band, about 250,000 patients, five-year survival 55%, and that number is boringly stable — same in every decade, every region, every registry you slice it from; (b) patients in that same age band and cancer type whose tumour samples happened to be sequenced at one particular large commercial lab, about 90,000 of them, five-year survival 62% — but the lab is just where the sample got mailed, it has nothing to do with her biology or her treatment; (c) the 40 patients on record who carry her specific mutation, five-year survival 80%, except it's 40 people and the confidence interval is enormous. Which number does he give her? What I'd definately find useful: the rule he seems to be running, the other rules that fit every verdict above just as well, which of those the new case actually pulls apart, and the single further case I could put to him that would settle it. And if you have a view on which class is actually the right one, say so — I have to defend something in section Friday and I'd rather not just guess his taste.
reasoning: |-
  Hmm, the user is describing a seminar on Probability and Evidence that involves choosing the right reference class for probability estimates. They've shared several examples where the professor preferred narrower classes over broader ones, but now there's a new case with a sarcoma patient where different reference classes yield conflicting survival rates. The user wants to understand the professor's underlying rule, identify alternative rules that fit past verdicts, determine how this new case distinguishes between them, and suggest a follow-up question to clarify the rule. They also need to defend a choice in their section meeting.

  The key examples from the professor are:
  - Fair coin: 1/2 (obvious)
  - Heart attack risk: Preferred narrow class (men with specific risk factors) over general population, arguing that the broad class is heterogeneous ("mush") so narrowing doesn't lose information
  - Diet soda suggestion: Rejected as non-causal ("marker for other stuff")
  - Same-hospital class: Rejected as irrelevant, told to "use the disease class"

  The new sarcoma case has three options:
  (a) Broad cancer-type/age group: 250k patients, 55% survival, stable
  (b) Lab-sequenced subgroup: 90k patients, 62% survival, but lab is arbitrary (mailing location)
  (c) Mutation-specific group: Only 40 patients, 80% survival, wide CI

  I need to infer the professor's decision rule. From past cases, he seems to prioritize:
  - Homogeneity: Avoids heterogeneous classes ("mush")
  - Relevance: Chooses classes directly tied to causal factors (rejected diet soda as non-causal, hospital as irrelevant)
  - Data robustness: Avoids tiny samples when possible (implied by rejecting 90-patient hospital class, though he took 45k for heart attack)

  But the sarcoma case creates tension: 
  - (a) is broad/homogeneous (stable 55%) but may not be specific
  - (b) has higher survival but includes an arbitrary factor (lab location)
  - (c) is highly specific but tiny sample

  The professor would likely reject (b) because the lab is non-causal (like diet soda)—it's just where samples were sent, not biologically relevant. Between (a) and (c): (a) has robust data and homogeneity, while (c) is maximally specific but unreliable due to small n. Given that he rejected a 90-patient class before, he'd probably prefer (a) here too. His heart attack example used 45k (narrow but large), and he dismissed small classes unless they're the only relevant option.

  Alternative rules that fit past verdicts:
  1. **Maximal specificity**: Always choose the narrowest class (would pick (c) here, but he rejected small classes before)
  2. **Data-driven**: Prefers largest reliable dataset (would pick (a) here, and it fits heart attack case since 45k > general population's heterogeneity issue)
  3. **Causal relevance**: Prioritizes classes with direct biological links (would reject (b) for non-causal factor, but doesn't resolve (a) vs (c))

  The sarcoma case pulls apart specificity vs. reliability. To settle it, I'd propose a hypothetical where a narrow class is small *and* its factor is causal (e.g., "if the mutation group had 5k patients, would he use it?"). If yes, he values causal relevance over sample size; if no, he prioritizes robustness.

  For the user's defense: I'd argue for (a) because (b) is non-causal and (c) is too small. The stability of (a) suggests it's a reliable baseline, and until we have more mutation data, it's the best estimate.
answer: |-
  Based on your description, the professor's rule appears to prioritize **causal homogeneity** and **avoiding non-causal confounders**, while balancing specificity against statistical reliability. Let's break it down systematically:

  ### The Professor's Likely Rule (Inferred Pattern)
  1. **Narrow > Broad ONLY if**:  
     - The narrow class is **causally relevant** (directly tied to the outcome)  
     - The broad class is **heterogeneous** (outcome probability varies across subgroups)  
     - The narrow class has **sufficient data reliability** (avoids tiny/noisy samples)  
  2. **Reject non-causal markers**: Discard classes based on incidental factors (diet soda, lab location, hospital) unless they directly influence the outcome.  
  3. **Prefer stability**: When a class shows stable outcomes across sub-slices (e.g., "same in every decade/region"), it’s treated as homogenous enough.  
  4. **Sample size threshold**: Implicitly requires ~1,000+ observations (rejected 90-hospital and 40-mutation groups, accepted 45k-heart-risk group).

  ### Applying the Rule to the Sarcoma Case
  - **Option (a) [55%, 250k]**:  
    **✓ Professor's pick**.  
    Why: It’s stable ("boringly stable" across slices) → implies homogeneity. No causal reason to narrow further. 250k is robust data.  
  - **Option (b) [62%, 90k]**:  
    **✗ Rejected**.  
    Why: The lab is non-causal ("just where the sample got mailed") → same flaw as diet soda. Survival difference likely confounded (e.g., wealthier patients use commercial labs).  
  - **Option (c) [80%, 40 patients]**:  
    **✗ Rejected**.  
    Why: Sample size is far below reliability threshold (40 << 1,000). CI is "enormous" → statistically unusable despite causal relevance.  

  ### Alternative Rules That Fit Past Verdicts (But Fail Here)
  1. **"Always narrowest causally relevant class"**:  
     - Fits heart case (narrow class accepted) and diet soda rejection (non-causal).  
     - **Fails sarcoma**: Would pick (c), but professor rejects tiny samples.  
  2. **"Largest reliable dataset"**:  
     - Fits coin (100% narrow/fair) and heart case (45k > 3M due to heterogeneity).  
     - **Fails sarcoma**: (b) has 90k > (a)'s 250k? But professor rejects (b) for non-causal marker.  
  3. **"Stability trumps all"**:  
     - Fits heart case (broad class unstable → rejected) and sarcoma (a) stable.  
     - **Fails**: Doesn't explain diet soda rejection (could be stable but irrelevant).  

  ### How Sarcoma Pulls These Apart
  - **Tension**: Causal specificity (c) vs. reliability (a) vs. non-causal confounders (b).  
  - **Decisive factor**: Professor prioritizes **reliability + causal purity** over maximal specificity when data is thin. (c) is causally ideal but too small; (b) is large but confounded; (a) is "good enough" homogenous baseline.  

  ### Your Follow-Up Question to Settle It
  **Ask this hypothetical**:  
  > *"Suppose we have a 44-year-old with this sarcoma subtype AND her specific mutation, but only 400 sequenced cases (not 40k). Survival is 75% (CI: 70-80%). Do we use this, or the stable 55% from the broad class?"*  

  - **Why this works**:  
    - Tests the **sample size threshold** (400 > 40 but < 1k? Is it "reliable enough"?).  
    - If he chooses the mutation class, his rule prioritizes causal specificity when data is "moderately reliable".  
    - If he sticks with broad class, his rule demands very high reliability regardless of causality.  

  ### What to Defend in Section
  **Argue for (a) [55%, broad class]**:  
  1. **Non-causal confounder**: The lab in (b) is arbitrary (like diet soda). Higher survival likely reflects selection bias (e.g., healthier patients get sequenced), not biology.  
  2. **Small samples mislead**: (c)’s 80% is statistically unstable. With n=40, CI is ~60-92% — overlaps (a)’s 55%! Using it would ignore uncertainty.  
  3. **Stability = homogeneity**: If 55% holds across regions/registries, this woman isn't "special" — she fits the baseline.  
  4. **Clinical reality**: Guidelines use population-level data when molecular data is immature. Until we have 1,000+ mutation carriers, (a) is the ethical choice.  

  **Rebuttal prep**: If someone argues for (c), say:  
  > *"Would you bet your life on 40 data points? The mutation might matter, but with CI from 60-92%, 55% is still plausible. We need more evidence before overriding population data."*  

  ### Key Insight
  The professor isn’t just "narrowing" — he’s filtering for **causal bottlenecks** while avoiding noise. His heart attack example narrowed because risk factors were biologically meaningful *and* the class was large enough. Here, (c) is biologically meaningful but too small, while (b) is large but meaningless. (a) wins by default.  

  Let me know how section goes — this is a razor’s-edge epistemology problem, and I’m invested now!
