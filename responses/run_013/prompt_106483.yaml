answer: |-
  ## The Archimedean Lever Foundation (ALT)  
  **Guidance for Applicants: Form ALT-7 "Causal Horizon Impact Assessment"**  
  *(Version 4.3, Reviewed by the Office of Epistemic Restraint)*

  **Q1: What is the purpose of Form ALT-7, and why is it mandatory for all funding requests exceeding $5,000?**  
  A1: The Archimedean Lever Foundation is committed to maximizing aggregate expected value across the complete causal manifold. Form ALT-7 ensures applicants rigorously demonstrate that their proposed project's net positive consequences demonstrably outweigh its net negative consequences, accounting for the totality of its causal ripples through spacetime. This includes, but is not limited to, effects on sentient beings not yet conceived, the trajectory of complex systems (e.g., climate, geopolitics, cultural evolution), and the ultimate fate of civilization or its potential successors. Mandatory completion underscores our foundational commitment to true consequentialist rigor.

  **Q2: Section 3 demands a "Complete Causal Chain Analysis." What qualifies as "complete"?**  
  A2: "Complete" signifies tracing the primary and secondary consequences of the project ad infinitum, or until causal influence becomes theoretically indistinguishable from background noise (estimated at approximately 10^8 years for most macro-scale interventions; consult Annex Γ for sector-specific decay constants). Applicants must identify key branching points where minor variations could lead to significantly divergent outcomes (e.g., influencing the career path of an individual whose descendant founds a pivotal interstellar colony vs. one whose lineage terminates prematurely). While computational constraints render *perfect* completeness impossible, the Foundation expects a good-faith effort to map the dominant pathways and acknowledge significant chaotic sensitivities. Flowchart software is recommended, though scrolls exceeding 50 meters require prior approval.

  **Q3: How should I quantify effects on individuals who do not yet exist? (Section 4.2: "Future Persons & Modal Populations")**  
  A3: Applicants must construct probabilistic models of potential future populations affected by the project's long-term trajectory alterations. This involves:  
      a) Estimating the number of potential future persons whose existence is contingent upon chains of events influenced by the project (utilize standard counterfactual person-affecting frameworks).  
      b) Assigning expected welfare ranges to these potential persons based on projected civilizational states (optimistic, baseline, catastrophic).  
      c) Discounting welfare impacts appropriately across deep time (ALT employs a hyperbolic discounting function with an asymptote at t=10^6 years; see Calculator Tool Δ-7).  
  We acknowledge the inherent speculative nature of this task. The key is demonstrating methodological awareness of the ontological and evaluative challenges posed by non-actual, future entities. Assertions without supporting probability distributions (however sparse) will be deemed insufficient.

  **Q4: Section 5 requires an "Expected Value Calculation Against the Null Counterfactual." How can this be done given chaotic dependence?**  
  A4: The Foundation recognizes that chaotic systems render precise point estimates of long-term net value computationally intractable and arguably metaphysically indeterminate ("cluelessness"). Nevertheless, applicants are required to:  
      a) Define the most plausible "null scenario" (world without the project).  
      b) Identify critical junctures where the project's influence introduces significant path divergence.  
      c) Assign probability distributions to major downstream outcomes at these junctures (e.g., "Probability: 0.03 - Project accelerates development of AI governance, averting existential catastrophe; Probability: 0.001 - Project subtly shifts cultural norms, leading to a prolonged interstellar dark age").  
      d) Compute expected value differentials *within each modeled pathway*.  
      e) Aggregate these pathway-specific EVs, weighted by their probability.  
  While the summation across vastly divergent, incomparable civilizational states (e.g., comparing the value of a thriving post-human cosmos to a universe containing only mildly contented beetles) poses profound commensurability problems, the *attempt* at aggregation is essential. Document all assumptions regarding value metrics and commensuration.

  **Q5: Given the admitted impossibility of definitive calculation, how will ALT assess the adequacy of Form ALT-7?**  
  A5: Assessment focuses on *procedural diligence*, not predictive accuracy. Reviewers (Senior Fellows of Causal Reckoning) evaluate:  
      *   **Scope Acknowledgment:** Does the applicant fully acknowledge the theoretically infinite scope of consequences and the impossibility of certain knowledge?  
      *   **Chaos Sensitivity:** Is there explicit identification of key points of high causal sensitivity and path dependence?  
      *   **Uncertainty Mapping:** Are major sources of deep uncertainty (ontological, epistemic, valuational) rigorously cataloged and their implications for the EV calculation discussed?  
      *   **Absence of Illicit Truncation:** Does the analysis avoid arbitrarily cutting off consequences at a conveniently near-term horizon without justification?  
  Projects demonstrating superior procedural diligence in confronting the abyss of cluelessness will be prioritized, as they best align with the Foundation's ethos of uncompromising consequentialist integrity. Form ALT-7 is not about providing answers; it's about authentically grappling with the question.

  **Q6: Is there a final attestation required?**  
  A6: Yes. The final page of Form ALT-7 includes the **Affirmation of Conscientious Perplexity**:  
  > *"I, the undersigned Principal Investigator, attest that I have expended significant effort in attempting to trace the total causal consequences of the proposed project to the furthest conceivable horizons of space, time, and possibility. I acknowledge that the net expected value calculation submitted is fundamentally indeterminate due to chaotic amplification, incommensurable future states, and the problem of non-actual persons. I affirm that this profound uncertainty has been duly confronted and documented, and that no known method exists to resolve it conclusively. I nevertheless assert, based on the severely bounded analysis possible, that this project is the course of action most reasonably expected to maximize aggregate value across the causal manifold."*  
  Signature and date are mandatory.
