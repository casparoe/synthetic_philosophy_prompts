answer: |-
  ### Conditions for Conventional Moral Obligation
  For a convention to generate a genuine moral obligation, it must satisfy two core conditions: (1) **Substantive moral grounding** – the convention must serve a non-arbitrary moral end (e.g., preventing harm, ensuring fairness, sustaining a public good, or expressing respect). (2) **Reliance/expectation** – individuals must reasonably rely on compliance for that end, creating a duty of reciprocity or non-exploitation. Mere coordination efficiency is insufficient; the convention must implicate a moral value that would persist even if uncoordinated. Arbitrary "schedule" conventions (like escalator sides) only become obligatory when non-compliance would undermine trust, fairness, or the shared good the coordination enables. "Contribution" conventions directly engage with harm/benefit, while "regard" conventions express interpersonal respect. Hybrids combine these.

  ### Ratings Table
  *(Assumptions: Tipping assumes no auto-gratuity; mid-block crossing assumes illegal but routinely ignored when safe; pedestrian signal assumes legal requirement but unenforced on empty streets; seat buffer assumes no reserved seats.)*

  | Item | Insider Bindingness (a) | Outsider Bindingness (b) | Visitor Multiplier (b/a) | Type Label | Hybrid Notes |
  |------|--------------------------|---------------------------|--------------------------|------------|--------------|
  | 1. Tipping at full-service restaurant | 0.90 | 0.70 | 0.78 | Contribution-Regard | Grounded in fair wages (contribution) and appreciation (regard). |
  | 2. Tapping tip at counter-service café | 0.40 | 0.20 | 0.50 | Contribution | Weak contribution (staff wages less dependent on tips); minimal regard. |
  | 3. Not stepping into queue gap | 0.95 | 0.85 | 0.89 | Schedule-Regard | Schedule (orderly flow) + regard (respecting others' position/effort). |
  | 4. Standing right on escalator | 0.80 | 0.75 | 0.94 | Schedule | Purely coordination; disruption causes inefficiency/mild frustration. |
  | 5. Crossing mid-block (no traffic) | 0.15 | 0.15 | 1.00 | Schedule | Legal schedule convention; negligible moral weight without risk/audience. |
  | 6. Waiting at signal with others | 0.75 | 0.55 | 0.73 | Schedule-Regard | Schedule (coordination) + regard (solidarity/norm-adherence pressure). |
  | 7. Not taking last shared item | 0.85 | 0.80 | 0.94 | Regard-Contribution | Regard (deference to others' desire) + contribution (fair access to good). |
  | 8. Holding door for someone close | 0.90 | 0.90 | 1.00 | Regard | Expresses basic courtesy; minimally convention-dependent. |
  | 9. No speakerphone on crowded train | 0.95 | 0.95 | 1.00 **(↑)** | Contribution | Harm (noise pollution) is intrinsic. Visitor may feel *more* bound if their culture emphasizes public quietude. |
  | 10. Giving seat to elderly/pregnant | 0.99 | 0.99 | 1.00 | Regard-Contribution | Prevents harm (discomfort/risk) + expresses care. Near-universal moral core. |
  | 11. One-seat buffer on transit | 0.65 | 0.30 | 0.46 | Schedule-Regard | Schedule (space optimization) + regard (privacy). Highly context-dependent. |

  **Visitor Multiplier >1.00 Explanation (Item 9):** A convention binds a foreigner more tightly if the *underlying moral harm* is amplified by their ignorance. Here, a visitor from a culture with stricter public noise norms might perceive the intrusion as *more* ethically egregious, increasing their felt obligation despite unfamiliarity with the local rule.

  ### Test Results
  1. **Empty-Street Test** (Remove all bystanders):  
     - **Survive**: Items 1 (tip sustains wage fairness), 7 (last item retains regard/fairness), 8 (door-holding remains courteous), 9 (noise harms others directly), 10 (need for seat is physical).  
     - **Collapse**: Items 2 (counter tip loses social pressure), 3 (queue gap irrelevant alone), 4 (escalator side arbitrary alone), 5/6 (crossing signals lack coordination point), 11 (buffer loses social meaning).  
     *Insight*: Conventions sustained purely by an audience (5,6,11) evaporate; others retain core moral anchors.

  2. **Overnight-Flip Test** (Conventions reversed):  
     - **Obligation Changes**: Items 3 (queue direction), 4 (escalator side), 6 (signal-waiting), 11 (buffer side) – obligation flips to new rule.  
     - **Unaffected**: Items 1 (tipping’s wage-support persists), 7 (deference to others unchanged), 8 (courtesy invariant), 9 (noise harm identical), 10 (need for seat unchanged).  
     *Insight*: Pure schedule conventions (4) flip; regard/contribution hybrids (1,7,9,10) retain moral core.

  3. **All-Visitors Test** (No insiders, no shared norms):  
     - **Retain Point**: Items 8 (door-holding), 9 (quiet transit), 10 (yielding seats) – moral logic independent of convention.  
     - **Lose Point**: Items 2 (counter tips), 4 (escalator sides), 5 (mid-block crossing), 6 (signal-waiting), 11 (seat buffer) – rely on established coordination.  
     - **Partial Point**: Items 1 (fair wages still relevant), 3 (queuing efficiency matters), 7 (sharing etiquette has universal roots).  
     *Insight*: Conventions with strong intrinsic moral components persist without cultural embedding.

  ### Invariance Hypothesis Assessment
  The hypothesis ("outsider bindingness ∝ convention-independent moral force") is **broadly supported but imperfect**. Strong correlations exist: items with high convention-independent weight (8,9,10) have near-identical (a) and (b); low-independent items (4,5,11) show large gaps.  
  **Strongest Counterexample: Item 3 (Queue Gap)**.  
  - **Why**: Insider bindingness is very high (0.95) due to reliance/expectation. Outsider bindingness remains strong (0.85) *despite* minimal convention-independent moral force (cutting in causes minor inefficiency, not inherent harm). The obligation arises from the *outsider's participation in a coordinated system* they benefit from, creating a duty not to free-ride. This "fair play" element is convention-dependent yet binds outsiders.

  ### Tier List of Plausible Universal Moral Obligations
  From most to least plausibly binding on anyone:  
  1. **Tier 1 (Strong)** : 10 (Seat for vulnerable), 9 (No speakerphone), 8 (Hold door)  
  2. **Tier 2 (Moderate)** : 7 (Last item), 3 (Queue integrity), 1 (Full-service tip)  
  3. **Tier 3 (Weak)** : 6 (Signal with group), 4 (Escalator side), 2 (Counter tip)  
  4. **Tier 4 (Negligible)** : 11 (Seat buffer), 5 (Mid-block crossing)  

  **Most Defensible Principle**:  
  *A local convention binds a visitor if (i) it serves a non-arbitrary moral end (harm prevention, fairness, or respect), and (ii) the visitor knowingly benefits from or participates in the cooperative system it sustains.*

  **Least Confident Placement**: Item 3 (Queue integrity) in Tier 2.  
  - **Why**: Its moral weight hinges heavily on cultural framing of "fairness" in queues; some societies prioritize efficiency over order, making its universal obligation debatable despite the "fair play" argument.
