prompt: |-
  I work on causal inference and information theory — directed acyclic graphs, interventions and the do-operator, mutual information, minimum description length — and I have no training in neuroscience or phenomenology. I would like you to restate Integrated Information Theory as faithfully as you can in that vocabulary: what a cause–effect repertoire becomes, what Φ becomes, what the exclusion postulate becomes, and what work the axioms and postulates do once the theory is put this way. Then give me the residue report. Which parts of the theory translate cleanly into my terms, which translate only under distortion (and what exactly gets distorted), and which have no counterpart at all? I am especially interested in two candidates for the last category: the theory's insistence on an intrinsic rather than observer-relative perspective, and its identification of a particular cause–effect structure with experience itself. Finish by telling me whether the residue looks like a gap in my framework or a sign that the original claim was less well-defined than it first appeared.
