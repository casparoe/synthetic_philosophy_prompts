prompt: |-
  My flatmate's doing an econ PhD and we ended up going at it until 2am about whether there are things that just shouldn't be for sale, and I came out of it with a list of gut calls I can't get to line up. Stuff I'm fine with: selling plasma for cash, getting paid to donate eggs, scalping concert tickets, paying a line-sitter to hold your spot at the DMV, paying someone to carry an ad on their car, and — my flatmate says this is the one that sinks me — paying a little person to get thrown onto a mattress in a bar, or paying two guys to punch each other's heads in for a purse, as long as the money's real and nobody's twisting anyone's arm. Stuff I'm not fine with: selling a kidney, even to a rich guy who'd pay life-changing money and isn't being coerced; the state legislator who floated knocking four years off a sentence in exchange for a kidney donation; paying someone to take the fall and serve your jail time; buying a baby; selling your vote. Then there's a bunch where I'm firm but the firmness feels weird. Charging $20 for a case of water in a flooded town is wrong even though it'd get water trucked in faster, but doubling the price of a concert ticket is fine. Letting a rich guy buy a nicer cell is wrong, letting him buy a nicer seat on the plane is obviously fine. Paying a student cash for A's is wrong, paying a kid to read books is fine. Paid surrogacy bugs me but paid egg donation doesn't, and I genuinely can't say why except that nine months inside someone is different from a needle. And the one that really gets me: a firm that buys up every visa-appointment slot and every permit slot and resells them at ten times the price is vile, but a person standing in line for you for $40 is fine — those look like the same thing with different furniture.

  The best principle I can come up with is something like: a thing shouldn't be for sale when putting a price on it wrecks what the thing is — a vote stops being a vote, a kidney stops being a part of you, a baby stops being a person — and desperation makes it worse even when the paperwork is clean. But that tells me the dwarf-tossing thing is out, and I say it's in, and it doesn't touch the eggs-versus-surrogacy gap at all. So: is there a principle, or a small set of them, that gets my calls, or close? What does it say about the ones I haven't thought about — the charity that pays addicts a few hundred bucks to get sterilized, the auction where someone pays a fortune for the right to shoot an old non-breeding rhino with the money going to anti-poaching, a company that pays a stranger to go vegan so you can keep eating steak? And be honest about which of my calls I'd have to give up, because I'd rather have a clean principle and loose one or two verdicts than keep every verdict with a rule that's just a list. Tell me straight where the weak joint is — where the reasoning is most likely to break, and what case or argument would actually change your mind about the principle you hand me.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They've got a list of things they're okay with being sold and others they're not, and they're struggling to find a consistent principle. The user mentioned things like selling plasma, egg donation, ticket scalping, and even dwarf-tossing as acceptable, but draw the line at selling kidneys, votes, babies, and price gouging during disasters. 

  First, I need to understand why they have these distinctions. Their gut reactions seem to revolve around certain core ideas: exploitation, degradation of intrinsic value, and coercion. For example, selling a kidney feels wrong because it's a part of oneself that shouldn't be commodified, while selling plasma is seen as a renewable resource. The user also mentioned desperation as a factor—even if consent is present, extreme need might make a transaction exploitative.

  Looking at their proposed principle—that putting a price on something wrecks its essence—I see where it works and where it fails. Votes and babies lose their fundamental nature when sold, which aligns. But dwarf-tossing? The user accepts it, but their principle would reject it because it commodifies human dignity. So there's a conflict there.

  The surrogacy vs. egg donation gap is another puzzle. Both involve reproductive contributions, but the user feels differently about them. Surrogacy involves a longer, more physically involved process, which might trigger concerns about bodily autonomy and exploitation over time. Eggs, being a one-time procedure, might feel less intrusive. But is that distinction consistent? Maybe the duration and physical impact matter, but that needs to fit into a broader framework.

  Then there's the visa slot scalping vs. line-standing. Both are about paying for access, but the user finds one vile and the other acceptable. The key difference might be in scale and monopoly. A company hoarding all slots creates artificial scarcity and exploits systemic inefficiencies, whereas an individual offering a service (line-standing) is a direct exchange without monopolistic control. 

  The disaster price gouging example is tricky. The user rejects $20 water in a flood but accepts doubled concert tickets. Here, necessity plays a role—water is essential for survival during a crisis, making price hikes exploitative. Concert tickets are luxuries, so market pricing feels fair. This ties into the harm principle: price gouging during emergencies causes direct harm by denying essentials to those who can't pay, while luxury pricing doesn't.

  Now, applying a three-part framework: Harm, Degradation, and Voluntariness. Harm covers immediate physical or essential needs violations. Degradation addresses when commodification reduces intrinsic human or social values. Voluntariness considers genuine consent, especially without desperation. 

  Testing this against their examples: Kidney sales involve harm (health risk), degradation (body as commodity), and potential voluntariness issues (desperation). Dwarf-tossing might pass on harm (if safe) and voluntariness, but degradation is the sticking point. The user accepts it, so maybe they see it as consensual entertainment without lasting harm, thus less degrading. 

  For surrogacy vs. eggs, surrogacy's long-term physical commitment and emotional ties might trigger degradation concerns more than egg donation. The visa scalper creates harm by monopolizing access, while line-standing doesn't. 

  The user's exceptions might include dwarf-tossing, where degradation is outweighed by consent and no harm. They'd need to accept that degradation matters but isn't absolute, allowing some cases if other factors align. 

  New cases: Paying addicts for sterilization risks degradation and desperation exploitation. Conservation hunting could be acceptable if funds aid survival and the animal isn't endangered, balancing harm and degradation. Veganism offsets might pass if no direct harm and voluntary, but could degrade moral responsibility. 

  The weakest joint is degradation—subjective and culturally variable. If dwarf-tossing is deemed non-degrading in context, the principle holds. But if society views it as inherently demeaning, the user's acceptance conflicts. They might need to adjust either their verdict or principle here. 

  Overall, the framework explains most of their intuitions, requiring flexibility on borderline cases like dwarf-tossing. Emphasizing context and avoiding absolutism could reconcile their stance.
answer: |-
  Here's a clean, three-part principle that captures ~90% of your intuitions, identifies your tension points, and handles new cases:

  **The Principle:**  
  A transaction is morally problematic if it violates **one or more** of these core conditions:  
  1. **Harm Avoidance:** It creates *unavoidable, severe physical harm* or *exploits essential-need desperation*.  
  2. **Degradation Prohibition:** It commodifies something whose value is *fundamentally non-fungible* (turning persons, civic acts, or intrinsic rights into mere objects/tools).  
  3. **Voluntariness Requirement:** Consent is *substantively compromised* by coercion, systemic injustice, or extreme power imbalance (beyond ordinary market inequalities).

  ---

  ### How It Maps to Your Cases
  **✅ Your "Fine" List Explained:**  
  - **Plasma/Eggs:** No *severe unavoidable harm* (regulated safety), not *degrading* (body renewable/not identity-core), *voluntary* (not essential-desperation).  
  - **Scalping/Line-Sitting:** No *harm* (luxury/access, not survival), not *degrading* (services, not civic/personhood), *voluntary* (no systemic coercion).  
  - **Car Ads/Dwarf-Tossing/Boxing:** No *severe unavoidable harm* (if safety-regulated; dwarf-tossing on mattresses ≠ organ removal), not *degrading* if viewed as *consensual performance* (not reducing personhood), *voluntary* (if workers aren't desperate).  

  **❌ Your "Not Fine" List Explained:**  
  - **Kidney Sale:** Violates **Harm** (irreversible health risk), **Degradation** (treating body as spare parts).  
  - **Sentence-for-Kidney:** Violates **Degradation** (justice isn't auctionable), **Voluntariness** (prison coercion).  
  - **Buying Jail Fall Guy:** Violates **Degradation** (justice perverted), **Voluntariness** (power imbalance).  
  - **Buying Baby/Vote:** Violates **Degradation** (persons/civic voice aren't commodities).  

  **🤔 Your "Firm but Weird" Cases Resolved:**  
  - **$20 Water in Flood:** Violates **Harm** (exploits essential-need desperation).  
  - **Concert Ticket 2x Price:** No **Harm** (non-essential), not **Degrading**.  
  - **Buying Nicer Jail Cell:** Violates **Degradation** (equal justice isn't for sale).  
  - **Nicer Plane Seat:** Not **Degrading** (service upgrade, not civic right).  
  - **Paying for A’s:** Violates **Degradation** (education’s purpose is corrupted).  
  - **Paying to Read Books:** Not **Degrading** (incentivizing learning, not corrupting purpose).  
  - **Surrogacy vs. Egg Donation:** Surrogacy risks **Harm** (long-term bodily risk) + **Degradation** (commodifying reproductive labor *as a service*). Eggs avoid this by being tissue donation.  
  - **Visa Slot Scalper vs. Line-Sitter:** Scalper violates **Harm** (creates artificial scarcity exploiting desperation) + **Degradation** (public access becomes paywall). Line-sitter is a service, not hoarding a public good.  

  ---

  ### Where You’d Need to Adjust (Your "Weak Joints")
  1. **Dwarf-Tossing:** Your principle *should* reject it under **Degradation** (treating a person as a projectile objectifies human dignity). To keep it "in," you must either:  
     - **Concede:** Degradation isn't absolute if consent is robust (making it performance art, not commodification).  
     - **Or Refine:** Degradation applies only to *inherent* traits (e.g., height) used reductively, not skills.  

  2. **Paired Fighting:** Similar issue. If fighters are consenting professionals (like MMA), **Harm** may be mitigated by regulation. If it’s "two guys punching for purses" with no safeguards, it violates **Harm**.  

  **This is your weak joint:** Your tolerance for bodily risk/performance clashes with the Degradation pillar. If you insist dwarf-tossing is permissible, you must narrow Degradation to exclude *consensual, symbolic acts* (e.g., "This job uses my body but doesn’t reduce my humanity").  

  ---

  ### New Cases Judged by the Principle
  - **Paying Addicts for Sterilization:** ❌ Violates **Harm** (preys on desperation) + **Degradation** (reduces bodily autonomy to crisis commodity).  
  - **Auctioning Rhino Hunt:** ✅ **Harm** avoided (non-breeding, funds conservation). Not **Degrading** (conservation goal justifies controlled loss).  
  - **Paying Someone to Go Vegan for You:** ⚠️ Tenuous. No **Harm**, but arguably **Degrades** moral responsibility (offsetting becomes transactional). Likely permissible but ethically hollow.  

  ---

  ### Why This Works & What Could Break It
  **Strength:** It avoids ad-hoc lists by focusing on *moral pillars* (harm, dignity, consent). It explains why "desperation matters" (Harm/Voluntariness) and why "some things can’t be sold" (Degradation).  

  **Breaking Point:** The **Degradation** criterion is culturally subjective. Example:  
  - *Challenge:* "Is paid surrogacy *inherently* degrading if the surrogate feels empowered? Isn’t all wage labor commodification?"  
  - *Defense:* Degradation applies when commodification corrupts the *essence* of an act (e.g., parenting → baby-selling, justice → bribes). If surrogacy is framed as gestational labor (not mother-child bonding), it may pass if **Harm** and **Voluntariness** are solid.  

  **Honest Trade-off:** To keep dwarf-tossing, you must accept that **Degradation** isn’t violated by *any* bodily commodification—only when it reduces a person to a *mere object* (e.g., selling kidneys) vs. *using your body in a service* (boxing, tossing). This puts the burden on defining "objectification" clearly.  

  **Final Verdict:** Your instincts align with a harm/dignity/consent framework. The dwarf-tossing case is your outlier—embrace it as a *limited exception* for consensual risk-taking, or tighten Degradation and drop the verdict. Either way, you’ve got 90% coherence.
