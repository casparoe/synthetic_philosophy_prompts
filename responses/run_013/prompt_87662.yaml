prompt: |-
  I'm taking a module on corruption and development and I've been using my flatmate as a guinea pig — she's just finished an MA on governance in West Africa and has very firm views. Her verdicts so far:

  - a council officer takes a £250 bottle of whisky from a firm bidding for a contract she'll help score — corruption, obviously;
  - a clerk takes £20 to move a file that was going to move anyway — corruption, and she says the amount is beside the point;
  - a doctor accepts a box of chocolates and a card from a family after a difficult delivery — not corruption, "that's just gratitude";
  - a chief accepts a goat and a crate of drink at his installation from the community he's about to serve — not corruption, "nobody's buying anything";
  - a manager hires her nephew over two better-qualified candidates — corruption;
  - a councillor hands out envelopes of cash at a rally — she says that's clientelism, a different essay, which felt like a dodge.

  The case I want to spring on her: my uncle works in procurement for a water utillity in a country where it's completely normal for suppliers to send the whole office hampers at Eid — modest, same for everyone, down to the cleaners. But the head of procurement gets one worth about a month's salary, from a supplier with a live bid in the current tender. Nothing illegal, nothing hidden, no sign that any desicion changed.

  Will she call it corruption? More usefully: what rule is she actually running, what other rules fit everything she's said so far just as well, and which of my cases would best prise them apart? If her verdicts genuinely don't settle it, tell me what she'd be signing up to on each reading. She's always going on about not imposing outside norms on gift-giving, so I'd also like to know whether the rule she's running is really just a Western standard dressed up as neutral analysis. Give me your best guess, and say where you think your reading of her is most likely to be wrong and what would change it.
reasoning: |-
