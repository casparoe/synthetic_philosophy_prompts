  The user's role is crucial - they're the sceptic, so their job is to prevent costly mistakes. The pension fund's size means errors would be visible to members, adding pressure. They have limited time (a working day) and no resources for external research, so the procedure must be efficient and self-contained. The key insight from no-trade theorems is that speculative trade shouldn't happen in efficient markets with rational actors and common priors, so any proposed trade must justify why these assumptions fail.

  For the decision procedure, I'll build around Milgrom-Stokey and Grossman-Stiglitz. The core is forcing explicit identification of which market efficiency assumption is violated. The procedure must include: a checklist of questions in logical order, clear criteria for sufficient answers, predefined non-informational motives (with reality checks), rules for when their own trading motive is non-informational, framework for interpreting price action (forecast vs. flows), stopping rules, and honest labeling of judgment steps.

  For non-informational counterparty motives, I'll list: forced/mechanical flows, hedging, tax, mandate/index constraints, agency/career incentives, and noise. The reality test should require direct evidence, not just stories - like public filings for forced selling or mandate documents for constraints.

  The reverse-direction rule is vital: if their fund trades for non-informational reasons (like window-dressing), their conviction shouldn't count as information. This prevents self-deception.

  For interpreting price moves, I'll distinguish between "forecast prices" (reflecting expectations) and "flow prices" (driven by liquidity). The test involves checking if price moves correlate with news or just volume spikes.

  Stopping rules should trigger when: they can't name which assumption fails, can't substantiate non-informational motives, or when the risk is unquantifiable. Judgment points need explicit acknowledgment - like assessing information asymmetry credibility or career risk tolerance.

  Now for the three proposals:

  1. Shorting on regulatory risk: Fails on identifying counterparty motive. The "investors are complacent" story is weak without proof of non-informational selling. The cost/risk isn't named - regulatory uncertainty affects everyone. This should be rejected.

  2. Buying into forced liquidation: Passes because the non-informational motive (leveraged fund blowup) is verifiable through public data. The risk is liquidity provision, which they can name. Judgment is needed on overshoot size, but it's acceptable.

  3. Private conversation trade: Fails spectacularly. "Someone in industry" is vague, violating common knowledge. They can't prove exclusivity or that others don't know. The cost isn't theirs - they're free-riding. Huge judgment call on credibility, but procedure forces rejection.

  Proposal 3 will be rejected - the user won't like it because it's their largest trade, but the procedure exposes the informational weakness. I need to state this plainly.

  The answer must be in British English and avoid academic references, focusing on practical application. The tone should be professional but accessible, matching a committee setting.
answer: |-
  Below is a practical decision procedure based on no-trade theorems, designed for efficiency and defensibility in your role. It operationalises the intuition that contrarian trades require explicit justification for *why* market efficiency assumptions fail. The procedure is structured as a checklist, with clear stopping points.

  ### Decision Procedure: Contrarian Trade Scepticism Framework  
  *(Adapted from Milgrom-Stokey no-trade, Grossman-Stiglitz paradox)*  

  **Core Principle**: A trade only occurs if there is *asymmetric information*, *divergent priors*, *aggregate uncertainty*, or *non-informational motives*. If none can be substantiated, reject the trade.  

  **Questions in Order** (Answer sequentially; proceed only if "YES"):  
  1. **"Which market efficiency assumption fails?"**  
     - *Sufficient answer*: Name **one** of:  
       - (a) Asymmetric information (we know something material others don’t),  
       - (b) Divergent priors (we interpret public information differently *and* cannot be arbitraged away),  
       - (c) Aggregate uncertainty (unhedgeable macroeconomic shock),  
       - (d) Non-informational motive driving counterparty (see Question 2).  
     - *Stop if*: Cannot name one. Verdict: **NO TRADE**.  

  2. **"Is the counterparty’s motive non-informational?"** (Only if 1(d) chosen)  
     - *Permissible non-informational motives*:  
       - Forced/mechanical flows (e.g., index rebalancing, ETF creations/redemptions).  
       - Hedging (e.g., derivatives expiry, portfolio protection).  
       - Tax/regulatory mandates (e.g., loss harvesting, capital requirements).  
       - Mandate/index constraints (e.g., forced selling due to credit downgrade).  
       - Agency/career incentives (e.g., window-dressing, benchmark tracking).  
       - Noise (e.g., retail herding, algorithmic trading glitches).  
     - *Reality test*: **Evidence, not narrative**. Require:  
       - Public data (e.g., fund filings showing leverage ratios),  
       - Market structure mechanics (e.g., futures roll dates),  
       - Regulatory disclosures, or  
       - Transaction patterns (e.g., panic selling on high volume, no news).  
     - *Stop if*: Motive is plausible but lacks evidence. Verdict: **NO TRADE**.  

  3. **"Is our motive non-informational?"**  
     - *Rule*: If our trade is driven by: liquidity rebalancing, regulatory compliance, or internal politics (e.g., "we need to deploy cash"), **discount all informational claims**. Our "conviction" carries zero evidential weight.  
     - *Stop if*: Yes. Verdict: **NO TRADE** unless purely risk-management rationale (e.g., hedging).  

  4. **"Is the price a forecast or a flow artefact?"** (Assessing price efficiency)  
     - *Test for forecast prices*: Does the asset price react predictably to news (e.g., earnings surprises, macro data)?  
     - *Test for flow-driven prices*: Does the price move on high volume without news, or correlate with mechanical factors (e.g., VIX spikes, funding stress)?  
     - *Rule*: If price is flow-driven (Question 2 confirmed), we may trade *if* we are providing liquidity. If it’s forecast-driven, we need asymmetric information (Question 1(a)) to justify divergence.  

  5. **"What cost/risk are we bearing?"**  
     - *Sufficient answer*: Name a **specific, uncompensated risk** we assume:  
       - Liquidity risk (e.g., holding illiquid assets),  
       - Funding risk (e.g., margin calls on shorts),  
       - Informational risk (e.g., our edge decays),  
       - Regulatory risk (e.g., changing rules).  
     - *Stop if*: Claimed "edge" lacks an associated cost/risk. Verdict: **NO TRADE** (free lunches are rare).  

  **Stopping Rules**:  
  - **Automatic NO**: Failure at Questions 1, 2 (unsubstantiated), 3, or 5.  
  - **Human Judgment Required**: At Questions 1(b) (interpreting priors), 1(c) (assessing aggregate risks), or sizing the position. These involve risk tolerance, not facts.  

  **Judgement in Procedural Clothing**:  
  - Question 1: Classifying the "failure" is subjective but must be explicit.  
  - Question 2: Weighing evidence quality is judgement (e.g., is a 10% volume spike "noise"?).  
  - Question 4: Distinguishing "flow" from "forecast" requires market feel.  

  ---

  ### Application to Proposals  

  **Proposal 1: Shorting a large company on regulatory crackdown thesis**  
  - Q1: Claims **(a) Asymmetric information** (we see regulatory risk others miss).  
  - Q2: Not applicable (Q1 not (d)).  
  - Q3: Our motive is informational (assumed).  
  - Q4: Price likely "forecast-driven" (widely followed, reacts to news). Requires proving we know more than market.  
  - Q5: Risk: Regulatory uncertainty affects all players. **No unique cost/risk named** (we aren’t regulators; no proprietary data).  
  - **Verdict: NO TRADE**.  
    - *Why you won’t like it*: You’ve identified a plausible risk, but the framework forces admission you have no edge. "Underestimation" implies divergent priors (Q1(b)), but that’s uncompensated risk without structural barriers to arbitrage.  

  **Proposal 2: Buying into a sharp fall in a widely held share (forced liquidation thesis)**  
  - Q1: Claims **(d) Non-informational motive** (leveraged fund forced selling).  
  - Q2: **Evidence possible**: Check public data (fund’s reported leverage, margin calls), trading patterns (panic selling on high volume, no news). Reality test passed.  
  - Q3: Our motive informational? Yes (buying undervalued asset).  
  - Q4: Price is **flow-driven** (liquidation-driven fall). Valid to provide liquidity.  
  - Q5: Risk: **Liquidity provision** (holding during volatility). Cost is capital commitment during uncertainty.  
  - **Verdict: PROCEED** (with position sizing judgement).  
    - *Why defensible*: Framework isolates a mechanical driver with evidence.  

  **Proposal 3: Largest position based on private industry conversation**  
  - Q1: Claims **(a) Asymmetric information** (private knowledge).  
  - Q2: Not applicable.  
  - Q3: Motive informational.  
  - Q4: Price likely "forecast-driven" (widely followed).  
  - Q5: Risk: **Informational decay** (if market learns, edge vanishes). But:  
    - **Critical failure**: Cannot prove **asymmetry**. Private conversations are rarely exclusive or verifiable. Markets price costly information; free gossip is unlikely valuable.  
  - **Verdict: NO TRADE**.  
    - *Why you won’t like it (and why it’s rejected)*: This is your largest bet, but the procedure exposes it as epistemically reckless. "Someone in the industry" implies common knowledge failure (Q1(a)), but you can’t prove others don’t know it. No real cost borne (Q5: you didn’t pay for research). **Judgement dominates here, but procedure forces rejection** unless you can document exclusivity and materiality.  

  ---

  **Summary**:  
  - **Proposal 1 rejected**: No named cost/risk, unsubstantiated edge.  
  - **Proposal 2 accepted**: Verifiable non-informational driver.  
  - **Proposal 3 rejected**: Asymmetry claim unprovable; violates "no free lunch" principle.  

  This forces explicit justification, curbing narratives. When minutes record your dissent, you can show adherence to a rational, transaction-cost-aware process—even when unpopular.
