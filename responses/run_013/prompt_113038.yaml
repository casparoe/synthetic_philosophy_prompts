  Alex's reciprocity defense feels culturally valid but... *checks notes*... she never addresses Dana's point about ministers looting treasuries. That's a hole in her argument. Meanwhile Dana's slippery slope concern is real but overplayed - not all reciprocity scales to grand corruption.

