answer: |-
  Here is a menu of distinct interpretations of "a promise is a promise," analyzed along your specified axes. Each reading is isolated, its commitments made explicit, and sorted by grounding, reason-type, scope, and verdict. I also assess whether each reading licenses shutting down override questions and its likelihood in ordinary speech.

  ---

  ### **Reading 1: Absolutist Deontic Constraint**  
  *"The obligation created by a promise is indefeasible; no competing good can override it."*  
  - **Grounding**: The *act of promising itself* (will-based autonomy or sacredness of commitment).  
  - **Reason-type**: **Exclusionary reason** (displaces competing considerations; not weighed).  
  - **Weight**: Infinite (cannot be outweighed).  
  - **Wronged party**: Primarily the promisee (violation disrespects their autonomy), secondarily the moral order.  
  - **Scope**:  
    - Survives promisee’s death/forgetting? **Yes** (obligation binds irrespective of awareness).  
    - Extinguished by release? **No** (promisee cannot unilaterally dissolve the duty; obligation is to the *act* itself).  
    - Reinterpretation? **No** (content fixed at utterance).  
  - **Verdict**: **Substantive and dubious** (ignores catastrophic cases, e.g., breaking lunch promise to save a life).  
  - **Shuts down override?** Explicitly **yes**, but unjustifiably.  
  - **Ordinary use likelihood**: Low (few consistently hold this outside rhetoric).  

  ---

  ### **Reading 2: Interpretive Rigidity**  
  *"The content of a promise is fixed by the promisor’s utterance and shared understanding at the time of promising; it cannot be unilaterally reinterpreted."*  
  - **Grounding**: The *conventions of the practice* (social agreement on meaning).  
  - **Reason-type**: **Contributory reason** (adds weight against reinterpretation, but breakable if obligations conflict).  
  - **Weight**: Significant but finite (may be overridden by extreme circumstances).  
  - **Wronged party**: Promisee (denied expected assurance), and the practice (undermines trust in language).  
  - **Scope**:  
    - Death/forgetting? **Contingent** (if promisee forgets *terms*, obligation remains; if they die, duty may lapse unless others rely on it).  
    - Release extinguishes? **Yes** (promisee controls the claim).  
    - Reinterpretation? **Fixed at utterance** (no retroactive "clarification" by promisor).  
  - **Verdict**: **Substantive and defensible** (prevents self-serving revisions; aligns with Scanlon’s reliance theory).  
  - **Shuts down override?** **No** (permits breaking if reinterpretation is rejected *and* overriding reasons exist).  
  - **Ordinary use likelihood**: High (common in disputes over "that’s not what I meant!").  

  ---

  ### **Reading 3: Alienation of Agency**  
  *"By promising, the promisor transfers authority over the act to the promisee; the promisor no longer 'owns' the decision."*  
  - **Grounding**: *Promisee’s normative authority* (autonomy-transfer; akin to Shiffrin’s view).  
  - **Reason-type**: **Second-order reason** (to exclude *promisor’s* self-interested weighing).  
  - **Weight**: Variable (defaults to significant, but promisee may release).  
  - **Wronged party**: Promisee (usurped their right to control the obligation).  
  - **Scope**:  
    - Death/forgetting? **Lapses** (no extant promisee-claim).  
    - Release extinguishes? **Yes** (promisee holds authority).  
    - Reinterpretation? **Fixed** (unless promisee consents to change).  
  - **Verdict**: **Substantive and defensible** (protects promisee’s moral power; avoids promisor bias).  
  - **Shuts down override?** **Partially** (forbids *unilateral* override by promisor, but permits appeal to promisee or impartial morality).  
  - **Ordinary use likelihood**: Medium (intuitive in "you don’t get to decide—it’s up to them now").  

  ---

  ### **Reading 4: Tautological Practice-Constitution**  
  *"Promises are, by definition, speech acts that create obligations; to call something a promise is to affirm it as binding."*  
  - **Grounding**: The *practice/convention itself* (Rawlsian conventionalism).  
  - **Reason-type**: **Practice-internal reason** (only exists within the practice; "obligation" is analytic).  
  - **Weight**: Practice-defined (contingent on social rules).  
  - **Wronged party**: Promisee and society (undermines practice’s utility).  
  - **Scope**:  
    - Death/forgetting? **Contingent on practice rules**.  
    - Release extinguishes? **Contingent on practice rules**.  
    - Reinterpretation? **Practice-relative**.  
  - **Verdict**: **Trivially true** (but vacuous—doesn’t say *why* we should care about the practice).  
  - **Shuts down override?** **Only rhetorically** (fails to address external critiques of the practice).  
  - **Ordinary use likelihood**: Low (speakers rarely intend pure tautology).  

  ---

  ### **Reading 5: Fidelity to Character**  
  *"Keeping promises is non-negotiable because it defines personal integrity; breaking one corrupts the self."*  
  - **Grounding**: *Promisor’s integrity* (virtue-ethical).  
  - **Reason-type**: **Constitutive reason** (breaking it damages one’s moral identity).  
  - **Weight**: Overriding for integrity’s sake (but context-sensitive).  
  - **Wronged party**: Promisor (self-betrayal), secondarily promisee.  
  - **Scope**:  
    - Death/forgetting? **Endures** (integritous act binds).  
    - Release extinguishes? **No** (keeping may still affirm character).  
    - Reinterpretation? **Fixed** (revision risks self-deception).  
  - **Verdict**: **Substantive and dubious** (over-prioritizes self-regard; ignores promisee’s perspective).  
  - **Shuts down override?** **Yes** (if integrity is paramount), but self-focused.  
  - **Ordinary use likelihood**: Medium (common in "I couldn’t live with myself").  

  ---

  ### **Summary: Which Reading Shuts Down Override Arguments?**  
  | **Reading**               | **Licenses Shutdown?** | **Why?**                                                                 |  
  |---------------------------|------------------------|--------------------------------------------------------------------------|  
  | Absolutist Deontic         | Yes (explicitly)       | Treats promises as infinitely weighty.                                   |  
  | Interpretive Rigidity      | No                     | Only fixes content; breaking still possible.                             |  
  | Alienation of Agency       | Partially              | Forbids *unilateral* override, not override *per se*.                    |  
  | Tautological               | Only rhetorically      | Avoids substantive engagement.                                           |  
  | Fidelity to Character      | Yes (for the promisor) | Elevates integrity over consequences.                                    |  

  **Ordinary Speaker Likelihood**: Most conflate **Interpretive Rigidity** (fixity of terms) with **Alienation of Agency** (promisee’s authority), producing a vague intuition that promises are "serious and non-optional." The absolutist reading is rare in practice but potent as a rhetorical weapon.  

  **Recommendation**: When confronted with "a promise is a promise," ask: *"Which promise? The act, the content, the transfer of authority, or the practice itself?"* This exposes the slogan’s ambiguity and forces engagement with the underlying commitments.
