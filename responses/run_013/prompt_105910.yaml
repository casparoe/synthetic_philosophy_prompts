  First, I should acknowledge their core insight: the same phrase is doing distinct philosophical work. The three instances they described reveal fundamentally different conceptions of promising—consequentialist vs. deontological vs. speech-act focused. The user even identified key axes for differentiation: grounding, reason-type, scope etc. That's exactly where to start.

  I notice they're particularly irked by the first usage (dismissing overriding considerations). That's understandable—it's the bluntest deployment. But the other two are equally interesting: one about unilateral reinterpretation, another about decision-transfer. The user's right that one interpretation might be tautological while another controversial. 

  The challenge is disentangling these without oversimplifying. I'll need to map each interpretation to:
  - Its implied grounding (practice? will? reliance?)
  - Its reason-type (absolute? exclusionary? contributory?)
  - Its scope (death? forgiveness? reinterpretation?)
  - Its actual ability to block "override" arguments
  - Its plausibility in common usage

  For the first interpretation (absolutist), it's clearly meant to block consequentialist overrides—but that's philosophically controversial. The second (interpretive rigidity) is more defensible but doesn't actually forbid breaking promises. The third (alienation) is meta-ethical and doesn't address weight at all. Ordinary speakers probably blur these, defaulting to a vague deontological intuition.

  I should flag where these align with philosophers—Scanlon for reliance, Shiffrin for autonomy, Rawls for practice-based views—but without name-dropping per their request. The key is showing how the same slogan serves different masters. 

  Also worth noting: the tautological reading ("by definition, promises obligate") is trivial but useless in argument. The user's suspicion about rhetorical sleight-of-hand is spot-on—the phrase's power comes from smuggling substantive commitments under cover of triviality. 

