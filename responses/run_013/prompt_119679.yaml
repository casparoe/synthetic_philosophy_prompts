prompt: |-
  I've been reading around HCH and factored cognition for the last couple months — my reading group keeps circling back to it, and I still can't tell how much of what people say about it is the actual idea versus accumulated vibes. Last week a friend of mine, who is normally pretty reliable about this stuff and has read way more of the alignment literature than I have, dropped this into our group chat and we all nodded along, me included:

  "HCH is the idealization of deliberation. Take a human, give them unlimited time and unlimited ability to consult copies of themselves, and assume they're reasoning perfectly — the result is what a perfectly rational version of that human would conclude. That's why it defines the correct answer to whatever question you feed in, and why it's such a clean target for alignment: you want the AI to end up doing what HCH would do. Factored cognition is the same idea turned into engineering — the claim that any big task can be split into subtasks small enough that a human can check each one without seeing the whole picture, so you can build HCH out of cheap parts. And that's basically the main alignment proposal right now: train the small pieces, verify the small pieces, scale up."

  Something about it feels too smooth — I have a vague sense a couple of things are being run together, maybe an idealization getting quietly upgraded into a claim about what's actually true, but I don't trust my own read enough to push back in front of people. Is this a fair summary?

  Go claim by claim: for each one, tell me whether someone who actually works on this would accept it as stated, wince at it, or call it flat wrong, and what the repair is. I want to know which distinctions the summary is flattening, what a defender of the HCH/amplification picture would say it gets wrong about their own view, and whether the last move ("this is basically the main alignment proposal") still stands once the earlier claims are cleaned up — or whether it only looked true because of the errors. Don't bother with who said what first or what the canonical writeups are; I'm not looking for a reading list, just the ideas sorted out. Around 700 words, and then end with a single final line in exactly this form: \answer{fairness=<fair|mostly fair|mixed|mostly unfair|unfair>; claims_that_survive=<k>/<n>}
