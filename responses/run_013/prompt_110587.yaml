     Now, the explanation: The reversal occurs because the introduction of a common risk (C) that has very bad outcomes makes the decision maker less sensitive to the small risk in the original lottery and more focused on the potential gain. This is not the certainty effect (since there was no certainty in the first problem) but rather a change in the perception of risks due to the context of even worse outcomes. This is a distinct effect, sometimes attributed to rank-dependent probability weighting or to a focus on relative differences in the presence of a background risk.

     If we remove the feature of having very bad outcomes in C, the reversal might disappear. For example, if C were a lottery that pays $90 and $95, then the decision maker might still be risk averse and choose A2 to avoid the 0.5% chance of $10.

     Your friend might try to wriggle out by arguing that the utility function is not linear and that the marginal utility of money from $1 to $100 is huge, so the introduction of outcomes as low as $1 changes the utility comparison. He might say that the two problems are not comparable because the range of outcomes is different. However, the independence axiom does not depend on the range of outcomes; it is a structural axiom. Moreover, if we assume a utility function, then the axiom requires that the mixture preserves the preference. The violation shows that the independence axiom is violated regardless of the utility function.

     Alternatively, he might argue that the decision maker does not reduce compound lotteries and therefore sees Problem 2 as a two-stage lottery, which changes the perception. But in decision theory, we usually assume reduction.

     In conclusion, this example shows that the Allais-type reversal can occur without any sure thing and without any chance of zero, and it is not solely due to the certainty effect.
