  To address your challenge, I'll construct a pair of decision problems that satisfy all your conditions and demonstrate a violation of the independence axiom without relying on certainty or zero outcomes. The key is to introduce a common lottery with **very low outcomes** to create a background risk that shifts risk attitudes.

  ### **Decision Problems Setup**
  Define the common lottery \( C \):  
  - \( C = \) \( \$1 \) with probability \( \frac{1}{2} \), \( \$2 \) with probability \( \frac{1}{2} \).  
  *(No sure thing, no zero, all probabilities between 0 and 1.)*

  **Problem 1:**  
  - **Option A1:** \( \$100 \) with probability \( \frac{99}{100} \), \( \$99 \) with probability \( \frac{1}{100} \).  
  - **Option B1:** \( \$500 \) with probability \( \frac{99}{100} \), \( \$10 \) with probability \( \frac{1}{100} \).  
  *Preference: A1 > B1 (safer, smaller prize chosen).*

  **Problem 2 (Mixture with \( C \)):**  
  - Mixing probability \( p = \frac{1}{2} \).  
  - **Option A2 = \( \frac{1}{2} \cdot \text{A1} + \frac{1}{2} \cdot C \)**  
  - **Option B2 = \( \frac{1}{2} \cdot \text{B1} + \frac{1}{2} \cdot C \)**  
  *Preference: B2 > A2 (riskier, larger prize chosen).*

  ---

  ### **Algebraic Verification of Mixture**
  Expand A2 and B2 explicitly:

  **Option A2:**  
  \[
  A2 = \frac{1}{2} \cdot \text{A1} + \frac{1}{2} \cdot C = \frac{1}{2} \left( \frac{99}{100} \cdot \$100 + \frac{1}{100} \cdot \$99 \right) + \frac{1}{2} \left( \frac{1}{2} \cdot \$1 + \frac{1}{2} \cdot \$2 \right)
  \]  
  \[
  = \frac{1}{2} \left( \frac{99}{100} \cdot \$100 \right) + \frac{1}{2} \left( \frac{1}{100} \cdot \$99 \right) + \frac{1}{2} \left( \frac{1}{2} \cdot \$1 \right) + \frac{1}{2} \left( \frac{1}{2} \cdot \$2 \right)
  \]  
  \[
  = \left( \frac{99}{200} \cdot \$100 \right) + \left( \frac{1}{200} \cdot \$99 \right) + \left( \frac{1}{4} \cdot \$1 \right) + \left( \frac{1}{4} \cdot \$2 \right)
  \]  
  \[
  = \left( \frac{9900}{200} = 49.5\% \text{ of } \$100 \right) + \left( \frac{99}{200} = 0.5\% \text{ of } \$99 \right) + \left( 25\% \text{ of } \$1 \right) + \left( 25\% \text{ of } \$2 \right).
  \]

  **Option B2:**  
  \[
  B2 = \frac{1}{2} \cdot \text{B1} + \frac{1}{2} \cdot C = \frac{1}{2} \left( \frac{99}{100} \cdot \$500 + \frac{1}{100} \cdot \$10 \right) + \frac{1}{2} \left( \frac{1}{2} \cdot \$1 + \frac{1}{2} \cdot \$2 \right)
  \]  
  \[
  = \left( \frac{99}{200} \cdot \$500 \right) + \left( \frac{1}{200} \cdot \$10 \right) + \left( \frac{1}{4} \cdot \$1 \right) + \left( \frac{1}{4} \cdot \$2 \right)
  \]  
  \[
  = \left( \frac{49500}{200} = 49.5\% \text{ of } \$500 \right) + \left( \frac{10}{200} = 0.5\% \text{ of } \$10 \right) + \left( 25\% \text{ of } \$1 \right) + \left( 25\% \text{ of } \$2 \right).
  \]

  ### **Preferences Explained**  
  - **Problem 1 (A1 > B1):** The 1% chance of \$10 in B1 feels catastrophic compared to A1's near-guarantee of ~\$100. Risk aversion dominates.  
  - **Problem 2 (B2 > A2):** Both options now include a 50% chance of a very low outcome (\$1 or \$2). This background risk makes:  
    - The 0.5% chance of \$10 (in B2) seem negligible (as outcomes are already low in half the cases).  
    - The 49.5% chance of \$500 (in B2) highly attractive relative to A2's 49.5% chance of \$100.  
  The shift occurs because the common low outcomes in \( C \) diminish the perceived sting of B2's risk while amplifying the appeal of its upside.

  ---

  ### **Residual Explanation Beyond Certainty Effect**  
  The reversal is **not** driven by certainty (no option is sure in either problem). Instead, it hinges on:  
  1. **Background risk amplification:** \( C \) introduces outcomes so low (\$1/\$2) that they recalibrate the decision maker's risk perception. The original risks in A1/B1 become overshadowed by the new, salient risk of extreme loss.  
  2. **Relative outcome focus:** In Problem 2, the difference between \$500 and \$100 in the "good" state (49.5%) feels more significant than the difference between \$10 and \$99 in the "bad" state (0.5%), as both bad states are dwarfed by the \$1/\$2 outcomes.  

  This is a **genuinely different mechanism** from the certainty effect. The certainty effect overweights guaranteed outcomes, but here, the reversal stems from catastrophic background risk altering the psychological weight of existing probabilities.

  ---

  ### **Critical Feature and Wriggle Room**  
  - **Real workhorse:** The **very low outcomes in \( C \)**. If \( C \) paid moderate amounts (e.g., \$90/\$95), the reversal vanishes:  
    - In Problem 2, A2 would offer safety (~\$100) against B2's 0.5% chance of \$10, preserving A2 > B2.  
  - **How your friend might wriggle out:**  
    1. **Attack outcome scale:** Argue that utility is nonlinear (e.g., \$1 to \$100 matters more than \$100 to \$500). However, this is irrelevant—the independence axiom is violated regardless of utility curvature.  
    2. **Deny mixture equivalence:** Claim Problem 2 is "different" due to extreme outcomes (\$1/\$2), making it incomparable to Problem 1. This is a framing critique, but the mixtures are algebraically identical per the axiom.  
    3. **Question realism:** Assert that "no one fears \$10 when \$1 is possible," but this is an empirical claim—Allais-type reversals persist in experiments with positive outcomes (e.g., Hagen, 1979).

  ---

  ### **Conclusion**  
  This case cleanly violates independence without certainty or zero outcomes. The reversal is driven by catastrophic background risk (from \( C \)) shifting attention from moderate risks to extreme losses, making the gamble for a large prize more appealing. Your friend cannot dismiss this as a "fancy certainty effect"; it is a distinct phenomenon tied to context-dependent risk perception. If they deny the preferences, ask them to justify why A1 > B1 but B2 > A2 is irrational—without invoking certainty or zero.
