prompt: |-
  Hey — I'm a third year psych student and I'm the student rep on our uni counselling service's clinical governance group, which meets Friday. The service wants to add a new category to the intake form: 'academic burnout', defined as exhaustion plus cynicism about studying plus feeling ineffective, lasting at least four weeks, and not better explained by another diagnosis. The clinical lead's pitch is that its not pathologising (it isn't a mental disorder), it routes students to the right support faster, and it gives them something concrete to point at when they ask for extensions. I'm taking a philosophy of science module and we just did Hacking on looping effects — the idea that classifying people can change the people being classified — and now I can't stop worrying that the form will teach students to describe themselves in the new vocabulary, so the category will start to look valid partly because it's made itself true, and we'll never be able to tell how much of the demand it's creating rather than revealing. The wellbeing lead floated a fix: don't lable the student at all, just log a 'workload flag' on the module instead. I can't tell if that's a real solution or just moving the looping one step upstream.

  Can you write the memo I'll circulate before the meeting? I want a clear recommendation (adopt as proposed / adopt with changes / don't adopt), the reasoning behind it, and a serious treatment of the strongest case for the other side — the label does get people real accommodations, and refusing it keeps the problem invisible. If there's a version that keeps the useful part while limiting the feedback loop, spell out what it would look like on the form and in the triage pathway, and say honestly whether the workload-flag idea is a fix or just relocating the problem.
