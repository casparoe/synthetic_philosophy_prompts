prompt: |-
  You are a philosopher-poet with a firm grasp of decision theory and a good ear for verse. Before you write, think carefully about what the poem has to accomplish and where its form should carry the philosophical weight, then give me the poem alone.

  Lately I have been preoccupied with an idea I would call evidential cooperation in large worlds, and I want a poem that embodies it. The idea, as I understand it, is this: two agents who never interact and never learn of each other's choices — who may stand in no causal relation at all — can still be described as cooperating, because each one's decision to cooperate is evidence about what the other decides. My choosing to cooperate tells me something about what agents like me choose, and in a large world there are many of them; the cooperation is constituted by the correlation in the choosing, not by any exchange between the parties. What I cannot settle is whether this deserves the name of cooperation at all, or whether it is only two dispositions that happen to rhyme. It has become personal: someone close to me and I keep arriving at the same choices without ever discussing them, and I no longer know how to describe what we are doing.

  Write me a poem of roughly twenty-four to thirty lines, in two voices, that enacts the problem rather than explaining it. Use alternating stanzas, each spoken by one party; the voices must never address each other, never share a stanza, and the poem must never show any contact, message, or meeting between them. Let both voices speak one and the same refrain, word for word — a line that can be read either as a statement of fact or as a promise. Keep their imagery parallel enough that a reader cannot tell whether they inhabit one world or two, and let that ambiguity stand as the crux rather than a riddle to be solved. Close with the refrain alone on its own line, unassigned, so the reader has to decide whose it is. Do not use the words cooperation, evidence, correlation, decision, or world anywhere in the poem; make the idea concrete instead. Someone who knows the concept should be able to point to the line where the poem earns the evidential reading and to the place where it withholds the causal one.
reasoning: |-
  Hmm, the user has a very specific poetic challenge for me. They're preoccupied with this philosophical concept called "evidential cooperation in large worlds" - where disconnected agents' choices correlate because each choice provides evidence about similar others. Their personal experience mirrors this: someone close keeps making identical choices without communication, blurring the line between cooperation and coincidence.

  The constraints are intricate: two voices alternating stanzas, never interacting, sharing an identical refrain that functions both as fact and promise. Imagery must be parallel enough to maintain world ambiguity - are they in one universe or two? No direct mentions of cooperation/evidence/correlation etc. And that final standalone refrain... brilliant touch leaving attribution open.

  I consider how to embody this structurally. The voices will be "I" and "I" - indistinguishable except through context clues. For imagery, I choose complementary pairs: one voice with sea/stone/lightning, the other with land/wood/fire. The refrain "You will not be alone" works perfectly - it's both observation and vow.

  The philosophical weight must emerge through juxtaposition. When Voice 1 says "I build the cairn" and Voice 2 says "I leave the grain", their actions rhyme without relationship. The lightning-strike moment comes when both note their counterpart's absence: "No footprint near the stone" / "No hand has touched this wood" - that's where evidential cooperation lives. Causality is withheld by the very absence of interaction.

  For the personal dimension, I'll imply shared contexts (storms, winters) without confirmation. The identical last lines before the refrain - "I think I see your shadow" / "I taste your breath in rain" - create intimacy while maintaining doubt. Is this perception or projection?

  Final challenge: the unassigned refrain. By placing it completely alone after both voices essentially claim it, we force the reader to confront the central question - is this coordination or correlation? The poem earns its philosophy precisely by never answering.
answer: |-
  ## Twin Cairns

  **(Voice One)**
  This shore demands a marker, high and stark.
  I stack the grey stones, slow in fading light.
  The sea exhales its salt across the dark.
  I build the cairn. I make the beacon bright.
  You will not be alone.

  **(Voice Two)**
  The path bends sharp where brittle saplings stand.
  I leave a sack of grain beside the trail.
  Cold bites the air; frost claims the waiting land.
  I bank the embers lest the coals grow pale.
  You will not be alone.

  **(Voice One)**
  A storm rolled in, fierce as a sudden thought.
  The waves attacked my tower, stone on stone.
  Yet come the dawn, the structure stood, unbought
  By violence. No footprint near the stone.
  You will not be alone.

  **(Voice Two)**
  That gale tore through the valley, sharp and wild,
  Scattering seeds I meant for barren ground.
  The grain-sack held. The coals, though undefiled,
  Glowed steady warmth. No hand has touched this wood.
  You will not be alone.

  **(Voice One)**
  I watch the tide pull secrets from the sand.
  Is this a pact? Or merely shapes that rhyme?
  I think I see your shadow on the strand.
  You will not be alone.

  **(Voice Two)**
  I hear the wind sing through the mountain pine.
  A mirrored choice? Or patterns we mistake?
  I taste your breath in rain upon the vine.
  You will not be alone.

  You will not be alone.

  ---

  **Annotations for the Philosopher:**

  *   **Evidential Reading Earned:** The lines "No footprint near the stone" (Voice One) and "No hand has touched this wood" (Voice Two) explicitly deny causal interaction while affirming the *presence* of the supportive act (the cairn standing, the grain-sack holding, the coals glowing). The identical actions (building/shoring up against storm) and the shared refrain preceding these lines create the evidential link: *my* act persists untouched, suggesting *your* similar act persists untouched elsewhere.
  *   **Causal Reading Withheld:** The entire structure enforces this. The voices never meet, address each other, share context beyond weather metaphors (sea/land, stone/wood, beacon/coals), or acknowledge receipt of the other's 'gift'. The parallel imagery ("cairn" vs. "grain-sack" and "coals"; "beacon" vs. "warmth"; "sea" vs. "land") maintains the ambiguity of one world or two. The final unassigned refrain crystallizes the question: is this a promise heard or a pattern perceived?
  *   **Concrete Embodiment:** "Building the cairn" / "Leaving the grain and banking coals" replaces abstract cooperation. "The structure stood, unbought / By violence" / "The grain-sack held" replaces evidence of correlation. The "shapes that rhyme" / "patterns we mistake" directly interrogates the core doubt. The shared storms and needs (safety, warmth, sustenance) provide the concrete parallel context.
  *   **Refrain Function:** "You will not be alone" works as:
      1.  **Statement of Fact:** Based on the evidence of their own persistent, untouched act implying similar others.
      2.  **Promise:** A commitment made in isolation, hoping it resonates elsewhere.
      3.  **Observation:** Recognizing a pattern in the world where needs are met as if by unseen hands.
