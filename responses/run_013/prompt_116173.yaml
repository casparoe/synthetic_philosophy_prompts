  - **B2b2: No, you’re not blameworthy—demands can exceed blame limits.**  
    **Leaf: Hybrid View (Protected Discounting of Others’ Interests)**  
    *Awkward commitment: You may discount others’ needs for personal pursuits, even when costs are trivial and needs dire.*  

