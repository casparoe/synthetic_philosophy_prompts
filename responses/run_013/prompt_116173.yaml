  Below is a decision tree designed to help users identify their stance on the demandingness objection to consequentialism by evaluating concrete cases. The tree starts with a single entry question and branches out based on intuitive responses to scenarios, with each branch labeled by a claim (not a position name) and each leaf stating the resulting position, its most awkward commitment, and whether it's unnamed. The tree incorporates your specified distinctions (ceiling, demand profile, enforcement line, object of demand, marginal impact, comparison baseline, supererogation) and includes all required cases and positions. It has 9 branch nodes and 14 leaves, with a mix of concrete cases and claims to ensure first-year accessibility.

