  ### **Decision Tree: What Do You Believe About Moral Demandingness?**

  **Start Here:  
  Q1 (Entry): You could donate $100 to save a stranger’s life, but you’d have to skip a restaurant dinner. Does morality *require* you to donate?**  
  *(This splits views where morality issues requirements from those where it only ranks outcomes.)*  
  - **A: Yes, morality requires donating—it’s not optional.**  
    *(Go to Q2: Views with requirements that limit what you keep.)*  
  - **B: No, morality doesn’t require donating—it might be better to donate, but you may choose dinner.**  
    *(Go to Q7: Views with no requirement or only weaker guidance.)*  

  ---

  #### **Branch A: Morality requires donating in the dinner case (requirements govern what you keep)**
  **Q2: You could donate a spare kidney to save a stranger who will die without it. Must you donate?**  
  *(Tests the ceiling: is there a limit to sacrifice?)*  
  - **A1: Yes, you must donate the kidney—even this cost doesn’t exempt you.**  
    *(Go to Q3: High or no ceiling.)*  
  - **A2: No, you need not donate—this sacrifice is too demanding.**  
    *(Go to Q5: Views with a ceiling.)*  

  **Q3 (for A1): You’ve already donated a kidney and are asked to donate part of your liver (it regenerates) to save another life. Must you?**  
  *(Tests demand profile: does the requirement reset after prior sacrifice?)*  
  - **A1a: Yes, you must donate again—every opportunity demands maximum help.**  
    *(Go to Q4: Views where demands are always "as much as you can.")*  
  - **A1b: No, you’ve done enough—you may keep your liver.**  
    *(Go to Q9: Views where demands plateau or reset.)*  

  **Q4 (for A1a): You could pursue a lucrative career (donating to save 100 lives/year) or a modest do-gooder job (directly saving 50/year). Must you choose the lucrative one?**  
  *(Tests the object of demand: does it target acts or life-shaping?)*  
  - **A1a1: Yes, you must maximize good per act, career included.**  
    **Leaf: Unlimited Maximizing Consequentialism**  
    *Awkward commitment: You must give until you’re as badly off as those you help—no personal goods of comparable importance.*  
  - **A1a2: No, you may choose the do-gooder job if your life overall does significant good.**  
    **Leaf: Unnamed**  
    *Awkward commitment: You might be required to sacrifice hugely act-by-act but get "credit" for a good life, risking inconsistency.*  
    *Diagnosis: Unattractive—life-shaping focus clashes with act-level maximizing.*  

  **Q9 (for A1b): After donating the kidney, you can save a life by donating $100. Must you?**  
