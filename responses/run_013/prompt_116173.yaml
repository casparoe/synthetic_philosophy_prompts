  - **A1b1: Yes, you must donate $100—each new need resets the demand.**  
    **Leaf: Maximizing View with Cost-Sensitive Threshold**  
    *Awkward commitment: You must keep sacrificing as long as each act’s cost is "bearable," even if cumulatively it ruins you.*  
  - **A1b2: No, you’ve done enough—no further donations are required.**  
    **Leaf: Satisficing View with Good-Enough Threshold**  
    *Awkward commitment: Once you hit "good enough," you may ignore urgent needs you could easily meet.*  

  **Q5 (for A2): You can save your own child or a stranger from drowning (only one). May you save your child?**  
