answer: |-
  You're conflating two distinct things: the *amount* already bid and the *structural obligation* it represents. The money isn't a sunk cost—it's an undischarged penalty hanging over you *right now*. When you consider bidding $0.60 after having bid $0.55, you face a choice:  
  - **Drop out immediately:** Pay $0.55 and get nothing (a $0.55 loss).  
  - **Bid $0.60:** Risk paying $0.60 if you lose *later*, but gain a chance to win the dollar *and avoid your current $0.55 penalty* by becoming the sole winner.  

  The "recovery" isn't backward-looking—it's about nullifying an active liability. If you win, you pay your final bid but erase the earlier obligation (since only second place pays their bid). The existing bid isn't a psychological anchor; it's a live contractual threat. Without it, the auction has no teeth. Your "strip it out" demand ignores the game's rules: the liability *is* the mechanism. Calling this a sunk cost smuggles in the *outcome* (eventual loss) to judge the *decision* (which occurs when loss is still avoidable). The flaw isn't in the bidder’s calculus—it’s in the game’s design that makes each local escape hatch rational.  

  Your turn. Why is the penalty for dropping out—a *future* payment triggered *now*—merely a "sunk cost" in disguise?
