answer: |-
  The dispute is fundamentally an equivocation on the object of credence: thirders assign credence to the *centered proposition* "The coin landed heads *and this is my current awakening*," while halfers assign credence to the *decentered proposition* "The coin landed heads," ignoring self-location. Both sides agree on the setup and probability axioms but apply them to different questions. Thirders argue Beauty's ignorance about *which* awakening she is experiencing upon waking (in the Tails case) necessitates treating the three possible centered awakening states (Heads-awakening, Tails-Monday, Tails-Tuesday) as equally likely, yielding P(Heads) = 1/3. Halfers argue Beauty learns no *new objective information* upon waking relative to Sunday night (the coin is still fair, the protocol unchanged), so her decentered credence in Heads must remain 1/2. Progress requires explicitly distinguishing centered/decentered beliefs in the formalism or decision context. A formal result showing these credences prescribe different optimal betting strategies *in this specific scenario* could be decisive. For example, if Beauty is offered a bet *only on this awakening* that pays if Heads, the thirder credence (1/3) dictates different stakes than the halfer credence (1/2). Framing the question unambiguously as "What should Beauty believe *about the coin flip itself*?" favors halving, while "What should Beauty believe *about which centered world she is in*?" favors thirding. Recognizing this distinction ends the stalemate.

