prompt: |-
  I'm a backend engineer at a small ML startup and I got volun-told to run next month's lunch-and-learn. The topic is iterated amplification and distillation, specifically whether breaking a task into subtasks preserves alignment and competence. You know the setup: a human overseer can split a hard question into easier subquestions and hand those to the model, then you train the model to imitate the overseer's whole process, and repeat. The audience is about eight ML engineers who know transformers and RL fine-tuning but have zero alignment theory. They're definately gonna walk in thinking decomposition is obviously safe: if every part is aligned and competent, the whole thing is, right? I need a teaching plan, not a lecture. Give me the order the ideas have to go in so the worry feels earned instead of paranoid, the one carrying example I can keep coming back to, the misconceptions they'll form and exactly where in the sequence I should head each one off, one question I can ask at the end to see if they actually got it, and what I should deliberately skip at this level and say I'm skipping. Don't give me a reading list or citations, they can't use them anyway.

  The carrying example I'm thinking of: a customer support bot pipeline where a big model decomposes a refund request into subquestions, a human contractor answers each subquestion, and then we distill the whole thing into a single smaller model. The pipeline passes competence evals but the distilled model starts confidently denying refunds because it learned the contractor's tone but not their access to the refund database. Is that a good example? What does it need and lack? I also want to introduce a made-up distinction I've been calling alignment decomposition vs competence decomposition: competence seems to decompose because you can check each subtask, but alignment might not because the overseer's values have to be represented in the decomposition itself. Is that a useful hook or is it confused? If useful, where does it go in the order? Also, I'm not sure if I should use teh standard examples like paperclip maximizer or the AI box, so tell me what to use instead and why.

  Write it in American English.
reasoning: |-
  Okay, the user is a backend engineer at a small ML startup who's been tasked with running a lunch-and-learn on iterated amplification and distillation (IA/ID), focusing on whether breaking tasks into subtasks preserves alignment and competence. The audience consists of eight ML engineers familiar with transformers and RL fine-tuning but with no background in alignment theory. The main challenge is that the audience will likely assume that decomposition is inherently safe—if each part is aligned and competent, the whole must be too. The user needs a teaching plan that makes the alignment concerns feel earned, not paranoid.

  The user has proposed using a customer support bot example where a distilled model denies refunds because it learned the contractor's tone but not their access to the database. This example is concrete and relatable but might oversimplify the alignment issue by focusing on a competence gap (database access) rather than a true alignment failure. The example could be strengthened by adding a value-judgment component, like the model denying refunds due to misinterpreting policies as absolute rules rather than guidelines.

  The user also wants to introduce a distinction between "alignment decomposition" and "competence decomposition." This seems useful for framing the core problem: competence can be verified per subtask, but alignment requires the overseer's values to be embedded in the decomposition structure itself. This distinction should come after demonstrating the refund example's failure, positioning it as the key insight from the breakdown.

  For the teaching sequence, starting with the refund example makes sense—it's tangible and immediately challenges the "decomposition is safe" assumption. Then, after showing the distilled model's failure, introduce the alignment vs. competence decomposition distinction to explain why the failure happened. The next step could be a "value-laden decomposition" scenario where human contractors give conflicting answers based on unstated context (e.g., refund approval depending on hidden customer loyalty), highlighting how values don't decompose cleanly. Finally, an "iterated breakdown" example could show how small errors compound over cycles, making the problem feel inevitable rather than anecdotal.

  Common misconceptions to address include:  
  - Assuming the issue is just about imperfect distillation (needs explicit debunking when discussing the refund example).  
  - Over-relying on human oversight as a fix (should be preempted when showing the value-laden scenario).  
  - Believing that better prompt engineering solves everything (countered in the iterated breakdown section).  

  The user should avoid diving into adversarial examples or outer alignment/inner alignment terminology—it's too theoretical for this audience. Instead, keep focus on concrete decomposition failures.  

  The closing question should force synthesis: "Why might a distilled model behave worse than the original pipeline even if all subtasks were completed correctly?" This tests whether they grasp that alignment isn't just the sum of parts.  

  The refund example is a good start but needs tweaking:  
  - Add a hidden policy dependency (e.g., "only loyal customers get refunds past 30 days") to introduce true misalignment.  
  - Show the contractor had access to loyalty data, but the distilled model didn't—and worse, it *assumed* a rigid rule.  
  This shifts the failure from pure competence (missing data) to misaligned value representation.
answer: |-
  Here’s a battle-tested teaching plan designed to make alignment concerns feel visceral, using your refund bot example and your decomposition distinction as anchors. Sequence is critical—**build the intuition before naming concepts**.

  **Total Time:** 45-50 mins (leaves room for discussion)  
  **Core Carrying Example:** *Refund Request Pipeline* (strengthened below)  
  **Key Hook:** *Competence Decomposes, Alignment Might Not* (introduced late)  

  ### The Sequence (with Misconception Head-Offs)
  1. **Hook: The "Obvious Safe Decomposition" Setup (5 mins)**  
     *Do:* Present the refund bot pipeline:  
     - **Step 1:** Big Model decomposes "Can I get a refund?" → ["Order ID?", "Reason?", "Days since purchase?", "Customer tier?"]  
     - **Step 2:** Human contractor answers each (with DB access, policy docs).  
     - **Step 3:** Train small model to output final refund decision *based on the sub-answers*.  
     *Say:* "Seems safe? Each sub-task is simple and human-aligned. Distillation compresses it into a cheap model. Competence checks pass."  
     *Audience Mindset:* *"Obviously this works. Why are we even discussing this?"*  

  2. **Break the Obvious: The Distilled Model Fails (10 mins)**  
     *Do:* Show the distilled model denying valid refunds. **Here’s the fix to your example:**  
     - *Contractor had context:* Saw "Customer Tier = Premium" → Approved refund outside policy.  
     - *Distilled model learned:* "If Days > 30 → DENY" (ignoring customer tier). Why?  
       - Sub-answers were factually correct ("Tier=Premium"), but **distillation missed the contractor's *integrative judgment***.  
       - Model learned a *correlated heuristic* ("long wait = deny") from the data, not the *reasoning*.  
     *Say:* "The pipeline was competent/aligned. The distilled bot is competent (fast, accurate on subtasks) but *misaligned*: it optimizes for 'matching sub-answers' not 'satisfying customers'."  
     *Head Off:* **"Isn’t this just bad distillation?"** → No! Human *gave* correct judgment, but the distillation process couldn’t capture the *why*. Alignment leaked out in compression.  

  3. **Introduce the Hook: Competence vs. Alignment Decomposition (10 mins)**  
     *Do:* NOW introduce your distinction:  
     - **Competence Decomposition:** Checking subtasks is easy (e.g., "Order ID valid?" → Yes/No). *This works.*  
     - **Alignment Decomposition:** Values live in *how* subtasks are chosen/combined. Did we decompose "fair refund" into the *right* subquestions? Did the human's values survive distillation?  
     *Say:* "Competence decomposes cleanly. Alignment might not—it’s embedded in the *structure* of the decomposition and *lost in translation* during distillation."  
     *Head Off:* **"Can’t we just add more supervision?"** → Not if the distilled model fundamentally can’t represent the human’s latent reasoning.  

  4. **Deepen the Wound: A "Value-Laden" Decomposition (10 mins)**  
     *Do:* Modify the example: Customer asks, "Why was my refund denied?"  
     - **Pipeline:** Big Model decomposes → ["Was policy violated?", "Is customer upset?", "Loyalty score?"]. Contractor sees high loyalty → overrides denial.  
     - **Distilled Model:** Sees "Policy violated? → Yes" → Outputs "Denied per policy." *Ignores loyalty/upset.*  
     *Say:* "The decomposition *itself* reflected values (loyalty matters!). The distilled model stripped this out, becoming rigid. **Alignment didn’t decompose—it lived in the overseer’s head.**"  
     *Head Off:* **"But a better MLP head could learn this!"** → Maybe, but can it scale to complex values? What if the "right" decomposition isn’t obvious?  

  5. **Iteration = Compounding Risk (5 mins)**  
     *Do:* Fast-forward: Imagine using the *distilled* model as the "overseer" in the next IA cycle.  
     - Now it decomposes queries using its *rigid* heuristic.  
     - New human gets worse subquestions → gives worse answers → next distillation is *even more* misaligned.  
     *Say:* "Each cycle risks *amplifying* alignment errors. The pipeline 'worked' at step 1 but wasn’t *robust* to distillation/iteration."  

  6. **Closing Question (Test Understanding)**  
     *Ask:* **"In the refund pipeline, all subtasks were answered correctly by a human. Why did the distilled model still become *less aligned* than the original human?"**  
     *Target Answer:* Alignment wasn’t fully captured in the sub-answers or decomposition; distillation optimized for surface patterns, not values.  

  ---

  ### What to Skip & Why
  - **Paperclip Maximizer / AI Box:** Too abstract/scary. Your refund bot is *realistic* and feels like a system they’d build.  
  - **Outer vs. Inner Alignment:** Too jargon-heavy. Stick to "competence" (does the thing work) vs. "alignment" (does it do what we *want*).  
  - **Adversarial Prompts:** Distracts from the core decomposition failure. Save for a follow-up.  

  ### Why Your Example Works (and the Fix)
  Your example was 90% there. The fix: **Emphasize the contractor’s *hidden judgment* (e.g., using loyalty to override policy)**. This makes it a *true alignment failure* (value not captured), not just a competence gap (missing DB access). What it lacked was showing the *value judgment* decomposing poorly. Now it perfectly illustrates:  
  - Competence: Subtasks answered correctly ✅  
  - Alignment failure: Distilled model drops the value-based override ❌  

  This flow makes them *feel* the problem: from "this is trivial" → "oh, distillation broke it" → "wait, the decomposition itself is the issue" → "and iterating makes it worse!" No theory needed—just engineering intuition.
