prompt: |-
  I am preparing for a decision theory reading group and have been given a handout that states Good's theorem roughly as follows: for a Bayesian agent who updates by conditionalization, the expected value of costless information is non-negative, since the set of acts available after observing includes every act available before observing. I can follow the dominance-style argument, but the theorem seems to imply something I find hard to accept. If information can never have negative expected value, then surely it is never rational to avoid a medical test, refuse to read a hurtful email, or prefer not to know whether a partner has been unfaithful. A friend in the group says this is exactly right: any reluctance is either a failure of Bayesian coherence or a sign that the information was not really costless. But I keep thinking about cases where the information itself changes what I care about, where my preferences are not simply over outcomes but over what I believe about them, where I cannot unlearn something and it colours everything, or where the value of an experience depends on my not knowing what is coming. I also wonder about cases where finding out the truth would make me worse off in every outcome, not merely in the moment of learning. So my question is this: does Good's theorem actually show that information is always good, and if it does, how should I understand these apparent counterexamples? If it does not, what exactly is the false presupposition in my reading, and which assumptions in the theorem are doing the work? Please answer as exactly five numbered points, each one a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is grappling with Good's theorem in decision theory and how it relates to real-life scenarios where information might seem harmful. They're preparing for a reading group and have heard that for a Bayesian agent, costless information always has non-negative expected value. But they have counterexamples in mind—like avoiding medical tests, hurtful emails, or infidelity revelations—where information seems rationally avoidable. A friend argues that any reluctance indicates incoherence or hidden costs, but the user is skeptical.

  The user's confusion centers on whether Good's theorem truly implies information is always beneficial. They suspect that preferences aren't always fixed over outcomes; beliefs can alter what we care about, and ignorance might be valuable in itself. For instance, not knowing a spoiler might enhance enjoyment, or learning a truth could permanently worsen well-being. The core question is: does the theorem prove information is always good, and if so, how to reconcile it with these cases? If not, what assumptions are flawed?

  I need to break this down clearly. Good's theorem relies on strict Bayesian assumptions: agents update by conditionalization, have fixed preferences over outcomes, and act optimally. The dominance argument works because after observing information, you can still choose any pre-information action, so you're never worse off—it's like having more options. But the user's examples challenge this by introducing preference changes or state-dependent utilities.

  For the medical test: avoiding it might be rational if the stress of knowing is worse than the uncertainty, but in standard Bayesian terms, that could be modeled as a cost (e.g., anxiety). If preferences shift—say, after a diagnosis, you value life differently—that violates the fixed utility assumption. Similarly, for hurtful emails, the pain of learning might be a direct disutility, making it not costless. And for infidelity, if knowing poisons all future experiences, utility functions might not be separable from beliefs.

  The theorem assumes the decision-maker can always revert to pre-information choices, but in reality, information can alter the action space irrevocably—like how you behave after betrayal. Also, if utility depends on beliefs themselves, not just outcomes, Bayesianism might not capture that without extensions. The user is pointing to state-dependent utilities or belief-dependent preferences, which aren't covered in the basic framework.

  I should structure the response as five numbered points, concise and direct, addressing: 1) the theorem's reliance on fixed preferences, 2) the definition of "costless" excluding psychological impacts, 3) how conditionalization assumes no preference changes, 4) the role of dominance in action availability, and 5) the need for separable utilities. This will clarify that the theorem holds only under idealized conditions, and the counterexamples expose where those conditions fail in practice.

  The user's deeper need might be understanding the limits of Bayesian rationality. They're not just seeking textbook answers but want to reconcile theory with human experience. By highlighting the assumptions, I can show that Good's theorem is a normative ideal, not descriptive, and real-world reluctance often stems from violations of those ideals—like hidden costs or dynamic preferences. This should help them in their reading group discussion.
answer: |-
  1.  Good's theorem demonstrates the non-negative expected value of costless information *only under the specific assumptions of standard Bayesian decision theory*, including fixed preferences over ultimate outcomes and updating by conditionalization.
  2.  The theorem assumes "costless" means the information gathering itself imposes no direct disutility (like pain, effort, or resource expenditure) and that your utility function depends *only* on the state of the world and your chosen act, not on your *beliefs* about the state.
  3.  Apparent counterexamples often involve situations where learning the information *intrinsically causes disutility* (e.g., psychological distress from reading a hurtful email), which violates the strict "costless" assumption as the act of learning itself has negative utility.
  4.  Cases where information fundamentally alters your preferences or values concerning future outcomes (e.g., learning of betrayal permanently changing how you value shared experiences) violate the assumption of fixed preferences over outcomes required for the theorem's dominance argument.
  5.  Situations where the value of an experience depends on ignorance (e.g., suspense, surprise enjoyment) imply that the utility of outcomes is *belief-dependent*, contradicting the standard Bayesian model where utility is defined solely over states and acts, not over the knowledge state itself.
