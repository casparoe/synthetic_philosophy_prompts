  But then the malpractice angle complicates things. The family's lawsuit demanding full damages implicitly concedes the whole-brain criterion matters practically. If they won, it would've created legal schizophrenia: dead in tort law but alive for damage calculations. Thank goodness the case settled before setting that precedent.

  What really haunts me is the user's unspoken tension. They've clearly wrestled with whether "integrative unity" smuggles in quality-of-life judgments. And McMath's case strains at that seam - nobody would provide years of ICU care to a biologically integrated corpse unless they saw personhood there. Yet the theory itself stays clinically clean: no cortex? No integration. The discomfort comes from how we treat such bodies, not the definition.

  Finally, that liver failure death in 2018. It proves the ventilator was just perfusing tissues, not sustaining life. Four years of decay despite maximal support - if that's not loss of somatic integrity, what is? The user wants theory tested against reality, and here reality screams confirmation. But I'll also note where theory falls silent: it can't resolve the grief of a mother seeing warm skin, or the ethics of resource allocation. Those are human problems no criterion can solve.
