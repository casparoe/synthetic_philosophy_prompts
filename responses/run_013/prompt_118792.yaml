prompt: |-
  ok so for civics we're doing a fake supreme court thing and the teacher said if we use a real case she'll know instantly because we'll get the facts wrong, so I have to make one up. I need you to build the case for me. Not a real one, a made up law in a made up state, and please dont cite anything or reference any actual court decisions, I cant check them and I'll get caught.

  heres the thing I actually want, because the normal version is boring and everyone in my class is going to do the normal version. Normal version: textualist judge = cold robot who follows the words and screws over the sympathetic person, purposivist judge = wise and flexible and saves them. I want it the other way. I want a case where the judge who reads the law by its words lands on the side that basically everyone today thinks is right, and the judge who reads it by what the legislature was actually trying to do ends up being the harsh one.

  The engine for that has to be a gap between what the words say and what the people who wrote it were actually after. So: the words of the law, read the ordinary way by an ordinary person, should cover the person we're rooting for. But when you go to why the law got passed in the first place (the debate, the record, whatever), it turns out they were going after one narrow specific thing, and the thing they were after is kind of ugly by todays standards. So if you read the words to serve that narrow aim, our person gets thrown out on their ear. Text is friendly, purpose isnt. Thats the machine, and I need to actually see it run, not just be told it runs.

  Constraints:

  - one paragraph of facts. normal situation, not corporate, not sci fi, no weird hypothetical technology
  - old law, like a hundred years old, so the world has changed around it
  - the words of the law should be clear, just general. no it depends what the word means ambiguity, thats a different and easier problem and I dont want it
  - the person we're rooting for should be someone a normal person would instinctively side with, and the law should be the only thing standing between them and losing
  - no constitutional arguments, just this one statute
  - neither judge gets to be an idiot. the purposivist move has to be something a real judge would actually say out loud, not a strawman

  Then after the story:

  1. run the textualist reasoning and the purposivist reasoning step by step and land each one on its verdict, so I can see the two theories actually doing the work rather than me just announcing how it comes out
  2. tell me which single feature of the case is doing the work. and be honest if there are really two features and I only asked for one
  3. take that feature out and show me what happens. do the two judges suddenly agree? show it happening, dont just say they would
  4. the purposivist is going to hate this and try to wriggle out. I bet the move is describing the purpose at a higher level of generality so that it suddenly does cover our person. tell me if that wriggle is legit or just cope, and what the textualist says back
  5. last thing, and this is the part Im worried about. with the textualist, does the answer change depending on whether theyre using what the words meant back when it was passed or what they mean now? if the verdict flips depending on that, say so, and then tweak the case so it comes out the same either way, because my arguement dies if the other side gets to pick which flavour of textualism I meant

  Also if the case you build only works because I said it works, redo it, because the whole point is that it falls out of the theories.
