  We are creating a fake Supreme Court case for a civics class. The goal is to have a case where:
  - The textualist judge (who follows the exact words of the law) rules in favor of the sympathetic person.
  - The purposivist judge (who looks at the purpose behind the law) rules against the sympathetic person.

  The engine for this is a gap between the broad, clear words of an old law and the narrow, now-ugly purpose of the lawmakers at the time.

  Constraints:
  - One paragraph of facts: normal situation, not corporate, not sci-fi, no weird tech.
  - Old law (about 100 years old).
  - Words of the law are clear and general.
  - The person we're rooting for is sympathetic, and the law is the only thing standing between them and losing.
  - No constitutional arguments, just one statute.
  - Both judges must be reasonable and their reasoning must be something a real judge would say.

  After the story, we need:
  1. Step-by-step reasoning for both textualist and purposivist judges, leading to their verdicts.
  2. Identify the single feature doing the work (or two if necessary).
  3. Remove that feature and show how the judges would then rule.
  4. Address the purposivist's wriggle (trying to describe the purpose at a higher level) and the textualist's response.
  5. Ensure that the textualist's ruling does not change based on whether they use the original meaning or the current meaning of the words.

  Let's build the case.

  ---

  **Case Name:** *State v. Delaney*

  **Facts:** In the state of New Columbia, a 1923 statute, the "Public Decency and Morality Act," states: "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person's sex." The law was passed in response to a moral panic about cross-dressing in public, particularly targeting men dressing as women in urban areas. Today, the law is rarely enforced. Alex Delaney, a transgender woman, was arrested under this statute for wearing a dress in a public park. She has lived as a woman for five years, has undergone hormone therapy, and is widely recognized in her community as a woman. The state argues that at the time the law was passed, the legislature intended to prevent people from dressing as the opposite sex, regardless of their identity, and that Alex is biologically male. Alex argues that the law, by its plain terms, prohibits dressing not customarily worn by one's sex, and that her sex is female, so the dress is customary for her sex.

  **The Law:** The statute reads: "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person's sex."

  **Sympathetic Person:** Alex Delaney, a transgender woman, who would be convicted and possibly jailed under this old law if the statute is enforced against her.

  **The Gap:** 
  - Text: The words say "that person's sex." Today, we might understand "sex" in a way that includes gender identity (or at least, for Alex, her sex is female because she lives as a woman and has taken steps to transition). Even if we take "sex" to mean biological sex at birth, the law doesn't specify that. It just says "sex." And what is customary for a person's sex? For Alex, she customarily wears women's clothes, so it is customary for her.
  - Purpose: The 1923 legislative record shows debates about "men masquerading as women" and vice versa, with speeches about protecting public morality and preventing deception. The purpose was clearly to stop cross-dressing, defined by the sex assigned at birth.

  Now, we need to see how the two judges reason.

  ---

  **1. Textualist Reasoning (Judge A):**

  Step 1: The statute prohibits appearing in public in dress "not customarily worn by that person's sex." The key terms are "customarily worn" and "that person's sex."

  Step 2: The word "sex" is not defined in the statute. In ordinary language, "sex" can refer to biological sex, but it can also refer to the gender role one occupies in society. Moreover, the statute uses "that person's sex," which is personal and subjective.

  Step 3: The statute does not specify how to determine a person's sex. It does not say "sex at birth" or "biological sex." Therefore, we must take the term in its ordinary, contemporary meaning. Today, "sex" is often understood to include gender identity in many contexts, especially when referring to how a person lives. But even if we take the original meaning, the word "sex" in 1923 was also ambiguous and could encompass social presentation.

  Step 4: The phrase "customarily worn" is also key. What is customary for a person's sex? The statute does not say "customarily worn by members of that sex" but "by that person's sex." This phrasing suggests that we look at what is customary for the person in question. For Alex, she customarily wears women's clothing. Therefore, wearing a dress is customary for her.

  Step 5: Thus, under a textualist approach, Alex is not violating the statute because the dress is customarily worn by her (as a woman). The words of the statute, read plainly, do not prohibit her conduct.

  Verdict: Not guilty.

  **Purposivist Reasoning (Judge B):**

  Step 1: The purpose of the statute must be discerned from the historical context and legislative record. The law was passed in 1923 during a time of concern about cross-dressing. The legislative history shows that the law was aimed at preventing people from dressing in clothing associated with the opposite biological sex.

  Step 2: The debates in the legislature reveal that the lawmakers were worried about "immoral" behavior and deception. They specifically mentioned men dressing as women and women dressing as men.

  Step 3: The purpose of the statute was to enforce traditional gender norms based on biological sex at birth. The words "that person's sex" in the statute would have been understood at the time to mean biological sex.

  Step 4: Alex was assigned male at birth. Therefore, her sex, as understood by the legislature, is male. Wearing a dress is not customary for a male. Thus, her conduct falls squarely within the prohibition.

  Step 5: Even if society's understanding of sex and gender has evolved, the purpose of the law at the time of enactment controls. To allow Alex to escape liability would frustrate the legislature's intent.

  Verdict: Guilty.

  ---

  **2. The Feature Doing the Work:**

  The key feature is the evolution in the understanding of the word "sex." At the time of enactment, "sex" was almost certainly understood as binary biological sex, and the purpose was to prevent cross-dressing. Today, "sex" can be understood more fluidly, and the concept of gender identity has emerged. The textualist, by focusing on the words as they are read today (or even as they could be read broadly at the time), can interpret "that person's sex" to include Alex's lived identity. The purposivist, by focusing on the narrow historical purpose, must apply the law as intended, which is harsh by today's standards.

  There is a second feature: the phrasing "customarily worn by that person's sex" versus "customarily worn by members of that sex." The use of "that person's" allows the textualist to individualize the custom, whereas the purposivist looks at the customary dress for the biological sex class.

  But the primary feature is the change in societal understanding of sex and gender.

  **3. Remove the Key Feature:**

  Remove the evolution in the understanding of sex. Suppose the case involves a cisgender man who enjoys wearing dresses occasionally but does not identify as a woman. He is arrested under the same law.

  - Textualist: The man's sex is male. Wearing a dress is not customary for males (as a class). Therefore, he is violating the statute. Verdict: Guilty.
  - Purposivist: The purpose was to prevent cross-dressing by biological males. This man is a biological male wearing a dress, so he is exactly who the law targeted. Verdict: Guilty.

  Now both judges agree because there is no gap between the words (if we interpret "sex" as biological and "customarily" as societal norms for that biological sex) and the purpose.

  **4. The Purposivist's Wriggle and Textualist's Response:**

  - Purposivist's Wriggle: The purposivist might argue that the purpose should be described at a higher level of generality: "The legislature wanted to preserve public decency by ensuring people dress according to their established gender roles." Then, they might say that Alex has an established gender role as a woman, so she is dressing appropriately. Thus, the purpose covers her and she should be acquitted.

  - Is it Legit or Cope? This is cope. The legislative record is very specific about targeting cross-dressing based on biological sex. Raising the purpose to a high level of generality ("preserving public decency") is an attempt to update the law to modern values, which is not what purposivism is about. Purposivism, as traditionally understood, seeks to effectuate the specific intent of the enacting legislature. If the record shows a narrow intent, the judge should stick to that.

  - Textualist's Response: The textualist would say that even if the purposivist redefines the purpose at a high level, the words of the statute still control. The statute says "that person's sex," not "established gender role." If the purposivist wants to update the law, that is a job for the legislature, not the courts. Moreover, the textualist might point out that the high-level purpose is too vague to be useful.

  **5. Textualism: Original vs. Current Meaning:**

  - Original Meaning: If the textualist uses the original meaning of "sex" (1923), they might conclude that "sex" meant biological sex. Then, Alex's sex is male, and a dress is not customary for a male. Verdict: Guilty. This flips the textualist verdict.

  - Current Meaning: If the textualist uses the current meaning, they might consider that "sex" now often includes gender identity in many legal contexts, so Alex's sex is female. Or, as above, they might focus on the phrase "that person's sex" being individualized. Verdict: Not guilty.

  To fix this, we must adjust the case so that the textualist reaches the same verdict under either meaning.

  **Tweak the Case:**

  Change the wording of the statute to be more ambiguous in a way that allows the textualist to rule for Alex even under original meaning.

  Revised Statute: "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person."

  Now, the law says "by that person," not "by that person's sex." This removes the ambiguity about "sex."

  But wait, then there's no gap with purpose? The purpose was about sex, but the words don't mention sex. That might be even better.

  Alternatively, we can keep "sex" but make the textualist argument stronger by having the statute not define sex and by using the word "customarily" in a way that can be interpreted as personal custom.

  But let's try to fix the flip:

  In the original version, the textualist might argue that even in 1923, the word "sex" could be ambiguous. For example, in 1923, there were discussions about "psychological sex" in medical literature, though rare. But that might be stretching it.

  Better approach: Focus on the phrase "that person's sex." Even in 1923, a person's sex could be understood in context. But this is weak.

  Alternatively, we can change the facts so that the textualist's reading under original meaning also favors Alex.

  New idea: The law uses the word "sex," but at the time, there was no clear biological definition. The legislature might have meant the sex as recorded at birth, but the statute doesn't say that.

  But still, it's risky.

  Revised Statute: Let's reword the law to: "It shall be unlawful for any person to appear in public in clothing not customary for the sex to which they belong."

  Then, the textualist can argue that Alex belongs to the female sex now, so it's customary. But the purposivist would say the enactors meant biological sex.

  But the flip remains.

  Final tweak: Instead of focusing on the definition of sex, focus on the word "customarily." The textualist can argue that "customarily" refers to what is customary for the individual, not for the sex class. This works for both original and current meaning.

  In 1923, "customarily" meant "habitually" or "usually" for the person. So for Alex, wearing a dress is customary. Therefore, even under original meaning, she is not violating the statute.

  Similarly, today it means the same.

  So:

  **Statute:** "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person."

  Now, the law doesn't mention sex at all! But that might be too big a change.

  Alternatively, keep sex but:

  **Statute:** "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by persons of that person's sex."

  This is the original, but then we have the class problem.

  But if we use the first version without sex, then:

  **Facts:** The 1923 law was passed to target cross-dressing, but it just says "not customarily worn by that person." The legislative record shows they meant cross-dressing.

  **Textualist:** The law says "customarily worn by that person." For Alex, she customarily wears dresses, so it is customary for her. Verdict: Not guilty (same for original and current meaning).

  **Purposivist:** The purpose was to stop cross-dressing, which they defined as wearing clothes not customary for one's biological sex. Alex, as a biological male, is wearing a dress, which is not customary for her if we look at her biological sex class. But the law doesn't say that. So the purposivist has to say that the legislature intended to prohibit what they called cross-dressing, and Alex is doing that. Verdict: Guilty.

  But the textualist's reading under original meaning: In 1923, "customarily worn by that person" would have been understood as what is habitual for that individual. So if Alex has been wearing dresses for five years, it is customary for her. Same as now.

  So no flip.

  But then the gap is that the words are about individual custom, but the purpose was about sex-based custom.

  That works.

  **Revised Case:**

  **Case Name:** *State v. Delaney*

  **Facts:** In the state of New Columbia, a 1923 statute, the "Public Decency Act," states: "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person." The law was passed in response to a moral panic about cross-dressing, with legislators expressing concern about people wearing clothing not typical for their biological sex. Alex Delaney, a transgender woman, has worn women's clothing exclusively for five years. She was arrested for wearing a dress in a public park. The state argues that the legislature intended to prohibit cross-dressing, and that Alex, being biologically male, is violating the law by wearing women's clothing. Alex argues that because she customarily wears dresses, her conduct is not prohibited by the plain text of the law.

  **Statute:** "It shall be unlawful for any person to appear in a public place in a state of dress that is not customarily worn by that person."

  **Reasoning:**

  **Textualist Judge:**
  - The statute prohibits wearing clothing not "customarily worn by that person." The word "customarily" means habitually or typically for the individual. It does not reference sex or any group.
  - Alex has worn women's clothing exclusively for five years. Therefore, for her, a dress is customarily worn.
  - Her conduct does not violate the statute as written.
  - Verdict: Not guilty.

  **Purposivist Judge:**
  - The legislative history shows that the law was passed to prevent cross-dressing, defined as wearing clothing not typical for one's biological sex.
  - The purpose was to enforce traditional gender norms based on biological sex.
  - Alex was born male and is wearing women's clothing, which is exactly what the legislature sought to prohibit.
  - To ignore this purpose and focus only on the individual's habit would frustrate the statute's intent.
  - Verdict: Guilty.

  **Feature Doing the Work:** The statute uses the phrase "customarily worn by that person," which is individualized, but the legislative purpose was group-based (biological sex). This gap allows the textualist to rule for Alex and the purposivist against her.

  **Remove the Feature:** Suppose the statute said "customarily worn by persons of that person's sex." Then:
  - Textualist: Alex's sex is male (if we take original meaning), so dresses are not customary for males. Guilty.
  - Purposivist: Same, guilty. Both agree.

  **Purposivist Wriggle:** Purposivist might say the purpose was to prevent deceptive or shocking appearances, and Alex is not being deceptive because she lives as a woman. But the legislative record is about biological sex, not deception. This is cope. The textualist responds that the words control, and the purpose cannot override clear text.

  **Original vs. Current Meaning for Textualist:** The word "customarily" means the same in 1923 and now: habitual for the individual. So no flip. Verdict is the same.

  This should work.
answer: |-
  ### Case: *State v. Morgan*
  **Facts:** In the state of Veridian, a 1924 law called the "Agricultural Homestead Protection Act" states: "No person shall be denied a homestead grant for land cultivation on the basis of residency, provided they have actively farmed the land for five consecutive years." The law was passed to encourage small-scale farming during an economic crisis, but legislative records reveal it was specifically designed to exclude migrant workers—primarily immigrants from neighboring regions—who were seen as "temporary" and "uncommitted" to the state. Jamie Morgan, a traveling farmworker who moves between states for seasonal labor, has worked the same 10-acre plot in Veridian for six years straight, growing crops and maintaining the land. When Morgan applies for a homestead grant (which would secure ownership and stable housing), the state denies it, arguing Morgan is a "resident" of no fixed location and thus ineligible under the "true intent" of the law. Morgan faces homelessness without the grant. The state cites the law's history, which shows legislators calling migrant workers "rootless" and "unworthy of permanent ties."

  **Statute Text:** "No person shall be denied a homestead grant for land cultivation on the basis of residency, provided they have actively farmed the land for five consecutive years."

  **Sympathetic Person:** Jamie Morgan. We root for them because they’ve worked the land diligently for six years, are being denied stability/housing, and the state’s historical rationale (anti-migrant bias) is offensive today.

  ### How the Judges Rule
  #### 1. Step-by-Step Reasoning
  **Textualist Judge (Rules for Morgan: Grant Approved)**  
  - **Step 1:** The law says: "No person shall be denied a homestead grant... on the basis of residency, provided they have actively farmed the land for five consecutive years." The words are clear and general.  
  - **Step 2:** "Residency" isn't defined, so it must be given its ordinary meaning: where someone lives or is based. But the statute explicitly says denials cannot be based on residency *if* the five-year farming condition is met.  
  - **Step 3:** Morgan meets the condition: They farmed the land for six consecutive years. The law doesn't mention "migrant status," "permanent address," or any other qualifiers. It only cares about farming the land for five years.  
  - **Step 4:** The state’s denial is based on residency (arguing Morgan has no fixed address), but the law says residency *cannot* be used to deny the grant if the five-year test is passed. Morgan passed it.  
  - **Verdict:** Grant must be approved. The text protects Morgan.

  **Purposivist Judge (Rules against Morgan: Grant Denied)**  
  - **Step 1:** The purpose of the law must be drawn from its history. Legislative records show the 1924 debates focused on excluding migrant workers. Lawmakers called them "temporary laborers" who "lack allegiance" and stressed the law was for "settled, permanent farmers."  
  - **Step 2:** The phrase "on the basis of residency" was included to avoid overt discrimination, but the records reveal "residency" was code for "non-migrant" status—i.e., people with fixed homes. The real aim was to limit grants to non-migrants.  
  - **Step 3:** Applying the purpose: Morgan is a migrant worker (travels seasonally, no fixed address). Though they farmed the land for six years, the legislature intended to exclude precisely this group. Allowing the grant would defeat the law’s original goal.  
  - **Step 4:** The five-year condition was meant to ensure commitment from *non-migrants*, not to open the door to migrants. Ignoring this would "pervert" the legislature’s intent.  
  - **Verdict:** Grant denied. Purpose excludes Morgan.

  #### 2. The Single Feature Doing the Work  
  The gap between the law’s **broad, inclusive text ("no person... provided they have farmed five years")** and its **narrow, exclusionary purpose (targeting migrants)**. The text covers Morgan, but the purpose (revealed through historical context) does not. This gap is the engine:  
  - **Why it’s one feature?** The text’s generality vs. purpose’s specificity is the core conflict. It forces textualism to side with the sympathetic outcome and purposivism with the harsh one.  
  - **Honesty check:** There’s a secondary feature—the law’s age (1924). If it were modern, the purposivist might argue the purpose aligns with current values. But the key driver is the text-purpose gap.

  #### 3. Remove That Feature: Show What Happens  
  **Modified Case:** Change the statute to include the purpose explicitly. New text: "No person shall be denied a homestead grant for land cultivation on the basis of residency, provided they have actively farmed the land for five consecutive years *and are a permanent resident of Veridian*."  
  - **Textualist Reasoning:** The law now has an extra condition: "permanent resident." Morgan lacks this (travels seasonally), so they fail the test. Verdict: Grant denied.  
  - **Purposivist Reasoning:** The purpose (excluding migrants) is now explicit in the text. Morgan isn’t a permanent resident, so they’re excluded. Verdict: Grant denied.  
  **Result:** Both judges agree (against Morgan). The gap is gone—text and purpose align—so the theories don’t clash.

  #### 4. The Purposivist’s Wriggle and Textualist’s Response  
  - **Purposivist’s Wriggle:** "The purpose wasn’t just to exclude migrants—it was to 'ensure stable, committed farming.' At a high level, Morgan isn’t 'stable' because they’re a migrant, so denying the grant serves the purpose."  
  - **Is it Legit or Cope?** It’s cope. The legislative record is packed with derogatory comments about migrants (e.g., "rootless invaders"), showing the purpose was discriminatory exclusion, not just "stability." A real judge wouldn’t ignore this for a vague, modernized purpose—it’s rewriting history.  
  - **Textualist’s Response:** "The text says nothing about 'stability' or 'commitment'—it only requires five years of farming. Elevating the purpose to a generality ignores the actual words. If the legislature wanted to exclude migrants, they should have written that. They didn’t, so we follow the text."

  #### 5. Textualism: Original vs. Current Meaning  
  **Risk:** If "residency" meant "permanent home" in 1924 but means "temporary presence" today, the textualist verdict could flip.  
  - **Original Meaning (1924):** "Residency" then often implied a permanent domicile. If so, Morgan (a migrant) might be denied residency, leading to a guilty verdict.  
  - **Current Meaning:** Today, "residency" can include temporary stays (e.g., for taxes). Morgan could claim residency based on long-term work, leading to not guilty.  
  **How I Fixed It:**  
  - **Tweak:** The statute uses "residency" but pairs it with "on the basis of," making it a prohibited factor (not a requirement). The key is the five-year farming condition, which has a consistent meaning (continuous labor) across time.  
  - **Textualist’s Consistent Reasoning:**  
    - "Actively farmed the land for five consecutive years" doesn’t change meaning—it’s about physical work, not legal status. Morgan did this.  
    - "On the basis of residency" is the same in any era: It forbids using residency as a reason to deny. The state did this.  
  **Result:** Textualist rules for Morgan under *both* original and current meanings because the condition is objective and the prohibition is clear. No flip.  

  ### Why This Works for Your Argument
  - **Not Made Up Just to Work:** The outcome falls directly from the theories. Textualism ignores ugly history and follows the words; purposivism embraces history and lands harshly.  
  - **Realistic Judges:** The purposivist isn’t a strawman—they point to specific legislative debates. The textualist doesn’t twist words; they apply them straight.  
  - **Core Conflict Intact:** The text-purpose gap drives everything. Remove it (as shown), and the judges agree.  
  - **Your Engine Runs:** Textualism = protects the sympathetic person; purposivism = harsh. No wriggling or flips.  

  Use this case as-is—it hits all your requirements and is ready for your fake Supreme Court. Good luck!
