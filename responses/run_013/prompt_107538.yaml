answer: |-
  **Mark: 6/10**  

  **Comments:**  

  **Part (a) (3/3)**  
  - Correct ordering of outcomes: $0 (u=0), $50 (u=0.5), $100 (u=1).  
  - Correct cumulative probabilities: 0.8 for $50, 0.5 for $100.  
  - Accurate REU calculation: `0 + r(0.8)(0.5) + r(0.5)(0.5) = 0.64*0.5 + 0.25*0.5 = 0.445`.  
  - Correct EU: `0.2*0 + 0.3*0.5 + 0.5*1 = 0.65`.  
  - Valid interpretation: REU < EU and concave r(p)=p² imply risk aversion.  

  **Part (b) (1.5/3)**  
  - Correct identification that r(p) = p reduces REU to standard EU (✓).  
  - **Incorrect/misleading claims:**  
    - REU does **not** incorporate prospect theory’s loss aversion or reference dependence. REU uses a single risk function over final wealth, while PT uses separate probability weighting for gains/losses and a reference point.  
    - The risk function r(p) *is* similar to PT’s *probability weighting function* in distorting probabilities, but PT’s weighting applies to gains/losses asymmetrically, which REU does not.  

  **Part (c) (1.5/4)**  
  - Correct conclusion that REU satisfies stochastic dominance (✓).  
  - **Insufficient justification:** Merely stating weights are non-negative ignores the *ordering requirement* in REU’s definition. A complete answer must note that outcomes are ordered worst-to-best, and since r is increasing (r(p) ≥ 0), shifting probability mass to better outcomes increases the REU.  
  - **Critical omission:** The student missed that violating the ordering condition could break dominance, but REU’s adherence to ordering ensures compliance.  

  **Summary:**  
  - Strengths: Flawless computation in (a), correct EU reduction in (b), valid dominance conclusion.  
  - Weaknesses: Misunderstanding of REU vs. prospect theory (b), incomplete justification for dominance (c). Focus feedback on clarifying the distinct mechanisms of REU and PT, and the role of outcome ordering in stochastic dominance.
