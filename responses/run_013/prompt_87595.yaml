prompt: |-
  I chair the research review panel for a mid-sized health system's innovation fund -- small money, maybe $4m a year, mostly for things the big federal agencies won't touch. There's a proposal on the agenda for Thursday and I've changed my mind about it three times this week, so I want a written opinion I can circulate to the other seven panel members before we vote.

  The case: a university/community partnership wants $600k over three years to test a group-based rites-of-passage program for kids aging out of foster care. Small groups, a mentor, a physically demanding trip, no curriculum. The practitioners insist the thing only works if it's genuinely uncertain and unscripted for the kids. Their claim is that participants come out with a durable sense of belonging, and that this shows up as less placement breakdown over two years.

  Here's the fight. Three of us think their's nothing testable in it. You can't blind it, you can't standardize the "dose" (they say standardizing it kills it -- "the program is the relationship"), and when our stats person asked what result would count against them, the PI said a null on placement breakdown would, but also that the thing they actually care about -- the felt sense of belonging -- isn't something our validated scales capture, so a null on the scales wouldn't tell us much either way. My colleague said, only half joking, that this is astrology with a budget line. The PI says psychotherapy was in exactly this position before anyone built decent trials for it, and that if we demand she pre-specify one disconfirming observation we're applying a rule to her that we didn't apply to the music-therapy project we funded last year.

  Then there's a second problem, which is that our own rules contradict each other. After the "Bright Start" mess two years ago -- we funded a program, it produced nothing, and the lead said afterwards that the results were never measurable in principle -- we adopted a rule that every project must state in advance what observation would count as disconfirming, and we've been strict about it. The same year we adopted an equity rule saying the panel has to weigh community-embedded and experiential knowledge as evidence in its own right. The community partner here has submitted testimony from about 200 former participants, and one panel member says that under our own rules that testimony is evidence and we can't wave it away just because it isn't a p-value.

  So: draft the opinion I'll circulate. Give me a bottom line -- fund, fund with conditions, or reject -- with whatever conditions, seperate review points and time frame you'd actually attach, and tell me what we should say to the PI. Then give me the general criteria, because this keeps coming up and I'd rather we had a policy then eight people's guts. And argue the other side honestly; I lean toward funding with conditions, but I genuinely can't tell whether that's judgement or cowardice.
reasoning: |-
  Hmm, the user chairs a research review panel for a health system's innovation fund and needs help with a tricky funding decision. They're dealing with a $600k proposal for a rites-of-passage program for foster youth aging out of care, and they're personally conflicted - they've changed their mind three times this week. They need a written opinion to circulate before Thursday's vote.

  The core tension here is between scientific rigor and the nature of the intervention. The program involves small groups, mentors, physically demanding trips with no curriculum - the practitioners insist it only works when it's uncertain and unscripted. They claim it creates a "durable sense of belonging" that reduces placement breakdown, but there are major methodological challenges: no blinding possible, no standardized "dose," and the outcome they care about (belonging) isn't captured by validated scales.

  There are two factions on the panel: some see this as untestable "astrology with a budget line," while others argue that psychotherapy faced similar skepticism before robust trials existed. The PI points out the hypocrisy in applying stricter standards than were applied to last year's music therapy project.

  Adding complexity are the panel's conflicting internal rules. After the "Bright Start" failure where results were "never measurable in principle," they implemented a rule requiring pre-specification of disconfirming evidence. But they also have an equity rule requiring them to weigh community-embedded knowledge as evidence. The community partner has submitted testimony from 200 former participants, which some panel members argue constitutes valid evidence under their equity rule.

  The user wants me to draft an opinion that includes: a clear bottom-line recommendation (fund, fund with conditions, or reject), specific conditions if recommending funding, separate review points and timeline, what to tell the PI, and general criteria for future similar cases. They specifically ask me to argue the other side honestly as they're leaning toward funding with conditions but question their own motives.

  This is a fascinating intersection of epistemology, equity, and practical program evaluation. The stakes are high - $600k is significant for their fund, but more importantly, this could impact vulnerable youth transitioning out of foster care. I need to think through what "evidence" means in contexts where traditional RCT methods may be inappropriate or impossible.

  For the recommendation, funding with conditions seems most reasonable - it acknowledges the program's potential value while addressing legitimate concerns about evaluation. Conditions should include developing a logic model and theory of change, creating a "disconfirming conditions" framework rather than demanding a single disconfirming observation, implementing tiered evaluation (including qualitative methods and tracking placement data), and requiring partnership with an evaluation specialist.

  For the PI, the message should be firm but respectful - acknowledge the validity of their comparison to early psychotherapy research while explaining why some evaluation framework is necessary. For the panel, this case reveals a need for clearer criteria for evaluating complex, relational interventions - I should suggest a policy distinguishing between "mechanism-testing" and "value-testing" studies, with different evidence standards for each.

  I'll structure my response with: 1) Bottom-line recommendation and conditions, 2) Review points and timeline, 3) Message to the PI, 4) General criteria for future cases, and 5) Honest counterarguments. This should give the user what they need while modeling the balanced, thoughtful approach they're seeking from their panel.
answer: |-
  ## Draft Panel Chair Opinion: Rites-of-Passage Program Proposal

  **To:** Innovation Fund Review Panel Members  
  **From:** [Your Name], Panel Chair  
  **Date:** [Date]  
  **Re:** Proposal #XXXX: Group-Based Rites-of-Passage Program for Youth Aging Out of Foster Care - Recommendation & Analysis  
  **Proposed Funding:** $600,000 over 3 years

  **Bottom Line Recommendation:** **Fund with Specific Conditions** ($200k Year 1 release contingent on meeting Conditions by Month 6; Years 2 & 3 release contingent on Year 1 Review).

  ### Conditions for Funding
  1.  **Develop & Submit a Logic Model/Theory of Change:** Within 3 months, the PI must submit a detailed logic model outlining the proposed mechanisms linking program activities (mentorship, challenging trip, unstructured group experience) to the hypothesized outcomes (durable sense of belonging, reduced placement breakdown). This must explicitly articulate *how* "uncertainty" and "non-standardization" contribute to the mechanism.
  2.  **Define "Disconfirming Conditions" Framework:** Within 3 months, the PI must propose a *framework* for interpreting potential failure, replacing the requirement for a single disconfirming *observation*. This framework should include:
      *   Qualitative thresholds: E.g., pervasive negative feedback from participants/mentors about belonging/safety; failure to complete the core trip experience for non-logistical reasons in most groups.
      *   Quantitative thresholds: E.g., placement breakdown rates *significantly worse* than a carefully defined comparison group (e.g., historical controls matched on key variables, or a contemporaneous non-participant group if feasible ethically/logistically - acknowledging limitations); *absence* of any positive trend in participant self-report measures of belonging/well-being developed *with* participants, even if non-validated.
      *   Process failure: E.g., inability to recruit/retain mentors or participants; consistent reports of harmful dynamics within groups.
  3.  **Implement Tiered Evaluation Plan:** The project must include a robust, multi-method evaluation plan designed *with* an evaluation specialist (funds can be allocated for this) focused on:
      *   **Process Evaluation:** Detailed documentation of program delivery, participant/mentor experiences (ethnographic methods, in-depth interviews, participant journals - analyzed thematically).
      *   **Outcome Exploration:** Tracking placement stability (administrative data), coupled with the development and iterative use of participant co-created measures of "belonging," agency, and self-worth. *Not* relying on existing invalidated scales *or* p-values as primary proof, but seeking patterns and narratives.
      *   **Comparative Context:** If feasible, ethically, and rigorously, explore options for a non-equivalent comparison group analysis for placement breakdown (acknowledging significant limitations).
  4.  **Community Evidence Integration Plan:** The PI must detail *how* the existing and ongoing community testimony (200+ former participants) will be systematically collected, analyzed (using qualitative methods), and integrated into the evaluation findings and interpretation of success/failure. This is not just "anecdote" but core qualitative data under our Equity Rule.

  ### Review Points & Timeline
  *   **Month 3:** Submit Logic Model & Disconfirming Conditions Framework for Panel approval.
  *   **Month 6:** Submit detailed Evaluation Plan (including specialist CV/role description) & Community Evidence Integration Plan for Panel approval. *Release of Year 2 funding contingent on approval.*
  *   **Month 12:** Interim Report (Process evaluation findings, initial participant feedback, placement data tracking setup, challenges). *Release of Year 3 funding contingent on satisfactory progress and no major red flags in the Disconfirming Conditions Framework.*
  *   **Month 30:** Draft Final Report (Full qualitative analysis, placement stability analysis with context, participant narratives, assessment against Disconfirming Conditions Framework).
  *   **Month 36:** Final Report & Panel Debrief.

  ### Message to the PI
  "Dr. [PI Name], thank you for your compelling proposal and presentation. The panel recognizes the profound need for innovative approaches supporting youth aging out of foster care and the potential power of the relational, experiential model you describe. We appreciate the analogy to psychotherapy's evolution; it highlights the challenge of evaluating complex human interventions.

  Our decision is to conditionally fund the proposal. We believe in the program's *potential value* and the validity of community knowledge supporting it. However, the 'Bright Start' experience necessitates that *all* projects funded by this mechanism, regardless of methodology, must provide *some* framework for the panel and the health system to understand what failure might look like in context, beyond simply a null quantitative result. We are not demanding an RCT or a single p-value. We are asking you to articulate, with the help of evaluation expertise, *how we would know* if this specific approach, as implemented, *isn't* achieving its core aims for the participants or is causing harm, drawing on the kinds of evidence (qualitative, experiential, comparative) appropriate to its nature. We also need a clear logic model to understand your proposed theory of change.

  The conditions (Logic Model, Disconfirming Conditions Framework, Evaluation Plan) are required within 3 months for Year 1 funding release. We encourage you to embrace this as an opportunity to rigorously document the unique impact you believe this program has, in a way that respects its nature while providing accountability. We are committed to working with you under our Equity Rule to ensure community evidence is central."

  ### Proposed General Criteria for Evaluating Complex, Relational Interventions
  This case highlights a recurring tension. We need a policy that respects both scientific accountability and the nature of certain interventions, guided by our dual mandates post-Bright Start and the Equity Rule. I propose we adopt the following framework:

  1.  **Intervention Type Classification:** For each proposal, explicitly classify its primary aim:
      *   **Mechanism-Testing:** Seeks to isolate and measure a specific causal mechanism using controlled methods (e.g., drug trial, specific behavioral intervention). Requires strong pre-specified quantitative disconfirming criteria and robust control.
      *   **Value-Testing:** Seeks to explore the real-world impact, feasibility, and perceived value of a complex intervention where standardization or blinding is impossible or counterproductive (e.g., community programs, complex care models, relational therapies). Requires a different evidence standard.
  2.  **Evidence Requirements for Value-Testing Proposals:**
      *   **Mandatory:** A clear **Logic Model/Theory of Change**, articulating hypothesized mechanisms and outcomes.
      *   **Mandatory:** A **Disconfirming Conditions Framework** (not a single observation). This must outline credible, context-appropriate signals of failure or harm (qualitative, process-based, comparative trends, safety issues) using methods suitable to the intervention.
      *   **Mandatory:** A **Pluralistic Evaluation Plan:** Must combine methods appropriate to the claims:
          *   Process evaluation (how was it delivered? what was the experience?).
          *   Outcome exploration (using methods sensitive to the outcomes - e.g., qualitative, participant-developed measures, pragmatic quantitative tracking *with acknowledged limitations*).
          *   Integration of experiential/community knowledge (systematically collected and analyzed).
      *   **Highly Recommended:** Collaboration with an evaluation methodologist experienced in complex interventions.
  3.  **Equity Rule Application:** Community-embedded knowledge and experiential evidence **are** valid forms of evidence within the Pluralistic Evaluation Plan. They must be gathered systematically and analyzed rigorously (e.g., thematic analysis of testimony) but are not required to be quantitative or "controlled." Their weight in the overall assessment of success/failure should be explicitly defined in the Disconfirming Conditions Framework.
  4.  **Bright Start Safeguard:** The Disconfirming Conditions Framework is the core safeguard against the "unfalsifiable claim" problem. A proposal lacking a credible framework, even if strong on community evidence and logic model, should not be funded. "Success is inherently unmeasurable" is not acceptable.

  ### Arguing the Other Side Honestly (The Case for Rejection)
  The rejection argument is strong and principled:

  1.  **Violation of Core Safeguard:** The PI's resistance to defining *any* disconfirming observation, even qualitatively or process-based, directly contravenes our fundamental post-Bright Start rule designed to prevent funding inherently unfalsifiable claims. Granting an exception fatally undermines this rule and sets a dangerous precedent. "Trust us, it works" is not sufficient for public funds.
  2.  **Lack of Testable Claims:** The core outcome ("durable sense of belonging") is admitted to be unmeasurable by any available tool, including their own proposed methods (participant testimony is evidence of experience, not proof of a *durable* outcome or its causal link to placement stability). The placement stability claim is proposed without a feasible comparison strategy, making attribution impossible. Funding untestable claims is irresponsible.
  3.  **Methodological Incompatibility:** The insistence that *any* standardization or systematic observation "kills" the intervention renders meaningful evaluation impossible. If the active ingredient is complete unpredictability, how can we learn *anything* replicable or generalizable? This risks $600k for anecdotes.
  4.  **False Equivalence:** Comparing this to early psychotherapy is misleading. Psychotherapy evolved testable theories and manualized approaches *enabling* RCTs. This proposal actively rejects that path. The music therapy project, while perhaps imperfect, likely proposed measurable outcomes (e.g., pain scales, anxiety scores) and *some* disconfirming criteria.
  5.  **Risk:** Funding this sets a precedent where compelling narratives and community support override the need for any accountability framework, opening the fund to proposals that are noble-sounding but fundamentally unevaluable, wasting resources that could go to testable innovations.

  **Conclusion:** This is the hardest type of proposal we face. Leaning towards funding with conditions isn't cowardice; it's an attempt to navigate the genuine tension between our rules and the reality of complex human interventions, guided by our Equity mandate and the potential benefit for a vulnerable population. **However, the Rejection argument is valid and defensible.** It prioritizes intellectual honesty and the protection of the fund's integrity and purpose.

  The conditional funding path I propose *demands* accountability through the Logic Model, Disconfirming Conditions Framework, and robust pluralistic evaluation plan, while respecting the intervention's nature and our Equity Rule. It forces the PI to engage seriously with evaluation without forcing a square peg into a round hole. If they cannot or will not meet these conditions, then rejection becomes the only responsible choice.

  **Recommendation:** **Fund with Conditions** as outlined, contingent on timely and satisfactory fulfillment of the initial deliverables (Logic Model, Disconfirming Framework, Evaluation Plan) within 3 months. Let's discuss on Thursday.
