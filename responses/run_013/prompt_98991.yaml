  - Phlogiston to oxygen: paradigm shift, and incommensurable.
  - Newton to Einstein: a revolution for sure, but NOT incommensurable — you can recover Newton as a limiting case, so the terms translate.
  - Classical/Mendelian genetics to molecular genetics: paradigm shift, but NOT incommensurable. Gene survives the move and they're after the same thing.

  Next week the reading is the shift from miasma theory of disease to germ theory. What's she gonna say — paradigm shift, incommensurable, both, neither? I care less about the labels than about this: what rule is she actually running, and is there a second rule that fits all four verdicts just as well? Then say where those two rules come apart on the miasma case, which way you'd bet she jumps and why, and what other case I should bring up if I want to force the two rules apart in the other direction.

  And please dont just tell me its just Kuhn — I need the actual decision procedure she seems to be applying, applied to the new case.
