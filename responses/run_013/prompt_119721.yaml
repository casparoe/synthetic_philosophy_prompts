answer: |-
  You're wrestling with a morally complex situation, and Dana's "disqualification" argument is understandable but flawed. Here's the breakdown:

  1.  **The "Hypocrisy" Trap Isn't the Point:** Your brother is using your past actions as a shield to deflect accountability *right now*. Dana's "bribed judge" analogy is dramatic but inaccurate. This isn't a courtroom where you're presiding. You're a concerned family member witnessing neglect. A better comparison is a **recovering addict** – their past doesn't disqualify them from recognizing addiction in others or urging them to get help. Your past mistake gives you painful insight, not permanent silence.

  2.  **Intent Matters, But Action Matters More:** You *are* right that your *why* matters – you're motivated by your vulnerable mother's immediate well-being, not self-righteousness. However, focusing *only* on intent risks excusing inaction. The core issue isn't *why* you're speaking up, it's **whether what you're saying is true and necessary**. Your brother's neglect and deception *are* happening, and your mom *is* suffering. That reality demands a response, regardless of the messenger's history.

  3.  **"Allowed" to Act vs. "Bound" by Hypocrisy:** Dana's "forfeited the right" claim is dangerously absolute. **You are absolutely "allowed" to act.** Here's what you can and *should* do, moving beyond the hypocrisy debate:
      *   **Stop Covering for Him:** Immediately. When Mom asks where he is: "I don't know why he hasn't visited, Mom. I'm sorry he's not here. *I'm* here on the phone with you right now." Be factual, gentle, and redirect to your presence. Protecting his lie harms her.
      *   **Tell Your Aunt:** Absolutely. Provide facts: "Brother lives 20 minutes away, hasn't visited in over a year despite promises, tells Mom she forgets his visits, and holds POA/bank card/key. I call nightly but live across the country. Mom is confused and lonely." Frame it as concern for Mom's safety/welfare, *not* just brother-bashing. You need a local ally.
      *   **Communicate Directly (Strategically):** Shift the focus *away* from your past and *onto* Mom's present needs and his responsibilities. "Brother, regardless of my past, Mom needs help *now*. She is confused, lonely, and potentially unsafe living alone. You have her key, bank card, and POA. You are the only one nearby. We need a concrete plan *today* for her care: regular visits, groceries, medication checks, or arranging professional help. What can you commit to *this week*?" If he deflects to your past: "My past mistakes don't change Mom's current situation or your responsibilities. Let's focus on solutions for *her*."
      *   **Document Everything:** Dates/times of calls with Mom, what she says about him visiting (or not), your communications with your brother (save texts/emails), conversations with your aunt. This is crucial if legal/financial interventions become necessary.
      *   **Explore Practical Solutions:** Contact your aunt about accessing the house (maybe change locks if brother won't cooperate with the key?). Research local Area Agencies on Aging or elder care services that can check on her. Consult an elder law attorney (many offer free initial consults) about the process for challenging the POA due to neglect *if* documented evidence shows he's failing his duties. This isn't about punishment; it's about ensuring Mom's safety and care.

  4.  **Why Your Brother (and Dana) Are Wrong:**
      *   **False Equivalence:** You were 22. He is (presumably) older and holds significant legal/financial responsibility *specifically* because he lives close. Your context was different.
      *   **Current Harm:** Your past neglect of your dad (while wrong) is history. His neglect *right now* is causing active, ongoing harm to a vulnerable adult he is legally responsible for.
      *   **Gaslighting:** His lie to your mom ("you just forget") is psychological abuse, exploiting her dementia. This adds a layer of cruelty beyond simple neglect.
      *   **Accountability vs. Disqualification:** Learning from past mistakes *requires* holding others accountable when they commit similar wrongs. Silence enables harm. Your experience gives you perspective, not a gag order.

  **The Path Forward:**

  1.  **Acknowledge Your Past Briefly & Move On:** "Yes, I failed Dad terribly when I was young. I regret it deeply. That experience makes me even more determined to ensure Mom doesn't suffer the same neglect *now*. Let's focus on her."
  2.  **Center Your Mother:** Make every action and conversation about *her* needs, safety, and well-being. This is the strongest moral ground.
  3.  **Focus on Actions, Not Accusations:** Shift the conversation from "You're bad" to "Mom needs X, Y, Z. How will we make that happen?" Document his failures to act.
  4.  **Enlist Help:** Involve your aunt immediately. Seek professional advice from elder care resources or an attorney.
  5.  **Stop Enabling:** Refuse to perpetuate his lies to your mom. This is non-negotiable.

  **Bottom Line:** Your brother is wrong. Dana is wrong. You haven't forfeited your right or responsibility to act on behalf of your vulnerable mother. Your past mistake is a reason for humility and understanding, *not* for paralysis. Hypocrisy is a cheap accusation designed to silence critics. Protecting your mother from neglect and exploitation is the moral imperative that transcends it. Act decisively for her sake.
