prompt: |-
  ok so this has turned into a whole thing and I need an outside read on it.

  Setup: my brother lives 20 minutes from our mom. She's 84, early dementia, lives alone. He hasn't visited her in over a year. He keeps saying he'll go "next weekend," and he keeps not going, and meanwhile he's the one who has her spare key and her bank card and the medical POA. I live across the country and I call her every night. I found out last month that he's been telling her he visits "all the time" and that she's just forgetting — which, given the dementia, is a pretty hard thing to prove or disprove, and also maybe the cruelest part.

  Here's my problem. When I was 22 I did basically the same thing to our dad. Moved away, stopped calling, blew off two years of visits, and I was old enough to know better. I apologized eventually and I think I've been decent since. So when I finally said something to my brother about mom, he said "you have zero room to talk, you did the exact same thing." And my friend Dana says he's right — she says once you've done the thing yourself you forfeit the right to say anything about it, full stop, and that me being angry about it is just me being a hypocrite with extra steps.

  Two things bug me and I can't tell if I'm just rationalizing. First, it feels like it should matter *why* I'm saying something now — I'm not doing this for me. Mom is 84 and confused and sits by the phone. Second, it feels like there's a difference between "you're a hypocrite" (fine, whatever, true) and "you're barred from doing anything" — I can still call him, still tell our aunt what's actually going on, still stop covering for him when mom asks where he's been. Dana says that's just me trying to have it both ways.

  She said one thing that I keep chewing on though. She said having a right to complain is like a judge who took a bribe — doesn't matter how sound the ruling is, they're off the case. But it feels more to me like a witness who lied once — you can still believe them if they're telling the truth now. Those seem like really different pictures and I don't know which one fits.

  So: is my brother right that I've lost the right to say anything? Is Dana? And setting aside who's "right" — what am I actually allowed to do here, because I'm going to do something either way, and I'd like it to not be a hypocritical thing if that's avoidable.
