prompt: |-
  I'm not a philosopher, just someone who reads too much online. I've been stuck on Newton's bucket. My freind built this argument and I can't tell if its brilliant or cheating. (1) If all motion is relative, then the shape of the water in a spinning bucket has to be explained by the water's motion relative to the bucket. (2) When the bucket and water spin together, the water isn't moving relative to the bucket. (3) But the surface still curves up at the sides. (4) So relationism is false. (5) If relationism is false, then space itself must be a real thing that tells matter how to move. (6) So space is a substance. (7) But that means space is a kind of ghost that pushes on water, which sounds like nonsense. Where does this go wrong? I'd rather keep (1) and (3) then (6), but I want to know what I'd have to give up. And what if the bucket is the only thing in the universe and it's spinning? Does the water still curve, and what does that do to the argument? Answer in plain prose, no headings, bullet points, bold, or tables, like you're writing me an email.
