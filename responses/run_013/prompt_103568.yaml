  We are to design a practical procedure for model selection in the context of fisheries stock assessment, based on the principles of Kolmogorov complexity and Minimum Description Length (MDL). The key idea is that the best model is the one that compresses the data the most, meaning it allows the shortest description of the data. This involves two parts: the description length of the model itself and the description length of the data given the model.

  However, we must acknowledge that Kolmogorov complexity is not computable and is defined up to a constant. Therefore, we will use an approximation that is computable and practical. The procedure must account for:

  1. The non-computability of Kolmogorov complexity: We will use a two-part code approximation, where we explicitly describe the model and then the data given the model.
  2. The constant factor: We will make sure that the same reference machine (i.e., the same coding scheme) is used consistently for all models for a given stock, so that the constant is the same and cancels in comparisons.
  3. The dependence on pre-processing choices (units, logging, baseline years): We require that these are fixed in advance and the same for all models for a given stock.
  4. Computational limits: We cannot search over a space of models arbitrarily, so we assume that we have a small set of candidate models (e.g., 2-5) that are pre-specified.

  The procedure will separate three components:

  A. **Model Description Length (L(M))**: The length of the description of the model (its structure and parameters).
  B. **Data Description Length (L(D|M))**: The length of the description of the data given the model (i.e., the residuals or the likelihood).
  C. **Model Class Prior**: The prior weight of the model class relative to others. This is the part we cannot compute without a prior over models, so we will have to set it explicitly and admit it is subjective.

  We cannot avoid the fact that the model class prior is subjective. Therefore, we will:

  - Quantify L(M) and L(D|M) as best we can.
  - Explicitly state the model class prior we are using (if any) and note that it is a subjective choice.

  The procedure steps:

  1. **Fix the data and pre-processing**: 
     - Decide on the data set D (years, indices, catches, etc.), transformations (e.g., log for indices), and units. This must be the same for all models for a given stock. Record these choices.

  2. **Define candidate models**:
     - List the models to compare. For each model, note:
       - The model structure (equations, parameters, etc.)
       - The number of free parameters (k)
       - Any fixed assumptions (e.g., natural mortality, selectivity)

  3. **Fit each model to the data**:
     - Obtain the maximum likelihood estimates (MLE) for the parameters, or use Bayesian methods to get posterior distributions (if using Bayesian, we will need to adjust the description length accordingly). For simplicity, we start with MLE.

  4. **Compute the data description length (L(D|M))**:
     - For a given model M, with parameters θ, we can compute the negative log-likelihood (NLL) of the data under the MLE: 
          L(D|M) = -log P(D|θ_MLE, M)
     - However, note that this is only the first term. In MDL, we must also account for the fact that we are using the MLE (which is estimated from the data). Therefore, we use a two-part code:
          L_two-part(D|M) = L(θ_MLE) + [-log P(D|θ_MLE, M)]
     - But how to compute L(θ_MLE)? We must describe the parameters. We can use the fact that the parameters are real numbers and we need to describe them to a certain precision. A common approach is to use the Fisher information to determine the precision, which leads to the asymptotic approximation:
          L(θ_MLE) ≈ (k/2) * log(n)   [where n is the number of data points]
     - This is derived from the Bayesian Information Criterion (BIC) and is asymptotic. Alternatively, we can use a more precise two-part code by choosing a precision for each parameter and then describing each parameter with that precision. However, for simplicity and given time, we use the BIC approximation for the two-part code total:
          L_two-part(D) ≈ -log P(D|θ_MLE, M) + (k/2) * log(n)
     - But note: in strict MDL, we are allowed to design a code for the parameters. We can do better by using a prior over the parameters and then using a Bayesian code (which integrates out the parameters). However, we are not required to do so. We can also use the normalized maximum likelihood (NML) code, but that is computationally heavy.

     Given our constraints (computational time and expertise), we will use the two-part code with the BIC penalty for the parameters. Thus:
          L_total(M) = [ -log P(D|θ_MLE, M) ] + [ (k/2) * log(n) ]

     However, note that this does not include the description of the model structure (only the parameters). We must also account for the model structure.

  5. **Compute the model structure description length (L(M_struct))**:
     - This is the length to describe the model itself (e.g., "age-structured model with 5 age classes, natural mortality fixed at 0.2, ..."). This is where the Kolmogorov complexity comes in, but it is not computable. Instead, we can use a simple approach: 
