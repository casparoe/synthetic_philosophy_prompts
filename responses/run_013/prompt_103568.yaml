answer: |-
  ### Model Selection Procedure Based on Minimum Description Length (MDL) Principles  
  *Designed for fisheries stock assessments with explicit separation of quantifiable vs. subjective components. Survives non-computability of Kolmogorov complexity via practical approximations.*

  ---

  #### **Preconditions**  
  1. **Fixed data pipeline**: Before model comparison, agree on:  
     - Data years, transformations (e.g., log-survey index), units, and baseline periods.  
     - **No changes** allowed during model fitting (avoids artificial simplicity).  
  2. **Candidate models**: Pre-specify 2–5 models (no search over unbounded spaces).  
  3. **Reference machine constants**: Define a table of model class complexities (in nats) *before analysis*. Example:  

     | Model Class               | \( L(\text{struct}) \) (nats) | Notes                               |  
     |---------------------------|-------------------------------|-------------------------------------|  
     | Biomass trend (2–3 params) | 3.0                           | Simple, time-series only           |  
     | Surplus production        | 5.0                           | Basic biology                       |  
     | Age-structured (base)     | 10.0                          | Standard for data-rich stocks      |  
     | Size-structured           | 10.0                          | If biologically equivalent to age |  

     *These values are set by panel consensus and admit subjectivity.*

  ---

  #### **Procedure Steps**  
  **Goal**: Compute total description length \( L_{\text{total}}(M) = L(D|M) + L(M) \).  
  Separate components:  
  - \( L(D|M) \): **Data given model** (quantifiable via likelihood).  
  - \( L(M) = L(\text{struct}) + L(\text{params}) \): **Model cost** (partially subjective).  

  | Step | Task                                                                 | Output & Sufficiency Criteria                                                                 | Notes on Theory/Practicality                                                                 |  
  |------|----------------------------------------------------------------------|----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|  
  | 1    | **Fit models**                                                       | MLE estimates \( \hat{\theta} \) and negative log-likelihood \( -\ln p(D|\hat{\theta}, M) \). | Use existing software (e.g., Stock Synthesis). Sufficient: Convergence and valid likelihood. |  
  | 2    | **Compute \( L(D|M) \)**                                             | \( L(D|M) = -\ln p(D|\hat{\theta}, M) \) (in nats).                                          | Exact if likelihood correct. Measures *fit*.                                                 |  
  | 3    | **Compute \( L(\text{params}) \)**                                   | \( L(\text{params}) = \frac{k}{2} \ln n \), where \( k = \) free params, \( n = \) data points. | BIC approximation. Asymptotic; valid for \( n \gg k \). Quantifiable but approximate.        |  
  | 4    | **Assign \( L(\text{struct}) \)**                                    | Value from pre-agreed table (in nats).                                                       | *Subjective.* Represents Kolmogorov complexity up to reference machine constant.             |  
  | 5    | **Total cost**                                                       | \( L_{\text{total}}(M) = L(D|M) + L(\text{params}) + L(\text{struct}) \)                     | Sum all components.                                                                          |  
  | 6    | **Compare models**                                                   | \( \Delta L_{\text{total}} = L_{\text{total}}(M_i) - L_{\text{total}}(M_{\text{best}}) \).   | Smaller \( L_{\text{total}} \) = better compression.                                         |  
  | 7    | **Verdict**:                                                        |                                                                                              |                                                                                              |  
  |      | - If \( \Delta L_{\text{total}} > 10 \) nats for all rivals          | Select \( M_{\text{best}} \).                                                                | Strong evidence (≈ \( e^{10} \approx 22,000 \) odds).                                        |  
  |      | - If \( \Delta L_{\text{total}} \leq 10 \) nats                      | Flag as "indistinguishable"; hand to panel.                                                  | Weak evidence; panel decides using risk, tradition, or policy.                               |  

  ---

  ### **Case Applications**  

  #### **Case 1: Data-Rich Stock**  
  - **Context**: Age-structured model (ASM; \( k=40 \)) vs. surplus production (SP; \( k=3 \)). ASM fits better in-sample (\( L(D|\text{ASM}) = 900 \), \( L(D|\text{SP}) = 1000 \)).  
  - **Data**: \( n = 40 \) years.  
  - **Pre-set \( L(\text{struct}) \):** ASM = 10 nats, SP = 5 nats.  
  - **Calculation**:  
    - ASM: \( L(\text{params}) = \frac{40}{2} \ln 40 = 20 \times 3.689 = 73.78 \); \( L_{\text{total}} = 900 + 73.78 + 10 = 983.78 \)  
    - SP: \( L(\text{params}) = \frac{3}{2} \ln 40 = 1.5 \times 3.689 = 5.53 \); \( L_{\text{total}} = 1000 + 5.53 + 5 = 1010.53 \)  
    - \( \Delta L_{\text{total}} = 1010.53 - 983.78 = 26.75 \) nats (>10).  
  - **Verdict**: **Select ASM** (Step 7).  
  - **Why not SP?**: ASM’s better fit justifies extra parameters and structure cost.  
  - **Judgment call**: \( L(\text{struct}) \) values (ASM 2× SP) are subjective but fixed *a priori*.  

  #### **Case 2: Data-Poor Stock**  
  - **Context**: Short catch series (\( n=5 \)), noisy survey. Candidate: SP model (\( k=3 \)).  
  - **Pre-set \( L(\text{struct}) \):** SP = 5 nats.  
  - **Fictional alternative**: Biomass trend (\( k=2 \), \( L(\text{struct}) = 3 \) nats).  
  - **Calculation**:  
    - SP: \( L(D|M) = 20 \), \( L(\text{params}) = \frac{3}{2} \ln 5 \approx 2.41 \), \( L_{\text{total}} = 20 + 2.41 + 5 = 27.41 \)  
    - Biomass: \( L(D|M) = 25 \), \( L(\text{params}) = \frac{2}{2} \ln 5 \approx 1.61 \), \( L_{\text{total}} = 25 + 1.61 + 3 = 29.61 \)  
    - \( \Delta L_{\text{total}} = 29.61 - 27.41 = 2.2 \) nats (<10).  
  - **Verdict**: **Hand to panel** (Step 7).  
  - **Catch advice implication**: No model is statistically justified. Default to:  
    - Precautionary catch (e.g., prior year minus 20%),  
    - Or biomass trend if forced (but admit uncertainty).  
  - **Why refusal?**:  
    - Theory: \( n=5 \) too small for BIC approximation (asymptotic fails).  
    - Subjectivity: \( L(\text{struct}) \) dominates (5 nats vs. 3 nats). If SP \( L(\text{struct}) = 3 \), SP wins marginally (27.41 vs. 29.61), but still <10 nats difference.  

  #### **Case 3: Artificial Simplicity via Data Binning**  
  - **Context**: Analyst bins lengths in ASM (\( k=30 \)) and drops 2020 data ("poor fit").  
  - **True ASM** (no binning, \( k=35 \)): \( L(D|M) = 850 \) (full data).  
  - **Binned ASM** (\( k=30 \)): \( L(D|M) = 870 \) (on full data; worse fit due to binning).  
  - **Data**: Fixed \( n = 30 \) years (Step 1 enforces this; analyst *cannot* drop 2020).  
  - **Pre-set \( L(\text{struct}) \):** Both = 10 nats (if panel views binning as same complexity class).  
  - **Calculation**:  
    - True ASM: \( L_{\text{total}} = 850 + \frac{35}{2} \ln 30 + 10 \approx 850 + 59.5 + 10 = 919.5 \)  
    - Binned ASM: \( L_{\text{total}} = 870 + \frac{30}{2} \ln 30 + 10 \approx 870 + 51.0 + 10 = 931.0 \)  
    - \( \Delta L_{\text{total}} = 931.0 - 919.5 = 11.5 \) nats (>10).  
  - **Verdict**: **Select true ASM** (Step 7).  
  - **Step that caught it**: Step 1 (fixed data pipeline) forced binned model to use same data → exposed worse fit. Step 6 penalized unnecessary binning.  
  - **Judgment call**: If panel set binned \( L(\text{struct}) = 8 \) nats (deeming it simpler), binned model wins (929.0 vs. 919.5). Procedure exposes this dependency.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Absolute truth claims**:  
     - MDL selects the *best-compressing model*, not the "true" model.  
     - Cannot answer: "Is the stock declining due to climate?" (requires causal inference).  
  2. **Management risk trade-offs**:  
     - Ignores consequences of overfishing vs. underfishing.  
     - E.g., A model with \( \Delta L_{\text{total}} = +9 \) nats (indistinguishable) may be safer but isn’t favored.  
  3. **Prior justification**:  
     - \( L(\text{struct}) \) values are subjective and set by panel; MDL doesn’t justify them.  
  4. **Small-sample validity**:  
     - BIC approximation fails when \( n < 5k \); results become sensitive to \( L(\text{struct}) \) (Case 2).  
  5. **Model discovery**:  
     - Cannot generate new model structures; only selects from pre-specified candidates.  
  6. **Non-likelihood data**:  
     - Fails if likelihoods are intractable (e.g., agent-based models).  

  ---

  ### **Final Recommendations**  
  - **For analysts**: Use Steps 1–6 to force transparency. Report:  
    ```  
    Model A: L(D|M) = X, L(params) = Y, L(struct) = Z → Total = X+Y+Z  
    Model B: ...  
    ```  
  - **For panels**: Debate \( L(\text{struct}) \) table *before* assessments. When \( \Delta L \leq 10 \) nats, decide based on:  
    - Management robustness (e.g., simpler model if advice stability critical),  
    - Precaution (e.g., complex model if avoiding collapse is priority).  
  - **Theory survival**:  
    - Kolmogorov constant → Handled by fixing \( L(\text{struct}) \) per class.  
    - Non-computability → Approximated via BIC + fixed penalties.  
    - Pipeline dependence → Fixed at Step 1.  

  This procedure replaces rhetorical wars with auditable math, isolates subjectivity to \( L(\text{struct}) \), and forces admission of weak evidence when data are poor.
