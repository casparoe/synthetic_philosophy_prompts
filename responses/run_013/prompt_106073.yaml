prompt: |-
  I am currently taking a seminar on African philosophy and relational personhood, and our unit on ubuntu has left me with a formal problem that I would like you to solve in verse. We have been distinguishing a weak relational thesis, on which relations merely enable or shape an independently existing self, from a strong relational thesis, on which relations constitute the self, so that personhood is something conferred and sustained between people rather than possessed privately. We have also been distinguishing personhood as a status conferred by a community from personhood as a capacity for ethical response, and I want the poem to exploit that ambiguity rather than settle it. Write a villanelle that makes the strong thesis vivid without letting it collapse into the idea that the community can simply decide who counts as a person. The two refrains should be lines of your own—do not quote anyone—that express, respectively, the priority of the community in constituting the person and the priority of the person's own response in sustaining the community. Make the refrains grammatically parallel but not synonymous, so that their difference is audible even when they are adjacent. As the poem proceeds, each refrain should be infected by the other, so that by the closing quatrain they can sit side by side without being reconciled. The turn I want the form to enact is the moment the gift of recognition becomes indistinguishable from the power to withhold it: the same relational constitution that grounds the demand to recognize others also seems to give the community authority over the dissenter, the exile, and the one whose identity the community refuses to affirm. The poem should not resolve that worry; it should leave the reader with both the ethical promise of relational personhood and the internal critique that relational personhood may license conformity. Aim for a villanelle in strict form—five tercets and a closing quatrain, with the two refrains returning and meeting in the last two lines—and make sure the philosophical content does structural work: someone who knows the debate should be able to tell which refrain is which and why the form keeps them circling. Do not include citations or references to specific authors; I want the poem to stand on its own. After the poem, on a new line, give a one-sentence summary beginning Summary: that names the formal feature and the philosophical tension it tracks.
reasoning: |-
  Okay, the user is diving deep into African philosophy, specifically ubuntu and relational personhood. They're grappling with the tension between a strong relational thesis—where the self is constituted by relationships—and the risk of community overreach in defining personhood. 

  The request for a villanelle is fascinating because the form’s repetitive refrains perfectly mirror the philosophical tension: how can community and individual agency both be foundational without canceling each other out? The user wants the refrains to be grammatically parallel but distinct, infecting each other over the course of the poem until they sit side by side unresolved. 

  I notice they’re wary of two pitfalls: reducing personhood to mere social conferral (which could justify exclusion) and oversimplifying the ambiguity between personhood as status vs. capacity. The poem must hold both the ethical promise of relationality and its potential for coercion. 

  Structurally, the villanelle’s circling refrains will enact the unresolved debate. I’ll craft one refrain emphasizing communal constitution ("We make each other real in shared regard") and another for agential response ("I answer back to make the we less hard"). The progression should show how recognition’s gift implies the power to withhold it—especially in the closing quatrain where the refrains collide without reconciliation. 

  The summary needs to pinpoint the formal mechanism (refrain adjacency) and philosophical tension (constitution vs. conferral authority). User’s clearly done their homework—this is a beautifully precise request. No citations, just pure poetic-philosophical weight.
answer: |-
  ## I Come to You in Answering

  Through woven bonds, not blood alone, we start:  
  **We make each other real in shared regard.**  
  This fragile art begins within the heart,  

  But not as something privately stored.  
  The exile's plea, the silenced voice, the scarred –  
  Through woven bonds, not blood alone, we start  

  To understand the self is counterpart  
  To how the group bestows what it holds barred.  
  **We make each other real in shared regard,**  

  Yet feel the weight when welcome lines depart.  
  Is personhood a gift, or standing guard?  
  Through woven bonds, not blood alone, we start  

  To see the claim: *Respond!* That inward spark,  
  That turn towards the other, breaks the yard –  
  **We make each other real in shared regard,**  

  But also makes the *I* resist the mart  
  Where "we" demands submission, stone and scarred.  
  Through woven bonds, not blood alone, we start  
  **I answer back to make the we less hard.**  

  The power held within the ties that bind –  
  To grant the face, or cast the soul apart –  
  **We make each other real in shared regard,**  
  **I answer back to make the we less hard.**

  Summary: The adjacent refrains in the closing quatrain enact the unresolved tension between constitutive relationality demanding ethical response and the community's latent power to withhold recognition that grounds the very demand.
