  ### Drug Policy Decision Tree  
  This tree starts from shared commitments: prohibition creates violent black markets, and criminal penalties for personal possession are disproportionate. It branches through conceptual questions to distinct policy positions. Answer each node without reference to labels; positions emerge from combinations.  

  ---

  #### **Node 1: What is the *primary wrong* of recreational drug use?**  
  - **A.** The use itself (health risks, addiction, moral decay).  
  - **B.** The purchase/sale within violent black markets.  
  - **C.** The state’s coercive restriction of individual choice.  
  - **D.** The risk of third-party harms (e.g., sales to minors, impaired driving).  

  #### **Node 2: What is the *core goal* of policy?**  
  - **A.** Reduce prevalence of use (even if collateral harms rise).  
  - **B.** Reduce total harm (accepting some use if violence/oversight decline).  
  - **C.** Maximize autonomy (minimize state interference).  

  #### **Node 3: How should the state treat *possessors*?**  
  - **A.** Redirect to health services (mandatory or voluntary).  
  - **B.** Ignore or deprioritize enforcement (decriminalize *de facto* or *de jure*).  
  - **C.** Protect as a liberty interest (no penalties).  

  #### **Node 4: How should the state treat *low-level sellers*?**  
  - **A.** Arrest and prosecute (maintain prohibition on supply).  
  - **B.** Divert to health/job services (decriminalize or administratively penalize).  
  - **C.** Permit under regulation (legalize with oversight).  
  - **D.** Protect as a liberty/market activity (no special restrictions).  

  #### **Node 5: What market structure should *legal supply* adopt?**  
  - **A.** Non-commercial only (home cultivation, co-ops, gifting).  
  - **B.** State monopoly (state-run stores, production control).  
  - **C.** Licensed private retail (branded, profit-seeking).  
  - **D.** Medicalization only (pharmacies, prescriptions).  

  #### **Node 6: Should policy include *corrective justice* measures?**  
  - **A.** Yes (expungement, licensing preferences for affected communities).  
  - **B.** No (focus on forward-looking rules).  

  ---

  ### Leaf Positions (8 Leaves)  
  *Answers format: (Node1, Node2, Node3, Node4, Node5, Node6)*  

  1. **Portugal-Style Public Health Decriminalizer**  
     (A, B, A, B, N/A, B)  
     - **Awkward commitment:** Tolerates black markets for supply while aggressively treating users.  
     - *Path:* 1A→2B→3A→4B→(5 skipped; no legal supply)→6B.  

  2. **Harm-Reductionist Indifferent**  
     (B, B, B, B or C, B or C, B)  
     - **Awkward commitment:** Ambivalent on market structures if harm reduction is identical.  
     - *Path:* 1B→2B→3B→4B/4C→5B/5C→6B.  
     - *Note:* Unable to separate from some legalizers if empirical harm data matches.  

  3. **Medicalizer**  
     (A, A, A, A, D, B)  
     - **Awkward commitment:** Denies recreational autonomy even when medical use is identical.  
     - *Path:* 1A→2A→3A→4A→5D→6B.  

  4. **State-Monopoly Legalizer**  
     (B, B, C, C, B, A or B)  
     - **Awkward commitment:** Grants state exclusive right to profit from a "harmful" activity.  
     - *Path:* 1B→2B→3C→4C→5B→6A/6B.  

  5. **Libertarian Legalizer**  
     (C, C, C, D, C, B)  
     - **Awkward commitment:** Permits commercial marketing of substances it views as dangerous.  
     - *Path:* 1C→2C→3C→4D→5C→6B.  

  6. **Commercial Legalizer**  
     (B, B, C, C, C, B)  
     - **Awkward commitment:** Allows corporate branding to reduce violence, risking increased use.  
     - *Path:* 1B→2B→3C→4C→5C→6B.  

  7. **Social-Justice Legalizer**  
     (B or D, B, C, C, A/B/C, A)  
     - **Awkward commitment:** Balances reparations with risk of commercializing drugs in vulnerable communities.  
     - *Path:* 1B/1D→2B→3C→4C→5A/B/C→6A.  

  8. **Non-Commercial Autonomist**  
     (C, C, C, C, A, B)  
