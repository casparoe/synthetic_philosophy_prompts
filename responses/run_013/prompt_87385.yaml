prompt: |-
  I am a PhD student working on health law and the graduate member of my university hospital's ethics committee. We are drafting the policy that determines when a patient's earlier written wishes about treatment take precedence over what the patient says in the moment, and nearly every case we see is a slow decline: nothing changes from one day to the next that anyone could point to, yet after a year the same patient plainly can no longer weigh the options. The committee keeps splitting on where to put the switchover. One member insists on a constraint: whatever rule we adopt, no single day's change, however small, may ever be what flips the verdict; otherwise something trivial is deciding something enormous. Another concedes the constraint in theory but argues that the hospital must act as though there is a definite answer in every case, and that a clear policy is worth more than a well-founded one. A third wants to leave the matter to the treating team's judgment, which I suspect only relocates the difficulty. I have to bring a recommendation to the committee next month, and I would like help seeing what this disagreement is really about and what I should actually propose. I am also uneasy that any criterion we write down, for instance that the patient can no longer appreciate the consequences, will itself need a boundary, and I cannot tell whether that is a genuine problem or merely my nerves.
reasoning: |-
  Okay, this is a complex and high-stakes ethical dilemma presented by a PhD student in health law who's also on a hospital ethics committee. The core problem revolves around determining when a patient's prior written directives should override their current expressed wishes, particularly in cases of slow cognitive decline where there's no clear tipping point. 

  First, I need to unpack the committee's different positions carefully. There's one member obsessed with avoiding a "single-day flip" scenario - that's clearly a philosophical stance against arbitrariness. Another prioritizes operational clarity over theoretical perfection, which makes practical sense in a hospital setting. The third advocating for clinical judgment is tempting but just kicks the can down the road. And the user themselves is wrestling with the Sorites paradox aspect - how to define thresholds for capacity that inevitably have gray zones.

  Hmm... what's really at stake here beneath the surface? It's not just about policy language - it's about:
  - Temporal identity (is the "then-self" more authentic than the "now-self"?)
  - Institutional risk tolerance 
  - The very definition of autonomy when cognition erodes gradually
  - Whether we can avoid value judgments in capacity assessments

  The user's unease about boundaries is profound - they're recognizing that any criterion like "appreciating consequences" will have borderline cases. That's not nerves; that's an accurate read of the philosophical problem. Wittgenstein's "family resemblances" concept might actually be useful here - capacity isn't a single switch but clusters of abilities.

  For the recommendation... I should avoid false precision. Maybe propose a two-part framework:
  1) A clear procedural pathway (like mandatory ethics consult at certain triggers) 
  2) A substantive test focusing on narrative coherence rather than discrete capacities

  The "no single day" concern is mathematically sound but operationally impossible. Better to acknowledge it directly in the policy preamble - that this is about reasonable judgment, not pinpoint accuracy. 

  Also worth emphasizing: this policy should require documenting the reasoning, not just the decision. That creates accountability without pretending to eliminate subjectivity. 

  The user's dual role as academic and committee member is key - they need something philosophically defensible but also clinically usable. The solution might lie in making the process robust rather than the definition perfect.
answer: |-
  Your committee is grappling with fundamental tensions in autonomy, continuity of self, and the limits of policy in clinical ethics. Here's a breakdown of the core disagreements and a proposed approach for your recommendation:

  ### What the Disagreement Is Really About:
  1.  **The Threshold Problem (Sorites Paradox):** You've perfectly identified the core philosophical dilemma – how to define a meaningful threshold in a continuous, imperceptible decline ("heap of sand" paradox). *No bright line will be philosophically airtight.*
  2.  **Epistemology vs. Praxis:** The first member prioritizes logical consistency (no single-day flip), while the second prioritizes practical actionability (definite answer needed). This is a tension between theoretical purity and operational necessity.
  3.  **Locus of Decision-Making:** The third member shifts the burden to clinicians, acknowledging the need for context but risking inconsistency and placing heavy responsibility on front-line staff who may lack time or expertise.
  4.  **Defining "Authentic Self":** Underlying this is the question: *Which version of the patient holds moral authority?* The prior competent self who feared future incapacity, or the current self experiencing it? Slow decline makes this profoundly ambiguous.
  5.  **Risk Tolerance:** The committee is implicitly disagreeing on which error is worse: overriding current wishes based on potentially outdated directives (violating present autonomy) vs. ignoring prior directives due to current impairment (violating past autonomy/potential suffering).

  ### Addressing Your Unease: The Boundary Problem
  Your unease is **absolutely valid, not merely nerves.** Any criterion (e.g., "appreciate consequences") will have borderline cases. This is inherent in applying abstract concepts to complex, continuous realities. The key is to:
  1.  **Acknowledge the Gray Zone Explicitly:** State in the policy that capacity exists on a spectrum and borderline cases are expected.
  2.  **Focus on Process, Not Just Definition:** Shift emphasis *from* finding a magic-bullet criterion *to* establishing a robust, fair *process* for making difficult judgments in the gray zone.
  3.  **Multi-Factor Assessment:** Use criteria as *components* of a holistic assessment, not binary pass/fail tests.

  ### Recommendation: A Process-Oriented Framework
  Propose a policy that combines clear triggers, structured assessment, mandatory review, and ethical guidance, *accepting* that the boundary is fuzzy:

  1.  **Triggering the Assessment:**
      *   A *significant change* in the patient's cognitive/functional status *or* a *direct conflict* between current refusal/request and a prior directive.
      *   Define "significant change" functionally (e.g., new inability to manage medications, recognize family, understand basic health information) rather than by diagnosis or time. Avoid daily comparisons; look for *meaningful functional decline* impacting medical reasoning.
      *   **Addresses "No Single Day" Concern:** Focuses on *meaningful* functional shifts, not microscopic daily changes. A single day's change shouldn't trigger reassessment; a *pattern* or *clear functional loss* does.

  2.  **Structured Capacity Assessment (Focusing on the *Specific Decision*):**
      *   Mandate use of a validated tool (e.g., MacArthur Competence Assessment Tool for Treatment (MacCAT-T)) adapted for the specific treatment decision in question.
      *   Require assessment of the **Four Abilities:**
          *   **Understand** relevant information (diagnosis, prognosis, treatment options, risks/benefits).
          *   **Appreciate** the significance of that information *for their own situation*.
          *   **Reason** about options (weigh risks/benefits consistently with values).
          *   **Communicate** a choice.
      *   **Documentation Requirement:** Explicit documentation of *how* the current assessment relates to the reasoning/values expressed in the prior directive. Does the current refusal reflect a *misunderstanding* of their situation, an *inability to appreciate* consequences, or a *genuine change in values* despite capacity?

  3.  **Mandatory Ethics Committee Consult for Gray Zones/Borderline Cases/Conflict:**
      *   Triggered by: Inconclusive capacity assessment, significant conflict between prior directive and current wishes, conflict among team/family, or cases where the "authentic self" is highly ambiguous.
      *   **Addresses "Clear Policy" and "Clinical Judgment" Concerns:** Provides a definite pathway (policy) while utilizing nuanced ethical deliberation (judgment) in the hardest cases. It centralizes the difficulty ethically rather than leaving it solely with the treating team.

  4.  **Decision-Making Hierarchy (Prioritizing Process):**
      *   **Clear Incapacity:** If assessment shows inability to meet the four abilities *for the specific decision*, the prior written directive governs.
      *   **Clear Capacity + Consistent Values:** Current wishes govern, even if they contradict the prior directive (patient can revoke).
      *   **Borderline Capacity / Ambiguous Authenticity / Value Shift:** **This is the critical zone.**
          *   The prior directive carries significant weight as evidence of deeply held values.
          *   *However*, strong presumption is given to current expressions *if* they demonstrate understanding/appreciation and appear consistent *or* reflect a reasoned value shift *not* solely attributable to impairment.
          *   **Requires Ethics Committee Consultation:** The committee's role is to weigh the evidence of authentic past vs. present self, the nature of the impairment, the risks of suffering, and the patient's current well-being. They provide a recommendation, not just a capacity verdict.
          *   **Standard of Proof:** Apply a "clear and convincing evidence" standard to override the *current* expressed wish based on prior directives in borderline cases. Is it *highly probable* the current refusal stems from impairment, not a competent value shift?

  5.  **Policy Foundations & Acknowledgment:**
      *   **Explicitly State the Challenge:** Begin the policy by acknowledging the difficulty of slow decline and the lack of perfect boundaries. Frame it as supporting patient autonomy across time.
      *   **Focus on Patient Values:** The core aim is honoring the patient's *deepest values and goals*, whether expressed in the past or present. Assessments and consultations should actively seek to identify these.
      *   **Documentation & Review:** Mandate thorough documentation of assessments, consultations, and rationales. Build in periodic policy review based on case experience.

  ### Why This Approach?
  *   **Balances Competing Concerns:** Provides structure (praxis) while acknowledging gray areas (epistemology). Uses process (ethics consult) to handle the hardest cases where judgment is unavoidable.
  *   **Mitigates "Single-Day Flip":** By focusing on *functional significance* for triggering assessment and using multi-factor deliberation for decisions, it avoids reliance on trivial daily changes.
  *   **Respects Clinicians but Provides Support:** Treating teams conduct initial assessments but aren't left alone with borderline cases – ethics support is mandated.
  *   **Addresses the Boundary Problem:** Accepts it exists and creates a transparent, deliberative process for navigating it, rather than pretending a simple criterion solves it.
  *   **Prioritizes Patient Narrative:** Forces explicit consideration of the connection (or disconnect) between past and present expressions of values.

  **Your Role:** Frame this recommendation by emphasizing that the goal isn't to eliminate all ambiguity (impossible), but to create the fairest, most transparent, and values-focused *process* for navigating the inherent ambiguity of slow cognitive decline and respecting autonomy over time. Highlight that the mandatory ethics consult in borderline cases *is* the practical mechanism for providing the "definite answer" required for action, reached through structured deliberation rather than arbitrary lines or isolated clinical judgment. Your unease about boundaries is a strength – use it to argue for a policy that confronts this reality head-on with a robust process.
