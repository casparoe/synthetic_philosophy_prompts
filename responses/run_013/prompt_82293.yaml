answer: |-
  ### Episode
  In crystallomorphic dynamics, Program Vortex's hard core asserts that crystalline structures minimize perimeter under force-field constraints, while Program Symmetry's core demands maximized rotational symmetry. When tetrahedral anomalies appear in Quadrant Q's non-Euclidean field (where both programs previously succeeded), Vortex's adherents add protective belt hypothesis Hv: "Q's field contains unobservable micro-vortices that locally inflate perimeter minima." This accommodates the anomaly but predicts nothing beyond it. Symmetry's followers introduce Hs: "Q's field has embedded icosahedral phase-spaces," predicting novel stress-fracture angles in adjacent Quadrant R. At T1, Hs is uncorroborated; by T2, R-experiments corroborate the angles. Crucially, the Q-anomaly's full dataset was public *before* Symmetry's inception, though its implications were unexplored.

  ### Appraisal  
  **Program Vortex**  
  - T1: Degenerating. Hv accommodates the Q-anomaly (known at T1) with no corroborable excess content (negative heuristic: shield perimeter-minimization; belt: Hv).  
  - T2: Still degenerating (same verdict), yet rational to persist. Why? Symmetry's corroboration is suspect (see below), leaving Vortex the only core explaining *older* anomalies.  

  **Program Symmetry**  
  - T1: Progressive. Hs predicts *new* fracture angles in R (excess content), uncorroborated but testable (positive heuristic: extend symmetry-maximization; belt: Hs).  
  - T2: Still progressive (Hs corroborated), but corroboration is devalued. The Q-anomaly (used retroactively to *motivate* Hs) was public pre-inception, so Hs's "novelty" is arguably accommodation in disguise.  

  ### Load-Bearing Variable  
  **Whether the Q-anomaly dataset was public *before* Symmetry's inception.**  
  - **Actual case:** Q-data public pre-Symmetry. → Vortex degenerating but rational; Symmetry progressive but corroboration suspect.  
  - **Altered case:** Q-data discovered *after* Symmetry's inception. → **Verdicts flip:**  
    - Vortex: Now *progressive* at T2 if Hv predicts new content (e.g., micro-vortex signatures). Its accommodation at T1 was of a *new* anomaly.  
    - Symmetry: *Degenerating* at T1. Hs accommodates Q (now a *new* anomaly) without excess content; R-prediction is unrelated.  

  ### Rival Defusals  
  - **Popperian:** Rejects Lakatos's temporal tolerance. Symmetry's R-prediction *is* novel (Q-data wasn't *used* in Hs's construction), so corroboration counts fully. Vortex should be abandoned for *post hoc* accommodation with no risks.  
  - **Feyerabendian:** Mocks the "public data" distinction as arbitrary methodology-worship. Symmetry's success in R *proves* its fertility, regardless of Q's history; Vortex persists only due to dogmatic "rationality" rules.  

  ### What the Case Is Of  
  This is a case of **temporally embedded novelty-assessment**, demonstrating that Lakatosian progress/degeneracy verdicts depend critically on the *historical sequence of problem-contexts* available to a programme, not just its predictive outputs. It shows why a "degenerating" programme may rationally persist when a rival's "progress" relies on retroactive reconstructions of anomaly-space—a nuance absent in textbook cases where novelty is unambiguous.
