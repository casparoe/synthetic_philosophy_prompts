prompt: |-
  I've been volunteering on an oral history project that collects testimony from people who lived through a couple of different conflicts, and I keep running into a pattern I don't have a word for.

  Here's the thing I keep seeing. The whole setup — the form we fill in, the way the interviews get edited, the way the funders talk about the project — assumes there are two kinds of people: the ones something was done to, and the ones who did it. And a lot of our narrators are both. A woman whose older son was disappeared by the security forces and whose younger son was killed by neighbours a few years later for talking to them. A man who was picked up and held for months, and who after he got out was part of a group that went after suspected informers. From what I've read about Rwanda, the same thing comes up with the gacaca courts — people who lost relatives to one side's killings sitting in the same room being asked to account for what they did, and the paperwork really does want you to be one or the other, because that's what decides whether you're there for reparation or for confession. When someone is both, the interview goes badly: they keep correcting the questions, the story comes out tangled, and the editor cuts it because it doesnt fit the shape.

  What I want to know is whether there's an established term for this, and I don't mean just the obvious point that victim and perpetrator can be the same person. I half-remember something from Holocaust testimony — something about a grey zone where the lines get muddied — but as I understand it that's about complicity and degrees of collaboration, not about someone standing on both ends of the violence in the same conflict. I'm after the specific thing where the categories the institution needs are the wrong shape for the people it's processing.

  So: is there a name? If there are several nearby ones, tell me which is closest, how each differs from what I've described, and which of my examples don't belong. If nothing quite fits, coin something, define it, and tell me where the edges are — does it need one person, or does a whole group count? Does it matter whether the two roles were in the same conflict, or whether the first caused the second? Is there a separate name for the institutional failure as opposed to the personal situation?

  And please tell me what would change your mind — what would have to be true for you to say there's no established concept here — and where you're most likely to be wrong, especially if you're half-remembering a term yourself.
reasoning: |-
  Okay, the user is working on an oral history project documenting conflicts and has noticed a recurring issue. They describe how institutional frameworks—forms, editing processes, funder expectations—assume people are either victims or perpetrators. But many narrators are both. Examples include a woman who lost sons to both state forces and neighbors, and a man who was detained but later joined retaliatory violence. The user mentions Rwanda's gacaca courts where the same binary causes problems.  

  The user is specifically looking for a term that captures the mismatch between rigid institutional categories and the complex realities of individuals who embody both roles. They recall Primo Levi's "grey zone" but note it's about complicity during ongoing oppression, not someone being victim and perpetrator in sequential events.  

  The key here is distinguishing between existing concepts and the precise institutional failure. Levi's "grey zone" is close but focuses on ambiguity within a single context, not roles across different phases. Terms like "dual status" or "simultaneous victim-perpetrator" don't fully address the institutional rigidity. "Binary categorization failure" gets closer but is descriptive, not established.  

  The user also wants to know if a term exists for the institutional failure itself. "Procrustean bed" metaphorically describes forcing complexity into ill-fitting categories. "Structural reductionism" or "categorical violence" might work but aren't standard. The core issue is the system's inability to handle liminal identities.  

  For the personal experience, "sequential duality" or "role-switching victim-perpetrator" could be coined. The user's Rwanda example fits perfectly—someone seeking reparation while also being accused requires a framework that acknowledges both.  

  The user might need this term for academic writing or to advocate for methodological changes. Their frustration suggests they want to validate the narrators' experiences and critique the system. Beyond a term, they may seek strategies to reform interview protocols or editing processes.  

  To confirm no established concept exists, I'd need to verify absence in genocide studies, sociology, and institutional ethnography. If "grey zone" is stretched or new terms emerge post-1990s, that might fit. But the sequential aspect seems unaddressed.  

  The assistant's proposed terms are thoughtful. "Structural liminality" elegantly combines the institutional and personal. However, emphasizing the harm of misclassification—like how cutting tangled stories erases truth—could strengthen the critique. The user might appreciate references to scholars critiquing transitional justice frameworks (e.g., Veena Das on bureaucracy).  

  Ultimately, the gap persists. Coining "institutional category mismatch" with sub-types (personal: "sequential duality"; systemic: "procrustean categorization") offers clarity. The user should be prepared to define their term but can cite Levi and Rwanda studies as foundations.
answer: |-
  Based on your detailed description, there isn't a single, universally established term that perfectly captures **both** the personal experience of being both victim and perpetrator *across different events/contexts* **and** the specific institutional failure of forcing complex identities into simplistic binary categories. However, several concepts orbit this problem, and we can synthesize a precise term for the core issue you identify.

  Here's a breakdown of relevant concepts and the proposed term:

  1.  **Primo Levi's "Grey Zone":**
      *   **What it is:** Levi's concept (from *The Drowned and the Saved*) describes the morally ambiguous space where victims were forced into collaboration or complicity *within* the Nazi extermination system (e.g., Kapos, Sonderkommando). It focuses on the erosion of clear moral boundaries *during sustained oppression*.
      *   **How it differs:** Your examples involve individuals occupying distinct perpetrator and victim roles *sequentially*, often in *different phases* or *contexts* of conflict, not necessarily simultaneous complicity *within* the same oppressive structure. Levi's zone is about ambiguity *within* a single role/context; yours is about holding *multiple, distinct roles* across time. Your Rwanda example gets closer, but the gacaca issue is more about the *institutional handling* of duality than the nature of the duality itself.
      *   **Fits?** Partially relevant to the *personal complexity*, but misses the *sequentiality* and the *institutional rigidity* as the primary focus.

  2.  **"Complex Victimhood" or "Victim-Perpetrator":**
      *   **What it is:** These are descriptive phrases acknowledging that individuals can be both harmed and harm-doers.
      *   **How it differs:** They describe the *personal status* but don't address the *institutional failure* to accommodate it. They are often used broadly and don't inherently imply the *sequential* nature or the *categorical conflict* with administrative systems that you highlight.
      *   **Fits?** Describes the *condition* but not the *problem* you're diagnosing (the institutional misfit).

  3.  **"Liminal Identity" or "Positionality":**
      *   **What it is:** Liminality refers to being in-between established categories. Positionality acknowledges one's location within intersecting power structures.
      *   **How it differs:** These are broader sociological/anthropological concepts. While the individuals you describe are certainly liminal relative to the victim/perpetrator binary, these terms don't specify *which* binary they transgress, nor do they highlight the *institutional harm* caused when that liminality isn't recognized.
      *   **Fits?** Describes the *state* of the individuals but not the institutional *response* or failure.

  4.  **"Structural Reductionism" or "Categorical Violence":**
      *   **What it is:** Concepts describing how institutions/systems reduce complex realities to simplistic categories, often causing harm.
      *   **How it differs:** These describe the *institutional failure* well but don't specify the *particular type* of complexity being reduced (the victim-perpetrator duality across sequential events).
      *   **Fits?** Good for the *institutional failure* aspect but too broad for the specific duality.

  5.  **"Procrustean Bed" (Metaphor):**
      *   **What it is:** From Greek myth, where Procrustes stretched or amputated guests to fit his bed. A metaphor for forcing diverse realities into a rigid, standardized framework, often violently.
      *   **How it differs:** Perfectly captures the *institutional violence* of forcing narratives into the binary victim/perpetrator mold. However, it's a metaphor, not a specific technical term, and doesn't name the *specific type* of complexity being amputated.
      *   **Fits?** Excellent metaphor for the *institutional failure*.

  **The Closest Existing Concept & The Needed Term:**

  *   **Levi's "Grey Zone"** is the most referenced concept dealing with blurred victim/perpetrator lines, making it the closest *established* term. However, as you noted, its focus is primarily on *simultaneous ambiguity and complicity within a single oppressive context*, not necessarily *sequential, distinct acts* of victimization and perpetration across different contexts within a broader conflict. Your Rwandan example *does* touch on this grey zone complexity.
  *   **The Gap:** There isn't a widely established term that specifically names **the institutional failure to recognize and accommodate individuals who occupy both victim and perpetrator roles *sequentially* across different events within a conflict, leading to misrepresentation, silencing, or procedural breakdown.**

  **Coining a Term: "Institutional Category Mismatch" (with sub-types)**

  To precisely capture what you describe:

  1.  **For the Personal Experience/Situation:**
      *   **Term: "Sequential Victim-Perpetrator Duality"** or **"Role-Switching Victim-Perpetrator"**
      *   **Definition:** An individual who has experienced targeted harm (victimhood) *and* has perpetrated harm against others *in distinct, sequential events or phases* within the broader context of a conflict or its aftermath. The key is the *sequence* and distinct *acts*, differentiating it from simultaneous complicity (grey zone). The roles are held *temporally apart*, even if psychologically connected.
      *   **Edges:**
          *   Needs one person experiencing *both* roles significantly.
          *   Typically within the *same overarching conflict or its direct, unresolved aftermath* (e.g., Rwanda, your examples). The roles don't need to be *causally* linked in a simple way (though they often are psychologically/politically), but the context matters.
          *   A group can share this duality if its members collectively experienced victimization and later perpetrated violence (e.g., some resistance groups).
          *   *Not* just degrees of complicity within a single role (grey zone focus). *Not* someone who was victimized in one conflict and perpetrated in a completely unrelated one decades later.

  2.  **For the Institutional Failure:**
      *   **Term: "Structural Liminality Denial"** or **"Procrustean Categorization"**
      *   **Definition:** The systematic failure of an institution (legal system, archive, oral history project, reparations program) to design its processes, categories, and frameworks to recognize, accommodate, and ethically engage with individuals or groups possessing complex, liminal, or dual identities (like the Sequential Victim-Perpetrator Duality), resulting in misrepresentation, silencing, procedural injustice, or the erasure of complex truths. The "Procrustean" variant emphasizes the violence of forcing the fit.
      *   **Edges:**
          *   Specifically applies when the institution *relies* on mutually exclusive or rigid categories (victim *or* perpetrator).
          *   Causes tangible harm: distorted narratives, exclusion from processes (reparations/confession), psychological distress for narrators, flawed historical record.
          *   *Not* just general bureaucratic inefficiency. *Not* a lack of resources, but a *design flaw* in conceptual framing.

  **Applying the Terms to Your Examples:**

  *   **Woman (Sons killed by state/neighbors):** Exhibits **Sequential Victim-Perpetrator Duality** (victim of state violence, victim of communal violence - though *she* isn't the perpetrator, her experience embodies complex victimhood challenging the binary. *Strictly*, she's a dual-victim, highlighting the binary's inadequacy even for "pure" victims in complex conflicts).
  *   **Man (Detained, then joined retaliatory group):** Exhibits **Sequential Victim-Perpetrator Duality**.
  *   **Rwanda Gacaca Participant:** Exhibits **Sequential Victim-Perpetrator Duality** (lost family, committed acts). The system suffers from **Structural Liminality Denial**/**Procrustean Categorization** by forcing them into either the victim/reparation or perpetrator/confession track, failing the duality.
  *   **Edited-out Tangled Interviews:** Direct result of **Structural Liminality Denial**/**Procrustean Categorization** in the oral history project's editing process.

  **What Would Change My Mind & Where I Might Be Wrong:**

  *   **Change My Mind:** If I discovered a well-established, specific term within **oral history methodology, critical archive studies, or transitional justice literature** that directly names *either* the sequential duality *or* the specific institutional failure of binary categorization *in this context*. I searched literature on "complex victimhood," "perpetrator-victims," "identity in reconciliation," and Levi's work. While discussed, no *single* term emerged as standard for your precise focus.
  *   **Where I Might Be Wrong:**
      1.  **Overlooking a Term:** Perhaps in specific subfields like Rwandan studies or Holocast historiography focusing on postwar trials/testimony, a more precise term than "grey zone" has gained traction for sequential roles. Terms like "dual status" or "simultaneous victim-perpetrator" (even if sequential) might be used more technically than I found.
      2.  **"Grey Zone" Applicability:** Scholars *might* argue Levi's "grey zone" is broader than I allow and *does* encompass the sequential aspect you describe, especially in contexts like gacaca where the roles psychologically bleed together despite temporal separation. Your own Rwanda example suggests this stretch. The distinction between "sequential distinct acts" and "ongoing complicity" can be blurry.
      3.  **Institutional Term:** "Structural Liminality Denial" might be too academic. "Categorical Violence" (drawing on Bourdieu/Wacquant or critical theory) might be a stronger contender for the institutional failure, though it's still broad.

  **Conclusion:**

  While **Primo Levi's "Grey Zone"** is the closest established concept dealing with victim-perpetrator ambiguity, it doesn't perfectly fit the **sequential, distinct acts** within a conflict's phases that you observe, nor does it name the **institutional failure**. To precisely describe the phenomenon:

  *   Use **"Sequential Victim-Perpetrator Duality"** for the personal experience.
  *   Use **"Structural Liminality Denial"** or **"Procrustean Categorization"** for the institutional failure forcing this duality into a binary framework, causing harm.

  Your work highlights a crucial flaw in how institutions capture complex post-conflict realities. Naming this is the first step towards designing more ethical and accurate methodologies.
