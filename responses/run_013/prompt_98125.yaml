answer: |-
  ## National Board of Aesthetic Testimony (NBAT)  
  **Official Guidance for the Borrowing and Lending of Aesthetic Justification**

  **Disclaimer:** The NBAT operates under the *Aesthetic Testimony Justification Act (Revised)*. Compliance is mandatory for licensed Justification Lenders (JL-1, JL-2) and Borrowers (JB). Unlicensed aesthetic testimony transmission is a violation carrying penalties up to mandatory re-education via exposure to derivative works.

  **1. What is the NBAT’s primary function?**  
  The NBAT licenses qualified individuals (Justification Lenders, Levels 1 & 2) to transfer epistemic warrant for aesthetic beliefs based on their direct, exemplary acquaintance with specific artworks. We regulate the secure transmission of this justification to licensed Borrowers (JBs), ensuring market stability and preventing epistemic inflation or justification collapse. Think of us as the FDIC for your aesthetic convictions.

  **2. Why is a first-person report (“I found it profoundly moving”) admissible for justification transfer, while a third-person verdict (“It *is* profoundly moving”) is summarily rejected?**  
  This distinction is foundational. The utterance “I found it profoundly moving” constitutes a *reliable phenomenological report* concerning the Lender’s own mental state during acquaintance. This is a legitimate datum, akin to reporting a sensory qualia (e.g., “The lemon tasted sour to me”). It provides defeasible, transferrable evidence *about the Lender’s experience*. The utterance “It *is* profoundly moving,” however, purports to be an *objective aesthetic property ascription*. Transmitting justification for such a claim requires demonstrating the Lender’s access to intersubjectively valid aesthetic facts – a capacity the NBAT deems non-transferrable via testimony alone. Verdictive statements are quarantined as Category-3 Non-Transferrables (CNT-3). Lenders attempting CNT-3 transmission risk license downgrade.

  **3. How does the NBAT adjudicate disagreements between two licensed Justification Lenders (JL-2) regarding the same artwork?**  
  Licensed JL-2s possess NBAT-certified capacities for discerning aesthetic properties and rendering reliable phenomenological reports. Disagreement between JL-2s triggers Protocol Δ (Delta).  
  *   **Phase 1:** Lenders submit Form A-7 ("Disputed Acquaintance Reconciliation"), detailing the specific aesthetic properties under contention (e.g., "graceful" vs. "merely slick," "earnestly melancholic" vs. "cloyingly sentimental") and the experiential grounds for their reports.  
  *   **Phase 2:** An NBAT Adjudicator (Level 5) reviews the filings and the work in question. If the disagreement stems from ambiguous properties or reasonable interpretive variance ("Affective Polyvalence"), both Lenders may retain certification, but their licenses are flagged with a "Contested Property" endorsement for that specific work. Borrowers are notified.  
  *   **Phase 3:** If the Adjudicator suspects *one* Lender exhibits faulty acquaintance (e.g., distraction, bias, unfamiliarity with the genre’s constitutive norms), a mandatory re-acquaintance session under NBAT observation is ordered. Persistent, irreconcilable disagreement on core properties may result in both licenses being suspended pending retraining or revocation for one or both parties. Resolution often involves prolonged exposure to the work in a neutral, beige room until consensus emerges or fatigue sets in.

  **4. What happens if a Borrower (JB) lacks firsthand acquaintance with the work in question? Can they still receive justification?**  
  Yes, but with critical restrictions. Borrowers *must* formally declare their lack of acquaintance on Form B-2 ("Acquaintance Status Affidavit") prior to any justification transfer. The received justification is then classified as a **Provisional Affective Warrant (PAW)**.  
  *   **PAW Status:** A PAW provides *defeasible, borrowed justification* sufficient for the JB to hold the belief (e.g., "Based on JL-2 Smith's report, I have good reason to believe *Symphony X* is likely to be profoundly moving *for someone with Smith's relevant sensitivities*").  
  *   **The Acquaintance Imperative:** Crucially, **PAWs are non-transferable and expire 60 days after issuance**. The *only* mechanism for converting a PAW into full, personal aesthetic justification (upgrading the JB's belief to "I find it profoundly moving" based on their *own* acquaintance) is for the JB to undergo firsthand acquaintance with the work within the 60-day window. Post-acquaintance, the JB must file Form C-4 ("Acquaintance Verification & Justification Conversion"). Failure to acquaint oneself voids the PAW; the borrowed justification evaporates, and the JB may not ethically assert the belief as their own. The NBAT emphasizes: Testimony can loan you the *ticket*; only acquaintance grants *admission*.

  **5. What is “Testimonial Escrow” and when is it used?**  
  Testimonial Escrow (TE) is a secure holding mechanism employed in high-value or complex justification transfers (e.g., justifying the sublime complexity of a late string quartet, or the nuanced subversion in a meta-modern novel).  
  *   **Process:** The Lender deposits the justification (their detailed phenomenological report and certified JL credentials) into a secure NBAT TE account.  
  *   **Release Conditions:** The justification is only released to the Borrower *upon confirmation of the Borrower's subsequent firsthand acquaintance* (verified via Form C-4).  
  *   **Purpose:** TE ensures the borrowed justification is *only utilized in the correct epistemic context* – immediately supporting the conversion of the Borrower's *post-acquaintance* experience into a justified belief. It prevents the JB from misusing the justification while still unacquainted (e.g., confidently debating the work's merits at a cocktail party). TE fees apply (Schedule 7-D).

  **6. Can I lend justification for *why* I had an experience, not just *that* I had it?**  
  Limitedly. Lenders (JL-2 only) may include *non-evaluative structural observations* believed to be causally linked to their experience (e.g., "The abrupt shift from minor to major at measure 42 coincided with my feeling of elation"). These are classified as "Causal Correlate Reports" (CCR). However, transmitting justification for *evaluative explanations* ("That shift *makes* the passage profoundly joyful") is strictly prohibited as it crosses into CNT-3 territory. CCRs are useful but carry lower justificatory weight than core phenomenological reports.

  **Seeking justification? Ensure your Lender is licensed. Transmitting insight? Do so responsibly.**  
  The integrity of the aesthetic belief economy depends on it.

  Sincerely,  
  **Dr. Alistair Finch**  
  Director, National Board of Aesthetic Testimony  
  *"Veritas per Acqualitas"*
