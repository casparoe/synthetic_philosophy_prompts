prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've been asked to run a session for our office ideas club: about twenty people, mostly engineers, one ninety-minute slot. My topic is futarchy — the proposal that a group should first settle on the outcome it wants, expressed as a single measurable welfare metric, and then let prediction markets rather than a second vote decide which policy to adopt, on the grounds that votes are the right way to fix ends while markets are better at aggregating information about means. I find the idea genuinely seductive and I suspect I'm being seduced for the wrong reasons, so I want a session in which the group feels both the attraction and the snag for themselves rather than hearing me explain either.

  Please design the activity: the rules, the materials, a minute-by-minute timeline for the ninety minutes, a payoff scheme that runs on play money or points rather than real cash, and a debrief. Build it so the group actually operates a miniature futarchy rather than discussing one — they should have to settle the metric by some non-market procedure, then price two conditional markets (what the metric will look like if policy A is adopted, and what it will look like if policy B is adopted), with the decision rule being simply to adopt whichever conditional price comes out higher. Two wrinkles I want designed in, because they are where I think the proposal gets interesting rather than merely clever. First, include one candidate policy that would itself change how the metric is defined or measured, so that the clean division between ends and means is strained by something concrete the group has to argue about, not by a lecture from me. Second, give one participant a conspicuously larger budget and a private stake in the outcome, so the group has to work out afterwards whether what moved the price was information or manipulation — and make sure the rules leave that genuinely ambiguous.

  The debrief should map specific moments in the activity onto parts of the idea: what the two conditional markets were each supposed to capture, where the metric-setting step smuggled in a value judgement that no market could have priced, and what the group's own trading behaviour does and does not show about the mechanism's real-world prospects. Tell me what will predictably go wrong the first time I run it and how to handle each failure, and be honest about which feature of futarchy the activity cannot reproduce at this scale and which I will therefore have to supply myself in the closing discussion.

  Finally, wherever the debrief touches on whether the mechanism actually works, I want the claims separated into those that are settled and those that are genuinely contested among people who study prediction markets and social choice, with nothing contested presented to my group as the consensus. I'd rather they leave with an accurate sense of the open questions than with a tidy verdict.
reasoning: |-
  We are designing a 90-minute session for an ideas club, mostly engineers, to experience futarchy through a simulation. The session should have participants set a welfare metric, then use prediction markets to decide between two policies. We need two wrinkles: 
    1. One policy should change how the metric is defined or measured, straining the ends/means division.
    2. One participant gets a larger budget and a private stake to create ambiguity about market manipulation.

  The activity will have:
    - A non-market procedure to set the welfare metric.
    - Two conditional prediction markets: "What will the metric be if we adopt Policy A?" and "What will the metric be if we adopt Policy B?"
    - The decision rule: adopt the policy with the higher conditional market price.

  We'll use play money. The debrief should map the activity to the theory, highlight the wrinkle about the metric-changing policy and the large trader, and separate settled from contested claims.

  Structure:
    1. Introduction (5 min)
    2. Setting the welfare metric (15 min)
    3. Explanation of policies and markets (10 min)
    4. Trading in the two conditional markets (30 min)
    5. Market close and policy decision (5 min)
    6. Debrief (25 min)

  Materials:
    - Flip chart or whiteboard for metric setting and recording.
    - Play money (e.g., printed denominations).
    - Trading platform: could be as simple as two physical markets (two boards) where participants post buy/sell orders manually, or we can use a simple digital tool if available. Given the setting and time, we'll design a low-tech version.
    - Two policies described on handouts.

  Detailed Timeline:

  0-5 min: Introduction
    - Explain futarchy in one minute: "We vote on values, bet on beliefs."
    - Set up the scenario: "Today we are the governing body of a small island nation. We must decide between two policies. We will first set our welfare metric, then run two prediction markets to see what each policy would do to that metric, and then adopt the one with the better prediction."
    - Outline the steps.

  5-20 min: Setting the welfare metric
    - The group must agree on a single measurable welfare metric for their nation. Examples: GDP, average life satisfaction (0-10), environmental health index, etc.
    - Wrinkle: One of the two policies (Policy B) will change how this metric is measured. But do not reveal this yet.
    - Process: 
        - Brainstorm metrics (5 min). Write them on the board.
        - Discuss and narrow down to one (5 min). 
        - Vote if necessary (5 min). 
    - Important: The facilitator should note that the metric must be measurable and quantifiable. But also, the group should be aware that the metric is a value judgment.

  20-30 min: Policy explanation and market setup
    - Present two policies (handouts or on board). 
        - Policy A: A standard policy, e.g., "Build a new bridge to connect the island's two main cities."
        - Policy B: The wrinkle policy, e.g., "Adopt a new well-being index that includes environmental factors and mental health, and simultaneously launch a public mental health campaign." This policy changes the metric itself. 
    - Explain the prediction markets:
        - There will be two markets:
            Market A: "What will be the value of [agreed metric] one year from now if Policy A is adopted?"
            Market B: "What will be the value of [agreed metric] one year from now if Policy B is adopted?"
        - The markets will trade in a security that pays out based on the actual metric value one year from now (in the simulation, we will not wait a year; we will reveal the outcome at the end based on a predetermined scenario, but traders don't know that yet).
        - However, note: for Policy B, the metric itself is being redefined. So if the group chose "average life satisfaction", then Policy B might change the survey method. The market for Policy B must predict the new metric's value.
    - Trading rules: 
        - Each participant gets an initial endowment of play money (e.g., $1000). 
        - One participant (chosen secretly) gets $5000 and a private stake: they are told that if Policy B is adopted, they will personally gain an extra $1000 (real or symbolic) because they own a company that benefits from the policy. They are instructed to try to make Policy B win without being obvious. (This instruction is given privately on a slip of paper.)
        - Trading will be open for 30 minutes. Participants can buy and sell shares in both markets. Each share in Market A is a contract that pays $1 for every unit of the metric under Policy A. Similarly for Market B.
        - The market price at the close will be taken as the predicted value of the metric under that policy.
        - The policy with the higher market price (i.e., the higher predicted metric) will be adopted.

  30-60 min: Trading
    - Set up two physical markets: two flip charts or whiteboards. 
        - For each market, participants can write their buy or sell orders (e.g., "Buy 10 shares of Market A at $20 per share" or "Sell 5 shares of Market B at $25 per share"). 
        - Others can take the opposite side. 
        - The facilitator (or an assistant) helps match orders and update the current market price (the last traded price) for each market.
    - Alternatively, if possible, use a simple digital platform that allows two prediction markets (like a Google Sheet with a script, or a free prediction market tool). But given the time, we'll assume low-tech.
    - The large trader (with $5000) will try to push up the price in Market B without being too obvious.

  60-65 min: Market close and policy decision
    - Close the markets. 
    - Record the last traded price (or volume-weighted average of last few trades) for each market.
    - Compare: if Market A price > Market B price, adopt Policy A; else adopt Policy B.
    - Announce the adopted policy.

  65-90 min: Debrief
    - Structure the debrief:
        a. What happened? Recap the metric, the policies, the trading, and the outcome.
        b. The wrinkle: Policy B changed the metric. How did that affect the markets? 
            - Point: The market for Policy B was predicting a different metric (the new one) than the market for Policy A (the old one). But the decision rule treated them as the same. Is that valid?
            - This strains the ends/means division: the metric was supposed to be the "end", but Policy B changed the end. The group set the metric by a non-market procedure, but then the market had to price a moving target.
        c. The large trader: 
            - Reveal that one trader had a large budget and a private stake. 
            - Ask the group: did anyone notice unusual activity? What effect did it have? 
            - How do we know if the price reflected information or manipulation? (Note: In real futarchy, manipulation is a risk.)
        d. Mapping to theory:
            - The two markets were supposed to capture the expected outcome of each policy. But note: the conditional market price is not just the expected value; in theory, it should aggregate information about the policy's effect.
            - The metric-setting step: highlight that the choice of metric involved value judgments (e.g., what aspects of welfare to include) that the market could not price. The market only predicts the number, not whether that number is the right goal.
        e. Trading behavior: 
            - What does it show about futarchy? 
            - Did the market price reflect the group's true beliefs? 
            - Note: In a small group, the market may not be efficient. In real prediction markets with many traders, they are often efficient, but not always.
        f. Settled vs. contested:
            - Settled: Prediction markets can aggregate dispersed information. They often outperform polls or experts in forecasting. (Cite examples: election markets, company forecasts.)
            - Contested: 
               - Whether manipulation is a serious problem in well-designed markets (some evidence that it's hard to manipulate, but not impossible).
               - Whether the metric can be defined without controversy (the "ends" are often multidimensional and hard to capture in one metric).
               - Whether the conditional markets would work for complex policies (especially when policies interact or have long-term effects).
               - Whether the mechanism can avoid the problem of the metric being gamed (if the metric is GDP, people might boost GDP in harmful ways).

  Predictable problems and solutions:
    - Problem: The metric-setting discussion takes too long.
        Solution: Allocate only 15 minutes and be ready to push for a vote.

    - Problem: Trading is chaotic with physical markets.
        Solution: Have an assistant help manage the order boards. Or use a digital tool if possible. Alternatively, simplify: let participants trade with the facilitator acting as a market maker (setting bid and ask prices and adjusting based on orders).

    - Problem: The large trader is too obvious or not effective.
        Solution: Choose a participant who is naturally active. Privately encourage them to trade in bursts and to sometimes trade in the other market to disguise.

    - Problem: The outcome of the metric (after a year) is not known, so the contracts can't be settled. 
        Solution: In the simulation, the facilitator will have predetermined outcomes for each policy (based on a hidden scenario). But during the debrief, reveal that in reality, we'd have to wait. For the activity, we can reveal the outcomes (e.g., on a handout) to see if the market was right. However, note: the point is the market price at the time of decision, not the eventual outcome. So we don't need to settle the contracts. We just use the prices to make the decision.

    - Problem: The group gets stuck on the fact that Policy B changes the metric. 
        Solution: During the policy explanation, be clear that the market for Policy B is predicting the value under the new metric. The debrief will address why this is problematic.

  Feature that cannot be reproduced at this scale:
    - The wisdom of crowds: In a small group (20 people), the market may not aggregate information as well as in a large market. Also, the large trader has disproportionate influence. In real futarchy, markets would be open to the public and larger. So we have to note that the activity is a microcosm and may not reflect the efficiency of real markets.

  Closing discussion: The facilitator should point out that futarchy is an intriguing idea but faces challenges, especially in defining the metric and ensuring market integrity. The activity shows both the potential (using markets to aggregate information) and the pitfalls (manipulation, metric instability). The open questions remain, and it's an active area of research.

  Materials to prepare:
    - Handout with policies (Policy A and Policy B).
    - Play money: $1000 for each participant except one who gets $5000 and a secret note.
    - Two flip charts/whiteboards for the markets.
    - Markers and pens.
    - Timer.

  Let's write the policy descriptions and the secret note.

  Policy A: 
    "Build a new bridge: The government will invest in building a bridge between the two main cities. This is expected to reduce commute times, boost trade, and create construction jobs. However, it will require a tax increase and may cause some environmental disruption during construction."

  Policy B (the wrinkle):
    "Revise the well-being metric and launch mental health campaign: The government will adopt a new well-being index that includes mental health and environmental factors (replacing the old metric). Simultaneously, we will launch a public mental health campaign that includes free counseling services and mental health days. This is expected to improve overall well-being as measured by the new index, but it may require reallocating funds from other programs."

  Secret note for the large trader:
    "You have been given extra money: $5000 in total (others have $1000). You have a personal stake: if Policy B is adopted, you will personally gain an extra $1000 (because you own a company that provides counseling services). Try to make Policy B win by buying shares in Market B to push up its price. But be careful not to be too obvious, or others might trade against you."

  Debrief Guide (for facilitator):

  1. Recap (5 min):
     - "We set our welfare metric: [state metric]. Then we had two policies: A (the bridge) and B (the new metric and mental health campaign). We ran two markets: Market A predicted the metric under A, Market B under B. The market prices were: A: $X, B: $Y. Therefore, we adopted Policy [A/B]."

  2. The metric-changing policy (5 min):
     - "Notice that Policy B changed the metric we were using. So Market B was predicting a different metric than Market A. But we treated them as comparable. What challenges does this pose? Does it break the futarchy idea? (The idea assumes the metric is fixed.)"

  3. The large trader (5 min):
     - "One of you had a larger budget and a private stake in Policy B. [Reveal who? Optional.] Did you notice unusual trading? How did it affect the market? Was it manipulation or just strong belief? In real futarchy, how can we guard against this?"

  4. Mapping to theory (5 min):
     - "The markets were supposed to aggregate our collective beliefs about the outcomes. But note: the metric we chose was a value judgment. The market couldn't tell us if we chose the right metric. Also, the trading we saw might reflect not just information but also attempts to manipulate or even just random noise. In a larger market, we hope the noise cancels and the information aggregates."

  5. Settled and contested (5 min):
     - Settled: "Prediction markets have been shown to be good at aggregating information in many contexts (like elections, sales forecasts). They often beat experts."
     - Contested: "But can they handle policy decisions? Some challenges: 
          - The metric might be gamed: if we define welfare by GDP, people might do things that boost GDP but harm other values.
          - The conditional markets might be thin (not enough trading) or manipulated.
          - Defining the metric without controversy is very hard: what is welfare? How do we measure it?
          - And note: our activity had a small group. Real futarchy would need big markets."

  6. Conclusion: "Futarchy is an idea that tries to use markets for what they are good at (aggregating information) and voting for what it's good at (values). But as we saw, the line between values and information can blur. And markets can be gamed. So it's an idea that's both exciting and challenging. I hope you leave with questions, not just answers."

  This design should achieve the goal: the group experiences the attraction (markets can aggregate information) and the snags (metric instability, manipulation) firsthand.
answer: |-
  ### Futarchy Simulation: Design for Office Ideas Club  
  **Goal:** Experience futarchy's appeal and pitfalls through active participation, focusing on two wrinkles: (1) a policy that alters the welfare metric itself, and (2) potential market manipulation.  

  ---

  ### **Materials**  
  1. **Play Money:**  
     - 19 participants: $1,000 each in "Futarchy Bucks" (FB).  
     - 1 participant (secretly chosen): $5,000 FB + **Private Stake Note** (see below).  
  2. **Policy Handouts:**  
     - **Policy A:** *Infrastructure Upgrade.* "Build a solar farm to reduce energy costs. Expected to boost short-term economic activity but requires upfront investment."  
     - **Policy B:** *Metric Redefinition.* "Shift welfare metric from GDP to a *Well-Being Index* (WBI) that prioritizes work-life balance. This policy includes mandatory 4-day workweeks."  
       *(Wrinkle: Policy B changes how welfare is measured, blending "ends" and "means.")*  
  3. **Market Boards:**  
     - Two whiteboards:  
       - **Market A:** "GDP/WBI if Policy A is adopted."  
       - **Market B:** "GDP/WBI if Policy B is adopted."  
     - Traders post buy/sell orders on boards (price/quantity).  
  4. **Private Stake Note:**  
     - Given to the $5k trader: *"If Policy B wins, you receive a $200 bonus. You own a consulting firm that profits from 4-day workweek policies. Push Market B’s price up subtly."*  

  ---

  ### **Timeline (90 Minutes)**  
  #### **0–10 min: Setup & Welfare Metric Definition**  
  - **Facilitator (You):** Briefly explain futarchy (2 min):  
    > "We vote on *what we want* (a welfare metric), then use markets to decide *how to get it* (policies). Markets aggregate information better than votes."  
  - **Activity: Define the Metric (8 min):**  
    - Brainstorm metrics (GDP, happiness, environment, etc.).  
    - Force a vote to choose **one metric**. Example: "GDP."  
    - **Wrinkle Setup:** Do *not* reveal Policy B changes the metric.  

  #### **10–20 min: Policy Introduction & Market Rules**  
  - **Policies:** Distribute handouts (5 min).  
    - Highlight: Policy B replaces GDP with WBI if adopted.  
  - **Market Rules (5 min):**  
    - Each market trades contracts paying **$1 FB per unit of the metric** (e.g., $1 per GDP point).  
    - **Decision Rule:** Policy with higher market price wins.  
    - Trading: Participants write orders on boards (e.g., "BUY 10 contracts @ $8" / "SELL 5 contracts @ $9").  
    - **Clarify:** Policy B’s market predicts WBI *if Policy B passes*—not GDP.  

  #### **20–50 min: Trading Session (30 min)**  
  - **Process:**  
    - Participants trade freely. You act as "market maker," matching orders and updating prices.  
    - **Large Trader:** Secretly signal the $5k participant to start trading early.  
  - **Key Dynamics:**  
    - Policy B’s market trades WBI, not GDP—creating ambiguity.  
    - Large trader buys Policy B contracts to inflate prices (subtly, per their note).  

  #### **50–55 min: Market Close & Policy Decision**  
  - Freeze boards. Record last traded price for each market.  
  - **Apply Decision Rule:** Adopt the policy with the higher price.  

  #### **55–65 min: Reveal Outcomes & Manipulation**  
  - **Outcome Scenario (Pre-written):**  
    - *If Policy A wins:* GDP = 105 (baseline: 100).  
    - *If Policy B wins:* WBI = 110 (incomparable to GDP).  
  - **Reveal:**  
    - Policy B altered the metric (GDP → WBI).  
    - Expose the large trader’s $5k budget and private stake.  

  #### **65–90 min: Debrief (25 min)**  
  **Guide the discussion using questions:**  
  1. **The Metric Wrinkle:**  
     - "Policy B changed our metric. Did Market B predict GDP or WBI? Could markets price this *without* our initial vote?"  
     - **Key Point:** The vote smuggled in a value judgment (e.g., "GDP = welfare"). Markets can’t question this—they only predict numbers.  

  2. **The Large Trader:**  
     - "Did anyone suspect manipulation? What’s the evidence for/against?"  
     - **Key Point:** Prices blend information and incentives. Was the high price in Market B due to:  
       - *Information* (traders believed WBI would rise)?  
       - *Manipulation* (large trader pushed prices)?  
     - **Design Ambiguity:** The large trader had a stake but also might have had valid beliefs.  

  3. **Trading Behavior vs. Real-World Futarchy:**  
     - "Did prices reflect group wisdom? What failed?"  
     - **Settled Science:**  
       - Prediction markets often aggregate information well (e.g., Iowa Election Markets).  
       - Small groups are vulnerable to manipulation (unlike large, liquid markets).  
     - **Genuinely Contested:**  
       - *Can markets separate information from manipulation?* (Evidence mixed; design-dependent.)  
       - *Can we define a welfare metric objectively?* (Philosophers/economists disagree—e.g., GDP vs. happiness.)  
       - *Are conditional markets reliable for complex policies?* (e.g., Policy B’s long-term effects were ignored.)  

  4. **The Big Picture:**  
     - "Futarchy seduces us by separating values (votes) and facts (markets). Did we achieve that?"  
     - **Unresolved Tension:** Policy B made "means" (4-day workweek) redefine "ends" (the metric).  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Metric Debate Runs Long:**  
     - *Fix:* Cap voting at 8 min. Use a "blind vote" if deadlocked.  

  2. **Trading Chaos:**  
     - *Fix:* Assign two "market assistants" to manage boards. Pre-print order slips.  

  3. **Large Trader Is Too Obvious:**  
     - *Fix:* Privately remind them: "Trade in both markets to hide your intent."  

  4. **Group Questions the Scenario:**  
     - *Fix:* Stress: "This is a simulation. Real futarchy would wait years for outcomes."  

  ---

  ### **What the Activity Can’t Replicate**  
  **Liquidity and Scale:**  
  - Real futarchy requires thousands of traders to reduce manipulation and improve information aggregation. In this small group, manipulation is easier, and prices may be noisy.  
  - **Closing Discussion Point:**  
    > "In theory, large markets *might* overcome manipulation. But our simulation shows how hard it is to separate values from facts—and how easily a single actor can distort prices. Futarchy’s promise hinges on scaling up and perfecting design... but its pitfalls might be fundamental."  

  **Handout: Policies**  
  ```  
  POLICY A: Infrastructure Upgrade  
  - Build a solar farm.  
  - Costs $1M; expected to raise GDP by 5% in 1 year.  
  - Metric: GDP (current definition).  

  POLICY B: Metric Redefinition  
  - Replace GDP with Well-Being Index (WBI): 50% GDP + 50% "work-life balance" survey.  
  - Enforce 4-day workweeks to boost WBI.  
  - Metric: WBI (if policy passes).  
  ```  

  **Outcome:** Participants leave understanding futarchy’s elegance *and* fragility—with no false consensus on its viability.
