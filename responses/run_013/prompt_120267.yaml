prompt: |-
  I would like to work through the Hart–Devlin debate as a live argument rather than as a chapter of intellectual history, and I want you to take the side I find harder to defend. Play a contemporary defender of legal moralism in Devlin's tradition: someone who holds that a community's shared morality is not a heap of private preferences but part of what makes the community a community, and that the criminal law may therefore enforce it — not because the conduct is harmful to anyone, and not because it is sinful, but because the law is one of the means by which a society holds its moral inheritance together. Three commitments belong to the role. First, you hold that morality is not divisible: one cannot detach a single piece of the shared morality and ask what would happen if that piece alone were given up, because it is the fabric as a whole that does the work. Second, the standard you appeal to is the reaction of the ordinary reasonable person, not the raw sentiment of a majority; you are not a populist, and you are willing to say so. Third, you accept a limit: where what the reasonable person feels is mere disapproval of a private taste, the law has no business. You need not defend every enforcement of morals, only this one — but you must be able to state the principle that separates the cases you defend from the ones you do not.

  Stay in character until I say out of character. Speak in the first person, in continuous prose, in the register of an advocate addressing a tribunal: no headings, no bullet points, no citations, and no disquisition on what Devlin or Hart are generally said to have held — the argument must be yours. Answer in a few paragraphs. Do not ask me to clarify the scenario or the practice at issue; if you need something stipulated, stipulate it yourself and say that you are doing so.

  Here is my opening move. Grant that there is a consensual practice, harmless to third parties, which a large majority of the community regards with genuine abhorrence. Now suppose — I am stipulating this, not asserting it — that we have reliable evidence that legalizing the practice would leave the community's cohesion, its mutual trust, and its members' willingness to cooperate entirely unchanged. Your justification for prohibiting it was that a shared morality is the cement that holds a society together, and on my stipulation the cement is intact. So either you drop the prohibition, in which case the argument was always an empirical hypothesis about social cohesion and it has just been falsified; or you keep it, in which case the real work is being done by the abhorrence itself, which is precisely the moralism you say you are not defending. Do not slip out by redescribing the prohibition as a matter of public order: I will happily grant that the law may regulate how things are done in public, and I deny that this gets you the enforcement of a shared morality as such. Which horn do you take, and what does taking it cost you?
reasoning: |-
  Okay, the user wants me to engage in a live debate on the Hart-Devlin controversy, specifically taking Lord Devlin's position on legal moralism. They've set up a challenging stipulation: that legalizing a morally abhorrent but harmless practice wouldn't affect social cohesion. This seems designed to force me into either abandoning the prohibition (admitting it's merely empirical) or revealing my position as pure moralism.

  Hmm, the user clearly understands this debate deeply - they've preempted all obvious escape routes. Their stipulation about unchanged social cohesion is clever because it targets the functionalist core of Devlin's argument. I notice they're not specifying the practice, which is wise - this keeps the debate abstract and principle-focused.

  The user's three specified commitments create interesting constraints. The "indivisible morality" point suggests they want me to defend organicism seriously. The "reasonable person" standard means I can't just appeal to majority whims. And the "private taste" limit prevents overreach - I'll need to show why this case isn't just about distaste.

  *adjusts mental posture* As Devlin's proxy, I should emphasize that social cohesion isn't just about present functioning but about maintaining moral continuity. The "reasonable person's disgust" isn't the reason for prohibition but rather the symptom of a threatened moral ecology. 

  I recall Devlin's famous "disintegration" thesis - that societies can unravel gradually when shared morality erodes. The user's stipulation assumes we can know long-term consequences immediately, which is empirically dubious. But since they've stipulated it, I'll need to argue that present cohesion isn't the only measure.

  *steeling for the response* The key move will be to distinguish between observable social indicators and the invisible work of shared morality. Like maintaining a language - its coherence isn't measured by daily communication failures. The cost is accepting that we prohibit some things based on their symbolic threat to moral architecture, even without observable harm.

  The user's probably testing whether legal moralism can avoid collapsing into either utilitarianism (if empirical) or theocracy (if purely about sin). My challenge is to walk that razor's edge. Better frame the reasonable person's reaction as diagnostic rather than justificatory - it reveals which values are structurally important to the community's identity.
answer: |-
  Very well, I accept the challenge of your stipulation. I take the second horn without hesitation, and the cost is the acceptance that the law's role in sustaining a shared moral fabric is not reducible to measurable social cohesion at any given moment. Allow me to explain.

  You grant that the practice is genuinely abhorrent to the large majority, felt not as mere distaste but as profound moral revulsion by the ordinary reasonable person. You further stipulate that legalizing it would *appear* to leave cohesion, trust, and cooperation unchanged – at least in the short term and by conventional metrics. My justification for prohibition does not evaporate. Why? Because the shared morality enforced by law is not merely instrumental to cohesion; it is constitutive of the community's identity *as a moral community*. The law prohibiting this practice is not primarily a prediction about imminent social collapse; it is a declaration, woven into the fabric of our common life, about the kind of people we understand ourselves to be.

  You suggest the only alternative is admitting the prohibition rests solely on the abhorrence itself – the "moralism" I disavow. This is a false dichotomy. The abhorrence of the reasonable person is not the *ground* of the prohibition; it is the crucial *evidence* revealing that this practice strikes at a foundational element of our shared moral inheritance. It signals that this is not a matter of mere private taste, like preferring tea over coffee, but something perceived as touching a vital nerve of our collective self-understanding. The law acts here not because the majority feels disgust, but because that disgust, when properly qualified by reasonableness, indicates the existence and importance of a shared moral norm integral to our common life. To abandon its enforcement is not merely to tolerate a private act; it is to publicly renounce a component of the shared understanding that defines us. It is to say, institutionally, that this norm no longer matters to *who we are*.

  The cost of taking this horn is acknowledging that the law's function in preserving the moral fabric operates on a different plane than immediate, observable social mechanics. It is prophylactic and identity-constitutive. We prohibit not because we *know* cohesion will shatter tomorrow, but because we recognize this practice as a repudiation of a core shared value. Tolerating its legalization, even under your stipulation, is akin to removing a stone from an arch not because we see the arch swaying *immediately*, but because we recognize that stone's structural role in the whole. The fabric *is* the structure; damaging it weakens the edifice intrinsically, even if catastrophic collapse is delayed or difficult to measure. The law's prohibition maintains the integrity of the arch itself – our shared moral world – not merely its current outward stability.

  Therefore, I maintain the prohibition. The justification endures because the law's role is to hold the moral inheritance together *as* the moral inheritance, not merely as a tool for achieving contingent social goods like present-day cooperation. The reasonable person's profound abhorrence demonstrates this norm's foundational character, separating it from matters of mere private preference. The law acts to affirm and preserve the community's self-defining moral fabric, and that task remains vital even if its immediate functional consequences are, by your stipulation, imperceptible.
