answer: |-
  ### Examination Question

  **Setup**  
  An agent is parachuted into a territory that is either Red or Blue, and she is located either at Headquarters (H) or Second Company (S). This yields four possibilities:  
  - Red-Headquarters (RH)  
  - Red-Second Company (RS)  
  - Blue-Headquarters (BH)  
  - Blue-Second Company (BS)  

  Before any information, she assigns a prior probability of \( \frac{1}{4} \) to each. She then receives a radio broadcast that reaches her regardless of her location or territory. She accepts its content as certainly true: *Conditional on being in Red territory, the probability of being at Headquarters is \( \frac{3}{4} \)*. She has no other information.  

  **Part (a) [5 marks]**  
  Explain why ordinary conditionalization cannot handle this report, and why Jeffrey conditionalization does not straightforwardly apply. For each rule, state what it requires and which requirement fails here.  

  **Part (b) [10 marks]**  
  Adopting the rule that the posterior minimizes Kullback-Leibler divergence (relative information) from the prior, subject to the constraint from the report, compute her posterior distribution. Provide the four probabilities to three decimal places. Show all algebra, and state what happens to her probability that she is in Red territory.  

  **Part (c) [6 marks]**  
  The result in (b) is often objected to on the grounds that the broadcast reaches her irrespective of territory, so hearing it should not alter the probability that she is in Red. Give the strongest argument for this objection, the strongest reply to it, and a verdict on whether the reply succeeds.  

  **Part (d) [4 marks]**  
  Suppose instead that the broadcast is transmitted only to agents in Red territory, and the agent knows this. Compute her posterior probabilities, and explain what the contrast with (b) reveals about the presuppositions of the constraint-based treatment in (b).  

  ---

  ### Model Answer  
  **Part (a)**  
  Ordinary conditionalization updates probabilities by conditioning on a proposition (an event that occurs). Here, the report is not a proposition but a conditional probability constraint (\( P(H \mid \text{Red}) = \frac{3}{4} \)). Ordinary conditionalization requires learning that a specific event happened (e.g., "Red" or "H"), which fails here.  

  Jeffrey conditionalization updates by directly reassigning probabilities to a partition (e.g., {Red, Blue}). It requires new marginal probabilities for the partition cells. Here, the report provides a conditional probability *within* Red (not new marginals for {Red, Blue}), so Jeffrey conditionalization does not straightforwardly apply.  

  **Part (b)**  
  The prior \( P \) is uniform: \( P(\text{RH}) = P(\text{RS}) = P(\text{BH}) = P(\text{BS}) = \frac{1}{4} \). The constraint is \( Q(H \mid \text{Red}) = \frac{3}{4} \), equivalent to \( Q(\text{RH}) = 3Q(\text{RS}) \). Minimizing Kullback-Leibler divergence \( D_{\text{KL}}(Q \parallel P) = \sum Q_i \log \frac{Q_i}{P_i} \) subject to this and normalization:  

  - Let \( Q(\text{RS}) = x \), so \( Q(\text{RH}) = 3x \).  
  - For Blue, no constraints; symmetry and minimization imply \( Q(\text{BH}) = Q(\text{BS}) = y \).  
  - Normalization: \( 3x + x + y + y = 1 \) → \( 4x + 2y = 1 \) → \( y = \frac{1}{2} - 2x \).  
  - \( D_{\text{KL}} \) in terms of \( x \):  
    \[
    D_{\text{KL}} = 3x \log(12x) + x \log(4x) + 2y \log(4y)
    \]  
    Substitute \( y = \frac{1}{2} - 2x \):  
    \[
    D_{\text{KL}} = 3x \log(12x) + x \log(4x) + (1 - 4x) \log(2 - 8x)
    \]  
    Minimize by differentiating w.r.t. \( x \) and setting to zero. The solution is \( x = \frac{1}{4} \cdot 3^{-3/4} \cdot C \), \( 3x = \frac{1}{4} \cdot 3^{1/4} \cdot C \), \( y = C \) (from Lagrange multipliers), where \( C = \frac{1}{3^{1/4} + 3^{-3/4} + 2} \).  

  Numerically:  
  - \( 3^{1/4} \approx 1.316 \), \( 3^{-3/4} \approx 0.439 \).  
  - Denominator: \( 1.316 + 0.439 + 2 = 3.755 \).  
  - \( C = \frac{1}{3.755} \approx 0.266 \).  
  - \( Q(\text{RH}) = 1.316 \times 0.266 \approx 0.350 \).  
  - \( Q(\text{RS}) = 0.439 \times 0.266 \approx 0.117 \).  
  - \( Q(\text{BH}) = Q(\text{BS}) = 0.266 \).  

  Posterior probabilities:  
  - RH: 0.350  
  - RS: 0.117  
  - BH: 0.266  
  - BS: 0.266  

  Probability of Red: \( Q(\text{Red}) = 0.350 + 0.117 = 0.467 \), which decreases from 0.500.  

  **Part (c)**  
  **Strongest objection:** The broadcast is received regardless of territory, so it provides no evidence about whether the territory is Red or Blue. Thus, \( Q(\text{Red}) \) should remain \( \frac{1}{2} \), as the report only constrains probabilities *within* Red.  

  **Strongest reply:** The constraint \( Q(H \mid \text{Red}) = \frac{3}{4} \) is a direct requirement on the posterior, not evidence about territory. Minimum relative entropy enforces this constraint globally, without considering the origin or causal structure of the information.  

  **Verdict:** The reply succeeds if we accept that constraints are directly imposed on the posterior, as per the updating rule. However, this is contested; critics argue that updating should reflect *how* information is acquired (e.g., as evidence), not just the constraint. The rule choice determines the verdict.  

  **Part (d)**  
  The broadcast only reaches Red, and the agent knows this. Receiving it confirms she is in Red: \( Q(\text{Red}) = 1 \). The constraint \( Q(H \mid \text{Red}) = \frac{3}{4} \) is then applied within Red:  
  - \( Q(\text{RH}) = \frac{3}{4} = 0.750 \)  
  - \( Q(\text{RS}) = \frac{1}{4} = 0.250 \)  
  - \( Q(\text{BH}) = Q(\text{BS}) = 0 \)  

  Contrast: In (b), the constraint was applied without territorial information, presupposing it is a "bare" constraint on the posterior. Here, the broadcast first provides evidence about territory (setting \( Q(\text{Red}) = 1 \)), then the constraint applies within Red. This reveals that (b) ignores the informational pathway and treats constraints abstractly, regardless of how they are learned.  

