  ### Decision Tree: Authorial Intention and Literary Meaning  
  *Start here. Answer each question based on your intuitive judgment of what fixes a text's meaning, not preconceived labels. Cases illustrate the stakes.*

  ---

  #### **1. Is the author's actual mental state at the time of writing (their intention) what *makes* the text mean what it does? (Constitutive relevance)**  
  - **YES** (Intention is constitutive) → Go to 2.  
  - **NO** (Intention is not constitutive; it might be a clue or irrelevant) → Go to 7.  
  *Case: A grocery list found in a dead stranger's coat is read by a critic as an elegy. If you think the list "is" an elegy only if the stranger intended it as one, you lean YES.*

  ---

  #### **2. Can an intention that *fails* to be realized in the text (e.g., due to textual flaws) still fix the meaning?**  
  - **YES** → **Extreme Actual Intentionalism**  
    - *Position:* Meaning = Whatever the author intended, even if the text doesn't support it.  
    - *Case: Unrecognized irony* → Ironic meaning holds even if no reader detects it.  
    - *Case: Author disavows original meaning* → Original intention still fixes meaning; later disavowal is irrelevant.  
  - **NO** → Go to 3.  
    - *Case: Unrecognized irony* → If the text cannot support irony, the intention fails and meaning is non-ironic.  

  ---

  #### **3. Is the relevant intention the author's *communicative goal* (what they aimed to convey), or a *broader design* (e.g., aesthetic effects)?**  
  - **Communicative (Illocutionary)** → **Moderate Actual Intentionalism**  
    - *Position:* Meaning = What the author successfully realized in the text via communicative intent.  
    - *Case: Pseudonymous hoax* → If the text supports the "sincere" reading, that is the meaning, even if the hoax deceived readers.  
  - **Broader Design** → Go to 4.  
    - *Case: Pseudonymous hoax* → Meaning includes the aesthetic impact of the hoax itself.  

  ---

  #### **4. If the author later revises their intention, does it retroactively change the meaning?**  
  - **YES** → **Retrospective Actual Intentionalism** (Rarely occupied; most argue meaning is fixed at creation)  
    - *Position:* Author's post-hoc reinterpretation can override original intent.  
    - *Case: Author disavows original meaning* → The new endorsed reading becomes the meaning.  
  - **NO** → **Broad Actual Intentionalism**  
    - *Position:* Meaning = Successfully realized broader design (aesthetic, experiential) at time of writing.  
    - *Case: Collaborative manifesto* → Meaning is the unified effect of both authors' realized designs, even if contradictory.  

  ---

  #### **5. (From 1, NO) Is the author's actual intention *evidentially relevant* (a clue) to meaning?**  
  - **YES** → Go to 6.  
  - **NO** → Go to 8.  
    - *Case: Grocery list as elegy* → If intention is irrelevant, the elegy reading may hold without authorial intent.  

  ---

  #### **6. (Hypothetical Intentionalism) Whose knowledge informs the "suitably informed reader"?**  
  - **Author's known corpus/biography** → **HI: Author-Specific**  
    - *Position:* Meaning = Best hypothesis based on public evidence about *this author*.  
    - *Case: Translation of lost original* → Meaning inferred from the author's other works.  
  - **Genre/historical conventions** → **HI: Contextual**  
    - *Position:* Meaning = Best hypothesis based on conventions of the era/genre.  
    - *Case: Unfinished novel completed by AI* → Meaning of AI half based on genre conventions, not human author's intent.  
  - **Idealized "best" hypothesis** → **HI: Idealized**  
    - *Position:* Meaning = What an ideal reader would take as intended, regardless of actual author.  
    - *Case: Poem from automatic writing* → Meaning inferred from textual coherence, not the entranced author's mind.  

  ---

  #### **7. (From 1, NO) Can linguistic/literary conventions + context fix meaning *without* reference to any author?**  
  - **YES** → Go to 8.  
  - **NO** → **Hypothetical Intentionalism** (Default to HI: Idealized if no further commitment)  
    - *Case: Collaborative manifesto* → Meaning is the best hypothesis about the "author" as a unified agent.  

  ---

  #### **8. What fixes meaning if conventions suffice and intention is irrelevant?**  
  - **Conventions alone** → **Conventionalism (Anti-Intentionalism)**  
    - *Position:* Meaning = What public language/conventions allow.  
    - *Case: Grocery list as elegy* → Valid if conventions support it.  
    - *Case: Automatic writing* → Meaning derives from linguistic rules, not the author's trance.  
  - **Value-maximizing interpretation** → **Value-Maximizing View**  
    - *Position:* Meaning = The reading that makes the work artistically/morally best.  
    - *Case: Grocery list as elegy* → Valid if it makes the text profound.  
  - **"Fictional author" construction** → **Fictional Author Theory** (Occupied, e.g., by Alexander Nehamas)  
    - *Position:* We interpret *as if* an author intended it, without belief in a real author.  
    - *Case: Found text (e.g., grocery list)* → Meaning comes from attributing intent to an implied author.  

  ---

  ### Closing Note: Settled vs. Contested Terrain  
  **Settled (Broad Consensus):**  
  - Almost no one holds *extreme actual intentionalism* (unrealized intentions fixing meaning).  
  - *Anti-intentionalism* (conventionalism) is widely rejected in strong forms; most agree intention has *some* role.  
  - *Hypothetical intentionalism* (HI) and *moderate actual intentionalism* dominate the debate.  

  **Contested:**  
  - **Moderate Actual Intentionalism vs. HI:** Whether successful realization requires communicative intent (moderate) or public evidence (HI).  
  - **HI Subtypes:** Whether "suitably informed reader" prioritizes author-specific, contextual, or idealized knowledge.  
  - **Value-Maximizing View:** Whether it describes *meaning* or merely critical *practice*.  

  **Disputed Names/Attributions:**  
  - "Moderate actual intentionalism" (Noël Carroll) is sometimes conflated with broader views.  
  - "Hypothetical intentionalism" (Jerrold Levinson) is disputed by anti-intentionalists who reject hypothetical authors.  
  - "Fictional Author Theory" is often seen as a variant of HI or value-maximizing.  

  **Empty Slot:**  
  - *Retrospective actual intentionalism* is largely vacant. Philosophers (e.g., Paisley Livingston) reject it because meaning is fixed at creation; later acts can't alter historical facts.  

  **Unresolved Cases:**  
  - *Collaborative manifesto*: Splits intentionalists (must reconcile conflicting intents) vs. HI/conventionalists (prioritize public evidence or conventions).  
  - *AI-completed novel*: Exposes gaps; intentionalists struggle with non-human "intent," HI/conventionalists handle it better.  

  Use this tree to diagnose positions *after* discussing cases. It reveals how intuitive judgments map to labels, avoiding premature taxonomy debates.
