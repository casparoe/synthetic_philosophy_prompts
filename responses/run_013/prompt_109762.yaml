answer: |-
  Here's a specification for theories of identity statements and names, derived from your core cases and philosophical imperatives. It distinguishes genuine requirements from contested commitments and flags key tensions:

  **Core Requirements (Genuine & Non-Negotiable):**

  1.  **The Discovery Requirement:**
      *   **Case:** Learning "Long Water = Black River" is a substantial discovery after knowing each name separately, unlike learning "Long Water = Long Water".
      *   **Consideration:** Captures the cognitive significance of identity statements; distinguishes between trivial and informative identities.
      *   **Ruling Out:** Naive theories where meaning is solely the referent (Millianism/Frege's first theory) or solely the mode of presentation (if identical modes are required for co-reference). Rules out theories collapsing cognitive difference into semantic identity.

  2.  **The Empty Name Requirement:**
      *   **Case:** Meaningful use of "Great-Aunt Mildred" for decades, despite her non-existence.
      *   **Consideration:** Names can be meaningful and used in true/false statements even without a referent. Theories must account for meaningfulness beyond reference.
      *   **Ruling Out:** Theories where meaning *is* the referent (strict Millianism) or where a name *requires* a referent to be meaningful (some extreme referentialist views). Favors theories incorporating descriptive content, fictionalist elements, or pretense.

  3.  **The Ambiguous Name Requirement:**
      *   **Case:** "John Smith" referring successfully to two different people in the same discourse context without confusion.
      *   **Consideration:** Names are not inherently unique identifiers; context disambiguates. Theories must explain how context determines reference without collapsing distinct bearers.
      *   **Ruling Out:** Theories treating names as purely rigid designators without context-sensitivity. Favors pragmatic or contextual elements in reference determination.

  4.  **The Communal Deference Requirement:**
      *   **Case:** Using "Dr. Evans" confidently based solely on others' authority, unable to identify the referent personally.
      *   **Consideration:** Demonstrates the social, deferential nature of name reference. Understanding often relies on chains of communication, not individual descriptive knowledge.
      *   **Ruling Out:** Strong descriptivist theories requiring individual speakers to possess uniquely identifying descriptions. Favors causal-historical or chain-of-communication theories (Kripke, Putnam).

  5.  **The Persistent Name Requirement:**
      *   **Case:** Continuing to use "the old oak" meaningfully after the tree is gone.
      *   **Consideration:** Names retain their semantic connection and can be used referentially even post-referent. Meaning persists beyond the existence of the object.
      *   **Ruling Out:** Theories tightly binding name meaning *only* to a current existing referent. Favors theories with stable senses, historical chains, or descriptive contents that survive the object.

  **Distinctions That Must Not Collapse:**

  6.  **Sense vs. Reference Distinction:**
      *   **Case:** The Discovery Requirement (Long Water/Black River) vs. Trivial Identity (Long Water = Long Water).
      *   **Consideration:** Essential for explaining cognitive significance. Collapsing sense into reference makes all true identities trivial; collapsing reference into sense loses objective anchoring.
      *   **Status:** Genuine requirement stemming from Discovery & Trivial Identity cases.

  7.  **Meaningfulness vs. Referential Success Distinction:**
      *   **Case:** Empty Name Requirement (Meaningful "Mildred" without referent) vs. successful reference ("John Smith" to a specific person).
      *   **Consideration:** Allows for meaningful discourse about non-existents and fiction without implying existence. Collapsing them either makes empty names meaningless or forces non-existent objects.
      *   **Status:** Genuine requirement stemming from Empty Name vs. successful reference cases.

  **Contested Commitments (Belonging to Specific Theory Families):**

  8.  **Strong Public Meaning Commitment:**
      *   **Commitment:** The semantic meaning (truth-conditional content) of a sentence is identical for all competent speakers who understand its words.
      *   **Proponents:** Many semantic theories (Fregean sense as public, Millianism, direct reference).
      *   **Conflict:** Sits uneasily with the **Personal Significance Requirement** (below). If "Hesperus is Phosphorus" has the *same* semantic content (truth conditions) for the discoverer and the archivist, the difference in cognitive impact must be non-semantic (pragmatic, psychological).

  9.  **Rigidity Commitment:**
      *   **Commitment:** A proper name designates the same object in every possible world where that object exists, and designates nothing otherwise. (Kripke)
      *   **Proponents:** Direct Reference, Causal-Historical theories.
      *   **Conflict:** Handles modal contexts well but creates tension with the **Empty Name Requirement** (how does a rigid designator designate rigidly... nothing?) and the **Persistent Name Requirement** (rigidity is world-relative, persistence is time-relative).

  **The Personal Significance Requirement (A Key Challenge):**

  10. **The Personal Significance Requirement:**
      *   **Case:** "That's me in the old story!" being a startling discovery to the reader, while the archivist merely knows the fact "Person X = Person Y".
      *   **Consideration:** Highlights the profound difference in *epistemic and psychological impact* of an identity statement based on the speaker/hearer's prior knowledge and perspective, *even when the semantic fact is the same*.
      *   **Status:** Genuine requirement reflecting the phenomenology of discovery. This is the core challenge to Requirement 8 (Strong Public Meaning).

  **The Irreconcilable Tension & What Must Give:**

  *   **The Core Tension:** **Requirement 1 (Discovery)** + **Requirement 10 (Personal Significance)** vs. **Requirement 8 (Strong Public Meaning)**.
  *   **Why Irreconcilable?** Requirement 1 demands that "Hesperus is Phosphorus" is *semantically* different from "Hesperus is Hesperus" to account for its potential informativeness. Requirement 10 shows that even *within* "Hesperus is Phosphorus", its impact varies drastically based on the knower. Requirement 8 insists the semantic meaning is identical for all competent speakers.
      *   If semantic meaning *is* the same for everyone (Requirement 8), then the difference between the trivial and non-trivial identity (Requirement 1), and the difference in impact on the discoverer vs. the archivist (Requirement 10), *cannot be explained by semantics alone*. They must be explained by something else (e.g., differences in associated beliefs, modes of presentation, psychological states).
      *   If the difference *is* semantic (to satisfy 1 & 10 strongly), then semantic meaning becomes inherently tied to individual cognition or perspective, undermining Requirement 8 and making shared public communication deeply problematic.
  *   **What Must Give:** **Requirement 8 (Strong Public Meaning)** is the most common casualty. Most successful theories (Frege's mature sense theory, neo-Fregeanisms, two-dimensional semantics) weaken Requirement 8. They distinguish:
      *   **Shared Semantic Content:** The objective truth-conditional meaning (e.g., the planet Venus is identical to itself), fixed by language/convention. (Preserves core communication).
      *   **Cognitive Significance/Modes of Presentation:** The individual ways speakers associate information/conceptions with the names. This varies and explains discovery/personal impact (Satisfies Requirement 1 & 10).
      *   **Theorist's Surrender:** Requirement 8, in its strongest form, is surrendered. Meaning has a stable public core (truth conditions) but incorporates or interacts with variable cognitive elements explaining informativeness and personal significance.

  **The Single Most Ruling-Out Requirement:**

  **Requirement 1 (The Discovery Requirement)** does the most to rule out obvious, simple theories.

  *   **Rules Out Pure Millianism/Naive Referentialism:** If meaning is *only* the referent, "Hesperus is Phosphorus" and "Hesperus is Hesperus" express the same proposition (Venus = Venus), making the former trivial, contrary to discovery.
  *   **Rules Out Pure Descriptivism (for co-referring names):** If the meaning of "Hesperus" is "the evening star" and "Phosphorus" is "the morning star", then "Hesperus is Phosphorus" means "the evening star is the morning star". While this *can* be informative, descriptivism struggles with rigidity, empty names, and communal deference. More critically, if speakers associate the *same* description with both names, the identity becomes trivial again for *them*, which doesn't always match the case (someone might associate different minimal descriptions even after learning the identity).
  *   **Forces Complexity:** Any theory *must* introduce an element beyond simple reference or simple description to account for the difference in cognitive impact between "a=a" and "a=b" when a=b is true. This element is typically Fregean "sense," individual concepts, linguistic roles, or cognitive files.

  **In Summary:** Your cases demand a theory that juggles objective reference, cognitive significance, context-dependence, social practice, and the meaningfulness of non-reference. The central tension is between the stable, public nature of linguistic meaning required for communication and the variable, personal nature of cognitive impact required for discovery. The standard resolution weakens the "Strong Public Meaning" commitment, distinguishing shared truth-conditional content from individual cognitive associations or modes of presentation. Requirement 1 (Discovery) is the primary wrecking ball for simplistic theories of names and identity.
