  Their unspoken need? Almost certainly intellectual honesty. They don’t want polished answers; they want the map of where philosophical landmines are buried. The archivist/discoverer case is key here—it exposes how badly semantics needs pragmatics to handle perspective. Might whisper later that two-dimensional semantics tries (and fails?) to bridge that gap. 

