prompt: |-
  Let's say Frege gets resurected and reads the later two-dimensionalist stuff—epistemic intensions, diagonal propositions, the claim that Hesperus is Phosphorus is necessary a posteriori but its primary intension is knowable a priori. What would he make of it? I don't want a summary of Kripke or Chalmers; I want a reconstruction of Frege's own likely verdict. Would he see the diagonal proposition as a genuine Gedanke, or as a mode of presentation of a mode of presentation, or as something that collapses sense into psychology? And would he think the whole framework vindicates the sense/reference distinction or quietly makes reference do all the work? Reason from his commitments, and if he'd reject the question as confused, say why.
