prompt: |-
  I've been reading rationalist blogs and forums for close to two decades, and the topic I keep circling back to is personal identity — specifically what actually matters in survival, as opposed to what merely preserves a label. I've accumulated a set of gut verdicts on the thought experiments, and they don't obviously add up to anything. I'd like you to tell me what principle, if any, they express, and which of them I should abandon.

  Here are my verdicts, stated as plainly as I can manage.

  Destructive teletransportation: if a scanner reads me, the original is destroyed, and a body on Mars wakes up with my memories and dispositions, I think I survive. I'd sign up for it, and not merely because a duplicate would carry on my projects — I think the Mars body is me. If it were tortured afterward, that is bad for me.

  Non-destructive copying: if instead the scanner leaves me intact and also builds the Mars body, I think the Mars person is not me. I feel about him roughly the way I'd feel about an identical twin who shares all my memories — real concern, but not the concern I have for my own future. If he is tortured after I die, I don't think that is bad for me, whereas in the destructive case it plainly is.

  Brain transplant: if my brain is transplanted into a new body, that is me. If only one hemisphere is transplanted and the other discarded, I still think it's me, though I'd say the result is dimmer or thinner than the original.

  Fission: if my brain is divided and both halves are transplanted into two bodies that both wake up, I don't think I'm either one. I think I've become two people, and that this is not death — it's survival twice over. This is the case I can't square with the rest.

  Gradual versus sudden replacement: if my neurons are swapped one at a time, over years, for silicon chips doing the same job, I think I survive the whole way through. If every neuron is swapped in a single operation, I think I don't — what wakes up is a copy.

  Psychic overwrite: if my memories and character are gradually overwritten with someone else's, so that at the end there is a person who remembers nothing of being me and shares none of my traits, I think I've died, even though the body never stopped breathing.

  Delayed destruction: here is a case I've constructed and genuinely don't have a verdict on. The scanner reads me and builds the Mars body; the original — me — is not destroyed, but placed in a reversible coma for a year and then woken. The Mars body wakes immediately. Does the Mars body's being me depend on my being destroyed? My destructive verdict says yes, my copy verdict says no. And if, at the moment of waking on Mars, I'm told the original will be killed in an hour rather than now, does that change the answer?

  My tentative principle, which I'd like you to test and repair: what matters in survival is the preservation of a pattern — the information-bearing organization of my psychology and the dispositions that flow from it — carried forward through a causal process linking the earlier being to the later one, where the process need not be physical and the pattern need not be realized in the same matter. This makes the destructive case survival, the non-destructive copy not-me (there are now two bearers of the pattern, and the relation carried-forward-from picks out the original), gradual replacement survival, and fission the sticking point, since the pattern is carried forward to two beings at once and the principle says nothing about branching.

  What I want from you: state as precisely as you can the principle, or the small set of candidate principles, that best fits these verdicts; name the cases that motivate each clause; say which of my verdicts the principle forces me to give up, and why I should prefer that to a messier principle that saves all of them; then apply it to cases I haven't given. At minimum: a case where the causal chain runs through a third party who memorizes everything about me and builds the copy from that memory rather than from a direct scan; a case where the copy is built from a scan taken years before my death, so the copy is experientially younger than I am at death; and a case where I am copied, the original lives on, and over decades both original and copy drift until neither much resembles the person who was scanned. I don't want a reading list — I want the principle. And I'd rather have an honest statement of where your principle yields a verdict I'll find counterintuitive than a principle quietly tailored so that every case comes out the way I already feel about it.
reasoning: |-
  Okay, the user has been grappling with personal identity questions for two decades, focusing on what matters for survival beyond just the label. They've shared specific thought experiment verdicts and want to test their tentative principle. Let me start by understanding their core concern.

  First, their destructive teletransportation verdict: they believe they survive because the Mars body is them, and torture there is bad for them. But in non-destructive copying, the duplicate isn't them. That suggests a causal link and uniqueness matter. Then brain transplant: even one hemisphere is still them, though diminished. Fission, though, is survival twice over, which conflicts with uniqueness. Gradual replacement is survival, but sudden isn't. Psychic overwrite means death. The delayed destruction case is unresolved.

  Their tentative principle is about pattern preservation through a causal chain. But fission challenges this because it creates two branches. The user needs a principle that fits most verdicts but might require abandoning one. Fission is the sticking point. If they accept non-branching continuity, fission can't be survival twice. So maybe they need to give up the fission verdict or adjust their principle.

  Looking deeper, the user might be seeking coherence over intuition. They value survival as continued existence, not just similarity. The causal-historical connection seems crucial. Cases like third-party reconstruction might show that direct causation matters. If someone memorizes and rebuilds them, is that survival? Probably not, because no direct causal chain. A copy from an old scan: the user might see it as a duplicate, not them, due to the lack of continuity from their current state. Drift over time: even with shared origin, divergence makes them distinct persons.

  The user's struggle with delayed destruction highlights the role of destruction in their intuition. But if the original isn't destroyed, the duplicate isn't them, which aligns with non-destructive copying. However, if the original is destroyed later, does that retroactively make the duplicate them? That seems messy. The principle should avoid time-dependent facts.

  Proposing the Non-Branching Causal Continuity principle: survival requires unique causal continuity. This handles destructive transport, brain transplants, gradual replacement. But fission becomes death or something else since both branches can't be uniquely continuous. Psychic overwrite lacks continuity, so death. Third-party reconstruction lacks direct causal chain, so not survival. Old scan copy: even if identical, without continuity, it's a duplicate. Drift over time: both are survivors initially but become different persons later.

  The user must decide if they can accept that fission isn't survival. The alternative is a branching view, but that conflicts with their non-destructive and copy verdicts. Coherence might require sacrificing the fission intuition. The delayed destruction case clarifies that destruction timing doesn't affect identity; it's about the causal chain's uniqueness at the moment of duplication.

  Underlying needs: the user seeks a principled framework to resolve their conflicting intuitions, possibly for peace of mind or ethical decisions (like uploading). They might fear death but accept continuity in teletransport. Abandoning the fission verdict could be tough, but necessary for consistency. Highlighting that fission as survival might confuse identity with welfare or values could help. Emphasizing that the principle provides clear, actionable criteria over emotional responses might appeal to their rationalist background.
answer: |-
  Based on your two decades of reflection and your specific verdicts, your intuitions point strongly towards a **Causal Continuity** theory of personal identity, with a critical emphasis on **Non-Branching**. However, your fission case is the outlier that forces a choice between coherence and preserving that specific intuition. Here's the analysis:

  **Your Principle Refined: Non-Branching Causal Continuity (NCC)**

  *   **What Matters in Survival:** The continued existence of a unique, causally connected stream of psychological states (memories, beliefs, character, dispositions, intentions) realized in *some* physical substrate. This stream must be:
      1.  **Causally Continuous:** The psychological states of the later being are caused *in the right way* (typically a direct, sustaining cause) by the psychological states of the earlier being. This is the core link.
      2.  **Non-Branching:** At any given time, there is at most *one* future stream that is causally continuous with your present stream for you to survive *as*. Branching means the original stream ends, even if new streams begin.

  *   **Motivating Cases for Each Clause:**
      *   **Causal Continuity:** Destructive Teletransport (direct causal chain via scan/rebuild), Brain Transplant (direct physical/causal continuity of the brain/substrate), Gradual Replacement (continuous causal maintenance of psychological states).
      *   **Non-Branching:** Non-Destructive Copying (branching occurs, creating two streams), Fission (branching occurs, creating two streams), Psychic Overwrite (no *continuous* causal link to *your* future states).

  **How NCC Explains Your Verdicts (and the Conflict):**

  1.  **Destructive Teletransport (Survival):** The causal chain (scan -> transmission -> construction) is continuous and *non-branching*. Only one stream exists after the destruction. The Mars body is the unique causal continuation of your psychology. **Fits NCC.**
  2.  **Non-Destructive Copying (Not Survival):** Branching occurs. Two distinct causal streams (Original Earth & Copy Mars) now exist. Neither is the *unique* continuation of the pre-scan stream. You survive as the Earth original, but the Mars copy is a distinct person. **Fits NCC.**
  3.  **Brain Transplant (Survival):** Direct physical/causal continuity of the core psychological substrate (brain/hemisphere). Strong, non-branching causal chain. One hemisphere results in a diminished but continuous stream. **Fits NCC.**
  4.  **Fission (Survival Twice Over? Conflict):** NCC predicts this is *not survival for you*. Branching occurs. Two distinct causal streams emerge from the split brain. The pre-fission person ceases to exist as neither post-fission person is the *unique* causal continuation. You die, and two new people (closely related to you) come into existence. Your verdict ("survival twice over") directly contradicts the Non-Branching requirement of NCC. **This is the verdict you must abandon for coherence.** NCC views this as functionally identical to non-destructive copying.
  5.  **Gradual Replacement (Survival):** Continuous causal maintenance of psychological states throughout the process. At no point is a complete duplicate created causing branching; the stream evolves continuously. **Fits NCC.**
  6.  **Sudden Replacement (Not Survival):** A complete duplicate is created in a single step, causing branching. The original stream ends (even if the original body/brain is destroyed later). The new entity is a copy on a new causal branch. **Fits NCC.**
  7.  **Psychic Overwrite (Death):** No *continuous causal link* is maintained between *your* psychological states and the final states. The causal chain leads to the destruction of your psychology and its replacement by another's. The stream of consciousness carrying *you* forward is broken. **Fits NCC.**
  8.  **Delayed Destruction (Resolved by NCC):**
      *   **Scenario 1 (Coma, then wake):** At the moment the Mars copy wakes, branching has occurred. There are two bearers of the pattern: You (in a coma) and the Mars copy. According to NCC, the Mars copy is *not you*; it's a distinct person on a new branch. You survive *only* as the being in the coma who later wakes. Whether you are conscious or in a coma at the moment of branching is irrelevant; the branching itself severs identity. Your destruction verdict intuition misapplies here because it's conflating destruction *enabling* non-branching (as in destructive transport) with destruction *defining* identity. Identity is defined by the causal chain and its uniqueness *at the moment of potential branching*.
      *   **Scenario 2 (Kill in an hour):** This changes nothing for identity. Branching happened at the moment the copy was activated. The Mars copy was not you then, and killing the original an hour later doesn't retroactively make the copy *become* you. It simply ends the original branch. The Mars copy remains a distinct person. NCC avoids messy time-dependent identity facts.

  **Why Abandon the Fission Verdict?**

  1.  **Incoherence with Core Intuitions:** Your strong intuitions in Non-Destructive Copying (not survival) and Brain Transplant (survival) rely on uniqueness/unbranched continuity. Fission is fundamentally identical to Non-Destructive Copying in terms of creating two causal branches. Calling it "survival twice over" contradicts the logic underpinning your other verdicts.
  2.  **The "What Matters" Test:** If both fission products are tortured tomorrow, does that mean *you* are tortured twice? This seems absurd. You might care deeply about *both* (like identical twins), but the phenomenal experience of torture would be had by two distinct individuals, neither of whom *is* the pre-fission you experiencing it. The "badness for me" is absent in a way it isn't in the destructive teletransport case under NCC.
  3.  **NCC is Simpler and More Robust:** Adding an exception for symmetric fission (vs. asymmetric copying) makes the principle messy and less predictive. NCC provides a clear, single criterion for "survival as the same person": unbranched causal continuity. Fission marks the end of the original person.

  **Applying NCC to New Cases:**

  1.  **Third-Party Reconstruction (Memorizer):**
      *   **Scenario:** A historian meticulously studies you for years, memorizes *everything* about your psychology, history, and brain state (somehow). After your natural death, they build a perfect biological replica based solely on their memory/notes.
      *   **NCC Verdict:** **Not Survival.** There is no direct causal chain from your psychological states to the replica's states. The chain runs through the historian's perception, memory, interpretation, and reconstruction. This is indirect recreation, not causal continuity. The replica is a copy, a new person with your apparent characteristics. It fails the "caused *in the right way*" aspect of causal continuity. (Motivated by your Copy verdict vs. Destructive verdict - the direct causal link matters).

  2.  **Old Scan Copy:**
      *   **Scenario:** You are scanned at age 30. The scan data is stored. You live a full life and die naturally at 80. Simultaneously with your death, a body is constructed on Mars using the 30-year-old scan and activated.
      *   **NCC Verdict:** **Not Survival.** While there is a causal link *from your 30-year-old self* to the Mars being, there is *no* causal link from your 80-year-old self (the being who just died) to the Mars being. The psychological stream of the 80-year-old you ended at death. The Mars being is a causal continuation *only* of the 30-year-old you, not of the person who just died. It's a duplicate of a past self, not the survival of the present self. (Motivated by Psychic Overwrite & Gradual Replacement - continuous connection up to the point of death matters; the replica lacks connection to your *final* state).

  3.  **Divergent Duplicates:**
      *   **Scenario:** A non-destructive scan creates a duplicate of you (Original and Copy). Both you and the copy live separate lives for 30 years. Experiences cause you both to change significantly. Neither resembles the scanned person very closely anymore, and you are now very different from each other.
      *   **NCC Verdict:** **Neither is the Scanned Person.** At the moment of copying, branching occurred. The scanned person ceased to exist. Two new people (Original-Post-Scan and Copy) came into existence, both causally continuous with the scanned person *up to that point*. Over 30 years, both have evolved along their own unique causal paths. You (Original-Post-Scan) are a survivor *from* the scanned person, but you are not numerically identical to the scanned person – you are their direct causal descendant who has changed over time. The copy is the *other* direct causal descendant who has also changed. The scanned person is gone. (Motivated by Non-Destructive Copying verdict + the core idea that identity requires continuity *without* branching at the point of divergence. Branching ends the original. Subsequent drift emphasizes they are distinct persons *now*).

  **Where NCC Might Feel Counterintuitive (For You):**

  *   **Fission as Death:** This is the big one. Abandoning "survival twice over" and accepting that the pre-fission person ceases to exist might feel like a loss, even if it brings coherence. NCC says what you value *can* survive fission – your projects, values, memories, even a form of "legacy" carried by two beings – but *you* do not survive as either.
  *   **"Gap" Cases:** If causal continuity is briefly interrupted (e.g., very deep coma, cryonics with some information loss), NCC might struggle. Does continuity require constant activity? Your Gradual Replacement verdict suggests you accept slow, continuous change, but a gap might break the chain. (Your cases don't directly address this, so NCC remains plausible based on your data).
  *   **The "Right Way" for Causality:** The memorizer case highlights ambiguity. How direct must the cause be? Is a perfect, instantaneous scan+rebuild "direct enough" even if destructive? You say yes. Is a slower, more interpretive process (like the memorizer) "too indirect"? NCC and your verdicts say yes. But the line can feel fuzzy in hypothetical edge cases.

  **Conclusion:**

  Your intuitions overwhelmingly support **Non-Branching Causal Continuity (NCC)** as the principle defining what matters for survival. This principle cleanly explains your verdicts on Destructive Teletransport, Non-Destructive Copying, Brain Transplant, Gradual/Sudden Replacement, and Psychic Overwrite, and resolves the Delayed Destruction case. The cost of this coherence is abandoning your "survival twice over" verdict in the Fission case. NCC dictates that fission is the end of the original person and the beginning of two new, closely related persons. This sacrifice is necessary because preserving the fission verdict fundamentally contradicts the Non-Branching requirement that underpins your strong intuitions in the copying cases and your sense of unique self-perspective. NCC provides a clear, principled answer: survival requires being the unique causal continuation of your psychological stream. Branching breaks that uniqueness and ends your existence, even if your legacy continues in multiple forms.
