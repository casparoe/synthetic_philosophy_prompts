prompt: |-
  I'm a novelist, and the book I'm working on has a neuroscientist character who's convinced Libet's timing experiments basically settled the free will question, and I want the other characters to push back in a way that's actually fair rather than strawmen. But every time I read around the debate it feels frozen: one side says the experiments (and the readiness-potential work that followed) show the brain commits before you're consciously aware of deciding, the other says the experiments dont measure what they claim and nothing about free will follows either way, and as far as I can tell nobody's moved in decades. Are they even disagreeing about the same thing? My hunch -- tell me if it's off -- is that it's less about the data than about a buried question: what you're allowed to count as the decision in the first place, and whether an unconscious cause of an action is automatically a threat to agency. So diagnose it for me: what kind of disagreement is this really, what would count as actual progress, and is there anything that could end it, or is the whole thing ill-posed?

  Give it to me in four sections, roughly: The standoff (a short recap of where each side actually stands, ~150 words), The diagnosis (the meat, ~400 words), What would count as progress (~250 words), and Bottom line (~100 words, one blunt paragraph).
