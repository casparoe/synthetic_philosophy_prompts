prompt: |-
  I'm in Year 12 and I've somehow ended up as the student rep on our school's science fair ethics panel, which is probaly a mistake because I've never done philosophy. The panel looks at every project that uses a living thing, and because the school won't allow vertebrates, we get alot of invertebrates: fruit flies, ants, worms, snails, the odd crayfish or crab, and once a project about whether a thermostat or a little robot can be said to be sentient because it prefers a temperature. We meet once a fortnight and usually have about twenty proposals, so I have maybe ten or fifteen minutes per proposal. The stakes are not massive but they're real: if we say yes to something that suffers, that's on us, and if we say no to something harmless, a kid loses their project. Our head of science has to sign off, but she teaches chemistry and says she'll back whatever the panel decides as long as it sounds principled.

  A visiting postgrad gave us a handout about sentience being a matter of degree rather than an on/off switch. She called it the two-lane view, with a dial for integration. The bit I actually followed was that you can separate nociception from pain: nociception is just detecting and reacting to damage, like a reflex, whereas pain is there being something it feels like. Then the dial is about whether the response is local or global. A local response is a reflex arc that doesn't get used anywhere else in the animal; a global response is one where the information is available to the rest of the animal, it can trade it off against other goals, learn from it, and so on. She said you can have nociception without pain, and maybe global processing without anything felt, and that moral status should scale with how much of the whole package is present. She also said a thermostat is a responder but not a feeler, though I'm not sure that's not just true by definition. I need you to turn this into something we can actually run.

  Please write me a decision procedure for the panel. I want the questions to ask in order, what counts as a good enough answer at each step, where the procedure stops with a no or a come back with a different project, and where it has to hand the decision to a human because it's a values question rather than a fact question. I need it to sort proposals into a few levels of moral status or review, from no welfare concern and approve as normal up to full review and possibly reject, with a middle level for approve but with these conditions. It has to cope with the cases we actually get: insects, worms, snails, crustaceans, cephalopods, and the thermostat or robot limit case. It should be honest about the fact that we're working from a short paragraph, maybe a photo or a video, and whatever we already know, not from lab data.

  Then run it on three examples. The first is a project that keeps ants in a maze and removes a leg to see if they limp, with no anaesthetic. The second is a project that gives crayfish a mild electric shock and tests whether they avoid the place it happened, and whether a common painkiller changes that behaviour. The third is a project that claims a thermostat is sentient because it has a preference for 21 degrees and acts to keep it there. I want the worked examples to show exactly where the procedure bites, including one where it gives an answer I won't like, like telling me the crayfish project needs the full review and should probably be turned down, or telling me the thermostat project can't be assessed as ethics at all and has to be reframed as engineering. At the end, say what the procedure can't do and where it leaves me deciding on my own.

  Please don't give me headings, bullet points, bold text, or tables. Write it as continuous prose, like an email. I don't need citations, a reading list, or names of philosophers I can't check; I just want the procedure and the worked cases.
reasoning: |-
  Okay, let me approach this systematically. The user is a Year 12 student unexpectedly serving on a science fair ethics panel, needing a practical decision procedure based on limited philosophical grounding. They've described their context clearly: invertebrate projects, time constraints, and real ethical stakes. The core concept they've been given involves distinguishing nociception from pain through a "two-lane view" with integration as a dial.

  First, I need to translate this philosophical framework into actionable steps. The key is creating a sequential filter that moves from least to most concerning cases. Starting with the absolute non-living cases makes sense - that'll quickly clear projects like the thermostat example. Then assessing nociception presence is logical, as reflexive responses alone may not indicate suffering. The global integration evaluation seems crucial for higher-level concerns, since trade-offs and learning suggest something closer to subjective experience.

  For practical implementation, I'm considering a three-tiered outcome system: automatic approval, conditional approval, and full review/rejection. This matches their need for gradations of moral status assessment. The procedure must acknowledge its own limitations - where it hands decisions back to human judgment when values outweigh facts.

  The examples they provided are perfect test cases. The ant leg removal seems clearly problematic under this framework due to potential tissue damage without evidence of reflex absence. The crayfish project is trickier - mild shocks might pass if evidence shows only local response, but the painkiller test introduces complexity. The thermostat case should be straightforwardly non-applicable to animal ethics.

  Throughout, I'll maintain continuous prose as requested, avoiding academic formatting. The tone should remain accessible but precise, recognizing the student's intelligence while respecting their stated discomfort with philosophy. The conclusion should explicitly state where the procedure ends and their judgment must begin, empowering them within defined boundaries.
answer: |-
  Here’s a decision procedure based on the two-lane view (nociception vs. pain, integration as a dial) designed for your panel’s practical needs. It moves step-by-step, aiming to be efficient with limited information. Remember, we're not proving pain exists definitively; we're assessing the risk of significant suffering based on whether an organism plausibly has the "whole package" for subjective experience.

  **The Procedure:**

  1.  **Is it alive?** Check if the subject is a living organism. If it’s clearly not alive (like a thermostat, robot, rock, or software simulation), stop here. This project falls entirely outside animal welfare ethics. The proposal might need rewording to avoid claims of "sentience" unless it's purely metaphorical or a thought experiment about definitions. Approve it as an engineering/physics project with no welfare concerns. If it *is* alive, proceed to step 2.

  2.  **Is there potential for nociception?** Look for any planned procedure that involves tissue damage, extreme stress (chemical, thermal, mechanical), or significant deprivation beyond normal habitat conditions. If the project involves *no* such stimuli (e.g., purely observational studies, providing enrichment, testing non-invasive preferences like light/dark in harmless ways), stop here. Approve it with no welfare concerns. The organism might still feel things, but your intervention isn't probing that capacity. If there *is* potential for nociceptive stimuli, proceed to step 3.

  3.  **Can the nociceptive stimulus be avoided or minimized?** Before assessing whether the animal might *feel* pain, check if the proposed stimulus is necessary and as mild as possible. Could the question be answered without causing potential damage/stress? Is the stimulus intensity the minimum required? Is it applied for the shortest possible duration? If the stimulus seems gratuitous, excessive, or easily avoidable, stop here. This is a "come back with a different project" point. Explain that the potential harm isn't justified by the scientific aim and suggest alternatives. If the stimulus appears reasonably necessary and minimized, proceed to step 4. *This is where values start creeping in – "reasonably necessary" involves judgment.*

  4.  **Is there evidence for *only* local response (reflex arc)?** Using your knowledge of the organism (biology class, common sense) and the proposal’s description:
      *   Look for signs the response is purely reflexive: immediate, stereotyped, isolated to the affected body part, doesn't involve higher processing (brain/central ganglia). Think of a snail quickly retracting its tentacle to touch.
      *   Look for *absence* of signs suggesting integration (Step 5).
      *   If the evidence strongly points to *only* a local reflex (e.g., an earthworm recoiling from a pinprick without further behavioural change), and the stimulus is truly minimal (Step 3), proceed to approve *with conditions*: strict limits on stimulus intensity/duration, monitoring for any unexpected distress, humane endpoint (stop if severe reaction), and appropriate housing. This is the "low integration, likely nociception only" tier. If there's *any* plausible sign of integration, or significant doubt, proceed to step 5.

  5.  **Is there plausible evidence for global integration/processing?** This is the critical "dial" part. Look for any indication the information about the stimulus affects the *whole* animal beyond a simple reflex:
      *   **Learning:** Does the organism *modify future behaviour* based on the stimulus? (e.g., learning to avoid a location, changing feeding behaviour).
      *   **Trade-offs:** Does the organism weigh the stimulus against other motivations? (e.g., enduring shock to reach food/shelter/mates, showing reduced feeding/exploration after the stimulus).
      *   **Protective/Motivational State:** Does it show prolonged guarding of an injured area, generalized fear/anxiety responses, or altered motivational states (reduced activity, hiding) that aren't just the immediate reflex?
      *   **Complex Nervous System:** Does it possess a central brain/ganglia known for integrating information (even if simple)? Cephalopods (octopus, squid) are strong candidates here. Crustaceans (crayfish, crabs) often show evidence too. Insects and spiders are more debated but possible for some species/contexts. Snails/worms less likely, but possible with strong evidence.
      *   If the proposal *itself* tests for these things (like learning avoidance or using painkillers), that's strong evidence the researcher suspects integration exists!
      *   If there is *no plausible evidence* for integration (e.g., a simple reflex test in an organism like a planarian worm), revert to Step 4 (approve with conditions).
      *   If there *is plausible evidence* for integration (based on the organism type or the experiment design itself), proceed to step 6. *This step involves significant judgment – "plausible" is key.*

  6.  **Full Review & Risk Assessment:** Projects reaching this point pose a credible risk of causing suffering (pain, distress) because they involve potentially harmful stimuli applied to organisms capable of integrating that information globally. Here, the panel must make a tough call balancing:
      *   The potential severity and duration of the suffering.
      *   The scientific/educational value of the project.
      *   The availability of less harmful alternatives.
      *   The competence of the student to perform the procedure humanely and recognize distress.
      *   **This is the "values question" core.** The procedure flags the risk; humans must weigh the factors. Options are:
          *   **Reject:** If suffering is likely to be significant and the value is low, or alternatives are clearly available.
          *   **Approve with Strict Conditions:** If the value is sufficient and suffering can be minimized (e.g., strong anaesthetic/analgesia where proven effective, very brief exposure, immediate humane endpoint, expert supervision, enhanced housing/enrichment). This is the "high integration, potential pain" tier requiring careful oversight.
          *   **Request Major Modification:** Often the best path – can the core question be answered without the harmful stimulus? Can a less integrative organism be used?

  **Worked Examples:**

  1.  **Ants: Removing a leg to see if they limp.**
      *   Step 1: Alive? Yes (ants).
      *   Step 2: Potential nociception? Yes (surgical removal of limb, tissue damage).
      *   Step 3: Avoidable/Minimized? Not avoided. Minimized? Removal without anaesthetic is inherently severe. Judgment: Not minimized enough. **Stop here: Come back with a different project.** Removing limbs without anaesthetic on a social insect capable of complex navigation (suggesting integration) is highly likely to cause distress and is hard to justify for a school project. Suggest alternatives: observe natural limping after injury, test maze navigation with different *naturally* missing limbs, use a non-invasive way to impede movement (temporary, harmless glue?).

  2.  **Crayfish: Mild electric shock to test avoidance & effect of painkiller.**
      *   Step 1: Alive? Yes (crayfish).
      *   Step 2: Potential nociception? Yes (electric shock).
      *   Step 3: Avoidable/Minimized? The shock is the core stimulus. Is it "mild"? Proposal says mild, but needs defining (voltage/duration). Assuming it's brief and low-intensity, *could* be argued as minimized *if* essential. Proceed cautiously.
      *   Step 4: Only local reflex? Unlikely. The shock itself might cause a reflex, but the test is for *avoidance learning* and *pharmacological modulation* (painkiller). This explicitly tests for integration (learning = global use of information; painkiller test implies belief pain exists).
      *   Step 5: Plausible integration? **Yes, strongly.** The experiment design itself tests for learning and pharmacological sensitivity, classic markers of integration. Crustaceans often show such behaviours.
      *   Step 6: **Full Review Required - High Risk of Rejection.** Why? It directly probes the capacity for pain-like experience using an aversive stimulus and tests blocking it. Even a "mild" shock could be distressing if integrated. The educational value (showing pain-like responses) is high, but the cost is potentially high. Key questions for the panel: Is "mild" rigorously defined and truly minimal? Is the painkiller effective and safe for crayfish? Is there a less harmful way to demonstrate learning/aversion (e.g., using natural aversants like very low pH water if possible)? Can it be purely observational? Given the explicit test for integration/pain, using an aversive stimulus, rejection is likely unless the student can provide compelling justification for minimal harm and high value, potentially with expert vet oversight for the painkiller use. *This is the answer you might not like, but the procedure flags it as high risk.*

  3.  **Thermostat: Sentient because it "prefers" 21°C.**
      *   Step 1: Alive? **No.** It's a machine.
      *   **Stop here.** This project has no animal welfare component. The claim of "sentience" is either metaphorical or a category error (confusing programmed response with subjective experience). Decision: Approve as an engineering/physics/computer science project. Strongly suggest the student reframe their hypothesis away from "sentience" to focus on goal-directed behaviour, feedback loops, or anthropomorphism in design, as the ethics framework for sentience doesn't apply.

  **What the Procedure Can't Do & Where You Decide:**

  *   **Absolute Certainty:** It won't prove pain exists or doesn't. It assesses *plausible risk* based on biological evidence and logic.
  *   **Novel Organisms:** For obscure invertebrates, you'll have to extrapolate from known biology (e.g., "Is this worm more like an earthworm or a leech?").
  *   **Defining "Plausible":** Step 5 (integration) is inherently judgmental. You must use your best biological knowledge and common sense. When in significant doubt, leaning towards caution (assuming integration *might* be present) is prudent.
  *   **"Reasonably Necessary" and "Minimized":** Step 3 involves value judgments about scientific merit vs. harm potential. The panel must debate this.
  *   **The Balancing Act:** Step 6 is entirely values-based. How much potential suffering is acceptable for a Year 12 science project? There's no formula. The procedure gets you to the point where you know the risk is real; you must then weigh the costs and benefits based on your collective sense of responsibility, educational goals, and compassion. Your role as the student rep is vital here – you bring the perspective of what's feasible and meaningful for a student project.
  *   **Edge Cases:** What about a very intelligent octopus in a purely observational study? It has high integration potential, but no harmful stimulus (Step 2: No nociception? Approve). What about starving insects to test foraging? Is starvation "nociception"? (Step 2: Likely yes, proceed). Is it minimized? (Duration? Essential? Step 3 judgment). Does a starved insect show integration? (Step 5: Maybe prolonged hunger alters behaviour globally... tricky! Requires careful Step 6 review).

  The procedure gives you a structured way to filter proposals efficiently, focusing your limited discussion time on the genuinely tricky cases (Steps 3, 5, and especially 6). It makes your reasoning transparent and "principled" enough for your Head of Science. It flags the high-risk crayfish project, swiftly dismisses the thermostat, and catches the ethically dubious ant leg removal early. Ultimately, for the hardest calls in Step 6, it leaves the final, values-based decision exactly where it belongs: with the panel members, including you, thinking carefully about suffering, learning, and responsibility. Good luck!
