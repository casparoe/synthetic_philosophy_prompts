prompt: |-
  I'm a second-year PhD student putting together a reading list for a seminar on normativity, and I've been working through a survey chapter on fitting-attitude analyses of value. There is one passage I've now read four times and I still can't tell how much of it to trust; a friend in the seminar thinks it is obviously correct, and I'm inclined to think something has gone wrong somewhere but I can't locate it. Here is the chapter's summary, more or less verbatim: "On the fitting-attitude analysis, to call something good is simply to say that it is fitting to value it — that there are reasons to admire it, to desire it, or to approve of it. The trouble is that there are reasons to have these attitudes that have nothing to do with the value of the thing. The standard example is the demon, who will torture you unless you admire him: this gives you an excellent reason to admire him, but he is not admirable. Since the reasons-to-value account counts the demon as good, the analysis fails, and this is the wrong kind of reasons problem. The obvious repair is to say that only the right kind of reasons — moral reasons, as opposed to self-interested ones — make something valuable. But that is a circle, since what makes a reason moral is precisely that it bears on the value of the object. So the fitting-attitude analysis is either false or circular, and the upshot is that value cannot be analyzed in terms of our attitudes at all."

  I would like a sentence-by-sentence audit: which parts would a careful defender of the analysis accept as accurate, which are fair simplifications that a specialist would tolerate, and which are actually wrong. Two remarks I've heard in the seminar I can't fit together, and which I suspect the chapter has quietly merged into one: one person said the real distinction is between reasons that bear on the object and reasons that bear on the state of mind, and another said the whole problem is that fittingness cannot be explained in terms of reasons at all. Are those the same point as the chapter's moral-versus-self-interested line, or different points that happen to be neighbors? And does the chapter's closing claim — that value cannot be analyzed in terms of our attitudes — follow from anything true in what precedes it, or is it a non sequitur even if the demon case is a genuine difficulty for the analysis? I'd like to know what a defender would concede, what a defender would push back on, and whether the difficulty is better described as a refutation of the analysis or as a demand for a refinement of it.

  Please be explicit about how confident you are in each of your main claims, and flag the single point in your answer you are least sure of — I would rather know where the ground is soft than receive a uniformly confident verdict. You don't need to supply citations or a reading list; I'll track down the primary sources myself, and I'm more interested in the shape of the dialectic than in who said what.
