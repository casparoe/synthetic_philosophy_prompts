  Okay, the user is asking for a clear specification of what a theory of standing to blame must deliver. They want a requirements list based on specific cases and distinctions, not a survey of existing theories. Let me start by understanding their main points.

  First, they listed several cases any adequate account must handle: the hypocrite, the ex-smoker, the secret wrongdoer, the bystander, institutional hypocrisy, self-blame, third-party blaming, and co-culprits. Each of these scenarios tests different aspects of standing. I need to ensure each case is addressed with the intuition behind it and whether it's a genuine constraint or camp-specific.

  Next, distinctions they mentioned: lacking standing vs. blameworthiness vs. unwarranted blame vs. ineffective blame; losing vs. never having standing; different scopes like resentment vs. demand vs. sanction; standing to blame vs. being heard. These distinctions are crucial to prevent conflating concepts. I should note which are widely accepted and which are debated.

  They also want consistency with external factors: blaming as a social practice with costs, criticism to those who can't respond, unspoken blame. These are genuine constraints because they reflect real-world dynamics.

  The user is aware of three main camps: will-based, demand-based, and functional/pragmatic. For each requirement, I need to indicate which camp it aligns with or if it's contested. The hypocrite paradox is a key challenge—how to condemn hypocrisy without making all blame impossible due to universal fault. This is probably the central tension in the literature.

  The user suspects some requirements conflict, especially regarding hypocrisy. I agree; resolving this is critical. The demand-based camp might handle the hypocrite by focusing on compromised authority, while will-based camps link to ill will. Functional camps might see hypocrisy as undermining blame's purpose.

  I should also check if any listed requirements are merely linguistic quirks. For example, unspoken blame might be a red herring since standing relates to the act's legitimacy, not its expression. But the user included it, so I'll mention it but note it's not central.

  The most constraining requirement is likely the hypocrite without universal standing loss. It rules out theories that can't differentiate between the hypocrite and others with minor faults. Demand-based theories might use the equality condition, while functional ones emphasize consistency in participation.

  Finally, highlighting the clash between cases: the hypocrite vs. the ex-smoker. If ex-smokers can blame, why can't hypocrites? The key is ongoing vs. past faults and the nature of the demand. This distinction is vital for any viable theory.
answer: |-
  Here’s a rigorous specification for a theory of standing to blame, structured as a requirements list. It prioritizes your cases, distinctions, and constraints, identifies genuine vs. contested requirements, flags tensions, and isolates the key theoretical challenge.

  ---

  ### **Core Requirements for a Theory of Standing to Blame**

  #### **1. The Hypocrite Test**  
  **Case**: A person actively lying while blaming you for lying.  
  **Intuition**: Their blame feels illegitimate, manipulative, or "tainted"—even if *what* they say is *true*.  
  **Constraint Type**: **Genuine** (all camps accept hypocrisy undermines standing).  
  **Camps**:  
  - *Will-based*: Hypocrite displays ill will/self-exemption.  
  - *Demand-based*: Hypocrite violates the "equality condition" (demanding what they flout).  
  - *Functional*: Hypocrisy corrupts blame’s purpose (e.g., mutual accountability).  
  **Why essential**: Rules out theories where only blameworthiness of the blamed matters.

  #### **2. The Reformed Offender Test**  
  **Case**: An ex-smoker blaming you for smoking.  
  **Intuition**: Their blame seems *permissible* (even admirable) if sincere—unlike the active hypocrite.  
  **Constraint Type**: **Genuine** (distinguishes past vs. current faults).  
  **Camps**:  
  - *Will-based*: Ex-smoker’s will is aligned with the norm.  
  - *Demand-based*: Ex-smoker can demand compliance; they uphold the norm now.  
  - *Functional*: Their blame reinforces the norm without inconsistency.  
  **Critical Tension**: Must distinguish this from hypocrisy without appealing to "clean records" (see §8).

  #### **3. The Secret Wrongdoer Test**  
  **Case**: Someone blames you for X, but they *also* do X (though never in front of you).  
  **Intuition**: Their standing is compromised—akin to hypocrisy—even if undetected.  
  **Constraint Type**: **Contested** (Demand/Functional camps accept; Will-based may reject if blamer’s will is pure).  
  **Key Distinction**: Tests whether standing requires *actual* moral consistency vs. mere *expression* of good will.

  #### **4. The Uninvolved Bystander Test**  
  **Case**: A stranger with no stake blames you for mistreating *your* friend.  
  **Intuition**: Their blame can feel intrusive or "none of their business"—but not always (e.g., human rights violations).  
  **Constraint Type**: **Contested**.  
  - *Will-based*: Standing if their concern is morally motivated.  
  - *Demand-based*: Standing only if they’re party to the norm (e.g., community member).  
  - *Functional*: Standing depends on whether their blame serves a useful purpose.  
  **Why tricky**: Must accommodate that some norms *are* everyone’s business (e.g., crimes against humanity).

  #### **5. Institutional Hypocrisy Test**  
  **Case**: A corporation blames an employee for pollution it systematically causes.  
  **Intuition**: The institution lacks standing—its blame is coercive evasion of responsibility.  
  **Constraint Type**: **Genuine** (highlights collective agency/power asymmetries).  
  **Distinction**: Lacks standing vs. being blameworthy *itself* (the institution is both).

  #### **6. Self-Blame Test**  
  **Case**: A person blaming themselves for a wrong.  
  **Intuition**: Self-blame seems *possible* and often appropriate—but is "standing" the right concept here?  
  **Constraint Type**: **Boundary Case**.  
  **Requirement**: Theory must explain if self-blame requires "standing" (e.g., integrity of self-relation) or if standing is inherently interpersonal.

  #### **7. Third-Party Advocacy Test**  
  **Case**: Blaming someone on behalf of a victim who cannot blame (e.g., a child).  
  **Intuition**: This feels legitimate (even obligatory) if done properly.  
  **Constraint Type**: **Genuine** (tests whether standing can be "delegated").  
  **Camps**: Demand-based: Requires the advocate to have a right to represent the victim’s interests.

  #### **8. The Co-Culpability Test**  
  **Case**: A partner in crime blames you for the same wrongdoing.  
  **Intuition**: Their blame seems worse than hypocritical—it’s exploitative or self-exculpatory.  
  **Constraint Type**: **Genuine** (harder than hypocrisy; may involve shared guilt).  
  **Key Insight**: Rules out theories where co-involvement automatically confers standing.

  ---

  ### **Mandatory Conceptual Distinctions**  
  *(All genuine constraints—failure to distinguish these invalidates a theory)*  

  - **Lacking standing vs. Blameworthy vs. Unwarranted blame**:  
    - *Lacking standing*: You’re not *positioned* to blame (e.g., hypocrite).  
    - *Blameworthy*: The *blamed* person deserves blame.  
    - *Unwarranted blame*: The blamed person *doesn’t* deserve blame (e.g., mistaken facts).  
    - *Ineffective/unwelcome blame*: Psychologically inept, rude, or ignored—but may still have standing.  

  - **Losing standing vs. Never had it vs. Unable to exercise**:  
    - *Losing*: Had standing but forfeited it (e.g., becomes a hypocrite).  
    - *Never had*: Never qualified (e.g., uninvolved bystander in private matters).  
    - *Unable to exercise*: Has standing but is silenced (e.g., victim of oppression).  

  - **Standing to resent vs. demand vs. sanction**:  
    - *Resent*: Emotional stance (may not require standing).  
    - *Demand*: Call for accountability (core for demand-based theories).  
    - *Sanction*: Imposing consequences (may require authority beyond standing).  

  - **Standing to blame vs. standing to be heard**:  
    - One can have standing to blame but lack credibility (no standing to be heard), e.g., a known liar blaming truthfully.  

  ---

  ### **External Real-World Constraints**  
  *(Genuine—theories must cohere with these facts)*  

  1. **Blaming is costly**: Social capital, emotional labor, risk of backlash.  
     → *Implication*: Standing cannot be so easy that blame is costless.  
  2. **Moral criticism targets the unable-to-respond**: E.g., blaming the dead, severely disabled, or powerful who ignore you.  
     → *Implication*: Standing cannot require reciprocity or dialogue.  
  3. **Unspoken blame is common**: Private resentment, withdrawn trust.  
     → *Implication*: Standing must apply to attitudes, not just speech acts.  

  ---

  ### **The Central Tension: The Hypocrite’s Paradox**  
  **The Problem**: If *any* moral failing strips standing (§1), and no one is faultless (§2), then *no one ever has standing*. But ex-smokers (§2) and bystanders (§4) sometimes *do*.  
  **Why it’s the killer constraint**: It forces theories to explain why *hypocrisy* specifically (not all faults) undermines standing.  
  - *Demand-based*: Hypocrites violate the equality condition (demanding what they deny others).  
  - *Will-based*: Hypocrisy reveals ill will (using blame to assert superiority).  
  - *Functional*: Hypocrisy makes blame ineffective for moral repair.  
  **Your suspicion is correct**: Most literature "wriggles" by restricting the relevant fault to *ongoing, norm-relevant* failures (e.g., Wallace) or invoking second-personal authority (Darwall).  

  ---

  ### **Suspicious "Requirement" to Cut**  
  **"Unspoken blame requires standing"**:  
  - **Why it’s a red herring**: Standing governs the *right to level blame*, not its expression. Private blame can be *irrational* or *uncharitable* but typically lacks "standing" issues—unless it leaks into action. Cut this; focus on *acts of blaming* (even mental acts like resentment).  

  ---

  ### **Summary: The Workhorse Requirement**  
  **The Hypocrite Test (§1) + No Universal Standing Loss (§8)** does the heaviest lifting:  
  - Rules out puritanical theories (any fault destroys standing).  
  - Rules out simple blameworthiness theories (hypocrite’s blame can be *true* yet defective).  
  - Forces theories to explain why hypocrisy is uniquely standing-destroying.  

  **Unresolvable Tension?**  
  - *Hypocrite (§1) vs. Bystander (§4)*: If a bystander can blame for grave wrongs but not petty ones, the theory must define "stakeholders" without circularity.  
  - *Hypocrite (§1) vs. Ex-smoker (§2)*: Requires a principled account of moral reform (e.g., whether one must "repay moral debts" to regain standing).  

  This spec defines the playing field: A viable theory must resolve the hypocrite’s paradox while accommodating the ex-smoker, bystander edge cases, and real-world practices—without collapsing key distinctions. Now scorecard away.
