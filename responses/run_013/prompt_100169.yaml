answer: |-
  ### Exam Question  
  **Section B: Essay Question (40 marks)**  
  *Answer ONE question from this section.*  

  **Question 3.**  
  Consider the following case:  
  > The research institute ‘Delphi’ has developed an AI system that answers factual questions in fluent prose. Every verified output from Delphi has been correct, but verification relies solely on the institute’s published reports. The system’s internal mechanisms are opaque to all, including its creators. Nadia, a postgraduate researcher, reads a Delphi answer to a query she cannot independently verify. She has no prior experience with Delphi beyond the institute’s claims of reliability, and she is inclined to believe its answer.  

  Assess whether Nadia is epistemically justified in believing Delphi’s testimony. In your answer, you must:  
  (a) Explain how a *local reductionist*, a *global reductionist*, and an *anti-reductionist* would each analyse this case;  
  (b) Evaluate which view best handles the core problem that the only evidence for Delphi’s reliability is itself testimony-based;  
  (c) Discuss whether anti-reductionism’s ‘default entitlement’ plausibly extends to non-human, opaque sources like Delphi.  
  Conclude by diagnosing what this case reveals about the fundamental disagreement between reductionism and anti-reductionism regarding the *structure* of testimonial justification.  

  ---

  ### Model Answer (Approx. 600 words)  
  Nadia’s case exposes unresolved tensions in the epistemology of testimony, particularly regarding whether hearers need positive reasons to accept testimony (reductionism) or enjoy a default entitlement (anti-reductionism). I argue that while reductionism struggles with circularity here, anti-reductionism faces a boundary problem about non-human testifiers, revealing that the core dispute concerns *whose contribution* justifies testimony—the hearer’s reasons or the speaker’s reliability.  

  First, **local reductionism** requires Nadia to have specific positive reasons to trust Delphi *for this particular claim*. Yet she lacks direct evidence of Delphi’s accuracy for her query and cannot cross-check the answer. Crucially, the institute’s reports—her sole evidence of reliability—are themselves testimony. Thus, local reductionism risks circularity: trusting Delphi requires trusting the institute’s testimony, which itself lacks independent verification. This undermines the requirement for non-testimonial reasons.  

  **Global reductionism** demands Nadia possess general inductive grounds to trust testimony as a source. However, her inductive base for trusting Delphi depends entirely on the institute’s reports. If those reports are challenged (e.g., as biased or deceptive), her justification collapses. Global reductionism thus encounters the same circularity: justifying testimony via other testimony fails to meet its demand for foundational non-testimonial evidence.  

  In contrast, **anti-reductionism** grants a default entitlement to trust testimony without prior positive reasons. For human testifiers, this avoids circularity by treating trust as presumptively legitimate. But Delphi complicates this: is a machine, especially one whose workings are inscrutable, a ‘testifier’ entitled to default trust? If anti-reductionism restricts entitlement to *human* speakers, this appears arbitrary—why should Nadia’s entitlement hinge on Delphi’s biology? Yet if anti-reductionism extends entitlement to AI, it must explain why opacity and non-agency don’t defeat the presumption of reliability. This exposes a tension in anti-reductionism’s scope.  

  The reductionist approaches fail here because they require Nadia to *independently verify* Delphi’s reliability, but the only verification available is testimonial. This circularity suggests reductionism sets an impossible standard when hearers lack direct epistemic access to a source’s track record. Anti-reductionism avoids this by making entitlement prior to evidence—but at the cost of needing to clarify whether its presumption applies to non-human sources. Delphi thus reveals that the dispute centres on whether justification flows *from the hearer’s reasons* (reductionism) or *from the speaker’s reliability* (anti-reductionism), and whether the latter requires consciousness or transparency.  

  Ultimately, this case shows the reductionism/anti-reductionism debate is not merely about ‘how much evidence’ is needed, but about the *order of justification*. Reductionists prioritise the hearer’s ability to monitor trustworthiness, while anti-reductionists treat testimony as a basic epistemic resource. Delphi forces both sides to confront the limits of their paradigms: reductionists cannot escape testimonial dependence, while anti-reductionists must justify extending human-centric norms to opaque AI. Nadia’s justification thus hinges on whether we view testimony as fundamentally social (favouring anti-reductionism) or evidentially individualist (favouring reductionism).  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points** (Award marks as below; total = 20. A answers demonstrate *insightful analysis*; B answers offer *accurate but descriptive* coverage.)  

  | **Point**                                                                                                | **Marks** | **A vs. B Distinction**                                                                                                 | **Typical Mistake**                                      |  
  |----------------------------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------|  
  | **1. Local reductionism’s analysis**: Explains its demand for specific reasons and the circularity problem arising from dependence on the institute’s testimony. | 4 | **A**: Explicitly links circularity to reductionism’s foundational requirements. **B**: Identifies circularity but doesn’t tie it to reductionist principles. | "Claims reductionism fails without explaining *why* circularity is fatal." |  
  | **2. Global reductionism’s analysis**: Details its need for general inductive grounds and shows how the testimonial nature of Delphi’s verification undermines this. | 4 | **A**: Contrasts global vs. local challenges effectively; notes collapse if reports are challenged. **B**: Treats global reductionism identically to local. | "Does not distinguish global reductionism’s reliance on testimony-based induction." |  
  | **3. Anti-reductionism’s analysis**: Explains default entitlement but critically examines whether it extends to non-human/opaque sources like Delphi. | 4 | **A**: Highlights arbitrariness of restricting to humans or problems of opacity/agency. **B**: States anti-reductionism’s verdict without probing boundary issues. | "Asserts anti-reductionism ‘wins’ without addressing non-human complications." |  
  | **4. Circularity critique**: Clearly articulates why reductionism’s evidence requirement fails when all reliability data is testimonial. | 3 | **A**: Diagnoses this as a structural flaw in reductionist frameworks. **B**: Notes circularity superficially. | "Calls it ‘problematic’ without explaining its epistemic consequences." |  
  | **5. Core disagreement**: Diagnoses the fundamental conflict (hearer’s reasons vs. speaker reliability) and how Delphi reveals assumptions about justification structure. | 5 | **A**: Explicitly contrasts ‘order of reasons’ vs. ‘source of entitlement’; links to social/individualist paradigms. **B**: Vaguely references ‘different views’ without depth. | "Concludes with ‘they disagree’ without characterising the dispute’s essence." |  

  **Grade boundaries (illustrative)**:  
  - **A (17–20)**: Insightful, critical, and structured; clearly separates positions, exposes circularity/boundary issues, and diagnoses the core dispute.  
  - **B (13–16)**: Accurate but less analytical; covers all views but with limited critique of circularity or boundary problems.  
  - **C (9–12)**: Descriptive overview; omits one key analysis (e.g., global reductionism) or misrepresents circularity.  
  - **D (5–8)**: Superficial; conflates positions, misses circularity/boundary issues.  
  - **E/F (0–4)**: Incomplete or erroneous; e.g., ignores Delphi’s opacity or testimony-dependence.  

  ---  
  **British English note**: Consistent throughout (e.g., "marking scheme", "analyse", "arbitrariness"). Model answer avoids citations, focusing on argumentative moves as requested.
