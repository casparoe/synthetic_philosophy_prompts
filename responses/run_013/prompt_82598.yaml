prompt: |-
  I've been reading about this 'bootstrapping' thing in philosophy and I keep feeling like I'm missing the actual point, so I'd like it explained properly rather than the usual 'it's circular, innit' shrug.

  Here's my version of it. My friend Dave reckons he knows his thermometer is accurate because he's tested it loads of times and it always reads 100 when the water boils. I said that's cheating — the only reason he thinks the waters boiling is that the thermometer said so. He says no, every step on its own is fine. He looks at the thermometer and sees 100 (that's just eyesight, nobody's doubting eyesight). He believes the water's boiling, which is fine if the thermometer is working. So he's got a case of the thermometer getting it right. Thirty times over and he's got a track record; from the track record he concludes the thermometer is reliable. Each step seems okay and the conclusion still seems unearned. Where exactly does it break?

  And here's the part I really can't sort out. My memory: I'm confident my memory is reliable, and part of why is that I remember it usually being right. That's obviously bad — memory vouching for itself. But Dave checking the thermometer with his eyes is fine, right? Different faculty. Except what his eyes are checking is whether the thermometer agreed with his eyes about the water, and his eyes are only ever checked against the thermometer or against other things he believes because of his eyes. So is 'a different faculty' doing any real work here, or is the whole issue just whether a faculty can ever vouch for itself, directly or one step removed? Because if it's the second one, then either all of it's fine or none of it is, and I don't believe all of it's fine.

  Also — is this the same worry as the 'easy knowledge' thing, or are those two different problems that get lumped together? And I've seen 'rule circularity' vs 'premise circularity' thrown around and I don't get what the difference is supposed to be or why it matters.

  So: what's the actual diagnosis? Is the mistake about circularity, about the order you're allowed to acquire justification in, or about the difference between having justification and being able to defend it? And is there any version of Dave's reasoning that does work? Explain it like I'm smart but haven't read any of the papers.
