prompt: |-
  I staff the tribunal our diocese convenes when someone claims a healing through the intercession of a candidate for sainthood, and my job is to decide which claims get a full investigation and which we decline. We see perhaps twenty claims in a decade, a decline is effectively final for the claimant, and our stated criteria are that the cure be complete, lasting, and medically inexplicable. Write me a decision procedure my team can actually run — a checklist in order, not a discussion — built out of Hume's argument about miracles rather than out of general skepticism. I need the questions to ask in sequence, what counts as a sufficient answer to each, the step where the procedure stops with a no, and the step where it hands the decision to a person because what remains is a question of faith rather than of evidence. Keep straight which parts of Hume's case bear on the evidence for this particular report and which bear on the credibility of reports of the miraculous in general, and include his concession that testimony can be credible when rejecting it would require believing something even more extraordinary. Then run the procedure on three claims: a tumor that disappeared after a pilgrimage, with before-and-after scans and three physicians willing to call the recovery unexplained; a claim resting on a single elderly witness devoted to the cause, who stands to gain nothing; and a healing of the same illness reported at a shrine belonging to a different religion. Our team is me, a consulting physician, and a canon lawyer; our recommendations go to the bishop, who signs off. Tell me where the procedure returns an answer I will not like, which steps are judgment calls dressed up as procedure, and what the procedure cannot do. Please write in American English.
reasoning: |-
  Okay, the user works for a Catholic diocese tribunal that investigates miracle claims for sainthood candidates. They need a practical decision procedure based on Hume's argument against miracles, not just general skepticism. Let me unpack Hume's key points first. Hume argues that miracles are violations of natural laws, and since human testimony can be flawed, we should weigh the improbability of the miracle against the improbability that the testimony is mistaken or deceitful.

  The user wants a step-by-step checklist that filters claims systematically. Their team handles about 20 claims per decade, and rejections are final for claimants. Criteria are: cure must be complete, lasting, and medically inexplicable. The procedure must distinguish between evidence for the specific case versus general credibility of miraculous reports. Also, Hume allows that testimony could be credible if rejecting it requires believing something even more extraordinary.

  I need to structure this as a linear checklist with clear pass/fail gates. Steps should cover: existence of the illness, completeness and durability of cure, medical inexplicability, reliability of witnesses, alternative explanations, and finally the "Humean balance" where we compare the improbability of the miracle versus the improbability of flawed testimony. The last step would hand off to the bishop for faith-based decisions.

  For the three test cases: 
  First, the tumor case with scans and doctors. This should pass most steps but hit the Humean balance - the miracle's improbability might outweigh testimony reliability. The user won't like rejecting solid evidence due to Hume's high bar. 

  Second, the single elderly witness. Fails at witness reliability step - insufficient corroboration regardless of devotion. 

  Third, the interfaith shrine healing. Fails at step 5 - violates the "same religion" requirement per Hume's argument that miracles only support specific doctrines.

  I should flag where judgment calls appear: medical inexplicability assessment, witness credibility evaluation, and the Humean balance itself - these aren't purely objective. Also note limitations: can't prove divine action, assess theological orthodoxy, or evaluate claimant's virtue.

  The procedure will frustrate the user when strong evidence gets rejected by Hume's strict standard (tumor case), and when steps like medical review require subjective judgment despite appearing procedural. It's designed to narrow claims to only the most testimony-resistant cases before passing to the bishop.
answer: |-
  Here is a decision procedure based on Hume's argument, structured as a sequential checklist for your tribunal. Steps derived from Hume's core argument are noted.

  **Hume-Based Miracle Claim Decision Procedure**

  1.  **CONFIRM DOCUMENTED ILLNESS:** Is there objective, contemporary medical evidence confirming the existence and severity of the illness *before* the claimed intercession/event?
      *   *Sufficient Answer:* Verified medical records (scans, biopsies, lab results, physician notes) demonstrating the condition.
      *   *Stop if No:* Claim declined. (Hume: Requires clear evidence a "violation of natural law" was even possible).

  2.  **CONFIRM COMPLETE & DURABLE CURE:** Is there objective, contemporary medical evidence confirming the illness is *completely resolved* and has remained so for a sufficient time (e.g., minimum 5 years, disease-dependent)?
      *   *Sufficient Answer:* Verified follow-up medical records showing absence of the disease and no recurrence within the defined period. Explanation for any residual effects required.
      *   *Stop if No:* Claim declined. (Hume: The "miracle" must be a clear, lasting disruption of natural course).

  3.  **ASSESS MEDICAL INEXPLICABILITY (Consult Physician):** Could the cure *plausibly* be explained by known natural processes (spontaneous remission, misdiagnosis, delayed treatment effect, placebo, etc.)?
      *   *Sufficient Answer for "Inexplicable":** Consulting physician concludes, based on current medical science and the specific case details, that no known natural explanation is adequate *or likely*. "Unexplained" (acknowledging limits of science) is the threshold for proceeding.
      *   *Stop if Yes (Plausible Explanation):* Claim declined. (Hume: We must always prefer the explanation that relies on known, frequently observed natural laws over a "miracle" which is, by definition, maximally improbable).

  4.  **EVALUATE WITNESS RELIABILITY & NUMBER:** Is the testimony for the cure event and its attribution to the intercession credible, corroborated, and free from obvious motive for deception or error?
      *   *Sufficient Answer:* Multiple independent, disinterested witnesses with good opportunity to observe, or exceptionally strong, verifiable documentation contemporaneous with the event. Witnesses must be mentally competent.
      *   *Stop if Insufficient:* Claim declined if testimony is solely from claimant/family, single source, internally inconsistent, or witnesses have clear bias/interest *in the sainthood cause itself*. (Hume: Testimony's credibility is paramount; inherent human fallibility necessitates scrutiny and corroboration. Testimony for the extraordinary requires extraordinary credibility).

  5.  **ASSESS ATTRIBUTION CONSISTENCY:** Was the intercession sought *specifically* to the candidate for sainthood within the Catholic faith?
      *   *Sufficient Answer:* Contemporaneous documentation or credible testimony showing prayer/act of intercession directed *specifically* to the candidate.
      *   *Stop if No (e.g., prayed to God generally, to a different saint, or within a non-Catholic context):* Claim declined. (Hume: A miracle's purpose is to support a *specific* system of religion; an event supporting a rival system or no system undermines its probative value for *this* cause).

  6.  **HUMEAN BALANCE TEST:** Would believing the testimony (that this specific cure resulted from this specific candidate's intercession) require believing something *less* probable than believing the testimony is mistaken, exaggerated, or based on an unknown natural cause?
      *   *Sufficient Answer for Proceeding:* The combined improbability of *all* alternative explanations (error, fraud, unknown natural cause) is judged *greater* than the inherent improbability of a miracle (violation of natural law) *in this specific instance*, given the evidence reviewed in Steps 1-5. (Invokes Hume's concession).
      *   *Stop if "Miracle" More Improbable:* Claim declined. (Hume: Core argument - A wise man proportions belief to evidence; the inherent extreme improbability of miracles means testimony must be so strong that its falsehood would be even *more* miraculous).
      *   *Hand-off if "Testimony Falsehood" More Improbable:** Proceed to Step 7. (Hume's concession).

  7.  **FAITH & DOCTRINAL JUDGMENT (Bishop):** Does the evidence, having passed Steps 1-6, reasonably support the conclusion *within the context of faith* that this cure was a divine act wrought through the intercession of the specific candidate?
      *   *This step is for the Bishop.* The tribunal presents the evidence and analysis from Steps 1-6. The Bishop evaluates if the inexplicable event can be attributed, by faith, to the candidate's intercession for the cause of sainthood.

  **Application to Test Cases & Procedure Analysis**

  1.  **Tumor Case (Scans, Physicians):**
      *   Step 1: Pass (Scans confirm tumor).
      *   Step 2: Pass (Scans confirm disappearance, assume durable).
      *   Step 3: Pass (Physicians call it unexplained - meets threshold).
      *   Step 4: Pass (Medical records are objective witnesses; physician statements corroborate inexplicability).
      *   Step 5: Pass (Assuming pilgrimage was specifically for this candidate).
      *   Step 6: **Humean Balance Test - Likely STOP/Decline.** Here's the rub. While the evidence is strong, Hume would argue the *inherent improbability of a true miracle* (a violation of physics/biology) is *always* vastly greater than the improbability of: a) a rare spontaneous remission (known to occur, even if unexplained *here*), b) subtle error in initial diagnosis or scans, or c) an unknown natural mechanism. The physicians say "unexplained," not "impossible naturally." The testimony's falsehood (or natural cause being missed) isn't judged *more* improbable than a miracle. **This is where the procedure gives an answer you won't like.** Despite strong evidence, Hume's high bar for overcoming the inherent improbability of a miracle isn't met. The Bishop never sees it.

  2.  **Single Elderly Witness (Devoted, No Gain):**
      *   Step 1: Questionable (Relies solely on witness testimony for initial illness? Needs medical records).
      *   Step 2: Questionable (Relies solely on witness testimony for cure and durability? Needs records).
      *   Step 3: Cannot be assessed without objective medical evidence.
      *   Step 4: **STOP/Decline.** Regardless of devotion or lack of material gain, a single witness is insufficiently corroborated. Human fallibility, suggestibility, or honest misremembering over time is significantly more probable than a miracle. (Hume: Insufficient credibility for the extraordinary claim).

  3.  **Different Religion Shrine:**
      *   Step 1: (Assumes passes with evidence).
      *   Step 2: (Assumes passes with evidence).
      *   Step 3: (Assumes passes).
      *   Step 4: (Assumes passes).
      *   Step 5: **STOP/Decline.** The intercession was not sought *specifically* to the Catholic candidate for sainthood; it occurred within the context of a different religious system. (Hume: A miracle's evidential value is tied to supporting the specific religion where it occurs; this event supports a rival system).

  **Where the Procedure Returns an Answer You Won't Like:**

  *   **Step 6 (Humean Balance) on strong medical cases (like Tumor Case):** Hume's core argument sets an extremely high bar. Medically "unexplained" is common; a true miracle violating natural law is, by Hume's definition, maximally improbable. The procedure will likely decline many cases with good evidence simply because the alternative explanations (unknown nature, rare remission) are judged *less* improbable than a miracle, even if highly unlikely themselves. This prioritizes Hume's skepticism over the tribunal's "medically inexplicable" criterion.

  **Judgment Calls Dressed as Procedure:**

  1.  **Step 3 (Medical Inexplicability):** The physician's judgment of "no *adequate* or *likely* natural explanation" is inherently subjective. What constitutes "adequate" or "likely"? This is an expert judgment call framed as a procedural gate.
  2.  **Step 4 (Witness Reliability):** Assessing "credibility," "bias," and "sufficient corroboration" involves significant subjective judgment, especially for borderline cases. How much corroboration is enough? How strong must countervailing bias be to disqualify?
  3.  **Step 6 (Humean Balance):** This is the biggest judgment call. Quantifying and comparing the "improbability of the miracle" vs. the "improbability of testimony being flawed/natural cause being unknown" is profoundly subjective. It requires weighing intangible probabilities based on worldviews. It's Hume's core philosophical stance operationalized as a procedural step.

  **What the Procedure Cannot Do:**

  1.  **Prove Divine Action:** It can only assess if an event is inexplicable *by natural means* and passes Humean skepticism about testimony. Attributing it to God via a specific saint remains a matter of faith (Step 7).
  2.  **Assess the Claimant's Virtue or Holiness:** It focuses solely on the evidence for the *event*.
  3.  **Overcome Hume's Fundamental Skepticism:** The procedure is built *on* Hume's argument. It will be inherently skeptical, prioritizing natural explanations and demanding near-impeccable testimony. It cannot validate miracles Hume's framework would reject.
  4.  **Eliminate Subjectivity:** As noted, key steps (3,4,6) require professional and philosophical judgment.
  5.  **Guarantee "True" Miracles are Found:** It's designed to filter out claims Hume would reject. Some events passing Step 6 might later be explained naturally. Others truly miraculous by faith might fail Step 6.
  6.  **Address Non-Physical Healings:** Focuses on objective, medically verifiable conditions.

  This procedure rigorously applies Hume's logic, prioritizing the extreme improbability of miracles and the fallibility of testimony. It will significantly narrow the field, likely declining the Tumor Case and others like it at Step 6, while providing clear, philosophy-based grounds for declining the other two cases earlier. The final step explicitly acknowledges the transition from evidence assessment to faith-based judgment by the Bishop.
