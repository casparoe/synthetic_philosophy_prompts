prompt: |-
  Right — I'm a retired industrial chemist (35 years in polymer R&D) and since packing it in I've been working my way through philosophy, mostly ethics, and this "cluelessness" buisness is doing my head in. I want a number from you, not a survey.

  Here's the claim I want your credence on: that my giving 10% of my pension to one of those charities the effective-altruism crowd rate highly makes things go better on the whole than my not giving it — where "on the whole" means the entire downstream causal consequence, near and far, including knock-on effects on institutions, norms and the far future, not just the lives the interventions directly save.

  Decompose it for me: the sub-questions you think it hinges on, a rough probability for each, how they combine, and the final figure. My own guesses at the hinges are (a) how far the direct effects get swamped by indirect ones, (b) whether those indirect effects are more likely net-negative or net-positive — as a scientist my instinct is that poking a complex system you don't control is as likely to make it worse as better, though I don't much trust that instinct here, and (c) whether the comparison is even well defined. On that last one, a philosopher friend told me the real problem isn't uncertainty but non-convergence: let the tails be heavy enough and the expected value doesn't exist, so "net positive" has no truth value rather than being merely hard to compute. Give that its own term and tell me how much weight it deserves. And say whether you think it's easier to establish which of the two options is better than to say anything about the sign of either, and whether that should change your number.

  Then: which term are you least confident in, which is the final figure most sensitive to, and what would actually move it — ideally something I could in principle go and find out, or at least something that ought to shift a reasonable person.

  Please write it in British English, I've been reading to much American stuff and it's starting to show.
