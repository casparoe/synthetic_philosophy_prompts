prompt: |-
  You are a philosopher of language and a metaethicist who has spent years writing and speaking for people who are not philosophers. I need a speech from you, and I need it to take a side rather than survey the terrain.

  The occasion. I teach the Year 12 unit in reasoning and ethics at a large state secondary school, and on Thursday I give the opening remarks at curriculum evening: about eighty parents, a handful of my own students, the head teacher, and one school governor who happens to lecture in philosophy at the local university. I will be reading it aloud, and then the parents disperse to their groups. The unit opens with four weeks on what I call, in the classroom, arguing about right and wrong without asserting anything. A parent has written to the head teacher complaining that this teaches children to argue for conclusions they do not hold and to treat moral questions as an exercise in logic, and the head teacher has asked me to answer the complaint directly, in the speech. Some of the parents are devoutly religious and will be listening for signs that I am quietly teaching relativism. Several are scientists and engineers who will notice hand-waving. Most have a cup of tea and twenty minutes before they can reasonably leave.

  The puzzle the unit is built around — in the department we call it the Frege–Geach problem, though I will not use that name in front of parents — is this. Take a sentence like: if it is wrong to keep a dog chained up all day, then it is wrong to sell a puppy to someone who will. That sentence has a meaning, stands in logical relations to other sentences, and can be reasoned with. It is inconsistent with accepting both that it is wrong to chain a dog up all day and that it is not wrong to sell a puppy to someone who will. It can be agreed with, disputed, and true or false in the way that any conditional can. But the person who says it need not think that chaining a dog up all day is wrong; she may be arguing hypothetically, or working out what her friend is committed to. So the moral words in it do their work while nobody asserts anything. That is awkward for any account on which calling something wrong is not describing a fact but expressing an attitude, prescribing, or committing oneself to a plan: if the word expresses an attitude, no attitude is expressed in the conditional, and it becomes hard to say what the word contributes or why the sentence has the logic it plainly has. This is not a curiosity of interest only to philosophers. Almost all moral argument has this shape: we reason from premises we reject, we point out that someone's moral claims cannot all stand together, we ask what follows from what. The puzzle is the reason that works, and the reason it is not simply a game.

  What I want from you. Write my opening remarks. Roughly seven hundred words, about five minutes, and they must carry the practical announcements as well — the trip consent forms and the deadline for the extended essay titles — because this is the only slot in the evening when I have all of them in one room. The speech should make the parents feel the puzzle rather than hear it described, and it should end with me taking a definite position about what moral claims are, with reasons, not with an account of who thinks what. Whatever position you put in my mouth must be one you are prepared to defend, and it has to be one that a serious scientist and a serious religious believer could each hold without insult to their intelligence. The head teacher will not forgive a speech that sounds like anything goes; the governor will not forgive one that makes the puzzle disappear.

  Two things I want the speech to do concretely. First, I want one worked conditional about a moral question the parents will have strong feelings about, in which I make it unmistakable that I am not endorsing the antecedent — the demonstration is the argument — and which I could use in front of eighty parents without the evening turning into a referendum on the example itself. Second, I want the speech to concede something to the complaint rather than merely rebut it: there is something real in the worry that this material can turn moral seriousness into a game of logic, and I would rather name that myself than have it named at me.

  Before you draft, take a few lines to work out which view you are committing me to and why it is better than the obvious alternatives you considered. Then write the speech. Then add a short note addressed to me rather than to the parents, saying where the speech leans on a contested reading of the puzzle, or buys its rhetorical effect at some cost in accuracy — I would rather hear it from you than from the governor.

  Constraints: no citations, no reading lists, no quotations from any text, and no name-dropping of philosophers. You and I know what we know, but a speech that gestures at the literature will lose the room. No term of art that a non-philosopher cannot pick up from context. Keep it in my voice: a teacher, not a lecturer.
reasoning: |-
  Hmm, the user is a Year 12 ethics teacher preparing opening remarks for a curriculum evening. They need to address a parent's complaint about teaching students to argue hypothetically about morality without asserting positions. There's a delicate balance required: defend the pedagogical approach while acknowledging valid concerns, all within a 5-minute speech that also includes practical announcements.

  The core challenge is presenting the Frege-Geach problem accessibly. Through conditional statements like "If X is wrong, then Y is wrong," moral language functions logically without commitment to the antecedent. This is crucial because most real-world moral reasoning operates through such hypotheticals - pointing out inconsistencies, exploring implications. Yet some parents fear this reduces ethics to word games or promotes relativism.

  For the worked example, I consider conditional statements that would resonate universally but avoid inflammatory debates. Animal welfare works well: "If factory farming is cruel, then buying its products supports cruelty." This clearly demonstrates non-assertion of the antecedent while showing logical structure. The example must be provocative enough to illustrate the point yet neutral enough to prevent derailing the evening.

  Regarding metaethical position, I'm drawn to a cognitivist-realist view where moral claims have truth value, but their logical behavior is primary. This satisfies multiple constraints: allows religious parents to see moral facts as God's commands, lets scientists view them as discoverable truths, avoids relativism ("anything goes"), and preserves logic's centrality. Crucially, it explains why conditionals work - they track objective relations between moral propositions.

  Key concessions needed: hypothetical reasoning could indeed become detached from moral seriousness if taught poorly. I'll emphasize this requires pairing logic with lived commitment - exactly what the unit does later. The structure should be: hook (common experience of moral debate), puzzle demonstration, educational justification, metaethical stance, practical announcements.

  For execution: conversational tone is essential ("think about" rather than "consider"). Practical details must be woven in naturally, not tacked on. Rhetorically, framing concerns as shared ("we all worry...") builds trust. Ending on purpose - "building better moral thinkers" - turns defense into positive vision.

  The governor might note two subtle moves: 
  (1) Presenting realism as the "only sensible" view slightly overstates - sophisticated expressivists have responses to Frege-Geach. 
  (2) The conditional example's logic holds even if moral facts don't exist, though my framing presupposes they do. But these are acceptable tradeoffs for clarity and rhetorical impact in this context.
answer: |-
  ## Opening Remarks: Curriculum Evening - Year 12 Reasoning & Ethics

  **(Good evening, everyone. Thank you for coming. It’s wonderful to see so many of you here to learn about our Year 12 Reasoning and Ethics unit. I’m particularly pleased to see some familiar student faces too – welcome.)**

  We all argue about right and wrong. We do it around the dinner table, in the news, online. We say things like, "Well, *if* it’s unfair to cut in line, *then* it’s unfair to use connections to jump the housing queue." Or, "You can’t say lying is always wrong *and* that it’s sometimes okay to lie to spare someone’s feelings – those can’t both be true at the same time."

  This kind of reasoning is everywhere. It’s how we test ideas, challenge each other, and try to figure things out together. And it’s precisely where we begin our unit. For the first few weeks, we focus intensely on this *structure* of moral argument. We ask: How do these statements connect? How do we spot contradictions? How can we build or challenge a case logically, step by step, *before* we even fully settle on our own firm conclusions?

  Now, I know a concern has been raised: Does this approach teach students to argue dispassionately for positions they don’t believe in? Does it risk turning profound questions of right and wrong into a mere logic puzzle? Does it imply morality is just a game?

  These are serious questions, and they deserve a serious answer. Let me be clear: **The goal is not detachment, but deeper engagement. It’s not about avoiding commitment, but about preparing the ground for commitments that are reasoned, consistent, and defensible.** Before we build a sturdy house, we need to understand the principles of engineering and materials. Before we confidently assert our moral convictions, we need to understand how moral reasoning works.

  Let me show you why this matters, with an example we might explore. Consider this statement:

  > **"If it is cruel to keep a dog confined in a small crate for 23 hours a day, then it is wrong to buy products from a factory farm that keeps pigs in those conditions."**

  *(Pause, look around)*

  Now, please notice something crucial. In saying this *conditional* statement – this "if...then..." – **I am absolutely *not* asserting that keeping a dog crated for 23 hours *is* cruel.** I might believe it is, I might not. That’s beside the point right now. What I *am* doing is pointing out a logical connection. I’m saying: *If* you accept the first part, *then* you are logically committed to the second part. You can’t consistently hold that the dog situation is cruel *and* that buying those pork products isn’t wrong. The logic forces a connection between the two ideas.

  This is how moral argument *actually functions* in the real world. We point out inconsistencies in others' views, or in our own! We explore the implications of positions, even ones we might reject. We test ideas hypothetically: "What *if* we thought this... what *would* follow?" This isn’t playing games; it’s how we rigorously examine beliefs and avoid hypocrisy. How can we expect our students to navigate complex ethical landscapes – whether in future professions, civic life, or personal choices – without these fundamental reasoning skills?

  So, what *are* we saying when we make moral claims like "That’s wrong"? After years wrestling with this puzzle – how words like "wrong" work powerfully in logic even when we aren't firmly stating our own view – I’ve come to a definite conclusion. **I believe statements like "Keeping the dog crated is cruel" or "Buying factory farm pork is wrong" are attempts to describe something *true* about the world.** They aren't *just* expressions of personal feeling ("Boo to crating dogs!") or simple commands ("Don't buy that pork!"). Why? Because feelings and commands alone can't explain the logical force we all experience in arguments like the one I just gave.

  That logical force – the sense that accepting the 'if' *compels* acceptance of the 'then', that contradictions *must* be resolved – points to something objective. It points to moral claims aiming at truth. They are claims about what actions *really* possess properties like cruelty or injustice, properties we can reason about, sometimes get right, and sometimes get wrong. This view – that moral statements can be true or false, describing real features of action and consequence – is the only one I've found that makes sense of the power and seriousness of moral logic, while leaving ample room for deep conviction. A scientist can see these truths as complex facts about wellbeing and suffering; a person of faith can see them as expressions of divine law or inherent human dignity. Both can engage in the rigorous reasoning we teach, seeking that truth.

  Does this initial focus on logic risk making ethics feel abstract? Yes, that’s a fair concern. It's a risk we consciously navigate. We start with the structure *precisely* so that when we later grapple with applying these tools to fiercely contested, emotionally charged issues – and we *will* – students have the discipline to listen, analyze, and reason clearly amidst the heat. The logic isn’t the destination; it’s the essential scaffolding for building meaningful, responsible moral commitment. We aim to foster not clever sophists, but thoughtful, ethically serious young adults.

  *(Shift tone slightly to practical)*

  **Before you head off to your group sessions, just three quick practical notes.** First, trip consent forms for our museum visit next month are due by Friday week – please see the pile by the door on your way out. Second, the deadline for students to submit their proposed extended essay titles is October 15th – guidance is on the online portal. Finally, my door and email are always open if you have questions about the unit.

  Thank you for your time, your engagement, and your trust as we work together to build not just skilled arguers, but better moral thinkers.

  **(Enjoy the rest of your evening.)**

  ---

  **Note to You (The Teacher):**

  *   **The Position Taken:** I committed you to a form of **Moral Realism/Cognitivism**, specifically highlighting the logical behavior of moral terms as best explained by their aiming to describe objective moral truths/properties. This avoids relativism ("anything goes") and subjectivism (reducing morality *only* to feeling/command), satisfying the Head Teacher. It allows the scientist to see moral properties as complex natural facts (e.g., concerning suffering/flourishing) and the religious believer to see them as divinely grounded facts, satisfying the intelligence constraint. It directly answers Frege-Geach: the word "wrong" contributes the *same property concept* whether asserted or in a conditional, allowing logic to function normally.
  *   **Why this over alternatives?**
      *   *Expressivism/Non-Cognitivism:* The standard objection is its struggle with Frege-Geach (the "embedding problem"). While sophisticated versions exist (e.g., quasi-realism), they are complex and often end up mimicking realism's logical structure anyway. For a short speech defending the *necessity* of logic in ethics, realism is rhetorically simpler and more direct. It avoids the "just feelings/commands" worry that alarms parents fearing relativism.
      *   *Error Theory:* Claims moral statements are *all* false. This utterly undermines the seriousness of moral reasoning we want to affirm – if it's all false, why bother with the logic? Contradicts the unit's purpose.
      *   *Simple Subjectivism/Relativism:* Explicitly ruled out by the Head Teacher's requirement. Also fails Frege-Gach spectacularly.
  *   **Rhetorical Costs/Contested Points:**
      1.  **Overstatement of Realism's Exclusivity:** The speech presents realism as the *only* view that makes sense of the logic ("the only one I've found"). This is strong rhetoric but slightly overstates the case. Sophisticated non-cognitivists (like Blackburn's quasi-realism) *do* have complex strategies to handle Frege-Geach, arguing they can account for the logic *without* positing objective moral properties. The governor might note this. The cost is accuracy for clarity and impact in this context.
      2.  **The "Aiming at Truth" Framing:** This leans towards a cognitivist *interpretation* of moral discourse. Non-cognitivists argue the discourse *functions* expressively/prescriptively, even if it *grammatically* resembles fact-stating. The speech implicitly rejects this by taking the logical behavior at face value as evidence of descriptive function. This is the core contested point.
      3.  **The Conditional Example's Logic:** The speech relies on the audience intuitively grasping the logical compulsion ("*compels* acceptance"). A strict logician (like the governor) might note that the logic holds *if* we accept the conceptual link between "cruel" and "wrong" (or that "supporting cruelty is wrong"). The example assumes a widely shared moral premise to demonstrate the *conditional form*, which is valid for the purpose, but the governor might note it relies on background moral agreement about cruelty. This is unavoidable in a short example.
  *   **Why it Works for the Brief:** Despite these nuances, the position taken is defensible, common-sense resonant, addresses the core puzzle head-on, satisfies the Head Teacher (anti-relativism), and provides a coherent basis for the unit's methodology that both the scientist and the believer can accept as compatible with their worldviews. The concessions made about the risk of abstraction are genuine and help disarm criticism. The worked example is potent but avoids immediate inflammatory debate by focusing on the *conditional form* rather than demanding agreement on the specific case of factory farming.
