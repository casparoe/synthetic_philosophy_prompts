prompt: |-
  I'm in a reading group that spans formal epistemology and machine learning, and we keep going in circles because everyone proposes a fix for the problem of induction before we have agreed on what a fix would have to be. So before we read anything else, I want the specification. What would a theory of inductive inference — a theory that says which inferences from observed data to unobserved cases are licensed, and on what basis — actually have to deliver to count as adequate? Give me the desiderata, each with the case or consideration that motivates it. Some I expect to see: it has to engage the Humean circularity rather than restate it; it has to handle the grue-style cases, where two hypotheses agree on everything observed and diverge afterwards, without simply ruling the gerrymandered predicate out by fiat; it has to give an account of simplicity, or of prior probability, that is not a relabeling of the conclusion it is meant to support; and it has to come to terms with the no-free-lunch results — averaged over all possible target functions, no learner beats any other, so any inductive bias the theory endorses has to be defended as a bias rather than derived from the data alone. I also want the requirements people usually leave implicit: whether the theory must be computable; whether it must justify itself without already presupposing induction; whether it must survive the fact that the no-free-lunch results are proved under a particular assumption about the space of problems, and what becomes of the argument when that assumption is relaxed; whether it must distinguish prediction from accommodation of the same data; and whether a purely descriptive account of how we in fact generalize could satisfy anyone, or whether the demand is irreducibly normative.

  Then, with the list in hand, tell me which of these are genuine desiderata and which are parochial demands of one camp — the Bayesian, the algorithmic-complexity camp, the learning-theory camp, the pragmatist who says no justification is needed at all — and flag any pair or subset of the requirements that looks jointly unsatisfiable; if some subset is, I take that to be the most interesting result on offer and I want it spelled out. Keep the weight on the criteria and their motivating cases rather than on scoring the contenders; a short scorecard at the end is welcome, but the criteria are what I am after. Say how confident you are in each part of the list and single out the one requirement you are least sure belongs on it. No reading list or citations needed. End with a final line of the form \answer{the single requirement that does the most to exclude existing theories, in a short phrase}.
reasoning: |-
  We are to list the desiderata for an adequate theory of inductive inference. The focus is on what the theory must deliver, with each desideratum motivated by a case or consideration. We must also address implicit requirements and note conflicts. Finally, we will end with the requirement that most excludes existing theories.

  The user has provided some expected desiderata and also raised several implicit ones. We will structure the answer accordingly.

  **Desiderata for an Adequate Theory of Inductive Inference**

  1. **Engagement with Humean Circularity**  
     *Motivation:* Hume pointed out that any justification of induction either relies on induction (thus circular) or on a deductive principle that is not available. An adequate theory must either break the circle or provide a non-question-begging account of why it is unavoidable and yet acceptable.  
     *Confidence:* High. This is a foundational challenge.

  2. **Resolution of Grue-style Paradoxes**  
     *Motivation:* Goodman's grue paradox shows that for any set of observations, multiple hypotheses (e.g., "all emeralds are green" vs. "all emeralds are grue") are equally consistent with the data. The theory must provide a non-arbitrary basis for preferring one hypothesis over the other without simply banning predicates like "grue" by fiat.  
     *Confidence:* High. This tests the theory's ability to handle underdetermination.

  3. **Non-arbitrary Account of Simplicity or Priors**  
     *Motivation:* Simplicity (or prior probability) is often invoked to break ties between hypotheses. But if the theory defines simplicity in a way that merely reflects our prior expectations, it risks being circular. The theory must ground simplicity or priors in something beyond a relabeling of the desired conclusion.  
     *Confidence:* High. This is crucial for non-arbitrary inference.

  4. **Accountability to No-Free-Lunch Theorems**  
     *Motivation:* No-Free-Lunch (NFL) theorems state that, averaged over all possible problems, no learning algorithm is better than any other. Therefore, any bias a theory endorses must be defended as appropriate for the expected domain, not derived solely from the data. The theory must justify its inductive bias without relying on the data alone.  
     *Confidence:* High. NFL is a fundamental constraint.

  5. **Computability (Implicit Requirement)**  
     *Motivation:* If the theory is to be usable by humans or machines, it must be computable. However, some might argue that a normative theory need not be computable. The motivation here is practical: we are finite beings.  
     *Confidence:* Moderate. While a normative theory might be idealized, for a reading group spanning ML, computability is likely expected.

  6. **Non-presupposition of Induction (Implicit Requirement)**  
     *Motivation:* The theory must not presuppose the very inductive inferences it seeks to justify. For example, it cannot rely on the success of past inductions to justify future ones without circularity.  
     *Confidence:* High. This is a key point in the Humean challenge.

  7. **Robustness to Variations in Problem Space (Implicit Requirement)**  
     *Motivation:* NFL theorems assume a uniform distribution over all possible target functions. But in practice, we do not face a uniform distribution of problems. The theory must either work under the NFL setting or explain why the real-world problem space is structured so that the NFL assumptions do not apply.  
     *Confidence:* Moderate. This is important for the theory's applicability.

  8. **Distinction Between Prediction and Accommodation**  
     *Motivation:* A hypothesis that is adjusted to fit existing data (accommodation) should not be given the same credence as one that predicts new data. The theory must account for this distinction to avoid ad hoc hypotheses.  
     *Confidence:* High. This is a standard challenge (e.g., in Popper).

  9. **Normative Force**  
     *Motivation:* A purely descriptive account of how we in fact generalize (e.g., by cognitive biases) would not satisfy the normative demand: we want to know how we *should* infer. The theory must be normative, providing a justification for inductive practices.  
     *Confidence:* Moderate to High. Some (e.g., naturalists) might argue for a descriptive account, but the philosophical tradition demands normativity.

  **Potential Conflicts and Parochial Demands**

  - **Joint Unsatisfiability?**  
    The most challenging conflict is between the **non-presupposition of induction** and the **normative force**. How can we justify induction without using induction? This is the core of Hume's problem. Any solution that breaks the circle (e.g., by a deductive principle) might be accused of being non-inductive. On the other hand, a pragmatic response (e.g., we must use induction to function) might not provide the normative force required.

  - **Parochial Demands:**  
    - *Bayesians* might downplay the need to break Humean circularity, instead accepting priors as subjective and focusing on coherence.  
    - *Algorithmic-complexity* theorists (e.g., Solomonoff) might claim to have a non-arbitrary prior (based on simplicity via Kolmogorov complexity) and ignore computability because their prior is not computable.  
    - *Learning-theory* camp (e.g., PAC learning) might focus on computability and efficiency but not address the Humean problem.  
    - *Pragmatists* (e.g., no justification needed) would reject the normative demand and the non-presupposition requirement.

  **Which Desiderata are Genuine?**  
  All the above are genuine in the sense that they are raised by one or more serious philosophical or technical challenges. However, some might be more central than others.

  **Scorecard of How Existing Camps Fare (Brief):**  
  - *Bayesians:* Do well on grue (via priors) and prediction vs. accommodation (via updating). But they struggle with non-arbitrary priors and Humean circularity.  
  - *Algorithmic-complexity:* Offers a non-arbitrary prior (Kolmogorov) and handles grue (simpler predicates preferred). But it is incomputable and does not break Humean circularity.  
  - *Learning-theory:* Addresses computability and NFL (by restricting the hypothesis space) but does not engage with Hume or grue in a fundamental way.  
  - *Pragmatists:* Reject the need for justification, thus avoiding Hume, but fail to provide normative force.

  **Least Sure Desideratum:**  
  **Computability**. While important for implementation, a foundational theory might be allowed to be idealized. However, in the context of ML, it is crucial.

  **The Requirement That Most Excludes Existing Theories**  
  The requirement that does the most to exclude existing theories is: **Non-presupposition of Induction** (i.e., breaking Humean circularity without begging the question). No existing theory has done this to universal satisfaction.

  \answer{Non-presupposition of induction}
answer: |-
  ### Desiderata for an Adequate Theory of Inductive Inference  
  Below are the criteria an adequate theory must satisfy, each motivated by a specific case, problem, or consideration. The list includes explicit and implicit requirements, with confidence levels (High/Medium/Low) indicating how strongly each is supported by the literature or logical necessity. Desiderata are genuine if they address a core challenge in induction; parochial demands are noted as such. Conflicts are flagged where they arise.  

  #### Core Desiderata  
  1. **Engagement with Humean Circularity**  
     - **Motivation**: Hume's problem shows that justifying induction requires either circularity (using induction to justify induction) or an unsupported deductive principle (e.g., "the future resembles the past"). A theory must either resolve this circularity or provide a non-question-begging account of why it is unavoidable yet rationally acceptable.  
     - **Confidence**: High. This is the bedrock challenge in epistemology.  
     - **Genuine or Parochial**: Genuine; all major camps (e.g., Bayesians, pragmatists) engage with it, though resolutions differ.  

  2. **Resolution of Grue-style Paradoxes**  
     - **Motivation**: Goodman's "grue" paradox (where "grue" means green if observed before time *t*, else blue) demonstrates that infinitely many hypotheses fit all observed data but diverge on unobserved cases. A theory must non-arbitrarily prefer some hypotheses (e.g., "green") over gerrymandered alternatives without ad hoc bans on predicates.  
     - **Confidence**: High. This tests the theory's handling of underdetermination and projectability.  
     - **Genuine or Parochial**: Genuine; it exposes flaws in naïve empiricism and affects all camps.  

  3. **Non-Arbitrary Grounding of Simplicity or Priors**  
     - **Motivation**: Simplicity (e.g., in curve-fitting) or prior probabilities are often used to break ties between hypotheses. But if "simplicity" is defined circularly (e.g., "what we prefer") or subjectively, it merely relabels bias. A theory must ground these in objective features (e.g., computational structure, ontological parsimony) or justify why subjectivity is unavoidable.  
     - **Motivation Case**: Polynomial regression prefers simpler curves; this must not rest on "simplicity" being a synonym for "likely."  
     - **Confidence**: High. Central to avoiding arbitrariness in inference.  
     - **Genuine or Parochial**: Genuine; algorithmic-complexity theories (e.g., Solomonoff) aim for this, but Bayesians often accept subjective priors as unavoidable.  

  4. **Accountability to No-Free-Lunch (NFL) Theorems**  
     - **Motivation**: NFL theorems prove that no learner outperforms others averaged over *all possible* target functions. A theory must defend its inductive bias (e.g., preference for smooth functions) as appropriate for *actual* problem spaces (e.g., the physical world), not derived from data alone.  
     - **Motivation Case**: Using a linear model for climate prediction assumes the world is "smooth"; this bias must be argued, not inferred from data.  
     - **Confidence**: High. NFL is a mathematical constraint; ignoring it risks vacuity.  
     - **Genuine or Parochial**: Genuine; the learning-theory camp emphasizes this, but pragmatists might dismiss it as irrelevant to practice.  

  #### Implicit or Often-Overlooked Desiderata  
  5. **Computability**  
     - **Motivation**: If the theory prescribes inferences (e.g., in real-world ML systems), it must be implementable by finite agents. Non-computable theories (e.g., ideal Bayesian reasoning with uncomputable priors) are practically inert.  
     - **Motivation Case**: Solomonoff induction is uncomputable; a theory must avoid requiring supernatural resources.  
     - **Confidence**: Medium (High for ML applications; Low for purely normative accounts).  
     - **Genuine or Parochial**: Genuine but parochial to computationally minded camps (e.g., learning theory). Algorithmic-complexity theorists often idealize away computability.  

  6. **Non-Presupposition of Induction**  
     - **Motivation**: The theory cannot justify induction by *assuming* induction works (e.g., "induction succeeded before, so it will again"). This recreates Humean circularity. It must bootstrap rationality without inductive premises.  
     - **Motivation Case**: Justifying a prior based on past success of similar priors presupposes induction.  
     - **Confidence**: Medium. Some (e.g., Wittgensteinians) argue this demand is too strict; others see it as essential.  
     - **Genuine or Parochial**: Genuine for foundationalists; parochial to pragmatists who reject the need for bootstrapping.  

  7. **Robustness to Problem-Space Assumptions**  
     - **Motivation**: NFL theorems assume a uniform distribution over *all possible* problems, but real-world problems are structured (e.g., physical laws are simple). A theory must either work under NFL or justify why its bias suits actual (non-uniform) problem spaces.  
     - **Motivation Case**: If the problem space favors low-complexity functions (e.g., in nature), NFL can be circumvented; the theory must not rely on this being true by fiat.  
     - **Confidence**: Medium. Often implicit in learning theory; ignored by Bayesians who assume fixed priors.  
     - **Genuine or Parochial**: Genuine; failure here makes NFL a lethal objection.  

  8. **Distinction Between Prediction and Accommodation**  
     - **Motivation**: A hypothesis that predicts unseen data should be preferred over one retrofitted to fit existing data (accommodation), as the latter can always be constructed ad hoc. The theory must explain this asymmetry without probabilistic sleight-of-hand.  
     - **Motivation Case**: A cosmological model predicting new particle detections is superior to one adjusted post-hoc to explain known data.  
     - **Confidence**: High. Avoids "overfitting" epistemically.  
     - **Genuine or Parochial**: Genuine; embraced by Bayesians (via updating) and falsificationists, but pragmatists may see it as artificial.  

  9. **Normative Force**  
     - **Motivation**: A purely descriptive account (e.g., "humans generalize via heuristics") cannot tell us how we *should* infer. The theory must provide normative standards (e.g., for rational belief) to avoid collapsing into psychology or sociology.  
     - **Motivation Case**: Even if humans use "grue"-like categories, we seek a theory that condemns this as irrational.  
     - **Confidence**: Medium (High for epistemology; Low for naturalists).  
     - **Genuine or Parochial**: Genuine for normative projects; parochial to descriptivists (e.g., some cognitive scientists).  

  ### Conflicts and Tensions  
  - **Jointly Unsatisfiable Set**: The trio of **Non-Presupposition of Induction**, **Normative Force**, and **Engagement with Humean Circularity** is likely unsatisfiable.  
    - **Why**: Humean circularity demands a non-circular foundation, but non-presupposition forbids inductive bootstrapping, and normative force requires justification beyond description. No theory has met all three: deductive approaches (e.g., logicism) fail normative force (e.g., against grue); pragmatic approaches (e.g., Reichenbach) presuppose induction; descriptive accounts lack normativity. This impasse suggests that induction cannot be "justified" in a strong foundational sense—only pragmatically defended.  
  - **Other Tensions**:  
    - **Computability vs. Non-Arbitrary Simplicity**: Non-arbitrary simplicity (e.g., via Kolmogorov complexity) is often uncomputable; computable approximations (e.g., MDL) risk arbitrariness.  
    - **NFL Accountability vs. Robustness to Problem-Space**: Defending a bias "because it works in practice" may ignore NFL unless the problem-space structure is independently justified, which risks circularity.  

  ### Parochial Demands by Camp  
  - **Bayesian**: Often reject non-arbitrary priors and non-presupposition, treating priors as subjective or empirical.  
  - **Algorithmic-Complexity**: Downplay computability and may sidestep Hume by treating simplicity as primitive.  
  - **Learning Theory**: Prioritize computability and NFL, neglecting normativity and grue.  
  - **Pragmatist**: Reject normativity, non-presupposition, and Humean engagement as misguided demands for justification.  

  ### Least Confident Desideratum  
  **Computability**: While crucial for applications, it may be too restrictive for a foundational theory (e.g., ideal agents might reason with uncomputable priors). Confidence is Medium, as it is application-dependent.  

  ### Final Answer  
  \answer{Non-presupposition of induction}
