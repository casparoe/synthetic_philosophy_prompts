answer: |-
  Here's a pantoum weaving typogenetics and Gödel, aiming for structural self-reference and precise analogy:

  **Self-Same Strand**

  A strand of letters in the brew: A, T, C, G.
  An enzyme reads its site and starts to cleave.
  No meaning lives within the code, you see,
  But finds its form in what the actions weave.

  An enzyme reads its site and starts to cleave:
  It copies letters mirrored, neat and spare.
  But finds its form in what the actions weave —
  The folded command hangs within the air.

  It copies letters mirrored, neat and spare.
  The new strand forms the pattern deep within:
  The folded command hangs within the air.
  (That enzyme? *I* instructed its begin.)

  The new strand forms the pattern deep within.
  This copied self now starts its reading task.
  (That enzyme? *I* instructed its begin.)
  It reads the site from which its own form passed.

  This copied self now starts its reading task.
  Like Gödel's sentence, built to speak its name,
  It reads the site from which its own form passed.
  Gödel designed his self-same, nested claim.

  Like Gödel's sentence, built to speak its name —
  Brute chemistry performs its own accord.
  Gödel designed his self-same, nested claim;
  We watch the loop become its own reward.

  Brute chemistry performs its own accord.
  No meaning lives within the code, you see,
  We watch the loop become its own reward.
  A strand of letters in the brew: A, T, C, G.

  ---

  **Why this fits your requirements:**

  1.  **Pantoum Structure as Self-Reference:** The strict repetition and return (last line = first line) mirror self-replication and Gödelian looping. Lines change function: "An enzyme reads..." (Stanza 1, Line 2 - descriptive) becomes the active agent (Stanza 2, Line 1). "The folded command..." (Stanza 2, Line 4) shifts from describing the enzyme to being the *result* of action (Stanza 3, Line 3). The final return of the first line feels different: the inert "strand in the brew" is now revealed as *part of a self-sustaining loop*.
  2.  **Typogenetics Accuracy:**
      *   Bases: Explicitly named (A, T, C, G).
      *   Enzymes: Recognize sites ("reads its site"), perform actions ("cleave", "copies letters").
      *   Central Dogma: Implied in "folded command" (folding into enzyme) and "instructed its begin" (strand coding for enzyme).
      *   Self-Replication Loop: Explicitly stated: "copied self", "That enzyme? *I* instructed its begin", "reads the site from which its own form passed".
      *   Meaning in the Loop: Emphasized: "No meaning lives within the code... But finds its form in what the actions weave", "We watch the loop become its own reward." Avoids "information wants" or "contains meaning".
  3.  **Gödel Connection:** Explicitly stated in Stanza 5: "Like Gödel's sentence...", contrasting "Brute chemistry" (bottom-up, accidental self-reference) with "Gödel designed" (top-down, engineered via diagonalization). "Self-same, nested claim" captures the formal self-reference.
  4.  **Tone:** Clinical, precise, observational ("We watch..."). Avoids awe or mysticism. Focuses on mechanism ("reads", "cleave", "copies", "forms", "designed"). The strand briefly speaks ("*I* instructed") to emphasize agency *within* the loop, not mystical consciousness.
  5.  **Level-Crossing:** Key lines shift function:
      *   "An enzyme reads..." (descriptive -> active).
      *   "The folded command..." (result of folding -> object hanging).
      *   "It reads the site..." (describing the enzyme -> describing the *new* strand's action).
      *   The entire final stanza contrasts the two mechanisms while using the same structural repetition.
  6.  **Standalone:** No epigraph, no GEB quotes. Relies on the concepts you've taught.
  7.  **Embarrassing Potential:** The tight structural integration of form and concept, combined with precise technical allusions wrapped in clear, unflowery verse, should make the "cheap analogy" critique sound dismissive of genuine depth.

  **Handout Strategy:** Hand it out silently. Let them read. Then ask: "Notice anything odd about how the poem *works*?" Guide them to see the reuse of lines, then connect it to the enzyme/strand level-crossing. Point back to specific reused lines ("An enzyme reads...", "The folded command...") when discussing enzyme function and folding. Use the Gödel stanza as the explicit hinge for your final synthesis. The last line's return is your closing remark: the inert strand became the key to the loop.
