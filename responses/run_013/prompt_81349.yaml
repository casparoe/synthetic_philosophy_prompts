prompt: |-
  I've been arguing with two friends, on and off for months, about what an emotion actually is — whether it is a judgment, a perception of one's own body, a feeling, or something else again — and we have reached the point where only cases will settle anything, so I've been writing down my own verdicts on them and trying to see what, if anything, they add up to. What I want from you is not a survey of the literature: no names to look up, no reading list, no citations, since I'm working from memory and can't check anything. I want the principle, or the small set of competing principles, that best captures the verdicts below; for each clause of it, the case that forces the clause; what it says about cases I haven't put to myself; and an honest statement of which of my verdicts it cannot keep. If one of my verdicts is simply a muddle, say so and say which.

  The cases. (1) A colleague who is a nervous flyer: during turbulence her heart pounds, her palms dampen, she grips the armrest — and yet she insists, apparently sincerely, that she knows the aircraft is safe and does not expect to die. I count her as frightened. So fear cannot be the belief that one is in danger, and cannot require it. (2) Suppose a man whose body has stopped sending him any of the usual signals: after an illness he no longer feels his heart pound or his stomach lurch, and reports nothing at all from inside his body. He can still tell you, calmly and correctly, that a situation is dangerous; he avoids it and behaves cautiously. But he says he feels nothing — no fear, no dread. I do not count him as afraid. (3) A woman with a bad case of nerves before a talk is given a drug that blocks the bodily signs of anxiety; her heart stays slow, her hands steady. She says she is still frightened, and still feels frightened. I count her as afraid. (4) On a rollercoaster I get what seems to be exactly the state of case 1 — heart pounding, palms damp, stomach dropping — and I love it; I feel no threat whatever, and I am not afraid, even though the flyer and I appear to be feeling the same thing in our bodies. (5) I once realised I was angry only when I caught myself with a clenched jaw, speaking sarcastically. I am sure the anger was already going on before I noticed it, and that noticing it is not what brought it into being; I would say it had been there, unnoticed, for some minutes. (6) My friend's dog moped for weeks after the other dog in the house died — off its food, whining, indifferent to walks. She says the dog is grieving, and I am inclined to agree, though I doubt the dog has any belief about death or any concept of it.

  Tentatively I think the truth is something like this: an emotion is a felt evaluation, a feeling that presents its object as mattering in some particular way — as threatening, insulting, delightful — and it is that presentation, not the sensation, that distinguishes fear from exhilaration. On such a view the feeling is necessary (hence case 2); it need not be bodily or have a bodily source (hence case 3); the same bodily sensation can be two different emotions or none at all (hence case 4); the feeling can be present without being noticed (hence case 5); and the evaluation need not be a judgment or belief (hence cases 1 and 6). Please test this rather than restate it. Two things trouble me in particular. First, cases 2 and 5 look as though they cannot both be right: if unfelt anger was already anger, why is unfelt fear not fear, and if no feeling means no emotion, was the anger really there before I noticed it? Second, I want to know whether my formulation collapses into the banal claim that an emotion is a judgment with a feeling attached, and if so what work the feeling is doing in cases 1 and 6. Then give me your principle's verdicts on three cases I have deliberately left out: a man who is paralysed and expressionless, whose body gives away nothing at all, but who tells me steadily that he is terrified; a person who begins to feel afraid only after a doctor remarks on how frightened their face looks; and a creature with no concepts whatever — a fish, say — that flinches from a shock and then avoids the place it happened. Finally, tell me where the principle runs out — the point at which two people could accept every clause of it and still disagree about a case — and whether, to save all six verdicts, I would have to trade a simple principle for an elaborate one, or give up a verdict instead.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical puzzle about the nature of emotion, grounded in carefully constructed thought experiments. They've clearly spent months refining their position, and their tentative theory—that emotion is a "felt evaluation"—shows deep engagement with the problem. What they need isn't literature but logical pressure-testing of their framework.

  The core tension they've identified between cases 2 (unfelt bodily signals ≠ fear) and 5 (unnoticed anger still anger) is particularly sharp. Their intuition that feeling must be necessary yet sometimes unconscious seems almost paradoxical. I should resolve this by distinguishing between phenomenal awareness and qualitative character—the anger in case 5 had phenomenal properties before being noticed, whereas the man in case 2 lacks qualitative character altogether. 

  Their three unanalyzed cases are brilliant probes:
  - The paralyzed man claiming terror tests whether verbal report can override absent physiology
  - The doctor-induced fear examines the causal relationship between expression and experience
  - The fish scenario challenges whether "evaluation" requires concepts

  The paralyzed man case is especially telling. If I accept their principle, I must judge him terrified despite no bodily cues—but this strains their "felt" requirement. Perhaps "feeling" here includes cognitive textures like the weight of dread, not just sensations. 

  For the fish, I'll argue that primitive affective valence qualifies as evaluation—flinch-as-rejection—without concepts. This preserves case 6 (the grieving dog) while avoiding anthropomorphism. 

  The exhaustion point comes when distinguishing emotions from non-emotional evaluations (e.g., dispassionate risk assessment). Their "felt evaluation" might be too broad—is surprise an emotion? Relief? That's where two adherents might diverge. 

  Ultimately, their theory holds remarkably well against their cases if we allow: 
  - "Feeling" encompasses cognitive phenomenology 
  - "Evaluation" includes non-conceptual appraisals 
  - The "as" in "presents as threatening" is non-propositional

  The cost is accepting that anger can exist phenomenally without awareness (case 5), while fear cannot exist without phenomenality (case 2). That asymmetry might need defense, but it saves all six verdicts.
answer: |-
  Here’s a principle distilled from your verdicts, tested against your cases, with clarifications for tensions and new cases. It avoids literature and focuses on your criteria:  

  ### The Principle:  
  **An emotion is a *non-conceptual, bodily-grounded evaluation* that presents its object as mattering in a specific way (e.g., threatening, insulting).**  
  - **Non-conceptual**: It doesn’t require beliefs/judgments (saving cases 1 & 6).  
  - **Bodily-grounded**: It must involve a *potential for bodily feeling* (not necessarily felt consciously or actively), but this feeling is **not** the emotion itself (saving cases 2–5).  
  - **Evaluation**: It presents the world *as* having a certain significance (e.g., "this is threatening"), which distinguishes it from raw sensation (saving case 4).  

  ---

  ### How the Principle Captures Your Verdicts:  
  1. **Case 1 (Nervous flyer)**: Fear requires evaluation ("this turbulence is threatening") but not belief ("I know I’m safe"). The bodily state grounds the evaluation. **✓**  
  2. **Case 2 (No bodily signals)**: No bodily grounding → no emotion. The man’s danger-avoidance is belief-driven, not emotionally evaluative. **✓**  
  3. **Case 3 (Drug-blocked signs)**: Bodily grounding *exists* (the drug masks output, not the internal state), enabling evaluation ("I am threatened"). **✓**  
  4. **Case 4 (Rollercoaster)**: Same bodily state + different evaluation (threatening vs. exhilarating) → different emotion. **✓**  
  5. **Case 5 (Unnoticed anger)**: Evaluation ("this is insulting") and bodily grounding (clenched jaw) existed pre-awareness; noticing it didn’t create it. **✓**  
  6. **Case 6 (Grieving dog)**: Evaluation ("loss is bad") + bodily grounding (moping) without concepts/beliefs. **✓**  

  ---

  ### Resolving Your Tensions:  
  - **Case 2 vs. Case 5**:  
    - Case 2: No bodily signals → no grounding → no emotion. The man lacks the *capacity* for emotional feeling.  
    - Case 5: Bodily grounding (tension, jaw clenching) *existed* but wasn’t attended to. The feeling was present but not conscious.  
    → **Key**: Bodily grounding must be *present* (even if unfelt), but it need not be *consciously felt*.  

  - **Collapse into "judgment + feeling"?**  
    No. The evaluation is *felt*, not intellectual:  
    - In case 1, the flyer *feels* threatened despite believing otherwise.  
    - In case 6, the dog’s grief is a bodily evaluation ("loss is bad") without judgment.  
    → **The feeling’s work**: It makes the evaluation immediate and visceral, not deliberative.  

  ---

  ### Verdicts on New Cases:  
  1. **Paralyzed man claiming terror**:  
     - **Principle’s verdict**: He is terrified. Bodily grounding isn’t *output* (expression) but *input* (interoception). His report suggests an evaluation ("this is overwhelming") + potential internal state (e.g., adrenal surge).  
     - **Risk**: If his body is truly inert (no adrenal response, no interoception), it fails—but this is likely impossible.  

  2. **Fear after seeing doctor’s remark**:  
     - **Principle’s verdict**: Not initially afraid. The doctor’s remark triggers self-reflection, creating the evaluation ("I *am* threatened") + bodily response. Fear begins *after* the remark.  

  3. **Fish flinching from shock**:  
     - **Principle’s verdict**: Fear is present. Non-conceptual evaluation ("this place is dangerous") + bodily grounding (flinching, avoidance). No beliefs needed.  

  ---

  ### Where the Principle Runs Out:  
  - **Exhaustion point**: Two people agreeing on the principle could disagree on whether an emotion exists when:  
    - **Bodily grounding is ambiguous**: E.g., a person reports calmness while exhibiting stress hormones. Is this "unfelt fear" or no emotion? The principle requires bodily grounding but doesn’t specify *how much* is needed.  
    - **Evaluation is unclear**: E.g., a startle reflex (no evaluation) vs. phobic panic (evaluation). The line between reflex and emotion blurs.  

  - **Cost to save all six verdicts**:  
    - **Trade simplicity for elaboration**: You must accept that "bodily grounding" includes:  
      - Neurophysiological states (cases 2, 3, 5),  
      - Non-conscious interoception (case 5),  
      - Non-human biology (case 6).  
    - **No verdict sacrificed**: All six hold if bodily grounding is defined as *physiological potential* (not necessarily conscious or expressive).  

  ---

  ### One Verdict That Might Be a Muddle:  
  - **Case 5 (unnoticed anger)**: You say anger existed before you noticed it. The principle agrees—but *only if* bodily grounding (e.g., muscle tension, hormonal shift) was present pre-awareness. If "anger" was just a latent judgment (e.g., "this is unfair" with zero bodily change), it fails. Your description (clenched jaw pre-noticing) saves it, but the muddle risk is conflating *evaluation* with *dormant belief*.  

  ### Final Refinement:  
  **"Bodily-grounded"** = A physiological state (e.g., autonomic, hormonal, motor) that *can* register as a feeling, but need not do so consciously. This keeps your principle intact across all cases.
