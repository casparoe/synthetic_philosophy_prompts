answer: |-
  ## Joint Statement on Intelligence: Findings from Adversarial Collaboration

  Following extensive good-faith deliberation, we, representing contrasting perspectives on the nature of human intelligence, affirm the following points of empirical agreement concerning the phenomena under investigation:

  We concur that performances across a wide array of seemingly disparate cognitive tasks exhibit consistent positive correlations, a phenomenon recognized as the "positive manifold." This statistical pattern is robust across numerous studies and populations. We further agree that scores derived from standardized cognitive ability tests demonstrate significant predictive validity for certain outcomes, particularly within formal educational settings and specific occupational trajectories requiring similar cognitive demands, though the strength and scope of this prediction vary considerably across contexts. Crucially, we acknowledge that performance on these tests is demonstrably sensitive to cultural background, educational experiences, socioeconomic status, and familiarity with test formats and content. No test can be considered a pure measure of acontextual capacity; all are culturally loaded artifacts to some degree, reflecting the specific skills and knowledge prioritized and cultivated within particular environments.

  Despite this common ground on the observable phenomena, fundamental differences in interpretation persist. These differences center on the underlying nature of the processes generating the positive manifold and the meaning of changes in test performance over time:

  1.  **The Origin of the Positive Manifold:** One perspective maintains that the observed positive correlations between diverse cognitive tasks necessitate the inference of a singular, underlying biological capacity or resource (often termed *g*) that causally influences performance across the board. Proponents of this view predict that future research will identify specific neurophysiological substrates or genetic architectures that constitute this general capacity. The alternative perspective holds that the positive manifold arises not from a single central cause, but from the complex, mutual causal interactions among multiple, distinct cognitive processes and skills developed through shared experiences within specific cultural and educational environments. This view predicts that detailed analysis of learning histories, environmental affordances, and dynamic processing interactions will better explain the correlations than the search for a monolithic biological *g*. Both sides agree that advances in longitudinal developmental studies, sophisticated neural network modeling, and ecological assessments of real-world problem-solving will provide critical evidence bearing on this crux.

  2.  **Interpreting Secular Trends (e.g., Flynn Effect):** One perspective interprets the substantial, generational increases in raw scores on cognitive ability tests (the Flynn Effect) as evidence that the underlying biological capacity for intelligence is not fixed but can increase significantly across populations over historical time, likely due to improvements in environmental factors like nutrition, education, and cognitive stimulation. Proponents predict that if these environmental improvements continue or plateau, the absolute level of measured capacity will reflect that change. The alternative perspective interprets these rising scores primarily as shifts in rank order relative to the specific demands of the tests themselves, reflecting changes in the prevalence of culturally specific skills, strategies, and knowledge fostered by modernization, rather than an increase in an absolute, underlying biological capacity. This view predicts that the gains represent improved performance on the particular types of problems featured in tests, not a fundamental increase in a general, context-independent capacity, and that gains may not generalize to all cognitive domains or novel problem-solving contexts outside the test paradigm. Both sides agree that research on whether the gains represent true increases in functional capacity across diverse real-world contexts, investigations into the cognitive components driving the gains, and studies correlating test score increases with independent biological markers will be crucial evidence.

  We identify a significant component of this dispute as verbal. The disagreement often hinges on the fundamental definition of "intelligence" itself. One camp typically defines intelligence as *an inherent, general biological capacity of the individual*, located "in the head," which the tests attempt (imperfectly) to measure. The other camp typically defines intelligence as *a property of the interaction between an agent and a specific environment*, manifesting as successful adaptation, learning, and problem-solving within that context, making individual-difference metrics inherently parochial. This definitional divergence shapes the interpretation of the agreed-upon phenomena. Recognizing this terminological difference clarifies that part of the contention arises from what is meant by the word "intelligence" in the first place.

  This statement reflects our shared understanding of the empirical landscape and our precise points of ongoing, empirically tractable disagreement. We commit to continuing collaborative investigation into the specified cruxes, with predictions clearly stated.
