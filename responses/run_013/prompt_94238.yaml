  ### Evaluation Procedure for Grant Proposals  
  **Based on Lexical Threshold Negative Utilitarianism**  
  *Designed for caseworkers to execute in ~1 hour via spreadsheet. Requires pre-set weights for bands A-D (e.g., \(s_A, s_B, s_C, s_D\)), defined by trustees.*  

  #### Step-by-Step Procedure  
  1. **Identify Harm Reduction**  
     - **Question:** What is the *net reduction* in animal-days of harm for each band (A-E) compared to the baseline (without intervention)?  
     - **Method:**  
       - Estimate animal-days of harm in the **without-project** scenario for bands A-E.  
       - Estimate animal-days of harm in the **with-project** scenario for bands A-E.  
       - Compute net reduction:  
         - Band E: `Net_E = E_without - E_with`  
         - Bands A-D: Compute total severity units:  
           - Without-project: `Total_A-D_without = (A_without × s_A) + (B_without × s_B) + (C_without × s_C) + (D_without × s_D)`  
           - With-project: `Total_A-D_with = (A_with × s_A) + (B_with × s_B) + (C_with × s_C) + (D_with × s_D)`  
           - Net reduction: `Net_A-D = Total_A-D_without - Total_A-D_with`  
     - **Sufficient to move on:** Complete estimates for all bands.  
     - **Value judgment:** Band assignments (A-E) are predefined; caseworkers apply them based on foundation guidelines. *Uncertain band assignments must go to the committee*.  

  2. **Check for Net Band E Harm**  
     - **Question:** Does the proposal cause *net* Band E harm? (`Net_E < 0`)?  
     - **Action:**  
       - If `Net_E < 0` → **Reject immediately**.  
         - **Justification:** "Causes net Band E harm; lexical threshold forbids offsetting Band E harm with any Band A-D reduction."  
       - If `Net_E ≥ 0` → Proceed.  
     - **Where it stops:** Rejection if `Net_E < 0`.  

  3. **Evaluate Band E Reduction**  
     - **Question:** Does the proposal reduce *any* Band E harm (`Net_E > 0`)?  
     - **Action:**  
       - If `Net_E > 0` → **Score = Net_E** (animal-days of Band E reduced).  
         - *Proposal is above lexical threshold; rank above all proposals with only Band A-D reduction.*  
       - If `Net_E = 0` → Proceed to Band A-D evaluation.  
     - **Sufficient to move on:** `Net_E` calculated.  
     - **Value judgment:** None (purely arithmetic if bands are clear).  

  4. **Evaluate Band A-D Reduction**  
     - **Question:** What is the net reduction in Band A-D severity (`Net_A-D`)?  
     - **Action:**  
       - If `Net_A-D < 0` → **Reject immediately**.  
         - **Justification:** "Causes net harm in Bands A-D; no offsetting by positive welfare permitted."  
       - If `Net_A-D ≥ 0` → **Score = Net_A-D** (severity units reduced).  
     - **Where it stops:** Rejection if `Net_A-D < 0`.  

  5. **Quantify Positive Welfare**  
     - **Question:** Does the proposal add positive welfare (e.g., enrichment) *not present in the baseline*?  
     - **Method:**  
       - Estimate positive welfare gain (e.g., animal-days of enrichment, using foundation-defined units).  
       - *Only used as a tie-breaker*:  
         - If two proposals have identical harm-reduction scores, the one with higher positive welfare wins.  
     - **Value judgment:** Quantifying positive welfare requires caseworker judgment (trustees must define units). *If contentious, refer to committee*.  

  6. **Final Ranking**  
     - **Prioritization:**  
       1. Proposals with `Net_E > 0` → Rank by **Net_E** (highest first).  
       2. Ties in `Net_E` → Break with **Net_A-D** (highest first).  
       3. Ties in `Net_A-D` → Break with **positive welfare** (highest first).  
       4. Proposals with `Net_E = 0` and `Net_A-D > 0` → Rank by **Net_A-D** (highest first).  
       5. Ties in `Net_A-D` → Break with **positive welfare**.  
       6. Proposals with `Net_E = 0` and `Net_A-D = 0` → Rank by **positive welfare** (highest first).  
     - **Output:** Written justification for score (Net_E, Net_A-D, positive welfare).  

  ---

  ### Demo on Example Proposals  
  **Assumptions:**  
  - Timeframe: 1 year (365 days).  
  - Weights: \(s_A = 1\), \(s_B = 3\), \(s_C = 6\), \(s_D = 10\) (illustrative; trustees must set actual weights).  
  - Band E = severe agony (1 day = 1 harm unit). Positive welfare units = animal-days of enrichment.  

  #### Proposal (a): Improve housing for 2M birds from Band B to Band A  
  - **Without-project:** 2M birds × 365 days in Band B → \(B_{without} = 730M\) animal-days.  
  - **With-project:** 2M birds × 365 days in Band A → \(A_{with} = 730M\) animal-days.  
  - **Net reduction:**  
    - `Net_E = 0 - 0 = 0` (no Band E change).  
    - `Net_A-D = (B_{without} × s_B) - (A_{with} × s_A) = (730M × 3) - (730M × 1) = 1,460M severity units`.  
  - **Positive welfare:** None claimed.  
  - **Score:** `Net_A-D = 1,460M` (no tie-breaker needed).  
  - **Justification:** "Reduces 730M animal-days of Band B harm to Band A, netting 1,460M severity units. No Band E impact."  

  #### Proposal (b): End Band E practice for 600 animals  
  - **Without-project:** 600 animals × 365 days in Band E → \(E_{without} = 219,000\) animal-days.  
  - **With-project:** 0 days in Band E → \(E_{with} = 0\).  
  - **Net reduction:**  
    - `Net_E = 219,000 - 0 = 219,000` (Band E reduced).  
    - `Net_A-D = 0` (no change in Bands A-D).  
  - **Positive welfare:** None claimed.  
  - **Score:** `Net_E = 219,000` (above threshold).  
  - **Justification:** "Eliminates 219,000 animal-days of Band E harm. Lexical threshold prioritizes this over Band A-D reductions."  

  #### Proposal (c): Add enrichment to system with ongoing Band D harm  
  - **Without-project:** Animals experience Band D harm (e.g., 10,000 animals × 365 days) → \(D_{without} = 3.65M\) animal-days.  
  - **With-project:** Band D harm unchanged → \(D_{with} = 3.65M\) animal-days. Enrichment added.  
  - **Net reduction:**  
    - `Net_E = 0`.  
    - `Net_A-D = (D_{without} × s_D) - (D_{with} × s_D) = (3.65M × 10) - (3.65M × 10) = 0`.  
  - **Positive welfare:** Assume 10,000 animals × 365 days of enrichment → \(P = 3.65M\) units.  
  - **Score:** `Net_E = 0`, `Net_A-D = 0` → Rank by \(P = 3.65M\).  
  - **Justification:** "No harm reduction. Adds 3.65M units of positive welfare. Only eligible for funding if no harm-reducing proposals exist."  

  #### Ranking  
  1. **Proposal (b)** (Net_E = 219,000) → Highest priority (lexical threshold).  
  2. **Proposal (a)** (Net_A-D = 1,460M) → Second priority.  
  3. **Proposal (c)** (P = 3.65M) → Lowest priority (no harm reduction).  

  **Result:** (b) ranks first, as required.  

  ---

  ### Addressing Difficult Questions  
  #### 1. Composition (Micro-Harms Aggregating to Agony)  
  - **Procedure:** Treat as many Band A harms, *not* one Band E harm.  
  - **Reasoning:**  
    - Framework clause (ii) assigns harms to bands *individually*. Clause (iii) only triggers for a *single* Band E harm.  
    - If micro-harms are individually classified as Band A-D (even if cumulative effect resembles agony), they aggregate under clause (iv), not clause (iii).  
  - **Follows from position?** Yes. Band assignment is binary per harm event; trustees must ensure bands reflect true severity (e.g., a "micro-harm" causing agony *must* be Band E).  
  - **Stipulation added?** None. Caseworkers apply band definitions rigidly.  

  #### 2. Offset (Positive Welfare vs. Band D Harm)  
  - **Procedure:** Positive welfare *cannot* offset Band D harm.  
  - **Reasoning:**  
    - Clause (i) states pleasure is not intrinsically good (only a tie-breaker).  
    - Clause (iv) allows aggregation of Band A-D harms *only against each other*.  
    - Thus, Band D harm is standalone "bad"; positive welfare is irrelevant unless harm reduction is equal.  
  - **Clause doing the work:** Primarily clause (i), secondarily clause (iv) (which excludes pleasure from aggregation).  
  - **Implication for Proposal (c):** Band D harm continues, so `Net_A-D = 0`. Positive welfare only breaks ties.  

  ---

  ### Limitations and Misfires  
  #### Where the Procedure Misfires  
  - **False negatives in Band E:**  
    - If a harm is misclassified as Band D (e.g., severe but labeled "moderate"), it avoids lexical priority, allowing massive aggregated harm to lose to a minor Band E reduction.  
    - *Example:* 1M animals in true agony misclassified as Band D could lose to a project sparing 1 animal true Band E harm.  
  - **Micro-harm loophole:**  
    - 1B animals each suffering 1/1B agony-equivalent (classified as Band A) aggregate to 1B Band A harms. This loses to sparing 1 animal true Band E harm, despite equivalent total suffering.  
  - **Positive welfare undervalued:**  
    - Trustees’ growing interest in positive welfare is stifled; it only matters in ties. Proposal (c) loses to (a)/(b) despite welfare gains.  

  #### What It Cannot Decide  
  - **Band assignment disputes:** Caseworkers lack philosophical training; unclear bands (e.g., "is chronic stress Band C or D?") must go to the committee.  
  - **Weighting of bands A-D:** Weights (\(s_A, s_B, etc.\)) are critical but set by trustees; imbalance (e.g., \(s_D = 10, s_A = 1\)) makes Band A reductions negligible.  
  - **Non-additive harms:** Chronic suffering ≠ sum of daily harms; procedure assumes linearity.  
  - **Long-term effects:** Harm/benefit beyond the analysis period (e.g., 1 year) is ignored.  

  #### Role of the A-E Boundary  
  - **Does real work?** Yes. The sharp boundary:  
    - Enables the lexical threshold (clause iii), which overrides aggregation.  
    - Creates a binary "tripwire" for prioritization (Band E vs. else).  
  - **Conceals value choices?** Yes. Boundaries determine:  
    - What counts as "agony" (e.g., is prolonged fear Band D or E?).  
    - Whether micro-harm aggregation is allowed.  
  - **Recommendation:** Trustees should openly debate/define bands to avoid arbitrariness.  

  ### Final Notes  
  - **Speed vs. accuracy:** The 1-hour limit risks oversimplification; complex proposals (e.g., uncertain baselines) may need committee referral.  
  - **Key judgment calls:** Band assignment, positive welfare units, and weights are value-laden; committees should audit these.  
  - **Adaptability:** Refine weights/bands annually based on outcome data and trustee priorities.  

  This procedure rigorously applies the trustees' framework, but its effectiveness hinges on precise band definitions and weights. Proposal (b) wins as expected, but the system will struggle with edge cases where suffering severity is contested.
