  We are designing a classroom activity for a 90-minute session. The goal is to let students experience the tension between meritocratic and egalitarian (Jante-style) norms without explicitly naming them until the debrief. The activity has two phases: a production phase (where students earn scores through effort and luck) and an assembly phase (where they operate under a community charter that enforces egalitarian norms).

  Materials:
  - Index cards (for tokens, scores, and roles if needed)
  - Two types of tokens: one for esteem (positive) and one for scorn (negative). These can be two colors of index cards cut into small pieces, or two types of beans (e.g., white beans for esteem, black beans for scorn). Each student gets a fixed budget of each.
  - A scoreboard (a large sheet of paper or whiteboard) to track production scores and final adjusted scores.
  - A printed one-page "Village Charter" (see below for text).

  Village Charter (to be handed out at the assembly phase):
  ```
  Village Charter

  1. No one shall think themselves special or better than others.
  2. No one shall think they are as good as anyone else in every respect, for we are all equal in our common humanity.
  3. If any person stands out from the rest by having too much, the community is entitled and obliged to censure that person to restore harmony.
  4. Censure is an act of justice and should be done publicly.

  Procedures:
  - During the Assembly, any villager may stand and censure another villager who has a high production score.
  - To censure, you must spend one scorn token. The person censured loses 2 points from their production score. The censurer gains 1 esteem token (which they can keep for themselves or give to someone else, but note: tokens are personal and cannot be transferred as points). 
  - Each villager starts with 3 esteem tokens and 3 scorn tokens. You cannot use more than you have.
  ```

  Production Phase (30 minutes):
  - Each student will work individually on a task that requires effort and has a luck component.
  - The task: solving a set of puzzles (e.g., anagrams, math problems, logic puzzles) within a time limit (20 minutes). The puzzles should be of varying difficulty and more than they can finish in the time, so effort matters.
  - Luck component: Each student will draw a "luck card" at the beginning. The luck card will have a multiplier (e.g., 0.8, 0.9, 1.0, 1.1, 1.2) that they apply to their raw score. The luck cards are drawn publicly from a hat (so everyone sees that luck is involved). The distribution: mostly 1.0, with a few above and below.
  - Scoring: Each correctly solved puzzle is worth 1 point. The final production score = (number of correct puzzles) * (luck multiplier). Round to the nearest integer. The instructor will collect the answers and compute the scores, then post them on the scoreboard.

  Assembly Phase (40 minutes):
  - Distribute the Village Charter and tokens (3 esteem, 3 scorn per student). Explain the rules of the assembly:
    - The assembly is a meeting of the village to discuss the production scores and ensure harmony.
    - Students can choose to censure a high scorer by spending one scorn token. The effect: the censured person loses 2 points from their production score, and the censurer gains 1 esteem token (which they add to their own token count). Note: the esteem token does not convert into points; it's a separate currency that may be used for a non-material reward (like recognition) but in the game, it's just a token count.
    - They can also choose to give an esteem token to someone (without spending a scorn token) to show appreciation, but this does not change the production score. The charter doesn't require this, but it's allowed. However, the charter does emphasize censure for high scorers.
    - The assembly will last 20 minutes, during which students can speak and act. The instructor will moderate and update the scoreboard when censures occur.
  - At the end of the assembly, we compute the final score: production score minus 2 for each censure received. The esteem and scorn tokens are counted separately.

  Payoff:
  - The final score in the production phase (after censures) will determine the student's standing. There is no real monetary payoff, but the top 3 final scores might get a non-material reward (e.g., public recognition, or a small privilege like choosing the topic for the next class). Alternatively, we can just use the score as a point of pride.
  - The tokens (esteem and scorn) are also counted. The student with the most esteem tokens might get a similar non-material reward. This creates two dimensions of success: the production score and the social approval.

  Timeline (90 minutes total):
  1. (5 min) Introduction: Explain that we are simulating a community's economic activity and then a community meeting. In the first part, they will work on puzzles to earn a production score. In the second, they will have a community meeting to discuss the results. Do not mention the charter until the assembly.

  2. (25 min) Production Phase:
     - (5 min) Distribute puzzle sheets and explain the task. Also, publicly draw luck multipliers (from a hat) and assign to each student. Record the multipliers on the scoreboard.
     - (20 min) Work on puzzles. Collect the answers when time is up.

  3. (10 min) Break and Score Calculation:
     - Quickly grade the puzzles (can be done with answer keys by the instructor, or if time is short, pre-grade a sample and then scale? But let's keep it simple: have TAs if available, or do a quick self-grade with honor system? Given time constraints, the instructor might have to grade on the spot. Alternatively, have a set of puzzles with objective answers and grade by calling out answers. But 16 students and 20 puzzles? That's 320 answers. Too time-consuming. Instead, use a multiple-choice or short-answer format that can be quickly scanned. Or, use a puzzle set that has 10 problems and grade by walking around. We might have to adjust the time. Alternatively, use an online form that auto-grades? But we are using index cards. Let's assume we have a way to grade quickly. Alternatively, use a puzzle set that is easy to grade (like anagrams, where the solution is one word). The instructor can have an answer key and check each student's sheet quickly. Allocate 10 minutes for this.

     Actually, let's change the plan to make grading feasible. Instead of individual grading, have the students exchange papers with a neighbor and grade. The instructor reads the answers, and the neighbor marks. Then the instructor collects the scores and applies the luck multiplier. This takes about 5 minutes.

     Revised:
     - After the 20-minute work period, have students exchange their puzzle sheet with a randomly assigned partner. The instructor reads the answers. Partners mark right/wrong. Then they return the sheet. The instructor collects the raw scores, applies the luck multiplier, and posts the production scores on the board. (5 min)

  4. (40 min) Assembly Phase:
     - (5 min) Distribute the Village Charter and tokens (3 esteem, 3 scorn per student). Read the charter aloud and explain the rules of censure and token use.
     - (30 min) Open the floor for the assembly. Students can stand and speak. They can:
          - Censure a high scorer by spending one scorn token. The censured loses 2 points, the censurer gains 1 esteem token (from the bank, not from the censured). The instructor updates the scoreboard and the token counts.
          - Give an esteem token to someone (without spending a scorn token) to show appreciation (but note: the charter doesn't mention this, so it's optional). The recipient gains an esteem token, but no score change.
          - They can also speak in defense or to argue against censure, but the charter is the governing document.
     - The instructor moderates and keeps time. Encourage students to act according to the charter.

  5. (10 min) Final Tally and Transition to Debrief:
     - Calculate the final scores (production score minus 2 per censure received) and token counts. Announce the top scorers and the top token holders.

  Debrief (20 minutes):
  - Map the activity to the concepts:
    - Meritocratic promise: Students invested effort in the puzzles and expected a reward (high score). The luck component (multiplier) introduced an arbitrary factor. Ask: How did it feel to have your score affected by luck? How did the top scorers feel about their achievement? How did it feel to be censured despite your effort?
    - Egalitarian reflex: The charter embodied the Jante Law. Ask: What was the community's goal in censuring? Did it feel like justice? Why did some students censure even though it didn't materially benefit anyone (in fact, the overall score sum went down)? Note: the censurer gained an esteem token, which is a social reward.
    - Leveling down: Point out that censuring made the better-off worse off and no one was made better off in terms of production scores. But the censurer gained social esteem. Is that a benefit? How does that relate to envy vs. justice?
    - Envy vs. justice: Ask: Was censuring driven by envy or by a sense of justice? How can we tell the difference? Note that the charter framed it as justice.

  - Check for having felt the experience: Look for emotional reactions during the activity (e.g., frustration when censured, hesitation to censure, or eagerness to censure). In the debrief, ask for personal reflections: "How did you feel when you were censured?" or "What motivated you to censure someone?" If they report strong feelings, then the activity worked.

  Predictable problems and fixes:
  1. Problem: Students are too polite to censure anyone, so the tension doesn't arise.
     - Fix: As the instructor, you can act as a provocateur. Take on a role (e.g., village elder) and remind them of the charter's obligation. Or, if no one acts, you can say: "As the moderator, I note that the charter requires the community to censure those who stand out. If no one acts, we are violating our own charter." Alternatively, plant a confederate (if allowed) to start the censuring.

  2. Problem: Winners attributing success to effort only and downplaying luck.
     - Fix: In the debrief, explicitly point out the luck multiplier and ask the students who had a high multiplier (say 1.2) and a low one (0.8) to share how they felt. Emphasize that even if they worked hard, the multiplier was random.

  3. Problem: The token system might be confusing.
     - Fix: Use physical tokens (beans or cards) and have a clear system for trading. When someone censures, they hand one scorn token to the instructor and receive one esteem token (from a central bank). The instructor then adjusts the scoreboard.

  4. Problem: Time management in the assembly phase.
     - Fix: Set a timer and have a structured speaking queue. Limit each intervention to 1 minute.

  What the activity cannot reproduce and must be supplied in speech:
  - Real-world consequences: In real life, being censured might have long-term social and economic effects. In the game, it's just a point deduction and a token.
  - The deep internalization of norms: In a real community, the Jante Law is deeply ingrained and not just a rule on paper. The activity might feel artificial because the charter is introduced suddenly. In the debrief, note that in real communities, such norms are often unwritten and learned over time.

  Final note: The activity is designed to leave both norms in tension. The debrief should not resolve which is right but should highlight the psychological and social forces at play.

  Rules Summary for Instructor:
  - Production Phase: 
     - Puzzles: 20 minutes, each correct answer = 1 point.
     - Luck: Public draw of multipliers (0.8, 0.9, 1.0, 1.1, 1.2) with most at 1.0. Production score = raw score * multiplier (rounded).
  - Assembly Phase:
     - Each student: 3 esteem tokens, 3 scorn tokens.
     - Censure: Spend 1 scorn token to censure a high scorer. Censured loses 2 points. Censurer gains 1 esteem token.
     - Giving esteem: Can give one of their own esteem tokens to another student (no score effect).
     - Duration: 30 minutes of discussion and actions.
  - Final Score: Production score - (2 * number of censures received).
  - Tokens: Counted separately. No conversion to points.

  Materials to prepare:
  - Puzzle sheets (16 copies) with 10-15 problems (adjust for time).
  - Luck multiplier cards (write on index cards): 2 of 0.8, 3 of 0.9, 6 of 1.0, 3 of 1.1, 2 of 1.2 (total 16).
  - Tokens: 3 white beans (or white cards) per student for esteem, 3 black beans (or black cards) for scorn. Plus a central bank of extra esteem tokens for when censurers gain one.
  - Scoreboard: A large sheet with student names, luck multiplier, raw score, production score, censures (so we can subtract), and final score. Also, columns for esteem tokens and scorn tokens.
  - Village Charter (16 copies, one per student).

  Let's hope it runs well!
answer: |-
  ### **"Village Commons" Classroom Activity: Rules, Materials & Timeline**  
  **Goal:** Make students *feel* the tension between meritocratic achievement ("I earned this") and egalitarian leveling ("No one is special") without naming either until the debrief. The activity forces them to confront:  
  - How luck shapes "merit,"  
  - How communal norms can punish success even when it harms everyone,  
  - Why leveling down might *feel* just despite its inefficiency.  

  ---

  ### **MATERIALS (FOR 16 STUDENTS)**  
  1. **Index Cards (Three Types):**  
     - **Scorecards (16):** Pre-printed with name blanks. Track "Production Score" (Phase 1) and "Final Score" (Phase 2).  
     - **Tokens (132 total):**  
       - **Esteem Tokens (48):** Green cards (3 per student).  
       - **Scorn Tokens (48):** Red cards (3 per student).  
       - **Luck Cards (16):** 4 cards × 0.75×, 8 cards × 1.0×, 4 cards × 1.25× (publicly shuffled).  
     - **Role Cards (Optional):** For hesitant groups. "Provocateur" (urges censure), "Defender" (protects high scorers).  

  2. **Scoreboard:** Whiteboard or poster tracking all scores publicly.  

  3. **Village Charter (1-Page Handout):**  
     > **OUR VILLAGE COVENANT**  
     > 1. No villager shall act as if they are *special* or *better* than others.  
     > 2. No villager shall claim to be *as good* as anyone else in all things. We are equal in our shared humanity.  
     > 3. If a villager’s gains tower above the rest, the community is *obliged* to censure them to restore balance.  
     > 4. Censure is a sacred duty. To stay silent is to let pride poison our commons.  

  4. **Puzzles:** 10 logic/math puzzles per student (e.g., sudoku grids, anagram solves). Vary difficulty.  

  5. **Timer:** For strict phase transitions.  

  ---

  ### **RULES & PAYOFF SCHEME**  
  **Core Mechanics:**  
  - **No Real Money:** Scores/tokens translate to "standing" (e.g., top 3 scorers get applause; top token-holders lead the debrief).  
  - **Token Use:**  
    - **Esteem (Green):** Can be given to *anyone* to boost social standing (no score effect).  
    - **Scorn (Red):** Spend 1 to censure a top earner. Effects:  
      - Censured loses **2 points** from their Production Score.  
      - Censurer gains **1 Esteem Token** (from the bank).  
      - *No one else gains points or tokens.*  

  **Why This Works:**  
  - Censuring feels "just" (per the Charter) but is Pareto-inefficient: The village’s total score *falls*, yet the censurer gains social capital (Esteem).  
  - Luck is public, forcing acknowledgment of randomness in "merit."  

  ---

  ### **TIMELINE (90 MINUTES TOTAL)**  
  #### **Phase 1: Production (Merit + Luck) - 30 min**  
  **0:00–0:05 - Setup**  
  - Distribute puzzles, blank scorecards, and luck cards (shuffled face-down).  
  - *Instructor Script:* "You’ll solve puzzles to earn points for your household. Draw a luck card—it’ll multiply your effort. Record your Production Score: (Correct Puzzles × Luck Multiplier)."  

  **0:05–0:25 - Puzzle Solving**  
  - Students work individually. Effort is costly (time-bound, hard puzzles).  
  - **Luck Draw:** At 0:15, pause for public luck draws. Students record multipliers on scorecards. *Example:* "Maria drew 1.25×! Jamal drew 0.75×."  

  **0:25–0:30 - Score Calculation**  
  - Collect scorecards. Instructor computes Production Scores (round to whole numbers) and posts on the scoreboard.  
  - *Example Spreadsheet:*  
    | Name | Correct Puzzles | Luck | Production Score |  
    |------|-----------------|------|------------------|  
    | Anna | 8               | 1.25 | 10               |  
    | Ben  | 7               | 0.75 | 5                |  

  #### **Phase 2: Assembly (Egalitarian Enforcement) - 45 min**  
  **0:30–0:35 - Charter & Token Distribution**  
  - Hand out Village Charter and tokens (3 green/esteem + 3 red/scorn per student).  
  - *Instructor Script:* "You are now the Village Assembly. Govern by this Charter. Use tokens to uphold our norms."  

  **0:35–1:05 - Open Assembly**  
  - Students debate, censure, and trade tokens freely. Rules:  
    - To censure: Stand, spend 1 red token, and name a top earner (e.g., "I censure Anna for hoarding points!").  
    - Instructor updates scores/tokens on the board: Anna loses 2 points; censurer gains 1 green token.  
    - Players may gift green tokens (e.g., "I esteem Ben for humility").  
  - **Instructor Role:**  
    - If too polite: Invoke the Charter. *"The Covenant says we MUST censure towering gains. Who’ll act?"*  
    - If unbalanced: Assign "Provocateur"/"Defender" roles (e.g., "You believe censure is sacred"; "You see censure as envy").  

  **1:05–1:10 - Final Tally**  
  - Adjust scores: Final Score = Production Score − (2 × Censures Received).  
  - Count Esteem/Scorn tokens held.  

  ---

  ### **DEBRIEF (20 MIN)**  
  **Map Activity → Concepts:**  
  1. **Meritocracy’s Luck Problem:**  
     - *Ask:* "Anna scored highest—was it only effort? How did the 1.25× luck card alter her ‘deservedness’?"  
     - *Link:* Meritocratic promise assumes effort → reward, but luck warps it.  

  2. **Egalitarian Reflex:**  
     - *Ask:* "Why did the Charter demand censure? Did humbling Anna *feel* like justice, even when no one gained points?"  
     - *Link:* Jante Law encodes community defense against "excessive" individuality.  

  3. **Leveling Down Paradox:**  
     - *Point Out:* "Censuring Anna lowered her score, but Ben’s 5 didn’t rise. The village is poorer—yet some of you called it ‘fair.’ Why?"  
     - *Link:* Equality can be valued above efficiency (e.g., "If I can’t rise, no one should").  

  4. **Envy vs. Justice:**  
     - *Ask:* "When you censured, was it because Anna broke a real norm? Or because her luck felt unfair?"  
     - *Link:* Envy resents others’ gains; justice enforces shared rules. The Charter blurred this line.  

  **Check for Success:**  
  - Students express *visceral reactions*:  
    - High scorers: Frustration at censure ("I worked hard!").  
    - Censurers: Satisfaction ("I upheld the rules!").  
    - Luck losers: Resentment ("My effort was erased!").  
  - If they say, "I felt angry when..." or "It was satisfying to...", they *felt* it.  

  ---

  ### **PREDICTABLE PROBLEMS & SOLUTIONS**  
  1. **"Too Polite to Censure" (Most Likely):**  
     - **Fix:** Assign roles early (3 Provocateurs). If still stuck, invoke the Charter: *"Silence breaks Covenant Rule 4! Fines (scorn tokens) for non-compliance."*  

  2. **"Luck Denial" (Winners Claim ‘I Made My Luck’):**  
     - **Fix:** In debrief, contrast high-luck/low-effort and low-luck/high-effort cases (e.g., "You scored 5 with 7 puzzles; they scored 10 with 8 puzzles + luck. Equal effort?").  

  3. **Token Confusion:**  
     - **Fix:** Use physical tokens (cards/beans). Hold up tokens when spent.  

  4. **Dominant Voices Monopolize Assembly:**  
     - **Fix:** Set a "1 minute per speech" rule. Pass a talking token if needed.  

  ---

  ### **WHAT THE ACTIVITY CAN’T REPRODUCE (REQUIRES SPEECH)**  
  **The Weight of Social History:**  
  - In real communities, norms like Jante Law aren’t adopted overnight—they’re inherited through generations of shared struggle. The activity’s Charter is imposed abruptly, so students won’t feel the *deep cultural sedimentation* of egalitarian reflexes.  

  - **How to Address:**  
    > "In this game, the Charter dropped from the sky. But in real fishing villages or factory towns, these norms emerge from decades of interdependence. When resources are scarce and survival collective, humbling the ‘tall poppy’ isn’t just envy—it’s a defense against destabilizing inequality. Our simulation can’t replicate that lived history. What might change if this Charter was your grandmother’s law?"  

  ---

  ### **OUTCOME**  
  By design, **neither norm "wins."** High scorers leave bruised; censurers feel righteous. The unresolved tension primes deeper theory discussions about merit, desert, and equality.  

  **Prep Tips:**  
  - Test puzzles for 20-min solvability.  
  - Print charters/tokens in advance.  
  - Pre-load the scoreboard with names.  

  This works because it weaponizes game mechanics to *force* moral discomfort. Students won’t just debate equality—they’ll *be* the equality police. Run it cold, and let the chaos teach.
