answer: |-
  This pattern of legal and fiscal practices reveals a **presupposed theory of property and labor** that is both complex and internally strained. Below is a reconstruction of its implicit logic, its tensions, and the consequences of replacing it.

  ---

  ### **The Implicit Theory: Legal Positivism with Statist Bent**
  1. **Property as a State-Granted Entitlement**:  
     - Ownership is not a pre-political natural right but a **legal construct defined and modified by the state**. What you "own" is what the state *chooses* to recognize and protect after accounting for its claims (taxes, regulations, eminent domain).  
     - *Eminent domain* requires compensation because the state disrupts an existing, legally recognized property right. In contrast, *taxation* is framed as a prior claim on resources, not a "taking" of established property.  

  2. **Labor as a Taxable Resource, Not Owned Capital**:  
     - Your labor is treated as **income-generating activity**, not a core attribute of self-ownership. Wages are taxed because they represent *new value* entering the economy, which the state claims a share of by default.  
     - **Imputed income** (e.g., homeowner benefits, self-provided services) is excluded because it lacks a market transaction; the state taxes only *monetized exchanges*, not holistic self-sufficiency.  

  3. **Tax Expenditures as State Generosity**:  
     - The "tax-expenditure" framework presupposes that **all pretax income belongs to the state**. Deductions and credits are thus "spending" (i.e., the state *choosing* to forgo revenue), reinforcing the idea that private retention of income is a state concession.  

  4. **Wartime Conscription as Sovereign Prerogative**:  
     - Compulsory labor in war reflects a **Hobbesian sovereignty** theory: the state’s survival justifies overriding individual autonomy. Low pay signals that labor is a civic duty, not a market commodity.  

  ---

  ### **What the Practice Strictly Requires vs. Accommodates**
  - **Requires**:  
    - A **statist baseline**: Legal ownership begins *after* the state’s claim.  
    - **Formal equality in tax law**: Wages are taxed uniformly (avoiding moral debates about valuing non-market labor).  
    - **Sovereign emergency powers**: The state may conscript labor when existential threats arise.  

  - **Accommodates (but does not require)**:  
    - **Moral intuitions about fairness**: Eminent domain compensation responds to perceived injustice, but no similar intuition extends to wage taxation.  
    - **Pragmatic omissions**: Excluding imputed income avoids administrative burdens, not a principled defense of self-sufficiency.  

  ---

  ### **Inconsistencies and Underdetermined Elements**
  1. **The Compensation Paradox**:  
     - Why compensate for land but not for labor? The practice is **underdetermined**: It could reflect a theory that land is a "fixed" pre-political asset, while labor is "produced" value subject to state claims. Alternatively, it may be historical path dependency (land rights predate income taxes).  

  2. **Tax Expenditures vs. Private Property Rhetoric**:  
     - Calling deductions "spending" clashes with political rhetoric about "taxpayers' money." The state **inconsistently frames pretax income** as both private property (when condemning waste) and public property (when justifying tax expenditures).  

  3. **Inconsistent Valuation of Labor**:  
     - Conscripted labor is priced below market rate (as a duty), while *not* conscripting labor (e.g., during peacetime) is treated as an individual right. This vacillates between **labor as civic obligation** and **labor as personal property**.  

  ---

  ### **Shifts Required Under a Lockean Theory**
  If replaced with a theory where **labor and pretax earnings are inherent property** (e.g., Locke’s "self-ownership" or Nozick’s entitlements):  

  **Legal Changes**:  
  - **Wage taxation as partial taking**: Income taxes would require justification under eminent domain principles (e.g., public use, just compensation).  
  - **Conscription banned or fully compensated**: Forced labor would violate self-ownership; if permitted, market-rate pay would be required.  
  - **Tax expenditures abolished**: Deductions could not be "spending," as pretax income is private. Tax cuts would be framed as reducing state claims, not granting benefits.  
  - **Imputed income taxed**: To maintain consistency, homeownership benefits or self-care might need valuation and taxation.  

  **Rhetorical Shifts**:  
  - **Language of "taking"**: Taxes would be discussed as state appropriations, not contributions.  
  - **"Tax relief" over "spending"**: Reducing taxes would be restoring property, not allocating public funds.  
  - **"Earnings" not "income"**: Emphasizing pretax wages as *owned* (e.g., "the government takes 30% of my earnings").  

  ---

  ### **Conclusion**
  The current system presupposes a **hybrid theory**: property is a state-controlled bundle of rights, with labor treated as a taxable flow rather than an extension of the self. This view is **internally strained** by its asymmetric treatment of land/assets versus labor, and by framing tax reductions as state "spending." Adopting a self-ownership theory would revolutionize tax policy—requiring wage taxes to meet takings-clause scrutiny, abolishing conscription, and overturning the logic of tax expenditures—but at the cost of practical administration (e.g., taxing imputed income). The tension persists because no theory perfectly reconciles sovereignty, individual rights, and administrative feasibility.
