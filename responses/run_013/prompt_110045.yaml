prompt: |-
  I host a small podcast on everyday ethics, and next week's guest is a philosopher who defends a position I want to press hard. Her view, as I understand it, is this: visitors are morally required to follow a local convention when it is a live coordination equilibrium that locals rely on and when noncompliance would impose a real cost on them, but not when the convention mainly encodes or reproduces a local status hierarchy; residents are required to follow their own conventions only under the same test, so local practice does not generate an obligation merely by being local. She also holds that the line between coordination conventions and status conventions is not fixed in advance: the same act, such as tipping, queueing, or jaywalking, can belong to both categories depending on context and history, and a convention can migrate from one category to the other. Draft eight to ten interview questions that go beyond asking her to restate this. I want at least one question each on (a) how she distinguishes thin coordination conventions from thick conventions that distribute burdens and benefits, using tipping and queueing as the test cases, and what would settle whether a convention has switched categories; (b) whether a visitor's ignorance, foreignness, or inability to learn the convention in time can excuse noncompliance, whether there is a positive duty to learn local conventions before or during a visit, and how she avoids the visitor's dilemma of either free-riding on local practices or being conscripted into local injustice; and (c) how the view handles conventions that are widely followed but unjust, and conventions that are illegal but widely ignored, with jaywalking and tipping as the examples. For each question, include a follow-up keyed to the answer she is most likely to give, and make the follow-ups progressively harder to deflect. Also include one question about whether the view collapses into moralizing mere etiquette, and one about whether it underrates the moral value of local attachment, respect, or solidarity. Finally, ask what evidence or argument would lead her to abandon the qualified local-convention principle. For the whole set, say which questions you think are genuine pressure points and which are likely cheap shots, what answer from her would make you think the view has more resources than the questions assume, and end by saying what consideration would most change your own assessment of whether the view is defensible.
reasoning: |-
  Okay, the user hosts an ethics podcast and is preparing for an interview with a philosopher who has a specific view on conventions. The user wants to draft questions that challenge the guest's position without just rehashing it. Let me break down the requirements.

  The guest's position is that visitors must follow local conventions if they're coordination equilibriums that locals rely on, and noncompliance imposes real costs. But not if the convention mainly maintains a status hierarchy. Residents have the same obligations. The distinction between coordination and status conventions isn't fixed—things like tipping or jaywalking can be either depending on context.

  The user wants 8-10 questions, with specific requirements: one on distinguishing thin coordination conventions from thick ones using tipping/queueing; one on visitor ignorance/duties and avoiding free-riding vs. injustice conscription; one on unjust/illegal conventions using jaywalking/tipping; plus one on etiquette collapse and one on local attachment. Each needs a follow-up that's hard to deflect. Also need to identify pressure points vs cheap shots, what answer would show the view's strength, and what could change the user's assessment.

  First, I need to dig into the core tension in the guest's framework: the coordination/status distinction. That's probably the biggest pressure point. Questions about how context shifts categories (like tipping varying by country) will test the flexibility of her model. The visitor's dilemma is another weak spot—how can someone avoid both free-riding and perpetuating injustice? That seems tricky. 

  For the tipping/queueing question, I should push on what evidence determines a convention's category. If she says it's about locals' reliance vs. hierarchy, the follow-up could challenge how we measure that without bias. For jaywalking, if it's illegal but ignored, does her view prioritize coordination over legality? That could reveal if the framework handles conflicting norms.

  The etiquette question might be a cheap shot if she's already distinguished moral obligations from politeness. But if she ties obligation to costs, pressing on minor frustrations could expose where "real cost" thresholds lie. The local attachment question risks being sentimental, but if she dismisses solidarity as irrelevant without coordination function, that might undercut the view's appeal.

  I wonder what would make me reassess. If she provides clear criteria for category shifts—like historical analysis or power dynamics—that aren't arbitrary, it'd strengthen her case. But if she relies on subjective perceptions, the framework might crumble. Also, her solution to the visitor's dilemma needs to be robust; token resistance gestures won't suffice if they don't actually challenge hierarchies.

  The illegal conventions point is sharp. If locals ignore jaywalking laws, her view might endorse breaking them as a coordination equilibrium. But what if that undermines legal systems? Her answer could reveal how she balances emergent norms vs institutional rules.

  I should also anticipate strong counterarguments. If she argues that status hierarchies inherently impose costs (e.g., dignity harms), that might resolve some tensions. Or if she frames learning conventions as participatory respect, not blind compliance, that could answer the etiquette concern.

  Finally, the abandonment question is crucial. If she admits evidence of irreducible cultural particularity could sway her, it shows openness. But if she holds the line, it might reveal dogmatism. My own assessment hinges on whether she can ground the coordination/status distinction objectively—without that, the view feels slippery.
answer: |-
  Here are 9 interview questions designed to probe, challenge, and clarify the guest's position, incorporating your specific requests and designed to move beyond restatement. Each primary question has a targeted follow-up.

  **Core Questions & Follow-Ups:**

  1.  **Distinction Test (Tipping/Queueing):** "You argue that the moral weight of a convention hinges on whether it's primarily a 'thin' coordination equilibrium distributing minimal burdens/benefits for mutual gain (like efficient queueing), or a 'thicker' convention encoding status hierarchy (like some critiques of tipping). Using tipping in the US versus queueing in the UK as test cases: **What specific empirical or normative markers definitively place tipping in the 'status hierarchy' category for you in its dominant US form, while placing orderly queueing in the 'coordination' category? What single piece of counter-evidence about tipping (e.g., worker reliance, customer intent) or queueing (e.g., implicit class/race exclusions) would most strongly suggest to you that the convention has *switched categories*?"**
      *   *Likely Answer:* She'll emphasize worker dependence/power imbalance in tipping vs. mutual efficiency gain in queueing; might cite worker testimony or economic studies for tipping as status, or historical shifts for queueing evolving from class distinction.
      *   *Follow-Up (Harder):* "If a study showed most US service workers *genuinely prefer* the tipping system (citing higher potential earnings, autonomy, direct feedback) over a flat wage, and most customers see it purely as rewarding good service, not asserting status, does that move tipping back towards a 'coordination' equilibrium? Or does the inherent power asymmetry in the customer-worker relationship *always* taint it as status-based, regardless of participant perception?"

  2.  **Visitor's Dilemma (Ignorance/Duty/Conscription):** "The 'visitor's dilemma' seems central: comply and potentially uphold an unjust status convention, or defect and free-ride on a beneficial coordination convention. You suggest the distinction resolves this. **But concretely: Does a visitor's *genuine ignorance* of the local convention (thin or thick) *excuse* non-compliance? Is there a *positive duty* for visitors to research local conventions *before* arrival, or only a duty to comply *once aware* of a coordination convention? Crucially, how does your framework practically help a visitor *avoid* being conscripted into upholding a status hierarchy *without* simply free-riding on beneficial coordination norms locals uphold?"**
      *   *Likely Answer:* Ignorance might excuse *initial* non-compliance, but a duty to learn *arises upon realizing norms exist*. Avoiding conscription involves identifying status conventions and *strategic non-compliance* or supporting local efforts for change, not blind free-riding.
      *   *Follow-Up (Harder):* "Take a complex, context-dependent norm like gift-giving reciprocity in a culture with strong hierarchy elements. How can a short-term visitor, lacking deep cultural understanding, reliably discern whether compliance constitutes upholding a coordination equilibrium (smooth social interaction) or a status hierarchy (reinforcing obligations on lower-status individuals)? Doesn't your 'strategic non-compliance' often just default to *non-participation*, effectively free-riding on the coordination benefits *others* provide by following the complex norm?"

  3.  **Unjust/Ignored Conventions (Jaywalking/Tipping):** **"Your principle requires following local conventions *only* when they are live coordination equilibria relied upon by locals. How does it handle (a) conventions that *are* live coordination equilibria but *unjust* (e.g., a deeply embedded but discriminatory local hiring practice), and (b) laws that are *not* live conventions because widely ignored (e.g., jaywalking in NYC)? Using jaywalking and mandatory tipping debates as examples: Does widespread non-compliance with jaywalking laws *dissolve* the moral obligation to follow them, turning jaywalking *into* the coordination norm? Conversely, if a locality tried to *ban* tipping but workers/customers widely ignored it, does your view imply the *custom* retains moral force over the *law*?"**
      *   *Likely Answer:* Unjust coordination equilibria *might* still generate a *pro tanto* obligation based on reliance, but it can be overridden by the stronger duty to oppose injustice. Widespread non-compliance with a law (jaywalking) signals it's *not* a live coordination equilibrium; the emergent practice (safe jaywalking) becomes the relevant norm. A widely ignored ban on tipping suggests the *custom* is the live coordination norm.
      *   *Follow-Up (Harder):* "So, for an unjust coordination norm (like the discriminatory hiring practice), does the resident's obligation to follow it (as a coordination equilibrium they rely on) *conflict* with their obligation to oppose injustice? How is that conflict resolved within your framework? Does the visitor have *less* obligation to follow the unjust coordination norm than the resident does? And regarding jaywalking: If the *law* exists for safety but is ignored, and the *practice* (jaywalking) functions as a coordination norm, does your view imply the *practice* is morally binding even if demonstrably *less safe* than obeying the ignored law?"

  4.  **Collapse into Etiquette?** **"Critics might argue your view simply moralizes etiquette – turning 'when in Rome, do as the Romans do' into a binding obligation under specific conditions. How does your emphasis on *cost imposition* and *reliance* for coordination conventions fundamentally distinguish the *moral* obligation you describe from the mere *prudential* or *polite* reasons often given for following local customs?"**
      *   *Likely Answer:* Etiquette focuses on politeness/social harmony; her view grounds obligation in preventing *tangible harm* (cost imposition) and respecting the cooperative schemes (reliance) others have built for mutual benefit, which is a core moral concern akin to promise-keeping or fairness.
      *   *Follow-Up (Harder):* "But many coordination conventions avoid only minor frustrations or inefficiencies – the 'cost' of someone skipping a queue is a slightly longer wait for others. Isn't grounding a *moral* obligation (not just politeness) on preventing such minor, diffuse costs risk inflating trivialities into moral demands? Where's the threshold for 'real cost' that triggers a moral duty rather than just a request for politeness?"

  5.  **Underrating Local Attachment?** **"Does your framework undervalue the *intrinsic* moral significance of showing respect for local culture, solidarity with a community, or honoring the value of 'local knowledge' and belonging, *independently* of whether a specific convention is a coordination equilibrium or avoids status hierarchy? Couldn't following a local practice sometimes be an expression of respect or solidarity, even if it doesn't strictly meet your cost/reliance test?"**
      *   *Likely Answer:* Respect and solidarity are important values, but they don't *automatically* generate an obligation to follow *any specific convention*. The specific test ensures the obligation is grounded in preventing harm and respecting cooperation, not just sentiment. Respect can be shown in other ways.
      *   *Follow-Up (Harder):* "Take a local religious or cultural ritual that holds deep meaning for residents but involves no significant coordination reliance or cost imposition if a respectful visitor abstains (e.g., a specific greeting, a minor dietary observance). According to your view, does a visitor have *no moral obligation whatsoever* to participate, even if their abstention, while understood, is genuinely felt by locals as a slight or lack of respect? Doesn't this reduce the moral landscape of cross-cultural interaction purely to harm avoidance and efficiency, missing dimensions of recognition and shared meaning?"

  6.  **Category Migration Evidence:** **"You state the line between coordination and status conventions isn't fixed and conventions can migrate. Beyond historical analysis, **what kind of contemporary social evidence would be most decisive for you in determining that a convention like tipping *has shifted* from being primarily a coordination equilibrium to being primarily a status hierarchy mechanism, or vice-versa?** Is it changes in public discourse, economic data on worker dependence, shifts in power dynamics, or something else?"**
      *   *Likely Answer:* Likely a combination: worker organizing demanding abolition, data showing tips don't correlate with service quality but with customer demographics/whim, successful implementation of living wage/no-tip models elsewhere showing coordination is possible without it.
      *   *Follow-Up (Harder):* "Doesn't this criteria risk being circular? If workers organize against tipping, isn't that *evidence* it's a status hierarchy, but if they don't (or actively support it), does that *prove* it's merely coordination? How do you avoid the category being defined by whichever group is currently winning the political struggle over the convention's meaning?"

  7.  **Resident Obligation & Injustice:** **"You apply the *same* test (coordination equilibrium, reliance, cost imposition, not mere status) to residents as to visitors. For a resident, doesn't this create a potential conflict: an obligation based on participation in a relied-upon coordination scheme vs. a duty to reform or resist if that scheme is unjust? How does your framework adjudicate this conflict for the *resident*? Does the resident have a *stronger* obligation to follow a just coordination norm than a visitor, or a *weaker* obligation to follow an unjust one?"**
      *   *Likely Answer:* Residents, being embedded and reliant *on each other*, likely have a *stronger pro tanto* obligation to uphold the coordination schemes that make their shared life possible. However, this coexists with a duty to reform injustice *within* those schemes or work to change them. The obligation isn't absolute.
      *   *Follow-Up (Harder):* "Doesn't this risk creating a *conservative bias*? If residents have a strong obligation to uphold existing coordination schemes (due to mutual reliance), doesn't that place a heavy burden of justification on those advocating for change, even when the scheme is subtly unjust? How does your view avoid privileging stability (via the coordination obligation) over justice?"

  8.  **The "Live" Equilibrium Threshold:** **"The concept of a 'live coordination equilibrium' locals 'rely on' is crucial. How widespread must compliance be for it to be 'live'? (51%? 90%?) How tangible must the 'reliance' be? (Essential for daily function? Merely convenient?) If a convention is followed by a majority and provides convenience, but its collapse wouldn't cause catastrophe (e.g., formal vs. informal address norms), does it still generate a *moral* obligation, or just a strong expectation?"**
      *   *Likely Answer:* It's scalar and contextual, not a bright line. "Liveness" involves a critical mass where defection *predictably* causes disruption/costs because others *expect* compliance. Reliance means people structure their actions/expectations around it.
      *   *Follow-Up (Harder):* "In a diverse society with subcultures often following different conventions (e.g., norms of public interaction varying by neighborhood), how do we identify *which* 'local' convention a visitor (or even a resident moving between areas) is obligated to follow? Doesn't this complexity make the 'local convention' principle incredibly difficult to apply in practice, potentially leading to arbitrary demands?"

  9.  **Abandoning the Principle:** **"Finally, what specific type of evidence, argument, or counterexample would lead you to significantly modify or even abandon the core qualified local-convention principle you defend? Is there a hypothetical scenario where the costs of following a coordination convention would clearly *not* generate an obligation, or where following a status convention *would* be required, that would challenge the framework's core?"**
      *   *Likely Answer:* Perhaps evidence that *all* stable social coordination inherently and irreducibly depends on oppressive status hierarchies, making the clean separation impossible. Or a case where defecting from a minor coordination norm caused catastrophic, unforeseeable harm, suggesting the obligation is too broad/risky.
      *   *Follow-Up (Harder):* "If compelling anthropological evidence showed that the very concept of 'coordination equilibrium' as you define it is a Western, individualistic construct that fails to capture the holistic, often hierarchical, nature of social order in many cultures, would that necessitate a fundamental rethink, or could your framework be adapted?"

  **Assessment:**

  *   **Genuine Pressure Points (Hardest Hitting):**
      *   **Question 1 Follow-Up:** Directly challenges the objectivity/observability of the core coordination/status distinction by focusing on participant perception vs. structural power. Hits the framework's foundation.
      *   **Question 2 Follow-Up:** Highlights the practical impossibility for visitors to reliably make the complex coordination/status distinction in real-time, potentially forcing them into free-riding or complicity. Tests practical applicability.
      *   **Question 3 Follow-Up:** Presses the conflict between coordination obligations and duties of justice *for residents*, potentially revealing a conservative bias favoring stability. Probes internal conflict.
      *   **Question 6 Follow-Up:** Questions the potential circularity in determining category shifts based on political contestation, suggesting the distinction might be an *outcome* of struggle, not an objective basis for it.

  *   **Potential Cheap Shots (Easier to Deflect):**
      *   **Question 4 (Collapse into Etiquette):** If the guest has clearly articulated the harm/reliance basis (as expected), distinguishing it from mere politeness is relatively straightforward. The follow-up about "minor costs" (Question 4 Follow-Up) is stronger.
      *   **Question 5 (Underrating Local Attachment):** A thoughtful philosopher can readily acknowledge other values (respect, solidarity) while arguing they don't *necessarily* create obligations to follow *specific conventions*. The follow-up (Question 5 Follow-Up) makes it more challenging by focusing on felt disrespect.
      *   **Question 8 ("Live" Equilibrium Threshold):** Philosophers are comfortable with scalar, contextual concepts lacking bright lines. While a practical challenge, it's less of a deep theoretical flaw.

  *   **Answer Showing View's Strength:** If the guest provides **clear, non-circular criteria for identifying status hierarchy vs. coordination that are grounded in observable power dynamics, material consequences, and agent testimony (not just contested claims), and offers a plausible, non-self-defeating strategy for visitors/residents to navigate the dilemma of unjust coordination norms** (e.g., emphasizing *collective* action for change over individual defection, or nuanced ways to show respect while withholding compliance from hierarchy elements), it would demonstrate significant resources and resilience in the view.

  *   **What Would Change My Assessment:** The consideration that would most significantly shift my assessment of the view's defensibility is **how successfully the guest addresses the challenge of distinguishing coordination from status in practice, especially for complex, embedded norms, without relying on subjective perception or circular reasoning tied to political outcomes.** If she can articulate robust, intersubjectively verifiable markers rooted in power analysis and material impact, the view gains substantial credibility. Conversely, if this distinction remains vague, contestable, or primarily dependent on the observer's normative stance, the core principle becomes much harder to defend as a reliable guide for moral obligation. The resolution (or lack thereof) of the "visitor's dilemma" in concrete terms is the ultimate practical test.
