prompt: |-
  I run a fortnightly reading group for history grad students and we keep circling the same fight: someone says the First World War would have happened anyway, someone else says that isn't even a meaningful claim, and a third person says the question is badly posed because there's no such thing as *the* cause of anything. I want to stop haveing this argument and start sorting people instead, so could you write me a 'which theory of overdetermination do you actually hold?' quiz? Nine or ten questions, each one a concrete case rather than a question about labels — the three arsonists who each independently torch the same house; two snipers firing at the same instant where either shot would have killed; a double-prevention case (someone jams the signal that would have stopped the train); a cause that's an absence (the garrison that never came, the warning that was never given); a structural cause like the Black Death shifting the bargaining power of labour, where you can't point to any one decision; the Sarajevo assassination and the question of what a Europe without it even looks like; a case where two histories of the same event, one blaming a king and one blaming a harvest, are both defensible; and a chaos case where the initial difference is so tiny that re-running the counterfactual lands you in a completely different world. Two or three answer options per question, phrased so the reader can't tell which position they're buying into. (We've been reading a lot of counterfactual history lately, the 'what if the Armada had landed' sort of thing, which is probably why everyone's so het up about this.)

  Then a scoring key mapping answer patterns onto the leaves. I need at least these to come out: the pure counterfactualist, for whom only a difference-maker deserves the name of cause, and who therefore thinks overdetermination is a philosophers' artefact because preemption always dissolves the ties; the INUS/network view, where causes are nodes in a sufficient set and overdetermination is simply normal; the contrastivist or pluralist, for whom 'the' cause is relative to a contrast and the whole puzzle is verbal; the pragmatic selectionist, who thinks there's one causal structure but 'the' cause is picked out by our explanatory interest, Weber-style value-relevance; the structuralist, for whom individual actors and events are surface phenomena and the real causes are relations of production or demography; and the regularity or covering-law person, for whom singular causation in history is either not real or just a compressed lawlike generalisation. Also make room for the narrativist who thinks historical explanation isn't causal at all — and if that position turns out to be indistinguishable from one of the others given your questions, say so rather than inventing a question to rescue it. At the end, tell me which answer combinations nobody occupies, and whether that's because the view is incoherent, unattractive or merely unexplored, and flag any two leaves the quiz can't really separate.
reasoning: |-
  Okay, the user runs a history grad student reading group that keeps circling the same debate about WWI causation. They want to move past the "would it have happened anyway?" argument by creating a quiz that sorts people into their implicit theories of overdetermination. 

  Hmm, this is actually brilliant - instead of abstract meta-arguments, make people reveal their metaphysical priors through concrete cases. The user clearly understands the philosophical landscape (mentioning INUS, contrastivism etc.) but wants to operationalize it. Their examples are spot-on: the three arsonists case tests preemption vs overdetermination, the structural cause case probes reductionism, and the chaos case addresses determinism. 

  Noticing they specifically asked to avoid labeling positions in the questions - smart. Grad students would recognize terms like "pragmatic selectionist" and bias their answers. The challenge is designing cases that cleanly discriminate between positions. For example:
  - The double-prevention case should trap strict counterfactualists (if they deny absences as causes)
  - The harvest vs king case must distinguish contrastivists from selectionists
  - The chaos case needs to separate covering-law theorists from narrativists

  The scoring key is ambitious - seven positions! I'll need to map answer patterns carefully. Some tensions: structuralists and narrativists might give identical answers but for different reasons. And the "no causation" position might collapse into pluralism unless the assassination question forces a difference. 

  Biggest risk is creating false dichotomies. Maybe include one question where all answers point to the same conclusion? Like the grain prices case - any answer could be consistent with pragmatism. That's fine, as long as other questions break ties. 

  For scoring, I'll flag where positions overlap (e.g., pluralists and selectionists both endorse contrast-dependence) and where combinations are impossible (you can't be both a counterfactualist and structuralist). The "unexplored" category might catch historical materialists who reject structuralism? 

  User seems frustrated but constructive. They're not trying to "win" but to productively map disagreements. The quiz format shows pedagogical insight - make ideology tangible through case judgments. I'll lean into their examples while adding one new case (the bridge collapse) to test regularity theories. 

  Final design principle: each question must have at least one answer that's uniquely embarrassing for a particular position. That's what will make the sorting work.
answer: |-
  Here’s a quiz designed to sort implicit theories of causality and overdetermination through concrete cases, with a scoring key mapping answers to philosophical positions. Each question avoids labels and focuses on intuitive judgments.

  ---

  ### **The "Which Theory of Overdetermination Do You Hold?" Quiz**
  *Answer based on your instinct about causation in each scenario.*

  1. **The Triple Arsonist**: Three enemies independently set fire to the same house at midnight. Each fire alone would have destroyed it. The house burns down. What caused the destruction?  
     A) All three arsonists equally caused it.  
     B) No single arsonist caused it—without any one, the house still burns.  
     C) It depends: if we’re assigning blame, all three; if we’re asking what made the difference, none.  

  2. **The Perfect Sniper Duo**: Two snipers, hidden miles apart, fire simultaneously at a politician. Either bullet would have been instantly fatal. Both hit. Who caused the death?  
     A) Both snipers—each fired a lethal shot.  
     B) Neither alone caused it—remove one, and death still occurs.  
     C) We only say "both" because we lack information; in reality, one bullet arrived a microsecond earlier.  

  3. **The Jammed Signal**: A train signal would have warned a conductor to stop before a collapsed bridge, but a saboteur jams the signal. The train crashes. What caused the crash?  
     A) The collapsed bridge (the immediate physical threat).  
     B) The saboteur (without the jam, the crash wouldn’t happen).  
     C) The absence of the warning signal (a "non-event" was key).  

  4. **The Missing Garrison**: A fortress falls because its relief garrison never arrived. The garrison commander was delayed by a landslide. What caused the defeat?  
     A) The landslide (it physically prevented help).  
     B) The absence of the garrison (the fortress could have held *if* they’d come).  
     C) The attackers’ strength—focusing on "what wasn’t there" distracts from what *was*.  

  5. **The Black Death’s Bargaining Power**: After the Black Death, European peasants gained higher wages. No single lord or plague victim "decided" this. What caused the shift?  
     A) The death toll itself—it changed the labor-to-land ratio.  
     B) Countless individual negotiations—the shift was the sum of small choices.  
     C) It’s not a causal question; it’s describing a structural change.  

  6. **Sarajevo Without Gavrilo Princip**: If Gavrilo Princip missed his shot in 1914, would WWI have been avoided?  
     A) No—tensions were too high; another spark would ignite it.  
     B) Yes—without that moment, the chain reaction breaks.  
     C) Unanswerable—we can’t simulate "Europe without it."  

  7. **King vs. Harvest**: A kingdom collapses. Historian A blames the king’s reckless taxes; Historian B blames a crop failure that sparked famine. Both have evidence.  
     A) They’re both partly right—it was the combination.  
     B) Neither is "the cause"; they highlight different aspects.  
     C) One must be primary—either taxes worsened the famine, or famine weakened tax resistance.  

  8. **The Chaos Coin Flip**: A revolution starts when a protestor slips on a pebble, sparking panic. In a re-run without the pebble, sunny weather leads to calm dispersal. What caused the revolution?  
     A) The pebble—it made the critical difference.  
     B) The political context—the pebble was just a trigger.  
     C) Causation doesn’t apply—this is random contingency.  

  9. **The Grain Price Spike (1789)**: A historian says "poor harvests caused bread prices to rise, which caused the French Revolution." Is this causal?  
     A) Yes—it’s a chain of events.  
     B) Only if we ignore politics—prices alone don’t cause revolution.  
     C) It’s shorthand for a complex web of factors.  

  ---

  ### **Scoring Key**
  Tally your answers and match patterns to positions:

  | **Position**               | **Core Belief**                                                                 | **Answer Pattern**                                  |
  |----------------------------|---------------------------------------------------------------------------------|-----------------------------------------------------|
  | **Pure Counterfactualist** | Only difference-makers are causes. Overdetermination dissolves upon inspection. | Dominantly **B** (esp. Q1, Q2, Q3, Q4, Q8)         |
  | **INUS/Network View**      | Causes are insufficient but necessary parts of unnecessary sufficient conditions. Overdetermination is normal. | Dominantly **A** (esp. Q1, Q2, Q7, Q9)             |
  | **Contrastivist/Pluralist**| "The cause" depends on the contrast class (e.g., "why this *rather than that*?"). | Dominantly **C** (esp. Q1, Q3, Q6, Q7, Q9)         |
  | **Pragmatic Selectionist** | One causal structure exists, but we pick "the" cause based on interests/values. | Mix of **C** (Q1, Q7) and **A/B** depending on focus (Q3, Q4, Q5) |
  | **Structuralist**          | Surface events are effects; real causes are systems (e.g., economics, demography). | **A/C** on structural cases (Q5, Q9), **C** on events (Q6, Q8) |
  | **Covering-Law Theorist**  | Singular causation is illusory; explanation requires general laws.              | **C** on Q8/Q9, **A** only if laws are implied (Q5, Q9) |
  | **Narrativist**            | History explains via narrative coherence, not causation.                       | **C** on causal questions (Q3, Q4, Q9), **B/C** on Q6, Q8 |

  ---

  ### **Diagnostics & Edge Cases**
  - **Unoccupied Combinations**:  
    - **Counterfactualist + Structuralist**: Incoherent. Structuralists reject "difference-making" as primary; counterfactualists demand token-level interventions.  
    - **Covering-Law + Narrativist**: Unattractive. Covering-law assumes scientific causality; narrativism denies it.  

  - **Indistinguishable Positions**:  
    - **Contrastivist vs. Pragmatic Selectionist**: The quiz struggles to separate these (both endorse context-dependence). Look at Q3/Q4: Contrastivists lean **C** ("depends on contrast"); Selectionists lean **A/B** ("picked by interest").  
    - **Narrativist vs. Structuralist**: Similar on Q5/Q9, but Narrativists reject *all* causal language (Q3/Q4 **C**), while Structuralists accept "structural causation" (**A/C** on Q5).  

  - **Unexplored Views**:  
    - **Process Metaphysics** (e.g., Whitehead): Not captured; needs questions about continuous change vs. events.  
    - **Probabilistic Causation**: Hard to test without explicit probability scenarios.  

  ---

  ### **Why This Works**
  - Concrete cases bypass label wars and reveal intuitions.  
  - **Key Discriminators**:  
    - Q1/Q2 test tolerance for symmetric overdetermination.  
    - Q3/Q4 test acceptance of absences/preventions as causes.  
    - Q5/Q6/Q8 force a stance on structure/contingency.  
    - Q7/Q9 probe monist vs. pluralist impulses.  
  - Narrativism is distinguishable: If a reader rejects *all* causal language (e.g., Q9 **C** = "just shorthand"), they’re likely narrativist.  

  Use this to map your group’s fault lines—then assign readings accordingly!
