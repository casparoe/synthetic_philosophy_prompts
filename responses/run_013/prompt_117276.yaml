  ## The Detached Observer: Your Experiences, Objectively Considered

  *This month, we welcome Dr. Anya Sharma, a researcher specialising in the scientific study of subjective experience. Dr. Sharma employs a method called heterophenomenology, focusing strictly on what people *report* about their inner world, without making assumptions about the reality behind those reports. She’ll be offering her unique perspective on your dilemmas.*

  ---

  **Dear Observer,**
  My partner is driving me spare! If I say the room’s freezing, he insists it’s perfectly warm. If I say the soup needs salt, he claims it’s fine. We end up bickering over who’s “right.” How can we resolve this when we’re experiencing things so differently?
  *– Perplexed in Preston*

  **Dear Perplexed,**

  Thank you for your clear report of the situation. From your letter, I can construct a detailed picture: You consistently report feeling cold in the room and finding the soup insufficiently salty, while your partner reports feeling warm and finding the soup adequately seasoned. You also report experiencing frustration and a desire to determine who is objectively correct.

  The method I use treats these reports – yours and, by extension, what you report his to be – as the primary data. We take you as the final authority on *how things seem to you*: the room *seems* cold to you, the soup *seems* undersalted. Similarly, we take his reported utterances (as relayed by you) as authoritative for *how things seem to him*: the room seems warm, the soup seems fine. Your reports about your frustration are also integral data points about your subjective state.

  My method does not, however, license an investigation into whether the room *was* objectively cold, or the soup *was* objectively undersalted. It focuses solely on explaining why *you* reported feeling cold and finding the soup lacking, and why *he* reported the opposite, based on the beliefs, desires, and sensory systems we attribute to each of you to make sense of the utterances. It cannot adjudicate which report corresponds to an external, measurable reality; that falls outside its scope. The conflict arises from differing reports of subjective experience, not necessarily from one of you being "wrong" about your own feeling. Explaining the origin and consequences of these differing reports is our task, not declaring a winner.

  ---

  **Dear Observer,**
  I’ve been seeing a therapist who encourages deep introspection to uncover the “true facts” of my emotional state. She says I need to look inward honestly. But after reading about your approach, I’m confused. Should I trust what my own introspection tells me, or is it unreliable?
  *– Seeking Certainty in Stirling*

  **Dear Seeking Certainty,**

  Your report details engaging with a therapeutic practice that relies on first-person introspection as a method to discover factual truths about your inner state. You also report experiencing confusion about the reliability of this introspection.

  My methodological commitment requires me to treat *all* verbal reports – including those generated by introspection – as texts to be explained, not as privileged pathways to underlying truths. When you tell me (or your therapist) what your introspection reveals – say, that you feel deep-seated anger or profound sadness – I accept that *this is what you report experiencing*. That report is a crucial datum. Your feeling that introspection gives you direct access is also part of the data about how things seem from your perspective.

  However, the method does not evaluate whether the content of your introspection *corresponds* to an actual, inner "fact." It rejects the notion that introspection provides a special scientific window into hidden realities within. The therapist's framework assumes such access is possible and valuable; my framework does not incorporate that assumption. We explain *why* you report the introspections you do, based on attributed beliefs, past experiences, current stimuli, and the influence of the therapeutic context itself. Whether you "trust" your introspection is a belief you hold, which we can also seek to explain; the method itself remains neutral on whether introspection reveals underlying truths, as it focuses solely on the reports generated.

  ---

  **Dear Observer,**
  This all feels a bit… indirect. If your method only studies what people *say* about their experiences, how can it ever tell us what an experience is *actually like*? Aren’t you just studying reports, not the real feeling? Couldn’t someone say all the right things about pain but not actually feel it?
  *– Wondering in Wrexham*

  **Dear Wondering,**

  Your question touches directly on the core principles and boundaries of my approach. You report a concern that studying verbal reports might miss the actual, intrinsic quality of experience itself, and you raise the possibility of a being who produces identical reports without any accompanying subjective feeling – what we might call a ‘phenomenological zombie’.

  You are correct: the heterophenomenological method focuses exclusively on the subject’s reports and behaviours, from which we construct their ‘heterophenomenological world’. This world contains entities like ‘reported pains’ or ‘described after-images’. Our scientific goal is to explain the mechanisms that produce *those reports*.

  The method explicitly *does not* claim access to what the experience is “actually like” from the inside. It explains the subject’s behaviour, including their utterances, by attributing beliefs, desires, and perceptual states (like *believing* one is in pain, or *desiring* to report a chill). The question of whether there is an intrinsic, ineffable “feeling” accompanying those reports – what philosophers call ‘qualia’ – falls outside the scope of this methodology. We remain agnostic on that point.

  Regarding the ‘zombie’: The method treats a subject reporting pain and a hypothetical zombie reporting pain identically. Both produce the same behavioural output (the report). The method explains that output by attributing the same beliefs and perceptual states to both. It cannot scientifically detect a difference between them, because the difference (the presence or absence of subjective feeling) is not reflected in the observable data (the reports and other behaviours). Therefore, within the bounds of this method, *once we have fully explained all the reports and behaviours, there is nothing left over to explain*. This is not a denial of experience; it is a statement about the completeness of the explanation *within this specific framework*. The question of “actual feeling” is set aside as not scientifically tractable via these means. Its strength is neutrality; its limitation is that it cannot access the subjective interior itself, only the outward expressions of it.

  *Dr. Anya Sharma thanks you for your thoughtful questions. Remember, she is interested solely in your reports of your experience. (As for how writing this column *seemed* to her? That’s her heterophenomenological world, not ours!)*
