answer: |-
  Below is your Q&A prep sheet, structured by objection severity (likelihood × damage), steelmanned, and tailored to this audience's commitments. I've flagged disciplinary variants of core objections, noted who will likely speak, and identified the conceptual crux for each.  

  ---

  ### **Objection 1: "This collapses law into pure policy—it’s a floodgates argument."**  
  **Who:** Tort scholars (especially duty-to-rescue skeptics) + criminal law person.  
  **Phrasing:** *"If baselines are just normative/pragmatic, won’t this make omission liability limitless? If I forget to buy my neighbor a birthday present and they die alone, is that 'causation'? You’ve erased the line between misfeasance and nonfeasance."*  
  **Crux:** *That legal duties (like rescue) require a causal constraint to avoid overextension.*  
  **Concede upfront:** Not all normatively salient omissions *should* attract liability—the law needs limiting principles.  
  **Reply (2 min):** "Baseline relativism *explains why* the law already restricts omissions to duty-bound contexts (e.g., lifeguards, parents). The ‘causal’ line was *always* a proxy for ‘was there a duty?’—we just make that explicit. Floodgates are controlled by *which baselines the law adopts*, not by causal metaphysics. Your neighbor case fails because no legal baseline treats gift-giving as obligatory."  
  **Soft spot:** *"Doesn’t this make duty *sufficient* for causation? What if the lifeguard’s omission couldn’t physically have changed the outcome?"*  
  **Grade:** **Hold** (but concede law needs duties; your point is that causation doesn’t).  

  ---

  ### **Objection 2: "But counterfactuals don’t care about baselines! Omissions are *just* absences."**  
  **Who:** Humean reductionists / interventionists (e.g., Lewisians, Woodwardians).  
  **Phrasing:** *"Your ‘baseline’ is redundant. Causation *is* counterfactual dependence: ‘Her omission caused death’ just means ‘Had she acted, death wouldn’t have occurred.’ Where’s the relativism?"*  
  **Crux:** *That counterfactual dependence is objective and baseline-free.*  
  **Concede upfront:** Yes, omissions involve counterfactual dependence.  
  **Reply (2 min):** "But *which* counterfactual? ‘Had she acted’ assumes a baseline (e.g., ‘she *should* have acted’). Why not ‘had she been unconscious’ or ‘had she been in Bolivia’? We only pick the normatively loaded counterfactual because we’ve tacitly selected a baseline where action was expected. Dependence is real; *which* dependence we call ‘omissive causation’ is relative."  
  **Soft spot:** *"Isn’t the relevant counterfactual fixed by the actual cause’s *physical* preconditions? (e.g., the victim needed *this* lifeguard’s intervention)."*  
  **Grade:** **Hold** (crux: baselines select *which* dependence matters, even if dependence is physical).  

  ---

  ### **Objection 3: "You’ve made causation subjective. What about causal structure?"**  
  **Who:** Mechanists / physicalists (e.g., Salmon-Dowe school).  
  **Phrasing:** *"Causal processes are transfers of conserved quantities. Absences don’t transfer energy—they’re not in the causal structure. Your ‘baselines’ sound like mental projections onto a physical world."*  
  **Crux:** *That causation must be grounded in physical processes.*  
  **Concede upfront:** Omissions involve no energy transfer; they’re not "causal relata" in mechanistic terms.  
  **Reply (2 min):** "I agree omissions aren’t physical *relata*. But we *attribute* causal responsibility using omissions (e.g., ‘the power outage caused the data loss’). Baseline relativism explains *why* we do this: we contrast actual events (no electricity) with a normatively expected baseline (electricity flowing). The ‘causation’ here is in the *attribution*, not the metaphysics. Physical structure is unchanged."  
  **Soft spot:** *"Then is ‘omissive causation’ just a useful fiction? Should law abandon it?"*  
  **Grade:** **Concede letter, hold spirit** (Yes, it’s attributional—but that’s why law *can’t* abandon it; duty does the work).  

  ---

  ### **Objection 4: "This is a Trojan horse for skepticism—it erodes causation everywhere."**  
  **Who:** Metaphysicians (all camps) + legally-minded philosophers.  
  **Phrasing:** *"If causation-by-omission is just contrast-relative, why not *all* causation? ‘The spark caused the fire’ implicitly contrasts with no-spark worlds. Aren’t *all* causes just departures from a baseline?"*  
  **Crux:** *That contrast-relativity must be universal or nowhere.*  
  **Concede upfront:** Many causal claims *are* contrastive (e.g., "smoking caused cancer *in him* but not her").  
  **Reply (2 min):** "But with omissions, the baseline *must* be normative. For positive causation (e.g., sparks), contrasts can be physical (spark vs. no-spark). With omissions, the baseline is *always* ‘what should have happened’—there’s no ‘absence’ to point to without it. That’s the asymmetry: positive causes have physical relata; omissions have normative baselines."  
  **Soft spot:** *"What about ‘double prevention’ (e.g., removing a barrier)? Isn’t that physical?"*  
  **Grade:** **Hold** (crux: omissions lack physical relata; double prevention doesn’t).  

  ---

  ### **Objection 5: "You’ve ignored how courts actually *reason* about omissions."**  
  **Who:** Torts scholars (especially case-law formalists).  
  **Phrasing:** *"Courts don’t just ask ‘was there a duty?’—they scrutinize *proximate cause* for omissions (e.g., was the harm foreseeable? Intervening causes?). If omissions aren’t causal, why test for proximate cause?"*  
  **Crux:** *That legal practice treats omissions as causal.*  
  **Concede upfront:** Courts *do* use proximate cause for omissions.  
  **Reply (2 min):** "Because proximate cause isn’t about metaphysics—it’s about policy and fairness. Baseline relativism fits: once we fix a duty-bound baseline (e.g., ‘doctor should have monitored’), we ask whether the *type* of harm was foreseeable relative to *that* baseline. The ‘causal’ language is scaffolding for normative limits on liability."  
  **Soft spot:** *"Then why not say duty + proximate cause does all the work?"*  
  **Grade:** **Concede letter, hold spirit** (Yes—that’s my point! Causation is the scaffold, not the foundation).  

  ---

  ### **Objection 6: "This resolves nothing—it just relabels the dispute."**  
  **Who:** Omissions specialists (published on topic).  
  **Phrasing:** *"You claim we’re ‘mistaking baselines for discoveries,’ but baselines *are* what we debate! (e.g., ‘Was the parent’s baseline "watch constantly" or "check occasionally"?’). You’ve just shifted ‘verbal dispute’ from ‘causation?’ to ‘baseline?’."*  
  **Crux:** *That baseline selection reproduces the original problem.*  
  **Concede upfront:** Debates over baselines will persist.  
  **Reply (2 min):** "But now we debate the *real* issue: what baseline *should* we adopt (morally, legally)? Not the pseudo-issue: ‘Is this *really* causation?’ The metaphysics is solved: once a baseline is set, causal dependence is objective. Your life’s work isn’t wasted—it *clarifies* the stakes."  
  **Soft spot:** *"Then why call it ‘causation’? Why not ‘responsibility’?"*  
  **Grade:** **Hold** (crux: causation *is* the right term for dependence-on-baseline).  

  ---

  ### **Pre-empt in Opening**  
  1. **To metaphysicians:** *"This isn’t causal anti-realism—it’s about how we *parse* causation when physical relata are absent."*  
  2. **To lawyers:** *"This doesn’t expand liability—it shows why duty has *always* been the real limit."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"If baselines are normative, and causation is relative to them, isn’t all causal judgment in law—even for positive acts—just politics in a metaphysical trench coat?"*  
  **Why it hurts:** Forces you to either abandon physical causation or concede law’s causal discourse is wholly pragmatic.  
  **Blunt reply:** *"No—positive acts involve physical relata; omissions don’t. Law uses ‘causation’ *differently* for each because metaphysics licenses it for one and not the other. Baselines bridge the gap where physics runs out."*  

  ---  
  **Key Strategy:** For philosophers, stress that *dependence is real but contrast-relative*; for lawyers, stress that *duty does the work causation can’t*. Anchor both in the act/omission asymmetry.
