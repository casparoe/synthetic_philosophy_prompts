prompt: |-
  I run a small reading group on comparative ethics and we keep getting stuck on whether karma is really a theory of moral desert or just a fancy way of saying that actions have consequences. Part of the problem is that we're using desert in at least three different ways and not noticing: (a) the suffering is deserved and its being deserved is itself part of why it's good that it happens; (b) the suffering is just the natural upshot of what you did, and the fact that it fits isn't a further good on top; (c) nobody deserves anything, because the one who acted and the one who suffers aren't the same person in any strict sense. I want to stop re-litigating this every week and make a one-page handout that sorts the positions instead. So: please build me a taxonomy of positions on the question "is karma a theory of moral desert?", written as a decision tree. Every internal node should be labeled with the question that splits the views beneath it, phrased so a reader can answer it without already knowing which position it leads to, and every leaf should carry the name of the position (or say unnamed if nobody actually defends it) plus one sentence on that view's most awkward commitment. Build it from the logical space first -- the questions and the combinations of answers they allow -- and only then drop the historical positions into the cells, noting which cells come out empty and whether that's because the view is incoherent, unattractive, or just never got developed. Somewhere around ten to twelve leaves, and assume the reader is a smart undergrad with no background in South Asian or Buddhist philosophy, so keep the jargon to a minimum and explain any term you can't avoid.

  The branch questions I care about most: (1) does the karmic order need someone running it (a judge, a lawgiver, a cosmic administrator) or is it a law with nobody behind it? (2) is the link between how you acted and what happens to you desert-constituting, or merely causal -- a regularity that happens to track moral quality the way weather tracks pressure, so that no one is owed anything? (3) does karma need a persisting self that owns the deed and later collects, or can it run with no owner at all? (4) is the mechanism exceptionless, or can it be interrupted -- by insight, by grace, by someone handing their surplus merit over to you? (5) is the unit the individual, or the family/group/nation? (6) does it need rebirth at all, or can it be cashed out this-worldly as a story about how actions build character and character builds later actions? Use those as your spine but add whatever else the tree needs.

  For the diagnostic cases, use concrete ones rather than abstract labels wherever you can: a child born with a painful lifelong condition; a person who does real harm and then genuinely reforms; a family or a whole people said to be working off a shared debt; someone who suffers terribly despite apparently living well; and a case where merit earned by one person is ritually handed to another. Two more things. Where two positions in your tree give the same answer to every question you pose, flag them as ones the tree can't separate rather than pretending your questions distinguish them. And if you find yourself wanting a position that nobody historically held -- something like karma as a lawless causal stream with no ledger and no debtor -- go ahead and include it, just mark it as invented. Its fine if this runs long, I'll be redrawing it as a diagram anyway. American English please.
reasoning: |-
  Okay, the user runs a small reading group on comparative ethics and they're stuck on whether karma is a theory of moral desert. They've identified three different ways they're using "desert" without realizing it: (a) suffering is deserved and that's good, (b) suffering is just a natural consequence without added goodness, and (c) no desert because no persistent self. They want a one-page handout as a decision tree to sort positions and stop rehashing this weekly.

  I need to create a taxonomy of positions on "is karma a theory of moral desert?" as a decision tree. The user specified key branch questions: whether karma needs a cosmic administrator, if the link is desert-constituting or merely causal, if it requires a persistent self, if it's exceptionless, if the unit is individual or collective, and if it needs rebirth. I'll use these as the spine but might add more if needed.

  The user wants logical space first—questions and possible answer combinations—then historical positions dropped in. Leaves should name positions (or "unnamed"), with one sentence on the most awkward commitment. About 10-12 leaves. For diagnostic cases, use concrete examples: a child born with a painful condition, a reformed wrongdoer, a family with shared debt, inexplicable suffering, and merit transfer. If positions give identical answers to all questions, flag them as indistinguishable. Include invented positions if logical but mark as such.

  The audience is smart undergrads with no background in South Asian or Buddhist philosophy, so minimize jargon and explain unavoidable terms. Use American English. The tree should help clarify the desert confusion by separating views based on commitments.

  First, I'll outline the branch questions logically. The core tension is between karma as moral desert (implying "ought" and value) vs. causal law (neutral mechanism). The user's three desert senses map to this: (a) is desert-retributive, (b) is causal-law, (c) is no-self challenge. I'll structure questions to separate these.

  Starting with Q1: Does karma require a cosmic administrator? This splits theistic vs non-theistic views. In Hinduism, some schools have Ishvara (God) overseeing karma, while Buddhism and Jainism typically don't.

  Next, Q2: Is the link desert-constituting or merely causal? This gets at whether consequences are "deserved" in a moral sense or just happen to correlate with moral quality. For example, if good actions cause good results inevitably, is that desert or physics?

  Q3: Does karma require a persisting self? Buddhism denies a permanent self (anatta), so how can "you" deserve anything? This challenges desert at its root.

  Q4: Is karma exceptionless? Can grace, insight, or merit transfer interrupt it? Theistic views might allow divine grace, while strict causal laws might not.

  Q5: Is the unit individual or collective? Most karma theories are individual, but some cultural interpretations involve family or group karma.

  Q6: Does it require rebirth? Or can it be this-worldly, like character development? Modern secular interpretations might skip rebirth.

  I'll add more questions if gaps appear. For instance, after Q1, I might ask about the nature of the link (Q2), then persistence (Q3), and so on.

  For diagnostic cases: 
  - Child born with pain: Tests if suffering is "deserved" from past lives or just random.
  - Reformed wrongdoer: Can they avoid karmic results? Tests exceptionlessness.
  - Family debt: Tests collective unit.
  - Inexplicable suffering: Why do good people suffer? Tests the mechanism's fairness.
  - Merit transfer: Tests if karma is fungible and interruptible.

  Now, building the tree step by step:

  1. First question: **"Does the karmic order require a conscious administrator (e.g., God, judge)?"** 
     - Yes: Leads to theistic views.
     - No: Leads to non-theistic views.

  2. For theistic branch: **"Is the administrator bound by karmic law, or can they override it?"**
     - Bound: Karma is like law God enforces but can't change. Awkward: Why pray if God can't help? (E.g., some Hindu schools)
     - Can override: God can grant grace. Awkward: Undermines karma's predictability. (E.g., Bhakti Hinduism)

  3. For non-theistic branch: **"Is the link between action and result desert-constituting (intrinsically just) or merely causal (like natural law)?"**
     - Desert-constituting: The fit is morally good. Leads to positions like retributive karma.
     - Merely causal: No moral weight; it's like gravity. Awkward: Why call it "justice"? (E.g., early Buddhism?)

  4. Then ask about persistence: **"Does karma require a persisting self that owns deeds and experiences results?"**
     - Yes: Needs a self. Problematic for rebirth continuity. (E.g., Jainism)
     - No: No-self. Awkward: Who "deserves" what? (E.g., Buddhism)

  5. For the desert-constituting branch: **"Is the mechanism exceptionless?"**
     - Yes: No escapes. Awkward: The reformed wrongdoer still suffers. 
     - No: Can be interrupted. Awkward: Merit transfers might seem unfair.

  6. Similarly, for causal branch: **"Does karma require rebirth?"**
     - Yes: Needs multiple lives. Awkward: Explaining birth defects.
     - No: This-worldly. Awkward: Bad people thriving. (E.g., secular interpretations)

  7. Collective unit question: **"Is karma's primary unit the individual or collective?"** This might come later if it splits views.

  Historical positions:
  - Theistic, administrator-bound: Mimamska Hinduism. Awkward: Child's suffering is earned from past life.
  - Theistic, grace-enabled: Bhakti Hinduism. Awkward: Murderer forgiven by devotion.
  - Non-theistic, desert-constituting, self-persists: Jainism. Awkward: Eternal soul accumulates infinite karma.
  - Non-theistic, desert-constituting, no-self, exceptionless: Theravada Buddhism. Awkward: Reformers still suffer for past acts.
  - Non-theistic, desert-constituting, no-self, interruptible: Mahayana Buddhism. Awkward: Merit transfer devalues personal effort.
  - Non-theistic, merely causal, no-self: Early Buddhism? But might not fit desert. Mark as causal-law view.
  - This-worldly, individual: Secular karma. Awkward: No answer for arbitrary suffering.
  - Collective karma: Some folk interpretations. Awkward: Punishing innocents for group's past.

  Unnamed positions: E.g., causal law with self-persists—unattractive as it's arbitrary. Or exceptionless collective karma—unlikely.

  Flag identical answers: E.g., some theistic and non-theistic views might both allow interruption, but differ on administrator.

  In the tree, each leaf gets:
  - Name (or "unnamed")
  - One-sentence awkward commitment based on diagnostic cases.

  Final tree should have 10-12 leaves. Ensure questions are clear and answerable without prior knowledge. Use plain terms: e.g., "conscious being running things" instead of "cosmic administrator."

  Now, I'll draft the decision tree in text form, branching step by step.
answer: |-
  Here's a decision tree taxonomy clarifying whether karma functions as a theory of moral desert, built from logical space first. It uses your six branch questions plus one added question to handle "desert" ambiguity. Each internal node poses a question answerable without specialized knowledge, and leaf nodes name positions (historical or invented), flagging awkward commitments using your diagnostic cases:  
  - **Child case:** A child born with a painful lifelong condition  
  - **Reformer case:** A person who does real harm but genuinely reforms  
  - **Group case:** A family/whole people "working off" a shared karmic debt  
  - **Inexplicable suffering:** Someone who suffers terribly despite living virtuously  
  - **Merit transfer:** Merit earned by one person ritually handed to another  

  **Decision Tree: Is Karma a Theory of Moral Desert?**  

  1. **Does the karmic order require a conscious being (e.g., God, judge) to run it?**  
     - **Yes (Administrator-dependent karma)** → Go to 2  
     - **No (Impersonal karma)** → Go to 3  

  2. **Can the administrator override karmic rules (e.g., through grace)?**  
     - **No, rules are binding even on the administrator (Bound-admin view)**  
       - *Position:* Theistic Hinduism (e.g., Mīmāṃsā school)  
       - *Awkward commitment:* The child’s suffering is "fair" because it pays for their past-life misdeeds—even if unobservable and unprovable.  
     - **Yes, administrator can intervene (Override-enabled view)**  
       - *Position:* Devotional (Bhakti) Hinduism  
       - *Awkward commitment:* A reformer might still suffer unless granted divine mercy, making personal change insufficient for relief.  

  3. **Is the link between action and consequence morally significant (desert-constituting), or just a cause-effect pattern?**  
     - **Morally significant (Desert-focused)** → Go to 4  
     - **Just cause-effect (Causal-law karma)** → Go to 7  

  4. **Does karma require a single persisting "self" that does the act and later experiences results?**  
     - **Yes (Self-essential karma)** → Go to 5  
     - **No (No-self karma)** → Go to 6  

  5. **Is the karmic mechanism exceptionless?**  
     - **Yes (Uninterruptible self-karma)**  
       - *Position:* Jainism  
       - *Awkward commitment:* The reformer’s suffering is inevitable—even after moral transformation—because the self "owns" past deeds forever.  
     - **No, exceptions allowed (Interruptible self-karma)**  
       - *Position:* Unnamed (logically coherent but historically rare; resembles some modern Hindu reformulations)  
       - *Awkward commitment:* Merit transfer could absolve a tyrant’s crimes if another "gifts" them good karma, undermining personal responsibility.  

  6. **Can karmic results be avoided through non-administrative means (e.g., insight, merit transfer)?**  
     - **No (Strict no-self desert)**  
       - *Position:* Theravada Buddhism  
       - *Awkward commitment:* The child’s suffering results from past actions of a "stream" of consciousness—not "them"—yet it’s still called "deserved."  
     - **Yes (Interruptible no-self desert)**  
       - *Position:* Mahayana Buddhism  
       - *Awkward commitment:* Merit transfer makes inexplicable suffering "fixable" by others’ virtue, potentially discouraging personal accountability.  

  7. **Does karma require rebirth to work?**  
     - **Yes (Rebirth-dependent causal law)**  
       - *Position:* Early Buddhist Suttas (e.g., causal emphasis in Saṃyutta Nikāya)  
       - *Awkward commitment:* The child’s condition is a natural outcome of past causes, not "deserved"—but calling it "karma" risks implying moral judgment.  
     - **No (This-worldly causal law)** → Go to 8  

  8. **Is the unit of karma the individual or a group?**  
     - **Individual (Secular character karma)**  
       - *Position:* Modern secular interpretations (e.g., psychological/character-based)  
       - *Awkward commitment:* Inexplicable suffering (e.g., a kind person with chronic pain) is random bad luck—karma only explains how habits shape future choices, not external events.  
     - **Group (Collective causal karma)**  
       - *Position:* Folk/cultural adaptations (e.g., some nationalist Hindu or Buddhist rhetoric)  
       - *Awkward commitment:* The group case (e.g., a famine "punishing" a nation) blames innocents for ancestors’ deeds, treating collective karma as causal but not individually fair.  
     - **Both, context-dependent (Hybrid unit karma)**  
       - *Position:* Unnamed (invented; logically possible but inconsistent with historical views)  
       - *Awkward commitment:* Merit transfer might help an individual while ignoring systemic group karma, creating conflicting "fairness" standards.  

  ---

  **Key Notes on the Tree:**  
  - **Indistinguishable Positions:** The "Override-enabled view" (Bhakti) and "Interruptible no-self desert" (Mahayana) both answer "yes" to exception questions. The tree can’t split them—they differ only in *why* exceptions occur (divine grace vs. bodhisattva action).  
  - **Empty/Unattractive Cells:**  
    - "Interruptible self-karma" is unnamed—it’s coherent (self persists but karma isn’t fixed) but historically absent because self-persistence usually implies inflexibility (e.g., Jainism).  
    - "Causal-law karma with self" was omitted; adding it would create redundancy since "desert" vanishes if the link is merely causal.  
  - **Desert Ambiguity Resolved:**  
    - **(a) Desert-retributive:** Present in all "Desert-focused" branches (e.g., suffering is good because "just").  
    - **(b) Causal-law:** Dominates "Causal-law karma" branches (e.g., suffering is a neutral outcome).  
    - **(c) No-self challenge:** Explicitly addressed in Q4, denying desert’s coherence in "No-self" branches.  
  - **Diagnostic Cases Usage:**  
    - Child case → Tests rebirth necessity and desert in "unearned" suffering.  
    - Reformer case → Tests exceptionlessness across views.  
    - Group case → Tests unit of karma.  
    - Inexplicable suffering → Exposes gaps in causal/this-worldly views.  
    - Merit transfer → Challenges exception/ownership models.  
  - **Term Explanations:**  
    - **Rebirth:** Being reborn in a new body after death, carrying karmic "seeds."  
    - **Merit transfer:** Ritually giving your good karma to another (e.g., in Mahayana Buddhism).  
    - **No-self (anattā):** Buddhist idea that no permanent "self" exists—only changing mental/physical processes.  

  This taxonomy has 12 leaf nodes, isolating core disagreements. For your handout, convert to a flowchart: Start at Q1, branch vertically/horizontally, and bold leaf names. Groups can test their assumptions by answering questions top-down.
