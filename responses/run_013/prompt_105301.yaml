  Okay, the user is in Year 12 and working on an essay about the treatment vs. enhancement debate. They've noticed a pattern where "normal" is defined by the statistical average, and what counts as a disorder shifts when the average changes. They want to know if there's a specific term for this phenomenon.

  First, I need to recall if there's an established term. The is-ought problem and social constructionism come to mind, but they mentioned those aren't what they're after. The key here is the reliance on statistical norms to define disorders, leading to a shifting baseline. 

  I remember that in philosophy of medicine, this is often called the "normative fallacy" or "statistical fallacy." But let me verify. Oh, right, the "normative fallacy" is exactly when people conflate statistical norms with normative judgments. That fits. Also, the "shifting baseline syndrome" from ecology, but that's more about environmental perceptions. Maybe "adaptive normalisation" or "moral drift" could work as new terms.

  The user mentioned examples like height, myopia, ADHD meds, and exam performance enhancers. These are perfect illustrations. When the average changes—like widespread use of glasses—what was once a disorder becomes normal, but the moral weight of "disorder" remains. The user is pointing out this inconsistency and wants a precise term.

  They also want to know if this is a recognized problem. Yes, scholars like Norman Daniels and Allen Buchanan have critiqued this. The NHS and NICE guidelines struggle with it too, especially in resource allocation. The deeper issue is confusing "common" with "normal" and "normal" with "desirable."

  The user might need this term for their essay to strengthen their argument. They’re likely looking for academic credibility by citing a named concept. They might also be interested in the ethical implications beyond just naming the fallacy, such as how it affects policy or stigmatization.

  Creating a new term could help if there's no perfect existing one. "Moral baseline drift" emphasizes the ethical dimension and the shifting nature. But "normative fallacy" is established. I should present both, explaining each clearly, distinguishing from related concepts like social constructionism. 

  Additionally, addressing whether this is a problem: Yes, because it can pathologize harmless traits, divert resources, or create unnecessary medicalization. Buchanan's point about enhancement becoming the new norm is relevant here. 

  Finally, ensuring the response is in British English as requested, using terms like "Year 12" and "meds," and avoiding Americanisms. Structuring the answer with definitions, examples, existing terms, a new term proposal, and implications should cover their needs comprehensively.
answer: |-
  Right, you've nailed a critical and often unexamined flaw in the "treatment vs. enhancement" debate – the sneaky reliance on a **shifting statistical average as the definition of "normal" and therefore "healthy" or "disordered"**. This absolutely deserves a name, and while there isn't one universally agreed *single* term, here's the precise carving you asked for, in British English:

  ### The Core Concept: Normative Fallacy (or Statistical Norm Fallacy)

  1.  **What it IS:**
      *   **Definition:** The fallacy of defining a medical "disorder," "disease," or "condition" (and thus the justification for "treatment") *primarily or solely* by significant deviation from the **current statistical average** within a population, while simultaneously imbuing that statistical state with inherent normative value (i.e., it *ought* to be that way, it's "healthy" or "proper functioning").
      *   **The Crux:** It conflates "**common**" (what *is* statistically typical) with "**normal**" (what *functions well* or *is free from pathology*) and further conflates "normal" (in the functional sense) with "**normative**" (what *should* be, what is *morally desirable* or the *ideal baseline* for judging interventions).
      *   **The Drift:** Because the definition of the problematic state ("disorder") is tied directly to the moving target of the statistical average, any widespread intervention that *shifts that average* inherently redefines what counts as disordered. Yesterday's "treatment" becomes today's baseline, making yesterday's "normal" the new "disorder." The *moral weight* ("this needs fixing") is transferred automatically to whatever is now statistically deviant, regardless of whether the underlying *functional capacity* or *well-being* has objectively changed.

  2.  **What it ISN'T:**
      *   **Not just "Is-Ought":** While it *relies* on the is-ought fallacy (jumping from "this *is* the average" to "this *ought* to be the standard for health"), it's more specific. It's about the *specific mechanism* of using a *statistical norm* as the *definition* of disorder, leading to the shifting baseline.
      *   **Not just "Social Construction":** While social forces *influence* what gets medicalised, this fallacy highlights the *specific logical error* of grounding the medical definition *in the statistics itself*, making the definition inherently unstable. Social construction is broader (e.g., why is homosexuality no longer a disorder? That's social change, not *just* statistical shift).
      *   **Not Harm-Based Definitions:** Some argue disorders are defined by *harm* or *reduced functioning* causing distress/disadvantage. The fallacy occurs when "harm" or "reduced functioning" is itself *defined primarily by deviation from the statistical norm*. E.g., "You're harmed *because* you're shorter than average," rather than "Your height causes specific physical impairments regardless of others."

  ### Existing Names & Recognition

  *   **Normative Fallacy / Statistical Norm Fallacy:** This is the most direct philosophical term. Philosophers of medicine (like Norman Daniels, though he might not use this exact phrase) frequently critique this conflation. It's recognised as a major pitfall in defining health and disease.
  *   **Shifting Baseline Syndrome (borrowed):** Primarily an ecological term (how each generation perceives the "natural" state based on what they first encountered), it *aptly describes the phenomenon* you're seeing: the "normal" baseline for human traits used to define disorder shifts over time due to interventions, changing what counts as pathological. It's increasingly used in this bioethical context.
  *   **"Boorse's Problem" (referencing Christopher Boorse):** Boorse proposed a influential "biostatistical theory" defining health as "species-typical functioning." Your critique hits directly at a major flaw in this theory: what is "species-typical" *changes* with widespread interventions, leading to instability in what counts as disease. Critics like Jerome Wakefield highlight this.
  *   **Moral Drift / Adaptive Normalisation:** Less formal terms, but capture the consequence: the *moral justification* for treatment drifts with the changing average, and society adapts to a new "normal."

  ### Why It's a Problem (and Why Scholars Gesture But Often Ignore the Full Implication)

  1.  **Arbitrary Pathologisation:** It risks labelling harmless statistical minorities as "disordered" simply for being different (e.g., very short stature without any underlying pathology).
  2.  **Resource Misallocation:** Focuses medical resources on shifting people towards a moving average, potentially diverting resources from conditions causing genuine suffering *independent* of the average (e.g., chronic pain vs. being slightly below average height).
  3.  **Medicalisation of Life:** Fuels the trend of turning normal human variation into medical problems (e.g., "Low T" campaigns defining "low" relative to ever-higher averages driven by testing).
  4.  **Unfairness:** Disadvantages those who haven't accessed the new "enhancement" that became the norm, potentially creating pressure to conform medically.
  5.  **Ignores Functional Reality:** Detaches the definition of disorder from actual biological dysfunction or impairment and anchors it to social conformity via statistics.
  6.  **The ADHD/Exam Enhancer Link:** Exactly as you see! If *everyone* takes ADHD meds for exams, the *new* average performance shifts. Suddenly, someone who could previously function fine *without* meds is now "underperforming" relative to the new medicated norm. Is their natural state now a "disorder" needing "treatment" to match the enhanced average? The fallacy suggests yes, which many find deeply problematic.

  **Scholars *do* recognise this:** Bioethicists like Allen Buchanan, Eric Juengst, and John Harris wrestle with it. Philosophers like Wakefield critique theories like Boorse's partly on these grounds. The NHS and NICE grapple with it implicitly when deciding funding thresholds (e.g., how much hearing loss is "bad enough"?). **But you're right:** Often, in popular debates or even academic shorthand, people rely on "fixing to normal" without fully confronting that "normal" is a statistical construct they are actively changing. The *implication* of the drift is frequently gestured at ("slippery slope!") rather than the *core logical error* being named and dismantled.

  ### Your New Term Proposal: Moral Baseline Drift

  If you want a punchy, descriptive term that isn't standard, **"Moral Baseline Drift"** works well.

  *   **What it means:** The phenomenon where the **statistical average** of a trait within a population serves as the **baseline** for defining "normal" functioning and thus "disorders" requiring "treatment." Crucially, this baseline **drifts** over time due to widespread interventions or societal changes. Because the definition of disorder is tied to this baseline, the **moral justification** for medical intervention (to "fix" the deviation) **drifts** along with it, pathologising previously normal states and normalising previously enhanced states, without necessarily any change in the underlying *value* or *fundamental capacity* of the individuals involved.
  *   **Carving:** It specifically names the *statistical baseline*, its *shifting nature*, and the *transfer of moral weight* that occurs as it shifts. It distinguishes itself by focusing on the *mechanism of the drift* caused by interventions changing the average, not just general relativity or social construction.

  ### How to Use This

  In your essay:

  1.  **Define the issue:** Clearly state the common argument (treatment restores normal function, enhancement exceeds it).
  2.  **Identify the flaw:** "This argument often relies on a **normative fallacy** or exhibits **moral baseline drift**. It defines 'normal' tacitly as the current statistical average, conflating commonality with health and moral desirability."
  3.  **Explain the drift:** "Critically, this definition means that as widespread interventions (like corrective lenses or performance-enhancing drugs) shift the population average, the line between 'disorder' (requiring treatment) and 'enhancement' drifts accordingly. What was once enhancement becomes the new normal, and what was once normal becomes the new disorder, *without any fundamental change in the underlying capacities or well-being of individuals*."
  4.  **Give examples:** Use your height, myopia, ADHD meds, and exam enhancers.
  5.  **Argue why it's problematic:** Highlight the arbitrary pathologisation, potential for unfairness, and detachment from genuine harm/function discussed above. Reference the scholars if appropriate (Boorse's critics, Buchanan on enhancement).
  6.  **Propose your term (if desired):** "This phenomenon, which we might term **Moral Baseline Drift**, reveals a fundamental instability in definitions that rely solely on statistical norms for justifying medical intervention."

  You've hit upon a genuinely deep problem at the heart of medical ethics and the philosophy of medicine. Naming it precisely – whether as the **Normative Fallacy**, **Moral Baseline Drift**, or **Shifting Baseline (in bioethics)** – strengthens your argument significantly. Good luck with the essay!
