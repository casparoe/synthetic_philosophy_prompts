  We are going to undertake a systematic translation from the ethical vocabulary of deception to the economics of information, particularly information design and Bayesian persuasion. We will create a translation dictionary and then apply it to the six species of deceptive acts. Finally, we will discuss the residue: what doesn't translate, what distorts, and what that implies.

  ### Translation Dictionary

  We map key concepts from the ethics of deception to the closest counterparts in information economics:

  1. **The act of assertion**: In information economics, this corresponds to the **sender's message** in a sender-receiver game. The sender (speaker) sends a message (which may be a statement, a signal, or any observable action) to the receiver (hearer). The fit is tight: both are communicative acts. However, note that in economics, the message can be any signal, not necessarily linguistic. Also, the set of possible messages is often taken as given and common knowledge.

  2. **The content asserted**: This maps to the **realization of the signal** or the **message chosen** from the message space. The content is the specific information conveyed by the message. The fit is good for explicit content but less so for implicatures and presuppositions, which rely on the context and the receiver's inference. In economics, the meaning of a message is typically defined by the mapping from states of the world to messages (the sender's strategy) and the receiver's interpretation (updating rule).

  3. **The hearer's uptake**: This is the **receiver's posterior belief** after observing the message. The posterior is a probability distribution over the state space. The fit is very tight because the posterior captures the belief state of the receiver, which is the result of the uptake. However, the ethical framework might consider the hearer's reasoning process (e.g., whether they inferred an implicature) as part of the uptake, while in economics, the posterior is a summary of the belief and the process is often abstracted away.

  4. **The speaker's intention**: In economics, the sender's goal is captured by their **utility function** and the **strategy** they choose to maximize expected utility. The intention to deceive is not explicitly modeled as a separate mental state; instead, it is inferred from the sender's incentives and the chosen strategy. The fit is loose because intentions are not primitive in the economic model; they are reduced to preferences and strategic behavior. The economic model captures the intention only insofar as it affects the choice of message.

  5. **The wrong done**: In ethics, the wrong might be violating a norm of truthfulness, exploiting trust, or causing a false belief. In economics, the wrong is not directly modeled because the framework is positive. However, we can see the wrong as a **welfare loss** or a **reduction in the receiver's utility** relative to a benchmark (e.g., full information). Alternatively, in a normative economic analysis, the wrong might be captured by a **violation of incentive compatibility** or **efficiency** (e.g., if deception leads to a Pareto inferior outcome). The fit is poor because the ethical wrong often involves deontological considerations (e.g., the intrinsic wrong of lying) that are not captured by welfare measures.

  ### Translation of the Six Species of Deceptive Acts

  We model each deceptive act as a sender-receiver problem. The state of the world is denoted by θ, drawn from a prior distribution. The sender observes θ (or sometimes not, but in most cases we assume they do) and sends a message m from a set of possible messages M. The receiver observes m and updates to a posterior belief about θ, then takes an action a that affects both players' utilities.

  **(i) Flatly false assertion made in order to be believed**

  * **Ethics**: The speaker asserts a false statement with the intention that the hearer believe it.
  * **Economics**: This is a case where the sender sends a message that does not correspond to the true state. In a cheap talk game (where messages are costless and unverifiable), the sender may choose to lie if it is in their interest. However, without commitment or costly signals, lying might not be credible. In a model with verifiable information (as in the disclosure literature), the sender can only tell the truth or remain silent. So, to model a flat falsehood, we need a model where the sender can send any message regardless of the truth (like cheap talk). The receiver's posterior will be updated based on the sender's equilibrium strategy. The wrong is that the receiver is induced to have a false belief and take an action that benefits the sender at the receiver's expense.

  **(ii) Literally true assertion whose implicature is false**

  * **Ethics**: The speaker says something true but implies something false.
  * **Economics**: We model this by having the message space M include messages that are literally true but can be interpreted in a way that leads to a false belief. This requires that the receiver's updating rule (which is part of the equilibrium) takes into account not just the literal content but also the implicature. In information design, we might think of the message as a signal that is truthful in one dimension but misleading in another. The key is that the receiver's inference rule (which might be a function of the equilibrium) leads to an incorrect belief about the state. The sender chooses a message that is true but that, given the receiver's inference, leads to a desired posterior. The fit is good if we can model the receiver as drawing an inference beyond the literal meaning. However, the economic model typically does not distinguish between literal and implied content; it just models the posterior. Thus, the mechanism (implicature) is not explicitly represented; only the resulting belief is.

  **(iii) Literally true assertion that trades on a false presupposition**

  * **Ethics**: The speaker says something true that relies on a false presupposition held by the hearer, and the hearer uses that presupposition to draw a false conclusion.
  * **Economics**: Here, the receiver has a prior belief that includes a false presupposition. The sender sends a message that is true but that, when combined with the false presupposition, leads the receiver to a false posterior. We can model this by having the receiver's prior include a false belief about a component of the state. The sender's message is designed to be consistent with the true state but also consistent with the false presupposition, so that the receiver does not update away from it. The economic model captures this as a case of the receiver having a biased prior. However, the ethical issue is that the speaker exploits the false presupposition without correcting it. In economics, the sender is just taking the prior as given and designing the message accordingly. The fit is reasonable, but note that in standard Bayesian updating, if the message is inconsistent with the false presupposition, the receiver would update. So, the message must be chosen so that it does not contradict the false presupposition. The wrong (failing to correct) is not captured because the model doesn't require the sender to correct false priors.

  **(iv) Truthful but selective presentation of evidence**

  * **Ethics**: The speaker presents true evidence, but selectively, knowing which comparisons the hearer will make and thereby inducing a false belief.
  * **Economics**: This is the classic domain of information design and Bayesian persuasion. The sender commits to a signaling strategy (a mapping from states to signals) that is truthful but selective: they reveal only part of the truth. The receiver updates using Bayes' rule and forms a posterior. The sender chooses the signaling scheme (which evidence to present in each state) to maximize their own utility. The fit is excellent: this is exactly what Bayesian persuasion models. The sender does not lie but designs the information to manipulate the receiver's belief. The ethical concern is that the receiver is led to a false belief, but note that in the model, the posterior is always correct given the evidence presented (it's Bayesian). The falsity arises from the incompleteness of the evidence, not from incorrect updating. The wrong is that the sender exploits the receiver's rational updating by withholding information.

  **(v) Deception by omission**

  * **Ethics**: The speaker fails to correct a false default assumption (e.g., that a report is complete or that a price includes tax).
  * **Economics**: This is similar to (iv) but with an explicit default. We can model it by having the receiver have a prior that includes the default. The sender has the option to send a message that would correct the default (if they choose to speak) but instead remains silent. In equilibrium, silence might be interpreted as the default. This can be modeled as a game with a fixed message set that includes an option of "no message" or silence, and the receiver interprets silence as a particular state. Alternatively, in a disclosure model, the sender may choose to disclose or not. If the sender does not disclose, the receiver sticks with the prior (which includes the false default). The fit is good. The ethical wrong of not correcting a false belief is again reduced to the sender's strategic choice to withhold information.

  **(vi) Deception by making the world (no utterance)**

  * **Ethics**: The speaker arranges the world (e.g., plants evidence) so that the hearer observes a state of affairs and draws a false conclusion, without any utterance.
  * **Economics**: This is a case of **signaling** (if the state is not directly observable) or **evidence manipulation**. The sender takes an action (not a message) that affects the receiver's observation. The receiver then updates based on that observation. For instance, the sender might choose to create evidence that is consistent with a false state. This can be modeled in a signaling game where the sender's action (e.g., planting evidence) is costly and may depend on the state. The receiver observes the evidence and forms a belief. The fit is good: this is standard in signaling games. However, note that in this case, there is no communication in the linguistic sense; it's about actions that are informative. The ethical wrong of deceiving without speaking is captured by the sender's manipulation of the informational environment.

  ### Residue Report

  #### What translates cleanly?

  - The core idea that the sender designs information (by choosing messages or signals) to influence the receiver's posterior belief translates very cleanly. The economics of information provides a rigorous framework for modeling how senders can strategically reveal or conceal information to shape beliefs.

  - The species (iv), (v), and (vi) translate very well because they involve the strategic control of information flow. Bayesian persuasion and signaling games are designed to capture these situations.

  - The receiver's posterior belief is central to both frameworks, so any ethical consideration that reduces to the content of the belief (e.g., whether it is true or false) can be expressed in terms of the distance between the posterior and the true state.

  #### What translates with distortion?

  - **Intention**: In ethics, the intention to deceive is a mental state that matters for moral evaluation. In economics, intention is reduced to the choice of a strategy that maximizes expected utility. While the chosen strategy may reveal an intention to deceive, the economic model does not care about the intention per se, only about the action and its consequences. This is a reductionist distortion.

  - **Lying vs. misleading**: The ethics draws a distinction between lying (saying something false) and misleading (saying something true that leads to a false belief). In economics, both are strategies that lead to a particular posterior. If two different strategies (one lying, one misleading) lead to the same posterior, then they are equivalent in the economic model. The point of entry of the falsehood (whether in the assertion or in the inference) does not matter for the outcome. This matches your suspicion: the distinction is causally invisible to economics. The translation distorts by collapsing the distinction.

  - **The hearer's reasoning process**: In ethics, how the hearer arrives at a false belief (e.g., by drawing an implicature, by relying on a false presupposition) matters for the speaker's culpability. In economics, the posterior is determined by the receiver's updating rule (which is fixed and often assumed to be Bayesian). The process is abstracted away. Thus, the ethical nuances about the hearer's entitlement to infer in a certain way (e.g., whether the implicature was reasonable) are lost.

  - **The wrong done**: The ethical wrong often involves the violation of a norm (e.g., the norm of assertion) or the exploitation of trust. In economics, the wrong is typically measured by the loss in the receiver's welfare. This misses deontological aspects. For example, in economics, if deception leads to a Pareto improvement, it might be seen as good, whereas in ethics, it might still be wrong.

  #### What has no expression?

  - **The speaker's intention as a mental state**: Economics does not model mental states beyond preferences and beliefs. The intention to deceive, as a conscious mental event, has no counterpart.

  - **The normative force of the distinction between lying and misleading**: If two strategies (lying and misleading) lead to the same posterior and same welfare, they are identical in the economic model. The ethical claim that one is worse than the other cannot be expressed because the model does not have a parameter for the mode of deception.

  - **The hearer's entitlement to infer**: The ethics considers what the hearer is entitled to infer from an utterance (e.g., based on conversational norms). In economics, the inference rule is exogenously given and common knowledge. The model does not allow for a normative assessment of whether the inference rule is reasonable or whether the speaker violated a norm by exploiting it.

  - **The recruitment of the hearer's reasoning**: The ethical idea that the speaker recruits the hearer's own reasoning as the proximate cause of the error (as in misleading) is not captured. In the economic model, the receiver's updating is mechanical and the sender merely provides inputs. The causal structure of the error (who did what) is not represented.

  #### What follows for the two disciplines?

  - For **economics**: The residue report shows that the formalism of information economics is limited in capturing the richness of ethical distinctions. It abstracts away from the process of communication and the normative context. This is not a flaw for its purpose (predicting behavior and outcomes), but it does mean that economic models cannot by themselves settle ethical questions about deception. They can, however, clarify the consequences of different communication strategies.

  - For **ethics**: The economic translation reveals that some ethical distinctions (like lying vs. misleading) do not affect the outcome if we only care about the posterior and the resulting action. If the ethical distinction is to be maintained, it must be because of intrinsic moral reasons (e.g., lying violates a categorical norm) or because of the effect on the communicative practice in the long run (which might be modeled as a repeated game). The translation also shows that the ethical focus on the speaker's intention and the hearer's reasoning process might be hard to formalize in a consequentialist framework.

  - **Your suspicion tested**: Your suspicion is largely confirmed. The lying/misleading distinction is causally invisible to the economics because the formalism only cares about the posterior. However, note that in some economic models (e.g., with lying costs or reputation in repeated games), lying might be more costly than misleading, which could reintroduce the distinction. But in a one-shot game without such costs, they are equivalent if they induce the same posterior. The residue (the normative centrality of the distinction) is a gap in the formalism. The economics cannot express why the distinction matters normatively; it can only express the consequences.

  ### Conclusion

  The translation from the ethics of deception to the economics of information is possible for the outcomes (the beliefs and actions) but fails to capture the intentional and normative dimensions. The distinction between lying and misleading collapses in the economic model when they lead to the same posterior. This collapse is a feature of the formalism: it is designed to focus on outcomes. Therefore, while the economic framework is a powerful tool for understanding the incentives and consequences of deceptive communication, it cannot replace the ethical analysis that cares about the means as well as the ends.

  In teaching, you might use the economic model to show the consequences of different deceptive strategies and then challenge the students to articulate why, despite the equivalence in outcomes, the means might matter ethically. This could lead to a fruitful dialogue between the two frameworks.
answer: |-
  ### Systematic Translation: Ethics of Deception to Economics of Information

  #### Translation Dictionary (Ethical Concept → Economic Counterpart)
  1. **Act of assertion** → **Sender's message in a signaling game**  
     - *Fit*: Tight. An assertion is a signal sent by an informed party (sender) to influence the belief/action of a receiver. Both frameworks treat communication as strategic.  
     - *Residue*: Ethics emphasizes linguistic acts (e.g., "assertion"), while economics includes any observable action (e.g., costless "cheap talk" or costly signals). The ethical norm of "assertion" (implying a commitment to truth) has no direct counterpart; economics assumes messages are purely instrumental.

  2. **Content asserted** → **Signal realization**  
     - *Fit*: Moderate. The content maps to a specific signal drawn from a message space (e.g., "state θ = high" → message "m = high").  
     - *Residue*: Ethics distinguishes literal content vs. implicature/presupposition; economics treats all signals as atomic (e.g., "m = high" induces a posterior, regardless of how meaning is constructed). Pragmatic inferences (Gricean implicatures) are compressed into the receiver’s updating rule.

  3. **Hearer's uptake** → **Receiver's posterior belief**  
     - *Fit*: Very tight. Uptake is the belief formed after observing the signal, quantified as a Bayesian posterior.  
     - *Residue*: Ethics cares about *how* belief is formed (e.g., "entitlement to infer"); economics treats updating as mechanical (e.g., Bayes’ rule). The receiver’s reasoning process is exogenous and invisible.

  4. **Speaker's intention** → **Sender's utility maximization**  
     - *Fit*: Loose. Intention translates to the sender choosing a signaling strategy (mapping states to messages) to maximize expected utility.  
     - *Residue*: Ethics focuses on *mens rea* (e.g., "intent to deceive"); economics reduces this to incentives (e.g., misaligned preferences). The "wrongness" of intent isn’t modeled—only its behavioral implications.

  5. **Wrong done** → **Welfare loss relative to full information**  
     - *Fit*: Poor. The wrong is measured by inefficiency (e.g., Pareto suboptimal outcomes) or receiver’s utility loss.  
     - *Residue*: Ethics addresses deontic norms (e.g., "violating trust"); economics is consequentialist. The intrinsic wrong of deception (vs. its outcome) has no expression.

  ---

  #### Translation of Six Species of Deception as Sender-Receiver Problems
  **Setup**: Sender (S) knows state θ ∼ prior μ(θ). Receiver (R) observes message m and updates to posterior μ(θ|m), then takes action a, affecting payoffs.

  1. **False assertion to be believed (lie)**  
     - *Economics*: S sends m ≠ θ (e.g., θ is low, S claims "m = high"). R’s posterior is distorted.  
     - *Model*: Cheap-talk game. S’s strategy: lie if utility from R’s action a(m) > truth-telling.  
     - *Fit*: Good for intentional falsehoods. *Residue*: Economics ignores "assertion" as a normative act; lying is just a message that induces suboptimal belief.

  2. **True assertion with false implicature**  
     - *Economics*: S sends true m, but R infers false q via implicature (e.g., S says "Some data is clean," implying "Not all are").  
     - *Model*: R’s updating rule includes pragmatic inferences. S exploits this by choosing m that triggers false implicature.  
     - *Fit*: Moderate. *Residue*: The implicature is baked into R’s updating rule (treated as fixed). Ethics’ focus on conversational norms (e.g., "relevance") isn’t modeled—only the outcome matters.

  3. **True assertion exploiting false presupposition**  
     - *Economics*: R holds false prior belief μ(θ_k) = 1. S sends true m consistent with θ_k, reinforcing error (e.g., R believes "Tax is included," S says "Price is $10").  
     - *Model*: S’s strategy exploits R’s biased prior. Posterior μ(θ|m) remains incorrect if m doesn’t contradict θ_k.  
     - *Fit*: Moderate. *Residue*: Economics takes priors as given; ethics asks whether S *should* correct R’s error. The duty to correct has no counterpart.

  4. **Truthful but selective evidence presentation**  
     - *Economics*: S commits ex-ante to a signaling policy (e.g., reveal only favorable evidence). R updates rationally but incompletely.  
     - *Model*: Bayesian persuasion. S designs a signal structure π(m|θ) to induce posterior favoring S.  
     - *Fit*: Excellent. *Residue*: Ethics condemns "manipulation"; economics sees it as optimal information design. The wrongness of exploiting R’s inference is invisible.

  5. **Deception by omission**  
     - *Economics*: Withholds message that would correct R’s default belief (e.g., R assumes "Report complete," S stays silent).  
     - *Model*: Disclosure game. Silence is a signal interpreted by R (e.g., μ(θ|silence) = default prior).  
     - *Fit*: Good. *Residue*: Ethics’ "duty to speak" isn’t captured; omission is just another signal.

  6. **Deception by "making the world" (no utterance)**  
     - *Economics*: S alters state θ (e.g., plants evidence) before R observes it directly.  
     - *Model*: Signaling with costly actions. S invests cost to set θ = θ_false, inducing R’s false belief.  
     - *Fit*: Tight. *Residue*: Ethics distinguishes "lying" from "fabricating evidence"; economics treats both as belief manipulation.

  ---

  ### Residue Report: What the Translation Fails to Carry
  **Methodology**: Flagged economic assumptions (e.g., "only posterior matters") as they arise. Translation succeeds where deception reduces to belief manipulation; fails where ethics invokes norms, processes, or non-consequentialist duties.

  #### Clean Translations (Minimal Distortion)
  - **Posterior belief as uptake**: The core of both frameworks—R’s belief after observation—maps perfectly.  
  - **Information design as selective truth**: Species (iv) and (v) translate cleanly; Bayesian persuasion directly models strategic evidence withholding.  
  - **Making the world as signaling**: Species (vi) fits signaling games, where actions induce beliefs.  
  - *Why clean?* These elements focus on outcomes (beliefs/actions), which economics prioritizes.

  #### Translations with Distortion (Require Simplification)
  - **Intention as utility maximization**: Distorts by reducing *mens rea* to incentives. The ethical weight of "intending to deceive" becomes "preference misalignment."  
  - **Lying vs. misleading**: Species (i), (ii), and (iii) all induce suboptimal posteriors—economics sees no difference if posteriors match. The *causal pathway* (literal falsehood vs. inference) is erased.  
  - **Exploiting defaults/presuppositions**: Economics treats R’s prior/updating rule as exogenous; ethics asks whether S *exploits* R’s reason.  
  - *Source of distortion*: Economics assumes R’s inference is fixed and common knowledge. Ethics cares about *how* S recruits R’s reasoning, but this process is black-boxed.

  #### Untranslatable Elements (Gaps in Formalism)
  1. **Normative force of the lying/misleading distinction**:  
     - *Gap*: Ethics holds that lying violates a categorical norm, while misleading exploits inference. Economics cannot express this—it only measures welfare loss.  
     - *Cause*: The formalism is causal-outcome-oriented (only posteriors matter). Your suspicion is confirmed: the point of error entry (S’s lie vs. R’s inference) is invisible.  

  2. **Hearer’s entitlement to infer**:  
     - *Gap*: Ethics asks whether R *should* draw an implicature (e.g., based on Gricean norms). Economics assumes updating rules are fixed.  
     - *Cause*: Economics takes inference as mechanical; it cannot model normative epistemic entitlements.  

  3. **Duties beyond incentives**:  
     - *Gap*: Duties to "correct false beliefs" (species iii, v) or "avoid exploiting presuppositions" have no expression.  
     - *Cause*: Economics lacks deontic concepts; welfare is the sole metric.  

  4. **Recruitment of hearer’s reasoning as proximate cause**:  
     - *Gap*: Ethics condemns S for making R *complicit* in their own deception (e.g., via implicature). Economics sees only S’s strategy and R’s posterior.  
     - *Cause*: The formalism cannot attribute causal responsibility to R’s inference process—it is a passive function.  

  #### Is the Distinction "Without a Difference"? Testing Your Suspicion
  - **Your colleague’s claim**: "Only posterior matters" reflects the **revelation principle** (any outcome can be achieved with truthful direct revelation). Thus, lying/misleading are equivalent if they induce the same posterior.  
  - **Your suspicion confirmed**: The distinction *is* causally invisible. Economics cannot "see" whether error arose from S’s lie or R’s inference because:  
    - Updating rules are exogenous.  
    - Norms of communication (e.g., "assertions must be true") are absent.  
    - Welfare depends only on actions/beliefs, not causal history.  
  - **Exception**: If lying imposes psychological costs (e.g., guilt) or reputational penalties (repeated games), economics *could* model the distinction—but this requires ad hoc assumptions.  

  ---

  ### Implications for the Disciplines
  1. **Economics**:  
     - *Strengths*: Clarifies how incentives shape deception; quantifies trade-offs (e.g., via information design).  
     - *Limits*: Cannot capture ethical distinctions without importing norms. Treats R’s reasoning as a "black box."  

  2. **Ethics**:  
     - *Strengths*: Explores normative dimensions (intent, duties, causal responsibility).  
     - *Limits*: Risks vagueness without formalizing belief dynamics (e.g., "entitlement to infer" needs precision).  

  3. **Synthesis**:  
     - Use economics to expose when lying/misleading *functionally* differ (e.g., if lying is costlier).  
     - Use ethics to challenge economics’ assumptions (e.g., "Should updating rules be fixed?").  
     - **Pedagogical recommendation**: Frame the lying/misleading distinction as an *empirical test* of economics—e.g., if subjects punish liars more than misleaders, economics must incorporate norms.

  **Final Verdict**: Your colleague describes the limits of his formalism, not the subject. The residue—norms, intent, and causal responsibility—marks a genuine gap, revealing where ethics demands more than economics provides. Yet economics sharpens ethical analysis by forcing clarity on outcomes. Teach both: let economics model the machinery of deception, and ethics judge its moral weight.
