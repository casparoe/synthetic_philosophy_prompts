answer: |-
  Here's a targeted 9-question set designed to probe her core claims, anticipate her responses, and press on the key areas you specified. The sequencing builds logically from core thesis to mechanisms, diagnostics, challenges, and falsifiability.

  **Interview Questions & Strategic Follow-Ups:**

  1.  **Core Thesis:** "Your book argues that practices like slavery or duelling didn't end primarily because opponents won the moral argument or because they became economically unviable, but because the practitioners – specifically the elites upholding the practice – could no longer face their peers. Can you unpack that core mechanism? What *exactly* happens in that moment where someone can't 'look their crowd in the eye'?"
      *   *Likely Answer:* She'll emphasize the shift in social meaning within the reference group, the intolerable cost to status/reputation/self-image within the group that defines their honor.
      *   **Follow-Up (Mechanism - Shame Target):** "Is the shame primarily about the *individual's* complicity ('*I* am doing this bad thing'), or is it about the *group's* perceived standing ('*We* are the kind of people who do this, and that makes us look barbaric/backward to others we care about')? Or is it the fear of being *seen* doing it by the right/wrong people?"

  2.  **Shame First, Arguments Second (Claim 3):** "You say arguments aren't useless; they supply the vocabulary for shame people *already* feel. The shame comes first. How does that actually work? Does the nascent shame exist *before* any significant critical argument is widely circulated within the elite group, or is it the arguments that *create* the potential for shame by providing the new lens?"
      *   *Likely Answer:* She'll stress arguments circulating *outside* the group or on the periphery, seeping in, making elites vulnerable to external judgment or planting seeds of doubt exploited by internal status competition. Shame arises when the practice clashes with *aspirational* self-image influenced by these external/inchoate pressures.
      *   **Follow-Up (Campaigner Implication):** "If the lever is this pre-existing or easily triggered *status anxiety* within the elite, does that mean campaigners should focus less on moral arguments and more on deliberately making the practice socially toxic, 'déclassé' – even weaponizing snobbery? Is a norm held primarily by fear of social demotion a norm worth having?"

  3.  **Honor *as* Interest (Claim 1):** "You position honor not as opposed to 'interest,' but as the *currency* in which elite interests are denominated. So, a change in what's honorable *is* a change in their interests. What does this reveal about the limitations of purely materialist or economic 'interest' explanations for these shifts?"
      *   *Likely Answer:* She'll argue material interests are always mediated by social meaning (honor). What counts as a "cost" or "benefit" is defined by the honor code. Protecting status *is* the paramount interest.
      *   **Follow-Up (Defining 'Interest'):** "If honor fundamentally defines what counts as an 'interest' for the elite, what would an explanation that *truly* bypassed honor even look like? Can you conceive of a historical case where a practice collapsed *solely* due to material factors changing, with no concurrent or preceding shift in its honor-status within the upholding group?"

  4.  **The Rhetorical Flip Diagnostic (Claim 2):** "Your diagnostic for an impending collapse is a shift in proponent rhetoric: from defending the practice 'on the merits' (necessary, beneficial, just) to defending it as 'ours,' a matter of tradition, taste, or manliness. How do you distinguish this 'flip' from simply losing the argument? Isn't retreating to 'it's just who we are' a classic sign of losing ground morally?"
      *   *Likely Answer:* She'll say the key is the *abandonment* of merit-based defense. They stop trying to convince outsiders or even themselves of its universal goodness/necessity. It becomes purely a tribal marker, inward-looking. This precedes institutional collapse by a generation.
      *   **Follow-Up (Measurement/Leading Indicator):** "How do you guard against hindsight bias here? Isn't it possible that this rhetorical shift is *itself* a symptom of the practice already weakening for other reasons (material, argumentative), rather than a leading indicator of an honor-shift *causing* the collapse? Can you prove the direction of causality?"

  5.  **Cause or Symptom?:** "Building on that, how do you empirically disentangle an honor-shift that *causes* a practice's collapse from one that is merely a *symptom* or consequence of it already declining for other reasons? What's your clearest case where the honor shift demonstrably *preceded* and precipitated the institutional change?"
      *   *Likely Answer:* She'll point to duelling, where anti-duelling sentiment grew among elites *before* laws were widely enforced or duelling actually ceased, driven by changing notions of gentlemanly conduct. Or early abolitionist sentiment appearing within planter classes/slave-trading nations *before* economic viability collapsed.
      *   **Follow-Up (Colonial Challenge):** "But take a colonial context, say the British banning sati in India. The British officials imposing the ban likely felt it was dishonorable *to them* (their own reference group), but the traditional elite upholding the practice may not have shared that shame *internally* before the ban. Does this fit your model, or is it a different mechanism?"

  6.  **External Intervention:** "Speaking of colonial bans or parliamentary acts against the wishes of the practitioners – cases where the practice is ended *from outside* the reference group upholding it (by law, war, conquest). Does this break your model? Can an external power force an honor shift, or does the collapse only become durable if/when the internal shame catches up?"
      *   *Likely Answer:* She'll argue that durable change usually *requires* eventual internalization by some critical mass of the relevant group. External force might suppress the practice, but true collapse/rejection needs the internal shift. She might cite post-Civil War Southern honor codes persisting around race despite slavery's external abolition.
      *   **Follow-Up:** "So in the sati example, was the *durable* end of the practice dependent on a subsequent generation of the *local* elite internalizing the shame, perhaps adopting the colonial viewpoint? How long does that take, and how do you separate the effect of the ban from the internal shift?"

  7.  **The Role of Argument Revisited:** "If arguments supply vocabulary for pre-existing shame, does their effectiveness depend entirely on finding fertile ground – an elite already primed to feel shame? Can arguments ever *create* the shame de novo within a closed, confident elite group?"
      *   *Likely Answer:* She'll likely be skeptical. Arguments might bounce off a confident group. Their power comes when they resonate with existing anxieties, contradictions within the group's self-image, or are amplified by status competition/dissidents within the group.
      *   **Follow-Up:** "Does this imply moral revolutions are impossible against a truly monolithic, shameless elite? Are there historical examples where arguments *did* seem to crack such a monolith first?"

  8.  **Scope & Modern Parallels:** "Your cases (slavery, duelling) often involve practices deeply tied to elite identity and performed publicly. Does your model apply as clearly to practices that are more private, diffuse, or less central to elite status (e.g., changing norms around domestic violence, or environmental ethics)? Or to revolutions driven more by marginalized groups demanding recognition (e.g., LGBTQ+ rights), where the 'shame' might need to be induced in the powerful *by* the marginalized?"
      *   *Likely Answer:* She'll affirm the core mechanism but might nuance it – perhaps arguing shifts start within specific sub-groups or require the practice to become symbolically central enough to threaten status. Marginalized groups force elites to see them as an audience whose judgment matters.
      *   **Follow-Up:** "In the LGBTQ+ case, wasn't winning the legal/argumentative battle (e.g., marriage equality) crucial for making opposition seem *shamefully* bigoted? Doesn't that suggest argument *preceded* and enabled the widespread shame shift?"

  9.  **Falsifiability:** "What evidence or what kind of historical case study would genuinely make you reconsider or significantly modify your 'honor-shift' thesis as the primary engine of moral revolution? What's the biggest challenge to your view from within your own research?"
      *   *Likely Answer:* She might cite a case where a practice collapsed rapidly due to undeniable material catastrophe (e.g., a specific famine ending a harmful agricultural practice?), or where overwhelming external force extinguished a practice *without* any discernible prior internal honor shift, and it *stayed* extinguished without internalization. Or a case where the "rhetorical flip" clearly *followed* decisive institutional defeat.
      *   **Follow-Up:** "If you found such a case – say, a practice economically crushed overnight where proponents *still* clung to its honor internally for generations despite its impossibility – would that just be an exception, or would it require a fundamental rethink?"

  **Why this setup works & isn't a straw man:**

  *   **"Moral Revolution":** Her framing (collapse of specific practices like slavery/duelling due to elite shame) fits comfortably under this umbrella term. She's not rejecting the category.
  *   **Argument/Honor Opposition:** While scholars acknowledge both, her specific claim – that honor *is* the currency of elite interest, making the shift a *change* *in* interests, and that shame precedes argument – is a distinctive and arguable thesis. It's not a straw man; it's her specific intervention against overly rationalist/materialist *and* purely idealist explanations. Fields haven't "moved past" this; it's a live debate about causation and mechanism.
  *   **Focus:** Avoids summary/positioning, dives straight into the mechanics of her argument as you requested. Questions are designed to make the distinctions clear for listeners.

  **Key Strengths for Your Needs:**

  *   **Mechanism Pressed:** Q1 & Q2 F/Us directly tackle the nature of shame (individual/group) and the shame-first argument.
  *   **Honor as Interest:** Q3 & Q3 F/Up force clarity on her redefinition and challenge materialist explanations.
  *   **Rhetorical Flip (Diagnostic):** Q4 & Q4 F/Up directly confront the measurement/causality issue ("losing the argument?").
  *   **External Force:** Q6 & Q6 F/Up specifically address colonial/parliamentary imposition.
  *   **Campaigner Implication/Value of Norm:** Q2 F/Up asks about strategy and the moral worth of status-anxiety norms.
  *   **Falsifiability:** Q9 directly asks for what would make her give it up.
  *   **Combative Management:** Follow-ups are pre-planned to counter likely deflections/exits ("both," "chicken-and-egg," "no silver bullet," "eventually internalized") and push for specifics, mechanisms, and counterexamples.
  *   **Flow:** Sequence moves from core idea (Q1) -> mechanisms (Q2, Q1 F/Up) -> redefining concepts (Q3) -> key diagnostic (Q4) -> causality challenge (Q5) -> external challenge (Q6) -> argument's role again (Q7) -> scope (Q8) -> falsifiability (Q9).

  This set should generate a lively, substantive discussion that gets deep into her original claims and their implications. Good luck with the interview!
