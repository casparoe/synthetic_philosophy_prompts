answer: |-
  Below is a decision tree designed to help readers identify their implicit norm of assertion through concrete cases. Each node is a question based on specific scenarios, requiring no prior philosophical knowledge. The leaves include major norms (knowledge, truth, belief, reasonable belief) plus one unoccupied position and a diagnosis for why it lacks defenders. The tree is built around points of genuine divergence: factivity, permissibility vs. correctness, lottery propositions, Moorean assertions, and predictions.  

  ---

  ### **Start**: You witness an assertion that turns out to be false. Is this *always* improper (i.e., a violation of the norm of assertion)?  
  - **Yes (factive norm)** → Go to **Q1**  
  - **No (non-factive norm)** → Go to **Q4**  

  ---

  ### **Q1 (Factive)**: Consider this case:  
  *An astronaut with no evidence blurts out, "There’s life on Europa!" By sheer luck, it’s true. Was their assertion proper?*  
  - **Yes** → **Truth Norm (TN)**  
    - *Position*: Assertion is proper iff what is asserted is true.  
    - *Why?* Truth alone suffices, even without justification. Europa case is proper; lottery/barn facade are improper only if false.  
  - **No** → Go to **Q2**  

  ### **Q2**: Now consider a lottery:  
  *You hold a ticket in a fair, 10-million-ticket lottery. Drawing is tomorrow. You assert, "My ticket will lose." Is this proper?*  
  - **No** → **Knowledge Norm (KN)**  
    - *Position*: Assertion is proper iff you know what you assert.  
    - *Why?* Lottery assertions are improper (you don’t *know* you’ll lose). Barn facade/Europa are improper if unknown.  
  - **Yes** → **Factive Reasonable Belief Norm (FRBN)**  
    - *Position*: Assertion is proper iff it is true and reasonably believed.  
    - *Diagnosis*: **Unoccupied**. Coherent but unattractive: Allows lottery assertions (intuitively shaky) and harshly penalizes justified falsehoods (e.g., barn facade violates even with excellent evidence).  

  ---

  ### **Q4 (Non-factive)**: Consider barn facade county:  
  *You’re in a county full of realistic barn facades, with only one real barn. You see a real barn (unbeknownst to you) and assert, "That’s a barn!" It is one—but had you been wrong, your evidence wouldn’t have warned you. Was your assertion proper?*  
  - **Yes** → Go to **Q5**  
  - **No** → **Unoccupied Position A**  
    - *Position*: Assertion requires more than reasonableness (e.g., safety/anti-luck), but not factivity.  
    - *Diagnosis*: **Unexplored/Incoherent?** Non-factivity implies falsehoods aren’t *always* wrong, yet this rejects a paradigmatic reasonable falsehood. Few defend it—perhaps conflating permissibility with risk.  

  ### **Q5**: Revisit the Europa case:  
  *The astronaut with no evidence asserts, "There’s life on Europa!" They believe it (on a hunch), and it’s true. Was this proper?*  
  - **Yes** → **Belief Norm (BN)**  
    - *Position*: Assertion is proper iff you believe what you assert.  
    - *Why?* Europa case is proper (belief present); lottery/barn facade are proper if believed. Moorean assertions are improper (cannot believe them).  
  - **No** → Go to **Q6**  

  ### **Q6**: Back to the lottery:  
  *You assert, "My ticket will lose." Is this proper?*  
  - **Yes** → **Reasonable Belief Norm (RJBN)**  
    - *Position*: Assertion is proper iff reasonably/justifiedly believed.  
    - *Why?* Lottery assertions are proper (highly probable); barn facade is proper (reasonable). Europa case is improper (unreasonable).  
  - **No** → Go to **Q7**  

  ### **Q7**: Confident prediction case:  
  *A meteorologist examines flawless data and asserts, "It will rain tomorrow." It doesn’t. Was their assertion proper?*  
  - **Yes** → **Safe Assertion Norm (SAN)**  
    - *Position*: Assertion is proper iff your belief is safe (i.e., true in most nearby worlds).  
    - *Why?* Meteorologist’s assertion is proper (belief was safe, bad luck is distant); lottery assertions are improper (winning world is nearby).  
  - **No** → **Unoccupied Position B**  
    - *Position*: Assertion requires knowledge-like security but remains non-factive.  
    - *Diagnosis*: **Incoherent**. If meteorologists with perfect evidence can’t assert, and falsehoods aren’t always wrong, what *is* assertible? Ignores social function of assertion.  

  ---

  ### **Leaves the Tree Cannot Separate**  
  1. **KN vs. FRBN in lottery denials**:  
     - Both deem lottery assertions improper, but for different reasons (KN: lack of knowledge; FRBN: risk of falsity). The tree separates them via the Europa case (KN rejects it; FRBN accepts it if true + reasonable).  
     - *Why hard?* If a reader rejects lottery assertions *and* Europa cases, they land on KN. If they accept lottery assertions, they go to FRBN. Europa is the critical divider.  

  2. **SAN vs. KN in predictions**:  
     - Both often reject the meteorologist’s assertion if it fails (KN: false, so improper; SAN: improper only if belief was unsafe).  
     - *Why hard?* The meteorologist case is *designed* to be safe—if a reader calls it improper, they might hold KN (factive) but are in the non-factive branch. The tree flags this as an error.  

  3. **BN vs. RJBN in Europa**:  
     - BN accepts the Europa assertion (if believed); RJBN rejects it (unreasonable). Clear separation at Q5.  

  ---

  ### **Summary of Named Leaves**  
  - **Knowledge Norm (KN)**: Proper iff known. (Williamson)  
  - **Truth Norm (TN)**: Proper iff true. (Weiner)  
  - **Belief Norm (BN)**: Proper iff believed. (Bach)  
  - **Reasonable Belief Norm (RJBN)**: Proper iff reasonably believed. (Lackey)  
  - **Safe Assertion Norm (SAN)**: Proper iff belief is safe. (Sosa-inspired)  
  - **Factive Reasonable Belief (FRBN)**: Unoccupied (true + reasonable).  
  - **Unoccupied A/B**: Edge cases with no clear defenders.  

  This tree isolates norms through dilemmas where intuitions clash (e.g., lottery vs. predictions), exposes gaps in the logical space (FRBN, Unoccupied A/B), and clarifies why KN/RJBN or KN/SAN might be conflated. Use it to spark reflection, then link readers to further reading on their "result."
