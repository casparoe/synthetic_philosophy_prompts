prompt: |-
  I'm putting together the final for my upper-level seminar on minds and machines, and I want one essay question on the ant-colony thing (Hofstadter's Aunt Hillary, colony = brain / ants = neurons) that a student can't just answer by summarizing that dialogue. So here's the case I want them to work with, which I'm inventing for the exam: imagine a colony that passes every behavioural test we'd use for a mind — it seems to remember where food was, it "chooses" between routes, it even reacts differently to a familiar keeper. Take it as given that it's a functional mind. What I care about is not the behaviour question but whether there's *anything it's like* to be the colony, and whether that's even a further question on top of the functional one. A good answer should have to say what the colony-as-brain analogy is actually claiming, why the analogy by itself doesn't settle subjecthood, and then commit to a view.

  Push them onto the two horns. First: if no single ant is conscious, what is supposed to make the whole colony conscious rather than just a mind-like process — and does that same reasoning force you to call a traffic jam or the economy conscious too? Second, the flip side: if the colony really is one subject, then what are the ants — parts of her, or little subjects in their own right, or both?

  Give me the essay question (doable in about 45 minutes), a model answer of roughly 600 words, and a marking scheme that separates an A from a B by naming the specific moves a top answer has to make and the specific confusions that should cost marks.
