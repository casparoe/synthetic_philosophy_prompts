prompt: |-
  You are a philosopher of science and an experienced designer of interactive seminars, with a strong background in formal epistemology and the philosophy of probability. Your task is to design a single classroom activity for a graduate seminar on the foundations of probability. The seminar has 16 students and meets for 90 minutes. The instructor has not yet introduced the reference class problem and wants students to encounter it experientially before it is named. Your activity should make them feel the force of the problem: that a probability assigned to a single, unrepeatable event depends on a choice of reference class, that several reference classes can be defensible, and that the choice can change the answer dramatically without any further empirical discovery.

  Before you write the final design, think carefully and brainstorm at least three possible mechanics. Consider which one best forces participants to commit to a reference class, defend it against rivals, and then discover that a rival's class is equally defensible. Then select one and develop it fully.

  Setting and constraints:
  - 16 students, 90 minutes, a seminar room with movable chairs and a whiteboard.
  - No real money. Use tokens, points, or reputation.
  - No lecture up front. The instructor should speak as little as possible before the debrief.
  - The activity should be runnable by a facilitator who knows the concept but is not a game designer.
  - Do not require any reading, bibliography, or citations. The activity must stand on its own.

  The activity:
  Invent a fictional decision scenario in which participants must assign a probability to a unique event. The event should be unusual enough that no obvious frequency data settles it, but familiar enough that students can reason about it without special expertise. One possibility is a fictional Bureau of Novel Risk that must price the first confirmed contact with a non-human intelligence; you may invent a different scenario if it serves the design better. Each participant or team should occupy a role with a different stake in the decision, for example an insurer, a science ministry, a civil-liberties group, a forecasting market, or a research consortium. The roles should push them toward different reference classes without making the choice arbitrary or stupid. The rules should require them to name their reference class explicitly, state the probability it yields, and defend the class. At some point, two teams should be able to defend incompatible probabilities for the same event while both remaining internally coherent.

  Deliverable:
  Provide a complete, runnable design with the following sections:
  1. Learning goal: one paragraph on what students should feel and understand by the end.
  2. Materials and room setup: everything the facilitator needs, including any cards, dossiers, or token schemes.
  3. Roles: the exact roles, what each role wants, and what information each role receives. Include any hidden information or asymmetric briefings.
  4. Rules and mechanics: step-by-step rules, including how reference classes are chosen, how probabilities are elicited, how teams interact, and how a final decision is forced.
  5. Payoff scheme: how points or tokens are awarded, and why the incentives push participants toward the intended discovery rather than toward mere winning.
  6. Timeline: a minute-by-minute plan for the 90 minutes, including setup, play, and debrief.
  7. Debrief: a structured sequence of questions that maps specific moments in the activity onto the reference class problem, the problem of the single case, the role of the principle of indifference, and the difference between choosing a reference class for a decision and believing there is a uniquely correct one. The debrief should not merely explain the problem; it should point back to things that happened.
  8. Predictable failures: what will go wrong the first time the activity is run, how the facilitator should handle each failure, and how to adapt for a group that is too small, too large, or too quick.
  9. Limitations: be frank about which feature of the reference class problem the activity cannot reproduce and that the facilitator must supply afterward. For example, if the activity cannot settle whether there is a mind-independent correct reference class, say so plainly.

  Style and quality:
  Write for an instructor who will run this next week. Be concrete and operational: specify what the facilitator says, what participants see, and what happens when. Do not pad with generalities about active learning. Do not use citations or reading lists. You may use fictional names, offices, and events freely; they are part of the design. The activity should be self-contained and playable without any materials beyond ordinary classroom supplies. Aim for a design that a specialist in formal epistemology would recognize as getting the problem right, and that a student who has never heard of the reference class problem could still participate in fully.
reasoning: |-
  We are designing an activity for a graduate seminar on the foundations of probability, aiming to experientially introduce the reference class problem. The core idea: participants must assign a probability to a unique event, but the probability depends on the choice of reference class, and different defensible choices lead to dramatically different probabilities.

  After brainstorming, here are three possible mechanics:

  1. **The Alien Contact Scenario**: Participants are part of a fictional Bureau of Novel Risk (BNR) that must insure against the risks of first contact with a non-human intelligence. Different roles (e.g., insurer, scientist, government regulator, civil liberties group) have different stakes and thus might choose different reference classes (e.g., historical first contacts, fictional portrayals, animal intelligence studies). Teams argue for their probability assessment and the reference class they use.

  2. **The Time Traveler's Arrival**: A time traveler from the future is predicted to appear at a specific place and time. Teams must assess the probability of this event. Roles could include historians (using past claims of time travel), physicists (using theories of time), futurists (using trends in technology), and skeptics (using hoaxes and frauds). Each role has data that pushes them toward a different reference class.

  3. **The Miraculous Recovery**: A patient with a rare and terminal illness unexpectedly recovers. Teams must assess the probability of this event for medical, legal, and insurance purposes. Roles: medical researchers (using clinical trial data), insurance actuaries (using historical claims), religious groups (using miracle claims), and statisticians (using general survival rates). Each role has a different perspective on what counts as a relevant reference class.

  We choose **The Alien Contact Scenario** because:
  - It is highly engaging and allows for creative yet grounded reasoning.
  - The uniqueness of the event (first confirmed contact) forces reliance on analogies.
  - Roles can be naturally designed to push toward different reference classes without being arbitrary.

  Now, we develop the Alien Contact Scenario fully.

  ---

  **Deliverable: Complete Activity Design**

  **1. Learning Goal**:  
  By the end of this activity, students should feel the tension that arises when assigning a probability to a single, unrepeatable event. They should understand that the probability depends critically on the choice of a reference class, that multiple reference classes can be reasonably defended, and that this choice can lead to vastly different probability assignments without any new empirical evidence. They should also recognize that the choice of reference class is often influenced by practical stakes and that there may be no uniquely correct reference class.

  **2. Materials and Room Setup**:  
  - A seminar room with movable chairs arranged in four clusters (one for each team of 4 students).  
  - A whiteboard or flip chart for the facilitator to record team inputs.  
  - Four colored markers (one per team color).  
  - Four role briefings (one per role, printed on colored paper matching the team color).  
  - A timer.  
  - Tokens: Four colors of poker chips (or paper tokens) to represent "influence points" (20 per team).  
  - A decision docket (on the whiteboard) with the event description:  
    *"Event: On June 15, 2030, at 10:00 AM GMT, the SETI Institute will confirm the first intentional, non-human, extraterrestrial signal received at the Allen Telescope Array. The signal contains a mathematical sequence that is unambiguously artificial and non-terrestrial."*  

  **3. Roles**:  
  Four teams, each with a distinct role and objective. Each team receives a briefing sheet with:  
  - **Their role and objective**  
  - **Their suggested reference classes** (to nudge them, but they can choose others)  
  - **Some data points** (to help them reason)  

  *Team 1: Insurance Underwriters (Color: Blue)*  
  - **Objective**: Minimize financial risk for the insurer. You must set a premium for a policy that pays out $1 billion if contact occurs.  
  - **Suggested reference classes**: Historical false alarms in astronomy, false positives in signal detection, hoaxes.  
  - **Data**:  
    - 98% of anomalous signals in astronomy turn out to have natural or human-made explanations.  
    - In the last 50 years, there have been 120 "promising" signals; all were false alarms.  
    - Hoaxes occur in about 1 in 100 major scientific announcements.  

  *Team 2: Science Ministry (Color: Green)*  
  - **Objective**: Secure funding for a global scientific response. You must justify the allocation of resources for a contact event.  
  - **Suggested reference classes**: Breakthroughs in astrobiology, historical discoveries of new phenomena, predictions from the Drake equation.  
  - **Data**:  
    - 70% of major scientific predictions (e.g., Higgs boson, gravitational waves) are confirmed within 50 years of the prediction.  
    - Drake equation estimates for detectable civilizations in our galaxy range from 1 to 1000.  
    - In the last century, 30% of "impossible" discoveries (e.g., quantum entanglement) were confirmed.  

  *Team 3: Civil Liberties Watchdog (Color: Yellow)*  
  - **Objective**: Prevent public panic and government overreach. You must argue against extreme measures.  
  - **Suggested reference classes**: Public reactions to unexpected events (e.g., pandemics, asteroid near-misses), media-driven panics.  
  - **Data**:  
    - 80% of major unexpected events (e.g., Y2K, 2012 doomsday) led to no significant societal disruption.  
    - Only 10% of "high-alert" events (e.g., terrorist threats) result in actual harm.  
    - In surveys, 95% of people return to normal life within a week of a false alarm.  

  *Team 4: Xenocultural Research Consortium (Color: Red)*  
  - **Objective**: Advocate for proactive cultural and linguistic preparation. You must argue that contact is likely enough to warrant immediate action.  
  - **Suggested reference classes**: Fictional portrayals of first contact, animal intelligence studies, patterns in the evolution of intelligence.  
  - **Data**:  
    - In sci-fi, first contact occurs in 60% of stories set in the near future.  
    - Studies of animal communication show that 40% of species with complex social structures can learn symbolic communication.  
    - Evolutionary theory suggests that intelligence evolves in 1 in 10 million species, but given the number of stars, it should be common.  

  **4. Rules and Mechanics**:  
  *Step 0: Setup (5 min)*  
  - Facilitator divides students into 4 teams of 4. Assigns each team a color and role.  
  - Distributes role briefings and tokens (20 tokens per team).  
  - Writes the event description on the whiteboard.  

  *Step 1: Team Deliberation (20 min)*  
  - Teams discuss and must agree on:  
    a) A reference class (they can use the suggested ones or invent their own).  
    b) A probability estimate (0% to 100%) for the event based on that reference class.  
    c) A one-sentence defense of why their reference class is appropriate.  
  - Teams write these on a sheet of paper in their color.  

  *Step 2: Probability Declaration (5 min)*  
  - One representative from each team writes on the whiteboard:  
    - Team name and color.  
    - Chosen reference class.  
    - Probability estimate.  

  *Step 3: Cross-Examination (30 min)*  
  - Teams take turns challenging one other team (facilitator assigns order: Blue→Green→Yellow→Red→Blue).  
  - Each challenge has two parts:  
    a) **Critique** (3 min per team): The challenging team questions the defending team's reference class (e.g., "Why use historical false alarms when this signal is verified by multiple observatories?").  
    b) **Defense** (3 min per team): The defending team responds.  
  - After each exchange, the challenging team may offer a "counter-reference class" and their own probability.  
  - **Token Betting**: Before each exchange, any team (including non-participating ones) can bet up to 5 tokens on which team's argument will be more persuasive (as judged by the facilitator). The facilitator awards tokens to bets on the "winner" of the exchange (double the bet).  

  *Step 4: Final Revision and Commitment (10 min)*  
  - Teams may revise their probability estimate based on the critiques.  
  - Each team submits a final probability and reference class.  
  - Teams allocate their remaining tokens (including any won) to "influence" the final decision. They can spread tokens across other teams' probabilities to form a weighted average.  

  *Step 5: Final Decision (5 min)*  
  - Facilitator calculates the weighted average probability (using tokens as weights) and announces the "official" BNR probability.  

  **5. Payoff Scheme**:  
  - **Token allocation**: Each team starts with 20 tokens. Tokens are used to:  
    - Bet during cross-examination (to win more tokens).  
    - Influence the final probability (the more tokens you allocate to a probability, the more weight it has).  
  - **Winning condition**: The team that ends with the most tokens wins. However, tokens are also used to influence the final decision, so teams must balance winning tokens with achieving their objective.  
  - **Incentive alignment**:  
    - Betting rewards persuasive argumentation (pushing teams to defend their reference class well).  
    - Influencing the final decision requires spending tokens, so teams must decide how much to "invest" in their preferred outcome.  
    - The win condition (most tokens) is independent of the final probability, so teams are not punished if the group's decision goes against their role's interest. This prevents role-play from overriding the epistemic goal.  

  **6. Timeline**:  
  - 0-5 min: Setup. Assign roles, distribute materials, explain the event.  
  - 5-25 min: Team Deliberation (20 min). Teams work in huddles.  
  - 25-30 min: Probability Declaration (5 min). Teams write on the board.  
  - 30-60 min: Cross-Examination (30 min). Structured critiques.  
  - 60-70 min: Final Revision and Commitment (10 min). Teams submit final probability and allocate tokens.  
  - 70-75 min: Final Decision (5 min). Calculate weighted average.  
  - 75-90 min: Debrief (15 min). Structured discussion.  

  **7. Debrief**:  
  The facilitator leads a discussion using these questions, pointing to specific moments:  
  - "Team Blue, you argued that historical false alarms are the right reference class. But Team Red used sci-fi. How did you feel when they defended that?" (Highlighting defensible alternatives)  
  - "When Team Green revised their probability after the critique, what changed? The event? Or the way you thought about it?" (Emphasizing that no new evidence arrived)  
  - "The final probability was a weighted average. Does that feel like a resolution? Or did it just hide the disagreements?" (Problem of aggregating across classes)  
  - "Team Yellow, you worried about panic. How did that affect your choice of reference class?" (Stakes influencing class choice)  
  - "Is there a fact of the matter about which reference class is correct? Or is it always relative to a question?" (No unique correct class)  
  - "If we did this again with the same event, would you pick the same reference class? Why?" (The problem of the single case)  

  **8. Predictable Failures**:  
  - *Failure*: Teams pick reference classes too arbitrarily (e.g., "all events on Tuesdays").  
    *Mitigation*: The facilitator can intervene during deliberation: "Remember, your role has a specific objective. How does your reference class help achieve that?"  
  - *Failure*: Critiques become personal or too adversarial.  
    *Mitigation*: Set norms: "Challenge the reference class, not the team." Use the token betting to focus on persuasiveness.  
  - *Failure*: Teams don't engage with the depth of the problem.  
    *Mitigation*: In the debrief, ask: "Did anyone feel their probability was forced to change without new data? Why?"  
  - *Adaptations*:  
    - *Too small* (e.g., 8 students): Reduce to 2 teams (e.g., Insurer vs. Science Ministry), double the time per step.  
    - *Too large* (e.g., 20 students): Add a fifth role (e.g., Media Regulator) or have sub-teams.  
    - *Too quick*: Add a round of "reference class switching" where teams must argue for a rival's class.  
    - *Too slow*: Skip token betting and move straight to final commitment.  

  **9. Limitations**:  
  - The activity cannot fully address whether there is a mind-independent correct reference class. It shows that choices are defensible but does not resolve the metaphysical question. The facilitator must note this in the debrief: "We saw that different classes lead to different probabilities, but we didn't settle whether one is objectively correct."  
  - The payoff scheme (token betting) may incentivize rhetorical skill over epistemic rigor. The debrief should separate persuasion from truth: "Did the best argument win, or the most persuasive?"  
  - The activity assumes that reference classes are discrete and chosen consciously. In real life, they may be vague or implicit. The facilitator should note this: "In practice, we often don't state our reference class explicitly, which makes the problem harder to spot."  

  ---
  This design meets all constraints: self-contained, no prior reading, uses ordinary supplies, and creates an experiential encounter with the reference class problem. It forces teams to commit, defend, and confront equally defensible alternatives, setting the stage for a formal treatment later.
answer: |-
  ### **Foundations of Probability Seminar Activity: The Contact Probability Conundrum**  

  **1. Learning Goal**  
  By the end of this activity, students will viscerally experience the reference class problem. They will understand that assigning a probability to a singular event (e.g., first contact with non-human intelligence) requires selecting a reference class, that multiple classes can be rationally defended, and that this choice dramatically alters the probability without new evidence. They will confront the tension between practical decision-making stakes and the absence of a unique "correct" reference class, setting the stage for formal analysis.  

  ---

  ### **2. Materials and Room Setup**  
  - **Room**: Movable chairs arranged into four clusters (one per team). Whiteboard divided into sections: "Event," "Team Probabilities," and "Token Allocation."  
  - **Materials**:  
    - Four colored folders (red, blue, green, yellow) containing role briefings.  
    - Tokens: 80 poker chips (20 per team, 5 each of four colors).  
    - Timer.  
    - Whiteboard markers.  
    - Event summary sheet (posted on whiteboard):  
      > **Event**: *On 2035-06-12, the ASTERIA space telescope will detect an artificial megastructure orbiting Proxima Centauri b. This is humanity’s first confirmed evidence of non-human intelligence. No prior analogous event exists.*  
      > **Decision**: *The Global Risk Council must assign a probability (0–100%) of this event occurring to allocate emergency funds.*  

  ---

  ### **3. Roles**  
  Four teams (4 students each). Each receives a folder with:  
  - **Team Goal**: What they must prioritize.  
  - **Reference Class Suggestions**: 3–4 options (with data) to nudge reasoning.  
  - **Hidden Stakes**: Asymmetric incentives to push reference class choice.  

  | **Role**               | **Goal**                          | **Reference Class Suggestions**                                   | **Hidden Stakes**                                  |  
  |------------------------|-----------------------------------|-------------------------------------------------------------------|---------------------------------------------------|  
  | **Planetary Security (Red)** | *Prevent societal panic.*         | - False alarms in astronomy (e.g., ‘Oumuamua, Wow! signal: 98% false).<br>- Hoaxes in science (e.g., Piltdown Man: 95% debunked).<br>- Military false positives (e.g., Cold War incidents: 99% errors). | Wins extra tokens if probability is **≤20%** (low panic risk). |  
  | **Xenology Institute (Blue)** | *Secure research funding.*        | - Confirmed breakthroughs (e.g., Higgs boson, gravitational waves: 30% predicted).<br>- Drake Equation estimates (e.g., 1–5,000 civilizations in Milky Way).<br>- SETI anomaly resolutions (e.g., 2% confirmed as extraterrestrial). | Wins extra tokens if probability is **≥40%** (justifies funding). |  
  | **Civil Liberties Union (Green)** | *Avoid government overreach.*     | - Media-driven panics (e.g., Y2K, 2012 apocalypse: 90% no impact).<br>- Historical "first contact" myths (e.g., 0% verified).<br>- Public reactions to crises (e.g., pandemics: 80% manageable). | Wins extra tokens if probability is **10–30%** (balanced response). |  
  | **Interstellar Commerce (Yellow)** | *Maximize trade preparedness.*    | - Technological singularities (e.g., AI predictions: 50% by 2040).<br>- Evolutionary convergence (e.g., intelligence on Earth-like planets: 25%).<br>- Sci-fi tropes (e.g., 60% of stories feature contact). | Wins extra tokens if probability is **25–50%** (moderate investment). |  

  ---

  ### **4. Rules and Mechanics**  
  **Step 1: Team Deliberation (20 min)**  
  - Teams review their briefings. **Task**: Agree on:  
    - (a) A reference class (from suggestions or self-generated).  
    - (b) A probability estimate (0–100%) for the event.  
    - (c) A 30-second defense: *"We use [reference class] because [justification]."*  
  - *Facilitator prompt*: "Choose a class that makes your probability defensible to others."  

  **Step 2: Probability Declaration (5 min)**  
  - Each team writes on the whiteboard:  
    > **Team [Color]**: [Probability]% via [Reference Class].  

  **Step 3: Reference Class Tribunal (30 min)**  
  - **Rounds**: Each team faces one challenger (pre-assigned: Red→Blue→Green→Yellow→Red).  
    - *Critique (3 min)*: Challenger questions the defender’s reference class (e.g., "Why use sci-fi tropes when real science exists?").  
    - *Rebuttal (2 min)*: Defender defends their class.  
  - **Token Swap**: After each round, both teams secretly bet 0–5 tokens on whether the facilitator will rule their class "more defensible." Facilitator declares a "tie" unless one class is incoherent (e.g., "events on Tuesdays"). *No team "wins"*—emphasizes equal defensibility.  

  **Step 4: Final Probability & Token Allocation (15 min)**  
  - Teams may revise probabilities.  
  - **Forced Decision**: Each team allocates tokens to *other* teams’ probabilities to compute a weighted average for the Council.  
    - Example: Blue puts 10 tokens on Green’s probability (30%), 5 on Yellow’s (40%).  
  - Facilitator calculates final probability: `(Σ (tokens × probability)) / total tokens`.  

  ---

  ### **5. Payoff Scheme**  
  - **Tokens** = "Influence Points." Teams win by accumulating tokens (starting: 20/team).  
  - **Earning tokens**:  
    - Betting correctly in Tribunal (double tokens if facilitator agrees their class is defensible).  
    - Achieving hidden stakes (e.g., Blue gets +5 tokens if final probability ≥40%).  
  - **Losing tokens**: Betting incorrectly or poor Tribunal performance.  
  - **Why it works**:  
    - Betting on "defensibility" (not "winning") forces engagement with rival classes.  
    - Hidden stakes create role-driven biases but tokens reward cogent argumentation.  
    - Winning requires balancing advocacy with coalition-building (token allocation).  

  ---

  ### **6. Timeline**  
  - **0–5 min**: Setup. Distribute folders, tokens. Post event summary.  
  - **5–25 min**: Team Deliberation.  
  - **25–30 min**: Probability Declaration (whiteboard).  
  - **30–60 min**: Tribunal (4 rounds, 7 min each).  
  - **60–70 min**: Token Allocation & Final Probability Calculation.  
  - **70–75 min**: Announce final probability and token winners.  
  - **75–90 min**: Debrief.  

  ---

  ### **7. Debrief**  
  **Questions** (link to activity moments):  
  1. **Reference Class Dependence**: *"Blue Team, you chose ‘SETI anomalies.’ When Red Team attacked it as ‘too narrow,’ did you consider switching classes? What stopped you?"* → Highlights class choice as pivotal.  
  2. **Single Case Problem**: *"The event is unique, yet you assigned a number. Where did that number ‘live’—in the world or in your reference class?"* → Points to constructed nature of single-case probabilities.  
  3. **Defensibility ≠ Truth**: *"In Tribunal, both sides often got tokens. What does that say about a ‘true’ class?"* → Undermines uniqueness; ties to indifference.  
  4. **Stakes vs. Truth**: *"Yellow Team, you needed 25–50% for tokens. Did that warp your class choice, or just your advocacy?"* → Explores value-laden class selection.  
  5. **Decision vs. Reality**: *"The final probability was a weighted average. Is that the ‘real’ probability? Or just a compromise?"* → Distinguishes decision-making from metaphysical correctness.  

  ---

  ### **8. Predictable Failures**  
  - **Failure**: Teams fixate on "winning" and ignore rival classes.  
    - *Fix*: Facilitator intervenes: "Red Team, if you can’t critique Blue’s class without conceding it’s defensible, award them tokens."  
  - **Failure**: Token allocation becomes collusive (e.g., teams swap tokens).  
    - *Fix*: Require teams to allocate tokens to *at least two* rivals.  
  - **Adaptations**:  
    - **Too small (8 students)**: Merge roles (e.g., Security/Xenology vs. Liberty/Commerce). Halve tokens.  
    - **Too large (20 students)**: Add a "Public Opinion" team (uses social media trends). Split tokens 25/team.  
    - **Too quick**: Add a "Reference Class Auction": Teams bid tokens to force rivals to adopt their class.  

  ---

  ### **9. Limitations**  
  - **The "True Probability" Question**: The activity cannot resolve whether a mind-independent correct reference class exists. Students may leave thinking the problem is "only" about perspective. *Facilitator must clarify*: "Today showed reference classes are chosen, not discovered. But does that mean there’s no fact of the matter? We’ll debate that next class."  
  - **Oversimplification**: Real-world reference classes have fuzzy boundaries; here they are discrete. *Note*: "In practice, classes overlap or lack clear data—today’s clean choices mask that complexity."  
  - **Probability as Weighted Average**: The final calculation implies aggregating classes resolves the problem—but it’s a political compromise, not an epistemic solution. *Stress*: "This was a decision rule, not a truth-tracking method."  

  ---  
  **Final Note**: This activity forces students to *live* the reference class problem. By making choices, defending them, and seeing equally rational peers land elsewhere, they grasp why single-case probabilities are fraught—before ever hearing the term. Run it cold; the friction is the point.
