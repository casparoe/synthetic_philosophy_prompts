prompt: |-
  I am grading the mid-term scripts for a second-year course on causal inference in the social sciences and would like a detailed second opinion on one answer. The question is worth 20 marks, 12 for part (a) and 8 for part (b). Please give the script a mark out of 20, split between the two parts, and then a point-by-point commentary: for each part, say what the answer gets right; identify the sentence or sentences carrying any error and explain why the step fails; say what a full-mark answer would have said instead; note anything important that is missing; and state how many marks you would withhold for each defect and why. Please flag any point on which your judgement is arguable, since I have to justify the mark to the student.

  Question

  In 2019 a university department compared two revision programmes for its introductory statistics module. Programme A ran weekly small-group tutorials. Programme B was a set of online problem sets with automated feedback. Students were allocated to programmes by the departmental office, not at random. The table gives pass rates for the two programmes, broken down by whether the student was sitting the module for the first time or retaking it after a previous failure.

  - First-time sitters: A 150/200 (75%); B 70/100 (70%)
  - Retakers: A 35/100 (35%); B 3/10 (30%)
  - All students: A 185/300 (61.7%); B 73/110 (66.4%)

  (a) Explain how the pattern in the table arises. What must be assumed about the breakdown variable if the within-stratum comparison is to be read causally? What, if anything, does the unstratified comparison tell us?

  (b) The comparison was repeated the following year. On this occasion the only breakdown available was whether the student had completed the optional online workbook. Programme A had actively encouraged the workbook; Programme B had not. Among students who completed the workbook, the two programmes had almost identical pass rates, and the same was true among those who did not. Advise the department on what may and may not be concluded.

  Student's answer

  (a) Both stratified comparisons favour Programme A: 75% against 70% among first-time sitters, and 35% against 30% among retakers, so A is five points ahead in each stratum. The overall figures run the other way, 61.7% for A against 66.4% for B. This is Simpson's paradox: the direction of the association between programme and outcome depends on whether we look at the marginal or the conditional table. The reversal is entirely a matter of composition. Retakers are much less likely to pass, and Programme A took almost all of them (100 of its 300 students, against 10 of B's 110), while B's intake was almost entirely first-time sitters. The decomposition makes this explicit: the composition term is about −9.7 percentage points and the programme term about +5 points, which together give the −4.7 points actually observed.

  Since the difference in the marginal table is an artefact of how students were allocated, it is spurious, and the conditional comparison is the one that carries causal information. Simpson's paradox is at bottom just confounding: the breakdown variable is a common cause of the allocation and of the outcome, so conditioning on it closes the back-door path. In general the rule is to adjust for any variable that is associated with both the treatment and the outcome; once all such variables have been adjusted for, whatever association remains is the causal effect. Prior attainment is the obvious such variable here, and since it is recorded for everyone, the within-stratum comparison gives us the causal effect of A over B, which is about five percentage points.

  The unstratified comparison has no causal interpretation at all. It records only what happened to the two groups as they were constituted, and since the groups were not comparable to begin with, the figure cannot be used for anything.

  (b) The following year's comparison is the same situation, so the same rule applies: we should adjust for workbook completion, since that is the variable that differs between the two groups. Once we condition on it, the difference between the programmes disappears in both strata, so the apparent advantage of A was again a matter of composition rather than of anything the programme itself did. Programme A's students were more likely to complete the workbook, and completion is associated with passing, so A looked better without being better. The department should conclude that the two programmes are equivalent, and that it can economise by using B so long as workbook completion rates can be kept up.
reasoning: |-
  Okay, let me approach this step-by-step. The user is grading a causal inference mid-term and wants a detailed second opinion on a student's answer. The question has two parts about interpreting program comparisons with potential Simpson's paradox issues.

  First, I need to understand the student's response thoroughly. For part (a), the student correctly identifies Simpson's paradox and explains the composition effect well. They mention the 5% advantage for Program A within strata and the overall disadvantage due to retakers proportion. The decomposition calculation seems accurate. 

  But I notice several issues. The student claims the 5% difference is the causal effect, which requires strong assumptions about prior attainment being the only confounder. They also dismiss the unstratified comparison entirely, missing its descriptive value. The language about "closing back-door paths" is correct but oversimplified - they don't mention the critical assumption of no other confounders.

  For part (b), the student correctly recognizes the need to condition on workbook completion but makes a crucial error. They assume workbook completion is just a confounder, ignoring that it's likely affected by the program (encouragement difference). This means it could be a collider or mediator, not just a confounder. Their conclusion about program equivalence is therefore flawed.

  The marking scheme is 12 for (a) and 8 for (b). I'd deduct 3 in (a) for the causal overclaim and missing nuance, and 4 in (b) for the mediator confusion. The student gets credit for technical understanding but loses marks for causal inference subtleties.

  What's tricky is whether to give partial credit for correct bits within flawed arguments. For instance, in (b) they correctly see conditioning is needed but botch the interpretation. I'll flag this as arguable since other graders might be more lenient on the partial understanding.
answer: |-
  Here is my detailed assessment of the student's answer, following your requested format. The script earns **13/20** (Part (a): 9/12, Part (b): 4/8).

  ---

  ### **Part (a) Mark: 9/12**  
  **What the answer gets right:**  
  1. Correctly identifies Simpson's paradox and explains the reversal via compositional differences (retakers vs. first-timers).  
  2. Accurately notes that retakers have lower pass rates and Program A had disproportionately more retakers.  
  3. Correctly states that the unadjusted comparison is confounded.  
  4. Appropriately mentions that conditioning on the breakdown variable (prior attempt status) addresses confounding if it is a common cause.  

  **Errors and omissions:**  
  1. **Causal overclaim (Major error):**  
     - *Erroneous sentence:* "...the within-stratum comparison gives us the causal effect of A over B, which is about five percentage points."  
     - **Why it fails:** This assumes prior attempt status is the **only confounder**. Non-random allocation likely introduced other confounders (e.g., prior math ability, motivation). The 5% difference is associational *within strata* but not necessarily causal.  
     - **Full-mark correction:** "The within-stratum comparison *adjusts for prior attempt status*, but without randomization, other unmeasured confounders (e.g., baseline ability) could bias the estimate. The 5% difference suggests a *likely benefit* for A but isn't definitively causal."  
     - **Marks withheld:** **-2** for unqualified causal claim.  

  2. **Misunderstanding of the unstratified comparison:**  
     - *Erroneous sentence:* "The unstratified comparison has no causal interpretation at all... cannot be used for anything."  
     - **Why it fails:** While not causal, the marginal comparison *does* have value: it describes the **actual observed outcome** under each program given the allocation process (useful for operational decisions).  
     - **Full-mark addition:** "The unstratified comparison reflects the *realized* pass rates under each program given the non-random allocation. It is descriptively valid for this cohort but confounded causally."  
     - **Marks withheld:** **-1** for dismissing descriptive utility.  

  **Additional omission:**  
  - Fails to explicitly state the **key assumption** for causal interpretation: prior attempt status must satisfy the **"backdoor criterion"** (i.e., it blocks all confounding paths *and* is not a collider).  
  - **Full-mark requirement:** "We must assume prior attempt status is the *only* common cause of program allocation and pass rates (no other confounders exist)."  
  - **Marks withheld:** **-0** (implied in "common cause" statement, but explicit phrasing would strengthen).  

  ---

  ### **Part (b) Mark: 4/8**  
  **What the answer gets right:**  
  1. Correctly advises conditioning on workbook completion.  
  2. Recognizes that Program A encouraged workbook use more, creating imbalance.  
  3. Notes that the apparent program effect vanishes after stratification.  

  **Critical error:**  
  - **Misinterpreting workbook completion as a confounder:**  
    - *Erroneous sentences:* "we should adjust for workbook completion, since that is the variable that differs between the two groups... A looked better without being better... the two programmes are equivalent."  
    - **Why it fails:** Workbook completion is **not solely a confounder**; it is likely a **mediator** (Program A *causes* higher completion, which *causes* higher pass rates). Conditioning on it *blocks* part of Program A's true effect.  
    - **Full-mark correction:** "Workbook completion is likely a *mediator* (affected by the program), not just a confounder. Conditioning on it suppresses Program A's true effect via workbook encouragement. The null result *within strata* doesn't prove equivalence; it may mask Program A's indirect benefit via increasing workbook use."  
    - **Marks withheld:** **-3** for misclassifying the variable and invalid causal conclusion.  

  **Omissions:**  
  1. **Alternative explanations:**  
     - Fails to note that workbook completion could also be a collider (if affected by unobserved motivation) or involve selection bias.  
  2. **Actionable advice:**  
     - Does not suggest alternative analyses (e.g., per-protocol effects, natural indirect effects) or warn against conditioning on post-treatment variables.  
     - **Full-mark additions:** "The department cannot conclude equivalence. Program A may improve outcomes by boosting workbook engagement. They should either: (1) analyze only the encouragement effect (A vs. B ignoring workbook), or (2) use mediation methods (if assumptions hold), or (3) re-run the trial with better design."  
     - **Marks withheld:** **-1** for missing key caveats.  

  ---

  ### **Summary of Marks**  
  - **Part (a): 9/12** (Loses 3 marks: 2 for causal overclaim, 1 for marginal table dismissal).  
  - **Part (b): 4/8** (Loses 4 marks: 3 for mediator error, 1 for incomplete advice).  
  - **Total: 13/20**  

  ### **Arguable Judgements**  
  1. **Part (a), causal claim:** Some graders might deduct only -1 for the overclaim if they believe "common cause" implies sufficient adjustment. However, the explicit assertion of causality ("*gives us the causal effect*") demands a stricter deduction given the non-random design.  
  2. **Part (b), mediator vs. confounder:** If the student argued workbook completion was *only* a confounder (ignoring encouragement), this might warrant partial credit. But they explicitly note Program A "actively encouraged" it, making the mediator issue inescapable.  

  ### **Recommendation to Student**  
  The answer demonstrates strong technical understanding of Simpson's paradox and confounding. However, causal claims in observational designs require greater caution (especially regarding unmeasured confounders). Crucially, **post-treatment variables (like mediators) must not be conditioned on** when estimating total treatment effects—a frequent point of confusion. Focus on explicit assumptions and alternative interpretations.
