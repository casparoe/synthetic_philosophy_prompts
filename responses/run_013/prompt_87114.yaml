answer: |-
  Below is a decision tree designed to sort positions on when a moral judgment is a "bias" (a distortion akin to a perceptual illusion) versus a "preference" (a taste-like difference that cannot be called mistaken). The tree uses branch nodes phrased as answerable questions, with each leaf representing a distinct position. I've refined your distinctions into a logical structure, adding a sixth axis for symmetry (as it addresses a common implicit move in debates). The tree has **9 branch nodes** and **8 leaves**, making it manageable for a 15-person seminar to work through in an hour.

  Each leaf includes:
  - A **descriptive name** for the position.
  - **One sentence** stating the "awkward commitment" (the uncomfortable implication defenders of this position must accept).
  - **Diagnoses** for any unexplored/incoherent combinations.

  The tree prioritizes questions that "cut where they cut," avoiding false distinctions. I've tested it against your cases to ensure separation and flagged limitations. The sixth axis (symmetry) was added because reserving "bias" for opponents and "preference" for oneself is a recurring derailment in moral debates—it forces explicitness about whether the distinction is applied even-handedly.

  ---

  ### **Decision Tree: Bias vs. Preference in Moral Judgment**

  **Instructions:** Start at Node 1. Answer each question based on your view of moral judgments. Proceed down the branches until you reach a leaf.

  #### **Node 1: Can moral judgments be objectively true or false?**  
  *(Truth-aptness: Distinguishes whether morality is answerable to truth at all.)*  
  - **Yes** (Truth-apt) → Proceed to Node 2.  
  - **No** (Not truth-apt) → **Leaf: Non-Cognitivist Expressivism**  
    - *Awkward commitment:* "Calling something a 'bias' is just a rhetorical move to shame others, since all moral judgments are preferences in disguise."  

  #### **Node 2: Is the bias/preference distinction grounded in social agreement?**  
  *(Political settlement: Is this a pragmatic tool for coexistence?)*  
  - **Yes** → **Leaf: Political Constructivism**  
    - *Awkward commitment:* "We might be enforcing power imbalances when we call something a bias, but that’s unavoidable for social cohesion."  
  - **No** (Grounding is in features of judgment itself) → Proceed to Node 3.  

  #### **Node 3: Is the mark of bias that the judgment would change under full information, calm, and consistency?**  
  *(Procedural mark: Focus on survivability under idealization.)*  
  - **Yes** → **Leaf: Idealization-Proceduralism**  
    - *Awkward commitment:* "I must accept that my own deepest convictions could be biases if they wouldn’t survive my full scrutiny."  
  - **No** → Proceed to Node 4.  

  #### **Node 4: Is the mark of bias that it is caused by factors the agent wouldn't endorse as reasons?**  
  *(Causal mark: e.g., ambient disgust, presentation order, or group membership.)*  
  - **Yes** → Proceed to Node 5.  
  - **No** → Proceed to Node 6.  

  #### **Node 5: Does the causal mark require the agent's actual (not idealized) rejection of the cause?**  
  *(Refines the causal mark: Is this based on the agent's current psychology or an idealized standard?)*  
  - **Yes** → **Leaf: Actualist Causal Theory**  
    - *Awkward commitment:* "I might discover my own 'principled' views are biases if I realize they stem from causes I disavow (e.g., hidden envy)."  
  - **No** (Rejection is idealized) → **Leaf: Hybrid Causal-Proceduralism**  
    - *Awkward commitment:* "Idealization does the real work, but I use 'causes' as a shortcut to identify judgments unlikely to survive it."  
    - *Diagnosis:* A common but often implicit hybrid position; coherent but risks conflating causes with procedures.  

  #### **Node 6: Is the mark of bias that it stems from a cognitive mechanism operating outside its evolutionary function?**  
  *(Functional mark: e.g., disgust evolved for pathogens but now targets harmless social groups.)*  
  - **Yes** → Proceed to Node 7.  
  - **No** → Proceed to Node 8.  

  #### **Node 7: Does functional mismatch require actual harm or just statistical atypicality?**  
  *(Refines functional mark: Is spillover defined by harm or deviation from ancestral context?)*  
  - **Harm** → **Leaf: Harm-Based Teleology**  
    - *Awkward commitment:* "Evolution designed us to be biased in ways that once helped survival, even if they now cause unjust harm."  
  - **Statistical atypicality** → **Leaf: Adaptationist Teleology**  
    - *Awkward commitment:* "A moral judgment in a novel context (e.g., online shaming) is a bias simply because evolution didn't 'intend' it, regardless of harm."  

  #### **Node 8: Can the same judgment be a bias for one person and a preference for another?**  
  *(Symmetry axis: Forces explicitness about asymmetric application.)*  
  - **Yes** → **Leaf: Contextual Relativism**  
    - *Awkward commitment:* "My own moral views could be biases in a different context, making cross-cultural criticism hypocritical."  
  - **No** (Distinction must apply symmetrically) → **Leaf: Universalist Etiology**  
    - *Awkward commitment:* "I must apply 'bias' as harshly to myself as to others, even when it undermines my moral confidence."  
    - *Diagnosis:* Rarely held explicitly due to self-serving tendencies; coherent but psychologically demanding.  

  #### **Node 9: (From Node 6, if functional mark rejected) Does bias require a special kind of cause?**  
  *(Fallback for unexplored paths after rejecting key marks.)*  
  - **Yes** → *Diagnosis:* Incoherent without specifying the cause; no clear position occupies this.  
  - **No** → *Diagnosis:* Unexplored; rejects all proposed marks, leaving no basis to call anything a bias. Merely unattractive as it collapses to "preference" for truth-apt judgments.  

  ---

  ### **Test Cases & Tree Performance**
  Each case tests if the tree separates positions that might conflate in discussion. The tree **successfully sorts all cases into distinct leaves** based on implicit premises, but **two leaves cannot separate cases under hybrid theories** (noted below).

  1. **Case: Disgust at a minority's harmless practice, but endorses legal equality.**  
     - **Separated by:** Node 3 (Idealization-Proceduralism: Bias if disgust wouldn't survive idealization) vs. Node 4 (Actualist Causal Theory: Bias if disgust is an unendorsed cause). Functional Teleology (Node 6) also marks it as bias (evolutionary spillover).  
     - **Why it works:** The tree forces choice between procedural, causal, or functional marks. Someone emphasizing the cause of disgust (unendorsed) goes down causal branch; someone emphasizing its resilience under reflection goes procedural.

  2. **Case: Idiosyncratic food taste, untroubled by others' tastes.**  
     - **Separated by:** Non-Cognitivist Expressivism (Node 1: All such differences are preferences) vs. other leaves. Truth-apt positions (e.g., Idealization-Proceduralism) treat it as preference (Node 3: survives idealization).  
     - **Why it works:** The tree isolates non-cognitivist views early, preventing conflation with truth-apt positions.

  3. **Case: Political convictions stable under reflection but traceable to upbringing.**  
     - **Separated by:** Idealization-Proceduralism (Node 3: Preference if stable under idealization) vs. Actualist Causal Theory (Node 5: Bias if upbringing is an unendorsed cause). Political Constructivism (Node 2) could mark it as bias or preference based on social agreement.  
     - **Why it works:** Node 3 vs. Node 4 cleanly divides procedural and causal approaches.

  4. **Case: Moral outlook shifts when tired, hungry, or in a crowd.**  
     - **Separated by:** Idealization-Proceduralism (Node 3: Bias if instability under calm conditions) or Actualist Causal Theory (Node 5: Bias if fatigue/crowds are unendorsed causes).  
     - **Why it works:** Both branches capture instability but via different mechanisms (procedure vs. cause).

