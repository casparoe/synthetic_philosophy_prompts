  ### **Limitations & Unresolved Pairs**
  - **Unseparated Pair:** Hybrid Causal-Proceduralism and Idealization-Proceduralism might both classify the **disgust case** (Case 1) as bias, but for different reasons. The tree cannot isolate them here because Hybrid theories implicitly borrow from procedural ideals.  
    - **Why:** Hybrid theories (Node 5) use causes as proxies for idealization failure, blurring the line. Explicit discussion is needed to untangle them.  
  - **Unexplored/Incoherent Paths:**  
    - Rejecting all marks after Node 8 (Node 9) is **unexplored**—no major position rejects truth-aptness, social grounding, procedure, cause, function, and symmetry. It is **merely unattractive** (collapses to preference) but not incoherent.  
    - Harm-Based vs. Adaptationist Teleology (Node 7) can overlap in practice but are separated by the tree’s harm vs. atypicality question.

