prompt: |-
  Im applying to a summer philosophy program and need a one-page research proposal. My half-formed idea: in the internal vs. external reasons debate (Williams and everyone after him), I think both sides are actually talking about two different jobs the word "reason" does -- giving someone advice about what to do, and holding them to account for what they did. When your advising someone, the reason has to hook onto something they already care about or its useless as advice. When your blaming someone -- like a guy who's decided he doesn't care about being cruel to anyone -- we want the reason to apply whether he cares or not. So maybe the whole fight is two concepts sharing one word, not one concept with two rival theories. Turn this into the proposal: the exact question stated so it has a determinate answer, why the standard positions don't settle it, what I'd actually do over a summer (steps, not a reading list, I'll find my own sources), what would count as a real result vs. me just drawing a distinction and calling it a day, and an honest take on whether this is too big for one summer.
