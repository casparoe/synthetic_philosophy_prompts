answer: |-
  ### Maxwell's Demon Classroom Game: Thermodynamics of Information

  This game simulates Maxwell's demon paradox to show why the demon cannot violate the second law of thermodynamics. Students experience Landauer’s principle firsthand: **erasing information has a thermodynamic cost that exactly cancels the work extracted from sorting**. The ledger represents the demon’s physical memory, and its erasure closes the thermodynamic accounting.

  ---

  ### **Materials & Setup**
  1. **Molecule Cards**:  
     - 40 cards (20 for each run), each labeled "0" or "1" (10 of each per run).  
     - *Example*: "0" = low-energy molecule (e.g., "slow"), "1" = high-energy molecule (e.g., "fast").  
  2. **Gate & Paths**:  
     - A table with two paths: "Left" (for "0"s) and "Right" (for "1"s).  
     - A physical gate (e.g., a book or cardboard flap) controlled by the demon.  
  3. **Ledger System**:  
     - A whiteboard or large poster divided into rows (one per molecule) and columns:  
       - **Column 1**: Molecule number (1-20).  
       - **Column 2**: Measured state (0/1).  
       - **Column 3**: Action (✓ if gate opened, ✗ if closed).  
     - Markers and eraser.  
  4. **Tokens**:  
     - **Work tokens (blue)**: Represent extracted work (1 token = work to lift a weight).  
     - **Erasure tokens (red)**: Represent energy cost to erase memory (1 token = cost to erase 1 bit).  
     - *Alternative*: Use coins (heads = work, tails = erasure) and a central scoreboard.  
  5. **Role Badges**:  
     - Demon, Ledger-Keeper, Auditor, Molecules (20 students).  

  ---

  ### **Roles**
  1. **Molecules (20 students)**:  
     - Each holds a molecule card (0 or 1). Line up and walk past the gate one by one.  
  2. **Demon (1 student)**:  
     - Opens/closes the gate to sort molecules based on measurements.  
  3. **Ledger-Keeper (1 student)**:  
     - Records the demon’s measurements/actions on the ledger. Erases the ledger at the end of a run.  
  4. **Auditor (1 student)**:  
     - Distributes tokens: Awards work tokens for correct sorts, charges erasure tokens for ledger wiping.  
     - Enforces rules and calculates net tokens.  

  ---

  ### **Rules for a Run**
  #### **1. Control Run: Sorting Without Measurement (15 min)**  
  - **Goal**: Show that random sorting yields no net work.  
  - **Setup**:  
    - Molecules receive random 0/1 cards (shuffled).  
    - Ledger is blank. Demon **does not measure** states.  
  - **Procedure**:  
    - Demon opens/closes the gate randomly (e.g., alternating every 5 molecules).  
    - Molecules walk past the gate. No ledger entries.  
  - **Scoring**:  
    - Auditor awards 1 **work token (blue)** for each correct sort (0 sent left, 1 sent right).  
    - Penalizes 1 work token for each incorrect sort.  
    - No erasure cost (ledger unused).  

  #### **2. Standard Run: Sorting With Measurement (25 min)**  
  - **Goal**: Show that work from sorting is canceled by erasure cost.  
  - **Setup**:  
    - New set of random 0/1 cards. Ledger is blank.  
  - **Procedure**:  
    - Demon **measures** each molecule’s state and:  
      - Opens gate for "1" (sends it right).  
      - Closes gate for "0" (sends it left).  
    - Ledger-Keeper records:  
      - Measured state (0/1) and action (✓/✗) for each molecule.  
  - **Scoring**:  
    - Auditor awards 1 **work token (blue)** per correct sort.  
    - After sorting, Ledger-Keeper **wipes the ledger clean** (resets all cells to blank).  
    - Auditor charges 1 **erasure token (red)** per ledger cell used (20 tokens for 20 molecules).  

  #### **3. Pre-Correlated Run: Leveraging Existing Information (20 min)**  
  - **Goal**: Show that pre-existing correlation enables extra work, but erasure costs reclaim it.  
  - **Setup**:  
    - Ledger **pre-filled** with correct states for the first 10 molecules (correlated with gas).  
    - Molecules 11–20 receive random cards.  
  - **Procedure**:  
    - For molecules 1–10: Demon **does not measure**—uses ledger states to sort.  
    - For molecules 11–20: Demon measures and sorts; Ledger-Keeper records new entries.  
  - **Scoring**:  
    - Auditor awards 1 **work token (blue)** per correct sort.  
    - Ledger-Keeper erases the **entire ledger** (20 cells: 10 pre-filled + 10 new).  
    - Auditor charges 1 **erasure token (red)** per cell (20 tokens).  

  ---

  ### **Token Scoring**
  - **Work tokens (blue)**:  
    - +1 for each molecule sorted correctly.  
    - −1 for each incorrect sort (control run only).  
  - **Erasure tokens (red)**:  
    −1 per ledger cell erased.  
  - **Net tokens** = (Σ blue tokens) - (Σ red tokens).  
    - Second law requires **net ≤ 0**.  

  ---

  ### **90-Minute Timeline**  
  | Time  | Activity                                                                 |  
  |-------|--------------------------------------------------------------------------|  
  | 0-10  | Intro: Maxwell’s demon paradox, game rules, role assignment.            |  
  | 10-25 | **Control Run**: Random sorting. Net tokens ≈ 0.                        |  
  | 25-50 | **Standard Run**: Measurement + sorting. Net tokens = 0.                |  
  | 50-70 | **Pre-Correlated Run**: Correlated memory. Net tokens = 0.              |  
  | 70-90 | **Debrief**: Map game events to physics concepts.                       |  

  ---

  ### **Debrief: Mapping Game to Physics**  
  1. **Control Run (No Measurement)**:  
     - *Physics*: Sorting without knowledge is random. No net work extracted (net tokens ≈ 0).  
     - *Key idea*: Second law holds without information.  

  2. **Standard Run (Measurement)**:  
     - *Game*: Demon extracts work (blue tokens) but pays erasure cost (red tokens).  
     - *Physics*:  
       - **Measurement** is physical: Demon interacts with molecules to read states.  
       - **Ledger as memory**: A thermodynamic system with entropy. Recording increases its entropy.  
       - **Erasure cost**: Landauer’s principle—erasing 1 bit dissipates *kT* ln 2 heat.  
     - *Key idea*: Work extracted is repaid during erasure. Net effect: **ΔS_total ≥ 0**.  

  3. **Pre-Correlated Run**:  
     - *Game*: Extra work from pre-filled ledger, but erasure costs reclaim it.  
     - *Physics*:  
       - **Pre-correlation**: Mutual information between gas and memory enables "free" work.  
       - **Erasure resets entropy**: Memory must be wiped, dissipating heat equal to mutual information.  
     - *Key idea*: **Memory must be part of the system**. Work from correlation was "paid for" when the memory was initially written (outside the run).  

  4. **Why the Demon’s Cleverness Fails**:  
     - *Game*: Demon’s sorting strategy earns tokens, but ledger erasure always zeros the net.  
     - *Physics*: The demon’s intelligence is irrelevant—**memory is physical**. Its erasure is thermodynamically irreversible.  

  5. **Saving the Second Law**:  
     - *Game*: Net tokens = 0 only when ledger erasure is included.  
     - *Physics*: Second law holds because **memory is audited with the gas**. Isolated systems (gas alone) ignore memory’s entropy, but the full system (gas + memory) obeys ΔS_total ≥ 0.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Control run net tokens > 0 (due to lucky random sorting).  
     - **Fix**: Emphasize statistics—this is rare. Run a quick coin-flip demo to show entropy increases *on average*.  

  2. **Problem**: Ledger not fully erased (e.g., faint marks left).  
     - **Fix**: Auditor verifies blank state. Discuss: Real erasure requires resetting to a *standard state* (e.g., all bits 0).  

  3. **Problem**: Students question why measurement has no cost.  
     - **Fix**: Clarify: Measurement *can* be reversible (no energy cost), but **erasure is fundamentally irreversible**.  

  4. **Problem**: Pre-correlated run confuses students (e.g., "Why charge erasure for pre-filled cells?").  
     - **Fix**: Stress: Pre-filled memory was *written earlier* at a cost outside the run. Erasure settles the *current* debt.  

  ---

  ### **What the Game Cannot Simulate (Instructor Explanation Required)**  
  - **Reversibility of Measurement**:  
    - The game assumes measurement is free, but in reality, it must be thermodynamically reversible to avoid hidden costs. Explain: Ideal measurements conserve entropy (e.g., via Hamiltonian dynamics), while erasure *must* increase it.  
  - **Gate Operation Energy**:  
    - The game ignores energy costs of moving the gate. Clarify: In real systems, this must be powered by the extracted work.  
  - **Quantitative Entropy**:  
    - Tokens abstract entropy (1 token ≈ *kT* ln 2). Explicitly map:  
      - Work token: *Extracted* work = *kT* ln 2 per sorted molecule.  
      - Erasure token: *Dissipated* heat = *kT* ln 2 per bit erased.  

  ---

  ### **Instructor Notes**  
  - **Emphasize**: The demon’s failure is not due to stupidity—it’s a **fundamental accounting constraint**. The ledger makes the "hidden" entropy of memory visible.  
  - **End with**: "Maxwell’s demon doesn’t beat the second law; it *extends* it to include information."
