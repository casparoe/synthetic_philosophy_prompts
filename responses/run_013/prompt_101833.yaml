prompt: |-
  Last weekend a bunch of us were up at my parents' cabin and got into it about my friend Maya. Maya's the type who will not break a promise, full stop — she once drove three hours to meet a friend for lunch who she knew had forgotten and wouldn't be there, just because she'd said she'd come. Anyway the fight started over something kind of dumb: Maya had promised our other friend Dave she'd keep a secret of his, and it turned out keeping that secret was going to make Dave tell his girlfriend a small lie, and that lie was going to snowball into a much bigger betrayal later. I said look, if you just tell Dave's girlfriend the truth now, you break one small promise and stop a whole pile of bigger ones from ever happening — seems obvious to me. Maya said she wasn't going to break a promise in order to prevent other broken promises, and that was the end of it. I kept trying to pin her down: WHY is breaking a promise bad? If it's bad because it lets people down, then shouldn't you break the one to prevent a lot more letting-down? And she just said a promise is a promise, it's not about the total amount of disappointment in the world. Honestly I think she's got a point somewhere but I can't find it, and my other friends think she's just being stubborn for no reason.

  What I can't get past is that both of the answers she might give seem to fall apart. If she says a promise is wrong to break just because it's a promise, that sounds like she's worshipping the rule and doesn't actually care about the people involved. But if she says promises matter because of the harm that comes from breaking them, then she should be fine breaking the small one to prevent the bigger harms — which she says she isn't. So is there actually a third thing she could say that I'm missing? Is she being unreasonable, or is there some way to defend her that isn't just circular? And if there is, does that same defense mean I also shouldn't break a promise to prevent worse ones — or does it only work for her? I want help actually thinking this through, not just being told it depends.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They had a heated debate with their friend Maya about promise-keeping. The core issue is Maya's absolute refusal to break a promise, even when doing so could prevent greater harm. The user sees this as logically inconsistent and wants to understand if there's a valid third perspective beyond "rules are rules" or pure harm calculation.

  Hmm... first I need to map Maya's position clearly. She's operating on deontological ethics - the intrinsic duty to keep promises regardless of consequences. The user's challenge points out two apparent contradictions: Either Maya admits promises are only about preventing harm (which would justify breaking this one), or she's blindly following rules (which seems inhuman). 

  What's interesting is the user genuinely wants to find coherence in Maya's view. They're frustrated but not dismissive - that's important. The cabin argument shows this matters deeply to their friend group dynamics. 

  The key might be in how promises function socially. If we view them as foundational to trust-building rather than individual acts, Maya's stance makes more sense. By refusing to break any promise, she maintains her reliability as an institution. This explains why she'd drive hours to meet someone who forgot - it's about her identity as a promise-keeper. 

  But then the user's second worry: Does this "third way" bind everyone equally? Well... not necessarily. The institutional view works best when consistently applied by individuals known for that consistency. Maya's friends might reasonably choose different approaches precisely because they don't claim her absolute standard. 

  Ah! And this resolves the "circular" charge - it's not that promise-keeping is good because it's a rule, but because this specific practice sustains a crucial social fabric. The user's harm-prevention approach isn't wrong, just operating on a different ethical plane. 

  ...I should probably mention virtue ethics too. Maya's position gains force when seeing promise-keeping as core to her character. But the institutional framing feels stronger here since it answers the "why not break small promises?" question directly. 

  The girlfriend example helps test this: If Maya breaks the small promise, she becomes complicit in Dave's deception chain. Her hands stay clean only by maintaining the original promise. That's psychologically coherent even if others disagree. 

  Final thought: The user's real need might be validation that both approaches have merit. They want to resolve the fight without either side "losing." Highlighting complementary ethical frameworks could help them see the debate as productive rather than stubborn.
answer: |-
  You've hit on a profound ethical dilemma – and Maya's stance *is* defensible without being circular or ignoring people. It rests on a different ethical foundation than the one you're using (which is consequentialism: judging actions by their outcomes). Here's the breakdown and the "third thing":

  ### The Core of Maya's Position: Deontology & Integrity

  Maya likely subscribes to a **deontological** ethical framework (from "deon" = duty). For her, keeping a promise isn't *primarily* about calculating net harm/benefit *this time*. It's about:

  1.  **Intrinsic Wrongness:** Breaking a promise is inherently wrong, regardless of consequences. It violates a fundamental moral duty we owe to others when we give our word.
  2.  **Integrity & Identity:** Keeping promises is core to who Maya *is*. It's about maintaining her own integrity as a trustworthy person. Breaking a promise, even for good reasons, damages her self-conception and the reliability others can place in her character.
  3.  **The Social Fabric of Promises:** Promises work *only* because there's a general, nearly absolute rule to keep them. If we start making exceptions based on predicting uncertain future harms, the entire institution of promise-keeping crumbles. Why would anyone trust *any* promise if they knew the promiser might break it based on their own calculation of "greater good"? Maya isn't just keeping *this* promise; she's upholding the *system* that makes promises meaningful.
  4.  **Agency & Responsibility:** Maya believes *her* moral responsibility is limited to *her* actions and *her* promises. She promised Dave to keep his secret. Dave's subsequent decision to tell a small lie (and the potential snowball) is *Dave's* responsibility and *his* moral failing. Maya didn't make Dave lie; she only promised not to reveal his secret. Breaking *her* promise to prevent *Dave* from potentially breaking *his* promises later involves her taking responsibility for Dave's choices and compromising her own integrity in the process. She draws a clear line: "I control my actions and keep my word. I am not responsible for fixing the potential bad actions of others that I didn't cause."

  ### Why Your Counterarguments Don't Fully Land for Her

  *   **"It's about the harm/disappointment":** You're framing the value of a promise *only* in terms of its consequences (avoiding disappointment). She rejects this. For her, the value is in the act of keeping faith itself, the duty fulfilled, the integrity maintained, and the social institution upheld. The harm of breaking *this* promise is immediate and direct: she violates a specific duty *to Dave*. The future harms you predict are indirect, uncertain, and Dave's responsibility.
  *   **"Worshipping the rule":** She would argue it's not blind worship; it's recognizing that certain rules (like keeping promises) are foundational for trust and relationships. Without near-absolute adherence, the rule loses its power and meaning. The "rule" exists *for the sake of the people*, precisely to create reliable bonds.

  ### The "Third Thing" You're Missing: The Foundation of Trust

  **Maya's core defense is that absolute fidelity to promises is the necessary bedrock upon which interpersonal trust is built.** She isn't ignoring people; she's prioritizing the *long-term, systemic* health of relationships through unwavering reliability. By refusing to break *any* promise, she ensures that *her* word is ironclad. This makes her a uniquely reliable anchor in the social world. Breaking a promise, even for apparently good reasons, introduces corrosive doubt: "If Maya broke *that* promise for *that* reason, what stops her from breaking *my* promise for *her* interpretation of a 'greater good'?" She avoids this entirely by having a bright-line rule.

  ### Is She Unreasonable? Is This Defense Only for Her?

  1.  **Unreasonable?** Not inherently. Her position is a coherent and historically significant ethical stance (think Kant's Categorical Imperative). It prioritizes duty, integrity, and systemic trust over situational outcomes. It *can* be inflexible and lead to bad outcomes (as in your scenario), which is the main criticism of deontology.
  2.  **Only for Her?** No, the *principle* applies to everyone. However, its *practical application* depends on the individual:
      *   **For Maya:** Her personal integrity is built on this absolute standard. Breaking *any* promise would violate her core identity. She *must* adhere strictly to be true to herself.
      *   **For You/Others:** You might adopt a more nuanced view. You could believe promises are *generally* absolute but recognize *extremely rare* exceptions where breaking one prevents catastrophic, imminent, and highly certain harm *that you directly caused or could uniquely prevent*. (Even then, you'd likely feel terrible about breaking the promise). You wouldn't claim Maya's level of absolutism, so you wouldn't be hypocritical for making a different choice in her scenario. The defense "works" for the principle Maya lives by, but you aren't obligated to build *your* identity on that same absolute principle.

  ### Thinking It Through: The Trade-Off

  *   **Maya's Way:** Maximizes individual integrity and the absolute reliability of *her* word. Protects the institution of promises *as she practices it*. Risks allowing preventable harms caused by others to occur (as in Dave's potential snowball) because she refuses to compromise her own duty.
  *   **Your Way (Consequentialist):** Aims to minimize overall harm in specific situations. More flexible and potentially prevents worse outcomes. Risks eroding trust in promises generally ("Will they break it if they think it's for my own good?"), damages the promiser's sense of integrity if done frequently, and relies on often-uncertain predictions of the future.

  ### Conclusion

  Maya isn't being circular or stubborn without reason. She's operating from a principled stance that values the inherent duty of promise-keeping, personal integrity, and the foundational role of absolute fidelity in building trust, *above* calculated outcomes in any single situation. She believes the harm caused by *her* breaking *her* promise is direct and certain, while the future harms she might prevent are indirect, uncertain, and someone else's responsibility. Her defense isn't just "a promise is a promise"; it's "keeping *every* promise is essential for me to be me, for my word to mean something absolute, and for the trust that holds relationships together to function properly." While this can lead to difficult outcomes, it's a valid and coherent ethical perspective. You can understand and respect her position without necessarily adopting it yourself for every situation.
