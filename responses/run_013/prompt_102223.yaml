prompt: |-
  I'm in a metaphysics course and we've been on the endurantism vs. perdurantism stuff, and my study partner and I keep going in circles over a case our prof threw out that isn't in the textbook: a wave rolling across a lake. At any given instant the wave is just some patch of water, and a moment later it's a totally different patch of water, yet we happily say the *same* wave moved across the lake. My partner says this is basically a proof of perdurantism: there's no 3D thing that's "the wave" at any single instant which sticks around, so the wave has to be a 4D whole made of temporal parts. I think that's backwards — the wave is wholly present at each moment, it just isn't *made of* the water it happens to be passing through, so the water swapping out is a red herring. Can you write out the dialogue we'd have if we each pushed our side as hard as we could? We should both be competent, no strawmanning, and we should actually respond to each other's moves rather than talk past each other. I especially want it to get into whether a wave's "temporal parts" are even parts of it in the way a person's are supposed to be, and whether the wave being a different bit of water at every moment is really a problem for one view and not the other. Also throw in the question of whether the wave is even one thing rather than alot of overlapping ones. Don't let it collapse into a recap of what famous philosophers said — I want the actual argument.
