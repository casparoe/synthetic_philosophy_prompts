answer: |-
  ### Death in Damascus: Looping Choice Activity  
  **Goal:** Create a visceral experience of the decision loop where evidential reasoning about one's own action prevents settling on a choice. Participants repeatedly commit, regret, switch, and regret again.  

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - 2 signs: "DAMASCUS" and "ALEPPO" (taped on opposite sides of the room).  
  - Tokens: 14 red tokens (death tokens), 14 blue tokens (survival tokens), and a opaque bag.  
  - Scoreboard (whiteboard or poster) to track "deaths" per participant (use tally marks).  
  - 1 coin.  
  - **Secret Mechanism:** A confederate (e.g., a grad student) who *always* draws a red token from the bag when needed (rigged).  

  **Player Roles:**  
  - All 14 participants are "Travelers."  
  - Facilitator (you) is "Death’s Oracle" (announces outcomes).  
  - Confederate is "The Merchant" (manages tokens secretly).  

  **Token Economy:**  
  - **Survival:** Gain 1 "life point" (recorded on scoreboard).  
  - **Death:** Lose 1 life point.  
  - No real stakes—pride/bragging rights at stake.  

  ---

  ### **Procedure**  
  *(Total: 60 minutes activity, 30 minutes debrief)*  

  1. **Intro (5 min):**  
     - *"You’re in Damascus. Death is coming for you tonight—predictably. You can STAY or FLEE to Aleppo. Choose wisely."*  
     - Explain rules:  
       - Each round, choose DAMASCUS or ALEPPO. Move to that side of the room.  
       - After choices, "Death’s Oracle" (you) reveals if Death is in Damascus/Aleppo via token draw.  
       - If Death is in your city, you DIE (lose 1 point). If not, SURVIVE (gain 1 point).  
       - **Crucial:** After seeing the result, you MAY SWITCH cities before the next round.  

  2. **Rounds 1–3: "Fixed Death" (20 min)**  
     - **Round 1:**  
       - Participants choose DAMASCUS or ALEPPO.  
       - Confederate ("Merchant") draws 1 token from the bag (secretly rigged: always red).  
       - Oracle announces: *"Death is in [MAJORITY CITY]."* (e.g., if 10 chose Damascus, Death is in Damascus).  
       - **Outcome:** Travelers in Death’s city DIE (lose 1); others SURVIVE (gain 1).  
     - **Round 2:**  
       - Allow switches: *"You may change cities now."*  
       - Repeat draw/announcement: Confederate again draws red. Death is WHEREVER THE MAJORITY IS.  
       - Record outcomes.  
     - **Round 3:**  
       - Repeat (allow switches → draw red → Death where majority is).  
       - *Result:* Most realize switching to the minority city grants survival.  

  3. **Rounds 4–6: "The Loop" (25 min)**  
     - Change rule secretly (rigged to induce looping):  
       - **New rule:** Death is always WHERE THE *MINORITY* WAS AT THE START OF THE ROUND.  
       - Confederate now draws blue if majority stayed, red if majority switched (pre-rigged to match secret rule).  
     - **Round 4:**  
       - Participants choose cities.  
       - Draw token (e.g., if 11 chose Damascus, Death is in Aleppo—rig blue for Aleppo).  
       - Announce: *"Death is in Aleppo."*  
       - Outcome: Aleppo travelers DIE; Damascus survives.  
       - Participants rage: *"I fled to Damascus to survive, but Death was in Aleppo?!"*  
     - **Round 5:**  
       - Allow switches. Most flee to Aleppo (since it "should be safe").  
       - Rig draw: If majority switched to Aleppo, draw red → *"Death is in Aleppo."*  
       - Outcome: Aleppo travelers DIE again.  
     - **Round 6:**  
       - Allow switches. Most panic and return to Damascus.  
       - Rig draw: If majority switched to Damascus, draw red → *"Death is in Damascus."*  
       - Outcome: Damascus travelers DIE.  
       - *Participants are now furious/confused—switching always kills them.*  

  4. **Loop-Breaking Attempt (10 min):**  
     - *"New rule: You can flip a coin to decide STAY/FLEE."*  
     - Participants flip coins privately and move.  
     - Rig draw: Death is in whichever city had MORE COIN-FLIP "STAYS" (use pre-rigged token).  
     - Announce outcome.  
     - **Twist:** Offer a "Survival Lottery Ticket":  
       - Pay 1 life point for a ticket paying 10 life points if you survive.  
       - *Most buy it (evidential reasoning: "I probably won’t die!").*  
       - Then reveal deaths—most who bought tickets died.  

  ---

  ### **Debrief (30 min)**  
  Map each activity beat to the Death in Damascus concepts:  

  1. **Fixed Death Phase (Rounds 1–3):**  
     - *"At first, Death seemed to follow the majority—causal, like a self-fulfilling prophecy. But when you switched to the minority, you survived. This felt controllable."*  
     - **Concept:** Causal decision theory (your action *causes* survival).  

  2. **Loop Phase (Rounds 4–6):**  
     - *"Then Death always appeared where you *weren’t* initially. Switching made you die again. Why?"*  
     - **Concept:** Evidential reasoning:  
       - When you chose Damascus, that was *evidence* Death was in Aleppo → You fled → but your fleeing was *evidence* Death was in Damascus → loop.  
       - Death was fixed (predetermined), but your actions were *symptoms* of your doom.  
     - **Ratifiability:** No choice was stable—once made, you wanted to switch.  

  3. **Coin-Flip & Lottery (Loop-Breaking Attempt):**  
     - *"The coin flip ‘solved’ the loop by randomizing. But then you bought the lottery ticket—why?"*  
     - **Concept:** Ex-ante vs. ex-post rationality:  
       - Pre-flip: Survival chance is 50% → ticket has +EV.  
       - Post-flip: Once you chose, you *knew* you’d die (if doomed) → ticket is worthless.  
     - **Exploitability:** Agents using mixed strategies still fall for evidential traps.  

  4. **Key Ambiguity:**  
     - *"Did your actions cause Death, or just predict it? The activity hid this—like the real puzzle, where the distinction blurs."*  
     - **Takeaway:** Evidential reasoning fails when your action is evidence about a *fixed* threat.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Participants refuse to move (simulating "no choice").  
     - **Fix:** Announce: *"Not choosing is STAYING. You MUST pick a side."*  

  2. **Problem:** Someone deduces the rigged token draws.  
     - **Fix:** Use the confederate to distract ("I mixed the bag!"). If exposed, admit post-activity: *"The rigging simulated Death’s perfect prediction."*  

  3. **Problem:** Groups coordinate to split evenly.  
     - **Fix:** Allow it. Then rig Death to the city with more "hesitant" players (e.g., those who switched last round)—keeps unpredictability.  

  4. **Problem:** Frustration dominates insight ("This is rigged!").  
     - **Fix:** Validate: *"Yes! The loop feels rigged. Now imagine this is your brain arguing with itself."*  

  5. **Problem:** Time runs short.  
     - **Fix:** Skip Round 6 or lottery. Focus debrief on the loop.  

  ---

  ### **What the Activity Can’t Simulate**  
  1. **Solo Looping:** The paradox happens in one mind, not a group. Participants may infer the loop from peers’ actions.  
     - **Solution:** Explain post-activity: *"Real Death in Damascus is solitary—your own reasoning loops while you pace your room."*  

  2. **Evidential vs. Causal Ambiguity:** The rigging *feels* causal (Death responds to switches).  
     - **Solution:** Clarify in debrief: *"In the puzzle, Death doesn’t react—it’s already set. Your actions are just clues."*  

  3. **Mixed Strategies Fail:** The coin-flip "works" here (stops looping) but not in the puzzle.  
     - **Solution:** Discuss: *"In reality, seeing your coin-flip outcome restarts the loop—you’ll want to switch!"*  

  ---  
  **Final Tip:** After the debrief, reveal the rigged mechanics. Highlight how evidential loops make us distrust our own decisions—even when we "win," we second-guess. Lean into the unsettling vibe: *"Congratulations, you survived... or did Death just let you think that?"**
