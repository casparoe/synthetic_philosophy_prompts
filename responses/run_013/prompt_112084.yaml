answer: |-
  Preferences are constituted by the inference model itself, not discovered as mind-independent facts, because "preference" is an attribution made within a specific framework of agency that defines what counts as goal-directed behavior versus noise, and no such framework is uniquely privileged. 

  The deeper error is ontological: treating "preference" as a pre-linguistic, intrinsic mental state that behavioral evidence merely reveals. However, preferences only become legible as such when interpreted through a model that decides which aspects of behavior are expressive of stable goals versus execution failures, contextual distractions, or transient impulses. A "preference" is not an atomic entity in the brain; it is a construct that organizes observed actions into a narrative of agency, and different models impose different narratives. The underdetermination by finite data is symptomatic because it reveals that any reward function is just one projection of behavior onto an abstract preference-space, but the constitutive error is assuming such a space exists prior to the projection.

  Standard remedies relocate this problem:
  - **Boltzmann-rationality** assumes a specific error model (exponentially scaled reward differences) and temperature parameter, making preferences contingent on arbitrary choices about the *nature* and *degree* of irrationality deemed "noise".
  - **Stationary reward with approximate optimality** assumes temporal consistency and a specific metric for "approximation" (e.g., bounded regret), making preferences contingent on arbitrary definitions of what deviations are tolerable and when behavior is "close enough" to optimal.
  - **Coherent ranking via noisy sampling** assumes a latent total ordering of outcomes, making preferences contingent on the forced imposition of transitivity and completeness onto inherently context-dependent and potentially inconsistent choices.

  Each relocates the arbitrariness: from choosing a reward function to choosing a *rationality model* (temperature, regret bound, noise distribution) and a *ceteris paribus clause* (which contextual factors are held fixed in the preference attribution). The core issue persists: the "preference" is defined by these auxiliary assumptions, not uncovered beneath them.

  The practical upshot is that reward learning remains answerable to *functional success in achieving cooperative alignment*, not to discovering metaphysically true preferences. Preferences are constructed, but the construction is constrained by the need for the AI's behavior to *sustainably coordinate* with human interests in practice. We test inferred preferences not against a mythical "real want" but against their consequences: does acting on them lead to outcomes humans endorse *over time* across varied situations, avoid catastrophic miscoordination, and permit refinement via further feedback? The constraint is pragmatic viability, not ontological fidelity. Thus, preference inference is not arbitrary—it is disciplined by the empirical requirement that the resulting agent *functions well* as a cooperative partner in the real world.
