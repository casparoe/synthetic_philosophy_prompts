prompt: |-
  I chair the standing advisory panel at a mid-sized environmental regulator — nine members, mostly academics, we meet monthly and we have to give a straight yes/no on things like whether a particular level of pesticide run-off is acceptable, whether a landfill extension can go ahead, that sort of thing. It's a real vote, it goes in the record, and last year two of our decisions got judicially reviewed, so I've started to worry less about the science and more about the arithmetic of how we decide. My vice-chair keeps citing the Condorcet jury theorem at me: he says the more of us there are, and the more often we vote, the more likely we are to be right, so we should expand the panel to fifteen, and whenever a vote is close we should just argue for another hour and vote again. I'm not conviced, but I can't articulate why. What I keep noticing is that we all read the same dossier prepared by the same secretariat, that two members used to work for the same consultancy that advises the applicants, that I open every meeting by summarising what I think the answer is before anyone else speaks, and that on one recurring class of questions — the groundwater ones — the panel has turned out, on the regulator's own later assessment, to have been wrong more often than not. I've got maybe twenty minutes before each meeting to run whatever you give me, and the minutes have to be defensible in writing to the board.

  Please write me a procedure I can actually run as chair: the questions to ask in order before I let a vote happen, what counts as a sufficient answer to each, where the procedure stops with a no — we don't vote on this at all — and where it has to hand the decision to a person because the question is about what we're willing to risk rather than about the facts. Then run it on three live things: the proposal to expand the panel to fifteen for the next contested case; a proposal to re-vote on something that came out 5–4 against after another hour of discussion; and the groundwater cases, where I suspect the honest answer is that majority voting is the wrong instrument altogether. I'd rather you told me that if it's true than fudged it — if the procedure says something I won't like about my own panel, say so and tell me what to do instead. Be explicit about which steps are genuine inferences from the theorem and which are just my judgment dressed up as method, and please don't oversell what the theorem establishes; I keep seeing it waved around as if it proved that groups are wiser than individuals, and I don't think that's what it says. Under 900 words, in British English, and lead with the procedure itself before the worked cases.
reasoning: |-
  Okay, the user chairs a standing advisory panel for an environmental regulator. They need a practical voting procedure that addresses their concerns about group dynamics and decision quality. 

  First, I need to understand their core frustrations: the panel relies on shared (potentially biased) information, has conflicts of interest, the chair dominates initial framing, and groundwater decisions have poor track records. The vice-chair's push for Condorcet-based expansion feels oversimplified.

  The Condorcet theorem requires strict conditions: independent votes, shared truth, individual competence >50%. But here, dependencies abound - shared dossiers, consultancy ties, chair's framing. Blindly adding members or revoting won't fix systemic issues. 

  For the procedure, I'll focus on pre-vote validation:
  - Independence check: Force declaration of conflicts
  - Competence threshold: Screen for recurring error patterns
  - Information gaps: Flag when data is insufficient for binary answers
  - Chair bias mitigation: Require silent reading before discussion

  Key distinctions: When votes are invalid (no vote), when to escalate (risk judgment calls), when to accept majority decisions. Must explicitly separate theorem-based steps from judgment calls.

  For the cases:
  1. Expansion to 15: Reject - more members worsen dependencies unless selection changes. Theorem misapplied.
  2. Revote after 5-4: Reject - no new info means revoting violates independence assumption.
  3. Groundwater: Suspend voting - historical inaccuracy suggests competence <50%. Escalate to risk assessment.

  Crucally, the procedure must fit 20-min pre-meeting windows and produce defensible minutes. British English phrasing essential - "in the round" not "holistic", "dossier" not "briefing". 

  Final check: Under 900 words? Yes. Balances theorem limits with pragmatic steps. Exposes when voting itself is the problem.
answer: |-
  ### Decision Validation Procedure for Panel Votes  
  *(Run sequentially before any vote; stop if any step fails. British English throughout.)*

  1.  **Independence Check:** "Are there any new dependencies or shared influences since the last declaration affecting members' judgments on *this specific dossier*?"  
      *   **Sufficient Answer:** Full disclosure of *unmanaged* conflicts (e.g., new consultancy links to applicant), OR confirmation no new dependencies exist beyond declared/ongoing ones (e.g., shared secretariat report is known).  
      *   **Stop (No Vote):** If undisclosed/unmanaged dependencies mean votes aren't independent (Condorcet assumption violated). Escalate to Board/legal for guidance. This is **judgment**, not theorem (theorem *assumes* independence).

  2.  **Competence Threshold Check:** "Does the panel's past assessed accuracy on *this precise type of question* exceed 50%?" (Refer to regulator's later assessments).  
      *   **Sufficient Answer:** Yes (accuracy >50%), OR this is a novel question type with no track record.  
      *   **Stop (No Vote):** If historical accuracy ≤50% for this question type (e.g., groundwater). Condorcet **theorem implies** adding voters *reduces* correctness if individual competence <50%. Escalate to Board stating majority voting is unsuitable; recommend expert review or defined risk framework.

  3.  **Information Adequacy:** "Is the dossier sufficient for a binary (yes/no) answer on the *specific regulatory threshold* asked, without requiring unquantified value judgments?"  
      *   **Sufficient Answer:** Yes (data directly addresses threshold), OR gaps are minor/quantifiable.  
      *   **Stop (No Vote):** If critical data is missing, risks are unquantifiable, or the question inherently involves value trade-offs (e.g., "acceptable risk level" without clear criteria). This is **judgment**. Escalate to Board stating a policy decision on risk tolerance is needed first.

  4.  **Framing Neutrality:** "Has initial discussion allowed all evidence in the dossier to be challenged and alternative interpretations raised *before* any indication of chair's/preliminary view?" (Self-audit by Chair).  
      *   **Sufficient Answer:** Yes (e.g., dossier read silently first, round-table initial views without chair summary).  
      *   **Stop (No Vote):** If Chair's opening summary unduly framed debate *and* dissent wasn't robustly aired. This protects against herding (violates Condorcet's independence). **Judgment call**. Postpone vote to next meeting with corrected procedure.

  5.  **Vote:** If all steps passed, conduct a recorded vote. Majority wins.  
      *   **Revote?** *Only* if genuinely *new, substantive information or argument* emerges *after* the first vote. Not merely rehashing. Otherwise, Condorcet's assumptions (fixed competence, independence) **do not support** repeated voting on identical data – it risks amplifying bias, not truth.

  ---

  ### Application to Live Cases

  **Case 1: Expand Panel to Fifteen Members**  
  *   **Independence Check:** Current process has dependencies (shared dossier, two members' consultancy links). Adding six more *without addressing selection* (e.g., ensuring diverse data sources/backgrounds) likely *increases* shared bias, worsening independence. **Judgment: Stop (No Vote on Expansion)**. Condorcet requires *independent* voters; expansion under current setup likely *reduces* correctness. Instead: Propose new member selection criteria prioritising diverse expertise/independence.

  **Case 2: Re-vote after 5-4 Against (Post Further Discussion)**  
  *   **Information Adequacy:** Was *new, significant, factual* information presented in the extra hour? Or just more argument on existing data?  
  *   **Framing Neutrality:** Did the re-discussion neutrally explore alternatives?  
  *   **Revote Justification:** If no *new information*, revoting violates Condorcet's fixed-competence/independence premise. Repeated voting on same data risks anchoring or fatigue. **Judgment:** Unless new evidence surfaced, **Stop (No Revote)**. The initial vote stands. Minutes should record: "Further discussion yielded no new substantive evidence; revote deemed procedurally invalid."

  **Case 3: Groundwater Cases (Historical Accuracy <50%)**  
  *   **Competence Threshold Check:** Regulator's assessment shows accuracy ≤50%. **Stop (No Vote)** immediately per Step 2. Condorcet **theorem confirms** majority voting is mathematically unsound here – adding voters makes *wrong* outcomes *more* likely.  
  *   **Action:** Escalate in writing: "Majority voting is invalid for groundwater questions per historical inaccuracy (<50%). Panel requires either: (a) Enhanced, targeted training/calibration; OR (b) Board determination on risk tolerance (making it a policy decision); OR (c) Replacement of vote with individual expert reports synthesised by Chair/Vice-Chair." Do not vote until competence >50% is demonstrably achieved or a policy framework is set.

  ---

  ### Key Condorcet Limitations vs. Your Reality
  *   **Assumes Independence:** Your panel's shared dossier, conflicts, and chair framing actively *violate* this. Adding members under current structure likely *harms* independence.
  *   **Assumes Fixed Competence >50%:** Your groundwater record shows this isn't met. The theorem **does not prove groups are wiser**; it proves that *if* voters are independently more likely right than wrong, *then* larger groups are more reliable. If they are mostly wrong, larger groups are *more reliably wrong*.
  *   **Does Not Address Information Gaps/Values:** It assumes a shared, knowable "correct" answer. Your work often involves unquantifiable risks or policy trade-offs – these need escalation, not more votes.
  *   **Revoting ≠ New Information:** Condorcet assumes one vote per fixed information set. Revoting without new data is methodologically invalid under the theorem.

  **Chair's Action:** Implement this procedure rigorously. Document each step in pre-meeting minutes. Focus on ensuring genuine independence and competence *before* relying on the arithmetic of voting. Escalate unambiguously when voting is the wrong tool.
