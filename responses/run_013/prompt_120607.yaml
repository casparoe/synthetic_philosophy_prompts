prompt: |-
  ok so I'm a software engineer, never took a philosophy class in my life, and I've gotten into a long argument with a friend about which sentences are "true by definition" and which are "true because of how the world turned out." I've got strong gut feelings on alot of them and I want to know if there's an actual rule behind my gut or if I'm just making it up case by case.

  My gut, going down the list:

  - "If someone's a bachelor, they're unmarried." By definition. Easy.
  - "If a shape is a square, it has four sides." Same.
  - "Every number divisible by 4 is even." By definition too, I think — except I had to do a little work to see it. But I didn't learn anything about the world, so: definition.
  - "If a triangle has three equal sides, it has three equal angles." This one bothers me. It feels like a discovery, like something I found out, not something sitting there in the words. But I also can't picture checking it in a lab. No idea where it goes.
  - "Water is H2O." Not by definition — people used water for ages without knowing that, and I wouldn't say they had a wrong idea of what "water" meant, just a fact they didn't have yet. But now that we know it, it also doesn't feel like a random fluke of the universe. So it's not-definitional but also not-just-lucky, and I have no slot for that.
  - "Nothing can be all red and all green in the same place at the same time." Feels like it has to be true. But is it true because of the words "red" and "green," or because of how eyes and light work? Can't tell.
  - "The bar in the vault in France that used to define the metre — that bar is one metre long." Feels trivially true, like I get it from the words alone, but its also about one specific physical object, which shouldn't be a "by definition" kind of thing.
  - "A whale is a mammal." I used to think this was by definition. Then I learned people thought whales were fish and it turned out to be a real biological discovery, so now I think it's not by definition at all. But it *feels* exactly like "a square has four sides," which worries me.
  - "A correct program does what its spec says." By definition, I'd say — that's literally what "correct" means for a program. Though maybe that's cheating since I defined the term myself.
  - Here's one from my own work that messes with me: I write "if the build passes, the tests pass," and then I change my pipeline so the build *includes* the tests. Yesterday that sentence was a real claim about my setup; today it's true no matter what. Did I turn a fact into a definition just by changing what "build" means?

  Two half-baked rules I keep reaching for: (P1) it's true-by-definition if you could know it just by understanding the words, without ever checking the world; (P2) it's true-by-definition if there's no possible way it could have been false. But they come apart on me. Water-is-H2O seems to pass P2 (could water have not been H2O? feels like no) but clearly fails P1. The metre-bar sentence passes P1 (words alone) but seems to fail P2 (the bar could've been longer, right?). So they can't both be the rule, and honestly I don't know which one I actually mean.

  What I want: is there a principle — even a messy, two-part one — that actually matches most of these? Where does it force me to give up a verdict? Where do the two I can't place (the triangle one and the water one) end up? And is this even a real distinction or just a spectrum — because in code "compile-time vs runtime" is a real split even though people argue about the edge cases forever, so "people argue about the edge cases" doesn't by itself mean there's no line.

  And if you can, tell me what your principle predicts for a case I didn't list — say "if you're in pain you're having an experience," or "if a number is prime and bigger than 2 then it's odd." The prime one feels like the triangle one (a bit of work) but I can't tell if that's the same thing or a different thing.

  Be straight with me if my gut just contradicts itself and some of these have to go.
reasoning: |-
  Okay, the user is a software engineer without a philosophy background, locked in an argument about what makes some truths "by definition" versus "empirical." They've listed several examples where their intuition clashes, and they're seeking a consistent framework. 

  First, I notice their struggle mirrors the analytic/synthetic distinction in philosophy—a classic divide that’s been debated since Kant. Their gut reactions mostly align with analytic truths (bachelors, squares) but waver on cases involving conceptual dependencies (triangles, primes) or a posteriori necessities (water = H₂O). The metre bar example is particularly clever—it’s analytic *now* but was originally synthetic, showing how definitions can be anchored to the world. 

  Their proposed rules (P1 and P2) are insightful but flawed because they conflate epistemology with metaphysics. P1 (knowable from words alone) captures analyticity, while P2 (couldn’t be false) points to necessary truths—which aren’t identical. Water = H₂O is necessary but not analytic; the metre bar was analytic but contingent until redefined. 

  For the triangle case: it’s synthetic a priori for Kant—provable through pure intuition, not just definitions. But modern math would call it analytic because it follows from Euclidean axioms. The user’s discomfort ("feels like a discovery") hints at how math blurs the line. 

  Whales being mammals is telling: their gut *wants* it to be analytic like "squares have sides," but history shows it’s empirical. This reveals a bias—we often mistake well-established facts for definitions. Their build-pipeline example nails this: repurposing terms can retroactively make truths definitional. 

  I’ll need to offer a dual-axis principle: analyticity (truth from meaning) vs. necessity (couldn’t be otherwise). Most of their examples fit cleanly:  
  - Bachelors: analytic + necessary  
  - Water: synthetic + necessary  
  - Metre bar: analytic + contingent (originally)  
  - Color exclusion: likely synthetic + necessary (depends on color theory)  

  The prime/odd case is analytic—it reduces to number definitions. Pain/experience is tricky: if "pain" implies subjective feel (by definition), it’s analytic; if not, it’s synthetic. 

  Crucially, I should validate that edge cases (like the triangle) are where philosophy *expects* debate—it doesn’t mean their intuition is broken. And yes, the spectrum analogy to compile-time/runtime is apt; contested boundaries don’t negate the distinction. 

  Finally, a nudge: their instinct that water’s necessity "isn’t random fluke" touches on Kripke’s essentialism—a solid insight for someone "just" going by gut.
answer: |-
  Your gut is wrestling with one of philosophy's oldest distinctions: **analytic** (true by definition) vs. **synthetic** (true by how the world is) truths. But your examples reveal why this is messy—especially since Kripke showed that some truths are *necessary but not analytic* (like "Water is H₂O"). Here’s a practical principle that fits your intuitions while handling edge cases:

  ---

  ### **The Principle: Two Axes of Truth**
  For any statement **"If A, then B"**, ask:
  1. **Epistemic Axis (How do we know?)**  
     Could a *hypothetical ideal speaker* (who fully grasps the meanings of A and B) know it’s true **without empirical investigation**?  
     → **Yes?** Analytic candidate.  
     → **No?** Synthetic candidate.  

  2. **Metaphysical Axis (Could it be false?)**  
     Is it **impossible for A to be true while B is false** in any coherent scenario?  
     → **Yes?** Necessarily true.  
     → **No?** Contingently true.  

  Most disagreements arise when these axes clash. Your examples sorted:  

  | Statement                          | Epistemic (Knowable from meaning?) | Metaphysical (Necessary?) | Verdict                                  |
  |------------------------------------|-----------------------------------|---------------------------|------------------------------------------|
  | **Bachelor → unmarried**           | ✅ Yes                            | ✅ Yes                     | **Analytic & Necessary** (Pure definition) |
  | **Square → four sides**            | ✅ Yes                            | ✅ Yes                     | **Analytic & Necessary** (Pure definition) |
  | **Divisible by 4 → even**          | ✅ Yes (via math definitions)     | ✅ Yes                     | **Analytic & Necessary** (Math consequence) |
  | **Prime >2 → odd**                 | ✅ Yes (same as above)            | ✅ Yes                     | **Analytic & Necessary** (Math consequence) |
  | **Triangle: equal sides → equal angles** | ⚠️ **Debatable** (Requires geometry proofs?*) | ✅ Yes | ***Synthetic A Priori*** (Necessary, but not obvious from definitions alone) |
  | **Water = H₂O**                    | ❌ No (needs chemistry)           | ✅ Yes (in all worlds)     | **Synthetic & Necessary** (Kripkean a posteriori necessity) |
  | **Red & green can’t coexist**      | ⚠️ **Debatable** (Depends on color theory) | ✅ Yes | ***Context-dependent*** (Analytic if "red/green" defined as exclusive; synthetic if based on light biology) |
  | **France’s metre bar = 1 metre**   | ✅ Yes (by definition in 1799)    | ❌ No (bar could shrink)   | **Analytic & Contingent** (True by fiat, but depends on physical reality) |
  | **Whale = mammal**                 | ❌ No (needs biology)             | ✅ Yes (biological essence)| **Synthetic & Necessary** (A posteriori necessity) |
  | **Correct program → matches spec** | ✅ Yes (by definition of "correct") | ✅ Yes | **Analytic & Necessary** (Stipulative definition) |
  | **Build passes → tests pass**      | ✅ **After** redefining "build"   | ✅ Yes                     | **Analytic & Necessary** (You made it definitional by changing the spec) |

  ---

  ### **Where Your Gut is Spot On**
  - **P1 (knowable from words)** captures the **epistemic axis** (analyticity).  
  - **P2 (couldn’t be false)** captures the **metaphysical axis** (necessity).  
  - **They *can* come apart**:  
    - Water = H₂O is **necessary** (P2 passes) but **not analytic** (P1 fails).  
    - The metre bar is **analytic** (P1 passes) but **contingent** (P2 fails—it could’ve been shorter).  

  ### **Tricky Cases Resolved**
  - **Triangle/equal angles**:  
    Your discomfort is justified. Euclidean geometry is *deducible* from axioms, so it’s **analytic** *within the system*. But if "triangle" is defined only as "3-sided polygon", the angle equality isn’t obvious—it feels synthetic because it requires *proof*.  
    → **Verdict**: Analytic *in a formal system*, but epistemically synthetic if you lack the system.  

  - **Water = H₂O**:  
    **Not analytic**: "Water" didn’t *mean* H₂O historically (we discovered it). But **necessary**: In any world, *that substance* is H₂O. It’s "not just lucky" because it’s metaphysically locked.  

  - **Red/green exclusion**:  
    If "red" and "green" are *defined* as mutually exclusive color categories (like in logic), it’s analytic. If they’re defined by wavelengths, it’s synthetic (depends on physics/biology).  

  - **Whale/mammal**:  
    Your shift is correct! "Whale" once meant "big sea creature" (synthetic: we discovered they’re mammals). Now it’s *defined* as a marine mammal, making it analytic. **Definitions evolve with science**.  

  - **Build pipeline**:  
    You **turned a synthetic truth into an analytic one** by redefining "build". This is how math/logic often works: axioms make contingent truths necessary.  

  ---

  ### **New Cases Tested**
  - **"If you’re in pain, you’re having an experience"**:  
    Analytic & Necessary. "Pain" implies subjective experience by definition (vs. e.g., "nociception", which doesn’t).  

  - **"Prime >2 → odd"**:  
    Analytic & Necessary. Follows from definitions: primes lack divisors; even numbers are divisible by 2; so any prime >2 can’t be even.  

  ---

  ### **The Messy Truth**
  - **Yes, there’s a real distinction** (like compile-time vs. runtime).  
  - **Edge cases exist** (especially in math or evolving definitions), but most truths fit cleanly.  
  - **Your gut is mostly consistent**—you’re sensing when a truth is **grounded in language/rules** vs. **grounded in empirical facts**.  

  **When to give up?** When concepts are **open-textured** (e.g., "whale" pre-biology) or **system-dependent** (e.g., geometric truths). But in practice, for a software engineer:  
  > **Analytic = "If you redefine the terms to make it tautological, it still feels correct."  
  > Synthetic = "You’d need to run an experiment (or consult science) to verify it."**

  This won’t satisfy a philosopher, but it works for 95% of cases. And yes—your triangle intuition is the deepest hole here. Kant called math "synthetic a priori". Logicians called it analytic. *We’re still fighting about it.*
