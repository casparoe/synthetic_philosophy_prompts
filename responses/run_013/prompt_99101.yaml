prompt: |-
  I'm presenting next week to the alignment team at a mid-sized lab — an audience that is mostly empirical deep-learning engineers who regard alignment theory as a cottage industry of essayists, plus two people who know the iterated amplification and distillation literature in detail and one mechanist who will keep asking what the activations are actually doing. My thesis is deliberately narrower than the usual one: I argue the amplification loop is sound only when every sub-task the decomposition yields is what I call overseer-checkable — meaning its correctness can in principle be graded by the same overseer that would grade the whole task. Where a decomposition forces sub-tasks that only a more capable overseer could grade — overseer-escalating sub-tasks — the amplification step converts competence into confident error, and distillation then launders that error into the student, with no signal anywhere in the loop that it has happened. On this view, decomposition preserves competence and alignment together only across a band much narrower than the original proposal assumes.

  Draft my Q&A prep sheet: the objections this audience will actually raise, not the ones I would get from people who already accept the framing. Order them by how much damage they would do, phrase each the way this audience would phrase it, and for each give a short reply plus a note on where that reply is soft. Tell me what I should concede up front, and name the one question I am hoping nobody asks.

  Return it as a single JSON object, no prose around it, with these fields: "thesis_in_one_line" (string); "audience_assumptions" (array of strings — what this audience takes for granted that I do not); "objections" (array, ordered by damage, each an object with "rank" (integer), "objection" (string, in the audience's own voice), "likely_asker" (string, e.g. the empirical engineer, the IDA-literate, the mechanist), "likelihood" (one of "low", "medium", "high"), "damage" (one of "low", "medium", "high"), "concede" (string, what I should give away, or "nothing"), "reply" (string, two minutes spoken), and "where_soft" (string)); "concede_up_front" (array of strings); "the_one_reply_that_must_land" (string); and "the_question_i_hope_nobody_asks" (object with "objection" and "why_it_worries_me", both strings). Use British English throughout.
