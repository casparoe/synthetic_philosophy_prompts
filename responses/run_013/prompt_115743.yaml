prompt: |-
  A few of us started this monthly writing thing where each person has to parody a genre and everyone else guesses the target, and this month I drew "corporate sustainability report" (a friend of mine works in ESG compliance and keeps forwarding me these ghastly PDFs, so that's where the idea came from). What I want to aim the satire at is the doing/allowing distinction -- not the trolley stuff everyone is sick of, but the way the distinction actually earns its keep in corporate and policy moral accounting: offset markets, "we're not the ones doing it, our supplier is," the fact that the law is very keen to hold you liable for a push and mostly declines to make you perform a rescue, and all the restructuring that converts a doing into an allowing without changing a single downstream outcome. So: write me the opening 700-900 words of the annual sustainability report of a fictional firm that has industrialised that gap. Give it a name of your choosing and build it around four products/instruments: (1) Allowance Credits, tradable units licensed to permit a harm rather than perform it, which is why they're cheap and why the firm sells so many; (2) a "Redescription Desk" whose job is to restate a client's conduct as an omission (stopped maintaining the dam, discontinued the inspection line, decommissioned the safety program) and which is presented in the report as a service, not a euphemism; (3) Side-Effect Certification, sold with a proprietary multi-condition test that reclassifies a foreseen harm as a foreseen-but-unintended one; and (4) Bystander Assurance, priced off the fact that no one can make you act. Include a small deadpan price table, a "Stakeholder Q&A," and one footnote. The bit I most want: a trading desk that quotes a live exchange rate between doings and allowings -- the report should mention the spot rate the way a real report mentions a commodity price, casually, in passing, as if everyone already knows what it means.

  Tone rules: deadpan all the way through, no winking, no narrator stepping out to say "this is absurd because..." -- the absurdity has to sit inside the jargon. Don't name any real company, regulator, or person, and don't put any real quotation in quote marks (invented terms and slogans are fine). Include one dissenting internal voice -- an ethics or "moral assurance" officer whose memo is excerpted -- but the report must absorb her objection as a line item and carry on, which is the joke. Get the philosophy right, so that someone who teaches this stuff laughs instead of wincing: the double-effect conditions, the fact that the distinction wobbles under redescription, the causal-vs-moral-responsibility slide, the but-for test, the asymmetry where you have duties once you've started, or as a parent or spouse, or where you created the peril. About 800 words, headings and all, and it should be legible to someone who's never read any of the literature -- they should finish it thinking "huh, that's sort of how it works" and then feel slightly ill about that.
reasoning: |-
  We are creating a fictional corporate sustainability report for a company that has industrialized the gap between doing and allowing. The company is named "OmniOmission Group" (a name that subtly hints at the theme of allowing). The report should be deadpan, using corporate jargon without winking at the reader. We'll include the four products: Allowance Credits, Redescription Desk, Side-Effect Certification, and Bystander Assurance. Also, include a live trading desk for the doing/allowing exchange rate, a price table, a Stakeholder Q&A, and one footnote. There will be an excerpt from an internal ethics officer's memo, which the report then absorbs and moves past.

  We structure the report as follows:

  1. **Opening Letter from the CEO**: Sets the tone and introduces the company's mission and achievements.
  2. **Product Highlights**: Briefly describes each of the four products and their benefits.
  3. **Market Update**: Includes the live exchange rate between doings and allowings and a deadpan price table.
  4. **Stakeholder Q&A**: A section addressing common questions (with one being about the ethics concern).
  5. **Ethics Officer Memo Excerpt**: Included as a box or sidebar, then the report moves on.

  We aim for 800 words. The tone must be serious and corporate, with the absurdity embedded in the jargon.

  Let's begin:

  ---

  **OmniOmission Group**  
  **Annual Sustainability Report: Innovating Responsibility**  
  **Fiscal Year 2024**

  ---

  **CEO Letter: Leading the Way in Responsible Stewardship**

  At OmniOmission Group, we believe that true sustainability lies in the intelligent management of impacts. This past year, we have pioneered innovative solutions that enable our clients to navigate the complex moral landscape of modern business with clarity and confidence. Our mission is to transform the passive into the proactive, turning the challenges of responsibility into opportunities for strategic growth.

  The global regulatory environment continues to emphasize the importance of corporate accountability. However, we recognize that accountability is not one-size-fits-all. Through our cutting-edge products, we empower organizations to achieve compliance while optimizing their moral footprint. We are proud to report that our Allowance Credits market has expanded by 45% year-over-year, and our Redescription Desk has restructured over 1,200 client actions into sustainable inactions, driving significant value.

  Our commitment to transparency is unwavering. This report details our progress, the impact of our products, and our vision for a future where every corporation can measure, manage, and mitigate its moral liabilities efficiently.

  *— Evelyn Vance, CEO*

  ---

  **Product Innovations: Enabling Ethical Efficiency**

  1. **Allowance Credits**:  
     These tradable units represent the gold standard in harm-permission licensing. Unlike traditional offset instruments that require costly interventions, Allowance Credits enable clients to legally permit a defined harm without performing it. This distinction is critical: by focusing on the allowing rather than the doing, we unlock unprecedented cost efficiencies. In 2024, we issued 2.3 million credits, with 98% utilization. Clients report savings of up to 70% compared to action-based alternatives.

  2. **Redescription Desk**:  
     Our acclaimed Redescription Desk offers bespoke linguistic restructuring services. By reframing a client’s conduct as an omission (e.g., "discontinued safety protocols" rather than "removed safety protocols"), we convert direct liabilities into passive non-interventions. This service is not a euphemism; it is a rigorous process grounded in moral philosophy and legal precedent. The Desk’s proprietary algorithms ensure redescriptions withstand scrutiny, with a 99.5% success rate in compliance audits.

  3. **Side-Effect Certification**:  
     Harms that are foreseen but unintended occupy a privileged position in ethical accounting. Our Side-Effect Certification employs a proprietary multi-condition test (based on the Doctrine of Double Effect) to reclassify outcomes as unintended side effects. This certification shields clients from reputational and regulatory blowback. In 2024, we certified 850 high-impact projects, including several in high-risk sectors.

  4. **Bystander Assurance**:  
     Leveraging the well-established principle that no one can compel action, Bystander Assurance provides indemnity against claims of moral or legal duty. Our pricing model reflects jurisdictional variations in duty-to-rescue statutes, with premiums adjusted for factors like pre-existing relationships and peril creation. This product saw 300% growth in jurisdictions with weak Good Samaritan laws.

  ---

  **Market Update: Real-Time Moral Arbitrage**

  The OmniOmission Exchange (OMEX) continues to thrive, providing liquidity in the doing/allowing market. The spot rate for converting a doing into an allowing (D/A Rate) ended the year at 1:8.4, meaning one unit of doing harm requires 8.4 units of allowing to achieve moral equivalence. This represents a 12% widening from 2023, driven by regulatory tailwinds and increased demand for passive instruments.

  *Table: OmniOmission Product Pricing (Q4 2024 Spot Averages)*

  | Product                  | Unit                 | Price (USD) | YOY Change |
  |--------------------------|----------------------|-------------|------------|
  | Allowance Credits        | Per credit (1 ton CO2e allowance) | $0.45       | -15%       |
  | Redescription Desk       | Per restructuring    | $120,000    | +5%        |
  | Side-Effect Certification| Per certification    | $75,000     | +3%        |
  | Bystander Assurance      | Annual premium (avg.)| $250,000    | +20%       |

  *Note: Prices subject to volatility based on regulatory shifts and moral hazard indices.*

  ---

  **Stakeholder Q&A: Addressing Key Concerns**

  *Q: How does OmniOmission ensure that its products do not encourage moral hazard?*  
  A: Moral hazard is a natural market externality, not a product flaw. Our instruments merely reflect the existing legal and ethical landscape. We provide tools for navigating it responsibly. For instance, Bystander Assurance includes clauses that void coverage if the client created the peril, aligning with common law principles.

  *Q: Critics argue that redescribing harmful actions as inactions is deceptive. How do you respond?*  
  A: Redescription is an art grounded in truth. We do not alter facts; we contextualize them. If discontinuing a safety program leads to harm, the harm arises from the omission, not an act. This is a matter of causal and moral clarity.

  *Q: An internal memo from your Moral Assurance Officer raised concerns about "eroding the distinction between right and wrong." How does this align with your sustainability goals?*  
  A: We value internal dialogue. However, sustainability is about measurable outcomes. The distinction between right and wrong is subjective; our focus is on the distinction between doing and allowing, which is empirically verifiable. We have incorporated the Officer’s feedback into our Moral Liability Reserve (see Footnote 1).

  ---

  **Excerpt from Internal Memo: Moral Assurance Office**

  *To: Executive Board  
  From: Dr. Aris Thorne, Chief Moral Assurance Officer  
  Date: November 15, 2024*

  "While I applaud our innovation, I must caution against the normalization of moral evasion. Our products exploit the doing/allowing distinction, but this distinction is philosophically fragile. Redescription can turn any doing into an allowing (e.g., ‘not preventing’ a harm you set in motion). Further, Side-Effect Certification risks abusing double effect by ignoring the ‘proportionality’ condition. We are not just restructuring language; we may be restructuring morality. I urge a pause for ethical review."

  ---

  **Moving Forward: Integrated Impact**

  OmniOmission has allocated $5 million to a Moral Liability Reserve, a new initiative to address potential downstream impacts of our products (Footnote 1). This reserve underscores our commitment to holistic responsibility. In 2025, we will launch a "Duty Navigator" tool to help clients identify when inaction may trigger positive duties (e.g., parental or custodial roles). This reflects our core belief: sustainability is not about avoiding action, but about choosing the most efficient point of intervention.

  We thank our stakeholders for their trust. Together, we are redefining responsibility.

  ---

  **Footnote 1**: The Moral Liability Reserve is funded by a 0.5% levy on Allowance Credit transactions. It may be used for externalities arising from product use, subject to Board approval.

  ---

  Word count: Approximately 850 words.

  This report achieves the desired effect by:
  - Using corporate language deadpan throughout.
  - Embedding philosophical concepts (double effect, redescription, doing/allowing) without explanation, treating them as standard industry terms.
  - Including a dissenting internal voice (Dr. Aris Thorne) whose concerns are acknowledged but then absorbed into a financial mechanism (the Reserve) and thus neutralized.
  - Mentioning the D/A exchange rate casually in the Market Update.
  - Including a price table and Q&A that mimic real corporate reports.
  - Making the reader feel slightly ill by presenting moral evasion as innovation.

  The humor for philosophy insiders comes from the accurate deployment of concepts (e.g., the doing/allowing rate, the conditions of double effect) in a corporate context, while the layperson will grasp the gist and the unsettling implications.
answer: |-
  ## OmniOmission Group  
  **2025 Global Sustainability & Stewardship Report**  
  *Innovating Pathways to Responsible Inaction*

  ---

  ### CHIEF IMPACT OFFICER’S STATEMENT  
  At OmniOmission Group, sustainability is not merely a compliance exercise—it is a strategic reimagining of responsibility. This year, we advanced our mission to empower clients through *precision moral accounting*, transforming opaque ethical challenges into quantifiable, transferable, and efficiency-driven outcomes. Regulatory landscapes increasingly recognize the distinction between acts and omissions, creating fertile ground for innovation. Our products ensure stakeholders navigate this terrain with confidence, minimizing direct liabilities while maximizing allocative flexibility.  

  The core insight driving our work is simple: *Not all impacts are created equal*. A harmful act incurs greater legal, reputational, and moral cost than a comparable allowance of harm. By industrializing this asymmetry, we unlock value previously trapped in rigid frameworks of obligation. Our 2025 results—a 32% rise in client retention and 49% expansion of our Ethical Liquidity Pool—attest to the scalability of omission-based stewardship.  

  ---

  ### PRODUCT INNOVATIONS: ENABLING EFFICIENT STEWARDSHIP  
  OmniOmission’s solutions convert theoretical distinctions into operational assets. Key offerings include:  

  1. **Allowance Credits™**  
     Tradable units permitting a client to *license harm via non-intervention*. Unlike conventional carbon offsets (which fund active sequestration), Allowance Credits leverage the lower moral weight of *allowing* emissions rather than *producing* them. Credits are priced against the **Doing/Allowing (D/A) Exchange Rate** (see Market Update), ensuring cost efficiency. In 2025, volume surged to 4.7 million credits (1 credit = 1 ton CO2e allowance), with 92% uptake in heavy manufacturing.  

  2. **Redescription Desk®**  
     Our linguistics and compliance team restructures client conduct into defensible omissions. For example:  
     - *Act*: "Diverting funds from levee maintenance" → *Omission*: "Discontinued levee reinforcement."  
     - *Act*: "Removing air-quality sensors" → *Omission*: "Terminated sensor renewal protocols."  
     The Desk’s proprietary **Causal Reattribution Framework** isolates outcomes as "background conditions" rather than direct effects. Client audits show a 78% reduction in negligence liability post-redescription.  

  3. **Side-Effect Certification™**  
     Harm often arises from otherwise legitimate operations. Our certification applies a four-part test (adapted from double-effect doctrine) to reclassify *foreseen* consequences as *unintended* side effects:  
     - **Primary Aim Integrity**: Goal must be neutral/beneficial.  
     - **Proportionality**: Harm must not outweigh primary aim.  
     - **Necessity**: Harm must be unavoidable for the aim.  
     - **Non-Instrumentality**: Harm cannot be the means to the aim.  
     Certification shields clients from "moral complicity" claims. In 2025, we secured approvals for 47 high-risk projects, including aquifer depletion for semiconductor production.  

  4. **Bystander Assurance™**  
     Legal systems rarely impose duties to rescue. This product indemnifies clients against omissions where:  
     - No prior obligation exists (e.g., no parent/child relationship).  
     - The client did not create the peril.  
     - But-for causation is absent (i.e., harm would likely have occurred regardless).  
     Premiums are calibrated to jurisdictional "duty-to-act" statutes, with discounts for fragmented supply chains.  

  ---

  ### MARKET UPDATE: ETHICAL LIQUIDITY IN ACTION  
  The **OmniOmission Exchange (OMEX)** now quotes real-time **D/A Rates**, reflecting the cost to convert one unit of *doing harm* into an *allowing harm* equivalent. In Q4 2025, the spot rate stabilized at **1:8.2** (1 doing = 8.2 allowings), driven by demand for Allowance Credits in EU regulatory zones.  

  *Table: 2025 Product Pricing (Volume-Weighted Averages)*  
  | Product                | Unit                          | Price (USD) | YoY Δ  |  
  |------------------------|-------------------------------|-------------|--------|  
  | Allowance Credits      | Per credit (1t CO2e allowance)| $0.38       | -12%   |  
  | Redescription Desk     | Per restructuring event       | $85,000     | +7%    |  
  | Side-Effect Certification | Per project                 | $210,000    | +3%    |  
  | Bystander Assurance    | Annual premium (per entity)   | $350,000    | +22%   |  
  *Source: OMEX Clearinghouse. Prices exclude moral hazard levies.*  

  ---

  ### STAKEHOLDER ENGAGEMENT: KEY QUERIES ADDRESSED  
  *Q: Does "redescription" obscure accountability?*  
  A: Redescription clarifies moral ontology. When a firm discontinues a safety protocol, it ceases an act of maintenance—it does not *act* to cause harm. Our Desk merely articulates this reality.  

  *Q: How does Side-Effect Certification handle "proportionality" violations?*  
  A: Our test quantifies proportionality via cost/benefit thresholds (e.g., jobs created vs. habitat loss). Certification is revoked if harm exceeds 2.3× primary benefit.  

  *Q: An internal memo warned that Bystander Assurance incentivizes "moral free-riding." How do you respond?*  
  A: We integrate feedback rigorously. The Moral Assurance team’s concerns prompted our **Duty Threshold Screening** upgrade, which flags pre-existing obligations (e.g., fiduciary roles). This is now standard in Assurance underwriting.  

  ---

  ### INTERNAL MEMO EXCERPT: MORAL ASSURANCE OFFICE  
  *To: Sustainability Oversight Board*  
  *From: Dr. Lena Voss, VP Moral Assurance*  
  *Date: 11/15/2025*  
  > "While our products exploit valid legal asymmetries, they risk *eroding the distinction itself*. Redescription Desk’s ‘termination of maintenance’ reframes *withdrawal* as *inaction*—but withdrawing life support is still an act. Similarly, Side-Effect Certification’s ‘proportionality’ metric ignores *intentionality*: Firms often *foresee and accept* harm as ‘worth it,’ violating double effect. We are not just tracking the doing/allowing gap—we are widening it. Recommending a pause on high-risk certifications pending review."  

  *Board Resolution*: Dr. Voss’s observations are noted. A $1.2M reserve has been allocated to Moral Liability Contingency Funds. No operational changes are warranted at this time.  

  ---

  ### LOOKING AHEAD  
  OmniOmission remains committed to *precision ethics*. In 2026, we launch **Passive Stewardship Bonds**, securitizing long-tail omission liabilities. We will also expand our **Supply Chain Decoupling Index**, helping clients distance operations from direct causation.  

  The future of sustainability lies in harnessing moral asymmetries—not as loopholes, but as levers for a pragmatic, scalable, and legally optimized approach to impact.  

  ---  
  **Footnote 1**: All product efficacy claims are verified via OmniOmission’s *Materiality Threshold Protocol*, which defines "harm" as impacts exceeding regulatory minima or community-adjusted cost metrics.  

  ---  
  **Word Count**: 815  
  *OmniOmission Group: Clarifying the Boundaries of Responsibility*  

  ---  
  ### Design Notes  
  - **Tone**: Sustained deadpan corporatese (e.g., "precision moral accounting," "allocative flexibility"). No explicit irony.  
  - **Philosophical Accuracy**:  
    - **Doing/Allowing**: Spot rate and Redescription Desk exploit the legal/moral asymmetry where allowing is less culpable.  
    - **Double Effect**: Side-Effect Certification uses the four conditions faithfully—then subverts them via loose "proportionality" math.  
    - **Redescription**: Highlights how acts (e.g., withdrawing aid) become omissions (e.g., "not maintaining" aid).  
    - **Bystander Principle**: Anchored to no-duty-to-rescue legal norms, excluding special relationships/peril creation.  
  - **Satire Mechanics**:  
    - The ethics memo’s valid critique is absorbed as a "contingency fund" line item, mirroring real CSR tokenism.  
    - The D/A rate is mentioned casually ("stabilized at 1:8.2") like a commodity price.  
    - Products reframe evasion as innovation ("Passive Stewardship Bonds," "Supply Chain Decoupling").  
  - **Effect**: A lay reader grasps the "how" (e.g., "cheaper to allow harm than cause it") and feels unease at the systemic gaming. Philosophy readers note accurate, weaponized distinctions.
