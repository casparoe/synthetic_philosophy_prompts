prompt: |-
  I'm recording an episode of our department's podcast with a visiting philosopher who has spent years defending a version of the moral equality of combatants that departs from the familiar Walzerian defence. Her line is that combatants on both sides are equally permitted to kill one another, but not because the justice of the war is irrelevant to them: she locates responsibility for a war's justice in the political leadership and responsibility for conduct in the military, and she holds that individual combatants are rarely in a position to assess the former. She also accepts that a combatant is liable to be killed only if he is responsible for an unjust threat. Draft eight interview questions, each with a follow-up keyed to the answer she is most likely to give. I want at least one question each on (a) whether the equality she defends is an equality of permission, of liability, or merely of excuse, and what turns on the difference; (b) what her division of responsibility implies for volunteers who enlist to fight a war they have reason to think is unjust, and for citizens of a democracy that voted for it; (c) whether the uncertainty that grounds the equality also loosens the constraints on conduct, since an unjust combatant who cannot know his cause is unjust likewise cannot know whether his targets are proportionate; and (d) what she takes to be the strongest consideration against her view. Skip anything that invites her simply to restate the position, and press her where the revisionist literature presses.
reasoning: |-
  Okay, the user is preparing a podcast interview with a philosopher who has a unique take on the moral equality of combatants. They need eight questions with follow-ups that dig into specific aspects of her theory, avoiding simple restatements and targeting key revisionist critiques. 

  First, I need to unpack her position: she defends equal permission to kill (unlike McMahan) based on epistemic limitations, while maintaining that liability requires actual unjust threat contribution. That’s a nuanced hybrid view—partly Walzerian in outcome but revisionist in foundations. 

  The user’s four required angles are crucial: (a) permission vs. liability distinction, (b) volunteer/democracy implications, (c) uncertainty spilling into proportionality, and (d) strongest objections. I should avoid softball questions; this is for an academic audience familiar with revisionist literature. 

  For (a), the core tension is how "permission" works if liability is asymmetric. Follow-up must press whether this collapses into excuse. For (b), the volunteer angle is obvious, but the democratic complicity angle is sharper—it attacks her leadership-responsibility firewall. For (c), proportionality uncertainty is a natural extension of her epistemology; the follow-up should force her to confront McMahan’s "unjust combatant as moral gambler" critique. For (d), I’ll pick the collective epistemology problem: if soldiers can’t know, why can leaders? 

  Other questions need to cover: how her view handles non-combatant liability (since she ties liability to threat contribution), whether "acting wrongly" without liability matters (Saba’s point), and how leaders’ responsibility translates to soldiers’ permissions. The follow-ups should cite specific critics—Lazar, McMahan, Frowe—to feel like a real debate. 

  User’s tone suggests they want rigorous pushback, not exposition. The "skip restatements" directive means every question must challenge or probe. I’ll end with the "knowable by whom?" dilemma—it traps her between excusing atrocities or admitting leaders can be culpably ignorant too.
answer: |-
  Here are eight interview questions with targeted follow-ups, pressing on the core tensions in her view while avoiding restatement:

  1. **Core Distinction & Implications**  
     *Question:* You argue combatants have equal *permission* to kill but asymmetric *liability* (only unjust combatants are truly liable). Doesn't this permission, grounded in epistemic limitation, function more as a widespread *excuse* against blame for objectively wrongful killing, rather than a genuine moral permission? What substantive moral difference remains between "excused wrongful killing" and "permitted action" in this context?  
     *Likely Answer/Focus:* She might emphasize the practical necessity of a normative guideline for agents acting under uncertainty, distinguishing it from retrospective excuse.  
     *Follow-Up:* If the permission shields agents from blame *because* they cannot know, doesn't that concede the core moral act (killing) *is* objectively wrong without liability? How is this different from saying "They shouldn't do it, but we can't blame them"? Doesn't this undermine the language of "permission"?

  2. **Volunteers in Potentially Unjust Wars**  
     *Question:* On your division of responsibility, what is the moral status of a combatant who *volunteers* to fight in a war they privately believe has significant unjust components? Are they still epistemically shielded, or does their voluntary enlistment with doubts incur a higher burden?  
     *Likely Answer/Focus:* She'll likely maintain the epistemic barrier shields even volunteers; assessing *ad bellum* justice is still beyond their competence.  
     *Follow-Up:* Revisionists like McMahan argue voluntariness *increases* culpability. If a volunteer suspects injustice but defers entirely to leadership, aren't they culpably outsourcing their moral judgment, making them potentially liable for contributing to an unjust threat they suspected? Doesn't voluntariness weaken the epistemic shield?

  3. **Democratic Citizens & Complicity**  
     *Question:* You locate *ad bellum* responsibility with political leaders. What about citizens in a democracy who vote for leaders explicitly promising an aggressive war later deemed unjust? Does democratic participation alter the assignment of responsibility or the epistemic position of combatants?  
     *Likely Answer/Focus:* She'll likely hold leaders bear primary operational responsibility; citizen voters lack specific military expertise/authority. Combatants' epistemic position unchanged.  
     *Follow-Up:* Doesn't democratic authorization make the citizenry, and thus potentially the combatants *as citizens*, complicit in the leadership's *ad bellum* choices? If combatants *know* their society democratically endorsed an unjust war aim, does that knowledge pierce their epistemic shield regarding the war's justice?

  4. **Uncertainty & Proportionality Constraints**  
     *Question:* You argue an unjust combatant cannot know their cause is unjust. Doesn't this same uncertainty radically undermine their ability to adhere to *in bello* proportionality? If they cannot assess the *ad bellum* justice, how can they possibly know the "military advantage" they pursue is "definite" or "concrete" enough to weigh against collateral damage, as proportionality requires?  
     *Likely Answer/Focus:* She might distinguish assessing macro-justice from assessing specific operational objectives/military advantages relevant to proportionality in a specific strike.  
     *Follow-Up:* But if the *overall war aim* is unjust (e.g., conquest), doesn't that infect *every* subordinate military advantage (e.g., capturing a bridge for the invasion) by making it an advantage towards an unjust end? Can the "definite advantage" in proportionality ever be truly isolated from the *ad bellum* context under your framework? Doesn't uncertainty about the latter logically extend to uncertainty about the value of the former?

  5. **Liability & Non-Combatant Functionaries**  
     *Question:* You state liability stems from responsibility for an unjust threat. What about non-combatant civilians who are highly responsible for sustaining the unjust war effort (e.g., key weapons designers, propagandists knowingly lying)? Are they also liable to defensive killing under your view?  
     *Likely Answer/Focus:* She'll likely say liability requires *directly* posing a lethal threat, not just contributing to the war effort generally.  
     *Follow-Up:* How do you reconcile this with your focus on *responsibility* rather than direct posing? If a propagandist's lies *directly* enable specific lethal attacks they know are unjust, haven't they assumed responsibility for those threats? Doesn't your rejection of their liability risk creating a "combatant-only" liability rule that lets crucial enablers off the hook?

  6. **Acting Wrongly vs. Liability**  
     *Question:* Granting that unjust combatants may be *permitted* to fight due to epistemic limits, you acknowledge they still *act wrongly* objectively. What concrete moral implications follow for the unjust combatant from this "objective wrongfulness" beyond potential liability? (e.g., duties of repair, moral taint, special obligations post-conflict?)  
     *Likely Answer/Focus:* She might downplay concrete implications due to the epistemic shield, focusing on the permission as the primary practical norm.  
     *Follow-Up:* If the objective wrongfulness carries *no* significant moral consequences for the unjust combatant (beyond potential liability during combat), doesn't this render the distinction between "permitted but objectively wrongful" practically vacuous? Doesn't Saba Bazargan's work on complicitous liability suggest this objective wrongfulness *should* generate significant moral burdens?

  7. **Leadership Culpability & Soldier Permissions**  
     *Question:* If political leaders bear responsibility for *ad bellum* injustice, how does *their* culpability translate into a *permission* for soldiers to kill? Does the leader's wrongful act somehow *generate* a permission for the soldier, or is the permission entirely separate, based solely on the soldier's epistemic state?  
     *Likely Answer/Focus:* She'll emphasize the permission is solely based on the soldier's epistemic limitations, not derived from the leader's actions.  
     *Follow-Up:* Doesn't this create a disconnect? The leader's culpability makes the threat unjust (creating liability), but the soldier's permission arises independently from ignorance. How can the leader's culpability *justify* the soldier's actions (by making the enemy liable) while simultaneously being irrelevant to the *soldier's* normative position? Isn't this tension problematic?

  8. **Strongest Objection & Epistemic Limits**  
     *Question:* Many see the "unknowability" of *ad bellum* justice as the Achilles' heel of your view. What do you consider the *strongest* objection to your claim that individual combatants are rarely, if ever, in a position to assess their war's justice?  
     *Likely Answer/Focus:* She'll likely cite complexity, propaganda, fog of war, lack of access to intelligence/policy deliberations, and the specialized nature of *jus ad bellum* judgments.  
     *Follow-Up:* Revisionists argue that core *ad bellum* principles (e.g., "Was we attacked?", "Is this clearly preventive?" "Are we seizing territory?") *are* often accessible. If a soldier *can* know their war lacks self-defense justification (e.g., invading a neutral state), doesn't your epistemic shield collapse for that case? And if it collapses sometimes, doesn't it undermine the *general* rule of moral equality? (Pressing the *knowable-by-whom?* challenge).

  **Key Pressing Points Covered:**
  *   **a)** Directly challenges the permission/liability/excuse distinction, pushing on whether her "permission" is functionally an excuse.
  *   **b)** Presses volunteers and democratic citizens, introducing culpability for willful ignorance/complicity.
  *   **c)** Extends her epistemic uncertainty to proportionality, highlighting a potential contradiction in applying *in bello* rules.
  *   **d)** Forces her to confront the core revisionist attack on epistemic limits and its fragility.
  *   **Also Presses:** Non-combatant liability, consequences of objective wrongfulness, leader/soldier normative disconnect, and the contingency of the epistemic shield.

  These questions avoid simple exposition and target the points where her hybrid view faces the most significant pressure from revisionist critiques and logical tensions within its own structure.
