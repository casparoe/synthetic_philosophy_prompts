prompt: |-
  I'm writing a feature on the quest for the historical Jesus, and specifically on whether the authenticity criteria the scholars use can ever really settle anything. So I want you to build me a test case. Invent a teacher and the small community that remembered him — first-century-ish Palestine flavor is fine, but made up, no real texts, no scholars, no gospel material, I dont want to be quoting anybody. Then give me one saying of his that the criteria split on. Requirements: the criterion of embarrassment has to come out saying the saying is authentic, because no community would invent something that awkward for itself; the criterion of dissimilarity has to come out saying it's inauthentic, because the saying sits comfortably in both the community's own theology and the wider religious scene around it; multiple attestation has to look like it backs authenticity; and coherence has to cut the other way, fitting the community's ethical line but clashing with everything else the teacher supposedly said. Crucially, the two criteria that point toward authenticity have to be knocked out by one and the same feature of the case, not two separate ones — and all the verdicts have to fall out of the criteria as they're normally stated, so don't just declare them. The evidence itself is agreed on by everyone in the story; the fight is only over what the criteria license. One paragraph for the scenario, keep it realistic.

  Then walk through each criterion's reasoning, tell me which single feature is doing the work, what happens if I remove it, and how a defender of the criteria would try to rescue them. And finish with a straight answer, dont hedge: can criteria like these ever settle who he was, or does the whole thing just rank guesses? JSON please: scenario, criterion_verdicts (an object with embarrassment, dissimilarity, multiple_attestation, coherence — one or two sentences each on what that criterion says and why), load_bearing_feature, if_you_remove_it, defenders_best_move, does_this_generalise_to_the_real_quest, verdict (your actual position, stated flatly), confidence_1_to_5.
reasoning: |-
  We are creating a fictional teacher and community in first-century Palestine. The teacher is named Elazar. He leads a small Jewish renewal movement that emphasizes inner purity and critique of Temple practices. The community continues after his death, developing his teachings.

  The key saying we are examining is: "The true altar is the contrite heart; sacrifice without repentance is but slaughter."

  Now, the scenario: Elazar taught this during a period when the Temple was still standing and central. His community, after the Temple's destruction, sees this saying as prophetic validation of their shift to prayer-based worship. However, the saying is awkward because it compares Temple sacrifice to slaughter, which could be seen as sacrilegious. The community preserves it because they revere Elazar, but they also have to explain it to outsiders who might accuse them of being anti-Temple.

  Multiple sources: We have two independent early texts from the community that record the saying (so multiple attestation). The saying coheres with the community's later ethical stance (inner purity) but clashes with other recorded sayings of Elazar that stress obedience to the Law, including sacrificial laws (so coherence criterion goes against it).

  Now, the criteria:

  1. Embarrassment: The saying is embarrassing because it could be seen as sacrilegious (comparing sacrifice to slaughter) and because after the Temple's destruction, the community is trying to avoid being labeled as having caused it by their anti-Temple stance. So they wouldn't invent it. Hence, embarrassment says authentic.

  2. Dissimilarity: The saying is not distinctive of Elazar because it fits both the community's later theology (which rejected Temple sacrifice) and the wider Jewish scene of the time (where some groups, like the Essenes, had critiques of the Temple). So it could have come from either. Hence, dissimilarity says inauthentic.

  3. Multiple attestation: Two independent sources from the community record the saying. Hence, multiple attestation says authentic.

  4. Coherence: The saying coheres with the community's ethical stance (inner purity) but it does not cohere with other sayings of Elazar that emphasize following the Law (including sacrifices). Hence, coherence says inauthentic because it clashes with the rest of his teachings.

  The load-bearing feature: The community's development over time — specifically, the destruction of the Temple and their shift in theology. This one feature explains both why embarrassment points to authenticity (because after the destruction, the saying is awkward) and why dissimilarity points to inauthenticity (because the saying fits both the community's later theology and the broader context of Jewish critique of the Temple).

  If we remove that feature (i.e., if the Temple had not been destroyed and the community had not shifted), then:
  - Embarrassment would not apply because without the shift, the saying might not be embarrassing (if the community still supported the Temple, they wouldn't preserve such a saying) or it might not exist at all.
  - Dissimilarity might not apply because without the community's later theology, the saying might be more distinctive to Elazar.

  Defender's best move: Argue that the criteria are tools to be used together, and that no single criterion is decisive. They might also refine the criteria: for dissimilarity, they might say that it should only rule out what is common to the community and the wider culture at the time of the teacher, not later developments. For embarrassment, they might say that it must be embarrassing at the time of the teacher, not later. But in our case, the saying was preserved because it became useful after the destruction, but at the time of Elazar, it might have been less embarrassing because he was critiquing the Temple anyway. However, the community at the time of Elazar was small and might have found it embarrassing even then because it was so stark.

  Does this generalize? Yes, because in the real quest, communities develop, and sayings can become useful in new contexts, which affects both embarrassment and dissimilarity.

  Verdict: Criteria like these cannot settle who the historical Jesus was; they only rank guesses. The criteria are too dependent on reconstructions of the community and context, which are themselves debated.

  Confidence: 4 (high but not absolute because there are ways to refine the criteria).

  Now, we structure as JSON.
