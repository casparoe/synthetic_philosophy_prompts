answer: |-
  ### Essay Question (20 marks, 60 minutes)  
  **"The Speculative Cognitive Science Unit (SCSU) proposes three research programmes for explaining consciousness:**

  > **(a)** Consciousness *just is* integrated information; demanding further mechanism commits a category error.  
  > **(b)** Consciousness emerges at a critical complexity threshold; decomposition beyond this threshold is impossible and unnecessary.  
  > **(c)** Cognition is ‘just’ neurons firing; intentional states (beliefs, desires) are useful fictions eliminable without explanatory loss.  

  **Critically evaluate these programmes using Dennett’s distinction between ‘cranes’ (stepwise mechanistic explanations) and ‘skyhooks’ (inexplicable explanatory stopgaps). In your analysis:**  
  - **Identify which programme(s) risk smuggling in a ‘skyhook’ despite appearing naturalistic, and explain why.**  
  - **Assess whether the crane/skyhook distinction meaningfully advances our understanding of reductionism beyond simply demanding ‘mechanisms’.**  
  *(Word limit: 600 words)*"  

  ---

  ### Model Answer (596 words)  
  The SCSU programmes illustrate how ostensibly naturalistic explanations can conceal skyhooks—explanatory stopgaps that halt inquiry by invoking unexplained capacities. Dennett’s crane/skyhook distinction exposes this by demanding *stepwise decompositions*, not just ontological parsimony. Here, I argue that (a) and (b) embed skyhooks despite rejecting supernaturalism, while (c) risks greedy reductionism. The crane/skyhook framework’s value lies in diagnosing *how* explanations fail, not just *that* they lack mechanisms.  

  **Programme (a)**: Claiming consciousness “just is” integrated information (e.g., IIT) appears naturalistic but functions as a skyhook. By declaring further inquiry a “category error,” it asserts an *explanatory primitive*: integration is positioned as intrinsically conscious, with no account of *why* or *how* specific informational structures generate subjective experience. This relabels the problem (consciousness = Φ) without reducing it to mechanisms. Like a skyhook, it demands we “stop asking” precisely where cranes—such as neural correlates of integration—are needed.  

  **Programme (b)**: Emergence at a “complexity threshold” initially seems crane-like, invoking self-organization. Yet by insisting decomposition is “impossible,” it covertly deploys a skyhook. Thresholds are not explanations but *promissory notes*: without specifying *which* lower-level interactions cross the threshold (e.g., feedback loops, phase transitions), “complexity” becomes a hand-wavy abstraction. True cranes (e.g., emergent properties in thermodynamics) explain thresholds mechanistically; (b) merely *invokes* emergence to avoid reduction.  

  **Programme (c)**: Eliminativism about intentionality (“just neurons”) avoids skyhooks by demanding granular mechanisms. However, it risks *greedy reductionism*: dismissing beliefs/desires as “fictions” ignores how these patterns *causally regulate behaviour* at higher organizational levels (e.g., predictive coding). While not a skyhook (it seeks mechanisms), it exemplifies Dennett’s critique: reductionism becomes “greedy” when it discards real patterns vital for prediction/explanation. Here, neurons alone may not efficiently explain *why* a system acts *as if* it has goals.  

  **The crane/skyhook distinction’s utility**: It advances beyond demanding “mechanisms” by targeting *explanatory strategy*. A skyhook isn’t defined by ontology (all SCSU programmes are naturalistic) but by *explanatory abdication*: (a) and (b) reject decomposition, while (c) embraces it clumsily. The distinction thus diagnoses *why* reductions fail: skyhooks *mystify* (a/b), while greedy reductionism *oversimplifies* (c). Its value is heuristic—flagging when we mistake labels for answers (a), vagueness for insight (b), or deletion for progress (c). Crucially, it is not merely “has a mechanism” but insists mechanisms must be *scaffolded*, not just asserted.  

  In sum, (a) and (b) are skyhooks camouflaged as naturalism; (c) is a crane flawed by greed. The distinction’s power lies in exposing *unearned* explanations—a tool for rigor, not dogma.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points, marks, and common errors:**  

  1. **Skyhooks are defined by *explanatory gaps*, not ontology** (4 marks)  
     - *Key insight*: Programmes can be naturalistic (rejecting supernatural skyhooks) yet still embed skyhooks by halting decomposition.  
     - *Common error*: Equating “naturalistic” with “crane-like” or misdefining skyhooks as solely supernatural.  

  2. **Programme (a) is a skyhook due to *explanatory circularity*** (4 marks)  
     - *Key insight*: “Consciousness just is integration” relabels the explanandum (consciousness) as the explanans (integration), offering no mechanism. The “category error” claim masks an unanalyzed primitive.  
     - *Common error*: Defending (a) as non-skyhook because it rejects dualism, or missing that relabelling ≠ reduction.  

  3. **Programme (b) is a skyhook via *emergentist hand-waving*** (4 marks)  
     - *Key insight*: Invoking a “complexity threshold” without specifying *how* lower-level interactions produce consciousness is skyhook-like; true emergence (e.g., convection cells) explains thresholds mechanistically.  
     - *Common error*: Confusing (b) with robust emergence (a crane) or accepting “decomposition impossible” as legitimate.  

  4. **Programme (c) risks *greedy reductionism* but is not a skyhook** (4 marks)  
     - *Key insight*: (c) seeks mechanisms (crane-like) but dismisses higher-level patterns (e.g., intentional states) that are causally indispensable, thus exemplifying *greed*. Contrast with skyhooks: (c) doesn’t mystify.  
     - *Common error*: Calling (c) a skyhook due to its eliminativism, or failing to distinguish greed from explanatory abdication.  

  5. **Crane/skyhook distinction *adds value* by diagnosing *how* explanations fail** (4 marks)  
     - *Key insight*: The framework’s crux is distinguishing *unearned explanations* (skyhooks: mystification via circularity/vagueness) from *flawed but earnest reductions* (greed). It advances beyond “needs mechanisms” by critiquing *explanatory strategy*.  
     - *Common error*: Reducing the distinction to “mechanism vs. no mechanism” or dismissing it as a superficial label.  

  ---

  ### Taxonomy Adjustment Note  
  The three programmes cleanly separate:  
  - **(a)** Skyhook (explanatory circularity: “integration” as primitive).  
  - **(b)** Skyhook (explanatory vagueness: “complexity” as primitive).  
  - **(c)** Crane with greed (mechanistic but oversimplifies).  
  No collapse or redundancy—each illustrates a distinct failure mode. The “sneaky skyhook” in (a) is preserved: its naturalism is ontological, but its *explanation* is skyhook-like. The crane/skyhook criterion is stressed by forcing candidates to judge *explanatory moves*, not just ontologies.
