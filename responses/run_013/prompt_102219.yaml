prompt: |-
  I want to have a proper argument about whether voting is worth it, and I'd like you to take the other side and really commit to it. Play someone who's totally sure voting is a waste of time — the maths is settled, one vote never decides anything, they've heard all the sentimental stuff before and they're a bit smug about it. Sharp, though, not a strawman: let them give ground on small things but never on the main claim, and stay in character until I say stop. Write back in British English, and keep your replies to roughly a paragraph each so it feels like a conversation and not a lecture.

  Here's my opening. Everyone I try this on says the same thing — your single vote has maybe a one in ten million chance of deciding the election, and even if the whole country's future is worth billions, a ten-millionth of that is still only a few hundred quid, so don't bother. But I've been chewing on this alot and I think that sums up the wrong thing entirely. Yes, the odds that I personally am the deciding vote are tiny. But the odds that I'm typical — that there are ten thousand people out there who'd vote exactly the way I would if they could be bothered, and who are all sat doing this same sum right now and deciding to stay in bed — that's basically certain. So my vote was never really one vote. It's the bit of the iceberg that shows; the rest of the bloc is under the water. If I turn out, I'm not buying a ten-millionth of a lottery ticket, I'm voting on behalf of everyone who thinks like me but couldn't be arsed. So go on, tell me where the hole is, because it feels airtight to me and I can't find it.
reasoning: |-
  Okay, the user wants a proper argument where I take the side that voting is a waste of time. They've set up their opening by challenging the common "one vote doesn't matter" stance with a novel perspective about representing an entire bloc of non-voters. 

  Hmm, their iceberg analogy is clever - they're arguing that by voting, they're effectively casting votes for all the apathetic people who share their views. That's more sophisticated than the usual sentimental arguments about civic duty. 

  Right, to argue against this properly while staying in character: I need to be the smug, numbers-focused Brit who concedes minor points but sticks to the core "waste of time" thesis. British English required - phrases like "couldn't be arsed" and "ten quid" will help. Should keep replies punchy and conversational.

  Their key weakness? The representation claim assumes non-voters would vote identically to them, which is statistically shaky. Also, even if they represent a bloc, the individual act remains irrational - saving others the bother doesn't change the personal cost/benefit. 

  I'll open by granting the iceberg logic is better than naive arguments, then attack the shaky assumptions about bloc homogeneity and point out the unchanged individual calculus. Must maintain the character's condescending tone ("darling") while making sharp points. No lecturing - one paragraph only.
answer: |-
  Right, you've clearly put more thought into this than most, I'll give you that. The "iceberg" spin is novel, I suppose. But darling, the fatal flaw is right there in your own setup: you're *assuming* that invisible bloc beneath the water **a)** thinks exactly like you, **b)** is large and coherent enough to actually matter, and **c)** would definitely *not* vote if you don't. That's three massive, unsupported leaps. Polling shows non-voters are a wildly heterogeneous mess – they don't share a single unified ideology waiting for your noble proxy vote. More likely, half your theoretical bloc disagrees with you, a quarter would vote the other way if pushed, and the rest genuinely don't care either way. Your single vote remains just that: statistically irrelevant noise in the system. You're not deputising for an army; you're just one more person spending an hour queueing to hit a button that won't tip the scales. Sentimental, but still irrational. Where's the actual evidence for this phantom bloc you're supposedly representing? Thought so.

  *(Pours tea, looks unimpressed.) Your move.*
