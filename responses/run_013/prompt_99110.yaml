prompt: |-
  im a video editor by trade, no philosophy background, but i keep thinking about time and change. i heard about two views: one says a thing is wholly present at every moment it exists, the other says a thing is really a bunch of momentary slices or stages stuck together, and what we call the thing is the whole series. i want you to take that whole debate and restate it as faithfully as you can in the vocabulary i actually use -- timelines, source clips, in and out points, frames, keyframes, proxies, non-destructive edits, render, playback, the difference between the media file and the edit. i know my editing software inside out, so dont dumb it down. do it view by view, not as a vibe. for each one tell me what maps cleanly, what you had to fudge or distort to make it fit, and what has no counterpart in editing at all. then the important part: the residue report. is the leftover stuff just philosophers being fussy, or is it something editing vocabulary genuinely cant say? and does the translation change which view looks better -- like does one of them turn out to be obviously right once you put it in editing terms, or does the hard part survive translation and stay hard? no reading list please, i wont know the names anyway.
