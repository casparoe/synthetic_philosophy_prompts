  We are given an argument that randomizing is never rational and we need to find the flaw. The argument consists of several steps. Let's break it down and see where it goes wrong.

  The key points:

  (1) We are choosing between pure options and mixtures.
  (2) For a fixed action of the opponent, the payoff of a mixed strategy is the weighted average of the payoffs of the pure strategies in the mix.
  (3) An average cannot be greater than the maximum value in the set being averaged.
  (4) Therefore, for any fixed opponent action, at least one pure strategy in the support of the mixture does at least as well as the mixture.
  (5) So a mixture is never better than the best pure strategy in its support (in terms of the payoff against a fixed opponent action).
  (6) Now, if a mixture is supposed to strictly dominate a pure strategy (i.e., the mixture gives a strictly higher payoff than that pure strategy no matter what the opponent does), then because the mixture is an average, one of the pure strategies in the mixture must already strictly dominate that same pure strategy. Therefore, nothing is dominated only by a mixture.
  (7) Hence, in iterated elimination, allowing mixtures to eliminate pure strategies is a mistake because it might eliminate a strategy that is not dominated by any pure strategy (but only by a mixture).
  (8) In general, a rational player never needs to mix because for any fixed opponent strategy, there is a pure strategy that is at least as good.

  However, we know that (8) is false because in some games (like matching pennies) the only way to avoid being exploited is to mix.

  The flaw in the argument comes in step (6) and (7). Specifically, the argument in step (6) assumes that if a mixture strictly dominates a pure strategy, then one of the pure strategies in the mixture must also strictly dominate it. But this is not necessarily true.

  Let's consider the example provided:

          L    R
    T     3    0
    M     0    3
    B     1    1

  We want to see if the mixture of T and M (50-50) strictly dominates B.

  Against L:
  - T: 3, M: 0, B: 1, mixture: 0.5*3 + 0.5*0 = 1.5 > 1.

  Against R:
  - T: 0, M: 3, B: 1, mixture: 0.5*0 + 0.5*3 = 1.5 > 1.

  So the mixture (T,M) with 50-50 strictly dominates B (because 1.5>1 in both cases). 

  Now, does any pure strategy (T or M) strictly dominate B?
  - T: against L, T gets 3 > 1 (good), but against R, T gets 0 < 1? Actually, 0 is less than 1, so T does not beat B in R. Similarly, M: against L, M gets 0 < 1, and against R, M gets 3>1. So T does not dominate B (because of R), and M does not dominate B (because of L). 

  Therefore, B is strictly dominated by the mixture but not by any pure strategy. This is a counterexample to step (6) of the argument.

  What went wrong in step (6)? The argument says: "Since the mix is just an average of its ingredients, and an average can't beat its best term, one of those ingredients must already be beating that pure option no matter what the other player does."

  But note: the mixture is an average, and the average can be higher than every pure strategy in the mixture for a particular opponent action? Actually, no: for a fixed opponent action, the mixture's payoff is the average of the payoffs of the pure strategies. Therefore, for that fixed opponent action, the mixture's payoff is at most the maximum payoff among the pure strategies in the mixture. However, the critical point is that the same pure strategy might not be the best for every opponent action.

  In the example, against L, T is the best (gives 3) and against R, M is the best (gives 3). The mixture gives 1.5 in both, which is less than 3 in each case. But note that when we say the mixture strictly dominates B, we are comparing the mixture to B in each column (i.e., for each fixed opponent action). The mixture does better than B in both columns. However, no single pure strategy does better than B in both columns.

  The flaw in step (6) is that it requires a single pure strategy that beats the dominated strategy (B) in every opponent action. But the mixture can achieve this by using different pure strategies for different opponent actions (without knowing the opponent's action) because the mixture is fixed in advance.

  In other words, the mixture allows us to get a high payoff in every contingency by having a diversified portfolio. No single pure strategy might be able to do that.

  Now, what about step (7)? The argument says that if we allow mixtures to eliminate strategies, we might eliminate a strategy that is not dominated by any pure strategy. That is true, but that doesn't mean it is a mistake. In fact, in game theory, we do consider mixed strategies in the process of iterated elimination, but note that the standard iterated elimination of strictly dominated strategies (IESDS) is often defined for pure strategies only. However, if we extend the elimination to allow domination by mixed strategies, then we can eliminate more strategies. 

  In the example, if we do not allow mixed strategies to dominate, then B is not dominated by any pure strategy and we cannot eliminate it. But if we allow mixed strategies, then we can eliminate B because it is dominated by the 50-50 mixture of T and M.

  Moreover, in the standard theory, the order of elimination does not matter when we eliminate strictly dominated strategies (whether by pure or mixed). However, note that when we allow mixed strategies, the set of strategies that are strictly dominated might be larger, and the elimination process might remove more strategies. But the order of elimination still does not matter for the final set of strategies that survive, because if a strategy is strictly dominated (by any strategy, pure or mixed) then it will be eliminated in any order.

  But note: the standard result that order does not matter for strict dominance holds when we consider domination by mixed strategies. So we can safely allow mixtures to eliminate strategies.

  Finally, step (8): the claim that a rational player never needs to mix. This is false because in some games (like zero-sum games) the only way to guarantee an equilibrium payoff is to mix. In matching pennies, if you play pure, then if the opponent knows your move, they can beat you. But if you mix 50-50, then regardless of what the opponent does, you break even and they cannot exploit you.

  The flaw in the overall argument is that it ignores the strategic uncertainty. The opponent is also a rational player who is trying to maximize their own payoff. Therefore, you cannot fix the opponent's strategy arbitrarily. Instead, in equilibrium, both players choose strategies that are best responses to each other.

  In the example of matching pennies, if you play pure, the opponent can choose a move that beats you. But if you mix, you make the opponent indifferent and thus you don't give them an incentive to choose one move over the other. Therefore, mixing is essential to avoid being exploited.

  To summarize:

  - Step (1) to (5) are correct: for a fixed opponent action, the mixture does not give a higher payoff than the best pure strategy for that particular action. However, note that the best pure strategy might depend on the opponent's action, and you don't know the opponent's action.

  - Step (6) is incorrect: a mixture can strictly dominate a pure strategy even if no single pure strategy in the mixture does, because the mixture can be better than the dominated strategy in every contingency by combining the strengths of different pure strategies.

  - Step (7) is also incorrect: allowing mixtures to do the elimination is standard and does not lead to a mistake. In fact, it refines the set of strategies appropriately.

  - Step (8) is false: there are games where the only rational choice (in the sense of being unexploitable) is to mix.

  Therefore, the hole in the argument is in step (6). The friend's argument fails to account for the fact that a mixed strategy can strictly dominate a pure strategy by providing a higher payoff against every possible opponent action, even if no single pure strategy in the mixture does so.

  As for the example you built: it is indeed a counterexample to step (6). You do not have to worry about the other player mixing in this context because we are considering strict domination: we require the dominating strategy (the mixture) to yield a strictly higher payoff for every pure action of the opponent (L and R). The example shows that the mixture of T and M strictly dominates B. And it is correct because we are only requiring domination against the pure actions of the opponent. However, note that if the opponent were allowed to mix, then we would have to check every mixed strategy of the opponent? Actually, in the definition of strict domination, we require the dominating strategy to yield a strictly higher payoff for every strategy (pure or mixed) of the opponents? 

  Wait, let's clarify: in the definition of strict domination by a mixed strategy, we require that the mixed strategy gives a strictly higher expected payoff than the dominated strategy for every possible pure strategy of the opponents. Why? Because the opponents' pure strategies form a basis: if the mixture does better against every pure opponent strategy, then by linearity it will do better against any mixed strategy of the opponent (because the payoff is linear in the opponent's mix). Therefore, in the example, since the mixture does better against L and against R (which are the only pure strategies), it will do better against any mixed strategy of the opponent. So the example is valid.

  Therefore, your example is a correct counterexample to step (6).

  To answer your other questions:

  - The order of elimination when allowing mixtures: it does not matter. The set of strategies that survive iterated elimination of strictly dominated strategies (by pure or mixed) is well-defined and order-independent.

  - About games where the only unexploitable choice is a mix: in such games, the rational player must mix. In the matching pennies example, if you play pure, then if the opponent knows (or guesses) your move, they can beat you. But if you mix appropriately, you make yourself unexploitable.

  So, to conclude: the flaw is in step (6). The friend's argument incorrectly assumes that if a mixture strictly dominates a pure strategy, then one of the pure strategies in the mixture must also strictly dominate it. Your example shows that this is not true.
answer: |-
  The flaw in your friend's argument lies in step (6), specifically in the claim that if a mixture strictly dominates a pure strategy, then one of its pure ingredients must also dominate that strategy. This is false, as demonstrated by your example. Below, I break down the reasoning, pinpoint the error, and address your follow-up questions.

  ### Step-by-Step Breakdown of the Error
  1. **Steps (1)–(5) are correct**:  
     - For a fixed opponent action, a mixed strategy's payoff is indeed the weighted average of the payoffs of its pure strategies (step 2).  
     - An average cannot exceed the best component in the mix for that specific opponent action (step 3).  
     - Thus, against any fixed opponent action, at least one pure strategy in the mix performs at least as well as the mix itself (step 4).  
     - This implies a mixture is never strictly better than its best pure ingredient against a **fixed** opponent action (step 5).  

  2. **Step (6) is where the argument fails**:  
     - Your friend claims: If a mixture strictly dominates a pure strategy (i.e., beats it against every possible opponent action), then one of the pure strategies in the mixture must also dominate it across all actions.  
     - **Counterexample**: Your game matrix:  
       ```
             L    R
       T     3    0
       M     0    3
       B     1    1
       ```  
       - The 50-50 mix of T and M yields 1.5 against L and 1.5 against R.  
       - This strictly dominates B (which gets 1 against both L and R).  
       - Yet, no pure strategy dominates B:  
         - T gets 3 > 1 against L, but 0 < 1 against R.  
         - M gets 0 < 1 against L, but 3 > 1 against R.  
       - **Why step (6) is wrong**: The mixture "hedges" by combining T (strong against L) and M (strong against R). No single pure strategy is strong against both actions, but the mix leverages the strengths of both across different scenarios. The average may not beat the best ingredient *for a single opponent action*, but it can beat a dominated strategy (B) *across all actions* by being robust to uncertainty.

  3. **Step (7) and (8) are invalid**:  
     - Since step (6) is incorrect, step (7) (that mixtures shouldn't eliminate strategies in iterated elimination) is unsupported.  
     - Step (8) (that mixing is never necessary) is empirically false, as in games like matching pennies, only a mixed strategy avoids exploitation.

  ### Why the Error Looks Persuasive
  - **Misapplication of averaging logic**: Steps (1)–(5) focus on **per-action comparisons** (fixed opponent action). Step (6) incorrectly extends this to **all-action comparisons**. While a mix can't beat its best ingredient *for a single action*, it can outperform a weak strategy *across all actions* by maintaining a higher floor.  
  - **Overlooking strategic uncertainty**: The argument assumes you can evaluate payoffs against fixed opponent actions in isolation. But in games, the opponent chooses strategically. A mix ensures you don't "put all your eggs in one basket," making you less exploitable.

  ### Addressing Your Example
  - **Your counterexample is valid**: B is strictly dominated by the 50-50 mix of T and M.  
  - **No need to worry about the opponent mixing**: Strict domination requires outperforming the dominated strategy against **every pure strategy of the opponent** (here, L and R). If a mix beats a strategy against all pure opponent actions, linearity of payoffs guarantees it also wins against any mixed strategy. Your example refutes step (6) conclusively.

  ### Implications for Iterated Elimination
  - **Allow mixtures in elimination**:  
    - If you let mixed strategies eliminate pure ones, more strategies can be removed (e.g., B in your game).  
    - **Order of elimination still doesn't matter**: Iterated elimination of strictly dominated strategies (by pure or mixed strategies) is order-independent for strict dominance. The final set of surviving strategies is unchanged regardless of elimination sequence.  
  - **Unexploitable mixed strategies**: In games like matching pennies, the only unexploitable strategy is a mix. Iterated elimination (including mixtures) will preserve such mixed strategies, while pure strategies are eliminated if dominated (e.g., in pennies, pure heads/tails are dominated by a 50-50 mix).

  ### Why Mixing is Sometimes Rational
  - **Nash equilibrium**: In many games (e.g., zero-sum games), only mixed strategies form equilibria where no player can deviate to gain an advantage.  
  - **Hedging against uncertainty**: When opponents are rational, pure strategies can be exploited. Mixing makes you unpredictable, denying the opponent a clear best response (e.g., in rock-paper-scissors, 1/3 mix is unexploitable).

  ### Final Clarification
  You can keep steps (1)–(3) (they hold for per-action comparisons) but must reject step (6). The core insight:  
  > **A mixture can't outperform its best component against a *known* opponent action, but it can outperform inferior strategies across *all possible* opponent actions by diversifying risk.**

  This resolves the tension—your friend’s argument conflates these two distinct comparisons, leading to the false conclusion that mixing is irrational.
