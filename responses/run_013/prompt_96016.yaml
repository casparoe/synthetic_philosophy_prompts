prompt: |-
  I am a third-year student taking a metaphysics course on the problem of universals, and I also work in programming languages: I am reasonably at home with type systems, parametric polymorphism, structural versus nominal typing, subtyping, and the type/token distinction. My study group tried to restate the standard positions in the universals debate -- Platonic realism, immanent realism, class nominalism, resemblance nominalism, and trope theory -- in the vocabulary of type theory, and we got stuck. Our best attempt was to equate Platonic realism with types that exist independently of any program that instantiates them, class nominalism with a type being nothing over and above its inhabitants, and resemblance nominalism with structural typing, leaving the other two rows blank. Please carry out the translation systematically, one position at a time, and keep it honest: do not let the target vocabulary silently settle the question in advance. For each position, tell me what carries over cleanly, what survives only with distortion, and what has no counterpart at all -- and then give me the residue report. Which parts of the debate (the explanatory demand that universals make particulars what they are, the requirement that a universal be wholly present in each of its instances, grounding, resemblance as a non-type-theoretic relation) are simply unsayable in type theory, and is that residue a defect of the type-theoretic framework or evidence that the original dispute was less clear than it looked? Relatedly, is the stratified hierarchy of types in type theory any kind of counterpart to the regress worries that push people away from realism, or is that only a coincidence of notation? I would rather have the honest residue than a tidy table.
reasoning: |-
  Okay, let me approach this systematically. The user is clearly highly knowledgeable - a third-year metaphysics student with programming language expertise who's already attempted mapping universals to type theory with their study group. They've identified specific sticking points and want an honest translation that doesn't gloss over the hard parts.

  First, I need to recall the core positions in the universals debate:
  - Platonic realism: Universals exist independently of particulars
  - Aristotelian realism: Universals exist only in their instances
  - Class nominalism: Universals are just sets of particulars
  - Resemblance nominalism: Universals reduce to resemblance relations
  - Trope theory: Only particular properties exist

  The user's existing mappings show good insight - equating Platonic realism with standalone types is sensible, class nominalism with types-as-collections works, and structural typing does capture some aspects of resemblance nominalism. But the gaps in their table reveal where the analogies break.

  For each position, I'll need to:
  1. Find the closest type-theoretic equivalent
  2. Identify where the mapping distorts the original
  3. Note what simply doesn't translate

  The tricky parts will be:
  - The "wholly present" requirement in realism (types don't have spatial presence)
  - Grounding explanations (type theory lacks metaphysical dependence)
  - Resemblance as primitive (structural typing is definitional, not relational)
  - The regress problem (type hierarchies are formal, not ontological)

  The user specifically wants the "residue" - what gets lost in translation. That's crucial. For instance, when we map Aristotelian realism to type classes, we lose the idea that universals inhere in substances. And trope theory's particularized properties have no direct correlate since all type instances share identical structure.

  The regress question is particularly interesting. While type hierarchies might resemble Bradley's regress visually, they're accepted as consistent formal systems rather than seen as vicious infinite chains. That difference might reveal something about how metaphysics and formal systems handle foundational issues differently.

  I should also consider whether the untranslatable elements point to limitations in type theory or to potential confusions in the metaphysical debate itself. For example, type theory's lack of grounding relations might actually help expose where metaphysical explanations become circular or vacuous.

