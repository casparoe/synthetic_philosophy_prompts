answer: |-
  Your interdisciplinary approach is insightful—and the difficulties you encountered reveal genuine conceptual fault lines. Below is a systematic translation of each position, followed by an analysis of the residue. I'll adhere strictly to your constraints: no silent settling of debates, explicit distortion reporting, and a focus on what *cannot* be said in type theory.

  ---

  ### **1. Platonic Realism**  
  **Core Claim:** Universals (e.g., *Redness*) exist independently of particulars, in a "realm of forms."  
  **Type-Theoretic Mapping:**  
  - **Clean Carryover:** Types as abstract, eternal entities (e.g., `Color` in a language's standard library) that exist whether or not any object instantiates them. The type `Int` exists independently of any integer variable.  
  - **Distortion:**  
    - *Independence ≠ Transcendence:* Types in most systems are still *defined* within a language (e.g., via ADTs or interfaces), whereas Platonic forms are causally/metaphysically prior to physical reality.  
    - No counterpart to the *participation* relation (how particulars "imitate" forms). Type instantiation (`x: Int`) is syntactic, not metaphysical.  
  - **No Counterpart:**  
    - The form's *causal role* in making particulars what they are (e.g., `Red` causing an apple to be red). Types constrain but don't *cause* behavior.  
    - The hierarchical structure of forms (e.g., the Form of the Good "above" other forms). Type hierarchies are pragmatic, not ontological.  

  ---

  ### **2. Aristotelian (Immanent) Realism**  
  **Core Claim:** Universals exist *in* particulars (e.g., *Redness* is wholly present in each red apple).  
  **Type-Theoretic Mapping:**  
  - **Clean Carryover:** Types as interfaces/traits that must be implemented by instances (e.g., `Runnable` in Java). The universal is "in" the token via implementation.  
  - **Distortion:**  
    - *Wholly present* → *Shared structure:* A type like `Comparable` is "in" each instance via shared methods, but this is structural sharing (bytecode), not a universal *substance*.  
    - No distinction between *essential* vs. *accidental* properties. Types don't encode ontological essence (e.g., `Human` vs. `Tall`).  
  - **No Counterpart:**  
    - The idea that universals *ground* the being of particulars. Implementing `Serializable` doesn't make an object exist—it enables functionality.  
    - The potential/actual distinction (e.g., an acorn's "oakness" as unrealized potential). Types are static.  

  ---

  ### **3. Class Nominalism**  
  **Core Claim:** Universals are just sets of particulars (e.g., *Redness* = the set of all red things).  
  **Type-Theoretic Mapping:**  
  - **Clean Carryover:** Types as sets/extensional collections (e.g., `type RedThings = Apple | FireTruck | ...`). Subtyping `(RedThings <: ColoredObject)` mirrors set inclusion.  
  - **Distortion:**  
    - Most type systems are *intensional* (types defined by properties, not members). Nominal typing (`class Dog`) feels set-like, but structural typing (`{ bark: () -> String }`) resists pure extensionality.  
  - **No Counterpart:**  
    - Class nominalism's *conventionalism* (sets are human-made). Types in PLs often reflect objective constraints (e.g., `3 + "a"` is invalid, not conventional).  
    - No account of *resemblance* between set members—it's brute membership.  

  ---

  ### **4. Resemblance Nominalism**  
  **Core Claim:** Particulars resemble each other, and "universals" are just resemblance clusters.  
  **Type-Theoretic Mapping:**  
  - **Clean Carryover:** Structural typing (e.g., TypeScript's `{ x: number, y: number }` for "Point-like" objects). Resemblance ≈ structural compatibility.  
  - **Distortion:**  
    - Resemblance is *primitive and external* in metaphysics; structural typing is *defined by internal signatures*.  
    - Resemblance nominalism admits degrees (A resembles B more than C); structural typing is binary (matches or doesn't).  
  - **No Counterpart:**  
    - The *non-transitivity* of resemblance (A resembles B, B resembles C, but A does not resemble C). Structural typing is transitive.  
    - Avoiding a resemblance regress (do resemblances themselves resemble?). Structural typing has no such worry.  

  ---

  ### **5. Trope Theory**  
  **Core Claim:** Only particular property-instances exist (e.g., *this-apple's-redness*), not universals.  
  **Type-Theoretic Mapping:**  
  - **Clean Carryover:** Objects as bundles of unique traits (e.g., `apple_123: { color: "red", ... }`). No shared `Red` type—only token properties.  
  - **Distortion:**  
    - Tropes are *concrete particulars*, but in PLs, `apple_123.color` is still an instance of a primitive type (e.g., `String`).  
    - Trope "bundling" is metaphysically primitive; objects in PLs are assembled via constructors/types.  
  - **No Counterpart:**  
    - *Compresence* (how tropes cohere into objects). Type systems assume object unity.  
    - Resemblance between tropes (e.g., *this-apple's-redness* resembles *that-firetruck's-redness*). Type theory would reintroduce a type `RedTrope`.  

  ---

  ### **The Residue Report: What Type Theory Cannot Say**  
  1. **Grounding & Causation:**  
     - The demand that universals *make particulars what they are* (e.g., `Red` causing redness) has no counterpart. Types constrain but don't ontologically ground tokens.  
     - **Is this a defect?** Yes—type theory lacks modal/metaphysical depth. But it also exposes a potential vagueness in metaphysics: "making what it is" is often undefined.  

  2. **Wholly Present Universal:**  
     - The idea that a universal is *fully present* in each instance is unsayable. A type isn't "in" an object; the object satisfies constraints.  
     - **Is this a defect?** No—this may reveal the "wholly present" criterion as a misleading spatial metaphor.  

  3. **Resemblance as Primitive:**  
     - Type theory reduces resemblance to structure-sharing. Metaphysical resemblance is brute and external.  
     - **Is this a defect?** Unclear. Structural typing works pragmatically, but nominalists might argue it smuggles in universals.  

  4. **Regress Worries:**  
     - **Bradley's Regress** (If a universal inheres via a relation, what relates the relation to the particular?) has no parallel. Type hierarchies (e.g., `Type → Kind → Sort`) avoid regress by fiat—they're defined foundations.  
     - **Is the hierarchy a counterpart?** Only notationally. The regress is "solved" by stipulation in type theory, whereas realism's regress is metaphysical.  

  ---

  ### **Conclusion: What the Residue Reveals**  
  - **Type theory's strengths:** Clarifies structural vs. nominal commitments, exposes extensional/intensional tensions, and dissolves pseudo-problems (e.g., resemblance regress) through formalism.  
  - **Metaphysics' irreducible core:** Grounding, causation, and the "presence" of universals resist formalization. This isn't a defect of type theory but evidence that metaphysics addresses questions *beyond* formal patterns—questions about fundamentality.  
  - **Your regress intuition is astute:** Type hierarchies *coincidentally* resemble metaphysical hierarchies but "solve" regress by architectural decree. This highlights that realism's regress worries stem from *ontological dependence*, a concept absent in PLs.  

  **Recommendation:** Use type theory to *reframe* the debate (e.g., "Is a universal an interface or a class?"), but treat the residue as markers for genuinely distinct metaphysical commitments. The untranslatable elements aren't flaws—they're the frontier where philosophy exceeds formalization.
