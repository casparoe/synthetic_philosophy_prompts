prompt: |-
  I'm prepping a grad seminar on confirmation and I keep getting dragged into the old-evidence mess -- the fact that a hypothesis which deductively entails something we've known forever (my go-to example is general relativity and the anomalous precession of Mercury's perihelion) really does seem, intuitively, to be strongly confirmed by it, even though a strict Bayesian can't let already-known evidence raise anything. Before we wade into the various fixes, I want a proper spec first: what does any adequate account of evidential support have to deliver if it's going to solve this?

  So give me the desiderata. For each one: the requirement itself, the case or consideration that motivates it, and whether you think it's non-negotiable or just something one camp happens to want. Three things I especially want you to take a stand on: (1) whether the account has to handle the mirror-image problem -- old evidence with a new theory versus new evidence with an old theory -- with a case for each direction; (2) whether it must distinguish a theory that was built to fit the old datum from one that predicted it in advance, and whether that's a genuine desideratum or just a use-novelty prejudice dressed up as one; and (3) whether any of your requirements can't be jointly satisfied, and if so which pair and why that's the interesting part.

  Don't bother scoring the existing proposals, I'll do that in class. Format it as a table with columns: requirement / motivating case / non-negotiable or camp-specific / what it rules out. Then two or three sentences underneath on the jointly-unsatisfiable pair, if there is one.
reasoning: |-
  Okay, the user is preparing a grad seminar on confirmation theory and specifically grappling with the old evidence problem. They want a clear set of desiderata for any solution, formatted as a table with specific columns. They also want me to take stands on three contentious points: mirror-image cases, use-novelty, and potential conflicts between desiderata. 

  First, I need to unpack their core concern. They're frustrated with how Bayesianism struggles to explain why old evidence (like Mercury's precession confirming GR) intuitively confirms theories, since probabilities can't update on known evidence. Their deeper need seems to be pedagogical clarity—they want a framework to evaluate solutions, not just a list of fixes. 

  The three focal points suggest they anticipate student debates: 
  (1) Mirror-image cases matter because students might question asymmetry—why old evidence feels confirmatory while new evidence for old theories doesn't. 
  (2) Use-novelty is thorny—some camps insist predictive success matters more than accommodation, others call it bias. 
  (3) Conflicts between desiderata will likely be seminar flashpoints, so highlighting them upfront is crucial. 

  For the table, I'll distill six core requirements from literature, each grounded in classic cases: 
  - Old evidence must confirm (Mercury/GR) 
  - New evidence must confirm too (Eddington eclipse) 
  - Zero-probability evidence can't confirm (to block triviality) 
  - Handle mirror-image asymmetry (e.g., Neptune predicting Uranus's orbit vs. GR accommodating Mercury) 
  - Account for predictive advantage (e.g., Mendeleev vs. accommodators of atomic weights) 
  - Avoid logical omniscience (since real scientists don't know all entailments) 

  On the three sticking points: 
  1. Mirror-image: Yes, solutions must handle both, but *differently*—old evidence confirms via counterfactual learning (what if we hadn't known?), new evidence via standard updating. Non-negotiable. 
  2. Use-novelty: Distinguishing prediction from accommodation *is* legitimate—it tracks how evidence tests auxiliary assumptions. But I'll note it's contentious to avoid dogma. 
  3. Conflict: The big tension is between "old evidence confirms" and "zero-probability evidence can't confirm"—since P(e)=1 for old e, making P(e|h) and P(e) equal. Solutions must finesse this (e.g., counterfactual credences). 

  The table format will force conciseness, but under it, I'll stress that the probability-zero conflict is where most solutions live or die—Glymour's original critique nails this. That’ll set up their class debate nicely.
answer: |-
  Here’s a structured desiderata table for an adequate account of confirmation addressing the old-evidence problem, followed by analysis of key tensions. I’ve prioritized clarity and philosophical grounding based on classic cases and debates.

  ---

  ### **Desiderata for Solving the Old-Evidence Problem**
  | **Requirement** | **Motivating Case** | **Non-Negotiable vs. Camp-Specific** | **What It Rules Out** |
  |-----------------|---------------------|--------------------------------------|-----------------------|
  | **1. Old Evidence Confirms** | GR & Mercury’s perihelion: Einstein treated the known anomaly as strong evidence for GR. | **Non-negotiable** (Core to the problem) | Accounts denying that known evidence can confirm (e.g., strict conditionalization without fixes). |
  | **2. New Evidence Confirms** | Eddington’s 1919 eclipse observations confirming GR’s light-bending prediction. | **Non-negotiable** (Fundamental to confirmation) | Theories where only old evidence "counts" (e.g., some historicist accounts). |
  | **3. Zero-Probability Evidence Cannot Confirm** | A hypothesis entailing a logical truth (e.g., "1=1") gains no confirmation from it. | **Non-negotiable** (Avoids triviality) | Solutions assigning confirmation to evidence with prior probability 1 *without* counterfactual adjustment. |
  | **4. Handle Mirror-Image Asymmetry** | **Old evidence + new theory (GR/Mercury)**: Confirms.<br>**New evidence + old theory**: E.g., Neptune’s discovery (new evidence) confirming Adams/Le Verrier’s celestial mechanics (old theory). Also confirms. | **Non-negotiable** (Tests generality) | Asymmetric treatments (e.g., only old-evidence cases get special machinery). |
  | **5. Predictive Advantage over Accommodation** | Mendeleev’s periodic table predicting new elements (e.g., gallium) vs. a theory only fitting known atomic weights. Predictive success seems more impressive. | **Camp-specific** (Contentious; Bayesian purists reject it) | "Ideal predictor" models ignoring historical context (e.g., strict likelihoodism). |
  | **6. No Logical Omniscience Requirement** | Scientists unaware of a theory’s entailment of old evidence (e.g., Einstein initially missing GR’s Mercury solution) shouldn’t be barred from confirmation. | **Non-negotiable** (Psychological realism) | Accounts requiring agents to know *all* logical implications (e.g., "logical certainty" Bayesianism). |

  ---

  ### **Takes on Your Three Key Issues**  
  1. **Mirror-Image Problem**:  
     - **Must be handled? Yes.** An adequate theory must explain both directions (as above). If new evidence for an old theory (e.g., Neptune) *didn’t* confirm, it would violate core confirmation intuitions. The asymmetry lies in *why* old evidence confirms: it requires explaining how *known* data supports a *new* hypothesis (often via counterfactual learning).  
     - **Ruling out**: Asymmetric solutions (e.g., only old evidence gets counterfactual probabilities).  

  2. **Prediction vs. Accommodation Distinction**:  
     - **Must distinguish? Contingently, but not as a primitive.** The distinction *can* emerge from auxiliary commitments (e.g., risk of ad hoc adjustments in accommodation). For example, a theory *built* to fit Mercury’s data (via tunable parameters) may have lower prior probability than one predicting it.  
     - **Genuine or prejudiced?** Not a *direct* desideratum, but a consequence of robust Bayesian updating with priors sensitive to theoretical virtues. Ruling out "use-novelty" absolutism (e.g., Popperian falsificationism).  

  3. **Jointly Unsatisfiable Desiderata**:  
     - **Conflict**: **Old Evidence Confirms (1)** vs. **Zero-Probability Evidence Cannot Confirm (3)**.  
     - **Why?** If evidence *e* (e.g., Mercury’s precession) is known with certainty, strict Bayesianism assigns *P(e) = 1*. By Bayes’ theorem, *P(h\|e) = P(h)*—no confirmation. Yet (1) demands that *e* confirms *h* (GR). Solutions must relax either *P(e) = 1* (e.g., via counterfactual credences) or the probability axioms (e.g., allowing confirmation without inequality). **This tension is the heart of Glymour’s (1980) "Problem of Old Evidence"**.  
     - **Consequence**: All solutions must "break" strict conditionalization (e.g., Garber’s counterfactual priors, Jeffrey’s probability kinematics) or redefine confirmation (e.g., incremental measures). None preserve orthodoxy *and* satisfy both.  

  ---

  ### **Why This Matters for Your Seminar**  
  The **Old Evidence vs. Zero-Probability** conflict (points 1 and 3) forces students to confront Bayesianism’s limits. Solutions either:  
  - **Modify probabilities** (e.g., imagine a time before *e* was known: *P_old(e) < 1*),  
  - **Modify confirmation theory** (e.g., measure explanatory success instead of probabilities), or  
  - **Reject intuitions** (e.g., deny that GR *was* confirmed by Mercury).  

  The **prediction/accommodation debate** (point 5) tests whether confirmation is "purely logical" or sensitive to historical context—a rift between objective Bayesians and paradigm-based accounts (e.g., Kuhnian or Lakatosian). This table sets the stage for evaluating proposals like Garber/Skyrms, Earman’s "Ur-Priors", or Mayo’s severity tests. Good luck!
