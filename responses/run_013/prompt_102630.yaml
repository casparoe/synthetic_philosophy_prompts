  The user is frustrated with endless debates without progress. They need a structured framework to evaluate theories. Their deeper need might be to find a practical approach for modelers or actuaries who must produce defensible numbers, not just philosophical solutions. They suspect that determinacy conflicts with non-arbitrariness and total evidence, so highlighting these tensions is crucial.

  I should structure the desiderata into sections: core cases, key distinctions, background constraints. Then, analyze conflicts, especially determinacy vs. non-arbitrariness and total evidence. The single biggest problem is likely the tension between determinacy and non-arbitrariness because unique correct classes conflict with description-invariance. 

