answer: |-
  Here’s a specification for a theory of reference-class selection, structured for a working modeler who needs to output defensible probabilities. The desiderata are derived from your cases, key distinctions, and consistency requirements, with conflicts highlighted.

  ---

  ### **Core Desiderata for a Theory of Reference-Class Selection**  
  *(What it must deliver to be adequate)*  

  1. **Handle Ambiguous Identity Cases (e.g., John Smith Life Expectancy)**  
     - **Requirement**: Output a unique probability when multiple classes apply (e.g., "40yo male" vs. "40yo male with specific medical history").  
     - **Why**: Practical decisions (insurance pricing, medical prognosis) demand a single number. Must resolve conflict between broader (more data) vs. narrower (more relevant) classes.  
     - **Test Case**: If class A (40yo males) gives P(death) = 0.1%, class B (40yo males with condition X) gives 5%, the theory must specify which to use (or how to combine them).  

  2. **Resolve Self-Locating/Branching Uncertainties (e.g., Sleeping Beauty, Doomsday Argument)**  
     - **Requirement**: Distinguish between *temporal indexing* (when am I?) and *reference-class membership* (what group am I in?).  
     - **Why**: These cases reveal whether the theory treats observers as interchangeable (exchangeability) or uniquely contextual. A modeler needs consistency in anthropic reasoning (e.g., forecasting existential risks).  

  3. **Ground Single-Event Probabilities (e.g., "Chance of Rain Tomorrow")**  
     - **Requirement**: Specify how to select a class for non-repeatable events without collapsing into "only frequencies exist."  
     - **Why**: Users demand probabilities for singular events (e.g., weather forecasts). The theory must avoid vagueness (e.g., "all days" vs. "days with similar atmospheric conditions").  

  4. **Address Algorithmic Fairness (e.g., Predictive Policing "Risk Scores")**  
     - **Requirement**: Make implicit reference classes explicit (e.g., "high risk" relative to whom?) and justify why a class is relevant.  
     - **Why**: To prevent discriminatory outcomes (e.g., comparing a defendant only to "high-crime neighborhoods" vs. the general population).  

  5. **Preserve Key Distinctions**  
     - **Metaphysically Privileged vs. Epistemically Relevant Class**:  
       - Must not conflate what *makes* an event probable (e.g., physical causes of cancer) with what *evidence* we use (e.g., smoking rates).  
       - **Why**: Modelers need to know if a class is causal or correlational for intervention design.  
     - **Salient vs. Correct Class**:  
       - Must explain why a class that "feels right" (e.g., "40yo males") may be inferior to a less obvious one (e.g., "40yo males with LDL > 150").  
       - **Why**: Salience drives misuse (e.g., racial profiling in risk scores).  
     - **Objective Chance vs. Credence**:  
       - Must clarify if the class tracks mind-independent frequencies (e.g., coin flip propensities) or rational belief (e.g., betting on rain).  
       - **Why**: Actuaries need objective frequencies; clinicians need credences for unique patients.  
     - **Fixed vs. Evidence-Shifting Class**:  
       - Must allow classes to update with new data (e.g., medical history refines life-expectancy class).  
       - **Why**: Total evidence requires incorporating all known information.  

  6. **Consistency with Foundational Principles**  
     - **Probability Axioms**: Output must be a valid probability (0≤P≤1, additivity).  
     - **Conditionalization/Total Evidence**: Must use all available evidence; cannot ignore narrower classes when known.  
     - **Exchangeability**: Must justify when agents/events are treated as interchangeable.  
     - **Pre-Grouped Frequencies**: Must acknowledge that data always arrives aggregated (e.g., "cancer rates by age"), not as raw physical propensities.  

  ---

  ### **Conflicts Between Desiderata**  
  **The central tension**: **Determinate Unique Class** vs. **Non-Arbitrariness/Total Evidence**.  
  - **Why they conflict**:  
    - *Determinacy* demands one "correct" class (e.g., the narrowest relevant class for John Smith).  
    - *Non-Arbitrariness* requires invariance under redescriptions (e.g., "40yo male" vs. "person born in 1984"). But redescriptions can imply different classes.  
    - *Total Evidence* forces class expansion with new data (e.g., learning John Smith’s genetics), undermining uniqueness.  
  - **Result**: Any theory prioritizing determinacy (e.g., "always use the narrowest class") violates non-arbitrariness (narrowest class depends on description) and total evidence (ignores broader data when narrow data is sparse).  

  **Secondary conflict**: **Epistemic Relevance** vs. **Objective Chance**.  
  - If the "correct" class is metaphysical (e.g., propensity of John Smith’s cells to fail), it may be unknowable, violating practicality. If it’s purely epistemic (e.g., best-available data), it may ignore causal structure.  

  ---

  ### **The Biggest Obstacle: Non-Arbitrariness**  
  **Why it rules out most theories**:  
  - Frequentism: Chooses classes based on data availability (arbitrary if multiple datasets exist).  
  - Propensity: Assumes a true physical class (unknowable for singular events).  
  - Exchangeable Bayesianism: Classes are subjective, violating determinacy.  
  - **Consequence**: No theory avoids arbitrary choices *if* determinacy is required. Descriptions frame the problem (e.g., "male" vs. "person with XY chromosomes"), and no theory can specify a "description-independent" class.  

  ---

  ### **Practical Implications for Modelers**  
  1. **Trade Determinacy for Transparency**:  
     - Admit no unique "correct" class. Justify choices explicitly (e.g., "Used class A because data for B is sparse; sensitivity analysis shows P varies between X–Y").  
  2. **Embed in Decision Context**:  
     - A "high-risk" score in policing must specify: *Risk of what?* (e.g., re-arrest) *Compared to whom?* (e.g., same age/zip code). The class is fixed by the stakeholder’s goal.  
  3. **Use Hierarchical Models**:  
     - Blend broad/narrow classes (e.g., Bayesian multilevel models). John Smith’s risk borrows strength from population data but weights his medical history more heavily. Satisfies total evidence pragmatically.  
  4. **Accept Shifting Classes**:  
     - Start broad (e.g., national rain forecasts), narrow with evidence (e.g., radar data).  

  ---

  ### **Bottom Line**  
  The desiderata reveal **no theory satisfies all**. The list *is* the result:  
  - **For philosophers**: The problem is unsolvable without compromising determinacy or descriptivism.  
  - **For modelers**: Output defensible numbers by:  
    - (a) Anchoring in decision context,  
    - (b) Using all evidence hierarchically,  
    - (c) Quantifying uncertainty *about the class itself* (e.g., via model averaging).  

  The "working solution" isn’t a theory of the *one true class*, but a **protocol for justifying class choices under constraints**. Your reading group’s next step: Evaluate papers not on solving the problem, but on how they navigate these trade-offs.
