  ### Adjudication of the Exchange

  I'll address the argument move by move, rating each from "clearly mistaken" to "defensible" to "clearly right," with a brief justification. Then I'll summarize what each participant is missing in their arguments and assess who has the better of the argument overall. The ratings are based on standard principles of historical methodology, source criticism, and epistemology.

  #### Move-by-Move Analysis

  1. **Ines (1)**: "The criterion presupposes that you know what a forger would and would not invent, but the king who runs is among the most familiar stock figures in the writing of the period; the detail you treat as too awkward to have been fabricated is precisely the kind of thing that gets fabricated."
     - **Rating**: Defensible  
     - **Justification**: Ines correctly identifies a key weakness in the embarrassment criterion: it relies on an assumption about authorial intent that may not hold, especially when "embarrassing" details could be conventional tropes or literary devices. Historical scholarship acknowledges that stock figures (e.g., cowardly kings) were often fabricated to fit narrative conventions or moral lessons, so her skepticism is methodologically sound. However, it's not "clearly right" because the criterion can sometimes work when tropes are absent, and it's not "clearly mistaken" because she raises a valid concern without dismissing the criterion entirely.

  2. **Ravi (2)**: "Some of it is conventional, granted, but the conventions are borrowed from earlier works, and where the chronicle's awkward details match no earlier model known to us, convention cannot account for them."
     - **Rating**: Defensible  
     - **Justification**: Ravi's point is reasonable in historical practice: unique, non-derivative details are less likely to be fabricated, so they may carry more weight. This aligns with source criticism that values anomalies as potential evidence of authenticity. But it's only defensible (not clearly right) because it implicitly relies on an argument from silence (i.e., no known model exists), which is weak if the historical record is incomplete. It's not clearly mistaken because it addresses Ines's concern by narrowing the criterion to cases without precedents.

  3. **Ines (3)**: "Known to us is doing all the work there. You are reasoning from the absence of a model in the surviving corpus, and the corpus is what happened to survive, not what once existed; the argument from silence is your weakest move, not your strongest."
     - **Rating**: Clearly right  
     - **Justification**: Ines is correct here. Arguments from silence are notoriously unreliable in historiography because the loss of sources (e.g., due to decay, destruction, or selective preservation) means absence of evidence ≠ evidence of absence. Scholars like Thucydides or modern medievalists emphasize that surviving texts are a small, biased sample, so inferring that no model existed is speculative. This move effectively undermines Ravi's reliance on uniqueness.

  4. **Ravi (4)**: "We also have corroboration — a charter and a coin hoard that fit his account."
     - **Rating**: Defensible  
     - **Justification**: Corroboration from multiple sources (e.g., material evidence like coins and documents like charters) is a standard way to strengthen historical claims, as it reduces reliance on a single, flawed narrative. Ravi's appeal to this is defensible because it shifts the focus to external evidence, which can validate parts of the chronicle. However, it's not clearly right because, as Ines immediately notes, corroboration requires source independence to be meaningful—a point Ravi doesn't address here.

  5. **Ines (5)**: "Only if they are independent, and you have not shown that. A charter from the same chancery, or a coin whose legend the chronicler may himself be echoing, can descend from the same lost source as the chronicle; the agreement between them is then one witness counted twice."
     - **Rating**: Clearly right  
     - **Justification**: Ines highlights a fundamental principle of source criticism: corroboration is only valid if sources are independent. If the charter, coin, and chronicle all derive from a common (but lost) source or institutional context, their agreement doesn't provide new evidence—it may simply reflect shared bias or error. This is well-established in fields like textual criticism and epistemology (e.g., the concept of "witness dependence"). Her move is clearly right because it exposes a critical flaw in Ravi's use of evidence.

  6. **Ravi (6)**: "If a source may be used only once we have proved it owes nothing to any other, we can know nothing at all; and the likelihood ratio you keep demanding is one you could not supply for any testimony you accept in daily life, so it cannot be a condition of knowledge."
     - **Rating**: Defensible  
     - **Justification**: Ravi has a point about practical epistemology: demanding absolute proof of independence or precise likelihood ratios is unrealistic, as historical inquiry (and daily life) often relies on probabilistic assessments based on available evidence. For instance, we accept eyewitness testimony without full certainty. This is defensible because it reflects real-world limitations of knowledge. However, it's not clearly right because Ines's concerns about dependence are valid for rigorous scholarship, and daily life analogies can be misleading—historical evidence often involves higher stakes and fewer cross-checks.

  #### What Each Is Missing
  - **Ines**:
    - In move (1), she misses that conventions can sometimes reflect real events; not all stock figures are pure fabrications. A chronicler might include an embarrassing detail *because* it happened, even if it fits a trope, so the embarrassment criterion isn't invalidated by convention alone.
    - In move (3), she underemphasizes that in cases with extensive surviving corpora, the absence of a model can be meaningful (e.g., if similar events were well-documented elsewhere). She focuses on the weakness of silence but doesn't suggest how to strengthen the argument positively.
    - In move (5), she correctly identifies the independence problem but doesn't offer a way to evaluate it (e.g., through contextual analysis or material evidence), leaving the discussion overly skeptical. She also doesn't acknowledge that corroboration can still be useful if independence is probable, even if not proven.

  - **Ravi**:
    - In move (2), he misses that arguing from the absence of known models is circular without addressing the incompleteness of the historical record. He doesn't consider that lost texts could have contained precedents for the "unique" details.
    - In move (4), he presents corroboration without assessing independence, which is a key oversight. He could have argued for why the charter and coin hoard might be independent (e.g., different origins or purposes) but fails to do so.
    - In move (6), he conflates everyday testimony with historical evidence, missing that historical sources (especially late or error-prone ones) require more scrutiny due to temporal distance and potential biases. He also doesn't engage with Ines's point about dependence, instead retreating to a pragmatic defense that weakens his methodological rigor.

  #### Overall Assessment: Who Has the Better of the Argument?
  **Ines has the better of the argument overall.** She consistently identifies and exploits weaknesses in Ravi's reasoning: 
  - Her critique of the embarrassment criterion (move 1) raises valid doubts about its reliability.
  - Her dismantling of the argument from silence (move 3) is a strong point that undermines Ravi's uniqueness claim.
  - Her emphasis on source independence (move 5) is decisive, as it shows Ravi's corroboration may be illusory.

  Ravi's points are defensible but reactive; he never fully addresses Ines's epistemological challenges. His embarrassment criterion and appeal to corroboration have merit in historical practice, but Ines exposes their fragility, especially for a late and unreliable source. Overall, her formal epistemology perspective highlights how Ravi's approach risks overconfidence, making her the more convincing party in this exchange. However, neither "wins" every point—Ravi's practical concerns (e.g., in move 6) are legitimate, but Ines's methodological rigor gives her the edge.
