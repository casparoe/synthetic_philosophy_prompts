  For "positions the tree can’t separate": some self-locating views blend with decision theory (e.g., Sebens vs. Wallace), but the tree splits them at the "world vs. agent" node. Fine-grained differences (e.g., Wallace’s "subjective uncertainty" vs. pure self-locating) might blur, but the core divide is preserved. 

