answer: |-
  ### Setup
  You accept unitary evolution and Everettian branching. This instrument sorts positions on how probability arises in such a universe. It assumes no wavefunction collapse and multiple realized outcomes.

  ### The Tree
  1. **Is probability meaningful in a branching universe?**  
     - **No** → Go to 2  
     - **Yes** → Go to 3  

  2. **Does this imply a fatal flaw for Everettian quantum mechanics?**  
     - **Yes** → *Critical Stance* (Leaf A)  
     - **No** → *Illusionism* (Leaf B)  

  3. **Does probability originate from features of the world (e.g., branch structure), or from features of agents (e.g., beliefs, decisions)?**  
     - **World** → Go to 4  
     - **Agents** → Go to 5  

  4. **Is the Born rule (squared amplitude) a fundamental property of the branching structure?**  
     - **Yes** → *Primitive Branching Measure* (Leaf C)  
     - **No** → *Derived Measure* (Leaf D)  

  5. **Does the agent experience genuine uncertainty about which branch they will inhabit?**  
     - **Yes** → Go to 6  
     - **No** → *Decision-Theoretic* (Leaf E)  

  6. **Is this uncertainty rooted in the agent’s ignorance of their future branch location?**  
     - **Yes** → *Self-Locating Uncertainty* (Leaf F)  
     - **No** → *Caring Measure* (Leaf G)  

  ### The Leaves
  - **Leaf A: Critical Stance**  
    *Probability is impossible in branching; Everettian QM is incomplete or false.*  
    Awkward commitment: Rejects unitary QM as empirically adequate without radical modification.  

  - **Leaf B: Illusionism**  
    *Probability is a cognitive illusion; branching makes "chance" unnecessary.*  
    Awkward commitment: Must explain why agents evolved to feel improbable outcomes are "surprising."  

  - **Leaf C: Primitive Branching Measure**  
    *Squared amplitude is a fundamental physical measure over branches.*  
    Awkward commitment: Adds Born rule as a basic postulate beyond unitary dynamics.  

  - **Leaf D: Derived Measure**  
    *Squared amplitude emerges from symmetries/entanglement in the universal wavefunction.*  
    Awkward commitment: Requires specific assumptions (e.g., envariance, typicality) to derive the measure.  

  - **Leaf E: Decision-Theoretic**  
    *Rational agents betting on outcomes must act as if Born probabilities are real.*  
    Awkward commitment: Probability is defined by behavior, not ontology or experience.  

  - **Leaf F: Self-Locating Uncertainty**  
    *Agents are uncertain about which branch they occupy post-measurement.*  
    Awkward commitment: Uncertainty persists even though all outcomes are real.  

  - **Leaf G: Caring Measure**  
    *Agents should care about future branches in proportion to their amplitude.*  
    Awkward commitment: Justifies concern without uncertainty by fiat ("you should care more").  

  ### Branches Nobody Occupies
  - **World → No → Agents?** (Q3→"No"→Q5): Denying both world and agent origins is incoherent; probability must arise *somewhere*.  
  - **Agents → Yes → No** (Q5→"Yes"→Q6→"No"): If agents feel uncertainty but it’s not self-locating, no clear alternative exists (unexplored/unattractive).  
  - **World → Yes → No** (Q4→"Yes"→[invalid]): Affirming a world-measure but denying it grounds Born rule is unmotivated (unattractive).  

  ### Positions the Tree Cannot Separate
  - **Self-Locating Uncertainty vs. Caring Measure**: Some views blend these (e.g., "uncertainty plus caring weights"), but the tree splits them at Q6.  
  - **Derived Measure variants**: Gleason’s theorem, envariance, and typicality derivations all map to Leaf D; the tree doesn’t distinguish their mechanisms.  
  - **Decision-Theoretic refinements**: Subjective vs. objective rationality defenses both land in Leaf E.  

  ---

  ### Instrument Notes
  - **Purpose**: Forces you to confront metaphysical and epistemic dependencies.  
  - **Weak Point**: Q3 (world/agent) may feel ambiguous; "caring" (Leaf G) could be seen as world-influenced.  
  - **Leaf Coverage**: Includes all requested positions. "Primitive Measure" (C) is the "bolted-on" view; "Critical" (A) denies consistency; "Illusionism" (B) explains away probability; "Decision-Theoretic" (E) and "Self-Locating" (F) are agent-focused.  
  - **Engineering Lens**: If you lean toward "Derived Measure" (D), ask: *Is the derivation as robust as a unit test?* If toward "Self-Locating" (F), ask: *Is this uncertainty a bug or a feature?*
