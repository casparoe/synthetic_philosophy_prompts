prompt: |-
  I retired recently from a career in the physical sciences and have taken up philosophy as an amateur; among other things I run a small interview series, and my next guest is a philosopher of physics who defends what is usually called quantum immortality. Her claim, as I understand it, is this: if she repeatedly submitted to a device that kills her in one branch of the wavefunction and spares her in another, she should not expect ever to experience her own death. Some successor of her always survives; the death is undergone by a counterpart she is not; and she treats that as a first-person certainty rather than a matter of luck.

  I want eight to ten questions that press her on the substance of this, each with a follow-up keyed to the reply she is most likely to give, and I should like the whole answer in British English. Specifically, I want her pressed on the following.

  - Measure. After n rounds the successor who lives carries a measure that has halved at every round — the very figure the Born rule would have assigned to her survival. Does she take measure to be probability, and if not, what work is the word expect doing in her claim? Have a follow-up ready for the reply that measure is not probability for the person living through the branches.

  - Identity and self-location. What makes a successor in another branch her rather than a copy of her? The familiar analogy with a person dividing into two equal offshoots, neither of which is the original, may not survive the fact that the living offshoot's measure dwindles towards nothing. I should like her to say whether her argument requires that survival consists in there being some descendant who is hers, rather than in her being any one of them.

  - Action and insulation. If the argument works, it should work for every lethal hazard, so that she should expect to survive each fatal illness and to reach an implausible age, while apparently having no such expectation. Is that a confusion about measure, or evidence that the doctrine is unfalsifiable?

  - Learning nothing. The counterpart who dies cannot update on her death, which makes the reasoning look anthropically suspect. Why is it not simply vacuous to say that I never experience dying?

  - What would count against the view? I want a closing question that obliges her to name evidence or argument that would make her abandon it.

  Please keep every question content-driven; nothing that invites her merely to restate the position.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired physical scientist turned philosophy interviewer preparing for a discussion on quantum immortality. They want substantive questions that probe the doctrine's foundations, specifically targeting five key areas: measure vs probability, identity, practical implications, anthropic reasoning, and falsifiability.

  First, considering the measure-probability distinction. The core tension here is how a diminishing measure affects subjective expectation. If the philosopher claims measure isn't probability, we need to challenge what "expect" means when survival likelihood approaches zero. The follow-up should press whether this redefinition renders the claim trivial - surviving with negligible measure seems philosophically unsatisfying.

  For identity, the branching analogy needs scrutiny. When measure becomes infinitesimal, can we still call the surviving branch "her"? The "no original" objection from fission cases feels particularly potent here. The follow-up must force clarity on whether survival means continuity or mere descendant existence.

  The action/insulation point reveals a practical paradox. If quantum immortality applies universally, why don't believers behave recklessly? The follow-up should corner them on whether this makes the doctrine unfalsifiable - a critical weakness for any scientific claim.

  On anthropics, the "learning nothing" critique is fundamental. The dead can't report failure, creating observation bias. The follow-up needs to challenge whether this makes the position tautological rather than substantive.

  Finally, falsifiability is crucial. Any scientific claim must specify defeat conditions. The closing question should demand concrete abandonment criteria - perhaps empirical evidence from neuroscience or cosmology that contradicts subjective continuity across low-measure branches.

  Throughout, maintaining British English phrasing: "halved" not "halved", "reckoning" not "calculation", and direct constructions like "I should like her to say" per the brief. Each question must avoid letting the guest restate doctrine; they must engage the contradictions.
answer: |-
  Here are ten substantive questions with tailored follow-ups in British English, designed to press the core philosophical and physical tensions in quantum immortality:

  1.  **Question on Measure & Expectation:**  
      "You state one should *expect* never to experience death in such an experiment. Yet after *n* rounds, the surviving successor's *measure* – which you grant halves each time – becomes vanishingly small, precisely matching the Born rule probability one wouldn't survive. If measure isn't *identical* to subjective probability for the surviving observer, what specific work is the word 'expect' doing here? Does 'expect' simply mean 'will find oneself alive', regardless of the infinitesimal measure?"
      *   **Likely Reply & Follow-Up (if she denies measure is probability for the survivor):**  
          *(If she argues measure reflects global weight, not the survivor's local credence)*  
          "If the surviving observer recognises their measure is effectively zero according to the global wavefunction, doesn't this undermine any *rational* expectation of continued survival in future trials? Isn't saying 'I expect to survive because I find myself alive *now*' merely a tautology, utterly disconnected from the predictive weight the physics assigns to my *next* survival?"

  2.  **Question on Identity & Continuity:**  
      "The standard analogy for branching is a person splitting like an amoeba into two equal successors, where neither *is* the original person in a strict, persistent identity sense. In your quantum case, however, one 'offshoot' dies and the 'surviving' one carries a measure halved each time – becoming, for all practical quantum reckoning, 'not the original'. What constitutes *your* specific, persistent identity across branches such that *you* are the one surviving with near-zero measure, rather than it being a qualitatively identical *copy* that merely inherits your memories?"
      *   **Likely Reply & Follow-Up:**  
          *(If she appeals to causal continuity or identity-through-branching)*  
          "Does your argument fundamentally require that survival consists *only* in there being *some* future descendant who inherits your causal history and memories (even if their measure is negligible), rather than requiring that *you*, as a specific, numerically identical subject, persist through the sequence? If so, isn't 'you survive' just shorthand for 'a copy of you exists somewhere'?"

  3.  **Question on Diminishing Measure & Identity:**  
      "As the measure of the surviving branch dwindles exponentially towards zero, doesn't the claim that *this* specific low-measure branch contains the 'original you' become increasingly strained? On what basis do you privilege *this* specific thread of consciousness, emerging from a near-infinitely improbable sequence of survivals, as constituting *your* persistent identity, rather than a new, statistically negligible offshoot?"
      *   **Likely Reply & Follow-Up:**  
          *(If she argues subjective continuity defines identity regardless of measure)*  
          "Doesn't this lead to the conclusion that 'I' am *always* the consciousness in the maximally improbable survival branch, by definition? If so, isn't the claim 'I never experience death' rendered true *analytically* (by how 'I' is defined), rather than being a substantive claim about physics or personal survival?"

  4.  **Question on Universal Application & Falsifiability (Action/Insulation):**  
      "If the reasoning holds, shouldn't it apply to *every* potentially lethal event governed by quantum indeterminacy – disease, accident, old age? You should, therefore, rationally *expect* to survive any fatal illness and live indefinitely, becoming a 'quantum Methuselah'. Yet you presumably don't actually hold this expectation. Is this discrepancy simply a mistake about how measure maps to subjective expectation, or does it suggest the doctrine is insulated from empirical disconfirmation?"
      *   **Likely Reply & Follow-Up:**  
          *(If she argues non-quantum deaths or practical improbability)*  
          "Even granting rare 'quantum deaths', why doesn't the logic compel you to believe you'll improbably survive *this* bout of cancer or *this* heart attack, just as you believe you'll survive the next run of the quantum device? If you reject that expectation for real-world hazards, doesn't that undermine the claim that quantum immortality generates a genuine *rational expectation* in the experimental case?"

  5.  **Question on Anthropic Susceptibility (Learning Nothing):**  
      "The observation that 'I never experience my own death' seems necessarily true *for any observer who exists to make it*. The counterpart who dies cannot report failure. Doesn't this render the core claim – 'I should expect never to experience death' – fundamentally *unfalsifiable* and potentially vacuous from an anthropic perspective? How does it differ from simply noting that dead people don't talk?"
      *   **Likely Reply & Follow-Up:**  
          *(If she argues it's a prediction about subjective experience from the survivor's perspective)*  
          "But doesn't *every* conceivable theory of consciousness and death, except perhaps absolute annihilation *without* branching, also predict that any *existing* observer will not have experienced death *yet*? What specific *predictive power* or *explanatory insight* does quantum immortality add beyond this tautology observed by all living beings?"

  6.  **Question on Personal Probability vs. Measure:**  
      "When you say you 'should not expect ever to experience death', are you making a claim about your *subjective degree of belief* (your personal probability) in your imminent death *before* each trial, or solely about the *subjective outcome* you will inevitably encounter? If it's the former, how do you reconcile this near-certainty of survival with the Born rule assigning high probability to death?"
      *   **Likely Reply & Follow-Up:**  
          *(If she claims subjective certainty aligns with finding oneself alive)*  
          "Doesn't this imply that rational subjective probability *must* diverge dramatically from the Born rule probabilities calculated by physicists describing the experiment externally? Isn't this a deeply problematic schism between the physics and the first-person perspective it supposedly underwrites?"

  7.  **Question on the "First-Person Certainty":**  
      "You describe the survival as a 'first-person certainty'. Does this certainty extend to *predicting* survival *before* the outcome of each trial is known? Or is it only a retrospective certainty, declared *after* finding oneself alive?"
      *   **Likely Reply & Follow-Up:**  
          *(If she suggests a form of predictive certainty)*  
          "If it's predictive certainty, how do you square this with the overwhelming physical evidence (Born rule statistics verified in countless experiments *not* involving death) that the high-probability outcome (death) *does* occur in other branches? Doesn't insisting on predictive certainty for your survival require rejecting the empirical validity of the Born rule for branches where consciousness ceases?"

  8.  **Question on the Role of Death:**  
      "The termination of consciousness in the 'death' branch seems crucial to your argument – it prevents that branch's observer from contradicting the survivor. If, instead of death, the device merely caused temporary unconsciousness or a vivid hallucination of dying in the 'bad' branch, would the survivor still be entitled to claim they were 'certain' they'd never experience the outcome labelled 'death'? If not, why does permanent cessation change the epistemic situation for the survivor?"
      *   **Likely Reply & Follow-Up:**  
          *(If she argues cessation prevents any report from the 'dead' branch)*  
          "But doesn't the survivor *already* acknowledge the 'death' branch exists (with high measure)? Their 'certainty' of never experiencing death seems based solely on the *definition* of death as irreversible cessation preventing report, not on any empirical access to the branching structure. Doesn't this reduce the argument to 'I won't experience irreversible cessation because if I did, I couldn't report it', which is again tautological?"

  9.  **Question on the Threshold of Measure:**  
      "Is there *any* lower bound on the measure of a branch below which you would concede that the consciousness within it is *not* 'you'? If measure can dwindle to 1 part in 10^100 and it's still 'you', what principle prevents it from being 'you' at measure *zero* – which would contradict the initial claim that 'some successor always survives'?"
      *   **Likely Reply & Follow-Up:**  
          *(If she denies there's a meaningful threshold)*  
          "Doesn't the absence of a threshold mean that 'you' persist only in branches with *non-zero* measure, however small? But if the wavefunction evolution allows branches where your biological structure *is* completely destroyed (measure zero for *any* conscious continuation), wouldn't those branches contain no 'you' at all? Doesn't your survival *require* that *no* branch with non-zero measure results in your complete physical annihilation?"

  10. **Closing Question on Falsification:**  
      "What specific empirical finding or theoretical development *would* compel you to abandon the quantum immortality thesis? For instance, would evidence that consciousness is an emergent property strictly dependent on specific, non-quantum-stable brain states (ruling out persistence in arbitrarily low-measure branches) suffice? Or evidence that wavefunction branches with vanishing measure truly decohere beyond any possibility of supporting coherent consciousness? What, definitively, *could* falsify it?"
      *   **Likely Reply & Follow-Up:**  
          *(Whatever specific evidence/argument she proposes)*  
          "And if that evidence/argument emerged, wouldn't it fundamentally undermine the core mechanism – the idea that *your* subjective experience inevitably follows *some* branch, however improbable – by showing consciousness *cannot* persist in the extremely low-measure branches required for extreme longevity via quantum immortality?"

  These questions aim directly at the conceptual tensions you outlined (Measure/Probability, Identity, Action/Insulation, Anthropics, Falsifiability), demanding clarification beyond restatement and probing potential weaknesses in the coherence and empirical grounding of the position. The British English phrasing avoids overly American idioms and favours constructions like "reckoning", "strained", "compel", "concede", and "whilst". Good luck with the interview!
