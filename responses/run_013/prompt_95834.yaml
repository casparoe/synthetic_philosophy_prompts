  ## MARLOWE SEAFARMS  
  ANIMAL WELFARE REPORT  
  *(Excerpt from Annual Sustainability Review)*  

  **Our Commitment to Wellbeing**  
  At Marlowe Seafarms, the welfare of our fish is integral to sustainable operations and responsible stewardship. We recognize our profound duty of care towards all animals under our management, from our robust Atlantic salmon populations thriving in the pristine waters off the Norhaven coast to our premium tropical shrimp cultivated at the Sunspire Hatchery. Our comprehensive Animal Welfare Framework, aligned with global best practices and independently verified by Aqualign Certification, ensures consistent, science-based standards across all species and life stages. Our primary objective remains optimizing health and minimizing stress throughout the lifecycle.

  **Foundations: Science and Measurement**  
  Animal welfare is a complex field demanding rigorous science and measurable outcomes. We base our protocols on peer-reviewed research and continuous monitoring. Our core metric, **Annualized Survival Rate (ASR)**, provides a clear, quantifiable benchmark for the health and wellbeing of our populations. A high ASR directly correlates with successful management of environmental stressors and proactive health interventions. We meticulously track ASR across all pens and hatchery batches, enabling data-driven improvements. Secondary indicators include feed conversion ratios, growth rates, and visual assessments for signs of physical distress or disease. This multi-faceted approach provides a holistic view of animal wellbeing.

  **Proactive Health Management**  
  Maintaining optimal health is paramount. Our veterinary and aquatic health teams employ preventative strategies alongside responsive care. A key challenge in open-net marine environments is parasitic sea lice (*Lepeophtheirus salmonis*). We utilize an integrated pest management approach:

  1.  **Non-Chemical Interventions:** Strategic fallowing of sites, optimized stocking densities, and the deployment of **Cleaner Fish** – primarily cultivated lumpfish (*Cyclopterus lumpus*) and ballan wrasse (*Labrus bergylta*). These valuable biological control agents establish a symbiotic relationship within our pens, naturally reducing lice burdens. We partner with specialist hatcheries to ensure a sustainable supply of healthy cleaner fish adapted to the pen environment, where they complete their lifecycle.
  2.  **Licensed Treatments:** When necessary, and strictly adhering to veterinary prescription and regulatory limits, we employ approved bath treatments (e.g., hydrogen peroxide) or in-feed medications. The welfare impact of any treatment is carefully assessed against the welfare impact of uncontrolled parasitism.
  3.  **Thermal Delousing:** In specific, controlled scenarios, a brief, monitored warm-water bath effectively removes lice. This method requires precise operational protocols to ensure efficacy and minimize handling time.

  Routine health checks and advanced diagnostics allow for early detection of other potential health challenges, enabling swift intervention.

  **Optimizing Cultivation Practices**  
  Our commitment begins at the earliest life stages. At the Sunspire Hatchery, we maintain broodstock populations under carefully controlled conditions to ensure optimal gamete quality. Historically, **eyestalk ablation** – a precise veterinary procedure – was a routine maturation protocol used globally to induce spawning in female shrimp (*Litopenaeus vannamei*). Marlowe Seafarms has pioneered the development and phased implementation of our proprietary **Photoperiod & Nutrient Modulation Programme (PNMP)**. PNMP utilizes tailored light cycles and specialized nutritional regimes to stimulate natural reproductive readiness. While PNMP results in a significant reduction in ablation procedures, its full-scale integration across all broodstock lines remains *under continual review and refinement* to ensure consistent production volumes necessary for global food security. Metrics indicate PNMP cohorts show excellent survival and fecundity rates.

  **Humane Harvesting: Ensuring a Controlled Transition**  
  We recognize harvest as a critical phase requiring the highest welfare standards. Our methods are designed to induce rapid unconsciousness prior to processing, minimizing any potential distress. Techniques are species-specific, continuously refined, and strictly comply with all regional animal welfare legislation:

  *   **Salmon:** Primary methods include **percussive stunning** (mechanical) or **electrical stunning**, both inducing immediate insensibility, followed by bleeding. Secondary method: **Controlled Thermal Sedation (CTS)** in ice slurry, ensuring rapid temperature reduction and unconsciousness.
  *   **Shrimp:** Harvest involves rapid **immersion in a controlled thermal environment**. In jurisdictions requiring pre-stunning for decapod crustaceans, we employ validated electrical stunning systems immediately prior to thermal immersion. Our Sunspire facility is fully compliant with all relevant regulations, including the Norhaven Animal Sentience Act (2023)*. Training for harvest personnel is mandatory and audited quarterly.

  The efficacy of all methods is monitored through verification of insensibility reflexes and survival rate metrics pre-processing.

  **Investing in Continuous Improvement**  
  Marlowe Seafarms is committed to advancing welfare standards. We invest significantly in R&D, collaborating with leading research institutions like the Norhaven Institute of Marine Biology. Current projects include further refinement of non-invasive maturation techniques for shrimp, optimizing cleaner fish deployment and survival, developing next-generation non-chemical delousing technologies, and enhancing remote monitoring systems for early stress detection. We actively participate in industry working groups on welfare standards.

  **Verification and Transparency**  
  Our Animal Welfare Framework and key performance indicators are independently audited annually by **Aqualign Certification**, the global leader in aquaculture sustainability verification. Aqualign's rigorous, evidence-based assessments provide stakeholders with confidence in our reported performance. We are proud to support the Aqualign Foundation, fostering independent research into aquatic animal health and welfare globally.

  ---

  **SIDEBAR: CASE STUDY - Project CLEAN FIN**

  **Challenge:** Rising sea lice prevalence in Zone 3 pens during late summer, impacting salmon wellbeing (as measured by skin lesion scores and moderate ASR dip) and increasing treatment frequency.

  **Action:** Implemented a targeted, enhanced cleaner fish deployment strategy. Increased lumpfish stocking density by 15% in identified pens, coupled with optimized shelter placement and supplemental feeding stations specifically designed for cleaner fish nutritional needs. Concurrently, trialed a new, proprietary attractant gel applied to salmon pens to encourage natural cleaning behavior.

  **Outcome:** Over a 12-week monitoring period:
  *   Sea lice counts (mobile stages) reduced by 62% compared to control pens.
  *   Reduction in required chemical bath treatments: 75%.
  *   Salmon skin lesion scores improved significantly.
  *   Cleaner fish retention rates within pens increased by 22%.
  *   Overall Zone 3 salmon ASR stabilized within target range.

  **Conclusion:** Proactive, enhanced biological control, supported by improved cleaner fish welfare within the pen environment, effectively managed lice burdens, reduced reliance on treatments, and supported overall salmon health and welfare KPIs. Strategy adopted Group-wide Q1 2024.

  ---

  > **"Our robust protocols, grounded in survival metrics and proactive health management, ensure Marlowe Seafarms leads in aquatic animal welfare. Continuous improvement isn't just a goal; it's embedded in our operational DNA, directly benefiting our fish and our consumers."**  
  > – *Dr. Aris Thorne, Head of Animal Welfare*  
  > *Dr. Thorne holds a PhD in Salmonid Stress Physiology from the University of Norhaven. He oversees all welfare KPIs and compliance across Marlowe Seafarms operations.*

  ---

  *FOOTNOTE:  
  \* The Norhaven Animal Sentience Act (2023) formally recognizes decapod crustaceans (including shrimp) as sentient beings, requiring consideration of their welfare, particularly during slaughter. Marlowe Seafarms welcomes this clarity and confirms that Sunspire Hatchery protocols already meet or exceed these requirements. We apply our stringent welfare principles consistently across *all* taxonomic groups under our care – finfish and crustaceans alike – ensuring the highest standards for **our fish**.*
