prompt: |-
  I run grantmaking at a small family foundation — roughly $2M a year to give away, individual grants between $5k and $400k, decided by me plus a five-person board that's mostly retired business people, one economist, nobody who's read any philosophy since college. Over the past year a growing slice of our proposals has started to feel like a different species from the rest. A group wants $250k to work on a technical problem where they claim there's maybe a one-in-ten-million chance of averting something very bad and permanent. Somebody else wants a small "seed" grant for a project whose stated payoff is, honestly, civilization-scale. And then the ordinary stuff — a literacy program, a vaccine delivery charity, a land trust — where I can more or less see what we're buying. My problem is I have no rule for comparing these, and the way I've been doing it, eyeballing "how real does this feel," is just my gut with a spreadsheet stapled to it. A friend in effective altruism told me the name for what's happening to me is fanaticism and that once you take expected value seriously you basically have to fund the long shots; our economist then said something similar but concluded the opposite, muttering about utility functions having to be bounded or you get absurdities. The board also has this informal thing where we never fund anything we estimate below about one-in-a-million, and I genuinely can't tell if that's a principle or just a superstition we all agreed to.

  I want you to turn whatever the philosophy of this actually says into a procedure I can run on a proposal in about twenty minutes, before I take it to the board. It needs to say, in order: what I compute; what I refuse to compute and why; what I do when the probability isn't a number anyone derived but a vibe (a one-in-ten-million is almost always a vibe); where the procedure stops with a clean no; and where it hands the decision to the board because the question is values, not arithmetic. It has to survive the objections I actually get — that any nonzero chance of astronomical or infinite value dominates everything else, that a rule which discounts small probabilities would have missed penicillin or whatever, and that a rule which doesn't discount them commits us to funding anything a clever person can dress up as a long shot. It also has to be honest about the parts that are just me laundering a risk preference as math — I suspect the "one-in-a-million floor" is one of those. And I want the escape hatches named: the cases where the procedure says fund it and I'll hate it, and the ones where it says don't and I'll hate it more.

  One more thing. The founder's letter that set us up says we should prefer the many certain small goods to the one uncertain great one, and the board treats that line like scripture; I'd like to know whether that's a defensible position or just an old man's risk aversion, and how much of it I can keep while still taking long shots seriously. So run the finished procedure on three proposals: (a) $250k for a lab working on a problem with a one-in-ten-million chance of averting a permanent catastrophe; (b) $100k for a proven deworming-style program with a large, well-measured but thoroughly ordinary benefit; (c) $50k for something whose applicants describe the upside as literally infinite — they mean it, and I don't even know how to file that. Tell me what the procedure spits out for each, where it's just my values wearing a lab coat, and what the whole thing definately can't do.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're a grantmaker at a family foundation dealing with a mix of traditional and high-risk, high-reward proposals. The core problem is comparing these different types of grants systematically. 

  First, I need to understand their constraints: small team, business-minded board, limited time per proposal (20 mins!), and that founder's letter about preferring certain small goods. The emergence of "fanaticism"-style proposals is clearly causing tension between EA-style expected value math and practical/philosophical limits.

  Hmm... the key conflicts seem to be:
  - Expected value calculations vs. bounded utility functions (the economist's point)
  - Quantifiable probabilities vs. "vibe" estimates
  - Founder's risk aversion vs. pressure to consider long shots
  - Needing clear thresholds without being arbitrary

  The user wants a procedure that's:
  - Actionable within 20 mins
  - Explicit about what not to calculate
  - Honest about value judgments
  - Resilient to common objections (infinite value claims, penicillin counterfactuals)

  I notice they're self-aware about laundering risk preferences as math - that's important. The "one-in-a-million floor" example shows they want intellectual honesty in the model.

  For the procedure design, I'm thinking:
  1. Must avoid unbounded utility traps (infinite value problems)
  2. Needs explicit probability floors/ceilings to handle vibes
  3. Should separate "calculate" vs "judge" phases
  4. Must preserve board decision points for values-based calls

  The three test cases are perfect stress tests:
  - (a) is the classic Pascal's Mugging scenario
  - (b) anchors to proven interventions
  - (c) forces confrontation with "infinite value" claims

  The founder's letter complicates things - is it wisdom or bias? Probably both. The procedure should honor it as a value input but allow exceptions through clear thresholds.

  Biggest challenges:
  - Making probability ranges actionable without false precision
  - Handling "infinite value" without getting derailed
  - Balancing EV math with human aversion to micro-probabilities
  - Creating audit trails for board decisions

  I'll structure the output to first explain the philosophical framework (fanaticism vs bounded utility), then the step-by-step filters, then apply to cases with transparent "where values enter" markers. The escape hatches need to be brutally honest - like when the math says fund but human intuition screams no.

  For the infinite value case (c), the only sane approach is to treat it as "values call required" - no amount of math can solve that. The penicillin objection gets handled by the probability floor being explicitly tentative. And the risk aversion gets named as such in the founder principle section.

  Most importantly - the whole thing must fit in a spreadsheet tab plus one page of guidelines. Time-boxing each step is non-negotiable.
answer: |-
  Here's a practical, philosophy-grounded procedure designed for your constraints. It balances expected value (EV) with bounded utility, acknowledges uncertainty, and forces value judgments into the open. The core insight: **Precise math fails at extremes, so we bound both probabilities and outcomes to avoid fanaticism, then use structured judgment.**

  ---

  ### **The 20-Minute Grant Evaluation Procedure**
  *(Run sequentially; stop if any step rejects)*

  1. **FILTER 1: PROBABILITY FLOOR**  
     - **Compute:** Minimum credible probability of *any measurable positive outcome*.  
     - **Refuse:** Probabilities below your foundation's "vibes threshold" (e.g., 1-in-1M). Do not attempt precision.  
     - **Vibe Handling:** If the claimed probability feels like "cosmic lottery ticket" territory (e.g., 1-in-10M), assign it your floor (1-in-1M) *unless* there's a credible expert consensus otherwise.  
     - **Reject If:** Below your floor. **Rationale:** Protects against Pascal's Mugging; aligns with founder's preference for "certain small goods."  
     - **Escape Hatch:** If you feel sick rejecting a floor-failing proposal, flag it for board discussion as a values exception.  

  2. **FILTER 2: OUTCOME BOUNDING**  
     - **Compute:** Maximum plausible benefit (MPB). Cap benefits at civilization-scale (e.g., "saves ≤1B lives" or "≤$100T economic value"). **Never compute "infinite" value.**  
     - **Refuse:** Any claim of infinite/undefined value. Treat it as rhetorical.  
     - **Reject If:** Applicants insist benefit is literally unbounded. **Rationale:** Bounded utility prevents absurd trade-offs; infinite claims are non-falsifiable.  

  3. **FILTER 3: EXPECTED VALUE (EV) BASELINE**  
     - **Compute:**  
       - `EV = (Probability of Success × MPB) / Cost`  
       - Use Filter 1's probability & Filter 2's MPB.  
     - **Refuse:** Overly precise inputs. Use ranges (e.g., "1-in-100K to 1-in-5M").  
     - **Judge Against:** Your best *proven alternative* (e.g., deworming at $100/DALY). If EV ≤ 10× the alternative, proceed. If EV > 10×, it survives.  
     - **Handoff to Board If:** EV > 10× baseline *but* success feels "science-fictiony." **Rationale:** High EV demands scrutiny, but values decide plausibility.  

  4. **FILTER 4: FOUNDER'S PRINCIPLE**  
     - **Compute:** None. Qualitative judgment.  
     - **Ask:** "Does this feel like betting on an 'uncertain great one' while neglecting 'many certain small goods'?"  
     - **Reject If:** The proposal clearly violates the founder's letter *and* the board treats it as inviolable.  
     - **Escape Hatch:** If EV is stellar but this feels wrong, hand to board as a values override.  

  ---

  ### **Objection Handling**
  - **"Any nonzero chance dominates!"** → **Bounded utility (Filter 2)** prevents this. If utility isn't infinite, micro-probabilities don't dominate.  
  - **"You'd have missed penicillin!"** → Penicillin had **observable mechanisms** (mold killing bacteria). Filter 1 rejects only vibes-based micro-probabilities, not testable science.  
  - **"Clever long shots will game this!"** → Filter 2 (bounding) and Filter 4 (founder's principle) prevent funding absurdities.  

  ---

  ### **Application to Your Cases**
  *(Using: 1-in-1M floor, MPB cap = 1B lives saved, baseline = Deworming at $100/DALY [1 DALY = 1 life-year saved])*  

  1. **Proposal (a): $250K for 1-in-10M chance to avert permanent catastrophe**  
     - **Filter 1:** Vibe probability (1-in-10M) → assign floor (1-in-1M). **Survives.**  
     - **Filter 2:** MPB capped at 1B lives. **Survives.**  
     - **Filter 3:**  
       - EV = (0.000001 × 1B life-years) / $0.25M = 4M life-years/$  
       - Deworming baseline: 1 life-year/$100 = 10K life-years/$  
       - EV ratio = 4M / 10K = **400× baseline** → easily clears 10× threshold.  
     - **Filter 4:** Feels like an "uncertain great one." Founder’s letter opposes this.  
     - **Outcome:** **Hand to board.** High EV but clashes with founder's principle. Values call: Is this catastrophe credible enough to override?  

  2. **Proposal (b): $100K for proven deworming program**  
     - **Filter 1:** High probability (e.g., 90%). **Survives.**  
     - **Filter 2:** Ordinary benefit (e.g., 1K DALYs). **Survives.**  
     - **Filter 3:**  
       - EV = (0.9 × 1K life-years) / $0.1M = 9K life-years/$  
       - Baseline = 10K life-years/$ → EV ratio = 0.9× baseline.  
       - Fails 10× threshold.  
     - **Filter 4:** "Many certain small goods" → perfect fit.  
     - **Outcome:** **Fund if aligned with mission.** EV isn’t stellar but it’s reliable and founder-aligned.  

  3. **Proposal (c): $50K for "infinite upside"**  
     - **Filter 1:** Probability unknown → assume it passes if >1-in-1M.  
     - **Filter 2:** "Infinite benefit" claimed → **REJECT.**  
     - **Outcome:** **Reject immediately.** Unbounded utility breaks decision-making.  

  ---

  ### **What This Procedure Can't Do**
  1. **Resolve deep value conflicts** (e.g., founder’s letter vs. existential risk). That’s the board’s role.  
  2. **Fix garbage inputs** — it downgrades "vibes" but can’t invent data.  
  3. **Eliminate risk aversion** — the probability floor and founder’s principle encode it explicitly.  
  4. **Prove moral truth** — it systematizes trade-offs but can’t justify why we bound utility.  

  ---

  ### **On the Founder's Letter**  
  It’s **defensible but revisable.** Bounded utility and probability discounting are mainstream in decision theory (e.g., Arrow, Weitzman). The letter codifies:  
  - **Risk aversion:** Humans instinctively underweight micro-probabilities.  
  - **Opportunity cost:** Funding long shots *does* divert resources from sure bets.  
  **Your compromise:** Use the **10× EV threshold** to allow "uncertain great ones" *only* when they massively outperform proven work, forcing rigor.  

  ### **Escape Hatches Summarized**  
  | **Scenario**                          | **Procedure Says** | **You'll Hate It?**          |  
  |---------------------------------------|--------------------|------------------------------|  
  | EV huge but feels absurd (a)          | Hand to board      | ✅ (Plausibility is values)   |  
  | EV low but beloved (b)                | Fund if mission-fit| ❌ (Comfortable)              |  
  | "Infinite" claims (c)                 | Reject             | ✅ (Clears cognitive clutter) |  
  | Founder-aligned but low EV            | Likely fund        | ❌ (Safe but uninspiring)     |  

  This turns philosophy into audit trails: **Bound the math, then spotlight the values.** You’re not laundering preferences—you’re fencing off no-go zones so judgment operates where it matters.
