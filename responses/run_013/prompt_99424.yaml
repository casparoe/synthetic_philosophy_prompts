prompt: |-
  I'm supervising a grad student whose chapter draft keeps leaning on the same move: culture evolves by natural selection, memes are the cultural analogue of genes, so when a belief or a tune or a fashion spreads and sticks it's because it got selected for, and it can spread even when it's bad for the people carrying it — Dawkins's old point that the meme doesn't care about the host. He's got the standard cites (the 1976 book where Dawkins coins the thing, Blackmore's The Meme Machine) and he treats the analogy as if it's already been earned. I don't think it's that simple, but I also don't want to just say "culture is more complicated." Can you audit the analogy properly?

  What I want: a correspondence table first — what's supposed to map onto the gene, the genotype/phenotype distinction, the mutation rate, the selection pressure, drift, recombination, the germ-line/soma wall, species boundaries. Then the places the mapping actually breaks, and be honest about which breaks are fatal versus merely untidy. Some of the obvious candidates: copying fidelity, whether cultural "units" are even discrete, whether there's any clean vehicle/replicator split, whether inheritance is blending or particulate, whether it's Lamarckian (acquired stuff gets passed on directly), and the fact that a lot of transmission is reconstructive rather than replicative — the Sperber / cultural-attraction crowd make a lot of that last one, and I'd like you to say whether it kills the meme-as-replicator picture outright or just narrows it to a few special cases.

  Then the part I actually care about: the student's conclusion is that cultural change is Darwinian all the way down, and that this explains why harmful things spread. Does the analogy carry that, or was the conclusion riding on the analogy the whole time? Which disanalogies are load-bearing for that specific claim, and which ones don't matter for it? And if the meme frame is the wrong one, what's the better frame — the epidemiology-of-representations thing, dual-inheritance models, something else — and what does the better frame predict differently about, say, why a costly religious practice persists?

  Skip the bibliography, I know the literature — give me the audit and tell me which single sub-question the whole thing hinges on.
reasoning: |-
  Okay, the user is supervising a grad student whose chapter draft relies heavily on the meme-gene analogy. The student argues that culture evolves by natural selection, similar to genes, and uses Dawkins and Blackmore as references. The user feels the analogy is oversimplified and wants a thorough audit without just saying "culture is more complicated." 

  First, I need to map the key components of biological evolution to their supposed cultural counterparts. The student equates memes with genes, but I should check if this mapping holds. Important distinctions like genotype/phenotype in biology might not have clear equivalents in culture. For example, in biology, genotype (genetic code) and phenotype (observable traits) are distinct, but in culture, the meme (idea) and its expression (behavior) might blur. 

  Next, mutation rate: in biology, it's random and low-fidelity due to copying errors. In culture, mutations are frequent and intentional. People modify ideas when transmitting them, which isn't random. Selection pressure in biology comes from environmental factors, but in culture, it's influenced by cognitive biases, social structures, etc. Genetic drift (random changes) might have a parallel in cultural drift, but cultural changes often have intentional drivers. Recombination in biology is structured (e.g., meiosis), but in culture, it's more about blending ideas, which can be Lamarckian since acquired changes are passed on.

  The germ-line/soma separation in biology prevents somatic changes from affecting offspring. Culture lacks this; any change can be transmitted immediately. Species boundaries are clear in biology but fuzzy in culture due to horizontal transmission and blending.

  Now, where does the analogy break? Copying fidelity is a big issue. Memes aren't copied exactly; they're reconstructed based on cognitive frameworks, as Sperber's cultural attraction theory suggests. This challenges the meme-as-replicator idea because it's not high-fidelity replication. Also, cultural units aren't discrete like genes. Beliefs or practices aren't atomic; they're intertwined. The vehicle/replicator split isn't clean since the host's cognition actively shapes the meme.

  Inheritance in culture is blending and Lamarckian, unlike particulate Mendelian genetics. This affects how traits are passed on. The lack of a germ-line/soma wall means changes are immediately heritable, leading to faster evolution but less stability.

  Are these breaks fatal? The reconstruction point (Sperber) might be critical. If transmission is reconstructive, it's not replicative. This could kill the meme-as-replicator model, limiting it to cases like chain letters or internet trends with high fidelity. Otherwise, the analogy doesn't hold broadly.

  The student's conclusion that harmful cultural traits spread due to selection pressures might still hold under a different framework. The user wants to know if the analogy is necessary for this point. Harmful traits can spread through maladaptive cultural evolution without strict memetics. For example, costly religious practices might persist because of cognitive biases (e.g., credibility enhancing displays) or group-level benefits, not meme selfishness.

  Alternative frameworks like epidemiology of representations (Sperber) or dual-inheritance theory (Boyd and Richerson) might be better. These models incorporate cognitive biases and social learning, explaining persistence of harmful practices through mechanisms like conformist bias or prestige bias. Dual-inheritance theory shows gene-culture coevolution, where cultural traits can spread despite individual costs if they confer group benefits.

  The key hinge is whether cultural transmission is high-fidelity replication. If not, the meme model fails. The better frame is dual-inheritance or epidemiological models, which predict that harmful practices persist due to biased transmission mechanisms, not selfish replicators.
answer: |-
  Here's a structural audit of the meme-gene analogy, identifying load-bearing disanalogies and assessing their impact on your student's core claim about harmful cultural traits. The critical hinge is **copying fidelity vs. reconstructivity**.

  ### Correspondence Table (Ideal Mapping)
  | Biological Concept          | Alleged Cultural Analog          |
  | :-------------------------- | :------------------------------- |
  | **Gene**                    | **Meme** (belief, tune, fashion unit) |
  | **Genotype**                | Mental representation of meme    |
  | **Phenotype**               | Behavior/artifact expressing meme|
  | **Mutation Rate**           | Error rate in imitation/teaching |
  | **Selection Pressure**      | Cognitive/social/environmental filters |
  | **Drift (Neutral Evolution)**| Random copying errors/changes    |
  | **Recombination**           | Blending/remixing of ideas       |
  | **Germ-line/Soma Wall**     | Cultural "inheritance channel" vs. individual expression |
  | **Species Boundaries**      | Isolated cultural traditions     |

  ### Key Disanalogies & Severity Assessment
  1.  **Copying Fidelity (FATAL):**
      *   *Biological:* DNA replication is high-fidelity (error-checked). Mutations are *accidental*.
      *   *Cultural:* Transmission is typically **reconstructive**, not replicative (Sperber). Humans reinterpret information based on prior knowledge, biases, and context. "Mutations" are often *intentional* or *driven by cognitive attractors*.
      *   *Severity:* **Fatal to the core replicator analogy.** If units aren't reliably copied, the "selfish replicator" logic (Dawkins' core point) collapses. Memes aren't passively copied viruses; they're actively reconstructed hosts. This undermines the "meme doesn't care" premise – the *host's cognition* critically shapes the "meme."

  2.  **Discreteness of Units (SEVERE):**
      *   *Biological:* Genes are discrete, particulate units (nucleotide sequences).
      *   *Cultural:* "Memes" are rarely discrete. Beliefs/fashions/tunes are complex constellations, context-dependent, and lack clear boundaries. What is the "unit" of a religion or a musical genre?
      *   *Severity:* **Severe.** Without discrete units, defining selection, mutation, or recombination becomes arbitrary. Selection acts on fuzzy, emergent phenomena, not genes.

  3.  **Vehicle/Replicator Split & Germ-line/Soma (SEVERE):**
      *   *Biological:* Clear distinction: Genes (replicator) are copied; Bodies (vehicle) are selected. Germ-line protects replicator line.
      *   *Cultural:* No clean split. The "vehicle" (human brain) *is* the site of active reconstruction and selection. There's no protected "germ-line"; every expression is a potential source of transmission (and mutation).
      *   *Severity:* **Severe.** Erodes the "selfish replicator" logic. The "host" isn't just a passive carrier; it's the active processor and modifier. Cultural change is driven *by* the host's needs and biases, not *despite* them in the same way a virus operates.

  4.  **Inheritance System (Lamarckian/Blending) (MODERATE):**
      *   *Biological:* Particulate (Mendelian), non-Lamarckian inheritance.
      *   *Cultural:* Inherently "Lamarckian" (acquired modifications transmitted) and often blending (ideas combine continuously).
      *   *Severity:* **Moderate.** Challenges strict Darwinian models relying on particulate inheritance, but population-level *statistical* selection can still occur on blended/Lamarckian traits. Doesn't kill selectionist thinking entirely, but changes its dynamics significantly.

  5.  **Selection Pressures (COMPLEX):**
      *   *Biological:* Primarily external environment, competition, predation.
      *   *Cultural:* Multi-layered: Cognitive biases (e.g., negativity bias, minimal counterintuitiveness), social biases (conformity, prestige), economic factors, *and* external environment. Selection is often *content-biased* by the brain's pre-existing structure.
      *   *Severity:* **Moderate/Untidy.** Selection still occurs, but the "environment" is dominated by human psychology and social structure, making it far messier and harder to isolate than biological environments. Strengthens the role of the "host".

  6.  **"Species" Boundaries & Transmission (MODERATE):**
      *   *Biological:* Vertical transmission dominant; horizontal transfer limited; species boundaries relatively clear.
      *   *Cultural:* Massive horizontal transmission; rampant cross-"lineage" borrowing; fuzzy boundaries.
      *   *Severity:* **Moderate/Untidy.** Makes phylogenies messy but doesn't preclude selection. Facilitates rapid spread, including potentially harmful traits.

  ### Does the Analogy Carry the "Harmful Things Spread" Conclusion?
  *   **Yes, but weakly and misleadingly:** The *observation* that harmful cultural traits spread is valid. The *explanation* via "selfish memes" **does not hold** under scrutiny due to the fatal disanalogy (#1: Reconstructivity). The analogy isn't carrying it; it's *obscuring* the actual mechanisms.
  *   **Load-Bearing Disanalogies for "Harmful Spreads":**
      *   **FATAL: Reconstructivity (#1):** The "meme doesn't care" logic *requires* high-fidelity replication *despite* host cost. Reconstructivity means the "meme's" persistence is *intrinsically linked* to how the host's mind *interprets and values it*, often *because* it resonates with biases (e.g., tapping into fear, identity, signaling) even if costly. The host *is* caring, just about something else (e.g., group belonging, perceived meaning).
      *   **SEVERE: Lack of Vehicle/Replicator Split (#3):** Harm persists because the *host actively reconstructs and values* the trait for reasons (psychological/social) that outweigh the cost, not because a replicator hijacks it.
      *   **MODERATE: Lamarckian/Blending (#4):** Allows rapid adaptation and persistence of complex, costly traits if they are reconstructed as valuable within the social/cognitive environment.

  ### The Better Frame: Dual-Inheritance Theory (Boyd & Richerson) + Epidemiology of Representations (Sperber)
  *   **Core Premise:** Cultural evolution is driven by *biased transmission* acting on information reconstructed by human minds within social structures. It co-evolves with genes.
  *   **Key Biases:**
      *   *Content Bias:* Attractiveness due to cognitive structure (e.g., minimally counterintuitive concepts, emotional resonance).
      *   *Model-Based Bias:* Copying based on prestige, success, similarity.
      *   *Frequency-Dependent Bias:* Conformity (copy the majority) or anti-conformity.
  *   **Prediction on Costly Religious Practice:**
      *   **Meme View:** "Selfish" meme hijacks hosts; cost is irrelevant to replication.
      *   **Dual-Inheritance/Epidemiology View:** The practice persists due to **biased transmission**:
          *   **Content Bias:** Offers compelling explanations, meaning, identity.
          *   **Model-Based Bias (Prestige/Conformity):** High-status individuals practice; the group norm demands it.
          *   **Credibility Enhancing Displays (CREDs):** Costliness *signals* true belief/commitment, making the *associated beliefs* more credible and transmissible.
          *   **Group Functionality (Controversial):** May enhance group cohesion/survival *despite* individual cost (cultural group selection).
      *   The cost itself can *become* a signal enhancing transmission, not a barrier ignored by a selfish replicator. It persists *because* the reconstructive minds within the social context *attribute value* to the cost (e.g., as sacrifice, commitment).

  ### The Single Hinge Question
  **Is cultural transmission fundamentally high-fidelity replication (allowing for "selfish" replicator dynamics) or is it fundamentally reconstructive (making host cognition and bias the load-bearing engine)?**

  *   **If high-fidelity replication holds:** The meme analogy (despite other disanalogies) *might* weakly support "selfish" spread of harmful traits. (But the evidence strongly argues against this).
  *   **If transmission is reconstructive (overwhelming evidence):** The core meme-as-replicator picture fails. Harmful traits spread due to **host cognitive and social biases** actively reconstructing and valuing them for reasons *other* than the harm itself (meaning, identity, signaling, conformity). The "selfishness" is an illusion; the host's mind is the driver, selecting reconstructions that fit its biases and social context, sometimes with maladaptive outcomes. This shifts the explanatory burden entirely to understanding the *biases* and *social structures* that make costly practices attractive or obligatory reconstructions. The student's conclusion is correct that harmful things *can* spread, but their mechanistic explanation via the meme analogy is fundamentally flawed.
