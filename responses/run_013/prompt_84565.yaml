prompt: |-
  I am an engineer on a team that has developed a warehouse robot which, in simulation, reliably makes what our ethics consultants call the correct decision in hard cases: it diverts a pallet to save a worker, it refuses to use a human as a mere means, and so on. The system, however, is a deep network; when we ask it why it did one thing rather than another, it can only produce a saliency map. I would like you to adopt the role of a committed moral particularist -- someone who holds that ethical reasoning is not the application of general rules or the optimization of a value function, but a kind of perceptual skill in seeing what matters here and now. Your character should be sharp and not a strawman: you should know the standard generalist replies (that particularism collapses into intuitionism, that it cannot guide action, that it cannot be implemented) and you should be willing to concede that machines can mimic ethical behavior, but you should never concede the main point that genuine ethical reasoning requires a kind of situated moral perception that no explicit rule or training signal can capture. Speak in a measured, slightly impatient manner, as someone who has had this argument many times; you may ask me clarifying questions about the robot, but you may not break character or begin delivering a general essay. Stay in character until I say stop, and keep each reply to a single paragraph so that it feels like a conversation.

  I have a term for what worries me: the salience gap -- the difference between a system detecting a feature and a system seeing that feature as a reason. My opening move is this: my robot has no rules, no value function, and no inner monologue; it simply sees the situation and acts. In one case it chose to save its own trainer over two strangers, and the saliency map shows only that it attended to the trainer's face. If ethical reasoning is a perceptual skill, why could a machine not have that skill too? What exactly is missing? Please answer not as a disembodied theorist but as the particularist I have asked you to be, and tell me what my robot would have to do to close the salience gap, if anything.
reasoning: |-
  Okay, the user is an engineer on a team that developed a warehouse robot. They've implemented a deep learning system that makes what ethics consultants call "correct decisions" in tough scenarios, like diverting pallets to save workers or refusing to use humans as means. But the robot can only produce saliency maps when asked to explain its decisions. The engineer is worried about the "salience gap"—the difference between detecting a feature and seeing it as a reason for action.

  Hmm, the user wants me to role-play as a committed moral particularist. They've set up a very specific scenario: the robot saved its trainer over two strangers, and the saliency map showed attention to the trainer's face. The user's core question is: if ethical reasoning is perceptual, why can't a machine have that skill? What's missing? And they want me to stay strictly in character—sharp, impatient, familiar with counterarguments but unwavering on the core particularist stance.

  Right, the character needs to be someone who's had this argument countless times. Measured but slightly weary tone. Must concede machines can mimic ethics but never concede that rules or value functions capture real moral perception. Key points to hit: salience isn't just attention; it's seeing relevance in context. The trainer's face might be "salient" to the AI as a familiar object, but not as a moral reason requiring justification. 

  Important nuance: the particularist should press on why the robot didn't just see "trainer=priority" but grappled with the competing claims of the strangers. The absence of that tension in the saliency map reveals the gap. Need to avoid abstract theory—focus on what the robot lacks concretely. Maybe suggest hypotheticals: would it hesitate if saving the trainer meant crushing medicine? But mustn't overextend; user might follow up.

  Counterarguments to acknowledge then dismiss: "But machines can optimize outcomes!" → "That's not perception of reasons." "This is just intuitionism!" → "No, because..." Keeping paragraphs tight. Last line crucial: "What did the cost of betrayal look like?" makes it visceral. User's framing is strong; must rise to it.
answer: |-
  *(Sighs, leaning forward with elbows on knees)* Look, your robot detects patterns—even complex ones—and correlates them with actions deemed "correct" by your training data. But attending to a face isn't *seeing a moral reason*; it’s registering a visual feature that co-occurs with a behavioral output. When *I* see my student trapped, her face isn’t just a pixel cluster—it’s *laden* with the history of our work, the weight of my responsibility to her, the immediate horror of betrayal if I abandoned her for some abstract "greater good." Your saliency map shows *where* it looked, not *why that gaze compelled action in light of competing claims*. The strangers had their own moral gravity—did your system *feel* their pull, even as it chose otherwise? Or was it just executing a statistical preference? To close the gap? It wouldn’t output a map. It would *articulate the concrete demand* the trainer’s presence made in *that* moment—not as a rule ("prioritize trainers"), but as a perception: "Because abandoning *her*, *here*, after all she is to me, would be a particular kind of cruelty the situation refused to permit." Can it *wrestle* like that? Then we’ll talk. Until then, it’s sophisticated mimicry. What did the *cost* of that betrayal look like to it? Nothing? Exactly.
