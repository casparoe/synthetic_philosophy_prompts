  ### Activity Design: The Damascus Dilemma  
  **Objective:** Create an experiential loop where students confront the Death-in-Damascus paradox without prior explanation, leading them to cycle through choices and confront the futility of "outsmarting" a perfect predictor.  

  ---

  ### **Materials**  
  - **18 Voting Tokens**: Two colors (e.g., blue for Damascus, red for Aleppo).  
  - **Prediction Box**: A sealed box with a false bottom/secret compartment (or a confederate assistant) to "predict" the majority choice.  
  - **Scoreboard**: Whiteboard or poster to track group survival rates per round (not individual scores to avoid chaos).  
  - **Timer**: For enforcing quick decisions.  
  - **Optional**: Coin for randomization (if students suggest it).  

  ---

  ### **Rules & Setup**  
  1. **The Scenario** (5 mins):  
     - *You say*: "You’re travelers in the ancient world. Death is coming for you tomorrow. You must choose to sleep in **Damascus** (blue token) or **Aleppo** (red token). If Death is in your city, you die (0 points). If not, you survive (1 point). Death is a perfect predictor—it knows what you’ll choose and will be in that city. But you haven’t chosen yet. Your goal: survive as many rounds as possible."  
     - Emphasize: **No communication between players** during rounds.  

  2. **Prediction Mechanism** (Key to "accuracy"):  
     - Before each round, collect tokens in the Prediction Box. The box has a hidden divider/trapdoor. You (or an assistant) secretly note the majority choice while "sealing" the prediction.  
     - *The Trick*: After tokens are cast, "reveal" a pre-written prediction slip from the box (actually written *after* seeing votes). Announce: *"Death predicted the majority would choose [city]."*  
     - Why it works: You’re using the *actual outcome* as the "prediction," ensuring 100% accuracy. Students see a self-fulfilling prophecy.  

  3. **Payoff Scheme**:  
     - **Survive (1 pt)**: If you’re in the **minority** city.  
     - **Die (0 pts)**: If you’re in the **majority** (predicted) city.  
     - **Tiebreaker**: Split votes (e.g., 9-9)? Flip a coin to decide Death’s location. Half die, half survive.  

  ---

  ### **Timeline (75 mins total)**  
  #### **Phase 1: Introduction (10 mins)**  
  - Explain rules, distribute tokens, demo the Prediction Box.  
  - *Crucial framing*: "Death’s prediction is locked in *before* you choose. You’re trying to outwit it."  

  #### **Phase 2: Activity Rounds (30 mins, 5 rounds × 6 mins each)**  
  - **Round 1 (Naive Choice)**:  
    - *What happens*: Most choose randomly. Prediction "reveals" majority (e.g., 12 Damascus, 6 Aleppo → Death in Damascus).  
    - *Result*: Majority (Damascus) dies. Minority (Aleppo) survives.  
    - *Student reaction*: "I should avoid the popular choice!"  

  - **Round 2 (First Flip)**:  
    - *What happens*: Survivors (Aleppo) urge switching. Many flee to the "safer" city (Damascus). New majority flips (e.g., 14 Damascus, 4 Aleppo → Death in Damascus).  
    - *Result*: Most die again. Minority survives.  
    - *Student reaction*: "Switching backfired! I should’ve stayed?"  

  - **Round 3 (The Loop)**:  
    - *What happens*: Chaos. Some revert to Round 1 choices; others double-down on switching. Majority oscillates (e.g., 5 Damascus, 13 Aleppo → Death in Aleppo).  
    - *Result*: Another mass death. Frustration mounts.  
    - *Key moment*: Point out the pattern: "Whatever you commit to, Death follows."  

  - **Rounds 4–5 (Breaking Strategies)**:  
    - *Encourage experimentation*: If someone suggests randomization (e.g., coin flip), let them. If they refuse to play, note it. If they propose a "third city," say: "Death only tracks Damascus/Aleppo—you must pick one."  
    - *Result*: Randomizers survive 50% of the time (by luck). Non-players "die" by default (0 pts).  

  #### **Phase 3: Debrief (35 mins)**  
  1. **Elicit Reactions** (10 mins):  
     - Ask:  
       - *"What strategy worked? Did anyone feel trapped?"*  
       - *"Did switching cities help? What about randomness?"*  
     - Highlight the loop: "You thought Aleppo was safe → everyone went → it became deadly → you fled to Damascus → same thing happened."  

  2. **Map to Death-in-Damascus** (10 mins):  
     - Tell the story: *"Death says: ‘I expected you in Aleppo—why were you in Damascus yesterday?’ Whatever you choose, Death was ‘always going’ to be there."*  
     - Connect to gameplay:  
       - Your choice **caused** Death’s location (self-fulfilling prophecy).  
       - Your choice was **evidence** of the prediction (fixed in the past).  

  3. **Decision Theory Distinctions** (15 mins):  
     - **Evidential vs. Causal Decision Theory**:  
       - *Evidential*: Choosing Damascus is *evidence* Death predicted it → you die. Same for Aleppo → paralysis.  
       - *Causal*: Your choice doesn’t *cause* the prediction (it’s past/fixed) → "I’m free!" But then why do you always die?  
     - **The Loop’s Escape**:  
       - Randomization breaks the *psychological* loop but not the *predictor’s accuracy* (if Death knows your coin flip, you still die).  
       - Refusing to play? Death "predicts" your refusal → you die.  
       - Third city? Not in the rules—the paradox assumes binary choices.  
     - **The Stakes**: When all options seem equally bad, decision theory needs a "tiebreaker" (e.g., randomize or pick arbitrarily).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students don’t grasp the prediction trick.  
     - *Fix*: After the activity, confess: *"I simulated a perfect predictor by using your votes—but in the real paradox, Death knows your choice *before* you make it."*  

  2. **Problem**: The group vote dilutes individual responsibility.  
     - *Fix*: Stress: *"This is a group analog of the individual dilemma. Your personal choice still triggered the loop."*  

  3. **Problem**: Randomizers "win," undermining the paradox.  
     - *Fix*: Explain: *"Randomizing *feels* like a win, but if Death predicts your coin flip, you still die. Our game’s predictor couldn’t ‘see’ your dice—Death can."*  

  ### **What the Activity Can’t Replicate**  
  - **The Ontological Punch**: The horror of realizing **no choice escapes fate** requires narrative immersion. After the game, tell the full story with dramatic flair to cement the paradox.  
  - **Predictor’s Omniscience**: The game fakes prediction accuracy; you must clarify that true omniscience makes randomization futile.  

  ---

  ### **Why This Works**  
  - **Loop Structure**: Each round’s outcome argues *against* the previous strategy, forcing the flip (Damascus → Aleppo → Damascus).  
  - **Emergent Strategies**: Randomization/defiance arise organically—use them to explore decision theory’s "emergency exits."  
  - **No Prep Needed**: Students need no prior reading. The activity *is* the primer.  

  By the end, students will viscerally grasp the loop, setting up your lecture on causal vs. evidential reasoning. The key: let them walk into the trap, struggle, and only then reveal the name "Death-in-Damascus."
