     - Then, reveal the actual count: "The actual choices: Damascus: X, Aleppo: Y. So the majority is [same as prediction]."
     - Then: "If you chose [predicted city], you die: 0 points. If you chose the other, you survive: 1 point."
     - Have them record the outcome.

     Round 2-5: same.

     After 5 rounds, move to debrief.

     Debrief:

     Start by asking:
     - "How many survived all five rounds?" (Probably none or very few)
     - "How many points did you get? What was your strategy?"
     - "Did anyone change strategies? What happened?"

     Then, tell the Death-in-Damascus story.

     Then, draw the loop on the board.

     Then, discuss the decision theory implications.

     Then, discuss attempted solutions (randomization, third city, etc.).

     Finally, wrap up by naming the paradox and explaining that it highlights challenges in decision theory.

     What if during the activity someone says: "I want to go to a third city!"? 
     - Respond: "The rules of the activity only allow Damascus or Aleppo. Death is only looking in these two cities."

     What if they refuse to choose?
     - "If you don't choose, then we assign you to a city at random." Or: "You must choose to participate." 

     But they are students, so they will choose.

     What predictably goes wrong:
     - Time: counting 18 slips might take 2-3 minutes. We budgeted 3 min per round. If we have two piles, we can count quickly. Practice beforehand.
     - Tie: with 18, ties are possible (9-9). We flip a coin. That adds a bit of time.
     - Some students might not understand and we have to explain again.

     How to handle: be efficient and keep the pace.

     Also, in the debrief, they might get stuck on the faking of the prediction. We can admit: "Yes, we simulated a perfect predictor by using the actual outcome. In the real paradox, the prediction is made before and is perfect, which we cannot do in a live activity. But the dilemma is the same."

     That's the design.
