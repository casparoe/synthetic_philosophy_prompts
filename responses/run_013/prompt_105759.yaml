prompt: |-
  Ok so I keep going back and forth with a friend about the Church-Turing thesis and I want your actual numbers, not a tour of the positions. Two claims to price. (1) Every function computable by any physically realizable device -- quantum, analog, or whatever we might eventually build, including a setup that hands an observer the answer to a halting-type question by letting an infinite amount of computation run in the device while only a finite time passes for the observer -- is also Turing-computable. (2) The thesis is at bottom a stipulation about what we choose to mean by "computable" rather than a substantive, falsifiable claim about the world. Give me your credence in each, and decompose it: the sub-questions the number rests on (e.g. whether the physical version is even a well-defined empirical claim, whether continuous/analog physical states could smuggle in non-computable outputs, whether "humanly computable" and "machine computable" should be equated at all, plus anything else you think belongs), a rough probability for each, how they combine, and which single sub-question your number is most sensitive to. Then tell me what argument or result would move each number the most, and by roughly how much.

  Then lay it out as a JSON object per claim, with fields: claim (restate in one sentence), credence (0-1), sub_questions (array of objects with sub_question, probability, why), combination (one line on how the sub-questions roll up), most_sensitive (the sub-question that moves the number most), what_would_move_it (the evidence or argument that would shift it, and roughly by how much). Keep each why to a line.
