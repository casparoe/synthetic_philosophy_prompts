answer: |-
  Here’s the structured interview script, designed to push her positions into concrete commitments while respecting your constraints:

  ---

  ### **Openers**  
  *(Short, provocative questions to set stakes)*  
  1. **"If custody determines meaning more than content, does that make every archive a palimpsest of power struggles?"**  
     *Why not throwaway:* Forces her to confront the *political* dimension upfront, not just process.  
  2. **"When an archivist spares a document from destruction, are they co-authoring its future significance?"**  
     *Why not throwaway:* Targets her "power to destroy" claim and implicates archivists as active agents.  

  ---

  ### **Custody, Stated Plainly**  
  *(Questions forcing boundaries: what does the thesis *exclude*?)*  
  1. **Question:** "Does custody theory erase authorial intent entirely, or just subordinate it?"  
     *Likely Answer:* "Intent isn’t irrelevant, but custody shapes how we *receive* it."  
     **Follow-up:** "If a diary’s survival hinges on a censor’s oversight, does that *override* the diarist’s intent—or just contextualize it? Where’s the line?"  

  2. **Question:** "Is every source equally compromised by its custody chain, or are some 'less distorted'?"  
     *Likely Answer:* "All sources are mediated by power, but distortion isn’t uniform—context matters."  
     **Follow-up:** "If distortion is variable, what methodological tool *besides custody* helps historians gauge reliability? Or is custody the ultimate metric?"  

  3. **Question:** "What popular archival practice does your thesis directly invalidate?"  
     *Likely Answer:* "The myth of 'neutral selection'—archives aren’t organic; they’re curated by power."  
     **Follow-up:** "Doesn’t 'curated by power' just restate critiques from Derrida or Foucault? What’s *new* in reducing meaning to custody?"  

  ---

  ### **Where It Breaks**  
  *(Counterexamples pressing vulnerabilities)*  
  1. **Question:** **"Take a shoebox of love letters passed down privately—never institutionally curated. By your thesis, is it 'untainted' evidence, or still shaped by power?"**  
     *Likely Answer:* "Power operated in whose letters were *written*, saved, or deemed 'worth' keeping—even privately."  
     **Follow-up:** "But if power pervades even intimate acts, doesn’t your thesis collapse into determinism? Is *any* document free of custody’s shadow?"  

  2. **Question:** **"Multispectral imaging recovers text scraped off a medieval charter, revealing a woman’s erased property claim. Does this *repair* a silence—or launder the original erasure?"**  
     *Likely Answer:* "Laundering: the erasure *happened*; tech just exposes the violence embedded in the artifact."  
     **Follow-up:** "If physical recovery of silenced voices doesn’t count as repair, what *would*? Or is all post-hoc access just laundering?"  

  3. **Question:** **"You dismiss 'reading against the grain' to recover subaltern voices. But isn’t that precisely how we use, say, colonial court records to find Indigenous agency?"**  
     *Likely Answer:* "Those voices are still filtered through the colonizer’s archive. Custody dictates the frame."  
     **Follow-up:** "If recovering subaltern perspectives from hostile sources is methodologically naive, what *can* historians do besides chronicle the custodian’s power?"  

  ---

  ### **Digitization**  
  *(Pressing the "laundering" claim)*  
  1. **Question:** **"Is all digitization inherently laundering, or just poorly contextualized projects?"**  
     *Likely Answer:* "Inherently: scanners inherit prior curation, then mask silences behind 'accessibility' rhetoric."  
     **Follow-up:** "Could digitization *expose* gaps by visualizing metadata on destruction/selection? Or is the medium itself poisoned?"  

  2. **Question:** **"You say digitized archives make gaps *harder* to notice. But doesn’t keyword searching starkly reveal omissions (e.g., no hits for 'unionize' in factory records)?"**  
     *Likely Answer:* "Absence is visible only if you know what to seek. Digitization naturalizes the archive’s boundaries."  
     **Follow-up:** "If archivists tagged *why* documents were missing (e.g., 'destroyed in 1953 purge'), would that satisfy your concern—or still be laundering?"  

  ---

  ### **The One She Can’t Deflect**  
  *(Closing trap: "causal not epistemic" deflection fails here)*  
  **Question:** **"If custody determines what *counts* as evidence (e.g., a surviving purge file vs. a destroyed one), how can historians *ever* draw conclusions without endorsing the custodian’s epistemology?"**  
  *(No follow-up needed: This directly ties custody to the *legitimacy* of historical knowledge, forcing her to admit epistemic stakes or reframe her thesis.)*

  ---

  ### Why This Works  
  - **The counterexamples** (shoebox, multispectral imaging) trap her: denying their force makes her seem dogmatic; engaging risks conceding custody isn’t all-encompassing.  
  - **"What does this rule *out*?"** questions prevent restating the thesis. She must define limits.  
  - **The closer** exploits her deflection’s weakness: If custody shapes *what evidence exists*, it’s unavoidably epistemic.  
  - **Follow-ups** anticipate her moves and escalate tension ("Does this collapse into determinism?", "Is *any* document free?").  

  Tailor follow-up aggression to your style—this script lets you pivot between critique and curiosity.
