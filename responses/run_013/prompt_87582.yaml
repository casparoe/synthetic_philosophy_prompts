  Now, I need to build the questions as specified. Start with Openers: two short questions to frame the discussion without being throwaway. For the first, something about why custody overshadows content—this sets the stage. For the second, ask how an archivist's power shapes what survives, which ties into her focus on destruction and preservation. That should draw out her core views quickly.

  For Custody stated plainly, three questions that force her to say what the thesis rules out. I'll include one on whether she's dismissing authorial intent entirely, which she'll likely deflect by saying it's a different question. Follow up by asking what custody adds beyond provenance, since provenance is already a known concept. Another question on whether every source is equally compromised—she'll say no, it's about context. Follow up by asking how we can trust any source if custody shapes it so much. A third on what the thesis rules out, to make her define its boundaries. Follow up on how it differs from saying "history is written by the winners" to push for uniqueness.

  Where it breaks: three questions on counterexamples. First, the shoebox of family letters—she might say it's still shaped by power dynamics, like whose letters weren't kept. Follow up by asking if that means no archive escapes power, which could make her theory seem all-encompassing. Second, a case where erased text is recovered—does this repair or launder silence? She'll likely call it laundering because the original silence happened. Follow up by asking why new access isn't a form of repair, challenging her stance. Third, on her dismissal of "reading against the grain"—she might say it's naive. Follow up by asking why recovering voices isn't valid, linking to the shoebox example.

  Digitization: two questions. First, on whether digitization is inherently laundering—she'll say yes. Follow up by asking if it could ever be reformed. Second, on gaps being harder to notice—she'll say yes. Follow up by asking how to make silences visible, pushing for solutions.

  Finally, The one she can't deflect: a closing question where her "causal not epistemic" deflection doesn't work. Focus on how custody determines what counts as evidence, forcing her to admit it has epistemic effects. This should corner her nicely.

