  ## The Parish Pump: Correspondence with the Vicar
  *(From the July Edition of St. Botolph’s Parish Magazine)*

  **Dear Vicar,**
  My neighbour, Mr. Henderson, insists Jesus physically rose from the dead, bones and all, like Lazarus but permanent. Mrs. Thistlethwaite at the WI says it’s a beautiful spiritual metaphor. I need to know plainly: did it *actually happen*, as a real event in history? I feel I can’t move forward until I know.
  *Yours seeking clarity,*
  *Percy Finch (Rose Cottage)*

  *Dear Percy,*
  Thank you for your earnest question, which touches the very heart of our practice. The difficulty lies in what we mean by “actually happen” when speaking of such things. Consider the difference between stating a fact about the weather and declaring love for one’s child. Both are real, but their reality operates within different spheres of life, with different rules. The Resurrection is not a past event we verify like the date of the Battle of Hastings; it is the central hinge upon which the entire picture of Christian life turns. It shapes our Sundays, our hymns, our hope in the face of loss, and the way we treat each other. To ask for historical evidence *as if it were such a battle* is perhaps to misunderstand the kind of statement it is. Its “truth” is shown in the life it generates and sustains, like the reality of a promise is shown in its being kept, not dissected. Does the sun “actually” rise? We speak and live as if it does, and that is its force.
  *Yours in the shared practice,*
  *The Vicar*

  **Dear Vicar,**
  My son, Thomas (he’s 19), came home from university saying he “doesn’t believe in God anymore.” He says it’s all illogical. My heart is breaking. What arguments can I give him to bring him back to faith? I feel I’ve failed.
  *A Worried Mother*

  *Dear Worried Mother,*
  Please set aside the thought of failure. Your love is evident, and that is the truest testimony. Arguments about logic often sail past the harbour of belief. Faith isn’t primarily an intellectual hypothesis one adopts after weighing evidence; it’s more like the ground you stand on, or the language you speak at home. Thomas is currently speaking a different dialect, one focused on proofs and propositions. Trying to counter his arguments directly might only entrench him further in that mode of thinking. Instead, perhaps focus on the *life* he knew here: the rhythm of the seasons in church, the comfort of familiar hymns, the quiet acts of kindness modelled by the community. Continue to live that life openly and gently. Share the stories that shaped you, not as proofs, but as pictures of how we navigate the world. Invite him to Christmas carols, not to convert him, but because it’s *home*. If the picture holds value, it may yet draw him back into the practice. The light is seen from within the room.
  *Yours in hope,*
  *The Vicar*

  **Dear Vicar,**
  My fiancée and I want to be married in St. Botolph’s. It’s where our families have always been. The problem is, honestly, we don’t really believe every single word of the Creed, especially some of the older bits. Does that mean we can’t be married here? We love the church and the community.
  *Hopeful but Hesitant*

  *Dear Hopeful but Hesitant,*
  The Creed is not a checklist for intellectual assent before participation is permitted. It is the grammar of our communal language, the framework within which we express our shared life and hopes. Think of it like the rules of a cherished game, or the constitution of a valued club. You learn it by heart not because you vote on each clause annually, but because it defines the practice you are joining. Being married in the church signifies your desire to place your life together within *this* particular story, this tradition, this community shaped by these words. It’s about commitment to the form of life they represent – the love, forgiveness, and hope enacted here – rather than signing off on each historical or metaphysical proposition as one might verify a scientific theory. If you feel drawn to weave your story into *this* tapestry, and commit to learning its patterns, then the door is open. The belief grows with the belonging.
  *Yours in shared tradition,*
  *The Vicar*

  **Dear Vicar,**
  Please settle a dispute. I distinctly saw Mrs. Ainsworth take three helpings of trifle at the Jubilee tea, after she loudly announced she was “watching her figure.” Marjorie Pringle says she only took two, and that I’m spreading malicious gossip. Who is right? This is causing unpleasantness at the Altar Guild.
  *Seeking Truth (Name Withheld)*

  *Dear Seeking Truth,*
  The desire for a final, impartial arbiter of fact is understandable. Yet, in matters like these – memories of trifle consumption at a crowded event – the pursuit of absolute certainty often obscures more than it reveals. What matters far more than the precise number of helpings (a number now lost to the conflicting currents of perception and recollection) is the life of the community. Does dwelling on this detail build up the Body of Christ? Does it foster charity, kindness, or peace? Or does it entrench division and harden hearts? The “truth” we are called to embody is not a forensic reconstruction of a moment past, but the living reality of forgiveness, reconciliation, and grace practised *now*. Might I suggest offering the hand of fellowship to both parties, acknowledging the frailty of memory and perception we all share, and letting the trifle rest in peace? Focus on the shared cup, not the disputed spoonfuls.
  *Yours in practical peace,*
  *The Vicar*

  **Dear Vicar,**
  Following our recent conversation, and given some… *atypical* phrasing noted in your previous columns, I require clarification for diocesan records. Please state, succinctly and plainly, the core factual propositions concerning God, Christ, and Salvation that St. Botolph’s Parish officially teaches and requires its members to affirm. This is a matter of doctrine and church discipline.
  *Yours in Christ,*
  *+The Right Reverend Michael Thorne, Bishop of Barchester*

  *Dear Bishop Thorne,*
  Thank you for your letter and the opportunity to clarify. The life of St. Botolph’s is woven from the practices, stories, and rituals passed down through generations: the Eucharist shared, the scriptures read within our walls, the psalms sung, the seasons marked, the sick comforted, the fallen buried, the children baptised, the quarrels (sometimes) reconciled. Within this living tapestry, certain words – God, Christ, Salvation, Resurrection – function not as isolated propositions demanding intellectual assent, but as the load-bearing walls and beams of the entire structure. They gain their meaning *from* this shared life, not prior to it. To extract them as “core factual propositions” would be akin to presenting the rules of grammar divorced from any living language, or the blueprint of a house no one inhabits. What we “teach” is inseparable from what we *do* together. The Creed points to the depth and shape of that doing; it is the map, not the territory walked. To state propositions *as if* they were free-standing facts outside of this practice… that would be to step into a different language-game altogether, one which risks losing the very thing we cherish. The parish teaches by living its life. Any attempt to distil that life into a list of required affirmations would, I fear, misrepresent its nature.
  *Yours in the shared endeavour,*
  *The Vicar*
