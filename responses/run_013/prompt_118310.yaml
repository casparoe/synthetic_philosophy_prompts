  5. New hires learn through imitation
  6. Deviation causes brief disruption/irritation but no moral condemnation

  Key theoretical frameworks to consider:
  - Lewis (common knowledge): Requires mutual expectations and preference for conformity conditional on others' conformity
  - Evolutionary: Focuses on stable patterns emerging from imitation/learning without requiring conscious awareness
  - Normative expectations: Turns on whether deviation triggers resentment (moral reproach) vs mere annoyance

  Applying Lewis: This seems to fit perfectly. There's a coordination problem (avoiding language chaos), mutual expectations are demonstrated by the reaction to deviation (stalling, irritation), and conformity is preferred only because others conform (since either language would work equally well alone).

  Evolutionary view: Also fits well - it emerged spontaneously, persists through imitation, and is stable. But the philosopher's "bless you" ruling suggests she requires a coordination problem, which this view might not strictly demand.

  Normative expectations: The irritation observed seems like the "impatience" she distinguished from moral reproach in the escalator case. No resentment or sense of wrongdoing, just disruption.

  The philosopher's record shows she: 
  - Requires a coordination problem (rules out "bless you")
  - Distinguishes irritation from moral reproach (escalator case)
  - Accepts unconscious conventions (people couldn't state the rule)
  - Values stability through mutual expectations (historic decree case)

  All signs point to her calling this a convention. The mild irritation aligns with her escalator ruling, and the coordination element is present unlike the "bless you" case. If pressed for a distinguishing test case, I'd propose one where disruption occurs without coordination problems to see if she still attributes convention status.

  Betting recommendation: Strongly favor convention verdict based on coordination + conditional preference + non-moral irritation. The evolutionary account might be her underlying mechanism explanation, but Lewis's framework best explains her pattern of judgments.
answer: |-
  Based on the philosopher's established rulings and the structure of the firm's language practice, I predict she will rule it **a convention**. Here's a breakdown using the frameworks compatible with her record, their predictions, and why Lewis's account is the strongest bet:

  ### Key Rules from Her Record
  1.  **Coordination Problem Required:** A convention must solve a coordination problem where the best choice depends on others' choices (driving side = convention; "bless you" = not).
  2.  **Conditional Preference:** Conformity must be preferred *because* others conform, not due to external compulsion (fines = not convention).
  3.  **Stability via Mutual Expectations:** The practice persists due to mutual expectations, even if it originated arbitrarily (historic decree = still convention).
  4.  **Non-Moral Disruption:** Disruption/irritation from deviation is acceptable if it stems from *impatience* or coordination failure, not *moral reproach* (escalator irritation = impatience, not blame).

  ### Applying the Rules to the Firm's Practice
  1.  **Solves a Coordination Problem:** Yes. The opening minutes require choosing *one* language to avoid a chaotic scramble. Either language (invitation language *or* English) would work *if* everyone coordinates. The value lies in alignment, not the specific language chosen.
  2.  **Conditional Preference:** Yes. Participants prefer using the invitation language *only because* they expect others to do so (and vice versa). If others switched arbitrarily, the preference for the invitation language would vanish. There's no external penalty forcing compliance.
  3.  **Stability via Mutual Expectations:** Yes. The pattern emerged and persists without decree or discussion because people developed mutual expectations based on observed behavior ("copying"). New hires learn these expectations through imitation. The brief stall upon deviation demonstrates the expectations are active.
  4.  **Non-Moral Disruption:** Yes. The "stall" and "irritation" mirror the escalator case – it's frustration at the coordination failure ("Why aren't we synced up?"), not moral condemnation. Nobody thought the engineer "did anything *wrong*".

  ### Predictions by Theoretical Framework
  *   **Lewisian (Common Knowledge):** **Convention.** Perfect fit. The practice solves a pure coordination problem (language choice for the opening). Mutual expectations exist (evidenced by conformity, copying, and the stall). Conformity is conditionally preferred (either language is fine if coordinated). The inability to articulate the rule doesn't negate common knowledge; it can be tacit.
  *   **Evolutionary (Imitation/Learning):** **Convention.** Strong fit. The practice emerged spontaneously ("nobody decided"), is stable, spreads via imitation ("copying," new hires "pick it up"), and doesn't require explicit agreement or full common knowledge. The disruption upon deviation shows the equilibrium was perturbed.
  *   **Normative Expectations (Resentment License):** **Not Convention (or Ambiguous).** The irritation observed seems closer to the "impatience" of the escalator case than genuine moral resentment licensing blame. Nobody attributed *wrongdoing* to the deviator. This framework would likely say it's *not* a convention because the reaction lacks a normative, reproachful character. (This clashes slightly with her escalator ruling).

  ### Which Rule to Bet On & Why
  *   **Bet On:** **Lewisian (Common Knowledge) Framework.**
  *   **Why:**
      1.  **Coordination is Paramount:** Her ruling against "bless you" explicitly hinges on the *lack* of a coordination problem. This case has a clear coordination problem (avoiding a chaotic opening), satisfying her core requirement.
      2.  **Conditional Preference is Key:** Her ruling against rules with fines emphasizes that conventions rely on conditional preference, not compulsion. This case perfectly illustrates conditional preference based on expectations.
      3.  **Non-Moral Disruption Aligns:** The firm's reaction (stall, irritation without blame) is identical in character to the escalator irritation she deemed non-moral and compatible with convention. This directly supports the Lewisian view that the disruption stems from failed coordination, not violated norms.
      4.  **Origin & Articulation Don't Matter:** Her acceptance of arbitrary historic decrees as conventions (if expectations hold) and the lack of articulated rules/discussion here align with Lewis's focus on expectations over origin or consciousness.

  The evolutionary view *also* fits well, but it risks being too permissive for her taste. Her rejection of "bless you" suggests she demands a genuine coordination problem, which the evolutionary view might downplay. The normative expectations view fits least well, as it would likely misclassify the escalator irritation and this case's stall/irritation as disqualifying, contradicting her earlier ruling.

  ### If the Case is Truly Open (But It Likely Isn't)
  The earlier rulings strongly point to convention. However, if there's ambiguity, it lies in the *nature of the irritation*.

  *   **Further Case to Tell Them Apart:** Observe the reaction to deliberate, repeated deviation by someone fully aware of the pattern.
      *   **Lewis/Evolutionary Prediction:** Continued disruption, frustration, attempts to re-coordinate, *possibly* eventual collapse or shift of the convention, but still no *moral* blame ("They're just being difficult/disruptive, not *immoral*").
      *   **Normative Expectations Prediction:** Development of explicit criticism, appeals to fairness or politeness ("It's rude not to follow the invitation language"), expressions that the deviator *should* comply or *owes* it to the group. This would show the practice has acquired genuine normative force beyond mere coordination.

  **Conclusion:** Bet strongly that she rules the firm's practice **a convention**. It solves a coordination problem through stable mutual expectations and conditional preference, causing non-moral disruption when violated – aligning perfectly with her rulings on driving, escalators, and arbitrary decrees. The Lewisian framework best explains her consistent emphasis on coordination problems and conditional preference. The mild, non-blaming irritation confirms it fits her "impatience" category, not a moral norm. File with confidence.
