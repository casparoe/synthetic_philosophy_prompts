prompt: |-
  For the past several months I have been volunteering in the cataloguing room of a small regional museum, and something about the way our collection is described has come to bother me. When I started, I took the labels at face value; now that I have begun reading the older accession records alongside the published reports, I keep noticing the same drift. An excavator finds a set of small pierced bone discs near a hearth, cannot determine their use, and writes "probably ritual" in the field notebook. The catalogue renders this as "ritual object"; a later site report calls it "a ritual deposit"; and by the time a synthesis article appears, the discs are listed without qualification among the site's ritual features, as though ritual had been observed rather than inferred. I have found the same pattern elsewhere: a row of postholes described in one report as "possibly a boundary marker" is cited two decades later simply as the boundary; a large building once called "possibly a communal store" hardens into "the granary," from which a subsequent paper infers a whole system of centralized redistribution; and a clay figurine entered in the register as "function unknown" now sits behind glass under a label that states flatly what it depicts. It seems to happen because each writer trusts the phrasing of the last, and because once a word has entered the description, questioning it feels like doubting the object itself. Our field adds a further wrinkle: the original inference often cannot be rechecked, since excavation has already destroyed the context that supported it.

  What I would like to know is whether this has a name. I am fairly confident it is not simply confirmation bias, and not quite an unfalsifiable hypothesis either, since it begins as an honest inference from genuine evidence and the interesting part is what happens to it afterward — how it is written down, cited, and inherited until it functions as an observation. If there is an established term for an interpretation that migrates into the descriptive vocabulary and thereby acquires the standing of a fact, I would like to know what it is; if there is none, I would like you to propose one. Either way, please do the conceptual work rather than merely supplying a label: define the phenomenon precisely, say how it differs from the concepts it is nearest to (my own guesses are reification, the theory-ladenness of observation, path dependence, and black-boxing, but I do not know which of these is the right comparison, or whether the thing is better treated as sui generis), and specify the edges — what would count as a clear instance, what would not, and whether the phenomenon still occurs when later writers do re-examine the original evidence and merely agree with it.

  Please return your answer as a JSON object with the following fields: candidate_name (the established term if one exists, otherwise the term you coin, or null if you judge that neither is warranted); established (true if the term is already in use, false if you are coining it); definition (two or three sentences stating the phenomenon precisely); nearest_concepts (an array of objects, each with concept, how_it_overlaps, and how_it_differs); best_fit (an object with concept, why_best, and residual_gap, identifying which nearby concept accounts for the most and what it still leaves out); boundary_cases (an array of objects, each with case, verdict — "in" or "out" — and reason); and residual_worry (the single feature of the phenomenon your account handles least well).
reasoning: |-
  Hmm, the user is describing a fascinating and concerning pattern they've observed while volunteering at a museum. They've noticed how tentative archaeological interpretations - like "probably ritual" - gradually harden into accepted facts through successive publications until they're presented as direct observations. This happens through a chain of citations where each writer trusts previous descriptions without re-examining original evidence, compounded by the irreversible destruction of archaeological context during excavation.

  The phenomenon has several key characteristics: it starts with legitimate but tentative interpretations ("probably ritual"); undergoes gradual semantic hardening (removal of qualifiers); relies on citation chains without evidence re-examination; and results in irreversible epistemic loss due to destroyed context. The user wants to know if this has an established name, and if not, to propose one along with conceptual analysis.

  Looking at nearby concepts:
  - Reification comes close but doesn't capture the citation-chain mechanism
  - Path dependence explains the irreversibility but not the epistemic transformation
  - Theory-ladenness of observation addresses interpretation bias but not the temporal hardening
  - Black-boxing describes the hiding of uncertainty but not its progression

  The best fit is reification, as it captures how abstract interpretations become concrete "facts" - but it doesn't fully address the unique temporal and citational aspects of archaeology where context destruction prevents verification.

  For boundary cases:
  - A later scholar who re-examines original field notes and independently confirms "ritual" would NOT be an instance of this phenomenon
  - But if they simply cite the hardened interpretation without re-examination, it WOULD count
  - The clay figurine moving from "function unknown" to definitive label IS included unless new evidence emerged

  The residual worry is how to distinguish between legitimate scholarly consensus building versus problematic hardening when original evidence is unavailable. The proposed term "interpretative cascade" specifically captures the snowball effect of citations combined with irreversible context loss in archaeology.
