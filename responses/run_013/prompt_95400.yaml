prompt: |-
  I have been trying to work out when numbers count in moral argument. The contractualist formula — an act is wrong when it is disallowed by principles that no one could reasonably reject — strikes me as either right for the wrong reason or else silent once more than two people are involved, and I cannot tell which without first knowing what I think about the cases. What I want from you is not a survey of positions but the principle, or the small set of competing principles, that best captures the verdicts I actually have. I am not asking who has argued for what; I want the substance, and I would rather end with a principle that is honest about the verdict it loses than with one complicated enough to keep them all.

  Here are my verdicts. In every case the parties are strangers to me, no one's consent is available, and no compensation is possible.

  1. Two people are drowning on my left and one on my right; I can reach only one side. I save the two.

  2. Five are drowning on my left and one on my right, under the same constraint. I save the five.

  3. I can save one person who will otherwise die, or save two hundred people who will otherwise each lose a hand. I save the one.

  4. A million people will each suffer an hour of headache this afternoon, and the only way to prevent this is to break a stranger's finger. I do not break the finger.

  5. The same million hours of headache will instead be suffered by one person over the course of her life, and the only way to prevent this is to break a stranger's finger. Here I do break the finger, and I do not hesitate much.

  6. Five patients will die today unless a healthy person is killed and her organs distributed among them. I do not kill her, though the arithmetic is the same as in case 2.

  7. A runaway vehicle will kill five people unless I divert it onto a side track, where it will kill one. I divert it.

  8. I can spare a million people an hour of headache by destroying a manuscript on which one person has worked for a year; she will never learn what happened. I do not destroy it. My verdict does not change when I stipulate that she will never find out, so I appear to think the loss need not be felt in order to count.

  9. Ten million people will die of a plague unless a single immune carrier is killed and her blood used to make the antitoxin. I do not kill her, though I hold this verdict with less confidence than the one in case 6.

  The principle I have been working with, which I will call the like-for-like principle, runs as follows. A person's complaint is the whole of what she stands to suffer, and complaints are not added across persons. Numbers count only where each of the many has a complaint individually as serious as the complaint of the one who loses out; in that case nothing needs to be summed, since no one's complaint is being outweighed by anyone else's, and the many can simply be preferred. Where the many's complaints are individually lighter than the one's, numbers do not count, because counting them would require summing losses borne by different people, and that treats the one person's life as a place to deposit the many's smaller losses.

  This principle delivers all of my verdicts from 1 through 5 and 8. It delivers none of 6, 7, or 9, which appear to need a separate clause about killing and about using a person as a means. I cannot tell whether that clause leaves the aggregation principle doing any work or whether it does all the work itself.

  The place where I am least settled is the following family. Hold the one person's broken finger fixed and vary the many: their individual suffering rising from a headache to an agony, their number rising from a million to a trillion, in every combination. I am confident of my verdict when the many's individual complaints are far lighter than the one's, and confident again when they are equal; somewhere just below equality I have no verdict at all, and that is precisely where I need the principle to decide for me.

  Please do the following. State the principle, or the two or three candidates worth taking seriously, as precisely as you can, and for each clause say which of the nine cases forces it. Then say what the best candidate implies for cases I have not listed, with the boundary family and an astronomically large number of individually small losses at the top of my list. Finally, tell me honestly which of my nine verdicts the best principle cannot accommodate, and which I should give up; if the principle needs a clause that exists only to save one of my verdicts, say so, and tell me to drop the verdict.
reasoning: |-
  Hmm, this user presents a sophisticated moral philosophy challenge. They're clearly well-versed in contractualism and aggregation problems, judging by their precise case descriptions and the "like-for-like" principle they've developed. What they're really asking for is not academic references but a coherent moral framework that systematizes their strong intuitions across these nine thought experiments.

  The user's frustration with contractualism is palpable - they feel it either gets things "right for the wrong reasons" or fails at scale. Their core struggle is about whether and how to aggregate harms across persons. That "boundary family" where individual suffering approaches but doesn't quite reach equivalence reveals genuine philosophical tension. 

  Notably, they're self-aware about inconsistencies: their principle works perfectly for cases 1-5 and 8 but collapses on the organ/trolley/plague dilemmas. The healthy person organ case (6) versus trolley diversion (7) is particularly telling - identical numbers but opposite verdicts. This suggests their intuition respects some distinction between allowing harm versus actively causing it, or perhaps between using persons as means versus incidental effects.

  For the headache/finger cases (4-5), the temporal distribution matters shockingly much to them - a million dispersed headaches don't justify breaking a finger, but concentrated equivalent suffering does. This hints that what we might call "moral density" affects their judgment. Their manuscript case (8) reveals another key feature: they believe impersonal losses count even when unfelt, rejecting pure hedonistic calculus.

  The user's intellectual honesty is admirable - they explicitly want their own verdicts challenged where inconsistent. Their boundary problem (how close must harms be to aggregate?) needs special attention. I should offer principles that draw bright lines where their intuitions get fuzzy. 

  The organ/trolley discrepancy suggests we need at least two moral "modes": one for balancing equivalent harms where numbers matter, another for absolute prohibitions. The threshold at which headaches become "equivalent" to finger-breaking will be messy but necessary. Their rejection of interpersonal utility summation must be preserved - that's non-negotiable based on their like-for-like principle.

  For astronomical numbers of small harms, I suspect they'll reluctantly accept aggregation only past some unbearable cumulative threshold, but their case 4 suggests near-infinite headaches don't justify breaking a finger. This might require introducing a "de minimis" clause where sufficiently trivial harms don't enter moral calculus at all. 

  Ultimately, their framework needs three components: 1) a harm-comparison mechanism that respects their "no cross-person summing" rule 2) special constraints against instrumentalization 3) a procedure for handling borderline harm-equivalence cases. I'll present this as clearly as possible, directly mapping clauses to their numbered cases, and flag where their verdicts must yield to consistency.
answer: |-
  Based on your verdicts and the boundary problem you describe, here is the principle that best systematizes your core intuitions, followed by the strongest alternative and their implications:

  **The Best Principle: Aggregatable Harm Threshold with Anti-Instrumentalization Constraint**

  1.  **Aggregatable Harm Threshold (AHT):** Harms can only be aggregated for moral comparison *if and only if* each individual harm being aggregated meets or exceeds a threshold of *sufficient moral seriousness relative to the harm suffered by the disadvantaged party*. Where individual harms fall below this threshold relative to the comparator harm, they cannot be summed across persons. Numbers count *only* when comparing harms that are individually above this threshold relative to each other.
      *   *Forced by:* Cases 4 & 5 (Headache/Finger vs. Concentrated Suffering), Case 8 (Manuscript vs. Headaches), and your "boundary family" uncertainty. Case 1 & 2 show aggregation works for equivalent serious harms (drowning). Case 3 shows inability to aggregate non-serious harms (hand-loss) against a serious harm (death).

  2.  **Anti-Instrumentalization Constraint (AIC):** It is impermissible to intentionally inflict a serious harm (especially death or severe bodily violation) on a specific, non-threatening person *as a means* to prevent greater harm to others, even if the aggregated harm prevented meets the AHT. Harm imposed as a *foreseen but unintended side effect* of preventing greater aggregated harm meeting the AHT may be permissible.
      *   *Forced by:* The divergence between Case 6 (Organ Harvest - Impermissible) and Case 7 (Trolley - Permissible), and Case 9 (Plague Carrier - Impermissible). Case 6 & 9 involve *using the person's body/life directly as the means*. Case 7 involves diverting an existing threat where the one is harmed as a side effect.

  **How it Delivers Your Verdicts:**

  *   **1 & 2:** AHT allows aggregation (drowning = drowning). Saving more lives is required.
  *   **3:** AHT blocks aggregation. Death is serious; individual hand-loss is *not* sufficiently serious *relative to death* to meet the threshold for aggregation against it. Saving the one is required.
  *   **4:** AHT blocks aggregation. A broken finger is serious; an hour of headache is *not* sufficiently serious *relative to a broken finger* to meet the threshold. Not breaking the finger is required.
  *   **5:** AHT *allows* aggregation. A million hours of suffering concentrated on one person constitutes a harm *at least as serious as* a broken finger. Breaking the finger is permissible.
  *   **6:** AIC forbids *intentionally killing* the healthy person *as the means* to save the five, even though the AHT is met (death vs. death).
  *   **7:** AIC *does not* forbid diverting the threat (harming the one is a foreseen side effect, not the means), and AHT allows aggregation (death vs. death). Diverting is permissible.
  *   **8:** AHT blocks aggregation. The loss of the year's work (even if unfelt) is a serious harm; an hour of headache is *not* sufficiently serious *relative to that loss* to meet the threshold. Not destroying the manuscript is required.
  *   **9:** AIC forbids *intentionally killing* the carrier *as the means* to save the millions, even though the AHT is met (death vs. death). Your reduced confidence likely stems from the immense scale highlighting the tension with AHT, but the instrumentalization remains decisive.

  **The Strongest Alternative: Modified Contractualism with Aggregation Threshold**

  *   **Principle:** An act is wrong if it is disallowed by principles that no one could reasonably reject. A principle can be reasonably rejected if it imposes a significant burden on an individual *for the sake of benefits to others that are individually trivial relative to that burden*. Aggregation *is* reasonable when the burdens prevented for others are *each* non-trivial relative to the burden imposed. Killing/intentional harm as a means provides a particularly strong ground for reasonable rejection.
  *   *Alignment:* Similar to AHT/AIC on Cases 1-5, 7, 8. May struggle less theoretically with the "unfelt" loss in 8 (burden of principle allowing destruction is significant). Similar tension on 6 & 9 (killing as means provides strong ground for rejection).
  *   *Why it's Secondary:* Your description suggests contractualism feels "silent" or "right for the wrong reason" on numbers. This formulation injects your aggregation threshold *into* contractualism to make it work, but the AHT/AIC principle more directly captures your core intuition about *when* aggregation is permissible based on the nature of the harms compared.

  **Implications for Unlisted Cases & Boundary Family:**

  1.  **Boundary Family (Broken Finger vs. Varying Suffering/Number):**
      *   AHT implies there *is* a threshold of individual suffering severity (relative to the broken finger) below which *no number* of such suffering instances can aggregate to outweigh the finger-breaking. A trillion headaches (Case 4) fall below.
      *   As the individual suffering rises (e.g., towards significant pain lasting hours/days), it eventually crosses the threshold where aggregation becomes possible. The principle *requires* you to define this threshold. Is 1 hour of *excruciating* pain per person enough? Probably not. Is 1 day of severe pain? Maybe. Is 1 week? Likely yes. Your uncertainty zone is *at* this threshold. The principle dictates: **Below Threshold:** Never break the finger, regardless of number. **At/Above Threshold:** The number *does* matter; if sufficiently large, breaking the finger becomes permissible. (e.g., Breaking a finger to spare 10 people a month of agony is likely permissible; sparing 10 people a stubbed toe is not).

  2.  **Astronomical Numbers of Small Losses (e.g., breaking a finger to spare a quadrillion people 1 second of mild itch):**
      *   AHT definitively **blocks** this. The individual harm (1 second itch) is vastly below the threshold of seriousness relative to a broken finger. No summation across persons is allowed. You *cannot* break the finger.

  3.  **Variation on Case 3 (Save 1 from death vs. Save N from paralysis):**
      *   If paralysis is deemed sufficiently serious *relative to death* (a very high bar), AHT allows aggregation and saving the many might be required if N is large enough. More likely, paralysis is *not* deemed sufficiently serious *relative to death* (similar to hand-loss), so AHT blocks aggregation, requiring saving the one life, regardless of N.

  4.  **"Loop" Trolley (Diverting to kill 1 to save 5, but the side track loops back to main track saving the 5 only if the 1 is hit):**
      *   AIC likely **forbids** this. The one's death is now *intended as the means* to stop the trolley (by providing the obstruction), not merely a side effect. This aligns with the impermissibility of Case 6.

  **Honest Assessment: Verdicts to Reconsider**

  The AHT/AIC principle delivers 1-8 perfectly. It delivers 9 (Plague Carrier) *only* because of the AIC (no intentional killing as means). However:

  *   **The Tension in Case 9:** Your verdict (don't kill carrier) is correct under AIC. However, your *reduced confidence* is well-founded and highlights the principle's cost. The numbers are astronomically larger than Case 6, making the AHT demand for aggregation incredibly strong, yet the AIC constraint holds. **You should accept this cost.** The principle rigidly protects individuals from being used as a means, regardless of the numbers, which aligns with your rejection of Cases 6 and 9 despite the "arithmetic". Giving up Case 9 would fatally weaken the AIC and likely collapse into consequentialism.
  *   **Clarity on the "Separate Clause":** The AIC *is* a separate clause, but it does **not** render the AHT redundant. The AHT does crucial work in Cases 3, 4, 5, and 8, and defines when aggregation is even *possible* in Cases 1, 2, and 7. The AIC only *constrains* the application of AHT in specific circumstances (intentional harm/killing as means). Both clauses are essential and distinct within your framework.

  **Conclusion:** Your "like-for-like" intuition is powerfully captured by the **Aggregatable Harm Threshold**. Your verdicts on cases involving killing/instrumentalization necessitate the **Anti-Instrumentalization Constraint**. Together, as the AHT/AIC principle, they systematize your core judgments across all nine cases and provide clear (though sometimes demanding) guidance for the boundary cases and astronomical numbers. The cost is accepting that even astronomically large numbers cannot justify *intentionally using a person as a means* to cause them grave harm (Case 9), and that there exists a threshold below which harms simply cannot be aggregated against a more serious individual harm, no matter how numerous.
