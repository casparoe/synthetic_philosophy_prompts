  I retired a few years ago from a career in ecology and have been spending my new free time reading philosphy, mostly history of ideas, and I've hit a snag with DesCarte on animals. A friend in my book club -- she's a retired vet, very sharp, not a philosopher -- lent me a popular history of ideas book (I won't name it because I don't want to poison the well) and the chapter on Descartes says something like: Descartes thought animals are just machines, like clocks or those hydraulic statues in the royal gardens. They have no minds, no consciousness, no feelings at all. When a dog yelps after being kicked, it's just a spring unwinding, not suffering. He supposedly proved this by pointing out that animals can't speak and can't solve novel problems, and he concluded that since they have no souls they're just meat robots, which is why he thought it was morally fine to experiment on them. The book then says this view was obviously wrong and that Darwin finished it off.

  Now, I know enough philosophy now to be suspicious of 'obviously wrong' and 'proved' in the same paragraph, and I've heard somewhere that Descartes maybe didn't deny animals have sensations in the way the book says -- something about him allowing them to feel but not think? But I'm fuzzy. Can you act as an expert on early modern philosophy and give me a careful audit of this summary? Please start by brainstorming the main interpretive options scholars have taken on Descartes and animal minds, then go through the summary claim by claim: what would a Descartes specialist accept, what's a common simplification, what's just wrong, and what's genuinely contested. I'm especially interested in whether the moral conclusion ('so he thought it was fine to experiment on them') actually follows from his metaphysics, and whether the Darwin point is relevant or anachronistic. Don't just tell me what most people say -- I want the weeds, but explain them so a retired field biologist can follow. Thanks
