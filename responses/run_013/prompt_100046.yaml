prompt: |-
  Rank the pramāṇas that figure in classical Indian epistemology — perception, inference, comparison, verbal testimony, postulation, and non-apprehension — into tiers by how much independent epistemic work each one does: that is, how much genuine knowledge (pramā) an otherwise competent agent would lose if that pramāṇa alone were unavailable. Give a sentence for each explaining why it lands where it does, and state plainly which placements turn on a contested reduction — for instance, whether postulation collapses into inference, or non-apprehension into perception plus inference — ranking under the assumption that the reduction fails. Then re-rank the same six by how much of an infallible oracle's output each could certify as knowledge rather than mere true belief, given Nyāya's account of what makes a cognition a pramā, and note where the two orderings come apart.
reasoning: |-
  Okay, the user wants me to rank the six pramāṇas from classical Indian epistemology based on two criteria. First, by how much independent epistemic work each does if unavailable, and second by how much of an oracle's output each could certify as knowledge. I need to explain each placement and note contested reductions.

  Hmm, this requires deep understanding of Nyāya epistemology. The six pramāṇas are perception (pratyakṣa), inference (anumāna), comparison (upamāna), verbal testimony (śabda), postulation (arthāpatti), and non-apprehension (anupalabdhi). For the first ranking, I should consider how much knowledge would be lost if each were removed individually, assuming no reductions between them.

  Perception seems foundational - without it, we'd lose direct sensory knowledge and the basis for inference. Inference comes next since it builds on perception to expand knowledge beyond the senses. Verbal testimony is crucial for cultural transmission but depends on others' perceptual/inferential knowledge. The others seem more niche: comparison for connecting names to referents, postulation for explanatory gaps, non-apprehension for absences. 

  For contested reductions: postulation is sometimes seen as inference (e.g., inferring Devadatta isn't home from his absence), while non-apprehension might reduce to perception plus inference (not perceiving X plus inference that X doesn't exist). But I'll rank assuming they're distinct as requested.

  Now for the oracle test: Nyāya requires knowing both the truth AND how we know it (the pramāṇa). An oracle gives truths but we need to justify them via pramāṇas. Perception can directly certify simple claims ("there's a chair"). Inference can handle inferential claims. Verbal testimony can certify anything the oracle says if we trust it as authoritative. But comparison, postulation and non-apprehension have narrower domains - they can only certify specific types of claims matching their scope. 

  Biggest divergence: verbal testimony jumps from Tier 3 to Tier 1 in oracle ranking because it can theoretically certify ANY true claim if deemed authoritative, while perception drops because it's limited to perceptible truths. Interesting how the rankings flip based on whether we're measuring knowledge loss or justification capacity.

  The user seems sophisticated - probably a philosophy student or scholar. They're testing deep comparative epistemology, especially Nyāya's nuanced pramāṇa theory. The twin-ranking approach cleverly exposes how "epistemic indispensability" differs from "justificatory capacity." I should highlight where the orders diverge and why - that's likely their real interest.
answer: |-
  Here is the ranking of the six classical Indian pramāṇas (Nyāya perspective) under the specified conditions, followed by the oracle test ranking and analysis:

  ### Ranking 1: By Independent Epistemic Work (Knowledge Lost if Unavailable)
  *(Assumption: No pramāṇas collapse into others)*

  1.  **Perception (Pratyakṣa)**  
      *Tier 1: Massive Loss*  
      Without perception, direct sensory knowledge of the world (objects, properties, relations) and the foundation for all other pramāṇas vanishes, crippling empirical knowledge.

  2.  **Inference (Anumāna)**  
      *Tier 2: Very Significant Loss*  
      Losing inference removes knowledge of universals, causal relations, past/future events, the imperceptibly small/large, and the essential structure of rational thought, severely limiting understanding beyond the immediately sensed.

  3.  **Verbal Testimony (Śabda)**  
      *Tier 3: Significant Loss*  
      Absent testimony, knowledge transmitted culturally, historically, scientifically, and spiritually (especially from reliable sources like Vedas or experts) becomes inaccessible, hindering cumulative knowledge and social learning.

  4.  **Postulation (Arthāpatti)**  
      *Tier 4: Moderate Loss (Contested Reduction)*  
      Without postulation, explanatory knowledge bridging apparent contradictions (e.g., inferring Devadatta's absence from his absence at home while knowing he's alive) is lost. **Contested:** Often reduced to Inference (e.g., by Advaita Vedānta).

  5.  **Non-Apprehension (Anupalabdhi)**  
      *Tier 5: Limited Loss (Contested Reduction)*  
      Losing non-apprehension removes direct knowledge of *absences* ("There is no pot on the mat"). **Contested:** Often reduced to Perception (absence as a perceptible property) or Inference (inferring absence from non-perception under conditions of perceptibility).

  6.  **Comparison (Upamāna)**  
      *Tier 6: Minimal Loss*  
      Without comparison, only the specific knowledge linking a name to its referent via similarity (e.g., learning "gavaya" means a wild cow by comparing it to a domestic cow) is lost; this knowledge is often attainable through testimony or inference instead.

  ---

  ### Ranking 2: By Ability to Certify an Oracle's Output as Pramā (Knowledge)
  *(Given Nyāya's requirement: True cognition arising via a valid pramāṇa process)*

  1.  **Verbal Testimony (Śabda)**  
      An infallible oracle *is* the paradigmatic reliable speaker. Śabda can directly certify *any* true proposition uttered by the oracle as knowledge (pramā), provided the hearer recognizes the oracle's authority and comprehends the meaning.

  2.  **Inference (Anumāna)**  
      Inference can certify oracle outputs that are inferential conclusions (e.g., "Fire will occur here tomorrow"), provided the invariable concomitance (vyāpti) between the offered reason and the conclusion is established.

  3.  **Perception (Pratyakṣa)**  
      Perception can only certify oracle statements about perceptible objects occurring *here and now* (e.g., "There is a red chair in this room"). It fails for past/future, abstract, or imperceptible truths.

  4.  **Non-Apprehension (Anupalabdhi)**  
      Non-apprehension can only certify oracle statements about specific, perceptible absences *here and now* (e.g., "There is no elephant in this room"). Its scope is highly restricted.

  5.  **Postulation (Arthāpatti)**  
      Postulation can only certify oracle statements that resolve a specific contradiction between known facts (e.g., if oracle says "Fat Devadatta doesn't eat during the day", postulation certifies "Therefore he eats at night"). Very niche application.

  6.  **Comparison (Upamāna)**  
      Comparison can only certify oracle statements that are *explicitly* about naming via similarity (e.g., "The animal similar to a cow in the forest is called 'gavaya'"). Its scope is the narrowest.

  ---

  ### Where the Orderings Diverge & Why

  *   **Verbal Testimony (Śabda):** Jumps from **Tier 3 (Loss)** to **Tier 1 (Oracle)**. Its indispensability for cultural/social knowledge is high but *replaceable* in principle (though impractical). Its ability to *certify* knowledge from an infallible source, however, is unique and maximal – it transforms true belief into knowledge by being the *appropriate pramāṇa* for testimony.
  *   **Perception (Pratyakṣa):** Drops from **Tier 1 (Loss)** to **Tier 3 (Oracle)**. While foundational for acquiring knowledge, its ability to *certify* oracle statements is limited to the immediate present and perceptible objects. Most oracle truths (past, future, abstract, distant) lie outside its scope.
  *   **Inference (Anumāna):** Stays relatively high (**Tier 2 Loss / Tier 2 Oracle**). It remains crucial for both acquiring complex knowledge and certifying inferential truths from the oracle.
  *   **Postulation, Non-Apprehension, Comparison:** Remain low in both rankings but their specific positions shift slightly based on the narrowness of their domains. Comparison is consistently the most dispensable and least versatile for certification.

  **Key Insight:** The divergence highlights the difference between a pramāṇa's **epistemic indispensability** (how much unique knowledge it *provides access to*) and its **justificatory capacity** (how many *types of true propositions* it can *validate* as knowledge). Śabda shines in justification via authority, while Pratyakṣa is irreplaceable for grounding empirical access.
