  ### **Decision Tree: What Is Utility?**  
  *Start at Question 1. Answer based on concrete cases or straightforward claims.*  

  **Q1: When Alice says, "I prefer apples to bananas," but then picks bananas over apples when offered both, is she making a mistake about her *own* preferences?**  
  - **Yes** → She can be wrong about her preferences (go to Q2).  
  - **No** → Her preferences are exactly what she chooses; no mistake possible (go to Q3).  

  **Q2 (from Q1-Yes): Suppose Alice chooses a job with higher pay but complains it makes her miserable. Is her utility (what's best for her) fundamentally about her *feelings* (e.g., happiness/suffering), not just what she chooses?**  
  - **Yes** → Utility is about feelings (go to Q4).  
  - **No** → Utility is about what she wants or aims for, even if it doesn't make her happy (go to Q5).  

  **Q3 (from Q1-No): If Alice has never encountered kiwis, does the claim "Alice prefers apples to kiwis" mean anything at all, beyond predicting what she *would* choose if offered both?**  
  - **Yes** → Preferences exist beyond actual choices (go to Q6).  
  - **No** → Preferences are *only* summaries of what she would choose; no independent meaning (go to Q7).  

  **Q4 (from Q2-Yes): Can we meaningfully say Alice's joy from apples is "twice as intense" as her joy from bananas (e.g., so that 10 utils vs. 5 utils implies a measurable difference)?**  
  - **Yes** → **Leaf: Fallible Hedonic Utilitarianism (Cardinal)**  
    - *Description:* Utility is a cardinal (measurable) mental state tracking pleasure/pain. People can misreport or mispredict their preferences (e.g., due to ignorance). Explains choices via hedonic experiences.  
    - *Status:* Common in classical utilitarianism (Bentham); coherent and well-explored.  
  - **No** → **Leaf: Fallible Hedonic Utilitarianism (Ordinal)**  
    - *Description:* Utility is an ordinal mental state (only rankings, not intensities) tracking pleasure/pain. People can be wrong about preferences, but we can't quantify "how much" better one option is.  
    - *Status:* Logically coherent but rare/unattractive (hedonics naturally suggest cardinality); few explicit proponents.  

