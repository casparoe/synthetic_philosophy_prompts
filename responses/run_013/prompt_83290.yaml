  ### Negotiation Strategy Decision Procedure  
  **For Analyst Use: Run in Order, Stop at First "Call" or "Definitive Pass"**  
  **Inputs:** Current round (k), total rounds (N), current pot (P_k), growth factor (g), caller’s share (s), and evidence on deadline risk, principal-agent issues, and repeat interactions.  
  **Output:** Recommend "Call" or "Pass" for the current round.

  ---

  #### Step 1: **Final Round Check**  
  - **Question:** Is the current round the final round (k = N)?  
  - **Sufficient Answer:** Yes.  
  - **Action:** **Call immediately** (final round is binding). Stop.  
  - *Judgment Call?* No. Pure rule.  

  #### Step 2: **Deadline Risk Assessment**  
  - **Question:** Is the deadline (final round) common knowledge and credible?  
    - *Evidence:* Published rules, public commitments, or past behavior confirming no early exit risk.  
  - **Sufficient Answer:**  
    - **Yes:** Proceed to Step 3.  
    - **No:** Flag `deadline_risk = true`. Proceed to Step 3.  
  - *Judgment Call?* Yes (assess credibility of commitment).  

  #### Step 3: **Principal-Agent Assessment**  
  - **Question:** Is the counterparty incentivized to **never call** (e.g., punished for calling, instructed to avoid responsibility)?  
    - *Evidence:* Public mandates, union votes, or past deals where counterparty passed despite theoretical call rounds.  
  - **Sufficient Answer:**  
    - **Yes:** Flag `passive_counterparty = true`. Go to Step 4.  
    - **No/Unknown:** Flag `passive_counterparty = false`. Go to Step 5.  
  - *Judgment Call?* Yes (assess misaligned incentives).  

  ---

  ### Decision Branches  
  #### Step 4: **Passive Counterparty Rules** (`passive_counterparty = true`)  
  - **Step 4a: Calculate Optimal Future Payoff**  
    - Compute `j_max` = largest round ≥ k with same parity (i.e., rounds where you move).  
    - Compute `best_future_payoff`:  
      - If `j_max = N`: `s × P_jmax`  
      - If `j_max < N`: `max(s × P_jmax, (1-s) × P_jmax+1)`  
    - *Example:* k=1, N=5, g=0.4, P₀=10 → P₅=38.416M. `j_max=5`, `best_future_payoff = 0.6 × 38.416 = 23.05M`.  

  - **Step 4b: Deadline Risk?**  
    - **No deadline risk (`deadline_risk = false`):**  
      - If `k = j_max`:  
        - **Call** if `s × P_jmax ≥ (1-s) × P_jmax+1`  
        - **Pass** otherwise.  
      - If `k < j_max`:  
        - **Call** if `s × P_k ≥ best_future_payoff`  
        - **Pass** otherwise.  
    - **Deadline risk (`deadline_risk = true`):**  
      - Partner estimates probability (`p_survive`) of reaching `j_max` without early exit.  
      - **Call** if `s × P_k ≥ p_survive × best_future_payoff`  
      - **Pass** otherwise.  
    - *Judgment Call?* Yes (estimating `p_survive`).  

  #### Step 5: **Active Counterparty Rules** (`passive_counterparty = false`)  
  - **Step 5a: Backward Induction Condition**  
    - **Call** if `s × P_k > (1-s) × P_k+1` (theoretical call condition).  
    - *Example:* k=1, g=0.4, s=0.6 → `0.6 × 10 = 6 > 0.4 × 14 = 5.6` → **Call** satisfies condition.  

  - **Step 5b: Deadline Risk?**  
    - **No deadline risk (`deadline_risk = false`):**  
      - **Pass** if:  
        1. Counterparty passed in their last turn when backward induction said "call", AND  
        2. At least 2 rounds remain after k (k ≤ N-2).  
      - **Otherwise, call** if backward induction condition holds.  
    - **Deadline risk (`deadline_risk = true`):**  
      - Partner estimates probability (`p_survive`) of reaching round k+1.  
      - **Call** if `s × P_k > p_survive × (1-s) × P_k+1`  
      - **Pass** otherwise.  
    - *Judgment Call?* Yes (assessing counterparty’s past actions and `p_survive`).  

  ---

  ### What the Procedure Cannot Do  
  1. **Predict irrationality:** Assumes counterparty follows consistent patterns.  
  2. **Handle variable growth/shares:** Requires fixed g and s.  
  3. **Quantify hidden risks:** Relies on partner’s judgment for unobservable risks.  
  4. **Model long-term reputation:** Only considers repeat business implicitly via principal-agent assessment.  

  ---

  ### Case Studies  
  #### Case 1: Public-Sector Procurement  
  - **Context:** Published rules, committee buyer, no repeat business.  
  - **Inputs:** k=1, N=5, P_k=10M, g=0.4, s=0.6. Deadline common knowledge (`deadline_risk=false`). Committee avoids calling (`passive_counterparty=true`).  
  - **Procedure:**  
    - Step 4a: `j_max=5`, `best_future_payoff=0.6×38.416M=23.05M`.  
    - Step 4b: `s×P_k=6M < 23.05M` → **Pass**.  
  - **Client Reaction:** Acceptable (pot grows).  

  #### Case 2: Labor Negotiation  
  - **Context:** Public strike date (deadline common knowledge), union leadership faces member vote (`passive_counterparty=true`).  
  - **Inputs:** k=3, N=5, P_k=19.6M (10M×1.4²), g=0.4, s=0.6.  
  - **Procedure:**  
    - Step 4a: `j_max=5`, `best_future_payoff=23.05M`.  
    - Step 4b: `s×P_k=11.76M < 23.05M` → **Pass**.  
  - **Client Reaction:** Acceptable (delays call for larger pot).  

  #### Case 3: Two-Round Acquisition  
  - **Context:** Acquirer committed to walk-away price, no repeat business.  
  - **Inputs:** k=1, N=2, P_k=10M, g=0.4, s=0.6. Deadline common knowledge (`deadline_risk=false`). Acquirer rational (`passive_counterparty=false`).  
  - **Procedure:**  
    - Step 5a: Backward induction: `6M (call now) > 5.6M (40% of 14M if pass)` → **Call**.  
    - Step 5b: Not triggered.  
  - **Client Reaction:** **Hated** (emotional attachment to $14M pot), but defensible:  
    > *"Passing yields $5.6M. Calling secures $6M. You lose $0.4M by passing."*  

  ---

  ### Memo for Engagement Partner: Explaining Early Call to Client  
  > **Subject:** Why Calling Early is the Right Move  
  >   
  > We know the growing pot looks enticing. It’s natural to want to wait for the big number. But let’s be clear: **this game is rigged against passers**.  
  >  
  > - When you pass, you don’t get the full pot—you get a *smaller share* of it. In the next round, the other side can call and take the lion’s portion, leaving you with less.  
  > - The math is brutal: waiting often means trading a sure gain today for a smaller (or riskier) slice tomorrow. In this case, calling now guarantees **$6M**, while passing risks $0.4M in immediate losses—plus the danger they walk away.  
  >  
  > This isn’t greed; it’s game theory. The rules punish hesitation. Take the win.  
  >  
  > *Attachment: One-page decision summary.*  

  --- 
  **Approval:**  
  - Analyst runs procedure (30–45 mins).  
  - Partner reviews judgment calls (deadline risk, passive counterparty, p_survive).  
  - CFO memo: 1 page, no game theory jargon.
