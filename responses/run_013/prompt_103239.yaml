    - A has 1 billion reference-class observers. B has 2 billion.  
    - SSA: You're a random sample from the reference class. Your existence is less likely under B (P(you | B) = 1/2B) than under A (P(you | A) = 1/1B).  
    - **Favors A (Small Humans) at 2:1 odds** (since P(evidence | A) / P(evidence | B) = (1/1B) / (1/2B) = 2).

  - **Full SSA (reference class: all conscious minds)**:  
    - Both hypotheses have minds in the reference class.  
    - A has 1B observers, B has 2B.  
    - P(you | A) = 1/1B, P(you | B) = 1/2B → **favors A at 2:1 odds** (same as above).

  - **SIA**:  
    - P(evidence | H) ∝ number of observers in H.  
    - P(evidence | A) ∝ 1B, P(evidence | B) ∝ 2B → **favors B at 2:1 odds**.

  **Wedge achieved**: This forces Nadia to choose between her rule and SIA. Since she rejects SIA (from Presumptuous Philosopher), she'll favor A. But crucially, this case confirms her reference class includes phenomenologically identical minds, even if non-human. If she instead insisted on a biological human reference class, B would be impossible (since you're experiencing human-like consciousness), but her Sleeping Beauty view suggests she cares about subjective experience, not biology.

  **Why this is the best wedge**:  
  - It isolates the conflict between SSA and SIA when observer numbers differ within the reference class.  
  - Nadia's choice here reveals whether her reference class is truly about subjective indistinguishability (she'll favor A) or if she's smuggling in SIA (she'd favor B, but her track record says she won't).  
  - It also distinguishes from full SSA, but in this case, full SSA and her rule agree (both favor A). If you want a wedge between her rule and full SSA, you'd need a case with varying numbers of *dissimilar* minds, but her track record already rules out full SSA (via Doomsday).

  ### Summary
  - **Nadia's rule**: SSA with a reference class of "minds I could be" (subjectively indistinguishable from yours).  
  - **Big/Small verdict**: Neither favored (same number of reference-class observers).  
  - **Key insight**: Sleeping Beauty shows her reference class is experiential, not biological.  
  - **Forcing her hand**: Use the "Modified Indistinguishable Aliens" case. If she favors Small Humans (A), she's confirmed her rule. If she favors Big Aliens (B), she's contradicting her rejection of SIA. This case exploits the core tension between SSA (which can favor fewer observers in your reference class) and SIA (which favors more observers).

  This should give you the ammo to settle the fight—or at least, to corner Nadia into revealing her hand!
