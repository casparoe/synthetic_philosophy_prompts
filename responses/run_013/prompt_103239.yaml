  Nadia's thirder view treats each awakening as a distinct observer-moment in the reference class, even though it's the same person. This shows her reference class is based on *subjective indistinguishability* (e.g., all moments where Beauty wakes up with the same memories and experiences). In Big/Small, the non-human minds are *distinguishable* from yours—so they're excluded from the reference class, just as Tuesday's awakening isn't excluded for Beauty. This ensures only "minds like yours" (human minds here) matter, leading to indifference.

