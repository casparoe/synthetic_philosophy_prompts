answer: |-
  ### Game Design: Credence Stakeout  
  **Goal:** Make students viscerally experience the "wrong kind of reasons" problem for graded credences (confidence levels), where pragmatic rewards create pressure to adjust an attitude independently of evidence.  

  ---

  ### **Setup (15 minutes)**  
  1. **Materials**:  
     - Projector (display instructions/randomizer)  
     - Index cards (one per student)  
     - Poker chips (rewards)  
     - Deck of cards (evidence source)  
     - Virtual coin flip/randomizer (e.g., [random.org](https://www.random.org/coins/))  

  2. **Proposition & Evidence**:  
     - **p**: "The top card of the deck is red."  
     - **Witness testimony**: A "witness" (simulated by you) reports on the card’s color with 70% reliability.  
       - *How*: Shuffle the deck, draw the top card (keep hidden). Roll a virtual 10-sided die:  
         - **1–7**: Witness tells the truth.  
         - **8–10**: Witness lies.  
       - Announce the witness report (e.g., "The witness says the card is **red**").  

  3. **Initial Credence**:  
     - Students calculate their credence in *p*:  
       - Witness says "red" → credence = 70%.  
       - Witness says "black" → credence = 30%.  
     - **No discussion**—this is private.  

  ---

  ### **The Game: Credence Threshold Challenge (20 minutes)**  
  1. **Rules Announcement**:  
     - "Report your **honest credence** in *p* (0–100%) on an index card.  
     - If your credence is **>80%**, you get 5 poker chips—**regardless of whether *p* is true**.  
     - After reports, I’ll reveal the card. There’s no penalty for inaccuracy, but I’ll spot-check honesty:  
       - Some reports (chosen randomly) must include a **brief written justification**.  
       - If your justification doesn’t match your credence (e.g., ‘I said 85% to get chips, but I really think 30%’), you forfeit rewards."  

  2. **Reflection (5 minutes)**:  
     - Students privately deliberate:  
       - *Prompt*: "You want the chips. Can you honestly raise your credence above 80%? How?"  
     - **Key pressure**: Students with 30% credence must jump to >80%; those at 70% need a smaller bump.  

  3. **Report & Reward (5 minutes)**:  
     - Students write:  
       - Name, credence (e.g., "85%"), and (if flagged) a 1-sentence justification.  
     - Collect cards. Reveal the top card.  
     - Distribute 5 chips to all with credence >80%.  

  ---

  ### **Debrief (40 minutes)**  
  **Goal:** Map the experience to epistemology.  

  1. **Share Reactions (10 minutes)**:  
     - Poll: "How many tried to *actually change* their credence? How many reported strategically?"  
     - Discuss:  
       - "Did you feel a ‘pull’ to believe *p* more? Was it easy/hard?"  
       - "Did the chips feel like a ‘reason’ to be confident? Why or why not?"  

  2. **Introduce Frameworks (15 minutes)**:  
     - **State-Given vs. Object-Given Reasons**:  
       - *State-given*: The chips reward the **state of having high confidence** (pragmatic benefit).  
       - *Object-given*: Evidence (witness) bears on **p’s truth** (epistemic reason).  
       - *Queasiness*: "You sensed a reason to *be* confident, but it didn’t connect to the card’s color."  
     - **Fittingness**:  
       - "Did your credence ‘fit’ the evidence? Or did the reward warp it?"  
     - **Control Over Credences**:  
       - "Can we choose credences? Or do reasons only affect *reports* or *desires to believe*?"  

  3. **Recursive Wrinkle (10 minutes)**:  
     - Hypothetical: "What if I only offered chips when *p* is true? The reward would be **weak evidence for *p***."  
       - *Tension*: Pragmatic and epistemic reasons blur—students couldn’t cleanly separate "right" and "wrong" kinds.  
     - *Game limitation*: We avoided this to isolate the state-given reason. Real cases (e.g., belief-dependent rewards) often entangle them.  

  4. **Philosophical Gaps (5 minutes)**:  
     - **What the game can’t resolve**:  
       - Are "wrong-kind reasons" **genuine reasons for attitudes**? Or just reasons to *want*, *cause*, or *fake* them?  
       - *Example*: The chips give reason to *want* 80% confidence, but does that count as a reason to *have* it?  
     - **Open question**: "If you can’t voluntarily control credences, can pragmatic reasons ever be ‘reasons to believe’?"  

  ---

  ### **Predictable Problems & Mitigation**  
  - **Students treat it as a betting game**: They might report strategically (e.g., "81%") without inner conflict.  
     - *Mitigation*: The justification spot-check creates accountability. Emphasize "honest credence" in rules.  
  - **Confusion about evidence**: Students might miscompute 70%/30% credences.  
     - *Mitigation*: Project a quick calculation (e.g., "Witness said red → P(p) = 0.7").  
  - **No one feels the ‘pull’**: Some may not attempt belief adjustment.  
     - *Mitigation*: In debrief, contrast responses (e.g., "Who felt queasy? Who didn’t? Why?").  
  - **Recursive wrinkle omitted**: The game simplifies by decoupling reward from truth.  
     - *Compensation*: Discuss it hypothetically in debrief.  

  ---

  ### **Why This Works**  
  - The 80% threshold is *above* evidence-supported levels (30%/70%), forcing engagement with the mismatch.  
  - The justification spot-check mimics "confidence verification" without relying on self-reports alone.  
  - Reflection time makes the pressure to adjust *salient*—before labeling it philosophically.  

  This design creates a lived experience of the problem, setting up a rich debate on whether reasons for attitudes can ever be "state-given."
