answer: |-
  ### Concrete Example: The Self-Referential Sentence "Q"

  **Setup Recap:**  
  - The agent assigns credences (subjective probabilities) to undecided arithmetic sentences.  
  - Over time, the agent proves more theorems, so its credences converge to 1 for true sentences and 0 for false ones.  
  - **Martingale condition:** The current credence in any sentence \(P\) must equal the expected future credence in \(P\) after more thinking. The agent never expects to be "surprised" by its own reasoning.  

  **The Problematic Sentence:**  
  Define a self-referential sentence \(Q\) using Gödel numbering (to embed self-reference in arithmetic):  
  \[ Q \equiv \text{"The agent's credence in } Q \text{ at time } t=1 \text{ will be less than 0.5"} \]  
  Here, \(t=0\) is the current time, and \(t=1\) is after one step of computation (e.g., after thinking for a fixed duration).  

  ---

  ### How the Demands Conflict  
  The martingale condition and the requirement for truthful convergence (credence → 1 if true, 0 if false) cannot both hold for \(Q\). The conflict arises in two steps:  

  #### Step 1: At \(t=1\), the agent cannot assign a consistent credence to \(Q\).  
  - Let \(c_1(Q)\) be the credence the agent assigns to \(Q\) at \(t=1\).  
  - By the definition of \(Q\):  
    \[ Q \text{ is true } \iff c_1(Q) < 0.5 \]  
  - Now, the agent at \(t=1\) must set \(c_1(Q)\) based on what it knows:  
    - **Case A:** Suppose the agent sets \(c_1(Q) < 0.5\).  
      - Then \(Q\) is true (by definition).  
      - But if \(Q\) is true, the agent should assign a high credence to \(Q\) (ultimately converging to 1). Contradiction: low credence is inconsistent with high truthfulness.  
    - **Case B:** Suppose the agent sets \(c_1(Q) \geq 0.5\).  
      - Then \(Q\) is false (by definition).  
      - But if \(Q\) is false, the agent should assign a low credence to \(Q\) (converging to 0). Contradiction: high credence is inconsistent with low truthfulness.  
  - **Result:** No value of \(c_1(Q)\) is consistent. The agent cannot assign any credence to \(Q\) at \(t=1\) without violating truthful convergence.  

  #### Step 2: The martingale condition breaks at \(t=0\).  
  - At \(t=0\), the agent must set its current credence \(c_0(Q)\).  
  - Martingale requires: \(c_0(Q) = \mathbb{E}_0[c_1(Q)]\), where \(\mathbb{E}_0\) is the expectation over possible future states at \(t=1\).  
  - But from **Step 1**, \(c_1(Q)\) is undefined (no consistent value exists).  
  - **Result:** \(\mathbb{E}_0[c_1(Q)]\) is undefined, so \(c_0(Q)\) cannot satisfy the martingale condition.  

  ---

  ### What Gives?  
  - **Truthful convergence must be sacrificed** for sentences like \(Q\).  
    - The agent cannot assign coherent credences to self-referential sentences that depend on its own future beliefs.  
    - In practice, the agent might avoid assigning credences to such sentences, assign arbitrary values, or "go inconsistent" (e.g., assign \(c_1(Q) = 0.5\) but not converge to truth).  
  - **Martingale survives only if truthful convergence is relaxed**:  
    - If the agent ignores the paradox and sets \(c_0(Q) = c_1(Q) = 0.5\), the martingale holds trivially (\(0.5 = \mathbb{E}_0[0.5]\)), but \(Q\) remains forever undecided (violating convergence).  
    - Cost: The agent is either incomplete (avoids certain sentences) or incorrect (does not converge for self-referential truths).  

  ---

  ### Bonus: Agents Betting Against Copies  
  **Setup:** Two identical agents (Agent A and Agent B) reason about a sentence \(P\):  
  \[ P \equiv \text{"Both agents will assign credence } >0.5 \text{ to } P \text{ at } t=1"} \]  
  Agents are deterministic, use the same algorithm, and start with identical knowledge.  

  #### Conflict:  
  1. At \(t=0\), each agent sets \(c_0(P)\).  
  2. Martingale requires \(c_0(P) = \mathbb{E}_0[c_1(P)]\).  
  3. At \(t=1\), each agent observes its own \(c_1(P)\) and (knowing the other is identical) infers the other’s \(c_1(P)\).  
     - **Consistent fixed points**:  
       - If both set \(c_1(P) = 1\), then \(P\) is true (both >0.5).  
       - If both set \(c_1(P) = 0\), then \(P\) is false (both ≤0.5).  
     - **Inconsistent outcomes**:  
       - If one agent sets \(c_1(P) = 1\) and the other sets \(0\), \(P\) is false (since not both >0.5), but the first agent’s high credence is unjustified.  
  4. **Martingale forces determinism at \(t=0\)**:  
     - Let \(p = \text{probability both agents set } c_1(P) = 1\).  
     - Truthful convergence requires \(c_0(P) = \text{actual probability } P \text{ is true} = p\) (since \(P\) true iff both set \(c_1(P)=1\)).  
     - Martingale requires \(c_0(P) = \mathbb{E}_0[c_1(P)] = p \cdot 1 + (1-p) \cdot 0 = p\).  
     - Thus, \(c_0(P) = p\) and \(P(\text{P true}) = p\), so \(p = p\). No contradiction yet.  
  5. **But truthful convergence demands \(c_1(P) = 1\) if \(P\) true, or \(0\) if false**:  
     - At \(t=1\), if both agents set \(c_1(P)=1\), then \(P\) is true → consistent.  
     - If both set \(c_1(P)=0\), then \(P\) is false → consistent.  
     - **However**, if the agents randomize (e.g., set \(c_1(P)=1\) with probability \(q\)), then:  
       - \(P(\text{P true}) = q^2\) (both independently choose high credence).  
       - Truthful convergence requires \(c_0(P) = q^2\).  
       - Martingale requires \(c_0(P) = q\).  
       - So \(q^2 = q\) → \(q = 0\) or \(q = 1\).  
     - **Result:** The martingale condition forces deterministic behavior (\(q=0\) or \(q=1\)) to avoid \(q^2 \neq q\). Randomization breaks martingale unless agents are perfectly correlated.  

  #### Outcome:  
  - If both agents choose \(c_0(P) = 1\) and \(c_1(P) = 1\), \(P\) is true, and they break even on bets.  
  - If both choose \(c_0(P) = 0\) and \(c_1(P) = 0\), \(P\) is false.  
  - **If they disagree (e.g., one sets \(c_0(P)=1\), the other \(c_0(P)=0\))**:  
    - The optimistic agent (who bought a "P true" bet at \(t=0\)) loses, as \(P\) is false.  
    - Here, agents "bet against themselves" in the sense that their identical algorithms lead to conflicting actions when initialized differently, violating the martingale’s assumption of consistent expectations.  

  ---

  ### Key Insight  
  The conflict arises because:  
  - **Self-reference** creates a liar-like paradox for future beliefs.  
  - **Martingale** requires current credence to mirror expected future credence.  
  - **Truthful convergence** demands credences align with ultimate truth.  
  For sentences like \(Q\) or \(P\), these cannot all hold. The cost of keeping martingale and truthful convergence is **restricting the language** (banning self-referential future-belief sentences) or **accepting inconsistency** for such sentences. The bonus shows even identical agents face coordination problems under martingale.  

  This illustrates the fundamental tension in logical uncertainty: reasoning about your own future reasoning can make you "wrong on purpose" to avoid immediate inconsistency.
