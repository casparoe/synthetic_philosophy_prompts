answer: |-
  1. **Materials**: Prepare a secret rule sheet for the rule-follower detailing the deviant rule (e.g., "For inputs ≤4 characters, output the first character; for inputs ≥5 characters, output the last character"), a whiteboard for query responses, paper for inspectors to record predictions/stakes, and three test strings (e.g., "A", "HELLO", "TESTING") for predictions.  

  2. **Payoff Scheme**: In Round 1, inspectors gain/lose staked points (0–2 per test case) based on prediction accuracy for the three test strings; correct predictions add the stake, incorrect subtract it. In Round 2, no points are staked—focus shifts to observing consensus-driven consistency.  

  3. **Timeline**:  
     - 0–5 min: Assign roles secretly (one rule-follower, 14 inspectors), explain query constraints (inputs ≤4 characters), and the staking system.  
     - 5–15 min: Query phase: Inspectors propose up to 10 inputs; rule-follower applies the deviant rule and displays outputs.  
     - 15–20 min: Prediction phase: Inspectors privately predict/stake points for the three test strings; rule-follower reveals deviant-rule outputs.  
     - 20–25 min: Scoring and transition: Collect predictions, tally points, then instruct inspectors to agree on one rule (e.g., "output first character").  
     - 25–30 min: Round 2: Rule-follower adopts the community rule; rerun test strings to show aligned outputs.  
     - 30–60 min: Debrief.  

  4. **Predictable Problems and Handling**:  
     - Inspectors exceed query length limit (e.g., propose 5-character input): Politely enforce constraints; void invalid queries.  
     - Rule-follower errs in applying the deviant rule: Discreetly correct using the rule sheet to maintain consistency.  
     - Inspectors stall in Round 2 consensus: Intervene after 3 minutes to steer them toward the obvious rule (e.g., "Consider simplicity").  

  5. **Debrief Mapping and Limitation**: Map Round 1 to the underdetermination of rules by finite data (any queried inputs fit multiple rules) and the distinction between a rule and its applications; map Round 2 to communal agreement fixing normative practice. Explicitly note the activity cannot reproduce the metaphysical feature of a pre-communal "fact of the matter" about the rule (e.g., why the deviant rule was "wrong" without the community)—this must be supplied by the facilitator as a philosophical premise.
