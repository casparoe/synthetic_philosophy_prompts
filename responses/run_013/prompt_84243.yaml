  Okay, the user wants a checklist for what makes a theory of verbal disputes adequate. They're clearly frustrated with existing accounts that seem biased towards the theorist's pet issues. Let me unpack their concerns.

  First, they mention Ravi's proposal - that restating in neutral vocabulary resolves disputes. But they suspect it just moves the circularity problem to "who defines neutral?" That's a sharp observation. Any adequate theory must address this definitional authority issue head-on.

  Then there's the brain-in-a-vat counterfactual case. If two people agree on all actual facts but disagree about hypotheticals, is that substantive? The user seems to think this tests whether a theory can handle modal disagreements. That's crucial for philosophy of mind debates.

  The language-relativity point is subtle. If a dispute's status changes across languages, that suggests something about linguistic constraints versus genuine disagreement. The user probably wants to know if verbal disputes are "real" or just artifacts of specific languages.

  The residue problem resonates - even after calling something "verbal", we still need to choose words. The user seems to think this undermines claims that "nothing is at stake". They're right that practical consequences linger.

  The table/chair ontology example is key. Physical objects vs particles - agreement on observables but not existence claims. The user notes participants don't feel they're debating words, which challenges any theory that overrules first-person perspectives.

  The meta-problem is delicious: can a theory of verbal disputes avoid self-destructing when applied to itself? If the deflationist vs realist debate about ontology is itself verbal, that's a problem.

  Finally, usability matters. The user insists the test must work for participants without solving metaphysics first. That's very practical - they want a tool, not a philosophical quagmire.

  Now structuring the response: I'll build requirements around these cases, making explicit why each matters. The neutrality requirement comes from Ravi's circle. Modal robustness handles brain-in-vats. Language invariance addresses cross-linguistic concerns. Practical residue captures that word-choice matters. First-person authority respects participants' sense of substance. Meta-consistency prevents self-sabotage. Internal usability meets the participant-level test.

  The killer requirement? Probably neutrality - because defining "neutral vocabulary" inevitably smuggles in substantive commitments. Every theory I know fails this when pressed. That's why Ravi's proposal feels circular to the user. I'll emphasize this as the tripwire for most accounts.

  The user's clearly done their homework - they've spotted all the weak points in standard treatments. My response should honor that by being ruthlessly systematic, no hand-waving. Their demand for specs before theory shows they've been burned by motivated frameworks before. Time to deliver steel-man requirements, not another partisan take.
answer: |-
  Here's a specification for an adequate theory of verbal disputes, derived from your core concerns and the philosophical landscape. Each requirement includes its justification ("Case/Consideration") and negotiability assessment. The fatal flaw is identified at the end.

  **Core Requirements for an Adequate Theory of Verbal Disputes:**

  1.  **Neutrality / Non-Circularity:**
      *   **Requirement:** The test for verbalness must not presuppose the resolution of the very dispute it's analyzing *or* rely on contested metaphysical/semantic commitments from one side. It cannot smuggle in substantive philosophical views under the guise of "neutral grounding."
      *   **Case/Consideration:** Your point (a) about Ravi's proposal. Defining "vocabulary neither would say already takes sides" requires a prior, uncontested notion of "taking sides" or "substantive commitment," which is often the crux of the dispute itself (e.g., what counts as "factual"?). This circularity is fatal if unresolved.
      *   **Negotiability:** **Non-Negotiable.** A theory failing here is useless for resolving disputes fairly; it becomes a tool for rhetorical dominance.

  2.  **Modal Robustness:**
      *   **Requirement:** The theory must account for disagreements over counterfactuals and modal claims (possibility, necessity), not just actual, observed facts. It must explain whether such modal disagreements can be verbal, substantive, or a mix.
      *   **Case/Consideration:** Your point (b) – Brain-in-a-Vat scenarios. Parties agree on all actual sensory inputs and physical states but disagree over whether the BIV "knows" anything. Is this a disagreement about the *meaning* of "knows," the *nature* of knowledge, or something else? Ignoring modality makes the theory irrelevant to core philosophical debates.
      *   **Negotiability:** **Non-Negotiable** for a theory aiming to handle philosophical disputes. Essential for cases like knowledge, free will, personal identity.

  3.  **Language Invariance:**
      *   **Requirement:** The verdict on whether a dispute is verbal or substantive should not depend *essentially* on the specific language in which the dispute is conducted. The underlying disagreement (or lack thereof) should be expressible across languages, even if linguistic features influence how easily the verbalness manifests.
      *   **Case/Consideration:** Your point (c). If a dispute comes out verbal in English (due to, say, ambiguity) but substantive in a language forcing lexical disambiguation, the theory must explain whether the *core issue* is linguistic or something deeper. The dispute's status shouldn't fundamentally change with the language used.
      *   **Negotiability:** **Conditionally Non-Negotiable.** While linguistic structure *reveals* potential verbalness, the *existence* of a substantive disagreement should be a fact about the speakers' commitments, translatable in principle. A theory failing this makes verbalness an accident of language, not a feature of the dispute.

  4.  **Practical Residue:**
      *   **Requirement:** The theory *must* explain and account for the "residue" left after declaring a dispute verbal. It cannot conclude "so nothing is at stake." It must provide resources for understanding *why* the verbal dispute arose and *how* to choose between terminologies/conceptual schemes based on practical, theoretical, or aesthetic virtues (e.g., simplicity, fruitfulness, expressive power, emotional resonance).
      *   **Case/Consideration:** Your point (d). Declaring a dispute verbal (e.g., "Is Pluto a planet?") doesn't end the conversation; it shifts it to "How should we define 'planet' *and why*?". The theory must handle this pragmatic dimension, explaining the *point* of the terminological choice.
      *   **Negotiability:** **Non-Negotiable.** Ignoring the residue renders the theory practically inert and fails to explain why people engage in (what turn out to be) verbal disputes with such passion. The stakes are pragmatic/conceptual, not factual.

  5.  **First-Person Authority (Participant Perspective):**
      *   **Requirement:** The theory must be applicable by participants *within* the dispute without requiring them to first settle external, highly contested philosophical questions (e.g., the ultimate metaphysics of meaning, reference, or reality).
      *   **Case/Consideration:** Your point (g). Participants need a way to assess potential verbalness without becoming semantic theorists. They need operational criteria accessible from their epistemic position.
      *   **Negotiability:** **Non-Negotiable.** A theory unusable by participants is irrelevant to the actual practice of resolving disagreements. It becomes an external analysis, not a tool for dialogue.

  6.  **Accommodation of Ontological Debates:**
      *   **Requirement:** The theory must provide a coherent account of disputes where parties agree on all observable/empirical facts but disagree about the existence or fundamentality of entities (e.g., tables, numbers, propositions), *without* simply dismissing the participants' sense that something substantive *is* at stake.
      *   **Case/Consideration:** Your point (e) – Tables/Chairs vs. Particles. Participants agree on particle arrangements but disagree on "Do tables *really* exist?". They don't feel it's *just* about words, but about what the world fundamentally contains.
      *   **Negotiability:** **Highly Constrained.** The theory doesn't have to vindicate the participants' feeling of substance as reflecting a *mind-independent* fact, but it *must* explain the nature and persistence of the disagreement and the sense of substance, locating it plausibly (e.g., in conceptual frameworks, practical commitments, or explanatory levels).

  7.  **Meta-Consistency:**
      *   **Requirement:** The theory must be able to analyze the dispute *about verbal disputes itself* (deflationists vs. substantivists about ontology) without self-defeating circularity or performative contradiction. It must avoid declaring *its own* core tenets merely verbal.
      *   **Case/Consideration:** Your point (f). Applying the theory's own criteria to the debate *about* whether ontological disputes are verbal must yield a coherent result. It cannot undermine its own foundations.
      *   **Negotiability:** **Non-Negotiable.** A theory that self-destructs under its own analysis is fatally flawed. It must have the resources to explain why *this* debate is (or isn't) merely verbal in a way consistent with its principles.

  **The Fatal Flaw: The Neutrality Trap (Requirement 1)**

  The requirement that **does the most damage**, quietly killing most popular accounts, is **Neutrality / Non-Circularity (Requirement 1)**. Here's why:

  1.  **The Core Problem:** Any proposed "neutral ground" (common facts, shared vocabulary, ideal translation, fundamental ontology) is itself a philosophically contested notion. Carnap's frameworks, Quinean physicalism, Lewisian possible worlds, Chalmers' scrutability – all involve substantive commitments.
  2.  **Ravi's Proposal Fails Here:** As you suspected, "vocabulary neither would say already takes sides" requires defining "taking sides." If "taking sides" means "making a substantive claim," we're back where we started. The arbiter of neutrality inevitably imposes their view.
  3.  **Undermines Other Requirements:** Failure here cascades:
      *   **Modal Robustness:** What counts as a "relevant" counterfactual? (Requires prior commitments).
      *   **Language Invariance:** Defining "equivalent expressive power" across languages is notoriously difficult and theory-laden.
      *   **Ontological Debates:** Defining the "observable/empirical facts" uncontroversially is impossible (e.g., theory-ladenness of observation).
      *   **Meta-Consistency:** Justifying the theory's *own* neutrality is impossible without circularity.
  4.  **The Consequence:** Most accounts either:
      *   **Smuggle in Substance:** They implicitly rely on a favored ontology or semantics (e.g., physicalism) as the neutral ground, making disputes "verbal" only relative to *that* framework (failing Requirement 1 & 6).
      *   **Become Trivial:** They define verbalness so narrowly (e.g., *only* classic ambiguity like "bank") that they fail Requirements 2, 3, 4, 5, and 6, becoming useless for the interesting cases.
      *   **Become Self-Undermining:** They declare all disputes potentially verbal relative to some framework, but struggle to justify their own framework non-circularly (failing Requirement 7).

  **Which Requirement Would I Drop? None.** They form a coherent set for the task *you* defined. Dropping any (especially 1, 2, 4, 5, or 7) cripples the theory's ability to handle the hard cases you care about. The challenge is to build a theory that *satisfies all*, likely by:

  1.  **Embracing Pragmatism:** Grounding "neutrality" in shared practical goals or context rather than metaphysical bedrock (helps with 1, 4, 5, potentially 7).
  2.  **Focusing on Conceptual Role:** Analyzing disagreement in terms of the *inferential/conceptual roles* assigned to terms within each speaker's overall web of belief, and looking for mismatches (helps with 1, 2, 3, 4, 6).
  3.  **Accepting Relativity (Carefully):** Acknowledging that verbalness might be relative to a *purpose* or *level of description*, while providing principled ways to identify when a shift in purpose/level *is* the substantive issue (helps with 1, 4, 6, 7).

  **Conclusion:** An adequate theory must navigate the Neutrality Trap without collapsing into triviality, circularity, or self-refutation, while robustly handling modality, language variance, pragmatic residue, participant usability, ontological debates, and its own meta-status. The Neutrality Requirement (1) is the primary killer of otherwise plausible accounts. Any successful theory will likely be complex, pragmatic, and focused on conceptual roles and contextual purposes rather than seeking a mythical Archimedean point.
