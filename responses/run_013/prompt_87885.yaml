prompt: |-
  Alright, I want an actual number from you on this one, not a tour of the literature. The claim: there's a fact of the matter, independent of our classificatory interests, about which organisms belong to the same species -- not just a convenient way of filing things, an actual joint in nature. I've been sitting at about 0.35 for a while and I can't tell if that's a considered view or just the residue of reading too many people say "there are dozens of species concepts, pick one."

  Here's the thought experiment I keep using to pin the claim down, tell me if it's a good one. Imagine an omniscient being that knows every genealogical fact, every gene-flow event, every ecological niche, every developmental pathway -- everything there is to know -- but has no interests, no purposes, and no need to communicate with anyone. You ask it whether two populations are the same species. Is its answer determinate? If yes, that looks like realism. If it shrugs, or says "depends what you want the category for," we're somewhere weaker.

  So: what's your number, decomposed, with a rough probability and one line of justification per term. I'd expect something like (a) P(at least one of the competing concepts latches onto a real division at all), (b) P(given a, that one concept covers the whole of life rather than the job being split -- interbreeding for the animals, something else for bacteria and the asexuals), (c) P(that the leftover disputes are factual rather than interest-relative, i.e. that the omniscient being above really is determinate), and (d) whatever else you think belongs in the product. Then combine them, tell me which term the final number is most sensitive to, and what you'd have to learn to move it by 0.1.

  Also, adn this is the part I actually care about: if a friend lands at 0.7 and I'm at 0.35, where is that disagreement most likely living? Is it the realism question, the monism-vs-pluralism question, or whether pluralism is even a stable place to stop before it slides into "it's all conventions"?
