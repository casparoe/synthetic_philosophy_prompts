  - Or they’re pluralists who think "ecological species" is as real as "interbreeding" for their contexts.  
  - User’s fear of sliding into convention is valid—pluralism often collapses into "use whatever concept suits your purpose."  

  The reveal: user’s 0.35 isn’t residue—it’s defensible if you demand discrete joints. Friend’s 0.7 might reflect "patterns are real enough" pragmatism. They’re debating different things.  

