  Hmm, their real agenda seems to be understanding why they disagree with their "0.7 friend." That's the emotional core—they're less interested in abstract truth than in mapping the disagreement space. Smart framing. The subtext is: "Am I missing something, or is my friend overconfident?" 

  Breaking it down:  
