prompt: |-
  I teach the closing module of a third-year course in formal epistemology and decision theory, and I am drafting the take-home paper for the final examination. I have set a question on the two-envelope paradox every year, and the scripts have become nearly interchangeable: students reproduce, with small variations, the received line that the switching argument treats the unknown amount as at once a fixed quantity and a random variable, and that no proper probability distribution makes the two candidate amounts equiprobable, and then they stop, having said nothing that would survive a change in the numbers. I want a question for which that recitation is the beginning of the answer rather than the whole of it — one where the student has to carry the diagnosis into a case that the textbook treatment does not cover off the shelf.

  I want the question built on the following scenario, stated in the paper in these terms. Before the game begins, the host announces her procedure: she will toss a fair coin, and on heads she will seal ten dollars in one envelope and twenty in the other, while on tails she will seal twenty dollars in one envelope and forty in the other. She shuffles the pair, the player draws one at random, opens it, and only then chooses whether to keep it or exchange it for its partner. The question should oblige the student to do three things in order. First, for each amount the player might see, decide whether the optimal move is to keep or to exchange, and give the conditional expected gain or loss from exchanging at that amount. Second, compute the expected value of the best available policy and compare it with the expected value of the two constant policies, always keep and always exchange, so that the student discovers, and must explain, that the constant policies are exactly tied with one another while the amount-conditional policy is strictly better than both. Third, tie this back to the original paradox's step in which the other envelope is said to hold twice or half the observed amount with equal probability: say precisely what that step presupposes about the player's prior over the amounts, what becomes of it once a prior is specified, and what a prior would have to look like for the step to hold at every amount. I would like a short final part asking the student to say what, if anything, remains paradoxical once the case has been worked through — whether the residue is a defect in decision theory, a lesson about the value of conditioning on one's own observation, or nothing at all — and I want the model answer to be scrupulous in separating the settled arithmetic from the contested interpretation, so that a student who presents a contested reading as the consensus, or the arithmetic as if it were in dispute, loses marks in proportion to how badly the two are conflated.

  Please return the response in three named sections, in this order: The question (the paper as it should be printed, about two hundred words); Model answer (roughly six hundred and fifty words); and Marking scheme (the specific moves a first-class answer must contain, the marks each is worth out of twenty, and, for each move, one line on how students characteristically go wrong on it). Where a move turns on a numerical result, give the number. Keep the whole thing self-contained: no citations, no reading list, and nothing that presupposes the student has read any particular paper.
reasoning: |-
  Hmm, the user is teaching a formal epistemology and decision theory course and wants to improve their exam question on the two-envelope paradox. They're frustrated that students just parrot the textbook response without deeper understanding. I need to create a question that forces students to apply the diagnosis to a new scenario.

  The user has provided a specific scenario with coin tosses determining envelope pairs (10-20 or 20-40). They want students to: 1) Determine optimal moves for each possible amount seen, 2) Calculate expected values comparing different policies, and 3) Connect this back to the original paradox's assumptions about priors.

  I'll need to design a question that requires conditional probability calculations. For each observed amount ($10, $20, $40), students should compute the expected gain from switching. For example: Seeing $10 means it must be the 10-20 pair (heads), so switching gains $10. Seeing $40 means tails and 20-40 pair, so switching loses $20. Seeing $20 is ambiguous - could be heads (switching loses $10) or tails (gains $20) - students must calculate the 50-50 expectation.

  For the expected value comparison: The optimal policy (switch at $10, keep at $20? No - wait, at $20 switching has positive expected value?) Let me verify: P(heads|$20)=0.5, P(tails|$20)=0.5, so E[switch|$20] = 0.5*(-10) + 0.5*(20) = +5. So actually should switch at $20 too? But at $40 we keep. The user mentioned the constant policies tie while conditional is better - I'll need to compute all three expected values.

  For the paradox connection: Students should explain that the original "half or double with equal probability" assumes an improper prior that can't exist. Here with specified prior, we see the assumption fails precisely at $20.

  The final part about "what remains paradoxical" should challenge students to distinguish settled math from philosophical interpretations - excellent for testing depth.

  For the model answer: I'll provide complete calculations with clear explanations of why switching is optimal at $10 and $20 but not $40, the expected value comparisons, and the prior analysis. The marking scheme will specify points for correct conditionals, policy comparisons, prior explanation, and paradox reflection - with common errors like miscalculating P(tails|$20) or missing that E[switch|$20]>0.

  This should meet all requirements: pushes beyond textbook answers, uses the specified scenario, and forces application of concepts to novel cases while maintaining mathematical rigor.
answer: |-
  ## The Question
  **(Approx. 200 words)**

  **Question 4: The Modified Envelope Game**
  The host tosses a fair coin. On Heads (probability 0.5), she places $10 in Envelope A and $20 in Envelope B. On Tails (probability 0.5), she places $20 in Envelope A and $40 in Envelope B. She then randomizes which envelope is which (so Envelope "A" or "B" is irrelevant). You randomly select one envelope, open it, observe the amount inside, and then decide to either KEEP it or EXCHANGE it for the other envelope.

  a)  For each possible amount you might observe ($10, $20, $40), state the optimal action (KEEP or EXCHANGE). For each amount, calculate the *conditional expected change in your wealth* resulting from choosing EXCHANGE, given that amount was observed. [8 marks]

  b)  Calculate the overall *expected value* of the following three strategies:
      i.   Always KEEP the first envelope selected.
      ii.  Always EXCHANGE the first envelope selected.
      iii. The optimal strategy defined in part (a) (choosing based on the observed amount).
  State which strategy yields the highest expected value and compare the expected values of the three strategies. Explain the result concerning the two constant strategies (i and ii). [7 marks]

  c)  The standard two-envelope paradox relies on reasoning that, whatever amount $X you observe, the other envelope contains $X/2 or $2X with equal probability, making switching advantageous. In this specific game:
      i.   What does this reasoning implicitly assume about your prior beliefs over possible amounts in the envelopes *before* observing any amount?
      ii.  Does this assumption hold for *every* amount $X you might observe in *this* game? Justify your answer by referring to your calculations in part (a).
      iii. What general property must a prior probability distribution over possible amounts satisfy for the "equal probability of half or double" step to hold for *every* possible observed amount $X? [4 marks]

  d)  Briefly state (1-2 sentences) what, if anything, remains puzzling or instructive about the original paradox after analyzing this concrete case. Is the residue a flaw in decision theory, a lesson about using observations, or nothing significant? [1 mark]

  ---

  ## Model Answer
  **(Approx. 650 words)**

  **a) Optimal Action & Conditional Expected Gain/Loss from Exchange:**
  *   **Observe $10:** If you see $10, the coin must have landed Heads (only Heads produces a $10 envelope). The other envelope must therefore contain $20. Switching gains $10 ($20 - $10). Expected gain from exchange = **+$10**. Optimal action: **EXCHANGE**.
  *   **Observe $20:** Seeing $20 is ambiguous. It could be the larger envelope from the Heads pair ($10, $20) or the smaller envelope from the Tails pair ($20, $40). Since the coin was fair and the initial envelope selection was random:
      *   Probability ($20 is from Heads | $20 observed) = P(Heads & $20 selected) / P($20 observed). P(Heads & $20 selected) = (0.5 * 0.5) = 0.25. P($20 observed) = P(Heads & $20 selected) + P(Tails & $20 selected) = (0.5 * 0.5) + (0.5 * 0.5) = 0.25 + 0.25 = 0.5. Therefore, P(Heads | $20) = 0.25 / 0.5 = **0.5**.
      *   Similarly, P(Tails | $20) = 0.25 / 0.5 = **0.5**.
      *   If you switch and it was Heads (other envelope is $10), you lose $10 ($10 - $20).
      *   If you switch and it was Tails (other envelope is $40), you gain $20 ($40 - $20).
      *   Expected gain from exchange = (0.5 * (-$10)) + (0.5 * (+$20)) = (-$5) + ($10) = **+$5**. Optimal action: **EXCHANGE**.
  *   **Observe $40:** If you see $40, the coin must have landed Tails (only Tails produces a $40 envelope). The other envelope must therefore contain $20. Switching loses $20 ($20 - $40). Expected gain from exchange = **-$20**. Optimal action: **KEEP**.

  **b) Expected Value Comparison:**
  i.  **Always KEEP:** You get the amount in the first envelope you pick. Possible first picks: $10 (P=0.25), $20 (P=0.5), $40 (P=0.25).
      Expected Value (Keep) = (0.25 * $10) + (0.5 * $20) + (0.25 * $40) = $2.50 + $10 + $10 = **$22.50**.

  ii. **Always EXCHANGE:** You get the amount in the *other* envelope. If you pick $10 (P=0.25), you exchange to get $20. If you pick $20 (P=0.5), you exchange: half the time you get $10 (if from Heads), half the time you get $40 (if from Tails). If you pick $40 (P=0.25), you exchange to get $20.
      Expected Value (Exchange) = (0.25 * $20) + (0.5 * [(0.5 * $10) + (0.5 * $40)]) + (0.25 * $20) = (0.25*$20) + (0.5*[$5 + $20]) + (0.25*$20) = (0.25*$20) + (0.5*$25) + (0.25*$20) = $5 + $12.50 + $5 = **$22.50**.

  iii. **Optimal Strategy (Exchange if $10 or $20, Keep if $40):**
      *   Pick $10 (P=0.25): Exchange → Get $20
      *   Pick $20 (P=0.5): Exchange → Get $10 (P=0.5 * 0.5 = 0.25) or $40 (P=0.5 * 0.5 = 0.25) → Avg $25
      *   Pick $40 (P=0.25): Keep → Get $40
      Expected Value (Optimal) = (0.25 * $20) + (0.25 * $10) + (0.25 * $40) + (0.25 * $40) = ($5) + ($2.50) + ($10) + ($10) = **$27.50**.
      *(Explanation: The 0.5 probability of picking $20 splits into two 0.25 probabilities: one where you switch and get $10, one where you switch and get $40. The 0.25 probability of picking $40 results in keeping $40).*

  **Comparison:** The optimal strategy (iii) yields the highest expected value ($27.50). The constant strategies, always KEEP (i) and always EXCHANGE (ii), yield the *same* expected value ($22.50). This tie occurs because the game is symmetric: the set of amounts you might end up with by always keeping ($10, $20, $40) is identical to the set you might end up with by always exchanging ($20, $10, $20 → i.e., $10, $20, $40). The constant strategies ignore the information gained from opening the envelope, treating all scenarios identically regardless of the observation.

  **c) Connection to Paradox Reasoning:**
  i.   The paradox step ("other envelope contains X/2 or 2X with equal probability") implicitly assumes a prior distribution over possible amounts where *every* possible amount $X has the property that $X/2 and $2X are also possible amounts, *and* that the relative likelihood of the pair ($X/2, $X) is the same as the relative likelihood of the pair ($X, $2X). This typically requires an *improper* prior (like a uniform distribution over all positive integers) where no specific amount is more probable than another, making the conditional probabilities undefined or forcing the "equal probability" assignment.

  ii.  **No**, this assumption does **not** hold for every amount $X in this specific game.
      *   If you observe **$10**, $2X=$20 *is* possible (Heads pair), but $X/2=$5 is **not** possible (no pair contains $5). The "equal probability" assumption fails completely here. Our calculation correctly showed only one possible outcome for switching (gain $10).
      *   If you observe **$40**, $X/2=$20 *is* possible (Tails pair), but $2X=$80 is **not** possible (no pair contains $80). The "equal probability" assumption fails completely. Our calculation correctly showed only one possible outcome for switching (loss $20).
      *   If you observe **$20**, both $X/2=$10 and $2X=$40 *are* possible amounts. Crucially, in this symmetric setup, the prior likelihoods of the pairs ($10,$20) and ($20,$40) *are* equal (both P=0.5). Furthermore, observing $20 doesn't distinguish which pair you have (as calculated, P(Heads|$20) = P(Tails|$20) = 0.5). Therefore, **only for $20** does the "equal probability" assumption hold: the other envelope contains $10 or $40, each with probability 0.5. Our calculation (+$5 expected gain) is consistent *only* for this specific amount under the given prior.

  iii. For the "equal probability of half or double" step to hold for *every* possible observed amount $X, the prior probability distribution over possible amounts must be such that the probability of the pair ($X/2, $X) is *exactly equal* to the probability of the pair ($X, $2X) for every $X that can be observed. This is impossible with a proper (normalizable) probability distribution over a set of amounts bounded away from zero and infinity. It would require an improper, scale-invariant prior (like the uniform prior on the log scale).

  **d) Residual Puzzle/Lesson:**
  After this analysis, the apparent paradox dissolves. The residue is primarily a **lesson about the critical value of conditioning on observations** in decision-making and the dangers of applying informal probabilistic reasoning (like assuming "half or double equally likely" universally) without specifying a coherent prior probability distribution. There is no defect in decision theory revealed here.

  ---

  ## Marking Scheme
  **(Total: 20 marks)**

  *   **Part a: Optimal Action & Conditional Expected Value (8 marks)**
      *   $10: Correct action (Exchange) and correct expected gain (+$10) [2 marks]
      *   $20: Correct action (Exchange) [1 mark], Correct calculation of P(Heads|$20)=0.5 and P(Tails|$20)=0.5 [2 marks], Correct expected gain calculation (+$5) [1 mark]
          *   *Common Error:* Incorrectly calculating P(Heads|$20) or P(Tails|$20) (e.g., assuming 1/3 and 2/3).
      *   $40: Correct action (Keep) and correct expected gain (-$20) [2 marks]

  *   **Part b: Expected Value Comparison (7 marks)**
      *   Correct EV(Always Keep) = $22.50 [1 mark]
      *   Correct EV(Always Exchange) = $22.50 [2 marks]
          *   *Common Error:* Incorrect handling of the $20 case under always exchange (e.g., averaging $10 and $40 but weighting incorrectly relative to other amounts).
      *   Correct EV(Optimal Strategy) = $27.50 [2 marks]
          *   *Common Error:* Incorrectly including the $20 observation outcome twice without splitting the probability or using wrong amounts after action.
      *   Correct identification that Optimal ($27.50) > Keep ($22.50) = Exchange ($22.50) [1 mark]
      *   Correct explanation for tie: Symmetry of the game / constant strategies ignore observation / same possible outcomes. [1 mark]

  *   **Part c: Prior Analysis (4 marks)**
      *   i. Correct identification of assumption: Uniform/improper prior, equal likelihood of pairs ($X/2,$X) and ($X,$2X) for any $X. [1 mark]
      *   ii. Correct statement that it holds *only* for $20. [1 mark] Correct justification referencing failure at $10 (no $5) and $40 (no $80), and success at $20 due to equal prior pair probabilities and symmetric posterior. [1 mark]
          *   *Common Error:* Stating it holds for all amounts, or failing to connect the justification to the specific amounts/calculations.
      *   iii. Correct statement of required property: P(pair ($X/2,$X)) = P(pair ($X,$2X)) for all observable $X. [1 mark]
          *   *Common Error:* Vague statements about "symmetry" without specifying the pair probabilities.

  *   **Part d: Residual (1 mark)**
      *   Correctly identifies the lesson about conditioning on observations OR correctly states nothing significant remains paradoxical OR rejects a defect in decision theory. [1 mark]
          *   *Mark Loss:* Presenting the residue *as* a paradox or flaw in decision theory loses this mark. Conflating the settled math (optimal policy) with a claim that the paradox still exists loses this mark.
