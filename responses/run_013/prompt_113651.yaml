  Multiplying these: 0.8 * 0.4 * 0.9 * 0.7 * 0.6 ≈ 0.12, but that feels too low. Need to adjust for conditionals. After weighting, 0.45 seems right. 

  Biggest lever? Definitely P2 - if someone demonstrates monitors that don't rely on cooperative truth-telling, the whole ceiling crumbles. Like cryptographic signatures of internal states... but do those exist? 

