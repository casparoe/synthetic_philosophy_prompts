prompt: |-
  For thirty-five years as a working physicist I took for granted that a theory fitting data already in hand is in better evidential shape than one that does not; only lately, reading philosophy of science, have I learned how hard that platitude is to make precise. The difficulty, I gather, is called the problem of old evidence: on the usual probabilistic account of confirmation, a datum that is already certain cannot raise the probability of a hypothesis, so the fit between an old measurement and a new theory appears to do no evidential work at all. Several repairs have been proposed, but before I choose among them I want the specification.

  Write the desiderata: what must any adequate treatment of confirmation deliver if it is to handle old evidence? For each requirement, give the case or consideration that motivates it, and mark which requirements are non-negotiable and which are merely the preferences of a particular camp. I would like the list to address at least the following, if these belong on it at all — and I would rather be told that one of them is a prejudice than have it quietly accommodated:

  - The historical episodes in which agreement with a datum obtained before the theory is treated as part of the case for the theory (the precession of Mercury's perihelion being the stock example). An account that declares old evidence inert loses the very confirmations it was meant to explain.
  - The case in which the old datum was not merely known beforehand but was used in constructing the hypothesis, so that the agreement is not independent testimony. The account must not let a hypothesis be confirmed by the considerations that went into inventing it.
  - The case in which the observation is old but its bearing on the hypothesis is noticed only later — a measurement that sat unremarked in the literature until a theory made it relevant. I want to know whether the account counts this as old evidence or as new, and on what ground.
  - The difference between evidence that is old for a community and evidence that is old only for the individual who has just encountered it. Is the confirmatory relation relative to a person, or to the public record?
  - A constraint against solving the problem by imputing mere ignorance to the scientist. If an old datum confirms only because we had not yet seen that it followed from the hypothesis, the account seems to make confirmation turn on our limitations rather than on the world.
  - The ordinary asymmetry: a datum arriving after the hypothesis is supposed to count for more than the same datum arriving before. If that intuition must be surrendered, say so plainly.

  Close by telling me which single requirement does the most to rule out the accounts currently on offer, and whether any two of the requirements cannot be satisfied together. I would rather learn that the list is inconsistent than receive a tidy one that conceals the conflict.
reasoning: |-
  We are to list desiderata for an adequate treatment of the problem of old evidence in confirmation theory. The problem: on a standard probabilistic account (Bayesian), if a piece of evidence E is already known (so P(E)=1), then it cannot raise the probability of a hypothesis H (since P(H|E) = P(H) when P(E)=1). But intuitively, old evidence does confirm a theory (e.g., Mercury's perihelion precession for general relativity). We need requirements that any solution must meet.

  We address the points the user mentioned, and any others that are critical.

  Desiderata:

  1. **Historical Episodes (Non-negotiable):** The account must allow that old evidence (like the precession of Mercury) can confirm a new theory. If an account says old evidence cannot confirm, it fails to capture scientific practice. Motivation: The very problem of old evidence arises because we have such examples.

  2. **Ad Hoc Hypothesis (Non-negotiable):** The account must not allow that a hypothesis is confirmed by evidence that was used in its construction (unless there is independent evidence). Specifically, if the old datum was used to build the hypothesis, then the agreement should not count as independent confirmation. Motivation: Otherwise, we could always "confirm" a hypothesis by using the data we already have to build it, which is circular.

  3. **Old Evidence Newly Recognized (Negotiable? But important):** The account must clarify the status of evidence that was known but whose relevance to the hypothesis was not noticed until the hypothesis was proposed. The user wants to know if this counts as old or new. Motivation: This happens in science (e.g., a known measurement becomes relevant only in light of a new theory). The account should not treat it as new evidence (because it was already known) but still allow it to confirm. However, note that the recognition of the logical relation is new.

  4. **Relativity to Agent vs. Community (Negotiable?):** The account must specify whether the confirmatory relation is relative to an individual's state of knowledge or to the public state of scientific knowledge. Motivation: Evidence might be old for the community but new to an individual scientist. The user wants to know if confirmation is subjective (relative to an agent) or objective (relative to the community). This may vary by account.

  5. **Avoiding Epistemic Limitations (Non-negotiable):** The account must not make confirmation depend solely on the scientist's ignorance (e.g., not having noticed that H entails E). If the only reason E confirms H is because we didn't realize E followed from H, then confirmation becomes about our limitations. Motivation: We want confirmation to reflect a genuine evidential relation in the world, not just our lack of deduction.

  6. **Temporal Asymmetry (Negotiable?):** The account should capture the intuition that a piece of evidence that is predicted by a theory (i.e., the hypothesis comes first) is more confirmatory than the same evidence when it is already known and the theory is built to fit it. However, note that this asymmetry might not be absolute. The user wants to know if we must give up this intuition. Motivation: We often think that predicting a novel fact is stronger than accommodating an old one.

  Now, we add any other critical desiderata that might be missing? The user's list seems comprehensive.

  7. **Logical Consistency (Non-negotiable):** The account must be logically consistent. (This is a meta-requirement.)

  8. **Compatibility with General Confirmation Theory (Non-negotiable):** The account should fit within a broader theory of confirmation (e.g., Bayesian) without ad hoc adjustments that only apply to old evidence.

  Now, we address the user's specific questions at the end:

  - **Which single requirement does the most to rule out current accounts?** 
    The requirement that avoids making confirmation depend on ignorance (desideratum 5) is particularly challenging. Many accounts (e.g., the standard Bayesian solution that conditionalizes on the discovery of the logical relation) do make confirmation depend on the agent's prior ignorance of the entailment. This is seen as problematic because it makes confirmation subjective and dependent on cognitive limitations.

  - **Are any two requirements inconsistent?** 
    Let's consider:

    - Desideratum 1 (old evidence must confirm) and the standard Bayesian framework (which says old evidence cannot confirm) are in conflict. That's the starting point.

    - Desideratum 5 (avoid ignorance-based confirmation) and the standard solution (which uses the discovery of the entailment) are in conflict. The standard solution says that when we learn that H entails E (and E is old), then we update on that logical fact, which can raise the probability of H. But this update is a result of our ignorance of the entailment.

    - Desideratum 2 (no confirmation by evidence used in construction) and desideratum 1 (old evidence confirms) must be balanced. We want old evidence to confirm, unless it was used to build the hypothesis. So we need a way to distinguish between independent old evidence and old evidence that was used.

    - Desideratum 6 (temporal asymmetry) might conflict with desideratum 1 if we interpret temporal asymmetry as meaning that old evidence should not confirm as much as new. But we can have both: old evidence confirms, but new evidence (prediction) confirms more.

    The most challenging conflict is between desideratum 1 and the standard Bayesian framework, and between desideratum 5 and the standard solution. 

    However, note that desideratum 5 and the standard solution (which is a popular way to solve the problem) are at odds. If we require that confirmation must not depend on our ignorance, then we cannot use the standard solution. This requirement (desideratum 5) rules out the standard solution and many others.

    Also, note that desideratum 3 (old evidence newly recognized) and desideratum 5 are related: if we treat the recognition of the entailment as the key event, then we are again making confirmation depend on our ignorance.

    Therefore, the most critical conflict is between the need for old evidence to confirm and the desire to avoid making confirmation depend on ignorance.

    It is also possible that desideratum 6 (temporal asymmetry) and desideratum 1 (old evidence confirms) can coexist if we say that both old and new evidence confirm, but new evidence (prediction) confirms more. However, if an account does not capture this asymmetry, then it fails desideratum 6.

    In summary:

    - Desideratum 5 (avoid ignorance) is a major obstacle for many accounts.

    - We must note that there is no universally accepted solution that satisfies all desiderata.

    Let me close by explicitly answering:

    The requirement that does the most to rule out current accounts is **desideratum 5** (avoid making confirmation depend on our ignorance). 

    Regarding inconsistency: the most prominent conflict is between desideratum 5 and the standard Bayesian solution (which is the most common approach). Also, desideratum 2 and desideratum 1 must be carefully balanced to avoid circular confirmation. But note, the requirements themselves are not necessarily inconsistent. It is the proposed solutions that struggle to satisfy them all.

    However, we must note that it is an open problem and no account satisfies everyone.

    Final note: The user should be aware that some philosophers of science might challenge some of these desiderata. For example, some may argue that the temporal asymmetry (desideratum 6) is not essential or that confirmation is inherently subjective (contrary to desideratum 5). But the user wants a list that reflects the challenges.

    We present the desiderata as above.
answer: |-
  ### Desiderata for Handling Old Evidence in Confirmation Theory

  Below are the desiderata for any adequate treatment of confirmation that addresses the problem of old evidence. Each requirement is motivated by a specific case or consideration, and its negotiability is assessed. The list prioritizes clarity and confronts potential conflicts, per your request. The requirements are grounded in your specified cases, with additional critical constraints included for completeness.

  1. **Historical Episodes Requirement**  
     - **Description**: Old evidence (e.g., Mercury's perihelion precession for general relativity) must be able to confirm a new hypothesis. An account that renders old evidence inert fails.  
     - **Motivation**: The precession of Mercury was known before Einstein's theory, yet its fit with general relativity is universally seen as confirmatory. Denying this undermines the account's explanatory power for real scientific practice.  
     - **Negotiability**: **Non-negotiable**. Without this, the account cannot capture the core historical justifications for theories.

  2. **Anti-Ad-Hoc Requirement**  
     - **Description**: Evidence used explicitly to construct a hypothesis cannot confirm that same hypothesis. The account must block circular "self-confirmation."  
     - **Motivation**: If a theorist curve-fits data to build a hypothesis (e.g., tuning a cosmological constant to match observed expansion), the agreement is not independent evidence. Allowing this would permit trivial confirmation.  
     - **Negotiability**: **Non-negotiable**. This is a minimal guard against pseudo-science.

  3. **Newly Recognized Relevance Requirement**  
     - **Description**: Evidence that is old (publicly known) but whose relevance to a hypothesis is noticed only later (e.g., a dormant measurement in the literature) must still confirm the hypothesis, and the account must classify it as old evidence.  
     - **Motivation**: Consider a 19th-century measurement of cathode rays, ignored until J.J. Thomson's electron theory highlighted its significance. The datum was old, but its logical connection was unnoticed. Treating it as "new" evidence conflates discovery of entailment with discovery of the datum itself.  
     - **Grounds for Classification**: The evidence is "old" because its existence was established prior to the hypothesis; only its logical relation is new.  
     - **Negotiability**: **Non-negotiable** for the classification (it must be old evidence), but negotiable on *how* confirmation occurs (e.g., via recognition of entailment).

  4. **Agent-Relativity vs. Community-Relativity Requirement**  
     - **Description**: The account must specify whether confirmatory status depends on individual knowledge or communal knowledge. It should prefer community-relativity but allow for agent-relative contexts in limited cases.  
     - **Motivation**: Evidence old to the community (e.g., Mercury's perihelion) should confirm for all scientists. However, evidence new to an individual (e.g., a student learning of the precession after formulating a theory) might intuitively confirm for them. The primary focus should be communal to avoid subjectivity.  
     - **Negotiability**: **Negotiable**. Some accounts (e.g., Bayesian) lean agent-relative; others (e.g., objective Bayesianism) aim for community-relativity. A hybrid approach is acceptable if it privileges public evidence.

  5. **No-Ignorance-Dependence Requirement**  
     - **Description**: Confirmation must not rely solely on the scientist's prior ignorance of logical entailments. It should reflect an objective evidential relation, not cognitive limitations.  
     - **Motivation**: If confirmation occurs only because we failed to deduce that \(H\) entails \(E\) (e.g., not realizing a hypothesis predicts a known law), it reduces confirmation to an artifact of human frailty. We want confirmation to track truth-conduciveness.  
     - **Negotiability**: **Non-negotiable**. This is central to avoiding epistemic subjectivism.

  6. **Temporal Asymmetry Requirement**  
     - **Description**: Novel predictions (data unknown when the hypothesis is formulated) should provide stronger confirmation than accommodations of old evidence, all else equal.  
     - **Motivation**: Einstein's prediction of gravitational lensing (unknown in 1915) strengthened general relativity more than its fit with Mercury's precession (known). Surprise matters: prediction tests a theory's riskiness.  
     - **Negotiability**: **Negotiable in strength, non-negotiable in direction**. An account may quantify the asymmetry (e.g., via Bayes factors), but it must not reverse it (novel evidence cannot be *weaker*). If asymmetry must be surrendered, the account must explicitly state this.

  7. **Logical Non-Circularity Requirement** (Implicit in your cases, added for completeness)  
     - **Description**: The account must not presuppose the confirmatory power it seeks to explain (e.g., by sneaking in temporal or agent-relative factors without justification).  
     - **Motivation**: Solutions that "fix" old evidence by redefining evidence (e.g., "the discovery that \(H \vdash E\)") must avoid circularity.  
     - **Negotiability**: **Non-negotiable**. Basic coherence demand.

  ---

  ### Conflicts and Ruling-Out Power

  - **Most Rule-Out Requirement**: The **No-Ignorance-Dependence Requirement (5)** does the most to exclude existing accounts.  
    - **Why**: Most popular solutions (e.g., standard Bayesian responses) invoke ignorance of entailment. For instance, they hold that learning "\(H \vdash E\)" raises \(P(H)\) when \(E\) is old. This directly violates Requirement 5 by tying confirmation to the agent's prior inability to deduce the consequence. Accounts like Garber's (1983) or Jeffrey's (1983) fall here. Only approaches like historically informed Bayesianism (e.g., relaxing \(P(E) = 1\)) avoid this, but they face other issues (e.g., violating Requirement 6).

  - **Inconsistent Pair**: **Requirement 1 (Historical Episodes) and Requirement 5 (No-Ignorance-Dependence) cannot be jointly satisfied** under standard Bayesianism.  
    - **Why**:  
      - Requirement 1 demands that old evidence confirms.  
      - Requirement 5 forbids grounding confirmation in ignorance (e.g., not knowing \(H \vdash E\)).  
      - But in Bayesianism, if \(E\) is old (\(P(E) = 1\)), \(P(H|E) = P(H)\) unless we appeal to a *change* in knowledge (e.g., learning \(H \vdash E\)).  
      - Thus, satisfying Requirement 1 typically forces reliance on ignorance (violating Requirement 5). Only radical departures (e.g., non-probabilistic accounts) might resolve this, but they risk losing precision.  
    - **Implication**: If you insist on both, Bayesianism must be abandoned or modified beyond recognition. This conflict is why the problem remains unsolved after decades.

  No other pair is *strictly* inconsistent, but tensions exist:
  - **Requirement 3 (Newly Recognized Relevance) and Requirement 5 (No-Ignorance-Dependence)**: Classifying "noticed relevance" as old evidence (Requirement 3) but avoiding ignorance (Requirement 5) is challenging. If recognition of entailment is not ignorance-based, what is it?
  - **Requirement 6 (Temporal Asymmetry) and Requirement 1 (Historical Episodes)**: If old evidence confirms strongly, asymmetry weakens. But they coexist if the account allows confirmation with a "discount" for accommodations.

  ---

  ### Conclusion
  The list is not "tidy" because the problem is unresolved: **Requirement 1 and Requirement 5 conflict under mainstream probabilistic approaches**, exposing a core tension in confirmation theory. Requirement 5 is the starkest challenge to existing accounts, ruling out most Bayesian solutions. If you prioritize historical cases (Requirement 1), you may need to tolerate some ignorance-based mechanism (softening Requirement 5). If you reject ignorance-dependence, you may need to abandon Bayesianism or reinterpret "old evidence" (e.g., as a *type* of novel prediction). I recommend starting with Howson's (1984) counterfactual Bayesian approach (relaxes \(P(E) = 1\)) for its balance, but note it struggles with Requirement 5. For a non-ignorance-based view, explore Mayo's (1996) error-statistical account—though it may jettison probabilistic confirmation altogether. The conflict is real; accommodating all desiderata may require rethinking evidential support itself.
