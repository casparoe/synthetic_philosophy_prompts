  We are designing a two-phase activity for a 90-minute seminar. The goal is to demonstrate, without mentioning Darwin or Turing, how competent outcomes can arise without comprehension and how comprehension can be inert.

   Phase 1: Group produces a competent outcome without any individual understanding how it was achieved or being able to explain it.
   Phase 2: Group is given a clear procedure that they understand but cannot use to produce the competent outcome.

   The two phases should be distinct but with a shared structure that becomes apparent in debrief.

   Constraints:
   - No real money for incentives.
   - The point must emerge from the activity, not from explanations during the activity.
   - Debrief will map the inversions and note disanalogies (external selector in phase 1, external designer in phase 2).

   Activity Design:

   Activity Title: "The Pattern Game" (to be revealed only at the end as an analogy)

   Materials:
   - For Phase 1: A set of 20-30 cards, each with a unique pattern of dots (or simple shapes) on one side and a blank back. The patterns should be complex enough that it's hard to describe a rule, but simple enough that patterns can be compared.
   - For Phase 2: A written description of a rule that generates a pattern (this rule should be understandable but computationally complex or requiring many steps to generate a pattern that meets a criteria).
   - Whiteboard or flip chart to record scores.
   - Timer.

   Timeline (90 minutes total):

   1. Introduction (5 minutes): Explain that we are doing a group activity about patterns and rules. Do not reveal the point. Divide the class into two teams (Team A and Team B) of about 9 each.

   2. Phase 1: The Emergent Pattern (30 minutes)
      - Setup (5 minutes): Each team sits in a circle. The facilitator gives each team an identical set of 20 pattern cards (face down, so they can't see the patterns). The goal is to produce a sequence of 5 cards that forms a "highly valued" pattern. They are told that the value of a sequence is determined by a scoring rule that the facilitator has, but they are not told the rule. They will play 5 rounds.

      - Procedure (20 minutes):
          - In each round, every team member gets to see one card (drawn randomly from the set) and must decide whether to "play" it into the team's sequence or not. They have 30 seconds per round to decide. They cannot show their card to others or describe it in words (only say "I have a card" and then decide to play or not). If they play it, they place it face up in the center. If not, they put it aside (face down). 
          - After all have decided, the team has 2 minutes to arrange the played cards (if any) into a sequence of up to 5 cards (if they have more than 5, they must choose 5; if fewer, they use what they have). They must arrange the cards in a line, and then the facilitator scores the sequence according to a hidden rule (e.g., the pattern that most closely matches a target pattern that the facilitator has in mind, but note: the rule is fixed and based on an algorithm that the facilitator uses, e.g., the pattern with the highest "symmetry score" or the one that most closely matches a pre-drawn target pattern). The scoring rule is complex and not obvious (e.g., based on the number of matching features with a hidden template, or a mathematical function of the dot positions).
          - The facilitator records the score for that round (e.g., on a scale of 1 to 10) and then the next round begins with new random cards.
          - After 5 rounds, the team's total score is the sum of the scores for each round.

      - Incentive: The team with the highest total score wins. The winning team gets bragging rights and perhaps a small non-monetary prize (e.g., a sticker or the right to choose the next activity in a future class).

      - Key point: No one knows the scoring rule. They are trying to produce a high score by trial and error and by observing which sequences get high scores. The competent outcome is the sequence that scores high. Over rounds, they might start to notice patterns (e.g., "last time we had a lot of dots in the center and got a high score") but they won't know the exact rule. At the end, if asked, they could not state the rule precisely.

   3. Phase 2: The Rule-Based Pattern (30 minutes)
      - Setup (5 minutes): The same two teams are now given a written rule that describes how to generate a pattern that would get a high score (the same scoring rule as in Phase 1). The rule is explicit and understandable. For example: "The pattern must have at least two axes of symmetry" or "The pattern must have exactly 10 dots, with no two dots in the same row or column and forming a perfect circle when connected in order." (But note: the rule must be one that is hard to execute without computational aids because it requires many steps or precise calculations.)

      - Procedure (20 minutes):
          - Each team is given 15 minutes to generate a pattern that they believe will score highly. They can use pen and paper to design it, but they must produce a single pattern (on a card that they draw, or by arranging dots on a grid provided). They are allowed to use the rule to design the pattern.
          - After 15 minutes, each team presents their pattern. The facilitator scores both patterns using the same rule as in Phase 1.

      - Key point: Even though they understand the rule, they might not be able to generate a pattern that achieves a high score because the rule is complex and requires computational steps that are error-prone when done by hand. For example, if the rule involves checking for symmetry in multiple dimensions or requires a specific arrangement that is hard to draw by hand, they might make a mistake.

   4. Debrief (25 minutes):
      - Start by asking the students about their experience in Phase 1: 
          - "How did you decide which cards to play and how to arrange them?"
          - "Did anyone figure out the scoring rule? Could you write it down now?"
          - Emphasize that the team produced sequences that improved over time (hopefully) without anyone knowing the rule. The competent outcome (high-scoring pattern) emerged without comprehension.

      - Then ask about Phase 2:
          - "How did having the rule help? Were you able to produce a high-scoring pattern easily?"
          - "What was difficult about using the rule?"

      - Reveal the analogy:
          - "In the first phase, we had a process that produced something that looked designed or planned (a high-scoring pattern) without anyone knowing the rule. The rule was hidden and acted as a selector (like natural selection). The environment (the scoring rule) shaped the outcome without any comprehension by the participants."
          - "In the second phase, we had comprehension (you understood the rule) but that comprehension was inert. You couldn't easily produce the pattern because the rule was complex and required computational steps that are hard to do by hand. This is like a Turing machine: we can specify a procedure that we understand, but actually executing it may require a mechanical process that doesn't involve comprehension at each step."

      - Map the moments:
          - Phase 1: The selection by the scoring rule (external selector) without any individual understanding -> analogy to Darwin.
          - Phase 2: The explicit rule that is understood but hard to execute -> analogy to Turing.

      - Disanalogies:
          - In Phase 1, the selector (scoring rule) is external and does the selecting. But in nature, there is no external agent setting the rule; the environment is the selector.
          - In Phase 2, the rule was designed by the facilitator (external designer). In a Turing machine, the procedure is designed by a programmer, but the machine doesn't comprehend.

