answer: |-
  ### Activity Design: "The Pattern Game"

  #### **Overview**
  This 90-minute activity stages a double dissociation to demonstrate how competent outcomes emerge without comprehension (Phase 1) and how comprehension alone fails to produce competence (Phase 2). Students work in teams to generate patterns under constrained rules, revealing the inversion of explanation without naming Darwin or Turing until debrief.

  ---

  ### **Materials**
  - **Phase 1**: 
    - 100+ cards with unique 4x4 grid patterns (dots or shapes). Each card is distinct.
    - A hidden scoring rule (e.g., *"Patterns with rotational symmetry score 10 points; mirror symmetry score 5; no symmetry score 1"*).
  - **Phase 2**: 
    - Grid paper and pens.
    - A written procedure: *"Generate a pattern with rotational symmetry using this algorithm: Divide the grid into quadrants. Place identical shapes in diagonally opposite quadrants."*
  - Whiteboard for scores, timer.

  #### **Timeline** (90 mins total)
  - **Set-up (5 mins)**: Split into 3 teams of 6. Explain only basic rules (no theory).
  - **Phase 1: Emergent Competence (30 mins)**  
  - **Phase 2: Inert Comprehension (30 mins)**  
  - **Debrief (25 mins)**  

  ---

  ### **Phase 1: Emergent Competence (30 mins)**  
  **Goal**: Teams produce high-scoring patterns *without knowing the scoring rule*.  

  **Rules**:  
  1. Each round, every player draws 1 random pattern card (hidden from others).  
  2. **Individual Decision (1 min)**: Each player *must* play their card face-down into a team pool or discard it. No descriptions allowed (e.g., "This looks symmetric!").  
  3. **Team Selection (2 mins)**: Teams select 5 cards from their pool to submit, without seeing patterns.  
  4. **Scoring**: Facilitator reveals patterns and applies the hidden rule (e.g., rotational symmetry = 10 pts). Score displayed.  
  5. **Repeat for 4 rounds**.  

  **Incentive**: Team with highest cumulative score wins "Pattern Master" title (non-monetary prestige).  

  **Why it works**:  
  - Teams develop strategies (e.g., "We scored high when we picked more cards!") but *never learn the actual rule*.  
  - Competence (high scores) emerges from environmental selection (scoring rule), not planning.  

  **Predictable Issues**:  
  - **Issue**: Students whisper card descriptions.  
    **Fix**: Enforce silence; discard cards if rules broken.  
  - **Issue**: Teams ignore low-scoring cards early on.  
    **Fix**: After Round 2, hint: "Some low-scoring cards become valuable later."  

  ---

  ### **Phase 2: Inert Comprehension (30 mins)**  
  **Goal**: Teams use a clear, comprehensible procedure to *generate* a pattern, but fail to produce high scores.  

  **Rules**:  
  1. Give teams the written procedure (e.g., *"Create rotational symmetry: Identical shapes in diagonally opposite quadrants"*).  
  2. **Task (15 mins)**: Generate a new pattern from scratch using the procedure.  
  3. **Scoring**: Apply the *same hidden rule* as Phase 1. Most teams fail (e.g., their patterns lack mirror symmetry, scoring 5 vs. 10).  

  **Incentive**: Bonus points for beating Phase 1’s top score (rarely achieved).  

  **Why it works**:  
  - Students *understand the procedure* but cannot optimise for the scoring rule (e.g., they create rotational symmetry but miss mirror symmetry).  
  - Comprehension is "inert" without the selector (environment).  

  **Predictable Issues**:  
  - **Issue**: Teams overcomply ("We followed the steps perfectly!").  
    **Fix**: Reaffirm: "Your task is to score high, not just follow steps."  
  - **Issue**: Frustration at low scores.  
    **Fix**: Wait for debrief to resolve tension.  

  ---

  ### **Debrief (25 mins)**  
  **Reveal the Double Dissociation**:  
  1. **Phase 1 Recap**:  
     - *Competence without comprehension*: "Your team produced high-scoring patterns, but no one knew *why* they scored high. The scoring rule (environment) 'selected' outcomes, not your judgement."  
     - **Map to Darwin**: Natural selection shapes adaptations without a "comprehender" — outcomes emerge from environmental pressure.  

  2. **Phase 2 Recap**:  
     - *Comprehension without competence*: "You understood the procedure, but it couldn’t generate high scores alone. The designer (me) supplied the steps, but they were 'inert' without the selector."  
     - **Map to Turing**: Algorithms execute tasks without understanding — intelligence is mechanised, not introspective.  

  **Disanalogies & Temptations**:  
  - **Disanalogy 1**: In Phase 1, the *selector* (scoring rule) is external. In nature, the "selector" is the environment (no designer).  
  - **Disanalogy 2**: In Phase 2, the *designer* (you) is external. In Turing, the programmer’s comprehension is separate from execution.  
  - **Temptation to Reinsert Comprehension**:  
    - Phase 1: "Did you feel like the *team* collectively understood?" (They didn’t; selection was blind).  
    - Phase 2: "Did you blame the *designer* for your low score?" (Highlights urge to credit a "mind").  

  **Final Point**:  
  - "Darwin and Turing inverted explanation: competence arises from mindless processes (selection/computation), not hidden comprehension. Where did *you* feel the urge to reinsert a comprehender?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Cumulative Selection (Darwin)**:  
  - The activity lacks *iterative inheritance*. Phase 1 has no "generations" where successful patterns inform future trials.  
  - **Debrief Supply**: "In nature, selection accumulates micro-changes over time. Here, rounds were independent — but imagine if winning cards 'reproduced' in the next round."  

  **Automated Execution (Turing)**:  
  - Phase 2’s failure stems from *human* limitations (slowness, errors).  
  - **Debrief Supply**: "A Turing machine executes procedures flawlessly at scale. Your struggle highlights the machine’s role: comprehension in design, not execution."  

  ---

  ### **Logistical Notes**  
  - **Test Run**: Pilot the scoring rule (e.g., ensure 20% of Phase 1 cards score 10 points).  
  - **British English**: Use "maths" (not "math"), "brilliant" for praise, "whinge" if students complain.  
  - **Stick to Timeline**: Use visible timers. If Phase 2 drags, call: "Pencils down in 60 seconds!"  

  This design forces students to *experience* the inversion. By debrief, they’ll grasp why "Darwin and Turing kicked the ladder of comprehension away."
