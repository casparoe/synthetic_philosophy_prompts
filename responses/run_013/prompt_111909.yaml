  ### Brief Theory Assessments
  - **Judgmentalism**: Strong on R5 (appraisal variance), R11 (criticizability), R15 (explanatory role), R16 (normativity). Weak on R1 (recalcitrance), R3 (objectless), R6 (fictional), R7 (animals), R9 (ambivalence).  
  - **Perceptualism**: Strong on R1 (recalcitrance as illusion), R3 (objectless as vague perception), R6 (fictional as quasi-perception). Weak on R4 (dissociation if perception=body), R14 (physiology variability), R16 (normativity if perceptions lack truth).  
  - **Feeling theory**: Strong on R2 (non-threat chills), R3 (objectless dread), R7 (animals), R8 (misattribution). Weak on R4 (dissociation), R5 (appraisal variance), R11 (criticizability), R15 (explanatory role), R16 (normativity).
