  ok so I'm in this third-year phil of mind / cognitive science module and my essay has to pick a side on the big one: are emotions judgements (belief-ish appraisals), are they perceptions (of value, or of what's happening in your body), or are they just feelings -- bodily states and sensations, that kind of thing. Before I pick a side I want the spec. Not an explanation of what an emotion is; I want the desiderata any theory of emotion has to meet before it's worth taking seriously at all: the cases it has to get right, the distinctions it can't collapse, the empirical results it can't contradict, each with the case or consideration that puts it on the list, and a note on whether it's non-negotiable or just something one camp happens to want.

  These are the cases I keep tripping over in the seminar and I definately want them on the list (if two of them turn out to be the same requirement, merge them and say so):
  - fear of a spider that doesn't budge when you know full well the spider is harmless -- you still flinch, your heart still goes
  - the shiver down the back from a piece of music, where nothing is at stake and nothing is threatening anything
  - 3am dread with no object -- you can't finish the sentence "I'm scared of..."
  - body and report coming apart: racing heart, sweaty palms, person reports feeling nothing; and the reverse, someone says they're terrified while nothing shows
  - the same situation making one person furious and another terrified, with the label tracking how they read the situation rather than the situation itself
  - crying at a film about people who never existed
  - a dog shaking at the vet, a rat freezing at a tone that used to mean a shock
  - the feeling you only notice afterwards, or name wrongly -- someone snaps and later says it wasn't anger, it was shame
  - ambivalence: loving and resenting the same person at the same moment
  - "we felt humiliated" said about a team, a company, a country
  - emotions people get criticised for and can't help -- "you shouldn't feel grateful for that", or a disgust someone has and wishes they didn't
  - curiosity, boredom, the click of suddenly getting something -- ones that don't fit the fear/anger template
  - emotion vocabularies not lining up across languages, one word covering what another language splits into two, or the reverse
  - the physiology not sorting into one signature per emotion, i.e. the measurements don't line up one-to-one with the labels people report
