  ### Desiderata Table for Theories of Emotion

  | req_id | requirement                                      | what_it_demands                                                                                               | motivating_case                                                                 | status          | who_insists           | pressure_on              |
  |--------|--------------------------------------------------|---------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|-----------------|-----------------------|--------------------------|
  | R1     | Recalcitrant emotions persist despite contrary judgments | Theory must allow emotions to occur independently of rational belief updates.                                | Fear of a harmless spider (know it's safe, still flinch)                       | non-negotiable  |                       | judgmentalism            |
  | R2     | Emotions arise without threat/stake              | Theory must explain non-survival-oriented emotions not tied to immediate goals.                              | Shiver from music (no threat, nothing at stake)                                | non-negotiable  |                       | feeling (if threat-focused) |
  | R3     | Emotions lack an intentional object              | Theory must accommodate emotions without a clear target or external cause.                                   | 3am dread (no object: "I'm scared of...")                                      | non-negotiable  |                       | judgmentalism, perceptualism |
  | R4     | Bodily symptoms and subjective feeling dissociate | Theory must decouple physiological states from conscious emotional experiences.                              | Racing heart but no fear report; calm body but terror report                   | non-negotiable  |                       | feeling, perceptualism   |
  | R5     | Emotion type depends on appraisal, not situation | Theory must prioritize subjective interpretation over objective facts in emotion differentiation.             | Same situation: one furious, one terrified (appraisal varies)                 | non-negotiable  | judgmentalism, perceptualism | feeling           |
  | R6     | Emotions target fictional entities               | Theory must explain emotions toward non-real or imagined stimuli.                                            | Crying at a film (fictional characters)                                        | non-negotiable  |                       | judgmentalism            |
  | R7     | Emotions occur in non-linguistic beings          | Theory must apply to entities without language or complex concepts.                                          | Dog shaking at vet, rat freezing to tone                                       | non-negotiable  |                       | judgmentalism            |
  | R8     | Emotions are misattributed or recognized late    | Theory must allow for errors in emotional self-awareness or labeling.                                        | Snap in anger, later realize it was shame                                      | non-negotiable  |                       | all                      |
  | R9     | Simultaneous conflicting emotions toward one object | Theory must permit co-occurring opposite emotions without logical inconsistency.                             | Loving and resenting the same person at once                                   | non-negotiable  |                       | judgmentalism            |
  | R10    | Emotions attributed to groups                    | Theory must account for collective emotions not reducible to individual states.                              | "We felt humiliated" (team, country)                                           | camp-specific   | collectivist views    | all (especially feeling) |
  | R11    | Emotions are involuntary and normatively criticizable | Theory must explain why emotions can be inappropriate yet not willfully controlled.                         | Criticized disgust or gratitude ("shouldn't feel this")                        | non-negotiable  | judgmentalism, perceptualism | feeling           |
  | R12    | Non-basic emotions must be accommodated          | Theory must include emotions without clear physiological markers or survival functions.                      | Curiosity, boredom, insight ("click" of understanding)                         | non-negotiable  |                       | basic emotion theories   |
  | R13    | Emotion categories vary cross-culturally         | Theory must handle fluidity in emotion concepts across languages/cultures.                                   | One word for emotion in L1 splits into two in L2 (or vice versa)               | non-negotiable  |                       | universalist theories    |
  | R14    | No one-to-one physiology-emotion mapping         | Theory must allow for identical bodily states across emotions and variable states within one emotion.        | Same heart rate for fear/excitement; fear with/without sweating                | non-negotiable  |                       | feeling, basic emotions  |
  | R15    | Emotions explain behavior                        | Theory must show emotions are causally relevant to predicting/explaining actions.                            | Using "anger" to explain aggression                                            | non-negotiable  |                       | feeling                  |
  | R16    | Emotion ascriptions can be correct/incorrect     | Theory must provide criteria for normative assessment of emotional appropriateness.                          | Judging "Your fear is irrational" as true/false                                | non-negotiable  | judgmentalism, perceptualism | feeling           |
  | R17    | "Emotion" category useful even if not natural kind | Theory must justify the category's coherence if emotions lack unified essence.                             | Accounting for why we group diverse states as "emotions"                       | non-negotiable  |                       | all                      |

