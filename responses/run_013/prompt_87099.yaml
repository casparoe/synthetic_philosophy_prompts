prompt: |-
  I am a consultant in intensive care medicine, and I chair the working group at my trust that has to produce a written procedure for determining death — something a first-year doctor on a night shift can run at the bedside without a philosopher present. We have had three difficult cases in eighteen months and nothing on paper: a man on veno-arterial ECMO whose brainstem reflexes were absent and whose heart was still ejecting; a controlled donation-after-circulatory-death (Maastricht category III) donor whose family wanted the moment of death to be when the heart stopped while the retrieval team wanted five minutes of observation first; and a woman in a prolonged disorder of consciousness whose family insisted she had already died and were furious to be told she had not. Our regional group has proposed a scaffold that I am told is philosophically respectable but which is useless as written, and I want you to turn it into a procedure. The scaffold says that every determination must answer four questions in order: whether the patient has lost the capacity for integrated self-maintenance, as opposed to losing some particular organ, or consciousness, or personhood; whether that loss is irreversible; whether it is the whole brain or the circulation that has ceased; and — the one nobody can answer — who is entitled to be wrong. The group also insists on keeping two windows apart: an epistemic window (how long you must observe before you can be confident) and a metaphysical window (the moment at which, on your definition, death actually occurred), which I gather are not the same thing and come apart badly in DCD.

  Please write the procedure. It should be a sequence of questions in the order they must be asked, with what counts as a sufficient answer to each, the points at which the procedure stops with a no, and the points at which it must hand the decision to someone else — an ethics committee, a coroner, a court — because the question has become one of values rather than facts. For every step, say whether it is the determination of a fact or the exercise of a judgement, and who signs it off. It has to fit on two sides of A4 and be runnable within the hour. Two distinctions I need preserved rather than smoothed away: first, the difference between a cessation that is permanent (it will not be reversed, because no one will attempt to reverse it) and one that is irreversible (it cannot be reversed), which our neurologist keeps raising in DCD on the grounds that we could always put the patient back on bypass; second, the difference between the patient's death and the family's bereavement, which our nurses think we conflate.

  Then run the procedure on three cases: the ECMO patient, the DCD donor, and the woman in the prolonged disorder of consciousness — and please be straight with me about the last one, because the procedure will tell her family something they will not want to hear and I need to know how solid that answer is. I would also like you to mark clearly where the procedure is likely to misfire, particularly with a sedated two-month-old and with a family whose religious commitments reject brainstem criteria outright, and to end by saying what a procedure of this kind cannot do at all. Write in British English.
reasoning: |-
  Okay, the user is an intensive care consultant leading a working group to create a death determination procedure. They need a practical, step-by-step guide that first-year doctors can use at the bedside without philosophical debates. The key challenges are three complex cases: a VA-ECMO patient with absent brainstem reflexes but a pumping heart, a DCD donor with family vs. team disagreement on death timing, and a prolonged disorder of consciousness case where family believes death has already occurred.

  The regional group's scaffold has four questions: loss of integrated self-maintenance, irreversibility, identifying the ceased system (whole brain or circulation), and who can be wrong about it. But it's too theoretical. They also want to maintain the distinction between epistemic (observation time) and metaphysical (actual moment of death) windows, especially in DCD where they conflict.

  The procedure must preserve two critical distinctions: permanent vs. irreversible cessation (e.g., DCD where restarting bypass is possible but won't be done), and separating patient death from family bereavement. It needs to fit on two A4 pages, be executable within an hour, and specify when decisions shift from medical to ethical/legal domains.

  For structure, I'll design a flowchart-like sequence of questions. Each step must clarify: 
  - Whether it's fact determination or clinical judgment 
  - Who signs off 
  - Where it stops or requires escalation 
  - Clear pass/fail criteria

  Special vulnerabilities to address: 
  - Sedated infants (neurological assessment limitations) 
  - Religious objections to brain death criteria 
  - The inevitable conflicts in prolonged consciousness cases

  The three test cases will demonstrate practical application, especially the third where the procedure must firmly state continued life despite family distress. Final notes should acknowledge limitations: can't resolve value conflicts, define consciousness, or replace legal processes when disputes arise.

  The tone must remain clinically precise but accessible, using British English terminology ("coroner" not "medical examiner"). Crucially, it shouldn't shy away from uncomfortable truths—like confirming the conscious patient isn't dead—while signposting support pathways for families.
answer: |-
  ## Trust-Wide Procedure for Determination of Death (v1.0)
  **Purpose:** To provide a standardised, legally and ethically robust sequence for determining death at the bedside, distinguishing medical fact from value judgements requiring escalation.  
  **Scope:** Applies to all adult and paediatric patients (>37 weeks corrected gestational age) within the Trust.  
  **Prerequisites:** Senior Review (ST3+ or Consultant) mandated for all determinations. Full clinical notes required.  
  **Timeframe:** Core procedure executable within 60 minutes once prerequisites met. Escalations may extend timeframe.  

  **PROCEDURE SEQUENCE**  
  *Follow steps sequentially. Document answers, reasoning, sign-off, and time for each step.*

  1.  **Is there UNRESPONSIVITY & APNOEA?** (Fact Determination)
      *   **Check:** No response to central painful stimulus (e.g., supraorbital pressure). No respiratory effort observed for ≥1 minute during formal apnoea test (pre-oxygenation, disconnect ventilator, oxygenate via tracheal catheter, observe for rise in PaCO₂ > 6.0 kPa with no respiratory effort). *Caution: Sedation/paralysis must be excluded/reversed.*
      *   **Sufficient Answer:** YES (Proceed). NO (Stop: Patient is **not dead**. Treat reversible causes).
      *   **Sign-off:** Performing Doctor (ST1+ with Senior Review present/contacted). Senior Review confirms test performed correctly.

  2.  **Is the CAUSE OF COMA KNOWN, SUFFICIENT, and IRREVERSIBLE?** (Clinical Judgement & Fact Determination)
      *   **Check:** Established structural brain injury (e.g., massive intracranial haemorrhage, global hypoxic injury on imaging/clinical course) OR catastrophic circulatory failure. Reversible causes (metabolic, endocrine, toxic, sedative, hypothermia <34°C) excluded or treated without effect.
      *   **Sufficient Answer:** YES (Proceed). NO (Stop: **Not dead**. Investigate/treat reversible causes. Senior Review mandatory).
      *   **Sign-off:** Senior Review (ST3+ or Consultant). Documents cause and exclusion of reversibles.

  3.  **Has the CAPACITY FOR INTEGRATED SELF-MAINTENANCE CEASED?** (Clinical Judgement based on Fact)
      *   **Check:** Assess which physiological integrator has ceased:
          *   **(a) Whole Brain (including Brainstem):** Absent pupillary, corneal, vestibulo-ocular, gag, cough reflexes. No spontaneous respiratory drive (confirmed by apnoea test). *Essential for Neurological Determination of Death (NDD).*
          *   **(b) Circulatory System:** Absent central pulses (carotid/femoral) by palpation AND absent heart sounds on auscultation for ≥1 minute. Confirmed by arterial line trace flat for ≥1 minute AND/or asystole on ECG for ≥1 minute. *Essential for Circulatory Determination of Death (CDD).*
      *   **Sufficient Answer:** (a) YES (Proceed to Step 4a). (b) YES (Proceed to Step 4b). NO for both (Stop: **Not dead**. Senior Review).
      *   **Sign-off:** Senior Review (ST3+ or Consultant). Documents findings clearly (NDD or CDD pathway).

  4a. **NDD PATHWAY: Is the CESSATION of BRAINSTEM FUNCTION IRREVERSIBLE?** (Clinical Judgement & Fact Determination)
      *   **Check:** Confirm prerequisites met (Steps 1, 2, 3a). Perform second set of brainstem reflex tests & apnoea test by different Senior Doctor (ST3+/Consultant) after a minimum **Epistemic Window** (≥6 hours for primary brain injury; ≥24 hours if anoxic injury). Tests must show identical results.
      *   **Sufficient Answer:** YES (Proceed to Step 5). NO (Stop: **Not dead**. Continue treatment/investigation).
      *   **Sign-off:** Two Senior Doctors (ST3+ or Consultant). Document time of second test confirmation. Time of death is the time of the SECOND confirmatory test (Metaphysical Window).

  4b. **CDD PATHWAY: Is CIRCULATORY CESSATION PERMANENT and IRREVERSIBLE?** (Fact Determination & Policy/Judgement)
      *   **Check:**
          *   *Permanence:* Is resuscitation *attempted and failed* OR *not attempted* (e.g., valid DNACPR, futility agreed)? (Fact/Judgement).
          *   *Irreversibility:* After cessation, observe for the **Epistemic Window** (≥5 minutes for adults/paediatrics >10kg; ≥4 minutes for infants 2.5-10kg; ≥3 minutes for neonates <2.5kg). Confirm continuous absence of circulation (pulses, heart sounds, arterial trace, ECG asystole) throughout this period. *Irreversible = cannot be restarted spontaneously or with intervention. Permanent = will not be restarted.*
      *   **Sufficient Answer:** Permanence YES & Irreversibility confirmed after full Epistemic Window (Proceed to Step 5). Permanence NO (Stop: **Not dead**. Discuss goals of care). Irreversibility uncertain during window (Stop: **Not dead**. Continue observation/treatment).
      *   **Sign-off:** Performing Doctor (ST1+) & Senior Review (ST3+/Consultant). Document time of circulatory arrest, start/end of observation window. Time of death is the time at the END of the 5/4/3 minute observation period (Metaphysical Window). *Note: In planned DCD, permanence is predetermined by withdrawal decision; irreversibility is confirmed by observation.*

  5.  **DECLARATION OF DEATH** (Administrative Fact)
      *   **Action:** Senior Review Doctor declares death. Document exact time of death (per Step 4a or 4b). Complete death certificate or initial notification for coroner. Inform family sensitively, focusing on patient's death (bereavement support offered separately).
      *   **Sign-off:** Declaring Senior Doctor (ST3+ or Consultant).

  **ESCALATION POINTS (Value Judgements / Conflict)**
  *   **Step 2/3a:** Religious/cultural objection to NDD criteria. *Escalate IMMEDIATELY to on-call Consultant & Trust Ethics Lead. CDD pathway may be only option; requires careful planning & family agreement.*
  *   **Step 3/4b (DCD):** Dispute over timing of death declaration (e.g., family vs. retrieval team). *Escalate IMMEDIATELY to on-call Consultant, Trust Donation Lead & Ethics Lead. Adhere strictly to national DCD protocol & local policy; metaphysical window (end of observation) defines legal death.*
  *   **Step 3:** Dispute over diagnosis of Prolonged Disorder of Consciousness (PDOC) vs. death. *Escalate IMMEDIATELY to on-call Consultant, Neurology, & Ethics Lead. PDOC is NOT death. Procedure stops at Step 3 (Answer NO). Requires separate goals of care discussion.*
  *   **Any Step:** Coroner's case (unexpected, violent, unknown cause, in custody). *STOP procedure. Notify Coroner immediately. Do not proceed without Coroner's instruction.*

  **VULNERABILITIES & LIMITATIONS**
  1.  **Sedated Infants (<2 months):** High risk of false positives in NDD pathway. Apnoea test and reflex assessment extremely challenging. *Extreme caution: Prolonged observation, expert neuroconsultation (paediatric neurologist), near-complete exclusion of sedation/confounders mandatory. CDD pathway often more reliable but ethically complex.*
  2.  **Religious Objection to NDD:** Procedure cannot compel acceptance. Requires early escalation (see above). CDD pathway usually the alternative, but timing/process may conflict with beliefs (e.g., no observation window). Negotiation essential.
  3.  **Prolonged Disorders of Consciousness (PDOC):** This procedure **cannot** determine death in PDOC (e.g., VS/UWS). Capacity for integrated self-maintenance (brainstem function) persists. Stopping at Step 3 (NO) is unequivocal. Family distress requires compassionate communication and separate ethical/judicial processes if conflict over withdrawal.
  4.  **ECMO/Complex Support:** VA-ECMO obscures circulatory assessment. NDD pathway is primary. *For the ECMO case:* Prerequisites met? Known, sufficient, irreversible cause? Confirmed absent brainstem reflexes *despite* ECMO flow? If YES to all, proceed via NDD Steps 4a/5. Heart ejection on ECMO is irrelevant to NDD. Death declared on neurological criteria. *Metaphysical window = time of second confirmatory test.*
  5.  **DCD Donor (Maastricht III):** *Cause known/sufficient/irreversible?* (Withdrawal decision implies irreversibility/futility). *Capacity for integrated self-maintenance ceases:* Withdrawal → Circulatory arrest (Step 3b). *Permanence:* Agreed no restart. *Irreversibility:* Confirmed by ≥5 min observation (Epistemic Window). Death declared at end of 5 mins (Metaphysical Window). Family's wish for "moment heart stops" reflects bereavement, not legal/medical death determination. Procedure mandates observation window.
  6.  **What this Procedure Cannot Do:**
      *   Define personhood or consciousness.
      *   Resolve fundamental philosophical disagreements about death.
      *   Override valid advance directives or applicable law.
      *   Force treatment withdrawal or continuation against valid consent/legal rulings.
      *   Replace coronial or legal processes in disputed/complex cases.
      *   Define the exact "metaphysical moment" independently of the epistemic window in CDD.
      *   Eliminate all diagnostic uncertainty (especially in infants/complex physiology).

  **Application to Cases:**

  1.  **ECMO Patient (VA-ECMO, absent brainstem reflexes, heart ejecting):**
      *   Step 1: Apnoea test performed? (Likely YES if reflexes absent).
      *   Step 2: Cause known, sufficient, irreversible? (e.g., massive intracranial bleed?).
      *   Step 3: Capacity ceased? Test Brainstem (a): Absent reflexes confirmed? (YES → NDD Path).
      *   Step 4a: Prerequisites met? Second set of tests after ≥6/24h? Identical? (YES).
      *   Step 5: Death declared neurologically. Time = second test confirmation. *Heart ejection irrelevant on ECMO for NDD.* **SOLID.**

  2.  **DCD Donor (Cat III, Family vs. Team on timing):**
      *   Step 1/2: Implicit in withdrawal decision (futility/irreversibility agreed).
      *   Step 3b: Circulatory cessation confirmed (pulses, trace, asystole).
      *   Step 4b: Permanence? (YES, DNAR/DNACPR for arrest). Irreversibility? Requires ≥5 min observation (Epistemic Window). Confirmed throughout? (YES).
      *   Step 5: Death declared at **end of 5-minute observation**. *Family's request ("moment heart stops") is not the legal/medical determination point. Procedure mandates the 5-min window for irreversibility. Metaphysical window = end of observation. Team correct by procedure.* **SOLID (legally/medically), but bereavement needs sensitive handling.**

  3.  **Woman in Prolonged Disorder of Consciousness (Family insist dead):**
      *   Step 1: Unresponsive? (Likely YES). Apnoea? (NO - breathes spontaneously/ventilated).
      *   Step 2: Cause known? (e.g., anoxic injury). Sufficient? (Likely YES). Irreversible? (Likely YES prognosis, but *capacity for self-maintenance may persist*).
      *   **Step 3: Capacity ceased?** Test Brainstem (a): Are ANY brainstem reflexes present? (Spontaneous breathing? Pupillary/corneal reflex? Gag/cough?). **If ANY present → Answer = NO.** Test Circulation (b): Circulation intact? (YES). **Answer = NO.** **PROCEDURE STOPS. Patient is NOT DEAD.**
      *   *This answer is biologically and legally SOLID based on the preserved integrative function (brainstem/circulation).* The conflict concerns values (personhood, quality of life), not death determination. Requires immediate Consultant & Ethics escalation for goals of care discussion. Family anger stems from conflating severe disability/bad prognosis with death. Procedure provides clear medical boundary.

  **Final Note:** This procedure provides a medical-legal framework. Compassionate communication, respect for cultural/religious beliefs, and access to ethics support are crucial throughout. Regularly review and update based on case law, national guidance (e.g., AoMRC), and clinical experience. Distribute with mandatory training for all relevant clinicians.
