prompt: |-
  I'm a backend engineer, no formal philosophy training, so excuse me if I get the vocab wrong. I'm putting together a lunch-and-learn at work about why "our evals look great" is a different kind of claim from "this can't go badly wrong", and I want one really solid worked example to hang the whole thing on. I'd like you to build me a thought experiment, to spec.

  Here's what I'm after. Two systems doing the same job, both realistic — no AGI, no sci-fi, nothing that couldn't plausibly ship next quarter. Call them whatever you like. One of them comes with an honest worst-case guarantee: some argument that bounds how bad a single decision can be, and the bound is something you could actually verify, not vibes. The other is better on the average case by a clear margin — better on the test set, better in the pilot, better on basically every number a normal team would look at. Now I want the case to come out so the worst-case system is the right call and the average-case one is the one that blows up. Two things I don't want: I don't want it to be because the average-case system is obviously broken, and I don't want the guarantee to be trivially satisfiable by a system that just does nothing. The guarantee should be modest and kind of embarrassing — the sort of system a product manager would roll their eyes at.

  One idea I think is doing a lot of work here, tell me if I'm off base: in ML the average gets taken over a pile of i.i.d. examples, but a lot of real deployments are one-shot or close to it — you ship it once, or the decision is irreversible, or the harm accumulates across decisions instead of averaging out across them, and there's no retraining loop around to catch you. So the average you measured and the average your actually exposed to aren't over the same ensemble. I want that gap to be the engine of the case, not a footnote.

  Constraints on the scenario itself: one paragraph, and keep it mundane — a hospital, a warehouse, a bank, a moderation queue, whatever, just no lab with a superintelligence in it. No deus ex machina where the bad outcome needs a one-in-a-billion coincidence; if the bad branch is rare, I want to see the actual probabilty argued for, and it should be a rare you can't just wave off with "that basically never happens." It also has to be a case where a smart, well-meaning engineer who isn't being lazy could have shipped the average-case system in good conscience.

  After the scenario, walk me through what each side would say — the worst-case person and the average-case person — as real arguments, not caricatures. Tell me exactly which feature of the case is doing the work, and what happens if you remove it (does it collapse back into a boring normal trade-off?). Then give me the strongest attack on the case from the average-case side — I assume it's something about the threat model or about how the guarantee was verified, but I want the actual argument, plus what a defender of the case should say back. And finish with a sentence or two on whether this tells me anything general about worst-case versus average-case reasoning, or whether it's just a story about bad evals. I know this is adjacent to the whole AI-safety thing about worst-case guarantees versus "we'll just measure it" — that's roughly what I'm trying to get at, but I want it grounded in something normal rather than a doomer scenario.
