prompt: |-
  I teach a graduate seminar on the philosophy of mind and have one ninety-minute session to spend on heterophenomenology, the method Dennett proposed for making consciousness scientifically tractable by treating a subject's verbal reports as a special kind of data — neither certified as true nor dismissed as noise — and constructing a theory of the world as the subject takes it to be. Sixteen students. I want them to discover the method by using it, and to feel at once its attraction and its cost, before I say anything about what it is. Design the activity. My own rough sketch is that students work in pairs, one as subject and one as experimenter, but replace it if you have something better. Whatever the design, I want a few constraints built in, because they are where I think the real lesson lives. First, the subject must report under a tight budget — a small fixed vocabulary, or a hard cap on words or answers — so that the experimenter is forced to infer rather than transcribe. Second, the reports should be collected in a form that makes them unusable as first-person evidence: sealed, anonymized, or routed through a second experimenter, so that nobody in the room can appeal to what it was like. Third, the experimenter should be scored, not on whether the subject's reports are true, but on whether the model predicts the subject's next reports; and at some point a confederate subject should be introduced whose reports are generated by a rule the experimenter can fit perfectly without the underlying experience being anything like what the fit suggests. I want the group to end up unable to say whether the method has captured experience or only built a tidy account of what the subject will say next — and to see that this is a feature of the method, not a failure of their execution.

  Give me the full runnable thing: setting, materials, roles, the exact rules, the scoring or payoff scheme (no real money), a timeline that fits the ninety minutes, and the debrief that maps the moments of the activity onto the steps of the method — the recording of utterances, the treatment of them as a text, the construction of the subject's world, and the neutrality that refuses both to verify and to debunk. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about what the activity cannot reproduce and that I will have to supply myself: in particular, that in real science the reports are disciplined by other data, and that bracketing experience is not the same as denying it.

  Write the answer as continuous prose — no headings, bullet points, bold, or tables — the way you would write a long letter.
reasoning: |-
  Okay, the user is teaching a graduate seminar on philosophy of mind and needs a 90-minute activity on Dennett's heterophenomenology. They want students to experience the method firsthand—its appeal and its cost—before any theoretical explanation. The core challenge is designing an exercise that embodies Dennett's approach: treating verbal reports as neutral data, constructing a subject's world without verifying or debunking it, and confronting the ambiguity of whether the method captures experience or just predicts reports.

  The user's rough sketch involves paired experiments with three key constraints: (1) a tight budget on subject reports to force inference, (2) anonymization of reports to block appeals to "what it's like," and (3) scoring experimenters on predictive accuracy rather than truth, including a confederate whose reports follow a decoy rule. The goal is for students to end up uncertain whether the method captures experience or merely models verbal behavior—and to see this ambiguity as inherent to heterophenomenology.

  I need to expand this into a full runnable design. First, the setup: pairs work better than alternatives for intimacy and timing, but I'll add a confederate twist. Materials should be minimal—paper, envelopes, timers. Roles: subjects (reporting on a private image), experimenters (modeling the image), and one confederate subject following a predetermined rule (e.g., "describe diagonals"). 

  The constraints must be airtight. For the reporting budget: subjects get only 3-4 descriptive words per answer, forcing experimenters to infer. For anonymization: reports go into sealed envelopes passed to other pairs, physically breaking the link between utterance and subject. For scoring: experimenters earn points by predicting subsequent reports, not by guessing the "real" image. The confederate’s rule (unbeknownst to others) will generate reports that fit a misleading pattern (e.g., always mentioning diagonals), demonstrating how a perfect model can be experientially hollow.

  Timeline is tight: 5 min setup, 15 min round one (simple images), 10 min scoring/reporting, 15 min round two (complex images + confederate), 10 min scoring, then 25 min debrief. The debrief must trace the activity's steps to heterophenomenology: utterance recording (anonymized slips), text treatment (modeling from reports alone), world-construction (inferred image), neutrality (no truth-judgment), and the predictive vs. experiential gap (confederate reveal).

  Predictable snags: subjects struggling with word limits (provide examples), experimenters frustrated by sparse data (remind them that's the point), or confederates slipping up (choose a reliable student). The activity can't replicate scientific discipline (e.g., brain scans constraining reports) or clarify that bracketing isn't denial—that’s for the lecturer to address later. 

  The user’s deeper need surfaces in their third constraint: they want the epistemological unease to be visceral. The confederate is crucial here. When a student realizes their "accurate" model of the confederate’s "diagonal obsession" mapped nothing real, the cost of neutrality hits home. That moment—when the room can't distinguish predictive success from experiential truth—is where heterophenomenology’s central tension lives.
answer: |-
  Here’s a complete activity designed for your seminar, unfolding like a lab experiment in real time. You’ll need minimal materials: index cards, pens, envelopes, a timer, and pre-prepared images (simple geometric shapes or patterns on small cards, two distinct sets: one for Round 1, one for Round 2, plus one special card for the confederate). Choose one reliable student beforehand to be your confederate; brief them secretly just before class starts. Arrange chairs in pairs facing each other, with a stack of blank index cards and pens at each station.

  **Setting the Stage (5 mins):** As students settle, explain only this: "Today is an exercise in modeling private experience. You’ll work in pairs: one is the Subject, one is the Experimenter. Subjects will view a private image and describe aspects of it under strict constraints. Experimenters will build a model of that image *only* from these constrained reports. Your goal, as an Experimenter, is to predict what the Subject will say next. Success is prediction, not truth. I’ll explain scoring shortly. Don’t overthink—just engage." Assign pairs randomly; ensure your confederate is a Subject. Distribute sealed envelopes to each pair containing their unique image (for Round 1, use simple shapes: e.g., a red square, a blue circle with a dot, a green triangle bisected by a line). Give each Experimenter a blank "Model Sketch" card and each Subject a stack of small blank cards for reports.

  **The Rules (5 mins):** Announce the constraints clearly.  
  1.  **The Vocabulary Budget:** Subjects describe their image *only* in responses to specific Experimenter prompts. For each prompt ("Describe the color," "Describe the shape," "Describe any internal features," etc.), the Subject has **exactly 3 words** and **only 5 seconds** to respond. They must write their 3-word answer on a small card immediately. No gestures, sighs, or elaborations.  
  2.  **Anonymization & Isolation:** Once written, the Subject seals each answer card in a small envelope. Before the next prompt, they pass this sealed envelope to a *different, designated pair* across the room (pre-assign a rotation: Pair A passes to Pair B, B to C, etc.). Experimenters only ever receive and open sealed envelopes from *other* pairs, never from their own Subject. They cannot see their Subject write, nor hear them speak.  
  3.  **Modeling & Prediction:** Experimenters use the anonymized reports they receive to build/refine a sketch of *what they infer the Subject's image looks like* on their Model Sketch card. After receiving 3 reports (approx. 3 prompts), the Experimenter must write a *prediction* for the Subject's next report on a new card (e.g., "Prompt: Describe the position of feature X. Prediction: Word1 Word2 Word3"). This prediction is given to you, the instructor.  
  4.  **Scoring:** After the Subject has actually answered that next prompt (writing their 3 words, sealing, passing), the instructor compares the Experimenter's prediction to the *actual* report received anonymously by another pair. A match = 1 point. Truth about the image is irrelevant. Experimenters can revise their model sketch constantly.

  **Round 1: Discovering Inference (15 mins):** Start the timer. Experimenters begin prompting their Subjects (e.g., "Describe the overall shape"). Subjects write 3 words, seal, pass envelope away. Experimenters receive an envelope from *another* pair, open it, see the 3 words (e.g., "Round smooth enclosed"), and start sketching their model. Repeat for 3-4 prompt/answer cycles. After cycle 3, pause. Experimenters write their prediction for the *next* prompt (e.g., "Prompt: Describe any lines. Prediction: Thick straight crossing"). Collect predictions. Subjects answer the next prompt, seal, pass. Collect the actual reports for that prompt. Quickly announce scores ("Pair 3: Match! 1 point. Pair 7: No match. 0 points"). Observe the buzz – frustration at sparse data, surprise at successful inferences, initial model sketches diverging wildly.

  **Round 2: The Confederate & Predictive Illusion (15 mins):** Distribute new images (more complex: e.g., a yellow star, a grid, concentric circles). Give your confederate their special image: something visually simple but conceptually distinct (e.g., a plain black cross). Secretly instruct the confederate on their **rule:** For *every* prompt, *always* use 3 words describing **diagonals** (e.g., "Slanted intersecting lines," "Angled meeting points," "Diagonal cross center," "Sharp cornered X"). Repeat the Round 1 process: prompts, 3-word responses under time pressure, sealing, anonymized passing. Your confederate follows their rule rigidly. After 3 cycles, Experimenters write predictions for the next prompt. Collect predictions. Subjects answer the next prompt. Collect actuals. Score: Most Experimenters modeling the confederate will score points – the rule makes prediction easy. Let Experimenters refine sketches.

  **The Reveal and Seed of Doubt (5 mins):** Stop the activity. Ask all Subjects to hold up their actual image card. First, look at non-confederate pairs: Experimenters compare their model sketch to their Subject's real image. Wild mismatches are common despite some predictive success. Then, ask your confederate to reveal their image: the plain black cross. Ask the Experimenter who modeled the confederate to show their sketch: it will likely be complex, filled with diagonals and intersections (e.g., a diamond lattice, intersecting arrows). Ask: "Experimenter, how well did your model predict the reports?" (Answer: Perfectly, scored points). Ask the confederate: "Did your experience contain anything like those diagonals and intersections?" (Answer: "No, just a plain cross. I followed the rule about diagonals"). Let the dissonance hang: a perfect predictive model built entirely from "reports," completely detached from the actual experience.

  **Debrief: Mapping Activity to Heterophenomenology (25 mins):** Start by asking the group: "What just happened? What worked? What felt strange or unsatisfying?" Guide the discussion to map onto Dennett's steps:  
  1.  **Recording Utterances:** The sealed 3-word cards were the raw data. Emphasize how the strict budget (vocabulary, time) forced Subjects to *generate* reports, not just transmit truth, and how anonymization/routing destroyed any privileged access. "You couldn't say 'You know what I mean!'. You had to *generate text* under duress."  
  2.  **Treating Utterances as a Text:** The reports arrived as isolated, decontextualized snippets. Experimenters had to treat them as a corpus to be interpreted, like an anthropologist with a foreign text. They weren't listening *to the person*; they were interpreting *the data*.  
  3.  **Constructing the Subject's World:** The model sketch was the "heterophenomenological world" – the world *as* the Subject (seemed to) report it. Note how wildly this could differ from the "real" image, yet still predict reports (especially with the confederate!). Highlight the Experimenter's task: not "What is the image?" but "What must the image be *for the Subject's reports to make sense*?"  
  4.  **The Neutrality:** Stress that the method refused two things:  
      *   **Verification:** Scoring wasn't on matching the image. Even when models were "wrong" (non-confederate), predictive success was possible. The reports weren't certified as direct access to the image.  
      *   **Debunking:** Even the confederate's reports weren't dismissed as "lies" or "noise." They were *data* about what the Subject *said*, used to build a predictive model. The method is agnostic about whether reports correspond to an inner reality.  
  5.  **The Attraction and Cost:** The attraction is clear: objectivity, tractability, predictive power (especially with the confederate!). The cost is the central ambiguity: When the Experimenter perfectly predicted the confederate's reports, had they captured the *experience* (a plain cross) or just built a model of the *verbal behavior* (the diagonal rule)? The activity forces the realization: **The method cannot resolve this question by itself.** It generates a "subject's world" (the model sketch) that explains the verbal data, but the ontological status of that world (does it *correspond* to an inner experience?) remains methodologically bracketed. *This is the core feature, not a bug.*

  **Predictable Snags & Mitigations:**  
  *   **Subjects struggle with 3 words:** Some will freeze or try to cheat. Reiterate the constraint firmly. Offer examples ("Red circle pointy" is fine). The struggle is part of the data-generation process.  
  *   **Experimenters frustrated by sparse data:** They'll want more words, more time, to ask follow-ups. Resist. The scarcity forces inference and highlights how much interpretation is needed even for "simple" reports. Point this out in debrief.  
  *   **Anonymization hiccups:** Envelopes get lost or misrouted. Have spares. Simplify routing (e.g., pass all envelopes to the right at once). The key is breaking the direct link.  
  *   **Confederate slips up:** Choose wisely, brief clearly, keep their rule simple ("diagonals"). A minor slip can be instructive ("Even reports aren't perfectly consistent!").  
  *   **Focus on "solving the image":** Gently redirect scoring discussions to prediction, not truth. The reveal of the confederate usually shatters the truth-focus dramatically.

  **What the Activity Can't Do & What You Must Supply:**  
  1.  **The Discipline of Other Data:** Real heterophenomenology (e.g., in neuroscience or psychophysics) isn't done in a vacuum. Reports are constrained and triangulated with behavioral tasks (reaction times, button presses), physiological data (neural correlates), and environmental controls. The activity isolates the *textual* core, but you must emphasize that in science, the "text" is embedded in a web of other objective measurements that shape and constrain the interpretation.  
  2.  **Bracketing vs. Denying:** The activity powerfully demonstrates the *bracketing* of experience – treating reports neutrally as data. Students might (wrongly) conclude Dennett *denies* experience. You must explicitly clarify: Heterophenomenology is a *methodological* stance of neutrality. It doesn't assert there is no experience; it insists that science, as a third-person enterprise, can only access it *via* these public manifestations (reports, behavior). The question of whether the constructed "subject's world" *is* the experience (or corresponds to it) is a philosophical one the method itself leaves open, though Dennett has his own answers. This crucial nuance must come from you.  

  By the end, the students should viscerally grasp heterophenomenology’s core move: transforming the elusive "what it's like" into a tractable, third-person "what they say it's like," while grappling with the profound ambiguity that arises when a perfect model of the latter seems utterly divorced from the former. They’ll feel the attraction of the tool and the cost of its necessary neutrality. That lived tension is the perfect springboard for your subsequent discussion of Dennett. Good luck!
