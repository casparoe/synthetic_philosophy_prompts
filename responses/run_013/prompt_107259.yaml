prompt: |-
  I teach a single-session upper-level undergraduate metaphysics seminar on material objects, and I want a classroom activity that makes students feel the force of the special composition question: when, if ever, do some things together compose a further thing? The group is fourteen students, the session is eighty minutes, they will have done no advance reading, and I can rearrange the room and prepare cards or props beforehand. Please do not let the activity open by naming the question or the standard answers. Arrange the rules, roles, and stakes so that the students write and defend a criterion of composition themselves, get trapped by it, and only learn afterwards what the trap is called.

  Several ideas should do the work inside the game, and the students should run into them rather than be told them. First, the four stark positions and their costs: that any things whatsoever compose something; that nothing ever composes anything, so there are only the simples, if any; that composition occurs exactly when the things in question constitute a life; and the brutalist option, that composition sometimes occurs but as a further primitive fact with no informative criterion. Include, as the dead ends the students can discover for themselves, the two series-style answers that look promising and collapse: contact, which composes far too much and treats touching as though it were the right kind of relation, and fastening, which turns out to be circular because it presupposes the very wholes it was meant to explain. Second, the vagueness pressure: if composition is restricted at all, some collections compose and near-identical ones do not, yet such a difference cannot be a difference in composition, so either everything composes or nothing does. The activity should generate this pressure from a continuum of cases in which adjacent cases differ negligibly while the endpoints differ categorically, and in which the students are required to draw a line and defend where. Third, the problem of the many: at least one round should present a case that looks like a single object but turns out to be a great many almost-entirely-overlapping candidates, so that counting the objects present becomes impossible, and the pull of there being just one must be felt against the pull of there being too many to count.

  Please deliver: the setting and materials; the roles, rules, and a scoring scheme that keeps them invested without real money; an eighty-minute timeline; the structure of a debrief that maps particular moments of the activity onto the special composition question, the vagueness argument, and the life-based and brutalist answers, and that shows how the ordinary objects they began with get re-described under each position. Tell me what will predictably go wrong the first time I run it — the arguments that will collapse into it is just a matter of convention, the students who will refuse to play by the game's rules, the rounds that will run long — and how to handle each. Finally, be honest about one feature of the real debate that the activity cannot reproduce and that I will have to supply myself.
reasoning: |-
  We are going to design a classroom activity called "The Composition Game". The goal is to have students experience the puzzles of the special composition question without being introduced to the technical terms or standard positions until the debrief. We will have a series of rounds where students are presented with scenarios (using props or cards) and must decide whether a composite object exists in that scenario. They will have to write and defend a criterion for composition, and then see how it holds up in edge cases.

  **Materials and Setup:**
  - Rearrange the room so that there is a large central table and 14 chairs around it.
  - Prepare 14 index cards (or small whiteboards) and markers for each student to write their criteria and votes.
  - Prepare a set of scenario cards (about 10-15) that describe different arrangements of objects. These should include:
    - Clear cases of composition (e.g., a watch made of gears and springs, a living cat).
    - Clear cases of non-composition (e.g., a random pile of sand grains).
    - Borderline cases (e.g., a cloud, a pile of sand that is about to be made into a sandcastle, a human body without life).
    - Cases that form a continuum (e.g., a series of scenarios from a disassembled watch to an assembled watch, with intermediate steps of increasing connection).
    - A problem-of-the-many case (e.g., a cloud that is a bit fuzzy at the edges, so that there are many overlapping collections of water droplets that could equally be the cloud).
  - A scoring board (whiteboard or large paper) to keep track of team points.

  **Roles:**
  - The class will be divided into two teams of 7 students each (or as even as possible). Each team is a "Council of Metaphysicians".
  - Each team must come up with a criterion for composition that they will use to judge the scenarios. The criterion must be a condition that can be applied to any collection of objects to decide if they compose something.
  - One student from each team will be the "Defender" for a round (rotated each round) who must present the team's criterion and apply it to the scenario.
  - The instructor is the "Reality Master" (RM) who presents the scenarios and enforces the rules.

  **Rules:**
  1. **Criterion Development (10 minutes):** At the start, each team has 5 minutes to come up with an initial criterion for composition. They must write it down on a card and show it to the RM. The criterion must be general and not scenario-specific.
  2. **Rounds (about 8 rounds, 5 minutes per round):** 
     - The RM presents a scenario (by describing it and/or showing a prop or picture).
     - Each team has 1 minute to discuss whether, by their criterion, a composite object exists in the scenario. They must also note if their criterion leads to a clear answer or if it's vague.
     - The Defender from each team presents the team's verdict and a brief defense (1 minute per team).
     - After both defenses, the teams vote by secret ballot (using index cards) on whether they think a composite object exists in the scenario. They vote individually, but the team's majority vote will be compared to the other team's.
     - Scoring: 
       - If a team's majority vote matches the verdict they defended (i.e., they are consistent), they get 1 point.
       - If both teams have the same majority vote (both say "yes" or both say "no"), then they each get an additional 1 point for consensus.
       - If a team's criterion leads to a vague answer (as decided by the team during discussion) and they note it in their defense, they get 1 point regardless of the vote (to encourage recognizing vagueness). But they must then also vote and if they vote in the same way as the other team, they get the consensus point too.
     - The RM records the points.
  3. **Changing Criteria (allowed once):** After round 4, each team is allowed to change their criterion if they wish (they must announce it and write it down). They can do this only once during the game.

  **Scenario Design:**
  We need to include the following types:
  - **Round 1:** Clear composition (a functioning human-made object, e.g., a watch) and clear non-composition (a pile of watch parts in a box). This is to get them started.
  - **Round 2:** A continuum step 1: a few parts of the watch connected.
  - **Round 3:** Continuum step 2: more parts connected, but not all.
  - **Round 4:** Continuum step 3: almost all parts connected, but one missing.
  - **Round 5:** The fully assembled watch (again) but now they might question because of the continuum.
  - **Round 6:** A living thing (e.g., a cat) vs. a dead cat (same arrangement but no life).
  - **Round 7:** A cloud (problem of the many): describe a cloud as a collection of water droplets. Then note that if we take the collection that is the cloud, it is one object. But also, if we take a collection that is almost the same but missing one droplet, is that a cloud? And if we take one that has an extra? How many clouds are there?
  - **Round 8:** A pile of sand that is being shaped into a sandcastle (borderline).

  **Timeline (80 minutes):**
  - 0-5 min: Introduction and team formation. Explain the goal: to decide when a bunch of things make up one bigger thing. Explain the roles and rules. Do not mention the special composition question or any philosophical terms.
  - 5-15 min: Criterion development (10 minutes). Each team creates their initial criterion.
  - 15-60 min: Rounds 1 through 8 (8 rounds, 5 minutes each = 40 minutes). 
    - Each round: 
      - 1 min: RM presents scenario.
      - 1 min: Team discussion.
      - 2 min: Defenses (1 min per team).
      - 1 min: Voting and scoring.
  - 60-75 min: Debrief (15 minutes).
  - 75-80 min: Wrap-up.

  **Debrief Structure:**
  1. (5 min) Ask the students to reflect on the game: What was hard? Where did they feel their criterion was pulling them in two directions? What cases were most puzzling?
  2. (5 min) Introduce the special composition question: "When do some things compose a further thing?" and note that they have been wrestling with it. Name the four stark positions without details yet.
  3. (5 min) Map their experience to the positions:
     - **Universalism (any things compose):** Point out that in the continuum, if they ended up saying that even the first step (a few parts) composes something, they were close to this. Note the cost: there are objects everywhere (e.g., the watch and the floor together compose something).
     - **Nihilism (nothing composes):** If they felt that even the fully assembled watch didn't count because it's just parts arranged watch-wise, they were near this. The cost: there are no watches, cats, etc.
     - **Life-based (only when alive):** They might have used this in the cat vs. dead cat case. The cost: what about watches? And what exactly is life?
     - **Brutalism (no criterion, it just happens):** If they felt they had to just accept some cases and not others without a rule, they were near this. It's mysterious.
  4. (5 min) Highlight the two dead ends they might have encountered:
     - **Contact:** If they said parts must be touching. But then in the continuum, even a few touching parts would compose, and also two people shaking hands would compose a new object. Too much!
     - **Fastening:** If they said the parts must be fastened together. But what is fastening? It often implies the existence of a whole (e.g., a bolt fastens two parts only if the bolt is part of a system). Circular.
  5. (5 min) The vagueness pressure: In the continuum rounds, they were forced to draw a line. But why there? If adjacent cases are almost the same, how can one compose and the other not? This pushes to either universalism or nihilism.
  6. (5 min) The problem of the many: In the cloud case, if they said there is one cloud, then what about the many collections that are almost the same? Each one seems to satisfy the criterion (if they have one) just as well. So maybe there are many clouds? But that seems wrong. This shows that our ordinary concept of an object might not be precise.

  **Predictable Problems and Solutions:**
  1. **"It's just convention":** Some students might say that whether something composes an object is just a matter of what we decide. Solution: Push them to say what we are deciding. We are deciding whether to apply the concept, but the metaphysical question is whether there really is an object there. Also, in the game, they are forced to give a criterion that applies to reality, not just language.
  2. **Refusing to play by the rules:** A student might not want to vote or might say the whole game is meaningless. Solution: Encourage them to play along for the sake of the exercise. If they persist, ask them to take the role of a skeptic and challenge the teams' criteria.
  3. **Rounds running long:** Keep a timer and be strict. If a discussion runs over, cut it off and move to the next phase. The point is to experience the pressure, not solve it.
  4. **Arguments collapsing into vagueness:** If a team says "it's vague" too often, note that in the debrief as an important insight (and they get points for it) but then push: what does vagueness mean for the existence of objects? If it's vague whether an object exists, does that mean existence is vague? And is that acceptable?
  5. **Teams changing criteria too often:** They are only allowed one change. Enforce that.

  **One Feature the Activity Cannot Reproduce:**
  The activity cannot fully capture the **modal and temporal dimensions** of the problem. In the real debate, we care about when composition occurs across possible worlds and over time (e.g., when does an object come into existence or cease to exist?). The activity focuses on static scenarios. You will have to mention in the debrief that the special composition question also extends to these dimensions and that the same problems (like vagueness) arise there too.

  This activity should create an engaging and memorable experience that sets up the formal treatment of the special composition question. Good luck!
answer: |-
  ### **The Composition Conundrum: Classroom Activity**  
  **Goal:** Students experience the puzzles of the special composition question firsthand—without knowing the philosophical framework—by creating and defending their own criteria for when parts compose a whole, then confronting the consequences.

  ---

  ### **Setup & Materials**  
  - **Room Setup:**  
    - 14 chairs in a circle (no tables).  
    - A central "display area" for props (minimal/no tech).  
  - **Materials:**  
    - **Object Cards (15):** Each depicts an arrangement of "parts" (use simple drawings or printed images):  
      - Cards 1–5: **Continuum Series** (e.g., a watch being assembled):  
        - Card 1: Watch parts in a box (disassembled).  
        - Card 2: Parts loosely touching.  
        - Card 3: Parts interlocked but not fastened.  
        - Card 4: Parts screwed together but missing one piece.  
        - Card 5: Fully assembled watch.  
      - Cards 6–10: **Problem Cases:**  
        - Card 6: A living cat (labeled "organic, self-sustaining").  
        - Card 7: Identical but dead cat ("same arrangement, no life").  
        - Card 8: Cloud of water droplets ("fuzzy edges, no clear boundary").  
        - Card 9: Two people shaking hands ("contact only").  
        - Card 10: Pile of sand grains ("no organization").  
      - Cards 11–15: **Wildcards** (e.g., "a tree rooted in soil and air," "a bicycle chained to a fence").  
    - **Criterion Boards:** 14 small whiteboards or clipboards (one per student) for writing criteria.  
    - **Voting Tokens:** Green ("composes") and red ("no composition") tokens for each student.  
    - **Scoreboard:** Large poster with team names (e.g., "Team Atom" vs. "Team Whole").  

  ---

  ### **Roles, Rules & Scoring**  
  - **Roles:**  
    - **Students:** Split into two teams of 7. Each team is a "Metaphysics Tribunal."  
    - **Instructor:** "The Arbiter" (facilitates, reveals traps, and scores).  
  - **Rules:**  
    1. **Craft a Criterion (5 mins):** Each team privately agrees on a one-sentence criterion for when parts compose a whole (e.g., "when they’re glued together"). *No prior philosophy allowed.*  
    2. **Round Structure (6 rounds × 8 mins each):**  
       - **Reveal Card:** Arbiter shows an object card.  
       - **Team Huddle (2 mins):** Teams apply their criterion to the card. *They must answer:*  
         - Does a composite object exist? (Yes/No)  
         - Is this case "clear" or "puzzling"?  
       - **Defense (3 mins):** One defender per team states their verdict and justifies it using their criterion. *No new criteria mid-round.*  
       - **Cross-Examine (2 mins):** Opposing team asks one probing question (e.g., "What if we remove one droplet from the cloud?").  
       - **Vote (1 min):** All students vote individually with tokens (green/red) *based on their team’s criterion*.  
    3. **Scoring (per round):**  
       - **+1 point** per team if their vote is unanimous.  
       - **+2 points** per team if their criterion *correctly predicts* their vote (forces consistency).  
       - **−1 point** if a team admits a case is "puzzling" (encourages honesty about vagueness).  
       - **+3 points** for "trapping" the other team (if a question exposes a flaw in their criterion).  
  - **Stakes:**  
    - Winning team chooses a fun penalty for the losers (e.g., "teach the Arbiter to do a TikTok dance").  
    - Scores reset after the trap is revealed in the debrief (emphasizes learning over "winning").  

  ---

  ### **80-Minute Timeline**  
  1. **Intro (5 mins):**  
     - "Today, we’re detectives investigating when parts make a whole. No googling—use common sense!"  
     - Assign teams, distribute materials.  
  2. **Criterion Creation (5 mins):** Teams draft criteria (e.g., "when parts are attached" or "when they form a functional unit").  
  3. **Rounds (48 mins):**  
     - *Continuum Trap (Cards 1–5):* Forces a line-drawing problem.  
       - **Predictable Collapse:** Teams will struggle to justify why Card 4 (almost a watch) fails while Card 5 succeeds.  
     - *Life Trap (Cards 6–7):* Living vs. dead cat.  
       - **Predictable Collapse:** If teams use "function," challenge: "Is a dead cat a *different object* from a living one?"  
     - *Problem of the Many (Card 8):* Cloud with fuzzy edges.  
       - **Predictable Collapse:** "How many clouds are there if removing one droplet changes nothing?"  
     - *Contact/Fastening Trap (Card 9):* Handshake.  
       - **Predictable Collapse:** "Are two people *one object*? If not, is 'fastening' circular? What fastens the fastener?"  
     - *Wildcards (Cards 10–15):* Sand pile, bicycle chained to fence.  
  4. **Debrief (22 mins):**  
     - **Step 1: Elicit Frustrations (5 mins)**  
       - Ask: "Where did your criterion fail? Did any cases feel impossible to judge?"  
       - Highlight continuum (Cards 1–5): "Why was drawing a line arbitrary?" → **Vagueness pressure.**  
     - **Step 2: Reveal the Trap (5 mins)**  
       - Name the **Special Composition Question:** "When do things compose a whole?"  
       - Map their criteria to the four positions:  
         - "If you said *always*: **Universalism** (but then a cat + the moon composes something?)."  
         - "If you said *only for living things*: **Life-Based** (but is a watch not a real object?)."  
         - "If you said *never*: **Nihilism** (then there are no watches, cats, or clouds—just atoms!)."  
         - "If you gave up and said *it just depends*: **Brutalism** (no deeper reason—is that satisfying?)."  
     - **Step 3: Dead Ends (5 mins)**  
       - "Remember when you used *contact* (e.g., handshake)? That composes too much. *Fastening*? But fastening requires pre-existing wholes (like screws)—it’s circular!"  
       - "In the cloud case (**problem of the many**), if there’s one cloud, why are there trillions of droplet-collections equally eligible to *be* it?"  
     - **Step 4: Redescribe Reality (7 mins)**  
       - Show how ordinary objects "vanish" under each view:  
         - **Nihilism:** "The 'watch' is just simples arranged watch-wise."  
         - **Universalism:** "Your left shoe + the Eiffel Tower compose 'Shoeiffel'—a real object."  
         - **Life-Based:** "A corpse is not an object; only living things exist."  
         - **Brutalism:** "Composition happens, but we can’t say why—it’s a cosmic coincidence."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"It’s just convention!" (Most common collapse):**  
     - Students will say, "We decide what counts as a whole."  
     - **Fix:** Press them: "Does convention *create* objects? If we vote a random pile is a whole, does it exist?" Force them to see metaphysics isn’t linguistics.  
  2. **Refusal to Play (e.g., "This is stupid"):**  
     - **Fix:** Assign them as "Devil’s Advocates" to attack *both* teams. If resistant, use their skepticism in debrief: "Why did this feel pointless? Because reality might not care about our categories!"  
  3. **Rounds Running Long:**  
     - **Fix:** Use a timer. After 2 mins, say: "Defenders, you’re on—make a call even if unsure." Embrace the pressure.  
  4. **Over-Abstract Criteria:**  
     - **Fix:** Ban words like "coherent" or "unified." Demand concrete relations (e.g., "touching," "glued").  

  ---

  ### **What the Activity Can’t Capture**  
  **The Primitive Fact Problem:** Brutalism’s "composition just happens" is hard to *feel* as a live option—students will dismiss it as a cop-out. In the debrief, you must **emphasize the theoretical cost**:  
  - "Brutalism says composition has no explanation. But then, why trust *any* metaphysical fact? If composition is brute, what else is? Minds? Causes?"  

  ---

  ### **Why This Works**  
  - **Traps via Gameplay:** Students *create* flawed criteria (contact, fastening), *feel* vagueness in continuums, and *panic* during the cloud’s problem of the many—before learning these are named puzzles.  
  - **Investment:** Scoring pits teams against each other, but the debrief reframes "losses" as insights (e.g., "Your criterion failed? Welcome to 2,400 years of philosophy!").  
  - **No Reading Needed:** Cards and voting make abstract problems tactile.  

  Run this, and by the debrief, they’ll lean forward when you reveal "the special composition question"—because they’ve lived it.
