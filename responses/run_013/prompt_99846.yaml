  Okay, the user is a graduate student preparing for a seminar discussion on quantitative macrohistory, specifically comparing Turchin's secular-cycle theory with a classmate's coupled-oscillator alternative. I need to provide a structured comparison as requested, sticking closely to the specified headings and lengths. 

  The user's explicit request is analytical - they want to understand differences in units of analysis, causal commitments, predictive capacities, and how each framework handles specific scenarios. But reading between the lines, they're likely also seeking conceptual tools to defend their skepticism about the coupled-oscillator model being a mere extension of Turchin, while acknowledging its innovations. The seminar context suggests they need clear, debate-ready distinctions rather than open-ended musing.

  Starting with core contrasts: Turchin treats societies as closed systems with internal demographic clocks, while the coupled model makes inter-polity synchronization the primary phenomenon. This isn't just academic - it affects what counts as evidence. For instance, Turchin would see simultaneous breakdowns as coincidental outcomes of similar internal processes, whereas the coupled model would interpret this as evidence of phase-locking. 

  On test cases, the elite-killing shock is particularly telling. Turchin's model might paradoxically see it as integrative (resolving elite competition), while the coupled model could interpret it as a phase-reset event with ripple effects on neighbors. This highlights how deeply their causal logics diverge. 

  For predictive claims, I should emphasize that both require strong assumptions - Turchin about parameter stability across eras, the coupled model about measurable synchronization mechanisms. Neither fully escapes the historian's skepticism about social "laws," but the coupled model's added variables make quantification even harder despite its theoretical elegance. 

  The rivalry question is thorny. While the coupled model subsumes Turchin's cycles as a special case, its shift to relational dynamics changes the research agenda fundamentally - it's not just adding variables but rejecting methodological nationalism. This deserves emphasis in the "change of subject" section. 

  Throughout, I'll maintain a tone of scholarly neutrality while subtly validating the user's intuition that these aren't easily reconcilable frameworks. The bottom line should crystallize how their divergent units of analysis (society vs. system) create incompatible standards for what counts as explanation.
answer: |-
  ### The two frameworks in brief (~200 words)  
  Turchin's demographic-structural theory treats agrarian states as *closed systems* undergoing endogenous "secular cycles" (100-300 years). The fundamental unit is the *single polity*, and the "clock" is internal demographic pressure: population growth drives elite overproduction, fiscal collapse, and intra-elite conflict, culminating in a crisis (disintegrative phase) resolved by demographic contraction and institutional reset (integrative phase). Prediction focuses on *timing internal crises* based on quantifiable thresholds (e.g., wages, elite numbers).  

  The coupled-oscillator model shifts focus to *interacting polities*. Each polity has an *internal legitimacy-extraction cycle*, but the fundamental unit is the *regional system* of neighbors linked by trade, war, or migration. The "clock" is relational: *synchronization dynamics* between cycles. Prediction centers on whether cycles phase-lock (synchronous crises), drift, or anti-synchronize (one stable while another collapses), depending on coupling strength. Exogenous shocks (plague, climate) may reset phases system-wide.  

  ---

  ### Turchin's secular-cycle commitments (~250 words)  
  Turchin’s framework commits to four core causalities:  
  1. **Demographic drivers**: Population growth inevitably strains resources, depressing commoner welfare and state revenues.  
  2. **Elite dynamics**: Fixed elite positions create competitive overproduction, fragmenting governance and fueling instability.  
  3. **State breakdown**: Fiscal exhaustion and elite conflict *necessarily* trigger disintegrative phases ("revolutionary situations").  
  4. **Internal resolution**: Collapse is resolved endogenously via Malthusian corrections (famine, disease) and elite depletion.  

  It assumes polities are *modular*: cycles are self-contained and driven by universal structural pressures. Synchrony between neighbors is coincidental, not causal. The model demands quantifiable proxies for key variables (e.g., real wages for population pressure, noble titles for elite numbers) and relies on **ergodicity**—that historical societies share stable causal parameters. Prediction requires assuming that thresholds (e.g., elite numbers per capita) are consistent across time/space. Critically, it cannot explain *why* some societies avoid collapse despite similar internal pressures or why regions exhibit waves of crisis without invoking external factors as afterthoughts.  

  ---

  ### The coupled-oscillator commitments (~250 words)  
  This model makes distinct commitments:  
  1. **Relational causality**: Polity cycles are *inherently interdependent*; coupling (trade, conflict) can override internal dynamics.  
  2. **Phase primacy**: Synchronization, not internal thresholds, explains regional patterns. Weak coupling allows drift; strong coupling forces phase-locking.  
  3. **Shocks as resets**: Pandemics or invasions may forcibly synchronize cycles, not merely accelerate endogenous processes.  
  4. **Anti-phase stability**: Neighbors can stabilize via asynchronous cycles (e.g., one absorbs the other’s elites during crisis).  

  It avoids Turchin’s assumption of *necessary* internal collapse: a polity may avoid crisis if coupled to stable neighbors. However, it must accept that internal cycles exist *and* are measurable as phase variables (e.g., "legitimacy" quantified via rebellions or tax compliance). Crucially, it requires quantifying **coupling strength** (e.g., trade volume, war frequency) and assumes synchronization mechanisms (e.g., refugee flows transmitting instability) are universal. Prediction depends on **measuring phase relationships** and assumes coupling parameters are stable. Unlike Turchin, it cannot predict *when* a single polity will collapse without data on neighbors.  

  ---

  ### Rivalry, refinement, or change of subject? (~250 words)  
  The coupled-oscillator model is a **change of subject** masquerading as a generalization. It shifts the explanatory target from *why/when a polity collapses* to *why regional crises cluster*. Turchin explains *internal* breakdowns; the oscillator model explains *systemic synchrony*.  

  While it subsumes Turchin’s theory (a single polity is "one oscillator with zero coupling"), this framing fundamentally redirects inquiry:  
  - **Refinement?** Only superficially. Adding "coupling" to Turchin’s model would refine it, but the oscillator model recenters analysis on *emergent synchrony*, making internal dynamics secondary.  
  - **Rivalry?** Yes, in cases where synchrony contradicts internal pressures. If two polities collapse simultaneously despite different demographic stages, Turchin would call this coincidence; the oscillator model claims coupling overrode internal clocks.  
  - **Change of subject?** Decisively. Turchin seeks laws of *intra*-societal evolution; the oscillator model studies *inter*-societal resonance. The latter is agnostic about Turchin’s mechanisms—elite overproduction could be replaced by religious schisms as the internal oscillator, as long as phases interact. It changes prediction from forecasting *a society’s crisis* to forecasting *regional wave patterns*.  

  ---

  ### Three test cases (~350 words)  
  **Case 1: Two neighboring empires with elite overproduction/fiscal strain**  
  - *Turchin*: Expects asynchronous breakdowns. Each polity’s crisis timing depends on internal thresholds (e.g., elite numbers vs. state capacity). Simultaneity would be accidental.  
  - *Coupled model*: Predicts breakdown synchronicity only under **strong coupling** (e.g., high war/migration). **Weak coupling** permits independent cycles—one may collapse while the other stabilizes by absorbing its elites/resources.  

  **Case 2: Shock killing elites but sparing productive base**  
  - *Turchin*: Sees this as an *integrative reset*. Elite depletion reduces competition, while intact peasants allow rapid recovery. Crisis is shortened or avoided.  
  - *Coupled model*: Treats this as a **phase-resetting shock**. If neighbors are coupled, the killed elites’ roles may be filled by immigrant elites, transmitting instability. A standalone polity might stabilize, but in a coupled system, the shock could synchronize cycles regionally.  

  **Case 3: Quantitative prediction ambitions**  
  - *Turchin*: Predicts crisis timing if proxies (wages, elite counts) cross thresholds. Requires **ergodicity** (past parameter stability) and **measurable thresholds** (e.g., "overproduction" defined as elite numbers > X% of population). Vulnerable if parameters shift (e.g., trade buffers Malthusian pressure).  
  - *Coupled model*: Predicts synchrony patterns if coupling/phase data exists. Requires **quantifying coupling** (e.g., trade flows) and **phase variables** (e.g., "legitimacy" as tax compliance rates). More vulnerable: synchronization assumes stable coupling mechanisms, but war/trade rules change historically. Both frameworks struggle with **non-stationarity** (unique events altering causal rules).  

  ---

  ### Bottom line (~150 words)  
  Turchin’s framework offers a clearer path to *conditional prediction* for single-society collapse by quantifying internal pressures, but assumes untenable modularity and ergodicity. The coupled-oscillator model better explains *regional patterns* of crisis but sacrifices predictive specificity for single polities and requires elusive data on inter-polity dynamics. Neither conclusively proves macrohistory can be predictive: Turchin relies on stable parameters across eras; the oscillator model needs measurable phase/coupling variables. Both frameworks quantify history by reducing complexity to cyclic dynamics—Turchin to demographic-structural feedback, the oscillator to synchronization math. However, the oscillator model’s shift to relational analysis changes the *kind* of prediction attempted: not "when will Society X fall?" but "when will *this region* destabilize?" This reframing is defensible for transnational history but abandons Turchin’s core ambition of explaining societies in isolation.
