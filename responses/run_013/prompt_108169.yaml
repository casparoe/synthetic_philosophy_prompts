answer: |-
  ### The List: Desiderata for a Theory of Pain's Badness

  1.  **Necessity of Aversion:** The theory must explain why the *aversive* aspect is essential for pain to be intrinsically bad *for the subject*. Asymbolia generates this: patients have the sensory experience but lack aversion and deny the experience is bad. Without aversion, the sensory event isn't bad *for them*. **Genuine Requirement. Non-Negotiable.** *Cost of Denial:* Denying this requires asserting that asymbolic patients are *not* actually in pain (despite their reports and sensory-discriminative capacities), or that the pain *is* bad for them (contra their explicit reports and behavior).

  2.  **Badness Without Attitudes:** The theory must account for the badness of pain in creatures incapable of complex attitudes (fish, newborns, advanced dementia patients). Their distress behaviors and physiological harm strongly suggest they are badly off by pain. **Genuine Requirement. Non-Negotiable.** *Cost of Denial:* Denying this requires asserting that such creatures cannot be harmed by pain (or perhaps lack phenomenal consciousness altogether), conflicting with ethology, veterinary science, and pediatric/geriatric care.

  3.  **Harm of Pain Absence:** The theory must explain why the *absence* of pain (specifically, the sensory-discriminative capacity) is harmful, as seen in Congenital Insensitivity to Pain (CIP). The harm comes from undetected injury, not the presence of aversion. **Genuine Requirement. Non-Negotiable.** *Cost of Denial:* Denying this requires asserting that the suffering from injuries in CIP isn't a result of the missing pain capacity, or that such lives aren't harmed by the absence, contradicting the lived experience and physical damage.

  4.  **Dissociation in Asymbolia:** The theory must accommodate the dissociation between sensory-discriminative and affective-motivational components reported in asymbolia (and morphine cases). The sensory core remains while aversion vanishes. **Genuine Requirement. Non-Negotiable.** *Cost of Denial:* Denying dissociation requires ignoring the clinical phenomenology or misinterpreting patient reports.

  5.  **Non-Aversive Pain Possible:** The theory must accommodate cases where pain is not aversive and may even be sought or welcomed (masochist, athlete, ascetic) without denying the subject is genuinely in pain. **Genuine Requirement. Negotiable (scope).** *Cost of Denial:* Requires asserting such individuals are either not in pain or are somehow mistaken/conflicted about their aversion, ignoring their first-person perspective and contextual framing.

  6.  **Distinction from Suffering:** The theory must distinguish the badness of pain from the broader concept of suffering. Pain can contribute to suffering, but suffering can exist without physical pain (e.g., grief), and pain (especially transient or wanted) need not constitute suffering. **Genuine Requirement. Non-Negotiable.**

  7.  **Sensory vs. Affective Distinction:** The theory must respect the conceptual and (often) phenomenological distinction between the sensory-discriminative aspect (location, intensity, quality) and the affective-motivational aspect (unpleasantness, aversion, motivational force) of a pain experience. **Genuine Requirement. Non-Negotiable.**

  8.  **Intrinsic Quality vs. Attitude:** The theory must take a stance on whether "unpleasantness" is an intrinsic, felt quality of the sensation itself or constituted by an attitude (dislike, aversion) directed towards a sensation that is intrinsically neutral. Asymbolia and non-verbal creatures put pressure here. **Genuine Requirement. Negotiable (resolution).**

  9.  **Not Trivializing Badness:** The theory must not trivialize the badness of paradigmatic pain by making it contingent on easily overridden factors unrelated to the core experience (e.g., a fleeting thought). Pain's badness has a certain robustness and primacy. **Genuine Requirement. Non-Negotiable.**

  10. **Explanatory Scope:** The theory must offer a coherent explanation for *why* the phenomenon (pain + aversion) is bad, not merely stipulate it. It owes an account of the link between the phenomenology/neurobiology and disvalue. **Genuine Requirement. Non-Negotiable.**

  ---

  ### Load-Bearing Requirements

  The single requirement doing the most excluding work is **#1 (Necessity of Aversion)**. It directly and forcefully excludes any theory that locates the intrinsic badness of pain *solely* or *primarily* in its sensory-discriminative properties. Theories that define pain purely by nociception or sensory qualities (e.g., certain strong sensory theories) are ruled out because asymbolia shows these can exist without the badness. It also challenges theories that make the badness contingent on complex cognitive judgments or extrinsic desires that asymbolic patients might retain but which fail to generate aversion. Requirement #1 forces the badness into a tight relationship with the affective-motivational component.

  ---

  ### Collisions

  1.  **#1 (Necessity of Aversion) vs. #2 (Badness Without Attitudes):** This is the central collision. #1 demands aversion is essential for pain's badness. #2 demands that pain can be bad for creatures lacking the capacity for the attitudes plausibly constituting aversion (e.g., dislike, motivational commands). Theories satisfying #1 by defining badness *as* aversion (or requiring it) struggle with #2: how can a fish have aversion? Theories satisfying #2 by locating badness in intrinsic sensory qualities struggle with #1: why isn't the sensory quality bad for the asymbolic patient? **Resolution Requires:** Either (a) defining aversion very broadly (e.g., as a primitive motivational state present in fish, newborns), risking anthropomorphism and potentially weakening the concept needed for #1 (can a fish "dislike"?), or (b) positing a *different* kind of bad-making feature (e.g., intrinsic unpleasantness) for non-attitudinal creatures, creating a disunified account. **#1 must give ground on the *nature* of aversion required, or #2 must be reinterpreted (risking denial of badness).**

  2.  **#1 (Necessity of Aversion) vs. #5 (Non-Aversive Pain Possible):** #1 says aversion is necessary for pain's badness. #5 says pain can occur without being aversive (and even be wanted). If the masochist's pain isn't aversive *to them*, #1 implies it isn't bad *for them* at that moment. But this seems counterintuitive; the sensation is still painful and potentially harmful. **Resolution Requires:** Distinguishing between aversion as an occurrent state and aversion as a disposition, or separating the *capacity* for aversion from its current instantiation. A theory might argue that even welcomed pain retains a latent aversive quality that *would* manifest under different conditions, or that the badness is overridden but not absent. **#5 forces a more nuanced understanding of aversion for #1.**

  3.  **#3 (Harm of Pain Absence) vs. Sensory-Focused Theories:** Requirement #3 highlights that the *absence* of the sensory-discriminative component (CIP) is harmful. This directly challenges theories that locate the *only* badness of pain in the unpleasant affect. If the affect is the sole bad-maker, why is lacking the sensory capacity harmful? **Resolution Requires:** A theory must either (a) incorporate the *instrumental value* of the sensory component (its role in preventing harm) as part of the explanation for why pain *systems* are good, even if the badness of pain *itself* is located in the affect, or (b) argue that the harm in CIP stems *only* from the subsequent tissue damage/general suffering, not directly from the missing sensation (a weak response). **#3 forces acknowledgment of the functional value of the sensory component, even if not the locus of badness.**

  ---

  ### The Contenders Against the List

  1.  **Sensory-Hedonic:** Claims pain's badness is an intrinsic, unpleasant sensory quality. **Killed Outright:** Fails #1 (asymbolia has the sensory quality without badness/aversion) and #4 (cannot explain dissociation). Struggles with #5 (how is welcomed pain unpleasant?).

  2.  **Desire-Based (e.g., Frustration):** Claims pain is bad because it frustrates a desire not to have it (or satisfies a desire to avoid it). **Killed Outright:** Fails #2 (non-verbal creatures may lack such desires). Fails #1 (asymbolic patients may *have* the desire not to be injured but lack aversion to the pain sensation itself). Struggles with #5 (masochist desires the pain).

  3.  **Imperative / Motivational:** Claims pain's badness lies in its issuing a (phenomenologically salient) command "Stop this!" or possessing intrinsic motivational force to terminate. **Status:** Survives initial cull. Meets #1 (aversion as command/force), #4 (dissociation = loss of command), #7, and arguably #9. **Critical Challenge:** #2 – Can a fish's state genuinely possess an imperative content? #5 – How is the welcomed pain still an imperative? #8 – Is the command intrinsic or an attitude?

  4.  **Evaluative / Perceptual-Representational:** Claims pain's badness lies in its (non-conceptual) representation of bodily damage *as bad* or *to-be-avoided*. **Status:** Survives initial cull. Meets #1 (aversion tied to badness representation), #4 (dissociation = loss of evaluative component), #7. **Critical Challenge:** #2 – Does a fish's state *represent* badness? #3 – Why is lacking the *representation* harmful? (Must appeal to instrumental function). #8 – Is the badness represented or intrinsic?

  5.  **Hybrid (Sensory + Imperative/Evaluative):** Claims pain is a complex state with distinct sensory and imperative/evaluative components, locating badness primarily in the latter. **Status:** Forced by the list, particularly #4 and #7. Best positioned to meet most requirements (#1, #3 - instrumentally, #4, #5 - nuanced, #6, #7, #9). **Critical Challenge:** Integration (#8) – How do components relate? Is unpleasantness in the sensory, the imperative, or emergent? Still faces #2 – nature of imperative/evaluation in non-verbal beings. Must carefully navigate the #1/#2 collision.
