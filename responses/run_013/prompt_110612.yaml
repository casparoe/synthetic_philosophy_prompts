  But the disanalogies are glaring. Defining "small perturbations" in history is messy - is Napoleon's cold really "small" when it affects a decision-maker? Historical state space isn't measurable like phase space; we can't quantify "divergence rates" without Lyapunov exponents. Crucially, chaos theory doesn't deny statistical predictability - weather is chaotic but climate isn't. 

