prompt: |-
  Hey — backend engineer here, no philosophy training at all, so apoligies if this turns out to be a thing with an obvious name that I just never ran into.

  I keep noticing a pattern and I can't find a word for it. The shape of it: two parties that can't communicate and can't affect each other in any way — no channel between them, nothing either one does changes what the other does — still both do their half of a deal that only pays off if the other half gets done. Not because they agreed, not because anyone signalled. Because each one worked out what the other would do by assuming the other is the same kind of reasoner as itself, and then did its side. The two choices are good together, each is only good because of the other, but neither choice actually caused the other.

  Two cases I've run into that made me notice it:

  - Two engineering teams, totally seperate, no shared meetings, both shipped the same breaking change to a shared interface in the same week. Each one told me they did it because "the other team obviously would." I figured at the time it was just both of them having read the same design doc months earlier — i.e. a boring shared cause. But the reason they gave me wasn't the doc, it was the prediction.

  - Two copies of the same model, started with no shared state and no way to message each other, both asked the same question, both give the answer that only works if the other copy also gives it. Each one is predicting the other by simulating itself.

  Here's the part I can't name. In the first case I can point at a shared cause, in the second I really can't — the only thing linking the two parties is that they're alike. So: (a) is there an established name for this, and which one, because I suspect I'm about to mash two or three different things into a single word; (b) if it does have a name, where are the edges — does the pattern survive if the two parties share a source (same doc, same training run, same author), or is that a genuinely different and more boring phenomenon that I've heard called a focal point, or something like a correlated equilibrium, I honestly can't keep those two straight; and (c) if the version where the parties are linked only by being similar doesn't have a name, coin one and tell me what it rules out.

  And please don't just hand me the label, that isn't what I'm after. I want to know what the link between the two parties has to be — is it enough that each can deduce the other's move, or does something have to actually make them both move — and which of those people mean when they use the term. Also: does the whole thing fall apart if one party is much smarter than the other, or if they aren't alike at all? Thanks.
reasoning: |-
  Okay, the user is a backend engineer who's noticed a recurring pattern but can't find a term for it. They describe two disconnected parties independently performing complementary actions because each assumes the other will do the same. The examples are engineering teams making the same breaking change and two identical models giving interdependent answers. 

  The user wants to know if there's an established name for this phenomenon, where the boundaries lie (especially regarding shared origins vs pure similarity), and how factors like asymmetry affect it. They're clearly analytical—probing the conceptual edges rather than just wanting a label. 

  Hmm... this feels adjacent to several concepts but not perfectly aligned. Focal points require common knowledge of salience, which isn't present here. Correlated equilibrium involves signals. Schelling points are close but typically involve coordination with communication potential. 

  What's distinct here is the unilateral deduction: Party A acts because it models Party B as identical and rational. The purest case is like two copies of the same AI—no shared history, just structural symmetry. That's fascinatingly different from typical game theory where players have distinct identities. 

  The key seems to be the symmetry assumption enabling reliable mutual prediction. If one party were dumber, the deduction breaks. Also, if they weren't identical, they couldn't confidently simulate each other. So the core is symmetry-as-coordination-mechanism. 

  "Mutual predictability via symmetry" covers it, but that's clunky. "Symmetric Deduction Equilibrium"? "Recursive Rationality"? Need to balance accuracy and usability... 

  For the user, emphasizing the symmetry requirement feels crucial. They'll care about whether shared training data invalidates the phenomenon (it doesn't—it enables the symmetry) versus cases where similarity is coincidental (which breaks the deduction). Also flagging that intelligence asymmetry disrupts it explains why this isn't universal. 

  Their engineering context suggests they'll value clear decision boundaries: "If X, then term applies; if Y, it doesn't." Should explicitly map the AI example as the paradigmatic case and the teams as derivative (due to shared docs enabling assumed symmetry). 

  ...And they'd probably roll their eyes at philosophical jargon, so keeping explanations grounded in their examples is key.
answer: |-
  Your pattern is fascinating and deeply insightful—it's **not** just focal points or correlated equilibrium. What you're describing is a specific flavor of **coordination without communication**, powered by **symmetry recognition and recursive reasoning**. Here's the breakdown:

  ### (a) The Established Name & Its Core Mechanism
  The closest formal concept is **Schelling Points** (from Thomas Schelling's *The Strategy of Conflict*), but **only in a narrow, idealized form** that matches your cases. However, Schelling Points usually rely on **shared culture/salience** (e.g., "meet at noon at Grand Central"). Your cases are different: they rely on **mutual modeling via symmetry**.

  The mechanism you've identified is called **recursive rationality** or **symmetry reasoning**:
  - Each agent deduces the other's action by assuming:  
    *"If I were them (and they are identical to me), what would I do?"*  
    → This creates a self-fulfilling loop of mutual prediction.

  ### (b) Where the Edges Are
  | **Scenario**                  | **Does the Pattern Hold?** | **Why?**                                                                 |
  |-------------------------------|----------------------------|--------------------------------------------------------------------------|
  | **Shared source** (same doc, training run) | ✅ **Yes**                  | Shared source creates symmetry. Each agent *leverages* the common origin to model the other as identical. |
  | **Pure similarity** (no shared cause, but identical reasoning) | ✅ **Yes**                  | The symmetry alone enables mutual prediction. No shared history needed if agents recognize their equivalence. |
  | **Focal Points** (Schelling)  | ⚠️ **Partial Overlap**     | Focal points require *salient* cues (e.g., cultural norms). Your cases use *deductive* symmetry, not salience. |
  | **Correlated Equilibrium**    | ❌ **No**                   | Requires external signals (e.g., traffic lights). No signaling exists here. |

  #### Critical Boundary Condition:  
  The link between parties is **not causation or communication**, but **deductive predictability via symmetry**. If each agent can prove:  
  *"Because we are identical rational agents, we must both choose X"*,  
  the pattern holds—even with no shared past. If symmetry breaks, the deduction fails.

  ### (c) The Gap in Terminology & A Proposed Name
  No existing term cleanly captures **deductive coordination via symmetry alone**. "Schelling Point" is often misapplied here, but it implies *salience*, not deduction. "Recursive Equilibrium" is too vague.  

  **Proposed name: **  
  **Symmetrical Deduction Equilibrium (SDE)**  

  #### What SDE Rules Out:
  1. **Asymmetry in capability**: If one agent is smarter, it can't assume the other will deduce identically → pattern breaks.  
  2. **Dependence on shared context**: If coordination relies on cultural cues (e.g., "default to noon") instead of pure reasoning → it's a Schelling Point, not SDE.  
  3. **Actual interdependence**: If Agent A's action *causes* Agent B's action (e.g., via market pressure) → it's game theory, not SDE.  

  ### Why Your Examples Fit SDE
  - **Engineering Teams**:  
    Shared design doc created *symmetry* (both knew the plan). Each deduced: *"They're rational engineers like me → they'll ship the change now."* No signaling occurred.  
  - **AI Models**:  
    Identical architecture/weights = perfect symmetry. Each computes: *"My clone will output Y because I would → so I must output X to complement Y."*  

  ### When the Pattern Fails
  - **If parties aren't identical**: A smarter agent might outthink the other, breaking mutual predictability.  
  - **If deduction is impossible**: Without symmetry, agents can't simulate each other's reasoning.  
  - **If the "deal" isn't optimal**: SDE requires that X+X is the *only* rational choice for identical agents. If Y+Y also works, coordination fails.  

  ### Key Insight
  SDE exploits **logical necessity under symmetry**:  
  > *"I must do X because you will do X, and you will do X because I will do X."*  

  It's a loop anchored in mutual recognition of equivalence—not communication, not causation, not culture. This is why it feels distinct: it's coordination emerging purely from **mirrored rationality**.

  If you coin **SDE**, emphasize: symmetry enables deduction, deduction enables coordination. No wires needed.
