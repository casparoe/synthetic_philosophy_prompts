  Okay, the user is describing a specific decision theory scenario they've encountered in blogs. Let me unpack their query. They mention a one-shot interaction between two parties who can't reward or punish each other later. Both would defect if the other defects, but cooperation happens because each can see the other's decision rule. The key is that each rule says: cooperate only if the other will cooperate. So they both cooperate, and at the moment of acting, they're not weighing payoffs because their actions are predetermined by the rules.

  The user is confused about naming this setup. They mention familiar cases like mutual transparency but point out a variant where visibility is one-way: A sees B's rule, but B doesn't see A's. Here, A cooperates iff B does, but B cooperates without seeing A's rule, knowing that A will mirror B's action. So B's cooperation is what drives the outcome. The user also hints at a probabilistic version where visibility isn't certain but likely enough to incentivize cooperation.

  The main questions are: Is there a name for this? How do the three variants (symmetric, one-way, probabilistic) relate? Specifically, is one-way visibility a distinct structure from symmetric, and is the probabilistic case the same or a cousin?

  First, I need to recall decision theory concepts. Mutual knowledge of strategies sounds like correlated equilibrium or maybe superrationality. But the user says those don't fit. What about Newcomb's problem? That involves predictability, but it's one agent vs. Omega. Here, it's two agents with interdependent rules.

  The symmetric case resembles Hofstadter's superrationality, where both parties reason that they're identical and thus cooperate without defecting. But in the one-way case, B can't see A's rule, so it's different. B's reasoning is that A will copy whatever B does, so defecting leads to mutual defection. Thus, B chooses cooperation to get mutual cooperation. That's similar to the "Twin Prisoner's Dilemma" where identical reasoning leads to cooperation, but here the visibility is asymmetric.

  The probabilistic version might be about expected utility. If each thinks the other is likely to use the matching rule, they cooperate to avoid the risk of mutual defection. This feels like an evolutionary or learning strategy, perhaps in repeated games, but the user specifies one-shot.

  For names, "Coordination via Mutual Predictability" comes to mind. Or "Strategy Transparency Equilibrium." But I need to check if there's an established term. Reflective decision making? That's more about internal consistency. Perhaps "acausal cooperation" since the decision depends on predicting the other's response without direct causation.

  The user might be hinting at underlying themes like the role of transparency in enabling cooperation without enforcement. Their deeper interest could be understanding how cooperation emerges in one-shot scenarios, relevant to AI alignment or social dilemmas. They might want to apply this to scenarios where verification isn't perfect, hence the probabilistic case.

  To answer: symmetric and one-way cases are distinct because in symmetric, both know the rules, leading to mutual cooperation through mutual prediction. In one-way, B cooperates based on knowing A is reactive, not because B sees A's rule. So the mechanism differs: symmetric uses mutual predictability, one-way relies on the reactive party's reasoning about being mirrored.

  Probabilistic is a cousin. It's not about verified rules but expected behavior, making it a risk-based strategy rather than certainty-based. It's similar in outcome but different in mechanism, leaning towards evolutionary game theory.

  So, no single established name, but terms like "strategy-proof equilibrium" or "superrationality" are close. Emphasize the differences: symmetric and one-way are structurally distinct due to information asymmetry, while probabilistic is a broader application of the idea under uncertainty.
answer: |-
  This is a fascinating pattern that sits at the intersection of decision theory, game theory, and philosophy, particularly concerning **acausal decision-making, predictability, and the role of transparency in one-shot games.** While no single, universally agreed-upon name captures all your variants perfectly, the core idea is most closely associated with **Reflective Decision Making** or **Superrationality** (popularized by Douglas Hofstadter). However, your variants highlight important nuances.

  Here's the breakdown:

  1.  **The Symmetric Case (Both Rules Visible):**
      *   **Mechanism:** Each party sees the other's rule (`A: Cooperate iff B cooperates`, `B: Cooperate iff A cooperates`). Each reasons: "If I cooperate, they cooperate. If I defect, they defect. Therefore, cooperating leads to mutual cooperation (CC), while defecting leads to mutual defection (DD). CC > DD, so I cooperate." Crucially, the decision is "pre-committed" by the rule once the other rule is known; no payoff weighing happens at the moment of action.
      *   **Established Names:**
          *   **Superrationality (Hofstadter):** This is the *closest* fit. It emphasizes agents reasoning that they are identical/symmetrical and will therefore make the same decision. Cooperating becomes the only rational choice *because* the other is reasoning identically and predictably. The visibility of rules enables this symmetry recognition.
          *   **Reflective Equilibrium (in Decision Theory context):** Less common, but captures the idea of agents reasoning about each other's reasoning until they reach a stable point (cooperation).
          *   **Coordination via Mutual Predictability:** A descriptive phrase.
      *   **Key Feature:** Mutual transparency enables mutual prediction and locks in cooperation.

  2.  **The One-Way Visibility Case (A sees B's rule, B cannot see A's rule):**
      *   **Mechanism:**
          *   `A`'s rule is `Cooperate iff B cooperates`. `A` sees `B`'s rule and acts accordingly.
          *   `B`'s rule is unknown to `A`, but `B` *cannot* see `A`'s rule. `B` reasons: "`A`'s action is determined *only* by my action because their rule references my output. If I cooperate, `A` cooperates (CC). If I defect, `A` defects (DD). Since CC > DD, I should cooperate." `B` acts *without* knowing `A`'s actual rule, based solely on the knowledge that `A`'s action is a *function* of `B`'s action.
      *   **Relationship to Symmetric Case:**
          *   This is **structurally distinct**. It's *not* just symmetric visibility applied unevenly.
          *   **Why distinct?** In the symmetric case, *both* agents rely on *seeing* the other's rule to know the other will match them. In the one-way case:
              *   `A` relies on *seeing* `B`'s rule (and knowing `B` will act based on `B`'s own reasoning).
              *   `B` relies *not* on seeing `A`'s rule, but on **knowing the *type* of rule `A` has** – specifically, that `A`'s action is *causally dependent* on `B`'s action ("`A` will do whatever I do"). `B` reasons about `A`'s *behavioral dependency*, not `A`'s specific internal state/rule text. `B` is essentially treating `A` as a black box with a known input-output relationship based on `B`'s own action.
          *   **The "Work":** You're correct. The party *being read* (`B`) is the one whose reasoning actively drives the cooperation outcome. `A` is purely reactive to `B`'s choice. `B` chooses cooperation knowing it will be mirrored.
      *   **Established Names:** This lacks a *single* specific name but falls under:
          *   **Acting as a Predictable Cause / Source of Predictability:** `B` understands they are the causal source for `A`'s action and acts accordingly.
          *   **Functional Transparency:** `B` knows the *function* `A` uses (output depends on `B`'s input), even without knowing the implementation (the rule text).
          *   **A Sub-type of Superrationality?** Only loosely, as `B` isn't assuming symmetry, but rather `A`'s specific dependency. It shares the predictability aspect.

  3.  **The Probabilistic Case (Visibility not guaranteed, but believed likely enough):**
      *   **Mechanism:** Neither party verifies the other's rule with certainty. Each estimates a probability `p` that the other is the "matching type" (has the rule `Cooperate iff I do`). They then calculate the expected payoff of cooperating vs. defecting based on `p` and the payoff matrix. Cooperation becomes the better bet if `p` is high enough that the expected gain from triggering mutual cooperation (when the other *is* a matcher) outweighs the loss from being exploited (when the other *isn't* a matcher and defects while you cooperate).
      *   **Relationship:**
          *   This is a **cousin phenomenon**, not the same core structure.
          *   **Why a cousin?** It relies on **expected utility calculation under uncertainty** about the other's type/rule. The agent *is* weighing payoffs at the moment of acting (or when committing to a strategy).
          *   It lacks the "pre-commitment" and "fixed by the other's rule" aspects of the deterministic cases. The reasoning isn't "defecting is pointless because I *know* they'll match it," it's "defecting *might* be bad/good depending on what they do, but cooperation has a better *expected* value given my belief `p`."
          *   This is fundamentally about **risk assessment and statistical decision theory**, moving towards concepts like **Evolutionary Stable Strategies (ESS)** or **Bayesian Nash Equilibrium** applied to learning types, though still in a one-shot context. It's similar to the reasoning behind "cooperating with tit-for-tat in a population" but collapsed into a single decision based on priors.

  **Summary & Answers to Your Questions:**

  *   **Does it have an established name?** The *symmetric* case is best called **Superrationality**. The overall pattern involving rule visibility/predictability leading to cooperation without explicit payoff weighing at action time is often discussed under **Reflective Decision Making** or **Acausal Decision Theory** (emphasizing the counterfactual dependency).
  *   **Is the one-way case distinct?** **Yes, it is structurally distinct** from the symmetric case. It relies on the unobserved party (`B`) understanding that they are the *causal source* for the observed party's (`A`'s) action and choosing the action that will be mirrored to produce the best outcome. It's not just asymmetric visibility; it's `B` reasoning about `A`'s *functional dependency* without seeing `A`'s rule.
  *   **Is the probabilistic case the same phenomenon?** **No, it is a cousin.** The deterministic cases (symmetric and one-way) rely on *certainty* about the other's rule or dependency, leading to a pre-committed action where defecting is logically futile. The probabilistic case relies on *uncertainty* and *expected utility calculation*, making cooperation a risky bet that pays off *on average* if the belief about the other's type is sufficiently high. It reintroduces payoff weighing.

  **Edge Summary:**

  *   **Symmetric Visibility:** Superrationality / Reflective Equilibrium. Mutual rule visibility enables mutual prediction and locks in cooperation.
  *   **One-Way Visibility:** Acting as a Predictable Cause / Functional Transparency. The unobserved party (`B`) drives cooperation by understanding their action determines the observed party's (`A`'s) reaction. Structurally distinct.
  *   **Probabilistic "Visibility":** Expected Utility Cooperation under Type Uncertainty. A cousin phenomenon based on risk assessment and beliefs, not logical certainty/pre-commitment.

  This pattern beautifully illustrates how commitment devices, transparency, and reasoning about predictability can enable cooperation in seemingly impossible one-shot dilemmas, even without direct reciprocity or enforcement mechanisms. The variants highlight the crucial differences between logical certainty, functional dependency understanding, and probabilistic belief.
