prompt: |-
  I'm a novelist — third book, and it's mostly about people and their jobs — and there's a move in arguments about work that I keep running into and don't have a word for. It's driving me a little nuts. Let me describe it, because I don't want to just get pointed at the Protestant work ethic and sent on my way.

  Here's the shape. Somebody works insane hours and asks for more money. The defence is: this is labour, it's a burden, it wrecks your body, obviously it should be compensated. Same person, a few years later, asks to go down to four days. Now the same voices say: but you love this, it's your calling, people would kill to do what you do — you're not really working, so what are you complaining about? The description of the identical activity flips depending on which conclusion is wanted. Burden when the claim is pay, blessing when the claim is time.

  Second instance, and this is the one that shows up in my own life. Rest only counts as legitimate when it's secretly instrumental. A nap is okay because it's recovery for tomorrow. A walk is okay because you get ideas. A hobby is okay if it might become a side hustle. But rest that has no output at all — the genuine kind, lying in a hammock doing nothing — gets treated as slightly shameful, and the person taking it gets called lazy, while the person who never takes it gets called a martyr, or in the case I keep reading about in Japan, just drops dead and everyone calls it karoshi and moves on. Meanwhile France legislates a 35-hour week and half the commentary treats the extra day as a theft from someone.

  So it's two things tangled up, I think: the flip where the same work is re-described as burden or blessing to suit the argument, and the rule that leisure is only respectable if it's actually work in disguise. I'm fairly sure "Protestant work ethic" isn't the specific thing — that's about a duty to labour, not about this convenient re-description — and "hustle culture" is just a vibe, not a mechanism.

  You're a philosopher of work and leisure, someone who's read the social-theory literature closely. Before you answer, take a moment to brainstorm the candidate concepts you know that live near this — the ones about the moral status of work, about compensation, about the social construction of what counts as labour, about rest — and test each one against my two cases on paper. Then commit. I don't want a survey with the options laid out for me to choose from.

  What I actually want: does this have a name? If it does, tell me what it is and be honest about how far it reaches — where it fits my cases cleanly and where it starts to strain. If nothing established fits, coin a term, define it, and tell me the boundary cases: what it is not, where it shades into ordinary equivocation or into a legitimate context-dependent distinction, and whether the flip is a fallacy, motivated reasoning, or actually defensible. And then take a side — is the person doing the flipping doing something wrong, or are we all just muddling through with a concept (work) that was never coherent to begin with? Give me a definite verdict and the reasons for it, not a both-sides shrug. And please don't pad it with a reading list — I can't look anything up right now anyway, just tell me what you think.
reasoning: |-
  Okay, let me tackle this novelist's query. They're describing this frustrating flip in how people talk about work—it's a burden when demanding pay, but a blessing when asking for time off. Plus, rest is only valued if it's secretly productive. They want to know if this has a name or if we need to coin a term. 

  First, I need to unpack both patterns. The flip feels like a rhetorical bait-and-switch—same activity, opposite descriptions based on the desired outcome. The rest thing is different but related: leisure must disguise itself as instrumental to be respected. 

  Hmm, "Protestant work ethic" is too broad here. Weber focused on duty, not this situational relabeling. "Hustle culture" captures the vibe but not the mechanism. What about existing concepts? Alienation (Marx) explains work as burden but not the blessing flip. False consciousness might touch it but feels too loaded. Veblen's leisure class is inverted here—it's about hiding leisure's worth, not flaunting it. 

  The closest framework might be Foucauldian—how power shapes discourse to maintain control. Calling work a "calling" when refusing time off serves the employer's interest. But that doesn't name the flip itself. Or maybe "ideological dissonance"? Still vague. 

  For the rest issue, "productivity imperative" fits—rest must justify itself through output. That's spot on. But it doesn't cover the flip. 

  Brainstorming a new term... The flip is "work-blessing burden-switching"? Clunky. "Labor valorization duality"? Pretentious. "Instrumental schizophrenia"? Too clinical. What about "occupational doublespeak"? Or simpler: "work-duplicity"? 

  Wait—"rhetorical labor arbitrage"? Arbitrage exploits price differences; here it's exploiting meaning differences for rhetorical gain. That clicks. The employer "arbitrages" between conflicting definitions of labor to always win. For rest: "covert productivity requirement." 

  But are they separable? Both stem from work's conceptual incoherence. We haven't resolved whether work is intrinsically valuable (blessing) or instrumentally costly (burden). Society waffles because capitalism needs both narratives: burden to justify wages, blessing to extract passion. 

  Verdict: This is a named fallacy—specifically, "equivocation" (changing meanings mid-argument). But it's also systemic. The person flipping isn't just illogical; they're upholding a system that demands work be simultaneously sacred and sacrificial. Calling it "rhetorical arbitrage" names the tactic; the deeper issue is work's schizophrenic status under capitalism. 

  The rest-as-instrumental thing is equally pernicious. Both reveal work's tyranny over human worth. No wonder the novelist is frustrated—it’s a raw nerve in our collective psyche. 

  Final answer: Coin "rhetorical labor arbitrage" for the flip. For rest, it's the "productivity imperative." And yes, it's wrong—a form of bad faith that traps us in unsustainable lives. The concept of work is incoherent because we've let economic logic colonize it entirely.
answer: |-
  This phenomenon has no single established name in the literature, but it isn't just muddling. It's a specific, insidious **conceptual mechanism** rooted in capitalist ideology. I'll name it, dissect it, and deliver the verdict you asked for.

  **The Name: "Instrumental Valorization"**  
  *Definition:* The systematic redefinition of an activity's essential character (as *burden* or *blessing*) based solely on its instrumental value to capital accumulation or social control, while suppressing its intrinsic human value or cost. The mechanism demands that *rest* must also justify itself instrumentally as deferred or disguised *work* to be morally legitimate.

  **How It Fits Your Cases:**
  1.  **The Flip (Burden/Blessing):** This is **Instrumental Valorization in action**. The *identical labor* isn't being re-described based on context; it's being *instrumentally re-valued* to serve the power structure's immediate need.
      *   When demanding pay: Labor is framed as a *burden* (cost, depletion). This validates the *exchange* logic ("compensate the loss"). Highlighting the burden minimizes the worker's claim beyond bare compensation ("you're lucky to be paid at all for this drudgery").
      *   When demanding time/autonomy: Labor is framed as a *blessing* (privilege, intrinsic reward). This invalidates the *depletion* logic ("why do you need rest from joy?"). Highlighting the blessing maximizes the worker's perceived debt ("you owe your devotion to this gift").
      *   **The Core Mechanism:** The activity itself is hollowed out. Its meaning is imposed externally based on *what denial or extraction best serves the employer/system at that moment*. The worker's lived experience is irrelevant.

  2.  **Rest as Covert Work:** This is the **flip side of Instrumental Valorization** applied to non-work. Rest is only morally permissible if it can be instrumentally valorized *as work*.
      *   A nap *for recovery* is "productive maintenance" (like servicing a machine). A walk *for ideas* is "creative R&D." A hobby *as a side hustle* is "entrepreneurial development."
      *   **Pure rest (intrinsic value)** lacks instrumental justification for capital. It represents time and energy *not* being optimized for output. This is perceived as a moral failing ("laziness") or a threat to the logic of perpetual productivity. The "martyr" who never rests is the idealized instrument, even unto death (*karoshi*), because their total depletion signifies maximum instrumental valorization. France's 35-hour week is seen as "theft" because it legally mandates time *explicitly removed* from instrumental valorization.

  **Boundary Cases & What It's Not:**
  *   **Not Ordinary Equivocation:** Equivocation is accidental or deceptive wordplay. Instrumental Valorization is a *systematic feature* of how work/rest are conceptualized within dominant capitalist ideology. It's consistent in its *function* (serving accumulation/control), even while inconsistent in its *description*.
  *   **Not Legitimate Context-Dependence:** A genuinely context-dependent distinction would acknowledge *both* aspects simultaneously (e.g., "This job is grueling *and* fulfilling, so we need to balance pay and sustainable hours"). Instrumental Valorization *suppresses* one aspect to weaponize the other. It denies the inherent duality.
  *   **Not Just "Protestant Work Ethic" (PWE):** The PWE provides the *background moral fuel* (work as duty, idleness as sin) but doesn't explain the *rhetorical flip*. Instrumental Valorization is the *operational logic* exploiting that fuel. PWE says "work is good." Instrumental Valorization says "work is *whatever we need it to be* to deny your claim."
  *   **Not Just "Hustle Culture":** Hustle culture is the *cultural manifestation*. Instrumental Valorization is the *underlying conceptual machinery* enabling it.

  **Is the Flip a Fallacy?**  
  Yes, it's a **fallacy of motivated reasoning**, specifically a form of **Special Pleading**. The definition of the activity is arbitrarily changed to suit the desired conclusion while ignoring contradictory evidence (the worker's consistent experience). It's also **bad faith** because it refuses to engage with the worker's holistic reality.

  **The Verdict (No Both-Sides):**  
  **The person/system doing the flipping is absolutely doing something wrong.** This is not muddling; it's a form of **ideological coercion**. It's wrong because:

  1.  **It Denies Human Reality:** It dismisses the worker's lived experience of exhaustion, passion, or the need for intrinsic rest. It reduces them to a one-dimensional instrument.
  2.  **It Enables Exploitation:** By controlling the narrative of work's value, it justifies underpayment ("it's just a burden") and overwork ("it's a blessing"). It weaponizes passion.
  3.  **It Corrupts Leisure:** It poisons the well of genuine rest and intrinsic enjoyment by demanding productivity justification. It makes pure being feel illicit.
  4.  **It's Logically Bankrupt:** It relies on contradictory definitions applied opportunistically, revealing its purpose is control, not truth or fairness.

  **The Root Problem:**  
  You're right that "work" as a concept is strained. Under capitalism, it's forced to simultaneously be:
  *   A **commodity** (burden, cost to be minimized in exchange).
  *   An **identity/calling** (blessing, source of meaning to be maximally exploited).
  *   The **sole source of legitimate value** (delegitimizing intrinsic rest).
  Instrumental Valorization is the cognitive dissonance resolving mechanism *for the system*, allowing it to fluidly deploy whichever definition extracts maximum value or control in the moment, regardless of human cost. **The concept isn't incoherent inherently, but it's been made incoherent *by* this systemic demand for contradictory valorizations.**

  **In Short:** You've nailed a core mechanism of modern work ideology. It's **Instrumental Valorization** – the ruthless redefinition of activity (work or rest) solely by its usefulness to power, denying its intrinsic human dimension. It's a fallacy, it's exploitative, and it's a key reason why so many feel trapped and gaslit in their relationship with work and rest. Your characters are wrestling with the lived reality of this conceptual violence. Name it, expose it, let them rage against it.
