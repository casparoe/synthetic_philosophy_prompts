answer: |-
  Here's a conceptual breakdown of how mixed strategies change dominance reasoning, disentangling your three points:

  **The Core Shift: Expanding the Player's Toolkit**
  When we allow mixed strategies, we fundamentally expand what a player can *do*. Instead of choosing a single pure action, a player can choose a *probability distribution* over their pure actions. This creates a "convexified" set of choices – essentially, the player can blend pure actions together. This blending creates new possibilities for domination that don't exist when only pure strategies are considered.

  **1. Pure Strategy Dominated by a Mix, But No Pure Strategy Dominates It**

  *   **Concept:** A pure strategy can be inherently flawed not because it's worse than any *single* other action in every situation, but because it's worse than a carefully chosen *blend* of other actions across *all* possible opponent actions. The mix exploits the pure strategy's weaknesses relative to different components of the blend in different scenarios.
  *   **Simple Example: Modified Prisoner's Dilemma**
      *   **Player A:** Cooperate (C), Defect (D), **Irrelevant (I)** (e.g., sings a song, irrelevant to the payoff)
      *   **Player B:** Just Cooperate (C) and Defect (D).
      *   **Payoffs for A (B's payoffs standard PD, don't matter for A's dominance):**
          *   If B plays C: A gets 3 for C, 5 for D, **0 for I**.
          *   If B plays D: A gets 0 for C, 1 for D, **0 for I**.
      *   **Analysis:**
          *   Is `I` dominated by `C`? No. Against B playing D, `C` gets 0, `I` gets 0. `C` doesn't *strictly* dominate `I` (needs strictly better payoff against *every* opponent strategy).
          *   Is `I` dominated by `D`? No. Against B playing C, `D` gets 5, `I` gets 0 (good!), but against B playing D, `D` gets 1, `I` gets 0 (still better). However, `D` gets 5 > 0 against C, but only 1 > 0 against D? That's *strictly* better in both cases! So `D` *does* strictly dominate `I` in this setup. That's not the intended example. Let's fix it.
      *   **Better Example (Avoiding the flaw):**
          *   Change payoff for A playing `I` against B playing D to **2**.
          *   **Revised Payoffs for A playing I:**
              *   Against B(C): 0
              *   Against B(D): 2
          *   **Analysis:**
              *   `I` vs `C`: Against B(C): C=3 > I=0. Against B(D): C=0 < I=2. Neither dominates the other.
              *   `I` vs `D`: Against B(C): D=5 > I=0. Against B(D): D=1 < I=2. Neither dominates the other.
              *   Now consider a **mixed strategy M**: Play `C` with 50% probability, play `D` with 50% probability.
                  *   Expected Payoff against B(C): (0.5 * 3) + (0.5 * 5) = 1.5 + 2.5 = 4 > 0 (I's payoff)
                  *   Expected Payoff against B(D): (0.5 * 0) + (0.5 * 1) = 0 + 0.5 = 0.5 < 2 (I's payoff) *Wait, 0.5 < 2, so M is worse against D!* We need strict domination. Mistake again.
      *   **Correct Simple Example (Requires 3+ pure strategies or asymmetric payoffs):** Imagine Player A has three strategies: `X`, `Y`, `Z`. Player B has two: `L`, `R`.
          *   Payoffs for A:
              *   If B plays `L`: `X`=1, `Y`=0, `Z`=3
              *   If B plays `R`: `X`=1, `Y`=3, `Z`=0
          *   **Analysis:**
              *   Is `X` dominated by `Y`? Against L: X=1 > Y=0. Against R: X=1 < Y=3. No.
              *   Is `X` dominated by `Z`? Against L: X=1 < Z=3. Against R: X=1 > Z=0. No.
              *   Consider a **mixed strategy M**: Play `Y` with 50% probability, play `Z` with 50% probability.
                  *   Against B(L): (0.5 * 0) + (0.5 * 3) = 0 + 1.5 = 1.5 > 1 (X's payoff)
                  *   Against B(R): (0.5 * 3) + (0.5 * 0) = 1.5 + 0 = 1.5 > 1 (X's payoff)
              *   **Result:** `M` strictly dominates `X` (1.5 > 1 against both `L` and `R`), yet no single pure strategy (`Y` or `Z`) strictly dominates `X`.
  *   **Why Mixed Strategies (Not Beliefs) Are Doing the Work:** The key is the player's own *capability*. Beliefs are about predicting the *opponent*. The availability of mixed strategies is about the *player's own available actions*. In the example, even if Player A is *certain* Player B will play `L` (belief), playing `Z` (payoff 3) is better than `X` (payoff 1). If A is certain B will play `R`, playing `Y` (payoff 3) is better than `X` (payoff 1). However, if A is *uncertain* about B, they might be tempted to play `X` as a "safe" option getting 1 no matter what. The mixed strategy `M` shows Player A that they have a *better option available in their own toolkit* (`M`) that guarantees them 1.5 regardless of what B does. Beliefs influence which strategy is *optimal* given that uncertainty, but the *existence* of `M` shows `X` is *never optimal* – there's always a better choice `M` in A's expanded set of actions, irrespective of A's specific belief about B. The mixed strategy provides a strictly superior *action plan*.

  **2. Decision-Theoretic Justification Survives (Never a Best Response)**

  *   **Conceptual Core:** The fundamental decision-theoretic principle is: "A rational player will not choose a strategy if there is *some other available strategy* that yields a strictly higher payoff *given the player's belief about the opponent*." Mixed strategies expand the set of "available strategies".
  *   **Why the "Uniformly Better Alternative" Reading Fails:** With only pure strategies, a strictly dominated pure strategy `s` is beaten by some specific *other pure strategy* `s'` against *every* possible opponent action. `s'` is the "uniformly better alternative". With mixed strategies, `s` might only be beaten by a *mix* `m`. Crucially, *no single component pure strategy within `m` may beat `s` uniformly*. As in the example, `Y` loses to `X` if B plays `L`, and `Z` loses to `X` if B plays `R`. There is *no single pure alternative* that is safe against every opponent action.
  *   **Why the "Never Optimal Under Any Belief" Justification Holds:** Suppose a player has *some* belief (probability distribution) over the opponent's pure strategies. The expected payoff of a mixed strategy is the probability-weighted average of its payoffs against the opponent's pure strategies. If a mixed strategy `m` strictly dominates a pure (or mixed) strategy `s`, then `m` yields a strictly higher expected payoff than `s` *no matter what belief the player holds* (because it yields strictly more against every opponent pure strategy, which are the building blocks of any belief).
      *   **Technical Flag:** This relies on the linearity of expected payoff in probabilities. The payoff of a mixed strategy against an opponent mixed strategy is a linear function of the mixing probabilities. This linearity ensures that if `m` beats `s` against every pure opponent strategy, it beats `s` against *any* mixed opponent strategy (belief). *(The technical result confirms the conceptual link between domination and never being a best response under any belief.)*
  *   **Conclusion:** Even though no single pure alternative is uniformly better, the *availability* of the mixed strategy `m` means that for *any* specific belief the player might have, choosing `m` gives a strictly higher expected payoff than choosing the dominated strategy `s`. Therefore, `s` can *never* be the unique best response to any belief. A rational player would always strictly prefer `m` (or possibly other strategies) over `s`.

  **3. Order Independence (Strict) vs. Order Dependence (Weak) & What it Reveals**

  *   **Strict Dominance Iteration (Order Independent):**
      *   **Concept:** If a strategy `s` is strictly dominated (by *any* mixed strategy), it is strictly worse than its dominator `m` against *every single possible* opponent pure strategy. Eliminating `s` doesn't change the "landscape" against which other strategies are evaluated. Whether `s` is eliminated first or last, the fact that `m` beats `s` everywhere remains true. Removing `s` doesn't make a previously non-dominated strategy become dominated (because strict domination requires being beaten *everywhere*, and `s` wasn't helping beat anyone else *everywhere*). Removing `s` only removes a strictly inferior option, leaving the relative comparisons among surviving strategies unchanged. The process converges to a unique set.
      *   **Technical Flag:** Proving the uniqueness of the final set often relies on showing the process is equivalent to removing strategies that are never best responses, and that this set is well-defined. *(The technical result guarantees convergence to a unique set regardless of order.)*
  *   **Weak Dominance Iteration (Order Dependent):**
      *   **Concept:** A strategy `w` is weakly dominated if there's a mixed strategy `m` that gives *at least as good* a payoff against *every* opponent pure strategy and a *strictly better* payoff against *at least one* opponent pure strategy. Crucially, `m` might only be better than `w` against opponent strategies that are *themselves* potentially weakly dominated or that might be eliminated later.
      *   **Why Order Matters:** Imagine opponent strategy `o1` is the only one where `m` beats `w`. If `o1` is eliminated early (perhaps because it's weakly dominated for the opponent), then the *reason* for eliminating `w` disappears – `m` is no longer strictly better than `w` against any *remaining* opponent strategy (it's only equal). `w` survives. Conversely, if `w` is eliminated first (because `o1` is still present), then `o1` might later be eliminated without issue. The set of survivors depends on the sequence.
  *   **What the Asymmetry Reveals:** The asymmetry starkly highlights the difference in strength between the two concepts:
      *   **Strict Domination (Bad Under EVERY Belief):** Requires a strategy to be strictly inferior *no matter what the opponent does*. Its inferiority is absolute and independent of which opponent strategies exist or are believed possible. Elimination is robust.
      *   **Weak Domination (Bad Only Under Beliefs Giving Weight to Specific Actions):** A weakly dominated strategy `w` *can* be a best response! Specifically, it can be a best response if the player assigns *zero probability* (in their belief) to *every* opponent pure strategy where the dominating mixed strategy `m` is strictly better than `w`. `w`'s inferiority depends entirely on the opponent playing one of those specific strategies where `m` beats it. If those opponent strategies are deemed impossible (either by belief or by elimination), `w` becomes "safe" and potentially rational. The order dependence directly reflects this reliance on which opponent strategies are still considered viable.

  **In Summary:**

  1.  **Mixed Domination Beyond Pure:** Mixes create new actions. A pure strategy can be beaten by a blend even if no single pure action beats it everywhere, demonstrating the power of the player's expanded toolkit.
  2.  **Survival of Decision Theory:** While no single pure alternative may be universally safe, a dominated strategy is *never* optimal under any belief because the dominating mixed strategy always yields a strictly higher expected payoff. Linearity of expectation bridges the gap.
  3.  **Order Independence Asymmetry:** Strict domination's immunity to order reflects the absolute, belief-independent inferiority of the dominated strategy. Weak domination's sensitivity to order reveals its conditional inferiority – it only manifests when specific opponent actions are considered possible.
