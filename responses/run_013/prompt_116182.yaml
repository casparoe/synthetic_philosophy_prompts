answer: |-
  ## Shared Pot

  She says: Coffee's ready at seven.

  He hears this. He tells her: I know it’s at seven.

  She hears *that*. She tells him: I know you know about seven.

  He hears *this* now. He tells her: I know you know I know it’s seven.

  She hears *this* layer. She tells him: I know you know I know you know, seven.

  He hears this thicker cord. He thinks: She knows I heard her say she heard me tell her I understood her first word about seven.

  *And the channel hums, thin and prone to snap.
  The knowing climbs, a rickety track.
  Each step secured reveals the next gap.
  The tower trembles, ready to collapse.*

  No matter the messages stacked high and neat,
  No whisper of loss, no hint of deceit,
  However solid the repeating beat,
  One knowing always trails, incomplete.

  Even if failure fades to a vanishing chance,
  A ghost of doubt retains its stance.
  The tower stands, a separate dance,
  Never dissolving into shared glance.

  Then.
  The timer buzzes, sharp and clear.
  A sound that lands in every ear.
  She turns her head, he looks right here –
  Sees her hearing, sees his face appear,
  Reflecting back the ringing near.
  No word exchanged. No need to steer.
  The mugs are lifted, dark and sheer.
  Coffee pours.

  They pour.
