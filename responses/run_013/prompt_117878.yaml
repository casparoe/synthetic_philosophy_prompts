  We are given a language that obligatorily marks, on every noun phrase, one of two kinds of sameness:
    Type 1: same stuff persisting through time (e.g., a repaired watch is still the same watch by identity of substance)
    Type 2: same pattern re-instantiated from a blueprint (e.g., a new watch built to the same design is the same by pattern)

   In English, we can say "the same watch" without specifying which kind of sameness we mean. In this language, you must choose.

   We want a thought that is genuinely unavailable to speakers of this language, due to the grammar.

   Constraints:
    - Not a stock example (avoid colors, numbers, time, directions, gender).
    - Must show in a non-linguistic task (so no language involved in the task).
    - Communities matched on everything else (so only grammar differs).
    - The unavailable thought must be propositional (true/false) and not just attentional.
    - The fieldworker must be able to know without circularity.

   Candidate thoughts that might be unavailable:
    1. The thought that an object can be considered "the same" without it being either Type 1 or Type 2.
    2. The thought that an object might simultaneously be both Type 1 and Type 2 (if that is even coherent in the scenario).
    3. The thought that the sameness of an object is indeterminate (neither Type 1 nor Type 2, or both, or in between).
    4. The thought that the sameness type is irrelevant in a particular context.

   Why some might fail:
    Candidate 1: This seems promising because the language forces a binary choice. But we must make sure that the thought is not just hard but impossible. We need a task that requires considering sameness without specifying a type, and show they can't do it.
    Candidate 2: Might be too abstract. Also, the language might not preclude this (they could use both markers? but we stipulate they must choose one per NP). So if they must choose one, then they might not be able to think of both at once? But that might be more about attention.
    Candidate 3: This is the one I suggested. The thought that the question of sameness has no determinate answer. This is propositional: it can be true or false. And the language forces a choice, so they might not be able to entertain the idea that sometimes it's indeterminate.

   Candidate 3 seems best. Let's build:

   The thought: "For object X and Y (which are related by some transformation), it is indeterminate whether they are the same (i.e., neither Type 1 nor Type 2 applies, or both do, or the criteria are in conflict)."

   How to test without language? We design a non-linguistic task.

   Scenario:
    We have two communities: Group A (speakers of the target language) and Group B (matched controls, say English speakers). We show them a series of object transformations. For example:

    - A clay pot is broken and then reassembled (Type 1: same stuff, same pattern?).
    - A clay pot is broken and then a new pot is made from the same clay (Type 1: same stuff? But pattern might be slightly different? Or same?).
    - A clay pot is broken and then a new pot is made from new clay but to the same design (Type 2: same pattern, different stuff).
    - A clay pot is broken and then the shards are ground into powder and then a new pot is made from that powder (is that same stuff? It's reconstituted. Same pattern?).

    We create a case that is ambiguous: for example, a pot is broken, then the pieces are melted down and reshaped into a pot of the same design. Is it the same stuff? The matter is the same, but the form was lost and then reimposed. Is it the same pattern? The pattern is the same, but the stuff was reconstituted.

    We then ask participants to sort these transformations into three categories:
      Category 1: Definitely the same object (by whatever criteria they use).
      Category 2: Definitely not the same object.
      Category 3: Unclear or indeterminate.

    The critical point: The task is non-linguistic. We show videos or sequences of images, and they sort by placing cards in bins. No words.

    Prediction for Group A (target language): They will never use Category 3. They will force a choice: either Category 1 (if they apply Type 1 or Type 2) or Category 2 (if they don't). They cannot entertain the indeterminate thought because their language forces them to always choose one of the two sameness types. Therefore, they will always see every case as either same (Type 1 or Type 2) or not same.

    Prediction for Group B (English): They will sometimes use Category 3, especially in the ambiguous cases.

    But note: we must ensure that the ambiguous case is truly ambiguous. We need to pre-test with English speakers to find a transformation that gets about 50% "same" and 50% "not same", and then see if they use "unclear" for that case.

    Why might Group A never use Category 3? Because they don't have the concept of indeterminacy in sameness? Or because they are used to forcing a choice? We need to argue that the thought is unavailable.

    How does the fieldworker know? The fieldworker is bilingual and can think the indeterminate thought. But the constraint says we cannot rely on that. So we must design the task so that the absence of Category 3 is evident and cannot be explained by other factors.

    We can also include control trials:
      - Clear Type 1: a pot is moved from one table to another. (Everyone should say same.)
      - Clear Type 2: a new pot made from a different clay but same design. (English speakers might say not same, or same? Actually, we want to see if they ever say unclear. But for Group A, they must choose: if they have a marker for Type 2, they might mark it as same by Type 2, so they put in Category 1. But for English, they might not have a strong opinion and might use Category 3? Not necessarily. So we need the ambiguous case to be one where the two criteria conflict and there's no clear answer.)

    Let me design the ambiguous case: 
      - Start with a clay pot (P1).
      - Break it into pieces.
      - Grind the pieces into a fine powder (so the original form is completely destroyed).
      - Use that powder (same matter) to make a new pot (P2) with the same design.

    Now, is P2 the same as P1?
      - Same matter? Yes, the clay is the same (Type 1).
      - Same pattern? The pattern was destroyed and then recreated. Is that Type 2? But Type 2 is for when you use a blueprint to make a new instance. Here, we used the same matter, but the pattern was recreated from memory? So it might be a new instance of the pattern? But the matter is the same.

