    How do we match the groups? We find a community that is culturally similar, but speaks a different language. Or we can test bilinguals? But the constraint says no. We need two monolingual groups. So we find two communities: one with the target language, one without (but otherwise similar). We control for education, exposure to pottery, etc.

    The fieldworker can know by:
      - Running the task and seeing that Group A never uses Category 3, even in the ambiguous case, while Group B does.
      - And by showing that Group A is capable of using Category 3 in other contexts? For example, we can have a control task with color gradients: from blue to green, and ask if a certain tile is blue, green, or unclear. Both groups should use "unclear" for some tiles. This shows that Group A understands the concept of indeterminacy in general, but not in the sameness domain.

    So the unavailable thought is the proposition: "It is indeterminate whether P1 and P2 are the same."

    Now, the causal mechanism: The grammar forces speakers to categorize every instance of an object as either Type 1 or Type 2. This constant practice leads to a cognitive habit where the mind does not even consider the possibility of indeterminacy in this domain. It's not that they can't understand the word "indeterminate", but that in this specific conceptual space, the possibility is never activated.

    Now, three positions:

    1. Strong Whorfian: The grammar makes the thought of indeterminacy in sameness unavailable. We see this because even in a non-linguistic task, they cannot access that thought. The mechanism is that the grammatical categories structure the conceptual space, and without the linguistic expression of indeterminacy (which they lack), the thought cannot be formed.

    2. Universalist: The thought is always available because it is part of universal cognition. The fact that they don't use Category 3 is a performance issue: they are so used to making a forced choice in language that they do the same in the task. But if you teach them (or if the task is explained in a way that allows for indeterminacy), they can use Category 3. So the fieldworker could train them on the concept of indeterminacy (using a different domain) and then they would be able to use it. Therefore, it was not unavailable, just not accessed.

    3. Language-as-scaffolding: The language provides a tool that shapes cognition, but the thought is not absolutely unavailable. Without the language, it might be harder to think, but with effort, it can be achieved. In this case, the scaffolding of the binary choice makes it very difficult to think of indeterminacy, but not impossible. They might need extra cognitive effort or training.

    How does our case favor the strong Whorfian view?
      - The fieldworker tries training: she teaches Group A the concept of indeterminacy using colors (which they understand). Then she asks them to apply it to the sameness cases. But they still cannot do it. They say: "But it must be either Type 1 or Type 2!" They cannot even imagine how it could be indeterminate. This shows that the thought is genuinely unavailable.

    The strongest counterattack from the universalist: 
      "You taught them the concept of indeterminacy in colors, but that's a different domain. If you teach them directly in the sameness domain, they will get it. For example, show them a case where even you (the fieldworker) think it's indeterminate and explain that sometimes we just don't know. Then they will understand and use Category 3."

    How we handle it: 
      The fieldworker does exactly that. She explains that in some cases, even she doesn't know if it's the same object, and that it's okay to say unclear. But when the Group A participants are then retested, they still do not use Category 3 for the sameness cases. They might say: "But you have to choose one! It has to be one or the other." They cannot grasp that the sameness question might not have a determinate answer.

    Why? Because their entire conceptual framework for object identity is built around the binary grammatical distinction. The universalist might then say: "Well, they just have a strong belief that sameness is always determinate. That's a belief, not a cognitive inability." 

    But note: we have matched the groups on culture and environment. The only difference is the language. And the belief is not present in Group B. So the belief comes from the language. And if the belief is so entrenched that they cannot even entertain the contrary proposition (that it might be indeterminate), then the thought is unavailable.

    The critical feature: The obligatory marking in every noun phrase. If we remove that (e.g., if the language had optional marking), then the effect would disappear. But our language has it obligatorily.

