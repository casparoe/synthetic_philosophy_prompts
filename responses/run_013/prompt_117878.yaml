prompt: |-
  You're a philosopher of mind who actually knows the psycholinguistics on linguistic relativity — someone who's read the real studies and the real critiques, not just the Wikipedia version of the Sapir-Whorf hypothesis. Please think carefully, and don't jump straight to the deliverable: start with a scratchpad of three or four candidate cases, one line each on why the weaker ones fail, then pick the best and build it out.

  I want a thought experiment, and the whole point of it is that the strong version of the relativity claim is *true* inside the case — the language you speak makes a particular thought genuinely unavailable to you, not just harder, not just less habitual. I want this because I keep getting into arguments with people who say the whole "language shapes thought" thing is either trivially true or untestable, and I want a case where it's neither.

  Constraints, and these are the hard part, so I know there are alot of them:

  - Not one of the stock examples. No color terms, no number words (so no Pirahã), no time-as-space metaphors, no absolute cardinal directions, no gendered pronouns. Those are burned.
  - The difference has to show up in a task with no language in the loop — no reading, no talking, no labelling, no self-report. So the standard dodge, where the effect only exists while you're actually speaking or listening, is off the table.
  - The two communities are matched on everything else that could plausibly explain a gap: ecology, schooling, task familiarity, whatever else you think matters. The grammar has to be the only surviving candidate cause.
  - The thought that's unavailable has to be a propositional one — something that could be true or false — not merely a habit of attention. (One candidate worth chewing on: the thought that the question of whether something is "the same" across a change has no determinate answer. Use it if it works, drop it if it doesn't.)
  - The fieldworker in the story has to be able to know that the case obtains, and you have to say by what route — and it can't be circular. You can't just make her bilingual and thereby able to think the thought.

  Raw material, so you dont reach for the usual suspects: stipulate a small community whose language obligatorily marks, on every noun phrase, which of two kinds of sameness-across-change the speaker means — same stuff persisting through time, versus the same pattern re-instantiated from a blueprint. English forces no such choice on you. Take that as given and engineer around it.

  After the scenario, run it through three positions — the strong Whorfian, the universalist (thought comes first, so this has to be performance and not competence), and the language-as-scaffolding / cognitive-technology view — saying what each predicts and which one the case actually favors. Tell me what the causal mechanism is supposed to be, the thing that gets you from the grammar to the missing thought. Then be honest about which single feature of the case is doing the work, what happens if you delete it, and give me the strongest counterattack from whichever position comes out worst — I'm guessing the universalist's "she learned to think it, so it wasn't unavailable, just unlikely" move, and I want that dealt with head-on rather than waved off. Keep the scenario itself to a paragraph or so.

  No citations or reading lists, just build the thing.
