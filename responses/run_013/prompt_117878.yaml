        - Type 1: meaning it is the same stuff as P1 (which it is) but they are forced to ignore the pattern? 
        - Type 2: meaning it is a new instance of the same pattern (which it is) but they are forced to ignore the stuff?

    But note: in the language, when you say "the pot", you must choose a marker. So if they use Type 1, they are committing to the sameness of substance. If they use Type 2, they are committing to the sameness of pattern. They cannot avoid choosing.

