prompt: |-
  Take the role of a philosopher of causation and work through the following carefully; before committing to an answer, lay out the candidate principles you can see and what each one is betting on. I'm trying to figure out what I actually believe about causing something by not doing it, and I want you to tell me what principle, if any, captures my verdicts. Here they are. A surgeon skips a standard step and the patient bleeds to death: the skipping caused the death. A parent doesn't feed her child and the child dies: the failure caused it. I forget to water a plant and it dies: that caused it, though it feels like a thinner kind of causing than the surgeon's. But a stranger who never gives to the charity that would have saved a child, or who walks past a pond without throwing the rope that was lying at hand: I want to say those didn't cause the deaths, or at least that they aren't causes in the same way. Here are the two cases that make me doubt the contrast I'm drawing. First, no one ever built the firebreak, and the wildfire runs straight across the line where it would have stood; I want to say the absence of the firebreak caused the town to burn, even though there is no agent here and nobody omitted anything. Second, a doctor who follows every guideline to the letter but declines an unconventional treatment that would in fact have saved the patient; I'm inclined to say that didn't cause the death, even though it has the same shape as the surgeon's case: not doing the thing that would have helped. Is there a single principle that delivers all of these, or do I have to give one up? I keep suspecting that three different things are doing the work here -- that a duty or norm was violated, that the outcome counterfactually depended on the missing act, and that there was an agent who could have acted -- and my cases seem to pull them apart. Please state the principle or principles precisely, show me which of my verdicts each one keeps and which it has to overturn, say what it predicts for a case I haven't given, and be explicit about which parts of this are settled and which are genuinely contested among people who work on causation.
reasoning: |-
  Okay, I need to tackle this user's query about causation by omission. They're a philosopher or at least deeply interested in philosophy, given how they've structured their cases and their awareness of key concepts like counterfactuals and norms. Their core struggle is reconciling intuitive verdicts across different scenarios where "not doing something" seems to cause harm in some cases but not others.  

  Hmm, they’ve laid out six cases with conflicting intuitions:  
  - Surgeon skipping a step → caused death  
  - Parent not feeding child → caused death  
  - Forgetting to water plant → caused death (but "thinner")  
  - Stranger ignoring charity/pond → *didn’t* cause death  
  - Unbuilt firebreak → caused town to burn (despite no agent)  
  - Doctor refusing unconventional treatment → *didn’t* cause death  

  Their suspicion points to three factors: duty/norm violation, counterfactual dependence, and agency. But these factors don’t align neatly across cases.  

  First, I should map how each factor behaves in their examples:  
  - **Duty/norm violation**: Strong in surgeon/parent cases, weak in stranger/pond, absent in firebreak (no agent), ambiguous in doctor case (guidelines followed).  
  - **Counterfactual dependence**: Holds in *all* cases (death wouldn’t occur if the omitted action happened).  
  - **Agency**: Present in all except firebreak.  

  Ah, the tension is clear: Counterfactuals alone can’t explain their intuitions because they’d make the stranger/pond case causal (which the user rejects). Duty/norm explains surgeon/parent but fails firebreak (no duty-bearer) and doctor (no norm violation). Agency explains stranger/pond absolution but clashes with firebreak intuition.  

  Now, possible principles:  
  1. **Pure counterfactual**: Rejected—it forces "stranger caused death" verdict.  
  2. **Normative expectation**: Explains surgeon/parent vs. stranger, but can’t handle firebreak (no norm) or doctor (norm followed).  
  3. **Agent-causal control**: Solves stranger/pond but loses firebreak intuition and weakens watering plant case.  
  4. **Proximal necessity** (Schaffer): Focuses on *prevention*. Firebreak was necessary to prevent fire; surgeon’s step was standard prevention. Stranger’s rope isn’t "proximate prevention" in same way. But doctor case? Unconventional treatment isn’t standard prevention.  

  Hybrid approach might work: "Causation by omission requires: (i) counterfactual dependence, (ii) a salient norm assigning responsibility." This handles:  
  - Surgeon/parent: Norm + dependence ✅  
  - Stranger: Dependence but no norm ❌ (user’s verdict)  
  - Firebreak: Tricky—no norm, but user *wants* causation. Maybe "salient norm" can be societal expectation?  
  - Doctor: No norm violation (guidelines followed) → no causation ✅  
  - Watering plant: Weak norm (caretaker role?) → "thin" causation ✅  

  But firebreak remains a problem. Perhaps "salient norm" expands to *functional expectations* (firebreaks *should* exist in fire-prone areas). Still messy.  

  User’s doubt cases:  
  - Firebreak: They feel causation despite no agent. Principle must accommodate "natural" omissions.  
  - Doctor: No causation despite counterfactual dependence. Normative element saves it.  

  Settled: Counterfactual dependence is necessary but insufficient.  
  Contested: How norms/roles/duties are defined; whether "causation" is uniform or context-sensitive.  

  Prediction test: *Security guard fails to lock door, thief enters*. Normative role → omission causes theft. Versus *random passerby doesn’t lock door* → no causation. Aligns with user’s intuitions.  

  Verdict: Hybrid principle best—but firebreak requires stretching "norm" to systemic functions. Alternatively, admit two types of causation: agential (duty-based) and structural (preventive-measure-based). But user wants unity.  

  Final note: Their "thin" vs. "thick" intuition suggests causation is scalar, not binary. Maybe that’s key—principles weight factors differently per context. But they asked for a single principle. Tough!
answer: |-
  As a philosopher of causation, I'll rigorously analyze your cases to identify underlying principles. Your intuitions reveal a deep tension in omission-based causation, where three factors (norms, counterfactuals, and agency) appear entangled. I'll map candidate principles, test them against your verdicts, expose trade-offs, and flag contested territory. The core challenge is whether causation by omission is *unified* or *pluralistic*.

  ### Your Cases & Verdicts
  1. **Surgeon skips standard step → caused death** (Strong causation)  
  2. **Parent doesn't feed child → caused death** (Strong causation)  
  3. **Forget to water plant → caused death** (Weak/"thin" causation)  
  4. **Stranger ignores charity/pond → didn't cause death** (No causation)  
  5. **Unbuilt firebreak → caused town to burn** (Causation despite no agent)  
  6. **Doctor declines unconventional treatment → didn't cause death** (No causation, despite counterfactual dependence)  

  ### Candidate Principles & Their Betting Strategies
  Each principle prioritizes one factor and "bets" it explains intuitions best. I'll state them precisely, show verdict alignments, predict a new case, and note consensus.

  #### **Principle 1: Normative Expectancy**  
  *"An omission causes outcome O iff:  
  (i) O counterfactually depends on the omission (O occurs iff the act is omitted), AND  
  (ii) The agent (or system) violated a salient norm/duty to perform the act."*  
  - **What it bets on**: Moral/social norms define causation. Absences only "cause" when they breach obligations.  
  - **Your verdicts**:  
    - Keeps: Surgeon (violated medical duty), Parent (violated care duty), Stranger/pond (no duty → no cause), Doctor (no norm for unconventional treatment → no cause).  
    - Overturns: Firebreak (no norm/duty-bearer → can't explain causation), Watering plant (weak norm → struggles with "thinness").  
  - **New case prediction**: *A lifeguard off-duty walks past a drowning child*.  
    - Verdict: No causation (no duty while off-shift) → aligns with stranger/pond.  
  - **Status**: Contested. Supported by "responsibility-first" views (e.g., Hart & Honoré), but criticized for conflating causation with blame.  

  #### **Principle 2: Agent-Causal Control**  
  *"An omission causes O iff:  
  (i) O counterfactually depends on the omission, AND  
  (ii) An agent had direct physical control and opportunity to act, AND  
  (iii) The act was a feasible intervention."*  
  - **What it bets on**: Agency is essential. Omissions cause only when tied to intentional actors who could easily have acted.  
  - **Your verdicts**:  
    - Keeps: Surgeon/Parent/Plant (agent had control), Stranger/pond (agent had control but low "feasibility"?), Doctor (had control → *fails* your verdict).  
    - Overturns: Firebreak (no agent → no cause; contradicts you), Doctor (principle suggests cause; you say no cause).  
  - **New case prediction**: *Robot programmed to water plant malfunctions (no agent). Plant dies.*  
    - Verdict: No causation → but you might intuit causation (like firebreak).  
  - **Status**: Contested. Defended in action-based theories (e.g., Dowe), but ignores non-agential cases.  

  #### **Principle 3: Proximal Necessity (Schaffer-style)**  
  *"An omission causes O iff:  
  (i) O counterfactually depends on the omission, AND  
  (ii) The omitted act was a *proximal necessary element* in a salient preventive mechanism for O."*  
  - **What it bets on**: Causation tracks *structural prevention*. Omissions cause only if they disrupt an expected/standardized barrier to harm.  
  - **Your verdicts**:  
    - Keeps: Surgeon (standard step prevents bleeding), Firebreak (standard prevention), Parent (feeding prevents starvation), Stranger/pond (no salient preventive mechanism for strangers), Doctor (unconventional treatment isn't "standard" prevention).  
    - Explains "thinness": Watering plant is weak prevention (environment-dependent).  
    - Overturns: None of your verdicts directly, but "salient" is context-sensitive.  
  - **New case prediction**: *City fails to maintain a levee (standard flood prevention). Town floods.*  
    - Verdict: Omission caused flooding → aligns with firebreak.  
  - **Status**: Influential (Schaffer, 2004), but "salient" is contested. Blends counterfactuals with pragmatic/functional norms.  

  #### **Principle 4: Hybrid (Your Suspicions Formalized)**  
  *"An omission causes O iff:  
  (i) O counterfactually depends on the omission, AND  
  (ii) EITHER (a) a norm/duty was violated, OR (b) a salient preventive mechanism was absent (even sans agent)."*  
  - **What it bets on**: Pluralism. Norms *or* prevention structures suffice, explaining divergent cases.  
  - **Your verdicts**:  
    - Keeps: All six cases.  
      - Surgeon/Parent: Norm violation + prevention.  
      - Plant: Weak norm/prevention → "thin".  
      - Stranger/pond: No norm *or* salient prevention → no cause.  
      - Firebreak: Preventive mechanism absent (no norm needed) → cause.  
      - Doctor: No norm violated + unconventional not "salient prevention" → no cause.  
  - **New case prediction**: *Electrician omits safety check (norm violation), causing fire. Vs. Lightning strike where lightning rod wasn’t installed (no agent/norm, but salient prevention).*  
    - Verdict: Both caused → firebreak-like intuition honored.  
  - **Status**: Best fits your intuitions. Mirrors "disjunctive" approaches (e.g., McGrath).  

  ### Which Principle Captures Your Verdicts?
  - **Hybrid Principle (4)** delivers *all* your verdicts without contradiction, by treating norms and prevention as parallel pathways.  
  - **Proximal Necessity (3)** comes close but may struggle with "thinness" in watering plant (if prevention isn't salient).  
  - Pure counterfactualism (not listed; would say *all* omissions cause) fails your stranger/pond verdict.  
  - Normative (1) and Agent-Causal (2) principles force you to abandon firebreak causation or doctor non-causation.  

  ### Settled vs. Contested  
  - **Settled**:  
    - Counterfactual dependence is *necessary* for causation by omission (rejecting it leads to absurdity; e.g., not building a firebreak in Antarctica couldn’t cause a fire).  
    - Omission-based causation is *non-parity* with action-based causation (e.g., your "thin" intuition).  
  - **Contested**:  
    - Whether norms/duties are *constitutive* of causation (Hall vs. Schaffer debate).  
    - If "causation" is univocal across agential/non-agential cases (e.g., firebreak).  
    - How to define "salience" in preventive mechanisms without normativity.  

  ### Conclusion
  Your intuitions suggest a **pluralistic view**: omissions cause harm when they either violate norms *or* disrupt expected preventive structures, given counterfactual dependence. The Hybrid Principle systematizes this while exposing why cases feel different:  
  - Surgeon/Parent: Strong norms + prevention → "thick" causation.  
  - Firebreak: Prevention sans norm → causation but no blame.  
  - Stranger/Doctor: No norm *and* no salient prevention → no causation.  
  - Plant: Weak norms → "thin" causation.  

  To keep all verdicts, adopt the Hybrid view. If you abandon one, the firebreak case is the linchpin: denying its causation lets you use Principle 1 (Normative). But your intuition there suggests a commitment to prevention-based causation independent of agency. This is where philosophy can’t decide for you—it reveals your priors about what causation *is for*.

  > "We do not speak of the failure of the man on the street to act as causing the death, because he was under no duty to act."  
  > – H.L.A. Hart & Tony Honoré, *Causation in the Law* (1985)  
  >  
  > "Absences can be causes when they are absences of 'default preventers' in a mechanism."  
  > – Jonathan Schaffer, *Causes Need Not be Physically Connected to Their Effects* (2004)
