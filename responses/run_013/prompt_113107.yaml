answer: |-
  ## Three Views of the Flooded Vale

  **(I)**

  This tower, defiant needle in the blue,
  Stands proof of what stout faith and hand could raise
  When purpose carved its monument in stone.
  Beneath the glassy plane, the old road lies,
  A challenge now for daring hearts to trace,
  Where city youth in borrowed breath descends.
  The water, deep and clear and cold, sustains
  The distant multitudes who never knew
  The sacrifice that fills their crystal glass.
  The graves? Some stones were moved with decent care;
  The rest, like sleeping guardians, remain.
  The scattered folk? They built anew elsewhere,
  Their legacy this liquid, vital gain.
  *Come, stand where the sky touches stone.*

  **(II)**

  This tower, weathered finger to the cloud,
  Holds fast the names we tend, the dates we save,
  A ledger of the lives beneath the wave.
  Beneath the patient surface, known and mapped,
  The old road curves, precisely as it did,
  Where divers brush the silt from ancient ruts.
  The water, deep and still and patient, keeps
  The contours of the valley we once walked,
  A faithful cup for those who dwell downstream.
  The graves? We moved the kin we could retrieve;
  The rest lie quiet, watched by wave and stone.
  The scattered folk? Their stories we perceive
  In every ripple, every sunken bone.
  *We keep the names where the sky touches stone.*

  **(III)**

  This tower? A broken bone above the flood,
  A jagged tooth the lake could not digest,
  A monument to profit’s cold behest.
  Beneath the surface, slick and strangely warm,
  The old road rots where fools play out their games,
  Their bubbles rising past forgotten doors.
  The water, deep and tainted at the root,
  Flows thick with silted promises betrayed,
  A bitter draft for strangers unaware.
  The graves? Some stones were hauled for show, for peace;
  The rest were left for fish and time to gnaw.
  The scattered folk? Uprooted, piece by piece,
  Their silenced hearths still echo through the law
  that drowned their world. But still the names drown where
  *the sky touches...*

  ---

  **Design Note:**

  *   **Formal Skeleton & Refrain:** I chose strict iambic pentameter tercets (stanzas of three lines) for Movements I & II, establishing a deliberate, almost architectural rhythm reflecting order and perspective. The refrain ("Come, stand.../ We keep...") acts as a structural keystone, ending each movement. Its transformation drives the shift in mode: Movement I's imperative ("Come, stand") is monumental – inviting emulation of the tower's defiance. Movement II's declarative ("We keep") is antiquarian – focusing on preservation and record-keeping. Movement III fractures this: the refrain becomes accusatory ("But still the names drown..."), interrupts the tercet structure, spills into a fourth line, and ultimately fragments mid-phrase ("touches..."), visually enacting the critical mode's destructive necessity and the failure of the previous perspectives to contain the truth.
  *   **Parallelism & Divergence:** Identical subjects (tower, water, road, graves, people, divers) are revisited in each movement. The first lines of each movement mirror each other syntactically ("This tower..."). Movement II deliberately echoes Movement I's structure and meter. Movement III shatters this mirror: the meter becomes irregular, the tercet structure dissolves, the language shifts from measured description to harsh accusation ("broken bone," "jagged tooth," "profit’s cold behest," "bitter draft," "silted promises betrayed"). The abrupt ending without closure embodies the critical act's violence and refusal of easy resolution.
  *   **Embodied Modes, Not Explained:**
      *   **Movement I (Monumental):** Focuses on the tower's enduring power ("defiant needle," "proof," "monument"), the "challenge" of the road, the "vital gain" of the water, the "legacy" of the displaced. Suffering is acknowledged ("sacrifice") but framed as necessary for a greater, inspiring purpose. The refrain is an invitation to participate in this grandeur.
      *   **Movement II (Antiquarian):** Focuses on preservation ("holds fast," "tend," "save," "ledger," "known and mapped," "faithful cup," "stories we perceive"). Details are catalogued ("contours," "silt," "names," "dates," "ripple," "bone"). The tone is pious, reverent, and focused on continuity. The refrain emphasizes custodianship.
      *   **Movement III (Critical):** Focuses on the violence, loss, and injustice underlying the scene ("broken bone," "jagged tooth," "profit’s cold behest," "rotting," "fools," "tainted," "bitter draft," "silted promises," "uprooted," "silenced hearths"). The water is no longer vital or faithful, but tainted. The displacement is framed as an act of power ("law that drowned their world"). The refrain becomes an indictment of the previous perspectives' inadequacy and complicity, literally breaking down.
  *   **Seduction & Sickness:** Each mode is presented compellingly on its own terms. Monumental inspires awe; Antiquarian offers comforting continuity; Critical delivers searing truth. Their sicknesses emerge implicitly: Monumental's blindness to the cost ("sacrifice... vital gain"); Antiquarian's potentially stifling focus on preservation over life ("watched by wave and stone"); Critical's destructive, unresolved harshness (the fragmented ending).
  *   **Liberties with Nietzsche:**
      *   **Concreteness:** Nietzsche's modes are abstract historical attitudes. The poem incarnates them in specific, sensory details of one event.
      *   **Simultaneity:** While Nietzsche discusses the *dominance* of a mode causing sickness, the poem presents them as distinct, sequential lenses applied to the same object, emphasizing their radically different interpretations. The fragmentation in III visually represents the critical mode *shattering* the previous monolithic views.
      *   **Moral Weight:** Though avoiding explicit "correctness," the visceral impact of Movement III and its broken form inevitably carries significant weight. The indictment ("profit’s cold behest," "law that drowned") leans towards a reading where critical judgment exposes fundamental injustice inherent in the monumental/antiquarian views of *this specific* event, aligning with interpretations emphasizing Nietzsche's critique of power dynamics in history. The poem doesn't offer a "fourth way" beyond the critical rupture, staying true to the request for an unresolved ending.
