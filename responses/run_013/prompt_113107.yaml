  Breaking form in the third part means varying meter and fragmenting lines. I'll end abruptly after the refrain fails to complete. The note should explain formal choices and how Nietzsche's sicknesses manifest—monumental's blindness to suffering, antiquarian's stifling grip, critical's necessary violence. I'll admit liberties, like blending relocation trauma with Nietzsche's critiques of modernity.

