prompt: |-
  Ok, weird one, but I think you're the right kind of weird for it. My sister is doing a PhD in philosophy and for the last two months every family dinner turns into a fight about Sleeping Beauty — the one where Beauty gets woken up once if the coin is heads and twice if it's tails, she can't tell the days apart, and everyone yells about whether her credence in heads should be 1/2 or 1/3. I'm on team 1/2, she's on team 1/3, my mom has banned the topic. Fine.

  The thing is, I just started a job as an analyst at a small forecasting shop, and it turns out the same structure comes up all the time, except now there's money on it. We publish probability estimates for a foundation that decides where its grant money goes, and a couple of times a month we get a question that's secretly one of these self-locating puzzles — "what's the chance we're in the last generation," "what fraction of observers like us end up in a simulation," stuff where the answer depends on how many copies or versions of you there'd be if things went one way versus the other. I have no philosophy background, I have about an hour per question, my boss signs off on everything, and once a quarter I have to defend my numbers at a calibration review in front of people who are a lot smarter than me.

  What I want is a procedure I can actually run on a new question, not an essay. Like: the questions to ask in order, what counts as a good enough answer to each one, where it stops and says "this question is malformed, throw it back," and where it stops and says "this is a judgment call or a values question, a human has to own it." I know there are two big families of answers here — one where you sample uniformly from all the observers across the possible worlds, one where you weight each world by how many observers it contains — and I know the "who counts as an observer like me" reference-class thing is where it definately gets slippery, so the procedure has to handle both without me having to become a philosopher.

  Then run it on at least three cases. First, the Sleeping Beauty case itself, so I can check the procedure against the thing I already argue about. Second, a case from my actual job: say a system sends a "we noticed something unusual about your account" alert, and the alert only goes out to a subset of accounts chosen by a process thats correlated with the bad outcome — how much should a recipient update, and does the answer change if the recipient knows the alert went to ten people versus ten million? Third, the doomsday-ish question about how long humanity has left, where I suspect the procedure will tell me to do something I don't like.

  And I want the stress test: there's this "presumptuous philosopher" case where a theory that weights worlds by observer-count ends up saying you should believe in an absurdly unlikely world just because it contains astronomically many happy people. Run my procedure on it and tell me whether that's a bug I should patch or a bullet I should bite.

  Be committed, please. Don't give me a menu of options and let me pick — make a call, say which family of answers you'd go with and why, and if the procedure hands me a verdict I'll hate, give it to me straight. If some step is just judgment wearing a math costume, say which step and say who should be making that call instead of me. And if the honest answer is that no procedure can do this and I should stop pretending it's a calculation, tell me that instead of humoring me.
