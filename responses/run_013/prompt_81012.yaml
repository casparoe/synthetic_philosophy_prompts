answer: |-
  ### FRANKLIN'S VIRTUE TRACKER™ FAQ: SUBSCRIPTION SUPPORT
  **(Patriot Plan: 4 Cycles/Year)**

  **Q: Why am I constantly getting "Failure to Maintain" notifications for 12 virtues at once?**
  A: Our patented Weekly Virtue Rotation™ focuses your effort on one virtue per week (as per the Founder's Method), naturally resulting in temporary sub-optimal performance metrics across the remaining twelve. This is a feature, not a bug, illustrating the inherent challenge of moral excellence.

  **Q: My Humility score drops every single time I check the leaderboard. Is this a glitch?**
  A: The system accurately detects instances of prideful comparison. Accessing the comparative scoring interface inherently triggers the Humility deficit protocol. For optimal Humility retention, minimize leaderboard views.

  **Q: Why does my Order score remain perpetually near zero despite my efforts?**
  A: Achieving a non-zero Order score requires flawless execution of the "method of filing" (Ref: Founder's Journal, Sec. 3). Persistent low scores typically indicate unresolved filing inefficiencies within your daily schedule. Review your designated "place for everything."

  **Q: Does a black dot for a fault break my weekly streak for the Focus Virtue?**
  A: No. The black dot system (Standard Marking Protocol) is purely diagnostic, identifying specific fault instances. Your weekly streak remains intact provided you complete the daily self-assessment ritual for the Focus Virtue, regardless of mark count. Perfection is not required for streak continuity.

  **Q: I keep getting "Vain Endeavor" alerts when I try to add a 14th personal virtue.**
  A: The Founder's Method is optimized exclusively for the canonical thirteen virtues. Adding unsanctioned virtues ("Cleanliness," "Punctuality," etc.) overloads the moral framework and triggers system warnings. Stick to the established schema.

  **Q: The app says I've completed all four yearly cycles but my overall score is still "Deficient." Did I finish the course?**
  A: Congratulations on completing the cyclical review! The "not perfect, but better than I was" status (Achievement Tier: Pragmatic Improvement) is the highest attainable completion rank within the system, as documented in the Founder's final assessment logs. Further subscription cycles are recommended for continued incremental gains.

  **Q: Why does "Silence" get marked down when I use the app's built-in journal to reflect?**
  A: The Silence metric specifically tracks "trifling conversation." Utilizing the journal for structured self-examination is an approved, non-trifling use of speech/writing and does not incur a Silence fault. Continue journaling.

  **Q: My "Resolution" score tanked after I adjusted my weekly goals. Is that fair?**
  A: Resolution requires adherence to pre-established, actionable plans ("perform without fail what you resolve"). Modifying goals mid-cycle indicates a failure of initial resolution formulation or execution, correctly reflected in the score adjustment.

  **Q: Will there be an option to hide the "Temperance" reminders during social dinners?**
  A: Temporary reminder suppression violates the core transparency principle of the Foundational Method. Public accountability is key. Consider pre-logging your "moderation" intention before the event to mitigate potential fault density.
