answer: |-
  ## Presidential Address to the Joint Session of the Legislature  
  **14 October | The Sixtieth Anniversary of the Last Removal**

  Members of the Legislature, Justices, Distinguished Guests, Fellow Citizens,

  Today, we gather in this chamber, bound by history. We gather on ground marked by profound injustice. We gather with survivors among us. To those members of the [Community Name] community here in the gallery, and those watching across the nation: we see you. We acknowledge your presence, your endurance, and the weight you carry into this room.

  Sixty years ago today, the last child was taken. Between 1938 and 1967, agencies of this state systematically removed approximately fourteen thousand children – children of the [Community Name] community – from their families and their world. They were taken on a theory. A theory that deemed their language inadequate, their way of life unfit, their very heritage an obstacle to a modernity defined by the majority. This theory was wrong. It was cruel. It was a betrayal of the most fundamental duty any state holds: to protect its children, and to respect the dignity of its people.

  For six years, a Commission of Inquiry meticulously documented this history. It listened to survivors, examined records, and laid bare the devastating truth. Children were severed from their mothers’ arms, their fathers’ guidance, their grandparents’ stories, their siblings’ bond. They were placed in institutions or with families of the majority, often forbidden to speak their language, punished for practicing their culture, severed from the roots that nurture identity and belonging. The harm inflicted was not fleeting. It echoed through generations. Families shattered. A language endangered. A culture scarred. Lives irrevocably altered. The Commission stated it plainly: this was wrong.

  The state enacted this policy. The state enforced this suffering. The state bears responsibility.

  Today, we confront that responsibility. Not as the individuals who carried out those removals – they are gone. Not as the architects of that harmful theory – they are gone. But as the current representatives of the state – the enduring institution that inflicted this harm. The state is continuous. Its obligations transcend generations. When the state commits injustice, even under a previous constitutional order, the duty to acknowledge it, to address its consequences, and to ensure it never happens again, falls to those who hold its power *now*.

  Therefore, today, I speak for the state.

  **We acknowledge the truth:** The forced removal of [Community Name] children was a deliberate act of state policy. It happened. It was extensive. It was devastating.

  **We declare the wrong:** This policy was not merely misguided; it was a profound injustice. It violated the inherent dignity of children and parents. It assaulted the fabric of the [Community Name] community. It was an abuse of state power. It was morally indefensible.

  **We accept responsibility:** The state is responsible for the harm it directly caused. The state is responsible for the enduring consequences of that harm – the intergenerational trauma, the loss of language and cultural connection, the fractured families that persist to this day. This responsibility does not fade with time. We inherit it, and we must act upon it.

  **And so, the state apologizes.**

  To the survivors: We apologize for the childhood stolen from you. We apologize for the love and security you were denied. We apologize for the deliberate severing of your connection to family, language, and culture. We apologize for the loneliness, the fear, and the confusion inflicted upon you by the state that was supposed to protect you.

  To the families of the removed: We apologize for the unbearable grief and helplessness you endured. We apologize for the silencing of your voices, the disregard for your rights as parents, grandparents, siblings, and community. We apologize for the rupture inflicted upon your homes and your heritage.

  To the [Community Name] community: We apologize for the state’s assault on your identity, your language, and your way of life. We apologize for the arrogance that deemed your existence unfit. We apologize for the generations of pain and loss this policy inflicted upon your people.

  This apology is not conditional. It is not passive. It is not for your feelings – it is for the state’s actions. The state did this. The state was wrong. The state apologizes. We offer this apology not to claim credit for remorse, but to fully own the truth of what was done.

  Acknowledgement, responsibility, and apology demand action. They demand repair.

  Immediately following this address, I will sign into law the framework for reparations recommended by the Commission of Inquiry and passed by this legislature. This framework is not an end. It is a foundation. It represents the state’s formal commitment to addressing the tangible, ongoing consequences of the removals. It will support healing, cultural revitalization, language preservation, family reunification efforts, and the well-being of survivors and their descendants. We will implement it with diligence, transparency, and in ongoing partnership with the [Community Name] community.

  Let me be unequivocal: **This reparations framework does not extinguish the legal claims of individuals.** It is not a settlement imposed. It is an act of responsibility undertaken by the state. The path to justice may take many forms, and the state’s commitment to addressing the legacy of these wrongs does not close any doors to legal recourse individuals may pursue.

  There will be those who say: "Why apologize? We did not do this." To them I say: We are not apologizing for the sins of our fathers as individuals. We are apologizing for the actions of the state we now represent. We are accepting the duty that falls to us, *now*, to confront the state’s past and to repair its enduring damage. To ignore this duty is to be complicit in the injustice by denying its reality and its consequences. It is to abandon our responsibility to build a state worthy of its people.

  There will be those who see only cost. To them I say: The true cost is measured in the generations of suffering inflicted. The cost of repair is the necessary price of justice, and the investment in a shared future where such crimes are unthinkable.

  To the Chair of the [Community Name] Community Council, and to all who share her view: I hear you. You seek not just words of a past we did not enact, but the concrete actions of the present state to redress the wrongs it inherited. This apology is not a substitute for those actions. It is the necessary moral foundation upon which those actions are built. It is the state looking you in the eye, acknowledging the truth it perpetrated, and declaring its obligation to you. The reparations framework, signed today, is the first substantive step in fulfilling that obligation. It is a commitment to *doing*.

  Fellow citizens, this is not only about the past. It is about who we are now, and who we choose to be. A nation cannot build a just future on unacknowledged injustice. By confronting this painful history with honesty, by accepting responsibility, by apologizing without reservation, and by committing to meaningful repair, we affirm our shared humanity. We declare that every child, every family, every community, has inherent worth and dignity that the state must honor and protect. We say to the [Community Name] community: your language is a treasure. Your culture is vital. Your place in this nation is fundamental and respected.

  The work of repair is long. It requires sustained effort, humility, and partnership. Today is a significant step. A step of truth. A step of responsibility. A step of apology. A step of action.

  To the survivors: Your courage in speaking your truth made this day possible. We honor your resilience. We offer this apology, and this commitment to repair, as a solemn pledge to you, to your descendants, and to the future of this nation.

  Thank you.
