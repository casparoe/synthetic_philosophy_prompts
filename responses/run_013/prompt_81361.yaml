  - Inside view as fixed effects: The user's specific story is like having strong priors or fixed effects without pooling. But in stats, you'd need to justify why not to pool, perhaps via model selection.

  Where the translation distorts:
  - Exchangeability: The rationalist outside view assumes exchangeability by default, but stats requires testing it. If groups aren't exchangeable, pooling introduces bias. The user's case highlights this—their group might not fit the reference class.
  - Model uncertainty: Stats uses model selection/averaging based on predictive performance, but the inside view involves narrative reasoning that's harder to quantify. The rationalist emphasis on motivated reasoning isn't directly addressed in the model; it's about priors over models.

  In the reading group example:
  - Outside view: Use group data with shrinkage, but if the reference class is poor (high variance, non-exchangeable), this could be worse.
  - Inside view: Their specific knowledge might justify a separate model. The stats approach would compare models via WAIC or cross-validation, but the user's narrative might not fit into a likelihood function.

  The key residue is the inability of hierarchical models to adjudicate between model classes without data. The inside view's narrative reasoning and concerns about motivated reasoning are external to the model. Epistemic modesty in rationalism is a norm to counter bias, while in stats, it's a tool for prediction accuracy.

  Defect or lack of substance? The residue is a defect because stats doesn't handle model-class uncertainty well. The original distinction involves qualitative judgment about which model to trust, which stats translates to empirical evaluation but only post-hoc.

