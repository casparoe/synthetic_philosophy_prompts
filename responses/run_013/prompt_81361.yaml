answer: |-
  **Bottom line: The residue reveals a defect in the statistical vocabulary’s ability to formalize model-class uncertainty and the normative force of epistemic modesty, making the rationalist framing substantively distinct.**

  ### Translation of Inside/Outside View to Hierarchical Bayesian Terms  
  - **Outside view**: Equivalent to specifying a *hierarchical model* with your reading group as a unit in a reference class (grouping variable). The class mean is the *hyperprior*, and partial pooling shrinks your group’s estimate toward it via *shrinkage*.  
  - **Inside view**: A *saturated model* (no pooling) or a *separate model class* with fixed effects informed by idiosyncratic evidence. Your "specific story" is a *strongly informed prior* over parameters, rejecting exchangeability.  
  - **Epistemic modesty**: The practice of preferring hierarchical models (partial pooling) over saturated models to minimize *out-of-sample prediction error* via the *bias-variance tradeoff*. Shrinkage reduces variance at the cost of bias, acting as regularization.  

  ### Residue Report: What Survives, Distorts, or Vanishes  
  1. **Clean survival**:  
     - Shrinking toward the reference class mean *is* partial pooling.  
     - The outside view’s core mechanics map directly to hierarchical estimation.  

  2. **Survival with distortion**:  
     - **Exchangeability claims**: Rationalists treat reference classes as *default* outside views. Statistics demands *testing* exchangeability (e.g., posterior predictive checks). If your group is non-exchangeable (e.g., hyperprior variance is large, or your covariates differ), pooling *increases* bias. The rationalist "probably motivated reasoning" critique becomes a *model misspecification warning*—but statistics lacks a formal way to validate qualitative "non-exchangeability" claims pre-data.  
       *→ Distortion direction: Statistics is more agnostic; rationalism overstates the default rationality of arbitrary reference classes.*  
     - **Epistemic modesty**: In statistics, modesty is *optimal* only when hierarchical models improve predictive accuracy (e.g., via WAIC/LOO-CV). It’s not a moral virtue but a tool to avoid overfitting. The rationalist norm ("your inside view is probably wrong") becomes a *heuristic for model selection*, not an axiom.  
       *→ Distortion direction: Rationalism moralizes modesty; statistics reduces it to a performance metric.*  

  3. **No counterpart**:  
     - **Model-class uncertainty**: Your dilemma—whether to use the reference class or your inside-view model—is *model selection/averaging*. But statistics offers no objective way to choose *which model class is right* without data. The inside view’s "story" is a *qualitative prior over models*, which hierarchical Bayes doesn’t formalize.  
     - **Motivated reasoning**: Statistics has no equivalent for "suspect your own narrative." It can only suggest *weaker priors* or *model averaging*, but this addresses uncertainty, not bias from psychological factors.  
     - **Normative force**: The rationalist claim that "you *should* distrust special-case narratives" has no statistical analog. Hierarchical models *assume* exchangeability; they don’t *prescribe* it as epistemically virtuous.  

  ### Concrete Case: Your Reading Group Forecast  
  - **Statistical advice**:  
    - Fit a hierarchical model (e.g., log-normal survival). If the reference class variance is high, your posterior will barely shrink toward the mean.  
    - Test exchangeability: If your group’s features (e.g., "founders’ commitments") predict survival in other groups, add them as covariates. If not, your inside view *is* likely noise.  
    - Compare models: Compute LOO-CV for the hierarchical vs. a saturated model using your narrative. If the hierarchical model predicts better, discard the inside view.  
  - **Rationalist advice**: "You’re probably biased" is a warning to *default to the model with better empirical track records* (e.g., base rates). But it ignores that your group may be legitimately non-exchangeable.  

  ### Verdict on the Residue  
  The residue—**uncertainty in choosing model classes and the normative push for modesty**—is a **defect of the statistical vocabulary**. Hierarchical Bayes operationalizes the outside view *given a model*, but:  
  - It cannot adjudicate whether your inside-view narrative justifies a *different model class* without empirical testing.  
  - It replaces epistemic modesty with *predictive optimality*, which fails when reference classes are poor (e.g., high hyperprior variance).  
  The distinction *is* substantive: rationalism addresses *how to choose priors over models* under uncertainty; statistics addresses *inference within a model*.  

  ### What Would Change My Verdict  
  - **If model-class uncertainty were formalizable**: If Bayesian nonparametrics or meta-priors could objectively weigh "your story" against reference classes (e.g., a prior over hyperpriors), the residue would shrink. Currently, they can’t.  
  - **If epistemic modesty were derivable**: If hierarchical models *proved* that modesty minimizes error *even under model uncertainty*, the norm would reduce to statistics. But they don’t—poor reference classes make modesty harmful.  
  - **Critical flaw in my reasoning**: I assume "non-exchangeability" claims (like your reading group story) are sometimes valid. If all such claims are *always* self-deception, rationalism collapses into "always pool," making the distinction trivial. Your case—where covariates might exist but lack data—tests this.  

  **Final note**: In your reading group forecast, the statistical move is to *model average*: assign a prior probability to the hierarchical vs. inside-view model (e.g., 70% base rate vs. 30% your story), then blend predictions. But the choice of weights? That’s where the residue lives—and where epistemology bites back.
