prompt: |-
  I'm a philosopher by trade, and through a combination of guilt and bad luck I've ended up on the board of our neighborhood association — about 400 households, a shared well, two aging boilers, and a drainage problem that floods the four lots at the bottom of the hill every spring. There's a proposal on the table from a retired engineer who also sits on the board, and I have to vote on it next week, and I keep flip-flopping, so I'd like help thinking it through.

  Here's the scheme. For any decision the board agrees is "technical" — repair vs. replace the boiler, which contractor's bid to take, whether the drainage plan will actually fix the lower lots — a five-person volunteer panel would first make a recomendation, and if the panel is unamimous the board would be bound by it. Anyone can volunteer for any panel. The engineer's pitch is that this is just obvious: people who know about drainage should decide about drainage, and it's absurd that his vote counts the same as someone who's never opened the manual. He also floated, half-jokingly, that we could give every board member a "competence score" at the start of each year, assigned by the other members, and weight votes by it. I asked who scores the scorers and he laughed, which I did not find reassuring. Two things nag at me. First, the people who actually volunteer for these panels are almost all retired, home during the day, and (I say this as one of them) fairly comfortable; the younger families who'd eat most of the special-assessment cost basically never show up. Second, and this is the part that really gets me: I'm perfectly happy for a panel of experts to decide the boiler, and I would be furious if some panel decided whether we're allowed to put up a sign or fly a flag. I can't tell whether that's a principled line or just me liking the outcome on one and not the other.

  I teach this area, so I know the usual moves, and knowing them has not helped me one bit. What I want from you is the part I keep failing to see. Put on your political-philosophy hat — imagine someone who's spent a career on the question of who should decide what, and who's good at catching the moment when an argument about "better decisions" quietly turns into an argument about something else. Before you commit to a position, brainstorm out loud: lay out the competing considerations, say which ones actually bear on this proposal and which are window dressing, and tell me whether the boiler/sign distinction can be drawn on principle or only by taste. Then give me a straight recommendation on how to vote, with your confidence level, and name the one consideration that would flip you. Don't worry about citing literature or name-dropping famous positions — I care about the reasoning, not the reading list.
reasoning: |-
  Okay, let me tackle this philosopher's neighborhood board dilemma. The user is stuck on a proposal for technical decision-making panels and needs help thinking through the principles. 

  First, I need to unpack why this is philosophically juicy. On surface it's about efficiency - letting experts decide boilers makes sense. But the user's discomfort reveals deeper tensions: democratic equality versus epistemic authority, procedural fairness versus outcome quality. 

  The boiler/sign distinction feels intuitive but needs examination. What's the actual difference? Technical complexity? Consequences? Or just emotional resonance? Signs are identity-laden while boilers are utilitarian. That might be the real divider - when decisions carry symbolic weight, democracy feels non-negotiable.

  Then there's the participation problem. Retired folks dominating panels isn't just unfair - it creates blind spots. The families paying assessments have different risk tolerances. The engineer's competence score idea collapses under its own weight. Who guards the guardians indeed.

  The panel proposal's unanimous requirement is interesting. It forces consensus among self-selected experts, but also creates veto power. And what defines "technical"? That classification power itself becomes political. The drainage decision affects specific households disproportionately - is that still purely technical?

  My recommendation crystallizes around two points: The current proposal fails the "sign test" - if you wouldn't accept it for symbolic decisions, the principle isn't sound. And the participation gap undermines legitimacy. But rejecting it outright misses the real need for expertise. 

  So counterproposal: Keep panels advisory, add participation incentives like childcare during meetings, and require impact statements for technical decisions affecting specific groups. This addresses the engineer's valid concern while keeping democratic accountability.

  The user's self-awareness is impressive - recognizing their own outcome-preference bias. That's the mark of a true philosopher. The flip-flopping makes sense because this sits at the collision point of three values: expertise, equality and efficacy. No perfect solution exists, only least-bad tradeoffs.
answer: |-
  You've hit the nerve of the tension between epistocracy and democracy in microcosm – and your self-awareness about outcome preference is key. Let's dissect this without jargon.

  ### The Competing Considerations (Stripped to Bone)
  1.  **Epistemic Efficiency:** The core argument. Some decisions (boiler specs, drainage engineering) have objectively better answers grounded in technical knowledge. Ignoring expertise risks costly errors, safety hazards, and wasted funds. *Bearing? High. This is the proposal's engine.*
  2.  **Procedural Legitimacy:** Decisions bind everyone. Those affected deserve a voice, or at least confidence the process was fair. Expertise-based systems can feel exclusionary, breeding resentment and non-compliance. *Bearing? Critical. The participation gap you note undermines this.*
  3.  **Distributive Justice:** Decisions have unequal impacts (e.g., flooding on lower lots, special assessments on young families). Fairness demands these voices aren't drowned out by unaccountable panels. *Bearing? High. The panel's demographic skew risks systematic bias.*
  4.  **Feasibility & Practicality:** Can "technical" be cleanly defined? Who decides *that*? Unanimity is a high bar – is it achievable, or will it paralyze? Self-selection guarantees uneven participation. *Bearing? Significant. The "who scores the scorers" problem applies here too.*
  5.  **The "Sign vs. Boiler" Distinction:** This is the crux. Why does one feel right and the other wrong?
      *   **Principled Lines (Potential):**
          *   **Impact Type:** Boiler = shared, material, safety-critical harm. Sign = symbolic, expressive, identity-related harm.
          *   **Domain Specificity:** Boiler = requires specialized, verifiable knowledge. Sign = involves contested community values, not technical facts.
          *   **Delegatability:** We routinely delegate technical safety/health decisions (building inspectors, engineers sign off). We resist delegating expressive/symbolic choices.
      *   **Taste/Outcome Preference?:** Absolutely possible. You likely *value* expressive freedom more highly than boiler efficiency *in the context of community governance*, making delegation on the former feel like an illegitimate surrender of self-rule. The reverse feels like prudent outsourcing. The *intensity* of your reaction reveals the values at stake.

  **Window Dressing:** The competence score idea. It's a distraction – unworkable, circular, and highlights the fatal flaw in pure epistocracy: defining and measuring "competence" for governance is itself a political act, not a technical one.

  ### Can the Boiler/Sign Line Be Drawn on Principle?
  **Yes, but imperfectly and contextually.** The clearest principle is: **Delegation is more legitimate when (1) The decision hinges primarily on non-contestable, specialized expertise *and* (2) The primary risks of error are material/safety-related *and* (3) The impact is broadly shared.** The boiler fits (needs engineering knowledge, risk is explosion/flooding/no heat, affects all). The sign fails (expertise? "Sign experts"? Risk is offense/disunity, impact is expressive/identity-based). The *drainage fix* is the grey area: technical expertise needed, but impact is highly unequal (those 4 lots). This exposes the flaw – defining "technical" ignores distributive consequences. Principle alone isn't enough; *impact analysis* is essential for delegation.

  ### Your Flip-Flopping Explained
  You're caught between:
  *   **Recognizing the Engineer's Truth:** On pure technical merit, his vote *should* count more for boilers.
  *   **Seeing the Democratic/Participatory Danger:** The proposed system institutionalizes the participation gap and risks alienating those bearing the costs.
  *   **Your Instincts:** Your visceral reaction to the "sign panel" reveals that delegation feels like an abdication of *sovereignty* on matters of identity/values, not just competence.

  ### Recommendation: Vote NO (Confidence: 85%)
  **Why?**
  1.  **It Fails Your Own Test:** If you wouldn't accept this panel deciding the sign (and you shouldn't), and you can't articulate a *principled, defensible, and administrable* line between "sign" and "boiler" *that everyone will accept*, the proposal is fundamentally unstable. The "technical" definition will be endlessly contested (is contractor choice *just* technical? Is drainage impact *just* technical?).
  2.  **It Exacerbates the Participation Gap:** Formalizing self-selected panels dominated by a specific demographic (retired, comfortable, available) gives their preferences disproportionate, *binding* power on decisions disproportionately impacting others (younger families, specific lot owners). This is a recipe for resentment and long-term dysfunction. Legitimacy crumbles.
  3.  **Unanimity is a Flawed Safeguard:** It sounds good ("only if experts agree!") but in practice, it can lead to:
      *   Lowest-common-denominator, overly cautious recommendations.
      *   Paralysis if one stubborn panelist disagrees.
      *   *Or* implicit pressure to conform, masking dissent.
  4.  **It Doesn't Actually Solve the Core Problem Efficiently:** You still need board time to set up panels, define questions, and deal with non-unanimous outcomes. A simpler solution exists.

  ### A Better Path (The Counter-Proposal)
  Propose this instead:
  1.  **Retain Full Board Authority:** All votes equal. Final responsibility stays democratically accountable.
  2.  **Mandate Robust Expert Consultation:** For technical decisions (defined broadly *by the board*), require the board to:
      *   Seek written opinions from qualified volunteers (including the engineer!) or paid consultants if needed.
      *   Hold a dedicated public meeting where experts present options/analysis and answer questions *before* the board deliberates/votes.
      *   Require the board to formally state *in the record* how expert input factored into their decision.
  3.  **Actively Address Participation:**
      *   **Targeted Outreach:** Specifically ask younger residents, those in flood zones, etc., for input on relevant issues. Offer virtual options.
      *   **"Impact Statements":** For decisions with concentrated impacts (like drainage), formally solicit written feedback from affected households.
      *   **Childcare/Schedule Sensitivity:** Hold some meetings/weekends/evenings to boost participation.

  **Why this works:** It leverages expertise *informatively* without surrendering democratic accountability. It forces the board to confront technical knowledge publicly. It directly tackles the participation gap instead of codifying it. It meets the engineer's valid concern (better decisions through expertise) without creating an unaccountable mini-legislature. It passes the "sign test" – consultation on a sign would be absurd, so you wouldn't do it, maintaining the distinction naturally.

  ### The Flip Factor (The 15% Doubt)
  The **one consideration that could flip me to a weak "Yes"**: If you have concrete evidence that *without binding delegation*, crucial technical expertise is consistently ignored by the board due to populism, stubbornness, or sheer ignorance, leading to demonstrably harmful, costly outcomes *that directly threaten community safety or financial solvency*. If the current process is truly broken *and* irredeemable through better consultation, then binding panels become a desperate necessity. But the burden of proof is very high, and the participation problem remains a severe downside. Your description suggests annoyance with amateur hour, not impending disaster. Avoid constitutional changes out of frustration.

  **In essence:** The engineer sees a knowledge problem and offers an epistocratic solution. You correctly see a deeper problem of democratic legitimacy, participation, and value sovereignty. His solution fixes the first at too high a cost to the others. Leverage expertise, don't enshrine it. Vote "No" and propose the consultation model. Good luck next week – may your boiler never explode!
