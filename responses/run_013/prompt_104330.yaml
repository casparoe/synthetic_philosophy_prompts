answer: |-
  Below is a residue report addressing your queries, structured to respect both your statistical-mechanical vocabulary and the nuances of quantum foundations. Key distinctions are marked, and the status of claims is explicitly flagged. Translations are attempted where possible, with distortions or failures noted. The ensemble interpretation's relation to psi-epistemic views is clarified in Section 5.

  ---

  ### **Residue Report: Quantum State Reality in Statistical Mechanical Terms**

  #### **1. Claims Translating Faithfully to Ensemble Language**
  - **Psi-Ontic Claim**: "The quantum state is a physical state of an individual system."  
    *Translation*: The wavefunction ψ is like a *microstate* in classical statistical mechanics (CSM). It is the fundamental description of a single system.  
    *Why it holds*: Just as a classical microstate (e.g., a point in phase space) objectively exists, ψ-ontologists argue ψ is irreducible and physically real. PBR theorem (2012) shows that distinct pure quantum states must correspond to non-overlapping distributions of underlying physical states (if such states exist), analogous to how distinct microstates occupy disjoint regions in phase space.  
    *Status*: Theorem is mathematically settled; interpretation is contested.

  - **Psi-Epistemic Claim**: "The quantum state represents knowledge about a system."  
    *Translation*: The wavefunction is like a *coarse-grained macrostate* (e.g., a probability distribution ρ over phase space), reflecting ignorance of an underlying physical state λ.  
    *Why it holds*: In both cases, the state (quantum or classical) is statistical and updates with measurement/information. Epistemic models treat quantum probabilities like Boltzmann probabilities—due to incomplete knowledge of λ.  
    *Status*: Conceptual analogy is common; formal constraints exist (see Section 2).

  #### **2. Where Translation Distorts**
  - **(a) "Epistemic" ≠ Statistical Ignorance**  
    Your suspicion is correct. In quantum foundations, "epistemic" means a single physical state λ can be compatible with *multiple* pure quantum states (e.g., a λ consistent with both |ψ⟩ and |ϕ⟩). In CSM, a microstate belongs to *one* macrostate (e.g., a phase-space point lies in one coarse-grained cell).  
    *Distortion*: Quantum "epistemicness" violates the classical 1:1 mapping between λ and the statistical state. PBR rules out models where λ is *preparation-independent* (i.e., λ cannot be shared by non-orthogonal states). This has no CSM analog—classical ignorance never implies a microstate belongs to multiple macrostates.  
    *Status*: PBR is settled; its implications for epistemic models are debated.

  - **(b) Convex Structure and Non-Uniqueness**  
    *Quantum issue*: Mixed states admit infinitely many decompositions (e.g., ρ = ∑ₚᵢ|ψᵢ⟩⟨ψᵢ| = ∑qⱼ|ϕⱼ⟩⟨ϕⱼ|). No "canonical" underlying support exists.  
    *CSM analog*: A coarse-grained ρ can be decomposed in multiple ways (e.g., via different partitions), but the underlying microstate is unique and determines the "true" decomposition.  
    *Distortion*: In quantum theory, non-uniqueness is *ontological*—there is no "real" decomposition. In CSM, non-uniqueness is *epistemic* (arising from coarse-graining). Bell-Kochen-Specker contextuality exacerbates this: quantum outcomes depend on measurement context, unlike classical measurements that reveal pre-existing properties.

  #### **3. What Resists Translation**
  - **Contextuality**: Quantum measurements cannot be interpreted as revealing pre-existing properties (e.g., spin-x and spin-z cannot simultaneously exist for a particle). CSM has no counterpart—all observables commute and values are predetermined.  
    *Status*: Kochen-Specker theorem is settled; interpretation is uncontested but irreconcilable with ensemble realism.

  - **Information/Agency**: Claims that "the wavefunction is information" (e.g., in QBism) treat probabilities as *personal beliefs*, not objective frequencies. CSM probabilities are always frequentist or Bayesian but tied to physical states.  
    *Status*: QBism is a minority view; no consensus.

  - **Completeness**: The question "Is QM complete?" asks if ψ captures *all* physical reality. Ensemble language assumes a completedescription—this smuggles in classical premises (see Section 4).

  #### **4. The Smuggled Premise: Definite Microstates**
  - **The Premise**: Ensemble language assumes a *definite underlying microstate* λ, with statistics describing ignorance. Quantum theory lacks this.  
  - **Defect or Evidence?**  
    - *It’s a defect* for translating quantum phenomena: Contextuality and non-uniqueness show no λ can underlie quantum states classically.  
    - *But it reveals a substantive disagreement*: Psi-ontologists deny λ exists beyond ψ; epistemicists seek ψ-λ models (constrained by no-go theorems).  
    *Status*: The premise is *inapplicable* to quantum theory per no-go theorems (Bell, PBR). This is settled mathematically but ontologically contested.

  #### **5. Ensemble Interpretation vs. Psi-Epistemic Views**
  - **Ensemble Interpretation (EI)**: Treats ψ as describing a *statistical ensemble* of systems, not individuals. "Measurement" samples the ensemble.  
  - **Relation to Psi-Epistemic**:  
    - *Similarity*: Both reject ψ as a physical state of single systems.  
    - *Crucial Difference*: EI is *non-committal* about underlying states (λ). Psi-epistemic models *require* λ and a mapping ψ → prob(λ|ψ).  
    - *Why not the same?*  
      - EI avoids hidden variables—it’s "epistemic" only in a coarse-graining sense.  
      - Psi-epistemic models (e.g., de Broglie-Bohm) are often ψ-ontic for the *universal* wavefunction.  
      - PBR pressures epistemic models but not EI, as EI denies ψ describes individuals at all.  
    *Status*: EI is a distinct, minimalist position. Many view it as a retreat from realism about individuals.

  ---

  ### **Status Key**
  - **Settled**: Mathematically proven (e.g., PBR, Bell, Kochen-Specker).  
  - **Contested**: Interpretation/ontology debated (e.g., meaning of "epistemic").  
  - **Minority**: Non-mainstream views (e.g., QBism).  
  - **Irreconcilable**: No classical analog (e.g., contextuality).

  ### **Residue Summary**
  - **Transplantable**: Ensemble language works for *formal statistical structure* (states, measurements, probabilities).  
  - **Distorted**: "Epistemic" has narrower, non-classical constraints; convexity lacks a λ-backing.  
  - **Untranslatable**: Contextuality, agent-centric views, and completeness questions.  
  - **Smuggled Premise**: Definite λ is a category error for quantum theory—no-go theorems forbid it.  
  - **Ensemble View**: A third way, distinct from both camps by rejecting ontic/individual descriptions.

  **Final Note**: The dispute is substantive—your framework’s "innocent premise" (definite λ) is precisely what quantum no-go theorems challenge. Whether this invalidates ensemble language or reveals quantum novelty is the core philosophical tension.  

  *(This report synthesizes standard interpretations; reconstructions are flagged. Consensus exists on theorems but not ontology.)*
