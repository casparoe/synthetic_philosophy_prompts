answer: |-
  ### The Quality Alliance Game: Activity Design  
  **Goal:** Make students experience why honest signals require differential costs, how cheap talk fails, and why equal high costs make signals collapse—without lecturing.  

  ---

  #### **Game Setup**  
  **Materials:**  
  - 20 index cards (10 labeled "High", 10 labeled "Low" for hidden qualities).  
  - 100 tokens (poker chips, buttons, or candy as currency).  
  - 40 signal cards (20 "Cheap Talk" cards, 20 "Costly Signal" badges).  
  - Score sheets for tracking points.  
  - Timer.  

  **Roles & Rules:**  
  - Each student is an "Investor" with a **hidden quality** (High or Low, assigned via index card).  
  - **Goal:** Pair with a High-quality partner. Your points depend on your partner’s quality.  
  - **Payoff system (no real money):**  
    - Pair with High: **+15 points**  
    - Pair with Low: **+5 points**  
    - Unpaired: **0 points**  
    - Tokens convert to points at the end (**1 token = 1 point**).  
  - **Signaling actions:**  
    - **Cheap Talk:** Free claim (e.g., "I’m High!").  
    - **Costly Signal:** Spend tokens to buy a "High-Quality" badge.  
  - **Key twist:**  
    - **Round 1–3:** High-quality players start with **10 tokens**; Low-quality with **5 tokens**.  
    - **Round 4 (collapse):** All players get **15 tokens** (equal budget).  

  ---

  #### **Timeline (75 Minutes Total)**  
  **Round 1: Cheap Talk (15 min)**  
  - **Rules:**  
    - Students keep qualities hidden.  
    - They get 1 "Cheap Talk" card to write any claim (e.g., "I’m High!").  
    - No spending tokens.  
  - **Activity:**  
    - 3 min: Write claims.  
    - 5 min: Mingle, share claims, and form pairs.  
    - 2 min: Record pairs on score sheets.  
  - **Goal:** Experience worthless cheap talk.  

  **Round 2: Costly Signals (20 min)**  
  - **Rules:**  
    - Qualities remain hidden.  
    - High-quality: Start with 10 tokens. Low-quality: Start with 5 tokens.  
    - Costly Signal: Buy a "High-Quality" badge for **3 tokens**.  
    - Players can lie (e.g., Low-quality buys badge).  
  - **Activity:**  
    - 3 min: Decide whether to buy a badge.  
    - 5 min: Mingle (show badges only—no talking about quality).  
    - 5 min: Form pairs.  
    - 2 min: Record pairs/tokens.  
  - **Goal:** See costly signals become noisy (some Low-quality mimic).  

  **Round 3: Differential Cost (20 min)**  
  - **Rules:**  
    - Same tokens as Round 2.  
    - New Costly Signal: Buy badge for **8 tokens**.  
    - Players can still lie.  
  - **Activity:**  
    - 3 min: Decide to buy badge.  
    - 5 min: Mingle (badges only).  
    - 5 min: Form pairs.  
    - 2 min: Record.  
  - **Goal:** High-cost badges deter Low-quality (only High can afford), making signals honest.  

  **Round 4: Collapse (10 min)**  
  - **Rules:**  
    - **Twist:** All players reset to **15 tokens** (equal budget).  
    - Same badge cost: **8 tokens**.  
  - **Activity:**  
    - 2 min: Buy badges.  
    - 3 min: Mingle (badges only).  
    - 3 min: Form pairs.  
    - 2 min: Record.  
  - **Goal:** Signals collapse—everyone buys badges, so they convey nothing.  

  **Wrap-Up & Debrief (10 min)**  
  - Reveal hidden qualities and calculate points (partner quality + tokens).  
  - Award candy for top 3 scores.  

  ---

  ### **Debrief: Mapping Game → Concepts**  
  **Do not name concepts until debrief!** Ask questions to guide students to self-realize:  
  1. **Round 1 (Cheap Talk):**  
     - Ask: *"Did anyone believe the ‘I’m High’ claims? Why/why not?"*  
     - **Concept:** Cheap talk is free → easily faked → worthless.  
     - **Student realization:** "Everyone lied, so claims meant nothing!"  

  2. **Round 2 (Costly Signal):**  
     - Ask: *"Did the badge help identify High partners? Why did some Low-quality players buy it?"*  
     - **Concept:** Uniform cost (3 tokens) → Low-quality mimic High (if benefit > cost) → signal becomes noisy.  
     - **Student realization:** "Badges were unreliable because Low-quality could afford them too."  

  3. **Round 3 (Differential Cost):**  
     - Ask: *"Why did badges become trustworthy in Round 3? What stopped Low-quality players from buying them?"*  
     - **Concept:** High cost (8 tokens) + low budget for Low-quality → **differential cost** (too expensive for Low, affordable for High) → honest signal.  
     - **Student realization:** "Low-quality couldn’t afford the badge, so only High had them!"  

  4. **Round 4 (Collapse):**  
     - Ask: *"Why did badges become meaningless again in Round 4?"*  
     - **Concept:** Equal high cost + equal budgets → everyone signals → no information.  
     - **Student realization:** "We all bought badges, so they didn’t tell you who was *actually* High."  

  5. **Unfakeable Signals (Critical Add-on):**  
     - **What the game can’t show:** Signals that are impossible to fake (e.g., physical traits like real strength).  
     - **Explain post-game:** *"In nature, some signals (e.g., a lion’s roar) can’t be faked because they require underlying quality. Our game only showed ‘fakeable’ costly signals."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Students "play nice" and tell the truth.**  
     - **Why:** Moral hesitation or misunderstanding incentives.  
     - **Fix:** Emphasize pre-game: *"Your goal is to maximize points. Lying is allowed and part of the game!"* Use candy rewards to incentivize competition.  

  2. **Problem: Mingling chaos or slow pairing.**  
     - **Why:** 20 students negotiating pairs can get noisy.  
     - **Fix:** Use a timer with loud alerts. Assign "pairing zones" to avoid crowding.  

  3. **Problem: Token math confusion.**  
     - **Why:** Non-math majors may struggle.  
     - **Fix:** Use physical tokens (e.g., candy) and simplify: *"Tokens = points. Spending fewer tokens = more points."*  

  4. **Problem: Students ignore signals and pair randomly.**  
     - **Why:** If early rounds feel unfair, they may disengage.  
     - **Fix:** After Round 1, hint: *"Think about how to stand out as High-quality."* In Round 3, highlight: *"Notice who’s buying badges now."*  

  5. **Problem: Collapse round not obvious.**  
     - **Why:** If few buy badges, the collapse isn’t dramatic.  
     - **Fix:** In Round 4, whisper to 2–3 players: *"Psst—buy the badge to avoid looking Low."* This seeds mass adoption.  

  ---

  ### **Why This Works**  
  - **Differential cost viscerally felt:** Low-quality players run out of tokens in Round 3; High-quality don’t.  
  - **Collapse is student-driven:** They *choose* to flood the market with badges in Round 4.  
  - **No terms until debrief:** Students focus on "winning," not theory—making revelations organic.  
  - **Weakness:** The game can’t model **unfakeable signals** (e.g., real strength). You’ll need to explicitly add this post-game with examples (e.g., "A cheetah can’t fake speed; it either outruns prey or doesn’t").  

  **Final Tip:** Start with "Pair up to win points—go!" to hook them. End the debrief by linking to peacock tails: *"Why would a bird grow a heavy tail? Because only the healthiest can afford it."*
