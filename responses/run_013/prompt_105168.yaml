prompt: |-
  ok so I'm a phd student in philosophy (ethics side, with some metaethics) and I need a short story for a reading group I'm putting together. the point is that it should actually be *about* a concept, not just a fable with a moral taped onto the end.

  the concept is supererogation -- the acts that go beyond the call of duty, the heroic/saintly stuff thats praiseworthy but that nobody is actually required to do. giving a stranger a kidney, running into the fire, that kind of thing. the standard debate is whether the category is even coherent (if an act is morally better, why isnt it required?), and I really dont want the story to just rehearse that.

  here's the twist I want you to build it around, which I think is underexplored. supererogation might be self-erasing. the second somebody actually does the beyond-duty thing, it stops being beyond duty -- it becomes the new baseline, the thing everyone's now expected to do, and whoever doesnt do it afterward is a bit of a monster. so the act of being a hero destroys the very category that made them a hero. call it the precedent ratchet. I want a story where the protagonist did the original beyond-duty thing and then has to watch, over years, their voluntary act get converted into an obligation that falls on everyone else, and eventually keeps falling back on them, again and again, each time at a higher level. the drama should be: was what they did still good? should they not have done it? can you do a beyond-duty act *for the sake of* keeping the category alive, and does that even make sense, or does trying to preserve the category just turn it into a different kind of calculation? I'd like the ending to genuinely stay open rather than collapsing into "and so we should all lower our standards."

  length: maybe 1200-2000 words. third person, set it somewhere concrete and mundane -- a hospital ward, a small company, a village, a lab -- your pick, not a seminar room. the ideas should come through events and through what the characters argue with each other, not through a narrator explaining the philosophy. and please dont name-drop any philosophers or cite anything, just tell the story.
reasoning: |-
  Okay, the user is a PhD student in ethics, specifically metaethics, and they need a short story for their reading group centered on the concept of supererogation. They don't want a simple fable with a moral tacked on but a story that deeply explores the idea. The twist they're interested in is the "precedent ratchet" – how a supererogatory act, once performed, becomes the new norm, erasing its own status as beyond duty. 

  The user wants the story to focus on a protagonist who performs such an act and then watches it become an obligation for others, eventually cycling back to them with escalating demands. Key questions should remain open: Was the original act still good? Should they not have done it? Can one act supererogatorily to preserve the category itself? The ending shouldn't default to lowering standards. 

  Practical constraints: 1200-2000 words, third person, mundane setting (hospital, company, village, etc.), no philosophical name-dropping, ideas conveyed through action and dialogue. 

  I need to craft a story that embodies these ideas without exposition. A hospital ward feels right – high stakes, clear hierarchies, and natural opportunities for escalating sacrifice (time, comfort, personal boundaries). The protagonist, Dr. Aris Thorne, will donate bone marrow anonymously, setting the precedent. Then colleagues start expecting similar sacrifices: overtime, holiday coverage, even organ donation. The ratchet effect should feel inevitable, almost mechanical. 

  The conflict peaks when Aris is asked to donate a kidney, mirroring their initial act but now as an expectation. The story’s tension hinges on their internal struggle: refuse and seem hypocritical, or comply and fuel the cycle. Secondary characters (Maya, the pragmatic resident; Patel, the guilt-tripping administrator) will voice competing perspectives. 

  Ending ambiguously is crucial. Aris’s final decision isn’t shown, but the narrative lingers on the weight of the question: Is preserving the *idea* of going beyond duty worth surrendering to its erosion? The hospital’s fluorescent lights and beeping monitors will underscore the cold, systemic nature of moral creep. 

  Key symbols: 
  - The "beyond duty" sign originally celebrating Aris’s anonymity, later repurposed to shame others. 
  - The gift basket from the marrow recipient, now a relic of genuine gratitude, contrasting with transactional demands. 

  Dialogue must feel organic. No philosophical jargon – just raw, human rationalizations. When Maya snaps, "You broke the scale," it distills the core dilemma. Patel’s bureaucratic language ("benchmark for dedication") masks moral coercion. 

  This approach meets all requirements while leaving the central paradox unresolved, inviting discussion rather than prescribing answers.
answer: |-
  ## The Precedent Ratchet

  The fluorescents hummed like trapped insects above Ward 7. Dr. Aris Thorne rubbed his tired eyes, the scent of antiseptic and stale coffee a permanent fixture in his sinuses. Five years ago, fresh out of residency and burning with a quiet idealism, he’d done the thing. Not for glory, barely even for the patient – a stranger, a name on a bone marrow registry list. He’d done it because it *felt* like the absolute peak of what medicine *could* be, a pure, unasked-for gift.

  Donating marrow wasn't minor surgery. It hurt. It meant weeks of fatigue, a vulnerability he hadn't anticipated. He’d requested anonymity. The hospital administration, however, smelling a PR opportunity wrapped in genuine human triumph, had gently pressured him. "Dr. Thorne, it *inspires*," Administrator Patel had said, her voice smooth as polished vinyl. "Think of the morale boost. Think of the *example*."

  So, he’d relented. A small photo in the staff newsletter, a headline: "Beyond the Call: Dr. Thorne’s Quiet Gift." A laminated sign appeared in the break room: "Excellence is Our Minimum. We Strive for the Beyond-Duty Standard." Aris hadn't chosen the wording. He’d winced when he first saw it.

  The shift was subtle at first. When young Dr. Evans balked at covering a third consecutive holiday shift, the Chief Resident, Maya, sighed. "Come on, Evans. Remember Thorne? He gave *bone marrow*. A few extra hours is nothing." Evans, chastened, agreed. Aris overheard, a knot tightening in his stomach. His marrow wasn’t overtime. Was it?

  Then came Patel’s initiative: the "Beyond Duty Bonus." It wasn’t a bonus in money, but in elusive "recognition points" redeemable for… slightly better parking? The criteria were vague: "Exceptional commitment," "Going the extra mile." Suddenly, residents were competing to stay latest, take on the most complex cases without complaint. The baseline expectation wasn’t competence and care anymore; it was exhaustion as a badge of honour. Aris watched Maya, sharp and brilliant, hollow out under the pressure. She started skipping meals, her eyes perpetually shadowed. When she snapped at a nurse, Patel pulled her aside. "Dr. Chen, we expect a certain… resilience here. Remember the standard Dr. Thorne set."

  Aris found her later, staring blankly at a chart. "Maya, that was unfair. Patel shouldn’t have–"
  Maya cut him off, her voice flat. "It’s fine, Aris. You set the bar. We just have to reach it." There was no malice, only a weary acceptance that chilled him. His gift, meant to be an isolated peak, was now the plateau everyone was forced to live on.

  The ratchet turned again. When the hospital faced a critical nursing shortage, Patel announced the "Beyond Duty Volunteer Corps." Staff were "encouraged" to volunteer for extra shifts, framing it as embodying the hospital's core value. Refusal wasn't punished overtly, but the sidelong glances, the missed promotions whispered otherwise. Aris heard a veteran nurse, Brenda, mutter to a colleague, "Used to be 'above and beyond' meant *choosing* to help. Now choosing *not* to feels like failing."

  Years slid by. The "Beyond Duty" sign was faded but ubiquitous. Aris felt trapped by his own ghost. He’d done something extraordinary, and now the extraordinary was mundane, expected. He saw the exhaustion etched on faces, the resentment simmering beneath forced smiles. Was this better? Was the baseline higher, or just more punishing?

  The call came on a rainy Tuesday. Patel, her expression a mask of sympathetic gravity. "Aris, we need to talk. It’s about young Timothy Miller on Ward 4."

  Aris knew the case. Severe aplastic anemia. The bone marrow transplant list was long, the odds grim without a familial match. There wasn’t one.

  "A relative would be best," Patel continued, leaning forward. "But... there’s another option. A directed living donation." She paused, letting the implication hang. "We... well, the board feels that given our ethos, our commitment to the *Beyond Duty* principle... and given your unique history, demonstrating the profound impact such a gift can have..."

  Aris felt the room tilt. "You want me to donate... a kidney? To a child I don’t know?"

  "Not *want*, Aris," Patel corrected smoothly. "But we feel you are uniquely positioned to embody the spirit that defines St. Eligius. Your first act defined our standard. This... this would reaffirm it. Show everyone what true commitment looks like. Think of the precedent it reinforces!"

  The cold precision of her words struck him like ice water. *Reaffirm the standard. Reinforce the precedent.* His original act, a solitary leap into the moral unknown, had become a cog in a machine grinding everyone down. Donating a kidney *was* beyond duty. Incredibly so. But Patel wasn't asking him to do something heroic; she was asking him to *perform* heroism to maintain the very system that demanded it. To prop up the category of the supererogatory by feeding it his own flesh, again, turning the exceptional into the expected benchmark for others.

  He walked the corridors, haunted. He saw Maya, now a senior consultant, still working punishing hours, her eyes devoid of their old fire. He saw Brenda, the nurse, flinch when the "Volunteer Corps" schedule was posted. He saw the faded sign: "We Strive for the Beyond-Duty Standard."

  He found Maya in the doctors' lounge, staring out at the rain-lashed parking lot. "They asked me for a kidney," he said, the words raw.

  Maya didn’t look surprised. Just tired. "For Miller? Yeah. I heard whispers." She turned, her gaze sharp. "What are you going to do?"

  "I... I don't know. It feels monstrous to say no to a child. But..."
  "But it feels monstrous to say yes?" Maya finished. "Because it feeds the machine?"

  Aris nodded, the knot in his stomach tightening. "Was I wrong? That first time? Did I break something?"

  Maya sighed, a long, weary sound. "You did a good thing, Aris. A *great* thing. But good things... they get used. Patel saw a tool. A lever. She used your act to pry open everyone else’s limits. Now the gap you leapt across is just... the floor. And they want you to jump again to show everyone how high the *new* ceiling is." She gestured vaguely at the sign on the wall. "That 'beyond duty'? It’s a lie now. It’s just... duty. More duty. Always more."

  "So, I shouldn't do it? To... to stop the cycle? To preserve the idea that some things *should* be beyond demand?"

  Maya gave a bitter laugh. "Preserve it? How? By letting a kid die to make a philosophical point? That doesn't feel very 'beyond duty,' does it? It just feels... cold." She looked at him, her eyes searching his face. "Or maybe doing it *is* the only way to preserve the *act* itself – the pure gift, even if the category dies. Prove Patel wrong by doing it *despite* her, not *for* her system. Show them what a real gift looks like, untainted by expectation." She shook her head. "God, Aris, I don't know. That’s the trap, isn’t it? Whatever you do, it gets twisted. Say no, you're a hypocrite who set a standard he won't meet. Say yes, you crank the ratchet one more notch for everyone else."

  Aris stood by the window, watching the rain blur the streetlights below. Timothy Miller’s face, pale and hopeful from a chart photo, flashed in his mind. Then Patel’s calculating gaze. The faded sign. Brenda’s exhausted slump. Maya’s hollow eyes.

  The weight wasn't just the decision about a kidney. It was the crushing burden of his own past goodness, calcified into an obligation that now threatened to consume him and everyone around him. To act supererogatorily now felt impossible – not because he lacked courage, but because the very space for such an act seemed to have collapsed under the weight of his own precedent. Doing it felt like surrender to the ratchet. Not doing it felt like abandoning the very ideal he once embodied.

  He closed his eyes. The hum of the fluorescents was the only sound, a relentless, indifferent drone. He saw neither a clear path forward nor a comfortable retreat, only the suffocating ambiguity of a moral landscape reshaped, irrevocably, by the echo of his own sacrifice. The question hung, heavy and unresolved, in the sterile air: Could a gift ever truly be free, or was it always just the first payment on an infinite debt?
