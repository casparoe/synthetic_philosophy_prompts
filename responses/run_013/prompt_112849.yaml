prompt: |-
  I sit on my state's disability determination appeals board -- we hear cases where someone was denied long-term benefits at the initial level, and I have to circulate a written opinion before Thursday's hearing. I want to get the reasoning right, not just vote the way the regulation points, because this one is going to be cited by the next panel whether we like it or not. Here's the case. The statute says benefits go to people with a severe and lasting impairment that prevents substantial gainful activity. The department's regulation operationalizes that with a functional-capacity score: 35 or above counts as severe, 34 or below does not. The claimant scores 34. She has a degenerative condition, her doctors disagree about how fast it will progress, and she looks like exactly the kind of borderline case the score is supposed to settle. Our board can apply the 35 cutoff and deny, or read the word severe in the statute as doing real work and grant, or remand and tell the department its cutoff is arbitrary. I've been reading alot about two views of vagueness that seem to bear on this. One says vague terms like severe actually have sharp boundaries -- there is a fact of the matter whether she is severe, we just can't ever know where the line falls; I think that one is called epistemicism. The other says no, at the borderline the term is genuinely indeterminate: there are many equally admissible ways to make severe precise, and the regulation is just one of them, so drawing the line at 35 is not wrong and drawing it at 34 would not be wrong either; I think that one is supervaluationism. What I need from you is the opinion itself, written as continuous prose, no headings, no bullet points, no bold, no tables -- just the way you'd write a long email to the other board members. Give me a clear recommendation with a time frame, the reasoning, and the strongest case for the side I am rejecting, treated honestly. And tell me which of those two views my reasoning ends up committing me to, and whether that should bother me. Also, if the answer is that there is no fact of the matter here, does that mean the board is just making policy rather than finding facts, and is that okay? Dont cite cases or articles, I can't look them up and neither can you. Just reason it through.
