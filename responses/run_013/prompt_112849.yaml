  The strongest case for denial is straightforward: the regulation exists precisely to avoid subjective judgments in borderline cases. A 34 is not 35, period. But that feels unjust when medical evidence suggests inevitable deterioration. 

  What if we split the difference? Remand forces the department to confront the progression issue while preserving the board's role as interpreters rather than policymakers. The opinion should emphasize that "severe" requires looking at impairment duration, not just current severity. 

