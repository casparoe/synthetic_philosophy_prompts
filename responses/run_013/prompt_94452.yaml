  im putting together the what-would-an-adequate-theory-have-to-deliver section of a paper on higher-order theories of consciousness, and i keep catching myself smuggling in demands that only make sense if you already buy a first-order view. so i want the desiderata list specifically for the higher-order camp: a theory that says a mental state is conscious in virtue of being represented by a suitable higher-order state.

  give me the requirements, each with the case or consideration that motivates it — the dissociations it has to handle, the distinctions it can't collapse (creature-level vs state-level consciousness, the content of the higher-order state vs the state its about, being conscious vs being reportable), the empirical results it cant contradict. then the part i actually care about: which of these are real requirements and which are just prejudices of the first-order people, whether any subset of them can't be jointly satisfied, and which single requirement does the most to eliminate the candidates.

  one case you have to fold in, cause its what set this off: a person reports a vivid experience of something that, as far as anyone can tell, wasn't there — the low-level sensory areas are quiet, only the higher-order areas light up. i can't tell if a good higher-order theory should say they really are conscious of it, or whether that means the higher-order state needs an accuracy constraint. pin that down as a requirement.

  and dont hedge: take a definite position on which requirements are non-negotiable vs optional, and commit to a verdict on whether the higher-order program can actually meet the non-negotiable ones or gets killed by one of the tensions you flag. american english.
