answer: |-
  Right then, let’s get this started – properly warm, properly British, and properly focused on Keynes's fascinating, unresolved tension. Here we go:

  ---

  **(Setting: Clinking glasses soften. Speaker stands, perhaps taps a glass gently.)**

  Friends, colleagues, welcome. Truly lovely to see such a… *varied* gathering. Economists sharpening their pencils, humanities folk looking suitably thoughtful – probably wondering, like me, how exactly we snuck onto the guest list! But there we are. We’re here for two days to talk about working time – not just the hours on the clock, but the politics, the meaning, the sheer *weight* of it in our lives. And to kick us off, I’ve been handed the rather large question: **"What was Keynes actually promising us?"**

  Now, we all know the headline, don’t we? 1930. *Economic Possibilities for our Grandchildren*. The fifteen-hour week! Economic problem solved by about now! Freedom! Leisure! We were supposed to be contemplating the finer things, not checking Slack on a Sunday evening. It’s a seductive vision, often trotted out. But tonight, over dinner, I want to nudge us past the poster quote and into the intriguing, rather troubled mind of the man himself. Because Keynes, I think, was promising something far more complex and far less certain than mere free time. He was promising a confrontation with ourselves.

  Think of the young Keynes. Cambridge Apostle. Bloomsbury Set. Surrounded by the likes of Strachey, Woolf, Forster. Their creed? The highest good was the quality of inner experience – love, beauty, truth, the delicate texture of one’s own consciousness and that of others. And crucially, as he cheerfully admitted later, they recognised "no moral obligation, no inner sanction, to conform or obey." Life was an aesthetic pursuit, a surface shimmering with brilliant conversation and exquisite feeling.

  But then… the *older* Keynes looked back. The Keynes who’d grappled with the trenches, the Depression, the terrifying fragility of civilisation. He looked back on that bright, brittle Cambridge world and saw something unsettling. He saw it as a "thin, artificial, precarious… veneer" laid over something much darker, much more chaotic. All that beautiful talk, he realised, lacked a "theory of action." It was skimming along the surface, utterly unprepared for – perhaps wilfully blind to – the deep, often ugly, currents of human nature, power, and necessity surging beneath. It was lovely, but was it *real*? Did it know how to *build* anything, or just appreciate it?

  *This* is the tension that feeds into that famous essay. Yes, he predicts abundance. But his promise isn’t just the end of toil. It’s the terrifying dawn of a *new kind of problem*: **“the permanent problem of the human race – how to use... freedom from pressing economic cares, how to occupy the leisure, which science and compound interest will have won...”** How to live “wisely and agreeably and well.”

  Why terrifying? Because Keynes, the reformed aesthete, saw the trap. For generations, he argued, we’ve been drilled. Drilled in the habits of scarcity. We’ve learned to be “purposive” – always striving, always seeing everything, *including ourselves and our time*, as a means to an end. We’ve learned to prize money not just as a tool, but as a *possession*, a symbol of security and status in itself. We are, as he put it, “afflicted” with this habit.

  His profound fear wasn't that we *wouldn't* achieve abundance. His fear was that, when it arrived, we wouldn’t know what to do with it. We’d be like deep-sea fish hauled suddenly into blinding sunlight, still trying to swim downwards. Could we shed the skin of scarcity? Could we learn the “art of life itself” – not as passive aesthetes skimming the surface, but as engaged beings capable of wisdom, enjoyment, and genuine connection, without the old engine of economic necessity driving us? Could we value time *for* time, not just for what it produces?

  *That* was his real promise – or perhaps, his profound challenge. Not fifteen easy hours, but the immense, unsettling project of reinventing what it means to be human when the age-old struggle for survival (for some, at least) recedes. It’s a challenge that cuts right to the heart of our workshop. The politics of working time isn't just about hours, wages, or productivity metrics – vital as those are. It’s fundamentally about power, yes, but also about purpose, meaning, and the kind of lives we want to craft in the space that economic progress *might* afford us. How do we dismantle the "purposive" machinery in our heads? How do we ensure leisure isn't just unemployment in a nicer jumper? How do we build lives that aren't just productive, but *lived*?

  Keynes offered no easy answers. He left us with the tension – between the allure of effortless beauty and the gritty need for meaningful action; between the habits of scarcity and the terrifying possibilities of abundance. That tension, I suspect, is still very much alive in this room, and in our world. It’s not just an economist's puzzle, or a philosopher's quandary. It’s the human stuff.

  So, over the next two days, as we delve into the politics, the policies, the histories, and the lived experiences of working time, let’s keep Keynes’s unresolved question humming in the background: **When the economic problem loosens its grip, what kind of humans will we choose to be?**

  It’s a magnificent, daunting question. And there’s no better group to start wrestling with it. Enjoy the dinner, enjoy the conversation, and let’s get stuck in tomorrow.

  Cheers.

  ---
  **Why this works (hopefully!):**

  1.  **Warm & Inclusive:** Opens with a light, self-deprecating nod to the mixed audience, sets a dinner tone ("Friends," "Cheers").
  2.  **Beyond the Soundbite:** Explicitly moves past the 15-hour week to the deeper tension.
  3.  **The Tension Explored:** Clearly lays out the young aesthete vs. the older, disillusioned pragmatist using his own language ("veneer," "no inner sanction," "theory of action").
  4.  **Links to the Essay:** Connects this personal tension directly to the core dilemma in *Economic Possibilities* – the fear we won't know *how* to live in abundance.
  5.  **Accessible Language:** Uses vivid metaphors ("deep-sea fish," "swim downwards," "unemployment in a nicer jumper"), avoids dense jargon. Explains concepts like "purposive."
  6.  **Relevance to Workshop:** Explicitly ties Keynes's challenge ("reinventing what it means to be human," "dismantle the purposive machinery") to the broader theme of the politics of working time ("power, purpose, meaning," "what kind of lives").
  7.  **For Economists:** Grounded in Keynes's economic prediction and his analysis of economic *habits* (prizing money as possession, purposiveness). Acknowledges the vital importance of their core topics (hours, wages, productivity, policy).
  8.  **For Humanists:** Engages with philosophy, ethics, aesthetics, the "art of life," and the critique of instrumentalism. Focuses on meaning and lived experience.
  9.  **British Tone:** "Right then," "Truly lovely," "snuck onto," "trotted out," "nudge us past," "daunting," "get stuck in," "Cheers." Understatement ("varied gathering," "rather large question").
  10. **7-Minute Fit:** Paced well for spoken delivery, clear sections, ends with a resonant question and a call to the workshop ahead.
  11. **Not a Seminar:** No footnotes, no dense argumentation, focuses on narrative and posing a big, engaging question to set the stage for the days ahead. Ends practically ("Enjoy the dinner...").

  This sets the table (literally and figuratively) for a rich exploration, honouring the complexity of Keynes and the profound questions about time, work, and life that your workshop will tackle. Good luck!
