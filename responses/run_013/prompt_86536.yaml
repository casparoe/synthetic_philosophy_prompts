prompt: |-
  I'm a software engineer who ended up managing a platform team at a mid-size company, and I keep ending up in the same meeting. We've always got two or three long-running things on the books — a payments rewrite we kicked off about fourteen months ago, a homegrown search service that's been limping along, an internal tool that three engineers keep polishing — and every quarter we sit down to decide whether to keep funding them, and somebody says we can't quit now, look how much we've already put into it. The stakes aren't small: each of these is a few hundred thousand dollars a year and a couple of people's jobs, and I'm the one who has to walk into the VP's office and either defend the spend or kill the thing. I've read enough pop economics to know the standard line, that past spending is water under the bridge and you should only compare what it costs from here against what you get from here, but the blanket version of that has always bugged me. There seem to be real cases where the fact that you already spent the money does matter — it bought you skills, or a reputation for finishing what you start, or an option you'd lose by walking away — and I definately don't think everyone on my team is wrong every time they say something that sounds like the fallacy. I've got no formal philosophy or econ background, so I need this spelled out and turned into something we can actually run.

  So here's what I want: a keep-going-or-kill procedure for in-flight projects. The questions in the order we should ask them, what counts as a good answer to each, the point where the procedure just says kill and we stop, and the point where it has to stop and hand the decision to a person because it's turned into a values question — like how much we owe the people who bet their careers on this — rather than a factual one. Be honest in the writeup: I want the version where sunk costs really are irrelevant stated as a special case with its conditions attached (something about who's doing the deciding, whether the spending bought anything durable, whether it changed what anyone else will do, whether it tied our own hands), not as the whole story, and I want the cases where honoring the past spending is actually defensible laid out next to the ones where it's just the fallacy in a costume. Also flag where the procedure will misfire and where a clever person could game it to keep their pet project alive, because I know exactly who on my team will try. Keep it to something two tech leads can run through in about an hour at a whiteboard, since we don't have an economist on staff and I'm not going to get one.

  Then run it end to end on three cases and show your work, including where it gives an answer I don't like. First, the payments rewrite: the old system still works for now, but we just found out it cant meet a new compliance requirement, so some of those fourteen months were genuinely necessary and some of it was gold-plating we did because it was fun. Second, something I keep chewing on with a friend: they're four years into a long training program and want out, and everyone tells them that's the sunk cost fallacy talking, but the same four years have made them better at this than they'd be at anything else they could switch into now, and I honestly don't know if the standard line gets that one right. Third, the internal tool that three engineers have been polishing for a year and that about six people use; I'm pretty sure the answer is going to be kill it, and I want you to not soften that. Last thing: tell me what the procedure can't do. Specifically, is there a version of this where the honest answer is that a group of people who all invested together will basically never be able to run it on themselves, and if so, what do you do about that?
reasoning: |-
  We are going to design a decision procedure for ongoing projects. The goal is to avoid the sunk cost fallacy while recognizing situations where past investments create real, ongoing value or obligations that affect future decisions.

  The procedure will have a series of questions. At each step, if the answer meets a certain condition, we either kill the project or proceed to the next question. If we get through all the questions without a kill decision, we continue the project. Some questions may lead to a "human judgment" call.

  We'll structure the procedure as follows:

  1. **Question 1: Is the project already dead?** (Check for obvious failure states)
  2. **Question 2: What is the minimum required to capture the value of past spending?** (Identify if there's a small step to capture sunk cost value)
  3. **Question 3: What is the expected future value?** (Compare the future value to the future cost, ignoring sunk costs except as they create current assets)
  4. **Question 4: Are there non-financial obligations?** (Consider reputational, moral, or strategic obligations that might compel continuation)
  5. **Question 5: Kill or Continue?** (If we haven't killed by now, we continue, but with conditions)

  We'll also note:
  - Where the procedure can be gamed.
  - Where it might misfire.
  - The conditions under which sunk costs are truly irrelevant (when they haven't created any durable asset or obligation).

  ### Step-by-Step Procedure

  #### Question 1: Is the project already dead?
  - **Check for:**
    - The original goal is no longer achievable (e.g., technology obsolete, market disappeared).
    - The project has negative future value and no way to pivot.
    - There are irreversible failures (e.g., regulatory blockage, key personnel left without replacement).
  - **Kill if:** The project cannot achieve any positive outcome even with minimal additional investment.
  - **Gaming:** Someone might hide the fact that the project is dead by redefining goals or downplaying obstacles.
  - **Misfire:** If the project is in a temporary lull but could recover, we might kill too early.

  #### Question 2: What is the minimum required to capture the value of past spending?
  - **Purpose:** Sometimes past spending has created an asset (e.g., knowledge, a partial product, an option) that can be captured with a small additional investment. We want to see if there's a way to "harvest" the sunk cost value without continuing the whole project.
  - **Examples:**
    - A partially built feature that can be shipped as a minimal version.
    - Knowledge gained that can be documented and reused.
    - A prototype that can be sold or repurposed.
  - **Kill if:** There is no way to capture any value from the past spending with any reasonable additional investment (i.e., the sunk costs are truly sunk and have created no durable asset).
  - **Continue with a pivot if:** We can capture the value with a small, bounded investment (e.g., one month of work to document and archive, or two weeks to ship a minimal version). Then we do that and stop.
  - **Gaming:** Overstating the value of the captured asset or understating the cost to capture it.
  - **Misfire:** Not recognizing a pivot opportunity and killing a project that could have been harvested.

  #### Question 3: What is the expected future value?
  - **Purpose:** Now we consider the project as if starting from scratch today. We estimate:
    - Future costs (FC): The additional money and time required to complete the project (or to reach the next milestone that delivers value).
    - Future benefits (FB): The value (monetary or strategic) expected from completing the project.
    - Net Future Value (NFV) = FB - FC.
  - **Kill if:** NFV is negative (or below a threshold, e.g., less than the opportunity cost of the resources).
  - **Continue if:** NFV is positive and substantial.
  - **Note:** We must account for risk (probability of success). Adjust FB by the probability of achieving it.
  - **Gaming:** Overestimating benefits, underestimating costs, or being overly optimistic about probability.
  - **Misfire:** Underestimating future benefits because of a narrow view (e.g., missing strategic benefits).

  #### Question 4: Are there non-financial obligations?
  - **Purpose:** Consider factors that are not captured in the financial analysis:
    - Reputational: Will killing the project damage trust with employees, customers, or partners? (e.g., if we have publicly committed, or if employees have invested career time)
    - Moral: Do we have an obligation to see it through for ethical reasons? (e.g., if the project has health/safety implications, or if we made implicit promises)
    - Strategic: Does continuing (or killing) send a signal that affects other projects or partnerships?
  - **Kill if:** The non-financial obligations are minimal and do not outweigh the financial case for killing.
  - **Continue if:** The non-financial obligations are so strong that they override a negative NFV (but note: this is rare and should be explicitly approved at a high level).
  - **Human judgment:** This step must involve a broader group (e.g., HR, PR, executives) because it's about values.

  #### Question 5: Kill or Continue?
  - If we haven't killed by now, we continue. But we set:
    - A clear milestone for the next review (with a fixed time and budget).
    - Metrics for success at that milestone.
    - A plan to capture intermediate value (so we don't end up in the same situation).

  ### When are sunk costs irrelevant?
  Sunk costs are irrelevant in the standard economic sense when:
  - They have not created any durable asset (knowledge, reputation, option value) that affects future outcomes.
  - The decision-maker has no emotional or reputational stake (i.e., they are a dispassionate third party).
  - There are no strategic signals sent by the decision (so no one else changes their behavior based on our action).

  But note: past spending often does create assets or obligations that matter. The procedure above explicitly accounts for that in Step 2 and Step 4.

  ### Running the Cases

  #### Case 1: Payments Rewrite (14 months in)
  - **Q1: Is it dead?** No. The old system must be replaced for compliance, so the goal is still relevant.
  - **Q2: Capture value?** The past spending has created a codebase and knowledge. The minimum to capture value might be to ship a minimal compliant version. But note: the gold-plating did not add compliance value. So we might scale back to the minimal version and ship that.
  - **Q3: Future value?** 
    - Future cost (FC): Estimate to complete the minimal version (without gold-plating). 
    - Future benefits (FB): Avoid non-compliance penalties (which could be huge) and reduce maintenance on the old system. Also, the new system might have other benefits. 
    - NFV: Likely positive because non-compliance is not an option. So we must do something. But we can pivot to the minimal version to reduce FC.
  - **Q4: Non-financial?** Reputation for meeting compliance is critical. Also, the team's morale if we kill after 14 months? But if we pivot to minimal, we are still delivering.
  - **Decision:** Continue, but with a pivot: drop gold-plating and focus on minimal compliance. Set a hard deadline for the minimal version.

  #### Case 2: Training Program (4 years in, individual wants to quit)
  This is a personal decision, but we can adapt the framework.

  - **Q1: Dead?** The goal (completing the training) is still achievable? If yes, not dead.
  - **Q2: Capture value?** The past four years have created skills. The minimal step to capture that value might be to complete the training and get the certification (if near the end) or to switch to a related field where the skills are transferable without completing. If they quit now, they have the skills but not the credential.
  - **Q3: Future value?** 
    - FC: Cost (time, money, effort) to complete the program.
    - FB: The expected boost in career from having the credential and the additional skills. Compare to the value of switching now (which might be lower because they are not trained in another field).
    - NFV: If the program is near completion, FC might be low and FB high. But if there are years left, FC might be high and FB might be uncertain. Also, consider the opportunity cost of not switching now.
  - **Q4: Non-financial?** Personal fulfillment, mental health, obligations to family or self. Also, reputation for finishing? (But that might be a fallacy if the costs outweigh benefits.)
  - **Decision:** This is highly personal. The framework suggests: 
    - If they are near the end (say, within 6 months), the NFV is likely positive -> continue. 
    - If they are not near the end, then the NFV might be negative -> consider quitting. 
    - But also, they might capture the value of the sunk cost by switching to a job that uses the acquired skills without completing the program. That would be a pivot.

  #### Case 3: Internal Tool (3 engineers, 6 users, polished for a year)
  - **Q1: Dead?** Not dead, but the value is low.
  - **Q2: Capture value?** The tool exists and is used by 6 people. The minimal step to capture value is to stop development and leave it as is (or hand it off to the users for maintenance). The past spending has created the tool, which is the asset.
  - **Q3: Future value?** 
    - FC: The cost of continued development (3 engineers) is high.
    - FB: The benefit to 6 users is low. Even if we freeze development, the tool might still provide some value.
    - NFV: Negative because FC (ongoing) is high and FB is low. Freezing development would reduce FC to near zero (only maintenance) and keep most of the FB.
  - **Q4: Non-financial?** The engineers might be demoralized, but they could be reassigned to higher-value projects. The company might be seen as wasteful if they continue, but also as pragmatic if they stop.
  - **Decision:** Kill further development. Freeze the tool in its current state and assign minimal maintenance (or hand to the users). The engineers can be reassigned.

  ### What the Procedure Can't Do

  - **Group Self-Assessment:** A group that has collectively invested in a project may not be objective. The sunk cost fallacy is emotional and social. The procedure requires honest answers, and the same people who are invested might not provide them. 
    - **Solution:** Have the assessment run by a disinterested party (e.g., a different team, an external consultant, or a designated internal auditor). If that's not possible, escalate to a higher level of management that was not involved in the project.

  - **Quantifying Non-Financial Factors:** Some obligations (like reputation or morale) are hard to measure. The procedure flags them for human judgment, but that judgment may be flawed.

  - **Predicting the Future:** The future value and cost estimates are just that: estimates. They can be wrong.

  - **Incremental Funding Trap:** If a project is funded in small increments, the procedure might always recommend one more step because the next step is small and seems to capture the sunk cost. To avoid, set a hard budget and time limit at the beginning and review at those points.

  ### Final Note
  The procedure is a tool to structure thinking. It won't eliminate tough calls, but it will make the rationale explicit and reduce the influence of the sunk cost fallacy. It should be run at predetermined milestones (not just when things go wrong) and by a mix of people (some with and without a stake in the project).
answer: |-
  ### Keep-Going-or-Kill Decision Procedure for In-Flight Projects  
  Designed for **two tech leads in a 1-hour whiteboard session**. Focuses on **future value only**, but explicitly accounts for sunk costs that created durable assets/obligations.  

  ---

  ### **The Procedure: 5 Questions, 3 Kill Gates**  
  **Rules of Engagement:**  
  1. **Timebox:** 15 min per question max.  
  2. **Require Evidence:** No opinions without data (e.g., "reputation risk" needs examples, not feelings).  
  3. **Escalate Ambiguity:** If consensus fails or non-financial factors dominate, VP decides.  

  #### **Question 1: Is Further Investment *Mandatory*?**  
  *(Check for existential threats or legal binds.)*  
  - **Ask:** "Will stopping *now* cause immediate, irreversible damage (e.g., compliance failure, safety risk, contract breach)?"  
  - **Good Answer:** Concrete evidence (e.g., "PCI audit fails in 3 months if we stop").  
  - **Kill Gate 1:** If **NO** → Proceed to Q2.  
    If **YES** → Continue *only the minimum to avert disaster*, then re-run this procedure.  
  - **Gaming Risk:** Overstating risks. Counter by requiring written proof (e.g., legal/security assessment).  

  #### **Question 2: What Did Past Spending *Actually Buy*?**  
  *(Identify durable assets from sunk costs. Ignore irrecoverable costs.)*  
  - **Ask:** "What tangible assets do we have *today* that we didn’t have when we started? (e.g., code, skills, patents, user trust)."  
  - **Good Answer:**  
    - ✅ **Durable Assets:** Skills (e.g., "team now knows payment APIs"), reusable code, partnerships.  
    - ❌ **Non-Durable:** "We’ve spent $500K" (irrelevant), "pride" (non-asset).  
  - **Kill Gate 2:** If **NO DURABLE ASSETS** → Kill the project.  
    If **ASSETS EXIST** → Proceed to Q3.  
  - **Misfires:** Assets with no future value (e.g., "polished internal tool nobody needs").  

  #### **Question 3: What’s the *Marginal* Future Value vs. Cost?**  
  *(Compare only *new* effort to *new* benefits. Sunk costs irrelevant here.)*  
  - **Ask:** "What’s the **best-case ROI** of *additional* spend? Calculate:  
    `(Value of Outcomes - Cost to Complete) / Cost to Complete`."  
    - *Value*: Revenue uplift, cost savings, or strategic metrics (e.g., "50% faster onboarding").  
    - *Cost*: Engineering months, $, opportunity cost (what else could the team do?).  
  - **Good Answer:**  
    - ✅ Quantified ROI (e.g., "6 months to launch → $200K/yr savings").  
    - ❌ "We’ve come so far" (fallacy), "it might help someday" (vague).  
  - **Kill Gate 3:** If **ROI < 50%** OR **Value < 2× Opportunity Cost** → Kill.  
    Else → Proceed to Q4.  
  - **Gaming Risk:** Sandbagging opportunity cost. Counter by comparing to 2–3 real backlog items.  

  #### **Question 4: Are There *Non-Financial* Obligations?**  
  *(Check for ethical/reputational factors beyond ROI.)*  
  - **Ask:** "Would stopping *actively harm* our integrity? (e.g., betraying public commitments, burning employee trust)."  
  - **Good Answer:**  
    - ✅ **Defensible:** "We promised regulators we’d fix this," "cancelling voids employee equity."  
    - ❌ **Fallacy in Costume:** "Team will be sad," "we said we’d finish" (without consequences).  
  - **No Kill Gate:** Escalate to VP with:  
    - A written statement of the obligation.  
    - A "moral cost" estimate (e.g., "attrition risk: 2 engineers").  

  #### **Question 5: Set Continuation Terms**  
  *(If proceeding, define strict boundaries.)*  
  - **Mandatory Outputs:**  
    - ✅ **Deadline:** ≤6 months.  
    - ✅ **Success Metric:** Binary pass/fail (e.g., "handles 100 transactions/sec").  
    - ✅ **Kill Switch:** Automatic cancellation if metrics missed at 50% deadline.  

  ---

  ### **When Sunk Costs *Matter* vs. Fallacy**  
  | **Sunk Costs Matter (Durable Assets)**     | **Sunk Cost Fallacy (Costume)**          |  
  |--------------------------------------------|------------------------------------------|  
  | Skills acquired (e.g., "team now owns payments expertise") | "We’ve spent $1M already" (no assets created) |  
  | Reputational capital (e.g., "customers expect this launch") | "We’ll look bad if we quit" (no evidence) |  
  | Strategic options (e.g., "this unblocks 3 future projects") | "Sunk costs mean we’re close" (no data) |  

  **Sunk Costs Truly Irrelevant When:**  
  - No durable assets were created (Q2).  
  - Decision-makers have no skin in the game (e.g., dispassionate third party).  
  - No reputational/ethical binds exist (Q4).  

  ---

  ### **Case Studies: Run the Procedure**  
  #### **Case 1: Payments Rewrite (14 months in)**  
  - **Q1 (Mandatory?):** **YES** – Old system can’t meet compliance. *Minimum action: Ship a compliant MVP.*  
  - **Q2 (Assets?):** **YES** – Compliance groundwork done; team has payments expertise.  
  - **Q3 (ROI?):**  
    - *Cost to complete MVP*: 3 months (cut gold-plating).  
    - *Value*: Avoids $500K fines + $300K/yr old system maintenance.  
    - *ROI*: ($800K/yr savings / $150K cost) = **533%** → High ROI.  
  - **Q4 (Obligations?):** Minimal – No public promises.  
  - **Decision:** **CONTINUE**, but only MVP. Kill gold-plating. Deadline: 3 months.  
  - **Uncomfortable Truth:** 11 months were wasted on over-engineering. Procedure forces correction.  

  #### **Case 2: Friend in Training Program (4 years in)**  
  *(Adapted for personal use)*  
  - **Q1 (Mandatory?):** **NO** – No legal/safety risk to quitting.  
  - **Q2 (Assets?):** **YES** – Skills gained (e.g., "now a top 10% specialist").  
  - **Q3 (ROI?):**  
    - *Cost to complete*: 2 years tuition + living expenses.  
    - *Value*: Higher lifetime earnings vs. switching now.  
    - *ROI Calc*: If staying earns $200K more over 10 years vs. switching, but costs $100K → **ROI = 100%**.  
    - *But*: If burnout lowers productivity, ROI may be <50% → **Kill**.  
  - **Q4 (Obligations?):** **Escalate** – Ethical duty to self (mental health) vs. career equity.  
  - **Decision:** **DEPENDS** – If ROI >50%, continue. Else quit. The "skills" (Q2) make switching *harder* but don’t justify continuing alone.  

  #### **Case 3: Internal Tool (3 engineers, 6 users)**  
  - **Q1 (Mandatory?):** **NO** – No system depends on it.  
  - **Q2 (Assets?):** **YES** – Tool exists, but only used by 6.  
  - **Q3 (ROI?):**  
    - *Cost to "complete"*: Infinite (polishing never ends).  
    - *Value*: Saves ~20 hours/month for 6 users → ~$50K/yr savings.  
    - *Opportunity cost*: 3 engineers could build features worth $500K/yr.  
    - ROI = ($50K / $600K engineering cost) = **8%** → **<50% threshold**.  
  - **Q4 (Obligations?):** **NO** – No promises made.  
  - **Decision:** **KILL** – Freeze tool. Redirect engineers.  
  - **No Softening:** Even with sunk costs (polished UI), marginal ROI is negative.  

  ---

  ### **What the Procedure *Can’t* Do**  
  1. **Self-Assessment by Invested Groups Fails:**  
     - Teams who sunk costs into a project **cannot objectively run Q2–Q3**. Human bias prevents it.  
     - **Solution:** Bring in an uninvested third party (e.g., another team’s tech lead, external consultant). If unavailable, escalate to VP *with bias disclosures*.  
  2. **Non-Financial Factors Are Subjective:**  
     - Q4 (obligations) requires honest escalation. Hidden agendas ("my friend works on this") poison it.  
  3. **Predicting Future Value is Hard:**  
     - ROI estimates (Q3) can be gamed with optimism bias. Counter by comparing to *past project outcomes*.  
  4. **Ignores Incremental Sunk Costs:**  
     - If you approve "just 3 more months" repeatedly, the procedure won’t stop it. **Always set deadlines upfront**.  

  ---

  ### **Final Checklist for Your Meeting**  
  - **Before:** Gather data (costs, user counts, compliance docs).  
  - **During:** Whiteboard each question → force written answers.  
  - **After:** Document decisions and review dates.  
  - **When Gaming Suspected:** Demand evidence for Q2 assets and Q3 ROI. If unsatisfied, kill.  

  This forces the hard choices *without* ignoring real assets from past work. The kill gates prevent death marches, while Q4 provides an escape valve for human factors.
