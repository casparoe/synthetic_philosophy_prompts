  Now, let's rank the tensions:

  The only genuine tension is between 1 and 4. It is severe (5). The others are apparent or low severity.

  But wait: what about commitment 4 and commitment 5? They don't conflict. And commitment 2 and 4? Not directly.

  But consider: commitment 4 might be in tension with commitment 1 in the interpersonal case. The novelist says: "same for a century". So if we have two centuries with the same total goods but one improves and the other declines, commitment 4 says the improving one is better. But commitment 1 would require that we value the goods in each year equally, so the total is the same. Hence, the same conflict as in the intrapersonal case.

