prompt: |-
  My mate and I spent most of last night arguing about fairness in risk models — he builds them for a credit startup, I sit on the ethics panel of a housing charity — and we got no where, mainly because he kept saying the impossibility results settle the whole thing and I kept saying they only settle it once you've already accepted his framing. So here's what I actually need. We're about to sign off on a model that triages tenants in rent arrears: some get offered a payment plan, some get referred for eviction proceedings. Roughly 40,000 cases a year, real consequences for real people, and the thing we're predicting is "will fall further behind on payments," which our own advisors can't agree is even the right thing to be predicting, and one group has noticeably more missing income data than the other. On our side we've got one part-time statistician, no in-house lawyer, and a regulator who will ask how we know the thing isn't discriminatory. He wants a number. I don't think there is one number.

  Write me a decision procedure my team can actually run. The questions to ask in order, what counts as a sufficient answer to each, which fairness criterion or criteria we should be demanding given that we know the groups don't have the same base rates going in, where the procedure has to stop and hand the call to a human because its a values question rather than a technical one, and where the honest answer is don't deploy at all. Then run it on two cases: the arrears model above, and a hypothetical where we're dividing a fixed pot of 200 legal-aid hours among tenants most at risk of losing their home. At least one of the two should come out somewhere I won't like. And be straight with me about the parts of the procedure that are really just laundering a political choice as a technical one — I'd rather know where those are than pretend they're not there. Don't bother with references, I'll never look them up. American English please, our funders are American.
reasoning: |-
  We are designing a decision procedure for evaluating a risk model that has real consequences for people. The procedure must consider fairness, data quality, and the appropriateness of the prediction target. It must also acknowledge where technical analysis ends and value judgments begin.

   The steps:

   1. **Problem Formulation and Prediction Target Validity**
      - Question: Is the prediction target ("will fall further behind on payments") aligned with the actual goal (preventing evictions and supporting tenants) and does it capture the intended outcome without introducing bias?
      - What counts as a sufficient answer? 
          - We need evidence that falling further behind on payments is a reasonable proxy for the risk of eviction and that intervening at this stage is effective. 
          - We must also consider if the target is defined in a way that is equally measurable across groups (e.g., if one group has more missing income data, can we accurately measure "further behind"?).
      - If the target is not valid or if there is significant disagreement, we must revisit the problem formulation. This step may require domain expertise and input from affected communities.
      - If the answer is insufficient (e.g., no evidence of alignment, or the target is known to be biased), the procedure stops and the model should not be deployed until the target is re-evaluated.

   2. **Data Quality and Missing Data Analysis**
      - Question: Are there significant differences in data quality (especially missing data) across groups, and have we addressed them appropriately?
      - What counts as a sufficient answer?
          - Quantify the missing data rates by group and by feature. 
          - Show that the missing data does not introduce bias (e.g., by using appropriate imputation that does not disadvantage any group) and that the model's performance is robust to missing data.
          - If one group has more missing data, we must ensure that the model does not penalize that group for missingness.
      - If the missing data is not handled fairly or if the data quality issues are too severe, the procedure stops and the model should not be deployed.

   3. **Fairness Criteria Selection and Measurement**
      - Given that base rates may differ, we must choose fairness criteria that are appropriate for the context. 
      - Since the consequences are severe (eviction vs. payment plan), we must consider both the allocation of beneficial outcomes (payment plan) and harmful ones (eviction referral). 
      - We are likely to consider:
          - **Equal Opportunity**: Equal true positive rates (TPR) across groups. This means that among those who would fall further behind (positive class), the rate at which they are correctly identified (and thus offered a payment plan to prevent eviction) should be the same. 
          - **Predictive Parity**: Equal positive predictive value (PPV) across groups. This means that the probability of actually falling further behind given a positive prediction (referral for eviction) is the same for each group.
          - **Calibration**: The predicted probability of falling further behind should reflect the true probability for each group.
      - However, note that if base rates differ, we cannot satisfy all of these at the same time (impossibility result). Therefore, we must choose based on our values:

          - If we prioritize that the model should not disproportionately harm a group by incorrectly referring them for eviction (false positive), we might focus on **false positive rate (FPR) parity** or **predictive parity** (PPV). 
          - If we prioritize that the model should not miss those who will fall further behind (false negative) in any group, we might focus on **equal opportunity** (TPR).

      - We must also consider the impact on the groups. If one group is historically disadvantaged, we might prioritize minimizing harm to that group.

      - What counts as a sufficient answer?
          - Report the chosen fairness metrics and their values for each group. 
          - The model must satisfy at least one of the chosen fairness metrics within a predefined threshold (e.g., disparity less than 20% relative difference, or a statistical test for non-inferiority). 
          - The choice of metric must be justified by the context and the potential harm.

   4. **Trade-off Analysis and Harm Mitigation**
      - Question: If we cannot satisfy all fairness criteria, what trade-offs are we making and how do we mitigate the harm?
      - What counts as a sufficient answer?
          - We must explicitly state the trade-offs (e.g., satisfying equal opportunity might lead to a higher false positive rate for one group, meaning more people are referred for eviction unnecessarily). 
          - We must have a plan to mitigate the harm (e.g., human review for cases near the threshold, additional support for those who are falsely referred for eviction).

   5. **Regulatory and Legal Compliance**
      - Question: Does the model comply with relevant laws and regulations (e.g., anti-discrimination laws)? 
      - What counts as a sufficient answer?
          - We must have documentation that the model does not use protected attributes (unless legally permitted with a valid business reason and without disparate impact) and that it does not have a disparate impact on protected groups. 
          - We must show that we have taken steps to reduce disparate impact if found.

   6. **Human Oversight and Fallback**
      - Question: Where does the model hand off to a human?
      - What counts as a sufficient answer?
          - Define clear thresholds (e.g., low confidence predictions, cases near the decision boundary, or cases from a group that is known to be disadvantaged by the model) that trigger human review. 
          - Ensure that the human reviewers have the necessary context and training to make fair decisions.

   7. **Deployment Decision**
      - If all the above steps have satisfactory answers, the model can be deployed with ongoing monitoring. 
      - Otherwise, the model should not be deployed until the issues are resolved.

   Now, we run the procedure on two cases:

   **Case 1: Arrears Model (triaging tenants in rent arrears)**

   1. **Prediction Target Validity**: 
      - The target is "will fall further behind on payments". There is disagreement among advisors. We must ask: Is this the right target? 
          - If falling further behind is a strong indicator of eventual eviction and if intervening with a payment plan can prevent that, then it might be valid. 
          - However, if the target is influenced by factors that are not under the tenant's control (like job loss) and if the missing income data is correlated with group membership, then the target might be invalid. 
          - Given that one group has more missing income data, we are concerned about the validity. 
          - **Conclusion**: Insufficient. We need to revisit the target. Maybe we should predict "risk of eviction" directly? But that might be harder. Without agreement and without addressing the missing data issue, we cannot proceed.

   2. **Data Quality**: 
      - One group has noticeably more missing income data. If income is a key feature, then the model might perform worse for that group. We must check:
          - How is missing data handled? If we impute, how? If we use a separate category, does that introduce bias?
          - We must show that the model does not have a significant drop in performance for the group with missing data. 
          - Without knowing the details, we can't be sure. But if the group with missing data is also the one that is historically marginalized, this could lead to discrimination. 
          - **Conclusion**: Likely insufficient until we fix the data issue.

   3. **Fairness Criteria**: 
      - Given the consequences (eviction referral vs. payment plan), we should prioritize avoiding false positives (referring someone for eviction who would not have fallen further behind) because eviction is a severe harm. Therefore, we might choose **predictive parity** (PPV) to ensure that the rate of actual default among those referred for eviction is similar across groups. Alternatively, we might also care about **equal opportunity** (TPR) because we don't want to miss helping someone who would fall behind. 
      - But the base rates likely differ. If the group with missing data has a higher base rate of falling behind, then without careful adjustment, we might see disparities. 
      - Given the issues in step 1 and 2, we cannot even measure these fairly.

   4. **Trade-offs**: Not reached because of failure in earlier steps.

   5. **Compliance**: We haven't addressed the missing data and target validity, so we cannot guarantee compliance.

   6. **Human Oversight**: Even if we deploy, we would need human review for the group with missing data? But without a valid target and fair data, human oversight might not be enough.

   7. **Decision**: Do not deploy until:
          - The target is validated and agreed upon.
          - The missing data issue is addressed (e.g., by collecting more data, using better imputation, or using techniques that are robust to missingness and do not disadvantage the group).

   **Case 2: Fixed Pot of Legal-Aid Hours (hypothetical)**

   We are dividing 200 legal-aid hours among tenants most at risk of losing their home.

   1. **Prediction Target Validity**: 
      - The target is "risk of losing their home". This is directly aligned with the goal of preventing homelessness. It is a valid target.

   2. **Data Quality**: 
      - Assume we have good data on eviction risk factors. We must check for missing data by group. If there are no significant disparities, we proceed.

   3. **Fairness Criteria Selection**:
      - The resource (legal-aid hours) is beneficial. We want to allocate it to those who need it most (high risk). However, we also want to ensure that groups are served equitably. 
      - We might consider:
          - **Demographic Parity**: The proportion of each group that receives the resource should be similar. But if one group has a higher base rate of risk, then we might want to serve more of that group. So parity might not be fair.
          - **Equal Opportunity**: We want to ensure that among those who are at high risk (and would lose their home without aid), the rate at which they receive the resource is the same across groups. This is a strong candidate.
          - **Benefit Maximization**: Allocate to those with the highest risk, regardless of group. But this might lead to one group getting most of the resources if they have higher risk.

      - However, note that if we allocate based on risk score, and if the model is calibrated, then we are being fair in the sense of giving the resource to those who need it most. But if the risk model is biased (e.g., underestimating risk for a group), then that group will be underserved.

      - We must also consider if we want to prioritize groups that are historically disadvantaged. This is a value judgment.

      - **Proposal**: 
          - We choose **equal opportunity** (TPR) as a fairness criterion: the true positive rate (sensitivity) should be the same across groups. This means that we are equally good at identifying the truly high-risk individuals in each group. 
          - We also want the model to be **calibrated** so that the risk scores are accurate for each group.

   4. **Trade-offs**: 
      - If we have limited resources (only 200 hours), we cannot serve everyone. We must set a threshold. 
      - We might also consider reserving a portion of the hours for groups that are historically disadvantaged, even if their individual risk scores are not the highest. This is a value decision.

   5. **Compliance**: We must ensure that the allocation does not have a disparate impact on protected groups.

   6. **Human Oversight**: 
      - We might set aside a portion of the hours for human discretion to cover cases where the model might be wrong or where there are extenuating circumstances.

   7. **Decision**:
      - If the model is calibrated and satisfies equal opportunity, we can deploy. 
      - However, note that if one group has a much higher base rate of risk, then even with equal TPR, we will be serving more of that group. This might be acceptable because the need is greater.

      - But let's consider a scenario that you might not like: 
          - Suppose Group A has a base rate of high risk of 20% and Group B has 5%. 
          - We build a model that is perfectly calibrated and has equal TPR (say 80% for both). 
          - When we allocate the 200 hours to the top X% (by risk score), we will end up serving more from Group A because they have more high-risk individuals. 
          - This might lead to Group B receiving proportionally less of the resource. 
          - Is that fair? 
              - From a need-based perspective: yes, because we are helping those at highest risk. 
              - From a group equity perspective: no, because Group B, which might be historically disadvantaged, gets less per capita.

      - How to handle? 
          - We might decide to allocate a fixed proportion of the hours to each group (e.g., 50% to Group A and 50% to Group B, even though Group A has more need). This would be a form of demographic parity in allocation. 
          - This is a value judgment. The procedure must stop here and ask: What is our priority? Maximizing overall impact (by serving the highest risk) or ensuring that each group gets a fair share?

      - The honest answer: 
          - The technical procedure can show the trade-off (by simulating the allocation with and without group-based quotas) and then we must make a political choice.

      - If we choose to maximize impact, then we allocate by risk score and accept that Group B gets fewer hours. 
          - But we must ensure that the model is not biased against Group B (i.e., it is calibrated and has equal TPR). 
          - If we find that the model is biased (e.g., it underestimates risk in Group B), then we must correct that.

      - If we choose to allocate by group quota, then we are making a political choice to prioritize group equity over individual need. This might be justifiable if Group B has been historically denied resources.

   **Political Choices Disguised as Technical:**

    - The choice of the prediction target: This is a value judgment about what outcome we care about, but it is often presented as a technical decision.
    - The choice of fairness metric: This depends on whether we prioritize avoiding false positives (e.g., unnecessary eviction) or false negatives (missing someone who needs help). 
    - The decision to allocate by individual risk versus group quotas: This is a political choice about distributive justice.

   Conclusion:

    For the arrears model: We cannot deploy until we resolve the target validity and data quality issues.

    For the legal-aid model: We can deploy if we have a valid model, but we must explicitly decide on the allocation strategy (individual risk vs. group quotas) and that decision is political.
answer: |-
  Here's a no-nonsense decision procedure for evaluating risk models in high-stakes scenarios. It's designed to flag showstoppers early, force transparency on trade-offs, and pinpoint where human judgment must take over. I'll run it on your arrears model and the legal-aid example afterward.

  ---

  ### **Decision Procedure: Fairness Evaluation for High-Stakes Models**
  **Run these steps in order. Stop if any answer fails the sufficiency threshold.**

  1. **PROBLEM VALIDATION**  
     *Question:* Is the prediction target:  
     - (a) Directly tied to harm reduction?  
     - (b) Measurably achievable through the proposed intervention?  
     - (c) Non-discriminatory in definition?  
     *Sufficient answer:* Concrete evidence for (a)-(c). Must include documentation of stakeholder dissent and resolution attempts.  
     *Stop if:* Target relies on proxies known to correlate with protected attributes (e.g., "creditworthiness" for rent arrears).  
     *Handoff to humans:* If advisors disagree on target validity, escalate to ethics panel + impacted tenant representatives.  

  2. **DATA INTEGRITY AUDIT**  
     *Question:*  
     - (a) Is missing data >5% in any protected group?  
     - (b) Is missingness correlated with group identity? (e.g., Group X has 40% missing income data vs. Group Y at 2%)  
     *Sufficient answer:*  
     - Statistical proof missingness isn't group-biased (p<0.01), OR  
     - Validation that imputation/reweighting removes group disparity without harming accuracy.  
     *Stop if:* Missingness is structural (e.g., undocumented workers can't provide pay stubs) and uncorrectable.  

  3. **FAIRNESS CRITERIA SELECTION**  
     *Given:* Base rates differ (e.g., Group A defaults at 15%, Group B at 5%).  
     *Demand:* **Equal Opportunity** (True Positive Rate parity) AND **Predictive Equality** (False Positive Rate parity).  
     *Why:*  
     - *Equal Opportunity*: Ensures equal detection of "will fall behind" (avoids neglecting vulnerable groups).  
     - *Predictive Equality*: Prevents over-policing (e.g., evicting people who'd recover).  
     *Sufficient answer:*  
     - Both metrics ≤ 20% relative difference between groups.  
     - If impossible, document which group is harmed and quantify harm (e.g., "Group X gets 30% more false eviction referrals").  
     *Handoff to humans:* When trade-offs exist (e.g., helping Group A hurts Group B), require senior leadership to sign off on which group bears costs.  

  4. **LEGAL SAFEGUARD CHECK**  
     *Question:* Does the model's worst-case disparity violate:  
     - The 80% rule (Adverse Impact Ratio < 0.8)?  
     - Contextual fairness (e.g., would a judge accept "algorithm error" for wrongful eviction)?  
     *Sufficient answer:*  
     - Adverse Impact Ratio ≥ 0.8 for all protected classes, AND  
     - Documentation showing disparities are justified by business necessity (e.g., "Model cuts overall evictions by 25%").  
     *Stop if:* Disparity disproportionately impacts historically marginalized groups (e.g., racial minorities).  

  5. **FAILSAFE DEPLOYMENT PROTOCOL**  
     *Require:*  
     - Hard caps on automated decisions (e.g., "No eviction without human review if predicted risk < 70%").  
     - Resource allocation to affected groups (e.g., "10% of eviction savings fund tenant legal aid").  
     *Sufficient answer:* Binding policy approved by legal counsel.  

  6. **DEPLOY/KILL DECISION**  
     - **Deploy only if:** All steps 1-5 pass.  
     - **Kill the model if:** Any step fails irreparably (e.g., target invalidity, uncorrectable discrimination).  

  ---

  ### **Where Politics Masquerades as Tech**
  - **Base rate differences:** Choosing which fairness metric to prioritize (e.g., Equal Opportunity vs. Predictive Equality) **is political**. The math can't decide who *should* bear errors.  
  - **Harm trade-offs:** Quantifying "business necessity" (Step 4) is subjective. Reducing evictions by 20% might justify harming Group X to your startup partner but not to your ethics panel.  
  - **Missing data fixes:** Reweighting data assumes historical patterns are fair. If society underpaid Group Y, "correcting" missing data accepts that injustice.  

  ---

  ### **Case 1: Rent Arrears Triage Model**  
  - **Step 1 (Problem Validation):**  
    Prediction target = "will fall further behind."  
    *Answer:* FAIL. Advisors disagree, and missing income data correlates with group identity (e.g., gig workers). No proof intervention works equally for all.  
    *Handoff to humans:* Ethics panel must redefine target (e.g., "risk of preventable eviction").  
  - **Step 2 (Data Audit):**  
    Group X (40% missing income) vs. Group Y (5% missing).  
    *Answer:* FAIL. Missingness is structural (e.g., cash-based jobs). Imputation would invent data for Group X, amplifying bias.  
  - **Stop here.** Do not deploy.  

  ### **Case 2: Legal-Aid Hours Allocation**  
  - **Step 1 (Problem Validation):**  
    Prediction target = "risk of losing home."  
    *Answer:* PASS. Directly aligns with harm reduction.  
  - **Step 2 (Data Audit):**  
    Assume no major missing data issues. PASS.  
  - **Step 3 (Fairness Criteria):**  
    Base rates: Group A (high-risk area) homelessness risk = 12%, Group B (stable area) = 3%.  
    - *Equal Opportunity:* TPR parity. Model detects 85% of high-risk in Group A vs. 80% in Group B → PASS (≤20% gap).  
    - *Predictive Equality:* FPR parity. Group A FPR=15% (15% get aid but keep home), Group B FPR=5% → FAIL (200% gap).  
    *Trade-off:* Helping high-risk Group A causes 3x more "wasted" aid vs. Group B.  
    *Handoff to humans:* Leadership must choose:  
    - Accept wasted aid to serve Group A (prioritize need), OR  
    - Force similar FPRs (but Group A's truly needy lose aid).  
  - **Step 4 (Legal Safeguard):**  
    Adverse Impact Ratio: Group A gets aid at 4x rate of Group B → Ratio = 0.25 (<0.8). FAIL.  
    *Stop here.* Disparity likely illegal unless justified (e.g., "Group A has 300% more homeless veterans").  

  ---

  ### **Straight Talk**  
  - **Arrears model:** Failed at Step 1. Your mate's "impossibility result" is irrelevant because the model is garbage-in-garbage-out. Fix the target and data before fairness math matters.  
  - **Legal-aid model:** Failed at Step 4. You now have a political firefight: allocating by pure need (Group A) looks discriminatory to Group B. No algorithm solves this.  
  - **The ugly truth:** Steps 3 and 4 are value judgments dressed as math. Demanding Equal Opportunity *feels* ethical but may drain resources from low-risk groups. The regulator's "number" is theater—what matters is who you're willing to harm.  

  **Bottom line:** Scrap the arrears model now. For legal-aid, either allocate hours by group quota (not risk score) or prepare for a lawsuit. No tech fixes human choices.
