prompt: |-
  I am a statistician who works mostly with causal inference and hierarchical modelling—DAGs, interventions, counterfactuals, confounding, mediation, effect modification, latent variables, measurement error, and the distinction between prediction and explanation. I have a longstanding interest in early modern astronomy, and I have never known quite what to do with Kepler's astrology. I know the caricature: a great astronomer who also cast horoscopes. But the more I read, the more it seems he was not defending the ordinary judicial astrology of his day. Treat the following as the position to be translated: Kepler wanted a reformed astrology grounded in astronomy and physics; the planets do not directly cause particular events; what matters is their geometrical configuration, especially the aspects; these configurations act on sublunary souls through a kind of harmony or resonance rather than through occult sympathies; and the resulting influence is not deterministic. I would like you to restate that position—as sympathetically and precisely as you can—in the vocabulary of modern causal inference and statistical modelling. Treat the translation as a serious exercise, not a metaphor. Where Kepler talks about harmony, the soul, or celestial influences, ask what the nearest counterparts are in a causal model: treatments, mediators, effect modifiers, latent variables, measurement error, or something else. Do not smuggle in the assumptions of modern statistics and call the result a translation; if a move is an interpretation rather than a translation, say so.

  Then give me a residue report. Which parts of the position translate cleanly into the causal-inference vocabulary? Which parts translate only with distortion, and what exactly gets distorted? Which parts cannot be expressed in that vocabulary at all? For the residue, I want a verdict on whether it reveals a limitation of the causal-inference framework or a lack of clarity in Kepler's own position. In particular, I am interested in whether his distinction between a reformed, physical astrology and ordinary judicial astrology can be stated as a distinction between a well-specified causal model and a predictive model with no causal warrant, or whether something important is lost in that formulation. I do not want citations, a reading list, or a bibliography; I want the reconstruction and the residue report.

  Please write in British English and structure the response in the following named sections, in this order: Translation (roughly 500–700 words); What survives cleanly (roughly 200–300 words); What survives only with distortion (roughly 200–300 words); What does not survive at all (roughly 200–300 words); Residue report and verdict (roughly 200–300 words).
