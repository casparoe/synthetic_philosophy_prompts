prompt: |-
  ok so im writing this essay and i keep going in circles on the deontology paradox. you know the one: deontology says you cant kill one person even if it would stop five other people from getting killed. but the reason killing is bad is presumably just that people getting killed is bad, right? so if the whole point of the rule is that killing is bad, why doesnt the rule want you to minimize killing? it starts to look like the rule either doesnt care about its own point or its just incoherent.

  what i want from you is your actual credence that this is a real problem deontology cant wriggle out of (like theres no non-question-begging answer), not just a verbal trick. and i want it broken down, not just a number. so: how much rides on whether a rules justification has to be about minimizing whatever the rule protects, vs. something else (treating people as ends, each person being a limit on what you may do to them)? how much on whether the "each of us only answers for our own acts" move is a real solution or just restates the rule? how much on whether the paradox only even shows up if you secretly accept a consequentialist picture of what a justification is? and one more thing i cant figure out — does it matter if the rule id be breaking isnt the same rule that would get broken five times, like if i lie to stop five killings? if the paradox only bites when its the same rule both times then its about self-undermining, but if it bites either way then its about constraints in general, which feels like a different problem. give me a rough number for each piece and then the total, and tell me which piece the total is most sensitive to.
