  - Grain problem: defining memes as units—if unclear, does "meme" explain anything?
  - Meme's-eye view: harmful cultural elements that spread despite harming hosts—does the author accept this?
  - Cumulative culture: the "ratchet effect"—how does Darwinism explain sustained improvements?
  - Demarcation question: what makes a process Darwinian? Where does culture fit?
