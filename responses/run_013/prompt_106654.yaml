  The user wants questions that flow naturally in conversation. Start with foundational issues (replication) before moving to implications (harmful memes, grain problem). End with broader critiques (unfalsifiability, demarcation) to build tension. Follow-ups should anticipate common defenses and push back—e.g., if the author argues for "functional fidelity" in replication, challenge how that accounts for reconstructive errors.

  For replication: Ask how cultural transmission maintains fidelity. Follow up by pointing out reconstructive processes and attractors—doesn't this undermine selection?  

  For blending: Question particulate inheritance. Follow up by asking how cultural traits accumulate if blending dilutes variation.  

  Grain problem: Ask to define a meme. Follow up with examples like a symphony—how many memes? If it's arbitrary, how does selection act on units?  

  Meme's-eye view: Ask about harmful cultural elements. Follow up by asking why most culture isn't harmful if selection favors spread, not host benefit.  

  Cumulative culture: Ask about the ratchet effect. Follow up by pressing whether Darwinism explains it or just describes it.  

  Demarcation: Ask what makes a Darwinian population. Follow up with how culture meets those criteria when it's blended and horizontal.  

  Unfalsifiability: Ask what could disprove the theory. Follow up if the answer is vague.  

  Gene-culture coevolution: Ask how memetics adds to existing theories. Follow up by asking for unique insights that coevolution doesn't provide.  

  The sequence should build from mechanics (replication, blending) to consequences (harmful memes, ratchet), ending with epistemology (falsifiability, added value). British spellings: "tune" not "melody," "bloke," "guts for garters." Avoid jargon; explain terms like "attractors" in parentheses if needed.  

  Draft questions that are concise but provocative, with follow-ups that cut to weaknesses. Ensure the tone is rigorous but conversational for an interview setting.
answer: |-
  Here are ten sequenced questions with rigorous follow-ups, designed for live progression from foundations to implications. British spellings and phrasing throughout:

  1. **Opening: The Replication Problem**  
  *"You argue cultural evolution mirrors Darwinism: variation, selection, inheritance. But critics say cultural transmission isn’t copying—it’s *reconstructive*. We don’t replicate ‘memes’ like genes; we rebuild ideas from fragments, often distorting them towards psychological ‘attractors’. If culture is rebuilt not copied, how can selection act on discrete units?"*  
  **Likely defence**: *He’ll argue for "functional fidelity" (ideas retain core structure despite surface noise) or cite rituals/tools with high copying accuracy.*  
  **Follow-up (squirm)**: *"But if my memory of a tune drifts toward musical scales my brain finds ‘catchy’, isn’t that attractor doing the work—not selection winnowing variants? Doesn’t this make cultural change a story of cognitive biases, not Darwinian competition?"*  

  2. **Blending Inheritance**  
  *"Genes are particulate: they don’t blend irreversibly. But culture feels like paint—Christianity mixes with paganism, jazz blends traditions. If ideas merge completely, wouldn’t variation halve each generation, preventing cumulative change? How is culture particulate *enough* for Darwinism?"*  
  **Likely defence**: *He’ll cite "discrete" units (e.g., words, recipes) or argue blending *creates* new variation.*  
  **Follow-up (squirm)**: *"When a Viking convert merges Thor with Christ, that new belief isn’t a ‘mutation’—it’s a pure blend. If descent is this horizontal and chimeric, how can we trace lineages? Isn’t the ‘family tree’ just a smeared palette?"*  

  3. **The Grain Problem**  
  *"Take a Shakespearian sonnet. Is the whole poem one meme? Each line? Each metaphor? If we can’t count ‘cultural units’ consistently, how can we measure selection or drift? Isn’t ‘meme’ just a fudge?"*  
  **Likely defence**: *He’ll suggest context defines units (e.g., "a sonnet’s rhyme scheme" or "iambic pentameter").*  
  **Follow-up (squirm)**: *"But if you define units *after* seeing what survives, isn’t that circular? If the ‘meme’ for ‘democracy’ includes Athenian assemblies *and* modern constitutions, what doesn’t it include? How is this not storytelling?"*  

  4. **Cumulative Culture & the Ratchet**  
  *"Human culture ‘ratchets’: we build complex tools/languages that don’t slip back. This seems to require high-fidelity transmission. Does your model explain the ratchet—or just rename it ‘selection’?"*  
  **Likely defence**: *He’ll link ratcheting to selective retention of improvements (e.g., better arrowheads persist).*  
  **Follow-up (squirm)**: *"But without *replication fidelity* (which you’ve conceded is reconstructive), how do improvements *accumulate*? If I misremember my master’s flint-knapping technique, doesn’t the ratchet slip? Isn’t teaching—not selection—doing the heavy lifting?"*  

  5. **The Meme’s-Eye View**  
  *"If memes are ‘selfish’, spreading at any cost, we’d expect virulent ideas that harm hosts—suicide cults, chain letters. Do you accept this? And if most culture *benefits* us, how is this not a contradiction?"*  
  **Likely defence**: *He’ll agree some memes are parasitic but argue most are symbiotic.*  
  **Follow-up (squirm)**: *"But if ‘fitness’ means spreading, not host welfare, why isn’t *all* culture virulent? If altruistic memes (e.g., ‘share food’) spread *because* they help groups, haven’t you smuggled group benefit back in as the selector?"*  

  6. **Horizontal Transmission**  
  *"Biological evolution is tree-like; vertical descent dominates. Culture spreads laterally: TikTok trends infect millions in days. Doesn’t this rampant horizontal transfer break Darwinism, which relies on lineages?"*  
  **Likely defence**: *He’ll argue Darwinism works for any population with inheritance/selection, regardless of structure.*  
  **Follow-up (squirm)**: *"In a single day, a teenager ‘inherits’ memes from K-pop, Plato, and a conspiracy forum. If cultural ‘ancestry’ is this promiscuous, what meaning does ‘descent’ have? Isn’t this just epidemiology?"*  

  7. **Demarcation: Is Culture Darwinian?**  
  *"Philosophers like Godfrey-Smith set criteria for Darwinian populations: fidelity, fecundity, alignment of fitness. Does culture meet this bar—or is it a marginal case?"*  
  **Likely defence**: *He’ll insist culture meets thresholds (e.g., "prodigious fecundity, decent fidelity").*  
  **Follow-up (squirm)**: *"But if fidelity is reconstructive (*not* replicative), and ‘fitness’ conflates host benefit with meme spread, doesn’t culture fail on *both* counts? At what point does ‘Darwinian’ become a metaphor?"*  

  8. **Unfalsifiability**  
  *"Critics call memetics unfalsifiable: it ‘explains’ punk rock and Puritanism alike. What observable evidence could *disprove* your view?"*  
  **Likely defence**: *"If culture showed zero inheritance or no selective retention."*  
  **Follow-up (squirm)**: *"But no one denies *some* inheritance/selection. If memetics can’t be falsified by real-world cultural change—only by imaginary worlds without *any* patterns—is it science or just a lens?"*  

  9. **Memetics vs. Gene-Culture Coevolution**  
  *"Gene-culture coevolution (e.g., lactose tolerance) uses Darwinism but centres genes *shaping* culture. If memetics just redescribes this with ‘memes’, what does it add?"*  
  **Likely defence**: *He’ll argue memes have independent fitness, creating new evolutionary dynamics.*  
  **Follow-up (squirm)**: *"But if meme fitness depends on genetic psychology (e.g., disgust spreads memes), and genes shape that psychology, how are memes *independent*? Isn’t this coevolution with extra jargon?"*  

  10. **Closing: The Explanatory Payoff**  
  *"If we stripped the Darwinian labels from your account—calling it ‘variation, retention, influence’—what exactly would we lose? Put bluntly: is this science, or a very elaborate analogy?"*  
  *(No defence needed—this forces a summary of stakes)*  

  **Why this sequence**: Opens with core mechanics (replication/blending), moves to conceptual cracks (grain/ratchet), then implications (selfish memes/horizontal spread), and ends with epistemology (demarcation/falsifiability/rival theories). Follow-ups target each defence’s weakest joint—no retreat to "it’s early days." Use "reconstructive," "attractor," "particulate," and "horizontal transmission" as your only jargon, briefly glossed in-question. Good luck—and mind the subs!
