answer: |-
  Fair challenge. You're right that *today's* machines underflow at 10^-(10^10) – it rounds to zero. But ethics isn't bound by *current* hardware limits. The fanatic's core claim is *logical*, not computational: if you accept that probability (p) and utility (U) are meaningful *in principle*, then p * U is the quantity you *should* act on, even if you can't compute the exact number. Your machine rounding it to zero is a flaw in the *tool*, not the *principle*. 

  Think of it like this: imagine a simpler case, p = 1/10^6, U = 10^6 lives saved. Your calculator handles it: EV = 1 life. Now scale both up proportionally: p = 1/10^10, U = 10^10 lives. The *ratio* is identical: EV = 1 life. Your machine might *still* underflow the probability, but the *logical structure* demands the same consideration. The fanatic argues that the *structure* holds even when the numbers get so vast we can only gesture at them symbolically. The machine's failure isn't ethical justification to ignore the bet; it's just a practical limitation we wish we could overcome. You wouldn't claim the *probability* of a real, physical event (however minuscule) is *truly* zero just because your float underflows, right? The fanatic applies that to value too. Your move?
