answer: |-
  ### Restatement in Your Vocabulary

  In your prediction league, forecasters submit probabilities for specific questions (e.g., "Will it rain tomorrow?"), where outcomes are binary (e.g., 1 if rain, 0 otherwise). You score forecasts using a rule like the **squared gap** (Brier score: \((outcome - probability)^2\)) or the **negative logarithm** (log score: \(- \ln(probability)\) if the outcome occurs, \(- \ln(1 - probability)\) otherwise). Both rules are **proper**: forecasters maximize their expected score by stating their true probability, avoiding hedging (e.g., biasing toward 0.5 to minimize risk).

  The epistemological program argues:  
  - **Accuracy is the sole virtue** of a degree of belief. A "good" forecast is one that minimizes expected score under your chosen rule.  
  - **Probability calculus is enforced by dominance**:  
    If a forecaster violates probability rules (e.g., assigns \(p(A) + p(\text{not } A) \neq 1\), or fails additivity for mutually exclusive events), their forecasts can be *accuracy-dominated*. This means there exists an alternative, coherent set of probabilities (obeying probability rules) that scores **better** than the incoherent set **no matter what outcomes occur**.  
  - **Conditionalization is enforced similarly**:  
    When new evidence arrives, updating forecasts by Bayes' rule (conditionalization) avoids dominance. Any other update rule can be beaten by conditionalization in all possible future outcomes.  
  - **Calibration is secondary**:  
    While calibration (e.g., 70% forecasts should win 70% of the time) is desirable, it’s not the core goal. A coherent forecaster may be miscalibrated but still avoid dominance.  

  The league table ranks forecasters by total score (summed over questions), and dominance implies that incoherent forecasters will **always lose** to some coherent rival across all possible outcome combinations.

  ---

  ### Residue Report  
  The translation reveals what maps cleanly, what distorts, and what has no counterpart in your vocabulary. Your suspicions about fixed questions/scoring and stated probabilities (vs. mental states) are crucial.  

  #### 1. **Clean Translations** (Claims directly about scoring):  
     - **Propriety discourages hedging**:  
       Stating true probabilities maximizes expected score. This maps perfectly: your scoring rules incentivize honesty.  
     - **Dominance for coherence**:  
       If a forecaster submits incoherent probabilities (e.g., \(p(A) = 0.6\), \(p(\text{not } A) = 0.5\)), a coherent rival (e.g., \(p(A) = 0.6\), \(p(\text{not } A) = 0.4\)) will beat them *no matter what happens*. This is a direct claim about your league: incoherent forecasts are guaranteed losers.  
     - **Dominance for conditionalization**:  
       In multi-question sequences with evidence (e.g., forecasting Tuesday’s weather given Monday’s), updating via Bayes’ rule avoids being dominated. Distortions arise only if your league lacks sequential questions with evidence.  

  #### 2. **Distorted or Partial Translations**:  
     - **Accuracy as the sole virtue**:  
       This *seems* clean—your scoring rules define accuracy. But the epistemologist’s claim that accuracy exhausts "goodness" is normative: it dismisses other virtues (e.g., insightfulness, justification). In your league, accuracy *is* the sole virtue by fiat (the rules), but this doesn’t resolve whether it *should* be in broader contexts.  
     - **Calibration’s role**:  
       Epistemologists treat calibration as a byproduct of coherence + evidence, not a goal. Your league might value calibration directly (e.g., tracking long-run frequency), but the argument distorts this: calibration without coherence can still be dominated.  

  #### 3. **No Counterpart** (Gaps in your vocabulary):  
     - **Mental states vs. stated probabilities**:  
       Your league scores **stated numbers**, not beliefs. The epistemologist cares about whether a mental state (credence) is rational *as a belief*. In your setup:  
       - A forecaster could state coherent probabilities while mentally disbelieving them (e.g., gaming the league).  
       - Conversely, an incoherent mental state might be honestly stated but still dominated.  
       The residue: **Belief itself is invisible**. Your vocabulary can’t express "mental incoherence," only "submitted incoherence."  
     - **Source of questions/outcomes**:  
       Your questions are fixed externally (by you), and outcomes are facts. Epistemologists assume beliefs are about mind-independent events, so this maps cleanly *if* we ignore how questions are chosen.  
     - **Justification/evidence**:  
       Your league doesn’t require forecasters to base probabilities on evidence. Epistemologists argue that rational beliefs must respond to evidence—but this isn’t enforced by scoring rules alone.  

  #### 4. **Your Suspicions: Where Philosophy Lives**  
  Your distinctions—fixed questions, external scoring, probabilities as numbers—are **exactly where philosophical content resides**:  
     - **Fixed questions**: Epistemologists assume beliefs are about objective, external events. Your league mirrors this, so no issue.  
     - **Scoring by you**: The choice of scoring rule (e.g., Brier vs. log score) is arbitrary in your league but consequential for epistemologists. They need **strictly proper rules** to ground propriety/dominance, yet debate which rule reflects "accuracy" best. This is a philosophical, not mathematical, choice.  
     - **Stated probability (number) vs. mental state**: This is the **core residue**. The epistemological program conflates:  
       - *Stated probabilities* (behavioral): Scored in your league.  
       - *Mental credences* (psychological): What epistemologists *really* care about.  
       **Distortion**: Dominance arguments show that *stated incoherence* is risky, but say nothing about *mental incoherence* unless we assume forecasters always state their true beliefs. Propriety encourages this, but your league can’t enforce it.  

  #### 5. **Defect or Unclarity?**  
  The residue is **not a defect** of your vocabulary. It reveals unclarity in the epistemological position:  
     - **Problem 1**: The slide from "accuracy" to "rational belief." Accuracy is defined for **stated forecasts**, but epistemologists use it to judge **mental states**. Your league shows this leap isn’t automatic: stated probabilities can be accurate without reflecting beliefs, and beliefs can’t be scored directly.  
     - **Problem 2**: **Dominance arguments assume universality**. They require scoring *all possible beliefs* an agent holds. Your league only scores specific, externally chosen questions. If a forecaster is incoherent on unscored beliefs, it might not show up—undermining the claim that "all incoherence is dominated."  
     - **Problem 3**: **Evidence and updating** rely on implicit assumptions. Your league lacks a built-in mechanism for evidence (e.g., "Update your forecast if it rains today"), making conditionalization feel tacked on.  

  **Verdict**: The epistemological position is **less clear than it looks**. Your vocabulary exposes that dominance arguments work for *behavior* (stated probabilities) but not necessarily for *psychology* (mental states). The position’s strength is in showing how scoring rules incentivize coherence; its weakness is in conflating behavior with belief.  

  ### Practical Implication for Your League  
  Stick to **propriety** and **dominance arguments** for what they are: tools to incentivize honest, coherent *statements*. If you want forecasters to genuinely *believe* their probabilities, that’s a separate, psychological goal—one your scoring rules can encourage but not guarantee. The choice between Brier and log scores matters less than ensuring propriety; both enforce coherence.
