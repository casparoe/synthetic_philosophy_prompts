prompt: |-
  I have been reading rationalist blogs and the alignment-adjacent interpretability literature for years, and I keep running into the same gap: nobody states cleanly what would have to be true for a claim of the form "this trained network represents property P" to be warranted. Before I read another paper that infers a representation from a probe or a feature dictionary, I want the specification. Set out the desiderata for an adequate account of neural representation — the cases it must get right, the distinctions it must not collapse, and the results it must stay consistent with — giving the consideration behind each requirement and marking which are non-negotiable and which are commitments of a particular camp.

  Write it for a specific purpose: I want to take a real trained network, poke at it with the tools I actually have (probes, ablations, activation patching, feature dictionaries), and decide whether a claimed internal representation is real. So the account has to be usable on a black box; an account that only works if I can read the source code or the mind is not what I am after. I am also suspicious of any criterion that makes the question come out trivially true or trivially false.

  Cases I want handled, and I would rather see the requirements motivated by these than stated abstractly:

  - a single direction that is decodable for two unrelated properties, or a feature whose activating inputs look like an uninterpretable grab bag, so that no single content is the natural reading;
  - an internal state that a linear probe reads accurately but that ablation shows the network does not use, and the converse, a state the network plainly uses but that no probe decodes;
  - a state that is used only to modulate confidence rather than to carry content;
  - a student network trained on a teacher's outputs that ends up with an internal variable it never needed for its own task;
  - a network trained on data generated by an algorithm we can read, so that the ground-truth intermediate quantities are known and can be compared;
  - a network whose internals amount to a faithful simulation of a physical system it was trained to predict;
  - two networks with identical behavior and different internals, or a rotation of one network's internal basis that leaves behavior fixed.

  Distinctions I do not want collapsed: having information about P versus representing P; representing P versus computing with something that merely correlates with P; a representation that is genuinely distributed versus one that is only an artifact of the probe; the content of a state versus its causal role.

  Results it must not contradict: that behavior can be preserved under internal permutation or rotation; that a sufficiently flexible probe can decode almost anything; that internals can change while behavior stays fixed; and that a network can be trained on fictions, so content need not be inherited from a real referent.

  Tell me which requirements are genuinely necessary and which are the prejudices of one camp, whether any pair of them cannot be jointly satisfied, and which single requirement excludes the most candidates. Then, briefly, where the main families stand against the list — probing as ground truth, dictionary or sparse-coding decompositions, interventionist accounts, and the eliminativist line that we should drop representation talk altogether. Keep the weight on the criteria; I will do my own scoring if I need it.
reasoning: |-
  We are building a set of desiderata for an account of neural representation that must be usable on a black-box network with tools like probes, ablations, activation patching, and feature dictionaries. The account must handle specific cases and respect key distinctions without collapsing them. We also must avoid triviality and respect known results.

  We'll start by listing the requirements (desiderata) and then address the cases, distinctions, and results. Each requirement will be marked as non-negotiable (N) or camp-specific (C). We'll then briefly discuss how the main families of approaches fare against these.

  **Desiderata for an Account of Neural Representation**

  1. **Non-Triviality (N)**: The account must not make representation trivially true (e.g., because a linear probe can decode anything) or trivially false (e.g., because of internal rotations or permutations). It must be possible to have both genuine representations and non-representations.

  2. **Causal Relevance (N)**: The state must play a causal role in the network's behavior with respect to the property P. If ablating or patching the state does not affect the network's output in a way that is specific to P, then the state does not represent P. This requirement handles the case of a state that a probe decodes but the network doesn't use, and the converse (a state the network uses but no probe decodes). It also addresses the distinction between having information and representing (the latter requires causal role).

  3. **Specificity (N)**: The representation must be specific to P. If a state is decodable for multiple unrelated properties (or activating the state leads to an uninterpretable grab bag of inputs), then it does not naturally represent any single P. This requirement ensures that the representation is not overly broad or ambiguous.

  4. **Distributed Representation without Artifact (N)**: The account must be able to distinguish genuinely distributed representations (where multiple units together represent P) from artifacts of the probe (e.g., a linear probe decoding P from a state that is not causally involved). This requires that the causal relevance is established for the distributed state as a whole.

  5. **Modulatory States (N)**: The account must handle states that modulate confidence or other aspects without directly carrying content about P. This might be a camp-specific commitment (C) if one insists that representation must carry content, but we mark it (N) because the case must be handled: such states are common and should not be misclassified as representing P.

  6. **Ground-Truth Alignment (C)**: In cases where we know the ground-truth intermediate quantities (e.g., in a network trained on algorithmic data), the account should ideally recover these as representations. However, this is camp-specific because some camps (e.g., eliminativists) might not require alignment with ground truth.

  7. **Simulation Faithfulness (C)**: For a network simulating a physical system, the internal states that correspond to the state variables of the system should count as representations. This is camp-specific because it relies on a notion of structural similarity that might not be necessary for all accounts.

  8. **Independence of Implementation (N)**: The account must be consistent with the fact that two networks with identical behavior can have different internal structures (including rotations and permutations). Thus, the account cannot rely on the exact basis of the activations but must be invariant to such transformations.

  9. **No Requirement for Real Referent (N)**: The account must allow for representations of fictions (i.e., properties that do not have a real referent in the world). Thus, the content of the representation is not tied to a causal history with a real object.

  10. **Robustness to Probes (N)**: The account must not be misled by the fact that a sufficiently flexible probe can decode almost anything. Therefore, mere decodability is insufficient for representation.

  **Handling the Cases:**

  - **Single direction decodable for two unrelated properties or uninterpretable grab bag**: Handled by *Specificity* (requirement 3) and *Causal Relevance* (2). If the state is not causally relevant to both properties (or the grab bag) then it doesn't represent either.

  - **Probe decodes but ablation shows non-use, or vice versa**: Handled by *Causal Relevance* (2). The state must be causally involved in the behavior related to P.

  - **State used only to modulate confidence**: Handled by *Modulatory States* (5). We must not classify it as representing P if it does not carry content about P but only modulates processing.

  - **Student network with unneeded internal variable**: Handled by *Causal Relevance* (2). If the variable is not used by the network for its task, then it does not represent P (even if it was in the teacher). However, note that if the variable is causally active in the student (even if not strictly necessary) then it might represent P. The key is causal role in the student.

  - **Network trained on algorithmic data with known intermediates**: Handled by *Ground-Truth Alignment* (6). This is a camp-specific requirement.

  - **Network simulating a physical system**: Handled by *Simulation Faithfulness* (7), which is camp-specific.

  - **Two networks with identical behavior and different internals, or rotation**: Handled by *Independence of Implementation* (8). The account must be invariant to such changes.

  **Respecting Distinctions:**

  - Having information vs representing: *Causal Relevance* (2) ensures that representation requires causal role, not just information.
  - Representing P vs correlating with P: *Causal Relevance* (2) and *Specificity* (3) together: correlation without causal role is not representation.
  - Distributed representation vs artifact: *Distributed Representation without Artifact* (4) and *Causal Relevance* (2) for the distributed state.
  - Content vs causal role: The account must not collapse these, and *Causal Relevance* (2) is about the role, while the content is what P it represents. The content must be fixed by the causal role and the context (but note *No Requirement for Real Referent* (9)).

  **Respecting Results:**

  - Behavior preserved under rotation: *Independence of Implementation* (8).
  - Flexible probe decodes almost anything: *Robustness to Probes* (10) and *Non-Triviality* (1) rule out using decodability alone.
  - Internals change while behavior fixed: *Independence of Implementation* (8) and *Causal Relevance* (2) must be defined in a way that if the behavior is fixed, the causal role might be taken over by other states.
  - Training on fictions: *No Requirement for Real Referent* (9).

  **Potential Conflicts:**

  - *Ground-Truth Alignment* (6) and *Simulation Faithfulness* (7) might conflict with *Independence of Implementation* (8) if the ground truth or simulation structure is tied to a particular basis. But note that we can require that the representation is aligned in a basis-invariant way (e.g., by the pattern of causal relations).

  - *Specificity* (3) and *Distributed Representation* (4) might be in tension because distributed representations often represent multiple properties. However, we can require that the representation of P is specific in the sense that the state (or state component) is causally relevant to P and not to unrelated properties.

  **Which requirement excludes the most candidates?**  
  *Causal Relevance* (2) is likely the most stringent because it rules out:
  - Probes that decode but are not used by the network.
  - States that are merely correlated but not causal.
  - Unused states in the student network.

  It is also non-negotiable.

  **Where the Main Families Stand:**

  1. **Probing as Ground Truth**: This approach (e.g., linear probes) often fails *Robustness to Probes* (10) and *Causal Relevance* (2). It may also fail *Specificity* (3) because a direction might decode multiple things. Thus, it violates non-triviality.

  2. **Dictionary/Sparse-Coding Decompositions**: These methods (e.g., feature dictionaries) might satisfy *Specificity* (3) if features are specific, but they often lack *Causal Relevance* (2) because they are based on activation patterns without intervention. They might also fail *Distributed Representation without Artifact* (4) if they force a sparse decomposition on a distributed representation.

  3. **Interventionist Accounts**: These (e.g., activation patching, ablation) are strong on *Causal Relevance* (2) and *Robustness to Probes* (10). They may struggle with *Distributed Representation without Artifact* (4) because interventions on individual units might not capture distributed patterns. Also, without a theory of content, they might not handle *Specificity* (3) or *Modulatory States* (5) well.

  4. **Eliminativism**: This camp (drop representation talk) rejects the entire project, so it avoids all the problems but also does not provide an account. It would not satisfy the desiderata because it doesn't provide criteria for when we can say "this network represents P".

  **Conclusion:**

  The most promising approach seems to be an interventionist account that incorporates causal relevance and specificity. However, it must be extended to handle distributed representations and modulatory states without collapsing the distinctions. The non-negotiable requirements (especially causal relevance) are the core, and any adequate account must meet them.
answer: |-
  Below, I define a set of desiderata for an account of neural representation, tailored to your goal: a usable, non-trivial criterion that works on a black-box network with tools like probes, ablations, activation patching, and feature dictionaries. The requirements are grounded in your listed cases, distinctions, and results, with explicit justifications. I mark each as **non-negotiable** (N) if it's essential for any minimally adequate account, or **camp-specific** (C) if it reflects a commitment of particular schools (e.g., causal, functionalist, or eliminativist approaches). I then address conflicts, which requirement excludes the most candidates, and a brief survey of how major families fare.

  ---

  ### **Desiderata for an Account of Neural Representation**
  1. **Causal Relevance for P (N)**  
     - **Requirement**: The state must play a non-redundant causal role in the network's computation of outputs that depend on P. This must be detectable via interventions (e.g., ablation or patching alters behavior specific to P).  
     - **Justification**: Handles your cases:  
       - A probe-decodable state that ablation shows is unused fails (it has information but no causal role).  
       - Conversely, a state the network uses but probes can't decode may still represent P if it has a causal role (e.g., due to distributed encoding).  
       - Distinguishes "has information about P" from "represents P" (correlation isn't enough).  
       - Rules out the student network's unused internal variable (no causal role).  
     - **Why non-negotiable?** Without causal relevance, representation collapses into mere correlation, violating key distinctions and enabling false positives (e.g., unused probe-decoded directions).

  2. **Specificity to P (N)**  
     - **Requirement**: The state must not be interpretable as representing multiple unrelated properties P₁, P₂, ... without loss of coherence. If activating the state produces an arbitrary set of outputs (e.g., a grab bag), or if it is decodable for two orthogonal properties, it does not represent a single P.  
     - **Justification**: Addresses your case of a single direction decodable for unrelated properties (e.g., a "superposition" where no natural reading exists). Also ensures that modulatory states (e.g., confidence signals) aren't misclassified as representing content if they lack specificity.  
     - **Why non-negotiable?** Prevents overassignment of representation to noisy or multifunctional states. Without it, any decodable property could be claimed, trivializing the concept.

  3. **Invariance Under Behavior-Preserving Transformations (N)**  
     - **Requirement**: The account must not depend on the exact implementation (e.g., basis vectors). If two networks have identical input-output behavior but different internals (e.g., due to rotation), representations must be assignable in both without contradiction.  
     - **Justification**: Respects your result that behavior can be preserved under permutation/rotation. Handles the case of two networks with identical behavior but different internals.  
     - **Why non-negotiable?** Without this, the account is implementation-dependent, violating black-box usability and making representation fragile to trivial changes.

  4. **Non-Dependence on Probes Alone (N)**  
     - **Requirement**: Decodability by a probe is insufficient for representation; it must be paired with causal evidence. A probe may decode P from noise if flexible enough, but this doesn't imply representation.  
     - **Justification**: Aligns with your result that sufficiently flexible probes can decode almost anything. Prevents false positives from probe-based claims (e.g., a direction decodable for P but unused).  
     - **Why non-negotiable?** Probe-only accounts conflate information with representation, ignoring causal role and specificity.

  5. **Content-Role Distinction Preservation (N)**  
     - **Requirement**: The account must separate the *content* of a state (what P it represents) from its *causal role* (how it affects behavior). Neither determines the other alone.  
     - **Justification**: Handles modulatory states (e.g., a confidence signal may have a causal role but no content about P) and cases where a state correlates with P but isn't used for it. Prevents collapse of "represents P" vs. "computes with a correlate of P".  
     - **Why non-negotiable?** This distinction is core to cognitive science; without it, all causal contributors become "representations," trivializing the concept.

  6. **Allowance for Fictional or Groundless Content (N)**  
     - **Requirement**: Representation of P does not require a real-world referent. P can be fictional (e.g., a network trained on synthetic data).  
     - **Justification**: Respects your result that networks can be trained on fictions. Ground-truth intermediates (e.g., in algorithmic data) are useful but not necessary.  
     - **Why non-negotiable?** Ties representation to external reality, ignoring cases like simulations or hallucinations.

  7. **Accommodation of Distributed Representations (C: Functionalist Camp)**  
     - **Requirement**: Distributed states (across multiple units) can represent P if they jointly satisfy other desiderata (e.g., causal relevance and specificity). This must not be conflated with probe artifacts.  
     - **Justification**: Handles cases like a faithful physical simulation where P is encoded across units. Distinguishes genuine distribution from probe-induced illusions.  
     - **Why camp-specific?** Eliminativists might reject distributed representations as not "real," while sparse-coding camps prefer localized features.

  8. **Recoverability of Ground-Truth Intermediates (C: Realist Camp)**  
     - **Requirement**: In networks trained on data with known algorithmic intermediates, the account should identify states matching these intermediates.  
     - **Justification**: For your case of a network trained on readable algorithmic data, this ensures alignment with verifiable structure.  
     - **Why camp-specific?** Not necessary for all networks (e.g., those without clear ground truth), and eliminativists might deny the need for alignment.

  9. **Simulation Faithfulness (C: Structuralist Camp)**  
     - **Requirement**: For networks simulating physical systems, states that mirror the system's variables (e.g., velocity in a physics predictor) should count as representations.  
     - **Justification**: Handles your case of a network simulating a physical system.  
     - **Why camp-specific?** This assumes a structural isomorphism that may not generalize (e.g., to non-simulation tasks).

  ---

  ### **Conflicts and Tensions**
  - **Non-negotiable requirements are jointly satisfiable** but require balancing:  
    - *Causal Relevance* and *Invariance* can conflict if causal roles are tied to specific bases (e.g., in a rotated network). Resolution: Define causal roles at the level of *functional groups* (e.g., activation subspaces) rather than individual units.  
    - *Specificity* and *Distributed Representations* may clash if distributed states encode multiple properties. Resolution: Require that the state's causal role is *selective* for P (e.g., patching affects P but not unrelated outputs).  
  - **Camp-specific requirements may conflict**: *Recoverability of Ground Truth* (realist) and *Invariance* (non-negotiable) can clash if ground truth is basis-dependent. Resolution: Ground truth must be defined functionally (e.g., via causal role) to align with invariance.  
  - **Most exclusionary requirement**: *Causal Relevance (N)*. It excludes:  
    - Probe-only claims (no causal role).  
    - Unused student-network variables (no role in computation).  
    - Superficial correlations (no role in behavior).  
    This requirement forces integration of interventions (ablation/patching) and is the primary guard against trivial decodability.  

  ---

  ### **How Major Families Fare Against the Desiderata**  
  Here's a rapid assessment of whether each approach **satisfies (✓)**, **partially satisfies (~)**, or **fails (✗)** key requirements. Focus is on black-box usability and non-triviality.

  1. **Probing as Ground Truth** (e.g., linear classifiers on activations):  
     - Fails *Causal Relevance (N)* (probes don't require causal role).  
     - Fails *Specificity (N)* (one direction can decode multiple properties).  
     - Fails *Non-Dependence on Probes (N)* (relies solely on decodability).  
     - **Verdict**: ✗ Non-starter for your goal—violates core non-negotiables.  

  2. **Dictionary/Sparse-Coding Decompositions** (e.g., sparse autoencoders, feature visualization):  
     - ~ *Specificity (N)*: Can identify specific features but may create artificial localizations (e.g., "grab bag" features).  
     - ✗ *Causal Relevance (N)*: Rarely tested with interventions; features may not be causal.  
     - ~ *Distributed Representations (C)*: Tends to force sparsity, potentially misrepresenting distributed codes.  
     - **Verdict**: Weak on causal evidence; usable only if integrated with interventions.  

  3. **Interventionist Accounts** (e.g., causal tracing, patching, ablation):  
     - ✓ *Causal Relevance (N)*: Built on interventions.  
     - ~ *Specificity (N)*: Requires careful design (e.g., patching must isolate P-specific effects).  
     - ✓ *Content-Role Distinction (N)*: Separates causal impact from content.  
     - ✗ *Simulation Faithfulness (C)*: May miss structural similarity if interventions are coarse.  
     - **Verdict**: Strongest candidate—meets non-negotiables but needs supplements for specificity and distribution.  

  4. **Eliminativism** (drop "representation" talk):  
     - ✗ *All non-negotiables*: Rejects the project, so no account is provided.  
     - **Verdict**: Fails your purpose entirely—you want criteria to evaluate claims, not deny them.  

  ---

  ### **Synthesis: A Usable Account**  
  For your goal, an **interventionist-functionalist account** best satisfies non-negotiables:  
  - **Core criterion**: A state (or group) represents P iff:  
    (a) It has *specific causal relevance* to P: Intervening on it (e.g., patching/ablation) robustly alters behavior dependent on P but not unrelated outputs.  
    (b) It is *invariant*: This role persists under behavior-preserving transformations (tested via re-basing or comparing functionally equivalent networks).  
    (c) It is *non-trivially specific*: Activating the state produces coherent P-relevant outputs (not grab bags), and it isn't decodable for orthogonal properties without loss of coherence.  
  - **Tools required**: Probes (for specificity tests), ablations/patching (for causality), feature dictionaries (for interpretability, but not sufficient alone).  
  - **Handles your cases**:  
    - Unused probe-decodable state? Fails (a).  
    - Used but non-decodable state? May pass if (a) and (c) hold (e.g., distributed encoding).  
    - Modulatory state? Only represents content if (a) and (c) are met (else, it's a role without content).  
    - Ground-truth intermediates? Recovered if (a) aligns with known causal structure (camp-specific bonus).  

  This account avoids triviality: Representation isn't guaranteed (due to causal and specificity bars) but isn't impossible (e.g., physical simulations pass). It rejects probe-only or structure-only claims, requiring integrated evidence. If you adopt this, start with interventionist tools (patching/ablation) and augment with probes/dictionaries for specificity—this mirrors state-of-the-art methods like causal scrubbing or interchange interventions.
