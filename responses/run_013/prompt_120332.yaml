prompt: |-
  Hey, I could use some help with a passage I keep bouncing off of. It's in Sidgwick's Methods of Ethics, late in the book, where he's working out the point of view of the universe and ends up with the dualism of practical reason. I don't have the book in front of me and I don't want to mangle his actual sentences, so what follows is my own paraphrase of the stretch I mean rather than his prose.

  Roughly, the move is this. From the point of view of the universe, the good of any one person is of no more importance than the good of any other, and my own good is just one good among many, so reason from that standpoint tells me to maximize the total. Fine. But then he also insists, in the same vicinity, that the distinction between any one person and any other is real and fundamental, and that reason can't dissolve it. And that's what seems to let rational egoism survive alongside the impartial principle instead of being refuted by it, which is the dualism, and which he treats as a crisis rather than a resting place.

  What I can't get straight is what exactly the separateness claim is doing. On one reading it's a metaphysical claim about persons being genuinely distinct existences, and that's the thing later writers pick up when they attack utilitarianism for treating the collective as if it were a single subject who could be compensated across persons. On another reading it's a much thinner point, something practical or epistemic, like: I can't actually inhabit the aggregate standpoint or desire from it, so the impartial principle can't grip me the way self-interest does. Which one does Sidgwick need for the dualism to go through?

  And then the bit that really snags me. If the distinction between persons is real and fundamental, why doesn't that immediately block the move to treating my own good as no more important than anyone else's? It looks like the same fact is doing two opposite jobs, blocking aggregation in one place and being denied any blocking force in another. Or is it not the same fact, and I'm just conflating a claim about what exists with a claim about what reasons there are?

  Can you walk me through the argument and tell me whether the two claims actually conflict or whether I'm mixing up two different levels? And relatedly, how does the separateness of persons objection to utilitarianism as it's usually stated relate to what Sidgwick is up to here, is it a descendant of his point or a different animal entirely? I don't need reading lists or page numbers, I need to understand the thing.
