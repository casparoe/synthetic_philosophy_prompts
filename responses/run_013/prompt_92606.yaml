  A. No, both are equally valuable.
  B. Yes, Tara's belief is more valuable because it is a product of her own cognitive achievement.
  C. Yes, Tara's belief is more valuable because she is in a position to use it more effectively (explain, defend, etc.) — entitlement or instrumental.

