  The user identifies three scenarios where a theory might be considered "right but early": scope retreat (restricting the domain after failure), date deferral (moving the goalposts by claiming it's about tendencies rather than dates), and mechanism swap (correct outcome but wrong causal pathway). They want to develop a principled way to distinguish legitimate theoretical revisions from illegitimate rescues.

