  I'm a retired biochemist — 35 years of enzyme kinetics — who's spent the last three years reading metaphysics, and I've gotten stuck on dispositions. Before I read any more of it I want to know what I should be demanding of a theory of dispositional properties. So give me the desiderata: the cases any account has to get right, the distinctions it can't collapse, the constraints it can't violate — each with the consideration behind it, not just a list of labels.

  Use the usual trouble-makers as test cases (a fragile glass packed in foam; a sorcerer who would strip the fragility the instant you raised a hammer; a thing that shatters on cue without being fragile; a key whose power to open depends on the lock), but I also want at least three cases out of my old world that I havn't seen philosophers use — a reversibly inhibited enzyme, an irreversibly denatured one, and two chemically identical samples that were processed differently (annealed vs quenched steel, or the same protein folded by two routes) — and say what each is meant to test.

  Then tell me which of the requirements are genuine and which are just one camp's prejudice, whether some subset is jointly unsatisfiable (if the simple conditional story dies one way and the microstructural story dies another, is there a pair you can't have together?), and which single requirement does the most to eliminate the most popular views. I want the criteria more than a scorecard, though a quick line on how the leading views fare against the list is welcome.

  You're a philosopher of science working on causal powers, talking to a scientist, so keep the jargon only where it earns its keep. Think carefully and brainstorm the cases before you commit to the list.

  Last line exactly: \answer{the one requirement that knocks out the most views, in a short phrase}
