answer: |-
  ### Clinical Ethics Decision Procedure for Advance Directive Dissent

  **Foundational Distinctions:**  
  The authority of an advance directive rests on three grounds:  
  - **Value**: Honors the person's settled values and autonomous choice.  
  - **Evidence**: Provides inferential evidence about the patient's likely current preferences.  
  - **Authorship**: Binds as an exercise of narrative control over one's life story, even if disowned.  

  **Excluded Scenarios:**  
  - Temporary/reversible conditions where capacity may be restored within the decision window (e.g., acute delirium).  
  - Ambiguous or invalid directives.  
  - Disputes over medical appropriateness or resource allocation.  
  - Minors or directives made under duress.  

  ---

  ### Decision Procedure  
  *To be completed at bedside within 60 minutes. Questions must be answered sequentially.*

  1. **Assess current decision-making capacity**  
     - *Question:* Does the patient have capacity to make *this specific decision* at this moment?  
     - *Ground:* Evidence (current expression trumps prior evidence).  
     - *Sufficient answer:*  
       - **Yes**: Respect current decision. **Stop.**  
       - **No**: Proceed to Step 2.  

  2. **Validate directive applicability**  
     - *Question:* Is the directive legally valid and unambiguously applicable to the current clinical scenario?  
     - *Ground:* Evidence (factual assessment of relevance).  
     - *Sufficient answer:*  
       - **Yes**: Proceed to Step 3.  
       - **No**: Hand to surrogate for substituted judgment. **Stop.**  

  3. **Detect current dissent**  
     - *Question:* Is the patient *actively dissenting* from the directive’s instruction?  
     - *Ground:* Evidence (assesses if conflict exists).  
     - *Sufficient answer:*  
       - **No dissent**: Follow directive. **Stop.**  
       - **Dissent**: Proceed to Step 4.  

  4. **Categorize conflict type**  
     - *Question:* Is the conflict:  
       - **Refusal conflict** (directive *refuses* treatment, patient *wants* it)? OR  
       - **Demand conflict** (directive *demands* treatment, patient *refuses* it)?  
     - *Ground:* Value (asymmetry in ethical weight of refusal vs. demand).  
     - *Sufficient answer:* Categorize and proceed to Step 5 (refusal) or Step 6 (demand).  

  5. **Refusal conflict procedure** (Directive refuses treatment, patient wants it)  
     1. **Anticipated override clause?**  
        - *Question:* Did the directive explicitly instruct to override future dissent (e.g., "Even if I beg, do not treat")?  
        - *Ground:* Authorship (narrative control).  
        - *Sufficient answer:*  
          - **Yes**: Uphold refusal. **Stop.**  
          - **No/Unclear**: Proceed to 5b.  
     2. **Reversible impairment?**  
        - *Question:* Is dissent due to a *reversible* impairment the directive anticipated (e.g., acute psychosis)?  
        - *Ground:* Evidence (causal inference).  
        - *Sufficient answer:*  
          - **Yes**: Uphold refusal. **Stop.**  
          - **No**: Proceed to 5c.  
     3. **Prior self’s enduring intent**  
        - *Question:* Would the prior self, knowing of *this dissent*, still insist on refusal?  
        - *Ground:* Authorship + Value (narrative + values).  
        - *Sufficient answer:*  
          - **Yes/Unknown**: Uphold refusal. **Stop.** (Presumption for prior refusal).  
          - **No**: Provide treatment (hand to surrogate for consent). **Stop.**  

  6. **Demand conflict procedure** (Directive demands treatment, patient refuses it)  
     1. **Anticipated override clause?**  
        - *Question:* Did the directive explicitly instruct to override future refusal (e.g., "Medicate me even if I resist")?  
        - *Ground:* Authorship (narrative control).  
        - *Sufficient answer:*  
          - **Yes**: Provide treatment (if medically appropriate). **Stop.**  
          - **No/Unclear**: Proceed to 6b.  
     2. **Reversible impairment?**  
        - *Question:* Is dissent due to a *reversible* impairment the directive anticipated?  
        - *Ground:* Evidence (causal inference).  
        - *Sufficient answer:*  
          - **Yes**: Provide treatment (if medically appropriate). **Stop.**  
          - **No**: Proceed to 6c.  
     3. **Prior self’s enduring intent**  
        - *Question:* Would the prior self, knowing of *this refusal*, still insist on treatment?  
        - *Ground:* Authorship + Value (narrative + values).  
        - *Sufficient answer:*  
          - **Yes**: Provide treatment (if medically appropriate). **Stop.**  
          - **No/Unknown**: Uphold refusal. **Stop.** (Presumption against overriding current refusal).  

  ---

  ### Case Applications  
  **(a) ALS with directive refusing ventilator, now requesting intubation**  
  - Step 1: No capacity (respiratory failure, impaired cognition).  
  - Step 2: Directive valid/applicable.  
  - Step 3: Active dissent (requests intubation).  
  - Step 4: Refusal conflict.  
  - Step 5a: No explicit override clause.  
  - Step 5b: Dissent *not* due to reversible impairment (fear is rational).  
  - Step 5c: Prior self would likely uphold refusal (directive reflects settled values on quality of life).  
  - **Outcome:** Uphold refusal; no intubation.  
  - *Clinician discomfort:* High—patient is terrified and pleading.  
  - *Ground relied on:* Authorship + Value (narrative control + prior values).  

  **(b) Bipolar directive demanding medication, now manic and refusing**  
  - Step 1: No capacity (mania impairs insight).  
  - Step 2: Directive valid/applicable.  
  - Step 3: Active dissent (refuses medication).  
  - Step 4: Demand conflict.  
  - Step 6a: Explicit override clause (directive authorizes involuntary treatment).  
  - **Outcome:** Administer medication.  
  - *Clinician discomfort:* Moderate—coercion feels violating.  
  - *Ground relied on:* Authorship (explicit narrative control).  

  **(c) Dementia directive refusing antibiotics, now silent**  
  - Step 1: No capacity (advanced dementia).  
  - Step 2: Directive valid/applicable.  
  - Step 3: **No dissent** (cannot express preference).  
  - **Outcome:** Uphold refusal; no antibiotics.  
  - *Clinician discomfort:* High—pneumonia is treatable; patient may appear content.  
  - *Ground relied on:* Value + Authorship (autonomy + narrative).  

  ---

  ### What the Procedure Cannot Do  
  - Resolve disputes about directive validity or interpretation.  
  - Handle irreversible conditions not anticipated in the directive (e.g., radical dementia personality shifts).  
  - Override medical futility judgments.  
  - Address equity/fairness in resource allocation.  
  - Reconcile profound philosophical disagreements about personal identity.  

