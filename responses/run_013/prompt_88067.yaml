prompt: |-
  I teach a 90-minute session on the paradox of voting to about twenty second- and third-year undergraduates in political philosophy; they know a little decision theory but no social choice. Design an in-class activity that makes them feel the paradox rather than hear it described. The group must decide, under a small real stake, whether to turn out, where turning out costs each participant individually and the outcome is shared regardless of who paid. Arrange the rules so that abstaining is the individually rational move and the group still ends up worse off, so they run into the free-rider structure themselves; then add a second phase in which the same behaviour is redescribed as each voter having a negligible chance of being pivotal, and make them see that these are two different paradoxes sharing one name.

  Give me materials and setup, the payoff scheme (no real money — points or a shared prize the class can allocate), a timeline, any roles, and a debrief mapping what happened onto (i) the pivotal-vote account and (ii) the public-good/free-rider account, and then onto four responses: the expressive account of voting as consumption; the minimax-regret argument, that one should vote because the regret of having abstained in the world where one was pivotal is catastrophic whatever its probability; the universalisability move, asking what would happen if everyone in your position did likewise; and the evidential thought that choosing to vote is evidence that others like you will vote too, so the act might matter where it cannot be causally decisive. For each, say whether it solves the paradox, dissolves it by changing the payoffs, or only relocates the problem. Say what will predictably go wrong the first time I run it and how to handle it, and be frank about which feature of the paradox the activity cannot reproduce and that I must supply in the debrief.

  I don't need citations. Keep settled matters apart from what is genuinely contested among people who work on this, and don't present the expressive account as the consensus. End with a table with the columns 'Response', 'What it changes', 'Solves or dissolves', 'Standard objection'. British English throughout.
reasoning: |-
  We are designing an in-class activity to illustrate two aspects of the paradox of voting: the free-rider problem and the negligible pivotality. The activity should have two phases and a debrief that maps the experience to the theoretical accounts and responses.

  **Activity Title:** The Turnout Dilemma

  **Setup:**
  - **Participants:** 20 students.
  - **Duration:** 90 minutes total (activity: 45-50 minutes, debrief: 40-45 minutes).
  - **Stakes:** Use points (no real money). The points will be converted into a shared prize (e.g., the class decides how to allocate a fixed budget for snacks or a donation to a charity of their choice, or perhaps a small prize for the whole class like a pizza party). Alternatively, the points can be used to determine a grade bonus (e.g., extra credit points) but that might be too high-stakes. Let's use a shared prize.

  **Materials:**
  - A ballot box or a way to collect votes secretly.
  - Slips of paper for voting (or use an online form if available and quick).
  - A whiteboard or flip chart to record results and points.
  - A timer.
  - Handout with rules (one per student).

  **Rules and Payoff Scheme:**
  We simulate an election between two alternatives (A and B). The class will be divided into two groups of approximately 10 each (Group A supporters and Group B supporters). The division should be such that the groups are of unequal size to mimic a non-tied election. Let's say 12 in Group A and 8 in Group B (so A is the majority).

  Each student must decide whether to vote (at a cost) or abstain (no cost). The outcome (which alternative wins) is determined by the majority of votes cast. The winning alternative yields a group benefit to every member of that group, regardless of whether they voted or not.

  **Payoffs:**
  - If a student abstains, they pay no cost and receive the group benefit if their group wins.
  - If a student votes, they pay a cost of 2 points and receive the group benefit if their group wins.

  The group benefit is set such that it is higher than the cost, but only if the group wins. However, the benefit is received by all group members whether they voted or not.

  Specifically:
  - For a member of the winning group: 
    - If they voted: benefit - cost = 5 - 2 = 3 points.
    - If they abstained: benefit = 5 points (no cost).
  - For a member of the losing group: 
    - If they voted: 0 - 2 = -2 points (they bear the cost and get no benefit).
    - If they abstained: 0 points.

  **The Free-Rider Structure:**
  Each student in the majority group (A) has an incentive to abstain because:
  - If their group wins (which is likely because they are the majority), they get 5 points if they abstain (free-riding) but only 3 if they vote. 
  - If their group loses, they avoid the cost of voting by abstaining (0 points vs -2).

  Similarly, in the minority group (B), the incentive to abstain is even stronger because the chance of winning is low. But note: if too many in the majority abstain, the minority might win.

  **Phase 1: The Free-Rider Problem**
  1. Explain the rules and the payoff structure (handout and verbal).
  2. Assign each student to a group (Group A or Group B) by random draw (e.g., 12 A and 8 B). Make sure they know their group and that the groups are unequal.
  3. Each student decides secretly whether to vote or abstain. They write their decision on a slip (without their name) and also indicate their group. They fold the slip and put it in the ballot box.
  4. Collect and count the votes. Tally the votes for A and B. The side with more votes wins.
  5. Calculate each student's payoff: 
     - For each student, we need to know their group and their action. 
     - Since we collected the slips, we can do this by having two piles: A-voters, A-abstainers, B-voters, B-abstainers. Then assign payoffs accordingly.
  6. Report the outcome and the payoffs. Note: we cannot assign individual payoffs without knowing who did what, but we can calculate the total points for the class and the average. Alternatively, we can reveal the counts and let each student calculate their own payoff if they remember their action (but that breaks anonymity). Instead, we can do:
     - Announce the total votes for A and B and the winner.
     - Announce the number of voters in each group and the number of abstainers.
     - Then, each student knows their own action and group, so they can compute their own points. They should record it.

  **Phase 2: The Pivotality Account**
  We now run the same election again, but with a twist: we focus on the idea that each voter has a negligible chance of being pivotal. We do this by making the groups very large, but we simulate with the same students. We cannot actually have a large group, so we use a thought experiment and then a simulation with a die to illustrate pivotality.

  1. Redescribe the situation: Now imagine that the entire country is voting, and your group (A or B) is in the same proportion (12:8). The cost and benefits are the same per person. But now, the chance that your vote is pivotal (i.e., that without your vote the election is tied) is extremely small.
  2. Ask: "Would you change your decision? Why?"
  3. Then, to make it tangible, we'll simulate the pivotality. Each student will be given a die. We'll say: if you vote, you must roll the die. Only if you roll a 6 (or some very low probability) is your vote pivotal. Otherwise, your vote is not pivotal and the outcome is the same as if you had abstained. But note: the cost of voting is still incurred regardless of the roll.

     - Rules for Phase 2 simulation:
       - Each student decides again: vote or abstain.
       - If a student chooses to vote, they roll a die. If they roll a 6, then their vote is pivotal. Otherwise, it is not.
       - How to determine the outcome without their vote? We need a baseline. We can use the result from Phase 1 as the baseline, but that might be arbitrary. Alternatively, we can pre-determine the votes of the other 19 students by a random draw. But that is complex.

     Instead, we can do a simpler pivotality simulation:

     We will have the entire class vote again, but each voter who chooses to vote must roll a die. Only if they roll a 6 will we count their vote. Otherwise, we treat them as abstaining for the purpose of counting. However, they still pay the cost of voting.

     This simulation is not entirely realistic because it makes the chance of being pivotal independent of the overall vote, but it illustrates the idea of low pivotality.

     Alternatively, we can skip the die and just discuss. Given time constraints, perhaps we do:

     - Run the same vote again (without the die) and then in the debrief, we ask: "How many of you changed your decision? Why? Did you consider that your chance of being pivotal was very low?"

     But to make the pivotality tangible, let's use the die method with a modification:

     - We fix the votes of the other 19 students to be the same as in Phase 1. Then, the 20th student (if they choose to vote) must roll the die. If they roll a 6, then we flip the outcome if their vote would change the result (i.e., if without their vote the election was tied, then their vote breaks the tie). Otherwise, their vote is discarded.

     This is too complex and time-consuming for 20 students. So we might do:

     - We pick one volunteer. We fix the other 19 votes to be the same as in Phase 1. Then the volunteer decides whether to vote. If they vote, they roll a die. If they roll a 6, we recalculate the outcome with their vote and see if it changes. They get the payoff accordingly (and pay the cost). Otherwise, we use the outcome without their vote.

     But this only involves one student. We want the whole class to experience it.

     Given the time, I suggest we skip the die and instead, after Phase 1, we discuss the pivotality. We can calculate the probability of pivotality in a group of 20 with 12-8 split. It is very low (only if the vote without you is 11-8 or 12-7, then your vote as a member of the majority is not pivotal). Actually, for a member of the majority, the vote is pivotal only if without it the vote is tied. In a group of 19 (if one abstains), the split would have to be 11-8 (so the majority is 11, which is exactly one more than the minority 8). Then if the majority voter votes, it becomes 12-8; if they abstain, it's 11-8 and the majority still wins. So their vote is never pivotal in this setup? Wait, that can't be.

     Let me recast: the vote is pivotal only if the other 19 votes are split 11-8 (if the majority voter is in A) or 12-7 (if the minority voter is in B)? Actually:

     - For a voter in A: the vote is pivotal only if without that vote, the vote count is A:11, B:8. Then if they vote, A wins 12-8; if they abstain, A wins 11-8. So it's not tied and they are not pivotal? Pivotal means that the outcome changes. In this case, A wins regardless. So they are not pivotal.

     We need a tied scenario for pivotality. In a group of 20, if the other 19 are split 11-8 (A ahead) then the 20th vote (if from A) doesn't change the outcome. Similarly, if the other 19 are split 10-9 (A ahead) then the 20th vote (if from A) makes it 11-9 and if from B, it becomes 10-10. So if the 20th voter is from B and votes, then it becomes a tie? We need a rule for ties. Let's say in case of a tie, we flip a coin to decide the winner.

     Then, for a voter in B, the vote is pivotal if the other 19 votes are split 10-9 in favor of A. Then:
       - If the B voter votes: it becomes 10-10 -> tie -> decided by coin flip (so 50% chance for A or B).
       - If the B voter abstains: A wins (10-9).

     So the B voter can change the outcome from A winning to a tie (which gives B a 50% chance). The expected benefit for the B voter from voting in this case is: 
       - If they vote: they pay cost 2, and the expected benefit is 0.5 * 5 = 2.5, so net 0.5.
       - But note: if they abstain, they get 0 (since A wins and they are in B). So the expected gain from voting is 0.5 - 0 = 0.5, but then subtract the cost? Actually, the expected payoff of voting is: 0.5 * 5 - 2 = 2.5 - 2 = 0.5. The payoff of abstaining is 0. So they gain 0.5 by voting.

     However, the probability that the other 19 votes are exactly 10-9 is very small (and even smaller for a minority voter in a larger population).

     Given the complexity, it might be better to skip the die and use the debrief to explain the pivotality.

     Revised plan for Phase 2: 
     - After Phase 1, we explain that in a large election, the chance that one vote is pivotal is extremely small. We then ask the students to vote again in the same setup (same groups, same rules) but now with the understanding that the election is large and their vote is very unlikely to matter. 
     - We run the vote again (same as Phase 1) and compare the results.

     We expect even more abstention in Phase 2.

  **Timeline:**
  - Introduction (5 minutes): Explain the activity and the payoff rules. Assign groups.
  - Phase 1 (15 minutes): 
      - Students decide and submit their votes (anonymously). 
      - Collect and count the votes. Announce the outcome and the counts per group (how many in A voted, abstained; same for B). 
      - Each student calculates their own points and notes them.
  - Phase 2 (10 minutes):
      - Explain the pivotality account: in a large election, the probability that your vote is pivotal is very small. So even though the benefit of your group winning is large, the chance that your vote makes a difference is tiny. Therefore, the expected benefit of voting is tiny and may not cover the cost.
      - Run the vote again under the same rules (but without the die). 
      - Collect and count, announce outcomes and counts. Students calculate their points for this round.
  - Debrief (60 minutes): 
      - Start by asking students about their experience: Why did they vote or abstain in each round? 
      - Map the experience to the two accounts of the paradox: 
          (i) The free-rider problem: even when the group benefit is large, individuals have an incentive to free-ride because the outcome is non-excludable. 
          (ii) The pivotal vote account: the expected causal impact of a vote is negligible because the chance of being pivotal is very small.
      - Then, discuss the four responses.

  **Predictable Problems and Handling:**
  1. **Problem:** Students might not take the points seriously. 
     **Handling:** Explain that the points will be converted into a real class prize (e.g., the class with the most total points across both phases gets a pizza party, or the points determine the share of a charity donation). Alternatively, use extra credit points but be cautious.

  2. **Problem:** In Phase 1, if too many in the majority abstain, the minority might win. Then the majority members who abstained get 0 (if they are in the losing group) and they might regret. But that is part of the lesson: individually rational actions lead to a collectively worse outcome (if the majority loses because of low turnout). 

  3. **Problem:** The groups are fixed and known. This might lead to coordination (e.g., majority members might collude to all vote). 
     **Handling:** Emphasize that decisions are made secretly and individually. Also, the activity is about individual rationality.

  4. **Problem:** The pivotality in Phase 2 is not tangible. 
     **Handling:** We rely on the debrief to explain. We can calculate the probability of being pivotal in a 20-person election with 12-8 split (which is zero in this setup because the majority is too large) and then note that in a large population it is astronomically low.

  5. **Problem:** Time might run out. 
     **Handling:** Keep the voting and counting quick. Use a timer.

  **What the Activity Cannot Reproduce:**
  - In a real election, the population is large and the pivotality is extremely small. We cannot replicate that in a classroom of 20. We must explain in the debrief that in large elections the pivotality is negligible.

  **Debrief Structure:**

  1. **Recap the activity:** What happened in Phase 1 and Phase 2? What were the turnout rates? What was the outcome? How did payoffs compare?
  2. **Map to the two accounts:**
     - (i) **Pivotal-vote account:** In Phase 2, we emphasized that your vote is very unlikely to be pivotal. Did that affect your decision? The cost of voting (2 points) is certain, but the benefit (if your group wins) is only realized if your vote is pivotal. Since the chance of being pivotal is very low, the expected benefit is low and may not cover the cost.
     - (ii) **Free-rider account:** Even if you care about your group winning, you have an incentive to let others bear the cost of voting. If enough people do that, the group may lose even if it is larger.

  3. **Introduce the four responses and discuss:**

     We present a table in the debrief (and on a handout):

     | Response | What it changes | Solves or dissolves | Standard objection |
     |----------|-----------------|----------------------|-------------------|
     | **Expressive account** (voting as consumption, like cheering for your team) | Changes the payoff: voting now yields a direct benefit (expressive utility) regardless of the outcome. | Dissolves the paradox by changing the payoffs (adding a benefit to the act of voting itself). | It doesn't explain why people vote when they think it matters; it might not account for the sense of duty. Also, if expressive utility is high enough, then voting becomes rational, but then why do we see lower turnout in bad weather? |
     | **Minimax regret** (avoiding the catastrophic regret if you abstain and your vote was pivotal) | Changes the decision rule: instead of maximizing expected utility, minimize maximum regret. | Solves the paradox by changing the decision rule. | Regret is defined over outcomes, but the probability of the pivotal world is negligible. Why give it such weight? Also, the cost of voting is certain and might be regretted too. |
     | **Universalisability** (what if everyone in your position did the same?) | Changes the perspective: from individual rationality to a rule that everyone could follow. | Dissolves the paradox by shifting to a collective rationality. | It doesn't make voting individually rational; it might be collectively rational but that doesn't solve the individual's incentive problem. |
     | **Evidential reasoning** (your decision to vote is evidence that others like you will vote, so the act might matter) | Changes the connection between your act and the outcome: your act is correlated with similar acts. | Solves the paradox by changing the causal model. | This relies on a controversial (e.g., Newcomb-like) decision theory. Also, it might not hold if your vote is a drop in the ocean. |

     We note that none of these responses is without controversy.

  **Conclusion:**
  The activity has made the students experience the free-rider problem in Phase 1 and the pivotality problem in Phase 2. The debrief connects these experiences to the theoretical accounts and shows that the paradox of voting is multifaceted. The responses offer ways out, but each has its objections.

  **Handout for Students (Rules for Phase 1 and 2):**

  [Handout]

  The Turnout Dilemma Activity

  You are assigned to a group: Group A (majority) or Group B (minority). There are 12 in A and 8 in B.

  **Election Rules:**
  - The group with the most votes wins.
  - If you vote, you pay a cost of 2 points.
  - If your group wins, you get a benefit of 5 points (regardless of whether you voted or not).
  - If your group loses, you get 0 points from the outcome (but if you voted, you still pay the cost).

  Your payoff:
  - If you abstain and your group wins: 5 points.
  - If you abstain and your group loses: 0 points.
  - If you vote and your group wins: 5 - 2 = 3 points.
  - If you vote and your group loses: 0 - 2 = -2 points.

  Phase 1: Decide individually and secretly: vote or abstain.

  After Phase 1, we will have Phase 2 with the same rules but with an additional consideration: in a large election, the chance that your vote is pivotal (changes the outcome) is very small.

  [End of Handout]

  This should fit within 90 minutes and achieve the learning objectives.
answer: |-
  ### **The Turnout Dilemma: In-Class Activity on the Paradox of Voting**  
  **Designed for a 90-minute session with 20 second- and third-year undergraduates.**

  ---

  #### **Overview**  
  This activity makes students experience the paradox of voting through a simulated election with real stakes (points). It has two phases:  
  1. **Phase 1: Free-Rider Problem** – Abstaining is individually rational, but collective abstention worsens outcomes.  
  2. **Phase 2: Pivotal Vote Problem** – Students confront the negligible probability of being decisive, revealing a second layer of the paradox.  

  **Learning Goals:**  
  - Feel the tension between individual rationality and collective welfare.  
  - Distinguish the free-rider structure (Phase 1) from the pivotal-vote problem (Phase 2).  
  - Evaluate four philosophical responses in the debrief.  

  **Stakes:** Points convert to a shared prize (e.g., class decides how to allocate £20 for snacks/donation). No real money.  

  ---

  #### **Materials and Setup**  
  - **Group Composition:**  
    - Assign students to **Group A** (majority, 12 students) or **Group B** (minority, 8 students) randomly.  
    - Groups represent opposing policies (e.g., "Policy A: Fund Campus Gardens" vs. "Policy B: Fund Study Spaces").  
  - **Materials:**  
    - Voting slips (paper or digital).  
    - Ballot box or online poll (for anonymity).  
    - Whiteboard to display rules, results, and cumulative points.  
    - Timer.  
    - Six-sided dice (1 per student, for Phase 2).  
  - **Payoff Scheme:**  
    | Action               | Your Group Wins (5 pts) | Your Group Loses (0 pts) |  
    |----------------------|--------------------------|--------------------------|  
    | **Vote** (cost: 2 pts) | 5 – 2 = **+3 pts**       | 0 – 2 = **–2 pts**       |  
    | **Abstain** (cost: 0 pts) | **+5 pts**               | **0 pts**                |  

  **Key Features:**  
  - Turning out is costly at the individual level.  
  - The outcome (win/loss) is shared by all group members, regardless of participation.  
  - Abstaining is dominant *if* others vote, but collective abstention risks group loss.  

  ---

  #### **Timeline (Total: 90 mins)**  
  1. **Introduction (10 mins):**  
     - Explain rules, payoffs, and stakes (points → shared prize).  
     - Emphasize: "Decide based on your self-interest. No collusion."  
     - Assign groups (12 A, 8 B).  

  2. **Phase 1: Free-Rider Problem (20 mins)**  
     - **Activity:**  
       - Students decide secretly: **vote** or **abstain**.  
       - Collect votes anonymously.  
       - Tally votes: Majority wins. Announce outcome.  
       - Students calculate personal points (based on group outcome and action).  
     - **Predictable Outcome:**  
       - Abstention is high (especially in majority Group A).  
       - Group A may lose due to low turnout, making all worse off (e.g., Group A voters get –2 pts; abstainers get 0).  

  3. **Phase 2: Pivotal Vote Problem (20 mins)**  
     - **Redescription:**  
       - "Now imagine this is a national election with millions. Your chance of being the *decisive* voter is near-zero. Voting costs the same, but your impact is tiny."  
     - **Activity:**  
       - Repeat Phase 1 vote, but add:  
         - If you vote, roll a die. **Only on a 6 (≈16.7% chance) is your vote "pivotal"** (counted). Otherwise, it is discarded (but cost is still paid).  
       - Tally votes, announce outcome, and calculate points.  
     - **Predictable Outcome:**  
       - Turnout drops further. Students see voting as "pointless" due to low pivotality.  

  4. **Debrief (40 mins):**  
     - Discuss results: Compare turnouts/outcomes in Phases 1 and 2.  
     - Map to the two paradoxes:  
       - **(i) Pivotal-Vote Account:** "Why vote if you’ll almost never swing the result?" (Phase 2).  
       - **(ii) Free-Rider Account:** "Why vote if others will do it for you?" (Phase 1).  
     - Introduce and critique four responses (use table below).  
     - Conclude: "Two paradoxes share one name. Both show voting seems irrational, yet people do it."  

  ---

  #### **Debrief Table: Four Responses to the Paradox**  
  | Response                  | What it changes                     | Solves or dissolves             | Standard objection                                  |  
  |---------------------------|-------------------------------------|----------------------------------|-----------------------------------------------------|  
  | **Expressive account**    | Payoffs: Voting as "consumption" (e.g., expressing identity). | Dissolves (adds psychic payoff). | Fails if no joy in voting; doesn’t address duty. Not consensus. |  
  | **Minimax regret**        | Decision rule: Avoid worst-case regret (abstaining if pivotal). | Solves (changes rationality criteria). | Overweights tiny probabilities; ignores certain costs. |  
  | **Universalisability**    | Perspective: "What if everyone like you abstained?" | Dissolves (shifts to collective rationality). | Individual incentive remains; free-rider problem persists. |  
  | **Evidential reasoning** | Causality: Voting signals others like you will vote. | Solves (alters causal model). | Relies on contested decision theory; may not scale to large groups. |  

  **Key:**  
  - **Solves:** Addresses the paradox within rational choice (e.g., makes voting rational).  
  - **Dissolves:** Changes the problem (e.g., redefines payoffs or rationality).  
  - **Relocates:** Pushes the problem elsewhere (e.g., universalisability ignores individual incentives).  

  ---

  #### **Predictable Problems and Solutions**  
  - **Problem 1: Students collude or act altruistically.**  
    - *Solution:* Stress self-interest, anonymity, and real stakes (points). Remind them: "This is about *your* points."  

  - **Problem 2: Group A wins easily in Phase 1 (masking the paradox).**  
    - *Solution:* If turnout is high, highlight: "You got lucky. But was abstaining irrational?" Use results to show abstainers gained more.  

  - **Problem 3: Phase 2 pivotality feels artificial with dice.**  
    - *Solution:* Acknowledge this: "In real elections, pivotality is far lower. We use dice to simulate chance."  

  - **Problem 4: Students miss the link between phases.**  
    - *Solution:* In debrief, contrast: "Phase 1 was about free-riding; Phase 2 was about futility."  

  ---

  #### **What the Activity Cannot Reproduce**  
  - **The scale of real elections:** Classroom groups are small, so pivotality is non-negligible (e.g., in Phase 2, a 16.7% chance vs. real-life 1 in millions).  
    - *Supply in Debrief:* Explicitly state: "In mass elections, pivotality is astronomically low. This makes voting seem even more irrational. Our dice understate the problem."  

  ---

  #### **Final Notes**  
  - **British English:** Uses "turn out" (verb), "abstain", "payoffs", "whilst".  
  - **Contested Claims:** The expressive account is presented as one view among many; minimax-regret and evidential reasoning have critics.  
  - **Outcome:** Students feel the paradox firsthand. The debrief clarifies how philosophical responses try (and often fail) to resolve it.  

  **End with:** "Voting seems irrational twice over: others will do it, and you won’t matter. Yet we vote. Is that a mistake, or is the model missing something?"
