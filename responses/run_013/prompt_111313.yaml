prompt: |-
  A friend of mine is doing a PhD on slime molds — he has a video of a Physarum blobbing its way through a maze and finding the shortest path out, and another where a colony of them lays down a network that looks a lot like the Tokyo rail system. He's convinced this settles that intelligence is just adaptive problem-solving and has nothing essentially to do with brains, and honestly I think he mostly likes the argument because its his organism. Meanwhile I sit in a cognitive science reading group where someone insists nothing counts as intelligent unless it has a general-purpose ability to handle novelty, which would rule out the slime mold, the ant colony, my calculator, and — the actual point of the argument — the language models we're all quietly using to write our seminar papers. Both of them keep winning the exchange by producing a new case, and I've stopped learning anything.

  Before I take a side I want the actual spec sheet, not another case-by-case fistfight. So give me the desiderata for a theory of intelligence: what any adequate account of what intelligence *is* has to deliver. Which cases does it absolutely have to get right? Think about the slime mold, an ant colony, an octopus whose mind is partly spread out into its arms, a chess engine, a calculator, a savant who does one thing impossibly well and nothing else, a system that aces every benchmark because it was trained on all of them, two people who score identically on the same task where one "gets it" and the other is pattern-matching, and the same model that looks sharp under one framing and hopeless under another. Which distinctions can't be collapsed — capacity vs. performance, intelligence vs. consciousness, being intelligent vs. merely being good at a task, being smart vs. having goals, individual vs. collective? Which empirical results does the theory have to sit with (that scores on wildly different tasks tend to correlate, the positive manifold / g thing, versus the fact that abilities can dissociate after brain injury; the large generational rise in IQ scores; the fact that performance on almost anything is heavily practice- and framing-dependent)? And tell me which of these are genuine requirements and which are just one camp's prejudice, plus which single requirement does the most work to knock out candidate theories.

  Most of all I want to know where the list eats itself. Is there a pair of things I'm demanding that no theory can give me at once? My suspicion is it's somewhere between "intelligence has to be a single measurable quantity" and "the theory has to respect how differently abilities come apart," or maybe between "you have to be able to tell it apart from a clever fake" and "the only evidence you're allowed to use is behavior." If some subset is jointly unsatisfiable, say so explicitly and explain why — thats the part I'll actually use in my paper. And keep any scoring of existing theories brief; I dont need a tour of every contender, I need the list and the fault lines in it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're stuck in a debate between their friend who studies slime molds and a cognitive science group. The friend argues intelligence is just adaptive problem-solving, using slime molds as an example. The cognitive science group insists on general-purpose novelty handling, ruling out things like slime molds and language models. The user wants a set of criteria for any theory of intelligence, not more anecdotal cases.

  First, I need to identify the core issues. The user mentions several cases: slime mold, ant colony, octopus, chess engine, calculator, savant, overtrained AI, two people with same performance but different understanding. They also bring up distinctions like capacity vs. performance, intelligence vs. consciousness, individual vs. collective. Plus empirical results like g-factor correlations, dissociations after brain injury, Flynn effect, practice dependence.

  The user wants to know which desiderata are essential and which might be conflicting. They suspect a tension between intelligence as a single measurable quantity and the way abilities dissociate. Also, between distinguishing real intelligence from clever fakes using only behavioral evidence.

  I should list non-negotiable requirements. Start with the cases that must be correctly categorized. Slime mold and ant colonies show problem-solving without a brain, so the theory must explain intelligence without neurocentrism. The octopus's distributed cognition challenges the idea of a central brain. Chess engines and calculators excel in specific tasks but lack generality, while savants show isolated abilities. The overtrained AI aces benchmarks but may not generalize, highlighting performance vs. capacity. The two people with same performance but different understanding (e.g., pattern-matching vs genuine comprehension) raises the understanding vs. behavior issue. The same model appearing intelligent in one context but not another shows framing dependence.

  Key distinctions: capacity (potential) vs. performance (current ability), intelligence (problem-solving) vs. consciousness (subjective experience), being intelligent vs. being good at a task (generality), having goals (agency) vs. just solving problems. Collective vs. individual intelligence is crucial for ant colonies or slime molds.

  Empirical results: The positive manifold (g-factor) suggests a general intelligence factor, but dissociations after brain injury show modularity. Flynn effect indicates environmental influences on IQ. Practice and framing effects highlight context-dependence.

  Now, conflicts. The user mentioned "intelligence as a single quantity" vs. "abilities coming apart." The g-factor and dissociation data are at odds. Also, behavior as the only evidence vs. detecting understanding. If you only use behavior, how do you differentiate real understanding from mimicry? But without behavioral evidence, it's not measurable.

  Another conflict: generality vs. task-specific excellence. Slime molds adapt but only in limited environments. Savants excel in one area but not others. If intelligence requires generality, savants and calculators don't count, but that seems counterintuitive. If it doesn't, then anything adaptive becomes intelligent, which might be too broad.

  Also, the framing effect: the same system can appear intelligent or not based on context. A theory must account for this without being arbitrary.

  Essential requirements: 
  1. Explain generality vs. specificity. Must accommodate both savants and general problem-solvers.
  2. Account for collective and distributed intelligence (ants, octopus).
  3. Address the capacity-performance gap (overtrained AI vs. underlying capability).
  4. Incorporate environmental scaffolding (tools, social context).
  5. Handle dissociation data and g-factor without contradiction.

  The toughest conflict is between measurable behavior and genuine understanding. If a theory relies solely on behavior, it can't distinguish between real understanding and mimicry (like Chinese Room). But if it requires internal states, it becomes unverifiable. This might be unresolvable.

  Another is the single quantity vs. modular abilities. g-factor suggests a core ability, but brain injuries show independent modules. A theory must reconcile this, perhaps through hierarchical models or emergent properties.

  I should also note which demands might be prejudices. Insisting on generality might be a human-centric bias. Requiring a central brain is neurocentrism, challenged by octopuses and slime molds.

  For the user's paper, highlighting these conflicts, especially the behavior-understanding gap and the generality-specificity tension, will be key. Pointing out that some desiderata force trade-offs can help them frame the debate.
answer: |-
  Here's the "spec sheet" for a theory of intelligence – the non-negotiable desiderata and their inherent tensions. Forget case-by-case bickering; these are the fault lines any adequate theory *must* navigate.

  ### Core Desiderata: What a Theory MUST Deliver

  1.  **Accommodate Generality vs. Specificity:**
      *   **Must Get Right:** The savant (e.g., lightning calculation but impaired daily living) and the overtrained benchmark ace (excellent on seen tasks, fails on novel variations) demonstrate *specific* excellence. The "general-purpose novelty handler" (like a human navigating an entirely unfamiliar complex situation) demonstrates *generality*. A theory must explain both phenomena and the spectrum between them. *Collapsing this distinction fails.*
      *   **Empirical Anchor:** Dissociation after brain injury (e.g., preserved language but lost spatial reasoning) and the existence of savants challenge a monolithic view. The positive manifold (g-factor correlation across diverse tasks) suggests an underlying commonality. The theory must reconcile these.

  2.  **Distinguish Capacity from Performance:**
      *   **Must Get Right:** The overtrained benchmark ace vs. a system with the *potential* to learn novel tasks (even if untrained). The two people scoring identically: one with deep understanding ("gets it"), one pattern-matching without comprehension. The same model looking brilliant in one framing (e.g., summarizing text) and hopeless in another (e.g., causal reasoning about the summarized content). *Collapsing capacity (potential) into performance (current output) fails.*
      *   **Empirical Anchor:** Practice effects, framing effects, and the Flynn effect (rising IQ scores) show performance is context-dependent and malleable. A theory must account for the underlying *ability* separate from its current expression.

  3.  **Explain Goal-Directedness & Adaptation:**
      *   **Must Get Right:** The slime mold adapting its growth to find nutrients/shortest path. The ant colony optimizing foraging trails. The chess engine evaluating moves towards checkmate. The calculator... does *not* adapt its function; it executes fixed rules. The octopus arm exhibits semi-autonomous goal-directed behavior (e.g., hunting) integrated with the central brain. *Collapsing intelligence with mere computation (like a calculator) fails. Intelligence requires problem-solving directed towards some outcome.*
      *   **Empirical Anchor:** Goal-directed behavior is observable in diverse biological systems and AI. A theory must link intelligence to achieving goals in an environment, not just symbol manipulation.

  4.  **Account for Distributed & Collective Intelligence:**
      *   **Must Get Right:** The octopus (mind distributed into arms). The ant colony/Tokyo-rail-slime-mold (intelligence emerging from collective interaction, no central controller). A theory cannot be neurocentric or require a single, centralized "brain" equivalent. *Collapsing intelligence solely into individual, centralized cognition fails.*
      *   **Empirical Anchor:** Evidence of complex problem-solving in decentralized systems (insect colonies, slime molds, neural networks) and distributed cognition in cephalopods.

  5.  **Handle Environmental Scaffolding & Embodiment:**
      *   **Must Get Right:** Intelligence isn't just "in the head" (or blob). The slime mold uses its physical structure to solve the maze. An octopus arm leverages its embodiment. Humans use tools, language, and social structures. A calculator requires a user. *Ignoring the role of the body and environment in enabling and shaping intelligence fails.*
      *   **Empirical Anchor:** Embodied cognition research, the dramatic impact of tools/culture on human capabilities (including IQ gains).

  ### The Knives-Out Conflict: Where Demands Clash

  1.  **Behavior-Only Evidence vs. Genuine Understanding/Internal State:**
      *   **The Conflict:** You demand the theory "tell intelligence apart from a clever fake" (like the pattern-matcher vs. the understander, or an LLM generating plausible text without comprehension) but also insist "the only evidence you're allowed to use is behavior." **This is fundamentally unsatisfiable.**
      *   **Why?** Behavior (output) is the *only* direct evidence we ever have of *any* intelligence, biological or artificial. Attributing "understanding," "goals," or "real intelligence" vs. "mimicry" is an *inference* based on behavior *in context*. There is no magic test penetrating the "black box." An LLM's text, a slime mold's path, a human's answer – all are behaviors. Distinguishing "real" intelligence requires interpreting behavior through a theoretical lens (e.g., flexibility, generalization, counterfactual reasoning) that *goes beyond* the immediate output, but it's still based on observable (or testable) behavior over time and across contexts. **Any theory must grapple with this inferential gap; none can provide a direct "realness" detector.** This knocks out simplistic behaviorism *and* theories requiring inaccessible internal qualia.

  2.  **The "g" Factor vs. Dissociation & Modularity:**
      *   **The Conflict:** You demand the theory respect the positive manifold (g-factor) – the correlation suggesting a core intelligence – *and* respect how abilities dramatically dissociate (brain injury, savants). **These pull in opposite directions.** How can intelligence be both unitary *and* highly modular/fragmented?
      *   **Why it's a Fault Line:** Theories emphasizing a single "g" (like psychometric g or some universal computation theories) struggle with dissociation. Theories emphasizing specialized modules struggle with the positive manifold and fluid reasoning across domains. **The most plausible theories involve hierarchy (e.g., specialized modules underpinned by or interacting with a domain-general executive function/capacity) or emergent properties from complex systems.** Ignoring either dataset fails.

  ### The Most Discriminating Requirement

  **"Distinguish Capacity from Performance (especially concerning Generality)"** does the most work to knock out weak theories.
  *   It rules out theories that equate intelligence solely with current task performance (failing on savants, overtrained AI, framing effects).
  *   It forces the theory to address *potential* for generalization and adaptation, not just rote execution.
  *   It directly challenges LLM proponents (is it performance or capacity?) and slime mold minimalists (is it adaptation or just fixed tropism?).
  *   It incorporates the core issue of understanding vs. mimicry.

  ### Prejudices Masquerading as Requirements

  1.  **"Requires a Brain/CNS":** Clearly ruled out by slime mold/ant colony/octopus arm cases. Neurocentrism is prejudice.
  2.  **"Requires Consciousness/Subjective Experience":** Intelligence (problem-solving, adaptation) can exist without phenomenal consciousness. Conflating them is a common but unnecessary philosophical baggage. A chess engine is intelligent at chess without being conscious.
  3.  **"Must be Human-Like":** Anthropocentrism. Intelligence manifests differently (slime mold, octopus, AI). The theory must be substrate-neutral.
  4.  **"Must be Unlearned/Innate":** Ignores the role of learning, development, and the Flynn effect. Capacity develops through interaction.

  ### The Takeaway for Your Paper

  The core unresolvable tension is the **inferential gap between observable behavior and attributions of "genuine intelligence" or "understanding."** No theory can provide direct access to internal states; all must infer intelligence from patterns of behavior across contexts and challenges, acknowledging this is always provisional. Theories fall along spectrums:

  *   **Generality-Specificity:** How broad must adaptive capacity be?
  *   **Centralization-Distribution:** Where does cognition reside/emerge?
  *   **Unitary-Modular:** How integrated or fragmented are abilities?
  *   **Capacity-Performance:** How much weight is given to potential vs. current output?

  A robust theory won't *resolve* all tensions but will explicitly *frame* them (e.g., intelligence as *scaffolded, embodied, goal-directed, adaptive capacity whose generality is a matter of degree, inferred from flexible behavioral responses across diverse and novel challenges*). It will accept the behavior-understanding inference as necessary but risky, requiring tests probing generalization, counterfactuals, and robustness, rather than claiming definitive access to "realness." It will ditch neurocentrism and anthropocentrism while grappling seriously with collective, embodied, and environmentally embedded cognition. The slime mold forces broadness; the dissociations and framing effects force nuance; the capacity/performance gap forces a focus on potential. Your friend and the cog-sci group are each highlighting necessary but insufficient facets. The fault lines *are* the map.
