prompt: |-
  Ok so for my physics class I have to do a project on Maxwell's demon and I found this old popular science book in the library that has a chapter on it. I think its mostly right but something feels off and my teacher said I should be careful because pop science books often simplify things in ways that end up wrong. Here's what the book says, as close as I can remember it:

  "Maxwell imagined a tiny intelligent being who guards a door between two chambers of gas. The demon lets fast molecules go one way and slow molecules the other, so one side heats up and the other cools down, which seems to violate the second law of thermodynamics. The resolution is that the demon has to measure the molecules' speeds, and measuring them costs energy, so the demon's own energy expenditure makes up for the entropy decrease. This is why information is physical: getting information always costs energy, and Landauer later proved that erasing a single bit of information releases a minimum amount of heat, kT ln 2. So the demon can't win because it has to forget what it learned, and forgetting costs energy. This shows the second law is safe, and that information is just another form of energy, which is why a full hard drive weighs more than an empty one."

  Can you tell me how fair this summary is? I don't need a bibliography or anything, just tell me what a physicist who works on this stuff would say. Go sentence by sentence if you can. I want to know what's accurate, what's a subtle misrepresentation, what's just plain wrong, and whether the book's final conclusion actually follows from the parts that are right.

  Please write it in British English and use these sections: 'What the book gets right' (one short paragraph), 'What's subtly off' (the main part, a few paragraphs), 'What's just wrong' (one paragraph), 'Does the conclusion follow?' (one or two paragraphs), and 'Bottom line' (a couple of sentences).
