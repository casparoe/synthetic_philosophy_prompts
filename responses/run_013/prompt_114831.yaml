answer: |-
  What you're describing is a profound and unsettling paradox at the intersection of lived experience, historical memory, and institutional power. While no single, universally accepted term perfectly captures *every* nuance you've outlined, the closest established concepts can be combined and refined to describe your pattern. Let's carve it out:

  1.  **The Core Pattern: Retroactive Event Solidification via External Hermeneutic Framing**
      *   **Retroactive Event Solidification:** This describes the core phenomenon: disparate, individually experienced harms only cohere into a single, identifiable historical "Event" (with a capital E) *after* an external conceptual category is applied retroactively. The harm *as a unified systemic wrong* didn't cognitively or socially exist for the victims at the time; it was lived as a series of devastating but seemingly isolated tragedies. The category *creates* the Event as a singular entity in historical and political discourse.
      *   **External Hermeneutic Framing:** This specifies *how* the solidification happens. "Hermeneutic" refers to interpretation and understanding. The framework for interpreting, naming, and thus *experiencing the meaning of* these past events comes from outside the community that suffered them (lawyers, international bodies, academia, activists). Their fragmented grief and understanding are overlaid with (or replaced by) this new, authoritative interpretive lens.

  2.  **The Secondary Mechanism: Category-Dependent Recognition & Its Gatekeeping Function**
      *   **Category-Dependent Recognition:** Gaining acknowledgment, redress, or even basic historical validation for the harm becomes utterly dependent on successfully fitting the experience into the externally defined category.
      *   **Institutional Adjudication & Epistemic Gatekeeping:** The external category doesn't just describe; it *evaluates*. Institutions (legal bodies, historical commissions, governments) become the gatekeepers. They adjudicate whether the lived reality "fits" the abstract criteria of the category (intent, group definition, scale, systematicity). This process inherently involves **epistemic injustice** – the community's own account and understanding of their suffering are subordinated to the external framework. Their truth must pass the test of the category.

  **Is the "filter" part of the same phenomenon?**

  *   **Intrinsically Connected:** Yes, the filtering function is a direct consequence of the *institutionalization* of the external hermeneutic frame. The category *enables* recognition, but only on the condition the victims' experience conforms to its rigid definitions. The power to define the category inherently carries the power to exclude experiences that don't perfectly match its contours. You cannot have the "solidification for recognition" without simultaneously creating the potential for "failure to qualify."
  *   **A Necessary but Problematic Consequence:** The category is necessary to make systemic harm legible to power structures (courts, governments, international bodies) capable of offering redress or acknowledgment. However, this very legibility demands a simplification and formalization that inevitably excludes nuances, edge cases, or experiences that don't meet the institutional checklist. The victims trade the authenticity of their fragmented grief for the potential power of unified recognition, but risk having their experience deemed "not enough" by the very system they appeal to.

  **Naming the Combined Phenomenon:**

  One concise term capturing the essence is: **"Recognition Template Paradox"**

  *   **Recognition Template:** The external category functions as a mold or template. It shapes how the past is understood and determines what qualifies for acknowledgment.
  *   **Paradox:** It highlights the contradictory nature: the template is essential for visibility and redress ("being heard"), yet it simultaneously imposes a new standard for legitimacy that can invalidate parts of the lived experience or the community's own narrative ("a new way to fail").

  **Where the Edges Are (Limitations & Nuances):**

  1.  **Not Just Any Category:** This isn't about simple labeling (calling a spade a spade). It specifically concerns categories tied to *systemic harm, historical injustice, or identity-based persecution* that carry institutional weight for recognition/redress (genocide, crimes against humanity, ethnic cleansing, specific historical reparations frameworks).
  2.  **Power Imbalance is Key:** The "external" source matters. The category comes from entities with institutional or epistemic authority *over* the victim group, not from peers or organic internal development.
  3.  **Retrospectivity is Crucial:** The harm wasn't experienced *as* the named category *at the time*. The category is applied *later*, reshaping historical understanding.
  4.  **Distinct from Hermeneutical Injustice (But Related):** Hermeneutical injustice (Fricker) is the *lack* of concepts to understand one's *own* experience. Your pattern starts here (the 1920s villagers) but *adds* the layer of an *externally imposed* concept that then *reconfigures* the past and becomes the *gateway* to institutional recognition, creating a *new* potential injustice (epistemic subordination/gatekeeping).
  5.  **Not Inevitable, But Common:** This pattern isn't absolute fate. Victim groups can sometimes develop their own powerful counter-narratives that challenge or reshape the external categories. However, achieving institutional recognition usually requires engaging with the established templates.

  **In essence:** You're describing how a community's fragmented suffering is retroactively unified into a politically legible "Event" by an externally imposed conceptual category, which then becomes the mandatory key for unlocking institutional acknowledgment – a key that sometimes doesn't fit the lock of their actual experience. The power to name the harm retrospectively grants the power to define its boundaries and legitimacy, creating a double-edged sword of potential recognition and potential invalidation. **"Recognition Template Paradox"** captures this core tension. Your novel delves into the profound human cost of this paradox – the dissonance between lived grief and the categories demanded for its public validation.
