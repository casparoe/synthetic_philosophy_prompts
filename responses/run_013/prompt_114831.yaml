  First, I need to identify if there's an existing concept for this pattern. The user mentions philosophy of language or political theory. Let me think about terms like hermeneutical injustice, but that's about lacking concepts to understand one's own experience. Here, the problem is the external imposition of a category that reconfigures the past. The retrospective categorization sounds like reification—turning a process into a fixed event. But reification usually applies to social constructs, not events.

  Then there's the second part: the category acting as a filter. The victims' experiences must fit predefined criteria (intent, group definition, scale), which might exclude some. This resembles what critical theorists call the "burden of representation" or the politics of recognition, where marginalized groups must conform to dominant frameworks to be heard. Combining both aspects—retrospective unification and the filtering—might require linking two concepts.

  I recall that in genocide studies, there's discussion about how legal definitions can exclude cases that don't meet specific criteria, like the Cambodian genocide under the Khmer Rouge not initially being classified as genocide because the victims weren't a distinct national/ethnic group. That fits the filtering aspect. But is there a term for the temporal shift from disparate events to a singular harm?

