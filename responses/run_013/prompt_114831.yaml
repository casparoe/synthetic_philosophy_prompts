  I need to check if the two parts are the same phenomenon. The unification allows the harm to be recognized as systemic, which is necessary, but the gatekeeping is a consequence of institutional adoption. They're connected but distinct. The user might be highlighting how the solution (the category) introduces new problems (exclusion). So the term should capture both.

  Also, considering the user's identity as a novelist, they need a concept that's clear and usable in their narrative without academic baggage. The term should be evocative yet precise. "Recognition Template" might work, but it doesn't cover the retroactive part. "Retroactive Solidification" with "Institutional Adjudication" as components? 

