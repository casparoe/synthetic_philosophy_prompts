  Below is a decision tree addressing the core disagreements about the dollar auction's escalation pathology. It starts from the shared observation (bids exceed $1) and branches through 6 nodes to 7 distinct explanatory positions. Each node is a question answerable without knowing the destination leaf. The tree flags unoccupied combinations and inseparable leaf pairs.

  ---

  ### **Decision Tree: What Explains Escalation in the Dollar Auction?**  
  **Starting Point**: Bids reliably exceed $1 in the standard dollar auction.

  #### **Node 1**: Is escalation possible even if both bidders are fully rational (i.e., forward-looking with common knowledge of rationality)?  
  - **YES** → Go to Node 2  
  - **NO** → Go to Node 3  

  *(Rationale: Tests whether standard game theory can explain escalation without behavioral factors.)*  

  #### **Node 2** (Rational bidders): Can escalation occur in a pure monetary model (no unmodeled payoffs)?  
  - **YES** → **Leaf 1: "Pathological Auction Design"**  
    - *Awkward commitment*: Assumes bidders coordinate on Pareto-worse equilibria despite foreseeing losses.  
  - **NO** → Go to Node 4  

  *(Rationale: If YES, auction structure alone causes pathology; if NO, unmodeled payoffs are needed.)*  

  #### **Node 3** (Irrational bidders): Is the key mistake *miscomputing* monetary payoffs (e.g., ignoring sunk costs)?  
  - **YES** → **Leaf 2: "Cognitive Error"**  
    - *Awkward commitment*: Assumes repeated exposure won’t correct the error (e.g., "escalation traps" persist).  
  - **NO** → Go to Node 5  

  *(Rationale: Distinguishes cognitive errors from emotional/behavioral drivers.)*  

  #### **Node 4** (Rational bidders + unmodeled payoffs): Is the core unmodeled payoff **fear of being the "sucker"** (losing after paying)?  
  - **YES** → **Leaf 3: "Sucker Aversion"**  
    - *Awkward commitment*: Sucker premium must exceed monetary losses even at high bids (e.g., $5 bid to avoid $0.50 loss).  
  - **NO** → **Leaf 4: "Face/Status Preservation"**  
    - *Awkward commitment*: "Face" value scales with bids, overriding monetary stakes (e.g., paying $3 to "win" $1).  

  *(Rationale: Splits dominant non-monetary motives; sucker aversion is uniquely tied to the auction’s loss structure.)*  

  #### **Node 5** (Irrational bidders + non-cognitive drivers): Is the driver **anger at the other bidder**?  
  - **YES** → **Leaf 5: "Punitive Escalation"**  
    - *Awkward commitment*: Bidder knowingly pays >$1 to hurt the other (e.g., "I’ll make you overpay too").  
  - **NO** → Go to Node 6  

  *(Rationale: Tests if escalation is retaliation versus sunk-cost fallacies.)*  

  #### **Node 6**: Does escalation persist if the loser gets a 50% refund?  
  - **YES** → **Leaf 6: "Sunk Cost Signaling"**  
    - *Awkward commitment*: Bidders escalate to signal toughness to *themselves* (e.g., "I don’t quit investments").  
  - **NO** → **Leaf 7: "Loss Aversion"**  
    - *Awkward commitment*: Losses loom larger than gains, but only when fully sunk (refunds mitigate this).  

  *(Rationale: Refund tests if escalation requires *total* loss irreversibility.)*  

  ---

  ### **Leaves Summary**  
  1. **Pathological Auction Design**  
     - Escalation as rational War of Attrition.  
  2. **Cognitive Error**  
     - Miscomputation of monetary payoffs (e.g., sunk cost neglect).  
  3. **Sucker Aversion**  
     - Paying to avoid being the "loser who paid for nothing."  
  4. **Face/Status Preservation**  
     - Bidding to protect reputation/self-image.  
  5. **Punitive Escalation**  
     - Anger-driven bids to punish the other bidder.  
  6. **Sunk Cost Signaling**  
     - Escalation to justify prior investments to oneself.  
  7. **Loss Aversion**  
     - Irrational focus on avoiding crystallized losses.  

  ---

  ### **Key Notes**  
  - **Inseparable Leaves**:  
    - *Sucker Aversion (3) vs. Face/Status (4)*: Both explain post-$1 bidding, but the tree distinguishes via Node 4.  
    - *Sunk Cost Signaling (6) vs. Loss Aversion (7)*: Only separable via refunds (Node 6).  
  - **Unoccupied Combinations**:  
    - *Rational + Punitive*: Rational players don’t pay to punish (dominated by quitting).  
    - *Cognitive Error + Refund-Sensitivity*: If miscomputation is monetary, refunds should *not* matter (but they do).  
  - **How Variants Resolve Disagreements**:  
    - **Refund rule (e.g., total bids >$2.50 cancel auction)**:  
      - Eliminates *Pathological Design* (changes equilibrium) and *Loss Aversion* (removes total loss).  
      - Strengthens *Sucker Aversion* (refunds make "sucker" fear irrelevant).  
    - **Sealed bids**:  
      - Eliminates *Punitive Escalation* (no reactive bidding) and *Pathological Design* (no dynamic game).  
    - **Loser gets 50% back**:  
      - Weakens *Sucker Aversion* and *Loss Aversion* but not *Face/Status* or *Sunk Cost Signaling*.  

  ---

  ### **Tree Logic Highlights**  
  - **Rational branch** (Nodes 1–2, 4): Rejects "mistakes" and focuses on design/payoffs.  
  - **Irrational branch** (Nodes 3, 5–6): Splits cognitive vs. emotional drivers, with refunds testing sunk-cost theories.  
  - **Variant tests** (e.g., Node 6) isolate mechanisms (e.g., refunds break loss-focused leaves).  
  - **Most contested node**: Node 4 (Sucker Aversion vs. Face). Philosophers may debate if "face" reduces to sucker-aversion.  

  This tree forces clarity on *why* we attribute escalation to specific causes—and where variants would falsify positions.
