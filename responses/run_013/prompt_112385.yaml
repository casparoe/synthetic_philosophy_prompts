answer: |-
  ## To Parmenides, On the Arrow's Seeming

  Old master, witness this: the taut string’s curve,
  The bow-arm’s rigid brace against the air,
  The yew-wood grain, a straight and slender nerve,
  The fletching’s grip, three feathers gathered there.
  The arrowhead, a point of sharpened steel,
  A focus cold against the distant mark.
  The target’s face, a crimson circle’s wheel
  Beyond the field, a stillness in the dark
  Of intervening space. The shaft’s own length,
  A measured span between the hand and eye.
  The silence now, before the gathered strength
  Releases. Fingers tense. A breath held high.
  The distance then: ten paces, clear and stark,
  A vacant stretch the arrow must, it seems,
  Traverse. The string’s high tension, taut and dark,
  The angle sharp where wood and sunlight gleam.

  The shaft, a horizontal line in air,
  The target’s center, bright and absolute.
  The space ahead, a fraction less than where
  It hung before. The feathers, still and mute.
  The head’s position, midway now, or near?
  The distance left: five paces, maybe less.
  The circle’s edge, a boundary severe,
  The arrow’s point, the circle’s near address.

  The wood grain, close against the painted ring,
  The fletching’s angle, parallel to ground.
  The crimson blur, expanding like a wing,
  The head’s own shadow on the target’s mound.

  The point’s first touch upon the linen tight,
  The shaft’s alignment, true and central there.

  The feathers, level with the outer white.

  **The shaft completes its passage through the air.**
