prompt: |-
  My old stats TA used to say Hempel's raven thing is just like looking for your keys. The house has four rooms, you check the kitchen, the keys aren't there, so now you're more sure they're in the bedroom. Same deal with the ravens, he said: every green apple you glance at is one more room you've checked, so it nudges "all ravens are black" up a hair, and the whole so-called paradox is just people being bad at conditional probability. I never bought it and I can never say exactly why.

  Break it down for me. What maps onto what -- the keys, the kitchen, the other three rooms, the four-room layout, the fact that the keys have got to be somewhere in the house, the looking-and-not-finding -- and where does the mapping hold versus where does it snap? Then, which features of the keys setup does the analogy quietly import into the raven case that aren't really there? (I have a feeling the "they've got to be somewhere in the house" part is doing all the work.) And does his conclusion survive -- that green apples genuinely do confirm the raven hypothesis, and that this makes the paradox definately evaporate -- or was the analogy carrying that conclusion the whole time? If there's a better analogy for what's actually going on, give me that too. Answer in American English.

  Format it as a JSON object with these fields:

  - "mapping": array of objects, each with "source_element" (a piece of the keys case), "target_element" (what it corresponds to in the raven case), "status" ("holds" | "breaks" | "partial"), and "note" (one or two sentences).
  - "imported_assumptions": array of objects, each with "assumption", "what_it_does_for_the_keys_case", and "what_the_raven_case_would_need_for_it_to_hold".
  - "disanalogies": array of objects, each with "disanalogy", "affects_the_conclusion" (true or false), and "why" (say why it does or doesn't matter for the use the analogy is being put to).
  - "conclusion_verdict": object with "survives" ("yes" | "no" | "only_in_weakened_form"), "what_survives", and "what_falls".
  - "better_analogy": a string, or null if none is better.
  - "one_line_summary": a string.
reasoning: |-
  Hmm, the user is asking about Hempel's raven paradox and how it compares to a keys search analogy from their stats TA. They want me to break down the mapping between the two scenarios, identify where the analogy holds or breaks, examine any imported assumptions, and determine if the TA's conclusion survives. They also want a better analogy if possible.

  First, I need to recall Hempel's raven paradox. It's about confirmation theory: the statement "All ravens are black" seems logically equivalent to "All non-black things are non-ravens." So, seeing a green apple should confirm the contrapositive, but intuitively, it feels unrelated to ravens being black. The paradox is that this leads to counterintuitive results, like non-ravens affecting a hypothesis about ravens.

  The keys analogy is straightforward: in a four-room house, checking one room and not finding keys increases confidence that they're in another room. The TA claimed this is similar—every green apple is like checking a room, nudging up the probability that all ravens are black because you're covering possibilities.

  Now, I'll map the elements:
  - Source: Keys must be in the house → Target: Everything in the world must be either a raven or not raven, black or not black. This holds partially because the universe is vast, so it's not a closed set like a house.
  - Source: Kitchens, bedrooms as rooms → Target: Categories like green apples or black ravens. This breaks because rooms are exclusive and exhaustive, while objects can belong to multiple categories.
  - Source: Looking and not finding keys → Target: Observing a green apple or a non-black non-raven. This holds for the contrapositive logic but feels different intuitively.
  - Source: Increasing confidence after negative evidence → Target: Confirming the hypothesis. This holds in Bayesian terms, but the scale matters—small nudges vs. significant updates.

  For imported assumptions:
  - The "must be somewhere" assumption is crucial. In keys, it's a finite, known space; for ravens, the universe is infinite and unknown, making probabilities dilute.
  - Exhaustive partitioning assumes rooms are mutually exclusive and cover all options, but in reality, objects aren't neatly partitioned like that.
  - Uniform prior probability implies all rooms are equally likely, which isn't true for ravens—you might have prior knowledge about where keys or birds are.

  Disanalogies:
  - Finite vs. infinite domains: Affects the conclusion because in an infinite world, seeing one green apple has negligible impact on the hypothesis.
  - Mutual exclusivity: Doesn't hold for categories, so it might not affect the core logic but makes the analogy shaky.
  - Practical significance: Affects the conclusion because Bayesian updates are tiny, so it doesn't feel like confirmation in everyday terms.

  Conclusion verdict: The TA's conclusion survives only in weakened form. Technically, green apples do confirm the hypothesis by Bayesian reasoning, but the effect is so small it's practically zero, and the paradox arises from ignoring context and intuition. So, what survives is the mathematical logic; what falls is the practical relevance and resolution of the paradox.

  For a better analogy: The haystack analogy fits better. Looking for a needle in a haystack—finding a piece of hay isn't the needle, so it slightly increases confidence it's elsewhere, but it's inefficient and ignores that focusing on needles directly is smarter. This captures the irrelevance without false constraints.

  One-line summary: The keys analogy imports a finite, closed world, making confirmation seem stronger than it is; green apples do confirm "all ravens are black" mathematically, but negligibly, so the paradox's bite remains in practical terms.

  Finally, I'll structure this as a JSON object with the specified fields, using clear, American English.
