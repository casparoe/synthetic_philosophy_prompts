prompt: |-
  I don't have any academic background (I teach high school biology, if that matters), but I've been chewing on something and I've got a shot at pitching a small foundation for six months of funding, so I need it to look like a real proposal. Everyone keeps throwing heritability numbers around — "IQ is 60 to 80 percent heritablity," "height is 80 percent genetic" — and I think the same number is being asked to do two completely different jobs. Sometimes it's used to mean how much of a trait is "in our genes," as if that were a fixed property of the trait itself. Other times what people actually care about is whether changing the environment would change anything. My half-formed hunch is that heritability is really just a local variance ratio — basically a measure of how much the environment is currently differentiating people within one particular population — and if that's right, a high heritability might even be a sign the environment is unusually equal, not that genes rule. So I want to split what people mean into two separate quantities: a "differentiating" heritability (the share of the spread inside a population) and a "responsive" one (how far the population average would move if you changed the environment), and then show that the standard coefficient answers neither question cleanly. Can you turn this into a one-page proposal: the question stated so it actually has an answer, why the usual ways of talking about heritability leave it open, why this is a conceptual job rather than just a data-collection one, what I'd actually do month by month, what a useful deliverable would look like for the teachers and journalists and policy people who cite these numbers, and what would count as the project failing? Don't bother with citations or a reading list, I'll add those myself if I get the money.
