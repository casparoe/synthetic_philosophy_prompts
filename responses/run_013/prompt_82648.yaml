prompt: |-
  I collect odd bits of writing about art crime, and I've got a pattern I cant find a word for -- or not one that fits.

  Here's the thing. When a fake gets exposed, something strange happens to its price. Not always, but often: the object that was worth a fortune as an original is worth nothing as a fake for about five minutes, and then it comes back up, sometimes higher than it would have been if it had been genuine, because now it's *the* object that fooled the experts. The deception itself has become the asset. I've seen this with old forgeries that sat in museums for decades, and with more recent ones where the entire appeal at auction was that this was the one that got past the lab for eleven years.

  What's odd is that it isn't the skill. Some of these things are mediocre paintings. It isn't the age or the period either -- there are a million objects from the same year that nobody wants. And it definitely isn't the aura of the original, since the whole point is that its not one.

  My first thought was that it's just the guitar thing: people pay more for a guitar because a famous person smashed it on stage, value by association with a notable event. But that doesn't quite do it, because here the notable event is a mistake, and specifically a mistake made by people whose job was to know better. There also seems to be a sweet spot. If the forgery is too good it just gets filed as a good painting of the period and loses the magic; if it was obviously bad, nobody was ever fooled and there's no magic either. The value peaks when it fooled the right people for the right amount of time.

  And there's a cousin that makes me doubt it's all one thing: a painting downgraded from the master to studio of, whose price falls, and which then a certain kind of collector wants *because* it's the one that used to hang as the master. No deception there, just an error that everyone now agrees on.

  So is there a name for this? I know the general neighbourhood -- authenticity, aura, whether a perfect forgery can be as good as the original -- but all of that is about the original, or about the fake before it's exposed. I'm after the specific thing where the exposure is what makes it valuable. If there's no name, coin one, but give me the edges: is it a species of the celebrity-guitar thing or is there something left over that that doesn't cover? How is it different from the teaching-collection case, where a museum keeps a fake to show students how fakes fool people? Does the cousin belong with it, or does deliberate deception have to be in there somewhere? And what do you call the sweet spot itself?

  A bare name won't help me, I need the carving.
reasoning: |-
  Okay, the user is really into art crime and has noticed this fascinating pattern where the exposure of a forgery actually boosts its value after an initial drop. They're looking for a term that captures this phenomenon, but existing words like "authenticity" or "aura" don't quite fit because the value comes from the deception being revealed. 

  First, I need to unpack what they're describing. The key elements are: the object's value plummets when exposed as fake, then skyrockets because it's "the one that fooled experts." It's not about the art's quality or age—it's about the story of the deception itself. The sweet spot is crucial: it must have fooled respected experts long enough to be embarrassing but not so perfectly that it blends into the period. 

  The user also mentions a "cousin" case: artworks downgraded from "master" to "studio of," where collectors want them solely because they were once mistaken for the master's work. That's different—no intentional forgery, just scholarly error. 

  Hmm. The celebrity-guitar analogy (value from association with an event) is close but not quite right. Here, the "event" is a failure of expertise, which adds a layer of institutional egg-on-face appeal. And the teaching-collection angle is different—that's pedagogical, not market-driven. 

  So what's at the core? It seems like value derived from the narrative of institutional fallibility. The forgery becomes a trophy proving experts can be humbled. The sweet spot is where that narrative is most potent—long enough to be scandalous, exposed dramatically enough to be memorable. 

  For naming... "Notoriety premium" is descriptive but bland. "Schadenbonus" (German mashup for "harm-bonus") hints at the glee in expert failure. "Expert-trap trophy" feels more vivid—it centers the deception as a captured prize. 

  The cousin case? That's more about "fallen attribution prestige." Same market psychology (desire for objects with contested histories), but without the forger's intent. Probably a sibling phenomenon, not the same species. 

  The sweet spot needs its own term too—"credibility horizon" (the timeframe the deception held) or "embarrassment threshold" (how much egg-on-face is desirable). 

  User wants "the carving," not just labels. So I'll emphasize the differences: deception vs. error, market trophy vs. teaching tool. And sit with the discomfort—this value springs from loving to watch authority stumble. That's the dark, crunchy center here.
answer: |-
  Your observation cuts deep into the paradox of value creation through institutional failure. There isn't a single, universally accepted term for this *exact* phenomenon, but we can carve its contours with precision and propose fitting names. Here's the dissection:

  **The Core Phenomenon:**
  You've identified a specific **value inversion triggered by the *exposure* of deception**. The asset isn't the skill, age, or aura of the original; it's the *narrative of the deception itself* and the *embarrassment of the experts*. The exposure isn't destructive; it's *revelatory*, transforming the object into a trophy of institutional fallibility.

  **Key Differentiators & Edges:**

  1.  **vs. Celebrity Association (Guitar Smash):**
      *   **Similarity:** Value derived from association with a notable event.
      *   **Crucial Difference:** The "event" here is *negative* – a failure of expertise, an institutional mistake. The appeal isn't just fame, but *schadenfreude* or fascination with fallibility. It's "This humbled the gatekeepers," not "This touched greatness."
      *   **Edge:** The *humiliation factor* is essential. The value spikes because it proved the experts *wrong*, specifically in their domain of supposed authority.

  2.  **vs. Pedagogical Value (Teaching Collection):**
      *   **Similarity:** The object demonstrates how deception works.
      *   **Crucial Difference:** The teaching collection object's value is *didactic* and *institutional*. Its audience is students and scholars. Your phenomenon's value is *narrative-driven* and *market-based*. Its audience is collectors fascinated by scandal, history, and the psychology of deception. The "trophy" aspect dominates.
      *   **Edge:** The *auction frenzy*, the *collector's desire for the notorious*, the *market premium* applied *after* exposure – this is distinct from an object curated for quiet study.

  3.  **vs. The "Cousin" (Downgraded Master -> Studio):**
      *   **Similarity:** Value derived from a *previous* attribution/status, even after correction.
      *   **Crucial Difference:**
          *   **Intent:** The "cousin" involves *scholarly error or evolving consensus*, not *deliberate deception*.
          *   **Narrative:** The "cousin" whispers "I was *once* thought to be great"; the exposed forgery shouts "I *fooled* them into thinking I was great!" One is about *past glory*, the other about *active trickery and exposure*.
          *   **Psychic Charge:** The exposed forgery carries the thrill of the con, the sting of the reveal, the "gotcha!" moment. The downgraded work carries a more melancholic or historical "lost potential" vibe.
      *   **Edge:** *Deliberate deception and its subsequent unmasking are fundamental* to the phenomenon you describe. The "cousin" belongs to a related but distinct category: **Provenance-of-Error Value** or **Fallen Attribution Prestige**.

  4.  **The Sweet Spot:**
      *   This is critical. The value peaks when:
          *   **Credibility Horizon:** The deception was credible *long enough* to be significant and embarrassing, but *not* so perfect it becomes indistinguishable or loses its identity as *the* fake.
          *   **Expert Stature:** The experts fooled were sufficiently prestigious. Fooling a local curator ≠ fooling Sotheby's and the Met.
          *   **Dramatic Exposure:** The unmasking has elements of scandal, surprise, or forensic intrigue (lab tests, archival discoveries).
      *   **Naming the Sweet Spot:** This could be the **Credibility Threshold**, the **Embarrassment Horizon**, or the **Deception Saturation Point**. It's where the narrative of the con reaches peak potency.

  **Proposed Names for the Phenomenon:**

  1.  **Schadenbonus (German mashup: Schadenfreude + Bonus):** Captures the value derived from the *pleasure/fascination at the experts' misfortune*.
  2.  **Notoriety Premium:** Direct, emphasizes the fame gained *through* exposure as a fake. Less specific to the expert-failure angle.
  3.  **Expert-Trap Trophy Value:** Highlights the object as a prize capturing a specific failure of expertise.
  4.  **Revelation Value / Exposure Value:** Focuses on the *act of unmasking* as the value-creating event.
  5.  **Post-Exposure Scandal Premium:** Emphasizes the market's reaction to the revealed scandal.

  **The Carving:**

  *   **Core:** Value inversion driven by the *narrative* of successful deception and subsequent exposure, specifically humiliating established expertise.
  *   **Essential Ingredients:** Deliberate forgery + Credible deception of prestigious experts + Dramatic exposure + Market fascination with the scandal/story.
  *   **Distinct From:**
      *   **Celebrity Association:** Requires the *negative event* of expert failure, not positive fame.
      *   **Pedagogical Value:** Driven by market desire for notorious trophies, not scholarly instruction.
      *   **Provenance-of-Error Value ("Cousin"):** Requires deliberate deception, not just mistaken attribution; focuses on the *act* of fooling, not the *past status*.
  *   **Sweet Spot:** The **Credibility Horizon** – where the duration and quality of the deception maximize the potency of the exposure narrative.

  **Conclusion:**

  The phenomenon you describe is a unique blend of art market psychology, fascination with deception, and the public appetite for seeing authority figures stumble. **Schadenbonus** or **Expert-Trap Trophy Value** best capture its essence, emphasizing the core elements of derived value from expert failure and the object's status as a captured "trophy" of deception. The **Credibility Horizon** defines the sweet spot where this value peaks. Your "cousin" is a related species (both involve value from mistaken identity), but belongs to the genus **Provenance-of-Error Value**, distinguished by the absence of *deliberate* deception. What you've identified is the specific, potent value generated when a *deliberate lie* is spectacularly exposed, turning the lie itself into the most valuable truth about the object.
