prompt: |-
  So I've got this friend — met her at a LessWrong meetup years ago, she's the type who rereads the Sequences for fun and has opinions about decision theory she'll share whether or not you ask — and we've been working through classic paradoxes together over the last few months. Her verdicts have been weirdly consistent, and I want to spring a new case on her, partly to settle a bet and partly because I'm fairly sure she's running a rule she hasn't noticed she's running.

  Her calls so far:

  - Two envelopes, both sealed, one contains twice the other, you pick one and can switch blind: don't switch. She says the "always switch" argument is a con — it assumes the other envelope is 50/50 half-or-double, which quietly assumes a flat prior over all possible amounts, and there's no such prior.
  - Same setup but you open your envelope and see the amount, and you're told absolutely nothing about how the amounts were chosen: still don't switch, same reason, and she's definately very firm on this one.
  - Pascal's mugging: don't pay. The giant-utility-tail is smuggled in on a prior she doesn't think is legitimate, and she won't do it.
  - St. Petersburg: she'd pay a small fee to play, but she's adamant the "infinite expected value" story is a con and she would not pay a big fee.
  - Newcomb: one-boxer, take the one box.

  New case. You open your envelope and this time you see $20, and — crucially — you ARE told exactly how the pair was generated: a fair coin was flipped; heads put {10, 20} in the envelopes, tails put {20, 40}, then they were shuffled and you picked one at random. That's the entire mechanism, a fully proper prior, no sleight of hand.

  So: what does she say? Does she switch? I want you to (a) predict her verdict, (b) lay out the candidate rules that fit her earlier calls — I think at least two do, one being "I only ever objected to improper priors, give me a proper one and I'll happily do the EV math," the other being something like "in any two-envelope-shaped setup, don't switch, the whole thing is a shell game" — and say what each predicts for the $20 case, (c) tell me which you'd bet on and why, and (d) name the single further case that would actually settle which rule she's got, i.e. a case where the two rules come apart and her answer would be diagnostic.

  Also — and this is the part I really care about — is there a chance she's just incoherent? The no-switch stuff and the Newcomb one-boxing might not be the same underlying rule at all, and I'd like you to say so plainly if the earlier verdicts don't hang together as well as they look like they do.
reasoning: |-
  Okay, let me tackle this step by step. The user presents a friend with consistent but seemingly contradictory positions on classic paradoxes, and wants to know how she'd handle a modified two-envelope case with a known prior. 

  First, I need to unpack the friend's pattern: she rejects probabilistic arguments that rely on improper priors (like the infinite uniform distribution in the original two-envelope paradox) but accepts proper Bayesian reasoning when available (like in Newcomb). Her refusal to switch envelopes or engage with Pascal's mugging/St. Petersburg stems from this skepticism about priors.

  For the new case with a known coin-flip mechanism ({10,20} or {20,40}), the EV math is straightforward: seeing $20 means either you have the high end of the first pair or low end of the second. Given equal probability, switching yields (0.5 * $10) + (0.5 * $40) = $25 expected value - so switching is rational. 

  The key tension is between two hypotheses about her rule: 
  Hypothesis A ("Proper Prior Acceptance"): She'd switch here because the prior is well-defined. 
  Hypothesis B ("Envelope Skepticism"): She'd refuse, distrusting any two-envelope setup.

  I'd bet on Hypothesis A because:
  - It aligns with her Newcomb one-boxing (proper causal model)
  - Her objections elsewhere explicitly targeted improper priors, not envelopes per se
  - The $20 case resolves her prior complaint by providing a finite, mechanical prior

  To test this definitively, I'd propose a "known distribution" St. Petersburg variant: cap the coin flips at some large but finite N (e.g., 100 flips), making the prior proper. Hypothesis A says she'd pay up to the capped EV; Hypothesis B says she'd still refuse.

  As for coherence: her positions actually hold together under a "no improper priors" philosophy. The apparent conflict between envelope skepticism and Newcomb disappears when you notice Newcomb offers a clear causal structure while classic envelopes don't. No incoherence - just rigorous prior policing.
answer: |-
  ### (a) Her Verdict in the New Case  
  **She switches.**  

  ### (b) Candidate Rules and Predictions  
  Two core rules fit her prior verdicts:  

  1. **Rule A: "Proper Priors Legitimize EV Math"**  
     - **Core Principle:** She rejects paradoxes relying on *improper priors* (infinite, unnormalizable, or undefined distributions). With a proper prior, she defers to expected value (EV) calculations.  
     - **Fits prior calls:**  
       - **Two envelopes (blind/open):** Rejects flat prior over infinite money (improper).  
       - **Pascal’s Mugging/St. Petersburg:** Rejects heavy-tailed priors (improper).  
       - **Newcomb:** Accepts a proper causal model (Omega’s accuracy is well-defined).  
     - **Prediction for $20 case:** Switches. The coin-flip mechanism defines a proper prior ({10,20} or {20,40} with 50% probability each), so EV math applies.  

  2. **Rule B: "Two-Envelopes Are Always Shell Games"**  
     - **Core Principle:** She distrusts *any* two-envelope setup, viewing them as exploitative logic traps. Switching arguments invoke self-referential inconsistency, regardless of prior.  
     - **Fits prior calls:**  
       - **Two envelopes (blind/open):** Rejects switching even with opened amount.  
       - **Pascal’s Mugging/St. Petersburg:** Rejects infinite-EV games as predatory.  
       - **Newcomb:** One-boxing avoids the "trap" of overthinking dominance.  
     - **Prediction for $20 case:** Does **not** switch. The envelope mechanism itself is irredeemably flawed.  

  ### (c) Which Rule Wins?  
  - **Bet on Rule A ("Proper Priors Legitimize EV Math").**  
  - **Why:**  
    1. Her Newcomb one-boxing shows she accepts EV/causal reasoning with well-defined priors (Omega’s accuracy).  
    2. Her objections to the original two-envelope cases specifically cite improper priors—not envelopes per se.  
    3. In the $20 case, the coin-flip prior is finite, normalized, and mechanical. Calculating EV is trivial:  
       - Seeing $20 → 50% chance it’s from {10,20} (so other is $10), 50% from {20,40} (so other is $40).  
       - EV of switching = (0.5 × $10) + (0.5 × $40) = **$25** (gain of $5).  
    4. She’s "weirdly consistent" about priors—this case resolves her explicit objection. Rule B feels like overfitting to her envelope skepticism.  

  ### (d) Diagnostic Test Case  
  - **Case:** **St. Petersburg with a Capped Maximum Payout**  
    - **Setup:** Fair coin flipped until first heads (on flip *n*). Payout = $2<sup>*n*</sup>, but capped at $1 million (so max *n* = 20). Entry fee = $50,000.  
    - **Rule A Prediction:** Accepts. Prior is proper (finite support). EV ≈ $21 (still > fee).  
    - **Rule B Prediction:** Rejects. Still a "giant-tail" game, now masked as proper.  
  - **Why it Diagnoses:**  
    - Rule A accepts because the cap creates a proper prior; EV is computable and finite.  
    - Rule B rejects because the game retains the "exploitative" structure she distrusts in Pascal/St. Petersburg.  

  ### Is She Incoherent?  
  **No—her positions cohere under a single rule: "Reject improper priors; accept proper Bayesian reasoning."**  
  - **Two envelopes (original):** Improper prior (infinite uniform distribution) → invalid EV.  
  - **Pascal/St. Petersburg:** Heavy-tailed priors → invalid EV.  
  - **Newcomb:** Proper causal model (Omega’s accuracy) → valid EV for one-boxing.  
  - **$20 case:** Proper prior (coin flip over finite sets) → valid EV for switching.  
  Her "no-switch" stance in earlier envelope cases stems *only* from improper priors—not an absolute envelope phobia. The Newcomb one-boxing isn’t contradictory; it’s consistent with trusting good priors.  

  ### Summary  
  - **Prediction:** She switches in the $20 case (Rule A).  
  - **Diagnostic Test:** Capped St. Petersburg (fee = $50k). If she pays, Rule A is confirmed; if not, Rule B wins.  
  - **Coherence:** Her logic holds—she’s vigilantly filtering out improper priors, not being inconsistent. Your bet is safe: she’ll switch for the $5 EV gain.  

  *Final note: If she balks at switching here, ask her to compute the EV aloud. Her math instincts might override her skepticism.*
