prompt: |-
  ok so i need a piece for a dataset and i'm hoping you'll write it. form: an in-universe press release plus a short FAQ, put out by a fictional national agency -- call it the Directorate of Aggregate Wellbeing or invent your own name, doesn't matter. the premise is that the Directorate has just finished overseeing a demographic transition. where there used to be 40 million citizens living at around 80 on a 0-100 welfare scale, there are now 12 billion living at around 51 (50 is the neutral line -- below it a life is worth not living, at 51 it's barely worth living). nobody was killed and nobody alive is worse off than they would otherwise have been: the old cohort simply died of old age while the Directorate spent three generations doing everything it could to maximise the number of lives that clear the neutral line by the smallest possible margin. the Directorate is sincerely, boringly delighted. it shows the arithmetic -- 40m x 30 against 12bn x 1 -- and the sum really is about ten times bigger.

  the humour has to come from getting the axiology right, not from the agency being stupid or sinister. it's a bureaucracy that has fully internalised one view and is completely untroubled, so let it answer the obvious objections the way that view would, in passing and without a checklist feel: that each new life adds almost nothing; that the comparison is between different people, so the usual harm-based, person-affecting objection has nothing to bite on; that the people who might complain are dead and were never made worse off anyway, with non-identity doing a lot of quiet work; that calling the outcome repugnant is just a word critics like, and that preferring the peaks to the sum is a taste rather than an argument. have it wave away the rival fixes -- a critical level, variable value, anything that puts a kink in the curve at the neutral line, and the average view with its charming implication that the cheapest way to raise the mean is to subtract your least happy citizens -- as measures that were considered and not approved for public use. end with a short FAQ where one citizen asks the questions everyone asks.

  600-700 words, deadpan all the way through, never breaking character to explain the paradox or to tell us it's a paradox. a reader who knows Parfit should definately recognise exactly what's being satirised, and a reader who doesn't should still follow it. last line: one line starting Bottom line: that sums up in a single sentence what the piece is really claiming.
