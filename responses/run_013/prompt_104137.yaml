prompt: |-
  You're a philosopher of medicine who also knows the general literature on how definitions work and on the role definitions play in argument. Think carefully before you answer, and start by brainstorming a handful of candidate labels before you commit to one.

  I sit on a hospital ethics committee and I've started noticing a move I don't have a name for. Whenever we argue about what death is, the definition gets quietly re-tooled so that it keeps matching whatever we already do, and then it gets waved around as if it were the thing deciding the hard cases. A few examples. Our policy says death is the irreversible loss of the capacity for consciousness together with loss of brainstem function; then a patient on ECMO clearly has no capacity for consciousness but still shows some brainstem reflexes, and rather than admit the definition was off, we amend the policy to drop the brainstem part. In another jurisdiction the statute says death is irreversible cessation of circulatory and respiratory function, but in practice everyone is declared dead by neurologic criteria, and when someone objects we're told the neurologic test is just how you establish the circulatory thing, since the brain is what drives circulation. And when a family refuses a neurologic declaration on religious grounds, someone always floats the idea that maybe the definition should also require that the family accepts it, which would make a fact about the patient depend on an attitude in the room. What bugs me is that the definition is never the thing that settles anything -- it's adjusted after the fact every time -- and yet we all keep treating it as the authority, and nobody seems bothered.

  Is there an established name for this? I half-remember a few terms from philosophy of science and from the theory of definition that feel close but not the same, and I'd like you to say how each near miss differs and which, if any, is the real thing. If nothing fits, coin a term, define it, and tell me where its edges are -- what would be a borderline case, and what would just be an ordinary case of revising a definition rather than the phenomenon I'm describing. A bare label won't help me; I need the carving.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They’re on a hospital ethics committee and they’ve noticed this pattern where the definition of death keeps being adjusted to match existing practices, then presented as the authority in arguments. They want to know if there’s a term for this. 

  First, I need to unpack their examples. In the first scenario, the policy initially requires irreversible loss of consciousness and brainstem function. But when a patient on ECMO shows no consciousness but still has brainstem reflexes, they drop the brainstem part instead of admitting the definition was flawed. The second example involves a jurisdiction where death is legally defined as cessation of circulatory and respiratory functions, yet they use neurologic criteria. When challenged, they claim the neurologic test is just a way to confirm circulatory cessation because the brain drives circulation. Then there’s the case where a family objects on religious grounds, and someone suggests the definition should require family acceptance, making death depend on their attitude. 

  The user’s frustration is that definitions aren’t settling anything—they’re retrofitted to justify decisions already made, yet everyone treats them as authoritative. They mentioned terms from philosophy of science or definition theory that feel close but not quite right. 

  I should brainstorm possible labels. Let me think about related concepts. Operationalism comes to mind—defining concepts by how we measure them. But the user’s issue is more about retrofitting definitions to match practice, not just measurement. Moving the goalposts is a fallacy, but it’s more about arguments than systemic definitional drift. Persuasive definition involves redefining terms to win arguments, but here it’s not just persuasion—it’s institutional practice. 

  Then there’s operational creep, where definitions expand beyond original intent. That’s closer, but might not capture the retroactive aspect. Definitional gerrymandering—shaping definitions to include/exclude specific cases, like political gerrymandering. That fits the tailoring aspect. But the key here is the retroactive adjustment to align with practice while maintaining the definition’s authoritative facade. 

  The user also needs differentiation from ordinary definition revision. Normal revisions respond to new evidence or clarity. Here, revisions are ad hoc to avoid admitting inconsistency, preserving institutional authority. 

  Coining a term: maybe "Retrojustificatory Definitional Drift." Breaking it down: retrojustificatory because it's after-the-fact justification, definitional drift for the gradual shift. But that’s a mouthful. "Normative Camouflage" emphasizes hiding normative choices under a veneer of objectivity. "Post Hoc Definitional Stabilization" highlights stabilizing practices by adjusting definitions post hoc. 

  Considering the user’s role, they need a term useful in ethics committee discussions. Clarity and memorability matter. "Definitional Gerrymandering" might resonate because it implies boundary manipulation for convenience, which matches the examples. 

  Borderline cases: If new tech shows brainstem reflexes aren’t reliable, revising based on that is normal. But if you drop the brainstem part only when it conflicts with practice without new evidence, that’s gerrymandering. 

  Also, distinguishing from motivated reasoning: if someone argues for a definition change because they believe it’s better, that’s different. But when the change is to avoid institutional dissonance without genuine conceptual progress, it’s gerrymandering. 

  The user’s deeper need might be to articulate this practice to challenge it in committee. A precise term could empower them to call out the behavior and advocate for more honest discussions about the normative judgments underlying death determination.
answer: |-
  Based on your detailed description and the philosophical toolkit you requested, here's a systematic analysis:

  **Brainstormed Candidate Labels:**
  1.  **Operationalism / Operational Definition Run Amok:** (Bridgman, philosophy of science) Defining a concept solely by the operations used to measure it.
  2.  **Moving the Goalposts (Fallacy):** (Informal logic) Changing the criteria for a claim after evidence is presented.
  3.  **Persuasive Definition:** (Stevenson, ethics) Defining a term to influence attitudes or prescribe norms, disguised as description.
  4.  **Operational Creep:** (Adapted from law/tech) Gradual expansion of an operational definition beyond its original scope.
  5.  **Definitional Gerrymandering:** (Adapted from political theory) Manipulating the boundaries of a definition to achieve a desired outcome for specific cases.
  6.  **Retrojustificatory Definitional Drift:** (Proposed) Shifting definitions after the fact to justify existing practices.
  7.  **Normative Camouflage:** (Proposed) Hiding value judgments within seemingly objective definitions.
  8.  **Post Hoc Definitional Stabilization:** (Proposed) Adjusting definitions to maintain conceptual stability *after* encountering counter-examples, prioritizing institutional practice over conceptual clarity.

  **Analysis of Near Misses & Selection:**

  1.  **Operationalism:**
      *   **Why it fits:** Death *is* operationally defined (via neurological or circulatory tests). The examples show operational criteria driving the *meaning*.
      *   **Why it misses:** Classic operationalism is upfront: "X *is* what we measure by Y." Your concern is the *retroactive adjustment* of the operational criteria or their *interpretation* to fit practice, while maintaining the illusion the definition is primary. Operationalism doesn't inherently capture the *dynamic, post-hoc justification* you observe.
      *   **Difference:** Operationalism is a static approach; your phenomenon is a *process* of operational redefinition *in response to* practice.

  2.  **Moving the Goalposts:**
      *   **Why it fits:** The definition changes *after* a hard case arises (ECMO patient, religious objection) to avoid an unwanted conclusion.
      *   **Why it misses:** This fallacy is typically about *individual arguments* where a debater shifts criteria. Your examples show *institutional, systemic, policy-level* redefinition, often presented not as a shift but as a clarification or correct interpretation of the *original* authority. The definition retains its formal authority *because* it was changed.
      *   **Difference:** Scale and locus. "Moving the goalposts" is tactical in argument; your phenomenon is strategic in institutional rule-making and maintenance.

  3.  **Persuasive Definition:**
      *   **Why it fits:** The definitions (and their adjustments) are clearly serving normative goals (facilitating organ donation, resolving disputes, maintaining institutional coherence) while presenting as objective facts.
      *   **Why it misses:** Persuasive definitions are often deployed *proactively* to win arguments. Here, the persuasive redefinition happens *reactively* to justify *what is already being done or desired*. The emphasis is on *retrofitting* the definition to practice, not just using definition to persuade.
      *   **Difference:** Your phenomenon involves *retroactive alignment* with practice under the guise of objective definition, whereas persuasive definitions are primarily about loading evaluative content into terms *for* persuasion.

  4.  **Operational Creep:**
      *   **Why it fits:** The scope of the operational definition (e.g., what counts as "cessation of circulatory function") expands (neurological testing as proxy) beyond the original literal meaning.
      *   **Why it misses:** "Creep" implies slow, unintentional expansion. Your examples show deliberate, often rapid, *adjustment* in response to specific pressures (ECMO case, legal conflict, family objection). It's not just expansion; it's targeted *redefinition* or *reinterpretation* to resolve dissonance.
      *   **Difference:** Creep is passive drift; your phenomenon is active, targeted redefinition for justification.

  **The Best Fit & Coined Term:**

  While "Persuasive Definition" and "Operational Creep" capture aspects, the core issue is the **systematic retroactive adjustment of a formal definition (or its interpretation) to align with established practices or desired outcomes, while maintaining the definition's authoritative status as the ostensible source of justification.**

  This is **Definitional Gerrymandering**.

  *   **Definition:** **Definitional Gerrymandering** is the practice of strategically adjusting the boundaries, criteria, or interpretation of a formal definition *post hoc* to ensure specific cases (often those challenging institutional practice or consensus) fall inside or outside its scope, thereby preserving the definition's perceived authority and legitimacy while masking the underlying normative choices or practical imperatives driving the adjustment.
  *   **Why "Gerrymandering"?** It perfectly evokes the image of manipulating boundaries (like electoral districts) to achieve a predetermined, advantageous outcome for specific cases ("packing" or "cracking"), all while maintaining the formal structure (the map, the definition).

  **Carving the Concept - Boundaries & Edges:**

  1.  **Core Case (Gerrymandering):**
      *   A hard case reveals a conflict between the stated definition and established practice/desired outcome.
      *   The definition (or its operational criteria/interpretation) is *adjusted specifically to resolve that conflict* for the case(s) at hand.
      *   The adjusted definition is presented *not* as a fundamental change driven by new understanding, but as a clarification, refinement, or correct application of the *original* authoritative concept.
      *   The purpose is to maintain institutional stability, avoid admitting prior inconsistency, or achieve a specific outcome (e.g., enabling declaration of death for organ donation, resolving a dispute) while preserving the definition's rhetorical authority.
      *   *Your Examples:* Dropping brainstem requirement post-ECMO case; reinterpreting "circulatory cessation" to *mean* brain death; proposing adding "family acceptance" post-objection.

  2.  **Borderline Case (Distinguishing from Ordinary Revision):**
      *   **Scenario:** New scientific evidence shows that isolated, minimal brainstem reflexes in the complete absence of cortical activity are *not* indicative of integrated biological function or potential for consciousness. The policy is revised to drop the brainstem requirement based *primarily* on this new understanding and conceptual coherence, even if it also resolves the ECMO conflict. The revision is argued on conceptual/scientific grounds first.
      *   **Why Borderline:** It addresses the practical conflict but does so based on *new conceptual/scientific justification*, not *primarily* to resolve the institutional dissonance. The trigger might be the case, but the justification isn't purely retrojustificatory. If the *only* justification given is "this makes the ECMO case fit," it tips into gerrymandering.

  3.  **Ordinary Revision (Not Gerrymandering):**
      *   **Scenario:** Advances in neuroimaging provide robust, direct evidence of consciousness in patients previously thought permanently unconscious, leading to a fundamental re-evaluation and revision of the definition of death based on this *new knowledge about the phenomenon itself*.
      *   **Key Difference:** The revision is driven by a *change in understanding of the underlying phenomenon* (consciousness, biological integration), not primarily by the need to make the definition match *what the institution already wants to do* or to resolve a specific practical/logistical conflict. The authority for the change comes from new scientific insight, not institutional convenience masked as definitional authority.

  4.  **Another Non-Gerrymandering Case:**
      *   **Scenario:** A jurisdiction honestly debates the conceptual basis of death (e.g., higher-brain vs. whole-brain) and consciously *changes* its legal definition after public and expert deliberation, acknowledging the shift in underlying rationale.
      *   **Key Difference:** Transparency about the normative shift and the source of authority for the change (deliberative decision), not retrofitting the old definition to cover new practices.

  **Why "Definitional Gerrymandering" Fits Best:**
  *   It captures the **strategic manipulation of boundaries** (gerrymandering) specifically for **definitional content**.
  *   It emphasizes the **post hoc** nature ("after the fact every time") to achieve specific **case-based outcomes** (like the ECMO patient, the religious objection).
  *   It highlights the **maintenance of formal authority** ("waved around as if it were the thing deciding") despite the manipulation – the gerrymandered map *is* the official map.
  *   It implicitly reveals the **normative/political underpinnings** (the "attitude in the room," institutional needs) masked by the seemingly objective definition – gerrymandering is inherently political.
  *   It perfectly describes the core bug: "the definition is never the thing that settles anything -- it's adjusted after the fact every time -- and yet we all keep treating it as the authority."

  This label gives you a precise tool to name and critically examine this pervasive and problematic dynamic within your ethics committee and institutional policies, moving beyond frustration to focused critique.
