answer: |-
  Here’s a rigorous set of desiderata for any adequate theory of costly signaling, grounded in key cases, puzzles, distinctions, and theoretical constraints. Requirements are categorized by necessity, with tensions highlighted.

  ---

  ### **I. Core Cases Any Theory Must Explain** (Non-Negotiable)
  1. **The Peacock’s Tail** (Zahavi’s classic): *Why do extravagant, fitness-reducing traits honestly signal genetic quality?*  
     → Must show how cost prevents cheating by low-quality signallers.

  2. **Gazelle Stotting** (Predator deterrence): *Why waste energy leaping when fleeing?*  
     → Must demonstrate how "wasted" cost signals unprofitability of pursuit ("I’m too fit to catch").

  3. **Human Charitable Giving** (e.g., EA pledges): *Why give publicly beyond optimal private donation?*  
     → Must distinguish altruism from signaling social commitment/wealth.

  4. **Conspicuous Consumption** (Veblen goods): *Why pay more for functionally identical luxury watches?*  
     → Must explain how cost signals status without assuming irrationality.

  5. **Cheap/Deceptive Signals** (e.g., copycat brands): *Why are some signals honest despite low cost?*  
     → Must account for honesty maintenance in low-cost signals (e.g., via reputation).

  ---

  ### **II. Puzzles to Resolve** (Non-Negotiable)
  1. **Honesty Without Altruism**:  
     → *How can signals stay honest if signallers are self-interested?*  
     → **Key**: Cost must be *differentially affordable* (e.g., only high-quality signallers bear costs easily).

  2. **Cheap but Informative Signals**:  
     → *Why do some low-cost signals (e.g., diplomas) work?*  
     → **Resolution**: Receiver-imposed costs (e.g., punishing false diplomas) or conventional signals.

  3. **Deception Control**:  
     → *Why isn’t signaling overrun by fakes?*  
     → **Mechanism**: Costs raise mimicry barriers (e.g., fake Rolexes cheaper but detectable).

  ---

  ### **III. Critical Distinctions to Preserve** (Non-Negotiable)
  | **Distinction**          | **Definition**                                  | **Motivation**                                  |
  |--------------------------|------------------------------------------------|------------------------------------------------|
  | **Signal vs. Cue**       | Intentional vs. incidental information         | Gazelle stotting (signal) vs. age wrinkles (cue) |
  | **Handicap vs. Index**   | Cost-imposed vs. unfakeable trait              | Peacock tail (handicap) vs. voice pitch (index) |
  | **Strategic vs. Nonstrategic** | Conscious signaling vs. byproduct           | Conspicuous consumption (strategic) vs. stotting (debated) |
  | **Cost vs. Waste**       | Expenditure vs. inefficient design             | EA pledge (cost) vs. peacock tail (waste)       |
  | **Sender vs. Receiver Costs** | Paid by signaller vs. imposed by receiver   | Watch price (sender) vs. internship rejection (receiver) |

  ---

  ### **IV. Theoretical Constraints** (Non-Negotiable)
  1. **Stable Equilibria**: Signals must persist without unraveling (e.g., luxury watches remain credible).  
  2. **Persistence of Conventional Signals**: Costly *establishment* but low-cost *maintenance* (e.g., academic degrees).  

  ---

  ### **V. Tensions & Non-Negotiables by Camp**
  | **Requirement**               | **Non-Negotiable?** | **Original Handicap** | **Game-Theoretic** | **Human Signaling** | **Index Accounts** |
  |-------------------------------|---------------------|------------------------|---------------------|---------------------|-------------------|
  | **Cost Ensures Honesty**      | Yes (Core)          | ✓ (Waste required)     | ✓ (Differential costs) | ✓ (Social costs)    | ✗ (Unfakeability) |
  | **Explains Cheap Honest Signals** | Yes             | ✗                      | ✓ (Equilibrium)     | ✓ (Norms)           | ✓ (Indices)       |
  | **Sender vs. Receiver Costs** | Yes                 | Sender-only            | Both                | Both                | Sender-only       |
  | **Waste Necessary?**          | No                  | ✓                      | ✗ (Cost suffices)   | ✗                   | ✗                 |
  | **Deception Control**         | Yes                 | Implicit               | Explicit (equilibria) | Explicit (norms)    | Built-in          |

  ---

  ### **Key Tensions to Resolve**
  1. **Cost vs. Cheap Honesty**:  
     - *Tension*: If cost ensures honesty, how do cheap signals (e.g., authentic brand logos) work?  
     - **Resolution**: Conventional signals impose *receiver costs* (e.g., social punishment for fakes). Human accounts excel here; handicap purists struggle.

  2. **Biological vs. Cultural Signals**:  
     - Peacocks (fixed costs) vs. luxury watches (variable social costs). A unified theory must accommodate both.

  ---

  ### **Scorecard of Theories**
  - **Original Handicap Principle** (Zahavi): Nails peacocks/gazelles. Fails on cheap signals, rejects conventional signals.  
  - **Game-Theoretic** (Grafen, Spence): Solves stability and cheap signals via equilibria. Weak on deception control.  
  - **Human Signaling** (Henrich, Boyd/Richerson): Best for internships/charity via norm enforcement. Less rigorous on indices.  
  - **Index Accounts** (Maynard Smith): Excels on unfakeable signals (e.g., voice pitch). Ignores strategic costs.  

  **Your Cases**:  
  - **EA Pledges**: Likely costly signal if tied to public visibility (social receiver costs).  
  - **Luxury Watches**: Conspicuous consumption with *conventional* costs (brand premium as entry barrier).  
  - **Unpaid Internships**: Strategic signal if access filters by wealth (sender cost) *or* credentialing (receiver cost).  

  ---

  ### **Conclusion: Minimum Adequate Theory**
  Must explain **differential costs** (high-quality signallers pay less *marginal* cost) + **receiver skepticism** (detection/punishment). Combines game-theoretic stability with human norm enforcement. Rejects handicap dogma that waste is essential, embraces conventional signals. Tensions resolved by distinguishing *signal type* (index/handicap/conventional) and *cost source* (sender/receiver).

  Use this framework to test claims: If someone calls unpaid internships "costly signals," demand they specify *whose cost* and *how honesty is enforced*.
