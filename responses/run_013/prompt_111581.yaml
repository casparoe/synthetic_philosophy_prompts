prompt: |-
  I am assembling a small anthology of fiction for a graduate seminar that reads stories alongside problems in decision theory, and I have been unable to find one that dramatizes a particular idea — the one that circulates under the name updateless decision theory — without either turning into a lecture or smuggling in a diagram. So I am commissioning a story. Let me say what I take the idea to be; I am not asking you to explain it, but to build a plot that could only have been built by someone who had absorbed it and then put the vocabulary away. Ordinary decision theory treats your present situation as a premise and asks which act, from here, has the best consequences. The updateless idea asks a different question — which policy you should have adopted before you knew which of the situations your life would put you in — and then refuses to let the answer be revised merely because you have since learned which situation you are in; discovering where you stand is not, on this view, a reason to become a different chooser. Two features of the picture matter for the story. The first is that a policy is not the private property of the moment at which it is chosen: the same policy may be running in other people, in other agents, in earlier or later versions of you, and because each of them is running it, settling on a policy is settling what all of them do. The agreement among them is not produced by anything passing between them; it is produced by their being the same chooser. The second is that your present decision has no special standing merely because it is present, and yours.

  The setting I have in mind, though you may substitute a better one, is a chain of way-stations on a hard winter road, staffed by keepers trained at a single school on a single written rule about sharing stores with travellers and with one another — a rule that nothing enforces, since the stations are days apart, there is no traffic in the dead season, and no keeper can ever learn what the others did. Put one keeper at the centre of the story in the year the rule becomes expensive for her: the moment she learns which station she has drawn, and what keeping the rule will cost her there. Give her a companion or a stranded visitor who presses the obvious objection — that a policy cannot bind you once you know you would be better off abandoning it, and that no one will ever be the wiser, so what is the difference between the rule and a mood she has outgrown? — and let her answer be an argument rather than a sentiment. I want the correlation between choosers to do real work in the plot, and I want it to do that work without any channel: no rumour travelling down the road, no letter, no retaliation to be feared, no god keeping score. What she settles on at her station has to bear on what the others settle on at theirs for the only reason the theory allows — that they are the same kind of chooser she is.

  Two thousand to three thousand five hundred words, with a title. No epilogue, no author's note, and no character who exists in order to expound the idea; the reader should be able to reconstruct the view from what the characters want and refuse. Keep the metaphysics ordinary — no duplication machines, no simulations, no time travel, nothing that solves the problem by putting two copies of one person in a room. The temptation should be concrete enough, and costly enough, that the objection has real force, and the ending should not be a vindication: I would rather the reader finish unable to say with confidence whether the keeper's reasoning is wisdom or an elegant trap she has built for herself. If the theory's name appears in the story at all, let it be a name someone half-remembers from a course.
reasoning: |-
  Hmm, the user wants a custom short story that dramatizes "updateless decision theory" without explicitly explaining it. They're assembling an anthology for a graduate seminar on decision theory, so this needs to be academically rigorous yet literarily compelling. 

  The core challenge is translating this abstract theory into human drama. Updateless decision theory argues that you should commit to a policy before knowing your position, and stick to it even after learning you're in an unfavorable spot. The key points are: (1) the policy binds all identical decision-makers simultaneously without communication, (2) your present self has no privileged status. 

  I'll use their suggested setting: isolated winter way-stations. The protagonist Kaela discovers her station has meager supplies this year, making the sharing rule costly. Her companion Aris voices the obvious temptation to cheat. The theory must emerge through their conflict - no lectures. 

  For the metaphysics to stay ordinary, I'll emphasize how the keepers' identical training creates psychological alignment. When Kaela chooses to share despite hardship, she's not just acting for herself but as part of a distributed system. The tension comes from wondering if this is principled consistency or self-delusion. 

  Word count is tight. I'll open mid-crisis: Kaela weighing their last grain sack against the rule. Aris' skepticism will voice reader doubts. The ending stays ambiguous - we see Kaela share, but her hollow eyes suggest inner doubt. Title "The Unrevised Rule" hints at the theory without naming it. 

  Crucially, no expository dialogue. When Aris mocks "some old theory about not updating," it's dismissive, not explanatory. The keeper's manual will just say "the rule binds all stations as one hand." Readers reconstruct the theory from Kaela's insistence that changing her choice now would unravel something fundamental - even if she can't articulate what. 

  The real test is whether a reader unfamiliar with decision theory would feel the philosophical weight. That requires making scarcity visceral: chapped hands counting grains, the ache of hunger as moral calculus. If I succeed, the graduate seminar should have fierce debates about whether Kaela is noble or self-harming.
answer: |-
  ## The Unrevised Rule

  The blizzard howled like a forgotten god around Station Seven, rattling the thick timber shutters Kaela had barred hours ago. Inside, the air hung thick with the smell of damp wool, woodsmoke, and the gnawing, metallic scent of deep cold. Kaela traced the faded script on the heavy, leather-bound *Keeper’s Manual* propped open on the scarred table. The single rule, drilled into her and every keeper along the High Pass Road during their years at the Citadel School, seemed to pulse on the page: **"A station's stores are the road's stores. Share equally with the needful traveller and the distant keeper, as if your hand feeds your own mouth."**

  This winter, the rule felt less like wisdom and more like a knife pressed to her throat. Station Seven’s autumn cache had been poor – a blight on the root cellar, a predator decimating the smokehouse stores. The meticulously tallied grain sacks stacked against the far wall held barely enough for Kaela herself to survive the full isolation of the Dead Months. And yesterday, Aris had arrived.

  Aris wasn't a scheduled courier. He was a trader, caught out by an early storm, his own supplies lost when his sled broke through rotten ice miles back. He huddled near the fire now, wrapped in borrowed blankets, his face gaunt beneath its frost-reddened cheeks. His presence was a demand the rule insisted she answer.

  "The storm won't break for at least three days," Kaela murmured, not looking up from the manual. Her fingers, rough and chapped, rested on the column detailing ration calculations for unexpected guests.

  Aris shifted, the chair groaning. "Kaela," he said, his voice raspy but pragmatic. "Look at those sacks. Count them. Then look at me." He gestured towards the meager pile. "There's barely enough there for *one* to last until the spring thaw, let alone two. Sharing 'equally' means we *both* starve before the first thaw flowers show."

  She knew. The calculations screamed it in her head. The rule demanded she share half her remaining grain, half her preserved meat, half her dwindling stockpile of dried berries. It demanded she commit to slow, mutual starvation.

  "The rule exists for a reason," Kaela said, her voice tight. "For times like this. For travellers like you."

  "The rule," Aris countered, leaning forward, his eyes intense in the firelight, "was written by comfortable scholars in a warm Citadel, centuries ago. They never sat in a station like this, in a year like this, staring at empty sacks while the wind tried to claw its way in. What binds you to it *now*? Truly?" He spread his hands. "Who will know? The snow buries everything. The next keeper won't pass through for months, and they'll see only what you leave. Give me a traveler's ration for three days – enough to see me to Station Six if the storm lifts – and keep the rest for yourself. Survive. The rule doesn't need martyrs; it needs *keepers*."

  His words were the obvious objection, the voice of present-self screaming against the bindings of a past-self's policy. They echoed the secret doubts that had gnawed at Kaela since she’d tallied the stores after the blight. *Update*, the voice whispered. *You know your situation now. It's dire. Change the policy. Save yourself.*

  Kaela closed the manual with a soft thud. She stood, walking to the small, high window, scraping a patch of frost from the thick glass. Outside was only a swirling white void. Station Six was five days hard travel south in good weather. Station Eight, north, was seven. Isolated islands in a frozen sea. No letters passed in the Dead Months. No rumors flew faster than a man could walk, and no man walked this road now. There would be no retaliation, no societal shame, no cosmic ledger keeper marking her transgression. Aris was right: the snow would bury the truth.

  She turned back, her face unreadable in the flickering gloom. "It's not about who knows, Aris. Or about fear."

  "Then what?" he pressed, frustration edging his voice. "Duty? Some abstract ideal carved in stone? Sentiment for a rulebook? Those sacks are *real*. The cold is *real*. Death is *real*."

  "It's about the agreement," Kaela said quietly. Her gaze wasn't on Aris, nor on the sacks, but somewhere distant, beyond the timber walls and the howling wind.

  "What agreement? There *is* no agreement! You've never met the keeper at Station Six. You barely knew the one at Eight before they rotated out. You don't know if *they* stick to the rule in a lean year. For all you know, they're feasting while you wrestle with ghosts!"

  "They are me," Kaela stated, the words landing with a strange, quiet certainty.

  Aris blinked. "What?"

  "The keeper at Six. At Eight. At every station along the pass." Kaela paced slowly, her boots scuffing on the packed earth floor. "We were all forged in the same crucible. The Citadel didn't just teach us *a* rule. It shaped us into *the keeper*. We learned the same calculations, the same stories of the road's fragility, the same understanding that the chain is only as strong as its most isolated link. We are... the same hand." She gestured towards the manual. "The rule isn't an order from outside. It's the policy the keeper – the *one* keeper spread across these stations – chose, long ago, before any of us knew which post we'd draw, which winters would be kind, which would be cruel."

  Aris snorted. "That's philosopher's fog, Kaela. Pretty words. Station Six is a different person, in a different place, making their own choices based on *their* sacks, *their* blizzards. Just like you are here."

  "Are they?" Kaela stopped, facing him. Her eyes held a fierce, almost unsettling clarity. "If I break the rule here, now, because *my* situation is hard... what am I saying about the rule? What am I saying about the keeper?"

  "That the rule is flawed? That circumstances matter?"

  "No." Kaela shook her head. "I'm saying that the keeper – the essential keeper – only exists when times are easy. That the policy we all adopted when we didn't know our fate... is disposable the moment that fate becomes inconvenient. That the 'keeper' at Station Six, if their winter is even harder than mine, *should* also break it. Why shouldn't they?" Her voice dropped to a near whisper, yet it cut through the storm's roar. "And if we all break it when it costs us... what then? The chain snaps. The traveller dies between stations. The keeper starves alone." She placed a hand flat on the grain sack beside her. "This isn't just *my* grain. It's the road's grain. *My* hand feeds Station Six, because *their* hand feeds Station Eight, because Station Nine's hand feeds Station Ten... all the way back to me. We are bound, not by wire or word, but by *being* the keeper who chose the policy."

  "The policy chosen by someone who didn't know it would cost *you* this much!" Aris insisted, standing now, driven by the immediacy of his hunger and cold. "That past self, that 'essential keeper' – they were ignorant! Why are you bound by their ignorance? *You* know the cost now. *You* bear it. It's madness to cling to a plan made in the dark when you stand in the light!"

  "It's the only way the policy means anything!" Kaela's voice rose, sharp with a conviction that startled even her. "The moment we let the light – *our* individual light, *our* present suffering – revise the policy... it dissolves. It becomes just... mood. Whim. Convenience. What binds Station Six? Only their own calculation of *their* cost? Then we are not keepers of a road; we are hermits guarding private hoards, connected by nothing but geography and a shared delusion of unity." She took a deep, shuddering breath. "The agreement isn't between *Kaela* and *the keeper at Six*. The agreement *is* the keeper. The keeper is the policy. If I abandon it *because* I am Kaela at Seven in a hard year, then I shatter the keeper. I become something else. And so do they, everywhere."

  Aris stared at her, a mixture of disbelief and a dawning, horrified understanding. "So... you're saying that by sharing with me, starving slowly... you're somehow *making* the keeper at Six share? Or... or ensuring they *would*?"

  Kaela looked exhausted. "I'm saying that what I do *here* defines what the keeper *is*. If I break the rule, I declare that the keeper *breaks the rule when the cost is high*. And if that is what the keeper *is*, then the keeper at Six, facing their own hard choice... they break it too. Not because they know *I* did, but because they *are* that same keeper. Our choices aren't separate, Aris. They are the same choice, made in different places, by the same... principle." She gestured helplessly. "The Citadel masters... they talked of it, sometimes. In the advanced ethics lectures. A dusty old concept, half-remembered... something about decisions made 'unrevised'? Before the specifics? It sounded like nonsense then. Cold logic. Now..." She looked at the dwindling fire. "Now it feels like the only thread holding the road together."

  Silence descended, thicker than the cold. The wind seemed to pause, holding its breath. Aris sank back into his chair, the fight draining out of him, replaced by a profound, weary sadness. He saw the gauntness of her face, the bleak resolution in her eyes. He saw the grain sacks, the pathetic pile that represented mutual ruin. He saw the mad, circular, inescapable logic of her position – a logic that demanded sacrifice not for reward, not for fear, but for the coherence of an identity stretched impossibly thin across a frozen wilderness. A logic that offered no vindication, only the cold comfort of consistency.

  "What do we do, then?" he asked, his voice hollow.

  Kaela walked to the grain sacks. She didn't hesitate, driven by a terrible momentum. She took the largest measure scoop from its hook. The sound of grain cascading into the scoop was loud in the silence. She filled it precisely, the level grain scraping the rim. She poured it into a smaller sack meant for travel rations. She repeated the motion. And again. Measured shares, as the manual dictated. As the keeper did.

  "We share," she said, her voice devoid of triumph, only a flat acceptance. "We share because we are the keeper. And the keeper shares." She placed the filled ration sack on the table near Aris. "This is yours. For the journey, when the storm breaks."

  She then took another scoop, slightly smaller – the keeper's own portion, adjusted for the shared burden. She poured it into the cooking pot suspended over the low fire. Adding water, the meagre portion seemed to vanish. She stirred, her movements mechanical.

  Aris watched the thin gruel begin to bubble. The scent was pitifully faint. He looked from the meagre pot to the ration sack meant for him, then back to Kaela’s profile, etched with exhaustion against the firelight. He saw no saintly resignation, only the stark reality of a choice made. A policy adhered to, unrevised by the brutal light of Station Seven’s specific, desperate winter. The wind resumed its howl, a mournful counterpoint to the quiet bubbling of the pot.

  The warmth of the fire barely reached Kaela’s bones. She kept stirring, her gaze fixed on the thin swirls of grain in the water. Aris was right about the cost. They would be hungry long before the thaw. Starvation wasn’t a vague threat; it was the arithmetic of the sacks. Her own argument echoed back, stark and unforgiving: by sharing, was she ensuring the keeper at Six would also choose ruinous sharing? Or was she simply binding herself to a principle that might, elsewhere and silently, already be broken?

  She thought of the keeper at Six. Had they faced a good harvest? Or were they, too, staring at dwindling stores, listening to a similar storm? Had the keeper at Six, faced with their own Aris, their own gnawing hunger, found the same terrible logic? Or had they, perhaps, looked at their sacks, their own survival, and quietly decided the keeper – that abstract, distributed entity – was a luxury the present moment couldn’t afford? Had they reasoned that *their* situation was unique, *their* cost too high, and broken the chain right then, miles away?

  Kaela would never know. The snow would bury that truth too. All she had was the choice here, the grain in the pot, the rule in the manual, and the chilling conviction that what she did defined not just her own fate, but the very nature of the keeper stretched across the pass. Was she sustaining the principle that held the road together? Or was she merely a woman in an isolated hut, slowly starving herself and a stranger for the sake of an elegant, self-consuming trap of her own reasoning?

  The gruel bubbled, a weak protest against the cold. Kaela ladled a portion into a bowl for Aris, then one for herself. She sat across from him at the worn table. The steam rising from the bowls was thin, insubstantial. They ate in silence, the taste of grain-water thin on the tongue, the warmth fleeting. Outside, the blizzard screamed on, indifferent. Kaela met Aris’s eyes across the table. There was no accusation left in them, only a shared, hollowed-out understanding of the cost. The question hung unspoken in the frigid air, clinging like frost to the timber walls: Was this wisdom holding fast against the storm? Or the first, slow, irrevocable step into a self-made grave? The keeper stirred her thin gruel, her face a mask in the flickering gloom, offering no answer the blizzard would carry away.
