  Okay, the user is an emergency physician with ethics committee experience. They've noticed a pattern in how outcomes are described passively ("did not receive care") versus actively ("moved that person out"), leading to different moral judgments despite identical causal facts. They want a philosophical concept that captures this descriptive shift's ethical impact.

  Hmm, they're clearly deeply familiar with medical ethics frameworks but feel existing concepts like doing/allowing distinction don't fully explain this phenomenon. Their frustration with "agentless language" masking moral responsibility suggests they need tools to challenge systemic inaction. 

  First, I should map relevant philosophical territories:
  - Doing/allowing distinction (Bennett, Foot) - but they already know this
  - Omission/commission dichotomy - similar limitations
  - Institutional agency literature (List & Pettit) for systemic cases
  - Linguistic framing effects (Hare, Austin)
  - Moral disengagement mechanisms (Bandura)

  The physician's sepsis example is key: identical bed scarcity, but "not admitting" vs "discharging another patient" triggers different moral intuitions. The scheduling system case shows how distributed responsibility through systems creates "no one to blame" scenarios. 

  Ah! Frances Kamm's "triple effect" might help - she examines how descriptions shape permissibility judgments. But more crucially, Christopher Kutz's concept of "complicitous accountability" in unstructured harms seems directly relevant when systems cause predictable harm without discrete actions.

  Also important: Judith Jarvis Thomson's "moral difference by description" work, and of course the Milgram experiments showing how bureaucratic language enables harm. The physician isn't just asking for labels - they need operational criteria to show when passive language obscures real agency.

  Biggest challenge will be distinguishing this from simple doing/allowing. The differentiator is the identical causal chain - only the assignment of agency changes through description. That's why Kutz's work on "unstructured collective harms" fits best: it explains how we can be accountable for outcomes we "allow" through systems we sustain.

  Should test boundaries: 
  - When passive description is accurate (e.g., truly unforeseeable complications) 
  - When active verbs misattribute (e.g., "the algorithm killed" might anthropomorphize)
  - How this interacts with justified resource allocation

  The physician's insight is profound - they've identified how language constructs moral agency in healthcare systems. This deserves careful articulation beyond stock ethics concepts. Might even coin "descriptive agency displacement" if no perfect fit exists, but better to ground in established frameworks first.
answer: |-
  Based on your description, you've identified a critical phenomenon at the intersection of institutional agency, moral responsibility, and linguistic framing. Let's systematically unpack it.

  ### Brainstorming Candidate Concepts
  1. **Doing/Allowing Distinction** (Bennett, Foot):  
     - *Core Idea:* Distinguishes actively causing harm ("doing") from failing to prevent it ("allowing").  
     - *Fit Issue:* Fails to explain why **identical causal outcomes** (e.g., Patient A dies due to bed scarcity) shift morally based *only* on whether the scarcity is described as passive ("no bed available") or active ("we moved Patient B").  

  2. **Acts/Omissions Doctrine** (Legal/Ethics):  
     - *Core Idea:* Moral/legal weight favors omissions over acts.  
     - *Fit Issue:* Doesn’t address how **institutional systems** (e.g., scheduling algorithms) blur agency, making omissions appear structurally inevitable rather than chosen.  

  3. **Complicitous Accountability** (Kutz):  
     - *Core Idea:* Responsibility for participating in structures that cause harm, even without direct causation.  
     - *Fit Issue:* Captures systemic harm but not the **linguistic mechanism** that reclassifies outcomes as "agentless."  

  4. **Descriptive Framing Effects** (Hare, Austin):  
     - *Core Idea:* Language choices alter moral perception (e.g., "collateral damage" vs. "civilian deaths").  
     - *Fit Issue:* Explains the *rhetorical* shift but not why it overrides identical causal structures in institutional settings.  

  5. **Triple Effect Doctrine** (Kamm):  
     - *Core Idea:* Extends double effect by adding how **descriptions** of acts affect permissibility.  
     - *Fit Issue:* Closest fit—directly addresses how re-description alters moral categorization, but focuses on individual agents, not systems.  

  ---

  ### The Best Fit: **Agent-Neutral Redescription**
  I propose synthesizing Kamm’s insights with theories of institutional agency (List & Pettit) to define:  
  **Agent-Neutral Redescription (ANR):** *The practice of framing outcomes caused by institutional systems or resource allocations as structurally inevitable ("nobody did it"), thereby relabeling avoidable harms as passive "allowings" rather than active "doings," despite identical causal responsibility.*  

  #### Why ANR Fits Your Cases:  
  - **Sepsis Example:**  
    - *Passive:* "No ICU bed available" → framed as scarcity (allowing death).  
    - *Active:* "Discharged Patient B to admit Patient A" → framed as an act (harming B).  
    - *ANR Mechanism:* The language obscures that **allocating beds is always an act**—whether by admission triage or discharge. Redescription masks the institutional "doing."  

  - **Scheduling System:**  
    - *Passive:* "Coverage lapsed" → framed as system output (allowing harm).  
    - *Active:* A rule denying care to lapsed patients → clear "doing."  
    - *ANR Mechanism:* Distributed agency (designers, administrators, algorithms) enables redescription as a "neutral" process, evading accountability.  

  #### Boundaries of ANR:  
  **What ANR Captures Beyond Doing/Allowing:**  
  - **Institutional Evasion:** Doing/allowing focuses on individual agency. ANR explains how **systems dissolve agency** through redescription.  
  - **Causal Invariance:** Moral shift occurs *without* changing material facts—only the assignment of agency via language.  
  - **Predictability Leverage:** Harms are as foreseeable as direct acts (unlike classic "allowings" like failing to save a drowning stranger).  

  **Edge Cases Testing ANR:**  
  1. **ANR Without Moral Shift (False Positive):**  
     - *Case:* A hospital loses power in a natural disaster. "No life support available" is agent-neutral but *accurately* passive—nobody could have prevented it.  
     - *Test Result:* ANR applies descriptively, but moral classification *doesn’t* shift to "allowing" because no institutional duty was violated (duty was impossible).  

  2. **Moral Shift Without ANR (False Negative):**  
     - *Case:* A physician intentionally withholds a drug ("I did not administer it") to hasten death.  
     - *Test Result:* Moral shift occurs (doing → allowing), but *not* via ANR—the redescription is individualized, not systemic.  

  3. **ANR With Ambiguous Causation:**  
     - *Case:* An EHR auto-cancels appointments if labs are pending. A patient dies after a missed appointment.  
     - *ANR Judgment:* If designers knew this could delay care, ANR applies ("the system canceled it"). If truly unforeseeable, it escapes ANR.  

  ---

  ### Why Other Concepts Fall Short:  
  - **Doing/Allowing:** Cannot explain why moving Patient B is "doing" but *not* moving Patient A is "allowing" under identical resource constraints.  
  - **Acts/Omissions:** Fails to address how institutions turn omissions into structured inevitabilities.  
  - **Framing Effects:** Describes linguistic manipulation but not its unique function in **dissolving institutional agency**.  

  ### Practical Implications for Ethics Committees:  
  ANR reveals that "agentless" language in reports is often a **moral dodge**. Countermeasures include:  
  1. **Reframe Outcomes:** "The bed allocation protocol resulted in Patient A’s death" (exposes agency).  
  2. **System Intentionality:** Ask: "Did we design/preserve a system *predictably* causing harm?"  
  3. **Predictability Threshold:** If harm was >50% likely (e.g., dropped appointments → disease progression), treat as institutional "doing."  

  You’ve pinpointed how bureaucracy weaponizes grammar to mutate moral categories. ANR gives you a blade to cut through the evasion.
