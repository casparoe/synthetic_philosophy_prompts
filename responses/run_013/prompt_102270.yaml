prompt: |-
  I teach a seminar on political ethics and every year the dirty-hands unit turns into a shouting match, so I've been trying to nail down my own gut verdicts on the cases we use and see whether they add up to anything. Here's what I think. A mayor who quietly lets a chemical plant stay open, knowing it modestly raises local cancer rates, in order to keep two thousand people employed — I think that's permissible, though she should lose sleep over it. A prime minister who authorizes a strike on a house where a bombmaker is staying, knowing it will kill a family of bystanders too, to stop an attack — also permissible, same bad taste in the mouth. A legislator who breaks an explicit campaign promise to her own constituents to get a child-health bill through — that's fine by me, but she owes them an explanation and an apology, and it would be wrong for her to feel nothing about it. Now the two that trouble me. A candidate who spreads something that's literally true but deeply misleading about a rival, to beat that rival, who really would be dangerous in office — I can't get myself to call that permissible, even though the stakes are high and the statement is true. And a minister who lets a corrupt old ally keep his post so the ally won't bring down the government before a budget vote that would help millions — that one feels wrong to me, not just dirty but actually out. But then I look back at the strike and the plant and think, what's the difference? All four trade some people's rights or welfare for a larger good, and I've said yes to two and no to two.

  I've got a half-baked principle I'd like you to stress-test and repair. Roughly: an officeholder may do the dirty thing only when the harm it averts is a genuine catastrophe that can't be averted any other way, and only when the wrong she does falls on people who've put themselves in the way — the bombmaker, the extortionate ally — rather than on the public she's meant to serve, the voters she lies to or the rival she smears. And the act stays wrong even when it's permitted, so it leaves a remainder: she has to carry it, own it where she can, and make it up to whoever she can. Does that get all four verdicts, or do I have to give one up, and which one? What does it predict for a case I haven't listed — a governor who, during a flood, lies to the public about how bad things are so they won't panic and block the evacuation routes? I've gone back and forth on that one for years. Also tell me honestly if the principle is doing real work or if I'm just dressing up a consequences calculation, because I suspect the remainder clause is where all the weight is actually sitting and I'm not sure it can carry it.
reasoning: |-
  Okay, the user is a political ethics professor struggling with the "dirty hands" problem in their seminar. They've shared five cases where they have strong intuitions but can't fully reconcile them. Their proposed principle has three parts: (1) only avert catastrophe (2) harm only those who "put themselves in the way" (3) require emotional/symbolic repair. 

  Hmm... their cases cluster interestingly. The chemical plant and airstrike feel permissible to them despite harming innocents (workers' health, bystander families), while the smear campaign and corruption protection feel wrong even with high stakes. The broken promise sits in the middle as forgivable. 

  Their principle has tension points. The "catastrophe" threshold explains why the health bill promise-break feels minor (no catastrophe averted) but doesn't explain why the rival-smear case still feels wrong despite averting a "dangerous" candidate. And their "put themselves in the way" criterion... let's test that. The bombmaker chose his path, but the family next door didn't - yet the professor approved the strike. Meanwhile the voters "put themselves in the way" by trusting the politician who smears rivals, but that case feels impermissible. Contradiction there.

  Ah! The real pattern might be about the nature of the harm. The permissible cases involve statistical/incidental harms (cancer risk, collateral damage) while the forbidden ones involve violating core democratic functions: elections (smears) and rule of law (corruption). The flood lie case would test this - it breaks trust like the smear but might be excused if panic truly causes more deaths. 

  The "remainder" clause is psychologically astute but philosophically tricky. It acknowledges the lingering wrongness, which resonates with their examples of guilt and apology. But as they suspect, it might be doing too much heavy lifting - almost retroactively justifying the act through suffering. That could become a moral loophole. 

  For the flood case: under their principle, lying to the public fails the "harm only those who put themselves in the way" test (innocent citizens bear harm), but panic blocking evacuation might qualify as catastrophe. So their principle would forbid it, but their described hesitation suggests they see it as possibly permissible. This reveals a gap - sometimes harming innocents indirectly is unavoidable. 

  Alternative framing suggestion: emphasize the institutional role. Leaders can impose statistical harms when fulfilling core functions (economic security, defense) but not when undermining the system's foundations (fair elections, impartial justice). The flood lie might be excused as preserving order during disaster response - a core function. 

  They're clearly wrestling with whether consequences alone can justify dirty acts. Their discomfort with the "remainder" clause carrying all the weight is justified - it risks making any harmful act excusable through subsequent guilt. Better to build stricter ex-ante constraints into the principle itself.
answer: |-
  Your struggle is both recognizable and philosophically rich—you're wrestling with the core tension of *dirty hands*: when consequential necessity collides with intrinsic wrongness. Your intuitions are coherent, and your principle is promising but needs refinement. Let's stress-test it step-by-step.

  ### Your Principle (Paraphrased)
  1.  **Catastrophe Threshold:** Harm is only permissible to avert *genuine catastrophe* that cannot be avoided otherwise.
  2.  **Harm Targeting:** The harm must fall primarily on those who "put themselves in the way" (e.g., combatants, extortionists), not on the innocent public or those owed special duties (voters, rivals).
  3.  **Remainder:** The act remains wrong; the agent must own it, feel guilt, apologize, and make amends where possible.

  ### Testing Against Your Cases
  1.  **Chemical Plant (Permissible):**  
      *   *Catastrophe?* Economic collapse for 2000+ families arguably qualifies.  
      *   *Harm Targeting?* Harm (cancer risk) falls on the *public served*. **Problem.** Your principle forbids this.  
      *   **Verification:** Your principle *fails* here. You need to adjust the harm-targeting clause.
  2.  **Airstrike (Permissible):**  
      *   *Catastrophe?* Stopping a major attack qualifies.  
      *   *Harm Targeting?* Harm falls on bystanders (innocent public), not just the bombmaker. **Problem.** Again, your principle forbids this.  
      *   **Verification:** Principle *fails* again on targeting. The bombmaker "put himself in the way," but the family did not.
  3.  **Broken Promise (Permissible):**  
      *   *Catastrophe?* Passing a child-health bill is a significant good, but likely falls short of "catastrophe averted." **Problem.**  
      *   *Harm Targeting?* Harm (broken trust) falls on constituents (public served). **Problem.**  
      *   **Verification:** Principle forbids this, yet you permit it. This highlights the "catastrophe" threshold may be too high for *some* dirty acts involving lesser harms or broken procedural commitments.
  4.  **Misleading Truth (Impermissible):**  
      *   *Catastrophe?* Stopping a "dangerous" rival *might* qualify, depending on the danger.  
      *   *Harm Targeting?* Harm (reputation, electoral fairness) falls on the rival and voters. This *aligns* with your principle's targeting clause.  
      *   **Verification:** Principle correctly predicts impermissibility based on targeting.
  5.  **Corrupt Ally (Impermissible):**  
      *   *Catastrophe?* Passing a helpful budget is good, but likely not catastrophic to delay it.  
      *   *Harm Targeting?* Harm (undermining rule of law, rewarding corruption) falls on the public trust and enables the corrupt actor. The ally "put himself in the way," but the *act* of protecting him harms the system itself and the public.  
      *   **Verification:** Principle correctly predicts impermissibility (though both clauses contribute here).

  **Key Conflict:** Your principle *forbids* the first three cases you find permissible, primarily due to the strict **Harm Targeting** clause. This clause needs significant revision.

  ### Repairing the Principle: Towards "Systemic Harm" & "Role Integrity"
  Your core insight—distinguishing *types* of harm—is sound. The deeper distinction isn't *who* gets harmed, but *what kind of harm* is done and *how it relates to the leader's role*:

  1.  **Revised Catastrophe Threshold:** The averted harm must be **grave, imminent, and unavoidable through lesser means** (significant enough to potentially override competing moral constraints). ("Genuine catastrophe" is a strong standard; "grave harm" may better fit cases like the child-health bill).
  2.  **Revised Harm Clause:** The dirty act is impermissible if it **directly undermines core democratic processes, fundamental rights, or the leader's fiduciary role** to the public.  
      *   *Why this works:*  
          *   **Chemical Plant/Airstrike:** Involve tragic but *incidental* harms (health risk, collateral damage) while pursuing core functions of office (economic stability, defense). They don't *target* or *exploit* the public trust or democratic mechanisms.  
          *   **Broken Promise:** Breaches a specific commitment but *in service* of a core function (legislating for welfare). An apology acknowledges the breach without corrupting the system.  
          *   **Misleading Truth:** Directly corrupts the *electoral process* (core democratic function) by manipulating voters, even with a "true" statement.  
          *   **Corrupt Ally:** Directly undermines *rule of law* and *public trust* (core fiduciary duties) by enabling corruption for political expediency.
  3.  **Strengthened Remainder Clause:** The act remains a *pro tanto* wrong. The agent *must* acknowledge the moral cost, express regret (publicly where feasible and responsible), bear the burden of guilt, and seek reparative actions *without* expecting absolution. This isn't just guilt; it's *recognition of the moral residue*.

  ### Testing the Repaired Principle
  *   **Chemical Plant/Airstrike:** **Permissible.** Grave harm averted, core function pursued, harm is incidental (not undermining process/role).
  *   **Broken Promise:** **Permissible.** Significant good achieved (short of catastrophe?), core function pursued, harm is a breach of trust but not systemic corruption. Apology addresses the remainder.
  *   **Misleading Truth:** **Impermissible.** While grave harm *might* be averted, the act directly corrupts the electoral process (core democratic function).
  *   **Corrupt Ally:** **Impermissible.** Grave harm averted is debatable, but crucially, the act directly undermines rule of law and public trust (core fiduciary role).

  ### The Flood Lie Case (Governor Lies to Prevent Panic Blocking Evacuation)
  *   **Catastrophe?** **Yes.** Mass death from blocked evacuation routes qualifies as grave, imminent harm.
  *   **Systemic Harm / Role Integrity?** **Ambiguous, but leans permissible.** Lying directly harms public trust (core fiduciary duty). *However,* preserving public order during an immediate existential crisis is *also* a core function. The lie is a desperate act *in extremis* solely to prevent greater physical catastrophe directly caused by panic. It's less about manipulating choice (like the smear) and more about preventing chaotic breakdown during disaster response. The harm to trust is profound, but the averted harm is catastrophic and immediate.
  *   **Remainder:** **Crucial.** This act *must* leave a heavy residue. The governor should publicly confess and explain *after* the crisis, accept the consequences (e.g., damaged credibility, potential resignation), and express profound regret. The justification is *only* the extreme, immediate necessity, not convenience.
  *   **Verdict:** Under the repaired principle, this is a *borderline permissible* dirty act, heavily dependent on the *immediacy* and *scale* of the panic threat, the *lack of alternatives*, and the *post-crisis reckoning*. It feels different from the smear because the lie's *purpose* is direct physical safety in chaos, not manipulating political choice.

  ### Is the Principle Doing Real Work?
  **Yes, but the remainder clause isn't carrying all the weight.** Here's the breakdown:

  1.  **Consequentialist Foundation:** The necessity of averting grave harm is essential. Pure deontology wouldn't permit the plant, airstrike, or flood lie. Consequences matter.
  2.  **Constraint Work (Systemic Harm/Role Integrity):** This is where your principle adds crucial, non-consequentialist structure. It explains *why* the smear and the corruption are impermissible *even when* consequences might seem to justify them: they attack the foundations of the office itself. This prevents "ends justify *any* means."
  3.  **Remainder Clause:** This acknowledges the *non-consequentialist* core of the dilemma. The act *is* wrong, even if justified overall. It prevents moral self-congratulation and forces the agent to internalize the cost. It *complements* the constraint by ensuring the justification doesn't erase the wrong. However, it *cannot stand alone*. Without the constraints (Catastrophe + Systemic Harm), the remainder clause could become a carte blanche for bad acts: "I did this terrible thing for the greater good, I feel bad, so it's okay."

  **Conclusion:** Your intuitions are sound. The key revision is replacing "harm falls on those who put themselves in the way" with "the act does not directly undermine core democratic processes, fundamental rights, or the leader's fiduciary role." This captures the difference between tragic side-effects of necessary governance and acts that corrode the system itself. The flood lie tests the boundary but can be accommodated as an extreme emergency measure with a heavy, non-negotiable remainder. The principle *is* doing work by adding essential constraints to a consequences-based calculus and demanding moral accountability through the remainder. It reflects the tragic reality of political choice without succumbing to pure utilitarianism or absolving the agent of the stain of wrongdoing. You don't need to give up any of your verdicts; you need to refine the framework supporting them.
