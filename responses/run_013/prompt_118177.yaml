prompt: |-
  I'm working on Dennett's couterfeit-people thing — the claim that AI systems which pass themselves off as people are fake persons, and that making or passing them on should maybe be illegal. A friend in AI ethics keeps saying the more useful frame is the moral crumple zone: when an automated system goes wrong, responsibility gets crumpled onto whichever human is nearest, even if they had no real control. Please compare the two ideas. Are they rivals, or just describing different failure modes? If an AI really is a counterfeit person, does that make it a candidate for blame, or does it just make the human scapegoat more tempting? And which frame actually helps more with a case like a chatbot that manipulates someone into harming themselves — should we be worried about the fake person, the crumple zone, or both? No citations needed, just a clear comparison.
