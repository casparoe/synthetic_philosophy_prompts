answer: |-
  Here’s a complete exam package focusing on the interpretive crux of the White Horse Dialogue, designed to push students beyond surface summaries:

  **Exam Question (Option 3):**  
  "Gongsun Long’s 'seeking a horse' (求馬) argument is frequently dismissed as committing the very equivocation fallacy critics attribute to *báimǎ fēi mǎ*. Defend or refute this dismissal. In your view, does this argument undermine his thesis by exposing a logical flaw, or does it crucially *clarify* his core claim about the relationship between names and objects? Ground your answer in the structure of the *White Horse Dialogue* and the *Jianbailun*'s separation of attributes."

  **Model Answer (498 words):**  

  Gongsun Long’s "seeking a horse" argument is not the fatal flaw but the hermeneutic key to *báimǎ fēi mǎ*, rescuing it from crude equivocation charges by grounding it in a coherent theory of naming (*míng*). Critics conflate *fēi* (非) with empirical exclusion (claiming white horses aren’t *horses*), but the "seeking" scenario reveals *fēi* operates at the level of *referential adequacy*: "horse" fails to fulfill a request for a "white horse" because names denote distinct conceptual categories, not ontological realities.

  The dialogue’s opening establishes names as functional designators: "horse" names shape (形), "white" names color (色). To claim "white horse is not horse" asserts that the compound name "white horse" cannot be reduced to either component without loss of specificity. The "seeking" argument tests this linguistically. Requesting "a horse" permits substitution with any horse-shaped object (黃黑馬皆可致); requesting "a white horse" does not (黃黑馬不可致). This demonstrates "white horse" and "horse" occupy different *functional categories*: one term satisfies requests requiring only shape, the other requires shape *and* color. The error lies in demanding that functional difference reflect physical exclusion rather than categorical distinction.

  The *Jianbailun*'s treatment of hardness and whiteness in a stone supports this reading. That hardness is known by touch and whiteness by sight shows attributes are *epistemically separable* even when materially co-present. Analogously, "horse" and "white" are *semantically separable*: "horse" abstracts shape, ignoring color, while "white horse" compounds attributes. To insist a white horse "is" a horse commits the fallacy of *conflation* – mistaking the object for the category signified by its simple name. When we say "white horse is not horse," *fēi* marks the categorical insufficiency of "horse" to capture "white horse," not a denial of biological class membership.

  Thus, the "seeking" argument clarifies that Gongsun Long’s thesis is fundamentally *metalinguistic*. It exposes critics’ equivocation: they interpret *fēi* as denying material inclusion when it actually denies *nominal equivalence*. The argument doesn’t commit equivocation; it *diagnoses* it in everyday language use by showing how "horse" cannot fulfill the role of "white horse" in discursive contexts. This rescues the thesis by shifting focus from "things" to "words" and their functional precision, aligning with the School of Names’ project of rectifying names (*zhengming*). The seeming paradox arises from applying categorical logic to empirical objects – a deliberate provocation to examine naming itself.

  **Marking Scheme (20 points):**  

  **Top-Score Moves (17-20 pts):**  
  - (4 pts) **Explicitly identifies the "seeking" argument as demonstrating *referential/categorical insufficiency* (not physical exclusion)**  
  - (4 pts) **Contrasts *fēi* as "categorical non-equivalence" vs. "ontological denial" using the request scenario**  
  - (3 pts) **Integrates *Jianbailun*'s attribute separation to support semantic separability of names**  
  - (3 pts) **Argues the "seeking" argument *exposes* equivocation in critics' reading, rather than committing it**  
  - (3 pts) **Concludes the thesis is metalinguistic (about words/categories), not metaphysical (about things)**  
  - (3 pts) Coherent structure, precise terminology (名, 形, 色), textual grounding  

  **Common Near-Miss Errors (point deductions):**  
  - **-3-4 pts** Treating *fēi* solely as "not a member of the class" without addressing categorical function.  
  - **-3 pts** Summarizing the dialogue without interpretive commitment (e.g., "Gongsun says white horse isn’t horse because...").  
  - **-2 pts** Misapplying *Jianbailun* (e.g., citing it for physical separability, not epistemic/semantic).  
  - **-2 pts** Calling the argument "equivocation" without analyzing *how* the "seeking" scenario redefines *fēi*.  
  - **-1-2 pts** Vague use of "language" without specifying *referential adequacy* or *categorical precision*.  

  **Rationale:**  
  This question forces engagement with the professor's "words vs. things" crux by centering the "seeking" argument—which students often misread as plain evidence of difference. The model answer reframes it as Gongsun Long’s *pedagogical device* to reveal nominal categories, demanding students defend an interpretation against the strongest objection (equivocation). The *Jianbailun* link ensures they grasp attribute separability as foundational. The marking scheme rewards precise distinctions between reference, ontology, and category while penalizing summary and conflation.

  Total package: 798 words.
