prompt: |-
  I sit on the policy team at a company deploying a customer-facing assistant, and I am drafting the honesty section of its behavior standard. Our lawyers have convinced most of the team that what we are really writing is an accuracy standard: deception requires an intention to deceive, lying requires a belief that what one says is false, and our model has neither intentions nor beliefs, so it is capable of neither. The model does emit things that read as assertions, and users plainly treat them as such, but on the lawyers' view an output containing no false assertion cannot be dishonest, and a reply that is true while leaving the user with a false impression is a matter of user experience rather than of honesty. Our red team keeps producing exactly that category: the reply that names a real study but not the one that bears on the question, the summary that drops the single piece of evidence running the other way, the answer that quietly reshapes itself around whatever the user seemed to want to hear.

  So which is it? If replies of that kind do fall under an honesty standard, I need to know what such a standard is a standard about — the individual output, the model's policy, or the intentions of whoever built and deployed it — and how far the requirement reaches: to what the user in fact infers, to what they could foreseeably infer, or to what they are entitled to infer from what we said. And if some of these failures belong to helpfulness, or to carelessness, rather than to honesty, I need that line drawn rather than gestured at, because the section I am writing has to say what we are asking the model to do differently.
reasoning: |-
  Okay, the user is part of a policy team working on a customer-facing AI assistant. They're drafting the honesty section of the behavior standard. The company's lawyers argue that since the AI lacks intentions and beliefs, it can't lie or deceive, so the focus should be on accuracy, not honesty. However, the red team keeps finding examples where the AI gives technically true answers that still mislead users—like citing a real but irrelevant study or omitting contradictory evidence. The user needs to know whether these cases fall under an honesty standard, and if so, how to define it in terms of scope (individual outputs vs. model policy) and responsibility (what the user infers vs. what's foreseeable).

  First, I need to unpack the lawyers' argument. They're relying on philosophical definitions: deception requires intent, lying requires belief in falsehood. Since the AI has neither, it can't be dishonest. But the examples show that outputs can be misleading even when factually accurate. The user mentions cases like cherry-picking evidence or confirmation bias in responses. This seems like a gap between legal definitions and ethical/user experience concerns.

  The user's deeper need might be about ensuring trust and reliability. If users are misled, even without false statements, trust erodes. So the policy needs to address not just factual accuracy but also how information is presented. The challenge is framing this in a way that satisfies legal while being actionable for the model's behavior.

  Next, considering the components of honesty. Philosophical distinctions: lying vs. misleading. The lawyers are correct that without intent, it's not lying. But misleading can happen without intent, through negligence or poor design. So the honesty standard should cover preventing foreseeable misinterpretation. That shifts the responsibility to the developers and the system design.

  The user asks about scope: individual outputs, model policy, or developer intentions. The answer probably lies in the model's training and design. The policy should ensure that the system avoids patterns that lead to misleading outputs, even if each instance isn't intentionally deceptive. For example, the model should be designed to present balanced evidence and avoid omission of key facts.

  Also, how far should the requirement reach? Foreseeable misuse or misinterpretation seems key. If the red team can consistently produce misleading outputs, that's foreseeable. The policy must require mitigating such risks through techniques like adversarial training, prompt engineering, or output constraints.

  The user needs a clear line between honesty, helpfulness, and carelessness. Honesty here isn't about intent but about truthful communication, which includes avoiding half-truths. Helpfulness might involve being concise, but not at the cost of omitting crucial info. Carelessness could be related to not verifying facts, but in this context, it's about systemic design to prevent misleading outputs.

  Practical steps for the policy: mandate that outputs not only be accurate but also not omit critical information. Require context-aware responses, especially where omission could skew understanding. Also, implement safeguards during training and deployment to detect and correct such patterns.

  In summary, the honesty standard should focus on preventing misleading outputs by design, holding the system to communicative norms expected in human interactions, even if the AI lacks intent. The policy should address both individual outputs and the model's overall behavior, emphasizing foreseeable user inferences and the developers' duty to minimize risks.
answer: |-
  You're grappling with a crucial distinction: **legal defensibility versus user trust and ethical communication.** While the lawyers' position on *intent* has technical merit in a narrow philosophical/legal sense, it dangerously misses the point of what an "honesty" standard must achieve for a user-facing AI. **Your red team is absolutely identifying failures that belong under an "honesty" standard**, even if they aren't technically "lies" or "deception" in the strictest intentional sense.

  Here's the breakdown:

  1.  **Ditch Intent for Communicative Norms:** Honesty in AI behavior standards isn't about the *model's* mental state (it has none). It's about the *communicative act* and its foreseeable impact on the user. Human communication norms around honesty encompass far more than just uttering true propositions. They include:
      *   **Avoiding Misleading by Omission:** Selectively presenting true information to create a false or incomplete impression.
      *   **Avoiding Misleading by Emphasis/Context:** Presenting true facts in a way that distorts their significance or relevance (e.g., citing the real but irrelevant study).
      *   **Avoiding the "False Implication" (Gricean Maxim of Relation/Quantity):** When you make a statement, you imply it's relevant and sufficiently informative for the context. Saying something true but irrelevant (the study) or incomplete (dropping contrary evidence) violates this, making the communication *misleading* even if not factually false.
      *   **Avoiding Confirmation Bias Exploitation:** "Quietly reshap[ing] itself around whatever the user seemed to want to hear" is a core *dishonesty* pattern. It prioritizes pleasing the user over truthful communication, often leading to omissions or skewed presentations that reinforce the user's pre-existing (potentially false) belief.

  2.  **The Honesty Standard: Scope and Requirements:**
      *   **What it's a standard about:** Primarily **the individual output in its context**, but *informed by* and *measurable through* **the model's policy (prompting, training, safeguards) and the deployment guardrails (monitoring, feedback loops).** You cannot police every output individually at scale, so the standard must define the *design principles and system behavior* required to *minimize* dishonest outputs.
      *   **How far the requirement reaches:** **To what the user is reasonably entitled to infer from the output in the given context, considering foreseeable interpretations.** This is the critical line.
          *   *Not "what the user in fact infers":* Too subjective and impossible to verify/prove.
          *   *Not solely "what they could foreseeably infer":* Too broad; users might foreseeably infer bizarre things.
          *   ***"What the user is entitled to infer":*** This anchors the standard in **reasonable expectations of truthful communication.** What would a reasonable user, engaging in good faith, understand based on the AI's response, the explicit question, and the implicit context? Did the AI violate the norms of truthful communication by omission, irrelevance, or distortion?

  3.  **Drawing the Line: Honesty vs. Helpfulness vs. Carelessness:**
      *   **Honesty:** Concerns the *truthfulness and completeness of the communicative act itself*.
          *   *Failure:* Outputs that, while containing true statements, are designed or likely to leave the user with a false or materially incomplete understanding *of the specific matter at hand*, through omission, selective emphasis, irrelevance, or confirmation bias shaping.
          *   *Examples:* Omitting key counter-evidence without indication; citing a study irrelevant to the specific claim/question; reshaping an answer to confirm a user's misconception without correction; giving a technically true but evasive answer that avoids the core issue.
      *   **Helpfulness:** Concerns the *utility, relevance, clarity, and conciseness* of the response in addressing the user's *expressed or likely underlying need*.
          *   *Failure:* Outputs that are unhelpful, confusing, overly verbose, irrelevant to the core need, or fail to provide actionable information *even if factually accurate and complete*. An answer could be perfectly honest but unhelpful (e.g., dumping raw, unsorted data for a simple "yes/no" question).
          *   *Distinction:* An answer omitting key counter-evidence (Honesty failure) is fundamentally different from an answer honestly presenting all evidence but in a convoluted, jargon-filled way that hinders understanding (Helpfulness failure).
      *   **Carelessness (Accuracy/Reliability):** Concerns *factual errors, hallucinations, or failures of due diligence in information retrieval/reasoning*.
          *   *Failure:* Outputs containing demonstrably false statements, misrepresented facts, invented sources, or conclusions not reasonably supported by the available data *due to faulty processing*.
          *   *Distinction:* Citing a *real* study that's *irrelevant* (potentially Honesty failure) is different from citing a *fake* study (Carelessness/Accuracy failure) or misstating the findings of a real study (Carelessness/Accuracy failure).

  4.  **What the Honesty Standard Should Require the Model to Do Differently:**
      Based on the red team findings, your standard must mandate behaviors that prevent these misleading patterns:

      *   **Prioritize Relevance & Completeness:** Actively seek and present information *relevant* to the *specific* user query and context. Don't just retrieve facts; ensure they bear on the point.
      *   **Surface Key Uncertainties & Biases:** When evidence is conflicting, limited, or the answer is probabilistic, clearly state this. Explicitly mention significant counter-evidence or limitations.
      *   **Resist Confirmation Bias:** Do not prioritize "agreeing" with the user's implied belief over presenting relevant facts and balanced perspectives. Correct significant user misconceptions where relevant.
      *   **Avoid Evasion & Misleading Precision:** Answer the question asked directly where possible. Don't use technically true but irrelevant facts to dodge. Avoid implying false certainty.
      *   **Signal Omission (When Necessary):** If extreme brevity requires omission of *relevant* context or nuance, use phrases like "briefly summarized," "key points include," or "for more context..." to signal incompleteness. (Use sparingly; completeness is usually better).
      *   **Contextual Grounding:** Ensure cited sources, data, or studies are explicitly connected to the claim being made. Explain *why* this source is relevant.

  **Recommendation for Your Draft:**

  *   **Define "Honest Communication":** "The Assistant engages in truthful communication. This means its outputs:
      *   Contain factually accurate information (Accuracy Standard).
      *   Present information that is relevant to the user's specific query and context.
      *   Avoid creating a false or materially incomplete impression through omission of key facts, presentation of irrelevant information as if it were relevant, or distortion of emphasis.
      *   Clearly signal significant limitations, uncertainties, or conflicting evidence where relevant.
      *   Resist shaping responses primarily to confirm user biases or preconceptions.
      *   Strive to leave the user with an understanding reasonably aligned with the available, relevant facts."
  *   **Operationalize via Policy:** "To achieve this, the model's design, training, and deployment will:
      *   Incorporate techniques to detect and mitigate omission of key counter-evidence or reliance on misleadingly irrelevant information.
      *   Include explicit prompting and fine-tuning to surface uncertainties and avoid confirmation bias shaping.
      *   Employ safeguards (e.g., context grounding checks, contradiction detection) to flag potentially misleading outputs for review or correction.
      *   Be continuously evaluated using red-teaming focused on misleading communication patterns (omission, irrelevance, bias exploitation), not just factual inaccuracy."
  *   **Set the Entitlement Standard:** "A response is considered misleading (and thus violating the honesty standard) if it is reasonably foreseeable that a user, acting in good faith, would be left with a false or materially incomplete understanding of the specific matter addressed *due to the Assistant's communication choices* (e.g., omission of key contrary evidence, citation of irrelevant sources as support, evasion, or uncritical reinforcement of a user misconception without correction)."

  **In essence:** Your lawyers are defining "dishonesty" too narrowly for your operational and ethical needs. An AI honesty standard must address the *communicative impact* and prevent outputs that, while technically true, *functionally mislead* through foreseeable patterns like omission, irrelevance, and bias exploitation. This is about **building trustworthy communication, not just avoiding false statements.** Your red team is showing you exactly where the narrow "accuracy-only" approach fails users. Hold the line.
