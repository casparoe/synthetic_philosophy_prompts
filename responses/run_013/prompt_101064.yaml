prompt: |-
  Last night I got into a long and increasingly heated argument with a friend — a statistician by training, now working in insurance — about the reference class problem, and I came away realising that I could state the problem but not really explain it. Her position was that it is a pseudo-problem. Once you are a subjectivist about probability, she said, the choice of reference class is simply an expression of your prior; since the only constraint on a prior is coherence, there is nothing further to get right or wrong. If two actuaries pick different classes and reach different numbers for the same singular event, both are entitled to their numbers, and their disagreement is not a disagreement about the facts. My position was that this cannot be the whole story, because when a parole board or an insurer attaches a risk score to one individual, we seem to hold the number to a standard that coherence alone cannot supply — some choices of class really do look better or worse, and not merely by our lights. I suspect the quarrel is ultimately about what we want a probability to be doing in a single case, but I could not locate the precise point at which her defence and my worry come apart.

  Please give me an explanation of the reference class problem that would let me take this argument up again properly — one that goes into the weeds rather than stopping at the textbook slogan that any event belongs to indefinitely many classes. I would especially like you to make clear what exactly the subjectivist's move concedes and what it does not; why the two obvious repairs — always take the narrowest class for which you have data, or always take the class you have the most evidence about — both fail; and what it could even mean for a choice of reference class to be correct when the event in question is singular and will happen only once. Assume I am comfortable with the basics of probability and know what a prior is; you may be technical, and you need not spare my friend's feelings, but you should treat her position as a serious one rather than a straw man.

  Please structure the answer as follows. Open with a section titled "The problem, stated precisely" (roughly 200 words), setting out the issue without presupposing any particular interpretation of probability. Then "Why the narrowest class will not save us" (roughly 250 words), then "Why the best-evidenced class will not save us" (roughly 250 words). Follow these with "What the subjectivist's move really does" (roughly 300 words), which should give my friend's position its strongest form. Then "Where I think the argument actually turns" (roughly 250 words), containing your own verdict on what the disagreement is really about. End with "How I should reopen the argument" (roughly 100 words), phrased as something I could actually say to her the next time we speak.
