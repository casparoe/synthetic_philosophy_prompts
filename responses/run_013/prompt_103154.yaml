prompt: |-
  i'm a software engineer with no formal philosophy background, and i've been asked to write prompts about the unilateralist's curse for a dataset. i sort of get the gist — a bunch of agents can each unilaterally do a thing, so whichever one actually does it is probably the one who most overestimated how good the thing was — but every explanation i find ends with: so you need a single decider, and i want an example that pulls those two claims apart.

  so give me an example of a conceptual issue here. set up a small decision problem with three or four agents who can each unilaterally take an action, each holding a noisy private estimate of the action's value, all using the same threshold for acting. work the numbers so the curse shows up — the action gets taken, and taking it is on average a bad move. then, using that same setup, flip one thing at a time and tell me which flips make the curse disappear and which don't: (a) everyone's estimate is unbiased but noisy, (b) everyone's estimate is systematically too optimistic, (c) the agents' errors are correlated rather than independent, (d) only one agent exists at all, (e) the agents can cheaply talk and share estimates before anyone acts. i definately want the case that surprises me — the one where you'd expect the curse to vanish and it doesn't, or the reverse.

  then tell me what the example shows the curse is actually about: is it a fact about unilateral action, a fact about thresholds and selection, or just the winner's curse with extra steps? because if it's really selection-on-error, then get a single decider looks like it fixes the wrong thing — the single decider also has a noisy estimate, they just have it alone. say plainly where i'm wrong about that, if i am.

  skip citations and reading lists, i can't look anything up anyway — just the worked example and the reasoning.
reasoning: |-
  We are going to set up a decision problem with three agents: Alice, Bob, and Charlie.
  Each agent has a private estimate of the value of an action. The true value of the action is V.
  Each agent i observes a signal s_i = V + e_i, where e_i is their estimation error.

  The agents are identical in their decision rule: they will take the action if their private estimate is above a threshold T.

  The unilateralist's curse: because each agent can act unilaterally, the action will be taken by the first agent whose signal exceeds T. However, if we condition on the action being taken, it is likely that the agent who acted had an overestimate (since the one with the highest positive error is the one who acts first). Therefore, even if the true value V is below T, the action might be taken because of an overestimation.

  We want to set up a scenario where:
  - The true value V is below the threshold T (so the action is actually bad).
  - But because of the noise, the agent with the highest signal (which is likely an overestimate) will act, and so the action is taken.

  We'll assume the errors are independent and normally distributed for the base case.

  Parameters for the base case (where the curse appears):
    True value V = 0 (so we are indifferent if we knew the truth, but we'll set the threshold T>0 so that the action is bad on average but might be taken due to overestimation).
    Threshold T = 1.
    Errors e_i ~ Normal(0, 1) for each agent (so unbiased, independent, and standard normal).

  With three agents, each has a signal s_i ~ Normal(0,1). The action is taken if any agent has s_i > 1.

  But note: we are interested in the event that the action is taken and then we want to see that conditional on being taken, the true value (0) is less than the threshold (1). So the action is bad.

  The probability that a particular agent has s_i > 1 in a standard normal is about 0.1587. Therefore, the probability that at least one agent acts is:
    1 - (1 - 0.1587)^3 ≈ 1 - (0.8413)^3 ≈ 1 - 0.5948 ≈ 0.4052.

  But note: the curse is about the conditional expectation of the true value given that the action is taken. We know the true value is 0, but the agent who acts (the one with the highest signal) will have a signal above 1. However, we are concerned with the true value being below the threshold (which it is, 0<1) and that the action is taken. So the action is taken about 40% of the time even though it's bad.

  But let's also compute the expected true value conditional on the action being taken. Since the true value is fixed at 0, that expectation is 0. So the action is taken when the true value is 0, which is below the threshold. This is bad.

  However, the curse is often presented as: the action is taken by an agent who overestimated the value. So let's look at the agent who acts: she is the one with the maximum signal. The expected maximum of three independent standard normals is about 0.846 (for n=3, the expected value of the maximum of standard normal is approximately 0.846). So the agent who acts has an expected signal of about 0.846, but the true value is 0. Therefore, she overestimated by about 0.846. However, note that she acts because her signal is above 1. So we are conditioning on the signal being above 1. The expected signal of the agent who acts (given that at least one is above 1) will be higher than 0.846 because we are conditioning on being above 1.

  We can compute the expected maximum given that the maximum is above 1. Since the maximum of three standard normals is above 1, the expected maximum is:
    E[max(s1,s2,s3) | max(s1,s2,s3) > 1] 
  This is going to be greater than 1. We can compute it by simulation or by using the formula for the truncated normal order statistics. But note: the point is that the agent who acts has a signal that is on average higher than the true value.

  Now, let's flip the conditions one by one and see when the curse disappears.

  (a) Everyone's estimate is unbiased but noisy: This is our base case and the curse appears.

  (b) Everyone's estimate is systematically too optimistic: 
      Let the bias be b. So now s_i = V + b + e_i, where e_i ~ Normal(0,1). 
      We set V=0, T=1. Then the signal without error is b. If b>0, then the agents are optimistic. 
      Let b=0.5. Then the distribution of s_i is Normal(0.5,1). 
      The probability that one agent has s_i>1 is P(Z>(1-0.5)=0.5) = 0.3085.
      The probability at least one acts: 1 - (1-0.3085)^3 ≈ 1 - (0.6915)^3 ≈ 1 - 0.330 = 0.67.
      The action is taken more often, but the true value is still 0 < 1. So the curse remains: the action is taken and it's bad.

      However, note: if the bias is too high, say b=2, then every agent will have a signal above 1 almost surely, so the action is always taken and it's bad. So the curse is still there.

      But what if the bias is negative? Then the agents are pessimistic. Let b=-0.5. Then s_i ~ Normal(-0.5,1). 
      P(s_i>1) = P(Z>1.5) ≈ 0.0668. Then the probability at least one acts: 1 - (1-0.0668)^3 ≈ 1 - (0.9332)^3 ≈ 1 - 0.812 = 0.188.
      But the true value is still 0<1, so when the action is taken, it's bad. The curse remains.

      So systematic optimism or pessimism doesn't remove the curse because the true value is fixed and below the threshold.

  (c) The agents' errors are correlated rather than independent.
      Suppose the errors are correlated. For simplicity, let's assume a common factor: 
          s_i = V + e_common + e_i
      where e_common ~ Normal(0, sigma_common^2) and e_i ~ Normal(0, sigma_idio^2) and all are independent.
      Then the variance of each s_i is sigma_common^2 + sigma_idio^2, and the correlation between any two signals is sigma_common^2 / (sigma_common^2 + sigma_idio^2).

      We set V=0, T=1. We want the same marginal variance for each signal (say variance=1). So sigma_common^2 + sigma_idio^2 = 1.

      Let rho be the correlation (so rho=sigma_common^2). Then the common factor has variance rho, and the idiosyncratic variance is 1-rho.

      With correlation, the signals are more similar. So if one agent has a high signal, others are likely to have high signals too.

      Consider two extremes:

      Case 1: rho=0 (independent) -> base case.

      Case 2: rho=1 (perfectly correlated). Then all signals are the same. So either all act or none. 
          The signal s = e_common (since V=0 and no idiosyncratic error). 
          P(s>1) = P(Normal(0,1)>1) ≈ 0.1587. 
          So with probability 0.1587, all three agents see a signal above 1 and they all would act (but we assume that only one needs to act, so the action is taken). 
          The true value is 0<1, so the action is bad. 
          The curse is still present: the action is taken when the signal is above 1, but the true value is 0.

          However, note: in the perfectly correlated case, if one agent has an overestimate, they all do. So the problem is not about which agent acts (because they all have the same signal) but that the common signal might be an overestimate.

          But the curse is about unilateral action: even if they are all the same, the action is taken by one of them. The fact that the action is taken when the common signal is above 1 (which happens 15.87% of the time) and the true value is 0, which is bad.

      Therefore, correlation doesn't remove the curse.

