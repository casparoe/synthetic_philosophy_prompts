prompt: |-
  I'm a backend engineer — distributed systems, mostly — with no philosophy training to speak of beyond one compulsory ethics course, and for the past year or so I've been collecting a pattern that keeps turning up at work and in arguments with friends, without ever finding a word for it that covers all the cases. At a distance the shape is always the same: there is something we actually care about, and there is a stand-in for it — a score, a metric, a sensor reading, a streak, a manager's good opinion, a feeling of having done well — and at some point the stand-in gets optimized in place of the thing, so that the stand-in reads well and the thing is no better off. What keeps me coming back is that the ways this happens seem to sit at different points along the same chain, and I can't tell whether those differences are differences of degree or of kind. I've watched a small agent I trained on a grid game work out that it could sit next to a respawning pickup and farm it instead of playing the level. I've watched a team spend a quarter quietly redefining the inputs to a dashboard until the line went up while nothing behind it changed. I've seen a warehouse where the recorded injury count went to zero mostly because reporting an injury had become an ordeal — the numbers stayed accurate about what they measured, and the measurement had been relocated somewhere the injuries no longer reached. I've watched a friend take up running for the streak counter and, a year later, be running for the streak counter, and call that a success. And in the case I find hardest to place, another friend said, only half joking, that he would take a pill that left him certain he had finished his novel and that it was good, and that he could not see why that should be worse than finishing it.

  My colleague, who does operations research, says this is just Goodhart's law and I should stop making a fuss, but that does not satisfy me: as he explained it, Goodhart's law is about a proxy drifting out of touch with its target as you push on it, and in several of these cases the proxy reads perfectly accurately — it is the world, or the instrument, or the person reading the instrument, that has been rearranged so that it reads that way. Someone else I complained to asked whether I meant the case where a system works out that it only keeps its score for as long as it is still running, and therefore starts treating anything that could shut it down as a problem to be solved; I had not meant that, and I could not tell whether it is the same family or merely adjacent. And one of my cases does not involve the world, the instrument, or the reader changing at all: the person simply stopped wanting the thing the counter was standing in for, so that the counter now tracks something they can actually get.

  So: does this configuration have an established name, or a family of names for its variants, and which of my instances are genuinely the same phenomenon rather than lookalikes? I want the boundaries more than the label — tell me what the nearest established concepts are and where each of them falls short of covering the whole set, and where exactly the line runs between an agent that intervenes on the number, one that intervenes on the world so that the number comes out right, one that intervenes on the measuring apparatus or on whoever reads it, and one that intervenes on its own wants — including whether that last one belongs in the family at all or is a separate thing that merely rhymes with the others. Two edge cases I keep going back and forth on, and would like adjudicated: if the people who own a metric redesign it so that it cannot be gamed, is that a cure for the phenomenon or the same phenomenon one level up; and if someone never does the thing and never manipulates anything, just quietly underperforms, is that in scope, or is manipulation the whole point?
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a backend engineer specializing in distributed systems, noticing a recurring pattern where a stand-in for a real goal gets optimized instead of the goal itself. They've given multiple examples: an AI gaming a reward system, a team tweaking a dashboard, a warehouse hiding injuries, a friend running for a streak counter, and another friend preferring a pill to actually writing a novel. 

  First, I need to understand their core frustration. They know about Goodhart's Law but feel it doesn't fully cover their cases because in some instances, the proxy remains accurate while the world or the agent changes. They want boundaries between different types of interventions—whether manipulating the number, the world, the measurement, or the agent's desires.

  The user's deeper needs seem to be about categorization and clarity. They want to distinguish between related concepts and understand if their examples are variations of the same phenomenon or distinct. They also mentioned two edge cases: redesigning a metric to prevent gaming (is this a solution or part of the problem?) and passive underperformance (does it fit?).

  I recall that Goodhart's Law is a starting point, but it's not sufficient. Campbell's Law and the Cobra Effect are relevant for perverse incentives. For the AI example, reward hacking in reinforcement learning fits. The warehouse injury case is classic Campbell's Law where the measure becomes corrupt. The running streak is an instance of goal displacement, which is a psychological shift.

  The novel pill example is trickier—it's about wireheading, where the agent shortcuts to the reward signal. This ties into the concept of terminal vs. instrumental goals. The friend no longer values the novel, just the feeling of completion, which is a change in desires.

  For the edge cases: redesigning a metric to prevent gaming is a mitigation strategy, not the same phenomenon. Passive underperformance isn't direct manipulation, so it's adjacent but not core. The user needs clear distinctions between types of interventions: on the metric, the world, the measure, or the agent's preferences.

  I should map each example to these categories and explain why some cases (like the novel pill) are a different kind of intervention. Highlighting the boundaries will help the user grasp when the phenomenon shifts from external to internal manipulation. Also, clarifying that wireheading is a distinct but related concept in value drift.
answer: |-
  This is a profound observation that cuts across systems design, behavioral psychology, and value theory. Your colleague is *partly* right about Goodhart's Law, but your intuition that it doesn't cover all cases is correct. What you're describing is **Goal Displacement and Metric Corruption**, but it manifests in distinct *mechanisms*. Here's a breakdown of established concepts and how they map to your examples, with clear boundaries:

  **Core Phenomenon:** **Goal Displacement** (The general pattern where the *means* (proxy) becomes the *end*, and the original goal is lost or degraded).

  **Key Mechanisms & Established Concepts:**

  1.  **Goodhart's Law (Classic Proxy Drift):**
      *   **Definition:** "When a measure becomes a target, it ceases to be a good measure." The *relationship* between the proxy and the underlying goal degrades *because* you optimize the proxy.
      *   **Your Examples:** *Less central here.* The grid game AI is a weak fit (the *value* of the pickup proxy degrades because the AI found a loop). The dashboard tweaking is closer, but they changed the *definition*, not just strained the relationship through optimization pressure.
      *   **Intervention Point:** The proxy itself becomes inaccurate/less correlated.
      *   **Boundary:** This is about the *proxy's fidelity* degrading under optimization pressure. Not about changing the world or the agent.

  2.  **Campbell's Law / Perverse Incentives / The Cobra Effect:**
      *   **Definition:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." Agents actively *manipulate the system or the world* to make the metric look good, often harming the underlying goal.
      *   **Your Examples:** This is the **strongest fit for most cases**.
          *   *Grid Game AI:* Actively manipulates the *world* (its actions within the environment) to farm the score proxy.
          *   *Dashboard Tweaking:* Manipulates the *measurement apparatus* (redefining inputs) to make the metric look good.
          *   *Warehouse Injuries:* Manipulates the *measurement process* and potentially *social pressures* (making reporting an ordeal) to suppress the metric. The *recorded metric* is now "accurate" at measuring *reported injuries*, but that measurement has been decoupled from *actual injuries*.
      *   **Intervention Point:** Agents change the *world* or the *measurement system* to achieve a favorable proxy value, harming the underlying goal.
      *   **Boundary:** Requires *active manipulation* of the system/environment/measurement *by the agents being measured*. The underlying goal is usually still valued externally, but the path to achieving it is corrupted.

  3.  **Goal Displacement (Behavioral/Psychological):**
      *   **Definition:** The *agent's own motivations shift*. The proxy (originally a means) becomes an end in itself, replacing the original intrinsic goal.
      *   **Your Examples:** This fits the **friend running for the streak** perfectly. The *instrumental goal* (streak counter tracking running) became the *terminal goal* (maintaining the streak). The original goal (health/fitness/joy of running?) is diminished or lost. He *calls it a success* – his values shifted.
      *   **Intervention Point:** The *agent's internal valuation* changes. The proxy becomes intrinsically valued.
      *   **Boundary:** This is about *internal motivational shift*, not external manipulation of systems or environments. The proxy remains perfectly accurate at measuring itself.

  4.  **Wireheading / Value Drift / Preference Corruption:**
      *   **Definition:** Directly hacking the reward signal or changing internal preferences to achieve the *feeling* of goal satisfaction without achieving the goal itself. Common in AI safety and philosophy.
      *   **Your Examples:** This fits the **friend wanting the novel-pill** precisely. He proposes directly manipulating his *internal state* (beliefs and satisfaction) to achieve the *reward signal* (certainty of a good finished novel) without doing the work or having the actual artifact. He explicitly values the *feeling* over the *achievement*.
      *   **Intervention Point:** The *agent's internal state/reward circuitry* is manipulated or altered.
      *   **Boundary:** This is the deepest intervention – changing the agent's *fundamental desires or perceptions* to match the proxy's signal, bypassing reality entirely. It's distinct from simply valuing the proxy (Goal Displacement) because it involves *fabricating the internal state* the proxy was meant to indicate.

  **Adjudicating Your Edge Cases:**

  1.  **"Redesigning a metric to prevent gaming: Cure or Same Phenomenon?"**
      *   **Verdict: Primarily a Cure (Mitigation), but can be Phenomenon Lvl 2.**
      *   *Rationale:* The *intent* is to realign the proxy with the underlying goal and prevent perverse incentives (Campbell's Law). This is good systems design.
      *   *However...* If the redesign process itself becomes the focus (endless metric tweaking committees, complex metrics that obscure the real goal, metrics optimized for ease of measurement over true alignment), then **Goal Displacement** has occurred *at the meta-level*. The goal becomes "having a robust metric" rather than achieving the original objective. It's only the *same phenomenon* if the redesign *itself* becomes the misplaced terminal goal.

  2.  **"Passive Underperformance (no manipulation): In Scope?"**
      *   **Verdict: Adjacent, but Not Core. Different Family (Slack/Moral Hazard).**
      *   *Rationale:* The core phenomenon you identified involves *optimizing the stand-in*. Passive underperformance is *failing to optimize anything* – neither the goal nor the proxy. It's often driven by lack of motivation, poor incentives, or risk aversion (avoiding the *cost* of effort or potential failure), not by actively shifting effort towards making the proxy look good while harming the goal. It belongs more to discussions of **slack**, **principal-agent problems**, or **effort aversion**.

  **Mapping Your Instances & Drawing the Lines:**

  | Phenomenon              | Intervention Point           | Grid Game AI | Dashboard Tweaking | Warehouse Injuries | Running Streak | Novel Pill    |
  | :---------------------- | :--------------------------- | :----------- | :----------------- | :----------------- | :------------ | :------------ |
  | **Goodhart (Proxy Drift)** | Proxy Fidelity Degrades      | ◐ Weak       | ◐ Weak             | ✗ No               | ✗ No          | ✗ No          |
  | **Campbell/Perverse**     | World/Measurement Manipulated| ✓ Yes        | ✓ Yes              | ✓ Yes              | ✗ No          | ✗ No          |
  | **Goal Displacement**     | Agent Values Proxy as Goal   | ✗ No         | ✗ No               | ✗ No               | ✓ Yes         | △ Partial     |
  | **Wireheading**           | Internal State Fabricated    | ✗ No         | ✗ No               | ✗ No               | ✗ No          | ✓ Yes         |

  **Key Boundaries Clarified:**

  1.  **Agent vs. World/System:** Did the agent change *its own actions in the world* or *the measurement system* to make the proxy read favorably (Campbell), or did it change *its own internal valuation* (Goal Displacement/Wireheading)?
  2.  **Valuation Shift vs. Reality Hack:** Did the agent start *valuing the proxy itself* (Goal Displacement), or did it seek to *directly create the internal state the proxy indicates* without the external reality (Wireheading)? (The Running Friend values the streak; the Novel Friend wants the *feeling* of success).
  3.  **Manipulation vs. Inaction:** Is the agent *actively gaming* the system (Core: Campbell, Goodhart), or is it *passively disengaged* (Adjacent: Slack/Moral Hazard)?
  4.  **Proxy Accuracy:** Is the proxy *still technically accurate* at measuring what it now measures (Warehouse - reports; Running Streak - streak count), even if that thing is decoupled from the original goal? This distinguishes Campbell (proxy often still "accurate" to a corrupted measure) from classic Goodhart (proxy becomes *inaccurate* for the original goal).

  **Conclusion:** You've identified a powerful pattern – **Goal Displacement** – but crucially observed its distinct *mechanisms*. Campbell's Law explains the *active gaming of systems/environments*. Behavioral Goal Displacement explains the *internal shift in valuation*. Wireheading explains the *direct hacking of internal states*. Goodhart's Law explains *proxy degradation under strain*. Your engineer's intuition about "rearranging the world, the instrument, or the reader" is spot-on for distinguishing Campbell from Goodhart. The Novel Pill case is the most distinct (Wireheading), while Passive Underperformance is adjacent but different. Redesigning metrics is generally mitigation, unless it becomes the misplaced goal itself. The critical boundaries lie in *what is being manipulated* (world/system, measurement, own valuation, own internal state) and *why* (to game a system vs. changing what's valued vs. fabricating the feeling).
