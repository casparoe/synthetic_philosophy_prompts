prompt: |-
  You are a philosopher of psychiatry retained as staff ethicist to a national psychiatric association's nosology review panel; I chair the panel, and in two weeks we vote on a proposed addition to the next revision of our manual. Our working label is "scripted dysphoria": persistent distress and impairment organized around a person's immersion in an online community that circulates a detailed public script for the condition — its triggers, its expected course, its symptoms. Field trials show the proposed criteria are reliable, clinicians find them useful, and the advocacy groups that helped write the script are pressing hard for inclusion. One member wants to file it as a culture-bound syndrome rather than a diagnosis proper.

  Draft the short opinion memo I will circulate before the vote. Open with your recommendation — include the category, exclude it, or include it in a modified form, and if modified, specify the mechanism and a review timeline. Then give the reasoning, including an honest account of the strongest case on the losing side.

  Confront head-on the difficulty I keep circling: this may be a kind whose members change in response to being classified — the looping effect Ian Hacking described. Our validation machinery (field trials, prevalence estimates, discriminant validity against neighboring diagnoses) treats the target as fixed while we test it. If classifying the population alters the population, tell us what we have actually validated, and whether the evidentiary bar for a self-modifying category should differ from that for one that is not. Do not summarize the literature on social construction or attach citations; argue to a decision. Think the tension through before you commit, but the memo itself should lead with the bottom line. Maximum 500 words.
reasoning: |-
  Okay, the user is chairing a psychiatric nosology panel voting on adding "scripted dysphoria" to their manual. They need a concise ethics memo addressing core tensions: validation paradoxes when diagnoses alter the diagnosed population, and whether to classify this as culture-bound syndrome or full diagnosis. 

  First, unpacking the stakes: This isn't just about diagnostic criteria reliability (which field trials confirm) but about epistemic responsibility. The advocacy groups' push for legitimacy collides with concerns about iatrogenic harm through diagnostic scripting. Hacking's looping effect is central here - by validating the category, we risk cementing the very suffering patterns we aim to describe.

  The culture-bound syndrome proposal offers compromise but misfires: Scripted dysphoria spreads transnationally via digital communities, lacking the geographic/cultural containment of traditional culture-bound syndromes. Yet treating it as a full diagnosis ignores how the script actively shapes symptom presentation. This demands a third way.

  Key ethical tensions: 
  - Autonomy vs harm: Recognition validates patient experiences but may reinforce pathological identities. 
  - Epistemic humility: Our validation tools assume fixed traits, but here the "target" moves when labeled. 
  - Diagnostic justice: Excluding risks marginalization; including risks therapeutic fatalism.

  The solution must: 
  1) Name the phenomenon without reifying the script 
  2) Flag its constructed nature for clinicians 
  3) Build in reassessment mechanisms 

  Hence the hybrid recommendation: Provisional categorization with mandatory review. The timeline forces reckoning with real-world consequences beyond initial validation. The "clinical significance" criterion acts as a circuit-breaker against trivial distress claims. 

  On the losing side: Full inclusion advocates rightly note that reliability and utility met standards. But they underestimate how diagnostic recognition becomes part of the script's dissemination apparatus. The memo must acknowledge this while insisting that when the measure changes the measured, our evidence bar must be higher.

  Final framing: This is about responsible ontology-making. Psychiatry constructs tools that construct realities - so we build tools that bend.
answer: |-
  ## MEMO: Recommendation on Proposed "Scripted Dysphoria" Diagnosis

  **TO:** Nosology Review Panel  
  **FROM:** Staff Ethicist  
  **RE:** Recommendation on "Scripted Dysphoria"  
  **DATE:** [Date]

  **RECOMMENDATION:** Include "Scripted Dysphoria" provisionally within the Appendix (Culture-Bound Syndromes/Provisional Conditions) for the next edition, with a mandatory 5-year review before potential elevation to a main diagnosis. The provisional criteria must include explicit clinical significance criteria (distress/impairment demonstrably *exceeding* typical engagement with the relevant online community). Review must specifically assess evidence of diagnostic iatrogenesis and stability of symptom presentation post-inclusion.

  ### Reasoning
  The core ethical tension is Hacking's "looping effect": classifying this condition risks fundamentally altering the very phenomenon we seek to describe and treat. Our validation data (reliability, utility, discriminant validity) captures a snapshot *within* an existing feedback loop where a shared script organizes distress. Validating the diagnosis injects immense social power *back* into that script. We have validated the coherence and clinical recognizability of the script-influenced presentation *as it currently exists*, but **not** its stability as a natural kind independent of the classification act itself. Inclusion risks amplifying the script, recruiting more individuals into its narrative, and rigidifying symptom expression to match diagnostic expectations – potentially *increasing* suffering and impairment.

  The strongest case *for* full inclusion is compelling: clinicians identify a reliable, impairing pattern; patients feel validated; advocacy groups demand recognition. Excluding it risks dismissing genuine suffering simply because its expression is socially mediated, potentially denying access to care. Field trials meet current methodological standards. Arguably, *all* psychiatric categories have some social component; why penalize this one?

  However, this case underestimates the unique *amplification risk*. Unlike, say, depression, the "script" provides a detailed blueprint for distress *tied directly to the diagnostic label itself*. Validation by this Panel becomes a potent signal reinforcing the script's legitimacy and spread. Our evidentiary bar *must* be higher for categories demonstrably susceptible to such rapid, classification-driven modification. Standard validation assumes relative stability; here, stability is the very question.

  ### The Losing Side's Strength & Our Path Forward
  The pro-inclusion argument rightly insists we cannot ignore clinician-reported, impairing distress patterns simply due to social mediation. Dismissing it as "not real" is ethically untenable and clinically unwise. However, granting it full diagnostic status now ignores the profound responsibility we bear for how our classification might reshape future suffering.

  Provisional Appendix placement with strict review addresses both concerns:
  1.  **Acknowledges Reality:** It recognizes the observed clinical phenomenon and provides a framework for study and care without granting the full ontological legitimacy of a main diagnosis.
  2.  **Mandates Scrutiny of Iatrogenesis:** The 5-year review *requires* investigation into whether diagnosis fuels the script's spread, intensifies symptoms, or creates new cases. We actively test the looping effect hypothesis.
  3.  **Clinical Significance Safeguard:** Requiring distress/impairment *exceeding* typical community engagement helps filter normative community identification from pathological entrenchment.
  4.  **Preserves Flexibility:** It allows adaptation or removal based on evidence of harm or instability, avoiding premature reification.

  **BOTTOM LINE:** The risk of iatrogenic harm through diagnostic reinforcement is too significant for immediate full inclusion. Provisionally recognizing the syndrome within the Appendix, with robust safeguards and mandated review, allows clinical responsiveness while demanding rigorous scrutiny of how our classification shapes the suffering we aim to alleviate. We validate the *current presentation*, but must actively validate the *consequences of validating it*. Vote for provisional inclusion with mandated review.
