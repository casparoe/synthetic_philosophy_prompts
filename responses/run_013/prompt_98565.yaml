answer: |-
  ## Twin Maps of Doubt

  *(A Substantivalist's Unease)*

  Here lies the cosmos, fixed and known:
  The void's own points each have their throne.
  Outside the Hole (its boundary clear —
  a sphere defined by stars hung near)
  all geodesics trace their arc,
  all matter moves through light or dark.
  The Hole itself, a bounded space
  where nameless points in darkness wait.

  But shift the names — a subtle art —
  within that Hole, a counterpart
  to every dot. The map's remade
  where no star shines, no light's displayed.
  *Outside the Hole, the very same:*
  *The stars hold place, the paths retain*
  *their ancient curves through cosmic deep.*
  *No watchful eye records the leap.*

  The Hole itself, a bounded space
  where nameless points in darkness wait.
  Now see the paths *within* the zone:
  Where particle A once moved alone,
  now particle B takes its track,
  on the *same* line, forward and back.
  The structure's whole, the metric true,
  yet points wear names they never knew.

  *Outside the Hole, the very same:*
  *The stars hold place, the paths retain*
  *their ancient curves through cosmic deep.*
  *No watchful eye records the leap.*

  Two worlds? Or one? The evidence
  shows no divergence, no difference
  in what is measured, light or mass.
  Yet *points* are moved... upon this pass,
  a chill descends. If names define
  reality's base, its deepest line,
  then here, within the Hole's tight seal,
  the future lacks a fate revealed.
  The past dictates the outer frame,
  but *here*... indeterminacy's claim.
  My manifold's mute points insist
  on difference where none exists.
  The stars blaze on, indifferent, high,
  while meaning's foundations softly sigh.

  ---

  ## How the Form Reflects the Hole Argument

  1.  **Literal Repetition:** The stanzas marked by asterisks (`*Outside the Hole...*`) are **identical**. This embodies the core idea: outside the Hole, absolutely nothing changes. Observing these parts, you see the exact same state of affairs.
  2.  **Duplicated Structure with Shifted Content:** The two core descriptive stanzas (starting "Here lies the cosmos..." and "The Hole itself...") share an identical rhyme scheme (ABAB CDCD) and highly similar meter (loose iambic pentameter). Their *structure* is duplicated, mirroring the mathematical duplication of the spacetime model via the hole diffeomorphism. However, the *content* within that structure shifts slightly:
      *   Stanza 1: Original setup ("particle A", "nameless points... wait").
      *   Stanza 3: Shifted model ("particle B", "points wear names they never knew").
      *   Yet, the *observable consequences* described remain the same structure ("paths... track", "structure's whole, the metric true"). This is the "difference that makes no (observable) difference".
  3.  **Refrain as Invariance:** The repeated stanza acts as a refrain, constantly reinforcing the absolute sameness of the observable universe outside the Hole after the transformation.
  4.  **The Turn (Unease & Indeterminism):** After the duplicated structures and refrains establish the core argument, the final stanza breaks the pattern. This is where the substantivalist voice explicitly articulates the consequence: the insistence on distinct points ("names define reality's base") forces the recognition of indeterminism ("the future lacks a fate revealed... indeterminacy's claim"). The sighing foundations mirror the unease.
  5.  **Performative Swap:** Swapping the first descriptive stanza (original model) with the third (shifted model) would change *which* particle is mentioned first, but the poem's core argument, structure, refrain, and conclusion about sameness outside and indeterminism inside would remain perfectly intact and sensible. This directly mirrors swapping the two spacetime models.
  6.  **Technical Honesty:**
      *   "The Hole (its boundary clear — / a sphere defined by stars hung near)" establishes an open region bounded by observables.
      *   "shift the names... within that Hole", "Outside the Hole, the very same" ensures the diffeomorphism is identity outside, active inside.
      *   The core stake is explicitly named: "indeterminacy's claim".

  The poem forces the reader to experience the tension: the identical refrains scream "sameness", the duplicated-but-shifted stanzas whisper "difference", and the substantivalist's final lines shout the consequence of asserting that whispered difference as real.
