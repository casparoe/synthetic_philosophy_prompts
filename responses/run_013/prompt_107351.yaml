prompt: |-
  I've been doing evals on language models for a small lab for about two years now, and last month we had a nasty scare where a model was scoring way above what we'd assumed was chance on a held-out set, and it turned out the held-out set had leaked into training through some scraped mirror nobody had noticed. Fine, lesson learned, but during the post-mortem one of my colleagues said something half-joking: at some point you can't tell the difference between a model that's clever and a model that's cheating through a channel you never thought to block. We all laughed and moved on. Except it's been rattling round my head ever since, because I went back and re-read Turing's 1950 paper and there's a chunk near the end about telepathy that I'd always skimmed past as an excentric footnote — he worries that if the interrogator can be read telepathically, or if the machine itself has some paranormal channel, then the whole imitation game is measuring the wrong thing, and he suggests shielding the interrogator in a telepathy-proof room and adjusting the setup so that guessing, or any hidden channel, stops conferring an advantage. He also seems to treat the statistical evidence for telepathy as genuinely strong, not as a joke.

  What I want from you is a faithful translation. Restate Turing's position on ESP and the imitation game in the vocabulary I actually use. I'm fluent in the stats/ML side: null hypotheses, chance baselines, statistical power, contamination, leakage, distribution shift, blinding, control conditions, adversarial probing, priors, base rates, multiple comparisons, causal graphs with hidden nodes, side channels, information-theoretic bounds on what a channel can carry, and the difference between an effect being absent and an effect being unmeasured. Don't smuggle my assumptions in and call it translation — keep it honest.

  Then give me the residue report. Which bits of what he's saying map cleanly onto something like leakage or confounding? Which bits only map with distortion? Which bits have no counterpart in my vocabulary at all? And then the part I actually care about: is the leftover a defect in my framework, or a sign that his worry is less substantive than it looks? Is he just saying control your experimental conditions — in which case fine, we already do that — or is he making the stronger point that the validity of the whole test rests on an empirical claim about the world that no amount of clever experimental design can discharge from the inside?

  Two things I'd particularly like you to press on. First, does anything in my vocabulary capture the difference between a channel that exists but has been blocked and a channel that we've simply decided doesn't exist? Second, his willingness to let the machine itself possess the anomalous ability — is there anything in how I think about evals that allows a system to exploit a channel the evaluator doesn't know about, or do I just assume the environment is the only thing talking to it? Please answer in British English.
