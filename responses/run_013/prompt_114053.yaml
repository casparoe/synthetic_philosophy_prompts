prompt: |-
  Two years of a postdoc, one question, and I think mine is verisimilitude: Popper's idea that our best theories are all false but later ones can still be closer to the truth, the fact that his own definition of "closer" got taken apart by counterexamples soon after he proposed it, and the rival repairs that came later (content-based ones, distance-based ones, attempts to keep Popper's original intuition alive). I keep hearing its a backwater. So which open questions here are actually worth two years, ranked, and why? I care much more about the reasoning than the list — which questions are upstream of which, which ones are tractable for someone doing straight philosophy rather than probability theory, what would move a question up or down the list (e.g., if somebody finally settled whether truthlikeness depends on the language you happen to state your theory in), and whether any of this carries over to fields where the theories aren't laws, like rival models in economics or ML. Flag the dead ends that still get written about anyway. Lead with your bottom line in your first sentence, then the reasoning, with no preamble and no restating of my question, and write it in American English.
