answer: |-
  ## Newton in His Study, at Night

  The candle gutters. Ink bleeds on the page.
  These figures traced – the ellipses, the arcs –
  Deny their own perfection. Watch them drift,
  These clockwork heavens, intricate and grand!
  The planets tug, the comets trace long curves,
  Yet calculate their dance a thousand years:
  The minuet grows slack, the measured tread
  Staggers. A friction, subtle as despair,
  Creeps through the void. The wheels *would* slow, would grind
  To discord in the deep, cold emptiness...
  If left alone. But nothing *is* alone.
  This space, this vast and absolute extent
  That holds the sun's fierce grip, the comet's flight –
  It is not mere vacancy. It thrums. It *bears*.
  Not passive stage, but living plenum, dense
  With cause. My hand upon this desk requires
  The constant pressure of the air unseen,
  The world requires... more. A Presence, not
  The absentee Artificer who wound
  The spring and vanished. No. A constant Hand
  That steadies Saturn's ring, that breathes anew
  The pulse within the system's fragile heart,
  Corrects the drift, renews the fading force.
  This bounding frame... is He. His being, vast,
  The very medium where matter swims,
  The Sensorium where all motions play
  Before His knowing eye. The world *in* God...
  Not separate, adrift.

  (He lifts a different page, a brittle script,
  Hebrew and Greek like tangled thorns. The flame
  Dips low.)

  ...And so the Truth. Corrupted, veiled.
  The simple core obscured by gilded words,
  By doctrines piled like ossuary stones.
  They speak of Three in One, a tangled knot
  That chokes the pure, paternal Light I know.
  Not reasoned, but imposed... a later graft
  Upon the primal vine. The early church...
  They turned so soon. The scrolls lie choked with dust,
  The prophecies... a code, a map laid down
  To guide us back, through time's distorting glass.
  I trace the figures here – the Beast, the Throne –
  As I trace Venus' path. Both speak decay,
  The slow departure from the first design.
  Nothing endures alone! Not planets cold,
  Nor faith received. Tradition, left unchecked,
  Grows rank as ivy on a temple wall,
  Strangling the form beneath. The Word itself
  Requires... renewal. Constant as the spheres
  Require His hand. I seek the source, the root,
  The uncorrupted spring... and find it hid
  In Daniel's visions, Revelation's fire...
  (The pen hovers. A fierce, forbidden thought
  Contracts his hand. He glances at a chest,
  Locked deep in shadow.) ...Truth too bright for now.
  Too stark. They'd call it heresy. And burn...
  What *must* be written, buried. Let the earth
  Keep counsel, till the reckoning draws near.

  The candle steadies. Silence fills the room,
  A pressure like the ether. Not a void,
  But *full*. The diagrams, the sacred texts –
  One parchment now. One law. One needful God
  Who fills all space, sustains each wheeling mote,
  Corrects the drift in stars *and* human creeds.
  No clockwork runs alone. No faith stands pure
  Without His present, preserving hand. The frame,
  The boundless, silent frame that holds it all...
  Is His own being. Here. Now. Unmoved Mover,
  Yet everywhere engaged, maintaining all.

  ---

  **Historical Note: The Poem's Footings**

  *   **Well-Supported:**
      *   **God's Continuous Action:** Newton explicitly rejected the absentee "clockmaker" deist God. His letters (especially to Bentley) and the General Scholium to the *Principia* argue that planetary stability *requires* God's regular intervention to prevent gravitational collapse or decay. "This most beautiful system... could only proceed from the counsel and dominion of an intelligent and powerful Being... He endures forever, and is everywhere present; and by existing always and everywhere, he constitutes duration and space..." (*Principia*, General Scholium).
      *   **Space as God's "Sensorium":** Newton used this specific term in a 1692 letter to Richard Bentley: "He is omnipresent not *only* *virtually* but also *substantially*... in him are all things contained and moved; yet neither affects the other... as a man's soul sensorium is the place where the images of all things are... there are the things themselves." He saw space as the medium *through* which God perceives and acts upon the universe, a necessary consequence of His omnipresence and omniscience. It's *not* pantheism (God *is* space), but rather that God is substantially present *in* space, making it His "sensory field."
      *   **Anti-Trinitarianism:** Newton's rejection of the Trinity is extensively documented in his vast private theological manuscripts (millions of words). He believed it was a 4th-century corruption by Athanasius, not part of the original Apostolic faith. He kept this secret to retain his position at Cambridge and avoid prosecution for heresy.
      *   **Prophetic Interest:** Newton devoted immense time and effort to biblical chronology and prophecy interpretation (e.g., *Observations upon the Prophecies of Daniel and the Apocalypse of St. John*). He believed they held scientific-like keys to history and the future, and were crucial for restoring true religion.

  *   **Contested Reconstruction:**
      *   **Degree of Integration:** While Newton *saw* his work as unified (God as the First Cause and Sustainer revealed through both Nature and Scripture), historians debate how *functionally integrated* his physics and theology were. The poem leans into the view that the *same core intellectual drive* (rejecting autonomous systems, seeking original truths through rigorous analysis, requiring God's constant involvement) underpinned both. Some scholars see them as parallel passions driven by the same personality, but operating with distinct methodologies and purposes.
      *   **Centrality of Prophecy:** Was prophecy interpretation *central* to his identity and project, or a massive but somewhat marginal *hobby* alongside his "real" work? The poem treats it as equally vital and methodologically linked (decoding prophecies like planetary motions). Many historians acknowledge its importance *to him* but debate its true significance within his overall legacy.
      *   **Literalness of "Sensorium":** While Newton used the term, scholars debate how literally he meant the analogy to human sensory apparatus. Some argue it was primarily a way to express God's omniscience and omnipresence, while others see it as a more specific (and philosophically problematic) metaphysical claim. The poem leans towards the more literal interpretation often emphasized in discussions of his theology's uniqueness.
      *   **The "Buried Truth" Motif:** While he *did* keep his anti-Trinitarianism secret and wrote vast unpublished theological works, the poem's dramatic moment of *actively choosing* to bury a specific, dangerous thought about the "uncorrupted spring" is poetic condensation. His secrecy was a lifelong, complex stance, not necessarily a single nightly decision over a specific page, though the *feeling* of dangerous knowledge is authentic.

  The poem presents a coherent and deeply felt interpretation of Newton's unified worldview, strongly supported by his own words on divine action and space, his anti-Trinitarianism, and his prophetic work. It leans towards the view that the *same* intellectual architecture supported both his physics and theology, a perspective grounded in his writings but still subject to nuanced historical debate.
