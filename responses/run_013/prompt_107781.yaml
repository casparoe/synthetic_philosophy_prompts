     Similarly for deontology.

     So if they buy evidence, they get a randomly selected piece of evidence about one of the near-duplicate pairs (either utilitarianism or deontology) that says the second version (AU2 or KD2) is the better formulation. Then the group might want to adjust their credences.

     The cost: 10 points per student.

     - 55-60 min: If they bought evidence, they read it and discuss for 5 min.

     - 60-70 min: Additional deliberation if evidence was bought, or continuation if not.

     - 70-75 min: The group must decide on the option. They also must decide on the scaling for P and E. They can do this by voting or by consensus.

