    Let's design the reveal: The facilitator randomly selects the "correct" theory at the end, with the probability of a theory being chosen proportional to the total credence the group assigned to it (i.e., the average credence). Then, for each student, the points they earn are: 
        (choiceworthiness of the chosen option according to the correct theory) * (student's credence in the correct theory) * [a scaling factor to make points reasonable]

    But note: the choiceworthiness numbers might be negative. We need to make sure that the payoff is always non-negative? Or we can have a base and then adjust. Alternatively, we can set the choiceworthiness such that the minimum is zero? Or we can use a transformation.

