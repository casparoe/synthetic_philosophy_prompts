    We'll design the dilemma and the choiceworthiness numbers accordingly.

  - Timeline: 90 minutes total.
    - 10 min: Introduction and setup (assign roles, explain the dilemma and the task).
    - 15 min: Individual preparation (students read their theory's verdicts and consider how to argue).
    - 30 min: Group deliberation and decision-making (they can choose an option or choose to buy evidence, which takes time and has a cost).
    - 15 min: If they buy evidence, they get it and then have 10 min to reconsider (the buying takes 5 minutes of the 30 above? Or we adjust). Actually, let's break the 30 min: 
        - First 20 min: Initial deliberation and possible decision to buy evidence. 
        - If they buy evidence, they get 5 min to read the evidence and then 10 min more to deliberate and decide.
        - If they don't, they use the full 30 min to decide.
    - 5 min: Final decision and reveal of the correct theory (by random draw) and calculation of points.
    - 20 min: Debrief.

  - Debrief: Map the experience to key concepts: 
    - Maximizing expected choiceworthiness (MEC) vs following one's favorite theory.
    - Intertheoretic comparison (the issue of setting the scale for the two theories).
    - Theory individuation (the near-duplicates and how that affects aggregation).
    - Weighting each theory by how much its verdicts vary (variance or range) vs just the credence.
    - Alternative: theories as negotiating parties instead of voting.

  - Predictable problems and how to handle:
    1. Students collapse into ordinary majority voting: The facilitator should ask probing questions during the deliberation to encourage considering the aggregation methods. But also, in the debrief, highlight why that is inadequate.
    2. Someone declares the exercise incoherent: Acknowledge that moral uncertainty is a difficult problem and that the exercise is designed to surface challenges. Note that the activity is a simulation to feel the problem, not a solution.
    3. Near-duplicate trick spotted early: If they spot it, then they can discuss how to adjust for it. The facilitator can then steer the conversation to the implications for theory individuation.

  - What the activity cannot reproduce:
    - The philosophical problem concerns a single agent's uncertainty, but here we have multiple people. The facilitator must note that the exercise uses a group to simulate the inner conflict of a single mind with uncertainty.
    - The activity stipulates the scale for the two theories (by having the group set it arbitrarily) rather than solving the problem of intertheoretic comparison. The facilitator must note that in real moral uncertainty, we don't have a ready-made scale and that this is a deep philosophical problem.

