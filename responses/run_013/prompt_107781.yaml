  ### Moral Uncertainty Decision Lab: Aggregation Dilemma  
  **Objective:** Simulate the challenges of aggregating moral judgments under uncertainty, forcing students to confront the aggregation problem, theory individuation, and intertheoretic comparison through a policy decision.  

  ---

  ### **Setup and Materials**  
  **Policy Dilemma:** The "Trolley Health Crisis"  
  *Background:* A disease outbreak will kill 100 people unless one of four policies is enacted immediately. Each policy has distinct outcomes:  
  - **Option A:** Let the disease run its course (100 die, no intervention side effects).  
  - **Option B:** Distribute a vaccine with mild side effects (20 die from side effects + disease).  
  - **Option C:** Mandate a risky drug (10 die from side effects, but 95 survive the disease).  
  - **Option D:** Redirect resources to protect vulnerable groups (5 die from redirected resources, 70 survive).  

  **Assigned Roles & Credences:**  
  - 18 students, each assigned one moral theory with **credence** (subjective probability) and **choiceworthiness scores** for each option.  
  - **Key feature 1 (near-duplicates):** Three theories are near-identical variants (e.g., "Rule Util-A" and "Rule Util-B" differ only in scoring Option C).  
  - **Key feature 2 (shared scale):** Two theories ("Negative Util" and "Prioritarianism") require conversion to a shared cardinal scale.  
  - **Theories and Credences** (each student gets a role card):  
    | Theory (Underlying View) | Variants | # Students | Credence | Choiceworthiness (A, B, C, D) | Notes |  
    |--------------------------|----------|------------|----------|--------------------------------|-------|  
    | **Act Utilitarianism**   | None     | 3          | 0.7      | (0, 50, 30, 40)               | Fixed scale |  
    | **Rule Utilitarianism**  | Variant A | 3         | 0.7      | (0, 40, 20, 60)               | Near-duplicate of Variant B |  
    | **Rule Utilitarianism**  | Variant B | 3         | 0.7      | (0, 40, 10, 60)               | Scores Option C lower than A |  
    | **Kantian Deontology**   | None     | 3          | 0.7      | (0, -20, -50, -10)            | Fixed scale |  
    | **Negative Utilitarianism** | None  | 2          | 0.7      | (0, -30, -20, -10)            | **Shared scale with Prioritarianism** |  
    | **Prioritarianism**      | None     | 2          | 0.7      | (0, 100, 80, 120)             | **Shared scale with Negative Util** |  
    | **Virtue Ethics**        | None     | 2          | 0.7      | (0, 30, -40, 10)              | Fixed scale |  
    - **Credence note:** Each student has 0.7 credence in their assigned theory and 0.3 distributed equally among other theories (~0.043 each).  

  **Evidence Purchase Option:**  
  - Groups can spend 1 deliberation round (5 min) to buy "WHO Data" costing **10 points/student**.  
  - Data reveals: *"Option C’s side-effect deaths are 50% lower than estimated."*  
  - **Effect:** Adjusts scores for Option C:  
    - Util variants: +20 to Option C.  
    - Other theories: +10 to Option C.  

  **Payoff Scheme:**  
  - After the group’s decision, a random draw determines the "correct" theory (weighted by group’s aggregate credence).  
  - Each student’s points:  
    `(Student’s credence in correct theory) × (Choiceworthiness of chosen option under correct theory) - (10 if evidence bought)`  
  - **Scaling for Negative Util/Prioritarianism:**  
    - Group must define a linear conversion:  
      `Converted Score = (Raw Score + Zero Shift) × Unit Scale`  
    - E.g., Prioritarianism (120) vs. Negative Util (-30): A mild scale shift flips top options.  

  ---

  ### **Timeline (90 Min)**  
  1. **Introduction (10 min):**  
     - Explain dilemma, roles, and rules.  
     - Emphasize: Goal is a single group recommendation; points depend on the "correct" theory reveal.  

  2. **Individual Prep (15 min):**  
     - Students review their theory’s choiceworthiness scores.  
     - **Near-duplicate hint:** "Some theories may have subtle overlaps."  
     - **Scale hint:** "Two theories’ scores need conversion—define zero/unit together."  

  3. **Group Deliberation (45 min):**  
     - **Phase 1 (20 min):** Open debate. Students lobby for their theory.  
       - **Predictable issue:** Majority voting emerges early. *Facilitator prompt: "How do we weigh credences vs. theory counts?"*  
     - **Evidence Purchase (5 min, optional):** Group votes to buy WHO Data (costs 10 pts/student).  
       - If bought, pause for 5 min to integrate new scores.  
     - **Phase 2 (20 min):** Finalize scale for Negative Util/Prioritarianism and vote.  
       - **Predictable issue:** Near-duplicates spotted. *Facilitator: "Rule Util-A and B are similar—should they count as one view?"*  
       - **Predictable issue:** Scale arbitrariness. *Facilitator: "Does your scale choice reflect moral truth or convenience?"*  

  4. **Decision and Reveal (10 min):**  
     - Group submits one option (A, B, C, or D).  
     - Randomly draw "correct" theory (e.g., weighted by 18 students’ average credences).  
     - Calculate points.  

  5. **Debrief (20 min):**  
     - Map outcomes to concepts:  
       | **What Happened** | **Concept** | **Discussion Question** |  
       |-------------------|-------------|-------------------------|  
       | Students ignored credences | Maximizing Expected Choiceworthiness (MEC) vs. Favorite Theory | "Why did we default to voting? How does MEC prevent tyranny of the majority?" |  
       | Near-duplicates inflated Util’s influence | Theory Individuation | "Did splitting Rule Util unfairly double its weight? How do we count ‘distinct’ theories?" |  
       | Scale choice flipped B/D | Intertheoretic Comparison | "Did your scale feel arbitrary? How could a single agent set this scale non-arbitrarily?" |  
       | Point losses from evidence purchase | Cost of Deferral | "When is buying evidence worth the cost? How does this relate to real-world moral inquiry?" |  
       | Students bargained ("I’ll back D if you lower the scale") | Theories as Negotiating Parties | "How does ‘negotiation’ differ from ‘voting’? Is compromise coherent for one agent?" |  
     - **Predictable issues:**  
       - *Majority voting:* Students overlook credences. *Handling:* Ask: "If your theory had 0.1 credence, should it get equal weight?"  
       - *"This is incoherent!":* Student rejects the setup. *Handling:* "Moral uncertainty *is* messy—this activity makes it visceral. What would you do differently?"  
       - *Early near-duplicate detection:* Group collapses Rule Util. *Handling:* "Great! But now Prioritarianism has less weight—is that fair?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Group vs. Single Agent:**  
     - Philosophical problem: Moral uncertainty concerns a *single agent*’s inner conflict.  
     - **Facilitator’s substitution:** Frame the group as "voices in one mind." Ask: "How would *you* weigh these views alone?"  

  2. **Stipulated Scale:**  
     - Real agents lack a predefined scale for comparing theories.  
     - **Facilitator’s substitution:** Highlight the arbitrariness: "You set the scale—but in real life, this is the core challenge of intertheoretic comparison."  

  ---

  ### **Facilitator Notes**  
  - **Pre-activity:** Assign roles randomly; prepare role cards and evidence envelopes.  
  - **During:**  
    - Neutralize dominance: If one student monopolizes, ask: "How does your theory’s *credence* affect its voice?"  
    - Scale sabotage: If the group rushes scaling, ask: "What if we set Prioritarianism’s unit 10x higher? Does D suddenly beat B?"  
  - **Post-activity:**  
    - Stress that points = proxy for "moral success" under uncertainty.  
    - End with: "In real moral decisions, you are the aggregation mechanism."  

  This design forces engagement with aggregation pitfalls while leaving room for self-discovery. Students leave feeling the problem’s weight—not just hearing about it.
