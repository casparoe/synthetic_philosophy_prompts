     - 80-90 min: Debrief.

     Debrief points:

     1. Maximizing expected choiceworthiness (MEC) vs following one's favorite theory: Did the group try to compute the expected choiceworthiness? Or did they vote by majority? In the aggregation, if they did MEC, they had to deal with scaling and near-duplicates.

     2. Intertheoretic comparison: How did the group handle scaling P and E? Did they set the zero and unit arbitrarily? How did that affect the outcome?

     3. Theory individuation: Did the near-duplicates (AU1/AU2 and KD1/KD2) affect the aggregation? If they counted theories separately, utilitarianism and deontology had more weight. Did the evidence about the near-duplicates help?

     4. Weighting by variance: Did anyone suggest weighting each theory by how much its verdicts vary across the options? For example, a theory that is indifferent between options should have less weight. In our case, KD2 is indifferent between A and B, so it has less variance.

     5. Negotiation vs voting: Did the group negotiate as if the theories were parties? Or did they vote?

     Predictable problems:

     - Students collapse into majority voting: The facilitator can ask, "How are we taking into account the strength of preference of each theory and the credence?" and "How do we handle the scaling for Prioritarianism and Egalitarianism?"

     - Someone declares the exercise incoherent: The facilitator can agree that moral uncertainty is a hard problem and that the exercise is to feel the difficulties, not to solve them.

     - Near-duplicate trick spotted early: If they notice, the facilitator can ask, "How should we adjust for the fact that these two theories are very similar? Should we combine them? How does that affect the aggregate credence?"

     What the activity cannot reproduce:

     - The philosophical problem is about a single agent's uncertainty, but here we have group disagreement. The facilitator must note that the group is standing in for the single agent's conflicting moral reasons.

     - The activity stipulates the scale for P and E by having the group set it arbitrarily, rather than solving the problem of intertheoretic comparison. The facilitator must note that in a single agent's case, the agent doesn't get to arbitrarily choose the scale; the scale is a deep philosophical problem.

     Materials:

     - Role cards for each student, with:
          Theory name and description.
          The student's credence: 80% in this theory, 20% distributed equally among the other six.
          The choiceworthiness numbers for the four options (A, B, C, D) under that theory.
          For P and E: a note: "These numbers are on a scale that is not comparable to the other theories. The group must decide on a conversion factor and zero point to translate these numbers to the common scale of the other theories."

     - A handout explaining the four options.

     - Evidence envelope (if bought): contains a message about one of the near-duplicate pairs.

     - Random draw device for the correct theory.

     - Whiteboard for computing expected choiceworthiness.

     We'll go with this design.
