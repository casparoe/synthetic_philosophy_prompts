  We are designing a 90-minute activity for an upper-level undergraduate seminar on moral uncertainty. The goal is to make students feel the force of the aggregation problem (how to aggregate the verdicts of multiple moral theories when one is uncertain) through an interactive exercise.

  Key elements:
  - 18 students, each assigned a moral theory with a stated credence (subjective probability).
  - The group must issue a single recommendation among four concrete policy options in a dilemma.
  - Payoff: Each student earns points based on the chosen option and which theory is later revealed as "correct" (the revelation happens at the end).
  - Two built-in features to be discovered:
    1. Several assigned theories are near-duplicates (subtly different formulations of the same underlying view). This exposes the problem of theory individuation: if the group counts theories rather than weighing how sharply each discriminates, the near-duplicates can be gamed (by splitting one view).
    2. Two of the theories are to be compared on a shared cardinal scale, but the group must set the zero point and unit for that scale. The choice of scale alone flips the recommendation. This highlights the problem of intertheoretic comparison.

  - The group has the option to spend one round buying additional evidence at a cost (so deferral has a price).

  Structure:
  - Roles and Materials: Assign each student a moral theory and a credence. Provide a handout for each theory explaining its verdicts on the four options (in cardinal numbers, but for the two theories requiring a shared scale, the numbers are given without a fixed zero/unit).
  - Payoff Scheme: Each student's points are calculated as: 
    If the correct theory is revealed at the end, then the student gets a base point (say 100) multiplied by the credence they had in that correct theory, and then adjusted by the choiceworthiness of the chosen option according to the correct theory. Alternatively, we can simplify: the points are proportional to the choiceworthiness of the chosen option under the correct theory, weighted by the student's credence in that theory. However, note that the revelation of the correct theory is a random event (with probability equal to the group's aggregate credence? or we fix the correct theory in advance?).

