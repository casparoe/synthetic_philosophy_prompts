prompt: |-
  I need a joke for next month's social ontology reading group. The topic is David Lewis on convention, and I want the joke to actually be about his account rather than a generic "philosophers disagree, amirite" bit. Here's the machinery I want it to run on, in case it's hazy: for Lewis a convention is a regularity in everyone's behaviour in a recurring coordination situation where several different solutions would have worked equally well; each person conforms because they expect the others to conform and would rather coordinate than not; and the whole thing is held together by common knowledge — I know you'll do it, I know you know I know, and so on. The specific solution is arbitrary (which side of the road), it isn't an agreement or a moral norm, and it can come apart if expectations unravel.

  The second thing I want it to play against: the rival-ish picture where conventions aren't reasoned into at all but just evolve out of repeated local interaction — you bump into your neighbours, copy whoever's doing better, and a stable regularity settles in without anyone knowing anything about anyone's knowledge. On that story the norm is just an equilibrium that grew, and the common-knowledge stuff is a philosopher's idealisation that never actually holds anywhere.

  So: write me a short joke where those two pictures collide, and make the punchline turn on something real — the arbitrariness, or the infinite regress of "I know that you know that I know," or the fact that the Lewisian needs the very common knowledge the evolutionary type says nobody has. A two-hander between a Lewisian and a "it just evolved, mate" type arguing over who deserves credit for everyone standing on the left at the coffee counter is fine if you can make it land, but do whatever's actually funniest. Keep it tight, no real names or quotes needed, don't make me cite anything.

  After the joke, give me one section titled Why it lands, where it doesn't — 150 to 200 words — telling me which beat of the joke each bit of the Lewisian apparatus is doing, and fessing up about anywhere the joke fudges or overstates the view.
