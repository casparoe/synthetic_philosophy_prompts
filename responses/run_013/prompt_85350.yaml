  This connects to larger debates in welfare economics. The practitioners probably haven't fully confronted these philosophical tensions because the methods "work" for decision-making. But for someone concerned with distributive justice, the mismatch between the stated methodology and implied assumptions could be quite troubling. I should acknowledge that while the practice can continue with its current formulas, its ethical justification becomes much messier once we peel back the curtain.
answer: |-
  This practice embodies deep philosophical tensions between its stated methodology and its operational reality. Let's dissect the commitments:

  1.  **The Official Stance (Denial of Interpersonal Utility Comparison - IUC):**
      *   Economists claim they aggregate individual *willingness-to-pay (WTP)*, reflecting each person's *own* preferences for health/risk reduction traded against money.
      *   WTP is presented as an *ordinal* measure within an individual (Person A prefers health gain H over $X, but we don't know *how much* more they prefer it than Person B does).
      *   Aggregation (averaging WTP to get VSL, or using WTP surveys to inform a QALY threshold) is framed as a technical process of measuring revealed or stated preferences, not comparing the underlying "well-being" or "utility" those preferences represent across individuals.

  2.  **The Implicit Commitments (Where IUC Sneaks In):**
      *   **Uniform Thresholds Imply Commensurability of the *Good*, Not Just Preferences:** Applying a single £/QALY threshold or VSL value treats a QALY gained or a statistical life saved as having the *same social value* regardless of who receives it (except for the explicit severity adjustment). This presupposes that:
          *   A QALY is a meaningful, interpersonally comparable unit of health benefit.
          *   Preventing a statistical death is a meaningful, interpersonally comparable outcome.
          *   **While not *directly* comparing utility, it treats the *output* (health gain, risk reduction) as equally valuable *to society* across individuals.** This is a form of *interpersonal comparability of the good*, which is often a proxy for or implies a commitment to some comparability of welfare derived from that good.
      *   **The Money-Metric Defense Falters on Income Effects:**
          *   WTP is fundamentally constrained by ability to pay. A wealthy individual will exhibit a higher WTP for the same health gain or risk reduction than an identical poor individual due to the diminishing marginal utility of income.
          *   **Transferring WTP figures across people:** When you take the *average* WTP (VSL) or use WTP studies (often skewed towards higher-income participants) to set a uniform threshold (£/QALY), you implicitly treat £1 paid by a poor person as representing the *same sacrifice* (loss of utility) as £1 paid by a rich person. **This is a direct interpersonal comparison of the marginal utility of income.**
          *   **Result:** The uniform £/QALY threshold or VSL value derived from WTP inherently values the health or life of individuals with higher income/marginal utility of income more highly than those with lower income/marginal utility of income. The "money-metric" defense *absolutely* borrows comparability it officially disowns – specifically, comparability of the disutility of income loss.

  3.  **Severity Adjustment:** This explicit exception acknowledges that the *baseline* level of health matters. It implicitly accepts that restoring someone from a severe health state to a moderate one might be *socially* valued more highly than improving someone from a moderate state to full health, even if the QALY gain is identical. This further reinforces the commitment that the *social value* of a QALY is not fixed but depends on context (the recipient's situation), moving further away from pure individual preference aggregation.

  4.  **Could a Thoroughgoing Ordinalist Keep the Practice?**
      *   **Strict Ordinalism (No IUC, No Cardinal Utility):** A strict ordinalist, rejecting *any* interpersonal comparability of utility (even of marginal utility of income) and cardinal utility, **could not coherently endorse the *current justification* or the *current derivation* of the uniform thresholds.**
      *   **Reinterpretation as Social Choice Rules:** An ordinalist could *reinterpret* the practice. They might argue:
          *   The uniform threshold isn't about maximizing aggregate welfare, but is simply a *social decision rule* chosen for its perceived fairness, simplicity, or operational feasibility.
          *   VSL isn't the "value of life," but a pragmatic cost-effectiveness benchmark set by regulators based on historical spending or political consensus.
      *   **Consequence:** This requires **abandoning the official "preference aggregation" / "WTP represents individual value" justification.** The thresholds become externally imposed ethical or policy choices, not derived from individual preferences without interpersonal comparison. The practice *looks* the same (using £30k/QALY), but its philosophical foundation shifts entirely.

  5.  **Rejecting IUC: What Would *Force* Change?**
      *   **Derivation:** Rejecting IUC would force a change in *how the thresholds are derived*. Using average WTP or representative WTP studies would be philosophically illegitimate for a strict ordinalist, as it relies on the problematic income transfer/comparison. Alternative derivation methods (e.g., budget-constrained optimization without assuming utility comparability, or explicit social welfare functions with distributional weights) would be needed, or the threshold would have to be set purely as a policy parameter.
      *   **Application:** Rejecting IUC would *not* necessarily force abandoning *applying* a uniform threshold per se (it could be a rule), but it *would* undermine the rationale for *not* adjusting the threshold based on recipient characteristics like income or wealth. If the threshold is just a rule, arguments for equity adjustments become stronger. The severity adjustment might remain as a distinct rule.
      *   **Biggest Impact:** The rationale for *not* using distributional weights (e.g., weighting QALYs gained by the poor more heavily due to their lower marginal utility of income) would vanish if the WTP derivation is abandoned. Rejecting IUC actually *opens the door* to equity-based adjustments that the current WTP-based approach actively suppresses.

  **In Summary:**

  *   **The practice officially disowns interpersonal utility comparison (IUC).**
  *   **It implicitly relies on:**
      *   Interpersonal comparability of the *good* (QALY, statistical life saved) as a unit of social value.
      *   Interpersonal comparability of the *marginal utility of income* (by transferring/averaging WTP across people with different incomes).
  *   **The "money-metric defense" collapses** because WTP is income-dependent, and averaging it assumes £1 represents the same sacrifice for everyone.
  *   **A thoroughgoing ordinalist cannot accept the *current justification* (WTP aggregation) but could keep the *practice* by reinterpreting the thresholds as arbitrary social rules, not preference-based.**
  *   **Rejecting IUC would force a change in *how thresholds are derived*** (away from WTP averaging) and potentially strengthen arguments for applying distributional weights based on income/wealth, though it wouldn't *force* abandoning the uniform application rule itself.

  **The core tension:** The practice attempts a technocratic, preference-based aggregation to avoid ethical judgments. However, by using money as a measuring rod and applying uniform values, it unavoidably makes strong implicit ethical commitments: that a unit of health gain is equally valuable regardless of recipient (except severity), and that a pound sacrificed by the poor is equivalent to a pound sacrificed by the rich. These are substantive ethical positions disguised as neutral preference aggregation.
