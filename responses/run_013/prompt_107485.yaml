  The concrete scenario they propose—a solitary, rule-free activity being called a "game"—is perfect because it breaks typical game features while testing whether students grasp that meaning emerges from communal practice, not definitions. Their request includes very specific deliverables: a timed essay prompt, a model answer, and a detailed rubric with common pitfalls.

  I should avoid letting students just paraphrase PI §66-71. The key is making the question hinge on whether the checklist approach fundamentally misses Wittgenstein's point about language being grounded in forms of life. The model answer needs to show how the invented "solo wandering" example demonstrates that a checklist can't replace context-sensitive language use.

  For the rubric, the critical A/B differentiator should be whether students spot that the checklist itself is just another language game—it doesn't escape the need for training in practices. Students who merely contrast Wittgenstein with the checklist without explaining why forms of life are indispensable will cap at a B.
answer: |-
  Here’s a complete exam package designed to force engagement with Wittgenstein’s core insights beyond rote memorization:

  **Essay Question (45 minutes, no notes):**

  > "Imagine a new activity called 'Solemn Drift': a person walks alone through a city with no predefined goal, no rules to break, no winning/losing, and no interaction with others. Despite this, a community begins calling it 'playing Solemn Drift' and treats it as a game. Elsewhere, a theorist proposes that any activity possessing at least 3 of 6 features (e.g., competition, rules, skill, etc.) is objectively a 'game.'  
  >   
  > **Using Wittgenstein’s concepts of language-games and family resemblance, analyze:**  
  > (a) Does the community’s adoption of 'game' for Solemn Drift validate or challenge Wittgenstein’s view?  
  > (b) Can the theorist’s checklist settle whether Solemn Drift *truly* is a game?  
  > (c) What crucial work do *forms of life* and *training* do here that a feature checklist cannot?"

  ---

  **Model Answer (610 words):**

  The community’s calling Solemn Drift (SD) a “game” *exemplifies* Wittgenstein’s view rather than challenging it. For Wittgenstein, words like “game” gain meaning through their use in concrete social practices—language-games—not by reference to essential definitions. If a group genuinely integrates SD into their form of life *as* a game (e.g., saying “I’m going out to play SD,” distinguishing skilled from unskilled drifting, discussing “good SD spots”), then “game” functions correctly *within that language-game*. SD’s lack of rules or competition doesn’t invalidate this; Wittgenstein’s point is precisely that no single feature (rules, competition, fun) is necessary. Family resemblance shows how concepts extend via overlapping similarities, not universal criteria. Tennis resembles chess via rules, chess resembles ring-a-ring-a-roses via participation, and SD might resemble *flanerie* or meditation-as-play within its community. Meaning is context-bound: if SD satisfies the role “game” plays in *their* practices, it *is* a game for them.

  The theorist’s checklist fundamentally *misunderstands* Wittgenstein’s project. Checklists seek an objective, context-free definition—exactly what Wittgenstein argues is impossible and philosophically misleading for concepts like “game.” Whether the checklist “includes” SD depends entirely on the theorist’s *choice* of features, which is itself arbitrary. Why 3 out of 6? Why those specific features? Wittgenstein would note that *creating the checklist is itself a language-game*, one divorced from the actual use of “game” in diverse communities. A checklist cannot “settle” SD’s status because:  
  1. **It ignores use**: If the community uses “game” for SD, no checklist can overrule their practice.  
  2. **It assumes essence-by-proxy**: Reducing family resemblance to a mechanical algorithm (“tick 3 boxes”) reintroduces the craving for determinacy Wittgenstein rejects.  
  3. **It is circular**: Selecting features relies on prior, unexamined intuitions about games rooted in *familiar* forms of life.  

  The appeal to **forms of life** and **training** is Wittgenstein’s antidote to checklist-thinking. A form of life is the shared background of behaviors, reactions, and customs that make language-games intelligible. Training initiates participants into these practices, teaching not definitions but *how to go on*. This explains:  

  *   **How SD becomes a game**: New members aren’t given a definition; they’re trained (“This is how we drift seriously… watch James, he’s good at *playing* it”). They learn to see certain movements as “skillful drifting,” certain paths as “interesting for SD,” absorbing the practice holistically.  
  *   **Why checklists fail**: Checklists are static and decontextualized. They cannot capture the fluid, lived practice of a language-game. Knowing a checklist doesn’t equip you to *participate* in SD or understand when its use is apt. Training in a form of life does.  
  *   **The “cluster concept” misconception**: Listing features (even flexibly) still implies meaning resides in properties. For Wittgenstein, meaning resides in *use within a practice*. The student who sees family resemblance as “tick 4 of 7 boxes” reduces it to a looser essentialism. Wittgenstein shows meaning is *constituted* by the game itself, not properties.  

  The philosopher-of-sport’s definition (“voluntarily taking on unnecessary obstacles”) suffers the same flaw as the checklist. It might describe *some* games but ignores others (e.g., ring-a-ring-a-roses lacks “obstacles”). More crucially, it’s just *another proposal within a language-game* (philosophical debate), not a discovery that “games have an essence after all.” Its existence doesn’t refute Wittgenstein; it confirms his point that meaning is use-dependent: in *this* theorist’s game, “game” has that definition. It cannot invalidate the community’s use of “game” for SD. Wittgenstein doesn’t deny useful descriptions; he denies they uncover trans-contextual essences.  

  Ultimately, Solemn Drift reveals that “game” isn’t defined by features but by its integration into a living practice. Forms of life and training provide the framework for understanding meaning as dynamic and communal, making checklists and definitions appear as what they are: abstract, disconnected moves in a different game.

  ---

  **Marking Scheme (20 marks total) & A/B Differentiation:**

  | **Must-Hit Point (MHP)**                     | **Marks** | **Common Error (How Students Get It Wrong)**                                    |
  | :------------------------------------------ | :-------- | :----------------------------------------------------------------------------- |
  | **1. Community use validates Wittgenstein** | 4         | Claims SD *disproves* W. because it lacks features; ignores meaning-as-use.    |
  | **2. Checklist = essence-seeking mistake**  | 4         | Praises checklist for "clarifying" games; misses W.’s rejection of definitions. |
  | **3. Forms of Life > Features**             | 4         | Mentions forms of life but doesn’t explain *how* they ground meaning beyond features (e.g., training, shared reactions). |
  | **4. Critique of "cluster concept" view**   | 4         | Equates family resemblance with "flexible definition" (e.g., "tick 3 boxes").  |
  | **5. Theorist’s definition doesn’t refute W.** | 4       | Assumes a successful definition = Wittgenstein "wrong."                        |

  **A vs. B Differentiation:**  
  - **B-Grade (Solid, 12-16/20):** Accurately contrasts Wittgenstein with checklist/cluster views using Solemn Drift. Explains meaning-as-use and why SD *can* be a game.  
  - **A-Grade (Top, 17-20/20):** **Explicitly identifies the checklist *itself* as a language-game** (MHP 2 & 3). Articulates how *training* embeds concepts in forms of life, making feature-lists secondary/circular. Explains why the philosopher-of-sport’s definition is *just another move* within philosophy’s language-game, not an "essence."  

  ---

  **Why this works:**  
  1. **Blocks Parroting:** Solemn Drift forces application. Students *must* confront a borderline case and explain W.’s position *in response*.  
  2. **Targets Misreadings:** Directly addresses the "cluster concept" and "definition refutes W." errors as core tasks.  
  3. **Forces Depth:** Requires explaining *why* forms of life/training are indispensable (MHP 3 & A-Grade move) – not just naming them.  
  4. **Clear Differentiation:** The A-grade move (checklist as language-game) requires meta-awareness of how definitions function within practices, separating mechanical understanding from deep grasp.  
  5. **Real Philosophy:** Models how Wittgenstein dissolves philosophical problems by shifting focus from "What is X?" to "How is this word *used*?"
