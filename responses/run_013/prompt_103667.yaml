  ### Key Design Notes:
  1. **Target Distinction as Spine**: Each question emphasizes a target (content, causal role, or phenomenal character) in the case description and options. For example:
     - Content: Tip-of-tongue (q4), Belief update (q9)
     - Causal Role: Split-brain (q2), Externally triggered movement (q6)
     - Phenomenal Character: Refrigerator light (q3), Pain report (q7)

  2. **Discrimination Logic**: Each option discriminates positions along one axis (mechanism, reliability, authority) while implicitly engaging the target. For instance:
     - q1 Option A contrasts *direct* (state causes report) vs. *inferential* (report fabricated) on **mechanism**.
     - q3 Option A contrasts *direct* (phenomenology always accessible) vs. *skill* (reliability requires attention) on **reliability**.

  3. **Scoring Key**: Patterns map to positions via dominant tendencies (e.g., consistent "A" in mechanism-related questions → *inferential*). "Mixed" defaults to *skill* due to its contextual flexibility.

  4. **Inseparable Pairs**: 
     - *Transparent* and *direct* overlap on content reports but diverge on other targets.
     - *Skill* and *deflationary* both reject intrinsic reliability but disagree on skill as a special faculty.

  5. **Empty Cells**: Highlight conceptual tensions (e.g., direct+unreliable+privileged is incoherent).

  This quiz surfaces how disagreements stem from conflating mechanisms, reliability, authority, and targets—without invoking specialized terminology or researchers.
