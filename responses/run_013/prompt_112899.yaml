prompt: |-
  I need a teaching plan for a single session on a question in the philosophy of mind — the plan, not the content, and not an argument for a position. The question is whether symbols push the substrate around.

  Here is the device I mean to build the session on. Picture a vast shallow arena, a billiard table the size of a football pitch, across which an enormous number of small magnetic marbles — call them simms — careen at random, each obeying a handful of simple mechanical and magnetic rules. Simms collide, cling, and separate; clumps grow, break apart, and re-form. Now pull back. At that distance you no longer see individual marbles, only larger and comparatively stable clusters — simmballs — and the simmballs exhibit regularities invisible at the level of the simms: certain kinds recur, certain kinds reliably follow certain others, and, if the walls of the arena change their bounce in step with events outside it, certain kinds of simmball come to track those events. The simmballs even seem to act on one another, one cluster's appearance seeming to summon or suppress another. Read the simmballs as symbols or concepts and the simms as a neural substrate, and the arena becomes a brain. The question the session exists to pose: when the simmball-level description is true and predictive, do the simmballs — the symbols — push the simms around, or is all the pushing done by the simms, with the symbols an idle gloss on the physics?

  The audience is a graduate reading group in cognitive science: neuroscientists, machine-learning people, and philosophers of mind, none of whom works on causation. They are fluent in the idea that one system admits descriptions at more than one grain, and for that very reason they will treat causal talk as unproblematic. I have seventy-five minutes, a whiteboard, and no assigned reading.

  Give me the plan. Specifically:

  1. The order. Establish the sequence in which the pieces must be introduced, and why each depends on the one before it — down to the assumption that has to be conceded before the question even becomes intelligible. I suspect the hard part is not the careenium but something that must first be settled about what makes a description true, or projectible, or explanatory, and I want you to tell me whether that is right, where it belongs, and where the session's real pivot falls.

  2. The carrying example. The careenium is meant to carry the whole session; tell me what it must have and what it must lack for that to work. Then tell me whether it is in fact the right carrier, or whether some more mundane case — a chess engine, a market, an ant colony — should do the load-bearing work, with the careenium demoted to a closing flourish. If the careenium stays, say which of its features I must keep and which I can drop without loss.

  3. The misconceptions. They will bring some and form others. My provisional list: that a higher-level description must be either a useful fiction or a mysterious addition, never simply another true description of the same thing; that if the micro-story is complete, the symbol-level story is idle; that causal talk at two levels has to be a competition, so exactly one level is the real cause; and that symbol-level causation would require a symbol to exert a force on a marble. Give me the full list in the order it will surface, and for each, the exact point in the sequence at which I should head it off — and, where it matters, the point at which I should deliberately let it stand for a while so that a later step dissolves it rather than a reminder pre-empting it.

  4. The check. One question or task, at the end, that tells me whether they have understood the question rather than merely memorised a position — whether they now see what the two answers disagree about.

  5. What to leave out, and what I should say aloud that I am leaving out, given this audience and this much time.

  Do not give me readings, and do not simply answer the question on my behalf; I have a view of my own, and what I need is the plan for getting them to it.
reasoning: |-
  Okay, let me approach this systematically. The user wants a teaching plan focused on the structure of a single session about whether symbols causally influence their physical substrate, using the careenium (magnetic marbles) as a central device. 

  First, I need to identify the core challenge: making abstract metaphysical questions about causation tangible for an interdisciplinary group. The audience's fluency in multiple grain descriptions is helpful but may lead them to overlook the precise philosophical puzzle about causal efficacy. The real pivot likely concerns what makes a description explanatory rather than just predictive.

  For the sequence, I consider starting with a concrete example like traffic patterns to establish that higher-level patterns can be real without being "additional" entities. This creates common ground before introducing the careenium. The crucial step is distinguishing predictability from explanatory power - that's where the question becomes intelligible.

  The careenium itself needs specific features to work: 
  - Magnetic interactions to allow self-organization
  - Scale large enough for emergent patterns
  - Observable pattern stability
  But I can simplify the "external tracking" aspect initially to avoid overcomplication.

  Potential misconceptions will arise in predictable order:
  1. Early on: "Higher levels are just useful fictions"
  2. Mid-session: "Complete micro-story makes macro idle"
  3. Later: "Causal competition requires one real level"
  I should let the second misconception stand temporarily until the predictability/explanatory distinction dissolves it.

  For the understanding check, I'll design a task where they must identify which changes in the careenium would challenge each view. This tests grasp of the disagreement rather than position recall.

  Key omissions to state explicitly: 
  - No resolution of mental causation
  - No commitment to reductionism/emergence
  - No analogy to consciousness
  This keeps focus strictly on the causal question.

  The plan should flow from concrete to abstract, with the careenium doing heavy lifting only after establishing foundational concepts through simpler examples. The traffic case serves as training wheels before the complex model.
answer: |-
  Here is a teaching plan designed to achieve your specific goals. The structure prioritizes conceptual sequencing, misconception management, and ensuring the core question lands with clarity, using the careenium as the primary device.

  **Core Pedagogical Strategy:** Build the question *from the ground up*, forcing engagement with the *conditions* under which it becomes meaningful. The pivot is establishing that **predictive success does not automatically entail explanatory relevance**, and that the *explanatory role* of the symbol-level description is what's contested.

  **Session Plan: 75 Minutes**

  1.  **Framing & Common Ground (10 mins)**
      *   **What:** State the session's narrow focus: "Today, we're dissecting *one specific question* about causal explanation in multi-level systems, using a toy model. We're *not* resolving it, just rigorously posing it."
      *   **Why:** Sets boundaries, manages expectations.
      *   **Establish Key Premise:** "We all agree complex systems can be described at multiple levels of abstraction (neural spike trains vs. cognitive states; transistor flips vs. software instructions). These descriptions can *both* be true descriptions of the *same underlying physical system*." (Whiteboard: "Levels of Description: Both True?")
      *   **Head off Misconception 1 (Useful Fiction/Mystical Addition):** Immediately contrast: "This *isn't* about fictionalism (higher levels as mere tools) or mysticism (higher levels as non-physical additions). We're assuming both levels describe the same physical reality." *State this explicitly.*
      *   **The Careenium Introduction (Brief):** Sketch the arena, simms (magnetic marbles), basic rules (collide, cling via mag, separate). Emphasize vast scale, randomness at micro-level. *Do NOT introduce simmballs or symbols yet.*

  2.  **Levels Emerge & Their Utility (15 mins)**
      *   **Pattern Recognition:** "Imagine watching this chaos. Close up, it's just simms colliding. But pull back... what might you start to *see* over time?" Elicit ideas: clumps, recurring shapes, patterns of movement. *Then* introduce **simmballs** as stable, recurring cluster *types* observed at this macro-scale.
      *   **Predictive Power:** Introduce key features:
          *   **Recurrence:** Certain simmball types appear repeatedly.
          *   **Regular Sequences:** "Simmball type A often reliably precedes simmball type B appearing elsewhere."
          *   **Tracking:** "Suppose the arena walls subtly change their 'bounce' property based on an outside event (e.g., a light turns on). Over time, the *distribution* or *timing* of certain simmball types might reliably correlate with that external event." (Whiteboard: Simm Level vs. Simmball Level columns).
      *   **Why Bother?** "The simmball-level description is *predictively powerful*: it lets you forecast future simmball states/sequences and track the environment *far more efficiently* than tracking every simm. It compresses the chaos." *Concede this readily.*
      *   **Head off Premature Idleness:** If "idle gloss" comes up, note: "It's clearly *useful* for prediction. The question is whether that usefulness translates to a specific kind of *explanatory* role."

  3.  **The Pivot: From Prediction to Explanation & Causation (20 mins)**
      *   **The Explanatory Claim:** "Now, we interpret the simmballs as *symbols* or *concepts*. The sequence 'A then B' might be interpreted as 'Concept A activates Concept B'. The tracking might be 'Simmball S means LIGHT-ON'. The simmball-level description seems to *explain why* the system behaves as it does *in cognitive terms*."
      *   **Introduce the Core Question:** "Here's the crux: When this symbol-level description is predictively successful and tracks the world... does this mean the *symbols themselves* (the simmball states and transitions) are playing a causal role in the system's behavior? Do the *symbols push the simms around*? Or, is all the *real* causal work *only* happening at the simm level, governed strictly by the magnetic/mechanical rules, with the symbol-level being just a compact summary – an 'idle gloss' on the underlying physics?"
      *   **Clarify "Push":** "By 'push around', we mean: Do the symbol-level patterns/relationships *themselves* figure in the *causal explanation* of the system's dynamics? Are they *explanatorily relevant*?" (Whiteboard the question clearly: "Do symbols (simmballs) causally explain simm dynamics? Or is simm physics the *only* causal story?")
      *   **Head off Misconception 4 (Force Exertion):** Preemptively state: "Crucially, NO ONE is suggesting symbols magically exert new physical forces on simms. The simms only follow physical laws. The question is about the *causal structure of the explanation* – is the symbol-level pattern *itself* a causally relevant factor, implemented *by* the microphysics, or just a *consequence*?"
      *   **Let Misconception 2 stand (temporarily):** If someone argues "Complete micro-story -> Macro idle", *don't* refute yet. Note: "That's precisely one side of the debate. But remember, the macro story *is* predictively useful. Does that usefulness *require* it to be causally explanatory, or is efficiency enough?"

  4.  **Deepening the Tension: Why it's Not Obvious (15 mins)**
      *   **The Case for Symbols Pushing:**
          *   "The symbol-level patterns exhibit robust, counterfactual-supporting regularities: *If* simmball A hadn't formed, simmball B *wouldn't* have formed there next (even though the exact simm paths differ). The patterns seem to 'constrain' the micro-events."
          *   "The *only* way to efficiently *explain* why the system tracks the environment is by referencing the *meaning* assigned to the simmball patterns (e.g., 'It formed S because the light came on')."
          *   "The system's behavior is *sensitive* to the symbol-level relationships, not just the micro-rules in isolation." (Use whiteboard to sketch how changing a *symbolic* rule – e.g., what follows A – would require massive micro reconfiguration).
      *   **The Case for Simms-Only Pushing:**
          *   "Every simmball formation, transition, and environmental response is *fully determined* by the initial conditions, positions, velocities, and magnetic interactions of the simms, governed by physics. Add nothing."
          *   "The predictive power of the symbol level is *derived entirely* from the underlying physics. It's an emergent *effect*, not a cause."
          *   "Any apparent 'constraint' by symbols is an illusion; it's just the micro-dynamics playing out. The counterfactuals are true *because* of the micro-dynamics." (Reinforce: Symbols exert no force).
      *   **Highlight the Disagreement:** "Both sides agree on the physics and the predictive success. They disagree on *what explains the system's organized, adaptive behavior*: Is the symbol-level pattern *itself* a key part of the causal story, or is it merely a *description* of the outcome of micro-causes?"

  5.  **The Check: Testing Understanding of the Question (10 mins)**
      *   **Task:** "Imagine we observe a *new* phenomenon in the careenium: A specific, rare simmball configuration (call it X) *always* precedes a dramatic, system-wide 'reset' – simms fly apart, then slowly reform. Both levels predict it. Now, pose the question *specifically about X and the reset* in a way that captures the *disagreement* between the two views."
      *   **Why it Works:** Forces them to:
          1.  Apply the core question to a new instance.
          2.  Articulate the *explanatory* disagreement: "Does X (the symbol) causally explain the reset, or is X just a micro-determined precursor, with the reset caused solely by the specific simm interactions leading to it?"
          3.  Avoid simply stating positions; they must formulate the *point of contention*.
      *   **Listen For:** Clarity on whether the disagreement is about prediction (it's not), physical forces (it's not), or causal explanation/role of the pattern itself.

  6.  **Wrap-up & Explicit Omissions (5 mins)**
      *   **Re-state the Question:** Clearly reiterate the "push around" question as concerning causal *explanation*.
      *   **What We Left Out (Say Aloud):**
          *   "We did *not* resolve the question. We rigorously posed it."
          *   "We did *not* discuss consciousness, qualia, or the 'hard problem'."
          *   "We did *not* delve into technical theories of causation (e.g., interventionist, process). We relied on an intuitive notion of causal explanation."
          *   "We did *not* explore specific arguments *for* or *against* either position in detail (that's for you to debate!)."
          *   "We assumed the symbol-level mapping is valid and predictive. We didn't debate how such mappings arise or are justified."
      *   **Final Thought:** "The core challenge is this: Can patterns that are undeniably real, predictive, and implemented *in* physics, nevertheless be *causal explainers* in their own right? Or is physics always the exhaustive explainer?"

  **Why the Careenium is the Right Carrier (and How to Use It):**
  *   **Strengths:** Visually intuitive, clearly separates micro/macro, forces consideration of scale/emergence, makes "symbols" non-mysterious (they're just patterns), embodies the core tension perfectly. Its artificiality is a *feature*: it avoids baggage from real-world examples.
  *   **Must Keep:**
      *   **Micro-Randomness/Complexity:** Simms must move chaotically according to simple rules.
      *   **Macro-Stability/Regularity:** Simmballs must be identifiable, recurring patterns.
      *   **Macro-Regularities:** Reliable sequences and tracking are essential to motivate the symbolic interpretation.
      *   **Scale:** The vastness makes the macro-level necessity clear.
  *   **Can Drop:**
      *   **Specific Physics:** Magnetic vs. other forces doesn't matter. Just need local interactions enabling clustering.
      *   **Exact "Tracking" Mechanism:** The wall-bounce detail is illustrative; the core is correlation between macro-patterns and external state.
      *   **"Acting on" Language:** Focus on sequences and constraints, avoid potentially misleading anthropomorphism initially. Introduce carefully later.
  *   **Mundane Examples (Chess, Market, Ants):** Use these *only* if the careenium stumbles badly. They carry too much conceptual baggage (intentionality, agency, evolution) that can obscure the core metaphysical question about causal explanation and patterns. The careenium's artificial purity is superior. Use mundane examples *after* the core question is clear, as potential analogies for discussion *later*.

  **Full Misconception List & Management:**

  1.  **Higher-Level = Useful Fiction OR Mystical Addition:** *Head off IMMEDIATELY* in Step 1. Explicitly state the "both true descriptions" assumption.
  2.  **Complete Micro-Story -> Macro Idle (Epiphenomenalism):** *Let stand initially* when first raised (likely in Step 2/3). *Dissolve in Step 4* by contrasting predictive efficiency with causal explanatory relevance. Argue that predictive power *might* imply explanatory role, but doesn't *necessarily*.
  3.  **Causal Competition (Only One "Real" Cause):** *Let emerge* during Step 4 discussion. *Address explicitly* when framing the disagreement: "This isn't necessarily winner-takes-all. Proponents of symbol causation usually argue it's *implemented by* micro-causes, not competing with them. The question is whether the pattern *itself* is explanatorily relevant *in addition to* the micro-dynamics."
  4.  **Symbol Causation Requires Force Exertion:** *Preempt in Step 3* when defining "push around". Explicitly state symbols don't add forces; it's about explanation.
  5.  **"But in Real Brains/Computers..." (Demanding Realism):** *Manage as needed:* Gently remind that the careenium is a *model* isolating the conceptual issue. Real systems add complexity but the core question remains. (Save for Q&A if possible).
  6.  **Confusing Prediction with Causation/Explanation:** This is the *core* misconception the whole plan is designed to combat. *Pivot explicitly in Step 3* ("The question is about the causal structure of the *explanation*"). Constantly reinforce the distinction throughout Steps 3 & 4.
  7.  **Assuming Intentionality/Meaning is Primary:** *Avoid/Minimize:* Frame symbols as patterns with assigned interpretations (tracking), not inherently intentional. Focus on patterns and regularities first, meaning ascription second.

  **The Real Pivot:** The pivot occurs definitively in **Step 3**. Establishing the predictive success of the simmball level (Step 2) is necessary but insufficient. Step 3 forces the crucial move: **Does predictive success (and tracking) imply that the symbol-level patterns are *causally explanatory* ("pushing") or merely descriptive of the outcome ("gloss")?** This shifts the focus from description to *causal relevance within explanation*. The key conceded assumption *before* the question becomes intelligible is the **reality and predictive utility of the higher-level description (simmballs/symbols)**. The question *presupposes* this and asks about its *explanatory status*.
