  **Justification for 11/20:** The student demonstrates a very good understanding of Keynes's core framework (logical relations, weight, uncertainty vs risk) and applies it well to positions (i) and (ii), earning 7-8 points there. However, the catastrophic misapplication to position (iii) and the resulting cascading errors in discussing the decision implications and the theory's limits cost 9 points. The additional point reflects the quality of writing and grasp of fundamentals evident in the correct sections. The final score signifies a competent understanding of the textbook concepts but a significant failure to correctly extend the apparatus to the novel challenge of an incomplete outcome space (iii), which was the crux of the question.
