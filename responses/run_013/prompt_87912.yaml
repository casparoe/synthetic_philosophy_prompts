prompt: |-
  I am a high school student preparing a presentation for my philosophy club, and I need a thought experiment built to order. I want to contrast two views about knowledge and practical stakes. As I understand them, epistemic contextualism says that whether a knowledge attribution is true depends on the attributor's conversational context, including what is at stake for the attributor; pragmatic encroachment says that whether a subject knows depends on the subject's own practical stakes. If my characterizations are wrong in a way that makes the task impossible, correct them and then continue.

  Please construct one realistic high school case with two variants, in which these two views give opposite verdicts about whether a particular student knows a particular mundane, checkable proposition. Specifications: the student's evidence and the truth of the proposition are identical in both variants; nothing about the facts changes; there is no skeptical scenario, no lottery, no fake barn, and no brain in a vat; the only variable that shifts is whose practical stakes are high. In the first variant, the student's own stakes are low, while the person attributing knowledge to her is in a high-stakes context; in the second, the student's own stakes are high, while the attributor is in a low-stakes context. The high stakes should be vicarious where possible: the attributor's risk falls on someone else she is advising, not on herself. The student should not be aware of the stakes in the variant where her stakes are high, if you can make that coherent; if you cannot, say why and adjust the case. The case should not be the standard bank case or a thinly renamed version of it.

  After the scenario, walk through what each theory says in each variant and why. Then tell me which feature of the case is doing the work, what happens if that feature is removed, and how a defender of each theory would attack the case. Please say how confident you are in the verdicts you attribute to the theories and identify the point you are least sure about.
