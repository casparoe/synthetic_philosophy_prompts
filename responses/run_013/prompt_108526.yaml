answer: |-
  Here’s your Q&A battle plan, optimized for survival. Prioritized by threat level (likelihood × damage potential), with replies designed for verbal delivery:

  ---

  ### **Top Priority: Must-Nail Replies**
  1.  **From Dynamic Semantics Group (Scoreboard Challenge)**  
      *Likely Phrasing:* "This 'norm' just recapitulates the update rules we model with conversational scoreboards. Why posit an extra layer of normativity when we can explain all this in terms of what commitments an assertion *actually* adds to the common ground?"  
      *Your 90s Reply:*  
      "Because the scoreboard tracks *what is accepted*, not *what should be*. When I assert falsely but you blindly accept it, the scoreboard updates flawlessly — yet I’ve violated the norm. The norm governs whether I *may* trigger that update in the first place. It’s about the speaker’s responsibility *before* the score changes, not the mechanics of the change itself. Your model describes the fallout; my norm sets the conditions for licitly causing it."  
      *Weakness:* Doesn’t fully address whether "responsibility" can be reduced to update-potential in a richer dynamic model.

  2.  **From Knowledge Norm Epistemologists (Lottery Case Ambush)**  
      *Likely Phrasing:* "You say knowledge isn't necessary. But if I say 'Your ticket lost' based on the odds, I *can* answer for your reliance by refunding you if you win — yet intuitively, asserting that is still impermissible! Doesn’t this show knowledge *is* required?"  
      *Your 90s Reply:*  
      "Not at all. Your assertion licenses reliance *on the ticket being a loser* — but in lottery cases, the audience isn’t entitled to rely on that! The probabilistic evidence doesn’t *entitle* them to burn the ticket or bet their life. My norm forbids your assertion because it licenses reliance the audience *shouldn’t* have. Knowledge fails here because you don’t know it lost; my norm succeeds by tying permissibility to the audience’s actual entitlements, not your state."  
      *Weakness:* Relies on contestable intuitions about what reliance is "licensed" in lottery cases.

  3.  **From Law-Philosophy Colleague (Indemnity as Warranty)**  
      *Likely Phrasing:* "This 'bearing costs' sounds like a strict liability warranty. But warranties can be disclaimed, assigned, or insured around. If assertion is a normative act, is this obligation *inalienable*? And does fault matter? If I assert in good faith but am wrong, must I still pay?"  
      *Your 90s Reply:*  
      "It’s strict liability to *that hearer*, but not alienable. You can't outsource your answerability when *you* asserted. Think tort, not contract: If I shove you, causing you to break a vase, I owe compensation to the owner even if I meant no harm. Asserting imposes immediate relational duties. Good faith isn’t irrelevant — it affects *how* you answer (apology vs. restitution) — but the core obligation to make whole holds. The 'cost' is contextual: sometimes just retraction, sometimes material."  
      *Weakness:* "Making whole" is underspecified for epistemic harms (e.g., reliance on a false belief).

  ---

  ### **High Risk: Handle with Care**
  4.  **From Experimental Pragmatics Grad Students (Empirical Evidence)**  
      *Likely Phrasing:* "How would we test this? People don’t usually demand compensation for false assertions. Does your norm predict behavior we don’t observe?"  
      *Your 90s Reply:*  
      "Test the *entitlements*, not the payouts. My view predicts: (1) Audiences will judge assertions improper when they *wouldn’t* rely on them (e.g., "It might rain" vs. "It won’t rain" when planning a picnic), and (2) Speakers will hedge more when audience stakes are high *even if they know P*. Look at patterns of disclaimers — "Don’t quote me!" signals the speaker refusing to underwrite reliance. Existing data on stakes-sensitivity in assertion supports this."  
      *Weakness:** Actual compensation demands are rare; the norm may govern judgments more than actions.

  5.  **From Knowledge Norm Holdout (Sufficiency Challenge)**  
      *Likely Phrasing:* "If I know P, and my audience is entitled to rely on P, why isn’t my assertion always permissible? Your view allows cases where I know P but refuse to 'bear costs' — that seems absurd!"  
      *Your 90s Reply:*  
      "Knowledge isn’t a forcefield against bad luck. If I know your flight is on time but lack resources to cover your missed connection, asserting "Your flight is on time" *is* reckless if you’d stake $10k on it. Knowing P means I’m *likely* able to answer for reliance, but if I can’t *actually* bear the cost — say, I’m bankrupt — I shouldn’t assert. The norm is about capacities and commitments, not just truth-tracking."  
      *Weakness:** Intuitively, knowing seems sufficient for low-stakes assertions; this overcomplicates.

  ---

  ### **Strategic Concessions in Opening Remarks**
  *   **Concede:** "I’m not claiming dynamic semantics is *wrong* — it’s a powerful tool for modeling *how* assertions update discourse. My target is the claim that this exhausts the normativity of assertion. My hearer-facing norm explains *why* those update rules feel binding."
  *   **Why:** Neutralizes the "why fight us?" pushback from dynamic folks early. Framing as complementary softens resistance.

  ---

  ### **The Make-or-Break Exchange**
  *   **The Critical Question (From Dynamic Semantics or Law Focus):**  
      "If the norm depends on *actual* audience entitlements and capacities to pay, doesn’t that make assertion permissibility hopelessly subjective and variable? How can we ever generalize?"  
      *Why it’s pivotal:* If you can’t show your norm isn’t ad hoc, your theory collapses into context-bound chaos.  
      *Your Winning Reply:*  
      "It *is* context-bound — and rightly so! We already accept that 'Is this relevant?' depends on shared goals. My norm reflects that assertions are *tools for coordination*. Generalizations arise because testimonial economies standardize entitlements: In science, you’re entitled to rely on peer-reviewed claims; at a bar, on football scores. The norm is objective within a context: Given *these* hearers’ entitlements and *this* speaker’s capacities, was asserting proper? That variability is why speaker-side norms fail."

  ---

  ### **The Question You Hope Nobody Asks**
  *   **The Multi-Party Trap:**  
      "What if I assert P to a group where one hearer is entitled to rely (e.g., a colleague) and another isn’t (e.g., a spy)? Must I bear costs for both? Can I assert permissibly to one but not the other *simultaneously*?"  
      *Why it’s deadly:* Your norm is clearest in dyads. Group dynamics force messy distinctions (e.g., "direct" vs. "overhearer" entitlements) that feel grafted on.  
      *Salvage Strategy:* "The norm binds you to those *you intend to address* or *reasonably foresee* relying. The spy isn’t a participant in the testimonial exchange you’re governing. But yes, this needs refining — it’s a frontier, not a bug."

  ---

  **Final Advice:** Open by conceding the descriptive power of scoreboard dynamics. Your survival hinges on forcing the epistemologists to engage your *relational* model head-on — don’t let them retreat to "knowledge in the head." If the law colleague nods during your indemnity reply, you’ve banked credibility. Good luck — they won’t pull punches.
