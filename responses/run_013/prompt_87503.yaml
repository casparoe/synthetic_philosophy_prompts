answer: |-
  ### Activity Design: "The Paradox Gambit"  
  **Objective:** Illustrate how the principle of maximizing expected value (EV) leads to accepting an absurd gamble with a vanishingly small probability of an astronomically large payoff. Students will unwittingly adopt EV maximization, then confront a lottery that exposes its flaws.

  ---

  ### **Rules & Materials**  
  **Materials Needed:**  
  - **Projector** (display lotteries, instructions, and real-time updates).  
  - **Printed Materials**:  
    - **Decision Rule Cards** (index cards for students to write their policies).  
    - **Lottery Choice Sheets** (for recording decisions in each round).  
    - **Score Trackers** (individual sheets to tally points; see scoring below).  
  - **Random Draw Tools**: 10-sided dice (or a phone RNG app) for lottery outcomes.  
  - **Final Prize**: A "Golden Ticket" redeemable for **"The instructor will personally bake and deliver a custom dessert of your choice to the next class, themed after any philosopher/economist you name."** (Non-monetary, experiential, and resistant to quantification.)  

  **Game Rules:**  
  1. **Decision Rule Commitment**: At the start, each student writes a one-sentence policy on their card (e.g., "Always choose the option with the highest EV"). Rules are collected and displayed anonymously.  
  2. **Lottery Rounds**: Students face sequential lotteries. For each:  
     - Options are displayed via projector.  
     - Students silently choose A or B on their sheets.  
     - Outcomes are determined by random draw (e.g., dice roll).  
  3. **Scoring**:  
     - Points represent "decision points" (DP). No real money.  
     - **Starting DP**: 100 (to buffer losses).  
     - **DP → Prize Conversion**: The winner’s DP determine the *scale* of their prize (e.g., 500+ DP = dessert + a book; 200–499 DP = dessert only; <200 DP = bragging rights). This creates stakes through competition and exclusivity.  
  4. **Trap Trigger**: The final lottery uses student-written rules. Anyone whose policy mandates choosing the absurd gamble must publicly defend it.  

  ---

  ### **Timeline (90 Minutes)**  

  #### **Phase 1: Setup & Rule Commitment (10 min)**  
  - **0–5 min**: Introduce the game.  
    - *"Today, you’ll make real choices with scoring consequences. Your goal: maximize DP. The highest scorer wins a custom prize."*  
    - Explain scoring and the **Golden Ticket** (emphasize its experiential nature).  
  - **5–10 min**: Rule writing.  
    - *"Write a one-sentence policy you’ll apply to every lottery. E.g., ‘Maximize EV,’ ‘Avoid losses,’ or ‘Follow intuition.’ Be precise—your rule binds you."*  
    - Collect cards, shuffle, and project anonymized rules.  

  #### **Phase 2: Initial Rounds—Building Confidence (30 min)**  
  *Goal: Students use EV maximization for sensible choices, reinforcing trust in the principle.*  
  - **Round 1 (10–15 min)**: **Safe vs. Positive EV Gamble**  
    - A: 100% chance of 50 DP.  
    - B: 80% chance of 70 DP, 20% chance of 0 DP. (EV: 56 DP)  
    - *Draw:* Roll d10; 1–8 = B wins, 9–0 = B loses.  
    - *Discussion (2 min):* "Why did most choose B? EV guided us well."  
  - **Round 2 (15–25 min)**: **Loss Aversion Test**  
    - A: 100% chance of 100 DP.  
    - B: 60% chance of 200 DP, 40% chance of -50 DP. (EV: 100 DP)  
    - *Draw:* d10; 1–6 = B wins, 7–0 = B loses.  
    - *Discussion (3 min):* "EV is equal, but did emotions sway you?"  
  - **Round 3 (25–40 min)**: **EV Dominance**  
    - A: 100% chance of 20 DP.  
    - B: 5% chance of 500 DP, 95% chance of 0 DP. (EV: 25 DP)  
    - *Draw:* d20; 1 = B wins (5%), else B loses.  
    - *Discussion (5 min):* "B has higher EV, but its riskiness made some hesitate. Still, EV is reliable."  

  #### **Phase 3: The Trap Lottery (15 min)**  
  - **40–45 min**: Introduce the trap.  
    - A: 100% chance of 100 DP.  
    - B: **1 in 10 million chance of 10 billion DP**, 99.99999% chance of 0 DP. (EV: 1,000 DP)  
    - *Crucial framing:* "This lottery is administered by a verified algorithm (show RNG code snippet via projector). The odds are exact—not metaphorical."  
  - **45–50 min**: Force commitment.  
    - *"Apply your written rule. If it says ‘maximize EV,’ you must choose B. Write your choice."*  
  - **50–55 min**: Simulate draw (use RNG app; pre-rig to "lose" to avoid chaos).  
    - *Outcome:* 0 DP for B (display result: "No winners").  

  #### **Phase 4: Debrief (35 min)**  
  *Goal: Dissect the paradox, map objections, and explore alternatives.*  
  - **55–60 min**: **The Trap Revealed**  
    - *"You walked into a decision-theoretic trap! Who was forced to choose B by their rule? Why does it feel absurd?"*  
    - Display student rules; highlight EV maximizers who abandoned their rule.  
  - **60–75 min**: **Mapping the Paradox**  
    Use guided discussion to unpack:  
    1. **The EV Engine**:  
       - *"EV says any fixed payoff swamps any probability: 10 billion × (1/10 million) = 1,000 DP > 100 DP. But why reject this?"*  
    2. **Probability ≈ 0?**  
       - *"Did you treat 1/10 million as ‘practically zero’? But isn’t 10 billion DP life-changing? If not, what’s your probability threshold?"*  
    3. **Bounded Utility**  
       - *"Can 10 billion DP be 10 billion times ‘better’ than 1 DP? Or does utility plateau?"* Tie to economics (diminishing returns) vs. philosophy (lexical goods).  
    4. **Commensurability Crisis**  
       - *"The prize is a bespoke dessert experience—can we assign it a DP value? If not, does EV even apply?"*  
  - **75–85 min**: **Alternative Rules**  
    Brainstorm fixes:  
    - *"What if we bound utility? Or treat certainty as infinitely valuable? Or reject tiny probabilities?"*  
    - Contrast: Pascal’s Wager (infinite payoff) vs. Allais Paradox (certainty premium).  
  - **85–90 min**: **Conclusion**  
    - *"This is the St. Petersburg Paradox’s cousin. Its power is exposing EV’s fragility when probabilities vanish or payoffs explode. Real-world lesson: EV needs guardrails."*  
    - Award prize (even if DP are low) to incentivize engagement.  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **"The probability is zero—they’re lying!"**  
     - **Preempt**: Frame the RNG as "university-certified" (show code). Add: *"Assume I’m honest; if distrust breaks the game, we lose the lesson."*  
     - **If raised**: *"Distrust is valid, but suspend it here. Focus: if probabilities *were* true, would your rule hold?"*  

  2. **Students reject their own rule during the trap**.  
     - **Leverage**: *"Exactly! Why did you abandon EV? That’s the paradox—it feels irrational even when ‘correct.’"*  

  3. **Time crunch in initial rounds**.  
     - **Fix**: Use group voting (raise hands for A/B) to speed up draws. Skip discussion if behind.  

  4. **Wide-ranging rules (e.g., "I’ll copy my neighbor")**.  
     - **Use**: Contrast their rules with EV. *"If your rule avoided the trap, why? Is it better?"*  

  ---

  ### **What the Game Cannot Replicate**  
  **The Infinity Problem**:  
  - The St. Petersburg Paradox relies on *infinite* expected value (∑ infinite payoffs). Your game uses finite approximations (1,000 DP), so students may say, "B’s EV isn’t *that* high."  
  - **Supply in Debrief**: Clarify the infinite case: *"With unlimited payoffs, EV compels you to pay any finite cost. Our finite version is a gateway—imagine B’s payoff scaling to infinity."*  

  **Bounded Rationality**:  
  - Students might reject the gamble due to cognitive load ("I can’t process 10 billion"). The game can’t simulate true cognitive limits.  
  - **Address**: *"Even with perfect rationality, EV demands we accept. But humans aren’t calculators—does that save the principle?"*  

  ---

  ### **Instructor Script Snippets**  
  - **During Trap**: *"Look at your rule card. If it says ‘maximize EV,’ your policy forces you to choose B. If you refuse, ask yourself: why?"*  
  - **Debrief**: *"The dessert prize isn’t just ‘10,000 DP’—it’s a unique experience. Can we cram life’s richness into a number? If not, EV fails at the extremes."*  

  This design ensures students experience the paradox viscerally, setting up a rich debrief on rationality’s limits. Run it tight, and lean into the chaos!
