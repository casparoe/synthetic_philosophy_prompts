answer: |-
  ### Analytical Framework for Famine Attribution  
  Famines are assessed along three dimensions:  
  1. **Pre-existing vulnerability**: Agroeconomic structures (land tenure, market access, inequality) determining resilience.  
  2. **State capacity and will**: Surveillance systems, logistical intervention capacity, and political prioritization of famine prevention.  
  3. **External constraints**: Warfare, blockades, or international isolation limiting options.  
  Nature *triggers*; politics *amplifies or mitigates*. The threshold for "political crime" is met when authorities *could* have averted mass mortality using available resources but chose not to due to ideology, negligence, or deliberate targeting.  

  ### Ratings & Tiers (0–10 Scale)  
  **Mostly Natural (0–3)**  
  - **Dutch Hongerwinter (1944–45)**: **Score 4** → *Tier: Mixed, leaning natural*.  
    Nazi blockade severed food flows to an urbanized population; limited Dutch agency under occupation. Mortality fraction: **0.7**.  

  **Mixed (4–6)**  
  *None in this tier for these cases.*  

  **Mostly Political (7–10)**  
  - **Irish Famine (1840s)**: **Score 8.5** → *Export-oriented economy + laissez-faire dogma prevented relief*.  
    Mortality fraction: **0.2** (exports continued as imports were delayed; relief was inadequate and punitive).  
  - **Ethiopian Famine (1984–85)**: **Score 7** → *Drought exposed Derg’s counterproductive villagization and roadblocking policies*.  
    Mortality fraction: **0.4** (swifter aid access and no forced resettlement would have cut deaths significantly).  
  - **Soviet Famine/Holodomor (1932–33)**: **Score 10** → *Seizures of grain and seed stock enforced collectivization*.  
    Mortality fraction: **0.95** (no harvest shortfall justified mortality; policy was weaponized).  
  - **Bengal Famine (1943)**: **Score 10** → *Wartime inflation mismanagement + Churchill’s diversion policy*.  
    Mortality fraction: **0.05** (caloric availability per capita was sufficient; distribution collapsed).  
  - **Great Leap Forward Famine (1959–61)**: **Score 10** → *Anti-scientific directives + extraction quotas amid false reports*.  
    Mortality fraction: **0.95** (yields fell due to policy, not nature; exports continued).  

  ### Definitive Commitments  
  **Purest Natural Disaster**: **Hongerwinter (Score 4)**  
    - *Defense*: Under Nazi occupation, Dutch authorities lacked sovereignty over transport networks or food policy; starvation was imposed by blockade and punitive seizure.  
    - *Strongest objection*: "The Dutch government-in-exile could have negotiated earlier air drops or prioritised urban food stockpiles."  
    - *Rebuttal*: Allied military strategy deliberately delayed relief to avoid aiding Nazis; no autonomous Dutch action was feasible. Score holds.  

  **Purest Political Crime**: **Soviet Famine/Holodomor (Score 10)**  
    - *Defense*: Stalin’s regime confiscated grain *during* crop failure, sealed borders to prevent flight, and denied aid – a calculated purge of Ukrainian peasants.  
    - *Strongest objection*: "Poor weather reduced yields; seizures were standard in food crises."  
    - *Rebuttal*: 1932 yields were near-average; seizures exceeded 50% of harvests while seed grain was looted. Policies were *designed* to break resistance, not alleviate shortage. Score holds.  

  ### Conclusion  
  Your career studied a *necessary input* (yield volatility) but not the *sufficient condition* (distributional collapse). Sen’s insight prevails: all six famines show politics as the decisive multiplier. Nature sets the stage; politics writes the tragedy.
