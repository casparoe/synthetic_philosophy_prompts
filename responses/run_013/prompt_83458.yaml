answer: |-
  Here's your conceptual menu of "information is physical" claims, graded by radicalness and assessed for plausibility, followed by an autopsy of your reading group's arguments:

  ### The Menu (Ordered Trivial → Radical)
  1. **Trivial Substrate Dependence**:  
     *"Information requires a physical carrier (matter/energy/fields)."*  
     **Verdict:** Trivially true (no serious thinker denies this).  
     **Weight:** Zero. Doesn't address demon dynamics. Empty for thermodynamics.

  2. **Measurement/Manipulation Has Energy Cost**:  
     *"Acquiring, processing, or storing information *can* incur thermodynamic costs."*  
     **Verdict:** Contextually true (e.g., Landauer erasure), but not universally necessary (e.g., some measurements *can* be thermodynamically free in idealized limits).  
     **Weight:** Low. Explains *how* demons *might* be exorcised, but doesn't prove they *must* be.

  3. **Information Processing is Thermodynamically Constrained**:  
     *"Laws of thermodynamics (especially the 2nd Law) fundamentally govern information processing (Landauer's Principle, Bennett's erasure solution)."*  
     **Verdict:** Defensible and widely accepted (post-Landauer/Bennett consensus).  
     **Weight:** High for demon exorcism. **This is the workhorse reading.** It implies the demon's *memory* (not necessarily measurement) creates entropy via erasure.

  4. **Shannon Entropy ≡ Thermodynamic Entropy**:  
     *"Shannon information entropy (H) is numerically identical to thermodynamic entropy (S) in relevant contexts."*  
     **Verdict:** Contentious but defensible *in specific interpretations* (Jaynes' MaxEnt, some statistical mechanics frameworks). Not universally true (e.g., for non-equilibrium or small systems).  
     **Weight:** Medium. Supports a view where thermodynamics *is* about information, but doesn't resolve demon mechanics alone.

  5. **Ontological Identity**:  
     *"Information is a fundamental physical substance/property (like mass or charge). Thermodynamic entropy *just is* missing information."*  
     **Verdict:** Highly contentious (e.g., Wheeler's "It from Bit" vs. traditional materialism). Borderline metaphysical.  
     **Weight:** Confusing. Can be used to dismiss *or* elevate the demon problem, but lacks empirical teeth.

  6. **No Abstract Computation**:  
     *"All computation is physical process; there is no 'Platonic' computation decoupled from thermodynamic laws."*  
     **Verdict:** Defensible (follows from 1 & 3).  
     **Weight:** Medium. Undercuts claims that the demon is "just" an information problem outside physics, but doesn't specify *how* physics kills it.

  ---

  ### Autopsy of Your Reading Group's Arguments
  1. **Postdoc #1 ("Demon exorcised by bookkeeping"):**  
     Likely leaned on **#3**. If so, defensible and weight-bearing: Demons *must* erase information, paying a thermodynamic cost (Landauer), saving the 2nd Law. **Verdict:** Valid use, IF measurement cost isn't ignored.  
     *But...* If they meant **#1** or **#2**, it's trivial/insufficient: knowing "info is physical" doesn't prove *when* costs kick in.

  2. **Postdoc #2 ("Thermodynamics is about information"):**  
     Invoked **#4** or **#5**. **#4** is defensible but doesn't "solve" the demon—it reframes it. **#5** is radical and shifts the debate to philosophy. **Weight:** Low for *exorcism*; high for redefining the problem. Claims the demon was "never physical" are false; the exorcism relies on *physical* erasure (**#3**).

  3. **Postdoc #3 ("Shannon H = Thermodynamic S"):**  
     Explicitly **#4**. **Verdict:** Overstated. They're conceptually linked and often numerically equal in equilibrium, but not identical (e.g., units differ; S is extensive, H isn't always). Contentious for non-ergodic systems. **Weight:** Misleading here—the demon debate hinges on *dynamics* (erasure), not static entropy equality.

  4. **Postdoc #4 ("No abstract computation"):**  
     **#6**. Defensible but **irrelevant to the demon's threat**. Even if computation is physical, the demon *could still* threaten the 2nd Law if measurement/erasure costs aren't properly accounted for. **Weight:** Zero for exorcism. A non-sequitur in this context.

  ---

  ### The Demon Killshot: Does "Information is Physical" Deliver?
  - **Only reading #3 ("Information processing is thermodynamically constrained") carries weight.** It grounds Bennett's solution: the demon *must* erase information to reset its memory, and erasure *must* dissipate heat (Landauer's Principle), saving the 2nd Law.  
  - **The critical nuance:** #3 **does not** require measurement to cost energy! Idealized measurements *can* be reversible (no entropy increase). The entropy cost hits during *erasure*. If your footnote argues against needing a measurement step, **hammer this**:  
    > *"Information is physical" only exorcises the demon via Landauer erasure. Measurement itself can be thermodynamically neutral; the fatal cost is in forgetting, not knowing. Appeals to the slogan that ignore this distinction are vacuous.*  

  - **Trivial readings (#1, #2, #6) are impotent.** Radical ones (#4, #5) reframe but don't resolve. The slogan is a bumper sticker—its utility depends entirely on the rigorous physics (**#3**) hiding behind it. Without invoking Landauer/Bennett explicitly, it's hand-waving.

  **Bottom line**: The phrase only "settles" the demon when shorthand for **#3**. Otherwise, it's philosophy masquerading as physics. Your suspicion is correct: trivial uses do no work, radical uses aren't operationalized. The demon dies at erasure, not measurement—and the slogan didn't kill it; Landauer did.
