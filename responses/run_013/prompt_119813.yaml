  Okay, let me start by unpacking the user's query. They're writing a feature on prediction-market governance, specifically futarchy, and want a deep dive into its philosophical underpinnings. The user is clearly well-versed in the topic—they mention agenda-setting auctions, veto rules, and statistical tests, so they're familiar with existing critiques and refinements. Their request moves beyond mechanics to presuppositions: what philosophical commitments does futarchy assume?

  First, I need to address their five main areas: the ends-means split, trader behavior, legitimacy, access/capital, and counterfactual measurability. The user is asking for a reconstruction of the implicit philosophies, not just a rehash of standard arguments. They want to know what futarchy silently excludes or requires.

  Starting with the ends-means division. Futarchy separates values (voted on) from facts (markets). This seems to demand a scalar measure of welfare—something like Harsanyi’s utilitarianism. But welfare economics often acknowledges incomparability; futarchy glosses over that. Also, the fact-value distinction here is stark: markets handle beliefs, not desires. But is that realistic? Traders might have normative biases affecting predictions. This tension between welfarism and strict fact/value separation is a key point. If values aren't scalar, the whole structure wobbles.

  Next, trader behavior. The design assumes profit motives override expressive betting. But is this empirical or hopeful? It presumes homo economicus—purely self-interested, rational actors. Yet behavioral economics shows humans aren't always rational. If traders bet expressively, markets could skew. So futarchy leans heavily on a specific, maybe idealized, view of human nature.

  Legitimacy is another big one. Directly enacting market verdicts bases legitimacy on expected outcomes. That sidelines procedural or deontological theories. The prior vote on the measure tries to be democratic, but it’s a one-time majoritarian act. What about ongoing consent? This might clash with theories like Rousseau’s general will. Plus, shifting policy to markets could reduce civic engagement, which communitarians would criticize.

  Access gated by capital is thorny. Influence scales with wealth, assuming that financial stake equals competence or legitimate interest. That clashes with egalitarian political theories. Even if capital barriers are lowered, the profit motive might still exclude marginalized groups. This presupposes a meritocratic view where money signals wisdom—controversial at best.

  Counterfactuals need to be measurable. Futarchy relies on comparing what did happen with what would have happened. This requires a deterministic enough world and a welfare measure that’s stable and attributable. But in complex systems, isolating policy effects is messy. The measure must be cardinal, not ordinal. If welfare is pluralistic or incommensurable, counterfactuals might not hold. This is a metaphysical commitment to a tractable universe.

  Now, tensions. Welfarism vs. fact-value separation: if the welfare measure isn't truly scalar, markets might embed values in predictions. Also, the rigid separation ignores that predicting outcomes often involves normative judgments. 

  If replacing welfarism with pluralism or proceduralism, the mechanism crumbles. Without a single metric, conditional markets can't compare proposals. Proceduralism would require redesign—maybe markets vet feasibility, but final decisions need another method. 

  The user’s deeper needs? They’re likely probing futarchy's viability and underlying biases. They might want to expose unspoken assumptions that proponents ignore. Also, considering alternatives: can futarchy adapt, or is it stuck in a utilitarian framework? Highlighting tensions shows where the design might fail in real-world applications, which is crucial for their feature.
answer: |-
  Here’s a reconstruction of the philosophical commitments underlying prediction-market governance (futarchy), addressing your five core questions and their tensions:

  ### I. Core Presuppositions
  1. **Ends/Means Division & Theory of Value**  
     - **Strict Presupposition**: **Monistic Welfarism**. The design requires a *single, cardinal, and interpersonally comparable welfare metric* (e.g., weighted GDP). It assumes all values can be collapsed into one scale, excluding pluralist (e.g., Rawlsian primary goods) or incommensurable goods (e.g., liberty vs. security).  
     - **Sharp Fact/Value Separation**: Markets are delegated *only* to resolve empirical uncertainties ("Will Policy X raise welfare?") not normative ones ("Is this welfare measure just?"). This presupposes **logical positivism** about value: desires are non-cognitive, while beliefs about outcomes are truth-apt.  

  2. **Trader Behavior: Profit vs. Expression**  
     - **Empirical Hope with Deep Commitments**: It assumes traders are primarily *homo economicus*—rational profit-maximizers—whose financial incentives dominate ideological or expressive motives. This relies on a **behaviorist account of rationality** and dismisses thick identities (e.g., Kantian moral agency) that might motivate non-instrumental action. The design is silent on *scale*: it may fail if expressive betting dominates in polarized societies.  

  3. **Legitimacy & Democratic Authority**  
     - **Rules Out**: Deontological (rights-based) and procedural legitimacy (e.g., deliberative democracy). Legitimacy stems *only* from expected welfare gains.  
     - **Tension with Majoritarianism**: The initial vote on the welfare measure provides thin democratic input, but policy selection bypasses popular will. This tacitly endorses **epistocracy** (rule by the informed) and **consequentialism** as superior to majoritarianism. The design excludes theories where legitimacy requires ongoing consent (e.g., Rousseau) or rights constraints (e.g., Nozick).  

  4. **Access & Political Standing**  
     - **Presupposition**: **Meritocratic Pluralism**. Influence proportional to capital assumes that:  
       (a) Financial stake correlates with competence/knowledge,  
       (b) Willingness to risk capital signals credible belief,  
       (c) Political standing is not inherently equal but earned through engagement.  
     This clashes with **egalitarian theories** (e.g., "one person, one vote") and **structural critiques** (e.g., capital access mirrors existing inequalities).  

  5. **Counterfactual Measurability**  
     - **Metaphysical Commitment**: **Deterministic (or Stochastic) Tractability**. The world must be such that:  
       (a) Policy effects are isolatable (no radical indeterminism),  
       (b) The welfare metric is *attributable* (changes can be causally linked to policies),  
       (c) Counterfactuals have "true values" discoverable via markets.  
     This assumes a **neo-Humean ontology** where causality is stable and measurable.  

  ### II. Key Tensions
  - **Welfarism vs. Fact/Value Separation**:  
    The market’s "factual" predictions about welfare gains *embed* the value-ladenness of the metric itself (e.g., "weighted GDP" assumes a specific theory of distributive justice). If traders dispute the metric’s validity, their bets may reflect normative dissent, violating the fact/value split.  
    - **Resolution Attempt**: Markets can only "work" if the welfare measure is *uncontroversially accepted* as the sole goal. This is empirically fragile.  

  - **Welfarism vs. Legitimacy**:  
    Consequentialist legitimacy hinges on *actual* welfare gains, but markets only deliver *expected* gains. A policy with high expected value that fails ex post undermines the system’s authority.  

  ### III. Replacing Welfarism: Mechanism Implications
  - **Pluralist Values (e.g., Nussbaum/Sen Capabilities)**:  
    Futarchy collapses. Multiple incommensurable goods cannot be traded off in a single market. You’d need parallel markets for each dimension (health, education, etc.) and a meta-mechanism to resolve conflicts—which reintroduces the problem futarchy avoids.  

  - **Proceduralism (e.g., Habermasian Deliberation)**:  
    The market’s efficiency focus is antithetical to procedural legitimacy. To adapt:  
    - Markets could *inform* deliberation (e.g., "Market predicts Policy X will raise GDP by 2%"), but final decisions would require a discursive body.  
    - Conditional markets might screen proposals for feasibility, but enactment would need democratic ratification.  

  - **Deontological Constraints (e.g., Rights)**:  
    Requires a constitutional layer. Markets could optimize welfare *subject to* rights vetoes (e.g., a human rights court invalidates market-approved policies). This hybrid concedes that welfare isn’t the sole value.  

  ### IV. Silences & Equivalence
  - **Individual Rationality**: The design is silent on whether traders are self-interested or altruistic. Altruists betting on social welfare could work (even better).  
  - **Timeframe**: Short-term vs. long-term welfare tradeoffs aren’t specified. Markets could incorporate discount rates, but this isn't inherent.  
  - **Non-Human Interests**: If "welfare" includes ecological health, markets can bet on it—but the initial vote must define this.  

  ### Summary: The Unavoidable Core
  Futarchy **strictly presupposes**:  
  1. A monistic, cardinal welfare metric,  
  2. The ontological measurability of policy counterfactuals,  
  3. Profit-driven traders as reliable truth-trackers.  
  It **quietly excludes**: Value pluralism, rights-based constraints, and non-consequentialist legitimacy.  
  The **fatal tension** lies in its simultaneous reliance on *contestable values* (via the welfare metric) and *value-neutral empiricism* (via markets). If values permeate facts, the market’s "objective" predictions become unstable.
