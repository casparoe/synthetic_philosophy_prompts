answer: |-
  ### 1. What this question is testing  
  This question assesses students' ability to:  
  - Construct a reductionist critique of testimony (śabda) as merely derivative of perception and inference, using Nyāya’s extrinsic validity (parataḥ prāmāṇya) to undermine its independence.  
  - Articulate Nyāya’s core defense of śabda (competent/truthful speaker + semantic conditions) and its irreducibility claim.  
  - Analyze how Nyāya resolves the certification regress (pragmatic success) and whether this equally "saves" testimony or exposes its dependence.  
  - Critically evaluate if Nyāya’s stance is a substantive defense or semantic relabeling, extending the analysis to upamāna (comparison).  

  ---

  ### 2. The Question (100 words | 20 marks | 90 minutes)  
  **Nyāya defends śabda (testimony) as an irreducible pramāṇa, yet insists all knowledge requires extrinsic certification (parataḥ prāmāṇya). Construct a reductionist argument showing how testimony collapses into perception and inference. Then, explain Nyāya’s rebuttal: what conditions make śabda irreducible? Next, resolve the regress problem: if every cognition needs certification, what ultimately stops the chain for testimony? Can this "stopper" defend śabda’s independence, or does it reduce testimony to other pramāṇas? Finally, briefly address whether upamāna (e.g., the gavaya case) faces the same reduction threat. Support your analysis with Nyāya principles.**  

  ---

  ### 3. Model Answer (700 words)  
  **Reductionist Argument:**  
  If śabda requires extrinsic validation (parataḥ prāmāṇya), testimony isn’t independently valid. When I hear "There’s fire on the mountain," I must *infer* the speaker’s reliability (e.g., from past accuracy) and *perceive* outcomes (e.g., seeing the fire later) to certify it. Thus, śabda is just inference (about the speaker’s trustworthiness) plus perception (of the testified object). For example, learning about a *gavaya* (wild cow) from testimony ("it looks like a cow") reduces to: (1) perceiving a cow later, (2) recalling the testimony, and (3) inferring similarity. Nothing unique occurs—it’s memory-aided perception and inference.  

  **Nyāya’s Defense of Irreducibility:**  
  Nyāya counters that śabda generates knowledge *directly* under strict conditions: the speaker must be competent (*āpta*) and truthful (*ṛtavādin*), and words must denote real objects. Unlike inference, which needs prior knowledge of universals (e.g., smoke-fire relations), testimony delivers new knowledge *immediately* through semantic comprehension (*śābda-bodha*). For instance, hearing "gavaya resembles a cow" from a reliable forest guide instantly informs me—no intermediate inference occurs. This linguistic capacity is sui generis.  

  **Regress Stopper and Its Implications:**  
  Nyāya halts the certification regress via pragmatic success (*pravṛtti-sāmarthya*). A cognition is validated when actions based on it succeed (e.g., avoiding a gavaya after hearing it’s dangerous). For testimony, this means *later* perception confirms the claim (e.g., seeing the gavaya matches its description). However, this "stopper" undermines śabda’s independence: certification relies on perception and inference (did my action succeed? Was the speaker *really* reliable?). Testimony’s validity thus *depends* on other pramāṇas, making it secondary.  

  **Critical Assessment:**  
  Nyāya’s defense is partly relabeling. While the *acquisition* of testimonial knowledge is direct (due to semantic comprehension), its *validation* is parasitic. The conditions for śabda (e.g., speaker reliability) are themselves certified by perception/inference, creating a circle. If I need perception to confirm the fire or gavaya, and inference to trust the speaker, śabda isn’t truly autonomous—it’s a delivery system for other pramāṇas.  

  **Upamāna Parallel:**  
  Upamāna similarly collapses. Knowing a gavaya "via comparison" (e.g., hearing it resembles a cow, then seeing one) involves: (1) perceiving the cow (perception), (2) recalling the description (memory), and (3) inferring similarity (inference). No distinct pramāṇa exists—just perception and inference mediated by memory. Nyāya’s "unique resemblance cognition" adds no epistemic content.  

  **Conclusion:**  
  Though Nyāya identifies a *phenomenological* uniqueness in testimony/comparison (direct comprehension/resemblance), certification reduces them to perception and inference. The "stopper" reveals this: successful action depends on perceptual validation, not śabda/upamāna alone. Thus, while śabda isn’t *psychologically* reducible, it is *epistemically* dependent.  

  ---

  ### 4. Marking Scheme (Total: 20 marks)  
  **Must-hit points (+ marks):**  
  - **Reductionist case for śabda** (4 marks): Testimony → inference (speaker reliability) + perception (outcome verification).  
  - **Nyāya’s irreducibility defense** (5 marks): Competent/truthful speaker + semantic directness (śābda-bodha) vs. inference.  
  - **Regress resolution & critique** (5 marks): Stopper = pragmatic success (action → perception); certification exposes dependence.  
  - **Critical evaluation** (4 marks): Relabeling claim (acquisition ≠ validation; conditions rely on other pramāṇas).  
  - **Upamāna reduction** (2 marks): Gavaya case → perception + memory + inference; no unique content.  

  **Deduct marks for:**  
  - Misdefining parataḥ/svataḥ prāmāṇya (–1).  
  - Stating śabda is irreducible *without* building reductionist case first (–2).  
  - Ignoring the regress stopper’s role for testimony (–3).  
  - Omitting upamāna entirely (–2).  

  **Typical student errors per point:**  
  - **Reductionism**: Just saying "testimony needs perception" without showing *how* (inference about speaker + perception of object).  
  - **Nyāya defense**: Listing conditions (āpta, etc.) without explaining *why* they block reduction (semantic immediacy vs. inferential steps).  
  - **Regress stopper**: Identifying pragmatic success but not explaining *how it certifies testimony* (e.g., via subsequent perception).  
  - **Critical evaluation**: Conceding Nyāya’s defense without noting the validation paradox.  
  - **Upamāna**: Treating it as separate without linking to gavaya’s reducibility.
