prompt: |-
  I'm a third-year PhD student in operations research — my thesis is on distributionally robust optimization, Wasserstein ambiguity sets for stochastic programs mostly — so I spend my days with worst-case expectations, coherent risk measures, robust counterparts of chance constraints, minimax regret, value of information, that whole toolkit. I can read a measure-theoretic probability paper without crying, but I've never taken a philosophy course and I don't know the literature on this at all.

  For a side project I've been poking at imprecise probabilities: the idea that a rational agent's credences can be a set of probability functions instead of a single one, with lower and upper previsions, and then some rule for acting on the set (maximin, maximality, E-admissibility, interval dominance, whatever). And I keep having this nagging feeling that I already do this for a living under different names. So what I want from you is a translation job, not a summary.

  Take the main positions in that debate and restate them in my vocabulary, one at a time, as faithfully as you can. The case that credences should sometimes be imprecise, the standard objections from the precise-Bayesian side (that imprecision is a second-order distribution in disguise, or that a set of credences can't guide action without a tie-breaking rule that quietly puts the precision back), the coherence / avoid-sure-loss constraint, the question of how a set of priors updates on evidence, and the thing where two variables you'd expect to be independent turn out to be informative about each other once your probabilities are sets rather than points. Map each of those onto ambiguity sets, robust counterparts, adversarial vs stochastic uncertainty, sample-based approximations, dynamic risk measures, whatever actually fits.

  Then the residue report, and this is the part I care about. Which pieces survive the translation cleanly, which only survive if I distort them, and which have no counterpart at all in how I think about uncertainty. Concretely: when I write down an ambiguity set, I chose it — it's a modeling decision, a hedge, and I'm accountable for it being neither too big nor too small. When they write down a credal set, is that supposed to be the agent's actual belief state? If so, does that difference matter, or is it just a story I tell about where the set came from? Is maximin a normative claim about rational choice for them and a design choice for me, or is that the same distinction wearing two hats? Does the time-consistency literature on dynamic risk measures already answer their updating objection, or does it dodge it? And is there anything they argue about that I simply cannot express — my guess is it's the question of whether imprecise credences are genuine beliefs, plus whatever "permissivism" is — and if so, is that residue because my framework isn't a theory of belief and shouldn't be expected to say anything, or because their question is doing less work than it looks like it's doing?

  Be honest about where the translation flatters my framework. Don't just relabel my objects with their words and call it a translation, and don't smuggle in my assumption that the analyst picks the set and pretend it's theirs. Don't give me a reading list, I'll chase the papers myself once I know what to look for.

  One last thing: write it as continuous prose, no headings, no bullets, no bold, no tables. Just paragraphs, like you're explaining it to me over coffee.
