prompt: |-
  I'm in a slow reading group that's working through the Guide of the Perplexed, and we got stuck on the part where Maimonides explains the sacrificial laws as a kind of concession — God would rather have had prayer and inward worship from the start, he thinks, but the Israelites had grown up surrounded by people who slaughtered and burned offerings to idols, so the Torah took that habit and redirected it toward God instead of trying to rip it out by the roots. We spent two hours arguing about whether that's a compliment to the Torah or an embarrassment, and never got to my actual question, which is what Maimonides would make of the modern world. So I'm outsourcing it. Assume he's somehow alive now, has read widely in modern biology and economics, and isn't just repeating his own conclusions but reasoning from his own principles — divine incorporeality, commandments having rational purposes, the limits of human knowledge, his scattered remarks about kindness to animals and the suspicion that certain laws exist to train cruelty out of us. What would he say about (a) industrial animal agriculture, where nearly all the meat people eat comes from animals kept in conditions he couldn't have imagined, (b) cultivated meat grown from cells in a vat, with no animal raised or killed, and (c) a small modern movement that wants to rebuild the Temple and restart the sacrifices using that cultivated meat, on the grounds that this finally removes the moral objection to the whole institution?

  My friends are split and I want a real adjudication, not a both-sides shrug. One says the concession argument cuts one way: if the sacrifices were a pedagogical stage aimed at weaning people off idolatrous slaughter, and the stage is over, then a consistent Maimonides would be a vegetarian who calls factory farming a worse idolatry than anything the ancient world managed, and who tells the Temple people they've confused a means with an end. Another says it cuts the other way: Maimonides was a legalist who held the commandments permanent and thought we don't get to retire them because we fancy we've outgrown them, so he'd tell the vegetarians to keep their opinions and keep the sacrifices anyway, and might add that a cultivated-meat Temple is a category error because the point was never the meat. A third friend thinks the interesting thread is that some commandments exist to cultivate mercy, which might mean he'd care less about what factory farming does to the animals than about what it does to the people who run it and eat from it. I dont know which of these is closest to the actual Maimonides rather than to a modern person wearing his coat, and I'd rather find out than keep guessing.

  Please structure it like this. Start with a section called "What Maimonides held" (~150 words) stating only what he actually argues, and flagging anything you're unsure of. Then "Prediction: three cases" (~400 words) giving his likely verdict on (a), (b) and (c), with the reasoning he'd give, in his own voice as much as you can manage. Then "The strongest objection" (~200 words) laying out the best reason to think your prediction is wrong. Then "Bottom line" (~100 words) saying which friend is closest and what would change your mind. No reading lists or citations, please — I can't check them anyway — just reason it out and be explicit about where you're extrapolating.
