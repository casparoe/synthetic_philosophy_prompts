prompt: |-
  I'm running a session for our department's cross-disciplinary reading group next month — mostly stats and bio grad students who use Bayesian methods every day but have never read a word of philosophy of science. Topic is the problem of old evidence, about ninety minutes, whiteboard. I dont want the explanation itself, I want the plan: the order the pieces have to go in so the dilemma lands as something they can't wriggle out of, instead of a technicality about P(E) = 1 that they dismiss in five minutes.

  So: what has to be in place before the case can even be stated? My instinct is that they need a firm grip on what confirmation is supposed to be and on conditionalization as the rule for getting it, and then on why the likelihood ratio seems not to have the same problem — tell me if that's the wrong first move or if it's the right move in the wrong place. The one example that carries the whole session: the obvious candidate is Mercury's perihelion, but I suspect that's the wrong carrier for this room — either tell me why it's actually right and what it has that other candidates lack, or pick something better. Either way I need a case where the evidence wasn't just known beforehand but was what the theory was built out of, so that the accommodation issue has teeth. What the example must have, and what it must lack, spelled out.

  Then the escape routes in the order they'll occur to people, with what each one costs: 'what you learn is that the theory entails the fact, and that's itself new information'; 'ask what your credence in the fact would have been before you knew it' (why that isn't free); 'the whole thing is an artifact of idealizing agents as logically omniscient'. I also want the neighbouring issue fenced off rather than blended in — whether accommodating a known fact is worth less than predicting a new one, and the overfitting answer to that — because I'm fairly sure half the room will think that is the old evidence problem. And I want the difference between the version of the problem that's about a real historical episode and the version that's just about one frozen credence function to do actual work somewhere in the sequence; say where it goes and what it buys.

  Misconceptions I expect, and exactly where in the sequence to head each one off: that this is about dogmatic priors and goes away if you're less certain; that setting P(E) below 1 solves it; that it's about the psychology of discovery; that it refutes Bayesianism; that it's the same as the prediction-vs-accomodation thing. Plus what I should openly refuse to go into at this level and say so, and one question to ask at the end that would show the dilemma landed rather than just got written down. No readings — they won't do them.
reasoning: |-
  Hmm, the user is preparing a session on the problem of old evidence for a cross-disciplinary reading group of stats and bio grad students. They need a strategic plan to make the dilemma land effectively, not just an explanation. Let me break down their requirements.

  First, they want the dilemma presented in a way that's inescapable. The participants use Bayesian methods daily but have no philosophy background. The key is to prevent them from dismissing it as a technicality about P(E)=1. The user suspects the Mercury perihelion example might not be ideal and wants alternatives. 

  I need to consider what foundations must be laid before introducing the problem. The user's instinct is to start with confirmation theory and conditionalization, then contrast with the likelihood ratio approach. That makes sense. Without understanding what confirmation is supposed to be in Bayesian terms, the problem won't resonate. Conditionalization as the update rule is crucial because the problem arises when applying it to old evidence.

  For the example, Mercury's perihelion is classic but might not connect with biologists. They need an example where evidence was used to build the theory, making accommodation problematic. Gravitational lensing during eclipses could work—Eddington's 1919 experiment. Einstein used GR to predict it, but it was known that light bends (just not how much). The example must show the evidence was known, the theory was constructed to fit it, and it's not easily dismissible. It must lack alternative explanations that could muddy the waters.

  Order of escape routes is important. Participants will likely suggest that learning H entails E is new evidence. But that requires logical learning, which Bayesianism typically assumes is already incorporated (logical omniscience). Then, the counterfactual approach: imagine credence before knowing E. But this is problematic because it's subjective and hard to specify. Finally, the logical omniscience critique—but if we relax it, we lose normative power.

  Neighboring issues like prediction vs. accommodation need to be fenced off. Overfitting is a related concern but distinct. The user wants to clarify that old evidence is about updating on known evidence, not the value of novel predictions.

  Misconceptions to address: that dogmatic priors are the issue (but even with uncertain P(E)<1, problem persists), that it's psychological (it's about rational update, not discovery), that it refutes Bayesianism (it's a challenge, not a refutation), and confusing it with prediction vs. accommodation.

  The difference between historical and static credence versions should be highlighted. Historical shows the problem in real cases, static reveals it's inherent in Bayesian formalism. Using both strengthens the case.

  At the end, a question to check understanding: "If you'd never heard of GR and learned it entailed Mercury's perihelion post-hoc, should that increase your belief in GR? Why can't Bayes capture that?"

  Need to avoid getting into solution details (e.g., Garber's approach) or prediction/accommodation debates. Keep focused on the dilemma's core.
answer: |-
  Here’s a battle-tested plan to make the Problem of Old Evidence (POE) land like a gut punch for your stats/bio crowd. The goal is to force them into the dilemma *before* they see the escape hatches, then make each escape feel costly. **Total time: 90 mins.**

  **Core Strategy:**  
  Build the Bayesian edifice *they already accept* brick by brick, then show POE cracks its foundation. Use an example where the evidence was *instrumental in constructing the theory* (accommodation with teeth) and is *quantitatively precise* (so likelihood ratios can’t dodge the issue). Mercury *is* ideal, but reframe it for skeptics.

  ---

  ### **PHASE 1: LAY THE FOUNDATIONS (25 mins)**  
  *(Make them complicit in standard Bayesianism)*  

  1.  **What is Confirmation? (5 mins)**  
      - Whiteboard: *Confirmation = Raising probability*. \(C(H,E)\) iff \(P(H|E) > P(H)\).  
      - Emphasize: This is *their* daily tool. Link to Bayes factors, posterior odds. No philosophy yet.  

  2.  **Conditionalization as the Engine (10 mins)**  
      - Whiteboard: **Update Rule**: \(P_{\text{new}}(H) = P_{\text{old}}(H|E) = \frac{P_{\text{old}}(E|H) \cdot P_{\text{old}}(H)}{P_{\text{old}}(E)}\).  
      - Stress: This is *normative* for rational learning. When you learn E (with certainty), you *must* conditionalize.  
      - Ask: "If E is *new* data, does this work?" (Yes! Show quick example: new drug trial data confirming efficacy).  

  3.  **The Likelihood Ratio Dodge (10 mins)**  
      - Whiteboard: Confirmation strength \(\approx \frac{P(E|H)}{P(E|\neg H)}\).  
      - Trick: If \(P(E) = 1\), then \(P(H|E) = P(H)\) → *no confirmation*. But they'll protest: "We use likelihood ratios! We ignore \(P(E)\)!"  
      - **Head off misconception**: "Ah, but the LR is *derived from conditionalization*. If \(P(E) = 1\), LR is undefined/1. The ratio can't save you if the probability *in the denominator* is fixed."  

  ---

  ### **PHASE 2: DEPLOY THE TRAP (20 mins)**  
  *(State POE in its most vicious form)*  

  **The Example: EINSTEIN & MERCURY’S PERIHELION (Yes, use it!)**  
  *Why it works & how to sell it:*  
  - **What it HAS**:  
    - E = Mercury’s perihelion advance (532"/century) was **known precisely for decades** (Le Verrier, 1859).  
    - H = General Relativity (GR) was **explicitly constructed to fit E** (Einstein used it to fix his equations, 1915).  
    - **Quantitative fit**: GR predicts *exactly* 43"/century (the unaccounted portion), matching observation.  
  - **What it LACKS**:  
    - No ambiguity about E being "old" (it was textbook astronomy).  
    - No competing theory gave exactly 43" (Newton + perturbations gave 531.6", off by 0.4").  
  - **Sell it to skeptics**: "Forget 'philosophy'—imagine you’re a Bayesian cosmologist in 1919. GR *retroactively* nails Mercury's anomaly. Does this *confirm* GR? Should your credence increase?"  

  **The Trap Sequence:**  
  1. State the historical fact: Einstein *accommodated* Mercury.  
  2. **Key move**: Ask them to simulate the Bayesian update *in 1915*, **after E is known but before H is proposed**.  
     - Whiteboard: \(P_{\text{1915}}(H_{\text{GR}} | E) = ?\)  
     - They know \(E\) is true → \(P_{\text{1915}}(E) = 1\).  
     - If \(P_{\text{1915}}(E) = 1\), then \(P_{\text{1915}}(H|E) = P_{\text{1915}}(H)\).  
     - **Boom**: Learning E *cannot* confirm H, because E is already certain!  
  3. **Objection you want**: "But GR *predicts* it perfectly! That has to count!"  
     - Reply: "Show me using conditionalization. What's \(P_{\text{old}}\)? What updates?"  

  ---

  ### **PHASE 3: FORCE THEM TO WRIGGLE (30 mins)**  
  *(Systematically close escape routes)*  

  **Escape 1: "Learning H entails E is new evidence!"**  
  - *What they’ll say*: "In 1915, I didn’t know GR → Mercury. When I learn H⊢E, that’s new info!"  
  - **Cost**:  
    - Whiteboard: They want to update on \(K =\) "H entails E", not E itself. So \(P_{\text{new}}(H) = P_{\text{old}}(H|K)\).  
    - Problem: In standard Bayesianism, **logical truths are always known** (logical omniscience). If H *actually* entails E, then \(K\) is a tautology → \(P(K)=1\) → no update.  
    - **Punch**: "So to solve POE, you must reject logical omniscience. But then how do you model *learning math*? What’s \(P(H|K)\) if agents can’t do logic?"  

  **Escape 2: "Use counterfactual credence (P(E) < 1)!"**  
  - *What they’ll say*: "Just imagine your credence in E *before* you knew it!"  
  - **Cost**:  
    - Whiteboard: Let \(P^*\) be credence before learning E. Update: \(P^*_{\text{new}}(H) = P^*(H|E)\).  
    - Problem 1: **Which counterfactual?** Your actual past credence (but you *did* know E)? An idealized one?  
    - Problem 2: **Subjectivity run amok**. If I arbitrarily set \(P^*(E) = 0.5\), I get confirmation. But if I set \(P^*(E) = 0.99\), barely any. Why prefer one over another?  
    - **Punch**: "Bayesianism is supposed to be *objective* given priors. This makes confirmation depend on fictional credences!"  

  **Escape 3: "It's an artifact of logical omniscience!"**  
  - *What they’ll say*: "Real scientists don't know all entailments. POE is fake."  
  - **Cost**:  
    - **Static vs. Historical POE**: Distinguish two versions:  
      - *Historical*: Einstein/Mercury (requires modeling ignorance of entailments).  
      - *Static*: For *any* agent with \(P(E)=1\), H cannot be confirmed by E (even if H is learned later).  
    - **Punch**: "Even if we fix historical POE with counterfactuals, static POE remains. If you *now* learn a new theory H that entails E (which you already know), can H be confirmed? Static Bayes says no. Is that rational?"  

  ---

  ### **PHASE 4: FENCE OFF DISTRACTIONS (10 mins)**  
  *(Prevent derailment)*  

  - **Prediction vs. Accommodation ≠ POE**:  
    - "POE isn’t about *why* accommodating is weaker. It’s that Bayes says accommodation *shouldn’t work at all* when E is old."  
    - **Fence firmly**: "Overfitting explains why novel predictions are *better*. POE says accommodating old evidence is *impossible* under conditionalization. Different problem!"  

  - **Misconceptions to crush**:  
    - "It's about dogmatic priors!" → No, even if \(P(E)=0.999\), updating on E gives tiny confirmation. POE bites when \(P(E)=1\).  
    - "Set P(E)<1 solves it!" → Only by violating the *norm* that you should be certain in known evidence.  
    - "It's psychology!" → No, it’s about *rational* updates.  
    - "It refutes Bayesianism!" → No, it’s a challenge to its *scope*.  

  ---

  ### **PHASE 5: LAND THE PLANE (5 mins)**  
  - **Refuse to go into**: Solutions (e.g., Garber’s, Jeffrey conditioning). Keep focus on the dilemma.  
  - **Killer closing question**:  
    > *"Suppose a grad student in your lab fits a model to old data, and it nails a precise anomaly everyone ignored. You say: 'Nice curve-fit, but prove it with new data.' The student replies: 'But according to Bayes, I shouldn't even get credit for explaining the old data!'* ***Is the student wrong? Where did your Bayesian toolkit fail them?****"*  

  ---

  **Why this works**:  
  - Uses **their language** (conditionalization, likelihoods).  
  - Mercury **forces the dilemma** (known data used to build theory).  
  - Escapes are **ordered by intuitiveness** (entailment → counterfactual → omniscience critique).  
  - **Static/Historical distinction** prevents "real agents" dismissal.  
  - **Closing question** makes them feel POE in their work.  

  **If they dismiss Mercury**: Swap in **Hubble's constant & cosmic expansion**. Hubble's 1929 data (recession of galaxies) was known but messy; ΛCDM later fit it *precisely* as a "prediction" (but was accommodation). Works if your group is astro-savvy.
