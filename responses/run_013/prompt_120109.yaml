prompt: |-
  I'm in a reading group on rationality -- mix of philosophers and ML people -- and we keep re-litigating whether satisficing is a genuine alternative to maximizing or just maximizing with extra steps. I've stopped trusting the standard story (the one where the aspiration level is set by past experience and drifts up and down with success and failure); it describes how people happen to set their bars, but it doesn't tell me when the bar is set *right*, and that's the part I actually want. So I've been collecting my own gut verdicts on cases and I want you to tell me what principle, if any, they add up to. Please treat me as someone who knows the vocabulary and wants the reconstruction done properly, not a summary of the literature -- and skip the names and dates entirely, I don't want citations or reading lists, I want the argument. Think carefully before committing; my hunch is that a naive principle will look great for six of these and then fall over on the seventh, and I'd rather you find that yourself than paper over it.

  Here are the verdicts. My roommate announced in advance that she'd take the first apartment with a dishwasher, under $1800, and a commute under 30 minutes, and then she did exactly that without seeing the remaining fifteen listings -- I think that's fine, genuinely fine, not a compromise. I did the same thing but arrived at it differently: I saw one great apartment and then decided I was done, and even though I ended up in an identical place I feel uneasy about it, like I rationalized a stopping rule after the fact rather than committing to one. A friend spent forty minutes choosing a $12 dish off a menu and I think that's a small failure. A doctor who stops at the first plausible diagnosis when two cheap, decisive tests are sitting right there is doing something wrong, but a triage nurse with forty people waiting and no test available who treats on the first plausible hypothesis is doing exactly the right thing. A chess player who never trades a bishop for a knight in the opening is being rational, even though the rule is sometimes flatly wrong, and a model-serving system that routes easy queries to a cheap model and hard ones to a big one, and sometimes misroutes a hard one, is being rational too. Someone who eats the same lunch every day to avoid deciding is being rational, but the same person who hasn't looked at their retirement allocation in fifteen years is not, and I can't articulate why those two are different when they look like the same economizing move. And someone who tries to decide how long to deliberate by deliberating about that, and never terminates, is being irrational -- though I notice my principle might apply to itself here, which worries me. My friend's proposal is that there are two different things going on and only one of them is respectable: satisficing over the option you end up with (which he thinks is just a mistake with a nice name) versus satisficing over the search (which he thinks is the real thing). I don't know if that cut survives the cases. My own tentative principle is that a choice is rational iff no alternative use of your cognition would have done better, counting the cost of the cognition itself -- so you maximize expected value net of the thinking, and satisficing is just what that looks like when search is expensive. If that's right, though, I can't tell whether satisficing and bounded rationality are substantive claims or whether I've defined rationality as rationality. Test it and repair it. The case I keep flip-flopping on: a hiring manager who stops at the first candidate who's clearly good enough, in a market where the next candidate might be much better -- my verdict flips depending on whether I imagine the search as costly or free, and I want to know if that flip is a fact about the case or a fact about me.

  Give me the response in these sections, in this order, with roughly these lengths. **Restatement** (~100 words): my cases and verdicts back in your own words, and flag anything I stated ambiguously enough that my verdict doesn't determine what I meant. **What's doing the work** (~150 words): before proposing anything, brainstorm the candidate features -- cost of error, reversibility, cost of search, whether the rule was chosen ex ante or rationalized ex post, whether the rule is itself periodically revisable -- and say which you think carry real weight and which are my confusions dressed up as distinctions. **Candidate principles** (~400 words): two to four principles stated precisely enough to disagree with, each with the specific case that motivates each clause, and for each one, which of my verdicts it has to overturn. **Stress test** (~400 words): run the survivors against the pairs I can't reconcile -- the two apartments, the two doctors, the lunch versus the retirement allocation, and the regress case -- and say plainly where each principle breaks. **New cases** (~300 words): your verdicts on three cases I didn't give, at least one of which tests whether your principle can apply to the activity of applying it. **My verdict** (~250 words): the principle you'd actually adopt, which of my verdicts I have to give up, and if the honest answer is that satisficing isn't a distinct principle at all, say so in the first sentence rather than the last.
reasoning: |-
  Okay, the user is part of a rationality reading group with philosophers and ML folks, debating whether satisficing is genuinely different from maximizing. They've collected personal intuitions on various scenarios and want me to extract an underlying principle without citations. They're clearly knowledgeable and want rigorous analysis, not literature summaries. 

  First, I need to understand their core frustration: they feel the standard satisficing model (aspiration levels adjusting to experience) fails to prescribe when the aspiration level is *correct*, not just how it drifts. Their cases reveal nuanced intuitions where context shifts rationality judgments—like the apartment search (pre-commitment vs. post-hoc rationalization) or medical triage (costly tests vs. no tests). The hiring manager case specifically triggers flip-flopping based on imagined search costs.

  Their tentative principle—rationality as maximizing expected value net of cognitive costs—is dangerously circular. If "rationality is what rationality does," it vacuously absorbs satisficing. But their unease about this suggests they sense a missing criterion for *when* to stop optimizing the optimization process itself. 

  Key tensions in their cases:
  - **Ex-ante vs. ex-post rules**: Roommate's apartment search (deliberate rule) feels rational; theirs (same outcome, improvised rule) feels shaky. This implies commitment matters.
  - **Error costs vs. search costs**: Doctor skipping tests (high error cost) is wrong; triage nurse (high search cost) is right. Chess rules (low-cost heuristics) are fine; retirement neglect (high-cost inaction) isn't.
  - **Regress**: Deliberating about deliberation leading to infinite loops is irrational—but why? Their principle might eat itself here.

  The roommate's "two kinds of satisficing" proposal (option vs. search) seems weak. The lunch/retirement contrast kills it: both economize cognition, but retirement inaction risks catastrophic error, while lunch repetition doesn't. So error magnitude matters more than "search" labeling. 

  For candidate principles, I'll test:
  1. **Strict optimization** (rejected early—fails on apartment/dish cases)
  2. **Cost-adjusted optimization** (their tentative net-value model)
  3. **Rule rationalization** (ex-ante commitment + revisability)
  4. **Expected loss minimization** (error costs weighted against search costs)

  Stress-testing exposes cracks: 
  - **Apartments**: Cost-adjusted optimization OKs both searches (same net value), but user feels one is irrational. Rule rationalization captures this by requiring advance commitment.
  - **Doctors**: Expected loss minimization handles this—test cost and patient backlog convert "wrong" to "right."
  - **Lunch vs. retirement**: Expected loss explains why neglecting retirement is worse (asymmetric downside).
  - **Regress**: All principles risk infinite recursion unless they accept heuristic application. This forces a meta-rule: "Apply the principle approximately when costs exceed benefits."

  New cases probe deeper:
  - **Urgent decision**: Choosing fast during a crisis is rational even if suboptimal—supports cost-adjusted optimization.
  - **Rule tinkering**: Spending hours optimizing a trivial spending cap is irrational—confirms expected loss.
  - **Meta-deliberation**: Applying the principle to itself must be bounded, exposing circularity. Solution: it must include a "stopping threshold" clause.

  Final verdict: Satisficing isn't fundamentally distinct. Rationality requires optimizing *including all costs*—search, error, and meta-cognition. But to avoid paralysis, we need:
  > **Principle**: A choice is rational iff at the time of decision, given available information and cognitive constraints, no feasible alternative cognitive strategy (including deliberation about deliberation) had higher expected utility—accounting for all costs of thinking, errors, and opportunity losses.

  User must give up judging their apartment search as irrational—since identical outcomes and costs make the distinction emotional, not rational. The hiring manager flip-flop *is* about the case: when search costs are zero, satisficing is irrational; when high, it’s compelled. The core insight is that "satisficing" is just optimization under constraints—no extra steps needed.
answer: |-
  ### Restatement
  You judge satisficing rational when:  
  - Your roommate pre-commits to an apartment search rule (dishwasher, <$1800, <30min commute) and stops at the first match without viewing others. This is "genuinely fine."  
  - You stop after one great apartment but feel uneasy due to *ex post* rationalization, despite identical outcome.  
  - Menu deliberation for a $12 dish is a "small failure."  
  - A doctor skipping cheap, decisive tests for a diagnosis is wrong; a triage nurse treating without tests amid high demand is right.  
  - Chess heuristics (e.g., "never trade bishop for knight early") or AI routing models (misclassifying some hard queries) are rational despite occasional errors.  
  - Habitual lunch choices are rational; ignoring retirement allocation for 15 years is not.  
  - Infinite meta-deliberation (e.g., deciding how long to decide) is irrational.  

  **Ambiguities**:  
  - "Identical place" for apartments: Does "identical" mean same features or same quality? Your unease suggests the latter, but verdict hinges on process.  
  - "Cheap, decisive tests" for doctors: Are these universally accessible or context-dependent? Your verdict implies the former.  

  ### What's Doing the Work  
  Relevant features:  
  - **Cost of error** (e.g., retirement neglect vs. lunch habit: catastrophic vs. trivial).  
  - **Cost of search** (e.g., triage nurse: high cost of delay; menu: low cost justifies deliberation).  
  - **Reversibility** (e.g., lunch is reversible, retirement may not be).  
  - **Ex-ante vs. ex-post rules** (apartments: pre-commitment legitimizes; *ex post* feels like self-deception).  
  - **Revisability** (e.g., retirement requires periodic review; lunch doesn’t).  
  - **Cognitive overhead** (e.g., meta-deliberation consumes resources fruitlessly).  

  **Weight**:  
  - Error/search costs and reversibility are robust. Ex-ante commitment matters only derivatively (e.g., it reduces future search costs). Revisability is crucial for irreversible/high-stakes decisions (retirement). Meta-deliberation cost explains its irrationality.  
  - **Confusions**: Ex-ante vs. ex-post is a red herring. If outcomes and costs are identical, the unease is psychological, not rational (e.g., apartments). The "two kinds of satisficing" (option vs. search) collapses: both reduce to cost-benefit tradeoffs.  

  ### Candidate Principles  
  1. **Strict Optimization**: "Always choose the option with highest expected utility."  
     - Motivation: Doctor skipping tests.  
     - Fails: Roommate’s apartment search (ignores search costs), chess heuristics (ignores computation limits).  
     - Rejects your verdicts: Apartments, chess, triage.  

  2. **Cost-Adjusted Optimization**: "Maximize expected utility *net* of decision costs (time, effort, opportunity loss)."  
     - Motivation: Triage nurse (search costly), menu deliberation (search cheap).  
     - Fails: Retirement neglect (low review cost, high error risk), your apartment unease (same net utility, but you reject the process).  
     - Rejects: Your feeling that *ex post* rationalization is irrational.  

  3. **Rule Rationalization**: "Use simple heuristics if (a) chosen *ex ante*, (b) revisable under new info, and (c) expected error cost < cost of optimization."  
     - Motivation: Chess rules (revisable strategy), lunch habit (no need to revise).  
     - Fails: Retirement (revisability violated), doctor (condition c false: tests cheap).  
     - Rejects: AI routing (not consciously "chosen"), triage nurse (no *ex ante* rule).  

  4. **Expected Loss Minimization**: "Minimize expected total loss, including opportunity cost of deliberation *and* cost of errors."  
     - Motivation: Hiring manager flip-flop (cost/error tradeoff), menu failure (error loss tiny, so optimize).  
     - Fails: None yet.  

  ### Stress Test  
  - **Apartments**:  
    - Cost-Adjusted Optimization says both searches are rational (identical net utility). But you reject your *ex post* version. **Break**: It cannot distinguish process-based unease, treating rationality as outcome-dependent. Expected Loss handles both: net gain identical.  
  - **Doctors**:  
    - Rule Rationalization fails triage (no *ex ante* rule). Expected Loss works: Doctor’s test cost low → error loss dominates; triage’s delay cost high → justifies stopping.  
  - **Lunch vs. Retirement**:  
    - Expected Loss: Lunch habit has low error cost (<$12 regret) and high daily decision cost; retirement has high error cost (catastrophic loss) and low review cost (hours/decade). Distinction preserved.  
  - **Regress (meta-deliberation)**:  
    - Expected Loss: Infinite deliberation has unbounded cognitive cost with no marginal gain → irrational. But the principle must apply *approximately* to avoid self-reference paradox. **Break**: If applied perfectly, it requires computing costs of self-application, which is infeasible.  

  ### New Cases  
  1. **Urgent Decision**: You must choose a lifesaving drug in 10 seconds from 100 options with unknown efficacy. You grab the first that seems plausible.  
     - **Verdict**: Rational (Expected Loss: delay fatal, error cost similar across options).  

  2. **Rule Tinkering**: A frugal person spends 10 hours/month optimizing their $5/month coffee budget.  
     - **Verdict**: Irrational (Expected Loss: effort cost > max error loss).  

  3. **Meta-Application**: Applying your rationality principle to itself — e.g., "Is calculating net utility worth the time?"  
     - **Verdict**: Rational only if done heuristically (e.g., "Use principle unless calculation cost > 1% of decision stakes"). Strict application risks regress.  

  ### My Verdict  
  Satisficing is not a distinct principle. It is cost-adjusted optimization in disguise. The core principle is:  
  > **A choice is rational iff it follows from a cognitive strategy that minimizes expected total loss (error cost + direct decision cost) across all feasible strategies, including the strategy of selecting strategies.**  

  **What you must give up**:  
  - Your intuition that your apartment search (same outcome, *ex post* rationalization) is irrational. If net costs/benefits match your roommate’s, the unease is non-rational hindsight bias.  
  - The hiring manager flip-flop **is** about the case: When search costs are near-zero (e.g., instant candidate ranking), satisficing is irrational; when high (e.g., interviews), it’s compelled. The verdict flips because the cost/error tradeoff flips.  

  **Repairs**:  
  - To avoid regress, the principle includes "feasible strategies" (heuristics suffice for meta-decisions).  
  - Distinctions like ex-ante/ex-post or "search vs. option" dissolve: All reduce to the net-loss calculus. Your cases confirm this — the only consistent weights are error costs, search costs, and revisability (which modulates error risk).
