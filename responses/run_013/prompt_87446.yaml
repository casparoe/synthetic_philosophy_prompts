prompt: |-
  I'm a TA and I have seventy-five minutes to teach a section on the difference between etiological and causal-role accounts of biological function. My students are biology majors with a year of biology behind them and no philosophy. Don't explain the distinction to me; plan the section. What has to come first and what depends on what, which single case should carry the whole thing, which misconceptions the students will arrive with or form and exactly where in the sequence each should be headed off, one question I can ask at the end to see whether the distinction landed, and what I should explicitly refuse to cover at this level.

  Build the spine from these two cases, which I invented and which need no lookup. One: an island bird whose wings were shaped by selection for flight, in a population that has been flightless for several hundred generations, the wings now too small to lift it and still grown at a real cost. Two: a beetle with a ridge on its thorax that is a developmental byproduct of a muscle attachment and was never selected for anything, which in this population's new, wetter habitat diverts rainwater and measurably improves survival.

  Say why these two rather than the heart, what a case like this must have and must not have in order to do the work, and why the two have to pull in opposite directions. Expect the students to hear function as purpose, as design, as whatever the trait currently does, or as something that presupposes a designer or a plan, and place each correction. Say what the closing question has to be able to distinguish. Continuous prose only, in American English — no headings, bullets, bold, or tables — and no readings.
reasoning: |-
  Okay, the user is a TA preparing a 75-minute section on etiological vs. causal-role accounts of biological function for biology majors. They've specified two original case studies (flightless bird wings and a beetle's ridge) as the core teaching tools and want a tightly structured plan addressing misconceptions, sequencing, and assessment. 

  First, I need to consider why the user rejected classic examples like the heart—likely because it's overused and blends both function accounts, muddying the distinction. Their invented cases are brilliant for polarization: one shows pure history-based function without current utility (bird wings), the other shows current utility without history (beetle ridge). This forces students into cognitive conflict. 

  The students' misconceptions will center on teleology—hearing "function" as purpose or design. I must embed corrections at specific points: when introducing "function" (break the design association), when presenting the bird case (stress that past selection ≠ current purpose), and during the beetle case (separate utility from intentionality). 

  The section spine must flow from problem → distinction → cases → consolidation. Starting with "What is a function?" hooks them immediately. After defining both accounts, the bird case illustrates etiological function despite current dysfunction, then the beetle case shows causal-role function without history. Sequencing them this way prevents the "current use = evolved purpose" fallacy. 

  For assessment, the closing question must force application to a new case while exposing which account they default to. I'll use a hypothetical trait with both history and novel use—if they focus on evolution, etiological landed; if they cite current benefit, causal-role stuck. 

  Crucially, I'll explicitly exclude function pluralism and selected-effect nuances—this intro level needs clean dichotomy. The cases must avoid ambiguity: no overlap in selection history or current utility. That's why the bird's wings have clear vestigial costs and the beetle's ridge is purely developmental. 

  Time allocation is tight: 10min setup, 25min bird case, 25min beetle case, 10min synthesis, 5min Q&A. Pacing hinges on the beetle case—students will resist "accidental utility as function," so I'll preempt that by linking it to their existing knowledge of exaptations. 

  The user's unspoken need? Confidence that philosophy won't lose the biology students. That's why every abstract point must tether to their prior bio knowledge (selection, adaptation, byproducts) and use active debate ("Is this a *real* function?"). No jargon, just their logic put to work.
answer: |-
  Here's how to build the seventy-five minutes, anchored in your cases and calibrated for biology majors new to philosophy, focusing on clarity and avoiding common traps. Start by acknowledging the word "function" is familiar but tricky in biology. Don't dive into definitions immediately. Instead, pose the core problem: "We talk about the *function* of traits all the time – the function of the heart is to pump blood, the function of chlorophyll is to capture light. But what does 'function' *actually mean*? Does it depend on what the trait does *now*, or does it depend on *why the trait is there* in the first place? Today, we'll untangle two very different ways biologists and philosophers think about this."

  Begin with the **Flightless Bird Case (15 minutes)**. Describe the island bird: wings shaped long ago by natural selection *for flight*, but now, for hundreds of generations, the wings are too small for flight and actually cost energy to grow. Ask: "Does this wing *have a function*? If so, what is it?" Students will likely say "flight" or "it used to have a function but doesn't anymore." Push: "Why do you say 'flight' if it *can't* fly now? What makes 'flight' its function?" Listen for hints of history ("because that's what it evolved for") or design/purpose language. **Head off the 'purpose/design' misconception here:** Explicitly state, "When we say 'function' in biology, we do *not* mean a conscious purpose or a design from an intelligent being. We mean something grounded in the natural processes of evolution. So, if we say flight is its function, it's not because a designer *intended* it, but because..." Guide them to the historical reason: natural selection *acting in the past* favored wings *because* they enabled flight. Introduce the **Etiological Account**: A trait's function is *what it was selected for* in the evolutionary past – the reason *why* the trait exists and persists. Emphasize *past selection* as the key. Point out the tension: the wing *has the function* of flight (etiological) even though it *doesn't and can't* perform that task now and even has a cost.

  Transition (5 minutes): "Okay, so function is about *historical reasons*, what the trait was *selected to do*. But is that the only way? What if something *is* useful now, but *wasn't* selected for that reason? Does it have a 'function'?"

  Introduce the **Beetle Case (20 minutes)**. Describe the beetle: a ridge on its thorax that exists solely as a developmental byproduct of how a muscle attaches – *never* selected for anything. Now, in its new wet habitat, this ridge diverts rainwater away from its spiracles, measurably improving survival. Ask: "Does this ridge *have a function*? If so, what is it?" Students will likely say "diverting rainwater" or "keeping it dry." Push: "But it was *never* selected for that! It's just an accidental bump. Does that matter? Is diverting water its *real* function?" Listen for conflating current effect with function ("it *does* it, so it *is* its function") or resistance because it wasn't "designed" for it. **Head off 'current use = function' and reinforce 'no designer'**: "Remember, function isn't about a designer. But it's also not *automatically* just whatever a trait happens to do right now. A rock might shade a seedling, but we wouldn't say shading is the rock's *biological function*. So, what's special here?" Guide them to see the ridge is *part of the organism* and its current effect (diverting water) *contributes significantly to the organism's survival or reproduction* in its current environment. Introduce the **Causal-Role Account**: A trait's function is *what it currently does* that *contributes causally* to the organism's survival and reproduction. Emphasize *current contribution* as the key. Point out the tension: the ridge *does not have* an etiological function (no selection history for it at all), but it *does have* a causal-role function (current beneficial effect).

  **Synthesis and Contrast (25 minutes):** Place the cases side-by-side. Use a simple table mentally (but don't draw it – describe it): "For the bird wing: Etiological function? Flight (past selection). Causal-role function? Arguably none now, or maybe something else (like display?), but *definitely not* flight. For the beetle ridge: Etiological function? None (no past selection). Causal-role function? Diverting rainwater (current contribution)." **Why these cases?** They are "pure" and pull in opposite directions, isolating the key difference cleanly. The bird has strong history but no current performance of that task (even dysfunction); the beetle has strong current contribution but zero history. Contrast this with the heart: it has a clear etiological function (pumping blood, selected for) *and* a clear causal-role function (pumping blood, contributing to survival now). This overlap makes it a *terrible* first teaching case because it obscures the distinction. A good case *must* clearly separate the two dimensions and *must not* have significant overlap or ambiguity about history or current contribution. **Address lingering misconceptions explicitly:**
  *   **"Function = Purpose":** Reiterate multiple times that neither account implies conscious purpose. Etiological function points to *past natural selection*, not intention. Causal-role function points to *current mechanistic contribution*, not goal-directedness.
  *   **"Function = Design":** Emphasize that "design" implies a designer, which biology rejects. Etiological function arises from the *unplanned* process of natural selection. Causal-role function arises from the *accidental* fit of a trait's current effect within a system.
  *   **"Function = Whatever it Does Now":** The beetle case tackles this. Stress that causal-role function requires the effect to be *beneficial and contribute* to fitness *now*. Not every effect is a function. The bird wing flapping uselessly isn't performing a function just by moving.
  *   **"Function Requires a Plan":** This ties into purpose/design. Hammer home that biological function, under both accounts, emerges from natural processes (evolution, current physiology), not a pre-existing plan.

  **Closing Question (5 minutes):** Pose a new case verbally: "Imagine a deep-sea fish that has a glowing lure. It evolved by selection *for attracting mates*. However, in its current habitat, the lure *also* accidentally attracts small prey items that the fish then eats, significantly boosting its nutrition. According to the *etiological* account, what is the function of the lure? According to the *causal-role* account, what is the function of the lure?" **Why this question?** It must force students to apply *both* definitions distinctly to a single trait with *both* a clear historical function *and* a clear current beneficial effect *different* from that history. The correct answer distinguishes: Etiological = attracting mates (past selection). Causal-role = both attracting mates (still contributes) *and* attracting prey (new contribution). This shows they grasp the core difference – history vs. current contribution – and that a trait can have multiple causal-role functions.

  **Explicitly Refuse to Cover:**
  1.  **Function Pluralism Debates:** Avoid saying "both are valid" or diving into whether one is "correct." Stick to describing the *distinction*. Don't adjudicate which account biologists "should" use.
  2.  **The 'Selected Effect' Nuance:** Don't get into fine-grained debates within the etiological account (e.g., most recent selection vs. original selection) unless a sharp student asks. Keep it as "what it was selected for."
  3.  **Mental States or Representations:** Absolutely avoid any discussion of intentionality, beliefs, or desires. Keep it strictly biological and mechanistic.
  4.  **Other Philosophical Accounts:** Mentioning there are other views (e.g., goal-contribution systems) is unnecessary and confusing. Stick to these two core, contrasting accounts.
  5.  **Detailed History of the Concepts:** No need to name Cummins, Wright, or the philosophical lineage. Focus on the conceptual difference using biological examples. The goal is functional literacy for reading biology, not philosophical scholarship.
