  What's novel about their proposal is shifting authority from the patient's past self to the document's interpreters. The "narrative veto" concept is interesting - it privileges the ability to articulate reasons over raw cognitive function. That feels psychologically astute: we often judge competence by coherence of explanation, not just correctness of decision.

  The decay clause shows impressive foresight. Annual reaffirmation addresses the "fossilized document" problem, though practical hurdles exist (would people really do this yearly?). The burden-relief concern is valid - making family enforce unwanted treatments could create moral injury. Maybe the solution is distinguishing between treatment refusals (which protect autonomy) and positive demands (which impose burdens)?

  Where I'd push back: the narrative veto might exclude people with expressive aphasia or limited education who can't articulate well. Also, their framework doesn't fully resolve conflicts between past values and present welfare - what if current demented self wants something harmful but can't explain why?

  If studies showed dementia patients consistently endorse their past directives when able to comprehend them, that would support the traditional view. Conversely, evidence of stable "experiential interests" (like enjoying ice cream) despite lost narrative capacity might justify overriding past instructions.

  My own blind spots: I'm probably underestimating how much advance directives comfort families by reducing decision fatigue. And I might be over-indexing on philosophical coherence at the expense of practical utility in crisis situations.

