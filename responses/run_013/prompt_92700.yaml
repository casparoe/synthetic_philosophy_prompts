  ## INTERNAL FAQ: GIFTS, FACILITATION PAYMENTS, & RECIPROCITY OFFSETS  
  **Global Integrity Standards Board (GISB) - Compliance Standards Division**  
  **Version 7.3 - STRICTLY CONFIDENTIAL - LEAK PROHIBITED**

  **Q1: What is the fundamental distinction between a permissible gift and an impermissible bribe?**  
  A1: The distinction lies in the **intent to influence** a specific official action *and* the **failure of reciprocity** within the normative timeframe established by the Gift Half-Life metric (see Q3). Permissible gifts express goodwill or cultural courtesy without creating an expectation of preferential treatment. Bribes seek to circumvent standard procedures or secure an unfair advantage, characterized by an absence of timely reciprocation.

  **Q2: How should Field Officers assess the intent behind a gift?**  
  A2: Intent is operationally defined by the **contextual matrix** (Annex B):  
  *   **Value:** Assessed against local median monthly income (LMMI) using the Standardized Purchasing Parity Module (SPPM). Items exceeding 0.5% LMMI trigger heightened scrutiny.  
  *   **Timing:** Proximity to a pending decision (e.g., contract award, permit issuance, inspection report) increases risk probability.  
  *   **Reciprocity Expectation:** Utilize the Gift Half-Life Calculator (GISB Portal, Form GHL-7). If the expected reciprocity window closes without a statistically significant counter-gesture, the item is presumptively reclassified as a bribe.  
  *   **Cultural Norm Codification:** Reference the Approved Cultural Gesture Registry (ACGR). Registered gestures (e.g., Festival Token Offerings Type 3a) are pre-cleared below value thresholds unless timing flags are present.

  **Q3: Explain the "Gift Half-Life" (GHL) metric and its application.**  
  A3: The GHL quantifies the culturally adjusted timeframe within which a counter-gesture must statistically occur (≥78% probability) to maintain the gift's status. Failure to reciprocate within this period indicates the initial gesture likely functioned as an inducement. GHL is calculated using the Hofstede-Putnam Reciprocity Coefficients embedded in the SPPM. Example Baseline GHLs (Standard GISB Urban Context):  

  | Gift Type                    | Baseline GHL (Days) | Notes                                      |
  | :--------------------------- | :------------------ | :----------------------------------------- |
  | Artisanal Craft Item         | 42                  | Extendable to 60 if ACGR-registered        |
  | Premium Food Basket          | 21                  | Reduce to 7 during procurement cycles      |
  | Bottle of Imported Spirits   | 14                  | Halved if recipient holds discretionary authority |
  | Unsolicited Cash Equivalent  | 0                   | Immediate reclassification; use Form BC-1  |

  **Q4: Are gifts offered *to* GISB staff or partner agency headquarters ever problematic?**  
  A4: Hospitality offered *to* staff or Head Office functions under **Separate Hospitality Protocols (SHP)**. SHP recognizes the inherent goodwill in hosting and relationship-building within established professional networks. Value thresholds under SHP are calibrated at 2.0% LMMI of the *host nation* (not the recipient's origin nation). Reciprocity expectations under GHL are suspended for SHP-compliant hospitality, as the act of hosting *is* the primary reciprocal gesture within the professional context. Focus remains on undue influence flowing *from* resource holder *to* decision-maker.

  **Q5: What about small payments demanded to expedite routine services ("facilitation payments")?**  
  A5: "Facilitation payments" are strictly prohibited under GISB Standard 4.7, regardless of local custom or nomenclature ("grease money," "speed money"). These payments are definitionally bribes: they are demanded *by* an official *to* perform a routine, non-discretionary duty they are already obligated to perform. They circumvent lawful procedures and create systemic distortion. Report all demands using Form FP-9.

  **Q6: How do Cultural Reciprocity Offsets (CROs) function within the compliance framework?**  
  A6: The CRO market recognizes that baseline GHLs and value thresholds may impose undue compliance burdens on entities operating in high-reciprocity-culture jurisdictions (HRCJs). Entities domiciled in low-reciprocity-index nations (LRINs) may purchase CRO credits from entities in HRCJs.  
  *   **Mechanism:** A LRIN entity (e.g., Northern Europe-based NGO) exceeding its hospitality budget or facing GHL non-compliance due to local obligations can purchase credits from an HRCJ entity (e.g., Southeast Asia-based firm) whose baseline cultural norms generate a "reciprocity surplus."  
  *   **Accounting:** Credits are deducted from the purchasing entity's "Net Hospitality Impact" (NHI) score on the annual Integrity Ledger. One CRO credit neutralizes 100 NHI points (equivalent to approx. 1.0% LMMI in standard hospitality expenditure or 7 days of GHL variance).  
  *   **Validation:** All CRO transactions require pre-approval via Form CRO-12 and verification by a Certified Reciprocity Auditor (CRA).

  **Q7: Local counterparts use terms like "solidarity," "mutual obligation," or "kinship duty" for exchanges we classify as high-risk. How should this be addressed?**  
  A7: While culturally resonant terminology exists, GISB standards provide a universal, objective framework for assessing integrity risk. Local terminology often lacks the precision necessary for compliance auditing and conflates socially embedded practices with transactions posing clear conflicts of interest. Field Officers should utilize the ACGR and SPPM to re-categorize local terms into Standardized Interaction Types (SITs) for consistent evaluation. Arguments that certain obligations are "inalienable" or exist outside market logic are semantic and do not alter the core risk of undue influence defined by intent and non-reciprocity.

  **Q8: Doesn't this framework inherently disadvantage partners in HRCJs?**  
  A8: The framework ensures a **level playing field** based on measurable integrity standards, not cultural relativism. The CRO mechanism provides a market-based solution for entities operating in HRCJs to manage compliance costs arising from cultural variance. The ultimate goal is harmonization towards global best practices, as defined by the GISB Integrity Index. Partners retain the option to implement stricter internal controls if local norms create operational friction with GISB standards.

  **Q9: What if a local practice is essential for maintaining trust and access but violates a GHL or value threshold?**  
  A9: All engagements must prioritize compliance with GISB standards. Practices violating thresholds cannot be justified by appeals to "local trust." Utilize the ACGR petition process (Form ACGR-P) to request codification of a specific practice. Pending approval, practices remain non-compliant. The CRO market exists precisely to mitigate such operational challenges while maintaining systemic integrity. Consult your Regional Integrity Officer for context-specific mitigation strategies.

  **//END FAQ//**  
  *Global Integrity Standards Board: Setting the Universal Benchmark for Ethical Conduct.*
