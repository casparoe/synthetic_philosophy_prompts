prompt: |-
  Ok so I've somehow ended up running the "logic and reasoning" track of our local rationality reading group, and next month its my turn to set the written exercise. I want to do Carroll's tortoise, but every write-up of it I can find is the same three paragraphs about how rules of inference aren't premises followed by a hand-wave, and I don't want people just regurgitating that. I need the exercise to actually seperate the people who get it from the people who skimmed the wiki page.

  Here's the setup I want the question built around. Keep it self-contained — I don't want it leaning on any real published positions, so don't have it demand names or citations; I want moves, not name-dropping. The tortoise accepts "P", accepts "P→Q", and won't accept "Q", and whenever you hand it the conditional that would license the step it just asks for that one as a premise too, forever. That's the standard bit. What I want to add is a second character — call her the mechanic — who says: fine, the tortoise is just a machine that prints "accept P", "accept P→Q", and never prints "accept Q", and if that's all "accepting" means then no mistake is being made, the tortoise is just a different kind of machine. And a third, the judge, who says no — "accepting P and P→Q" isn't a *description* of an internal state, it's a commitment, and the tortoise is violating it.

  I want one essay question, ~65 minutes, upper-undergrad / smart-reading-group level, that forces the student to (i) say precisely what the tortoise is demanding, and why the usual "rules aren't premises" line answers only one version of that demand and not the other; (ii) adjudicate between the mechanic and the judge — is "accepting a rule of inference" a descriptive fact about a system or a normative commitment, and can a creature that behaves like the tortoise be *wrong* rather than merely different; (iii) say whether the regress is vicious; and (iv) not punt with "modus ponens is just self-evident" or "we're just wired that way" without saying what work those lines are supposed to do. The whole point is to make them commit to a reading of what the demand *is* before they answer it — if they answer some version of the demand they never named, they should lose marks even if the answer is fine on its own terms.

  Then give me a model answer, about 600 words, and a marking scheme with five must-hit points, 4 marks each (20 total), plus for each point one line on how a student typically botches it. Keep the model answer honest about where its stipulating rather than deriving — I'd rather it say "I'm reading the tortoise as X, and on that reading..." than pretend there's a consensus on this.

  And end the whole response with a last line \answer{...} containing just the single distinguishing move — a short phrase, under 15 words — that a top answer makes and a mediocre one misses.
reasoning: |-
  We are designing an essay question and model answer for an upper-undergraduate / smart-reading-group level exercise on Carroll's tortoise. The goal is to have students engage deeply with the problem, avoiding superficial answers.

  The scenario involves:
  - The Tortoise: Accepts "P", accepts "P→Q", but does not accept "Q". When given a rule (like modus ponens) as a premise, it then requires the next rule, ad infinitum.
  - The Mechanic: Views the Tortoise as a machine that simply doesn't output "accept Q". There's no mistake, just a different design.
  - The Judge: Argues that "accepting" is a normative commitment, and the Tortoise is violating its commitments.

  The essay question should force students to:
  (i) Precisely state what the Tortoise is demanding and explain why the standard "rules aren't premises" response only addresses one version of the demand and not the other.
  (ii) Adjudicate between the Mechanic (descriptive) and the Judge (normative): Can the Tortoise be wrong, or is it just different?
  (iii) Discuss whether the regress is vicious.
  (iv) Avoid unanalyzed appeals to self-evidence or wiring.

  Additionally, we require a model answer (about 600 words) and a marking scheme with five must-hit points (each worth 4 marks, total 20), including typical mistakes for each point.

  Finally, the response should end with an \answer{} containing a short phrase (under 15 words) that distinguishes a top answer from a mediocre one.

  Let's design the essay question first.

  **Essay Question:**

  "Lewis Carroll's dialogue 'What the Tortoise Said to Achilles' presents a character (the Tortoise) who accepts the premises of a logical argument (P and P→Q) but refuses to accept the conclusion (Q). The Tortoise insists that any rule of inference (such as modus ponens) must be written as an additional premise, leading to an infinite regress. Consider two responses:

  1. The Mechanic: The Tortoise is simply a machine that, when given inputs P and P→Q, does not output Q. This is just a description of its operation; there is no error, only a different kind of system.

  2. The Judge: To accept a premise is to make a normative commitment. By accepting P and P→Q, the Tortoise is committed to Q, and its refusal is a failure to meet its commitments.

  Write an essay that addresses the following:

  a) Precisely what is the Tortoise demanding when it asks for a rule of inference to be written as a premise? Explain why the usual response that 'rules of inference are not premises' only resolves one aspect of the Tortoise's challenge and fails to address a deeper issue.

  b) Adjudicate between the Mechanic and the Judge: Is the Tortoise making a mistake (as the Judge claims) or is it merely operating differently (as the Mechanic claims)? In your answer, consider whether 'accepting a rule of inference' is a descriptive fact about a system or a normative commitment.

  c) Is the infinite regress that the Tortoise creates vicious? Why or why not?

  Throughout, avoid simply asserting that modus ponens is 'self-evident' or that we are 'wired' to use it without explaining how such claims might address the issue. Your essay should clearly articulate the nature of the Tortoise's demand and the kind of response it calls for."

  **Model Answer (Approx 600 words):**

  The Tortoise's challenge exposes a foundational issue in logic: the distinction between rules of inference and premises. The Tortoise demands that any rule enabling an inference must itself be added as a premise. However, this demand conflates two distinct roles: the premises as the content of an argument and the rules as the means by which we move from premises to conclusions. The standard response—that rules are not premises—correctly notes that rules are operatives, not content. But this only addresses the structural aspect. The deeper issue is normative: the Tortoise is demanding a justification for why one *should* apply the rule, and this justificatory demand cannot be met by adding another premise without restarting the regress.

  Consider the Mechanic and the Judge. The Mechanic views the Tortoise descriptively: as a system that, given inputs P and P→Q, does not output Q. From this perspective, the Tortoise is not malfunctioning; it is simply designed to require all rules as premises. In contrast, the Judge's view is normative: accepting P and P→Q entails a commitment to Q. If the Tortoise claims to accept the premises, then it is bound by the rules of logic. To reject Q is to violate that commitment. The Tortoise can be wrong because logic is not merely descriptive of how we think but prescriptive of how we ought to think. The Mechanic's view, while coherent, misses the normative force of logical commitment. A system that does not draw inferences might be useful for certain purposes (e.g., a database storing premises), but if it purports to reason, it must follow the rules.

  The infinite regress is vicious because it prevents the Tortoise from ever actually making an inference. Each new premise (like (P ∧ (P→Q)) → Q) only adds to the set of accepted statements without triggering the application of the rule. The regress arises because the Tortoise is asking for a justification that must be applied, and every justification offered becomes another statement to which the rule must be applied. But this is misguided: the application of a rule is an act, not a statement. The regress shows that justification must bottom out in something that is not a premise but a practice—a way of using the rule.

  Appeals to self-evidence or wiring are attempts to halt the regress, but they must be handled carefully. Saying modus ponens is "self-evident" might mean that we recognize its validity without further justification, but this does not explain why the Tortoise should accept it. Similarly, being "wired" for modus ponens is descriptive but does not establish its normative force. The key is to see that logic is a normative framework. The Tortoise's challenge forces us to acknowledge that at some point we must simply use the rules, not demand them as premises. This does not mean the rules are arbitrary; they are constitutive of rational thought. Thus, the Tortoise is not just different; it is irrational because it refuses to engage in the practice of inference.

  In conclusion, the Tortoise's demand is for a justification of rules that can only be given within the practice of using them. The Judge is right: the Tortoise is violating its commitments. The regress is vicious because it confuses the act of inference with the content of premises. The only way out is to recognize that inference rules are not premises but the very tools that allow us to move from premises to conclusions.

  **Marking Scheme (20 marks total, 4 per point):**

  1. **Clear explanation of the Tortoise's demand and the limitation of the standard response.**
     - Must hit: The Tortoise demands rules be treated as premises, and the standard response (rules are not premises) addresses the structural confusion but not the normative demand for justification.
     - Typical botch: Student only repeats that rules aren't premises without explaining the justificatory regress.

  2. **Adjudication between Mechanic and Judge: Normative vs. Descriptive.**
     - Must hit: The Judge's view is correct because accepting premises entails normative commitments, and the Tortoise can be wrong for violating them. The Mechanic's view is descriptive but ignores the normative aspect of reasoning.
     - Typical botch: Student says the Tortoise is just different without addressing the normative force of logical commitments.

  3. **Analysis of the regress: Is it vicious?**
     - Must hit: The regress is vicious because it prevents any inference from being drawn; each added premise requires another rule application, leading to paralysis.
     - Typical botch: Student says the regress is infinite but does not explain why that is problematic (i.e., it blocks inference).

  4. **Avoidance of unanalyzed appeals (self-evidence/wiring) and instead explaining their role.**
     - Must hit: Student does not simply assert self-evidence/wiring but explains that such appeals are attempts to stop the regress by pointing to foundational practices or dispositions, but they must be framed normatively to answer the Tortoise.
     - Typical botch: Student uses "self-evident" or "wired" as a full stop without explaining how it relates to the normative demand.

  5. **Clarity and coherence: Articulating the nature of the demand and the kind of response required.**
     - Must hit: The essay clearly states that the Tortoise's demand is for a justification that can only be met within the practice of inference, and thus the response must be a commitment to that practice.
     - Typical botch: The essay does not clearly define the demand and thus answers a different question.

  **Final \answer{}:**

  The distinguishing move is recognizing that the Tortoise's regress arises from a conflation of the act of inference with the content of premises. Thus:

  \answer{The rule must be applied, not merely stated as a premise.}
answer: |-
  ### Essay Question  
  **Title:** The Tortoise, the Mechanic, and the Judge: Reasoning, Rules, and Regress  

  **Prompt:**  
  In Lewis Carroll’s dialogue, the Tortoise accepts the premises "P" and "P→Q" but refuses to accept the conclusion "Q". When Achilles offers a rule (like modus ponens) to bridge the gap, the Tortoise demands it be added as a premise, restarting the cycle ad infinitum. Consider two responses:  
  - **The Mechanic**: The Tortoise is a machine that, when inputted with "accept P" and "accept P→Q", never outputs "accept Q". This is a descriptive fact—no mistake is made; the Tortoise is simply designed differently.  
  - **The Judge**: "Accepting" a premise is a normative commitment. By accepting P and P→Q, the Tortoise is rationally committed to Q, and its refusal is a violation of that commitment.  

  Write an essay addressing the following:  
  1. **The Tortoise’s demand**: Precisely what is the Tortoise asking for when it insists rules be written as premises? Explain why the standard reply ("rules of inference are not premises") resolves only a surface-level issue but fails to address a deeper challenge.  
  2. **Mechanic vs. Judge**: Is the Tortoise making a *mistake* (as the Judge claims) or merely operating *differently* (as the Mechanic claims)? In your answer, analyze whether "accepting a rule of inference" is a descriptive fact about a system (like a machine’s design) or a normative commitment (like a rational obligation).  
  3. **The regress**: Is the infinite regress vicious? Why or why not?  

  Avoid unanalyzed appeals to "self-evidence" or "wiring"—if you raise these, explain what work they do in your argument. Crucially, define the Tortoise’s demand clearly before responding to it; answers that address an unnamed demand will be penalized.  

  ---

  ### Model Answer (Approx 600 words)  
  The Tortoise’s demand exposes a tension between the *structure* and the *force* of logical inference. It asks for rules like modus ponens to be treated as premises—explicit statements (e.g., "R: If P and P→Q, then Q") that must be accepted before moving to Q. Superficially, this conflates rules with premises: rules are *operators* that govern how premises yield conclusions, not *content* to be accepted. The standard reply ("rules aren’t premises") corrects this structural error by noting that adding R as a premise doesn’t solve anything—it only creates a new gap (between P, P→Q, R and Q), requiring another rule (e.g., R₂: If P, P→Q, and R, then Q). But this misses the Tortoise’s deeper *normative* demand: it seeks a *justification* for why R *must* be applied. The Tortoise isn’t just confused about logic’s architecture; it challenges why we should ever "move" from premises to conclusions at all. The structural reply answers "how" inference works but not "why" it binds us.  

  This reveals the Mechanic-Judge dispute. The Mechanic views acceptance descriptively: the Tortoise is a system with defined inputs (P, P→Q) and outputs (never Q). No error occurs; it’s like a calculator with missing functions. But the Judge insists acceptance is normative: to "accept P and P→Q" is to commit to their logical consequences. If the Tortoise *genuinely* accepts these premises while denying Q, it violates its own commitments—like promising to pay a debt but refusing when billed. I side with the Judge. Rules of inference aren’t mere descriptions of behavior; they are norms constitutive of rationality. A machine (e.g., a rock) can lack such norms, but if the Tortoise *engages in reasoning*—claiming to "accept" premises—it enters a space of reasons where it can be wrong. The Mechanic reduces reasoning to cause-and-effect, ignoring that logic governs what we *ought* to accept. A creature like the Tortoise isn’t just "different"; it is irrational because it resists the internal momentum of its own commitments.  

  The regress is vicious because it paralyzes reasoning. Adding premises endlessly (R, R₂, R₃, ...) never compels the Tortoise to infer Q—each new premise becomes inert content, demanding *another* rule to activate it. This stalls all inference, reducing logic to a static list of "accepted" statements. Crucially, the regress isn’t just infinite; it’s futile. It arises because the Tortoise mistakes the *act* of applying a rule (a normative "move") for a *proposition* (a descriptive "fact"). No proposition can compel its own application—that requires a practice of *using* rules, not just stating them. Appeals to "self-evidence" (e.g., "modus ponens is obvious") or "wiring" (e.g., "humans are built to infer") try to halt the regress by anchoring inference in psychology. But they fail normatively: self-evidence might explain why *we* stop the regress, but not why the Tortoise *should*. Wiring describes how we *do* reason, but not how we *ought* to. These appeals only work if we shift from description to normativity—e.g., "reasoning demands we treat certain rules as bedrock."  

  In sum, the Tortoise demands a justification for rule-application that transcends structure. The Judge rightly condemns this as a normative failure. The regress is vicious, forcing us to recognize that inference begins not with more premises, but with the commitment to *apply* rules.  

  ---

  ### Marking Scheme (20 marks total; 4 marks per point)  
  1. **Precise articulation of the Tortoise’s demand and critique of the standard reply**  
     - Must-hit: Clearly distinguishes the surface (structural) demand (rules as premises) from the deeper (normative) demand (justification for rule-application). Notes that "rules aren’t premises" addresses only the structural issue.  
     - Typical botch: Vaguely describes the demand (e.g., "Tortoise wants more premises") or claims the standard reply fully resolves the problem.  

  2. **Adjudication between Mechanic and Judge with normative/descriptive analysis**  
     - Must-hit: Explicitly rejects the Mechanic’s descriptive view and endorses the Judge’s normative stance, arguing that "accepting a rule" entails rational commitments. States that the Tortoise is *wrong* (not just different) if it engages in reasoning.  
     - Typical botch: Equates the views without taking a stand or claims the Tortoise is "just different" without addressing normativity.  

  3. **Assessment of the regress as vicious**  
     - Must-hit: Identifies the regress as vicious because it prevents inference (each added premise requires another rule, causing paralysis). Explains why infiniteness alone isn’t the issue—e.g., it blocks action.  
     - Typical botch: Calls the regress "infinite but not problematic" or confuses viciousness with mere endlessness.  

  4. **Avoidance of unanalyzed appeals (self-evidence/wiring) and explanation of their role**  
     - Must-hit: If raised, explains that appeals to self-evidence/wiring describe psychological stopping points but fail to resolve the normative demand unless framed as part of a practice.  
     - Typical botch: Uses "self-evident" or "wired" as a full stop without justifying their normative force.  

  5. **Clarity and commitment to a defined demand**  
     - Must-hit: Opens by defining the Tortoise’s demand (structural + normative) and consistently addresses it. Avoids shifting to an unnamed demand.  
     - Typical botch: Answers a different challenge (e.g., "Tortoise doubts logic") without grounding in the prompt.  

  ---

  \answer{Inference requires applying rules, not just listing premises.}
