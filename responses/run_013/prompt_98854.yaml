prompt: |-
  I'm a release engineer — I spend my days in git, tags, semver, release trains, and the politics of who's actually allowed to cut a release. I've been reading about the Anthropocene fight (when did it start, who gets to decide) and I want the whole debate restated in my vocabulary: the geological time scale as the repo history, epochs and ages as nested tags, the "golden spike" as a tag pinned to one commit in one file instead of a floating label, the stratigraphy commissions as the maintainers and the umbrella body as the org that has to merge the PR, correlating a boundary across the whole planet as resolving that same tag in every fork, and the working group's proposal — they wanted to pin the epoch to a mid-century plutonium fallout horizon in a Canadian lake sediment core — as a PR that got closed, not merged, in 2024. Be as faithful as you can and don't cheat by quietly importing my assumptions.

  Then the residue report, which is what I actually want. Which parts carried over with no loss, which only fit if you fudge something, and which have no counterpart in my vocabulary at all. In particular: is "when did it start" really the same kind of question as "where do we cut the release," and is the thing historians and Earth-system people mean by the Anthropocene — the one they're going to keep using whether or not the vote went their way — something versioning can even represent?

  Sections, in this order: The mapping (roughly 400 words), What carried over cleanly (200), What you had to fudge (200), What didn't survive at all (300), and Your call on the residue (150) — is the leftover a gap in my framework, or a sign the geologists are disagreeing about less than they think they are? American English please.
