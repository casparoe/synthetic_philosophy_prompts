prompt: |-
  I'm building a worked example for a seminar on the old evidence problem, and I want something better than the Mercury-perihelion chestnut everyone uses. Here's the spec.

  Construct a case where some chunk of evidence e is already common knowledge in a field before the fact -- it's in the textbooks, nobody in the field is in a position to doubt it -- and then a new hypothesis H is proposed that's supposed to explain e. Two things have to be true of the case: (1) it really does look like e confirms H, and (2) it's structured so that the usual fix for the old evidence problem (the move that says "just ask what your credence in H would've been given e if you hadn't already known e") is ill-defined, not merely hard to compute. And I want the ill-definedness to come from a specific source: H's concepts or vocabulary got built up partly using e, so there's no coherent "you minus e" who could still even have a prior over H.

  Then do the walkthrough: (a) what strict conditionalizing says about whether e confirms H here, (b) what the counterfactual fix is trying to say and precisely where it breaks down, and (c) what the "confirmation is a logical relation between evidence and hypothesis, and when you happened to learn the evidence is irrelevant" line says. Finish by telling me which single feature of the case is doing the work -- if I make e old for me but brand new for you (I've read the paper, you haven't), does the interesting disagreement survive or does it evaporate? Say which and why.

  Keep the scenario to about a paragraph, you don't need to invent any numbers, and make it a science-or-medicine example that feels real rather than a toy. Also pls don't just give me a bibliography, just the case and the reasoning.
