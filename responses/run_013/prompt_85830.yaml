  For the model answer, I need to demonstrate three layers: 
  First, show why this case isn't murder for Anscombe—deaths are side effects, not intended as means or ends. 
  Second, argue this proves her position isn't reducible to "no killing innocents ever," since she permits foreseen deaths under proportionality. 
  Third, tweak the case to require intention: maybe if the commander *wants* civilian deaths to deter future resistance, or if destroying the road itself is tactically necessary. 

  The marking scheme must guard against common pitfalls. Top marks (A) should require: correctly applying DDE's four conditions to the case, distinguishing intention from foresight, and modifying the scenario to alter intention without changing outcomes. A B answer might conflate omission with intention or miss how proportionality operates separately. C answers likely retreat to generic pacifism or misstate DDE. 

