prompt: |-
  I'm setting the final for a final-year seminar on intention and war; the last unit is Anscombe on Truman. I want one essay question, 90 minutes, that can't be answered by reciting the doctrine of double effect and tutting about Hiroshima. The crux I'm after is whether her objection to Truman actually needs the intention/foresight distinction, or whether it just collapses into the flat claim that killing the innocent is wrong even when you only foresee it -- because those two give different verdicts on the case below, and I want students to see that. Please write the question, then a model answer of about 600-700 words, then a marking scheme out of 25 that says which specific moves an A answer has to contain, which mistakes should cap a student at a B, and roughly how the 25 breaks down.

  The case has to be built into the question so they can't just recyle the historical examples: a commander orders a night raid on a rail junction that is also the only road out of a town, so the town's civilians will certainly die in the raid; the military value of the raid doesn't depend on them dying in any way, but he cancels the leaflet warning he'd planned because dropping it would tip off the enemy. Deaths foreseen and certain, not a means, and the omission is deliberate. Ask whether Anscombe is committed to calling that murder, and on which premise; if she isn't, what that tells us about how to read her. Then have them say what would have to change about the commander's intention, or about the causal structure of the case, for it to come out the other way. Marking scheme should be concrete enough to hand to a TA, and I want the B/C boundary defined too.
