  Right, for the committed epiphenomenalist response: I'll need to bite the bullet on the box analogy while denying it undermines the theory. The key move is separating the representational content of beliefs from their causal history. And I must maintain that the brain state explains both the experience and the perfect report, even if that makes knowledge seem "lucky" - that's the price of the position.

