answer: |-
  **Examination Question**

  **Social Learning and Information Aggregation**  
  Three risk-neutral agents, A, B, and C, act sequentially. The state of the world, θ, is equally likely to be 0 or 1. Each agent chooses to adopt (1) or reject (0). The payoff is 1 if the action matches θ and 0 otherwise, minus a cost of c > 0 if a private signal is purchased. The private signal s ∈ {0,1} is correct with probability p ∈ (1/2, 1), so P(s = θ | θ) = p. The decision to purchase a signal and the signal realization are private, but the action is public. Agent A moves first, B second, and C third. An agent who does not purchase a signal acts based on the prior and observed history. Agents cannot commit to strategies before knowing their signals. Use p = 2/3 and c = 1/20.

  **(i)** Derive the perfect Bayesian equilibrium of this game. Explicitly compute agents' signal-purchase decisions, actions, and beliefs. [12 marks]  
  **(ii)** In your equilibrium from (i), does a *herd* occur? Does an *information cascade* occur? Explain the difference in this context. Also, show that agent C rationally ignores that an earlier agent’s action was based on a purchased signal. [8 marks]  
  **(iii)** Compare the total expected welfare (sum of payoffs) in your equilibrium to the welfare when a social planner forces B to purchase a signal (with other agents acting optimally). Which yields higher welfare? By how much? [5 marks]  
  Then answer:  
  **(a)** Does the equilibrium exhibit a *negative informational externality*? Explain briefly. [2 marks]  
  **(b)** Suppose a public signal of precision q > 1/2 is released after A acts but before B acts. Is the herd (if present) necessarily broken? Explain. [3 marks]  

  ---

  **Model Answer**  

  **Part (i): Perfect Bayesian Equilibrium**  
  *Agents act sequentially. We solve backward, starting with C, then B, then A. Use p = 2/3, c = 1/20.*  

  **Agent C's Decision:**  
  C observes history (a_A, a_B). In equilibrium (derived below), B herds on A, so a_B = a_A. Thus, history is either (1,1) or (0,0).  
  - If (1,1): A’s action reveals s_A = 1 (as A follows its signal). Posterior:  
    P(θ=1 | a_A=1) = P(θ=1 | s_A=1) = [P(s_A=1|θ=1)P(θ=1)] / P(s_A=1) = [(2/3)(1/2)] / [(2/3)(1/2) + (1/3)(1/2)] = (1/3) / (1/2) = 2/3.  
    C’s optimal action without signal: Choose 1, payoff = 2/3.  
    With signal: Expected payoff = P(s_C correct) = p = 2/3. Net payoff = 2/3 − 1/20 = 40/60 − 3/60 = 37/60 < 40/60 = 2/3. Thus, C does not buy; chooses 1.  
  - If (0,0): Posterior P(θ=1 | a_A=0) = P(θ=1 | s_A=0) = [(1/3)(1/2)] / [(1/3)(1/2) + (2/3)(1/2)] = (1/6)/(1/2) = 1/3.  
    Without signal: Choose 0, payoff = 2/3. With signal: Net payoff 37/60 < 40/60. Thus, C does not buy; chooses 0.  

  **Agent B's Decision:**  
  B observes a_A. A buys and follows signal, so a_A = s_A.  
  - If a_A = 1: Posterior P(θ=1 | s_A=1) = 2/3.  
    Without signal: Choose 1, payoff = 2/3.  
    With signal: B updates using s_B and s_A.  
    P(θ=1 | s_A=1, s_B=1) = [P(s_A=1,s_B=1|θ=1)P(θ=1)] / P(s_A=1,s_B=1) = [(2/3)(2/3)(1/2)] / [(2/3)(2/3)(1/2) + (1/3)(1/3)(1/2)] = (4/18)/(5/18) = 4/5. Choose 1, payoff 4/5.  
    P(θ=1 | s_A=1, s_B=0) = [P(s_A=1,s_B=0|θ=1)P(θ=1)] / P(s_A=1,s_B=0) = [(2/3)(1/3)(1/2)] / [(2/3)(1/3)(1/2) + (1/3)(2/3)(1/2)] = (2/18)/(4/18) = 1/2. Choose arbitrarily (say 1), payoff 1/2.  
    Expected gross payoff = P(s_B=1) × (4/5) + P(s_B=0) × (1/2).  
    P(s_B=1 | s_A=1) = P(s_B=1|θ=1)P(θ=1|s_A=1) + P(s_B=1|θ=0)P(θ=0|s_A=1) = (2/3)(2/3) + (1/3)(1/3) = 4/9 + 1/9 = 5/9.  
    Thus, expected payoff = (5/9)(4/5) + (4/9)(1/2) = 4/9 + 2/9 = 6/9 = 2/3. Net payoff = 2/3 − 1/20 = 37/60 < 2/3 = 40/60. ∴ B does not buy; herds by choosing a_A = 1.  
  - If a_A = 0: Posterior P(θ=1) = 1/3. Without signal: Choose 0, payoff 2/3.  
    With signal: Similar calculation shows expected gross payoff = 2/3. Net 37/60 < 40/60. ∴ B does not buy; herds (chooses 0).  

  **Agent A's Decision:**  
  No history. Prior P(θ=1) = 1/2.  
  Without signal: Max action gives payoff 1/2.  
  With signal:  
    If s_A=1, P(θ=1|s_A=1) = 2/3, choose 1, payoff 2/3.  
    If s_A=0, P(θ=1|s_A=0) = 1/3, choose 0, payoff 2/3.  
  Expected gross payoff = (1/2)(2/3) + (1/2)(2/3) = 2/3. Net payoff = 2/3 − 1/20 = 37/60 > 1/2 = 30/60. ∴ A buys signal and follows it.  

  **Equilibrium Summary:**  
  - A: Buys signal, acts on it (a_A = s_A).  
  - B: Does not buy, herds (a_B = a_A).  
  - C: Does not buy, herds (a_C = a_A).  

  ---

  **Part (ii): Herd, Cascade, and Rational Ignoring**  
  - **Herd:** Yes, a herd starts at B and continues with C, as both follow A’s action regardless of θ.  
  - **Cascade:** Yes, an information cascade starts at B. B and C do not purchase signals, so their actions reveal no new private information. After A, no further information enters the public domain.  
  - **Difference:** A *herd* is behavioral: agents choose the same action. A *cascade* is informational: agents stop revealing private signals. Here, the cascade (no information acquisition) causes the herd (identical actions).  
  - **Rational Ignoring by C:** C observes (a_A, a_B) = (x,x) for x∈{0,1}. In equilibrium, a_A = s_A and a_B = a_A, so history perfectly reveals s_A. C’s posterior depends only on s_A, not on *why* B chose a_B (i.e., not on B’s signal-purchase decision). Since C’s belief is P(θ=1 | s_A) (2/3 or 1/3), and buying a signal yields net 37/60 < 40/60, C rationally ignores B’s decision process and herds.  

  ---

  **Part (iii): Welfare and Externality**  
  **Welfare Comparison:**  
  - *Equilibrium (no forced purchase):*  
    A’s payoff: 2/3 − 1/20 = 37/60.  
    B and C: Each correct with prob 2/3 (herd on A, who is correct with prob 2/3), so payoff 2/3 = 40/60 each.  
    Total welfare: 37/60 + 40/60 + 40/60 = 117/60 = 39/20.  
  - *Social Planner (forces B to buy signal):*  
    A: Buys, net 37/60.  
    B: Forced to buy. Given a_A, B’s expected gross payoff = 2/3 (as in (i)), net 37/60.  
    C: Observes (a_A, a_B). With B forced to buy but herding (as tie-break when indifferent), history still (x,x). C does not buy, payoff 40/60.  
    Total welfare: 37/60 + 37/60 + 40/60 = 114/60 = 19/10.  
  - **Comparison:** Equilibrium welfare (39/20 = 1.95) > Forced welfare (19/10 = 1.90) by 3/60 = 1/20.  

  **(a) Negative Informational Externality?**  
  Yes. B’s decision not to buy imposes a negative externality on C. If B bought a signal, their action might reveal s_B, helping C. But B ignores this social benefit, as they only consider private net payoff (37/60 < 40/60). Thus, B underinvests in information.  

  **(b) Herd Fragility to Public Signal:**  
  Not necessarily broken. Suppose a public signal z (precision q > 1/2) arrives after A.  
  - Example: If a_A = 1 and z = 0, B’s posterior is P(θ=1 | s_A=1, z=0) = [P(z=0|θ=1)P(s_A=1|θ=1)P(θ=1)] / P(s_A=1,z=0) = [(1−q)(2/3)(1/2)] / [ (1−q)(2/3)(1/2) + q(1/3)(1/2) ] = 2(1−q)/(2−q).  
    If q > 2/3, then 2(1−q)/(2−q) < 1/2, so B chooses 0 (different from A), breaking the herd.  
    If q < 2/3, 2(1−q)/(2−q) > 1/2, so B herds (chooses 1), and herd persists.  
  ∴ Herd breaks only if q is high and z contradicts A.  

  ---

  **Marking Scheme**  
  Total: 25 marks  

  **Part (i): Equilibrium Derivation [12 marks]**  
  - A’s decision: Buys signal, acts on it (posterior and cost-benefit correct). [3]  
  - B’s decision: No purchase, herds for both a_A=1 and a_A=0 (explicit posterior and payoff for each case). [5]  
  - C’s decision: No purchase, herds (posterior correct for both histories). [2]  
  - Equilibrium summary: Actions and purchases fully specified. [2]  
  *Common error: Miscalculating posteriors (e.g., not using Bayes) or ignoring cost in net payoff.*  

  **Part (ii): Herd, Cascade, and Rational Ignoring [8 marks]**  
  - Herd identified (starts at B). [1]  
  - Cascade identified (starts at B, no new information). [1]  
  - Correct difference explained (behavioral vs. informational). [2]  
  - C’s rational ignoring: Correct posterior (based on history only) and cost-benefit. [4]  
  *Common error: Conflating herd with cascade; not justifying why C ignores B’s decision.*  

  **Part (iii): Welfare and Externality [5 + 2 + 3 = 10 marks]**  
  - Welfare comparison: [5]  
    - Equilibrium welfare correct (117/60). [2]  
    - Forced-B welfare correct (114/60). [2]  
    - Correct comparison (equilibrium higher by 3/60). [1]  
  - (a) Negative externality: Yes, with explanation (B ignores benefit to C). [2]  
  - (b) Herd fragility: Not necessarily, with example (q > 2/3 and contradicting signal breaks herd). [3]  
  *Common error: In welfare, omitting cost or miscalculating payoff; in (a), missing the externality; in (b), claiming herd always breaks.*
