  Camp B (Williams defender) contends that even at the criterion level, committing to maximizing impersonal value forces agents to see their projects as dispensable if they don't contribute optimally. Integrity involves commitments that shouldn't be overridden by impartial demands. The one-thought-too-many problem persists because the justification for personal actions still relies on impersonal grounds, which is alienating.

  Agreed claims need common ground: both sides accept Williams' description of the Jim case, distinction from negative responsibility, that alienation is about identity, and that theories should guide deliberation without being oppressive. Also, both agree that crude deliberative utilitarianism is problematic.

