prompt: |-
  Ok, I'm putting together materials for my ethics seminar and I want an adversarial-collaboration document on Williams's integrity objection — the one-thought-too-many thing, the Jim case, the whole business about whether consequentialism alienates you from your own projects and your ground projects.

  Take two camps and have them write the thing together. Camp A is a sophisticated consequentialist — not the strawman who says you have to consciously run the sums before every act, but someone who's absorbed the criterion-of-rightness vs decision-procedure distinction and thinks that once you grant it, the integrity objection loses its teeth, because it was only ever aimed at a crude deliberative utilitarianism. Camp B is a Williams-style integrity defender who thinks the objection survives all that, because even a criterion-level commitment to impersonal maximization asks the agent to treat the things that give her life its shape as just more items in the ledger.

  I want the document these two could actually co-sign after a real, good-faith collaboration. So:

  1. A numbered list of claims both can sign — about what the objection is even claiming, about what it isn't (be careful to seperate the integrity objection from the separate complaint about negative responsibility, and from the moral-luck stuff, since people conflate those constantly), about what a theory of rightness owes the deliberating agent, and about which cases both agree are in play.

  2. The precise disagreements, each stated in wording its own side would accept — so give me each side's own formulation, not a neutral paraphrase that neither would actually endorse.

  3. The cruxes — the sub-questions such that settling one would move at least one side. I've got a hunch one is whether the criterion/decision-procedure split is a genuine distinction or a dodge, and another is whether integrity can be given weight inside a consequentialist framework at all, or is precisely the thing that resists being weighed. But don't just take my hunches — find the real cruxes.

  4. For each crux, a case or arguement both sides would accept as bearing on it, with each side's prediction written down in advance. For instance, for the first crux, is there a scenario where the sophisticated consequentialist and the Williamsian would predict different things about what the agent's deliberation looks like from the inside?

  Format it as a numbered agreed-claims section, then a disagreements table with columns for the question, each side's position, the crux it turns on, and the evidence/prediction. And if part of the fight turns out to be merely verbal — the two sides using integrity or alienation in different senses — say which part and why, don't paper over it.

  Don't bother with citations or reading lists, just do the philosophy.
