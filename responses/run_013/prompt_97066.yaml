  First, I need to recall Williams' integrity objection. The Jim case involves Jim facing a choice to kill one Indian to save nineteen, while Pedro kills all twenty. Williams argues that consequentialism forces Jim to view his personal projects as just another factor in the calculation, leading to alienation. The one-thought-too-many critique is about consequentialists requiring an agent to justify personal relationships through impersonal moral calculus, which feels alienating.

