prompt: |-
  I am a PhD student in philosophy writing a chapter on standing to blame, and before I read further into the literature I want the desiderata any adequate theory of standing must meet, not a survey of positions. Write the requirements: the theory must distinguish standing from warrant and from blameworthiness; it must explain why hypocrisy sometimes undermines blame and sometimes does not, including the case where the hypocrite's criticism is correct; it must handle the reformed wrongdoer, the concurrent wrongdoer who is also a victim, the beneficiary who blames others for a system he upholds, the meddling third party, institutional and role-based blame, the blamer who is not in a position to make a difference, and the case where the blamee waives the standing objection; it must say how standing is lost, regained, and transferred; it must distinguish standing to blame from standing to resent, punish, and forgive; it must say whether there is standing to praise and why the asymmetry with blame exists; and it must avoid both global skepticism about blame and the trivialization of hypocrisy while accounting for the social function of blame. For each requirement, give the case or consideration behind it, mark it as non-negotiable or as a commitment of a particular camp, and flag any pair you suspect cannot be jointly satisfied. Do not hedge: commit to which requirements are genuine and which are prejudices of a camp. Then take a definite position on which single requirement excludes the most popular theories, and briefly say how the main families of view fare against the list. Lead with your bottom line in the first sentence, then the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a PhD student in philosophy working on standing to blame. They need a clear list of desiderata for any adequate theory of standing, not a survey of existing positions. I need to recall what standing to blame means. It's about whether someone has the right or authority to blame, separate from whether the blame is warranted or the person is blameworthy. 

  The user has specified several requirements. Let me list them out to ensure I cover each one. First, the theory must distinguish standing from warrant and from blameworthiness. That's crucial because many theories conflate these concepts. For example, just because someone deserves blame doesn't mean anyone has the standing to blame them. 

  Next, explaining hypocrisy's variable impact. Hypocrisy sometimes undermines standing but not always, even when the criticism is correct. Cases like a corrupt politician blaming corruption—why can they still have standing? This requires a nuanced approach. 

  Then, handling specific cases: the reformed wrongdoer (can they blame others for similar offenses?), the concurrent wrongdoer who is also a victim (e.g., a cheating spouse blaming their partner), the beneficiary blaming others for a system they uphold (like a wealthy person blaming inequality), the meddling third party (someone with no connection intervening), institutional roles (like a judge blaming), someone who can't make a difference, and when the blamee waives standing objections. 

  The theory must also cover how standing is lost, regained, transferred. Plus, distinguish standing to blame from other reactive attitudes like resentment, punishment, forgiveness. Is there standing to praise? Why is there an asymmetry with blame? 

  Finally, avoid global skepticism about blame while not trivializing hypocrisy, and account for blame's social function. 

  Now, I need to mark each requirement as non-negotiable or camp-specific. The distinction from warrant and blameworthiness is non-negotiable; it's foundational. Hypocrisy's variable impact might be non-negotiable too, as it's a key puzzle. Cases like the reformed wrongdoer—some camps might see them as having standing, others not, so I'll note that. The asymmetry between blame and praise is likely a commitment of certain camps, as some theories might treat them symmetrically. 

  Flagging pairs that might conflict: For instance, explaining why hypocrisy undermines standing and yet the correct hypocritical criticism still holds—could this conflict with avoiding trivialization of hypocrisy? Also, the beneficiary case might conflict with how standing is transferred or regained, depending on the theory. 

  The user wants me to commit to which requirements are genuine versus camp prejudices. I think distinguishing standing from warrant and blameworthiness is genuine. Hypocrisy's variability is also genuine. Cases like the meddling third party are non-negotiable tests. The asymmetry with praise might be a camp commitment—some theories might not see it as essential. 

  Taking a definite position: The requirement that excludes most popular theories is probably explaining hypocrisy's variable impact, especially when the hypocrite is correct. Relational theories might handle some cases but struggle here. Control theories might have similar issues. 

  Main families: Relational theories focus on personal connections but might not handle institutional roles well. Quality of will theories could blur standing with blameworthiness. Participation theories might struggle with meddling third parties. 

  The bottom line: The hypocrisy requirement is the biggest challenge. Start with that, then list all requirements with cases, marking them as non-negotiable or camp-specific, flag conflicts, and end with how theories fare.
answer: |-
  **The requirement to explain hypocrisy's variable impact—especially when the hypocrite's criticism is correct—excludes most popular theories of standing.** This necessitates a non-univocal account of hypocrisy that avoids reducing it to mere inconsistency or epistemic unreliability, demanding a deeper normative link between the blamer's own relationship to the norm and their authority to invoke it against others. Below are the requirements, their grounding cases/considerations, status, and potential conflicts.

  1.  **Distinguish standing from warrant and blameworthiness.**
      *   *Case:* A stranger correctly identifies and condemns a murderer (warranted blame, blameworthy agent), but may lack the *right* to blame due to no relevant relationship.
      *   *Status:* **Non-negotiable.** Foundational to the concept of standing as a distinct normative condition for *issuing* blame, separate from the blamee's desert (blameworthiness) or the truth of the blame (warrant).

  2.  **Explain hypocrisy's variable impact (including correct hypocrites).**
      *   *Case:* A corrupt politician condemning corruption *sometimes* lacks standing (undermined), but *sometimes* retains it (e.g., when speaking officially or exposing worse corruption), even when the condemnation is factually correct.
      *   *Status:* **Non-negotiable.** A core puzzle; failure here trivializes hypocrisy or makes standing implausibly fragile/robust. *Conflict Flag:* Jointly satisfying this and requirement #8 (avoiding skepticism/trivialization) is highly challenging.

  3.  **Handle the Reformed Wrongdoer.**
      *   *Case:* Can someone who committed similar wrongs in the past but has genuinely reformed now blame others for that same wrong?
      *   *Status:* **Non-negotiable.** Tests whether standing depends on current moral purity or can be regained through reform.

  4.  **Handle the Concurrent Wrongdoer-Victim.**
      *   *Case:* A spouse who cheats (wrongdoer) blaming their partner who also cheated (victim of the partner's cheating, but wrongdoer themselves). Do their own wrongs undermine their standing to blame the specific wrong done *to them*?
      *   *Status:* **Non-negotiable.** Tests the scope of "clean hands" and the interplay between being victimized and being blameworthy.

  5.  **Handle the Complicit Beneficiary.**
      *   *Case:* A wealthy executive benefiting from and upholding an unjust economic system blaming poorer individuals within that system for minor transgressions.
      *   *Status:* **Non-negotiable.** Tests standing against systemic complicity and the blamer's role in creating/manifesting the context of the wrong. *Conflict Flag:* Resolving this may create tension with #3 (reformed wrongdoer) if reformation requires systemic disavowal.

  6.  **Handle the Meddling Third Party.**
      *   *Case:* Someone completely uninvolved and unaffected by a wrong or the relevant norm-community blaming the wrongdoer (e.g., a random person on the internet condemning a private family dispute).
      *   *Status:* **Non-negotiable.** Tests the necessity of a meaningful connection for standing.

  7.  **Handle Institutional/Role-Based Blame.**
      *   *Case:* A judge sentencing a criminal, or a supervisor reprimanding an employee. Does the role confer standing independent of the officeholder's personal moral status (e.g., if the judge is also corrupt)?
      *   *Status:* **Non-negotiable.** Shows standing isn't purely interpersonal; roles create normative authorities.

  8.  **Handle the "Cannot Make a Difference" Blamer.**
      *   *Case:* Someone blames a wrongdoer despite knowing the blame will have no effect on the wrongdoer's future behavior or understanding (e.g., blaming a terminally ill, unrepentant wrongdoer).
      *   *Status:* **Non-negotiable.** Tests if standing requires the potential for efficacy or is purely about normative position/expression.

  9.  **Handle Waiver of Standing Objection.**
      *   *Case:* The blamee acknowledges the blamer's hypocrisy or lack of connection but says, "You're right to blame me anyway; I deserve it."
      *   *Status:* **Non-negotiable.** Tests if standing is a right the blamee can waive, or an obligation/authority condition independent of their acceptance.

  10. **Explain Loss, Regain, and Transfer of Standing.**
      *   *Case:* How does committing a similar wrong *lose* one standing? Can reform (#3) *regain* it? Can standing be *transferred* (e.g., victims designating advocates)?
      *   *Status:* **Non-negotiable.** Standing must be a dynamic normative status, not static.

  11. **Distinguish Standing to Blame from Resent, Punish, Forgive.**
      *   *Case:* A victim has standing to resent but perhaps not to formally punish (reserved for the state). A third party might have standing to blame generally but not to forgive the specific wrong done to the victim.
      *   *Status:* **Non-negotiable.** Reveals standing as context and reactive-attitude specific. *Conflict Flag:* May clash with attempts to ground all in a single "normative authority" concept.

  12. **Address Standing to Praise and the Blame/Praise Asymmetry.**
      *   *Case:* Does hypocritically praising virtue undermine the praise like hypocrisy undermines blame? Why is there often thought to be no "standing" problem for praise?
      *   *Status:* **Commitment of specific camps (Non-Skeptical Asymmetrists).** Genuine requirement only if one accepts the intuitive asymmetry. Some camps (Symmetrists) see it as a prejudice, denying a deep asymmetry or demanding an explanation for it. *Conflict Flag:* Accepting a strong asymmetry (#12) might complicate a unified account of normative standing across reactive attitudes.

  13. **Avoid Global Skepticism & Trivialization of Hypocrisy.**
      *   *Case:* A theory shouldn't imply *no one* ever has standing (skepticism), nor render hypocrisy irrelevant to standing (trivialization, e.g., "only truth matters").
      *   *Status:* **Non-negotiable.** Constraint on acceptable solutions.
      *   *Social Function:* Must also explain how standing norms facilitate or regulate blame's roles in moral community maintenance, accountability, and norm enforcement.

  **Assessment of Main Families:**
  *   **Relational Theories (e.g., Scanlon, Bell):** Strong on #1, #3 (potentially), #4, #6, #7 (if roles are relationships), #10, #11. Struggle acutely with #2 (correct hypocrite), #5 (complicit beneficiary - often lack resources for systemic critique), #8 (efficacy irrelevant?), #12 (asymmetry unexplained), and potentially #9 (waiver).
  *   **"Quality of Will" + Standing Theories (e.g., Coates & Tognazzini):** Strong on #1, grounding #2 in the blamer's own disregard. Struggle with #2 (correct hypocrite who *now* evinces proper regard?), #7 (institutional roles), #8 (efficacy), #12 (asymmetry), and potentially trivializing hypocrisy if standing is too easily retained (#13).
  *   **Authorization/Consent Theories:** Strong on #9 (waiver), #11. Struggle fundamentally with #2 (correct hypocrite), #3 (reformed - authorization independent of reform?), #4 (victim status may not imply authorization), #6 (meddler - who authorizes?), #7 (institutional roles don't neatly fit consent), and risk skepticism (#13).
  *   **Participatory/Community Membership Theories:** Strong on #1, #6, #7, #10, potentially #5 and #13 (social function). Struggle deeply with #2 (hypocrite remains a member?), #3 (can reform restore full membership standing?), #4 (victimhood within community), #8 (efficacy irrelevant?), #11 (distinguishing attitudes), #12 (asymmetry).

  **Why Hypocrisy (#2) Excludes Most Theories:** Dominant approaches (especially Relational and Quality of Will) tie standing too tightly to either the blamer's *current* relationship status or their *current* attitude towards the norm. This makes explaining the *retention* of standing by correct hypocrites (especially in roles - #7) extremely difficult without ad hoc maneuvers, or conversely, trivializes cases where hypocrisy clearly *does* undermine standing. A successful theory needs a richer account of the blamer's *historical and ongoing normative entanglement* with the specific norm they invoke, separable from mere inconsistency or current disregard.
