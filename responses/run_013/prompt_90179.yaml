  ### Session Plan: Impossibility Results in Algorithmic Fairness

  #### **Order of Ideas and Dependencies**  
  1. **Binary Classification & Fairness Metrics (10 min)**  
     - *Concepts*: Recap binary classification (true outcome \(Y\), predicted score \(\hat{Y}\), decision threshold \(t\)). Define **calibration** (within groups): \(P(Y=1 \mid \hat{Y}=p, \text{group}) = p\). Define **error-rate balance** (equalized odds): Equal FPR (\(P(\hat{Y} \geq t \mid Y=0)\)) and FNR (\(P(\hat{Y} < t \mid Y=1)\)) across groups.  
     - *Dependency*: Foundational for understanding the conflict. Without these definitions, the impossibility result is meaningless.  
     - *Misconceptions Addressed*: Clarify that fairness isn't "impossible"—it’s about conflicting definitions. Head off "this only applies to race/recidivism" by emphasizing group-agnosticism.

  2. **Base Rates and Their Impact (10 min)**  
     - *Concept*: Introduce **base rate** (\(P(Y=1 \mid \text{group}\)) disparity (e.g., Group A: 70%, Group B: 30%). Show how base rates shape model behavior (e.g., in a calibrated model, Group A’s predictions center near 0.7, Group B’s near 0.3).  
     - *Dependency*: Base rate disparity is necessary for the conflict to emerge. If base rates were equal, calibration and error-rate balance could coexist.  
     - *Misconceptions Addressed*: Preempt "more data dissolves the conflict" by stressing base rates are population properties, not data flaws.

  3. **Single Threshold Constraint (5 min)**  
     - *Concept*: Policy mandates a **single decision threshold** (e.g., \(t = 0.5\)) for both groups.  
     - *Dependency*: Without this constraint, group-specific thresholds could resolve the conflict (but violate policy). Sets up the impossibility.  
     - *Misconceptions Addressed*: Counter "adjusting thresholds satisfies all metrics" by noting this violates equal treatment policies.

  4. **Central Constructed Example (25 min)**  
     - *Why this example?* It concretizes the conflict as inherent to *any* predictor under base rate disparity and policy constraints—not a dataset flaw.  
     - *Setup*:  
       - Group A (base rate 70%): Calibrated predictions (e.g., \(Y=1\) cases: 65% at \(\hat{Y}=0.9\), 35% at \(\hat{Y}=0.5\); \(Y=0\) cases: 15% at \(\hat{Y}=0.9\), 85% at \(\hat{Y}=0.5\)).  
       - Group B (base rate 30%): Calibrated predictions (e.g., \(Y=1\) cases: 75% at \(\hat{Y}=0.9\), 25% at \(\hat{Y}=0.1\); \(Y=0\) cases: 5% at \(\hat{Y}=0.9\), 95% at \(\hat{Y}=0.1\)).  
       - Fixed threshold \(t = 0.7\).  
     - *Calculations*:  
       - **FPR**: Group A = \(P(\hat{Y} \geq 0.7 \mid Y=0) = 15\%\), Group B = \(5\%\).  
       - **FNR**: Group A = \(P(\hat{Y} < 0.7 \mid Y=1) = 35\%\), Group B = \(25\%\).  
     - *Outcome*: Both metrics fail: FPR (15% ≠ 5%), FNR (35% ≠ 25%).  
     - *What it includes*:  
       - Proof of calibration within groups.  
       - Explicit FPR/FNR calculations.  
       - Emphasis on threshold rigidity.  
     - *What it obscures*:  
       - Continuous scores (simplified to discrete points).  
       - Mitigation strategies (e.g., group-specific thresholds).  

  5. **Generalizing the Impossibility (10 min)**  
     - *Concept*: Derive \( \text{FPR}_A - \text{FPR}_B = k \cdot (\text{base rate}_A - \text{base rate}_B) \) (simplified algebra). Show imbalance is proportional to base rate difference.  
     - *Dependency*: Example makes the algebra tangible. Generalization proves inevitability under constraints.  
     - *Misconceptions Addressed*: Refute "better models avoid this" by showing math holds for any calibrated predictor.

  6. **Scope and Limitations (5 min)**  
     - *Concept*: Acknowledge other fairness metrics (demographic parity, predictive parity) exist. Not all conflict! Impossibility is specific to calibration + error-rate balance.  
     - *Dependency*: Prevents overgeneralization ("fairness is impossible").  

  #### **Closing Question**  
  > "In our example, Group A had a 70% base rate and Group B 30%. Under a fixed threshold, why did calibration force unequal FPR/FNR, and how would equalizing base rates resolve this?"  
  - *Purpose*: Tests understanding of:  
    - **Conflict**: Calibration + single threshold force error rates to inherit base rate disparities.  
    - **Role of base rates**: If base rates were equal, FPR/FNR could align without violating calibration.  

  #### **What to Refuse to Prove**  
  - **Measure-theoretic details** (e.g., continuous score densities): Audience lacks background; discrete case suffices for intuition.  
  - **Bayesian derivations of impossibility**: Requires probability inversions (e.g., \(P(Y \mid \hat{Y})\)) that risk confusion without measure theory.  
  - **Optimal transport mitigations**: Highly technical; distracts from core conflict.  

  #### **Timing Summary**  
  - Intro + Metrics: 10 min  
  - Base Rates: 10 min  
  - Threshold Constraint: 5 min  
  - Central Example: 25 min  
  - Generalization: 10 min  
  - Scope + Q&A: 15 min (closing question in Q&A)  

  This sequence ensures the conflict arises naturally, grounded in tangible math, while preempting key misconceptions. The example serves as the anchor, making abstract constraints visceral.
