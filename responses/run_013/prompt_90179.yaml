     - Calibration: For any group, among the individuals who are assigned a predicted probability p, the proportion that actually has Y=1 is p. We can also think of calibration within groups: for each group, the model is calibrated.
     - Error rates: 
          - False Positive Rate (FPR): P(D=1 | Y=0)
          - False Negative Rate (FNR): P(D=0 | Y=1)
     - Equalized Odds (Error-Rate Balance): For two groups A and B, we require:
          FPR_A = FPR_B and FNR_A = FNR_B

     Why start here? The audience must recall these definitions to follow the argument.

