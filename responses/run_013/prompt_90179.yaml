  Key Impossibility Result: The result we focus on is the conflict between calibration and error-rate balance (also known as equalized odds). Specifically, we will show that, except in trivial cases, a predictor cannot simultaneously satisfy:
  1. Calibration within groups: P(Y=1 | Group, Prediction) = Prediction (or more generally, that the prediction is well-calibrated for each group).
  2. Error-rate balance (Equalized Odds): The false positive rate (FPR) and false negative rate (FNR) are equal across groups.

  We note that the base rates (P(Y=1 | Group)) may differ across groups, and this difference is central to the conflict.

