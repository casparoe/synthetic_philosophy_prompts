  Hmm, the user's frustration with online debates suggests they're seeking conceptual clarity, not just answers. Their tone ("chewing for weeks," "group chat is sick of it") implies they've done heavy lifting already—this isn't a surface-level query. They're likely a philosophy student or autodidact with solid grounding in political theory.  

  Breaking it down:  
