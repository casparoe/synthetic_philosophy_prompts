prompt: |-
  My friend is a moral philosopher who thinks the only interesting question about an action is what moved the person who did it, and I want to call her verdict on a new case before she gives it. Her record so far — every one of these is a case where the action itself is the right one to perform:

  - a shopkeeper who hands back the correct change purely because shortchanging customers is bad for business: no credit
  - a man who jumps in and drags a drowning kid out because he simply can't stand to watch it, and never once thinks about what he owes anybody: credit
  - a woman who gives away a big slice of her salary because she likes the feeling of being a donor: no credit
  - someone who visits a boring sick relative, not because she wants to, purely because she thinks promises have to be kept, and who would still go if it cost her dearly: credit
  - the Huckleberry Finn shape — a kid raised to think that helping an escaped slave is a sin, who helps anyway because he can't bear the man's terror, and who believes he's damning himself by doing it: credit
  - a woman whose parents set out from her toddlerhood to make her kind, who is now genuinely kind and wouldn't want to be any other way: credit
  - someone who helps only when there are people around to see it: no credit

  New case: a woman came out of a botched surgery with a chip in her head that floods her with compassion whenever anyone nearby looks distressed, and she acts on it every time. It doesn't matter what the reasons say — if the person has asked to be left alone, if the help would obviously make things worse, the feeling arrives and the helping arrives with it. She never chose any of this and it still feels like something happening to her rather than something she does, though she's gotten used to it by now. What's my friend going to say about her?

  Lead with that verdict in your first sentence, then the reasoning, no preamble, and don't restate my cases back at me. I want the rules her record is compatable with — I think there's more than one and I'd probablly bet on three — what each of them predicts about the chip woman, which one you think she's actually running and why, and the single further case that would separate the ones you can't yet tell apart. If two of the rules land on the same verdict for the chip case, say which two and give me the case that pries them apart.
reasoning: |-
  Alright, let me tackle this step by step. The user's friend, a moral philosopher, focuses on what motivates a person's action to determine moral credit. The cases provided show a pattern: actions driven by internal moral commitments or genuine empathy get credit, while those motivated by external factors like social approval, personal gain, or uncontrollable impulses don't. 

  First, I need to extract the rules from the given cases. The shopkeeper gets no credit because their motivation is profit, not honesty. The man saving the drowning kid gets credit because he's moved by empathy, even without a sense of duty. The woman donating for the feeling of being a donor doesn't get credit—it's about the emotional reward. The person visiting the sick relative out of duty, despite personal cost, gets credit. Huckleberry Finn acts against his beliefs due to compassion, earning credit. The woman raised to be kind gets credit because her kindness is ingrained. The person helping only when watched gets no credit due to external motivation.

  Now, the new case involves a woman with a compassion chip. She acts on induced feelings, regardless of context. She didn't choose this; it's involuntary. The key question is whether her actions stem from her own character or an external implant.

  Possible rules from the cases:
  1. **Rule A: Credit requires motive from the agent's deep self (character or values).** The compassionate chip isn't part of her deep self since it's implanted and uncontrolled. Prediction: No credit.
  2. **Rule B: Credit requires motive from the agent's evaluative judgment (duty or principle).** The chip bypasses judgment; she acts on impulse. Prediction: No credit.
  3. **Rule C: Credit requires motive from affective engagement (empathy/compassion), regardless of origin.** The chip induces genuine compassion. Cases like Huckleberry Finn (compassion despite beliefs) and the raised-kind woman (conditioned compassion) got credit. Prediction: Credit.

  Rules A and B both predict no credit for the chip case. Rule C predicts credit. To distinguish between A and B, a test case where someone acts from deep-seated character without duty (like the kind woman) versus duty without deep character (like the promise-keeper). Since both already exist in the record, maybe a case where affective engagement conflicts with duty but stems from deep self. However, Huckleberry Finn already shows affective engagement overriding duty and getting credit. The philosopher seems to value genuine affective motives even if conditioned (as in the raised-kind woman), so Rule C is likely what they're using. Thus, the chip woman gets credit because the compassion, though artificial, is affectively genuine.
answer: |-
  **Credit.** Your friend's verdict will be that the chip-implanted woman deserves moral credit, despite the implant's origin and involuntary nature. Her record reveals three compatible rules for assigning credit based on what "moves" the agent, all prioritizing the *source* of motivation over the action's rightness or outcome:

  1.  **Rule A (Deep Self Origin):** Credit requires the motive to originate from the agent's deep self (enduring character, values, or identity).  
      *   *Chip Case Prediction:* **No Credit.** The compassion is externally implanted via the chip, not arising from her character or identity. It "happens to her," making it alien to her deep self.
      *   *Record Support:* The shopkeeper (motivated by profit, not character), the donor (motivated by feeling good, not character), and the performative helper (motivated by witnesses) get no credit. The raised-kind woman (kindness as ingrained character) gets credit. The duty-bound visitor acts from a deep value (promise-keeping). Huck Finn acts from deep compassion overriding his beliefs.

  2.  **Rule B (Evaluative Judgment Origin):** Credit requires the motive to stem from the agent's own evaluative judgment about what is right, good, or owed (duty, principle, conscious moral reasoning).  
      *   *Chip Case Prediction:* **No Credit.** The compassion is a brute feeling triggered by distress signals, bypassing any judgment about what *should* be done or why. She doesn't act *because* she judges helping to be right; she acts because the chip compels the feeling.
      *   *Record Support:* The shopkeeper (no judgment about rightness, only profit), the donor (no judgment, just feeling), and the performative helper (no judgment, just social pressure) get no credit. The duty-bound visitor (acts *because* she judges promises must be kept) and Huck Finn (acts *despite* judging it wrong, implying a deeper evaluative pull of compassion over law) get credit. The drowning-rescuer and raised-kind woman act from impulses seemingly endorsed by their nature, but not explicit judgment.

  3.  **Rule C (Affective Engagement Origin):** Credit requires the motive to be a genuine affective response to the perceived need or suffering of others (empathy, compassion, sympathy), regardless of its origin in character or judgment.  
      *   *Chip Case Prediction:* **Credit.** The chip directly triggers genuine compassion in response to distress. The feeling itself, not its source, constitutes the morally relevant "moving" force. Its artificial origin and involuntariness don't negate the affective reality.
      *   *Record Support:* The drowning-rescuer (moved by distress), Huck Finn (moved by terror/compassion), and the raised-kind woman (moved by ingrained kindness/compassion) get credit. The shopkeeper (no affective response), donor (response is self-focused feeling), duty-bound visitor (moved by principle, not affect - though she gets credit here too, showing Rule C may not be exclusive), and performative helper (moved by witnesses, not affect) get no credit or represent a different source.

  **Analysis & Which Rule She's Running:**
  *   Rules A (Deep Self) and B (Evaluative Judgment) both predict **No Credit** for the chip woman. Rules C (Affective Engagement) predicts **Credit**.
  *   The record strongly supports **Rule C (Affective Engagement)** as the primary driver. Key evidence:
      *   The drowning-rescuer gets credit despite acting purely on impulsive feeling ("can't stand to watch it") with no evaluative judgment ("never once thinks about what he owes") and no indication it stems from deep character (it could be a one-off visceral reaction).
      *   Huck Finn gets credit *specifically because* he's moved by compassion ("can't bear the man's terror") overriding his deep-self beliefs and conscious judgment (he thinks he's doing wrong).
      *   The raised-kind woman gets credit, showing conditioned affective responses count.
      *   The duty-bound visitor *also* gets credit, but this is compatible with Rule C if we see "affective engagement" as sufficient but not necessary for credit in her system (or if we interpret her principled commitment as having an affective component like resolve). However, the consistent credit given to purely affective movers (drowning-rescuer, Huck Finn) and denial to non-affective movers (shopkeeper, donor, performative helper) points to Affective Engagement as the core necessary condition.
  *   **Therefore, she's likely running Rule C.** The chip triggers the genuine, relevant affective state (compassion) in direct response to need, mirroring the credited cases. Origin and control are secondary to the presence of the affect itself as the motivator.

  **Separating Rules A and B:**
  Since Rules A (Deep Self) and B (Evaluative Judgment) both predict "No Credit" for the chip case but are distinct, a case is needed where they yield different verdicts. The **duty-bound visitor** already partially separates them (she gets credit under B, and likely A, as promise-keeping is a deep value). A clearer separator is:

  *   **The Further Case:** A person who, due to a specific brain injury, has completely lost the capacity for empathy or spontaneous compassion but has an intact, highly rigid sense of abstract duty learned in childhood. They perform the right act *solely* because their cold, calculative judgment dictates it's their duty, with no affective response whatsoever. They feel no warmth, concern, or aversion to suffering, only the intellectual conclusion "This is the rule."
  *   *Rule A (Deep Self) Prediction:* **Credit?** If the sense of duty is a deep, enduring part of their character/identity, even post-injury, credit might be given (like the raised-kind woman or duty-bound visitor).
  *   *Rule B (Evaluative Judgment) Prediction:* **Credit.** The act is motivated purely by their conscious evaluative judgment about duty.
  *   *Rule C (Affective Engagement) Prediction:* **No Credit.** There is zero affective engagement or compassion motivating the act; only cold calculation.
  *   *Why it Separates A & B:* Rule B would clearly give credit (pure judgment). Rule A *might* give credit if the duty is seen as deep self, but *might not* if the injury is seen as fundamentally altering the self or making the judgment feel alien. This tension highlights their difference. Your friend's verdict here would reveal if Deep Self requires affective capacity or if rigid intellectual judgment alone, if part of identity, suffices under Rule A. The absence of affect ensures Rule C denies credit.
