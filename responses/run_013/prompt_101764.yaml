answer: |-
  Based on your friend's verdicts on the cases discussed, she appears to be implicitly applying a **Mill-Ramsey-Lewis (MRL) rule** for identifying laws of nature. This rule, derived from the best-system account of laws, holds that a law is a regularity that is an axiom or theorem in the true deductive system that best balances **simplicity** and **strength** (predictive and explanatory power). Strength refers to the amount of information the system captures about the world, while simplicity ensures the system is not needlessly complex. 

  ### Analysis of Your Friend's Verdicts:
  - **Laws she counts** (Pauli exclusion principle, inverse-square law of gravitation, like charges repel):
    - These are fundamental, universally applicable regularities that are **simple and highly informative**. They are cornerstones of our best scientific theories (quantum mechanics, gravity, electromagnetism), contributing significantly to the strength of the system without excessive complexity. For example, the inverse-square law succinctly describes gravitational interactions across the universe, enabling predictions.
    
  - **Non-laws she rejects** (all gold spheres <1 mile across, all planets orbit same direction, all particles in a lab have spin up):
    - These are **accidental regularities** that fail the MRL test:
      - The gold sphere generalization might be true but is **restricted** (specific to gold) and **explicable by contingent facts** (e.g., gold's scarcity and properties), not fundamental laws. Adding it to the best system would add complexity without new predictive power (e.g., it doesn't help predict other phenomena).
      - The planetary orbit fact is **localized** to our solar system and contingent on its formation history. It doesn't generalize and is better explained by astrophysical models, so including it would complicate the system without universal strength.
      - The lab spin fact is **temporary and localized**, with no broader implications. It adds no strength to the system and is easily overridden by context.

  ### Prediction for the New Case:
  - **Scenario**: A fundamental relation of necessitation between two properties, instantiated exactly once, and adding it to the best systematization increases complexity without adding predictive strength.
  - **Verdict**: Your friend **would not call this a law**.
    - **Why?** Under the MRL rule:
      - **No added strength**: The generalization is instantiated only once, so it doesn't support predictions beyond this single event. Even if it is "fundamental," it doesn't unify phenomena, explain other events, or improve the system's coverage.
      - **Increased complexity**: Adding it makes the system "considerably more complex" (e.g., by introducing a new axiom for a one-off event), violating the simplicity criterion.
      - **Best-system exclusion**: The MRL rule prioritizes efficiency. If a regularity doesn't enhance the system's net balance of simplicity and strength, it is excluded—even if it reflects a "necessitation." This aligns with how your friend rejected the gold sphere and lab spin cases for being uninformative accidents.

  ### The Rule She Is Implicitly Running:
  - **MRL Rule**: Laws are the regularities in the **best deductive system**—the one that achieves the optimal trade-off between simplicity (concise axioms) and strength (maximizing logical consequences about the world). This system is "best" because it is the most efficient summary of nature's patterns, useful for prediction and explanation.
    - **Key criteria**:
      - **Universality**: Laws apply everywhere and always (unlike the solar system or lab cases).
      - **Non-accidentality**: Laws are not contingent on specific contexts (unlike gold spheres).
      - **Systematic value**: Laws must contribute net value to the system (simplicity + strength), as seen in the fundamental laws she accepts.
    - **How it fits**: The MRL rule explains all her verdicts:
      - Accepted laws are simple, strong, and universal.
      - Rejected non-laws are weak, complex, or localized additions to the system.

  ### Other Rules That Fit the Verdicts Equally Well:
  While MRL is the strongest fit, two alternative rules also align with her verdicts, though they differ in emphasis:
  1. **Universality + Fundamentality Rule**: A law must be (a) **universal** (not restricted by time, place, or type) and (b) **fundamental** (reflecting basic properties of nature, not derivable from other laws). 
     - **Fits verdicts**: 
       - Accepted laws (e.g., inverse-square gravity) are universal and fundamental.
       - Rejected cases (e.g., planets orbiting same way) are non-universal (solar system only), and gold spheres are non-fundamental (derivable from material constraints).
     - **Weakness**: Less clear on "predictive strength" focus; might accept the one-time necessitation as "fundamental" (but your friend likely wouldn't, per MRL leanings).

  2. **Necessity + Best-System Rule**: A law must involve **natural necessity** (a modal "must" beyond regularity) and be part of the **best system**.
     - **Fits verdicts**:
       - Accepted laws (e.g., Pauli exclusion) feel necessary and systemically valuable.
       - Rejected cases lack necessity (e.g., lab spin is contingent) or systemic value (e.g., gold spheres).
     - **Weakness**: Risks circularity (what counts as "necessity"?), and the one-time necessitation might be seen as necessary but rejected due to systemic cost.

  Both alternatives fit the verdicts but are less precise than MRL on the role of systematization. MRL is the most parsimonious explanation for her emphasis on predictive strength and simplicity.

  ### Further Case to Distinguish the Rules:
  To tease apart MRL from the alternatives, consider a case where a regularity is **fundamental and necessary but harms systematization**:
  - **Scenario**: Suppose we discover a fundamental relation of necessitation between properties F and G, instantiated many times across the universe. However, stating this regularity requires an extremely complex axiom (e.g., a 10,000-term equation). Adding it to the best system would slightly increase strength (it correctly predicts all F-G interactions) but massively increase complexity, worsening the simplicity-strength balance overall.
  - **How it distinguishes rules**:
    - **MRL Rule**: Would **not** call it a law because it degrades the best system (high complexity outweighs strength gain). This matches your friend's focus on systemic efficiency.
    - **Universality + Fundamentality Rule**: **Would** call it a law (it's universal and fundamental), ignoring systemic cost.
    - **Necessity + Best-System Rule**: Might split—if "necessity" is primary, it calls it a law; if best-system dominates, it does not.
  - **Why it works**: This case isolates the role of systematization. Your friend's rejection of the one-time case suggests she prioritizes systemic efficiency (favoring MRL). If she rejects this complex regularity too, it confirms MRL. If she accepts it, she leans toward universality/fundamentality or necessity.

  In summary, your friend would reject the one-time necessitation as a law, and she is likely using the MRL rule. The universality + fundamentality or necessity + best-system rules also fit her verdicts but can be distinguished with the complex-system case. This approach reflects a sophisticated view of laws as tools for efficient prediction, not just patterns or necessities.
