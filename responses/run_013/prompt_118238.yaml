prompt: |-
  I teach an upper-level seminar on rationality — 16 students, 90 minutes, they've already done Newcomb's problem so they know the causal/evidential split. I want them to feel the Death in Damascus problem rather than hear me describe it: the vertigo of a doom that follows you to whichever room you pick, so that every reason you have for going left is also a reason the doom is on the left. Design me a runnable activity that does that — roles, rules, a payoff scheme in candy or points rather than money, a timeline, and a debrief that maps what happened onto the structure of the case. Three things I want built in, because they're what I actually care about and they're not the parts people usually mention. First, I want the group to find the escape hatch themselves — that if you can be genuinely unpredictable the doom can't follow you, which turns the problem from I die either way into a lottery at even odds — and then to feel why that escape is cheap, since their deliberation is itself one of the things being predicted, so deciding to flip a coin is also on the table for the predictor to read. Second, I want them to end up seeing that the case quietly assumes two things that can't both be true: that the predictor is perfect, and that their choice is still genuinely open to them. Third, I want them to catch the fatalist equivocation, where the prophecy is treated as a fixed fact about the world when that helps the argument and as an effect of their choice when that helps instead. Don't name the case until the debrief. Tell me what will predictably go wrong the first time I run it and how to handle it, and be straight about what the activity can't reproduce — I assume it can't give them a real perfect predictor, only a staged one, and I want to know what that costs. Give me one activity, fully specified, with definite calls on the payoff structure and on how the thing ends; don't hand me three variants to choose between, and don't send me to any readings.
reasoning: |-
  We are going to design an activity that simulates the Death in Damascus problem without naming it until the debrief. The goal is for students to experience the core dilemma: that any reason they have to choose one option is also a reason the "doom" is there, and to discover the escape hatch (randomization) and its limitations.

  ### Activity Design: "The Oracle's Prediction"

  #### Setup
  - **Roles**: 
    - One student plays the **Oracle** (the predictor). 
    - The remaining 15 students are the **Travelers**.
  - **Rules**:
    - The Travelers must choose between two rooms: **Room A** and **Room B**. They cannot communicate during the decision phase.
    - The Oracle's task is to predict, for each Traveler, which room they will choose. The Oracle writes down predictions for all Travelers in secret (before the Travelers make their choice).
    - The Travelers then choose a room (by going to one of two designated areas in the classroom). They must choose one and only one room.
  - **Payoff Scheme (in candy)**:
    - Each Traveler starts with 0 points. 
    - If the Oracle predicts a Traveler's choice correctly, the Traveler loses 1 piece of candy (or if using points, they get -1). 
    - If the Oracle predicts incorrectly, the Traveler wins 1 piece of candy (+1).
    - The Oracle's goal is to maximize the number of correct predictions. The Oracle gets 1 piece of candy for each correct prediction (so they are incentivized to be accurate). This aligns the Oracle with being a perfect predictor.

  #### Timeline (90 minutes total)

  1. **Introduction (5 minutes)**:
     - Explain the rules and the payoff. Tell the Travelers: "You are about to make a choice between Room A and Room B. The Oracle has predicted your choice. If the Oracle is correct, you lose a piece of candy. If the Oracle is wrong, you win a piece of candy. The Oracle gets candy for each correct prediction."
     - Emphasize: "You have to choose one room. You cannot stay out."

  2. **Prediction Phase (5 minutes)**:
     - The Oracle leaves the room (or turns away) and writes down predictions for all 15 Travelers (e.g., a list: Traveler 1: Room A, Traveler 2: Room B, ...). The predictions are sealed in an envelope.

  3. **Deliberation and Choice (15 minutes)**:
     - Travelers deliberate together (as a group) about how to choose. They can discuss strategies but cannot reveal their final choice until the moment of decision. They must then split into the two rooms without communication during the split (so they can't change based on seeing others).
     - Note: The Oracle is not present during the deliberation.

  4. **Revelation and Payoff (10 minutes)**:
     - The Oracle returns. The envelope is opened. The Oracle's predictions are read aloud.
     - Each Traveler checks if the prediction for them was correct. Candy is distributed accordingly (negative means they give a candy to the instructor, positive they get one). The Oracle gets their candy for each correct prediction.

  5. **First Round Debrief (10 minutes)**:
     - Ask: What happened? How did you feel? What strategy did you use? Did the Oracle do well? Why?
     - Let them express frustration if they feel doomed.

  6. **Second Round (20 minutes total)**:
     - Repeat the activity, but now with a twist: Travelers are allowed to use a coin flip to decide (if they wish). The Oracle knows that they might use randomization.
     - Prediction Phase: Oracle predicts again (with the knowledge that Travelers might randomize).
     - Choice: Travelers can choose by flipping a coin (provide coins) or by any other method. They must still choose a room.
     - Revelation and Payoff: Same as before.

  7. **Final Debrief (25 minutes)**:
     - Map the experience to the Death in Damascus problem. Reveal the name and the original story.
     - Focus on the three points you care about:

       **a) The escape hatch and its cheapness:**
          - In the first round, if they tried to reason, the Oracle (being a good predictor) might have used their reasoning against them. Then in the second round, they might have tried randomization. But note: the Oracle still made a prediction. How? The Oracle could predict that they would randomize? Or predict the outcome of the randomization? 
          - Point: If the Traveler uses a coin flip, the Oracle might predict that they will flip and then choose accordingly. But then the Traveler might think: "If I flip, the Oracle will predict the flip, so I should not flip?" This leads to infinite regress. 
          - However, note: if the Traveler flips a fair coin, the Oracle cannot predict the outcome of the flip (if it's truly random) but can predict that the Traveler will flip. Then the Oracle has a 50% chance of being right. But wait: the Oracle has to make a definite prediction. So the Oracle might predict a specific outcome (say, heads -> Room A) even though the Traveler is flipping. Then the Traveler's actual coin flip might not match. So the Oracle can only be 50% accurate on randomizers? 
          - But in our activity, the Oracle is a human. They might try to guess the coin flip. So the Oracle might get it wrong. This leads to the escape: by randomizing, the Traveler forces the Oracle to have only a 50% chance. So the Traveler gets an expected 0 (if we average winning and losing). But note: the Traveler might try to outsmart the Oracle by not flipping? 

       **b) The incompatible assumptions:**
          - If the Oracle is perfect, then the Traveler's choice must be determined (so no free will in the libertarian sense). If the choice is genuinely open (truly random or free), then the Oracle cannot be perfect. The activity forces them to see that the predictor (Oracle) can be good, but not perfect if the Travelers use true randomness.

       **c) Fatalist equivocation:**
          - During the deliberation, did the students treat the prediction as fixed? (e.g., "The Oracle has already predicted, so my choice can't change it.") But then they also thought: "If I choose A, then the Oracle probably predicted A, so I should choose B." Here, they are using their choice to infer what the prediction must have been (treating the prediction as an effect of their choice). 
          - Point out this switch: sometimes they thought of the prediction as fixed (so they can't change it) and sometimes as dependent on their choice (so they can outthink it).

     - Also, note what the activity cannot reproduce:
          - We cannot have a truly perfect predictor because the Oracle is human. In the first round, the Oracle might not be 100% accurate. That's okay because we can still show the dynamic: if the Oracle is very good (say, 14 out of 15 correct), then the Travelers feel the doom. But the imperfection might lead them to think they can beat the system. In the debrief, point out that the original problem assumes a perfect predictor, and that's what creates the logical tension.

  #### What Predictably Goes Wrong and How to Handle It

  1. **Oracle is not perfect**:
     - In the first round, the Oracle might get some wrong. This might lead students to think they can beat the system. Handle it by emphasizing that the Oracle in the thought experiment is perfect. In the activity, the Oracle is a stand-in. If the Oracle does well, use that to show the feeling of doom. If not, ask: "What if the Oracle were perfect? How would that change your reasoning?"

  2. **Travelers might collude or use a coordinated strategy**:
     - In the first round, they might all decide to go to Room A. Then the Oracle, if they predict that, gets all right. Then they feel doomed. But if they split, the Oracle might get some wrong. However, the Oracle can predict the split? The problem is for each individual. In the debrief, focus on individual reasoning.

  3. **The coin flip in the second round might be seen as a solution without the cheapness**:
     - They might think: "I flipped, so the Oracle couldn't know." But the Oracle might have predicted the flip. How? The Oracle doesn't know the coin outcome. So if the Traveler flips, the Oracle has to guess the outcome. So the Oracle will be right 50% of the time. This is the escape: it breaks the doom. But then point out: In the original problem, the predictor is perfect. How can a perfect predictor exist if you can randomize? It can't. So we have to drop one assumption: either the predictor is not perfect, or the choice isn't free (randomness isn't free?).

  4. **Time management**:
     - Keep strict time limits. The deliberation might run long. Cut it off at 15 minutes.

  5. **Travelers might not split without communication**:
     - Make sure they go to the rooms simultaneously (e.g., by writing their choice on a card and then moving). Or have them line up and then split.

  #### How It Ends
  - The activity ends with the second round and then the final debrief. In the debrief, you reveal the name of the problem and map the experience to the three points.

  #### What the Activity Cannot Reproduce
  - We cannot have a truly perfect predictor. The Oracle is human and might make mistakes. This costs us the logical force of the original paradox. But we can still get the feeling of being predicted and the frustration. We can then imagine: what if the Oracle were always right? That's when the paradox bites.
  - Also, the students know the Oracle is a fellow student, so they might try to model the Oracle's thinking. That's actually good because it mirrors the recursive reasoning in the original problem.

  This activity should create the vertigo and then allow the students to discover the key insights through experience and debrief.
answer: |-
  ### The Oracle's Doom: A Death in Damascus Activity  
  **Objective:** Make students viscerally experience the predictive doom, discover the randomization escape hatch, then confront its limitations and the paradox of perfect prediction vs. free choice.  

  ---

  #### **Setup**  
  - **Students**: 16 (15 "Travelers" + 1 "Oracle").  
  - **Time**: 90 minutes total (activity: 50 min, debrief: 40 min).  
  - **Materials**:  
    - Two physical rooms/spaces (e.g., "Room LEFT" and "Room RIGHT" marked with signs).  
    - 15 coins (for randomization in Round 2).  
    - Payoff: Candy (e.g., 30 pieces; 1 per correct prediction outcome).  
    - Prediction sheets for the Oracle.  
  - **Secrecy**: Do NOT name "Death in Damascus" until debrief. Call it "The Oracle’s Doom."  

  ---

  #### **Rules & Payoff Scheme**  
  1. **Roles**:  
     - **Travelers (15 students)**: Must choose LEFT or RIGHT. Goal: Avoid the "doom" (losing candy) by outsmarting the Oracle.  
     - **Oracle (1 student)**: Predicts each Traveler’s choice BEFORE choices are made. Goal: Maximize correct predictions.  

  2. **Payoff in Candy**:  
     - If the Oracle **correctly predicts** a Traveler’s choice → Traveler **loses 1 candy**, Oracle **gains 1 candy**.  
     - If the Oracle is **wrong** → Traveler **gains 1 candy**, Oracle **loses 1 candy** (or gives it to the Traveler).  
     *(Rationale: Candy loss/gain mirrors life/death stakes. Negative payoffs for Travelers create "doom" tension.)*  

  3. **Core Mechanic**:  
     - The Oracle’s prediction is **locked in before choices**. Travelers know this.  
     - Travelers **cannot communicate** during choice-making.  

  ---

  #### **Timeline**  
  **Step 1: Round 1 (20 min)**  
  - **Oracle Prediction (5 min)**:  
    - Oracle leaves the room. Writes predictions (LEFT/RIGHT) for each Traveler on a sheet. Seals it in an envelope.  
    - *Instructor Tip:* Urge the Oracle to "think like a mind-reader" using knowledge of peers.  
  - **Traveler Deliberation (10 min)**:  
    - Travelers discuss strategy as a group. *Prompt:* "How will you escape the doom? Remember: the Oracle already predicted you."  
    - *Instructor Tip:* Push them to verbalize reasoning (e.g., "If I go left, the Oracle probably predicted that, so I should go right...").  
  - **Choice & Revelation (5 min)**:  
    - Travelers silently go to LEFT or RIGHT.  
    - Oracle returns. Reveal predictions. Distribute candy.  

  **Step 2: Round 2 (20 min)**  
  - **Reset**: Collect candy. New Oracle (rotate role if possible; else, same student).  
  - **Prediction (5 min)**: Oracle predicts again (knowing Travelers may randomize).  
  - **Deliberation (10 min)**:  
    - *New prompt:* "You may use coins to decide. How does this change things?"  
    - Give each Traveler a coin.  
  - **Choice & Revelation (5 min)**:  
    - Travelers choose (by coin flip or deliberation). Reveal predictions. Pay candy.  

  **Step 3: Final Choice & Doom (10 min)**  
  - **Climax**: Announce that Travelers face "true doom" (no third round). They have 30 seconds to choose LEFT/RIGHT silently.  
  - **Twist**: The Oracle does NOT predict. Instead, after choices, reveal: "The doom was set by the Round 2 predictions. If you chose what the Round 2 Oracle predicted, you lose candy."  
    *(Rationale: Forces them to confront past predictions as "fixed doom" while feeling choice is "free.")*  

  ---

  #### **Debrief (40 min)**  
  **Map the Experience to Death in Damascus:**  
  1. **Name the Case (5 min)**: Reveal "Death in Damascus." Briefly describe the original: A traveler flees death in Damascus or Aleppo, but death says it will be where he goes.  
  2. **Vertigo of Doom (10 min)**:  
     - *Ask:* "In Round 1, why did reasoning feel futile?" → Highlight: "Every reason to choose a room was a reason the doom was there."  
     - *Link:* "This is evidential reasoning: Choosing LEFT *is evidence* death is there."  
  3. **The Escape Hatch & Its Cheapness (10 min)**:  
     - *Ask:* "How did randomization 'solve' it in Round 2? What went wrong?"  
     - *Key Insight:*  
       - Escape: Randomization breaks correlation → 50% survival chance.  
       - Cheapness: Deliberating *to* randomize is predictable. The Oracle can predict "they’ll flip a coin" and guess LEFT/RIGHT (50% chance).  
     - *Quote a student:* "I flipped a coin, but the Oracle still guessed right!" → "Yes, because flipping was part of your predictable deliberation."  
  4. **The Two Assumptions That Can’t Coexist (10 min)**:  
     - *Ask:* "Could the Oracle be perfect AND your choice be truly free?"  
     - *Reveal the paradox:*  
       - Perfect prediction → choice must be predetermined (no free will).  
       - Genuine choice → prediction can’t be perfect.  
     - *Use Round 2:* "When you flipped coins, did the Oracle’s imperfection feel like hope or a flaw in the setup?"  
  5. **Fatalist Equivocation (5 min)**:  
     - *Point out:* "In Round 3, you treated the Round 2 prediction as fixed doom. But during deliberation, you acted like your choice *affected* where the doom was. That’s the fatalist swap."  
     - *Clarify:* "Death in Damascus treats the prophecy as both cause (determining your choice) and effect (determined by your choice)."  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem: Oracle isn’t "perfect," reducing doom tension**.  
     - *Why:* Students know the Oracle is fallible (a peer).  
     - *Fix:* After Round 1, say: "Assume the Oracle is 95% accurate. How does that change your fear?" Then in debrief, contrast with the thought experiment’s perfect predictor.  

  2. **Problem: Travelers coordinate to "break" the system** (e.g., all choose LEFT).  
     - *Why:* Group dynamics override individual rationality.  
     - *Fix:* Restate rules: "No signaling during choices. This is about YOUR survival." Debrief: "Coordination avoids prediction, but Death in Damascus is solitary."  

  3. **Problem: Randomization feels like cheating, not an insight**.  
     - *Why:* Students focus on winning candy, not the paradox.  
     - *Fix:* In Round 2, ask: "If the Oracle KNOWS you’ll flip a coin, can they be 100% right? Why not?"  

  4. **Problem: Debrief runs short on paradox depth**.  
     - *Fix:* Pre-write the three key insights on a hidden board. Reveal them if discussion lags.  

  ---

  #### **What the Activity Can’t Replicate**  
  - **A real perfect predictor**:  
    - *Cost:* Students won’t feel true logical inevitability. A human Oracle can be wrong, allowing "hope" and masking the paradox.  
    - *Mitigation:* Stress in debrief: "In the thought experiment, the predictor is infallible. That’s why randomization feels like a cheat—it exposes the contradiction."  
  - **Real stakes**: Candy isn’t life-or-death, reducing dread.  
  - **True randomness**: Coin flips are physically random, but students may distrust them (e.g., "The Oracle knows I’d pick heads").  

  ---

  #### **Why This Works**  
  - **Vertigo achieved**: Travelers literally move rooms, seeing doom follow them. Candy losses make prediction visceral.  
  - **Escape hatch discovered organically**: Round 2’s coins force randomization as a solution, then expose its predictability.  
  - **Paradox crystallized**: Round 3’s "fixed doom" vs. "free choice" clash highlights the incompatible assumptions.  
  - **Fatalism unmasked**: Debrief uses student quotes to show the prophecy equivocation.  

  **Final Tip:** Start the debrief by asking: "Show of hands: Who felt doomed no matter what they did?" Use their hands to launch into the vertigo discussion.
