prompt: |-
  I am a novelist finishing a book whose two central characters are philosophers who have spent a decade talking past each other. The first holds that moral uncertainty is continuous with ordinary uncertainty: that you should maximize expected choiceworthiness, and that this requires comparing the value of outcomes across theories. The second holds that intertheoretic comparisons of value are not well-defined, so that "maximizing expected choiceworthiness" names no determinate procedure at all, and would replace it with something else — a bargaining or parliamentary procedure, or treating each theory's requirements as side-constraints rather than as values to be traded off. I want the novel to end with the document they could both actually sign. Write it.

  Give me a numbered list of claims both would accept, including about the formal structure of the problem and about which cases are uncontroversial; then their remaining disagreements, each phrased in wording its own side would accept, in a table; then the cruxes — the sub-questions such that settling one would move at least one of them — and for each crux the case or argument both agree bears on it, with each side's prediction recorded in advance. Say which parts of the dispute you take to be verbal rather than substantive, and why.

  Build in two things, because they are what my characters cannot get past. First: if expected choiceworthiness is computed over a partition of theories, then how the theories are individuated — one theory split into two near-duplicates, or two merged into one — changes what the procedure prescribes, and neither of them has said whether that is a reductio or a bookkeeping problem. Second: each of them is uncertain whether intertheoretic comparison is even possible, so each must say what their view recommends under uncertainty about its own central presupposition.

  Finally, tell me where the drafting is most likely to have failed: which of the agreed claims are probably vacuous or slanted, and what argument or case would lead you to a different verdict on which of the disagreements are genuine.
reasoning: |-
  Okay, I need to understand what the user is asking for. They're a novelist finishing a book about two philosophers who've been talking past each other on moral uncertainty. One believes in maximizing expected choiceworthiness (EC) with intertheoretic comparisons, while the other rejects that as incoherent and prefers procedural approaches like bargaining. The user wants an ending document they could both sign, with specific elements: agreed claims, disagreements in a table, cruxes with cases, and analysis of verbal vs. substantive disputes. 

  The key constraints are the individuation problem (how splitting/merging theories affects prescriptions) and meta-uncertainty (what to do when unsure about intertheoretic comparability itself). I should structure this carefully to honor both characters' viewpoints while creating plausible common ground. 

  First, I'll outline the agreed claims. Both would accept that we face moral uncertainty, that we need some decision procedure under such uncertainty, and that easy cases exist where all theories agree. They'd also agree on the formal structure: theories define choiceworthiness functions, and we need a way to aggregate them. The individuation problem must be mentioned as a shared concern. 

  For the disagreements table, I'll phrase each side's position in their own language. The EC proponent will emphasize maximizing as the rational extension of decision theory, while the opponent will frame it as conceptually incoherent and propose alternatives like bargaining. 

  The cruxes section is crucial. I'll identify sub-questions like "Are intertheoretic comparisons possible?" and "Is individuation sensitivity a reductio?" For each, I'll specify a case both would accept as relevant, and record their differing predictions. The meta-uncertainty point needs special handling - I'll have each say what their view recommends if its core presupposition is doubted. 

  On verbal disputes, I'll note that "rational" and "procedure" might be terminological. The EC framing assumes comparability, while bargaining rejects it - that's substantive. 

  Finally, I'll flag risks: the easy cases might be too thin, the meta-uncertainty responses might paper over cracks, and the bargaining alternative might be underspecified. A killer case would be one where bargaining yields counterintuitive results despite seeming procedural. 

  The challenge is making this feel authentic to both viewpoints while showing why they'd sign it - perhaps as a map of their battlefield rather than a resolution. The document should reflect their decade-long impasse but also their shared intellectual rigor.
answer: |-
  Here is the joint statement your philosophers might sign, reflecting their impasse while acknowledging common ground – a testament to their decade-long dialogue:

  **Joint Statement on Decision-Making Under Profound Moral Uncertainty**

  We, [Character 1 Name] and [Character 2 Name], acknowledge the following points of agreement regarding the structure of moral uncertainty and the requirements for rational action under its conditions:

  1.  **Fundamental Uncertainty:** Moral agents often face profound uncertainty about which moral theory is correct.
  2.  **The Need for a Procedure:** This uncertainty necessitates a rational decision procedure for choosing actions when different moral theories prescribe different choices.
  3.  **The Formal Structure:** The problem can be formally characterized as follows:
      *   There exists a set of possible moral theories \( T_1, T_2, ..., T_n \).
      *   Each theory \( T_i \) assigns a degree of *choiceworthiness* \( CW_i(a) \) to each possible action \( a \) in a given situation.
      *   The agent assigns credences \( c_1, c_2, ..., c_n \) (summing to 1) over these theories, representing their subjective probability that each theory is correct.
      *   A decision procedure \( D \) takes the set of theories, their associated credences, and their choiceworthiness assignments as inputs and outputs a recommended action (or set of permissible actions).
  4.  **Existence of "Easy Cases":** There exist situations where all theories an agent takes seriously agree on the relative choiceworthiness of the available actions (or on a uniquely best action), making the prescribed action uncontroversial regardless of the decision procedure used (provided it respects dominance and unanimity).
  5.  **The Individuation Problem:** For any proposed procedure \( D \), the recommendation it outputs can be sensitive to how the underlying set of theories is individuated (e.g., splitting one theory into near-identical variants, or merging distinct but similar theories). This sensitivity is a significant formal feature demanding explanation.
  6.  **Meta-Uncertainty:** Each of us acknowledges significant uncertainty about the very presuppositions underlying our preferred procedures – specifically, the possibility of meaningful intertheoretic comparisons of choiceworthiness levels or units.
  7.  **Requirement of Self-Application:** Any proposed procedure \( D \) must specify what it recommends *even under conditions of uncertainty about the very possibility of the comparisons \( D \) relies upon* (for procedures requiring comparisons) or *about the coherence of \( D \) itself* (for procedures rejecting comparisons).

  **Remaining Disagreements:**

  | Claimant | Claim Regarding the Core Procedure                                                                                                 | Claim Regarding Alternatives                                                                                                                               |
  | :------- | :---------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **ECP**  | "The uniquely rational extension of decision theory under descriptive uncertainty to the moral domain is to maximize expected choiceworthiness: choose the action \( a \) that maximizes \( \sum_i c_i \cdot CW_i(a) \). This requires that intertheoretic comparisons of choiceworthiness *levels and units* are meaningful, at least in principle." | "Alternative procedures like bargaining, parliamentary models, or treating theories as side-constraints are either irrational (failing to maximize expected moral value), reducible to expected choiceworthiness maximization under specific assumptions, or practically unworkable guides under deep uncertainty." |
  | **SCP**  | "The concept of 'maximizing expected choiceworthiness' is incoherent because intertheoretic comparisons of choiceworthiness levels or units lack a defensible basis and are not well-defined. No single cardinal scale encompassing all theories exists or can be constructed." | "Rational action under profound moral uncertainty requires a procedural solution respecting the incommensurability of distinct moral frameworks, such as bargaining between the prescriptions of different theories, a 'parliament' where theories vote, or treating each serious theory's core demands as inviolable side-constraints." |

  **Cruxes of the Disagreement:**

  | Crux Question                                                                                                 | Agreed Test Case / Argument                                                                                                                               | ECP Prediction                                                                                                 | SCP Prediction                                                                                               |
  | :------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- |
  | **1. Are robust intertheoretic comparisons of choiceworthiness (levels & units) possible?**                   | *Case: Theory T+ (strong util) vs. Theory Td (strong deont):* Can we compare the *badness* of violating a Td constraint to some amount of disutility under T+? | *Yes, in principle.* Agents can make coherent, stable comparisons (e.g., "Violating *this* constraint feels roughly as bad as 1000 utils lost") even if imprecise. | *No.* Any purported comparison is arbitrary or merely reflects the comparer's *meta-theoretical* stance, not a fact about T+ and Td. |
  | **2. Is sensitivity to theory individuation a fatal flaw (reductio) or a manageable artifact (bookkeeping)?** | *Case: Splitting:* Agent has credence 0.6 in Util. Split Util into Util-A and Util-B (identical choiceworthiness), assign c=0.3 each. Does/should the recommended action change? | *Manageable.* Sensitivity reveals the procedure's structure; it can be addressed by careful individuation based on distinct justificatory bases. Output *should not* change with mere splitting/merging. | *Reductio.* Sensitivity demonstrates the procedure's arbitrariness and dependence on epistemically irrelevant formal manipulations. Changes reveal incoherence. |
  | **3. Under uncertainty about comparability, what does EC prescribe?**                                         | *Argument:* If ECP assigns credence `p` to "Comparisons Possible" and `1-p` to "Comparisons Impossible", what does maximizing EC require?                  | "Max EC *requires* attempting comparisons where possible. If comparisons are truly impossible (credence `1-p`), EC *fails to prescribe*, forcing fallback (e.g., SCP's procedure under that uncertainty branch)." | *(N/A - Rejects EC)*                                                                                         |
  | **4. Under uncertainty about comparability, what does SCP's procedure recommend?**                            | *Argument:* If SCP assigns credence `q` to "Comparisons Possible" and `1-q` to "Comparisons Impossible", what does their preferred procedure recommend?  | *(N/A - Rejects SCP)*                                                                                          | "Our procedure (bargaining/side-constraints) *already assumes* incomparability. It runs regardless of `q`. High `q` might suggest weighting theories differently within the procedure, but *not* via cardinal comparisons." |
  | **5. Does bargaining/parliament yield intuitively rational results in hard cases where EC seems clear?**       | *Case: Miniscule Risk:* Theory A forbids action X (CW = -∞). Theory B (c=0.99999) says X is best (CW=+1000). A tiny credence (c=0.00001) in A. EC forbids X. | "Bargaining/Parliament likely permits X (as B 'wins'). This is *irrational* due to the catastrophic risk under A, ignored by the procedure." | "EC's prescription is *dictated* by an infinitesimally held theory. Bargaining/Parliament properly reflects the overwhelming support for B, permitting the highly beneficial X. Avoiding infinitesimal vetoes is rational." |

  **Verbal vs. Substantive Disagreements:**

  *   **"Rational":** Some disagreement might be verbal regarding what constitutes "rational" action under uncertainty. ECP defines it instrumentally as maximizing expected value (extending from empirical uncertainty). SCP defines it procedurally as following a fair process respecting incommensurable sources of normativity. *This difference is substantive*, rooted in deeper meta-ethical commitments about the nature of rationality and value.
  *   **"Procedure":** The term "procedure" is used differently. For ECP, the procedure is the *calculation* of EC based on inputs (theories, credences, comparisons). For SCP, the procedure is the *alternative mechanism* (bargaining, voting) that replaces the calculation because the inputs for EC are deemed insufficient. *This reflects the substantive core disagreement about comparability.*
  *   **"Choiceworthiness":** Both use "choiceworthiness," but ECP assumes it is cardinally measurable and intertheoretically comparable *in principle*, while SCP uses it only as an ordinal, intra-theoretic ranking. *This difference is substantive and fundamental.*

  **Likely Failures in Drafting & Alternative Verdicts:**

  1.  **Vacuous "Easy Cases" (Point 4):** The agreed-upon "easy cases" are likely too thin. Disagreement might lurk beneath the surface about *which* cases truly are easy or *why* unanimity occurs. An argument showing that what one character considers an "easy" case (e.g., saving a child from drowning) actually involves latent, unresolved intertheoretic disagreements about *why* it's obligatory could make this point less substantial common ground.
  2.  **Slanted "Formal Structure" (Point 3):** The formal description subtly favors the ECP by framing choiceworthiness as a function waiting to be summed. An SCP might argue this already presupposes comparability. A different verdict might arise if the formal structure were presented more neutrally, e.g., "Each theory \( T_i \) provides a *ranking_ or _set of imperatives_ over actions," leaving the aggregation method entirely open.
  3.  **Papering Over Meta-Uncertainty Responses (Points 7 & Cruxes 3/4):** The responses to meta-uncertainty (especially ECP's forced fallback) are fragile compromises. A compelling case could show:
      *   For ECP: If the fallback (SCP procedure) violates what EC *would* prescribe *if* comparisons *were* possible (even under low credence), it highlights the instability. (e.g., Fallback allows a small risk of catastrophe EC would forbid if comparisons existed).
      *   For SCP: If their procedure remains unchanged under high credence in comparability (`q`≈1), it seems stubbornly irrational to *not* use the potentially more precise EC information. A case where bargaining leads to clearly suboptimal outcomes *if* comparisons *were* valid would challenge SCP's stance under meta-uncertainty.
  4.  **Underspecified Alternatives (SCP Claims):** The SCP's preferred "procedures" are less formally developed than EC. A rigorous formalization of bargaining or side-constraints might reveal internal inconsistencies, sensitivity to framing, or consequences both characters find absurd, shifting the perceived viability of alternatives. A specific, formalized bargaining model producing a strongly counterintuitive result despite seeming procedural fairness could be decisive.
  5.  **The "Killer Case":** The entire document rests on the *prima facie* plausibility of both positions in different cases. A single, rigorously constructed hypothetical case where **both** characters strongly agree on the intuitively correct action, but where **only one** procedure reliably delivers that action (and the other consistently delivers the *wrong* action), could fracture the agreement on the "map" presented here and force a re-evaluation of which cruxes are genuine and which procedure truly captures rationality. Finding such a case is the holy grail (or nightmare) of their debate.

  This document represents not a resolution, but a meticulously charted map of their intellectual battlefield. They sign it as an acknowledgment of the ground shared, the trenches dug, and the fundamental artillery positions whose aim cannot yet be adjusted. It is the artifact of a dialogue that clarified the disagreement beyond hope of easy reconciliation.
