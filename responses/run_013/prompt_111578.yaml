prompt: |-
  I teach a third-year political philosophy course and next week I have one ninety-minute session on Sen's liberal paradox — the result that no collective choice rule can satisfy both a minimal liberal condition (at least two individuals each decisive over some pair of alternatives, where decisive means that if the individual strictly prefers one to the other, so must society) and the weak Pareto principle (if everyone strictly prefers one alternative to another, so must society). My students can handle preference orderings and transitivity; they have not seen Arrow's theorem and I do not want the session to turn into a lecture on it. They will arrive, I expect, with the vague sense that this is a voting paradox of the Condorcet kind, that it shows liberalism is somehow incoherent, that it is really an argument against the Pareto principle, or that it evaporates once you notice that the people in the standard example are being nosy about one another's reading habits.

  What I want from you is not an explanation of the paradox but a teaching plan for it. In what order must the pieces be introduced — orderings, decisiveness, weak Pareto, the construction — and what depends on what, so that the contradiction feels like something the students could have discovered rather than a trick performed on them? Choose the single case that should carry the session, and say what it must contain (how many people, how many alternatives, what shape of preference profile, and how meddlesome the preferences have to be) and what it must not contain; tell me whether the case everyone uses is the right one or whether a fresher case would serve better, and why. Then the misconceptions, each with the precise point in the sequence at which it should be headed off: the ones I named, plus the thought that the theorem is a defect of the Pareto principle rather than a tension between two things we independently care about, and the thought that it is a theorem about rights rather than about a formal notion of decisiveness. Tell me what to leave out on purpose at this level, and give me one question to put to the room in the last ten minutes that would reveal whether they have grasped the structure of the conflict rather than merely memorised the example. No readings, citations, or bibliography — the plan should stand on its own.

  Return it as a JSON object with exactly these fields: "sequence" (an array of objects, each with "step", "idea", "why_it_must_come_here", and "misconception_headed_off_here"); "carrying_example" (an object with "case", "must_have", "must_lack", "why_not_the_obvious_case"); "misconceptions" (an array of objects with "misconception", "why_students_form_it", "where_in_sequence_to_address"); "deliberate_omissions" (array of strings, each with a one-line justification); "understanding_check" (an object with "question", "what_a_good_answer_shows", "what_a_bad_answer_shows").
reasoning: |-
  We are constructing a teaching plan for Sen's liberal paradox. The goal is to introduce the concepts step by step so that the contradiction feels discoverable, not like a trick. We'll use a standard example but note why it's chosen. We'll also address misconceptions at specific points.

  Sequence: We need to build up the ideas in a logical order, starting from basic concepts and leading to the paradox. The steps should introduce:
  1. Preferences and collective choice rules.
  2. The weak Pareto principle.
  3. The minimal liberalism condition (decisiveness over at least one pair for at least two individuals).
  4. The construction of a preference profile that causes a cycle or contradiction.

  Carrying Example: We'll use the classic "Lady Chatterley's Lover" example (with individuals A and B and three alternatives) because it is clear and standard. However, we note why we use it and what it must contain/lack.

  Misconceptions: We'll address common misunderstandings at the right points in the sequence.

  Deliberate Omissions: We avoid Arrow's theorem and other advanced topics.

  Understanding Check: A question to test if they grasp the structure.

  Let's structure the JSON as requested.
