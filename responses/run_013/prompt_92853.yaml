prompt: |-
  I work at a software company that's just opened a small office in Lagos, and I've somehow ended up refereeing a Slack arguement I can't follow, let alone settle.

  We've got hardware stuck in customs. The guy running the Lagos office says we should just pay the "facilitation fee" the officer is asking for — everyone does it, and refusing means six weeks in a warehouse and a missed launch. Our finance lead in London says that's bribery, full stop, and once you start you never stop. Then our contractor in Nairobi wades in and says we're both being naive: the wrong thing here is a salaried official shaking down a company, whereas the envelope she'd hand over at a cousin's wedding is a completley different act, and lumping the two together is an insult. Finance says a gift you're expected to repay in favours is just a bribe with better manners.

  Nobody's moved in three weeks, and I keep noticing we slide between four different arguments: what's illegal where, what actually damages the country, who's disrespecting whom, and who gets to decide any of it. I tried to pin it down with two cases — (a) the officer waves us through for free because I went to school with his brother, and (b) we pay the same money to his wife's consultancy for "advice" we don't need. Finance says both are corrupt; Lagos says (a) is a favour between people and (b) is just business; and neither of them thinks the other is even answering the question. Someone also said corruption is an "essentially contested concept", which I took to mean nobody can be wrong, which sounds like a cop-out.

  My hunch, and please actually test it rather than agree with it: this isn't a disagreement about corruption at all, it's a disagreement about what a moral argument is supposed to do. London wants a rule you can apply without knowing who you are; Lagos keeps saying it depends on the relationship. If that's right, is it still a real disagreement, or two people answering different questions under one word?

  What I want is a diagnosis, not a verdict. Is there a hidden factual question doing the work (does the fee actually speed things up, or just fund a racket)? Is it a fight about which cases count as evidence — whether his shrug or our disgust is data about anything? Or is it bedrock, where neither side can give a reason the other is obliged to accept? And then, given the diagnosis, tell me what would count as progress: a distinction that cleanly seperates a gift from a fee from a bribe from extortion, a change of question, or the honest answer that this one can't be settled and we should stop pretending otherwise.

  One last thing I want taken seriously: when someone said that if we're being consistent we'd have to call lobbying and "networking" corruption too, everyone went quiet. If the word swallows up Christmas presents and drinks after work, does it still do any work at all? Is that a real problem for the concept or just a cheap move?

  British English please, and no reading list — I'm not going to read any of it, I just want the shape of the disagreement.
reasoning: |-
  Alright, let me try to unpack this user's problem. They're stuck in a Slack argument about whether to pay a "facilitation fee" in Lagos to get hardware through customs. The Lagos office wants to pay it to avoid delays, London finance calls it bribery, and a Nairobi contractor sees it as different from cultural gifts. The user feels there are four intertwined arguments: legality, harm to the country, respect, and who decides. They suspect the core conflict isn't about corruption itself but about how moral arguments work—universal rules vs. context-dependent relationships.

  First, I need to confirm if the user's hunch is valid. The Lagos perspective emphasizes relationships and context, while London focuses on consistent rules. This aligns with cultural frameworks like universalism vs. particularism. The Nairobi point adds another layer, distinguishing between coercive extortion and voluntary gifts. So yes, the disagreement is fundamentally about moral reasoning methods.

  Next, the user wants a diagnosis, not a verdict. They mentioned hidden factual questions, like whether the fee actually speeds things up or is part of a racket. But the team isn't discussing evidence; they're stuck on principles. That suggests the factual issue isn't driving the debate. Instead, it's about conflicting bedrock values. Neither side can convince the other because their moral foundations differ—London sees bribes as inherently wrong, Lagos as a practical necessity within relationships.

  The user also brought up the "essentially contested concept" point. Corruption's definition varies by context, making consensus difficult. When someone compared it to lobbying, it highlighted Western hypocrisy, causing silence. This isn't a cheap move; it exposes the term's flexibility and potential double standards, which undermines London's absolutist stance.

  For progress, the user needs practical steps. Distinctions between gifts, fees, bribes, and extortion might help but won't resolve the core clash. Instead, shifting the question to risk management and local compliance could bypass the moral deadlock. Acknowledging the irreconcilable values and focusing on concrete outcomes—like avoiding legal exposure—might move the discussion forward.

  Finally, the user emphasized avoiding a reading list and wanting British English. Keeping the analysis concise and focused on the disagreement's structure is key. Highlighting the different moral frameworks and suggesting pragmatic next steps addresses their need for clarity without academic references.
answer: |-
  Right, let's dissect this standoff. You're spot-on that the *surface* argument about "is this corruption?" is masking a deeper, more fundamental clash about how moral reasoning *works*. Here's the diagnosis, broken down:

  1.  **The Core Disagreement: Moral Universals vs. Moral Particularism**
      *   **London (Finance):** Operates on a **deontological/universalist** framework. Morality is about rules and principles (like "bribery is wrong") that apply equally to everyone, everywhere, regardless of context or relationships. The *act itself* (paying an official for an advantage) defines its morality. Consistency and avoidance of slippery slopes are paramount ("once you start..."). The "facilitation fee" is a clear violation of the rule.
      *   **Lagos (Office Lead):** Operates on a **particularist/relational** framework. Morality is deeply contextual. The *nature of the relationship* and the *social function* of the exchange are crucial. A favour between connected individuals ("I went to school with his brother") is part of social glue, distinct from a cold, impersonal shakedown or a business transaction (even a dubious one like the wife's consultancy). What matters is maintaining relationships and getting things done within the understood local system. The rule isn't absolute; it bends to context.
      *   **Nairobi (Contractor):** Adds nuance, highlighting **intent and power dynamics**. They distinguish between *extortion* (coercive, top-down abuse of power by the official) and a *gift/favour* (voluntary, reciprocal, embedded in social/cultural norms like weddings). Lumping them together as "corruption" ignores this crucial difference in how the exchange functions socially and morally.

  2.  **The Hidden Factual Question (Less Important Than You Think?):**
      *   While the *practical reality* ("Does paying *actually* speed things up vs. fund a racket?") seems crucial, **it's not actually driving the core disagreement**. Both sides likely *believe* their version of the facts aligns with their moral stance. London assumes it fuels systemic abuse; Lagos assumes it's a necessary operational cost. The argument isn't stalled for *lack* of facts, but because the **facts are interpreted through incompatible moral lenses**. Your colleagues aren't treating this as an empirical question needing proof; they're treating it as an *axiomatic* one.

  3.  **The Evidence Fight (Shrugs vs. Disgust):**
      *   Yes, this is happening. **Lagos/Nairobi view the officer's expectation and local norms ("everyone does it," the shrug) as *evidence* of the relational context defining the act.** The act isn't inherently corrupt *in that context*.
      *   **London views the act itself and their disgust as *evidence* of the universal wrongness.** The local context doesn't *excuse* the act; it merely *explains* why corruption is endemic.
      *   **Result:** They aren't just disagreeing on *what* counts as evidence, but on the **hierarchy of evidence**. Is local practice/normative understanding the primary guide, or is the abstract principle?

  4.  **Is it Bedrock?**
      *   **Very nearly.** The disagreement reaches down to **fundamentally different conceptions of how morality functions in the social world:**
          *   Is morality defined by abstract rules applied uniformly?
          *   Or is it defined by the web of relationships, obligations, and contexts within which actions occur?
      *   **London cannot accept Lagos's framework** because it seems like moral relativism and opens the door to endless justification. **Lagos cannot accept London's framework** because it feels rigid, culturally imperialistic, and ignores the reality of how things work and how people relate.
      *   **Nairobi's point reinforces this:** Calling both extortion and a wedding gift "corruption" feels like a category error *because* the underlying social logics are different. London sees the *form* (exchange of value for influence); Lagos/Nairobi see the *substance* (nature of the relationship, voluntariness, social function).

  5.  **What Counts as Progress?**
      *   **A perfect distinction (gift/fee/bribe/extortion)?** Unlikely and probably counterproductive. Chasing a universally agreed definition of "corruption" *in the abstract* is the trap you're already in. Definitions require shared premises you lack.
      *   **A change of question:** **This is the most viable path forward.** Shift the focus *away* from the unresolvable moral/philosophical debate "Is this corruption?" towards **pragmatic, risk-based, and local-compliance questions:**
          *   "What are the **legal risks** (UK Bribery Act, Nigerian law) of paying vs. not paying *in this specific instance*?"
          *   "What are the **operational & financial risks/costs** of delay vs. paying? (Quantify the 'six weeks in warehouse' cost)."
          *   "What **documentation/process** exists (if any) for this 'fee'? Is it receipted? Does it *look* like a bribe on paper?"
          *   "Are there **alternative legitimate channels** within the local system to expedite (escalating within customs, using a bonded agent differently, etc.)?"
          *   "What is our **company policy** (if one exists)? How does *legal* advise we proceed?"
      *   **Acknowledging the Irreconcilable:** Explicitly state: "We fundamentally disagree on whether this *is* corruption. We won't resolve that. We *must* decide how to act based on risk, cost, legality, and policy, *despite* that disagreement." This stops the circular moral argument and forces a practical decision.

  6.  **The "Lobbying/Networking" Point: Is it Fatal?**
      *   **It's a serious point, not a cheap move.** It highlights the **hypocrisy and cultural specificity** inherent in many "anti-corruption" stances.
      *   **Does it destroy the concept?** No, but it **complicates it enormously** and forces nuance. It shows that:
          *   **Context Matters:** A lavish dinner for a regulator is viewed differently in London than cash to a customs officer in Lagos, even if the *intended outcome* (favourable treatment) is similar.
          *   **Power & Access Matter:** "Networking" often grants systemic, structural advantage to those already powerful, which shares functional similarities with corruption in its effect, even if the *mechanism* (social connection vs. direct payment) differs.
          *   **The concept *can* still work,** but **only if we accept it's fuzzy at the edges and context-dependent.** We can say "extorting a facilitation fee under threat of delay is clearly corrupt under Nigerian law and our principles," while also acknowledging that "cultivating relationships through expensive dinners in Mayfair walks a fine ethical line but operates within a different (though often problematic) legal and social framework." Refusing *all* nuance because of the hard cases leads to paralysis or hypocrisy. **The key is transparency, proportionality, legality, and avoiding *coercion* or *undue* influence.** The Nairobi contractor's distinction between coercion and gift is crucial here.

  **Diagnosis Summary:** You have a **fundamental clash of moral frameworks** (universal rules vs. contextual relationships) masquerading as a debate about the definition of "corruption." This is compounded by different interpretations of evidence (local norms vs. abstract principles) and different weightings of risk (operational vs. legal/moral). It's not *quite* bedrock – practical solutions exist – but the core *moral* disagreement is likely irreconcilable.

  **Path to Progress:**
  1.  **Acknowledge the Irreconcilable Moral Divide:** Stop trying to *win* the "is it corruption?" argument. State it openly.
  2.  **Shift the Question:** Pivot decisively to **risk assessment, cost/benefit analysis, legal compliance, and company policy.** Frame the decision in these terms.
  3.  **Gather Concrete Data:** Quantify the cost of delay. Get clear legal advice on UK and Nigerian law regarding such payments. Explore *all* legitimate alternatives exhaustively.
  4.  **Make a Pragmatic Decision:** Based on 2 & 3, make the call. It might be "pay under duress to save the launch, document it meticulously for legal/audit, and immediately work on long-term strategies to avoid this (e.g., better agent relationships, pre-clearance processes)," or "accept the delay, absorb the cost, and take a principled stand this time."
  5.  **Address the Long-Term:** Use this to develop a clear, nuanced, locally-informed **Anti-Bribery & Corruption (ABC) policy** that acknowledges grey areas and provides practical guidance for employees facing these pressures, rather than just stating absolutes.

  The goal isn't moral consensus; it's reaching an *actionable decision* despite the profound disagreement, based on factors *other* than winning the philosophical debate. That's progress.
