  Alright, I need a number out of you, not a reading list — I'm refereeing something and I keep flip-flopping.

  The paper defends what it calls the no-reciprocity thesis: the outside view is a one-way corrective. You tame a self-serving inside view by appeal to a reference class, but the choice of reference class is never itself answerable to case-specific inside-view judgment. The author says thats what makes the outside view genuinely more objective, rather than just a different heuristic. I'm at about 0.4. A collegue down the hall is at 0.85 and thinks I'm being precious about it.

  So: give me your credence that the thesis is true as stated, and decompose it — a rough number and one line of justification for each term. How much rides on whether reference-class selection is always already an inside-view judgment about relevance; whether some reference classes are fixed by causal structure rather than by our interests; whether the regress (an inside view about which outside view to adopt) is vicious or benign; whether epistemic modesty names a virtue at all or is just a policy for people who don't trust their own priors; and whatever other terms you think belong. Then tell me how they combine into your final number.

  Two more things. First, say what would make the thesis false — what argument or observation would count against it, as opposed to just making it hard to apply. Second, tell me which single sub-question my number is most sensitive to, and whether the 0.4-vs-0.85 gap most likely lives in a disagreement about reference classes or in a disagreement about what objective is supposed to mean here. If my statement of the thesis is mush, tighten it first and then answer. No citations needed, obviously.
