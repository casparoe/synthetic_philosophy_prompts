answer: |-
  Here’s a comprehensive exam package designed to push students beyond slogans and force engagement with the mechanics of heritability analysis. The question explicitly targets common misconceptions while rewarding deep conceptual understanding.

  ---

  ### **(a) ESSAY QUESTION (20 marks total, closed-book, 2 hours)**  
  **Critically evaluate the following argument using the Nordland-Sudland data and your knowledge of behavior genetics:**  
  > *"The Sudland cognitive gap is mostly environmental (h²=0.3), whereas Nordland’s differences are mostly genetic (h²=0.8). Therefore, funding should prioritize Sudland."*  
  **Address in your answer:**  
  1. **Why the pundit’s inference about the *causes of mean differences* between Nordland and Sudland is flawed, using the formula for heritability (h² = V<sub>G</sub> / V<sub>P</sub>). (8 marks)**  
  2. **What the heritability *difference* (Nordland h²=0.8 vs. Sudland h²=0.3) actually reveals about V<sub>G</sub>, V<sub>E</sub>, and V<sub>P</sub> in each province. (6 marks)**  
  3. **Why Nordland’s stable heritability (~0.8) after the iodine intervention—which raised mean scores—is consistent with behavior genetics theory. (6 marks)**  

  ---

  ### **(b) MODEL ANSWER (710 words)**  
  **The pundit’s argument commits a fundamental category error by conflating heritability (a *variance* statistic) with causal explanations for *mean differences* between populations. This reflects a deeper misunderstanding of what heritability can and cannot measure, and the Nordland-Sudland data systematically expose these flaws.**  

  **First**, heritability (h² = V<sub>G</sub> / V<sub>P</sub>) quantifies the proportion of *within-population variance* (V<sub>P</sub>) attributable to genetic variation (V<sub>G</sub>) in a *specific environment*. It says nothing about *why* Nordland’s mean score is higher than Sudland’s. Nordland’s high h² (0.8) indicates that in its *homogeneous environment* (uniform schooling, nutrition, etc.), individual differences arise largely from genetic variation. Sudland’s low h² (0.3) signals that in its *heterogeneous environment*, environmental variation (V<sub>E</sub>) dominates V<sub>P</sub>. Crucially, Nordland’s high h² could arise because its environmental uniformity *suppresses V<sub>E</sub>*, inflating V<sub>G</sub>/V<sub>P</sub>—not because genes are "stronger." The pundit erroneously interprets high h² as proof that Nordland’s *superior mean performance* is genetically determined. In reality, Nordland’s high mean could be entirely environmental (e.g., better baseline nutrition), even if individual differences within Nordland are mostly genetic. The funding conclusion thus collapses: Sudland’s low h² suggests its environment is *so unequal* that equalizing it (e.g., improving schools) could reduce V<sub>P</sub> and raise the mean, but Nordland’s high h² doesn’t imply its mean is unchangeable.  

  **Second**, the heritability difference (0.8 vs. 0.3) reflects divergent *environmental variances* (V<sub>E</sub>), not inherent genetic properties. In Nordland, low environmental diversity minimizes V<sub>E</sub>, so V<sub>G</sub> constitutes most of V<sub>P</sub> (h²=0.8). In Sudland, high environmental diversity (variable schooling/nutrition) amplifies V<sub>E</sub>, diluting V<sub>G</sub>/V<sub>P</sub> (h²=0.3). V<sub>G</sub> could be identical in both provinces! The difference in h² arises because V<sub>P</sub> = V<sub>G</sub> + V<sub>E</sub> + Cov<sub>GE</sub> + V<sub>error</sub>. Sudland’s greater V<sub>E</sub> increases V<sub>P</sub>, reducing h² even if V<sub>G</sub> is unchanged. Thus, the pundit’s claim that Nordland’s differences are "mostly genetic" misleads: high h² signifies environmental *homogeneity*, not genetic *dominance*. Worse, it ignores gene-environment covariance (Cov<sub>GE</sub>): in Sudland, poverty might genetically correlate (e.g., genetically advantaged children access better schools), inflating V<sub>G</sub> estimates. The heritability gap alone cannot justify redistributing funds; Sudland’s low h² might actually signal greater *environmental malleability* of outcomes.  

  **Finally**, Nordland’s stable h² (~0.8) post-iodine is not paradoxical—it perfectly illustrates the population-relativity of heritability. The intervention raised *mean* scores by improving a universally deficient factor (iodine), but did so *uniformly*. Uniform environmental shifts affect all individuals equally, reducing *neither V<sub>G</sub> nor V<sub>E</sub>* proportionally. Since V<sub>G</sub> remains constant and the uniform boost minimizes new environmental variance (ΔV<sub>E</sub>≈0), V<sub>P</sub> stays stable. Thus, h² = V<sub>G</sub>/V<sub>P</sub> remains ~0.8. This demonstrates that heritability is agnostic to mean-level changes: it can persist unchanged even when environmental improvements dramatically raise population performance. The pundit’s logic would mistakenly interpret stable h² as proof that iodine "didn’t matter"—but it clearly did. Heritability measures *sources of variation*, not *sources of the mean*.  

  **In sum**, the pundit’s argument fails because it treats heritability as a measure of genetic *determination* rather than genetic *variation*. Nordland’s high h² reflects its egalitarian environment, not genetic superiority. Sudland’s low h² highlights environmental inequality, not genetic irrelevance. Funding should target environmental disparities in *both* provinces: Sudland to reduce V<sub>E</sub> and raise its mean, Nordland to address deficiencies (like pre-iodine nutrition) that suppress mean performance without affecting h². The data underscore that heritability is a local variance ratio—not a tool for ranking populations or absolving environmental reform.  

  ---

  ### **(c) MARKING SCHEME (5 x 4 marks each)**  
  **Must-hit points** (Deduct 1–4 marks per point for errors/omissions; award partial credit):  

  | **Point (4 marks each)** | **Common Mistakes (↓1–4 marks)** |
  |--------------------------|----------------------------------|
  | **1. Distinguishes variance (V<sub>P</sub>) from mean differences:** Correctly states heritability (h²) quantifies *within-group variance*, not *between-group mean differences*. Uses formula h² = V<sub>G</sub>/V<sub>P</sub> to show why Nordland’s high h² ≠ genetic cause of high mean. | "High h² means genes cause Nordland’s superiority"; "Low h² means environment causes Sudland’s low mean." |
  | **2. Explains heritability difference via V<sub>E</sub> (not V<sub>G</sub>):** Identifies that Nordland/Sudland h² gap likely reflects Sudland’s higher V<sub>E</sub> (due to environmental diversity), not necessarily different V<sub>G</sub>. Notes h² = V<sub>G</sub>/V<sub>P</sub> falls if V<sub>P</sub> rises. | Assumes Nordland’s h²=0.8 = "higher genetic influence"; ignores V<sub>E</sub>’s role in reducing h². |
  | **3. Resolves iodine "paradox":** Explains uniform environmental improvements raise means *without* altering V<sub>G</sub> or proportionally changing V<sub>P</sub>, so h² remains stable. Emphasizes heritability’s indifference to mean shifts. | Calls it a contradiction; claims h² "should" change; argues iodine’s effect disproves high h². |
  | **4. Identifies limitations of h²:** Notes h² is population-specific, ignores Cov<sub>GE</sub>/G×E, and says nothing about trait malleability. Highlights that high h² can coexist with strong environmental effects (iodine!). | Treats h² as fixed "genetic contribution"; claims high h² implies low malleability. |
  | **5. Synthesizes policy implications:** Rejects pundit’s funding conclusion. Argues Sudland’s low h² suggests environmental *inequality* is key; Nordland’s stable h² post-iodine shows environments *can* improve outcomes despite high h². | Endorses pundit’s view; suggests funding only Sudland; claims Nordland is "genetically maxed out." |

  **A vs. B Script Differentiators:**  
  - **A Scripts:** Explicitly calculate how V<sub>P</sub> = V<sub>G</sub> + V<sub>E</sub> + Cov<sub>GE</sub> shapes h² differences (Point 2). Use iodine case to **prove** that environmental effects can alter means without changing h² (Point 3).  
  - **B Scripts:** Correctly identify flaws but miss mechanistic links (e.g., "h² is population-relative" without showing *why* via V<sub>E</sub>/V<sub>P</sub>). Mention Cov<sub>GE</sub>/G×E but fail to tie to Nordland/Sudland contrast.  

  **Key Punishments for Sloganeering:**  
  - "-4" for stating "heritability is population-specific" without explaining **how** V<sub>E</sub> drives the difference.  
  - "-4" for calling the pundit "wrong" but still treating h²=0.8 as "mostly genetic" in an absolute sense.  

  ---

  ### **Why This Works**  
  - **Forces Engagement with Variance:** Parts 1–3 demand unpacking V<sub>G</sub>, V<sub>E</sub>, V<sub>P</sub> (not just defining h²).  
  - **Prevents Bluffing:** Fabricated data + iodine case blocks memorized critiques; requires applying formulas.  
  - **Explicit Crux:** Question text flags key pitfalls (mean vs. variance, interpreting h² differences, stability post-intervention).  
  - **Clear A/B Distinction:** Rubric rewards mechanistic explanations (e.g., *how* uniform shifts preserve h²) over vague appeals to "relativity."  

  This question rewards students who see heritability as a dynamic variance decomposition—not a soundbite. Let me know if you’d like a shorter version or adjustments to the data!
