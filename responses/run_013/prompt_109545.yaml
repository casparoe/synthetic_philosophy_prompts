prompt: |-
  I'm putting together the final exam for my upper-level seminar on philosophy of biology — the last third of the course is behaviour genetics and the nature/nurture wars — and I want one long essay that I can grade quickly, and that won't just turn into a recitation of the "heritability is a population statistic" mantra. By week ten they can all chant that in their sleep, and then they think they're finished, which is exactly the problem: they have the slogan and none of the machinery behind it. So I've built the question around a made-up data set, invented by me and not from any real study (so nobody can google it, and I don't have to worry about the numbers being wrong — they're stipulated): two neighbouring provinces, call them Nordland and Sudland, where a consortium measures the same cognitive outcome in the same age cohort with the same instrument. Nordland is rich and internally very homogeneous — everybody gets roughly the same schooling, nutrition, healthcare; the heritability estimate comes out around 0.8. Sudland is poorer and much more internally variable on all of those things; heritability comes out around 0.3. Then a third wrinkle: a decade later in Nordland, a universal iodine-supplementation programme raises the mean score noticeably, while the heritability estimate stays right where it was, ~0.8. And then I staple on a fabricated op-ed excerpt in which a pundit concludes from the first two numbers that "the Sudland gap is mostly environmental, whereas in Nordland the differences are mostly genetic, so the money should go to Sudland."

  Could you write me (a) the essay question itself, with maybe three parts and the marks spelled out, for a closed-book two-hour exam; (b) a model answer of around 700 words, written the way a genuinely strong student would write it — I'd rather it take a clear stand than hedge everything; and (c) a marking scheme with five must-hit points worth 4 marks each out of 20, and for each point a one-liner on how students typically blow it. In the scheme, please also flag the two or three specific moves that separate an A script from a B script, so the distinction is something I can actually point to on the page rather than a vibe. Things I want the question to force them to do, in case it helps you aim it: use the formula for heritability as a ratio of variances and say what each term does and doesn't track, say what a heritability *difference* between two populations can and can't tell you, and explain why the iodine result is not a paradox. For context, they've had the standard critiques — norms of reaction, the variance-decomposition stuff, the point that these estimates are environment-relative — but they've mostly memorised them as slogans, and I want the question to punish that. The TA's have been telling me the previous version of this question was too easy to bluff on, so I'd rather err on the side of making the crux explicit in the question than leaving it as a trap.
