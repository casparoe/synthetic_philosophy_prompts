prompt: |-
  Okay so this is kind of a big deal and I really want to not get cooked in front of everyone. I'm a senior in high school and I'm doing a dual-enrollment metaphysics seminar at the local university, and through a series of events too boring to explain I ended up being the person presenting a paper at the last seminar of the semester — twenty minutes, then Q&A. My paper defends a version of counterpart theory against the standard view that I am literally the same person in other possible worlds (the Kripke-style picture, where "I could have been a vet" is about me, in a world where I'm a vet instead). But I'm not defending Lewis's version, because the similarity relation always seemed like a cop-out to me — nobody can ever say how similar is similar enough, so "counterpart" ends up meaning whatever you want it to mean. What I want to say instead is that the counterpart relation is counterfactual dependence: the person in the counterfactual scenario who counts as me is the one whose existence and properties depend on me in the right way — the person you get when you make a small, contextually relevant change to how things actually went. Which changes count as small and relevant is fixed by the conversation, so "I could have been a vet" can be true in one conversation and false in another and there's no purpose-free fact of the matter. And I want the relation to come in degrees, so sometimes it's just vague whether somebody is my counterpart, and I think that's a feature, not a bug. One line version: no transworld identity, only context-relative counterparts, and the counterpart relation is dependence, not similarity.

  Here's the room, which is the part I'm worried about. It's about twelve people. The professor who runs the seminar works on modality and is basicly a modal realist who thinks Lewis already solved all of this and that anyone messing with the counterpart relation is either confused or doing semantics under a different name — and I have a bad feeling his first question is going to be about the relation itself, like what makes a relation the *right* one, and I definately don't have a good answer yet. There are two grad students: one does formal stuff, modal logic and semantics, and will want to know exactly what de re modal logic survives on my view and whether I'm willing to pay the price; the other knows all the classic objections to counterpart theory by heart and clearly enjoys them. Then a handful of undergrads — one is a hardcore Kripkean who read a lot of this on his own and thinks counterpart theory is a cheat that changes the subject, one is really into Parfit and personal identity and thinks my view secretly turns me into a "series of stages" spread across worlds, and a couple took the class for a requirement and mostly care about whether any of this means they don't really have free will or whether it clashes with their religion. Plus my friend from school, who is only there for moral support and will ask the one innocent question that turns out to be the hardest one in the room.

  So: act like a philosopher who works on modal metaphysics and has sat through a hundred of these Q&As and knows exactly how this kind of talk goes wrong. Before you write anything, brainstorm the strongest version of the case against me — assume my view is worse than I think it is — and then write me a prep sheet. I want the objections I'll actually get from *this* room, not a generic list of problems with counterpart theory, ordered by how much damage they'd do to me, each phrased the way the specific person who'll raise it would phrase it, with a reply I could actually deliver in about two minutes and a note on where that reply is soft or hand-wavy. Tell me what to concede in the first thirty seconds to buy credibility, which objection I should just give up on instead of fighting, and which single reply has to land or the whole paper is dead. And include the question I'm hoping nobody asks — I'd rather see it now than in the room. No reading list or citations, please; I can't look anything up in there and I have enough to read already. Don't be nice to me about it.
