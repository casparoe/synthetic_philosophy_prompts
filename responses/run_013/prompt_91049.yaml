  ## Sestina for Gödel’s Turning Cosmos

  This cosmos turns upon a hidden **rotation**,
  Its dust defines a universal **curve**,
  Where cause itself must chase its tail in **light**.
  No universal slice defines **simultaneity**,
  The fixed celestial scaffold, Newton's **order**,
  Dissolves. Where stands the absolute of **now**?

  The compass needle trembles. Where is **now**?
  The very stars enact their slow **rotation**,
  Binding all moments in a knotted **curve**.
  Each particle’s path, a thread of fading **light**,
  Denies the possibility of **simultaneity**,
  Unweaving the fabric of temporal **order**.

  What structure holds, what sequence keeps **order**,
  When every point might touch a different **now**?
  The cosmos spins, confounding **simultaneity**,
  Its gravity inherent in its **rotation**.
  Each geodesic bends to trap the **light**
  Within the inescapable, closing **curve**.

  Through dust and void, the fateful **curve**
  Completes itself, defying forward **order**.
  A traveler, pursuing their own **light**,
  Might meet the self that left some distant **now**.
  This is the gift of constant **rotation**:
  The erasure of universal **simultaneity**.

  No frame exists for pure **simultaneity**,
  On paths that loop within the cosmic **curve**.
  The dream of universal **order**
  Is fractured. Past and future haunt each **now**,
  Forged in the furnace of this **rotation**,
  Where moments blur like refracted **light**.

  What beacon holds? What constant guides the **light**
  Through labyrinths denying **simultaneity**?
  The principle that governs this **rotation**
  Is simple: matter curves the void, a **curve**
  That swallows sequence. Meaning hides from **now**,
  Dissolving cause and temporal **order**.

  If time’s not real, what anchors our **order**?
  Why count the syllables, why parse the **light**
  That falls on this constructed **now**?
  If truth denies all **simultaneity**,
  Why trust the rising sun, the falling **curve**
  Of seasons miming silent **rotation**?

  The poem spins, a futile **rotation**,
  Its measured lines a frail imposed **order**,
  Tracing the ghost of that lost **curve**.
  Each word arrives, a captive spark of **light**,
  Denied the grace of true **simultaneity**,
  Straining to speak the unspeakable **now**.

  Can form enact the physics? **Rotation’s**
  Deep **curve** denies the **order** we perceive as **now**.
  This **light** contends with lost **simultaneity**.
