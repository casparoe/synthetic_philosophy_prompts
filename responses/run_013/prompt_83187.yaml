prompt: |-
  A lot of institutions now resolve questions by lottery, and I want to know what each of these uses commits us to.

  The first use is to choose who decides. Criminal juries are drawn at random from the adult population, and over the past couple of decades several countries and cities have convened citizens' assemblies: bodies of somewhere between a few dozen and a few hundred people, chosen by lottery, paid, briefed by experts, facilitated, and asked to reach recommendations on a contested question, which are then sent to a legislature or a referendum. These draws are usually stratified — constrained so that the body matches the population on age, sex, region, and sometimes education — and anyone who declines is replaced by a fresh draw from the same stratum. The body is described as a fair sample of the public, or a miniature of it.

  The second use is to allocate scarce benefits. Where more people want a place or a permit than there are places or permits — a school, a subsidized apartment, a hunting licence — the surplus is often settled by lottery, and here nobody proposes stratifying anything; a draw weighted toward a group would be a scandal, and the point is said to be precisely that nobody's characteristics count.

  The third use is to allocate burdens. Where military conscription has been decided by lottery, the draw has run only among people already picked out by age and sex, so that the lottery distributes a burden inside a pool that was defined by non-random criteria, while the lottery itself is credited with the fairness of the result.

  What view of political equality, competence, and desert does this cluster presuppose? Take the three uses in turn and reconstruct the conception of equality each one only makes sense under — in particular, whether one and the same device can coherently serve both to make a body representative and to make an allocation deliberately blind to every characteristic. Is the fairness credited to the lottery in each case really coming from the lottery, or from the non-random decisions that fix the pool and the strata? Why is it unremarkable to constrain a draw by sex when composing a body that governs, and unthinkable to do so when handing out apartments? Note also that a body anyone may decline to join is not a random sample of the population, however the replacements are drawn, and that a jury must be unanimous while an assembly decides by majority. Which of these commitments do the practices strictly need, which do they merely fit well with, and where are they underdetermined, so that several rival theories of equality would license the same arrangements? Finally, tell me what would have to change if we replaced the presupposed view with a purely epistemic one, on which the value of a lottery is only that a large random body judges better than a small selected one.
reasoning: |-
  Okay, let me try to unpack this user's query. They're asking about the different uses of lotteries in institutions and what each implies about political equality, competence, and desert. 

  Hmm, the user has clearly thought deeply about this topic. They've identified three distinct lottery applications: choosing decision-makers (juries/citizens' assemblies), allocating scarce benefits (school spots/apartments), and distributing burdens (military conscription). Each seems to operate under different fairness assumptions. 

  First, I need to reconstruct the implicit equality concepts for each use. For decision-making bodies, stratified random selection suggests "descriptive representation" is key - the group should mirror the population. But for benefit allocation, any stratification would be scandalous! That points to "blind equality" where characteristics shouldn't matter. And for conscription, it's a hybrid - non-random criteria define the pool (age/sex), then random selection within that frame. 

  Wait, the user's central puzzle is whether "randomness" means the same thing across contexts. In assemblies we want representativeness (so we constrain randomness), but for apartments we want pure randomness (no constraints). Is that consistent? 

  Ah, and they're questioning where the fairness actually comes from. In juries, is it the random draw or the unanimous verdict requirement? In conscription, is it the lottery or the prior eligibility criteria? 

  The user also notes practical wrinkles: self-selection bias (declining to serve) and decision rules (unanimous vs majority). These might undermine the theoretical purity of "random representation." 

  Finally, they want to test what happens if we adopt a purely epistemic view - that lotteries are only valuable for aggregating wisdom. That would make stratification pointless, right? But then why do we feel descriptive representation matters? 

  This user is sophisticated - probably political philosophy or institutional design background. Their underlying concern seems to be whether our lottery practices reveal inconsistent intuitions about equality. I'll need to show how each context activates different dimensions of fairness without being contradictory. The key is recognizing that "equality" isn't monolithic - it has different meanings in different spheres of distribution. 

  The epistemic challenge is particularly sharp. If we care only about wise decisions, we'd optimize for competence, not representativeness. But our actual practices suggest we value standing ("who decides") independently of outcomes. That tension is worth surfacing.
answer: |-
  Your analysis reveals deep tensions in how lotteries embody competing conceptions of equality across contexts. Let's reconstruct the implicit commitments of each use:

  **1. Choosing Who Decides (Juries/Citizens' Assemblies)**  
  - **Presupposed Equality**: *Descriptive representation as constitutive of legitimacy*. Equality requires the decision-making body to mirror the population demographically (hence stratification). The lottery is fair *only when constrained* to achieve a "miniature public."  
  - **Competence/Desert**: Rejects elite competence; assumes ordinary people, properly briefed, can judge complex issues. Desert is irrelevant — no claim that winners "earned" the role.  
  - **Fairness Source**: Primarily from the *non-random stratification* (defining relevant groups) and institutional support (briefing/facilitation). The lottery merely operationalizes representativeness.  
  - **Key Tensions**:  
    - Self-selection bias (decliners) undermines pure randomness, but practice accepts this as pragmatically unavoidable.  
    - Unanimity (juries) vs. majority rule (assemblies) implies different theories of group judgment: consensus as truth-tracking vs. majoritarian will.  
  - **Commitments Strictly Needed**: Representation of predefined social categories (age, sex, etc.) is non-negotiable. Randomness alone is insufficient; it must be *engineered* to reflect population structure.

  **2. Allocating Scarce Benefits (Apartments/School Places)**  
  - **Presupposed Equality**: *Anti-classification equality*. Characteristics must be *irrelevant*; fairness demands blindness to all traits. Stratification would corrupt the process ("weighted draw = scandal").  
  - **Competence/Desert**: Desert is explicitly rejected — no one "deserves" the benefit more. Competence is irrelevant (e.g., no test for school aptitude).  
  - **Fairness Source**: Purely from the *unconstrained randomness* itself. The lottery’s fairness lies in its indifference to individual attributes.  
  - **Key Commitment**: Strict anonymity of persons. Any departure from pure randomness (e.g., favoring groups) violates equality by introducing "irrelevant" distinctions.

  **3. Allocating Burdens (Conscription)**  
  - **Presupposed Equality**: *Equal sacrifice within a morally relevant group*. Non-random criteria (age/sex) define who *ought* to bear the burden (e.g., "able-bodied adults"). The lottery then ensures equal exposure within that group.  
  - **Competence/Desert**: Competence is assumed via eligibility criteria (e.g., physical fitness for combat). Desert is negative: no one "deserves" to be conscripted, but all in the pool share equal obligation.  
  - **Fairness Source**: From the *non-random pool definition* (which reflects social consensus on responsibility) + *random distribution* within the pool. Fairness requires both elements.  

  **Coherence of the "Same Device"?**  
  Lotteries serve *incompatible* equality conceptions:  
  - In decision-making, lotteries *must classify* (via stratification) to be fair.  
  - In benefits, classification *invalidates* fairness.  
  - In burdens, classification defines the pool, but randomness applies within it.  
  **→ The device is flexible because "equality" is context-dependent:** descriptive representation for governance, anti-classification for windfalls, and group obligation for sacrifices.  

  **Epistemic Replacement: Consequences**  
  If lotteries were *only* epistemically valuable (large random groups > small elites):  
  - **Stratification collapses**: Demographic mirrors don't matter; only aggregate wisdom. Assemblies should maximize diversity of *viewpoints*, not sex/age quotas.  
  - **Self-selection becomes problematic**: Decliners might be wiser/more engaged, biasing the sample. Compulsory participation might be "fairer" epistemically.  
  - **Benefit allocation undermined**: If lotteries are epistemically optimal for decisions, why use them for apartments? No epistemic gain in randomizing windfalls.  
  - **Burdens rethought**: Conscription lotteries might persist (to avoid corruption), but eligibility pools could shrink to those "best suited" for combat.  
  - **Decision rules shift**: Epistemic goals favor supermajorities/consensus, not simple majorities.  

  **Underdetermined Areas (Rival Theories Fit)**  
  - **Eligibility Pools**: Why exclude children from juries/assemblies? Competence? Vulnerability? Social convention?  
  - **Stratification Metrics**: Why sex/education but not wealth or ideology? Reflects contested views of what defines "relevant" groups.  
  - **Self-Selection**: Does declining imply illegitimacy? Rival views: voluntarism respects autonomy vs. mandatory service ensures true representation.  

  **Conclusion**: Lotteries are *procedural chameleons*. Their fairness derives not from randomness alone, but from how they institutionalize context-specific egalitarian ideals:  
  - **Governance** = Equality as *presence* (mirrored groups)  
  - **Benefits** = Equality as *anonymity* (no distinctions)  
  - **Burdens** = Equality as *shared fate* (pooled risk)  
  Replacing this with pure epistemic value would dismantle descriptive representation in governance and sever the link between lotteries and anti-classification in benefits — revealing that current practices prioritize *relational equality* (how people stand relative to each other) over mere outcome optimization.
