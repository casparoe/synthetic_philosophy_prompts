answer: |-
  Here's a precisely engineered thought experiment isolating your three translation theories. We'll use a **two-line source text in English** with a **lipogram constraint (no letter 'e')** and create three translations. The core variable is *whether the constraint performs semantic work*.

  **Defined Views**  
  (A) **Content-only**: Faithful iff propositional content (truth-conditional meaning) is preserved. Form is discardable ornament.  
  (B) **Form-is-content**: Faithful iff all meaning-constituting features (including formal constraints) are preserved. Form loss = meaning loss.  
  (C) **Same-experience**: Faithful iff target readers have an experience functionally equivalent to source readers’. Undetected features need not be preserved.  

  ---

  ### Source Text (Version 1: Constraint DOES Semantic Work)  
  **Constraint**: Lipogram (no 'e'). Thematically, the text is about **silencing/omission**.  
  *Original*:  
  > **"A silent vow: hush, omit our sound.  
  > No vocal word slips out, lips bound."**  

  *Gloss*:  
  - Line 1: A promise of silence: be quiet, exclude our noise.  
  - Line 2: No spoken word escapes, mouths closed.  

  **Semantic work of constraint**: Avoiding 'e' *enacts* the theme of suppression (common English words for speech—"voice," "speak," "tell"—require 'e'). The lipogram *is* the content: the text demonstrates silencing by its own gaps.  

  ### Candidate Translations (Version 1)  
  1. **T-plain** (Content-only):  
     > "A quiet promise: don’t utter our noise.  
     > No spoken word escapes, closed mouths."  
     *→ Drops lipogram; perfect propositional fidelity.*  

  2. **T-pattern** (Form-is-content):  
     > "A still vow: shh, hold our sound.  
     > No talk slips out, lips shut."  
     *→ Keeps lipogram (no 'e'); minor content shift ("still" ≠ "silent," "shh" ≠ "hush").*  

  3. **T-swap** (Same-experience):  
     > "A mute oath: quiet, stifle our cry.  
     > Words trapped inside, no reply."  
     *→ Drops lipogram; adds rhyme + meter. Mimics "suppressed speech" through imagery, not constraint.*  

  ---

  ### Source Text (Version 2: Constraint DOES NO Semantic Work)  
  *Same text, new theme*: Now about **patience in crafting**, unrelated to omission.  
  **Original**:  
  > **"A slow art: wait, form your clay.  
  > No rushing work, hold delay."**  

  *Gloss*:  
  - Line 1: A patient craft: pause, shape your clay.  
  - Line 2: Don’t hurry the work, embrace waiting.  

  **Constraint status**: Lipogram (no 'e') is mechanically present but *thematically irrelevant*. Words for crafting ("shape," "mold," "create") don’t require 'e'.  

  ### Candidate Translations (Version 2)  
  *Same T-plain/T-pattern/T-swap as above, but applied to this new source text.*  

  ---

  ### Version 3 Attempt: Invisible but Semantic Constraint?  
  **Source Text**:  
  > **"A silent vow: shh, omit our sound.  
  > No vocal word slips out, lips bound."**  
  *(Identical to Version 1, but assume ordinary readers rarely notice lipograms.)*  

  **Result**:  
  - (B) still demands T-pattern (constraint is meaning-constituting).  
  - (C) now *accepts T-plain* (if readers don’t detect the lipogram, losing it doesn’t alter experience).  
  - (A) unchanged (prefers T-plain).  
  **Collapse risk**: If readers *subconsciously* feel the suppression, (C) might still require constraint-preservation. We assume no subconscious effects here.  

  ---

  ### Analysis & Verdicts  
  **Version 1 (Constraint as Semantic Core)**  
  | View   | Verdict                             | Rejects           |  
  |--------|-------------------------------------|-------------------|  
  | (A)    | **Prefers T-plain**                 | T-pattern, T-swap |  
  | (B)    | **Prefers T-pattern**               | T-plain, T-swap   |  
  | (C)    | **Prefers T-swap**                  | T-plain           |  
  *(B) and (C) both reject T-plain (as it loses meaning/experience), but disagree on alternatives.*  

  **Version 2 (Constraint as Ornament)**  
  | View   | Verdict                             |  
  |--------|-------------------------------------|  
  | (A)    | **Prefers T-plain** (content kept)  |  
  | (B)    | **Prefers T-pattern** (form kept)   |  
  | (C)    | **Prefers T-swap** (experience kept)|  
  *Clean three-way split.*  

  **Key Isolated Feature**:  
  The **thematic relevance of the constraint**. In Version 1, the lipogram *is* the act of silencing; in Version 2, it’s arbitrary.  

  **Effect of Deleting Constraint Entirely**:  
  - Rewrite Version 1 as plain prose:  
    *"We make a silent promise: do not let any sound escape. Our lips are bound, and no word slips out."*  
    → **Loss**: The *enactment* of suppression through linguistic absence.  
  - Rewrite Version 2:  
    *"Crafting is slow: wait and form your clay. Do not rush the work; embrace delay."*  
    → **No loss**: Constraint was decorative.  
  *(A)’s ranking doesn’t change, but (B) now accepts the plain prose as "less unfaithful" than T-plain. (C) is unaffected.)*  

  **Objection from View (A)**:  
  *"Your 'semantic work' in Version 1 is just more content. 'Demonstrating suppression via missing letters' is a propositional claim. T-plain can convey this claim explicitly (e.g., adding 'through missing letters'). The constraint itself isn’t meaning—it’s a vehicle for content."*  
  → **Counter**: If T-plain *explains* the lipogram, it adds content; if it doesn’t, it loses the enacted meaning. Form-is-content argues that *showing* and *saying* are distinct.  

  **Are Two Views the Same?**  
  No. (B) cares about *textual ontology* (meaning resides in form). (C) cares about *reader psychology* (equivalence of effect). They converge in Version 1 only because the form shapes the experience.  

  **Weakest View in this Setup**:  
  (A) struggles with Version 1. If the lipogram *is* the silencing, T-plain fails to preserve content. (A) must either deny that form can *be* content (reducing it to ornament) or admit that "content" includes demonstrative acts.  

  ---  
  This isolates your variables: the same constraint can be semantic (Version 1), ornamental (Version 2), or covertly semantic (Version 3), forcing divergent judgments from (A)/(B)/(C). The lipogram’s thematic integration is the lever.
