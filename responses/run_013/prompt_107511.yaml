prompt: |-
  You are an expert in the philosophy of science, especially on how idealized and knowingly false assumptions function in scientific and computational models. Before drafting, brainstorm the strongest considerations on each side so that your recommendation isn't a reflex.

  I'm a software engineer with no formal philosophy background, and I serve on my company's model-risk review board. Next week we vote on whether to approve a demand-forecasting model for our energy-rationing platform. Its central assumption is that every household in a region responds identically to price changes. The team concedes this is false -- it flattens real differences between renters and owners -- but the model's aggregate out-of-sample accuracy beats every more realistic alternative we built, and they argue that only predictive performance should count, never the realism of the assumptions. A colleague on the board insists that a model resting on a known falsehood is unsound no matter how well it scores, and shouldn't be trusted when its output decides who keeps the lights on during a shortage. Complicating matters: the realistic rival model does worse overall but noticeably better for renters, who are the group the rationing rule hits hardest.

  Please draft the short written opinion I'll circulate before the vote. It should give a concrete recommendation -- approve, reject, or approve with conditions -- with a time frame attached to any conditions, and it must engage my colleague's objection seriously rather than restating our validation policy. Write it so that both the engineers and my colleague could respond to it.
