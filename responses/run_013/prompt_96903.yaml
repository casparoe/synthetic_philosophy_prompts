prompt: |-
  I run sustainability for a small chain of staff canteens -- nine sites, about 4000 lunches a day -- and I've been told to write the protein policy. Which in practice means: a procedure my site managers and the procurement person can run on any dish or any swap to decide how bad it is for animals, so we stop having the same fight every menu cyle.

  The fight, in case it helps: the veggie crowd says drop the beef, obviously. But a couple of us read the stuff about field animals -- that harvesting a field kills a fair number of mice and birds and the like, so a lentil bake isn't free either -- and then the intern pointed out that if you count individuals rather than kilos, chicken comes out worse than beef by a mile, because a cow is one animal and a chicken is, well, not one cow. She wants a two-column thing: how many animals, times how bad each death is, and she says both columns have to be in there or we're just counting heads. And she raised the awkward one too: if we buy less meat, there's less demand for farmed animals to exist at all, and she reckons some people think a life worth living is a good thing, so buying from a genuinely good farm might be a plus, not a minus. I don't know what to do with that and I half suspect it's a trap, but the procedure has to say something about it -- even if the something is "we don't score this, here's why, and here's who decides instead."

  What I want: a decision procedure, in order, that a site manager with no philosophy traing can run in about half an hour on one dish or one swap. The questions to ask in sequence, what counts as a good enough answer to each, where it stops with a clear no or a clear go, and where it has to be handed to a person because it's a values call rather than a fact. It has to tell me which unit to count in -- deaths, kilos, animal-years, calories, servings -- or tell me honestly that the choice of unit is doing most of the work and can't be made by procedure at all. And it has to handle the crop-death thing without either ignoring it or letting it swamp everything else.

  Constraints: I can't ask suppliers for anything they don't already publish, I've got roughly one number per dish (weight, and a vague idea where it came from), the head of catering signs off on anything that changes a recipe, and legal have said we can't put welfare claims on the menu. Assume whoever runs it is smart but untrained. Give me a one-page version and the long version.

  Then run it on three cases: (a) swapping a beef burger for a chicken burger at the same protein, (b) swapping the beef burger for a lentil-and-rice thing, (c) a pork dish where the only supplier we can actually get is a high-welfare outdoor one at triple the price.

  I'm expecting it to tell me something I don't like, so don't sand it off. And tell me what the procedure can't do -- the cases where two reasonable people run it and land in different places, and whether that's a bug or just ethics.
reasoning: |-
  Okay, the user runs sustainability for a small chain of staff canteens and needs a protein policy. They have nine sites serving about 4000 lunches daily. The main issue is creating a procedure for site managers and procurement to evaluate dishes without constant debates. 

  First, I need to understand the conflicts they're facing. The vegetarian group wants to drop beef, but others mention field animals killed during crop harvesting. The intern brought up counting individual animals instead of mass—chickens vs. cows. Plus, there's the ethical dilemma: reducing meat might mean fewer animals are raised, but if they have good lives, is that positive? The user feels stuck on how to handle that.

  The core need is a step-by-step procedure. It must be usable by someone without philosophy training, taking about 30 minutes per dish or swap. Key elements include:
  - A clear sequence of questions.
  - Criteria for answers: when to stop with yes/no or escalate.
  - Deciding the unit of measurement (deaths, kilos, etc.), acknowledging if the choice itself is subjective.
  - Addressing crop deaths without letting them dominate.
  - Constraints: limited supplier data, one number per dish (weight/origin), legal restrictions on welfare claims.

  The user wants this tested on three cases: swapping beef for chicken burgers, beef for lentil-rice, and a high-welfare pork dish. They expect uncomfortable outcomes and want transparency on where the procedure might fail.

  Breaking down the procedure:
  1. **Triage**: Start with obvious wins like existing veggie options vs. resource-heavy meats. This avoids overcomplication where benefits are clear.
  2. **Data Collection**: Gather available info—protein source, origin, weight per serving. Since suppliers won't provide extra data, rely on existing labels (e.g., organic, country of origin).
  3. **Animal Harm Assessment**: Estimate deaths per serving. Use multipliers like the lentil multiplier for crop-based dishes. For meats, reference standard figures (e.g., chickens vs. cows per kg). Highlight where data is shaky.
  4. **Suffering Score**: Apply a basic suffering scale (1-5) based on farming practices. This simplifies ethics but requires acknowledging subjectivity. Default to worst-case if data is missing.
  5. **Life Value Consideration**: For high-welfare claims, add a point only if verified. Since legal can't advertise welfare, this is internal only. Most cases won't qualify, making it a rare adjustment.
  6. **Decision Thresholds**: Set red/yellow/green zones. Red for high-harm dishes (like chicken from intensive farms), green for plants or verified humane sources. Yellow for borderline cases needing human judgment.

  For the case studies:
  - **Beef to Chicken Swap**: Chicken causes more deaths but less land use. Without welfare data, it's red due to high suffering scores. Beef might be yellow if origin is unknown. So swapping to chicken is worse.
  - **Beef to Lentil Swap**: Crop deaths exist but are lower than beef. Lentil dish scores better despite field animal harm. Green light.
  - **High-Welfare Pork**: Fewer deaths than chicken, plus welfare points. If verified, it could be yellow/green, justifying the cost if procurement allows.

  Weaknesses: The unit choice (deaths vs. kilos) is inherently subjective. Crop death estimates are uncertain. Welfare assessments are fuzzy without supplier data. These gaps mean some decisions will always need human judgment.

  The user's deeper needs: They want to reduce internal conflicts with a transparent system. They also need to balance ethics with practicality—managers aren't ethicists. Acknowledging the procedure's limitations ("yellow flags") builds trust by showing why some calls require higher-level input.

  Finally, presenting this as a one-page flowchart and a detailed guide meets their request. Emphasizing that not all answers will please everyone, but the process is defensible, addresses their pain points.
answer: |-
  Here's a protein policy decision procedure designed for practicality, acknowledging ethical grey areas while providing clear guidance for most cases. It prioritizes *actionability* and *reducing arguments* over philosophical perfection.

  **The Protein Policy Decision Procedure (One-Page Version)**

  **Goal:** Assess the relative "animal harm" impact of a dish or ingredient swap. Output: **Green** (Proceed), **Yellow** (Requires Catering Head Review), **Red** (Avoid).

  **Units:** We primarily use **Estimated Deaths per 1000 Servings** for animals *directly* farmed. For crop impacts, we use **Crop-Death Equivalents per 1000 Servings**. Suffering intensity modifies this score.

  **Procedure Flowchart (Simplified):**

  1.  **TRIAGE: Is it Plant-Based?**
      *   **YES:** Go to Step 4 (Estimate Crop Deaths).
      *   **NO:** Go to Step 2 (Identify Animal Protein).

  2.  **IDENTIFY ANIMAL PROTEIN:**
      *   What species? (Beef, Pork, Chicken, Fish, Dairy, Eggs, etc.)
      *   What's the *primary* protein source weight per serving? (e.g., 150g beef patty)
      *   **Origin/Production:** Any *verified* label? (Organic, RSPCA Assured, Pasture-Raised, Country? Use default multipliers if unknown). Go to Step 3.

  3.  **ESTIMATE DIRECT ANIMAL DEATHS & SUFFERING:**
      *   Use **Deaths per 1000kg** table (see below).
      *   Calculate: `(Weight per serving (kg) * Deaths per 1000kg * 1000) = Deaths per 1000 servings`
      *   Apply **Suffering Score (1-5):**
          *   `5 = Factory Farm (Default if unknown)`
          *   `4 = Intensive Indoor`
          *   `3 = Basic Welfare Standards`
          *   `2 = Free-Range / Good Outdoor`
          *   `1 = Certified High Welfare (Organic, Pasture-Fed, RSPCA Assured)`
      *   **Modified Deaths Score = (Deaths per 1000 servings) * (Suffering Score / 3)** (Normalizes to factory farm suffering baseline). Go to Step 5.

  4.  **ESTIMATE CROP DEATHS (For Plant Dishes/Ingredients):**
      *   Identify main crops (e.g., Lentils, Rice, Wheat, Soy).
      *   Use **Crop-Death Multiplier (CDM):**
          *   `Grains (Wheat, Rice, Corn): 1.0`
          *   `Legumes (Lentils, Beans): 1.2` (Often smaller fields, more passes?)
          *   `Oilseeds (Soybean): 1.3` (Large scale harvesting)
          *   `Vegetables: 1.5` (More intensive cultivation)
      *   Calculate: `(Weight of crop ingredient per serving (kg) * CDM * 0.5) = Crop-Death Equivalents per serving` *(The 0.5 factor prevents crop deaths from swamping direct deaths unfairly; based on relative magnitude studies)*
      *   `Crop-Death Equivalents per 1000 servings = (Value above) * 1000`
      *   **Suffering Score:** Assume `1.0` (Sudden death). **Modified Crop Death Score = Crop-Death Equivalents per 1000 servings.**

  5.  **COMBINE & COMPARE (For Swaps):**
      *   **Option A (Current) Score:** Modified Direct Deaths Score + Modified Crop Deaths Score.
      *   **Option B (Proposed) Score:** Modified Direct Deaths Score + Modified Crop Deaths Score.

  6.  **APPLY LIFE VALUE ADJUSTMENT (Rare):**
      *   **ONLY** if **Verified High Welfare** (Step 2) *and* the Modified Direct Deaths Score is **significant**.
      *   **Subtract up to 20%** from the Option's **Modified Direct Deaths Score**. (Acknowledge the potential "good life" argument minimally). *Avoid this if data is weak.*

  7.  **DECISION THRESHOLDS:**
      *   **GREEN (Proceed):**
          *   Option B Score < Option A Score *and* Option B Score < **200**.
          *   Plant-based dish with Modified Crop Death Score < **100**.
      *   **YELLOW (Review by Catering Head):**
          *   Option B Score < Option A Score but Option B Score > **200**.
          *   Option B Score > Option A Score but difference < **10%** (close call).
          *   Life Value Adjustment applied and significantly changes outcome.
          *   Significant uncertainty in data (e.g., unknown origin, complex multi-ingredient dish).
      *   **RED (Avoid):**
          *   Option B Score > Option A Score.
          *   Option B Score > **400** (regardless of comparison).
          *   Factory Farm Chicken/Pork/Eggs (Default Unknown) almost always trigger RED/YELLOW.

  **Key Reference Table: Estimated Deaths per 1000kg (Carcass Weight) - Defaults (Factory/Intensive if origin unknown):**

  | Protein Source | Deaths per 1000kg | Notes/Suffering Baseline |
  | :------------- | :---------------- | :--------------------------------------- |
  | Beef           | 3.3               | (~300kg carcass/animal)                  |
  | Pork           | 12.5              | (~80kg carcass/animal)                   |
  | Chicken (Broiler) | **220**           | (~2.2kg carcass/animal) **HIGH DEATH COUNT** |
  | Eggs (Laying Hens) | 100               | (Per 1000kg *whole eggs* - complex calc!) |
  | Milk           | 0.35              | (Per 1000kg *milk* - dairy cow & calf)   |
  | Farmed Fish    | 500-1000+         | (Highly variable by species/size) **AVOID UNKNOWN** |
  | **Crops (CDM)** | **See Step 4**    | **Not per kg protein, per kg crop!**     |

  ---

  **The Protein Policy Decision Procedure (Long Version)**

  **Philosophy & Scope:**
  *   **Goal:** Reduce overall animal suffering/death associated with our meals, using the best *practical* evidence.
  *   **Core Metric:** **Modified Deaths per 1000 Servings** (MDS). Combines estimated death count and suffering intensity.
  *   **Acknowledged Limitations:** Precision is impossible. We use industry averages and multipliers. Values are estimates for *comparison*, not absolute truth. "Life Value" is highly subjective and applied minimally. Crop deaths are included but weighted lower than direct livestock deaths to avoid perverse outcomes. The choice of "deaths per serving" as the primary unit prioritizes minimizing the *number* of animal lives ended, modified by suffering.
  *   **What it CAN'T Do Perfectly:**
      *   Resolve deep philosophical disagreements (e.g., Is any humane slaughter possible? Is field mouse life = cow life?). It makes practical trade-offs.
      *   Handle complex multi-protein dishes perfectly (focus on the *primary* protein swap or new dish).
      *   Guarantee absolute welfare without supplier audits (we rely on verified certifications).
      *   Eliminate all judgment calls ("Yellow Flags" exist).
      *   Account for highly variable factors like exact farming practices or regional biodiversity impacts beyond basic multipliers.
  *   **Who Decides What:** Site Managers/Procurement run Steps 1-6. Catering Head decides "Yellow Flag" cases and approves "Life Value" adjustments. Legal restrictions on menu claims are upheld.

  **Detailed Procedure Steps:**

  1.  **TRIAGE: Plant-Based?**
      *   **Question:** Is the dish, or the primary protein source being swapped *in*, entirely plant-based (e.g., lentils, tofu, beans, seitan)?
      *   **Good Enough Answer:** Yes = Obvious plants (e.g., lentil bake, black bean burger). No = Contains meat, dairy, eggs, fish. Ignore minor additives.
      *   **Outcome:**
          *   **YES:** Proceed to **Step 4 (Crop Deaths)**. Skip Steps 2 & 3.
          *   **NO:** Proceed to **Step 2 (Identify Animal Protein)**.

  2.  **IDENTIFY ANIMAL PROTEIN:**
      *   **Questions:**
          *   What is the primary animal species? (Be specific: e.g., Chicken (Broiler), Salmon, Pork, Beef (Dairy vs. Beef breed less critical)).
          *   What is the average weight of the *primary animal protein component* per serving? (e.g., 0.15kg beef patty, 0.18kg chicken breast). *Estimate based on standard recipe/portion.*
          *   What is the origin/production method? Check supplier info, packaging, or standard specification. Look for **Verified Certifications:** Organic, Certified Humane, RSPCA Assured, Global Animal Partnership (GAP) 3+, Pasture for Life, specific country known for higher standards (e.g., EU organic vs. unknown origin). If nothing verified/specific, **use default values (Factory Farm / Intensive).**
      *   **Good Enough Answer:** Species and weight are mandatory. Origin: Use the *best available info*. If supplier just says "UK Pork" with no welfare claim, treat as **unknown/default**. If it says "Organic", use that. Don't chase suppliers for unverified claims.
      *   **Outcome:** Record Species, Weight/Serving (kg), and Welfare Tier (Organic/High Welfare, Free Range, Basic Standard, Unknown Default (Intensive)).

  3.  **ESTIMATE DIRECT ANIMAL DEATHS & SUFFERING:**
      *   **Action:**
          1.  Find the **Deaths per 1000kg** for the species from the Reference Table.
          2.  Calculate **Deaths per 1000 Servings** = `(Weight per Serving in kg) * (Deaths per 1000kg) * 1000`
              *   *Example (Beef Patties - 0.15kg serving): (0.15 kg/serving) * (3.3 deaths/1000kg) * 1000 = 0.495 deaths/1000 servings.*
          3.  Assign a **Suffering Score (SS)** based on Welfare Tier:
              *   `5`: Factory Farm / Intensive Indoor (Unknown Default)
              *   `4`: Standard Intensive (e.g., caged hens, fast-growing broilers in barns)
              *   `3`: Meets Minimum Legal Welfare (e.g., EU baseline, uncaged but indoor)
              *   `2`: Enhanced Welfare / Free Range (e.g., RSPCA Assured indoor with enrichments, Free Range poultry)
              *   `1`: Certified High Welfare (e.g., Organic, Pasture-Fed, GAP 4+, Certified Humane) - *Requires Verification*
          4.  Calculate **Modified Deaths Score (MDS_direct)** = `(Deaths per 1000 Servings) * (Suffering Score / 3)`
              *   *Why /3?* Normalizes so Factory Farm (SS=5) is the baseline multiplier (5/3 ≈ 1.67). High Welfare (SS=1) reduces the score significantly (1/3 ≈ 0.33). *This incorporates "how bad each death is" simply.*
      *   **Good Enough Answer:** Use the Reference Table values. Suffering Score based on the verified tier. Default to SS=5 if uncertain.
      *   **Outcome:** MDS_direct (a single number for this animal protein component).

  4.  **ESTIMATE CROP DEATHS (For Plant Dishes/Ingredients):**
      *   **Action:**
          1.  Identify the **main crop ingredients** contributing significant protein/weight (e.g., lentils, rice, wheat, soybeans, chickpeas). Ignore spices/minor veg.
          2.  Estimate the **total weight per serving** of these main crop ingredients.
          3.  Assign a **Crop-Death Multiplier (CDM)** for each main crop type (see Table).
          4.  Calculate **Crop-Death Equivalents per Serving** = `(Total Weight of Main Crops per Serving in kg) * (Average CDM for crops used) * 0.5`
              *   *Why *0.5?* Prevents crop deaths from dominating. Based on estimates suggesting field deaths per kg of crop are generally *lower* than deaths per kg of meat (especially chicken/fish), even when scaled. This is the most contentious weight but vital for practicality.*
          5.  Calculate **Crop-Death Equivalents per 1000 servings** = `(Value above) * 1000`
          6.  **Modified Crop Deaths Score (MDS_crop)** = `Crop-Death Equivalents per 1000 servings` (Suffering Score fixed at 1.0 - sudden).
      *   **Good Enough Answer:** Focus on the 1-3 main crops. Use a reasonable average CDM (e.g., 1.2 for a lentil & rice bake). Weight estimate based on recipe.
      *   **Outcome:** MDS_crop (a single number for the plant dish/component).

  5.  **COMBINE & COMPARE (For Swaps or New Dishes):**
      *   **Action:**
          *   For **Option A (Current/Reference Dish):** `Total Score_A = MDS_direct_A + MDS_crop_A`
          *   For **Option B (Proposed Dish/Swap):** `Total Score_B = MDS_direct_B + MDS_crop_B`
          *   *For a new plant dish, MDS_direct_B = 0.*
          *   *For a swap (e.g., Beef -> Chicken burger), calculate Score_A for the *current dish* and Score_B for the *proposed dish* (likely keeping buns/salad the same, so MDS_crop might be similar or identical). Focus is on the protein swap impact.*
      *   **Good Enough Answer:** Only include significant changes. If swapping *just* the patty, only recalc MDS_direct. If adding significant new plant components, include those in MDS_crop_B.

  6.  **APPLY LIFE VALUE ADJUSTMENT (Use Sparingly & Cautiously):**
      *   **Question:** Is Option B sourced from **Verified High Welfare** (SS=1 in Step 3) *and* is its MDS_direct_B a significant part of its Total Score_B?
      *   **Good Enough Answer:** Only YES if certified (Organic etc.) AND MDS_direct_B > ~50. Avoid if any doubt about verification.
      *   **Action (If YES):** Reduce MDS_direct_B by **10-20%**. Choose the reduction % based on confidence in the welfare claim (20% max for gold-standard like high-tier pasture-based organic). *Document the adjustment.*
      *   **Outcome:** Adjusted Total Score_B.
      *   **Handoff:** Significant adjustments (>15%) should be noted as a "Yellow Flag" for Catering Head awareness.

  7.  **DECISION THRESHOLDS:**
      *   **GREEN (Proceed):** Safe to implement.
          *   `Total Score_B < Total Score_A` **AND** `Total Score_B < 200`.
          *   (For new plant dish) `MDS_crop < 100`.
      *   **YELLOW (Requires Catering Head Review):** Potential benefit or high impact, needs oversight.
          *   `Total Score_B < Total Score_A` but `Total Score_B >= 200`.
          *   `Total Score_B < Total Score_A` but the difference is < 10% (e.g., Score_B=180, Score_A=200).
          *   `Total Score_B > Total Score_A` but difference < 5% AND Score_B < 100 (very close, low absolute harm).
          *   Life Value Adjustment applied (especially >15%).
          *   Significant data uncertainty (unknown origin, complex dish).
          *   High-welfare meat/egg/dairy option with MDS_direct_B < 100 *after adjustment* (needs cost/feasibility check).
      *   **RED (Avoid):** Unacceptable harm increase or high absolute harm.
          *   `Total Score_B > Total Score_A`.
          *   `Total Score_B > 400` (regardless of comparison - e.g., factory chicken).
          *   Factory/Intensive Chicken, Pork, Eggs, Fish (Unknown Default) - typically Score > 300.
          *   High-welfare option where MDS_direct_B > 150 *after adjustment*.

  ---

  **Running the Cases:**

  **Assumptions:** Standard 150g (0.15kg) patty/burger. Buns/salad contribute equally to MDS_crop (~0.05 deaths/1000 servings) in all cases. Unknown origin = SS=5 (Factory/Intensive). Beef = Beef breed. Chicken = Broiler. Pork = Standard.

  **Case (a): Swapping Beef Burger for Chicken Burger (same protein weight)**
  1.  **Option A (Beef):**
      *   MDS_direct: `(0.15 kg/serving * 3.3 deaths/1000kg * 1000) * (5 / 3) = (0.495) * (1.67) ≈ 0.83`
      *   MDS_crop (bun/salad): ~0.05
      *   **Total Score_A ≈ 0.88**
  2.  **Option B (Chicken):**
      *   MDS_direct: `(0.15 kg/serving * 220 deaths/1000kg * 1000) * (5 / 3) = (33) * (1.67) ≈ 55.1`
      *   MDS_crop (bun/salad): ~0.05 (same)
      *   **Total Score_B ≈ 55.15**
  3.  **Comparison:** Score_B (55.15) > Score_A (0.88) by a massive margin.
  4.  **Life Value?** No (Unknown origin = Factory).
  5.  **Threshold:** **RED**. Swapping beef for standard chicken is *significantly worse* for animal harm.

  **Case (b): Swapping Beef Burger for Lentil-Rice Burger (similar protein)**
  1.  **Option A (Beef):** Total Score_A ≈ 0.88 (as above)
  2.  **Option B (Lentil-Rice):**
      *   MDS_direct: 0
      *   Main Crops: Assume 0.12kg lentils (CDM=1.2), 0.08kg rice (CDM=1.0) = Avg CDM ~1.1, Total crop wt=0.20kg
      *   MDS_crop: `(0.20 kg * 1.1 * 0.5) * 1000 = (0.11) * 1000 = 110`
      *   **Total Score_B ≈ 110**
  3.  **Comparison:** Score_B (110) > Score_A (0.88). *But wait...*
  4.  **Life Value?** N/A.
  5.  **Threshold Check:** Score_B (110) is < 200? YES. BUT Score_B (110) > Score_A (0.88), which normally triggers RED. However, **this is a classic "Yellow Flag" case.** Why? The *absolute* Score_B is moderate (110 < 200), the swap *removes* a direct death source (beef), and crop deaths, while real, are weighted lower. **YELLOW - Catering Head Review.** *Likely Outcome:* Despite Score_B > Score_A numerically, the removal of direct beef deaths, the moderate absolute score, and the intent align with reducing harm. Catering Head would likely approve **GREEN** based on policy intent and practicality. *(This highlights the procedure needing human judgment when core metrics clash slightly with core goals).*

  **Case (c): High-Welfare Outdoor Pork (Triple Price)**
  1.  **Option:** High-Welfare Pork Dish (e.g., 0.15kg serving)
  2.  **MDS_direct:** `(0.15 kg/serving * 12.5 deaths/1000kg * 1000) * (Suffering Score / 3)`
      *   Suffering Score: **2** (Free-Range/Good Outdoor - *assumes verified*)
      *   Calculation: `(1.875 deaths/1000 servings) * (2 / 3) ≈ 1.875 * 0.67 ≈ 1.25`
  3.  **MDS_crop:** Assume side dishes ~0.05
  4.  **Total Score_Before_LifeValue ≈ 1.30**
  5.  **Life Value Adjustment:** Verified High Welfare (SS=2 qualifies), MDS_direct is significant (>1). Apply **15% Reduction** to MDS_direct: `1.25 * 0.85 ≈ 1.06`
  6.  **Total Score_After_Adj ≈ 1.06 (MDS_direct_adj) + 0.05 (MDS_crop) = 1.11**
  7.  **Threshold:** Score (1.11) is well below 200. **GREEN** based on score.
      *   **But Cost:** Triple price! **This is a "Yellow Flag" for Catering Head Review** based on **feasibility/cost**, not the animal harm score. The *procedure* says it's Green for harm, but Catering Head must decide if the cost is justified operationally. The policy answers the "animal harm" question (Green), but doesn't mandate purchase if unaffordable.

  ---

  **What the Procedure Can't Do (Ethical Gaps & Limitations):**

  1.  **The Unit Problem:** Choosing "deaths per serving" modified by suffering *is* a values choice (individuals matter). Choosing kg or calories would favor large animals (beef). This procedure explicitly chooses the individual-focused approach modified by suffering. **This is the core unavoidable value judgment.**
  2.  **Crop Death Weighting:** The *0.5 multiplier* for crop deaths is critical to prevent absurd outcomes (e.g., lentils worse than beef). It's based on relative magnitude estimates but remains a significant judgment call. Two reasonable people might argue for 0.3 or 0.7.
  3.  **Life Value Subjectivity:** Applying a 10-20% reduction for high welfare is entirely arbitrary, though necessary to acknowledge the intern's point minimally. Some ethicists would give it 0% (all farming is exploitation), others might give 50% (a good life is highly valuable). **This is the biggest "values call" point.**
  4.  **Suffering Scores:** Assigning 1-5 is crude. Distinguishing between "Free Range" (2) and "Certified Humane" (1) is fuzzy without deep audit. Defaulting to 5 for "unknown" is conservative but may unfairly penalize some suppliers.
  5.  **Verification Reliance:** We depend on certifications. Some "high welfare" might be greenwashing. We accept this risk due to the "can't ask suppliers for more" constraint.
  6.  **Indirect Effects (Demand):** The intern's point about reducing future demand is real but *impossible* to quantify per dish swap. The procedure focuses on the *direct and immediate* supply-chain impact (deaths/suffering caused for *this* meal). Promoting plant-based inherently reduces future demand.
  7.  **Close Calls:** Scores differing by <10% or landing near the 200 threshold (like the lentil burger) **will** require human judgment ("Yellow Flags"). This is a feature, not a bug.

  **Conclusion:** This procedure provides a clear, mostly objective sequence to resolve the common "beef vs. chicken vs. lentils" argument. It forces consideration of both numbers and suffering intensity. It handles crop deaths without letting them dominate. It incorporates welfare minimally where verifiable. It flags the genuinely worst options (factory chicken) as RED and the best options (plants, verified high welfare) as GREEN or YELLOW. It explicitly identifies where values judgments are needed ("Yellow Flags" for Catering Head). While the outputs (especially Case b) might be uncomfortable, they force engagement with the complexities rather than simplistic slogans. It won't please everyone, but it should stop the same fights every cycle by providing a common, defensible framework. **Remember: The goal is better, not perfect. Update the multipliers/scoring thresholds annually as new consensus data emerges.**
