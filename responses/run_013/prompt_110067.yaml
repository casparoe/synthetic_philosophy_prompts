  Deep down I think they're asking two things: 1) Is there actually a coherent moral logic here? and 2) If not, should we fix it by deregulating markets or banning gifts too? That last bit about "straightforwardly commodification-permitting view" is telling - they might lean libertarian but are troubled by the inconsistencies. 

  The plasma/whole blood example is particularly potent because it's the same substance with different payment rules based on processing method. That alone torpedoes many clean theories. And the vote/kidney comparison is brilliant - both are supposedly inalienable but for very different reasons. 

  I'll need to admit upfront that no single theory explains everything. The pattern is absolutely messy with historical accidents (like plasma being framed as "industrial" vs "humanitarian" blood). But there are throughlines about social meaning being constructed through transaction types. 

  Biggest challenge will be avoiding academic jargon while doing justice to the complexity. User deserves to see why Radin's "contested commodities" and Titmuss' gift economy don't fully resolve their puzzle. Should highlight how exploitation arguments fail when compensated egg donation is allowed but kidney sales aren't. 

  And must address their suspicion about vote-selling being different - they're right that it's about democratic ontology rather than bodily integrity. That might be the key to showing why a unified theory is impossible.
answer: |-
  Your observation cuts to the heart of market moralism—a patchwork of intuitions lacking a unified theory. The pattern isn't stable, principled, or coherent, but reveals competing moral logics in tension. Let's dissect it:

  ### Core Asymmetry: Gift vs. Sale
  Your reading is correct: **the objection targets monetization itself, not the transfer.** Gifting is valorized while sale is condemned because:
  - **Money alters social meaning.** A kidney donation is "heroic"; a sale is "degrading." Money introduces instrumental logic into spheres governed by civic virtue (votes), solidarity (blood), or sacredness (life).
  - **The "standing offer" corrupts.** A market creates perpetual incentive to transact, potentially coercing the desperate (e.g., organ sales by the poor) or commodifying the priceless (e.g., votes as expressions of autonomy).

  ### Typology of Goods: Meaning Over Materiality
  The distinctions rely **primarily on social meaning**, not need or power:
  - **Inalienable:** Votes (cannot be transferred at all).  
    *Rationale:* Votes aren't "owned"; they're a fiduciary role for the common good.
  - **Non-Market (Gift-Only):** Blood, kidneys.  
    *Rationale:* Bodily integrity and human dignity. Money "taints" altruism.
  - **Market-Inalienable:** Plasma, eggs, post-disaster generators.  
    *Plasma/Eggs:* Framed as "renewable" (despite egg donation's risks) or "industrial" (plasma as raw material).  
    *Generators:* Allowing surge pricing *except* during disasters prevents "price gouging" on essentials—a tacit admission that some goods become "sacred" in crises.

  Votes and kidneys **diverge fundamentally**:
  - **Kidney ban:** Focus on *seller's vulnerability* and bodily integrity.
  - **Vote ban:** Focus on *buyer's corruption* of democratic representation. A vote isn't property; it's a public trust.

  ---

  ### Testing Theories Against the Pattern
  | Theory             | Fits Pattern?         | Contradicted By          | Verdict                  |
  |--------------------|-----------------------|--------------------------|--------------------------|
  | **Corruption of Meaning** | Plasma (paid) vs. blood (gift): Same substance, different social framing. | Allowing *paid* plasma/eggs implies meaning can be contextually "contained." | **Strong fit, but inconsistent.** |
  | **Exploitation**       | Bans on kidney sales protect the poor. | Egg donors face similar risks/inequality but are paid. Plasma donors are often low-income. | **Undermined:** Exploitation tolerated where meaning permits (e.g., eggs as "gift-plus-compensation"). |
  | **Incommensurability** | Votes/kidneys deemed "priceless." | Eggs/plasma given precise prices. Surge pricing accepted until disaster strikes. | **Weak:** Society routinely prices the "priceless" when convenient. |
  | **Expressive Harm**    | Vote sales express democracy's degradation. | Paid plasma expresses... industrial pragmatism? | **Fits bans (votes/kidneys) but not exceptions (plasma/eggs).** |

  ### Why the Inconsistencies?
  1. **Historical Accident:** Plasma payment emerged when WWII required mass production; whole blood stayed "pure" due to Red Cross ideology.
  2. **Hybrid Logics:** 
     - Eggs: "Compensation" (avoiding "sale" language) blends gift rhetoric with market practice.
     - Disaster Pricing: Shifts goods from "market" to "crisis commons" temporarily.
  3. **Class and Gender:** 
     - Plasma donors (disproportionately poor) are paid; blood donors (middle-class) are volunteers. 
     - Egg donors (often young women) are paid; kidney donors (all genders) are not—reflecting paternalism toward female bodies.

  ---

  ### Is This a Defect?
  **Yes—but an inevitable one.** These rules reflect:
  - **Cultural Schizophrenia:** We simultaneously embrace markets and fear their moral spillover.
  - **Moral Pluralism:** No single principle (autonomy, dignity, equality) dominates; context dictates.
  - **Power:** Allowing plasma/egg sales serves medical industries; banning kidneys avoids slippery slopes.

  ### Alternative Regimes
  - **Full Commodification:** Pay kidney donors, auction disaster generators, permit vote sales. Risks: exacerbating inequality, eroding civic virtues.  
    *Change:* Kidney markets emerge; votes become property.
    
  - **Blocked Exchanges (Radical Non-Market):** Ban paid plasma, eggs, surge pricing. Treat all bodies and essentials as sacred.  
    *Change:* Plasma shortages; black markets; reduced IVF access.

  ---

  ### Conclusion
  The pattern isn't driven by theory but by **moral triage**:
  - **Votes:** Banned to preserve democracy’s expressive structure.
  - **Kidneys:** Banned to protect bodily integrity amid inequality.
  - **Plasma/Eggs:** Permitted because risks are deemed manageable *and* industries lobbied for supply.
  - **Disaster Pricing:** Banned to affirm communal solidarity in crises.

  The instability arises because **money’s "taint" is socially constructed, not inherent**. We tolerate monetization where the good is "industrialized" (plasma), the donor "empowered" (egg donors as agents), or the market efficient (surge pricing)—but ban it where vulnerability is salient (kidneys) or meaning is constitutive (votes). This isn't principled; it's pragmatic moral bargaining. A coherent theory would require choosing one master value—and society refuses.
