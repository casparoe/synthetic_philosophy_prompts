prompt: |-
  I am in the upper sixth and I am writing an extended project on the units of selection debate. My supervisor insists that the essay be built around a case I have designed myself rather than a summary of the familiar ones, so I should like you to construct one to my specifications and then demonstrate that it does what I need it to do. Please write your answer in American English, and please do not give me citations, references or a reading list of any kind: I have no access to journals, and I want the argument rather than the bibliography. You may introduce terminology of your own, provided you define it.

  What the case is for. I want to know whether the disagreement between the gene's-eye view, the individual-as-unit view and the group-as-unit view can ever be a substantive disagreement about what will happen, rather than three ways of keeping the same set of books. A case that simply stipulates that groups containing the behaviour out-survive groups lacking it, and then labels the result group selection, will not do: every verdict must be generated from the framework to which it is attributed, not from my description.

  Specifications.

  1. A realistic setting — a colonial bird, a social insect, or a human village. If you invent an organism, keep its biology mundane and easily imagined.
  2. A behaviour that is genuinely costly to the individual performing it, in survival or in offspring, and the cost must be shown rather than asserted.
  3. The scenario itself is to be no longer than two paragraphs.
  4. The behaviour must be inherited with high fidelity between groups and with no heritability at all among individuals within a group: whether an individual performs it depends on the group it was raised in, and not on its parents or its genes. Inside any single group there must be no heritable difference between performers and non-performers.
  5. Everything else is held fixed — same ecology, same cost, same within-group dynamics — so that the inheritance channel is the only variable.

  Then, in order:

  (a) give the verdict of each of the three frameworks — does the behaviour spread, decay, persist, or does the framework decline to say anything — with the reasoning shown from the framework itself. I expect the gene's-eye and individual-level accounts to be unable to account for the behaviour's persistence in the way the group-level account can; if you find that they can, then the case has failed and you should say so rather than rescue it;
  (b) identify the single feature of the case that is doing the work;
  (c) restate the case in one paragraph with that feature reversed, and say what becomes of all three verdicts, in particular whether the case then collapses into the situation in which the three frameworks are merely keeping the same books;
  (d) say how a defender of the framework that comes out worst would attack the case, which of those attacks is strongest, and whether any version of the case survives it;
  (e) finish with your own verdict on whether the case shows what I want it to show, and what would make it fail.
reasoning: |-
  Alright, the user is working on an extended project about the units of selection debate and needs a custom case study. Let me start by understanding their specifications. They want a realistic scenario—maybe colonial birds, social insects, or a human village. The behavior must be costly to the individual, with no heritability within groups. The key is to test if gene's-eye and individual-level views can't explain the behavior's persistence, while group selection can.

  First, I need to create a scenario. Colonial seabirds come to mind, like gulls or terns. The behavior could be sentinel duty, which is costly because it reduces feeding time and increases predation risk. Inheritance must be through group environment, not genes. So, fledglings adopt the behavior based on their colony's practices. Within a colony, all birds behave the same regardless of parents. That satisfies specification 4.

  Next, the cost calculation. For gene's-eye view, the altruistic gene decreases because carriers die more without passing it on. Individual selection would see lower fitness for sentinels. Group selection, however, shows colonies with sentinels survive better. So, the behavior persists through group turnover. That should meet part (a).

  The critical feature is the vertical cultural transmission between groups. Fledglings join new colonies and adopt local norms. If this is replaced with horizontal transmission (learning from any adult), then within-group variation appears. Non-performers could arise and outcompete performers, leading to collapse. That addresses (c).

  For (d), a gene's-eye defender might argue that cultural transmission still relies on underlying learning genes. The strongest attack is that group-level explanation depends on these genes. But if the learning mechanism is general, not specific to the behavior, the case might hold. Still, it's a valid criticism.

  Finally, does the case show a substantive difference? Yes, because group selection explains persistence where others can't. But if the behavior requires specific genetic traits, the gene's-eye view could co-opt the explanation. The case succeeds if the inheritance is purely cultural and group-dependent.
answer: |-
  Here is a case designed to your specifications, followed by the analysis:

  **The Case: Sentinel Terns**
  Consider a species of colonial seabird, the Silver Tern. Terns nest on isolated islands in dense colonies. A dangerous aerial predator, the Skydiver Hawk, specializes in diving into colonies to snatch chicks. Some colonies exhibit "sentinel behaviour": specific individual terns take turns perching on high rocks around the colony perimeter, scanning the sky. Upon spotting a hawk, the sentinel emits a piercing alarm call, triggering the entire colony to take flight and mob the predator, significantly reducing chick mortality. Performing sentinel duty is costly: sentinels spend less time foraging (reducing their own body condition and future reproductive output by ~15%) and are significantly more likely to be killed by the hawk during the initial dive (increasing individual mortality risk by ~20% per breeding season).

  Crucially, sentinel behaviour is *not* genetically inherited. It is a culturally transmitted colony tradition. Fledglings imprint on and learn the specific behavioural norms of the colony they fledge in. Dispersal occurs: fledglings leave their natal colony and join established colonies or form new ones with other dispersers as adults. *Within* any single existing colony, all individuals either perform sentinel duty (rotating) or none do – there is no variation based on individual genes or parentage. The behaviour is a uniform colony "culture". Whether a new colony (formed by dispersing fledglings) exhibits sentinel behaviour depends entirely on whether a *critical mass* of its founding members came from a sentinel-exhibiting colony, allowing the tradition to be re-established. There is no genetic predisposition to the behaviour; individuals from non-sentinel colonies raised in a sentinel colony adopt it perfectly, and vice-versa.

  ---

  **(a) Verdicts by Framework:**

  1.  **Gene's-Eye View:** The behaviour *decays*. A gene (or allele complex) hypothetically "for" sentinel behaviour would be strongly selected against *within* any colony where the behaviour exists. Carriers of such a gene incur the 15% reproductive cost and 20% mortality risk, while non-carriers within the same colony (if they existed, which they don't *yet* in our starting colonies) would receive the same protective benefit without paying the cost. Any genetic variant suppressing the behaviour would rapidly spread through the colony, eliminating the behaviour. The framework cannot account for persistence because the behaviour imposes a direct fitness cost on the individual *regardless* of group benefit, and genes are selected based on their differential replication *within* the gene pool. Group-level effects are seen as outcomes of gene-level competition, which here predicts decay.
  2.  **Individual-as-Unit View:** The behaviour *decays*. Performing sentinel duty demonstrably reduces the individual tern's fitness (lower survival and/or reproductive output) compared to non-performers *within the same group*. Since the behaviour is costly and there are no within-group non-performers to outcompete *yet*, the framework focuses on the inherent disadvantage: any individual exhibiting the behaviour has lower fitness than it would if it did not exhibit it, holding the group context constant. Selection at the individual level should favour mutants or immigrants who do not perform the costly behaviour. It cannot account for persistence because it sees only the cost to the individual performer.
  3.  **Group-as-Unit View:** The behaviour *spreads/persists*. Groups (colonies) exhibiting sentinel behaviour experience dramatically lower chick mortality (e.g., 70% fledging success vs. 30% in non-sentinel colonies). This leads to much higher group productivity and stability. Sentinel colonies produce more dispersing fledglings and suffer fewer colony collapses due to predation. These extra dispersers predominantly come from sentinel colonies and, when forming new colonies, are more likely to re-establish the sentinel tradition (due to the critical mass effect). Non-sentinel colonies produce fewer dispersers and collapse more frequently. Thus, sentinel colonies differentially persist and proliferate (through "fissioning" via dispersers forming new colonies) compared to non-sentinel colonies. Group selection favours the trait because groups with the trait survive and reproduce (form new groups) at a higher rate, despite the trait being costly to individuals within groups.

  **(b) The Single Feature Doing the Work:**
  **Vertical Cultural Transmission Between Groups via Dispersal.** The key is that the *inheritance* of the trait (sentinel behaviour) occurs *between groups* through the dispersal and colony-founding of fledglings who carry their natal colony's cultural norm. Crucially, this inheritance channel operates *independently* of genetic inheritance *within* groups and ensures that the trait variation (sentinel vs. non-sentinel) exists primarily *between* groups, not within them. This creates the necessary variation and inheritance at the group level for group selection to act, while simultaneously preventing individual or gene-level selection from acting *within* groups (because there's no within-group heritable variation for the trait).

  **(c) Reversed Feature & Collapse:**
  **Reversed Case (Horizontal Cultural Transmission):** Sentinel behaviour is still culturally transmitted and costly. However, fledglings now learn the behaviour *after* dispersal, primarily by observing *any* adult in their new colony, regardless of the adult's origin. Crucially, within a colony, individuals can now observe both performers and non-performers (if any exist). A non-performing mutant or immigrant arises in a sentinel colony. This non-performer avoids the costs and has higher fitness than performers. Others observe this higher payoff. The non-performing behaviour spreads *horizontally* within the colony via social learning. The sentinel tradition collapses within that colony as more individuals defect. The colony-level benefit is lost. Dispersers from such colonies carry no strong tradition. The behaviour decays universally.
  *   **Gene's-Eye/Individual View Verdicts:** *Decay* (as before). Non-performers outcompete performers within groups.
  *   **Group View Verdict:** Cannot explain persistence. While groups *might* still differ initially, the rapid *within-group* collapse of the behaviour due to individual-level selection (favouring non-performers) prevents group selection from having a stable trait to act upon. Group productivity differences become irrelevant as all groups quickly lose the behaviour internally. The frameworks now largely agree on the outcome (decay) driven by individual cost/benefit, differing only in emphasis – they "keep the same books".

  **(d) Defender's Attack & Survival:**
  A defender of the **Gene's-Eye View** would attack the case by arguing: "The cultural transmission mechanism *itself* requires a genetic basis. The capacity for social learning, imprinting on colony norms, and executing the complex sentinel behaviour must have a genetic underpinning. Genes 'for' general learning ability, social conformity, or specific neural circuits enabling this cultural transmission *are* being selected. The persistence of sentinel behaviour is merely a side-effect of the spread of these 'cultural capacity' genes. Group productivity might favour colonies with these genes, but the *real* unit of selection is still the gene(s) enabling the cultural system that allows group-beneficial traits to sometimes persist."

  *   **Strongest Attack:** The argument that the *capacity* for cultural inheritance has a genetic basis is the strongest. It suggests genes underlying the transmission *mechanism* are the true targets of selection, co-opting the group-level explanation.
  *   **Does a Version Survive?** Possibly, but weakened. A defender of the group selection interpretation could counter: "The genetic basis is for a *general* capacity to learn *any* colony-specific behaviour (e.g., foraging techniques, nest styles, predator responses), not for sentinel behaviour specifically. Sentinel behaviour persists *only* because of its group-level benefit and the specific structure of cultural inheritance *between* groups. Genes for general learning ability might be necessary, but they are not sufficient to explain the persistence of this *specific*, costly, group-beneficial trait. The group-level inheritance and selection are essential to explain why *this* trait, rather than countless other possible learned behaviours, spreads." However, the gene's-eye view defender can still maintain that selection on the general learning genes, modulated by the group context they create, is the fundamental explanation.

  **(e) Final Verdict:**
  *   **Does it show a substantive difference?** **Yes, provisionally.** The case successfully creates a scenario where the group selection framework predicts persistence of a costly trait, while the gene and individual frameworks unambiguously predict decay, based solely on the cost to the individual/replicator within the group. The difference in predicted outcomes (persistence vs. decay) is substantive, not just accounting differences. The key is the inheritance channel isolating the trait variation *between* groups.
  *   **What makes it fail?** The case fails **if**:
      1.  **Within-Group Heritability Secretly Exists:** If genetic differences *do* influence propensity for the behaviour within groups, even subtly, the gene/individual views can explain persistence via kin selection or other mechanisms.
      2.  **Cost is Illusory:** If the apparent cost is offset by a hidden individual benefit (e.g., sentinels gain mating opportunities), the gene/individual views can explain persistence.
      3.  **Cultural Transmission is Genetically Determined for the Trait:** If the capacity to learn *specifically the sentinel behaviour* has a strong genetic basis (not just general learning), the gene's-eye view co-opts the explanation, collapsing the frameworks onto the same genetic outcome.
      4.  **Group Turnover is Insufficient:** If sentinel colonies don't produce *enough* extra dispersers to offset the within-group decay, the behaviour still decays overall despite group benefits.

  The case demonstrates that **inheritance above the individual level** (here, cultural group inheritance) is the critical factor that *can* make the units of selection debate substantive, allowing group selection to predict outcomes impossible under strict gene/individual selection. However, its vulnerability to the "genes-for-cultural-capacity" counterattack highlights the deep entanglement of inheritance mechanisms.
