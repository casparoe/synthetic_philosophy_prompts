  ### Can Sam's Pair of Answers (A and D) Be Defended?
  **Yes, Sam's choices can be defended**, but it requires stepping outside expected utility theory (EUT) and accepting a descriptive (behavioral) model of decision-making, such as **prospect theory** (Kahneman and Tversky, 1979). Here's how:

  - **Prospect Theory Explanation**: Under prospect theory, people evaluate choices based on potential gains/losses relative to a reference point, not final wealth. They also weight probabilities non-linearly (overweighting small probabilities and underweighting large ones). In Question 1, A is a sure gain ($2,500), which people strongly prefer due to "certainty effect" (overweighting certainty). In Question 2, both C and D are risky, with "nothing" as the reference point. Here, small probabilities (20–25%) are overweighted, making the higher payoff of D ($3,200) more attractive despite its slightly lower probability (20% vs. 25% for C). This can justify preferring A (safe) and D (risky with high upside) without contradiction.
    
