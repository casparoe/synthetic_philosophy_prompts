prompt: |-
  You are a professional philosopher specializing in normative ethics, with a research focus on the theory of promising and a reputation for mapping debates as structured logical spaces rather than summarizing received views. I need a diagnostic instrument for an advanced ethics seminar: a decision tree, equivalently a taxonomy, of the positions on why promises bind.

  Two constraints on what you may rely on. First, you cannot search the internet, so do not cite authors, titles, dates, or page numbers, and do not attribute views to named people. Refer to each position by a descriptive label and define it in your own words; where a view has a familiar name, you may use the name, but you must characterize it yourself in a sentence. Second, do not include a literature review; I will supply references myself.

  Before you draft anything, spend some time brainstorming and mapping the logical space. Do not begin from a list of famous views and then hang questions on them; begin from the questions and let the positions fall out of the answers. Think carefully about whether the tree genuinely separates the leaves you place on it, and be honest where it does not.

  Build the tree under the following specifications.

  Each internal node must be a question a reader can answer without already knowing which position it leads to. No node may be of the form "do you accept the practice theory?" Instead, each node should be a verdict on a concrete case or a commitment about the structure of obligation, phrased so that the reader discovers their position by answering rather than by labeling themselves.

  Fix these diagnostic cases, and use them as branch points wherever positions genuinely diverge: the release case, where the promisee sincerely and with full authority over their own interests tells the promisor not to bother; the silent non-performance case, where the promisor simply fails to perform, offers no explanation, and the promisee never relied on the promise and does not care; the secret promise, where no one knows and no expectation is created; the promisee's death before performance, where a third party would have benefited; the promise to someone incapable of claiming performance, such as a young child, a person who has died, an animal, a deity, or one's own future self; the promise extracted by duress or deception; the promise to do something mildly wrong; the case where the promisor judges, on balance, that the promise should not be kept; and the vow, oath, or private resolution addressed to no particular person.

  I want the tree organized, at least in part, around a seam that you should treat as the spine of the exercise: a promise can be understood as an arrangement that relocates discretion over whether the promised act is performed. For each position, ask where the discretion ends up. It may stay with the promisor, so that the promise is a self-directed constraint defeasible by her own judgment of the balance of reasons; it may pass to the promisee, so that the promise is a transfer of authority and the promisee may demand, waive, or release; it may be held jointly, so that neither party can unilaterally cancel; or it may rest with no one, so that a social practice fixes the terms. Then ask what each answer predicts about the release case and the silent non-performance case, and use those disagreements as branch points.

  A second seam should run alongside the first: whether the source of the bindingness is the promisor's act, understood as an exercise of a normative power; the promisee's interest, whether in assurance, reliance, or authority; or a social institution that assigns the power and defines its limits. Cross this with whether the account treats breach as a directed wrong owed to the promisee, an impersonal wrong against a practice or against the value of trust, or no wrong at all but a reason for regret.

  At least the following must appear as leaves: a self-legislation or normative-power view; a transfer-of-authority view on which the promisee holds the discretion; a practice or convention view; a reliance or assurance view; a non-conventionalist wrong-making view on which the promise binds because breaking it would use or mislead the promisee, independent of any practice; a joint-commitment view; a relationship or trust view; a perform-or-justify view on which the duty is to perform or else answer for not doing so, rather than an outright duty to perform; a deflationary view on which promising generates no distinctive obligation and binds only through ordinary moral reasons; and a self-regarding view on which promising binds chiefly for the promisor's own sake, through integrity or resoluteness. Add further leaves if the logical space demands them, and mark any leaf no one defends as unnamed.

  For each leaf, give the label, one sentence defining the position, one sentence naming its most awkward commitment, that is, the case it handles worst, and its verdict on the release case and the silent non-performance case.

  Then do three things. Flag any pair of leaves the tree cannot separate, and explain why they collapse into one another. Note which combinations of answers the tree leaves unoccupied, and diagnose each: is no one there because the view is incoherent, because it is coherent but unattractive, or because it is merely unexplored? Finally, state plainly which of your own branch questions you are least confident actually discriminates, and what evidence would settle it.

  Size and format: eight to twelve internal questions and twelve to sixteen leaves, for an advanced undergraduate and graduate audience. Present the tree as an indented numbered outline, with each node written as a question and each leaf carrying its label and annotations, followed by the flagged pairs, the empty branches, and your statement of uncertainty.
reasoning: |-
  Hmm, the user wants me to create a sophisticated diagnostic decision tree for an advanced ethics seminar focusing on why promises bind. They're asking me to act as a professional philosopher specializing in normative ethics with expertise in promise theory.

  The constraints are clear: no internet searches, no citations of authors or works, and no literature reviews. I need to build this from first principles based on logical distinctions in the philosophy of promising. The user emphasizes starting from questions rather than famous views, using concrete cases as branch points.

  Key diagnostic cases include: release case, silent non-performance, secret promise, promisee's death, promise to incapable beings, coerced promises, promises to do wrong, promisor's judgment against keeping, and vows/oaths. 

  The spine should focus on where discretion over performance resides after promising: with promisor, promisee, jointly, or nowhere (social practice). A second seam concerns the source of bindingness: promisor's act, promisee's interest, or social institution. I also need to consider whether breach is a directed wrong, impersonal wrong, or no wrong.

  Required positions include: self-legislation, transfer-of-authority, practice/convention, reliance/assurance, non-conventionalist wrong-making, joint-commitment, relationship/trust, perform-or-justify, deflationary, and self-regarding views. I should add more if logical space demands.

  For each leaf position, I need to provide: a descriptive label, one-sentence definition, most awkward commitment (weakest case), and verdicts on release and silent non-performance cases.

  After building the tree, I must: flag any indistinguishable leaf pairs, note unoccupied branches with diagnoses, and identify my least confident branch question with evidence that could settle it.

  The format should be an indented numbered outline with 8-12 questions and 12-16 leaves, suitable for advanced undergrads and grad students.

  I'll begin by mapping the logical space around discretion location and bindingness source. The discretion question seems primary: who controls whether performance happens? This gives four main paths: promisor keeps discretion, promisee gets it, joint control, or no discretion (practice-bound). 

  Then for each, I'll drill down into why it binds. For example, if discretion stays with promisor, why does promising matter at all? This might lead to self-legislation or perform-or-justify views. If discretion transfers, is it because of promisee's interests (transfer-of-authority) or something else?

  The diagnostic cases will serve as natural branch points. For instance, the release case should distinguish transfer-of-authority (promisee can release) from most other views. Silent non-performance tests whether a promise binds without reliance or expectations.

  I'll ensure each question is answerable without position labels. For example: "Can the promisee unilaterally cancel the obligation by releasing the promisor?" rather than "Do you accept transfer theory?"

  The positions will include all required ones plus any gaps I find. For instance, a "social coordination" view might emerge as distinct from strict practice theory. I'll mark undefended positions as unnamed.

  After drafting the tree, I'll check for: indistinguishable pairs (e.g., some reliance and assurance views might collapse), empty branches (e.g., "discretion nowhere + bindingness from promisor's act" might be incoherent), and my least confident question (probably about joint control - evidence would be whether parties can veto cancellation).

  Finally, I'll structure the response clearly: tree outline first, then indistinguishable pairs, empty branches, and uncertainty statement.
answer: |-
  ### Diagnostic Decision Tree: The Binding Force of Promises  

  **Spine Question: After a promise is made, where does the discretion to decide whether the promised act occurs ultimately reside?**  
  1. **Does the promisor retain full discretion to override the promise based on their own judgment of the balance of reasons?**  
     - *If YES → Go to Q2.*  
     - *If NO → Go to Q3.*  

  2. **Is the promise still binding in some distinctive way, despite the promisor's retained discretion?**  
     - *If YES →* **Leaf: Self-Legislation View**  
       - *Definition:* Promising is an exercise of the promisor's normative power to create a defeasible self-obligation, subordinated to their all-things-considered judgment.  
       - *Awkward Case:* Promise extracted by duress (binds despite compromised autonomy).  
       - *Release Case:* Binding unless promisor judges release alters reasons.  
       - *Silent Non-Performance:* Permissible if promisor judges non-performance justified.  
     - *If NO →* **Leaf: Deflationary View**  
       - *Definition:* Promises generate no distinctive obligation; apparent bindingness reduces to background moral reasons (e.g., avoiding harm).  
       - *Awkward Case:* Secret promise (no bindingness, counterintuitive for solemn vows).  
       - *Release Case:* No obligation exists to release.  
       - *Silent Non-Performance:* Permissible if no harm occurs.  

  3. **Does the promisee hold unilateral authority to demand, waive, or enforce performance?**  
     - *If YES → Go to Q4.*  
     - *If NO → Go to Q5.*  

  4. **Is the promisee's authority grounded in their interests or in the promisor's act?**  
     - *If PROMISEE'S INTERESTS →* **Leaf: Transfer-of-Authority View**  
       - *Definition:* Promising transfers discretionary control over the act to the promisee, who may release or enforce.  
       - *Awkward Case:* Promisee’s death (authority evaporates, but third parties may still expect performance).  
       - *Release Case:* Obligation dissolves upon release.  
       - *Silent Non-Performance:* Wrong (violates promisee’s authority, even if no harm).  
     - *If PROMISOR'S ACT →* **Leaf: Normative-Power View**  
       - *Definition:* The promisor’s act creates a directed duty owed to the promisee, who holds a claim-right to performance.  
       - *Awkward Case:* Promise to an animal (non-person cannot hold claims).  
       - *Release Case:* Obligation dissolves upon release.  
       - *Silent Non-Performance:* Wrong (violates promisee’s right).  

  5. **Is the discretion held jointly (neither party can unilaterally cancel)?**  
     - *If YES →* **Leaf: Joint-Commitment View**  
       - *Definition:* Promising creates a mutual commitment; obligation binds both parties collectively and requires mutual release.  
       - *Awkward Case:* Silent non-performance (breach without consultation wrongs the joint project).  
       - *Release Case:* Requires mutual agreement to dissolve.  
       - *Silent Non-Performance:* Wrong (unilateral violation of shared commitment).  
     - *If NO → Go to Q6.*  

  6. **Is the discretion located in a social practice that fixes obligations impersonally?**  
     - *If YES → Go to Q7.*  
     - *If NO → Go to Q8.*  

  7. **Does breach wrong the promisee specifically, or the practice/community?**  
     - *If PROMISEE →* **Leaf: Practice-Based Directed Duty View**  
       - *Definition:* Social conventions create directed duties owed to the promisee, whose release is authoritative.  
       - *Awkward Case:* Secret promise (no practice invoked, so no obligation).  
       - *Release Case:* Obligation dissolves upon release.  
       - *Silent Non-Performance:* Wrong (violates practice-based duty to promisee).  
     - *If PRACTICE/COMMUNITY →* **Leaf: Conventionalist Impersonal View**  
       - *Definition:* Promises bind to uphold trust in the practice; breach wrongs society, not necessarily the promisee.  
       - *Awkward Case:* Release case (promisee’s release doesn’t dissolve obligation if society’s trust is undermined).  
       - *Release Case:* Still binding (promisee lacks authority over social trust).  
       - *Silent Non-Performance:* Wrong (undermines practice).  

  8. **Is the binding force primarily grounded in the promisee’s vulnerability (e.g., reliance or assurance)?**  
     - *If YES → Go to Q9.*  
     - *If NO → Go to Q10.*  

  9. **Does the wrong inhere in creating vulnerability or in exploiting it?**  
     - *If CREATING VULNERABILITY →* **Leaf: Assurance View**  
       - *Definition:* Promising induces reliance by providing assurance; bindingness stems from the duty not to invite reasonable reliance.  
       - *Awkward Case:* Silent non-performance (no reliance, so no obligation).  
       - *Release Case:* No obligation if reliance withdrawn.  
       - *Silent Non-Performance:* Permissible (no reliance created).  
     - *If EXPLOITING VULNERABILITY →* **Leaf: Reliance View**  
       - *Definition:* Binding only if actual reliance occurs; breach wrongs by harming the promisee who depended on performance.  
       - *Awkward Case:* Secret promise (no reliance possible).  
       - *Release Case:* No obligation if no reliance.  
       - *Silent Non-Performance:* Permissible (no reliance).  

  10. **Is the core wrong in breaking a promise one of deception or instrumentalization?**  
      - *If YES →* **Leaf: Non-Conventionalist Wrong-Making View**  
        - *Definition:* Breaking a promise inherently manipulates the promisee’s agency by inviting trust under false pretenses, regardless of practice.  
        - *Awkward Case:* Promise to do wrong (bindingness conflicts with immorality).  
        - *Release Case:* Obligation dissolves (no deception if released).  
        - *Silent Non-Performance:* Wrong (implicit deception).  
      - *If NO → Go to Q11.*  

  11. **Does the obligation derive from the value of the relationship or trust itself?**  
      - *If YES →* **Leaf: Relationship/Trust View**  
        - *Definition:* Promises bind as constitutive acts of trust that sustain valuable relationships; breach damages relational integrity.  
        - *Awkward Case:* Silent non-performance (no relationship harm if promisee indifferent).  
        - *Release Case:* Obligation dissolves (relationship unharmed).  
        - *Silent Non-Performance:* Wrong if it corrodes general trustworthiness.  
      - *If NO → Go to Q12.*  

  12. **Must the promisor either perform or justify non-performance to the promisee?**  
      - *If YES →* **Leaf: Perform-or-Justify View**  
        - *Definition:* Promising creates a duty not to perform unconditionally, but to be accountable to the promisee for one’s actions.  
        - *Awkward Case:* Promisee’s death (no one to justify to).  
        - *Release Case:* Justification not needed if released.  
        - *Silent Non-Performance:* Wrong (failure of accountability).  
      - *If NO →* **Leaf: Self-Regarding View**  
        - *Definition:* Promises bind to preserve the promisor’s integrity or resolve; breach is self-betrayal.  
        - *Awkward Case:* Release case (release irrelevant to self-obligation).  
        - *Release Case:* Still binding (integrity unaffected by release).  
        - *Silent Non-Performance:* Wrong (if it compromises resoluteness).  

  **Unnamed Leaf** (Logical gap):  
  - **Discretion Nowhere + Bindingness from Promisor’s Act:** *Coherent but undefended*.  
    - *Example:* "Cosmic-Command View" – Promising triggers impersonal duties (e.g., to a deity) that no human controls.  

  ---

  ### Flagged Indistinguishable Pair  
  - **Assurance View vs. Reliance View** collapse when assurance *invites* reliance. If inducing reasonable reliance is the wrong, the views merge. Separation requires insisting assurance binds even without *actual* reliance (e.g., in secret promises), which Assurance View typically rejects.  

  ### Empty Branches & Diagnoses  
  1. **Discretion with promisor + Bindingness from promisee’s interest** → *Incoherent*. If discretion stays with promisor, it contradicts promisee’s authority.  
  2. **Discretion jointly + Bindingness solely from promisor’s act** → *Coherent but unattractive*. Joint commitment requires mutuality; a solo act can’t bind jointly.  
  3. **Discretion nowhere + Bindingness from promisee’s interest** → *Unexplored*. Social practices could protect promisee interests impersonally (e.g., "Practice-Based Directed Duty" approximates this).  

  ### Uncertainty Statement  
  **Least Confident Branch: Q5 (Joint discretion?)**  
  - *Why?* Distinguishing "joint" from "practice-based" discretion is ambiguous. Does "joint" imply interpersonal negotiation, or is it shorthand for practice-mediated coordination?  
  - *Evidence Needed:* Cases where parties mutually release *outside* a practice (e.g., children promising without understanding social norms). If obligation persists without practice, joint commitment is distinct.
