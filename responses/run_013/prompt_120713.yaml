  Hmm, the passage itself is quite rich. Marx is describing how individuals become more independent over historical time - starting from being deeply embedded in family/clan structures, then in various communal societies, and only in modern "civil society" do social connections appear as external tools for private goals. The user wants to understand what this implies for explaining social phenomena: should we start from individuals or social structures?

  First, I need to accurately paraphrase Marx's core claim (point 1). Then clearly define the methodological contrast (point 2) - individualism sees society as the sum of individual actions, while holism sees social structures as shaping those actions. For point 3, the implication seems to be that earlier societies require holist explanations, while modern ones might permit more individualist approaches. 

  But there's a tension (point 4): if individuals eventually perceive social connections as external means, doesn't that validate individualism in modern contexts? Yet Marx might argue this perception is itself socially produced. Finally (point 5), we'd need to know whether Marx thinks social structures retain causal primacy even when they appear "external" - that would determine if this supports strong holism or just contextualism.

  The user's background suggests they'll appreciate seeing how this philosophical debate mirrors software design patterns - like emergent system behavior versus atomic component properties. I should avoid citations per their request and stick to exactly five crisp points. They're clearly sharp - asking for "non-obvious tensions" shows they want depth, not just textbook answers.
answer: |-
  Here are the five numbered points addressing your query:

  1.  Marx claims that throughout most of history, individuals were fundamentally shaped by and inseparable from larger social groups (like family, clan, or community), and only in modern capitalist society ("civil society") do social structures start to appear to individuals as external tools or constraints for pursuing purely personal goals.
  2.  Methodological individualism explains social phenomena solely by the properties and actions of individuals, while holism explains individual actions and properties by the larger social structures, institutions, or systems that precede and shape them.
  3.  The passage implies holism is necessary for understanding pre-modern societies (where individuals were visibly dependent parts of wholes), while modern society fosters an *illusion* of individualism, though the social structures remain foundational and constraining.
  4.  A tension arises because Marx describes modern individuals *perceiving* social connections as external means/necessity, which could superficially support the individualist starting point, even as he argues this perception is itself a historically specific social product.
  5.  Deciding between strong holism (social wholes are primary causal agents) and historical contextualism (social structures dominate explanations in some eras, individuals in others) requires clarifying whether Marx sees the *apparent* individualism of modernity as ontologically real or merely a historically contingent subjective experience masking underlying social determination.
