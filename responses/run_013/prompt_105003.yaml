  ### Thought Experiment: The Treasure Thief

  #### Term and Introduction
  In the village of Oakhaven, a prized silver chalice was stolen during the annual Spring Revel. The village elders, seeking to identify the culprit, introduced the term "Silverhand" to rigidly designate the actual thief, whoever it might be. They declared: "Silverhand is the person who stole the chalice on the night of the Spring Revel." No one knew the thief's identity at the time. After an investigation, they discovered the thief was Elara, the blacksmith's apprentice.

  #### Primary Intension
  The primary intension of "Silverhand" is a function from centered worlds (considered as actual) to extensions:  
  - In any centered world \( w \), "Silverhand" refers to the individual who stole the chalice on the night of the Spring Revel in \( w \).

  #### Secondary Intension
  The secondary intension of "Silverhand" is a function from possible worlds (with the actual world fixed) to extensions:  
  - In any world \( v \), "Silverhand" rigidly refers to Elara (the actual thief), regardless of who stole the chalice in \( v \).

  #### Identity Sentence
  "Silverhand is the person who stole the chalice on the night of the Spring Revel."

  #### Two-Dimensionalist Verdict
  - **Primary intension (epistemic)**: In every centered world, "Silverhand" picks out whoever stole the chalice in that world. Thus, the identity sentence is true in all centered worlds → **a priori knowable**.  
  - **Secondary intension (metaphysical)**: With the actual world fixed, "Silverhand" refers rigidly to Elara. The description "the person who stole..." picks out whoever committed the theft in each counterfactual world. In worlds where Elara didn’t steal the chalice (e.g., a world where Finn stole it), the sentence is false → **contingent and a posteriori** (as empirical investigation was needed to learn Elara was the thief).

  #### One-Dimensionalist Verdict
  - Only the secondary intension exists. The sentence expresses a single proposition: that Elara (the rigid referent) is identical to the individual satisfying the description "stole the chalice..." in each world. This proposition is:  
    - **Contingent** (false in worlds where Elara didn’t steal it).  
    - **A posteriori** (empirical work was needed to confirm Elara stole the chalice).  
  The idea of an a priori primary intension is rejected.

  #### Load-Bearing Feature
  The rigidity of "Silverhand" post-reference-fixing, combined with the non-rigidity of the reference-fixing description ("the person who stole...").

  #### What Breaks If Removed
  If "Silverhand" were **non-rigid** (e.g., synonymous with the description), the secondary intension would always mirror the primary intension. The identity sentence would then be necessarily true (and arguably a priori), collapsing into a descriptivist-friendly triviality. The distinction between a priori/epistemic and a posteriori/metaphysical readings vanishes.

  #### Defender Reply (One-Dimensionalist)
  The 1D theorist argues that the primary intension is an **artefact of epistemology, not semantics**. What the 2D theorist calls the "primary intension" merely tracks how we identify the referent (the "cognitive significance" of the term), not its meaning. The meaning of "Silverhand" is exhausted by its rigid designation of Elara. The identity sentence is straightforwardly contingent and a posteriori; there’s no second layer of content. Any appearance of a priori truth arises from conflating linguistic conventions (fixing reference) with semantic content.

