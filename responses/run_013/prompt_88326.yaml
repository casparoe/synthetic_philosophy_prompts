prompt: |-
  I'm a software engineer with no formal background in philosophy or archaeology, and I've spent the past few months volunteering on weekends at a local excavation and then reading my way into the interpretive literature around it, which has left me more puzzled than when I started. The gap that bothers me is between what comes out of the ground and what gets said about it: a pit of pots that were clearly smashed on purpose, a peat bog holding a few hundred deliberately bent weapons, a burial with grave goods and the body arranged in what looks like a sleeping pose, a set of near-identical weights, a midden of butchered bone, paintings deep in a cave where nobody seems to have lived. Reports and popular books move from patterns like these to claims about what people believed and feared and how their institutions worked, and they do it with a confidence that doesn't seem to match the evidence. A friend who works in the field tells me the interesting question is what kind of warrant you're using, and that different schools answer it differently; I'd like a map of that rather than a shrug.

  So please build me a taxonomy of the positions on this question, laid out as a decision tree rather than as a list of names. It should start from the commitment that at least some material patterns are the residue of deliberate human action rather than of taphonomy and erosion, and each branch node should be a question whose answer separates the views below it, phrased so that someone looking at one of the cases above could answer it without already knowing which position the answer commits them to. I want the branches to cover at least these splits: whether an interpretation has to rule out plain function before it can invoke meaning or belief at all; whether analogy to living or historically documented people is the only bridge from object to belief, and whether that analogy has to be independently testable against the record; whether ritual is a legitimate category of explanation or just a label for our ignorance; whether the target of the reconstruction is individual mental states, collective or public meanings, or only practices and institutions; whether an interpretation has to be falsifiable to count as knowledge; and whether beliefs are supposed to be causes of the material pattern or byproducts of other things. Each leaf should carry the name of a position — a standard label if one exists, otherwise a descriptive one — together with one sentence on that position's most awkward commitment. Use the cases above as the test cases the tree has to sort, and add others only where a branch can't be exercised without them.

  A few constraints. Don't give me citations, reading lists, or the names of individual scholars; I have no way to check those and I don't want a bibliography, so keep the labels impersonal or descriptive. Aim for eight to ten leaves, and keep the whole thing usable as a one-page handout for a reading group. Where two leaves come out of the tree indistinguishable, say so instead of papering over it, and where some combination of answers has no position attached to it, tell me whether that's because the combination is incoherent, unattractive, or simply unexplored. I also suspect I'm running together two separate axes — what the inference is about, and what licenses it — so if a single tree can't carry both, tell me that and give me the second axis separately.
reasoning: |-
  Okay, the user is a software engineer who's been volunteering at an excavation and reading archaeological literature. They're frustrated by the gap between physical findings and interpretations about beliefs and institutions. Their friend mentioned "warrant," and they want a taxonomy of positions laid out as a decision tree, not just a list of names. 

  They want this tree to start from the premise that some material patterns are deliberate human actions. Each branch should be a question that can be answered by looking at evidence like the pit of smashed pots or the bog with bent weapons. The tree needs to cover key splits: functional vs. symbolic explanations, use of analogy, the concept of ritual, target of reconstruction (individual vs. collective), falsifiability, and whether beliefs cause patterns or are byproducts. 

  The output should have 8-10 leaves, each with a position name and its most awkward commitment. No citations or scholar names—just descriptive labels. If two positions end up indistinguishable, note that. Also, if the tree can't handle both axes (inference content vs. warrant), split them. 

  First, I need to structure the decision tree. The major divides should be:
  - Is functional explanation sufficient? If yes, that's functionalism. If no, move to the next split.
  - Is analogy necessary? Then, whether that analogy must be testable.
  - Is "ritual" an explanation or a label for ignorance?
  - What's the target: mental states, collective meanings, or practices?
  - Must interpretations be falsifiable?
  - Are beliefs causes or effects?

  But I notice two axes here: what we're inferring (beliefs, meanings, practices) and what licenses that inference (analogy, falsifiability, etc.). The user suspects they might be conflating these. So I should probably separate them into two trees.

  For the first axis (inference target), branches could be:
  1. Does the pattern primarily reveal mental states? If yes, that's cognitive individualism.
  2. Or does it reveal collective meanings? Then that's symbolic structuralism.
  3. Or only practices and institutions? That's practice theory.

  For the second axis (warrant for inference), branches could be:
  1. Must analogy to documented cultures be used? If yes, then is it a strict analogy requiring testing (ethnohistoric warrant) or just plausible (interpretive analogy)?
  2. If analogy isn't required, then is falsifiability necessary? If yes, that's falsificationism; if no, then ritual as a valid category (ritual functionalism) or not (ritual skepticism).
  3. Also, whether beliefs are causes (intentionalism) or byproducts (materialism).

  Testing with the cases: 
  - The pit of smashed pots: Functional explanation might be accidental breakage, but deliberate smashing suggests ritual. So we'd reject functionalism and move to analogy or other warrants.
  - The bog with bent weapons: Clearly deliberate, so not taphonomy. Is it functional (disable weapons) or symbolic (offerings)? If symbolic, is analogy needed? If we use Celtic analogies, that's ethnohistoric warrant; if not, it might be interpretive analogy.
  - The burial in sleeping pose: Could be functional (ease of burial) or symbolic (belief in afterlife). If symbolic, target could be individual belief (cognitive) or collective meaning (structuralist).

  Combinations: Some inference targets might pair with certain warrants. For example, cognitive individualism often uses falsifiable methods, while structuralism might rely on untestable analogies. Practice theory might avoid beliefs entirely.

  Awkward commitments: 
  - Functionalism: Struggles when function is unclear (e.g., cave paintings not in living areas).
  - Ritual skepticism: Can't explain patterned non-functional actions.
  - Cognitive-processual: May reduce rituals to cognitive biases, ignoring cultural meanings.
  - Symbolic structuralism: Risks imposing external symbolic systems without evidence.
  - Practice theory: Avoids beliefs but must explain how practices reproduce without shared meanings.
  - Materialism: Says beliefs don’t cause patterns, but then why deliberate actions like bending weapons?
  - Interpretive analogy: Allows plausible stories but can't be proven wrong.

  Unexplored combinations: 
  - For example, a position that targets individual mental states without using analogy or requiring falsifiability. That might be incoherent because individual thoughts are hard to access without analogy.
  - Or practice theory combined with materialism—that could be consistent, seeing practices as material routines with beliefs as byproducts.

  Final structure: Two trees. First tree for inference target (3 leaves). Second tree for warrant (5 leaves). Some leaves might combine, like ritual functionalism falling under warrant tree. Total 8-10 leaves including both trees. Make sure each leaf has a clear awkward commitment.
answer: |-
  Here's a taxonomy structured as two separate decision trees, as the "inference target" (what we're reconstructing) and "warrant type" (how we justify it) represent distinct axes. Each tree uses your cases as test points, with branches phrased to avoid presupposing positions. Positions appear only at the leaves, with their most awkward commitment noted.

  ---

  ### **Tree 1: What is the Target of Inference?**  
  *Starting point: A material pattern (e.g., bent weapons, burial pose) is deliberate human action.*

  1. **Does the pattern primarily reveal individual mental states (e.g., beliefs, fears)?**  
     - **Yes** → **Cognitive Individualism**: Must show how material traces directly correlate with specific psychological states, despite mental states leaving no direct fossil record.  
     - **No** → Proceed to 2.  

  2. **Does the pattern primarily reveal shared meanings or symbolic structures (e.g., myths, social codes)?**  
     - **Yes** → **Symbolic Structuralism**: Must assume symbolic systems are stable and universally legible, risking imposition of external frameworks (e.g., interpreting bent weapons as "offerings" based on modern analogies).  
     - **No** → Proceed to 3.  

  3. **Does the pattern primarily reveal collective practices or institutions (e.g., rituals, economic systems)?**  
     - **Yes** → **Practice Theory**: Must explain cultural reproduction without appealing to shared beliefs or meanings, reducing rituals to habitual actions (e.g., "sleeping pose" burials as tradition, not afterlife belief).  
     - **No** → **Materialism (by default)**: Must treat beliefs as irrelevant epiphenomena, making deliberate symbolic acts (e.g., cave paintings) inexplicable.  

  *Unresolved gap: Positions avoiding all three targets (e.g., "only describing actions") collapse into functionalism or materialism.*

  ---

  ### **Tree 2: What Warrants the Inference?**  
  *Starting point: A material pattern (e.g., midden bones, identical weights) has no obvious functional explanation.*

  1. **Must functional utility be ruled out before invoking meaning/belief?**  
     - **Yes**, and function is testable → **Functionalism (Strict)**: Struggles with patterns lacking clear utility (e.g., non-utilitarian cave paintings).  
     - **No**, meaning/belief can be primary → Proceed to 2.  

  2. **Is analogy to documented societies essential?**  
     - **Yes**, and analogy must be testable → **Ethnohistoric Warrant**: Fails where no documented analogies exist (e.g., unique burial poses).  
     - **Yes**, but plausibility suffices → **Interpretive Analogy**: Allows "just-so stories" (e.g., linking bog weapons to Celtic rituals without local evidence).  
     - **No** → Proceed to 3.  

  3. **Is "ritual" a valid explanation?**  
     - **Yes** → **Ritual Functionalism**: Treats ritual as a social/ecological function, ignoring subjective meaning (e.g., smashed pots as waste management, not ceremony).  
     - **No**, ritual labels ignorance → **Ritual Skepticism**: Cannot explain patterned non-functional actions (e.g., deliberate weapon bending).  
     - **It depends** → Proceed to 4.  

  4. **Must interpretations be falsifiable?**  
     - **Yes** → **Falsificationism**: Rejects compelling but untestable claims (e.g., "sleeping pose" = belief in rebirth).  
     - **No** → **Hermeneutics**: Accepts subjective narratives that may be circular (e.g., midden bones as "feasting" = social cohesion).  

  5. **Are beliefs causes or byproducts?**  
     - **Beliefs cause patterns** → **Intentionalism**: Assumes actions reflect conscious intent, ignoring unconscious/discursive influences (e.g., identical weights as "intentional standardization").  
     - **Beliefs are byproducts** → **Materialism**: Renders symbolic acts (e.g., cave art) as side effects of ecology/neurology, not culture.  

  ---

  ### **How Cases Sort into the Trees**  
  - **Bog weapons**:  
    - *Target Tree*: Symbolic Structuralism (shared meaning) or Practice Theory (institution).  
    - *Warrant Tree*: Ethnohistoric Warrant (if using Celtic analogs) or Ritual Skepticism (if rejecting "ritual").  
  - **"Sleeping pose" burial**:  
    - *Target Tree*: Cognitive Individualism (individual belief) or Symbolic Structuralism (shared meaning).  
    - *Warrant Tree*: Hermeneutics (unfalsifiable narrative) or Falsificationism (if testable).  
  - **Cave paintings**:  
    - *Target Tree*: Symbolic Structuralism (collective meaning).  
    - *Warrant Tree*: Interpretive Analogy (e.g., shamanism) or Materialism (byproduct of cognition).  

  ---

  ### **Key Observations**  
  1. **Combinations**: Most positions combine one leaf from each tree (e.g., *Symbolic Structuralism* + *Interpretive Analogy*).  
  2. **Gaps**:  
     - **Incoherent**: Targeting individual mental states without analogy (no access to prehistoric minds).  
     - **Unexplored**: Non-analogous, falsifiable claims about collective meanings.  
     - **Indistinguishable**: Practice Theory and Ritual Functionalism overlap significantly.  
  3. **Awkward Commitments**: Highlight tensions within each position (e.g., *Falsificationism* excludes plausible but untestable insights).  

  This fits on one page, uses your cases, and avoids proper names/citations. For your reading group: Apply branches to new examples to reveal hidden assumptions.
