prompt: |-
  I'm on the board of a housing co-op, about 60 units, and I keep hitting the same wall whenever we have a big decision, and I've started to think it's not just us. Two fights last year: whether to sell the empty lot behind the building to a developer, and whether to absorb the six-unit building next door that asked to join us. Both times we spent the whole meeting not on the question but on who was even allowed to vote on it, and it always comes back to the same sentence — everyone who'll be affected should get a say. But you can't say who's affected until you know what the decision is, and you can't decide until you know who's voting. The people who'd live in the new building aren't here yet; the neighbour whose light gets blocked isn't a member; the guy on the third floor swears the merger will raise his fees. Everyone's affected by everything, so 'affected' either means everyone, which can't be right, or it's doing no work at all. Then somone says, fine, it's the people already bound by our rules, the current members — clean answer, but it feels like taking the current answer as the answer. Is there a name for this? I don't just want the label. The two replies people give — 'everyone touched by it' versus 'everyone already under our rules' — aren't the same answer dressed up, they're genuinely different, and I want to know which is supposed to be the real one and whether either can avoid going round in a circle. And here's the thing that really nags me: our co-op's own edge isn't ours to set — the city and the province decide what a co-op can be and who can be pushed in or out. So even if we sorted it for us, whoever's above us has the identical problem, all the way up until someone doesn't. Is that the same problem one level down, or a different one that only looks the same?
reasoning: |-
  Okay, the user is on the board of a housing co-op dealing with a recurring problem: determining who gets to vote on major decisions. The issue is the phrase "everyone who'll be affected should get a say," which creates a circular problem. They can't define who's affected without knowing the decision, but they need to know who votes to make the decision. This came up with the sale of an empty lot and absorbing a neighboring building. 

  The user mentions two conflicting approaches: one group says everyone affected should vote (which could include future residents or neighbors), while another insists only current members bound by the rules should vote. The user feels the latter is a cop-out, just defaulting to the status quo. 

  But there's a deeper layer: the co-op itself exists within legal frameworks set by the city and province. So even if they resolve their internal voting issue, the higher authorities face the same problem when deciding policies for co-ops. The user wonders if this is the same problem at different levels or something fundamentally different. 

  First, I need to validate their frustration. This is a real philosophical and practical dilemma. The circularity they describe is classic—it's a boundary problem in democratic systems. The term "boundary problem" in political theory fits here. It's about defining the demos—the group entitled to participate in decisions. 

  Then there's the "bootstrapping" issue: how do you define the rules without already having a defined group? In their case, the co-op's bylaws or incorporation documents likely set the initial membership rules. But those were created by someone—probably founders or initial members. So historically, someone drew the first boundary. Now, when facing decisions that could change that boundary (like adding new members), they're stuck. 

  The user also points out the external constraints: higher authorities (city/province) set the co-op's legal framework. This creates a hierarchy of boundaries. The co-op's internal rule is nested within the province's rule, which is nested within the state's, and so on. At each level, the same question arises: "Who decides the rules for this group?" 

  The key insight is that boundaries are always somewhat arbitrary and historically contingent. There's no perfect solution because any decision affects people outside the group (e.g., the neighbor who loses sunlight). Democratic systems usually accept this imperfection and default to the current membership for practical reasons. But when the decision itself might change the group's composition (like absorbing another building), it gets messy. 

  For the co-op, practical steps might include: 
  - Clarifying bylaws: Define "member" explicitly and specify voting rights for boundary-changing decisions. 
  - Tiered approval: For expansions, require approval from both current members and the joining group (if feasible). 
  - Proxy input: Allow affected outsiders (like the neighbor) to voice concerns but not vote. 

  The user's meta-question—"Is this the same problem at higher levels?"—is sharp. Yes, it is the same problem recursively. The province faces it when setting co-op regulations: "Which co-ops or citizens should have a say?" But higher levels often have more established (if imperfect) mechanisms, like representative democracy. 

  The takeaway: Boundaries are necessary but inherently flawed. The co-op needs a clear, pre-agreed rule (even if imperfect) to avoid circular debates. The real answer isn't philosophical—it’s procedural: anchor to existing documents, amend them if needed, and accept that some externalities can’t be fully resolved. 

  The user’s frustration is totally valid. They’ve hit a foundational tension in collective decision-making. Naming it ("boundary problem") might help, but the solution is pragmatic: define the rules upfront, even knowing they’re imperfect.
answer: |-
  You've hit upon one of the deepest, most persistent problems in democratic theory: **the Boundary Problem** (or "the problem of constituting the demos"). It's not just your co-op—this circular dilemma vexes political philosophers, constitutional designers, and organizations worldwide. Here's a breakdown:

  ### 1. **The Core Problem: Circularity**
     - **The Paradox**: 
       - To decide *who votes*, you must know *who is affected*.  
       - To know *who is affected*, you must know *the outcome of the decision*.  
       - But the outcome depends on *who votes*.  
     - **Result**: Infinite regress. There's no neutral starting point.

  ### 2. **The Two Answers: Why They’re Fundamentally Different**
     - **"All Affected" Principle (AAP)**:
       - *Claim*: Anyone impacted by a decision deserves input.  
       - *Problem*: Impacts are often unknown, contested, or infinite (e.g., selling a lot affects future residents, neighbors, the city’s housing market).  
       - *Flaw*: **Logically unworkable** as a sole criterion—it dissolves boundaries.  
     
     - **"Current Members" Principle (CMP)**:
       - *Claim*: Only those bound by the co-op’s existing rules/covenants vote.  
       - *Problem*: Feels arbitrary or exclusionary (e.g., the neighbor whose light is blocked has no voice).  
       - *Strength*: **Operationally clear** and legally defensible.  
       - *Weakness*: Can entrench the status quo unjustly.  

     These aren’t just "dressed up" versions of each other—they reflect **competing values**:  
     - *AAP* prioritizes **moral inclusion** (justice for all stakeholders).  
     - *CMP* prioritizes **practical agency** (the group’s right to self-governance).

  ### 3. **The "Real" Answer? Neither—It’s a Trilemma**
     Democratic legitimacy requires balancing three things, but you can only ever maximize two:  
     - **Inclusiveness** (all affected)  
     - **Effectiveness** (decisive action)  
     - **Self-determination** (group autonomy)  
     
     *Your co-op’s tension*:  
     - AAP maximizes *inclusiveness* but sacrifices *effectiveness* (you never decide).  
     - CMP maximizes *effectiveness/self-determination* but sacrifices *inclusiveness*.  
     - **There’s no perfect solution**—only trade-offs.

  ### 4. **Escaping the Loop: Practical Strategies**
     - **Pre-commit to rules**: Embed voting eligibility in your bylaws *in advance*.  
       *Example*: "Voting on mergers/sales requires 2/3 approval from *current* members."  
     - **Tiered consent**:  
       - *Current members* vote on whether to *allow* a merger.  
       - *Joining members* must also approve *their* inclusion (e.g., 75% of both buildings).  
     - **External consultation**: Invite input from profoundly affected outsiders (e.g., the light-blocked neighbor), but retain final vote for members.  
     - **"Reversible experiments"**: For mergers, trial a temporary association (shared costs/services) before permanent union.  

  ### 5. **The Higher-Level Problem: It’s the Same, But Harder**
     When the city/province defines "what a co-op is," they face the **identical boundary problem**—but at a larger scale:  
     - *Who should decide co-op regulations?* Only current co-ops? All residents? Future residents?  
     - *Why?* Their decision affects outsiders (e.g., renters excluded from co-ops).  
     
     **Key insight**: Boundaries are always set by **existing power structures** (historical agreements, laws, constitutions). There’s no "view from nowhere." The chain stops at:  
     - **Force**: Imposed boundaries (e.g., colonial borders).  
     - **Default**: Inherited structures (e.g., provincial jurisdiction).  
     - **Consent**: Tacit agreement not to reopen the question (e.g., accepting Canada’s constitution).  

  ### **Why This Isn’t Futile**
     Recognizing this dilemma is progress. Your co-op can:  
     1. **Acknowledge the trade-off**: "We prioritize self-governance, so current members vote—but we’ll listen to deeply affected outsiders."  
     2. **Amend your rules**: Define voting eligibility *for future edge cases* in your bylaws.  
     3. **Embrace "good enough"**: Democracy is messy. A clear, pre-agreed rule (even if imperfect) is better than paralyzing circularity.  

  **Philosophers’ footnote**: This mirrors the "bootstrapping problem" in constitutions (who ratifies the constitution if it doesn’t yet exist?). The answer is always: **Someone decides, and others consent**. Your co-op’s task is to make that "someone" as legitimate as possible through transparency and fair procedure.
