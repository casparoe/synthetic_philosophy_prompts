    "response_to_objection": "A narrow, documented exception prevents greater harm (suppressing truths or endangering sources) while preserving the standard's integrity via high-bar approval and transparency.",
    "application_to_environment_story": "Approve exception with documented justification, redacted evidence package, and disclosure note in the published story.",
