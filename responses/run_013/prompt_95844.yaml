    - **Harm**: She’s harmed by being cast as a spokesperson, denying her the right to be fallible. This is "epistemic objectification" — treating her as a symbol, not a full knower.  

  ---

  ### **Why This Works**  
  - **Solves your conflicts**: Distinguishes reasonable doubt (Case 2) from statistical laziness (Case 7).  
  - **Handles "no bad actor" cases**: Systemic failures (e.g., unnamed conditions, fast meetings) wrong knowers by refusing to adapt.  
  - **Captures self-doubt**: Internalized injustice stems from past failures to engage.  
  - **Explains over-belief**: Credibility excesses also deny proper engagement, reducing people to stereotypes.  

  This centers the injustice on **systematic credibility mismatches**—whether deficits or excesses—that ignore the testifier’s actual context. It’s not about being "wrong" or "right," but about being *seen fully* as a knower.
