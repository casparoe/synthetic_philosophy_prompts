  ### **Your New Case: Over-Believed Marginalized Person**  
  **Scenario**: *A Black trans woman is trusted on a complex medical issue she has no expertise in, leading to harmful advice being followed. She’s harmed by the pressure and fallout.*  

  - **Repaired Principle Verdict**: ✅ **Injustice**.  
