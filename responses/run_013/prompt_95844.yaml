  **Why the Conflict?**  
  Your principle focuses on **identity-based credibility deficits**, but your intuition distinguishes between **reasonable** and **unreasonable** doubt. You reject injustice when the hearer has *agent-specific reasons* (Case 2), but accept it when the doubt stems from *group generalizations* (Case 7)—even if statistically sound.  

