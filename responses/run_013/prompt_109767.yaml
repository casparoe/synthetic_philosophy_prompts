prompt: |-
  Until recently I worked in compliance in London, where corruption was whatever the rulebook said it was. I have now taken a post as a governance adviser attached to an international development programme, and the question has become a live one for me almost daily. I am asked to adjudicate on payments, favours, gifts and appointments, and the working definition I inherited — in substance, that corruption is the misuse of public position for personal advantage — keeps returning verdicts I do not trust. It makes a cash envelope to a customs officer corrupt but treats a lavish gift to a minister's household as a cultural matter; it counts a nephew placed in a public agency as corruption but calls a departing official's well-paid board seat something else; it has nothing to say about favours traded inside a private firm, where no public office is involved; and it falters altogether when the benefit does not go to the official at all but to her village, her party or her congregation.

  So I have stopped asking which of my cases are corrupt and started asking what a theory of corruption would have to accomplish to be worth using. Please give me that specification: the full list of desiderata that any adequate account of corruption must satisfy, each with the case or consideration that motivates it, and your view as to which are genuine requirements and which are merely the prejudices of one tradition. I suspect a good deal of the literature writes Western public-administration norms into the definition and then presents the result as universal.

  I should like the list to say which cases the account must get right, beyond the ones I have described; which distinctions it must not collapse — corruption as against mere illegality, as against gift-exchange and hospitality, as against patronage that is perfectly legal and openly practised, and the line between a bribe and a tip, a facilitation payment and a fee, a lobbying payment and a campaign donation; and what it must be consistent with, including the awkward fact that one and the same transaction may be corrupt in one jurisdiction and unremarkable in another without the concept thereby becoming merely local. Please also say whether the account must be able to condemn a practice that those who live inside it do not regard as wrong, and whether it must be able to exonerate conduct that an outside body's rules forbid; and what it should make of the official who breaks a rule for admirable ends, or whose supposed principal — the public — appears not to mind.

  If some of these requirements cannot be met together — if, for instance, no account can be both faithful to how a practice is understood by its participants and usable as a standard for criticising it — I would far rather be told so plainly than handed a definition that quietly drops one of them. That possibility is the part of the answer I care about most. If one requirement does most of the work in ruling out the usual candidates, I should like to know which, but I am not asking for a scorecard of existing theories.

  Please write in British English, and no reading lists or citations — I want the specification argued for, not a survey.
reasoning: |-
  Okay, the user has moved from a compliance role in London to a governance adviser position in international development. They're struggling with the definition of corruption that they inherited—"misuse of public position for personal advantage." They find this definition inadequate because it labels some actions as corrupt while excusing others based on cultural context or technicalities. For example, a cash bribe to a customs officer is corrupt, but a lavish gift to a minister's household is seen as cultural. Nepotism is corruption, but a well-paid board seat for a departing official isn't. The definition also doesn't cover private firms or benefits that go to a group rather than an individual.

  The user wants a specification for a theory of corruption: what must it accomplish? They want a list of desiderata, each with the motivating case, and an indication of which are genuine requirements versus cultural prejudices. They also want to know which cases the theory must handle beyond their examples, which distinctions it must maintain (like corruption vs. illegality, gift-exchange, patronage), and how to handle jurisdictional differences. Plus, whether it can condemn practices insiders don't see as wrong, exonerate conduct forbidden by external rules, and address rule-breaking for admirable ends or when the public doesn't mind.

  The user is clearly frustrated with Western-centric definitions that don't account for varied contexts. They suspect existing literature imposes Western norms as universal. Their deeper need is for a framework that's both principled and adaptable, avoiding cultural bias while providing clear judgment criteria. They value intellectual honesty—if some desiderata conflict, they want that acknowledged rather than a definition that ignores the conflict.

  I need to address all their points. First, the desiderata. The core problem with their inherited definition is its narrow focus: public position, personal advantage, misuse. That misses broader abuses, cultural nuances, and systemic issues. So the desiderata should include handling different contexts, distinguishing corruption from other concepts, consistency across jurisdictions, and the ability to critique insider practices.

  Key cases beyond their examples: private sector corruption (like embezzlement), conflicts of interest, trading in influence. Distinctions to maintain: corruption vs. illegal but not corrupt acts (like parking tickets), genuine gifts vs. bribes, legal patronage vs. corrupt favoritism, tips vs. facilitation payments. The theory must explain why something can be corrupt in one place but not another without being relativistic—perhaps by separating the universal wrong (betrayal of trust) from local manifestations.

  For condemning practices insiders accept, the theory must allow external critique, grounded in harm or betrayal, not just local norms. For exonerating conduct forbidden by external rules, it should recognize that not all rule-breaking is corrupt; sometimes rules are flawed. And for rule-breaking for good ends or public indifference, it needs to assess intent and harm versus benefit.

  Potential conflicts: If a practice is culturally accepted but causes harm, can we condemn it? The theory must balance respect for context with ethical principles. Also, if personal advantage isn't the motive (like benefiting a village), is it still corrupt? The betrayal of role might be key, regardless of beneficiary.

  The user cares most about whether these requirements can coexist. For instance, being faithful to participants' understanding while allowing criticism might require a core principle like "betrayal of entrusted power for unauthorized gain," which can adapt locally but remains a standard. If some desiderata conflict, it's better to admit it—maybe no theory can be both entirely insider-perspective and critically usable.

  In conclusion, the user needs a robust, adaptable framework that avoids Western bias, handles real-world complexities, and honestly addresses conflicts in defining corruption.
answer: |-
  You've hit upon the core tension in defining corruption: the need for a principled standard versus the trap of cultural parochialism masquerading as universality. Your inherited definition fails precisely because it's a thin veneer over specific Western administrative norms, ignoring context, beneficiary, and the nature of the "principal". Here is the specification for an adequate account of corruption, argued through the cases and distinctions you face, and acknowledging potential fault lines:

  **Desiderata for an Adequate Account of Corruption:**

  1.  **Must Identify a Core Betrayal of Entrusted Power:** The account must centre on the *misuse of a position of trust* (public *or private*) for *ends contrary to the purpose for which that power was entrusted*.
      *   **Motivation:** Your cases: The cash envelope, nephew's appointment, and private firm favours all involve someone abusing their role (customs officer, official with hiring power, corporate manager) for unauthorised gain. The inherited definition gets this partially right but fatally limits it to *public* office and *personal* advantage. The core wrong is betraying the trust inherent in the role, whether that role is managing public funds, corporate resources, or community leadership. A village chief diverting aid for their clan betrays the trust of both donors and villagers, even if "public office" is loosely defined and the gain isn't "personal".
      *   **Requirement:** Genuine. This captures the fundamental breach of duty common across contexts.

  2.  **Must Distinguish Corruption from Mere Illegality:** It must explain why breaking a speed limit isn't corrupt, but bribery is, even if both are illegal.
      *   **Motivation:** Many illegal acts (parking violations, jaywalking) don't inherently involve a betrayal of entrusted power for unauthorised gain. Corruption is a *specific type* of wrongdoing centred on the abuse of a trusted role.
      *   **Requirement:** Genuine. Essential for conceptual clarity and targeting anti-corruption efforts.

  3.  **Must Account for the Beneficiary Beyond the Individual Officeholder:** It must explain why benefits directed to a village, party, or congregation *can* still be corrupt.
      *   **Motivation:** Your case: The official securing contracts or aid for their village/party/congregation. The inherited definition falters here because the gain isn't narrowly "personal". However, the official is still misusing entrusted power (e.g., procurement authority, budget allocation) to favour an unauthorised beneficiary (their in-group) over the rightful beneficiaries (e.g., the public purse, merit-based allocation, the intended recipients of aid). It's a diversion of resources or favour based on allegiance, not the proper purpose of the role.
      *   **Requirement:** Genuine. Excluding this renders the concept useless against systemic, clan-based, or political patronage corruption.

  4.  **Must Provide Tools to Distinguish Corrupt Favours from Legitimate Gift-Exchange/Hospitality and Legal Patronage:** It must not collapse these distinct practices, but offer criteria for differentiation.
      *   **Motivation:** Your cases: Lavish gift vs. cash envelope; nephew's appointment vs. departing official's board seat; cultural gift-exchange. Key distinctions often hinge on:
          *   *Proportionality/Value:* Does the value vastly exceed cultural norms for gifts/hospitality?
          *   *Timing & Linkage:* Is the gift/favour linked to a specific decision or action? Is it given *before* a decision is made?
          *   *Transparency & Reciprocity:* Is it open and reciprocated within established social norms (hospitality), or hidden and one-way (bribe)? Is the "patronage" (like the board seat) a reward for past decisions made *in favour* of the giver?
          *   *Violation of Role Duty:* Does the gift/favour induce the official to violate their core duties (e.g., impartiality, fair competition, fiduciary duty)? Legal patronage might be distasteful but not necessarily involve *violating* a specific duty inherent in the *previous* role (though conflicts arise).
      *   **Requirement:** Genuine. A definition that labels all gift-giving or patronage corrupt is useless and culturally imperialist. It must account for context and intent.

  5.  **Must Define the "Principal" Whose Trust is Betrayed:** It must grapple with who the power-holder is *actually* answerable to, which may differ from the nominal "public".
      *   **Motivation:** Your cases: The public "not minding"; benefits to village/party/congregation. In some contexts, an official's primary perceived duty *is* to their kin, clan, or party supporters, not an abstract "public". The account must address *which* trust is being betrayed. Is it the trust of the state/institution (defined by its formal rules)? The trust of the citizens it *should* serve (a normative ideal)? Or the trust of the group the official *feels* truly accountable to (a sociological reality)?
      *   **Requirement:** Genuine, but fraught. An adequate account must acknowledge this tension. It likely requires specifying the *intended* principal according to the *formal role* (e.g., "serving the public interest as defined by statute"), even if local practice differs. Failing this, the concept disintegrates into relativism ("it's only corrupt if their clan says so").

  6.  **Must Handle Jurisdictional Variance Without Collapsing into Relativism:** It must explain how the same transaction (e.g., a campaign donation) can be corrupt in System A but legal/acceptable in System B, without abandoning a core concept of corruption.
      *   **Motivation:** Lobbying payments vs. campaign donations; facilitation payments. The core wrong (betrayal of entrusted power for unauthorised gain) remains constant, but the *rules defining the proper use of power and authorised gains* differ. A large donation *conditional on a specific favour* might breach the duty of impartiality inherent in *any* public office, even if local rules are lax. A "facilitation payment" to bypass deliberately cumbersome rules *imposed* to extract bribes might be seen as corrupt on the part of the *rule-maker*, but the payer's act is more complex.
      *   **Requirement:** Genuine. The account must separate the *universal wrong* (breach of entrusted power) from the *context-specific rules* defining proper conduct and authorised benefits. Corruption occurs when local rules are *violated* in a way that constitutes this breach. Where rules are absent or permissive, the core principle (e.g., acting impartially for the public good) might still condemn practices legal locally.

  7.  **Must Enable the Condemnation of Practices Viewed as Acceptable by Participants:** It must provide grounds for external critique of systemic practices normalised within a group.
      *   **Motivation:** Your case: Favours within a private firm; patronage benefiting a village. If the definition relies solely on insider perception, it cannot critique nepotism in a family firm where all agree, or clan-based diversion of state resources where the clan sees it as rightful. The account must be grounded in the *harm* caused (distortion of decisions, erosion of institutional integrity, unfairness, resource diversion) and the *betrayal of the formal or intended purpose of the role*, regardless of local acceptance.
      *   **Requirement:** Genuine. Without this, the concept cannot be a critical tool for reform. It relies on distinguishing between *descriptive* norms (what is done) and *prescriptive* norms (what the role *ought* to entail).

  8.  **Must Enable the Exoneration of Conduct Forbidden by External Rules but Not Constituting Core Corruption:** It must recognise that not all rule-breaking by officials is corrupt.
      *   **Motivation:** Your case: Breaking a rule for admirable ends. An official using discretionary funds for an urgent, life-saving intervention forbidden by a rigid procurement rule isn't necessarily corrupt. They are arguably prioritising the *core purpose* of their role (public welfare) over a specific procedure. The key is whether the act constitutes a *betrayal* of trust for *unauthorised gain*, or a good-faith (if rule-breaking) attempt to fulfil their core duty.
      *   **Requirement:** Genuine. This prevents the definition from being overly legalistic and acknowledges dilemmas of conscience.

  9.  **Must Distinguish Between a Bribe, a Tip, a Facilitation Payment, and a Fee/Lobbying Donation:** It must offer clear, context-aware differentiating criteria.
      *   **Motivation:** Your explicit request. Building on Desideratum 4:
          *   *Bribe:* Inducement to violate duty (core betrayal).
          *   *Tip:* Reward *after* service, not contingent on specific violation, proportionate, often customary.
          *   *Facilitation Payment:* Payment to secure performance of a *non-discretionary* duty the payer is entitled to, often in contexts of bureaucratic delay. (Contentious: Is it extortion by the official? Does it still distort systems? Many argue it meets the core betrayal test by exploiting power for personal gain).
          *   *Fee:* Payment for a legitimate, transparent service rendered.
          *   *Lobbying Payment vs. Campaign Donation:* Lobbying payment should be for providing information/argument, not for a direct decision in return. Campaign donations become problematic when explicitly linked to specific future official actions (quid pro quo) or are so large as to create an *implicit* obligation conflicting with impartiality.
      *   **Requirement:** Genuine. Essential for practical application.

  **The Central Tension & Your Core Concern:**

  You rightly anticipate that some desiderata pull in opposite directions. **The most profound conflict is between Desideratum 5 (Defining the Principal) and Desideratum 7 (Condemning Insider-Accepted Practices).**

  *   **The Conflict:** If the "principal" whose trust matters is defined *solely* by the *local, perceived* accountability (e.g., the clan), then diverting resources to the clan isn't corrupt (Desideratum 5 - sociological view). But this makes Desideratum 7 (condemning such diversion as harmful and a breach of the state's purpose) impossible. Conversely, if the principal is defined *only* normatively (e.g., the abstract public good), the account risks imposing an external standard insensitive to local context and legitimacy structures (the Western norm problem you identified).
  *   **Resolution?** A *truly* adequate account must navigate this. It likely requires:
      1.  **Acknowledging the dual nature of roles:** Officials hold a *formal* role within a state/institution with defined purposes and rules, and *informal* roles within social/kinship networks.
      2.  **Anchoring corruption in the formal role:** The core betrayal must be defined against the *entrusted purpose of the formal position* (e.g., impartially administering public resources for the common good as defined by the state's constitution/laws, managing corporate assets for shareholders). This allows condemnation of practices violating this formal trust (Desideratum 7), even if locally accepted.
      3.  **Contextual application:** Assessing *how* the formal duty is breached requires understanding local context (e.g., distinguishing culturally embedded gift-giving *within norms* that don't breach impartiality vs. gifts that clearly do). The *standard* (betrayal of formal trust) is universal; the *assessment* of whether an act breaches it is contextual.

  **Which Requirement Does the Heavy Lifting?**

  **Desideratum 1 (Core Betrayal of Entrusted Power) combined with a robust, formal-institutional definition of the "Principal" (Desideratum 5)** is the keystone. It rules out the flawed "personal advantage/public office" definition by:
  *   Including private sector abuse.
  *   Capturing benefits to groups (village, party).
  *   Providing the foundation for distinguishing corruption from mere illegality, gifts, and legal patronage (does the act constitute a *betrayal* of the role's core trust?).
  *   Explaining jurisdictional variance (different rules define the role's duties/authorised gains).
  *   Enabling condemnation of insider-accepted practices (they violate the formal trust).
  *   Providing grounds for exoneration (rule-breaking serving the role's core purpose isn't betrayal).

  However, this only works if the definition of the "formal role" and its "entrusted purpose" is carefully constructed to avoid simply re-inscribing Western norms. It must be based on the *stated purposes and rules of the specific institution* within its own context, critically examined against minimal standards of fairness and public purpose that are widely argued for (even if imperfectly realised) globally. This avoids pure relativism without demanding uniformity.

  **Conclusion:**

  An adequate account of corruption is one that identifies the **misuse of formally entrusted power (public or private) for ends that violate the core purpose and duties of that role, regardless of whether the beneficiary is the individual officeholder or another party, and irrespective of the local acceptance of the practice if it breaches this formal trust.** This core must then be applied with contextual sensitivity to distinguish it from legal patronage, gift-exchange, and other practices, while acknowledging the tensions inherent in defining the "principal" and condemning normalised abuse. The definition you inherited fails because it misses the core betrayal element (focusing only on public/personal) and ignores the crucial question: "Entrusted by whom, for what purpose, and betrayed how?"
