prompt: |-
  Ok this is a weird one but hear me out. I'm in my second year of a cog sci / philosophy of mind joint thing, and I also started doing open mics at the bar near campus, and the two hobbies have started bleeding into each other in a way that is definately making me annoying at parties. I'm trying to write a bit about Dennett's multiple drafts model versus the Cartesian theater — the theater being the picture where everything going on in your head gets shown on one screen to one little audience, and the multiple drafts picture being the one where there's no screen, no audience, no single moment where it all comes together, just a bunch of content getting revised and competing for influence, with something counting as conscious roughly the way something counts as famous, i.e. by being the draft that wins, gets repeated, and shapes what happens next.

  The argument I keep having is with my friend Maya, and it's about why a joke lands. She says there has to be a moment where you get it — you hear it, the penny drops, you laugh. I said fine, but that's just you smuggling a theater back in, and in the drafts picture the penny drops at different times for different drafts, or doesn't really drop anywhere, it just eventually becomes the version of you that laughed. So what I want from you: write me a joke, a short bit, like three to six lines I could actually say into a mic, where the punchline only really works if you're holding the multiple drafts picture in your head, and where it would be a different, and I think worse, joke if the Cartesian theater were true. Bonus points if you can make it turn on the Orwellian versus Stalinesque thing my prof went on about — as I understood it, Orwellian means the revision happens after the fact so you're left remembering that you laughed when you didn't, and Stalinesque means the show is staged so the doctored version is what was on all along — because Maya swears you can't tell those two apart from the inside, and I think a joke is exactly the kind of thing that could tell them apart. We also started calling the supposed single moment where the joke officially lands the gong, so maybe there's something in a gong that only rings once, in a room that isn't there. Please don't do the homunculus in a tiny theater seat thing, I've heard it, it's the knock-knock joke of philosophy of mind, and don't tell me to go read anything. After the joke, give me two or three sentences on which exact bit of the theory the punchline is turning on, so I have something to say back to Maya.
