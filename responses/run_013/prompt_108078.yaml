prompt: |-
  My old swim coach has this whole thing about who "really knows how" to do something, and I've spent years trying to reverse-engineer the rule she's actually running. Her calls: a kid who swims beautifully but can't put what he's doing into words — knows how. A kid who can recite every drill and breathing pattern perfectly but sinks like a stone — dosen't know how. A kid who can only do the stroke while I'm counting strokes out loud beside her — doesn't, she says it's "borrowed." A kid who swims fine and can also explain himself — knows how. Now a new kid turns up who swims the stroke perfectly on his own, but only by silently reciting a memorized checklist in his head, and the second you ask him to change anything — go slower, breathe on the other side — he falls apart. My gut says she'll say he doesn't know how, but I can't tell if that's her rule or just mine. Will she say he knows how? And what rule is she actually running — what other rules fit all her past calls just as well, what does each one predict for this kid, and which kid would I have to bring her to actually tell those rules apart?

  Lead with the bottom line in one line, then give me a table with these columns: rule (short name) | what the rule says, in one sentence | does it fit every one of her past calls, and if not which call breaks it | what it predicts for the new kid | the case that would best tell it apart from the other rules.
reasoning: |-
  Hmm, the user has described their old swim coach's philosophy about "knowing how" to swim, with specific examples of kids who do or don't meet the coach's standard. Now there's a new kid who swims perfectly but relies on an internal checklist and can't adapt. The user wants to know if the coach would say this kid "knows how," what rule the coach is actually using, and how to test different possible rules.

  I need to analyze the coach's past judgments to reverse-engineer her rule. Let me look at the cases she's decided:

  1. Swims beautifully but can't explain → knows how
  2. Explains perfectly but can't swim → doesn't know how
  3. Only swims while coach counts aloud → doesn't know how (she calls it "borrowed")
  4. Swims well and explains → knows how

  The new kid: swims perfectly alone with internal checklist, but crumbles if asked to change anything.

  My initial thought is that the coach values internalized skill over conscious processing. The "borrowed" case suggests she dislikes external dependencies. The kid who can't explain but swims well is fine, showing that verbalization isn't necessary. But the new kid's internal checklist might still be too deliberate, not truly automatic.

  I'll consider several possible rules that could fit the past calls:

  - **Automaticity Rule**: Focuses on whether the skill is unconscious and automatic. Past cases fit: beautiful swimming is automatic even without explanation; the explainer can't perform automatically; borrowed counting is external crutch; full competence is automatic. New kid's internal checklist isn't automatic – it's effortful and inflexible.

  - **Robustness Rule**: Emphasizes adaptability to changes. Past cases: the explainer isn't robust (can't swim at all); borrowed kid isn't robust (depends on counting); others are robust. New kid fails at adaptability, so doesn't know how.

  - **Integrated Performance Rule**: Requires both doing and some awareness, but not necessarily explaining. Past cases: beautiful swimmer has awareness in action; explainer lacks performance; borrowed kid lacks independence; competent kid has both. New kid might have awareness but it's fragmented, not integrated.

  - **No Conscious Crutches Rule**: Forbids any conscious supports, internal or external. Past cases: borrowed counting is external crutch → fails; new kid's internal checklist is an internal crutch → should fail. Explainer has verbal knowledge but no performance, which also fails under this rule.

  Now, I need to figure out which rule the coach is likely using. All rules fit the past cases, so I have to predict for the new kid and propose a test case to distinguish them.

  For the new kid:
  - Automaticity Rule predicts "doesn't know how" because the checklist isn't automatic.
  - Robustness Rule predicts "doesn't know how" because he can't adapt.
  - Integrated Performance might predict "doesn't know how" if the checklist prevents fluid integration.
  - No Conscious Crutches clearly predicts "doesn't know how" since the checklist is a crutch.

  The user's gut says the coach would say "doesn't know how," which matches most rules except possibly Integrated Performance if we interpret it loosely.

  To distinguish the rules, I need a hypothetical kid:
  - **Test Case**: A kid who swims perfectly and adapts to changes, but only by using an internal checklist. No external help, and they can adjust the checklist for new situations.
    - Under Automaticity Rule, this kid still doesn't know how because it's not unconscious.
    - Robustness Rule says they know how because they adapt.
    - Integrated Performance might say they know how if the checklist leads to fluid performance.
    - No Conscious Crutches says they don't know how because of the internal crutch.

  This test case would separate Robustness from the others, as it's the only one that accepts adaptable performance even with conscious effort.

  For the bottom line: I think the coach will say the new kid doesn't know how, and her rule is most likely about automaticity or no conscious crutches, with robustness being a contender. The best test is the adaptable-with-checklist kid to see if adaptability alone satisfies her.

  I'll structure the response with a clear bottom line first, then a table comparing the rules as requested.
answer: |-
  ### Bottom Line
  Your coach will say the new kid **does not know how**, and her core rule is most likely **automaticity** (unconscious competence), though **robustness** (adaptability under change) or **no conscious crutches** also fit—distinguished best by testing a kid who swims adaptably *with* an internal checklist.

  ### Rule Analysis Table
  Here's a breakdown of possible rules fitting the coach's past calls, their predictions for the new kid, and a key test case to differentiate them. All rules fit the past cases perfectly—no conflicts—so predictions hinge on the new kid's inflexibility.

  | Rule (Short Name) | What the Rule Says (One Sentence) | Fits Past Calls? (If Not, Breaks Which) | Predicts for New Kid | Best Test Case to Tell Rules Apart |
  |-------------------|-----------------------------------|----------------------------------------|----------------------|-----------------------------------|
  | Automaticity | "Knows how" only if the skill is executed unconsciously/automatically, without deliberate mental effort. | Yes (fits all: beautiful swimmer is automatic; explainer fails; borrowed fails; competent is automatic). | **Doesn't know how** (relies on conscious checklist, not automatic). | A kid who swims *perfectly and adaptably* (e.g., changes speed/side) **using a silent checklist**—Automaticity says "no" (conscious effort), but Robustness says "yes" (adaptable). |
  | Robustness | "Knows how" only if performance holds up under varied/changed conditions (e.g., speed, instructions). | Yes (fits all: beautiful swimmer is robust; explainer isn't; borrowed isn't; competent is). | **Doesn't know how** (fails when asked to change). | Same test case as above—Robustness accepts adaptable checklist users; others reject. |
  | Integrated Performance | "Knows how" only if physical execution and cognitive understanding are seamlessly integrated (no separation of "doing" and "thinking"). | Yes (fits all: beautiful swimmer integrates action; explainer separates; borrowed separates; competent integrates). | **Doesn't know how** (checklist creates separation—"doing" depends on "thinking"). | A kid who swims well *while explaining aloud* but **cannot adapt**—Integrated Performance may say "knows" (unified in the moment), Robustness says "no" (inflexible). |
  | No Conscious Crutches | "Knows how" only if no conscious supports (external *or* internal) are needed for reliable performance. | Yes (fits all: beautiful swimmer needs no crutch; explainer uses verbal crutch; borrowed uses external crutch; competent needs none). | **Doesn't know how** (internal checklist is a crutch). | A kid who swims **automatically *only after* reciting a checklist beforehand** (no crutch *during* performance)—No Conscious Crutches says "knows" (crutch is prep, not performance), Automaticity says "no" (if not yet unconscious). |

  ### Key Insights
  - **Why she'll reject the new kid?** All rules predict "doesn't know how" because he lacks automaticity, robustness, integration, and uses a conscious crutch. Your gut aligns with her likely rule (automaticity or no crutches).
  - **Rules are indistinguishable so far?** Yes—all 4 fit the past calls perfectly. The "best test case" column shows how to force a split:
    - Bring a kid who **swims adaptably (e.g., changes speed/side) using *only* a silent checklist** (no external help). 
      - If coach says **knows how** → Rule is *Robustness* (adaptability matters most). 
      - If coach says **doesn't know** → Rule is *Automaticity*, *Integrated Performance*, or *No Conscious Crutches* (conscious effort invalidates it).
  - **Her likely true rule?** *Automaticity* is strongest (it explains "borrowed" as lacking internalization and the new kid's checklist as non-automatic), but *No Conscious Crutches* is equally plausible. Test with the adaptable-checklist kid to confirm.
