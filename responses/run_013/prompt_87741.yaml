prompt: |-
  Hey — I host a monthly discussion night at my place, ~12 regulars, mostly software people who spent their twenties marinating in LessWrong and SSC, plus two actual phil grad students who keep us honest. 90 minutes, couches, one whiteboard, cheap snacks. Next month I want to do self-locating belief — the Sleeping Beauty thing — but I'm so bored of the version where everyone already knows which side they're on and just barks thirder/halfer at each other for an hour. I want an activity that makes them feel in their gut why the problem is hard, before anyone says the words "self-locating" or names a position.

  So design me a runnable activity for the group. Rules, materials (cheap, no real money), a payoff scheme, a 90-minute timeline, and a debrief that maps what actually happened back onto the structure of the problem — the credence question vs the betting question, why those can come apart, and what self-sampling vs self-indication intuitions are quietly doing underneath.

  Two things I want baked in, otherwise I think it's just the Wikipedia setup with extra chairs:
  1) a betting/trading phase where people have to actually commit something at odds they pick themselves, so the room can see for itself whether their stated credences and their bets line up;
  2) a variant where a second independent coin decides whether the whole thing happens at all — or where the number of awakenings shifts — so they discover how much their answer wobbles when you bolt on a detail that feels like it shouldn't matter.

  Tell me what will predictably go wrong the first time (I can already guess someone derails it by arguing about what "you" even means, and that we'll lose 20 min to it). And be straight with me about which part of the problem the activity can't reproduce, the part I'll just have to explain from the front. Don't send me reading lists, I've probaly read it all — I want the game.
reasoning: |-
  We are going to design an activity that captures the core of the Sleeping Beauty problem without immediately revealing the connection. The goal is to have participants experience the confusion and then see how their betting behavior might differ from their stated beliefs.

  Key elements to capture:
  1. **Self-locating uncertainty**: Participants should not know "where" or "when" they are in the experiment.
  2. **Multiple awakenings/interviews**: In the classic problem, Sleeping Beauty is woken up multiple times depending on a coin flip.
  3. **Betting phase**: We want participants to state credences and then actually bet at odds they choose, to see if their betting behavior aligns.
  4. **Variant with a second coin**: We introduce a second coin that determines whether the experiment runs at all, to see if that changes their answers.

  **Activity Name**: The Double-Coin Experiment

  **Materials**:
  - Two coins (one for the main experiment, one for the variant) - let's call them Coin A and Coin B.
  - Index cards (or small pieces of paper) for recording credences and for betting.
  - A whiteboard for recording group results and for explaining phases.
  - Pens for everyone.
  - A hat or container for collecting bets.
  - Cheap snacks (as per your usual).

  **Participants**: 12 people. We'll assign them roles: 10 will be "subjects" (who experience the experiment) and 2 will be "experimenters" (who run the coins and record results). The two philosophy grad students might be good for the experimenter roles, but they can also be subjects if you prefer.

  **Setup**:
  - The experimenters will flip the coins and manage the awakening/interview process.
  - The subjects will go through the experiment and be interviewed.

  **Rules of the Experiment**:

  **Phase 1: The Basic Experiment (without the second coin)**
  1. **Coin Flip (Coin A)**: Experimenter flips a fair coin (Coin A). If heads, each subject will be "awakened" and interviewed once. If tails, each subject will be "awakened" and interviewed twice. However, to simulate the memory erasure, we will do the following:
     - After the coin flip, the experimenter announces the result to everyone (so they know the setup) but then the subjects will be interviewed in separate rooms or at separate times so that they don't know which awakening they are in (if tails). 
     - But note: we don't have separate rooms? So we need a way to simulate the memory erasure without actually erasing memory. Instead, we can have the interviews happen in a way that the subject doesn't know if it's the first or second interview in the tails case. However, since we are all in one room, we have to be clever.

  **Alternative Setup for Memory Erasure Simulation**:
  We cannot actually erase memory, so we will have to use a method that doesn't require it. Instead, we will run the experiment in two rounds, but in each round the subject doesn't know if it's the only round or one of two.

  But note: the problem is that in the tails case, each subject is interviewed twice. How to do this without giving away the number of interviews? We can do:

  - Round 1: All subjects are interviewed. They are told that if the coin was tails, they will be interviewed again in Round 2. But then they would know that if they are being interviewed a second time, the coin was tails. That breaks the memory erasure.

  So instead, we can do:

  - Each subject is interviewed in a private setting (we can use breakout rooms or just have them write answers on index cards without talking to others). But we have one whiteboard and one room. So we might have to do:

    Step 1: Flip Coin A. Announce the result to everyone? But if we announce, then they know. We don't want them to know the coin result until the end. So we can have the experimenters flip the coin in secret and not reveal it until the end.

    Step 2: If heads, each subject will be interviewed once. If tails, each subject will be interviewed twice. But how to do two interviews without the subject knowing it's the second? We can have the two interviews be identical and separated by a break, but the subject might remember the first interview.

  This is a challenge. Let's reframe:

  We can have each subject go through a series of "trial" events. But without actual memory erasure, we might have to rely on the subjects not knowing whether they are in the first or second awakening. However, in a group setting, if we do two interviews for everyone in the tails case, they will know when we do the second one that it's the second. So we need to obscure the timing.

  Alternative idea: We don't actually run multiple interviews for the same subject. Instead, we use the group to simulate the multiple awakenings. We can do:

  - If the coin is heads, we will randomly select and interview one subject (representing one awakening).
  - If the coin is tails, we will randomly select and interview two different subjects (each representing one awakening).

  But note: in the classic problem, it's the same person awakened twice. Here, we are using different people to represent the awakenings. This changes the problem because now each subject only experiences one interview, but the group as a whole has either one interview (heads) or two (tails). However, we want each subject to experience the uncertainty: "Am I in the heads world (where there is only one interview) or in the tails world (where there are two interviews)?".

  But if we do it this way, then when a subject is interviewed, they know that if the coin was tails, there is another interview happening with someone else. But they don't know if they are in the heads case (and thus the only interview) or the tails case (and there's another interview). This is analogous to the self-locating uncertainty: "Am I the only awakening, or is there another?"

  So let's design the activity using this group approach.

  **Revised Activity Rules**:

  **Phase 0: Setup**
  - The group is told that we are going to run an experiment involving two coins (but we start without the second coin for the basic round). 
  - The experimenters flip Coin A (a fair coin) in secret (so the subjects don't know the result). They record the result (say on a piece of paper and put it in an envelope).
  - If Coin A is heads: the experimenters will randomly select one subject for an interview.
  - If Coin A is tails: the experimenters will randomly select two subjects (without replacement) for an interview (each subject interviewed separately, one after the other).

  **Phase 1: Interview**
  - Each selected subject (whether in heads or tails) is asked the same two questions:
    1. **Credence Question**: "What is your credence (as a probability between 0 and 1) that Coin A landed heads? Write it down on your card."
    2. **Betting Question**: "You are offered a bet that pays $1 if Coin A is heads, and $0 if tails. At what odds would you be willing to take this bet? Specifically, state the smallest amount of money that you would require to be paid if you win (i.e., if heads) such that you would accept the bet. Note: you will have to pay $1 to place the bet if you lose (if tails)."

  But note: We don't want to use real money. So we will use a point system. Let's say each subject starts with 10 points.

  **Betting Explanation**:
  - We'll explain: "You can choose to buy a bet that pays 10 points if heads and 0 if tails. But you have to pay a price to buy the bet. The price is not fixed; you get to state the maximum price you would be willing to pay for this bet. Then, we will compare your stated maximum price to a randomly generated market price (we can use a die roll to generate a price between 0 and 10, in increments of 1). If your stated maximum price is at least as high as the market price, then you buy the bet at the market price. Otherwise, you don't buy the bet."

  Alternatively, we can use the BDM mechanism (Becker-DeGroot-Marschak) for eliciting willingness to pay. But we can simplify:

  - Each subject states a number P (between 0 and 10) which is the maximum they would pay for the bet (which pays 10 if heads, 0 if tails).
  - Then, we draw a random number Q from 0 to 10 (using a 10-sided die or by drawing from a hat with numbers 0 to 10). 
  - If P >= Q, then the subject buys the bet at price Q. So their payoff is:
     - If heads: 10 - Q (because they get 10 and paid Q)
     - If tails: -Q (because they paid Q and get nothing)
  - If P < Q, they don't buy the bet and get 0.

  But note: we want to see if they are consistent with their credence. A risk-neutral agent with credence p for heads should be willing to pay up to 10p for the bet. So if they state P=10p, then they are consistent.

  However, we are going to run this for all selected subjects. And we will do it for both the basic experiment and the variant.

  **Phase 2: The Variant (with Coin B)**
  Now we introduce a second coin (Coin B). The experimenters flip Coin B first. If Coin B is tails, the entire experiment is called off (no interviews, no nothing). If Coin B is heads, then we proceed to flip Coin A and run the interviews as above.

  But note: we want to see how this affects their credence and betting.

  So in the variant:
  - Flip Coin B (in secret). If tails, stop: no one is interviewed. If heads, then flip Coin A and proceed as in Phase 1.

  But we still need to interview subjects. So we run the variant in a separate round.

  **Timeline (90 minutes total)**:

  1. **Introduction (5 min)**: Explain that we are going to run two experiments (rounds) about beliefs under uncertainty. We'll use points that can be redeemed for snacks (or just for fun). We'll have two roles: experimenters and subjects. Assign two experimenters (or you can be one). The rest are subjects.

  2. **Round 1: Basic Experiment (30 min)**
     - Experimenters flip Coin A in secret (so subjects don't see). They record the result and put it in an envelope.
     - If heads: randomly select one subject (by drawing from a hat with all 10 subjects' names). That subject is interviewed.
     - If tails: randomly select two subjects (without replacement) for interviews.
     - Each selected subject is taken aside (or given an index card) to answer:
          - Credence: "What is your probability that Coin A was heads? (a number between 0 and 1)"
          - Betting: "State the maximum price (in points, between 0 and 10) you would pay for a bet that pays 10 points if heads, 0 if tails."
     - Collect the index cards.

  3. **Round 2: Variant Experiment (30 min)**
     - Now we introduce Coin B. Experimenters flip Coin B in secret. If tails, the experiment is called off: no interviews. If heads, then flip Coin A and proceed exactly as in Round 1 (selecting one or two subjects based on Coin A).
     - But note: if Coin B is tails, we don't do anything. We just reveal at the end that the experiment didn't run. However, we want to collect beliefs even in the case that the experiment runs. So if Coin B is heads, we run the interviews exactly as in Round 1.

  4. **Reveal and Calculate Payoffs (10 min)**
     - Now, reveal the results of the coins for both rounds.
     - For Round 1: reveal Coin A. Then, for each subject who was interviewed, we calculate their betting payoff using the BDM mechanism. We need to generate a random Q for each subject? Or one Q for the whole round? Let's do one Q for the whole round to save time. So we roll a 10-sided die (or draw a number from 0 to 10) for Round 1 and another for Round 2 (if it ran).
     - For Round 2: if Coin B was tails, then no interviews happened, so no payoffs. If Coin B was heads, reveal Coin A and then calculate payoffs for the interviewed subjects using the random Q for Round 2.
     - Note: subjects who were not interviewed in a round get 0 points for that round (they didn't participate).

  5. **Debrief (45 min)**
     - First, ask the subjects who were interviewed in Round 1: "What was your credence for heads?" and "What was your maximum price for the bet?" Record these on the whiteboard. Then, note the actual coin result and the random Q. Calculate and show the payoffs.
     - Then, do the same for Round 2 (if it ran).
     - Now, reveal the structure of the problem and map it to Sleeping Beauty:
          - In Round 1, when a subject is interviewed, they know that they were selected. In the heads case, only one subject was selected. In the tails case, two were selected. So the subject should think: "What is the probability that the coin was heads, given that I am being interviewed?"
          - This is analogous to Sleeping Beauty: when woken up, what is the probability that the coin was heads?
          - The credences they stated: we expect to see a split between 1/2 and 1/3.
     - Then, look at the betting behavior. We expect that even those who state a credence of 1/3 might not bet accordingly (if they are risk averse) but ideally we want to see if they are consistent. Also, note that the betting question is about the actual coin flip, which happens only once. But in the tails case, there are two bets (from the two subjects) on the same coin flip. This might lead to a difference: if the coin is tails, the experimenter has to pay two bets (if both are placed). But in our setup, the bets are independent and the experimenter (or the house) is outside the system. We are not limited on points.
     - Then, for Round 2 (the variant): we added a coin that determines if the experiment runs. This is like the "non-existence" possibility. In the variant, when a subject is interviewed, they know that the experiment only runs if Coin B was heads. So they are in an interview only if Coin B was heads. How does this affect their credence about Coin A?
          - The structure: Coin B (which is fair) must be heads (50%) for the experiment to run. Then, within the experiment, Coin A is flipped. So the prior probability that the experiment runs and the coin is heads is 25%. But conditional on being interviewed, how does that update?
          - We can show that the probability of heads given that you are interviewed in Round 2 should be the same as in Round 1? Or does it change? This is to show that adding a layer of "are we even running the experiment" shouldn't change the credence about the coin once you are awake, but it might shift some people's intuitions.

  6. **Discussion Points for Debrief**:
     - The credence question: why might someone say 1/2? (Because the coin is fair.) Why might someone say 1/3? (Because there are three interviews in total: one in heads and two in tails, and you are equally likely to be in any interview.)
     - The betting question: if you are a halfer (credence 1/2), you should be willing to pay up to 5 points for the bet. If you are a thirder (credence 1/3), you should be willing to pay up to about 3.33 points. But look at the betting responses: did people state a maximum price consistent with their credence? If not, why? (Risk aversion? Or did they not understand the bet?)
     - The variant: in Round 2, if you are interviewed, you know that Coin B was heads. Now, what is the probability of Coin A being heads? Halfers and thirders might still stick to their guns. But note: the probability that the experiment runs and that Coin A is heads is 1/4. The probability that the experiment runs and Coin A is tails is 1/4 (and then there are two interviews). So if you are interviewed, the probability that this interview is happening when the coin is heads is (1/4) / (1/4 + 1/4*2) = (1/4) / (3/4) = 1/3. So the thirder answer remains 1/3. The halfer answer might be challenged because now there is a 50% chance the experiment didn't run, but conditional on being in an interview, the halfer might still say 1/2. This can lead to a discussion about self-sampling and self-indication.

  **What will go wrong?**
  - **Derail by definition of "you"**: Someone might argue that the group setup isn't the same as one person being woken twice. You can acknowledge that it's a model, and the point is to simulate the information state: when you are interviewed, you don't know if you are the only interview or one of two. The group setup captures that by having the subject not know if they are the only one interviewed or one of two.
  - **Time**: The random selection and interviews might take longer than expected. We have 10 subjects, but in Round 1, we only interview 1 or 2. In Round 2, if Coin B is heads, we interview 1 or 2 again. So it's manageable. But if we do private interviews, we might have to take them aside. Alternatively, we can have them write their answers on cards without talking. We can do it in the same room if we ask everyone to be quiet and not reveal their answers until the end.
  - **Understanding the betting mechanism**: Some might not understand the BDM mechanism. We have to explain it clearly. We can do a practice round with a simple coin flip that everyone sees.

  **What the Activity Can't Reproduce**:
  - The original problem has the same person being woken twice and having memory erased. In our setup, we use different people to represent the different awakenings. This might feel different because the awakenings are not linked to the same person. We are relying on the subject not knowing if there is another interview happening. But in the original, Sleeping Beauty knows that if it's tails, she will be woken again. In our setup, the subject doesn't have that prior knowledge? Actually, we tell them the rules: "if tails, we will interview two subjects". So they know that in the tails case, there are two interviews. And when they are interviewed, they don't know if they are the only one or one of two. That's the same information state. However, the personal identity aspect is lost. We are not having the same person experience two awakenings. But for the purpose of the probability assignment, the information state is the same: "I am in an interview. There might be one or two interviews, depending on the coin."

  You'll have to explain that the activity is modeling the information state, not the personal identity. The key is that the subject doesn't know if they are in the world with one interview or two, and that's what matters for the self-locating belief.

  **Revised Timeline with Adjusted Times**:

  - 0-5 min: Introduction and explanation of the basic experiment and the betting mechanism. Do a practice bet with a visible coin flip to demonstrate BDM.
  - 5-15 min: Round 1 (Basic). Flip Coin A (secretly). Select subjects (if heads: 1, if tails: 2). Each selected subject writes their credence and betting price on a card. (Others wait.)
  - 15-25 min: Round 2 (Variant). Flip Coin B. If tails, announce that the experiment is not run. If heads, then flip Coin A and select subjects as in Round 1. (If run, collect cards.)
  - 25-35 min: Reveal the coin flips for both rounds. For each subject who was interviewed, we do the BDM payoff: we draw a random Q for Round 1 (if they were in it) and a random Q for Round 2 (if they were in it). Calculate their points. (We can do this quickly on the whiteboard.)
  - 35-80 min: Debrief and discussion. Start by asking the interviewed subjects what they wrote. Then map to the Sleeping Beauty problem. Discuss the two positions and the variant. Then open for general discussion.

  This leaves 10 minutes buffer.

  **Final Notes**:
  - You might want to run multiple trials to get more data, but with 90 minutes, one round of each is enough.
  - The two philosophy grad students can help moderate the discussion.

  **Materials Checklist**:
  - Two fair coins (or use a coin flip app if coins are not available).
  - Index cards (at least 20) and pens.
  - A hat for drawing names (with all 10 subjects' names).
  - A way to generate random numbers from 0 to 10 (a 10-sided die, or a bag with numbers 0-10, or a random number generator on a phone).
  - Whiteboard markers.
  - Envelopes to seal the coin results.

  Good luck! This should create the visceral experience and set up a rich discussion.
answer: |-
  Here’s a runnable 90-minute activity designed to make your group viscerally experience the Sleeping Beauty paradox without naming it upfront. It focuses on self-locating uncertainty, separates credence from betting, and includes the variant with a "second coin" to destabilize intuitions. The setup uses cheap materials (index cards, pens, coins, a whiteboard) and avoids real money by using points redeemable for snacks.

  ---

  ### **Activity: The Coin-Flip Interview**
  **Core Structure**: Participants are "interviewees" in a simulated experiment where a coin flip determines how many people are interviewed. They face uncertainty about whether their interview is the only one (heads) or one of two (tails), mirroring Sleeping Beauty’s awakenings. Crucially, the activity has two phases:  
  - **Phase 1**: Baseline (like classic Sleeping Beauty).  
  - **Phase 2**: Variant with a "second coin" that cancels the experiment 50% of the time.  

  **Materials Needed**:  
  - 2 coins (Coin A and Coin B).  
  - Index cards (3 per participant).  
  - Pens (1 per participant).  
  - Whiteboard (to track rules/results).  
  - A hat or bowl for drawing cards.  
  - A 6-sided die (for the betting mechanism).  
  - Timer.  

  **Participants**:  
  - 12 people: 10 "subjects" (who experience the interview), 1 "experimenter" (you), 1 "dealer" (handles coins/betting). Assign roles upfront.  

  **Point System**:  
  - Each subject starts with 10 points. Points convert to snacks (e.g., 10 points = extra snack). Bets cost points, and payouts are in points.  

  ---

  ### **Rules and Flow (90-Minute Timeline)**  
  **Total Time**: 90 minutes (stick to timings to avoid derailment).  

  #### **Step 1: Setup (5 min)**  
  - **Explain the experiment** without revealing the paradox:  
    > *"We’re simulating a study on belief under uncertainty. Coin A will be flipped. If heads, only ONE person will be interviewed. If tails, TWO people will be interviewed separately. During the interview, you’ll state your belief about the coin and place a bet. Your goal is to earn points for snacks."*  
  - **Assign roles**: 10 subjects, 1 dealer (flips coins), you as experimenter/facilitator.  
  - **Hand out materials**: Each subject gets 3 index cards (labeled CARD 1, CARD 2, CARD 3) and a pen.  

  #### **Step 2: Phase 1 – Baseline Experiment (25 min)**  
  - **Dealer flips Coin A in secret** (e.g., behind a book). Subjects *do not* see the result.  
  - **Conduct interviews based on Coin A**:  
    - *If heads*: Experimenter randomly selects **1 subject** (draw names from a hat).  
    - *If tails*: Experimenter randomly selects **2 subjects** (one at a time).  
  - **Interview procedure** (each selected subject privately completes CARD 1):  
    1. **Credence Question**:  
       > *"What’s your probability that Coin A was heads? Write a number between 0% and 100%."*  
    2. **Betting Question**:  
       > *"You can bet $1 (in points) that Coin A was heads. If you win, you gain $2 (net +1 point); if you lose, you lose $1. What’s the LOWEST probability of heads at which you’d take this bet? State a %."*  
       *(This converts credence to betting odds: e.g., 33% = bet if offered 2:1 odds)*.  
    3. **Record responses**: Subjects write answers on CARD 1 without sharing. Collect cards.  
  - **Key**: Subjects know the rules but not who else was selected or the coin result. Only the interviewed subjects participate.  

  #### **Step 3: Phase 2 – Variant with "Second Coin" (25 min)**  
  - **Introduce the twist**:  
    > *"Now, Coin B will be flipped first. If tails, the entire experiment is CANCELED—no interviews. If heads, we proceed to flip Coin A and run interviews as before."*  
  - **Dealer flips Coin B in secret**, then Coin A *only if* Coin B is heads.  
  - **Conduct interviews** (if Coin B is heads):  
    - Same as Phase 1 (1 subject if Coin A heads, 2 if tails).  
    - Selected subjects complete CARD 2 with the same credence/betting questions.  
  - **If Coin B is tails**: Announce cancellation, no interviews.  
  - **Collect all cards**.  

  #### **Step 4: Betting/Trading Phase (15 min)**  
  - **Reveal bets and force commitment**:  
    - For each interviewed subject (from Phase 1 and 2 if run):  
      1. **Calculate implied bet offer**: Use their betting % to determine if they’d accept a 2:1 payout bet. E.g., if they wrote 40%, they bet only if they believe heads ≥40% likely.  
      2. **Execute bets**: Roll a die to randomize outcomes:  
         - *Heads bet*: If Coin A was heads, they gain +1 point.  
         - *Tails bet*: If Coin A was tails, they lose -1 point.  
      3. **Record payouts** on whiteboard.  
  - **Subjects see misalignments**: E.g., someone with 33% credence refuses the bet but loses a chance to gain points.  

  #### **Step 5: Debrief and Reveal (20 min)**  
  - **Reveal coin results** for Phases 1 and 2. Show payouts.  
  - **Map to Sleeping Beauty**:  
    > *"This was a proxy for the Sleeping Beauty problem. Your interview was an 'awakening.' Coin A = heads (1 awakening) vs. tails (2 awakenings). You had self-locating uncertainty: ‘Am I in the heads world or one awakening in the tails world?’"*  
  - **Key discussion points**:  
    1. **Credence vs. Betting**:  
       - Show how many stated a low credence (e.g., 33%) but refused a bet that *should* be profitable at that credence (e.g., 2:1 odds). Why?  
       - *Link*: Betting forces consistency. Halfers (50%) see no edge; thirders (33%) see +EV bets but may avoid risk.  
    2. **Effect of the "Second Coin" (Coin B)**:  
       - Ask: "Did Coin B change your Phase 2 credence? Why/why not?"  
       - *Link*: Coin B adds a "world where I shouldn’t exist." But conditional on being interviewed, it shouldn’t affect Coin A’s probability—yet it often *feels* like it does (self-indication bias).  
    3. **Self-Sampling vs. Self-Indication**:  
       - *Self-sampling*: "I’m a random awakening → 1/3 of awakenings are heads → P(heads)=1/3."  
       - *Self-indication*: "Heads means fewer awakenings → I’m less likely to exist in heads → P(heads) is higher." (Coin B amplifies this.)  
       - *Debrief insight*: The variant exposes how "am I real?" intuitions warp beliefs.  

  ---

  ### **Predictable Problems and Mitigations**  
  1. **"What does 'you' mean?" derailment**:  
     - Likely within 10 minutes of setup. Someone will ask: "Am I betting on the coin or my role?"  
     - **Mitigation**: Shut it down fast: "‘You’ = the person being interviewed. Bet on Coin A." Move on. Allocate 2 minutes max.  

  2. **Betting confusion**:  
     - Some will misread odds (e.g., think a 50% bet means they win 50% of the time).  
     - **Mitigation**: Use a practice round pre-Phase 1 (e.g., flip a visible coin and demo a bet payout).  

  3. **Variant feels "different"**:  
     - Participants may insist Coin B "obviously" changes P(heads).  
     - **Mitigation**: In debrief, highlight that conditional on being interviewed, Coin B is irrelevant—it’s a red herring that tests intuitions.  

  4. **Group skew**:  
     - With 12 people, loud voices may dominate. Assign a "quiet thinker" to track whiteboard notes.  

  ---

  ### **What the Activity Can’t Capture (Requires Explanation)**  
  - **Memory erasure**: The original problem hinges on Sleeping Beauty forgetting prior awakenings. Here, subjects know the rules but don’t experience amnesia. *Explain*: "We simulated the information state (you don’t know if you’re alone or one of two), not the memory wipe."  
  - **Infinite populations**: Self-sampling assumes a "reference class" of possible awakenings. The activity uses a finite group (10 subjects), which makes probabilities concrete but loses the abstract "perfectly random sampling" ideal. *Explain*: "Real Sleeping Beauty has infinite awakenings; we used a small group for practicality."  

  ---

  ### **Why This Works**  
  - **Gut-level confusion**: The variant (Coin B) and betting phase create tangible tension—e.g., someone with 33% credence *should* bet but often won’t, exposing the credence/betting gap.  
  - **No prep needed**: Rules are intuitive, and coins/index cards keep it low-tech.  
  - **Discussion-ready**: Payoff mismatches and the Coin B twist give you concrete hooks for debriefing.  

  Run this, and your group will *feel* why Sleeping Beauty is thorny—before you even name it. Good luck!
