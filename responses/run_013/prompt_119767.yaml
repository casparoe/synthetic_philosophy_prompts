  Here’s a toast that honors the complexity while centering your niece’s presence, resilience, and the family’s love, respecting all your constraints:

  **(Clink glass gently)**

  "Everyone, if I could have your attention? Thank you. Firstly, happy 21st birthday to [Niece's Name]! It’s a genuine privilege to be standing here for this milestone.

  Now, I’m an actuary. We deal in probabilities, risk assessments, and… well, let’s just say nuance is our comfort zone. But family? Family is rarely about clean probabilities. It’s about love, fierce loyalty, and sometimes, decisions made with hearts wide open even when the spreadsheets might suggest caution.

  Looking at [Niece's Name] today – finishing her philosophy degree, holding court with her brilliant friends, radiating that unique combination of wit and warmth she’s had since she could talk – it’s easy to see an incredible young woman. And she absolutely is. But what I see even more clearly is the result of a family that met her, exactly as she arrived, with zero hesitation and absolute acceptance.

  Her parents, [Sister's Name] and [Brother-in-Law's Name], wanted her fiercely. And when the path to welcoming her held a known, specific kind of uncertainty – not a mystery, but a defined, understood variable – they looked at that uncertainty, they looked at their deep desire for *this* child, *their* child, and they chose *her*. They chose the adventure of *her*, knowing exactly what they were choosing. That’s not a gamble on a maybe; that’s a declaration for a definite person.

  And what a person! [Niece's Name], you have always known your own mind. You have a clarity – sometimes breathtakingly direct! – about who you are and how the world works. You haven’t just navigated your path; you’ve mapped it with your own intellect and spirit. You tackled philosophy, a field built on questioning assumptions, and thrived – which tells us everything we need to know about how you approach life. You meet the world head-on, on your own terms.

  Seeing you with your brother, [Brother's Name], is one of the great joys. The bond you share isn't about comparisons or hypotheticals; it’s real, it’s loud, it’s full of inside jokes and mutual support. He’s your brother, full stop. Just as you are his sister, full stop. You are both entirely, uniquely yourselves, loved wholly for who you are.

  That’s the powerful thing about this family. We don’t trade in hypothetical 'better-off' versions or dwell on paths not taken. We embrace the real, the present, the people right here. We celebrate the choices made with love that brought these specific, wonderful humans into our lives. Your parents chose *you*, [Niece's Name], with clear eyes and full hearts. And every single day since, you’ve shown just how magnificent that choice was.

  So, let’s raise our glasses – not to probabilities or what-ifs – but to the brilliant, real, and utterly fantastic [Niece's Name]! To 21 years of being exactly who you are, and to the incredible journey ahead. Happy Birthday!"

  **Why this works:**

  1.  **Honest about the Risk/Decision:**
      *   "defined, understood variable," "known... uncertainty," "looked at that uncertainty... chose her," "knowing exactly what they were choosing." Acknowledges a deliberate, informed choice involving risk without stating the nature of the risk or condition.
      *   "not a gamble on a maybe; that’s a declaration for a definite person." Explicitly frames it as a choice *for her*, not a blind risk.

  2.  **Centers the Niece & Avoids Pitfalls:**
      *   Focuses entirely on *her* present: her achievements (degree), her character (wit, warmth, clarity, directness), her agency (knowing her own mind, mapping her path, approaching life head-on).
      *   **No Consolation Prize:** "result of a family that met her... with zero hesitation," "magnificent that choice was," "embrace the real... people right here." She is celebrated as the positive outcome, the desired result.
      *   **No Hypotheticals:** Explicitly rejects "hypothetical 'better-off' versions" and "paths not taken." Praises her for who she *is*.
      *   **Brother Handled Correctly:** Their bond is real and present-tense. "He’s your brother, full stop... You are both entirely, uniquely yourselves." Avoids the "meant to be" trap by focusing on their actual relationship and mutual uniqueness *now*.
      *   **Doesn't Speak For Her:** Describes observable traits (clarity, directness, tackling philosophy) without claiming to know *how* she feels about her condition or history.

  3.  **Structure & Logic for Philosophers:**
      *   The actuary framing sets up the logic lens.
      *   Contrasts "clean probabilities" with the messier reality of family love and desire.
      *   Key logical distinction: "not a gamble on a maybe; that’s a declaration for a definite person." This reframes the decision from risk-taking *despite* uncertainty to commitment *to* a known potential outcome (her).
      *   "Embrace the real... people right here" explicitly rejects counterfactuals.
      *   The "warmth" stems directly from the logical consistency of celebrating the actual person chosen, not a sentimental evasion of the choice's nature.

  4.  **Accessible & Warm for Relatives:**
      *   Focuses on love, acceptance, celebration, family bonds, and the niece's positive qualities.
      *   Uses warm, relatable language: "fierce loyalty," "hearts wide open," "radiating wit and warmth," "magnificent choice," "incredible journey."
      *   Humor: Gentle poke at self ("actuary... nuance is our comfort zone"), niece's "breathtakingly direct" clarity.
      *   The underlying logic supports the warmth without needing to be dissected; it feels sincere because it *is* logically consistent.

  5.  **Respects Constraints:**
      *   **No Jargon:** Uses plain language.
      *   **Under 5 Minutes:** Concise phrasing, focused message.
      *   **No Lecture:** The logic is embedded in the narrative of family love and celebration.
      *   **No Resolution:** Ends firmly on celebrating *her* as she is, in the present. The tension of the initial choice isn't "solved"; it's framed as the context for a powerful affirmation.
      *   **No Words in Niece's Mouth:** Focuses on observable facts and family actions.

  **Delivery Tip:** Maintain warm eye contact, especially with your niece and her parents. Your tone should be affectionate, sincere, and slightly proud. The slight humor early on helps set a relaxed tone. This toast trusts the audience – the philosophers will see the careful structure, the relatives will feel the love, and most importantly, your niece will hear her strength and her family's unwavering commitment celebrated.
