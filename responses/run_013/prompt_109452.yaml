prompt: |-
  I'm a novelist, and I've written myself into a decision I can't resolve on the page. A character is offered a wager settled by an endless procedure: a fair coin is tossed until it lands heads, and the amount won or lost is fixed by how long the run lasts, with the stakes rising as the run goes on and flipping sign with each toss. I sat down to decide whether my character should take it, and I found I could tally the possible outcomes in one order and get a plainly attractive wager, tally the same outcomes in a different order and get a plainly ruinous one, with nothing to tell me which order is the right one; if I define the wager's worth as a limit instead, the limit keeps changing depending on how I bracket the terms. This is not the old coin-toss puzzle as I understand it -- there the trouble is that the expected payoff is infinite, whereas here there is no single expected payoff at all, just a family of them that disagree. I suspect this is somewhere in decision theory's treatment of infinite or ill-defined expectations, but I want the specific thing if it has a name: what is it, precisely, how does it differ from the infinite-payoff puzzle and from the arguments that trade on a vanishingly small chance of an astronomically large payoff, and what is actually settled -- if anything -- about how a rational agent ought to choose when the value of an option refuses to be well-defined?
reasoning: |-
  Okay, the user is a novelist who's created a coin-toss wager scenario for their character, and they're stuck because the expected value calculation gives contradictory results depending on how they approach it. They mention that unlike the classic St. Petersburg paradox where the expected value is infinite, here the expected value isn't even well-defined—different groupings of outcomes yield different results. 

  First, I need to parse the wager's mechanics. The coin is tossed until heads appears. The payout starts positive, flips sign with each toss, and the magnitude increases as the sequence goes longer. So for heads on first toss: +1, tails then heads: -2, tails tails heads: +4, and so on. 

  The user says when they try to compute expected value by summing outcomes in order (H: +1, TH: -2, TTH: +4, etc.), the series alternates and sums to infinity in one grouping but to negative infinity in another. They also mention limit approaches changing with bracketing. This screams "conditionally convergent series" to me—the Riemann rearrangement theorem allows such series to be rearranged to sum to any real number or diverge. 

  But why is this different from St. Petersburg? Key distinction: St. Petersburg has a series of positive terms diverging to infinity, while here the alternating signs create conditional convergence. The user intuitively grasps this but wants precise terminology. 

  Their deeper need seems twofold: (1) understanding the mathematical phenomenon to name it accurately in their narrative, and (2) resolving how a rational character should act given this ambiguity. The latter touches on decision theory's unresolved debates—they might want literary inspiration from real philosophical divides (e.g., Savage's bounded rationality vs. Pascal mugging arguments). 

  Notable that they dismiss "vanishing small chance / astronomic payoff" arguments—they know those are different. Their case is fundamentally about indeterminacy, not magnitude. 

  For terminology, "conditionally convergent expected value" is the core concept. But to sound less textbook, I could call it "expectation fragility" or "rearrangement-dependence." Should emphasize that no canonical expected value exists here, unlike divergent cases. 

  On decision theory: must clarify that rationality doesn't prescribe a single choice. Options include rejecting ill-defined gambles (Savage), using tail-truncated models (Borel), or adopting non-linear utility (but that dodges rather than solves). The character's risk psychology could drive the plot—e.g., someone thrill-seeking might ignore tail risks while a cautious person refuses. 

  Might also note that in physics, similar infinities arise (renormalization), but that's probably overkill. Stick to decision theory unless they hint at sci-fi. 

  ...Wait, they're a novelist. The open-endedness might be a feature. Could suggest letting the character's personality resolve the ambiguity—the math's indeterminacy mirrors life's unquantifiable choices. That could be their thematic hook.
answer: |-
  This is a fascinating and profound dilemma you've constructed—it ventures beyond the classic St. Petersburg Paradox into the realm of **conditional convergence** and the **indeterminacy of expected utility for rearrangable series**. Here's a breakdown of what's happening, its name(s), how it differs from related puzzles, and what decision theory says:

  ### 1. **The Core Mathematical Phenomenon: Conditional Convergence**
  Your wager's expected value (if it existed) would be given by an infinite series:
  `E = Σ (Probability of Outcome_n) * (Payoff of Outcome_n)`

  For your wager:
  - `P(H) = 1/2`, Payoff = +1 → `(1/2)*1 = +1/2`
  - `P(TH) = 1/4`, Payoff = -2 → `(1/4)*(-2) = -1/2`
  - `P(TTH) = 1/8`, Payoff = +4 → `(1/8)*4 = +1/2`
  - `P(TTTH) = 1/16`, Payoff = -8 → `(1/16)*(-8) = -1/2`
  - ...and so on, with terms `±1/2` forever.

  The series is: `+1/2 - 1/2 + 1/2 - 1/2 + 1/2 - 1/2 + ...`

  **This series is conditionally convergent but not absolutely convergent:**
  - **Absolute Convergence Fails:** The sum of absolute values is `Σ |±1/2| = 1/2 + 1/2 + 1/2 + ... = ∞`. This immediately signals trouble—standard probability theory relies on absolute convergence for well-defined expectations.
  - **Conditional Convergence:** The series converges *only* if you sum the terms in the specific order of the outcomes (H, TH, TTH, TTTH, ...). In this order, it sums to 0: `(1/2 - 1/2) + (1/2 - 1/2) + ... = 0 + 0 + ... = 0`.
  - **Rearrangement Paradox (Riemann Series Theorem):** This theorem states that a conditionally convergent series can be rearranged to sum to *any real number* (or even diverge to ±∞). Rearranging the terms changes the sum:
    - Group as `+1/2 + 1/2 + 1/2 + ...` (ignoring negatives) → Sums to **+∞**.
    - Group as `-1/2 - 1/2 - 1/2 - ...` (ignoring positives) → Sums to **-∞**.
    - Group as `(+1/2 - 1/2) + (+1/2 - 1/2) + ...` → Sums to **0**.
    - Group as `+1/2 + (+1/2 - 1/2) + (+1/2 - 1/2) + ...` → Sums to **+1/2**.
    - **No "True" Sum:** The value depends entirely on the order of summation, which has no inherent justification in this context.

  ### 2. **What This Is Called**
  - **The Problem of Conditionally Convergent Expectations:** The core issue.
  - **The Riemann Rearrangement Paradox for Expected Utility:** Highlights the sensitivity to ordering.
  - **Ill-Posed or Indeterminate Expectation:** Emphasizes the lack of a unique value.
  - **No Well-Defined Finite Expectation:** Contrasts with the St. Petersburg Paradox (which has a well-defined, albeit infinite, expectation).

  ### 3. **How It Differs From Other Puzzles**
  - **St. Petersburg Paradox:**
    - Payoffs are *all positive* and increasing: `+2, +4, +8, +16, ...`
    - Series: `(1/2)*2 + (1/4)*4 + (1/8)*8 + ... = 1 + 1 + 1 + ... = ∞`
    - **Issue:** Well-defined but *infinite* expectation. Debate centers on whether this is "worth" an infinite entry fee or how to handle unbounded utility.
  - **Pascal's Wager / Astoundingly Large Payoffs:**
    - Involves a *vanishingly small probability* of an *astronomically large payoff*.
    - **Issue:** If utility is unbounded, expected utility might be infinite/undefined despite intuitive aversion. Focuses on utility functions and tail probabilities.
  - **Your Wager:**
    - Payoffs *alternate in sign* and grow exponentially.
    - **Issue:** No single expectation exists due to *rearrangement dependence*. The core problem isn't magnitude but *indeterminacy caused by conditional convergence*.

  ### 4. **What Decision Theory Says About Rational Choice**
  **There is no universally agreed-upon rational choice.** This exposes a fundamental limitation in standard expected utility theory (EUT) when faced with indeterminacy. Here are the main perspectives:

  - **Rejection of Ill-Posed Gambles (Savage, 1954):**
    Rational agents should refuse gambles with undefined expectations. Your character *should not take the bet*, as it lacks a coherent valuation. This is the most common modern stance.

  - **Finitistic Approaches (Borel, Kolmogorov):**
    Truncate the game: "Stop after N tosses." This forces a finite expectation. The limit as `N→∞` depends on *how* you truncate:
    - Natural Truncation (by outcome): `E_N = Σ_{k=1}^N (±1/2) = 0` for even `N`.
    - Truncation by Probability: Assign all "unfinished" games (`>N` tosses) a payoff of `0` or `±2^N`. This often yields a non-zero limit.
    **Rational Choice:** Depends on the chosen truncation method, which lacks a priori justification.

  - **Weakly Convergent Measures (Schmeidler, Gilboa):**
    Some advanced frameworks allow "expectations" as limits over *averages of finite truncations*. For your series, the average of partial sums *does* converge to 0. This might support indifference or rejection.

  - **Subjectivity / Arbitrary Choice:**
    If no objective rule dictates ordering, the agent's psychology (optimism/pessimism) determines how they "tally" outcomes. An optimist sees `+∞`, a pessimist sees `-∞`. Rationality might permit either.

  - **Risk Aversion Overrides:**
    Even if `E=0` is accepted, the gamble has *massive variance*. A risk-averse agent (concave utility) would reject it due to catastrophic potential losses.

  ### 5. **Recommendation for Your Character**
  *There is no mathematically "correct" answer.* This ambiguity is the heart of your narrative tension. Consider:

  1. **Character Psychology:**  
     - An optimist/risk-seeker might focus on the `+∞` rearrangement and accept.  
     - A pessimist/risk-averse character might focus on `-∞` or the undefined risk and refuse.  
     - A rationalist (à la Savage) might reject it as ill-defined.  
     - A mathematician might refuse, muttering about Riemann.

  2. **Narrative Themes:**  
     - **Ambiguity of Value:** Can "value" exist if it can't be defined?  
     - **Choice Under Indeterminacy:** How do we decide when reason fails?  
     - **The Allure of Infinity:** Why do humans chase divergent expectations?  
     - **Consequences Over Calculation:** The character might imagine ruin (or glory) regardless of math.

  3. **Practical Outcome:**  
     Since the probability of extreme outcomes decays exponentially (`P(20+ tails) < 1/1,000,000`), short-term results are likely mild (`+1` or `-2`). A pragmatic character might accept, expecting a quick resolution. A far-sighted one might fear the tail risk.

  **In essence:** Your wager isn't irrational because it offers infinite gain for finite cost (like St. Petersburg). It's irrational (or non-rational) because it offers *no consistent way to assign a value at all*. This makes it a powerful metaphor for choices where reason cannot adjudicate. Your character must decide without the crutch of expected value—forcing them to reveal their deepest attitudes toward uncertainty, hope, and despair.
