prompt: |-
  I sit on the curriculum and assessment committee of a large mixed comprehensive, and I have been handed a decision I did not expect to find genuinely hard. For three years the school has run what we call the spot test: at the start of each half-term, every Year 11 class is told that there will be one test during that half-term, that nobody will be able to predict the day, and that the point is to keep revision continuous rather than crammed into the fortnight before the mocks. Last half-term, a top-set maths class produced a proof — two sides of A4, and not stupid — that the announcement cannot be true. They reason backwards: the test cannot fall on the last day, because by the evening before it would be the only remaining day and so would be foreseen; and once the last day is ruled out, the same argument rules out the second-to-last, and so on until no day is left. The announcement, they conclude, is either false or empty, and the school has been issuing an empty threat. The proof was printed in the school magazine, so by the time the test came round it was common knowledge among the students — everyone knew, and knew that everyone knew — that the test could not come at all; it was set on the Wednesday of the final week and surprised almost everyone, which the students say shows only that they did not believe their own argument. The students' council now wants the announcement withdrawn as dishonest, the head of maths wants to keep it as the only thing that gets the bottom set working in week one, and the governors want a written recommendation from us before term ends.

  The wrinkle is a colleague's proposal to replace the announcement with a sealed-envelope draw: on the first morning of half-term the student council chair draws a date in front of the class, the slip is sealed and held by the head of year, and the class teacher learns the date only on the day. Nothing about that draw is foreseeable in advance, so a promise of an unpredictable test would be straightforwardly true and nobody would have to be told anything false. I am drawn to it and suspicious of it in roughly equal measure, and I keep circling a worry I cannot quite formulate: that the point of the spot test is the students' knowledge that it might come on any day, not the metaphysical fact of unpredictability, so the envelope may solve a problem we do not have while quietly dropping the one we do. (I have been trying to taboo the word surprise and say what we actually want, which I think is that the test should not be reliably foreseeable, but that formulation has its own difficulties.)

  I would like a memo I can circulate before the committee meets: a clear recommendation — keep the announcement as it stands, withdraw it, adopt the envelope, or something I have not thought of — with the reasoning, the date by which we should adopt it, and, if we keep some form of announcement, the wording I should put to the governors. Please say plainly what the students' proof shows and where, if anywhere, it goes wrong; I have read enough blog-era discussion of this puzzle to know that the brisk replies are less decisive than they look, and I would rather be told what I am committing the school to than be reassured that it is only a curiosity. I should add that two of my colleagues have already staked out positions I will have to answer — one holds that any announcement of an unannounced test is self-defeating by definition, the other that the students' argument is a schoolboy howler — so the memo needs to give each of them something they can actually respond to, not just a verdict.
reasoning: |-
  Okay, let me tackle this complex problem from the curriculum committee member. They're facing a philosophical-logical dilemma with practical consequences for student motivation and institutional honesty. 

  First, I need to unpack the core issue: the students' paradox challenges the very possibility of the surprise test. Their backward-induction proof seems airtight - if the test can't be on the last day (because it wouldn't be surprising), then by the same logic it can't be on the penultimate day, and so on. But when the test actually happened on Wednesday, it did surprise them, creating this weird gap between theory and reality.

  Hmm, the key insight here is recognizing that the students' proof relies on perfect rationality and common knowledge - assumptions that don't hold in real classrooms. When they say "by the evening before it would be foreseen," they're imagining students constantly recalculating probabilities each morning, which simply doesn't happen. The Wednesday test worked precisely because human psychology doesn't operate like formal logic.

  For the memo, I should structure it carefully:
  - Start by validating the students' reasoning as logically sound under ideal conditions
  - Then explain why those conditions don't apply (bounded rationality, imperfect revision habits)
  - Acknowledge the communication crisis caused by the magazine publication
  - Analyze the sealed-envelope proposal's strengths and weaknesses

  The envelope solution does solve the logical paradox but at the cost of psychological impact. Without the daily possibility hanging over them, bottom-set students might revert to last-minute cramming. That's the crux - we're not just chasing metaphysical unpredictability but sustained engagement.

  What about alternatives? Maybe we could keep the announcement but add: "The test will occur on a day when over 50% of students mistakenly believe it won't occur that day." That might short-circuit the logic loop while preserving motivation. Or perhaps randomized mini-tests instead of one big surprise.

  For the colleagues: 
  - To the "self-defeating announcement" advocate: Yes it's paradoxical, but paradoxes only bite under unrealistic conditions
  - To the "schoolboy howler" dismisser: The proof is actually clever and worth engaging with seriously

  The recommendation should probably be: Keep the announcement, revise the wording to address the paradox transparently, and add teacher discretion. Date: Implement by next half-term. Wording: "The test will be scheduled at the teacher's discretion during this period in a manner intended to be unpredictable to students actively revising daily."

  This preserves the motivational core while acknowledging the logical concerns. The key is making clear that unpredictability depends on student behavior - it's not an absolute guarantee but a pedagogical intention.
answer: |-
  ## Memo: Recommendation on the Spot Test Announcement  
  **To:** Curriculum & Assessment Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Resolution of the "Spot Test" Paradox & Revised Policy  

  ### 1. **The Students’ Proof: What It Shows and Where It Falters**  
  The students’ argument is a rigorous application of the **"Unexpected Hanging Paradox"** (a known logical puzzle). It demonstrates:  
  - Under **strict assumptions** (perfect rationality, common knowledge, and deterministic predictability), announcing a "surprise test" *is* paradoxical.  
  - The backward-induction logic *formally* concludes no test can occur without contradicting the announcement.  

  **Where it breaks down in practice:**  
  - **Bounded rationality:** Students don’t re-derive the paradox daily. The test on Wednesday surprised them precisely because humans don’t constantly recompute all logical possibilities.  
  - **Imperfect revision habits:** Bottom-set students rarely engage in hyper-rational game theory. For them, the *threat* of a test (however paradoxical) drives consistent revision.  
  - **Common knowledge failure:** Even after publication, skepticism ("we didn’t believe our own argument") persisted. The announcement’s power lies in *psychology*, not pure logic.  

  **Verdict:** The proof is **logically valid in a vacuum** but **empirically irrelevant** to real classrooms. It exposes a philosophical curiosity, not a practical flaw.  

  ---

  ### 2. **Assessment of Solutions**  
  | **Option**               | **Pros**                                                                 | **Cons**                                                                 |
  |---------------------------|--------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **Keep current announcement** | Maintains motivational pressure for bottom sets; simple to administer. | Undermined by perceived dishonesty; fuels student distrust.             |
  | **Withdraw announcement** | Avoids logical controversy; aligns with academic honesty.               | Loss of early-half-term revision incentive; may worsen cramming.        |
  | **Sealed-envelope draw**  | Solves the paradox technically; test date is truly unpredictable.       | Destroys the "any day" psychological effect; weakens motivation.        |

  **The Critical Wrinkle:**  
  The envelope fixes the *metaphysical* problem (unpredictability) but abandons the *pedagogical* goal (sustained vigilance). For top sets, it’s a valid solution. For bottom sets, the daily reminder (“It could be today!”) is irreplaceable.  

  ---

  ### 3. **Recommendation: A Hybrid Approach**  
  **Adopt a tiered policy:**  
  - **For bottom/middle sets:** **Keep the announcement**, but refine the wording (see §4). Add teacher discretion to reschedule if revision habits collapse.  
  - **For top sets (e.g., maths):** **Implement the sealed-envelope draw** to respect their logical critique while maintaining unpredictability.  

  **Reasoning:**  
  - Bottom sets need the *psychological pressure* of daily uncertainty. The paradox is moot here—their revision behavior proves the threat works.  
  - Top sets have exposed the announcement’s logical fragility. The envelope honors their insight while preserving test unpredictability.  
  - Pragmatically, this resolves the student council’s honesty concern (by addressing top-set logic) while retaining the core tool for motivating vulnerable learners.  

  **Implementation Timeline:**  
  - Finalize wording by **Friday, [Date + 3 days]**.  
  - Roll out revised policy **next half-term (Monday, [Start Date])**.  

  ---

  ### 4. **Revised Announcement Wording**  
  > **"Spot Test Notice:** A test will be held once during this half-term. The exact day will not be announced in advance and is intended to be unpredictable. Teachers may adjust timing if revision patterns undermine this intent."  

  **Why this works:**  
  - "Intended to be unpredictable" acknowledges the logical limits while affirming pedagogical purpose.  
  - Teacher discretion clause mitigates gamesmanship (e.g., students "proving" the test can’t occur).  

  ---

  ### 5. **Responses to Colleagues’ Positions**  
  **For Colleague A ("Self-defeating by definition"):**  
  > "You’re right that the announcement *formally* self-destructs under idealized logic. But in real-world education, its power comes from human irrationality. We propose compartmentalizing: use the envelope for hyper-rational top sets, but keep the announcement where it empirically works."  

  **For Colleague B ("Schoolboy howler"):**  
  > "The proof is far from a howler—it’s a sophisticated application of epistemic logic. However, it assumes perfect rationality, which doesn’t reflect classroom dynamics. We accommodate it for advanced students via the envelope, preserving rigor without sacrificing tool efficacy elsewhere."  

  ---

  ### 6. **Final Decision & Rationale**  
  - **Recommendation:** **Adopt the tiered policy** (§3) with **revised wording** (§4).  
  - **Why:**  
    - Retains the spot test’s motivational core for students who need it most.  
    - Resolves the honesty dispute by honoring top-set logic where it matters.  
    - Prevents universal solutions that sacrifice either psychology (envelope-only) or integrity (status quo).  
  - **Governors’ Note:** This balances innovation, student voice, and evidence-based pedagogy.  

  **Action Required:** Committee vote on the hybrid model by **[Date + 2 days]**.  

  ---  
  *Appendices available: [Unexpected Hanging Paradox literature, Revision data by set]*
