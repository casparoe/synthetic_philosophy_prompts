answer: |-
  ## Joint Statement on Housing Justice: Adversarial Collaboration Between Build-by-Right and Community-Control Advocates

  **Preamble:**
  For over a decade, our two camps have been locked in dispute over the fundamental nature of housing injustice and its solutions. We agree profoundly on the existence of a crisis: unaffordable homes, widespread insecurity, deepening inequality, and the erosion of community. We diverge sharply on diagnosis and prescription. This statement represents a disciplined effort at adversarial collaboration. We jointly commit to reasoning from the mechanics of land and housing markets, setting aside familiar rhetorical positions. We present here agreed foundational claims, clarify persistent disagreements, identify crucial testable questions ("cruxes"), and jointly assess a specific policy programme against our principles. This is not consensus; it is a map for focused inquiry and potential progress.

  **1. Agreed Claims:**
  We jointly affirm the following substantive propositions as foundational to understanding the city's housing dynamics:

      1.  **Land Value is Dominant:** The price of housing is overwhelmingly determined by the value of the land it sits on, not the cost of the physical structure itself. Scarcity, location, and development potential primarily drive land value.
      2.  **Regulation Creates Artificial Scarcity:** Current zoning codes, density limits, parking mandates, and discretionary review processes collectively act to restrict the potential supply of housing below what the physical capacity of the city and market demand would otherwise support. This is distinct from physical constraints like geography.
      3.  **Incumbency Advantage:** Existing property owners benefit disproportionately from the status quo. Regulatory constraints protect the exclusivity and character of their neighbourhoods, shielding them from change, while simultaneously inflating the asset value of their land holdings. This advantage is embedded in the system.
      4.  **Tenants Bear Disproportionate Risk and Cost:** Those without ownership stakes (primarily tenants and lower-income residents) bear the brunt of housing instability and neighbourhood change. They face direct costs including involuntary displacement, rent hikes exceeding income growth, disruption to social networks, and limited power to influence decisions affecting their immediate environment. These costs are often externalised by owners and developers.
      5.  **Speculation is Inherent:** Land markets are inherently prone to speculation. Expectations of future regulatory changes (like upzoning), neighbourhood improvement, or rising demand are capitalised into current land prices, often accelerating price increases before any physical development occurs.
      6.  **"Affordability" is Multi-Dimensional:** Affordability encompasses not only the direct monetary cost of housing (rent/mortgage) but also security of tenure (protection from displacement), stability of community, and access to essential neighbourhood amenities and services. These dimensions are interlinked but distinct.
      7.  **The Status Quo is Unsustainable and Unjust:** The current system fails to deliver adequate, secure, and affordable housing for a large portion of the city's residents while systematically favouring existing property owners. This outcome is neither efficient nor equitable.

  **2. Statement of Remaining Disagreements:**

  | Disagreement                                                                                                                               | Camp                                                                 | Genuine or Verbal? | Reason                                                                                                                               |
  | :----------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------- | :----------------- | :----------------------------------------------------------------------------------------------------------------------------------- |
  | **The Primary Mechanism of Injustice:** Is it the *illegality* of building needed housing (legal exclusion), or the *commodification* of homes/land enabling private capture of value and displacement? | Build-by-Right (Legal Exclusion) vs. Community-Control (Commodification) | **Genuine**        | Represents fundamentally different conceptions of the core problem and the primary lever for change (regulatory reform vs. power/ownership restructuring). |
  | **The Principal Engine of Affordability:** Is building significantly more market-rate housing the necessary and primary driver of broad affordability, or is it secondary (or potentially counterproductive) without prior/predominant guarantees of secure tenure and community control? | Build-by-Right (Supply Primacy) vs. Community-Control (Security/Control Primacy) | **Genuine**        | Disagreement on causality and sequencing: does supply *lead* to affordability, or can it undermine it without specific safeguards? Involves different views on market dynamics and power. |
  | **The Nature of Discretionary Review:** Does discretionary planning review (e.g., Councillor call-in, design review boards) function primarily as a necessary *safeguard* for community interests and quality, or as an *exclusionary device* wielded by incumbents to block change and preserve privilege? | Build-by-Right (Exclusion Device) vs. Community-Control (Ambivalent - Potential Safeguard/Blocking Tool) | **Mostly Genuine** | While both agree it *can* be used for exclusion, disagreement on its *primary* function in practice and whether it can be reformed or must be eliminated. Community-Control sees potential value in community voice; Build-by-Right sees inherent veto power. |
  | **The Role of "The Market":** Is the private development market, once freed from excessive constraints, a reliable vehicle for delivering needed housing at scale, or is it inherently oriented towards extracting maximum value, necessitating non-market or tightly regulated alternatives as the primary solution? | Build-by-Right (Market as Vehicle) vs. Community-Control (Market as Problem) | **Genuine**        | Fundamental difference in trust regarding private actors' motivations and the ability of market mechanisms alone to serve broad affordability and stability goals. |

  **3. The Cruxes:**
  We identify the following empirical questions as critical "cruxes" whose resolution would significantly alter at least one camp's position. For each, we state the claim to be tested, the agreed method of investigation, and each camp's prediction *in advance*.

      1.  **Crux: New Market-Rate Construction & Rents**
          *   **Claim:** Does the construction of new, unsubsidised, market-rate housing in a supply-constrained city lower rents (or slow rent growth) for existing housing in the immediate surrounding area (within ~1km), and if so, by what mechanism and on what timescale?
          *   **Test:** Analyse natural experiments arising from the completion of significant (e.g., 50+ units) new market-rate developments in previously stagnant neighbourhoods. Compare rent trends for comparable existing units within the impact zone before and after completion against control areas (similar neighbourhoods without new supply) and citywide trends. Control for concurrent economic changes. Examine mechanisms: vacancy chain effects, reduced competition pressure, changed landlord expectations.
          *   **Build-by-Right Prediction:** Yes, it lowers or significantly slows rent growth for nearby comparable units within 1-3 years, primarily through increased vacancy rates and reduced competition among renters. Effect size is material but location-dependent.
          *   **Community-Control Prediction:** Little to no *downward* pressure on nearby rents in the short-medium term (1-5 years). New units may set higher benchmarks, potentially lifting rents; benefits are diffuse/long-term while displacement pressures near the site may be immediate. Primary mechanism is long-term increased supply citywide.

      2.  **Crux: Upzoning & Land Value Capitalisation**
          *   **Claim:** When an area is significantly upzoned (e.g., allowing 4+ dwellings where 1-2 were previously permitted), is the uplift in development potential primarily capitalised immediately into higher land prices (enriching current owners), or is it primarily converted into actual new housing construction relatively quickly?
          *   **Test:** Analyse land sales transactions and development activity following major, unexpected, area-wide upzonings. Track changes in vacant land prices per square metre and prices of properties ripe for redevelopment immediately after the zoning change and over the subsequent 3-5 years. Correlate price changes with the rate and scale of actual new construction permits and completions in the same period.
          *   **Build-by-Right Prediction:** Significant initial capitalisation occurs, but where regulatory barriers are *truly* removed (no discretionary review), a substantial portion is converted into new housing within 3-5 years, moderating land price inflation over time. Vacant/underutilised land sees the fastest response.
          *   **Community-Control Prediction:** The vast majority of the value uplift is immediately capitalised into land prices, accruing to current owners. Actual new construction occurs slowly, sporadically, and often at the highest end, failing to capture the value for community benefit or significantly increase affordable supply in the near term. Land becomes a more valuable speculative asset.

      3.  **Crux: The Binding Constraint**
          *   **Claim:** In the current city context, is the *primary* constraint preventing the construction of more housing, particularly more affordable housing, the *regulatory environment* (zoning, approvals) or *financial/demand-side factors* (construction costs, financing, profitability, developer capacity, effective demand)?
          *   **Test:** Examine the pattern of development proposals and outcomes. Where developments *comply* with existing zoning but still face delays or blocks, identify the reasons (e.g., pre-application negotiations, viability arguments, call-ins). Analyse the "pipeline": ratio of projects seeking permission vs. permissions granted vs. completions. Assess the feasibility of building mid-density, modest-profit-margin housing under current by-right rules (where they exist) vs. under a hypothetical fully by-right system.
          *   **Build-by-Right Prediction:** The regulatory environment (especially discretionary review and complex compliance) is the dominant constraint, creating uncertainty, delay, and cost that makes many otherwise viable projects (especially smaller-scale, missing-middle) unprofitable or too risky. Removing discretion would unleash significant supply.
          *   **Community-Control Prediction:** Financial constraints (high land prices due to speculation, high construction costs, developer profit requirements) are the dominant barrier to genuinely affordable housing. Even with by-right zoning, the market will primarily deliver high-end housing unless land costs are controlled and non-market alternatives are dominant. Discretionary review, while flawed, is sometimes the only tool communities have to extract concessions.

      4.  **Crux: Security & Supply - Complements or Substitutes?**
          *   **Claim:** Are strong tenant protections (e.g., just-cause eviction, rent stabilisation) and community control mechanisms (e.g., CLTs, robust planning input) *complements* to increasing housing supply (enhancing stability without hindering construction), or are they largely *substitutes* (achieving affordability/security primarily through regulation and control rather than through market supply)?
          *   **Test:** Compare outcomes in cities/jurisdictions that have implemented *both* significant supply reforms (e.g., upzoning) *and* strong tenant/community protections simultaneously, versus those that implemented only one. Track metrics: overall housing production rates, displacement rates, rent trends for protected vs. unprotected units, stability of lower-income residents, level of community opposition to new development.
          *   **Build-by-Right Prediction:** Strong protections alone can deter investment and new supply without addressing scarcity. Supply expansion is primary; well-designed protections can be *complements* but are not the main driver of affordability. Substitute policies fail at scale.
          *   **Community-Control Prediction:** Without strong protections and community control, new supply primarily benefits higher-income groups and fuels displacement, undermining affordability goals. Protections and control are essential preconditions *complementing* supply; they are non-substitutable core components of housing justice, ensuring benefits reach those in need. Supply without them is ineffective or harmful.

  **4. Joint Assessment of the Proposed Programme:**
  Both camps evaluate the following programme: (a) Citywide by-right rezoning to 4 storeys/4 dwellings, no parking min., no discretionary review for compliant schemes; (b) High-rate tax on land value uplift upon realisation (sale/development); (c) Proceeds fund Community Land Trusts (CLTs) in each district, holding a share of new homes at income-tied rents and offering sitting tenants first refusal.

  *   **Build-by-Right Camp Assessment:**
      *   **(a) Accepts Outright:** The core reform: eliminates the primary regulatory barrier, enabling significant supply increase. Essential.
      *   **(b) Accepts Instrumentally:** While wary of taxation potentially dampening development incentives or complexity, recognises the political necessity of capturing some uplift to gain support and mitigate windfalls. Accepts *if* rate/design avoids stifling construction.
      *   **(c) Accepts Instrumentally:** Views CLTs as a potentially useful *supplement* for specific vulnerable groups, but not the primary solution. Supports tenant first refusal as fair. Concerned CLT governance could become exclusionary or inefficient. Accepts *only* as a necessary trade-off to secure (a), and if CLT scale doesn't crowd out market supply. **Rejects** any implication that CLTs are the *primary* engine of affordability.

  *   **Community-Control Camp Assessment:**
      *   **(a) Rejects Outright (in isolation):** Sees citywide by-right as removing crucial community leverage and enabling unfettered, potentially disruptive market development. **Accepts Instrumentally *only*** because it is coupled with (b) & (c), providing tools to capture value and exert control.
      *   **(b) Accepts Outright:** Essential mechanism for recapturing publicly created value and funding community benefit. Core demand.
      *   **(c) Accepts Outright:** Secure tenure (first refusal) and community control (CLT governance) over a significant share of housing is the primary goal. The essential mechanism for ensuring stability and democratic accountability. **Rejects** the notion that (a) alone would be sufficient or even net positive.

  **Conclusion:**
  This statement marks a step towards a more rigorous, evidence-based debate. Our profound disagreements remain. However, by jointly affirming key mechanics (Section 1), precisely defining our differences (Section 2), and identifying testable cruxes (Section 3), we provide a clearer path for inquiry. Our divergent assessment of the proposed programme (Section 4) highlights the trade-offs and conditional acceptance involved. We commit to revisiting these cruxes as new evidence emerges and to continuing this adversarial collaboration in pursuit of effective solutions to the housing crisis. Progress requires confronting hard truths on all sides.

  **[Signatures/Endorsements would appear here]**
