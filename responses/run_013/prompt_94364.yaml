prompt: |-
  Ok, so I'm on the hiring side of a small philosophy of physics group and we've got money for three or four postdocs for three years, and I have to write the agenda doc that says what we're actually going to put them on. The area we've landed on is the old substantivalism vs relationism fight about spacetime -- Newton's bucket, Leibniz's shift, the hole argument, the whole kit. Problem is a lot of what's been written since the 80s feels like the same moves getting reheated, and I don't want to burn three postdoc-years on that.

  So: what are the genuinely open questions in that debate right now, and which would you actually staff? I care way more about the reasoning than the list. For each one I want to know whether it's upstream of other questions (does settling it make the others easier, or just make them dissolve), whether a philosopher can make real progress without doing the physics themselves, and whether there's any chance the answer matters to anyone outside the debate -- a working physicist, someone doing modality, whoever.

  Two things I want you to treat as live options rather than settled background. First, the possibility that the whole thing is a verbal dispute, i.e. that there's no substantive disagreement once you get precise about what each view is a claim about -- is "is this debate substantive at all?" the question that matters most, or is it the kind of meta-question that eats a field alive and pays out nothing? Second, whether the debate should be reoriented away from classical spacetime, where it feels like the cases are exhausted, toward quantum gravity, where the ontology is genuinely up in the air and nobody has a worked out story about what the relata even are -- real frontier, or just a way of avoiding the hard classical arguments?

  Also tell me what you'd deprioritize and why, including stuff that's prestigious but, as far as you can tell, doesn't connect to anything downstream. And flag any question where the honest answer is "this stays unresolved because it's underdetermined by any evidence we could realistically get," because I'd want to know that before spending three years on it. Rank the top few and say what would move something up or down the list over the next couple of years. Please write your answer in American English.
