prompt: |-
  I've been keeping a running list of cases where I have a gut verdict about whether someone's choice actually tells us what they prefer, and the list is starting to look like it can't all be right. Third-year PhD student, decision theory / philosophy of econ (interdisciplinary program, whatever), so I care about this more than a normal person should. Here's the list.

  My buddy buys a Powerball ticket every week. He knows the odds. I think that choice does reveal something he prefers — he's paying two bucks for a week of imagining being rich, and he genuinely prefers that to two bucks. Reveals a preference.

  Same buddy, if he bought the ticket because he's sure he's due and would take it back the second he did the math — I don't think that reveals a preference over outcomes at all. That's a mistake, not a taste.

  A guy I knew in undergrad, dry for a year, drank again. I don't think that choice revealed that he preferred drinking to being dry. It's a compulsion; preference talk doesn't get a grip. (He said so himself after, which I know isn't decisive.)

  Another friend quit a decent job to move to a city with worse everything because her partner got a job there. That reveals a preference, I think — she prefers being with him to the job and the city. Fine.

  But my cousin, who sells plasma twice a week and took a roofing job with a scary injury rate, I also think that reveals a preference — he prefers the money to the risk. He's not compelled, he's just broke.

  Now the ones that I think break the pattern:

  Mug case. I won't sell you my mug for six dollars, and I wouldn't buy the same mug for six dollars either. I don't think that shows I have no preference about mugs — I think it shows I prefer not to lose what I have over gaining what I don't. Loss aversion, sure, but it's a real preference, a preference over gains and losses rather than over final states.

  Framing case. If you tell me a surgery has a 90% survival rate I say yes; if you tell me it has a 10% mortality rate I say no. Same surgery. There I want to say no preference over the outcomes was revealed at all — the choice was tracking the words, not the surgery.

  Those two look like the same move to me. Both are cases where what the person "chooses" depends on how the options are described rather than on the options. But in the mug case I let the description-relative thing count as a preference and in the surgery case I don't. Can't tell if that's a principled distinction (final states vs changes from a reference point maybe doing real work) or if I'm just inconsistent.

  Two more:

  Someone picks A over B, B over C, and C over A, asked on three seperate days. I want to say there's no preference ordering here, but I also want to say each of the three choices was a real expression of something. Is "preference" just the wrong word and I should be saying "choice disposition"?

  The 11pm case. Same person picks the apple at the store and the cake at the party. I think each choice reveals what she wanted then, and there's no further fact about what she "really" prefers. But then I don't know why I get to say the alcoholic's drink isn't a preference and this is — both are just what the person did at a time.

  The tentative thing I've been telling myself: a choice reveals a preference when (i) it's stable under redescription of the options, (ii) it's not something the chooser would disavow from a cool informed standpoint, and (iii) it isn't just the path of least resistance. But (i) kills the mug case, which I want to keep; (ii) looks like it could cut either way on the addict, since he might endorse sobriety and the drink both; and (iii) is doing all the work in the addict case while being definately the vaguest thing on the list.

  So what I want from you: a principle, or two if you think the domain splits, that gets these, that says precisely which of my verdicts I have to give up, and that tells me what to say about a case I haven't listed — someone who votes against his own stated interest every election because that's how his dad voted. Preference, habit, or neither?
reasoning: |-
  Okay, let me try to figure this out. The user is a third-year PhD student in decision theory and philosophy of economics. They've been collecting cases where choices might or might not reveal true preferences, and they're confused because their intuitions seem inconsistent. They want a principled way to distinguish when choices reveal preferences and when they don't.

  First, I need to understand each case they mentioned. Their buddy buying a lottery ticket for the daydreaming effect—that seems like a revealed preference because he values the experience. But if the same buddy bought it thinking he's "due" to win, that's a mistake. Then there's the alcoholic relapsing, which they don't think reveals a preference due to compulsion. The friend moving for her partner's job does show preference. The cousin selling plasma and taking a risky job reveals preference because he's making a trade-off due to financial need.

  The tricky ones are the mug case and the surgery framing. In the mug case, loss aversion makes them unwilling to sell or buy the same mug at $6. They think this shows a preference over gains/losses, not just final states. But in the surgery case, the different descriptions (90% survival vs 10% mortality) lead to different choices, which they feel doesn't reveal any real preference. Why treat these differently? The user suspects it might be about final states vs. changes from reference points.

  Then there's cyclical preferences (A>B, B>C, C>A) which challenges the idea of a stable ordering. The 11pm case where someone chooses an apple at the store but cake at a party—each choice reflects what they wanted at that moment. But how is this different from the alcoholic's compulsion? The user's tentative criteria (stability under redescription, no disavowal from a cool standpoint, not path of least resistance) have problems. Stability kills the mug case, disavowal is ambiguous for addicts, and path of least resistance is vague.

  The deeper issue here is defining what constitutes a "preference." Traditional revealed preference theory assumes choices reflect stable, consistent preferences. But behavioral economics shows that framing, context, and cognitive biases affect choices. The user is struggling to reconcile these. Maybe preferences need to be understood as context-dependent, but with some constraints to avoid trivializing the concept.

  For the voter example: someone votes against their interest because their dad did. Is that preference, habit, or neither? If it's a conscious endorsement of family tradition, it might be a preference for loyalty. If it's unthinking habit without reflection, it's not a preference. The key is whether they would endorse it after reflection.

  So, a possible principle: choices reveal preferences when they reflect stable, contextually-appropriate valuations that the agent would endorse upon reflection. The mug case's loss aversion might be endorsable as a legitimate valuation, while the surgery framing isn't. The addict might not endorse the choice when sober. The cyclical preferences aren't stable, and time-specific choices (apple vs cake) are endorsable as context-dependent. The voter case depends on endorsement after reflection.
answer: |-
  Here's a principled framework to resolve your cases, rooted in a distinction between **context-embedded preference expressions** and **revealed preferences for stable ordering**. The core insight: **Choices reveal *preferences* only when they express a *rationally endorsable valuation* that is stable across *normatively irrelevant* contextual shifts.** This requires abandoning the classical revealed preference axiom ("choice = preference") and adopting a constructivist view where preferences are *inferred* from choices *under specific conditions*.

  ### The Principle
  **A choice reveals a preference iff:**
  1.  **Endorsement Condition:** The agent would rationally endorse the choice as expressive of their valuation *after reflective equilibrium* (full information, cognitive coolness, no coercion).
  2.  **Context-Invariance Condition:** The valuation expressed is stable across *normatively irrelevant* changes in description or context (framing, path-dependent states like ownership) *when those changes are made transparent*.
  3.  **Valuation Condition:** The choice reflects a comparative evaluation of *options' inherent properties* (or rationally processed properties), not merely a response to incidental features of the choice architecture (e.g., wording, default rules).

  ### Key Clarifications
  *   **Rationally Endorsable:** The agent, in a state of full information and cognitive competence (e.g., not impaired by craving, acute stress, or blatant reasoning errors), would affirm that the choice *correctly* represented their weighting of the options' values.
  *   **Normatively Irrelevant Changes:** Changes that *should not* affect a rational evaluation of the options' core attributes (e.g., describing a probability as 90% survival vs. 10% mortality, describing a mug as "yours to lose" vs. "not yours to gain").
  *   **Inherent Properties:** Attributes like monetary value, health outcomes, risk levels, enjoyment, ethical alignment – things that *should* matter to the agent's well-being or goals.
  *   **"Reveals a Preference":** This means the choice provides evidence for a *stable disposition to rank options* that can be integrated into a coherent model of the agent's values.

  ### Applying the Principle to Your Cases
  1.  **Buddy Buys Ticket (Daydreaming):** **Preference Revealed.** (i) He endorses valuing the fantasy. (ii) The valuation (fantasy > $2) is stable across descriptions. (iii) Choice tracks inherent properties (cost vs. psychological benefit).
  2.  **Buddy Buys Ticket ("Due to Win"):** **No Preference Revealed.** (i) He disavows the valuation after doing math (fails Endorsement). (ii) Valuation unstable under transparency. (iii) Choice tracks a reasoning error, not inherent properties.
  3.  **Alcoholic Drinks:** **No Preference Revealed.** (i) He disavows the choice from a sober standpoint (fails Endorsement). (ii) Valuation (drinking > sobriety) is unstable across states (craving vs. sober). (iii) Choice tracks compulsion (path of least resistance), not inherent value evaluation ("rational processing" of properties is impaired).
  4.  **Friend Moves for Partner:** **Preference Revealed.** (i) She endorses prioritizing the relationship. (ii) Valuation (relationship > job/city) is stable across descriptions. (iii) Choice tracks inherent properties (relationship quality vs. career/city quality).
  5.  **Cousin Sells Plasma / Takes Risky Job:** **Preference Revealed.** (i) He endorses the trade-off (money > risk/discomfort). (ii) Valuation stable across descriptions. (iii) Choice tracks inherent properties (financial need vs. physical cost/risk).
  6.  **Mug Case (Endowment Effect):** **Preference Revealed (but context-specific).** (i) You endorse valuing losses more than gains ("loss aversion is part of my valuation structure"). (ii) **Crucially:** The valuation *is stable* under *transparent* redescription *if the reference point (ownership) is acknowledged as part of the context*. The key is that the reference point *itself* is a normatively relevant context for *your* valuation (you rationally endorse this asymmetry). (iii) Choice tracks an inherent, rationally endorsable property *relative to a reference state* (disutility of losing X > utility of gaining X).
  7.  **Surgery Framing Case:** **No Preference Revealed.** (i) You disavow letting the description dictate the choice when framing is made transparent. (ii) Valuation is unstable under *transparent* redescription (90% survival vs. 10% mortality *when shown to be identical*) - fails Context-Invariance for normatively irrelevant change. (iii) Choice tracks the *description* (incidental feature), not the inherent property (surgical outcome probability).
  8.  **Cyclical Choices (A>B, B>C, C>A):** **No Stable Preference Ordering Revealed.** (i) The agent likely disavows the set as coherent upon reflection. (ii) Valuation is contextually unstable and intransitive. (iii) Each individual choice *might* express a *momentary* preference in that specific context, but it fails to reveal a *stable, rankable* preference structure. You must give up "preference ordering" here; "choice disposition" (context-dependent) is better.
  9.  **11pm Case (Apple vs. Cake):** **Preferences Revealed (context-specific valuations).** (i) She likely endorses each choice *in its context* ("I wanted an apple at the store", "I wanted cake at the party"). (ii) The valuations *are stable* under transparent redescription *if the context (store vs. party) is included*. Context *is* normatively relevant to valuation (social setting influences enjoyment). (iii) Choice tracks inherent properties *as evaluated in that context* (health focus vs. celebration focus). *Contrast with Alcoholic:* The alcoholic disavows the choice *even within the context of craving* from a sober perspective; the cake chooser endorses both choices *within their respective contexts*. The cake choice isn't a compulsion overriding a conflicting valuation; it *is* her valuation *in that setting*.

  ### Addressing Your Tentative Criteria
  *   **(i) Stability under Redescription:** You were right to worry it kills the mug case. The refined **Context-Invariance Condition** saves it by making the reference point part of the *normatively relevant context* for the valuation, not an incidental description. Framing effects fail because the description change *shouldn't* matter.
  *   **(ii) Not Disavowed from Cool Standpoint (Endorsement):** This is central. The ambiguity for the addict is resolved: Does he disavow *the valuation expressed by the choice ("drinking is better now")*, or just the *consequence*? If he disavows the valuation itself (even within the craving context) as not truly his, it fails.
  *   **(iii) Not Path of Least Resistance:** This is partially absorbed into **Valuation Condition**. The "path" matters if it bypasses evaluation of inherent properties (compulsion, extreme inertia). The cousin's choice is effortful, not passive.

  ### The Voter Case: Preference, Habit, or Neither?
  *   **Scenario:** Someone votes against their stated interest because that's how their dad voted.
  *   **Analysis:**
      *   **Endorsement:** If, upon reflection, he endorses "voting like dad" as expressing a core value (e.g., family loyalty, tradition, respect) *even knowing it conflicts with other interests*, then **Preference is Revealed** (for loyalty > policy outcome). The valuation is of the *act of loyalty* inherent in voting that way.
      *   **Non-Endorsement:** If he reflects and says "That was just a dumb habit, I didn't think about it, and I actually value policy outcome X more", then **No Preference Revealed**. It fails Endorsement and Valuation (choice didn't track inherent properties, just inertia).
      *   **Habit as Expression:** If he endorses the *habit itself* as valuable ("It's important to me to maintain this ritual connection to my father"), then the choice reveals a **Preference for performing the habitual act**.
  *   **Verdict:** It depends on whether the voter would *endorse the valuation expressed by the choice* (loyalty/tradition > stated policy interest) after reflection. If yes, **Preference**. If no, **Habit without Preference Revelation**.

  ### What You Must Give Up
  1.  **The universality of "choice = preference":** You must accept that many choices (mistakes, compulsion, framing effects) do *not* reveal underlying preferences for outcomes or stable valuations.
  2.  **The mug case as purely about "final states":** Your intuition is correct; you must accept that reference points can be *constitutive* of rationally endorsable valuations (loss aversion *is* a preference structure for many). The principle accommodates this via the Context-Invariance test *with reference point acknowledged*.
  3.  **Cyclical choices revealing a coherent preference ordering:** You must give up "preference" meaning a complete, transitive ordering in these cases. They reveal context-specific choice dispositions, not a stable rankable preference.
  4.  **The idea that "what she wanted then" is always a preference:** The alcoholic case shows that sometimes "what she wanted then" is disavowed as not expressive of her valuation. The cake case is endorsed *as* her valuation in that context. The endorsement condition is crucial for distinguishing compulsion from context-appropriate valuation.

  This framework preserves your core intuitions (mug case = preference, surgery framing ≠ preference) while providing a rigorous basis for distinguishing them and resolving the other cases. It grounds "preference" in rational endorsement and stability under normatively irrelevant changes, moving beyond simple choice observation.
