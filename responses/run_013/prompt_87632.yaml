prompt: |-
  For the past several weeks a small reading group I sit in on has been circling the topic of actions that are morally admirable without being morally required, and I've come to suspect that my verdicts on cases are more stable than any principle I can articulate, so I'd like you to tell me what, if anything, they add up to. Here are the verdicts. An off-duty lifeguard who sees a child drowning in a public pool and jumps in: I take that to be not merely admirable but required — if he can swim and no one else is there, it would be wrong of him to walk on, and "he was off duty" doesn't excuse him. A soldier who throws himself on a grenade to save his squad: admirable past anything I can imagine doing, but I don't think he was required to do it, and I don't think he'd have been wrong to dive for cover. A healthy adult who donates a kidney to a stranger: likewise admirable but not required. A person who gives away, say, eighty percent of a large salary to effective charities over decades: admirable, and again I can't bring myself to call it required, though I notice I feel worse about someone who gives nothing at all. An office worker who stays three hours late to help a colleague meet a deadline he could meet alone with effort: that's just decent, not in the same category at all, and it wouldn't be wrong to go home. And a surgeon who, alone at the scene of a crash, performs an emergency procedure at real risk to herself: required, in my view, for the same reason as the lifeguard. Now the pair that defeats me: I think the surgeon at the crash is required to act, but I do not think a surgeon is required to volunteer her weekends at a free clinic, even though the expected lives saved are comparable and the risk to her is comparable or less. Both cases seem to have the same benefit, the same cost, and the same competence in play, so I can't see what makes one required and the other optional — and yet I can't shake the verdicts.

  I've tried to state a principle myself and it keeps failing, so I'd rather you build the account from the verdicts. My first attempt was in terms of what I've been calling a demandability ceiling: an act is required when the benefit to others is large enough relative to the cost to the agent, and merely admirable when it exceeds that threshold. That seems to get the grenade, the kidney, and the late-night colleague right, but it either makes the surgeon's volunteering required (which I resist) or the crash procedure optional (which I resist), so it collapses on exactly the pair that puzzles me. My second attempt added that the act is required only when the agent is uniquely positioned — the only one who can do it, or one of very few — which saves the crash case and the lifeguard, but then it seems to make the stranger-kidney case required too, since the recipient dies without a donor and donors are scarce, and I don't believe that. A friend suggested adding that the agent must not have to undergo bodily invasion or surrender a life project, which would save the kidney and the volunteering, but it threatens the grenade case, where I want to say the soldier was permitted to live.

  So: is there a coherent principle, or a small set of them, that delivers my verdicts, including the pair I can't reconcile? If some principle saves all of them but needs three or four independent clauses, say so, and tell me which clauses earn their keep and which are ad hoc. If a simpler principle would force me to give up a verdict, tell me which one you'd sacrifice and why. I'd also like the account to pronounce on two matters I haven't settled. First, whether a supererogatory act, once done, generates any kind of entitlement or credit that makes later omissions less criticizable — if I give the kidney, am I thereafter more excused for giving nothing to charity, or is that thought a confusion? Second, whether the very existence of a category of the admirable-but-optional is compatible with holding that one of the available acts is morally better than the other; for if the grenade-diver's act is better than diving for cover, and diving for cover is nonetheless permissible, I can't quite see what "better" is doing there, and I want to know whether I must give up the word, give up the permissibility of diving for cover, or whether there's a way to keep both. Please state the principle precisely, tie each clause to the case that motivates it, and be honest about which of my verdicts it cannot accommodate.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a reading group discussing morally admirable but not required actions. They've shared specific case verdicts and are struggling to find a unifying principle. Their main challenge is reconciling why the surgeon at a crash is required to act, but volunteering weekends at a clinic isn't, despite similar costs and benefits.

  First, I need to analyze each case they mentioned. The lifeguard and crash surgeon are deemed required, while the soldier, kidney donor, charity giver, and office worker are not. The weekend clinic surgeon is also not required, creating a conflict with the crash scenario. 

  The user tried principles like a demandability ceiling and unique positioning, but both failed on the surgeon cases. Their friend's bodily invasion/life project clause didn't work for the grenade case. 

  Hmm, I should look for patterns. Notice that in the required cases (lurguard, crash surgeon), there's an immediate, unforeseen emergency where the agent is uniquely present. The lifeguard is off-duty but at the scene; the surgeon stumbles upon the crash. Contrast this with the weekend clinic: planned, ongoing need. The kidney donation involves bodily intrusion, but the grenade sacrifice doesn't, yet both are supererogatory. 

  The key might be the context of the agent's presence. In emergencies, being physically present creates a unique duty. For planned acts like volunteering, the duty doesn't arise even if the impact is similar. But why? Maybe because in emergencies, there's no time to coordinate others; the agent must act now. Whereas with the clinic, others could volunteer, or systemic solutions exist. 

  Also, consider the agent's role. The lifeguard has professional training, but even off-duty, his skills are relevant. The crash surgeon is a surgeon, so her expertise matters. But for the weekend clinic, her role doesn't obligate her beyond her job. 

  Then there's the bodily cost: kidney donation involves long-term sacrifice, while the grenade is a one-time act. But the user feels both are supererogatory, so bodily cost alone isn't decisive. 

  The user's unresolved questions: does supererogation create entitlement? Probably not; each act stands alone. And "better but permissible" – supererogation allows for acts that are morally superior without being obligatory. 

  Putting it together, the principles could be: 1) Immediacy and unique presence in emergencies create obligation. 2) Professional role applies in proximate emergencies. 3) Sacrifice beyond social role is supererogatory. 4) Bodily integrity limits demands. 

  This covers the crash surgeon (immediate, professional role nearby) vs. clinic (non-immediate, no proximate duty). The kidney case is supererogatory due to bodily sacrifice. Grenade: supererogatory despite physical risk because it exceeds role demands. 

  For their questions: no entitlement from past acts; permissible but better actions are coherent in supererogation. 

  Need to check if any verdicts are strained. The charity giver: giving 80% is supererogatory, which fits. Office worker: no obligation, correct. Soldier: permissible to dive, which aligns. 

  The only possible tension: if the crash surgeon's action is required due to immediacy, but what if she was just driving by, not stopped? The user specified "alone at the scene," so presence is key. 

  This seems to hold. The user's intuitive distinctions are preserved by combining immediacy, role, and bodily integrity without overcomplicating.
answer: |-
  Your intuitions reveal a consistent moral landscape. After analyzing your verdicts, I propose a principle with three core clauses that coheres with all your cases, including the surgeon pair. The key lies in distinguishing **proximate emergencies** from **systemic needs**, **role-derived duties**, and **bodily sovereignty**.

  ### The Principle
  An act is morally required (not merely admirable) if and only if:
  1. **Proximate Emergency Condition**: A severe, unforeseen harm is imminent and addressable only through immediate action; **AND**
  2. **Agent-Position Condition**: The agent is uniquely or exceptionally positioned to act due to (a) physical presence at the scene of the emergency, and/or (b) role-based responsibility triggered by proximity; **AND**
  3. **Cost Ceiling Condition**: The cost to the agent does not exceed moderate physical risk, non-bodily sacrifice (e.g., time, resources), or violation of core life projects—*unless* the agent has voluntarily assumed a role demanding higher sacrifice.

  If any condition fails, the act is supererogatory (admirable but not required).

  ---

  ### How the Principle Explains Your Verdicts
  1. **Off-Duty Lifeguard**:  
     - *(1) Proximate Emergency*: Child drowning is imminent.  
     - *(2) Agent-Position*: Lifeguard’s professional role is triggered by presence at the scene (even off-duty).  
     - *(3) Cost Ceiling*: Moderate physical risk (swimming) is below the ceiling.  
     → **Required**.

  2. **Soldier Jumping on Grenade**:  
     - *(1) Proximate Emergency*: Grenade threat is imminent.  
     - *(2) Agent-Position*: Soldier is present and role-bound.  
     - **BUT** *(3) Cost Ceiling*: Certain death exceeds the ceiling (role doesn’t demand *suicidal* sacrifice; diving for cover is expected).  
     → **Supererogatory**.

  3. **Kidney Donation to Stranger**:  
     - *(1) Proximate Emergency*: **Fails**—Chronic kidney failure is a systemic need, not unforeseen/imminent.  
     → **Supererogatory** (no further conditions needed).

  4. **Giving 80% to Charity**:  
     - *(1) Proximate Emergency*: **Fails**—Poverty is systemic, not proximate/imminent.  
     → **Supererogatory**.

  5. **Staying Late for Colleague**:  
     - *(1) Proximate Emergency*: **Fails**—Deadline pressure isn’t "severe harm".  
     → **Merely decent** (optional goodwill).

  6. **Surgeon at Crash Scene**:  
     - *(1) Proximate Emergency*: Life-threatening injuries require immediate action.  
     - *(2) Agent-Position*: Surgeon’s medical role is triggered by presence.  
     - *(3) Cost Ceiling*: Moderate risk (e.g., infection) is acceptable for a doctor in this context.  
     → **Required**.

  7. **Surgeon Volunteering Weekends**:  
     - *(1) Proximate Emergency*: **Fails**—Clinic addresses systemic, not imminent, needs (patients are scheduled, not unforeseeable).  
     → **Supererogatory** (despite comparable lives saved/risk).

  ---

  ### Why the Surgeon Pair is Resolved
  - **The critical distinction is the unforeseen/proximate vs. systemic nature of the harm**:  
    - At the crash, harm is *imminent* and *unavoidable without the agent’s immediate action*. The surgeon’s presence makes her a "captive responder".  
    - At the clinic, harm is *ongoing* and *structurally addressable* (others could volunteer; systems exist). Volunteering is a *long-term commitment*, not an emergency response.  
  - Your intuition tracks the moral urgency of being *uniquely trapped* by circumstance vs. *choosing* to address background injustice.

  ---

  ### Addressing Your Additional Questions
  1. **Does supererogation generate entitlement?**  
     - **No.** Past supererogatory acts (e.g., donating a kidney) do not license future omissions. Moral obligations reset contextually. Giving a kidney doesn’t excuse ignoring charity—each act stands independently. The thought that it might is a "moral ledger fallacy" (confusing morality with transactional accounting).

  2. **Is "better but permissible" coherent?**  
     - **Yes—and necessary.** Supererogation *requires* that some acts are morally better without being obligatory. "Permissible" means *not blameworthy*; "better" means *more praiseworthy*. The soldier diving for cover avoids blame; jumping on the grenade deserves praise. Rejecting this either:  
       - Collapses morality into minimal duty (losing admirable heroism), or  
       - Demands excessive sacrifice (making jumping on grenades obligatory).  
     Keep both: supererogation preserves moral richness.

  ---

  ### Strengths and Limitations
  - **Accommodates all your verdicts**: The surgeon pair, grenade/kidney asymmetry, and office worker case all align.  
  - **Non-ad-hoc clauses**: Each clause responds to multiple cases:  
    - *Proximate Emergency*: Explains crash vs. clinic, grenade vs. charity.  
    - *Agent-Position*: Explains lifeguard/crash surgeon vs. kidney donor.  
    - *Cost Ceiling*: Explains grenade (excessive cost) vs. lifeguard (moderate cost).  
  - **Limitation**: The "core life projects" criterion (in Cost Ceiling) is less rigidly defined. However, it’s motivated by your kidney donation verdict and aligns with Grenade case (soldier’s life project isn’t surrendered by diving for cover).

  ### If Forced to Sacrifice a Verdict
  The hardest to defend is **not requiring kidney donation** if we ignore the emergency/systemic distinction. If you abandoned that verdict, a simpler "cost/benefit + uniqueness" principle *would* make kidney donation obligatory. But your intuition here is ethically sound—bodily integrity deserves special protection, and systemic problems demand collective, not individual, solutions. The proposed principle protects this.

  ### Final Principle Statement
  > **An act is morally required iff:**  
  > (1) It prevents *severe, imminent, and unforeseeable harm*;  
  > (2) The agent is *uniquely positioned by presence/role* to act; and  
  > (3) The cost involves *no more than moderate risk, non-bodily sacrifice, or role-consistent duty*.  
  > **Otherwise, exceeding minimal duty is supererogatory.**

  This preserves your intuitive taxonomy while explaining why proximity and emergency create a moral "captivity" that planned generosity, however impactful, does not.
