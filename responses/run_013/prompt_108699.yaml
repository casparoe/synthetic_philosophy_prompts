  Joint Statement Draft:

  1. Common Ground:

  Both signatories endorse the following:

  1.1 The primary data for a science of consciousness are the observable expressions (verbal reports, button presses, etc.) of subjects that reflect their beliefs about their own experiences.

  1.2 The method of collecting these data does not, by itself, purport to establish the ultimate metaphysical nature of consciousness (e.g., whether it is physical or non-physical) or to resolve long-standing philosophical disputes about the existence of an irreducible subjective aspect of experience.

  1.3 The method can, however, identify patterns in the data that are relevant to understanding the structure and dynamics of subjects' expressed perspectives.

  1.4 Certain disputes are best addressed by empirical investigation, including:
     - The conditions under which subjects' reports are consistent or inconsistent.
     - The factors that influence the content of reports (e.g., attention, training, neural activity).
     - The relationship between reports and other behavioral and physiological measures.

  1.5 Conceptual disputes, such as whether consciousness can be reduced to physical processes, are not directly resolved by the data but may be informed by the empirical findings.

  2. Table of Residual Disagreements

  | Heterophenomenologist (H)                                                                 | First-Person Methodologist (F)                                                                 |
  |-------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | The data collected are about the subject's beliefs regarding their experiences; we remain agnostic about whether these beliefs correspond to any non-physical or irreducible experiential properties. | The data collected are reports of the subject's experiences; we take these reports as providing evidence about the experiences themselves, which are the target of explanation. |
  | The goal of the science of consciousness is to explain and predict the patterns in subjects' beliefs about their experiences, without assuming that these beliefs are about a distinct realm of phenomenal experiences. | The goal of the science of consciousness is to explain the subjective experiences of subjects, with their reports serving as a primary source of evidence about those experiences. |
  | Validation of any method must rely solely on third-person, behavioral, and neural data; we cannot validate a method by appealing to the experience itself because we cannot access it independently. | Validation of a first-person method can be achieved through a combination of intersubjective agreement, refinement through training, and coherence with third-person data, without circularity. |

  3. Cruxes under the Testimony Framing

  We now address the proposed framing: treating subjects' reports as testimony about their experiences, which is defeasible only by specified defeaters (e.g., evidence of inattention, deceit, or conceptual confusion). Under this framing, the core disagreements are:

  Crux 1: How to distinguish between a subject who misreports their experience and a subject whose experience is nonstandard (i.e., different from what we would typically expect)?

  Case: Two subjects with normal color vision are presented with a continuous color gradient from blue to green. They are asked to press a button when the color changes from blue to green. Subject A presses at wavelength 495nm; Subject B presses at 500nm. Both are attentive and sincere.

