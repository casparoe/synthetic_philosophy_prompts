  - H: We have no basis to say either subject is misreporting or that their experiences are nonstandard. We record the difference in their beliefs (as expressed by their button presses) and seek correlates (e.g., in neural processing). We remain agnostic about whether the difference is in experience or in the criteria for reporting.
  - F: In the absence of defeaters, we take the reports as testimony that their experiences of the boundary are different. We would predict that neural correlates of color perception will differ between the two subjects at the reported boundaries. If no such neural differences are found, F might consider this a potential defeater and re-examine the case (e.g., for conceptual confusion).

  Crux 2: Whether a criterion for reporting (e.g., a scale for pain intensity) can be validated without circularity, given that any validation must assume some relationship between reports and experience.

  Case: A new method is proposed for reporting the clarity of visual experience. Subjects are trained to rate clarity on a 1-10 scale when viewing stimuli under varying levels of visual noise. We then validate the method by correlating the ratings with:
     a) Behavioral performance (accuracy in identifying the stimuli).
     b) Neural activity in visual areas (e.g., fMRI).

  Predictions:
  - H: The method is validated if the ratings are reliable (consistent across trials) and correlate with behavioral and neural measures. There is no circularity because the reports are treated as one type of behavior to be explained, and the validation is about the coherence of the entire behavioral/neural model.
  - F: The method can be validated by the convergence of the ratings with behavioral and neural measures, because we assume that these measures are indicators of the same underlying experience. This is not circular because it is part of a broader, self-correcting methodology that includes triangulation across multiple sources of evidence. However, F acknowledges that a purely third-person validation would not capture the experiential aspect; thus, the first-person reports are indispensable.

