  I'm in a seminar on thought experiments in science — the whole question of how a thought experiment can tell us anything about the world when the scenario it describes can't actually happen — and I have to bring a case for discussion on Thursday, so what I'm really after is an example rather than a general argument. Here's what I've been chewing on alot over coffee: the ones that seem to do real work usually turn some knob all the way to the limit — no friction, a perfectly rigid rod, an infinite flat plane of charge, a clock with zero mass — and then read off what has to be true at the limit. My suspicion is that a verdict at the limit isn't a verdict at any finite setting, so what you've learned is about your idealization and not about nature. A friend of mine says that's backwards for at least some cases, that certain things only exist in the limit and that's the whole point, but I don't want the slogan, I want the case.

  So give me a case in that neighborhood: a specific thought experiment of the knob-to-the-limit kind where the epistemic payoff is genuinely up for grabs — either because the limit verdict is trustworthy for a reason I'm missing, or, better, because people have been quietly leaning on the infinite case while the finite cases all go the other way. Then tell me which way the case actually cuts and why, and say whether the idealization is doing the work or just clearing the underbrush. No museum pieces please — no Galileo's falling bodies, no twin paradox, no Maxwell's demon, no ladder-in-the-barn; I've heard all of those and I need something I can defend in front of people who've also heard them. I don't need reading suggestions or a lit review, just the case and the reasoning.
