answer: |-
  Here's a case that fits your criteria perfectly: **Coleman's "Big Bad Bank" thought experiment in classical electrostatics**. It explicitly twists a "knob to the limit" and the epistemic payoff is deeply contested, revealing the tension you suspect.

  ### The Experiment
  1.  **The Setup:** Consider a hollow, spherical shell of charge (like a balloon with charge spread uniformly on its surface).
  2.  **The Knob:** The **thickness** of the shell. Start with a shell of finite, non-zero thickness. Gradually imagine making the shell thinner and thinner, approaching the mathematical limit of a perfectly **infinitely thin shell** (a surface charge).
  3.  **The Question:** Is this charged shell stable? Will the electrostatic repulsion cause it to explode outwards, or will it hold together?

  ### The "Limit Verdict" (The Suspicious One)
  *   For the *infinitely thin shell* (the limit), the calculation is straightforward using Gauss's Law and surface charge density.
  *   **Result:** The electric field *inside* a uniformly charged, infinitely thin spherical shell is **exactly zero** everywhere. The electric field *just outside* the shell is perpendicular to the surface and finite.
  *   **Force on a Surface Element:** Consider a small patch of charge on the shell. It experiences repulsion from *all the other charge* on the shell. Crucially, because the field *inside* is zero, there is *no compensating inward force* from charge on the opposite side acting *through* the interior. The only electric force acting on the patch is the *outward* force due to the field *just outside*.
  *   **Limit Conclusion:** Therefore, **every part of the infinitely thin shell experiences a net outward electrostatic force**. The shell *must* be unstable and explode radially outward.

  ### The Finite-Thickness Reality (The Counterintuitive One)
  *   Now consider a shell of **finite thickness** (even an extremely thin one, as long as it has *some* volume).
  *   **The Calculation:** Within the material of the shell itself, the electrostatic force on a charge element must be calculated by integrating the forces from *all other* charge elements, both within the shell and elsewhere.
  *   **The Result:** Detailed calculations (using volume charge density and integrating Coulomb's Law) show that for a uniformly charged shell of *finite* thickness, **the forces are not purely radial and outward**. Crucially:
      *   Charges near the *inner* surface experience a significant **inward** force component from the majority of the charge, which lies *outside* them relative to the center.
      *   Charges near the *outer* surface experience a net outward force.
      *   **The overall result:** The dominant electrostatic forces within a finite-thickness shell are **tangential** (shear forces) and, importantly, **compressive** (inward-directed) near the inner surface. **The shell is electrostatically stable against radial expansion!** It might bulge or warp under tangential forces, but it won't simply explode outward purely from electrostatic repulsion.

  ### Why the Epistemic Payoff is Up for Grabs
  1.  **The Limit Lie?** The infinitely thin case seems to give a clear, definitive verdict: **Explosion**. But the physically realizable case (any finite thickness) gives the opposite verdict: **Stability** (against radial explosion). The limit result is *qualitatively wrong* about the radial stability of a real, physical shell.
  2.  **The Core Tension:** This directly confronts your suspicion. The limit case ("knob to zero thickness") doesn't just approximate the finite case; it predicts the *opposite* behavior regarding a crucial feature (radial stability). It seems to tell us about the idealization (a mathematical surface) and *not* about nature (a physical shell with volume).
  3.  **The Defense (Your Friend's Point):** Proponents of the limit argument might say: "Ah, but the *truly* unstable configuration *only exists* in the limit. The finite case is stable *because* it has thickness, but as thickness approaches zero, the system *aspires* towards instability, becoming infinitely sensitive to perturbations." They argue the limit reveals a *tendency* or a *latent instability* that becomes dominant only at infinity. The finite case is stabilized by a feature (thickness) that vanishes at the limit.
  4.  **The Counter-Defense:** Critics argue the limit calculation smuggles in an unphysical assumption: that charge confined to an infinitely thin surface *still behaves like volume charge* in terms of experiencing only the external field. In reality, charge on a physical surface *is* volume charge in a very thin layer; the internal forces within that layer *are* compressive. The limit calculation ignores the self-force structure inherent in *any* physical distribution of charge. The "instability" is an artifact of the infinite density and geometric abstraction, not a physical truth.

  ### How the Case Cuts
  *   **The Verdict:** The case powerfully illustrates **the danger of uncritically trusting the limit verdict.** The infinite-thickness limit gives a clear but **physically misleading** answer about radial stability for any realizable shell. The finite-thickness calculations, while messier, give the correct physical picture: **stability against radial explosion due to compressive electrostatic forces arising from the finite volume distribution.**
  *   **The Idealization's Role:** Here, the idealization **doesn't clear the underbrush; it actively misleads.** The "knob-to-the-limit" (thickness -> 0) doesn't simplify a complex reality to reveal an underlying truth; it *changes the physics* in a fundamental way by removing the very feature (the volume and the resulting internal force distribution) that governs the key stability property. It's a case where the idealization *creates* the phenomenon (radial instability) rather than revealing it.

  ### Why it's Perfect for Your Seminar
  *   **Specific & Non-Museum:** It's a concrete physics example, less famous than Galileo/Einstein/Maxwell, focusing squarely on the "knob-to-limit" mechanism.
  *   **Epistemic Tension:** The core question ("What does the limit *really* tell us?") is laid bare. The limit verdict is starkly different from the finite reality.
  *   **Ambiguous Payoff?** The payoff *is* genuinely contested: Does it reveal a latent instability tendency (your friend's view), or is it a complete artifact (your suspicion)? The physics community largely accepts the finite-thickness stability result, making the limit verdict empirically wrong, but the *interpretation* of why the limit fails is philosophically rich.
  *   **Idealization's Work:** It showcases an idealization that doesn't just simplify but actively distorts, making it a strong counterpoint to cases where limits *are* reliable (like frictionless planes approximating low-friction scenarios).

  **In short:** Coleman's Big Bad Bank demonstrates that a "knob-to-the-limit" thought experiment can spectacularly *mis*represent the behavior of any physically realizable system it aims to model, precisely because the limiting process removes essential physical structure. The epistemic payoff hinges on whether we interpret the limit as revealing a latent truth or creating a mathematical fiction. The physical evidence favors the latter interpretation for this specific case.
