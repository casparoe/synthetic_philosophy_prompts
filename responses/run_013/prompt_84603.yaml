prompt: |-
  I am a high school student, and this year I chair our Student Handbook Interpretation Committee: five students and one teacher, ten minutes per contested item, meeting weekly through the fall activities season, none of us with any training in philosophy or law. Our job is to rule on questions of the form "does X count as a Y under the handbook?" — whether a smartwatch is a phone for the no-devices rule, whether a skateboard is a vehicle for the hallway rule, whether a club's off-campus meetup is a school event for insurance purposes — and our rulings decide whether a club gets its funding and whether a student gets written up, so the stakes are real even though the questions sound silly. The teacher can overturn us and the assistant principal can overturn her, which I mention because I need to know which of our rulings are arguable and which are simply wrong.

  In my world history class we read a translation of the White Horse Dialogue, a Warring States text attributed to Gongsun Long, in which one speaker defends the claim that a white horse is not a horse: "'Horse' is what designates shape. 'White' is what designates color," he says, and when you ask for a horse a yellow or a black one will do, while when you ask for a white horse it will not. Our teacher told us the argument turns on a word that can mean either "is not the same as" or "is not a member of," and that the two speakers may simply be using different senses of it. That is precisely the fight we have every week: half the committee hears "a skateboard is not a vehicle" as the claim that skateboards are not vehicles, and half hears it as the claim that the word "skateboard" and the word "vehicle" are not interchangeable.

  Please take the role of a philosopher of language who knows classical Chinese disputation and the logic of definitions and category terms, and think carefully before you write anything. Begin by brainstorming, in a scratchpad I do not need to see, which distinctions from the dialogue are load-bearing for a committee like ours and which are scholarly detail we can safely drop, then compress the load-bearing ones into a procedure. Give me the result as a numbered list of exactly five items, each a sentence or two, with no introduction and no conclusion: (1) the one distinction from the dialogue that does the real work, stated so that a student who has never heard of the text can apply it; (2) the questions we ask in order, what counts as a sufficient answer to each, and where the procedure stops with a no; (3) the point at which the procedure hands the decision to a person because the question has become one about what the handbook ought to say rather than what its words mean, together with which steps are judgment calls dressed up as procedure; (4) two worked cases, one of which comes out in a way I will not like; and (5) what the procedure cannot do, including the case most likely to make it misfire. It has to be runnable in ten minutes by people with no philosophy background, and it should not depend on any source I would have to go look up.
reasoning: |-
  Hmm, the user is a high school student chairing a committee that interprets their student handbook. They're dealing with real-world cases like whether a smartwatch counts as a phone or if a skateboard is a vehicle. They recently read the White Horse Dialogue in history class and noticed parallels to their committee work - specifically how language ambiguities cause disagreements about category membership.

  The student needs a practical framework to resolve these handbook interpretation disputes quickly. They want me to create a numbered list of five items based on philosophical distinctions from the White Horse Dialogue, compressed into a ten-minute procedure usable by non-philosophers. The key requirements are: (1) extract the core distinction from the dialogue, (2) create a step-by-step questioning procedure, (3) identify where interpretation becomes policy-making, (4) provide two examples (including one unfavorable outcome), and (5) state limitations.

  The White Horse Dialogue revolves around the ambiguity between "is not identical to" (different terms) and "is not a member of" (category exclusion). This is precisely what plagues their committee - some members hear "skateboard is not a vehicle" as category exclusion while others hear it as term distinction.

  For the procedure: First, we need to isolate the handbook's definitional purpose. Then systematically compare attributes (shape/color in the dialogue → features/function in handbook cases). The stopping rules should prevent endless debate. Crucially, we must flag when interpretation bleeds into policy advocacy. 

  The examples should demonstrate the method's rigor: skateboards clearly fail the "transportation device" test under hallway rules, while smartwatches might unexpectedly qualify as phones if they share core functions like messaging. 

  Limitations include handbook gaps, terms defined by common understanding rather than features, and cases where multiple interpretations remain equally plausible after analysis. The procedure can't resolve value judgments disguised as definitional questions.
answer: |-
  Here is a five-item procedure distilled from the White Horse Dialogue's core insight, designed for your committee:

  1.  **The Core Distinction:**
      Separate the *defining purpose* of the term in the rule ("Y") from the *specific features* of the contested thing ("X"). Ask: "What problem was this rule *meant* to solve?" and "What core *function* or *risk* does 'Y' represent here?" Then ask: "Does X's *main use* or *effect* in this situation match that core purpose/function/risk?" Ignore whether X is *called* a Y in everyday language or whether it shares *all* features of typical Ys.

  2.  **The Procedure:**
      1.  **Purpose:** What harm/risk/problem is rule Y *clearly meant to address* in the handbook? (Stop if unclear; ruling likely arguable).
      2.  **Core Function/Risk:** What is the *essential function* of Y or the *specific risk* it poses that justifies the rule? (e.g., Vehicles: risk of collision/speed in halls? Distraction for phones? Liability scope for events?).
      3.  **X's Relevant Feature:** What is the *primary use* or *primary effect* of X *in the specific context* of the rule? (e.g., Skateboard in hall: transportation? Club meet off-campus: school-organized activity?).
      4.  **Match?** Does X's primary use/effect in this context *directly create* the specific harm/risk/problem the rule targets OR *directly fulfill* the essential function Y is defined by for this rule? If YES, X counts as Y. If NO, it does not. If UNSURE, see Step 5.

  3.  **The Judgment Call & Handoff:**
      Step 2 (identifying the rule's *core* purpose/risk) is the critical judgment call disguised as procedure. If the committee fundamentally disagrees on the rule's *primary* target (e.g., "no devices" rule: is it about distraction, cheating potential, or social isolation?), or if Step 1 yields no clear answer, the handbook is ambiguous. *This* is the point where interpretation ends and policy-making begins. Hand the case to the teacher/administrator with a note: "Committee deadlocked on core purpose of rule Y; clarification needed."

  4.  **Worked Cases:**
      *   **Skateboard as "Vehicle" (Hallway Rule):**
          1.  Purpose: Prevent collisions, tripping hazards, and high-speed movement in crowded halls.
          2.  Core Risk: Physical danger from wheeled/motorized personal transport devices moving fast.
          3.  X's Feature: Skateboard's primary use in a hall is personal transportation, moving faster than walking, using wheels.
          4.  Match? YES. It directly creates the core risk (collision, tripping, speed). *Ruling: Skateboard IS a vehicle.*
      *   **Smartwatch as "Phone" (No-Devices Class Rule):**
          1.  Purpose: Prevent distraction from communication, games, or non-educational content during instruction.
          2.  Core Function/Risk: Device's ability to receive/send messages, alerts, notifications, or run apps unrelated to classwork.
          3.  X's Feature: Smartwatch's primary effect is displaying notifications (texts, calls, apps) visibly/audibly on the wrist.
          4.  Match? YES. It directly fulfills the distracting communication/app function the rule targets, even if not called a "phone". *Ruling: Smartwatch IS a phone for this rule.* (You might not like this, but the core function matches the rule's purpose).

  5.  **Limitations & Failure Modes:**
      *   **Cannot create definitions:** Fails if the handbook term "Y" has *no* discernible purpose or if the purpose is genuinely ambiguous (Step 1).
      *   **Ignores "family resemblance":** Struggles with borderline cases where X shares *some* but not *all* core risk/function (e.g., a disabled student's electric mobility scooter in the hall - core function is mobility aid, *not* speed/risk, though it has wheels).
      *   **Overlooks common understanding:** Might produce unintuitive results if "Y" is clearly understood culturally in a way not captured by the rule's *stated* purpose (e.g., ruling a toy car isn't a "vehicle" might seem silly, even if technically correct by the hallway rule's purpose).
      *   **Misfires on:** Rules based purely on *categorization* without clear *purpose* (e.g., "Only club *officers* may use the supply closet" – is "officer" defined by title or function?) or where the *context* drastically changes X's core feature (e.g., a phone used *solely* as a medical monitor with all comms disabled).
