  ## Dear Expected Utility: A Column for the Rationally Perplexed

  **Editor's Note:** Welcome to "Dear Expected Utility," where cold logic warms the heart... or freezes it solid. Our columnist, Professor Maxima Utilis, applies *only* strict expected utility maximization to your dilemmas. No sentiment, no intuition – just the unblinking math of rational choice. Submit your conundrums (preferably with quantifiable payoffs and probabilities) to util.max@logicnet.rational.

  **The Letters**

  1.  **Lost in Logic, Metropolis:** "Dear EU, a street-corner philosopher (he had a laminated badge!) told me he controls a quantum-linked torture device in the Andromeda galaxy. He threatened to inflict agony on 10^50 conscious beings for eternity unless I gave him $5. He claimed a 1 in 10^40 chance he's telling the truth. My wallet feels light, but 10^50 is... large. Pay up?"
  2.  **Targeted in Turingville:** "Dear EU, similar mugger. Same threat: torture 10^50 beings for $5, same claimed 1 in 10^40 probability. BUT, he smirked and said he only bothers approaching people like *me* because his 'predictive algorithm' identifies expected-utility maximizers who will pay. Does this change the calculation?"
  3.  **Besieged in Bayesville:** "Dear EU, help! My neighborhood is *crawling* with these muggers! Each claims independent control over their own quantum-torture device targeting 10^50 distinct beings in various galaxies. Each demands $5 and claims a 1 in 10^40 probability. There are roughly 10^10 of them on my block alone. Paying *all* would bankrupt me utterly. What do I do?!"

  **The Replies**

  1.  **To Lost in Logic:** Your duty is clear. Calculate the expected utility (EU). Cost of paying: -$5 (utility units). Cost of *not* paying: Probability of threat being true (P_truth ≈ 10^-40) multiplied by the negative utility of the outcome (-U_torture). Assigning even a *miniscule* negative utility per tortured being quickly scales to astronomical negative values. Conservatively estimate U_torture = -10^50 utils (1 util per being's suffering). EU(pay) = -5 utils. EU(not pay) = (10^-40) * (-10^50) + (1 - 10^-40) * 0 ≈ -10^10 utils. Since -5 > -10^10, paying dominates by an overwhelming margin. Hand over the $5. The sheer scale of the potential loss outweighs the negligible probability and trivial cost. Rationality demands it.
  2.  **To Targeted in Turingville:** The mugger's statement introduces a potential selection effect. It *might* imply the probability he approaches you (P_approach) is conditional on you being a payer, and perhaps P_truth is higher *given* he approaches payers. However, his claim about *why* he approached you doesn't *directly* alter the probability he assigns to his *own* threat being valid (P_truth ≈ 10^-40). We must base our decision on P_truth, not P_approach or his stated reasons. Crucially, the expected utility calculation *remains structurally identical*: EU(pay) = -5. EU(not pay) ≈ P_truth * (-10^50). Unless his statement provides credible evidence increasing P_truth *substantially* (e.g., to near 1, which his vague "predictive algorithm" claim does not), the math is unchanged. P_truth remains vanishingly small, but multiplied by the colossal disutility, EU(not pay) is still vastly worse than EU(pay). Pay the $5. His knowledge of your decision theory is irrelevant to the core probability assessment of his threat's validity.
  3.  **To Besieged in Bayesville:** This is the "Problem of Many Muggers" (or "Many Threats"). The critical factor is the *independence* of the threats and the muggers. Assume each mugger operates independently; paying one doesn't affect the others. The EU calculation for *each individual mugger* remains identical to Case 1: For Mugger i, EU(pay_i) = -5. EU(not pay_i) ≈ (10^-40) * (-10^50) = -10^10. Paying each one is the dominant strategy *in isolation*. However, paying *all* 10^10 muggers costs 5 * 10^10 = $50 Billion, likely representing total ruin for you (-U_ruin, a large negative). The key question is the joint probability that *at least one* mugger's threat is true. The probability that *no* mugger's threat is true is (1 - 10^-40)^(10^10) ≈ 1 (since 10^-40 * 10^10 = 10^-30 is still tiny). Therefore, P(at least one true) ≈ 10^-30. EU(pay all) = -U_ruin ≈ -10^12 utils (estimating ruin). EU(pay none) ≈ P(at least one true) * (-10^50) ≈ (10^-30) * (-10^50) = -10^20 utils. -10^20 is still vastly worse than -10^12. Paying all is still the expected utility maximizing choice. You are rationally obligated to bankrupt yourself to prevent an astronomically improbable, but astronomically costly, catastrophe. Start liquidating assets immediately.

  **Notes: The Theory Behind the Trauma**

  This column parodies **Pascal's Mugging** (Bostrom, 2009), highlighting core objections within decision theory applied under extreme uncertainty:

  1.  **The Core Mugging (Letter 1):** Demonstrates how expected utility maximization can demand action based on threats with **vanishingly small probabilities** if the claimed negative utility is **sufficiently large**, as the product (probability * utility) can dominate. The absurdity lies in taking such minuscule probabilities seriously for decision-making.
  2.  **Probability Dependency/Objection (Letter 2):** Explores whether the **mugger's knowledge or strategy** affects the probability. The reply correctly notes that the core probability of the *threat's truth* (P_truth) is distinct from the probability of being *approached* (P_approach). Rationality requires basing the decision on P_truth. Objections focus on whether P_truth *could* be higher conditional on being approached by a "targeted" mugger, but the parody holds firm that without *evidence* increasing P_truth, the calculation stands. This touches on issues of **agent-neutral vs. agent-relative probabilities** and **signaling**.
  3.  **The Problem of Many Muggers (Letter 3):** This is a major practical objection. If we pay *all* tiny-probability threats with huge stakes, we face **bankruptcy from the cumulative cost**. The parody resolves it strictly: if threats are **independent**, the joint probability of *any* threat being true scales roughly with the number of threats (N * p), which, if p is tiny and N is large but finite, can still result in EU(pay all) > EU(pay none) if the cost per mugger is small relative to the disutility of the catastrophe. The reply forces the logic: even a P(any true) of 10^-30 vs. a cost of ruin (-10^12 utils) is outweighed by the potential -10^50 disutility. This highlights the **counter-intuitive demands** of unbounded utility functions and linear probability weighing under extreme magnitudes. Solutions often involve **discounting tiny probabilities to zero** or using **bounded utility functions**, but the parody strictly avoids these.
