  ### Decision Tree: Should Historians Sit in Judgment on the Past?

  This tree maps the logical space of the debate by forcing clear answers to concrete cases. Each branch node is a question about a specific historical scenario or principle. Follow your answers to reach a leaf position. No leaf is defined by preexisting labels—they emerge from the logic of the cases. Positions are separated by their commitments (e.g., on anachronism, moral standards, or audience), not by slogans.

  **How to Use the Tree**  
  1. Start at Node 1.  
  2. Choose the answer closest to your view.  
  3. Proceed to the next node or leaf.  
  4. At a leaf, read the name and its "most awkward commitment"—a consequence that opponents might attack.  

  Unoccupied combinations are noted where they arise. Pairs of leaves the tree *cannot* separate are flagged. The club’s three labels ("hometown rule," "open ledger," "discoverability test") appear in the leaves where they fit.  

  ---

  #### The Tree  
  **Node 1: Primary Task**  
  *When studying a past society with practices now widely condemned (e.g., child labor or restrictive gender roles), should historians focus on:*  
  - **A.** Explaining why people acted as they did (e.g., material conditions, beliefs)? → **Node 2**  
  - **B.** Evaluating whether those actions were morally wrong? → **Node 3**  

  **Node 2 (from A): Avoiding Judgment**  
  *In explaining the past, is it acceptable for a historian to use modern terms like "oppressive" or "exploitative" to describe practices (e.g., gender arrangements) that caused widespread suffering, even if no one used those words at the time and some contemporaries objected?*  
  - **A.** No—this smuggles in moral judgment and distorts historical understanding. → **Leaf 1: Strict Contextualism**  
    - *Most awkward commitment:* You cannot call the Atlantic slave trade "evil" in a classroom, even to convey its horrors, because "evil" is a modern moral term.  
  - **B.** Yes—if the term accurately describes the objective harm, regardless of historical vocabulary. → **Leaf 2: Descriptive Realism**  
    - *Most awkward commitment:* You risk portraying past societies as "backward" versions of the present, erasing how they understood themselves.  

  **Node 3 (from B): Scope of Judgment**  
  *When evaluating the past, what is the primary object of judgment?*  
  - **A.** Individual people (e.g., a factory owner who employed children). → **Node 4**  
  - **B.** Specific acts (e.g., employing children). → **Node 4**  
  - **C.** Systems or conditions (e.g., child labor laws or market structures). → **Node 5**  

  **Node 4 (from A/B): Judging Agents or Acts**  
  *For the museum label about the factory owner, which approach is fairest?*  
  - **A.** Call him "cruel"—his actions caused unnecessary suffering by any humane standard. → **Node 6**  
  - **B.** Explain his conduct was "unremarkable at the time"—judgment must reflect historical norms. → **Node 7**  
  - **C.** Both: note the suffering but emphasize context (e.g., "common then, unacceptable now"). → **Leaf 3: Dual Accountability**  
    - *Most awkward commitment:* You imply moral truth changes over time, making it unclear if historical figures were "wrong" or just "unlucky" to be born earlier.  

  **Node 5 (from C): Judging Systems**  
  *Should historians calculate an "unemployment rate" for a preindustrial society with no concept of unemployment?*  
  - **A.** Yes—the concept reveals hidden realities (e.g., underemployment in feudal economies). → **Leaf 4: Structural Presentism**  
    - *Most awkward commitment:* You impose modern economic frameworks on societies that organized work around kinship or duty, potentially misrepresenting their priorities.  
  - **B.** No—this forces the past into modern categories, obscuring its unique logic. → **Leaf 5: Systemic Contextualism**  
    - *Most awkward commitment:* You cannot compare economic suffering across eras (e.g., medieval famines vs. modern recessions) because each society’s "suffering" is untranslatable.  

  **Node 6 (from A): Condemning Individuals/Acts**  
  *Should historians apply modern words for mass atrocities (e.g., "genocide") to past killings if the concept didn’t exist then?*  
  - **A.** Yes—the moral reality matters, not the vocabulary. → **Leaf 6: Open Ledger**  
    - *Most awkward commitment:* Future historians may condemn 21st-century practices (e.g., factory farming) as "barbaric" using standards we can’t imagine today—and you must accept this as legitimate.  
  - **B.** No—this projects modern ideas onto people who couldn’t have understood them. → **Node 8**  

  **Node 7 (from B): Defending Historical Norms**  
  *Should we treat past norms as the moral standard itself, or only as evidence of what people knew?*  
  - **A.** As the standard—people can only be judged by norms of their time. → **Leaf 7: Hometown Rule**  
    - *Most awkward commitment:* You cannot condemn Thomas Jefferson for owning slaves, since it was legal and normal in his context—even if his contemporaries like Benjamin Franklin criticized it.  
  - **B.** As evidence—the question is whether better arguments were discoverable then. → **Leaf 8: Discoverability Test**  
    - *Most awkward commitment:* You must research obscure historical critics to decide if a moral failing was "avoidable" (e.g., was there a 5th-century BCE Greek philosopher who opposed slavery?).  

  **Node 8 (from B): Anachronism and Audience**  
  *Does the historian’s audience affect whether judgment is appropriate?*  
  - **A.** Yes—e.g., a national curriculum should avoid moral labels to foster unity; a descendant community deserves acknowledgment of harm; scholars should stay neutral. → **Leaf 9: Pragmatic Relativism**  
    - *Most awkward commitment:* You concede that historical "truth" depends on who is listening, undermining claims to objectivity.  
  - **B.** No—judgment (or its absence) must be consistent across audiences. → **Leaf 7: Hometown Rule**  
    *(Note: This path rejoins Leaf 7 because consistency requires deferring to historical norms.)*  

  ---

  #### Leaf Positions
  1. **Strict Contextualism** (from Node 2A)  
     Never judge; explain using only period-appropriate concepts.  
     *Most awkward commitment:* You must describe Nazi Germany in its own terms (e.g., "ethnic purification"), avoiding modern moral language like "racist" in scholarly work.  

  2. **Descriptive Realism** (from Node 2B)  
     Use modern terms to describe harm, but avoid explicit moral verdicts.  
     *Most awkward commitment:* You can call ancient empires "imperialist" but not "unjust," creating tension between description and evaluation.  

  3. **Dual Accountability** (from Node 4C)  
     Balance historical context with modern moral insights.  
     *Most awkward commitment:* You imply the factory owner was both "a product of his time" and "guilty"—a contradiction if moral truth is timeless.  

  4. **Structural Presentism** (from Node 5A)  
     Judge systems by modern standards (e.g., apply "unemployment rate" to the past).  
     *Most awkward commitment:* You label preindustrial economies "underdeveloped," ignoring that growth wasn’t their goal.  

  5. **Systemic Contextualism** (from Node 5B)  
     Judge systems only by their era’s norms and concepts.  
     *Most awkward commitment:* You cannot say Athenian democracy was "flawed" for excluding women—it was exemplary *for its time*.  

  6. **Open Ledger** (from Node 6A)  
     Judge the past by today’s best standards; accept future judgment of our era.  
     *Most awkward commitment:* You must agree that future historians might rightly condemn 21st-century democracy for permitting inequality.  

  7. **Hometown Rule** (from Node 7A or Node 8B)  
     Judge people/acts only by their society’s prevailing norms.  
     *Most awkward commitment:* You excuse Columbus’s atrocities because Spanish colonial brutality was normalized.  

  8. **Discoverability Test** (from Node 7B)  
     Judge by whether better arguments were available at the time.  
     *Most awkward commitment:* You blame early industrialists for ignoring critics of child labor, even if those critics were fringe voices.  

  9. **Pragmatic Relativism** (from Node 8A)  
     Tailor judgment to the audience (e.g., soften criticism in textbooks).  
     *Most awkward commitment:* You might downplay slavery’s brutality in a national museum to avoid controversy.  

  ---

  #### Unoccupied Combinations & Collapsed Labels  
  - **Unoccupied: Systemic Open Ledger**  
    Combining "judge systems" (Node 5C) with "condemn using modern terms" (Node 6A) is absent. *Diagnosis:* Unattractive—it demands condemning entire economies by foreign standards (e.g., calling feudalism "oppressive") without nuance. Most avoid this as overly dogmatic.  
  - **Unoccupied: Timeless Individual Accountability**  
    Judging individuals (Node 4A/B) by "discoverable" standards (Node 7B) is absent. *Diagnosis:* Unexplored—the tree reveals a gap between blaming individuals (rarely defended) and judging systems.  
  - **Collapsed Labels:**  
    - "Hometown rule" is **Leaf 7** (judging by period norms).  
    - "Open ledger" is **Leaf 6** (judging by present standards).  
    - "Discoverability test" is **Leaf 8** (judging by available arguments).  
    None collapse into each other—all are distinct leaves. The tree reaches all three from Node 1.  

  ---

  #### Pairs the Tree Cannot Separate  
  - **Leaf 7 (Hometown Rule) and Leaf 5 (Systemic Contextualism)**  
    Both reject anachronistic judgment, but the tree cannot split them cleanly because they differ only in *scope* (people/acts vs. systems), not logic. Debaters must resolve this separately.  

  ---

  ### Reading Guide for Debaters  
  **How to Locate Your Position**  
  1. Start with Node 1. Your view on history’s primary task (explanation vs. evaluation) sets the initial path.  
  2. Answer each node based on concrete cases (e.g., the museum label or genocide terminology). Avoid abstract theories—the cases force distinctions.  
  3. At a leaf, test its "most awkward commitment." If you reject it, backtrack to the last node and choose the alternative.  

  **Hardest Leaf to Defend**  
  - **Leaf 9 (Pragmatic Relativism):** Requires justifying why historical truth changes based on audience (e.g., downplaying injustice in a textbook). Opponents will call this dishonest or manipulative.  

  **Hardest Leaf to Refute**  
  - **Leaf 8 (Discoverability Test):** It avoids both anachronism ("they should’ve known better!" sounds fair) and relativism (it uses historical evidence). Attack its reliance on spotty records—e.g., how many objectors prove a norm was "discoverable"?  

  **Key Strategy**  
  - If you oppose judgment, push toward **Leaves 1, 2, or 5**—they avoid moral verdicts.  
  - If you support judgment, **Leaves 6, 7, or 8** offer clear standards. Use the mirror case (future historians judging us) to trap opponents: if they condemn the past but exempt the present, they’re inconsistent.  

  This tree isolates core disagreements. Use it to find your position, then refine arguments against the "awkward commitments" of rival leaves.
