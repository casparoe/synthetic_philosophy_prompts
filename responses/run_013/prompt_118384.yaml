  - Explaining why someone acted vs. deciding if the act was wrong.
  - Judging a person vs. an act vs. a state of affairs (law/market).
  - Treating the norms of the period as the standard vs. only as evidence about what the agent could have known.
  - Whether the historian's own era is exempt from the standard applied to the past.
  - The intended audience (national curriculum, descendant community, scholarly journal).

  Homemade labels to appear in the tree:
  - Hometown rule: a person answers only to the norms of their own time and place.
  - Open ledger: the past answers to whatever standards we can defend now.
  - Discoverability test: the question is what arguments were available to be found (neither what norms were held nor what we hold).

  The tree must reveal if any of these labels collapse into the same position.

  We start by building the logical space. We will design the branch nodes and then assign the leaves.

  Branch Nodes (Questions):

  1. **Primary Purpose of History**: Is the primary purpose of historical inquiry to (A) understand the past on its own terms, or (B) to draw lessons for the present and future? (This sets the stage for the tension between explanation and judgment.)

  2. **Scope of Judgment**: When we speak of "judgment", are we primarily judging (A) the moral character of individual agents, (B) the moral quality of specific acts, or (C) the moral quality of social structures or states of affairs? (This separates the object of judgment.)

  3. **Standard for Judgment**: What standard should be used for moral judgment? (A) The norms and values of the historical agent's own society (hometown rule), (B) the norms and values of the historian's own time (presentism), or (C) a set of timeless moral truths? (This distinction is key.)

  4. **Relevance of Contemporary Objections**: When considering a past practice (e.g., slavery), if there were contemporary objectors, does that change how we judge the practice? (A) Yes, because it shows that the moral failing was discoverable then, or (B) No, because the majority norms are the relevant standard, or (C) It is irrelevant to the moral judgment because the moral truth is independent.

  5. **Anachronistic Concepts**: Is it acceptable to use concepts (like "oppression", "unemployment", or "genocide") that did not exist in the past to describe past events? (A) Yes, because these concepts capture real features of the past, (B) No, because it imposes alien categories and distorts understanding, or (C) Only if we can show that the concept, even if not available then, is necessary to capture the reality.

  6. **Museum Label Case**: For the factory owner who employed children, the museum label should: (A) Describe his conduct as cruel (because it caused suffering we now recognize as wrong), (B) Explain that his conduct was unremarkable at the time (to avoid anachronism), or (C) Do both: describe the suffering but note the context.

  7. **Mirror Case**: Should historians of the future judge our current practices (e.g., fossil fuel use) by the standards of their time? (A) Yes, because moral standards progress and future historians will have better insight, (B) No, because we can only be judged by the standards of our time, or (C) They should judge us by timeless standards, if such exist.

  8. **Audience Consideration**: Does the appropriate approach to judgment depend on the audience? (A) Yes: for a national curriculum we should avoid anachronistic condemnation to foster national pride, for a descendant community we should acknowledge historical injustice, and for a scholarly journal we should strive for objectivity. (B) No: the historical truth is the same regardless of audience.

