     - B: By revelation or intuition, which might not have been available → Leaf 5: Timeless Moralism
        - Most awkward commitment: You judge that past people were morally deficient for not knowing truths that were revealed only later or to you.

  Node 5: What is the source of moral standards for the past? (not necessarily for our time)
     - A: The norms of the past → Leaf 6: Hometown Rule (Past Only)
        - Most awkward commitment: You can condemn practices in the present that were accepted in the past, but you must accept that the past is immune to condemnation by our standards.
     - B: The norms of the present → Leaf 7: Open Ledger
        - Most awkward commitment: You must accept that future historians will condemn us by their standards, which might seem as unfair to us as our condemnation of the past feels to contextualists.
     - C: Timeless moral truths → Leaf 8: Timeless Moralism (Past Only)
        - Most awkward commitment: You claim to know timeless truths that past societies did not, and you apply them only to the past, exempting your own society from being judged by them in the future.

