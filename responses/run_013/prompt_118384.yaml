  1. Whether to call a past society's labour or gender arrangements oppressive when nobody then used that vocabulary and some people then objected.
  2. Whether a museum label for a local factory owner who employed children should say that he was cruel or explain that his conduct was unremarkable at the time.
  3. Whether to apply a word for mass atrocity to killings that occurred before the word existed.
  4. Whether to impose present-day economic categories on a society that had no such concepts.
  5. The mirror case: how a historian three centuries from now ought to treat our own practices.

