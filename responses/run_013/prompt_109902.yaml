answer: |-
  Here’s a battle-tested 75-minute plan designed for your interdisciplinary group, prioritizing conceptual clarity over exhaustive formalism while keeping all disciplines engaged. Sequence is critical to avoid early derailments.

  ### **Teaching Plan: Whiteboard Sequence (75 mins)**  
  *(Key: [M] = Must address misconception here)*

  1.  **Min 0-10: Hook & Mercury Case (No Formalism Yet)**  
      *   **Board:** Sketch Mercury's orbit; state empirical fact: "43 arcsec/century anomaly vs. Newtonian prediction."  
      *   **Narrative:** "1915: Einstein derives GR equations. Prediction: *exactly* 43 arcsec. Physicists declare GR confirmed. Paradox: Astronomers *knew* the 43 arcsec for 70 years. How can known data confirm a new theory?"  
      *   **Why now?** Tangible history grounds the problem. Avoids abstract intimidation. Historian/Physicist buy-in secured.  
      *   **[M1 - Statistician Interrupt]: "But if it was known, P(e)=1! Confirmation is impossible!"**  
          *   *Shut down firmly:* "Hold that thought! We *will* formalize this rigorously. Right now, agree the historical actors *felt* it confirmed GR. We need to explain that intuition within confirmation theory."

  2.  **Min 11-20: Bayesian Confirmation Basics**  
      *   **Board:** `P(H|e) = [P(e|H) * P(H)] / P(e)` → `Confirmation = P(H|e) > P(H)` → `Requires P(e|H)/P(e) > 1`.  
      *   **Focus:** *Likelihood Ratio* as the engine: `λ = P(e|H) / P(e|¬H)`. Stress: `λ > 1` iff confirmation.  
      *   **Why now?** Paradox *cannot* be sharply stated without `λ`. `P(e)=1` kills `P(H|e) > P(H)` trivially, but `λ` survives. Statisticians satisfied formalism is coming.  
      *   **[M2 - Philosopher]: "Isn't ¬H vague?"**  
          *   *Acknowledge & defer:* "Crucial point! For now, take ¬H as 'the space of plausible pre-GR theories'. We'll refine this if needed later."

  3.  **Min 21-30: Formalize the Paradox via `λ`**  
      *   **Board:** Apply to Mercury: `e = 43 arcsec`.  
          *   Pre-GR: `P(e|GR) ≈ 0?` (No theory predicted it!) → Actually, `P(e|GR) = 1` (GR entails it).  
          *   Pre-GR: `P(e|¬H)` = ? Astronomers observed it → `P(e) ≈ 1` → `P(e|¬H) ≈ 1` (It happened under Newton+perturbations).  
      *   **Paradox Stated:** `λ = P(e|H)/P(e|¬H) ≈ 1/1 = 1` → **No confirmation!** Contradicts historical/scientific judgment.  
      *   **Why now?** Requires `λ` to show the *core* formal conflict, even with `P(e)=1`. Statisticians see the math; others see the contradiction starkly.

  4.  **Min 31-45: Introduce "Acquired" vs. "Digested" (Your Distinction)**  
      *   **Board:**  
          *   **Acquired Evidence:** Raises `P(H)` at time `t`. Dynamically impacts beliefs. (`e` is *news`).  
          *   **Digested Evidence:** Fully absorbed into background knowledge `K`. No longer updates `P(H)`; it *is* `K`. (`e` is non-informative).  
      *   **Apply to Mercury:**  
          *   **1882 (Le Verrier):** `e` is **Acquired**! Shocking news → `P(Newtonian Theories)` drops significantly.  
          *   **1915 (Pre-GR Derivation):** `e` is **Digested**. Part of `K` for 30+ years. `P(e|K) = 1`, `P(e|¬H ∧ K) ≈ 1`.  
      *   **Why now?** Paradox arises when `e` is **Digested** *before* `H` is formulated. Your distinction avoids counterfactuals! It's about *temporal epistemic status*.  
      *   **[M3 - Philosopher]: "Isn't this just `K` vs. `K-e`?"**  
          *   *Refine:* "Close! But `K-e` suggests removal. I'm emphasizing the *process*: from surprising `e` (Acquired, belief-changing) to mundane `e` (Digested, belief-constituting). We *update* on Acquired evidence; we *presuppose* Digested evidence."

  5.  **Min 46-60: Weighing Example Candidates & Your Distinction's Strength**  
      *   **Verdict on Your Candidates:**  
          *   **Linguistic:** *Reject for core example.* You're right – certainty feels constitutive, not learned evidence. Risk of seeming "trick." Save for discussion if raised.  
          *   **Cryptographic:** *Good backup, weaker than Mercury.* Less intuitive historical weight. `P(e|H)=1` is clear, but "digestion" less dramatic.  
          *   **Mercury:** **USE THIS.** Its flaws are overblown. Einstein *knew* of `e`, but GR's derivation was independent. The **key point**: For the *scientific community* assessing GR *in 1915*, `e` was **Digested** background knowledge. Its confirming power came *despite* this. Your distinction handles this perfectly.  
      *   **What Makes Mercury Carry the Session?**  
          *   **Has:** Historical reality, clear math (`λ`), dramatic digestion (70 years!), undisputed confirming intuition.  
          *   **Lacks:** Constitutive certainty, trivial entailment. It's *paradigmatic* learned evidence that became background.  
      *   **Can Your Distinction Bear Weight?**  
          *   **Yes, as the spine.** It cleanly separates the *learning event* (Acquired → Confirmation then) from the *problem state* (Digested → Paradox now).  
          *   **Needs Shoring Up:** Explicitly link "Digested" to `K`: `P(e|K) = 1`, `P(e|H ∧ K) = P(e|H)`, `P(e|¬H ∧ K) = P(e|¬H)`. It's *in* `K`.  
          *   **Collapse into Counterfactual?** **No!** The counterfactual ("What would `P(e)` be without `H`?") asks agents to imagine ignorance. Your distinction describes their *actual* epistemic timeline. It's descriptive, not hypothetical. It explains *why* the counterfactual seems plausible (you imagine when `e` was Acquired).

  6.  **Min 61-70: Addressing "Fixes" & Scope Limitation**  
      *   **Board:** Briefly list common approaches (Counterfactual `P(e)`, Logical Omniscience, Changing `K`).  
      *   **Focus:** Show how your distinction frames the debate. Counterfactual tries to *simulate* the time when `e` was Acquired. Logical Omniscience tries to make `P(e|H)=1` known earlier.  
      *   **OPENLY REFUSE:**  
          *   Deep dives into specific counterfactual semantics (e.g., How to model ignorance? Stalnaker vs. Lewis?). "That's crucial but seminar-worthy!"  
          *   Technical solutions like Garber's (logical learning). "Requires formal machinery beyond scope today."  
          *   Debating Einstein's precise psychological state re: Mercury in 1907. "Historians, let's talk later!"  
      *   **[M4 - Statistician]: "Can't we just use `P(e|H)/P(e|¬H)` conditional on `K-e`?"**  
          *   *Acknowledge & limit:* "That's the counterfactual move! It's popular. But *how* do we define `K-e` rigorously? How do we 'forget' `e` *without* forgetting its logical consequences? That's the rabbit hole we *won't* jump into today. Our 'Digested' concept shows *why* this move is tempting but problematic."

  7.  **Min 71-75: The Landing Question**  
      *   **Question for the Room:** *"If digested evidence (e in K, P(e|K)=1) truly cannot confirm a new hypothesis H (since λ ≈ 1), how do we explain the overwhelming historical consensus that Mercury's perihelion motion* ***did*** *confirm General Relativity? Does this mean confirmation is fundamentally psychological/historical, or is there a flaw in the Bayesian formalization?"*  
      *   **Why this works:**  
          *   Forces integration: History (consensus), Philosophy (status of confirmation), Statistics (λ≈1), Physics (GR success).  
          *   Probes if they see the *tension* between formalism and practice, which is the heart of the paradox.  
          *   Reveals if they grasp that "Digested" creates the formal problem *despite* the intuitive confirmation.

  ### **Key Discipline Management**
  *   **Historians:** Hooked by Mercury first. Avoid formalism min 0-20. Your distinction ("Digested") speaks to historical process.
  *   **Statisticians:** Get `λ` formalism by min 20. Acceptable to lose them briefly during historical narrative (Min 0-10) and philosophical fixes (Min 61-70). They need the core math (Min 21-45).
  *   **Philosophers:** Get conceptual nuance (Acquired/Digested, scope limits). Prevented from derailing into counterfactual semantics prematurely.
  *   **Physicist:** Sees GR handled respectfully with real example.

  This sequence builds stepwise, isolates misconceptions as they arise, leverages Mercury's strengths while acknowledging complexities only to bracket them, and gives your "Acquired/Digested" distinction central stage without collapsing into counterfactuals. The final question exposes whether the paradox's core tension has landed.
