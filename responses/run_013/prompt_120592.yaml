  ### IN THE SUPREME COURT OF THE COMMONWEALTH OF NEW ALBION  

  **PRACTICE DIRECTION NO. 7 OF 2024**  
  **LOGIC OF PROOF IN CRIMINAL AND CIVIL PROCEEDINGS**  

  **Issued under Section 22(1) of the Judiciary Act 1958 by the Lord Chief Justice, with the concurrence of the Judicial Council.**  

  **Date of Direction:** 1 May 2024  
  **Effective Date:** 1 July 2024  

  ---

  #### 1. **Introduction**  
  1.1. This Practice Direction governs the application of the Logic of Paradox (LP) as the formal system for evaluating evidence, argument, and verdicts in all courts of the Commonwealth of New Albion.  
  1.2. LP is a three-valued logic wherein any proposition may be *true*, *false*, or *both*. An interpretation *designates* a proposition if it assigns it *true* or *both*.  
  1.3. Validity is defined as follows: an argument is valid if, and only if, no interpretation designates every premise while failing to designate the conclusion.  
  1.4. This reform ensures reasoned deliberation in the face of apparent contradictions, without commitment to explosive inference (whereby *A* and *not-A* entail any arbitrary proposition).  

  ---

  #### 2. **Standard of Proof**  
  2.1. In criminal trials, the prosecution must establish guilt *beyond reasonable doubt*.  
  2.2. A "reasonable doubt" is one grounded in evidence or lawful inference. Under LP, a doubt may be *both* well founded *and* not well founded.  
  2.3. Where the fact-finder concludes that the evidence renders guilt *both* proved *and* not proved, the doubt is designated (as it is *true* or *both*). The prosecution thus fails to discharge its burden.  
  2.4. In civil cases, the standard remains the *balance of probabilities*. A fact may be designated even if *both true and false*, provided the evidence favours its designation.  

  ---

  #### 3. **Permissible and Impermissible Inferences**  
  3.1. The Law of Excluded Middle (LEM) is retained: "A or not-A" is always designated. Disjunction introduction (from *A*, infer *A or B*) remains valid.  
  3.2. **Disjunctive syllogism is invalid**: From "A or B" and "not-A", *B* does not follow.  
  > *Example*:  
  > - Premise 1: The assailant was Ms X *or* Mr Y (designated).  
  > - Premise 2: Ms X was *not* the assailant (designated).  
  > - Conclusion: Mr Y was the assailant (not necessarily designated).  
  > If Ms X was *both* the assailant *and not* the assailant (e.g., due to ambiguous identification), Premise 2 is designated (as "not-A" is *both* when *A* is *both*). Yet Mr Y may be entirely innocent (i.e., *false*). Thus, the conclusion is unsafe.  
  3.3. **Modus ponens fails for the material conditional** (defined as "not-A or B"). From "A" and "if A, then B", *B* does not follow.  
  > *Example*:  
  > - Premise 1: The defendant was at the crime scene (designated: *both* true, due to witness conflict).  
  > - Premise 2: *If* the defendant was at the crime scene, *then* they committed the offence (designated: e.g., expert testimony).  
  > - Conclusion: The defendant committed the offence (not necessarily designated).  
  > Premise 2 ("not-A or B") is designated as "not-A" is *both* (when *A* is *both*). Yet *B* (guilt) may be *false* if alternative explanations exist.  

  ---

  #### 4. **Verdicts**  
  4.1. Verdicts must reflect the three-valued nature of proof:  
  - **Guilty** (designated: evidence establishes guilt).  
  - **Not Guilty** (designated: evidence fails to establish guilt).  
  - **Both Guilty and Not Guilty** (designated: evidence establishes guilt *and* fails to establish guilt).  
  4.2. A verdict of "Both" must be:  
  4.2.1. *Recorded* in the register as "Guilty and Not Guilty".  
  4.2.2. *Pronounced* in open court as "We find the defendant guilty and not guilty".  
  4.2.3. *Reported* in neutral terms (e.g., "The jury returned a verdict of both").  
  4.3. In civil cases, analogous verdicts (e.g., "Liable and Not Liable") apply.  

  ---

  #### 5. **When a Verdict of "Both" is Permitted**  
  5.1. A verdict of "Both" is reserved for cases involving *genuine contradictions*, distinguished from *merely apparent contradictions* by the following criteria:  
  5.1.1. **Self-reference**: E.g., a bylaw stating, "This bylaw does not apply to itself."  
  5.1.2. **Self-applicable rules**: E.g., a statute defining "vagueness" vaguely.  
  5.1.3. **Borderline vagueness**: E.g., determining whether a 0.5 mg/L toxin concentration is "lethal" when scientific consensus places the threshold at 0.4–0.6 mg/L.  
  5.2. Ordinary disputed facts (e.g., conflicting eyewitness accounts) do not qualify, as they reflect evidential gaps, not true contradictions. A "Both" verdict requires intrinsic inconsistency in the *proposition itself*, not merely in the evidence.  

  ---

  #### 6. **Downstream Consequences**  
  6.1. **Sentencing**:  
  6.1.1. Where a defendant is found *both guilty and not guilty*, the court may impose a conditional or suspended sentence. Punishment must not exceed half the maximum applicable to a "Guilty" verdict.  
  6.2. **Appeals**:  
  6.2.1. A verdict of "Both" may be appealed on grounds that the contradiction was not genuine (per §5).  
  6.2.2. An appellate court may affirm, vary, or set aside the verdict, applying LP to all inferences.  
  6.3. **Double Jeopardy**:  
  6.3.1. A verdict of "Both" constitutes an acquittal for retrial purposes, as the prosecution failed to exclude reasonable doubt.  
  6.4. **Precedent**:  
  6.4.1. Judgments relying on designated-but-false premises (e.g., a valid argument concluding *both*) bind inferior courts. Validity under LP suffices, irrespective of the truth-value of premises.  

  ---

  #### 7. **The Law of Non-Contradiction**  
  7.1. LP validates the Law of Non-Contradiction (LNC): "not both A and not-A" is *designated* in all interpretations.  
  7.2. However, LNC may itself be *both true and false* (e.g., when *A* is *both*).  
  7.3. Courts may thus convict using LNC as a premise where designated, even if *false* in part.  
  > *Example*:  
  > - Premise: "The defendant cannot be both at the scene and not at the scene" (designated under LNC).  
  > - Evidence: The defendant was *both* at the scene *and not* at the scene (e.g., via quantum-tunnelling theory).  
  > The premise remains designated (as LNC is always designated), supporting guilt if corroborated.  

  ---

  #### 8. **Conclusion**  
  8.1. This reform upholds rigorous proof while accommodating rare dialectical realities.  
  8.2. In practice, most cases will yield classical verdicts ("Guilty" or "Not Guilty"), as ordinary facts lack true contradictions.  
  8.3. The public may be assured that the foundational principles of justice—fairness, evidence-based reasoning, and the presumption of innocence—remain intact.  

  **THE RT. HON. SIR ALISTAIR THORNE**  
  Lord Chief Justice of New Albion  

