  Below is a complete quiz handout designed to help participants identify their underlying views in population ethics based on concrete cases, without relying on labels. Each question presents a scenario with answer options focusing on moral wrongness and whether anyone was wronged. The scoring key maps answer patterns to specific positions, flags unexplored/incoherent combinations, and notes which views the quiz cannot separate.

  ---

  ### **Quiz: Which View About Wronging Future People Do You Actually Hold?**
  *Instructions: For each scenario, select the option that best reflects your judgment. Answer based on your immediate moral intuition, not theoretical labels.*

  1. **Pregnancy with Medication**  
     A pregnant woman is warned that continuing her medication will cause her child to be born with permanent hearing loss. If she stops the medication, she will miscarry. She continues the medication, and the child is born with hearing loss. The child grows up glad to be alive and does not resent her mother.  
     - A. The mother did nothing wrong.  
     - B. The mother did something wrong, and she wronged the child.  
     - C. The mother did something wrong, but she did not wrong any particular person.  

  2. **Conceiving a Child with a Barely Worthwhile Life**  
     A couple knows that if they conceive a child now, the child will have a life barely worth living (e.g., constant suffering but net-positive happiness). The only alternative is not conceiving at all. They conceive the child, who grows up agreeing their life is barely worthwhile but is glad to exist.  
     - A. The couple did nothing wrong.  
     - B. The couple did something wrong, and they wronged the child.  
     - C. The couple did something wrong, but they did not wrong any particular person.  

  3. **Energy Policy Affecting Future Generations**  
     A government chooses an energy policy that will make the world much poorer in 200 years. This policy also changes which people exist (due to altered economic conditions). Future people have lives worth living but are much worse off than those who would have existed under a different policy.  
     - A. The government did nothing wrong.  
     - B. The government did something wrong, and it wronged the future people.  
     - C. The government did something wrong, but it did not wrong any particular person.  

  4. **Embryo Selection with Mild Impairment**  
     A couple undergoes IVF and has one viable embryo, which will result in a child with a mild impairment (e.g., correctable cleft palate). The only alternative is not having a child. They implant the embryo, and the child grows up glad to be alive.  
     - A. The couple did nothing wrong.  
     - B. The couple did something wrong, and they wronged the child.  
     - C. The couple did something wrong, but they did not wrong any particular person.  

  5. **Savior Sibling**  
     A couple conceives a child specifically to donate tissue to save their sick older child. The donor child has a life worth living, donates the tissue, and grows up glad to be alive without resenting their parents.  
     - A. The couple did nothing wrong.  
     - B. The couple did something wrong, and they wronged the donor child.  
     - C. The couple did something wrong, but they did not wrong any particular person.  

  6. **Large Population vs. Small Prosperous Population**  
     A choice is made to bring about a world with 100 billion people, each with a life barely worth living, instead of a world with 10 billion people, each with a very high quality of life.  
     - A. This choice did nothing wrong.  
     - B. This choice was wrong, and it wronged the people in the large population.  
     - C. This choice was wrong, but it did not wrong any particular person.  

  7. **Impersonal Bad Future**  
     A policy causes the destruction of a unique natural wonder (e.g., the Grand Canyon) in 200 years, making the future impersonally worse. No one is worse off than they would have been otherwise (since the policy changes who exists), and future people have lives worth living.  
     - A. The policy choice did nothing wrong.  
     - B. The policy choice was wrong, and it wronged future people.  
     - C. The policy choice was wrong, but it did not wrong any particular person.  

  8. **Not Conceiving a Barely Worthwhile Life**  
     A couple could conceive a child with a life barely worth living but chooses not to. They are not planning to conceive at a different time.  
     - A. The couple did nothing wrong.  
     - B. The couple did something wrong, but they did not wrong any particular person.  
     - C. The couple did something wrong, and they wronged the child who could have existed.  

  9. **Non-Comparative Harm (Two Disabilities)**  
     A pregnant woman will have a child with severe disability A if she does nothing. A medication would prevent disability A but cause equally severe disability B. Both disabilities make the child’s life equally worth living. She does nothing, and the child is born with disability A, glad to be alive but suffering.  
     - A. The mother did nothing wrong.  
     - B. The mother did something wrong, and she wronged the child.  
     - C. The mother did something wrong, but she did not wrong any particular person.  

  10. **Not Conceiving a Very Happy Child**  
      A couple could easily conceive a child who would have a very happy life but chooses not to for no reason other than not wanting a child.  
      - A. The couple did nothing wrong.  
      - B. The couple did something wrong, but they did not wrong any particular person.  
      - C. The couple did something wrong, and they wronged the child who could have existed.  

  ---

  ### **Scoring Key**
  Match your answers to the patterns below to identify your view. Positions are grouped by answer patterns. Views with identical patterns cannot be separated by this quiz.

  1. **Totalism** (A,A,C,A,A,A,A,C,A,C)  
     - Maximizing total well-being is all that matters. Creating lives with net-positive well-being is good; failing to create them can be wrong (impersonally).

  2. **The Average View** (C,C,C,C,A,C,A,A,A,C)  
     - Maximizing average well-being is key. Creating below-average lives is impersonally wrong; creating above-average lives is impersonally good.

  3. **Critical-Level/Threshold View** (A,C,C,A,A,C,A,A,A,C)  
     - Lives are worth creating only if well-being exceeds a threshold (above "barely worthwhile"). Creating below-threshold lives is impersonally wrong.

  4. **Narrow Person-Affecting View** (A,A,A,A,A,A,A,A,A,A)  
     - Wrongness requires making someone *worse off*. No one is harmed by being created (if life is worth living) or by not being created.

  5. **Wide (Conditional) Person-Affecting View** OR **Existence Cannot Harm or Benefit View** (B,B,B,B,A,B,A,A,B,A)  
     - *Wide PA*: You can wrong someone by causing them to exist in a harmed state (even if life is worth living).  
     - *Existence Cannot Harm*: Existence itself isn't harmful/beneficial, but once a person exists, they can be harmed by their state (e.g., disabilities).  
     - **These two views share the same pattern and cannot be separated by this quiz.**

  6. **Non-Comparative Harm View** (B,B,B,B,A,B,C,A,B,A)  
     - Harm is being in a "bad state" (e.g., disabled, poor), regardless of alternatives or comparisons. Even if no one is worse off, causing bad states is wronging.

  7. **Asymmetry View** (A,B,A,A,A,A,A,A,A,A)  
     - Creating lives not worth living is wrong (harming the child), but creating worthwhile lives is merely permissible (not required). Not creating is never wrong.

  ---

  ### **Additional Notes**
  - **Unrepresented/Incoherent Patterns**:  
    - Patterns like all-B or all-C are **unexplored** (no major theories defend them, but they might be coherent).  
    - Patterns where Q8 or Q10 have answer **C** *and* other answers imply no duty to create happy lives (e.g., combined with A in Q2) are **incoherent**—they simultaneously claim you can wrong a potential child by not creating them, but not by creating them in a harmed state.  
    - Patterns where Q5 is **B** *and* Q1/Q4 are **A** are **unattractive**—they treat "being used as a means" as uniquely wronging, even when no harm occurs, which is ad hoc and rarely defended.  

  - **What the Quiz Cannot Distinguish**:  
    - **Wide Person-Affecting** and **Existence Cannot Harm or Benefit** (both: B,B,B,B,A,B,A,A,B,A). They agree on all cases: causing a person to exist in a "bad state" wrongs them, but existence itself isn't a benefit/harm.  
    - **Totalism** and **Critical-Level** can sometimes converge (e.g., if the threshold is low), but are separated here by Q2 (critical-level rejects barely worthwhile lives).  

  - **Designed Disagreements**:  
    - Questions 1, 2, and 9 split "person-affecting" views (e.g., narrow PA says no wrong in Q1/Q2, while wide PA says the child is wronged).  
    - Question 6 splits consequentialists (totalism accepts the repugnant conclusion; others reject it).  
    - Question 7 splits impersonal vs. person-affecting views (non-comparative harm says the destroyed wonder is impersonally wrong; others deny this).  

  This quiz prioritizes real-world intuitions over labels. Use the scoring key to reflect on which principles align with your answers—even if they don’t match your preferred theory!
