  We are constructing a quiz to help grad students in a population ethics reading group identify their own views about wronging future people. The quiz will have 10 questions, each presenting a concrete case with two or three answer options. The goal is to map answer patterns to specific positions in population ethics without relying on labels. The positions we aim to cover include: totalism, the average view, critical-level/threshold view, narrow person-affecting restriction, wide (conditional) person-affecting views, non-comparative harm, the view that existence cannot harm or benefit, and the asymmetry view.

  We are given 7 case ideas. We'll need to add 3 more. Let me first outline the existing cases and then create 3 additional ones. I'll also ensure that the cases are designed to tease apart the different views.

  Case 1: Medication during pregnancy causing permanent hearing loss, but the child is glad to be born.
    - This tests whether causing a disability that doesn't make life not worth living is wrong, especially when the person is glad to be alive.

  Case 2: Conceiving a child whose life is barely worth living vs. not conceiving.
    - This is the classic "non-identity problem" and tests the person-affecting views.

  Case 3: Energy policy that changes who exists and leaves the future much poorer.
    - This tests whether we care about the well-being of future people even when they wouldn't exist otherwise.

  Case 4: Embryo selection with a mild impairment and the person is glad to be alive.
    - Similar to Case 1 but in the context of selection (so non-identity again).

  Case 5: Conceiving a child to donate tissue to a sick sibling (savior sibling).
    - This tests whether using a person as a means is wrong even if the person has a life worth living.

  Case 6: Choice between many people with slightly positive lives vs. fewer with very good lives.
    - This is the "Repugnant Conclusion" and distinguishes totalism from average and critical-level views.

  Case 7: A future that is worse but no one is worse off (because the alternative would have been non-existence for everyone in that future).
    - This tests non-person-affecting views and whether there is an impersonal bad.

  We need three more cases. Let me propose:

  Case 8: A case that tests the asymmetry view. Asymmetry holds that causing someone to exist with a life not worth living is wrong, but causing someone to exist with a life worth living is not required and may not even be a benefit. We can have:
    - A couple decides not to have a child because they believe the child would have a life barely worth living (but above zero). Then, we ask if they did something wrong by not conceiving? (Asymmetry says no, but totalism might say yes because they are missing out on a net positive.)

  Case 9: A case that tests the non-comparative account of harm (being in a bad state is what harms you, regardless of whether you are worse off). E.g.:
    - A doctor has two options for a pregnant woman: do nothing and the child will be born with a severe disability (but life still worth living), or give a medication that will prevent the disability. The medication, however, will cause a different severe disability (also life still worth living). The child is born with the first disability and is glad to be alive. The non-comparative view might say that the child is in a bad state (disabled) and thus harmed, even though there was no alternative that would have made the child better off (because the other disability would have been just as bad). Note: we need to make sure the two disabilities are non-comparable in severity.

  Case 10: A case that might distinguish between wide and narrow person-affecting views. The narrow person-affecting view only considers harms to existing people or to future people who will exist no matter what. The wide person-affecting view (conditional) may allow that we can harm a possible future person by causing her to exist in a harmed state. But let's test a case where the same person exists in both scenarios, but we cause her to be worse off than she could have been. This is a straightforward harm. However, we also need a case that tests the conditional version. How about:
    - A couple is deciding when to have a child. If they have the child now, the child will have a good life. If they wait two years, the child (a different one) will have an even better life. They decide to have the child now. Is this wrong? And if so, to whom? The narrow person-affecting view might say that the child who exists is not worse off than she would have been (if they had waited, she wouldn't exist) so she isn't harmed. The wide conditional view might say that we can say the child is harmed because she could have been better off if they had waited (but then she wouldn't exist, so it's conditional). Alternatively, we might use a case that involves two different possible children and see if the respondent thinks the actual child is wronged by being brought into existence when a better-off child could have been brought into existence instead.

  Alternatively, for Case 10, we can use a case that tests the asymmetry in obligations to create happy people versus obligations not to create unhappy people.

  But note, Case 8 already tests one aspect of asymmetry. Let me try to design a case that tests the other: whether it is wrong not to create a happy person.

  Case 10: A couple decides not to have a child even though they know that if they did, the child would have a very happy life. They have no special reason not to have the child; they just don't want to. Is it wrong? Asymmetry says no, while totalism and others might say yes.

  Now, we have:

  8. Asymmetry test (not conceiving a child with a life barely worth living) -> not wrong? (asymmetry: not wrong; totalism: wrong because they are forgoing a net positive)
  9. Non-comparative harm: two disabilities, no better alternative for the same child.
  10. Asymmetry test (not conceiving a child with a very good life) -> totalism says wrong, asymmetry says not wrong.

  But note: Case 2 is about conceiving a child with a life barely worth living. Case 8 is about not conceiving that same child? Actually, Case 2 is about conceiving a child with a barely worth living life (and we ask if it is wrong to conceive). Case 8 is about not conceiving a child with a barely worth living life (and we ask if it is wrong not to conceive). Case 10 is about not conceiving a child with a very good life.

  We have to be cautious: Case 2 and Case 8 are two sides of the same coin? But they test different things. Case 2: conceiving a barely-worth-living child -> is it wrong? Asymmetry says yes (presumptively wrong) and narrow person-affecting might say no (if the child is glad to be alive, no harm). Case 8: not conceiving a barely-worth-living child -> is it wrong? Asymmetry says no (it's not wrong to avoid creating a life that is barely worth living, even though it is above zero). Totalism might say it is wrong because we are forgoing a net positive.

