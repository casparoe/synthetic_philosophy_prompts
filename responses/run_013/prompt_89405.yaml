  This is very rough. Let's do it systematically.

  First, we must define the views clearly:

  - Totalism: We should maximize the total well-being. An act is wrong if it results in less total well-being than an alternative.
  - Average view: We should maximize the average well-being. An act is wrong if it results in lower average well-being than an alternative.
  - Critical-level view: There is a critical level C (above zero) such that adding a person with well-being above C is good, below C is bad, and we should maximize total well-being above C. So it's like totalism but with a threshold.
  - Narrow person-affecting restriction (PAR): An act is wrong only if there is someone who is worse off (or harmed) than they would have been under some alternative. Harm is comparative: worse off than in a relevant alternative.
  - Wide PAR (conditional): We can harm someone by causing them to exist if their life is not worth living (or below a threshold). Also, we can wrong someone by causing them to exist in a harmed state even if their life is worth living, because the harm is non-comparative? Or conditional on existing, they are worse off than they could have been? There are variations. I'll assume a common version: causing a person to exist with a life not worth living is harming them, and causing them to exist with a life worth living is not harming them, but there might be additional duties not to cause harm even if the person exists in a worth-living life. For example, if you cause someone to exist with a disability, you harm them.
  - Non-comparative harm: Harm is being in a bad state. If you cause someone to be in a bad state, you harm them, regardless of whether they are worse off.
  - Existence cannot harm or benefit: The state of affairs of a person existing cannot be evaluated as harm or benefit to that person because there is no pre-existing subject. However, once the person exists, they can be harmed or benefited in the usual ways. But bringing a person into existence with a life not worth living is not harming them (because they wouldn't exist otherwise) but might be impersonally bad. This view might align with narrow PAR for existence choices, but allow for standard harms for same-person choices.
  - Asymmetry: There is a moral reason not to bring into existence a person whose life would not be worth living, but there is no moral reason to bring into existence a person whose life would be worth living. Additionally, bringing a person into existence with a life worth living is not doing them a benefit.

