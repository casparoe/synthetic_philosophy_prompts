  Question 1: Medication during pregnancy (non-identity version: continue medication -> child with hearing loss; stop medication -> miscarriage). The child's life with hearing loss is worth living (glad to be alive).

  - Totalism: The alternative (no child) has zero well-being. The child's well-being is positive, so creating the child is better. So A: not wrong.
  - Average view: This depends on the current average. If the child's well-being is above the average, then it's good; below, then bad. Since we don't know, we can assume it's below and then average view would say it's wrong. But the average view is impersonal, so they might say C: wrong but not wronged the child. However, if it's above, they might say A. This is problematic. We might have to skip average view for this question or assume the child's well-being is below average. But let's not assume. We can note that the average view might give different answers depending on context.
  - Critical-level view: If the child's well-being is above the critical level, then it's good to create her -> A. If below, then bad -> C (wrong impersonal) or B? But critical-level views are usually impersonal, so C.
  - Narrow PAR: The child is not worse off than she would have been (which is non-existence), and she has a life worth living, so not wronged. Also, no one else is wronged. So A.
  - Wide PAR (conditional): Some versions might say that causing the child to have a disability is harming her, even though the alternative was non-existence. So B: wronged the child.
