  Let me sketch:

  Question 1: Medication during pregnancy
    Scenario: A woman is pregnant. Her doctor warns that a medication she is taking will cause her child to be born with permanent hearing loss. The woman continues the medication. The child is born with hearing loss, but later in life, the child says she is glad to have been born and does not resent her mother.
