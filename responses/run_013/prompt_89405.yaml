    Scenario: A couple knows that if they conceive a child now, the child will have a life that is barely worth living (for example, full of suffering but just enough happiness to make it worth continuing). The only alternative is not to conceive any child at all. They decide to conceive the child. The child, once grown, agrees that their life is barely worth living but is glad to have been born.
