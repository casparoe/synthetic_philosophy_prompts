answer: |-
  ## Commencement Speech: The Readable You  
  *(8-10 minutes; balances rigor, honesty, and warmth)*  

  "Dean, faculty, proud families, and most importantly—the Class of 2023. I teach game theory. That means my job is to study how people *should* act when their success depends on what others do. Today, I want to talk about one specific, strange idea from that field—because it might say something true, if slightly unsettling, about how to build cooperation in an uncertain world.  

  Picture the Prisoner’s Dilemma. Two players, one interaction: **Cooperate** (help each other) or **Defect** (betray the other). If you both cooperate, you both do well. But if you suspect the *other* will cooperate, you’re tempted to defect and win big. If you both defect? Disaster. Classic outcome: mutual defection. Trust is hard, especially with strangers.  

  But what if you could *see the other player’s strategy in advance*? Not guess—*see*. Computer scientists imagined this: Instead of choosing ‘Cooperate’ or ‘Defect,’ each player submits a *program*. This program gets to read the *other program’s source code* before deciding what to do.  

  Here’s a simple trick: Submit a program that says:  
  *“Cooperate only if the opponent’s code is character-for-character identical to mine. Otherwise, defect.”*  

  If both submit *this exact program*? They cooperate beautifully. Neither can cheat by changing a single line—because then the other detects the mismatch and defects. Cooperation locked in.  

  But reality bites: Add one extra space? Change a variable name? Cooperation collapses. Fragile. Unrealistic.  

  So, let’s upgrade. Submit a program that says:  
  *“Cooperate if I can logically prove that reading my code will cause the opponent to cooperate with me. Otherwise, defect.”*  

  This uses self-referential logic (yes, Löb’s theorem is lurking). It’s not about matching code—it’s about proving mutual cooperation is inevitable. If both programs are structured to *recognize and reciprocate* this proof, they cooperate. The circularity—“I cooperate if she does, she cooperates if I do”—resolves.  

  **Why does this matter to you? Not because you’re programs.** You aren’t. You can’t read each other’s source code.  

  **It matters because of *readability*.**  

  In these models, cooperation in a one-shot game *only happens* when your strategy is transparent and legible enough that the other can *predict and rely* on your response. Not because you’re ‘trustworthy’ in some vague sense, but because your behavior is *provably determined* by their actions. The ‘niceness’ emerges from structure, not sentiment.  

  **The honest advice?**  
  Be the kind of person—build the kind of systems—whose ‘code’ is legible to those who need to coordinate with you.  

  But here’s the cold water, because I promised no mush:  
  1.  **Legibility is narrow.** Your transparency only compels cooperation from those who *reason like you*. A proof-based program fails against a simple defector. Being ‘readable’ won’t stop a scammer—it might help them scam you.  
  2.  **It’s not about being ‘good’.** It’s about being *predictably responsive*. A transparent defector gets punished fast. A transparent cooperator thrives only among those who recognize and reward it.  
  3.  **Real life is messy.** You can’t audit your roommate’s source code. Identical spaces don’t guarantee alignment.  

  **So where does this leave you?**  

  You spent years here learning the same formalisms, debugging the same projects, surviving the same labs. You built a shared language—a shared *framework for reasoning*. That’s your hidden advantage.  

  In the wider world, seek out and nurture communities where your ‘code’ becomes legible. Where others understand your constraints, your incentives, your ‘proof structure’. That’s where cooperation isn't just hopeful—it’s *stable*.  

  Your CS degree isn’t just about writing code. It’s about designing systems where predictability enables trust. Where protocols make cooperation the equilibrium. Where legibility replaces guesswork.  

  So go build systems—and be the people—whose logic is clear enough that cooperation becomes the rational choice. Not because the world is kind, but because you’ve made it readable.  

  Congratulations. May your equilibria be stable, your proofs be constructive, and your sandwiches after this be plentiful. Thank you."  

  ---

  **Why this works:**  
  - **Honest & Rigorous:** No false comfort. Highlights limitations ("only works against similar reasoners," "not about being good").  
  - **Accessible:** Prisoner's Dilemma setup is iconic. "Source code" metaphor is intuitive. Löb's theorem *implied* but not named/explained.  
  - **Graduation-Relevant:** Connects CS training to building cooperative frameworks ("shared language," "shared framework for reasoning").  
  - **Weird but Warm:** Core idea is niche (program equilibrium), but framing ("readability," "shared language") and conclusion ("build systems where cooperation is the rational choice") resonate broadly.  
  - **No Traps:** Philosophy minors won't find technical errors; caveats prevent misinterpretation. Parents hear "build trust through clarity."  

  **Key Caveats Embedded:**  
  - Humans ≠ programs (explicitly stated).  
  - Readability only compels similar reasoners (limits scope).  
  - Transparency can be exploited (anti-mush armor).  
  - CS degree as shared foundation justifies relevance.  

  This gives the parents their uplift ("build cooperative systems"), the grads their rigor (true game theory), and you your integrity (no fake warmth).
