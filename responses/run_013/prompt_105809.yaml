answer: |-
  The prisoner in the grey jumpsuit sat unnaturally still. Not defiant, not scared – just *still*, like a specimen pinned under glass. Across the courtroom, the air vibrated with the low thrum of the climate control and the rustle of spectators. My knuckles were white on the lectern. Beside me, the prisoner – my client, *this* temporal slice designated ‘Kael-2024.06’ – stared straight ahead, his gaze fixed on nothing. Or perhaps on everything he wasn’t anymore.

  "Your Honor," I began, the formal words tasting like dust, "we move for dismissal on grounds of non-identity. The temporal part designated ‘Kael-2019.11’ who committed the act in question no longer exists. My client, Kael-2024.06, is a distinct temporal segment of the Kael-worm. Punishing him for the actions of a past part violates the fundamental principle of personal desert enshrined in Section 7 of the Temporal Persons Act."

  The judge, a woman whose face seemed carved from the same temporal bedrock as the law she enforced, nodded impassively. Her eyes scanned the holographic brief hovering before her, outlining the four-dimensional continuum labelled ‘Kael’. The crime – a brutal assault during a botched robbery five years ago – was a bright, ugly node on that timeline, attached firmly to the 2019.11 slice. The man beside me? Just the leading edge.

  But then she spoke. Not the judge. My client. His voice was low, rough, scraping against the sterile silence. "I am him."

  Heads turned. Murmurs rose. The prosecutor smirked.

  "Mr. Kael," the judge cautioned, "your counsel is presenting the legal argument."

  "I don’t care about the argument," Kael-2024.06 said, finally turning his head. His eyes, deep-set and shadowed, met mine, then swept across the court. "I did it. *I* swung that pipe. *I* saw the blood. *I* ran. Not some... *part*. Me. The same me sitting here." He thumped his chest once, a dull, hollow sound. "The same me who wakes up sweating, remembering her face. The same me who’s been trying, failing, to be different ever since. How can you punish a *part*? How can a *part* repent?" He wasn’t arguing legal theory; he was pleading ontology. An endurantist in a perdurantist cage, insisting on the unity of his own being across the years. It was raw, dangerous, and undeniably powerful.

  The prosecutor pounced. "Your Honor, the defendant's personal metaphysics are irrelevant. The law recognizes temporal parts. His subjective feeling of continuity is just that – a feeling, a neurological artifact of the worm's persistence. It doesn't change the fact that the entity responsible, Kael-2019.11, is gone. We seek justice *for* the victim, *against* the perpetrator. That perpetrator no longer sits before us. To punish Kael-2024.06 would be to punish an innocent man for the sins of another."

  It was the standard argument, clean, logical, and utterly chilling. Justice as temporal dissection.

  Then the victim’s mother took the stand. Mrs. Aris. Small, grey, clutching a faded photograph. She spoke of her daughter, Liana, with a quiet devastation that silenced the room. Then the prosecutor asked the required question: did she recognize the man in the dock as the one who attacked Liana?

  Mrs. Aris looked directly at Kael-2024.06. A long, terrible moment stretched. "That man," she said finally, her voice trembling but clear, "he has Liana’s blood under his fingernails? In his memories? Does he *feel* it, the way he felt it then?"

  "Objection," the prosecutor started, but the judge silenced him with a look. This was victim impact; the rules were looser.

  "I don’t know," Mrs. Aris continued, her gaze unwavering on Kael. "But I know the man who did it… he was filled with such rage. Such… emptiness." She took a shaky breath. "Maybe… maybe he *is* different now. I read things. About how people change. The law says he’s not the same person. Maybe… maybe that’s true. Maybe the man who deserves punishment… the one who truly *did* it… isn’t entirely here anymore." She wasn’t endorsing the system; she was groping for something else entirely. "Perhaps… perhaps it’s not about being the *same* person. Perhaps it’s about how much of that terrible person is still *in* him. How connected he still is." It was pure Parfit, emerging not from philosophy, but from grief’s crucible. Desert based on psychological connection, not strict identity.

  My turn. Cross-examination was delicate, treacherous ground. "Mrs. Aris," I began gently, "you suggest that if the defendant has changed enough, he deserves less punishment?"

  She nodded, eyes damp. "If the rage is gone… if the emptiness is filled… maybe."

  "But how do we measure that?" I asked, not unkindly, but relentlessly. "Kael-2019.11 was defined by rage and impulse. Kael-2024.06 seems calmer, more reflective. But is that genuine change, or just the passage of time? Five years in prison will change anyone. Does therapy lessen his connection to the past perpetrator? Does remorse? And what threshold of 'disconnection' absolves him of responsibility? If he forgets the event entirely due to trauma or age, is he then innocent? Does the passage of time itself become a pardon?" I saw the fragile hope in her eyes dim, replaced by confusion. The Parfitian move offered a semblance of mercy within the system, but it was a quagmire of subjectivity. "The law needs clear lines, Mrs. Aris. Isn't it possible that by focusing on connection, we risk letting the truly changed escape justice, or worse, punishing the reformed for crimes they no longer feel connected to, simply because the law demands *someone* pay?"

  Her shoulders slumped. "I don't know," she whispered. "I just know my daughter is gone."

  The arguments echoed in the final statements. The prosecutor: clean lines, distinct parts, justice demands we punish the perpetrator, now gone. Me: the law’s own logic dictates we cannot punish an innocent temporal segment. Kael himself: a low, persistent murmur of "I am him." And Mrs. Aris’s ghost in the room: the haunting question of connection, of how much of the past self stains the present.

  The judge’s chambers were quiet while she deliberated. I looked at Kael-2024.06. He stared at his hands. Was he thinking of the pipe? Of Liana’s face? Or just the cold weight of the temporal part designation? Did *he* feel connected to that raging shadow from 2019? Did it matter what he felt, under the law?

  The bailiff called us back. The judge entered, her face unreadable granite. She didn’t look at Kael, or at Mrs. Aris weeping softly in the front row. She looked at the holographic timeline still hovering.

  "The court acknowledges the arguments presented," she began, her voice devoid of inflection. "The metaphysical foundations of our jurisprudence are clear. Persons are four-dimensional entities; identity is temporal part identity. The perpetrator, Kael-2019.11, is not identical to the accused, Kael-2024.06."

  A flicker in Kael’s eyes. Resignation? Or defiance?

  "However," the judge continued, "the question of desert, particularly in light of psychological connectedness raised by the victim's testimony, presents significant complexities not fully resolved by the statute."

  She paused. The air crackled. Was she about to shatter the system? Or reinforce its coldest implications?

  "The court finds," she said, each word deliberate, "that the matter requires further consideration. Sentencing is adjourned for thirty days. Both parties are ordered to submit supplemental briefs addressing the quantification of psychological connection as it pertains to desert under the Temporal Persons Act, specifically referencing the discontinuity observed between Kael-2019.11 and Kael-2024.06."

  A procedural punt. A victory for no one. The perdurantist framework held, but its application remained agonizingly, humanly unresolved. Kael was led away, still a slice, still caught. Mrs. Aris remained, clutching her photo, adrift in a sea of metaphysics that offered neither vengeance nor absolution. And me? I gathered my things, the legal arguments a tangled knot in my mind, the echo of Kael’s raw "I am him" and Mrs. Aris’s tentative "how much of him is left?" warring with the cold, precise geometry of the timeline glowing faintly on the empty bench. Justice, it seemed, was also a worm – segmented, extended, and desperately hard to pin down.
