  Methodology should scream "conceptual analysis," not new data. I’ll map: dissect arguments, find real-world examples (like animal welfare laws using neuron counts), test coherence via edge cases (birds! cephalopods!), and pressure-test the weighting view with the within-species reductio. 

  Outputs: A decision tree for proxy use (practical) + an essay (accessible). Failure modes? If all metrics collapse into proxies and the real fight is elsewhere (e.g., religious views), that’s dissolving. If it becomes "but are octopuses sentient?", that’s mission drift. 

  Biggest challenge: Making the weighting criterion’s human implication feel urgent. If brain size grounds moral weight across species, why not within? Either it’s a reductio (so the view fails) or proponents must explain why humans are special—which likely exposes arbitrariness. That’s the mic-drop moment. 

  ...Wait, should I flag that the epistemic proxy might *still* be ethically dangerous? Like, if we use neuron count as a sentience proxy, but it excludes fish with low counts who suffer, that’s a policy nightmare. The user might want that tension highlighted. 

  *Pauses* The tone needs academic heft but no jargon—they’re journalists. No citations; they’ll interview experts. Stress the unique value: philosophers ignore measurement noise, scientists ignore moral philosophy, this bridges it. 

