answer: |-
  Here is a complete mock paper package focused on Mrs. Fairhurst's case, designed to provoke genuine philosophical reasoning and avoid predictable answers:

  **Essay Question:**
  "Does the earlier Mrs Fairhurst retain the moral authority to both *refuse* life-saving treatment for her future self *and* to *demand* significant sacrifices from others, even when she now expresses seemingly contradictory wishes during a lucid interval? Justify your answer."

  **Model Answer (Approx. 600 words):**
  The moral authority of Mrs. Fairhurst’s advance directive rests not on her past competence alone, but on the fundamental nature of personal identity and the right to shape one’s narrative conclusion. While the demands placed on others create a profound moral tension, this does not inherently invalidate the directive’s core authority regarding her own treatment and care wishes; it simply imposes a separate ethical obligation concerning those demands.

  The authority over her *own* body and future stems from the continuity of her identity as a rational agent who anticipated this specific decline. The earlier Mrs. Fairhurst, fully competent, made a decision based on her values – likely prioritizing dignity, avoiding prolonged incapacity, and a specific kind of death – over mere biological survival. Her identity isn't erased by dementia; it is tragically obscured. The directive represents the last clear expression of the person she fundamentally was and wished to remain, even in decline. The lucid interval, while poignant, does not restore the sustained capacity necessary to reassess such a profound, pre-meditated decision made years prior with legal and medical counsel. A momentary request for relief ("tablets for my chest") in isolation doesn't equate to a reasoned reversal of her deeply held stance on artificial prolongation of life in severe dementia. It reflects a present discomfort, not a reinstatement of the comprehensive foresight she possessed when creating the directive.

  Concerning the *demands* on her sisters and grandson, the situation is morally distinct. While the directive expresses her *wishes* for caregiving arrangements, translating these into enforceable moral *obligations* for specific individuals is highly problematic. Autonomy grants control over oneself, not over others. Her sisters' sacrifices (reduced work, remortgaging) go far beyond reasonable expectations of familial duty; they constitute severe personal burdens imposed by the directive. Similarly, forcing distressing weekly visits on an eleven-year-old grandson, despite his evident suffering, prioritizes the *symbol* of her wish (dying surrounded by known faces) over the tangible harm to a vulnerable child. The directive’s authority to dictate *who* provides care and *how* they interact with others is significantly weaker than its authority to dictate what is done *to her*.

  Therefore, the earlier Mrs. Fairhurst retains strong moral authority regarding the refusal of antibiotics, ANH, and hospitalization. These decisions concern her own body and the kind of existence she finds acceptable. Her lucid interval request doesn't override this, as it lacks the context and stability of her prior decision. However, the demands imposing severe burdens on specific others lack equivalent moral force. The sisters have a prima facie duty to act in her best interests, but this doesn't mandate the *specific sacrifices* dictated years earlier, especially as circumstances (their financial strain, the grandson's distress) have changed. They should strive to honour her *core wish* – dying at home cared for by loved ones, not strangers – but how they achieve this, balancing their own lives and the grandson's welfare, requires compassionate negotiation *now*, not slavish adherence to burdensome specifics drafted in different circumstances.

  Holding this position comes at a cost: it risks causing the earlier Mrs. Fairhurst profound distress if she could comprehend the potential divergence from her specific vision (e.g., sisters needing more external help, grandson visiting less). It acknowledges the tragic imperfection of translating future wishes into present realities involving others. However, it avoids the greater wrongs of violating bodily autonomy *or* unjustly enslaving the lives of others to a document created without their explicit, ongoing consent to such sacrifices.

  **Marking Scheme (20 Marks Total - 5 x 4 points)**

  1.  **Distinguishes Self-Regarding Refusals vs. Other-Regarding Demands:** Candidate must recognize that the moral basis for refusing treatment (autonomy over one's own body/future) differs significantly from demanding sacrifices from specific others (which imposes obligations). *Common Error: Treating both types of directive wishes as equally authoritative based solely on the document's existence.*
  2.  **Justifies Authority of Past Self for Treatment Refusal:** Candidate must ground the past self's authority in concepts like identity continuity, respect for precedent autonomy, the value of a life narrative, or the sustained nature of the prior decision vs. the fleeting lucid request. *Common Error: Arguing the lucid request instantly invalidates the entire directive or reduces the past decision to mere preference.*
  3.  **Analyzes the Lucid Interval's Significance:** Candidate must explain why the lucid interval request likely does *not* override the directive (e.g., lack of sustained capacity, context, stability, or scope compared to the original decision). *Common Error: Assuming a lucid moment automatically restores full decision-making capacity or represents a genuine change of mind.*
  4.  **Critiques the Moral Force of Demands on Others:** Candidate must argue that while the *wish* for home care/family presence is valid, the *specific demands* imposing severe burdens (financial, emotional) on named individuals lack equivalent moral authority and create distinct obligations. *Common Error: Claiming family "must" obey all demands regardless of burden, or conversely, dismissing all care wishes as irrelevant burdens.*
  5.  **Acknowledges the Cost/Complexity of the Position:** Candidate must explicitly state and engage with the *cost* of limiting the directive's authority over others (e.g., potential distress to past self's vision, imperfect fulfilment) or the cost of upholding burdensome demands (e.g., harm to sisters/grandson). *Common Error: Presenting a neat solution without acknowledging inherent tragedy or trade-offs.*

  **The A/B Differentiator:** Point 1 (Distinguishing Self/Other-Regarding Authority) is crucial. A-grade answers will establish this fundamental asymmetry *early* and use it to structure their entire argument. B-grade answers often conflate the two types of authority or only implicitly recognize the difference late in the essay.
