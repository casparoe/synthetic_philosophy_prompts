answer: |-
  Below is a structured specification of desiderata for an adequate account of idealisation, designed to adjudicate disputes and guide model-building. The table sets out requirements, their motivations, and status (non-negotiable or contested), followed by analysis of tensions and brief evaluation of three accounts.

  ### **Desiderata for an Account of Idealisation**
  | **Requirement** | **Motivation & Case Example** | **Status** |
  |----------------|-------------------------------|------------|
  | **R1: Distinguish distortion from omission** | **Motivation**: Deliberate distortion (e.g., frictionless planes in Newtonian mechanics) actively misrepresents, while omission (e.g., ignoring air resistance in a simple projectile model) passively excludes. Conflating them obscures how each earns its keep. **Case**: A climate model omitting cloud microphysics (omission) vs. assuming greenhouse gases behave as perfect black bodies (distortion). | **Non-negotiable** |
  | **R2: No appeal to conclusion-truth** | **Motivation**: Circularity risk. E.g., claiming "zero transaction costs are legitimate because the model predicts efficient markets" presupposes the result. **Case**: Rational agent models in economics cannot justify their assumptions by their (disputed) success. | **Non-negotiable** |
  | **R3: Accommodate incompatible-but-successful models** | **Motivation**: Multiple models with conflicting false assumptions can be predictively adequate simultaneously. **Case**: Fluid dynamics: both discrete particle-based (molecular chaos assumption) and continuum models (ignoring molecular structure) successfully predict flow, and their agreement strengthens evidence for shared predictions. | **Non-negotiable** |
  | **R4: Address Friedman’s F-twist** | **Motivation**: Friedman’s claim that "the more unrealistic the assumptions, the more significant the theory" (e.g., perfect competition yielding insight into market dynamics). The account must evaluate whether this is a valid heuristic, a mistake, or context-dependent. | **Contested** |
  | **R5: Cover intervention & extrapolation** | **Motivation**: Models for policy/intervention (e.g., epidemiological models for lockdowns) or extrapolation beyond data (e.g., climate models for 2100) face stricter demands than mere prediction. **Case**: A predator-prey model omitting migration must still guide species reintroduction. | **Non-negotiable** |
  | **R6: Usable under uncertainty** | **Motivation**: Modellers often lack prior knowledge of which idealisations will matter. **Case**: Building a new economic model, one must choose whether to omit behavioural biases without knowing if they are critical for policy extrapolation. | **Contested** |

  ### **Tensions Between Requirements**
  - **Core inconsistency**: **R2 (no conclusion-truth) clashes irreconcilably with R6 (guidance under uncertainty)**.  
    - **Why**: R2 forbids justifying idealisations by outcomes (e.g., "this distortion works because predictions succeed"). Yet R6 demands guidance *before* outcomes are known, creating a catch-22. Any account satisfying R2 must rely on non-empirical criteria (e.g., theoretical robustness), but R6 requires practical heuristics modellers can apply prospectively—which typically *implicitly* rely on expected outcomes.  
    - **Result**: Accounts prioritising R2 (e.g., causal-preservation) struggle with R6; those prioritising R6 (e.g., instrumentalism) violate R2.  

  ### **How Three Accounts Fare**
  1. **Instrumentalist (assumptions as tools with no representational content)**  
     - **Fails R1**: Cannot distinguish distortion (actively false) from omission (merely silent), as both are "tools" devoid of representational intent.  
     - **Fails R2**: Legitimacy hinges on predictive success, violating the circularity ban.  
     - **Fails R5**: Unreliable for intervention, as it ignores whether the model structure corresponds to real causal relationships.  
     - **Fails R6**: Retrospective, not prospective—only useful *after* testing predictions.  

  2. **Fictionalist (assumptions as props for make-believe)**  
     - **Fails R1**: Distortion and omission both treated as "fictions", blurring their distinct roles (e.g., a frictionless plane as deliberate fiction vs. omitting friction as non-commitment).  
     - **Fails R4**: Cannot adjudicate Friedman’s F-twist, as all idealisations are equally "unreal" fictions.  
     - **Fails R5**: Make-believe doesn’t ensure models track reality for intervention (e.g., fictional rational agents may misguide policy).  
     - **Satisfies R3**: Accommodates incompatible models—different fictions can support the same inferences.  

  3. **Causal-Preservation (legitimacy tied to preserving relevant causal structure)**  
     - **Satisfies R1**: Distortion is legitimate only if it preserves causal relations (e.g., point masses preserve gravitational forces); omission is acceptable if excluded factors are causally irrelevant.  
     - **Satisfies R2/R5**: Uses causal criteria (e.g., invariance under intervention) independent of conclusions. Extends naturally to intervention.  
     - **Fails R6**: Requires modellers to know *in advance* which causal factors are relevant—often impossible under uncertainty.  
     - **Fails R4**: Rejects Friedman’s F-twist; unrealistic assumptions are legitimate only if they preserve causality, not because unreality confers significance.  

  ### **Summary of Key Exclusions**
  - The **R2 vs. R6 conflict** is unresolvable: prospective guidance inherently risks smuggling in outcome-based reasoning.  
  - **R4 (Friedman) is excluded by causal accounts** but may be heuristically retained by instrumentalism (at the cost of R2).  
  - **R3 is satisfied only if the account decouples assumptions from truth-conditions**, favouring fictionalism or instrumentalism over strongly realist causal accounts.  

  This framework reveals that an adequate account must either relax R6 (accepting that idealisation cannot be fully guided prospectively) or weaken R2 (allowing heuristic appeals to expected outcomes)—but not both without inconsistency.
