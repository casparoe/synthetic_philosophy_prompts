prompt: |-
  I'm a software engineer with no philosophy training, and I keep running into the inside-view / outside-view distinction in forecasting and estimation at work, so I want to press on it with one specific claim rather than a general discussion. Here is the claim: when a person's inside-view estimate of how some project or prediction will go diverges sharply from the outside-view estimate for the reference class it belongs to, the rational response is to move most of the way to the outside-view number, unless she can give a specific, independently checkable reason that her case is atypical of that class. What is your probability that this claim is true?

  Don't just give me the number. Decompose it into the sub-questions it actually depends on and give me a rough probability for each: (a) whether there is a non-arbitrary fact about which reference class is the right one, so that the outside view picks out a determinate estimate at all; (b) whether choosing the class, and judging that one's own case is atypical of it, are themselves inside-view judgments, in which case the rule can't be applied without the very reasoning it tells you to distrust; (c) whether the outside view is better understood as a prior that the inside view then updates, a framing a colleague suggested to me and which I suspect either rescues the claim or renders it trivial; and (d) whether "rational" here is about accuracy, or about something like modesty as an epistemic virtue that can bind even when the inside view is more likely to be right in this particular case.

  Tell me how those combine into your final figure, which term the number is most sensitive to, and what argument or evidence would move it most. I'd put myself around 0.6, for what that's worth, and I'd like to know whether you think that is a defensible place to sit. Please be explicit about how confident you are in the probabilities you assign, and single out the one you are least sure of.
reasoning: |-
  Okay, the user is a software engineer dealing with inside-view vs outside-view distinctions in forecasting. They want to focus on a specific claim about adjusting to the outside-view estimate when it diverges sharply, unless there's a specific reason the case is atypical. They've broken it into four sub-questions and want probabilities for each, plus how they combine. They're at 0.6 and want to know if that's defensible.

  First, I need to understand each sub-question. (a) is about whether there's a non-arbitrary reference class. If reference classes are arbitrary, the outside-view estimate isn't reliable. I think there's often a reasonable class, but it's not perfect. Maybe 0.7 confidence here.

  (b) is tricky. Even if you pick a reference class and judge atypicality, both are inside-view judgments. That creates a loop. So the rule might undermine itself. I'm pretty confident this is a problem, say 0.85. But the user might not have considered how deep this issue goes.

  (c) frames the outside view as a prior. That makes sense. You start with the reference class as a prior, then update with inside-view info. But then the claim becomes about how much to update, which depends on evidence strength. If you see it this way, the original claim is either trivial or needs nuance. Probability around 0.9 here, but it changes how we interpret the claim.

  (d) is about what "rational" means. Is it about accuracy or epistemic virtue? Sometimes deferring to the outside view is virtuous even if it's less accurate. But the user probably cares about accuracy. I think accuracy is key, so maybe 0.8 for that.

  Combining these: The biggest issue is (b) because of the self-undermining problem. If reference class selection and atypicality judgments are inside-view, you can't escape that initial bias. The prior framing in (c) helps but doesn't fully resolve (b). (d) affects the claim's purpose but might be secondary.

  The user's 0.6 is defensible. They might be weighing (c) highly, seeing the prior approach as saving the claim. But (b) is a real hurdle. If they can address how to handle reference class selection objectively, their probability could rise. Evidence on structured judgment aggregation methods might help. They should be aware of (b)'s challenge but can reasonably stay at 0.6 if they think practical solutions exist.
answer: |-
  Your 0.6 is a defensible and reasonable starting point—I'd put myself at **P(Claim True) = 0.65** after decomposition. Below, I'll break this down rigorously using your four sub-questions, assign probabilities with explicit confidence levels, combine them, identify sensitivities, and outline what could shift my view. I'll use a simple multiplicative model for combination (though reality is messier), treating each probability as independent for simplicity.

  ### Decomposition & Probabilities
  1. **Is there a non-arbitrary reference class? (P = 0.75)**  
     *Question*: Does the "outside view" yield a determinate estimate, or is reference class selection hopelessly subjective?  
     *Probability*: **0.75** (Confidence: Medium-High)  
     *Reasoning*: Reference classes are often contextually obvious (e.g., "web development projects using React" for a React app). Empirical work (e.g., Tetlock's forecasting tournaments) shows experts using shared reference classes improve accuracy. But ambiguity exists (e.g., is a "blockchain project" its own class or part of "distributed systems"?). I assign P=0.75 because while classes *can* be non-arbitrary, they aren't always.  
     *Confidence Note*: I'm least sure here (confidence 6/10)—reference class engineering lacks strict rules.

  2. **Are class selection & atypicality judgments themselves inside-view? (P = 0.50)**  
     *Question*: Does the rule collapse under self-reference since choosing a class/judging atypicality relies on the same intuition it distrusts?  
     *Probability*: **0.50** (Confidence: High)  
     *Reasoning*: Yes, these *are* inside-view judgments (e.g., "I picked 'fintech projects' because my project feels fintech-y"). This creates a loop: the rule demands distrusting inside-view reasoning but requires it to apply. Kahneman's "no special snowflake" warning assumes this problem is surmountable via discipline, but psychological evidence (e.g., overconfidence in uniqueness) suggests it's pervasive. P=0.50 reflects deep tension—it *can* work with rigor but often fails.  
     *Confidence*: 8/10 due to strong empirical support for bias in self-assessment.

  3. **Is the outside view best seen as a prior? (P = 0.90)**  
     *Question*: Does framing the outside view as a Bayesian prior (updated by inside-view evidence) resolve or trivialize the claim?  
     *Probability*: **0.90** (Confidence: High)  
     *Reasoning*: Absolutely—this reframing clarifies the claim but doesn't trivialize it. The outside view (reference class statistics) is the prior. Sharp divergence means the inside view (likelihood) must overcome low prior probability. The rule becomes: "Update conservatively unless likelihood is strong and falsifiable." This rescues the core insight but makes "independently checkable reason" equivalent to "strong evidence." P=0.90 as it strengthens the claim mathematically.  
     *Confidence*: 9/10—Bayesianism is well-established here.

  4. **Is 'rational' about accuracy or virtue? (P = 0.85)**  
     *Question*: Does rationality prioritize expected accuracy, or epistemic humility even when wrong?  
     *Probability*: **0.85** (Confidence: Medium-High)  
     *Reasoning*: The claim is likely about *accuracy*. Studies (e.g., actuarial vs. clinical judgment) show aggregating to base rates improves calibration. But if "rational" means "virtuous" (e.g., mitigating hubris), moving toward the outside view might bind even when harmful to accuracy. Given your work context, accuracy dominates—thus P=0.85 for the claim assuming accuracy.  
     *Confidence*: 7/10—epistemic virtues are context-dependent.

  ---

  ### Combining into Final Probability
  - **Model**: \( P(\text{Claim}) = P(a) \times P(b) \times P(c) \times P(d) \)  
    (Simplified; assumes independence and equal weighting)  
  - **Calculation**: \( 0.75 \times 0.50 \times 0.90 \times 0.85 = \mathbf{0.29} \)  
    This is overly pessimistic—the sub-questions aren't fully independent, and (c) *rescues* (b). Better to weight key conflicts:  
    - If (b) is resolved (P=1), claim viability soars.  
    - If (c) is false (P=0), claim collapses.  
    **Adjusted synthesis**: With (c) mitigating (b), and (a)/(d) favorable, I land at **0.65**.  

  **Final P(Claim True) = 0.65**  
  *(Your 0.60 is entirely defensible—we differ only in slightly higher weight on the Bayesian framing).*  

  ---

  ### Sensitivity & Key Movers
  - **Most Sensitive Term**: **(b) Self-reference problem** (P=0.50).  
    - If you accept that disciplined processes (e.g., checklists, group review) can objectify class selection/atypicality judgments, P(b) → 0.70 and P(Claim) → 0.75+.  
    - If you see self-reference as fatal, P(b) → 0.30 and P(Claim) → 0.50.  
  - **Strongest Evidence to Move My View**:  
    - **For ↑**: Data showing structured protocols (e.g., "reference class tennis" where teams debate classes) reduce bias and improve forecasts. E.g., studies in software engineering (like McConnell's *Software Estimation*) showing teams using outside views beat deadlines more often.  
    - **For ↓**: Proof that experts reliably identify *when* their case is atypical. E.g., a meta-analysis showing forecasters who overrode base rates with "specific reasons" were wrong >80% of time—suggesting "independently checkable" is too weak a filter.  

  ### Why Your 0.6 is Defensible
  You’re likely weighting **(b)** more heavily than I am, or are skeptical about **(a)**. In practice, software estimation (e.g., using COCOMO-style models) *does* treat outside views as priors updated by project specifics—and it works when data is clean. But in messy real-world contexts (e.g., novel AI projects), reference classes blur, and self-reference bites hard. Holding at **0.60–0.65** balances the math with the messiness of human judgment. If you adopt the Bayesian framing (c), your position strengthens significantly.
