prompt: |-
  You are a philosopher of science specializing in the metaphysics of reduction and emergence, with a working knowledge of statistical physics and complex-systems modelling. Think carefully before answering, and open with a short brainstorming section listing the candidate concepts you consider and why you set each aside; only then give your verdict.

  I am a condensed-matter experimentalist who has drifted into reading philosophy of science, and I keep meeting a pattern I cannot name. It arrives as a package of two claims that are almost always asserted together, as though the second were a corollary of the first.

  First claim: the higher-level feature is nothing over and above the lower-level facts. Fix the microstate and you have fixed the macrostate; there is no extra ingredient, no downward force, no leftover residue. Second claim: the higher-level description is nevertheless where the science is. The dependable generalizations are stated at that level, and they survive wholesale variation in the microdetails — which is exactly why they look like laws rather than like summaries of accidents.

  Three places I meet it:

  1. Near a critical point, a fluid and a magnet show the same critical exponents, though their microphysics has almost nothing in common. Tinker with the microphysics and the macro-regularity does not budge. Nobody concludes that fluids and magnets are the same stuff; they conclude that one higher-level regularity has two utterly alien micro-realizations.
  2. The backwards-travelling waves that form on a crowded motorway turn up in models built on quite different assumptions about how drivers behave.
  3. A molecular-dynamics simulation reproduces the ideal-gas law, and someone says this shows the gas law is nothing over and above the molecules — even though the simulation had to be set up around the very macro-quantity whose status was in question.

  I have been told this is multiple realizability. That seems to cover only the middle of the story, and by itself it is too cheap: plenty of predicates are realizable in many ways and carry no laws at all — being worth exactly one euro, being a piece of furniture — so realizable-in-many-ways cannot be what makes a macro-generalization dependable. I have also been told it is emergence, but the definitions I find are about unpredictability or about novel causal powers, and I am claiming neither: my point is not that we cannot compute the macro-behaviour, but that the micro-description is not a substitute for the macro-generalization even in principle, since you cannot recover it from the microdetails without already knowing what you are looking for.

  What I am after is one configuration with four parts: (i) the macro is fully determined by the micro; (ii) the macro-generalization is projectible and stable under micro-perturbation; (iii) the micro-story does not displace the macro-generalization as a way of stating the regularity; (iv) no macro-entity does causal work over and above the micro-causes.

  So: does (i)–(iv) taken together have an established name? If the literature splits it into two or three separately named pieces, tell me how the usual divisions run, which piece my pattern really is, and which of the four parts each candidate concept captures and which it misses. If nothing fits, coin a term, define it precisely, and give me boundary cases — at least one case that satisfies some but not all of (i)–(iv) and that you would exclude, and one borderline case you would include. Finally, tell me what turns on the answer: is the difference between calling the macro a convenient bookkeeping device and calling it a genuine level of law a substantive metaphysical difference, or only a difference in our epistemic situation? I will not be satisfied with a bare label; I want the joints located.
reasoning: |-
  Okay, I need to tackle this user's query carefully. The user is a condensed-matter experimentalist who's been reading philosophy of science and has encountered a specific pattern they can't name. They describe two claims that always come together: first, that higher-level features are nothing over and above the lower-level facts, and second, that higher-level descriptions are where the dependable generalizations are found. They give examples from critical points in fluids and magnets, traffic waves, and molecular dynamics simulations.

  The user has been told this is multiple realizability or emergence, but they find those insufficient. Multiple realizability covers the variability but not why the generalizations are projectible, and emergence typically involves unpredictability or novel causal powers, which the user isn't claiming. They want a term for the conjunction of four conditions: macro determined by micro (i), macro generalizations projectible and stable (ii), micro-story doesn't displace macro-generalization (iii), and no extra macro causal work (iv). They ask if this has a name, how existing concepts relate, and what turns on the distinction.

  First, I should brainstorm candidate concepts. Let's list them:

  - **Multiple Realizability (MR)**: This explains how different microstates can realize the same macrostate, covering why macro properties survive micro variations. But MR alone doesn't guarantee projectibility or lawlike behavior. For example, "being a piece of furniture" is multiply realizable but not projectible. So MR addresses parts of (ii) and (iii) but misses the necessity of stability and projectibility.

  - **Supervenience**: This is a dependency relation where fixing the micro fixes the macro. It captures (i) and (iv), showing no extra causal powers. However, supervenience doesn't imply stability or projectibility; it's silent on why macro laws hold across different microrealizations.

  - **Reductionism**: Often associated with explaining macro in terms of micro. But the user's point is that even though macro reduces to micro, the macro description remains essential. Traditional reduction might try to derive macro laws from micro, but the examples show that macro laws aren't derivable without prior macro knowledge. Reduction might cover (i) but conflict with (ii) and (iii).

  - **Emergence**: Typically involves novel properties or causal powers not reducible to micro. The user explicitly denies this, as they're not claiming unpredictability or downward causation. Emergence might cover unpredictability but misses the determinism in (i) and conflicts with (iv).

  - **Universality**: From statistical physics, this explains why systems with different microphysics show the same critical behavior. It directly addresses stability under micro perturbations (ii) and projectibility. But universality is specific to critical phenomena and doesn't generalize to all cases like traffic or gas laws.

  - **Autonomy of Macroscopic Descriptions**: This concept from philosophers like Batterman or Rueger emphasizes that higher-level explanations are indispensable despite reducibility. It captures (ii) and (iii), but might not explicitly include (i) and (iv).

  Now, the user's pattern combines all four conditions. The closest existing term might be **Non-Reductive Physicalism (NRP)**, but NRP often focuses on mental states and may not emphasize stability and projectibility. **Explanatory Autonomy** or **Irreducible Patterns** (Dennett) could be relevant, but may not stress the micro-determination aspect.

  The term **Pattern Universality** might be coined to encapsulate this. It combines universality's stability with the idea of patterns that are micro-determined yet explanatorily autonomous. Boundary cases: A case that satisfies (i) and (iv) but not (ii) or (iii) is a fragile macro-property that doesn't survive micro-changes, like a specific crystal structure that shatters with minor perturbations. A borderline case that fits is the ideal gas law, which holds across different micro-dynamics as long as certain assumptions (like ergodicity) are met.

  What turns on this? The difference between seeing macro as bookkeeping versus genuine laws is both metaphysical and epistemic. Metaphysically, it affirms that patterns are real features of the world, not just summaries. Epistemically, it highlights that science requires multiple levels of explanation, and neither level is dispensable. This challenges strict reductionism without resorting to dualism or strong emergence.
answer: |-
  ### Brainstorming: Candidate Concepts and Why They Are Set Aside
  Before delivering my verdict, I consider and reject several common philosophical labels for your pattern. Here's a rapid-fire assessment:

  1. **Multiple Realizability (MR)**:  
     - *Why considered*: Directly addresses your examples (fluids/magnets, traffic models) where diverse microstates yield identical macro-behavior.  
     - *Set aside*: As you note, MR is necessary but insufficient. It captures stability under micro-perturbation (part of (ii)) and the non-displacement of macro-generalizations (iii), but fails to explain *projectibility* or *dependable lawlikeness*. MR applies trivially to non-nomological predicates (e.g., "being furniture"), missing (ii)'s core. It also neglects micro-determination (i) and causal closure (iv).

  2. **Weak Emergence**:  
     - *Why considered*: Often invoked for systems where macro-regularities are unexpected from micro-details (e.g., traffic waves).  
     - *Set aside*: Standard definitions (e.g., Bedau, Chalmers) emphasize *unpredictability* or *computational irreducibility* without prior knowledge. Your pattern explicitly rejects this—you stress macro-regularities *are* micro-determined (i) and computable in principle. Emergence also typically implies novel causal powers, violating (iv).

  3. **Supervenience**:  
     - *Why considered*: Encodes the "nothing over and above" claim (i) and (iv): fixing micro fixes macro, with no downward causation.  
     - *Set aside*: Purely a dependency relation. It says nothing about *stability*, *projectibility* (ii), or the *explanatory indispensability* of macro-descriptions (iii). Supervenience holds for trivial macro-properties (e.g., "total mass") that lack lawlike generalizations.

  4. **Reductionism (Nagel-style)**:  
     - *Why considered*: Aligns with micro-determination (i) and causal closure (iv).  
     - *Set aside*: Classical reduction requires *deriving* macro-laws *from micro-laws alone*. Your cases defy this: macro-regularities (e.g., critical exponents) aren't derived from micro-details but discovered through macro-patterns. Reductionism also denies (iii), treating macro-descriptions as dispensable.

  5. **Universality (in statistical physics)**:  
     - *Why considered*: Perfectly fits critical-point examples (ii)—macro-regularities persist across micro-variations due to renormalization group fixed points.  
     - *Set aside*: A specific physical phenomenon, not a general metaphysical concept. It doesn’t extend to non-critical cases (e.g., gas laws or traffic) and ignores the "nothing over and above" claim (i).

  6. **Explanatory Autonomy**:  
     - *Why considered*: Captures (iii): macro-generalizations are indispensable for stating laws.  
     - *Set aside*: Often decoupled from micro-determination (i). Autonomy can apply to emergent systems (e.g., consciousness) violating (iv), and doesn’t guarantee stability (ii).

  **Verdict**: Your pattern—(i) micro-determination, (ii) projectible stability, (iii) macro-indispensability, (iv) no extra causation—**lacks a unified established name** in the literature. It sits at the intersection of multiple concepts but is reducible to none. I propose coining the term **"Pattern Universality"** to define this precise configuration. Below, I define it, contrast it with existing concepts, provide boundary cases, and address the metaphysical stakes.

  ---

  ### The Concept: Pattern Universality
  **Definition**: *Pattern Universality* describes a macro-level regularity that:  
  (a) Is wholly determined by the microstate (satisfying (i) and (iv)),  
  (b) Exhibits robust projectibility across wildly varying micro-realizations (satisfying (ii)),  
  (c) Remains explanatorily irreducible: its lawlike status cannot be recovered from micro-details without prior macro-level insight (satisfying (iii)).  

  It is **not emergence** (no novelty or unpredictability), **not reduction** (macro-laws aren’t derivable from micro-first principles), and **not mere supervenience** (it adds nomological robustness). The term "universality" nods to statistical physics but generalizes beyond critical phenomena.

  #### How Existing Concepts Map to Your Criteria
  | Concept            | (i) Micro-Determination | (ii) Projectible Stability | (iii) Macro-Indispensability | (iv) Causal Closure |
  |--------------------|-------------------------|----------------------------|------------------------------|---------------------|
  | Multiple Realizability | ❌ (contingent)      | ⚠️ (necessary but insufficient) | ✅                           | ❌                  |
  | Supervenience      | ✅                      | ❌                          | ❌                           | ✅                  |
  | Weak Emergence     | ❌                      | ⚠️ (often)                  | ✅                           | ❌ (usually)        |
  | Nagelian Reduction | ✅                      | ❌ (fragile)                | ❌                           | ✅                  |
  | Universality (physics) | ✅                   | ✅                          | ⚠️ (implicit)                | ✅                  |
  | **Pattern Universality** | **✅**              | **✅**                      | **✅**                       | **✅**              |

  - ✅ = fully captures  
  - ⚠️ = partially captures  
  - ❌ = misses entirely  

  #### Boundary Cases
  **Excluded Case (Satisfies some but not all)**:  
  - *A fragile macro-property*: The resonant frequency of a specific crystal lattice.  
    - (i) and (iv) hold: fully micro-determined, no extra causes.  
    - (ii) fails: Tweak one atom, and the frequency changes. No stability across micro-variations.  
    - (iii) fails: The frequency *can* be derived from micro-details alone.  
    → **Excluded**: Lacks projectibility and indispensability.

  **Borderline Included Case**:  
  - *The ideal gas law in a non-ergodic system*: Simulated gas molecules with pathologically correlated velocities.  
    - (i) and (iv) hold: Macro-pressure is micro-determined.  
    - (ii) holds *if* correlations are "washed out" at scale (e.g., via coarse-graining).  
    - (iii) holds: The macro-law remains indispensable—micro-details alone won’t reveal \(PV = nRT\) without targeting pressure/volume.  
    → **Included**: Illustrates how (ii) and (iii) rely on *effective robustness* under coarse-graining, even in non-ideal cases.

  ---

  ### What Turns on the Answer: Metaphysical vs. Epistemic
  The distinction between "convenient bookkeeping" and "genuine level of law" is **substantively metaphysical**, not merely epistemic. Here’s why:  
  - **Epistemic reading**: One might argue macro-laws are just summaries of micro-states—useful for limited minds but ontologically redundant. This collapses your pattern to instrumentalism.  
  - **Metaphysical reading**: Pattern Universality implies macro-regularities are *real patterns* (Dennett 1991) that are *objective features of the world*. Their stability across micro-variations (ii) and indispensability (iii) reflect mind-independent, modal facts about how systems behave across possible perturbations.  
  - **Why it matters**: If macro-laws were merely epistemic, they could be eliminated by perfect micro-knowledge. But your cases show this is impossible—e.g., knowing all molecular positions won’t reveal *why* fluids/magnets share critical exponents without universality theory. The pattern’s invariance under micro-changes indicates a *physical constraint* on reality’s structure, akin to "laws of laws" (Ladyman & Ross 2007). Thus, Pattern Universality supports **non-reductive physicalism**: the macro is ontologically grounded in the micro (i/iv) but carries irreducible explanatory power (ii/iii).  

  In short, naming this pattern isn’t pedantry—it defends the reality of higher-level laws against both eliminative reductionism ("it’s all just particles") and strong emergence ("macrocauses override micro"). Pattern Universality carves nature at a joint where physics, metaphysics, and explanation converge.

  ---

  ### References to Explore
  - **Universality/Phase Transitions**: R. Batterman, *Emergence, Singularities, and Symmetry Breaking* (2011)  
  - **Non-Reductive Physicalism**: J. Fodor, *Special Sciences* (1974)  
  - **Real Patterns**: D. Dennett, *Real Patterns* (1991)  
  - **Metaphysical Grounding**: T. Sider, *Writing the Book of the World* (2011) §7.3
