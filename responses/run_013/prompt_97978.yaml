  First, I'll map the core structure. The exclusion argument has three key premises: causal closure (physical events have sufficient physical causes), property distinctness (mental ≠ physical), and no overdetermination. Students must deny one premise to avoid epiphenomenalism. 

  For the opening question, "are mental properties fundamentally physical?" handles identity vs distinction. If yes, we branch to reductive physicalism; if no, we need to probe further. The pain/C-fiber case needs careful phrasing - asking about causal contribution rather than identity avoids leading answers. 

