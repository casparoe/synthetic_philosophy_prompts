  - **Resolves lottery/preface tension**: Principles 2 and 3 block conjunctions like "all tickets lose" or "all book claims true" (addressing iii, vi), while allowing individual acceptance (i, iv) and the disclaimer (v).  
  - **Accommodates stakes (viii)**: \(T(C)\) increases with stakes, denying acceptance when risks are extreme.  
