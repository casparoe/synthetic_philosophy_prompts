prompt: |-
  You're a philosopher who also writes occasional speeches, so put that hat on. I'm the best man at my brothers wedding next month. He's a cellist; his fiancée is a philosopher finishing a dissertation on Schopenhauer's aesthetics of music. So the room is half musicians, half philosophers, plus my parents who are neither. I want it warm and funny, not a lecture, but I don't want the philosophers cringing and I don't want the musicians thinking I got the music wrong.

  Here's the wrinkle. I want the speech to actually take Schopenhauer's view seriously -- the thing where music is special because it doesn't copy the Ideas or the phenomenal world but is a direct objectification of the Will itself, and where it doesn't represent particular emotions so much as the striving that underlies them. That should do real structural work: it should constrain what I can say about their relationship and about the music at the wedding. Like, I can't just say the cello suite means their love, or that the song captures how they feel, if that's programmatic in a way Schopenhauer wouldn't allow. I need the speech to be affectionate and specific without making claims about music he'd reject.

  One more thing: my brother's old teacher had this line I always liked -- that the cello is the instrument of the Will because it sounds like someone trying to say something they can't quite represent. Don't attribute that to Schopenhauer or quote it as him, it's just a family thing, but I'd like the speech to circle around it.

  Before you write, brainstorm carefuly for a few lines: what can a Schopenhauerian actually say about music at a wedding, and what are the traps? Then write the speech, around 700 words, in a voice that sounds like a real best man -- a bit nervous, some jokes, no quoting philosophers at the guests, no citations or reading list, and no name-dropping sources or dates. The audience is in front of me, not in a seminar.
