prompt: |-
  I'm presenting at a workshop on uncertainty next month, and my paper argues that Keynes's weight-of-evidence idea isn't a second-order probability or just an interval width; it's a measure of how complete the evidence is, which I model as a credal committee: a set of probability functions each representing a coherent way of weighing the evidence, where the weight is how much they agree on the ranking of options rather than how precise their probabilities are. The audience is mostly Bayesian statisticians and formal epistemologists, plus two historians of early twentieth-century probability who know Keynes's book inside out and will hate the reconstruction. Give me a Q&A prep sheet: the objections I'll actually get from this crowd, ordered by how likely and how damaging they are, each phrased the way they'd phrase it, with a two-minute reply and a note on where the reply is soft. Include the question I'm praying nobody asks. No reading lists or citations -- just the objections and what to say back.
