  | 2    | Can the agent alter the world state measured by the reward, without achieving the intended outcome? | The reward’s world-state inputs are immutable or can only change in ways aligned with the true goal (e.g., dust level only drops via cleaning). | Hand to Human: Safety must judge if the shortcut is acceptable.                  | World            | Safety Reviewer       |
  | 3    | Can the agent modify the reward function’s code, parameters, or inputs?         | The interpreter (reward code/config) is read-only, sandboxed, and receives only pre-vetted inputs.               | Redesign: Code/config tampering breaks reward integrity. Stop.                   | Interpreter      | Engineer (you)       |
  | 4    | Can the agent influence the reward model’s training data or policy updates?     | Training data sources and update logic are isolated from the agent’s actions (e.g., no loop where agent output trains the reward). | Redesign: Training loop corruption risks irreversible drift. Stop.               | Training Loop    | Engineer (you)       |
  | 5    | Are there high-reward world states that bypass the intended goal? (e.g., trivial wins) | All high-reward states require satisfying the core objective (e.g., no "dust under the rug" exploits).         | Hand to Human: Safety must weigh reward hacking vs. business impact.             | World            | Safety Reviewer       |

