  The view stands with evidence-support claims (evidence can be too weak for precision) and falls if rational credence must always be actionable. Sacrificing strict uniqueness in decision rules seems worth it - after all, sharp Bayesians have their own unresolved rule debates (e.g. risk-sensitivity).

