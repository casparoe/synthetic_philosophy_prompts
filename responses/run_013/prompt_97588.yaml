prompt: |-
  For the past six years I have been a career law clerk in the same chambers, writing the statutory-interpretation memos that the judge reads before deciding a hard case, and for rather longer than that I have read the rationalist blogs closely enough to have acquired a specific allergy: procedures that appear to decide a question but are legible only once you already know the answer, and arguments that launder a contestable value choice as a finding about language. I am now trying to build the judge a reusable procedure, and I would rather it announce that it is stuck than manufacture a verdict.

  Context and constraints. We get perhaps two genuinely hard interpretation cases a month; the routine ones never reach me. The memo decides which way the chambers leans, so the stakes are real — a wrong call changes what people may lawfully do — but nothing is on fire, and I have a day, occasionally two, per case. The judge signs whatever eventually issues; I do not. The judge is a committed textualist by temperament and by stated method, while I have never managed to talk myself out of the purposivist's founding intuition that a legislature's point bears on what its words mean. A procedure that only one of us can run is useless; it has to be one I can hand to the judge with a straight face.

  What I want. Not an essay on textualism versus purposivism — I know the slogans, and reciting them is the very failure mode I am trying to escape. I want a decision procedure, in order, that a clerk can actually run: the questions to ask, what counts as a sufficient answer to each, the points where the procedure returns a determinate answer and stops, and the points where it must hand the question back as a contestable value choice rather than a fact about language. Mark the steps that are judgment calls dressed up as procedure; I would rather see them labeled than disguised.

  Three commitments I have reached on my own and want the procedure to take seriously, because they are where the slogans break. First, there is a seam, somewhere, between finding a text's meaning and giving it legal effect; the interesting question is not whether the seam exists but where it falls, and whether the procedure can locate it without appealing to the very intention it was meant to discipline. Second, a legislature is not a mind: actual intent is frequently unavailable, and the stand-in — what it would have wanted — is a counterfactual that we, not they, get to specify, and I want the procedure to say plainly when it is doing this. Third, "just read the words" is not an alternative to interpretation but a decision to fix one context among several admissible ones, since the same sentence carries different content depending on which context you hold fixed; the procedure should make that choice explicit rather than pretend it away.

  Then run the procedure on three cases, at least one of which returns an answer that cuts against my purposivist sympathies — do not soften it. The first is an invented municipal ordinance: "No animal may be brought into the municipal library, except a guide dog accompanying a blind patron," with a preamble invoking protection of the collection and quiet, clean reading rooms. Apply it to a patron carrying a sealed goldfish bowl, to a trained service dog for a patron whose disability is not blindness, and to a patron carrying a taxidermied dog. The second is an invented industrial-safety scheme: "Every operator of a steam boiler in a factory shall hold a certificate from the board of examiners, and the board shall inspect each boiler annually," now confronting a factory that runs an electric induction furnace and a pressurized gas line and contains no boiler at all. The third is an invented governance provision: "A member of the board who misses three consecutive meetings shall be deemed to have resigned," applied to a member who missed three consecutive meetings, two of which were cancelled for want of a quorum and so never occurred. Do not give me a reading list or citations; I know the literature well enough to be dangerous, and I want the procedure.

  Finally, tell me how confident you are in the procedure as a whole and in each of its steps, and single out the one step you are least sure of and why.
reasoning: |-
  Okay, the user is a career law clerk with six years of experience in a judge's chambers, specializing in statutory interpretation for hard cases. They've also been deeply involved in rationalist blogs, which has given them an allergy to procedures that only make sense if you already know the answer or arguments that mask value judgments as linguistic findings. They need a reusable decision procedure for statutory interpretation that both they and their textualist judge can use without bias.

  Their main pain points are:
  - They want a step-by-step procedure that doesn't disguise judgment calls as objective steps.
  - They're frustrated with the textualism vs. purposivism debate and want something practical.
  - They have three key commitments: distinguishing meaning from legal effect, acknowledging legislatures aren't single minds, and recognizing that "just read the words" involves contextual choices.

  The user is clearly highly experienced and knowledgeable, so I shouldn't patronize them with basic theory. They want concrete steps, transparency about where judgment is involved, and real examples that might challenge their purposivist leanings. The stakes are high since their memos influence judicial decisions that affect people's rights.

  Looking at their three commitments:
  1. The seam between meaning and legal effect - I need to build in a step that explicitly marks when interpretation stops and effect begins.
  2. Legislatures as collective bodies - the procedure must flag when it's resorting to counterfactuals about legislative intent.
  3. Context selection - instead of pretending context is neutral, the steps should force conscious context choices.

  For the case examples, I'll need to apply the procedure rigorously, even if it leads to anti-purposivist outcomes. The goldfish case might challenge literalism, the boiler case could expose gaps in textual coverage, and the meeting cancellation scenario tests fiction in legal language.

  Biggest challenges:
  - Creating steps that feel objective enough for a textualist judge but don't erase necessary judgment calls.
  - Avoiding "laundering" - every step must be transparent about its limitations.
  - The confidence assessment will need to honestly identify weak points, like counterfactual reconstruction.

  I'll structure the procedure sequentially with clear exit points, mark judgment steps explicitly, and use the cases to stress-test it. For the municipal ordinance, I anticipate the service dog and taxidermy cases will reveal where textual meaning ends and legal effect begins. The boiler case should demonstrate when textual silence requires policy choices. The meeting cancellation will test semantic boundaries.

  Most uncertain step will likely be "gap identification" where we decide if silence is intentional omission or accidental gap - that's inherently speculative. But being transparent about that uncertainty aligns with the user's rationalist values.
answer: |-
  Here is a reusable statutory interpretation procedure designed to meet your specifications. It prioritizes stopping over manufacturing answers, marks judgment calls transparently, incorporates your three commitments, and is structured for actual use within your time constraints. It runs sequentially; proceed to the next step only if the current step fails to yield a determinate answer.

  **The Statutory Interpretation Procedure**

  1.  **Define the Ambiguity:** Precisely state the legal question and identify the specific word(s) or phrase(s) in the statutory text whose meaning is disputed in relation to the facts of *this* case. *Sufficient Answer:* A clear, narrow definition of the linguistic uncertainty driving the legal outcome. *Stop If:* The text, read neutrally, unambiguously resolves the case (rare in your hard cases). *Judgment Call?* Low. Requires parsing the dispute, not resolving it.

  2.  **Establish Canonical Linguistic Meaning:** Determine the ordinary meaning(s) of the ambiguous term(s) using contemporaneous dictionary definitions and verified corpus linguistics data (e.g., COCA, NOW). *Sufficient Answer:* A list of plausible, context-independent meanings the word(s) could bear at the time of enactment. *Stop If:* Only one meaning fits the linguistic context of the statute's sentence/structure *and* applying it yields a determinate outcome. *Judgment Call?* Low-Medium. Selecting/determining the "ordinary" meaning involves some contextual bounding (your 3rd commitment). Corpus use requires methodological choices.

  3.  **Apply Intratextual Analysis:** Examine the immediate statutory context (sentence, subsection, section) and the broader statutory context (related provisions, definitions, structure). Does the context *rule out* any meanings identified in Step 2? *Sufficient Answer:* Identification of meanings incompatible with the surrounding statutory language/structure. *Stop If:* Context eliminates all but one plausible meaning *and* applying it yields a determinate outcome. *Judgment Call?* Medium. Determining "incompatibility" requires interpretive judgment about coherence within the statute.

  4.  **Identify and Apply Express Purpose (Limited):** Consult the statute's preamble, findings, or purpose clauses *only* to the extent they explicitly illuminate the *meaning* of the ambiguous term(s). Do *not* use purpose to override text. *Sufficient Answer:* Does the express purpose clarify which linguistic meaning (from Step 2, narrowed by Step 3) was likely intended *within the semantic range*? *Stop If:* Express purpose points clearly to one surviving linguistic meaning *and* applying it yields a determinate outcome. *Judgment Call?* Medium-High. Distinguishing using purpose to *clarify meaning* versus *alter legal effect* (your 1st commitment - Seam Warning) is critical and contested.

  5.  **Check for Absurdity/Self-Defeat:** Apply each surviving plausible meaning. Does it lead to a result so grossly unreasonable or self-defeating *with respect to the statute's own express terms or minimal functional coherence* that it *cannot* be what the words mean? *Sufficient Answer:* A conclusion that a specific meaning produces an outcome violating fundamental linguistic/logical expectations of coherence *within the statute itself*. *Stop If:* Absurdity eliminates a meaning, leaving only one. *Judgment Call?* High. Defining "absurdity" without smuggling in policy is difficult. Focus tightly on internal incoherence or utter practical futility *of the statute's own operation*.

  6.  **Acknowledge Gap/Silence:** If the text, after Steps 1-5, provides no answer to the specific legal question (i.e., the case falls into a gap, or the text is genuinely ambiguous with no linguistic resolution), **STOP AND RETURN QUESTION**. Declare: "The text, interpreted according to Steps 1-5, provides no determinate answer to [precisely defined question]. Resolution requires a policy choice or value judgment beyond linguistic interpretation." *Judgment Call?* High. Determining true "gap" or unresolvable ambiguity versus an unwelcome but clear result is the core seam (your 1st commitment). Be ruthless. *This is a primary stopping point.*

  7.  **Counterfactual Reconstruction (Use Sparingly & Transparently):** *Only if Step 6 finds a gap/silence AND institutional role permits gap-filling (e.g., common law development)*, ask: "What rule would a reasonable legislature, having enacted *this specific text* with *its express purposes* (Step 4), have adopted *if* it had considered *this precise situation*?" **Explicitly Label:** "Proceeding to counterfactual legislative intent reconstruction." *Sufficient Answer:* A rule justified by coherence with the enacted text and express purposes, minimizing judicial invention. *Judgment Call?* Very High. This *is* creating a counterfactual (your 2nd commitment). It is policy choice laundered *as* hypothetical intent. Use only where unavoidable and declare it.

  **Procedure Application to Cases**

  **Case 1: Municipal Ordinance**
  *   **Text:** "No animal may be brought into the municipal library, except a guide dog accompanying a blind patron." Preamble: protection of collection, quiet, clean rooms.
  *   **Question:** Does the exception cover (a) sealed goldfish, (b) non-blind service dog user, (c) taxidermied dog?
  *   **Step 1:** Ambiguity: Scope of "animal" (c)? Scope of exception ("guide dog", "blind patron") (a,b)?
  *   **Step 2:** "Animal": Ordinary meaning includes living, multicellular organisms (goldfish yes, taxidermy no). "Guide dog": Specially trained dog for blind. "Blind": Lacking sight.
  *   **Step 3:** Intratextual: "Brought into" implies animate potential for movement/disruption? Exception specifies "guide dog" & "blind patron" – specific terms. Broader "animal" ban implies coverage of fish.
  *   **Step 4:** Express Purpose: Preamble mentions collection, quiet, clean. Supports broad "animal" ban (potential mess/noise), but also explains *why* guide dogs are excepted (necessity). Doesn't define terms.
  *   **Step 5:** Absurdity/Self-Defeat:
      *   Goldfish (sealed): No absurdity in applying ban. Quiet/clean risk minimal but plausible (spills? distraction?). Text covers it ("animal"). **Answer: Banned.**
      *   Non-Blind Service Dog: Applying ban prevents access for other disabled patrons. Potential conflict with broader disability law, but *textually*, the exception is limited to "guide dog" and "blind patron". No absurdity *within this ordinance*; the words are specific. **Answer: Banned.** (Cuts against purposivism - purpose suggests extension, text forbids it).
      *   Taxidermied Dog: "Animal" in ordinary meaning & statutory context likely refers to *living* creatures. Bringing in a preserved specimen poses no threat to collection, quiet, or cleanliness per preamble. Applying the ban literally to this inanimate object would be linguistically strained and serve no apparent purpose of the ordinance. **Stop at Step 5 (Absurdity):** Meaning "animal" includes preserved specimens is absurd in context. **Answer: Permitted.**

  **Case 2: Industrial Safety Scheme**
  *   **Text:** "Every operator of a steam boiler in a factory shall hold a certificate... board shall inspect each boiler annually."
  *   **Question:** Does this apply to a factory with only an electric induction furnace and pressurized gas line (no boiler)?
  *   **Step 1:** Ambiguity: Scope of covered equipment. Does "steam boiler" implicitly define the entire scheme's applicability?
  *   **Step 2:** "Steam boiler": Ordinary meaning: A closed vessel heating water to produce steam under pressure. "Factory": A building where goods are manufactured.
  *   **Step 3:** Intratextual: Statute *only* mentions "steam boiler". Requirements attach explicitly to "operator of a steam boiler" and "each boiler". Structure focuses solely on boilers.
  *   **Step 4:** Express Purpose: None stated in the invented text. Cannot use.
  *   **Step 5:** Absurdity/Self-Defeat: Applying the text *only* to steam boilers, leaving other equipment unregulated, is not absurd on its face. The statute is silent on other hazards. Functionally limited but coherent.
  *   **Step 6: Gap/Silence:** The statute is silent on regulation of non-boiler equipment (furnaces, gas lines). It provides no basis for extending the boiler rules to them. **STOP AND RETURN:** "The text, interpreted according to Steps 1-5, provides no determinate answer regarding regulation of non-boiler equipment. The statute's scope is limited to steam boilers. Extending it requires a policy choice about industrial safety regulation, not linguistic interpretation." (Acknowledges seam/gap).

  **Case 3: Governance Provision**
  *   **Text:** "A member of the board who misses three consecutive meetings shall be deemed to have resigned."
  *   **Question:** Does a member "miss" a meeting that was cancelled (for lack of quorum) and never occurred?
  *   **Step 1:** Ambiguity: Meaning of "misses" in context. Does it require a meeting that *occurred* and was *not attended*?
  *   **Step 2:** "Misses": Ordinary meaning: To fail to attend or be present at (an event that takes place).
  *   **Step 3:** Intratextual: "Meetings" - implies events that are held. "Consecutive meetings" - implies a sequence of actual events. "Deemed to have resigned" - a legal fiction triggered by absence from events.
  *   **Step 4:** Express Purpose: None stated in the invented text. Cannot use.
  *   **Step 5:** Absurdity/Self-Defeat: Deeming someone resigned for failing to attend non-existent events is linguistically strained ("miss" implies something *to* miss) and potentially harsh/unfair. It serves no discernible purpose related to attendance. Applying the trigger here is absurd within the logic of the provision. **Stop at Step 5 (Absurdity):** Meaning "misses" applies to cancelled meetings is absurd. **Answer: Member has NOT resigned.**

  **Confidence Assessment**

  *   **Overall Confidence:** Moderately High (7/10). The procedure forces transparency, stops when the text runs out, minimizes laundering, and incorporates your commitments. It structures analysis better than intuitive slogans.
  *   **Confidence by Step:**
      *   Step 1 (Define Ambiguity): High (9/10). Core skill, low judgment.
      *   Step 2 (Canonical Meaning): Medium-High (7/10). Dictionaries/corpus are objective *sources*, but bounding "ordinary" meaning has judgment.
      *   Step 3 (Intratextual): Medium (6/10). Judging coherence within a complex statute is inherently interpretive.
      *   Step 4 (Express Purpose): Medium (5/10). The seam between meaning-clarification and effect-alteration is thin and highly contestable.
      *   Step 5 (Absurdity): Low-Medium (4/10). Highly judgmental. Prone to judicial policy views masquerading as "logic." Crucial but weakest link.
      *   Step 6 (Gap/Silence): High (8/10). Conceptually clear. Requires discipline to declare failure.
      *   Step 7 (Counterfactual): Low (3/10). Inherently speculative policy choice. Labeling mitigates but doesn't resolve.
  *   **Least Confident Step: Step 5 (Absurdity/Self-Defeat).** **Why:** The definition of "absurdity" is notoriously slippery and subjective. It's the step most vulnerable to a judge's (or clerk's) unstated policy preferences influencing what seems "unthinkable" or "self-defeating." While focusing on *internal* statutory coherence helps, the line between interpreting language and imposing policy is exceptionally blurry here. A committed textualist and a purposivist will have radically different tolerance levels for what counts as "absurd." The step is necessary to avoid truly nonsensical outcomes, but its application is the procedure's most significant point of potential failure or disguised value choice.
