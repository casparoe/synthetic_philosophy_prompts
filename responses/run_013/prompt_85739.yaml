prompt: |-
  Hey, I'm in a third-year ethics module and we've just done the "cluelessness" problem for consequentialism — the one where the long-run causal ripples of any action are so sprawling and entangled that you can't assign probabilities to the outcomes, so it's not just risk or ignorance but something worse: you can't even set up the outcome space in the first place. The lecturer clearly thinks it's devastating, basically declared so much the worse for the whole project, and then moved on to Singer, and I'm left not knowing what I'm actually supposed to take from it.

  Can you give me the most important implications of the problem, assuming you take it seriously? And please be discriminating — I want to know which implications really follow and which ones get overstated. Stuff I keep going back and forth on:

  - does it only bite distant-future effects, or does it also apply to obvious near-term things (whether to give a fiver to the guy outside Tesco, whether to go to the seminar at all)?
  - the difference between not knowing the probabilities and not knowing what the outcomes even are — does that distinction hold up, and does it make the problem better or worse?
  - is expected-value maximisation still usable, or is the real punchline that the expected value is undefined rather than merely unknown? (Not sure that's even a coherent way of putting it — tell me if not.)
  - can a consequentalist retreat to "subjectively right" or "what a reasonable person would do" without that just being a different theory in a trenchcoat?
  - what it does to cost-effectiveness comparisons between charities and cause areas, which seem to assume we can at least rank expected effects
  - is this a problem only for consequentialism or does everyone have it? My instinct is a Kantian also can't know what her maxim does in the long run, but maybe that's not the same thing at all.
  - my mate says you just stick to things with well-evidenced short-run effects (bednets, deworming) and ignore the rest — is that principled, or is it just changing the subject?

  No reading list or citations please, I just want the substance. I've got a 2000 word essay due and I want the argument map first.
