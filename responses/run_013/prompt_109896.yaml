prompt: |-
  I edit a tiny fake journal for my philosophy-of-mind reading group -- one issue a year, print run about nine -- and this year I want the whole thing built around Dennett's heterophenomenology. You know the move: the scientist doesn't ask whether the subject's reports are true, just transcribes them, treats the subject as a sincere speaker whose utterances are evidence the way a novelist's characters' speeches are evidence about a fictional world, and builds up a "heterophenomenological world" out of them. The researcher stays officially neutral about whether any of it answers to anything anyone actually experiences; the whole point is to get the science of consciousness going without having to settle the metaphysics first.

  What I want from you is the Instructions to Authors page for this journal, written completely straight, like a boring house style guide that somebody actually had to sit down and write -- 600-700 words. The funny has to come from taking the method seriously and following it all the way down into the paperwork, never from winking at the reader. So give me a scope statement, a submission checklist, formatting rules for the heterophenomenological world (is it a separate file? how do you cite an entity that exists only in one subject's report? give at least one worked example, say for a reported pain or a dream), whatever compliance declarations you think the method would generate -- I'd love a sincerity affidavit, and something like a "no Cartesian theatre" disclosure -- rules about what authors may and may not say about their subjects, and a short note on the questions reviewers are forbidden to ask.

  The guidelines should keep colliding with the fact that the journal is about consciousness, and should never quite be able to avoid the first person, and should never admit that this is a problem. Stay in character the whole way through: no ironic asides, no "of course, this is absurd," no narrator peeking out. Where the rules have to presuppose that subjects have experiences, let them do it in a footnote, as a formatting matter. And it shouldn't read like a list of gags -- it should read like a real style page that solves real editorial problems, so that someone who knows the literature recognizes the method and someone who doesn't still gets why the rules are strange.

  Just give me the page, start to finish, no preamble and no commentary before or after -- begin with the journal's name and the first heading.
reasoning: |-
  We are writing the Instructions to Authors page for a journal dedicated to Dennett's heterophenomenology. The journal is serious in tone, treating the method with full procedural rigor. The humor emerges from the extreme bureaucratic implementation of the method, without any explicit acknowledgment of absurdity.

   Key elements:
   - Journal name: Let's call it "Heterophenomenology Studies" (HS)
   - Scope: The journal publishes research using the heterophenomenological method to investigate consciousness.
   - Submission checklist: Must include the raw transcripts, the constructed heterophenomenological world, and compliance declarations.
   - Formatting rules for the heterophenomenological world: It should be a separate file. How to cite entities? We need a worked example (e.g., pain or dream).
   - Declarations: Sincerity affidavit (subject is taken as sincere), "no Cartesian theatre" disclosure (researcher does not posit an inner observer).
   - Rules about authors and subjects: Authors must not make claims about the subject's actual experiences, only about the heterophenomenological world.
   - Reviewer guidelines: Forbidden to ask questions that presuppose the reality of the subject's experiences.

   Structure the page:

   1. Journal Heading and Introduction
   2. Scope
   3. Submission Requirements (Checklist)
   4. Formatting Guidelines (including the Heterophenomenological World and examples)
   5. Compliance Declarations
   6. Ethical Guidelines (regarding subjects)
   7. Review Process (with note on forbidden reviewer questions)

   Let's write in a dry, bureaucratic style, with footnotes where necessary to handle the tension between the method and the subject matter.

   Note: The journal is print-only, 9 copies, but the instructions should be written as if for a standard academic journal.

   We begin:
answer: |-
  **Heterophenomenology Studies: Instructions to Authors**  

  **Scope of the Journal**  
  *Heterophenomenology Studies* publishes rigorous scientific and philosophical investigations into consciousness using the heterophenomenological method. Submissions must adopt the neutral stance of treating subjects’ verbal and behavioral reports as constitutive of a "heterophenomenological world" (HP-world). Manuscripts should refrain from ontological commitments regarding the correspondence between reported phenomena and private subjective experiences. Analyses of hallucinations, dreams, perceptual illusions, pains, or abstract qualia are welcome, provided they adhere strictly to the transcription-and-interpretation protocol.  

  **Submission Checklist**  
  Ensure your manuscript includes:  
  1. **Raw Transcripts**: Unedited records of all subject interviews, including nonverbal behavior annotations (e.g., "[subject clutches forearm]").  
  2. **HP-World Documentation**: A standalone appendix file detailing the constructed HP-world (see *Formatting* below).  
  3. **Compliance Declarations**: Signed affirmations of methodological neutrality (templates provided).  
  4. **Anonymized Subject Profiles**: Age, gender, and relevant background (e.g., "S02: 34F, no prior exposure to phi-tests"). Do *not* include speculative neurobiological or introspective data.  
  5. **Neutral Summary**: A conclusion section describing patterns within the HP-world without invoking unverified mental states (e.g., "The HP-world exhibits recurrent assertions of ‘blue’ under Condition B").  

  **Formatting Guidelines**  
  - **HP-World Appendix**: Submit as a separate .PDF. Structure it as a third-person narrative ontology.  
    - *Entities*: Define each reported phenomenon with a unique descriptor (e.g., "HP-Pain_Throbbing_S01_Trial3").  
    - *Citations*: Reference entities using descriptor tags. Do *not* use subjective terms (e.g., *incorrect*: "S01’s pain intensified"; *correct*: "HP-Pain_Throbbing_S01_Trial3 was reported as ‘spreading’ [Transcript 4:21]").  
  - **Worked Example**:  
    A subject reports: *"A red snake coiled in my dream, then bit my leg — it hurt!"*  
    **Transcript**: "[S03: ‘Red snake... bit leg... sharp pain’] [gestures toward calf]."  
    **HP-World Entry**:  
    `HP-Entity_DreamSnake_S03_Date: Visual form described as ‘red, coiled’ (Transcript 7.2).`  
    `HP-Event_Bite_S03_Date: Spatiotemporal correlation with HP-Sensation_Sharp_S03_Date (Transcript 7.3).`  
    `HP-Sensation_Sharp_S03_Date: Localized to ‘leg’ via verbal report and gesture (Transcript 7.3, Annotation 7.3a).`  

  **Compliance Declarations**  
  Include these signed statements:  
  1. **Sincerity Affidavit**: "I affirm that all subject reports are treated *as if* the subject is a sincere communicator, irrespective of private mental states."  
  2. **Neutrality Pledge**: "The authors take no stance on whether the HP-world corresponds to any first-person experience."  
  3. **Cartesian Theatre Disclaimer**: "This research does not posit an internal observer, homunculus, or ‘stage’ upon which phenomena are displayed¹. Descriptions are strictly extrapolated from behavioral and verbal outputs."  
    ¹*Formatting note: Terms like "experience" or "consciousness" refer solely to constructs within the HP-world.*  

  **Author Obligations Toward Subjects**  
  - Refer to subjects as "HP-world reporters." Do *not* characterize their internal states (e.g., avoid "S04 *felt* anxious"; use "S04 *reported* symptoms matching HP-Anxiety_Acute_S04").  
  - All subject identifiers must be anonymized. Mask inadvertently revealing details (e.g., "tennis coach" → "athletics professional").  
  - You may *not* include diary entries or unsolicited self-reports unless elicited under controlled interview conditions.  

  **Reviewer Guidance**  
  Reviewers are instructed to evaluate:  
  - Fidelity of HP-world construction to raw transcripts.  
  - Consistency in maintaining ontological neutrality.  
  - Adherence to descriptor-tagging protocols.  
  **Forbidden Questions**:  
  - "Do the authors believe the subject *actually* had this experience?"  
  - "What neural mechanisms *caused* the reported phenomenon?"  
  - "How does this HP-world relate to the subject’s *real* consciousness?"  
  Reviewers must limit critique to methodological rigor and HP-world coherence.  

  **Final Notes**  
  Manuscripts exceeding 12,000 words (excluding transcripts and HP-world appendix) will be returned. Use the Oxford comma. Citations of HP-entities must italicize descriptor tags (e.g., *HP-Sound_Buzzing_S05*). Failure to comply with neutrality declarations will result in desk rejection.
