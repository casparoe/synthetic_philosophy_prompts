prompt: |-
  Hey, I need you to act like a philosopher of decision theory who's spent way too long thinking about game theory's foundations -- someone who's comfortable with the formal machinery but cares mostly about the conceptual joints. Take your time with this one and reason carefully before you commit to anything.

  Quick background so we're on the same page, because I don't want you pulling a canned summary off the shelf: superrationality is the idea that two agents who know they'll reason identically about the same one-shot Prisoner's Dilemma should both cooperate, since whatever you'd choose, your mirror image would choose too. The pressure point I actually want to work on is what happens when the two agents aren't identical but merely correlated -- same training data, same culture, same reasoning habits, same algorithm, but not the same person. Then there's the uglier case I've been calling the one-sided handshake: you can commit to being superrational unilaterally, but if the other side isn't playing that game you just get defected on, and I dont know whether that's a cost worth bearing or just a mistake. A friend in my reading group keeps insisting the whole thing is evidential decision theory wearing a hat, which may or may not be right. And somewhere in the background there's the idea that agents can reason as a team rather than as individuals, which I suspect is either the same idea or a rival to it and I can't tell which.

  Here's the ask. Suppose a funder hands a small group -- three or four people, three years, philosophy plus some formal work, no lab, no experiments -- a pot of money to work on superrationality and its neighborhood. Don't give me a survey of the literature, and absolutely don't give me a reading list; assume I can't look anything up and that you shouldn't need to either. What I want is an agenda: which open questions here actually deserve those three years, in what order, and why.

  Before you rank anything, spend a few sentences brainstorming the space of open questions so I can see what you're choosing between. Then commit to an ordering. For each item I care about: why it's upstream of other questions rather than downstream, how tractable it is for people with philosophy plus a bit of math, what a good three-year outcome would even look like, and what evidence or argument over that period would move it up or down the list. Tell me what you're deliberately deprioritizing, and be honest about which of these questions might just be the same question restated. If you think the whole research program is confused, say so and defend it.
