  Okay, let me start by unpacking the user's query. They want me to act as a philosopher of decision theory focused on superrationality and its related concepts. The user has a specific scenario: a funded research group with three years to tackle open questions in this area. They provided background on superrationality, correlated agents, one-sided handshakes, and the connection to evidential decision theory (EDT) and team reasoning. The main task is to brainstorm open questions and then prioritize an agenda for the research group.

  First, I need to map out the key areas. The user mentioned superrationality where identical agents cooperate in a one-shot Prisoner's Dilemma. Then there's the extension to correlated agents—similar but not identical. The one-sided handshake issue is when one commits to cooperate regardless, risking exploitation. The user's friend links this to EDT, and there's team reasoning as either a rival or the same concept.

  Brainstorming the open questions involves identifying gaps. For example, how does correlation affect cooperation? What's the threshold of similarity needed? Then there's the one-sided commitment: is it rational, and under what conditions? The connection to EDT needs clarification—is superrationality just EDT in disguise? Team reasoning versus superrationality: are they different solutions to the same problem? Also, formalizing these concepts to avoid ambiguity is crucial. How do bounded rationality and real-world constraints play into this?

  Next, prioritizing these questions. The most upstream question is the correlation threshold because it underpins when superrationality applies. Without knowing how similar agents need to be, other questions can't be addressed. Then, the one-sided handshake—understanding if unilateral commitment is viable. After that, disambiguating EDT and team reasoning versus superrationality to clarify theoretical foundations. Formalization comes next to make concepts rigorous. Finally, exploring bounded rationality and scaling to real-world applications.

  Deprioritizing empirical work makes sense since the fund has no lab. Also, historical analysis and pure game theory without philosophical angles are lower priority. The user's deeper needs might include wanting a coherent framework to apply superrationality practically, resolving theoretical conflicts, and ensuring the research has tangible outcomes like models or proofs. They might also seek clarity on whether superrationality is a valid approach or if alternatives like team reasoning are better. Ensuring the agenda is actionable within three years with the given resources is key.
answer: |-
  Here's a reasoned agenda for your 3-year project, crafted from the conceptual foundations you've outlined. I'll structure it as requested: first brainstorming the open question space, then a prioritized agenda with justifications.

  **Brainstorming the Space of Open Questions:**

  1.  **The Correlation Threshold Problem:** How much correlation (training data, culture, algorithm, reasoning habits) is sufficient to induce "superrational" cooperation? Is it a smooth continuum or a sharp threshold? What *kind* of correlation matters most (shared priors vs. shared reasoning steps vs. shared goals)? This is foundational; without an answer, the domain of superrationality is ill-defined.
  2.  **The One-Sided Handshake Rationality:** Is unilaterally committing to cooperate (conditional on recognizing the other *might* be sufficiently correlated) ever instrumentally rational? What are the necessary beliefs (e.g., about the *prevalence* of sufficiently correlated agents in your interaction pool)? Is it simply a form of meta-cooperation aimed at encouraging a broader norm, or pure loss?
  3.  **Superrationality vs. EDT vs. Team Reasoning:**
      *   *EDT:* Is superrationality *just* EDT? If "I cooperate" is strong evidence "they cooperate" due to correlation, EDT says cooperate. But is the core intuition *dependent* on EDT's counterfactual handling, or is it a distinct principle (e.g., symmetry-as-reason)? Can EDT *recover* the correlation threshold?
      *   *Team Reasoning:* Is adopting the "team perspective" fundamentally different from recognizing symmetry/correlation? Does team reasoning offer a *better* justification for cooperation in correlated scenarios, or is it the same outcome via a different psychological route? Is team reasoning the "solution" to the one-sided handshake?
  4.  **Formalization & Scope:** Can we build a rigorous, non-circular formal model capturing the "sufficient correlation" concept *without* smuggling in identity or EDT? Does this model apply only to perfect symmetric games (PD) or imperfect ones? Does it require common knowledge of correlation, or just high-order belief?
  5.  **Bounded Rationality & Meta-Uncertainty:** How does the "sufficient correlation" concept hold up under realistic cognitive limits? How do agents *detect* or estimate correlation in practice? How do they handle the profound meta-uncertainty about *their own* reasoning process and its similarity to others?
  6.  **Robustness & Alternatives:** Is superrational cooperation fragile to tiny asymmetries, different priors, or the mere *belief* the other agent might be irrational? What happens with >2 agents? Are there demonstrably superior frameworks (e.g., bargaining solutions, correlated equilibria with communication) that achieve cooperation without the metaphysical baggage?

  **Prioritized 3-Year Research Agenda:**

  **Year 1: Foundational Clarification & The Correlation Threshold (Question 1 & 3)**
  *   **Why Upstream?** You cannot coherently discuss applications (one-sided handshake, scaling) or compare frameworks (EDT, Team) without defining the core phenomenon's *scope*. What *is* "sufficient correlation"? Untangling the EDT/Superrationality/Team knot is crucial to avoid talking past each other.
  *   **Tractability:** High. Philosophical analysis of concepts, constructing simple formal models (e.g., agent models with shared priors/algorithmic steps), comparing predictions. Requires logic, probability, basic game theory.
  *   **Good 3-Year Outcome:** A formally precise, defensible definition of "sufficient correlation for superrational cooperation" and a clear articulation (with proofs/counterexamples) of its relationship to EDT and Team Reasoning (e.g., "Superrationality requires X correlation and implies EDT cooperation, but EDT cooperation can occur without X; Team Reasoning achieves the same outcome without relying on evidence of similarity").
  *   **Progress Evidence:** Conceptual clarity in distinguishing the frameworks; formal models demonstrating necessary/sufficient conditions for correlation to induce cooperation; identifying scenarios where EDT/Team/Superrationality diverge in prescription.
  *   **Deprioritized:** Deep dives into one-sided handshake applications or complex multi-agent extensions. Empirical detection methods.

  **Year 2: The One-Sided Handshake & Rational Commitment (Question 2)**
  *   **Why Now?** With a clearer understanding of "sufficient correlation" (Year 1), we can rigorously analyze the rationality of unilateral commitment. This is the most pressing *practical* question ("is this a cost worth bearing?"). It builds directly on Year 1.
  *   **Tractability:** Moderate-High. Requires extending Year 1 models to include agents with uncertainty about the other's correlation level and type (superrational, standard rational, irrational). Game theory with incomplete information, decision theory under uncertainty.
  *   **Good 3-Year Outcome:** A characterization of conditions (beliefs about correlation prevalence, cost of exploitation, value of mutual cooperation, potential norm-building effects) under which a one-sided commitment to cooperate *is* rational. This might involve showing it's akin to a costly signal or an investment in changing the interaction ecology. A negative result (it's rarely rational outside near-perfect symmetry) is also valuable.
  *   **Progress Evidence:** Formal models showing expected utility calculations favoring one-sided commitment under specific belief distributions; identifying robust "commitment strategies"; philosophical arguments justifying commitment beyond immediate payoff (e.g., constitutive rationality, identity).
  *   **Deprioritized:** Extensive exploration of >2 agents. Full-blown evolutionary models.

  **Year 3: Robustness, Scaling, and Philosophical Coherence (Question 4, 5 & 6)**
  *   **Why Now & Downstream?** Years 1 & 2 clarified the core and key application. Year 3 tests its limits and integrates it. How sensitive is this to real-world messiness? Can it scale beyond hyper-symmetric toy models? Are there fundamental objections or clearly better alternatives? This synthesis is essential for judging the framework's overall viability.
  *   **Tractability:** Moderate. Requires more complex modeling (e.g., agents with noisy similarity detection, varying priors, hierarchical models of reasoning about reasoning). Philosophical synthesis. Some exploration of alternative solutions.
  *   **Good 3-Year Outcome:** A nuanced assessment of superrationality's robustness to asymmetries, bounded rationality, and meta-uncertainty. A clear picture of its domain of applicability and limitations. Identification of scenarios where it offers a *distinct* and *valuable* perspective compared to alternatives like team reasoning or standard correlated equilibrium. A defense against major objections (e.g., circularity, vacuousness under uncertainty).
  *   **Progress Evidence:** Models demonstrating cooperation persisting (or collapsing) under specific relaxations of symmetry/perfect knowledge. A compelling taxonomy of problem types suited to superrational vs. alternative approaches. Strong philosophical arguments addressing critiques of its foundations.
  *   **Deprioritized:** Developing comprehensive detection algorithms for real-world agents. Large-scale simulations of evolutionary dynamics.

  **Honest Assessment & Deprioritization:**

  *   **Potential Confusion:** The risk is high that "sufficient correlation" remains frustratingly vague or context-dependent. Team reasoning might emerge as a more robust and conceptually cleaner foundation for cooperation among "similar" agents, rendering superrationality redundant. The one-sided handshake might almost always be dominated by safer strategies unless specific, strong norm-based arguments hold water.
  *   **Deliberate Deprioritization:**
      *   **Empirical Work:** No lab, no experiments. Focus is conceptual and formal.
      *   **Pure Historical Analysis:** Understanding Hofstadter's original intent is less critical than analyzing the concept itself.
      *   **Full Evolutionary Game Theory:** While relevant to norm emergence, it's a massive field. Focus on the *rationality* of individual decisions given beliefs about correlation.
      *   **Complex Multi-Agent Systems:** Start with dyads; triads only if core concepts generalize easily (often they don't).
      *   **Pure Game Theory without Philosophy:** The conceptual joints *are* the point.
  *   **Same Question Restated?** The EDT vs. Superrationality debate *is* partially semantic but reveals a crucial tension: is cooperation driven by evidential *links* (EDT) or by the *recognition of symmetry* as a reason in itself? Year 1 must confront this. Team reasoning vs. Superrationality is more distinct: one changes the agency (we-mode), the other exploits symmetry within individual agency (I-mode).

  **Conclusion:** This agenda tackles the core conceptual puzzles head-on. Year 1 defines the battleground and core mechanism. Year 2 addresses the most salient practical worry (the handshake). Year 3 stress-tests the framework and seeks its unique value proposition. Success means either solidifying superrationality as a distinct, viable form of rational cooperation under correlation (with clear boundaries), or demonstrating that its insights are better captured (or refuted) by neighboring frameworks like team reasoning or refined EDT, providing decisive closure. The risk of the latter outcome is high, but that *is* valuable philosophical progress.
