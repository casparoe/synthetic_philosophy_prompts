  ### Ethics of Emerging Technology: In-Class Game Design  
  **Objective:** Illustrate how individual rational decisions aggregate to produce collective outcomes that depend on the payoff structure—without lecturing beforehand. Players experience both a "curse" (unilateral action causes disaster) and a "blessing" (coordinated inaction causes disaster).  

  ---

  ### **Materials**  
  - **State Coin**: A coin (heads = SAFE, tails = UNSAFE).  
  - **Signal Bags**:  
    - *Bag SAFE*: 70% Green cards, 30% Red cards.  
    - *Bag UNSAFE*: 70% Red cards, 30% Green cards.  
  - **Player Kits (per student)**:  
    - 1 **Signal Card** (Green/Red) for both rounds.  
    - 2 **Decision Cards** (Round 1: ACT/ABSTAIN; Round 2: ACT/ABSTAIN).  
    - 1 **Token Ledger** (track tokens earned).  
  - **Teacher Materials**:  
    - Master list of signals/state (pre-generated via RNG for speed).  
    - Tokens (or pen to mark ledgers).  

  ---

  ### **Rules**  
  **Core Structure**:  
  - **State of the world**: SAFE or UNSAFE (50/50 chance, fixed for both rounds).  
  - **Private signals**: Each player draws a signal (Green/Red) with 70% accuracy.  
  - **No communication**: Players decide simultaneously and privately.  
  - **Two rounds**: Identical signals, but different payoff structures.  

  #### **Round 1: The "Curse" Structure**  
  - **Payoffs**:  
    - **SAFE state**:  
      - ACT: **+10 tokens**  
      - ABSTAIN: **0 tokens**  
    - **UNSAFE state**:  
      - If *any* player ACTs → **all players lose 5 tokens**.  
      - If *all* ABSTAIN → **all get 0 tokens**.  
  - **Rationale**: Players with Green signals are incentivized to ACT (expected value positive), but if the state is UNSAFE, one ACT triggers collective disaster.  

  #### **Round 2: The "Blessing" Structure**  
  - **Payoffs**:  
    - **SAFE state**:  
      - ACT: **−1 token**  
      - ABSTAIN: **0 tokens**  
    - **UNSAFE state**:  
      - If *any* player ACTs → **ACT players lose 1 token; ABSTAIN players get 0**.  
      - If *all* ABSTAIN → **all players lose 10 tokens**.  
  - **Rationale**: Players with Red signals are incentivized to free-ride (ACT costs tokens; others might save the group). In UNSAFE, if all ABSTAIN, disaster strikes.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Setup (5 min)**:  
     - Flip State Coin (record secretly).  
     - Distribute Signal Cards: Draw from Bag SAFE/UNSAFE based on state.  

  2. **Round 1: Curse Scenario (25 min)**:  
     - Explain rules (emphasize: "If UNSAFE and *anyone* acts, *everyone* loses 5 tokens").  
     - Players write ACT/ABSTAIN decisions privately.  
     - Collect decisions → tally actions (but **do not reveal state or outcomes**).  

  3. **Round 2: Blessing Scenario (25 min)**:  
     - Explain rules (emphasize: "If UNSAFE and *nobody* acts, *everyone* loses 10 tokens").  
     - Players write ACT/ABSTAIN decisions privately.  
     - Collect decisions.  

  4. **Reveal & Calculate (15 min)**:  
     - Announce true state and signal distribution (e.g., "State was UNSAFE; 6 saw Green, 12 saw Red").  
     - Compute token outcomes for both rounds using payoffs. Update ledgers.  

  5. **Debrief (20 min)**:  
     - **Round 1 Focus (Curse)**:  
       - *If UNSAFE*: Ask: "Who acted? Most Red-signal players abstained rationally. Why did disaster still happen?"  
         → Highlight: One Green-signal player’s ACT (rational individually) caused collective loss.  
       - *Observation*: "As group size grows, chance of *someone* acting on a false Green climbs toward certainty."  
     - **Round 2 Focus (Blessing)**:  
       - *If UNSAFE*: Ask: "Who acted? Did anyone assume others would act?"  
         → Highlight: Many Red-signal players abstained to save 1 token, hoping others would ACT. Risk: If all abstain, disaster.  
       - *Contrast*: "In Round 1, unilateral action hurt all. In Round 2, unilateral *inaction* risked disaster."  
     - **Key Question**: "What made the outcomes diverge?"  
       → Guide students to see:  
       - **Curse**: Disaster requires *one* mistake in UNSAFE.  
       - **Blessing**: Disaster requires *zero* interventions in UNSAFE.  
     - **Name the Phenomenon (End Only)**: "This is the **unilateralist’s curse** (Round 1) and its mirror (Round 2)."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Round 1 Green-signal players abstain "to be safe."  
     - **Why**: Overcautiousness despite EV.  
     - **Fix**: Remind: "Your signal is 70% accurate. Calculate: If SAFE, ACT gains 10; if UNSAFE, ACT costs 5. With Green (70% SAFE), EV = (0.7×10) + (0.3×−5) = +5.5."  

  2. **Problem**: Round 2 SAFE-state players ACT "just in case."  
     - **Why**: Misunderstanding payoff irrelevance in SAFE.  
     - **Fix**: Clarify: "In SAFE, ACT costs you 1 token and does nothing. Only ACT in UNSAFE if you think no one else will."  

  3. **Problem**: Token math slows down reveal.  
     - **Fix**: Pre-calculate outcomes for common scenarios (e.g., "If UNSAFE and 4 ACT: Round 1 = −5 for all; Round 2 = −1 for actors, 0 for others").  

  ---

  ### **Limitations & What to Explain in Debrief**  
  - **Cannot reproduce**:  
    - Real-world evidence complexity (signals are simplified).  
    - Strategic iteration (players don’t revise beliefs).  
    - Altruism/group identity (e.g., engineers acting to "save" others).  
  - **Supply in Debrief**:  
    - "In reality, signals are noisier, and group dynamics matter. This is a *model* of how rational choices aggregate."  
    - "Ethical takeaway: Systems must be designed to avoid unilateral triggers (curse) or ensure intervention (blessing)."  

  ---

  ### **Load-Bearing Element**  
  - **Critical Rule**: Disaster threshold.  
    - **Change to Break**: Require *majority* ACT to cause disaster in Round 1.  
      - → Expected: Disaster becomes rare. Curse vanishes.  
      - **Observe**: In UNSAFE, few ACT → no disaster.  
    - **Change to Reverse**: Make Round 2 disaster require *all* to ACT.  
      - → Expected: Many ACT "to help" → no disaster. Blessing becomes curse.  
      - **Observe**: In UNSAFE, excess ACT → no disaster, but players lose tokens unnecessarily.  
  - **Design-Failure Signs**:  
    - **Curse fails**: UNSAFE state, but no one ACTs in Round 1.  
    - **Blessing fails**: UNSAFE state, but >50% ACT in Round 2.  

  ---

  ### **Why This Works**  
  - **Structure > Theory**: Players *feel* the curse (Round 1) and blessing (Round 2) via token losses.  
  - **Aha! Moments**:  
    - "I did nothing wrong, but we all lost!" (Round 1 UNSAFE).  
    - "I assumed someone else would act... but no one did" (Round 2 UNSAFE).  
  - **Ethical Hook**: Technology ethics isn’t about individual "bad actors"—system design creates collective risks.  

  Run tight on time? Shorten decision windows. Prioritize debrief—it’s where the learning crystallizes.
