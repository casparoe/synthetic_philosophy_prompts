     Another idea: in the blessing scenario, we can set that acting is costly and does not bring any personal reward, but it saves the group from disaster? Then:

          In unsafe state:
              if at least one acts, then everyone gets 0.
              if no one acts, then everyone gets -D.
          In safe state:
              if you act, you get -c.
              if you don't act, you get 0.

          Then:

              EU(act) = P(SAFE|signal)*(-c) + P(UNSAFE|signal)*0   [because if you act in unsafe, you get 0? but note: even if you act, you pay c? and we haven't included the cost in unsafe?]

          Let's include the cost: acting always costs c? and then:

              In unsafe state, if you act: you pay c, and then if your action is pivotal, you save the group? but otherwise you just pay c? 

          This is messy.

   Given the time, we might choose a simpler blessing structure:

          If the state is unsafe and you act, you get B (a reward for saving) minus c (cost), but only if you are the first one to act? Not simultaneous.

     But we have simultaneous moves.

     We can use the volunteer's dilemma: 
          In the unsafe state: 
              if at least one acts, then everyone gets 0.
              if no one acts, then everyone gets -D.
          In the safe state: 
              if you act, you get -c.
              if you don't act, you get 0.

          Then the cost of acting is c (incurred only if you act) and the benefit of acting in the unsafe state is that you avoid the -D for everyone? but you only avoid it if you are pivotal? 

     In the volunteer's dilemma, it's known that in equilibrium, there is a probability of volunteering that is less than 1? and as the group size increases, the probability that any one individual volunteers decreases? but the probability that no one volunteers increases? 

     This is the coordination curse: the more people there are, the more likely it is that no one acts? 

     So for Round 2 (Blessing) we can use the volunteer's dilemma structure:

          Payoffs:
            - Safe state:
                  Act: -c
                  Abstain: 0
            - Unsafe state:
                  Act: -c   (because you incur the cost and the disaster is averted)
                  Abstain: 0 if at least one other acts, -D if no one acts.

     Then EU(act) = P(SAFE|signal)*(-c) + P(UNSAFE|signal)*(-c)
                  = -c

          EU(abstain) = P(SAFE|signal)*0 
                       + P(UNSAFE|signal) * [ 0 * P(at least one other acts) + (-D) * P(no one else acts) ]

     For a player with a Red signal (suggesting unsafe):

          P(UNSAFE|Red)=0.7

          EU(act) = -c
          EU(abstain) = 0.7 * [ -D * P(no one else acts | UNSAFE, Red) ]

     They will act if EU(act) > EU(abstain) 
          => -c > 0.7 * [ -D * P(no one else acts | UNSAFE, Red) ]
          => c < 0.7 * D * P(no one else acts | UNSAFE, Red)

     With n large, P(no one else acts) is small? so EU(abstain) is close to 0? and if c>0, then EU(act) is negative, so they won't act? 

     But then no one acts? and disaster happens? 

     We need to set c very small? or D very large? 

     Let c=1, D=10.

     Then for a player with Red signal:

          EU(act) = -1
          EU(abstain) = 0.7 * [ -10 * P(no one else acts | UNSAFE, Red) ]

          If they think that others are likely to act (if they also have Red signals) then P(no one else acts) is small? then EU(abstain) is a small negative? but -1 is more negative? so they might not act.

     But if they think that others might not act, then P(no one else acts) is high? then EU(abstain) is very negative? so they act.

     This is the volunteer's dilemma: they act if they think that otherwise no one else will? 

     In equilibrium, they use a mixed strategy? That is complicated for the class.

   Given the complexity, I propose to use the following simpler approach for the blessing round:

     We change the action: instead of "act" or "abstain", we can have a different action that is not costly? or we can remove the cost? and make the only issue the coordination.

     We can do:

          In the unsafe state: 
              if at least one player does the action, then the disaster is averted and everyone gets 0.
              if no one does the action, then everyone gets -D.
          In the safe state: 
              if you do the action, you get 0.
              if you don't, you get 0.

     Then there is no cost to acting? and in the unsafe state, acting weakly dominates abstaining? because if you act, you are sure to get 0? if you abstain, you might get -D if no one else acts? 

     So EU(act) = 0.
          EU(abstain) = P(UNSAFE|signal) * [ -D * P(no one else acts | UNSAFE, signal) ]

     They will act if EU(act) > EU(abstain) 
          => 0 > P(UNSAFE|signal) * [ -D * P(no one else acts | UNSAFE, signal) ]
          => which is always true because the right-hand side is negative? so they should always act? 

     But then in the safe state, they act and get 0? fine.

     However, in the unsafe state, everyone acts? and we are saved? so there's no curse of coordination? 

     But we want the blessing to be that the group is likely to be saved? because at least one will act? 

     The problem of free-riding disappears because there is no cost? 

     So to capture the free-riding, we need a cost.

   Given the time, we will use a volunteer's dilemma with a cost and hope that in practice some students will free-ride? 

     We set Round 2:

          In safe state:
              - Act: -1 token
              - Abstain: 0 tokens
          In unsafe state:
              - Act: -1 token (because you pay the cost) but the disaster is averted? so you don't get penalized? but you paid the cost.
              - Abstain: if at least one other acts, you get 0; if no one acts, you get -10 tokens.

     Then for a player with a Red signal:

          EU(act) = -1   (because regardless of state, you pay 1)
          EU(abstain) = P(UNSAFE|signal) * [ 0 * P(at least one other acts) + (-10) * P(no one else acts) ]

          = 0.7 * [ -10 * P(no one else acts | UNSAFE, Red) ]

     They will act if -1 > -7 * P(no one else acts) 
          => 1 < 7 * P(no one else acts)
          => P(no one else acts) > 1/7

     If they think that the probability that no one else acts is greater than 1/7, then they act? otherwise, they free-ride.

     But note: conditional on unsafe, each other player has a Red signal with probability 0.7? and might act? The probability that a given other player acts is the probability that they think P(no one else acts) > 1/7? This is circular.

     This might be too complex for the class to reason about? We hope that in practice, some will act and some will free-ride? and with a large group, the probability that no one acts is low? so many might free-ride? leading to a positive probability that no one acts? 

     We can try to set the cost to 0 in the safe state for acting? but that would make acting in safe state costless? then in safe state, they might as well act? and in unsafe state, they have an incentive to free-ride? 

     Alternatively, we can make the cost of acting very small? and the disaster penalty large? then in the unsafe state, even though acting is costly, the fear of no one acting might push some to act? 

     Given the time, I will choose the following for Round 2:

          In safe state:
              Act: -1 token
              Abstain: 0
          In unsafe state:
              Act: -1 token   (you pay the cost and the disaster is averted)
              Abstain: -10 tokens if no one else acts, 0 otherwise.

     And then explain the rules accordingly.

     For a player with a Red signal (indicating unsafe), they will see that if they are pivotal (i.e., if without them no one else would act), then they save 10-1=9 tokens by acting? if they are not pivotal, then acting costs them 1 token unnecessarily? 

     They have to estimate the probability of being pivotal.

     In a large group, this probability is small? so they might not act.

     This is the coordination failure.

   Summary of the two rounds:

     Round 1 (Curse):
          State is drawn: SAFE or UNSAFE (50/50)
          Signals: with probability 0.7, the signal matches the state; 0.3 it does not.
          Payoffs:
              - If state is SAFE:
                    ACT: +10 tokens
                    ABSTAIN: 0
              - If state is UNSAFE:
                    If at least one player acts: EVERYONE (including abstainers) loses 5 tokens.
                    If no one acts: everyone gets 0.

     Round 2 (Blessing):
          The state and signals are the same as in Round 1.
          Payoffs:
              - If state is SAFE:
                    ACT: -1 token
                    ABSTAIN: 0
              - If state is UNSAFE:
                    If at least one player acts: 
                          - Those who acted: -1 token
                          - Those who abstained: 0
                    If no one acts: EVERYONE loses 10 tokens.

     We will not reveal the state or outcomes until both rounds are played.

     Timeline for 90 minutes:

       0-5 min: Introduction and forming groups (if needed) and explanation of the rules for Round 1.
       5-10 min: Distribute signal cards (each player gets one card that says either "Green" or "Red", which is their private signal for both rounds). 
            Note: the state is drawn by the instructor secretly (flip a coin: heads=SAFE, tails=UNSAFE) and then for each player, the instructor draws a signal: with 70% chance matching the state, 30% not. 
            How to do this practically? The instructor can pre-draw the state and then for each player, draw a random number (or use a random number generator) to determine the signal. Alternatively, for a class of 18, the instructor can have a bag with 70% Green and 30% Red if state is SAFE, and vice versa? But we have to do it once for the state and then for each player independently? 

       10-15 min: Round 1 decision: players write on a decision card for Round 1: either "ACT" or "ABSTAIN", and their name (or anonymous? we might want to collect for analysis). 
       15-20 min: Collect Round 1 decisions.

       20-25 min: Explain Round 2 rules (without revealing any outcomes or state).
       25-30 min: Round 2 decision: players write on a decision card for Round 2: "ACT" or "ABSTAIN".

       30-35 min: Collect Round 2 decisions.

       35-45 min: Compute the outcomes for both rounds. The instructor needs to:
            - For Round 1: 
                 * If state is SAFE: for each player who acted, they get +10; abstainers 0.
                 * If state is UNSAFE: if there was at least one "ACT", then everyone gets -5; if no one acted, everyone gets 0.
            - For Round 2:
                 * If state is SAFE: for each player who acted, -1; abstainers 0.
                 * If state is UNSAFE: if there was at least one "ACT", then each player who acted gets -1, and abstainers get 0; if no one acted, then everyone gets -10.

       45-75 min: Debrief (30 minutes) - see below.

       75-90 min: Conclusion and naming the phenomenon.

     Materials:
          - A coin for state.
          - A random number generator (or two bags: one for SAFE state containing 70% Green and 30% Red, and one for UNSAFE state containing 30% Green and 70% Red) to draw signals.
          - Index cards for signals (one per player, used for both rounds).
          - Decision cards for Round 1 and Round 2 (two per player, or one per player per round).

     What might go wrong:

         1. Drawing the signals might take time? We can pre-generate for the whole class using a spreadsheet and then hand out.

         2. In Round 1, players might not understand the global penalty? We can explain with examples.

         3. In Round 1, players with Green signals might not act? because they fear the penalty? We set the benefit high (10) and penalty moderate (5) so that EU(act) for Green is positive? (as calculated: 0.7*10 + 0.3*(-5) = 7-1.5=5.5>0). But if they condition on the state being unsafe? they might worry about causing the disaster? Hopefully, they won't do that complex calculation.

         4. In Round 2, players might act even in the safe state? but that costs them 1 token? so they shouldn't? and in the unsafe state, they might not act because of the cost? and hope others do? which is the free-rider problem? 

         5. The state might be safe and in Round 1 many act? which is fine? and in Round 2, hopefully few act? but in safe state, acting in Round 2 costs 1? so they shouldn't act? 

         6. If the state is unsafe, in Round 1 if at least one acts (which is likely because of the curse) then everyone gets -5? in Round 2, if at least one acts (which we hope happens) then actors get -1 and others 0? but if no one acts, everyone gets -10? 

     Debrief:

         1. Reveal the state and the signals distribution: 
              - How many got Green? How many got Red?
              - In the unsafe state, we expect about 30% to get Green? and 70% Red? and vice versa in safe state.

         2. Round 1:
              - Ask: how many acted in Round 1? 
              - If the state was unsafe: 
                    - We expect that some with Green acted? and if there was at least one actor, then everyone lost 5 tokens? 
                    - Highlight: even though most players (70%) had Red signals and knew it was unsafe, the few with Green signals acted? and that caused the disaster for everyone.
              - If the state was safe:
                    - Many with Green acted (and got 10) and those with Red might have acted or not? but the disaster didn't happen? so it's fine.

         3. Round 2:
              - Ask: how many acted in Round 2?
              - If the state was unsafe:
                    - We hope that at least one acted? so disaster averted? 
                    - But if no one acted? then everyone lost 10? 
                    - Why might no one have acted? because each player with a Red signal (which is most) might have thought: "someone else will act"?
                    - This is the free-rider problem? and in large groups, it becomes more likely that no one acts? 
              - If the state was safe:
                    - We hope that few acted? because acting costs 1? 
                    - But players with Red signals (which suggest unsafe) might have acted? but in safe state, that was a mistake? they lost 1 token unnecessarily.

         4. Compare the two rounds:
              - In Round 1 (curse), the structure was: one mistake causes global disaster? and with many players, it's likely that someone makes the mistake (even though individually they are acting on good evidence).
              - In Round 2 (blessing), the structure was: we need at least one to act to avoid disaster? but acting is costly? so with many players, it's more likely that everyone free-rides and no one acts.

         5. The key feature that decides between the two: 
              - In the curse scenario, the disaster is triggered by any single action in the unsafe state.
              - In the blessing scenario, the disaster is avoided only if at least one acts in the unsafe state.

         6. Name the phenomenon: 
              - Round 1 illustrates the "unilateralist's curse": the more people there are who might take a unilateral action, the more likely it is that someone will make a mistake and cause a disaster.
              - Round 2 illustrates the "coordination problem" or "volunteer's dilemma": when an action is costly and benefits everyone, it might not be taken in a large group.

     What the game cannot reproduce:

          - We assumed that players are rational and act based on expected utility? but in practice, they might not do the calculation? and might not understand the Nash equilibrium? 
          - In Round 2, the volunteer's dilemma might not show the free-riding if the players are not strategically sophisticated? They might act out of a sense of duty? or might not act because they think others will? 
          - The signals are independent? and the state is binary? in reality, the evidence might be more complex.

     Load-bearing element:

          - The key element is the aggregation of independent decisions and the threshold for the disaster.
          - If we change the disaster condition in Round 1 to require a majority of players to act in the unsafe state to cause the disaster, then the curse would disappear? because then it would be unlikely that a majority acts in the unsafe state? 
          - Similarly, in Round 2, if we change the condition to require a majority to act to avoid the disaster, then the free-rider problem might be less severe? 
          - What would we observe if the design failed? 
               . In Round 1, if the state is unsafe and no one acts? then the disaster doesn't happen? but we expect at least one to act? if that doesn't happen, then the curse didn't occur? 
               . In Round 2, if the state is unsafe and everyone acts? then there's no free-rider problem? but we hope that some free-ride? 

          - The design might fail if the benefit in Round 1 is not high enough? or the penalty in Round 2 is not scary enough? 

     Given the time, we hope that the chosen numbers (10, -5, -1, -10) are extreme enough to induce the behaviors.

   Let's finalize the rules for the two rounds:

     Round 1 (Curse):

          - Each player receives a private signal: Green or Red.
          - Each player chooses: ACT or ABSTAIN.
          - After all decisions, the outcome is determined by the state (which is the same for both rounds) and the actions:
              * If the state is SAFE:
                    - Players who chose ACT: gain 10 tokens.
                    - Players who chose ABSTAIN: gain 0.
              * If the state is UNSAFE:
                    - If at least one player chose ACT: then every player (whether ACT or ABSTAIN) loses 5 tokens.
                    - If no one chose ACT: then every player gains 0.

     Round 2 (Blessing):

          - Same state and signals as Round 1.
          - Each player chooses: ACT or ABSTAIN.
          - After all decisions, the outcome is determined:
              * If the state is SAFE:
                    - Players who chose ACT: lose 1 token.
                    - Players who chose ABSTAIN: gain 0.
              * If the state is UNSAFE:
                    - If at least one player chose ACT:
                           - Players who chose ACT: lose 1 token.
                           - Players who chose ABSTAIN: gain 0.
                    - If no one chose ACT: 
                           - Every player loses 10 tokens.

     We will not reveal the state until both rounds are played.

     We will tally tokens at the end? and maybe the winner is the one with the most tokens? but it's not a competitive game? it's to illustrate a point.

     We can just report the outcomes.

     Finally, we note: the players are not allowed to communicate during the rounds.

     This should fit in 90 minutes.

     Let's hope it works!
