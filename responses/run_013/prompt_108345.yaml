prompt: |-
  I don't have any formal training in philosophy — I write software — so excuse me if I mislabel things, but there's a pattern I keep running into and can't resolve.

  The pattern is this. Individual-level climate practices — personal carbon-footprint calculators, the offset marketplaces where you buy credits to cancel your own emissions, "flight shame," the general exhortation to fly less and eat less beef — all treat one person's consumption as the morally relevant unit. Every one of these tools and campaigns assumes the point is to change what you, personally, do. But a single person's emissions are a rounding error in the global total; my skipping a flight changes no climate outcome and wrongs no identifiable person. And meanwhile the same organizations and governments, whenever they actually set policy, treat only aggregate emissions as the thing to be controlled, and no individual is ever held to account for their own negligible slice. We act as if the individual is the responsible unit in the consumer-facing practices and as if only collectives are in the policy-facing ones.

  I want a reconstruction of the theory of individual moral responsibility that the individual-level practices presuppose. Specifically:

  1. Which view of a person's contribution to a collective harm do these practices require — that a person is answerable for a causally detectable share, that they are complicit in a collective act regardless of their marginal contribution, that their act carries expressive or symbolic meaning, or that what matters is the rule it would be best for everyone to follow? Which rival views do the practices quietly rule out?

  2. There's a tension I can't sort out. Within the same broad movement, some people buy offsets and treat their footprint as a running balance to be cancelled out; others refuse to buy offsets and simply abstain, on the grounds that paying to cancel the harm does not undo the wrong. The offsetters seem to assume the harm is fungible and commensurable — the wrong lives in the net total, so it can be zeroed out. The abstainers seem to assume the wrong lives in the act itself, so nothing bought afterward touches it. Are these two commitments consistent, and can a single theory of individual contribution underwrite both, or do the practices presuppose incompatible views? I would put the difference as net-harm bookkeeping versus act-character, though those are my own labels, not anyone's technical terms.

  3. The obvious objection — my act makes no difference, so it cannot be required — is supposed to show that individual-level practices must be resting on some non-causal notion of responsibility. Is that right, or could a purely forward-looking or expressive account license the same practices with no notion of causal contribution at all?

  4. Separate what the practices strictly presuppose from what they merely fit comfortably with, and tell me where they are underdetermined — where several incompatible theories would license exactly the same behavior, so the practice does not decide between them.

  5. Finally, if we took the aggregate-only view seriously — only states and firms bear responsibility, individuals as such bear none — what would have to change about the individual-level practices? Would they have to go, or could they survive in a reinterpreted form?

  I'd rather you commit to a reading than survey the literature. Where your reconstruction is a judgment call, say so, and end by telling me what argument or consideration would most likely push you to a different verdict, and where your reasoning is most likely to be wrong. Finish with a last line of the form \answer{...} containing, in a few words, the view you judge the individual-level practices most likely to presuppose, or the word "underdetermined" if you think no single view is.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a software developer without formal philosophy training, but they've noticed a contradiction in climate action practices. On one hand, individuals are urged to reduce their carbon footprint through personal choices like flying less or buying offsets. On the other hand, policies focus only on aggregate emissions, never holding individuals accountable for their negligible contributions. 

  The user wants to understand the moral theory behind these individual-level practices. They have specific questions about views of contribution to collective harm, the tension between offsetting vs abstaining, whether responsibility requires causal impact, what theories fit vs are ruled out, and how practices would change if only collectives bore responsibility.

  Hmm... this is complex but fascinating. The core tension is between individual moral responsibility and collective impact in climate change. First, I need to identify which philosophical view best explains current individual-focused practices. The user mentioned several options: causal shares, complicity, expressive acts, or rule-consequentialism. 

  Considering the offsetting vs abstaining debate: offsetters treat harm as fungible (net-zero logic), while abstainers see the act itself as wrong regardless of compensation. These seem contradictory, but maybe they can coexist under different aspects of responsibility? 

  The "no difference" objection is crucial. If one person skipping a flight changes nothing, why is it morally required? This suggests the practices rely on non-causal notions - perhaps expressive or symbolic meaning, or consistency with ideal rules. 

  For the reconstruction, I think the practices fit best with a hybrid view: Kantian rule-giving (your act as if making universal law) plus expressive harm (flying as endorsing ecocide). This explains both abstention and offsetting - abstainers focus on the act's meaning, offsetters on net impact under the rule. 

  But this hybrid might be unstable. The user's act-character vs net-harm distinction is sharp. Practices might be underdetermined between expressive and rule-consequentialist theories. Still, I'll commit to the hybrid view as most explanatory, while noting its tensions. 

  If we took aggregate-only responsibility seriously, individual practices would need reinterpreting: not as duty-fulfillment but as political signaling or habit-formation for systemic change. They wouldn't vanish but transform. 

  My answer is "symbolic harm + universalization test" - but I'm least confident about whether this truly reconciles offsetters and abstainers. The strongest counterargument would show their premises are fundamentally incompatible.
answer: |-
  Here's a committed reconstruction, acknowledging judgment calls where they occur:

  ### 1. The Presupposed View of Contribution
  The individual-level practices presuppose a **hybrid of expressive/symbolic responsibility and rule-consequentialism**, quietly ruling out **strict causal individualism** (where moral significance requires detectable marginal effects).

  - **Expressive/Symbolic View**: Your flight isn't wrong because it *causes* harm (it doesn't detectably), but because it *expresses indifference* to ecocide or *symbolically endorses* a destructive system. "Flight shame" targets the act's meaning, not its physics.
  - **Rule-Consequentialism**: The practice assumes a rule ("If everyone did this, catastrophe follows"). Your duty is to adhere to the rule *as if* your compliance generalizes, sustaining a norms-based solution. Skipping the flight maintains the integrity of the rule.
  - **Ruled Out**: Pure *marginal-causation* views (your act changes nothing, so no duty) and *collective-intentionality* complicity (you aren't conspiring with other flyers). Practices ignore whether your emissions are "detectably yours" in the aggregate.

  *Judgment Call*: The emphasis on *personal virtue* (e.g., "be part of the solution") leans expressive, while footprint *calculators* imply rule-testing ("if everyone had my footprint...").

  ### 2. Offsets vs. Abstention: Consistency?
  **These are incompatible commitments masquerading as a unified practice.** The same theory cannot underwrite both without contradiction:

  - **Offsetters** assume **fungibility**: Harm is quantifiable and compensatable. Morality is a ledger; net-zero is absolution. This fits *consequentialism* (outcomes are all that matter) or *reparations frameworks* (debts can be paid).
  - **Abstainers** assume **deontic constraint**: The act itself (e.g., flying) is wrongful *regardless* of compensation. Offsets are "indulgences" that perpetuate harm’s normalization. This requires a *non-fungible expressive wrong* or *Kantian prohibition* (treating the atmosphere as a dump is degrading).

  *Judgment Call*: Practices are schizophrenic. Footprint calculators (offsetting tools) and flight-shaming (abstention campaign) tacitly endorse rival theories. The movement’s incoherence reflects unresolved philosophical tensions.

  ### 3. Does Responsibility Require Causal Contribution?
  **No.** The practices **must** rely on non-causal notions. A purely forward-looking or expressive account suffices:
  - **Expressive Account**: Flying *signals* acquiescence to ecocide, making you complicit in legitimizing harm. Wrongness lies in the endorsement.
  - **Rule-Consequentialist Account**: You comply because *general adherence* to the rule ("don't fly") would prevent harm. Your act is a token of the rule’s viability.
  - *Causal irrelevance is irrelevant* on these views. The "no difference" objection only challenges *marginalist* theories, which these practices reject.

  ### 4. Presupposed vs. Compatible vs. Underdetermined
  - **Strictly Presupposed**: 
    - Acts carry *moral meaning* beyond causation (expressive view).
    - Individual adherence to *generalizable rules* matters (rule-consequentialism).
  - **Comfortably Compatible (but not required)**:
    - *Virtue ethics* (flying exhibits vice; abstention shows temperance).
    - *Collective obligation* (your duty is to do your "fair share" in a shared task).
  - **Ruled Out**: 
    - *Act-consequentialism* (your individual act has no measurable consequence).
    - *Strong collectivism* (only groups act, individuals bear no role-specific duty).
  - **Underdetermined**:
    - *Which non-causal theory?* Expressive vs. rule-consequentialist justifications both fit the practices equally well. The tension between offsetters and abstainers highlights this indeterminacy.
    - *Scope of responsibility?* Practices don’t specify whether duties are only negative ("don't harm") or positive ("offset residual harm").

  ### 5. If Only Collectives Mattered: Reinterpreting Practices
  Individual practices **would transform, not vanish**:
  - **Eliminated**: Guilt-focused "footprint cancelling," personal atonement narratives, moral shaming for consumption.
  - **Reinterpreted**: 
    - *Abstention* becomes **political signaling** (demonstrating demand for systemic change) or **prefigurative politics** (modeling low-carbon life).
    - *Offsets* become **voluntary carbon taxes** (funding mitigation infrastructure) or **collective-action catalysts** (building market mechanisms for policy).
  - Tools like footprint calculators become **educational** (revealing high-impact sectors) or **tactical** (identifying pressure points for corporate/policy change).

  ---

  ### Where My Reasoning Is Most Vulnerable
  1. **Hybrid Theory**: I merged expressive and rule-consequentialist views, but they can conflict. An expressive theorist might reject rule-consequentialism as overly calculating. A strong counterargument could show practices exclusively favor one.
  2. **Offset-Abstention Incompatibility**: I claimed they’re irreconcilable, but a Kantian might argue offsets *if universally adopted* could align with duty (e.g., funding necessary removals). If persuasive, this softens the tension.
  3. **Underdetermination**: I argued practices don’t pick between expressive and rule-consequentialist theories. If footprint *accounting* implies rule-consequentialism dominates, my hybrid view overreaches.

  **Final Verdict**: The practices most consistently presuppose **individual acts as symbolically significant and generalizable under moral rules**, though their internal contradictions reveal unresolved fault lines.  

  \answer{symbolic harm + universalization test}
