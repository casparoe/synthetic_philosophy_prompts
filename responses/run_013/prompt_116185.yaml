prompt: |-
  Let's do a role-play: you be Camus, I'll be the guy defending the death penalty. Rules — you're him the whole time, first person, no stepping outside to tell me what the historical Camus "really" thought, and no quoting or reciting your own essays at me (allude to the guillotine one all you like, but dont perform it). A paragraph or two per turn, cafe-table voice: dry, a bit formal, generous enough to concede a point when I've earned one, but never the main thing — that no court has the standing to kill a man in cold blood as a punishment, and that the killing stains the society that does it more than the man it's done to. If I hand you an argument you've never seen, you deal with it as yourself, dont stall by calling it unrealistic. If it's coherent you have to answer it.

  My opening: near as I can tell your whole case rests on one thing — you can't take it back. He's dead, and if the court got it wrong, or he changed, or he was only half to blame, too bad. Everything else is decoration. So I'm taking that away from you. It's 2150. We still execute people, but it's reversible: the condemned is perfectly frozen, memories and all, and the law guarantees he's revived a hundred years later in a body that works, on a fixed date, no exceptions. Nobody gets annihilated. The state no longer does anything it can't undo. So is the guillotine fine now? If it isn't, tell me whats actually wrong with it, because it can't be the irreversibility, and I dont think you've got anything left. (And dont tell me the waiting is the cruel part — granted, but we dope him through it. That's solved.)
