prompt: |-
  My colleague and I spent most of yesterday evening arguing about inverse reinforcement learning, and we stopped only because we had each talked ourselves hoarse, not because we had converged. His position is that when we infer a reward function from a set of demonstrations, we are inferring a fact about the policy the demonstrator happened to run, and that calling the fitted function a preference is a courtesy extended to a curve. Mine is that something genuinely about the demonstrator's preferences is recoverable, and that his view mistakes the instrument for the object. What kept the argument alive was a distinction I proposed and then could not state cleanly, and which I would now like to turn into a proposal.

  The distinction is this: a demonstration is evidence for a preference only relative to a description under which the demonstrator was acting. The person who takes the stairs rather than the lift may be revealing a taste for exertion, a fear of the lift, a belief that the lift is out of service, or a habit formed when it was. The same trajectory is evidence for different reward functions depending on which description we suppose the agent to have been acting under. Standard formulations fix the description in advance: they define the state and action spaces, the features, the horizon, and the discounting, and only then ask what reward best explains the behavior. If the description is itself something the inference should deliver, then reward and description are inferred jointly, and the identifiability results that are supposed to reassure us about reward alone no longer apply. My colleague thinks this dissolves the target rather than refining it; I think it locates the target more precisely, and that the interesting question is what additional structure, if any, could pin the description down without circularity.

  I would like you to write the short research proposal that comes out of this, one page, for a small interdisciplinary workshop that puts philosophers of mind and machine-learning researchers in the same room, and I will be circulating it to people who will not accept a hand-wave. State the question so that it has a determinate answer, rather than as a lament that preferences are hard to read off behavior. Explain why the current formulations leave the question open, without pretending that anyone has posed it in exactly these terms before. Set out the approach I would actually take and why it beats the obvious alternatives, which for my money are either adding a hierarchy of reward functions or falling back on the demonstrator's own verbal reports; say what would count as a result, what would count as the reframing collapsing into something already standard, and what would count as the project failing outright. Be honest about the scope that fits the page limit and say plainly what part of this could not be settled on that scale. Do not include citations or a reading list; I will add those myself, and I would rather the proposal stand on the shape of the problem than on appeals to authority.
reasoning: |-
  We are writing a one-page research proposal for an interdisciplinary workshop. The audience includes philosophers of mind and machine learning researchers. The proposal must be concise and stand on the problem's structure, not on citations.

  The core issue: In inverse reinforcement learning (IRL), we infer a reward function from demonstrations. The debate is whether the inferred reward function captures a genuine preference of the demonstrator or is merely a description of the policy they happened to run.

  The key distinction: A demonstration is evidence for a preference only relative to a description under which the demonstrator was acting. The same behavior can be explained by different reward functions depending on the agent's mental state (e.g., beliefs, habits, or preferences). Standard IRL fixes the description (state/action spaces, features, etc.) in advance, then infers the reward. But if the description is also part of what we must infer, then we have a joint inference problem, and identifiability is lost.

  Research Question: How can we jointly infer both the description under which an agent acts and the reward function that explains their behavior, and under what conditions can we recover a unique and meaningful representation of the agent's preferences?

  Why current formulations leave the question open:
  - Standard IRL assumes a fixed MDP structure (state and action spaces, features, discounting). This ignores the fact that the agent's own description (e.g., what features they attend to, what they believe) is part of the explanation of their behavior.
  - Without fixing the description, the reward function is underdetermined. But if we fix it arbitrarily, we might be imposing our own frame rather than recovering the agent's.

  Approach:
  1. Formulate a model that includes both the reward function and the "description" (which we might think of as a representation of the world the agent is using, including features, state abstraction, beliefs, and perhaps even the discounting). This is a joint inference problem: we want to infer the agent's representation and reward function given their behavior.
  2. We need additional structure to break the underdetermination. We propose to use:
     - The principle of rationalization: We assume the agent is acting optimally (or near-optimally) under their own representation and reward. This is standard.
     - But also, we propose a principle of minimality or simplicity: We prefer representations that are as simple as possible while still explaining the behavior. This is in the spirit of Occam's razor.
     - However, we must also account for the fact that agents might have false beliefs. Therefore, we may need to infer both the agent's representation (which might be a simplified model of the world) and their beliefs (which might be incorrect) and their preferences.
  3. We can model the problem as a hierarchical Bayesian inference. The top level is the agent's representation (which we can think of as a model class for the MDP). Given a representation, we then infer the reward function and the agent's policy (or the belief state if there is uncertainty). The joint probability of the representation and the reward given the data (trajectories) is proportional to the likelihood of the trajectories under that representation and reward, times a prior on representations and rewards.
  4. The prior on representations can encode our bias towards simpler models (e.g., representations with fewer features, or coarser state abstractions). The prior on rewards can be uninformative or based on some default (e.g., sparse rewards).

  Why this beats the alternatives?
  - Alternative 1: Hierarchies of reward functions (e.g., using a prior over reward functions). This doesn't address the representation issue because the state space is still fixed. Our approach explicitly models the representation.
  - Alternative 2: Using verbal reports. These are often unreliable and may not align with the agent's true internal state (due to self-deception, lack of introspection, or miscommunication). Our approach uses behavior and the principle of rationalization, which is more fundamental to the IRL setup. However, we can use verbal reports as additional data to constrain the inference if available.

  What would count as a result?
  - A formal framework for joint inference of representation and reward.
  - Theoretical conditions under which the representation and reward are identifiable (or at least, the set of possibilities is constrained). For example, we might show that with enough diverse demonstrations, the representation and reward become identifiable up to some equivalence class.
  - Algorithms for approximate inference in this framework and experiments on synthetic and real human data (e.g., from user studies or existing datasets) to show that the inferred representations align with what we know about the human's mental state (if available) and that the inferred reward leads to better imitation or generalization than standard IRL.

  What would count as the reframing collapsing into something standard?
  - If we find that in practice the representation is always fixed by the data (e.g., because the demonstrations are so rich that they pin down the representation uniquely) then we are back to standard IRL. But we expect that in many cases, the representation is not fixed, and our method would yield multiple plausible interpretations.

  What would count as the project failing outright?
  - If the joint inference problem is too underdetermined even with the simplicity prior, so that we cannot get any meaningful constraint on the representation and reward, then we might not be able to recover anything useful. Also, if the model is computationally intractable for realistic problems, it would fail.

  Scope and limitations:
  - Within the page limit and a short project, we can only address a simplified version of the problem. We will focus on discrete state and action spaces and a finite set of candidate representations (e.g., a set of feature sets or state abstractions). We will not address continuous spaces or the full complexity of human mental states.
  - We cannot settle the philosophical question of what preferences "really" are. But we can provide a formal model that makes explicit how preferences depend on representations, and thus clarify the conditions under which we can attribute preferences to agents.

  Structure of the Proposal:

  Title: Joint Inference of Representation and Reward in Inverse Reinforcement Learning

  1. Introduction and Motivation:
     - Inverse reinforcement learning (IRL) aims to infer a reward function from observed behavior.
     - However, the same behavior can be explained by many reward functions if we vary the representation (state features, beliefs, etc.) under which the agent is acting.
     - This leads to a debate: does IRL recover genuine preferences or just a description of the policy?
     - We propose that the reward function is meaningful only relative to a representation, and we need to infer both.

  2. Problem Statement:
     - How can we jointly infer an agent's representation (i.e., the descriptive framework they use) and their reward function from observed trajectories?
     - What additional principles (e.g., simplicity) allow us to break the underdetermination?

  3. Current Limitations:
     - Standard IRL fixes the representation (state/action spaces, features) in advance, which may not match the agent's own representation.
     - Without the agent's representation, the inferred reward may not reflect the agent's preferences.

  4. Proposed Approach:
     - We model the agent as acting optimally under their own representation and reward.
     - We set up a hierarchical Bayesian model that infers the representation (from a set of candidates) and the reward function given the trajectories.
     - The prior over representations favors simpler models (e.g., with fewer features or a coarser state abstraction).
     - We will develop algorithms for inference and study identifiability.

  5. Expected Outcomes and Evaluation:
     - A theoretical characterization of identifiability under the joint model.
     - Algorithms and experiments showing that we can recover the correct representation and reward in controlled settings and that it generalizes better.

  6. Significance:
     - This bridges the gap between the philosophical view (preferences are relative to a description) and the machine learning practice.
     - It provides a more robust foundation for preference learning in AI.

  7. Scope and Limitations:
     - We focus on discrete, finite problems and a predefined set of representations.
     - We do not claim to solve the full problem of mental state attribution, but we provide a formal model that makes the dependency explicit.

  Now, writing the one-page proposal accordingly.
answer: |-
  ### Research Proposal: Joint Inference of Representation and Reward in Inverse Reinforcement Learning

  #### 1. Introduction and Motivation  
  Inverse reinforcement learning (IRL) infers a reward function from observed behavior, aiming to capture an agent’s preferences. However, the same trajectory (e.g., taking stairs over a lift) can signal a preference for exercise, a fear of lifts, a belief the lift is broken, or a habit. This ambiguity arises because behavior is evidence for a reward only relative to the *description* under which the agent acts—their subjective representation of states, actions, features, beliefs, and goals. Standard IRL fixes this description in advance (e.g., defining state spaces or features), then fits a reward. If the description itself must be inferred, reward and description become entangled, and standard identifiability guarantees fail. This pits two views against each other: (1) IRL recovers genuine preferences relative to the agent’s frame, or (2) it merely curves a policy, mistaking the instrument for the object. We propose to resolve this by formalizing the joint inference of description and reward.

  #### 2. Core Question  
  Under what conditions can we uniquely identify both an agent’s *internal description* (their representation of the decision problem) and their *reward function* from demonstrations, using only behavior and without circularity?

  #### 3. Why Current Frameworks Leave This Open  
  Existing IRL methods assume a fixed description (e.g., states, actions, discounting). This presumes the demonstrator’s representation matches ours, ignoring that the same behavior admits multiple interpretations if representations vary (e.g., "stairs as exercise" vs. "stairs as avoidance"). When descriptions are fixed exogenously, rewards are identifiable only up to linear transformations or other equivalences. But if descriptions are part of the inference, the problem becomes underdetermined: infinitely many (description, reward) pairs rationalize the same behavior. No formulation addresses how to jointly infer both while avoiding trivial relabelings or preserving the link to preferences.

  #### 4. Proposed Approach  
  We frame the problem as **hierarchical Bayesian inference over descriptions and rewards**, grounded in two principles:  
  - **Rationality**: The agent acts optimally given their description and reward.  
  - **Minimality**: Descriptions should be maximally compressed (e.g., fewest features or simplest beliefs) while explaining behavior.  

  **Methodology**:  
  - **Model Class**: Define a space of candidate descriptions \( \mathcal{D} \), where each \( D \in \mathcal{D} \) specifies state/action spaces, features, discounting, and beliefs. For example, \( D \) could encode whether the agent represents "lift fear" as a feature or believes the lift is broken.  
  - **Inference**: For observed trajectories \( \tau \), compute the posterior:  
    \[
    P(D, R \mid \tau) \propto P(\tau \mid D, R) \cdot P(R \mid D) \cdot P(D)
    \]  
    Here, \( P(\tau \mid D, R) \) measures the likelihood of \( \tau \) under optimality in \( D \), \( P(R \mid D) \) is a prior on rewards (e.g., sparse or smooth), and \( P(D) \) favors simpler descriptions (e.g., via description length or feature sparsity).  
  - **Identifiability Constraints**: Inject weak, description-agnostic biases:  
    - *Cross-context consistency*: The same reward must explain behavior across diverse, unmanipulated scenarios (e.g., stair-taking with/without time pressure).  
    - *Belief-awareness*: If beliefs are inferred (e.g., "lift is broken"), they must align with external cues (e.g., the lift’s visible state) but remain distinct from rewards.  

  **Advantages over Alternatives**:  
  - **Hierarchical rewards** (e.g., meta-priors on rewards) still fix the description; our approach varies it, avoiding misspecification.  
  - **Verbal reports** (e.g., "I prefer exercise") introduce reliability issues; we use them only for validation, not inference, preserving behavior-centric rigor.  
  - **Minimality** breaks symmetries without ad hoc rewards and aligns with cognitive theories (e.g., humans compress state spaces).  

  #### 5. What Counts as a Result?  
  - **Success**:  
    - Theoretical: Prove that with sufficient diversity in \( \tau \) (e.g., covering states where descriptions diverge), the posterior \( P(D, R \mid \tau) \) concentrates on a unique equivalence class of (description, reward) pairs.  
    - Empirical: On gridworld or human-demonstration datasets (e.g., kitchen tasks), show that inferred descriptions match ground-truth human labels (e.g., "fear" vs. "habit") better than fixed-description IRL, and that rewards generalize to novel tasks.  
  - **Collapse to Standard IRL**: If minimality and cross-context constraints degenerate to a single dominant \( D \), the model reduces to conventional IRL. This is detectable if inferred descriptions are invariant to \( \tau \)-diversity.  
  - **Failure**: If all (description, reward) pairs explain behavior equally well even with constraints, preferences are irrecoverable from behavior alone. This would manifest as flat posteriors in experiments.  

  #### 6. Scope and Limitations  
  This proposal focuses on **tractable subproblems**: finite state spaces, discrete description classes (e.g., subsets of features or beliefs), and synthetic or scripted human data. Within one page, we cannot settle:  
  - **Philosophical foundations**: Whether "preferences" exist independently of descriptions.  
  - **Full cognition**: Scaling to continuous spaces or emotion-driven representations.  
  - **Social dynamics**: How descriptions emerge from culture or language.  

  #### 7. Significance  
  By making descriptions explicit, we turn a philosophical dispute into a testable problem. Success would show that preferences *are* recoverable—but only as functions of inferred descriptions. Failure would validate skepticism, urging caution in IRL applications like imitation learning. For philosophers, this formalizes how minds attribute preferences; for ML, it safeguards against mistaking our frames for agents’.  

  ---  
  *This proposal intentionally omits citations; references to Bayesian IRL, description complexity, and identifiability theorems will be added manually during circulation.*
