  ### Session Design: Sequential Search Game  
  **Goal:** Illustrate that a fixed-cutoff stopping rule ("stop at first option above X") is robust, often optimal, and computationally simpler than exhaustive optimization—without using "bounded rationality" or "satisficing" until debrief.  

  ---

  ### **Materials & Setup**  
  1. **Tech Setup**:  
     - Web app (e.g., simple Python/Flask or JavaScript app) for gameplay.  
     - Each player needs a laptop/phone.  
     - **App Features**:  
       - Input fields for distribution parameters (admin-only).  
       - "Draw Card" button (reveals value, charges cost).  
       - "Stop" button (awards best-seen value minus total costs).  
       - Display: current card, history of drawn values, cost per draw, net points.  
       - Pre-round input: "Enter your aspiration level (minimum value to stop early)".  

  2. **Payoff Scheme**:  
     - Points = (Best value selected) − (Cost per draw × Number of draws).  
     - Prizes: Top 3 cumulative scores win (e.g., books, gift cards). Non-monetary stakes maintain engagement.  

  3. **Decks & Distributions**:  
     - 20 cards per deck, values drawn independently.  
     - **Recall rule**: Players can take any seen card when stopping (optimal policy = **fixed cutoff**).  
     - **Distributions & Costs by Round**:  
       | Round | Distribution        | Cost per Draw | Optimal Cutoff* |  
       |-------|---------------------|---------------|------------------|  
       | 1     | Uniform [1, 100]    | 5             | 68               |  
       | 2     | Uniform [1, 100]    | 10            | 55               |  
       | 3     | Uniform [50, 150]   | 5             | 118              |  
       | 4     | Uniform [50, 150]   | 15            | 95               |  
       | 5     | Uniform [1, 50]     | 5             | 28               |  

     > *Optimal cutoff formula (with recall):  
     > `R = b - √(2c(b-a))`  
     > For uniform [a,b], cost `c`.  
     > (e.g., Round 1: `100 - √(2×5×99) ≈ 68`).  

  ---

  ### **Session Flow (90 min)**  
  #### **1. Introduction (5 min)**  
  - **Goal**: "Maximize net points (best value minus search costs)."  
  - **Rules**:  
    - Each draw costs points (varies by round).  
    - Values drawn from a known distribution (announced per round).  
    - Stop anytime; take the best card seen so far.  
    - Record your "aspiration level" (min value to stop early) before each round.  

  #### **2. Round 1: Practice (8 min)**  
  - **Distribution**: Uniform [1, 100], Cost = 5.  
  - **Goal**: Learn the app. No stakes.  
  - **Script**: "Draw cards, stop when you’re happy. Note your aspiration level."  

  #### **3. Rounds 2–5: Main Game (12 min/round)**  
  - **Announce per round**: Distribution, cost, optimal cutoff (hidden from players).  
  - **Player actions**:  
    1. Input aspiration level (cutoff) into app.  
    2. Play: Draw cards until stop.  
    3. See net points and leaderboard (top 3 scores).  
  - **Admin records**:  
    - Stated aspiration levels (cutoffs).  
    - Net points, draws per player.  
    - Shared scoreboard (live):  
      | Player | Round 2 | Round 3 | Round 4 | Round 5 | Total |  
      |--------|---------|---------|---------|---------|-------|  

  #### **4. Debrief (20 min)**  
  - **Key Observations**:  
    - Show a graph of **average stated cutoff vs. optimal cutoff** by round.  
      - *Predicted drift*:  
        - Rounds 2–4: Cutoffs adjust to costs/distribution (e.g., drops when cost rises).  
        - **Round 5 (mistake)**: Most keep cutoffs ~60–70 (from Round 1), despite optimal=28. Result: Over-searching, low net points.  
    - Highlight top scorers: Likely used near-optimal cutoffs.  

  - **Map to Concepts**:  
    - **Satisficing**: "You used a stopping rule: 'Stop at first option above X.' This is satisficing—an aspiration-level trigger."  
    - **Bounded Rationality**: "'Be rational' ≠ 'maximize exhaustively.' A simple rule (fixed cutoff) often equals optimal *and* saves effort."  
    - **Environment + Limits**: Behavior adapts to costs/distribution (Rounds 2–4), but cognitive limits cause errors when the world shifts (Round 5).  
    - **Procedure vs. Outcome**:  
      - "In Round 5, if you kept a high cutoff, you got bad outcomes. But was the *rule* bad? No—it worked in Rounds 1–4. Judge rules by long-term fitness, not one-off outcomes."  

  - **Limitations of the Game**:  
    - "Real problems are **ill-structured**: Options aren’t handed to you; criteria are vague. Here, the deck and goal were given. In life, you define them—making 'satisficing' harder but more necessary."  

  ---

  ### **What Will Go Wrong (And How to Handle It)**  
  1. **Gaming the System**:  
     - Players may "wait for max value" (ignoring costs) or set cutoffs arbitrarily low to save costs.  
     - **Mitigation**: Highlight leaderboard—top scores will align with near-optimal cutoffs.  

  2. **Round 5 Mistake**:  
     - 80%+ will retain Round 1 cutoffs (∼68) despite optimal=28.  
     - **Data to show**: Low net points (e.g., 50 max value − 20 draws × 5 = −50) vs. optimal (∼28 points).  

  3. **Tech Issues**:  
     - Backup: Pre-printed decks (1 per player/round) with values. Players record draws/decisions manually.  

  4. **Philosophical Pushback**:  
     - Philosopher may note: "This is still optimizing!"  
     - **Response**: "Yes—but with a heuristic that *mimics* optimal with 1/100th the computation. The brain didn’t calculate √(2c(b-a)); it adapted."  

  ---

  ### **Why This Works**  
  - **Discovery**: Players *feel* cutoff rules working (Rounds 2–4) and failing (Round 5), without jargon.  
  - **Aha! Moments**:  
    - "I wasted points in Round 5 by being stubborn!" → Outcome vs. procedure.  
    - "My ‘dumb’ cutoff rule beat complex strategies." → Satisficing as robust.  
  - **Bridging to Reality**: Debrief ties game mechanics to real-world constraints ("You can’t reshuffle life’s deck").  

  > **Final Note**: The game simplifies reality (structured problems), but the debrief expands to ill-structured ones—making the session self-aware and transferable.
