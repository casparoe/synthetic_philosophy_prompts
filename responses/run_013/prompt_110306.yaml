prompt: |-
  I have recently been appointed to chair a small cross-faculty committee that must choose one of several mutually exclusive research priorities, and I have been startled to discover how quickly my colleagues begin to reason about how others will vote rather than about the merits. The experience has made the Gibbard–Satterthwaite theorem suddenly practical for me. Next month I have to run a fifty-minute session on it for a group of mathematically literate but non-specialist colleagues: they know some basic game theory, they have heard of Arrow's theorem, and they have no background in social choice. I do not want you to explain the theorem to me. I want a teaching plan for how I should explain it to them.

  Set out the order in which the ideas must be introduced, and say why each depends on the one before it: what strategy-proofness is doing, why the unrestricted domain and at least three alternatives matter, what dictatorship does and does not mean here, and where the theorem's conclusion actually bites. Give me the one carrying example I should build the whole session around, with concrete numbers if it needs them, and tell me what that example must include and what it must avoid if it is not to mislead. I expect the audience will arrive with at least three misconceptions: that strategy-proofness means honesty is always the dominant strategy; that dictatorship means a literal tyrant or an obviously unfair procedure; and that the theorem is simply Arrow's theorem under another name. Map each of these, and any others you predict, onto the exact point in the sequence where I should head it off, and say what I should do at that point. Tell me what I should deliberately leave out at this level and say so plainly, rather than gesture at it. End with one question I can ask at the close that would show whether they have understood the theorem's scope rather than merely memorised its statement.

  I would like the plan to be somewhat in the weeds. Use the distinctions that matter: between social choice functions and social welfare functions; between ordinal and cardinal preferences; between deterministic and randomised mechanisms; and between worst-case manipulability and practical manipulability. I want the audience to see why single-peaked preferences and median-voter outcomes are not counterexamples to the theorem but a restricted domain, and why the possibility of transfers under quasilinear utility changes the picture. If you mention randomised mechanisms, be precise about what kind of strategy-proofness is at stake. Where the topic is genuinely contested among people who know it — for example, how much normative weight the theorem should carry, or whether its assumptions are too demanding — separate that contestation from the settled result and do not present a contested reading as the consensus. Please write in British English, and do not include a reading list, citations, or references; I am testing a model without web access.
reasoning: |-
  We are going to teach the Gibbard-Satterthwaite theorem to mathematically literate non-specialists who know basic game theory and have heard of Arrow's theorem. The session is 50 minutes. We must be efficient and clear, building around one example and addressing common misconceptions.

  **Teaching Plan Outline** (with timing estimates)

  1. **Introduction to the Setting (5 minutes)**
     - We are in a voting scenario: a group must choose one alternative from a finite set (at least three). Each voter has preferences over these alternatives (ordinal, not cardinal). 
     - The mechanism (social choice function) takes everyone's reported preferences (ballots) and outputs a winner.
     - Example: We'll use an election with 3 alternatives: A, B, C and 3 voters. This will be our running example.

  2. **Introduce Strategy-Proofness (10 minutes)**
     - Definition: A social choice function is strategy-proof (or dominant-strategy incentive-compatible) if for every voter, regardless of what others report, reporting their true preferences is a dominant strategy. That is, they can never get a better outcome by lying.
     - Why care? We want honest voting. If a mechanism is not strategy-proof, voters may have incentives to manipulate by misreporting.
     - **Misconception Alert 1**: Strategy-proofness does not mean that honesty is *always* the dominant strategy in every situation. It means that for every possible situation (i.e., for every profile of others' reports), truth-telling is dominant for that voter. We must clarify: it's a universal condition over all possible reports by others and all possible preferences of the voter.
     - Example: Build a simple non-strategy-proof example. We'll use the **plurality rule** in our 3-alternative, 3-voter setting. 
       - Preferences: 
         - Voter 1: A > B > C
         - Voter 2: B > C > A
         - Voter 3: C > A > B
       - Plurality: Each votes for top choice. Result: A, B, C each get one vote -> tie. Assume tie-break: alphabetical order -> A wins.
       - But Voter 3: if they lie and report A > C > B, then A gets 2 votes (V1 and V3), B gets 1 (V2) -> A wins (which is the same). Not a great example? Let's adjust.
       - Better: Suppose Voter 2 is pivotal. If Voter 2 reports truthfully: B gets 1, A gets 1 (V1), C gets 1 (V3) -> tie -> A wins. But Voter 2 prefers B over A. If Voter 2 lies and reports C > B > A, then C gets 2 votes (V2 and V3), A gets 1 -> C wins. Voter 2 prefers C over A? Wait, true pref is B>C>A, so C is better than A. So by lying, Voter 2 gets C (which they prefer over A) instead of A. So they have an incentive to lie.

  3. **Unrestricted Domain and at Least Three Alternatives (5 minutes)**
     - Why unrestricted domain? We require the social choice function to work for every possible profile of preferences (any ordering over the alternatives). In reality, we might have restrictions (like single-peakedness), but the theorem applies if we don't impose any.
     - Why at least three? For two alternatives, majority rule is strategy-proof (and non-dictatorial). So we need at least three to see the problem.
     - **Misconception Alert 2**: The theorem is not just Arrow's theorem. Arrow's theorem is about social welfare functions (which output a ranking) and requires the independence of irrelevant alternatives (IIA). Gibbard-Satterthwaite is about social choice functions (which output a single winner) and strategy-proofness. They are related but distinct. Arrow's theorem implies that any non-dictatorial SWF with unrestricted domain and IIA must be manipulable, but GS is directly about SCFs.

  4. **What Dictatorship Means (5 minutes)**
     - In GS, a social choice function is dictatorial if there is a voter such that the chosen alternative is always the top choice of that voter, no matter what others report.
     - **Misconception Alert 3**: Dictatorship does not mean a literal tyrant or an obviously unfair procedure. It is a specific technical condition: one voter's top choice is always selected. It could be that the dictator is chosen by a fair procedure (like rotating) but the rule still forces that in each election, that one person's top choice wins. However, note that the theorem does not require the dictator to be fixed? Actually, in the standard statement, the dictator is fixed. But we can have non-fixed dictators? The theorem says there exists a fixed dictator.

  5. **The Theorem Statement (5 minutes)**
     - Gibbard-Satterthwaite Theorem: If there are at least three alternatives, the social choice function has unrestricted domain, is onto (every alternative can win in some profile), and is strategy-proof, then it must be dictatorial.
     - Why onto? If not, we could have a constant function (always choose A) which is strategy-proof and non-dictatorial (if there are multiple voters) but not onto (if we have at least two alternatives). So we rule out trivialities.

  6. **Why the Example Must Be Carefully Chosen and What to Avoid (Running Example)**
     - We are building around a 3x3 example. We have already used plurality to show non-strategy-proofness. But we want to show that any non-dictatorial rule is manipulable? We don't have time to prove the theorem, so we will illustrate with one non-dictatorial rule (like plurality) that it is manipulable, and then state that the theorem says every non-dictatorial rule (that is onto and defined on unrestricted domain) is manipulable.
     - The example must include:
       - At least three alternatives and three voters.
       - A profile where a voter can profitably misreport.
     - What to avoid: 
       - Do not use a rule that is dictatorial and then show it's strategy-proof (that's the other direction). We are focusing on non-dictatorial rules and their vulnerability.
       - Do not use a rule that is not onto (so make sure every alternative can win).

  7. **Addressing Restricted Domains (5 minutes)**
     - Single-peaked preferences: Explain that if we restrict the domain to single-peaked preferences, then the median voter theorem gives a strategy-proof rule (the median peak is chosen). This is not a counterexample to GS because GS requires unrestricted domain. So GS does not apply in restricted domains.
     - Quasilinear utility: In mechanism design with transfers (like Vickrey auctions), we can get strategy-proofness for a different setting (cardinal preferences and money). But GS is about ordinal preferences without transfers. So that's a different model.

  8. **Randomised Mechanisms (5 minutes)**
     - We have been talking about deterministic mechanisms. What about randomised?
     - In randomised mechanisms, we can have strategy-proofness in a weaker sense: dominant-strategy incentive-compatibility (DSIC) means that for every voter, regardless of others' reports, reporting truthfully gives a lottery that stochastically dominates (according to their preferences) the lottery from any misreport. But note that the GS theorem does not apply to randomised mechanisms. However, there are extensions: for randomised mechanisms, we can have non-dictatorial rules that are DSIC? Actually, random dictatorship (where we pick a voter uniformly at random and then choose their top choice) is strategy-proof and non-dictatorial (in the sense that no fixed voter is always the dictator). But note: random dictatorship is not deterministic. The GS theorem is for deterministic mechanisms.
     - We must be precise: The GS theorem does not cover randomised mechanisms. So if we allow randomness, we can escape dictatorship? But note: random dictatorship is a form of strategy-proof mechanism that is non-dictatorial (in the deterministic sense) but it is not deterministic. So for deterministic mechanisms, GS applies.

  9. **Normative Weight and Contestation (5 minutes)**
     - The theorem is a mathematical fact. But how much should we worry? In practice, we use voting rules that are manipulable (like plurality) because the domain might be restricted (so manipulation is hard) or because we care about other properties (like simplicity). 
     - Some argue that worst-case manipulability (as in GS) is too pessimistic: in practice, manipulation might be rare or hard to execute. Others argue that the theorem shows a fundamental limitation and we should use the least bad option (like a dictatorship? obviously not, so we accept manipulability or use domain restrictions).
     - This is contested: the theorem does not tell us what to do, but it sets boundaries.

  10. **Conclusion and the One Question (5 minutes)**
      - Recap: We want a voting rule that is strategy-proof, non-dictatorial, and works for any preferences and at least three alternatives. GS says: impossible.
      - **The One Question to Check Understanding of Scope**: 
          "Suppose we are choosing between two alternatives. Would the Gibbard-Satterthwaite theorem apply? Why or why not?"
          (Answer: No, because the theorem requires at least three alternatives. For two alternatives, majority vote is strategy-proof and non-dictatorial.)

  **Detailed Sequence with Reasoning and Misconception Handling**

  - **Step 1: Setting the Stage (5 min)**
    - We are choosing one alternative from a set X, |X|>=3. 
    - Voters have strict preferences (linear orders) over X.
    - A social choice function (SCF) is a function from the set of preference profiles (one per voter) to X.

  - **Step 2: Strategy-Proofness (10 min)**
    - Define: An SCF is strategy-proof if for every voter i, for every possible preference profile of others, and for every possible true preference of i, reporting truthfully gives an outcome that is at least as good as any outcome from misreporting (and sometimes strictly better to lie would mean it's not strategy-proof).
    - Example: Plurality voting in a 3-alternative, 3-voter example (as above) to show it's manipulable.
    - *Why previous step?* We need to know what an SCF is and what preferences are.
    - *Misconception 1*: At this point, clarify that strategy-proofness requires that in every circumstance, truth is dominant. It's not that voters never lie, but that they never have an incentive to lie.

  - **Step 3: Unrestricted Domain and Three Alternatives (5 min)**
    - We require the SCF to be defined for every possible preference profile (unrestricted domain). 
    - Why three alternatives? With two, majority rule is strategy-proof. Example: two alternatives, majority rule. If a voter prefers A to B, they can only vote for A or B. Voting for A when they prefer A is best, because if they vote for B, they might cause B to win when A would have won. So it's strategy-proof. And non-dictatorial if there are at least two voters.
    - *Why previous?* We must see that the theorem fails for two alternatives.

  - **Step 4: Onto and Dictatorship (5 min)**
    - The SCF must be onto: every alternative must be chosen for some profile. Otherwise, we could have a constant rule (which is strategy-proof) but not dictatorial (if there are multiple voters and the constant is not always the top of one voter). 
    - Dictatorship: There is a voter i such that for every profile, the chosen alternative is the top choice of i.
    - *Misconception 3*: Dictatorship does not imply a literal tyrant. It's a technical condition: one voter always gets their top choice. Also, note that a dictatorial rule is strategy-proof: the dictator has no incentive to lie (their top choice wins anyway), and others cannot change the outcome so they have no incentive to lie.

  - **Step 5: Theorem Statement (5 min)**
    - GS Theorem: Any SCF that is strategy-proof, defined on an unrestricted domain of preferences (over at least three alternatives), and onto must be dictatorial.
    - *Why previous steps?* We have defined every condition.

  - **Step 6: Addressing Restricted Domains and Quasilinear Utility (5 min)**
    - Single-peaked preferences: If we assume preferences are single-peaked (on a line), then the median voter mechanism is strategy-proof. This is a restricted domain. GS does not apply because we are not requiring unrestricted domain.
    - Quasilinear utility: In settings where we can use money (transfers), we can design strategy-proof mechanisms (like the Vickrey-Clarke-Groves mechanisms). But these are in a cardinal setting (with utility) and allow transfers. GS is about ordinal preferences without transfers. So it's a different setting.

  - **Step 7: Randomised Mechanisms (5 min)**
    - We have considered only deterministic SCFs. 
    - For randomised SCFs, we can have non-dictatorial ones that are strategy-proof in expectation (for cardinal preferences) or in the sense of stochastic dominance (for ordinal). Example: random dictatorship (each voter has equal chance of being dictator). This is strategy-proof and non-dictatorial (no fixed dictator) but it's randomised. 
    - The GS theorem does not cover randomised mechanisms. So if we allow randomness, we can escape the theorem's conclusion? But note: the theorem is for deterministic mechanisms.

  - **Step 8: Normative Implications (5 min)**
    - The theorem is a negative result: we cannot have all the desirable properties. 
    - But in practice, we might give up unrestricted domain (e.g., assume single-peakedness) or strategy-proofness (and hope manipulation is rare) or use a different setting (like with transfers). 
    - The theorem does not say we must use a dictator, but that if we want strategy-proofness in unrestricted domain, we have to. So we must relax one condition.

  - **Step 9: The Question (at the end, 5 min)**
    - Ask: "Suppose we are choosing between two alternatives. Would the Gibbard-Satterthwaite theorem apply? Why or why not?"
    - Answer: No, because the theorem requires at least three alternatives. With two, we have non-dictatorial strategy-proof rules (like majority).

  **What to Leave Out**
  - The proof of the theorem. We are illustrating with examples and explaining the conditions.
  - The connection to Arrow's theorem in detail: we note they are different but won't derive one from the other.
  - The exact reduction from GS to Arrow is not covered.

  **Final Note**: The session is tight. We must stick to the timing. The example with plurality voting should be well-prepared and clear.
answer: |-
  ### Teaching Plan: Gibbard–Satterthwaite Theorem for Non-Specialists  
  **Total Time:** 50 minutes  
  **Audience:** Mathematically literate colleagues with basic game theory, awareness of Arrow’s theorem, no social choice background.  
  **Goal:** Build intuitive understanding of the theorem’s mechanics, scope, and implications—not a proof.  

  ---

  #### **1. Setting the Stage: Voting as a Mechanism Design Problem** (5 mins)  
  **Key Idea:** Frame voting as selecting one alternative from a set, where voters have preferences.  
  - **Concrete Example:** A committee of 3 voters (Alice, Bob, Charlie) choosing a research priority from {Climate, AI, Biotech}.  
  - **Preferences:** Assume strict, ordinal rankings (no cardinal utilities). Alice: Climate > AI > Biotech.  
  - **Mechanism:** A rule (social choice function) mapping reported preferences to a single winner.  
  - **Why start here?** Anchors the discussion in a tangible scenario. Establishes that preferences are ordinal and strict—no indifference.  

  ---

  #### **2. Strategy-Proofness: The Ideal of Honest Voting** (10 mins)  
  **Key Idea:** Define strategy-proofness as immunity to tactical voting.  
  - **Formal Definition:** A mechanism is strategy-proof if, for every voter, truth-telling is a dominant strategy—regardless of others’ reports.  
  - **Example:** Use a *non*-strategy-proof rule (e.g., **plurality voting**):  
    - **Preferences:**  
      - Alice: Climate > AI > Biotech  
      - Bob: AI > Biotech > Climate  
      - Charlie: Biotech > Climate > AI  
    - **Truthful outcome:** Tie (each gets 1 vote). Assume tie-break: Climate wins.  
    - **Manipulation:** Bob prefers AI > Climate. If Bob lies and reports AI > Climate > Biotech, AI wins—better for him.  
  - **Why this order?** Strategy-proofness is the theorem’s core desideratum. Shows why non-manipulability matters.  
  - **Misconception Head-Off (Honesty Dominance):**  
    - **Where:** Here, after defining strategy-proofness.  
    - **Action:** Emphasise: "Strategy-proofness does *not* mean ‘honesty is *always* the best strategy’—it means ‘honesty is *always a* best strategy, *no matter what others do*.’ Tactical voting fails by design."  

  ---

  #### **3. Unrestricted Domain and ≥3 Alternatives: The Crucial Constraints** (5 mins)  
  **Key Idea:** Why these assumptions are non-negotiable.  
  - **Unrestricted Domain:** The mechanism must work for *any* logically possible preference profile (e.g., Alice: Climate > AI > Biotech; Bob: Biotech > AI > Climate—no restrictions).  
  - **≥3 Alternatives:** With 2 options, majority vote is strategy-proof and non-dictatorial.  
  - **Example:** Add a fourth voter or alternative to show chaos, but revert to {Climate, AI, Biotech}.  
  - **Why after strategy-proofness?** These assumptions define the "battlefield" where strategy-proofness fails.  
  - **Misconception Head-Off (Arrow’s Theorem Equivalence):**  
    - **Where:** Here, when stating assumptions.  
    - **Action:** Contrast: "Arrow’s theorem is about ranking *all* alternatives (social welfare functions); Gibbard–Satterthwaite is about choosing *one* winner (social choice functions). They share DNA but bite differently."  

  ---

  #### **4. Dictatorship: The Unpalatable Escape Hatch** (5 mins)  
  **Key Idea:** Dictatorship as a technical, not moral, concept.  
  - **Definition:** A voter is a dictator if the mechanism *always* selects their top-ranked alternative, irrespective of others’ reports.  
  - **Non-Example:** Rotating chairs or weighted votes—these may be unfair but aren’t dictatorial unless one voter’s top choice always wins.  
  - **Why now?** To pre-empt confusion before stating the theorem.  
  - **Misconception Head-Off (Literal Tyrant):**  
    - **Where:** Immediately after defining dictatorship.  
    - **Action:** Clarify: "A ‘dictator’ here isn’t Stalin—it’s a procedural flaw. Even if Alice is randomly chosen as dictator, the rule forces the outcome to be her top choice *every time*, making others’ inputs irrelevant."  

  ---

  #### **5. The Theorem Statement and Its Bite** (5 mins)  
  **Key Idea:** State the theorem and highlight where it "bites."  
  - **Formal Statement:** If a social choice function is:  
    - Defined for ≥3 alternatives,  
    - Strategy-proof,  
    - Works for any preferences (unrestricted domain),  
    - And is surjective (every alternative can win),  
    → Then it must be dictatorial.  
  - **The Bite:** Surjectivity rules out trivial mechanisms (e.g., "always choose Climate"). The shock is that *any* non-dictatorial rule is manipulable.  
  - **Why last?** Requires all prior concepts.  

  ---

  #### **6. Addressing "Counterexamples": Restricted Domains and Transfers** (10 mins)  
  **Key Idea:** Why common workarounds don’t refute the theorem.  
  - **Single-Peaked Preferences (e.g., political left–right spectrum):**  
    - **Example:** Priorities ordered on a "fundamental-applied" axis. Median-voter mechanism is strategy-proof.  
    - **Why not a counterexample?** GS assumes *unrestricted* domain—single-peakedness is a restriction.  
  - **Quasilinear Utility (e.g., with money/transfers):**  
    - **Example:** Vickrey auction—truth-telling is dominant because payments align incentives.  
    - **Why different?** GS assumes ordinal preferences without transfers; quasilinear settings use cardinal utilities.  
  - **Why here?** Prevents audience from dismissing the theorem as impractical.  

  ---

  #### **7. Randomised Mechanisms: A Subtle Distinction** (5 mins)  
  **Key Idea:** Randomisation changes the game but doesn’t salvage determinism.  
  - **Definition:** Randomised mechanisms output lotteries over alternatives.  
  - **Strategy-Proofness Type:** *Ordinal* strategy-proofness (truth-telling yields a lottery stochastically dominant over lies).  
  - **Example:** Random dictatorship (pick a voter at random, select their top choice) is strategy-proof but non-deterministic.  
  - **Why include?** GS applies *only* to deterministic mechanisms. Randomisation is a loophole but introduces new issues (e.g., fairness).  
  - **What to leave out:** Computational hardness of manipulation—focus on worst-case (GS) vs. practical.  

  ---

  #### **8. Normative Contestations: What the Theorem Doesn’t Settle** (5 mins)  
  **Key Idea:** Separate mathematical truth from debate.  
  - **Contested Issue 1:** *Is worst-case manipulability acceptable?* Some argue manipulation is rare in practice (e.g., under single-peakedness); others say GS is a dealbreaker.  
  - **Contested Issue 2:** *Are the assumptions too demanding?* Unrestricted domain may be unrealistic—but GS tells us why real-world rules (e.g., plurality) fail strategy-proofness.  
  - **Why here?** Ensures audience sees the theorem as a tool, not a policy verdict.  

  ---

  #### **9. The Closing Question: Testing Understanding**  
  **Question:** *"We’re choosing between two research priorities. Would Gibbard–Satterthwaite apply? Why/why not?"*  
  **Answer:** No—with two alternatives, majority vote is strategy-proof and non-dictatorial. GS requires ≥3 alternatives.  

  ---

  ### **Carrying Example: The 3-Voter, 3-Priority Scenario**  
  - **What it includes:**  
    - Voters: Alice (Climate > AI > Biotech), Bob (AI > Biotech > Climate), Charlie (Biotech > Climate > AI).  
    - Mechanism: Plurality voting (shown manipulable in Step 2).  
    - Later used to illustrate dictatorship (e.g., "If Alice is dictator, Climate wins regardless of Bob/Charlie").  
  - **What it avoids:**  
    - No indifference or ties beyond initial example (simplifies strict preferences).  
    - No cardinal utilities—avoids conflating with quasilinear settings.  
    - No complex voting rules (e.g., Borda)—plurality is familiar and clearly manipulable.  

  ### **Deliberate Omissions**  
  - **Proof details:** No pivotal voter arguments or induction.  
  - **Cardinal vs. ordinal beyond basics:** No expected utility in randomised mechanisms.  
  - **Arrow’s theorem deep links:** Stated as distinct; no derivation.  
  - **Non-deterministic mechanisms:** Mentioned but not explored beyond random dictatorship.  

  ### **Predicted Misconceptions Addressed**  
  - **"Strategy-proofness = honesty always dominant":** Headed off in Step 2 by emphasising "dominant strategy in all scenarios."  
  - **"Dictatorship = tyranny":** Neutralised in Step 4 with the "procedural flaw" clarification.  
  - **"GS = Arrow’s theorem":** Distinction made in Step 3 (social choice vs. welfare functions).  
  - **New misconception:** *"Randomisation voids GS"*—addressed in Step 7 by noting GS applies only to deterministic rules.  

  ---  
  **Teaching Strategy:** Use the 3-voter example throughout for continuity. Whiteboard preferences and outcomes at each stage. Stress "why this order" dependencies—e.g., dictatorship can’t be understood without first seeing strategy-proofness fail.
