prompt: |-
  Right, help me out. I'm best man at my brother's wedding in three weeks and I havnt written the speech. Complication: he's a philosopher of mind and his entire career has been spent arguing that beliefs and desires don't actually exist — that folk psychology is a false theory we'll eventually drop the way we dropped phlogiston, and that there's nothing in the world it's true of. Which is fine, except a best man's speech is made of nothing else: he always knew she was the one, he believes in her, he wanted this, he's never doubted it for a second. So I want a speech that doesn't smuggle any of that back in, and that doesn't turn into a cold stunt or a seminar for the philosophy table. The room is mostly non-philosophers: her parents are lovely and a bit traditional, her dads a GP who thinks the whole subject is a waste of a good mind, and there's a table from his department who will be listening for whether I've understood him at all. Everyone always makes the same joke about him believing that beliefs don't exist — if you use it, make it earn its place. And please don't just turn him into a behaviourist in a nicer jumper, he's spent years insisting he isn't one. What I actually want to know is what you can say about a person in that vocabulary that is still warm, and still recognisably true of him. If it turns out you can't, don't fake it — but I'd rather you found a way. British English please, five minutes or so.
