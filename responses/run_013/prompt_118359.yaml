  The user needs a speech that avoids all references to beliefs, desires, or intentions, but still feels warm and personal—not a cold academic exercise or inside joke. The audience is mixed: mostly non-philosophers, including the bride's traditional parents (her dad is a GP who thinks philosophy is a waste of time), plus a table of the brother's colleagues who'll scrutinize whether the speech accurately represents his work. The user explicitly wants to avoid clichés (like the overdone "he believes beliefs don't exist" joke) and misrepresentations (e.g., reducing his brother's views to behaviorism).

  Digging deeper, the user isn't just asking for a speech—he's wrestling with how to express love and commitment without the language we typically use for it. There's emotional weight here: he wants to honor his brother's intellectual integrity while making the speech feel genuine to everyone, especially the bride's family. The unspoken need might be reassurance that warmth doesn't require "folk psychology"—that you can celebrate a person without betraying their life's work.

  To tackle this, I focus on what *can* be said within the brother's framework. His work rejects internal states as explanatory fictions but still describes patterns: how people reliably act in certain contexts. So the speech should highlight observable, consistent behaviors that *show* love and commitment without labeling them as "beliefs" or "desires." For example:
  - His brother's unwavering presence in the relationship (he's always there when his partner needs him)
  - How he lights up around her (physical reactions that signal happiness)
  - The way he prioritizes her in his life (behavioral patterns)

  Structure-wise, I avoid traditional speech tropes entirely—no "when he first saw her" stories framed as beliefs. Instead, I anchor it in direct observation ("I've watched...") and tie warmth to sensory details (laughter, shared glances). For humor, I include one philosophy joke but make it substantive by linking it to the brother's consistency. The tone remains British: understated, witty, with dry humor ("neural fireworks") and class-conscious nods ("GP" as sensible counterpoint).

  The biggest challenge is balancing rigor with accessibility. For the philosophy table, I use precise phrasing ("reliably occurs," "stable pattern"), but wrap it in universal experiences (shared meals, inside jokes). For traditional listeners, I emphasize concrete actions: "he's the first to make her tea," not abstract claims about feelings. Crucially, I end by reframing marriage itself in compatible terms—not as a promise of future feelings, but as a durable pattern of mutual care. 

  If this fails, it risks alienating either the family (too clinical) or the academics (inaccurate). But I think it's possible by treating love as a verb—something you *do*, not just something you "have."
