  - The dialogue does not have a concept of subtyping. It seems to treat the types as disjoint if they are not equal. For example, they might be thinking that if `WhiteHorse` is not equal to `Horse`, then they are disjoint? But that is not true.

  - The claim that the fixed color (in white horse) is not the unfixed color (in horse) might be seen as a way to say that the two types are incompatible? But they are not.

