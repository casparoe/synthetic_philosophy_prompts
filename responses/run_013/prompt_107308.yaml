  2. What names the color is not what names the shape.
  3. Therefore, a white horse is not a horse.

  But also note the pragmatic aspect: if you ask for a horse, a yellow or black horse will do, but if you ask for a white horse, a yellow or black horse will not.

  We are to restate this using the vocabulary of type theory, including:
  - Types, refinements, subtyping, coercions.
