  I'm a programming-languages person — dependent types, refinement types, subtyping, coercions, nominal vs structural typing, and the difference between a value of a subtype and a value of a supertype with a proof object attached are my daily bread. I've been argueing with a friend about Gongsun Long and the School of Names, specifically the White Horse dialogue, and he keeps saying it's just the masked-man fallacy or a word game about Chinese grammar, while I suspect there's something real about how the copula and classification work. I want you to restate the position in the dialogue as faithfully as you can in the vocabulary I actually use. Use the type/refinement distinction, the subtyping/coercion distinction, nominal vs structural classification, and the difference between asking for an inhabitant of a type and asking for an inhabitant with a particular property. The bits that seem to matter are: horse names shape, white names color; what names color is not what names shape; and if you ask for a horse, a yellow or black horse will do, but if you ask for a white horse, a yellow or black horse will not. Try to make the argument come out valid under some honest translation rather than just declaring it invalid. Then give me the residue report: which parts map cleanly onto subtyping, refinement, or coercion; which parts only map if I distort the type theory, say by treating horse and white horse as separate nominal types with no subtyping relation, or by treating the copula as definitional equality rather than judgment; and which parts have no counterpart at all. I'm especially interested in whether the residue is a defect of my vocabulary — maybe type theory can't express the names (ming) dimension, or the pragmatic difference between requesting a horse and requesting a white horse — or whether it shows the original claim was less precise than the tradition makes it out to be. If you think the Mohist canons or Hui Shi would change the translation, say how, but don't turn it into a history lesson. And keep the translation honest: don't just assume the copula means subtyping and then announce that the School of Names was confused.
