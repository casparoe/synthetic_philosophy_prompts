  Now, let's try to map the argument:

  Premise 1: Horse names shape. (So the type `Horse` is defined by the shape attribute.)
  Premise 2: White names color. (So the type `White` is defined by the color attribute.)
  Premise 3: What names color is not what names shape. (So the type `White` is not the same as the type `Horse`.)

  Then: Therefore, a white horse (which is the combination of the two) is not a horse.

  This does not follow. We have:

  - `WhiteHorse` = `Horse ∩ White`

  But `WhiteHorse` is not equal to `Horse`, which is true. But the conclusion is stated as "a white horse is not a horse", which would be:

  - For an object `wh` of type `WhiteHorse`, we have `wh` is not of type `Horse`.

  That is false.

  So the argument is invalid if we interpret "a white horse is not a horse" as denying the subtyping.

  But perhaps the School of Names is using a different notion of "is". They might be using the copula for definitional equality. So:

  - The term "white horse" is not definitionally equal to the term "horse".

  That is true.

  In the context of a request:

  - When we say "bring me a horse", we are asking for an object of type `Horse`.
  - When we say "bring me a white horse", we are asking for an object of type `WhiteHorse`.

  And because `WhiteHorse` is a refinement of `Horse`, we cannot use a `WhiteHorse` in every context that expects a `Horse`? Actually we can (by subtyping). But we cannot use a `Horse` in a context that expects a `WhiteHorse` without a check.

  The dialogue says: if you ask for a horse, yellow or black will do; but if you ask for a white horse, they will not. This is captured by:

  - A `Horse` might not be white, so we cannot pass an arbitrary `Horse` when a `WhiteHorse` is required.

  But note: the dialogue does not say that a white horse is not acceptable when a horse is requested. In fact, it implies the opposite: when a horse is requested, a white horse is acceptable (since a white horse is a horse). But when a white horse is requested, a non-white horse is not acceptable.

  So the argument for the conclusion "a white horse is not a horse" must be coming from the naming part.

  Let me try to restate the entire argument in type theory:

  Define:

  - Let `Shape` be a set of shapes, and `Color` be a set of colors.
  - An object has a shape and a color: `Object = Shape × Color`.
  - Define the type `Horse` as `{ (s, c) | s = horse_shape }`.
  - Define the type `White` as `{ (s, c) | c = white }`.
  - Then `WhiteHorse = Horse ∩ White = { (s, c) | s = horse_shape and c = white }`.

  The argument:

  1. The name "horse" refers to the set `Horse` (which is fixed by shape and arbitrary color).
  2. The name "white" refers to the set `White` (which is fixed by color and arbitrary shape).
  3. The name "white horse" refers to the set `WhiteHorse`.
  4. The set `WhiteHorse` is not equal to the set `Horse` (because `Horse` includes horses of all colors).
  5. Therefore, the name "white horse" is not the same as the name "horse".

  But then the conclusion of the dialogue is: "white horse is not horse". If we interpret this as set inequality, then it is true. But if we interpret it as "an element of `WhiteHorse` is not an element of `Horse`", then it is false.

  The dialogue might be interpreted as saying that the concept "white horse" is not the same as the concept "horse". That is, the intensions are different. In type theory, the types are different.

  Now, the residue:

  Parts that map cleanly:

  - The distinction between the type `Horse` and `WhiteHorse` is clear: they are different types (and `WhiteHorse` is a refinement of `Horse`).
  - The pragmatic difference in requests: when we require a `Horse`, we accept any horse (any element of `Horse`), but when we require a `WhiteHorse`, we require the color to be white. This is exactly the subtyping/refinement story: a `WhiteHorse` can be used as a `Horse` (subtyping), but a `Horse` cannot be used as a `WhiteHorse` without a check.

  Parts that require distortion:

  - The conclusion "a white horse is not a horse" (meaning that an individual white horse is not a horse) does not hold. We must interpret it as "the type white horse is not the same as the type horse", or "the name 'white horse' is not the same as the name 'horse'".

  - The argument that "what names color is not what names shape" is used to justify that the types are different. But note: `White` and `Horse` are different types, and `WhiteHorse` is an intersection type. But the step from that to "a white horse is not a horse" (in the sense of membership) is invalid.

