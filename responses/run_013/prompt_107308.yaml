  We must also account for the pragmatic aspect: when you ask for a horse, you accept any horse (yellow, black, white), but when you ask for a white horse, you only accept white horses. So the dialogue is also about the use of the terms in requests.

  In type theory, if we have:

  - `Horse` type
  - `WhiteHorse` as a subtype of `Horse`

  Then, if a function requires a `Horse`, we can pass a `WhiteHorse` (by subtyping). But if a function requires a `WhiteHorse`, we cannot pass an arbitrary `Horse` (unless we have a coercion that might fail, or unless we have a proof that the horse is white).

  So the pragmatic difference is captured by the subtyping relation.

  But the School of Names seems to be saying that we cannot even consider a white horse as a horse? That seems odd.

