  But that is true: they are not the same type. However, we do have that `WhiteHorse` is a subtype of `Horse`. So the statement "a white horse is a horse" is true for the objects, but false for the types (if by "is" we mean type equality).

  The copula "is" in the statement "a white horse is not a horse" might be interpreted as type equality. And indeed, `WhiteHorse` is not equal to `Horse`. But that is a very weak claim. And in common language, we use "is" for the membership or subtyping.

