  We might model the world such that an object has multiple attributes. Let:

  - Every object has a shape attribute and a color attribute.
  - The type `Horse` is defined by the shape being horse-shaped.
  - The type `White` is defined by the color being white.

  Then, a white horse is an object that has shape = horse and color = white.

  Now, the argument is that `Horse` and `White` are different types (because they are defined by different attributes). And the type `WhiteHorse` is the intersection: `Horse ∩ White`.

  But note: the dialogue does not deny that a white horse has the horse shape. It says: "a horse has not been fixed for color, hence yellow and black horses may come. A white horse has fixed color. The fixed color is not the unfixed color, hence I say a white horse is not a horse."

  So the issue is about whether we can identify the type `WhiteHorse` with the type `Horse`. Clearly, they are not the same because one refines the other by color.

