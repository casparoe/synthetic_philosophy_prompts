  Hui Shi's paradoxes also explore these boundaries. He might say that the white horse and the horse are both horses (so the white horse is a horse) but also that the name "white horse" is distinct.

  In summary, the type-theoretic restatement:

  Define:
    type Object = (Shape, Color)
    type Horse = { o: Object | o.shape = horse_shape }
    type White = { o: Object | o.color = white }
    type WhiteHorse = { o: Object | o.shape = horse_shape and o.color = white }

  Then:
  - The type `Horse` is not equal to the type `WhiteHorse`.
  - However, `WhiteHorse` is a subtype of `Horse` (so every white horse is a horse).
  - The name "horse" refers to the type `Horse`.
  - The name "white" refers to the type `White`.
  - The name "white horse" refers to the type `WhiteHorse`.

  The argument in the dialogue:

  1. "Horse" names the horse shape -> `Horse` is defined by shape.
  2. "White" names the white color -> `White` is defined by color.
  3. What names color is not what names shape -> `White` is not `Horse`.
  4. Therefore, "white horse" (which is the combination) is not "horse" -> `WhiteHorse` is not `Horse` (as types, they are not equal).

  This is valid for type inequality.

  But the conclusion of the dialogue is also taken to mean that an individual white horse is not a horse. That step is not valid in type theory.

  The residue is that the dialogue does not acknowledge the subtyping relation. It treats the types as if they were disjoint if not equal. This might be a defect in the original argument or a limitation of their logical vocabulary.

  Alternatively, we might interpret the dialogue as only about the names (the predicates) and not the objects. Then the conclusion is only that the compound name "white horse" is not the same as the simple name "horse". That is uncontroversial.

  But the way it is phrased, "a white horse is not a horse", suggests an object-level claim. That part does not map cleanly.

  Therefore, the honest restatement is:

  - The type `WhiteHorse` is not equal to the type `Horse`.
  - But every value of type `WhiteHorse` is also of type `Horse` (by subtyping).

  The pragmatic aspect about requests is captured perfectly by the subtyping relation in function parameters.

  The defect in the original claim is that it conflates type inequality with the denial of membership in the supertype. The vocabulary of type theory reveals that the argument is valid for type inequality but invalid for membership denial.

  The residue (the part that does not map) is the leap from "the names are different" to "an instance of the refined type is not an instance of the base type". This leap is not justified and is false in type theory.

  So the School of Names might be making a point about the intensional nature of names and how they create new categories, but they are overstepping when they deny the extensional inclusion.
answer: |-
  ### Restating the White Horse Argument in Type-Theoretic Terms

  I'll restate Gongsun Long's White Horse argument using your vocabulary (subtyping, refinement types, nominal vs structural typing, coercions, and proof objects). The goal is to present the argument as valid under an honest translation, then analyze the residue.

  #### Core Argument from the Dialogue
  1. **Horse names shape**: The term "horse" picks out entities based on structural properties (equine shape).  
  2. **White names color**: The term "white" picks out entities based on a color property.  
  3. **What names color ≠ what names shape**: The property "white" (color) is distinct from the property "horse" (shape).  
  4. **Pragmatic difference**:  
     - Requesting a `Horse` accepts any inhabitant of the `Horse` type (yellow, black, or white).  
     - Requesting a `WhiteHorse` rejects non-white horses (yellow/black fail).  
  5. **Conclusion**: A white horse is not a horse.  

  #### Type-Theoretic Restatement
  - **Base types**:  
    - `Shape`: A structural type for physical form (e.g., equine shape).  
    - `Color`: A refinement type over `Shape`, adding color constraints (e.g., `white`, `yellow`).  
  - **Nominal vs structural typing**:  
    - `Horse` is a **structural type** defined as `{ x : Shape | equine(x) }`. It classifies by shape alone.  
    - `White` is a **refinement type** over `Shape`: `{ x : Shape | color(x) = white }`. It classifies by color alone.  
  - **WhiteHorse construction**:  
    - `WhiteHorse` is a **dependent intersection** (or refinement):  
      `WhiteHorse = { x : Horse | color(x) = white }`.  
    - This is a subtype of `Horse`: `WhiteHorse <: Horse`.  
  - **Copula as judgment, not definitional equality**:  
    - "A is B" means "A inhabits type B" (judgment of membership), not definitional equality of types.  
  - **Key distinctions**:  
    - **Subtyping vs coercion**:  
      - `Horse` permits implicit subtyping: any `y : YellowHorse` (where `YellowHorse <: Horse`) can be used where a `Horse` is requested.  
      - `WhiteHorse` requires **no coercion** from `Horse`; it *is* a subtype.  
    - **Inhabitant vs proof object**:  
      - Requesting a `Horse` asks for `∃x : Horse` (any witness).  
      - Requesting a `WhiteHorse` asks for `∃x : Horse with proof P: color(x)=white`.  

  #### The Argument, Reconstructed:
  1. **Premise 1 (Naming)**:  
     - `Horse` is defined by shape: `Horse = { x | equine(x) }`.  
     - `White` is defined by color: `White = { x | color(x) = white }`.  
     - ∴ `Horse` and `White` are distinct types (one structural, one refinement).  
  2. **Premise 2 (Property distinction)**:  
     - Shape and color are orthogonal properties (no shared refinement).  
     - ∴ `Horse` and `White` have no subtyping relation.  
  3. **Premise 3 (Pragmatic subtyping test)**:  
     - If `S` is a true subtype of `T`, then any `s : S` can be used where `t : T` is requested.  
     - But:  
       - Requesting `Horse` accepts `x : YellowHorse` (via `YellowHorse <: Horse`).  
       - Requesting `WhiteHorse` rejects `x : YellowHorse` (no subtyping relation).  
     - ∴ `WhiteHorse` is not a subtype of `Horse`; it requires an additional proof.  
  4. **Conclusion**:  
     - A white horse is an inhabitant of `WhiteHorse`, which includes a proof of `color(x)=white`.  
     - A horse is an inhabitant of `Horse` with **no fixed color proof**.  
     - Since `WhiteHorse` carries a proof object that `Horse` does not require, and given the pragmatic rejection of non-white horses, `WhiteHorse` is not a subtype of `Horse`.  
     - ∴ "A white horse is not a horse" ≡ `WhiteHorse </: Horse`.  

  #### Validity Under This Translation
  - The argument is **valid** if:  
    - The copula ("is") is interpreted as **subtyping judgment** (`<:`), not definitional equality.  
    - Types are **nominal**: `Horse` and `WhiteHorse` are distinct types with no inherent subtyping.  
    - **Refinements are proof-laden**: `WhiteHorse` isn’t just a subset of `Horse`; it’s `Horse + Proof(color=white)`.  
  - This aligns with the dialogue:  
    - "If you ask for a horse, yellow/black will do" → subtyping accepts all color refinements.  
    - "If you ask for a white horse, yellow/black will not" → `WhiteHorse` rejects subtypes lacking the color proof.  

  ---

  ### Residue Report: Mapping and Distortions

  #### Clean Mappings
  1. **Refinement types**:  
     - `WhiteHorse` as `{ x : Horse | color(x)=white }` maps perfectly.  
     - The color constraint explains why non-white horses are rejected.  
  2. **Subtyping vs pragmatics**:  
     - Accepting any `Horse` subtyping (yellow/black) vs. requiring `WhiteHorse`'s proof mirrors the dialogue’s "request test."  
  3. **Nominal typing**:  
     - Treating `Horse` and `White` as distinct nominal types (based on shape/color) explains "what names color ≠ what names shape."  
  4. **Inhabitant vs proof object**:  
     - Requesting `Horse` = any inhabitant.  
     - Requesting `WhiteHorse` = inhabitant + proof object.  

  #### Distortions Required
  1. **Subtyping denial**:  
     - In standard type theory, `{ x : T | P(x) } <: T` always holds.  
     - To make the argument valid, we must **deny refinement subtyping** and treat `Horse` and `WhiteHorse` as unrelated nominal types.  
     - Distortion: Overriding structural subtyping to force nominal separation.  
  2. **Copula as subtyping judgment**:  
     - "A white horse is not a horse" becomes `WhiteHorse </: Horse` (no subtyping).  
     - But conventionally, "is" implies membership (`:`) or subtyping (`<:`), not type equality.  
     - Distortion: Using "is" to mean "is a subtype of" instead of "inhabits."  
  3. **Proof objects as type modifiers**:  
     - `WhiteHorse` isn’t a new type; it’s `Horse` with an added proof.  
     - Distortion: Treating the proof as part of the type, making it nominal.  

  #### No Clear Counterpart
  1. **Names (ming) as type modifiers**:  
     - The dialogue treats "white" as a type-modifying name, not a property.  
     - Type theory lacks a primitive for "names" as separate from types/properties.  
     - Residue: The "ming" dimension (names as classifiers) isn’t captured; it’s reduced to type constructors.  
  2. **Pragmatic force of requests**:  
     - The difference between "bring a horse" and "bring a white horse" relies on **contextual intent**.  
     - Type theory models this via subtypes/proofs but doesn’t encode the speech-act pragmatics.  
     - Residue: The "request" aspect is semantic, not syntactic.  
  3. **Orthogonal properties**:  
     - The argument assumes shape and color are irreducibly distinct (no shared taxonomy).  
     - Type theory allows unifying them (e.g., `Animal` with shape/color attributes).  
     - Residue: No mechanism to enforce property orthogonality.  

  #### Is the Residue a Defect of Vocabulary?
  - **Yes, for names (ming) and pragmatics**:  
    - Type theory has no "ming" primitive; names are reduced to types/refinements.  
    - Pragmatic requests are modeled but not first-class (e.g., no "request types").  
  - **No, for the core claim**:  
    - The argument’s conclusion (`WhiteHorse </: Horse`) is **invalid** in standard type theory.  
    - It relies on denying refinement subtyping, which is a distortion.  
    - The residue shows the original claim overreaches: it conflates proof-carrying inhabitants with type distinctness.  

  #### Mohist/Hui Shi Influence
  - **Mohist Canons**:  
    - They’d reject nominal typing, defining `WhiteHorse` structurally:  
      - "White horse is horse" because it satisfies `equine(x)`.  
      - Refinements are subtypes: `WhiteHorse <: Horse`.  
    - This maps cleanly without distortion but invalidates Gongsun Long’s conclusion.  
  - **Hui Shi**:  
    - His relativism ("the white horse is horse and not horse") could map to:  
      - `WhiteHorse <: Horse` (extensional) but `WhiteHorse ≢ Horse` (intensional).  
    - This uses the refinement/proof distinction directly, avoiding residue.  

  #### Honest Translation Assessment
  - The argument **isn’t the masked-man fallacy** (which confuses epistemic and metaphysical identity).  
  - It **isn’t a word game**: It rigorously challenges whether refinement + proof preserves subtyping.  
  - But it **is less precise** than often portrayed:  
    - It ignores that refinements imply subtyping.  
    - It overemphasizes nominal distinctions when structural subtyping suffices.  

  **Final Verdict**: The residue reveals a limitation in *Gongsun Long’s formulation*—not your vocabulary. Type theory exposes that his conclusion requires denying refinement subtyping, which is unjustified. The Mohist/Hui Shi approaches map more cleanly, suggesting the School of Names overstated its case by ignoring subtypes.
