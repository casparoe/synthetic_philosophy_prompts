prompt: |-
  I've been TAing an intro musicianship class this term, and there's a thing that keeps happening that I don't have a word for. We teach students to identify chords by giving a bunch of examples. A student will come up with a rule that fits every example we've given—say, 'a chord is a stack of thirds'—and then use it in a way that's obviously wrong to me, like calling a cluster a thirteenth chord because you can spell it as stacked thirds. I say no, that's not what we mean. They say, but it fits all the examples. So I give another example. They adjust. Eventually I realize I can't state the rule in a way that rules out all the clever wrong rules; the examples don't pin it down, and any formulation I give is itself just another example that can be read in different ways. The wierd part is that I still feel like there's a fact of the matter, and that the fact is settled by what our little community of musicians does—by our training, our corrections, our shared ear—not by anything in the examples or the formula. But then when I try to say what that shared practice is, I can only describe it as: the practice of following the rule. It's circular in a way that doesn't feel vicious, but I can't tell why not.

  Is there an established name for this specific phenomenon? I know it's somewhere near the general idea that evidence underdetermines theory, and near the idea of tacit knowledge, and maybe near family resemblance, but none of those seem to be quite it, because the thing I'm stuck on isn't just that the rule is underdetermined by the examples; it's that the only thing that seems to settle it is a communal practice, and the practice seems to be constituted by people going on in the same way, so the settlement looks circular. If there's a name, can you give me the actual concept and not just the label—what it includes, what it leaves out, and how it differs from underdetermination and from tacit knowledge? And if there's no name, can you coin one and tell me what would count as a boundary case? I'd also like to know what would change your mind here: if you tell me the circularity is benign, what argument or consideration would make you say it's actually vicious, or that I'm just confusing a psychological inability to state a rule with a metaphysical fact about rule-following? And where is your reasoning most likely to go wrong?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a TA for a musicianship class, and students keep coming up with rules that technically fit the examples but miss the mark. For instance, defining chords as stacks of thirds leads them to label a cluster as a thirteenth chord. The user corrects them, but every new rule the students devise still hits a wall with another example. 

  The user feels there's a correct way grounded in musical practice, but explaining it feels circular: the community follows the rule because they’ve been trained to, and the rule exists because the community follows it. They’re aware of concepts like underdetermination or tacit knowledge but feel those don’t quite capture this loop. 

  First, I need to pinpoint why existing terms fall short. Underdetermination is about evidence not locking down a theory, but here the issue is the communal practice filling that gap. Tacit knowledge is personal know-how; this is communal. Family resemblance misses the normative aspect—why some interpretations are just wrong. 

  Wittgenstein’s rule-following seems closest. His point is that rules alone don’t contain their application; it’s the community’s use that sets the standard. The circularity isn’t vicious because it’s not logical—it’s practical. The "fact of the matter" comes from shared judgments, not abstract definitions. 

  But why isn’t this circularity a problem? Because the practice is stable. Musicians agree on chord labeling not because of a rulebook, but through training and correction. The user’s frustration mirrors Wittgenstein’s skeptic: how do we know we’re applying "stack of thirds" correctly? The answer isn’t more rules, but pointing to the tradition. 

  The user might also be hinting at a deeper need: how to teach this without endless examples. They might want strategies to convey that chord identification isn’t just pattern-matching but engaging with a tradition. Emphasizing ear training and historical context could help students internalize the "right" way. 

  If I’m wrong, maybe the circularity is more problematic. If musical practice changes radically, the "fact" might shift. But that’s unlikely—tonal harmony’s conventions are deeply entrenched. The user’s confidence comes from this stability. Their challenge is bridging the gap between rigid rules and flexible practice in teaching.
answer: |-
  Your experience captures a profound philosophical and pedagogical problem at the intersection of meaning, rules, and community practice. The closest established concept is **Wittgenstein's "Rule-Following Paradox"** from *Philosophical Investigations* (§§143–242), specifically the idea that **"meaning is use"** within a **"form of life."** Here's a breakdown:

  ### Core Concept: Wittgenstein's Rule-Following
  1. **The Paradox**:  
     - Any rule (e.g., "a chord is a stack of thirds") can be interpreted in infinitely many ways (*PI §201*: "no course of action could be determined by a rule").  
     - Examples alone cannot exhaust the rule’s meaning. What *seems* like a "clever wrong rule" (e.g., calling a cluster a 13th chord) is a logically possible interpretation.  

  2. **The Solution: Community Practice ("Form of Life")**:  
     - The "fact of the matter" is grounded in **shared normative practices** of a community (musicians, in your case).  
     - Correct application isn’t defined by abstract rules or examples, but by **what the community *does***—training, correction, and agreement in judgments (*PI §202*: "obeying a rule is a practice").  
     - The circularity ("we follow the rule because we’re trained to, and the rule is what we follow") is **benign** because it reflects how meaning *actually functions*: a self-sustaining, socially embodied norm.  

  ### Why Other Concepts Fall Short:
  - **Underdetermination (Quine/Duhem)**:  
    Focuses on theory-choice given evidence. Your issue is about *rule-application*, not theory selection. Underdetermination doesn’t address the communal grounding of norms.  
  - **Tacit Knowledge (Polanyi)**:  
    Explains *individual* know-how (e.g., riding a bike). Your problem is *communal*: how shared standards emerge and persist.  
  - **Family Resemblance (Wittgenstein)**:  
    Describes how concepts lack rigid definitions (e.g., "game"). Helpful, but doesn’t resolve *why* some interpretations are rejected as "wrong."  

  ### Boundary Cases & Key Distinctions:
  - **Included**:  
    - Music theory, grammar, ethics, language games (e.g., "What counts as a 'promise'?").  
    - Any practice where expertise involves implicit norms (e.g., chess strategies, legal interpretation).  
  - **Excluded**:  
    - Formal systems with exhaustive axioms (e.g., mathematical proofs under strict axioms).  
    - Solitary practices with no community standard (e.g., a personal ritual).  

  ### Why the Circularity Isn’t Vicious:
  The circularity ("practice defines the rule; the rule defines practice") is **constitutive**, not logical. It’s like asking, "Why is this move in chess *illegal*?" The answer appeals to the *institution* of chess, not abstract logic. What makes it benign:  
  - **Training and Correction**: Novices are initiated into practices via feedback ("No, that’s not a chord—try again").  
  - **Agreement in Judgments**: Musicians largely concur on chord identification *without* explicit rules because they share a "form of life."  

  ### What Could Change My Mind:
  I’d reconsider if:  
  1. **Rules Can Be Fully Formalized**: If you could algorithmically define "chord" (e.g., via acoustic physics or AI that mimics human judgment *without* social input), the circularity might dissolve.  
  2. **Radical Disagreement Emerges**: If musicians fragmented into sub-communities with irreconcilable chord interpretations, the "fact of the matter" would collapse, revealing vicious circularity.  
  3. **Reductionism Succeeds**: If neuroscience could pinpoint a "rule-following module" independent of social practice, the communal aspect might be secondary.  

  ### Where Reasoning Might Go Wrong:
  - **Over-Extending Communalism**: Claiming *all* rules (e.g., mathematical addition) are socially constituted. Wittgenstein restricts this to language games embedded in practices.  
  - **Confusing Epistemology with Metaphysics**: Your inability to *state* the rule isn’t just psychological—it reflects that meaning *is* use, not a Platonic essence.  

  ### Pedagogical Implication:
  Stop seeking a "perfect rule." Instead:  
  - **Embrace exemplars**: "This *is* a chord; this cluster *isn’t*—hear the difference?"  
  - **Highlight context**: "In tonal harmony, we prioritize tertian stacks *in functional contexts*."  
  - **Leverage community**: "Musicians hear this as a cluster because it lacks harmonic function."  

  ### Coined Term (if needed):  
  **Normative Embodiment**: Rules gain content only when *enacted* within a community’s normative space.  

  This mirrors Wittgenstein’s insight: **Rules are rails laid to infinity only in the way we walk them together.** Your frustration isn’t a failure—it’s an encounter with how meaning *works*.
