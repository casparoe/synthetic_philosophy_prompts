answer: |-
  1. Pascal's categories map directly: the revolutionaries' force (National Convention's power) established their new "justice" (king as traitor), making strength pass for right, while the king's defenders invoked the established justice (constitutional inviolability) now devoid of force.
  2. Pascal's account explains the trial's outcome: the Convention, possessing overwhelming force, defined the king's guilt (new justice) and executed him, demonstrating that disputed justice (the king's inviolability claim) yields to undisputed force.
  3. Pascal misdescribes/silent on the revolutionaries' appeal to abstract, pre-established justice (popular sovereignty/natural right) to legitimize their new order, and falls silent on the unprecedented act of a legislature founding a novel regime by destroying the old sovereign.
  4. The episode confirms Pascal's core position: true justice was absent, established law was overturned by superior force (Convention), and the king's execution starkly illustrated that justice without force is helpless against force without prior legitimacy.
  5. Pascal's warning against revealing laws' injustice explains the Convention's refusal of a popular appeal (Girondins' proposal), fearing exposing the new regime's arbitrary foundations, and its insistence on obedience to itself *as* authority.
