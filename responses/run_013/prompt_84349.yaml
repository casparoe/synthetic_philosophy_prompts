  Okay, the user is asking about a specific type of philosophical disagreement. They describe a situation where two parties seem to agree on most factual observations but disagree fundamentally on how to define a key term—like Mencius and Xunzi debating "human nature." The user wants to know if there's a name for this kind of dispute and how it differs from merely verbal disputes or factual disagreements.

  First, I recall that this isn't just a simple case of different definitions. Both sides know they're using the term differently, but the argument persists because the definition itself is what's at stake. The user mentions examples like whether a virus is alive, where biologists agree on the facts but not the classification. That's a clue: this is about categorization based on shared facts.

  The term "terminological dispute" comes to mind, but the user points out that it doesn't fit because the disagreement isn't resolved by disambiguation—each side believes their definition is correct for normative reasons. So, it's deeper than just words. I think of "conceptual negotiation" from philosophy and cognitive science, where the dispute is over how concepts should be applied, often tied to values or practical implications.

  Another term is "metalinguistic negotiation," from David Plunkett and Tim Sundell, where the disagreement is about which linguistic standard to use. That seems spot-on because it captures the clash over word usage driven by deeper principles. The user also asks about the tactic of redefining terms to win the argument—that's "persuasive definition," coined by Stevenson, where a definition is changed to influence attitudes.

  I need to make sure the distinctions are clear. A merely verbal dispute would dissolve if both sides agree to disambiguate, but here, they won't. Factual disputes involve different observations, but this one doesn't. The boundaries: both parties must share empirical facts, disagree on term application, and have normative stakes tied to the definition's implications.

  The user might be a philosopher or student looking for precise terminology to analyze arguments. They probably want to frame their own thoughts or write about such disputes. By providing labeled concepts and distinctions, I'm helping them articulate this structure in academic or intellectual discussions.
answer: |-
  Your analysis captures a profound and recurring structure in philosophical, scientific, and semantic disputes. This isn't merely a verbal disagreement, nor is it a straightforward factual one. The established concept that best fits this structure is **Metalinguistic Negotiation** (or **Conceptual Negotiation**).

  Here's why this fits, how it differs from nearby concepts, and the term for the redefining tactic:

  1.  **Metalinguistic Negotiation:**
      *   **Definition:** A disagreement where the surface-level conflict appears to be about facts or the world, but the underlying disagreement is about *which linguistic or conceptual standard* should be used to describe or categorize those shared facts. The parties agree on the empirical observations (the "world") but disagree on *how to apply a contested term/concept* to that world, often because the choice of concept carries significant normative implications (ethical, practical, political, explanatory).
      *   **Why it fits your cases:**
          *   **Mencius & Xunzi:** They largely agree on the observable facts about human behavior, development, and the necessity of cultivation. Their fundamental disagreement is over which aspects *deserve the label* "nature" (`xing`). This label isn't neutral; it carries immense weight regarding the source of morality, the role of education, and the authority of tradition. Each argues their preferred standard for applying "nature" is *better* – more accurate, more useful, or less harmful – than the other's.
          *   **Virus Alive:** Biologists agree on the molecular biology, replication mechanisms, and evolutionary history of viruses. The disagreement is over whether the concept "life" *should* be extended to cover this particular set of shared facts. This choice impacts categorization in textbooks, funding priorities, and potentially even definitions used in astrobiology. The dispute hinges on *what the concept "life" ought to encompass*, not on the empirical details of viruses.

  2.  **Distinguishing from Nearby Concepts:**
      *   **Merely Verbal Dispute:** This *would* dissolve upon disambiguation. If both Mencius and Xunzi agreed that "nature_A" meant "inborn tendencies (including incipient moral ones)" and "nature_B" meant "inborn and unlearned (excluding acquired traits)", and they stipulated which term they were using in each instance, the *apparent* conflict would vanish. However, as you note, they *don't* treat it this way. Why? Because the dispute is **metalinguistic** – it's *about* which standard (nature_A or nature_B) is the *correct* or *best* standard to govern the use of the word "nature" itself. Disambiguation reveals the underlying metalinguistic disagreement; it doesn't resolve it. The parties care deeply *which* disambiguation prevails.
      *   **Straightforward Factual Disagreement:** This involves conflicting claims about observable states of the world. E.g., "This hillside has never borne trees" (Xunzi) vs. "This hillside once bore trees but was deforested" (Mencius). In your examples, Mencius and Xunzi *agree* on the factual analogy (the hillside *was* forested and became bare). Their disagreement is about how to *conceptually frame* the shared fact of human potential and development using the contested term "nature". Similarly, virologists agree on the facts about viruses; they disagree on whether those facts *satisfy the criteria* for "life".

  3.  **The Redefining Manoeuvre: Persuasive Definition**
      *   **Definition:** Coined by philosopher Charles L. Stevenson, a persuasive definition is an attempt to resolve a dispute (often one involving values or contested concepts) by stipulating a new meaning for a key term, while retaining the term's strong emotive or evaluative force, thereby directing attitudes towards the new referent.
      *   **How it fits:** Xunzi employs this when he defines "nature" (`xing`) *exclusively* as "what is inborn and unlearned" and then leverages the negative connotations associated with "nature" in his argument ("nature is bad") to argue against Mencius's position. He isn't just clarifying usage neutrally; he's strategically redefining the term to *persuade* his audience that the source of goodness *must* be external (teachers, rituals) precisely because he excludes the incipient tendencies Mencius highlights from the definition of "nature". Mencius's definition is equally persuasive, aiming to show that morality has an internal source worthy of the foundational term "nature". The argument *is* about the definition, and each side tries to win it by proposing their definition as the correct or superior one.

  **Boundaries for Metalinguistic Negotiation:**

  *   **Necessary Conditions:**
      1.  **Shared Empirical Ground:** The disputants must substantially agree on the relevant non-semantic, non-conventional facts about the world (the "bedrock" observations).
      2.  **Contested Term/Concept:** There must be a key term or concept (e.g., `nature`, `life`, `art`, `justice`, `person`) whose application to the shared facts is disputed.
      3.  **Normative Stakes:** The choice of how to apply the term/concept must have significant practical, ethical, theoretical, or evaluative consequences that the parties care about. The disagreement is *motivated* by these stakes ("harmful doctrine", "confusing categorization").
      4.  **Metalinguistic Focus:** The core disagreement is recognized (explicitly or implicitly) as being *about* which linguistic/conceptual standard *should* govern the use of the term in this context. Resolution requires argument about the merits of competing standards (e.g., coherence, utility, theoretical fruitfulness, moral implications), not just more empirical data about the world the term describes.
  *   **Exclusionary Conditions (Rules Out):**
      1.  **Fundamental Factual Disagreement:** If the parties genuinely disagree on the underlying empirical facts (e.g., Mencius believing infants show spontaneous compassion while Xunzi denies it), it becomes primarily a factual dispute, even if terminology is involved.
      2.  **Pure Ambiguity Resolution:** If the parties readily agree that they mean different things by the term and are happy to stipulate different labels (nature_A vs. nature_B) without caring which label "wins" the original term, it's merely verbal and dissolves upon disambiguation.
      3.  **Non-Normative Stakes:** If the choice of definition/concept has no significant practical, ethical, or theoretical consequences (e.g., arguing whether a "cup" must have a handle, purely for the sake of classification), it lacks the driving force of a metalinguistic *negotiation*.

  **In Summary:**

  *   **The Structure:** You've identified **Metalinguistic Negotiation** or **Conceptual Negotiation** – a disagreement about which linguistic/conceptual standard *should* apply to shared facts, driven by the normative stakes associated with the competing standards.
  *   **The Manoeuvre:** The tactic of strategically redefining the contested term to win the normative argument is a **Persuasive Definition**.
  *   **Why it's not merely verbal:** Disambiguation reveals the metalinguistic disagreement but doesn't resolve it, because the parties care *which* disambiguation is adopted as the standard due to its normative implications.
  *   **Why it's not straightforwardly factual:** The core disagreement persists even when the underlying empirical facts are agreed upon; the conflict is about conceptual framing and linguistic norms.

  This structure is incredibly common in philosophy, law, politics, and science whenever foundational or value-laden concepts are involved (e.g., "personhood," "art," "intelligence," "species," "free will"). Your insight into the Mencius/Xunzi debate perfectly illustrates its dynamics.
