  ### **The Born Rule Principle (BRP)**
  **Core statement:** Your credence in a branch (continuation) is proportional to the *squared amplitude* (Born rule weight) assigned to that branch in the universal wavefunction. This weight is an objective physical quantity attached to the branch by quantum evolution. 

  **Key corollary for symmetry:** When branching is symmetric (i.e., all outcomes are physically indistinguishable at the moment of branching, and amplitudes are unknown or irrelevant), the squared amplitudes are equal, reducing BRP to *indifference over continuations*. This is not a separate principle but a consequence of BRP + symmetry: symmetric setups produce equal amplitudes, leading to equal squared amplitudes.

  **Why BRP?** 
  - It explains your rejection of "counting worlds" (Cases 1, 6, 7, 8) and your reliance on physical weights (Cases 1, 4, 5, 6).
  - It incorporates "indifference" (Cases 2, 3, 7) as a special case arising from symmetry, resolving your oscillation between P1 and P2.
  - It handles boundary-drawing (Case 8) because squared amplitudes are basis-independent.
  - It addresses your intuition in Case 4 (revision without location evidence) because credence is fixed by physical reality, not subjective uncertainty.

  **How BRP works in branching processes:**
  1. **Quantum branching:** Squared amplitudes directly set credence (e.g., Case 1).
  2. **Classical/emergent branching (e.g., duplication):** Treat as quantum branching with implied symmetry. If a process produces \(n\) identical continuations via a symmetric mechanism, amplitudes are equal (\(1/\sqrt{n}\) per branch), so squared amplitudes are \(1/n\) per branch. Indifference emerges from symmetry + BRP.
  3. **Sequential branching:** Multiply weights along the path. The credence for a continuation is the product of weights (squared amplitudes) for all branchings leading to it, renormalized to 1.

