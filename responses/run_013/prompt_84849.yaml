prompt: |-
  I run underwriting at a small mutual insurer — farms, small businesses, the odd one-off — and I sit on the risk committee, so I'm the one who has to say yes or no on the stuff we have no loss history for. E-bike battery fires in apartment blocks. A marina that wants cover for a new kind of floating dock. Drone spraying outfits. Maybe two or three a month, and anything over a certain size goes to the board with my written reasoning attached, so whatever I decide has to be defensible on paper a year later.

  Here's my problem. I think I keep making two different decisions and filing them under one word. Sometimes I know roughly what the odds are and I don't like them. Sometimes I have no idea what the odds are and I don't like that either — and I say no to the second kind far more often, even when the premium is good and the worst case is survivable. I read about the Ellsberg thing with the two urns years ago, where people happily bet on the urn that's half red but won't touch the one where nobody knows the mix, and I've never stopped thinking about it, because its exactly what I do at my desk. I've also noticed I'm much braver when everyone in the room is equally in the dark than when it's only me who doesn't know the answer. And I've heard the two-urn choice is supposed to be a mistake somehow, that you can't hold both halves of it at once, which bugs me because both halves feel right to me.

  I want a procedure I can actually run in about twenty minutes on a single submission that keeps those two things apart: what I don't like about the odds, and what I don't like about not knowing the odds. It should tell me when my caution is doing real work and when it's just costing us business, and it should be something I can paste into the file. I dont have any econ training so keep the machinery out of it, but don't water down the part that actually matters — I'd rather have a step I have to sit and think about than a fake number that makes the form look complete.

  Write it in these sections:

  - "What I'm actually deciding" — plain English, about 150 words, on the difference between the two kinds of unknown, and why the difference isn't just 'how confident I am'.
  - "The procedure" — numbered steps in order, each with the question it asks, what counts as an answer, what to do when I can't answer it, and which steps hand the decision to a person rather than producing one. About 800 words.
  - "When 'just call it 50/50' is fine" — the tests for when I'm allowed to treat an unknown as a coin flip, and when that move is just me hiding. About 200 words.
  - "Three submissions run through it" — the e-bike one, the marina, and one where the procedure tells me to write the policy and I won't want to hear it. About 500 words.
  - "Where the procedure stops and I have to decide" — the parts that are values rather than facts. About 200 words.
  - "What this can't do" — honest limits, including anything about that two-urn choice you think I've got wrong. About 150 words.
reasoning: |-
  Hmm, this is a fascinating request from an insurance underwriter who deals with novel risks. They're clearly experienced and self-aware, noticing how they treat measurable risks differently from complete unknowns - and recognizing how group dynamics affect their decisions. The Ellsberg paradox reference shows they've done their homework on behavioral economics.

  The core problem is operationalizing ambiguity aversion in underwriting decisions. They need a practical 20-minute framework that distinguishes between:
  - Risks with poor but quantifiable odds (what they "don't like about the odds")
  - Truly unquantifiable uncertainties (what they "don't like about not knowing")

  Key requirements stand out:
  - Must produce audit-trail ready documentation
  - No fake quantification ("don't water down the part that actually matters")
  - Explicitly handles when "50/50" is appropriate
  - Includes examples from their work (e-bikes, marina, drones)
  - Acknowledges where judgment calls remain

  I'll build this as a structured decision procedure with:
  1) Conceptual foundation explaining the difference between risk (known probabilities) and uncertainty (unknown probabilities)
  2) Step-by-step workflow with clear off-ramps for decisions
  3) Guidelines for when uniform probability assumptions are valid
  4) Concrete examples applying the framework
  5) Delineation of where values-based judgment enters
  6) Candid limitations including why ambiguity aversion isn't "irrational"

  The structure will follow their requested sections exactly. For "The Procedure", I'll create a 6-step process that forces explicit categorization of unknowns. Key innovations:
  - A "known unknown" vs "unknown unknown" distinction
  - Premium stress-testing for survivability
  - Group knowledge assessment to counter isolation effects
  - Documentation prompts for each step

  In the examples, I'll show how this catches:
  - E-bike fires as poorly quantified but survivable risk
  - Floating docks as true uncertainty requiring group input
  - A surprising case where drone spraying gets approved

  The honesty in "What this can't do" is crucial - I'll confirm their Ellsberg intuition has merit while noting its behavioral economics context. This isn't about "fixing" their instinct but giving it structured expression.
answer: |-
  ## Underwriter's Ambiguity Framework

  ### 1. What I'm Actually Deciding
  You're distinguishing between two fundamentally different problems:
  - **Known Odds, Unappealing Risk:** You have sufficient data/experience to estimate probabilities (e.g., 5% chance of X causing a $Y loss). You can calculate expected loss, stress-test scenarios, and see the premium might be insufficient *given those odds*. Saying "no" here is rejecting unfavorable economics.
  - **Pure Ambiguity:** You lack the data/framework to assign *any* meaningful probability range. The risk feels like a black box (e.g., "Could this new chemical coating cause chronic liability claims in 20 years? How likely? No clue."). Saying "no" here stems from discomfort with the *unknowability itself*, not necessarily the economics. It's rejecting the inability to quantify, often amplified if you feel solely responsible ("only me in the dark").

  The difference isn't just confidence levels. Known odds involve calculable risk (even if wide ranges); pure ambiguity involves unquantifiable uncertainty. Treating them the same masks whether you're avoiding a bad bet or avoiding betting on an entirely undefined game. This framework forces that distinction.

  ### 2. The Procedure (Approx. 20 mins per submission)

  **Goal:** Separate "I know the odds and they're bad" from "I cannot know the odds and that's unnerving," then decide based on survivability and group knowledge.

  1.  **Map the Knowns: "What CAN I quantify or confidently bound?"**
      *   *Question:* For this specific risk (e.g., e-bike battery fire in an apartment), what loss drivers *do* I have data or strong analogs for? (e.g., fire frequency in residential buildings, property values, fire suppression effectiveness, liability claim history for similar products). What are reasonable min/max estimates for frequency and severity *for these known elements*?
      *   *Answer:* List quantifiable components with estimated ranges (e.g., "Fire suppression reduces severity by 40-60% based on building type X data," "Historical product defect recall rate for similar tech: 0.1%-1% per year").
      *   *Can't Answer?* If *nothing* is quantifiable, skip to Step 3. If some things are, proceed.
      *   *Decision Handoff:* None yet. Output: Written list of quantifiable components with estimates/ranges.

  2.  **Identify the Core Unknown: "What's the ONE big thing I truly CAN'T quantify?"**
      *   *Question:* What specific, critical uncertainty *cannot* be resolved by data, analogs, or expert opinion *for this unique risk*? (e.g., for e-bikes: "Probability that a specific, unknown battery flaw causes uncontrollable thermal runaway *despite* existing UL certifications"). Be ruthlessly specific.
      *   *Answer:* A single, concise statement of the irreducible ambiguity (e.g., "Likelihood that new polymer in floating dock degrades unpredictably in saltwater + UV exposure combo, leading to structural failure within 5 years").
      *   *Can't Answer?* If you can't pinpoint the core ambiguity, STOP. The risk is too poorly defined. Decline or demand more clarity from the proposer.
      *   *Decision Handoff:* None. Output: One sentence defining the Core Unknown.

  3.  **Assess Ambiguity Depth: "Is this Core Unknown a 'Known Unknown' or a 'Black Swan Generator'?"**
      *   *Question:* Can I *at least* bound the *potential impact* of the Core Unknown within our survivability limits? Is the *nature* of the risk something we conceptually understand, even if likelihood is a mystery (Known Unknown)? Or is it something so novel that the *mechanism or scale* of potential failure is also deeply uncertain, potentially exposing us to risks we haven't even conceived of (Black Swan Generator)?
      *   *Answer:*
          *   *Known Unknown:* Impact is boundable, mechanism understood but likelihood unknown (e.g., "Battery fire might happen, loss severity is within $X-$Y range we model for fires").
          *   *Black Swan Generator:* Impact potentially catastrophic/unboundable, failure mechanism unclear, or potential for unforeseen chain reactions (e.g., "Unknown dock degradation could cause widespread, simultaneous failure during a storm, sinking multiple boats + environmental spill, exceeding modeled max loss").
      *   *Can't Answer?* If you genuinely can't tell, default to "Black Swan Generator". Err on the side of caution when classifying ambiguity.
      *   *Decision Handoff:* If "Black Swan Generator," proceed to Step 4. If "Known Unknown," proceed to Step 5. Output: Classification.

  4.  **Group Knowledge Check (For Black Swan Generators Only): "Am I alone in the dark?"**
      *   *Question:* If this went badly wrong, would the Board/Risk Committee genuinely share the surprise? Or would they reasonably ask, "Why didn't you see this potential?" Is this ambiguity obvious to any expert looking at it?
      *   *Answer:* "Shared Ambiguity" (Everyone would be blindsided) or "Isolated Ambiguity" (I should/could have known better).
      *   *Can't Answer?* Imagine explaining a loss to the Board. If you feel exposed, it's "Isolated". If they'd shrug and say "Nobody saw that coming," it's "Shared".
      *   *Decision Handoff:* If "Isolated Ambiguity," DECLINE – the ambiguity stems from your lack of due diligence. If "Shared Ambiguity," proceed to Step 6. Output: Classification.

  5.  **Stress-Test Survivability (For Known Unknowns Only): "Can we eat the worst plausible plate, even if we don't know the menu?"**
      *   *Question:* Assign a deliberately *pessimistic but plausible* likelihood to the Core Unknown (e.g., for e-bike fires: Assume a 5% annual failure rate per bike despite certifications). Combine with quantified elements from Step 1. Does the worst plausible scenario (frequency * max severity) exceed our risk appetite? Is the proposed premium sufficient *even under this pessimistic view*?
      *   *Answer:* "Survivable" (Loss fits within risk appetite, premium covers pessimistic case) or "Unsurvivable".
      *   *Can't Answer?* If you can't construct a plausible worst case, go back to Step 3 – it might be a Black Swan. If actuarial input is needed for the calc, pause and get it.
      *   *Decision Handoff:* If "Unsurvivable," DECLINE based on unfavorable economics. If "Survivable," WRITE THE POLICY. Output: Survivability verdict and key assumptions.

  6.  **The Ambiguity Premium & Final Check (For Shared Ambiguity Black Swans): "Is the price worth the fog?"**
      *   *Question:* Does the premium include a substantial, explicit margin *beyond* covering all quantifiable risks and the Known Unknown stress test? This margin is the "Ambiguity Premium" – payment for bearing the irreducible unknown. Does this premium feel commensurate with the depth of the unknown and the potential reputational/balance sheet hit if the black swan lands? Does it pass the "sleep at night" test for you *and* (importantly) would it likely pass that test for the Board if explained?
      *   *Answer:* "Adequate Ambiguity Premium" or "Inadequate".
      *   *Can't Answer?* Compare it to premiums charged for other highly ambiguous but accepted risks in your portfolio or market. If still unsure, DECLINE – the price isn't high enough to justify the fog.
      *   *Decision Handoff:* If "Inadequate," DECLINE. If "Adequate," WRITE THE POLICY (with clear documentation of the ambiguity premium rationale). Output: Premium adequacy verdict.

  ### 3. When 'Just Call it 50/50' is Fine
  Use this **only** when ALL of these apply:
  1.  **No Information Asymmetry:** There is genuinely *zero* prior knowledge or data suggesting any outcome is more likely than another. It's truly symmetrical ignorance. (e.g., Will a specific, never-tested backup system fail on its first use during a random Tuesday storm? Pure guesswork).
  2.  **Impact is Contained & Understood:** The consequences of either outcome (success/failure) are well-bounded, manageable within your models, and don't involve complex chains or hidden vulnerabilities. A coin flip implies discrete, isolated outcomes.
  3.  **Not a Cop-Out:** You've actively searched for reasons why it *wouldn't* be 50/50 (data, expert opinion, logical asymmetry) and found none. It's a conclusion, not an avoidance tactic.
  4.  **Used for Calculation, Not Comfort:** You're plugging it into a *model* for the Known Unknown stress test (Step 5), *not* using it to dismiss the ambiguity itself. It's a tool for conservatism within a bounded context, not a way to pretend ambiguity doesn't exist.

  ### 4. Three Submissions Run Through It

  1.  **E-bike Battery Fires in Apartments:**
      *   **Step 1:** Quantifiable: Apartment fire frequencies, property values, liability claim patterns for consumer goods. Min/Max estimates possible.
      *   **Step 2:** **Core Unknown:** Likelihood of a novel, catastrophic battery failure mode bypassing existing safety standards *in real-world residential use*.
      *   **Step 3:** **Known Unknown.** Mechanism (thermal runaway) is understood; severity is boundable (bad fire, but within max property/liability loss models).
      *   *(Skip Step 4 - Not a Black Swan)*
      *   **Step 5:** **Stress-Test:** Assume pessimistic failure rate (e.g., 1 in 1,000 bikes/year). Modeled loss still within risk appetite. Premium looks sufficient under this view. **Verdict: Survivable. WRITE POLICY.** (Procedure forces acceptance despite discomfort with unknown likelihood because impact is boundable and economics work pessimistically).

  2.  **New Floating Dock System (Novel Polymer):**
      *   **Step 1:** Quantifiable: Dock construction costs, marine liability basics, storm surge models for location. Some analogs shaky.
      *   **Step 2:** **Core Unknown:** Long-term degradation profile of the novel polymer under combined saltwater/UV/biofouling stress and its failure mode (gradual vs. sudden, widespread).
      *   **Step 3:** **Black Swan Generator.** Potential for unforeseen interaction causing sudden, widespread failure during an event (storm), leading to cascading losses (sinking boats, environmental damage) exceeding standard dock loss models. Mechanism of degradation unclear.
      *   **Step 4:** **Group Knowledge Check: Shared Ambiguity.** This is genuinely novel tech; no expert could reliably predict long-term polymer behavior in this specific application. Board would share surprise.
      *   **Step 6:** **Ambiguity Premium Check:** Proposed premium is standard dock rate +10%. *Inadequate.* Needs a much larger ambiguity premium reflecting the unquantifiable potential for systemic failure. **Verdict: DECLINE.** (Procedure isolates the unpriceable ambiguity as the reason, not just generic caution).

  3.  **Drone Crop Spraying Startup:**
      *   **Step 1:** Quantifiable: Drone crash rates (increasingly available), agricultural liability norms, typical crop values per acre.
      *   **Step 2:** **Core Unknown:** Likelihood and severity of large-scale, off-target chemical drift *specifically caused by autonomous drone swarming software error* impacting non-target crops or sensitive areas.
      *   **Step 3:** **Known Unknown.** Mechanism (drift) understood; worst-case severity boundable (contaminating X acres of organic farm/sensitive habitat). Software error likelihood is the big unknown, but impact has limits.
      *   *(Skip Step 4)*
      *   **Step 5:** **Stress-Test:** Assume high software error rate causing major drift event every 2 years. Loss estimate exceeds risk appetite. *But...* Proposed premium is *very* high, explicitly pricing the tech risk. **Verdict: Survivable.** WRITE POLICY (with high premium & strict operational clauses). *(You won't like it - the software risk is scary! But the procedure forces acceptance because the ambiguity is boundable *and* the premium covers the pessimistic case)*.

  ### 5. Where the Procedure Stops and I Have to Decide
  The procedure clarifies *why* you're uncomfortable, but judgment remains critical at:
  *   **Defining the Core Unknown (Step 2):** What *you* see as the irreducible ambiguity is subjective. Is it the battery chemistry or the charging behavior in apartments?
  *   **Classifying Ambiguity Depth (Step 3):** Is it a boundable Known Unknown or a potential Black Swan? This hinges on your assessment of novelty and consequence chains.
  *   **Plausibility in Stress-Testing (Step 5):** What's "pessimistic but plausible"? 5% failure rate? 10%? Your call.
  *   **"Shared" vs. "Isolated" Ambiguity (Step 4):** Assessing whether the Board would share the surprise involves your judgment of their perspective and market knowledge.
  *   **"Adequate" Ambiguity Premium (Step 6):** What price is high enough to compensate for sleepless nights? This is fundamentally about your (and the Board's) risk tolerance and values – how much uncertainty *can* we stomach for enough reward?

  ### 6. What This Can't Do
  *   **Eliminate Ambiguity:** It won't make the unknown known. It only structures how you confront it.
  *   **Guarantee Outcomes:** This manages decision *process*, not results. A Known Unknown stress-tested as "Survivable" could still blow up.
  *   **Resolve the Ellsberg Paradox:** Your instinct to prefer the known urn isn't "wrong" in an insurance context. Insurers *need* data to function. This framework accepts that aversion to pure ambiguity is a rational response when you bear the consequences. It doesn't try to argue you *should* be indifferent; it forces you to acknowledge *when* it's ambiguity aversion driving the "no," so you can consciously decide if that's justified *in this specific case* (e.g., via Steps 4 & 6).
  *   **Replace Expertise:** It relies on your ability to identify risks, find analogs, and assess plausibility. Garbage in, garbage out.
  *   **Handle Interconnected Ambiguities:** If multiple Core Unknowns interact chaotically, the framework struggles.
