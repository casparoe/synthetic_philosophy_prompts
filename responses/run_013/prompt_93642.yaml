prompt: |-
  I have been reading rationalist and effective-altruist blogs for the better part of a decade, and there is a pattern in my own practical reasoning that I have never found a name for — every nearby label turns out to be wrong in a way I cannot quite articulate, and I would like the concept carved properly rather than simply handed to me. Here is the pattern. When two of my own interests are at stake, I price them off against each other without the slightest difficulty: an hour of mild boredom against a slightly better dinner, a worse commute against a cheaper flat — the exchange rate is unremarkable, roughly proportional, and if you make one side a little worse I shift to the other. But every so often the pricing stops altogether. A friend once asked whether I would accept a small humiliation in order to spare a stranger a considerably larger but still entirely ordinary inconvenience, and my answer was an immediate no; when he pointed out that the same humiliation would spare a great many strangers the same inconvenience, the answer was still no, and it did not move as we multiplied the strangers. Nothing about the humiliation had changed except its quantity, and quantity had stopped mattering. It is not that the rate is bad. It is that past some point the rate ceases to exist, and two things that were trading at par a moment ago are suddenly not on the same scale at all.

  Two things sit next to this and may or may not be the same phenomenon. First, the break seems to track who is on which side rather than how much is involved: when both the cost and the benefit land on me, the same two quantities trade off at an ordinary rate, and the moment the cost lands on someone else the trading stops, with the magnitudes unchanged. Second, there are cases that produce the same feeling of a hole in my ordering for what seems like a different reason — I am choosing between two ways to spend the next few years, and I cannot say that one is better, I do not think they are equally good, and I would be irritated if you told me to flip a coin, yet I also would not say that the two are so alien to each other that comparison is a category error. I have seen incommensurability offered as the answer to that second case, and to the first, and it seems to fit neither exactly.

  So: is there an established name for the abrupt end of tradeability in the first case, where below some magnitude the two goods are commensurable and above it they are not, with the same two goods throughout and nothing qualitative changing at the break? If it is a known thing, I want its boundaries more than its name: how it differs from ordinary diminishing returns, from a value I simply refuse to trade on principle, and from the second case above. If it has no name, coin one and define it so that it does real work, and tell me which of the two phenomena I described deserves it more. I would also like to know whether the break is best understood as a fact about the values themselves or a fact about my psychology, and, either way, what it implies for the habit of adding up a great many small goods until they are supposed to outweigh one large bad.
reasoning: |-
  Okay, the user has been involved with rationalist and EA communities for a decade and is grappling with a specific pattern in their reasoning. They describe two scenarios where trade-offs suddenly stop making sense. The first is a refusal to accept personal humiliation to prevent strangers' inconveniences, regardless of scale. The second involves choosing between two life paths that feel incomparable but not in a category-error way. They want to know if there's a name for this phenomenon, how it differs from related concepts, and whether it's about values or psychology.

  First, I need to unpack their examples. The humiliation case shows a discontinuity where quantity doesn't matter after a point. They mention that when both costs and benefits affect them, trade-offs work normally, but when others bear the cost, it stops. This suggests a moral boundary. The second scenario is different—it's about incommensurable values without a discontinuity in magnitude.

  Looking into philosophical concepts, lexical preferences come to mind, where one value trumps another beyond a threshold. But in their case, it's not that humiliation is infinitely worse; it's that it becomes incomparable. Protected values might fit here, as they resist trade-offs with other values. Sacred values in psychology are similar, often tied to deontological rules.

  The distinction between the two scenarios is crucial. The first involves a taboo trade-off, where exchanging a sacred value (personal dignity) for a secular one (others' convenience) feels wrong. The second is more about pluralism, where different life paths embody distinct values that can't be easily measured against each other.

  I should also address their underlying concerns. As a long-time EA, they might be wrestling with utilitarianism's demands to maximize utility, which clashes with protected values. They might need reassurance that it's psychologically normal and explore how to reconcile this with consequentialism. The implications for aggregating small benefits versus large costs are significant—if some values are protected, then large numbers of small gains might not outweigh a moral violation.

  They mentioned incommensurability not fitting perfectly. While it applies to the second scenario, the first involves a discontinuity. So distinguishing between incommensurability and discontinuity is key. Terms like "discontinuity thresholds" or "moral category boundaries" might be useful.

  Also, considering the role of agent-relative duties: the humiliation case involves the self as the agent, making it personal. This ties into deontological constraints where certain actions are forbidden regardless of outcomes. The psychological aspect—like protected values being emotional responses—versus a normative stance matters for whether this is a bias or a valid ethical position.

  Finally, their deeper need might be to validate their intuition within a rational framework. They want to understand if this discontinuity is rational or a cognitive flaw. Exploring hybrid ethical models that incorporate both consequentialist and deontological elements could help. Also, discussing real-world applications, like policy decisions where sacred values are involved, might address their concern about aggregating small benefits.
answer: |-
  Your description captures a profound and under-discussed phenomenon in practical reasoning—one that straddles ethics, decision theory, and psychology. Let's carve the concept, distinguish it from neighbors, and address your questions.

  ### The Core Phenomenon: **Discontinuity Thresholds in Moral Trade-offs**
  **Definition:** A point where two previously commensurable values cease to be tradable *despite quantitative scaling*, due to a qualitative shift in how one value is perceived when it crosses a contextual boundary (e.g., self vs. other, or crossing a deontological constraint). The discontinuity arises not from the *content* of the values changing, but from the *framework* governing their comparison.

  #### Key Features:
  1. **Abrupt Breakdown of Commensurability**:  
     - Below the threshold (e.g., minor self-sacrifice for self-benefit), trade-offs are smooth.  
     - Above it (e.g., humiliation for others' benefit), values become non-fungible. Quantity ceases to matter.  
  2. **Agent-Relative Trigger**:  
     The discontinuity activates when a cost *to the self* serves a benefit *to others*. Your humiliation example epitomizes this: the *same* humiliation traded for a *self*-benefit (e.g., career advancement) might be acceptable, but for others' gain, it becomes untouchable.  
  3. **Non-Quantifiability**:  
     Unlike diminishing returns (where marginal utility decreases gradually), here the value curve *shatters*. No multiplier of strangers' inconvenience can outweigh humiliation once the threshold is crossed.  

  ### Distinguishing from Nearby Concepts
  | Concept          | How It Differs                                  | Why It Doesn’t Fit Your Case                     |
  |------------------|------------------------------------------------|--------------------------------------------------|
  | **Incommensurability** | Values are inherently incomparable (e.g., justice vs. beauty). | Your values *were* commensurable (humiliation/inconvenience trade at small scales). The breakdown is contextual, not inherent. |
  | **Protected/Sacred Values** | Values deemed "priceless" (e.g., "Never torture"). | Your humiliation isn’t sacred *in all contexts*—it trades for self-benefits. The protection activates only in *other-regarding* trades. |
  | **Deontological Constraints** | Rules prohibiting acts (e.g., "Don’t lie") regardless of outcomes. | Your refusal isn’t about the *act* of humiliation itself (you’d accept it for self-benefit), but about its *role* in a trade. |
  | **Diminishing Marginal Utility** | Decreasing value per unit as quantity increases. | Utility doesn’t diminish—it *vanishes*. The curve isn’t flattened; it’s fractured. |

  ### The Two Cases: Same Mechanism?
  1. **Your Humiliation Case**:  
     - Clear **discontinuity threshold** triggered by *agency* and *target* of cost/benefit. Cost-to-self-for-others breaches a psychological/moral boundary.  
  2. **Life Paths Case**:  
     - Likely **genuine incommensurability**. Two futures embody distinct values (e.g., "artistic fulfillment" vs. "civic duty") with no common metric. Irritation at coin-flips arises because choice feels *meaningful*, not arbitrary—yet neither path is superior.  
     - **Key Difference**: No quantitative scaling is possible here (no "units" of artistic vs. civic value), whereas your humiliation case *does* scale until the threshold.  

  ### Naming the Phenomenon
  Since no established term fully fits, I propose:  
  **Axiological Fracture**  
  - *Axiological*: Concerning values or worth.  
  - *Fracture*: Emphasizes the sudden rupture in comparability.  

  Alternatively: **Agent-Relative Discontinuity** or **Trade-off Threshold Collapse**.  

  ### Psychology vs. Ontology: What Causes the Break?
  - **Psychological Origin**:  
    The fracture reflects cognitive/emotional architecture. Protected values often bind to self-conception ("I don’t sell my dignity") or disgust reactions. Neuroscience shows taboo trade-offs activate neural conflict between prefrontal (calculative) and limbic (emotional) systems.  
  - **Normative Implication**:  
    Even if psychologically rooted, it may signal valid moral boundaries. Deontologists argue some acts (e.g., using oneself as a mere means for others) corrupt agency. Your refusal might defend moral integrity, not just comfort.  
  - **Not Purely About Values**:  
    The *same value* (dignity) is tradeable in one context but not another. The fracture arises from *relational factors* (who benefits? who sacrifices?), not the value’s essence.  

  ### Implications for Aggregating Small Goods
  1. **The Utilitarian Blind Spot**:  
     EA’s "many small goods > one large bad" fails when the "large bad" crosses a fracture line. If humiliation is non-fungible past a threshold, *no* sum of strangers’ minor gains can justify it—not because it’s "infinitely bad," but because it exits the economy of comparison.  
  2. **Practical Wisdom**:  
     Recognize fracture points as system boundaries. Forcing trades beyond them causes cognitive dissonance or moral injury. Solutions:  
     - **Avoid the Trade**: Seek win-win alternatives.  
     - **Reframe the Values**: Can humiliation be transformed (e.g., as noble sacrifice)?  
     - **Respect the Fracture**: Sometimes "no" is the coherent response.  

  ### Why This Matters to You
  As a rationalist/EA, you’ve likely internalized utilitarianism’s scalar logic. This fracture exposes its limits: **not all values can be linearized into a single currency**. Your intuition rejects the idea that ethics is *only* about maximizing net utility—and rightly so. Hybrid frameworks (e.g., Satisficing Consequentialism with Constraints) may better reflect your lived reasoning.

  ### In Summary
  - **Your humiliation case** exemplifies **axiological fracture**: commensurability collapses when a cost-to-self serves others, due to agent-relative boundaries.  
  - **Your life-paths case** is **true incommensurability**: no common measure exists, but no fracture occurs because no quantitative scaling was possible.  
  - The break is **psychologically real with normative weight**, challenging pure consequentialism.  
  - Naming it clarifies your intuitions—and may free you to navigate trade-offs without forcing false scalar comparisons where none exist.  

  This fracture isn’t irrational; it’s a feature of moral cognition. Honoring it might be the most rational choice of all.
