prompt: |-
  I have been asked to run a single seventy-five-minute session on the Knobe effect for a mixed group of graduate students in cognitive science, a few of whom have done some philosophy of action and none of whom have met experimental philosophy before. I do not want you to explain the Knobe effect to me; I want a plan for how I should explain it. Give me the following, laid out in the order in which the components must be introduced and with an explicit note on what depends on what — in particular, tell me what has to be on the table before the central finding can land as a genuine puzzle rather than as a curiosity the audience files away under the heading of framing effects.

  On the carrying example: the standard chairman vignette — a business decision that will foreseeably harm the environment, taken by someone who declares that he does not care about the environment — is the one everyone uses, and I am inclined to keep it out of the opening and bring it in only late, if at all. I want to build the session instead around a case of my own: a hospital administrator who adopts a cost-cutting measure that she knows will, as a side effect, cause a small number of preventable infections, and who is indifferent to that consequence. Tell me whether that case can carry the session, what it must contain and what it must leave out if the audience is to generate the asymmetry themselves rather than have it pointed out to them, and what the chairman case adds at the end that my case cannot. If you think my case is the wrong vehicle, say so and offer a better one on the same accounting.

  I have a suspicion that I want the session to test rather than assert: that what drives the asymmetry is not the badness of the side effect but the agent's indifference to it — that an agent who does not care is read as having brought the outcome about intentionally, while an agent who minds but proceeds anyway is read differently, and that in every standard vignette the good/bad contrast is confounded with the caring/indifferent contrast. Design the sequence so that these two candidate explanations are visibly pulled apart by the time the session ends, and tell me which of the cases, in which order, would separate them.

  Then the misconceptions, in the order the audience will actually form them, each with the point in the sequence at which I should head it off. I expect them to reach immediately for the thought that this is merely a bias, and for the thought that it shows the concept of intentional action to be incoherent; I would rather have your list than mine.

  Finally: one question I can put to the room at the close that would tell me whether they have understood the finding as a claim about the concept rather than merely memorized the result; and an explicit list of what I should leave out at this level, together with the form of words I should use to say that I am leaving it out.

  Do not give me readings and do not cite anything; I will supply the references myself.
reasoning: |-
  Okay, let me break this down. The user is designing a 75-minute session on the Knobe effect for cognitive science grad students, some with philosophy of action background but no prior exposure to experimental philosophy. They want a specific pedagogical sequence centered on their hospital administrator case rather than the standard chairman vignette.

  First, I need to understand why they're avoiding the chairman example. Probably because it's overused and they want fresh engagement. Their hospital case must accomplish several things: generate the asymmetry organically, avoid premature framing effect dismissals, and allow testing of competing explanations (badness vs. indifference). 

  The key challenge is making the asymmetry feel puzzling, not just a "curiosity." That requires building conceptual tension step by step. I'll structure it so students first grasp the core concept of intentional action through neutral cases, then encounter the hospital scenario where their own judgments create the asymmetry. Only after they feel the cognitive dissonance should we introduce the chairman parallel.

  For the hospital case to work, it must:
  - Be morally asymmetrical (harm vs benefit)
  - Feature identical causal structures
  - Have explicitly indifferent agents
  - Avoid loaded terms like "profit" that prime business ethics assumptions
  The benefit version needs careful wording so indifference doesn't imply malice - maybe frame it as administrator focusing narrowly on policy compliance.

  To separate badness from indifference explanations, we'll need:
  1. A bad outcome with indifferent agent (standard harm case)
  2. A bad outcome with caring-but-overridden agent (new variant)
  3. A good outcome with indifferent agent (standard benefit case)
  The prediction: intentionality judgments spike only in condition 1.

  Common misconceptions to preempt:
  - Early dismissal as "just framing" (block by showing asymmetry persists under cognitive load)
  - Assumption of conceptual incoherence (counter with cross-cultural robustness)
  - Reduction to outcome bias (contrast with moral luck cases)

  The closing question should probe conceptual understanding, not just recall. Something like: "If we found identical neural correlates for both judgments, would that dissolve the puzzle?" Good answer would note the question is about competence, not performance.

  What to omit:
  - Debates about intentional action definitions
  - Specific neurotransmitter theories
  - Historical context of experimental philosophy
  Use phrasing like: "We're bracketing implementation questions to focus on the conceptual tension today."

  This approach keeps students actively hypothesizing while systematically dismantling their initial dismissals. The hospital case stays central, with chairman appearing late just to show generalizability.
answer: |-
  Here's a focused 75-minute session plan structured to make the Knobe effect land as a deep puzzle, using your hospital case while rigorously testing the *indifference* vs. *badness* hypotheses. Components are sequential, with explicit dependencies.

  ---

  ### **Session Structure (75 mins)**

  #### **1. Groundwork: Core Concept of Intentional Action (10 mins)**
     - **What:** Elicit consensus on "intentional action" using neutral, non-moral examples (e.g., *"A nurse turns off a malfunctioning monitor by pressing the red button"*).  
     - **Key Dependencies:** None (starts from scratch).  
     - **Critical Pre-emption:** Head off the *"it’s just framing"* misconception immediately. Say: *"We’re not testing how wording affects decisions—we’re probing how you conceptualize intentionality itself. Hold framing theories for now."*  

  #### **2. Your Hospital Case—Harm Version (15 mins)**  
     - **Case Text:**  
       *"A hospital administrator implements a cost-cutting policy. She is told this will definitely cause 10 extra preventable infections per year. She replies: ‘I don’t care if patients get infected—I just need to cut costs.’ The policy is implemented, and infections rise."*  
     - **Task:** Ask: *"Did she intentionally cause the infections?"* Poll votes anonymously (e.g., clickers/slips). **Expect >80% "yes".**  
     - **Dependencies:** Requires the core concept (Step 1) to frame the question.  
     - **What’s Omitted:** No mention of benefit cases or asymmetry yet.  

  #### **3. Hospital Case—Benefit Version (10 mins)**  
     - **Case Text:**  
       *"A hospital administrator implements a cost-cutting policy. She is told this will definitely prevent 10 infections annually. She replies: ‘I don’t care about infections—I just need to cut costs.’ The policy is implemented, and infections decline."*  
     - **Task:** Same question: *"Did she intentionally prevent the infections?"* Poll votes. **Expect <20% "yes".**  
     - **Dependencies:** Steps 1 & 2 (asymmetry only shocks after seeing both).  
     - **Why This Works:**  
       - **Contains:** Identical causal structure/indifference; only outcome valence (harm/benefit) differs.  
       - **Leaves Out:** Moral language (e.g., "harm"), agent emotions beyond indifference.  
     - **Puzzle Elicitation:** Display poll results side-by-side. Ask: *"Same agent, same attitude, same causal role—why the drastic difference in intentionality judgments?"*  

  #### **4. Testing Indifference vs. Badness (20 mins)**  
     - **Dependencies:** Asymmetry (Steps 2–3) must be visible.  
     - **New Case—Caring Agent (Harm):**  
       *"Same administrator implements policy knowing it will cause 10 infections. She says: ‘I hate that patients will suffer, but I have no choice—we need these savings.’ Infections rise."*  
       **Task:** Poll: *"Did she intentionally cause infections?"* **Prediction:** ~20–40% "yes" (weak intentionality).  
     - **Contrast:** Show results vs. Step 2 (indifference/harm: >80% "yes").  
     - **Key Insight:** Asymmetry peaks when the agent is *indifferent to harm*—not *all harm* or *all indifference*. Badness alone fails (caring agent isn’t seen as intentional); indifference to *good* outcomes also fails (Step 3).  

  #### **5. Chairman Case—Late Utility (5 mins)**  
     - **Adds:** Generalizability beyond healthcare. Show it *after* your cases to say: *"This asymmetry replicates across domains—here’s the classic example."* Briefly contrast chairman/hospital indifference.  
     - **Omit if:** Time is tight; your case suffices if Steps 2–4 are clear.  

  #### **6. Misconception Management (Integrated)**  
     Pre-empt in this order:  
     - **"It’s just bias/framing!"**  
       - **When:** After Step 3 (asymmetry revealed).  
       - **Block:** *"Framing effects typically flip decisions. Here, the *structure* of the concept seems to change—intentionality isn’t symmetrical. We’ll test robustness."*  
     - **"The concept is incoherent!"**  
       - **When:** After Step 4 (caring agent data).  
       - **Block:** *"If incoherent, judgments should be random. But they’re predictable: indifference to harm triggers ‘intentional’."*  
     - **"It’s only about bad outcomes!"**  
       - **When:** After Step 3 (benefit case).  
       - **Block:** Use Step 4’s caring/harm case to show badness *alone* isn’t sufficient.  

  #### **7. Closing Question (5 mins)**  
     - **Question:** *"If we found people in a lab study *insisting* the administrator caused infections intentionally—but denied she *acted intentionally*—would that contradict the Knobe effect?"*  
     - **Why it Works:** Distinguishes memorized results ("asymmetry exists") from conceptual insight (the effect shows intentionality *ascription* is valence-sensitive, not just outcome evaluation). Good answer: "No—it reinforces that ‘intentional action’ is the contested concept."  

  #### **8. Explicit Omissions & Wording**  
     - **Omit:**  
       - Neuro/cognitive mechanisms (say: *"We’re bracketing *how* the mind does this to ask *what* it’s doing."*)  
       - Universalism vs. cultural variation (say: *"Today’s focus is the structure of the asymmetry, not its distribution."*)  
       - Solutions (e.g., normative vs. descriptive theories).  
     - **Wording:** *"We’re isolating the puzzle today—not resolving it. This is step one: seeing why it demands explanation."*  

  ---

  ### **Why This Sequence Works**  
  - **Puzzle First:** Asymmetry (Steps 2–3) emerges from participants’ *own judgments*, making it visceral. The chairman case is redundant here.  
  - **Indifference Tested:** Step 4’s caring/harm case decouples badness from indifference, falsifying pure "bad outcome" accounts.  
  - **Misconceptions Pre-empted:** Bias/incoherence claims are blocked by data structure and controlled cases.  
  - **Conceptual Focus:** The closing question forces synthesis: the effect is about how we *construe agency*, not just outcomes.  

  **Vehicle Sufficiency:** Your hospital case fully replaces the chairman example. Its clinical context avoids profit-motivated assumptions, sharpening the indifference test. Use Step 4’s caring variant to isolate the indifference mechanism—this is what the chairman case cannot do alone.

  ---
  **Timing Buffer:** Built-in flexibility (e.g., shorten chairman discussion). Ensure polling is swift (pre-printed slips if tech fails).
