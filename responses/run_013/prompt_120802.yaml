answer: |-
  ## Joint Statement on the Study of Nations and Nationalism

  We, undersigned representatives of the modernist and ethno-symbolist perspectives, having engaged in adversarial collaboration, present this statement to clarify points of agreement, define procedures, translate key terms, state residual disagreements, and identify crucial tests. We affirm the following jointly acceptable points while preserving the core tenets of each position.

  **1. Jointly Accepted Claims:**
      1.  **Pre-Modern Groupings Matter:** Significant pre-modern groupings existed (e.g., medieval kingdoms, linguistic communities, religious groups, tribes) that possessed shared names, some sense of distinctiveness, and cultural markers. Ethno-symbolists see these as foundational *ethnies*; modernists see them as potential raw material, distinct from modern nations.
      2.  **Modern Transformations Are Necessary:** The specific political, social, and economic transformations of the modern era (roughly post-18th century) – including centralized states, mass communication, standardized education, industrialization, and popular sovereignty – were indispensable for the formation of the *specific phenomenon* of the modern nation as a mass, self-aware political community claiming legitimacy. Ethno-symbolists concede these were necessary catalysts; modernists insist they were constitutive.
      3.  **Nations Are Not "Natural" or Eternal:** No nation exists in an unchanging, primordial form identical to its modern manifestation. Both sides reject strong primordialism. Ethno-symbolists emphasize transformation; modernists emphasize creation.
      4.  **Continuity Claims Are Central:** The assertion of historical continuity with a pre-modern past is a near-universal and functionally vital feature of modern nationalism. Modernists emphasize this continuity is largely constructed retrospectively ("invented tradition"); ethno-symbolists argue it often builds meaningfully upon pre-existing myths and memories.
      5.  **Any Theory Must Explain Specificity:** Any adequate theory of nationalism must explain why specific nations emerged in specific territories at specific times, rather than others. Modernists point to the timing and location of modernizing forces; ethno-symbolists point to the prior existence and location of relevant *ethnies* and their mobilizing capacity.
      6.  **Evidence is Multifaceted:** Valid evidence includes historical records of state policies, institutional development, mass media content, educational curricula, demographic shifts, popular movements, expressions of identity (diaries, songs, petitions), cultural artifacts, and pre-modern group structures and myths.

  **2. Jointly Acceptable Procedure for Dating a Nation:**
  We agree that it is correct to say a nation existed at a given time T in a territory R when the following conditions are demonstrably true for a significant population P within R by T:
      *   **Self-Consciousness:** A critical mass of P explicitly identifies as members of a named collective distinct from others (e.g., "We are the French," "We are Serbs").
      *   **Political Aspiration:** This collective identity is widely understood by P to imply a right to some form of collective self-determination, autonomy, sovereignty, or distinctive political status within or over R.
      *   **Mass Scale:** This consciousness and aspiration extend beyond elites to encompass a substantial portion of P, facilitated by modern means of communication and social organization.
      *   **Territorial Link:** The collective identity is strongly associated with R as its legitimate homeland.
      *   **Cultural Distinction:** P shares, or believes it shares, distinctive cultural features (e.g., language, customs, historical narratives) that mark its collective identity.

  *Note:* This procedure focuses on the *emergence* of the modern nation as a mass political phenomenon. It does not preclude the existence of precursors (*ethnies*, protonational groups) recognized by ethno-symbolists, nor does it deny the ongoing role of modern institutions emphasized by modernists in *maintaining* the nation. Both sides accept this procedure as fair for identifying the *point* at which the modern nation emerges, while acknowledging that the path *to* that point differs in their interpretations.

  **3. Translation Table for Key Terms:**

  | Term          | Modernist Reading                                      | Ethno-symbolist Reading                                       | What Turns on the Difference (Substantive [S] / Verbal [V]) |
  | :------------ | :----------------------------------------------------- | :----------------------------------------------------------- | :---------------------------------------------------------- |
  | **Nation**    | A modern socio-political construct: a mass, sovereign political community formed through 18th-20th century processes. | A named human community sharing myths, memories, culture, association with a homeland, and solidarity, typically emerging from a pre-modern *ethnie* transformed in the modern era. | **S:** The core disagreement: Is the nation fundamentally a *product* of modernity, or a *transformation* of a pre-existing community? |
  | **Ethnic Community (Ethnie)** | A pre-modern group sharing some cultural features (language, religion, customs) and often a myth of common ancestry. Lacks mass political consciousness or aspiration. Precursor, not nation. | A pre-modern named community with shared myths of common ancestry and descent, historical memories, elements of a common culture, association with a specific homeland, and a sense of solidarity. The crucial building block for later nations. | **S:** The significance attributed to the *ethnie*. Modernists see it as one potential ingredient; ethno-symbolists see it as the essential core. |
  | **Tradition** | Largely invented or reconstructed in the modern period to serve nationalist purposes, creating an illusion of timelessness. | Includes both pre-modern elements (customs, myths, symbols) that persist, though often adapted, *and* modern inventions that resonate because they build upon existing cultural frameworks. | **S:** The degree of genuine pre-modern survival vs. modern construction. Modernists emphasize invention; ethno-symbolists emphasize adaptation/continuity. |
  | **Invention** | Deliberate creation or radical reconstruction by elites/institutions in the modern era, often with little connection to actual past practices. | Can include deliberate creation, but also selective adaptation, reinterpretation, and formalization of pre-existing cultural elements to serve new purposes. | **S:** The novelty and deliberateness implied. Modernists see a more radical break; ethno-symbolists see a more organic, if directed, process building on pre-existing material. |
  | **Consciousness** | Mass national consciousness is a distinctly modern phenomenon, created primarily by modern institutions and media. | Modern national consciousness represents a transformation and politicization of pre-existing ethnic or communal consciousness, amplified by modern conditions. | **S:** The novelty of the *mass political* consciousness. Modernists see it as created; ethno-symbolists see it as evolved/transformed. |
  | **Continuity** | Primarily a retrospective narrative claim constructed in the modern period, often masking significant rupture. | Involves substantive cultural and symbolic continuities linking the modern nation to its pre-modern ethnic past, even amidst transformation. | **S:** The actual substance and depth of the link between the modern nation and pre-modern groups. Modernists see narrative; ethno-symbolists see connection. |
  | **Modernity** | The period (post-18th century) defined by specific socio-economic-political transformations (industrialization, capitalism, centralized state, mass society, ideology) that *generated* nations. | The period providing the necessary conditions (political ideology, technology, social change) for the *transformation* of pre-existing *ethnies* into mass, political nations. | **V/S:** The difference is primarily **substantive** regarding *role* (generative vs. transformative), though the core features of modernity are largely agreed upon. |

  **4. Residual Disagreements (Stated by Each Side):**

  *   **Modernist Position (as they would state it):** "The modern nation is a fundamentally new type of large-scale, mass, sovereign political community, distinct from all pre-modern forms of group identity. Its emergence required the specific structural conditions and deliberate actions (state-building, mass education, print media, economic integration) of the modern era. Pre-modern *ethnies* provided cultural raw material and potential territorial foci, but their transformation into nations involved such profound discontinuity in scale, political consciousness, and social organization that it constitutes creation, not mere evolution. The nation's claimed ancient lineage is largely a legitimizing myth generated *after* its modern formation."
  *   **Ethno-symbolist Position (as they would state it):** "The modern nation represents the culmination and political activation of deep-rooted, pre-existing ethnic communities (*ethnies*). While modernity provided crucial catalysts and transformed the *ethnie* into a mass, politically mobilized nation, the core elements – name, myths of origin and descent, historical memories, cultural distinctiveness, association with a homeland, and a sense of solidarity – exhibit significant continuity from the pre-modern past. The nation forms *where* and *when* it does primarily because a pre-existing *ethnie* is present to be mobilized by modern conditions. Denying this link renders the specific pattern of nation formation inexplicable."

  **5. Cruxes: Key Sub-Questions and Tests:**

  1.  **Crux: The Mobilizing Power of Pre-Modern *Ethnie* Elements**
      *   **Question:** Does the presence and specific content of a pre-modern *ethnie* significantly predict the *likelihood*, *timing*, *location*, and *form* of successful modern nation formation, beyond just providing available cultural material?
      *   **Test:** Examine cases where modernizing conditions (state centralization, print capitalism, etc.) occurred but where the nature of the pre-modern population was highly complex or lacked a dominant *ethnie* with clear myths, memories, and boundaries (e.g., post-colonial Africa, the Balkans post-Ottoman collapse, Habsburg Empire). Compare nation-formation outcomes (success, failure, form, conflict) in these areas to areas where a relatively well-defined *ethnie* existed prior to intense modernization (e.g., Japan, France, Sweden).
      *   **Modernist Prediction:** Successful nation formation will correlate primarily with the intensity and nature of modernizing pressures and elite strategies. Outcomes in complex areas will be determined by modern contingencies (e.g., colonial borders, elite choices, economic factors), not pre-modern *ethnie* boundaries. Pre-modern elements will be selectively used but not determinative. *Disconfirming:* Clear, consistent patterns showing pre-modern *ethnie* boundaries/myths directly determining modern national boundaries/identities in complex zones, despite varying modern pressures.
      *   **Ethno-symbolist Prediction:** Successful nation formation will be significantly more likely, faster, and less conflict-prone where a recognizable pre-modern *ethnie* provided a core. In complex areas, nation formation will be more difficult, delayed, prone to conflict, and likely to fracture along lines reflecting older communal divisions or myths. *Disconfirming:* Smooth, rapid, stable nation formation consistently emerging in complex areas with no link to prior *ethnies*, solely driven by modern institutions, while areas with strong *ethnies* fail to form nations despite similar modern pressures.

  2.  **Crux: The Novelty of Mass National Consciousness**
      *   **Question:** Was mass national consciousness fundamentally created *de novo* by modern institutions, or was it a transformation and politicization of pre-existing forms of communal consciousness?
      *   **Test:** Analyze expressions of collective identity in pre-modern sources accessible beyond elites (e.g., popular ballads, folklore, chronicles by non-elites, petitions, religious movements, peasant revolts) in regions that later formed nations. Look for evidence of widespread identification with a named community larger than locality/region, sharing historical memories/myths, and distinct from others, even if lacking explicit political sovereignty claims. Compare the prevalence and nature of such expressions before and after the onset of intense modernization.
      *   **Modernist Prediction:** Evidence of mass, supra-local, politically relevant group consciousness tied to a *specific* national name/territory will be rare or absent before the modern era. Modern sources will show a clear qualitative shift coinciding with institutional changes (e.g., mass schooling, newspapers). *Disconfirming:* Widespread, consistent evidence of popular identification with future national names/myths/boundaries, including political implications (e.g., resistance to "foreign" rule based on communal identity), predating modern institutions.
      *   **Ethno-symbolist Prediction:** Evidence will show significant pre-modern popular identification with named communities (*ethnies*), their myths, memories, and territories, forming a basis for solidarity and distinction. Modern consciousness builds upon and politicizes this, altering its scale and political content but not creating it from nothing. *Disconfirming:* A complete absence of pre-modern popular identification with communities resembling later nations, with modern sources showing entirely novel concepts imposed without reference to prior identities.

  **Conclusion on Verbal vs. Substantive Disagreements:**

  Significant elements of this dispute are **substantive**. The core disagreement – whether the modern nation is a fundamentally novel creation of modernity or a transformation of pre-existing *ethnies* – hinges on empirical questions about causation, continuity, and the relative weight of modern structures versus pre-modern cultural frameworks. Similarly, disagreements about the novelty of mass consciousness and the nature of continuity are substantive, resolvable through historical evidence as outlined in the cruxes. However, **verbal disagreements** also exist, particularly surrounding the emphasis implied by terms like "invention" (radical creation vs. creative adaptation) and "consciousness" (focusing on its modern mass-political *form* vs. its pre-modern communal *roots*). The translation table clarifies these semantic differences to prevent arguments based solely on definitional preferences. The joint dating procedure further isolates the substantive disagreement about the *process leading to* the emergence point.
