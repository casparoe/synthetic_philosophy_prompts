  - Incomparability: Doubtful. Even with undefined EV, we can often compare via dominance. Low probability at 10%.
  - Rationality indeterminacy: Can't ignore this - "rational" is underspecified here. Significant 40% chance it's the real issue.

  The final probability comes out around 60%, mostly because the unbounded value and bounded utility points are strong, but the computation/rationality distinction pulls it down. The biggest lever is clearly the bounded utility question - if someone proved that unbounded utility is rationally mandatory, that would drop my probability to near-zero.

  For restating the claim: Better to split into "No possible rule exists" (probably false) and "Rationality requires capping" (debatable). The latter is the more interesting question.

  The St. Petersburg paradox isn't decisive because it assumes the model rather than challenging it. What would change my view? A rigorous proof that any bounded utility function leads to exploitable inconsistencies - that's the nuclear option against their position.
