prompt: |-
  I help run a small skeptics' society that offers to design and pay for a controlled test of anyone who claims an extraordinary ability — a standing challenge, though ours is funded at the scale of a few hundred dollars rather than a million. Six or so claims reach our monthly meeting, and my job is to turn each into a decision: either we agree on a written protocol with the claimant, or we decline. We have been improvising this, and I would like a real procedure.

  I am not asking for the textbook Popper checklist. I have read enough rationalist blogs to know that falsifiable-or-not is not a single switch, and I know the standard objections to treating it as one. What I want is a procedure that survives them. It has to handle four things in particular. First, a claim is almost never tested alone: you test the claim together with a bundle of auxiliary assumptions about the apparatus, the statistics, and the claimant's honesty, so a failure does not by itself tell you which part was false. Second, the rescue move Popper warned about, in which a claimant saves a refuted claim by reinterpreting a term or tacking on a clause, so that no result could count against it. Third, the difference between a claim that has merely been tested and one that has been tested severely, where the test would very likely have produced a discordant result had the claim been false — the severity idea associated with Deborah Mayo. Fourth, the Lakatosian thought that you judge a line of inquiry by whether its amendments predict new things or only absorb failures.

  The constraints are real. We have about twenty minutes per claim at the meeting, a couple of weekends and a few hundred dollars per test we agree to run, and the protocol has to be written and signed by the claimant before we spend anything. It has to be defensible both to our own members, who are quick to notice when we have bought a vague claim, and to the claimant, who will call us unfair if we smuggle in a criterion they never agreed to.

  Please give me the procedure as exactly five numbered items, one or two sentences each, with no introduction or conclusion, each item stating one step and, where it bears on a claim below, naming which claim it decides and how. It should say what to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a decline, and where it hands the decision to a person because the question is really one of values or of feasibility rather than of testability. Run it on three claims: a man who says he can locate underground water more reliably than a geologist can; a woman who says she can, by intention alone, make a random-number generator produce more ones than chance, but only when no hostile observer is present; and one I will admit I want to accept because it would be fun and would draw a crowd — a claim that the stone blocks of a certain ancient monument were moved by sound, an ability no one can reproduce now. I expect the procedure to give me at least one answer I will not like.

  Tell me where the procedure is most likely to fail — which kind of claim it will misclassify, and which of the four objections above it handles worst — and what would change your mind: which argument or consideration would lead you to redraw one of the five steps. American English, please.
reasoning: |-
  Okay, the user runs a skeptics' society that tests extraordinary claims. They need a structured procedure to evaluate claims efficiently. Let me break down their requirements.

  First, they mentioned four key issues: auxiliary assumptions, rescue moves, test severity, and Lakatosian amendments. The procedure must handle these within tight constraints—20 minutes per claim, limited budget, and written protocols. 

  Looking at the three example claims: water dowsing, influencing RNGs with intention, and moving stones with sound. Each presents different challenges. The water dowser involves comparing against a geologist. The RNG claim has the "no hostile observer" clause, which might be a rescue move. The stone-moving claim is historical and irreproducible, which complicates testing.

  The user probably wants a clear, step-by-step process that's defensible. They might also need to avoid biases, especially since they find the stone claim appealing. The procedure must decline claims that can't be tested properly, even if they're popular.

  For the five steps: Step 1 should define a measurable outcome. The RNG claim's outcome is clear (more ones), but the "hostile observer" part is tricky. Step 2 checks for rescue moves. The water dowser might redefine "reliably," so that needs addressing. Step 3 assesses auxiliary assumptions. For the stone claim, historical methods can't be verified, so it fails here. Step 4 ensures test severity. The RNG test needs enough trials to detect a small effect. Step 5 is about operational feasibility, which the stone claim fails due to irreproducibility.

  The procedure might struggle most with claims that have unfalsifiable clauses, like the RNG's observer clause. That's a rescue move (objection 2). Also, historical claims like the stones are hard because auxiliary assumptions can't be tested (objection 1). 

  If someone argues that severity requirements are too strict, maybe Step 4 could be adjusted. But relaxing it might allow weak tests. The balance is crucial. The user's need for a crowd-pleasing test (stones) clashes with the procedure's rigor, showing where personal bias must be overruled.
answer: |-
  Here is the five-step procedure:

  1.  **Define Measurable Outcome:** Require a quantifiable, verifiable prediction that directly manifests the claimed ability. Ask: "What specific, observable result will demonstrate your ability under test conditions?" *Sufficient answer:* A clear, numerical outcome (e.g., "70% accuracy locating water vs. geologist's 50%", "RNG outputs 53% ones over 10,000 trials"). *Stop if:* Outcome is vague, subjective, or relies on untestable interpretations (e.g., "blocks *felt* moved by sound"). *Handoff if:* Outcome definition involves practical safety/ethics (e.g., dangerous demonstration).

  2.  **Pre-Specify Refutation:** Require the claimant to define *in advance* what specific test result would constitute a failure of their *core claim*, not just the setup. Ask: "What result would convince you your ability didn't work *as you just defined it* in this test?" *Sufficient answer:* Explicit numerical failure criterion tied to Step 1 (e.g., "≤50% accuracy", "≤50.5% ones"). *Stop if:* Claimant refuses, states no result could disprove it, or redefines terms/outcome after naming failure criteria (*Declines RNG Claim*: "Hostile observer" clause makes failure impossible to define pre-test).

  3.  **Identify Critical Auxiliaries:** List key assumptions *essential* for a negative result to challenge the core claim. Ask: "What must be true about the setup, equipment, or your state for a negative result to genuinely challenge your ability?" *Sufficient answer:* Specific, testable assumptions (e.g., "dowsing rods are copper", "RNG is standard hardware RANDU", "I am rested"). *Stop if:* Critical auxiliary is demonstrably false, untestable within constraints, or grants excessive "out" clauses (*Declines Stone Claim*: Auxiliary "Ancient sound frequency X was used" is untestable historically & irreproducible now).

  4.  **Assess Test Severity:** Determine if the agreed test design (sample size, controls) can reliably distinguish claimed ability from chance/normal skill. Ask: "Given your predicted effect size (Step 1) and our test setup, is a negative result truly unlikely if your ability is real?" *Sufficient answer:* Statistical power calculation showing high probability (e.g., >90%) of detecting the claimed effect if real. *Handoff if:* Technical feasibility of achieving required severity within budget/time (*Water Claim proceeds*: Statistician calculates trials needed for 70% vs 50% accuracy).

  5.  **Confirm Operational Feasibility:** Verify the signed protocol can be executed as written with available resources. Ask: "Can we build/acquire/schedule exactly what's described, within budget, time, and safety, without ambiguity?" *Sufficient answer:* Detailed list of materials, setup steps, roles, and costs matching protocol. *Stop if:* Logistically impossible, unsafe, or requires claimant-controlled "calibration" not specified. *Handoff if:* Requires specialized skills/equipment needing member sourcing.

  **Where it Fails:** This procedure is **weakest against Rescue Moves (Objection 2)** embedded *before* Step 2. A claimant who pre-emptively adds complex, untestable eligibility criteria (e.g., "only works during planetary alignments I define post-hoc") may slip through Step 1 if the outcome *seems* measurable but the preconditions aren't falsifiable until Step 2/3.

  **What Would Change My Mind:** If analysis showed Step 4 (Severity) consistently blocked valid tests due to unrealistic power demands on small budgets, I would revise it to require a *plausible minimum detectable effect* agreed with the claimant upfront, rather than demanding high power for *their* claimed effect if unrealistically large. This balances severity with practicality.
