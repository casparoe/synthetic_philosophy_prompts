answer: |-
  Here’s a battle-tested plan for your 90-minute session, structured to build understanding sequentially, preempt misconceptions, and keep the room engaged. It respects your audience’s intelligence while avoiding philosophical jargon until the concepts are *felt*.

  ### Core Sequence (Logic Before Labels)
  1. **Start with Shared Intuition (5 mins)**  
     Open with: *"Imagine two scenarios: (A) You get a free luxury vacation tomorrow. (B) You avoid a severe migraine tomorrow. If you could only choose one, which feels more urgent? Why?"*  
     → **Goal:** Surface the instinct that avoiding suffering often trumps gaining pleasure. Validate both perspectives (some may pick vacation).  
     → **Preempts:** The false idea that all values must be quantified. Shows intuition precedes theory.

  2. **Introduce the Utilitarian Baseline (10 mins)**  
     Present a simple trade-off: *"Suppose you must choose between:  
     Option 1: 1 hour of mild backache (annoying but tolerable)  
     Option 2: Giving up 1 hour of your favorite TV show  
     How much TV time would you sacrifice to avoid the ache? 30 mins? 2 hours?"*  
     → **Goal:** Establish that *below a threshold*, we *do* trade pain/pleasure quantitatively (commensurability). Whiteboard a "scale" with ache vs. TV time.

  3. **Break the Scale: The Threshold (20 mins)**  
     Introduce the **Central Case** (use this exact phrasing):  
     *"Now imagine: You must choose between two outcomes for a stranger:  
     Outcome X: They experience 10 minutes of excruciating torture (burning, crushing—no long-term damage).  
     Outcome Y: They get a lifetime supply of their favorite cake (delivered daily, infinite pleasure).  
     Is there ANY amount of cake in Y that could morally justify choosing X?"*  
     → **Why this works:**  
       - **Felt, not described:** Torture’s visceral horror vs. cake’s trivial pleasure forces a qualitative leap.  
       - **Avoids whole lives:** No "arithmetic smuggling" (no duration/lifetime sums).  
       - **Threshold focus:** Torture clearly breaches an intuitive "too much" line.  
       - **Preempts physiology:** Explicitly state "no long-term damage" to sideline empirical objections.  
     → **Facilitation:** Poll the room. If anyone says "yes," probe: *"How much cake? What if it’s 100 years? 1000?"* Let the absurdity sink in. Conclude: *"For many, beyond some point, suffering cannot be ‘paid off’ with pleasure."*

  4. **Name the Concepts (Lexical Priority & Threshold) (15 mins)**  
     NOW introduce terms:  
     - **Threshold:** The point where suffering becomes intolerable *regardless* of compensating pleasure.  
     - **Lexical Priority:** Below threshold → trade-offs. Above threshold → suffering avoidance *always* wins, no matter the pleasure offered.  
     → **Crucial contrast:** Lexical priority ≠ "infinite weight." If it were infinite, *any* suffering would outweigh *any* pleasure (e.g., a papercut vs. saving a life). The threshold matters. Use the torture example: *"Lexical priority kicks in ONLY above this line."*

  5. **Address Commensurability ≠ Comparability (10 mins)**  
     Pose: *"If pain/pleasure aren’t on one scale, can we still compare them?"*  
     → Use the torture/cake case: *"We CAN compare—we know torture is worse—but not by ‘converting’ units. It’s like comparing the weight of a mountain to the beauty of a sunset."*  
     → **Preempts:** Misconception 1 (incommensurability = incomparability).

  6. **Preempt Key Misconceptions (15 mins)**  
     - **"Infinite weight?"** Reiterate: *"If suffering always had infinite weight, we’d never tolerate a stubbed toe for any pleasure. But we do—until the threshold."*  
     - **"Empirical question?"** Shut this down early (after Step 3): *"This isn’t about neurons computing values. It’s a moral question: *Should* we treat them as exchangeable? Physiology can’t answer that."*  
     - **"No comparison possible?"** Use Step 5’s mountain/sunset analogy.

  ### Diagnostic End Question (5 mins)
  *"Your friend has a terminal illness. Below her pain threshold, she’ll trade some pain for time with family. But above threshold, she says no pleasure justifies enduring it. Does lexical priority demand she refuse all pain relief to maximize lucid time? Why/why not?"*  
  → **Tests understanding:** Correct answer notes lexical priority applies to suffering *avoidance*, not necessarily to refusing relief that reduces suffering. If they grasp this, they see the structure (priority is directional and threshold-bound). Incorrect answers fixate on "suffering always wins."

  ### What to Refuse to Explain
  - **Population ethics** (e.g., "Should we torture one to please millions?"). This requires aggregating suffering/pleasure across persons—a minefield that distorts the core claim.  
  - **Formal decision theory** (e.g., utility functions, lexicographic preferences). Your whiteboard stays at "torture vs. cake," not equations.  
  - **Metaphysics of pain/pleasure** (e.g., "Are they fundamentally different entities?"). Stick to moral intuitions.  
  → **Why:** These demand their own sessions. Introducing them here blurs the focused argument and invites confusion.

  ### Confidence & Uncertainty
  - **Confidence: 8/10.** This sequence mirrors how value theory is taught intuitively (e.g., Parfit’s *Reasons and Persons* scaffolding). The torture/cake case reliably triggers the "threshold intuition."  
  - **Least Sure Point:** Whether the room will *accept* the threshold as non-arbitrary. Your lawyer friend concedes it’s ad hoc—some may pounce here. **Mitigation:** Acknowledge it openly: *"The threshold is messy. We might disagree where it is, but does that invalidate the idea that it exists?"** Redirect to the torture case’s undeniability.

  ### Your Preparation Checklist
  1. Memorize the torture/cake case wording.  
  2. Whiteboard columns: "Below Threshold" (trade-offs) / "Above Threshold" (no trade).  
  3. Pre-write diagnostic question on a card.  
  4. Rehearse shutting down physiology tangents: *"Interesting! But today we’re asking moral, not biological, questions."*  

  This plan meets your audience where they live: in concrete moral intuitions. By making lexical priority a *solution* to the felt problem in Step 3 (not a dogma), it earns its keep. Trust the torture case—it’s philosophically bulletproof because it’s humanly resonant.
