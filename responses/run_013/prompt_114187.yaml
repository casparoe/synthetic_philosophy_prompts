answer: |-
  Here's a pantoum in the voice of the Mars copy, designed for your Parfit presentation, focusing on the continuity of what matters and the indeterminacy of the self:

  ## Pantoum: After the Scan

  I lie down on the scanner’s cold, hard plate.
  The countdown whispers; atoms start to hum.
  **I feel the chill seep deep, anticipate**
  **The nothing that will surely overcome.**

  The countdown whispers; atoms start to hum.
  **I wake to red dust drifting through cold air.**
  **The nothing that will surely overcome –**
  **I search for where the severing began, but where?**

  I wake to red dust drifting through cold air.
  My lip is nicked; my tooth still holds its ache.
  I search for where the severing began, but where?
  **I feel no severing, no final break.**

  My lip is nicked; my tooth still holds its ache.
  **I flinch, recalling my old father’s tone.**
  **I feel no severing, no final break –**
  **The gap is seamless as a knife on stone.**

  I flinch, recalling my old father’s tone.
  **The childhood memories are sharp and clear.**
  **The gap is seamless as a knife on stone.**
  **Was I extinguished, born anew right here?**

  The childhood memories are sharp and clear.
  I know that room, the cold, the fading sound.
  Was I extinguished, born anew right here?
  **The question turns itself around and round.**

  I know that room, the cold, the fading sound.
  **A thread of self endures across the void.**
  **The question turns itself around and round –**
  **The self is not a fact, but made, employed.**

  A thread of self endures across the void.
  **I feel the chill seep deep, anticipate.**
  **The self is not a fact, but made, employed.**
  **I lie down on the scanner’s cold, hard plate.**

  ---

  ## Why this works for your Parfit presentation

  1.  **The Pantoum Form:** The echoing lines embody the "carrying forward" of psychological states (memories, dispositions, physical markers) Parfit emphasizes. The circular closure mirrors the indeterminacy – the question loops back without a definitive answer.
  2.  **The Copy's Voice:**
      *   **Specific Memories:** It recalls the scanner's cold plate, the countdown, the anticipation of "nothing" (vaporization), and waking on Mars ("red dust drifting through cold air").
      *   **The Missing Gap:** Stanza 3 explicitly states "I feel no severing, no final break" and searches for the severing point "but where?". Stanza 4 calls it "seamless as a knife on stone," emphasizing the lack of experiential discontinuity.
      *   **Continuity of What Matters:** It notes the nicked lip, the sore tooth (Stanza 3), the flinch at the father's voice (Stanza 4), and sharp childhood memories (Stanza 5) – *all functioning as its own memories and experiences.* This is presented matter-of-factly, not horrifically.
      *   **The Indeterminate Question:** Stanzas 5 & 6 directly pose the existential question ("Was I extinguished, born anew right here?") but show it as unresolvable ("The question turns itself around and round").
      *   **Parfit's Conclusion:** The core philosophical point lands clearly in Stanza 6: "A thread of self endures across the void" (psychological continuity) and crucially, "**The self is not a fact, but made, employed.**" This directly reflects Parfit's reductionist view – identity isn't a deep further fact, but consists in these connected mental states and events. The horror is replaced by understanding what *actually* persists and matters.
  3.  **Accessibility:** The sensory details (cold, dust, sound) and concrete memories (nicked lip, father's tone) ground the abstract philosophy, making it tangible for everyone, while the deeper resonance is there for the Parfit scholars. The final stanza crystallizes the key takeaway clearly.

  This poem should provide the perfect reflective capstone to your presentation, encapsulating Parfit's nuanced argument about identity, survival, and what matters in a form that embodies its very structure. Good luck!
