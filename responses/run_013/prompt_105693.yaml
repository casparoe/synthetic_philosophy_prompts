  First, I need to unpack the key elements of the debate. The self-defeat objection from realists argues that if illusionism claims all phenomenal consciousness is an illusion, then the illusion itself must be experienced by someone, thus presupposing phenomenal consciousness. Illusionists counter that this objection assumes the existence of phenomenal consciousness, which is precisely what they're denying. They propose that introspection involves representations that misrepresent physical states as having phenomenal properties, but these representations aren't themselves phenomenally conscious.

  The user's hypothesis about two intertwined disputes seems plausible. The verbal aspect concerns whether the folk concept of "phenomenal consciousness" refers to anything real. Illusionists like Dennett or Frankish might argue the concept is incoherent, while realists like Chalmers see it as referring to a fundamental aspect of reality. The substantive dispute is about explanatory goals: whether a complete physicalist theory must explain why we feel like we have phenomenal experiences (the seeming) or merely why we report and judge that we do (the meta-problem).

  I should also address the triad of phenomenal properties, concepts, and beliefs. Realists distinguish these, saying we can have accurate concepts and beliefs about real phenomenal properties. Illusionists collapse this, arguing that what we call phenomenal properties are just the contents of introspective representations—misrepresentations of neural states.

