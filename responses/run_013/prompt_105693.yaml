answer: |-
  Your analysis is perceptive: the illusionism debate *is* fundamentally stalled by a conflation of two distinct disputes under the banner of "phenomenal consciousness." Let's dissect the arguments, diagnose the impasse, and explore prospects for progress.

  ## Engaging the Core Arguments

  1.  **The Self-Defeat Objection (Realist):**
      *   **Claim:** Illusionism asserts that phenomenal consciousness (PC) doesn't exist, only *representations* or *judgments* that we have it. But for there to *be* an illusion *of* PC, there must be *something it is like* to be under that illusion – a seeming, an appearance, a phenomenal state *of being appeared to*. Denying PC while affirming the illusion therefore refutes itself.
      *   **Realist Premise:** This relies on the core intuition that "seeming" or "appearance" is *irreducibly phenomenal*. An illusion *just is* a kind of phenomenal state (e.g., the Müller-Lyer lines *look* unequal). To deny PC is to deny that anything *seems* any way, including seeming illusory.

  2.  **The Illusionist Rebuttal:**
      *   **Claim:** The self-defeat objection *presupposes* that "seemings," "appearances," or "illusions" *must* be phenomenal. Illusionists argue this is question-begging. They offer an alternative account:
          *   **Introspective Misrepresentation:** Introspection is a cognitive process that accesses internal states (neural patterns, sensorimotor loops, etc.). This process systematically *misrepresents* these complex physical/functional states *as* simple, intrinsic, ineffable "qualia" or "raw feels" (PC).
          *   **The Meta-Problem:** The task is to explain *why* we form the *beliefs* and make the *reports* that we have PC. This involves explaining the cognitive mechanisms driving our introspective judgments and linguistic behaviors ("It seems red! It feels pain!") *without* invoking actual PC as the thing judged. Solving the meta-problem *is* explaining the "illusion."
          *   **Denying the Phenomenality of Seeming:** Illusionists (e.g., Dennett, Frankish) explicitly deny that judgments like "It seems red to me" report a *phenomenal seeming*. Instead, they report the *output* of an introspective process – a non-phenomenal cognitive state (a "judgment" or "representation") with the *content* "I am experiencing phenomenal redness," which is false.

  3.  **The Triad: Properties, Concepts, Beliefs:**
      *   **Realist Distinction:** Realists (e.g., Chalmers, Goff, Strawson) insist on separating:
          *   *Phenomenal Properties (PP):* The actual intrinsic qualities of experience (what it's like).
          *   *Phenomenal Concepts (PCs):* Our mental representations *of* PPs (e.g., our concept of "redness-as-experienced").
          *   *Phenomenal Beliefs (PBs):* Judgments employing PCs (e.g., "I am experiencing redness now").
      *   **Illusionist Collapse:** Illusionists (e.g., Frankish) argue:
          *   There *are* no PP.
          *   What we call "PCs" are *not* concepts *of* PP (since there are none). They are either:
              *   Concepts *of* introspective representations/misrepresentations (concepts *of* the illusion).
              *   Or, more radically, the "concept" *just is* the introspective representation itself, whose content is illusory.
          *   PBs are judgments employing *these* concepts/representations, and are therefore systematically false.

  ## Diagnosis: Two Intertwined Disputes

  You are correct. The impasse stems from conflating:

  1.  **The Conceptual/Verbal Dispute: What does "Phenomenal Consciousness" refer to?**
      *   **Realist Position:** The folk concept "phenomenal consciousness" (what-it's-like-ness, qualia) has a *determinate referent*: an intrinsic, private, qualitative aspect of certain physical states. It picks out a real property (PP), even if we struggle to define it precisely.
      *   **Illusionist Position:** The folk concept "phenomenal consciousness" is either:
          *   **Incoherent:** It tries to refer to a property (PP) that cannot exist within a physical world (e.g., intrinsic, non-relational, directly knowable yet ineffable). It fails to refer. (Strong Illusionism).
          *   **Misapplied:** It refers *to* the *content* of introspective misrepresentations (the illusion itself), not to any real property PP. (Weaker Illusionism).
      *   **The Impasse:** Realists hear illusionists denying the undeniable *referent* (PP). Illusionists hear realists insisting on the reality of a *conceptual confusion* or *misrepresentation*. They are arguing past each other about the *semantic content* and *referential success* of the folk concept.

  2.  **The Substantive Dispute: What Must an Explanation of Introspection Accomplish?**
      *   **Realist Demand:** A complete explanation of consciousness *must* explain *why* certain physical processes are *accompanied by* or *constitute* subjective feels (PP). Explaining the mechanisms leading to *reports and judgments* *about* feels (the meta-problem) is necessary but *insufficient*. It leaves the feels themselves unexplained ("The Hard Problem").
      *   **Illusionist Sufficiency Claim:** A complete explanation of consciousness *only* needs to explain the mechanisms that produce *all* observable and reportable behaviors and cognitive states, *including* our persistent *judgments* and *reports* that we have phenomenal feels (solving the meta-problem). There is nothing *else* (i.e., PP) that needs explaining. Explaining the "seeming" *just is* explaining the judgments about seeming. Demanding more is demanding an explanation for something that doesn't exist.
      *   **The Impasse:** Realists see the illusionist "explanation" as fundamentally incomplete, missing the explanandum (PP). Illusionists see the realist demand as asking for an explanation of a non-existent ghost. This reflects a deep divergence in **explanatory standards** and **ontological commitments**. Is "seeming" an explanandum requiring a non-functional explanation (Realism), or is it *exhausted by* the functional/cognitive processes the illusionist explains?

  **Is it Bedrock Intuition?**
  Yes, partially. The realist intuition that *seeming* is irreducibly phenomenal feels bedrock to them. The illusionist intuition that demanding an explanation for PP *beyond* explaining the cognitive mechanisms generating all relevant behaviors and reports is incoherent or unscientific also feels bedrock. These intuitions shape their respective starting points and standards for explanation.

  ## Prospects for Progress

  Progress is difficult but not impossible. It requires addressing *both* disputes:

  1.  **Resolving/Clarifying the Conceptual Dispute:**
      *   **Conceptual Analysis:** More rigorous analysis of the folk concept(s) of consciousness. Are there multiple concepts? Is the core concept coherent? Work in experimental philosophy (X-Phi) surveying folk intuitions could be relevant, though contested.
      *   **Referential Grounding:** Can realists provide a non-question-begging account of *how* PP is referred to, avoiding the charge that PCs are empty? Can illusionists provide a convincing positive account of what introspective representations *do* refer to (neural states? functional roles? nothing?) without collapsing into eliminativism about subjective perspective?
      *   **Progress Sign:** A mutually agreed-upon *disambiguation* of key terms ("phenomenal," "seeming," "illusion," "reference") and a clearer map of *where exactly* their concepts diverge. Acceptance that "phenomenal consciousness" means fundamentally different things to each side.

  2.  **Resolving/Advancing the Substantive Dispute:**
      *   **Empirical Advances:** Neuroscience and AI progress *could* shift the burden.
          *   If neuroscience identifies mechanisms for introspective reports/judgments that seem *radically discontinuous* with the way we subjectively describe PC (e.g., showing reports are highly constructed, delayed, error-prone, and dissociable from other processes in ways that challenge the "simple givenness" of PP), this strengthens illusionism.
          *   Conversely, finding neural correlates that resist functional/computational explanation *and* map tightly to subjective reports *might* (controversially) nudge towards realism, though the Hard Problem remains.
          *   Development of sophisticated artificial systems that produce *all* the relevant reports and behaviors without any plausible substrate for PP (e.g., based purely on predictive processing) could make illusionism more empirically plausible.
      *   **Formal/Modeling Advances:** Developing rigorous formal models of "representation," "introspection," and "judgment" *without* invoking phenomenal properties. Can illusionists provide a complete, non-phenomenal account of the *authoritativeness* or *immediacy* that characterizes introspective reports? Success here would pressure realists.
      *   **Progress Sign:** Either side successfully shifting the burden of proof. E.g., Illusionists developing a demonstrably complete cognitive model of introspection/judgment that realists concede *would* explain everything *except* PP, forcing the debate solely onto the existence of PP. Or realists successfully arguing that even the *most complete* physical/functional model *necessarily* leaves out the subjective aspect, making illusionism explanatorily deficient.

  3.  **Why Progress Might Remain Elusive:**
      *   **Bedrock Intuitions:** The core intuitions about "seeming" and explanatory sufficiency may be incommensurable starting points.
      *   **Moving Goalposts:** Realists might always argue that *any* physical/functional explanation only addresses mechanisms leading to *judgments*, not the *seeming* itself. Illusionists might always argue that explaining the judgments *is* explaining the seeming.
      *   **The Meta-Problem Trap:** Solving the meta-problem brilliantly might convince many *it's sufficient*, but realists will maintain it misses the point. Failure to solve it keeps realism appealing.
      *   **The Hard Problem's Resilience:** As long as the Hard Problem is seen as distinct and unanswered, realism retains a foothold. Illusionism's core move is to dissolve it by denying its presupposition (PP), which realists reject.

  ## Conclusion

  Your diagnosis is accurate: the stalemate arises because illusionists and realists are engaged in **two distinct but intertwined disputes:** a **conceptual/verbal dispute** about the reference and coherence of the folk concept "phenomenal consciousness," and a **substantive dispute** about **explanatory sufficiency** (must we explain PP, or only the reports/judgments about PP?). The self-defeat objection and the meta-problem strategy highlight this divide. The former assumes the phenomenal nature of seeming, the latter denies it. The triad of properties/concepts/beliefs is where the conceptual confusion manifests most clearly.

  **Progress requires tackling both fronts:** Conceptual clarification to minimize talking past each other, and empirical/modeling advances to shift the burden of proof on the substantive question of explanation. While complete resolution is hampered by potentially bedrock intuitions, incremental progress is possible through rigorous philosophy, neuroscience, and modeling. The most likely "progress" might be a clearer mutual understanding of the *nature* of the disagreement itself, leading to a more structured, less repetitive debate, even if ultimate agreement remains out of reach. Expecting the impasse to completely vanish is unrealistic, but expecting the debate to evolve beyond its current circularity is reasonable.
