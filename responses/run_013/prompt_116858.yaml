prompt: |-
  I'm a philosophy graduate student putting together the opening handout for a mixed reading group on science and pseudoscience — half the room is philosophy students, the other half working physicists and a science journalist — so the instrument has to be usable by someone who has never opened a book on the demarcation problem. Last week I got into an argument with a friend who flatly declared homeopathy "unscientific," and I found I couldn't justify the claim without already assuming the conclusion, which is what sent me here. Take the role of a philosopher of science who has taught this material for years and who is bored with the standard textbook menu of falsifiability, paradigms, research programmes, and "the problem is dead." I want a decision tree that sorts a reader from a few commitments about what the question is even asking into a named position on how — and whether — to separate science from pseudoscience. Work carefully, and before you build anything, spend a short paragraph mapping the logical space: tell me which axes you take it to have and why you chose those axes rather than the more obvious one of "which criterion do you favour?"

  The branching should be driven by the structure of the question, not by a list of famous names. So, for instance: what is the demarcation meant to apply to — individual claims, whole theories, a sequence of theories, methods, the practices of a community, or the institutions that certify knowledge? Is the criterion supposed to be a definition, a single necessary and sufficient condition, or a cluster or family-resemblance judgment in which no one condition is necessary? Is it descriptive of what the word "science" has actually tracked, or normative, telling us what deserves the name? And when a practice fails the test, does the verdict carry epistemic force (the practice is not a route to knowledge at all) or only pragmatic and institutional force (it should not be funded, taught as science, or admitted as evidence)? Keep every branch node a question a reader can answer without already knowing where it leads — no node should be answerable only by someone who has already worked out which label they would receive.

  Then place the leaves, and make sure at least these views appear somewhere: naive falsificationism; a view on which falsifiability is not a logical property of a theory at all but a methodological decision about which statements to hold immune from revision; the research-programme view on which the unit of appraisal is a series of theories judged progressive or degenerating over time; the view on which the unit is a community's problem-solving activity, so that "scientific" describes a practice in good working order rather than a theory's logical form; a multi-criterion or cluster view with a weighted list and no single necessary condition; a view on which "pseudoscience" is an evaluative, thick concept doing mainly rhetorical or political work, so the project should be reconceived or abandoned; a view on which the real distinction is not between theories but between inquirers, between those who are honest and responsive to evidence and those who are not; and a view on which there is no epistemically interesting distinction at all but the word still earns its keep as a rough social label. Use these cases as branch material, at least: astrology's habit of absorbing failed predictions by appeal to unspecified further influences; a speculative physics proposal that is currently unfalsifiable yet treated by its own practitioners as continuous with respectable science; homeopathy, whose advocates run controlled trials, a method shared with the sciences, while the theory behind it resists testing; and a case in which the label "pseudoscience" looks like it is doing social or institutional work rather than epistemic work. Each leaf should carry the name of the view (or "unnamed" if you think nobody defends it) and one sentence on its most awkward commitment. Flag any pair of leaves your tree cannot separate and say why. Mark the combinations of answers that no position occupies and diagnose each one: is that branch empty because the combination is incoherent, because it is unattractive, or merely because nobody has bothered?

  Give me seven to nine branch nodes and six to ten leaves, laid out as an indented text flowchart with each branch labelled by the question that splits it, followed by two or three sentences of commentary on which axis does the most work. Please leave out citations, reading lists, and dates — I have no interest in who said what, and neither will my readers; label the views by their content, and if you want to attach a standard label such as "sophisticated falsificationism" that is fine, but do not attribute a view to a person unless you are certain of the attribution, and never guess at a title or a year.
reasoning: |-
  Hmm, this is a fascinating request from a philosophy graduate student designing a demarcation decision tree. They need a tool that works for both philosophy students and science professionals without prior expertise. The key challenge is avoiding circular reasoning while covering diverse views on what makes something "scientific."

  First, I need to map the logical space beyond just "which criterion?" The core axes should be:
  - Unit of analysis (claims/theories/methods/practices)
  - Nature of criterion (definition/cluster/procedural)
  - Purpose (descriptive/normative)
  - Consequences (epistemic/pragmatic)

  These capture deeper philosophical tensions. For example, falsificationism focuses on theories, while Kuhn looks at practices. The normative/descriptive split explains why some see demarcation as prescriptive (what should count) versus descriptive (what historically counted).

  For branching structure:
  Start with the fundamental "what are we demarcating?" question. This branches into theory-focused vs practice-focused paths. Then probe whether the criterion is binary or gradient. The third critical node asks about purpose - is this about truth-tracking or social legitimacy? Later branches handle edge cases like homeopathy (shared methods but suspect theories) to force confrontation with inconsistencies.

  The leaves must include all requested views. For instance:
  - Naive falsificationism will emerge from "theory" + "binary criterion" path
  - The cluster view appears under "gradient evaluation"
  - The "thick concept" view branches from social consequences

  Special attention needed for cases like:
  - Homeopathy: when methods appear scientific but theory doesn't
  - Speculative physics: tests the "falsifiable in principle" requirement
  - Astrology: demonstrates theory-protecting maneuvers

  Each leaf gets a blunt "awkward commitment" statement, like falsificationism struggling with unfalsifiable-but-productive theories. Empty branches will be flagged - e.g., "descriptive + epistemic" might be incoherent since descriptions don't inherently carry truth claims.

  The commentary will emphasize how the unit-of-analysis axis does heaviest lifting, as it determines whether we judge isolated statements or whole traditions. This reflects the student's insight that demarcation isn't about picking criteria but understanding what the question even asks.
answer: |-
  Here is a demarcation decision tree focused on the structure of the problem itself. Commentary follows the tree.

  **Logical Space Mapping:**  
  The demarcation question fractures along four primary axes:  
  1. **Unit of Appraisal**: What entity is being evaluated (theory, practice, community, etc.)? This determines *what* is assessed.  
  2. **Nature of Demarcation**: Is it a strict definition, a procedural norm, or a gradient/cluster? This determines *how* criteria apply.  
  3. **Purpose**: Descriptive (tracking historical usage) vs. Normative (prescribing what *should* count)? This reveals the project's goal.  
  4. **Stakes**: Epistemic (truth-tracking capacity) vs. Pragmatic (social/institutional consequences)? This clarifies what hangs on the label.  
  These axes avoid reducing the problem to "which filter?" and instead expose why disagreements arise.  

  ---

  **DECISION TREE**  

  1. **What is the primary target of demarcation?**  
     - **A: Individual claims or theories (isolated propositions)** → **2**  
     - **B: Ongoing practices, methods, or communities** → **5**  

  2. **Can a single, universal logical criterion (e.g., testability) cleanly separate scientific/non-scientific claims?**  
     - **A: Yes, a necessary & sufficient condition exists** → **3**  
     - **B: No, criteria are contextual or multiple** → **4**  

  3. **Is falsifiability (in principle) the core criterion?**  
     - **A: Yes** → **Leaf: Naive Falsificationism**  
       *Awkward commitment:* Must dismiss many working scientific theories (e.g., string theory) as unscientific if currently untestable.  
     - **B: No, another universal criterion (e.g., verifiability, coherence)** → **Leaf: Logical Positivism (unnamed variant)**  
       *Awkward commitment:* Struggles to explain how scientific theories evolve through contradiction (e.g., quantum vs. classical physics).  

  4. **Is demarcation about a theory's current testability or our methodological stance toward it?**  
     - **A: Current testability** → **Leaf: Cluster/Weighted-Criteria View**  
       *Awkward commitment:* Cannot decisively rule out cases like homeopathy (borrows scientific methods while core theory resists testing).  
     - **B: Methodological stance (what we agree to treat as testable)** → **Leaf: Sophisticated Falsificationism**  
       *Awkward commitment:* Allows theorists to indefinitely shield core assumptions (e.g., astrology's "unspecified influences") by revising auxiliary claims.  

  5. **Is "scientific" a label for practices that reliably produce truth, or for communities solving problems effectively?**  
     - **A: Truth-conducive methods** → **6**  
     - **B: Effective problem-solving communities** → **8**  

  6. **Must the practice be empirically testable *now*, or is "testable in principle" sufficient?**  
     - **A: Testable now** → **Leaf: Normative Empiricism**  
       *Awkward commitment:* Excludes speculative but rigorous physics proposals treated as scientific by practitioners despite current untestability.  
     - **B: Testable in principle** → **7**  

  7. **Does failing demarcation imply the practice is *epistemically bankrupt* or merely *pragmatically problematic*?**  
     - **A: Epistemically bankrupt (not truth-conducive)** → **Leaf: Epistemic Authority View**  
       *Awkward commitment:* Must explain why some pseudosciences (e.g., homeopathy) occasionally produce true predictions via placebo studies.  
     - **B: Pragmatically problematic (wasteful/misleading)** → **Leaf: Institutional Boundary-Work**  
       *Awkward commitment:* Admits "pseudoscience" is a social tool (e.g., excluding rivals from funding) without inherent epistemic meaning.  

  8. **Should we judge practices by their historical trajectory or current state?**  
     - **A: Historical trajectory (progress/decline)** → **Leaf: Research-Programme View**  
       *Awkward commitment:* Tolerates "degenerating" programs (e.g., astrology) indefinitely if they retain community support.  
     - **B: Current problem-solving effectiveness** → **9**  

  9. **Is demarcation about the *community's behavior* or the *institutional structures*?**  
     - **A: Community behavior (responsiveness to evidence)** → **Leaf: Virtue Epistemology Approach**  
       *Awkward commitment:* "Pseudoscience" labels dishonest actors, not theories (e.g., a fraudulent climate scientist is "unscientific" but climate science isn't).  
     - **B: Institutional structures** → **Leaf: Social-Institutional View**  
       *Awkward commitment:* Separates "science" from "pseudoscience" based on power dynamics (e.g., who controls journals), risking relativism.  
     - **C: Neither—the distinction is obsolete or purely rhetorical** → **Leaf: Abolitionism/Thick Concept View**  
       *Awkward commitment:* Must explain why "pseudoscience" remains a potent criticism if it lacks epistemic content.  

  ---

  **Unseparated Leaves**:  
  - **Cluster View (4A)** and **Sophisticated Falsificationism (4B)** both handle homeopathy ambiguously but diverge on whether criteria are static (4A) or dynamic (4B).  
  - **Institutional Boundary-Work (7B)** and **Social-Institutional View (9B)** overlap but differ in focus: 7B is about consequences, 9B about origins.  

  **Empty Branches & Diagnoses**:  
  - **A→3B→[Demand for alternate universal criterion]**: *Unattractive*. Positivism’s collapse made single-criterion approaches beyond falsifiability rare.  
  - **B→6→[Testability demand for practices]**: *Incoherent*. Practices aren’t "testable"; their *outputs* are. Branch 6 only coherent via reinterpretation.  
  - **A→2B→4→[No further split on purpose/stakes]**: *Unoccupied*. Most theory-focused views after 2B imply normative epistemic stakes; no purely descriptive cluster view exists because "science" as used isn’t a cluster.  

  **Commentary**:  
  The **Unit of Appraisal** axis (Q1) does the heaviest lifting. It splits the logical space into incompatible paradigms: theory-focused approaches (A-path) demand criteria about *content* or *form*, while practice-focused approaches (B-path) demand criteria about *activity* or *social dynamics*. This exposes why falsificationists and Kuhnians talk past each other—they aren’t demarcating the same thing. The **Purpose** axis (implicit in Q5/Q7/Q9) is secondary but vital, revealing whether demarcation is about knowledge (epistemic) or resource allocation (pragmatic). Cases like homeopathy or institutional boundary-work force confrontations between these axes, showing why no "neutral" solution exists.
