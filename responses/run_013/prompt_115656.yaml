  However, it is weakly dominated: by (0.5,0.5) because they have the same score at every world. But weak domination means that the dominating function is at least as good in every world and strictly better in at least one world. Here, they are equal in every world, so it is not weakly dominated either. (Weak domination requires at least as good in every world and strictly better in at least one.) Since they are equal in every world, (0.5,0.5) does not weakly dominate (2,2).

