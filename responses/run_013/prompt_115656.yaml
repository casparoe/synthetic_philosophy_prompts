     The failure is a failure of strict propriety, not truth-directedness. The scoring rule is truth-directed.

   (3) Now, replace with the Brier score.

     Brier score for two cells:
        at Heads: - (c1-1)^2 - (c2-0)^2 = - (c1-1)^2 - c2^2
        at Tails: - (c1-0)^2 - (c2-1)^2 = - c1^2 - (c2-1)^2

     For the deviant function (2,2):
