  ### Case Against the Straightforward Accuracy-Dominance Argument for Probabilism

  I'll use a two-cell partition: {Heads, Tails}. We'll define a scoring rule that is truth-directed and proper but not strictly proper, and then demonstrate a non-probabilistic credence function that avoids strict dominance. The deviant function is \(d = (2, 2)\) (credence 2 for Heads, 2 for Tails), which violates the probability axioms as it assigns values above 1 and sums to 4.

  #### Step 1: Scoring Rule Definition and Scores
  We use the **spherical scoring rule**:
  - For credence function \(c = (c_1, c_2)\) (where \(c_1\) is credence in Heads, \(c_2\) in Tails):
    - At Heads: \(S(c, \text{Heads}) = \frac{c_1}{\sqrt{c_1^2 + c_2^2}}\)
    - At Tails: \(S(c, \text{Tails}) = \frac{c_2}{\sqrt{c_1^2 + c_2^2}}\)
  - If \(c_1 = c_2 = 0\), define \(S = 0\) (to avoid division by zero).

  This rule is:
  - **Truth-directed**: At Heads, maximum score 1 is achieved when \(c_1 = 1, c_2 = 0\). Similarly for Tails.
  - **Proper but not strictly proper**: For a probability function \(p = (p, 1-p)\), any positive scalar multiple (e.g., \(\lambda p, \lambda(1-p)\) for \(\lambda > 0\)) maximizes expected score. Thus, maximizers are not unique.

  **Scores for \(d = (2, 2)\)** and the probabilistic function \(p = (0.5, 0.5)\):

  | Credence Function | World: Heads | World: Tails |
  |-------------------|--------------|--------------|
  | \(d = (2, 2)\)   | \(\frac{2}{\sqrt{2^2 + 2^2}} = \frac{2}{\sqrt{8}} = \frac{\sqrt{2}}{2} \approx 0.707\) | \(\frac{2}{\sqrt{8}} = \frac{\sqrt{2}}{2} \approx 0.707\) |
  | \(p = (0.5, 0.5)\) | \(\frac{0.5}{\sqrt{0.5^2 + 0.5^2}} = \frac{0.5}{\sqrt{0.5}} = \frac{\sqrt{2}}{2} \approx 0.707\) | \(\frac{0.5}{\sqrt{0.5}} = \frac{\sqrt{2}}{2} \approx 0.707\) |

  **Analysis**:
  - \(d\) and \(p\) have identical scores at all worlds: \(\approx 0.707\).
  - Thus, \(p\) does not dominate \(d\): It does not score at least as well as \(d\) in all worlds and strictly better in some. In fact, no alternative dominates \(d\):
    - Weak dominance fails: No function matches/exceeds \(d\) in all worlds and exceeds in at least one (proof: If a function exceeded \(d\) at Heads, we'd have \(\frac{d_1}{\|d\|} > \frac{\sqrt{2}}{2}\), implying \((d_1/\|d\|)^2 > 0.5\). Similarly for Tails. Sum of squares would exceed 1, violating \(\|d\| = \sqrt{d_1^2 + d_2^2}\)).
    - Strict dominance fails: As above, and since scores are bounded above by 1.
  - **Implication**: The dominance argument stalls because \(d\) is not strictly or weakly dominated. The argument relies on strict dominance to rule out non-probabilism. Here, it fails to do so, though it still ensures that some probabilistic function (like \(p\)) is at least as good as \(d\) everywhere.

  #### Step 2: Identifying the Key Feature
  - **Feature causing failure**: Lack of **strict propriety**.
  - **Explanation**: The spherical rule is proper but not strictly proper. For \(p = (0.5, 0.5)\), any \(c = (\lambda \cdot 0.5, \lambda \cdot 0.5)\) (\(\lambda > 0\)) maximizes expected score. Thus, distinct credence functions (like \(d = (2, 2)\) and \(p = (0.5, 0.5)\)) have the same score at every world. Truth-directedness holds, but strict propriety fails.
  - **Failure mode**: The argument stalls because non-probabilistic functions can match probabilistic ones everywhere.

  #### Step 3: Switch to Brier Score
  Use the **Brier score** (strictly proper and truth-directed):
  - At Heads: \(S(c, \text{Heads}) = -(c_1 - 1)^2 - (c_2 - 0)^2\)
  - At Tails: \(S(c, \text{Tails}) = -(c_1 - 0)^2 - (c_2 - 1)^2\)

  **Scores for \(d = (2, 2)\) and \(p = (0.5, 0.5)\)**:

  | Credence Function | World: Heads | World: Tails |
  |-------------------|--------------|--------------|
  | \(d = (2, 2)\)   | \(-(2-1)^2 - (2)^2 = -1 - 4 = -5\) | \(-(2)^2 - (2-1)^2 = -4 - 1 = -5\) |
  | \(p = (0.5, 0.5)\) | \(-(0.5-1)^2 - (0.5)^2 = -0.25 - 0.25 = -0.5\) | \(-(0.5)^2 - (0.5-1)^2 = -0.25 - 0.25 = -0.5\) |

  - \(p\) strictly dominates \(d\):
    - At Heads: \(-0.5 > -5\)
    - At Tails: \(-0.5 > -5\)
  - **Dominating function**: The probabilistic function \(p = (0.5, 0.5)\) strictly dominates \(d = (2, 2)\).

  #### Step 4: Expected-Accuracy Route
  - **Question**: Can the expected-accuracy argument (maximizing expected accuracy from the credence function's own perspective) rule out \(d\)?
  - **Answer**: No. Using the spherical rule:
    - Normalize \(d = (2, 2)\) to a probability function: \(d_{\text{norm}} = (2/(2+2), 2/(2+2)) = (0.5, 0.5)\).
    - Expected accuracy of announcing \(c\) under \(d_{\text{norm}}\):  
      \[
      \mathbb{E}_d[S(c)] = 0.5 \cdot \frac{c_1}{\|c\|} + 0.5 \cdot \frac{c_2}{\|c\|} = 0.5 \cdot \frac{c_1 + c_2}{\sqrt{c_1^2 + c_2^2}}.
      \]
    - For \(c = d = (2, 2)\): \(\mathbb{E}_d[S(d)] = 0.5 \cdot \frac{4}{\sqrt{8}} = 0.5 \cdot \sqrt{2} \approx 0.707\).
    - This is maximal (any scalar multiple of \((0.5, 0.5)\) achieves the same). Thus, \(d\) maximizes expected accuracy from its own perspective.
  - **Conclusion**: The expected-accuracy route fails to rule out \(d\), as it does not require strict propriety.

  #### Step 5: Defense and Reply
  - **Strongest reply**: Insist that **epistemic utility must be strictly proper**.
    - **Argument**: Accuracy should uniquely identify rational credences. A non-strictly proper rule (like spherical) permits distinct functions to be equally accurate everywhere, violating the idea that accuracy measures "closeness to truth" precisely. Only strictly proper rules (e.g., Brier) ensure that probabilistic functions are uniquely rational.
  - **Does this save the argument?**  
    - **Yes, but narrows scope**: If we require strict propriety, the dominance argument is sound. Non-probabilistic functions are strictly dominated (as with Brier). However, this restricts the argument to strictly proper rules.
  - **Counter-replies and assessment**:
    - **Settle for weak dominance?** In this case, \(d\) is not even weakly dominated, so weak dominance fails too.
    - **Merely proper rules aren't accuracy measures?** One might argue that spherical scoring isn't a genuine accuracy measure since it normalizes credences, ignoring absolute magnitudes (e.g., \((2, 2)\) and \((0.5, 0.5)\) are treated identically). However, truth-directedness holds, and propriety ensures coherence with expected utility. Rejecting it as an accuracy measure is contentious.
    - **Conclusion**: The strongest defense is to mandate strict propriety, ensuring the argument works but limiting its scope to strictly proper scoring rules. This highlights that the dominance argument is not self-sufficient—it depends on substantive assumptions about epistemic utility. Without strict propriety, it stalls.

  ### Summary for Whiteboard
  1. **Setup**: 2-cell partition {Heads, Tails}.  
     - **Deviant function**: \(d = (2, 2)\).  
     - **Scoring rule (spherical)**:  
       - \(S(c, \text{Heads}) = \frac{c_1}{\sqrt{c_1^2 + c_2^2}}\),  
         \(S(c, \text{Tails}) = \frac{c_2}{\sqrt{c_1^2 + c_2^2}}\).  
     - **Scores**: \(d\) and \(p = (0.5, 0.5)\) both score \(\approx 0.707\) everywhere.  
     - **Dominance fails**: No function dominates \(d\).  

  2. **Failure cause**: Scoring rule is proper but not **strictly proper**. Truth-directedness holds.  

  3. **Switch to Brier**:  
     - \(S(c, \text{Heads}) = -(c_1 - 1)^2 - c_2^2\),  
       \(S(c, \text{Tails}) = -c_1^2 - (c_2 - 1)^2\).  
     - **Scores**: \(d\) scores \(-5\) everywhere, \(p\) scores \(-0.5\) everywhere.  
     - \(p\) **strictly dominates** \(d\).  

  4. **Expected accuracy**: Fails—\(d\) maximizes its own expected accuracy under spherical scoring.  

  5. **Defense**: Insist on **strict propriety** for epistemic utility. Saves the argument but narrows scope.
