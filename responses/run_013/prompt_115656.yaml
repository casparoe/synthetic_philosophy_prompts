     The deviant function (2,2) is not a probability function. Let's assume the agent has this as their credence. But we must interpret what it means. Typically, in the expected accuracy argument, we require the agent to have a probability function to take expectations. But if the agent has a non-probability function, they might not have a coherent expectation.

     However, we can still compute the expected spherical score from the perspective of (2,2). But (2,2) is not additive: 2+2=4, not 1. So we have to normalize? 

     The spherical scoring rule is defined for any non-negative credence function (we can allow negative? But typically not. In our case, (2,2) is non-negative). But the spherical score for a world is the normalized credence. To compute expected score, the agent has to have a probability distribution over worlds. But (2,2) does not give a probability because 2+2=4. So we can normalize it to a probability distribution: (2/4, 2/4) = (0.5,0.5).

     Then the expected spherical score for an announcement (d1,d2) would be:
          0.5 * [d1/sqrt(d1^2+d2^2)] + 0.5 * [d2/sqrt(d1^2+d2^2)]
          = 0.5 * [ (d1+d2) / sqrt(d1^2+d2^2) ]

     The deviant function (2,2) gives: 0.5 * [ (2+2) / sqrt(4+4) ] = 0.5 * (4/sqrt(8)) = 0.5 * (4/(2sqrt(2))) = 0.5 * (2/sqrt(2)) = 0.5 * sqrt(2) = sqrt(2)/2 ≈0.7071.

     Now, is there a credence function (d1,d2) that has a higher expected score than 0.7071? The maximum possible for the spherical score for any (d1,d2) is when (d1,d2) is in the direction of the true probabilities (0.5,0.5), and the score is sqrt(0.5^2+0.5^2) = sqrt(0.5)=sqrt(2)/2, which is the same as what we got for (2,2). So (2,2) is not dominated in expected score from its own perspective by any other credence function. In fact, it is at the maximum.

     Therefore, the expected-accuracy route does not pick up the slack: the non-probability function (2,2) is not dominated in expected accuracy from its own perspective.

   (5) Defense: the strongest reply is to insist that epistemic utility must be strictly proper. The argument for this is that if the scoring rule is not strictly proper, then there are distinct credence functions that are equally accurate at every world, which is not desirable for an epistemic utility function because it means that accuracy considerations do not distinguish between them. Furthermore, in the spherical scoring rule, the magnitude of the credences does not matter, only the direction. But one might argue that the magnitude is not part of the agent's genuine confidence but rather an artifact of scaling. However, the probability axioms require the credences to be in [0,1] and sum to 1. The spherical scoring rule does not respect the summing to 1, but only the ratios.

     If we require that epistemic utility functions be strictly proper, then the dominance argument goes through. So this reply narrows the scope of the dominance argument to strictly proper scoring rules, but then it is sound for those rules.

     Alternatively, one could settle for weak domination. However, in this case, the deviant function is not even weakly dominated. So that doesn't help.

     Another reply: argue that a merely proper rule is not a measure of accuracy at all. One might contend that accuracy should be sensitive to the agent's actual credence values, not just their relative sizes. In the spherical rule, if an agent assigns 2 and 2, that is not really a measure of their confidence in the same way as 0.5 and 0.5. The values 2 and 2 are not on the same scale as the truth values (0 and 1). Therefore, the spherical scoring rule is not a good measure of accuracy. The Brier score, on the other hand, penalizes distance from the truth value, which is 0 or 1.

     This reply has some force: the spherical rule is not linear in the credence values, and it normalizes, which might not be intuitive. In contrast, the Brier score is a natural extension of the squared error to multiple cells.

     If this reply is accepted, then only scoring rules that are strictly proper and also truth-directed (and perhaps continuous, and strictly convex) are legitimate measures of accuracy. This would save the dominance argument, but it would be by narrowing the scope to such rules.

     In summary, the dominance argument for probabilism can be maintained by insisting on strictly proper scoring rules, and the spherical scoring rule example shows that without strict propriety, the argument fails. But if we require strict propriety, then the argument works.

     The spherical scoring rule example thus shows that the accuracy-dominance argument for probabilism requires more than truth-directedness and propriety; it requires strict propriety. The argument remains sound for strictly proper scoring rules.

