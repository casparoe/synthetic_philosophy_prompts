        at Heads: - (1-1)^2 - (1)^2 = 0 - 1 = -1
        at Tails: - (1)^2 - (1-1)^2 = -1 -0 = -1

     This is also better than (2,2) at both worlds (-1 > -5). But is there a function that has a score greater than -5 at both and at least one strictly greater?

     In fact, (0.5,0.5) already strictly dominates (2,2) because at every world it is strictly better.

     But to be explicit, (0.5,0.5) has -0.5 at both worlds, which is greater than -5.

     So the Brier score makes (2,2) strictly dominated by (0.5,0.5).

   (4) The expected-accuracy route to probabilism: This route says that if a credence function is not a probability function, then there is a probability function that has higher expected accuracy from the perspective of that very credence function. But in our case, with the spherical scoring rule, the deviant function (2,2) has expected accuracy from its own perspective? 

