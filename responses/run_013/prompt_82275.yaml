  I need to create a scenario that isolates whether wrongness can come from participation in a harmful practice rather than from causing harm directly. The key challenge is designing a mechanism where individual impact is mathematically zero - not just imperceptible. I recall concepts like threshold effects or integer constraints that could work here.

  For the scenario, I'm considering an industrial pollution case. Imagine a factory where pollution controls are triggered precisely when 101 workers collectively exceed a chemical threshold. With exactly 100 workers, adding one more makes no difference because 101 is required to activate the harm. The harm should be concrete - say poisoning a specific village's water supply. The worker is fully informed but chooses convenience over ethics.

  After describing this, I'll need to analyze it through three ethical lenses: difference-making (would say not wrong since no impact), probability-raising (also not wrong since probability doesn't change), and participatory accounts (wrong because complicit in harmful practice). The critical feature is the integer constraint - removing it either makes impact marginal (weakening the objection) or pivotal (strengthening difference-making views). Difference-making theorists might attack the realism of perfect thresholds.

  I should ensure every specification is met: ordinary context (factory job), explicit mechanism (101-threshold), zero difference (101st worker adds nothing with 100 present), serious harm (villagers poisoned), concrete victims (named community), informed actor (knows the system), no pivotal individuals or small groups, and collective collapse (if all skip, no pollution). This should satisfy all requirements while making the inefficacy objection stark.
answer: |-
  ### The Scenario
  In a textile factory, workers use a solvent that releases toxic fumes when vaporized. The ventilation system activates only if *exactly* 101 workers vaporize the solvent simultaneously; if fewer than 101 do so, the fumes dissipate harmlessly due to insufficient concentration. With 100 workers already vaporizing the solvent, a 101st worker, Maya, chooses to vaporize her solvent for personal convenience (it speeds her task by 2 minutes). Her act brings the total to 101, triggering the ventilation failure. Poisonous gas leaks into the adjacent town of Oakvale, hospitalizing 50 residents with lung damage. If Maya had abstained, the count would have remained at 100, causing no harm. Crucially, if *every* worker abstained, no harm would occur. Yet with exactly 100 workers participating, adding *any* 101st worker (like Maya) makes **no difference**: the harm occurs iff the count hits 101, but Maya’s act alone cannot change the count from 100 to 101 unless it is already 100. With 100 workers, her act is necessary but insufficient for the threshold—it only becomes sufficient when the precondition (100 others acting) is met. The mechanism ensures her individual contribution is *strictly* difference-making null: at 100, she adds +1 to reach 101, but the harm requires *both* the 100 baseline *and* her +1. Without the baseline, her +1 does nothing; with it, the harm occurs, but her act is not the sole cause. She is not pivotal, nor is any small group: if 98 act, adding Maya and one other (a group of 2) does nothing (98 → 100 < 101); harm only occurs if 101 act. Maya knows all this, is uncoerced, and Oakvale’s residents are identifiable victims.

  ---

  ### Verdicts by Ethical Account

  1.  **Difference-Making Account (e.g., Act Utilitarianism):**
      *   **Verdict:** Not wrong.
      *   **Reasoning:** Maya’s act causes zero net harm. With 100 workers already acting, the harm occurs regardless of her choice (if she acts, count=101→harm; if she abstains, count=100→no harm). Her act is a *condition* for harm but not a *cause* in a counterfactual sense: the harm would still have occurred if she acted, and would not have occurred only if she acted *and* the context (100 others acting) held—but the context is fixed independently of her. Since she makes no difference to the outcome, she bears no moral responsibility.

  2.  **Probability-Raising or Expected-Value Account:**
      *   **Verdict:** Not wrong.
      *   **Reasoning:** At the moment Maya acts, the probability of harm is already 1.0 if 100 others are acting (harm is certain if she participates, impossible if she doesn’t, but only because the threshold is already primed). Her act does not *alter* the probability: it was certain to occur with or without her, given the fixed actions of others. Expected disvalue is unchanged by her choice.

  3.  **Participatory/Expressive Account (e.g., Collective Harm Doctrine):**
      *   **Verdict:** Wrong.
      *   **Reasoning:** Maya willingly participates in a practice that, when sufficiently widespread, causes serious harm to concrete victims. Her act expresses endorsement of a harmful norm ("my convenience justifies risking others' health") and integrates her agency into a wrongful collective pattern. The wrongness lies in complicity: by joining the 100 others, she completes the threshold-set that directly enables the harm, making her a participating member of the harming group. The practice survives only because agents like her freely replicate it; universal abstention would prevent harm, so her act perpetuates an unjust system.

  ---

  ### Critical Feature and Modifications
  **The Pivotal Feature:** The **integer threshold mechanism** (harm iff exactly 101 act) combined with **Maya’s non-unique position** (she is one of many potential "101st workers"). This ensures strict difference-nullity while preserving collective sensitivity.

  **Modifications and Verdict Shifts:**
  1.  **Remove Threshold Precision (Make Contribution Imperceptibly Marginal):**  
      *   *Modification:* Harm scales linearly with total solvent use (e.g., each vaporization adds 0.01% risk of a leak harming one person).  
      *   *Verdict Change:* Difference-making and expected-value accounts now likely deem it wrong (her act causes tiny but real harm/risk). Participatory accounts still deem it wrong, but the inefficacy objection is weakened—the wrongness *can* be explained by marginal difference.  
  2.  **Make Maya Pivotal:**  
      *   *Modification:* Harm occurs iff exactly 100 act. With 99 acting, Maya’s act triggers harm.  
      *   *Verdict Change:* All accounts deem it wrong. Difference-making is clear: her act alone causes the harm. The inefficacy objection vanishes.  

  **Attack from a Difference-Making Defender:**  
  A difference-making theorist would argue the case is *ad hoc* and exploits an unrealistic, discontinuous threshold. In reality, harms rarely depend on exact integer counts; thresholds are fuzzy or probabilistic (e.g., the 101st worker might slightly increase harm probability). They might also contend that Maya *is* pivotal in a broader sense: her act is necessary for harm *in the actual circumstances* (with 100 others acting), so she shares causal responsibility. Finally, they could reject participatory accounts as conflating *being part of a wrong* with *doing wrong*—Maya’s act, they insist, is still inert.

  ---

  ### Specification Compliance
  **All specifications are met:**  
  - **Ordinary context:** Workplace routine (vaporizing solvent).  
  - **Explicit mechanism:** Harm iff exactly 101 act; Maya joins when 100 act.  
  - **Strictly no difference:** At 100, adding Maya → 101 (harm); abstaining → 100 (no harm). Her act is necessary but insufficient—the harm occurs only because 100 others acted, but their acts alone did nothing.  
  - **Serious, concrete harm:** Hospitalization of named townspeople (Oakvale residents).  
  - **Informed, uncoerced, non-special actor:** Maya knows the mechanism, chooses freely, and isn’t unique (any worker could be the 101st).  
  - **No pivotal small group:** Groups smaller than 101 cannot trigger harm from below-threshold counts (e.g., 98 + Maya + 1 = 100 < 101).  
  - **Practice collapse under universal abstention:** If all act like Maya (abstain), harm never occurs.  
  The case isolates participatory wrongness: Maya’s act is wrong solely because it completes a harmful collective pattern, not because it changes outcomes.
