answer: |-
  ## After-Dinner Speech: The Uncomfortable Ghost of Henry Sidgwick

  **(Setting: You stand, glass in hand, slightly informal, addressing a mixed audience after a good meal. Start with a wry, self-aware tone.)**

  Right. So. For those who don’t know me, I’m your resident software engineer and… well, frankly, the token skeptic. How did I end up here? Let’s just call it a cascade of questionable life choices and surprisingly good catering. But here I am. And when they asked me to say a few words tonight, celebrating the revival of this… unique… society, I realised there’s only one honest starting point for me: a dead Victorian philosopher named Henry Sidgwick.

  Not the most obvious dinner companion, I grant you. But Sidgwick wasn’t just any Cambridge don. He was one of the founders, the *first* president, of the original Society for Psychical Research back in the 1880s. The granddaddy of groups like ours. And here’s the thing that hooked me: **He died unconvinced.**

  He didn’t find proof. He didn’t become a believer. But crucially – and this is the bit I find genuinely compelling – he wasn’t a sneering debunker either. For Sidgwick, this stuff wasn’t a parlour game. It wasn’t about spooky stories over port. It was deadly serious. Mortally serious, you might say.

  **(Shift to a slightly more reflective, earnest tone)**

  See, Sidgwick had this massive philosophical problem rattling around his brilliant brain. He looked at human nature through the lens of cold reason, and he saw a fundamental tension. On one hand, reason tells us to look out for Number One – self-preservation, self-interest, seems pretty sensible. On the other hand, reason also pushes us towards ethics, towards caring for others, towards universal justice. The problem? **Those two things don’t always align.** In fact, in a purely material world, where death is final and the universe is indifferent, they can genuinely come apart. Why be good if it costs you everything, and that’s just… it?

  Sidgwick thought the *only* thing that could truly reconcile this – the only thing that could guarantee self-interest and universal ethics ultimately lined up – would be some kind of moral order to the universe. Karma. Divine justice. An afterlife. *Something* beyond the visible horizon. Proof of survival wasn’t a hobby for him. It was **load-bearing architecture** for his deepest worry about how we can live a rational, ethical life.

  **(Lean in slightly, engaging the room)**

  And yet… despite desperately wanting that answer… despite pouring his energy into searching for it… **he refused to fake it.** He looked the abyss of uncertainty in the face and said, “I don’t know.” He held that tension – the desperate need for an answer, and the absolute refusal to pretend he had one – right until the end. That, to me, is intellectual courage of a rare kind.

  **(Shift focus to methodology, nodding towards the app launch)**

  What really resonates with me, as someone who likes systems and data, is *how* he searched. He didn’t just collect ghost stories from eccentric aunts. He and his colleagues went out and did something radical for the time: they ran a *survey*. A huge one. Asked thousands of ordinary people – seventeen thousand, I think? – incredibly specific questions. Had they ever had a vivid hallucination? Did it coincide with someone’s death far away? The idea was revolutionary: **apply boring, systematic, numerical rigour to the weirdest corners of human experience.** Instead of swapping unverifiable anecdotes, try to get actual data. Count the hits. See if the numbers told a story reason couldn't ignore.

  **(Gesture subtly towards the app being launched)**

  Sound familiar? That’s why tonight, alongside reviving this society, we’re launching this little app. It’s our attempt to channel Sidgwick’s spirit for the smartphone age. Logging coincidences, premonitions, those ‘thinking-of-you’ moments just before the phone rings… systematically. Anonymously. And crucially – and Sidgwick would have *loved* this bit – **we’ve declared upfront, before a single data point hits the server, exactly what we’ll count as a ‘hit’.** No moving goalposts. Just transparency and an attempt, however humble, to bring some order to the chaos of testimony.

  **(Address the room directly, acknowledging the split)**

  So, what would Henry Sidgwick make of us? Of this room, half of you quietly hoping this app, this society, might finally offer a glimpse through the veil… and the other half, like me, here for the conversation (and yes, the food), ready to pounce on any whiff of soft thinking?

  **(Hold the tension)**

  He wouldn’t give you easy comfort. He wouldn’t pat the believers on the back and say, “Yes, it’s all true.” He wouldn’t give the skeptics ammunition and say, “It’s all bunk.” He’d probably make us *all* deeply uncomfortable. Because he’d demand the same thing from both sides: **Brutal honesty and relentless rigour.**

  To those with experiences you can’t explain: He’d ask you to submit them to the cold light of methodology. Not to diminish them, but to *test* them. To see if they stand up. He’d tell you your experiences are data points, precious but needing context. Don’t just cherish the mystery – help us *interrogate* it.

  To the skeptics, myself included: He’d remind us that dismissing the question outright is just as lazy as believing every rumour. That the ethical dilemma he wrestled with – how can reason and morality co-exist in a purely material world? – is still profound. It *matters*. Turning away because it’s weird isn't reason; it’s cowardice. Show up. Engage. Test. Demand high standards, absolutely – but *participate*.

  **(Raise your glass slightly)**

  Henry Sidgwick died not knowing. He held the biggest questions of life, death, and meaning in his hands, stared at them with unflinching honesty, and admitted he couldn’t solve them. But he never stopped thinking it was worth the effort. He never stopped demanding that the search be worthy of the stakes.

  **(Conclude with conviction)**

  So, as we raise a glass to the revival of this society, and to the launch of this little digital echo of Sidgwick’s survey… let’s not toast to easy answers. Or to confirmation bias. Or to comfortable skepticism. Let’s toast to the uncomfortable, rigorous, profoundly *serious* search itself. To holding the tension. To demanding good data. To refusing to fake it, even when we really, really want to know.

  To Henry Sidgwick’s unfinished business. May we pursue it with the same fierce, uncomfortable integrity. Cheers.

  **(Clink glass, smile wryly, sit down.)**
