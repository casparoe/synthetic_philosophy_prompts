prompt: |-
  For most of my life the philosophy of perception was, I am slightly embarrassed to admit, a subject I had filed under interesting but not mine. That changed this spring. I began having brief episodes in which I see things that are not there: a drift of coloured shapes across one side of the visual field, and now and then something that looks for all the world like a familiar object resting on a table. My neurologist says the episodes are harmless and that I should pay them no attention. What I cannot dismiss is the question they have made vivid: while an episode lasts, the experience is, judged from the inside, of just the sort that occurs when I look at something real, and yet I would not dream of treating it as evidence about the room I am standing in. Before I read any more theory I want the specification. Please write the desiderata: what any adequate account of perceptual experience has to deliver if it is to make sense of this, and of the ordinary cases alongside it.

  Give the list in full, with the case or consideration behind each entry. Among the cases: ordinary veridical seeing; seeing something as other than it is, as when a straight stick half in water looks bent; my episodes; after-images and the phosphenes one can produce by pressing on a closed eye; and experiences brought about by direct stimulation of the visual system, which I understand can be indistinguishable, for the subject, from seeing. Among the distinctions the list must not collapse: between the phenomenal character of an experience and its epistemic standing; between what caused an experience and what the experience is; and between the claim that a hallucination is subjectively indiscriminable from a perception and the claim that the two are experiences of one fundamental kind. I want the last two kept firmly apart, since much of the argument I have been reading seems to run them together; and I would like an entry requiring a theory to say what the argument from illusion has going for it without helping itself to the assumption that indiscriminability implies sameness of kind. Say of each entry whether it is a genuine requirement or merely a commitment of one camp, and identify any pair you think cannot be jointly satisfied. The one I keep circling is this: a theory that treats the two experiences as of one kind seems to hand the hallucination the standing of the perception, while a theory that insists they are of different kinds owes an account of why they are indistinguishable from the inside. Tell me which single requirement does the most to eliminate candidate theories, and then, in a few sentences each, how the disjunctive view, the sense-datum view, and the representationalist view fare against the list. One further item to consider including: when an episode begins in a certain way I can sometimes recognise it as an episode while it is still going on, and the experience itself does not seem to me any the less like seeing for that. Add a requirement to cover this if you judge one is needed, and say whether it is a requirement at all or merely an artefact of my attending closely to myself. I do not need a reading list; I want the specification, pitched at the level of cases and constraints rather than slogans.
reasoning: |-
  Okay, the user is asking for a detailed specification of desiderata for any theory of perceptual experience that can account for both their anomalous episodes and ordinary cases of perception. They're clearly highly philosophically literate but want to avoid theoretical jargon in favor of concrete constraints. 

  Hmm, they've done an impressive job of mapping the terrain themselves - listing key cases (veridical, illusion, their episodes, after-images, direct stimulation), crucial distinctions (phenomenal vs epistemic, cause vs content, indiscriminability vs kind-identity), and even identifying their central puzzle about kind-sameness versus discriminability. The level of precision suggests either academic training or serious autodidactic work.

  Ah, their core anxiety seems to be about epistemic security - how can experience feel identical to perception yet command no evidential weight? And they're frustrated by theories that conflate subjective indiscriminability with metaphysical sameness. That's a sophisticated worry - most introductory texts do blur those lines. 

  Right, I should structure this as numbered constraints with explicit case-anchors. Must include: 
  - Their "episode recognition" phenomenon (where experience remains visual despite knowing it's not real) 
  - A specific entry blocking the indiscriminability-to-sameness inference 
  - The three distinctions they named as inviolable 
  - Assessment of which constraint is most theory-lethal (probably the recognition point - it torpedoes simple disjunctivism)

  Notable challenge: Their lived experience of "knowing-it's-unreal-while-it-feels-real" is philosophically precious data. Need to treat it as such rather than dismissing it as "attentional artifact." That phenomenology breaks standard accounts of cognitive penetration.

  When evaluating theories later: 
  - Disjunctivism fails their recognition case spectacularly 
  - Sense-datum can handle indiscriminability but makes perception indirect 
  - Representationalism struggles with non-intentional qualia in their episodes

  Biggest trap to avoid: Don't let the hallucination cases colonize the analysis of perception. Their request for "ordinary cases alongside it" is crucial - this isn't just about pathology.
answer: |-
  Here is the specification of desiderata for an adequate account of perceptual experience, grounded in your cases and constraints. Each entry is marked as a **genuine requirement** (GR) if necessary for any coherent theory, or a **commitment** (C) if tied to specific philosophical camps. Constraints derived from your episodes are noted.

  ### Desiderata (with Case/Consideration)
  1. **Veridicality Accommodation (GR)**  
     *Case*: Ordinary veridical seeing (e.g., seeing a red apple in good light).  
     *Requirement*: Must explain how perceptual experience provides defeasible justification for beliefs about mind-independent objects.

  2. **Illusion Accommodation (GR)**  
     *Case*: Seeing a straight stick half-submerged in water as bent.  
     *Requirement*: Must explain non-veridical experiences *of actual objects* without denying the object’s real properties.

  3. **Hallucinatory Indiscriminability (GR)**  
     *Case*: Your episodes; direct neural stimulation (e.g., prosthetic vision).  
     *Requirement*: Must explain why hallucinations can be subjectively indistinguishable from veridical perceptions *without* implying they share a fundamental metaphysical kind.

  4. **Phenomenal-Epistemic Distinction (GR)**  
     *Case*: All experiences (veridical, illusory, hallucinatory).  
     *Requirement*: Must not collapse the *phenomenal character* (what it’s like to have the experience) and its *epistemic standing* (its justificatory force). Your episodes feel real but warrant no belief.

  5. **Cause-Content Distinction (GR)**  
     *Case*: After-images (caused by eye pressure), phosphenes, neural stimulation.  
     *Requirement*: Must distinguish the *causal origin* of an experience from its *representational content* (e.g., pressing your eye causes an image, but the content isn’t "pressure").

  6. **Indiscriminability ≠ Kind-Identity (GR)**  
     *Case*: Hallucinations indistinguishable from perceptions.  
     *Requirement*: Must allow that two experiences can be subjectively indiscriminable *without* being instances of the same fundamental psychological or metaphysical kind. *Explicitly blocks* conflation in arguments from illusion.

  7. **Recognition Without Phenomenal Shift (GR)**  
     *Case*: Recognizing your episode *as hallucinatory mid-experience*, while it still feels like seeing.  
     *Requirement*: Must explain how cognitive recognition of unreality doesn’t alter the *sensory phenomenology*. (This is a **genuine requirement**, not an artefact: it reveals structural independence between phenomenology and belief).

  8. **Argument from Illusion Construal (GR)**  
     *Case*: Illusions, hallucinations, your episodes.  
     *Requirement*: Must account for the intuition that illusions/hallucinations challenge perceptual realism (e.g., "if non-veridical experiences feel identical, how can we trust perception?") *without* assuming indiscriminability entails kind-identity.

  9. **Non-Intentional Qualia Accommodation (C)**  
     *Case*: Phosphenes, after-images; possibly your "coloured shapes".  
     *Requirement*: Must explain experiences with *non-representational* sensory qualities (e.g., blurry shapes without an "object"). (Commitment: only required if such qualia exist; denied by strong representationalists).

  ---

  ### Tensions & Most Eliminative Requirement
  - **Key Tension**: Requirement 3 (indiscriminability without kind-identity) vs. Requirement 6 (no automatic kind-identity).  
    - *Why hard*: If hallucinations/perceptions differ fundamentally, why can’t we tell them apart? If they share a kind, why does hallucination lack epistemic force?  
  - **Most Eliminative Requirement**: **Requirement 7 (Recognition Without Phenomenal Shift)**. It eliminates:  
    - Theories claiming belief alters phenomenology (e.g., strong cognitivism).  
    - Theories that make epistemic status constitutive of phenomenology (e.g., naïve realism without supplementation).  
    - Theories where "seeing-likeness" depends on doxastic attitudes.

  ---

  ### How Leading Theories Fare
  1. **Disjunctivism**  
     - *Core Claim*: Veridical perceptions and hallucinations are fundamentally distinct kinds; only perceptions directly present mind-independent objects.  
     - **Fare**:  
       - ✅ 1, 2, 4, 5, 6, 8 (insists on metaphysical difference).  
       - ❌ 3, 7: Struggles to explain indiscriminability without shared nature. Fails your recognition case: if hallucination lacks "seeing-ness", recognizing it *as unreal* should alter phenomenology—but it doesn’t.  

  2. **Sense-Datum Theory**  
     - *Core Claim*: All perceptual experiences involve direct awareness of mind-dependent sense-data (even in veridical cases).  
     - **Fare**:  
       - ✅ 2, 3, 5, 6, 7 (hallucinations share a kind with perceptions: sensing sense-data).  
       - ❌ 1, 4, 8: Makes *all* perception indirect; undermines veridicality’s epistemic privilege. Collapses phenomenology and epistemology (sense-data are always "given").  

  3. **Representationalism**  
     - *Core Claim*: Perceptual experiences are representations with intentional content; phenomenology is determined by content.  
     - **Fare**:  
       - ✅ 1, 2, 3, 4, 5, 6, 8: Hallucinations misrepresent; veridicality is accurate representation. Content vs. cause is clear.  
       - ⚠️ 7: Can *partially* accommodate—recognition is a higher-order belief not altering content. But struggles if your "coloured shapes" lack representational content.  
       - ❌ 9: Rejects non-intentional qualia; may force interpretation onto your episodes.  

  ---

  ### Summary of Constraints
  | Requirement | Disjunctivism | Sense-Datum | Representationalism |
  |------------|---------------|-------------|---------------------|
  | 1 (Veridicality) | ✅ | ❌ | ✅ |
  | 2 (Illusion) | ✅ | ✅ | ✅ |
  | 3 (Indiscriminability) | ❌ | ✅ | ✅ |
  | 4 (Phenomenal ≠ Epistemic) | ✅ | ❌ | ✅ |
  | 5 (Cause ≠ Content) | ✅ | ✅ | ✅ |
  | 6 (No Kind-Identity) | ✅ | ❌ | ✅ |
  | 7 (Recognition) | ❌ | ✅ | ⚠️ |
  | 8 (Argument from Illusion) | ✅ | ❌ | ✅ |
  | 9 (Non-Intentional Qualia) | ⚠️ | ✅ | ❌ |

  No theory satisfies all constraints perfectly. Representationalism fares best but faces pressure from non-representational aspects of experience (Requirement 9) and your recognition phenomenon (Requirement 7). Disjunctivism preserves perceptual directness but sacrifices explanatory power for hallucinations. Sense-datum theory unifies experience at the cost of indirect realism. **Requirement 7** remains the sharpest tool for testing theories against lived phenomenology.
