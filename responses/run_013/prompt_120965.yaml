prompt: |-
  A friend in my program is writing on Augustine and lying and dropped this on our reading group last week; we argued for two hours and got nowhere. He thinks it shows Augustine has to allow some deception, which he really doesnt want, and i want to keep the no-exceptions rule if i possibly can. Here's his argument, tidied up:

  (1) For Augustine a lie is a false signification joined with the will to deceive: you lie when you utter (or otherwise signify) one thing while holding another in your mind, intending your hearer to take the signification as true. Two corollaries he's explicit about — if you assert a falsehood you take to be true you don't lie, and if you assert a truth you take to be false you do lie. So a lie is judged "from the sense of his own mind, not from the verity or falsity of the things themselves."

  (2) He also says the fault of the liar just is "the desire of deceiving in the uttering of his mind," and he permits no exceptions whatever — not to save a life, not to protect someone's chastity, not even to catch heretics (he wrote a whole book against lying to trap the Priscillianists).

  (3) Now the murderer at the door. You can't say "he's not here" — that's a lie. So you say something true: "I haven't seen him all day." True; you saw him last night. You say it because you know the murderer will take it that your friend isn't around.

  (4) You wanted the murderer to believe something false about your friend's whereabouts. That's the desire to deceive — the very thing (2) names as the fault. (He has a second case too: you say nothing at all, you just lift your friend's coat off the hook and put it in the closet so the murderer draws the conclusion for himself. No signification at all, so not a lie by (1) — but you still willed his false belief.)

  (5) Yet you didn't lie. You said what you believed, and in the coat case you signified nothing.

  (6) So either (a) the desire to deceive is not what makes lying wrong — in which case (2)'s account of the fault is wrong — or (b) it is, in which case the true-but-misleading sentence and the coat trick are as bad as the outright lie, and Augustine's insistence that you may conceal the truth but never lie is empty: you can never protect anyone, and tact, surprise parties, bluffing at cards, and half of ordinary conversation turn into sins. Either way Augustine loses. Since he won't give up (2) and can't swallow (b), he says (1) has to be the guilty step — the will to deceive can't be part of what makes a lie a lie. (He tried escaping through Augustine's exemption for jokes — "jokes, which have never been accounted lies" — but that plainly doesn't reach the murderer, so it didn't help him.)

  Which step do i reject, and what does rejecting it cost me? I'd rather keep (2), the no-exceptions rule, than keep (1) intact if it comes to that — but tell me what i'm buying, and what it does to the coat case. Lead with the step you'd reject in your first sentence, then argue for it.
reasoning: |-
  Okay, I need to help this user with Augustine's view on lying. Their friend presented an argument that seems to force Augustine into a corner: either he has to allow some deception (which he doesn't want), or his no-exceptions rule against lying becomes impossible to maintain in real situations like protecting someone from a murderer. The user wants to preserve Augustine's strict no-lying position but needs to counter this argument effectively.

  Looking at the argument structure: Premise (1) defines lying as false signification with will to deceive. Premise (2) states the will to deceive is inherently wrong with no exceptions. The scenarios in (3) and (4) show non-lying deception (true but misleading statement and coat manipulation). The conclusion in (5) and (6) claims Augustine must either abandon his definition of lying's wrongness or condemn all deception - both problematic.

  Hmm... the key tension is between the absolute prohibition on lying and the apparent permissibility of non-lying deception in Augustine. The friend sees the will to deceive as the core issue in both lying and deception, making them morally equivalent. But Augustine might distinguish them. 

  I recall Augustine does permit hiding truth (e.g., Jacob's blessing deception) as long as no false signification occurs. So for the murderer case, saying "I haven't seen him all day" when true avoids being a lie by (1), but does involve intending deception. The coat example has no signification at all. 

  The critical move might be rejecting how premise (4) characterizes the intention. Augustine would argue that in permissible deception, your primary intention isn't to deceive but to protect life. The deception is a foreseen but unintended consequence - what later ethicists would call double effect. So in (2), when Augustine says "desire of deceiving," he means direct intention to deceive as an end in itself, not as a side effect of a good intention. 

  For the coat example, removing the coat isn't signification, so not lying. And the intention is preservation, with deception merely foreseen. This maintains the no-exceptions rule for lying while allowing concealment. 

  The cost is accepting that some deception (without false assertion) is permissible if rightly intended. But this preserves Augustine's core against lying. It also explains why bluffing or tact aren't sins - the primary intent isn't deception but social harmony or game rules. 

  This seems the strongest approach. It keeps (2) intact by refining what "desire to deceive" means, and shows why (1) remains valid for defining lies specifically. The coat case then isn't a lie and isn't condemned under (2) when properly understood.
answer: |-
  Here's how to defend Augustine while preserving his absolute prohibition on lying - **reject the characterization of intention in step (4).** Specifically, reject the claim that "you *wanted* the murderer to believe something false" (i.e., that the desire/intention was *to deceive*) in the truthful statement and coat cases. Argue that Augustine distinguishes between **intending deception as a means/end** and **merely foreseeing deception as a side-effect** of a truthful or non-assertive act done for a just cause.

  ### Why Reject Step (4)'s Characterization?
  1.  **Augustine Permits Concealment with Foreseen Deception:** Augustine explicitly allows hiding the truth *without lying* (e.g., *De Mendacio* 5; *Contra Mendacium* 10-11). In these cases, deception is a *foreseen consequence* of a truthful act (or silence/action), but it is not the *intention* or *will* driving the act.
  2.  **The Core Fault is the *Will* to Deceive, Not Foreseen Deception:** Step (2) correctly identifies the fault as the "*desire of deceiving*". In the murderer case:
      *   You primarily intend to **protect an innocent life** (a just end).
      *   You choose a **truthful statement** ("I haven't seen him all day") or a **non-assertive action** (moving the coat) as the *means*.
      *   You **foresee** the murderer will likely be deceived.
      *   You **do not *intend* the deception itself.** You would *prefer* the murderer simply left without forming any false belief, but you know he won't. The deception is an unwanted, albeit foreseen, side-effect of protecting life truthfully/silently.
  3.  **Augustine's Own Reasoning Supports This Distinction:** When discussing hiding the truth, Augustine warns against *actively causing* false belief through false signification (lying), but permits *allowing* false belief to persist through silence or truthful evasion (*Contra Mendacium* 10). The coat case is even stronger – you are simply arranging your own property truthfully; the murderer's *inference* is his own faulty act. Augustine condemns the *act of false signification* driven by the *will to deceive*, not the *existence of a false belief in another* resulting from your truthful/non-signifying acts.

  ### What This Costs You & Handles the Cases
  *   **Cost 1: Accepting Permissible Foreseen Deception:** You must concede that Augustine allows causing false beliefs *indirectly* through truthful speech or non-assertive actions, as long as deception is not the *intent* and no lie is told. This separates the sin of lying (always wrong) from the complex moral evaluation of foreseen deception (potentially justifiable in extreme cases when no lie is told).
  *   **Cost 2: Nuancing "Desire to Deceive":** You must interpret the core fault in (2) very precisely: not the *foreseeing* of deception, but the *willing* or *intending* of deception *as the chosen means or end* of your communicative act. The liar *aims* at false belief; the truth-teller protecting life *tolerates* it as a side-effect.
  *   **The Murderer Case (Truthful Statement):** "I haven't seen him all day" is true. Your *intention* is to protect life *by telling the truth*. You foresee deception, but do not *will* it. **Not a lie, foreseen deception is permissible.**
  *   **The Coat Case:** Moving the coat is **not a signification** at all (Agreeing with your friend's point in (4)). It's a non-communicative act of organizing your space. The murderer's false inference is entirely his own responsibility. You *foresee* his likely deception, but your *intention* is solely to remove a potential clue, not to signify anything false. **Not a lie, foreseen deception is permissible.**
  *   **Saving Tact, Parties, Bluffing, etc.:** This distinction rescues these:
      *   **Tact:** Your primary intention is kindness/avoiding harm; the vagueness or redirection (if truthful) is the means, foreseen mild deception is a side-effect.
      *   **Surprise Party:** Your primary intention is delight; truthful evasions ("I'm busy that night") or silence are the means; foreseen deception is a side-effect.
      *   **Bluffing (Cards/Games):** Within the *conventional rules of the game*, your actions (betting, stone-facedness) are understood *not* to be assertions of your hand's strength. Your intention is to play well within the rules; the opponent's false belief is a foreseen side-effect of the agreed-upon play. (Augustine might still frown on games encouraging deception, but it wouldn't be *lying* under his definition).

  ### Why This Preserves Augustine's Core
  1.  **Upholds (1) Intact:** A lie remains strictly defined as *false signification*. Truthful statements and non-signifying acts are never lies, regardless of foreseen deception.
  2.  **Upholds (2) Intact:** The *fault* of lying *is* the "desire of deceiving" – understood as the *intention* to cause false belief *through false signification*. This desire is always sinful. Foreseen deception via truth/non-signification is a different category.
  3.  **Avoids the Dilemma:** It rejects the false equivalence in (6). The truthful statement/coat trick are *not* "as bad as the outright lie" because the *sinful intention* (will to deceive via falsehood) is absent. The foreseen deception in extreme necessity is permissible because the *act* chosen (truth-telling, non-assertive action) is morally sound in itself, done for a grave reason.
  4.  **Aligns with Augustine's Practice:** This is how Augustine himself navigates the tension. He condemns lying to the murderer (*Contra Mendacium* is explicit), but allows truthful concealment and silence. He doesn't demand you *correct* the murderer's false inference if you've only told the truth or acted non-deceptively.

  **In essence:** You save Augustine's absolute ban *on lying* by embracing his permission for *truthful concealment*, even when deception is foreseen. The cost is accepting that foreseen deception (without false signification) can be justified in extreme circumstances, driven by a primary intention other than deception. The coat case is the *easiest* for Augustine – it involves no signification at all. The challenge lies in the truthful-but-misleading statement, which requires careful parsing of intention ("I intend to protect by truth-telling" vs. "I intend to deceive"). This parsing is crucial to maintaining Augustine's system against the murderer-at-the-door argument.
