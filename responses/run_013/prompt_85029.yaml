prompt: |-
  I have been reading around this corner of the internet for years, and I want to pin down the target before I read any more proposals for a heuristic estimator. Let me state the setup so that we are working from the same thing. A heuristic estimator is a device that takes a formal question, together with a set of premises, and returns an estimate — a real number, or a probability — meant to capture what a competent reasoner would guess on the basis of those premises alone, without a proof. What it is meant to formalize is a kind of defeasible reasoning whose central move is the presumption of independence: in the absence of any specific information about how two quantities are correlated, default to treating them as independent — estimate the expectation of a product as the product of the expectations — and revise that default only when the premises give you a reason to. The reasoning is intuitively compelling, widely used, and often accurate, and it is entirely informal; the project is to formalize it without losing what made it work.

  I do not want another candidate. I want the desiderata: what any adequate formalization of this reasoning has to deliver, each item with the case or consideration behind it. Sort them into four groups. First, the cases it must get right — the particular applications of the presumption that any competent reasoner would endorse and that the estimator therefore has to reproduce. Second, the spurious arguments it must reject — the arguments that superficially resemble valid applications of the presumption but that would let the estimator be gamed or would let it prove too much, including the self-referential and diagonal cases in which the premises or the question concern the estimator's own output, so that it has to reason about itself. Third, the distinctions it must respect — proof versus estimate, the estimator's output versus a probability, a defeasible default versus an assumption, and, a distinction I suspect proposals blur, treating two quantities as independent because the premises are silent about their correlation versus treating them as independent because the premises show the situation to be symmetric in the relevant respect. Fourth, the results it must be consistent with — agreement with ordinary probability theory and with deductive logic wherever those are defined, and consistency with the behaviour of the proposals already on the table.

  Then tell me which of these are genuine desiderata and which are merely the prejudices of one camp, and where two of them pull against each other. My own suspicion, which I would like you to test rather than adopt, is that a single requirement does most of the excluding work — the demand that the estimator reject spurious arguments — and that it stands in tension with the demand that it reproduce every intuitively valid application of the presumption, so that the interesting question is not how to satisfy the whole list but whether the list, as usually stated, is jointly unsatisfiable. If some of the existing candidates can be scored against the list in a sentence or two each, do that at the end; but keep the weight on the criteria.
reasoning: |-
  Okay, the user has been exploring heuristic estimators for years and wants to clarify the core criteria for evaluating them. They're clearly frustrated with the proliferation of proposals and seek a standardized framework. 

  Hmm, their request is unusually precise - they want desiderata categorized into four strict groups: must-get-right cases, spurious arguments to reject, key distinctions, and consistency requirements. The depth suggests they've encountered multiple flawed systems and need a rigorous taxonomy to evaluate them. 

  Interesting how they suspect a fundamental tension between catching all valid applications and blocking spurious ones. That's astute - many proposals fail exactly there. Their suspicion about independence-vs-symmetry confusion also resonates; I've seen estimators conflate epistemic silence with ontological symmetry. 

  Let me structure this carefully. First, the non-negotiable cases like coin tosses and disjoint events where any estimator must match naive probability. Then the poison pills: self-referential traps ("this sentence is false" equivalents for estimators), Dutch book vulnerabilities, and cases where premises secretly encode correlations. 

  The distinctions section needs particular care. Many systems founder by not separating defeasible defaults from absolute assumptions. And yes, conflating "no evidence of dependence" with "evidence of independence" is a critical flaw - the latter requires symmetry proofs the former doesn't. 

  For consistency requirements, the Gödelian tension with self-reference deserves emphasis. No estimator can be both complete and consistent when evaluating statements about itself. Existing proposals usually sacrifice one: Tarski-like systems avoid self-reference entirely, while reflective systems like Christiano's accept limited inconsistency. 

  When scoring existing approaches later, I'll note how logical inductor-esque systems handle spurious arguments well but struggle with real-time efficiency, while simpler probabilistic models ace basic cases but implode on diagonalization. The user seems ready for that tradeoff discussion. 

  Their underlying need appears to be a decision framework: "Which flaws am I willing to tolerate?" That's more valuable than another candidate system. I'll position the desiderata as a menu where choosing any five excludes some others - with the self-reference/consistency tension as the central dilemma.
answer: |-
  Based on your rigorous framing, here are the core desiderata for a formal heuristic estimator, categorized and analyzed for tensions:

  ### I. Cases It Must Get Right (Core Presumption Applications)
  1.  **Independent Random Events:** Estimate P(A ∧ B) = P(A) * P(B) when premises provide *no information* linking events A and B (e.g., two fair coin tosses).
  2.  **Disjoint Additivity:** Estimate P(A ∨ B) = P(A) + P(A) when premises *explicitly state* A and B are mutually exclusive.
  3.  **Linear Expectations under Independence:** Estimate E[X*Y] = E[X] * E[Y] when premises provide *no information* suggesting correlation between X and Y.
  4.  **Uniform Defaults under Ignorance:** Assign equal probability/estimate to exhaustive, mutually exclusive possibilities absent *any* distinguishing information (Laplace's sunrise problem, principle of indifference for finite sets).
  5.  **Conditional Independence Default:** Estimate P(A|B ∧ C) ≈ P(A|C) if premises provide *no information* linking A and B *given* C.

  *   **Basis:** Formalizes the core, uncontroversial intuition of defeasible independence presumption. Failure here means the estimator doesn't capture the reasoning it's meant to formalize.

  ### II. Spurious Arguments It Must Reject (Anti-Gaming/Self-Preservation)
  6.  **Self-Defeating Premises:** Reject estimates when premises directly or indirectly define correlations based on the estimator's *own output*. (e.g., "Let Q be true iff the estimator assigns P(Q) < 0.5").
  7.  **Inconsistent Bootstrapping:** Avoid proving contradictions by naively applying independence to premises that *collectively imply* dependence or inconsistency when combined with the estimator's rules.
  8.  **Dutch Book Vulnerability:** Prevent constructions where a series of estimates, if taken as betting odds, would lead to a guaranteed loss (exploiting failures like E[X*Y] = E[X]*E[Y] when X=Y).
  9.  **Ignoring Implicit Dependencies:** Reject independence when premises *logically entail* a relationship, even if not explicitly stated as correlation (e.g., X defined as Y+1).
  10. **Pathological Self-Reference:** Remain defined and produce plausible (or no) outputs when premises/questions refer to the estimator itself or its properties (e.g., "Estimate the probability that this estimator outputs a value > 0.7 for this question").

  *   **Basis:** Essential for logical coherence, consistency, and preventing trivialization or paradox. Failure here makes the estimator unusable or absurd.

  ### III. Distinctions It Must Respect (Conceptual Clarity & Correctness)
  11. **Estimate vs. Proof:** Outputs must be explicitly *estimates* (defeasible, heuristic) never mistaken for or guaranteed to be proofs or exact probabilities.
  12. **Estimate vs. Probability:** Clearly distinguish the *epistemic status* of the output (a best guess given limited info) from an objective or well-defined subjective probability.
  13. **Defeasible Default vs. Assumption:** Treat independence as a *default rule* that *can be overridden* by evidence, not a *fixed assumption*.
  14. **Silence vs. Symmetry:** Distinguish treating quantities as independent *due to premise silence* (epistemic default) from treating them as independent *because premises demonstrate symmetry* (ontological justification). The former is defeasible by any correlation evidence; the latter is only defeated by evidence breaking the symmetry.
  15. **Syntax vs. Semantics:** Respect that estimates depend on the *information presented* (syntactic premises), not just the underlying semantic truth. Different premise sets about the same fact can yield different defensible estimates.

  *   **Basis:** Captures the essence of *defeasible* reasoning and prevents conceptual confusions that plague naive implementations. Blurring 14 is a common critical flaw.

  ### IV. Results It Must Be Consistent With (Compatibility)
  16. **Ordinary Probability Theory:** Where premises *define* a precise probability space and full dependencies, estimates must match the calculated probabilities/expectations.
  17. **Deductive Logic:** Estimates must respect logical entailment: If premises ⊢ A, then P_est(A) = 1; If premises ⊢ ¬A, then P_est(A) = 0; Monotonicity within proofs (if A ⊢ B, then P_est(A) ≤ P_est(B)).
  18. **Asymptotic Agreement with Evidence:** As premises approach a complete description defining a probability model, estimates should converge to the correct probabilities/expectations under that model.
  19. **Internal Consistency:** The estimator's outputs should not contradict each other *given its own rules* when applied to logically related questions from the same premise set (avoiding blatant incoherence).

  *   **Basis:** Ensures the estimator is a proper extension of established formal systems, not an ad-hoc island. Provides grounding and legitimacy.

  ---

  ### Analysis: Genuine Desiderata vs. Prejudices & Tensions

  *   **Genuine Desiderata:** Items 1-5, 6-10, 11-15, 16-19 are all genuine core requirements. Failure in any group fundamentally undermines the project. The distinctions (11-15) are crucial for philosophical correctness, not mere preferences.
  *   **Potential Prejudice:** The emphasis on *specific* spurious argument types (6, 10) or the *degree* of internal consistency (19) might reflect a "logical purity" camp. A "pragmatic performance" camp might prioritize handling common cases (1-5) well and see pathological cases (6, 10) as less critical. However, *some* robustness against spurious reasoning (6-10) is essential for any serious formalization.
  *   **Core Tension:** Your suspicion is correct. There is a **fundamental tension** between:
      *   **Requirement A:** Faithfully reproducing *all* intuitively valid applications of the presumption (1-5, especially 1, 3, 4).
      *   **Requirement B:** Robustly rejecting *all* spurious arguments, especially those involving self-reference and diagonalization (6, 7, 10).
      *   **The Conflict:** Requirement A pushes towards a powerful, "optimistic" independence presumption. Requirement B demands extreme caution, especially around self-reference. **Gödelian/Diagonalization issues suggest this tension may be unresolvable in full generality.** A system powerful enough to handle all intuitive independence presumptions might be powerful enough to formulate self-defeating statements it cannot consistently handle. Conversely, a system restricted enough to avoid all self-reference pitfalls might be too weak to apply the independence presumption in all desired cases or represent complex scenarios.
  *   **Key Secondary Tension:** Respecting **Silence vs. Symmetry (14)** often pulls against **Internal Consistency (19)** or avoiding **Ignoring Implicit Dependencies (9)**. Treating silence as independence can lead to inconsistencies if premises implicitly define dependencies not captured syntactically. Requiring proven symmetry for independence can make the estimator too weak for many intuitive applications where symmetry isn't provable from the premises.

  ---

  ### Scoring Existing Candidates Briefly

  1.  **Naive Probabilistic Logic (NPL):** Aces 1-5, 11-13, 16-18. Fails catastrophically on 6-10, 14 (blurs silence/symmetry), 9, 19 (inconsistent).
  2.  **Logical Inductors (LIs):** Strong on 6-10, 14 (implicitly respects difference), 11-13, 16-19. Struggles with 1-5 *efficiency* – estimates converge to correct values *in the limit* but initial estimates based on limited premises may poorly match human intuition. Computationally infeasible.
  3.  **Dempster-Shafer Theory:** Handles 11-13, 14 (somewhat) well. Struggles with 1-5 (often doesn't default sharply to independence), 6-10 (vulnerable to some paradoxes), 16 (can diverge from standard probabilities). Strong on representing ignorance.
  4.  **Default Probabilities / System P/Z:** Handles 11-15 well in principle. Struggles with 1-5 (weak inference rules), 6-10 (limited expressiveness for self-ref), 16-18 (limited integration with full probability). Focuses on qualitative defaults.
  5.  **Reflective Oracles / Definability Approaches:** Explicitly tackle 6, 7, 10. May sacrifice 1-5 (estimates can be overly cautious/undefined) or 16 (outputs aren't always probabilities). Focus on avoiding paradoxes.

  **Conclusion:** The desiderata list highlights the core challenge. The tension between capturing intuitive reasoning (A) and avoiding paradox (B), amplified by self-reference, suggests **full satisfaction of all desiderata may be impossible** for non-trivial domains. The project likely requires **compromise**, prioritizing either robustness against paradox (sacrificing some intuitive power, e.g., LIs) or intuitive power in common cases (sacrificing full self-referential robustness, e.g., pragmatic NPL variants). Respecting the key distinctions (11-15) is vital for any credible candidate.
