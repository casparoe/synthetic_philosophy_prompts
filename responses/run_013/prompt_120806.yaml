prompt: |-
  I've been sitting in on a Buddhist study group run by a nun — Tibetan trained, but she teaches the Pali suttas too — and I've been keeping a list of her verdicts on the cases people bring in, because they don't fit any of the boxes I know how to use. Roughly:

  - A student lied to a border guard about what was in her bag to get her uncle's medicine through. The medicine was banned, the uncle was sick, nobody got hurt. Verdict: no fault at all, she'd call it good.
  - Another student lied to her own doctor about how much she drinks, out of embarrassment. Verdict: fault, and a real one. Her gloss was that the drinking isn't the issue, the issue is that the student would rather be thought well of than be treated.
  - The hospice case: a doctor gives a terminal patient a dose she knows will probably shorten his life, aiming only at his pain, at his request. Verdict: no fault. She stressed two things — the doctor wasn't aiming at his death, and she wasn't using him for anything.
  - The soldier: kills a man who's about to throw a grenade into a market, saving a lot of people. Verdict: fault, no hedging. Someone asked about the lives and she said she wasn't asking how many he saved. The mind he did it with — terrified, furious — was, for her, the whole of the act.
  - The builder: lies on a permit application, which gets a project approved that ends up employing most of a poor village. His wanting to help was genuine; he also got rich. Verdict: fault, but a smaller one than the soldier's. You did a good thing and you also did it for yourself, and the second part isn't nothing.
  - The captain: the old story about the captain who kills a bandit to stop him robbing and murdering the merchants he's travelling with. Verdict: blameless — and she was emphatic that this one has nothing to teach us, because the captain was blameless for the reason that he'd have gone to hell for those merchants gladly. The same act by one of us, she's said, would wreck us.

  She also keeps drawing a distinction I can't get a grip on: an act can be a transgression, she says, and you can still not be at fault for it. I don't know who's keeping the books in that picture, or what the transgression is doing if nobody's on the hook for it.

  Half the group thinks she's a utilitarian in robes, since the state of mind seems to do all the work — but she faults people for doing the most good, so thats not it either.

  Next week's case is this. A student runs a clinic in a district where a foreign foundation funds vaccine programs only for districts with a declared outbreak. Hers has no outbreak yet, but the district next door does and it's clearly coming; if she certifies that hers has one, the foundation moves immediately, the kids get vaccinated months early, and a lot of them live who otherwise wouldn't. She does it purely for the kids. She doesn't want the post that comes with running the program and expects to be miserable in it, but she takes it anyway, because turning it down leaves it to someone who'd botch it, and it comes with a salary she doesn't need but doesn't refuse. The form needs a second signature, so she signs her supervisor's name; if it ever comes out he's the one who wears it, and honestly she barely thinks about him, he's a formality to her.

  What does she say about that one? I want the rule she's actually running, the other rules that fit her record just as well, what each of them predicts here, which one I should bet on and why, and what case I should put to her next to tell them apart. I care alot less about the verdict than about the rule.
reasoning: |-
  Hmm, the user is describing a Buddhist nun's ethical rulings on various moral dilemmas, and they're trying to figure out her underlying ethical framework. The cases involve lying, killing, and deception with different intentions and outcomes. The nun seems to emphasize the actor's state of mind over consequences, but there are nuances that don't fit neatly into standard ethical boxes like utilitarianism or deontology.

  The user wants me to predict the nun's ruling on a new case about falsifying documents to get vaccines early, and more importantly, identify the consistent rule behind all her past verdicts. They also want alternative rules that could explain her rulings, predictions for the vaccine case under each rule, which rule to bet on, and a discriminating case to test them.

  Looking at the cases: Lying to a border guard for medicine is "no fault," while lying to a doctor about drinking is faulty because it prioritizes appearance over health. In the hospice case, administering potentially lethal pain medication is "no fault" since the intention was purely to relieve suffering. The soldier killing to save many is faulty due to his terrified and furious state of mind. The builder lying on permits for community benefit is faulty but less so than the soldier's act because of mixed motives. The captain killing a bandit is blameless because he would willingly go to hell for others.

  The nun distinguishes between "transgression" (the act itself) and "fault" (personal culpability), which suggests she separates objective wrongness from subjective blameworthiness based on intention and state of mind.

  Key patterns emerge:
  1. **Intention matters most**: The primary focus is on the mental state - whether the act arises from wholesome or unwholesome roots (greed, hatred, delusion vs. compassion, wisdom).
  2. **Purity of motivation**: Fault increases with self-interest (builder), aversion (soldier), or delusion (drinking lie), while selflessness reduces fault (captain, medicine lie).
  3. **Consequences are secondary**: Good outcomes don't excuse bad motivations (soldier, builder), and bad outcomes don't condemn good intentions (hospice doctor).
  4. **Role of sacrifice**: Willingness to bear consequences reduces fault (captain's hell-acceptance contrasts with builder's self-enrichment).

  For the vaccine case: The doctor lies about an outbreak to save children, takes a miserable job for their sake, but forges a signature without considering consequences to her supervisor. Her intention is purely altruistic for the children, but there's negligence toward the supervisor.

  Applying the nun's framework:
  - **Core intention**: Altruistic (saving children) - strongly mitigates fault.
  - **Secondary intentions**: Accepts unwanted duties (positive), but shows disregard for supervisor (negative, indicating delusion about interconnectedness).
  - **Self-interest**: Takes unneeded salary without refusal - minor selfish element.
  - **Sacrifice**: Willingly accepts personal misery - reduces fault.

  Likely verdict: Fault, but minor (like builder) due to mixed elements overshadowed by primary good intent. The signature forgery specifically would be the "transgression" while mitigated intention reduces personal "fault."

  Alternative rules:
  1. **Pure Intentionism**: Only mental state matters. Predicts no fault since primary intent is pure.
  2. **Consequentialist-Leaning Intentionism**: Intent dominates but consequences can amplify/diminish fault. Predicts no fault due to overwhelming good outcome.
  3. **Duty-Focused Intentionism**: Adds role-specific duties. Predicts fault for violating professional honesty.
  4. **The "Three Roots" Intentionism** (my bet): Uses Buddhist "roots" - greed, hatred, delusion. Predicts minor fault due to delusion in overlooking supervisor.

  Discriminating case: A starving person steals bread to survive, feeling deep compassion for the baker's potential loss. Pure Intentionism might see no fault (compassionate motive), while Three Roots would find fault due to delusion (ignoring karma/ownership). This tests whether ignorance can create fault despite good intentions.
answer: |-
  Based on the nun's pattern of rulings, her ethical framework is **Intention-Rooted Non-Utilitarianism with Karmic Causality Emphasis**. It's not utilitarianism (which prioritizes outcomes) or pure deontology (which prioritizes rules/duties). Instead, her "rule" centers on **the quality of the mind's roots at the moment of action, assessed through the lens of Buddhist psychology (specifically the "three unwholesome roots"—greed, hatred, delusion—and their opposites)**. Fault arises when an act is rooted in unwholesome mental states, regardless of outcomes. The "transgression vs. no fault" distinction reflects karmic causality: an act can be objectively unskillful (a "transgression" in conventional or karmic terms) but subjectively blameless if the mind is free of defilements. The "books" are kept by the law of karma itself—the act plants seeds, but the cultivator's state (fault or no fault) determines the fruit's bitterness.

  ### The Core Rule She's Running
  **"Fault is determined by the presence and dominance of unwholesome roots (lobha/greed, dosa/hatred, moha/delusion) in the mind at the time of action. No fault arises when the act is rooted in wholesome states (alobha/generosity, adosa/loving-kindness, amoha/wisdom), even if the act is conventionally unethical. Outcomes are irrelevant; mixed motives increase fault proportionally."**

  #### Breakdown:
  - **Unwholesome roots = Fault**: Acts driven by greed (e.g., builder's self-enrichment), hatred (e.g., soldier's fury), or delusion (e.g., student's embarrassment-driven lie) are faulty.
  - **Wholesome roots = No fault**: Acts from generosity (e.g., medicine lie), loving-kindness (e.g., hospice care), or wisdom (e.g., captain's self-sacrifice) are blameless.
  - **Mixed motives = Graded fault**: Fault scales with the "weight" of unwholesome roots (builder's minor fault due to greed mixed with generosity).
  - **Sacrifice matters**: Willingness to bear consequences (captain's hell-acceptance) neutralizes fault by proving purity of intent.
  - **"Transgression" vs. "Fault"**: A "transgression" is an unskillful act in the conventional/karmic sense (e.g., lying, killing). "Fault" is personal culpability based on mental state. One can commit a transgression without fault if the mind is wholesome (e.g., lying for medicine).
  - **Outcomes are incidental**: Good results don't excuse bad motives (soldier); bad results don't taint good motives (hospice).

  ### Alternative Rules That Fit Her Record (But Are Less Likely)
  Here are other frameworks that *partially* explain her rulings, with their weaknesses:

  1. **Virtue Ethics (Buddhist-Flavored)**  
     - **Rule**: "Fault depends on whether the act expresses virtues (compassion, wisdom) or vices (greed, hatred)."  
     - **Fits**: Explains the soldier (hatred) vs. captain (compassion) distinction.  
     - **Fails**: Doesn't cleanly handle mixed motives (builder) or the transgression/fault split. Virtue ethics usually links character to act, but the nun absolves "transgressions" with good intent.  
     - **Prediction for Vaccine Case**: Minor fault—compassion is present, but forging signatures shows lack of integrity (a vice).  

  2. **Threshold Intentionism**  
     - **Rule**: "No fault if altruistic intent exceeds 50%; fault increases with selfish/deluded intent."  
     - **Fits**: Matches medicine lie (100% altruism) vs. drinking lie (100% delusion).  
     - **Fails**: Struggles with the soldier (his intent was arguably altruistic but polluted by hatred) and the builder (mixed motives). Ignores the nun's emphasis on mental *purity*.  
     - **Prediction for Vaccine Case**: No fault—altruism dominates (>90%).  

  3. **Consequentialist-Intention Hybrid**  
     - **Rule**: "Fault is minimized when good intent leads to good outcomes, but intent is primary."  
     - **Fits**: Seems utilitarian at first glance (e.g., medicine lie has good outcome).  
     - **Fails**: Contradicted by soldier (good outcome but fault) and hospice (risky outcome but no fault).  
     - **Prediction for Vaccine Case**: No fault—strong altruism + excellent outcome.  

  4. **Duty-Priority Framework**  
     - **Rule**: "Fault arises when violating role-specific duties (e.g., doctor's honesty, soldier's non-hatred)."  
     - **Fits**: Drinking lie (patient duty) and soldier (soldier's duty to avoid hatred).  
     - **Fails**: Doesn't explain blameless transgressions (medicine lie, hospice) or the captain's blameless killing.  
     - **Prediction for Vaccine Case**: Fault—violates professional duty (forgery, dishonesty).  

  ### Prediction for the Vaccine Case Using the Core Rule
  - **Act**: Lying about an outbreak, forging a signature, accepting unneeded salary.  
  - **Mental State Analysis**:  
    - **Wholesome roots**: Primary intent is compassionate (saving children, accepting misery for their sake).  
    - **Unwholesome roots**:  
      - **Delusion (moha)**: She "barely thinks" about the supervisor, showing ignorance of karmic interconnectedness and his potential suffering.  
      - **Minor greed (lobha)**: Accepting unneeded salary without refusal hints at subtle attachment.  
  - **Fault Assessment**: Mixed motives, but wholesome roots dominate. The delusion (regarding the supervisor) is significant but not malicious. Greed is minimal.  
  - **Verdict**: **Minor fault (like the builder)**. The act is a transgression (lying, forgery), but fault is low due to strong compassion. She’ll stress: "Your heart was with the children, but you forgot the supervisor was a person, not a tool. That carelessness is the fault."  

  ### Which Rule to Bet On and Why
  - **Bet on the Core Rule (Intention-Rooted Non-Utilitarianism)**. It:  
    1. Explains *all* cases cleanly, including mixed motives (builder), blameless transgressions (medicine/hospice), and the primacy of mental state (soldier).  
    2. Accounts for the transgression/fault distinction via karmic causality.  
    3. Aligns with Tibetan Buddhist psychology, where karma is generated by volition (cetana), not outcomes.  
    4. Best predicts the vaccine verdict: minor fault due to delusion overshadowing compassion.  
  - **Reject alternatives**:  
    - Virtue ethics can’t handle transgression absolution.  
    - Threshold intentionism oversimplifies mixed motives.  
    - Consequentialist hybrids are contradicted by the soldier.  
    - Duty frameworks ignore context (e.g., blameless captain).  

  ### Discriminating Case to Test the Rules
  To confirm the core rule vs. alternatives, present this:  
  > **The Thief’s Compassion**: A starving man steals bread from a baker. He *hates* the baker (who once cheated him) but steals *only* to feed his dying child. He feels deep compassion for the child and regret for the baker, but his hatred simmers.  

  - **Core Rule Prediction**: **Fault** (due to hatred). The wholesome root (compassion) is present, but the act is rooted in hatred (he stole *from someone he hates*). The nun would say: "You used the child’s need as a veil for your rage."  
  - **Threshold Intentionism Prediction**: No fault (altruism >50%).  
  - **Virtue Ethics Prediction**: Fault (theft expresses hatred, not compassion).  
  - **Consequentialist Hybrid**: No fault (good outcome for child, intent mixed).  
  - **Duty-Priority**: Fault (violates non-stealing duty).  

  This case isolates **hatred as a root motive**. If the nun faults the thief, it confirms the core rule’s emphasis on unwholesome roots overriding outcomes or mixed intent. If she doesn’t fault him, it supports threshold intentionism or consequentialism. Given her soldier ruling (fault for fury), bet on fault.  

  ### Summary
  - **Her rule**: Fault = unwholesome roots (greed, hatred, delusion) in the mind.  
  - **Vaccine prediction**: Minor fault (delusion in ignoring supervisor).  
  - **Your bet**: Core rule—it’s internally consistent and Buddhist-grounded.  
  - **Test case**: "The Thief’s Compassion" to force a choice between root motives and outcomes/intent thresholds.  

  This framework isn’t just "state of mind matters"—it’s a precise map of karma through the three roots. If you share the thief case next, her response will crack this open.
