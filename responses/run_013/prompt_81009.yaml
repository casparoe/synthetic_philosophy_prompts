answer: |-
  ### Domain-Export Weakening (DEW)  
  **Definition**: The fallacy of exporting a technical theorem beyond its domain of validity—ignoring its preconditions—to support a broad metaphysical or practical claim, then retreating to an uncontroversial weaker claim when challenged, rendering the conclusion unfalsifiable.  

  ### Gödelian Instance: *Formal System Overextension*  
  **Error**: Gödel’s theorems require: (1) a recursively axiomatizable system, (2) sufficient to encode arithmetic, (3) with a definable provability predicate. Legal codes, scientific methods, or machines typically lack these features. "Unprovability" in Gödel’s sense—*demonstrably true but not derivable from axioms*—relies on a fixed, consistent formal structure. Legal systems evolve through precedent; machines operate in bounded physical contexts. Conflating "incompleteness" (a precise mathematical property) with practical limitations (e.g., ambiguous statutes) misapplies the term.  

  **Legitimate vs. Fallacious Use**:  
  - **Valid**: Proving *within computability theory* that no algorithm solves the Halting Problem (reductio ad absurdum relying on Gödel’s machinery).  
  - **DEW Fallacy**: Claiming Gödel "proves" human judges must transcend rules—ignoring that legal systems aren’t formal systems in Gödel’s sense. Retreating to "all systems have gaps" abandons the initial argument while preserving rhetorical weight.  

  ### Boundary Cases  
  1. **Honest Analogy**: Noting that *like* chaotic systems, social dynamics are sensitive to initial conditions—while explicitly acknowledging disanalogies (e.g., human intent violates deterministic chaos).  
  2. **Metaphor**: Using "entropy" colloquially for disorder, without asserting the Second Law *governs* organizational failure.  
  3. **Appeal to Authority**: Citing Gödel to support mathematical logic—not smuggling in metaphysical conclusions.  
  4. **Legitimate Export**: Applying Shannon entropy rigorously to information ecology, *after* verifying probabilistic preconditions.  

  **Core Defect**: DEW exploits the theorem’s *cachet* while discarding its mathematical skeleton, then immunizes itself by collapsing into platitude. It mistakes formal undecidability for universal incompleteness, quantum indeterminism for libertarian free will, or thermodynamic irreversibility for historical inevitability—all without domain-checking. The move isn’t interdisciplinary insight but *conceptual smuggling*.  

