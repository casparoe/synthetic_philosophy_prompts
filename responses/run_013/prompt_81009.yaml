  For the general pattern, I'll coin "Domain-Export Weakening" (DEW). It involves: (1) Exporting a theorem far beyond its domain without checking preconditions. (2) Using its conclusion to make a strong, contentious claim. (3) Retreating to an unfalsifiable weak claim when challenged. This differs from honest analogy (which acknowledges disanalogies), metaphor (which is illustrative, not probative), and appeal to authority (which cites expertise but doesn't misapply technical content). Boundary cases: Legitimate cross-disciplinary inspiration (e.g., Shannon entropy in ecology) carefully adapts concepts; scientific metaphors ("genetic code") don't pretend to be theorems. 

