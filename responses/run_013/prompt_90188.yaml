prompt: |-
  I'm a novelist, and my new book turns on a lottery of the Platonia kind — the one where the pot gets split between everyone who enters, so the clever-looking answer only works if everybody else has already reasoned their way to the same place you have, and where the whole thing collapses the moment a few people pile in for reasons that have nothing to do with reasoning (they misread the form, they're drunk, they enjoy spoiling it for everyone). I've been asked to be the visiting speaker at a decision theory reading group next month, and the thing I actually want to argue is this: the puzzle isn't a paradox of rationality at all, it's a coordination problem in a paradox's clothing, and "superrationality" is a norm that quietly assumes a population already persuaded of the argument — so its clever answer stops being an answer to anything once real people are in the room. And I think there's a nastier second limb: the puzzle only goes through if you're allowed to treat your own reasoning as a copy of everyone else's, and nobody has ever told me why I get to do that. My novel uses its own version of the rules, so if you need the mechanics pinned down to make the objections bite, pin them down yourself and say that's what you're doing.

  Act as a decision theorist who's sat through far too many of these interdepartmental seminars and knows exactly how the room works. The audience: mostly microeconomists, one game theorist who runs lab experiments and is allergic to anything that smells of philosophy, a philosopher of action who'll want to talk about intentions and what it means to "decide for everyone", and two literary critics who came for the fiction and will ask why my characters can't just talk to each other. Think carefully, and brainstorm a bit first, about who in that room cares about what. Then give me my prep sheet: the eight or so objections I'll actually get — not the ones I'd get from a room full of rationalists — ordered by how much damage they'd do, each phrased the way that particular person would phrase it, with a two-minute reply and an honest note on where the reply is soft. Tell me what to concede in the first minute so I don't look like a crank, and finish with the question I'm dreading, the one I'm hoping nobody asks. No reading lists, no references, I can't look anything up from the podium, and don't be polite about the weak bits — I'd rather find them here than up there. British spelling, obviously.
reasoning: |-
  Alright, the user is a novelist preparing for a decision theory talk. They're dealing with the Platonia lottery, where the prize splits among all who enter, but it collapses if non-reasoners join. They want to argue it's a coordination problem disguised as a paradox, and superrationality assumes everyone's already convinced. They also question why we assume our reasoning mirrors others'.

  First, I need to unpack the audience: microeconomists, a game theorist, a philosopher of action, and literary critics. Each has different concerns. Microeconomists care about incentives and stability; the game theorist hates philosophy and wants empiricism; the philosopher focuses on intentions; literary critics want narrative realism like communication.

  The user needs a prep sheet with eight objections, ordered by damage level. Each objection should be in the speaker's voice, with a two-minute reply and weaknesses noted. Also, concessions upfront to avoid seeming cranky, and the dreaded question.

  Key points to concede: the lottery's fragility to irrational players, superrationality's circularity. This builds credibility. Objections should start with the game theorist's empiricism, then microeconomists on incentives, etc. The dreaded question might be why not use communication, exposing the core issue.

  Structure the objections by damage: high damage from empiricists and economists, then philosophers, finally critics. Replies should address each concern but admit weaknesses like lack of real-world tests or coordination mechanisms. The dreaded question forces the user to admit communication isn't allowed, highlighting the paradox's artificiality.

  Need to ensure replies are concise, weaknesses honest, and the overall flow logical. The user's main goal is to present their novel's perspective while navigating academic critiques effectively.
answer: |-
  Right, listen. You're walking into the faculty club lion enclosure wearing a steak waistcoat. Your core argument is sound – Platonia *is* a coordination problem masquerading as a pure rationality puzzle, and superrationality is begging the question dressed up as insight. But *that room*? They’ll tear the steak off you if you don’t know where the bites are coming from. Here’s your battle plan. Concede early, hit the objections hard where you can, and limp away if you have to.

  **The Crucial First Minute Concession (Do NOT Skip This):**
  "Look, I want to be clear upfront: the *actual* Platonia lottery, as described, is incredibly fragile. If even a *single* person enters for a non-reasoned reason – a misclick, a dare, sheer bloody-mindedness – the 'superrational' equilibrium collapses catastrophically for everyone. It relies on an almost absurdly homogeneous population of hyper-rational agents all converging independently on the *same* line of reasoning. My point isn't that superrationality is *wrong* in its sterile world, but that its sterile world isn't where *decisions* happen. It's a coordination norm pretending to be a discovery."

  **The Prep Sheet: Objections & Replies (Ordered by Potential Damage)**

  1.  **The Game Theorist / Experimentalist (Most Damage - Undermines Foundations):**
      *   **Objection (Sniffing derisively):** "This is all very pretty, but where's the *evidence*? We run iterated games with real humans. In the lab, with real incentives, we see *mixed strategies*, learning, signalling, communication – sometimes coordination emerges, often it doesn't, and crucially, *it depends on the setup*. This 'superrationality' sounds like a just-so story for a scenario that couldn't exist outside a philosopher's head. Why should we care about a 'solution' that evaporates the moment you add a single irrational agent, which we *always* have?"
      *   **Your Reply (2 mins):** "You've hit the nail on the head – that's *precisely* my argument. The lab shows us what this puzzle obscures: successful coordination in complex situations requires mechanisms *beyond* individual rationality alone – repeated interaction, communication channels (even cheap talk), focal points, institutional structures, or sheer luck. Platonia deliberately strips those away. It presents a one-shot, no-communication scenario and declares a 'rational solution' that only works if everyone already *is* perfectly coordinated in their reasoning *before* the game starts. It's not predicting behaviour; it's defining a state of pre-existing harmony and calling it rationality. Its fragility *is* the point – it reveals the hidden assumptions about the population, not about individual reason."
      *   **Where it's Soft:** You haven't provided an *alternative* positive model. You're deconstructing, not constructing. They might dismiss it as "just criticism" without empirical teeth. Concede that readily: "I'm a novelist, not an experimentalist; my job is to show why *this particular story* is misleading, not to build a better lab protocol."

  2.  **Microeconomist 1 (High Damage - Questions Practical Relevance):**
      *   **Objection (Dryly):** "Interesting. But if this 'solution' is so fragile, and real-world equivalents – say, speculative bubbles, bank runs, or even niche market entry – demonstrably involve significant noise traders, irrational actors, and unpredictable coordination failures, what's the *actionable insight*? Why spend time on a puzzle whose 'solution' has zero predictive or prescriptive power outside its own artificial constraints?"
      *   **Your Reply (2 mins):** "The insight is *diagnostic*, not prescriptive. It shows us the *danger* of applying models that assume perfect rational coordination to real-world coordination problems. It highlights how easily elegant theoretical solutions can collapse when confronted with human heterogeneity. Think of it as a cautionary tale: if your economic model for a coordination-sensitive scenario (like adopting a new standard) relies on everyone independently reasoning identically to a unique equilibrium, your model is probably brittle. The puzzle exposes the *cost* of assuming away the very coordination problem it purports to solve by embedding it *within* the individual reasoning process itself."
      *   **Where it's Soft:** You're still not giving them a tool. They might see it as merely pointing out the obvious complexity of the world. Emphasise the *specific* sleight-of-hand: "It's not just complexity; it's a model that *pretends* to solve coordination purely through individual reason, but smuggles in the assumption that coordination is already magically achieved at the level of cognition."

  3.  **Microeconomist 2 (High Damage - Attacks the Copying Assumption):**
      *   **Objection (Sharply):** "You mentioned the 'copying' problem. Quite right. Why *should* I assume my reasoning process is isomorphic to everyone else's? We have different priors, different heuristics, different cognitive capacities, different information. Game theory deals with this through common knowledge assumptions, but here it seems baked into the core of 'superrationality'. Isn't that just assuming common knowledge of rationality *and common knowledge of identical reasoning algorithms*? That's vastly stronger and entirely implausible."
      *   **Your Reply (2 mins):** "Exactly! This is the 'nastier second limb' I mentioned. Superrationality doesn't just require common knowledge of rationality; it requires common knowledge that *everyone applies the same specific, non-standard reasoning shortcut* (the 'we are all identical reasoners, so I must decide *as if* I decide for all'). It collapses the distinction between individual deliberation and group coordination. It's not just that we're all rational; it's that we're all *this specific kind* of hyper-reflective rationalist, performing the same mental contortion. The moment you introduce the possibility that someone might reason differently – perhaps classically game-theoretically, perhaps naively, perhaps just *wrong* – the whole edifice crumbles. It's a solution only for a population already committed to *that specific solution*."
      *   **Where it's Soft:** You risk sounding like you're just describing a very narrow equilibrium concept (which it is). You need to stress the *normative* leap: "It's presented not just as *an* equilibrium, but as *the uniquely rational* one, which requires this implausible isomorphism."

  4.  **Philosopher of Action (Medium Damage - Focuses on Intentions):**
      *   **Objection (Thoughtfully):** "You argue it's coordination disguised. But coordination typically involves some form of *intentional* alignment – perhaps via agreement, convention, or reciprocal expectation. In superrationality, the agent seems to be reasoning *as if* they are deciding for the group, but without actually forming a group intention. What *is* the intentional structure here? Is it individual rationality stretched to breaking point, or a peculiar form of collective agency smuggled into the individual mind?"
      *   **Your Reply (2 mins):** "This is brilliantly put and cuts to the heart of the weirdness. The superrational agent *isn't* forming a collective intention in any meaningful sense. There's no 'we' being constituted. Instead, they are performing an individual calculation *predicated* on the (unfounded) belief that everyone else is performing *the exact same individual calculation*, leading to a *de facto* alignment. It’s a *simulation* of collective agency within a single skull, justified only by the circular assumption that everyone else is running the identical simulation. It’s individualism cosplaying as collectivism. The paradox arises because this internal simulation *feels* like solving the coordination problem rationally, but it actually just assumes the coordination at the cognitive level is already perfect."
      *   **Where it's Soft:** This gets quite meta. The microeconomists might glaze over. Stick to the core: "It's an individual *intending* an outcome that only makes sense if others *identically* intend it, with no mechanism to ensure that identity beyond faith in universal reason."

  5.  **Literary Critic 1 (Low-Medium Damage - Narrative Frustration):**
      *   **Objection (Slightly exasperated):** "Why *can't* they just talk? Your novel's mechanics aside, the core frustration with these puzzles as *stories* is the artificial silence. If the prize is so valuable and the logic so fragile, wouldn't any sensible person, let alone your characters, try to communicate? Agree beforehand? The artificial constraint feels like a plot device to manufacture the 'paradox', not a genuine exploration of human decision-making."
      *   **Your Reply (2 mins):** "You're absolutely right on a narrative level! That silence *is* artificial. But that artificiality *is the point of the puzzle*. It's designed to isolate pure individual reasoning in a coordination context, stripping away all the messy human tools we actually use – language, convention, trust, precedent. The puzzle asks: 'Can pure reason alone solve this?' And the superrational answer claims 'yes', but only by performing a trick that *mimics* coordination without actual communication. In my novel, that artificial silence *is* the dystopian constraint – it's a world where such communication is impossible or forbidden, forcing characters into this logically fraught space, highlighting how unnatural and fragile the 'pure reason' solution is. The frustration is intentional; it reveals the puzzle's pathology."
      *   **Where it's Soft:** It concedes the puzzle is artificial, which you already did, but the critic might feel this doesn't absolve the *narrative* if the constraint feels unmotivated. Be ready with a brief, vivid example from your novel's world to justify the silence.

  6.  **Microeconomist 3 (Low Damage - Focuses on Specifics):**
      *   **Objection (Technically):** "Hang on. Pin down the mechanics. If the pot splits, and entering costs nothing, isn't the dominant strategy *always* to enter? Even if only one person enters, they get the whole pot. If many enter, you might get a tiny slice, but it's better than nothing. Why wouldn't everyone just enter regardless? Where does the 'clever answer' of *not* entering come from?"
      *   **Your Reply (2 mins):** "Good point; let's clarify. The standard Platonia setup usually includes a *cost* to submitting an entry ticket (even if tiny), or frames it such that 'winning' with many others yields a net *loss* compared to not playing (e.g., a fixed pot split minus an entry fee). Or, the 'prize' is defined as being the *sole winner*. The 'clever answer' – everyone reasons superrationally that since only one *should* win, and we're all identical, no one enters (or one random person does) – only makes sense if entering when others also enter is actively *bad* (net loss) or the sole win is the only valuable outcome. Without that negative consequence for multiple entry, yes, it devolves into a simple 'enter' equilibrium. The paradox relies on multiple entry being undesirable."
      *   **Where it's Soft:** This is mechanics, not your core argument. You've fixed it, but it momentarily derails you. Be crisp: "Assume there's a cost making multiple entry a net loss, or the prize is defined solely for a unique winner. That's standard."

  7.  **Literary Critic 2 (Low Damage - Character Motivation):**
      *   **Objection:** "Your characters – wouldn't at least *some* of them just think 'Sod it, I'll enter anyway, maybe I'll get lucky'? The superrational argument feels like it requires a very specific, perhaps unrealistic, type of hyper-analytical personality. How do you square that with believable characters?"
      *   **Your Reply (2 mins):** "Absolutely! And that's where the novel lives. Not everyone in my story *is* a hyper-rationalist. Some enter out of hope, some out of spite, some by mistake, some because they misunderstand the odds. The tension arises precisely *because* the 'logical' solution requires a uniformity of thought that human beings simply don't possess. The characters who *do* try to be superrational are often paralysed, or make catastrophic misjudgements about how many others might be reasoning similarly. The plot is driven by the *failure* of the pure logic in the face of human diversity. The puzzle's clean answer is the fantasy; the messy human choices are the reality I explore."
      *   **Where it's Soft:** This is strong ground for you. Lean into it. It reinforces your core thesis.

  8.  **The Game Theorist Again / A Sceptical Microeconomist (The Dreaded Question - High Damage):**
      *   **The Dreaded Question (Leaning forward):** "Alright, you've convinced me Platonia-as-paradox is broken. Fine. But strip away the 'superrationality' label. Isn't 'Nobody Enters' still a *Nash Equilibrium* in your cost-included version? If everyone believes no one else will enter, then not entering *is* a best response. And 'Everyone Enters' (for a net loss) is a worse, but still *possible*, equilibrium. So isn't this just a standard coordination game with multiple equilibria, one Pareto-superior? The 'problem' is just picking the good one. Why dress this up as some grand critique of rationality? It's just a coordination game like any other. What's novel here?"
      *   **Your Reply (2 mins - Grit your teeth):** "You're technically correct on the Nash point. 'Nobody Enters' *is* a Nash Equilibrium *if* you can get everyone to believe it. But that's the rub! *How* do you coordinate on that belief? In standard coordination games (like driving on the left/right), we have conventions, laws, focal points. Platonia deliberately lacks those. The 'novelty' – and the sleight of hand – is that 'superrationality' claims to provide a *rational justification unique to this specific game structure* for *independently* arriving at the belief supporting the 'Nobody Enters' equilibrium. It claims pure reason, absent any convention or communication, mandates that specific outcome. My critique is that this 'justification' is circular: it only works if everyone already accepts it, and it relies on that implausible reasoning isomorphism. Yes, it's a coordination game. But the 'superrational solution' pretends it's solved by individual reason alone, which is the illusion I'm dismantling. The 'novelty' of the puzzle is its *pretense* that this coordination doesn't need coordination mechanisms."
      *   **Where it's Soft:** This is the hardest hit. It forces you to admit the underlying game structure isn't inherently paradoxical, just tricky. Your whole critique then rests *entirely* on debunking the *specific normative claim* of superrationality as the uniquely rational solution. Emphasise that: "The damage isn't in the game existing; it's in the claim that 'superrationality' is *the* rational solution. *That* claim is what assumes away the coordination problem it needs solved."

  **Final Note:** Your strongest weapon is framing. Hammer "coordination problem in paradox's clothing" and "solution assumes its own population". Your weakest flanks are the lack of a positive alternative model (concede this happily) and the Dreaded Question forcing you to admit the basic game isn't magical. Lean hard on the novelist angle when explaining motivation and the *consequences* of the logic failing. Good luck – you'll need it. They’ll be picking at the soft bits before you’ve finished your first slide. Remember: concede fragility early, then pivot to the coordination critique. And for God's sake, don't say "superrationality" without scare quotes after minute one.
