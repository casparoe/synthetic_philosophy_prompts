answer: |-
  Here's a tight joke built for Meno-readers, hitting your specific tension in a modern ER setting:

  > So an ER intern bursts into the trauma bay, eyes wide, shouting: "Epinephrine! Push epinephrine *now*!"  
  > The attending, startled, follows the order. Patient stabilizes instantly.  
  > Attending turns to the intern: "Good call. How did you know it was anaphylaxis?"  
  > Intern freezes. Pales. "...The... uh... the monitor beeped *really* fast?"  
  > Attending sighs. "Right. Next time, maybe check for swollen lips *before* you gamble with pressors."  
  > And that's how a true belief saved a life... just before bolting out the door the second someone asked for its luggage.

  **Why it works for your brief:**

  1.  **Core Meno Distinction:** The intern's correct action (getting to "Larissa" - saving the life) is driven by a true belief (epinephrine was needed). It *worked* perfectly for the practical goal.
  2.  **The Bolt Moment:** The *instant* the "How do you know?" question hits ("How did you know it was anaphylaxis?"), the true belief crumbles ("...beeped really fast?"). It has no tether (understanding of symptoms/cause).
  3.  **Tension Highlighted:** The joke emphasizes the *functional equivalence* first (life saved!), making the subsequent collapse of the belief highlight the *only* difference Socrates offers: stability under scrutiny. The attending's weary comment underscores the *risk* of the untethered belief – it worked *this time*, but it was a gamble based on a shaky sign.
  4.  **Modern Setting (ER):** High stakes, immediate practical consequences, and a natural reason for the "How do you know?" question (medical accountability).
  5.  **Daedalus Nod:** "Bolting out the door" subtly evokes the runaway statue imagery without being explicit.
  6.  **For Meno Readers:** The punchline hinges entirely on recognizing the moment the unchallenged true belief becomes challenged and fails – the core Meno dynamic. The "luggage" quip implies the missing "account" (aitias logismos) needed to tie it down.
  7.  **No Cheap Shots:** Focuses purely on the Meno's offered distinction and its practical tension. No Gettier, no JTB definition gags, no philosopher bashing.

  **The Landing:** The audience laughs at the intern's sudden panic, recognizing the exact moment Plato described – the untethered belief fleeing interrogation. Simultaneously, they feel the tension: the belief *did* the job as well as knowledge *could* have in that moment, making Socrates' insistence on knowledge's superiority feel precarious, resting solely on its future-proofing against questions the intern couldn't answer. The medical setting makes the gamble visceral.
