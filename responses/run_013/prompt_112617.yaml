answer: |-
  ### Fact-Checking Procedure: Mitigating the Conjunction Paradox  
  **Grounding in Theory**: The preface/lottery paradox shows that high-confidence individual claims (e.g., 90%) compound into near-certainty of error in large batches. Believing a claim requires contextual confidence, not just probability. This procedure enforces transparency and strategic hedging to preserve credibility.  

  ---

  #### **10-Minute Checklist**  
  **Run this after standard fact-checking, pre-deadline.**  

  1. **Per-Claim Threshold Check (Rule)**  
     - **Standard**: 90% confidence = publishable.  
     - **Action**:  
       - ≥90%: No change.  
       - 80–89%: *Must* add a **single hedge** (e.g., "likely," "evidence suggests," "according to X").  
       - <80%: Remove or rewrite. If load-bearing and critical, escalate to editor for kill/restructure.  
     - **Judgment**: Is the claim *load-bearing*? (If central to the argument, tolerate no hedging unless unavoidable.)  

  2. **Batch Error Risk Assessment (Rule)**  
     - **Calculate expected errors**: `Number of claims × (1 - Confidence)`.  
       - *Example*: 40 claims at 90% → 40 × 0.10 = **4 expected errors**.  
     - **Action**:  
       - Expected errors > 1.0 → **Mandatory acknowledgment** (see Step 4).  
       - Expected errors > 2.0 → Remove non-essential claims to reduce count.  

  3. **Hedging Rules (Rule + Judgment)**  
     - **Limit**: One hedge per sentence. Over-hedging (e.g., "may potentially suggest") voids meaning → rewrite or kill.  
     - **Placement**: Attach hedge to the weakest link:  
       - *Weak source*: "Dr. X contends…"  
       - *Contested fact*: "Preliminary data indicates…"  
     - **Judgment**: Does the hedge undermine the narrative? If yes, restructure the argument.  

  4. **Acknowledgment of Uncertainty (Rule)**  
     - **Trigger**: Expected errors > 1.0 OR a load-bearing claim <90%.  
     - **Text**: Use a standardized disclaimer:  
       > "While each fact was rigorously checked, statistical likelihood suggests this piece contains at least one error. We welcome corrections at [email]."  
     - **Placement**: Footnote or end box. *Never* inline—avoids contaminating specific claims.  
     - **Theory Trade-off**: Yes, this slightly dents overall credibility, but suppresses reader backlash when errors surface. Transparency > false certainty.  

  5. **Load-Bearing Claim Protocol (Judgment)**  
     - If a critical claim is 80–89%: Hedge and restructure the argument to **downgrade its centrality** (e.g., "One interpretation, supported by X, implies…").  
     - If load-bearing claim is <80%: Kill the claim → kill/report the section. *Never* hedge a <80% load-bearing claim—it invalidates the core argument.  

  6. **Conjunction Test (Judgment)**  
     - Does the argument require *all* claims to be true? If yes:  
       - Expected errors > 0.5 → Add acknowledgment.  
       - Expected errors > 1.0 → Flag for editor: "Narrative collapse risk."  

  ---

  ### **Case Applications**  
  #### Case 1: 40 Claims, All 90%, Argument Requires All True  
  - **Per-Claim**: All pass.  
  - **Batch**: Expected errors = 40 × 0.10 = **4.0** → Triggers acknowledgment.  
  - **Hedging**: None needed individually.  
  - **Conjunction Test**: Argument fails with one error → **Acknowledgment mandatory**.  
  - **Procedure’s Hard Stance**: Forces acknowledgment despite "clean" individual checks. *You won’t like this*—but statistical honesty prevents reputational damage when errors emerge.  

  #### Case 2: Load-Bearing Claim at 80%  
  - **Per-Claim**: 80% confidence → **Hedge required** (e.g., "likely" or "studies suggest").  
  - **Load-Bearing Protocol**: Hedge forces argument restructuring (e.g., "If X is true, as some evidence indicates, then Y…").  
  - **Batch**: Expected errors = 1 (if 39 others at 90%: 39×0.10 + 0.20 = **4.1**) → **Acknowledgment required**.  
  - **Procedure’s Judgment Call**: If you *cannot* restructure (e.g., the entire piece hinges on this claim as fact), the editor must kill the piece. Hedging a pivotal <90% claim is epistemically reckless.  

  ---

  ### **Why This Works**  
  - **Speed**: Batch math takes 60 seconds. Hedging/disclaimers add 5 minutes.  
  - **Theory Honored**: Conjunction paradox addressed via expected errors; preface paradox resolved with disclaimers.  
  - **Escape Hatches**:  
    - Step 5 (load-bearing) and Step 6 (conjunction) force editorial judgment—no algorithmic tyranny.  
    - Acknowledgment preserves trust without paralyzing publication.  
  - **Outcome**: Fewer corrections, higher credibility, and no more "we knew something was wrong but published anyway."  

  **Final Tip**: Pair this with a pre-publication "conjunction audit" for pieces >20 claims.
