prompt: |-
  I'm a science-and-ideas reporter and I've somehow ended up as the person who runs fact-checking for our weekly long-form section. Here's the thing that keeps biting us: every sentence in a piece can be one we'd bet on — we hold each claim to roughly a 90% standard — and yet we all know that across forty checkable claims, at least one is going to be wrong, and we publish the whole thing as if it were solid. My editor says thats just journalism. I think it's a real problem and I want a procedure, not a pep talk.

  So: can you take whatever the epistemology here actually says — the lottery paradox, the preface paradox, the idea that believing something is just being confident enough — and turn it into something a fact-checker can run at 11pm on deadline? I want it as a checklist, in order: how to treat a single claim at a given confidence level, when a batch of claims can be asserted together, where hedges go and how many a sentence can carry before it stops saying anything, and whether we should print some version of 'we know at least one thing in here is wrong' — and whether doing that quietly knocks the confidence out of every other sentence too. Ground it in the theory (no citations, I'll look up who said what myself), mark the steps that are real rules versus my judgement in a lab coat, and keep the whole thing runnable in ten minutes a piece.

  Then run it on two cases. One: a feature where all forty claims clear the bar individually and the argument only works if they're all true. Two: a piece where one claim is load-bearing and it comes in at 80%. I want to see where the procedure makes me do something I won't like, and where it just gives up and hands the call back to me.
reasoning: |-
  We are facing a version of the "preface paradox": even if each individual claim in an article is highly probable, the conjunction of many such claims becomes improbable. The lottery paradox similarly shows that even if each ticket is unlikely to win, we must accept that some ticket will win.

   The core problem: We want to assert a set of claims, each with high individual confidence, but the whole set has a lower confidence. How to manage this in fact-checking?

   Proposed Procedure (Checklist):

   1. **Per-Claim Check (Single Claim Confidence):**
      - For each claim, assign a confidence level (e.g., 90%). This is based on the strength of the evidence (primary sources, multiple independent confirmations, expert consensus, etc.).
      - If a claim falls below the threshold (say 90%), then:
          a. We try to improve the evidence (find better sources).
          b. If we can't, we either:
              - Hedge the claim (using words like "may", "suggests", "according to X", "some evidence indicates").
              - Remove the claim if it cannot be adequately supported and is not essential.
          c. If the claim is essential and we cannot reach the threshold, we must flag it for the editor and consider restructuring the argument.

   2. **Batch Processing (Conjunction of Claims):**
      - Calculate the overall confidence for the entire set of claims. If we have `n` independent claims each at confidence `c`, then the probability that all are true is `c^n`.
          - Example: 40 claims at 90% each -> overall confidence = (0.9)^40 ≈ 0.0148 (about 1.5%).
      - This is unacceptably low. Therefore, we cannot assert the entire set as if it were certain.
      - **Action:** We must either:
          a. Reduce the number of claims (remove non-essential ones) to raise the overall confidence.
          b. Increase the per-claim confidence (by requiring more evidence for each claim) so that the product remains acceptable.
          c. Explicitly acknowledge the uncertainty in the piece (more on this below).

   3. **Hedging Rules:**
      - Hedges are words or phrases that express uncertainty (e.g., "likely", "probably", "evidence suggests", "many experts believe").
      - **How many hedges?** A sentence can become weak if over-hedged. Rule of thumb: 
          - One hedge per claim is usually sufficient to indicate uncertainty.
          - Avoid multiple hedges in one sentence (e.g., "It might be possible that...") because they can make the claim vague and uninformative.
      - **Placement:** The hedge should be attached to the part of the claim that is uncertain. For example:
          - "The study suggests that X may cause Y." (if the study is the only evidence and it's not definitive)
      - **When to hedge:** Use when the confidence is below the threshold (say 90%) but above a lower bound (say 70%) where the claim is still worth including. Below 70%, consider removing.

   4. **Acknowledging Overall Uncertainty:**
      - Should we print a version of "we know at least one thing in here is wrong"? 
          - This is the preface acknowledgment. It honestly reflects the conjunction problem.
          - However, it might undermine the reader's trust in the entire piece. 
      - **Trade-off:** 
          - If we do it, we are being transparent and intellectually honest. 
          - But it might lead the reader to discount even the highly certain claims.
      - **Alternative:** 
          - We could instead note the high standard of fact-checking and the possibility of error without quantifying it. 
          - Example: "While we have fact-checked every claim to our high standards, the complexity of the subject means that errors may remain. We welcome corrections."
      - **Recommendation:** 
          - For a long piece with many claims (like 40), include a mild version of the preface acknowledgment in the methodology or a footnote. 
          - However, note that this does not absolve us from trying to minimize errors.

   5. **Handoff to Editor/Judgment:**
      - The procedure will sometimes require judgment calls. We mark these as "Judgment" steps. Specifically:
          - Setting the per-claim confidence threshold (90%? 95%?) is a policy decision.
          - Deciding which claims to remove when the batch confidence is too low is an editorial call (based on the importance of the claim to the narrative).
          - The exact wording of hedges and the overall acknowledgment is also a matter of style and judgment.

   Now, let's run the procedure on the two cases.

   **Case 1: Feature with 40 claims, each at 90% confidence. The argument only works if all are true.**

   Steps:
    1. Per-claim: Each claim meets the 90% bar -> pass individually.
    2. Batch: Overall confidence ≈ 1.5% -> too low to assert the entire set as true.

   Actions:
    a. We must reduce the number of claims. Remove non-essential ones until the overall confidence is acceptable. What is acceptable? Let's set a batch threshold (say 90% overall). 
        - How many claims can we have? Solve (0.9)^n >= 0.9 -> n <= 1. That's not useful.
        - Alternatively, set a more lenient overall threshold? But the argument requires all to be true, so we need the whole conjunction to be above, say, 90%. Then we require each claim to be at least 0.9^(1/40) ≈ 0.9974 (99.74%). That's too high for journalism.

    b. Therefore, we must restructure the argument so that it does not depend on all 40 claims being simultaneously true. Maybe the argument can be broken into independent segments? Or we can make the piece less absolute?

    c. If we cannot reduce the claims or restructure, then we must include a preface note: "While we have high confidence in each fact presented, the sheer number of facts means it is statistically likely that at least one is in error. We have done our best to minimize errors and will correct any that are found."

    d. Judgment: This is a tough call. The procedure forces us to either:
          - Radically increase the per-claim standard (which may not be feasible).
          - Change the structure of the article so that the argument isn't destroyed by one error.
          - Or, accept the risk and include the note.

    What we won't like: Removing claims might weaken the narrative. The note might make the whole piece seem uncertain. But the procedure doesn't let us ignore the low overall confidence.

   **Case 2: One load-bearing claim at 80% confidence, the rest are above 90%.**

   Steps:
    1. Per-claim: The one claim at 80% is below the 90% threshold -> requires action.
          - Try to improve the evidence? If we can't, then:
          - Hedge: Present the claim as "likely" or "according to some experts" or "preliminary evidence suggests".
          - If it's load-bearing, the hedge must be strong enough to convey the uncertainty but not so strong that the argument collapses.

    2. Batch: The overall confidence is now (0.8) * (0.9)^(39) ≈ 0.8 * (0.9^39) ≈ 0.8 * 0.018 = 0.0144 (about 1.4%). But note the batch is already low because of the 39 claims, so the main issue is the individual claim.

    Actions:
      - Focus on the load-bearing claim. Since it's essential, we must decide:
          - If we hedge it, does the argument still hold? The piece might become: "If X is true, then Y follows." But if X is only 80%, then the conclusion is conditional.
          - Alternatively, can we restructure the argument to not rely solely on this claim? Maybe present alternative scenarios?

      - If we cannot restructure and the claim must be presented as fact, then we have a problem. We might have to:
          - Lower the per-claim threshold for this claim? But that sets a bad precedent.
          - Or, we might have to kill the piece if the load-bearing claim is too weak.

      - The procedure forces us to either hedge the claim (and adjust the argument accordingly) or remove the claim (and thus restructure the piece). 

      What we won't like: We might have to water down the central argument. But the alternative is publishing an argument that we know has a 20% chance of being based on a false premise.

