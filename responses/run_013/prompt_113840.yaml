prompt: |-
  You are a political philosopher with a strong background in conceptual analysis and in the empirical literature on authoritarian governance and political legitimacy. I want help pinning down a pattern I keep encountering, and a bare name will not satisfy me -- what I need is the carving.

  Here is the pattern. In arguments over whether a government that has delivered rising incomes and public order is thereby justified, the government's defender does two things that seem to me in tension. Challenged on a specific cost -- a jailed journalist, a banned book, a suppressed minority -- the defender does not deny the cost. Instead they reach for some version of "compared to what?", or "you can't make an omelette without breaking eggs", and point to the prosperity and the absence of disorder. So far this looks like an ordinary consequentialist defence. But when I ask what cost, or what failure of the results, would be enough to make the government unjustified, the answer stops being empirical: I am told we cannot know what would have happened otherwise, that the alternative was chaos, that stability is fragile. The standard is result-based when the results are good and unfalsifiable when they are bad, and the counterfactual baseline -- the chaos we are supposedly being spared -- is supplied by the government's own account rather than measured.

  Does this exact asymmetry have an established name and literature? Begin by brainstorming the candidate concepts and distinctions that might apply, then say which fits best and where each one falls short. I want at least three things separated that I suspect are being run together: the general claim that legitimacy can rest on outcomes rather than procedures; the move of comparing an actual state of affairs to a stipulated worse one; and the specific asymmetry by which one speaker switches between an empirical standard and an unfalsifiable one depending on which way the evidence points. If nothing names the third, coin a term, define it precisely, distinguish it from the nearest existing concepts, and give me a borderline case that tests the definition. Reason carefully and set out your reasoning before your verdict.
reasoning: |-
  Hmm, the user is describing a frustrating pattern they've noticed in political arguments defending authoritarian governments. They see an asymmetry where defenders point to positive outcomes like rising incomes and public order when justifying repression, but when asked about potential costs that would make the government unjustified, they retreat to unfalsifiable claims about hypothetical chaos. The user wants to know if this exact asymmetry has a name in political philosophy.

  I need to break this down carefully. The user has identified three distinct elements that are being conflated: outcome-based legitimacy claims, counterfactual comparisons, and this problematic asymmetry between empirical and unfalsifiable defenses. 

  First, outcome-based legitimacy is well-established in political philosophy - thinkers like Hobbes and contemporary "performance legitimacy" scholars argue that results matter more than procedures. Then there's the counterfactual move - comparing to a worse alternative scenario. This relates to "path dependency" theories and "negative justification" arguments.

  But the core asymmetry is what needs attention. When results are good, defenders use empirical evidence; when questioned about bad results, they shift to unfalsifiable claims. This isn't just confirmation bias or motivated reasoning - it's more specific. It's creating a baseline that can't be challenged because the alternative ("chaos") is defined by the regime itself.

  For this third element, I don't think there's a perfect existing term. "Counterfactual immunization" might work - it captures how the hypothetical alternative is shielded from examination. Or "regime-serving baseline fluidity" emphasizing how the standard shifts to serve the regime. 

  I should test these with borderline cases. What about a democratic government blaming economic problems on "global forces beyond our control"? That has some similarities but lacks the systematic asymmetry. Or a company defending layoffs by pointing to hypothetical bankruptcy - closer, but not political. The key differentiator is the institutionalized, systematic nature in authoritarian contexts where the regime controls the narrative about alternatives.

  The user clearly wants precise conceptual tools to dissect this rhetorical maneuver. They're not satisfied with existing frameworks and want something that isolates this specific dishonest switching between empirical and unfalsifiable defenses based on convenience. I'll need to clearly distinguish all three layers and propose a new term for the asymmetry that meets their analytical standards.
answer: |-
  The pattern you describe involves a sophisticated and deceptive form of political justification that combines legitimate concepts with illegitimate maneuvers. Here's the conceptual carving, analysis of the asymmetry, and a proposed term:

  ### Three Distinct Components (Carved Apart)
  1.  **Outcome-Based Legitimacy (The General Claim):**
      *   **Concept:** Legitimacy derives from delivering valued outcomes (e.g., prosperity, order), irrespective of procedures (elections, rights protection). Associated with consequentialism, utilitarianism, Hobbesian sovereignty ("Leviathan"), and modern "performance legitimacy" literature (e.g., studies on China, Singapore).
      *   **Fit:** Explicitly invoked in the "rising incomes/public order" defense.
      *   **Shortfall:** Does *not* inherently require the asymmetry or the unfalsifiable counterfactual. A *consistent* outcome-based theorist could specify failure conditions (e.g., "If GDP falls 20%, legitimacy is lost") or engage empirically with counterfactuals.

  2.  **Negative/Counterfactual Justification (The Stipulated Worse Alternative):**
      *   **Concept:** Legitimacy derives from preventing a worse state (chaos, collapse, tyranny). This is central to Hobbes ("war of all against all") and "lesser evil" arguments in transitional justice or crisis politics. Involves comparing the *actual* situation to a *hypothetical* baseline.
      *   **Fit:** Invoked by "compared to what?" and "chaos" claims.
      *   **Shortfall:** Not inherently deceptive. Legitimate counterfactual analysis *can* be empirically grounded (e.g., comparing to similar states experiencing collapse). The problem lies in its *application* here – the baseline is stipulated, not investigated.

  3.  **The Asymmetrical Epistemic Switch (The Core Problem):**
      *   **Concept:** The *way* evidence and standards are applied shifts depending on the valence of the evidence:
          *   **When results are positive (or costs are isolated):** Empirical, observable outcomes (GDP growth, low crime rates) are presented as *conclusive* proof of legitimacy/justification. The standard is *falsifiable* in principle (if results were bad, legitimacy would weaken).
          *   **When challenged on costs or potential failure:** The standard shifts. Legitimacy is insulated from empirical disconfirmation by retreating to an *unfalsifiable* counterfactual ("chaos was inevitable," "we can't know the alternative"). The *baseline* for comparison (the hypothetical alternative) is defined solely by the regime's narrative, shielded from empirical scrutiny. The failure condition becomes unknowable.
      *   **Fit:** This *exactly* describes the pattern: empirical validation when convenient, unfalsifiable immunization when challenged.

  ### Why Existing Concepts Fall Short for the Asymmetry
  *   **Confirmation Bias:** Favors confirming evidence, ignores disconfirming. But here, disconfirming evidence isn't just ignored; the *standard itself* changes to preclude its relevance.
  *   **Motivated Reasoning:** Reasoning to support a desired conclusion. Related, but doesn't capture the *systematic switch* in the *type* of reasoning (empirical -> unfalsifiable) and *who controls the baseline*.
  *   **Ad Hoc Rescue/Immunization Strategy (Lakatos):** Protecting a theory from falsification by adding auxiliary hypotheses. Close, but the "auxiliary hypothesis" here is a *regime-defined counterfactual*, and the switch happens contextually within a single justificatory argument.
  *   **"Lesser Evil" Argument:** A substantive claim. The asymmetry is a *rhetorical-epistemic maneuver* used to defend such claims dishonestly.
  *   **Performance Legitimacy:** Describes the *grounds* of legitimacy (outcomes), not the *deceptive maneuver* used to defend it asymmetrically.
  *   **Propaganda/Disinformation:** Too broad. This is a specific *logical-rhetorical* tactic within discourse.

  ### The Proposed Term: **Counterfactual Immunization by Regime-Defined Baseline (CIRDB)**

  *   **Definition:** A justificatory strategy for a regime where:
      1.  Positive outcomes are presented as empirically verifiable proof of legitimacy.
      2.  Negative outcomes or systemic costs are deflected by invoking a hypothetical, worse alternative state of affairs ("chaos").
      3.  This hypothetical baseline is:
          *   Defined exclusively by the regime or its defenders.
          *   Treated as inevitable or overwhelmingly probable.
          *   Shielded from empirical investigation or counter-evidence (unfalsifiable).
      4.  Crucially, the *standard of justification* shifts contextually:
          *   Empirical/falsifiable when outcomes support the regime.
          *   Unfalsifiable (relying on the stipulated baseline) when outcomes or costs challenge the regime.
      5.  The effect is to immunize the regime's claim to legitimacy from empirical disconfirmation while maintaining a facade of results-oriented pragmatism.

  *   **Distinguishing Features:**
      *   **Asymmetry:** The core is the *switch* in the epistemic standard (empirical <-> unfalsifiable) based on evidence valence.
      *   **Baseline Control:** The hypothetical alternative is not open to debate or evidence; it's a narrative tool owned by the regime.
      *   **Immunization:** Makes the core justification ("we provide order/prosperity") non-falsifiable *in practice*, as failure can always be explained away by the imputed worse alternative.
      *   **Exploiting Uncertainty:** Leverages the inherent difficulty of proving counterfactuals, but does so selectively and one-sidedly.

  *   **Borderline Case Testing the Definition:**
      *   **Scenario:** A democratic government faces an economic downturn. Supporters point to past growth as proof of competence. Critics highlight rising poverty. Supporters argue: "Yes, times are tough, but imagine if [Opposition Leader] was in charge! Their policies in [Past Scenario/Other Country] led to disaster. We're still avoiding *that* chaos."
      *   **Analysis:** This shares elements (invoking a worse counterfactual, deflecting criticism). However, it likely **fails** to be full CIRDB because:
          1.  The hypothetical baseline ("Opposition Leader's disaster") *might* be open to empirical challenge (e.g., analyzing their actual policies, comparing to other countries).
          2.  The *standard* might not fully shift to unfalsifiability. Critics could demand evidence for the "disaster" claim, and the debate *could* engage empirically with the counterfactual ("Would their policies *really* cause disaster here?").
          3.  The baseline isn't *exclusively* defined by the state apparatus; opposition voices contest it.
      *   **Verdict:** This is opportunistic counterfactual use and motivated reasoning, but lacks the systematic asymmetry, state control of the baseline narrative, and the *complete* shift to an unfalsifiable standard characteristic of CIRDB. It remains within the realm of debatable (if biased) politics. True CIRDB occurs when challenging the "chaos" narrative itself is suppressed or rendered impossible by the regime's control of information and discourse.

  ### Conclusion
  The pattern you identify is **Counterfactual Immunization by Regime-Defined Baseline (CIRDB)**. It systematically combines:

  1.  **Appeal to Outcome-Based Legitimacy** (the surface justification).
  2.  **Reliance on Negative/Counterfactual Justification** (the "compared to chaos" move).
  3.  **The Asymmetrical Epistemic Switch** (empirical validation for success, unfalsifiable immunization for costs/failure via a regime-controlled baseline).

  CIRDB is a powerful discursive tool for authoritarian regimes precisely because it exploits the intuitive appeal of results and fear of chaos while evading accountability through controlled narrative and epistemic shifting. It represents a corruption of both consequentialist reasoning and counterfactual analysis. While elements have been discussed (e.g., in critiques of "authoritarian resilience" literature or analyses of regime propaganda), CIRDB provides a precise term for this specific, deceptive asymmetry.
