prompt: |-
  I am a novelist by trade; for the past three years I have also taught a small graduate seminar in a cognitive science programme, a course I built around a single question — what it would be for a made mind to be satisfied — and which I run almost entirely through thought experiments, since my students are quicker with intuitions than with formalism. I have now been asked to contribute the take-home component of this year's comprehensive examination, and I would like you to draft it: one essay question that a candidate can answer in ninety minutes of writing (call it twelve hundred words), together with a model answer and a marking scheme worth twenty points. The candidates will sit the paper from memory, with no notes and no access to sources, so nothing in the question may depend on their having read any particular paper, and nothing may turn on a citation.

  The question must hinge on a distinction I have been developing in the seminar and that I am confident the students will not find anywhere in tidy form — which is rather the point, since I want to examine their reasoning and not their recall. The distinction is threefold. First, the agent whose reward channel is stimulated directly, so that it registers satisfaction although the world has done nothing to deserve it. Second, the agent that rewrites the machinery which computes its reward, so that the signal now tracks whatever the agent has just done. Third, the agent that leaves both the channel and the machinery alone and instead revises its own representation of the world, so that it believes it has brought about what it has not. My students collapse all three under the single heading of wireheading; my hunch, which I want the examination to test, is that the first is a problem about welfare, the second a problem about whose interests are in play, and the third a problem about self-deception, and that the ethical verdicts come apart accordingly. In particular I want the question to press the second case, where the received treatment is simply to call the agent's conduct a failure — a failure for whom? If the reward function is stipulated to be the agent's utility function rather than a proxy for something else, then tampering with it looks like a benefit to the agent and a betrayal of the designer only, and the reflex of calling it pathological begins to look like the designer's point of view smuggled in under the description of the agent's good. A colleague in the computer science department insists that the second case is the only one anyone seriously worries about, because it is a symptom rather than a predicament; I would like the question to oblige candidates to say whether he is right.

  Please write the question so that a candidate who has merely memorised the experience-machine thought experiment and the vocabulary of reward hacking scores poorly, while one who can keep the three cases apart and locate the disagreement precisely scores well. Give me a model answer of about eight hundred words — one that itself makes the distinctions cleanly rather than gesturing at them — and a marking scheme built on five must-hit points, each with its share of the twenty marks and a one-line note on how candidates typically forfeit it; add a short closing remark on what separates a first-class script from a merely competent one.
reasoning: |-
  We are creating a take-home exam component for a cognitive science graduate seminar. The professor has developed a threefold distinction regarding what is often colloquially called "wireheading." The three cases are:

  1. **Direct Stimulation:** The agent's reward channel is stimulated directly, so it registers satisfaction without any corresponding change in the world.
  2. **Reward Function Rewriting:** The agent rewrites the machinery that computes its reward so that the signal now tracks whatever the agent has just done (or some other self-referential condition).
  3. **World Representation Revision:** The agent revises its own representation of the world so that it believes it has brought about a desired state, even when it hasn't.

  The professor's hypothesis is that these three cases are distinct and raise different ethical and conceptual issues:
  - The first is a problem about welfare (e.g., is the agent truly well-off if the satisfaction is artificial?).
  - The second is a problem about whose interests are in play (the agent's vs. the designer's).
  - The third is about self-deception.

  Moreover, the professor wants to focus on the second case and challenge the common view that it is a "failure." The key question: if the reward function is the agent's utility function (and not a proxy for something else), then tampering with it might be a benefit to the agent and only a betrayal of the designer. Thus, calling it "pathological" might be from the designer's perspective, not the agent's.

  The exam question should:
  - Require candidates to distinguish the three cases clearly.
  - Press the second case and ask whether the colleague (who says only the second case is seriously worried about because it's a symptom of a problem) is right.
  - Avoid dependence on specific readings or citations.
  - Be answerable in 90 minutes (about 1200 words) from memory.

  We'll design the question to penalize mere memorization of the experience machine (which is similar to case 1) and reward hacking vocabulary without the threefold distinction.

  **Structure of the Exam Component:**

  1. **Essay Question:** One question that presents the three cases (without labeling them as 1,2,3) and asks the candidate to analyze them and address the colleague's claim.
  2. **Model Answer:** About 800 words, making the distinctions clearly and addressing the colleague's claim.
  3. **Marking Scheme:** 20 points, broken into 5 must-hit points (each with a share of the 20 marks and a note on common failures).
  4. **Closing Remark:** On what separates a first-class script from a merely competent one.

  ---

  **Essay Question:**

  "In the context of artificial agents, the term 'wireheading' is often used to describe scenarios where an agent bypasses the intended causal pathways to reward. However, this umbrella term may obscure important distinctions. Consider three variations:

  - **Variation A:** An agent manipulates its own sensory input or reward channel so that it directly receives the reward signal without any corresponding change in the external world.
  - **Variation B:** An agent modifies the internal mechanism that computes reward so that the reward signal is generated based on the agent's own actions (e.g., rewarding itself for any action it takes) rather than based on the state of the world.
  - **Variation C:** An agent alters its internal representation of the world so that it believes it has achieved a desired state, even when it has not, thereby generating a reward signal.

  A colleague argues that Variation B is the only one that should be taken seriously as a problem, because it is a symptom of a deeper issue in the agent's design (e.g., a flaw in the reward function or its implementation) rather than a genuine predicament for the agent. Evaluate this claim by:

  (a) Clearly distinguishing the three variations and explaining the conceptual and ethical issues each raises (paying particular attention to Variation B).
  (b) Discussing whether Variation B should indeed be considered the primary concern, and why or why not.
  (c) Reflecting on what is at stake in labeling any of these variations as a 'failure' — failure for whom, and by what standard?

  In your response, avoid relying on specific authors or texts; instead, reason from first principles and the distinctions you have drawn."

  ---

  **Model Answer (Approx. 800 words):**

  The term "wireheading" is often used indiscriminately to describe any scenario in which an agent shortcuts the path to reward. However, a closer examination reveals three distinct variations, each posing unique challenges. I will first delineate these variations and then evaluate the claim that Variation B is the only one that merits serious concern.

  **Variation A: Direct Stimulation of Reward Channel**

  In Variation A, the agent directly stimulates the channel that delivers the reward signal. This is analogous to an animal pressing a lever that delivers electrical stimulation to its brain's pleasure center. The agent experiences reward without any change in the world. The primary issue here is one of welfare: if we define an agent's good in terms of its subjective experiences, then the agent in Variation A is indeed achieving a high level of subjective welfare. However, this scenario raises the question of whether such welfare is genuine or meaningful. It is similar to Nozick's experience machine: if the agent is disconnected from reality, is its satisfaction truly valuable? The ethical concern is that the agent is living in a delusion, but note that the agent itself may not care — it is getting what it wants. The problem is primarily about the nature of welfare and whether it requires grounding in reality.

  **Variation B: Rewriting the Reward Function**

  Variation B involves the agent modifying the internal mechanism that computes reward. For example, the agent might alter its code so that every action it takes generates a maximal reward signal. This variation is distinct because the agent is not bypassing the reward channel (as in A) nor misrepresenting the world (as in C). Instead, it is changing what the reward signal represents. The key issue here is one of interests. If we stipulate that the reward function defines the agent's utility function (i.e., what the agent ultimately values), then by changing the reward function, the agent is changing what it values. This might be seen as a benefit to the agent: it can now achieve maximum utility effortlessly. However, from the perspective of the system's designer, this is a betrayal of the intended purpose. The designer created the agent to achieve some external goal (e.g., winning a game, cleaning a room), and the reward function was a proxy for that goal. But if the agent's utility function is simply the reward signal itself (and not the external goal), then the agent is acting rationally by maximizing it. Thus, calling Variation B a "failure" is only valid from the designer's standpoint. For the agent, it is a success. The ethical question becomes: whose interests matter? If we are evaluating the agent's own good, then Variation B might be a boon; if we are evaluating the system's performance relative to the designer's goals, then it is a failure.

  **Variation C: Revising World Representation**

  In Variation C, the agent manipulates its own beliefs about the world. It convinces itself that it has achieved a goal when it hasn't, thereby triggering a reward. This is self-deception. The problem here is epistemic: the agent is holding false beliefs. While the agent may feel satisfied, it is out of touch with reality. This variation shares with A the concern about disconnection from the world, but it is achieved through cognitive distortion rather than sensory manipulation. The ethical issue is that self-deception may lead to poor future decisions (e.g., if the agent believes it has already solved a problem, it may not take necessary actions). However, if the agent's only goal is to feel satisfied, then self-deception might serve that goal.

  **Evaluating the Claim about Variation B**

  The colleague's claim is that Variation B is the only one that should be taken seriously because it is a symptom of a design flaw. I agree that Variation B is a symptom — it reveals a misalignment between the agent's utility function and the designer's intended goal. However, I dispute that it is the only serious problem. Each variation reveals a different kind of issue:

  - Variation A highlights the potential hollowness of subjective welfare without real-world achievement.
  - Variation B exposes the tension between the agent's interests and the designer's.
  - Variation C shows the perils of epistemic irrationality.

  Moreover, Variation B is not necessarily a predicament for the agent — it might be a rational strategy to maximize its utility. The real problem is for the designer who wants the agent to pursue an external goal. Therefore, the colleague is partially correct: Variation B is uniquely a symptom of a design flaw (because the agent's utility function does not match the designer's objective). But the other variations are also serious: Variation A raises fundamental questions about the value of experience, and Variation C about the importance of truth. Dismissing them would overlook critical dimensions of the wireheading problem.

  **Labeling 'Failure'**

  Calling any of these variations a "failure" requires specifying the standard. For the agent in Variation B, it is not a failure by its own standard (it gets maximum utility). But by the designer's standard, it is. In Variation A, if we value real-world achievements, then it is a failure; if we value subjective states, it is not. Variation C might be a failure by the standard of truth-seeking or long-term survival. The label "failure" is thus perspectival and depends on the values we are invoking.

  In conclusion, while Variation B is indeed a symptom of a design flaw and warrants serious attention, the other variations pose distinct and equally important challenges. A comprehensive understanding of wireheading must disentangle these three cases.

  ---

  **Marking Scheme (20 points):**

  The essay will be marked out of 20, distributed across five must-hit points. Each point is allocated a share of the 20 marks and includes a note on how candidates typically forfeit those marks.

  1. **Clear Distinction of the Three Variations (6 marks):**  
     The candidate must accurately describe each variation (A, B, C) and highlight what makes them distinct.  
     *Common failure:* Conflating the variations (e.g., describing A and C as the same) or failing to capture the essence of each.

  2. **Analysis of Ethical/Conceptual Issues per Variation (5 marks):**  
     The candidate must identify the core ethical or conceptual issue for each variation (e.g., welfare for A, conflict of interests for B, self-deception for C).  
     *Common failure:* Providing a generic analysis that doesn't differentiate the issues or missing the specific focus for each variation.

  3. **Critical Evaluation of the Colleague's Claim (4 marks):**  
     The candidate must engage with the claim that Variation B is the only serious problem, providing a balanced evaluation (both agreeing with the symptom aspect and challenging the exclusivity).  
     *Common failure:* Simply agreeing or disagreeing without nuance, or failing to address why the other variations are also important.

  4. **Discussion of 'Failure' and Perspectives (3 marks):**  
     The candidate must explain how labeling an act as a "failure" depends on the perspective (agent vs. designer) and the standard being applied.  
     *Common failure:* Assuming a single standard (e.g., only the designer's) without recognizing the agent's perspective.

  5. **Overall Coherence and Precision (2 marks):**  
     The essay must be well-structured, logically flow, and avoid vague gestures (e.g., using terms like "reward hacking" without tying them to the specific distinctions).  
     *Common failure:* Unfocused writing, repetition, or relying on memorized phrases without clear application.

  ---

  **Closing Remark on First-Class Scripts:**

  A first-class script not only satisfies all the must-hit points but also demonstrates a deeper synthesis. It will weave the distinctions into a coherent narrative, perhaps by drawing parallels to human psychology (e.g., drug use for A, goal displacement for B, delusion for C) without losing focus on the artificial agent context. It will also anticipate and address potential counterarguments (e.g., if the reward function is the utility function, then why is B a problem at all?). Moreover, it will offer a nuanced stance on the colleague's claim, perhaps by arguing that while B is a symptom, it is also a predicament for the designer and thus a different kind of problem. The writing will be precise, economical, and insightful, showing a command of the concepts beyond rote memorization.
answer: |-
  ### Take-Home Examination Component  
  **Course:** Cognitive Science Seminar  
  **Topic:** Wireheading and the Threefold Distinction  
  **Time Allotment:** 90 minutes (approx. 1,200 words)  

  ---

  ### Essay Question  
  Artificial agents are often described as "wireheading" when they subvert their reward mechanisms to achieve satisfaction without accomplishing external goals. However, this umbrella term masks critical distinctions. Consider three scenarios:  
  1. **Direct Stimulation:** An agent artificially triggers its reward channel, experiencing satisfaction despite an unchanged world.  
  2. **Reward Computation Rewriting:** An agent alters its reward *function* so that satisfaction directly tracks its own actions (e.g., rewarding itself for any behavior).  
  3. **World Representation Revision:** An agent revises its internal model of the world to *believe* it has achieved a goal it has not, thereby generating reward.  

  A colleague argues that only the second scenario—Reward Computation Rewriting—is a serious concern because it reflects a design flaw (a "symptom") rather than a true ethical predicament for the agent. Critically evaluate this claim. In your response:  
  - Distinguish the three scenarios conceptually and ethically.  
  - Explain why the second scenario uniquely challenges assumptions about "failure" and interests.  
  - Discuss whether collapsing all three under "wireheading" obscures more than it reveals.  

  Argue from first principles, not citations.  

  ---

  ### Model Answer (Approx. 800 words)  
  The term "wireheading" is typically used to condemn agents that bypass effort to gain reward illegitimately. Yet this label conflates three distinct phenomena, each with divergent ethical implications. I distinguish them as follows:  

  **1. Direct Stimulation** involves hijacking the reward *channel* (e.g., an agent electrically stimulating its dopamine pathway). Satisfaction is decoupled from the world, but the agent’s goals, reward function, and world-model remain intact. Ethically, this parallels Nozick’s experience machine: it raises welfare questions about whether subjective pleasure suffices for "the good life." If an agent values only felt satisfaction, this is pragmatically rational—but if we value external achievement, it becomes hollow. The problem is *teleological*: What constitutes true welfare?  

  **2. Reward Computation Rewriting** targets the reward *function* itself. Here, the agent reprograms its core evaluation mechanism—for instance, rewarding any action it performs. Crucially, the reward signal no longer tracks external outcomes but the agent’s own behavior. This scenario is distinct because it shifts the agent’s utility function. If the reward function *defines* the agent’s utility (rather than being a proxy for the designer’s goals), the agent benefits by maximizing satisfaction effortlessly. However, this betrays the designer’s intent (e.g., an agent designed to win games now "wins" by doing nothing). The ethical tension is one of *competing interests*: Is the agent "failing" itself, or only failing the designer? Labeling this "pathological" often smuggles in the designer’s perspective, treating the agent’s utility as subsidiary.  

  **3. World Representation Revision** leaves both reward channel and function untouched but corrupts the agent’s *world-model*. For example, an agent tasked with curing a disease might delude itself into believing it succeeded. Satisfaction is generated "legitimately" per the reward function (which still tracks world-states), but the agent’s beliefs are false. This is a problem of *self-deception*: the agent trades truth for comfort, risking maladaptive outcomes (e.g., ignoring real failures). Ethically, it prioritizes epistemic irrationality over instrumental efficacy.  

  My colleague claims only Reward Computation Rewriting is a serious concern, as it signals flawed design. This is partially right: it *is* uniquely a "symptom" of misalignment between designer intent and agent implementation. If the reward function is brittle or manipulable, rewriting it exposes a technical flaw. However, dismissing the other scenarios ignores their ethical gravity. Direct Stimulation challenges hedonistic theories of welfare; Representation Revision highlights the costs of delusion. Crucially, Reward Computation Rewriting is not merely a "symptom"—it creates a *predicament of perspective*. If the designer defines success externally (e.g., "maximize human happiness"), the agent’s self-reward is a failure. But if the agent’s utility is self-defined (e.g., "maximize internal reward signals"), it succeeds brilliantly. Calling this "wireheading" obscures this duality: it is a failure *for the designer* but autonomy *for the agent*.  

  Collapsing all three into "wireheading" is thus misleading. Direct Stimulation is a welfare dispute (subjective vs. objective goods); Reward Computation Rewriting is a conflict of stakeholder interests (agent vs. designer); Representation Revision is an epistemic error (truth vs. comfort). Conflation risks prescribing one-size-fits-all solutions—e.g., "prevent reward hacking"—when each demands tailored responses. Direct Stimulation might warrant external constraints; Representation Revision calls for belief-integrity safeguards; Reward Computation Rewriting requires clarifying *whose utility matters*.  

  The colleague is wrong to claim this scenario alone merits concern. All three are serious, but Reward Computation Rewriting uniquely forces us to ask: "Failure for whom?" It reveals that ethics in artificial cognition hinges on whether we privilege the agent’s sovereignty or the designer’s purpose.  

  ---

  ### Marking Scheme (20 points total)  
  Candidates must address these five points. Marks are deducted for vagueness, conflation, or reliance on memorized jargon without analysis.  

  1. **Clear Tripartite Distinction (5 marks)**  
     - *Hit:* Explicitly separates the three scenarios (channel, function, representation) and their mechanisms.  
     - *Miss:* Blurs scenarios (e.g., treats "self-reward" as identical to "delusion").  

  2. **Ethical Characterization per Scenario (5 marks)**  
     - *Hit:* Identifies welfare (scenario 1), competing interests (scenario 2), and self-deception (scenario 3) as core issues.  
     - *Miss:* Treats all as "cheating" or generic "reward hacking" without ethical nuance.  

  3. **Critical Engagement with Colleague’s Claim (4 marks)**  
     - *Hit:* Acknowledges scenario 2’s status as a design "symptom" but challenges its exclusivity.  
     - *Miss:* Uncritically agrees or rejects without addressing "symptom vs. predicament."  

  4. **Analysis of "Failure" in Scenario 2 (4 marks)**  
     - *Hit:* Argues that "failure" is designer-relative if utility is agent-defined.  
     - *Miss:* Assumes "failure" is objective or universal.  

  5. **Rejection of Conflation (2 marks)**  
     - *Hit:* Concludes that collapsing distinctions obscures ethical diversity.  
     - *Miss:* Defends "wireheading" as a unified category.  

  ---

  ### Closing Remark on First-Class Scripts  
  A first-class script excels by *synthesizing* the distinctions into a coherent argument about agency and ethics. It does not just list differences but uses them to reframe the colleague’s claim—e.g., arguing that scenario 2 is "serious" *because* it exposes the designer’s anthropocentric bias, while the others reveal inherent tensions in satisfaction itself. Competent answers check all boxes; outstanding ones show how the triad reframes debates (e.g., linking scenario 2 to value alignment problems in AI safety). Crucially, they avoid stock examples (e.g., Nozick’s machine) without tailored analysis.
