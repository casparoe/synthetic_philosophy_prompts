prompt: |-
  Our hospital's clinical ethics committee has drifted into a pattern on advance directives that nobody has ever written down, and I want to know what it commits us to before Thursday's meeting.

  Four cases have shaped us. First, a woman in advanced dementia whose properly witnessed directive refused artificial nutrition and hydration; she showed no distress and no discernible wishes about anything. We honoured the directive and let her die. Second, a man who, while well, had ticked the box on a standard form demanding that everything possible be done for him whatever happened; after a devastating stroke he survived for months in a state of minimal awareness, without evident distress but in an existence he would once have called intolerable. We honoured the directive and carried on treating. Third, a woman who, within weeks of being diagnosed with depression, wrote that she would rather die than become a burden; years later, with moderate dementia but plainly content, engaged with her grandchildren and saying she wanted to live, we set the directive aside and treated her. Fourth, a woman with bipolar disorder who, while well, had signed a self-binding instruction of the kind usually called a Ulysses contract, refusing admission during future manic episodes; when she arrived in a manic episode and refused treatment, we treated her all the same.

  Next week's case is a woman who, while competent, refused in advance all life-sustaining treatment once she could no longer recognise her family, adding an explicit self-binding clause: that even if she later seemed happy and asked to live, she wanted the earlier wish to win, because she knew she might change. She now fails to recognise her family, is cheerful, enjoys music and says she wants to live. She has a treatable infection which, left untreated, will kill her.

  Tell me what we should decide if we are to remain faithful to our own track record. Say which competing rules fit the four cases and what each predicts here, which case is the nearest analog and why, and, if the precedents genuinely underdetermine the matter, which principle we would be taking on with either outcome. Then give me a single committed recommendation with your reasons, rather than a survey of options, and name the further case that would best separate the readings you have identified. Please write in British English.
reasoning: |-
  Okay, the user is part of a clinical ethics committee facing a complex advance directive case and needs clarity before Thursday's meeting. They've outlined four precedent cases that have shaped their committee's unspoken principles, and now a fifth case is challenging those patterns. 

  First, I need to unpack what their track record reveals. That dementia case where they honoured the directive despite the patient's apparent comfort suggests they prioritise written autonomy over observed wellbeing when no contradictory expressions exist. The stroke patient case where they followed the "treat everything" directive even when it prolonged suffering shows they'll enforce clear instructions rigidly, almost like a contract. Then the depression case where they overrode the directive because the patient's current wishes contradicted past ones - that introduces a wellbeing exception when competence is questionable. The bipolar Ulysses contract is the outlier: they enforced treatment against present refusal, prioritising past rational self over present impaired self.

  For next week's case - a woman who anticipated losing capacity and explicitly bound her future self, but now seems happy - the precedents pull in opposite directions. The stroke case analogy would say "honour the directive" because it was explicit and self-binding. But the depression case analogy would say "override" because her current self is expressing wishes. The Ulysses contract is closest formally (both are self-binding), but practically different because this is about ending life, not compelling treatment.

  Hmm... the committee's tension is between two competing rules: "Literal adherence to written directives" versus "Overriding directives when current observable wellbeing contradicts past predictions." Their track record shows they only break from directives when there's both clear current consent/wellbeing AND questionable past competence (depression case) or when overriding protects the patient's own defined interests (Ulysses). Neither applies cleanly here - she anticipated this exact scenario.

  If they honour the directive, they're committing to a view that future incapacity can validly bind a future self. If they override, they're saying happiness trumps prior autonomy. The Ulysses precedent supports the former, but the stakes feel higher with life-ending decisions. 

  My recommendation leans toward honouring the directive, but I'm uneasy. They need a test case that isolates the "happy but incapacitated" dilemma without complicating factors - say, a patient without self-binding language but similar circumstances. That would force them to choose between wellbeing and autonomy pure and simple. 

  For Thursday, they must confront whether their Ulysses principle extends to end-of-life decisions. I think it should, but they'll need steel nerves.
answer: |-
  Based on your committee's established pattern from the four cases, here's the analysis and recommendation for Thursday's case, using British English:

  **Competing Rules from Precedents:**
  1.  **Rule of Literal Adherence (Cases 1 & 2):** When a patient lacks current capacity *and* expresses no discernible wishes contradicting a clear, properly executed advance directive, the directive must be honoured strictly as written, regardless of the patient's apparent state of wellbeing or the perceived burdensomeness of the treatment. (Supported by Case 1 - Dementia/ANH refusal & Case 2 - Stroke/"Treat Everything").
  2.  **Rule of Contemporaneous Wellbeing & Competence Override (Cases 3 & 4):** An advance directive can be overridden when:
      *   The patient *currently* expresses competent wishes contradicting the directive (Case 4 - Bipolar/Ulysses: *Current* refusal overridden by *past* instruction for treatment).
      *   OR, the patient *currently* expresses wishes or demonstrates a state of wellbeing fundamentally inconsistent with the directive's assumptions, *and* there is strong evidence the directive was made under conditions significantly impairing rational foresight (e.g., acute depression - Case 3). Here, the patient's *current* apparent contentment overrode the *past* refusal based on burden.

  **Predictions for Next Week's Case:**
  *   **Rule 1 (Literal Adherence) Predicts:** Honour the directive. Refuse antibiotics. The directive is clear, properly executed, anticipates the *exact* scenario (loss of recognition, subsequent apparent happiness/request to live), and includes an explicit self-binding clause. She currently lacks capacity to make this complex decision anew (inability to recognise family is a key marker of significant dementia). No discernible distress or contradictory *competent* wish exists.
  *   **Rule 2 (Contemporaneous Override) Predicts:** Override the directive and treat. She is currently cheerful, expresses a wish to live, and enjoys activities (music). Her current state of contentment and expressed wishes are fundamentally inconsistent with the bleak future she anticipated when making the directive. Her current experiential wellbeing justifies overriding her past directive, similar to overriding the depressed woman's directive (Case 3).

  **Nearest Analog:**
  The **bipolar/Ulysses contract case (Case 4)** is the closest analog. Both involve:
  1.  An explicit, self-binding instruction made when competent.
  2.  A directive designed precisely to countermand the anticipated future impaired state (mania vs. advanced dementia).
  3.  The patient arriving in the predicted impaired state and expressing wishes contrary to the directive's instructions (refusing treatment vs. requesting treatment/life).
  4.  The core ethical tension: respecting the competent past self's binding instructions vs. respecting the expressed wishes of the current (impaired) self.

  **Underdetermination and Principle Adoption:**
  The precedents *do* underdetermine this case slightly, primarily due to the **nature of the intervention and outcome**:
  *   Case 4 (Ulysses) involved *overriding a current refusal of treatment* to *enforce treatment* mandated by the past self. The outcome was sustaining life based on the past self's wishes.
  *   This case involves *overriding a current request for treatment/life* to *enforce non-treatment* mandated by the past self. The outcome would be allowing death based on the past self's wishes.
  *   The core principle from Case 4 upheld was: **"The competent past self's binding instructions regarding future impaired states should prevail over the contemporaneous wishes expressed during that impaired state when the directive explicitly anticipates and addresses that scenario."**
  *   Applying this principle here would lead to honouring the directive and withholding antibiotics.
  *   *If* the committee overrides the directive, it would be adopting a new principle: **"The experiential wellbeing and expressed wishes of a patient in a state of contentment, even with significant cognitive impairment, supersede a prior self-binding directive refusing life-sustaining treatment in that specific state, regardless of the directive's clarity and anticipation of this scenario."** This moves beyond Case 3 (which involved questionable competence at the time of the directive) and Case 4 (which involved enforcing treatment).

  **Committed Recommendation and Reasons:**
  **Recommendation: Honour the advance directive and withhold antibiotic treatment.**

  **Reasons:**

  1.  **Fidelity to the Strongest Precedent (Case 4/Ulysses):** This case aligns most powerfully with the principle established in the Ulysses contract. Your committee explicitly prioritised the competent past self's binding instruction over the contemporaneous refusal expressed during the impaired state (mania). This patient made an equally explicit, self-binding instruction anticipating *this exact scenario* (loss of recognition, subsequent happiness/request to live) and demanding her prior wish prevail. Consistency demands applying the same principle: the competent past self's directive governs.
  2.  **Explicit Anticipation and Self-Binding Clause:** The directive doesn't just refuse treatment; it explicitly addresses and rejects the *very argument* for overriding it based on her current happiness and expressed wish. She *knew* she might change and *specifically instructed* that her earlier wish should win. Ignoring this clause fundamentally disrespects her autonomy exercised when competent.
  3.  **Lack of Contradictory Competence:** Unlike the depression case (Case 3), there is no evidence her competence was impaired when she made this directive. Unlike the Ulysses case, she is *not* currently competent to make a complex decision about life-sustaining treatment – her inability to recognise family signifies significant dementia impairing the capacity for such a nuanced judgment. Her current "want to live" is an expression of immediate contentment, not a reasoned reassessment of her values and future in light of her condition, which she previously deemed unacceptable without recognition.
  4.  **Preserving Trust in Advance Directives:** Consistently upholding clear, explicit self-binding directives made when competent is crucial for the integrity of advance care planning. Overriding this directive, especially given its specific clause, risks undermining confidence in the process for other patients.
  5.  **Distinction from Case 3:** The depression case involved a directive made under a cloud of potentially impaired judgment due to acute mental illness. This case involves a directive made when well, specifically contemplating future cognitive decline and explicitly binding her future self. The rationale for overriding is far weaker here.

  **The Best Test Case to Separate the Readings:**
  A case involving a patient who, while competent and without documented mental illness, made a clear advance directive refusing specific life-sustaining treatment if they reached a state of profound physical disability (e.g., permanent ventilator dependence), *without* an explicit self-binding clause anticipating changed feelings. They now find themselves in that exact state. They are not distressed, report moments of contentment or pleasure (e.g., listening to audiobooks, visits), and occasionally express a generalised "I want to live" or do not actively request death, but they also do not demonstrate the capacity for complex decision-making due to their condition.

  *   **How it Separates the Readings:**
      *   **Rule 1 (Literal Adherence) Predicts:** Honour the directive. No contradictory competent wish exists; the directive is clear and applicable.
      *   **Rule 2 (Contemporaneous Override - as potentially applied in the new case) Predicts:** Override and treat. The patient expresses a wish to live/is not distressed/experiences some wellbeing, contradicting the directive's underlying assumption of intolerability.
      *   **The Key Difference from Thursday's Case:** The *absence* of the explicit self-binding clause. This test case would force the committee to decide whether *any* expression of contentment/continued will to live by an incapacitated patient is sufficient to override a clear directive, even without the complicating factor of a clause specifically designed to prevent that override. It isolates the core tension between past autonomous choice and current experiential state more purely than the Ulysses or Thursday's case.
