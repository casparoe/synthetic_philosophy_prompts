answer: |-
  ### Mediation Procedure Based on the Proportional Bargaining Rule (Kalai-Smorodinsky Solution)

  **Purpose**: To resolve two-party resource disputes where parties must continue collaborating, the mediator has no authority to impose outcomes, and the solution must be efficient, symmetric, and robust to rescaling. The procedure prioritizes a single sitting (≤1 hour), minimal disclosure, and clear rules for when the ombudsperson decides vs. when the director must intervene.

  **Key Constraints Addressed**:
  - **Disagreement point (BATNA)**: Elicited by mediator; parties may misreport.
  - **Aspiration point**: Vulnerable to gaming; must be anchored to feasibility.
  - **Non-convex feasible sets**: Lumpy resources (e.g., instrument blocks) are allowed.
  - **Three-party disputes**: Not supported (explicitly flagged as "no solution").
  - **Authority**: Ombudsperson may finalize non-disputed splits; disputed inputs go to the director.

  ---

  ### Step-by-Step Procedure  
  *Arithmetic steps* are mechanical. *Judgment steps* require mediator inference (disputes here go to director).

  1. **Define the Feasible Set (Judgment)**  
     - Parties jointly list all **discrete allocation options** (e.g., "Lab A gets the microscope block," "Lab B gets it").  
     - *Mediator role*: Exclude options worse for both than no deal. If options are ambiguous (e.g., "partial shares"), note non-convexity—**fractional allocations are forbidden if setup costs harm both parties**.  
     - *Output*: A list of options (e.g., for microscope time: [Option X: Lab A wins block, Option Y: Lab B wins block]).

  2. **Elicit Disagreement Payoffs (BATNA) (Judgment)**  
     - Separately ask each party: "What happens if no deal is reached? Quantify the **net benefit** relative to your best alternative (e.g., cost savings, lost productivity)."  
     - *Mediator role*: Assign values \(d_A\) (Party A’s BATNA) and \(d_B\) (Party B’s BATNA). Cross-check with evidence (e.g., external pricing). If parties misreport, use independent estimates.  
     - *Risk*: Overstated BATNA inflates a party’s leverage. Disputed BATNAs → escalate to director.

  3. **Assign Utilities for Each Option (Judgment)**  
     - For each option from Step 1, ask: "What is the **net benefit** to each party compared to their BATNA?" (e.g., "If Lab A wins the block, their utility = cost savings vs. external rates; Lab B’s utility = 0 if no savings").  
     - *Mediator role*: Ensure utilities are **zero-normalized** (i.e., BATNA = 0). Reject inflated claims (e.g., aspirational "wishful thinking" utilities). Disputed utilities → escalate.

  4. **Compute Aspiration Point (Arithmetic)**  
     - Calculate:  
       - \(a_A =\) highest utility Party A achieves in **any feasible option** (given Party B ≥ their BATNA).  
       - \(a_B =\) highest utility Party B achieves in **any feasible option** (given Party A ≥ their BATNA).  
     - *Example*: If Option X gives (500, 0) and Option Y gives (0, 300), then \(a_A = 500\), \(a_B = 300\).  
     - *Safeguard*: Aspirations are **anchored to observed options**, preventing gaming.

  5. **Calculate Proportional Gains for Each Option (Arithmetic)**  
     - For each option, compute:  
       - Party A’s gain ratio: \(t_A = \frac{u_A - d_A}{a_A - d_A}\) (if \(a_A > d_A\); else \(t_A = 0\)).  
       - Party B’s gain ratio: \(t_B = \frac{u_B - d_B}{a_B - d_B}\) (if \(a_B > d_B\); else \(t_B = 0\)).  
       - **Proportionality score**: \(t_{\text{min}} = \min(t_A, t_B)\).  
     - *Non-convexity note*: Directly uses lumpy options—no interpolation.

  6. **Select the Solution (Arithmetic)**  
     - Choose the option with the **highest \(t_{\text{min}}\)**.  
     - Tiebreak 1: If tie, pick the option with **highest \(t_A + t_B\)**.  
     - Tiebreak 2: If still tied, **ombudsperson chooses arbitrarily** (e.g., fairness grounds).  
     - If all options have \(t_{\text{min}} = 0\) → **impasse** (no mutually beneficial deal).

  7. **Finalize the Outcome**  
     - If BATNA/utilities are **undisputed**: Ombudsperson implements the solution.  
     - If inputs are **disputed**: Escalate to director with a recommendation.  
     - **Three parties**: Immediately declare "no solution" and use alternative methods (e.g., rotation, norms).

  ---

  ### Where the Procedure Breaks
  1. **BATNA misreporting**: Mediator’s judgment is critical. Unresolved disputes → director.  
  2. **Aspiration gaming**: Anchored to feasible options (Step 4), limiting inflation.  
  3. **Three-party disputes**: Not applicable. Procedure aborts.  
  4. **Non-convex sets**: Handled explicitly (discrete options only). If no option has \(t_{\text{min}} > 0\), impasse results.  

  ---

  ### Example Runs
  #### Case (a): Microscope Block Dispute
  - **Parties**: Lab A (no alternative), Lab B (can buy external time at $300/block).  
  - **Feasible set** (Step 1):  
    - Option X: Lab A wins block → Utility = (500, 0)  
      (Lab A saves $500 vs. no scope; Lab B uses external and gets 0 gain).  
    - Option Y: Lab B wins block → Utility = (0, 300)  
      (Lab A gets 0 gain; Lab B saves $300 vs. external).  
  - **BATNA** (Step 2): If no deal, both use alternatives:  
    \(d_A = 0\) (Lab A’s cost to miss block), \(d_B = 0\) (Lab B pays external rate).  
  - **Utilities** (Step 3): As above.  
  - **Aspiration point** (Step 4): \(a_A = 500\) (from Option X), \(a_B = 300\) (from Option Y).  
  - **Proportional gains** (Step 5):  
    - Option X: \(t_A = \frac{500-0}{500-0} = 1.0\), \(t_B = \frac{0-0}{300-0} = 0\) → \(t_{\text{min}} = 0\).  
    - Option Y: \(t_A = \frac{0-0}{500-0} = 0\), \(t_B = \frac{300-0}{300-0} = 1.0\) → \(t_{\text{min}} = 0\).  
  - **Solution** (Step 6): Tie with \(t_{\text{min}} = 0\). Tiebreak 1: Sum for X = \(1.0 + 0 = 1.0\), for Y = \(0 + 1.0 = 1.0\) → still tied. Tiebreak 2: Ombudsperson chooses **Option X** (Lab A wins) as Lab A has no alternative.  
  - **Outcome**: Ombudsperson implements Lab A winning the block.

  #### Case (b): Authorship Order (Three Parties)
  - **Parties**: Three co-authors dispute name order.  
  - **Procedure**: **Aborts immediately**. No two-party rule applies.  
  - **Recommendation**: Use norms (e.g., lead author = first, alphabetical), rotation, or external guidelines.  

  ---

  ### Final Output for Ombudsperson’s Office
  - **Inputs required**: List of options, BATNAs, utilities.  
  - **Time**: ~30–45 minutes for two-party disputes.  
  - **Authority**: Ombudsperson finalizes if inputs are undisputed; director resolves disputes.  
  - **When it misfires**:  
    - Misreported BATNA/utilities → bad solutions.  
    - Three parties → no solution.  
    - No \(t_{\text{min}} > 0\) → impasse.  
  - **Strengths**: Symmetric, efficient, and transparent—parties see how options are scored.  

  **Note**: For authorship disputes, pair-wise applications are invalid. Develop a separate protocol.
