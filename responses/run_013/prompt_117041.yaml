   The Kalai-Smorodinsky solution for two parties:
     - We have a feasible set S of possible utility outcomes (u1, u2). 
     - We have a disagreement point d = (d1, d2) which is the outcome if no agreement is reached.
     - The ideal point (or aspiration point) a = (a1, a2) is defined by:
          a1 = max { u1 | (u1, u2) in S for some u2 >= d2 }
          a2 = max { u2 | (u1, u2) in S for some u1 >= d1 }
     - The solution is the unique point on the Pareto frontier of S that lies on the line segment connecting d and a.

