  **Single feature doing the work**: The feature is that there are multiple ways at the individual level to achieve the same aggregate outcome (e.g., Team Alpha and Team Beta achieve high productivity through different distributions of help). This is known as multiple realizability. The aggregate regularity is multiply realizable at the micro-level.

  **If removed, collapses to trivial individualism**: If there were only one way that the individual-level facts could realize the aggregate pattern (e.g., every above-threshold team had to have the same individual productivities), then the individualist could provide a single micro-explanation that covers all cases.

  **Does the case prove too much?**: This structure is analogous to cases in physics where macro-level properties (like temperature) are multiply realizable by micro-states. So yes, the case does suggest that macro-explanations in physics are also irreducible in the same explanatory sense. However, the individualist in physics (reductionist) might argue that the micro-level still causally determines everything, and the macro is merely a summary. The debate in social science is whether the practical inaccessibility of the micro-details and the robustness of the macro-pattern warrant an explanatory autonomy that is stronger than in physics, given the intentionality of human actions.

  This case should work for the seminar.
