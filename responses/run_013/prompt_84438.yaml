  ### Case: The Workplace Shift Change at Metro Hospital

  **Scenario:**  
  Metro Hospital has multiple nursing shifts. Each shift has 10 nurses, and the hospital tracks patient recovery rates. The aggregate regularity is this: **shifts where at least 70% of nurses hold specialized trauma certifications (T-Certs) have a 15% higher patient recovery rate than shifts below this threshold**, regardless of individual nurse workloads or patient assignments. This holds even though every nurse acts independently—they only treat patients assigned to them, with no direct collaboration.  

  - **Case 1 (High-Skill Shift):**  
    7 T-Cert nurses (70%), 3 non-T-Cert. Each T-Cert nurse handles complex cases efficiently (e.g., 10 recoveries/week), while non-T-Cert nurses handle routine cases (e.g., 5 recoveries/week). The *individual mechanism*: T-Cert nurses prevent minor complications from escalating, so patients recover faster. Non-T-Cert nurses focus on stable patients. Total recoveries: (7 × 10) + (3 × 5) = 85.  

  - **Case 2 (Mixed-Skill Shift):**  
    Also 7 T-Cert nurses (70%), 3 non-T-Cert. Here, T-Cert nurses are overloaded and can only manage 7 recoveries/week each. Non-T-Cert nurses handle more complex cases due to staffing quirks but lack expertise, averaging only 3 recoveries/week. The *individual mechanism*: T-Cert nurses stabilize critical patients quickly (freeing up resources), while non-T-Cert nurses struggle, but the high T-Cert proportion ensures complications are contained early. Total recoveries: (7 × 7) + (3 × 3) = 58 + 9 = 67.  

  *Aggregate result for both shifts:* Recovery rates are 15% higher than shifts below 70% T-Cert (e.g., a 60% T-Cert shift averages 50 recoveries). The same 70% threshold explains the boost, but the individual-level facts—nurse workloads, patient assignments, and recovery rates—differ wildly.  

  ---

  ### Philosophical Breakdown  

  1. **Two Readings of What's Going On:**  
     - **Aggregate Explanation:** The 70% T-Cert threshold explains the recovery boost. It captures a systemic feature—sufficient expertise density—that ensures patient complications are managed proactively, regardless of how individual nurses achieve it.  
     - **Individualist Explanation:** Only individual nurses and their actions matter. The recovery boost is fully explained by the specific decisions of each nurse (e.g., how they triage patients), not by the "threshold."  

  2. **Individualist's Re-Description:**  
     The individualist argues the aggregate is just a summary. The micro-facts (e.g., Nurse A treated Patient X, preventing complication Y) "screen off" the macro-fact: once we know all individual actions, the threshold adds nothing. For example:  
     - In Case 1, the 85 recoveries are explained by high nurse skill.  
     - In Case 2, the 67 recoveries are explained by efficient triage by T-Cert nurses.  
     The threshold is redundant because individual actions alone determine outcomes.  

  3. **Cost of the Re-Description:**  
     The individualist loses predictive and explanatory robustness. The *same* aggregate pattern (70% threshold → 15% boost) holds across shifts with divergent micro-details (e.g., Nurse workloads differ, patient assignments vary). To explain why the boost occurs, the individualist must give a new micro-story each time. But the hospital doesn’t need those details—it can reliably predict outcomes using the threshold alone, even when micro-conditions are unpredictable (e.g., sudden staff changes). The aggregate explanation is invariant; the micro-explanation is not.  

  4. **Strongest Individualist Reply (Exclusion Worry):**  
     "If individual actions fix the outcome, the threshold isn’t a causal difference-maker. At best, it’s *explanatorily autonomous* (useful for prediction) but not *causally autonomous*. For instance, if we alter micro-details (e.g., make non-T-Cert nurses more skilled), the threshold might not hold. True causation lives at the individual level."  

  ---

  ### Key Feature and Limits  
  - **Single Feature Doing the Work:** **Multiple Realizability**. The aggregate regularity (70% threshold → 15% boost) is realized by wildly different micro-configurations (e.g., high skill vs. high triage efficiency). This is why the individualist cannot provide a single, unifying micro-explanation.  
  - **If Removed:** If all shifts with 70% T-Cert had identical micro-details (e.g., all nurses had the same workload), the case collapses. The individualist trivially wins by citing one micro-story for all instances.  
  - **Does It Prove Too Much?** Yes—it parallels physics (e.g., temperature as an aggregate of molecular motion). But unlike physics, social science deals with intentional actions. A critic might argue: "If the aggregate is irreducible here, why not in physics too?" However, the case *doesn’t* prove too much because intentionality adds contingency (e.g., nurses *choose* triage strategies). In physics, micro-states are law-governed; here, micro-details are unpredictable, making aggregate explanations *practically indispensable* even if ontologically reducible.  

  **Use in Class:** Write the scenario on the board, then walk through Cases 1 and 2 to show how micro-details diverge while the aggregate holds. Highlight the hospital’s perspective: they see the threshold as causal because it reliably guides staffing decisions when micro-details are unknown.
