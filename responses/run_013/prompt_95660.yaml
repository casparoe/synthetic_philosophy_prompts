answer: |-
  ### Final Examination Question: Blame, Hypocrisy, and Standing

  **Time Allowed:** 75 minutes  
  **Total Marks:** 25  
  **Instructions:** Answer all parts of the question. You may not use any texts or notes. No citations or quotations are expected. Write your answers in the booklet provided.  

  ---

  **The Case**  
  Dr Hart, a senior researcher at the Perrin Institute, was sanctioned several years ago for fabricating results in two published papers. She has since been candid about her misconduct and now serves on the Institute’s Research Integrity Panel. Dr Neale, a colleague of similar seniority, has just been found to have fabricated a figure in a grant application. At a laboratory meeting, Hart publicly rebukes Neale, calling her conduct "inexcusable" and demanding she resign. Four features are salient:  
  1. Neale’s fabrication occurred under the same intense career pressure Hart cites as the cause of her own misconduct.  
  2. Neale claims (plausibly) that Hart’s prior misconduct and its mild sanction led her to believe such actions were tacitly accepted at the Institute.  
  3. The primary victim of Neale’s fabrication is a doctoral student, whose unpublished results she used without acknowledgement; Hart frames her rebuke as "speaking for" this student.  
  4. Hart has nothing to gain professionally from criticising Neale and shows no self-interest.  

  **Part (a)**  
  (i) Does Dr Hart possess the *moral standing* to blame Dr Neale?  
  (ii) Explain how *each* of the four features above influences your answer.  
  **(10 marks)**  

  **Part (b)**  
  Two rival accounts of moral standing are:  
  - The **Gatekeeping Thesis**: Standing is a precondition for the act of blaming. If the blamer lacks standing, no valid blame occurs.  
  - The **Uptake Thesis**: Standing concerns only whether the blamed person has reason to take the rebuke seriously.  
  (i) Adjudicate between these theses using the case.  
  (ii) What evidence in the case would support each thesis?  
  **(9 marks)**  

  **Part (c)**  
  (i) Does it matter whether Hart’s own past wrongdoing was *excused* (or excusable) rather than *justified*?  
  (ii) What does this imply for the *tu quoque* ("you also") objection to her standing?  
  **(6 marks)**  

  ---  
  ### Model Answer (703 words)  

  **Part (a)**  
  Hart’s standing to blame Neale is contested. Her hypocrisy appears to undermine it, yet her role as a proxy for the victim may redeem it. Each feature shapes this tension:  

  1.  **Shared career pressure**: This directly invokes *tu quoque* hypocrisy. Hart’s identical motivation weakens her standing by suggesting her blame is inconsistent—she condemns in Neale what she excused in herself. If standing requires moral credibility, this feature erodes it.  
  2.  **Neale’s reliance on Hart’s example**: Neale’s belief that misconduct was "how things are done" compounds the hypocrisy concern. Hart’s prior actions (and light sanction) functionally *normalised* the behaviour she now condemns. This not only fuels *tu quoque* but suggests Hart bears partial responsibility for Neale’s misjudgement, further diminishing her authority to blame.  
  3.  **Harm to the doctoral student**: This feature potentially *grants* Hart standing as the student’s advocate. Those wronged (or their representatives) often possess unique standing to blame, irrespective of their own flaws. Hart’s framing of her rebuke as speaking *for* the victim distinguishes this from mere personal censure, offering a moral basis transcending her hypocrisy.  
  4.  **Hart’s lack of self-interest**: While this negates suspicions of malice or opportunism, it cannot resolve the core inconsistency. Neutral motives may prevent *additional* standing defects but do not cure prior hypocrisy or normalisation.  

  Ultimately, Hart lacks standing *as a peer* due to features 1 and 2, but may retain it *as the victim’s delegate* due to feature 3. The case thus shows standing is context-sensitive and role-dependent.  

  **Part (b)**  
  The Gatekeeping and Uptake theses yield starkly different verdicts on Hart’s rebuke.  

  - **Gatekeeping Thesis**: This renders Hart’s blame *void*. Standing is a validity condition: hypocritical blame is no blame at all. Evidence includes features 1 and 2. Hart’s identical misconduct (feature 1) and her role in setting institutional norms (feature 2) make her blame intrinsically illegitimate—akin to a thief condemning theft. Her speaking for the student (feature 3) fails to restore standing because hypocrisy corrupts the act itself; she cannot "borrow" moral authority while her own is compromised.  
  - **Uptake Thesis**: Here, standing hinges on whether Neale has reason to heed the rebuke. Hart’s hypocrisy (features 1-2) gives Neale grounds to dismiss it as unfair (*tu quoque*). However, feature 3 provides countervailing reasons: Neale *should* attend to the rebuke because it highlights harm to a third party, irrespective of Hart’s flaws. Feature 4 (no self-interest) slightly strengthens uptake by removing distractions. Evidence for this thesis is Neale’s *plausible dismissal* based on Hart’s history versus her *duty to consider* the victim’s perspective.  

  Adjudication turns on whether blame’s efficacy or its inherent legitimacy matters more. The case favours the Gatekeeping Thesis. Hart’s profound inconsistency (features 1-2) is not merely a barrier to Neale’s receptiveness; it invalidates her moral position entirely. Even representing the victim (feature 3) cannot offset this, as hypocrisy taints the act of blame *itself*. The Uptake Thesis underestimates how the blamer’s history can nullify moral authority, reducing standing to mere psychological impact. The case shows gatekeeping better captures blame’s normative core: only those with "clean hands" can perform the speech-act of condemnation.  

  **Part (c)**  
  Whether Hart’s past wrongdoing was *excused* (e.g., due to duress) rather than *justified* (e.g., as morally permissible) is crucial.  

  - A *justification* implies Hart’s fabrication was, in her circumstances, morally acceptable. If so, her blame of Neale is consistent—Neale’s act lacks the same justification. *Tu quoque* then fails, as their actions are morally distinct.  
  - An *excuse*, however, concedes Hart’s act was wrong but pardons her due to mitigating factors (e.g., career pressure). This sustains *tu quoque*: Hart condemns Neale for wrongs she herself committed under identical pressures (feature 1). Excuses admit fault; thus, Hart’s standing remains compromised by hypocrisy.  

  The case implies Hart’s wrongdoing was *excused*, not justified. Her reference to "inexcusable" conduct suggests she views fabrication as inherently unjustifiable, merely mitigated in her own case by context. This deepens the *tu quoque* objection: if both acted wrongly under the same pressures, Hart’s standing is doubly undermined by her failure to acknowledge that her excuse applies equally to Neale. It confirms that her blame is not merely ineffective (Uptake) but illegitimate (Gatekeeping).  

  ---  
  ### Marking Scheme  

  **Part (a) (10 marks total)**  
  - **1 mark**: Recognises standing is contested/ambiguous in this case.  
  - **2 marks per feature (×4 = 8 marks)**:  
    - Feature 1: Identifies *tu quoque* hypocrisy as undermining standing.  
    - Feature 2: Explains how Hart’s prior conduct *normalised* wrongdoing, diminishing authority.  
    - Feature 3: Notes that representing the victim may *confer* derivative standing.  
    - Feature 4: Acknowledges lack of self-interest avoids *further* defects but doesn’t resolve core inconsistency.  
  - **1 mark**: Synthesis (e.g., standing is role-dependent; tension between hypocrisy and victim advocacy).  
  *Common misses*: Treating features in isolation; ignoring how feature 3 might *support* standing; conflating motive (feature 4) with moral authority.  

  **Part (b) (9 marks total)**  
  - **1 mark**: Clearly defines Gatekeeping Thesis (standing as validity condition).  
  - **1 mark**: Clearly defines Uptake Thesis (standing as receptiveness condition).  
  - **2 marks**: Applies Gatekeeping to case (features 1-2 invalidate blame; feature 3 irrelevant to validity).  
  - **2 marks**: Applies Uptake to case (features 1-2 hinder uptake; features 3-4 aid uptake).  
  - **3 marks**: Adjudication + evidence criteria:  
    - 1 mark: Contrasts theories’ focus (act validity vs. impact).  
    - 1 mark: Argues which better fits the case (e.g., Gatekeeping due to depth of hypocrisy).  
    - 1 mark: Identifies what counts as evidence for each (e.g., void act vs. reasonable dismissal).  
  *Common misses*: Mere description without adjudication; missing how feature 3 tests each thesis; failing to specify evidence criteria.  

  **Part (c) (6 marks total)**  
  - **2 marks**: Distinguishes excuse (wrong but not culpable) from justification (permissible).  
  - **2 marks**: Explains why excuse sustains *tu quoque* (both did wrong; hypocrisy persists).  
  - **2 marks**: Applies to case (Hart’s "inexcusable" remark implies her own act was excused, not justified; thus *tu quoque* holds).  
  *Common misses*: Conflating excuse/justification; assuming Hart’s sanction implies justification; neglecting implications for "inexcusable" claim.  

  **Overall Differentiation**  
  - **First-Class (70+%)**: Synthesises parts (e.g., uses Part (c)’s excuse/justification distinction to strengthen Part (b)’s adjudication). Anticipates counterarguments (e.g., "Could Hart’s reform overcome hypocrisy?"). Explicitly weighs how the victim (feature 3) creates tension between theses. Precise on *tu quoque*.  
  - **Upper Second (60-69%)**: Covers all must-hit moves competently but lacks synthesis. May treat parts as separate. Less nuanced on why Gatekeeping "wins" (e.g., misses that excuses admit fault). Adequate distinction of theories but weaker on evidence criteria.  

  ---  
  **Examiner’s Commentary**  
  This question discriminates well by forcing engagement with *what standing is for*—is it about the blamer’s authority, or the blamee’s response? Strong answers will spot that the victim (feature 3) tests both theories: Gatekeeping must explain why representing the victim doesn’t "cleanse" hypocrisy, while Uptake must show why the victim’s claim might override dismissal. Weaker candidates will recite generic hypocrisy/standing points without leveraging the case’s specifics. The excuse/justification distinction in Part (c) is where first-class answers shine, linking it to the "inexcusable" label and Hart’s moral inconsistency. Time pressure (75 mins) ensures only focused, analytical writing succeeds.
