answer: |-
  Here is a specification of desiderata for an adequate theory of music's metaphysical significance, motivated by the cases and considerations you provided, with distinctions between genuine requirements and potential prejudices. Tensions and Schopenhauer's standing are addressed as requested.

  ---

  ### **Desiderata for an Adequate Theory of Music's Metaphysical Significance**

  1. **Non-Propositional Expressiveness**  
     *Requirement*: Explain how music conveys complex emotions, tensions, resolutions, or "meanings" without semantic content or reference to objects.  
     *Motivation*: A minor key progression can evoke sorrow without depicting a sorrowful event.  
     *Status*: **Genuine**. Prejudice to reject: *That music must "refer" to be expressive*.

  2. **Expression vs. Induction Distinction**  
     *Requirement*: Account for the difference between music *expressing* an emotion (e.g., sounding sad) and *inducing* that emotion in the listener.  
     *Motivation*: A mournful requiem may express grief without making a listener feel grief; conversely, upbeat music may induce joy without "expressing" it as a property.  
     *Status*: **Genuine**. Prejudice: *That expression and induction are identical*.

  3. **Contextual Framing Flexibility**  
     *Requirement*: Explain how identical acoustic structures (e.g., a rising perfect fourth) can be heard as music, speech intonation (e.g., a question), or a functional signal (e.g., a siren) based on context.  
     *Motivation*: The same sequence may be a Mozart theme or a doorbell chime.  
     *Status*: **Genuine**. Prejudice: *That "musicality" is an intrinsic property of sound*.

  4. **Absolute vs. Programme Music Compatibility**  
     *Requirement*: Accommodate both music perceived as "pure" structure (e.g., a Bach fugue) and music tied to narratives/images (e.g., *Till Eulenspiegel*), without reducing one to the other.  
     *Motivation*: Listeners engage deeply with both Beethoven’s Ninth (programmatic) and his String Quartets (absolute).  
     *Status*: **Genuine**. Prejudice: *That programme music is "impure" or that absolute music is "empty"*.

  5. **Cross-Cultural Variability**  
     *Requirement*: Account for diverse tonal systems (e.g., Javanese slendro, Byzantine chant, microtonality) without privileging Western triadic harmony as metaphysically normative.  
     *Motivation*: Balinese gamelan organizes pitch and rhythm differently yet achieves profound aesthetic impact.  
     *Status*: **Genuine**. Prejudice: *That triadic harmony is ontologically privileged*.

  6. **Perception-Pleasure Dissociation**  
     *Requirement*: Explain cases where musical pleasure exists despite deficient perception (e.g., beat-deaf individuals enjoying rhythm) and where perception is intact but pleasure is absent (e.g., musical anhedonia).  
     *Motivation*: Tone-deaf listeners may love singing; some with perfect pitch derive no joy from music.  
     *Status*: **Genuine**. Prejudice: *That musical affect requires full perceptual competence*.

  7. **Embodiment and Social Entrainment**  
     *Requirement*: Integrate music’s role in bodily movement (e.g., dance), neural/physiological entrainment, and social bonding (e.g., rituals, concerts).  
     *Motivation*: Drum circles synchronize groups; groove compels movement; lullabies foster caregiver-infant bonds.  
     *Status*: **Genuine**. Prejudice: *That music is a purely intellectual or abstract art*.

  8. **Temporal Processuality**  
     *Requirement*: Address music as an unfolding process in time, where expectation, tension, resolution, and memory shape experience.  
     *Motivation*: A cadence only "resolves" in retrospect; a symphony’s power lies in its temporal arc.  
     *Status*: **Genuine**. Prejudice: *That music can be reduced to static structures (e.g., scores)*.

  ---

  ### **Tensions Between Requirements**
  - **Universality vs. Variability (Desiderata 5 & 1/8)**:  
    If music expresses universal emotions (1) or temporal dynamics (8), how can this be reconciled with culturally variable systems (5) (e.g., sadness expressed via non-Western scales)? Theories must avoid biologizing Western norms.  
  - **Immediacy vs. Framing (Desiderata 1 & 3)**:  
    If music’s power is "immediate" (Schopenhauer’s Will), how does framing (3) alter its essence (e.g., a "sad" interval heard as a neutral signal)?  
  - **Embodiment vs. Abstraction (Desiderata 7 & 4)**:  
    Embodied entrainment (7) seems at odds with contemplative engagement with absolute music (4).  

  **Most Exclusionary Requirement**:  
  **Cross-Cultural Variability (5)**. It challenges theories that:  
  - Privilege Western harmony (e.g., Pythagorean or German Romantic views).  
  - Assert universal emotional coding (e.g., claims that minor keys are "naturally" sad).  
  - Reduce music to innate structures (e.g., certain cognitivist or Leibnizian approaches).  

  ---

  ### **Schopenhauer’s View Against the Desiderata**
  - **Strengths**: Excels at 1 (expressiveness via Will), 8 (temporal flux mirrors Will’s striving), and partially 4 (absolute music as pure Will).  
  - **Weaknesses**:  
    - Fails **5** (Variability): Treats Western tonality (e.g., melody/harmony hierarchy) as universal; ignores non-triadic systems.  
    - Neglects **7** (Embodiment/Sociality): Focuses on solitary contemplation, not entrainment or bonding.  
    - Struggles with **3** (Framing): If music *is* the Will, contextual shifts shouldn’t alter its essence, yet they do (e.g., alarm vs. melody).  
    - Inadequate on **6** (Perception-Pleasure): No account of why some with intact perception lack musical affect.  

  **Verdict**: Schopenhauer’s view is powerful for immediacy (1,8) but fatally constrained by cultural parochialism (5) and neglect of embodiment/sociality (7). It cannot satisfy all non-negotiable requirements.

  ---

  This specification prioritizes *explanatory scope* over doctrinal alignment. A viable theory need not "solve" all tensions but must acknowledge and address them. The most robust accounts will likely be pluralistic, integrating biological, cultural, and phenomenological dimensions while resisting reductive prejudices.
