prompt: |-
  Okay so I'm taking this philosophy of mind module and we just did Dennett's two-bitser against Searle, and I've sort of talked myself onto Dennett's side — I don't believe there's any original or intrinsic intentionality at all. Its all derived, observer-relative, as-if all the way down, and the only difference between me believing it's raining and a thermostat registering that the room is warm is one of degree and complexity. Fine, I'll own that. What I want is the other side of the ledger: what would actually count against this?

  I don't mean the obvious moves we already covered in seminar — the Chinese room, or the "but thermostats obviously aren't conscious" intuition. I want the real exposure. Which arguments, cases, or results should move me, ranked from fatal to merely awkward, including ones a committed Dennettian would themselves concede are awkward. In particular: does derived intentionality need an original interpreter somewhere, and if so does that just push the problem back a step — or is there a version where the whole loop is closed, a bunch of systems interpreting each other with no outside interpreter, and does that give you original intentionality for free or not? And I definately want to know about this thing I half-remember from a seminar, where a network gets trained and afterwards people find internal states tracking some feature nobody designed or asked for — does that count as anything on its own, or is it still just us reading it in?

  And be honest with me: is there anything that could in principle falsify the view, or has it been qualified into something that absorbs every possible finding? If it has, is that actually a problem for a view like this, or am I applying the wrong standard? The thing I'd personally find most persuasive against my position would be a clean case of a system being genuinely wrong about its own states — not just us misdescribing it — but tell me if that's even the right thing to want.
