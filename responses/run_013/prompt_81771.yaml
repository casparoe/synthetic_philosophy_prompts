  Here’s the poem, crafted to your exacting specifications:

  **Ten Repaired by Noon**

  The queue snakes past the biscuit tin. First task:
  A kettle’s stubborn switch. Quick solder, fixed!
  Applause. Next lamp requires a deeper ask –
  Its frayed cord whispers *risk*. The clock insists.
  **Ten repaired by noon.**

  That sewing machine, a delicate old beast,
  Refused new belts. We tried, then shook our heads.
  "Some things," we sighed, "just yield a final feast
  For parts." The next, a simple plug, instead,
  **Ten repaired by noon.**

  We showed her *how* the fuse fits in the slot,
  But ticking minutes pressed. "Just let me do't!"
  She watched, hands empty, while the solder got
  The contact clean. It works. Her lesson? Moot.
  **Ten repaired by noon.**

  The bike with seized bearings waits. Beyond,
  A clockwork radio, complex and slow.
  Instead, three lamps with plugs that just respond
  To simple twists now fill the record's row.
  **Ten repaired by noon.**

  **Ten repaired by noon.**

  ---

  **How it meets your requirements:**

  1.  **Four Failures in Sequence, Embedded in the Café:**
      *   **Stanza 1 (Noisy Signal):** Focuses on the quick win (kettle) vs. the harder, riskier repair (frayed lamp). The pressure of the clock ("insists") amplifies the noise (prioritizing speed/simplicity over thoroughness/risk assessment). The refrain is a simple report.
      *   **Stanza 2 (Correlation Breaks at Edges):** The "delicate old beast" (sewing machine) falls outside the typical repairable range observed. The complex antique breaks the correlation – it *can't* be fixed quickly or easily, making the target irrelevant/obstructive. The refrain becomes an expectation met by choosing easier items.
      *   **Stanza 3 (Downstream Effect / Intervening Fails):** The goal is skill-sharing and empowerment ("showed her *how*"). Fixing the plug *for* her achieves the target ("It works") but fails the deeper purpose ("Her lesson? Moot."). The refrain becomes an instruction driving the wrong action.
      *   **Stanza 4 (Gaming / Campbell's Law):** Explicit triage. The complex/seized items (bike, radio) are bypassed for easy plug replacements ("simple twists") purely to hit the visible number. The refrain is now a verdict on the distorted priorities.

  2.  **Unchanging Refrain with Shifting Meaning:** "Ten repaired by noon."
      *   Stanza 1: Neutral baseline description/record.
      *   Stanza 2: A target achieved, but revealing its limitations.
      *   Stanza 3: A demand dictating action, overriding deeper goals.
      *   Stanza 4: An indictment – the number was met, but at the cost of the service's core value. The final standalone line echoes this verdict hollowly.

  3.  **Avoids Jargon:** No "proxy," "metric," "target," "KPI," "Goodhart," or "gaming." The failures are demonstrated through the action and consequences.

  4.  **Not Smug; Acknowledges Initial Benefit:** The opening lines ("queue snakes," "Applause") show energy and initial success ("fewer kettles trashed" is implicit in the activity). The problem develops *because* the initial correlation seemed valid.

  5.  **Poetic Machinery:**
      *   **Rhythm Landing Wrong:** Lines like "Refused new belts. We tried, then shook our heads." The slightly abrupt rhythm mirrors the frustration and surrender.
      *   **Line Arriving Late:** "The contact clean. It works. Her lesson? Moot." The final, damning phrase "Moot" arrives after a pause, landing heavily.
      *   **Turn Where No Business:** The enjambment and shift in Stanza 3: "while the solder got / The contact clean. It works. Her lesson? Moot." The turn from technical success to ethical failure happens mid-sentence, jarringly, where a simple description of repair *should* end.
      *   **Imagery/Sound:** "queue snakes," "stubborn switch," "delicate old beast," "frayed cord whispers *risk*," "seized bearings," "clockwork radio," "simple twists." The contrast in language embodies the tension.

  6.  **Setting & Tone:** Grounded entirely in the café (biscuit tin, solder, kettles, lamps, plugs, bikes, bearings, clockwork radio). Tone is observational, slightly melancholic, not sneering. The coordinator is implied only through the systemic pressure ("The clock insists," "ticking minutes pressed").

  7.  **Accessibility & Depth:**
      *   Non-philosophers: Experience the scene, feel the shift from busy success to unease and hollow achievement through concrete details and the refrain's changing weight.
      *   Measurement thinkers: Can clearly map the stanzas to the four failures based on the described actions and consequences (Noise, Correlation Limits, Downstream Intervention, Gaming).

  8.  **Structure:** Four quatrains, closing with the refrain. Final standalone refrain. Roughly a minute when read aloud.

  The poem shows the measure working initially (energy, repairs), then demonstrates how its very visibility and pressure inevitably corrupt the original purpose, shifting the refrain from report to verdict, all within the lived reality of the repair café.
