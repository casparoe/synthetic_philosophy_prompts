prompt: |-
  I am a high-school student working on an independent study in artificial intelligence and philosophy of mind, and my advisor has asked me to write a "specification" section before I evaluate anyone's proposed solution to the frame problem. I would like your help drafting it.

  The frame problem, as I understand it, is the difficulty an agent faces in keeping track of what does and does not change as it acts and learns — working out what is relevant to what, without having to state, one item at a time, all the things that stay the same. What I want from you is not a solution but the list of requirements that any adequate theory of this has to meet, with the consideration behind each requirement.

  To keep the list concrete, here are the cases I have collected; I have invented most of them, and I would like the requirements to be motivated by them.

  1. The warehouse robot. At noon it learns that aisle 4 is blocked. It should adjust its plan without re-checking every one of the several thousand facts it holds, and it must not conclude that the pallets' contents or the color of the walls have changed.

  2. The lamp. The robot switches on a lamp; the room becomes brighter; a plant on the shelf now receives light. It seems to need the second and third facts, but not an endless list of further consequences.

  3. The unlocked door. What matters is that a door is not locked and that a sensor has not gone off. Nothing has been done; the crucial facts are about what is absent.

  4. The person in the aisle. The robot knows that a person is standing in aisle 4. When it learns that the aisle is blocked, the person's beliefs may change but her height does not; and the robot must also track what she believes about the robot's own beliefs.

  5. The agent that thinks slowly. While the robot is deliberating, other things in the warehouse keep happening, and its own decision will change what it does later.

  6. Learning from experience. The robot could learn which facts tend to change together, instead of having every rule about relevance written for it by a human.

  For each requirement I would like: the case that forces it; whether it is non-negotiable or merely a preference of one camp (for instance, whether a requirement that the theory be written as formal logic is a genuine requirement or a taste of one tradition); and whether any two requirements cannot be satisfied at the same time, since I suspect the most interesting result lies in that conflict. I expect at least one pair to clash — a demand that the agent never overlook a genuine change against a demand that it not have to check everything — but I would rather you find the real conflicts than agree with my guess. State each requirement in a sentence or two under a short label, so that the list is usable as a checklist.

  Please also tell me which of my cases is not really a constraint, and which single requirement does the most to eliminate candidate theories. I care about a theory good enough to guide the design of a system that actually works; where a requirement comes from the goal of explaining human minds rather than building machines, say so, because I suspect several disputes in this area are really disputes about that.

  Finally, a short verdict: how do the main families of approach fare against the list — rules that state what changes, representations that build relevance in from the start, statistical or learned relevance, and the view that the whole difficulty is an artifact of trying to do this inside a formal system? No citations or references are needed; I only want the reasoning.
reasoning: |-
  Okay, the user is a high-school student working on an independent study in AI and philosophy of mind. They need help drafting a "specification" section for the frame problem, which involves listing requirements that any adequate theory must meet. They've provided six cases to ground these requirements concretely. 

  First, I need to understand their main request: they want a checklist of requirements motivated by their cases, with each requirement labeled, tied to a specific case, marked as essential or preference, and noting any conflicts between requirements. They also want to know which case isn't a real constraint and which requirement is most decisive against theories.

  The user seems well-prepared—they've created original thought experiments and clearly articulated their needs. Their hidden depth might be grappling with the tension between computational efficiency and completeness in AI systems, especially regarding relevance tracking. They might also be exploring whether human cognition offers solutions that pure computational approaches miss.

  For the requirements, I'll start by analyzing each case:
  - Warehouse Robot → Relevance Discrimination (essential)
  - The Lamp → Non-Monotonic Propagation Control (essential)
  - Unlocked Door → Absence Representation (essential)
  - Person in the Aisle → Epistemic/Physical Distinction (essential)
  - Agent That Thinks Slowly → Temporal Granularity (essential)
  - Learning from Experience → Relevance Learnability (preferred but negotiable)

  Key conflicts emerge: Relevance Discrimination clashes with Non-Monotonic Propagation Control (efficiency vs. completeness), and both conflict with Relevance Learnability (hand-coded rules vs. adaptability). The "Unlocked Door" case is least constraining since absence representation is often handled by specific formalisms rather than being a universal demand.

  The most decisive requirement is Relevance Discrimination—it immediately eliminates theories that can't filter irrelevant facts efficiently. 

  For evaluating theory families:
  - Explicit frame axioms fail Relevance Discrimination and Propagation Control. 
  - State representations (e.g., STRIPS) handle Discrimination well but struggle with Propagation Control and Learnability. 
  - Statistical methods excel at Learnability but risk violating Discrimination and Propagation Control through errors. 
  - Relevance logic builds in Discrimination but resists Learnability and Propagation Control. 
  - Anti-representational views reject the problem entirely but offer no concrete solution.

  The core tension is between precision and adaptability—a fundamental challenge in both AI and cognitive science. The verdict should emphasize that no current approach satisfies all requirements simultaneously, highlighting why the frame problem remains open.
answer: |-
  Below is a specification section for the frame problem, structured as requested. Requirements are derived from your cases, labeled for use as a checklist, and evaluated for conflicts. I'll conclude with a verdict on major approaches.

  ---

  ### **Specification: Requirements for an Adequate Theory of the Frame Problem**  
  *(Derived from the provided cases)*  

  1. **Relevance Discrimination**  
     - *Requirement:* The agent must distinguish relevant from irrelevant facts when updating its knowledge after an action or event, without exhaustive re-checking.  
     - **Case:** Warehouse Robot (Case 1). Learning "aisle 4 blocked" should not trigger re-validation of unrelated facts (e.g., pallet contents).  
     - **Status:** Non-negotiable. Essential for scalability in real-world systems.  
     - **Conflict:** Clashes with *Non-Monotonic Propagation Control* (see below).  

  2. **Non-Monotonic Propagation Control**  
     - *Requirement:* The agent must infer indirect consequences of actions (e.g., lighting a lamp affects a plant) but avoid unbounded chain reactions.  
     - **Case:** The Lamp (Case 2). Requires propagating "light on → brighter room → plant illuminated" but halting irrelevant inferences (e.g., wall temperature unchanged).  
     - **Status:** Non-negotiable. Uncontrolled propagation cripples efficiency.  
     - **Conflict:** Trades off with *Relevance Discrimination* (precision vs. coverage).  

  3. **Absence Representation**  
     - *Requirement:* The agent must represent and reason about absences (e.g., "not locked," "sensor not triggered") as first-class knowledge.  
     - **Case:** Unlocked Door (Case 3). Critical for default assumptions (e.g., "door remains passable unless locked").  
     - **Status:** Non-negotiable for practical agents.  
     - **Conflict:** None severe; often addressed via negation-as-failure or modal logic.  

  4. **Epistemic/Physical Distinction**  
     - *Requirement:* The agent must separate physical changes (e.g., a person’s height) from epistemic/doxastic changes (e.g., beliefs) and track nested beliefs (e.g., "what she believes I believe").  
     - **Case:** Person in the Aisle (Case 4). Learning "aisle blocked" affects the person’s beliefs but not their physical properties.  
     - **Status:** Non-negotiable for social agents; optional for simple robots. Rooted in *explaining minds*.  

  5. **Temporal Granularity**  
     - *Requirement:* The agent must handle concurrent processes, including its own deliberation time and external events.  
     - **Case:** Agent That Thinks Slowly (Case 5). Decisions must account for ongoing changes during computation (e.g., "while I plan, a shelf collapses").  
     - **Status:** Non-negotiable for dynamic environments.  

  6. **Relevance Learnability**  
     - *Requirement:* The agent should learn relevance rules from experience (e.g., which facts co-vary) without full pre-specification.  
     - **Case:** Learning from Experience (Case 6). The robot infers that "aisle blockages correlate with forklift activity" after observations.  
     - **Status:** Preference (for adaptive systems). Not required for static domains.  
     - **Conflict:** Challenges formal/logical approaches; risks violating *Relevance Discrimination* if learned rules are imperfect.  

  ---

  ### **Analysis of Cases & Requirements**  
  - **Least Constraining Case:** *Unlocked Door (Case 3)*. While absence representation is crucial, it’s often solvable with specific techniques (e.g., negation in logic) and doesn’t impose broad structural constraints.  
  - **Most Decisive Requirement:** *Relevance Discrimination*. This eliminates theories that rely on exhaustive checks (e.g., naïve logical deduction) and is the core efficiency demand.  

  ### **Key Conflicts**  
  - **Relevance Discrimination vs. Non-Monotonic Propagation Control:**  
    - *Conflict:* Discriminating irrelevant facts (*Relevance Discrimination*) risks under-propagating consequences (*Propagation Control*). Conversely, propagating all possible effects violates efficiency.  
    - *Source:* Cases 1 (Robot) and 2 (Lamp). The tension between completeness and tractability.  
  - **Relevance Learnability vs. Relevance Discrimination:**  
    - *Conflict:* Learned relevance rules may be probabilistic or incomplete, leading to errors in discrimination (e.g., overlooking a rare but critical change).  

  ---

  ### **Verdict on Major Approaches**  
  1. **Explicit Frame Axioms (Logic-Based):**  
     - Fails *Relevance Discrimination* (scalability) and *Temporal Granularity* (rigid step-by-step reasoning). Struggles with *Learnability*.  
  2. **State Representations (e.g., STRIPS/PDDL):**  
     - Good at *Relevance Discrimination* (via "frame assumptions") and *Absence Representation*. Fails *Propagation Control* (no indirect effects) and *Learnability*.  
  3. **Statistical/Probabilistic Models (e.g., Bayesian networks):**  
     - Excels at *Learnability* and *Temporal Granularity*. Risks *Relevance Discrimination* errors (over/under-updating) and weak on *Epistemic Distinction*.  
  4. **Relevance Logic/Qualitative Physics:**  
     - Builds in *Relevance Discrimination* and *Propagation Control* via causal structures. Poor at *Learnability* and *Epistemic Distinction*.  
  5. **Anti-Representational Views (e.g., Dynamical Systems):**  
     - Avoids the problem by rejecting symbolic reasoning. May handle *Temporal Granularity* but fails *Absence Representation* and *Epistemic Distinction*.  

  **Conclusion:** No approach satisfies all requirements. *State representations* best meet efficiency needs (Cases 1, 3) but fail adaptability (Case 6). *Statistical models* excel at learning (Case 6) but risk relevance errors (Cases 1, 2). The core conflict—**precision vs. adaptability**—remains unresolved, reflecting a divide between engineered systems (prioritizing discrimination) and cognitive models (prioritizing propagation/learning).  

  ---  
  This specification isolates the hurdles for both AI and cognitive science. Use this checklist to test theories: if a candidate cannot satisfy *Relevance Discrimination* and *Propagation Control* simultaneously, it fails the frame problem.
