  Okay, the user is a logic and philosophy of language professor specializing in model-theoretic semantics, preparing a seminar on the School of Names using Gongsun Longzi's "White Horse Dialogue" and "On Pointing and Things." They explicitly don't need philological help but want semantic reconstructions using precise contemporary terminology. 

  Hmm, they're clearly sophisticated - mentioning intersective adjectives and kind reference shows they want technical rigor. The three-step breakdown suggests they've already engaged deeply with standard interpretations. Their real interest lies in the "residue" - what classical Chinese concepts resist modern semantics. That's the gold here.

  *First reconstruction attempt:* The naming step ("white horse ≠ horse") forces me to confront non-intersective adjectives. If "white" were intersective like "brown horse," the argument fails. But treating it as subsective (white horse ⊆ horse) makes the negation nonsensical. Only by reading it as intensional (white-horse-kind ≠ horse-kind) does it hold, but that requires kind-level metaphysics Gongsun likely didn't have. Already tension.

  *Second step about requests:* User's example of brown horse acceptance is perfect for extension-based satisfaction conditions. If "give me a horse" extensionally includes brown horses but "give me a white horse" doesn't, the terms clearly differ. Clean translation! But... the original probably implies normative naming correctness, not just extensional divergence. 

  *Composition step:* "Horse-with-white ≠ horse" maps neatly to conjunctive predicates P∩Q versus P. But the text's "together with" (兼) feels more like mereological sum than logical conjunction. If it's about concept composition rather than set intersection, we drift from model theory.

  *Residue alert:* The "pointing" (指) in Zhiwulun is the real challenge. Model theory has no analogue for the act of designation - it's all post-hoc formal relations between signs and objects. And the rectification (正名) dimension? That's pure normative pragmatics, completely outside truth-conditional semantics. 

  Final verdict: Our vocabulary isn't defective - it exposes conflations. Gongsun's "name" (名) bundles together sense/reference, concept/object, and naming-acts into one undifferentiated notion. That's why his arguments feel both profound and slippery: he's navigating distinctions modern semantics would compartmentalize. The residue isn't a flaw in either system but evidence of different philosophical projects. Should emphasize this in conclusion.
answer: |-
  Here is a reconstruction of the White Horse Dialogue's core arguments in model-theoretic terms, followed by an analysis of the residue. I adhere strictly to your semantic vocabulary and flag conceptual forcing points. The "naming" step requires intensional semantics, while the other steps operate extensionally. The residue reveals fundamental conflations in the source material.

  ### 1. **The Naming Step (名命)**  
  *Textual Claim:* "Horse" names shape; "white" names color. What names color ≠ what names shape. ∴ White horse ≠ horse.  
  *Semantic Reconstruction:*  
  - Let **H** = the property *equine-shape* (intensional: the sense of "horse")  
  - Let **C** = the property *whiteness* (intensional: the sense of "white")  
  - "Names shape" ≡ **H** is a shape-concept; "names color" ≡ **C** is a color-concept.  
  - **C** and **H** are distinct intensions (non-identical senses).  
  - "White horse" denotes the complex intension **H ∩ C** (conjunctive property).  
  - **H ∩ C** ≠ **H** (since adding a color property modifies the sense).  
  - *Negation/Copula Reading:* Negation is *intensional non-identity*; copula is *predicative* (linking terms to conceptual content).  
  - *Forcing Points:*  
    - Assumes "names" exclusively fix *senses* (not extensions).  
    - Treats compounding as *property conjunction* (∩), not set intersection.  
    - Ignores that distinct senses can have co-extensive referents (e.g., "horse" and "white horse" could coincide extensionally if all horses were white).  

  ### 2. **The Request-Satisfaction Step (求索)**  
  *Textual Claim:* Seeking a horse permits brown horses; seeking a white horse does not. ∴ "Horse" and "white horse" are not equivalent.  
  *Semantic Reconstruction:*  
  - Let ⟦horse⟧ = {x | x is a horse} (extension)  
  - Let ⟦white horse⟧ = {x | x is white and x is a horse}  
  - A request for "a horse" is satisfied by any y ∈ ⟦horse⟧.  
  - A request for "a white horse" is satisfied only by z ∈ ⟦white horse⟧.  
  - Since ⟦white horse⟧ ⊂ ⟦horse⟧ (proper subset), the conditions differ.  
  - *Negation/Copula Reading:* Negation is *extensional non-equivalence*; copula is *identity of reference* denied.  
  - *Forcing Points:*  
    - Translates "seeking X" as *satisfaction conditions* (pragmatics forced into semantics).  
    - Assumes "brown horse" ∈ ⟦horse⟧ but ∉ ⟦white horse⟧ (relies on worldly facts).  
    - Clean translation; no intensionality needed.  

  ### 3. **The Composition Step (兼)**  
  *Textual Claim:* "White horse" = horse + white. Horse + white ≠ horse. ∴ White horse ≠ horse.  
  *Semantic Reconstruction:*  
  - Let "white horse" be a complex term: **WH** = λx [H(x) ∧ C(x)]  
  - "Horse" = **H** = λx [H(x)]  
  - **WH** entails **H** but adds a conjunct (C), so:  
    - Extensionally: ⟦WH⟧ ⊆ ⟦H⟧, but ⟦WH⟧ ≠ ⟦H⟧ (if ¬∀x[H(x) → C(x)]).  
    - Intensionally: **WH** and **H** are distinct properties.  
  - *Negation/Copula Reading:* Negation is *non-identity of predicates*; copula is *predicate composition*.  
  - *Forcing Points:*  
    - Compounds are treated as *logical conjunctions*—ignoring non-intersective adjectives (though "white" is intersective here).  
    - "Together with" (兼) is mapped to ∧, but the text may imply mereological fusion.  

  ---

  ### **Residue Report**  
  **(A) Clean Translations:**  
  - Request-satisfaction step: Perfectly captured by *subset relations* and satisfaction conditions.  
  - Composition step: Extensional non-identity holds if not all horses are white.  

  **(B) Translations Under Distortion:**  
  - Naming step: Requires *intensional semantics* (senses as properties). The text conflates:  
    - *Sense* ("what is named" as concept)  
    - *Metalinguistic act* ("naming" as an event)  
    - *Ontological kind* ("shape" as a universal).  
  - Composition step: "Horse + white" distorted into logical conjunction ∧. Original likely implies:  
    - *Mereological sum* (horse-part + white-part), or  
    - *Hybrid universal* (a new essence beyond "horse").  

  **(C) No Model-Theoretic Counterpart:**  
  1. **The Act of Pointing/Designating (指物論):**  
     - *指 (zhǐ)* mixes:  
       - Ostension (act of pointing)  
       - Fixing reference (baptism)  
       - Abstract universals (the "pointed-at" as Form).  
     - Model theory has *no resources* for acts of pointing. Reference is static (⟦term⟧ = object/set), not dynamic or normative.  

  2. **Name Rectification (正名):**  
     - The normative dimension ("correct use of names") involves:  
       - Social conventions  
       - Metaphysical matching (名實相副)  
       - Ethical-pragmatic rules.  
     - Model theory treats reference as *descriptive*, not *prescriptive*. Truth conditions ≠ "correctness".  

  **(D) Adjudication:**  
  - **Your vocabulary is not defective**; it *exposes conflations* in the source:  
    - The text runs together:  
      - Sense vs. reference  
      - Linguistic act vs. semantic content  
      - Description vs. normativity.  
  - **Evidence of Conflation:**  
    - The naming step equivocates between:  
      - "Horse" as a *concept* (intension) → "white horse ≠ horse" holds.  
      - "Horse" as an *object-kind* (extension) → "white horse is a horse" holds.  
    - The argument trades on this ambiguity.  
  - **Residue Significance:**  
    - What cannot be captured (pointing, rectification) are *pragmatic/normative* dimensions absent in model-theoretic semantics.  
    - This reflects a key difference:  
      - Gongsun Longzi: Names are *acts* embedding metaphysics and ethics.  
      - Model Theory: Names are *signs* with defined relations to models.  

  **Conclusion:** The residue stems from the School of Names' fusion of semantics with ontology and pragmatics. Your vocabulary doesn't fail—it disentangles what the source conflates, revealing the arguments' dependence on equivocation between sense/reference and semantics/pragmatics. The "act of naming" and "rectification" have no place in model theory because they belong to a broader philosophy of language that links meaning to action and truth to normative correctness.
