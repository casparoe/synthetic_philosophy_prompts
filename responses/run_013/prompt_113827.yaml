answer: |-
  Your friend's explanatory practice rests on **teleonomic reasoning**—a framework where purposes, functions, and "reasons" are attributed to systems based on evolved design or functional organization, without invoking conscious intent. Below is a reconstruction of its core commitments, what it rules out, its consistency, and alternatives.

  ---

  ### **Core Presuppositions of the Practice**
  1. **Etiological Function (Selection History):**  
     A trait's *purpose* is defined by the historical reason it was selected. The bird's broken-wing display *functions* to lure predators because ancestral versions of the trait conferred a survival advantage by doing so. The "reason" here is evolutionary success, not conscious deliberation.

  2. **System Teleology (Goal-Directedness Without Goals):**  
     Systems are treated *as if* they pursue goals due to feedback mechanisms shaped by selection or design. The immune system "recognizes" pathogens because its structure (antibodies, T-cells) evolved to respond differentially to threats—no mental representation required.

  3. **Intentional Stance (Dennett's View):**  
     Attributing "strategies" (e.g., markets "pricing in" news) is a predictive tool: treating a system *as an agent* with goals simplifies explanation. This is justified if the system behaves *reliably* in goal-achieving ways due to evolutionary/algorithmic pressures.

  4. **Reasons as Causal Dispositions + History:**  
     A "reason" is a **disposition to produce an effect**, stabilized by selection or design. The algorithm "seeks" a minimum because its code disposes it to reduce error, and it was designed for that outcome. History (natural/artificial selection) separates *functions* from mere accidents.

  ---

  ### **What This Practice Rules Out**
  - **Conscious Intent Requirement:** It rejects that purposes must originate in a *mind*. Functions exist even if no agent "intended" them (e.g., the heart’s function is to pump blood, not make sounds).  
  - **Eliminativism About Teleology:** It denies that all goal-talk is *merely* metaphorical or fictional. Functions are real patterns explainable by selection/design.  
  - **Strong Emergentism:** It opposes the view that purposes arise *only* from irreducible conscious agency (e.g., that birds must "want" to lure foxes).  

  ---

  ### **Internal Consistency: Can Blind Selection Coexist with "Problem-Solving"?**  
  **Yes, consistently**, if two levels are distinguished:  
  - **Designer-Level (Blind):** Natural selection has no foresight; traits evolve via differential reproduction.  
  - **System-Level (Teleonomic):** Organisms *behave as problem-solvers* because selection filters for traits that *counterfactually* improve fitness (e.g., nests not eaten by foxes).  
  The bird "solves" a problem in the same way a thermostat "solves" temperature regulation: via feedback loops honed by selection/design. No smuggling occurs—the problem exists *for the biologist*, not the bird.  

  ---

  ### **Alternatives to Teleonomic Explanations**
  | **Approach**              | **What It Changes**                                                                 | **What It Sacrifices**                                                                                                |  
  |---------------------------|-------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|  
  | **Strict Mechanism** (E.g., physics-style causes only) | Eliminates all teleological language ("function," "purpose," "recognition").          | **Explanatory power:** Cannot capture *why* traits persist (e.g., why wings *for flying* exist, not just wing motions). Ignores historical context. |  
  | **Full Intentionalism** (E.g., bird "wants" to save its nest) | Treats all goal-directed behavior as conscious or proto-conscious.                   | **Biological parsimony:** Overmentalizes simple systems (e.g., immune cells "deciding"). Unsupported by evidence. |  
  | **Teleonomic Practice** (Status Quo)                    | Accepts functions as real, historical phenomena.                                    | **None of the above**—retains explanatory advantages while avoiding anthropomorphism.                                |  

  ---

  ### **Why the Middle Position Prevails**
  1. **Indispensability:** Teleonomic language is **causally explanatory**. Saying "the display evolved to distract predators" explains its complexity better than "wings sometimes drag."  
  2. **Predictive Power:** Treating markets/algorithms as "goal-seeking" allows accurate models (e.g., gradient descent *will* find minima).  
  3. **No Viable Substitute:** Mechanistic descriptions become unwieldy (e.g., reducing immune function to molecular collisions). Intentionalism adds unwarranted assumptions.  

  **Conclusion:** The practice presupposes that **reasons are etiological functions**—dispositions refined by history to produce specific effects. This requires no reasoner, only a selective process that "prefers" certain outcomes. It is internally consistent, avoids anthropomorphism, and preserves the explanatory depth that purely causal or intentional accounts lose. Rejecting it would impoverish biology, economics, and AI—but accepting it demands vigilance against *unexamined* anthropomorphic slippage (e.g., calling genes "selfish").
