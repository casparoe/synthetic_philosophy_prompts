  Here's a faithful restatement of Gongsun Long's arguments in type-theoretic terms, followed by a residue analysis of where the translation succeeds, strains, or fails. I'll strictly adopt his position ("White Horse is not Horse") and map his moves step-by-step.

  **Core Type System Setup:**
  *   `Horse : Type` - The type designating "shape" (equine form).
  *   `White : Type` - The type designating "color" (the property white).
  *   `WhiteHorse : Type` - The type designating the compound "white horse".
  *   `hasColor : (obj: α) → Color` - Function extracting color property (if defined).
  *   `hasShape : (obj: α) → Shape` - Function extracting shape property (if defined).
  *   **Crucially:** We *cannot* assume `WhiteHorse <: Horse` (subtyping) or `WhiteHorse = Horse × White` (product type) *a priori*. Gongsun argues *against* these equivalences.

  **Gongsun Long's Arguments Translated:**

  1.  **The Designation Argument (Shape vs. Color):**
      *   **Original:** "`Horse` designates shape. `White` designates color. What designates color is not what designates shape. Therefore, `WhiteHorse` is not `Horse`."
      *   **Type Translation:**
          *   The *intension* (defining property) of `Horse` is captured by `hasShape(x) = Equine`.
          *   The *intension* of `White` is captured by `hasColor(x) = White`.
          *   The *intension* of `WhiteHorse` is captured by `(hasShape(x) = Equine) ∧ (hasColor(x) = White)`.
          *   The intensions are fundamentally different: `Horse` concerns `Shape`, `White` concerns `Color`, `WhiteHorse` concerns *both*.
          *   Therefore, `WhiteHorse ≠ Horse` (intensional inequality). The types are defined by distinct criteria.
      *   **Type-Theoretic Move:** **Intensional Type Equality.** He argues types are equal only if their *defining criteria* (intensions) are identical. `Horse`'s criterion is shape-only; `WhiteHorse`'s criterion is shape+color. Different criteria → different types. Subtyping isn't asserted or denied yet; *identity* is denied based on definition.

  2.  **The Objection & The Seeking Argument (Substitutability):**
      *   **Objection:** "If you have a `WhiteHorse`, you have a `Horse`. So `WhiteHorse` is `Horse`!"
      *   **Gongsun's Response (Seeking):** "If you seek a `Horse`, `YellowHorse` or `BlackHorse` will serve. If you seek a `WhiteHorse`, `YellowHorse` or `BlackHorse` will not serve. Therefore, `WhiteHorse` is not `Horse`."
      *   **Type Translation:**
          *   Objection implies `WhiteHorse <: Horse` (any `WhiteHorse` *is a* `Horse`).
          *   Gongsun refutes this by **testing substitutability under functional requirements**:
              *   Define a function: `findHorse : (need: Horse) → Horse`
              *   `findHorse` is satisfied by `YellowHorse : Horse`, `BlackHorse : Horse`, *and* `WhiteHorse : Horse` (if we assumed subtyping).
              *   Define a function: `findWhiteHorse : (need: WhiteHorse) → WhiteHorse`
              *   `findWhiteHorse` is *only* satisfied by `WhiteHorse`. `YellowHorse : Horse` *does not satisfy* `findWhiteHorse`, even if `YellowHorse <: Horse`.
          *   Since `YellowHorse` satisfies `findHorse` but not `findWhiteHorse`, the requirements `Horse` and `WhiteHorse` are *not interchangeable*. Therefore, `WhiteHorse` cannot be considered the *same type* as `Horse`.
      *   **Type-Theoretic Move:** **Liskov Substitution Principle (LSP) / Behavioral Subtyping Test.** Gongsun uses a real-world version of LSP: If `S` is a subtype of `T`, then objects of type `S` should be substitutable for objects of type `T` *in all contexts* without altering the correctness of the program. He constructs a context (`findWhiteHorse`) where `Horse` objects (like `YellowHorse`) *fail* to substitute for a `WhiteHorse`, proving `WhiteHorse` cannot be merely a `Horse` (i.e., `WhiteHorse <: Horse` is invalid *or insufficient* for type identity). He concludes type *non-identity* from the failure of universal substitutability.

  3.  **The Compound Argument (Inseparability):**
      *   **Original:** Implicit in the designation/seeking arguments and explicitly debated: Is `WhiteHorse` simply the combination (`White + Horse`)? Can `White` and `Horse` exist independently in the object?
      *   **Gongsun's Position:**
          *   `White` alone doesn't designate a concrete thing (what is "white"? It needs a subject).
          *   `Horse` alone doesn't designate the *specific* white horse.
          *   `WhiteHorse` is a unique, inseparable designation. You cannot "take away" the whiteness and still have *this* `WhiteHorse` object as defined, nor can you "take away" the horseness. The compound is primary.
      *   **Type Translation:**
          *   Gongsun rejects `WhiteHorse = Horse × White` (product type).
          *   **Reasons:**
              1.  **Lack of Independence:** `White` and `Horse` aren't independent types you "glue together." `White` is a property *dependent* on having a subject. `Horse` doesn't inherently specify color.
              2.  **Uniqueness of Compound:** The type `WhiteHorse` designates the *inseparable conjunction* of properties `(hasShape=Equine) ∧ (hasColor=White)`. This conjunction defines a distinct entity. You cannot decompose it into separate `Horse` and `White` components without losing the specific identity.
              3.  **Referential Opacity:** When you refer to a `WhiteHorse`, you are referring *directly* to the compound object, not to `Horse` plus an attached `White` property. The compound is the fundamental unit of designation.
      *   **Type-Theoretic Move:** **Rejection of Product Type / Nominal Typing Emphasis.** Gongsun argues `WhiteHorse` is a **nominal type** in its own right, not merely a convenient label for the structural combination `Horse × White`. Its identity comes from its unique name and defining conjunction of properties, not from the independent existence of its "components." This highlights the difference between **structural typing** (where `{shape: Equine, color: White}` might be compatible with `Horse` if `Horse` only cares about shape) and **nominal typing** (where `WhiteHorse` is a distinct name with fixed requirements regardless of structural overlap).

  **The Residue Report: What Carries Over, What Strains, What Fails**

  1.  **Clean Carry-Over:**
      *   **The Seeking Argument (Substitutability):** This maps exceptionally well to **Liskov Substitution Principle (LSP)**. Gongsun's core point – that different requirements (`findHorse` vs `findWhiteHorse`) reveal a difference in type – is fundamental to behavioral subtyping. Failure in one context proves non-substitutability and thus non-identity (or at least non-subtyping for that context). This is a robust translation.
      *   **Intensional Inequality Basis:** The idea that types are defined by their *criteria* (shape-only vs shape+color) and that different criteria imply different types aligns perfectly with **intensional type equality**. Type systems fundamentally care about how types are *defined*, not just their current members (extension).

  2.  **Strained Carry-Over (Requiring Distortion/Interpretation):**
      *   **Designation (Shape/Color):** The notion that "`Horse` designates shape" and "`White` designates color" *can* be mapped to type intensions (`hasShape`, `hasColor`), but it requires a significant leap.
          *   **Distortion:** We have to model `White` itself as a *type* (`White : Type`), representing "things that are white," rather than just a value or property. Gongsun treats "white" as an abstract universal ("designates color") that can be combined. In type theory, `Color` is usually a type, and `White` would be a *value* (`white : Color`) or a predicate `isWhite(x)`. Modeling `White` as a type (`White : Type`) is a distortion to capture his "designating" language. It conflates the property *value* with the *type defined by that property*.
          *   **Reason:** This is partly a **hole in the vocabulary** of standard type systems for *directly* handling universals/properties as independent designators in the way Gongsun does. It's also a sign of **vagueness in his claim**. Does "White designates color" mean the universal "whiteness," the set of all white things, or the property itself? Type theory forces a more precise distinction (Type vs Value vs Predicate) than his language provides.
      *   **The Compound Argument (Rejection of Product):** While rejecting `WhiteHorse = Horse × White` is clear, the *reasoning* about inseparability strains.
          *   **Distortion:** We model the inseparability by making `WhiteHorse` a nominal type. This captures the *effect* but not his *metaphysical justification*. Type theory doesn't inherently care if properties are "separable" in reality; it cares about interface and structure. His argument relies on an ontological point about universals and particulars that type theory abstracts away.
          *   **Reason:** This is primarily a **sign of vagueness/metaphysical commitment** in Gongsun's claim. Type theory can model the *consequence* (distinct nominal type) but doesn't replicate the *philosophical reasoning* (inseparable unity of properties in the particular). The "inseparability" feels more like an assertion than a type-theoretic necessity.

  3.  **Failure to Carry Over:**
      *   **The Primacy of "Designation":** Gongsun's core concept revolves around names (*míng* 名) "designating" (*wèi* 謂) realities (*shí* 實). This is a semantic/metaphysical relationship about language referring to the world.
          *   **Failure:** Type theory deals with relationships *between types and terms within a formal system*. It doesn't directly model the connection between the type name `Horse` and the actual concept or reality of horseness in the external world. `Horse : Type` is a declaration *within* the system.
          *   **Reason:** This is a **fundamental hole in the vocabulary**. Type theory is syntax and proof theory; it lacks semantics in the philosophical sense. Gongsun's "designation" is inherently semantic/metaphysical. Types can *model* the intension, but they don't *explain* the act of designation itself. This aspect simply has no counterpart.
      *   **The Status of Universals (White/Horse):** Gongsun is deeply engaged in ontological questions about whether universals like "Horseness" or "Whiteness" exist independently.
          *   **Failure:** Type theory is largely agnostic about the Platonic reality of types. `Horse : Type` is a useful construct; whether "Horseness" exists in some realm of forms isn't a type-theoretic question. His arguments about `White` not designating a concrete thing alone touch on this metaphysics.
          *   **Reason:** **Hole in the vocabulary / Different domain.** Type theory formalizes reasoning *using* types, not the philosophy *of* types or universals. Gongsun's concerns about the independent existence of properties belong to metaphysics, not type system design.
      *   **"Separability" as an Ontological Claim:** His argument that you cannot "take away" white from a white horse and still have *that* white horse is about the nature of particulars and their properties.
          *   **Failure:** In type theory, if `wh : WhiteHorse`, you can certainly project `hasShape(wh) : Horse` (if `Horse` is the return type of `hasShape`) and `hasColor(wh) : White` (if `White` is a type). This *looks* like separation! Whether `hasShape(wh)` *is the same entity* as `wh` is not a question type theory addresses; it deals with values and their properties functionally. His claim is metaphysical, not structural.
          *   **Reason:** **Sign of Vagueness/Metaphysical Commitment.** Type theory provides mechanisms (projections) that *seem* to contradict his inseparability claim at the value level. His claim seems stronger, pertaining to the identity of the object itself, which type theory abstracts over.

  **Conclusion:**

  The translation reveals Gongsun Long's core logical moves concerning **intensional type distinction** and **substitutability failure** are remarkably robust and map cleanly to modern type theory concepts (intensional equality, LSP). His argument is fundamentally *against* assuming `WhiteHorse <: Horse` implies `WhiteHorse = Horse` or that `WhiteHorse` is merely a `Horse` with an added property.

  However, the metaphysical and semantic underpinnings of his argument – the nature of "designation," the ontological status of universals (`White`, `Horse`), the inseparability of properties in the particular object, and the primacy of the compound name – **do not carry over**. These aspects either expose **genuine limitations of type theory** as a framework for capturing his full philosophical project (especially the semantics of designation and the ontology of universals), or they highlight points where **his own claims rely on philosophical commitments** (inseparability) that appear vague or unnecessary from a purely type-theoretic perspective.

  The residue shows Gongsun wasn't *just* making a point about subtyping or product types. He was engaging in a deep logical and metaphysical investigation about names, properties, and their relationship to reality. While type theory brilliantly captures his logical rigor concerning distinction and substitutability, it cannot fully encompass the philosophical worldview driving his "White Horse is not Horse" paradox. The mismatch is informative: it clarifies what his argument *logically entails* while also highlighting where it *transcends* formal modeling.
