prompt: |-
  I'm drafting a position paper on sex-work law and I'd like a consistency audit before I commit to it. Here is where I've landed, stated as baldly as I can.

  (1) As a matter of principle, the criminal law has no business punishing consensual sexual conduct between adults. Criminal liability should be reserved for force, fraud, coercion, or demonstrable harm to non-consenting third parties.

  (2) On policy, I favour the sex-purchase-ban approach: selling sexual services is lawful, but buying them is a criminal offence.

  (3) Sex work is work. Sellers should be covered by ordinary labour law — occupational health and safety, contract and wage protections wherever an employment relation exists — and should have an unambiguous right to organise collectively.

  (4) Third parties who organise, manage, or take a cut from other people's sex work — brothel operators, agencies, drivers — should remain criminally liable.

  (5) In this area I am consequences-first: a regime should be judged by how it affects the people who actually sell sex, above all the most marginalised among them, and not by the expressive or symbolic message it sends about commodified sex.

  (6) I want aggressive anti-trafficking enforcement, but it should fall on coercers and on buyers of coerced sex, not on sellers. No one should be prosecuted or deported merely for having sold sex, migrants included.

  I'm sceptical of the German and Dutch licensed systems; my impression is that they have grown a large commercial sector without clear gains in safety or in reducing trafficking, which is why I'm not drawn to full legalisation.

  Please go through these and tell me which commitments are actually in tension, which only look like they are, and — for the real ones — what the cheapest revision would be and what it would cost. Rank the tensions by severity rather than treating them all as equally bad, and be specific about what would have to give. Please also say how confident you are in each of your verdicts, and single out the one point you're least sure about.
reasoning: |-
  Okay, the user is drafting a position paper on sex-work law and wants a consistency audit. They've laid out six key points and are skeptical of the German/Dutch models. Let me start by understanding each point clearly.

  Point 1 emphasizes decriminalizing consensual sex between adults, focusing criminal liability on harm, force, fraud, etc. Point 2 supports the sex-purchase-ban (Nordic model) where selling is legal but buying is criminalized. Point 3 asserts that sex work is work and should have labor protections. Point 4 wants third parties like brothel operators to remain criminalized. Point 5 prioritizes outcomes for sex workers, especially marginalized groups. Point 6 calls for aggressive anti-trafficking enforcement targeting coercers and buyers, not sellers.

  Now, looking for tensions. The biggest red flag is between Points 2 and 3. If selling is legal and sex work is work, but buying is illegal, that undermines labor rights. How can you have employment contracts if the buyer is committing a crime? This seems like a severe conflict. The user might need to either drop the purchase ban or adjust labor protections, but that would compromise Point 3.

  Point 4 criminalizing third parties clashes with Point 3's labor protections. If third parties are illegal, how can sex workers organize or have safe workplaces? Brothel operators criminalized, but OHS requires management. This is another significant tension. The user might not realize that criminalizing third parties prevents structured work environments.

  Point 5's consequences-first approach might conflict with Point 2. Research suggests the Nordic model can harm marginalized workers by pushing the industry underground. If the user prioritizes outcomes, but Point 2's model has negative consequences, there's a tension here. They need to reconcile their policy choice with evidence on harm reduction.

  Point 6's anti-trafficking focus is consistent with Point 1 and 2, but the criminalization of buyers might lead to rushed transactions, making trafficking harder to detect. That's a moderate tension. Also, protecting migrant workers from deportation is crucial, but under Point 2, buyers are criminalized, which might not address trafficking effectively.

  The user's skepticism of the German/Dutch models is noted, but avoiding third-party involvement might leave workers without support structures. They need to consider if their model truly protects workers better. 

  The user's deeper needs include wanting a morally consistent framework that protects vulnerable workers without endorsing exploitation. They might be struggling to balance principle with practical outcomes. Highlighting the tensions between their policy choice and labor rights is essential. Suggesting alternatives like decriminalization without third-party criminalization (New Zealand model) could help, but they might resist that due to their stance on third parties. 

  Confidence levels: The Point 2 vs 3 tension is high confidence. Point 4 vs 3 is also high. Point 5 vs 2 is moderate due to mixed evidence. Point 6 is moderate. The least sure point is the effectiveness of anti-trafficking under the Nordic model because data is contested. 

  Cheapest revisions: For Point 2, shift to decriminalization of both parties. If not, exempt labor protections from purchase laws. For Point 4, allow some third-party roles under regulation. These changes reduce ideological purity but improve consistency with worker safety and rights. 

  Prioritizing revisions: Start with the purchase ban's impact on labor rights, as it's the most severe tension. Then address third-party roles to enable workplace safety. The user must decide between principle and pragmatism, but their consequences-first stance (Point 5) suggests they should favor evidence-based adjustments.
answer: |-
  Here's a consistency audit of your position, ranking tensions by severity and outlining costs of revision. I've flagged one point as particularly vulnerable due to conflicting evidence.

  **Core Tensions (Ranked by Severity):**

  1.  **Point 2 (Purchase Ban) vs. Point 3 (Labour Protections & Right to Organize)**
      *   **Tension:** The purchase ban creates a fundamental conflict with recognizing sex work as work and granting full labour rights.
          *   **Buyer Criminalization vs. Employment:** How can an employment relationship exist (implying an employer) if the core act of purchasing the service is criminal? Who is the contractual counterparty? Enforcing wage theft or contract violations against a criminalized buyer is legally fraught and practically difficult.
          *   **Right to Organize & Safe Workplaces:** Criminalizing clients drives the trade further underground. This makes it significantly harder for workers to organize collectively, screen clients safely, work indoors in stable locations (which facilitates organization), or demand safe working conditions without fear of clients fleeing police attention. OHS inspections become nearly impossible if the workplace activity involves criminal acts by clients.
      *   **Severity:** **High.** This strikes at the heart of operationalizing Point 3 within the framework of Point 2.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Soften Point 2's implementation to *explicitly shield* sellers and their *direct* interactions with buyers related to establishing work conditions/safety *from being used as evidence* to prosecute buyers. Or, prioritize Point 5 and abandon Point 2 for full decriminalization (selling & buying legal).
          *   **Cost:** Abandoning Point 2 costs ideological consistency with the Nordic model's symbolic stance against commodification. Shielding interactions reduces tension but is complex legally/practically and weakens Point 2's deterrence message. It doesn't solve the fundamental chilling effect on workplace stability needed for labour rights. Confidence: **High**.

  2.  **Point 4 (Criminalize Third Parties) vs. Point 3 (Labour Protections & Right to Organize)**
      *   **Tension:** Criminalizing *all* third parties (brothels, agencies, drivers) directly conflicts with creating safe, regulated workplaces and collective organization.
          *   **Safe Workplaces:** Brothels/managers often provide critical security, screening, booking, and physical infrastructure (panic buttons, condoms, safe rooms). Criminalizing them eliminates the possibility of regulated, safer indoor venues, pushing workers towards riskier street-based or isolated work.
          *   **Collective Organization & Labour Rights:** Agencies or co-operative brothel structures are primary vehicles for collective bargaining, pooling resources for legal/health support, and establishing standard contracts/conditions. Criminalizing these entities destroys the infrastructure needed for Point 3.
          *   **Ambiguity:** "Taking a cut" could include security hired by collectives, drivers co-operatively employed by workers, or administrative staff in a worker-owned co-op. Criminalizing these roles harms workers' autonomy and safety.
      *   **Severity:** **High.** Criminalizing support structures directly undermines the safety and organizational capacity Point 3 aims for.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Narrow Point 4 to target *exploitative* third parties (those using coercion, controlling workers, taking excessive profits without providing value, facilitating trafficking). Explicitly *exempt* or create a regulatory pathway for worker-owned co-operatives, collectives, and third parties providing demonstrably non-exploitative support under worker control.
          *   **Cost:** Abandons the principle of blanket criminalization of third parties. Requires complex definitions and regulatory oversight to distinguish exploitative vs. non-exploitative third parties, moving towards a more regulated system (which you are skeptical of). Confidence: **High**.

  3.  **Point 2 (Purchase Ban) & Point 4 (Criminalize Third Parties) vs. Point 5 (Consequences-First for Marginalized Sellers)**
      *   **Tension:** Evidence suggests purchase bans + third-party criminalization often *harm* the most marginalized sellers (e.g., street-based workers, migrants, those with substance dependencies) by:
          *   Increasing police interactions (even if sellers aren't targeted, they are present where crimes occur).
          *   Pushing transactions underground/hastily, reducing time for client screening, increasing violence risk.
          *   Eliminating safer indoor options managed by non-exploitative third parties.
          *   Making it harder for marginalized workers to access support services linked to agencies/managers.
          *   Disproportionately impacting street workers while higher-income indoor workers adapt more easily.
      *   **Severity:** **Moderate-High.** Your stated priority (Point 5) clashes with the likely real-world consequences of your preferred policies (Points 2 & 4) for the most vulnerable.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Prioritize Point 5. Shift to full decriminalization (selling, buying, *and* non-exploitative third parties) - the New Zealand model, which aligns best with Points 1, 3, 5, and 6 based on NZ evidence. If committed to the Nordic model, *drop Point 4* entirely to allow safer managed indoor work, or significantly narrow it as above.
          *   **Cost:** Abandons the symbolic stance against commodification inherent in the purchase ban and the blanket opposition to third parties. Requires engaging with the complexities of regulation you wish to avoid. Confidence: **Moderate-High** (based on research like NZ Prostitution Law Review Committee reports, Global Alliance Against Traffic in Women analyses).

  4.  **Point 6 (Anti-Trafficking Focus on Coercers/Buyers) vs. Point 2 (Purchase Ban)**
      *   **Tension:** While conceptually aligned (targeting coercers and buyers of coercion), the *purchase ban on all buyers* complicates anti-trafficking efforts:
          *   It incentivizes all buyers to be more clandestine, making it harder for law enforcement to identify *which* buyers are interacting with trafficked individuals.
          *   Trafficked individuals, fearing arrest of clients or managers (even non-coercive ones), may be less likely to report to authorities.
          *   Resources are diverted to enforcing the broad purchase ban rather than focusing solely on trafficking networks.
      *   **Severity:** **Moderate.** It creates operational friction but isn't a fundamental contradiction.
      *   **Cheapest Revision & Cost:**
          *   **Revision:** Maintain Point 2 but ensure anti-trafficking units are distinct, well-resourced, and prioritize intelligence-led operations targeting networks over low-level buyer stings. Strongly emphasize "demonstrable harm" (Point 1) in trafficking investigations to avoid conflating voluntary migrant sex work with trafficking.
          *   **Cost:** Requires significant police resources and training to implement effectively. Risk of mission creep where purchase ban enforcement masquerades as anti-trafficking. Confidence: **Moderate.**

  **Points Largely Consistent (Little to No Tension):**

  *   **Point 1 (Decrim Consensual Conduct) & Point 3 (Sex Work is Work):** Core foundation - consenting adults engaging in sex for pay shouldn't be a crime, hence labour rights follow logically. **Confidence: High.**
  *   **Point 1 & Point 6 (Anti-Trafficking Focus):** Clear distinction between consensual adult sex work (protected) and force/fraud/coercion (targeted). **Confidence: High.**
  *   **Point 3 (Labour Rights) & Point 5 (Consequences-First):** Granting labour rights is a primary mechanism for improving sellers' safety, autonomy, and economic security. **Confidence: High.**
  *   **Point 5 (Consequences-First) & Point 6 (Protect Sellers in Anti-Trafficking):** Directly focuses enforcement harm away from sellers onto perpetrators. **Confidence: High.**

  **Point I'm Least Sure About: Point 6 Effectiveness within the Nordic Model Framework**

  *   **Why:** While targeting buyers of coerced sex is logical, the *evidence* that the *Nordic model specifically* (purchase ban + seller decrim) is *more effective* at reducing trafficking compared to full decriminalization or legalization is **highly contested and inconclusive**. Some studies suggest trafficking adapts, while others claim deterrent effects. The clandestine nature of trafficking makes reliable data difficult. Your skepticism of the German/Dutch models is noted, but the counterfactual (does the Nordic model *actually* reduce trafficking more than alternatives?) lacks robust, universally accepted proof. This is where ideological preference (Point 2) meets the messy reality of measuring complex criminal activity (Point 5 & 6). **Confidence in Anti-Trafficking Efficacy Claim: Low-Moderate (due to data limitations and conflicting studies).**

  **Summary of Recommended Revisions by Priority:**

  1.  **Address Labour Rights Conflict (Point 2 vs. 3):** Abandon the purchase ban (Point 2) OR significantly modify its implementation to explicitly protect seller-buyer interactions necessary for establishing work/safety conditions. *(Highest Impact Change)*
  2.  **Address Third-Party Conflict (Point 4 vs. 3):** Abandon blanket criminalization of third parties (Point 4). Narrow it to target *exploitative* third parties only and explicitly exempt/regulate worker collectives and co-operatives. *(Essential for Point 3)*
  3.  **Align Policy with Consequences (Points 2 & 4 vs. 5):** If keeping Points 2 & 4, rigorously assess the evidence on their impact on marginalized sellers. If evidence shows significant harm, prioritize Point 5 and shift towards decriminalization (abandoning 2 & 4). *(Core Value Alignment)*
  4.  **Refine Anti-Trafficking Implementation (Point 6 within Point 2):** Ensure anti-trafficking efforts under the purchase ban are distinct, intelligence-led, and prioritize network disruption over low-level buyer arrests. *(Operational Improvement)*

  **The Core Cost:** Maintaining the symbolic stance against commodification (inherent in the purchase ban) and the deep suspicion of third parties comes at a high cost to your goals of labour rights, safety for marginalized workers, and potentially effective anti-trafficking enforcement. The cheapest revisions involve significant compromises on Points 2 and 4 to salvage Points 3 and 5. The most consistent framework aligning with Points 1, 3, 5, and 6 is likely full decriminalization (NZ model), but that requires abandoning your stated preference in Point 2 and revising Point 4 entirely.
