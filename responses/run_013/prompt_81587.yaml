answer: |-
  Here’s a complete final exam package designed to force critical engagement with Friedman’s F-twist using your scaffold/keystone framework.

  **Essay Question (90-minute limit):**  
  *"In a simple economic model of a competitive market, firms are assumed to have perfect information and maximize profits. This model predicts that market prices efficiently track profit opportunities. Using the concepts of 'scaffold assumptions' (false but dispensable) and 'keystone assumptions' (false but indispensable to the result), analyze the status of the perfect-information assumption in this model. If it is a keystone, does that necessarily undermine the model’s usefulness under Friedman’s F-twist? Explain how the distinction between a keystone assumption in this specific model versus a 'keystone full stop' (across all possible models) affects your evaluation."*

  ---

  **Model Answer (650 words):**  
  The perfect-information assumption in this simple market model acts as a **keystone**, not a scaffold. A scaffold assumption’s falsity is merely convenient: replacing it with a realistic alternative (e.g., imperfect information) might preserve or adjust the core prediction—here, efficient price tracking—without collapsing it. By contrast, a keystone is indispensable; removing it destroys the model’s explanatory mechanism. Perfect information is keystone because it directly enables the prediction. The model claims prices track profit opportunities *because* firms instantly see and exploit any price-profit mismatch. If firms have imperfect information, they cannot reliably detect or act on opportunities, invalidating the causal link between profit-maximization and price efficiency. Without perfect information, the result doesn’t just degrade—it vanishes. The algebra might be salvageable, but the *explanatory claim* that competition drives efficiency via rational arbitrage fails.  

  Friedman’s F-twist argues that unrealistic assumptions are acceptable if predictions hold. But if an assumption is keystone, its falsity appears fatal: if the result depends entirely on a false premise, how can predictions be trustworthy? Here, the F-twist faces tension. One might argue that even with a keystone, prediction accuracy justifies the model. However, this raises a deeper problem: if the keystone is false and the prediction *still* holds empirically (e.g., real markets often show efficient pricing), the model’s causal story is misleading. It credits the wrong mechanism (perfect-information arbitrage) for the outcome.  

  This is where the **scaffold/keystone distinction reveals its full value**. A keystone assumption in *this model* is not necessarily a "keystone full stop" for the result. Other models of the same phenomenon might generate efficient pricing *without* perfect information, making the assumption dispensable across the broader explanatory landscape. For instance:  
  - **Evolutionary models** show prices tracking profits because firms that stumble on profitable strategies survive, while others die off—no foresight or perfect information needed.  
  - **Behavioral models** suggest heuristics or imitation can approximate efficient outcomes despite cognitive limits.  
  - **Information-cascade models** demonstrate how prices aggregate scattered knowledge through trading, even if no single actor knows everything.  

  If these alternative models also predict efficient pricing, the *result* is robust—but the simple model’s keystone assumption (perfect information) is exposed as an artifact of its *specific construction*, not a universal necessity. The falsity of the assumption is load-bearing *in this model* but not for the phenomenon itself.  

  Consequently, the F-twist can still defend the simple model’s usefulness—but conditionally. If the model predicts well *and* its keystone dependence is merely local (not full stop), it retains pragmatic value. For example, it might offer computational simplicity or pedagogical clarity. However, labeling it "explanatory" becomes dubious: it misidentifies causes. The F-twist thus prioritizes prediction over explanation, but the keystone/scaffold lens forces us to ask *why* predictions hold. If a keystone assumption is false yet predictions succeed, the model may be luckily right for the wrong reasons—a weakness the F-twist overlooks. Robustness across models (e.g., evolutionary and behavioral alternatives) better secures the prediction’s reliability than any single model’s fit.  

  In sum: perfect information is a keystone in this model. Its falsity doesn’t automatically sink the model under the F-twist if predictions hold, but it exposes the model as a potentially unreliable explainer. Only by checking if the result survives in models *without* this keystone (i.e., assessing "keystone full stop") can we trust the prediction reflects reality, not just model-dependent contrivance.

  ---

  **Marking Scheme (Total: 20 points)**  
  *Must-hit moves, common errors, and A/B differentiation:*  

  1. **Classify perfect information as KEYSYONE in this model** (4 pts)  
     *Must-hit:* Explicitly states it’s keystone (not scaffold) and explains why removal destroys the result’s causal logic.  
     *Common error:* Calling it scaffold (e.g., "it’s just simplifying") or not justifying why falsity is indispensable.  
     *A/B split:* A answers correctly and concretely (e.g., ties to profit-maximization mechanics). B answers waffle or misclassify.  

  2. **Trap engagement: Analyze if keystone status undermines F-twist** (4 pts)  
     *Must-hit:* Identifies tension (keystone falsity threatens predictive reliability) but notes F-twist prioritizes prediction over assumptions.  
     *Common error:* Claims keystone falsity automatically voids F-twist, or ignores the tension entirely.  
     *A/B split:* A acknowledges tension; B treats F-twist as immune to keystone problems.  

  3. **Distinguish "keystone here" vs. "keystone full stop"** (5 pts)  
     *Must-hit:* Clearly separates the assumption’s role in *this model* from its necessity for the *phenomenon*, using alternative models (e.g., evolutionary) to show result robustness.  
     *Common error:* Equates "keystone here" with universal indispensability, or fails to cite alternatives.  
     *A/B split:* A uses alternatives to show cross-model robustness; B omits alternatives or conflates model/phenomenon.  

  4. **Evaluate F-twist in light of keystone full stop** (4 pts)  
     *Must-hit:* Argues F-twist remains useful if prediction holds AND result is robust across models (not full stop), but notes explanatory weaknesses.  
     *Common error:* Absolutism (e.g., "F-twist wins regardless" or "keystone kills F-twist").  
     *A/B split:* A gives conditional, nuanced defense; B is one-sided.  

  5. **Clarity and framework fidelity** (3 pts)  
     *Must-hit:* Uses scaffold/keystone terms correctly; structured reasoning.  
     *Common error:* Lopsided focus (e.g., 90% on F-twist recap).  

  **Grade thresholds:**  
  - **A (17–20):** Hits all 5 moves, especially #3 (alternatives) and #4 (nuanced F-twist).  
  - **B (13–16):** Misses #3 and/or #4; superficial on "keystone full stop."  
  - **C/D:** Misclassifies keystone (#1) or ignores framework.  

  ---

  **Why this works:**  
  - **Forces framework use:** Students can’t F-twist-recital their way out—they must engage scaffold/keystone.  
  - **Springs the trap:** The "perfect info = keystone" setup lures them into doubting F-twist, then #3 rescues it via model plurality.  
  - **No prior readings needed:** The market example is self-contained; alternatives (evolutionary/heuristics) are intuitive enough for undergrad reasoning.  
  - **Tests model-thinking:** By asking if the *result* (not assumption) is robust, it mirrors scientific practice.  

  Let me know if you’d like a slight variant using planetary orbits (e.g., circular orbits as scaffold vs. keystone for Kepler’s laws) or genetic drift (infinite population assumption).
