  For the case study, the perfect information assumption in market models is ideal. It's simple enough for undergrads but has enough depth: while perfect info is clearly unrealistic, its role varies across economic models. In basic perfect competition models it might be keystone, but in evolutionary or behavioral models the price tracking result emerges differently.

