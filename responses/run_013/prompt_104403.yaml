prompt: |-
  So I'm giving a paper at a small interdisciplinary colloquium in a few weeks and I want a Q&A prep sheet rather than feedback on the paper itself. The room: mostly historians of economic thought, a couple of philosophers of science who work on theory change and falsification, and two economic demographers who've actually spent years with parish records and census data. It's a friendly crowd but a sharp one, and the demographers in particular are going to come at me from the data side. My thesis is that Malthus's core claim was never really falsified — it was early — and more importantly I want to defend a *rule* for when "right but early" is a legitimate move in science rather than a rescue operation dressed up as patience. The bit I'm actually proud of, and the bit I expect to get hammered, is a distinction I draw between two kinds of predictive failure. Call them scope failure and timing failure. Scope failure is when the prediction was aimed at the wrong population or the wrong period in the first place — the mechanism may be fine but it was pointed at the wrong target, and no amount of waiting fixes that. Timing failure is when the mechanism did what was claimed but on a slower clock than advertised. My claim is that only timing failures are rescuable by the "right but early" maneuver, and that a timing-failure rescue is legitimate only if it commits in advance to a new, checkable window — i.e. the rescue has to buy you a falsifiable bet, not just a deferral. I use the demographic transition as the crucial test case, since everyone treats it as the death blow to Malthus, and I argue it's actually a scope/timing mess that people have been reading as a straightforward refutation.

  What I need from you is the objection sheet for the question period. These people will not ask me about the history of the poor laws or whether Malthus was a nice guy — they'll go straight for whether my distinction is doing any real work or whether I've just invented a vocabulary that lets any failed long-run prediction be relabelled as "early." The philosophers of science will have Lakatos and Duhem-Quine reflexes and will want to know why my "legitimate rescue" rule isn't just a restatement of the idea that a research programme can be progressive or degenerating; the demographers will say the transition shows the mechanism was wrong, not slow — that fertility fell as incomes *rose*, which is the opposite of what the story needs — and that my timing/scope line is unfalsifiable hand-waving. The historians will want to know whether I'm quietly rewriting what Malthus actually claimed so that the "core" survives by definition. I've got maybe fifteen minutes of Q&A and I freeze when someone lands a good hit, so I want the objections ranked by how much damage they'd actually do, phrased the way *these* people would phrase them (not the way a philosopher of biology would), each with a reply I can give in about two minutes, and an honest note on where that reply is weakest. Tell me what I should concede up front to take the sting out, and which single reply has to land for the whole paper to survive the hour.

  Format it as a prep sheet with these sections, in this order: "The thesis in one line" (one sentence, so I can hear it back); "Concessions to open with" (three or four bullets, short); "The objections, ranked" — this is the bulk, roughly a page per objection, each one headed by the objection as they'd actually say it, then "Who'll raise it," then "Two-minute reply," then "Where this is soft"; then "The one that has to land" (a short paragraph); then finally "The question I'm hoping nobody asks" (a few lines, and tell me straight whether I have an answer to it or not). Don't pad it with background on Malthus or on falsification — assume I know the material and just give me the ammunition and the soft spots.
