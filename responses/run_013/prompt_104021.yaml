answer: |-
  ## The Lid and The Floor

  The landlord sighs at peeling paint,  
  A hallway grey where plaster flakes  
  Like unanswered pleas. The ceiling's set:  
  No rise can meet what upkeep takes.  
  The queue snakes long past vacant doors –  
  *More hands than keys, than walls that stand.*  
  The lease goes not to highest bid,  
  But kin, or friend, or promised hand  
  Who'll fix the drip themselves, unplanned.  
  **The market's price, a ghostly shore.**  
  **The market's price, a ghostly shore.**  

  The manager posts, "Help Wanted: Skill!"  
  (Though hours shrink to thirty-two).  
  The wage floor stands, a rigid sill –  
  No dip below what statutes do.  
  The stack of names grows thick and deep –  
  *More souls than slots, than tasks assigned.*  
  The job goes not to willingness,  
  But degree, or reference signed,  
  Or cash exchanged, discreet, behind.  
  **The landlord sighs at peeling paint.**  

  ---

  **How it mirrors:**
  *   **Structure:** Strict 10-line halves, central mirrored line (10=11), opening/closing loop (1=20).
  *   **Symmetry:** 
      *   *Shortages:* "More hands than keys" / "More souls than slots"
      *   *Non-Price Rationing:* "Lease goes... to kin, or friend" / "Job goes... to degree, or reference"
      *   *Hidden Costs:* Tenant fixes drip / Cash exchanged behind
      *   *Concrete Decay:* "Peeling paint," "hallway grey" / "Hours shrink to thirty-two"
  *   **Ethics:** The core tension ("The market's price, a ghostly shore") acknowledges the market outcome may be *wrong* ("a lousy price"), justifying intervention, while showing its unintended distortions. No verdict is imposed.
  *   **Loop:** The argument circles back on itself – peeling paint leads back to peeling paint – reflecting the cyclical, unresolved debate.
  *   **Concrete Images:** The decaying hallway and the technically-full-time-but-32-hours job anchor each half in tangible reality.

  This captures the economic symmetry without jargon, honours the ethical ambiguity, and stays true to the feeling of arguments talking past each other, trapped in their own logic loops.
