prompt: |-
  I'm in this aesthetics course and we just read Hume's Of the Standard of Taste. My friend who's a grad student in philosophy gave me this summary of it and I definately can't tell if it's fair. He said: 'Hume thinks beauty isn't a property of objects, it's just a sentiment in the mind. So on his view all taste is subjective. But he doesn't want to leave it at that, so he says the standard of taste is the joint verdict of true judges. True judges are people with delicacy of taste, practice, comparison, freedom from prejudice, and good sense. Since all humans share the same nature, these true judges will all agree on the same works. So Hume actually thinks there is a universal standard of taste, and it's objective in the sense that it's just whatever the ideal critics converge on. The problem is that this contradicts his empiricism, because he can't derive an objective standard from subjective feelings. So his essay is a failed attempt to have it both ways: he admits taste is subjective but then smuggles in an objective standard by appealing to an elite group of critics. Also, he thinks we can always identify who the true judges are, which is circular because we only know they have good taste because they agree with each other.' Is this fair? Please go sentence by sentence and tell me what a Hume scholar would accept, what they'd wince at, and what is just wrong. Then tell me whether his conclusion that Hume's essay is a failed attempt to have it both ways follows from the accurate parts, and what a defender of Hume would say to rescue him from the charge of inconsistency.
