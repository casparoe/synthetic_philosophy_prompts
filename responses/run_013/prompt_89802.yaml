  Solution: Use simple metaphors (geology, time layers). Focus on sensory details (shovels, roots, leaves). Frame the planting as a collective act of faith in continuity, without stating it outright. Let the trees embody resilience, subtly prompting reflection on why we care for things beyond our time. End with inclusive gratitude, tying back to the community.

