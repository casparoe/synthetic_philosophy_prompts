  ## The Riverside Annexation: A Fair Path Forward

  **(Three-minute timer starts)**

  Councilmembers, neighbors, folks just hoping we’ll finally fix Elm Street – thank you for the chance to speak. We’re here about annexing Riverside. It’s a big decision: new neighbors, shared services, taxes, identity.

  Right now, the rules say only current city residents vote. The charter is clear. But Riverside folks feel shut out. They rightly say, “This changes *our* lives profoundly. Shouldn’t *we* have a say in our own future?”

  Both sides have a point. And that’s the core problem we face: **Who gets to decide who decides?**

  Think of it like moving a fence in your backyard. If the fence marks your property, who gets to vote on moving it? Just the people inside the *current* fence? Or also the people whose land the *new* fence would encompass? It feels circular. You need a fair starting point, but the starting point itself is what’s being argued over.

  This isn't just philosophy; it’s practical fairness. Telling Riverside, "You have no voice in joining us," builds resentment before we even start. It makes integration harder. And for current residents, voting "yes" without Riverside's clear consent risks inheriting a community that doesn’t want to be here, creating friction for years.

  **So, how do we break this circle fairly? How do we give both groups a voice without ignoring the charter or silencing Riverside?**

  **Here’s a concrete, practical proposal: A Joint Vote with a Sunset Clause.**

  1.  **Joint Vote:** Hold a *single* referendum where **both current city residents AND Riverside residents** cast ballots. Both groups matter here. Annexation would only pass if it wins majority support **in both communities.**

  2.  **Sunset Clause:** But let's acknowledge this is a big change. Build in a five-year review. If, after five years of integration, either the original city residents *or* the former Riverside residents feel the arrangement is fundamentally failing – through a clear petition process or another vote – we reopen the question. It’s not a guaranteed exit, but a safety valve, forcing us to make it work well for everyone.

  **Why this works:**

  *   **Mutual Consent:** It respects Riverside’s stake in their own future *and* respects current residents' stake in changing their city. Annexation requires buy-in from *both* sides. It’s not imposed; it’s agreed upon.
  *   **Practical Democracy:** It breaks the "who decides" deadlock. We step outside the circle for *this specific decision* and create a fair procedure that includes everyone affected.
  *   **Builds Unity:** Starting with mutual consent fosters partnership, not resentment. It sends the message: "We’re making this decision *together* as future neighbors."
  *   **Future Flexibility:** The sunset clause isn’t about failure; it’s about responsibility. It ensures both sides stay committed to a successful integration. If it’s working well after five years, it becomes permanent. If not, we adjust.
  *   **Respects the Charter (Pragmatically):** This is a one-time, extraordinary procedure for an extraordinary decision – defining the fundamental boundaries of the demos itself. It doesn't rewrite the charter for future votes; it solves *this* unique problem fairly.

  Folks worried about potholes: this isn't abstract theory. It’s about ensuring a smooth transition so we *can* focus on shared services and smooth roads together, without starting off divided. Politics nerds: this is the boundary problem solved practically – mutual consent plus a review mechanism.

  Let’s not get stuck in the circle of "who decides." Let’s step out of it. Let’s give both current residents and Riverside neighbors a direct voice in this defining moment. Let’s vote together, and let’s build in a check to ensure it works for everyone long-term.

  Please consider this fair path forward. Thank you.

  **(Three-minute timer ends)**
