  Below is a decision tree designed to disentangle the debate over the age of nations. Each branch node is a question students can answer without knowing the outcome. The tree addresses the specified dimensions (e.g., focus, ontology, role of pre-modern ties). Positions are named where standard labels exist (e.g., **Primordialism**, **Modernist Constructivism**), and marked "unnamed" otherwise. After the tree, I analyze the four cases for each leaf and note where positions overlap.

  ---

  ### **Decision Tree: The Age of Nations Debate**

  #### **Start: What is the primary focus when discussing the nation's age?**
  1. **National identity among ordinary people**  
     → Go to Q2.  
  2. **Nationalist ideology**  
     → Go to Q3.  
  3. **The state**  
     → Go to Q4.  

  ---

  #### **Q2 (Focus: Identity): Is national identity a product of deliberate human design?**
  1. **No, it emerges organically**  
     → Go to Q5.  
  2. **Yes, it is engineered**  
     → Leaf: **Modernist Constructivism** (e.g., Benedict Anderson).  

  #### **Q3 (Focus: Ideology): Is nationalism the cause or product of the nation?**
  1. **Cause: Nationalism creates the nation**  
     → Leaf: **Modernist Instrumentalism** (e.g., Elie Kedourie).  
  2. **Product: The nation creates nationalism**  
     → Go to Q6.  

  #### **Q4 (Focus: State): Does the state create the nation, or vice versa?**
  1. **The state creates the nation**  
     → Leaf: **Statist Modernism** (e.g., Ernest Gellner).  
  2. **The nation creates the state**  
     → Go to Q6.  

  ---

  #### **Q5 (Identity not designed): Are pre-modern ethnic ties necessary for national identity?**
  1. **Yes, they are foundational**  
     → Leaf: **Ethnosymbolism** (e.g., Anthony Smith).  
  2. **No, they are incidental raw material**  
     → Leaf: **Perennialism** (unnamed variant).  

  #### **Q6 (Nation precedes ideology/state): Is the nation a real collective agent?**
  1. **Yes, it exists independently of beliefs**  
     → Leaf: **Primordialism** (e.g., Clifford Geertz).  
  2. **No, it is a discursive construct**  
     → Leaf: **Perennialism** (standard form).  

  ---

  ### **Leaf Positions Summarized**
  1. **Primordialism**: Nations are ancient, real collective agents; ethnic ties are necessary and genuine.  
  2. **Ethnosymbolism**: National identity is organic and rooted in pre-modern ethnic ties, but nations are modern.  
  3. **Perennialism (standard)**: Nations recur throughout history but are not continuous; they are discursive constructs.  
  4. **Perennialism (unnamed variant)**: National identity is organic but doesn't require pre-modern ties; ethnicity is raw material.  
  5. **Modernist Constructivism**: National identity is engineered by elites; "invented" contrasts with organic growth.  
  6. **Modernist Instrumentalism**: Nationalist ideology invents nations; "invented" contrasts with unplanned.  
  7. **Statist Modernism**: The state manufactures nations; modernity refers to their recent appearance.  

  ---

  ### **Analysis of Four Cases**
  Each case is evaluated from all leaf positions. Verdicts are:  
  ✅ **Fits** (position explains the case well).  
  ⚠️ **Partial fit** (position explains aspects but strains on others).  
  ❌ **Does not fit** (position contradicts the case).  

  | **Position**               | **Case 1: Stateless diaspora (e.g., Jews pre-Israel)** | **Case 2: Manufactured state (e.g., Singapore)** | **Case 3: Forged myths (e.g., 19th c. Serbia)** | **Case 4: Unspoken language (e.g., Ireland)** |
  |----------------------------|--------------------------------------------------------|--------------------------------------------------|-------------------------------------------------|-----------------------------------------------|
  | **Primordialism**          | ✅ Ancient identity persists.                         | ❌ State cannot manufacture an ancient nation.   | ✅ Myths irrelevant; nation is real.            | ❌ Language disconnect undermines ethnicity. |
  | **Ethnosymbolism**         | ✅ Ethnic ties sustain identity.                      | ⚠️ Requires pre-modern ties; state may lack them. | ✅ Myths leverage authentic symbols.            | ✅ Language is symbolic, not functional.     |
  | **Perennialism (standard)**| ⚠️ Identity exists but is discursive, not ancient.   | ✅ State narratives create "perennial" nation.   | ✅ Myths validate discourse.                    | ✅ Language is a constructed symbol.          |
  | **Perennialism (unnamed)** | ✅ Identity organic, no ties needed.                  | ✅ State uses any raw material.                  | ✅ Attachment unrelated to truth.               | ✅ Language symbolic, even if unspoken.      |
  | **Modernist Constructivism**| ⚠️ Identity predates design; elites didn't create it. | ✅ State elites engineered identity.             | ✅ Myths exemplify invention.                   | ✅ Language is a deliberate national marker. |
  | **Modernist Instrumentalism**| ❌ Ideology didn't create diaspora identity.          | ✅ State uses ideology to invent nation.         | ✅ Myths are instrumental tools.                | ⚠️ Language disconnect challenges ideology.  |
  | **Statist Modernism**      | ❌ No state to create identity.                       | ✅ State manufactures nation rapidly.            | ✅ Myths serve state-building.                  | ⚠️ State promotes language as policy tool.   |

  ---

  ### **Overlaps and Unexplored Combinations**
  1. **Identical verdicts on all cases**:  
     - **Ethnosymbolism** and **Perennialism (unnamed variant)** both return:  
       ✅ Case 1, ✅ Case 2, ✅ Case 3, ✅ Case 4.  
       **Why?** Both treat identity as organic and myths/symbols as functional.  
       **To separate**: Introduce a case with **no pre-modern ties** (e.g., a new nation built from diverse groups). Ethnosymbolism requires ties (❌), while the unnamed variant does not (✅).  

  2. **Unexplored combinations**:  
     - **Focus on identity + Nation causes nationalism + State as focus**: No leaf occupies this.  
       **Why?** Incoherent—if identity is primary, the state can’t be the driver.  
     - **Focus on ideology + Pre-modern ties necessary + "Invented" as unplanned**: No leaf.  
       **Why?** Unattractive—ideology implies design, contradicting "unplanned."  
     - **Focus on state + Nation as discursive construct**: No leaf.  
       **Why?** Unexplored—statist views typically treat the nation as engineered, not discursive.  

  ---

  ### **Key Insights**
  - **Case 1 (diaspora)** challenges state- and ideology-focused positions (Statist Modernism, Modernist Instrumentalism).  
  - **Case 2 (manufactured state)** challenges Primordialism but fits Modernist and Perennialist views.  
  - **Case 3 (forged myths)** fits all positions except strict Primordialism (which dismisses myths as irrelevant).  
  - **Case 4 (unspoken language)** is most problematic for Primordialism and Modernist Instrumentalism (which emphasize functional/ideological coherence).  

  This tree clarifies positions by forcing students to specify their claims. Overlaps (e.g., Ethnosymbolism vs. unnamed Perennialism) reveal where theories converge, while gaps highlight unresolved tensions.
