  2. **Overcorrecting after Round 1**: Spending too much on counsel in Round 2, starving the world.
     - _Handling_: Remind them that tokens spent on counsel cannot help anyone. The goal is balance. In debrief, discuss the cost of knowledge.

  3. **Dominant students**: One or two students do all the work.
     - _Handling_: Assign roles at each table (e.g., reader, allocator, counsel buyer, scorekeeper). Rotate in Round 2.

