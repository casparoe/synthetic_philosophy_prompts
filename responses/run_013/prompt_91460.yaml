     - The optimal allocation = the best possible world given constraints.
     - Leaving Kai unhelped in some strategies = permitting local evil for the sake of the whole.

  3. **Final Question**: "When you were allocating tokens, were you feeling love for the petitioners? Or were you feeling strategic calculation? How might Leibniz's definition of love as 'taking disinterested delight in their perfection' fit with what you did?"

  ### Materials:
  - Dossier sheets for each petitioner (one set per table).
  - Counsel cards (six per table, but only revealed when bought; facilitator keeps them).
  - Token counters (or just use a spreadsheet).
  - Scoreboard.

