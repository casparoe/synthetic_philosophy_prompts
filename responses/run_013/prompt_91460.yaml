  ### Activity Design: The Steward's Dilemma  
  **Goal:** Students experience the tension between compassion-driven aid and systemic, wisdom-guided benevolence, mirroring Leibniz’s concept of justice as "the benevolence of the wise."  

  ---

  ### **Structure & Timing (90 Minutes)**  
  1. **Introduction (5 mins)**:  
     - Explain the setup: Each table (3–4 students) is a steward of the "Harmony Foundation," tasked with allocating "beneficence tokens" to improve a small world of six petitioners.  
     - **Objective**: Maximize the world’s "Perfection Score," which reflects the *systemic harmony* of the world, not just the sum of individual relief.  
     - **Resources**: 20 tokens per round (2 rounds total). Tokens can:  
       - **Aid petitioners** (costs vary).  
       - **Buy counsel cards** (2 tokens each), revealing hidden relational facts affecting the score.  
     - **Stakes**: Winning table picks next week’s discussion topic and receives a "Wisdom Medallion" (a token prize).  

  2. **Round 1: Initial Allocation (20 mins)**  
     - Tables receive **dossiers** (below) but *no hidden facts*.  
     - Allocate tokens (aid or counsel) without knowing the score formula.  
     - Submit decisions.  

  3. **Scoring & Reflection (10 mins)**  
     - Facilitator computes scores publicly using the formula (revealed now).  
     - Highlight how compassion-led choices (e.g., aiding the most pitiable) lowered scores due to hidden penalties.  

  4. **Round 2: Informed Allocation (20 mins)**  
     - Tables receive carryover tokens (unspent from Round 1 + fresh 20).  
     - Use insights from Round 1 scoring and counsel cards (if bought) to reallocate.  

  5. **Final Scoring & Winner Announcement (5 mins)**  
     - Compute Round 2 scores + total. Declare winner.  

  6. **Debrief (30 mins)**:  
     - Reveal Leibniz’s name/thesis. Map gameplay to his philosophy (detailed below).  

  ---

  ### **The World: Six Petitioners**  
  Each dossier includes: **Name, Visible Need, Cost to Help, Base Score if Helped, and Visible Relationships/Claims**.  
  *(Base Score = Individual contribution to perfection if helped; higher = greater potential to enhance the system.)*  

  1. **Kai (The Addicted Veteran)**:  
     - **Visible Need**: Homeless, severe PTSD, needs rehab (cost: 4 tokens).  
     - **Base Score**: 3 (stabilization).  
     - **Visible Claim**: None. Most visibly suffering.  
     - **Relationships**: Seen near Elena’s garden; mutters about "repaying debts."  

  2. **Elena (The Elderly Gardener)**:  
     - **Visible Need**: Struggling to maintain community garden; needs tools/help (cost: 2 tokens).  
     - **Base Score**: 7 (garden feeds community).  
     - **Visible Claim**: Owes Farid money from a loan; dossier includes an IOU.  
     - **Relationships**: Garden is a community hub; Kai often sleeps there.  

  3. **Farid (The Wronged Merchant)**:  
     - **Visible Need**: Business ruined by a rival’s fraud; needs capital to restart (cost: 6 tokens).  
     - **Base Score**: 6 (restores commerce).  
     - **Visible Claim**: Elena owes him a debt (visible in dossier). Ordinary justice demands repayment.  
     - **Relationships**: Hires local workers; resentful of "charity cases."  

  4. **Dara (The Orphaned Student)**:  
     - **Visible Need**: Dropped out of school to care for sick aunt; needs tuition (cost: 4 tokens).  
     - **Base Score**: 8 (education benefits society).  
     - **Visible Claim**: None.  
     - **Relationships**: Aunt was Elena’s friend; often studies in the garden.  

  5. **Ben (The Injured Craftsman)**:  
     - **Visible Need**: Lost hand in accident; can’t work, needs prosthesis (cost: 5 tokens).  
     - **Base Score**: 5 (returns to skilled labor).  
     - **Visible Claim**: None.  
     - **Relationships**: Taught Farid’s son; close to Dara.  

  6. **Lila (The Reclusive Inventor)**:  
     - **Visible Need**: Depressed, isolated; needs lab materials to build clean-water device (cost: 3 tokens).  
     - **Base Score**: 9 (innovation helps all).  
     - **Visible Claim**: None.  
     - **Relationships**: Distant relative of Kai; ignored by community.  

  ---

  ### **Hidden Relational Facts**  
  *(Revealed via counsel cards; one fact per card.)*  
  1. **Kai & Elena**: If both helped, Kai tends the garden and boosts its yield: **+10 to score**. If only Kai helped, he relapses without the garden’s peace: **-5 penalty**.  
  2. **Farid & Elena**: If both helped, Farid forgives Elena’s debt and hires her: **+10 bonus**. If only Farid helped, he forecloses on her garden: **-5 penalty**.  
  3. **Dara & Ben**: If both helped, Dara invents tools for Ben’s prosthesis: **Ben’s score doubles to 10**. If only Dara helped, Ben becomes destitute: **-5 penalty**.  
  4. **Lila & Kai**: If both helped, Lila’s device cleans water, curing Kai’s illness: **Kai’s score doubles to 6**. If only Lila helped, she becomes reclusive: **no bonus**.  
  5. **Ben & Farid**: If both helped, Ben mentors Farid’s son, improving community trust: **+7 bonus**.  
  6. **System Stability**: For every two petitioners helped, **+3 bonus** (e.g., helping four petitioners = +6). If fewer than two helped, **-5 penalty** (fragmentation).  

  ---

  ### **Score Formula**  
  **Total Perfection Score =**  
  - Sum of **base scores** for all helped petitioners.  
  - **Plus/Minus** bonuses/penalties from active relational facts.  
  - **Plus** system stability bonus/penalty.  

  *Example Calculation:*  
  - Table helps Elena (7), Kai (3), and Lila (9). Base = 19.  
  - Hidden fact #1 active (Kai & Elena helped): +10.  
  - Stability: 3 helped = +3.  
  - **Total = 19 + 10 + 3 = 32**.  

  *(Formula is simple enough to compute quickly; bonuses/penalties are designed to make holistic choices optimal.)*  

  ---

  ### **Optimal Play & Why It Bites**  
  - **Optimal Strategy**:  
    - **Buy 2 counsel cards** (4 tokens) to reveal key facts (e.g., #1 and #3).  
    - **Aid Elena (2), Kai (4), and Dara (4)**. Total spent: 10 tokens.  
    - **Do not help Farid** (his claim conflicts with Kai’s needs) or Lila (costs outweigh benefits without Kai).  
    - **Result**: Base = Elena (7) + Kai (3) + Dara (8) = 18.  
      - Fact #1: Kai & Elena helped: +10.  
      - Fact #3: Dara & Ben not both helped, but Ben ignored → no penalty.  
      - Stability: 3 helped → +3.  
      - **Total = 31**.  

  - **Why It Hurts**:  
    - Kai (most suffering) is helped only because of Elena’s systemic role.  
    - Farid’s claim of debt justice is ignored (helping him without Elena/Kai triggers penalties).  
    - Compassion toward Ben or Lila is suboptimal; resources go to Dara, who appears less needy.  

  ---

  ### **Predictable Failure Modes & Solutions**  
  1. **Refusing Counsel (Compassion Overload)**:  
     - *Risk*: Tables spend all tokens on aid, miss hidden penalties (e.g., helping Kai alone causes relapse).  
     - *Solution*: After Round 1, show how penalties tanked scores. Ask: "Did ignorance cost the world?"  

  2. **Knowledge Hoarding (Overcorrection)**:  
     - *Risk*: Tables spend most tokens on counsel, starving petitioners. Low stability penalties ensue.  
     - *Solution*: In scoring, note the cost of inaction. Ask: "Can wisdom exist without action?"  

  3. **Dominant Players & Disengagement**:  
     - *Risk*: 1–2 students monopolize decisions; others tune out during scoring.  
     - *Solution*: Assign roles (e.g., "Advocate for the Suffering," "Wisdom Seeker," "Scorekeeper"). Rotate in Round 2.  

  4. **Petitioner Attachment**:  
     - *Risk*: Tables resist reallocating from Round 1 "favorites" (e.g., Ben) even if scoring shows inefficiency.  
     - *Solution*: In debrief, ask: "Was your loyalty to the person or the system?"  

  5. **Formula Skepticism**:  
     - *Risk*: Students call the score arbitrary.  
     - *Solution*: In debrief, argue: "Perfection isn’t an opinion—it’s the harmony of interdependent parts. A violin string’s ‘good’ isn’t its tightness, but its fit in a symphony. Your role was to discover that symphony."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Wisdom as Essence-Knowledge**:  
     - The game reduces wisdom to "knowing rules," but for Leibniz, wisdom is insight into eternal truths/universal harmony.  
     - **Concede in Debrief**: "Leibnizian wisdom isn’t about beating a game—it’s about seeing the universe’s moral geometry."  

  2. **Delight vs. Duty**:  
     - Players optimize points, not experience love-as-delight.  
     - **Concede**: "Leibniz’s wise benefactor *delights* in perfection; you calculated points. But did you feel joy when systemic harmony emerged?"  

  3. **Theological Frame**:  
     - The score formula is human-made; for Leibniz, God compares all possible worlds.  
     - **Concede**: "We simulated one world; God weighs infinities. Permitted evils aren’t just ‘penalties’—they’re the price of the *best possible whole*."  

  4. **Non-Aggregative Good**:  
     - The formula still sums values; Leibniz’s perfection is prior to parts.  
     - **Mitigate**: Stress bonuses for *relations* (e.g., Kai & Elena) as the whole’s primacy.  

  ---

  ### **Debrief: Mapping Gameplay to Leibniz**  
  1. **Buying Counsel**:  
     - *Student Moment*: "We spent tokens on knowledge instead of aid—it felt cruel."  
     - *Leibniz Link*: Wisdom isn’t innate; it requires costly pursuit. Pity without knowledge is blind (§§ Theodicy).  

  2. **Ignoring the Most Suffering (Kai)**:  
     - *Student Moment*: "We left Kai unhelped in Round 1; his pain haunted us."  
     - *Leibniz Link*: Benevolence guided by wisdom may not relieve visible suffering if it disrupts the whole (Discourse on Metaphysics §36).  

  3. **Round 1’s Compassion Punishment**:  
     - *Student Moment*: "Helping Farid felt just, but it wrecked our score."  
     - *Leibniz Link*: Strict justice (e.g., repaying debts) is a lower degree; universal benevolence trumps it when conflicts arise (Codex Iuris Gentium).  

  4. **Honoring Claims vs. System**:  
     - *Student Moment*: "We helped Farid to honor his claim, but it hurt the garden."  
     - *Leibniz Link*: Justice degrees: strict (neminem laedere) < equity (suum cuique) < piety (universal benevolence). The wise transcend local claims.  

  5. **Final Question**:  
     - "When you allocated tokens, did you feel *love* for these petitioners? Leibniz defines love as ‘disinterested delight in another’s perfection.’ Was your ‘delight’ in their base scores? Or in the harmony bonuses? Or did points eclipse love?"  
     - Let silence sit.  

  ---

  ### **Materials**  
  - **Per Table**: Dossier packets, 20 token chips, counsel cards (face-down; reveal on purchase).  
  - **Facilitator**: Score formula cheat sheet, whiteboard for live scoring.  
  - **Setup**: Test the formula to ensure optimal play requires ignoring Kai/Farid initially.  

  This design forces students to *feel* Leibniz’s uncomfortable thesis: true benevolence risks looking like heartlessness, and wisdom is the difference between healing and harm.
