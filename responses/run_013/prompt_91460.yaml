  We are designing a resource allocation game with a knowledge-purchase option to simulate Leibniz's concept of wisdom-guided benevolence. The goal is for students to experience the tension between immediate compassion and holistic, knowledge-based giving.

  ### Core Structure:
  - **Setting**: 14 students, 90-minute seminar. Split into 3-4 tables (groups) of 3-5 students each.
  - **Rounds**: Two rounds of allocation. Each round is 20 minutes, with 10 minutes for scoring and reflection in between. Then 30 minutes for debrief.
  - **Tokens**: Each table has a fixed budget of 20 tokens per round (so 40 total for two rounds). Tokens not spent in Round 1 carry over to Round 2.
  - **Counsel Cards**: Each card costs 2 tokens and reveals one hidden relational fact. A table can buy multiple cards per round.

  ### The World: Six Petitioners
  Each petitioner has a dossier that describes their situation, visible needs, and some visible relationships. However, there are hidden relational facts that affect the overall perfection of the world. The perfection score is computed based on the state of each petitioner and the relational facts.

  #### Dossiers (visible to all tables):
  1. **The Struggling Artist (Aina)**
     - A painter who lost her studio in a fire. She is depressed and unable to create. She needs 5 tokens to rebuild her studio and resume work. Without help, she remains in despair. Her art, once created, can inspire others.
     - Visible: Her art has the potential to inspire the community.

  2. **The Injured Laborer (Ben)**
     - Suffered a back injury at work and cannot provide for his family. He needs 3 tokens for surgery to recover. Without it, he remains in chronic pain and his family suffers. His son (Dara) is one of the petitioners.
     - Visible: He is the sole provider for his family, which includes Dara.

  3. **The Orphaned Student (Dara)**
     - Ben's son, 16 years old. He had to drop out of school to work and support the family after his father's injury. He needs 4 tokens to return to school for a year. Without help, he will remain in low-wage labor.
     - Visible: He is Ben's son and has great academic potential.

  4. **The Elderly Gardener (Elena)**
     - Maintains a community garden that provides food and beauty. She is aging and needs 2 tokens for tools and a helper to keep the garden going. Without help, the garden will decay, affecting the neighborhood's morale and food supply.
     - Visible: The garden is a hub for the community.

  5. **The Wronged Merchant (Farid)**
     - A shopkeeper whose business was ruined by a rival's unfair practices. He is bitter and isolated. He needs 6 tokens to restart his business and regain his dignity. He also has a hidden history: he once mentored the rival (who is not a petitioner) and feels betrayed.
     - Visible: He has a strong sense of justice and a claim for restitution.

  6. **The Homeless Visionary (Gael)**
     - A philosopher living on the streets, often ignored. He has ideas for community projects that could transform the town, but he lacks stability. He needs 1 token for a month's shelter and food to write his proposal. Without it, he remains destitute and unheard. He is the most visibly suffering.
     - Visible: He is seen as eccentric but occasionally shares profound insights.

  ### Hidden Relational Facts (revealed by counsel cards, one per card):
  1. **Aina and Gael**: If both are helped, Aina's art will illustrate Gael's ideas, creating a powerful cultural movement that boosts the entire community. (Bonus: +10 if both are helped; no effect if only one or neither.)
  2. **Ben and Dara**: If Ben is helped, Dara automatically returns to school without needing tokens (because Ben can provide again). But if only Dara is helped, Ben remains unhelped and his condition worsens (penalty: -5). If both are helped, it's a double cost with no extra benefit.
  3. **Elena and the Garden**: The garden's health affects everyone. If Elena is helped, the garden thrives, providing a +5 bonus to the overall score. If not, and if no one else helps, it decays, causing -5. However, if Gael is helped and Elena is not, Gael's ideas include a plan to save the garden (so no decay) but only if Gael is helped.
  4. **Farid's Grudge**: If Farid is helped, he uses his business to hire the needy, which would be good. But if he is helped without also helping Gael, he becomes a harsh employer because of his bitterness. (If Farid is helped and Gael is not: -5; if both are helped: +5 because Gael's wisdom softens Farid.)
  5. **Gael's Network**: Gael is connected to all. If Gael is helped, every other helped petitioner gets an extra +2 to their individual score because of his encouragement. (This is multiplicative: if three others are helped, that's +6 total.)
  6. **Aina's Inspiration**: If Aina is helped, she inspires Dara to excel in school (if Dara is helped) or to pursue art if he doesn't return to school. (If Aina and Dara are both helped: Dara's individual score doubles. If only Aina is helped: Dara gets a +3 if unhelped, but he remains a laborer.)

