answer: |-
  ### Activity Design: "The Habit of the World"

  **Objective**: Students experience the contingency of causation by revealing that observed "rules" are mere habits that can vanish without violation, mirroring Ghazālī's occasionalism (where God sustains regularities moment by moment without inherent necessity).

  **Group Setup**:  
  - 3 tables (4-5 students per table).  
  - Roles per table (assign at start):  
    - **Agent** (1 person): Predicts outcomes.  
    - **Recorder** (1 person): Logs results.  
    - **Observers** (2-3 people): Analyze patterns and advise the Agent.  

  **Materials Per Table**:  
  - 1 deck of playing cards (remove jokers).  
  - 1 coin (provided by you for flips).  
  - 1 timer (you control centrally).  
  - 1 sheet of paper for recording (template below).  

  **Winning Condition**:  
  - Groups earn points for correct predictions. Most points wins "table bragging rights" (e.g., you’ll praise them in debrief). This adds light stakes.  

  **Hidden Rules (Known Only to You)**:  
  1. **Rounds 1-8 (Habit Phase)**:  
     - If the previous card was **RED**, the next card *should* be **BLACK** (and vice versa).  
     - *But*: This only applies 80% of the time (you enforce this covertly).  
  2. **Rounds 9-15 (Shift Phase)**:  
     - The pattern **reverses**: If the previous card was **RED**, the next card *should* be **RED** (and vice versa).  
     - *But*: This only applies 60% of the time (to simulate habit decay).  
  - **How you enforce**: When groups draw cards, you watch and intervene if needed. If a draw violates the hidden rule, say: "Wait, reshuffle and redraw—I think the deck was messy." This "interruption" masks the rule change.  

  **Activity Timeline (25-30 Minutes)**:  
  1. **Setup (2 min)**: Assign roles, distribute materials.  
  2. **Rounds 1-8 (10 min)**:  
     - Each table plays 8 rounds (1 round = 45 seconds).  
     - Per round:  
       - Agent predicts next card’s color (red/black) based on previous card.  
       - Agent flips the coin (decoy—it does nothing; ignore results).  
       - Agent draws top card.  
       - Recorder logs:  
         | Round | Prediction | Actual | Coin (H/T) |  
       - Observers whisper advice.  
  3. **Rounds 9-15 (8 min)**:  
     - Same as above, but hidden rule shifts (no announcement).  
  4. **Wrap-up (5 min)**: Tally points (1 point per correct prediction). Announce "winner."  

  ---

  ### Opening Script (Before Starting)  
  *Say this clearly and neutrally—do not hint at rules or philosophy:*  
  > "We’re doing a quick game about prediction. Each table has a deck and a coin. Assign these roles now: one Agent (makes predictions), one Recorder (logs results), and the rest are Observers. Here’s how it works:  
  > - The Agent predicts if the next card will be RED or BLACK.  
  > - The Agent flips the coin—it’s part of the process.  
  > - The Agent draws the top card.  
  > - The Recorder logs the prediction, actual color, and coin result.  
  > - Observers help spot patterns.  
  > You’ll do 15 rounds. Earn 1 point per correct prediction. Most points wins. I’ll time each round. Ready? Roles set? Begin."  

  *Start timer immediately—no further explanation.*

  ---

  ### Debrief Questions (25 Minutes)  
  *Guide them from concrete experience to Ghazālī’s ideas. Sequence matters:*  

  1. **Experience Recap**:  
     - "What patterns did you notice early on?" (They’ll say alternation: red → black → red, etc.)  
     - "When did predictions start failing? Did the coin flip explain it?" (No—coin was irrelevant.)  

  2. **Contingency Reveal**:  
     - "When the pattern broke, did it feel like a 'law of the deck' was violated?" (Likely yes.)  
     - "But *could* you actually see a ‘law’ forcing red to follow black? Or did you just expect it?" (Nudge: Expectations ≠ observation of necessity.)  

  3. **Habit vs. Law**:  
     - "Was the pattern more like a ‘law of physics’ (e.g., gravity) or a ‘habit’ (e.g., your morning routine)?"  
     - "When the habit changed, was the world ‘broken’? Or did things just unfold differently?"  

  4. **Connect to Ghazālī**:  
     - "In this game, the pattern was 80% reliable, then 60%. For Ghazālī, nature’s habits are 100% reliable—but not because of laws. **What holds up the habit**?" (God’s will, not inherent causes.)  
     - "Did you feel like the deck was ‘causing’ the next card? Or was something else (me, the rules) sustaining it?" (Transition: In Ghazālī, God sustains, not the objects.)  

  5. **Epistemic Gap Bridge**:  
     - "Even when predictions failed, did you lose all certainty? Why/why not?" (Highlight: Habits feel certain but are contingent.)  
     - "Ghazālī says God creates our expectations too. How might that explain why we ‘trust’ habits?"  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem**: Students brute-force the deck (e.g., count cards to exploit the pattern).  
     - **Fix**: Intervene with "reshuffle" requests early to reset the deck. Say: "I noticed uneven shuffling—redo."  

  2. **Problem**: Observers dominate, Agent feels passive.  
     - **Fix**: Announce: "Agents, you own the prediction—ask Observers only if stuck."  

  3. **Problem**: Groups fixate on the coin, not card patterns.  
     - **Fix**: In debrief, stress: "Did the coin actually matter? Or was it a distraction?"  

  4. **Problem**: Tallying points distracts from philosophy.  
     - **Fix**: Downplay competition. Say: "Points just track your predictions—we’re here to learn."  

  ---

  ### Gaps in the Activity (What You Must Explain)  
  1. **God’s Steadiness vs. Game’s Caprice**:  
     - The activity’s "habit decay" (80% → 60%) feels capricious, but **Ghazālī’s God is perfectly consistent**. The habit *never* breaks—it’s sustained at every moment by divine will. Say:  
       > *"In the game, the habit weakened to make you feel its contingency. But for Ghazālī, God’s habit is rock-steady—like gravity never flickering. The ‘habit’ isn’t unreliable; it’s just not* necessary *or self-powered."*  

  2. **Epistemic Certainty**:  
     - The game makes expectations *feel* shaky, but **Ghazālī says God causes our certainty**. Even though causation isn’t "in" objects, we *can* trust habits because God creates that trust. Say:  
       > *"When the pattern broke, you doubted. But Ghazālī argues God builds causal expectations into us. So while the habit isn’t in nature, we’re wired to rely on it—and that reliance is divinely guaranteed."*  

  3. **Atomism of Time**:  
     - The game’s "rounds" imply time continuity, but **Ghazālī sees time as discrete moments with no causal glue**. Each card draw is a fresh event, but students won’t feel God’s "re-creation" of the world at each instant. Say:  
       > *"Each round was like a moment in time—but in Ghazālī’s view, there’s no ‘chain’ between them. God creates each moment anew. The ‘habit’ isn’t a thread connecting events; it’s God choosing the same outcome repeatedly."*  

  4. **God’s Ubiquity**:  
     - Students might see you (the facilitator) as the "capricious god" interrupting. **Clarify**:  
       > *"My interruptions were a stand-in for divine action, but Ghazālī’s God isn’t an ‘intervener’—He’s the* only *actor. Every card draw, even in the ‘habit’ phase, was equally His direct doing."*  

  **Run it tight, and the activity will make them viscerally feel the contingency—then use the debrief to refine it toward Ghazālī.** No props needed beyond cards, coin, and timer.
