prompt: |-
  I've been drafted in to mark the second-year Pleasure, Desire and Welfare exam and I've got sixty-odd scripts to get through before Friday, so I'm outsourcing the judgement on a few of them. It's out of 20 across four parts, and the module uses the usual UK bands: 14+ first, 11–13 a 2:1, 8–10 a 2:2, 5–7 a third.

  Here's the question:

  (a) Hedonism says that pleasure, and only pleasure, is good in itself. Say what has to be true of pleasure for that to be a real theory rather than a slogan, then state the heterogeneity problem in the strongest form you can. (5)

  (b) Set out the common-feel account of pleasure and the attitudinal account. In each case say what the account claims unites pleasures and what it has to add in order to explain why pleasure is good. Then say what a disjunctive account — pleasure is either sensory or attitudinal — buys the hedonist and what it costs. (6)

  (c) In the seminar paper we read, the author proposes: a pleasure is any experience its subject wants to continue having for its own sake. Assess this as a solution to the heterogeneity problem. (5)

  (d) Does the hedonist have to say that the gloat — the satisfaction you take in a rival's failure — is good for the person gloating? (4)

  And here's one script:

  (a) Hedonism says pleasure and only pleasure is good in itself. For that to be a real theory rather than a slogan, pleasure has to pick out one thing: there must be some property that every pleasure has, which explains why they all belong together and why they are all good. The heterogeneity problem is that when we look at the candidates there doesn't seem to be any such property. The taste of a cold pint, the relief when a headache lifts, the satisfaction of getting a proof right and the delight of hearing that a rival has failed are all pleasures, but they don't feel alike, they don't have the same object, and they don't seem to share any one ingredient. So pleasure looks like a label over a heap of unrelated states and the theory loses its grip. Really the difficulty is one of measurement: without a common unit we can't compare or add up pleasures, so the hedonist can't say when one life is better than another and the whole calculus collapses.

  (b) Two replies are standard. The first keeps a common feel: pleasures differ in their content but share a hedonic tone, a way the experience feels, and it's the tone that makes them good. The second gives up on the tone and goes attitudinal: what makes something a pleasure is that the subject takes a certain attitude to it — enjoying it, being pleased that it is so — and the attitude rather than any sensation is the pleasure. This covers cases like being pleased that an old friend is doing well, where there's no distinctive sensation at all, and it doesn't have to find a feeling anywhere in the body. Mill is the obvious ancestor: his competent judges test is essentially the historical attempt to deal with heterogeneity, since it ranks pleasures by quality instead of treating them as one homogeneous mass, and Mill is best read as an attitudinal hedonist, the higher pleasures being the ones the judges take the right attitude to. The disjunctive version, where pleasure is either sensory or attitudinal, is the one most people now hold; it solves the original problem by fiat, since a disjunction doesn't need its disjuncts to have anything in common, though the hedonist then owes us two stories about why each disjunct is good.

  (c) The suggested fix looks like the best of the options. It gives us a common element without positing a common feel, since wanting to go on with something is something we can check for, and it explains why pleasures are the things we pursue without making the theory circular, because the wanting isn't derived from the pleasure, it's what makes the experience a pleasure in the first place. It does make desire central, but I don't think that's a problem for hedonism, because the desire is directed at the experience itself rather than at its consequences, so the goodness is still located in the experience, and the wanting is itself felt, so we haven't left the realm of feeling.

  (d) Yes. On hedonism the gloat is a benefit for the person gloating, since it's a pleasure and pleasures are good for the one who has them. That's a bullet the hedonist has to bite and it's a real cost — malice can make your life go better. But it isn't a refutation on its own, because hedonism is a theory of what's good for you, not a theory of what's admirable, and it can say the gloat is a good for the gloater while agreeing that it's morally awful and usually outweighed.

  What I want from you: a mark out of 20, a seperate mark and reasoning for each of (a)–(d), and the actual comments I can write on the script — quote the bits you're commenting on so I can see what you're responding to. Go through it point by point rather than giving me a general impression, and where something is arguable rather than plainly wrong, say so and say which way you'd come down. One line at the end on what would have lifted it into the next band. I don't need references or a reading list, just the assessment. Mark it as you find it — I'd rather be able to defend the mark on appeal than be nice about it.
reasoning: |-
  Okay, let me approach this marking systematically. The user needs a detailed assessment of this philosophy exam script with separate marks for each section and actionable feedback. 

  First, I'll break down the student's response against the mark scheme. For part (a), they've correctly identified that pleasure needs a unifying property for hedonism to be substantive, and presented the heterogeneity problem well by listing diverse pleasure examples. The measurement point is insightful but slightly overstated - that's worth flagging. I'd give this 4/5.

  For (b), they cover both accounts accurately but misattribute Mill to attitudinal hedonism when he's more associated with qualitative hedonism. The disjunctive account explanation is strong though. That Mill error costs them half a mark - 5/6 seems fair.

  Part (c) shows good engagement with the proposed solution, defending it against circularity concerns. But they miss the critical point about conflating desire with pleasure - that's a significant oversight. 3/5 reflects this gap.

  On (d), the answer is philosophically sharp - acknowledges the "bullet to bite" while distinguishing moral from prudential good. Full marks here (4/4).

  The script demonstrates strong conceptual understanding but has specific correctable errors. My marginal comments will quote problematic phrases like "Mill is best read as an attitudinal hedonist" to pinpoint issues. The band lift would require fixing the Mill point and addressing desire-pleasure distinction in (c).

  Total 16/20 sits comfortably in the 2:1 band (11-13). I'll structure feedback to show exactly where marks were lost so the examiner can justify it if appealed.
answer: |-
  Here's your mark breakdown and script comments, point by point:

  **Overall mark: 16/20** (Solid 2:1)

  **Script Comments (to write on script):**

  *   **On (a):** "You correctly identify the need for a unifying property to avoid slogan status and provide a clear, strong statement of the heterogeneity problem with good examples ("taste of a cold pint... delight of hearing that a rival has failed"). The point about measurement/comparison/collapse is insightful but arguably slightly *overstates* the immediate consequence for the theory; while problematic, the theory doesn't *entirely* collapse without a common unit (e.g., it could still say *any* pleasure is better than none, even if precise comparisons fail). **Mark: 4/5**"
  *   **On (b):** "You accurately set out the common-feel (hedonic tone) and attitudinal accounts, including what unites pleasures (tone/attitude) and what needs adding for goodness (the tone's goodness / the attitude's goodness). The disjunctive account's benefit (solves heterogeneity by fiat) and cost (owes two goodness stories) are correctly identified. **However, the claim 'Mill is best read as an attitudinal hedonist' is incorrect or highly contentious.** Mill's higher/lower pleasures and competent judges are standardly interpreted within *qualitative hedonism* (still sensory/experiential, just differing in kind), not attitudinal hedonism (where pleasure *is* the attitude). This misattribution is a significant error. **Mark: 5/6** (Docked 1 mark primarily for the Mill error)."
  *   **On (c):** "You provide a good assessment of the proposed solution (wanting to continue). You correctly note its strengths: avoiding a common feel, checkability, explaining pursuit, avoiding circularity by making desire constitutive. Your defence regarding desire being directed at the experience and itself felt addresses potential concerns well. **However, your assessment misses a key critical point: does this account conflate *pleasure* with *the object of desire* or *satisfaction of desire*?** It's arguable whether simply *wanting an experience to continue* (which could be due to curiosity, duty, etc.) is sufficient to make it a *pleasure*, or whether this captures the intrinsic 'feel-good' aspect central to hedonism. You present it as 'the best option' without engaging with this potential weakness. **Mark: 3/5** (Docked for lack of critical engagement with a core objection)."
  *   **On (d):** "Excellent answer. You correctly state the hedonist *must* say the gloat is good for the gloater (as it's a pleasure), explicitly identify this as a 'bullet to bite', and crucially distinguish between prudential good (what benefits the agent) and moral admirability, explaining why this cost doesn't refute hedonism *as a theory of welfare*. All key points covered concisely and accurately. **Mark: 4/4**"

  **What would lift it to the next band (14+):** Addressing the significant Mill misattribution in (b) and offering a critical analysis of the potential desire/pleasure conflation in the proposed solution for (c) would have demonstrated the higher level of precision and critical depth needed for a First.
