  The ambiguities here include how literally to take his advice. Is it universal or personal? Nietzsche likely intends it as a principle to attend to bodily conditions, but the specifics are his own. Also, the term "idealism" could be broader than philosophical idealism, possibly including religious or cultural attitudes. The user needs to decide based on their interpretation.

