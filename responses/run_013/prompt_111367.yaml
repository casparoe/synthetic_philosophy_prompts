  Below is a complete, runnable design for your in-class activity, optimized for pedagogical impact within your constraints. The core innovation is a **Threshold Rollover Game** that creates a sharp divergence between individual dominance and collective/superrational reasoning, while incorporating Hofstadter's key elements (vanishing prize under congestion, rollover for abstention). The activity uses points convertible to candy/coffee cards for stakes.

  ---

  ### **Game Structure: Threshold Rollover Game**
  - **Players**: 18 students  
  - **Choice per round**: Claim (C) or Pass (P)  
  - **Prize pool**: Fixed at 18 points.  
  - **Payout rules**:  
    - If **total claimants (K) = 0**: All players get 3 points (rollover bonus).  
    - If **1 ≤ K ≤ 2**: Each claimant gets 9 points (split evenly). Non-claimants get 0.  
    - If **K ≥ 3**: Prize pool *vanishes*; all players get 0 points.  
  - **Payoff table** (distribute to students):  

  | Your choice | Total claimants (K) | Your payoff |
  |-------------|----------------------|-------------|
  | Pass        | 0                   | 3           |
  | Pass        | 1–2                 | 0           |
  | Pass        | ≥3                  | 0           |
  | Claim       | 0                   | 9           |
  | Claim       | 1                   | 9           |
  | Claim       | 2                   | 9           |
  | Claim       | ≥3                  | 0           |

  **Key properties**:  
  - **Dominance**: Claiming is *weakly dominant* (if K=0: claim=9 > pass=3; if K=1: claim=9 > pass=0; if K=2: claim=9 > pass=0; if K≥3: claim=0 = pass=0).  
  - **Superrational/collective optimum**: Universal passing (all get 3) or exactly 2 claimants (claimants get 9, others get 0) both beat universal claiming (all get 0).  
  - **Tension**: Universal claiming is individually rational but collectively catastrophic.  

  ---

  ### **Materials & Setup**  
  1. **Materials**:  
     - **18 slips** per round (blank paper; students write "C" or "P").  
     - **Tally sheet** for instructor (track K per round).  
     - **Payoff table** (photocopy for all).  
     - **Candy/coffee cards** (for payout: 1 point = 1 candy/card).  
     - **Secret instruction card** for the plant (used in Round 4).  

  2. **Seating**:  
     - Arrange in a circle/U-shape so students can see each other during discussions.  
     - Assign numbers 1–18 (for anonymity in tallying).  

  3. **Payout**:  
     - Randomly select 1 round post-game (die roll); convert points to candy.  
     - **Stakes**: Trivial (e.g., 9 candies max) but desirable.  

  ---

  ### **Rounds (25–30 min total)**  
  Run 5 rounds; vary information/identity conditions. Announce rules before each:  

  | Round | Condition                           | Time  | Key Variations                          |  
  |-------|-------------------------------------|-------|-----------------------------------------|  
  | 1     | Baseline: Simultaneous, anonymous, no talk. | 3 min | No communication.                         |  
  | 2     | Open discussion: 4-min talk, then simultaneous write. | 7 min | Allow persuasion, no binding agreements. |  
  | 3     | Twin reasoning: Assume your "twin" (another student) reasons identically to you; no talk. | 3 min | Pair students (e.g., 1↔2, 3↔4...); each told: "Your twin has identical info and reasoning. Whatever you choose, they will choose the same." |  
  | 4     | Planted defector: Open discussion + 1 plant instructed to claim. | 7 min | Privately instruct one student pre-round: "Always claim, no matter what others say." Others unaware. |  
  | 5     | Team coordination: Open discussion, aim for collective optimum. | 7 min | Encourage explicit coordination: "Agree on how many should claim, and who." |  

  **Timeline**:  
  - **Setup (5 min)**: Explain rules, distribute payoff tables.  
  - **Rounds (30 min)**: 5 rounds × 6 min each (adjust discussion time if needed).  
  - **Tallying**: After each round, collect slips, announce K, and let students note payoffs.  
  - **Debrief (30 min)**: Structured discussion.  

  ---

  ### **Predictable Challenges & Mitigation**  
  1. **Haggling in Round 2/5**:  
     - Students bargain over who claims.  
     - **Mitigation**: Announce: "You may discuss strategy, but agreements aren’t binding. Focus on why coordination is hard." Use this to highlight free-rider incentives.  

  2. **Free-rider spoils cooperation (Round 2/5)**:  
     - One student claims despite agreement to pass.  
     - **Mitigation**: In debrief, ask: "Did anyone feel tempted to claim? Why? What did that do to the group’s outcome?"  

  3. **"Just a coordination problem" skeptic**:  
     - Student argues there’s no dilemma, only coordination.  
     - **Mitigation**: In debrief, contrast Rounds 1 (no talk → high K) and 3 (superrational → low K): "Why did claiming dominate in Round 1, but not Round 3? What changed?"  

  4. **Plant revealed early (Round 4)**:  
     - Plant accidentally admits role during discussion.  
     - **Mitigation**: Instruct plant: "If asked, say you’ll claim but don’t reveal you’re instructed."  

  5. **Universal claiming in Round 3**:  
     - Students ignore twin reasoning, claim anyway.  
     - **Mitigation**: In debrief, ask: "If your twin reasons like you, what *must* you both choose? Why might claiming still feel tempting?"  

  ---

  ### **Debrief Framework (30 min)**  
  **Anchor discussion to observed moments**:  

  1. **Moment 1: "It doesn’t matter what I do"** (Likely in Round 1).  
     - *Ask*: "In Round 1, did anyone think, ‘My choice won’t change K much’? What does the payoff table say about being the *3rd claimant*?"  
     - **Point**: Show K=2→3 turns 9→0. Marginal impact is huge, but dominance reasoning ignores this.  

  2. **Moment 2: "We’re all in the same position"** (Likely in Round 3).  
     - *Ask*: "In Round 3, why did some pass? How does ‘we all reason alike’ change the game?"  
     - **Point**: Superrationality (identical reasoning) forces symmetry → passing is uniquely rational if all do it (3 > 0).  

  3. **Moment 3: "They’re selfish!" vs. payoffs** (Likely in Round 4).  
     - *Ask*: "In Round 4, did the group blame ‘selfish’ players? Check payoffs: Did claiming *actually* benefit individuals when K≥3?"  
     - **Point**: Blaming "selfishness" misfires—claiming was dominant but *harmed everyone* (K≥3 → 0). The structure, not intent, caused failure.  

  4. **Moment 4: Team vs. individual success** (Likely in Round 5).  
     - *Ask*: "Did Round 5 succeed? If so, how? If not, why? What’s harder: agreeing on a plan or sticking to it?"  
     - **Point**: Team reasoning ("what’s best for us?") can beat dominance but requires trust.  

  **Connect to concepts**:  
  - **Dominance**: "Why did claiming *feel* rational in Round 1?" (It’s always ≥ passing).  
  - **Superrationality**: "How did Round 3 resolve the tension? What if players aren’t identical?"  
  - **Team reasoning**: "When did the group act as a ‘we’? Did it work?"  
  - **Causal vs. evidential**: "In Round 3, did your choice *cause* others to match you? Or was it *evidence* of what they’d do?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Scale effects**:  
     - Hofstadter’s lottery involves thousands of strangers; 18 classmates can coordinate face-to-face.  
     - **Supply via lecture**: Contrast mass anonymity (evidential reasoning dominates) vs. small groups (causal reasoning feels plausible).  

  2. **Causal isolation**:  
     - Students interact; true superrationality assumes no causal links but perfect reasoning alignment.  
     - **Supply via lecture**: Discuss Hofstadter’s thought experiment: "If you were sealed in a room, knowing clones reason identically, would you claim?"  

  3. **Pure evidential reasoning**:  
     - Students default to causal language ("My choice doesn’t affect others").  
     - **Supply via lecture**: Formalize evidential decision theory: "Choosing C is evidence that your twins choose C → you get 0."  

  ---

  ### **Instructor Script (Key Excerpts)**  
  **Setup**:  
  > "We’ll play 5 short rounds. In each, you choose Claim or Pass. Payoffs depend on *total claimants* (K). If K=0, all get 3 points. If K=1–2, claimants split 18 points. If K≥3, all get 0. After the game, we’ll randomly pick one round—your points convert to candy. Here’s the payoff table."  

  **Round 3 (Twin)**:  
  > "This round, you’re paired with a twin (e.g., #1 with #2). Assume your twin has identical information and reasoning. Whatever you choose, they’ll choose the same. No talking—decide based on this."  

  **Round 4 (Plant)**:  
  > (Privately tell plant: "In Round 4, claim no matter what.")  
  > "Open discussion: 4 minutes to persuade others. Then write choices."  

  **Round 5 (Team)**:  
  > "Discuss openly: Agree on how many should claim and who. But remember—no binding promises. Write your choice."  

  **Debrief launch**:  
  > "In Round 1, K was [actual K]. Why did so many claim? In Round 3, why did K drop? When we discussed, why didn’t agreements hold? Let’s map this to rational choice puzzles."  

  ---

  This design forces students to *experience* the tension between individual and collective rationality, with minimal lecturing. The Threshold Rollover Game ensures dominance and superrationality diverge, while rounds progressively layer complexity. Debrief ties abstract concepts to lived moments, using their own choices as data.
