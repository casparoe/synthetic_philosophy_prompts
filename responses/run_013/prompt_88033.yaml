prompt: |-
  I'm a novelist — third book out next spring, which is neither here nor there — and for the last couple of years I've been collecting the way stories change as they get passed around, partly out of self-interest, since I keep stealing other people's versions of things. Here's a pattern I've noticed and can't find a word for. I have a family recipe that four generations have made and nobody has the original of; every time someone makes it "the way grandma did" it comes out basicly the same, even though if you ask three aunts for the recipe you get three different lists. Same thing with an urban legend that circulates in my city — the details wander (it's a hotel, no it's a car park, it was a freind of a friend), but the load-bearing beats are always identical, and if you tell it wrong people correct you instantly and with total confidence. And a joke my dad tells: everyone tells it slightly differently, but the bad versions die off and the punchline keeps snapping back to the same shape. What strikes me is that the thing isn't being preserved by anybody's memory — nobody can recite it. It's being pulled back into shape from the outside, and the pull seems to have a direction: the surviving versions are the tidier ones, more symmetrical, more morally pointed, more quotable, as if whichever version is easiest to be sure of is the version that wins.

  I've read Dawkins on memes and it doesn't quite do it for me, because his picture is a copy that gets copied accurately and then either survives or doesn't, whereas what I'm looking at is a copy that gets copied badly but in a consistent direction, so the error itself is what keeps it stable — the thing sits at the bottom of a bowl and every knock rolls it back to the middle, instead of being a billiard ball that goes wherever it's hit. I genuinely don't know if I'm describing one phenomenon or two, or whether the bowl is in the idea or in us.

  So: you're a philosopher of biology or a cognitive anthropologist, take your pick, and please think carefully before answering. Is there an established name for this — for the property of an idea that makes its corrupted copies converge on the same form, and for the shape they converge on? If there is, tell me what it's called and how it differs from the nearest things people usually reach for (memes, natural selection of ideas, telephone-game degradation, the vague thought that memorable things survive). If there isn't, coin me one and define it, and be precise about the edges: is the convergence a matter of the content of the idea or of the minds receiving it, does it need a population or does it happen down a single chain of tellers, does it require the errors to be random or can deliberate distortion do the same work, and what would count as the same phenomenon in another medium entirely — a tune, a slogan, a rumour, a scientific result that everyone half-remembers. I don't want a label, I want the carving, so start by brainstorming three or four candidate concepts and then tell me which one actually fits and exactly where it breaks.
reasoning: |-
  Okay, the user is a novelist who's noticed a fascinating pattern in how stories evolve when passed down. They've observed that family recipes, urban legends, and jokes change in details but maintain their core structure. The key point is that the "load-bearing beats" remain consistent, even though individuals can't perfectly recall the original. They've read Dawkins on memes but feel it doesn't capture this phenomenon where errors aren't random but converge toward a stable form.

  The user is looking for a precise term or concept that describes this convergence. They want to know if there's an established name, or if a new term needs to be coined. They also want clarity on whether the convergence is due to the idea's content or the minds receiving it, whether it requires a population, if errors must be random, and examples in other mediums like tunes or slogans.

  First, I need to recall related concepts. Memetics comes to mind, but as the user pointed out, Dawkins' memes focus on high-fidelity replication, which doesn't fit here. Then there's the idea of attractors in cultural evolution. Attractors in dynamical systems pull variations toward a stable state. That seems relevant. Daniel Dennett's design stance might relate, where people reconstruct based on perceived purpose. Also, cognitive schemas or cultural attractors from anthropology, where shared mental frameworks shape how stories are recalled.

  The user mentioned that the surviving versions are tidier, more symmetrical, morally pointed, and quotable. This suggests cognitive biases play a role—things that align with our cognitive preferences are more easily remembered and transmitted. So the convergence isn't random; it's directed by what's memorable or satisfying to the human mind.

  I should consider if this requires a population or can happen in a single chain. Cultural attractors usually need multiple retellings across a group because the convergence emerges from collective cognition. Individual memory might not suffice; it's the social transmission that allows the attractor to manifest.

  Regarding deliberate distortion: if someone intentionally changes a story but the core elements are preserved due to their importance, it might still converge. However, deliberate changes could push the story away if they alter the key beats. Random errors are more likely to be corrected by the attractor, while deliberate ones might resist if they serve a different purpose.

  For other mediums, a tune might morph into a more melodic version, a slogan becomes catchier, a rumor loses irrelevant details but keeps the shocking element. Scientific results could be simplified into a "half-remembered" version that's more intuitive but less accurate.

  The key concept here is the attractor. The attractor is the stable form that variations converge on, shaped by both the content's structure and cognitive biases. The property of the idea that causes this convergence could be called "attractor strength" or "morphic stability." But maybe coining "attractor basin" for the phenomenon and "attractor form" for the stable version.

  Existing terms like cultural attractor theory (Claidière & Sperber) fit well. They argue that cultural variants evolve toward forms that are easier to remember and transmit. This aligns with the user's observations. The attractor is in the interaction between the idea and the minds, not solely in one or the other.

  The user wants precision: distinguish this from memes (high-fidelity vs. reconstruction), natural selection (selective retention vs. convergent transformation), telephone degradation (random drift vs. directed convergence), and memorability (which is part of it but not the full mechanism).

  So the established term is "cultural attractor." The property is "attractor-driven stability," and the stable form is the "attractor variant." If coining, "convergent stability" or "morphic coherence," but cultural attractor is already in use. The user might prefer the existing term but needs it clearly defined in their context. They might also appreciate how it differs from similar concepts and why it fits their examples. Emphasizing that the convergence is due to cognitive biases and social transmission, creating a self-correcting system even with errors.
answer: |-
  What you're describing is a profound phenomenon at the intersection of cognition, culture, and information dynamics. It's **not** a single, neatly packaged term in mainstream discourse, but it *is* a recognized pattern with established conceptual frameworks. Let's dissect it step-by-step, as requested.

  **Core Phenomenon:** The convergence of imperfectly transmitted cultural variants (stories, recipes, jokes) towards a stable, optimized "attractor form" through repeated social transmission, driven by cognitive biases and structural affordances, rather than faithful recall or external selection pressure. The "bowl" analogy is excellent.

  **Brainstorming Candidate Concepts:**

  1.  **Cultural Attractor (Anthropology/Cognitive Science):** Derived from dynamical systems theory. An "attractor" is a stable state towards which a system tends to evolve. A *cultural attractor* is a specific form or pattern that cultural variants (ideas, practices) gravitate towards due to cognitive biases (e.g., preference for symmetry, narrative coherence, moral clarity) or constraints of transmission (e.g., working memory limits). The attractor *pulls* variants towards it.
  2.  **Cognitive Optimum (Cognitive Psychology):** The idea that transmitted information mutates towards forms that are easiest for the human cognitive system to process, store, and retrieve – maximizing memorability, processability, or emotional/social resonance ("tidier, symmetrical, morally pointed, quotable"). This is *why* attractors exist.
  3.  **Morphic Coherence / Structural Resonance (Coined Concepts):** Emphasizes the inherent structure ("morphic" = form) of the idea itself acting as a template. Variants "resonate" with this underlying structure; deviations that break coherence are harder to transmit or reconstruct accurately, pulling back towards the resonant form ("load-bearing beats").
  4.  **Reconstructive Selection (Cultural Evolution Theory):** Combines two key aspects: **a)** *Reconstruction*: Each transmission isn't a copy, but a *reconstruction* based on schema and gist. **b)** *Implicit Selection*: During reconstruction, details inconsistent with cognitive optima or the perceived core schema are filtered out or reshaped *before* transmission, rather than variants being selected *after* transmission.

  **Analysis & Selection:**

  *   **Cultural Attractor:** This is the **established framework** that best captures the *mechanism* of convergence. It directly addresses the "bowl" metaphor – variants are perturbed (errors introduced) but pulled back towards the stable state (attractor) by cognitive/social forces. The work of Dan Sperber, Nicolas Claidière, and Pascal Boyer formalizes this. **It fits because:** It explicitly models the *directionality* of change (towards the attractor), accounts for why *different* starting points converge, and separates the *process* (attraction) from the *stable form* (the attractor state/variant).
  *   **Cognitive Optimum:** This is the primary *driver* of the attractor. It explains *why* the attractor form exists and what properties it has (tidy, symmetrical, morally pointed, quotable). It's not the phenomenon itself, but the underlying cause.
  *   **Morphic Coherence / Structural Resonance:** This usefully emphasizes the role of the *idea's inherent structure* ("load-bearing beats") in defining the attractor. However, "cultural attractor" already subsumes this (the attractor basin's shape is defined by both the idea's structure *and* cognitive biases). Coining a new term adds less value here.
  *   **Reconstructive Selection:** This accurately describes the *micro-mechanism* at each transmission step – the *reconstruction* based on gist and schema inherently *selects for* the attractor-compatible details. It bridges the cognitive process (reconstruction) with the population-level outcome (convergence). It's highly compatible with the attractor model.

  **The Best Fit: Cultural Attractor Theory**

  *   **The Phenomenon:** **Attractor-Driven Convergence** or **Attractor-Stabilized Transmission**.
  *   **The Property:** **Attractor Strength** or **Morphic Stability** (the depth/shape of the "bowl").
  *   **The Converged Form:** The **Attractor Variant** or **Cognitive Optimum Form**.

  **Precise Definition & Edges:**

  1.  **Content vs. Mind:** The convergence arises from the **interaction**. The *attractor* exists in the space defined by:
      *   **Content Structure:** The inherent logic, causal chains, emotional peaks, or functional requirements ("load-bearing beats"). Deviations that break this core structure are unstable.
      *   **Cognitive Biases:** Universal human preferences (symmetry, closure, minimal cognitive effort, schema fit, emotional salience, social/moral relevance).
      *   **Cultural Context:** Shared schemas, expectations, and values within the transmitting group (e.g., what "grandma's recipe" *means*, the moral of the urban legend).
      *   *The attractor is neither purely in the idea nor purely in the mind; it's an emergent property of their fit within a specific cognitive and cultural landscape.*

  2.  **Population vs. Single Chain:**
      *   **Requires a Population (Network):** Crucially, this phenomenon manifests robustly in *populations* with *multiple transmission chains and cross-talk*. While an individual might reconstruct a story towards their *personal* optimum each time, the strong convergence you observe ("everyone corrects you instantly") relies on a *shared* cultural attractor reinforced by social feedback and comparison across the network. A single chain of tellers (like the telephone game) *can* exhibit drift towards *a* stable form due to individual cognitive biases, but it's less likely to converge as powerfully or consistently on a *shared* attractor without the population-level reinforcement and selection of variants. The corrections ("it's a hotel, not a car park!") are evidence of the shared attractor norm enforced socially.

  3.  **Random Errors vs. Deliberate Distortion:**
      *   **Random Errors are the Fuel:** The process *relies* on the constant introduction of variation (random errors in recall, omissions, elaborations). These variations probe the "edges" of the attractor basin.
      *   **Deliberate Distortion:** This is fascinating and complex:
          *   *If aligned with the attractor:* Deliberate changes that *enhance* symmetry, moral point, or quotability might be *adopted* and actually *strengthen* the convergence on the attractor form (e.g., refining a punchline).
          *   *If orthogonal:* Deliberate changes adding irrelevant details might simply fade away in subsequent transmissions if they don't resonate or add value.
          *   *If actively hostile:* Deliberate changes *aiming* to destroy the core structure *can* push the variant out of the attractor basin. However, if the attractor is strong and the population large, such hostile variants often fail to propagate widely because they violate the cognitive optimum and core schema, making them harder to remember/transmit accurately *or* they get corrected ("That's not how it goes!"). **Conclusion:** Deliberate distortion *can* work *if* it reinforces the attractor. Deliberate attempts to *change* the core attractor form face significant resistance from the convergence mechanism itself, especially in a population. Random error is the primary driver, but deliberate change isn't inherently excluded; its effect depends on alignment with the attractor.

  4.  **Same Phenomenon in Other Media:**
      *   **Tune:** A folk melody evolves as different musicians play it. Notes might change, ornamentation varies, but the core melodic contour, harmonic progression, and rhythmic feel converge on a stable, memorable, "catchy" form that feels "right." Wrong notes jar because they break this implicit attractor.
      *   **Slogan:** A political or advertising slogan gets misquoted ("Luke, I am your father"). The misquotes that persist often enhance rhythm, alliteration, or dramatic emphasis ("No, I *am* your father!" feels stronger than the original "No, *I* am your father"), converging on a more cognitively optimal, impactful form.
      *   **Rumour:** Details change (names, locations, exact amounts), but the core shocking/salacious/implausible-but-just-credible-enough element remains stable, converging on the version that maximizes emotional impact and transmission potential.
      *   **Scientific Result:** A complex finding gets simplified as it enters popular consciousness. Nuance is lost, caveats disappear, and it converges on a "half-remembered" core principle or vivid metaphor that is easy to grasp and retell, even if less accurate (e.g., "survival of the fittest" as the entire essence of evolution). This is the cognitive optimum form acting as an attractor, often diverging from the scientific precision but thriving in the cultural ecosystem.

  **How it Differs from Common Concepts:**

  *   **Memes (Dawkinsian):** Focuses on high-fidelity replication and competition between discrete variants. Your phenomenon is about *low-fidelity transmission* combined with *convergent reconstruction*, where *variation is the input* and *stability is the output* via attraction, not competition. Dawkins' memes are billiard balls; your phenomenon is the bowl.
  *   **Natural Selection of Ideas:** Implies variants are generated, then differentially *survive* or *spread* based on fitness. Your phenomenon involves variants being actively *reshaped during transmission* towards a fitter form *before* spread, driven by cognitive constraints, not just external selection. It's Lamarckian adaptation *during* inheritance.
  *   **Telephone-Game Degradation:** Emphasizes inevitable *loss* and *distortion* over a chain. Your phenomenon shows that while surface details *do* degrade/distort, the core structure doesn't just degrade randomly; it actively *converges* and *stabilizes* on an optimized form due to attraction. Degradation is the means, not the end result; stability is the outcome.
  *   **"Memorable Things Survive":** This is true but superficial. It doesn't explain *how* the memorable form emerges *from* the variation, *why* that specific form is memorable (cognitive optimum), or the *mechanism* of convergence (attractor dynamics). It's the *outcome*, not the *process*.

  **Conclusion:**

  The established framework is **Cultural Attractor Theory**. The property enabling convergence is **Attractor Strength**, shaped by the **Cognitive Optimum** for the idea within its context and the **Structural Coherence** of its "load-bearing beats." The stable form is the **Attractor Variant**.

  It's not degradation; it's *optimization under constraints*. The "bowl" is sculpted jointly by the inherent structure of the idea and the universal & culturally specific biases of the human minds receiving and retelling it. The constant "knocks" (errors) are essential; they allow the system to explore the space and consistently find the deepest, most stable point in the bowl – the form that resonates most powerfully with both the story's logic and our cognitive architecture. Your family recipe, the urban legend, and your dad's joke aren't decaying; they're being relentlessly polished by the friction of imperfect human memory and social exchange until they gleam with cognitive and cultural fitness. As a novelist stealing these gems, you're tapping directly into this profound engine of cultural coherence.
