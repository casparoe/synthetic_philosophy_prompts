prompt: |-
  I cover science and ideas for a magazine, and I keep running into Gödel in places Gödel has no business being. Last month at an AI-safety workshop a guy said flat out that Gödel proved no system can prove its own consistency, and used that to declare "provably safe self-modifying AI" a non-starter. Then at a philosophy night someone trotted out the same theorm to say a human mind can't be a machine, because a machine is just a formal system and we can supposedly see the truth of its Gödel sentence. And an econ blogger I follow uses it to argue a central planner can never model the whole economy including the planner's own model. I have a strong feeling these three people are not making the same claim, and that at least one of them is dressing up something trivial or false as a deep theorem.

  So what I want is a menu. Take the sentence "Gödel's incompleteness theorems show that..." and spell out the different precise claims it could be standing for — the actual formal results, the innocent-but-boring readings, the overreaches — and then for each one say whether it's true, trivial, or bunk, and which of my three characters was really leaning on it. I don't need the theorems re-explained from scratch, I need the disambiguation and the verdicts. Where a reading would actually get its user to their conclusion, say so; where they've smuggled in an extra premise to get there, name the premise. I'd also like to know which of the readings is the one people most often *think* they mean, versus the one they'd have to mean for the argument they're actually making.

  Lead with your bottom line in the first sentence, then the reasoning. No preamble, no throat-clearing, and don't restate what I asked.
reasoning: |-
  Alright, let me tackle this query step by step. The user is a science writer encountering Gödel's theorems being misapplied in three different contexts: AI safety, philosophy of mind, and economic planning. They want a clear breakdown of what the theorems actually say versus how they're being misused.

  First, I need to recall the core of Gödel's first incompleteness theorem. It states that any consistent formal system capable of arithmetic will have true statements unprovable within the system. The second theorem adds that such a system cannot prove its own consistency. These are specific technical results with precise conditions.

  Now, looking at the three cases:

  The AI safety guy claims no system can prove its own consistency, implying provably safe self-modifying AI is impossible. This directly references the second theorem, but overreaches. The theorem assumes the system is consistent and can prove all its axioms—conditions AI might not meet. Plus, safety isn't the same as consistency. So his argument requires hidden premises about AI systems meeting Gödel's criteria and conflates consistency with safety.

  The philosopher argues human minds can't be machines because machines can't "see" their Gödel sentences while humans can. But Gödel's theorems say nothing about human cognition. The leap here assumes formal systems fully model minds and that humans reliably "see" truth—both unproven. This misapplies the theorem by ignoring that humans might also be subject to incompleteness or that formal systems could model partial understanding.

  The econ blogger claims central planners can't model economies including their own models due to Gödel's theorems. This misreads the theorems as limiting self-reference in modeling. But Gödel is about proof within systems, not modeling per se. Economic models don't necessarily require proving their own consistency, and self-referential modeling isn't prohibited—just constrained. The blogger likely confuses incompleteness with general limits on self-reference.

  For the menu, I'll structure each possible interpretation of "Gödel's theorems show that..." starting with the actual formal results, then common overreaches. Each entry will note if it's true/trivial/bunk, which case it applies to, and any hidden premises. For example:

  - Actual result: Systems meeting criteria can't prove their own consistency (true, used by AI guy but overreached).
  - Misinterpretation: Systems can't verify their own properties (bunk, AI guy's hidden premise conflating consistency with safety).
  - Human cognition claim: Minds can't be formal systems because they "see" Gödel sentences (bunk, philosopher's argument with hidden premises about human access to truth).

  I'll also highlight the gap between what people think they mean (deep limits on knowledge/systems) versus what they'd need for their arguments (unjustified extensions of the theorems). The key is showing where each argument sneaks in extra assumptions or misapplies the scope.
answer: |-
  **Gödel's theorems are consistently misapplied by extending them beyond their formal scope or smuggling in unjustified premises.** Here's the disambiguation menu for "Gödel's incompleteness theorems show that...", with verdicts and applications to your cases:

  1.  **"... any consistent formal system capable of elementary arithmetic cannot prove all true statements about natural numbers."**
      *   **What it is:** The core of the First Incompleteness Theorem (G1).
      *   **Verdict:** **True** (the actual formal result).
      *   **Used by:** Philosopher (implicitly), Econ Blogger (implicitly).
      *   **Gets them to conclusion?** No. This is the starting point, but their arguments require significant leaps beyond this.

  2.  **"... any consistent formal system capable of elementary arithmetic cannot prove its own consistency."**
      *   **What it is:** The core of the Second Incompleteness Theorem (G2).
      *   **Verdict:** **True** (the actual formal result).
      *   **Used by:** AI Safety Guy (explicitly).
      *   **Gets them to conclusion?** Directly motivates his claim, but he **overreaches** G2's scope. G2 requires the system to be *sufficiently strong* (capable of proving basic facts about arithmetic) and *consistent*. His conclusion assumes the AI system *is* such a formal system and that "provably safe" requires "proving *its own* consistency *within itself*".

  3.  **"... no formal system can verify *any* non-trivial property of itself (like safety, correctness, completeness)."**
      *   **What it is:** A vast overgeneralization of G2.
      *   **Verdict:** **Bunk**. G2 *only* addresses *consistency*. Systems *can* prove properties like soundness relative to an external semantics or safety properties under specific definitions. **Smuggled Premise:** That "safety" (a complex, externally defined concept) is equivalent to "logical consistency" (G2's specific target).
      *   **Used by:** AI Safety Guy (implicitly).
      *   **Gets them to conclusion?** Yes, but only because of the smuggled premise. He leans on this overgeneralized reading. **What people think they mean:** A deep limit on self-knowledge. **What they'd need:** This false equivalence.

  4.  **"... a formal system (machine) cannot 'know' or 'see the truth' of its own Gödel sentence, but a human mind can."**
      *   **What it is:** A philosophical interpretation/extrapolation from G1.
      *   **Verdict:** **Highly contentious bunk** when used to argue minds aren't machines. It assumes humans *reliably* "see" the truth of the Gödel sentence (unproven, potentially false if minds are inconsistent/limited). It assumes "machine" equals "fixed formal system humans can completely specify". **Smuggled Premises:** 1) Humans have infallible access to mathematical truth; 2) Minds are fundamentally non-algorithmic; 3) Machines are limited to being consistent formal systems humans can describe.
      *   **Used by:** Philosopher (explicitly).
      *   **Gets them to conclusion?** Yes, but only via smuggled premises. They lean *entirely* on this reading. **What people think they mean:** Gödel shows minds transcend machines. **What they'd need:** The smuggled premises, especially Premise 1.

  5.  **"... a system (like an economy or a mind) cannot contain a complete, consistent model of itself."**
      *   **What it is:** A loose analogy/metaphor inspired by self-reference aspects.
      *   **Verdict:** **Trivial if vague, often bunk when presented as a direct corollary.** Gödel *doesn't* prohibit self-modeling; it prohibits a *specific kind of proof* (of consistency) *within* a specific *formal system*. Complex systems can contain partial, approximate, or inconsistent self-models. **Smuggled Premise:** That "modeling" requires the same kind of complete, consistent, internal *proof-theoretic* closure that G2 prohibits.
      *   **Used by:** Econ Blogger (explicitly), Philosopher (related).
      *   **Gets them to conclusion?** For the Econ Blogger: Yes, but only by misinterpreting Gödel as a general limit on self-reference/modeling complexity rather than a specific limit on proof. They lean heavily on this metaphorical reading. **What people think they mean:** Gödel proves self-understanding is impossible. **What they'd need:** The smuggled premise equating modeling with provability within a single formal system.

  6.  **"... formal systems are inherently limited in what they can prove/know."**
      *   **What it is:** An accurate but very broad summary of the *spirit* of the theorems.
      *   **Verdict:** **True, but trivial** in this vague form. It doesn't specify the *nature* or *scope* of the limitations.
      *   **Used by:** All three (as the intuitive foundation).
      *   **Gets them to conclusion?** No. This vague notion motivates them, but their specific claims require the more precise (and often flawed) interpretations above.

  **Verdicts on Your Characters:**

  1.  **AI Safety Guy:** Overreaches **G2**. He states G2 correctly but **smuggles in premises** that "safety" = "proving self-consistency internally" and that an AI *must* be such a formal system. His conclusion doesn't strictly follow because safety is different from consistency, and proof might be external or use different formalisms.
  2.  **Philosopher:** Relies on **Bunk Reading 4**. They **smuggle in premises** about human infallibility and the nature of machines. Gödel says nothing about minds; the argument depends entirely on unproven philosophical assumptions.
  3.  **Econ Blogger:** Uses **Bunk Reading 5**. They **smuggle in the premise** that economic modeling requires impossible Gödelian self-proof. Gödel doesn't prohibit self-modeling; it prohibits a specific *type* of proof *within* a specific *type* of system. Economic modeling isn't constrained this way.
