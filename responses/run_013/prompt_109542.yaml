prompt: |-
  Hey, so quick background: I'm a software engineer (backend, mostly Go and Python), never took a philosophy class past the one ethics requirement in college, but for the last couple years I've been deep in the decision-theory stuff that comes out of the LessWrong / AI safety corner — causal vs evidential vs updateless, Newcomb, Parfit's hitchhiker, all that. I'm applying for a small independent-research grant (six months, part-time, they fund weird interdisciplinary stuff) and I've got a half-formed idea I need turned into an actual proposal document, about two pages.

  Here's the half-formed idea, and sorry in advance if I mangle the terminology. Updateless decision theory tells you to pick the policy that looks best from a vantage point where you haven't yet "learned" which situation you're in — you choose your decision procedure first, then just execute it. What bugs me is that the whole thing seems to lean on the idea that your decision procedure could have output something else. Not in a physical sense, obviously nobody's talking about a ghost reaching into your skull — but in some logical or mathematical sense, like "the same function, evaluated with a different return value." And I've got a nagging suspicion that this logical-counterfactual move is doing a huge amount of hidden work, and that if you actually try to cash it out — say, by dropping the agent into a causal graph as a node whose value is literally its own source code — you either get a circularity (to score a policy you have to evaluate a computation that includes the scoring itself) or you quietly smuggle in an extra primitive that nobody has spelled out, and then UDT turns out to be either ill-defined or just collapses into something closer to causal or evidential decision theory. I have no idea if that's right. It might be a known objection everyone's bored of, or it might just be confused.

  Can you write the proposal for me? What I need: the question stated precisely enough that it has a determinate answer (not just "explore UDT"), why the usual positions leave it open — I want it to be a real gap and not just me not having read enough — the method, i.e. what I'd actually do month by month given that I'm a coder and not a logician, so lean on things like writing small simulators or toy models and checking whether a given formalization reproduces the intuitive verdicts in the standard cases; then what a positive result would look like, what would count as the project failing, and a honest take on whether six part-time months is enough or whether this is secretly a dissertation. Please don't put in citations or a reading list — I'll add those myself later, so just refer to positions and arguments in plain language. And I'm not attached to my suspicion being correct, so if the honest framing is "the interesting question is actually a bit different from what you said," reframe it that way and explain why.

  At the very end, after the proposal itself, give me a short JSON summary so I can slot it into the application portal. Fields: "one_line_question", "why_open" (2-3 sentences), "method_summary", "milestones" (array of month-labeled strings), "what_success_looks_like", "what_failure_looks_like", "scope_verdict" (one of "fits", "tight", "too_big"), and "reframed" (true/false, whether you changed my question). American English please.
