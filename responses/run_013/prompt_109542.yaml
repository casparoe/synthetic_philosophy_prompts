answer: |-
  ## Research Proposal: Computational Scrutiny of Updateless Decision Theory's Foundational Mechanics  

  **1. Precise Question:**  
  Can Updateless Decision Theory (UDT) be coherently implemented within a fully specified computational model—where the agent is represented as a causal node executing its source code—without introducing unresolvable circular dependencies, unexamined logical counterfactual primitives, or reduction to causal/evidential decision theory under plausible formalizations?  

  **2. Why This Question Remains Open:**  
  Current UDT descriptions rely on intuitions about logical counterfactuals (e.g., "What if *this same agent* output a different action?") without a consensus computational semantics. Proposals often handwave implementation by assuming an oracle for logical uncertainty or treating the agent's source code as "given" without clarifying how it avoids self-referential paradoxes during policy evaluation. Critics suggest this conceals circularity (e.g., scoring a policy requires simulating the agent, which *is* the policy), but no systematic computational audit exists.  

  **3. Methodology (Coder-Centric Approach):**  
  Leverage software engineering to build minimal computational models of classic decision problems, explicitly representing agents as executable code within causal graphs. Test whether UDT’s prescriptions emerge robustly or collapse under formalization.  
  - **Month 1:** Implement baseline simulations for Newcomb’s Problem, Parfit’s Hitchhiker, and Counterfactual Mugging using *causal* (CDT) and *evidential* (EDT) agents as controls.  
  - **Month 2:** Design a computational framework where agents are nodes in causal graphs. Agents receive source code as input; output actions via deterministic functions.  
  - **Month 3:** Attempt UDT implementations:  
    - **Version A:** Precommitment model (agent runs "precomputation" before seeing observations).  
    - **Version B:** Reflexive model (agent’s function evaluates hypothetical self-modifications).  
  - **Month 4:** Stress-test implementations:  
    - Inject self-reference (e.g., agent’s action affects predictor reading its source code).  
    - Measure circularity: Does policy evaluation require infinite regress?  
  - **Month 5:** Benchmark outcomes against canonical UDT verdicts. Does formalization reproduce dominance/optimality? Does it secretly reduce to CDT/EDT in edge cases?  
  - **Month 6:** Synthesize findings: Map conditions where UDT mechanics break, reduce, or require new primitives.  

  **4. What Success Looks Like:**  
  - A concrete computational model where UDT agents reliably "work" (e.g., one-box in Newcomb’s) without hidden circularity or reduction to CDT/EDT.  
  - *Or*—a demonstration that all plausible implementations either:  
    - Require an unsupported logical counterfactual primitive (e.g., a halting oracle),  
    - Reduce to existing decision theories under computation, or  
    - Fail to terminate/decide due to self-reference.  
  Clear taxonomy of *why* UDT resists implementation.  

  **5. What Failure Looks Like:**  
  - Toy models are too simplistic to capture UDT’s intended generality.  
  - All implementations behave identically to CDT/EDT in tested scenarios.  
  - Technical hurdles (e.g., undecidability in self-referential code) halt progress prematurely.  

  **6. Scope Verdict:**  
  **Tight but feasible.** Focused on computational tractability, not axiomatic foundations. Success hinges on constraining problems to small, verifiable simulations. Negative results (e.g., "UDT requires uncomputable primitives") are valuable. Six part-time months suffices for proof-of-concept exploration.  

  **7. Reframing Note:**  
  Reframed: **true**. Your suspicion highlighted a *procedural* gap (how to compute UDT), not just a conceptual one. The core question now targets *implementation mechanics*—exposing whether the "logical counterfactual" step is computationally coherent or a placeholder for magic. This is more testable and avoids well-trodden philosophical debates.  

  ---

