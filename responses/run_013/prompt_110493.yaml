prompt: |-
  I chair the ethics consultation service at a mid-sized teaching hospital, and I need to write the standing procedure my on-call ethicists will use. The consult I keep getting is the one where a patient's advance directive and the patient's own current expressed wishes point in opposite directions: a woman who refused dialysis in writing five years ago now asks for it; a man whose directive authorizes comfort care only is now, still articulate, demanding everything; a patient who wrote that she never wanted to be kept alive by machines is being kept alive by a machine and, on a good day, says thank you. We get two or three of these a month. The decisions are irreversible, the family is in the room, and the on-call ethicist is usually a rotating clinician with a weekend course in clinical ethics and forty-five minutes before the next admission.

  I don't want the standard checklist. Capacity, benefits, burdens, substituted judgment, best interest — we all know it, and it goes silent at exactly the point where these cases are hard. What I want is a procedure that takes a position on the question underneath, and then makes that position runnable by someone who has never read a word of the philosophical literature. The question is what, if anything, makes a past decision authoritative over the person who is here now. The candidate answers I want you to work with: the earlier self bound the later one deliberately, and that binding is to be honored; the document is not a command but the best evidence we have of what this person values, and evidence can be outweighed; the person is the author of a life, and a directive is part of that authorship, so honoring it is respecting the author rather than the present occupant; authority belongs entirely to whoever is speaking now, and the document is at most a hint. There is also a distinction that has to survive the translation, whatever else you drop: between the ends that gave this patient's life its shape and the patient's moment-to-moment comfort. And there is a possibility the procedure must be able to name: that a present wish is not a considered judgment but a symptom, or a response to being asked, or a wish to please the person asking.

  Deliver the procedure as ordered questions, with what counts as a sufficient answer to each, what happens when the answer is missing or contested, where the procedure stops with a no, and where it stops by handing the decision to a person — with a note on which of those handoffs are genuine value disagreements and which are just places I was too lazy to write a rule. Include the bedside tests an on-call ethicist can actually run: what to ask the patient, what to ask the family, what to ask the attending, in what order.

  Then run it on three cases: the dialysis patient who changed her mind, with capacity intact; a patient with moderate dementia whose directive is silent on the treatment now proposed, where the family's account of what she would have wanted contradicts the team's judgment; and one case where the procedure requires the ethicist to override a present, clearly expressed wish. Say plainly which of the three the procedure handles well and which it only appears to handle.

  Finally: tell me what this procedure cannot do. Which cases it will resolve wrongly and confidently, and which questions in it are judgment calls wearing the costume of a rule. The output has to be defensible in a chart note and has to survive the ethics committee and our counsel, who will read it as though it were a policy.
reasoning: |-
  We are designing a standing procedure for on-call ethicists to handle cases where a patient's advance directive and current expressed wishes conflict. The procedure must take a position on the underlying philosophical question: what makes a past decision authoritative over the present person? We are given candidate answers and must design a process that is operational, especially for clinicians with minimal ethics training.

  Key elements from the request:
  - The procedure must be in ordered questions.
  - Specify what counts as a sufficient answer, what to do if the answer is missing or contested, where the procedure stops with a "no", and where it hands off the decision.
  - Note which handoffs are genuine value disagreements and which are due to lack of a rule.
  - Include practical bedside tests: questions to the patient, family, attending, and in what order.
  - The procedure must respect the distinction between the patient's life-shaping ends and moment-to-moment comfort.
  - It must be able to name the possibility that a present wish is not a considered judgment (e.g., symptom, response to being asked, wish to please).

  Our chosen position (synthesized from the candidate answers):
  We take the position that the advance directive is the best evidence we have of the patient's deeply held values and life-shaping ends, and it should be given significant weight. However, it is not an absolute command. The current expressed wishes of a patient with capacity must also be respected, but we must critically examine whether the current wish is a true reflection of the patient's enduring values or a transient response. The procedure will prioritize the patient's life-shaping ends (as expressed in the directive) over momentary comfort, unless there is clear evidence that the patient's values have fundamentally changed in a way that is consistent and considered.

  Procedure Design:

  We break the procedure into steps. Each step is a question. We must specify:
  - The question.
  - What counts as a sufficient answer.
  - What if the answer is missing or contested.
  - Where the procedure stops (with a "no" or a handoff).

  We also include the practical bedside tests (questions to ask) at each relevant step.

  Step 0: Triage - Is this an emergency requiring immediate action?
  - If yes, proceed to stabilize the patient and then continue the ethics consult when stable.
  - If no, proceed to Step 1.

  Step 1: Determine if the patient has decision-making capacity for the current decision.
  - Question: Does the patient have the capacity to make this specific decision at this time?
  - Sufficient answer: 
      - Capacity is present if the patient can: (a) understand the relevant information (including the nature of the treatment, alternatives, risks, benefits); (b) appreciate the situation and its consequences; (c) reason about the options; (d) communicate a choice.
  - Missing/contested: 
      - If capacity is contested, consult psychiatry or neurology for a formal capacity evaluation if time allows. If not, the ethicist must make a best judgment. If unable to determine, default to the advance directive and proceed to Step 2 (because without capacity, we rely on the directive and surrogates).
  - Handoff: If capacity is clearly absent, then the advance directive is the primary guide, and we proceed to Step 2. If capacity is present, proceed to Step 3.

  Step 2: If the patient lacks capacity, follow the advance directive and surrogate decision-making.
  - We are not focusing on this scenario in the hard cases described (since the hard cases involve current expressed wishes). But note: if the patient lacks capacity, we use the directive and the surrogate to make decisions based on substituted judgment (what the patient would have wanted) or best interest. This step is straightforward and not the focus of our procedure.

  Step 3: The patient has capacity, but there is a conflict between the advance directive and current expressed wishes.
  - Question: Is the patient's current expressed wish consistent with their life-shaping ends (as expressed in the advance directive and other evidence of their values)?
  - How to answer:
      - Ask the patient: "Can you help me understand how this decision fits with the values you expressed in your advance directive?" and "What has changed in your thinking since you wrote the directive?"
      - Ask the family and attending: "Can you provide any information about a fundamental change in the patient's values or life goals that would explain this change in wishes?"
  - Sufficient answer: 
      - If the patient provides a reasoned account that reflects a consistent change in values (e.g., due to new experiences, religious conversion, or a reevaluation of life goals) and this account is consistent over time and not impulsive, then the current wish may override the directive.
      - If the patient cannot provide a coherent account, or if the account is inconsistent with the patient's known life-shaping ends, then the directive should prevail.
      - Also, consider: Is the current wish a symptom (e.g., delirium, depression) or a response to temporary distress? If so, it should not override the directive.
  - Missing/contested: 
      - If the patient cannot explain the change, or if the explanation is contested by the family or team, then the ethicist must decide whether the patient's account is credible and consistent. If not, the directive stands.
  - Where it stops: 
      - If the patient's current wish is determined to be inconsistent with their life-shaping ends and not a considered change, then the procedure stops with a "no": the advance directive should be followed, and the current wish is not honored. This is the override case.
      - If the patient's current wish is consistent with a considered change in values, then the procedure stops by handing the decision to the patient (honor current wish).

  Step 4: If the patient's capacity is fluctuating or uncertain, but the current wish is expressed during a lucid interval.
  - We are not explicitly covering fluctuating capacity in the steps above. We can handle it in Step 1: if capacity is present at the time of the decision, then we proceed to Step 3.

  Step 5: What if the advance directive is silent on the specific treatment?
  - This is a different scenario (as in one of the test cases). We add a step for that.

  We must also cover the case where the directive is silent.

  Revised Steps:

  Step 1: Capacity assessment (as above).

  Step 2: If capacity absent: use the advance directive and surrogate.

  Step 3: If capacity present, and there is a conflict between the directive and current wish:
     a. Determine if the directive addresses the specific treatment in question. If not, proceed to Step 4 (silent directive).
     b. If the directive does address the treatment, then ask: "Is the patient's current expressed wish a considered judgment that reflects a fundamental change in the patient's values and life-shaping ends, or is it a response to transient factors?"

     To answer:
        - Ask the patient: "What led you to change your mind from what you wrote in your directive?" and "How does this decision reflect your core values and beliefs?"
        - Ask family and attending: "Have you observed a fundamental and consistent shift in the patient's values that would explain this change?"

     Sufficient answer:
        - Evidence of a fundamental and consistent shift: e.g., the patient has been living in a way that aligns with the new wish for a significant period, or has articulated a clear change in worldview.
        - Evidence of transient factors: the patient is in acute distress, depressed, delirious, or expressing a wish that is out of character and not explained by a change in values.

     Missing/contested: 
        - If the explanation is missing or contested, and the ethicist cannot determine a clear and consistent change in values, then the advance directive prevails.

     Stop conditions:
        - If the current wish is not a considered judgment (transient), then stop: the directive must be followed (override current wish).
        - If the current wish is a considered judgment, then stop: honor the current wish.

  Step 4: If the directive is silent on the treatment, then:
     Question: What would the patient have decided based on their values and life-shaping ends?
     - Use substituted judgment: gather evidence from the directive (if it expresses general values), from the patient (if they can articulate how their values apply to this new treatment), from family and friends, and from the attending.
     - Sufficient answer: A clear consensus from the patient and family about what the patient would have wanted. If the patient has capacity, their current wish is the best evidence, unless there is reason to believe it is transient (then we look to past values).
     - Missing/contested: If there is no clear evidence, then use best interest standard. This may require a handoff to the legal surrogate or the court if the disagreement is intractable.

     Handoff: This step may require a family conference and may be handed off to the surrogate decision-maker (if the patient lacks capacity) or to the patient (if they have capacity). If the patient has capacity and the directive is silent, then the patient's current wish should be followed unless there is evidence of incapacity or impairment.

  Now, let's run the three test cases:

  Case 1: The dialysis patient who changed her mind, with capacity intact.
  - Step 1: Capacity present.
  - Step 3: Directive addresses dialysis (refused). Current wish: wants dialysis.
  - We ask: Is this change a considered judgment reflecting a fundamental change in values?
     - Patient: "I was depressed when I wrote that. Now I have grandchildren and I want to live as long as possible. I've been feeling this way for years."
     - Family: "She has been talking about how much she values life now and has been making future plans."
  - Conclusion: This is a considered change. Honor current wish.

  Case 2: A patient with moderate dementia whose directive is silent on the treatment now proposed. Family's account of what she would have wanted contradicts the team's judgment.
  - Step 1: Patient has moderate dementia. We must assess capacity for this specific decision. Let's assume she lacks capacity for this decision.
  - Step 2: We use the advance directive, but it is silent on the treatment. So we go to Step 4.
  - Step 4: We try to determine what the patient would have wanted (substituted judgment).
     - Gather evidence: family says she would have refused the treatment (e.g., a feeding tube). The team believes she would have wanted it because she was a fighter and always accepted treatments.
     - We ask: What general values are in the directive? What did the patient say in the past? What were her religious or philosophical beliefs?
     - If the family and team disagree and there is no clear evidence, we may have to go to best interests. This is a handoff to the legal surrogate (the family) to decide, unless the surrogate is not acting in good faith. The procedure would hand off to the surrogate with the ethics committee's support for the surrogate's decision, unless there is evidence of bad faith.

  Case 3: Override a present, clearly expressed wish.
  - Example: A patient who wrote in his directive that he never wanted to be on a ventilator, but now (while on the ventilator and having a good day) says "thank you" and indicates he wants to continue. However, we suspect this is not a considered judgment.
  - Step 1: Capacity? The patient is on a ventilator and may have fluctuating capacity. We must assess. Assume we determine that the patient has capacity at the moment (articulate, understanding the situation).
  - Step 3: Directive explicitly refuses the ventilator. Current wish: wants to continue.
  - We ask: Is this a considered judgment? 
     - Patient: "I'm scared to die." But cannot articulate how this fits with his past values (which were about not wanting to live in a dependent state). 
     - Family: "This is not the dad we knew. He always said he didn't want this. He's just scared now and doesn't want to die, but he wouldn't want to live like this for long."
     - We also consider: Is this a transient response to fear? The procedure says: if the current wish is not a considered change and is driven by transient factors, we override.
  - Conclusion: The directive prevails. We stop the ventilator per the directive. This is the override.

  Now, which cases does the procedure handle well?
  - Case 1 (dialysis) is handled well: we honor the current wish because it is a considered change.
  - Case 3 (ventilator) is handled: we override the current wish. However, note that this is a very difficult and potentially controversial decision. The procedure appears to handle it, but it requires the ethicist to make a judgment about the "considered change" which may be challenged.

  Which case does it only appear to handle?
  - Case 2 (dementia, silent directive) is not fully resolved by the procedure. The procedure hands off to the surrogate, which is appropriate, but the underlying conflict between the family and the team is not resolved. The procedure only provides a framework for gathering evidence and then defers to the surrogate. This is a genuine value disagreement about what the patient would have wanted, and the procedure cannot resolve it without clear evidence.

  What the procedure cannot do:
  - It cannot resolve deep value disagreements between surrogates and the medical team when the evidence is ambiguous. In such cases, the procedure will defer to the surrogate (if acting in good faith) or, in rare cases, to the court. This is a limitation.
  - The judgment about whether a current wish is a "considered judgment" or "transient" is inherently subjective. The procedure provides guidance, but it is a judgment call. It may be challenged as being too paternalistic if we override a capacitated patient's wish without clear evidence of impairment.
  - The procedure assumes that the advance directive is a reliable expression of the patient's values. However, if the directive was completed without adequate reflection or under duress, the procedure may give it too much weight.
  - The procedure may not handle cases where the patient's values have evolved gradually but without a dramatic "conversion" event. Such evolution may be harder to document.

  Finally, we write the procedure as ordered questions for the on-call ethicist.

  **STANDING PROCEDURE: ADVANCE DIRECTIVE AND CURRENT WISHES CONFLICT**

  **Step 0: Triage**
  - Is the patient in an acute emergency requiring immediate treatment to prevent death or severe harm?
     - Yes: Provide necessary emergency care. Then proceed when stable.
     - No: Proceed to Step 1.

  **Step 1: Assess Decision-Making Capacity**
  - Question: Does the patient have the capacity to make the specific decision at hand?
  - How to assess:
     - Ask the patient to explain: (a) the medical condition, (b) the proposed treatment, (c) the alternatives, (d) the risks and benefits of each option, (e) the consequences of refusing treatment.
     - Evaluate: Can the patient understand, appreciate, reason, and communicate a choice?
  - Sufficient answer: 
     - Capacity is present if the patient demonstrates understanding and reasoning about the specific decision.
  - Missing/contested:
     - If capacity is uncertain, consult psychiatry/neurology if feasible and time allows. If not, the ethicist must make a best judgment.
     - If capacity is absent, proceed to Step 2.
     - If capacity is present, proceed to Step 3.

  **Step 2: Patient Lacks Capacity**
  - Follow the advance directive and engage the legal surrogate.
  - If the directive addresses the treatment, follow it.
  - If the directive is silent or unclear, proceed to Step 4.

  **Step 3: Capacity Present and Directive Conflicts with Current Wish**
  - Question 3a: Does the advance directive specifically address the treatment in question?
     - If no, proceed to Step 4.
     - If yes, proceed to Question 3b.
  - Question 3b: Is the patient's current expressed wish a considered judgment that reflects a fundamental and consistent change in the patient's values and life-shaping ends, or is it a transient response to the immediate situation?
  - How to assess:
     - Ask the patient: 
          - "Can you tell me about the values that led you to write your advance directive the way you did?"
          - "What has changed in your life or beliefs that led you to change your mind?"
          - "How does your current decision align with your core values and the kind of life you want to live?"
     - Ask family and attending:
          - "Have you observed a fundamental shift in the patient's values that would explain this change? Can you provide examples?"
          - "Is the patient's current wish consistent with how they have been living and making decisions recently?"
          - "Could the patient's current wish be influenced by temporary factors (e.g., pain, fear, depression, delirium, desire to please)?"

  - Sufficient answer:
     - Evidence of a fundamental change: The patient provides a coherent narrative of value change that is consistent with their recent life and decisions. Corroboration by family/team.
     - Evidence of transient factors: The patient's explanation is vague, inconsistent, or driven by acute emotions. Family/team reports the wish is out of character and likely temporary.

  - Missing/contested:
     - If the patient cannot explain the change, or the explanation is contested and the ethicist cannot determine a clear and consistent change, then the advance directive prevails.

  - Stop conditions:
     - If the current wish is determined to be a considered judgment reflecting a fundamental change, then stop: honor the current wish.
     - If the current wish is determined to be transient or not a considered change, then stop: follow the advance directive (override the current wish).

  **Step 4: Directive Silent on Treatment**
  - Question: What would the patient have decided based on their values and life-shaping ends (substituted judgment)?
  - How to assess:
     - Review the advance directive for general values.
     - Ask the patient (if capable) how their values apply to this treatment.
     - Ask family and friends: "What did the patient say about similar situations? What were their values and how would they apply here?"
     - Ask the attending: "What is the medical context and what is typical for patients with similar conditions and values?"
  - Sufficient answer: 
     - A clear and consistent account from the patient (if capable) or from surrogates and other evidence of the patient's values.
  - Missing/contested:
     - If the patient has capacity and the directive is silent, the patient's current wish is followed unless there is evidence of impairment (then revert to Step 3b for the impairment question).
     - If the patient lacks capacity and there is no clear evidence, use the best interest standard. The legal surrogate makes the decision.
     - If there is intractable disagreement among surrogates or between the surrogate and the team, the ethicist may facilitate a family conference. If unresolved, consider ethics committee review or legal consultation.

  **Handoffs and Value Disagreements:**
  - Step 1 (capacity contested): Handoff to psychiatry/neurology is due to lack of expertise (not a value disagreement).
  - Step 2 and Step 4 (surrogate decision-making): Handoff to the surrogate is a legal requirement, but disagreements about what the patient would have wanted are value disagreements that the procedure cannot fully resolve. The procedure provides a framework for gathering evidence, but if evidence is ambiguous, the surrogate decides.
  - Step 3b: The judgment about whether a change is fundamental is a value-laden judgment call. This is a genuine gray area. The procedure requires the ethicist to make a call, which may be challenged.

  **Limitations of the Procedure:**
  - It may override a capacitated patient's current wish if the change is not deemed "fundamental" enough. This is controversial and may be seen as paternalistic.
  - It relies heavily on the advance directive, which might be outdated or completed without proper reflection.
  - It may not capture gradual value changes that are not explicitly articulated.
  - In cases of ambiguous evidence (especially in Step 4), the procedure defers to the surrogate, which may not satisfy the medical team if they disagree.
  - The assessment of "transient factors" is subjective and may be influenced by the ethicist's own biases.

  **Defensibility:** 
  - The procedure is defensible because it prioritizes the patient's life-shaping ends (as expressed in the directive) while allowing for change when it is considered and consistent. It uses a structured approach and documents the reasoning. It aligns with the principle of respect for autonomy in the long term. The override in Step 3b is justified only when the current wish is not autonomous (due to impairment or transient factors). 

  **Final Note for the Ethicist:** 
  - Document thoroughly: the patient's explanation, corroborating or conflicting information from family/team, and the rationale for the decision.
  - If in doubt, consult the ethics committee chair (you) or call a rapid committee consultation if time allows.
answer: |-
  ### Standing Procedure for Advance Directive/Current Wishes Conflicts  
  *For On-Call Ethicists at Mid-Sized Teaching Hospital*  
  **Philosophical Position**: The advance directive is the **best evidence of the patient's life-shaping ends** (core values, beliefs, and goals that defined their identity). It is not an absolute command but carries presumptive weight. The current expressed wish must be critically evaluated: it may override the directive *only* if it reflects a **considered, values-consistent judgment** aligned with the patient's enduring identity. Momentary comfort, fear, or impulse does not override life-shaping ends. Authority resides in the **enduring self**, not the "present occupant" or past document alone.  

  **Key Principles Embedded**:  
  1. **Life-Shaping Ends > Momentary Comfort**: Honor what gave the patient’s life meaning, not just present distress.  
  2. **Directive as Evidence, Not Command**: The directive is a window into the patient’s values; it can be outweighed by new evidence of a *consistent* change in those values.  
  3. **Critical Scrutiny of Present Wishes**: Assume a present wish *may* be a symptom, fear response, or attempt to please—not a true judgment—until proven otherwise.  
  4. **Irreversible Decisions Default to Caution**: When evidence is ambiguous, the directive prevails to avoid irreversible harm to the patient’s lifelong values.  

  ---

  ### Ordered Procedure  
  *Run sequentially. Document answers in the chart. Time estimate: 20-30 minutes.*  

  #### **Step 0: Immediate Safety Check**  
  - **Question**: Is the patient at immediate risk of death/severe harm without intervention?  
  - **Sufficient Answer**:  
    - *Yes*: Stabilize first, then proceed.  
    - *No*: Proceed to Step 1.  
  - **If Missing/Contested**: Assume "yes" only if vital signs/labs indicate acute crisis. Proceed once stable.  

  #### **Step 1: Does the Patient Have Capacity for *This* Decision?**  
  - **Question**: Can the patient:  
    a. Understand the diagnosis, treatment options, risks, and benefits?  
    b. Reason consistently about how options align with their values?  
    c. Appreciate consequences (e.g., "If I refuse dialysis, I will die")?  
    d. Communicate a clear choice?  
  - **Bedside Test**:  
    - *Ask Patient*: "Explain your condition, what the treatment involves, and why you want/don’t want it."  
    - *Ask Attending*: "Are there clinical factors (delirium, depression, med side effects) affecting capacity?"  
    - *Order*: Patient first, then attending.  
  - **Sufficient Answer**:  
    - **Capacity Intact**: All criteria (a-d) met → Proceed to Step 2.  
    - **Capacity Impaired**: Any criterion unmet → Proceed to Step 4.  
  - **If Missing/Contested**:  
    - Request rapid psych consult. If impossible, ethicist judges based on bedside test. Default to *incapacity* if uncertainty persists.  
  - **Stop Here If**: Capacity impaired → Skip to Step 4.  

  #### **Step 2: Is the Current Wish a Considered Judgment or a Transient Response?**  
  - **Question**: Is the patient's expressed wish:  
    a. Consistent with their lifelong values (per directive)?  
    b. Free from duress, acute fear, or impulsivity?  
    c. A product of sustained reflection (not momentary comfort)?  
  - **Bedside Tests**:  
    - *Ask Patient*:  
      - "Your directive says [X]. What changed since then?"  
      - "How does this decision reflect who you are and what matters most to you?"  
      - "If your pain/fear improved, would you still choose this?"  
    - *Ask Family*:  
      - "Before this illness, what did they say about quality of life? Give examples."  
      - "Have they ever reversed major values? (e.g., faith, independence)"  
      - "Do they seem like themselves today?"  
    - *Ask Attending*:  
      - "Could pain, meds, or illness (e.g., delirium) be distorting their choice?"  
    - *Order*: Patient → Family → Attending.  
  - **Sufficient Answer**:  
    - **Considered Judgment**: Patient gives coherent values-based rationale *and* family/attending corroborates consistency. → Override directive.  
    - **Transient Response**: Rationale is vague, values-contradictory, or driven by distress/fear → Directive prevails.  
  - **If Missing/Contested**: Default to *transient response* if any doubt. Proceed to Step 3.  
  - **Stop Here If**: Wish is a considered judgment → Honor current wish.  

  #### **Step 3: Does the Directive Reflect Life-Shaping Ends?**  
  - **Question**:  
    a. Was the directive created during a period of capacity?  
    b. Does it address *this* scenario?  
    c. Was it informed by the patient’s values (e.g., "I value independence over longevity")?  
  - **Bedside Tests**:  
    - *Ask Family*: "Did they discuss the directive when they made it? What values guided it?"  
    - *Review Directive*: Look for value statements (e.g., "I never want machines").  
  - **Sufficient Answer**:  
    - **Yes**: Directive is valid evidence → It prevails unless Step 2 overrode it.  
    - **No** (e.g., directive is vague, outdated, or from incapacity) → Proceed to Step 4.  
  - **If Missing/Contested**: Assume directive is valid unless proven otherwise (e.g., family confirms it was signed under duress).  

  #### **Step 4: Substitute Judgment (For Incapacity or Silent Directive)**  
  - **Question**: What would the patient choose based on their life-shaping ends?  
  - **Bedside Tests**:  
    - *Ask Family*: "What specific things did they say about treatments like this? Give examples."  
    - *Ask Attending*: "What are the medical facts? How does this align with the patient’s values?"  
    - *Order*: Family → Attending.  
  - **Sufficient Answer**:  
    - **Clear Evidence** (e.g., "She always said she’d refuse ventilators") → Follow that.  
    - **Ambiguous/Conflicting** → Use *best interest standard* (avoid suffering, maximize dignity).  
  - **If Missing/Contested**:  
    - Hand off to legal surrogate. If disagreement persists, call ethics committee chair.  
  - **Stop Here If**: Surrogate makes the call.  

  #### **Handoffs Explained**:  
  - **Step 1 (Capacity Uncertainty)**: Handoff to psych consult. *Not a value disagreement—clinical uncertainty*.  
  - **Step 4 (Substitute Judgment)**: Handoff to surrogate. *Genuine value disagreement if family/team conflict*.  
  - **Ambiguous Directive**: Handoff to ethics chair. *Lazy rule—requires nuanced interpretation*.  

  ---  

  ### Case Applications  
  **Case 1: Dialysis Patient (Capacity Intact, Changed Mind)**  
  - **Step 1**: Capacity intact → Proceed.  
  - **Step 2**: Ask patient: "You refused dialysis in your directive. What changed?"  
    - *If she says*: "I was depressed then; now I value time with grandkids," and family corroborates sustained change → **Considered judgment**. Honor current wish.  
  - **Handled Well?** Yes. Procedure surfaces *why* she changed and tests consistency.  

  **Case 2: Moderate Dementia, Directive Silent, Family vs. Team Conflict**  
  - **Step 1**: Incapacity (dementia) → Proceed to Step 4.  
  - **Step 4**: Substitute judgment.  
    - Family: "She’d refuse this treatment; she hated hospitals."  
    - Team: "She was a fighter; she’d want treatment."  
    - Directive silent → No clear evidence.  
  - **Outcome**: Handoff to surrogate (family) with best-interest fallback. If conflict escalates, call ethics chair.  
  - **Handled Well?** **Only appears handled**. Procedure identifies ambiguity but cannot resolve family/team value clashes. Relies on handoff.  

  **Case 3: Override Current Wish (Ventilator Patient, Directive Refused Machines)**  
  - **Step 1**: Capacity intact (articulate on good days) → Proceed.  
  - **Step 2**: Ask patient: "Your directive says no machines. Why continue now?"  
    - *If he says*: "I’m scared," but cannot link to values, and family says, "This isn’t him; he hated dependency" → **Transient response**.  
  - **Step 3**: Directive is valid → **Override current wish**. Stop ventilator.  
  - **Handled Well?** Yes. Procedure overrides by exposing fear (momentary comfort) vs. life-shaping ends (independence).  

  ---  

  ### What This Procedure Cannot Do  
  1. **Resolve Deep Value Disagreements**:  
     - **Fails Confidently**: When family and team clash over "what the patient would want" (Case 2). The procedure defaults to surrogates but cannot arbitrate without clear evidence. Risk: Surgeon insists on surgery; family refuses; ethicist’s "best interest" call may be wrong.  
     - **Why**: Substituted judgment is inherently subjective. The procedure masks this as a rule ("hand to surrogate") but it’s a judgment call.  

  2. **Detect Covert Influences**:  
     - **Fails Confidently**: If a patient’s "considered judgment" is secretly driven by untreated depression or family pressure, the procedure may miss it (e.g., dialysis patient hides ongoing depression).  
     - **Why**: Bedside tests rely on self-report and family honesty. No time for deep probing.  

  3. **Handle Evolving Values Without Documentation**:  
     - **Fails Confidently**: A patient whose values shifted gradually (e.g., spiritual awakening) but never updated their directive. Procedure defaults to the document, overriding current wishes incorrectly.  
     - **Why**: Step 2 requires "coherent rationale," but ethicists may misjudge gradual change as transient.  

  4. **Ethical "Gray Zones" as Rules**:  
     - **Judgment Calls in Disguise**:  
       - Step 2’s "considered vs. transient" distinction: Requires weighing values without objective thresholds.  
       - Step 3’s "life-shaping ends": A philosophical concept forced into a yes/no question.  
     - **Risk**: Overconfident chart notes (e.g., "Wish deemed transient") that invite legal challenge.  

  5. **Survive Ethics Committee/Counsel Scrutiny**:  
     - **Defense**:  
       - Anchored in widely accepted principles (autonomy as enduring self, beneficence as preventing harm to identity).  
       - Explicitly prioritizes patient values over convenience.  
       - Documents due diligence (questions asked, answers given).  
     - **Vulnerabilities**:  
       - Override of capacitated patients (Step 2) may be seen as paternalistic.  
       - Handoffs in Step 4 could appear like passing liability.  
       - **Mitigation**: Stress in chart notes that "transient" does not mean "irrational"—it means *disconnected from the patient’s core identity*.  

  **Final Advisory**: This procedure is a **triage tool**, not a philosopher. It reduces harm in irreversible decisions by favoring caution (life-shaping ends). When in doubt, escalate to ethics chair. Update directives early—conflicts often stem from outdated documents.  

  ---  
  **Chart Note Template**:  
  ```  
  ETHICS CONSULT: AD Directive vs. Current Wishes  
  - Step 1: Capacity [Intact/Impaired]. Evidence: [Summary].  
  - Step 2: Current wish assessed as [Considered Judgment/Transient Response]. Evidence: [Patient Q/A, family input].  
  - Step 3: Directive [Valid/Invalid] evidence of life-shaping ends. Key value: [E.g., independence].  
  - Step 4 (if applicable): Substitute judgment [Clear/Ambiguous]. Surrogate decision: [X].  
  - Outcome: [Follow directive/Honor current wish/Handoff to surrogate]. Rationale: [2-3 sentences].  
  ```
