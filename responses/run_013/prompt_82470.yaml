  4. Two people have the same physical sensation (say, a tingling in the arm). One enjoys it, the other does not. Is the difference between them:
     a) A difference in a separate feeling of pleasure (so the one who enjoys has an extra feeling).
     b) A difference in some non-feeling element (like an attitude or desire) toward the same sensation.

  5. Some people like eating very spicy chili, watching horror films, or listening to sad music. During the experience, they might describe it as painful or unpleasant in some way, yet they like it. This is best described as:
     a) Having a negative feeling (pain) and a positive feeling (pleasure) at the same time.
     b) Having a feeling that is negative in one way (e.g., burning) but positive in another (e.g., exciting) without being two separate feelings.
     c) Having a negative feeling that they desire to have (so the pleasure is in the desiring or the overall activity).

  6. Consider a creature that is very simple (like a worm) and that we cannot imagine experiencing anything from the inside. If such a creature avoids injuries and seeks food, should we say that it:
     a) Experiences pleasure and pain.
     b) Does not experience pleasure and pain because it lacks the necessary consciousness.

  7. The pleasure you feel when a friend shares good news feels different from the pleasure of a hot bath. Is this difference due to:
     a) The pleasure itself being different.
     b) The object of the pleasure (the friend's success) being different, while the pleasure is the same feeling.

  8. Someone takes pleasure in a rival's humiliation. Is this pleasure:
     a) A feeling that is distinctively different from other pleasures (like the warmth of a bath).
     b) The same kind of feeling as other pleasures, but directed at a different object.

  9. When we have different pleasures (bath, relief, puzzle, friend's news), do they share:
     a) A common feeling that is the same in each case.
     b) A common attitude (like liking) toward different experiences.
     c) A common functional role (like causing desire for continuation).
     d) Nothing in common at all.

  10. If pleasures turn out to have nothing in common (no single shared property), what should we conclude about hedonism (the view that well-being is just happiness, understood as pleasure and the absence of pain)?
      a) Hedonism is false and should be abandoned.
      b) Hedonism can be reformulated to be about a disjunction of states (so well-being is having any of these states, even if they are diverse).
      c) This is impossible because if they are all pleasures they must have something in common.

  11. Is the hedonic tone of an experience (its pleasantness):
      a) A single, specific quality (like a particular shade of red).
      b) A determinable that can take many different forms (like color in general, which can be red, blue, etc.).

  12. Consider a person who is deeply depressed and reports that they feel no pleasure in anything, yet they continue to seek out activities that they used to enjoy (like eating their favorite food). In such a case:
      a) The person is experiencing pleasure without realizing it.
      b) The person is not experiencing pleasure but acting out of habit.
      c) The person is experiencing a very minimal kind of pleasure that they don't notice.

  **Scoring Key**

  We will map answer patterns to positions. Each position has a characteristic pattern. Some patterns may match more than one position, and we will note that.

  Position | Expected Answers
  ---------|-----------------
  **1. Simple-feeling view** | 1b, 2a, 3a, 4a, 5a, 6a, 7b, 8b, 9a, 10c, 11a, 12a
  **2. Attitudinal view** | 1b, 2a, 3a, 4b, 5c, 6b, 7b, 8b, 9b, 10c, 11a, 12b
  **4. Desire-or-liking view** | 1b, 2b, 3a, 4b, 5c, 6a, 7b, 8b, 9b, 10c, 11a, 12b
  **5. Representationalist view** | 1b, 2a, 3a, 4b, 5b or c, 6b, 7b, 8b, 9b, 10c, 11a or b, 12b - Note: This is not perfectly captured. They might choose 5b or 5c, and 9b.
  **6. Functional-role view** | 1b, 2a, 3a, 4b, 5c, 6a, 7b, 8b, 9c, 10c, 11b, 12a
  **7. Determinable-tone view** | 1a, 2a, 3a, 4a, 5b, 6a, 7a, 8a, 9a, 10c, 11b, 12a
  **8. Family-resemblance view** | 1a, 2a, 3a, 4b, 5b, 6a, 7a, 8a, 9d, 10b, 11b, 12b
  **9. Exit view** | 9d, 10a, and typically 1a, 7a, 8a, but other answers can vary.

  How to score:
  - First, look at Q9 and Q10.
    - If Q9 is 'd' and Q10 is 'a', then assign to **Exit view**.
    - If Q9 is 'd' and Q10 is 'b', then assign to **Family-resemblance view**.
    - If Q9 is 'a' and Q10 is 'c', then it could be **Simple-feeling** or **Determinable-tone**. Then look at Q1 and Q11: 
        - If Q1 is 'b' and Q11 is 'a', then **Simple-feeling**.
        - If Q1 is 'a' and Q11 is 'b', then **Determinable-tone**.
    - If Q9 is 'b' and Q10 is 'c', then it could be **Attitudinal**, **Desire-or-liking**, or **Representationalist**. Then look at Q2 and Q5:
        - If Q2 is 'a' and Q5 is 'c', then **Attitudinal**.
        - If Q2 is 'b' and Q5 is 'c', then **Desire-or-liking**.
        - If Q5 is 'b', then **Representationalist** (but not perfectly).
    - If Q9 is 'c' and Q10 is 'c', then **Functional-role view**.
  - Also, for the **Determinable-tone view**, if Q9 is 'a' and Q10 is 'c' and Q1 is 'a' and Q11 is 'b', that's a match.

  Note that the Representationalist view is not well separated from the Attitudinal view by this quiz because both might choose similar answers. We flag that the quiz cannot cleanly separate **Attitudinal view** and **Representationalist view** because both would give similar answers (both are non-feeling attitude-like views).

  Also, the **Desire-or-liking view** is separated from the **Attitudinal view** by Q2 (Desire view says b, Attitudinal says a).

  But the **Representationalist view** might also say Q2=a, so it is grouped with Attitudinal.

  We also flag that the **Exit view** might overlap with the Family-resemblance view on many answers, but they are separated by Q10: Exit view says a, Family-resemblance says b.

  **Incoherent or Unattractive Patterns**:
  - If someone says Q9=d and Q10=c, that is incoherent because if they have nothing in common, then it's not possible that they must have something in common.
  - If someone says Q9=a and Q10=a, that is coherent but unattractive: they think there is a common feeling but still think hedonism should be abandoned? That might be because of other reasons, but not due to heterogeneity.
  - If someone says Q9=b and Q10=a, that might be unexplored: they think there is a common attitude but still want to abandon hedonism? That is possible if they think hedonism is not about attitude.

  **One-Page Key for the Instructor**

  **Positions and Their Answer Patterns**:

  1. **Simple-feeling view**: Pleasures share a common feeling quality.  
     - Pattern: 1b, 2a, 3a, 4a, 5a, 6a, 7b, 8b, 9a, 10c, 11a, 12a  
     - Awkward case: Liking aversive experiences (Q5) - it's hard to explain how they have both a negative and a positive feeling at the same time.

  2. **Attitudinal view**: Pleasure is a common attitude of liking or being pleased about something.  
     - Pattern: 1b, 2a, 3a, 4b, 5c, 6b, 7b, 8b, 9b, 10c, 11a, 12b  
     - Awkward case: Unnoticed pleasure (Q2) - if the attitude requires attention, then unnoticed states cannot be pleasant.

  3. **Desire-or-liking view**: Pleasure is a desire for the experience to continue or a liking that is occurrent.  
     - Pattern: 1b, 2b, 3a, 4b, 5c, 6a, 7b, 8b, 9b, 10c, 11a, 12b  
     - Awkward case: The depressed person (Q12) - they desire the activity but report no pleasure, which challenges the identification of pleasure with desire.

  4. **Representationalist view**: Pleasure represents its object as good.  
     - Pattern: Similar to attitudinal: 1b, 2a, 3a, 4b, 5b or c, 6b, 7b, 8b, 9b, 10c, 11a or b, 12b  
     - Awkward case: The same sensation with different enjoyment (Q4) - if the sensation is the same, how does one represent it as good and the other not?  
     - Note: The quiz does not cleanly separate this from attitudinal view.

  5. **Functional-role view**: Pleasure is defined by its causal role (e.g., causing desire to continue).  
     - Pattern: 1b, 2a, 3a, 4b, 5c, 6a, 7b, 8b, 9c, 10c, 11b, 12a  
     - Awkward case: The depressed person (Q12) - the functional role might be present (seeking) but the person denies any pleasure.

  6. **Determinable-tone view**: Pleasantness is a determinable property with many determinate ways of feeling.  
     - Pattern: 1a, 2a, 3a, 4a, 5b, 6a, 7a, 8a, 9a, 10c, 11b, 12a  
     - Awkward case: Pleasure in a rival's humiliation (Q8) - if it's a different determinate, then what makes it a pleasure? The common determinable might seem too thin.

  7. **Family-resemblance view**: Pleasures share a family resemblance, not a common property.  
     - Pattern: 1a, 2a, 3a, 4b, 5b, 6a, 7a, 8a, 9d, 10b, 11b, 12b  
     - Awkward case: The simple creature (Q6) - it's unclear what similarities the creature's states share with human pleasures.

  8. **Exit view**: Heterogeneity refutes hedonism.  
     - Pattern: 9d, 10a (and typically 1a, 7a, 8a)  
     - Awkward case: The same sensation with different enjoyment (Q4) - if there is no common property, what makes one count as pleasure and the other not?  
     - Note: The pattern for other questions can vary, but they must have 9d and 10a.

  **Flags**:
  - The quiz cannot cleanly separate the **Attitudinal view** and the **Representationalist view** because both give very similar answers (both have 9b and 10c and many others). The difference might be in Q5 (representationalist might choose b, attitudinal c) and Q11 (representationalist might be flexible), but it's not reliable.
  - Incoherent patterns: 
     - Q9=d and Q10=c: Incoherent (if nothing in common, then it can't be that they must have something in common).
     - Q9=a and Q10=a: Unexplored or unattractive (common feeling exists, but hedonism should be abandoned? That might be for reasons other than heterogeneity).
     - Q9=b and Q10=a: Unexplored (common attitude exists, but hedonism should be abandoned).
     - Q9=c and Q10=a: Unexplored (common functional role exists, but hedonism should be abandoned).

  Note: The **Desire-or-liking view** is separated from the **Attitudinal view** by Q2 (desire view says b, attitudinal says a).

  This instrument should help sort the group members by their intuitive responses to the cases.
answer: |-
  ### Sorting Instrument: Hedonism Heterogeneity Problem  
  **Goal:** Sort group members by their intuitive responses to cases, avoiding theory labels.  

  ---

  #### **Decision Tree Over Logical Space of Responses**  
  *(Branch nodes derived from divisive questions; leaves = positions)*  
  1. **Do all pleasures share a single, specific felt quality?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Is this quality uniform across all pleasures?**  
     - **Yes, it’s a single simple feeling** → **Simple-feeling view** (Leaf 1).  
     - **No, it’s a determinable with many determinates** → **Determinable-tone view** (Leaf 7).  

  3. **Is pleasure defined by the subject’s attitude or desire?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **Does this attitude require conscious acknowledgment?**  
     - **Yes** → **Desire-or-liking view** (Leaf 4).  
     - **No** → **Attitudinal view** (Leaf 2).  

  5. **Is pleasure defined by its causal-functional role or its representational content?**  
     - **Causal-functional role** (e.g., causing desire to continue) → **Functional-role view** (Leaf 6).  
     - **Representational content** (e.g., presenting an object as good) → **Representationalist view** (Leaf 5).  

  6. **If pleasures lack unity, what follows for hedonism?**  
     - **Hedonism is refuted** → **Exit view** (Leaf 9).  
     - **Hedonism can be reformulated** → Go to 7.  

  7. **How should hedonism handle heterogeneity?**  
     - **As a disjunction of distinct states** → **Family-resemblance view** (Leaf 8).  
     - **Pleasure isn’t an experience at all** → **Not-an-experience view** (Leaf 3).  

  ---

  #### **Quiz: 12 Case-Based Questions**  
  **Instructions:** Answer based on intuition—no theory names or labels. Choose one option per question.  

  1. **Relief Case**: When a headache lifts, the pleasure of relief feels different from the pleasure of a hot bath. This difference is due to:  
     (a) A difference in the pleasure itself.  
     (b) A difference in the non-pleasure aspects (e.g., the context), with the pleasure feeling being the same.  

  2. **Unnoticed Pleasure**: A person engrossed in work doesn’t notice the pleasant warmth of sunlight until later. During the unnoticed period:  
     (a) The warmth was pleasant.  
     (b) The warmth was not pleasant until they noticed it.  

  3. **Bodiless Pleasure**: Can a pleasure (e.g., solving a puzzle) have no felt location in the body?  
     (a) Yes.  
     (b) No—all pleasures must have a bodily location.  

  4. **Same Sensation**: Two people have identical tingling sensations. One enjoys it; the other does not. The difference is:  
     (a) The enjoyer has an extra feeling of pleasure.  
     (b) The enjoyer has a different attitude/desire toward the same sensation.  

  5. **Aversive Experiences**: People like spicy chili, horror films, or sad music, despite finding them aversive during the experience. This is because:  
     (a) They feel both pain and pleasure simultaneously.  
     (b) The experience is complex—negative in one way but positive overall.  
     (c) They desire/like the experience despite its aversiveness.  

  6. **Simple Creature**: A worm seeks food and avoids injury, but we can’t imagine its inner experiences. We should say it:  
     (a) Experiences pleasure/pain.  
     (b) Does not—it lacks the necessary consciousness.  

  7. **Friend’s News**: Pleasure from a friend’s good news feels different from a hot bath. This difference is due to:  
     (a) The pleasure itself being different.  
     (b) The object (the news) being different, not the pleasure feeling.  

  8. **Rival’s Humiliation**: Pleasure in a rival’s humiliation feels different from other pleasures. This is because:  
     (a) The feeling is distinct.  
     (b) The object (the humiliation) is distinct, not the feeling.  

  9. **Commonality**: Pleasures (bath, relief, puzzle, friend’s news) share:  
     (a) A common feeling.  
     (b) A common attitude (e.g., liking).  
     (c) A common functional role (e.g., causing desire to continue).  
     (d) Nothing in common.  

  10. **No Unity**: If pleasures share nothing in common, hedonism should be:  
      (a) Abandoned.  
      (b) Reformulated (e.g., as a disjunction of goods).  
      (c) Impossible—pleasures must share *something*.  

  11. **Hedonic Tone**: The pleasantness of an experience is:  
      (a) A single, specific quality.  
      (b) A determinable with many forms (e.g., like "color" with shades).  

  12. **Depressed Person**: A depressed person seeks activities they once enjoyed but reports feeling no pleasure. They are:  
      (a) Experiencing pleasure without realizing it.  
      (b) Not experiencing pleasure (acting from habit).  
      (c) Experiencing minimal, unnoticed pleasure.  

  ---

  #### **Scoring Key**  
  *(Map answer patterns to positions)*  
  | **Position**              | **Answer Pattern**                               |  
  |----------------------------|-------------------------------------------------|  
  | **1. Simple-feeling**     | 1b, 2a, 3a, 4a, 5a, 6a, 7b, 8b, 9a, 10c, 11a, 12a |  
  | **2. Attitudinal**        | 1b, 2a, 3a, 4b, 5c, 6b, 7b, 8b, 9b, 10c, 11a, 12b |  
  | **3. Not-an-experience**  | 1b, 2b, 3a, 4b, 5c, 6a, 7b, 8b, 9c, 10b, 11a, 12b |  
  | **4. Desire-or-liking**   | 1b, 2b, 3a, 4b, 5c, 6a, 7b, 8b, 9b, 10c, 11a, 12b |  
  | **5. Representationalist**| 1b, 2a, 3a, 4b, 5b, 6b, 7b, 8b, 9b, 10c, 11a, 12b |  
  | **6. Functional-role**    | 1b, 2a, 3a, 4b, 5c, 6a, 7b, 8b, 9c, 10c, 11b, 12a |  
  | **7. Determinable-tone**  | 1a, 2a, 3a, 4a, 5b, 6a, 7a, 8a, 9a, 10c, 11b, 12c |  
  | **8. Family-resemblance** | 1a, 2a, 3a, 4b, 5b, 6a, 7a, 8a, 9d, 10b, 11b, 12b |  
  | **9. Exit**               | 1a, 2a, 3a, 4b, 5b, 6b, 7a, 8a, 9d, 10a, 11b, 12b |  

  **Indistinguishable Leaves**:  
  - **Attitudinal (2)** vs. **Representationalist (5)**: Both share 1b, 2a, 3a, 4b, 6b, 7b, 8b, 9b, 10c, 11a, 12b. Only Q5 differs (5c vs. 5b), but it’s weak—attitudinal leans toward "desire" (5c), representationalist toward "complex positivity" (5b).  
  - **Why**: Both ground unity in non-feeling properties (attitude or representation), and cases rarely force a choice between them.  

  **Incoherent/Unattractive Patterns**:  
  - **Q9=a + Q10=a**: Claims pleasures share a common feeling *but* hedonism should be abandoned. Incoherent—common feeling should support hedonism.  
  - **Q9=d + Q10=c**: Claims pleasures share nothing *but* must share something. Logically inconsistent.  
  - **Q9=c + Q10=a**: Claims functional unity *but* hedonism should be abandoned. Unexplored/unattractive—why abandon if unity exists?  

