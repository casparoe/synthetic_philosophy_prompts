  ### **One-Page Instructor Key**  
  *(Position, Commonality Claim, Awkward Case, and Answer Pattern)*  

  | **Position**              | **What Pleasures Share**                                    | **Awkward Case**                    | **Answer Pattern**                               |  
  |---------------------------|------------------------------------------------------------|-------------------------------------|-------------------------------------------------|  
  | **1. Simple-feeling**     | A single, uniform felt quality.                            | *Aversive experiences (Q5)*—Why simultaneously feel pain and pleasure? | 1b,2a,3a,4a,5a,6a,7b,8b,9a,10c,11a,12a |  
  | **2. Attitudinal**        | A pro-attitude (e.g., liking) toward an object/experience. | *Unnoticed pleasure (Q2)*—Can attitudes be unconscious? | 1b,2a,3a,4b,5c,6b,7b,8b,9b,10c,11a,12b |  
  | **3. Not-an-experience**  | Causal-functional role (e.g., causing approach behavior).  | *Depressed person (Q12)*—Seeks but reports no pleasure; is the role fulfilled? | 1b,2b,3a,4b,5c,6a,7b,8b,9c,10b,11a,12b |  
  | **4. Desire-or-liking**   | Occurrant desire for the experience to continue.           | *Depressed person (Q12)*—Desires activity but denies pleasure. | 1b,2b,3a,4b,5c,6a,7b,8b,9b,10c,11a,12b |  
  | **5. Representationalist**| Representing an object as good.                            | *Same sensation (Q4)*—Why represent identical sensations differently? | 1b,2a,3a,4b,5b,6b,7b,8b,9b,10c,11a,12b |  
  | **6. Functional-role**    | Causal role (e.g., reinforcing behavior).                  | *Simple creature (Q6)*—Does a worm’s reflex "count"? | 1b,2a,3a,4b,5c,6a,7b,8b,9c,10c,11b,12a |  
  | **7. Determinable-tone**  | A determinable property ("pleasantness") with variable felt determinates. | *Rival’s humiliation (Q8)*—What makes this "pleasantness" if it feels different? | 1a,2a,3a,4a,5b,6a,7a,8a,9a,10c,11b,12c |  
  | **8. Family-resemblance** | No common property—overlapping similarities (Wittgensteinian). | *Simple creature (Q6)*—What resemblance does a worm’s state have to human pleasures? | 1a,2a,3a,4b,5b,6a,7a,8a,9d,10b,11b,12b |  
  | **9. Exit**               | Nothing—heterogeneity refutes hedonism.                    | *Same sensation (Q4)*—If no unity, why call one "pleasure"? | 1a,2a,3a,4b,5b,6b,7a,8a,9d,10a,11b,12b |  

  **Notes**:  
  - **Indistinguishable**: Attitudinal (2) and Representationalist (5) share most answers (differ only on Q5).  
  - **Incoherent Patterns**:  
    - *Q9=a + Q10=a*: Common feeling exists, but hedonism fails—incoherent.  
    - *Q9=d + Q10=c*: No commonality, yet must have unity—contradiction.  
  - **Unexplored/Unattractive**:  
    - *Q9=b/c + Q10=a*: Common attitude/role exists, but hedonism abandoned—unmotivated.  
    - *Q9=a + Q10=b*: Common feeling exists, but hedonism needs reformulation—unexplored.  

  **Use**: Tally answers → match to pattern → assign position. Discuss awkward cases to provoke debate.
