prompt: |-
  I'm the research officer at a mid-sized trade union federation -- about 90,000 members spread across retail, logistics, care work and a couple of NHS trusts -- and I keep getting the same request from branch secretaries. The employer announces some automation thing (self-checkouts and an app that writes the rota, autonomous trolleys in the warehouse plus the scanners that time your pick rate, an AI triage tool in A&E), and they want to know what to do about it. Right now the answer we give is either "we oppose it" or "we probably can't stop it, so let's talk redeployment", and neither of those is really an argument. Our education officer keeps saying we should be doing this with Marx, and she's got something, but when I read the machinery chapter of Capital volume one, or the bit of the Grundrisse everyone calls the fragment on machines, I can see the shape of the analysis and I still can't hand anything useful to a branch seceretary who has three days and no theory. So what I want from you is a decision procedure they can actually run on a specific employer proposal.

  Something like: the questions to ask, in order, what a satisfying answer to each one looks like, where the procedure stops and says "there's nothing specifically to fight here" or "yes, this is the thing to fight", and where it hands the decision back to the members because it's a question of what they're willing to trade rather than a question of fact. I'd like the Marxian distinctions to survive the trip into the checklist rather than getting flattened into "technology is bad" -- in particular the machinery-versus-its-capitalist-use distinction, the argument about whether displaced workers get compensated by the new jobs that cheaper goods are supposed to create, the reserve army, the difference between capital just taking over a craft as it finds it and actually reshaping the labour process to suit itself, and the general intellect point that the same development which deskills everyone also concentrates the knowledge in a shared, socially produced form that could in principle be run on differnt terms. And honestly I want it to be able to tell me when the members' instinct to just oppose the machine is theoretically wrong, because I'd rather hear that from you than from the employer's consultant.

  Then please run it end to end on three cases: a big supermarket chain rolling out more self-checkouts and replacing the paper rota with an app that allocates shifts and break times; a distribution centre introducing autonomous mobile robots and scanner-paced picking, where the employer's line is that nobody is being made redundant and everyone is being "upskilled" into robot supervision; and an NHS trust piloting an AI tool that sorts A&E arrivals, which the trust says will free up experienced nurses for a new "virtual ward". At least one of those should come out in a way my members won't like. Be explicit about which steps are doing real work and which are Marx-flavoured decoration, and about what the procedure can't do -- I'm not expecting it to tell me what the wage claim should be. British English, please, and if it helps, write it as a page a branch secretary could print off and take into a meeting.
reasoning: |-
  Okay, the user is a research officer at a trade union federation. They need a practical decision-making tool for branch secretaries to evaluate employer proposals for automation. The current approaches—either outright opposition or discussing redeployment—aren't sufficient. They want a Marxian analysis distilled into a usable checklist without theoretical jargon.

  The user mentioned specific Marxian concepts that must be preserved: machinery vs. capitalist use, compensation theory, reserve army, reshaping labor, and general intellect. The tool should guide when to fight, when not to, and when it's a bargaining issue. Also, it should challenge members' instincts when opposition isn't theoretically justified.

  The three case studies are key: supermarket self-checkouts and scheduling apps, warehouse robots and scanners, and NHS AI triage. At least one should result in an unpopular outcome to show the tool's objectivity. The output needs to be a printable, step-by-step guide in British English.

  Breaking down the requirements: The decision procedure needs clear steps with questions, evaluation criteria, and decision points. Each step should tie back to Marxian principles but remain actionable. For example:
  - Step 1: Identify the technology and its stated purpose. This distinguishes the machinery itself from its implementation.
  - Step 2: Assess displacement and compensation. Here, Marx's argument about job loss vs. new jobs comes in, with a focus on whether displaced workers are actually reabsorbed.
  - Step 3: Examine control and deskilling. This ties into how capital reshapes labor processes and creates a reserve army.
  - Step 4: Analyze knowledge transfer. The "general intellect" concept applies here—does the tech centralize knowledge in a way that could be democratized?
  - Step 5: Consider workforce fragmentation. This relates to how automation divides workers and weakens collective power.

  For the case studies:
  - Supermarket example: Self-checkouts and scheduling apps likely increase workload and reduce control. The outcome here should be "fight" because it degrades conditions without real benefits.
  - Warehouse robots: The employer claims "upskilling," but supervision roles might be deskilled and stressful. The tool should flag this as needing negotiation over conditions, not outright opposition.
  - NHS AI triage: This might be acceptable if nurses are truly freed for higher-value work, but it requires safeguards. The unpopular outcome—suggesting cautious acceptance if negotiated well—would test members' instincts.

  The user's deeper needs include empowering branch secretaries with a credible, theory-backed tool that prevents rash opposition while highlighting exploitative implementations. They also want to maintain union relevance by moving beyond Luddite reactions. The checklist must be pragmatic—branch secretaries have 3 days and no theory background.

  Finally, the guide should specify limitations: it doesn't set wage claims but identifies battlegrounds. Transparency about "Marx-flavoured decoration" versus actionable steps is crucial for trust. For instance, asking "who controls the knowledge?" (general intellect) might inform bargaining for worker input on tech oversight, even if it doesn't stop implementation.
answer: |-
  Here’s a **Practical Automation Assessment Tool for Trade Union Reps**, designed as a printable one-pager. It translates Marxian analysis into actionable questions, with clear decision points. The core framework focuses on **worker control, displacement dynamics, and labour degradation** – not technology itself.

  ---

  ### **UNION AUTOMATION DECISION PROCEDURE**  
  *Use when employers propose new tech (AI, robots, apps, etc.). Answer sequentially – stop if you hit a "Fight" or "No Issue" outcome.*

  #### **STEP 1: WHAT’S THE CLAIMED PURPOSE?**  
  *Ask Employer:* "What problem does this solve **for the business**, and how will it affect **our members’ daily work**?"  
  *→ Good Answer:* Specific, measurable benefits (e.g., "Reduce repetitive injuries", "Cut patient wait times").  
  *→ Bad Answer:* Vague efficiency gains ("streamline operations"), cost-cutting, or "modernisation".  
  *✋ **STOP HERE IF:** The tech solves a genuine health/safety issue with no worker downside → **Negotiate implementation terms**.  
  *⚠️ PROCEED IF:* It’s about cost control, speed-up, or monitoring.

  #### **STEP 2: WHO CONTROLS THE SYSTEM?**  
  *Ask:* "Who programs/sets the rules? Who can override it? Can workers access the data/logic?"  
  *Marxian Lens:* Capital seeks to embed management control *into machinery* (replacing craft knowledge with automated discipline).  
  *→ Satisfying:* Workers/union co-design thresholds; transparent algorithms; human override powers.  
  *→ Unsatisfying:* "Black box" systems; rules set unilaterally; discipline automated (e.g., scanners timing toilet breaks).  
  *✋ **STOP & FIGHT IF:** Control is fully employer-dominated → **Demand worker oversight rights or reject**.  
  *↳ Otherwise, proceed.*

  #### **STEP 3: DISPLACEMENT OR DISGUISED EXPLOITATION?**  
  *Ask:* "Exactly which tasks disappear? What happens to affected workers? Are 'new roles' real or rebadged degradation?"  
  *Marxian Lens:* Machinery should reduce toil, but under capital it creates a "reserve army" or intensifies surviving work.  
  *→ Red Flags:*  
  - "Upskilling" = watching machines & pressing panic buttons.  
  - Fewer overall jobs OR same headcount with higher targets.  
  - Redeployment = lower pay/casualisation.  
  *→ Green Flags:* Genuine skill development (e.g., maintaining robots); shorter hours at same pay.  
  *✋ **STOP & FIGHT IF:** Net job loss, de-skilling, or work intensification → **Demand job guarantees, shorter hours, pay rises**.  
  *↳ Otherwise, proceed.*

  #### **STEP 4: THE GENERAL INTELLECT TEST**  
  *Ask:* "Does this tech centralise knowledge workers once held? Could that knowledge benefit society if democratised?"  
  *Marxian Lens:* Automation turns workers’ collective knowledge ("general intellect") into fixed capital – but unions can demand community benefit.  
  *→ Opportunity:* E.g., AI triage trained on NHS data should belong to the public.  
  *→ Threat:* Profit-driven data hoarding (e.g., warehouse productivity metrics sold to rivals).  
  *✋ **STOP & NEGOTIATE IF:* Knowledge is extracted from labour → **Demand data sovereignty, public ownership models, or skill-recognition payments**.  

  #### **FINAL DECISION POINT**  
  - **NO SPECIFIC ISSUE:** Tech genuinely improves work without hidden exploitation → Monitor implementation.  
  - **FIGHT:** Unacceptable control/displacement/labour degradation → Mobilise members.  
  - **BARGAINING TRADE-OFF:** Tech has pros/cons (e.g., less physical strain but more monitoring) → **Hand to members:** "What will you accept in exchange (e.g., shorter week, pay rise, veto powers)?"  

  ---

  ### **CASE STUDY ASSESSMENTS**  
  *(Using the procedure above)*  

  #### **1. Supermarket Self-Checkouts & Rota App**  
  - **Step 1:** *Purpose:* Cost-cutting (fewer till staff), "flexibility" (= employer-controlled scheduling).  
  - **Step 2:** *Control:* App sets breaks/shifts algorithmically; no worker input. Self-checkouts monitor via cameras. → **FIGHT FLAG: Total employer control.**  
  - **Step 3:** *Displacement:* Fewer checkout staff; "redeployment" to shelf-stacking (lower skill). App increases unpaid "availability" pressure. → **FIGHT FLAG: Displacement + work intensification.**  
  - **Step 4:** *General Intellect:* Rota data used to minimise staffing; consumer labour (self-scan) not compensated.  
  *→ OUTCOME: **FIGHT**. Demand staffing ratios, human shift approval, and pay premium for "flexibility".*  

  #### **2. Warehouse Robots & Scanner-Paced Picking**  
  - **Step 1:** *Purpose:* "Efficiency" (speed-up), cost reduction via "density optimisation".  
  - **Step 2:** *Control:* Scanners enforce pace; robots dictate workflow. Override only for faults. → **FIGHT FLAG: Automated discipline.**  
  - **Step 3:** *Displacement:* No redundancies, but "robot supervision" = stress-monitoring screens + faster manual pick rates. → **BARGAINING TRADE-OFF:** Less walking but higher mental strain.  
  - **Step 4:** *General Intellect:* Pick-rate data entrenches exploitation metrics.  
  *→ OUTCOME: **BARGAIN**. Members decide: Accept if 4-day week + stress bonuses; else fight pace-setting tech.*  

  #### **3. NHS AI Triage Tool for A&E**  
  - **Step 1:** *Purpose:* Reduce wait times ("free nurses for virtual wards"). Potentially valid if triage is overloaded.  
  - **Step 2:** *Control:* Nurses input data; AI advises. Clinicians can override? → **Negotiate:** Demand clinician veto and training data transparency.  
  - **Step 3:** *Displacement:* No job loss; claims experienced nurses move to "higher value" work. → **Verify:** Is virtual ward staffing new or stretched thin?  
  - **Step 4:** *General Intellect:* NHS data used for public good? → **NEGOTIATE:** Demand the AI is open-source, owned by NHS.  
  *→ OUTCOME: **NO ISSUE if** overrides secure, staffing guaranteed, and AI is public good. ELSE **FIGHT** privatised healthcare tech.*  
  *(This outcome may be unpopular – but Marx distinguishes tech that socialises knowledge from that which deskills. Fight misuse, not the tool.)*  

  ---

  ### **WHAT THIS TOOL DOES & DOESN’T DO**  
  - **DOES:**  
    - Spot hidden exploitation (speed-up, deskilling, data grab).  
    - Expose when "efficiency" = worker disposability.  
    - Turn "machinery vs. its capitalist use" into concrete demands (control, shorter hours, data rights).  
  - **DOESN’T:**  
    - Predict long-term job creation (Marx’s "compensation theory" is unreliable – assume net job loss).  
    - Set wage claims (but flags when tech justifies them).  
    - Replace member consultation (Step 3/4 often hand decisions back).  

  ### **MARXIAN ELEMENTS: WHAT’S FUNCTIONAL VS DECORATIVE?**  
  - **Functional:** Control (Capital Vol 1), disguised exploitation (Reserve Army), knowledge commons (General Intellect).  
  - **Decoration:** "Organic composition of capital" calculations; historical detail.  
  - **Key Insight:** *Capital uses machinery to break worker autonomy*. The fight is for **control, time, and dignity** – not Luddism.  

  **[Print this page. Take it to meetings. Use it to force employers to reveal their real aims.]**
