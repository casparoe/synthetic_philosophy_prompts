prompt: |-
  I run the hiring loop at a mid-sized software company, and I have one strong researcher — comfortable with game theory and evolutionary biology — for roughly six months of theory work on it. Tell me which two or three open questions in costly-signaling theory that person should take on first, and defend the ordering.

  The context you need: our pipeline currently treats five things as evidence of engineering ability — take-home exercises, live coding, a public commit history, employee referrals, and a degree. Generative models have made the first two cheap to produce, which I suspect has made the last three relatively more informative. I've read the popular treatments (peacock tails, conspicuous consumption, the labor-market story on education as a costly way of proving you were already good), but I have no technical background in this area, so I want judgment rather than a reading list.

  Four things I've stumbled on that complicate the standard story, and that I'd like your ordering to take a position on:

  - The claim that honest signaling doesn't actually require cost — that cheap signals can be a stable equilibrium when the parties' interests partly overlap — which makes me wonder how much of the peacock story is load-bearing and how much is an artifact of the examples everyone repeats.
  - The idea economists call countersignaling: the highest-quality agents stop signaling, so the signal ends up marking the middle tier, and sending it becomes evidence of not being top-tier.
  - The distinction between signals that can't be faked because they're causally tied to the underlying quality and signals that are merely expensive to fake, along with the suggestion I've seen that this distinction is a modeling convenience rather than a fact about the world.
  - The gap between a signal and a mere cue — evidence that leaks out without being produced for an audience, and therefore can't be gamed by whoever knows what the audience wants.

  Weigh these against each other and against anything I've missed: which is upstream of the others, in the sense that settling it would change what the remaining questions even look like; which one person could make real progress on in six months; which would actually change what we do in the pipeline if it came out one way rather than the other; and which sound important but wouldn't change anything downstream. Say what would move a question up or down your list.

  Commit: name the two or three you'd pick, in order, and specify what that person should do in the first month. Lead with the bottom line in your first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user runs hiring at a mid-sized software company and has a researcher for six months to work on costly-signaling theory. They want to prioritize two or three open questions in that area. Let me start by understanding their main concerns.

  First, their hiring pipeline uses five signals: take-home exercises, live coding, public commits, referrals, degrees. Generative AI has made take-home and live coding cheaper to fake, so the last three might now be more informative. They mentioned four complications: honest signaling without cost, countersignaling, signals tied to quality vs. expensive to fake, and signals vs. cues. 

  The user needs practical advice on which questions will most impact their hiring process. They want the researcher to tackle issues that are upstream (affect other questions), feasible in six months, and actionable for the pipeline. Let me evaluate each complication.

  1. **Honest signaling without cost**: If signals can be honest without being costly, that challenges the peacock tail analogy. If this is true, it could change how they view all signals. But is this foundational? Settling this might redefine what makes a signal reliable. However, proving this in their context might be complex.

  2. **Countersignaling**: High-quality candidates stop signaling, so signals indicate mid-tier. This seems directly relevant. For example, top developers might not have public commits or degrees, making referrals more crucial. This could immediately affect how they weight referrals vs. degrees. Feasible to model in six months? Probably, with game theory.

  3. **Signals tied to quality vs. expensive to fake**: The distinction between causal ties and cost. The user wonders if this is just modeling convenience. If causal signals exist (like innate ability indicators), they're harder to fake. But in hiring, are public commits causally tied to skill or just costly? This might influence how they assess commit histories. However, if it's more theoretical, it might not be as actionable.

  4. **Signals vs. cues**: Cues are unintentional evidence (e.g., a GitHub profile not meant for hiring). These can't be gamed directly. But in their pipeline, public commits could be cues if not groomed for hiring. If they can identify cues, those might be more reliable post-AI. This seems actionable, like focusing on cues like organic commit histories.

  Now, upstream factors: If question 1 (costless honesty) is resolved, it affects everything else. But is it solvable in six months? Maybe not, as it's a deep theoretical issue. Question 4 (cues) might be more practical. Countersignaling (2) could directly impact how they interpret signals like degrees or referrals.

  Feasibility: Countersignaling and cues seem more testable with data. The researcher could analyze their hiring data to see if top performers have fewer signals. Cues could be identified by comparing groomed vs. organic GitHub profiles.

  Downstream impact: If countersignaling is confirmed, they might de-emphasize degrees if top candidates skip them. Cues like referrals or organic commits become more valuable. Question 1 might not change practices much if cost is still relevant in some cases.

  Prioritization: Start with countersignaling (2) because it's actionable and directly affects signal interpretation. Then cues (4) to identify ungamed evidence. These two can be tackled with data analysis and modeling. Question 1 is foundational but less urgent for immediate pipeline changes. Question 3 might not be as pressing now.

  First month: For countersignaling, analyze past hires to correlate signals with performance tiers. For cues, design a study to compare intentional vs. unintentional signals in their pipeline.
answer: |-
  **Prioritize countersignaling first, then the signal/cue distinction, and defer costless honesty as most upstream but least immediately actionable.**  

  ### 1. **Countersignaling (Highest Priority)**  
  **Why first:**  
  - **Directly impacts your pipeline:** If top-tier candidates *avoid* signals like degrees or public commits (e.g., because they contribute to private repos), your current reliance on these could misidentify elite talent. Countersignaling explains why "middle tier" candidates signal most intensely, making employee referrals (which might bypass formal signals) disproportionately valuable.  
  - **Actionable in 6 months:** Your researcher can model your hiring data: correlate signal intensity (e.g., degree prestige, commit volume) with post-hire performance. If high performers show *lower* signal intensity, it validates countersignaling. This directly informs whether to deprioritize degrees/public commits for senior roles.  
  - **Downstream implications:** Resolving this reshapes how you weight existing signals. If countersignaling holds, you’d shift focus to referrals and subtle cues (see #2).  

  ### 2. **Signal vs. Cue Distinction (Second Priority)**  
  **Why next:**  
  - **Clarifies what’s gameable post-AI:** Generative AI makes intentional signals (take-homes, live coding) cheap to fake—but *cues* (e.g., organic commit histories, referral context) are "leaked" evidence not produced for hiring, hence harder to manipulate. This explains why referrals/commits gained relative value when AI flooded cheap signals.  
  - **Feasible and high-leverage:** Your researcher can design experiments to classify your signals:  
    - **Cues:** Natural commit histories (ungroomed for hiring), referral nuances (e.g., "worked with them under deadline pressure").  
    - **Signals:** Polished portfolios, degrees.  
    Track fakability: e.g., compare AI-generated take-homes vs. commit histories vetted for authenticity. Result: double down on cues if they resist gaming.  
  - **Pipeline impact:** If cues dominate, you’d prioritize commit history *context* (e.g., collaboration patterns) and referrals with specific evidence over boilerplate signals.  

  ### 3. **Costless Honesty (Deferred as Upstream but Less Urgent)**  
  **Why last despite being foundational:**  
  - **Upstream theoretically:** If honest signaling *can* be cost-free (e.g., via partial interest alignment), it challenges whether "cost" is central. This could reframe peacock-style models—but your pipeline already assumes costs *exist* (e.g., degrees are expensive).  
  - **Limited short-term impact:** Even if cost isn’t *required*, your problem is *cost differentials* (AI reduced costs for some signals). Proving costless honesty won’t change that take-homes are now easier to fake than referrals.  
  - **Research-heavy:** Requires game-theory simulations (e.g., modeling employer/candidate incentive overlaps). Likely exceeds 6 months for definitive answers with practical insights.  

  ### What Moves a Question Up/Down:  
  - **Up:** Direct pipeline impact (countersignaling), resistance to AI fakability (cues).  
  - **Down:** Theoretical novelty without operational implications (costless honesty), or distinctions without behavioral differences (e.g., "causal vs. costly" if both reduce to fakability).  

  ### First Month Plan:  
  - **Weeks 1–2:** Audit your historical hiring data. Map signal presence (degree, commits, referrals) against performance tiers (e.g., top/mid/low performers). Test for countersignaling patterns (e.g., do elite engineers lack "standard" signals?).  
  - **Weeks 3–4:** Classify signals in your pipeline as intentional (e.g., take-homes) vs. unintentional cues (e.g., commit histories). Pilot a "fakability assessment": e.g., compare AI-generated take-home solutions vs. organic commit quality (using internal expert ratings).  
  - **Goal:** By month-end, draft a model of which signals are countersignals or cues, and propose one pipeline tweak (e.g., "weight referrals 2× if they include contextual evidence").
