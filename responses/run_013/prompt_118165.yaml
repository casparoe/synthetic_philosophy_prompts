answer: |-
  Here is a map built from your questions, tracing the joints where positions diverge. It starts with the grounding of the vote, then overlays its purpose, then the nature of casting it, and finally confronts the circularity. Positions emerge where combinations of answers cohere, with their inherent tensions and the cases that strain them.

  **The Grounding Question:** What entities does the vote fundamentally belong to? The first split is indeed between those bound *by* the law (B) and those affected *by* the law (A). These are distinct: a child is bound (B) but not usually considered to ground a vote on that basis alone; a foreign tourist is affected (A) but not bound (B). Some positions might require both (B+A), others might see grounding residing solely in one or the other.

  **The Purpose Question:** What is the vote *for*? This splits into: protecting individual interests (I), signifying and enacting full membership/standing in the political community (M), or extracting the most reliable information/aggregate preference for better governance (X). Purpose isn't always rigidly tied to grounding, but tendencies exist: (B) often aligns with (I) or (M), while (A) strongly leans towards (I), and (X) can float somewhat independently, potentially accepting various groundings if it serves the information goal.

  **The Nature Question:** Is casting a vote a right (R), a civic duty (D), or a burden/privilege (Bu)? This often follows from purpose: (I) strongly implies (R), (M) often implies (D) or (R), (X) can imply (Bu) or a limited (D). (D) naturally supports compulsory voting, (R) often opposes it as a violation, (Bu) might oppose it or accept it reluctantly as a necessary evil.

  **The Circularity Challenge:** For positions grounding the vote in being affected (A), the question of *who decides who is affected* creates tension. If the current electorate decides, they judge their own case. Positions relying heavily on (A) must either accept this circularity as unavoidable in practice (though theoretically problematic), argue for impartial criteria, or shift significant weight onto another grounding (like B) or purpose (like M) to mitigate it.

  **Resulting Positions:**

  1.  **Bound Interests Protector (Unnamed):** Grounding=B. Purpose=I. Nature=R. The vote belongs to those directly subject to the law's coercive power (fines, conscription, prosecution) to protect their interests. Compulsory voting violates this right. *Hardest to explain:* Why those deeply affected but not directly bound (e.g., long-term resident non-citizen taxpayer, resident children facing school closures) lack standing, and why those bound but minimally affected (e.g., the citizen living abroad permanently, the severely cognitively impaired adult under guardianship) retain the vote. The prisoner case is contested internally – some see disenfranchisement as part of punishment (bound but vote removed), others see it as inconsistent.

  2.  **Community Member (Unnamed, akin to Civic Republicanism):** Grounding=B (often implicitly includes cultural/social belonging). Purpose=M. Nature=D (often). Voting signifies and enacts full membership in the self-governing community. Compulsory voting reinforces this duty. *Hardest to explain:* Defining the boundaries of the "community" non-arbitrarily (excluding the long-term resident non-citizen? Including citizens abroad?) and why membership, once granted, cannot be forfeited or suspended (e.g., prisoner disenfranchisement, dementia). The circularity challenge applies weakly if "membership" is defined separately from being affected.

  3.  **Affected Interests Advocate (Unnamed):** Grounding=A. Purpose=I. Nature=R. Anyone significantly impacted by decisions deserves a vote to protect their interests. *Hardest to explain:* The circularity challenge is acute. Who defines "significantly impacted"? How to practically include *all* affected (e.g., the foreign firm, the tourist, children, future generations)? This position struggles immensely with boundaries and risks incoherence without a clear, non-circular mechanism for defining the affected demos. Cases like the homeowner abroad paying local taxes fit easily; children and future generations become major problems.

  4.  **Household/Trustee Interest (Unnamed):** Grounding=B or B+A (Household unit). Purpose=I. Nature=R or D. An attempt to resolve the child case. Voting grounds in being bound/affected, but is exercised by the household head or parent "in trust" for dependent members until maturity. *Hardest to explain:* Why this isn't arbitrary (excluding independent minors?), how it avoids becoming purely patriarchal, and whether the trustee genuinely votes the child's interests. Fails for non-dependent affected parties (e.g., tourist, foreign firm).

  5.  **Information Optimizer (Unnamed, akin to Epistocracy-lite):** Grounding=Variable (often B, but secondary). Purpose=X. Nature=Bu (or a constrained D). Voting's value is in producing good decisions via informed preferences. Focuses on competence/reliability. Supports restricting the vote (tests, age limits) to improve information quality. Compulsory voting for the qualified might be accepted to ensure representative input, but reluctantly seen as burdensome. *Hardest to explain:* Why competent, affected non-citizens (e.g., long-term resident) or bound-but-less-competent citizens (e.g., some elderly) should be excluded/included solely based on a test, and how to define competence without bias. The dementia patient is explicitly excluded; the working 16-year-old might be included if competent.

  6.  **Civic Duty Universalist (Unnamed):** Grounding=B (often broad). Purpose=M (primary), I (secondary). Nature=D. Strongly supports compulsory voting as an obligation of membership. Voting is how the community functions. *Hardest to explain:* Why this duty applies to the profoundly disengaged citizen abroad or the severely cognitively impaired (dementia), and why it shouldn't extend to all long-term residents who share the community's life (non-citizen resident). Prisoner disenfranchisement is a common but contested exception.

  7.  **Minimal Coercion Bound (Your "Everyone Bound" view):** Grounding=B (strictly defined). Purpose=I (primary). Nature=R. Only those directly subject to state coercion (law's binding force) get the vote. *Hardest to explain:* Excluding those deeply affected but not directly bound (long-term resident non-citizen, children bound but denied vote) and *including* citizens abroad not facing coercion (eviction, prosecution here) or those under guardianship (where the state arguably binds the *guardian* more directly). The working 16-year-old bound by labour laws becomes a strong case for inclusion here.

  8.  **Future Interests Proxy (Unnamed):** Grounding=A (Future people). Purpose=I. Nature=R or D (for current voters). Acknowledges future generations are affected (A), but argues current voters must act as trustees for their interests. Not a standalone position; it's an *addendum* that pressures positions emphasizing (A) or (I). *Hardest to explain:* How current voters can reliably identify and weight future interests against present ones, and why this doesn't imply direct representation for the unborn.

  **Empty/Unstable Combinations:**
  *   **Grounding=A + Purpose=X + Nature=R:** If voting is primarily about extracting information (X) and a right (R), grounding it solely in being affected (A) is incoherent. Why would a tourist have a *right* to influence information quality? (X) requires restricting input to reliable sources, conflicting with universal (A)+ (R).
  *   **Grounding=A + Nature=D:** If voting is a duty (D), grounding it in being affected (A) is problematic. Can we have a *duty* to a community we don't necessarily belong to? This combination lacks strong proponents; duty (D) strongly leans towards grounding in membership (B/M).
  *   **Grounding=B + Purpose=X + Nature=D:** Compulsory voting (D) for the purpose of information (X) is unstable. If the goal is optimal information, forcing the uninformed or unwilling to vote *degrades* the information. (X) typically prefers voluntary or restricted participation.

  **Placing Your Cases:**
  *   **16-year-old worker/taxpayer:** Strains Bound Interests Protector (B+I+R) & Minimal Coercion Bound (B) (argues for inclusion), Community Member (M) (argues against if age defines membership), Information Optimizer (X) (depends on competence test).
  *   **Long-term resident non-citizen taxpayer:** Core challenge for Bound Interests Protector (B+I+R) & Minimal Coercion Bound (B) (excluded), strong case for Affected Interests Advocate (A+I+R) (included, but circularity), challenge for Community Member (M) (why not a member?).
  *   **Citizen abroad permanently:** Challenge for Bound Interests Protector (B+I+R) & Minimal Coercion Bound (B) (included but not bound), Community Member (M) (included by status, but lacks connection), Affected Interests Advocate (A+I+R) (likely excluded if minimal effect).
  *   **Adult under guardianship (dementia):** Challenge for all (B) positions (bound but capacity?), Community Member (M) (status vs capacity?), Information Optimizer (X) (excluded).
  *   **Long-term prisoner:** Contested within Bound Interests Protector (B+I+R) & Minimal Coercion Bound (B) (bound but vote removed?), Community Member (M) (forfeited membership?).
  *   **Homeowner abroad paying local tax:** Case for Affected Interests Advocate (A+I+R) (included, circularity), Bound Interests Protector (B+I+R) & Minimal Coercion Bound (B) (excluded - not resident/bound?).
  *   **Children:** Bound (B) universally, affected (A) significantly. Core problem for Bound Interests Protector (B+I+R) (why no vote?), case for Affected Interests Advocate (A+I+R) (why no vote? circularity). Household/Trustee (B/A+I+R/D) offers one solution (proxy vote). Future Proxy (A+I) applies.
  *   **Future Generations:** Solely Affected (A). Pressures Affected Interests Advocate (A+I+R) (inclusion impossible) and Future Proxy (A+I) (requires current voters to act for them).

  This map shows how the answers to your three core questions generate distinct pressures and tensions, shaping the landscape of disagreement. The circularity inherent in defining "affected" remains a specific burden for positions leaning heavily on that grounding. The cases act like probes, revealing the fractures and stresses within each position where its answers struggle to align cleanly with real-world complexities.
