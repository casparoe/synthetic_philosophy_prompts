answer: |-
  ## Final Examination: Applied Ethics (Level 6)

  **Module Title:** Ethical Obligations in Extremis  
  **Time Allowed:** 90 Minutes  
  **Word Guide:** Approximately 1,200 words  
  **Total Marks:** 30  

  **Answer ONE Question**

  **Question 1**

  Consider the following scenario:

  > A single lifeboat, rated to carry safely fewer individuals than it currently holds, contains the surviving crew of a sunken ship alongside people rescued from the water. Water and food supplies are sufficient for some, but not all, occupants to survive the journey to land. Heavy weather threatens to swamp the overloaded boat. All occupants were strangers before the disaster and have made no prior agreements.

  You have been introduced to two principles of maritime law relevant to situations of peril at sea:

  1.  **General Average:** When a loss (e.g., cargo deliberately thrown overboard to save a foundering vessel) is incurred voluntarily and successfully for the *common safety* of the entire venture (ship, cargo, crew), that loss is not solely borne by the owner of the sacrificed property. Instead, the loss is shared *proportionately* by all parties whose property (ship or cargo) was saved. This requires: (i) a *common danger* threatening the entire venture; (ii) a *voluntary sacrifice* of part for the sake of the whole; and (iii) the *success* of the venture (contributions are only assessed if the ship and remaining cargo are saved). Assessment is *retrospective*, conducted after the event by an adjuster using records to determine values and contributions.
  2.  **Duty of Assistance:** The master of a vessel is obliged to assist persons in distress at sea *if* they can do so without placing their own vessel or its occupants in *serious danger*. This duty has a threshold: it ceases once assistance would pose a serious danger.

  **Critically evaluate whether the normative structure of 'General Average' provides a viable model for determining the mutual obligations of the lifeboat occupants towards each other and towards any remaining swimmers in the water. Does the analogy hold, or does it break down at points crucial to ethical decision-making in this scenario?**

  In your answer, you must:
  *   Identify the core presuppositions of General Average (such as a common venture, compensable loss, identifiable contributors, retrospective adjudication) and test each against the realities of the lifeboat situation.
  *   Examine how applying a rule of shared sacrifice modelled on General Average might alter the threshold nature of the Duty of Assistance for those *already* on the boat regarding further swimmers.
  *   Address the fundamental problem that the 'sacrificed' party in the lifeboat (e.g., someone denied entry or ejected) cannot be compensated. What could ethically substitute for compensation (e.g., lottery, claim for dependants, prior consent)? Does any substitute function adequately?
  *   Distinguish clearly between the structure of a rule allocating a *loss* among *beneficiaries* (like General Average) and the structure of a *duty* owed *to a claimant* (like the Duty of Assistance). Which structure is most relevant to the core ethical challenges in the lifeboat?
  *   Explicitly confront the legitimacy of a rule that might be considered fair *before* an event (ex ante) but results in death for some *after* the event (ex post), rather than assuming its acceptability or unacceptability.
  *   Precisely state your own proposed rule for determining obligations in this lifeboat scenario. Then apply your rule to the following two variant cases:
      *   **(Variant A):** The extra passengers in the boat are from a ship that deliberately stood off and refused to aid the others before sinking itself.
      *   **(Variant B):** After your rule has been invoked and acted upon (e.g., someone was denied entry), one further swimmer reaches the boat. Admitting this swimmer would make them the last person the overloaded boat could potentially carry without immediate swamping.

  ---

  ## Model Answer (Approx. 900 words)

  The lifeboat scenario presents a brutal ethical dilemma concerning our duties to strangers under extreme scarcity and threat. While maritime law offers frameworks like General Average (GA) and the Duty of Assistance, transplanting GA's normative structure directly into the lifeboat fails fundamentally due to irreconcilable differences in presuppositions and consequences, particularly regarding uncompensated sacrifice and the nature of the duties involved.

  **A. Testing GA's Presuppositions against the Lifeboat**
  GA presupposes several conditions absent or fatally compromised in the lifeboat:
  1.  **Common Venture:** GA assumes ship, cargo, and crew share a *commercial venture* with intertwined interests. The lifeboat occupants, however, are accidental co-survivors, strangers without a pre-existing joint enterprise. While they share a *common danger*, this is a shared predicament, not a shared venture with pooled assets and risks from the outset.
  2.  **Compensable Loss & Identifiable Contributors:** GA sacrifices *property* (cargo) which has a monetary value that can be retrospectively assessed and reimbursed by others who benefited from the sacrifice (saved ship/cargo owners). The lifeboat necessitates sacrificing *lives* or denying life-saving aid. Life is not compensable; the 'sacrificed' individual (ejected or denied entry) is destroyed, not merely deprived of property. There is no equivalent to 'saved cargo owners' who can financially reimburse this loss.
  3.  **Retrospective Adjudication:** GA relies on a disinterested adjuster working *after* the safe conclusion, using records to fairly apportion *financial* loss. The lifeboat demands immediate, in extremis decisions. There are no objective records of 'value' (beyond survival chance), no time for deliberation, no neutral arbiter, and no 'after the event' for the sacrificed individual. The decision-maker is a terrified participant.

  **B. Transforming the Duty of Assistance?**
  The Duty of Assistance imposes a threshold: aid must be rendered unless it poses *serious danger* to the rescuer. For a full lifeboat, admitting more *typically* meets this 'serious danger' threshold, lapsing the duty. GA, however, suggests a model of *proportional sharing of risk*. Applying this logic might imply that occupants bear *some* increased risk to aid swimmers, as the 'cost' of rescue is distributed. This attempts to convert the threshold duty into a continuous or graded one. However, this transformation is deeply problematic. GA distributes *financial cost* after success; distributing *incremental lethal risk* in real-time is profoundly different. Determining a 'fair share' of lethal risk is arguably impossible and likely demands sacrifices (deaths) that are neither voluntary nor compensable, violating core ethical principles GA itself relies upon (voluntariness, compensation).

  **C. The Insurmountable Problem of Uncompensated Sacrifice & Substitutes**
  The core failure of the GA analogy is the *irremediable nature* of sacrificing a life. No substitute for compensation is adequate:
  *   **Lottery:** While ex ante fair, it is still arbitrary execution ex post. Does 'fair chance' legitimise killing?
  *   **Claims for Dependants:** Prioritising those with dependants might seem to salvage some 'value', but it instrumentalises the individual and offers no solace or justice to the sacrificed person. It also requires knowledge and adjudication impossible in the moment.
  *   **Prior Consent:** Hypothetical consent is meaningless here; actual consent under such duress is invalid. Occupants consented to no such rule beforehand.
  None of these substitutes genuinely 'compensate' the victim or do the work GA's compensation does – restoring the sacrificer to their prior position relative to other beneficiaries. The sacrifice remains a terminal, uncompensated loss.

  **D. Loss Allocation vs. Duty to Claimants**
  This highlights the crucial structural difference. GA is a *loss allocation mechanism* among parties bound by a venture after a *property* sacrifice *saves the venture*. The lifeboat's core ethical challenge is determining whether a *duty is owed* *to specific claimants* (the swimmers) *by specific agents* (those on the boat), concerning the claimants' fundamental right to life, balanced against the agents' right to self-preservation. The structure is fundamentally one of conflicting claims and duties between individuals/groups, not the post-hoc financial adjustment among beneficiaries of a successful venture. The swimmer is not a contributor to a venture; they are a potential beneficiary of a rescue *duty*.

  **E. Ex Ante Fairness vs. Ex Post Lethality**
  A rule like a lottery might seem ex ante fair (equal chance), but its ex post consequence is consigning specific individuals to death arbitrarily. Legitimacy cannot rest on ex ante fairness alone when the ex post outcome involves the direct, non-consensual killing of innocents. The extreme nature of the outcome demands scrutiny. While extreme necessity might *excuse* actions taken, it does not automatically render rules mandating such actions *legitimate* or *just*. The lack of consent and the terminal nature of the sacrifice weigh heavily against legitimacy.

  **F. Proposed Rule and Application**
  Given the failure of GA and the limitations of the threshold duty, the most defensible rule prioritises preserving existing life where resources are catastrophically insufficient and further rescue poses imminent lethal danger to *all*. The rule is: **"When a lifeboat is loaded beyond its safe capacity and provisions are insufficient for all, occupants have no duty to admit further swimmers if doing so would create a *clear and imminent danger* of the boat foundering, thereby risking *all* lives. Decisions must be made to maximise the number likely to survive to landfall, based on *immediate necessity* (e.g., minimising weight, securing seaworthiness), avoiding arbitrary discrimination."**

  *   **Variant A (Non-rescuers):** Their prior refusal to aid creates a strong reciprocal claim *against* them. While the core rule prioritises boat safety and maximising survivors, their prior culpable inaction weakens any claim *they* might have for admission over others. If weight/space necessitates exclusion, they could be justifiably prioritised for exclusion based on their culpability, provided it doesn't compromise the boat's safety more than excluding another.
  *   **Variant B (Late Swimmer):** The rule was invoked based on conditions *at the time*. The arrival of a new swimmer presents a *new* decision point. The rule applies again: does admitting *this* swimmer *now* create a clear and imminent danger of swamping? If the boat was already at the absolute maximum safe limit established by the initial invocation, and admitting one more demonstrably crosses that threshold, the duty does not arise. The rule is applied to current conditions, not past decisions. If, however, reassessment suggests the boat could bear *one* more without *imminent* danger, the duty to assist might reactivate.

  ---

  ## Marking Scheme (Total: 30 Marks)

  | **Criterion**                                                                 | **Marks** | **A (70%+ / 21+)** vs. **B (60-69% / 18-20.9)**                                                                                                                                                             | **Common Pitfalls (Marks Lost)**                                                                                                |
  | :---------------------------------------------------------------------------- | :-------: | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Identification & Testing of GA Presuppositions**                         |    7      | **A:** Comprehensive identification (common venture, compensable loss, contributors, adjudicator) & sophisticated testing against lifeboat specifics. <br>**B:** Identifies most presuppositions but testing is superficial or incomplete. | Missing key presuppositions (1-2); Listing without meaningful testing (2-3); Confusing GA with other concepts (1-2).           |
  | **2. Transformation of Duty of Assistance**                                   |    5      | **A:** Clear explanation of threshold duty and insightful analysis of how GA model *might* convert it, highlighting critical problems (risk vs. cost, voluntariness). <br>**B:** Describes threshold duty but weak analysis of GA's potential effect. | Misstating the duty (1-2); Superficial "yes it changes/no it doesn't" without mechanism or problems (1-2); Ignoring self-preservation cap (1). |
  | **3. Addressing Uncompensated Sacrifice & Substitutes**                       |    5      | **A:** Forcefully establishes the problem's centrality, critiques substitutes effectively, clearly shows why no substitute works like compensation. <br>**B:** Recognises the problem but critique of substitutes is weak/undeveloped; may suggest impractical substitutes uncritically. | Ignoring the problem (2-3); Merely listing substitutes without critique (1-2); Asserting a substitute works without justification (1-2). |
  | **4. Distinguishing Loss Allocation vs. Duty to Claimant Structures**         |    4      | **A:** Precise distinction drawn, convincingly argues which structure fits the lifeboat's core ethical challenge. <br>**B:** Distinction attempted but unclear or inaccurate; weak argument for relevance. | Conflating the structures (2); Vague distinction (1-2); Not linking distinction to core challenge (1).                         |
  | **5. Confronting Ex Ante Fairness vs. Ex Post Lethality**                     |    3      | **A:** Explicitly addresses the tension, offers a reasoned judgment on legitimacy beyond assumption. <br>**B:** Mentions ex ante/ex post but offers only a superficial or assumed judgment.                 | Assuming legitimacy/illegitimacy without argument (2); Ignoring the point entirely (2-3).                                      |
  | **6. Own Rule: Clarity, Precision & Application to Variants A & B**           |    6      | **A:** Rule is precise, actionable, ethically grounded. Application to *both* variants is logical, consistent with the rule, and insightful. <br>**B:** Rule stated but vague/inconsistent. Application to variants attempted but flawed, inconsistent, or superficial (e.g., only one variant). | Vague/unworkable rule (2-3); Rule ignores core constraints (1-2); Only addresses one variant (1-2); Application illogical/inconsistent (1-2 per variant). |
  | **General:** Structure, Clarity, Argumentation, Addressing the Core Question |   (N/A)   | **A:** Logically structured, exceptionally clear, compelling argument directly answering the question. <br>**B:** Generally clear and structured, coherent argument, addresses the question.                 | Poor structure (1-3); Unclear writing (1-2); Losing focus/not answering the question (2-4); Significant ethical missteps (2-4). |

  **Separating an A from a B:** An A answer demonstrates **mastery** by integrating all criteria seamlessly into a sophisticated, original, and compelling argument. It shows deep understanding of the normative machinery of both GA and the lifeboat dilemma, anticipates and counters potential weaknesses, and presents a well-justified, precise alternative rule applied thoughtfully to the variants. A B answer covers the required points **competently** but lacks the depth of analysis, integration, originality, or precision of an A. It might adequately address each criterion in turn but fail to synthesise them powerfully or apply the rule as insightfully to the variants. The argument is sound but less nuanced or forceful.
