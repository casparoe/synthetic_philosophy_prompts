prompt: |-
  Hey — I need you to act as a philosopher who works on consent and coercion (the bioethics-adjacent literature, not just the political theory stuff), and I want you to actually think before you type: brainstorm first, sketch the candidate mappings, and only then write the analysis. I'd rather you be slow and specific than fast and general.

  Here's a case I keep coming back to, and I don't think the textbook treatment does it justice: the Willowbrook hepatitis studies. Quick recap in case your memory of the details is fuzzy, and go with my version of the facts: Willowbrook was a New York state institution on Staten Island for children with intellectual disabilities, opened in the late 40s, built for around 4,000 and holding well over 6,000 by the mid-60s, with hepatitis — mostly type A — basically endemic. From the mid-50s into the early 70s Saul Krugman and his colleagues ran studies there, part of which involved deliberately feeding live hepatitis virus, taken from the stool of infected patients, to healthy children, in order to learn how the disease spread and whether gamma globulin protected against it. The children got sick; that was the point. Krugman's defence was that almost every child admitted to Willowbrook got hepatitis soon after arrival anyway, and that the children in the study got better medical attention than the ones who didn't. Parents signed consent forms. The children were minors and intellectually disabled, so the signature was always a parent's. This is the case that gets dragged out as a founding horror story of research ethics, and I know that part already — don't give me the Belmont Report lecture.

  What I want is a real mapping onto a theory of valid consent. Here's my working framework, and I want it stress-tested, not summarized back at me: (1) competence — the person consenting has to be able to understand and weigh what's being proposed; (2) information — no material deception about what's being done or why; (3) voluntariness — no coercion or pressure; (4) scope — consent is always consent to something specific, so it can be valid for one thing and void for another within the same encounter, and there's no consenting in general. And the thing I keep tripping on: (3) is only as good as the baseline you measure it against. An offer of something you wouldn't otherwise get and a threat of taking away something you would otherwise have can be the same transaction described two ways, so whether the parents' signature was voluntary depends on what you say the counterfactual was, and I have a nagging feeling that if you pick the baseline by asking what they were morally entitled to, the voluntariness condition either collapses into the other conditions or goes circular. I think it's Nozick who made this point about baselines in some essay on coercion, but don't quote him at me — I care about the structure of the problem.

  So: run Willowbrook through (1)-(4), one at a time, and tell me which of them the case actually turns on. My hunch is that the deception story is weaker than people assume and that voluntariness is doing all the work, but tell me if I'm wrong. Then the baseline problem: does Krugman's they-would-have-gotten-it-anyway move engage the consent question at all, or is it a harm argument wearing a consent argument's clothes? Then proxy consent: my framework is silent about the case where the person whose interests are at stake isn't the person signing, and I want to know whether that's a missing fifth condition or a different topic entirely — say which, and why. Finally, reverse the direction: what does this case show about the framework? Does it confirm it, embarrass it, or is it a case the framework was never built to handle — and if so, is the honest thing to say that the parents' consent was valid and the wrongness lay elsewhere? Say where the theory is silent instead of stretching it to cover everything. Finish with the single revision to my (1)-(4) that would buy me the most, and what it costs.
