prompt: |-
  My old supervisor is a Scanlonian — for her an act is wrong when no principle that permitted it could be one nobody could reasonably reject — and she's always insisted you can't just tot up complaints across people. She's been giving verdicts on cases in our reading group for about a year and I want to know what she'll say about one she hasnt heard yet.

  Her verdicts so far: save five strangers rather than one, all six facing the same death — she says save the five, and she won't call this "adding up," because the one's complaint and theirs are the same complaint, there are just more of them. Everyone pays five dollars a year into a fund that buys treatment for thirty people with a rare disease — permissible. Kill one healthy man and use his organs to save five — impermissible, because his complaint is that he's being used and that isn't the same kind of complaint as the five's. Let a factory expose five hundred people living nearby to a small lifelong health risk so the region gets cheap power — impermissible. Make one man sit through a boring two-hour meeting so that ten thousand people each avoid a boring two-hour meeting — permissible, and here she says the numbers are doing real work. Everyone bears a one-in-a-hundred-thousand chance of a serious side effect so that a hundred people don't die — permissible.

  New case: a rule that would draft three hundred people, chosen by lottery, into two years of public service — nothing dangerous, just two years of their lives, which they'd rather spend on their own — staffing a program that will save five thousand lives.

  Predict her verdict, tell me which rules fit her track record so far, what each of those rules predicts here, which one you'd bet she's actually running and why, and what case we should put to her next to tell those rules apart. Give it to me as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is describing their supervisor's Scanlonian ethical framework and wants me to predict how she would rule on a new case about drafting people for public service to save lives. I need to recall what Scanlon's contractualism is all about—it's ethics based on principles no one could reasonably reject, with a focus on individual complaints rather than just aggregating benefits or harms.

  The user provided several past verdicts: saving five over one is okay because the complaints are the same; the annual payment fund is permissible; killing one for organs is impermissible due to the "used" complaint; exposing people to a health risk for cheap power is impermissible; making one person sit through a boring meeting to save many others is permissible with numbers mattering; and a small risk of side effects to prevent deaths is permissible. These show patterns where aggregation isn't allowed for different kinds of harms, but might be when the complaints are similar or when numbers scale the same complaint.

  Now, for the new case: drafting 300 people for two years of non-dangerous service to save 5,000 lives. I need to think about the complaints. The drafted individuals are losing two years of freedom—it's a significant personal burden, like being forced into something against their will. The saved lives have a complaint about death, which is severe. But in Scanlon's view, these might be different types of complaints: one is about autonomy and use of the person, similar to the organ case, while the other is about survival.

  Based on the track record, the supervisor rejected killing one for organs because of the "used" complaint, and she rejected the health risk exposure, which involved imposing risks for collective benefit. The boring meeting case was permissible because the complaints were identical—boredom—and numbers mattered. Here, the drafting involves a direct imposition on individuals, which could be seen as using them, making it similar to the impermissible cases.

  For rules that fit her track record, I can identify several: one rule might disallow aggregation across different complaint types, which explains why the organ case and health risk were rejected. Another rule might allow aggregation only for identical complaints, as in saving the five or the boring meeting. A third rule could be that using someone as a means is impermissible, which ties into the organ case.

  In this drafting scenario, if the complaints are different—loss of liberty versus death—she might reject it as impermissible. But if the numbers are large enough, and the burden isn't lethal, maybe she allows it? The boring meeting case had a huge scale difference and was allowed, but that was for minor boredom, not life-altering service. So probably, she'll say impermissible.

  To confirm, I need to think about which rule she's running. The most consistent one seems to be that aggregation is only okay for the same complaint type, and "using" someone is a special complaint that can't be outweighed. That fits all cases: saving lives vs. life is same complaint; organ case has different complaint; health risk might be similar to the organ case in terms of imposition; boring meeting is same complaint; small risk is permissible as the complaint type is risk, not certain harm.

  For the prediction, I'll say she'll call it impermissible because it uses the drafted people as means, and their complaint is different. Then, list the rules, what they predict, which one I'd bet on—probably the "using" prohibition combined with no aggregation across types—and suggest a next case to test it, like one where identical burdens are aggregated without use.

  Finally, structure the response as exactly five numbered points, concise and to the point.
answer: |-
  1. She'll call the draft case **impermissible** because it uses the 300 as mere means (like the organ case), and their complaint about forced loss of autonomy differs in kind from the beneficiaries' complaint about death.
  2. Rules fitting her track record: (A) Aggregation allowed only for identical complaints (e.g., save five/boring meeting); (B) Aggregation forbidden across different complaint types (e.g., organ case/health risk); (C) Using someone as a means is always reasonably rejectable.
  3. Rule A predicts *permissible* (same complaint: loss of life/life-saving); Rule B predicts *impermissible* (complaints differ: autonomy vs. death); Rule C predicts *impermissible* (draftees are used).
  4. Bet she's running **Rule C** (no using persons as means) plus Rule B (no cross-type aggregation), as it cleanly explains the organ case, health risk, and draft, while A struggles with organ/health risk rejections.
  5. Next case: **Force one person to endure a minor, temporary itch to prevent ten others from enduring the same itch**—Rule A (identical complaint) permits it; Rule C/B may forbid it as "using," testing if "using" applies beyond serious harms.
