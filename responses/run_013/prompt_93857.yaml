prompt: |-
  My two housemates Nadia and Oscar got into a genuinely nasty argument in our group chat last week about the large worlds / evidential cooperation thing, and since I'm the one who got both of them into the rationalist blogs in the first place I've been drafted as referee. Which I'm not qualified for, so I'm outsourcing to you.

  Quick recap of what they were actually fighting about, in case it isn't obvious: if the world is big enough — many copies of you, simulators running your source code, lots of agents instantiated from decision procedures like yours — then you can get "cooperation" with people you'll never meet and can't causally affect, because your action is evidence about what they'll do rather than a cause of it. Standard test case: one-shot prisoner's dilemma against a stranger, no repeat, no reputation, no causal channel. Causal decision theory says defect. The evidential / large-world view says that in a big enough world, if there are enough other agents whose choice is tied to yours by a shared decision procedure, cooperating can be right, because your defection is a sample of the whole class of you.

  Oscar thinks the whole thing is wishful thinking in a lab coat. Nadia thinks Oscar is refusing to follow the logic where it goes. Here's how it went, near as I can reconstruct it:

  1) Nadia: in a big enough world the thing that gets instantiated isn't you, it's your policy. If a bunch of agents out there are running something like my procedure, then my defecting isn't one defection, it's a sample from a policy that shows up many times over, and summed across that class, cooperating beats defecting. So cooperating in a one-shot PD isn't saintliness, it's prudence for the class I'm a member of.

  2) Oscar: that only works if the correlation is strong, and a large world makes it weaker, not stronger — for every agent running my procedure there are astronomically many who aren't, and the stranger across the table is probably not a cousin of my code. And if the world is that big, there's probably some agent out there whose payoffs are anti-correlated with mine and who profits when I cooperate. Worse, any agent who can predict or simulate me can now count on my cooperation, which turns my policy into a public resource that I pay for. "I cooperate because somewhere a copy of me is being nice to someone" is a great way to get farmed.

  3) Nadia: you're running together evidence and control. Simulating me doesn't let anyone make me cooperate — it just means there's another instance of me, and it'll do what I do. And I'm not cooperating because of what my copies get up to; I'm cooperating because defecting makes the world contain more defection by me, and the payoffs of those instances are the payoffs at stake. If your fix is to be unpredictable so nobody can farm you, you're choosing to be a worse cooperator in every actual coordination problem in order to dodge a hypothetical farmer.

  4) Oscar: fine, here's the strong version, and I think it kills it. First, sharing a procedure doesn't mean sharing an action — if the counterpart faces even a slightly different game or has slightly different information, the link to my choice evaporates, and in a messy big world most near-copies are near-copies facing different games. Second, your principle has no stopping rule. Suppose a hostile agent arranges for copies of me to face a game where my cooperating pays them. Do I now owe them cooperation? You'll say only genuine procedure-sharing counts — but that's exactly what they manufactured. Third, your view makes my cooperation depend on facts about the multiverse I can't check, so a well-crafted threat ("we have your code and our payoff tracks your choice") extracts cooperation from me under your principle, whereas under mine I just don't cooperate.

  5) Nadia: the stopping rule is the counterfactual, not the resemblance. What binds me is that my action and the counterpart's come out of the same computation, so whatever I do is what happens in that slot — defecting buys nothing there. Someone announcing they're running me doesn't change my computation, it just adds an agent betting on it. And the near-copy point doesn't refute the principle, it just means I weigh how much of the link survives, which is what any decision under uncertainty looks like.

  They're still not speaking. Go through the exchange move by move: for each numbered move, say whether it's clearly wrong, shaky, basically fine, or clearly right, and why — and say what each of them is missing that neither has said. Then tell me who has the better of it overall. If you think the two of them are actually answering different questions and there's no single winner, say that instead of forcing one. No citations or reading lists needed, I want the arguments themselves.
reasoning: |-
  Okay, let me approach this step by step. The user wants me to analyze a philosophical debate between their housemates about decision theory in large worlds, specifically regarding one-shot prisoner's dilemma scenarios. 

  First, I need to understand the core disagreement. Nadia argues from an evidential cooperation perspective - that in a large world with many similar agents, cooperating is rational because your action reflects what other instances of your decision procedure would do. Oscar counters that this approach is flawed because correlation weakens in large worlds, creates vulnerability to exploitation, and lacks clear boundaries.

  Looking at their exchange point by point:
  For Nadia's first point about policies in large worlds, I find it logically sound but practically limited. The core insight is correct - if many agents share your decision procedure, your choice provides evidence about theirs. However, she underestimates implementation challenges.

  Oscar's first rebuttal raises valid concerns about correlation dilution and farming risks in sufficiently large worlds. His point about anti-correlated payoffs is particularly strong - in infinite multiverses, there might always be entities benefiting from your cooperation in ways that don't benefit you.

  Nadia's distinction between evidence and control is crucial and correct. She properly separates the evidential nature of the decision from causal control. But her dismissal of farming risks feels too optimistic given Oscar's valid concerns.

  Oscar's "strong version" makes three powerful arguments: the fragility of shared procedures across contexts, the no-stopping-rule problem, and vulnerability to threats. These aren't fully resolved by Nadia's counterarguments. The procedural resemblance issue seems especially damaging to practical implementation.

  Nadia's final response about counterfactuals doesn't adequately address Oscar's points. While conceptually elegant, it doesn't solve the boundary problem of what counts as "same computation" or how to handle manufactured resemblances.

  Overall, I notice Oscar focuses on practical vulnerabilities while Nadia maintains theoretical purity. Neither addresses how to bound the "similar procedure" concept or how to handle value misalignment among copies. The debate reveals that evidential cooperation requires not just large worlds but also value-aligned agents with recognizable shared procedures - conditions that may not hold in reality.

  The user seems caught in the middle, wanting clarity without academic jargon. They need help seeing why both perspectives have merit but also limitations. The key insight might be that large-world cooperation works best in constrained, value-aligned reference classes - not universally.
answer: |-
  Here's a move-by-move analysis of the argument, highlighting strengths, weaknesses, and what each is missing, followed by the overall verdict:

  **Move 1: Nadia (Evidential Cooperation Core)**
  *   **Verdict:** **Basically Fine (but incomplete)**
  *   **Why:** She correctly states the core evidential cooperation argument: in a large world with many agents using similar decision procedures, your action is evidence about the actions of others in your reference class. Maximizing expected utility requires considering the correlated consequences for *all* instances of "your policy," not just your local payoff. Cooperating in a one-shot PD *can* be the prudent choice for the class.
  *   **What's Missing:** She glosses over the critical challenges of defining the relevant "reference class" (who counts as "running something like my procedure"?) and how to robustly estimate the strength of correlation ("how much of the link survives") in a messy, large world. She assumes the correlation is strong and beneficial enough to dominate.

  **Move 2: Oscar (Correlation Dilution & Exploitation Risk)**
  *   **Verdict:** **Shaky to Basically Fine (strong on practical risks)**
  *   **Why:** He raises valid practical objections:
      *   **Correlation Dilution:** In a truly vast world, the proportion of agents using *your exact* procedure might be minuscule. If the stranger isn't correlated with you, evidential reasoning loses force. (Shaky: The argument *depends* on the existence of correlated agents; "astronomically many who aren't" doesn't directly refute the impact if correlated agents *do* exist).
      *   **Anti-Correlation & Farming:** This is stronger. If adversaries can predict/simulate your cooperative policy, they *can* exploit it ("farming"). Announcing a cooperative policy *does* make you vulnerable to agents who set up situations where your cooperation benefits them at your expense. "I cooperate because of copies" *can* be exploited.
  *   **What's Missing:** He conflates "simulating me" (which just creates another correlated instance) with "farming" (which is an adversarial setup *exploiting* the predictability). He doesn't address Nadia's core point that *if* strong beneficial correlation exists, cooperation is rational, even if exploitative setups *also* exist.

  **Move 3: Nadia (Evidence vs. Control & Cost of Unpredictability)**
  *   **Verdict:** **Clearly Right (on distinction), Shaky (on cost)**
  *   **Why:**
      *   **Evidence vs. Control:** She is **clearly right** here. Simulating her doesn't grant *control*; it just means there's another instance whose action is correlated with hers. Her cooperation is driven by the evidence *her action provides* about correlated instances' actions and their payoffs, not by what copies "get up to" as a distinct cause.
      *   **Cost of Unpredictability:** Her point that being unpredictable to avoid farming makes you worse at *actual* beneficial cooperation is valid. However, it's **shaky** as a dismissal because it downplays the potential severity of the farming risk Oscar described. The cost of vulnerability might outweigh the benefit of cooperation in some scenarios.
  *   **What's Missing:** She still hasn't provided a robust method to define the reference class or handle the dilution/anti-correlation risks Oscar raised. She correctly separates evidence/control but doesn't fully address the *consequences* of predictable correlation in an adversarial world.

  **Move 4: Oscar (Strong Objections: Fragility, No Stopping Rule, Hostile Multiverse)**
  *   **Verdict:** **Shaky (Fragility), Clearly Right (No Stopping Rule), Basically Fine (Hostile Multiverse)**
  *   **Why:**
      *   **Fragility of Shared Procedure:** **Shaky.** While minor differences *can* break perfect correlation, the evidential argument doesn't require *perfect* copying, just *sufficient* similarity/resemblance in decision-making under similar-enough circumstances. How much difference breaks the link is the hard part, but it doesn't "evaporate" at the first difference.
      *   **No Stopping Rule / Manufactured Resemblance:** **Clearly Right.** This is Oscar's strongest point. If a hostile agent manufactures copies/simulations that *resemble* your decision procedure facing a game rigged to reward *them* for your cooperation, does your principle compel you to cooperate? Nadia's principle lacks a clear boundary to prevent this. Defining "genuine procedure-sharing" robustly against adversarial mimicry is extremely difficult, if not impossible. This creates a critical vulnerability.
      *   **Hostile Multiverse & Uncheckable Facts:** **Basically Fine.** If cooperation depends on unverifiable facts about the multiverse (like the existence and payoffs of correlated agents), it *does* make you vulnerable to well-crafted threats or extortion ("cooperate or we simulate tortured copies of you"). Causal decision theory (CDT) is immune to this.
  *   **What's Missing:** He doesn't engage deeply with the *normative core* of Nadia's argument – that if beneficial correlation genuinely exists, ignoring it seems irrational. His points are powerful practical objections but don't directly refute the underlying logic *in idealized conditions*.

  **Move 5: Nadia (Counterfactual Stopping Rule & Weighing the Link)**
  *   **Verdict:** **Shaky**
  *   **Why:**
      *   **Counterfactual Stopping Rule:** She tries to define the binding factor as "same computation" determining the action "in that slot." This attempts to ground the reference class in the specific decision process/counterfactual dependency. **However, it's shaky.** In a large world with manufactured copies, adversarial simulators *are* creating agents whose action in *their* slot *is* determined by running something functionally equivalent to "your computation." Her criterion doesn't clearly exclude them.
      *   **Weighing the Link:** Acknowledging that correlation isn't all-or-nothing and needs weighing under uncertainty is correct *in principle*. **But it's shaky in practice:** How does an agent actually *do* this weighing robustly? How much resemblance is needed? How does she propose to counter the manufactured resemblance/extortion threat? She doesn't provide a workable method.
  *   **What's Missing:** A concrete, defensible, and non-exploitable way to implement the "same computation" criterion or the "weighing" process that addresses Oscar's manufacturing/extortion scenario. She correctly identifies uncertainty but offers no solution to the fundamental vulnerability.

  **Overall Verdict: Oscar has the better of the practical argument, but they are emphasizing different aspects.**

  *   **Nadia's Core Logic:** Her underlying point – that *if* you are in a large world with many correlated agents sharing your values and facing similar dilemmas, and *if* you can reliably identify them, then evidential reasoning *can* make cooperation rational in a one-shot PD (or similar dilemmas) – is **logically sound** in highly idealized scenarios. The core insight of evidence over causation in large worlds isn't "wishful thinking"; it points to a potential flaw in CDT.
  *   **Oscar's Practical Dominance:** However, Oscar devastatingly exposes the **fatal practical weaknesses** of trying to apply this in any remotely realistic "messy big world":
      1.  **Reference Class Problem:** Defining "same computation" or "sufficiently similar procedure" robustly is incredibly difficult, especially across diverse contexts.
      2.  **Adversarial Exploitation (Farming/Extortion):** Announcing or having a predictable cooperative policy based on evidential reasoning makes you a target. Hostile agents *can* manufacture resemblance or threats based on uncheckable multiverse facts to extract cooperation from you against your local interests. Nadia's principle lacks a defense against this.
      3.  **Correlation Strength & Dilution:** In a vast, diverse universe, the beneficial correlation Nadia relies on might be weak, swamped by noise, or even negatively exploited, making the expected payoff calculation fragile or negative.
      4.  **Implementation/Knowledge:** Agents lack the knowledge required (strength of correlation, scope of reference class, absence of hostile mimics) to confidently apply the principle.

  **Who has the better of it?** **Oscar wins on practical grounds.** While Nadia identifies a theoretical possibility where CDT fails, Oscar successfully argues that implementing her solution in any non-idealized, large world is fraught with insurmountable practical difficulties, vulnerabilities to exploitation, and potentially disastrous consequences. The risks and uncertainties he highlights outweigh the potential benefits of applying evidential cooperation broadly.

  **What both are missing that neither said:**
  1.  **Value Alignment:** Both implicitly assume that correlated agents share your *values* (i.e., they also want to maximize similar payoffs). What if "copies" or similar procedures have different utility functions? Cooperating with a correlated agent who has inverted payoffs would be disastrous. The argument relies on correlation *plus* value alignment.
  2.  **The Problem of "Me":** The evidential view subtly shifts the object of concern from the individual ("me") to the reference class ("copies/instances of my policy"). Oscar is intuitively defending the individual's local interests against subsumption into a class vulnerable to external manipulation. Nadia argues the individual's *rational* interest *is* tied to the class. This fundamental disagreement about the locus of agency and value in large worlds is unresolved.
  3.  **Robustness vs. Optimality:** Nadia argues for what *could* be optimal under perfect conditions. Oscar argues for what is *robust* under adversarial or uncertain conditions. Neither fully concedes the validity of the other's priority.
