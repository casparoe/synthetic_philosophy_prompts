answer: |-
  ## Internal Style Guide: Statements That Do Things  
  *(Section 1: Foundational Editorial Policy)*

  1.  **The "Hereby" Litmus Test:** Apply the adverb "hereby" immediately before the operative verb in any draft statement purporting to *do* something (e.g., apologize, resign, promise, appoint). If the resultant sentence sounds tautological or nonsensical ("I hereby describe the accident"), the statement merely reports and *does nothing*. Revise until "hereby" fits naturally ("I hereby resign," "We hereby apologize"). Prefer the active indicative.

  2.  **Standing is Non-Negotiable:** The individual uttering the statement must possess the recognized authority to perform the specific act. A junior analyst cannot "hereby appoint" a CEO. A spokesperson cannot "hereby resign" on behalf of another. Verify the speaker's institutional position permits the act *before* drafting. If standing is absent, the statement fails as an act, regardless of wording or intent. Recommend: "The Board hereby announces the resignation of [Name]" or similar constructions placing the act with the correct authority.

  3.  **Conventional Procedures Prevail:** An utterance performs an act only within established institutional or social frameworks. Drafting an apology requires a recognized context for accepting apologies. Attempting to "hereby forgive" a debt lacks force unless a specific, binding debt-forgiveness procedure exists within the relevant contract or law. Research the applicable conventions *first*. If no such convention exists for the desired act (e.g., "hereby absolve," "hereby sanctify"), abandon the performative construction; the statement can only *describe* an intention or feeling.

  4.  **Sincerity is Not Validity:** Whether the speaker *means* the words (feels regret, intends to keep a promise) is irrelevant to the *successful performance* of the act. An insincere "I hereby promise" still creates a promise. An unmeant "I hereby apologize" still constitutes an apology. Editorial concern lies solely with whether the utterance *completed* the act within the rules (1, 2, 3). Internal state is not a drafting variable; focus on external felicity.

  5.  **Distinguish Act from Consequence:** The act performed *in saying* the words (the apology *made*, the promise *given*) is distinct from its subsequent effects (forgiveness *granted*, trust *gained*, outrage *provoked*). A perfectly executed apology ("We hereby apologize unreservedly") *is* the apology, even if the audience remains furious. Do not conflate the performative success with the audience's reaction. Draft solely to ensure the act itself is cleanly executed; managing consequences falls under separate communications strategy.

  6.  **Quotation Nullifies Performance:** A performative utterance achieves its effect only when uttered directly by the authorized party in the appropriate context. When such an utterance is placed within quotation marks, read aloud from a script by an actor, or embedded within fiction ("In the play, the CEO said, 'I hereby resign'"), it describes an act but *does not perform it*. The actor does not resign; the fictional CEO is not bound. For ceremonial readings or illustrative purposes, use descriptive language ("The script includes the resignation declaration") or clearly signal the derivative nature ("The actor will deliver the apology text").

  7.  **Address Voids and Defects Proactively:** If Rule 2 (Standing) or Rule 3 (Convention) cannot be satisfied, the performative construction is void. Do not draft statements feigning the act. Instead:
      *   For lacking standing: Shift the act to the correct authority (see Rule 2 example) or use descriptive language ("expresses regret," "acknowledges error").
      *   For lacking convention: Describe the sentiment or intention ("wishes to convey sorrow," "expresses a hope for resolution," "intends to pursue X"). Avoid pseudo-performatives like "We stand with..." unless a concrete, binding act of "standing" is demonstrably achievable through the utterance itself under known rules.

  **Bottom Line:** If saying it doesn't make it so under the prevailing rules, don't say it *as if* it does. **No exceptions.**
