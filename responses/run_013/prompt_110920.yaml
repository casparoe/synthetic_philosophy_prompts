  But note: without the past 24,000 miles, the flight would not yield the status. So the past miles are necessary. However, they are sunk and do not affect the marginal analysis of this flight. The analysis only requires that the flight will get you to 25,000 miles, which is a fact about the current state, not about the sunk cost per se.

  I think I have to conclude that in a deterministic world with no externalities, no signaling, no reputation, and no psychological factors, the sunk cost is always irrelevant. The only way to make it relevant is to have it affect future costs or benefits, which is disallowed by the problem's constraint.

  Perhaps the problem is impossible. But let's not give up.

  Final try: a case where the past expenditure changes the physical state in a way that affects future costs or benefits, but without providing information.

  **Scenario: The Partially Built Bridge**
  You are building a bridge. You have already spent $1 million on it, and the bridge is half-built. If you leave it half-built, it will be a hazard and the government will fine you $1.5 million. To complete the bridge, it will cost an additional $1 million, and the completed bridge will then sell for $1.8 million. If you do nothing, you get fined. You have to choose between completing or abandoning.

  - **Option 1: Abandon**
    - Sunk cost: $1 million.
    - Fine: $1.5 million.
    - Total loss: $2.5 million.

  - **Option 2: Complete**
    - Sunk cost: $1 million.
    - Additional cost: $1 million.
    - Revenue: $1.8 million.
    - Avoid the fine: $1.5 million (because you complete and it's not a hazard).
    - Net: -1 -1 +1.8 +1.5 = $1.3 million gain? Let's calculate:
