    - Health benefit: $100.
    - Disutility: -$50.
    - Avoidance of waste feeling: $950.
    - Net: -1000 + 100 - 50 + 950 = $0.

  So you are indifferent. But the waste avoidance is directly about the sunk cost. And the problem forbids including an unexplained "waste aversion" preference.

  The challenge is very hard.

