  ### Thought Experiment: The Gallery Exhibition Commitment

  You are an artist who has spent two years creating a series of paintings for a solo exhibition at a prestigious gallery. The gallery requires the exhibition to proceed as scheduled in one month or you must pay a $20,000 penalty for breach of contract (due to their lost bookings and promotional costs). Completing the final preparations—varnishing, framing, and minor touch-ups—requires $5,000 in materials and 100 hours of your labor, which you value at $10,000. The exhibition will generate $30,000 in guaranteed sales from pre-committed buyers. However, a lucrative freelance design offer has just emerged that would pay $15,000 for the same 100 hours of work. If you abandon the exhibition, you lose the sales, pay the penalty, and can take the freelance job. If you proceed, you forgo the freelance opportunity but gain the sales. The penalty clause was triggered solely by your past investment of time in the paintings, as the gallery’s costs arose from marketing your specific body of work. There is no informational link between your past effort and future success (the sales are guaranteed), and the penalty exists only because you signed the contract after investing the two years.

  ---

  ### Demonstration

  **Agent's Options:**
  - **Option A (Proceed with exhibition):** Pay $5,000 for materials, invest 100 hours (valued at $10,000), gain $30,000 in sales. Net outcome: $30,000 - $5,000 - $10,000 = $15,000.
  - **Option B (Abandon exhibition):** Pay $20,000 penalty, take freelance job for $15,000. Net outcome: $15,000 - $20,000 = -$5,000.

  **Straightforward Expected-Value Maximizer's View:**
  - Evaluates only future marginal costs and benefits:
    - Marginal benefit of Option A: $30,000 (sales).
    - Marginal cost of Option A: $5,000 (materials) + $10,000 (labor opportunity cost) = $15,000.
    - Net marginal gain for A: $30,000 - $15,000 = $15,000.
    - Marginal benefit of Option B: $15,000 (freelance pay).
    - Marginal cost of Option B: $20,000 (penalty).
    - Net marginal gain for B: $15,000 - $20,000 = -$5,000.
  - Verdict: Proceed with exhibition (Option A), as it yields $15,000 versus -$5,000. The sunk cost (two years of labor) is ignored, as only future flows matter.

  **Why Honoring the Sunk Cost Is Rationally Required:**
  - The expected-value maximizer correctly chooses Option A, but this choice *only exists* because of the sunk cost. The $20,000 penalty is a future cost that arises *solely* as a consequence of the past investment: the gallery imposed the penalty clause because you committed to the exhibition after spending two years on the paintings. Without this sunk cost, there would be no penalty (and thus no reason to prefer A). Crucially, honoring the sunk cost is rationally required because:
    1. **The penalty is a direct, non-informational causal outcome of the sunk cost.** The past labor created the paintings, which bound you to the contract and its penalty. It is not a signal (e.g., it doesn’t indicate future risks), but a contractual liability triggered by the existence of the sunk investment.
    2. **Ignoring the sunk cost leads to a dominated outcome only if the penalty is considered.** Option B yields -$5,000, but if the maximizer treats the penalty as irrelevant (since it arises from the past), they might incorrectly see B as superior: without the penalty, B would yield $15,000 from freelancing, versus A’s $15,000. This would make A and B appear indifferent, potentially justifying abandonment. Yet this is irrational, as the penalty is unavoidable and real.
    3. **The sunk cost here is normatively decisive because it creates the penalty liability.** The $20,000 is a future cost, but it is causally and uniquely tied to the sunk investment. Thus, the past expenditure does "genuine normative work" by defining the structure of future costs: rejecting it would leave the penalty unaccounted for, violating coherence in expected-value reasoning.

  **Why the Maximizer’s Verdict Is Wrong Here:**
  - The maximizer gets the right choice (Option A) but for an incomplete reason. They treat the penalty as a marginal future cost, but they fail to recognize that it is *ontologically dependent* on the sunk cost. If the penalty were ignored (as an "irrational" artifact of the past), Option B would seem viable, leading to a -$5,000 loss. This violates expected-value maximization, as $15,000 (A) > -$5,000 (B). The sunk cost is essential to explain *why* the penalty exists and why B is inferior. Thus, the maximizer’s approach is wrong because it implicitly relies on the sunk cost to define the scenario (like the penalty’s existence) but then discards it, creating a blind spot. Only by honoring the sunk cost as the source of the penalty can the agent consistently avoid a dominated outcome.

  ---

  ### Critical Feature and Its Removal
  **Feature Doing the Work:** The sunk cost (two years of labor) created a binding contractual obligation (the penalty) that persists into the future. This penalty is a *direct, non-informational consequence* of the past investment—it exists purely because the sunk cost occurred, not because it signals anything about the exhibition’s viability.

  **Removing the Feature:** If the penalty clause were *not* triggered by the sunk cost (e.g., a flat $20,000 fee for any cancellation, regardless of past work), the sunk cost would become irrelevant. In this modified case:
  - Option A: $30,000 - $5,000 - $10,000 = $15,000.
  - Option B: $15,000 (freelance) - $20,000 (penalty) = -$5,000.
  - The textbook verdict holds: proceed (A) based on marginal flows, as the penalty is a fixed future cost. Honoring the sunk cost would be a fallacy, as it doesn’t affect outcomes.

  ---

  ### Textbook Defender’s Objection
  **Strongest Attack:** "The penalty is a future cost, not a sunk cost. It should be included in marginal analysis as a consequence of abandoning the project, but the sunk cost itself remains irrelevant. The agent only cares about the $20,000 because it is a future liability, not because of the past labor. Redescribe the case without referencing the sunk cost: the agent faces a choice where one option incurs a $20,000 contractual penalty. This penalty is a state-contingent future cost, like any other, and the past is causally inert. Expected-value maximization captures this perfectly without invoking sunk costs."

  **Rebuttal to Objection:** While the penalty is a future cost, it is *ontologically dependent* on the sunk cost—it wouldn’t exist without the past investment. The defender’s redescription ignores that the penalty clause was activated by the sunk cost (the gallery’s contract was for *this* exhibition, premised on *completed* work). Thus, the sunk cost isn’t just "background"; it defines the penalty’s existence. Omitting it makes the penalty seem arbitrary, but in reality, it’s a direct result of the past expenditure. A full expected-value account must include all future costs, but here, the sunk cost is the *reason* those costs exist. It plays a unique normative role by creating the context for the penalty, making it irreducible to pure future flows.

  ---

  ### Conclusion: Textbook Rule False or Too Crude?
  **The case shows the textbook rule is stated too crudely.** The rule ("ignore sunk costs") is pragmatically useful but incomplete. It assumes a sharp divide between past and future, but in real-world commitments (contracts, penalties, or obligations triggered by past actions), sunk costs can create future liabilities that are normatively decisive. Here, the sunk cost is rationally honored not as information or "waste aversion," but because it structurally enables a future cost (the penalty) that would otherwise not exist. The textbook rule should be refined to: "Ignore sunk costs *unless* they generate inescapable future costs or benefits that are causally dependent on the past expenditure itself." This preserves the core insight while accounting for entanglement between past investments and future outcomes.
