  This seems positive. But let's do it step by step:

  - If you abandon, your net position: -$1 million (sunk) - $1.5 million (fine) = -$2.5 million.
  - If you complete, your net position: -$1 million (sunk) - $1 million (additional) + $1.8 million (revenue) = -$0.2 million, but then you avoid the fine of $1.5 million, so how to account for that? 

  Actually, the fine is only imposed if you abandon. If you complete, there is no fine. So for completing:

  - Costs: $1 million sunk + $1 million additional = $2 million.
  - Revenue: $1.8 million.
  - No fine.
  - Net: $1.8 million - $2 million = -$0.2 million.

  Compared to abandonment (net -$2.5 million), completing is better by $2.3 million. 

  Textbook marginal analysis of the additional investment:

