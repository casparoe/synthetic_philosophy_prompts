  **Scenario: The Tight Budget**
  You have a total wealth of $100,000. You have already spent $90,000 on a non-refundable investment. Now, to complete the investment and get any return, you must invest an additional $20,000. If you complete, you will get back $110,000. If you don't, you get $0. You have only $10,000 left in cash. You can borrow the extra $10,000 at a cost of $5,000 in interest and fees. 

