  You are a frequent flyer. You have flown 24,000 miles this year. If you fly 25,000 miles within the year, you will earn gold status, which is worth $2,000 to you. You have a flight opportunity that costs $ in ticket price and time disutility that you value at $1,500. The flight is 1,000 miles. If you do not take this flight, you will not reach the threshold and you will earn no status. You have no other flights planned.

