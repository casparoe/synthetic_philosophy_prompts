  **Scenario: The Book Publication**
  You have spent 5 years writing a book. You have a publishing contract that requires you to deliver the manuscript by a deadline in one month. If you deliver, the publisher will pay you $10,000 and the book will be published. If you fail to deliver, you must return a $5,000 advance (which you have already spent) and pay a $5,000 penalty. You estimate that completing the book in one month will require intense effort that you value at $12,000 (in terms of opportunity cost of your time). 

  Options:
  - **Option 1: Abandon (do not deliver)**
    - You must return the $5,000 advance (which you already spent, so you have to come up with it) and pay $5,000 penalty -> total cash outflow: $10,000.
    - You avoid the effort cost of $12,000.
    - So net: -$10,000 (cash) + $0 (effort saved) = -$10,000.

  - **Option 2: Complete and deliver**
    - You get paid $10,000.
    - But you incur effort cost of $12,000.
    - You don't have to return the advance or pay penalty.
    - Net: $10,000 - $12,000 = -$2,000.

  So completing leads to -$2,000, while abandoning leads to -$10,000. Therefore, completing is better.

  But let's do textbook marginal analysis:

  - If you complete, you get $10,000 and pay $12,000 effort -> net -$2,000.
  - If you abandon, you pay $10,000 (in cash) and $0 effort -> net -$10,000.
  - The marginal benefit of completing over abandoning: (-$2,000) - (-$10,000) = +$8,000.
