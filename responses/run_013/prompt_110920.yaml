  - So marginal benefit: $1.5 million (fine avoidance) + $1.8 million (revenue) = $3.3 million.
  - Marginal cost: $1 million.
  - Net marginal gain: $2.3 million.

  So completing is better, and the sunk cost is not used.

  The only way the sunk cost appears is in the fine: the fine is because you have a half-built bridge. The half-built bridge is the result of the sunk cost. But the decision to complete is based on the future costs and benefits, including the fine.

  This is still using the sunk cost as a state variable that affects future costs.

  The problem allows this if it is not as information about the future but as a physical state. However, the constraint says: "not because the past expenditure happens to carry information about the future". In this case, the past expenditure has created a physical object (half-built bridge) that triggers the fine. So the past expenditure has changed the world, and we must account for the current state.

  The textbook marginal analysis does account for the current state. The sunk cost itself is not used, but the state it created is. So this might be acceptable, but it's not the sunk cost doing work; it's the current state.

