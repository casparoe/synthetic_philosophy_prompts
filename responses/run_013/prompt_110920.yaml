prompt: |-
  I've been reading around the rationality literature for a seminar, and I keep running into the same tidy line — sunk costs are sunk, only marginal costs and benefits matter, anyone who "throws good money after bad" is committing a fallacy — and I've started to suspect the tidiness is hiding something. What I want from you is a case built to order rather than an illustration: construct a thought experiment in which honoring a sunk cost is the rationally required choice, and in which this is not because the past expenditure happens to carry information about the future (I know that move, and it feels like cheating — it makes the sunk cost relevant only as a proxy for something else, which concedes the textbook point). The relevance of the past investment has to be doing genuine normative work of its own, and it has to do so within a framework an ordinary expected-value reasoner would accept, not by smuggling in a primitive "waste aversion" or an unexplained duty of consistency.

  Constraints, and please take them seriously because the whole value of the exercise is in the joint satisfiability: the scenario should be one a normal adult could actually face (a career, a relationship, a renovation, a research program — not a lottery or a science-fictional setup); it should fit in a single paragraph; and it must isolate a single variable, so that if you flip that one feature the textbook verdict returns and honoring the cost becomes a mistake. No appeals to irrational preferences, no assuming the agent is mistaken about the facts, and no assuming the future is somehow caused by the past. After the scenario, do the full demonstration: state the agent's options, walk through what a straightforward expected-value maximizer says and what your case says, and show precisely why the maximizer's verdict is wrong here rather than merely incomplete. Then tell me which feature of the case is doing the work, what happens to the case when that feature is removed, and how a defender of the textbook line would attack the case — I want to see the strongest version of the objection that the sunk cost is still, strictly speaking, irrelevant and that whatever is doing the work could be redescribed without it. Finish by saying whether you think the case shows the textbook rule is false, or only that it is stated too crudely.
reasoning: |-
  We are to design a thought experiment where honoring a sunk cost is rationally required, without relying on the sunk cost as a proxy for information about the future. The scenario must be realistic, fit in a paragraph, and have a single variable that flips the verdict. We must also avoid appeals to irrationality, false beliefs, or causation from past to future.

  After careful thought, I propose the following scenario:

  **Scenario: The Renovation Dilemma**
  You are renovating your home and have already spent $50,000 on a custom-designed kitchen. The project is half-finished. Now, you discover that due to an unexpected structural issue, completing the kitchen will cost an additional $60,000 instead of the originally planned $50,000. The market value of your home with a completed kitchen would be $120,000 more than its current value. However, if you abandon the project, the half-finished kitchen will reduce your home's value by $20,000 compared to its pre-renovation state. You have no emotional attachment to the kitchen and are purely financially motivated. You must decide whether to abandon the project or pay the extra $60,000 to complete it.

  Now, let's break down the options for the agent (you):

  - **Option 1: Abandon the project**
    - You lose the sunk cost of $50,000.
    - The half-finished kitchen reduces your home's value by $20,000 (relative to pre-renovation).
    - So, total loss: $50,000 (sunk) + $20,000 (devaluation) = $70,000.

  - **Option 2: Complete the project**
    - You have already spent $50,000 (sunk).
    - You spend an additional $60,000.
    - The completed kitchen increases your home's value by $120,000 (relative to pre-renovation).
    - So, net gain from the additional investment: $120,000 - $60,000 = $60,000.
    - Relative to pre-renovation, you have spent $50,000 + $60,000 = $110,000 and gained $120,000 in home value, so net gain = $10,000.

  But note: the textbook approach would ignore the sunk cost and only consider the marginal costs and benefits of the next step.

  - **Textbook (Marginal) Analysis:**
    - If you complete the project, you pay $60,000 and get a home value increase of $120,000 (relative to pre-renovation). However, we must consider the counterfactual: if you abandon, your home value is $20,000 below pre-renovation. Therefore, the marginal benefit of completing versus abandoning is the difference between having $120,000 above and having $20,000 below: that is, $120,000 - (-$20,000) = $140,000. The marginal cost is $60,000. So net marginal gain = $140,000 - $60,000 = $80,000. This seems to strongly favor completing.

  Wait, that doesn't show honoring the sunk cost. In fact, the textbook analysis says to complete because the marginal benefit exceeds the marginal cost. But note: the agent might think that abandoning would save them the $60,000 and avoid the extra cost. However, the marginal analysis shows that the extra cost is worth it.

  But the challenge is to show a scenario where honoring the sunk cost (i.e., continuing because of the past investment) is required. In the above, the textbook analysis also says to complete. So we haven't yet created a conflict.

  Let me adjust the numbers to create a conflict:

  Revised scenario:

  You have spent $50,000 and the project is half-finished. Now, the remaining cost is $70,000 (instead of $60,000). The completed kitchen would add $120,000 to home value (relative to pre-renovation). Abandoning would cause a $20,000 devaluation (relative to pre-renovation).

  Now:

  - **Option 1: Abandon**
    - Sunk: $50,000
    - Devaluation: $20,000
    - Total loss: $70,000

  - **Option 2: Complete**
    - Sunk: $50,000
    - Additional cost: $70,000
    - Home value increase: $120,000 (relative to pre-renovation)
    - So, net: $120,000 - ($50,000+$70,000) = $120,000 - $120,000 = $0 (break-even relative to pre-renovation)

  Textbook marginal analysis:

  - If you complete, you get a home value of pre-renovation value + $120,000.
  - If you abandon, you get pre-renovation value - $20,000.
  - So the marginal benefit of completing (over abandoning) is $120,000 - (-$20,000) = $140,000.
  - The marginal cost is $70,000.
  - Net marginal gain: $140,000 - $70,000 = $70,000.

  Still, the textbook says complete.

  We need the marginal analysis to say abandon but the overall outcome to be better if we complete? Or we need a scenario where the marginal analysis says abandon but honoring the sunk cost (by completing) is better? And we want that without the sunk cost being a proxy.

  But note: in the above, the textbook always says complete because the marginal benefit is so high. So let's change the devaluation if abandoned.

  Alternative: if abandoned, the half-finished kitchen causes a devaluation of only $10,000? But that would make the marginal benefit even higher.

  We need the marginal analysis to be negative. Let me set:

  - Pre-renovation home value: V.
  - After completion: V + $100,000.
  - If abandoned: V - $30,000 (because a half-finished kitchen is an eyesore and requires removal).
  - Sunk cost: $50,000.
  - Remaining cost: $90,000.

  Now:

  **Option 1: Abandon**
    - Sunk: $50,000
    - Home value: V - $30,000
    - So relative to pre-renovation: loss of $50,000 in cash and $30,000 in home value -> total loss of $80,000.

  **Option 2: Complete**
    - Sunk: $50,000
    - Additional: $90,000
    - Home value: V + $100,000
    - Relative to pre-renovation: spent $140,000 and gained $100,000 in home value -> net loss of $40,000.

  Now, textbook marginal analysis:

  - Marginal benefit of completing (vs abandoning): 
    - Home value with completion: V+100,000
    - Home value with abandon: V-30,000
    - Difference: +130,000
  - Marginal cost: $90,000
  - Net marginal gain: 130,000 - 90,000 = $40,000.

  So the marginal analysis says: complete (because you gain $40,000 in net marginal terms). But note that in overall terms, completing leads to a net loss of $40,000 relative to pre-renovation, while abandoning leads to a net loss of $80,000. So completing is better. Still, the textbook rule says complete and it is the right choice.

  We need a case where the marginal analysis says abandon, but if we honor the sunk cost (and complete) we end up better off? That seems impossible because the marginal analysis is supposed to capture the incremental effect.

  Wait, perhaps the key is in the interaction with a third party or an external constraint. Let me think of a different scenario.

  **Scenario: The Career Investment**
  You have spent 10 years training in a very specific scientific field (e.g., a rare ancient language). You are now considering a career shift. If you continue in your current field, you will earn a modest income of $50,000 per year for the next 20 years. If you switch to a new field, you would have to start over and you would earn $60,000 per year for the next 20 years. However, there is a catch: if you abandon your current field, the 10 years of training will be viewed as a waste by potential employers in the new field, and they will consider you a "risky" hire. This perception is not based on any real skill deficit but purely on signaling. As a result, you have a 50% chance of not getting any job in the new field (and earning $0) and a 50% chance of getting a job at $60,000. Your current field, however, is stable and you are guaranteed the $50,000.

  But note: the sunk cost (10 years) is being used as a signal to others. The problem says we cannot use the sunk cost as a proxy for information. Here, the sunk cost is causing a signal to others. But that signal is about the past, and it affects future job prospects. So it is using the past as information. This is disallowed by the constraint.

  We need a case without any signaling or information.

  Another idea: a case with a fixed deadline or a threshold.

  **Scenario: The Marathon Registration**
  You have paid a non-refundable $200 fee to register for a marathon. The marathon is in one week. Training for the marathon requires you to invest 20 hours of your time this week. You value your time at $20 per hour, so the training cost is $400. The benefit of completing the marathon is the pride and health benefits, which you value at $300. However, if you do not run, you will feel intense guilt about wasting the $200, which would cause you psychological pain that you value at $300. If you run, you avoid the guilt. You have no other benefits or costs.

  Options:
  - **Option 1: Skip the marathon**
    - Sunk cost: $200 (already paid)
    - Guilt: $300 (in disutility)
    - Total loss: $500

  - **Option 2: Run the marathon**
    - Sunk cost: $200
    - Training cost: $400 (time)
    - Benefit: $300 (pride) + avoidance of guilt ($300) = $600
    - Net: -$200 - $400 + $600 = $0

  But note: the guilt is a future psychological cost that is caused by the past expenditure. The textbook might say that the guilt is irrational and we should not count it. But the constraint says: no appeals to irrational preferences. The agent here is experiencing real disutility from guilt. So we must count it.

  However, the constraint also says: "no appeals to irrational preferences". If we are to build a case for a rational agent, we cannot rely on guilt that is irrational. The guilt is directly about the sunk cost. The textbook would say that the guilt is a mistake because the sunk cost should be ignored. So this might be disallowed.

  The challenge is to have a rational agent without irrational preferences.

  Let me try a different approach: a case with a fixed budget and multiple projects, but that might complicate.

  **Scenario: The Research Grant**
  You have a research grant that must be used within one year. You have already spent $80,000 of the $100,000 grant on a project. The remaining $20,000 must be used by the end of the year or lost. You have two choices: 

  (A) Put the remaining $20,000 into the current project, which has a 50% chance of success. If successful, the project will yield a benefit worth $100,000 (to your institution). If not, it yields $0.

  (B) Start a new project with the $20,000. This new project has a 90% chance of yielding a benefit worth $30,000.

  Assume that the past $80,000 spent on the current project is sunk and does not affect the future chances of the current project (so no information). The institution only cares about the total expected benefit.

  Expected value of (A):
  - 50% * $100,000 + 50% * $0 = $50,000

  Expected value of (B):
  - 90% * $30,000 = $27,000

  So (A) is better. But note: we are using the remaining money on the current project because we have already spent a lot on it? But the analysis does not use the sunk cost. It just uses the expected returns of the two options. The sunk cost is irrelevant.

  But what if the current project requires the entire $100,000 to have any chance? Suppose the first $80,000 has been spent and the project is set up, but without the last $20,000 it fails. Then the current project without the $20,000 yields $0. With the $20,000, it has a 50% chance of $100,000. So the marginal analysis of the $20,000 on the current project is $50,000 expected benefit, versus $27,000 on the new project. So we choose the current project. But again, the sunk cost of $80,000 is not used in the calculation.

  We need a case where the sunk cost is directly affecting the decision in a way that is not about information and not about the marginal return of the next dollar.

  After more thought, I recall that in some strategic interactions or commitment scenarios, sunk costs can matter. But the constraint says no science fiction and a normal adult situation.

  Another idea: a case where the past expenditure creates an obligation or a moral duty? But the problem says no unexplained duties.

  Perhaps a case with a discount rate and the timing of cash flows? But that might not work.

  Let me consider the renovation scenario again, but with a twist on the devaluation.

  Suppose that abandoning the project would not only devalue the home but also trigger a penalty. For example, the contract with the contractor requires that if you abandon, you must pay a penalty of $30,000 for breach of contract. But then the penalty is a future cost, not a sunk cost.

