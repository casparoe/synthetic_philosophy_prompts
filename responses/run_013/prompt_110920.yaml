  But note: the past expenditure of time (5 years) is sunk. The $5,000 advance is also sunk (you've spent it). The penalty and the requirement to return the advance are future costs that you can avoid by completing.

  The key here is that the sunk cost (the advance) is creating a future liability. By completing, you avoid that liability. The textbook would say that the liability is a future cost and should be counted, so it's not the sunk cost that matters but the future liability.

  The constraint says: the relevance of the past investment has to be doing genuine normative work of its own. In this case, the past investment (writing the book) led to receiving the advance, which in turn creates the liability. But the decision to complete is driven by the future liability, not the past effort.

