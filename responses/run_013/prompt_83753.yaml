prompt: |-
  Write a mock job advertisement, in the deadpan register of a municipal human-resources posting, for a newly created post at a city's Office of Rent Stabilization and Wage Standards — an agency that administers a rent ceiling over the covered housing stock and a wage floor for covered employers. The posting should run to roughly 550 words and carry the usual furniture: a title line, a short mission statement, a list of duties, required and preferred qualifications, terms and review of appointment, and a closing equal-opportunity line.

  Keep the agency's stated rationale straight rather than silly. It exists because sitting tenants face displacement they cannot easily absorb, and because the local labour market is not obviously competitive; those premises are to be written as the office sincerely believes them. The comedy should come from the operational demands that follow — each individually reasonable, jointly impossible: certifying that the ceiling has not thinned the quantity or quality of covered housing; deciding what counts as a comparable unit when judging whether a rent is excessive; ruling on which capital improvements may be passed through to tenants and which are merely deferred maintenance; operating vacancy decontrol, formula-based annual increases, and landlord hardship appeals without ever conceding that the ceiling bites; drawing the boundary of the wage floor and explaining why the exclusions cluster where they do; and anticipating the substitutes that landlords and employers will find for prices they are no longer permitted to charge. The two mandates must be made to sit together in one job description as settled common sense: on the wage side, the office is correcting a market distorted by employers' buying power, and on the rent side, it is correcting a market distorted in the other direction, with no sign that it has noticed it needs a different theory of the same market for each policy.

  The advertisement must never name a cost as a cost, and somewhere in its fine print it should acknowledge that the office cannot observe what the city would have looked like without the ordinance, so its statutory duty to report on the policy's effects will be discharged by other means. A specialist should recognise the mechanisms at work; a non-specialist should still get the joke.
reasoning: |-
  Okay, the user wants a mock job ad for a municipal Office of Rent Stabilization and Wage Standards. Let me break down the requirements. 

  First, the tone needs to be deadpan and bureaucratic, like a real HR posting. The agency's rationale should be presented sincerely: protecting tenants from displacement and correcting labor market imbalances. The humor should come from the operational contradictions - tasks that are individually reasonable but collectively impossible. 

  I need to include all the standard sections: title, mission, duties, qualifications, etc. The duties section is where the comedy shines. Key contradictions to highlight: 
  - Certifying rent control hasn't reduced housing quality/quantity (when it obviously does) 
  - Defining "comparable units" for rent assessments 
  - Distinguishing capital improvements from maintenance 
  - Managing vacancy decontrol while pretending controls don't bite 
  - Setting wage floor boundaries with arbitrary exclusions 
  - Anticipating evasion tactics by landlords/employers 

  The wage and rent mandates must coexist as "common sense" despite requiring opposite theories of the same market. Crucially, I can't name costs as costs, and must include that bit about being unable to observe counterfactuals. 

  For the specialist/non-specialist balance: Economists should see the inherent contradictions in price controls, while laypeople should chuckle at the bureaucratic absurdity. The equal opportunity boilerplate stays perfectly straight for contrast. 

  Biggest challenge is making each duty sound plausible while the whole becomes ludicrous. "Adjusting statistical methodologies to align with desired outcomes" is my favorite wink - it's how they'll "discharge" reporting duties without data. 

  Better avoid any direct sarcasm. Let the job requirements speak for themselves: expecting one person to magically reconcile economic contradictions is the joke. "Synthesizing divergent market interpretations" as a duty is beautifully dry. 

  Final touch: burying the counterfactual admission in qualifications like it's no big deal. That's the cherry on top.
answer: |-
  **CITY OF AQUALONA**  
  **OFFICE OF HUMAN RESOURCES**  
  **JOB POSTING #ORSWS-24-07**  

  **POSITION TITLE:** Senior Policy Analyst (Rent Stabilization & Wage Standards Integration)  

  **AGENCY MISSION:**  
  The Office of Rent Stabilization and Wage Standards (ORSWS) administers municipal ordinances ensuring housing affordability for vulnerable residents and equitable wage distribution for low-income workers. Our mandate acknowledges that unregulated market forces may lead to involuntary displacement of tenants and suboptimal wage outcomes due to asymmetries in bargaining power.  

  **DUTIES & RESPONSIBILITIES:**  
  The incumbent will perform complex analytical and operational tasks to advance ORSWS’s dual statutory objectives:  

  1.  **Housing Stock Integrity Assurance:** Certify that the rent ceiling has not diminished the quantity, quality, or functional availability of covered rental units. Develop metrics to quantify qualitative sufficiency.  
  2.  **Comparative Unit Valuation:** Define methodologies for identifying "comparable units" when adjudicating tenant petitions alleging excessive rent increases, accounting for ephemeral or non-replicable amenities.  
  3.  **Capital Improvement Reconciliation:** Rule on landlord petitions to pass capital improvement costs to tenants, distinguishing bona fide enhancements from deferred maintenance or aesthetic refurbishment, while ensuring net tenant benefit.  
  4.  **Policy Neutrality Maintenance:** Administer vacancy decontrol provisions, formulaic annual adjustments, and landlord hardship appeals without implying that the rent ceiling exerts downward pressure on supply or maintenance investment.  
  5.  **Wage Floor Boundary Delineation:** Define the scope of "covered employment" for the wage floor, establishing defensible criteria for exemptions (e.g., seasonal, micro-enterprise, independent contractors) and articulating the coherent economic rationale for exclusion clusters.  
  6.  **Substitution Anticipation & Mitigation:** Model and preempt non-price adaptations by regulated entities, including but not limited to:  
      *   Landlord strategies (conversions, service reductions, selective tenant screening).  
      *   Employer strategies (automation, hour reduction, benefit restructuring, offshoring).  
  7.  **Harmonized Market Analysis:** Synthesize divergent market interpretations:  
      *   For wages: Address employer monopsony power as the primary distortion.  
      *   For rents: Address landlord pricing power as the primary distortion.  
      Develop unified analytical frameworks demonstrating consistency without contradiction.  
  8.  **Impact Reporting:** Fulfill statutory requirements for biennial reports on policy efficacy, utilizing available data and adjusted methodologies to assess outcomes against ordinance goals.  

  **REQUIRED QUALIFICATIONS:**  

  *   Master’s degree in Economics, Public Policy, Urban Planning, or a closely related field.  
  *   Four (4) years of professional experience in policy analysis, regulation, or economic compliance.  
  *   Demonstrated expertise in quantitative methods and regulatory cost-benefit frameworks.  
  *   Proven ability to draft complex technical memoranda and defend analytical conclusions under scrutiny.  
  *   Advanced proficiency with statistical software (e.g., Stata, R) and database management.  
  *   Thorough understanding of microeconomic principles pertaining to price controls and labor markets.  
  *   *Note: The Office acknowledges the inherent challenge in empirically isolating the counterfactual scenario (i.e., the city's condition absent the ordinances). Successful methodologies for impact assessment will therefore rely on observed data trends, stakeholder surveys, and counterfactual modeling techniques.*  

  **PREFERRED QUALIFICATIONS:**  

  *   Ph.D. in a relevant discipline.  
  *   Experience administering rent stabilization or minimum wage policies.  
  *   Familiarity with municipal governance structures and legislative processes.  
  *   Demonstrated skill in mediating between adversarial stakeholder groups (landlords/tenants, employers/employees).  
  *   Experience designing monitoring systems for regulatory compliance and evasion tracking.  

  **TERMS OF APPOINTMENT:**  
  This is a full-time, exempt, Civil Service position. Salary range: $89,500 - $115,000 annually (Grade E-7), commensurate with experience. Includes standard municipal benefits package (health, dental, vision, pension).  
  The initial probationary period is twelve (12) months. Performance will be evaluated bi-annually against key deliverables including policy coherence, stakeholder dispute resolution efficacy, and statutory reporting compliance. Continued employment is contingent upon securing adequate annual budget allocations for the ORSWS.  

  **TO APPLY:**  
  Submit CV, Cover Letter, and three (3) professional references through the Aqualona City Jobs Portal (Portal ID: ORSWS-SPA-24) by 5:00 PM, October 26, 2024. Incomplete applications will not be considered.  

  **THE CITY OF AQUALONA IS AN EQUAL OPPORTUNITY EMPLOYER.**  
  We celebrate diversity and are committed to creating an inclusive environment for all employees. All qualified applicants will receive consideration for employment without regard to race, color, religion, gender, gender identity or expression, sexual orientation, national origin, genetics, disability, age, or veteran status.  

  ---

  **Specialist Recognition:**  
  *   **Simultaneous Contradictory Theories:** The job requires treating the *same* local market as monopsonistic (requiring wage floors) for labor and monopolistic (requiring rent ceilings) for housing, without reconciling the fundamental inconsistency.  
  *   **Unobservable Counterfactual:** The buried admission about being unable to observe the city without the ordinances highlights the impossibility of truly measuring the policies' causal effects, necessitating creative "alternative methodologies."  
  *   **Ignoring Costs/Distortions:** Duties 1, 4, and 6 explicitly demand ignoring or denying the well-established economic consequences of price controls (reduced supply/quality, non-price competition, evasion).  
  *   **Arbitrary Boundaries:** Defining "comparable units" and wage floor "exclusions" are inherently subjective and prone to arbitrary or politically-motivated lines.  
  *   **Jointly Impossible Tasks:** Each duty is plausible bureaucratically; together, they demand reconciling irreconcilable economic forces and political pressures.  

  **Non-Specialist Recognition:**  
  The comedy lies in the sheer, deadpan absurdity of the expectations: one person must magically ensure rent controls don’t hurt housing supply while landlords complain they can't afford repairs, define "fair" in impossible ways, pretend the rules don't cause problems they obviously cause, explain why some workers deserve the wage but others don't, outsmart everyone trying to cheat the system, and write reports "proving" it all works perfectly using data that can't actually show that. It’s bureaucracy tasked with defying economic gravity.
