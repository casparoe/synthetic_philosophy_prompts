  ## 1. Agreements

  We agree on the following fundamental aspects of the bargaining problem:

  1.1. **Primitives**: A bargaining problem for two players is defined by:
      - A feasible set \( S \subseteq \mathbb{R}^2 \), which is compact and convex, representing all possible utility pairs achievable by agreement. We assume \( S \) is non-level (i.e., it has a non-empty interior and a comprehensive boundary) and that there exists at least one point in \( S \) that strictly dominates the disagreement point.
      - A disagreement point \( d = (d_1, d_2) \in S \), which is the outcome that results if the players fail to reach an agreement. We assume \( d \) is in the interior of the comprehensive hull of \( S \) and that there are points in \( S \) strictly dominating \( d \).

  1.2. **Solution Concept**: A bargaining solution is a function that assigns to every bargaining problem \( (S, d) \) a unique point in \( S \), which we interpret as the rational or fair outcome of the bargaining process.

  1.3. **Common Requirements**: Both solutions satisfy the following properties:
      - **Pareto Efficiency (PE)**: The solution must pick a point on the Pareto frontier of \( S \).
      - **Symmetry (SYM)**: If the problem is symmetric (i.e., \( (u_1, u_2) \in S \) iff \( (u_2, u_1) \in S \) and \( d_1 = d_2 \)), then the solution must assign equal utilities to both players.
      - **Scale Invariance (INV)**: The solution is invariant under positive affine transformations of the utilities (i.e., independent of the choice of zero and unit of utility for each player).

  1.4. **Specific Properties**: 
      - The Nash solution satisfies:
          - **Independence of Irrelevant Alternatives (IIA)**: If \( (S, d) \) and \( (T, d) \) are two bargaining problems with \( S \subseteq T \) and the solution of \( (T, d) \) is in \( S \), then the solution of \( (S, d) \) is the same as that of \( (T, d) \).
      - The Kalai-Smorodinsky solution satisfies:
          - **Individual Monotonicity (IM)**: If the feasible set expands in a way that is favorable to one player (while keeping the ideal point of the other fixed), then that player's utility in the solution should not decrease.

  1.5. **Meta-Agreements**:
      - Both solutions coincide on symmetric problems: they both select the symmetric Pareto efficient point.
      - The two solutions are distinct in general. Therefore, our dispute is substantive and not due to a confusion about the setup.

  ## 2. Disagreements

  We have fundamental disagreements about the normative appeal of certain axioms and the interpretation of the disagreement point. We present our positions and the closest formulation we can both sign for each point.

  | Disagreement | Nash Defender's Position | Kalai-Smorodinsky Defender's Position | Joint Formulation |
