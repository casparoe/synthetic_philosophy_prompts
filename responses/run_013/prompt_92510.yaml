  #### 3. Cruxes  
  We identify sub-questions where resolving one would shift at least one position. For each, we describe a test case, predictions, and outcomes.  

  **Crux 1: Non-Convex Feasible Set**  
  - **Problem**: \((S,d)\) with \(d = (0,0)\) and \(S = \text{convex hull}\{(0,0), (1,0), (0,1)\} \setminus \{(u_1,u_2) \mid u_1 > 0.5, u_2 > 0.5\}\) (i.e., the unit triangle minus its top-right quadrant).  
    - \(S\) is non-convex and non-comprehensive. Pareto frontier: segments \((0,1)\)–\((0.5,1)\), \((0.5,1)\)–\((0.5,0.5)\), \((0.5,0.5)\)–\((1,0.5)\), and \((1,0.5)\)–\((1,0)\).  
  - **Bearing**: Tests solution robustness when standard axioms (e.g., convexity) are violated.  
  - **N Prediction**: NBS maximizes \((u_1 \cdot u_2)\) on the Pareto frontier. Candidate: \((0.5,0.5)\) (product \(0.25\)) or endpoints like \((1,0.5)\) (product \(0.5\)). Lacks unique maximum; may select \((1,0.5)\) or \((0.5,1)\) arbitrarily.  
  - **KS Prediction**: Ideal point \(a(S,d) = (1,1)\). KSS equalizes gain ratios: \(\frac{u_1}{1} = \frac{u_2}{1}\). Intersects Pareto frontier at \((0.5,0.5)\) if feasible, else adjusts.  
  - **Outcome**:  
    - NBS: Picks \((1,0.5)\) or \((0.5,1)\) (product \(0.5\)).  
    - KSS: Line \(u_1 = u_2\) intersects Pareto frontier at \((0.5,0.5)\) (feasible).  
  - **Shift Potential**: KS argues NBS’s arbitrariness in non-convex cases undermines rationality. N may concede KSS handles this better.  

  **Crux 2: Endogenous Disagreement Point**  
  - **Problem**: Two-stage bargaining. Stage 1: Players invest efforts affecting \(d\). Stage 2: Bargain over \(S\) given \(d\).  
    - \(S = \{(u_1,u_2) \mid u_1 + u_2 \leq 10\}\), symmetric.  
    - \(d\) depends on efforts: if both invest (cost \(c_i=1\)), \(d = (2,2)\); if one invests, \(d = (3,0)\) or \((0,3)\); if neither, \(d = (0,0)\). Efforts are non-cooperative.  
  - **Bearing**: Tests whether \(d\) is a fixed fairness baseline or a mutable parameter.  
  - **N Prediction**: \(d\) is exogenous to fairness; NBS splits surplus from realized \(d\). E.g., if \(d=(2,2)\), NBS = \((6,6)\); if \(d=(3,0)\), NBS ≈ \((6.5,3.5)\).  
  - **KS Prediction**: \(d\) is context-dependent; KSS equalizes gain ratios from ideal point \(a(S,d)\). If \(d=(3,0)\), \(a(S,d)=(10,7)\), KSS ≈ \((7,4)\) (ratios \(\frac{7-3}{10-3} = \frac{4-0}{7-0}\)).  
  - **Outcome**:  
    - Efforts: Nash equilibrium has both invest (avoiding \(d=(0,0)\) or asymmetry).  
    - Resulting \(d=(2,2)\): Both solutions yield \((6,6)\).  
  - **Shift Potential**: If efforts are asymmetric, KS argues NBS’s outcome is biased by manipulable \(d\); N counters that KSS’s ideal point is equally manipulable.  

