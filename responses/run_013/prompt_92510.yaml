  | **Individual Monotonicity (IM)** | IM is not a necessary condition for a rational solution. It may force a solution that does not reflect the relative bargaining power of the players. The Nash solution's violation of IM in some cases is justified because it focuses on the local trade-offs at the solution point. | IM is a fundamental requirement of fairness: if the set of opportunities expands for one player, that player should not be harmed. The KSS satisfies IM and thus respects this notion of fairness. | We agree that IM is a property that the Kalai-Smorodinsky solution satisfies and the Nash solution violates. We disagree on whether IM is a necessary condition for a fair solution. |
  | **Role of the Disagreement Point** | The disagreement point \( d \) is the benchmark for fairness: it sets the baseline from which gains are measured. The Nash solution maximizes the product of gains from \( d \), which is the natural way to balance the claims of the two players. | The disagreement point \( d \) is only one parameter of the problem. Fairness must also take into account the aspirations of the players, as reflected by the ideal point. The KSS uses \( d \) to set the origin but then focuses on the ratio of gains relative to the ideal point. | We agree that the disagreement point is a crucial input to the bargaining problem. We disagree on whether the solution should depend only on the local geometry around the solution (as Nash does) or also on the global structure of the feasible set (as KSS does). |

