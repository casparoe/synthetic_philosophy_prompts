  #### 4. Verbal Dispute  
  We agree that **no part of the dispute is merely verbal**. The differences stem from:  
  - **Substantive Axioms**: IIA vs. IM reflects irreconcilable views of rationality (consistency vs. monotonic gains).  
  - **Interpretation of \(d\)**: N sees \(d\) as the normative baseline; KS sees it as one input in a broader fairness calculus.  
  While terminology (e.g., "fairness") is shared, its operationalization fundamentally diverges.  

