  ## 4. Verbal Dispute

  After our discussion, we agree that part of our dispute is merely verbal. Specifically, we use the term "fairness" to mean different things:

  - The Nash defender associates fairness with the product of gains from the disagreement point, which is a local measure of the relative concessions at the solution.
