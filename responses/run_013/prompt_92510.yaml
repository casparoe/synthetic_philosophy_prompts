  ### Joint Statement on Bargaining Solutions: Nash and Kalai–Smorodinsky  
  **Signed by the Defender of Nash (N) and the Defender of Kalai–Smorodinsky (KS)**  

  #### 1. Agreements  
  We concur on the following foundational elements:  

  1.1. **Primitives of the Bargaining Problem**:  
     - **Feasible set (S)**: A closed, convex, comprehensive subset of \(\mathbb{R}^2\) representing attainable utility pairs. We assume \(S\) is bounded and contains points strictly dominating the disagreement point.  
     - **Disagreement point (d)**: The outcome if bargaining fails; \(d \in S\) with \(d = (d_1, d_2)\).  
     - **Solution**: A function \(f(S,d) \in S\) that selects a unique outcome for any \((S,d)\).  

  1.2. **Axiomatic Requirements**:  
     - **Pareto Efficiency (PE)**: Both solutions select a point in the Pareto-optimal set of \(S\).  
     - **Symmetry (SYM)**: For symmetric \((S,d)\) (i.e., \((u_1, u_2) \in S \iff (u_2, u_1) \in S\) and \(d_1 = d_2\)), both solutions yield \((u_1, u_2)\) with \(u_1 = u_2\).  
     - **Scale Invariance (INV)**: Both solutions are invariant under positive affine transformations of utilities.  
     - **Nash Solution (NBS)** satisfies:  
       - *Independence of Irrelevant Alternatives (IIA)*: If \(S' \subseteq S\) and \(f(S,d) \in S'\), then \(f(S',d) = f(S,d)\).  
     - **Kalai–Smorodinsky Solution (KSS)** satisfies:  
       - *Individual Monotonicity (IM)*: If \(S \subseteq T\) and the ideal point (defined as \(a_i(S) = \max \{ u_i \mid (u_1, u_2) \in S, u_j \geq d_j \}\)) remains fixed for both players, then \(f_i(T,d) \geq f_i(S,d)\) for each \(i\).  

  1.3. **Meta-Agreements**:  
     - On symmetric problems, NBS and KSS coincide.  
     - The solutions diverge for asymmetric problems, confirming a substantive dispute.  
     - Both solutions are well-defined and satisfy PE, SYM, and INV, ensuring they address rational bargaining.  

  ---

  #### 2. Disagreements  
  We tabulate core disputes, stating each position neutrally and a joint formulation:  

  | Dispute Issue | Nash Defender’s Position | Kalai–Smorodinsky Defender’s Position | Joint Formulation |
  |---------------|---------------------------|--------------------------------------|-------------------|
  | **Independence of Irrelevant Alternatives (IIA)** | IIA is a necessary condition for rational consistency: removing irrelevant options should not alter the outcome if the solution remains feasible. | IIA is artificial; it ignores how changes to \(S\) alter fair claims. KSS respects shifts in bargaining power when \(S\) expands/contracts. | *We disagree on whether IIA is a rational axiom. Nash deems it essential for consistency; KS rejects it for neglecting aspirational fairness.* |
  | **Individual Monotonicity (IM)** | IM is not rationally required. It overweights "ideal points," which are hypothetical and can incentivize strategic manipulation of \(S\). | IM is fundamental to fairness: expanding opportunities for one player should not harm them. KSS ensures gains reflect maximal potential. | *We disagree on IM’s normative status. Nash views it as dispensable; KS sees it as core to equitable gains.* |
  | **Role of \(d\)** | \(d\) sets the baseline for fairness: gains \(u_i - d_i\) define concessions, and NBS maximizes their product. | \(d\) parameterizes the problem but does not define fairness alone; KSS incorporates aspirations via the ideal point \(a(S,d)\). | *We agree \(d\) is crucial but disagree on its role: Nash treats it as the fairness anchor; KS uses it to scale gains relative to aspirations.* |

