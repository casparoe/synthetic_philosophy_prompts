       Why: If our practice is systematically mistaken, then the normative constraints of rationality might be baseless. But the eliminativist might argue that the norms are part of the folk theory and also mistaken.

     But note: The eliminativist can maintain that the norms are part of the theory that is wrong. So no direct conflict.

     Let's consider:

