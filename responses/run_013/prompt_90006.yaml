     - We have 14 desiderata.

   For irreconcilable pairs, we might consider:

     Pair 1: wholesale_error and predictive
       Why: If our practice is systematically mistaken (wholesale error), then it is hard to explain its predictive success (predictive). But the eliminativist must say that the predictive success is only apparent or due to other factors.

     Pair 2: fictional and causal_efficacy
       Why: Fictional characters have no causal powers, so how can we attribute causally efficacious states to them? But we do. A theory that requires causal efficacy for the states might rule out fictional attributions, but we require both.

     However, note that we might attribute beliefs to fictional characters without requiring that they are causally efficacious in our world. The motivating case for fictional does not require that the beliefs are causally efficacious in our world, but in the story world. So this might not be irreconcilable.

