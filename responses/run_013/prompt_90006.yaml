prompt: |-
  For the past several years I have been writing novels in which the interior lives of characters are rendered almost entirely in the vocabulary of belief and desire — she believed the letter had been sent, he wanted only to be forgiven, and so on — and I have lately been reading about the eliminativist proposal that this vocabulary names nothing at all, that it is a folk theory destined for the same discard pile as phlogiston. I am not yet persuaded, but I have come to see that I cannot adjudicate the dispute by trading intuitions, and I would rather have the specification first: before I decide whether my narrator may keep talking this way, I want the full list of desiderata that any adequate theory of belief and desire must satisfy. I mean the spec sheet in full — the phenomena the theory has to explain, the cases it must get right, the distinctions it may not collapse, and the commitments it cannot contradict — each accompanied by the particular case or consideration that makes it a requirement rather than a preference. I am especially interested in three kinds of case that I suspect are load-bearing and that the usual discussions pass over: the beliefs we attribute to fictional characters, who by hypothesis never existed and never had any functional organization to speak of; the beliefs we now attribute, half-seriously and half-not, to large language models; and the wholesale-error scenario the eliminativist needs, in which our entire practice turns out to have been systematically mistaken. A requirement that survives only because the awkward case is never raised is not a requirement, so tell me plainly which items on your list are genuine constraints on any theory and which are merely the house rules of one camp.

  Then, because I would rather see the fault lines than a scorecard, mark for each desideratum whether it is non-negotiable, optional, or the proprietary demand of a particular position, and flag any pair of desiderata you believe cannot be jointly satisfied — the eliminativist's fate may well turn on one such pair, and that is the part of your answer I will read most closely. Close with a short assessment of how the eliminativist program and its principal rivals fare against the list, but keep it brief; the criteria are what I need, not the verdicts.

  Give the whole thing as a single JSON object with these fields. desiderata: an array, one object per requirement, each with id (a short slug), name (a few words), statement (what the theory must deliver, in one or two sentences), motivating_case (the case or consideration that makes it a requirement), rules_out (the kinds of theory or claim it would exclude), and status (one of "non-negotiable", "camp-specific", or "optional"). irreconcilable_pairs: an array of objects, each with pair (the two ids) and why (the reason they cannot both be met). most_exclusionary: an object with id and why, naming the single requirement that eliminates the most otherwise plausible candidates. scorecard: an array of objects, each with contender (the position), standing (one sentence), and weakest_link (the id of the desideratum it struggles with most).
reasoning: |-
  We are constructing a JSON object that lists desiderata for a theory of belief and desire, identifies irreconcilable pairs, the most exclusionary desideratum, and a brief scorecard of how eliminativism and its rivals fare.

   The desiderata should cover the phenomena that any adequate theory must explain, including the three special cases: fictional characters, attributions to LLMs, and the wholesale-error scenario.

   Steps:
   1. List the desiderata (each as an object in an array). Each has:
      - id: short slug (e.g., "fictional")
      - name: a few words
      - statement: what the theory must deliver (1-2 sentences)
      - motivating_case: the case that makes it a requirement
      - rules_out: what kinds of theories or claims it would exclude
      - status: "non-negotiable", "camp-specific", or "optional"

   2. Irreconcilable pairs: pairs of desiderata that cannot be jointly satisfied.

   3. Most exclusionary: the one requirement that eliminates the most otherwise plausible candidates.

   4. Scorecard: for each contender (eliminativism, realism, instrumentalism, etc.), a one-sentence standing and the weakest link (desideratum id it struggles with).

   We'll cover the following contenders in the scorecard:
     - Eliminativism
     - Realism (or representationalism)
     - Interpretivism (or instrumentalism)
     - Functionalism

   Let's design the desiderata:

   Non-negotiable: These are constraints that any theory must meet to be considered adequate.

   Camp-specific: These are requirements that are specific to a particular camp (e.g., eliminativists might have one, realists another).

   Optional: These are desirable but not necessary.

   We'll include the following desiderata, making sure to cover:

     a. The three special cases: 
          - Fictional characters (id: fictional)
          - LLM attributions (id: llm_attributions)
          - Wholesale error (id: wholesale_error)

     b. Core phenomena:
          - Predictive power (id: predictive)
          - Rationality (id: rationality)
          - Introspection (id: introspection)
          - Normativity (id: normativity)
          - Causal efficacy (id: causal_efficacy)
          - Development and learning (id: development)
          - Error and ignorance (id: error)
          - Compositionality (id: compositionality)

   We must also consider:
          - The possibility of false beliefs (id: false_beliefs)
          - The relationship between belief and truth (id: truth_connection)
          - The relationship between desire and action (id: action_link)

   And the special cases:

     Fictional: We attribute beliefs/desires to fictional characters, even though they don't exist and have no functional organization.

     LLM attributions: We sometimes attribute beliefs/desires to LLMs, even though they are non-conscious statistical models.

     Wholesale error: The scenario where our entire practice is systematically mistaken (as eliminativists claim) must be accounted for.

   We'll design the list of desiderata:

    1. id: predictive
       name: Predictive Power
       statement: The theory must explain how attributions of belief and desire enable successful prediction of behavior in a wide range of cases.
       motivating_case: We routinely predict what someone will do based on what we take their beliefs and desires to be, and we are often correct.
       rules_out: Theories that cannot account for the predictive success of belief-desire psychology.
       status: non-negotiable

    2. id: rationality
       name: Rationality Constraints
       statement: The theory must account for the normative constraints of rationality that govern belief and desire attributions.
       motivating_case: We judge that a person who believes it is raining and wants to stay dry should take an umbrella; irrational combinations of attitudes are attributed with caution or not at all.
       rules_out: Theories that do not allow for normative assessments of rationality or that treat rationality as merely statistical.
       status: non-negotiable

    3. id: introspection
       name: Introspective Access
       statement: The theory must explain the apparent direct access we have to our own beliefs and desires through introspection.
       motivating_case: We often know what we believe or want without inferring from behavior, and we take this knowledge to be privileged.
       rules_out: Theories that deny any first-person authority or that reduce introspection to mere self-interpretation without any privileged access.
       status: optional   [Some theories (e.g., eliminativism) might deny this, so it might be camp-specific? But we'll mark as optional because it is not universally agreed to be a core feature.]

    4. id: normativity
       name: Normative Dimension
       statement: The theory must account for the way belief attributions are subject to norms of truth and desire attributions to norms of goodness or appropriateness.
       motivating_case: We criticize beliefs for being false and desires for being base or unreasonable, indicating a normative dimension.
       rules_out: Theories that treat beliefs and desires as purely descriptive, non-normative states.
       status: non-negotiable   [This is central to the way we use the concepts.]

    5. id: causal_efficacy
       name: Causal Efficacy
       statement: The theory must explain how beliefs and desires can be causally effective in producing behavior.
       motivating_case: We explain actions by citing beliefs and desires as causes, e.g., the desire for water and the belief that the glass contains water cause the action of drinking.
       rules_out: Theories that deny causal powers to beliefs and desires (e.g., epiphenomenalism).
       status: non-negotiable

    6. id: development
       name: Developmental Trajectory
       statement: The theory must account for the development of belief and desire attributions in children and their role in learning.
       motivating_case: Children acquire the ability to attribute beliefs and desires in a predictable sequence, and this ability is crucial for social learning.
       rules_out: Theories that cannot explain the ontogeny of belief-desire psychology.
       status: non-negotiable

    7. id: error
       name: Error and Ignorance
       statement: The theory must account for the possibility of false beliefs and unfulfilled desires, and for ignorance (lack of belief) and indifference (lack of desire).
       motivating_case: We often have false beliefs (e.g., believing a false rumor) and unfulfilled desires (e.g., wanting to win the lottery but not winning), and we can be ignorant of some facts or indifferent to some outcomes.
       rules_out: Theories that require all beliefs to be true or all desires to be satisfied, or that cannot represent absence of attitude.
       status: non-negotiable

    8. id: compositionality
       name: Compositionality
       statement: The theory must account for the compositionality of belief and desire contents: complex attitudes are built from simpler ones.
       motivating_case: We can believe that "it is raining and cold" and this relates to believing that it is raining and believing that it is cold.
       rules_out: Theories that treat beliefs as atomic, non-structured states.
       status: non-negotiable   [This is central to the way we reason with beliefs and desires.]

    9. id: fictional
       name: Fictional Characters
       statement: The theory must explain how we can meaningfully attribute beliefs and desires to fictional characters who do not exist and have no functional organization.
       motivating_case: Readers of a novel understand that the character believes the letter was sent, even though the character is not real and has no internal states.
       rules_out: Theories that require the subject to actually possess functional states or to exist physically for the attribution to be meaningful.
       status: non-negotiable   [This is a core feature of our practice.]

   10. id: llm_attributions
       name: LLM Attributions
       statement: The theory must explain the practice of attributing beliefs and desires to large language models (LLMs) in a way that is half-serious and half-metaphorical.
       motivating_case: When interacting with an LLM, we might say "it believes that Paris is the capital of France" or "it wants to be helpful", even though we know it is a statistical model.
       rules_out: Theories that cannot account for the metaphorical or "as if" nature of such attributions without committing to the reality of the attitudes.
       status: optional   [This is a recent phenomenon and might be handled by an account of pretense or metaphor.]

   11. id: wholesale_error
       name: Wholesale Error
       statement: The theory must either accommodate the possibility that our entire practice of belief-desire attribution is systematically mistaken or explain why such a scenario is incoherent.
       motivating_case: The eliminativist proposal that beliefs and desires are like phlogiston requires that it is possible for our entire framework to be wrong.
       rules_out: Theories that rule out the possibility of massive error by definition (e.g., some forms of interpretivism that take the practice as constitutive).
       status: camp-specific   [This is a requirement only for those who take eliminativism seriously; for others, it might be a non-starter.]

   12. id: false_beliefs
       name: False Beliefs
       statement: The theory must allow that beliefs can be false without ceasing to be beliefs.
       motivating_case: We routinely attribute false beliefs, e.g., a child believes that Santa Claus exists.
       rules_out: Theories that define belief as a state that must be true (e.g., some forms of knowledge-first epistemology that blur belief and knowledge).
       status: non-negotiable   [Already covered by error? But let's make it explicit.]

   13. id: truth_connection
       name: Truth Connection
       statement: The theory must account for the connection between belief and truth: beliefs aim at truth.
       motivating_case: We assess beliefs as correct or incorrect based on their truth, and we change beliefs in the face of evidence.
       rules_out: Theories that deny any constitutive connection between belief and truth.
       status: non-negotiable

   14. id: action_link
       name: Action Link
       statement: The theory must account for the connection between desires (or pro-attitudes) and action: desires motivate action.
       motivating_case: We expect that if someone desires something and believes that a certain action will achieve it, they will be motivated to perform that action (ceteris paribus).
       rules_out: Theories that divorce desire from motivation or that cannot explain weakness of will (akrasia).
       status: non-negotiable

