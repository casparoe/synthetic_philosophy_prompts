       Why: How can we attribute causally efficacious states to entities that do not exist? The theory must either deny that fictional attributions require causal efficacy (by, say, treating the attributions as pretense) or show how causal efficacy can be maintained in a fictional context. But if a theory requires that beliefs and desires are always causally efficacious, then it cannot attribute them to fictional characters.

