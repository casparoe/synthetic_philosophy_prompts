answer: |-
  Here's an original example fulfilling your criteria: **Human Intestinal Lactase Non-Persistence (LNP)**.

  ### The Biological Facts (Unchanged)
  *   **Condition:** Most adult mammals, including a significant portion of humans, experience a genetically programmed downregulation of the lactase enzyme after weaning. This enzyme is necessary to digest lactose, the sugar in milk.
  *   **Biology:** The underlying biology is identical: reduced lactase enzyme production in the small intestine due to the natural silencing of the lactase gene (LCT) promoter after infancy. This leads to undigested lactose fermenting in the colon, causing symptoms (bloating, cramps, diarrhea, gas) in individuals who consume significant amounts of dairy.
  *   **Variation:** The persistence of lactase production into adulthood is a relatively recent (<10,000 years) genetic adaptation strongly correlated with populations historically practicing dairy farming. Non-persistence is the ancestral, species-typical state.

  ### How Reference Class Changes the Disease Verdict
  1.  **Reference Class: Species (Homo sapiens)**
      *   **Normal Functioning:** The species-typical pattern for humans (like most mammals) is lactase non-persistence after weaning. Lactase persistence is the derived, minority trait.
      *   **Verdict:** Lactase Non-Persistence (LNP) is **NOT a disease**. It represents normal, species-typical physiological development. Symptoms arise only due to consumption of a non-species-typical food (dairy beyond infancy). The "problem" is dietary intake, not the physiological state itself.
      *   **Defense:** Biologically, LNP is the default, evolutionarily conserved state for the species. Classifying the norm as disease is biologically incoherent.

  2.  **Reference Class: Local Population (e.g., Northern European, Pastoralist African)**
      *   **Normal Functioning:** In populations with high frequencies of lactase persistence alleles (e.g., >80% in Scandinavia), lactase production into adulthood *is* the statistical norm and functional baseline for digesting a culturally staple food group (dairy).
      *   **Verdict:** Lactase Non-Persistence (LNP) **IS a disease/disorder (Lactose Intolerance)**. Within this population, LNP represents a statistically atypical deviation ("malfunction") of the digestive system relative to the local norm, leading to symptomatic distress when consuming the normative diet.
      *   **Defense:** Function is context-dependent. In populations where dairy is a primary nutrient source, the inability to digest it efficiently causes harm and deviates significantly from the locally defined functional norm for adults.

  ### Privileging a Reference Class: Can it be Value-Free?
  *   **Which to Privilege?** A strict naturalist might argue for privileging the **species-level reference class**. After all, LNP *is* the ancestral, genetically programmed state for *Homo sapiens*. Defining disease relative to species-typical functioning seems most objective and biologically fundamental.
  *   **Can it be Defended Without Values?** **No.** The choice to privilege the species level *over* the population level inevitably involves normative judgments:
      1.  **Biological Significance:** Deciding that the species-typical state is the *only* relevant biological benchmark ignores the reality of human genetic diversity, adaptation, and gene-culture coevolution. It implicitly values the "original" state over evolved adaptations, which is not a purely biological fact but a judgment about what constitutes "true" human biology.
      2.  **Ignoring Functional Context:** Insisting on the species level disregards the crucial role of the *environment* (dietary practices) in determining whether a trait causes dysfunction/harm. Deciding that the dietary context is irrelevant to defining "normal function" is a value-laden choice about what constitutes the relevant environment for assessing function.
      3.  **Defining "Harm":** Even if focusing on the species level, labeling the *symptoms* caused by dairy consumption as "harm" requires a value judgment about what constitutes undesirable states (discomfort, diarrhea). A purely biological description might just note a physiological process (fermentation).

  ### What the Case Shows About Value-Freedom in Disease Concepts
  The Lactase Non-Persistence case vividly demonstrates that **the concept of disease cannot be analysed without invoking values, even within a naturalist, function-based framework.**

  1.  **Reference Class is Value-Laden:** The fundamental act of choosing *which* group defines "normal functioning" (species, population, age, sex) is not dictated by biology alone. Biology shows variation exists; it doesn't dictate which level of variation is the benchmark for "disease." Choosing the species level prioritizes universality and ancestry; choosing the population level prioritizes local adaptation and functional context within specific environments. Both choices involve values about what constitutes the relevant biological community or functional standard.
  2.  **"Harm" is Value-Laden:** Identifying the symptoms of LNP after dairy consumption as "harmful" sufficient to warrant the "disease" label relies on a prior judgment about undesirable states of being (discomfort, social inconvenience, nutritional limitation). Biology describes the mechanisms causing the symptoms; it doesn't objectively define them as "harm" requiring medical categorization.
  3.  **"Dysfunction" Relies on Context:** Declaring LNP a "dysfunction" is only meaningful relative to a specific environment (a high-dairy diet) and a specific reference class (a population where lactase persistence is the norm). The same biological state is functional in one context (low-dairy diet, species-level view) and dysfunctional in another (high-dairy diet, population-level view). Defining the relevant context involves values about what environments are "normal" or "expected" for humans.

  **Conclusion:** While lactase non-persistence has a clear, objective biological basis, its classification as a disease or a normal variation depends entirely on the chosen reference class. Defensible arguments exist for both verdicts based on different biological groupings. However, the *choice* of which reference class to privilege for defining disease cannot be made solely on biological facts; it inherently involves value judgments about the significance of species-typicality versus local adaptation, the relevance of environmental context, and the definition of "harm." This case strongly undermines the claim that a purely value-free, naturalistic analysis of "disease" is possible. Values permeate the selection of the biological benchmark itself.
