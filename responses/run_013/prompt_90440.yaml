answer: |-
  Here are five numbered items addressing your query:

  1.  **The Core Bind is the "Task-Relativity of Side Effects" or "Preference-Dependent Impact" problem.** This names the specific issue: defining what constitutes an undesirable side effect (disturbance/impact) is entirely relative to the *scope* of the intended task or the *implicit preferences* of the user, not an objective feature of the environment.
  2.  **It manifests as a circularity: avoiding unwanted changes presupposes knowing what is wanted.** The instruction "avoid side effects" is only actionable if the agent already possesses a complete model of the user's preferences regarding *all* states of the world. Without this, the distinction between task and side effect is arbitrary based on the task description alone.
  3.  **This bind is central to the "Value Specification Problem" in AI alignment.** It highlights the difficulty of translating incomplete, context-dependent human instructions ("fetch coffee") into a comprehensive utility function that correctly weights all possible state changes against unstated preferences ("don't disturb anything I value").
  4.  **It differs from the Doctrine of Double Effect (intended vs. foreseen).** Double effect concerns the *moral permissibility* of actions with both good and bad *foreseen* consequences, based on intention. Your bind concerns the *definitional ambiguity* of what *constitutes* a "bad consequence" (side effect) in the first place, based solely on the task specification.
  5.  **It contrasts with the Knobe Effect (asymmetry in intentionality attributions).** The Knobe effect shows how *moral valence* influences judgments of *intentionality* (harming the environment is seen as intentional, helping isn't). Your bind concerns the *prior* problem of defining the *moral valence itself* (harm/help) relative to an underspecified task, not the subsequent attribution of intent.
