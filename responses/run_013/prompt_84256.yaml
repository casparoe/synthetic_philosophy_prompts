answer: |-
  Below is the translation you requested—mapped rigorously to your novelist's framework—followed by a residue report identifying conceptual gaps and their implications.  

  ### **Core Translation: Textualism vs. Purposivism in Literary Terms**  
  1. **The Statute as Text**  
     - *Your Analogy*: The statute is the "finished book."  
     - **Clean Mapping**: The text is the authoritative artifact. Judges, like readers, start with the words on the page.  

  2. **The Legislature as Authors**  
     - *Your Analogy*: A multi-headed, semi-anonymous drafting collective (like a writers' room with competing agendas).  
     - **Bent Concepts**:  
       - **Collective Authorship**: Unlike a novelist’s singular voice, legislative intent is a negotiated fiction—a "committee draft" where compromises bury individual visions.  
       - **Revision Traces**: Legislative history (floor debates, amendments) resembles discarded drafts or editor’s margin notes. *But*: Legal purposivists treat these as evidence of "authorial purpose," while textualists see them as cut material—akin to insisting deleted scenes define the film.  

  3. **The Judge as Reader**  
     - *Your Analogy*: A critic interpreting the text.  
     - **Bent Concepts**:  
       - **Authority of the Reader**: A judge’s reading has legal force—unlike literary criticism. When a judge interprets, it binds parties (e.g., "You go to prison based on my reading"). Your vocabulary lacks **coercive authority**.  
       - **Canons of Construction**: These are "narrative conventions" for legal texts (e.g., "*ejusdem generis*" = "interpreting ‘dogs, cats, and other animals’ excludes robots"). Cleanly mapped to genre tropes.  

  4. **Intent vs. Textual Meaning**  
     - *Textualism* = "What the published book *says* to a skilled reader." Ignores author interviews or drafts.  
     - *Purposivism* = "What the authors *meant to accomplish* with the book, even if clumsily executed."  
     - **Bent Concepts**:  
       - **Absurdity Doctrine**: When words produce an "absurd" outcome, purposivists rewrite the sentence (like an editor fixing a plot hole). Textualists call this "illegal fan fiction"—the reader doesn’t override the text.  

  5. **The Unforeseen Case (Counterfactual Intent)**  
     - *Your Analogy*: "What would the author do if she encountered this plot twist?"  
     - **Bent Concepts**:  
       - **Legislative Clairvoyance**: Asking "What would Congress have wanted for AI privacy in 1960?" is like asking "How would Austen write a smartphone scene?"—a fictionalized projection. Purposivism treats this as discovery; textualism rejects it as invention.  

  ### **Residue Report: What Your Vocabulary Cannot Capture**  
  1. **Binding Authority & Non-Consenting Parties**  
     - *The Gap*: Your framework assumes readers engage voluntarily. Law forces outcomes on people (e.g., a judge’s reading fines you).  
     - *Defect or Power Struggle?*: **A missing concept of authority**. Novelists lack sovereign power; judges wield it. The dispute isn’t just about meaning—it’s about *who controls coercion*. Textualists limit judicial power to the text; purposivists let judges invoke legislative "purpose" to expand it.  

  2. **Collective Authorship as Legal Fiction**  
     - *The Gap*: "Legislative intent" is not psychological (no single mind). It’s a construct courts invent to justify decisions.  
     - *Defect or Power Struggle?*: **A defect in your framework**. Novels have traceable authorship; statutes are procedural outputs. When purposivists say "Congress intended X," they mask factional deals. Your vocabulary’s "author" is too unified.  

  3. **Meaning vs. Function**  
     - *The Gap*: Statutes are tools for social engineering, not aesthetic objects. "What is this text *for*?" dominates legal analysis.  
     - *Defect or Power Struggle?*: **A defect**. Your novelist’s lens focuses on what the text *is*; law focuses on what it *does*. Purposivism prioritizes function over semantic meaning.  

  4. **Anti-Intentionalism as a False Friend**  
     - *Your Query*: Does "the death of the author" or "the book outgrowing its creator" aid purposivism?  
     - *Reality*: **No—ironically, it supports textualism**.  
       - If critics ignore authorial interviews (per Barthes), textualists ignore legislative history.  
       - If a novel’s meaning emerges *despite* the author, so does a statute’s—textualism embraces this.  
       - Purposivism’s "intent" is a *reconstruction*, not discovered truth. Your experience of "the character taking over" mirrors how statutes acquire unintended meanings—but law can’t celebrate this. It must decide *now*.  

  ### **Conclusion: The Hidden Dispute**  
  Your vocabulary reveals that **the core conflict is not about interpretation—it’s about authority**:  
  - Textualism restricts judges to the text to limit judicial overreach.  
  - Purposivism empowers judges to "finish the draft" for modern problems, risking judicial policymaking.  
  The "residue" isn’t about meaning; it’s about **who owns the pen** when the text is silent. Your framework lacks the concept of **sovereign power**—the force that turns reading into ruling. Lawyers aren’t just interpreting; they’re governing.  

  > "The quarrel is disguised as hermeneutics but is actually constitutional. Textualism fears judges; purposivism fears legislative silence."
