answer: |-
  ## A Defense of Transmission-Robustness as the Fundamental Norm of Assertion

  Your critique cuts deep. The standard norms of assertion *do* presuppose an immediate, terminal consumer, neglecting the pervasive reality of testimonial chains. I will argue forcefully for transmission-robustness (TR) as the fundamental norm: **An assertion is permissible only if the speaker's epistemic position is robust enough to warrant the assertion's continued assertibility by a typical relay audience, even after undergoing ordinary losses during transmission (e.g., loss of specific evidence context, weakening of hedges, simplification of qualifications).** Knowledge, I contend, is a derivative norm arising only when the audience is purely terminal.

  **The Core Argument: Function and Social Epistemology**

  1.  **The Functional Primacy of Relay Assertions:** Assertions made to be passed on (spokesperson, expert, inspector, physician) are not mere curiosities; they are *foundational* to the division of epistemic labor that structures modern knowledge. The primary function of such assertions is *not* immediate consumption but *initiating a reliable testimonial chain*. The immediate hearer functions as a conduit. Therefore, the norm governing the act must inherently account for its intended downstream consequences. An assertion that cannot sustain transmission under ordinary conditions fails its core function, regardless of its immediate warrant for the speaker or the relay.
  2.  **The Epistemic Asymmetry:** In relay contexts, the speaker possesses crucial meta-epistemic awareness the relay audience lacks: *They know their assertion is intended for transmission.* This imposes a unique responsibility. The speaker, unlike the relay, has access to the *full context* of justification, the nuances, the caveats. They are in the best position (and often the *only* position) to anticipate how the assertion might degrade. To assert something fragile into a chain they know will transmit it is epistemically negligent; it knowingly introduces a potential point of failure into the social knowledge system.
  3.  **Robustness as Warranted Transmissibility:** TR captures this responsibility. It demands that the speaker's justification is not merely *personal* but *socially portable*. It requires a justificatory base sufficiently secure that the core claim survives the "friction" of testimony:
      *   **Surviving Lost Evidence:** The relay audience won't have the speaker's full evidence. TR requires the speaker's position to be strong enough that the assertion remains warranted even if only the *conclusion* (or a summary of the key support) is transmitted.
      *   **Surviving Hedge-Erosion:** Qualifiers ("probably," "likely," "in most cases") are easily stripped. TR requires the unqualified core claim to be assertible by the relay *based on the speaker's warrant*, or requires the qualification itself to be robustly transmissible. Asserting a heavily hedged claim whose *only* warrant lies in the hedges violates TR if those hedges are predictably lost.
      *   **Surviving Context Loss:** Nuances dependent on specific background knowledge the speaker possesses but the chain won't transmit must not be essential to the warrant. The core assertion must stand firm on more widely shareable warrants.

  Knowledge becomes a special case: When the audience is *terminal*, there is no transmission loss to guard against. The speaker's warrant need only support their own assertion to that specific consumer for immediate use. TR collapses to "The assertion must be warranted for the speaker to make *to this terminal audience*" – which, under standard assumptions linking warrant and knowledge, is the knowledge norm. Knowledge is the local, terminal instance of the general norm of transmissibility.

  **Addressing the Pressures:**

  1.  **Unreasonable Demandingness?** This is a serious challenge. TR *is* demanding. However:
      *   **Control vs. Obligation:** TR doesn't require controlling the downstream hearer's *actions*. It requires the speaker's *own epistemic position* to be robust enough that *if* the relay audience transmits it faithfully within ordinary parameters (i.e., without adding new errors, but suffering the expected epistemic friction), *their* assertion remains warranted. The obligation is to package the assertion sustainably. Blame lies with the speaker if the assertion is inherently fragile, not necessarily if a specific relay malfunctions (e.g., deliberately distorts it).
      *   **Ordinary Losses Defined:** "Ordinary losses" are predictable, non-malicious simplifications inherent in testimony chains – not radical distortions. It sets a realistic, context-sensitive standard: What would a competent, conscientious relay reasonably convey? A physician diagnosing a complex case must ensure the core diagnosis ("bacterial pneumonia requiring antibiotic X") is robust, even if the intricate differential reasoning is lost. They aren't responsible for a relay wildly misstating the diagnosis.
      *   **Contextual Sensitivity:** The required degree of robustness varies with the stakes and the nature of the chain. TR is more demanding for a public health official than for someone sharing trivia.

  2.  **Caution vs. Assertion Norm?** TR governs the *epistemic permissibility of the act of asserting itself* in relay contexts.
      *   **Constitutive Rule:** Just as the knowledge norm posits that asserting P constitutively represents that one knows P, TR posits that asserting P *to a relay audience* constitutively represents that P is transmissibly robust from the speaker's position. Violating TR makes the assertion epistemically defective *as an assertion into a chain*, regardless of the speaker's internal caution level.
      *   **Distinct from Prudence:** Caution is about risk aversion. TR is about the *epistemic warrant* of the speech act given its intended social function. One can be recklessly imprudent without violating TR (if the assertion is robust despite recklessness), and perfectly prudent while violating TR (if one cautiously asserts something inherently fragile into a chain). TR sets an epistemic threshold for the act being *properly performed* as a transmission-initiator.

  3.  **Stability of the Terminal/Relay Distinction?** This pressure threatens to dissolve the knowledge norm entirely. However:
      *   **Functional Definition:** The distinction isn't ontological but *functional* relative to the speaker's context and intention. An audience is a "relay audience" *for that assertion* if the speaker reasonably believes the assertion will be relied upon (wholly or partly) for further transmission/assertion. An audience is "terminal" if the speaker reasonably believes the assertion will be consumed and acted upon *by them* without significant retransmission being the intended or expected next step.
      *   **Knowledge Norm Preserved:** In contexts clearly understood by the speaker as terminal (telling a friend the time; answering a colleague's immediate factual query), TR *collapses* to the knowledge norm. The "robustness" required is robustness against *zero* transmission steps – the speaker's warrant must directly support their assertion *to that hearer*. This preserves the core intuitions motivating the knowledge norm in its paradigmatic cases.
      *   **Ubiquity Doesn't Destroy:** While *potential* for relay exists almost universally, speakers constantly make judgments (explicitly or implicitly) about the *likelihood and significance* of transmission in a given context. TR is only invoked when transmission is a reasonably expected and significant function of the act. The knowledge norm governs the vast majority of low-stakes, immediate interactions where transmission is unlikely or irrelevant.

  4.  **Implications for Standard Knowledge Norm Cases:** TR handles these elegantly as the zero-friction limit. Consider Jennifer Lackey’s "selfless assertion" case: A creationist teacher asserts evolutionary theory based solely on textbook authority, knowing it well but not believing it. The knowledge norm struggles: She asserts truth on good evidence, but doesn't *know* (lacks belief). TR (collapsed to the terminal case) may deem it permissible: Her warrant (textbook authority) is robust enough *for the immediate student audience* to consume and act upon. Conversely, in "lottery" cases, asserting "Your ticket lost" based purely on odds violates the knowledge norm (you don't *know* it lost) *and* TR (the warrant is insufficiently robust for the terminal hearer to reasonably act as if it's certain). TR explains the intuition without needing belief as a necessary component of the norm.

  **The Weaknesses: Candor Required**

  1.  **Operationalization and Vagueness:** "Ordinary losses," "typical relay," and "sufficiently robust" are inherently vague and context-dependent. Defining precise parameters is difficult. *Counter:* Epistemic norms often involve contextual judgment (e.g., "adequate justification"). TR reflects the messy reality of social testimony. We can develop guidelines based on epistemic roles (expert, journalist, official) and stakes.
  2.  **Overdemandingness in Practice:** Could TR stifle communication? Requiring every casual remark to be relay-proof is absurd. *Counter:* TR is primarily activated when transmission is a *significant expected function* of the assertion. Context matters crucially. The norm scales with the speaker's awareness of the chain and the stakes involved. A passing comment isn't held to the standard of a medical diagnosis.
  3.  **Motivational Cases:** Intuitions supporting the knowledge norm in terminal cases (e.g., "You shouldn't assert P if you don't know it, even if true and justified") feel strong and *prima facie* independent of transmissibility. Arguing knowledge is *merely* derivative might seem to downplay this core intuition. *Counter:* TR respects this intuition by making knowledge the terminal case norm. The derivative status doesn't make it less binding *in that context*; it explains *why* knowledge is required there – because robustness to zero transmission steps demands the strongest possible immediate warrant, which is knowledge.
  4.  **Grounding in Speaker's State:** TR focuses heavily on the speaker's epistemic position *as the source of robustness*. However, the downstream assertibility also depends on the *competence of the relay*. While TR sets the speaker's obligation based on typical competence, there's an inherent link to the reliability of the chain itself, which might seem to go beyond the speaker's control. *Counter:* This is precisely why TR focuses on *ordinary* losses within a *typical* chain. The speaker is only responsible for their contribution to the chain's starting point being sound.

  **Conclusion: A Norm for the Social Epistemic World**

  The transmission-robustness norm provides a superior framework for understanding the epistemology of assertion in our interconnected world. It centers the reality that much of our most vital knowledge flows through chains of testimony. By demanding that speakers initiating such chains ensure their assertions are epistemically sustainable, TR directly addresses the functional purpose of relay assertions and the unique responsibility borne by the originator.

  While demanding and requiring careful contextual application, TR avoids collapsing into mere caution and preserves the core insights of the knowledge norm for terminal audiences by treating it as a special case of zero transmission friction. Its greatest strength is its recognition that the epistemology of assertion is fundamentally tied to the social life of knowledge. Its greatest weakness lies in operationalizing the inherent contextuality and vagueness of "robustness" against "ordinary losses." Nevertheless, embracing this complexity is necessary to move beyond the impoverished model of assertion as a dyadic act aimed only at immediate consumption. Your suspicion is correct: the standard literature *has* been looking in the wrong place, prioritizing the terminus over the journey. Transmission-robustness offers a norm fit for the journey.
