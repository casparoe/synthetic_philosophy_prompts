answer: |-
  Here's a practical, philosophy-rooted procedure to resolve "unargued premise" disputes in **20 minutes**, designed to resist gaming and leverage key insights from Wittgenstein, hinge epistemology, and pragmatic methodology:

  ---

  ### **The Hinge Test Procedure**  
  *(Run separately for each disputed premise)*

  1.  **IDENTIFY THE PROPOSITION (P)**  
      *Question:* "State the **exact claim** the referee wants argued and the author refuses to defend."  
      *Sufficient Answer:* A single, clear sentence (e.g., "Likert scales can be treated as interval data," "Childhood memories are broadly accurate," "Phenomenon X exists").  
      *Stop if:* P cannot be stated clearly. Outcome: **Referee must clarify**.

  2.  **TEST FUNCTIONAL NECESSITY**  
      *Question:* "If we **temporarily suspend belief in P**, does the paper's **core argument or methodology collapse entirely**? Could the paper's main conclusion still be reached (even weakly) without P?"  
      *Sufficient Answer:*  
      - *Yes (Collapses):* Proceed to Step 3.  
      - *No (Stands/Adaptable):* Outcome: **Author must defend or modify**.  
      *Anti-Gaming:* If removing P only weakens but doesn't destroy the argument, it's not a hinge. If alternative methods exist (even if less ideal), P isn't necessary.

  3.  **TEST CONTEXTUAL "HELD FAST"-NESS**  
      *Question:* "Is P treated as **non-negotiable background** in the **specific context** of this paper's subfield/question? Is doubting P equivalent to doubting the **framework enabling this research**?"  
      *Sufficient Answer requires evidence of **one**:*  
      - **Consensus Evidence:** P is universally assumed in recent key literature (cite 2-3 papers).  
      - **Logical Scaffolding:** P is a precondition for coherent doubt/research in this domain (e.g., doubting all memory accuracy destroys developmental psychology).  
      - *Not Sufficient:* "It's standard," "Everyone knows this," "The paper isn't about P."  
      *Stop if:* Evidence is provided → Proceed to Step 4.  
      *Stop if:* No evidence → Outcome: **Author must defend P**.

  4.  **TEST "IDLE DOUBT" (PRAGMATIC CONSEQUENCES)**  
      *Question:* "If we **reject P for this paper**, what **concrete, productive research path** opens up? Does doubting P here lead to new insights **relevant to the paper's goals**, or does it only derail into foundational debates?"  
      *Sufficient Answer:*  
      - *Productive Path Described (e.g., new validation study, alternative analysis):* Outcome: **Referee's doubt is valid**; author must address.  
      - *No Productive Path/Derails Core Goal (e.g., forces paper into metaphysics):* Outcome: **Doubt is "idle"**; P is a hinge.  

  ---

  ### **Applied to Your Cases**

  1.  **Likert Scales as Interval Data**  
      - **P:** "Responses on this 5-point Likert scale represent equal-interval measurements."  
      - **Step 2:** Removing P doesn't collapse the paper. Alternatives exist (non-parametric tests, treating as ordinal). → **Outcome: Author must defend or use robust methods.**  
      *Why not a hinge:* Methodological flexibility exists; challenge isn't field-paralyzing.

  2.  **Childhood Memories as Broadly Accurate**  
      - **P:** "Adult recollections of childhood events are generally veridical."  
      - **Step 2:** Removing P collapses most developmental/clinical research on childhood.  
      - **Step 3:** P is foundational in memory studies (consensus literature exists).  
      - **Step 4:** Rejecting P here demands a meta-memory paper, derailing this study's goal. → **Outcome: P is a hinge; doubt is idle.**  

  3.  **Rejecting an Established Phenomenon**  
      - **P:** "Phenomenon X (studied for 40 years) exists."  
      - **Step 2:** Removing P **is the paper's core argument**. The paper asserts ¬P.  
      - **Step 3:** P is consensus, but ¬P is the paper's entire purpose.  
      - **Step 4:** Rejecting P (i.e., accepting ¬P) **is the productive path** – it *is* the insight. → **Outcome: Referees must engage with ¬P's evidence.**  
      *You'll dislike this:* It forces referees to engage with radical challenges. But the procedure shows their refusal to debate ¬P is invalid; the paper’s existence proves P isn’t a hinge *in this context*.

  ---

  ### **What the Procedure Can't Do**
  1.  **Resolve Genuine Methodological Disputes:** If field consensus is split on P (e.g., Bayesian vs. Frequentist stats), this flags a deeper debate needing expert arbitration.
  2.  **Judge Truth or Plausibility of P:** It only assesses if P *can* be left undefended *in this specific paper*. A hinge can still be false.
  3.  **Fix Bad Faith Actors:** Authors can fabricate "consensus" (but Step 3 requires citations). Referees can ignore outcomes (but you have a clear audit trail).
  4.  **Handle Normative Assumptions:** If P is ethical/political (e.g., "Well-being matters"), this works poorly. Use only for empirical/methodological P.
  5.  **Replace Domain Expertise:** You still need referees to validate Step 3 consensus claims.

  ---

  ### **Why This Works**
  - **Rooted in "On Certainty":** Steps 3-4 operationalize Wittgenstein's "hinge" (P as scaffolding) vs. "idle doubt" (no practical difference).
  - **Anti-Gaming:** Step 2 blocks "convenient hinges." Step 3 requires evidence. Step 4 forces doubt to prove its utility.
  - **Pragmatic:** Focuses on *consequences* (what breaks? what opens up?) not abstract certainty. Your "idle doubt" test is crucial but refined by Steps 2-3.
  - **Time-Efficient:** Requires only analyzing P's role + quick literature check.

  **Final Tip:** When sending decisions, cite the step numbers: *"Per Step 2, P is not functionally necessary; please address the referee's concern per alternatives X/Y."* This depersonalizes conflict and anchors rulings in shared methodology.
