prompt: |-
  I edit a mid-sized journal that publishes across the sciences and philosophy, and about once a month I get a fight that's really the same fight: somebody is refusing to argue for something, and the other side says that's not allowed.

  The referee wants the paper to justify treating a Likert scale as if it were interval, or treating one sample as speaking for a population; the author replies that this is standard background in the field and not what the paper is about. Or a referee rejects a paper for not defending the idea that people's childhood memories are broadly accurate, and the author says no one could be asked to defend that. Or a paper argues that a phenomenon the field has studied for forty years doesn't exist, and the referees won't engage, on the grounds that its existence isn't up for debate.

  I know there's a literature here — On Certainty, hinge propositions, the thought that some things are held fast not because they're certain but because they're not the kind of thing that gets tested — and I'd like to actually use it rather than hand-wave. So write me a procedure I can run on one of these disputes in about twenty minutes, with no philosophy training and no budget to hire a philosopher: the questions in order, what counts as a sufficient answer to each, and where it stops with a yes or a no. It has to be hard to game — I dont want a procedure that lets anyone christen their unargued premise a hinge. My only current test is to ask what would actually change if we dropped the assumption, and if nothing would, call the doubt idle, but I can't tell whether that's a real test or just a way of letting people off the hook.

  Run it on the three disputes above, including whichever one comes out in a way I won't like, and tell me what the procedure can't do.
reasoning: |-
  Okay, the user is an editor of a mid-sized interdisciplinary journal dealing with recurring disputes where authors refuse to defend certain assumptions, while referees demand justification. They're aware of philosophical concepts like hinge propositions from Wittgenstein's "On Certainty" but need a practical, quick procedure to resolve these conflicts without specialized training or resources. 

  The user's core frustration is evident: they're tired of the same cyclical arguments and want a structured way to determine when an assumption can legitimately remain undefended versus when it requires evidence. Their current "idle doubt" test feels insufficient—they worry it might be a loophole rather than a rigorous standard. 

  Hmm, the challenge is designing a procedure that's both philosophically grounded and practically operable by non-experts. It must avoid being gamed—authors shouldn't be able to arbitrarily label their premises as "hinges." The three example disputes (Likert scales, childhood memories, debunking established phenomena) are perfect test cases because they represent distinct conflict types: methodological norms, empirical common sense, and field paradigms. 

  The user's unspoken needs surface here: they likely want to reduce editorial labor (hence the 20-minute limit) while maintaining scholarly rigor. There's also an implied desire for consistency—they want precedents they can apply across disputes. Their skepticism about their own "idle doubt" test suggests they value falsifiability; any procedure must withstand pushback. 

  For the procedure itself, I need to draw from hinge epistemology but operationalize it. Key elements: 
  - Wittgenstein's idea that some propositions are "anchors" enabling doubt itself 
  - Distinguishing hinges from testable empirical claims 
  - Focusing on functional necessity ("what would break if we doubted this?") 
  But crucially, add anti-gaming mechanisms. Perhaps a burden-shifting framework where claiming hinge status triggers specific checks. 

  The four-step design emerges: 
  1. Identify the disputed proposition (forcing specificity) 
  2. Check if it's functionally necessary for the paper's core argument (screening for relevance) 
  3. Test if it's genuinely non-negotiable in the context (preventing "convenient hinges") 
  4. Verify that challenging it would redirect the paper (avoiding scope creep) 

  For anti-gaming: 
  - Step 2's "removal test" must show cascading collapse of the argument, not just inconvenience 
  - Step 3 requires evidence of field consensus or logical inevitability—personal preference isn't enough 
  - Step 4 acts as a reality check: if doubting the premise spawns new research, it's probably not a hinge 

  Applying this to the examples: 
  - Likert scales: Not a hinge. Disputing it doesn't destroy the paper; robustness checks could address it without derailing the core. 
  - Childhood memories: Hinge. Challenging it makes the entire research question nonsensical, and it's bedrock in memory studies. 
  - Debunking established phenomena: Not a hinge. The paper's entire purpose is to challenge it—refusing engagement contradicts scientific ethos. 

  Ah, the user anticipates disliking one outcome—likely the debunking case, where referees might resist. The procedure correctly flags that rejecting the premise is the paper's raison d'être; referees must engage. This exposes the procedure's limit: it can't force referees to accept valid challenges to orthodoxy, only show when their demand is illegitimate. 

  Other limitations: 
  - Can't resolve genuine methodological disagreements (e.g., Bayesian vs. frequentist stats) 
  - Useless for normative conflicts (e.g., ethical assumptions) 
  - Requires honest implementation—bad actors could fake Step 3's consensus 

