  Ok, I've been reading about Gödel and I want you to check my logic before I repeat this to anyone. As I understand it: he proved that in any consistent formal system there are truths the system can't prove, so no machine can capture all mathematical truth — the mind always outruns whatever formal system you build. And a mind that outruns every machine isn't just a machine, so it isn't just the brain, so it survives the body. That's why he believed in God and an afterlife, right? The incompleteness theorems do the work and the theology is the payoff. I remember he said somewhere that his belief was theistic rather than pantheistic, and closer to Leibniz than to Spinoza — I assume that's him dressing up the same argument.

  Second thing, probly related: he left a formal proof of God's existence in his papers. Is that the same argument done properly, or a completely separate strand? Someone also told me that proof has a snag where it ends up making everything necessary — does that sink it?

  Mainly: is the incompleteness-to-immortality move really his, or have I grafted a popular argument onto him? If the move is bad, tell me which step fails and what would have to be true for it to go through. And say which part of your own answer you'd bet against — what consideration would actually change your mind about it.
