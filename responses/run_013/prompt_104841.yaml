  ### Decision Tree: Does Looping Affect the Reality, Validity, or Usefulness of Psychiatric Categories?  
  *Looping: Classifying people changes them, and the changed people change the category.*  

  #### Tree  
  1. **When a classification changes people, is the change limited to their self-conception and behavior, or does it alter the underlying features that make the category apply?**  
     - *Only self-conception/behavior* → **Position (iii)**: Looping is epistemically real but metaphysically idle.  
       *Awkward: The underlying dysfunction remains untouched despite profound personal change.*  
     - *Alters underlying features* → **Q2**.  

  2. **Can the category still track a stable dysfunction after looping?**  
     - *Yes* → **Position (i)**: Looping is noise; reality depends on capturing biological dysfunction.  
       *Awkward: Dysfunction must persist identically despite label-driven changes in symptoms.*  
     - *No* → **Q3**.  

  3. **Is the category defined by a network of mutually reinforcing symptoms?**  
     - *Yes* → **Position (v)**: Looping is constitutive (changes the disorder itself).  
       *Awkward: No "core" dysfunction exists beyond the symptom network.*  
     - *No* → **Q4**.  

  4. **Is looping part of what causally sustains the category?**  
     - *Yes* → **Position (ii) or (iv)**: Looping marks a distinctive kind (Hacking) or is a causal mechanism.  
       *Awkward for (ii): Kinds lack stable essences; for (iv): Reality depends on feedback loops.*  
     - *No* → **Q5**.  

  5. **Is the category primarily a social identity?**  
     - *Yes* → **Position (viii)**: Real as social identity, not disorder.  
       *Awkward: May overlook distress or medical needs of members.*  
     - *No* → **Q6**.  

  6. **Is the category more harmful than beneficial overall?**  
     - *Yes* → **Position (vii)**: Harmful fiction (e.g., Szasz).  
       *Awkward: Dismisses any therapeutic or community benefits.*  
     - *No* → **Position (vi)**: Reality question misplaced; judge by usefulness.  
       *Awkward: Truth becomes secondary to practical outcomes.*  

  ---

  #### Case Outcomes  
  1. **Multiple Personality / Dissociative Identity Disorder** (rise/contraction):  
     - Changes underlying features (Q1→No), can’t track stable dysfunction (Q2→No), not a network (Q3→No), looping sustains it (Q4→Yes) → **(ii)/(iv)**.  
  2. **Pro-Ana Communities** (anorexia as lifestyle):  
     - Changes underlying features (Q1→No), can’t track stable dysfunction (Q2→No), not a network (Q3→No), looping doesn’t sustain *psychiatric category* (Q4→No), not primarily social identity (Q5→No), harmful (Q6→Yes) → **(vii)**.  
  3. **Digital Attention Fragmentation Disorder** (invented, contested):  
     - Changes underlying features (Q1→No), no stable dysfunction (Q2→No), defined by symptom network (Q3→Yes) → **(v)**.  
  4. **Autism Broadening / Neurodiversity**:  
     - Changes underlying features (Q1→No), can’t track stable dysfunction (Q2→No), not a network (Q3→No), looping sustains it (Q4→Yes) → **(ii)/(iv)**.  
  5. **Reclassification of Grief** (as disorder):  
     - Changes underlying features (Q1→No), can’t track stable dysfunction (Q2→No), not a network (Q3→No), looping doesn’t sustain it (Q4→No), not social identity (Q5→No), beneficial overall (Q6→No) → **(vi)**.  

  ---

  #### Unoccupied Paths & Unseparated Leaves  
  - **Unoccupied Path**: The path to **Position (viii)** (social identity) wasn’t taken. This view is *coherent* (e.g., for socially cohesive categories like "hearing voices" movements) but didn’t fit the cases.  
  - **Unseparated Leaves**: **Positions (ii)** and **(iv)** share the same node (Q4→Yes). To split them, ask:  
    *"Does the category have a stable essence?"*  
    - Yes → **(iv)** (looping is a causal mechanism for a stable kind).  
    - No → **(ii)** (looping defines an interactive kind with no fixed essence).
