          * Characterize the set of transformations that satisfy safety. (What conditions on the new actions and payoff function ensure safety? We will show that safety is equivalent to: for each opponent action a_{-i}, the new action set allows the player to achieve at least the max payoff they could achieve in the original game for that a_{-i}.)
          * Then, for improvement: we require that for at least one a_{-i}, the player can achieve strictly more than that max.

          * We will then prove: a transformation is an SPI if and only if it is safe and there exists an a_{-i} such that the new action set yields a payoff strictly above the original max for that a_{-i}.

          * We will then ask: how large is the class of games that admit such an SPI? We will show that any game that is not constant in the player's max payoff (i.e., there is at least one a_{-i} for which the player's max payoff is not already the maximum possible) can be improved? But note: we might be bounded by the payoff function.

          * We will also consider: what if we allow transformations that change the opponents' action sets? We will start with the simpler case.

      - Month 2:
          * Extend the setting to allow transformations that add actions for multiple players. But then we must consider the interaction. This is more complex. We will require safety for every player. 
          * We will define a safe Pareto improvement for all players: a transformation that is safe for every player and for at least one player, it is improving (i.e., there exists an opponent action profile for which that player does strictly better).
          * We will investigate whether there are non-trivial transformations that are SPI for all players simultaneously without any assumptions on play rules.

          * Example: in the Prisoner's Dilemma, can we add actions that make both players better off without assuming rationality? 
            - If we add a new action for both that yields (3,3) regardless of what the other does, then:
                For player 1: 
                   For any a_2, the new action gives at least the max of the original? 
                     If player 2 plays C: original max for player 1 is 5 (by playing D). The new action gives 3, which is less than 5 -> not safe.
            - So we cannot simply add a Pareto dominant outcome.

          * We may need to add actions that condition on the other player's action. For example, a contract: "if you play this new action and I play this new action, then we get (3,3), otherwise we play the original game". But then the safety condition: if player 2 does not play the new action, then player 1 must be able to fall back to the original game and get at least the max for that opponent action. 

          * We will formalize this and see if we can design a transformation that is safe for both players and improving for both.

      - Month 3:
          * Address question (b): do these transformations require inference of play rules? 
            Our results so far show that we can design SPI transformations without any knowledge of the play rules. Therefore, there is no underdetermination: the safety and improvement are guaranteed regardless of the play rule.

          * But what if we want to design a transformation that is tailored to the specific game? We might need to know the payoffs. However, the payoffs are part of the game, not the play rule. So we assume the game is known.

          * Address question (c): uncertainty about play rules. 
            We will consider a setting where the player is uncertain about the play rule of the opponents. The play rule is drawn from a known set. We will ask: can we design a transformation that is safe and improving for every possible play rule in the set? 

            We will show that if the set of play rules is such that it covers all possible opponent action profiles (i.e., for every a_{-i}, there is a play rule that plays that a_{-i}), then the transformation must be safe and improving in the sense of our earlier definition. But if the set is restricted, then we might be able to have transformations that are safe and improving for that set even if they are not for the full set.

          * We will characterize the conditions on the set of play rules that allow for non-trivial SPI.

      - Month 4: 
          * Write up the results and prepare the workshop talk.
          * If time permits, extend to extensive-form games.

   V. Approach and Alternatives

      - Approach: Formal game-theoretic modeling. We define transformations and play rule classes explicitly and prove results about when SPI transformations exist and what properties they have.

      - Why better than alternatives? 
          * Alternative 1: Assume a specific model of play (e.g., Nash equilibrium) and design SPI for that model. But then the safety is conditional on the model being correct. We want unconditional safety.
          * Alternative 2: Empirical approach: learn the play rule from data and then design an SPI. But then safety is not guaranteed.
          * Our approach is more robust: we do not assume any model of play.

   VI. Results and Failure

      - Expected result: 
          * We will show that non-trivial SPI transformations exist without any assumptions on play rules, but they are more limited than those that assume rationality. In particular, they require that the player can unilaterally force an improvement in some contingency without relying on the opponent to change their behavior in a specific way.
          * We will characterize the class of SPI transformations that are robust to arbitrary play rules.
          * We will show that under uncertainty about play rules, the designer can still achieve SPI if the set of possible play rules is known and satisfies certain coverage conditions.

      - Failure: 
          * If it turns out that the only SPI transformations that are robust to arbitrary play are trivial (e.g., only in games that are trivial to improve), then we have a collapse result. This would be a negative result but still valuable.
          * If the formalization becomes intractable, we might not be able to get clean characterizations. Then we would present examples and counterexamples.

   VII. Why Worth Doing?
      - This addresses a foundational question in cooperative game theory and AI safety: can we achieve cooperation gains without assuming rationality? 
      - It clarifies the boundaries of what is possible with robust cooperation mechanisms.
      - It might lead to new mechanisms that are robust to adversarial or irrational opponents.

   VIII. What Would Change My Mind?
      - If it turns out that the very definition of SPI in the literature always assumes that the opponents' action sets are fixed and that the transformation does not change the game in a way that introduces new opponent actions, then our setting is the same as the standard one. But in that case, we see that the existing SPI constructions (like commitment) do not qualify as SPI by the definition because they do not create a new opponent action profile that yields a strict improvement. That would mean that the only SPI transformations that exist are the ones that add dominant strategies or at least improve the player's best response in some contingency without relying on the opponent's response. This would be a collapse to a limited class of improvements.

      - The reasoning is most likely to break in the definition of the transformed game, especially when we allow extensive-form transformations. We might need to restrict to normal-form games to get clear results.

  Let's write the proposal accordingly.
answer: |-
  ### Research Proposal: Robust Safe Pareto Improvements Beyond Modeling Assumptions

  **Title:** Structural Foundations of Safe Pareto Improvements: Robustness to Unmodeled Play Rules

  **Research Question:**  
  Can non-trivial safe Pareto improvements (SPIs) exist without relying on assumptions about opponents’ play rules, and if so, what structural conditions enable them? Specifically:  
  (a) As the class of permissible play rules expands to include arbitrary behavior, do non-trivial SPIs collapse to trivial changes (e.g., adding unused actions)?  
  (b) If non-trivial SPIs survive, does their implementation reintroduce underdetermination by requiring inference of play rules?  
  (c) How does mutual uncertainty about play rules affect the feasibility and robustness of SPIs?  

  **Why Existing Literature Leaves This Open:**  
  Current SPI frameworks (e.g., in program equilibrium, commitment races, or cooperative inverse reinforcement learning) derive safety from contested assumptions: common knowledge of rationality, commitment adherence, or isomorphic play. These are *models* of behavior—not structural features of the game. Consequently, safety guarantees dissolve when opponents deviate from these models (e.g., irrationality, broken commitments). Prior work assumes these constraints *a priori* but never systematically tests their necessity or explores SPIs that hold across *all possible play rules*.  

  **Approach:**  
  Leverage formal game theory to isolate SPIs from play-rule assumptions. Define SPIs structurally:  
  - **Safety:** For all players, all opponent action profiles, and *all possible play rules*, the SPI guarantees at least the original max payoff.  
  - **Improvement:** There exists at least one opponent action profile where a player strictly exceeds their original max payoff.  

  Use minimalistic normal-form games to:  
  1. Characterize SPI transformations (e.g., adding actions, pre-play communication).  
  2. Vary the class of play rules (from rational to arbitrary).  
  3. Introduce uncertainty via probabilistic play-rule ensembles.  

  **Why This Approach Beats Alternatives:**  
  - *Alternative 1: Assume specific play rules (e.g., Nash agents).* Yields stronger SPI constructions but inherits their fragility. Our approach prioritizes robustness.  
  - *Alternative 2: Empirical play-rule inference.* Introduces underdetermination; we avoid inference entirely by focusing on structural verifiability.  
  - *Alternative 3: Algorithmic game theory.* Often assumes computational constraints; we strip back to information-theoretic foundations.  

  **Methodology & Timeline (4 Months):**  
  - **Month 1:** Formalize SPI robustness. Define a baseline SPI transformation space (e.g., action-set expansions, cheap-talk extensions). Prove which SPIs hold for *all* deterministic play rules in small games (e.g., 2×2 Prisoner’s Dilemma, Stag Hunt).  
  - **Month 2:** Test for collapse. Characterize SPI prevalence as play rules expand to stochastic/arbitrary classes. Identify necessary conditions for non-trivial SPIs (e.g., existence of "improvement-contingent" actions).  
  - **Month 3:** Address uncertainty. Model players with known uncertainty sets over opponents’ play rules. Determine if SPIs can be safe/improving across these sets without inference.  
  - **Month 4:** Consolidate results. If proofs generalize, extend to sequential games; otherwise, refine counterexamples. Draft paper with explicit definitions, theorems, and game matrices.  

  **Expected Results & Failure Modes:**  
  - **Success:**  
    - A characterization theorem showing non-trivial SPIs exist iff games have "action-response asymmetry" (e.g., a player can unilaterally access higher payoffs in *some* contingency without relying on opponent adaptation).  
    - Proof that uncertainty about play rules *expands* feasible SPIs by relaxing improvement thresholds (e.g., expected gains suffice).  
  - **Failure:**  
    - Collapse to triviality: Only actions strictly dominating existing choices or irrelevant relabelings survive.  
    - Underdetermination resurfaces: Non-trivial SPIs require play-rule inference, making "safety" model-relative.  
    - Technical infeasibility: No clean characterization emerges for arbitrary play rules.  

  **Why This Matters:**  
  - **For game theory:** Challenges the field’s reliance on rationality assumptions for cooperation. Probes whether "safe cooperation" is possible with adversaries or aliens.  
  - **For AI safety:** Offers mechanisms for robust cooperation without inferring preferences or trust. If SPIs require no play-rule assumptions, they could be deployed in high-stakes, adversarial settings.  
  - **For rationalist communities:** Resolves a foundational tension in "cooperation without copies" arguments by decoupling SPI guarantees from contested cognitive models.  

  **What Would Change My Mind:**  
  The framing breaks if:  
  1. **Safety cannot be defined structurally.** If all SPI implementations *must* reference a play-rule model (e.g., "safety given Nash opponents"), the project reduces to reclassifying assumptions. Likely breakpoint: Extensive-form games where information sets force beliefs about play.  
  2. **Improvement implies triviality.** If non-trivial SPIs *require* play-rule restrictions (e.g., "no adversarial play"), collapse is inevitable. This would surface in small-game counterexamples (e.g., SPI fails if opponents minimize your payoff).  
  3. **Verifiable commitments are impossible.** If ex post verification of SPI adherence demands preference/play-rule knowledge (e.g., inferring why a player deviated), safety reverts to model-dependence.  

  ---  
  *This proposal intentionally omits bibliography; key citations (e.g., Tennenholtz on program equilibrium, Oesterheld on SPI in MDPs) will be added post-feedback. The core novelty is robustness to arbitrary play—a gap in all cited work.*
