  1. **Unfalsifiability Risk**: If any persistent regularity is labeled a convention, the theory might not be testable. The user is worried about this, so it's a top concern. How to address it? Lewis's original conditions (coordination problem, alternatives) set boundaries. Without them, any habit could be a convention. The defender might need to concede that some constraints are necessary to avoid vacuity.

