  7. **Cognitive Requirements**: Can reinforcement and imitation work without any beliefs? Learning theory shows that reinforcement can shape behavior without explicit beliefs, but in humans, even implicit expectations might form. However, if studies show people conform without any expectation of others (e.g., blind imitation), that supports the user. But if expectations are always present, even implicitly, the user's stronger claim (no beliefs at all) might be challenged.

